      <p>I'm not sure a wittier text and a better crafted letter would have made it better art though.<br>
      On John Cales and Lou Reeds celebration, of sorts, to Andy Warhol, <em>Songs for Drella</em> there's a line (I'm assuming it's a Warhol quote) in the song <em>Images</em>: "If you think technique is meaning, you might find me very simple".<br>
      And juxtapositioning may well be a classic surrealist cliché, but this kind of decontextualization is also something we see in post modern art and design. Peter Savilles work for New Order (case in point, the  <a class="freelinking external" href="http://en.wikipedia.org/wiki/Republic_(album)" rel="nofollow">Republic</a> stuff ) comes to mind when I see this particular piece by Ruscha.</p>
