    html: |-
      <p>Pay nothing until April.<br>
      It's cool that he made his own font.<br>
      But the typeface, layout and text are underwhelming.</p>
      <p>Compare with this satirical gem by the bard of specimen writers, Thomas Mackellar:</p>
      <blockquote><p>Driftsnow, Banker<br>
      Capital Invested in Ice Houses<br>
      Good for Sudden Runs</p></blockquote>
      <p>(MacKellar, Smiths &amp; Jordan, 1868)</p>
      <p>That mocks commerce too, but is written with wit, skill and originality.</p>
      <p>A poster by Peter Ewart (probably 1940s) combining beautiful lettering with a mountain view and a graphic illustration:</p><div class="imageWrap"><img src="http://typophile.com/files/sk15_4174.jpg"></div><p></p>
      <p>Ruscha's work employs the surrealist cliché of combining words and text that have nothing to do with one another.<br>
      The layout concept, of running a big centred title over a picture, is common in book covers, e.g. —</p><div class="imageWrap"><img src="http://typophile.com/files/oryx_and_crake_1_6674.large.jpg"></div><br>
      By John Gall<p></p>
