    <div class="info">Submitted by <a href="/user/1160" title="View user profile.">Joe Pemberton</a> : 16.Oct.2007 12.00pm </div>
      <h2><a href="http://www.punchcut.com">Punchcut</a> presents<br>
    <strong>Typophile Film Fest 4, San Francisco</strong><br>
    at the Swedish American Hall</h2>
    <p><img src="http://farm3.static.flickr.com/2052/1528997180_6945ddab10_o.jpg" border="0"></p>
    <p>Punchcut's screening of the Typophile Film Festival 4 is best described as a three-hour party centered around a rare and unequaled selection of short typographic films. Hailing from Portugal, The Netherlands, Austria, Canada and the US, the films create a visual mashup of motion design, typographic animation and short stories. It includes broadcast motion design, documentaries and typographic eye candy from Trollbäck + Company, Strange Attractors, Heebok Lee, Nick Shinn, Juan Leguizamon as well as exclusive interviews and cuts from the acclaimed documentary film Helvetica. Thanks to <a href="http://www.fontshop.com">FontShop</a> for helping make this presentation possible.</p>
    <p>After the films, we'll keep the food, drinks and music going until the Swedish American Hall kicks us out.</p>
    <p>Doors: 8 - 11pm<br>
    Screening: 8:30 - 9:30pm<br>
    Date: Thursday, October 25</p>
    <p>The Swedish American Hall<br>
    2170 Market Street<br>
    San Francisco, CA 94114</p>
    <p>The Swedish American Hall, upstairs from Café Du Nord, is located on the north side of Market Street, between Church Street and Sanchez Street. It is easily accessible by the F-Line bus stop at the corner of Sanchez and Market or the Muni N, M, L and J lines at the Church Street Station.</p>
    <p>Admission: $12</p>
    <p><strong><a href="http://typophile.bigcartel.com/product/typophile-film-fest-4-san-francisco">Reserve tickets now!</a></strong></p>
    <p>We expect a full house. Please reserve tickets early.</p>
