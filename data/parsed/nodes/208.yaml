    html: <p>Ok. so maybe The type is just not letterspaced enough. I just played with Anisette, some would say a geometric face, and it seemed perfectly content on the curve, but I had to letterspace is enough, not groteskly, just enough. So that is another font I suggest, Anisette by JFP (<a href="http://typofonderie.com" target="_blank">http://typofonderie.com</a>) I was trying to make you a sample when my illustrator bit the dust for the millionth time today.  <br> <br>Maybe I'm wrong, I just don't feel like your type has any passion or emotion or humor. Sorry. </p>
