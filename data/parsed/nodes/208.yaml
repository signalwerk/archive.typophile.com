    html: <p>Thanks for your comments... I was hoping this would be an ongoing critique and I could take your comments and my own intentions and work towards a better solution, but... since I was sub-contracted for this job, I have no say or direct contact with the client and I have been told they decided to go with a very literal translation of the owner's drawings... Which are crap... Oh well. <br> <br>As I mentioned, this is for a store on Mill Ave. in Tempe, AZ.. a busy old-style downtown type of atmosphere... I agree it definately needs an illustrative touch... Hopefully someone gives them a clue before it's too late.</p>
