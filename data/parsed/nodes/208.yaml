    html: <p>Depth of field issue. What if the top scoop was larger that the bottom giving the impression of the icecream cone coming toward the viewer? "Desserts Lounge" seems too large, a little bit anyway. That word, hum, how about just "Dessert Lounge"? That typeface isn't having much fun on the round. What about something a little looser? LetterError's Kosmik? or Cafeteria from Font Bureau? The asterisks seem too decorative to be acting like bullets, maybe? The large stroke around the centermost red circle seems too thick. All in all, however, a fun and simple solution. -- and the colors seem appropriate given the name. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> </p>
