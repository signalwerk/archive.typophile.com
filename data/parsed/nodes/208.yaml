  html: <p>Yes, we are suggesting some new names for this italian ice lounge to be located on Mill Avenue in Arizona... But any comments on this first iteration of the logo? It's based off the client's drawings.. I'm definately going to tighten up the type and maybe add some more flourishes, but any comments on the general color and feel? <br> <br>Thanks in advance.<img src="http://www.typophile.com/forums/messages/29/11044.gif" alt="gelateria"></p>
