    date_raw: 4 Jun 2003 — 4:49am
    votes: null
    html: <p>This seems too slick for my taste. Not  <br>knowing the answers to Hrants questions, but I'd think a more "old world" look would be  <br>appropriate (it can still have broad appeal). This really looks like it was drawn on a  <br>computer, where as the feeling I'm wanting to see has a human touch. The cone more  <br>illustrative. The type a little looser, maybe a serif with a swash cap and alternate ending (poetica?).  <br>Better yet. Draw up some letters. Or if you're not ready for that yet, print some out and trace  <br>over them. Then hand set it around the circle. Anything to make it more human. Also, take a  <br>look at the dashes around the edge. Replace it with something more interesting. Loops or  <br>floral or something.  <br> <br>IMHO, too much love goes into gelatto to be represented be a mechanical logo. <br> <br>Good luck, <br>Randy</p>
