  - id: 30082
    user: 2575
    date: 2004-04-07T09:13:00
    date_raw: 7 Apr 2004 — 9:13am
    votes: null
    html: "<p>There are still quite a few people printing lettrpress in a private press environmnet. A great many of them doing very good work. As Hrant has stated: some doing awful work by over-impressing, and some doing the same by attempting to kiss-impress and under-ink. <br> <br>I am not aware of anyone successfully offering letterpress commercially in Canada, other than in the capacity of numbering and perfing. <br> <br>I occasionally conduct workshops in letterpress and in typecutting. The workshop I instructed at the ATypi conference in Vancouver last Fall had only one attendee . . .  from Australia. <br> <br>I am instructing a Chicago man for a few days at my workshop in May in punch and matrix cutting. <br> <br>Yesterday a man from Washington state called me and we talked at length about a book he is having letterpressed at Steinhour Press using polymer plates. The book is a good size; around 100 pages. He was looking for a type that looked like it had letterpess roots, and was considering Lanston Type Co.'s Metropolitan. (Since Metropolitan was had digitized directly from the Lanston patterns, I felt that it was as good a choice as any).  <br> <br>I am in the midst of a personal project: the limited edition printing of The Adventures of Tom Sawyer. I've cut a new metal type for the book. I am anticipating making about 100 or so copies. <br> <br>In my part of the world there are two very fine letterpress printers: Barbarian Press and Heavenly Monkey Press, both very active. <br> <br>Jim Rimmer <br> <br>   <br> <br></p>"
