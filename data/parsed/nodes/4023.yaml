    html: "<p>You're referring to a more tactile look in a final produced piece of artwork . . . <br> <br>One trick is to adjust the level of contrast of the text over its surface so instead of 100% black over 100% white, try 95% Dark Brown over 90% Ivory. <br> <br>Another trick is selecting fonts that already have a printed look to them, one comes to mind by Mark Simonson is here: <a href=\"http://www.ms-studio.com/FontSales/metallophilesp8.html\" target=\"_blank\">http://www.ms-studio.com/FontSales/metallophilesp8.html</a> <br> <br>Stuart :D</p>"
