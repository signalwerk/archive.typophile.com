    html: "<p>Instead of 100% black for type, how about a mixture of 50/50/50/50 (that's a guess). That could screw up hairlines on serif type, even without mis-registration.  <br> <br>You could combine this technique with \"graded\" fonts such as Poynter Oldstyle (from the Bureau), one version in 100% black on one layer, another, heavier version in 50/50/50/0 on a back layer. <br> <br>I've designed several faces that incorporate stylized distress that mimics the effect of letterpress type -- Brown, Paradigm, Worldwide, Walburn. (All on view at shinntype.com.) <br> <br>There is a difference between stylized distress and raw, random distress: classic in this genre is Poliphilus. More recently Founder's Caslon. <br> <br>And finally, why not use real letterpress?</p>"
