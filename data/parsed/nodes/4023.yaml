  html: <p>Does anyone have any tips on how you can make type (the finished product that is) look more soft/natural/3D and less harsh/digital/2D? I think most of what I'm getting at is the difference between old books and new ones. I've had some limited success by printing, scanning, and reprinting, but you can only do that so much. Maybe there's certain kinds of paper that bleed slightly? <br> <br>Sorry if this isn't a very clear question... it's hard to describe what I have in mind. I just don't always like the ultra-crisp way type looks laser-printed on white paper.</p>
