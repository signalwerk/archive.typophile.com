    html: <p>Physical things like letterpress get obsolete much, much slower than something like a font format! :-) More than <i>use</i>, however, most people who use letterpress these days are in fact <i>abusing</i> it. They use its tactile quality as a reactionary escapism from the coldness of the digital world. Valid feelings, but spawning invalid expressions. If this all sounds obscure (it would have to me about 1.5 years ago), it just means you have to get to know letterpress first-hand, and see the contemporary conflict between sensationalism versus substance evolving. It causes things like Tiffany &amp; Co. to commission a letterpess-looking version of their logotype for friggin' $10,000 (never mind that it will generally be applied with foil stamping). How do I loathe thee - let me count the ways... <br> <br>hhp <br></p>
