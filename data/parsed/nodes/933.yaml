    html: <p>&gt; any edits to a post would be duly noted for all to see, although not emailed out. <br> <br>But the point is that if it's not mailed out, anybody on email delivery (and isn't that most people?) won't see the edit unless he goes to the thread. And he would only really do that if he's going to post something, and even then is unlikely to notice it. <br> <br>But making the edited text look different would be a luxury. <br> <br>-- <br> <br>Unless people can at least be made aware of an edit via email, I think editing should be disabled. But leave Deletion available, so the person can just replace the post wholesale, and everybody would see it. <br> <br>hhp <br></p>
