      <p>I used an HP DeskJet 1220c/PS for years, and it was great — worked out of the box with near contract proof colour accuracy via the Adobe PressReady software. PressReady was discontinued a few years ago so I started looking for other options and settled on a DesignJet 10PS (with HP’s RIP rather than the EFI one). I bought it from eBay so it arrived without software — not normally a problem in these days of online driver downloads and updates. Oh dear. HP’s support site is a horrific rabbit warren of out-of-date information and the software itself, when I finally managed to get hold of it, is utterly half-assed. See my comments <a href="https://h41186.www4.hp.com/country/uk/en/forums/tree_display.html?forum_id=1&amp;posting_id=54997&amp;pageseq=328026">here</a>.</p>
      <p>The big plus side of the DesignJet range is that they use dye-based inks rather than pigments like Epson. This allows a larger colour gamut and reduces problems like bronzing and metamerism. The big downside is that on papers other than HP’s own very expensive and hard-to-find range, dye-based ink fades pretty quickly. With the new Epsons, you can print on pretty much anything and get a near-archival lifespan, and there are loads of third party papers available that are nicer and cheaper than Epson’s own range. The bronzing and metamerism problems that Epsons were known for have now been pretty much solved with the new Stylus 2400, apparently, so even though I don’t have personal experience of that model, based on my experience with HP I’d recommend the Epson. Prepress houses agree, at least in the UK — most guys I speak to now actually call digital colour proofs ’Epsons’!</p>
      <p>There’s a review of the 2400 <a href="http://www.creativepro.com/story/review/23514.html">here</a>, which points up another advantage: great black-and-white prints. B/w prints from my HP come out green, calibration or no. </p>
      <p>R</p>
