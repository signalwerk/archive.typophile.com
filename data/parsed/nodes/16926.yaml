      <p>I hate Epson printers - have had two and always problems with streaking, spotting, jamming. They are extremely temperamental machines and it is also virtually impossible to abort a print job without rebooting the printer and your computer - altho this is easier now. I know a lot of photogs who swear by them but mine have both been lemons. Next one I buy will be some other brand.</p>
