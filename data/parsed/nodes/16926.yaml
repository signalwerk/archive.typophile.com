      <p>I’ve been using the HP Designjet and Epson for years. Personally, I favor the HPs, particularly with regards to color accuracy. Most service bureaus I’ve worked with also favor Designjet for proofing so, when my agency brought prepress in-house, we decided to go with Designjet as well. We really couldn’t be happier. Just be certain to purchase the EFI Designer Edition RIP, rather than the HP solution.</p>
      <p>Oftentimes, people will say they favor Epson because of all the papers available. I think this argument is moot these days, as the Designjet can self-calibrate to any paper. It’s my personal opinion that most Epson advocates have not used a Designjet – at least not lately.</p>
      <p>As far as duplexing goes, good luck. No large-format I’ve used is good for duplexing. You will be stuck feeding paper through twice.</p>
