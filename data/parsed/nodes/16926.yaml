      <p>My perspective on evaluating these printers is different, because I’m actually writing the software to drive them myself, rather than using what’s provided by the manufacturer. But in a comparison between the Epson R2400 and the HP 10, there simply is no comparison. The latter uses only four inks, of which the black is 18 picoliters (a huge drop size by today’s standards). That’s why your grays come out greenish - they’re printed almost entirely with CMY ink, where on the Epson they’d be primarily “light black”.</p>
      <p>Also, the mechanical accuracy of the 10 series (I had a 110nr) is nowhere near that of the Epson. For type work, I’m absolutely in love with the 1440x1440 mode of the Epson, and, while I was initially skeptical that it was really hitting that accuracy, I’m now convinced. By contrast, the HP has visible imprecisions even at 1200x600.</p>
      <p>Early Epson pigment inks did indeed have problems with gamut, bronzing, and metamerism. But the latest generation is very good indeed. Bronzing can be a problem, but choosing the right paper helps a lot. As for gamut, I found the CMY inks on the 110 somewhat watery, making rich red-browns and midnight blues hard to attain.</p>
      <p>Metamerism is a trickier question, and I really wouldn’t want to make definitive pronouncements without doing spectrophotometer measurements, but the greenish cast on the 10 series may also have something to do with that. Try viewing the prints in different light (flourescent, incandescent) and see if the cast stays the same. I know the earlier Epson dye printers (I had a 1270) had really bad metamerism, so pigment is not always superior to dye.</p>
      <p>If you do go for the HP, get the 30 series, which is six color and has a reasonably good black dot size - that’ll improve text rendering considerably, at the very least.</p>
      <p>In any case, enjoy! The quality of sub-$1k inkjets today is absolutely incredible, compared even to high-end pro models from a few years ago. I’m sure that whatever you end up with will suit your needs.</p>
