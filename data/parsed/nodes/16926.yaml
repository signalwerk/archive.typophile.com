    html: <p>I have an old Epson 3000. The heads are outdated, and have some problems, but with a third party RIP I get good results. What I would highly suggest is getting something that will print on banner paper. Mine is 17” wide but I can go up to 44” in length, which fits large page spreads and box flats etc. It can save money over time to not use a whole sheet but only as many inches as needed. Look at ink costs over time as well, I’m sure you know. From what I hear HP has the better options, but the RIP is very important, and the support for it. Read reviews of the various softwares, and choose the one that is most stable and/or the one that has the best third-party RIP.</p>
