    html: <p>I think a major issue that a lot of people don’t bring up when discussing HP and Epson large format printers is how the paper is fed through the machine. Epson’s tend to be top loading and when sending large amounts of paper through, jamming is an issue. Also does it make logical sense for a 13x19 format printer to load from the top? I never understand the logic in that construction. You actually have to hold the paper as it prints sometimes to assure your image prints properly.</p>
