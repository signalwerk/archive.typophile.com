      <p>Raph, really interesting comments. To clarify, the HP I’m talking about is the 10PS, same series as the 30 — so six inks. The greenish cast in six-colour greyscale prints is, I think, primarily a calibration issue. This printer — along with the 20, 30 and 50 — has a little built-in scanning head which, as well as dealing with printhead alignment, is supposed to perform a closed-loop calibration for whatever paper type you want to calibrate for. Suffice to say it doesn’t work and, in fact, usually seems to make things worse. Although that could be a fault in my unit, rather than a ’feature’.</p>
      <p>But your comments reinforce what I thought already: ditch the HP and save for an R2400.</p>
      <p>R</p>
