    html: |-
      <p>That's because nothing is preventing the substitutions to take place. The function of the "ignore" statement is to filter out cases in which you don't want the substitution(s) that follow(s) to take place. If the "ignore" statement finds a match, the rest of the lookup is ignored. If the "ignore" statement doesn't find a match, then the rest of the lookup is executed and the substitutions take place.</p>
      <p>Part of the trick to writing features like this is to figure out exactly what you want to filter out and only what you want to filter out. From what I can see, you're filtering out cases in which @ALL precedes or follows @letter1, @letter2, or @letter3. Not knowing what's in these classes makes it impossible to tell exactly what's going on.</p>
