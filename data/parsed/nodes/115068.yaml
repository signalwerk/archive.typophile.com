    user: 1043
    date: 2014-03-20T12:43:00
    date_raw: 20 Mar 2014 — 12:43pm
    votes: null
    html: |-
      <p>A couple things:</p>
      <p>It's not possible to test for the start or end of a line of text in OpenType, which means there's no way to automatically get want you want.</p>
      <p>Since you have several glyphs in your @letterx classes that are not represented in your @start_swsh class, it would probably be better to keep the starting and ending classes separate, not just the the swash starting and ending glyphs, also the ones you're matching. Like this:</p>
      <p>nonstart_letter1 [a e o s v w]<br>
      nonstart_letter2 [a.1 e.1 o.1 s.1 v.1 w.1]<br>
      nonstart_letter3 [a.2 e.2 o.2 s.2 v.2 w.2]<br>
      start_swsh [a.swsh2 e.swsh2 o.swsh3 s.swsh1 v.swsh3 w.swsh2]</p>
      <p>nonend_letter1 [a c e i o r s t u v w]<br>
      nonend_letter2 [a.1 c.1 e.1 i.1 o.1 r.1 s.1 t.1 u.2 v.1 w.1]<br>
      nonend_letter3 [a.2 c.2 e.2 i.2 o.2 r.2 s.2 t.2 u.2 v.2 w.2]<br>
      end_swsh [a.swsh1 c.swsh2 e.swsh1 i.swsh1 o.swsh2 r.swsh1 s.swsh2 t.swsh1 u.swsh2 v.swsh2 w.swsh3]</p>
      <p>This way, you avoid the probably unexpected effect of some of your swash variants getting converted to plain letters when cswh is invoked.</p>
      <p>Finally, in your @ALL class, I would only include characters that are expected to be used in words, unless you think it would be good to have starting and ending swashes on passwords or other random strings.</p>
