    html: |-
      <div class="comment-spam-body"><p>"It's not possible to test for the start or end of a line of text in OpenType"<br>
      Thats true, but you can substitute first letter in the line:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/02_3837.jpg"></div><br>
      In the font I made the glyphs .init (these upside down)<br>
      languagesystem latn dflt;<br>
      languagesystem DFLT dflt;<br>
      @all=[a-z A-Z ];<br>
      @all.init=[a.init-z.init A.init-Z.init ];<br>
      @all.i.sp=[a-z A-Z a.init-z.init A.init-Z.init space period comma ];<p></p>
      <p>lookup calt1 {<br>
      sub @all' by @all.init ;<br>
      } calt1;</p>
      <p>lookup calt2 {<br>
      sub @all.i.sp @all.init' by @all ;<br>
      } calt2;</p>
      <p>feature calt {<br>
      lookup calt1;<br>
      lookup calt2;<br>
      } calt;</p>
      </div>
