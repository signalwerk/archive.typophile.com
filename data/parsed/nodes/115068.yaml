    <p>Hi there,</p>
    <p>I've created a font that has 3 character variations using calt (which works fine) and includes a set of 3 swash variations per character as well. The issue I'm having is I also want to include start and end swashes for select letters (a, e, i, o, r). I set up my code as such and it works perfectly fine in FontLab when I test it but when I try in Illustrator, only the start_swsh works. The end of the word remains normal. </p>
    <p>feature swsh {<br>
    ignore sub @ALL @letter1' @ALL;<br>
    ignore sub @ALL @letter2' @ALL;<br>
    ignore sub @ALL @letter3' @ALL;<br>
    sub @letter1' @ALL by @start_swsh;<br>
    sub @letter2' @ALL by @start_swsh;<br>
    sub @letter3' @ALL by @start_swsh;<br>
    sub @ALL @letter1' by @end_swsh1;<br>
    sub @ALL @letter2' by @end_swsh1;<br>
    sub @ALL @letter3' by @end_swsh1;<br>
    sub @swsh1' by @swsh2;<br>
    } swsh;</p>
    <p>I've been reading a lot of forums about it, and have seen people say you need to have different lookups for the start and the end, but I don't understand the code (when I type in  'lookup ____' I don't know if I'm suppose to have _____ somewhere else that it's looking up, or how that works, and the FontLab manual doesn't go into detail about this.)</p>
    <p>I'm at my wits end with this, any help would be greatly appreciated.</p>
