    html: <p>I strongly suspect a custom (most likely 'homemade') font made from the user's own printing. Such fonts are so easy and cheap to make that this hand-printed style is often a waste of time to locate. I have collected many hundreds of fonts like this in Part 11 of the <a href="http://bowfinprintworks.com/Script11Pg1.html" target="_blank">Script Font ID Guide</a>, but I don't recall this being one of them.</p>
