    votes: null
    html: <p>However, I did some checking after posting that reply, since you had a name for the file. Guess what? There is a hand-printed font called Newton. It was on a freeware site that I found with <a href="http://www.fontseek.com" target="_blank">Fontseek</a>. The font file only names Fontographer, so I have no idea whose work this is, or even whether it is the true name of the font, so user beware. <br> <br>I guess I have a new addition for my Guide.</p>
