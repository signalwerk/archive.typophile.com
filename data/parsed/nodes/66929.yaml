    <p>Hi,</p>
    <p>I am a graphic design student and have just started writing a thesis for my Bachelor Degree, about film title design and its relationship to film, and about the effects of the title design on the audience and their perception of a film. I was just wondering if anyone hade any tips on authors or books on this subject? Or maybe you have any other suggestions as to where I might find valuable information?</p>
    <p>Thanks,</p>
    <p>Lisa</p>
    <p>ps. hope I have posted this in the right place - I'm new here, so sorry if not.</p>
