      <p>You can find it as <strong><a class="freelinking external" href="http://www.myfonts.com/fonts/intellecta/pretoria-gross/" rel="nofollow">Pretoria Gross</a></strong> by Intellecta Design<br>
      or as <strong>Vivian</strong> or <strong>VivianFlourish</strong> digitized by Dieter Steffmann (Typographer Mediengestaltung)</p>
      <p>There was also a <strong>Pretoria</strong> version by Adobe but it's probably not available anymore.</p>
      <p>-----------------------------------------------<br>
