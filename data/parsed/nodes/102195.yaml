    <p>Hello,</p>
    <p>Few years ago i stumble upon some font on old poster, when i tried to find it, via various sites, nothing pop-up... then i thought, probably is old and it wasn't renewed and/or remaked.<br>
    But recently i encountered on it again, with slight changes, and most important on a new design, which means - it's still in use, and it exists. Tryed again with  "what is this font" sites, nothing again...</p>
    <p>Then i decided that i need your help!<br>
    This is the font.</p>
