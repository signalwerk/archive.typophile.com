      <p>THANKS for the replay</p>
      <p>After more research I have decided focus on typography in era of modernism and postmodernism. This will allow me to examine and compare two different typographic styles which came one after the other. I want to question the ideologies of modernist (Emil Ruder) consisting that of a formalist, rationalist nature to that of a Postmodernist (Wolfgan Weingart) more expressive, subjective and experimental nature through a series of methods but also question how they could work in today’s extremely multicultural society. Questioning graphic design of certain times and trying to get a better understanding of the ideologies and what affected them. I planned to do this in a number of ways to gain a more intense knowledge of design history. So I can come to acknowledge the deeper messages of their work rather than just visual inspiration. So I really feel the need to study their reasoning in much more detail.</p>
      <p>thanks for all your comments</p>
