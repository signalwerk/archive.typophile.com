    <p>Hi Im student and recently working on my project proposal.<br>
    I am strongly interested in typography, there are endless limits to what you can do. My chosen filed of study will mainly focus on Experimental/Expressive Typography and I would like to explore this topic more further. The purpose of this project is to investigate the idea of legibility, readability, style, movement and how type can be taken beyond its basic and what Experimental Typography really means. The word "experiment" oxford dictionary define as a scientific procedure undertaken to make a discovery, demonstrate a known fact or a course of action tentatively adopted without being sure of the outcome. In this context, an experiment is a test of idea; set of actions to prove or disprove an idea. In a graphic design and typography, experiment as a noun has been used to signify anything new, unconventional, defying easy categorization, or confounding expectations. This is something what I wish to explore within this project.<br>
    Could you give me some advice or how I could possible narrow this down??<br>
    THANX</p>
