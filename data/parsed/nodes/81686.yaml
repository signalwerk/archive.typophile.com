      <p>I would ask you what you consider a historic example of "Experimental" typography just so I can understand where you are coming from personally.  Oxford is of no help in this since people other  than true scientists view the word experimental in many ways that be be untestable.</p>
      <p>"...purpose of this project is to investigate the idea of legibility, readability, style, movement and how type can be taken beyond its basic and what Experimental Typography really means."</p>
      <p>This is a huge broad area and I would confine it to something you can write in your lifetime let alone when the assignment is due. :-)</p>
      <p>Legibility/readability opens a HUGE can of worms which cannot be done in time for your project.  These things border on science or at least soft-science and require knowledge that you probably don't have.</p>
      <p>I would first decide if you are going to talk about experimental type design or experimental type usage.  Pick one that will be doable for you.  My guess is that type usage would be less daunting.</p>
      <p>Next, pick a practitioner or 2 who has work that shows what you are talking about.  You may also choose a style or school of work to focus on. Examples might be DaDa or Constructivists or more current things like Grunge. Mostly, pick what really interests YOU. Yo may choose to contrast say the experimental work of Emil Ruder with his student Weingart for how one persons ideas were transferred and changed by another.  Or else you might contrast the older DaDa work with Grunge or some other thing that you have an interest in.  You might also look at painterly done lettering by early 20th French painters with Bauhaus lettering from the same time period. Perhaps compare Lautrec to El Lizzitsky or just one Moula Rouge poster to a Weimar 1923 poster?<br>
      Basically, find some examples of work online that shows what you mean and either attempt to research it or compare 2 styles of experimentation.  You won't have time for more than that.</p>
