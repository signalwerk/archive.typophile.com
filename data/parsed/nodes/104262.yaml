    date: 2013-07-07T09:00:00
    date_raw: 7 Jul 2013 — 9:00am
    votes: null
    html: |-
      <p>For someone that can program, there is <a href="http://www.gnu.org/software/barcode/" rel="nofollow">GNU Barcode</a>; to compile the sources on my mac, I had to comment out the line <code>int streaming;</code> in the file <code>barcode.h</code> and then add the line <code>int streaming;</code> (say just after <code>#include barcode.h</code>) in the files <code>main.c</code> and <code>sample.c</code> as well as the line <code>extern int streaming;</code> in the file <code>pcl.c</code>; then executing <code>./configure</code> and <code>make</code> gives the binaries.</p>
      <p>Here is the output of <code>barcode -h</code></p>
      <pre>GNU barcode 0.99 is a tool to convert text strings to printed bars.

      barcode: Options:
         -i      input file (strings to encode), default is stdin
         -o      output file, default is stdout
         -b      string to encode (use input file if missing)
         -e      encoding type (default is best fit for first string)
         -u      unit ("mm", "in", ...) used to decode -g, -t, -p
         -g      geometry on the page: [x][++]
         -t      table geometry: x[++]
         -m      internal margin for each item in a table: [,]
         -n           "numeric": avoid printing text along with the bars
         -c           no Checksum character, if the chosen encoding allows it
         -E           print one code as eps file (default: multi-page ps)
         -S           print one code as svg file (default: multi-page ps)
         -P           create PCL output instead of postscript
         -p      page size (refer to the man page)
         -s           streaming mode (refer to the man page)

      Known encodings are (synonyms appear on the same line):
      	"ean", "ean13", "ean-13", "ean8", "ean-8"
      	"upc", "upc-a", "upc-e"
      	"isbn"
      	"39", "code39"
      	"39ext", "code39ext"
      	"128c", "code128c"
      	"128b", "code128b"
      	"128", "code128"
      	"128raw"
      	"i25", "interleaved 2 of 5"
      	"cbr", "codabar"
      	"msi"
      	"pls", "plessey"
      	"code93", "93"
      	"code11", "11"
      Mail bug reports and suggestions to &lt;bug-barcode@gnu.org&gt;.
      </pre>
