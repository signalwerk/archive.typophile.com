    html: |-
      <p>1. gaps between glyph boxes, though I snapped the metrics to each box.</p>
      <p>that is a metrics problem, you have to kern them together<br>
      check for kerning tuts.  </p>
      <p>2. the “o” still red, even after I closed the contours.</p>
      <p>that i dont know... once it writes fine why to bother.. i mean it is your first font.</p>
      <p>3. some glyphs need to be typed twice to appear in preview (see image).<br>
      some glyphs like “@” show you the glyph you are currently working on, on the preview window, what i want to say is that some letters written in the preview have also a certain function... and you have to write them twice so as they show as a regular preview.</p>
      <p>4. in preview the “5” appears instead of the “@”.</p>
      <p>it is what i said before. “@” = at    so it shows you the glyph you are curently working “at” ;)</p>
