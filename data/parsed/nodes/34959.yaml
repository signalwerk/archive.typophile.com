    <p></p><div class="imageWrap"><img src="/web/20080907152145im_/http://www.typophile.com/files/best_of_ghurman_4398.png"></div><p></p>
    <p>I’m creating my first typeface in FontLab but have problems. do you know how to solve the folowing problems:</p>
    <p>1. gaps between glyph boxes, though I snapped the metrics to each box.<br>
    2. the “o” still red, even after I closed the contours.<br>
    3. some glyphs need to be typed twice to appear in preview (see image).<br>
    4. in preview the “5” appears instead of the “@”.</p>
