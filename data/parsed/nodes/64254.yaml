      <p>@sannsaan and all:</p>
      <p><em>the problem is to figure out the name for non-webstandard typefaces like Avant Garde Gothic</em></p>
      <p>The fonts may be stacked against us, but take heart.<br>
      FWIW - in Windows, at least, Maintype quite conveniently shows me the font-family names, as long as the fonts are installed in the OS or in Maintype's backup folder. I would imagine any font management tool does the same.<br>
      On the free and simple side of the street, there is also, in Windows, the Font Properties Extension available for download.<br>
      Once installed, a right click on the font gives you lot of basic but useful info like names.<br>
      <a href="http://www.microsoft.com/typography/TrueTypeProperty21.mspx" title="http://www.microsoft.com/typography/TrueTypeProperty21.mspx">http://www.microsoft.com/typography/TrueTypeProperty21.mspx</a></p>
      <p>Don't know what the common equivalents to these might be on the Mac.</p>
