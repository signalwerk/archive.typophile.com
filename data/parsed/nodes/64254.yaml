  html: |-
    <p>as typophiles we want to make our websites with the best types, and recently I figured out something that couldn't find documented on the web -I think- and want to share this… if you want your visitors view your site in a specific type, you can use font stacks, ej this is a traditional Garamond-based serif stack:</p>
    <p>font-family: "Palatino Linotype", Palatino, Palladio, "URW Palladio L", "Book Antiqua", Baskerville, "Bookman Old Style", "Bitstream Charter", "Nimbus Roman No9 L", Garamond, "Apple Garamond", "ITC Garamond Narrow", "New Century Schoolbook", "Century Schoolbook", "Century Schoolbook L", Georgia, serif;</p>
    <p>the browser checks for every font, and displays the website with the first font installed on the visitor's p.c.<br>
    the problem is to figure out the name for non-webstandard typefaces like Avant Garde Gothic, so my first try was:</p>
    <p>font-family: "ITC Avant Garde Gothic Std Book";</p>
    <p>that was exactly the name I see on my fontexplorer, but does not work :(, finally my last try –and the most unlikely for me to work– was this:</p>
    <p>font-family: "ITCAvantGardeStd-Bk";</p>
    <p>And it worked!!! the name we should use is the PostScript name of our preferred typeface. I know this could be useless for most of the users that don't have the Avant Garde, but I wanted to give a better look  of my website for those who does.</p>
    <p>Finally, hope this could be helpful to further references :)</p>
