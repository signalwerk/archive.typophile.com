      <p>@sannsaan</p>
      <p><cite>font-family: “Palatino Linotype”, Palatino, Palladio, “URW Palladio L”, “Book Antiqua”, Baskerville, “Bookman Old Style”, “Bitstream Charter”, “Nimbus Roman No9 L”, Garamond, “Apple Garamond”, “ITC Garamond Narrow”, “New Century Schoolbook”, “Century Schoolbook”, “Century Schoolbook L”, Georgia, serif;</cite></p>
      <p>This is not really useful. While the Windows system version of Palatino (Palatino Linotype) is well hinted, the other names may refer to either TrueType versions of Palatino, that are not well hinted, or to PostScript versions, that can’t be hinted as well as TrueType versions. So it may be better for the user, to refer to fonts, that are legible on screen, at least in case of body text.</p>
      <p>(Maybe it would be better to embed "Palatino Linotype", although I doubt, that this is allowed. And I don’t know, how well it is rendered on the Mac.)</p>
      <p>And even if the user has ITC Avant Garde, it does not mean, that he has installed it.</p>
      <p>You probably know the <em><a href="http://www.csszengarden.com" rel="nofollow">CSS Zen Garden</a></em>. <strong>(Admins, change the color of links, please. They are almost not visible.)</strong> The expression does not primary come from the fonts. Many of the designs are not optimized for legibility. (Many of them seem to be made by graphic designers, but not by typographers.) I want to say, that an "Avant Garde feeling" does not necessarily require the presence of the font Avant Garde on all pages of the website. For a logo, an image replacement-technique may be the better choice (in a barrier free way).</p>
