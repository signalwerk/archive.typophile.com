  html: |-
    <p>Open up FontCreator.</p>
    <p>Insert 4 characters, named Koppa and Sampi.</p>
    <p>Click OK.</p>
    <p>Now these 4 glyphs appear correctly.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-1_6128.png"></div><p></p>
    <p>Or insert 8 glyphs.</p>
    <p>Copy Ő and ő to uni03D8 and uni03D9.</p>
    <p>Draw the rectangle in uni03D8 and in uni03D9.</p>
    <p>Create the kai symbol by clicking Add Composite Glyph Member.</p>
    <p>Click the small letter, 'k'.</p>
    <p>Make the glyph simple, then resize the k to a greenlandic kra.</p>
    <p>Creating the greek Koppa</p>
    <p>Right click the glyph, then select properties.</p>
    <p>Click the Mappings tab.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-5_5448.png"></div><p></p>
    <p>Make sure that the Koppa was mapped to Greek letter Koppa.</p>
    <p>Click the OK button when finished.</p>
    <p>Create the small Koppa.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-2_6112.png"></div><p></p>
    <p>Remove the existent point.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-3_4868.png"></div><p></p>
    <p>After removing the existent point, the greek Koppa will look like this:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-4_6076.png"></div><p></p>
    <p>Create the capital greek Koppa by copying the greek small letter koppa to the greek letter Koppa.</p>
    <p><strong>Making the greek Sampi</strong></p>
    <p>Open 2 glyphs, namely the Greek Sampi.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-6_6185.png"></div><p></p>
    <p>Draw up a rectangle.</p>
    <p>Skew the rectangle.</p>
    <p>Insert 2 rectangles.</p>
    <p>Edit the points with Point Mode.</p>
    <p>Click Get Union of Contours.</p>
    <p>Get rid of the existent intersecting circle that you created.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-7_4867.png"></div><p></p>
    <p>Create 2 rectangles, edit the points, then select all of the small greek Sampi.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-8_4387.png"></div><p></p>
    <p>Select Get union of contours.</p>
    <p>Insert the lunate sigmas and the yot letter.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-9_6209.png"></div><p></p>
    <p>Click the OK button.</p>
    <p>Click the 3 glyphs, then click Complete Composites.</p>
    <p>Kern the greek sampi with the Kerning menu from Kerning, New, click 2 Greek sampis, OK, then enter a value of kerning.</p>
    <p>Click the OK button when done.</p>
    <p>Map the glyph, α to the letter: Greek small letter alpha. Enter alpha, which is a greek postscript name. Double-click the blank glyph, called 'alpha'.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/alpha-1_4059.png"></div><p></p>
    <p>Get rid of the existent point at the greek small alpha:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/alpha-2_5441.png"></div><p></p>
    <p>This finished greek small alpha would look like this:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/alpha-3_3868.png"></div><p></p>
    <p>Add the greek iota.</p>
    <p>Click the capital greek Iota, then select complete composites.</p>
    <p>Click the letter, ı, then copy it to iota.</p>
    <p>Click the insert characters icon, and an window will pop up.</p>
    <p>Insert this to Add these characters and/or character ranges. For example: 8364, $FB50 - $FBFF, $FFFC:<br>
    $1FBD, $1FBE, $1FC0-$1FCF, $1FDD-$1FDF, $1FED-$1FEF, $1FFD, $1FFE</p>
    <p>Click the OK button when done.</p>
    <p>For children:<br>
    Add 12 glyphs with Insert -&gt; Glyphs.</p>
    <p>And map all the 12 glyphs to:<br>
    1FBD Greek koronis<br>
    1FBE Greek prosgegrammeni<br>
    1FC0 Greek perispomeni<br>
    1FC1 Greek dialytika and perispomeni<br>
    1FCD Greek psili and varia<br>
    1FCE Greek psili and oxia<br>
    1FCF Greek psili and perispomeni<br>
    1FDD Greek dasia and varia<br>
    1FDE Greek dasia and oxia<br>
    1FDF Greek dasia and perispomeni<br>
    1FFD Greek oxia<br>
    1FFE Greek dasia<br>
    201F Double high-reversed 9 quotation mark</p>
    <p>After done, click OK, then click complete composites.</p>
    <p>Copy the glyph 'ň' to eta.</p>
    <p>Make the eta glyph by deleting the caron, then making the glyph a modified n.</p>
    <p>You've created an greek alpha, an greek eta, an greek epsilon and an greek iota.</p>
    <p><strong>Now, here are the glyphs you inserted for Vietnamese, named A caron, I caron, O caron, U caron, U diaeresis macron, U diaeresis acute, U diaeresis caron and U diaeresis grave:</strong><br>
    (img:vietnam-accents_3758.png)</p>
    <p>Enjoy the new 14 glyphs.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/polytonic-10_5267.png"></div><p></p>
