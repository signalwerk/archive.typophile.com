  html: |-
    <p>The previous topic "Hebrew Type Design" was a wasted opportunity. We have there several<br>
    people learned and experienced in Hebrew fonts. As a newcomer to this field I could benefit<br>
    from reading what they have to say. Sadly, these comments are buried somewhere in the 300 posts and effectively lost.</p>
    <p>The 200 or more post from GoHebrew should not be here, they should be in a blog!</p>
    <p>Also the subject was changed a few times but when this happened new topics were not created.<br>
    PLEASE THINK OF OTHERS.</p>
    <p>Mike</p>
