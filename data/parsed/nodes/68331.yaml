  date: 2010-03-11T21:15:00
  date_raw: 11 Mar 2010 — 9:15pm
  votes: null
  html: '<p>Readers may enjoy my article “<a href="http://www.alistapart.com/articles/ebookstandards/" title="Web Standards for E-Books" rel="nofollow">Web Standards for E-Books</a>” at A List Apart, particularly the sections on exactly which typographic features E-book files should and must not contain. (Of the latter: Ligatures, hung punct, hyphens.) I’m sure that Bringhurst apologists, who are a lot like Ayn Rand apologists, will fulminate with rage at  what I have to say about the em dash.</p>'
  html_clean: '<p>Readers may enjoy my article “<a href="http://www.alistapart.com/articles/ebookstandards/" title="Web Standards for E-Books" rel="nofollow" class="link-external">Web Standards for E-Books</a>” at A List Apart, particularly the sections on exactly which typographic features E-book files should and must not contain. (Of the latter: Ligatures, hung punct, hyphens.) I’m sure that Bringhurst apologists, who are a lot like Ayn Rand apologists, will fulminate with rage at  what I have to say about the em dash.</p>'
