      <p>Bill: <cite>This is from DTL Fleishmann, by Erhard Kaiser, who is also German, so I assume that it doesn’t look grossly wrong to the eyes of a German reader.</cite></p>
      <p>In DTL Fleischmann these ligatures seem to work because the dot stands out as such. (Top parts of 'f' and long-s are rather thin toward the end.)<br>
      Your inference is dangerous though. That one (typographically well educated) German does something, does not mean that all Germans need to like it. Same for uppercase eszett.&nbsp;&nbsp;;-)</p>
      <p>As to one-storey 'a' ligatures -- if they exist for typographic reasons only then I think they are nonsense: In Andron, 'fö' 'fä' 'fü' ligatures are not necessary since there are no collisions in the first place. And in Junicode, the alternate 'f' is much nicer solution, visually.</p>
      <p>I think Florian is right in that a contextual 'f' is the way to go. I do this too, but the other way round: the 'f' with short top part is the default one (since it is "safe") and is replaced by one with longer top part only if context allows.<br>
      But then, it is rather the various i-accents that are tricky since they cause problems with letters like 'T' 'V' 'W' 'Y' or punctuation/delimiters like slash, braces, brackets etc too ...</p>
      <p>Karsten</p>
