      <p>Flooce, probably because of this thread and related ones, in Williams Caslon Text I put in contextual alternative f's to avoid f + umlaut clashes. </p>
      <p>I also put in a stylistic set that lowers the traditional high dots on the i's and j's for German or Finnish, if you prefer that. </p>
      <p>The contextual alternatives for f + umlauts are default, and the lowered and smaller dots are stylistic set 2. <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/ot/" rel="nofollow">Here</a> are some of the alternatives, and <a class="freelinking external" href="http://www.fontbureau.com/media/pdf/WilliamsCaslonText-Features.pdf" rel="nofollow">here</a> is a comprehensive list, with examples.</p>
