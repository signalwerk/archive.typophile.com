    <p>[continued/excerpted from this thread: <a href="http://www.typophile.com/node/40338" rel="nofollow">The Most Useful OpenType Ligatures</a>]</p>
    <p>I really wish to see a text face with a solution for f+umlauts.<br>
    In German language, ‘fä’, ‘fö’ and ‘fü’ are anything but rare, just think of ‘für’ [‘for’].<br>
    In a lot of classic serif faces the drop of the ‘f’ reaches out quite far to the right. That’s why there are ligatures like fl, ff, fi – to avoid collision, right?</p>
    <p>So, dear type designers: before doing fancy things like including ‘ffj’ and ‘ſſl’ ligatures, 5 different ampersands and a truckload of ivies, please consider addressing this umlaut issue!*</p>
    <p>See this illustration:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/f-umlaut_4616.gif"></div><br>
    Yellow is (to me) only just acceptable, red isn’t anymore.<br>
    And, of course: the bolder, the more clotted it gets.<p></p>
    <p>By the way, I didn’t pick 4 fonts by Adobe because they were especially ‘bad’ – no, this problem is inherent to all faces that have an extensive ‘f’. I used these fonts as they are commonly regarded as being – in all aspects – very well equipped OpenType text fonts – and <em>still</em> suffer from this particular issue.</p>
    <p>In my humble opinion, merging the ‘f’ drop with the left dot of the umlaut (as in ‘fi’) can’t be the way to go – that would look really awkward. I’d love to have an alternative ‘f’ with a narrower top for those cases, preferably with automatic substitution, via the lig feature.</p>
    <p>And while doing so, don’t forget the triple combinations :°)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/affaere_6019.png"></div><p></p>
    <p>I don’t think this problem is limited to German language; the Swedish among others will benefit aswell.</p>
    <p>*) Don’t get me wrong; I very much appreciate all those special equipment. All I want to say is: first things first.</p>
    <p>--</p>
    <p>I see this came up before <a href="http://www.typophile.com/node/33330" rel="nofollow">in this thread</a>, though not especially focussed on umlauts – starting with <a href="http://www.typophile.com/node/33330#comment-200644" rel="nofollow">Charles’ 4th comment</a>. There, <a href="http://www.typophile.com/node/33330#comment-201090" rel="nofollow">Thomas Phinney called</a> that less sweeping ‘f’ a “Linotype f” – I suppose this then was due to technical limitations.</p>
    <p>--</p>
    <p><a href="http://www.typophile.com/node/40338#comment-248851" rel="nofollow">cerulean said</a>:<br>
    <cite><a href="http://www.mufi.info/fonts/" rel="nofollow">MUFI fonts</a> have fä, fö and fü ligatures. They use the solution you reject as awkward, but considering the nature of the project I must assume there is historical precedent for the form.</cite></p>
    <p>Yes, Andreas Stötzner’s Andron Scriptor Web lets the ‘f’ drop merge with the left dot – even though there’s no urgent need.</p>
    <p>Peter S. Baker’s Junicode takes a different stance. While its ‘fi’ and ‘fj’ <em>do</em> merge, its ‘f’+umlaut combinations offer a different solution: <strong>the ‘long f’ gets automatically replaced by an alternate!</strong> Exactly what I had in mind, great.<br>
    (It additionally has ‘true’ ligatures, but to me, these ligatures with just an elongated ‘f’ bar feel like an end in itself –&nbsp;and ‘fä’ being discretionary)</p>
    <p>Andron (with ligatures off/on)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/andron_3698.png"></div><p></p>
    <p>Junicode (with ligatures off, w/ alternate ‘f’, w/ ligs on)<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/junicode-3_3938.png"></div><p></p>
    <p>They both introduce a single-storey ‘a’ for ‘fä’. Is this only to avoid collision? Then, I think that’s not a good idea; just imagine how odd words/lines would look like which feature ‘fä’ <em>and</em> a regular ‘a’.<br>
    Or do I miss the point, and these ligatures are for a specific historic application only? Who can shed light on this? Highly appreciated.</p>
    <p>And: Are there more recent &amp; decent digital fonts with an alternate ‘short f’, like Junicode?</p>
    <p>Thanks, F</p>
