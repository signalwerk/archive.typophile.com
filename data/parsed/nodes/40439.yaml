      <p>I don't think it's possible to isolate this issue to one accent and one language.</p>
      <p>(Unless one cleverly uses OpenType language tags to provide different versions of the same accent for different languages, but that in itself seems over-elaborate and thus poor design.)</p>
      <p>In general, accents work better when they are closer to the median (top of the x-height), and not floating too far away from the letter. However, the dot over the i is different--it works better when it IS significantly higher, with space necessary to disambiguate it from "l", and this causes difficulty in harmonizing the tittle (dot accent) on i, ż, ė, and ċ, with the other accents, especially the dieresis.</p>
      <p>The type designer is faced with a dilemma: the need for a high tittle but low dieresis, a disparity which, to most of us, just doesn't look right. Usually, one opts for a dieresis that is almost as high as the tittle. This looks quite smooth in most languages, but the high dieresis does cause difficulties in old-style typefaces with their overarching "f" arms. </p>
      <p>A question I would like to ask the Germans, Turks and Finns: does it bother you when the tittle and the dieresis are at obviously different heights? (See option 3 below.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fs_6608.jpg"></div><br>
      1. The default height for dieresis, with a lot of extra kerning added after f.<br>
      2. The dieresis lowered, and a little extra kerning after f.<br>
      3. The dieresis lowered a lot, and no extra kerning after f.<br>
      4. A contextual alternate f to precede a-dieresis etc: however, the difference in "f"s may be a problem.<br>
      5. A narrow "f" throughout.<p></p>
      <p>Options 1 and 2--with extra kerning--are quite good solutions, although type designers today, aided by class kerning, are not inclined to individually kern each "f" combination. </p>
      <p>I favour option 5. After all, the old-style "f" with long arm was never designed with multi-lingual setting as a criterion. If Bill Caslon had been required to satisfy Finnish, Turkish, and German typesetting in the Antiqua (old-style), I doubt he would have given his "f"s such expansive arms. The reason for the large overhang was, I believe, to make the plain f more like the f in the f_i and f_l ligatures, and to thereby not draw attention to the ligatures. However, when one also considers the problem it creates for the accented characters, then the large overhang is NOT the best solution. It solves f_i and f_l (f_b etc), but at the expense of making f_adieresis etc. much worse. Therefore a narrow f throughout is the best design.</p>
      <p>Also, the wide arm of an "f" at the end of a word can occasionally jump right over a space and interfere with a following T or W, and surely this should be avoided (e.g. A Tale of Two Cities).</p>
      <p>It seems to me that the use of contextual alternates is a last resort, and that there is something dubious in adopting slightly different alternate letter forms to solve this kind of design problem--it dilutes the personality of the typeface. Nonetheless, what Jos has done looks fine, and I've been experimenting in a similar manner.</p>
      <p>The "f" substituted into Caslon here was taken from Palatino. Hermann Zapf's narrow f works well with a high dieresis--and the separateness of f and i was even maintained in its foundry type ligatures.</p>
    html_clean: |-
      <p>I don't think it's possible to isolate this issue to one accent and one language.</p>
      <p>(Unless one cleverly uses OpenType language tags to provide different versions of the same accent for different languages, but that in itself seems over-elaborate and thus poor design.)</p>
      <p>In general, accents work better when they are closer to the median (top of the x-height), and not floating too far away from the letter. However, the dot over the i is different--it works better when it IS significantly higher, with space necessary to disambiguate it from "l", and this causes difficulty in harmonizing the tittle (dot accent) on i, ż, ė, and ċ, with the other accents, especially the dieresis.</p>
      <p>The type designer is faced with a dilemma: the need for a high tittle but low dieresis, a disparity which, to most of us, just doesn't look right. Usually, one opts for a dieresis that is almost as high as the tittle. This looks quite smooth in most languages, but the high dieresis does cause difficulties in old-style typefaces with their overarching "f" arms. </p>
      <p>A question I would like to ask the Germans, Turks and Finns: does it bother you when the tittle and the dieresis are at obviously different heights? (See option 3 below.)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fs_6608.jpg"></div><br>
      1. The default height for dieresis, with a lot of extra kerning added after f.<br>
      2. The dieresis lowered, and a little extra kerning after f.<br>
      3. The dieresis lowered a lot, and no extra kerning after f.<br>
      4. A contextual alternate f to precede a-dieresis etc: however, the difference in "f"s may be a problem.<br>
      5. A narrow "f" throughout.<p></p>
      <p>Options 1 and 2--with extra kerning--are quite good solutions, although type designers today, aided by class kerning, are not inclined to individually kern each "f" combination. </p>
      <p>I favour option 5. After all, the old-style "f" with long arm was never designed with multi-lingual setting as a criterion. If Bill Caslon had been required to satisfy Finnish, Turkish, and German typesetting in the Antiqua (old-style), I doubt he would have given his "f"s such expansive arms. The reason for the large overhang was, I believe, to make the plain f more like the f in the f_i and f_l ligatures, and to thereby not draw attention to the ligatures. However, when one also considers the problem it creates for the accented characters, then the large overhang is NOT the best solution. It solves f_i and f_l (f_b etc), but at the expense of making f_adieresis etc. much worse. Therefore a narrow f throughout is the best design.</p>
      <p>Also, the wide arm of an "f" at the end of a word can occasionally jump right over a space and interfere with a following T or W, and surely this should be avoided (e.g. A Tale of Two Cities).</p>
      <p>It seems to me that the use of contextual alternates is a last resort, and that there is something dubious in adopting slightly different alternate letter forms to solve this kind of design problem--it dilutes the personality of the typeface. Nonetheless, what Jos has done looks fine, and I've been experimenting in a similar manner.</p>
      <p>The "f" substituted into Caslon here was taken from Palatino. Hermann Zapf's narrow f works well with a high dieresis--and the separateness of f and i was even maintained in its foundry type ligatures.</p>
