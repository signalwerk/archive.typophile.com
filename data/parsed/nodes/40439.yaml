      <dl>
      <dt>The <strong>ії</strong>, <strong>їі</strong>, and <strong>ïï</strong> combinations are common in Ukrainian, e.g.</dt>
      <dd>„В она повела його до вітальні, де чекала родина — хлопчик і дівчинка ïï віку, дружинина сестра та ïï чоловік. Основні принципи і методи аудиту готової продукції в його організації. Він зустрів їі рік тому у Дебрецені, коли найнявся до їі батька доглядяти кони.“</dd>
      </dl>
      <p>Of course, Cyrillic <strong>і</strong> (U+0456) and <strong>ї</strong> (U+0457) are different characters from Latin <strong>i</strong> and <strong>ï</strong>, and yet.</p>
