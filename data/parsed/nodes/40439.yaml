      <p>Miguel, I learned Brazilian Portuguese, but it's been a while (and I know they're still fighting over the orthography so maybe something's changed).  The dieresis is only used in the sequence <em>[gq]u[ei]</em>.  I don't think the rare <em>qu[oa]</em> sequence would have it (quasar, quorum).  In Spanish, the dieresis is, outside of poetry, only used in the sequences <em>gu[ei]</em> to show the <em>u</em> is pronounced.  The Portuguese <em>qü</em> is replaced with <em>cu</em>  </p>
      <p>Hence my estimate of roughly 50%: if the dieresis/umlaut shows itself, it will necesarily be followed by an <em>e</em> or an <em>i</em>.</p>
