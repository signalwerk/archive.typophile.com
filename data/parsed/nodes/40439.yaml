    html: <p>I'm not sure why this thread got revived -- to complain about Adobe? -- but in any case, we've been reworking their fonts for years with a contextual f, sometimes more than one. And not just for umlauts. There are other accents that cause problems too. Try a f+grave, sometime. Or even the sequence "f+space+J" -- "of Jewish . . . " is one of the stock things I look at when kerning &amp; preparing contextual alternates.</p>
