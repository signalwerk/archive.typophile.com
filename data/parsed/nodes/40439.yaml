      <p>I never understood why especially Adobe does not pay more attention to this issue. They take so much care to support Greek and Cyrillic systems, but did not realize that some of their most prominent fonts are of diminished use in German and other languages using the Latin system. </p>
      <p>Minion and Adobe Caslon are some of the few commercial fonts I own, but I avoid using them in German. For a person who does not need or own a lot of different font licenses, Minion is in many regards close to a perfect serif font, because of it subtle beauty and versatility. (Of course it might be generic, the more fonts one has to choose from.) It is just sad, that this seems to be such a non-issue for many.</p>
