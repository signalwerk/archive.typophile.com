      <p>Miguel and Matthew</p>
      <p>I just downloaded to my mac the <a href="https://addons.mozilla.org/en-US/thunderbird/addon/6081" rel="nofollow">Brazilian spell checker for Thunderbird</a>, installed it following the indications, found it as a text file  called pt_BR.dic in a subsub... folder of ~/library/thunderbird/Profiles/ and had a look at it.</p>
      <p>If I grep ü in that file, I get 765 entries (that may be different words or lemmatizations of the same word). If I grep üi, I get 388 entries, starting (after sorting) with agüista ambigüidade ambigüifloro angüicida angüiforme angüiliforme antigüidade aqüicaldense aqüicalor aqüicultor and ending with ubiqüismo ubiqüitarístico ubiqüitário ungüi ungüiculado ungüiforme ungüinal ungüinoso unilingüismo úngüis but also containing (but not so many, at first sight) variations of the same word, like this nice list</p>
      <p>sagüi, sagüi-amarelo, sagüi-branco, sagüi-caratinga, sagüi-comum, sagüi-de-bigode, sagüi-de-duas-cores, sagüi-de-mão-ruiva, sagüi-de-orelhas-compridas, sagüi-do-brasil, sagüi-do-rio-de-janeiro, sagüi-imperador, sagüi-ordinário, sagüi-pequenino-do-maranhão, sagüi-preto, sagüi-preto-de-bigode-branco, sagüi-veludo, sagüi-vermelho</p>
      <p>and similar lists for sagüim, sagüins and sagüis.</p>
      <p>To draw conclusions on actual frequencies, a native speaker or complementary statistics are required. Indeed, even if in those entries more than half of the time ü is followed by an i, that that does not imply that in actual texts the same proportion is to be found. That depends on the frequency of use of those words.</p>
      <p>Michel</p>
