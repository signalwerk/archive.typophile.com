      <p>OK, I'll help resurrect. In case somebody stops by and wonders about umlaut placement, let me just say here's a native German speaker who firmly believes there is generally no problem at all with tittles being higher up than umlauts. When people try very hard to make them the same height it can actually look quite off, especially when the dots of the umlaut are noticeably smaller than the tittle (which I also believe can work, it depends on the font).<br>
      The thing to keep in mind is that umlauted letters are different letters than their non-umlauted counterparts – meaning the diæresis must read as an integral part of the glyph. If say an "ä" looks like an "a" with something small floating way up (as can easily happen when the diæresis is small and at tittle height), it doesn't read optimally.</p>
      <p>FWIW, this is how my eyes see things. Feel free to disagree:<br>
      <a href="http://www.altaira.de/posted/tittles_umlauts.pdf" title="http://www.altaira.de/posted/tittles_umlauts.pdf">http://www.altaira.de/posted/tittles_umlauts.pdf</a></p>
