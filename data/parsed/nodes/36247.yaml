    date_raw: 22 Aug 2007 — 5:10pm
    votes: null
    html: |-
      <p>Forcing the folder structure to match a sets structure is not an option. Among other things, the same font can be (often/usually is) in multiple sets. Copying all the fonts to a vault is an option, but not an option I like. I want to maintain my own organization of physical fonts, and have them independent of the sets.</p>
      <p>ATM Deluxe has a feature to "export sets" to a plain text file. This enables one to simply recreate the same sets on another computer. It is AFAIK quite independent of the physical locations of the fonts. The format probably isn't documented, but it's pretty darn obvious and doesn't really need documentation.</p>
      <p>I'm just not getting why a modern font manager would even care about the physical location of the fonts, except for them being in a system fonts locaiton. Font Reserve created the "vault" idea back in Mac OS 7 days, mostly because font corruption was a big problem on classic Macs. It's not much of an issue today.</p>
      <p>Font Sense or other reliable font ID systems are a great idea, but for my purposes just using the PostScript FontName is good enough as far as reconstructing my sets. That and the Windows menu names are in the exported ATM font set file.</p>
      <p>Anyway, I'm starting to feel like I'm ranting, which is not a good sign. I appreciate that folks have been willing to share their info and thoughts.</p>
      <p>Regards,</p>
      <p>T</p>
