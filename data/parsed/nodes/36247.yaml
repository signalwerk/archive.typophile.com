    <p>I've got a new laptop running XP, and am considering using a new font manager rather than ATM Deluxe. I figure that as ATM Deluxe isn't compatible with Vista I might as well make the break now, and surely the new stuff has some features I'll like. My initial looks haven't impressed me a lot, but I'm hoping one will grow on me?</p>
    <p>Do the latest Windows versions of either FontExplorer or Suitcase (or both) import ATM Deluxe font sets?</p>
    <p>Cheers,</p>
    <p>T</p>
