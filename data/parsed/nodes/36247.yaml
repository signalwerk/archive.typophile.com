      <p>When Suitcase X1 for Mac OS was released there were many Mac users left behind by the lack of ATM on OS X. Extensis did actually create a utility to import this data for Mac users because there was significant demand. It only really worked for people upgrading from System 9 to system 10, not a clean install. </p>
      <p>Currently, I'm not aware of any other customers asking for this functionality on Windows, although there must be some. My guess is that it is partly due to slow Vista adoption in professional publishing environments.  In addition, it probably wouldn't be practical for people migrating from one PC to another. </p>
      <p>For things like this to happen, my guess is that there would need to be a lot of demand, or it would need to be easy to implement. For example, if ATM's database structure was clearly documented, a hobbyist my step up to the plate. Currently Suitcase for Windows is not scriptable, which means that a Suitcase import couldn't be fully automated. However, Suitcase for Windows does use Font Sense to identify fonts clearly. So, if a user exports sets into folders from another font manager, they can import them into Suitcase without generating dupes. This means basically dragging folders of fonts into the sets pane to create sets. If the same exact font is in multiple folders only one copy of the font will go into the Vault. I haven't used ATM in a while, so I'm don't recall how easy it is to collect fonts into folders.</p>
      <p>In future font management products, I'd really like to have a clean reliable way to import/export data. With Font Sense IDs, this would open up a lot of opportunities because each font can be globally identified.</p>
