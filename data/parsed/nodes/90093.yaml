    html: |-
      <p>You know, for the longest time I thought right-leaning<br>
      Italics were not... kosher :-) for Hebrew. For one thing<br>
      they're totally not in its sister-script, Arabic. I think<br>
      I simply didn't want to believe it's OK (being an anti-<br>
      Latinization myrmidon) and I dismissed the various<br>
      examples of it (like the El-Al logo*, if memory serves)<br>
      as deluded. But I'm not sure any more, and if I were to<br>
      bet the house (not that I'm a gambler) I think these days<br>
      I'd put my money on "it's OK". Maybe since Israelis are<br>
      very tech-oriented they've moved even further from<br>
      handwriting than Westerners.</p>
      <p>* Although airplane directionality<br>
      provides an extra twist there.</p>
      <p>hhp</p>
