      <p>"symmetrical serifs " - so you think that I should leave out smoothly flow into stem from one side? I did it because I wanted to keep in roman also some element from handwriting…</p>
      <p>hmmm…</p>
      <p>Btw, this web side is from my University and you saw my first typeface :)<br>
      but it's not finished yet, maybe I will post some new improvements later :)</p>
