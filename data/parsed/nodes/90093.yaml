    <p>Hello everybody,<br>
    could you write me some opinions about my new text type project, please?<br>
    It is Italic family which includes left and right leaning roman and italic version.<br>
    As a first I wanted to design just left leaning but later I add right variant.<br>
    I'm the most interested if the left roman version is enough readable for you as a text type.</p>
    <p>Thank you so much.<br>
    Slavka</p>
