    html: |-
      <p>Well, it's not that it <em>looks</em> gimmicky. It's just that<br>
      one has to think about Design, and what you're trying<br>
      to achieve. Making something simply because you can<br>
      isn't Design. In fact one Famous Designer who has made<br>
      an upright-Italic pretty much said he did it because he<br>
      had always wanted to make one... It didn't seem to matter<br>
      that the style is pretty much useless for emphasis (as you<br>
      state yourself).</p>
      <p>Now, you might instinctively know that it's a good idea,<br>
      but to make it usable to others you will have to figure<br>
      out <em>why</em> it's a good idea; that's the only way to develop<br>
      it fruitfully.</p>
      <p>Italic directions: well, it would be nice to have multiple<br>
      slants (or even a slant Multiple-Master axis) but I think<br>
      you should start with one for each direction. Just make<br>
      sure the amount of slant is enough, but not too much.<br>
      This depends mostly on the intended usage size, which<br>
      is a product of weight, vertical proportions and spacing.</p>
      <p>The Roman's serifs: yes, forget handwriting. Don't willfully<br>
      shun its <em>products</em>, but don't treat it as some sort of ideal.</p>
      <p>hhp</p>
