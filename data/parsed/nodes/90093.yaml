    html: |-
      <p>So this thing doesn't have an upright at all,<br>
      and each of the two slanted cuts has an Italic.</p>
      <p>Some people would call this gimmicky. I myself<br>
      am a big fan of finding alternative methods of<br>
      emphasis, so I'd love to see this explored more.<br>
      For example you could use a «direction»'s own<br>
      italic for mild emphasis, and the italic from<br>
      the other «direction» for stronger emphasis.<br>
      Combined with different weights, the «emphasis<br>
      palette» would become quite rich.</p>
      <p>In terms of the character of the design itself,<br>
      the main thing I'm wondering about is whether<br>
      the backslant italic should actually be more<br>
      than just a mechanical job; maybe it would be<br>
      cool to make it reflect chirography, for example<br>
      the arches could be <em>flatter</em> than the Roman...</p>
      <p>However the Roman I would actually consider<br>
      making less chirographic; for example I'd make<br>
      the serifs symmetrical. This would further<br>
      distinguish the Romans from the Italics.</p>
      <p>The "g" is wonderful - maybe make it <em>slightly</em><br>
      less top-heavy. I'd raise the tittles, and make<br>
      the ascenders a bit taller.</p>
      <p>BTW, I checked out your (?) site<br>
      <a href="http://www.gd2.cz/cs/page/slava-jevcinova/minus-five-degrees" title="http://www.gd2.cz/cs/page/slava-jevcinova/minus-five-degrees">http://www.gd2.cz/cs/page/slava-jevcinova/minus-five-degrees</a><br>
      and I'm seeing some nice original thoughts. Keep it up!</p>
      <p>hhp</p>
