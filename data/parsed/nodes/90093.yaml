      <p>Hmmm, if it looks gimmicky I'm sorry. But my concept was to try design left leaning text type. From the beginning it was just left leaning, but then I added also right slanted. I was considering also about upright italic / classic roman, but I'm worry that in this case people will not notice the Italic so much. So I don't know, maybe I will add it later.<br>
      Especially I like combination left roman with right italic :)</p>
