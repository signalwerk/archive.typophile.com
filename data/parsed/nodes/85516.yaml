    html: <p>Hi this is my first post, but I personally have dealt with ideas in relation to this. I am a geography student here in Utah (Western U.S., Rockies, Great Salt Lake, etc.) and completed a paper awhile ago on my town's "Sense of Place". In reference to that I would like you Google "Welcome Arches", the Western U.S. is dotted with them. Most famous might be Reno, Nevada. My hometown (Brigham City, Utah) has quite a good looking one as well which has been there since the mid 1920's. Also something that might help...Google or Wikipedia "Hillside Letters" or "Mountain Monograms" these are letters that represent High Schools and Colleges. I find one in most every town with a decent hill or mountain nearby, including my own. I don't know if this is in the direction you are heading, but here's a nickel in your hat.</p><div class="imageWrap"><img src="http://typophile.com/files/4230595_4229.jpg"></div><p></p>
