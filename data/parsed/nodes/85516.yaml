    <p>Hi there, I'm a new member to these forums as it's the first time I've needed to elicit the help of you guys, previously I was content to just peruse through the archives and find information there. So currently, I'm researching for my third year dissertation, and surprise surprise, it's on typography. </p>
    <p>One of my case studies is based around typography acting as an identity for a city/region. There is already quite a bit that I've managed to gather on it, for example Metro Letters: a typeface for the twin cities - but all this is fairly recent. One of my themes of investigation is how type and cultural identity have changed over time. So my questions really are...</p>
    <p>Is it a recent phenomenon that cities feel like they have to have an almost corporate brand feel?<br>
    If so/if not, then when did it begin? </p>
    <p>N.B. I say "history", but even going back as far as the 20th century is enough to compare. </p>
    <p>Thanks very much in advance if anyone has any nuggets of information to part!</p>
