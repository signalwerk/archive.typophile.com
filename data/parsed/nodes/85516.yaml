      <p>Thanks for the additional info on Metro Letters. </p>
      <p>Offhand I'd think that cities have far less ability to brand themselves than private companies do. Branding a city's official website and literature is certainly feasible, although in many cities (especially smaller ones) some of the city's publications are put together by departmental staffers who clearly aren't designers and who may not understand or care about typographic guidelines.</p>
      <p>Regarding signage, city council members may be hesitant to vote the money to redo all the city's signage just to update the typography. And some signage may be impractical to change or may need to be retained for historic reasons.</p>
      <p>I'm not saying branding doesn't happen, obviously some cities do try to brand themselves. I'm just saying it's more difficult, for a variety of reasons, than for a corporation to do so.</p>
