    html: <p>Hi, I don't know what parameters you have, but the idea of associating visual symbols to places can be quite far reaching. Have you considered the concept of landmarks in relationship to communicating place. Using made up symbols to communicate might be a nice  venture, consider the hobos who placed notches on fence posts to communicate a friendly home. <a class="freelinking external" href="http://www.vagabondish.com/the-secret-language-of-vagabonds-and-traveling-hobos/" rel="nofollow">http://www.vagabondish.com/the-secret-language-of-vagabonds-and-traveling-hobos/</a> The prominence of structures also can create significance thus creating a sense of language without the use of the alphabet. I apologize if I keep finding examples from my region but not only was Independence Rock in Wyoming a landmark of significance to the pioneers, but they carved and tarred their names in it! I have been there and it is quite a sight! This might be a little in left field (I tend to be a divergent thinker) How about "Metes and Bounds" which communicates property lines using natural features. All I'm saying is don't limit yourself to the alphabet, visual communication is everywhere! If I saw a picture of Big Ben I wouldn't think, A big clock. I would think, Big Ben=London. You can't force that type of communication. Typography is interesting because it's one of the few arts that tries NOT to be noticed...well, generally. Question? Do you have an actual hypothesis in mind for this dissertation, or is this an exploration. (I should have started with that question to begin with.) Thanks for your consideration.</p>
