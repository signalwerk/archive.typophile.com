      <p>Thanks oldnick for the pointers, I didn't think of looking at it from the "empire" point of view, it definitely sounds interesting, but may be straying a bit too much from my topics of discussion. So it's something to look in to at some other point I hope! Also I've since discovered it is claimed that Peter Behrens was the father/founder of corporate identity in 1907 for AEG. </p>
      <p>JamesM: There is quite a nice book which exhibits the whole process of the project. It's called Metro Letters: A typeface for the twin Cities. Basically back in 2003, in conjunction with the Twin Cities Design Celebration (TCDC), a type project was started inviting a handful of well established type designers/studios to create a unique face for the Twin Cities. The winning entry was by LettError, and I must admit it is a beaut, so do check it out. To this day, I don't think it has been implemented which is a shame, but there is mention in the book that it was mainly to brand any publications/literature derived for the TCDC and to get people interested in type and design, more so than to brand the two cities. Kind of like the stuff Erik Spiekermann did for Glasgow quite a few years ago, I guess.</p>
