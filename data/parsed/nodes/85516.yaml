      <p>Ah right, yes now you've brought it to my attention, I do remember that Las Vegas sign featured in films and whatnot, it didn't cross my mind to think of that when looking at welcome "arches", but I agree it pretty much does the same job. </p>
      <p>Wasn't there some celebrity uproar when there were talks of disposing of the sign? I remember reading that actors were paying ridiculous amounts trying to save it. Anyway, it's interesting that you bring it up actually, obviously the Hollywood sign is one of its kind and instantly recognisable, but I wonder whether it's the whole backdrop and context as well that contribute to that. For example, if you were to replace the lettering, particular the "O"s with a rounder form for instance, do you think people would notice? </p>
      <p>Questions like this are surfacing in my mind since I'm also looking at the London Underground and Johnston's infamous typeface, and I found out a while ago that one of the roundels at Euston Square (just an underground station for people unfamiliar with the tube) actually have the wrong typeface, I believe they used Gill Sans instead of Johnston's, yet I don't think people bat an eyelid when they look at it. May have something to do with the two faces being quite similar, or also just because it's not a big deal.</p>
