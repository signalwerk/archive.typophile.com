      <p>&gt; if you were to replace the lettering [in the Hollywood sign] ...<br>
      &gt; do you think people would notice?</p>
      <p>There would be a very negative reaction if someone changed the sign. It's a landmark.</p>
      <p>It's not famous due to the appropriateness of the font. A skilled designer would not have picked that font to represent Hollywood. It's more like folk art. And it's been there so long that it's become iconic.</p>
