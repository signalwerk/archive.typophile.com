      <p>The concept of "branding" <em>per se</em> is a fairly recent phenomenon, although "trademarks" have been around since at least 1777, when the Bass Brewery registered Great Britain's first ®, and longer than that in the form of the "hallmarks" used by craftsmen from medieval times.</p>
      <p>City—or, perhaps more properly, Empire—"branding" is much older: in witness whereof, consider the iconic statue of Romulus and Remus and the SPQR banners carried by Roman legionaries.</p>
