    date: 2011-09-26T02:51:00
    date_raw: 26 Sep 2011 — 2:51am
    votes: null
    html: "<p>Thanks, TurtleType, I love diverse thinking myself as usually better ideas follow but I'm afraid my time is limited in this venture and I just need to press on with what I already have and not diverge too much. Obviously there is communication on all levels and it's not limited to type and letterforms, but that is my main area of interest and if I branch out too much I might as well be looking at visual communication as a whole. Also just to establish that it's an explorative study I'm doing rather than proposing a hypothesise and then looking for findings etc. Basically I am focused on the relationship between typography and culture, and investigating this on three levels: national, local/regional and in metro systems with time as a parameter, so my research spans from the last century. This was actually through the suggestion of my supporting tutor, however I've come to regret it as with such a wide scope it doesn't seem feasible to get really in-depth. I would have definitely done it differently had I not already gone this far.</p>"
