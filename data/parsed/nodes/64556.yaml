      <p>When letters connect visually they are said to be ligated, i.e. tied. A ligature is a particular technical solution to the typographic display of ligated letters: a single typeform representing more than one letter, whether the typeform is a piece of metal or a glyph ID in a digital font. The distinction between ligation as a behaviour of letters and a ligature as a mechanism for displaying ligated letters is an important one, especially now that font and layout technology provides us with other options for displaying ligation. Here, for example, is an example of contextually substituted joining forms of letters used to display ligation. This approach has a number of advantages over the use of ligatures, which I regard as an obsolete mechanism.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ligaturing_4675.gif"></div><p></p>
