    <p>Hello,<br>
    I am having a brain freeze. What it is called when one letter loops up and connects to the next? Is this a specialty thing specific to a certain font, or is it a design element people are creating as an illustration. Does anyone know of a font that does this?</p>
    <p>Thanks in advance,<br>
    Michel</p>
