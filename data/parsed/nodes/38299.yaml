    html: <p>One thing that baffles me about InDesign is that they have a swatch for "None" which is obviously no color, and then a swatch called "Paper" which is also no color but seems to want to be white, although you can change it. It's different from the None swatch because it's opaque, hence white. I don't understand why they don't just call it "White". You can't modify the Black swatch, it's just black, but you can modify this Paper swatch. You can also create a similar no color swatch and name it White for simplicity's sake.</p>
    html_clean: <p>One thing that baffles me about InDesign is that they have a swatch for "None" which is obviously no color, and then a swatch called "Paper" which is also no color but seems to want to be white, although you can change it. It's different from the None swatch because it's opaque, hence white. I don't understand why they don't just call it "White". You can't modify the Black swatch, it's just black, but you can modify this Paper swatch. You can also create a similar no color swatch and name it White for simplicity's sake.</p>
