  - id: 234550
    user: 19337
    date: 2007-10-21T12:17:00
    date_raw: 21 Oct 2007 — 12:17pm
    votes: null
    html: |-
      <p>If you make a little text box of the height you want it, make it the background colour you want, and make the text in it the same style as in your document, you can paste it into your document (with the text tool selected) wherever you need this highlighted text. Then in this little box type the word or words required, and adjust the length of the box as necessary (easiest if you centre the word horizontally in the box). You'll have to shift the box down (it pastes in on the baseline) and adjust the text in it if necessary using baseline shift. The highlighted box will move with the text if you reflow it, though it won't break for a hyphenation. You can copy and paste the box to other places and replace the words.</p>
      <p>A bit cumbersome I know. If you know there won't be reflow, just put a coloured box behind the word(s) you want highlighted.</p>
      <p>There's gotta be an easier way!</p>
    html_clean: |-
