      <p>There’s a simpler workaround: Create a character style with an ‘underline’ (I don’t know how this option actually is called in English, but I hope you get the point), adjust its stroke width (full line-height or what you want), and its position (shift it upwards). Additionally, you then can assign a shortcut for this character style, and there you go.</p>
      <p>I’m on CS2, but this should work in CS1 aswell.</p>
