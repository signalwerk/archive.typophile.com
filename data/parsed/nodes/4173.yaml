    html: <p>I had a similar problem once Eric. IIRC, I managed to 'solve' it by unchecking (in the <i>Tools &gt; Options &gt; OpenType</i> panel) the 'Use subroutines to compress outlines in OTF fonts' box.  <br> <br>That's probably a very white trash solution - hopefully someone else has something more intelligent - but it got my font sorted. <br> <br>Cheers. <br> <br></p>
