  html: <p>Is it possible to have too many points in an OT font? <br>Seems unlikely as one can have some 65,000 odd characters. <br> <br>The font in question fails to generate (Fontlab stalls while <br>generating the file - but doesn't crash). When I generate the <br>file as a normal T1 file is generates fine. If I generate only <br>caps and lowercase (by deleting all other characters) the file <br>manages to generate - but very slowly. <br> <br>(the font has many many points) <br> <br>Any help would be greatly appreciated</p>
