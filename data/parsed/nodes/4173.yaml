    date: 2004-04-07T15:08:00
    date_raw: 7 Apr 2004 — 3:08pm
    votes: null
    html: '<p>Hallo Eric, <br> <br>him, I think your fontlab is not dead. It uses the adobe fdk to generate the CFF encoding. It seems you have turned on the option "use subroutines to compress..." <br> <br>Turn it off and it should work very fast. I have tested some complex fonts too, and the subroutinizing process can take a lot of time. My record was 9 hours on a 1GHz Athlon to encode.  <br> <br>example: <br>without compression 900 kb fontdata <br>with compression 300 kb fontdata <br> <br>So, if you made your final version, turn the compression on and next morning your font is done! ;-)  <br></p>'
    html_clean: '<p>Hallo Eric, <br> <br>him, I think your fontlab is not dead. It uses the adobe fdk to generate the CFF encoding. It seems you have turned on the option "use subroutines to compress..." <br> <br>Turn it off and it should work very fast. I have tested some complex fonts too, and the subroutinizing process can take a lot of time. My record was 9 hours on a 1GHz Athlon to encode.  <br> <br>example: <br>without compression 900 kb fontdata <br>with compression 300 kb fontdata <br> <br>So, if you made your final version, turn the compression on and next morning your font is done! ;-)  <br></p>'
