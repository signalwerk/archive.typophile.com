      <p>One more dip into the font of wisdom.... After some more feedback, I tweaked the design to arrive at this logo:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/WCSNC(3)_4402.jpg"></div><p></p>
      <ul>
      <li>The kerning has been stabilized. Several of you mentioned the type was fairly tight, so I opened it up just a bit (especially the heavy text.) <em>If you see any glaring imbalances, let me know!</em></li>
      <li>Nodes have been checked and made orthogonal as much as possible.</li>
      <li>The golden ratio was used to help refine the objects' positions in the lockup.</li>
      <li>I made a horizontal lockup too, but it's not shown here.</li>
      </ul>
      <p>Feedback I got today from the client (a very small subset of the decision-making committee) suggested adding more detail to the hand, but I disagree with that. The design is intended to be fairly abstract. With more detail, it would look too much like the United Way logo. For me, the abstraction permits at least a bit of uniqueness to an otherwise very cliché concept.</p>
      <p>I also don't want to disrupt the smooth flow out of and back into the circle. I really like the pleasing and simple geometry. I might have to work to sell them on that concept, but I feel pretty strongly that the hand has just enough detail... especially after incorporating suggestions mentioned here which helped me clarify the finger and thumb shapes. (I really wanted to keep the finger transition I had originally, but I agree that it may have been too subtle and abstract to be seen as an open hand.)</p>
      <p>Others have asked whether stars are the right choice. In my first draft sketches, the "hand" concept was just one of four. It had a star hovering above it for purely arbitrary reasons. It was just a sketch. I sent them a list of questions (inspired by the writings of <a href="http://www.identityworks.com/" rel="nofollow">Tony Spaeth</a>) and asked them to "justify" the star and hand. I wanted them to explain to me why they liked those icons and what they meant within the context of their organization and mission so I could refine them. I didn't get much input!</p>
      <p>This is MY interpretation of what it could mean for them. These stars are experiencing difficulty. They are patients being caught by the safety net. It hints obliquely at the Kansas motto, "Ad astera per aspera." After reading Gardner's <a href="http://www.logolounge.com/articles/default.asp?Archive=True&amp;ArticleID=414" rel="nofollow">"2005 Trends"</a> article, I felt less guilty about relying on such simple iconography.</p>
      <p>Also, pink hearts, yellow moons, green clovers, blue diamonds and purple horseshoes didn't work as well. :-)</p>
