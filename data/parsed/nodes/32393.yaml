    <p>This logo is for a new association of safety net clinics which are banding together to pool resources and talent. The goals are to create a strong, unifying branding element that can be used for communicating with government, private, educational, and charitable organizations in health care.</p>
    <p>The hand is certainly cliché, but they really like the idea it conveys. It's automatically humanistic. To the client, it represents caring. In this logo, it's also catching those who are falling through the cracks.</p>
    <p>The name is very long and it really can't be abbreviated. I am trying to give the type enough visual interest that it could stand on its own without the logo.</p>
    <p>I respect all your opinions, so I'd love to hear feedback. What do you think of the type choice (Chianti)? The logo? Does the positive shape register more strongly than the negative shape? (I don't want the negative shape to pop at all... it doesn't represent anything.)</p>
    <p>Thanks for your critiques!</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/WCSN_4188.jpg"></div><p></p>
