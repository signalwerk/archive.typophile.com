    html: "<p>A font called Westminster was shipped with Windows 98. It's not an exact match, but it's close. Here's a sample: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/55975.gif\" alt=\"Westminster sample\"> <br> <br>There's a bit of info about it <a href=\"http://www.microsoft.com/typography/fonts/font.aspx?FID=208&amp;FNAME=Westminster&amp;FVER=1.01\">here</a>. <br> <br>It's not a free font, but there should be enough PCs still around running Windows 98 that it should be easy to find.</p>"
