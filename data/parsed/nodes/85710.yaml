    html: <p>My guess is that you created /nbspace/ as a composite of /space/, rather than simply copying the glyph. I'm not sure whether there is anything technically wrong with a non-outline composite, but the easy solution is to replace the /nbspace/ glyph with a simple copy of the /space/ glyph or just decompose the composite.</p>
