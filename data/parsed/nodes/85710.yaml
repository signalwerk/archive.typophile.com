  html: |-
    <p>Ran FontQA on my font. It had an error that says: "Some composite glyphs have empty components. nbspace-&gt;(space)."</p>
    <p>From this I take it that it is saying that there is something wrong with my nbspace glyph, and also my space glyph? It's calling them composities? But they're blank!</p>
    <p>Can anyone wager a guess as to what this could be about? Thanx!</p>
