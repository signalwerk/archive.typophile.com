    <p>We are proud to announce the release of <a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">Tablet Gothic</a> , the new type family by Veronika Burian and José Scaglione.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TG_release2_3422.png"></div><p></p>
    <p>Graphic designers of any nationality and background know very well that the art of composing titles correctly is not easy, Especially when it comes to periodical publications where there is need for both flexibility and graphic coherence. <a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">Tablet Gothic</a> was originally engineered as a titling type family, meant to help designers working on publications that require output as hard copies and a variety of digital platforms at the same time. As such, it is a grotesque sans serif that looks to the future of publishing with a clear understanding of its history, and reminiscences that go back to nineteenth century Britain and Germany.</p>
    <p><a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">Tablet Gothic</a> delivers the sturdy, straightforward and clean appearance expected from a grotesque, but it allows itself a good measure of personality to make it stand out on the page. Its 42 styles –six series of condensation and seven weights in each series– guarantee that, whatever the publication format is, there's a <a class="freelinking external" href="http://www.type-together.com/Tablet%20Gothic" rel="nofollow">Tablet Gothic</a> font that will do the job and perform well both technically and aesthetically. Furthermore, the rounder styles, Tablet Gothic Wide, Normal and Narrow achieved amazing results at very small sizes, producing  a beautiful texture and highly readable text blocks.<br>
    Kerning by Radek Sidun.</p>
    <p><strong>Tablet Gothic fonts can be purchased individually, by series or as a complete bundle (best value: just €12 per font!).</strong></p>
    <p>more information: <a href="http://www.type-together.com/Tablet%20Gothic" title="http://www.type-together.com/Tablet%20Gothic">http://www.type-together.com/Tablet%20Gothic</a></p>
