    <p>Good morning,</p>
    <p>I was wondering if anyone knew of a way to get hold of (buy, legally) Darka?<br>
    <a href="http://www.kimeratype.com/" title="http://www.kimeratype.com/">http://www.kimeratype.com/</a></p>
    <p>(NB: It's a Flash site, so I can't get you any closer than that.)</p>
    <p>I think it's a really lovely typeface and might be just the right thing for some work. However, I called FontShop per Kimera's instructions and they said they no longer work with Kimera. I sent an email to Kimera and no one responded. Kimera appears to have dropped off the face of the earth post 2006.</p>
    <p>I am impressed with some of the work I see and I would love to buy Darka at the very least! Can anyone help?</p>
    <p>Sincere thanks,</p>
    <p>Keith</p>
