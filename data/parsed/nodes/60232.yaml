      <p>Thank you, Guys!</p>
      <p>I have avoided dialing the number in part because of the long distance cost, but perhaps that will be my only option now. (AT&amp;T can have some really punitive rates at times.) I confess I am also a bit hesitant giving my information over the phone. (And Visa will charge me an additional fee for an out-of-country purchase.) Still, I suspect Kimera is most likely a very reputable company (if it still exists!).</p>
      <p>In fact, I've been tempted to make a second post on purchases and trust. How does one know the reputable type companies. Clearly Adobe, LInotype, and generally I would assume companies recommended on this site….</p>
      <p>kentlew, thank you for Will's name. I sent him an email asking if he was still in contact with Gabriel. Fingers crossed!</p>
      <p>I'm certainly open to suggestions, because as Stephen notes, this is a really lovely blackletter. I love this man's work: it pays honor to the past while brining it into the present.</p>
      <p>Keith<br>
      Fabricando fabri fimus.</p>
