    <p>Hello typophiles,</p>
    <p>I’m an Honours student at Monash University, Melbourne, Australia and for my Honours project I’m creating a series of numbers only fonts. Project description below:</p>
    <p>Melbourne is not shy of its history. Supporting a diverse variety of architectural styles of the buildings, juxtaposed with the hip street culture of today and the yesteryears as depicted in faded murals and advertisements—Melbourne openly invites people to explore its layers of visual narratives. The accessibility of its roads and laneways give people, residents or visitors, the chance and pleasure to delve into it at their leisure. There is, however, a side of Melbourne that is forgotten, more often than not: the up side. I believe that this is merely because people are used to seeing things on their eye levels when walking around. By doing so, they are missing out on the beautiful architectural letterings mostly located on the face of the building, way above eye levels; the building names and the years they were built, most of which were done in a more subjective, expressive way.</p>
    <p>This, in a way, mirrors how I see numerals in typeface design. In the past, “typefounders considered numbers separately from the provision of other printing types… Nineteenth century type specimen books often displayed a separate section containing fonts of numbers alone.”*. These days, however, I believe that numbers design is the black sheep of typeface design. It is as important as alphabet design but nowadays it is often not given as much care.</p>
    <p>3000 is an intertwining journey of these two interests. It is my attempt to create something concrete from my typographic exploration of Melbourne CBD—looking at vernacular typography and investigating the social history and typographic expression of Melbourne CBD through found architectural numerals. The outcome will be a series of fully working, numerals only digital fonts—as well as a type specimen book and a publication documenting the research process.</p>
    <p>*Jonathan Hoefler and Tobias Frere-Jones, <a href="https://web.archive.org/web/20080719173154/http://www.typography.com/" title="www.typography.com">www.typography.com</a><!--
