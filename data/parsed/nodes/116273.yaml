    html: <p>I recognized it at first sight and mainly immediately confirmed by the 4 upper terminals /W. I know it very well as I'm using it a lot for web purpose (<a class="freelinking external" href="http://www.lokoodreams.com" rel="nofollow">here</a> for instance). I like its cleanness, legibility/readability, large range and subtle impact. It is somehow a free alternative to Gotham.</p>
