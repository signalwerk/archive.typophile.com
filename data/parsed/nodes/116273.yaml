    html: |-
      <p>Thanks Ryuk. Since posting my comment I looked into Raleway and found it was a Google Font.  I have failed to look into these fonts before and found about 140 serif fonts that might need to be added to my Guide. I saw some familiar fonts, and a few that seemed like renames of existing designs (not cool!), but also a lot that seemed original. </p>
      <p>Has there been any discussion of the merits/demerits of the Google Fonts?</p>
      <p>- Mike Yanega</p>
