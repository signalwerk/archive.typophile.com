    html: <p>Proxima Software's <a href="http://www.proximasoftware.com/fontexpert/" target="_blank" rel="nofollow">Font Expert 2005</a> not only lets you view complete character sets of Postscript, Truetype and Opentype fonts <em>and</em> organize them into sets, but it also has a pretty nifty array of font specimen printout options. And it's relatively inexpensive.</p>
