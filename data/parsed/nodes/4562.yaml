    html: <p>Quite a beautiful form you have created.  It is more the look of pulp from squeezing rather than feeling squeezed. I think the difference is that you have created a texture by using so many letterforms.  You might try using far fewer words to make your point.  To show squeezing, you may need to have a visual comparison to anti-squeezing.  Maybe the word"Simple" is spaced normally and the word "Squeezed" uses progressively tightened letterspacing to the point of overlap.  The Yin makes the Yang apparent by juxtaposition.   <br> <br>ChrisL</p>
