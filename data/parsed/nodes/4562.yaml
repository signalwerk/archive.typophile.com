    html: <p>Kia Ora Nathan. Is this from Andr�s? If so, ask to have  <br>a look at Jaye Hopcroft's type poster. If I remember  <br>correctly, she also did Simply Squeezed Spirilina. Except  <br>she made potato stamps and pressed ink onto paper <br>then scanned etc. Very organic and appropriate. I would  <br>get right away from the screen and think about what  <br>you would have to do to pulp type into a juice. I agree <br>with Chase, it looks under dense, not particulary squeezed. <br>Have fun!  <br> <br>kris.</p>
