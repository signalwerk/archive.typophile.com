  html: |-
    <p>Hi i'm working on a typography assignment for a university paper in New Zealand. The Assignment is "Use the type from a non-alcoholic beverage and container to design your own perception. The inherent challenge being not to design an endorsement of the beverage, but to express  ametaphor or interpretation of it". <br> <br>The beverage i have choosen is a fruit juice beverage called Simply Squeezed. Since starting this project i have been  made aware of the turth, Simple Squeezed Juice has had preservatives, water, sugar added and the juices is made from concentrate.  <br> <br>I was trying to create the feeling that the type is under pressure, being crushed. The reasn i have made the type so hard to read is because the name "Simply Squeezed" is misleading when additives are used to make the juice. <br> <br>I have a question to ask: <br>How would i make the type look under pressure compressed? <br> <br>Any feed back is much appreciated. <br>thanks for your time <br><!--attachment: Typography_assignment-34833.unk*attachment_icon.gif*image/tiff*456.8*Typography+Assignment+development*Typography+assignment%2etif --></p><center><br>
