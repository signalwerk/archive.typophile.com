    <p>Prof. Joshi, who was a calligrapher of Indian scripts and who also made the Mangal Devanagari default/fall-back font for MS Windows, died on 5th February.</p>
    <p>For details read</p>
    <p><a href="http://www.cdacmumbai.in/index.php/cdacmumbai/prof_r_k_joshi">http://www.cdacmumbai.in/index.php/cdacmumbai/prof_r_k_joshi</a></p>
