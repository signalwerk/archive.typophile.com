      <p>Dude, start over. Wipe the slate completely clean and try something entirely different. Alaskan pretty much covered all the details, so I won’t restate.</p>
      <p>Think about the types of things this company makes and try to envision what kind of logo would belong on those things. For instance, if they make lawnmowers, think about what kind of logo you might see on a lawnmower, then do something better! </p>
      <p>Some questions to ask yourself that might help you to better define what your logo should implicitly communicate:</p>
      <p>If the lawnmower company was a person, what kind of conversation would you expect to have with him (assuming lawnmower is male)? What kind of language (tone) would he use when he speaks? What kind of clothes would he wear? What kind of music would he listen to? What kind of car would he drive? </p>
      <p>Avoid making random design choices. Treat each design choice as part of the solution to your problem. If your problem is that you ran out of milk, you wouldn’t spray your fridge with a fire extinguisher.</p>
      <p>Hope some of this gets through. Good luck.</p>
