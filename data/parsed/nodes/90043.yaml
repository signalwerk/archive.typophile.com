      <p>Thanks to both of you.</p>
      <p>Bonjour Michel!</p>
      <p>You seem to be aware of some open type resources I'm unaware of.</p>
      <p>Michel, your profile says that your occupation is "academic". Are you a font designer, and /or an application developer?</p>
      <p>I'm always looking for contacts that develop application text engines or that use shaping engine technology such as uniscribe or directwrite or anything else. There isn't much of these guys in the world and help is scarce.</p>
      <p>I'm one of these lonely guy :) I'm a software developer that works on the CorelDRAW's text engine.</p>
