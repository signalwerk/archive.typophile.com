    html: |-
      <p><cite>What is the OpenType Layout tag registry expected audience?</cite></p>
      <p>People working in type tech and techy type designers.</p>
      <p><cite>For hlig, it says : "This feature overrides the results of all other features." What does this means and who is responsible for enforcing it?</cite></p>
      <p>It’s also a suggestion. It means that it makes sense to place the <em>hlig</em> feature towards the end of the feature list, like the <em>kern</em> feature, the order of execution of which will be defined in the font file.<br>
      You are responsible for ordering features. Nobody is responsible for enforcing anything.</p>
