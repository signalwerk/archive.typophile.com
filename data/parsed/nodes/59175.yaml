    html: |-
      <p>@ Cristobal and James: There are in many peoples' minds strong worries about visiting Mexico City. Many of these worries have some validity, and are hard to dislodge. But I think James over-states the case a bit. To attend ATypI in the historic center of Mexico City, and to be in the streets in groups, and to pay attention to your surroundings will keep almost all risk at bay.</p>
      <p>I'm not well-traveled, so I cannot offer any comparisons with other big cities. Outside the USA the only big cities I've been to are Halifax [not all that big], Montreal, Vancouver, and Mexico City. I do not like cities, but in Mexico City I feel relaxed and calm; and safe. My wife and I walk all over the city or take the metro and busses. Very late at night we have friends or a maitre d' call us a safe cab.</p>
      <p>I've never met Cristobal, but after a side comment I made in a thread somewhere a while ago about a long walk we took across Mexico City on a Sunday morning, he must think my wife &amp; I are gringos locos. In October I'll tell him about our late-night walk from Tlalpan to our hotel on Periferco Sur. Then he'll know I'm loco.</p>
      <p>Hell, James: I even worry about being in Minneapolis at times. You survived that trip.</p>
      <p>powers</p>
