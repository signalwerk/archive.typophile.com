    <p>Hi, </p>
    <p>I'm posting two images that I would great appreciate help with identifying typefaces or finding similar ones:</p>
    <p>1.) A photo of vaudeville world wrestling champion Ernst Roeber's cafe in NYC in 1908. Can anyone recognize typefaces or know any that are very close to ANY of the  type in this picture. It can be the prominent ones you see on the marquee or something from the window or smaller signage in the background. </p>
    <p>2.) This is a poster also related to Ernst Roeber from 1898. I posted recently to see if anyone could recognize the typeface(s) in it or something very close. People were kind enough to give suggestions but nothing has really come close yet so I thought I would give it another shot. </p>
    <p>Thanks very much!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/roeber_cafe_5777.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/704px-Roeber_and_Crane_Bros_4355._Vaudeville_Athletic_Co.,_Ernst_Roeber,_champion_of_the_world,_wrestling_poster,_1898.jpg"></div><p></p>
