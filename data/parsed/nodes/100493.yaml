    html: |-
      <p>On closer inspection, I have to conclude this is hand-lettered. </p>
      <p>At the top, the letter 'R' in 'Roeber and Crane Bros' has four 'R's. Each is just slightly different from all the others. The same is true for the letter 'O' in 'Roeber' and in 'Bros'.</p>
      <p>Examine 'Champion Of The World', with emphasis on the lower-case 'o's. None of them are alike. Very similar, but each instance is just slightly different from all the others.</p>
      <p>When this poster was designed, hand-lettering was a big part of the illustrator's bag o' tricks. Today, that skill is almost a 'lost art', and that's a shame. The suggestions that have already been made are excellent, and will be your best starting point if you're planning to modify them to create similar letterforms.</p>
