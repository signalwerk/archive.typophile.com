      <p>Agree with Andreas. I can also count no more than 5 different letterings for the first one.<br>
      "ERNST ROEBER": my eyes see some sort of <a class="freelinking external" href="http://www.myfonts.com/search/engravers/fonts/" rel="nofollow">Engravers</a>. More: <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/great-western/" rel="nofollow">Great Western</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jnlevine/western-railway/" rel="nofollow">Western Railway</a><br>
      "MOERLEIN CELEBRATED CINCINNATI LAGER BEER": can't find anything similar, some sort of serif condensed tuscan...<br>
      "ROEBER'S" on window: depending if serifs or not, <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/fonts/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/fonts/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/fonts/" rel="nofollow">Sackers Gothic</a> or <a class="freelinking external" href="http://www.myfonts.com/search/copperplate/fonts/" rel="nofollow">Copperplate</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/parkinson/modesto/" rel="nofollow">Modesto</a></p>
      <p>Adding to my <a class="freelinking external" href="http://typophile.com/node/100439" rel="nofollow">previous suggestions</a>, <a class="freelinking external" href="http://www.letterbox.net.au/berber" rel="nofollow">Berber</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/king-wood/" rel="nofollow">King Wood</a></p>
