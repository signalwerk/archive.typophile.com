    html: <p>Sorry it has took me so long to respond, I became a little busy. In response to how I am doing it, I am planning to do it by hand mainly as I don't have money to do it any other way, and just build my own tools. Lately I have been doing many things by hand as a learning process, as an artistic process (I'm an Artist along with being a Designer), and just to get my hands dirty. I honestly find it great for learning, and its nice to get away from a digital setting off and on. Besides this I have also been doing calligraphy, and weekly book binding; along with setting up a screen printing area and dark room in my house. <br> <br>The way masters used to work just inspires me quite a bit. Not quite related, but still related, I rember going to this exhibition about two years ago where this lovely lady had created a book where she had made the paper, bound the book, and created all the type with in it (wood cut, 400 pages) it just greatly inspired me. <br> <br>Jim I would be very grateful if you sent that book to me, I will private message my address to you, thank you very much.</p>
