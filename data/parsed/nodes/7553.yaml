    html: '<p>Mark <br>The best book on the subject of wood type is American Wood Type: 1828-1900 by Rob Roy Kelly, originally Van Nostrand, 1969. It is out of print but you can sometimes find it on eBay or in used book stores. There is a lot of digitized wood type out there, especially on my own site at <a href="http://www.woodentypefonts.com" target="_blank">http://www.woodentypefonts.com</a> <br>Jordan</p>'
