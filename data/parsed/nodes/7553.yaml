    html: <p>Mark <br> <br>If you are planning to actually cut type fonts in wood (or do you mean digital renderings of wood type?) look up Hamilton Wood Type Museum on the web. They are a working museum in Two Rivers Wisonsin operating with all of the old Hamilton Wood Type Company's equipment and patterns. <br> <br>They make new wood type from the patterns and sell it to those who still want it. You might recall that a  couple of years ago Matthew Carter designed a new wood type face that they have produced in wood. <br> <br>If you could manage a trip there you would probably learn a lot if you get there at the time they are actually working on some wood fonts. <br> <br>If you are planning on simply cutting it out by hand, this will not apply a whole lot. If you plan to cut multiple letter fonts you will probably need a pantograph, like a Gorton or a Deckel or a number of other makes. <br> <br>The other day I made mention of Hatch Show Print in Nashville, Tennessee. Their site is certainly worth looking up. Additionally, they have recently publised a book showing their poster work from a hundred and some years ago till the present. Look em up for inspiration. <br> <br>I have cut a few wood letters here on the pantograph (Chinese characters)  as props for a photo shoot.  <br> <br>Best of luck in your quest. If I can help, let me know. <br> <br>Jim Rimmer</p>
