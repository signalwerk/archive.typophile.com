    html: "<p>We have three large American White Oak trees in our backyard, and one of them is slowly destroying a bedroom wall... Unless we can effectively apply what's called a root barrier, we'll have to bring the majestic old thing down. I dearly hope it doesn't come to that, but my question is: the arborist will end up with big chunks of oak which he will take away. Should I keep any of it and try to make my own wood type?! Like an arboreal Neuland or something. Is oak the right kind of wood for this? How hard would it be to get the face level type-high? Or is raw wood something that will actually find a buyer on eBay?  :-&gt; <br> <br>hhp</p>"
    html_clean: "<p>We have three large American White Oak trees in our backyard, and one of them is slowly destroying a bedroom wall... Unless we can effectively apply what's called a root barrier, we'll have to bring the majestic old thing down. I dearly hope it doesn't come to that, but my question is: the arborist will end up with big chunks of oak which he will take away. Should I keep any of it and try to make my own wood type?! Like an arboreal Neuland or something. Is oak the right kind of wood for this? How hard would it be to get the face level type-high? Or is raw wood something that will actually find a buyer on eBay?  :-&gt; <br> <br>hhp</p>"
  - id: 51360
    user: 2575
    date: 2004-11-07T20:14:00
    date_raw: 7.Nov.2004 8.14pm
    votes: null
    html: <p>Hrant <br> <br>From what I have seen, woodtype is made from endgrain rounds of woods like maple, pear, cherry plum and apple in sizes up to about 20 line. This wood is finihsed off to near thickness and stored for many years before it is milled to type-height and hand rubbed to a mirror-like finish. There are some details about this in the Hamilton Woodtype Museum website.  In larger sizes it was cut in flat grain of the same woods. <br> <br>I am not an authority on the woods, so there are  no doubt others that were used. I know that in recent years woodcut illustrations and some wood type were cut on birch and poplar plywoods. Both are apparently almost grainless, and can be cut with knives and gouges to good effect for illustration. Chris Manson of Rockville MD uses these plywoods exclusively for his illsutration work.  <br> <br>I have cut a good many blocks for illustrations in medium density fibreboard and something sold here called Ranger Board. Both are nothing more than highly compressed paper fibre, but can be cut in very fine line and will stand up to heavy impression for long runs. The downside is that it can't be exposed to dampness, or it will double in thickess and will be useless for futher printings.  <br> <br>Oak as endgrain might be too pronouned in the winter/summer growth rings and as flat grain planks I am certain the pronounced grain would get in the way of making a clean, untextured image. On the other hand you might get a heap of money from a furniture maker or somebosy who has a lathe. <br> <br>After reading the Hatch Show Print book through time after time, I have become interested in pantographing some wood letters at my shop for poster printing. It's amazing how much inspiration one can pick up from reading and observing work like Hatch. <br> <br>I really urge everyone to pick up the book. <br> <br>Good luck with your tree. I hope you can save it. <br> <br>Jim Rimmer</p>
