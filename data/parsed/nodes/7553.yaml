    html: <p>From the woodtype I've seen over the years, you need a really dense wood, which will dry and polish up to a really hard surface that will allow for a sharp edge to the letters and an easily cleanable surface. Basically, you want wood that emulates the printing hardness and durability of metal type, so you can get repeated clean impressions. Remember, wood type exists because casting metal type at that size is too expensive and weighs too much, but the goal in terms of printing quality is the same. <br> <br>The endgrain is the cross-section of the tree. This is the same surface used for making woodblock prints, and it is desirable because it can be easily worked but also polished to a completely smooth surface. If you cut across the grain, it is more difficult to work, and parts of the grain may appear as a pattern on the surface, no matter how finely you sand and polish. <br> <br>The wood is dried to harden it and also to ensure that any cracks form before the type is cut, rather than after it.</p>
    html_clean: <p>From the woodtype I've seen over the years, you need a really dense wood, which will dry and polish up to a really hard surface that will allow for a sharp edge to the letters and an easily cleanable surface. Basically, you want wood that emulates the printing hardness and durability of metal type, so you can get repeated clean impressions. Remember, wood type exists because casting metal type at that size is too expensive and weighs too much, but the goal in terms of printing quality is the same. <br> <br>The endgrain is the cross-section of the tree. This is the same surface used for making woodblock prints, and it is desirable because it can be easily worked but also polished to a completely smooth surface. If you cut across the grain, it is more difficult to work, and parts of the grain may appear as a pattern on the surface, no matter how finely you sand and polish. <br> <br>The wood is dried to harden it and also to ensure that any cracks form before the type is cut, rather than after it.</p>
