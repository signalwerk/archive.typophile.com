    html: <p>Jim, thanks. <br> <br>&gt; endgrain rounds <br> <br>What's that - the outside part? I guess that's the opposite of "flat grain"? <br>A total lumber novice, am I. <br> <br>&gt; plum <br> <br><i>Now</i> you tell me. We had a plum tree that died*, but the only thing left now is some small chunks I use to smoke while BBQ-ing - the aroma is just great. <br> <br>* Of old age, as far as we could tell. Which means it was already nice and dry (see below). <br> <br>I went to a woodcutting fair a few months ago, and I remember they relied a lot on basswood, whatever that is. It's very light and white. Actually, I have some in the garage. Hmmm.... <br> <br>&gt; stored for many years <br> <br>I guess that's to dry it, to reduce volume change. Some searching I did on eBay seems to indicate that some people use kilns for that, bringing down moisture content to single-digit percentages. <br> <br>Interesting and highly useful insights about oak. Maybe the texture can become part of the character of what I do with it? It's going to be massively rough anyway. <br> <br>Oak is indeed supposed to be highly valued for furniture, so much so that it's a protected tree (over here in Glendale at least), so maybe like you say I can find a buyer. But I'd rather it stay right here, upright and in one piece... <br> <br>&gt; Hatch Show Print <br> <br>Will get it from UCLA on Thursday! <br> <br>hhp</p>
