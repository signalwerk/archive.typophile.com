    <p>Hi there, i'm researching the style of a particular lettering style of a Maori prophet (in New Zealand, obviously). The lettering stlye seems to be of some european inspiration... celtic, maybe? It looks quite familiar, but I can't quite pick it. It is quite inconsistent, but I recognise some character designs, and would appreciate if anyone could point me in the right direction for other source material.</p>
    <p>Regards,</p>
    <p>- Chris</p>
