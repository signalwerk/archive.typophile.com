      <p>I think apart from 1 and 2 a reader will have trouble seeing 2 c’s, and 3, 4 and 5 the D is obscured. I believe part of the problem is the small serifs of copperplate. I would recommend that you try printing the elements onto acetate and try overlaying and moving them until you get a clearer composition.<br>
      Tim</p>
