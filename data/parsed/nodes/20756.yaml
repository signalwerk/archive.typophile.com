      <p>I don’t know about anyone else, but I like numbers 4 and 6 more than the final. The final I think is just too black, and I like the whole positive/negative overlay that happens in number 6, and number 4 I think is a good start...it still looks a little pieced together though. Perhaps if you made the little C the same thickness as the rest of it, it would appear to be more unified. Good luck.</p>
      <p>David</p>
