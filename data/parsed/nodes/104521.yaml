    <p>I thought this was 'Gizmo' but it seems I'm mistaken. I'm almost sure this is a digital font, rather than a custom hand-job (oo-er).</p>
    <p>Wondering whether anyone can either identify the font used, or set me straight on whether it's a custom job or not.</p>
    <p><a href="http://www.ncfe.org.uk" title="www.ncfe.org.uk">www.ncfe.org.uk</a> (the top right logo).</p>
    <p>Thanks!</p>
