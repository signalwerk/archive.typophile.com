    html: |-
      <p>Reading more closely, I have to say I find some words not fitting with Bodoni (Robust, Hardworking). I think the new arrangement is blander than the one before, as it all becomes very boxy and symmetrical. If this is a print poster I would probably ditch the gradient, as it looks nice on screen but often cheap on paper (especially shiny paper).</p>
      <p>I would definately try some different colours, and ditch the green... Concentrate on the arrangement in black and white first, then see which colour would fit. Personally I would go for a more classical colour scheme (white, red, black, perhaps some silvery grey), more fitting with the work of Gianbattista Bodoni, but try to find a way to give it a contempory touch, for instance by working on a nice type arrangement.</p>
    html_clean: |-
