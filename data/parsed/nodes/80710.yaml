    <p>Im doing a set of posters on Bodoni.<br>
    Trying to highlight its versatility by associating<br>
    some words with it and typing them in different styles of Bodoni.</p>
    <p>A draft of what the first poster will look like. Containing all the words.<br>
    Then I'll dedicate one poster to each word visualizing the word in a real environment.</p>
    <p>What do you think about it?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Postertypophile_4088.jpg"></div><p></p>
