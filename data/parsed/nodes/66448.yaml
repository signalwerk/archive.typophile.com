      <p>Authenticity is a tricky thing. You have to consider the difference between what fonts were actually used in the 1940s versus what fonts people <em>feel</em> were used at that time - possibly pretty close, but possibly quite different.</p>
      <p>So I might actually look more at things that people remember seeing regularly about the 40s - not fonts, but buildings, cars, etc. From there I would try to find fonts that evoke those visual ideas.</p>
      <p>Furthermore, when it comes to choosing a text face for the body of the book, there's a severe limit to how stylistically relevant that era's fonts are in conveying that era <em>today</em>. Text works on a very "detached" level.</p>
      <p>hhp</p>
