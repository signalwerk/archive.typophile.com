    <p>I’m designing a book (cover and inside) for a friend. It is WW2 shipwreck story, and the author really wants to emphasise authenticity. I thought using a font that was usual for newspapers in that era (at least for the cover, but maybe through the book as well) could be a way to convey this authenticity.</p>
    <p>I have some scans of newspapers clippings which I put through WhatTheFont. (I’m a novice graphic designer, so my type history probably isn’t as good as it should be!). I don’t know how accurate WhatTheFont is, and maybe they don’t even exist in digital versions. Also, communication is the main goal here, so if I can find a good font that is close enough for the target audience to recognise it I would be happy with that as well.</p>
    <p>Here are the fonts that WhatTheFont suggested:</p>
    <ul>
    <li><a href="http://new.myfonts.com/fonts/efscangraphic/madame-sh/medium-con/" rel="nofollow">Madame SH-Medium Con</a></li>
    <li><a href="http://new.myfonts.com/fonts/fontbureau/moderno/bold/" rel="nofollow">Moderno FB Cond Bold</a></li>
    <li><a href="http://new.myfonts.com/fonts/efscangraphic/century-no1-sb/bold/" rel="nofollow">Century No1 SB-Bold</a></li>
    <li><a href="http://new.myfonts.com/fonts/bitstream/century-725/bold-condensed/" rel="nofollow">Century 725 Bold Condensed</a></li>
    <li>Century Condensed Bold</li>
    </ul>
    <p>Looking at it, it to me seems a bit like a modern serif like Didot, but much more sturdier and less delicate. I was thinking of going with some variant of Century. If that is indeed a good idea, which is the best cut to go by (for headlines), and are there fonts that work well with this that I can use to set the body text?  I see Adobe has 2 version of Century (Old Style and Expanded) which are described as good text-fonts.</p>
    <p>These are probably all stupid questions, but I would appreciate any help!</p>
    <p>I’m sorry if this one belongs more in design that Type ID. Wasn’t sure where to put it.</p>
