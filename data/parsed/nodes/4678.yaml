      <p>For what it is worth, I did a search for the EULA associated with the fontpack from Microsoft and found the following: <br> <br><br>
      </p><blockquote>
      <hr size="0"><!---quote-!--><b>quote:</b>
      <p>**Restrictions on Alteration.* You may not rename, edit or create any derivative works from the SOFTWARE PRODUCT, other than subsetting when embedding them in documents.<!---/quote-!--><br>
      </p><hr size="0"><!--!-/quote-!--><p></p><!--!-quote-!--></blockquote>
      <p></p><p> <br> <br>Most (all) foundries prohibit modifications for resale purposes. Some (few) foundries allow modifications for internal use. Perhaps Simon (Daniels) could let us know if anything has changed.</p>
