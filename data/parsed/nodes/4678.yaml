    html: <p>Is the idea to sell this font? If you started with the outlines from Arial, as certainly appears to be the case from the graphic above, it would be an infringement of copyright to sell the font. Serial Killer appears to be what is legally known as a derivative work. A derivative work can only be made, used and distributed with the permission of the original copyright holder, excepting as permitted by fair use laws in individual countries. <br> <br>A derivative work may involve considerable original work -- indeed, it may account for most of the 'new' font, and all of what makes it distinctive -- but so long as a font makes use of another copyrighted work, it is considered a derivative work.</p>
