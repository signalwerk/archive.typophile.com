    html: <p>It's fine to do this treatment of Arial for a logo or something. But it's certainly unethical to use the Arial design without attribution, and in most countries illegal if you used the actual Arial outlines to create a derivative typeface. <br> <br>It's true that many shareware and freeware typefaces are conceived this way. That's because it is easy to do -- much easier than designing a new typefaces from scratch. But it's much less common for retail typefaces, for the reasons I mention above. <br> <br>I am actually quite impressed with the type sample and presentation, by the way. It's very effective graphic design. <br> <br>Regards, <br> <br>T</p>
