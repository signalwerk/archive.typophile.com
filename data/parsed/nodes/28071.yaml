    <p>Hi everybody,</p>
    <p>this is my first post! Thank you for creating this forum, I have found a lot of great font inspiration here. Now here is a type id request. It's the "aNYthing" logo (New York City based clothing company). A font close to this would also be great, the only one that I have that comes close is Aachen Bold, but it's not really the same.</p>
    <p>Also, the same font is used for the "ny" logo of the New York Giants Football Club.</p>
    <p>So if you could help me, I'd be happy. Image attached!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/NewYorkGiants_100.png" width="100" height="100" alt="">
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/logo-blk0.jpg" width="250" height="333" alt="">
