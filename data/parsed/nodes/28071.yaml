      <p>It's not an exact match, but it's close enough that if I were trying to re-create this look I would start here -- have a look at Storm's <a href="http://www.myfonts.com/fonts/storm/juvenis/">'Juvenis'</a> Medium or Text Bold. You make the 'y' from the 'u' and you make the 'g' from the 'q'(this is the hardest).</p>
      <p>- Mike Yanega</p>
