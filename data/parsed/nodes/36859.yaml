    <p>I need to put together a NASCAR-style racing poster and, frankly, Serpentine is to me the obvious choice.  It's also cliche and pretty much played out IMO--I've never really liked it.  But nothing I'm working with really says "Car Racing" like Serpentine.</p>
    <p><a href="http://www.myfonts.com/fonts/linotype/serpentine/bold-oblique/" title="http://www.myfonts.com/fonts/linotype/serpentine/bold-oblique/">http://www.myfonts.com/fonts/linotype/serpentine/bold-oblique/</a></p>
    <p>Would love to use something that gives the general racing feel in the same way without using this particular typeface.  Any suggestions would be greatly appreciated!</p>
