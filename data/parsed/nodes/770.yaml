    html: <p>&gt; <i> Has anyone ever used lining ﬁgures but reduced the size a notch or so? Does it work?</i> <br><br>I think that if you were do do this, depending on what a notch is, you will start to see weight and color changes that might not be ideal. <br><br>It would better in this case, to use what  Keith and Hrant have referred to so far as “ ‘short’ lining numerals.” If I am not mistaken, I would also refer to them as an equivalent of a small caps version of lining ﬁgures. These ﬁgures would be designed to match the weights and color of the minuscule romans, for example, that it is meant to be paried with. <br><br>The only family that I could ﬁnd, on the ﬂy, that had such characters was ( I’ll be shot for this. ) <br>Mrs Eaves. <br><br>I’m sure there are others, but I don’t have the time to look around. <br></p>
