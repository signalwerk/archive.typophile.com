    html: <p>&gt;I'm waiting to see if the list grows.  <br> <br>I have added Preface, with tabular, old-style figures as standard, in six weights, Roman and Italic. <br> <br>It's far easier to design an even-colored set of tabular figures, if one does them old-style -- there's more leeway to make a wide "1" that doesn't look anomalous, and a "0" that doesn't end up being too condensed (and with excessively narrow sidebearings) as in lining figures. <br> <br>Tabular lining figures have terribly uneven color and fit in things like area codes, eg loose (416) and tight (905).</p>
