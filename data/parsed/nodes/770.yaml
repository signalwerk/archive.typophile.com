    html: <p>I consistently find myself making changes or redesigns to a batch of ID packages that someone did before I was around this place. Many of the old packages have old style figures.  <br> <br>I really like old style figures, but every time I redo a card and change the numerals to lining, someone says "that looks so much better." <br> <br>I'll have to agree with them. As a <i>general</i> rule, I believe that lining numerals are better for stationery systems. In this context, they are more readable for those with poor vision. And as Nick said, they do look cleaner when stacked. <br> <br>But there is always the exception.</p>
