    html: "<p>hd-- <br>thanks for all the input. while i understand and agree with your comments on lefthand, unfortunately, the logo is already in use. i'm not much of a hand letterer and didn't really think of the options you mentioned. i guess the computer got the best of me there--it often provides a quick and easy solution. also i suppose i'm still enamored with lefthand and rarely use scripts at all, so it seemed like a good choice for adding a personal touch to the mark.  <br> <br>the \"community church\" type is scala. i'm trying to keep the logo a unique element, but still have the type relate on a basic structural level (scala/scala sans). i can see where having three faces may be a bit much, but i've applied the logo and scala sans very consistently across all three pieces.  <br> <br>the colored circles are not hand drawn (illustrator blobs), but are organic in nature, to contrast with the perfection of the black circles. it's meant to convey our wavering nature as humans versus the perfection of God.  <br> <br>sean--sorry about the offensive \"f\". i'm not sure what to do there. i guess i could spell out \"phone\" and \"fax\". but i'm more a fan of minimal elements, so i can live with the \"f\" as opposed to taking up more space with the whole word. it's all about the give and take... <br> <br>okay, you guys have compelled me to noodle more. here are three variants of the original. now i'm all indecisive. thanks : P<img src=\"http://www.typophile.com/forums/messages/30/13700.gif\" alt=\"bcard\"></p>"
