    html: <p>Imo, <span class="caps">OSF</span> is the way to go in stationery design, if the font allows for it. They simply visually ﬁt in better with miuscle letterforms and make for a more lively reading. In tables, of course, lining (or better still monospaced tabular) ﬁgures are what you need, but in brochures, books, stationery and anything that adheres to the general rules of what makes reading text easier, <span class="caps">OSF</span> is nicer. Also, to me, it looks more professional, not as run-of-the-mill… <span class="caps">OSF</span> are anything but old-stlye, I think. Actually, I much prefer them to the lining ﬁgures that came up during the 70s and 80s,when you even had lining ﬁgures on Renaissance fonts like Garamond and the like, which clearly need <span class="caps">OSF</span>s.&nbsp;:-D. <br></p>
