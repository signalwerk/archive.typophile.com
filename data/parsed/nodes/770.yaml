    html: <p>I’m a sucker for <span class="caps">OSF</span>s. There is a certain sophistication to them, and it’s one of the tell-tale signs of whether something is professionally set (this sounds really superﬁcial, just generally speaking). When I was in high school designing newsletters and magazines, I so much wanted expert sets so I could be more of a typographer rather than a desktop publisher! <br><br>Though <span class="caps">OSF</span>s can look terribly fuzzy for certain things. Like for general word-processing tasks like an invoice or letter, I tend to stay away from <span class="caps">OSF</span> even when I’m using a typeface that has them — <span class="caps">ITC</span> Charter, more often than not. Charter’s lining numerals are beautiful though. Georgia is a very nice general purpose font, but the lack of lining numerals would be very problematic for people like accountants. <br><br>How about ‘short’ lining numerals? For example in Bell? Or Miller? They don’t jump out at you in continuous text, and look ‘lively’ enough to be interesting. I would be happy to do without <span class="caps">OSF</span>s for these typefaces. <br><br>How about lining old-style ﬁgures? They line up in neat columns and jump up and down. A nice addition, I think. Many of Adobe’s Pro fonts have them. <br><br>I think for people like me who don’t like numbers, <span class="caps">OSF</span>s are more pleasant to read. At least they don’t look so monotonous. And I tend to think that they even help me read them better (shape recognition, just like caps vs lowercase). <br><br>For me, deﬁnitely <span class="caps">OSF</span>s on business cards. But how about <span class="caps">ISBN</span> numbers and such? <br><br>Have you noticed certain designers/ﬁrms don’t use <span class="caps">OSF</span>s at all? Like Massimo Vignelli, and Pentagram. They are trying to be ‘modern’?! <span class="caps">OSF</span>s are also rarely seen in magazines, and deﬁnitely not newspapers. And not to mention cheap novels (they probably just don’t know better/couldn’t be&nbsp;bothered).</p>
