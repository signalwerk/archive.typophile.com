    html: "<p>I've only seen \"lining numerals\" to mean where the numbers are the same height. Usually this means the same height of the caps as well, but not always: there are short lining numerals (pioneered by Austin/Bell), and I think they generally work better. Lining numerals are often fixed-width. <br> <br>The \"opposite\" of lining numerals are old-style numerals (which are called all kinds of funny things, like \"up-and-down numerals\"), and they generally behave like lc letters, but not always: there's what's called \"hybrid\" numerals, which have larger-than-x=height bodies, but also feature extenders. The foremost practitioner of this style is Luc[as] de Groot, although happily this style -which I consider the ideal for text- is getting quickly more popular. There are actually tentative traces of this in some ATF fonts (like Garamond), but Luc[as] was the first to really flourish the hybrid style, as far as I've found. <br> <br>Old-style numerals are rarely fixed-width, even though structurally they actually fit that mold more easily! <br> <br>hhp <br></p>"
    html_clean: "<p>I've only seen \"lining numerals\" to mean where the numbers are the same height. Usually this means the same height of the caps as well, but not always: there are short lining numerals (pioneered by Austin/Bell), and I think they generally work better. Lining numerals are often fixed-width. <br> <br>The \"opposite\" of lining numerals are old-style numerals (which are called all kinds of funny things, like \"up-and-down numerals\"), and they generally behave like lc letters, but not always: there's what's called \"hybrid\" numerals, which have larger-than-x=height bodies, but also feature extenders. The foremost practitioner of this style is Luc[as] de Groot, although happily this style -which I consider the ideal for text- is getting quickly more popular. There are actually tentative traces of this in some ATF fonts (like Garamond), but Luc[as] was the first to really flourish the hybrid style, as far as I've found. <br> <br>Old-style numerals are rarely fixed-width, even though structurally they actually fit that mold more easily! <br> <br>hhp <br></p>"
