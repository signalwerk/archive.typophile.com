    html: <p>&gt;I’m waiting to see if the list grows.  <br><br>I have added Preface, with tabular, old-style ﬁgures as standard, in six weights, Roman and Italic. <br><br>It’s far easier to design an even-colored set of tabular ﬁgures, if one does them old-style — there’s more leeway to make a wide “1” that doesn’t look anomalous, and a “0” that doesn’t end up being too condensed (and with excessively narrow sidebearings) as in lining ﬁgures. <br><br>Tabular lining ﬁgures have terribly uneven color and ﬁt in things like area codes, eg loose (416) and tight&nbsp;(905).</p>
