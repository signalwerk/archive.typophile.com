    html: <p>Imo, OSF is the way to go in stationery design, if the font allows for it. They simply visually fit in better with miuscle letterforms and make for a more lively reading. In tables, of course, lining (or better still monospaced tabular) figures are what you need, but in brochures, books, stationery and anything that adheres to the general rules of what makes reading text easier, OSF is nicer. Also, to me, it looks more professional, not as run-of-the-mill... OSF are anything but old-stlye, I think. Actually, I much prefer them to the lining figures that came up during the 70s and 80s,when you even had lining figures on Renaissance fonts like Garamond and the like, which clearly need OSFs. :-D. <br></p>
    html_clean: <p>Imo, OSF is the way to go in stationery design, if the font allows for it. They simply visually fit in better with miuscle letterforms and make for a more lively reading. In tables, of course, lining (or better still monospaced tabular) figures are what you need, but in brochures, books, stationery and anything that adheres to the general rules of what makes reading text easier, OSF is nicer. Also, to me, it looks more professional, not as run-of-the-mill... OSF are anything but old-stlye, I think. Actually, I much prefer them to the lining figures that came up during the 70s and 80s,when you even had lining figures on Renaissance fonts like Garamond and the like, which clearly need OSFs. :-D. <br></p>
