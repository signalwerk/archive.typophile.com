    html: '<p>I’d take Version a) or b), although I like a) a bit better.  <br><br>The reasoning behind the circles is very very nice, in my opinion. I can see the quick and easy way that <span class="caps">FFL</span>efthand came over you … but it doesn’t add a personal touch, but rather fakes the illusion of personality in an industrial fashion… that is kinda the opposite of what you want to express, thus my comment. Maybe it is still possible to at least work a bit on the individual letterforms and add a tuch of inividuality without compromising the already established version too much…? <br><br>I don’t think the f is too much of a problem. Maybe it helps to make the p and f bold, to better diﬀerntiate them from the numbers? Or you use Small Caps for these two letters, so they make an ideal ﬁt with the numerals and the overall design should look quite nice as well with the added <span class="caps">SC</span>.  <br><br>One more thing — I’m not suire how this is done in the <span class="caps">US</span> but in Europe we tend to divide oﬀ the phonenumbers into little packages, like this:  <br><br>0201 849 61 64  <br>(with less space between the numbers, of course) <br><br>Isn’t that done overseas? Because apart from the dots I don’t see any kind of this and I wondered if it would even make sense, as there are never more than four digits in a sub-section. Just trying to learn something here…  <br><br>Aaaand, when I’m already playing 20-stupid-questions-for-a-buck… Just to satisfy my curiosity: what is the meaning of the x123? Just a placeholder … or does that actually mean&nbsp;something? </p>'
