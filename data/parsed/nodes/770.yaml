    html: <p>I consistently ﬁnd myself making changes or redesigns to a batch of <span class="caps">ID</span> packages that someone did before I was around this place. Many of the old packages have old style ﬁgures.  <br><br>I really like old style ﬁgures, but every time I redo a card and change the numerals to lining, someone says “that looks so much better.” <br><br>I’ll have to agree with them. As a <i>general</i> rule, I believe that lining numerals are better for stationery systems. In this context, they are more readable for those with poor vision. And as Nick said, they do look cleaner when stacked. <br><br>But there is always the&nbsp;exception.</p>
