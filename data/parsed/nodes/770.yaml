    html: "<p>&gt;<i>it's all about the give and take... </i> <br>I totally agree - and in this case, I think it is worth the compromise. <br> <br>&gt;<i>\"Heartland\": just change one of the \"a\"s. </i> <br>A great suggestion that will add just the right amount of character without too much effort. I like this idea. Good one. <br> <br>&gt;<i>Maybe it helps to make the p and f bold, to better differentiate them from the numbers?</i> <br> <br>I think that would only highlight the issue even more. The problem, to me, is that the 'p'  matches too much and the 'f' does not match enough. I personally try to avoid bold whenever I can and try to seek alternate solutions.  <br> <br>&gt;<i>Or you use Small Caps for these two letters</i> <br> <br>Now, this might just be the number and is a great excuse not to bold. I am speculating here, I have not tried it, but I'll bet that small caps will be different enough and at the same time not match enough to work just right. Give and take. Try it. I'll bet it will work. <br> <br>Oh, and I totally agree with Keith that the extension number is way out place there. I can not stress enough how much you should move that. I say totally leave it off if you can get away with it. If you absolutly need it, move it. It needs to be by the phone number. <br> <br>I like the sans version. It contrasts well with the rest of the card. I do like it. Good night, from the desert. <br> <br>Sean Michael</p>"
