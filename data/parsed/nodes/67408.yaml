      <p>I didn’t want to imply that omashuisje should stay away from Fontlab. If you want a state-of-the-art typeface, Fontlab is your best option. I am just saying that in the good old days Fontographer was great (“quite pleasing”, as omashuisje said). But certainly they were simpler times: only 256 characters per font, not so many options in the font info, no OT features to worry about… Really easy to get a font working in your system. That takes more effort today. I haven’t used it in years, but I remember that it was a lovely tool. omashuisje’s wish about a software “simple yet effective” sounds more like Fontographer to me, specially if he worked with that software in the past. But yeah, he can download the Fontlab demo, read the manual, and decide for himself.</p>
      <p>[BTW, this nostalgic feeling about Fontographer is shared by many people: otherwise Fontlab’s people wouldn’t resurrect it.]</p>
