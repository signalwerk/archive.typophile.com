    html: |-
      <p>Jean Paul,</p>
      <p>you can pick up the FontLab demo version and read the manual (a PDF available for free in FontLab site). Don't be intimidated by the large number of pages. Parts of the manual are repeated to let user find proper info in an easier way. And, as you already designed your font, you can even ignore some chapters about specific design tools.</p>
      <p>I'm doing a typeface in that way: design the glyphs in Illustrator, copy and paste them in FontLab. Instructions about how to bring the vectors from IL to FL are in page 520. You don't have to export each glyph as an EPS.</p>
      <p>You may get the impression the program is somewhat complex, but this is not really true (in my opinion). There are some aspects of type design which are complex <em>per si</em>, as hinting and kerning.</p>
      <p>I did not used FontForge, so cannot talk about it.</p>
