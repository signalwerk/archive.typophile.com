    html: |-
      <p>@Cristobal<br>
      "Although Fontlab is a very powerful tool, it’s very complicated too"</p>
      <p>I disagree, it took me about 10-20 minutes to get used to the tools in FontLab. Of course, I am quite cozy with other programs like FontForge, which omashuisje is probably not.</p>
      <p>If you want to make a font with Illustator as your drawing tool, then that's perfectly fine. FontLab has an option to import both Illustrator and Encapsulated Postscript files. Although, you will have to export each glyph individually (there might be scripts to do this, although I'm not exactly sure, as Illustrator isn't my tool of choice for drawing glyphs).</p>
      <p>It takes a bit of practice, but it shouldn't be a total pain. I wish luck! :)</p>
