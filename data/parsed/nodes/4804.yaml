    date_raw: null
    votes: null
    html: "<p>The font I used is called Optima by Herman Zapf. <br>The registration font is likely not something you can get digitally. They look very constructed to me. You could buy fonts that would get you close (<a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=1084803745615003&amp;fontname=Interstate\">Interstate caps</a> or <a href=\"http://www.fontfont.com/shop/\">FF DIN</a> caps) but it's probably just as good to use plain old Arial. <br> <br>You must have the flight sim bug pretty bad! <br> <br>Edit: <br>Patricia, agreed. I seriously doubt the author of that logo was working from an actual font due to the general lack of basic modulation cohesion.</p>"
    html_clean: "<p>The font I used is called Optima by Herman Zapf. <br>The registration font is likely not something you can get digitally. They look very constructed to me. You could buy fonts that would get you close (<a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=1084803745615003&amp;fontname=Interstate\" class=\"link-external\">Interstate caps</a> or <a href=\"http://www.fontfont.com/shop/\" class=\"link-external\">FF DIN</a> caps) but it's probably just as good to use plain old Arial. <br> <br>You must have the flight sim bug pretty bad! <br> <br>Edit: <br>Patricia, agreed. I seriously doubt the author of that logo was working from an actual font due to the general lack of basic modulation cohesion.</p>"
