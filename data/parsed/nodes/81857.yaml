    html: '<p>Really depends where you want to go? Grunge? Comic? Handwritten? Textface? Grunge: <a class="freelinking external" href="http://new.myfonts.com/fonts/highground/scraper/" rel="nofollow">Scraper</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/astigmatic/prison-aoe/" rel="nofollow">Prison AOE</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/busted/" rel="nofollow">Busted</a>, Stuff from <a class="freelinking external" href="http://new.myfonts.com/foundry/Aah_Yes/?sort=mob#return_to_item_7" rel="nofollow">Aah Yes</a>, or sarcastic: <a class="freelinking external" href="http://new.myfonts.com/fonts/thinkdust/lippy/" rel="nofollow">Lippy</a>. Even <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/mistral/" rel="nofollow">Mistral</a> could be an option, or a mono-spaced typewriter font, which assumes authority, like <a class="freelinking external" href="http://new.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/" rel="nofollow">this one</a> or any other.</p>'
    html_clean: '<p>Really depends where you want to go? Grunge? Comic? Handwritten? Textface? Grunge: <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/highground/scraper/" rel="nofollow">Scraper</a>, <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/astigmatic/prison-aoe/" rel="nofollow">Prison AOE</a>, <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/canadatype/busted/" rel="nofollow">Busted</a>, Stuff from <a class="freelinking external link-external" href="http://new.myfonts.com/foundry/Aah_Yes/?sort=mob#return_to_item_7" rel="nofollow">Aah Yes</a>, or sarcastic: <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/thinkdust/lippy/" rel="nofollow">Lippy</a>. Even <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/adobe/mistral/" rel="nofollow">Mistral</a> could be an option, or a mono-spaced typewriter font, which assumes authority, like <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/" rel="nofollow">this one</a> or any other.</p>'
