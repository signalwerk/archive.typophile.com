      <p><a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection" rel="nofollow">United</a> is the only one I know combining both slab (/W) and sans serif (rest) in a single family with many variations in weight and width. BTW, the four upper terminals /W could easily be reconstructed with 2 overlapped /V.<br>
