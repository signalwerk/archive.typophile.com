    html: |-
      <p>Hi,</p>
      <p>thanks!</p>
      <p>@ ben_archer:</p>
      <p>Thanks, Poster Bodoni Compressed matches quite well - knowing that, I also found the cheaper alternative "Arsis" where the uppercase characters seem to look pretty much identical (the lowercase ones don't).<br>
      Why I am not redrawing it myself? Well, I'm an engineer not a graphics artist, I neither have the tools nor the skills to do it :)</p>
      <p>@skyfein:</p>
      <p>Thanks also, I checked out these fonts but they don't really match. If you look at the S on the bottle - the outside of the letter is squarish, but the inside of the S is perfectly round, and the thickness varies across the letter. Haven't found a font with these characteristics. I think that's what gives the "handmade" feel. </p>
      <p>bye,<br>
      Tillmann</p>
