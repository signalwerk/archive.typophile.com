      <p>Tillman: Check out the <a href="http://cape.ths.nu/start.php?link=fonts" rel="nofollow">Cape Arcona</a> type foundry. There are several sans serif faces with the look and feel you're after, and a few of them are free. I'm thinking of Alternative Three, C.I.A., Ginger Mint (the lowercase is stupendous), Kiss Kiss Bang Bang, and Traktor.</p>
      <p>I'm a sign painter and a huge fan of naive typography. Hence, my enthusiasm! =) </p>
      <p>Skylar</p>
