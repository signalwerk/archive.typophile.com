    <p>Hi,</p>
    <p>I'm looking for a font used for old pharmacy bottles. I have two types of font, any one would be fine, though I would personally prefer the "PHOSPHOR." font.</p>
    <p>These fonts in the picture are hand-drawn, so no 100% match is possible (tried the What The Font website, no luck), but I'm sure very similar fonts must exist.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bottles-s_3434.jpg"></div><p></p>
    <p>Any suggestions? (Preferably free fonts)</p>
    <p>Best regards &amp; TIA,<br>
    Tillmann</p>
