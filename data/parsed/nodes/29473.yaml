      <p>Hi Tillmann</p>
      <p>(Question) If you want them for free, and you know they are hand drawn to begin with, what is stopping you from redrawing them yourself?</p>
      <p>The Sol.Zinc.Sulfur lettering is a fat face – something like <a ref="http://www.linotype.com/1363/posterbodoni-family.html" rel="nofollow">Poster  Bodoni Compressed</a></p>
      <p>The Phosphor.Sol lettering is some kind of mangled sans serif (of which there are many available as freebies on the web), but I don't know what it might be called. Probably someone else here knows what it is...</p>
