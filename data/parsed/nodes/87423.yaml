    <p>Hello,</p>
    <p>I am looking to identify the font in the attached picture which is used in the new video game: Call of Duty: Modern Warfare 3.</p>
    <p>At first glance, it looked to me like a fairly common font but i could not find one that fit it exactly.</p>
    <p>I was hoping this community could shed some light. </p>
