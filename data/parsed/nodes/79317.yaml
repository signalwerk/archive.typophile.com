    <p><strong><a href="http://www.amazon.com/gp/product/1933360429?ie=UTF8&amp;tag=onst-20&amp;linkCode=as2&amp;camp=1789&amp;creative=390957&amp;creativeASIN=1933360429" rel="nofollow">The Bentons: How an American Father and Son Changed the Printing Industry</a></strong><br>
    Patricia Cost<br>
    $24.95, 372 pages, Published by RIT Cary Graphic Arts Press<br>
    ISBN 978-1-933360-42-3</p>
    <p>Linn Boyd Benton and Morris Fuller Benton may be the most under-appreciated giants in the history of printing. The former was a natural engineer whose skills made him to printing what Tesla was to electricity. The latter was an engineer and one of the greatest type designers. Both were hardworking and humble men from Wisconsin. They cast a long shadow over printing and typography that has often been obscured by the lack of information they left about themselves.</p>
    <p><a href="http://www.dunwichtype.com/?p=1364" rel="nofollow">You can read the rest of this review at DunwichType.com</a></p>
