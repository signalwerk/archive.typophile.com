    html: |-
      <p>I like the logo very much. I like the colors very much. But...</p>
      <p>There's too much going on that distracts from these great elements. The rounded corners of the logo's frame square don't match the style of the logo, and frankly, it's altogether unnecessary. If it were me, I'd scrap the square altogether or use it to encompass both logo and logotype (perhaps knocking out the logotype in white or a lighter color?)</p>
      <p>The yellow knobs on the barbell need a smidgen more air to match the logo's other spaces.</p>
      <p>The multicolor logotype isn't working for me. I'd use the darkest gray (only) from the logo square for the logotype. The scale is off, too - why is it so small compared to the logo? If you're going to have the barbell crushing the logotype, it needs to be look more intentional. :)</p>
      <p>Have you searched for a font with more character? Perhaps something with more width (something burly like <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/dienstag/black/" rel="nofollow">Dienstag</a> or even <a class="freelinking external" href="http://new.myfonts.com/fonts/thinkdust/taku/" rel="nofollow">Taku</a>) may compliment the logo better. Right now, the logotype looks wimpy and disconnected -  like an afterthought.</p>
      <p>Now that I've torn it apart, let me add that I think it's pretty cool and headed in the right direction. The colors are especially pleasing, and work well to attract men and women to a fitness store, which I think can be quite hard. Well done.</p>
