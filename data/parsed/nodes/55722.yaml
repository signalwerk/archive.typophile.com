      <p>Sorry, I did not see the first draft of this logo but hope I can make some helpful comments on what has been posted.</p>
      <p>1. The newest version is now too spread out; The size of the letters is better but I would keep the kerning you had previously and move the type closer to the logo.</p>
      <p>2. The white between the handle and the darker weights is smaller than the other spaces. My eye also goes to the rounded corners on the crossbar as they are the only thing not geometric about this logo and type.</p>
      <p>3. There are too many gray's for my taste. Keep this version but make another that uses the darkest gray for the type and the weights (crossbar can stay orange).</p>
      <p>Hope that helps. Good luck.</p>
