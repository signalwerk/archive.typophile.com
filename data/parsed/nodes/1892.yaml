    html: <p>"Lieberman's description sounds like something you'd write in a last ditch attempt to prevent people from realizing that Gutenberg really invented nothing of relevance first. The Koreans did. Just like Columbus didn't discover America (nevermind that there were people there already), he was one of the last to get there." <br> <br> <br> <br>Hrant <br> <br>Gutenberg nor any of the early printers of the incunabula ever claimed to have "invented" mechanical writing. They had seen Asian currency. The word used was "perfected," to mean "improved on." Invention is a later historical term. <br> <br>Nor did Columbus' claim to have found a land that was not previously known (terra incognito) to Europeans mean that he somehow invented it and its peoples into existence. <br> <br>He and many other Europeans knew something was there. Based on previous ocean expeditions it was clear to earlier navigators that a land mass must have existed right where Columbus found it. There were "speculative" maps of such available to Columbus. He, in fact, used them, deceivingly, to deliberately reduce his supply request to get approval for financing. He knew approximately how far to go, and supplied only as much as needed to get there. <br> <br>He wasn't trying to prove the Earth was round or even trying to find the Asian landfall. Or to claim or invade new lands for his benefactors. I have read his "letter" on the discovery (the first "news" ever put to print on European presses) and his diaries. This man was hardly a conquistidor. He did not share the subsequent European political agenda in regard to the "discovery." <br> <br>Gerald</p>
