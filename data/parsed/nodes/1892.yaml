    html: <p>John <br> <br>When did the Frankfurt bookfairs begin? <br> <br>Aldus was a bit more than that though... He also made smaller sized books for a speculative market, printed in languages other than Latin, introduced a slew of informational design elements (most of which are standard in books today), begin printing classical Greek works, scientific materials, etc. He is actually considered the first of the scholar-printers.  <br> <br>Much of the earlier incunabula was commissioned or directed at an existant and clearly defined market. Don't know that this makes much of a definitional distinction. But I recall that the 42-line Bible itself might have been a commission of the Church; as it seems to have been financed by it and most copies were dispersed to various elements of the Church upon completion of the project. I know there were copies available for sale to the established book market though as Fust apparently died of the Black Plague on a selling trip. <br> <br>I guess this could or could not lend some credance to the idea of it being a publishing venture of sorts. Though one can easily say that even the wood block playing card printers, who existed for some great long time prior to Gutenberg, could be considered publishers. <br> <br>Gerald</p>
