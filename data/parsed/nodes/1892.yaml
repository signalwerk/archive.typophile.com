    html: "<p>Gerald, I wan't intending to downplay Aldus' contribution, only trying to distinguish his contribution to the publishing model from his contribution to typography. You are correct about the importance of the pocket editions, printing in the vernacular and Greek, etc. <br> <br>I don't know what the date of the first Frankfurt bookfair was, but I remember being struck in a book I was reading by the fact that within Gutenberg's own lifetime this recognisable publishing industry was in place. Most likely it was, as you suggest, built on top of a pre-existing market for manuscript books, and perhaps the Frankfurst fair existed in some form <i>before</i> the early printer-publishers began travelling across Europe both selling their books and buying manuscripts for new ones. I didn't claim that Fust &amp; Schoeffer were the first publishers: I said that they appear to have been instrumental in creating a system for producing and distributing books that is recognisable in publishing to this day.</p>"
