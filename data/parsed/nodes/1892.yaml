    html: '<p>Seth <br> <br>The Toppan Printing Museum in Tokyo issued a beautifully illustrated catalog in 2000 titled _Printing in the Edo Period: Ieyasu: Typographic Man_. This is still in print and available from them. <br> <br>It was essentially put together to counter Western claims and does a very good job of it. Chinese, Japanese, and Korean methods of casting letterforms are thoroughly examined. Photographs reveal the casting molds, cast characters, etc. <br> <br>Many earlier cultures cast coins and medallions and the similar in like molds. As did the Europeans. It just never occurred to the latter to make the leap. But when they did they had several great advantages over those that gone before:  very advanced and progressive "mechanics" (the idea, not the job description!!!), manufactured interchangable parts and tools (and the marketing for it), an intense knowledge of metallurgy (thanks to the alchemists), and, of course, a very easily reproducable letterform (that of the textura) and a written language that had been compressed into a very small number of characters. <br> <br>Stamping and casting techniques go back as far as the beginnings of written languages (repeatable stamping can be found in cave paintings), but the roads traveled were clearly separated and seem not to have crossed. The techniques of writing and those that would have allowed the exact reproduction of letterform (with some exception, such as the Phaistos stone) were ideas not put together until relatively late in the historical model. <br> <br>Gerald</p>'
