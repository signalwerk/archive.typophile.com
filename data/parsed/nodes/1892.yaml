    <p>I'm currently teaching English in China, and as part of a series of lectures on 'ideas that changed how the western world thinks', I'm working on one about the invention of movable type.  What I can't find (in English anyway) is the history of the use of this technology in China.  If anyone has any pertinant information (when, where, size of collections, distribution, etc...) please help. <br>I am intentionally avoiding using the term "printing press" as there is some dispute here as to when and where it was invented.</p>
