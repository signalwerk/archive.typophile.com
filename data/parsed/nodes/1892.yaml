    html: <p>Twitchett, Denis. <i>Printing and publishing in medieval China.</i> 1983 <br> <br>Carter, Thomas Francis, <i>The invention of printing in China and its spread westward.</i> 1930s? <br> <br>See also Part 1 of Volume 5 of <i>Science and civilisation in China</i> edited by Joseph Needham and Tsien Tsuen-Hsuin (Cambridge, 1985). <br> <br>Despite the title of Carter's book, I'm not sure that any solid evidence exists to link the invention of moveable type in China to that in Europe. Rather, these seem to be independent inventions.</p>
