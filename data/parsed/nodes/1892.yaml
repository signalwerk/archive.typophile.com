    html: <p>William <br> <br>Yes, I believe that would be correct. But just as popular history distorts the reality of "the invention of printing," so to it may have distorted the identity of the "inventor" as well. <br> <br>We only really know, from any documented evidence, that Gutenberg was involved in various projects (that somehow involved the idea of printing) for some twenty years before the publication of the Bible. It is assumed from these that he did come up with the adjustable type casting mold. And it can be assumed, from the legal documentation regarding the contracting of the Bible, that he had something to do with outfitting the presses and assembling the preliminary materials necessary for the printing of it. Nothing much more than that. <br> <br>Likely there were several people working on the similar idea of producing a form of mechanical writing. There are unidentifiable artifacts (experiments?) in existence. In regard to the Bible itself, the significant contributions of Fust and, particularly, Schoeffer (a trained copyist) seem to have been driven down by popular history. Yet the book is so perfect in its production that it seems a bit odd that a mechanical wizard would be attributed to its printing when the ability to design a highly sophisticated typeface, and develop the composition for a book would likely have been beyond his skill and knowledge. Renaissance man or no, there is just so much one can master. The previous and later printing that can be conceivably "attributed" to Gutenberg, bear none of the hallmarks of the Bible printing (with the exception of the unique ink formulation). <br> <br>Gerald</p>
