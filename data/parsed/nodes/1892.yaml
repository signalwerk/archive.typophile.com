    html: "<p>J.Ben Lieberman in 'Types of Typefaces': <br> <br>What Guttenberg invented was a combination of processes and materials: he found a way to cast metal type with precision and in quantity; he found an ink that would stick to metal (as Chinese ink could not); he contrived a \"chase\" to hold the letters to provide the tremendous pressure the sticky ink needed; he devised a way to deliver the printing stock (paper) without smudging, and to allow \"register\" or uniform placement of each sheet. All of these things had to be accomplished--and put together--before the new kind of printing could be done. ...Furthermore, he did it at the time... when there was enough demand for printing to motivate moneyed men to invest in the work and materials. </p>"
