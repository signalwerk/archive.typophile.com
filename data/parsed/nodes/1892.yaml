    html: "<p>If Gutenberg can be credited with a novel invention -- not a new concept, but a new device -- it is probably the European type mould. Of course, type moulds of some kind must have existed in Asia, but I've never seen one or a picture of one. Indeed, pictures of European moulds are very few in number, and only a handful of later renaissance examples survive. So rare is their depiction in illustrations of the type making process that it is assumed that, like the equally rare counterpunches, the moulds were a trade secret. <br> <br>I've seen the <i>Diamond Sutra</i> several times, and it is very beautiful, but certainly not as well printed as Gutenberg's 42-line Bible. The use of the term 'perfected' in describing Gutenberg's contribution is apt. <br> <br>In terms of inventing a 'system', the contribution of Fust &amp; Schoeffer is often overlooked: they invented the system we call publishing, <i>i.e.</i> the production and marketing of books.</p>"
