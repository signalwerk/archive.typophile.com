    <p>Hi</p>
    <p>I have been racking my brains over this one, but can’t come to any conclusions. I need to license a text typeface for a company that facilitates tax pooling transactions. As the transactions will be web based, I feel that it needs to be clean, serious and contemporary but not too bland and lifeless. I am thinking sans, but will not rule out a serif. The typeface will be used for printed collateral and possibly a little bit for screen, but not at tiny resolutions. Any suggestions will be gratefully received!</p>
    <p>Kris.</p>
