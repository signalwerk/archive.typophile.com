      <p>Sorry Stephen, these really aren’t quite there :(</p>
      <p>Unit is too blah, Zwo is too, I hate Daxline, Freight Micro is great but not the sans, Amplitude hasn’t any italics, Klavika is slightly too mechanical, Monitor is too square, Vista too organic and Whitney too generic. </p>
      <p>They are all great suggestions, however. Strada is really interesting, however. It may be slightly too organic for this, but it has shot to the top of my “must get” list never-the-less! </p>
      <p>Any others?</p>
