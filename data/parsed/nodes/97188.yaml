    html: |-
      <p>I would consider not setting the descriptions of the briefs all in uppercase. </p>
      <p>In your infographics project you need to align the figure icons.</p>
      <p>In the interviews for the Perfect Brief, there is something strange happening with the text, the lowercase r appears smaller than the x-height. You might also try a narrower measure and/or ranging the text left. There are also some spelling errors in the flow chart which do not give a good impression.</p>
      <p>I would also edit the illustrations section.</p>
      <p>Overall there are some strong graphics, but I think weeding out some of the weaker work would serve you better.</p>
      <p>Tim</p>
