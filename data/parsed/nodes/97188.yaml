    html: |-
      <p>The r quirk in the interviews is an idiosyncrasy of Helvetica's on-screen hinting.</p>
      <p>I too would consider maybe using a different color for the briefs, instead of all caps.</p>
      <p>It seems a bit strange to me to do a portfolio in the form of a blog, with comments etc. I would try to disable some of the bloggier features of Wordpress. Also, you should get your own URL that doesn't say Wordpress.</p>
      <p>All that said, I do really like some of your work, particularly the layouts in the project on poverty.</p>
