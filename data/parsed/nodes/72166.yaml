    <p>Hello, I am a typedesigner from Mainland China.<br>
    Following Simplified Chinese fonts are designed by me. The font has completed 6763 characters.</p>
    <p><a href="http://typophile.com/files/22334.jpg" title="http://typophile.com/files/22334.jpg">http://typophile.com/files/22334.jpg</a></p>
    <p>While I was using the  contracting lor  function of 'Bold' of 'Transform' of AsiaFont Studio 4, there was a problem:</p>
    <p><a href="http://www.douban.com/photos/photo/544307011/#next_photo" title="http://www.douban.com/photos/photo/544307011/#next_photo">http://www.douban.com/photos/photo/544307011/#next_photo</a></p>
    <p>some straight line becomes curves, and some parts are not reasonably transformed. May you kindly tackle my problem?</p>
    <p><a href="http://www.douban.com/photos/photo/544307201/#next_photo" title="http://www.douban.com/photos/photo/544307201/#next_photo">http://www.douban.com/photos/photo/544307201/#next_photo</a></p>
    <p>although the function of 'to lines' of 'convert' could transform curves into straight lines, but have to do it one by one.... so are there any ways that could convert a batch of lines?</p>
    <p><a href="http://www.douban.com/photos/photo/544307365/#next_photo" title="http://www.douban.com/photos/photo/544307365/#next_photo">http://www.douban.com/photos/photo/544307365/#next_photo</a></p>
