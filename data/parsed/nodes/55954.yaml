    <p>Can you give me some suggestions about fonts that would nicely complement Berkeley or Californian typefaces. May be sans or serif...</p>
    <p>I've been looking at Optima, but I don't really like for the lack of true italic. Otherwise shapes could complement each other.</p>
    <p>So I'm looking for other alternatives as well.</p>
    <p>Thank you.</p>
