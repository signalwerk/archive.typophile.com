    html: |-
      <p>Sorry not to tell anything more. I thought OK I've chosen Berkeley and need something with the same contrast that will be mixed with it without intrusion.</p>
      <p>Anyway. I'm working on a magazine targeted at affluent readers. I didn't want to go with something usual. I've chosen Berkeley because of it's character and stroke modulation beauty. But I also need a different one to complement it. Either contrast or just sans serif with same overall contrast/colour.</p>
      <p>I hope this helps. Oh. One more thing. Affluent readers yes, but content will not be about fashion and accessories. So I immediately put all Script/Swash/Modernist (like Bodoni) fonts out.</p>
      <p>___________<br>
      <em>Robert Koritnik</em></p>
