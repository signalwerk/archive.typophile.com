      <p>@donshottype:<br>
      <cite>Indeed, in some jurisdictions the governments have active programs to eradicate product names that use the apostrophe.</cite></p>
      <p>Now that's odd. Of course, in Quebec, they have been eradicating signs in languages other than French, so Eaton's became Eaton... instead of, say, Chez Eaton.</p>
      <p>@ChristTrekker:<br>
      <cite>Of course, the way the writer made it look "alien" was to put apostrophes in odd places.</cite></p>
      <p>So they stand for glottal stops, and thus are an essential part of the name, just like the vowels and consonants.</p>
