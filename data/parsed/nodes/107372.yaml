    html: |-
      <p>Character U+0027—I don't want to use anything outside 7-bit ASCII in any identifier, because I'm not sure what kind of support it would have in older operating systems. </p>
      <p>I'm aware the PS name has limitations; not even spaces are allowed. What I'm not sure about is whether there are any filesystems that would choke on apostrophe in a filename, or common APIs that wouldn't like it in another identifier.</p>
      <p>AFAICT, it should be alright to specify for web use, as long as one escapes the apostrophe properly in CSS. In practice, some browsers may have problems. For instance, FF25 doesn't like the name inside a single-quoted string, even when escaped. (Should probably file that as a bug.) Putting it in a double-quoted string works fine w/o escapes.</p>
