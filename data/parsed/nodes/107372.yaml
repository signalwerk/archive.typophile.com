    html: |-
      <p>Do you really need to use the apostrophe in your font names/ID? The English language uses the apostrophe for possessives but most other languages get along fine without it. An apostrophe would not be helpful for non-English language customers. Indeed, in some jurisdictions the governments have active programs to eradicate product names that use the apostrophe. I decided not to use it for "donshottype" or any of my fonts for international reasons as much as for the problems with font field naming.<br>
      Don</p>
