      <p>What do you mean by "ID"?</p>
      <p>Some of the name fields involved in a font do not allow apostrophes, such as the PostScript font name.</p>
      <p>Also, what do you mean by apostrophe? The typewriter mark, or a true curly apostrophe?</p>
