    html: |-
      <p>Ken, indenting the first line is the traditional way to do this, but not the only one. The reason to use an indent is to indicate "this is a new paragraph". But if you have another graphic resource to do this –as space between paragraphs– it's perfectly valid if it fits your layout.</p>
      <p>Space between paragraphs was a difficult thing to use until electronic desktop publishing arrived. Text pages were set based on leading grid and everything needed to fit in a multiple of the leading –say, 12pt, 24pt, 36pt etc. When there was another graphic element to clearly indicate a new paragraph (as a previous subtitle), the indent was not necessary.</p>
      <p>Nowadays, you don't need to be limited to these grids. You can use measures like a 10.25pt type size in a 13.7pt leading without technical problem. You can also use space before and after paragraphs and then vertically justify the text to always fill the page limits.</p>
      <p>Of course, most of the books still use the traditional way –indents and no space between paragraphs. It's more easy to do, always work and saves space. But this is a choice, not a rule.</p>
      <p>You can see some great publications using the no-indent-with-space method, as London's New Left Review award-winning graphic project. It's especially good in layouts with generous margins. The negative indent is good to reference texts, as dictionaries, encyclopedias and technical glossaries. The way Nick described is also very interesting.</p>
