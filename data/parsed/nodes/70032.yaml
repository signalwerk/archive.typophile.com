    html: |-
      <p>I prefer to use space between paragraphs and no indent at all. Usually, a 1,5mm to 2,5mm does the job, according to your leading/layout.</p>
      <p>There is also negative indent: the first like begins at the marign and the remaining are indented. To get this you apply a left indent to the paragraph (say, 10mm) and a negative indent to the first one (-10mm).</p>
      <p>Except this, I don't see other good ways. In onder times there are bullets marking the begin of a paragraph (as you may find in some iluminuras and medieval documents). But this is hardly a choice for any contemporary text.</p>
