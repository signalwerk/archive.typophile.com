    html: |-
      <p>It really depends on the kind of publication.<br>
      In a book, where the verso shines through, you want to stick to your baseline grid, period.* Using arbitrary spaces between paragraphs may seem like a good idea in theory, and look good in InDesign too, but not once you hold the physical object in your hand and the stuff that shines through is shifted all over the place.<br>
      And I wouldn't even call that a limitation. It's being mindful of how the medium behaves, physically.<br>
      (* Unless of course you break it consciously, there's a reason for it, and you know what you're doing.)</p>
