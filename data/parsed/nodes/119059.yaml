      <p>I knew I've already seen this one... About 'Gladiator' this time, another Ridley Scott's movie: <a href="http://www.typophile.com/node/117569" title="http://www.typophile.com/node/117569">http://www.typophile.com/node/117569</a></p>
      <blockquote><p>Can't find a match for the complete lettering. You're right, that could be a mash-up. /C, /O and /G look very "<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/avant-garde-gothic" rel="nofollow">Avant-Garde Gothic</a> and the rest close to <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/aviano-sans" rel="nofollow">Aviano Sans</a>, <a class="freelinking external" href="http://www.typography.com/fonts/idlewild/overview" rel="nofollow">Idlewid</a> or <a class="freelinking external" href="http://www.google.com/fonts/specimen/Syncopate" rel="nofollow">Syncopate</a>. Still searching...</p></blockquote>
      <p>Adding <a class="freelinking external" href="http://www.houseind.com/fonts/luxuryfonts" rel="nofollow">Luxury</a> Gold, <a class="freelinking external" href="http://www.myfonts.com/fonts/positype/halogen" rel="nofollow">Halogen</a> and <a class="freelinking external" href="http://typography.net/fontfamilies/view/42" rel="nofollow">Capline</a> to the list. 'DECEMBER' BTW is Aviano Sans.</p>
