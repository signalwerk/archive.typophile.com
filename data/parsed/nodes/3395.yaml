  html: <p>I'm looking for a better way to remove node overlap, or more specifically, two nodes occupying the same coordinate. <br> <br>I remember reading something about fontlab 4.5 introducing a tool that would remove node overlap by, presumably, expanding the outline of the font by a tiny increment and then merging the contours again. <br> <br>Is this feature or something like it unique to the python scripts? If so, I've got an afternoon of troubleshooting ahead, trying to get python to run on my mac. <br> <br>If there is any way to achieve the same thing natively in the software, it would be great. <br> <br>From this... <br><img src="http://www.typophile.com/forums/messages/4101/27605.gif" alt=""> <br> <br>To this... <br><img src="http://www.typophile.com/forums/messages/4101/27606.gif" alt=""></p>
  html_clean: <p>I'm looking for a better way to remove node overlap, or more specifically, two nodes occupying the same coordinate. <br> <br>I remember reading something about fontlab 4.5 introducing a tool that would remove node overlap by, presumably, expanding the outline of the font by a tiny increment and then merging the contours again. <br> <br>Is this feature or something like it unique to the python scripts? If so, I've got an afternoon of troubleshooting ahead, trying to get python to run on my mac. <br> <br>If there is any way to achieve the same thing natively in the software, it would be great. <br> <br>From this... <br><img src="http://www.typophile.com/forums/messages/4101/27605.gif" alt=""> <br> <br>To this... <br><img src="http://www.typophile.com/forums/messages/4101/27606.gif" alt=""></p>
