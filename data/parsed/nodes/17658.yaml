  html: |-
    <p>Dear Readers,<br>
    I have been selected to teach design in a night school for adult vocational training. They will be starting with no design experience. The class is seventy two hours in eight weeks. My great desire is to teach them true classic design including elegant and legible typography. Does anyone have syllabuses, lesson plans, pointers, warnings, and resources, which may help. If so, I would be grateful.</p>
