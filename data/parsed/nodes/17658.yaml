      <p>Start with:</p>
      <p>1. Designing with type by James Craig<br>
      2.Type Rules by Ilene Strizver<br>
      3.The new graphic design school by Alan Swann<br>
      4. Graphic design solutions By Robin Landa (third edition)</p>
