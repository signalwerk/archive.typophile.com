    <p>To help revive the type sections of the Typophile Critique Forum (and as my first official moderator shin gig), I'd like to inaugurate a trial <strong>»Critique Thursday«</strong> this Thursday, August 18th.</p>
    <p>The critiquing will take place right here on Typophile, from 1–3 pm Eastern Standard Time (that should be 10 am–12 noon in California, 19:00–21:00 in Central Europe, etc.).</p>
    <p>I'll select one thread from each typeface style sub-section within the critique forum for special critique. That thread will have its name changed, just like marked threads in the Type ID forum. Everyone is invited to send some time in the alloted time slot checking out those threads and making great suggestions.</p>
    <p>I haven't selected any types yet. If anyone has suggestions, just e-mail 'em to me. Self promo is ok ;-)</p>
