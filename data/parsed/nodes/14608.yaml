    html: |-
      <p>Well, I'm still glad that I was able to shed so much light on so many fonts in so little time, but going forward, it just won't be practical to highlight one font per category: some categories have way less fonts in them.</p>
      <p>So, tomorrow (<a href="http://typophile.com/node/14813" rel="nofollow">http://typophile.com/node/14813</a>), I'm only going to feature two fonts.</p>
      <p>Here's some discussion I most definitely would like some feedback on: post numbers.</p>
      <p>I've received several requests from designers wanting their fonts to be selected for critique, which is great. But some of those fonts have a lot of posts on their threads already (one even has 70+). I'd much rather pick out fonts that have gotten less attention… I think that Critique Thursday would be of more benefit to those designers than to others who have already gotten a lot of feedback from the usual suspects (posters like Paul and Hrant, without whom, there really wouldn't be much of a critique forum to discuss). Of course we want as many people to post, but I think that is more likely to happen if so much hasn't been covered yet.</p>
      <p>???</p>
      <p>And to Hrant's suggestion about prizes: I think that is a great idea, but I also don't think that we are ready for something like that yet. There needs to be much more volume of posting, I think, and some real "objective" judging process. And prizes. I don't have any toys yet to give away… :(</p>
