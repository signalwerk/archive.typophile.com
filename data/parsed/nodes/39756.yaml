    <p>Following the thread</p>
    <p><a href="http://typophile.com/node/39487" title="http://typophile.com/node/39487">http://typophile.com/node/39487</a></p>
    <p>I launched CS3, created a new document, and using the glyph pallet, put in “Alpha” “gamma” then a space, then “gamma” “eta” using our version of the Greek Font Society Olga (GFSOlga.otf) font. The kern feature for the GFSOlga font says “Latin”. The kern feature for our version has no language tag at all — the kern values are just entered. But with our version, the kerning values in the features do in fact appear in the little CS3 test document.</p>
    <p>Then I checked the foundry GFS font (with the “Latin” tag). It too worked. Now this is just a new document without any paragraph or characters styles, is that the issue (We’re still using CS2 in production).</p>
    <p>Why can’t I get the problem mentioned in the earlier thread?</p>
