      <p>Many current font names are either Anglo- or Germanocentric.</p>
      <p>A font name better be reasonably short—at the maximum, three syllables—and easy to say. Just think of a string of style names that may follow a family name, like “ultrabold extra compressed oblique”. If the typeface is multilingual its name should be easy to transliterate to other (non-Latin) scripts, and easy to say for the target users. Arno, Bembo, Octava, Pepita are easy; Haettenschweiler, Benguiat Gothic, Cheltenham Handtooled, Agedage Cancelleresca, Berthold Englische Schreibschrift are not.</p>
