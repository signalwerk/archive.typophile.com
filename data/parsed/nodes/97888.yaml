      <p>The name is very important.</p>
      <p>It has to have the right feeling, it has to make a designer want to see what the font looks like, and hopefully confirm what the designer thinks it would look like. Choose a name that sounds right (doesn't have to be a positive sound or meaning) and that brings attention to what makes the font special when set in that font.</p>
      <p>And what Héctor said.</p>
      <p>One of the best-named fonts is Newlyn's "Luvbug". Another really good one is Parkinson's "Azuza" (not least because it's "misspelled" so does not get overwhelmed with search results against the SoCal city).  I've helped name other people's fonts (like Sindre's "Satyr"*) and have pages of names ready to go; making as many fonts is another matter.  :-/</p>
      <p>* <a href="http://typophile.com/node/81129" title="http://typophile.com/node/81129">http://typophile.com/node/81129</a></p>
      <p>hhp</p>
