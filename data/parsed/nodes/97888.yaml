      <p>There may be a current imitation of Palatino called Book Antiqua, but, of course, Book Antiqua was a name considered for Palatino before it received its current name. (EDIT: My memory was playing tricks on me. It did have a different original name, but that was "Medici". In addition to Aldus, actually Aldus Buchschrift, there were also two differently-named titling forms of Palatino, <a class="freelinking external" href="http://www.identifont.com/find?similar=Michelangelo&amp;q=Go" rel="nofollow">Michelangelo</a> and <a class="freelinking external" href="http://www.identifont.com/find?similar=sistina&amp;q=Go" rel="nofollow">Sistina</a>.)</p>
      <p>And, for that matter, the typeface that probably ought to be called Palatino Book is, of course, instead known as Aldus - and it is not as widely used as it deserves to be - and so this typeface provides <em>two</em> studies in the choice of name for a typeface.</p>
