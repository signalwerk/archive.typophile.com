      <p>I always thought that Palatino was a great name, from the ﬁrst time I came across the typeface in the 1970s.<br>
      Immediately, it conveys the patina of classical antiquity (if one knows a little about Ancient Rome), and the capital P is a distinctive feature of the face, its open counter also referring to the style of antiquity.</p>
      <p>The allusion to Antiquity is appropriate for a design which follows the principle of the ﬁrst humanist types, basing letter forms on broad-nibbed scribal styles that are considered to be classical and ancient.</p>
      <p>While Renaissance styles of type had been revived since the days of Morris, and designers such as Goudy had produced new designs in the Renaissance idiom, they had referred to the printed tradition. What Zapf did with Palatino was address the process, which is what made it so radical and of its own time. The name, in providing a type-historical critique of the face’s genesis, may even suggest that the design is Post-modern.</p>
      <p>Book Antiqua is a phony name, seeking to deny the plagiarism of a clone by asserting that the original is generic.</p>
      <p>So yes, <em>semantics</em>!</p>
