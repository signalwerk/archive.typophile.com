      <p>Well, Palatino was so successful that it inspired numerous copy cat fonts, including Book Antiqua. I don't think Book Antiqua has been marketed per se, so much as served as a stand in for an already popular font to get around licensing issues (presumably). It's all a moot point since a single company now owns the rights to both faces.</p>
      <p>That said, the name Palatino has not seemed to stand in the way of its success. Hard to say how much it contributed.</p>
