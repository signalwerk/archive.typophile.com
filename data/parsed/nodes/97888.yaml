    <p>Naming a typefaces is probably one of the greatest pains that comes with typographic design. As usual, my list of name alternatives grows faster than a rabbit population, and the chance to decide upon one falls into the deep. One is tempted to eeny-meeny-miny-moe... but there's this other mind:</p>
    <ol>
    <li>To which extent is the name of a font a catalyst for good sales?</li>
    <li>How important are these characteristics in your opinion?: (e.g. Is <em>Palatino</em> a name as good as <em>Book Antiqua<em>?)</em></em></li>
    <ul>
    <li>Semantics.</li>
    <li>A name that relates to yourself.</li>
    <li>A ‘good looking’ name.</li>
    <li>A ‘good sounding’ name.</li>
    <li>Great number of letters with different characteristics (a show-off name).</li>
    <li>Length of the name.</li>
    <li>Single word vs. multiple words.</li>
    </ul>
    </ol>
    <p>Note that I just want to know your personal priorities, not which one you think is ‘the most efficient’.</p>
    <p>Examples of names you like (whatever the reason) are also appreciated.</p>
