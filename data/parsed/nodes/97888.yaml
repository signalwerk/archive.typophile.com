    html: |-
      <p>Coming up with a name which has some relation to the design of the typeface seems most appropriate but I've never really done that. I guess it's somewhat logical as I rarely have a central design philosophy behind my typefaces. Considering my last name is Silvertant however I do have some options for personal typefaces which refer to my name. I do want to name one typeface after myself.</p>
      <p>Generally though I give my typefaces names which to me resemble the design. I'm aware it's very subjective and it might not work for others, but I like how personal the name is. Each word invokes a certain feeling or atmosphere so I do try to match that to the typeface.</p>
      <p>I do however make sure it's not hard to market. I won't use names which are very long or very complex, I never use names consisting of more than one word (descriptive names like Sans, Serif, Grotesk etc. not included) and if there is a character in my typeface I feel needs to be shown prominently I try to include it in the name. I also try to show several letters and TRY to avoid a repetition of letters.</p>
      <p>I also want my typefaces to be easy to pronounce, but I don't make sure that it will be pronounced in only one way. I tend to use Dutch words sometimes and I'm fine if people pronounce it differently than I do or don't know the meaning of the word.</p>
      <p>By the way, I always wondered how you're supposed to pronounce Calibri. Does anyone know? Cálibri or Calíbri? As a Dutch person I use the first pronunciation as it's similar to the Dutch 'kolibrie' (hummingbird). I can imagine most people will use the second pronunciation though. As Lucas de Groot is Dutch I wonder if he had intended a certain pronunciation or he doesn't quite care either.</p>
      <p>Do you feel like the pronunciation should be a specific way or don't you care about the pronunciation of your typefaces?</p>
      <p>Agedage Cancelleresca... I feel like this one goes too far in terms of pronunciation, either way. 'Agedage' sounds terrible no matter how I pronounce it.</p>
