    html: |-
      <p>Thank you for being so straight. It's obvious - now you've said it - but somehow I'd missed it. Or at least some of it; I realise the ink splatters are a bit dated and personally wouldn't use all-lowercase in this instance but they are key parts of the corporate guidelines. I see it as a challenge to incorporate them tastefully but clearly haven't achieved this as yet! I need to give this a lot more thought.</p>
      <p>Many thanks.</p>
