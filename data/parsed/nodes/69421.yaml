    date_raw: 14 Apr 2010 — 7:12am
    votes: null
    html: <p>The problem isn’t the type, it’s the clashing styles. Here you’re mixing an old iPod ad style, an old ink splatters style, and then piling on hyper-extended three-dimensional type in three colors. Then there’s some all-lowercase type, light type, AND a logo that doesn’t really work with most of the above. You need to pick a single idiom for this project instead of creating a mashup of dated styles.</p>
