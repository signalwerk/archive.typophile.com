    <p>Greetings, I am new on the forum and I am looking for this source since days ago. It is from a Star Wars comic “Jedi Quest” published by the editorial Dark Horse Comics in 2001, although they have also used the same font in many other series. I have looked and looked at hundreds of sources, but I do not find any similar. I would be very very grateful for your help. </p>
    <p><a href="http://img278.imageshack.us/img278/4827/starwarsjediquest02243fz.jpg" title="http://img278.imageshack.us/img278/4827/starwarsjediquest02243fz.jpg">http://img278.imageshack.us/img278/4827/starwarsjediquest02243fz.jpg</a></p>
