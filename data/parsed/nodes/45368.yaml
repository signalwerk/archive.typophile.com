    html: |-
      <p>&gt; <em>Does this enable online type testers to have the functionality of the FontLab preview window?</em></p>
      <p>Yes, I believe so. However, I don't think the API will allow you the level of granularity to turn on/off every single feature, like the FontLab Preview does. Remember, the API is supposed to give you access to the functionalities of the text engine, not to the functionalities of the font itself. You get to the font's functionalities indirectly through the text engine.</p>
      <p>For those who can't wait to start developing content for FP10 Beta, <a class="freelinking external" href="http://theflashblog.com/" rel="nofollow">Lee Brimelow</a> has put together a videocast that explains it all very well: <a class="freelinking external" href="http://www.gotoandlearn.com/player.php?id=73" rel="nofollow">Flash Player 10 Beta: Getting Started - This tutorial shows you how to get started with creating content for Flash Player 10</a></p>
      <p>And if you want to see something happening right on your browser, <a class="freelinking external" href="http://labs.adobe.com/technologies/flashplayer10/" rel="nofollow">install the Beta from the labs</a>, <a class="freelinking external" href="http://labs.adobe.com/technologies/flashplayer10/demos/" rel="nofollow">go to the Demos page</a>, and click on the "New Text Engine" button. There you'll be able to interact with the 2-column text layout, and download the source code, like so,</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/fp10beta_6228.png"></div><p></p>
