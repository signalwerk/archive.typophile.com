    <p>The Beta version of Adobe Flash Player 10 was just released on Adobe Labs. Among the many enhancements, there is a new Text Engine which comes along with an extensive library of ActionScript 3.0 Text Layout Components. Here's the blurb from the <a class="freelinking external" href="http://labs.adobe.com/technologies/flashplayer10/releasenotes.html" rel="nofollow">release notes</a>.</p>
    <p><em><strong>New Text Engine</strong><br>
    A new, highly flexible text layout engine, co-existing with TextField, enables innovation in creating new text controls by providing low-level access to text layout and interactivity APIs to create component-level text objects.  The new text engine expands creative freedom by treating device fonts as first class citizens that can be anti-aliased, rotated, and styled and have filters applied as if they were embedded.  The new text engine also offers right-to-left and vertical text layout, plus support for typographic elements like ligatures.</em></p>
    <p><strong>Text Layout Components</strong><br>
    An extensible library of ActionScript 3.0 text components, coming in future to Adobe Labs, provides advanced, easy-to-integrate layout functionality that enables typographic creative expression.  Layout and style text with tables, inline images, and column flow through components that are compatible with both Flash and Flex, all while getting the benefits of the new text engine.  Rich text components allow designers and developers to flow text and complex scripts, such as Arabic, Hebrew, and Thai, across multiple columns like a newspaper, around tables and inline images, from right-to-left, left-to-right, bi-directionally, or vertically.  Selection, editing, and wrapping of text are handled as would be expected for the different layouts.</p>
    <p><strong>Anti-Aliasing Engine (Saffron 3.1)</strong><br>
    An update to the Saffron anti-aliasing text engine increases performance and quality of anti-aliased text, particularly for Asian character rendering.  Support for stroke fonts reduces memory requirements.</p>
    <p>That's right, support for Complex Scripts and OpenType features is coming to the Flash platform. These are great news!</p>
    <p><a class="freelinking external" href="http://labs.adobe.com/technologies/flashplayer10/demos/videos/text.html" rel="nofollow">Take a look at the video. It features Hypatia Sans Pro</a> :^)</p>
