      <p>Yes, the Fireworks feature is solely for text brought in from Illustrator. You can, however, edit that text to your heart's content (including changing font, size, etc.), so one can imagine making what is essentially a style sheet of pasted Illustrator text blocks for use in Fireworks, implementing different features.</p>
