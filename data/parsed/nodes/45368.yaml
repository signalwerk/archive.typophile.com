      <p>TLF only works with DefineFont 4.</p>
      <p>DefineFont 4 only uses CFF outlines internally, but TrueType fonts can be converted as part of authoring the SWF or AIR app.</p>
      <p>More on this and the rendering of such fonts in my final Adobe blog post here:<br>
      <a href="http://blogs.adobe.com/typblography/2008/12/tlf_rasterization.html" title="http://blogs.adobe.com/typblography/2008/12/tlf_rasterization.html">http://blogs.adobe.com/typblography/2008/12/tlf_rasterization.html</a></p>
      <p>Cheers,</p>
      <p>T</p>
