      <p>&gt; <em>I don’t see a way to make text.engine text selectable. Miguel, have you checked this ?</em></p>
      <p>No, I haven't. The <code>flash.text.engine</code> classes on the Flash Player 10 Beta are essentially low-level classes. Think of them as the building blocks. If so inclined, you can build a text editor on top of them, but I agree it's not a trivial task. You might want to wait for FP10's final release, which will likely have a more comprehensive framework.</p>
