    html: |-
      <p>The API documentation for Astro (Flash Player 10's codename) <a class="freelinking external" href="http://theflashblog.com/?p=387" rel="nofollow">has been recently made available</a>. I had a look at the classes included in the <code>flash.text.engine</code> package, and there's some interesting stuff there,</p>
      <p>DigitCase (DEFAULT, LINING, OLD_STYLE)<br>
      DigitWidth (DEFAULT, PROPORTIONAL, TABULAR)<br>
      Kerning (AUTO, OFF, ON)<br>
      LigatureLevel (COMMON, EXOTIC, MINIMUM, NONE, UNCOMMON)<br>
      TypographicCase (CAPS, CAPS_AND_SMALL_CAPS, DEFAULT, LOWERCASE, SMALL_CAPS, TITLE, UPPERCASE)</p>
      <p>Some properties are easy to map to specific OpenType features, but not all. I also suspect that there's more OT support than these items make believe, since FP10 has complex script support after all. Some supported features are likely on by default under the hood.</p>
      <p>The examples provided in the classes ElementFormat, TextBlock and TextLine are quite interesting as well.</p>
