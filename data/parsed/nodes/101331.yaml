      <p>"basic letter shapes of our text types have been frozen in their renaissance roman and italic forms ever since."</p>
      <p>Your description of "Frozen" may differ from mine or others, John.  Serifs are not simply removable modules, they are either designed as part of the glyph or not.  Clearly Garamond is not Helvetica with adornments added or the reverse.. You may choose not to see variations in form beyond the most basics of slant and weight if you like.  If that is the case, why do you design type at all? Why not just stop and only use the Italian Renaissance originals and close your doors? Humans keep going and making whatever changes they wish, good or bad and always will.  You cannot stop them by devine academic definition. You may certainly belittle them or point out how they fail to meet your own expectations as may anyone else. This is fair. You do not get the choice to drag a line in the sands of time for everyone in the future to adhere to.  They simply won't do it any more than Garamond stopped after seeing Gutenberg's work. It just isn't your call or mine to make. We are only pawns of our brief moments of life. I am happy to just make my small scratches that will wither from view quickly. I see no need to define for others what should follow my passing.</p>
