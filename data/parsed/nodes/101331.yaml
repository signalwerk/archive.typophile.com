      <p>I see I am mistaken about there not being any fully Latinized Greek typefaces except for the odd attempts by people like Eric Gill. The sample "Gunaika", which looks like Bodoni, has a Greek which is about as Latinized as can be.</p>
      <p>Harmonization of Greek to Latin, while it may be useful for certain purposes, isn't a good thing where we're talking about daily use of Greek typography without Greek and Latin texts being present on the same page.</p>
      <p>But harmonization of Greek uppercase and Greek lowercase to each other is something that I <em>think</em> might be beneficial to native users of the Greek language - and having a distinct upright and italic form of the script, again, might also be beneficial - and these things <em>seem</em> to require Latinization; at least, making Greek look like Latin seems to be the simplest and most obvious way of achieving those goals.</p>
      <p><em>This doesn't have to be a bad thing.</em> It is <strong>likely</strong> to be a bad thing, but not certain. It is a bad thing if the typefaces that result are alien to Greeks - and not a bad thing if they are normal and natural - just exploring the design space in directions that Greek typography did not use due to historical accident. It could be that what we outsiders think of as "Greek" is conformance to the Porson model - which is a conscious archaism imposed by foreigners, and an <em>apparently</em> Latinized typeface would be more authentically Greek.</p>
      <p>(But even as an outsider, I feel entitled to the opinion that if the Greeks went back to the pre-Porson style of Greek typeface that is closer to the Byzantine model, they would be making a mistake - because that is clearly less legible.)</p>
      <p>Seeing the variety of sans-serif typefaces, such as New Hellenic, though, I think that if Latinized Greek isn't quite right, the Greeks are fully capable of coming up with a serif typeface that can do all the tricks the Latin script can, if that's what they want, that will be authentically Greek as well.</p>
