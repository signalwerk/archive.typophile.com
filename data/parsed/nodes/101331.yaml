      <p>Since the place seems to be revitalized at the moment, I’d like to post some little comment on the result, too.</p>
      <p>Without going into detail here and now, I had the impression that the presentation of the questionnaire results could have been a bit more lean or compact.<br>
      One remarkable result is, i.m.h.o., that apparently 2 of 3 Greek users would not care about typographical kinship of Latin and Greek (or very little).<br>
      On the other hand, those who *do* care, seem to wish for Greekness and modernity at the same time. I’d say, in making a case by this for a “Greek modernity” or “modern Greekness” – the work is very valuable.</p>
      <p>This is comment #400 of this most remarkable discussion. If I’m not mistaken this is typophile top score. Tatiana deserves a prize for that very special achievement allone …</p>
      <p>SALVE Tatiana!</p>
