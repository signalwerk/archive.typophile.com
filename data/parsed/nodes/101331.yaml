      <p>No, I'm providing tools that I believe will solve the daily text needs of the users of that software or device, in response to particular briefs from the client. This means that I'm usually considering the kinds of texts they are likely to be dealing with and what norms exist in their native text cultures that I can draw on to produce something that fits the expectations of a significant portion of users (or at the very least can be presented to them and explained with reference to their own textual history, rather than as something imported). These days, I'm often working with scripts for which no fonts exist in widely supported or standard formats -- e.g. the Burmese font for Windows 8 --, working alongside the programmers who are developing the layout engines, keyboard drivers etc., and I see my work very much in terms of producing something that provides a well executed baseline of script and language support according to the norms of the script, <em>so that anyone who comes after me can consider that solved and produce more original and creative designs.</em> This relates to the thread that Hrant tried to start regarding minority script support: a lot of scripts get hung up on amateur font makers trying hard to produce something that captures the norms of the script, such that no one ever gets around to expanding the typographic palette. </p>
      <p>I don't think I've ever claimed to be an 'advocate of cultural autonomy', at least not in any way that presents it as a problem for people to design typefaces for writing systems other than their own. This has been going on for as long as there has been type; sometimes it is done well, sometimes not. Generally, when it has been done well, the people involved have paid attention to script expertise embodied in the scribal traditions. Generally, when it has been done poorly, foreign technologies have imposed limitations and the people involved have imported inappropriate concepts from their own scripts.</p>
      <p><em>True italics, multiple weights, condensed and expanded, text and display styles, small caps — all these “Latin” inventions can be theirs.</em></p>
      <p>No, I don't think all these inventions can be theirs, because some of these are dependent on particular characteristics that the Latin script does not share with all other scripts. Sometimes, in such cases, there are alternative options within the script, ironically overlooked in favour of Latinisation.</p>
