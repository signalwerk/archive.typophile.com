      <p>Panos, thanks for jumping in. While I can understand that you would want to avoid the term Latinisation because it sounds colonialist, I wonder if this simply masks colonialism if harmonisation means, as your comments and illustrations indicate, <em>harmonisation of Greek to Latin</em>? There doesn't seem any evidence of the opposite, or of a kind of balanced polyphony: Latin typography is taken as the norm, and other scripts are adapted to it.</p>
      <p>Harmony is a complex phenomenon, and very different from singing in unison (una voce). I think we probably agree to a large extent on the desirability of harmony, but differ in our appreciation of how harmony is achieved. All type design is about making things that are inherently and necessarily different in some ways the same, so that they work well together. My own approach to such harmonisation is quite flexible: I don't think there is a generally 'correct' way to do it, only a way that is correct in a particular context. In that regard, we deal with different sets of contexts, and you as a Greek designer in Greece probably have more freedom to introduce Latinised features than I do. If you get accused of Latinisation, you can make the case for it within the context of your market, as you have done here; if I get accused of Latinisation, that's colonialism. :)</p>
      <p>_____</p>
      <p>The Latin uppercase letters have their origin in the Greek alphabet, but the lowercase of the two scripts evolved independently of each other. So I don't think it is helpful to cite an historical relationship of the two scripts to suggest that what happens in one is inevitable in the other. Nor is it accurate to say that  'Latin was formalized over the years into an upright typographic model': that model was there at the beginning, in the formal humanist manuscript hand. It didn't need to be formalised over the years: it was just adopted from one medium into another, alongside of the informal, cursive secretary hand that is the Latin italic. So to apply these categories to other scripts is to apply a specific accident of 15th Century Italian text culture. Now, if one were seeking to make a distinction between upright, formal style and slanted, informal style in Greek type, one could look at the distinction that existed in the 15th Century, between the Complutensian and Aldine styles, and therein find a more obvious parallel and 'inevitable progress'. Except, it clearly wasn't inevitable, because unlike the Latin parallel these two kinds of Greek were not adopted as contrasting typographic articulators. This strikes me as unfortunate, both because it means that, until the 19th Century, Greek typography was limited in its ability to articulate texts, and because it means that an organic evolution of contrasting styles <em>independent of Latinisation</em> didn't happened.</p>
      <p>_____</p>
      <p>Thank you for the illustrations of the Centro regular and italic, which I think are very interesting. What strikes me most -- and this is true when I look at Nick's designs too -- is that the Latin and Greek italics are much more harmonious than the Latin and Greek uprights. The italics have a very similar textural impact, which the uprights don't manage so well, despite sharing a lot of details and common shapes.</p>
      <p>_____</p>
      <p><em>2. Large number of letters with descenders. There is a total of 10 Greek letters with descenders compared with a total of 5 for Latin. This automatically makes Latin easier to read.</em></p>
      <p>It does? So you are saying that fewer descenders and more uniformity in height makes a script automatically easier to read? So a script with no descenders at all would be easier to read than one with, say, five? Do you have any evidence to support this assertion?</p>
