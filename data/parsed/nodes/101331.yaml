      <p>&gt; More than that we still see (and feel?) that the Latin and the Greek letters are basically identical. So the wish *to see either alphabet on the same level* seems natural.</p>
      <p>        In his book,"The history of Greek script", Antonios Sigalas (Ιστορία της ελληνικής γραφής, Αντώνιος Σιγάλας - I'm afraid is available only in Greek), shows how the handwriting of Latin and Greek languages at one point (first centuries AD) were so mixed, that with difficulty anyone could distinguish them. But this was due to social evolutions of Roman Empire, where Greek and Roman children were exposed to similar educational system, so the handwriting (dimotiki) on wax tablets was resembling, he says.<br>
      Despite this, through time, when Greek minuscule appeared (around 9th century AD) the letters distinguished themselves from Latin ones (because the Capitals of two alphabets had similarities and differences). [When someone tries to write fast, different alterations appear in letter forms, not to mention the natural conversion of upper to lower case. Try for yourself to write  'Γ' and then a very quick gamma, which will evolve steadily to 'γ'].<br>
              Aldus Manutius may be criticisezed for "negative influence", but in one way his printings preserved the characteristics of Greek letters and thus influenced greek typography for quite a long period. The lack of political and economic stability in Greece for few centuries (Ottoman rulling, revolution of 1821, WW1, WW2, again revolution, Hounda) didn't give the opportunity to the Greek type to flourish, as Latin did.  Maybe this is an explanation why latin fonts always seemed more modern than greek and eventually dictated the style of contemporary fonts. </p>
      <p>        And at this point I will have the (naive?!) courage to put in discussion a relation of the following theory to Latinization: that people tend to be more open to things that they are most used to, because they feel more "comfortable", safe.<br>
      How is this related to Latinization?<br>
      Lately, my friends are asking me what project I am doing and I tell them that I found (yes, I too wasn't aware of it) a fenomenon concerning typography - latinization of greek alphabet. And they are all surprised that something like this exists, because is not easily perceived by society.<br>
      Latinization was introduced day by day into Greek typography. The reader was getting used to the micro changes and could not see the image from another point of view, except of typographers, graphic designers etc. But you see, the released typefaces were read by all Greek speakers and not only. Unconsciously, they accepted what they were served for dinner. </p>
      <p>Let's see, hoω εαsγ γου cαη rεαδ τhις τεχτ? </p>
      <p>If a English speaker is exposed for centuries to this king of metamorphosis of letters (which would occur with minor changes step by step), some day he will get used to it.<br>
      As Matthew Carter underlines (From tablets to pixels, [1996]," Which came first, the Greeks or the Romans?" ), every epoch has its specific demands and people are exposed to different typographical approaches.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/carter_5262.png"></div><br>
      It would be irattional to ask from a Greek to read today the complicated word "para- παρά" (see the image, up center) and from an English - "que" and "pre", says Carter. Even if these were the most common ligatures of the past when people could easily read them!<p></p>
      <p>For me, there are some key points here:<br>
      1) Today, latin alphabet can be read everywere, in almost every society. Population is accustomed to it and as result, the phenomenon of latinization is unconsciously accepted.<br>
      2) The written forms of an alphabet is a cultural heritage, is the identity of every nation and social group. Aknowledge and education can prevent the Latinization process.<br>
      3) Even if we all agree that Latinization is a logical process of letter evolution, can you imagine universal type in 100 years? It will be all the same, no difference between latin, arabic, greek, thai, armenian, etc.  Quite boring… and at some point, the return to roots will be inevitabile, I suppose. (I'm waiting for Hrant's :) critique about this) </p>
      <p>So, I'm asking Andreas, "the wish *to see either alphabet on the same level* seems natural", is a intuitional statement or a unconsciously perspective directed from specific groups?</p>
      <p>P.S.<br>
      1) John, thank you for the comments about Gill! :)<br>
      2) Soon I will reply to other comments - specifically reffering to what I found about the "characteristics of Greek letters"<br>
      3) did you know that in ancient times the fathers were obliged to educate their sons, otherwise they weren't entitled to ask for support and care when they would become old?</p>
