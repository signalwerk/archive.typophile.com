      <p>Ilya, your ingénue post made me smile, because Typophile has in fact seen so much discussion about exactly those things that you could publish a three-volume book! Although it would be hard to read... Kevin Larson (the MS researcher you speak of) himself has mixed it up here in the past.</p>
      <p>My view remains that Larson's research has only skirted immersive reading, not fully delved into it. If you're interested in this discussion a really good place to start is issue #13 of Typo magazine, where Larson, Peter Enneson (also a Typophile member) and myself have each presented our views.</p>
      <p>In any case, saying that descenders don't help is one thing, saying that they <em>hurt</em> is quite another, and to me pretty ludicrous. The only way that the descender of the η (eta) for example could harm readability is if it were the only descending letter, and without that linespacing could be reduced. Big maybe.</p>
      <blockquote><p>There is of course the danger that non-descending η will be designed as if it were the Latin lowercase n due to their superficial similarity, and that would be an instance of true Latinization—but I think we would all agree that this is clearly something to be avoided.</p></blockquote>
      <p>Sadly I don't think we all agree on that... For one thing people <em>still</em> make such Greek fonts.</p>
      <p>About "true" Latinization: To me it remains an issue of intent. For example if you make the η without a descender because you really believe the descender harms readability, then it's not Latinization; but if you do it because you want Greek to align better with Latin text (as opposed to sitting too low overall) then that certainly is Latinization.</p>
      <p>Also, don't discount the potential confusion between η and the Latin "n".</p>
      <p>But I certainly agree that Cyrillic is in much worse shape.</p>
      <blockquote><p>it must be coincidental that the even numerals 6 and 8 ascend beyond the x-height while odd numerals 3, 5, 7, and 9 descend in old-style figures</p></blockquote>
      <p>Who knows?<br>
      To me the important thing to realize is that it's a bad scheme. I prefer the old French style of making the "3" and "5" ascend. And yes, the "2" should ideally ascend (something Gill has actually done). Nothing to do with my personal "symmetry" preferences though!</p>
      <p>hhp</p>
