    html: <p>Strangely, scribes seem to have actively employed stylistically related forms of eta and kappa, in the same way that Latin writers might coordinate forms of g and y. I've been looking more thoroughly through the later examples in the French issue of <em>Repertorium der griechischen Kopisten</em> and note that when an ascending eta is used it tends to be accompanied by an ascending kappa. A non-descending eta, on the other hand, may be accompanied by either a cursive kappa or by a K-shape kappa. Kappa is a relatively infrequent letter, so many single-page or fragment exemplars will show eta but no kappa, so it isn't possible to identify strong patterns from the sources I have.</p>
