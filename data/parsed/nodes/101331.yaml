      <p>I am not a native speaker of Greek, so I cannot speak to the issue in a way useful to you. But I am curious about your findings.</p>
      <p>My understanding of the situation is that Greek typography is weakly developed due to the long period of Turkish rule, when printing in the Greek language was suppressed.</p>
      <p>Thus, it came to be that most readily available Greek typefaces were designed in Latin alphabet nations for use in study of the New Testament or the classics - or for use in mathematical formulae. The latter application led to the infamous Porson typeface, long the standard for Greek, where the upper case was upright and very much like that of Latin, while the lower case was cursive... and italicized.</p>
      <p>The upper and lower case of the Latin alphabet are based on a compounding of Roman capitals with the uncial script done at the behest of Charlemagne, but over hundreds of years, the two scripts achieved a unity and complementarity - for most categories of typeface, this process seems less far along in Greek.</p>
      <p>The Cyrillic alphabet, based on the Greek alphabet, of course, illustrates what a completely Latinized Greek script might look like. On the other hand, most of the typefaces designed to be based on authentic Greek sources are sans-serif - and the advantages of serifs for legibility are well-known.</p>
      <p>So I suspect that typography in the Greek language faces many contradictions - and its difficulties, compared to the success of the Latin script, makes borrowing and assimilation a strong temptation.</p>
      <p>Incidentally, I've seen the substitution of the Latin capital Y for the Greek Upsilon (Υ). The font used <em>here</em> does that! I suppose people could also use W for Omega, but I can't think of any other replacements (not counting digamma and qoph).</p>
