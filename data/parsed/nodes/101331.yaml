      <blockquote><p>there were no free Greek fonts that I could find with that level of Latinization</p></blockquote>
      <p>I don't know how hard/deep you looked, but actually in general highly Latinized fonts in any script tend to not be put for sale. This is because: they typically contain stolen outlines and it seems a bit much trying to make money from that; they take so little time to make it feels OK to give it away. Maybe you found none because such fonts often stay "internal" to the designer.</p>
