      <p><em>John, as I understood from your explanations about 'slant' factor, the Greek letters have a 'hidden system of implemented ligatures', and the design itself is based on this construction. </em></p>
      <p>No, what I was talking about is independent of ligation. To be clear: ligation involves visual connection between different letters. In Greek this is optional -- unlike e.g. Arabic, Syriac or Mongolian --, but was characteristic of the Byzantine book hand and hence of early typography. What I was talking about with regard to italics, is the internal construction of lowercase letters, not their connection to each other. [See also my comments earlier about the use of the term 'cursive', which can apply to either joining of letters or to internal construction.] To understand this, consider the two common forms of the Latin lowercase a: the roman a can only be written with the pen being lifted from the page at least once and repositioned, i.e. first the top and right stem are written, then the pen is lifted and repositioned to write the bowl (a calligrapher may in fact lift the pen twice, using two separate strokes to write the bowl, especially if working at larger size); the italic <em>a</em> can be written without lifting the pen from the page, i.e. starting in the top right, the bowl is written as a loop and then the pen reverses direction to form the stem. The roman a has a formal or interrupted construction; the italic <em>a</em> has a cursive construction. The Greek lowercase letters as inherited from their Byzantine origins mostly have a cursive construction; only a few letters -- λ π τ ψ -- require that the pen be lifted during writing (θ and φ have both interrupted and cursive forms).</p>
    html_clean: |-
      <p><em>John, as I understood from your explanations about 'slant' factor, the Greek letters have a 'hidden system of implemented ligatures', and the design itself is based on this construction. </em></p>
      <p>No, what I was talking about is independent of ligation. To be clear: ligation involves visual connection between different letters. In Greek this is optional -- unlike e.g. Arabic, Syriac or Mongolian --, but was characteristic of the Byzantine book hand and hence of early typography. What I was talking about with regard to italics, is the internal construction of lowercase letters, not their connection to each other. [See also my comments earlier about the use of the term 'cursive', which can apply to either joining of letters or to internal construction.] To understand this, consider the two common forms of the Latin lowercase a: the roman a can only be written with the pen being lifted from the page at least once and repositioned, i.e. first the top and right stem are written, then the pen is lifted and repositioned to write the bowl (a calligrapher may in fact lift the pen twice, using two separate strokes to write the bowl, especially if working at larger size); the italic <em>a</em> can be written without lifting the pen from the page, i.e. starting in the top right, the bowl is written as a loop and then the pen reverses direction to form the stem. The roman a has a formal or interrupted construction; the italic <em>a</em> has a cursive construction. The Greek lowercase letters as inherited from their Byzantine origins mostly have a cursive construction; only a few letters -- λ π τ ψ -- require that the pen be lifted during writing (θ and φ have both interrupted and cursive forms).</p>
