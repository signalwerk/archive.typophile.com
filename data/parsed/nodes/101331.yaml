      <p>@Yulia:<br>
      <cite>When I started making greek nearly two years ago, first I didn't intend to make polytonic, but after reading Yannis Haralambous I found his arguments so convincing that I decided to make polytonic and alternative forms and some glyphs that didn't have unicode numbers, but were still needed and used in Greece.</cite></p>
      <p>I am glad that you did. I should have noted one thing in my post to avoid the potential of it being misleading. While I believe that modern Greek is not typeset in the polytonic form any more, it is still very important and useful for a Greek font to have polytonic capability (even if extending it to new frontiers like small capitals is dubious) - because most modern Greeks <em>are</em> able to read Classical Greek without having it translated for them, and <em>that</em> is properly typeset with the polytonic accents.</p>
      <p>Imagine an English-language font that couldn't be used to print Shakespeare! (But I'm not arguing to have eth and thorn added to every Latin font, nice though that would be. Chaucer, most English speakers do need a translation to read.)</p>
      <p>EDIT: I think I may have become misleading in the other direction.</p>
      <p>Native speakers of Russian do not need an acute accent indicating the stressed syllable in every word. Native speakers of Hebrew do not even need the vowel points! So native speakers of Greek may indeed have little trouble reading, say, Aristophanes without the use of the polytonic script apparatus.</p>
      <p>But a typeface not available in polytonic fonts could not be used for a dictionary of Classical Greek, it couldn't be used for accurate quotations of texts printed in polytonic form, and for so many scholarly purposes, that I think it would be comparable to a Latin font developed by an English speaker that had no accented characters, and so couldn't be used to quote from French or Italian or Spanish - it would be usable only for the simplest purposes.</p>
