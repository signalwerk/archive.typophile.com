      <p>What you have shown is the perfect case of a display face matching content and communicating message.  Very brief wording (as in package design) allows details in type to create a particular atmosphere.  In this case, you can evoke that feel of handmade old Greek village store products even though it is modern plastic wrap packaging. The ligated forms echo that but the ranges of use for that face would not extend too far beyond that type of market.  What typeface would a Greek producer of electronic products use for his packaging? What about a Greek Pharmaceutical company?  Would they want a homeopathic image or a medical science image?  There is no one style fits all solution for Greeks any more than there is for any other nation on earth. Look at the Latin script countries of Europe, they use a great variety of types to suit their communication needs.  Denoting, primarily, the nostalgic relevance of the country of origin is not typically first on their list of things to be communicated. If they are selling Kalamata olives, perhaps yes; if they are selling smart phones, not so much.</p>
