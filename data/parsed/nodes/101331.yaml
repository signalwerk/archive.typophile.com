      <p>I would say those 19th century Greek types were Latinized in some sense, as they were designed to work in contrast* to Latin for readers whose natural script was Latin, which is why they were given such an “italic” construction.</p>
      <p>It may also be said that their designers were taking the same “ﬁrst step” to rendering the predominant written form into type: with Latin that had been blackletter, followed soon after by the Italian <em>umanistica</em>. They didn’t stray very far from the written model.</p>
      <p>*Not just for short quotes in longer Latin texts, but with a marked sense of otherness and antiquity, which was probably not how 19th century Greeks thought of themselves, but an image comfortable for westerners, colored by their association of Greece with temple ruins and the texts of classical antiquity.</p>
