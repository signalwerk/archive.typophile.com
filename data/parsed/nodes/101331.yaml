      <p><em>The italics have a very similar textural impact, which the uprights don't manage so well…</em></p>
      <p>I don’t see it that way, John.<br>
      This is better than the historicist method, where the stylistic contrast between Greek upright and Latin upright is so great.</p>
      <p>Sorry if I repeat myself, but I don’t think certain ways of writing or designing are essentially “Latin”, just because the West got there ﬁrst. They all originate in fundamental qualities of writing/printing technology, and the way that humans are likely to respond to them, irrespective of ethnicity. </p>
