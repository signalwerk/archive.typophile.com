      <p><cite>I’m not quite sure about which end user you’re adressing, Tatiana. The reader? The typesetter?</cite></p>
      <p>You left out the book interior designer, or graphic designer, for small pieces. In the book world anyway, the interior designer is the person who selects all the typefaces used. Occasionally the author gets a voice. Occasionally too, the book designer will ask the typesetter for a recommendation, when they have selected a typeface for the text that does not have a companion Greek. </p>
      <p>FWIW, in the past 33 years, I think I've set one book that used a sans for the Greek. From 1980 to the late 1990s, Porson Greek (Monotype) was far and away the preferred font for academic works (essentially in English, but with classical Greek passages). Thank God that has changed...</p>
      <p>In any case, I imagine it is the www world to which you're really directing your question...</p>
