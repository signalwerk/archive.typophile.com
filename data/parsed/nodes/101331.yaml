      <p>You are right! There was a switch from right to left. Also, a middle version, see images (Anthology of Greek Typography) 258 - up, 259 (if it corresponds to English version). I didn't notice it. For some reason, the tone in uppercase letters bother me so much optically, so I excluded this information... Not wise at all! But, the middle version is quite great, by the way. How are you designing them now?</p>
