      <p><em>what does 'slant' mean in typography, esp. in a Greek font?</em></p>
      <p>Oblique angle off the vertical. So italic letters generally slant (lean) to the right.</p>
      <p>In Latin script, the upright (roman) lowercase letters follow a formal construction model, i.e. if you were to write them with a pen, you would often lift the pen and put it back down on the page while writing many of the individual letters, but the italic letters follow a cursive construction model in which the pen stays in contact with the page much more, reversing direction to create new strokes rather than being lifted. As discussed earlier in this thread, the Greek lowercase letters have a cursive internal construction, which means that this distinction doesn't naturally exist between upright and italic styles for most Greek types. So often the only distinction between upright and italic is the slant to the right.</p>
      <p><em>I know about smallcaps, but not of true smallcaps and true superior letters. Any font which would have all this, so I could see them for myself?</em></p>
      <p>'True smallcaps' is a term often used to refer to designed smallcap glyphs in a font, these days typically accessed via OpenType Layout features, as distinct from fake smallcaps that have been mechanically produced by software (by scaling down and/or distorting regular caps). The same thing applies to superior letters (and numerals): these can either be designed glyphs in the font or are faked by software. In Latin fonts, it is now quite common to have a full set of lowercase superior letter glyphs in addition to a full set of superior (and inferior) numerals. When I've made fonts for scholars such as the SBL Greek or the new Brill types, I've been asked to include full upper- and lowercase Greek superior letter sets, because these are fairly frequently used in the apparatus (textual footnotes) of critical editions. This is what they look like in the Brill roman font:</p>
      <p>What I am wondering is whether users in Greece have a need for superior letters.</p>
      <p><em>Do you have a inclination for serif? Or is a demand factor? </em></p>
      <p>I make custom fonts according to briefs from a client, so it just happens that most of my clients for Greek type design have wanted serif text faces. I designed another sans serif Greek, a corporate type for Heidelberg Druckmaschinen produced by Linotype (the Latin art directed by Erik Spiekermann and based on News Gothic):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/HDGothicGreek_4767.png"></div><p></p>
      <p>_____</p>
      <p>With regard to accent position, in almost all types I position them to the left of the uppercase letters (excepting the dialytika of course), because for better or worse that is now the accepted standard and I think most Greek readers would think it strange to see them anywhere else. But recently I made a typeface for the Dumbarton Oaks Research Library and Collection, which is one of the world's most important holdings of Byzantine seals and coins. That font represents the wide variety of uncial forms that Greek letters took during the Byzantine Empire, so that scholars can transcribe the appearance of text on particular coins and seals. One of the things we determined when planning that project was that in the Byzantine uncial the accents were always written above the letters, not to the right or left. One sees this also in ikons and mosaics.</p>
      <p>Here are some samples of that Greek (and Latin) typeface for seal and coin scholars. I suppose it too might be thought of as a kind of sans serif.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AthenaRubyShowing_6700.png"></div><p></p>
