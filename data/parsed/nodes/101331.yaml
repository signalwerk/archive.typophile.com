      <p>Hrant, I'm very glad to see your post here. Thank you for your contribution!</p>
      <p>&gt; To me calligraphy fails to promote -and in fact essentially opposes- functional or cultural progress in type design.&lt;</p>
      <p>I would be very interested in reading your point of view about this. Could you explain your statment, please?<br>
      If I understood correct, looking back to early Greek typography opresses the progress of Greek font design? (and I suppose you are speaking about the calligraphy of any other language)</p>
      <p>The history of Greek typography reveals the big impact of byzantine scripts in the design of Greek fonts. While the latin typography evolved through a different path and always seemed modern. Based on which criteria could anyone desing a modern Greek font, but not using elements from calligraphic manuscripts? </p>
      <p>I am not an expert at all, but it seems to me that some recent fonts have quite a contemporary look based on byzantine roots… What do you think?<br>
      See Maiola, Skolar, Colvert<br>
      <a href="http://rosettatype.com/index.php?action=carro/search_by_kw&amp;kwId=3&amp;kwName=greek" title="http://rosettatype.com/index.php?action=carro/search_by_kw&amp;kwId=3&amp;kwName=greek">http://rosettatype.com/index.php?action=carro/search_by_kw&amp;kwId=3&amp;kwName...</a><br>
      <a href="http://www.typographies.fr/uk/index.php?page=fontes&amp;s=Colvert" title="http://www.typographies.fr/uk/index.php?page=fontes&amp;s=Colvert">http://www.typographies.fr/uk/index.php?page=fontes&amp;s=Colvert</a></p>
      <p>Also, I see a preference in "calligraphic" Greek fonts which are more suitable for extended texts, because they have "fluidity", while the modern ones are static and "printed" rather than "written". Should we change our attitude towards letters? To accept that they are not written anymore, but designed on a computer?</p>
