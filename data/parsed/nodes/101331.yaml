      <p>@John Hudson:<br>
      <cite>but we work with what are, in terms of the history of scribal text manufacture, an incredibly narrow, short-lived and regional set of letterforms.</cite></p>
      <p>Yes, but what else would you expect?</p>
      <p>Whether for body copy in books, newspapers, and magazines - or on highway signage - or display type in advertising - printed matter is, first and foremost, intended to communicate what it says, whether that's "Low Prices!" or "Albuquerque 100 miles".</p>
      <p>So to obtain immediate recognition and maximally effective communication, type tends to stick with the letterforms people are used to and comfortable with - with the only change being ones that don't complicate immediate recognition.</p>
      <p>This is why Gothic stayed around for so long - and why, when Roman pushed it out, it stayed pushed out, since the Roman letterform is objectively far more legible - different letters are more clearly distinguishable.</p>
      <p>Because this is the biggest consideration, de-Latinization will be a very slow process, but I believe it will still naturally happen as a slow drift in the absence of overwhelming outside pressure.</p>
      <p>@dezcom:<br>
      <cite>Yes, this diverted the train from what might have been its destination otherwise. Never-the-less, this IS what happened and we must accept both the Turkinazation and the Dutchification, and the Anglification and even the new worldification of Greek script as part of history. We do not get to go back and purify the past of Greece to our liking. We only get to contribute to the present as best we see fit.</cite></p>
      <p>I think you're half right.</p>
      <p>A type designer, whether he's a native speaker of Greek or not, can attempt to invent a typeface with the glyphs of the Greek alphabet in the style that the Greeks might now be using had history happened differently.</p>
      <p>No physical laws are violated by so doing. But because history still happened as it did, the result in the present might not turn out to be useful to present-day Greeks, particularly if it's too strange or unfamiliar.</p>
      <p>It's precisely because there were difficulties in Greek history that the Greeks have borrowed from the well-developed Latin typographical tradition to have a wide selection of typographical materials sufficient to the needs of an industrial society. If they can respond to a shortage of Greek typefaces in this manner, then they can also respond to typefaces based on foreign models not suiting their aesthetic sensibilities by designing new ones that, in whatever way, are more "Greek".</p>
      <p>The quest for materials with which to work involves looking to the past, to folk models, and within oneself. Although I'm used to Porson Greek as the way Greek is represented, I know I find it jarring, but I don't know how a native speaker of Greek finds it. But if it is found deficient, alternatives exist, and more can be prepared.</p>
      <p>The past can be the reason why we need to work harder on contributing in certain ways to the present. And, on the other hand, as it's affected what Greeks are used to, it will have changed the present in ways we do have to accept. So instead of the Greeks going to the typefaces they would have if all of this never happened, I see much smaller changes, aimed at resolving the degree to which existing typefaces, although people have gotten used to them, are still not entirely a good fit to their aesthetic sensibilities. These changes, I suspect, will tend to be somewhat in the direction of more historical authenticity, but not exclusively in that direction - but they won't go very far, and outside influences will remain very visible.</p>
