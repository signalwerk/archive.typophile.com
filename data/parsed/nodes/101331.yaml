      <p><em>Still, some writing systems have limited legibility; in Hebrew, some letters are difficult to distinguish, for example.</em></p>
      <p>Yes, and within the varieties of Hebrew square letter and other styles there are things one can do to reduce these difficulties. The fact that in some of the Ashkenazic styles these things are not done and, if anything, the confusable letters are made more rather than less similar might suggest a number of interesting things about writing, type design and reading.</p>
      <p>Mediaeval Arabic writers produced an entire genre of literature based around misreadings of un-disambiguated archigraphemes.</p>
      <p>If disambiguation of hard to distinguish characters is the goal, I still don't see any obvious benefit comes from aping Latin letters that could not be attained in other ways. The methods used by cultures that adopted the Arabic script to capture sounds that do not exist in Arabic are a good example of the richness of sufficiently disambiguated forms that can typically be located within a scribal tradition, for instance the adoption of optional variant forms from an Arabic style as normative letters in a new orthography.</p>
