      <p>Nick, I don't think the Monotype 90 kappa is 'damn near symmetrical'; in fact, it is very cleverly asymmetrical (I'm talking about the hot metal type). It is closer to symmetrical than the examples I showed, yes, but follows the same basic principles of asymmetry: the left side connects to the diagonal closer to the corner, the right side departs from the diagonal closer to the middle, and the lower right termination is more heavy and dominant than the upper left. The Didot original on which it is modelled is even more asymmetric, with the lower right stroke extending well to the right of the diagonal. [Unfortunately, this is one of the ways in which GFS Didot fails to reflect the original design.]</p>
      <p>I do agree with you that the Figgins form looks better at that smaller size, but I still find the deep dip in the left side distracting, not because it isn't 'overtly chirographic' but because I'm used to seeing the left side of this letter better coordinated with that of eta and upsilon.</p>
