      <p>Chris: <em> I mean, let whomsoever design type as they see fit without a firm set of rules. Then let the users determine if it suits them.</em></p>
      <p>Yes, but also acknowledging that type is a cultural product, which means that it is something about which it is good and right to have opinions and to engage in argument. There is sometimes a tendency to suggest that users -- or 'the market' -- will decide, as if the community of users were not made up of culturally aligned groupings, asserting influence or struggling in their ways with opinion and argument (not to mention subject to advertising and a host of other pressures). I think this is not, perhaps, what you meant, Chris, but I think it is important to say this: rejecting a fixed set of rules, a 'correct' way to design Greek types, does not mean that the arguments about approaches and results are pointless.</p>
