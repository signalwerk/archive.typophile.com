      <p>Anyway … I think that Panos Vassiliou is right. It is mainly the traditional view (which provides us the current state of readability …) that tells us that a Greek script cannot have a roman counterpart, i.e. letterforms with an interrupted construction. Or a geometric pattern for the lowercase. Or a thick-to-thin contrast related to the broad nib. We have to take in consideration that the readers of the Latin script survived Futura and Bodoni as well as many other minor and major deviations of – let’s say – the Venetian Old Style. I am not telling that these developments should (therefore) be copied to the Greek script, but all of this is likely to happen (if it not already did). At some point these developments will turn out to be successful, beautiful, acceptable and maybe even readable. After all, it took almost 60 years from the first Futura-like geometric sign painters alphabets to Paul Renner’s Futura. Also it took over 60 years before Frutiger took up Johnston’s idea of the humanist sans serif and freed it from its ideosyncrasies in such a way that the principle is now seen as the basis for designing an extremely legible sans serif. And when we look at recent developments, we see that this development will continue and that better results can be achieved. Didot made a crazy, and unusual because dogmatic ‘g’, it was as experimental as Paul Renner’s trials for Futura, but Bodoni got back to Baskerville and did a ‘g’ which is generally accepted.<br>
      Although I think that we can hardly beat Garamonds types when it comes to legibility and readability of Latin text, imagine how dull and unexciting Latin typography would be without Bodoni and Futura … and how poor legibility would be at night when our retro-reflective road sign lettering would be set with Garamond, Bodoni or Helvetica.</p>
      <p>Also, neither the broad nib, nor geometry are exclusive to the Latin script …</p>
