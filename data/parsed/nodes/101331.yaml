      <p>Another point I didn't mention is that η can carry an accent as in ή, so it is going to be using the extender spaces in some cases regardless of whether it has a descender.</p>
      <p>Hrant, I don't think the ascender space is too underused in Greek. It's way better than Cyrillic at any rate, and it's nice that polysyllabic words will always have a tonos to make use of that space. I do think Latin could use its descender space a bit more, but even that I don't find too problematic. Maybe I'm easy to please, but unless extenders are too few and far in between (as in Cyrillic) for me the gains in usefulness start diminishing with increased frequency. I think it is an overreaction to see fiddling with the descender of a single Greek letter as an instance of jingoism. There is of course the danger that non-descending η will be designed as if it were the Latin lowercase n due to their superficial similarity, and that would be an instance of true Latinization—but I think we would all agree that this is clearly something to be avoided.</p>
      <p>I'm pretty sure by now that it is a personal idiosyncrasy of mine to be bothered by vowel letters not confined to the x-height. Maybe it's just my subconscience making up reasons after the fact. I think it must surely be entirely coincidental that in the development of lowercase letters, the vowel letters a, e, o, u, α, ε, ι, ο, υ, and ω became confined to the x-height, just as it must be coincidental that the even numerals 6 and 8 ascend beyond the x-height while odd numerals 3, 5, 7, and 9 descend in old-style figures (and yes, I wouldn't mind seeing 2 and 4 ascend just to preserve that symmetry :) ).</p>
      <p>Tatiana, I don't have Pflughaupt's book but I'll try to check it out. That's an interesting note about the vowel/consonant ambivalence of η. And of course, the Latin h comes ultimately from the western versions of the Greek alphabet that did keep the consonant heta. Incidentally, there is also vowel/consonant ambivalence with the Latin y, since it is often used for a consonantal sound as in 'yes' though in some languages like Finnish it is used exclusively for vowel sounds except in borrowed words.</p>
      <p>Designing readability experiments is always difficult due to the impossibility of controlling variables. For example, Centro was posted as an example of a design with non-descending η. The problem I have with that design is that η now feels too close to π due to the serif in the left foot of the latter. The effect is subtle, but that introduces the tiniest bit of hesitation in reading and recognizing the letters. Not a problem in display typography, but for immersive reading I imagine there is an effect. One reason I have no problem with non-descending η is that there wouldn't be a danger of it being confused with another letter, but designing η and π to be identical in the lower half does bring that risk. Here I think the fault is more in the design of π rather than η—I can't quite get on board with the serif on π.</p>
      <p>Hrant: <cite>* Speaking of Hangul, one amazing thing about it is that its four levels of syllable "visual density" are strongly associated with a syllable's grammatical function.</cite></p>
      <p>I'm not sure what you're referring to. It is true that CVCC or VCC syllables (with orthographic consonant cluster at the end; C standing for consonant letters and V standing for vowel letters) are most often found in nouns (e.g. 흙 <em>hŭlg</em> 'soil'), verb roots (e.g. 읽다 <em>ilg-da</em> 'to read'), or adjective roots (붉다 <em>bulg-da</em> 'to be red'). But they can also be formed by root+suffix as in 알- <em>al-</em> root of 'to know' + -ㅁ <em>-m</em> nominalizing suffix = 앎 <em>alm</em> 'knowing'. Other than that, CV, CVC, V, and VC syllables occur in all parts of speech, so they are not distinctive in conveying grammatical function. We can't really say anything beyond that the visual density of hangul conveys the underlying phonemic density of each syllable, e.g. 그 <em>gŭ</em> is visually much sparser than 끊 <em>ggŭnh</em> as the latter packs more letters into the syllable.</p>
