      <p>| There are some lowercase letters in Latin, which never could be passed for Greek letters and vice versa.<br>
      | The greater number of ascenders and descenders in case of Greek letters<br>
      | The ductus</p>
      <p>During the designing process of a cross font, what other features you are taking in consideration in order to give a Greek appearance to letters?</p>
