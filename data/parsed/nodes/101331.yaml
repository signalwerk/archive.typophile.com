      <p>No, I don't mean that at all. Perhaps I was just puzzled that my views don't seem to be shared; there are opponents of Latinization, and proponents as well - but it is also that each seems to take me as being on the opposite side, on the infrequent occasions my posts are noted.</p>
      <p>I do think it is "the needs of Greek typography end-users" which must ultimately take priority, and I think that Latinization is primarily to be questioned to the extent it would conflict with them, even if some sentimental regret for what is lost is possible going beyond that.</p>
      <p>My gut feeling is that Greek typography is feeling its way, and what will best accomplish the goal of Greek gaining things like a distinctive italic and so on in an organically Greek way is if it is given time; if there is a rush to achieve parity with Latin, then Latinization is the quick, easy, and obvious solution.</p>
