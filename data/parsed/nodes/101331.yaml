      <p>To me, there is Latinization and Latinization. If the Greeks themselves want to use the same typefaces as Latin script users, and they can adapt the letter shapes to them in a way they find valid, I might be mildly bemused. When all the available Greek faces are based on a pattern set by foreigners, the fact that this pattern is one of conscious archaism rather than imposition of their own script doesn't mitigate matters for me.</p>
      <p>So an authentic interpretation of an indigenous model is what I see as the ideal.</p>
      <p>A Latinized typeface designed in Greece by Greeks will still testify to what aspects of the character shapes are genuinely relevant to Greek readers - so such a typeface is highly informative to outsiders trying to design Greek typefaces.</p>
      <p>But the worst thing is not such a Latinized typeface; the worst thing is a typeface designed by foreigners who are telling the Greeks they should print with this interpretation of Byzantine script. Since that's what Greek has been digging itself out of, Latinization seems to me like small potatoes in its case.</p>
