      <p>I had done some searching, and I found that there were no <em>free</em> Greek fonts that I could find with that level of Latinization... except that one of the fonts on the Greek Font Society site did have the eta without a descender - and that was Artemisia, which I had thought before was a typeface that resisted Latin influence, as it modified the companion Latin to make it more stylistically like the Greek.</p>
      <p>In the case of capital upsilon looking like Y, so many of the typewriter faces for Greek available for the Selectric were like this that I was driven to the  conclusion that the distinctive upsilon was likely regarded as an affectation of foreigners by the Greeks. I don't know about the eta with a descender - there seems to be evidence either way.</p>
      <p>It may be good for the health of Greek type design, though, if Latinization turns out to be a passing fad of the present rather than an enduring trend. Incidentally, Ignacio among the Majuscule typefaces on the GFS site illustrates Greek uncial - however, it's too much like Greek capitals to suggest much of a proper direction for Greek lower case. Except as small capitals like Cyrillic - so it may explain why Cyrillic lower case is the way it is.</p>
      <p>Of course, this thread has inspired me to do searches from which I learned things. Thus, I thought New Hellenic marked a genuine Greek direction; neither foreign-imposed archaism (Porson) or slavish copying of the Latin model. But now I see that it was designed by Monotype in Britain, not by anyone in Greece. Its success in Greece still indicates it has some value in showing what is valid to Greek readers, but I'm disappointed.</p>
