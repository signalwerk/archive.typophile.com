      <blockquote><p>Jongseong: much as in print the strokes that some people add to the numeral 7 or the letter z in handwriting are not used.</p></blockquote>
      <p>I doubt wether the use of the strokes in 7 and z is related to the use of the strokes that are used above or below <em>т</em> and <em>ш</em> as in Cyrillic. As far as I know, the strokes in 7 and z were introduced by the calligraphers that wrote with the pointed flexible nib. Especially in the cursive styles, their horizontal parts were written with a wavy stroke that is thick in the middle (like in <em>ñ</em>, the spanish tilde on <em>n</em>). The diagonal stroke in 7 and z was long and thin. The horizontal strokes in the middle of 7 and z optically compensate the large amount of white space in 7 and z. That’s it. In typefaces, the hairlines are normally not that thin as in the pointed nib calligraphy styles, so from an optical point of view, usually there is no necessity for them. Unless a typeface merely mimicks the a cursive pointed flexible nib writing style with thin hairlines … The use of these strokes in handwriting is not exclusive to Russia. They are mainly a feature of the aforementioned script and you will find them in those countries where it has influenced the way handwriting has been taught. For example in Great Britain, France and the Netherlands and especially in documents from the time that this influence was large or still lasting.</p>
