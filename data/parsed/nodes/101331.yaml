      <p>To make it clear, I do not view the mere fact that η does not have a descender as an indication of Latinization.</p>
      <p>There is a lot of variability in early Greek minuscule writing with respect to the baseline—θ would frequently descend instead of sitting on the baseline as it does today, κ may have an ascender, etc. A non-descending η is common in these early stages; see the images in the table at <a class="freelinking external" href="http://en.wikipedia.org/wiki/Greek_minuscule" rel="nofollow">the Wikipedia page on Greek minuscule</a>. Many early Greek typefaces have η without a descender and others have very short descenders.</p>
      <p>So one need not invoke the influence of Latin to explain the non-descending η. To me, Apollonia (GFS Artemisia) is not a Latinized design at all. Notice how Apollonia's η does not have the typical serifs of an upright Latin n.</p>
      <p>In contrast, of the three images that Tatiana posted as examples of Latinization, the first and the third are clear examples of substitution of the Latin n for η. Maybe not as painfully obvious as some of the Armenian substitutions in Hrant's example, but these are clearly n's masquerading as η's. The first image is particularly grating as other than κ, η is the only Greek letter with full serifs. The third image at least is consistent in going all out with the serifs.</p>
      <p>The second image, assuming we're talking about the sans serif, does not strike me as an unambiguous case of Latinization (though I'm not a fan of the non-descending χ as I mentioned earlier), unless you are willing to level the claim against practically all instances of sans serif designs of simplified geometry.</p>
    html_clean: |-
      <p>To make it clear, I do not view the mere fact that η does not have a descender as an indication of Latinization.</p>
      <p>There is a lot of variability in early Greek minuscule writing with respect to the baseline—θ would frequently descend instead of sitting on the baseline as it does today, κ may have an ascender, etc. A non-descending η is common in these early stages; see the images in the table at <a class="freelinking external link-external" href="http://en.wikipedia.org/wiki/Greek_minuscule" rel="nofollow">the Wikipedia page on Greek minuscule</a>. Many early Greek typefaces have η without a descender and others have very short descenders.</p>
      <p>So one need not invoke the influence of Latin to explain the non-descending η. To me, Apollonia (GFS Artemisia) is not a Latinized design at all. Notice how Apollonia's η does not have the typical serifs of an upright Latin n.</p>
      <p>In contrast, of the three images that Tatiana posted as examples of Latinization, the first and the third are clear examples of substitution of the Latin n for η. Maybe not as painfully obvious as some of the Armenian substitutions in Hrant's example, but these are clearly n's masquerading as η's. The first image is particularly grating as other than κ, η is the only Greek letter with full serifs. The third image at least is consistent in going all out with the serifs.</p>
      <p>The second image, assuming we're talking about the sans serif, does not strike me as an unambiguous case of Latinization (though I'm not a fan of the non-descending χ as I mentioned earlier), unless you are willing to level the claim against practically all instances of sans serif designs of simplified geometry.</p>
