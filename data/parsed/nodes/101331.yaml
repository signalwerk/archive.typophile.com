      <blockquote><p>Writing the thesis on Latinization of Greek typography I faced a pragmatic question: why is so harmful this phenomena?<br>
      . . .<br>
      I cannot find a strong argument against Latinization.</p></blockquote>
      <p>I would agree. In a similar vein, I have a friend who is American, ethnically half Cherokee (Cherokee is one of the many American Indian tribes). She feels it very important to preserve the old tribal values, traditions, etc.</p>
      <p>I am American, ethnically half Norwegian. I do not feel it important to preserve the old values, traditions, etc., be those 10th century Viking traditions or 19th century Norwegian/American traditions.</p>
      <p>* * *</p>
      <p>In the States, there is a relatively new argument about the value of 'diversity.' The claim of value usually comes up in the context of race, ethnicity, sexual orientation, etc., and the numbers of people included in/excluded from various groups. But the argument is always put in terms of the value of diversity per se. If that's the case, don't we want to include an ax murderer for maximum value?</p>
      <p>The point is, there is usually an agenda in all such claims, charges &amp; countercharges, which if not exactly hidden, is not bought forward, either. Usually because it is spurious.</p>
      <p>The knowledge, the history is interesting and has uses. Specific claims to its value are less obvious. You are wise to question them.</p>
