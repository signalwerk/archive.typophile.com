      <p>Ilya, allow me to tell a joke that my dad (a PhD in Soil Mechanics) enjoys:</p>
      <p>A scientist wants to measure the effects of amputation on a cockroach. He cuts off one leg and says: "Walk!" The cockroach walks OK, just not very fast. The scientist writes that down. He cuts off two more legs. The cockroach now has three legs. The scientist says: "Walk!" The cockroach struggles, and slowly moves forward. The scientist writes that down, cuts off two more legs, and says: "Walk!" The cockroach struggles immensely and pushes his body forward a few millimeters with his one remaining leg. The scientist writes that down, cuts off the last leg and says: "Walk!" The cockroach does not move. The scientist writes down: "When all the cockroach's legs are amputated, it loses the ability to hear."</p>
      <p>Numbers don't lie. Because numbers don't say anything. People looking at numbers say things, and they often see/say what they expect/want. To uncover a Truth, a scientist cannot merely be "clever", he must be <em>wise.</em> And that's a lot to expect.</p>
      <p>hhp</p>
