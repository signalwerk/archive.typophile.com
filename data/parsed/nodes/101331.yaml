      <p>As Chris suggests, sequence frequency is more useful than single letter frequency. Pair frequency is useful for kerning; frequency for longer sequences are useful for some writing systems, e.g. consonant conjunct sequences in Indian languages.</p>
      <p>I find single letter frequency information most useful in getting a reasonable sense of the comparative fit of different typefaces. So, taking Tatiana's frequency information -- what is the source of this, by the way? -- one can create a frequency-weighted string of text like this:</p>
      <p>ααααααααααααααααααααααααααααααααααααααααααααααααααααααααααααββββγγγγγγγγγγδδεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεεζζζηηηηηηηηηηηηηηηθθθθθθθιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιιικκκκκκκκκκκκκκκκκκκκκλλλλλλλλλλλλλλλλλμμμμμμμμμμμμμμμμμμμμμμννννννννννννννννννννννννννννννννννννννννξξξοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοοπππππππππππππππππππππππππρρρρρρρρρρρρρρρρρρρρρρρρρσσσσσσσσσσσσσσσσσσσσσσσσστττττττττττττττττττττττττττττττττττττττττττττυυυυυυυυυυυυυυυυυυυυυυφφφφφφχχχχχχχψωω</p>
      <p>This can then be used to compare how much space different fonts takes up, and provide a reasonably good guide to their comparative fit. Of course, individual documents might differ significantly from average frequencies, on account of recurring personal names or special terminology. And note that this Greek frequency data does not distinguish regular and final sigma.</p>
