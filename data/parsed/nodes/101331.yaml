    html: |-
      <p>"what elements make a Greek alphabet (esp. lowercase letters) look Greek?"<br>
      Ductus is a loaded question.  I do not feel that a particular ductus should be a requirement to look  Greek overall. Ductus to me can only be addressed if we are looking for some subcategory of Greek that details the writing tool or technique or time period. I should be able to crudely scratch Greek in the dirt with a pointed stick and still have it be Greek.<br>
      In other words, if it looks like a duck, walks like a duck, and talks like a duck, it is a duck.</p>
      <p>To quote my friend Nick Shinn, what makes it look Greek is the "Curly Bits".<br>
      That is an oversimplification but still of value. My mother detested reading what might be called sans serif Greek type (even though there really are no serifs in Greek). She may be referring to the entrance and exit strokes John Hudson referred to or to Nick's curly bits (She died several years ago at 90 so I can't ask.). Greeks of today have differing opinions but are quite accustomed to what we choose to call sans serif.<br>
      Arabic and other scripts also have "curly bits" but they do not look Greek. Greek is a phonetic system like Latin and follows the same rules of reading order (at least beyond the earliest form).  This may give it a Latin-like grey value on a page from a distance but close up, what distinguishes it from Latin to me is the variety of stroke type. Latin ascenders are quite regular, a straight vertical bar is dominant.  Greek has more variety and none of it as simple as a straight line. Descenders in Latin are much more regular and simple as well.  The double-boweled g is the only odd-man out.  Latin x-height is clearly defined.  Greek is much more of a tendency than an exact point.  I see Greek more like a form which extends both ways beyond a centerline than Latin, which is pretty much a railroad track.</p>
      <p>Greek glyphs borrow less from each-other than Latin (which is much more modular).  What I might find a better description is to say that while Latin "marches" [lock-step to the beat of the drum across the page in rigid 4:4 time], Greek "dances" [in complex time signatures to a lilting mix of interplay of instruments].</p>
      <p>So then if it looks like a dance, sounds like a dance, and moves like a dance, it must be Greek. Opah!</p>
