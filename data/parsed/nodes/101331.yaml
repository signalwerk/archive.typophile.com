      <blockquote><p>The Greek script had its own intermediate uncial period. And the Greek minuscules emerged from that, just like it happened with Latin.</p></blockquote>
      <p>I have some doubts on the idea of the Latin minuscule evolving from the capitals through the uncial. A few weeks ago I got my hands André Gürtlers brochure ‘Die Entwicklung der lateinischen Schrift’ which he did for the ‘Bildungsverband Schweizerischer Buchdrucker’ in 1969. On some of the pages titled ‘Majuskelkursiv’,  I found the ‘Römische Urkundenkursiv’*, namely on page 28, image 32 and on page 39, image 63. The sheets with this script show handwriting with a cursive-like construction as well as ascender- and descender-like forms. They are dated ‘1st century B.C. or 1st century A.C.’ So if no paleographer has come up with more accurate dating of these scripts, they could as well have been written before the Capitalis Rustica. And (therefore) also before the Capitalis Monumentalis reached its formal summit (with both serifs and stroke contrast) on the Trajan column and similar pieces of lettering. If this is true, the development of the latin lowercase alphabet can be seen as in conjunction with the capitals and not as an ‘evolutionary’ process starting with the latin capitals.</p>
      <p>Anyone here that can update the information as provided by Gürtler’s brochure?</p>
      <p>* The brochure is english / german / french, but I am quoting from my German notes as I do not have the brochure at hand right now.</p>
