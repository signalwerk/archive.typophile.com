      <p>"And if we exclude them, the Greekness is gone ... I presume. "</p>
      <p>Greek writing began long before the Byzantine era and has continued long since.  Why would we take a snapshot of one point in time and anoint it as the sole example of Greekness? If the Ancient Greeks had never ventured beyond the earliest examples of their script, and no one else did after that time, there never would have been a Byzantine form to consider.<br>
      Yes, there was this awkwardly timed break during the Ottoman occupation. Yes, it came exactly at a time when every other culture was devising their own movable type.  Yes, this diverted the train from what might have been its destination otherwise. Never-the-less, this IS what happened and we must accept both the Turkinazation and the Dutchification, and the Anglification and even the new worldification of Greek script as part of history. We do not get to go back and purify the past of Greece to our liking.  We only get to contribute to the present as best we see fit. In every tomorrow, someone will write about us in the past tense and judge us with their contemporary eyes.  They too will not get it "right" just as we have erred in our assumptions of the past.  This is not a criticism, it is just human nature.</p>
