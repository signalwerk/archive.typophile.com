      <p>In Cyrillic handwriting, strokes may be added above or below <em>т</em> and <em>ш</em> respectively to tell them apart because they can be identical when scribbled, but since in print these letters are easier to distinguish without additional strokes, these are not used, much as in print the strokes that some people add to the numeral 7 or the letter z in handwriting are not used. Likewise, there is no danger of confusing the printed forms of non-descending η and κ, so there is no <em>necessity</em> to add the descender in print.</p>
      <p>However, if η with a descender was indeed established as the exclusive handwritten form due to the above reason, then that may have contributed to the same form being adopted exclusively in print in later centuries. If this indeed became the only form used in handwriting or print, that would mean that from then on, η canonically had a descender.</p>
      <p>The problem I have with this narrative is that a lot of today's Greek handwriting uses non-descending η. This may be an innovation, a possibility that I admit didn't occur to me at first. But since a non-descending η was already in common use centuries ago, I can't be sure.</p>
