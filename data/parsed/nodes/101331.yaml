      <p><em>I was thinking of it as a 'make-do' solution... in the early days of the independence of Greece.</em></p>
      <p>Ah. I think a phrase other than Latinisation applies in that case. What happens in the 19th Century in Greece is the importation of French (Didot) and German (Lypsias, i.e. from Leipzig) types which become the norms for Greek upright and italic style text types. In the 20th Century, Monotype 90, which is based on the Didot upright, becomes the standard publishing type. But while these designs originate outside of Greece, they are not Latinised in the sense that applies to the Linotype Greeks of the 1970s. They do not import into the script shapes structures from Latin type design; rather, they reinterpret the construction of letters inherited from the Byzantine minuscule using a contemporary split nib stroke model and the strong dynamics of Romantic types. Yes, they are designed to harmonise with what is happening in Latin type design at the same time, but they do so without aping Latin shapes.</p>
    html_clean: |-
