    <p>BACKGROUND:<br>
    During the last few decades Greek typography has been strongly influenced by Latin elements. Often, there is substitution of Greek letters by Latin ones. A few designers try to preserve characteristic Greek typographic elements into their work, but overall Greek typography appears to trend towards Latin assimilation.</p>
    <p>AIMS:<br>
    a) To define what constitutes Greek characteristics in a font,<br>
    b) To delineate the needs and problems faced by contemporary Greek typography end-users (graphic designers, book publishers of Greek texts, etc.)</p>
    <p>EXPLORATORY QUESTIONS:<br>
    a) How do you define or how do you approach the issue of a Greek characteristic in a font?<br>
    b) What questions would you have for end-users of your fonts?<br>
    c) Why do you design Greek fonts?</p>
    <p>P.S. The results of this study, including all information from font-designers and end-users, will be posted in this blog in the end of June.</p>
