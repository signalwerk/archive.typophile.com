      <p>This is something of an aside to the main discussion, but important to state, I think:</p>
      <p>Panos: <em>When we read we concentrate mostly on the upper part of the letters.</em></p>
      <p>This is often repeated, but seems to be a misinterpretation of the observation that <em>in the Latin script</em> it is easier to recognise words when their lower half is obscured than when their upper half is obscured. But we don't actually read in those conditions, and if we examine the results of <a href="http://pss.sagepub.com/content/19/11/1161.short" rel="nofollow">bubble testing</a> to see what parts of different letters we rely on most to recognise them during reading, we see that we make use of the full area of letters, with descenders being important to the recognition of letters that include descenders. There are many writing systems that have more descenders than either Latin or Greek, and most of the scripts of southern India and Southeast Asia make much more use of space below the baseline than they do ascender space. At typical text sizes, the full height of utilised space is easily within the vertical arc of foveal focus -- indeed, one of the things that makes reading easy is that individual lines of text are within this arc, while those above and below are parafoveal --, so I don't see any reason to presume that descenders are a 'distraction'; indeed, they provide for identifiable features in a distinctive area of the overall grid, reducing the potential for mis-identification (consider, in contrast, the relatively few descenders in Cyrillic text and the corresponding monotony of x-height letters).</p>
