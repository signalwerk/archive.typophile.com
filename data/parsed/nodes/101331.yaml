      <p>I think my uneasiness is mostly with the idea of full serifs on Greek minuscule letters. To me they still seem alien to formal Greek typography.</p>
      <p>In the case of Latin typography, the grafting of majuscule-style full serifs to minuscule letters must have been similarly jarring at first. But it became so well established that you find this in formal handwritten styles from centuries ago, not just in typefaces. Below is an image originally posted by John Hudson in the <a class="freelinking external" href="http://typophile.com/node/37310?page=2" rel="nofollow">Rule or Law thread</a> showing George Shelley's <em>Natural Writing in all the Hands, with Variety of Ornament</em> dating from 1709 (to emphasize, this is handwriting, not type):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Shelley1709b_4107.jpg"></div><p></p>
      <p>Here, full serifs on the minuscule letters are part of the formal writing style. I haven't seen anything comparable with Greek minuscules. Maybe today's Greek typefaces with full serifs on minuscule letters will become fully established and be regarded as normal in the future. But until then, they will seem a bit off to me for anything other than display purposes.</p>
      <p>That's part of my reservations about Centro serif, which I actually really like. It's more subtle and restrained in its deployment of full serifs on Greek minuscules than some examples that we've seen, but I would warm to it more as a neutral text face if it stuck closer to more authentic constructions.</p>
