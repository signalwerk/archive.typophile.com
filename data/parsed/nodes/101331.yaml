      <p>@Tatiana Marza: Congratulations on such a big accomplishment.</p>
      <p>I don’t know if I have already mentioned it or not, but when citing Typophile as a source for your research, APA recommends the following:</p>
      <p>Dean, C. T. (2013, March 11). Re: Questionnaire about the needs of Greek typography end-users [Online forum comment]. Retrieved from <a href="http://typophile.com/node/101331" title="http://typophile.com/node/101331">http://typophile.com/node/101331</a></p>
      <p><em>However</em>, that actually doesn’t allow readers to double check multiple in-text citations against their references on a forum with multiples pages such as Typophile. I looked into this very extensively following a few requests from other students asking me how to reference Typophile as a source in their research. My recommendation is as follows:</p>
      <p>————<br>
      <strong>In-text citation</strong><br>
      “This is the quote or passage.” (Dean, 2008, March 7, Page 8, 17:33).</p>
      <p><strong>Reference</strong><br>
      Dean, C. T. (2008, March 7, Page 8, 17:33). Re: Thread title [Online forum comment]. Retrieved from ttp://typophile.com/node/101331<br>
      ————</p>
      <p>The only URL you need to use, regardless of what page the comment is on, is the URL of the first page of the thread. The reader will then be able to navigate to the correct page using Typophile’s navigation, and search on the specific page to double check the reference.</p>
