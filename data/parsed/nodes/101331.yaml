      <p><em>Greek writing began long before the Byzantine era and has continued long since.</em></p>
      <p>Latin writing began long before the Italian renaissance and has continued long since. And yet the basic letter shapes of our text types have been frozen in their renaissance roman and italic forms ever since. We include or exclude their serif stroke terminals, we play with their weights and their slant angles, but we work with what are, in terms of the history of scribal text manufacture, an incredibly narrow, short-lived and regional set of letterforms.</p>
