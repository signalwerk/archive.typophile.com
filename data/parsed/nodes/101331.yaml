      <p>Tatiana, I didn't note your earlier response to Andreas. Thanks for explaining your process in more detail. It seems a good approach.</p>
      <p>Here are some questions that occur to me:</p>
      <p>1. How would you estimate (percentage) the amount of monotonic and polytonic text you work with?</p>
      <p>2. Whether you work with polytonic text personally or not, how important do you consider it for a Greek text type to include polytonic support?</p>
      <p>3. Greek italic types tend to be less differentiated from their upright styles than is the case with Latin fonts; sometimes slant is the only distinguishing characteristic. Do you find this sufficient, or do you wish for more differentiation, e.g. variant forms of some letters or different stroke patterns?</p>
      <p>4. Apart from upright and italic styles, what other features do you most want to have in a Greek font family? Additional weights (which?), true smallcaps, true superior letters (uppercase? lowercase?), or something else? If you want it all, how would you rank these things in importance?</p>
      <p>5. Some types evoke particular associations, e.g. 'classic' or 'modern', 'reserved' or 'friendly', etc.. These associations are subjective and seldom precise, but they are conventionally recognised. When you think about available Greek types, what associations do you wish were better represented? For example, do you wish there were more 'fun' Greek types, or perhaps more 'elegant' ones?<br>
      _____</p>
      <p><em>Also, a very great book belongs to George D. Matthiopoulos</em> - Anthology of Greek Typography.</p>
      <p>This is indeed a very good resource. One of the most interesting things I noted when leafing through this book is just how late it became a standard for tone and breathing marks to be set to the left of uppercase letters.</p>
