      <p>Ilya, if you've stopped laughing at that joke, maybe something has gone wrong. I've known it for over 30 years and it still brings a smile to my face. And I remember once telling it to one of the directors of the MIT Media Lab: she laughed so long and hard that I was actually a bit embarrassed for her. What I'm getting is: laughing at scientists who believe that gigabytes of data collected by spending millions of dollars can overcome lack of real insight never gets old.</p>
