    html: "<p>For me, the most obvious effect of Latinisation is not a cultural or ideological one, but a graphic one. When non-Latin scripts are subject to Latinisation, to processes of trying to make them 'more like Latin', whether structurally or in terms of borrowed shapes or details, the result is almost always an awkward stiffness, the loss of organic feel. As I suggested earlier with reference to Gill and Van Krimpen, when Latin designers bring this approach to non-Latin types they seems to demonstrate a loss of the very sensibility that makes them successful designers in the Latin script: they end up producing parodies of their Latin types as much as parodies of the writing system for which they are designing. When native designers bringing a Latinisation approach to their own scripts, I'm often left wondering whether they've ever really looked at the Latin script or tried to understand its subtleties. 'Latin' is often taken as a synonym for simplified, which leads to crude geometries and lack of sensitivity to relative proportions and how letters group together in words.</p>"
