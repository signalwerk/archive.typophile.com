      <p>I keep feeling that my views are not being clearly expressed, but that's partly because I keep learning things from this thread.</p>
      <p>The unfortunate periods of Greek history cannot be rewritten, as some have said.</p>
      <p>My view is somewhat agnostic on Latinization, and that I think is what isn't clear. Since the development of Greek typefaces was interrupted by the period when the Greek language was suppressed, it makes sense that in today's world, where the Greeks see what their fellow Europeans can do, there is pressure to make up for lost time, and copy the capabilities of the Latin script.</p>
      <p>I think it's preferable that Greek typographers make use of indigenous sources rather than directly copying the Latin model to the extent possible, but that is mainly so that the result will be more natural to the average Greek. I think some degree of borrowing can't be avoided under the circumstances; it's unfortunate, but it can't really be helped. What matters most to me is that Greek readers will be pleased with the result, though; my concern is not with satisfying an abstract goal of cultural purity.</p>
