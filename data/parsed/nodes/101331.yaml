      <p>@Tatiana: <em>Because there is no big difference in this case between upright and italic Greek.</em></p>
      <p>@Ilya: <em>I thought that the whole point of this discussion is that in Greek, italic is the default…</em></p>
      <p>In the 19th century, Greek type had upright roman capitals matched with an italic (slanted, cursive) lower case. That’s all. It was an archaïc pairing, identical to that of the ﬁrst Latin italics of Manutio.</p>
      <p>Monotype’s Greek 90 &amp; 91 implemented a pseudo-Latin two-style typeface by splitting the old Greek upper and lower cases, combining a backslanted version of the lower case with the capitals to become the “Roman” (Greek 90), and combining an <em>ITALICIZED</em>  version of the capitals to the lower case to become the “Italic” (Greek 91). This design was so well liked it became known as the ἁπλά, or plain style.</p>
      <p>So no, there is no big difference between upright and italic Greek, if one takes the ἁπλά to be the default or norm. However, I contend that the ἁπλά, despite its many virtues at the time and since, was a half-assed compromise, an expedient compromise that shirked the responsibility of designing an upright style that was truly functional, in terms of being one half of a Roman-Italic system, by merely straightening up the italic.</p>
      <p>Ilya, certainly there is a mirrored symmetry to the use of Roman and Italic as the contrast face for each other, but the point I am making is that Roman, with a vertical axis, is better suited to the rectangular quality of typographic layout.</p>
      <p>Tatiana, that is why I consider the ﬁrst approach (cursive as default, upright as emphasis) wrong.</p>
