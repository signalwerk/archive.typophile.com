      <p>Nick Nicholas' site has not be updated in a while (newer fonts are not listed), but that hardly matters since it is such a wealth of really solid information. I've made a lot of use of it over the years, and have also corresponded with him.</p>
      <p>Regarding the perispomeni, in SBL Greek I used an asymmetrical tilde form, because that was representative of the renaissance types that were my primary inspiration. In the Brill Greek I used the inverted breve form, and would be inclined to do so in any new font. I now wish I had done so in the Gabriola type, although the swung tilde there works nicely with the subtle lean of the letters. The Athena Ruby font for sigillography and numismatics uses the inverted breve of course, since that is the form used in the Byzantine seals and coins.</p>
