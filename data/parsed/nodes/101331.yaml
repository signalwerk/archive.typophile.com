      <p><em>One of the few things on which we seem to all agree is that the internal cursive construction of the Greek minuscule makes it challenging to distinguish italic styles from upright except through slant.</em></p>
      <p>I disagree, it’s quite straightforward. The problem is that the historical Greek plain style is slanted and cursive, whereas the default for Latin and Cyrillic is upright and quite removed from its calligraphic origins. There are two options for creating a binary upright vs italic (slanted) system of sufficient contrast from this historical Greek lower case:</p>
      <p>1) For the default, backslant it to upright, retaining its cursive, mixed-angle-of-stress construction, and make a sloped italic which has a uniform angle of stress. </p>
      <p>2) Retain the historical Greek forms relatively intact as the italic, and make the roman upright and with a consistent angle of stress, more like Latin. This respects the evolutionary origins of the Roman vs. Italic system, and preserves the archetypal Greek lower case in the italic. It’s the method I’ve implemented in the three faces I’ve designed Greek for.</p>
    html_clean: |-
