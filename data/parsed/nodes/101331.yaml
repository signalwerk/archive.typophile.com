      <p>MAXIM,<br>
      I couldn't find any blackletters in the Greek script. I suppose they were used only for logos. </p>
      <p>for JOHN:<br>
      First,<br>
      thank you for the detailed explanations! :)<br>
      Second,<br>
      &gt;Who was the first person to pair Greek upper- and lower case letters as a true bicameral system? Tatiana, is this something that Antonios Sigalas discusses?&lt;</p>
      <p>I was looking for days in my books, and it seems that Greek bicameral system was introduced after Gutenberg, and not by every publisher/punch cutter. Sigalas doesn't discuss about it and I could deduct this information only from images. Also, I noticed that for codexes, up till year 1645, there is no bicameral system, only occasionally uses of upper letters, as you mentioned. So, is a 'typographic' innovation. </p>
      <p>Do you know if the same happened to Latin? Or the bicameral system was introduced already in hand written texts before Gutenberg?</p>
      <p>I was reflecting about one of the characteristics of Greek letters, and I found some interesting images for Typophile's collection (as the images appear, 215 AD, 8th century AD, 1060 AD, 1079 AD, 1305 AD)</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_5240.png"></div><p></p>
      <p>for image 221 (the last): the first words are "<em>ά]γωνισώμεθα΄χαλεπόν γάρ </em>".<br>
      Note that the ni "ν" in the word ά]γωνισώμεθα and χαλεπόν resembles a lot to "μ". And there are more examples of this kind. </p>
      <p>WHAT MAKES A GREEK LETTER LOOK GREEK:</p>
      <p>- ascenders and descenders (which are more in number in Greek alphabet than in Latin). If you cut them as much as possible, the result will be latinization of font</p>
      <p>- another way to emphasize the Greekness is the unequal sizes of letters (the image below), but then you are loosing the harmonization<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/screen-capture_4177.jpg"></div><p></p>
      <p>- serif and semi serif is another Greek element. Even in designing a sans serif Greek font, as Helvetica World or Whitney, it can not be a 'clean' sans serif (latin VS greek in Whitney font):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/screen-capture-1_6476.jpg"></div><br>
      But exception are the capitals, as in John's project for Dumbarton Oaks Research Library and Collection.<br>
      This is the reason why lowercase Latin and Greek are considered two different categories of letters, especially in a cross script font?<p></p>
      <p>John, as I understood from your explanations about 'slant' factor, the Greek letters have  a 'hidden system of implemented ligatures', and the design itself is based on this construction. Thus, the slant is the only distinction between upright and italic Greek letters.<br>
      - so we have another element: ligatures</p>
      <p>Also:<br>
      - different x-height. But I couldn't find out if Greek's should be smaller than Latin's. Or is the designer who decides the proportions between them two?</p>
