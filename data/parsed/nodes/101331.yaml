      <p>It’s all about conventions, and is often style-related. For example, a Greek pi with overhanging bar (<strong>π</strong>) would be readable to a Cyrillic user in a sans-serif typeface (although look rather unusual), but not in a serif style (that could be pretty confusing).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Gr-Ru_Confusing_1_6643.gif"></div><br>
      Conversely, a Cyrillic-style pi (<strong>п</strong>) would be a sensitive choice for a Greek geometric sans; it would be still readable in a Greek serif typeface, but look very odd indeed. On the other hand, a ‘lunate-epsilon’ form of the <strong>E</strong>/<strong>e</strong> is not a design option in Cyrillic typefaces (as it is in many Latin designs). Cyrillic fonts feature both the <strong>е</strong> (<em>Cyrillic letter ye</em>, <a href="http://graphemica.com/%D0%B5" rel="nofollow">U+0435</a>) and the <strong>є</strong> (<em>Cyrillic letter Ukrainian ye</em>, <a href="http://graphemica.com/%D1%94" rel="nofollow">U+0454</a>).<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gr-Ru_Confusing_2_4058.gif"></div><br>
