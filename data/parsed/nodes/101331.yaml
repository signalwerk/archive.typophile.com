      <p><em>serif and semi serif is another Greek element. Even in designing a sans serif Greek font, as Helvetica World or Whitney, it can not be a 'clean' sans serif</em></p>
      <p>While I understand the point you are making, I disagree with your terminology. A serif is a kind of stroke termination, whereas I consider things like these<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/term1_4330.png"></div><br>
      to be entry and exit strokes. It is perhaps an overly subtle distinction, especially in designs with this kind of contrast pattern in which the visual appearance of an entry/exit stroke and a unilateral serif is very similar. But the distinction is more obvious in a typeface with a traditional contrast pattern. No one would call these heavy entries and exits serifs.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/term2_3690.png"></div><p></p>
      <p>While you are right that these entry and exit strokes may be retained in sans serif types -- and arguably should be -- there are some models of Greek sans serif that do away with these. In an <a href="http://www.typophile.com/node/98101#comment-531827" rel="nofollow">earlier discussion</a>, Nick Shinn showed some examples of a sans serif π reduced to a open-bottomed rectangle. Personally, I think it looks terrible, but within a particular style of type it would be considered conventional.</p>
