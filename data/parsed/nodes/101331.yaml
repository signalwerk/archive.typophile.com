      <blockquote><p>It would be irattional to ask from a Greek to read today the complicated word "para- παρά" (see the image, up center) and from an English - "que" and "pre", says Carter. Even if these were the most common ligatures of the past when people could easily read them!</p></blockquote>
      <p>The <em>ꝓ</em> (<em>p</em> with left-side hook) may be read as an abbreviation for <em>pr</em>, not always <em>pre</em> -- what came after the abbreviation would determine the reading --, but the point about the challenge for modern readers is the same. I think it is worth noting, though, that while the Greek <em>παρα</em> ligature is graphically more complex than the Latin abbreviations, it is decipherable because the underlying letter shapes and their order can be discerned in it (the Latin abbreviations cannot be deciphered from their shape, and one has to learn their meaning in order to read them). This is true of very many of the Greek ligatures, although some make use of neglected variant letter shapes, as in this <em>γγ</em> ligature<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/gamma_gamma_5541.png"></div><p></p>
      <p>and a few obscure one or more of the underlying letter shapes almost completely, as in these <em>επι</em> and <em>ος</em> ligatures<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/epi os_5628.png"></div><p></p>
      <p>[In my researches on Byzantine ligatures, I found that the letter <em>ε</em> was most frequently subject to shape change in ligation. There are some ligatures in which it is indistinguishable from <em>ϲ</em> (lunate sigma) and some in which it is reduced to a small curved stroke.]</p>
      <p>As I tried to suggest in my long comment, I think the role of ligatures in terms of the characteristics of the Greek minuscule is easily overstated and can be a red herring -- as the free variant elaborations of the Arabic <em>naskh</em> style can be -- distracting attention from what contributes most to the characteristic texture of Greek on the page regardless of the presence, absence or number of ligatures employed. This, I maintain, is primarily the steep stroke contrast pattern and the letter structures that evolved from that model.</p>
      <p>Since I mentioned Arabic, I'll point out that my review of Byzantine manuscripts led me to conclude that no rules existed for where and when particular ligatures or variant forms were used in Greek. So, unlike much of the letter shape modification and joining behaviour in Arabic, which is graphotactical (representing an aspect of a consistent script grammar), the Greek ligatures are free variants, whose use is a matter of personal preference or, sometimes, text fitting. With regard to the latter, it is interesting to note that Granjon's smaller sizes of Greek type include more ligatures than his larger fonts, and when one sees these small types used in marginalia and footnotes one can appreciate the space-saving value of many of these ligatures.<br>
      _____</p>
      <blockquote><p>Greek lowercase and Greek uppercase are not harmonized; Greek lowercase essentially only exists in a cursive form, and so doesn't match non-cursive uppercase.</p></blockquote>
      <p>I'd like to be careful in the use of terminology here, just to be clear what we are talking about. The term cursive can mean running in the sense of connected letters, which is clearly not what we're limited to talking about when it comes to Greek (indeed, in this sense the Byzantine manuscript style is at most semi-cursive). But if we apply the term to the internal construction of individual letters, then yes, the dominant model of Greek minuscule is cursive, i.e. the pen is not lifted in the writing of most letters, but instead strokes are reversed or turned to form transitions, as is the case with the humanist italic letters.</p>
      <p>The relationship of Greek uppercase and lowercase letters is indeed complicated by their separate histories, although I think it is wrong to say that they are inherently 'not harmonised'. Better to say that they are a challenge to harmonise or, even more simply, that they do not harmonise in the same ways that Latin upper- and lowercase harmonise. The same can be said of Latin italic upper- and lowercase -- for exactly the same reason: uppercase letters with interrupted construction and lowercase letters with cursive construction --, and yet that doesn't prevent these being accepted as paired alphabets.</p>
      <p>Who was the first person to pair Greek upper- and lowercase letters as a true bicameral system? Tatiana, is this something that Antonios Sigalas discusses? My impression is that this was either a typographic innovation or, at least, contemporary with the introduction of printing. Byzantine manuscripts are mostly unicameral, employing only lowercase letters. Uppercase forms are found occasionally in them, but mostly as initials at the beginnings of sections or paragraphs, and not used systematically within the text.</p>
      <p>Another thing to point out about cursive construction is that while in Latin script it is associated with the informal (quickly written) scribal hands that lead to the italic style of typography, it is only one of the characteristics of such hands, and isn't necessarily linked to informality. Slant and horizontal compression are other characteristics of informal hands, and while these are characteristic of the late Byzantine manuscript styles on which Aldus based his Greek types, there are plentiful examples of more formal Bzyantine manuscripts hands with broad and upright letters. The cursive letter construction is still the norm, i.e. pen lifts are minimised, and many letters are still joined in ligatures, but the overall impression on the page is much more formal and quite different from the Aldine style.</p>
      <p><a href="http://www.pemptousia.com/2011/11/the-library-of-vatopaidi-and-its-manuscripts/" rel="nofollow">This article on the library at Vatopaidi has some nice examples.</a> [Right click on the images to view them at larger size.]</p>
