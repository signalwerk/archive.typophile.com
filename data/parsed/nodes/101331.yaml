  - id: 547186
    user: 1262
    date: 2013-03-14T16:20:00
    date_raw: 14 Mar 2013 — 4:20pm
    votes: null
    html: |-
      <p>To provide some context for the comments that follow, here are samples of some Greek typefaces that I have created. Note that Gabriola is a display face, intended for larger sizes, and looks too light in the screenshot; note also that the heavy horizontals in the SBL Greek are due to rounding at this size and resolution. Click on the image for a zoomable and printable PDF version.</p>
      <p><a href="http://www.tiro.com/John/JH-Greeks.pdf" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.tiro.com/John/JH-Greeks.pdf" rel="nofollow"><img src="http://typophile.com/files/JH-Greeks_3452.png"></a></div><p></p>
      <p>Hrant's intervention introduced 'calligraphy' into this discussion, but I would prefer to return to the framework of Tatiana's original query. I don't consider any of my Greek types 'calligraphic'. The one that might seem on first glance to most obviously display calligraphic characteristics -- the Gabriola display face -- is actually the one that I created with least reference to scribal models, even less, it might surprise to learn, than the Helvetica World Greek.</p>
      <p>So, some comments on how I 'define or ... approach the issue of a Greek characteristic in a font':</p>
      <p>I think Tatiana is correct to say that the history of Greek typography reveals the strong influence of the Byzantine scribal hands. It is not the only influence: one sees sometimes reference to archaic styles, especially in display typography, and the Complutensian and related pre-Aldine types saw revival in the 19th and 20th Centuries (ignoring for now the importation of styles from other scripts as in the blackletter and woodtype examples shown in this thread). Overall, though, the Byzantine style has been the dominant influence, but not simply in terms of its most obvious historical stylistic aspects: intensive ligation and contraction, cursiveness, varying contrast patterns, etc., which frequently blind people to its most lasting influence. It is within this style that the Greek lowercase letters came into existence and persist in being written up to and through the introduction of type and print publishing. So it is entirely ordinary that it should have become the dominant model, just as the relatively unligated, formal and more regularised humanist book hand should have become the dominant model for Latin type: typography pretty much everywhere picks up whatever is the main scribal book hand of the day and runs with it.</p>
      <p>When I am designing type, I'm generally thinking mostly about structure and texture rather than style. So the questions I ask myself are not about what consitute 'Greek characteristics' but about the structure of Greek letters and how these create a particular texture on the page that I associate with 'Greekness'.</p>
      <p>In 2003, I designed the Constantia family for Microsoft, which was the last time I tried to harmonise Greek and Latin designs through stroke contrast pattern. There were a few reasons for this, one of which was that the ClearType rendering environment for which the types were designed is much more forgiving of thin horizontals and thick verticals than vice versa. At the same time, there are some Latinised contrast patterns in the Greek lowercase that I really find totally unconvincing -- too far removed from the historical evolution of the letter shapes --, so in Constantia there is a mix of contrast patterns (compare pattern of ο with that of π and τ; note pattern of λ). As I say, it is the last time I tried this approach, and Constantia Greek is my least favourite of my Greek designs (at least, of the ones I can still bear to look at). After the experience, I was left convinced that the shapes of the Greek lowercase letters, evolved through the Byzantine scribal model and its 350+ year typographic expression, naturally carry the pattern resulting from a more steeply held writing implement, and that this contributes massively to the Greekness of the texture on the page.</p>
      <p>Around the same time as the Constantia project, I began work on the SBL Greek type for the Society of Biblical Literature, and used the opportunity to renew study of Robert Granjon's Greek types, which I had earlier used as a model for the uncompleted, heavily-ligatured Clio type shown at the first ICTVC conference in Thessaloniki. For SBL Greek, I ditched all but two of the ligatures (γγ and λλ, which have become a feature of most of my Greek types), but stuck very closely to scribal letter shapes and proportions, and the variable contrast pattern. One of the personal goals of the project was to get a better sense of how much of the texture of Byzantine manuscript and Renaissance print pages was the result of the ligation and contraction, and how much was the result of the lettershapes and contrast patterns. My conclusion -- also confirmed by my experience with lots of other writing systems -- is that texture is built up from layers of characteristics, beginning with relative proportions and letter frequencies, then stroke contrast patterns, and that these, before the influence of particular weights and styles, contribute to what I think of as the 'feel' of a particular script on the page. The observable qualities that constitute Greekness in both a heavily ligated page of Aldine, Grecs du Roi or Granjon types of the Renaissance and a mostly unligated Foulis Press edition of the 19th Century are the product of structure and contrast pattern.</p>
      <p>As I wrote above, Gabriola is superficially 'calligraphic' in style -- which is to say that someone who doesn't know much about Greek calligraphy is likely to identify it as such --, but unlike the SBL Greek is not derived from a scribal model. The Gabriola Greek, because it doesn't include the same level of ornamentation options as the Latin and Cyrillic, includes a compensatory of ligatures to enliven things. But these are all what I think of as tying ligatures, i.e. in which the shapes of the underlying letters are not modified significantly, only linked to each other.</p>
      <p>[This relates back to my study of the Granjon types, in which I classified Renaissance Greek ligatures into two kinds: connecting and morphographic. <a href="http://www.tiro.com/John/ClioDemo2.pdf" rel="nofollow">The three pages of this PDF show the same passage in the Clio type with, respectively, no ligatures, connecting ligatures, and both connecting and morphographic ligatures.</a> In general, connecting ligatures present no problem for modern Greek readers, since the basic letter shapes are easily recognised; many of the morphographic ligatures from the Byzantine/Renaissance tradition present considerable problems, as a straw poll taken at the first ICTVC conference confirmed.]</p>
      <p>As with the Latin and Cyrillic, the Gabriola Greek explores what happens to structure and texture when lettershapes traditionally associated with a translation stroke model are instead made with an expansion stroke model.</p>
      <p>Gabriola is a display face, so shouldn't be taken as directly representing any ideas I have about Greek text types (even though we hinted it so that it bears up remarkably well at text sizes on screen (better than in print)). However, when I came to design the new Greek type for the academic publisher Brill, I made use of many of the same decisions that I had employed in Gabriola. My point of departure in this case, though, was the Didot Greek types of the 18th Century, which were informed by the dynamics of the contemporary split nib, and are the basis, via Monotype 90, for the famous <em>απλά</em>, i.e. simple or normal, style of Greek literary publishing. The Brill Greeks represent a regularisation and softening of the stroke contrast of the Didot types, maintaining the traditional Byzantine patterns but applying them to less cursive, more formal and upright structures. For comparison, here is a characteristic Didot Greek -- from Firmin Didot's 1828 edition of <em>L'Iliade d'Homère</em> -- shown above the Brill Greek regular and bold (obviously I've got very different ideas about wordspacing!):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DidotBrill_5267.png"></div><p></p>
      <p>It's been very gratifying to see the Brill Greek in frequent use in Brill publications, and to note among other things that it harmonises incredibly well with the Brill Latin, despite a completely different ductus and contrast pattern. This confirms again something that I discussed during my Beatrice Warde Memorial lecture <a href="http://www.tiro.com/John/SameDifference-slides.pdf" rel="nofollow"><em>Same Difference</em></a> [some corruptions in that PDF resulting in missing characters] at St Brides a few years ago: cross-script harmony is firstly and most importantly a matter of weight and proportion, rather than of ductus and contrast pattern. It is possible to elegantly harmonise two different writing systems together on a page without forcing either into the dress of the other. It is possible for both to display their characteristics textures on the page and still harmonise. Indeed, to take the notion of harmony back to its musical origins, it is possible for the two voices to produce beautiful harmony without one trying to sound like the other.</p>
      <p>Finally, a word on the earliest of my Greek designs shown here, the Helvetica World Greek that I designed for Linotype at the beginning of the millennium. <a href="http://www.tiro.com/John/HelveticaGreeks.pdf" rel="nofollow">See also this comparison of the design -- here under its earlier name Helvetica Linotype -- with Matthew Carter's original Helvetica Greek from the 1970s.</a> Some people, especially at the time of the release of Helvetica World, interpreted my design in terms of ideas about correct and incorrect ways to design Greek types, especially sans serif types, which I suppose relates directly to Tatiana's questions. I was bemused to find that I had both champions and critics in Greece, and there were references to the 'Hudson way' as something to be emulated or disavowed. As time has passed, I've tried to get away from that interpretation, and one of the things that I find interesting about the project is that it shows how much designing an extension of an existing typeface for a new script is like a work of literary translation: more than one translation is possible, and each is likely to respond to different aspects of the original. The original Helvetica Greek reflects the contemporary associations of Helvetica with internationalism, standardisation and, it must be said, westernisation; the Helvetica World design reflects my interest in the relationship of the mid-20th Century Swiss/German grotesk to the structures of 18th Century romantic types (esp. Didot and Walbaum). So my Helvetica World Greek is thematically related to my most recent, Brill Greek, although one might not guess so from a simple comparison.</p>
      <p>So that's a longish answer to Tatiana's question (a).</p>
      <p>I'll give some thoughts to the other questions and try to respond in shorter manner.</p>
