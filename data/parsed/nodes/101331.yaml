      <p>&gt; <em>Saying that Latin is easier to read than Greek because it has fewer descenders is exactly backwards.</em></p>
      <p>There is/was a quote I’m trying to locate (Eco? Pinker?) for many years: the premise was that even if one replaces each letter in an English sentence by its bounding rectangle, the resulting image is still kinda readable (as in ▯◽▯ ▯◽◽ ◽◽◽◽ ▯▯◽◽ — only with proper distinction of ascender /descender parts).  The theory is/was that the eye when it follows the sentence can recognize such “coarse” shape quite early (when finishing the disambiguation of preceding words, so the following words are still on the low-resolution part of retina), and then this preliminary info may be used when these words come “into focus”.</p>
      <p>But then I discovered a text (blog?) of the head (?) of Microsoft type design team.  The premise was that when he came to M$, the team was under the influence of the theory I hinted to above; since at the moment he knew that the theory is not very much trustworthy (in view of recent improvement of experimental data), he spent some time to collect information on experiments which more or less debunked the theory above.  IIRC, the machine in the experiments would track Rapid Eye Motion, and would blur all the letter further than some distance away from the center of vision (in real time!).  IIRC, the speed/reliability of reading in these experiments would not suffer even if the “distance” is 3–4 letters.  (Sorry, do not have an exact reference right now.)</p>
      <p>So the theory that “macro-shape” of words may be helpful for reading might be not that much substantiated by experiments…</p>
