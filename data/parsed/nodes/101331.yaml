      <p>Tatiana, how are you defining 'end-users of Greek fonts'?</p>
      <p>I presume from your location that you are thinking of end-users in terms of native Greek users. But one of the distinctive aspects of Greek script typography -- thanks to the classical heritage and early Christian heritage -- is that there is a very considerable user base that is outside of Greece and not made up of native readers.</p>
