    html: <p>Tatiana, I think Chris has done an admirable job explaining the distinction between serifs and entry/exit strokes.  There is a relationship between the two, confused by a tendency in English to call certain kinds of entry and exit strokes in Latin script, especially italics, 'serifs', but I find the distinction useful. Nick has made the reasonable objection that the entry and exit strokes can be interpreted as part of the stem, not as a separate stroke. So perhaps instead of talking about entry and exit strokes we should talk about 'stroke entries' and 'stroke exits', i.e. as something that happens at the beginning or end of a stroke other than a hard start or hard stop.</p>
