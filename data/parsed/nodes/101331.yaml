      <p>@Albert Jan Pool &gt; I have some doubts on the idea of the Latin minuscule evolving from the capitals through the uncial.</p>
      <p>However, it is quite obvious from the sources of medieval manuscripts. The link is the ‘Halbunziale’ (english?). It evolved not ‘from the capitals through the uncial’ but *from the Uncial through the half-uncial*. Although there have been cursive writing styles in Trajan times and later, of course, no path of adoption leads from those to the minuscule of Alkuin (8. c.).</p>
