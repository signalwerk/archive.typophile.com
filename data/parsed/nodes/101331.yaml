      <p>Monotype 90, 12 point:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Greek3_5050.png"></div><p></p>
      <p>Re coordination: I didn’t feel it was necessary to provide chirographic alternates of eta and upsilon in the quaint Stylistic Set. I was daunted by the number of extra glyphs that would require in a polytonic font! </p>
      <p>But more to the point, I rather like the x-ness of the quaint form, and see no reason why every in-stroke should be identical, or why every letter should have an instroke. In fact, if one is attempting a quaint chirographic effect, then vagary, rather than “coordination”, would seem to be the order of the day—which is apparent in Monotype 90.</p>
