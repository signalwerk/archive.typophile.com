      <p>APA doesn’t have a rule for this, and I have given it a great deal of thought. My best recommendation for quoting the same authour multiple times from the same thread is include a separate reference for each group of citations from the same year should the same authour comment in the same thread that happens to span more than a one year period. So, if you cite them 10 times on year one, and 55 times on year two, you only need two references:</p>
      <p><strong>In-text citations</strong><br>
      “This is the quote or passage one.” (Dean, 2008, September 7, Page 8, 17:33).</p>
      <p>“This is the quote or passage two.” (Dean, 2008, December 22, Page 9, 09:02).</p>
      <p>“This is the quote or passage three.” (Dean, 2009, January 6, Page 9, 17:45).</p>
      <p>“This is the quote or passage four.” (Dean, 2009, January 11, Page 11, 12:22).</p>
      <p><strong>References</strong><br>
      Dean, C. T. (2008). Re: Thread title [Online forum comment]. Retrieved from <a href="http://typophile.com/node/101331" title="http://typophile.com/node/101331">http://typophile.com/node/101331</a></p>
      <p>Dean, C. T. (2009). Re: Thread title [Online forum comment]. Retrieved from <a href="http://typophile.com/node/101331" title="http://typophile.com/node/101331">http://typophile.com/node/101331</a></p>
      <p>And after this thought, I would recommend that when you cite someone only once, use this reference style, and not the one I recommended earlier.</p>
      <p><strong>And here is a good reason to use your real name as your screen name</strong>: Let’s say you were citing Chris Lozos. You make the appropriate in-text citation (Lozos, C. 2000) and reference, but, when the reviewer goes to check the URL, all they will see is a screen name — dezcom, and they may be unable to validate your source. If a reviewer can’t validate your source they may not let it be published, and you would have to remove content, citation, and reference entirely.</p>
      <p>Hope this helps.</p>
