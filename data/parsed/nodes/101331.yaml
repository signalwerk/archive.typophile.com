      <p>I will go a little bit backward...</p>
      <p><em>@Chris</em>,<br>
      <em>"I see no purpose in imposing any specific model to present day design of type be it Greek or Latin or Cyrillic"</em>.</p>
      <p>From the moment a type designer posts his font(s) for download or purchase on web, he automatically imposes a specific trend or model for the present day type design. And he has an instant impact on the everyday letters which will be read by millions of Greeks.<br>
      A graphic design studio or book publisher can afford to buy a good and expensive font (a not Latinized one), but a freelancer graphic designer will stick to what is available for his small pocket. Of course, they are all free to chose among the available Greek fonts, and here arouses the question of the aesthetic education of Greeks. Yes, in many fields they are 20 years back in time, but who is entitled to deprive them of their own cultural identity? From this point of view I'm against Latinization. </p>
      <p>Along the current economic crisis in Greece, there is a tendency of finding and establishing the Greek identity again, to impose the Greekness on a global level. A company was established: <em> Made in Greece</em>, which  <em>"emerged as a new idea-solution from the Greek crisis and the need of a modern promotion of Greek companies and their products abroad, aiming to further develop the Greek production and services of our country"</em>.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/pasteli_6655.jpg"></div><p></p>
      <p>I just love the font used on this package and the illustrated elements. For Greek market is quite a good designed package (exclude the red logo).<br>
      But do not be carried away by it. Greek people are looking mostly for sans serif fonts than for serif (the results of my questionnaire will show more precise data).</p>
      <p>There is a tendency (in the field of graphic design, at least) for more <em>clean and uncluttered fonts</em>. And for better or worse, Latin typefaces do impose the modern fashion styles. But some models of Latin fonts just don't suit the Greek environment. You cannot apply same rules for different situations...It just doesn't work!</p>
      <p>Another interesting question is how could progress be achieved in typography of Greek fonts? How could the historical, folk elements be combined as to create a new, harmonized font alongside a Latin one? </p>
