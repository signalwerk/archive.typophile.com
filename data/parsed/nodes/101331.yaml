      <p>Perhaps we can take a couple of more practical runs at the topic of Greek type design?</p>
      <p>1. Notwithstanding the variety of letterforms in the Latin script tradition, the binary categorisation of serif and sans serif is predicated on the identification of certain design features as optional and superfluous to the essential letter shape. This enables us to produce skeletal representations of those essential shapes, which while not necessarily interesting or particularly useful as designs serve as a kind of diagram of the letter.</p>
      <p>Can this be done for Greek? And what would the results look like? What parts of the letters are to be considered optional and superfluous, and which are to be considered essential.</p>
      <p>My suspicion is that, when this is attempted, there will remain considerably more variation in the notion of essential letter shape than there is in Latin script. But I would be interested to see, for instance, where Nick makes the cuts.</p>
      <p>2. One of the few things on which we seem to all agree is that the internal cursive construction of the Greek minuscule makes it challenging to distinguish italic styles from upright except through slant. This is a practical design problem, and seems to me something that we might usefully focus on, with illustrations of a variety of approaches. Interest?</p>
