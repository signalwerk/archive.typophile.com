      <p>Tatiana,<br>
      I am a native born American of Greek decent. Since I was born during WWII, we lived with my Greek only speaking grandparents while my father was away at war. For this reason, I first learned Greek and then English.  I must admit that I soon forgot most of the Greek that I had learned so I have a strange recollection of the mixing of Greek and English forms.  I have made some attempts at designing Greek types but have neither tried to be historically correct with Byzantine forms nor have I purposely Latinized them.  I see no purpose in imposing any specific model to present day design of type be it Greek or Latin or Cyrillic.  There are plenty of capable revivalists out there that I need not add myself to the mix. I just design the Greek glyphs as forms unto themselves.  Does this mean I am any more or less authentic or accepted than others? No.  I just design what I design and allow users to choose.  Rather than spend what few years I have left testing what the audience may prefer, I simply use that time designing from my perspective.  This is quite time consuming in itself ;-)<br>
      The following links show samples of some of my Greek type:<br>
      Froggy Italic: <a href="http://www.flickr.com/photos/dezcom/6872160581/in/set-72157611971349634" title="http://www.flickr.com/photos/dezcom/6872160581/in/set-72157611971349634">http://www.flickr.com/photos/dezcom/6872160581/in/set-72157611971349634</a><br>
      Froggy: <a href="http://www.flickr.com/photos/dezcom/4642614036/sizes/o/in/set-72157611971349634/" title="http://www.flickr.com/photos/dezcom/4642614036/sizes/o/in/set-72157611971349634/">http://www.flickr.com/photos/dezcom/4642614036/sizes/o/in/set-7215761197...</a><br>
      Boulder: <a href="http://www.flickr.com/photos/dezcom/3138565933/sizes/o/in/set-72157611971349634/" title="http://www.flickr.com/photos/dezcom/3138565933/sizes/o/in/set-72157611971349634/">http://www.flickr.com/photos/dezcom/3138565933/sizes/o/in/set-7215761197...</a></p>
      <p>This last link is scans from my mothers and grandmother's school book:  <a href="http://www.flickr.com/photos/dezcom/sets/72157616479131055/" title="http://www.flickr.com/photos/dezcom/sets/72157616479131055/">http://www.flickr.com/photos/dezcom/sets/72157616479131055/</a></p>
      <p>Re:<br>
      a) How do you define or how do you approach the issue of a Greek characteristic in a font?<br>
      b) What questions would you have for end-users of your fonts?<br>
      c) Why do you design Greek fonts?</p>
      <p>a) My approach is visual execution from what my own memory decides is in the arena of the form. I do not use models or source material of any kind. Thereafter, it is a question of fitting with the other glyphs in the script as I have drawn them.<br>
      b) I would only ask users if the font is in any way problematic for them;<br>
      c) I have no grand reasoning, I just do it because I feel the need to. This is no different than Latin script fonts I design. At my age, I am happy to finally be able to do the things that I want to instead of what others may want of me.</p>
