      <p>For Latin, the bicameral system was introduced under Charlemagne, and so it existed in handwritten texts long before Gutenberg, who made considerable efforts to copy the handwritten texts of his day.</p>
      <p>At first, the bicameral system consisted of tacking Roman capitals on to the uncial script, and it likely did involve occasional capitals for a little while at the start. But by the tenth century, the system was well established:</p>
      <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/Carolingian_minuscule" rel="nofollow">http://en.wikipedia.org/wiki/Carolingian_minuscule</a></p>
      <p>Incidentally, I see that your examples of Greek manuscripts suggest a small x-height. In Latin typefaces, though, x-height is quite variable, depending on the design goals of the script. Thus, oldstyle faces like Caslon or Cloister Lightface illustrate the traditional ideal x-height, while Times Roman or Corona have much larger x-heights to maximize legibility.</p>
      <p>Armenian has a traditional "Bolorgir" form with a considerably smaller x-height than the Latin alphabet. The Armenian lowercase letterforms are suited to a small x-height, because they exclude two-storey letter forms; thus, lowercase S lies flat on its back. Greek lowercase, on the other hand, has a similar variety of letter shapes as Latin lowercase, so its natural x-height could not be much smaller.</p>
      <p>(If you feel I am being noncommittal on this issue, you are correct. In my opinion, whether the x-height of Greek lowercase should naturally be lower than that of the Latin alphabet is a question that can really only be answered by generations of native speakers of Greek as type designers, as typographers who choose type designs, and as readers. Anyone who wants can study old inscriptions and design a "Greek" typeface, but a self-conscious effort to incorporate Greekness into a type design runs the risk of failing badly. Yet, without conscious attempts, there will be nothing to choose from but Latinized models. The only resolution I see is careful study of both traditional and folk sources - and patience.)</p>
