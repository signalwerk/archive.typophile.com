      <p>@hrant:<br>
      <cite>This might sound strange coming from me, but: I wouldn't draw such a firm line between foreigners abroad and natives living in the country. For one thing, what about somebody (like Gerry Leonidas) who is an expat? Or a Russian who moves to Greece because he loves making Greek type. Often "converts" are more Catholic than the Pope! Any culture belongs to the whole planet to some extent - we're all in this together. And as important as nativity is, it doesn't guarantee really grasping the needs of one's culture. Just because a person is closer to something does not give him the right to abuse it more.</cite></p>
      <p>Well, I do admit that knowledge of the Greek language isn't coextensive and coterminous with Greek residence or nationality. But I didn't think it necessary to discuss corner cases to make it clear that being an expert typographer is not enough to give one knowledge of the <em>gestalt</em> of a script not one's own.</p>
      <p>One can make good guesses with insight and study, though; a failed attempt by an outsider can give inspiration to someone with the right background to achieve something that otherwise would not exist.</p>
      <p>One shouldn't abuse one's own script, but one's compatriots would presumably reject abuse for what it is.</p>
      <p>As for pretending Athens is Paris... ah, others would wish to pretend New York, or Montreal, or Berlin, or London, or even Beijing or Pyongyang is Paris! Eventually, though, Greek type designers may develop a rich palette that has no need to rely on foreign models. But I can't demand they wait for that because I am charmed by their quaint indigenous characteristics.</p>
