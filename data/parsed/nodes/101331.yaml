      <p>Nick: <em>What is this assumption that readers have expectations for old-fashioned type?</em></p>
      <p>I never said anything about old-fashioned type.</p>
      <p><em>But there is no reason why independent type designers shouldn’t be progressive.</em></p>
      <p>And likewise no reason why they shouldn't be as conservative as they are inclined? I'm fully of the opinion that people should do what interests them most or, in the words of my hero David Jones, 'We should work within the limits of our love'. What I have objected to in the culture of Latinisation, particularly as it played out in the history of Greek type, is the association of such trends with 'progress', 'westernisation', 'modernisation' etc., as if these things were only approachable through aping characteristics of another writing system. As for my own approach, when I started introducing traditional letter construction into Greek companions to sans serif Latin types, this was very much against the norm that had been established in the 1970s and '80s and which was prevalent in Greek typography. Of course, we're both Canadians, so the concept of progressive conservative isn't contradictory to us.</p>
