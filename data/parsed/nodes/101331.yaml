      <p>Tatiana,<br>
      Whatever you call those bits at the beginning and end of a stroke does not matter as much as what they look like.  Do you know Catich's book I sited above? If not, it would be a valuable read for you.<br>
      <a href="http://www.amazon.com/The-Origin-Serif-Writing-Letters/dp/0962974013" title="http://www.amazon.com/The-Origin-Serif-Writing-Letters/dp/0962974013">http://www.amazon.com/The-Origin-Serif-Writing-Letters/dp/0962974013</a><br>
       Look at the forms of the roman serif and see how they differ from Greek.  There is a visual difference which you can study and see.<br>
      Look at your sans serif example of Greek above at the tails of the final strokes above in your example. This is a sans serif form but it includes the hooked tail because that is part of what makes it read as Greek.  I would be the last person on earth to suggest that you must follow literally the scribal works of past Byzantine writers. You can picture what now remains as a feature of the letterform abstracted from the 14th century manuscripts that still is part of what is needed to read as Greek.  The true test is in the eyes of a Greek reader.  Do they read it as Greek without hesitation or discomfort? If yes, then it is fine.  This leaves a huge degree of variation.  As always in type design, the eye is the final arbiter.</p>
