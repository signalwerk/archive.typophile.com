      <p>@John Hudson:<br>
      <cite>A reader in Greece is unlikely ever to encounter Porson.</cite></p>
      <p>I'm not so sure about that. I recall looking at a few Greek-language books in the local public library some years ago, and while several were in various sans-serif faces, quite a few were in what I think of as Porson: italic lowercase, upright capital letters with serifs - and looking like Bodoni, not like, say, Times.</p>
      <p>Still, that may well be true for books published after X - where X could be some year in the 1980s.</p>
      <p>EDIT: Although books for the period in question are hard to find on the web, I managed to find enough that I'm starting to feel that I'm mistaken.</p>
      <p>@John Hudson:<br>
      <cite>You seem to suggest that Latinisation was a kind of 'make-do' solution, something that the Greeks fell back on because they didn't have any other option.</cite></p>
      <p>I agree that by the time phototypesetting came along, they already had options - they didn't <em>have</em> to wait for the PC and the laser printer.</p>
      <p>I was thinking of it as a 'make-do' solution... in the early days of the independence of Greece. (Admittedly, I also was thinking in terms of it being the case that even in the present day, it is easier to copy than to originate, especially when a model is so conveniently to hand.) After that, at least in the metal type era, the effect of the natural conservatism of readers, combined with the costs of changes, would likely have kept the typefaces that were initially common in use with minor changes.</p>
      <p>That the junta would do the sort of things that such a regime would be expected to do... is unsurprising. I'm not familiar enough with Greek history to be aware of this, but I'd expect it to have led to a counter-reaction, the way the katharevousa versus demotika issue got settled.</p>
