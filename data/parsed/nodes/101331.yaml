      <p>Being conscious of the distinction between entry and exit strokes and serifs will help designers aiming at some level of authenticity in a Greek typeface, so I'm happy to learn this.</p>
      <p>My take on this hasn't been explicitly stated yet in this thread, although it's probably clear by now. Due to an enforced interruption in Greek script and printing tradition, Greeks have felt compelled to borrow from the ready-made models in the Latin script community - and Greek typefaces designed by non-native speakers - to have typefaces with which to print books and newspapers and the like to meet practical needs.</p>
      <p>I don't condemn or deplore this; it may be regrettable, but it's a natural reaction to circumstance.</p>
      <p>To emerge from this, to create typefaces that better meet the cultural and aesthetic criteria of Greek readers, is a good thing. But while a study of historical models is <em>useful</em> in the attempt to do this, one should probably also study <em>folk</em> models, (i.e. a street vendor's handwritten sign with the price of oranges) because success in this quest will likely take a long time to achieve, as different attempts at a more Greek style of printing succeed or fail in the community. (It isn't due to some racist or mythical belief in the value of blood ancestry that I think that this must largely be carried out by native Greeks; it's that people who read and write Greek, and live in Greece, that will have been exposed to innumerable instances of Greek handwriting and sign-painting and typeface choice, thus having the base of information on which to form judgments on what would "look Greek" to other Greeks!)</p>
      <p>After all, in this respect, Greek typographers face a doubly difficult task. It is not simply that they need to make up for the lost time when the Greek community was without the resources to design its own types, and produce a developed indigenous Greek typeface tradition. They must also take the foreign invention of a bicameral writing system and fully assimilate it so that it ceases to be alien.</p>
