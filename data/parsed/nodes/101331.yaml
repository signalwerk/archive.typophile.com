      <p>Well, here is an example from astronomy.</p>
      <p>Does the Earth turn on its axis once in 24 hours, while the Moon does not rotate at all?</p>
      <p>That is the obvious appearance of things.</p>
      <p>But if, in the case of the Earth, you try to explain the Equation of Time, or, in the case of the Moon, you try to explain libration in longitude, you encounter the hidden appearance.</p>
      <p>The Earth rotates, with respect to the fixed stars, with a period of 23 hours, 56 minutes, and 4 seconds. Its 365 day journey around the Sun makes the day longer - 24 hours - on average; but since the Earth's orbit is elliptical, and also since the ecliptic and the equator do not coincide, the time of apparent noon as registered on a sundial will move up to 15 minutes back and forth from clock time.</p>
      <p>And the Moon's orbit is also elliptical, leading to libration, from combining an orbit and a rotation which both have a period of 24 1/3 days.</p>
