      <p>Engraving copied from a handwritten original, which is the point of these kinds of publications: to serve as exemplars and advertisements for writing tutorials. In the same book that Brian cites, George Shelley feels obliged to state that Bickham's 'Imitation falls short of my originals'. One of the things I have noticed in my research on the development of the English Roman is that when new styles are introduced by writing masters it takes a while for engravers to become proficient at cutting them. So, for examples, in the first example of the formal roman style that I've found, in John Seddon's 1695 book, it's cutting is notably crude compared the cursive styles and ornaments in the same publication. </p>
      <p>This is drifting quite far off topic for the thread, so we can take this up elsewhere if of sufficient interest.</p>
