    html: |-
      <p>&gt; great taste for sweets</p>
      <p>actually, I have even more taste for other sweet things in life :-) like spicy type </p>
      <p>But now, seriously. The decision to support the polytonic range of characters is not just meant to be an advantage, but is clearly aimed at a specific user group: scholars of the classics who just need this entire set. As far as I can tell, Andron Greek is used more outside Greece by editors and scholars than by Greek customers.<br>
      Latinization. This is one of the most fascinating topics in type, actually. (By the way, one can cross-flavour every script with whatsoever writing style, you can do a chinese-looking Latin or an Arabic-looking Cyrillic; a Chinese blackletter face has been done recently… so far the game of it.)<br>
      The greek minuscule got under Latin pressure over the last 15 years not only because there was some wishful mood of getting Greek ‘modernized’ – whatever this may imply. More than that we still see (and feel?) that the Latin and the Greek letters are basically identical. So the wish *to see either alphabet on the same level* seems natural. Not to forget that both capital alphabets co-exist as close kin without the medieval-age metamorphosis history of the minuscules, to the day.<br>
      So the Latin journey of Greek was inevitable. When I started to work on Andron Greek I thought “make it look like Latin” in order to get a harmonized overall appearance. (I never intended to stick to one of the historic models like Garamond or Didot Greek.) The result was perfect: you couldn’t even spot a few greek phrases interspearsed in a Latin text because the likeness was extreme. But then I learned – again: inevitably! – that my achievement was ‘too much of a good thing’, the Greekness got lost and that was just bad. So I reworked it, several times. And I went back the path from Greekness to Latinitas, step by step. I found an old review image of that process, versions A to D in time order:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Greek_ABCD_6191.png"></div><br>
      As you see I came quite back home to Hellas with the latest version D. But I was still not convinced. Some details were now “too Greek” – no. Not too Greek but too cursive, too scripty. The more traditional reverse contrast pattern (lambda, chi) did not fit in. I now knew I wanted it not more Latin, but more smart. And I compiled another version (M) from the previous ones:<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Greek_M_kl_6361.png"></div><p></p>
      <p>But still this was not the end. At least three more versions got tested.<br>
      After a year something very important happened: I was in Greece :-) (in Saloniki, actually). And I digged in the very life of Greek type: newspapers, shopfronts, the wonderful και, menus, even silly espresso cups.<br>
      When I was back I screwed up the font again and did those version which remained the valid one till today:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/and-gre-final_6628.png"></div><p></p>
      <p>I know that the result does not convince everyone. But the font found its way into use and that tells me that the solution is a possible one.</p>
      <p>postscriptum. Last year I enjoyed visiting Corfu. I learned that the island, although belonging to Greece and being populated by Greeks, is rather Italian by kind of its fauna and style of its architecture. I found this most remarkable.</p>
