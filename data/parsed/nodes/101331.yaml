      <p>@Tatiana:<br>
      <cite>Do you have any ideas how we could learn about Greek readers expectations ?</cite></p>
      <p>For the purpose of coming up with original and creative efforts in Greek typeface design, one would have to have such a comprehensive understanding that asking Greeks a limited number of questions would not suffice, even if the questions were subtle.</p>
      <p>That's why I would leave that field largely to Greek type designers and to those who have made an extensive study of Greek typefaces and script hands.</p>
      <p>But that doesn't mean I am hostile to efforts by outsiders, since a fresh perspective can be helpful too - merely that outsiders can be forgiven for "playing it safe".</p>
      <p>I was the one who suggested that, since attempting thoroughly Latinized versions of Greek lowercase has in the past resulted in only ludicrous failures (I wonder why, since one could clearly use Cyrillic as a model, and produce something that wouldn't look stupid to a Latin alphabet user, even if no Greek had a use for it - so even if failure is certain, it doesn't have to be ludicrous) maybe the upper-case and lower-case could be harmonized to the level that Latin alphabet users think appropriate by modifying the upper-case instead.</p>
