      <p><cite>Strangely, scribes seem to have actively employed stylistically related forms of eta and kappa, in the same way that Latin writers might coordinate forms of g and y</cite></p>
      <p>The first thought I had was that the ascending η and κ looked like some handwritten forms of their cognate Latin letters h and k, which can be subject to similar confusion in a sloppy hand.</p>
      <p>Tatiana: <cite>BTW, why do you find that my second image (about sans serif) is not latinized?</cite></p>
      <p>I am not saying it is not Latinized, but because monolinear sans serif designs are just basic skeletons of letters it is not conclusive whether the forms were arrived at by imitation of Latin forms or by a parallel geometric simplification. It is more obvious with high-contrast, serif designs where you have wholesale copying of Latin construction details such as the full foot serifs on the η.</p>
      <p><cite>In what degree the contemporary handwriting style of Greeks should be taking in consideration?</cite></p>
      <p>No more than the contemporary handwriting style of Latin or other writing systems should be taken in consideration in designing typefaces. Handwriting and lettering styles and printed letterforms continuously influence each other, but rather subtly. Printed letterforms tend to be more conservative and to settle on a single normative form for a letter which can have several different forms when written by hand. The reason I brought up handwriting was to dispel the notion that a non-descending η could only be explained as due to Latin influence, not to suggest that printed forms should take the cue from contemporary handwriting.</p>
