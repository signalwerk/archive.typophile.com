      <p>Tatiana: <em>I guess being able to introduce new ideas in type, with a balance between what Greek society is used to and with a touch of the inner world of type designers. Maybe like Sholderer...His font was innovative at that time</em></p>
      <p>It was, and this is an important point: there is a distinction between a kind of absolute innovation -- truly novel shapes, of a kind that occur only rarely in typography -- and what is innovative for a particular time. Scholderer, it should be remembered, was not a professional type designer: he was an incunabulist (scholar of early European printing) and bibliographer. His New Hellenic type design was a deliberate attempt to revive a neglected branch of early Greek 15th Century typography: based on the <a href="http://typophile.com/files/FormGrekBkHnd.jpg" rel="nofollow">rounder, more upright Byzantine hand</a>, and without ligatures. [Robert Proctor's <a href="http://typophile.com/files/GR10.jpg" rel="nofollow">Otter Greek</a> had been an earlier, less successful effort in the same direction.]</p>
      <p>So while, in the context of Greek type <em>at that time</em> (1920s), Scholderer's design is clearly innovative, it is also an historical revival, undertaken by a man whose professional life was entirely focused on the distant past, not on contemporary graphic design or typography. This is why I find the contrast of innovative and conservative artificial and unhelpful. While not in the same class as New Hellenic, I would argue that my Helvetica World Greek was innovative, at its time, in the context of fashions in Greek type design; indeed, it caused something of a scandal by breaking the accepted mould of numerous other Greek 'Helveticas', precisely by introducing those features of letters that Nick now describes as conservative.<br>
      _____</p>
      <p>There is a 2006 discussion regarding Scholderer's New Hellenic (with some discussion of Latinisation, which I hope I refuted) here:<br>
      <a href="http://typophile.com/node/19265" title="http://typophile.com/node/19265">http://typophile.com/node/19265</a><br>
      In that thread I posted images of a number of incunabula types on which Scholderer drew for his revival. Seven years on, I don't even remember writing all that stuff, but am pleased to see that I don't disagree with it now.</p>
      <p>PS. That 2006 thread is also a classic example of why Nick and Hrant should be discouraged from being in the same room. Don't bother reading to the end of the thread.</p>
