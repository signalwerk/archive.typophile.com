      <p>@Tatiana Marza:<br>
      <cite>Do you think only type designers are concerned with the issue of Latinization, while Greek society is not interested at all?</cite></p>
      <p>I can't speak to this from knowledge, but on general principles I would expect that readers do notice any eccentricity in a typeface, whether it's in the direction of more faithfulness to Byzantine models than is usual or more extensive Latinization than usual. And that anything that impairs functionality is not appreciated.</p>
      <p>But stylistic Latinization - as opposed to anything that takes liberties with actual letter forms - might well be accepted, at least within limits, warmly - because it makes it easier to have the diversity, the choices, of typefaces that the Latin alphabet has.</p>
      <p>I feel that the Byzantine model is inadequate to the typographic needs of the Greek people, and that something that is indigenous to Greece and yet as versatile as the Latin script needs to develop. Latinization is a placeholder until that happens, but it's destructive because it will change what people find natural, leading to future developments being diluted. The alternative, though, is fundamentally unacceptable - people won't do without an effective capability to express themselves in type if one is available.</p>
    html_clean: |-
