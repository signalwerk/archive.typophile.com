      <p>"From the moment a type designer posts his font(s) for download or purchase on web, he automatically imposes a specific trend or model for the present day type design. And he has an instant impact on the everyday letters which will be read by millions of Greeks."</p>
      <p>Tatiana,<br>
      I think you have very greatly overstated the impact of the release of one typeface.  There are many, many, thousands of fonts in our current market.  I imagine it more this way: If while sailing on a ship, and a tear were to fall from my eyes and land in the waves, it would become part of the great ocean of salty water and have no more possibility of setting a trend or style than any other drop in the ocean of fonts available. If I were Adobe, Microsoft, or Apple, I would have a much, much greater chance oven being discovered.  In their case, their fonts come freely available with no effort or cost to anyone on earth who has access to a computer.  Think of Papyrus. It gets  used and overused and misused every day by people who want something "different" than the every-day but who are not aware of or care to search for or even pay for a more appropriate font.<br>
