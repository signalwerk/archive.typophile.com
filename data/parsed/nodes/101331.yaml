      <p>Tatiana, I think Latinisation is a little difficult to define. I'm reminded of the attempt to produce a legal definition of pornography, which led one judge to the observation that 'You know it when you see it'. It's the same with Latinisation: it isn't easy to define a set of criteria that constitutes Latinisation, <a href="http://clients.goodlayers.com/cadsondemak/wp-content/uploads/2012/05/helvetica-thai.jpg" rel="nofollow">but one knows it when one sees it</a>.</p>
      <p>That said, I'd broadly characterise Latinisation as the importation or favouring of shapes and features from Latin typography into non-Latin script design. A crude substitution of 'look-alike' letters is probably the most explicit form of Latinisation. <a href="http://cdnimg.fonts.net/CatalogImages/23/9176.png" rel="nofollow">Use of Latin serif shapes and patterns is another.</a></p>
