      <p>Maxim, I can't say for sure whether any Greek blackletter types were produced in the 19th Century, but because of the circumstances of the Greek war of independence the association with Romanticism was linked to the latter's neo-classical rather than gothic expressions. It's no surprise that the foreign Romantic most closely associated with Greece was the most classical of the English Romantic poets, Byron, and the Greek revolutionaries deliberately emphasised a connection with classical Greece to garner support from western artists and intellectuals raised on Sophocles, Aristotle and Homer.</p>
      <p>The Cyrillic blackletters are wonderfully weird, though!</p>
