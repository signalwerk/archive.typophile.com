      <p>Tatiana,<br>
      I begin the design for myself but expect it to be usable by end users.  Design does imply for me the making of something new, but... I do not seek to make something new by excluding everything not new. In other words, to me, being new is a byproduct of not intentionally copying old or intentionally excluding old.  I see myself as an entity that has absorbed a large set of stimuli throughout my life. The sum of all my particular experiences may have colored the outcome of my work in some individual way.  My judgement of all of these stimuli is wholly mine and may certainly differ from anyone else's.<br>
      Regarding distance to past and present. I purposely work totally in the present and assume whatever I do will be a product of my own view of the present.  This is not a right or wrong thing.  I simply allow myself to act as filter of my experience and forger of my extrapolation of the stream entering my consciousness at the moment I design something.  In some ways, this is a closed system but everything that has entered my closed system has come from reaction to things outside of me.</p>
