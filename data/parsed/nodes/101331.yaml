      <p>Man, I'm gonna need a week-long vacation just to catch up with all this amazing discussion... But until such a minor miracle happens let me at least properly address the vertical proportions issue.</p>
      <p>I think we can agree that different writing systems use the Cartesian Space differently, both in terms of frequency and richness (compare Latin and Arabic for a very pronounced case). If we also agree that -for example- in Latin extender size isn't purely of stylistic relevance, that it plays a positive role in reading (at least during immersive reading)* then it becomes clear that making different writing systems adhere to a fixed vertical-proportions scheme is damaging to functionality. <strong>{Added:}</strong>Basically, letterform features are the "data" used to read text, and the way the data is <em>distributed</em> -relative to the writing system- cannot be ignored without probable bad consequences.</p>
      <p>* Which is why call-caps is harder to read, and furthermore why larger point size settings benefit from a smaller x-height versus smaller point size settings.</p>
      <p>For example in Armenian the "x-height" region is much more monotonous than in Latin, while the extenders* are much richer than in Latin. If you make a Latin+Armenian family with consistent vertical proportions you will make one script or the other (possibly even both) less readable. And for what gain? Do readers really use a loupe and exclaim: "Hey, some stuff isn't lining up!" The case of Greek is no different. When you look at the visualization** I posted you immediately notice that in Greek:<br>
      - The descender space is more heavily used than in Latin.<br>
      - The "x-height" region has many more rounds than straights.<br>
      - Ascenders are actually rarer.<br>
      To me this <em>inevitably</em> leads to the conclusion that an <em>optimal</em> Greek "x-height" is larger than in Latin***, and at the expense of the ascenders. And as an aside, it's harder to make Greek narrow.</p>
      <p>* BTW the belief that we read the tops of letters I find illusory; there is no way I can buy that Greek having more/richer descenders is a bad thing (for reading).</p>
      <p>** To answer John: such visualizations I find supremely helpful in knowing which direction(s) to go in breaking the vertical-proportions "despotism", even providing a rough numeric ballpark. For example when I made Nour&amp;Patria I saved myself mountains of guesswork at arriving at a harmonious whole. In comparison, looking at only the alphabets (even with duplication to reflect frequency) and some sample settings doesn't provide nearly as much insight, as efficiently. I believe data visualization is a key to good design.</p>
      <p>*** BTW I was very pleased to see that Yulia has done this! It's like a scientist postulating the existence of a new particle and much later actually seeing it show up.  :-)</p>
      <p>This is the crux of it; I'll try to fill in some gaps later.</p>
      <p>--</p>
      <p>Something else: I can think of two cases of <em>Hellenization</em>, Carter's Skia (born from his much earlier Cadmus)* and a font by Michail Semoglou (for which I don't have a sample -or even a name- handy). Looking for previous discussions where I mentioned those two designs I found this thread<br>
      <a href="http://typophile.com/node/18390" title="http://typophile.com/node/18390">http://typophile.com/node/18390</a><br>
      which I think can be helpful.</p>
      <p>* <a href="http://www.themicrofoundry.com/other/cadmuskia.gif" title="http://www.themicrofoundry.com/other/cadmuskia.gif">http://www.themicrofoundry.com/other/cadmuskia.gif</a><br>
      John H. has opined that the Greek isn't very authentic; irrespective of that, to me Skia remains a Hellenized design.</p>
      <p>To me cultural importation -like anything else in life- is about Intent: people make non-Latin (and really even Latin) fonts a certain way because of what they want for their own life and/versus what they want for society. We each strike a very personal balance. But when choosing what fonts to use/promote it's important to take into account how much of a given designer's intent is helpful to the designer (closer to pure Art) versus other people (closer to pure Design).</p>
      <p>hhp</p>
