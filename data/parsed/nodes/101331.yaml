      <p>John,</p>
      <p>&gt; the cursive construction of Greek minuscule makes it <cite>more difficult</cite> to strongly differentiate upright and italic styles.</p>
      <p>– I’d say: *more demanding*, not more difficult.</p>
      <p>&gt; one ends up with artificial creations to fit criteria of contrast established by the Latin model instead of contrast naturally occurring within the script.</p>
      <p>For the modern Latin typographic system the upright/italic duality is canonical, and it proved to be very useful. No wonder that this model shed its light on neighbour systems like Greek or Cyrillic. That momentum of influence of one culture onto the other is quite a normal phenomenon.<br>
      But I am with you when you are questioning the issue of other possibilities of system-inherent duality in other writing systems. This is, i.m.h.o., a most worthwhile question. Impose our Latin Reg./Ital. scheme upon, e.g., Armenian, Hebrew or Arabic, and you’re in for serious headaches – or brake-through inventions ;-)<br>
      I once encountered a similar issue with my set of Andron Runes. In the Regular I shaped them with a modest mould of serife-like terminals, as to suit them to the rest of the font. Then I faced reservations about that by single users, I ended up doing a second and alternate rendering of the entire character set, in a more ‘incised’ style without serifs; and I put this set – into the Italics font.</p>
      <p>Is there any kind of research about script-inherent duality modes similar (but not equal) to ‘Latin Reg./It.’ ?</p>
