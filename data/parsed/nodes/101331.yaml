      <p>Nick: <em>This is better than the historicist method, where the stylistic contrast between Greek upright and Latin upright is so great.</em></p>
      <p>To clarify: I wasn't talking about approaches or methods, but commenting on the results in particular designs. I'm saying that where stylistic harmony between the two scripts is the design goal, as in Centro, this seems to be consistently achieved more in the italics than in the uprights. Looking at Panos' illustrations, I am reasonably sure that side-by-side pages of Centro Latin and Greek italic text will have a more similar texture and colour than side-by-side upright text.</p>
      <p>Nor am I saying that this is necessarily a result of the method of formalising the upright Greek construction along the lines of the Latin. It seems to me that closer harmony could probably be achieved by varying the proportions and spacing of the upright designs to optically compensate for the greater frequency of round counters in the Greek. [Related to this observation: I think many Greek types with broad proportioned letters are too tightly spaced, such that a good balance of internal and interletter white space is not achieved.]</p>
      <p>Panos made the comment that he thinks Gill's idea was right, but that Perpetua Greek was badly executed. I guess I'm saying that the idea may have legitimacy, but I've yet to see any example that really pulls it off. Not, of course, a reason to stop trying.</p>
