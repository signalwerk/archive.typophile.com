      <p>Nick: <em>Latin sans serifs are not expected to follow the old humanist or classicist letter forms, but may be geometric and minimalist...</em></p>
      <p>Yes, they <em>may.</em> And that constitutes a particular style or category of sans serif design. There are also, of course, sans serif styles and categories that do follow humanist or other traditional letter construction. And these have been particularly popular in the past couple of decades, roughly contemporary with the new tendency in Greek type design to favour a parallel approach. With regard to the 'corporate Western-designed Greek sans faces' to which you refer, these have tended to be produced alongside or as companions to Latin designs that are also not geometric or minimalist. In fact, geometric sans serifs constitute a minority category vs the much larger 'humanist' and 'grotesk' categories: they're not very common in Latin typography, and even if they were it doesn't follow that a particular stylistic approach that works in the context of one script is applicable to all scripts. It happens that a design like Futura works for the Latin minuscule (although I consider the classically proportioned caps by far the most successful part of the design), but although the same principles can be applied to other scripts, the results may simply be awkward and disjointed.</p>
      <p>Part of our disagreement may result from a different analytical approach. You cite the 'the single storey "g"' as an obvious example of the way in which Latin sans serif types 'may be geometric and minimalist'. I see it simply as the adoption of a variant letter construction from a different historical style. To me, the parallel is this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/forminform_3807.png"></div><p></p>
      <p>i.e. a shape derived from the formal style and a shape derived from the cursive style. The fact that, in the Greek, it is the formal shape that is more geometric and minimalist, and the cursive more visually complex, illustrates where I think your analysis relies too much on superficialities.</p>
