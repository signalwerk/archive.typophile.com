      <p><cite>Sadly I don't think we all agree on that... For one thing people <em>still</em> make such Greek fonts.</cite></p>
      <p>I guess I was thinking about the audience of this thread and specifically the people who give enough thought to Greek type design to treat it with the respect it deserves. But you're right, there are some embarrassing instances of uncritical Latinization out there, with the Latin n glyph doubling as η.</p>
      <p>For all my arguments in support of non-descending η, I would use the descending η shape by default in my own designs unless I'm specifically targeting Greek-only use. An important reason that I would include Greek in my typefaces is that Greek letters are often used as symbols for technical purposes, for example in particle physics. To make η recognizable for such purposes, the descender is a must. It's somewhat ironic perhaps that for me the best argument for a descending η is to meet the expectations of a Latin-centric audience.</p>
