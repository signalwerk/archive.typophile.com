      <p>Chris, I said that the <em>basic shapes</em> of our letters have been relatively stable since the introduction of typography, and reflect the standard book hands of that time. I don't think that is a controversial statement, and the fact that within the confines of those models there is lots of variety of design doesn't alter the observation. The <em>structure</em> of a Jenson lowercase roman a is the same as that of the latest sans serif roman. The point with regard to Greek is that there is an open question about what constitutes the letter shape and what constitutes an optional feature. To one degree or another, this question is open for all scripts, and it is one of the things that enables the development of new styles. Not all experiments are successful.</p>
      <p>I'm not suggesting that a line be drawn in the sand or that you or anyone else should follow a particular path. I do think that, historically, the reduction of a script to typography tends to slow the rate of evolution and favours establishment of standard models. Witness how the typographic roman remained the standard text face of print publishing even when all around it scribal culture continued to innovate and produce new text styles right up until the introduction of the typewriter. That's an observation, not a prescription. As I wrote above with regard to my Helvetica World Greek, some people chose to see it relative to Matthew Carter's Helvetica Greek as some kind of ideological statement. I just tried to design something that seemed to me to capture what I found interesting about Helvetica while achieving a texture on the page that I associate with Greek.</p>
      <p>BTW, I like your Froggy Greek italic very much. You've done a fine job balancing the extremely variable stroke contrast pattern, and the overall texture is remarkably even.</p>
