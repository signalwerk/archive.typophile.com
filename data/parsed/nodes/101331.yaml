      <p>Communication is always the issue.  That does not only mean books and newspapers.  I would even say that in today's world, those two media are no-longer the most used. A book face may not be the best choice for an advert just as a given display face may not be correct for a book of running text.  If we first ignore the dynamics of nationalism and just have normal commerce of Greeks communicating to Greeks, we are back to "Walks Like a Duck"--if it works, it works.  Greeks today do not live in the isolation from the rest of the world that they did in the middle ages.  They have TV, movies, the Internet, digital devices--there is interaction with the rest of the World.  We cannot revisit "The Glory that was Greece" other than as a time in history.  We live in the "Eclectic Menagerie that is the World" with all of its bombardments of imagery.<br>
      Let us neither set a construct of rules to say "this you must always follow for sure" or by the same token "This you must never do again". Yes, there will be monumental failures, but do not throw the baby out with the bath water.  If type designers who design Greek fonts contribute whatever they may, there is no harm done.  Users will use whatever they see fit from the newer designs. Books are no-longer printed in Mainz blackletter type. There was no rule then that said blackletter was culturally sacred for Latin.  There should be no rules which say Byzantine script is culturally sacred for Greek.  We are chasing a moving target and always will be.  The measure should be, "Does it read like Greek for the intended message and audience at the time" not does it belong in a museum with historic models.</p>
