      <p>@John Hudson:<br>
      <cite>But one of the distinctive aspects of Greek script typography -- thanks to the classical heritage and early Christian heritage -- is that there is a very considerable user base that is outside of Greece and not made up of native readers.</cite></p>
      <p>An edition of the classics in the original, for use of students, or even a book of mathematics, can be a thing of typographic beauty. I don't dispute this.</p>
      <p>But native speakers of a language have certain special requirements - high, effortless readability; naturalness; and a valid aesthetic sensibility fitting with their cultural context - that non-native speakers do not.  And, as I've noted, for historical reasons, the evolution of Greek typography has only been in the hands of native speakers for a relatively short time.</p>
      <p>So investigations concentrating on locating possible unmet needs of native speakers of Greek are legitimate and important, and setting non-native use of Greek typefaces aside from consideration is <em>not</em> arbitrary, as you seem to be suggesting.</p>
