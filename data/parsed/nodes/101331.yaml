      <p>Hrant, I'm glad you explained theoretically why optimal “x-height” in Greek is larger than in Latin—to what I came through experiment:)<br>
      Tatiana, what indeed happens about Russian letters е and ё is that officially both letters “ё” and “е” exist, but in fact words which we pronounce with sound “yo” (for example “ёлка”, “ёжик”) often (but not always) are written with е (like “елка”, “ежик”). You can see it in books, magazines, internet and other media. Though in official documents this situation causes problems: when people with “ё” in their surname have it written with “ё” in some documents (for example passport) and with “е” in other (for example some agreements), they have to change the documents to unify the writing (for some documents may be illegal because surnames with е and ё are considered different).<br>
      And about the tails of ц and щ: these letters didn't lose their tails, but the tails are shorter today, than for example in the 18th century. Some fonts have these letters with long tails as stylistic swashed variants, but rarely for default setting (mainly those which are revivals or are influenced by some historical styles). See “Academy” typefamily for example (it is based on “Sorbonne” typeface and Russian typefaces of the mid-18th century).</p>
