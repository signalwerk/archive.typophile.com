      <p>John (Q): <em>Although I'm used to Porson Greek as the way Greek is represented, I know I find it jarring, but I don't know how a native speaker of Greek finds it.</em></p>
      <p>A reader in Greece is unlikely ever to encounter Porson. It is a peculiarity of Anglo-American classical studies and not really used anywhere else. Only the importance of the Loeb Library for the study of Greek classical literature in the English-speaking world has given it the prominence that it has.<br>
      _____</p>
      <p>You seem to suggest that Latinisation was a kind of 'make-do' solution, something that the Greeks fell back on because they didn't have any other option. In fact, they had pretty much unlimited options when new types were made for phototypesetting in the early 1970s (the period of most intense Latinisation). Linotype had committed to providing types for the Greek market in whatever style requested, in return for a near monopoly on providing typesetting equipment to publishers, newspapers, etc.. Their customers requested Latinised Greek versions of Helvetica, Baskerville, Clarendon and others, and the more Latinised the better. Matthew Carter recalls that they kept asking for more serifs to make the types look more Latin, so that he wondered eventually if they would demand serifs on the Helvetica. This wasn't an historical contingency, it was an naïve ideological stance that equated Latinisation with modernisation, anti-communism, alignment with NATO, and other obsessions of the military junta and the political right.</p>
