      <p>What is this assumption that readers have expectations for old-fashioned type? That they will be shocked by anything deviating from what was good enough for their great-grandfather and ﬁnd it hard to read? Is there research to support this wishful thinking? Why are Greeks more susceptible to this condition than those who use the Latin script?</p>
      <p>Certainly, a multi-national corporation bundling millions of fonts into cultures around the world will today be politically correct and play it safe and conservative in whatever script, including Latin.</p>
      <p>But there is no reason why independent type designers shouldn’t be progressive. If Greek art directors and designers want to buy licences for Latinized typefaces and confound their readers’s expectations, why shouldn’t they? If the types are as dysfunctional as the naysayers would have it, the market will make the appropriate correction.  </p>
      <p>For at least 80 years, designers and readers in Latin, Greek and Cyrillic cultures have been familiar with sans serif types — that is, without serifs, and also without exit and entry strokes. </p>
      <p>Tatiana, ask Panos Vassiliou about Parchute’s Centro. It is an award-winning and successful typeface, designed and published in Greece, with a heavily Latinized construction in both serif and sans versions. It has been described as “almost invisible”.</p>
