      <p><em>Reading over and over the thread's comments I assume that by stating that there are no serifs in Greek lower case (compared to the Latin alphabet), typophiles mean that there are only 'stroke entries' and 'stroke exits' !? </em></p>
      <p>Yes, that, at least, would be my description of the construction (ductus) of Greek minuscules. Part of the confusion of this topic, I think, comes from the binary categorisation of Latin types as either 'serif' or 'sans serif', which fails to provide for other kinds of stem termination (flares, tapers, entries, exits) and ignores other characteristics that would suggest different categorisation (for example, I consider a low contrast slab serif to have more in common with a low contrast sans serif than with traditional serif text types). I don't think this binary categorisation serves Latin typography very well -- certainly not as well as its universality would suggest --, but then it gets applied to all other writing systems to try to label what are, in fact, entirely different kinds of letter construction, more often, in fact, distinguished by stroke modulation (so one sees low contrast Arabic types being non-sensically described as 'sans serif').</p>
      <p>I think it makes most sense to limit the use of the term serif to a particular kind of formal stem termination. This typically involves an interrupted construction of some kind, i.e. the lifting and repositioning of the pen or brush, or a reversal whose intention is to create this visual detail rather than to carry forward the shaping of the letter. From this it follows, contra much common usage, that many 'serif' italic types do not in fact have serifs in the lowercase; they have stroke entries and exits instead:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/notserif_6233.png"></div><p></p>
      <p>Now, this leads to an interesting question. In the example below, following my argument, it is clear that 'A' is a stroke exit, not a serif. But what is 'B'?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ABee_3821.png"></div><p></p>
      <p>If we say it is a serif, on what basis? I think it has to come down to the sharpness of the transition to the stem, the fact that there is a definite corner there, and this is what marks the difference between the serif (formal, interrupted construction (in this case with a pause and direction change rather than a lift) and the stroke entry (cursive, flowing into the stem).</p>
