      <p>A word about ductus:</p>
      <p>This is a problematic term, because it has a couple of different uses when talking about writing and type. Some of my calligrapher friends are very particular that the word should only be used to refer to the order and direction (and sometimes speed) of strokes by which a letter is written, which is the traditional meaning and provides the etymological base for the word. I've come to the conclusion that they're right, despite having previously used it in the other sense, favoured recently by type designers, to refer to pen angle (and hence to stroke modulation pattern).</p>
