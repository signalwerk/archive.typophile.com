      <p>@John Hudson:<br>
      <cite>as if the Latin writing system were in some way inherently superior, and not simply the beneficiary of political, financial and industrial contingency?</cite></p>
      <p>While I agree this is true, I am not sure that it is always relevant. Cheaper hand-me-down typewriters or computers, an easier time learning economically significant foreign languages - those are as much valid reasons for choosing the Latin script, if making a choice is practical, as any intrinsic superiority.</p>
      <p>Of course, there is no choice to be made in the case of Greek, because the people already have a writing system they know how to use, in which many books have been printed. But as a general principle, contingency is as good as inherent superiority for many purposes.</p>
