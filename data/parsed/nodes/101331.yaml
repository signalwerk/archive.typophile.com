      <p>John, I'm not suggesting a 'correct' method to do this. We are definitely in a transition period. Albert pointed this out perfectly <cite>"…At some point these developments will turn out to be successful, beautiful, acceptable and maybe even readable."</cite> I may add that some may even get discarded, who knows. </p>
      <p>If I were to look at it strictly from an academic point of view I would never disagree with John's approach, in fact this is how I would have explained things if other factors were not involved as well. You see, I look more into what the market wants, implementing solutions driven by societal forces and current trends. In that respect, the attachment and exposure of the Greek society to the western world (with its services and products) has generated a need for a certain kind of aesthetics which is reflected to typography as well.<br>
      People demand design implementations harmonized with those they are exposed to in other western countries.<br>
      Currently there are not many segments of the market where you can use typefaces with an old style influence other than those with traditional products.<br>
      Take for instance this illustration:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/greek5_5901.png"></div><br>
      The font selection for this particular B&amp;O product looks out of place (this is not an actual ad). In this case, a Greek would expect a typeface with a clean, well-constructed, modern cut with a more luxurious orientation.<p></p>
      <p>On the other hand, for the following Greek traditional product (borrowed from a previous post), a typeface with an oldstyle look seems like a good choice.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Chatzi_5508_6701.jpg"></div><p></p>
      <p>@John: <cite> So you are saying that fewer descenders and more uniformity in height makes a script automatically easier to read? So a script with no descenders at all would be easier to read than one with,  say,  five?</cite> </p>
      <p>When we read we concentrate mostly on the upper part of the letters. Descenders somehow distract fast reading, so in that sense having more descenders reading gets slower. I'm not suggesting eliminating descenders but rather minimizing to the same level as latin, if that is permitted by the design characteristics of the typeface.<br>
      For instance, η (eta) is not necessary to have a descending part, it may just stand above the baseline (see <cite>Centro Serif Regular</cite> compared to <cite>Centro Serif Italic</cite> in my previous post). This is quite acceptable. Greeks write η both with or without descender. You may justify a similar approach with some other letters as well.</p>
