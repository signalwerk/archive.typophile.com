    html: "<p>Tatiana, thank you for starting so interesting research, I'm looking forward to see the results of your study published. Unfortunately I found this thread too late to add any questions for the questionnaire, so I decided just to tell you about making greek script in my Flauto typefamily, maybe it could be of any help. It is a venetian antiqua with faces for different optical sizes and weights and now I have greek in light regular styles (I plan to make greek for bolds and italics too). When I finished first variant of my greek it looked rather latinized so it was hard to distinguish latin and greek in mixed texts. I didn't like it and I decided to make it more traditional so that it could be easily seen (even without reading) as greek (not latin or cyrillic). For the second variant of my greek I've chosen ἁπλά style, because it seems to be closer to venetian antiqua then other traditional greek styles. While making this variant I noticed that greek lowercase seem smaller and lighter then latin and cyrillic ones so I decided to make some compensations: I increased the height of greek lowercase and made them a little darker trying to balance the color and height of all scripts. Here is an example of my greek, latin and cyrillic scripts in a light regular style for the 21-35 pt: </p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/Flauto_sample1_3857.jpg\"></div><p></p>"
