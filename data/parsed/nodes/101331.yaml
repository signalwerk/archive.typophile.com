      <p>I’m not quite sure about which end user you’re adressing, Tatiana. The reader? The typesetter?</p>
      <p>It makes quite a difference wether you consider serifed faces or non-serifs. The more tricky and more interesting part is the serifes, of course.<br>
      – What about script faces, displays, blackletter?</p>
      <p>Make sure you get hold of a copy of Viktor Scholderer’s <strong>Greek Printing Types, 1465-1927</strong>.<br>
      He himself tried out the third way of Hellenisation, as an possible alternative to Byzantinization and Romanisation. Worth consideration by all means.<br>
      My <a class="freelinking external" href="http://www.myfonts.com/fonts/andreas-stotzner/andron-1-gre-corpus/" rel="nofollow">own Greek</a> took me about five years to finish. I would describe it as modern-classical yet rather non-historic, not byzantine nor romanized.<br>
      My 2 cents.</p>
      <p>Cheers to wonderful Saloniki :-)</p>
