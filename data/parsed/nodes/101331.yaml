      <p>I didn't mean to suggest anything of the sort. I was just pointing out that the phrase 'end-users of Greek fonts' may be misleading or, at least, is very vague, because there are very different end-user groups. It should also be noted, of course, that there are different kinds of users within Greece, also with quite different needs (just as there is no uniform body of 'end users of Latin fonts'). People who only work with monotonic texts don't have the same needs as publishers working with polytonic text. Packaging designers don't have the same needs as editorial designers. So I think my question to Tatiana about how she is defining the end-users of Greek fonts for the purpose of her project as a valid one. Related to this question of who the users are, of course, is how she is planning to get her questionnaire to these users, and how she will correlate results. Nativeness in itself isn't a terribly interesting qualification -- and I'm not talking now just about Greek, but about any script --; what is much more interesting and important is knowing what sort of work a person is doing and what sorts of fonts that work involves. In order for information flowing from users to be useful, it is necessary to have some idea of who they are and, hence, the context of the comments. These days, of course, anyone who uses is a computer is an 'end-user of fonts', but I presume Tatiana won't be handing our her questionnaire on street corners. I presume she has some plan to garner responses from, say, graphic designers, maybe publishers, probably students and maybe their teachers, since they're often easiest to involve in such things. How broad will the response base be? How representative? What user groups are likely to be under-represented or perhaps not represented at all?</p>
      <p>By the way, I recommend to you Konstantine Staikos' _Charta of Greek Printing_ which documents the important role of native Greek speakers in the evolution of Greek publishing and typography.</p>
