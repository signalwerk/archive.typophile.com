      <p>@John Hudson:<br>
      <cite>Ah. I think a phrase other than Latinisation applies in that case.</cite></p>
      <p>I'm happy to accept that. I am less troubled by Latinization than Hrant is.</p>
      <p>My concern is that the initial models of typefaces for use by Greeks were flawed for the purpose of everyday use by native speakers, because that wasn't what they were developed for. Since Latin alphabet typefaces were very well developed for that purpose, though, I would expect that the natural <em>response</em> by native Greek speakers to this unsatisfactory situation would <em>be</em> Latinization - for practical reasons, they would seek to make the typefaces available for the Greek language suitable to all purposes <em>in a hurry</em>, and what better way to do that than to adapt and borrow what already exists instead of making the extra effort required for originating?</p>
      <p>The result of that phase is an improvement on the original, but still not ideally satisfactory. Having an authentically and organically Greek typeface isn't just a matter of feeding chauvinism; it really does have practical consequences for further improving readability and legibility as well as the cultural sensitivity improving people's reactions to the printed matter.</p>
      <p>So I see reversing Latinization - in a partial and incomplete fashion - as a task for the present time, now that Latinization served its purpose as a tool for overcoming the initial emergency.</p>
