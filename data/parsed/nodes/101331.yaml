      <p>What Gill knew about Greek would fit on the head of a pin. His comment that '...the leaders of typographic design in the fifteenth century never achieved for Greek what they did for Latin and modern languages' shows just how poor is his knowledge and superficial his analysis. In fact, the typographers of the 15th Century starting with Aldus achieved for Greek <em>exactly</em> what they achieved for Latin, i.e. the translation into type of the standard scribal book hand of the day. And although this cursive style became the dominant mode of typographic Greek, it wasn't the only mode and the non-cursive Greeks of the 15th Century all point to more fruitful directions in Greek type design -- as Scholderer demonstrated -- than Gill's embarrassing Perpetua Greek, whose only redeeming feature is that no one ever used it.</p>
      <p>The thing that I find remarkable about Gill and Van Krimpen and others who set out to deliberately Latinise the Greek script -- whether they used that term or simply talk in terms of 'modernising' or 'formalising' --, is that they end up producing stiff, clumsy and lifeless forms that do not combine well, <em>of a kind that they would never accept in their Latin type designs.</em> It is as if they abandoned all their knowledge about what makes a typeface work, ignoring all that they knew from Latin script even as they try to 'Latinise' the Greek. So when Gill writes that 'Just as the capitals of the Perpetua Greek are of precisely the same family as the Perpetua Roman, so the Perpetua Greek lower-case is of the same family as the Perpetua Roman lower-case', my response is 'No. It isn't. The Perpetua Latin lowercase has life and elegance, and pleasing curves, and nice proportions that make the letters combine well into words. The Perpetua Greek has none of these characteristics.'</p>
