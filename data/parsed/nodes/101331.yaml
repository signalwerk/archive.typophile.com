      <p><em>What I meant by 'hidden system of implemented ligatures' (and I agree with you that my terminology is not good enough) is that the entry/exit stroke of Greek lowercase letters (even in a sans serif version) is a residue of Byzantine ligatures.</em></p>
      <p>Okay, now I understand. I've gone back to my Greek palaeography books, and I think the entry and exit strokes result from a number of different factors in the evolution of Greek minuscule. I think the particular shapes of the cursive Byzantine style are related to the ligation that occurs between some letters, as you suggest, such that the writing pattern of the connected and unconnected forms are similar, but I see the introduction of some entry and exit strokes earlier, in the late, square uncial style (8th C.). It is interesting to note in that style that the μ has no descender, and the left stroke instead begins with a baseline entry stroke; there is a consistent right-side baseline exit stroke, too, which connects to following letters but is present even when there is no connection. This is around the time that the nib rotation begins, leading to styles with heavier horizontal strokes. Interestingly, the example I am looking at is from a Paschal letter of the Patriarch of Alexandria probably from the beginning of the 8th Century, and the bilingual text puts the date definitely between the Arabic conquest of 641–6 and the decree in 749 that only Arabic should be used in Egypt. Now this is especially interesting to me, because I noted some years ago that the steep pen angle of the Byzantine cursive is very similar to that of Arabic, Hebrew and other Middle Eastern scripts, reminding us that the Byzantium was the capital of a mostly Eastern empire.</p>
