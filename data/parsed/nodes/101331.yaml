      <p>I've been in Sachsen for a MotoGP show few years ago! I felt like a dwarf amongst German spectators, quite weird for a woman being there. Of course, I didn't remember anything from the show, so I had to watch it once more on TV :)</p>
      <p>Now, on typography… I liked very much your font. And I'm sure,  the polytonic form is a big advantage of it. There are still people who prefer polytonic fonts for literary text. Since last month I continuously discover new, great, Greek fonts… Maybe I was totally wrong about the latinization of Greek typography? May I ask what elements influenced your design? </p>
      <p>Thank you for you time, Andreas.</p>
