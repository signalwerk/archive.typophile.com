    html: "<p>It's a frustration that Greek books on palaeography, of which there are many excellent ones, all seem to stop around AD 1600. The best are the <em>Repertorium ger griechischen Kopisten 800–1600</em>, each issue of which consists of three volumes devoted to manuscripts housed in a different country: one descriptive volume (in German), one volume of photographic plates, and most usefully a volume illustrating the characteristic form of letters occurring in each manuscript. A quick flip through the latter volume in the French issue reveals both descending and non-descending η in use. Of particular interest, I think, is that the manuscript non-descending η is often very difficult to distinguish from the cursive κ, such that in many of the manuscripts that feature the non-descending η the scribe uses a different form of κ with a Latin K construction. Where both the non-descending η abd cursive κ are used, it is very difficult to distinguish them other than by textual context. This may provide some insight as to why the descending η became the common typographic form: to contrast with the form of κ that was adopted in the cursive types as the norm for that letter.</p>"
