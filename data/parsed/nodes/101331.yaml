      <p>I don’t think that’s the issue, John.<br>
      It doesn’t matter what the type looks like, people should tell their own stories in their own voices.</p>
      <p>A few years ago, western multi-national corporations were producing experimental versions of foreign (to their creative directors and employed/hired type designers) scripts. These are now derided, and such corporations are now politically correct and conservative in respecting the quaintness of the until recently typographically-backward cultures to which they distribute their fonts, advised by expat gatekeepers.</p>
      <p>Complicating the issue is the fact that classical Greek is OUR (Western Latin script users) story too, deeply embedded in our academic culture—and this too lends a conservative tone to the culture of Greek type design in the West.</p>
      <p>I have nothing against a bit of conservatism, but it seems to me that Greek and Cyrillic type design in the West is overly safe and skewed in that direction.</p>
      <p>That is why I look to type designers such as Panos Vassiliou and Alexandra Korolkova for inspiration, and hope that if my efforts at Greek and Cyrillic have a bit of a foreign accent for indigenous readers, it will be sexy, like Garbo or Schwarzenegger.</p>
