      <p>It is certainly true that a) the typograhical distinction between roman and italic is something imported into Greek from Latin typography, and b) the cursive construction of Greek minuscule makes it more difficult to strongly differentiate upright and italic styles. I'm not at all convinced that the solution to this is to make the upright less cursive, though, since the result tends to look very stiff and awkward not only in contrast to traditional styles <em>but also when compared to Latin romans.</em> I believe this is because the Latin script maintained a formal bookhand tradition based on interrupted letter construction for much longer than Greek, so evolved letter shapes that were pleasing in both upright, formal and slanted, cursive styles that were in widespread use in the script at the time of reduction to type. There are upright, formal styles of Greek writing, but they are archaic.</p>
      <p>The problem I have with your approach, Nick, is that it seems to suggest that the way to resolve a design problem arising from what you acknowledge is an importation from Latin is to import more stuff from Latin. Where does that end? To how many of the world's writing systems does it apply?</p>
      <p>Latin-script typographers, authors, editors and publishers did something really brilliant when they gradually systematised the use of roman and italic to articulate text, i.e. systematised the use of two different existing writing styles -- upright and formal, slanted and cursive -- in a contrastive way. The usefulness of the system is obvious, and one can see the attraction to adapting it for other writing systems. But not all writing systems have existing parallels, so one ends up with artificial creations to fit criteria of contrast established by the Latin model instead of contrast naturally occurring within the script. It's as if Latin typographers without access to a roman and italic manuscript style distinction had observed the constrastive use of, say, Arabic naskh and ruqah styles in Ottoman manuscripts, and tried to come up Latin letters that exhibited the characteristics of those Arabic styles in order to create a system of textual articulation.</p>
