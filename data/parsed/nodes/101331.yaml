      <p>Chris is right about the first image: in both the low contrast 'sans serif' and the higher contrast design, these are entry and exit strokes. Traditionally, there are no serifs -- i.e. constructed stem terminals -- in the Greek lowercase, only entry and exit strokes.</p>
      <p>Chris, there was some discussion earlier in the conversation about the distinction between cursive in the sense of running hand and what I called 'internal cursive construction', i.e. where individual letters are constructed in a running way without lifting the pen from the page. Obviously this is applied indirectly to the description of type. I think Tatiana's second image is correctly labelled -- except that the last line should be 'italic Greek letters' --, and makes the point that while the Latin italic differs from the roman in having an internal cursive construction, in Greece this is true of both upright and italic.</p>
