      <p><em>Nick</em>,<br>
      Thank you for posting the article of Yannis Haralambous.</p>
      <p><em>Herbert</em>,<br>
      I never got to thank you for the 'An Essay on Typography' of Eric Gill. Thank you!</p>
      <p>__________</p>
      <p><em>Dear Gentlemen</em>,</p>
      <p>Writing the thesis on Latinization of Greek typography I faced a pragmatic question: why is so harmful this phenomena?<br>
      From the available bibliography, I could deduce that </p>
      <dd>1) every writing system is a cultural heritage and the identity of every nation<br>
      2) Latinization may demote cultural authenticity of a non - latin script and<br>
      3) reduce functionality</dd>
      <p>I cannot find a strong argument against Latinization.<br>
      PLEASE HELP!</p>
      <p>I presume almost everyone would agree on three mentioned points, although the third, about functionality it is not quite clear to me. If it implies readability, at least for Greek text, I still do not see an extended problem. Recently I saw a short passage in a journal, where among other latinized greek letters 'η' was actually a latin 'n', no descending part. I read the text easily and observed the substitution only because I am aware of it. But there was nothing tragic in the situation.</p>
      <p>Even if Latin alphabet will assimilate completely the Greek one, there always will exist a 'community' - editors of classical Greek and ecclesiastical texts which will use fonts related to Byzantine scripts.</p>
      <p>From the discussions of this thread, although with an imprecise way, I understood that it is possible to preserve the characteristics of Greek letters and to give them a more modern form. But, it seems to me that Greek typography is 'trapped' into Byzantine/Renaissance/Baroque periods. While Latin letters give a designer more room for changes towards progress, Greek typography is far away from that. Do you think is possible to preserve Greek characteristics and to design a font which would resemble to the clarity and geometry of Latin one?</p>
      <p>Greek nation is a contradictory one. It is steadily with one leg into their past and with other travelling through the entire world. But the same could be said about Arab countries. It is wrong or right, I don't know. But it seems to me that this is one side of human evolution - to tend to something new, something different. </p>
      <p>Do you think only type designers are concerned with the issue of Latinization, while Greek society is not interested at all?</p>
