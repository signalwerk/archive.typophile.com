      <p>[Edited]</p>
      <p>Nick: <em>In other words, it’s not about latinization or modernization or globalization, but about the text color of specific typeface designs.</em></p>
      <p>Okay, I'll admit that the comment about the junta was a provocation -- and it is interesting to note that the Latinisation trend continued past the end of the dictarorship and into the 1980s --, but I don't think the trend can be reduced to typographic design criteria independent of cultural and political factors of the time.</p>
      <p>As I mentioned a few times already in this thread, the texture on the page -- what you call text colour -- is central to my design approach. And one of the reasons why my Helvetica World Greek is so different from the 1971 Greek is that I found the latter did not, in fact, have the texture of Helvetica on the page. Part of the reason for this I have only just realised, which is that although it was packaged as 'Helvetica Greek' it was paired with Helvetica Neue, not the original Helvetica design. For this reason it was more loosely spaced and most of the round forms were wider.</p>
      <p>In this <strong>revised</strong> comparison image I have tracked the Helvetica Latin (middle) and Helvetica World Greek (bottom) to approximate the looser spacing of Helvetica Neue. This does make for a better harmonisation of texture between the 1971 Greek (top) and the Helvetica Latin, but I still think the former is too geometric and rigid.</p>
