      <p>Nick: <em>I wouldn’t call it an entry/exit stroke unless it is a separate stroke, not just a bend in a main stem.</em></p>
      <p>I've had the same thought, although the terminology is pretty common.</p>
      <p>I consider the pronounced bend in e.g. the left downstroke of the Didot style eta to be derived from writing speed. So structurally I still think of it as a horizontal entry stroke, a turn, and a vertical main stroke. When written quickly, over time this evolves into a curved stoke in some styles, but that doesn't seem to me to negate the usefulness of the entry stroke as an analytical concept. Indeed, this concept allows us to understand the shared structure of styles with curved stems and styles with straight stems that share the initial horizontal trajectory.</p>
      <p>By the way, Tatiana, it might be helpful if you were to use an example of low contrast eta with a more obvious entry stroke to illustrate the concept.</p>
