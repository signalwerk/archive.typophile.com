    date_raw: 15 Mar 2013 — 1:33am
    votes: null
    html: |-
      <p>Just a short comment:<br>
      In my own designs i try to transport the ›feel‹ of the Latin forms into the Greek script. The latter follows the traditional Greek writing not too close but still visible. So, my aim is to make it harmonize with Latin but still being its own script. The structure and movement of the Greek script is clearly different to the Latin lowercase alphabet. It would look wrong if you’d latinize it.<br>
      I followed a more latinized approach for a geometric sanserif i did in commission for a large corporation. But there (similar to John Hudson’s Helvetica World approach) the typeface was intended more for display use.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mantika-Greek_5404.png"></div><p></p>
