      <p>@John Hudson:<br>
      <cite>But I don't see any good reason for trying to make your writing system look like someone else's.</cite><br>
      It's true that there are few cases where that would produce obvious benefits.</p>
      <p>Still, some writing systems have limited legibility; in Hebrew, some letters are difficult to distinguish, for example.</p>
      <p>The fusion of a Roman monumental uppercase with a semi-cursive lowercase in Greek is, I think, a problem - even with the Porson italicization removed. One way to solve it would be to completely Latinize the lowercase, but fortunately that's prevented by the fact that for <em>some</em> of the letters in the alphabet, there's no obvious Roman-style lowercase shape. A typeface that you have to learn how to read has little chance of catching on. So Porson got improved, leading to Apla, and little further movement towards a more Latin-like lowercase for serif fonts has taken hold.</p>
      <p>The other way is to go away from the Roman model. The common New Hellenic model goes that way.</p>
