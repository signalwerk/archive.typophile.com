      <p>Brian: <em>However, if η with a descender was indeed established as the exclusive handwritten form due to the above reason, then that may have contributed to the same form being adopted exclusively in print in later centuries.</em></p>
      <p>Note that I did not suggest that the descending form was established as the exclusive form in handwriting first and hence in typography. In manuscript, both forms are seen right through to 1600 (and also, of course, a variation of forms in ligatures). What I said was that the cursive kappa was adopted as the standard form in typography (of the Aldine tradition), and hence that would encourage corresponding standardisation of the descending eta as a more easily distinguished form.</p>
      <p>Tatiana's image of her teacher's handwriting is very interesting, because it confirms another suspicion I had, which is that non-descending eta would be virtually indistinguishable from one form of cursive pi (which corresponds, by the way, to the Cyrillic handwritten and italic pe).</p>
