      <p>There is so much to appreciate and to comment on in this thread, but I'll limit myself to one tiny point.</p>
      <p><cite>For instance, η (eta) is not necessary to have a descending part, it may just stand above the baseline (see Centro Serif Regular compared to Centro Serif Italic in my previous post). This is quite acceptable. Greeks write η both with or without descender. You may justify a similar approach with some other letters as well.</cite></p>
      <p>In general, I'm of the opinion that up to a point extenders help in reading by aiding in differentiating those relatively fewer letters that have them. A weakness of conventional Cyrillic lowercase in my mind is the paucity of extenders. I'll never get used to the Bulgarian-style yu (ю) with an ascender (are you kidding me?) but I wouldn't mind it if people started actually writing yo (ё) instead of replacing it all the time with ye (е) in Russian, or even if the more prominent old-timey tails of tse (ц) and shcha (щ) came back into fashion.</p>
      <p>So I was surprised to see the comment that fewer descenders make reading easier. This got me thinking about the exact role of extenders in helping readability. They of course break up the monotony of letters confined to the x-height; imagine if everything looked like "as no one concerns us even more". But extenders don't have to be too frequent to achieve this role, and past a certain frequency it's likely to become too much.</p>
      <p>My subjective opinion is that Greek in its current monotonic orthography has somewhere near the right balance of things happening outside the x-height. I don't think Greek has too many descenders, since many of the letters with descenders like ψ, ξ, ζ, and φ don't occur too frequently.  </p>
      <p>But here's the thing. I remember posting something about this many years ago, but I'm perfectly happy with η (eta) without a descender. It isn't just about being exposed to so many examples of descender-less η in handwriting and in print, or even that the older handwritten and printed forms of descending η tend to have much shorter descenders than are usual today.</p>
      <p>If all the other vowels (α, ε, ι, ο, υ, and ω) are extender-less, it appeals to my symmetry-seeking nature to have a descender-less η as well. Perhaps it's my grounding in the Korean alphabet where all vowels are variations on a set of simple elements that makes me expect some sort of a unity in design that holds the vowel letters together. After all, there's something about the Roman letter y used as a vowel that is not entirely satisfactory for me—it doesn't look enough like a vowel letter due to its descender. I wouldn't be surprised if I'm the only one who feels this way, though.</p>
      <p>I do decidedly prefer descending χ, by the way. Confined to x-height, it would be distractingly close to κ.</p>
