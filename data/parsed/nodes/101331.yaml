      <blockquote><p>I’d say: *more demanding*, not more difficult.</p></blockquote>
      <p>I'm not sure what demanding implies in this context. It seems to me objectively more difficult to differentiate two things that have more in common with each other than two things that have less in common with each other.</p>
      <blockquote><p>Is there any kind of research about script-inherent duality modes similar (but not equal) to ‘Latin Reg./It.’ ?</p></blockquote>
      <p>I don't know about research, per se, in the sense of systematic investigation, but I have observed that most mature scribal systems evolve both formal and informal modes, and these may produce differentiated styles that would adapt to a roman/italic-like system. And very often the differences between the formal and informal styles parallel those between roman and italic: interrupted vs cursive construction, upright vs slanted, broad vs compressed. But even when such differentiated styles exist within a script they do not always end up being used in the way that roman and italic are used in Latin script typography. For instance, the Hebrew square letter is a formal bookhand directly equivalent to the Latin roman, but the Hebrew cursive, which persists as a daily handwriting style, never evolved into either a secondary manuscript hand or a differentiated typographic companion style. Which is a pity, because it has a lot of potential in that rôle.</p>
      <p>It massively helped the development of Latin typography that roman and italic letters were already being used side-by-side in manuscript. The typographic innovation was not to pair these styles, but to systematise the pairing that already existed, e.g. using italics for titles, for foreign words, for emphasis. The fact that the system employs  italic for several different purposes, rather than multiplying styles, itself tells us something about the inherent conservatism that in other scripts hampers the development of contrast-based text articulation.</p>
      <p>There are a number of scripts in the world in which the formal scribal bookhands involve cursive construction and features, with or without cursive connectivity and/or graphotactic shape modification. Perso-Arabic is the most obvious example of a mature scribal culture completely abandoning non-cursive writing, but all the evidence is that this is also true of the Byzantine scribal culture: formal, interrupted Greek uncial letters continued in use in ikon writing, mosaics etc., but text manufacture moved to a cursive style around AD 400, stayed there for well over a thousand years, and was still there when type came along.</p>
