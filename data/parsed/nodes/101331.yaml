      <p>Chris,<br>
      I have the impression that Panos has no time to follow our thread and to answer our questions, unfortunately :(<br>
      Perhaps Panos concluded that descenders distract fast reading from his observations, although no research shows it yet.<br>
      From the overall study of my research, among Greek type designers at least, I could distinguish a tendency for Greek typefaces to approach the 'grey tone' or otherwise called 'the text colour' of latin typefaces. One way to achieve it is to cut off the descenders and ascenders or to reduce their height. Sometimes I do not encounter difficulties to read those kind of texts. But when 3 or more latinised letters are next to each other in a Greek word, then it seems like a spelling problem exists. I'll try to find such a text and to post a photo.</p>
