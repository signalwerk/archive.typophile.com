      <p>Brian, you've brought up some interesting things. However to me your stated "symmetry-seeking" (which I actually think we all exhibit) is confined to display typography; when it comes to immersive reading I don't see any positive role for such formalisms. Now, if <em>only</em> the vowels in Greek were confined to the "x-height" I would say that sure, the η (eta) should follow that rule, because there the confinement would be conveying usable information*. But I <em>love</em> the "y"! It would be so nice if Latin used its rich descenders more frequently; the ascenders are more frequent but overall way too plain (only the "f" is pulling its weight).</p>
      <p>* Speaking of Hangul, one amazing thing about it is that its four levels of syllable "visual density" are strongly associated with a syllable's grammatical function.</p>
      <blockquote><p>My subjective opinion is that Greek in its current monotonic orthography has somewhere near the right balance of things happening outside the x-height.</p></blockquote>
      <p>Really? But look how underused the ascender space is.</p>
      <p>--</p>
      <p>What people are "used to" is only part of the puzzle of readability. Saying that an η (eta) without a descender is just as good for reading as one with a descender* ignores -what I believe to be- a basic premise of reading: that deviation from a rectangle (again consider the low readability of all-caps) conveys information. Saying that Latin is easier to read than Greek because it has fewer descenders is exactly backwards. And trying to make Greek approach Latin by -for example- neutering its descenders <em>is</em> Latinization. Colonialist? Sadly cultural jingoism is alive and well, and sugar-coating our terminology makes things worse, not better.</p>
      <p>* In fact -as John once made me realize- the descender-less η is a marked flaw in one of my most favorite Greek fonts, Apollonia.</p>
      <p>hhp</p>
