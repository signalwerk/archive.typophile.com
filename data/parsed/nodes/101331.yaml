      <p>The serif came out of Latin inscription and lettering (see Catich  <a href="http://www.amazon.com/The-Origin-Serif-Writing-Letters/dp/0962974013" title="http://www.amazon.com/The-Origin-Serif-Writing-Letters/dp/0962974013">http://www.amazon.com/The-Origin-Serif-Writing-Letters/dp/0962974013</a> )<br>
      Greek lowercase writing came from the writing hand and the tools of the scribes of the time.  When writing with pen or brush, our first mark point is the entry stroke. As getting the pen started was not always totally predictable, a scribe might begin his first stroke with what began as a test stroke to get ink flowing.  This later became visible as a tiny blob or stroke upon entering the glyph. Seeing these strokes as normal, later scribes continued and emulated what had come before them.  People of my age (who have begun their writing learning with a pen dipped in ink) will find this natural and expected.  At your young age, I doubt if you have experienced this unless you have studied calligraphy. The exit stroke is the final mark at the lift of the pen and often tails towards the next glyph to be written.  This too is quite normal.  The serif, on the other hand, was a more purposive shape that was done in addition.  True, uppercase Greek often contains serifs due to influence of the Romans who were the rulers of the era.  When the Ottomans invaded Greece and many other territories around the Byzantine time period, the amount of control and influence that the Romans had diminished.  The Romans were busy with their own fall.  In the years that followed, the european countries not under the Ottomans proceeded to develop the Latin lowerecase of several styles and then the great era of printing began to flourish.  During this time, Greece was somewhat isolated from this experience.  The Greek lowercase grew out of the Byzantine writing and was later influenced buy the Turks.  Not so much as the Turks forced any form on the Greeks as just that the Turks prevented much interaction between the Greeks and other Europeans. Four hundred years went by with limited European influence and the Greek script continued to be on its own.  The Entrance and exit strokes became more prominent with faster writing and soon took their place as the expected construction of each glyphs that we have today. After 1821, the Greeks began their reunification with the rest of Europe.  At this point, printing was quite sophisticated but the Greeks were 400 years behind and caught up with the great help of their brother european countries.  This help also brought Latin script back as an influence.</p>
