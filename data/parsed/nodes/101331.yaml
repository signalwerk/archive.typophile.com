      <p>Nick: <em>I disagree, it’s quite straightforward. The problem...</em></p>
      <p>You say it is straightforward, and then immediately acknowledge that there is a problem. This is what I say we agree on: that there is a problem -- or challenge, as I put it -- arising from the inherited nature of the Greek minuscule letters. You may think the solutions are straightforward, but that seems to me not the same thing as disagreeing that there is a challenge or problem to be solved.</p>
      <p>Re. your option 2, <a href="http://typophile.com/files/Alphabetos_6252.png" rel="nofollow">earlier</a> you showed two examples of this approach in your work. What is the third?</p>
      <p>Re. your option 1, I think it is blasé to characterise this as straightforward. It is in the context of this approach that the underlying challenge/problem presents itself acutely, where the distinction between upright and italic styles might end up reduced to one of slant. What other distinctions might be introduced, within the confines of this basic approach (retaining traditional construction)? Systematic use of variant letterforms for beta, theta, etc., as in the ClearType fonts, is one option, although not favoured by some users. What about systematic variation of stroke modulation (consider, for example, the conventional pairing of the Didot style upright with the Leipzig italic, so common in Greek publishing)? Roundness vs. angularity, broadness vs compression (as in Brill)?</p>
