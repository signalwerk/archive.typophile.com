      <p>In any case, that Greek newspaper name came from a Greek-language newspaper published in New York City, surounded by Latin-alphabet users who thought that blackletter was the only style of printing suitable for a newspaper masthead - this was true until some time during the 1960s.</p>
      <p>Early written Greek is almost indistinguishable from <em>Phoenician</em>, so one could argue that an authentic "modern" Greek ought to look like... <em>Hebrew</em>, with almost as much validity as to claim, on that ground, that it should look like Latin.</p>
      <p>Although I have no love for Gill, or his Latinized Greek face, I do think that the comments quoted do have a bit of validity - Greek lowercase and Greek uppercase are not harmonized; Greek lowercase essentially only exists in a cursive form, and so doesn't match non-cursive uppercase.</p>
      <p>The cure, though, is not to ape a Latin, Cyrillic, or even Armenian model. This will continue to prompt much experimentation by Greek type designers, and perhaps eventually the popular taste will favor some particular style. But this isn't a problem that can be "solved" overnight.</p>
      <p>It can even be argued that this is not necessarily a problem, since it doesn't affect legibility or readability in a serious manner; the Greeks can read their own printed material just fine, even if it does not quite meet an aesthetic canon of foreigners. (Note, incidentally, that this may also suggest that the solution lies in making the capitals match the lowercase better, instead of the other way around - which Latin-script outsiders would favor, since they relate well to the capitals as they are.)</p>
