      <p><em>...what do you think about the "Greekness" of Greek lowercase letters?</em></p>
      <p>Isn't that what we were talking about for most of this thread? I don't think I've got much to add other than what I wrote earlier:</p>
      <p>I judge Greekness in terms of texture on the page, rather than specific letter features or treatments, but obviously that texture is built up from those features. In other words, I find it much easier to critique Greekness as a quality when looking at a page of text, seeing how the letters work together, than in terms of looking at individual letter shapes.</p>
      <p>As someone who works with a lot of different writing systems, I am sensitive to the fact that most scripts evolve normative letter constructions based on particular writing tools and practices, and that typography sits in relation to these letters (it can sit in critical relationship, or in rebellious relationship, but it can't ignore them). In the case of Greek lowercase letters, this means sitting in relationship to Byzantine scribal tools and practices, since that is where these letters came from. This means dealing with a predominantly cursive internal construction.</p>
      <p>Does this mean 'Greekness' must involve only reproducing Byzantine forms, or even particular Byzantine cursive script as interpreted by the Aldine press? No. It should also be noted that the Byzantine scribal tradition was not stylistically uniform. The historically most fruitful innovations in Greek typeface design, it seems to me, have engaged with that tradition, looking for ways to reinterpret the normative letter constructions with new tools (Didot), or looking for different directions emerging from that tradition (Scholderer's New Hellenic).</p>
