      _____</p>
      <blockquote><p>Greek lowercase and Greek uppercase are not harmonized; Greek lowercase essentially only exists in a cursive form, and so doesn't match non-cursive uppercase.</p></blockquote>
      <p>I'd like to be careful in the use of terminology here, just to be clear what we are talking about. The term cursive can mean running in the sense of connected letters, which is clearly not what we're limited to talking about when it comes to Greek (indeed, in this sense the Byzantine manuscript style is at most semi-cursive). But if we apply the term to the internal construction of individual letters, then yes, the dominant model of Greek minuscule is cursive, i.e. the pen is not lifted in the writing of most letters, but instead strokes are reversed or turned to form transitions, as is the case with the humanist italic letters.</p>
      <p>The relationship of Greek uppercase and lowercase letters is indeed complicated by their separate histories, although I think it is wrong to say that they are inherently 'not harmonised'. Better to say that they are a challenge to harmonise or, even more simply, that they do not harmonise in the same ways that Latin upper- and lowercase harmonise. The same can be said of Latin italic upper- and lowercase -- for exactly the same reason: uppercase letters with interrupted construction and lowercase letters with cursive construction --, and yet that doesn't prevent these being accepted as paired alphabets.</p>
      <p>Who was the first person to pair Greek upper- and lowercase letters as a true bicameral system? Tatiana, is this something that Antonios Sigalas discusses? My impression is that this was either a typographic innovation or, at least, contemporary with the introduction of printing. Byzantine manuscripts are mostly unicameral, employing only lowercase letters. Uppercase forms are found occasionally in them, but mostly as initials at the beginnings of sections or paragraphs, and not used systematically within the text.</p>
      <p>Another thing to point out about cursive construction is that while in Latin script it is associated with the informal (quickly written) scribal hands that lead to the italic style of typography, it is only one of the characteristics of such hands, and isn't necessarily linked to informality. Slant and horizontal compression are other characteristics of informal hands, and while these are characteristic of the late Byzantine manuscript styles on which Aldus based his Greek types, there are plentiful examples of more formal Bzyantine manuscripts hands with broad and upright letters. The cursive letter construction is still the norm, i.e. pen lifts are minimised, and many letters are still joined in ligatures, but the overall impression on the page is much more formal and quite different from the Aldine style.</p>
      <p><a href="http://www.pemptousia.com/2011/11/the-library-of-vatopaidi-and-its-manuscripts/" rel="nofollow" class="link-external">This article on the library at Vatopaidi has some nice examples.</a> [Right click on the images to view them at larger size.]</p>
