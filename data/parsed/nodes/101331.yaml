      <p>Since the even 4 descends, I am inclined somewhat in the direction of coincidence. Typewriters with conventional faces often have lining figures that extend slightly above and below the lines following oldstyle figures, which suggests a basis in the shape of the character. The 5 indeed suggests the 2 should ascend, although one could argue that it should descend based on the 6 and the 9.</p>
      <p>But rather than that being why it does neither, I would tend to think that the behavior of old style numerals is due to their being slightly closer to the Hindu and Arabic precursors of our numerals. When Arabic numerals were first adopted, various forms were used, and they looked quite different from what we are now used to.</p>
