      <p>Chris, you're assuming that the default form of η is that with the descender. This is of course true for most Westerners since this is the only form they are familiar with. I don't think it's surprising that Greek typefaces made in the West settled on the form with the descender in the last couple of centuries to differentiate the η from the Latin n.</p>
      <p>It's just that I haven't seen any evidence yet that the Greeks themselves ever stopped writing the η without a descender. If they've been using this form all along, you can't accuse them of cutting off a descender that wasn't there in the first place.</p>
      <p>But I haven't seen much about Greek handwriting in Greece during the Ottoman period, and today's Greek handwriting seems to derive from copying printed forms (hence the ahistorical fish-shaped alpha) rather than historical handwritten forms, much like a lot of today's Latin handwriting.</p>
