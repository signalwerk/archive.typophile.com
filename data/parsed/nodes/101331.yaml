      <p>@Albert<br>
      <em> I have some doubts on the idea of the Latin minuscule evolving from the capitals through the uncial. </em></p>
      <p>Albert,<br>
      since Latin alphabet evolved from Greek, maybe this information on evolution of Greek script may help you. </p>
      <p>1*. In ancient Greece, 3 styles of writing could be distinguished (from around 4th BC and continued up till 15th century) :<br>
      dimotiki (everyday use), calligraphic (for literary books) and official writing (official state documents and later for royal purposes). All these styles had a parallel evolution, means that all of them existed simultaneously and were influencing each other.<br>
      For dimotiki, the most common writing surfaces were wax tablets and pieces of clay. For calligraphic - papyrus and later parchment replaced it, same for official documents. The used writing tools (stylus for clay and wax, reed and ink for papyrus) allowed the writing to 'flow' on this surfaces. </p>
      <p>My point here is that especially the papyrus, which was used at least form 3rd BC, gave quite a round form to letters, different from those of inscriptions. Through images of Sigala's book one can see that during first centuries BC the writing cannot be described as uppercase, but neither as lowercase (see im. 126-p. 202/ im.127 - 203). And the lowercase 'was there' much earlier than we think. It was like an idea growing up.<br>
      Definitely the first written letters were uppercase for both alphabets, which can be seen form inscriptions, but for other 3 styles of writing, the 'clean' uppercase wasn't the dominant style for many centuries.<br>
      Beside this, at some point (5th AD), Greek writing resembled very much to Latin, and one could not distinguish them (see p. 217, im. 145 - horizontal one). </p>
