      <p><em>John</em>,<br>
      I was wondering if you are teaching typography, because not only you give a great, detailed explanation of terminology, but also have a lot of patience with me:) Thank you!</p>
      <p>What I meant by <em>'hidden system of implemented ligatures'</em> (and I agree with you that my terminology is not good enough) is that the entry/exit stroke of Greek lowercase letters (even in a sans serif version) is a residue of Byzantine ligatures. That's why I called it 'hidden system'.  And if we exclude them, the Greekness is gone ... I presume. And why  <em>arguably [ these strokes ] should be retained?</em></p>
      <p><em>Chris</em>,<br>
      This is an interesting approach. But then I'll ask you: do you design for yourself or for font end-users? If you design for yourself and the final product meets the needs of end-users, that's great. If you aim to satisfy the end-users, more or less, but not interested in their opinion, maybe, I say maybe, there is a gap of information between the designer and the user.<br>
      On the other hand, I presume the word <em>design</em> implies the creation of something new. And maybe is good to step aside and to create a distance between <em>past</em> and <em>present</em>.</p>
