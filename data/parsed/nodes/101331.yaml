      <p>I wouldn’t call it an entry/exit stroke unless it is a separate stroke, not just a bend in a main stem.</p>
      <p>**</p>
      <p>No doubt I am guilty of Latinization, but it seems to me that the two-part system of roman and italic <em>is</em> fundamentally Latin, and foreign to Greek. Therefore, if one is going to implement it in Greek, one should be true to its nature and employ something of the traditional method of ending terminals in Latin—which is to put serifs on the roman, and have the italics more “cursive”, with entry and exit strokes.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Alphabetos_6252.png"></div><br>
      The alternative is to treat Greek italic as a sloped roman, which is a method that, with its reduced differentiation between styles, has never caught on in serifed types.<p></p>
