      <p><em>...with a marked sense of otherness and antiquity, which was probably not how 19th century Greeks thought of themselves...</em></p>
      <p>I don't think there is anything particularly antique about the Didot and Lypsias Greeks in terms of their design; indeed, they represent the first significant innovation in Greek typography for almost 300 years and bring the script into line with what was then the latest fashions in writing. But yes, there is an association with antiquity from their use in the printing of classical literature.</p>
      <p>I don't know how the average 19th Century Greek thought of himself, but it is a fact that the elite stressed the classical heritage -- at the expense of the longer and chronologically closer Byzantine heritage -- in order to attract support for the cause and realisation of independence.</p>
