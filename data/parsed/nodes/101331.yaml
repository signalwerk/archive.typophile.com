      <p>The fashion in <em>writing</em> to which I referred was use of the split nib metal pen as opposed to the broad reed pen that was the tool of the Byzantine scribes and the stroke model for the renaissance Greek types. As I said, Didot's innovation was to take the structures of the Greek minuscule as inherited from Byzantine and renaissance heritage and to apply to them the dynamic stroke expansion of the split nib. He retained the variable stress angle, though. [In the Brill Greek, I used a similar stroke model but regularised the stress angle.]</p>
      <p>PS. Bringhurst notes irregular stress angle as one of the characteristics observed in Latin types of the baroque period. That's not the same thing as labelling irregular stress as baroque, especially not when applied to a non-Latin script with a much longer written tradition of variable stroke contrast.</p>
