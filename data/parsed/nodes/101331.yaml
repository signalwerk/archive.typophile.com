      <p>Charles, a lot of arguments in favour of cultural diversity ultimately reduce to a kind of biological metaphor. We've got excellent reasons to believe that biodiversity is essential for the long-term survival prospects of life on earth, and we presume that cultural diversity might be similarly beneficial for humanity. Personally, I think such arguments are unnecessary, because there are perfectly good short-term reasons to favour cultural diversity over monoculture in terms of richness and variety of experience (which is not the same thing as cultural relativism; being able to say that e.g. circumcision is a form of cultural violence against the individual is important within this diversity) and respect for both particular and shared heritage as something to be celebrated rather than lamented.</p>
      <p>That said, in terms of writing systems, and hence typography, a process like Latinisation seems simply perverse to me. Why does this conversation even take place, why is this a phenomenon? We're not debating Chinesification of Danish typography, or Hindification of Malaysian typography, or Cyrillification of Ethiopian typography, because these are all plainly ludicrous. Dressing up one writing system in another's clothes <em>is</em> ludicrous, and one doesn't need to make arguments from cultural diversity to say it is a pathetic idea. As a kind of <a href="http://www.dafont.com/theme.php?cat=201" rel="nofollow">novelty display typography</a>, it has a long history, but would you as an English reader sit down with a book set in <a href="http://www.dafont.com/chinese-takeaway2.font" rel="nofollow">Chinese Takeaway</a>? And yet we consider it normal, or at least something about which reasonable debate is possible, that Greek -- or Thai, or Hindi, or Russian -- readers should read Latinised versions of their writing systems? And that this constitutes 'progress', as if the Latin writing system were in some way inherently superior, and not simply the beneficiary of political, financial and industrial contingency?</p>
      <p>Let me also clarify that while I think it unfortunate in terms of loss of richness and variety, I don't blame any society that decides to give up its indigenous writing system in order to adopt one that it thinks will be more materially beneficial. I think the traditional Javanese script is one of the structurally cleverest and most beautiful in the world, but adoption of a Latin orthography in the mid-20th Century clearly helped integrate Java within Indonesia and contributed to increased literacy in the socio-political context of that time. But actually adopting a new script is an entirely different matter than playing dress-up with your old script, of trying to make it look like something else. That's just sad and pathetic.</p>
      <p>Now, does this mean limiting the range of expression of your writing system and typography to specific historical models? No, I don't think it does, and I think it is an entirely false association to equate the development of new styles with Latinisation just because Latin type designers have produced such a variety of stylistic innovations over the past couple of centuries. And, indeed, in what way does aping stylistic idioms of Latin typography constitute innovation in another script? If the only way you can stylistically innovate is to try to come up with a Greek -- or Thai, or Hindi, or Cyrillic -- version of Helvetica, then maybe you're writing system is culturally dead on the ground already.</p>
