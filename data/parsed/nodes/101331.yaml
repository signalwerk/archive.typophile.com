      <p>Panos, I entirely agree that the needs of various kinds of modern typographic settings, such as the mock B&amp;O advertisement you show, demand a wide variety of styles including many that fall outside of traditional Greek text types. That is as it should be, and great news for type designers providing products for those segments of the Greek type market. I've never insisted that all Greek type should be in a narrow range of traditional styles, but I do question the degree to which innovations in style should be based on treatments imported from the Latin script. There's nothing inherently wrong with cross-fertilisation of ideas from different writing and design cultures, of course, but when one culture becomes so dominant it should be questioned and challenged. One way to do this is to look for new ways to innovate from within the non-dominant culture.</p>
      <p>So when I look at that mock B&amp;O ad, and think about what style of type might be appropriate to that image and to the message that the advertiser wants to convey, I'm thinking about what 'clean, well-constructed, modern cut with a more luxurious orientation' might mean <em>independent of Latinisation.</em></p>
