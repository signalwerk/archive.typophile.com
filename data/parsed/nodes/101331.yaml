      <p>@Panos Vasiliou:<br>
      <cite>Let's not forget that Latin has Greek origins, so please view this an an inevitable 'progress' which was meant to begin happening.</cite></p>
      <p>Well, that is a legitimate enough view. Cyrillic has more exclusively Greek origins, yet that hasn't stopped it from being just about like Latin.</p>
      <p>However, the uncial letters from which Latin lower-case derives have had no place in Greek history. Or, for that matter, Russian history - and so a number of Cyrillic lower-case letters have 'small capital' style shapes. So I'm not sure how much convergence with Latin is truly inevitable, even if I accept that quite a bit of convergence may turn out to be in the interest of Greek readers.</p>
