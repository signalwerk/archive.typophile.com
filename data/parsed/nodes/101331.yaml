      <p>Thanks, Tatiana!  I, for one, have great trouble with the chopped off letters, like eta.  This may be, perhaps, because I am so immersed in English that Greek glyphs that are chopped, look like English or even Cyrillic.  I have a difficult time seeing how taking away visual information can increase readability. I know I am a very poor example because I am not a native Greek speaker but wonder on what basis this could be assumed without more scientific testing.<br>
      "Grey Tone" as you call it or "even color," as I might assume you mean, Do not require chopped glyphs. In fact, all capital letter text has been proven many times to read poorly compared to lower case.  I don't think Latin has more even color because of fewer descenders.  I think it is more even because of more regular sides.  This may not even help readability, I do not know.  I assume if we depart too far from what an audience expects, that we are doing more harm than good.  This theory that Panos seems to describe, appears to indicate that unicase would read better than lowercase text.  I find this hard to accept.  Then again, I am just one old man from across the sea ;-)</p>
