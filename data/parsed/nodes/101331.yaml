      <p>Tatiana, I think it might be a little misleading to say that 'ψ' may be 'y'. There is a cursive form of ψ that is close in its construction to a particular kind of Latin y, but it isn't the case that other forms of the Latin y can be substituted for ψ.</p>
      <p>I also wouldn't interpret your teacher's correction to your final sigma as being a Latin s. It seems to me she was simply indicating that this letter is normally written fast and loose, and that your attempts had been too stiff and formal (contrast with your looser, faster zeta and ksi).</p>
