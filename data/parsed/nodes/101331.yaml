      <p>The answer to creating a Greek roman/italic duality was self evident, at least to me.<br>
      Of the two options I described, the second was clearly right and the other wrong.</p>
      <p>That’s why I didn’t think the problem was a conceptual challenge, although the nuances of many of the glyphs were hard to draw.</p>
      <p>Making the Roman upright stiff and formal, and the Italic cursive, calligraphic and slanted has worked well for the Latin script, so why not apply this principle to Greek?</p>
      <p>It seems weird to merely backslant the historic Greek forms, retaining their traditional calligraphic ductus, if one wants to create a Roman/Italic system that will harmonize with Latin, which, let’s face it, is the dominant style internationally. </p>
      <p>More significantly, when Manutio introduced italics, they were stand alone—but when they became used in conjunction with Roman, Roman prevailed as the main style. That was no accident, nor culture-specific; the formality of the roman style, and its symmetry, resonate with the geometry of the rectangle and the grid, which are the basic structure of the mechanical typographic page. Technology-speciﬁc, perhaps.</p>
      <p>Are there other solutions to this problem? Of course, but I haven’t noticed, so please show and explain if you know of any!)</p>
      <p>Centro Serif, by Panos Vassiliou, takes this idea further than I have, with for instance, many serifs on the roman, and a Roman nu with no descender, whereas the italic has fewer serifs and Italic nu does have a descender.</p>
      <p>The three typefaces I’ve designed Greek for are Scotch Modern, Richler and Figgins (not shown), which, as a grotesque, has a similar italic to its roman, so doesn’t follow this principle.</p>
