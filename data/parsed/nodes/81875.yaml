    <p>The "B's" in Glastonbury Abbey look quite consistent, possibly suggesting an actual font?</p>
    <p>Also i'm sure i've seen similar faces floating around like "somerset". very much like this classical circus type lettering used on posters.</p>
    <p>Help is greatly appreciated.</p>
