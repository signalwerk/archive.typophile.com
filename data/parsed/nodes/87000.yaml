    <p>I was asked to clean up a booklet for my company, but unfortunately its design is justified text with a fairly short line length. I'd love to redesign the whole thing, but it needs to be done and published in a couple weeks, so I'm left doing damage control.</p>
    <p>I've twiddled with the justification and even the hyphenation in hope of fixing the letter and word spacing with some success, but it's not good enough yet. I was wondering if anyone here has any suggestions for possible typefaces that handle justification better, or even settings I haven't thought of. Thanks in advance.</p>
