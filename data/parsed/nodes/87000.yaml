      <p>Well, paragraph, you are right that there is a phenomenon that the excitement of novelty may temporarily blind people to something that really doesn't work aesthetically. But often the practiced eye will see through novelty alone, and that something is not well done.  </p>
      <p>The tight-but-not-touching fashion came into being because it was possible for the first time with photo typesetting. I'm sure that for a lot of people, in addition to Ben Lieberman, the badness of things like that Royal Carribean ad—which has a lot of touching by the way—was also obvious at the time. </p>
      <p>Of course it may have worked OK at the time for the intended audience. But still, there were people who knew better. </p>
      <p>A more recent version of this was all the layering that went on in the 90s, with the grunge and other fashions. </p>
      <p>Both tight display type and layering can be done effectively, but now we can see the difference between good and bad examples. </p>
      <p>By the way, I thought at the time that platform shoes were idiotic, as they are both ugly and impractical. Now Lady Gaga is wearing them. Bell bottoms, wide lapels, and side burns I still don't see any inherent problem with...</p>
