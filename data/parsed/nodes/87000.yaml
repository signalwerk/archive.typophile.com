      <p>Ok, you're right I wasn't clear, so let me clarify. In general very tight letter spacing disrupts the balance of white space between letters with white space within counters. So evenness of color is hurt. And as a result I think readability is hurt and the texture of long or multiple lines of type get ugly.  </p>
      <p>However with display type of a few words, I think all bets are off as far as "rules", because it depends on the setting and the goal. In logos and advertising, the visual interest of the image of a few words becomes more important than readability, and you can sometimes get a more interesting or punchy image by tight, touching, unusual ligatures, rotated or woven together letters, distorting letters, etc. etc. With a few words, and even more so with a few letters, you can get an interesting image that coheres with all kinds of visual play. And tightening spacing is one of the simplest things you can do to increase liveliness and punch. But it often looks ungainly, and is still overused today, IMHO. But it certainly can be effective, and I'm sure you can find many good examples, with a few letters and words. Not with extended text.</p>
