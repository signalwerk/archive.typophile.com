      <p>You need to do a lot of manual work with your paragraphs, not automatic stuff from a menu. At newspapers (which is where I've got my Indesign training) we've practically only got short line length justified text to work with, and we do a whole bunch of stuff to alleviate rivers. Some of these may be unacceptable in more complex settings, but here are some tricks anyway:</p>
      <p>* Rehyphenate manually. A lot of rivers can be made to disappear if you just switch hyphenation one syllable forward or backward. </p>
      <p>* Ever so slightly fiddle with tracking. Up to 15/1000 of an em (some say 30/1000) is basically not noticeable for the naked eye unless you're really looking for it. You'd be amazed how much difference those little changes make. Absolutely don't overdo this, though, going over the limit it starts to be really visible. Oh, and only do it to whole paragraphs at once.</p>
      <p>* As a last resort, Rewrite! No writer in the world (except possibly Giles Coren) is going to remember which particular word order they used, or exactly what adjectives went where. If you're reasonably stylistically confident you should be able to pull this off on the sly.</p>
