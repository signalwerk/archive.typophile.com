    <p>My hip collegian daughter is always pushing me to make fonts which she thinks will fit the design trends of the day, which seems to come down to fonts which would look good in the monogram on the side of the Adams Family’s hearse, on an Ed Hardy t-shirt or tattooed on the back of a contestant on Tool Academy. Ok, that’s the extent of my second-hand contemporary cultural literacy.</p>
    <p>But she has a point that we work with all of these antique type and lettering sources and tend to go for the clean and perfect and aesthetically refined, while neglecting the demand for fonts which are appealing for their rough, vintage and gothic qualities. So working from samples collected by art historian Pedro Lemos, I’ve created the new Montressor font. It takes its name from the narrator of Poe’s story The Cask of Amontillado because it has a look reminiscent of the decadence of Spain in the later days of the Inquisition. It is a decorative initials font with has strong black letter characters with decorative embellishments plus some additional special characters for framing the initials. The look is strong, raw and somewhat gothy.</p>
    <p>You can try the font out for free.  It's our new featured font at http://www.fontcraft.com</p><div class="imageWrap"><img src="http://typophile.com/files/montressor_4049.jpg"></div><p></p>
