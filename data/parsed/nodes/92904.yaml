      <p>Hi there,</p>
      <p>we have just deployed a new Find my Font version: 3.1.00.<br>
      You can find bellow the full  list of new features, the most important being the addition of an image correction tool, which allows the user to identify a font without any external image pre-processing even in cases of perspective deformation (e.g. a photo taken from a weird angle) or a low quality image.</p>
      <p>The new tool performs one or all of the following operations in a single step:<br>
      Correct Deformation &amp; Perspective,  Enlarge Image x3, Mirror Image, Increase Contrast &amp; Shrink or Expand Image Horizontally.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FmF_ImageCorrectionScreen_3442.jpg"></div><br>
      This is a sample screen to show how the image correction tool works: You select a 4-points area -by following the text-flow-, select all required options (in this case Enlarge &amp; Perspective Fix) and click on the [Apply] button to acquire a corrected image copy, on top of your original image.<br>
      The next step is to proceed with letter selection &amp; font identification - as usual.<p></p>
      <p>I 'd like to thank all Typophile site font-masters for the valuable expertise I gained by your feedback and I also like to thank all of you asked for or solved a font ID request, because the only way to improve an application is to adapt it to real-world samples and real people needs.</p>
      <p>You can download the latest release by entering your license number in the product update page:<br>
      <a href="http://www.findmyfont.com/index.php/members/product-update" title="http://www.findmyfont.com/index.php/members/product-update">http://www.findmyfont.com/index.php/members/product-update</a></p>
      <p>or you can always download the free-30-days-trial edition here:<br>
      <a href="http://www.findmyfont.com/index.php/download/download-free-edition" title="http://www.findmyfont.com/index.php/download/download-free-edition">http://www.findmyfont.com/index.php/download/download-free-edition</a></p>
      <p>I will be glad to hear your thoughts about this new release.<br>
      Cheers,<br>
      Fivos</p>
      <p>===========================================<br>
      <strong>Full list of Find my Font v3.1.00 new features:</strong><br>
      ===========================================<br>
      <strong>(1) Image Correction tool</strong><br>
      This new tool allows the user to make multiple corrections on the image such as:<br>
          Deformation correction<br>
          Image enlargement<br>
          Image mirroring<br>
          Contrast correction<br>
          Image expansion<br>
      All the above corrections can be performed on the whole image of any part of it. A preview is shown to allow the user to perform the necessary adjustments before finalizing the correction.</p>
      <p><strong>(2) Network Parameters</strong><br>
      The program now allows the user to indicate if he's using a proxy to connect to the internet and the parameters for the connection.</p>
      <p><strong>(3) Improved Baseline Rotation tool</strong><br>
      The tool now shows vertical lines to make the 'horizontalize' operation much easier.</p>
      <p><strong>(4) Tool tips  </strong><br>
      The new tool tip area provides useful information about the selected tool. The user may also adjust the tool's parameters in this area.</p>
      <p><strong>(5)Minor corrections / improvements</strong><br>
          Mac OS GUI corrections<br>
      ----------------------------------------------------------------------------</p>
