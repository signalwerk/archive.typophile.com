    <p>Hi,</p>
    <p>Softonium Developments is proud to announce Find my Font v3.0 which is a major update to our font matching tool.</p>
    <p><a class="freelinking external" href="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters.png" rel="nofollow"><img src="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters_sm.png" alt="Find my Font Screenshot 2"></a><br>
    <a class="freelinking external" href="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters.png" rel="nofollow">click for bigger image</a></p>
    <p><strong>a. Major new feature: Both Local and Online matching supported</strong><br>
    The most important feature introduced is the capability to find a font from an image not only by scanning the local fonts of your PC but to retrieve also font matches from an Online Font-Matching Database.</p>
    <p><strong>b. The Online Font Matching database</strong><br>
    Our database currently contains matching information about 40.000+ Commercial, Freeware, Shareware and Free fonts, including major commercial foundries/vendors and fonts from Shareware/Free resources like Dafont.com &amp; Google Web Fonts.<br>
    You can have a look at how an Online-Font-Preview looks like, here: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Linotype&amp;ffam=BauerBodoni%20RomanOsF%20-%20Bold&amp;fid=2c87990d71dc9b8166c753c728dc7bc6&amp;fsize=60&amp;text=Find%20my%20Font%20Bodoni%20Sample&amp;wrap=2" rel="nofollow">Bauer Bodoni Preview Sample</a></strong></p>
    <p>We update our database very carefully, to avoid including any clones or forgeries of copyrighted fonts. If you spot such a case, please send us a message through the integrated font-feedback form and we will investigate the case and remove the associated font as soon as possible.</p>
    <p><strong>c. How to include your fonts in our database</strong><br>
    If you are a font designer or represent a foundry and you are interested to include your fonts in our matching database along with direct links to your site and links to major font resellers like MyFonts.com or FontShop.com, please contact us. There are no hidden charges or strings attached to our offer, this is a win-win situation: We are making our database more complete and you can sell more fonts by increasing your exposure.</p>
    <p><strong>d. How to acquire the new release</strong><br>
    The new version 3.0 is offered as a free upgrade to all our current customers and the online matching feature is also available to our Free-30-Days-Trial demo. You can read more details or download our 30-Days-Trial in the <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/find-my-font/editions" rel="nofollow">Find my Font Edition comparison page</a></strong> or read a full version history <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/find-my-font/version-history" rel="nofollow">here</a></strong>.</p>
    <p>I'd like to thank again all typophile users for your valuable input and support which helped us a lot to make Find my Font a better tool. <strong>I will be really glad to read your comments<strong> about our new release.</strong></strong></p>
    <p>Regards<br>
    Fivos</p>
    <p><strong>PS:</strong> If you already have a Find my Font edition: You can download the new release by just entering your license number in this page: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/members/product-update" rel="nofollow">Product Update</a></strong></p>
