      <p>Victor, <em><a href="http://typophile.com/node/14390?" rel="nofollow">vyaz’</a></em> (<em>вязь</em>) is an <a href="http://www.paratype.com/help/term/terms.asp?code=369" rel="nofollow">ancient Cyrillic calligraphy style</a>. There was <a href="http://typophile.com/node/14377" rel="nofollow">an earlier discussion</a> of <em>vyaz’</em> on typophile.com, in view of the advanced typographic features of the OpenType technology (contextual glyph substitution on the fly). </p>
      <p>As to <a href="http://en.wikipedia.org/wiki/Gzhel" rel="nofollow"><em>Gzhel’</em></a> and <a href="http://en.wikipedia.org/wiki/Khokhloma" rel="nofollow"><em>Khokhlomà</em></a>, those are traditional folk techniques of pottery-making and decorating, and painting wooden tableware, named after the villages they originated in.</p>
    html_clean: |-
