      <p>Hi Ivan, I've put together the closest thing I could think of to Vyaz' in hangul: the stylized space-filling forms used for seals. The design below reads 이반 굴코프, or Ivan Gulkov. It's really inadequate, and as something thrown together quickly on a grid it's embarrassing to post next to your intricate designs (and now of course is when I get the idea that I should have done this on FontStruct). But hopefully you get a sense of what is possible in different writing systems.</p>
      <p><img src="/sites/default/files/old-images/ivangulkov_4237.gif"></p>
