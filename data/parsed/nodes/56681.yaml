      <a href="http://www.callig.ru/node/4/" title="http://www.callig.ru/node/4/">http://www.callig.ru/node/4/</a></p>
      <p>Basics of type graphics, Semchenko P.A. (Основы шрифтовой графики, Семченко  П.А.) 1977<br>
      <a href="http://www.callig.ru/node/14/" title="http://www.callig.ru/node/14/">http://www.callig.ru/node/14/</a></p>
