  html: |-
    <p>I was toying around with an idea of a new Vyaz' font for a while now, but the sheer mind-boggling amount of ligatures and heavy scripting required to accommodate a proper and versatile face seemed unmanageable. Thus, I finally decided that a simple vector file would be a better alternative, with a basic modular design, a handful of letter alternatives, ligatures and decorative elements, providing the user with the freedom to construct their own combinations. here are the first sketches of this Idea:</p>
    <p>Church Slavonic:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/vyaz5_4913.gif"></div><p></p>
    <p>Longer passage without archaic letters:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/vyaz4_5848.gif"></div><p></p>
    <p>Different ligature options:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/liga_5815.png"></div><p></p>
    <p>This is what I am trying to base it on:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/historicvyaz_6075.gif"></div><p></p>
