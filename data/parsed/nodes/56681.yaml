    html: |-
      <p><em>would a Latin version be of use to anyone, or just help propagate corny Russian-esque kitch.</em></p>
      <p>Why not "try it and see". Anyone can have a clever idea (or kill it at the concept stage), but until you actually try and work out an idea you never know how it will turn out in reality, or what paths it will lead down. It's also my experience, having created a few oddball faces, that there's always someone somewhere who will find a use for whatever you throw down (and it will most likely be something you never anticipated); fonts are the perfect "Long Tail" product.</p>
