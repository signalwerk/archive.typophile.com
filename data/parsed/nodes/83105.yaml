    html: |-
      <p>The categorical distinction between "Contrasts" and "Opticals/Grades" is apparent if you consider that it would be possible to make Optical or Graded variants of your Contrasts.</p>
      <p>I'm not sure how this would be achieved in practice, but theoretically:</p>
      <p>Because press gain adds an even amount to both x and y dimension, it shifts contrast and changes horizontal/vertical proportions. Therefore if you wanted to maintain the same contrast in different press situations, you would indeed have to make graded versions of your different contrasts.</p>
      <p>Also, you would have to shrink the heavier grades in size.</p>
      <p>It would be a better practice to say, "when press gain is heavy, use Contrast 7, Grade 1", rather than "…use Contrast 8 because it will look like Contrast 7".</p>
      <p>There doesn't appear to be a standard terminology for grading: H&amp;FJ (e.g. Chronicle), FB (e.g. Benton) and Typotheque (e.g. Greta) have different approaches.</p>
