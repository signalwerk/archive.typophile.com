      <p>If it's not about size, and it's not about gain, then we do indeed need a new term. Rotis comes to mind: it uses "semi" to mean "not really"; in the serif pair it means semi-serif, while in the sans pair it means "sans with contrast" (since in oldschool terminology "sans" means no serifs <em>and</em> no contrast). But it sounds like you have a gradation going, so you need a scalable term - maybe "contrast grade", or "CG" for short; you might suffix "CGn" where "n" is an integer. Or maybe dump the "G" from the suffix.</p>
      <p>hhp</p>
