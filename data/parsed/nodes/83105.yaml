    html: |-
      <p>It's not an "optical" idea, not is it grading.<br>
      Optical variants adjust for a variable such as size or letterspacing.<br>
      Grading variants adjust for press gain.</p>
      <p>But what you are doing doesn't adjust for anything, it is purely stylistic.</p>
      <p>As such, you are working with a stylistic axis.</p>
      <p>Other stylistic axes are of course weight, horizontal scaling, and slant—as in the famous Univers family chart.</p>
      <p>Since then, following the metafont/multiple master idea, other axes have been explored.<br>
      For instance, Chalet proposes a fashion axis.<br>
      Penumbra has a serific axis.<br>
      Carl Crossgrove invented an axis of agitation with Reliq.<br>
      I explored the axis of oldstyle/modern, with Sense and Sensibility at the extremes.</p>
      <p>What you have is an axis of contrast.</p>
      <p>Another term for an axis might be a scale, but scaling is used in typography to mean "making bigger or smaller".</p>
      <p>Admittedly, any Multiple Mastering/tweening — including optical sizing and grading —  is done along a design axis.<br>
      But I think that if you identify your fonts as variants along the stylistic axis of contrast, that is quite clear about what they are, and distinguishes them from opticals or grades.</p>
      <p>Or just call them contrasts (as one would refer to weights), e.g. Jasper Low Contrast, Jasper Medium Contrast, and Jasper High Contrast.</p>
