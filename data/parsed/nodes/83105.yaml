    <p>Hey everybody,</p>
    <p>I'm working on sans serif with different variants with different contrast. The same idea as optical grades, accept they're not to make it look the same at different sizes. There made to make it look different, yet the same, disregarding the size. This would make the term 'optical grade' misleading and unclear. Can you think of a good alternative?</p>
    <p>Thanks in advance,</p>
    <p>Jasper de Waard</p>
