    html: |-
      <p>If you emulate a font with your handwriting, it will look like faux type. Which can look cool, but would also be decidedly mannered, even affected. Most people will think it's phony. So I don't think you should fake your handwriting. The most you should want to change it might be to make it more legible. And there's one very easy way to do that: slow down.</p>
      <p>hhp</p>
