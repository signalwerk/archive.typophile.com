      <p>Couldn't handwriting be compared to your speaking voice? That's a "reflection of you" without question, yet it if you learned bad habits growing up, your speaking voice  doesn't do you justice. </p>
      <p>For instance, if you talk so fast, so sloppily, and with such a thick regional accent, that many people have trouble understanding; you don't make a good impression at a job interview; not suited to jobs dealing with the public, etc. </p>
      <p>This could be dramatically improved by slowing down, paying attention, and practicing. You might use a good speaker as a role model, but it's still your own voice; you don't have to be an impersonator.</p>
