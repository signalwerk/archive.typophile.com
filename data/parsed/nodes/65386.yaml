  html: |-
    <p>Help!  I hate the childish, inconsistent, heavy-handed scrawl that passes for my handwriting.  However, I'm not much happier with the readily available learn-at-home alternatives: italic or modern cursive.  They are legible, but that's about it.  They reek practicality, without having elegance or sophistication or individuality.</p>
    <p>I am looking for a font to use as a model for my handwriting. My ideal would be something modern, distinctive, legible, fairly easy to write quickly and arresting or "cool" (whatever that means when applied to handwriting).  A lot to ask, I know.</p>
    <p>I would so appreciate any suggestions.  Thank you in advance for your help.</p>
    <p>Nick</p>
