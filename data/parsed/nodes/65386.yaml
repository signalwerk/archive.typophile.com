    html: |-
      <p>I keep altering mine, albeit only slightly each time, just because I want it to look better. For years I avoided using my actual handwriting because I felt it hadn't developed since school. I do a quite a lot of different lettering styles but these are all fairly slow and calculated, but I thought I could in some way work backwards from those to create a faster, instinctive handwriting, and around that time I happened to find the Rosemary Sassoon book.</p>
      <p>I retrain my handwriting partly when things start to go wrong with it, such as r &amp; v looking too similar, and bad spacing on cl so it looks like d, and while I'm doing that I might change the way I write some other letters. I also write differently depending on the pen I'm using. I do the traditional italic slant with fine pointed nibs but do an upright version with wider nibs, or even slant to the left with something very wide like a Pilot Parallel pen.</p>
