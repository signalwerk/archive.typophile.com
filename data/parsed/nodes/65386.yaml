    html: "<p>I presume by ‘font’ you mean some kind of script or handwriting font, i.e. something based on a handwriting model that you could, in turn, adapt as a model for your own writing. Caflisch Script Pro might be a good candidate: it is a model that is easy both to write and to read, you can be quite free in how many joins you make or do not make between letters, and it does not depend on the use of a particular writing implement.</p>"
