    html: |-
      <p>It seems you want a distinctive, but very legible handwriting, yet not affected-looking. </p>
      <p>This may or may not help you: </p>
      <p>Many people have noticed my handwriting is distinctive. I'm asked to address special envelopes and such. </p>
      <p>My handwriting started to become distinctive after I took art school classes in Lettering 101. We first learned a basic upright style using a broad-nibbed pen. </p>
      <p>I stopped writing in the slanted, cursive style I was taught in 3rd grade (Palmer?). To me, that seems to result in sloppiness, with the letters all too often running together and resembling each other (m-n-w-i-e). </p>
      <p>I started writing habitually in an upright, unconnected style, with each letter formed separately, with a 2-story "a," and large capitals. When written hurriedly, the letterforms are more dramatic. </p>
      <p>It resembles <a class="freelinking external" href="http://new.myfonts.com/fonts/scholtz/genial/" rel="nofollow">Genial</a></p>
      <p>or  <a class="freelinking external" href="http://new.myfonts.com/fonts/scholtz/coral/" rel="nofollow">Coral</a></p>
    html_clean: |-
