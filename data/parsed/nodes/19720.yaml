    <p>If I may I’d still take the opportunity and ask about one other font I also asked about previously at WhatTheFont yet it remains unsolved.</p>
    <p>I’d thus appreciate your help in identifying it, please, anyone who knows which it is?... </p>
    <p>It reminds of <a href="http://www.myfonts.com/fonts/t26/flux/">Flux</a> but the endings in some of the letters are rather different (and also it appears to be somewhat “boldier” than the bold version itself) so I don’t know?... Is it another font all along? (Or would it maybe just be a “customly edited” Flux?...) </p>
    <p>Thanks already, once more, for your help and patience.</p>
