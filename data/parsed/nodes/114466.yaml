      <p>Thanks for your response James. Funny that you should mentioned about "tightening up the gaps between the character segments." I originally had the gaps only .1 units such as you have it displayed but faced problems when it came it to print so I increased it to .2 units.</p>
      <p>My original sketches had rounded corners but for seem reason I abandoned that concept. Ill definitely make some adjustments and repost an updated version asap.</p>
      <p>Thanks</p>
      <p>SG</p>
