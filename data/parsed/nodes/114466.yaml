    date: 2014-03-08T23:06:00
    date_raw: 8 Mar 2014 — 11:06pm
    votes: null
    html: |-
      <p>Stock and printing technique will affect the outcome, but I think predominantly the size of the logo. I think it will be impossible to find the right distance of the gaps for all sizes. If I were you I would make 2 variants; one for big to regular use and one for small applications and less desirable printing methods.</p>
      <p>For the small version I would decrease the gaps a bit more than your original and for the regular version I would get a bit closer to the "after" picture. Also, I think by decreasing the width of /3 you also avoid the resemblance of a /3 with some character in front of it. I think your current 3 is simply too wide.</p>
