      <p>I like the general idea of a stencil lettering (given your particular circumstances), and I can see lots of possibilities for an art studio logo by doing variations with the color having a texture like brush strokes, or color gradations, etc.  Also you might experiment with slight rounding of the corners to give it a less rigid look.</p>
      <p>But to me the "3" looks like it's got some other character in front of it, and the "1" looks like punctuation followed by an "L". Tightening up the gaps between character segments may help; they normally are minimal and are just to keep the stencil from falling apart. Below is a quickie example:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/example2_5478.jpg"></div><p></p>
      <p>If you'd like to see many examples of "314" in different stencil fonts, go to the page below and enter "314" in the "sample text" box. Of course you'll want to do something custom and different, but still it might be helpful.</p>
      <p><a href="http://www.myfonts.com/search/stencil/fonts/" title="http://www.myfonts.com/search/stencil/fonts/">http://www.myfonts.com/search/stencil/fonts/</a></p>
