      <p>&gt; but faced problems when it came it to print</p>
      <p>It may taking some experimenting to get the gap right. And results will vary depending on paper stock, as some stocks are more absorbent and have more ink spread. Coated (glossy) stock will give the least spread. If you're using an ink-jet printer, most office supply stores also carry reams of premium ink-jet paper which may give better results.</p>
