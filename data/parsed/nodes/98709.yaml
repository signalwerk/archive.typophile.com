    html: |-
      <p>Maybe there is, but I just use brute force, doing a copy and paste to see if the two glyphs line up properly, then undo.   It can also be done (equally kludgily) by adjusting the horizontal location of glyphs within their cells so that they overlay when entered one after the other in the metrics window. Essentially setting one to 'not advance'.  I imagine that kerning overlaying pairs could also work. None of these are elegant; there's probably a way to write a script to do it, too. </p>
      <p> - Herb</p>
