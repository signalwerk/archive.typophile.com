    html: <p>In instances like the ones shown, I usually import the shadowed characters, adjust sidebearings, then kern. I then make a copy of the font file, then delete the shadows and/or other decorations, which leaves the fill characters in precisely the same position as in the original file. Of course, you will need to reverse the path direction of the fill characters, and you may want to add a bit of trap by expanding the outline of the fill characters by a couple of em units. If you choose to do the latter, be <em>very sure</em> that you deselect "Keep original character size" because, in my experience, FontLab has a tendency to reposition characters when this option is selected--which kinda defeats the whole purpose...</p>
