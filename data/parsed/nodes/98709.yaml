      <p>I would take the opposite approach from majus' - do everything in FontLab, where the same position will always map exactly.  I find that no matter how I try, a copy and paste from Illustrator to FontLab introduces discrepancies. Illustrator's grid doesn't always translate precisely to FontLab's integral grid.</p>
      <p> - Herb</p>
