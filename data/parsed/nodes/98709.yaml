      <p>If I understand correctly what you are doing, the most accurate way to do this would be to do ALL of your art layered in Illustrator first, and all layers must have a common EM size and reference point so when you bring them into FontLab they would all then scale correctly and line up the way you want. </p>
      <p>Don't give up because it is fairly easy to do, but it does requires a lot of attention to detail. You have to monitor closely the numbers for all the layers (width, kerns) and double check all your imported art for position.</p>
