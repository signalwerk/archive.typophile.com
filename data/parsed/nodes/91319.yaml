    html: |-
      <p>I think the rules are in many ways similar to that of setting Latin text, though without the options of emphasis we have, and in reverse. Also note that Hebrew has a different system of harmony than Latin. If Hebrew is on the same line as Latin, the two languages should be sized so that the Hebrew mem-height is somewhere inbetween the Latin x- and cap-heights. Hebrew line-heights are going to be different than Latin, so try to make it balanced and have enough space between the lines and be careful with the measure.</p>
      <p>Your best bet might be to look at Hebrew books and see how they are set. Might help:</p>
      <ol>
      <li><a href="https://web.archive.org/web/20150415001722/http://www.worldcat.org/title/hebrew-book-an-historical-survey/" rel="nofollow">The Hebrew book : An historical survey.</a> (1975)<br>
      A survey of Hebrew books throughout history. Depending on the feeling you're going for, you can look at an appropriate period.</li>
      <li><a href="https://web.archive.org/web/20150415001722/http://www.worldcat.org/title/new-hebrew-typography/" rel="nofollow">The New Hebrew Typography</a> (1932)</li>
      <li><a href="https://web.archive.org/web/20150415001722/http://www.hebrewtypography.me.uk/" rel="nofollow">Hebrew Typography</a>, a website that has a PDF download.</li>
      <li><a href="https://web.archive.org/web/20150415001722/http://www.ivritype.com/hebrew/" rel="nofollow">Ari Davidow's website on Hebrew typesetting</a><br>
      Ignore the unsubtle website design. Ari is not a web developer. :)</li>
      <li><a href="https://web.archive.org/web/20150415001722/http://www.ivritype.com/hebrew/biblio/" rel="nofollow">Hebrew Typography Annotated Bibliography</a></li>
      </ol>
