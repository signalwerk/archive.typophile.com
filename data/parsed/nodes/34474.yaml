      <p>I think you’re assuming a 2-unit difference along the entire 1000 Em height, while I suspect Goran is talking about that difference just along the height of that glyph, which I would guess is about half the Em height. Which adds up, since I got 1 degree (double yours) using a visual measurement.</p>
      <p>&gt; that you can feel rather than see at text sizes, right?</p>
      <p>Well, Seria Italic has an -average- slant of 1/2 a degree, and I think Majoor would tell you it’s visible. But I’m not sure how to differentiate “feel” and “see” here... Certainly if you ask a person to estimate the slant he can’t do it; but if you set totally upright text next to 1/2-degree-slanted text and ask a person to concsiously choose which one is slanted I’m pretty sure he can, even at like 12 point. I <cite>am</cite> assuming extremely clean repro here though.</p>
      <p>hhp</p>
