      <p>If I remember correctly Larry Oppenberg, who onced worked in the Mergenthaler Linotype drawing office, showed me drawings in which the ’f’ was slanted backward by only .00025 inches. The Linotype drawing office, he said, felt that sometimes the f looked falling forward if it was straight, and a slight back slant made it look more upright. (I have a photo of a drawing with the ’i’ slanted forward by .00075.)</p>
      <p>So Goran’s practice here is close to that, though much less than a degree. </p>
      <p>edit:</p>
      <p>&gt;try estimating it via photoshop </p>
      <p>These are vectors, so the calculations are relevant to what you will get in print. The Photoshop rounding by pixel might be misleading. </p>
      <p>Oh, and the diameter of the cutter it seems to me isn’t the only factor. It might be that though they couldn’t route out a very tight radius, they could control ’wobble’ of the cutting line down to .00025. That would be relevant to something like a back slant of that dimension.</p>
