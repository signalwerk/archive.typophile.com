      <p>If you aren’t already aware, note that the lowest difference that you can visually detect in print traditionally—and this was letter press—is about 1/4 of a thousandth of an inch. </p>
      <p>So when your em is one pica,each unit is 1/6th of a thousandth of an inch. So two units—1/3 of a thousandth of an inch is the lowest detectable slant, if it is indeed detectable in one 12 pt type. When you go down to 10 point, the slant of 2 units won’t be detectable at all, by this standard.</p>
      <p>In display sizes, you will see it. </p>
      <p>I’m not saying don’t do it, but I thought it might be useful to you to know the limits, if you weren’t aware already.</p>
