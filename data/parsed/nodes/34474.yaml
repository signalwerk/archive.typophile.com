      <p>&gt;Where did you get that number? </p>
      <p>This is what I saw in at the Museum of Printing in their Mergenthaler Linotype library. In their measured drawings they would go down to quarters of a thousandth, but not below that—IIRC that’s what Larry Oppenberg told me.</p>
      <p>&gt;ink bleed one mil (1/1000 inch) and<br>
      that’s very easily visible.</p>
      <p>1/4 of a thousandth is of course four times smaller, and that, they assume, is visible. It’s below that amount they didn’t bother with. </p>
      <p>Now that I think of it, that limit might have been their limit control over the pantographic punch cutter, and not the limit of what the eye can see.  </p>
      <p>So I may be wrong and you can go finer. I still suspect you are near the visible limit with two units in a 1000 unit em at 12 points—particularly when you are not talking about stem width but with a 2 unit slant over a distance of say 400 units. </p>
      <p>If I’m doing my math right, then Goran’s slant—if this is at x-height—is about the same as Syntax’s, which is 1/2 of a degree. And that you can feel rather than see at text sizes, right? So I would think that’s about the detectable limit. If this is at cap height I think you might not see it at 12 point.</p>
