      <p>“Are you saying that Font Audit doesn’t identify and place extrema accurately?”</p>
      <p>FontLab also has the feature allowing you to select outlines, or bunches of characters, and apply the “add points to extrema” function. This is the function that seems petulant in that it simply won’t add a point if the extrema isn’t really obvious. A case like Goran’s is exactly what FL won’t reliably handle. Using the FontAudit function might be more accurate (if so, why?), but it would take a lot longer, since you have to step through the glyphs. </p>
      <p>Fontographer had a magical ability to clean up points and add points to extrema without mangling the intended shape, and it does this operation on any number of outlines you want. Someday....  ;)</p>
      <p>Goran, I think you found the best solution. It allows you to apply hinting, which you can control somewhat, without changing the original design. I like this as an example of maintaining fidelity to a design; getting PS outlines to obey the drawings, not the reverse.</p>
