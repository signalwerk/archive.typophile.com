      <p>I was wondering when Goran’s actual question would be addressed...  :/ Nice swordfight though!</p>
      <p>Goran, you should probably read up on hinting to get a sense of how it works and what will happen in a case like yours. I hope you are solving this problem before drawing the whole character set; that is the wise thing to do. It’s difficult to predict results until you test things out; the only guess I have is that autohinted stems will appear thinner than they are at low res. Still, hinting tools will give you an opportunity to choose the preferred stem weights, so undesirable thinning would not have to occur.  Are you interested in hinting (consistent stem weights at low res/small sizes)? If not, either method of construction you show should be fine, since they both give the shape you want. </p>
      <p>If hinted performance is a major concern, I suggest you change the construction so that there are points on extrema. The simplest way to do that would be to add them to your simpler stem (shown on the right in your first image). Unfortunately FontLab is not good at doing this automatically; if you could use Fontographer to “add points to extrema” automatically, it would be quick and pretty accurate. Then you wouldn’t have to re-draw each stem. </p>
      <p>For other examples of slightly angled stems see Eras, which has flared stems as well, and Syntax, whose stems are not flared. </p>
      <p>It hasn’t been mentioned, and you seem certain of the need for this slight angle in the stems, but have you examined whether the angle is really necessary? Could you instead get a leaning effect by making the flares asymmetrical? You could also massage the shape slightly so that you don’t need any additional points; if the top left and bottom right corners had bezier handles that are perfectly vertical. This image shows that construction and its filled appearance.</p>
      <p></p><div class="imageWrap"><img src="/files/tapers_4573.gif"></div><p></p>
