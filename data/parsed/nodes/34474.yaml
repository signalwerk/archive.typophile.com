      <p>William —</p>
      <p>.00025 inch was the finest machining tolerance that Mergenthaler Linotype Co. worked to. This was, of course, a very precise tolerance at that time. The company made a big deal about it. And I recall reading an article about MLCo. precision being touted in an engineering newsletter (<cite>The Scovill Standard</cite>).</p>
      <p>But I don’t know if you can extrapolate from this tolerance anything about limits of human visual detection. </p>
      <p>I’m not sure if the pantographic cutter had anything to do with that lower limit. I believe the cutter was probably the primary device in the manufacturing and machining process. But I don’t know if it was the limiting factor. I suppose that .00025 may have been the diameter of the smallest cutter. But this would take research to confirm.</p>
      <p>— K.</p>
