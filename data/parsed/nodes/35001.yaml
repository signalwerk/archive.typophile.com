    html: |-
      <p>Also, the shaping and rasterization can be optimized in various ways. When I developed the contextual OpenType features for Zapfino Extra Pro, I noticed great performance differences between Notepad and InDesign. The same *large* amount of text took a very long time to initially render after pasting it into both Notepad and InDesign. But once first rendered, page switching and scrolling was fast in InDesign but still very slow in Notepad. This was most likely because InDesign was caching the glyph ids and their positions, and rerun the OpenType Layout shaping only when necessary (when a reflow occured), while Notepad did not have any chaching mechanism so it executed the OpenType code practically at every screen referesh. </p>
      <p>A.</p>
