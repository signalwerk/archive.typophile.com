    html: |-
      <p>I’ve seen different interpretations of term ’rendering’: from glyph rasterization to text layout of entire document. You may want to clarify what you actually is trying to measure. </p>
      <p>Largely, rasterization speed is independent from text shaping performance using OpenType layout tables. Complexity of the script may require complex layout tables by itself. There are also fonts for simple scripts where designer planned for rich set of contextual forms or complex positioning rules, e.g. Segoe Scrtipt, Bickham Script Pro, or SBL Hebrew. However, this does not automatically mean exteremly complex outlines.</p>
    html_clean: |-
