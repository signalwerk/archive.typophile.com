    html: |-
      <p>I on purpose decided not to touch area of higher level text formatting code in my previous mail. There are two many things that can be measured or optimized for. This includes paragraph formatting, whole document pagination, automatic layuot, editing, scrolling, time to first page on screen/printer, WYSIWYG quality, memory consumption, loading time etc. You may prioritize and address different issues above and get different feel about application performance.</p>
      <p>Let’s, for example, compare Notepad and WordPad. Notepad is much faster than Wordpad in shapng simple text (i.e. finding linebreaks within a the paragraph) and so, finishes formatting faster. But Notepad will not do anything, even drawing first lines, until whole document is formatted. Since it is frequently used to view huge log files, it takes seconds, sometimes minutes. Wordpad draws first page as soon as it is ready and allows scrolling while formatting for the rest of the document continues in the background.  Which one you think is percieved to be faster?</p>
      <p>I’ve seen enough performance problems on all levels of text stack, each of them made overall speed times or even orders of magnitude slower. I remeber Notepad(i.e. Uniscribe) in Windows 2000 drawing Indic text one line per second, now it is hundreds times faster. I know higher level components and applications that had been made 30+ times faster without changing a line in Uniscribe.</p>
      <p>Things are, font designer can affect basic things on font-facing text formatting level and rasterization. And I think it is safe to assume that faster font is, faster application works :). But all tricks and optimiaztion within application make it hard to measure performance of the font itself. This is why I like Notepad, it is absolutely straightforward, predictable, pure Uniscribe+GDI client, with basically no additional functionality beyond that. I am sure InDesign is much more advanced and performant in terms of formatting, cachig and screen rendering. But this is what makes Notepad a great tool for testing functionality and preformance of both Uniscribe and fonts. </p>
      <p>Thanks,<br>
      Sergey</p>
