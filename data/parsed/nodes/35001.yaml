      <p>When you consider the real-time refreshing of gobs of small text in a layout app (especially on a typical third-world computer), it can matter. I believe rendering performance is why for example InDesign’s optical spacing is (still?) based on a bilinear model as opposed to a more ideal fully-smooth model. Performance is also the reason MS has recommended Em-sizes that are powers of 2 (although some people dispute the latter-day relevance of this). And this is all in the realm of Latin, which is way less complex than Urdu for example.</p>
      <p>hhp</p>
