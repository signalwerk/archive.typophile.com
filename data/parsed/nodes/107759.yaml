    <p>If you need me to prove anything I write here,<br>
    I can do so. </p>
    <p>I am looking for certain fonts for personal,<br>
    non-commercial use. I am not a designer.<br>
    I am not an artist. I do not offer anything<br>
    I create on my computer for sale. </p>
    <p>Nor will I ever earn any money as a designer.  </p>
    <p>I am not a student. </p>
    <p>I have no business. I am disabled, and receive<br>
    food stamps. I hope someday soon to change<br>
    this status. </p>
    <p>I draft personal letters. I am attempting<br>
    to get one of my business ideas or one of<br>
    my ideas to better the world off the ground. </p>
    <p>I am just trying to promote myself, my<br>
    services, and my ideas. Nothing I offer has<br>
    anything to do with design. </p>
    <p>I seek fonts to create brochures, flyers, and<br>
    business cards for a one-man air conditioning<br>
    business I hope to start, and possibly other<br>
    businesses I hope to start.  I am not worried<br>
    anyone is going to sue me.  I have no money,<br>
    and own nothing of value. </p>
    <p>I am just struggling to make enough money to<br>
    eat and pay my rent. </p>
    <p>This being the case, I am looking for fonts that<br>
    will make my resume, and my promotions<br>
    stand-out.</p>
    <p>I use MS Word Home &amp; Student 2010. This is<br>
    not exactly the software a professional designer<br>
    would use.</p>
    <p>I seek the following fonts: MinionPro, Myriad,<br>
    Helvetica, Frutiger, Univers, Mrs. Eaves,<br>
    Garamond Pro, Interstate, Gotham,<br>
    Avant Garde, Avenir, Futura, Akzidenz Grotesk,<br>
    Optima, Bembo, Din, Kabel, Officina, and<br>
    Thesis, Sabon, Stone, Agenda, Cezanne,<br>
    Didot. </p>
    <p>I have never used these fonts, and I don't<br>
    even know what many of them look like.<br>
    I seek these fonts because in my research<br>
    on fonts, I have come across these names<br>
    quite a bit as far as fonts I can use for the<br>
    purposes I wrote above. </p>
    <p>I wrote a book on air conditioning. Can you<br>
    recommend a serif and non-serif font for the<br>
    book? When I am ready to publish the book,<br>
    I may be able to buy these two fonts.</p>
    <p>Can you recommend a font for business letters<br>
    that would impress others? </p>
    <p>I do my own legal work. Can you recommend<br>
    a font for motions and briefs? </p>
    <p>I have a high IQ, and a lot of talent. I should<br>
    be able to support myself, but I also have<br>
    several crippling disabilities. </p>
    <p>Any help you can give me would be<br>
    appreciated.</p>
    <p>Thank you very much.</p>
