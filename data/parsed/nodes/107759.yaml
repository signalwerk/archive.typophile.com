      <p>For me, you don't need to be a specific person to do specific things. As long as you're willing to do it, then you can most likely find a way to make it. And do not be afraid to fail, for everybody has failures in life, especially the first time.<br>
      And in your case, since that you GOT a lot of talent, for the love of God, use it! You'll only live once, so don't let your talents rot in vain.</p>
      <p>Now, since that you have a very high IQ, I'm sure you already realized that people tend to buy useless stuffs just because they want it. Those impractical decisions for temporary satisfaction is a significant thing that makes us humans, is it not? :)<br>
      I don't think it's such a big issue if you sometimes set aside the essentials to buy something you want. It's impractical, yes, but not completely stupid, imo.</p>
      <p>So if you have the chance to buy some of the fonts you seek, then go for it.</p>
      <p>But I highly encourage you to attempt to make your own fonts. And it's also a privilege, because since you are the designer, you can make it fit perfectly to your own taste and style, without any kind of disrespect.</p>
