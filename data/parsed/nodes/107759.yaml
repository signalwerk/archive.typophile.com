    html: |-
      <p>1. The last time I looked the Avenir font package cost several thousand dollars. </p>
      <p>2. I asked if any of you could recommend any fonts for certain specific applications.<br>
      2a. None of you answered even one of these questions.</p>
      <p>3. When someone downloads a font they would never buy because they<br>
           can't afford the font, no one loses one penny, and the world benefits. </p>
      <p>4. In any event, I am pretty sure I read somewhere the actual artists and<br>
           designers make very little money from the sale of their fonts. All the<br>
            money goes to people who exploit the creative talent of the actual<br>
            font designers. </p>
      <p>5.  I doubt any successful designer would care that I used their font<br>
            for the purposes I intended to use them.  I presume if they knew<br>
            me and knew my situation, they would permit me free use of their<br>
            font for the use I intended. If I had someway of contacting the<br>
            actual font designers, I would write them a letter and ask them<br>
            myself. </p>
      <p>6.  I am not a designer, nor do I ever intend to become a designer. </p>
      <p>7.  I went to all the foundries and asked if I could buy a package of<br>
            fonts I wanted for personal use at a reasonable cost, and they<br>
            were all pretty nasty. They had no interest in doing business with<br>
            me.  None of these foundries makes these fonts available to the<br>
            public for personal use at a reasonable price. </p>
      <p>7.   I am not familiar with the exact procedures people use to acquire<br>
             software or fonts that are normally sold.  I will ask a friend of mine<br>
             who is an expert with computers to obtain the fonts I seek from<br>
             Pirate Bay or some other file sharing web site. I just visited Pirate<br>
             Bay, and it seems I can get all the "commercial" fonts for free not<br>
             just the ones I was looking for.</p>
      <p>8.   I will make sure all the effort I put into this pursuit is not wasted.<br>
             It is ashame I am going to have to take this route. The more I<br>
             sour on humanity, the less I care about others. </p>
      <p>9.   If the designers of successful commercial fonts really had a<br>
             conscience, they would help new designers get fairly compensated<br>
             for their efforts. All hugely successful font designers just care<br>
             about are themselves, or they would sponsor the creation of a<br>
             fairer system.</p>
      <p>I am not a material guy. If I had carried about making money, I could<br>
      have been a wealthy a long time ago. All my life I have helped<br>
      everyone who has ever asked me for help. My not being able to earn<br>
      a living now is not just hurting me, it hurts US taxpayers. I could paying<br>
      taxes instead of having to rely on your taxes to pay my basic expenses. </p>
      <p>At one point in my life, I could have discovered a cure for cancer or<br>
      made a significant contribution to mankind's energy needs. But our<br>
      society makes it hard for talented people to realize their potential. </p>
      <p>Humans are a foolish species. They think life is a zero sum game.<br>
      Instead of trying to help each other, they seek to take advantage of<br>
      each other. </p>
      <p>As far as fonts not being able to be copyrighted in the US, I believe that<br>
      "MS Segoe UI" is a knock-off Frutiger. Frutiger sued MS in Europe and<br>
      won, but lost in the US because in the US fonts can't be copyrighted.</p>
      <p>So, I wanted to know if their were high-quality knockoffs of the fonts<br>
      I listed.</p>
      <p>US laws in general are designed to protect corporations and those<br>
      who can afford lobbyists.  US patent laws don't protect poor US<br>
      inventors. Bill Gates was able to rip-off Gary Kildall.  John Pierpont<br>
      Morgan ripped-off the original Tesla and Westinghouse.  The only<br>
      people able to get justice in our legal system are people who already<br>
      have money. Even the Wright Brothers were not able to benefit from<br>
      their discovery of the airplane. And you care about wealthy designers<br>
      who wouldn't lose one penny from my personal use of their fonts? </p>
      <p>I am sorry I came here asking you for help. I won't be back. There<br>
      was a time I would not have thought twice about risking my life to<br>
      help any human, or thought twice about giving the shirt off my back<br>
      to help anyone truly in need.  Now as time passes, I can't stop myself<br>
      from inwardly smiling every time a fellow American is a victim of<br>
      crime or suffers some loss. </p>
      <p>I am not happy with the person I am becoming. I wish I had a way<br>
      to stop it. It has nothing to do with no one here helping me with my<br>
      request. It has to to with the general nature of human beings today. </p>
      <p>I wish all of you the very best. I hope none of you ever run into<br>
      anyone like the person I may eventually become against my will.<br>
      I really hope I don't become that person, because that would be<br>
      the opposite of everything I have fought for my entire life. </p>
      <p>Once again, my reaction here has nothing to do with your lack of<br>
      of help.  Fonts don't have that kind of importance to me. I won't<br>
      miss them, if I don't get them. What bothers me is the selfish world<br>
      we live in today; how no one is willing to help anyone else in desperate<br>
      straits.  Helping someone with fonts is a trivial, but even something<br>
      so little as help with fonts is hard to come by these days. </p>
      <p>I hope someday someone distributes all your precious commercial<br>
      fonts free so all members of the public have free use of them. After<br>
      seeking your help here, that is the feeling I come away with.</p>
