      <p>&gt; I am not a designer....<br>
      &gt; I am looking for fonts that will make my resume,<br>
      &gt; and my promotions stand-out.</p>
      <p>I'm a professional graphic designer, and my advice would be to just make good use of the fonts you already have on your computer.  You don't need a bunch of new fonts to "stand out", you need simple, clean, easy-t0-read layouts that clearly communicate your qualifications and info about your company. </p>
      <p>Most small businesses that can't afford designers have awful-looking literature. Just use clean, simple, readable designs and you'll be fine.</p>
      <p>And as others have said, there are tons of free fonts available.</p>
