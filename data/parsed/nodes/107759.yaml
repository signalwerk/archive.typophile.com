      <p><em>" The last I heard fonts can not be copyrighted or patented in the US. Designers just want fonts to be expensive so they remain in their exclusive domain."</em></p>
      <p>1. The font design cannot be copyrighted but the underlying code which makes up the font is. Designs can be patented but it is quite costly.<br>
      2. Designers make a pittance in most cases. Exclusivity has nothing at all to do with it.</p>
      <p>Every single font you listed above is a commercial font and they are not "free for personal use". Never have been, never will be.</p>
      <p>Fonts today don't cost "several thousand dollars", as you put it. The vast majority are less than $50.</p>
      <p>Typophile is definitely not the place to be asking for free commercial fonts. As another poster said, there are many free fonts available today, and some are excellent quality.</p>
