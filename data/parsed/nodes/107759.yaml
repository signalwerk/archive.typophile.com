      <p>I think that we're pretty much in very similar situation. Except that: I'm NOT very talented and my IQ is just average (around 90-105). I may not be physically disabled, but man, I'm one of the MOST unluckiest people in the world. :(</p>
      <p>Like you, there are fonts that I seek too like: Compatil Exquisit, DTL Dorian, FS Sally, and Optima Nova. I don't just seek them. In fact, I crave for those stuffs so bad! And I can't even afford any of them, which sucks a big time for me.</p>
      <p>So out of desperation, instead doing something like this, I have decided to do the other way around. To design a font for my personal typing and printing pleasure, as well as to somehow fill the gap.</p>
      <p>Here's my progress so far.<br>
      I'm yet to make the italic by next week (hopefully), so I can only show you the roman characters.</p>
      <p><img src="http://i1288.photobucket.com/albums/b499/iamdead324/smpl-spcmn_zps5bbb2c05.jpg" border="0"></p>
      <p>This is actually my second attempt, because my first one, which I made on May, this year(2013), is a complete disaster. XD</p>
      <p>In text usage @ 48pt:</p>
      <p><img src="http://i1288.photobucket.com/albums/b499/iamdead324/smpl-txt-1_zpsef032920.jpg" border="0"></p>
      <p>@ 72pt:</p>
