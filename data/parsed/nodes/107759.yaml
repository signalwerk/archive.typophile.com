      <p>Bizzare discussion.<br>
      Might indeed be a troll, or just misguided.<br>
      There are many good quality fonts that are freely distributed by designers. With careful selection from them you can produce pretty good results. If you are looking for such fonts Dafont and Font Squirrel have a better record of purging pirated fonts than most other sites. A good way is to learn the names of designers who have produced good quality fonts for free distribution. For example check out the work of Claude Pelletier, Nick Curtis or  Pablo Impallari.<br>
      I you really have a high IQ -- I doubt that I have -- you could learn to make fonts. It's nice to have a commercial program like FontShop, but far from essential.<br>
      Most font designers are far from rich. For every commercially successful font maker there are many "starving artists."  Stealing from them is an insult.<br>
      Don</p>
