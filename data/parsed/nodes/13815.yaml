    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Meta</strong></p>
    <p><img src="http://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/FFMeta.svg/396px-FFMeta.svg.png" img=""></p>
    <p><a href="/wiki/PT%2055" class="freelinking" rel="nofollow">PT 55</a>, the design that would later become FF Meta, was devised by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> for the German Post Office (Deutsche Bundespost) in 1985. The Post Office, who was using <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> at that time, cancelled their commission at the last minute. Spiekermann's design went into hibernation. Interestingly enough, the post office did eventually change their corporate face—to <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a>, which they still use today.</p>
    <p>Around the same time as the founding of <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop</a>, Spiekermann and several of his colleagues revived their dormant design, creating FF Meta, whose first weights were released in 1991. Over the next 15 years, numerous more weights would be devised. </p>
    <p>FF Meta is named after the studio which Spiekermann headed at the time, <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a>.  Meta is proud of the face, calling it the <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> of the '90s (quote attributed to Robin Kinross). Meta was designed for use at smallish sizes, but became more widely used by designers looking for a workhorse typeface with range.</p>
    <p><a href="http://www.fontshop.com/fontlist/families/ff_meta/" rel="nofollow">FF Meta</a> is part of FontShop International's <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> library.</p>
    <p>More history: <a href="http://www.fontshop.com/fontfeed/archives/meta-morphosis-how-ff-metaplus-became-ff-meta/" rel="nofollow">How FF MetaPlus Became FF Meta</a></p>
    <p>See also: <a href="/wiki/FF%20Meta%20Serif" class="freelinking" rel="nofollow">FF Meta Serif</a></p>
    <p><strong>Foundry:</strong><br>
    <a href="http://www.fontfont.com/fonts/meta" rel="nofollow">FontFont</a></p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/52083" rel="nofollow">What category would you classify Meta, Scala, and Thesis?</a></p>
