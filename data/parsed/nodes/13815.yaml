  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span>&nbsp;Meta</strong></p>
    <p><a href="/node/15648" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">PT</span> 55</a>, the design that would later become <span class="caps">FF</span> Meta, was devised by <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> for the German Post Office (Deutsche Bundespost) in 1985. The Post Office, who was using <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> at that time, cancelled their commission at the last minute. Spiekermann’s design went into hibernation. Interestingly enough, the post office did eventually change their corporate face—to <a href="/node/13517" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger</a>, which they still use&nbsp;today.</p>
    <p>Around the same time as the founding of <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a>, Spiekermann and several of his colleagues revived their dormant design, creating <span class="caps">FF</span> Meta, whose first weights were released in 1991. Over the next 15 years, numerous more weights would be&nbsp;devised. </p>
    <p><span class="caps">FF</span> Meta is named after the studio which Spiekermann headed at the time, <a href="/node/15651" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MetaDesign</a>.  Meta is proud of the face, calling it the <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> of the ’90s (quote attributed to Robin Kinross). Meta was designed for use at smallish sizes, but became more widely used by designers looking for a workhorse typeface with&nbsp;range.</p>
    <p><a href="http://www.fontshop.com/fontlist/families/ff_meta/"><span class="caps">FF</span> Meta</a> is part of FontShop International’s <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> library.</p>
    <p>More history: <a href="http://www.fontshop.com/fontfeed/archives/meta-morphosis-how-ff-metaplus-became-ff-meta/">How <span class="caps">FF</span> MetaPlus Became <span class="caps">FF</span>&nbsp;Meta</a></p>
    <p>See also: <a href="/node/39283" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Meta&nbsp;Serif</a></p>
    <p><strong>Foundry:</strong><br><a href="http://www.fontfont.com/fonts/meta">FontFont</a></p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/52083">What category would you classify Meta, Scala, and&nbsp;Thesis?</a></p>
