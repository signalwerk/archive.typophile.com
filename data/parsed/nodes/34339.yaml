    html: |-
      <p>In order to get a receipt, you need to buy something first ;-p<br>
      But since I don't really have anything to sell, I made a few pangrams for you to see the font in use.<br>
      Hope it's still legible...<br>
      The trickiest letter was probably the M since I was working on a grid of 4x5 and had to figure out a way to include the middle vertex (for the W, I just flipped the M for my own convenience). The I was also a bit of a challenge getting it wide enough, but I like the floating dot at the left (which -again- i redid for the J, except this time at the right side)... It gives it an extra Japanese feel &amp; remains monospaced.</p>
