    votes: 0
    html: |-
      <p>OK, I've added another alphabet, but I had ligitimate reasons to do so. I was playing around with the different fonts &amp; put them all on top of eachother with transparancy. This gives a really cool effect, so I wanted to do the same with colours... The obvious choice for my colour range was CMY &amp; RGB, but for that I was one alphabet short. I could've just left one colour out ofcourse, but I just couldn't decide which one plus this has been a really fun thing to do, making foreign receipts within the parameters of a 4x5 pixel limit. I'd actually like to do some more, but so far the only alphabet I can think of still doing is Arabic which would give me problems making it look that way. Arabic script is very stretched &amp; with a 4 pixel width limit (of which you need at least 3 pixels to make a letter recognisable) there's not much left to stretch ;-)<br>
      Any suggestions for strange alphabets are welcome ofcourse. The ones I've got so far (in case it's hard to tell) are: a regular one, Japanese, Greek, Russian, Indian &amp; Celtic.</p>
