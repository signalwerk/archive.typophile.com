    html: |-
      <p>After the Japanese receipt font, I figured I should do a regular one as well. Now I've ended up with 4 receipt fonts (each of which has 3 variations; a full version, a dotted version &amp; a pixel version). Since the numbers &amp; symbols are quite universal, I've used the same ones for each font &amp; for the same reason (and a little laziness on my behalf maybe) I've also reused certain characters for different fonts (how much can you really do with a 4 by 5 pixel limit anyway?). I still think I've managed to capture the characteristics of the foreign alphabets for each font, but as a test I'll leave it up to you to name them ;-)<br>
      BTW, I àm aware of the fact that the regular M looks a lot like an N, but once set in text, it actually seems to read as an M (trust me, I was as surprised as you are ;-p )</p>
