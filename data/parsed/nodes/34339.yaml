    <p>I know there's a lot of Japanese inspired fonts out there &amp; a lot of receipt like fonts, but I thought it would be nice to combine them. I've made a monotype font (for the receipt look) with Japanese inspired characters... Kind of what I imagine a receipt in Tokyo might look like ;-)</p>
