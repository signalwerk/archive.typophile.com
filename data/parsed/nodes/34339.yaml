      <p>Thanks, I posted a good title as a reason to start a new typeface in a different thread (posted by Bald Condensed I think)... I've made quite a few changes by now, but since I'm working on an antique computer (OS 9.1, go figure) I can no longer upload images on Typophile since they've upgraded... I àm however collecting a bunch of stuff to post here on an USB-stick &amp; am planning to post it on a friend's computer one of these days. So keep your eyes open ;-)<br>
      It makes a really cool effect when using all different DBTT-typefaces in different colours &amp; transparancies on top of eachother. I've been quite busy lately &amp; I've got some nice things up my sleeves that I think will get some raving responses, but I still need to find the time to get organized &amp; a good friend who'll let me use his/her computer to upload all my new stuff. But I promise -with the risk of sounding cocky- that'll be worth the wait ;-)<br>
      If you like this name, you'll proçbably also enjoy "Hack the Pony" which I derived from one of my favourite series "Smack the pony" ;-)</p>
