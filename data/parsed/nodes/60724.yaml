  html: |-
    <p>This is super lovely work by Mucca Design printed by Studio on Fire. Less is truly more because this simple design needs no more or less— it’s perfect!</p>
    <p><a href="http://www.beastpieces.com/2009/03/ocean-house-stationery-mucca-design/_0003_mucca_oceanhouse_business_card/" title="http://www.beastpieces.com/2009/03/ocean-house-stationery-mucca-design/_0003_mucca_oceanhouse_business_card/">http://www.beastpieces.com/2009/03/ocean-house-stationery-mucca-design/_...</a></p>
    <p>Do you know the fonts? At first I thought the nameplate was set in Clifford, but this font is a little more narrower. The others are too small for me to recognize. I’m not that good with the classics. I was thinking something like Kis or Freight or Alisal.</p>
    <p></p><div class="imageWrap"><img src="/files/_0005_mucca_oceanhouse_logo_4010.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/_0003_mucca_oceanhouse_business_card_4260.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/files/_0004_mucca_oceanhouse_detail_4481.jpg"></div><p></p>
    <p>Mikey :-)</p>
