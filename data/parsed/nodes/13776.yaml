    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Mid-Capitals</strong></p>
    <p>Mid-capitals (also called medium capitals) are a larger form of <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small capitals</a>.</p>
    <p>By strict definition <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small capitals</a> (or small caps) come to the top of the <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a> of their <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">roman</a> counterparts. Designers’ aim with mid-capitals is to make the small caps slightly larger so that the overall difference between the small caps and the roman, in a given setting, is more subtle and therefore more unified. Mid-caps then simply refers to striking a balance somewhere between the x-height and the <a href="/node/20273" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">cap height</a>.</p>
    <p>The term mid-capitals could be the nitpick of purists to simply put a name on slightly enlarged small caps to run more cohesively in text. Some would argue that it is therefore appropriate (and more practical) to refer to what might technically be mid-capitals as a variant on small&nbsp;capitals.</p>
    <p>In recent years mid-capitals are becoming more common, especially for types that are geared toward use at smaller sizes. Some designers believe that at smaller sizes a less noticeable difference between the roman and the small capitals is&nbsp;desirable.</p>
    <p>The <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> specification admits the <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a> feature <a href="http://www.typophile.com/node/33993" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">smcp,c2sc</a> and a petite caps feature <a href="http://www.typophile.com/node/33993" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">pcap,c2pc</a>.  Fonts providing both often have petite caps that match the <a href="/node/12028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">x-height</a> while the <a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">small caps</a> are somewhat larger, thus filling the mid-caps&nbsp;role.</p>
    <p><strong>See Also:</strong><br><a href="/node/12027" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Small Capitals</a>, <a href="/node/14255" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">SmallCaps&nbsp;How-To</a></p>
