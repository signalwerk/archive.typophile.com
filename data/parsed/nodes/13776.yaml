    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Mid-Capitals</strong></p>
    <p>Mid-capitals (also called medium capitals) are a larger form of <a href="/wiki/Small%20Capitals" class="freelinking" rel="nofollow">small capitals</a>.</p>
    <p>By strict definition <a href="/wiki/Small%20Capitals" class="freelinking" rel="nofollow">small capitals</a> (or small caps) come to the top of the <a href="/wiki/X-height" class="freelinking" rel="nofollow">x-height</a> of their <a href="/wiki/Roman" class="freelinking" rel="nofollow">roman</a> counterparts. Designers' aim with mid-capitals is to make the small caps slightly larger so that the overall difference between the small caps and the roman, in a given setting, is more subtle and therefore more unified. Mid-caps then simply refers to striking a balance somewhere between the x-height and the <a href="/wiki/Cap%20Height" class="freelinking" rel="nofollow">cap height</a>.</p>
    <p>The term mid-capitals could be the nitpick of purists to simply put a name on slightly enlarged small caps to run more cohesively in text. Some would argue that it is therefore appropriate (and more practical) to refer to what might technically be mid-capitals as a variant on small capitals.</p>
    <p>In recent years mid-capitals are becoming more common, especially for types that are geared toward use at smaller sizes. Some designers believe that at smaller sizes a less noticeable difference between the roman and the small capitals is desirable.</p>
    <p>The <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> specification admits the <a href="/wiki/Small%20Capitals" class="freelinking" rel="nofollow">small caps</a> feature <a class="freelinking external" href="http://www.typophile.com/node/33993" rel="nofollow">smcp,c2sc</a> and a petite caps feature <a class="freelinking external" href="http://www.typophile.com/node/33993" rel="nofollow">pcap,c2pc</a>.  Fonts providing both often have petite caps that match the <a href="/wiki/X-height" class="freelinking" rel="nofollow">x-height</a> while the <a href="/wiki/Small%20Capitals" class="freelinking" rel="nofollow">small caps</a> are somewhat larger, thus filling the mid-caps role.</p>
