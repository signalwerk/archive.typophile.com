  html: |-
    <p>I bought the <a href="/wiki/Luxury" class="freelinking" rel="nofollow">Luxury</a> set which I really like but I hate not having any choices for weight. Now I realize how dependant I have become to choose different weights depending on compositions and not having choices is really annoying. Does anyone know if they are planning on releasing different weights ever?</p>
    <p>Or if the fonts were going to be used for a logo, how hard do you think it would be to give them more weight by hand?</p>
