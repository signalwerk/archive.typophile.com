    html: |-
      <p>The only TrueType fonts required by Windows XP are:</p>
      <ul>
      <li>Marlett (hidden by default)
      </li><li>Tahoma
      </li><li>Tahoma Bold
      </li><li>Microsoft Sans Serif
      </li><li>Franklin Gothic Medium
      </li><li>Franklin Gothic Medium Italic</li></ul>
      <p>If you remove any of the above fonts, Windows XP will automatically restore them within a few seconds.</p>
      <p>In addition to those, I recommend that you keep at least the following fonts installed:</p>
      <ul>
      <li>Arial (all four fonts: Regular, Bold, Italic, and Bold Italic)
      </li><li>Times New Roman (all four)
      </li><li>Courier New (all four)
      </li><li>Symbol
      </li><li>Wingdings</li></ul>
      <p>For Web browsing, you'll probably want to keep the rest of the families included in the Microsoft Core Fonts for the Web:</p>
      <ul>
      <li>Andale Mono
      </li><li>Comic Sans MS
      </li><li>Georgia
      </li><li>Impact
      </li><li>Trebuchet MS
      </li><li>Verdana
      </li><li>Webdings</li></ul>
      <p>That covers Windows XP. Pretty soon, though, we'll be seeing a lot of the new fonts that come with Windows Vista and Office 2007. Of those, the most crucial font families are Segoe UI (the new default interface typeface in Windows Vista) and Calibri (the new default typeface in Word, Excel, and Outlook).</p>
      <p>Edit: Well, looks like I was a little too slow. The <a href="http://graphicssoft.about.com/od/aboutgraphics/a/fontoverload_3.htm" rel="nofollow">article</a> linked to by Gus Winterbottom covers the basics fairly nicely (though not 100% accurately).</p>
