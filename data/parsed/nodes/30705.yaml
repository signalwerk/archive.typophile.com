    <p>I'm looking for a definitive list of system fonts that are required for Windows (XP). Currently, my Windows Fonts folder is filled with almost 500 individual files and I know I don't need to have that many fonts loaded at once. I currently use Suitcase 9.2 to manage my fonts and I've noticed some conflicts with preloaded fonts and when I activate/deactivate fonts. </p>
    <p>I came across this topic : <a href="http://typophile.com/node/9071" title="http://typophile.com/node/9071">http://typophile.com/node/9071</a> and have since removed all the fonts from .../program files/common files/adobe/fonts...</p>
    <p>Does anyone have any information? I know enough to keep my web fonts, but what systems specific fonts do I need to keep?</p>
