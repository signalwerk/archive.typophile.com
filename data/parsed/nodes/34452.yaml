      <p>the website is:<br>
      <a href="http://www.neonmuseum.org/" title="http://www.neonmuseum.org/">http://www.neonmuseum.org/</a></p>
      <p>the museum is a work in progress. they’re actually quite ambitious with what they are trying to do in rescuing some of the old lighted signs that once lived on the vegas strip. Most of the stuff is just piled around and it’s hard to get good shots of some of the stuff, so you hafta be creative. i think it’s well worth a visit, but you have to try to schedule in advance as tour slots are extremely limited and fill up fast. you can schedule online or call, but you may need to follow up if you don’t hear back from them, as i almost didn’t get to go (again) because they didn’t call back after we registered online.</p>
