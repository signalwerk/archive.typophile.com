      <p>Actually the level of quick, lucid evaluation and self-discipline required to beat roulette (because, unlike most any other form of gambling, it can be beat) is quite humbling. I’ve tried a few times, and always exhausted myself mentally (although one time the <cite>instant</cite> I quit my “magic number” came up!) It’s really quite refreshing in a strange way.</p>
      <p>The thing is though self-discipline is not enough: you also need a good deal of money that you’re not too attached to - something I’ve never managed. But the romance of possibly beating a machine is worth a little bit of waste. However things like the lotto, slots, etc. are definitely not for me. That “Deal or No Deal” show makes me nauseous.</p>
      <p>hhp</p>
