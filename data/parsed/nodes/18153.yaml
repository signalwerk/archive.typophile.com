    <p>Hey all</p>
    <p>Here is a logo I designed for my firm and I wanted to get some feed back from everyone here.  Now before you all say it; Yes, I know that the scales of justice is one of the most overused legal images but my first name is Troy and I like that the scales evoke the image of an uppercase T.  </p>
    <p>I wanted a logo that was fairly coservative but with a contemporary feel.  I would be open to adding some color for a little punch, but nothing excessive.  I also wanted a logo that even from a distance would let you know that it belonged to a law firm.  I have seen a lot of really visually appealing law firm logos that didn’t give you any indication of whether the company was a law firm or a theme park.</p>
    <p>Thanks for all of your help in advance.</p>
    <p>(I could not get the image to load on the page, if anyone knows how I can do this please let me know.)</p><div class="imageWrap"><img src="/files/Hough Logo.jpg"></div><p></p>
