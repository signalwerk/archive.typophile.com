    html: <p>Troy, please don’t take offense to this, but I would think that if you’re practicing law, you can afford to hire a graphic designer to design a proper logo for you. I will say that the logo is not “bad” per se. You’ve done a decent enough job, but it certainly does not look any different than hundreds of other law firm logos out there. Good luck.</p>
