      <p>Well, it looks like every other legal related logo on the planet. Now, that isn’t necessarily bad. The scales have become the universal symbol for ’lawyer’ so if you are looking for people that need a lawyer that are just walking down the street, then hanging that sign probably makes sense.</p>
      <p>However, for business correspondence, I don’t think you need the symbol to point out the fact that you are a lawyer. As such, i’d ditch the scales altogether as it does nothing to make you unique in this field.</p>
