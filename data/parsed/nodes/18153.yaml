      <p>The scales are definitely overused although I do understand how the “t” plays in. Visually the HOUGH treatment doesn’t make sense. There’s no logic to what you’re doing with the logo to portray the difference you plan to offer your market.</p>
      <p>It does look really industrial. It looks a bit amateurish which would make sense seeing as you’re not a professional designer. If you must cut costs, i would say at least go to a design college and recruit a student looking to build their portfolio and throw them some money.</p>
      <p>It’s a good try, but there is a reason why our occupation exists.</p>
