      <p>I certainly do not plan to outright bag your design, though I do feel a need to support the above statements. Joseph is absolutely correct when he states <em>there is a reason why our occupation exists</em>; as there is a valuable reason why your occupation exists.</p>
      <p>At this time I do not feel that your logo sets you out from your competition in a positive manner, nor do I get a feeling of confidence, security, professionalism or excellence in your field, which as an audience member I would hope to get. I also do not feel that currently your logo depicts a contemporary enough message, rather something dated or staid.</p>
      <p>I apologise that these criticisms are so negative; however I would like to offer a suggestion that perhaps another way to keep costs down would be to find a smaller design firm or freelance graphic designer who may benefit from a trade of services for something like contract writing advice or professional services; or indeed a young graphic design student who would benefit from an appropriate remuneration agreement.</p>
      <p>Best.<br>
      -nic</p>
