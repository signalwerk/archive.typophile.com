      <p>The two versions that 'gtrianta' is mentioning have as follows: The Cannibal version, which is now used sporadically in the Greek Estia newspaper is a bit rough, and it does contain Latin characters in the same style as the Greek characters. It is not for free, one has to order it from cannibal Fonts. The Greek Font Society revilal looks much better and lighter in weight and totally for free.</p>
      <p>Eleana Ioannou</p>
