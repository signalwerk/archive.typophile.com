      <p>It's not Haas Unica either, the a in that alphabet is much curvier. It reminds me most of old British Rail signage and little known 'Airport' typeface (pretty much the same thing, I think).</p>
      <p><a href="http://en.wikipedia.org/wiki/Rail_Alphabet">http://en.wikipedia.org/wiki/Rail_Alphabet</a></p>
      <p>The s is the giveaway character.</p>
