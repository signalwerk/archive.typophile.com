  html: <p>Typeface Twin Cities Project to be Unveiled at TypeCon2003 <br> <br>BUFFALO, NY, JUNE 26, 2003 - Can a typeface communicate the unique character of a city? <br> <br>The University of Minnesota Design Institute (UMDI) invited six teams of typographers to answer that question. Each proposed a new typeface for the twin cities of Minneapolis and Saint Paul, Minnesota, as part of the Twin Cities Design Celebration 2003. <br> <br>During a special session at TypeCon2003, to be held July 17-20 in Minneapolis, invited designers Peter Bil'ak (Peter Bilak, graphic design &amp; typography/Typotheque), Erik van Blokland and Just van Rossum (LettError), Gilles Gavillet and David Rust (Optimo), Sybille Hagmann (Kontour), Conor Mangat (Inflection), and Eric Olson (Process Type Foundry) will present their concepts. The LettError team will discuss the development of the selected font, Twin. <br> <br>Employing OpenType, and based on custom software entitled the "Panchromatic Hybrid Style Alternator," LettError's Twin font offers an infinitely varied typographic menu. And, in a remarkable first, a live and reactive version can be linked via the Internet to dynamic data, so that urban conditions in the Twin Cities can visibly affect the font's appearance. <br> <br>"Metro Letters," a 144-page book documenting the project, published by the Design Institute, and edited by Typeface Twin Cities project manager Deborah Littlejohn, will be available for sale at TypeCon2003 for $29.95. <br> <br>This in-depth, illustrated publication includes transcripts from the jury process; interviews with all six typographers, highlighting their concept development; a focus on the selected font; and specially commissioned essays by design educators and critics Michael Worthington and Gail Swanlund. <br> <br>Also available at TypeCon2003 will be limited edition boxed sets of Chocoletters, a custom version of Twin created in honor of the Dutch tradition of rendering letters in chocolate. <br> <br>For further information about the Typeface Twin Cities project, contact Littlejohn at 612-624-3710, or email <a href="mailto:dlittlej@umn.edu">dlittlej@umn.edu</a>. For information about the Design Institute and Twin Cities Design Celebration, contact Janet Abrams, Director, at 612-625-9511, or email <a href="mailto:jabrams@umn.edu">jabrams@umn.edu</a>. <br> <br>TypeCon2003 is the annual conference of SOTA, an international not-for-profit organization dedicated to the promotion, study, and support of type design, typography, and the related arts. Secure online registration and further conference details are available online at <a href="http://www.typecon2003.com" target="_blank">http://www.typecon2003.com</a>. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_blank">http://www.typesociety.org</a>, or email <a href="mailto:info@typesociety.org">info@typesociety.org</a>. <br></p>
