      <p>I like it! Something slightly chafes with the bowls of the lower case a and the capital P, perhaps because they're right next to each other and of so obviously different character. Perhaps try to reduce the spur of the a slightly and make the top of its bowl meet the stem more vertically?</p>
      <p>Also, to my eye at least the straight right side of the last a makes the gray space behind it look narrower than the equivalent on the other side. Maybe that's just me. :)</p>
      <p>Oh, and does it scale okay? Have you tried printing it small? Always a risk with narrow lines.</p>
