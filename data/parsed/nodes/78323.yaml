    <p>Due to confidentiality agreements I cannot disclose the nature of the business or it's location.</p>
    <p>Hereis a concept I'm working on for a client that is modernizing, and unlike any in it's sector. They want to convey that, yet look serious, legitimate, and corporate-clean.</p>
    <p>I'm doing it with a san-serif set in unicase (custom). Screen resolution is making some of the vertical strokes appear different.</p>
    <p>Feel free to critique my kerning and character widths and anything else relating to this logo. </p>
    <p>Cheers.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Sapientia_3_4149.png"></div><p></p>
