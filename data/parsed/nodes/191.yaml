    html: "<p>OH yeah. <br>But most of it is very vague. The only guy who's <br>addressed it directly/scientifically that I know of <br>is Dutch psychologist Herman Bouma. Although he <br>hasn't written a book, he has written a number of <br>articles/papers which should be available through <br>a good university library, or at least through ILL. <br> <br>And if you don't mind referring to a <br>disreputable source you could check out <br>my piece in \"Graphic Design &amp; Reading\": <br><a href=\"http://gunnarswanson.com/GDandR/GDandR_Book.html\" target=\"_top\">http://gunnarswanson.com/GDandR/GDandR_Book.html</a> <br> <br>hhp</p>"
