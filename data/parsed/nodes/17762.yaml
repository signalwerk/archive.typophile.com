      <p>TypeTool is basically a stripped-down version of FontLab 4.6. This is a good thing because skills aquired in TypeTool will mostly apply if you move to FontLab later. FontLab has many features that or only used by a handful of users, so for a novice user it’s actually good to have a UI that’s focused on building basic, functional fonts. </p>
