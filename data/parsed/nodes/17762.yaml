    html: |-
      <p>The Ikarus V4 system represents the high end of the font production tools. It is still under development at URW++ and also available for Mac OS X / X11. The system contains a couple of graphical editors, but most modules work via the command line or via command files. The syntax used for the command files is fairly simple. </p>
      <p>A lot of the batch functionality found in the Ikarus V4 system has been ported to DTL FontMaster and is much more user friendly. For several batch functions the same Ikarus command language can be used. There is no external scripting module necessary in FM for things like the exchange of data between multiple glyph databases, placing of accents, replacement of composites, consistency checking, improving, et cetera. For many of these functions also command files can be used. The separation of the glyph data at one hand and the character naming, Unicode numbering, metrics and naming information at the other hand, which finds its origin in the Ikarus system, is a necessity for handling and controlling font data on a professional level. OpenType layout features can be easily generated for multiple fonts at once by simply selecting a Features file.</p>
      <p>In the new FM 2.5 version font importing and exporting can be done now directly in the Bezier and Ikarus editors. The drawing capabilities have been enhanced and more batch functionality has been added. For those who can manage without an updated manual and have no problem with the AGL 1.2 compatible Character Layout files, a pre-release version of DTL FontMaster 2.5 Light can be downloaded from <a href="http://www.fontmaster.nl/Temporary/FM2.5_Light_PR.html" title="http://www.fontmaster.nl/Temporary/FM2.5_Light_PR.html">http://www.fontmaster.nl/Temporary/FM2.5_Light_PR.html</a></p>
