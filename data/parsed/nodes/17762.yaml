    html: |-
      <p>TypeTool 2.0 is available from Fontlab Ltd. at US$99 (<a href="http://www.fontlab.com/typetool/" title="http://www.fontlab.com/typetool/">http://www.fontlab.com/typetool/</a> ).  </p>
      <p>An older version, TypeTool 1.3, was given away with some computer magazines across Europe e.g. Easy PC (UK, issue 20/2004), Computer Arts Projects (UK, issue 57/2004), Computer Arts (UK, issue 95, April 2004), Computer Arts (France, issue 74, January 2005), Computer Magazine (Italy, issue 96, February 2005), Il mio computer (Italy, issue 120, June 2005). If you can find any of these issues, you can get TypeTool 1.3 with them and then upgrade to TypeTool 2.0 at US$39.95. </p>
      <p>TypeTool for Windows supports PC Type 1 (.pfb) and PC TrueType / OpenType TT (.ttf) fonts. TypeTool for Mac also supports Mac Type 1 (LWFN/FFIL) and Mac TrueType fonts. </p>
      <p>Font Creator 5.0 from <a href="http://www.high-logic.com/fontcreator.html" title="http://www.high-logic.com/fontcreator.html">http://www.high-logic.com/fontcreator.html</a> is available at US$65 (Home Edition) and US$99 (Pro Edition). It supports PC TrueType (.ttf) fonts and is able to open but not generate OpenType  PS (.otf) fonts. </p>
      <p>FontForge (<a href="http://fontforge.sf.net" title="http://fontforge.sf.net">http://fontforge.sf.net</a> ) is the cheapest (free) and supports practically all major font formats but is rather awkward to use. I believe that it requires more knowledge of font format specifics than the two above. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
