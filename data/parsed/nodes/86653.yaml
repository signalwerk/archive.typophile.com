    html: <p>I'd think it would depend on the nature of the photographs. Also something to look out for is whether the weight of sans is too light for comfortable reading on shiny coated paper, which art books usually are printed on. Also you should note that Frutiger had problems with Frutiger Next. <a class="freelinking external" href="http://www.neuefrutiger.com/" rel="nofollow">Neue Frutiger</a> is the one he did, together with Akira Kobayashi, that has his approval.</p>
