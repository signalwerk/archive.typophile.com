      <p>Frutiger evidently felt the same way as Nick. There is a heartbreaking paragraph in the book in which Frutiger is tormented by the thought that Frutiger Next might ultimately damage his reputation. That's why I'm happy that he was able to do Neue Frutiger.</p>
      <p>To me Optima Nova is a different story. I think Zapf guided this, at least the regular width styles, and you can argue under what circumstances it might be better or worse than the original. But I agree with Nick when it comes to the condensed styles—a travesty.</p>
