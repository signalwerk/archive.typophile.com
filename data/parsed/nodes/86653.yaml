    date: 2012-02-14T06:16:00
    date_raw: 14 Feb 2012 — 6:16am
    votes: null
    html: "<p>See pages 259-260 of Adrian Frutiger Typefaces: The Complete Works. He explains his unhappiness particularly with the cursive in Frutiger Next, which he didn't draw. He was against doing it, as he thought it was out of character with the roman. After that book was published, Frutiger was able to redo it 'his way' with the assistance of Akira Kobayashi, in Neue Frutiger. This not only changed the cursive to a sloped roman, but also changed the range of weights, and corrected compromises that were done earlier because of the system of fixed units in Linotype film.</p>"
    html_clean: "<p>See pages 259-260 of Adrian Frutiger Typefaces: The Complete Works. He explains his unhappiness particularly with the cursive in Frutiger Next, which he didn't draw. He was against doing it, as he thought it was out of character with the roman. After that book was published, Frutiger was able to redo it 'his way' with the assistance of Akira Kobayashi, in Neue Frutiger. This not only changed the cursive to a sloped roman, but also changed the range of weights, and corrected compromises that were done earlier because of the system of fixed units in Linotype film.</p>"
