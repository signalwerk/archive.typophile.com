      <p>Thanks for the photo Nick, I like the idea of using bold. Do you think its a good idea if their is not much white space on the page? The photos are actually not on the same page as the text, they are at the end of each chapter. The reason I mentioned the photos(B&amp;W) was to point out that their is not much text, so using a sans serif shouldn't be a problem, even though I think, if given enough leading, sans serif is fine for long text even though most typographers(more experienced than me) keep telling me that serifs are better for long texts, I just don't see it.</p>
      <p>William I will definitely rethink the Frutiger Next, maybe it's worth buying the Neue Frutiger or even using Univers.</p>
