      <p>No knowledge, but you might be interested in <a class="freelinking external" href="http://benwhitmore.altervista.org/coelacanth-type-family/" rel="nofollow">this</a>, an open source digitisation with optical sizes, in alpha. Be warned: it's rough, especially the italic!</p>
      <p>If you're planning to use it you'll want to disable the ligatures in italic, since the ligatures in place there are roman ones, and personally I think the heavy weight feels more for interpolation than as designs I'd consider using. But the basics are there, and having optical styles makes this an interesting project. I don't believe any digitisation of it has optical sizes, open source or not. <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/mti/centaur/" class="freelinking" rel="nofollow">Here</a> and <a href="/wiki/https%3A/%252Fwww.myfonts.com/fonts/adobe/centaur/" class="freelinking" rel="nofollow">here</a> are less idealistic but more practical releases.</p>
