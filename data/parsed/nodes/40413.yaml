    <p>Sentinel Type is the typographic arm of advertising creative and designer <a href="/wiki/James%20Arboghast" class="freelinking" rel="nofollow">James Arboghast</a>. Dedicated to producing distinctive and original retail typefaces and custom fonts and type solutions. </p>
    <p>All Sentinel types are engineered by "four seasons in one day" Melbourne weather  for lasting artistic value. Crafted to the highest level of technical quality, only the finest Columbian extruded polyvinyl, highest-bidder materials used thruout. No really.</p>
    <p><strong><a href="http://www.myfonts.com/browse/foundry/sentinel/" target="_new" rel="nofollow">Sentinel Type retail catalog at Myfonts.com</a></strong></p>
