    html: |-
      <p>I like the use of Archer in the section heads, but I feel like it clashes with Farnham where they've stuck the two together.</p>
      <p>I also think they've misused Farnham for the big bold headlines. On the main head of Sunday's front page, the combination of somewhat loose leading and jamming it up against the photos to the left looks really clunky to me.</p>
      <p>I'd like to see them use a lighter weight of the Farnham for the headlines (and possibly a slightly larger type size to compensate) and let the idiosyncrasies of the face shine through. Also, the mix with Archer for the kickers might work better if the two faces were more similarly weighted. The bold Farnham works better in smaller headlines -- the leading looks like it's the same as in the larger headlines -- perhaps it just works better smaller.</p>
    html_clean: |-
