  html: <p>The San Francisco Chronicle rolled out a redesign yesterday. I don't know any of the details about who did what, or what they are now using (Archer for section heads and subs). The old design was one I often lauded in these forums, especially the sturdy elegance of Parkinson's Electra adaptations. From a type perspective, I'd have liked to see them update their headline sans and call it good. Now it feels like they did a trendy typographic mashup with no cohesive style. Nothing wrong with the individual types they used mind you; I'm sure this largely just my reaction to change. It will be interesting to see the broader reaction and how it evolves. In the mean time... Michael Phelps smoked pot *wow*</p>
  html_clean: <p>The San Francisco Chronicle rolled out a redesign yesterday. I don't know any of the details about who did what, or what they are now using (Archer for section heads and subs). The old design was one I often lauded in these forums, especially the sturdy elegance of Parkinson's Electra adaptations. From a type perspective, I'd have liked to see them update their headline sans and call it good. Now it feels like they did a trendy typographic mashup with no cohesive style. Nothing wrong with the individual types they used mind you; I'm sure this largely just my reaction to change. It will be interesting to see the broader reaction and how it evolves. In the mean time... Michael Phelps smoked pot *wow*</p>
