    html: |-
      <p>The choice of typefaces don't bother me nearly as much as the ragged-left columns, separated by rules running down the length of the body.</p>
      <p>Ugh, did they actually <strong>want</strong> me to read this? It's not a serious redesign at all, and reader response has been mostly disgust (as far as I can tell from the SF Gate comments). For a paper that mostly prints wire stories and drastically reduced their number of writers, the redesign is a classic example of fixing the one thing that wasn't broken.</p>
      <p>Oh, and the newsstand price is now 75¢ a copy. Draw your own conclusions.</p>
