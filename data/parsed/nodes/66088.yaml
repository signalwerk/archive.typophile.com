      <p>Måns, I really don't know when or if the paper will be published at this point. Feel free to ask questions on this thread or contact me through my Typophile profile and I'll send you the current PDF.</p>
      <p>Stéphane, this is actually something I've been eager to try to figure out. As I wrote above, the Folio's text font has been the particular subject of 98 pages and much of the second volume of Hinman's <em>The Printing and Proof-Reading of the First Folio of Shakespeare.</em> Hinman's description is designed for analytic bibliographers, not typographic historians, as he focuses not on the font in general so much as the distinctively damaged sorts that allow him to reconstruct the printing history, but I think it's fair to consider it all detailed research on the text font.</p>
      <p>I looked into Gutenberg's 42-line font before writing my paper (though not enough to be sure), and I could only find one 11-page paper written on the typography of the 42-line Bible (<a href="http://www.gutenberg.eu.org/pub/GUTenberg/publicationsPDF/22-wild.pdf" rel="nofollow">"La typografie de la <em>Bible</em> de Gutenberg" by Adolf Wild</a>). Wild's paper has a short bibliography that did not suggest a huge amount of other research on the font, though perhaps some of the cited books feature a great deal. Ultimately, Hinman's research, in which he examined literally every letter looking for distinctive sorts, is so obsessive and unusual that I would be surprised if Gutenberg researchers (or anyone else) have examined a single font to a comparable extent.</p>
