    <p>In a class I took this semester, <a href="http://www.yale.edu/english/graduate-courses.html" rel="nofollow"><em>Materializing the Word: The Book as Object, Technology, Concept, and Event, 1500-1800,</em></a> I researched the text font used by William Jaggard for Shakespeare's First Folio, printed from 1621 to 1623 in London. <strong>Below is a short summary of my paper.</strong> Although I feel reasonably confident about the visual and historical evidence for my conclusions, they must be viewed with some skepticism; myriad attributes can create a misleading appearance, from inking and justification to paper quality and mixed-sort fonts. (As an example of the problems of such typographic research, I was convinced until nearly the end of my examination of the Folio that the text font was a design by Ameet Tavernier.) Nevertheless, this bit of information may be of interest to the folks around here, particularly since Pierre Haultin, who I propose cut the punches for the Folio's text font, has never before been linked to the First Folio.</p>
    <p>As the compositors in William Jaggard’s print shop plucked countless sorts out of their cases, composing page after double-columned page from 1621 to 1623, they could not have suspected that they were handling a font that would be the object of more study than perhaps any other before or since. The font certainly would not have appeared remarkable in any way; it was cast on a pica body, the most common size of the era, and fonts made from the same punches had been owned by more than thirty printers since 1570. Moreover, the font was weathered, having been in use probably for well over a decade. Surprisingly, it was precisely this battered condition that made it so fruitful for detailed analysis: the numerous visible defects in the sorts of the First Folio’s text font have proved the most powerful tool for reconstructing the book’s printing history. Charlton Hinman in <em>The Printing and Proof-Reading of the First Folio of Shakespeare</em> devoted 98 pages in his first volume and much of the second to an analysis of the Folio’s type, making the text font the subject of an extraordinary amount of research.</p>
    <p>Despite an extensive analysis of its distinctive sorts, few Folio scholars (including Hinman) have examined the origins and characteristics of the font itself, and the limited information available in the literature to date is more a result of generalization than of detailed scrutiny. I measured the dimensions of the text font in a copy of the First Folio at the Beinecke Rare Book &amp; Manuscript Library, Yale University, New Haven, Conn., finding twenty lines of type to measure 82.7 mm. Visual and historical evidence have led me to suggest that the font is the second pica roman of the Huguenot punchcutter Pierre Haultin (as described by H.D.L. Vervliet in <em>The Palaeotypography of the French Renaissance</em>), cast for Jaggard’s use probably around 1603 or 1608 by an unknown typefounder who likely inherited the matrices from Pierre’s nephew Jerome Haultin. The font was old and in poor condition when it was used to print the Folio, which supports the view that Jaggard and his pressmen did not see the Folio as an unusually important book. If the results of this research are to be accepted, they will correct two particularly enduring statements made about the font by Horace Hart in 1902: The font appears to be of French origin, not Dutch, and it was not commissioned specifically for the printing of the Folio but rather had been in use for fifteen or twenty years by 1623.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/F1 Page Typophile_5966.jpg"></div><p></p>
