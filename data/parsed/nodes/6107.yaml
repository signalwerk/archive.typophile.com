    html: <p>Kyle, I think Oster was a pre digital era logo. It very well could be based on a font but don't be supprised if it was hand drawn</p>
    html_clean: <p>Kyle, I think Oster was a pre digital era logo. It very well could be based on a font but don't be supprised if it was hand drawn</p>
