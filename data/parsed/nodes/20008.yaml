      <p>Mikey, we might disagree on that one. :^) Though it is common knowledge that Bitstream has a great number of renamed versions of fonts from Linotype, Monotype et al…, I can tell from first-hand experience that a lot of their digitisations are of a superior quality compared to the the “originals”.</p>
      <p>It’s not like they actually <em>stole</em> the digital outlines (though here again for some specific cases there are different versions to the story), but they digitised their own versions. Compare for example <a href="wiki/Linotype" class="wiki">Linotype</a>’s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=LH.76.0.1&amp;attributes.sampleSize=48&amp;sampleText=A&amp;sampleSize=388">Melior</a> to <a href="wiki/Bitstream" class="wiki">Bitstream</a>’s <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=BT.122155.0.1&amp;attributes.sampleSize=48&amp;sampleText=A&amp;sampleSize=388">Zapf Elliptical 711</a>.</p>
      <p>Unfortunately a very interesting discussion on this topic featuring some insightful comments from Erik Spiekermann and David Berlow seems to have disappeared during the transition from the original Typophile to Version 2 a little over a year ago. Bummer…</p>
