      <p>I wouldn’t be so quick to call it a knock off of Mahogany Script. Both companies have done numerous “knock-offs” of other faces but in this case Bitstream appears to have acquired and digitised the original  face from Intertype, Monterey here. So it’s the other way around, Mahogany could be a knock-off of Monterey. I had a quick glance and it appears that Mahogany isn’t as delicate nor elegant as Monterey, the finer strokes have been thickened and some of the terminals end oddly. </p>
      <p>I don’t really know. :^)</p>
