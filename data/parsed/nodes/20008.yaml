    html: |-
      <p>&gt; <em>Mahogany could be a knock-off of Monterey</em></p>
      <p>I couldn’t tell you for certain what face <a href="http://www.fonts.com/findfonts/detail.htm?pid=203231&amp;grab_id=0&amp;page_id=6062&amp;query=Mahogany&amp;SCOPE=Fonts#history" target="new">Mahogany Script</a> was originally based on, but I can tell you it was released in 1981 from the “Custom Type” group collection at Compugraphic. That means that a CG customer had requested the typeface to be produced based on another specimen for their specific use, most likely done for an EditWriter filmstrip font years before.</p>
      <p>Many of the early CG customers were “Mom &amp; Pop” shop printers, so Mahogany Script was most likely based on one of the thousands of Wedding Scripts printers used for handset invitations. I am not trying to ID the original for you, just giving you a little background on how it got into the Monotype Imaging collection.</p>
