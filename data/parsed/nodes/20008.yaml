      <p>&gt; <em>It’s the supporting symbols I have a problem with.</em></p><em>
      </em><p><em>@, copyright, greek micro sign, pilcrow, section, registered, trademark, yen, etc are all pulled out of the Times Roman parts bin. (Maybe not Times but you get my point)</em></p>
      <p>Ah, of course, I thought you meant alternate glyphs like swashes and ligatures and stuff.</p>
      <p>I completely agree with you about the supporting symbols, I now see what you mean. These are indeed a disgrace to be included in the character set of such fine digitisations. They look completely out of place and are often downright ugly.</p>
      <p>I guess Bitstream used that as a shortcut in order to get the typefaces on the market as fast as they could in the early digitisation rush, but they’ve had plenty of time to correct that mistake and still haven’t.</p>
