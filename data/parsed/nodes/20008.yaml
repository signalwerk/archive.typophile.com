      <p>Monterey is one of Bitsteam’s knockoffs and looking through its character set there are some glyphs that are not drawn well or as true as Mahogany Script from Monotype. Mahogany Script also come with an Alternates font that has a few different glyphs in it. And on top of that Monotype gives a away a free font too- Chilada Dos! And its $2.75 cheaper!</p>
