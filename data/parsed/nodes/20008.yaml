      <p>Umm… Do you guys actually own any of these fonts? I do and the Bitstream- original or whatever- is not as good. The basic latin stuff is just about the same. Its the supporting symbols I have a problem with.</p>
      <p>@, copyright, greek micro sign, pilcrow, section, registered, trademark, yen, etc are all pulled out of the Times Roman parts bin. (Maybe not Times but you get my point)</p>
      <p>The only thing I actually like in Monterey are the dagger and the double-dagger. These glyphs are tilted and look cuter.</p>
      <p>But as for the Latin it all looks the same- and no- Mahogany Script is not thicker. (although on the Monotype site the braces look fat- they are in fact NOT fat and are well balanced in stroke.</p>
      <p>I guess instead of knockoff I should have said ‘shoddy execution”. And yes- Zapf Elliptical is much better. And in a heartbeat I would buy Charter Pro or Iowa from Bitstream. Other fonts I don’t know. I would make that purchase decision on the basis of who has done the best interpretation/implementation, price, license, perks etc. </p>
      <p>In this case GET THE MONOTYPE VERISON!!!<br>
      Monotype is cheaper, better implemented, comes with an Alternate font, plus a bonus free font and I did for get to mention its cheaper… and two free tickets to Tokyo… okay NOT!</p>
      <p>;-)</p>
      <p>Mikey</p>
