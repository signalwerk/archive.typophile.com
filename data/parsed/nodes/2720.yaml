  html: <p>I'm trying to locate a commercially available typeface approximating the look of a Bodoni or Didot Sans. I'm aware of Peter Bilak's unpublished Didot Sans, but have yet to find anything that captures the same spirit. I've located numerous, Deco-styled faces that have the thick/thin qualities of a Didot, but the contrast is typically too exaggerated and the proportions too condensed. <br> <br>Creating a new face isn't an option as the budget on the job does not allow for the time needed to do so... <br> <br>Does anyone know of any typefaces out there that preserve the classic proportions of a Didot, minus it's serifs? Any assisitance would be greatly appreciated. <br> <br>Thanks.</p>
  html_clean: <p>I'm trying to locate a commercially available typeface approximating the look of a Bodoni or Didot Sans. I'm aware of Peter Bilak's unpublished Didot Sans, but have yet to find anything that captures the same spirit. I've located numerous, Deco-styled faces that have the thick/thin qualities of a Didot, but the contrast is typically too exaggerated and the proportions too condensed. <br> <br>Creating a new face isn't an option as the budget on the job does not allow for the time needed to do so... <br> <br>Does anyone know of any typefaces out there that preserve the classic proportions of a Didot, minus it's serifs? Any assisitance would be greatly appreciated. <br> <br>Thanks.</p>
