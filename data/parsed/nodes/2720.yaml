    html: '<p>Britannic has always struck me as being one of the most successful high-contrast sans serif faces. <br>However, it has the full curves of a grotesque, not the more geometric, neoclassical shapes of Bodoni-era "moderns".  <br> <br>The over-extension and turning back of the curved terminals in "c", for instance, provide the opportunity for a purposeful end to the stroke, not just snipping it off, which would be the minimal, pure-didone logic. <br> <br>So, it would make a good pairing not with the original moderns, but with more contemporary (ie c.1900) moderns such as, ahem, Monotype Modern 2, or De Vinne. <br> <br>For a 3some, add Grot. #9. <br> <br>If in doubt for matching faces, make them from the same era.</p>'
