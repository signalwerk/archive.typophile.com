    html: "<p>This is completely unhelpful to you, but here's a typeface <br>that preserves the proportions of Bodoni, minus the stroke <br>modulation and with slab serifs: <a href=\"http://www.myfonts.com/fonts/shinn/bodoni-egyptian/\" target=\"_blank\">Bodoni Egyptian</a>. You  <br>could chop off the serifs, but I'm not sure how good <br>the results would be.</p>"
