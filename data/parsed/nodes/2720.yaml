    html: <p>If I remember rightly, I have read that the original 19th century 'Grotesques' are in fact based on 'modern' proportions such as Didot and Bodoni. The progression was first to thick unbracketed serifs of 'Egyptians', and then these had the serifs cut off &amp; voila. </p>
