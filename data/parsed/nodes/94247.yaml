      <p>For me the whole thing was fun. Of course, I like to show off, that was a big plus for me. </p>
      <p>The stuff I remember as interesting to me includes: Hubert Jocham's critique of Rotis, and Jesse Ragan's story of working on inscriptions for the NY public library. Mickel's story of the massive project on monograms for credit cards, and having it cancelled last minute was a good story, and the idea of extending Avant Garde style of ligatures. Apeloig's combination of modernist style type but very expressive, romantic use of them in posters was also interesting. </p>
      <p>Ellen Lupton was charming. I was a bit taken aback by the 'shot' about our weirdness, which I took to be playing to the crowd. The crowd, which was over the 200 person capacity to the surprise and delight of everyone, was of course mainly not type designers. However, all the students of the CooperType summer program on type design were there. Cara di Edwardo, was also delightful, and I know is extremely knowledgeable about letter forms. </p>
      <p>There to teach at CooperType from abroad were Jean-Francois Porchez, Just van Rossum and Hannes Famira. It was nice to meet Jean-Francois and Just for the first time.    </p>
      <p>The exhibition on Governor's Island was also fun. I went to that with my family on Sunday. It's a nice picnic-like setting, and we had a perfect mild summer day. The exhibition is a survey of all kinds of graphic design. I don't have a clue as to why they chose what they chose, though of course I was happy to have one thing in it. I remember particularly a piece of Marion Bantjes that has letters made with tiny holes punched in one piece of paper, with another a little distance behind it. The holes were put in different directions, so that the shadows changed what holes are light and dark as you move. It animated what she did very effectively. Also there was a wonderful piece of movie title design with something involving women in 50s looking outfits. I don't know what movie it was from. There is a tremendous amount of stuff there, and I might go again if I get the chance.</p>
