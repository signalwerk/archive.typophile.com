      <p>I wonder if Ellen Lupton was the right choice for emcee. She seemed to start from the presumption that "font guys are really weird, right?" and emphasized the esoteric nature of the issues at hand repeatedly and mockingly, which seemed to me more likely to stifle than encourage the dialogue about type-design problems which was the presumed aim of the evening.</p>
