    <p>In conjunction with its exhibition <em>Graphic Design: Now In Production</em>, on exhibit in New York City this summer, the Cooper-Hewitt National Design museum had panel of 6 designers whose work appears in the exhibition. Each was asked to give a very brief—seven minute!—talk on a "Wicked Problem" in type design, with a panel discussion afterwards. Cooper Hewitt did a nice video of the event, <a class="freelinking external" href="http://www.youtube.com/watch?v=z2hhkfUzZtw" rel="nofollow">which you can see here.</a></p>
    <p>The six designers are Philippe Apeloig, Hubert Jocham, Henrik Kubel, Jeremy Mickel, Jesse Ragan and yours truly.  Ellen Lupton and Cara Di Edwardo were the moderators.</p>
    <p>I talked about how type design can increase readability. Jesse Ragan, who talked about his interesting work on Stone Carvings for the New York Public Library, alerted me to the fact that 'wicked problem' is a technical term for a kind of problem that is important but not well defined. (See the wikipedia article) Readability fits that!</p>
    <p>As the Carnegie mansion, which normally houses the Cooper-Hewitt, is being renovated, the exhibit is on Governor's island, a short and free ferry ride from the Southern tip of Manhattan.</p>
