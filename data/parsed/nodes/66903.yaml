  html: |-
    <p>I'm trying to draw a 'neo-grotesque' typeface. I have drawn the letters  (I've already posted some images on my <a href="http://www.flickr.com/photos/danielecapo/4311310654/" rel="nofollow">flickr gallery</a>), no numbers, no punctuation, etc.<br>
    The first version of G and R (in brown) was too Univers-esque so I decided for a different shape.<br>
    Basically I'm trying to draw this font for my use to replace Helvetica (in posters and short texts).<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/grottesco_5031.jpg"></div><p></p>
