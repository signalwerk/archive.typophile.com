      <p>It's coming along nicely. Glyphs I think are working well include /Q/m/n/a/ae/5/8/.</p>
      <p>I would still say that those diagonal figures /2/4/7/ are still clunky to me, especially /4/. And I would still say that the /G/ looks too much like a perfect ellipse. </p>
      <p>I think you're right that /S/ may be too wide. /A/ looks wide to me too. /H/ may be too wide, too, given the narrowness of letters like /E/F/N/U/.</p>
      <p>Your diacritic tilde rises from left to right; is that intended?</p>
      <p>On /b/, where the bowl comes into the stem at the bottom left, I think the stroke has too much contrast—almost a calligraphy-pen effect. The corresponding part of /q/ is similar. </p>
      <p>/$/ looks dark. /t/ and /a/ may be a touch dark but I'm not sure about that.</p>
      <p>/£/ looks wide and Euro looks narrow.</p>
      <p>That signature /g/ still jumps out to me quite a bit. I think its bowls, like the shape of /G/, seem like stock ellipses that don't have their relationships or connections with each other worked out. Its basic proportions work well though.</p>
      <p>Keep it up!</p>
