    html: |-
      <p>I agree on the "r", it adds to the quaint character. But I would work a little more on the shape, and perhaps start the joint a little lower. Keep in mind that such an "r" will create spacing issues. </p>
      <p>I too prefer the curved-leg "R". </p>
      <p>Don't worry too much about weight differences in this typeface. I think it suits this style. Just look at MT Grotesque, where the difference is much more pronounced than this. </p>
      <p>"a" needs some work. It's a great shape, but take another look at the curves. </p>
      <p>I've never been a fan of MT Grotesque-like slanted-cut "c"s, but it seems to work here. The uppercase "C" I'm more uncertain of. Have you tried equal cut angels?</p>
      <p>I agree on the bowl to stick-joins, but don't overdo the adjustment. Some contrast will work just fine here.<br>
      "e" counter looks a little too egg-shaped.</p>
      <p>"f" and "t": Curves again a little uncertain. </p>
      <p>"g": Very different counters, one is square, the other is not. And I think a monoline join would look better.</p>
      <p>"s": Needs some smoothing. Perhaps slightly top-heavy?</p>
      <p>"w" and "W" and "M" all look heavy. X-es need some cross-compensation. </p>
      <p>"U" needs a more generous curve.</p>
      <p>I have little time now, this was a very quick run-through. I'll have another look later. And please take my advice with some salt, I'm not a pro.</p>
      <p>Keep up the good work! This is going to be great.</p>
