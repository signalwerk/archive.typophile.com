      <p>I've changed some of the letters:<br>
      /a/: slightly changed the top curve<br>
      /f/: changed the hook<br>
      /j/: shortened the hook (it was too long for a neo-grotesque)<br>
      /r/: I've tried with a shorter 'beak'<br>
      /C/: now is more open<br>
      /M/: tried to add ink-traps (I think is not enough)<br>
      /W/: tried with a different, 'overlapping' version (I rarely see this kind of /W/ and I'm not sure about it)</p>
      <p>I've also fixed the counter of the lower loop of /g/: it was really too squarish, but I think the monoline junction would be too 'hard'. </p>
      <p>I decided to keep the R with the curved leg, it was better.<br>
      I've also tried a 'fatter' intersection in /b/ and /p/, like the one I have in /q/ and /d/. But now I don't know if it doesn't match with the intersection in /n/, etc. (I like it in /n/ and I don't want to change it there).</p>
      <p>I've uploaded a new pdf.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/grottesco-3-2-2010_4727.jpg"></div><p></p>
