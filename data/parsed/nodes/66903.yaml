    html: |-
      <p>I like it too. It's nice to see caps like /B/E/P/S/ not be stretched towards square as in typical grotesques.</p>
      <p>I think the black versions of the letters are better, but would you consider including, say, the brown /r/ and /R/ as alternates? (And maybe an alt /g/?)</p>
      <p>I think /b/ and /p/ taper too much at the top intersection - it knocks the glyph out of character IMO. </p>
      <p>/e/ might be too fat where the crossbar intersects (and/or too thin at the southwest) (but Sindre's right, we need a pdf to judge).</p>
      <p>The /g/ is clearly the signature glyph. Right now the shape of the link seems a bit indecisive but it's hard to see exactly what's going on there at this resolution.</p>
      <p>/W/ looks quite wide. /d/ may be a bit narrow.</p>
      <p>The black /G/ looks very ellipsoid - should you bump the corners of the curve out, at least on the bottom?</p>
      <p>On the /M/ I think you could spread the upper vertices out even a bit more and let the side counters creep up a touch more.</p>
      <p>I wonder if that /f/ crossbar's length on the right will make spacing difficult.</p>
      <p>Looking forward to see this develop.</p>
