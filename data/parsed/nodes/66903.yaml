      <p>Those letter changes are good.<br>
      I think the figures 2, 4, and 7 all have the same problem - the shear at the acute angle. With a face like this my eye wants to see that vertical as the termination of the horizontal stroke, but the vertical shear is clearly longer than that termination would be.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/274_6522.png"></div><br>
      Not that the nodes should align mathematically, of course, but I think this may be at the root of why those particular figures stand out as clunkier than the others.<br>
      I think a 7 stem that gently arced, and narrowed towards the corner, could work well in this font.<br>
      Related to this, the bottom right corner of /N/ also looks too thick to me.<p></p>
