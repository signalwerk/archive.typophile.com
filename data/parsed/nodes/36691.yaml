    html: |-
      <p>Charles -- Good advice. I have used similar methods in evaluating typefaces and H&amp;J settings/parameters.</p>
      <p>One thing I might add. In addition to the evaluation to determine the optimum spaceband (which, as Charles points out is not always 100%, depending upon the font/designer/foundry), I do a similar, unjustified pass to identify what percentage minimum I deem to be an acceptable lower end. </p>
      <p>In the second step that Charles describes, with a justified setting, you can't be certain that the tightest line you are evaluating is equivalent to your min setting, nor that the full effect of your min setting has been applied anywhere. So, I introduce this intermediate evaluation. </p>
      <p>That is to say, I keep the setting as fl/rr and adjust the optimum (or ideal) downward. (In fl/rr setting, this middle setting is the only value that has any effect.) This way I can see the direct result of the spacing value. Once I determine an acceptable minimum, then I apply it to the Min value in the manner Charles suggests (reverting the Optimum to my ideal and setting justified) and see how it plays out in text.</p>
      <p>-- K.</p>
