    html: <p>I find justified text looks worst in narrow columns, because those are the ones most likely to generate rivers. My rule of thumb is to not justify any column less than 44 characters wide.</p>
    html_clean: <p>I find justified text looks worst in narrow columns, because those are the ones most likely to generate rivers. My rule of thumb is to not justify any column less than 44 characters wide.</p>
  - id: 223955
    user: 19337
    date: 2007-09-01T10:41:00
    date_raw: 1 Sep 2007 — 10:41am
    votes: null
    html: |-
      <p>On a narrow column a ragged right edge always looks better than justified text full of big gaps, rivers, and too many hyphens. James' rule of thumb for the cut-off point is good.</p>
      <p>My standard settings (in InDesign) for word spacing in justified text are 85/100/130, but I will set the minimum to 80 in narrower settings if necessary. Some typesetters will go to a minimum of 75: to some extent that depends on the tightness a particular typeface will tolerate. Hyphenation settings can also vary depending on the width: on narrow columns, I may set it to 3 in a row from my normal 2 allowed. I usually check the "hyphenate capitalized words" option, but this is a necessity on narrow columns.</p>
      <p>A slightly condensed typeface of course will help on a narrow setting if you have to justify. But don't artificially squish a regular face.</p>
