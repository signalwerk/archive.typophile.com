      <p>Much depends on your situation. As a *commercial* typesetter -- always books -- the comps in our company usually have no say over whether or not the type is to be set justified or ragged. The design is supplied along with the copy.</p>
      <p>When you have more of a free hand -- you are the designer -- I would pay attention to who the intended audience is. Frequently, typophiles have different preferences than the reading public. For example, in a slightly less than normal text measure, a typophile may suggest setting ragged, because they just cannot stand the variance in word spacing that will likely result. But the reading public tends to be more comfortable with justified copy (in a book &amp; usually a magazine), for the simple reason that a justified setting is what is most common. When you vary from what is common, you call attention to what you have done, for good or ill. Newspapers and brochures often have a ragged setting, so if your printed piece is one of these, you can rely on different audience expectations.</p>
      <p>As to generalities: you will just have to accept more variance in word space with a narrower column (measure). </p>
      <p>How to find the values:</p>
      <p>Set at least a page ragged right, with the min-ideal-max spaceband values all set the same. You might as well start with 100% -- the type designer's thinking. But if this is too loose or tight for your eye, change the values up or down until the spacing is what you want. With some fonts, I've gone as low as 90% &amp; it wouldn't surprise me to come across some where I'd go lower.</p>
      <p>BTW ALWAYS PRINT OUT THE PAGE. The screen display will fool you.</p>
      <p>Now go for the minimum value. Change the setting to justified, use your newly determined "ideal" value where 100% is now, and set the minimum, to, say, 75%. Set (&amp; print out) a couple of pages -- that would be around 80 lines &amp; at least six paragraphs in my type of work. See if the tightest line is going too tight. If so, change the 75% to a higher value. If not, keep dropping it down.</p>
      <p>I don't see the upper value changing much in the final setting. Unlike some layout programs (e.g., TeX) InDesign (&amp; PageMaker &amp; Quark) will violate (exceed) the "maximum" value. What will change is the number &amp; severity of the *violations* if you toggle that display on. But I've set my two pages as above with a 133% and then changed it to 500% maximum &amp; not one line break changed. I suppose under some situations, it might.</p>
      <p>This is a bit or work -- 15 to 20 minutes -- to go through with a typeface, &amp; should be good for a reasonable range of sizes and measures -- say 22 to 27 pica measure, 9-10-11 point type. If you change the size or measure too much, you need to go through the test again to confirm things.</p>
      <p>I also allow plus &amp; minus  0.1% variation in letterspacing and scaling. It isn't much, but it can help, and with values that small, no, you cannot see it. But I've watched a hyphen block go away when using that small amount of letterspacing/scaling.</p>
      <p>If I've given the impression that you cannot just use someone else's typeface preference or values, that was on purpose. Using type well depends on a certain familiarity &amp; understanding of it's behavior. You cannot borrow either familiarity or understanding.</p>
      <p>FWIW</p>
