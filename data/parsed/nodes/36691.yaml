    <p>I am stuck with a narrow column to lay<br>
    my text, I usually prefer left aligned<br>
    text, but I think in a narrow column,<br>
    justified text would look better.</p>
    <p>Can people please share their experiences<br>
    with justification. When does one justify,<br>
    and when not.</p>
    <p>And while justifying, what are the settings<br>
    for minimum, desired and maximum wordspace<br>
    percentages that people use.</p>
