    html: |-
      <p>Yes, Kent's method gives a certain kind of information. I have tired it, and it doesn't work as well for me, because at several levels, "too tight" is a relative notion. There is absolutely "too tight," and also "too tight in this context," where "this context" is the other spacing values at play.</p>
      <p>The moral is there is no right or wrong way, it depends on your eye &amp; the various ways you can fool yourself.</p>
      <p>As to not needing to make the three values the same for ragged settings -- I'm real new to InDesign, but it seems to me that under some conditions, you can set ragged &amp; have the wordspace value change. This is actually a plus -- With TeX, I use to allow a small variation -- say 20/1000ths of an em -- to help with ragged settings.</p>
      <p>FWIW</p>
