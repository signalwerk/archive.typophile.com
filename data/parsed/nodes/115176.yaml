    html: |-
      <p>I take it you are looking for a fairly standard Roman letter, rather than Bible style blackletter or scripts. Anyway, you already have one script on the page. Something that looks reassuring without a lot of harsh threatening angles and that might even be seen as "inspirational."<br>
      If you really want to limit your choices to free, you might as well get something that's well made. A good prospect is  Calluna  by Jos Buivenga at exljbris. The regular weight is currently available free from Myfonts. <a href="http://www.myfonts.com/fonts/exljbris/calluna/" title="http://www.myfonts.com/fonts/exljbris/calluna/">http://www.myfonts.com/fonts/exljbris/calluna/</a><br>
      BTW white on black for this topic suggests a funeral. Why not something in a cheerful pastel?<br>
      Don</p>
