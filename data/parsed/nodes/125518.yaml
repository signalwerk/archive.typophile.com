    html: |-
      <p>Very interesting bug. It's strange that sometimes the error is up and sometimes down. Can you derive a pattern relative to the actual GPOS anchor data, or to the default heights of the marks and how these are adjusted in the GPOS? I'm guessing, just by looking at your example, that the GPOS values might be being applied in reverse, i.e. that when you lower a mark from its default height, InkPad is raising it, and vice versa. But I'd need to see how your mark glyphs sit relative to the 0,0 position in order to determine what's going on.</p>
      <p>In order to determine what's at fault, you need to find out what layout engine InkPad is using for OpenType Layout.</p>
