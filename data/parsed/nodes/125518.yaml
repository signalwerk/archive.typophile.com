    html: <p>Hi John Indeed it is a simple flip of the positioning instruction reversing the direction. If you draw a line through the locus of midpoints between the pink and black marks in the diagram, you will get the original level of all the top marks at around the 620 mark . For what its worth I attach the Marks positioning data.</p>
