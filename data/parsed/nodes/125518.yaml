    <p>I am posting this under General Discussions because it concerns a very technical issue that transcends Arabic.<br>
    My favorite iOS apps (ArtStudio, Pages for iPhone and iPad) render Arabic mark positioning correctly, except for an otherwise excellent  app called InkPad. InkPad for the iPad is a superb vector drawing app and renders Arabic fonts correctly except that mark positioning goes haywire for all Arabic fonts. The attached image shows how the pink marks on my AlQuds SemiBold  font are displaced in Inkpad from their intended position shown in black. The adjustments differ for each letter but the app applies them in the opposite direction up or down!<br>
     I wrote to the developer a few years ago but the issue is too technical for them. Can Typophile experts help pinpoint the trouble?  Thanks.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/Inkpad%20harakat%20test.jpg" width="512" height="512" alt="">
