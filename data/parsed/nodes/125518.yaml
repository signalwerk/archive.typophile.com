      <p>The InkPad app developer wrote me the following, which confirms John Hudson's suggestion that CoreText may be responsible.<br>
      " have checked this program's source code and found that using the iOS system CoreText in this program. So, maybe this problem can't be fixed so far. But I will do my best to see if this bug could be fixed in the future.<br>
      Thanks again for you using my app and reporting this bug."</p>
