    html: |-
      <p>Whenever this stuff gets discussed on the InDesign mailing list, there seems to be a general consensus that the Dell UltraSharp line has outstanding quality at a decent price. At least until recently Dell and Apple used the same suppliers, so you were getting largely the "same" monitor for a big price differential - I assume that's still true, but haven't heard on that point lately.</p>
      <p>Personally, I don't want to buy an external monitor whose resolution isn't at least equal to my laptop's built-in screen, so currently that's 1920x1200, which is what the particular Dell linked above has. But for now I'll stick to my old 1600x1200 CRT monitor. It works well enough I can't justify spending the money to replace it, even though a higher-res LCD screen would be HOTT.</p>
      <p>Cheers,</p>
      <p>T</p>
