      <p>This one is very close if not matching to <a class="freelinking external" href="http://www.dafont.com/uptown.font" rel="nofollow">Uptown</a> by Anthem Type.<br>
      More in the same vein: <a class="freelinking external" href="http://www.dafont.com/impacted.font" rel="nofollow">Impacted</a>, <a class="freelinking external" href="http://www.dafont.com/rocks-death.font" rel="nofollow">Rock's Death</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/device/raw" rel="nofollow">Raw</a>, <a class="freelinking external" href="http://www.dafont.com/you-are-loved.font" rel="nofollow">You Are Loved</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/hipopotam/mr-black" rel="nofollow">Mr Black</a>, <a class="freelinking external" href="http://www.dafont.com/dead-kansas.font" rel="nofollow">Dead Kansas</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/facetype/letterpress" rel="nofollow">Letterpress</a> Headline, <a class="freelinking external" href="http://www.dafont.com/dirtybag.font" rel="nofollow">Dirty Bag</a><br>
      Having a look to some sections at DaFont could be helpful too, full of eroded post-treatment, most of time very well executed: <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=107" rel="nofollow">Fancy &gt; Eroded</a>, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=109" rel="nofollow">Fancy &gt; Destroy</a>.<br>
      Best one so far for your 2 requests is <a class="freelinking external" href="http://www.myfonts.com/fonts/bagraphics/rust-bucket" rel="nofollow">Rust Bucket BA</a> by Bob Alonso.</p>
