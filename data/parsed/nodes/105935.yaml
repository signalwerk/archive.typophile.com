    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DemolitionInDoosanBrochure_3656.jpg"></div><br>
    This is a generic sans -- I don't care which one -- with special treatment to represent demolition.<br>
    I find the restrained treatment to be more effective than the customary extreme defacing of a font.<br>
    I got it from a Doosan heavy equipment brochure.  It also showed more words with the same treatment, which I did not get.<br>
    I would appreciated any pointers as to the font name.<br>
    I know it's not the one in a previous Demolition thread:<br>
    <a href="http://typophile.com/node/84703" title="http://typophile.com/node/84703">http://typophile.com/node/84703</a><br>
    It did not spot it in a Google image search for "fonts demolition" or at<br>
    <a href="http://lava360.com/attractive-distorted-fonts-free-download/" title="http://lava360.com/attractive-distorted-fonts-free-download/">http://lava360.com/attractive-distorted-fonts-free-download/</a><br>
    Don<p></p>
