    html: <p>It looks like you changed the UPM value in the FontInfo dialogue. Check the 'Metrics and Dimensions' pane in FontInfo. The problem as it shows suggests that you reduced the UPM size with the 'Scale all glyphs...' option <strong>not</strong> set.</p>
