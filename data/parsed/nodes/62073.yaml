    html: |-
      <p>Hej Christian,</p>
      <p>don't worry, your glyphs aren't messed up. You just scaled the preview in the font window.</p>
      <p>Make a new global guideline in the glyph window, a bit below your descender value, then right-click on it and choose "Guideline is -&gt; Visual Descender" and it should be fine again.</p>
