  html: |-
    <p>Communication Arts has announced their second Typography Competition, with entries due September 9, 2011. </p>
    <p>Congratulations to Richard, Erik and Tiffany for their roles in the jury of this year's show:</p>
    <p>Richard Kegler, founder/lead designer, P22 type foundry, Buffalo, NY<br>
    Erik Spiekermann, creative director/managing partner, Edenspiekermann, Berlin, Germany<br>
    Tiffany Wardle, typographer/graphic designer, Typegirl, San Jose, CA</p>
    <p>Thinking about entering? All the information can be found here: <a href="http://www.commarts.com/competitions/typography.html" title="http://www.commarts.com/competitions/typography.html">http://www.commarts.com/competitions/typography.html</a></p>
