  - id: 577559
    user: 205259
    date: 2014-05-04T02:27:00
    date_raw: 4 May 2014 — 2:27am
    votes: null
    html: |-
      <p>This wide sans with closed counters and an unspurred G eliminates all the usual suspects such as Blair, Burin, Sweet, Trio, Engraver's Gothic, Sackers etc.<br>
      I found a few with matching letter-forms for S and G. Stawix Ruecha's Soin Sans <a href="http://www.myfonts.com/fonts/stawix/soin-sans-pro/" title="http://www.myfonts.com/fonts/stawix/soin-sans-pro/">http://www.myfonts.com/fonts/stawix/soin-sans-pro/</a> but it would need to be stretched a bit and the counter on C is not open enough. Svetoslav Simov's Intro <a href="http://www.myfonts.com/fonts/font-fabric/intro/" title="http://www.myfonts.com/fonts/font-fabric/intro/">http://www.myfonts.com/fonts/font-fabric/intro/</a> and Code Pro <a href="http://www.myfonts.com/fonts/font-fabric/code-pro/" title="http://www.myfonts.com/fonts/font-fabric/code-pro/">http://www.myfonts.com/fonts/font-fabric/code-pro/</a> Same problems.<br>
      Still looking. If it is an unmodified font it's perhaps from one of the foundries that do not use Myfonts: Lineto, Klim, Commercial Type etc.<br>
      Don</p>
    html_clean: |-
