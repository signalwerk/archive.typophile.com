      <p>Current logo has few "problems":<br>
      - "a" doesn't really read as an "a"<br>
      - varying letter weight<br>
      - too heavy top on the "s"<br>
      - "f" doesn't really belong to these letters.</p>
      <p>Anyway. Current logo is a start of something that wasn't really finished.</p>
      <p>But. New proposals may be better in terms of readability (especially "a" is magnitudes better and actually complements other letters), but there are still flaws:<br>
      - "h" could easily be read as "t wit dotless i"<br>
      - the biggest problem is "y" because of a completely different angle and it breaks the reading flow</p>
      <p>The last one doesn't have the "y" problem but is more </p>
      <p>I'd suggest you use letters with stroke variation, because a flash is a burst of light. Rays... The start thick and disappear as tiny thin lines... I'm not suggesting that your logo should be done this way, but I think strokes should have some weight variation. Logo will also become a bit more dynamic.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
