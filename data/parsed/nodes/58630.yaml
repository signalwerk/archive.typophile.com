  html: |-
    <p>About the Name</p>
    <p>dayflash is a synonym and/or personal nickname which i am using for my design activities as freelancer sice several years. When choosing the name it was very important for me that the name is recognizable and unique.</p>
    <p>As freelancer i mostly do communication and media/interaction design stuff - but also motion graphics and photography.</p>
    <p>The Logo Concept</p>
    <p>Within the logo - and trough the name - I want to show that designing is a very dynamic process. I also use red as the primary color of the comunication design because it reflects the emotion, the passion and the dynamic. Off the mark, the logo should also looking serious.</p>
    <p>Thats also the reason I am not very satisified with the existing logo. It seems to be too static and without any emotion.</p>
    <p>Thats also the problem I have with the new logo proposals. The font is a font i did. I am not sure whether it is the right direction i am facing. Is it good to make the writing italic? How should I investigate that it is more dynamic? Is it right to concentrate just on typography?</p>
    <p>I am really looking forward to reading all your suggestions on it.</p>
