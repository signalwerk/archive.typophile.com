    html: "<p><i>I can't tolerate people that think tolerance is something everyone else but themselves should possess.</i> <br> <br>In this, as in so much else, Jews are held to a different standard. Apparently they must tolerate everything, even people who are sworn to kill them. And if Israel does <i>what any other country would do</i> in response to 50 years of continuous attack by multiple self-proclaimed enemies, then they are called 'Nazis'. <br> <br>When the Nazis began their persecution of the Jews in Germany and then in other European countries, had the Jews sworn to push the Germans into the sea? Had the Jews declared that Germany had no right to exist? Had the Jews repeatedly launched multiple armies against Germany? Had the Jews conducted decades of terrorist campaign against German civilians? <br> <br>Maybe while you're visiting the Weisenthal website looking for reasons to gag, you should read some of it. Start <a href=\"http://motlc.wiesenthal.com/resources/courage/p01.html\">here</a>, look at every panel, read every quote, and then stop spouting rubbish. <br> <br> <br>I agree entirely that the swastika symbol per se shouldn't be always and everywhere villified, and that we need to understand and acknowledge the different contexts in which it has been used and continues to be used. See my comments at <a href=\"http://typographi.ca/000755.php\">Typographica</a>. But 'gagging' at the thought of 'international Jewish human rights group' is just plain old antisemitism: sad, sick and stupid.</p>"
