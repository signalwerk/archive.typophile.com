    html: <p>Yet to have coffee. <br> <br>My complaint with the Jewish Human Rights Organization is the dismal record  of the State of Israel. I will refrain from posting any links because there are far to many. But I use the UN as my standard. Theirs and the complaints made by "many" other human rights organizations. I know people think "human rights organizations" are just a bunch of "zannies". As you can see I made the same mistake about the Museum of Tolerance. Anyway, it's a bad habit to think human rights organization are run by zannies. <br> <br>Especially democratic zannies that lectures on human rights issues to developing nations on a regular basis, including China. So that been the case, it should be alright to complain about human rights abuses in places such as Israel where their isn't any. Hence the gag comment, sorry it was so distracting. Maybe I am too unkind. Maybe that is what the Jewish Human Rights is all about. It is only for the Jews. I don't know, sure looks that way to me. <br> <br><i>I happen to think that it is perfectly possible to criticise the Israeli government and security forces, <b>identify Ariel Sharon as the war criminal that he is,</b> oppose the building of settlements in the occupied territories, favour the existence of a Palestinian state, etc. without accepting even a whiff of antisemitism.</i>  John. <br> <br>You are aware that comments like that can make you a pretty unpopular chap. Someone might call you uninformed, or stupid. Or worse. Trust me you don't  want worse.  <br> <br><i>'Nazis disguised as Jews'</i> Well, I suppose that is hurtful, some think hateful but not as hurtful and hateful as what is happening in Palestine. <br> <br>But I have decided to put John's proposal to test. John is a nice fellow that knows nothing, it would seem, about Oxymorons. I do not believe you can criticize Israel without the result of hideous accusations. That appears to  be part of the "Washington Lobby Spin". Do I sound cynical? Good because I am, it comes by me honestly? I am a realist. <br> <br>But here goes the "new me". <br> <br><a href="http://www.sfgate.com/cgi-bin/article.cgi?file=/news/archive/2003/04/05/international1840EST0687.DTL&amp;type=printable" target="_blank">http://www.sfgate.com/cgi-bin/article.cgi?file=/news/archive/2003/04/05/international1840EST0687.DTL&amp;type=printable</a> <br> <br><b>The Belgian Senate on Saturday approved a measure gutting a war crimes law, bringing an end to lawsuits filed against Israeli Prime Minister Ariel Sharon.</b>  <br> <br>Sharon, terrorist and responsible for genocide. Unfortunately when you get rid of the court, you don't get rid of the accusation. That's the beauty of the system. You never get to clear your name. <br> <br>Selective genocide. Isn't democracy fun? Listen to the Harps of America. <i>"Using the law to target democratic countries was not the intent,"</i> of the law, Destexhe said <br> <br>Only dictators should be persecuted for genocide! Is it OK if I gag now? Did Hitler ever win any elections? I think he did. Back off William, I am on your side here, remember, I really don't like Genocide. Unfortunately for some, I am not prejudiced about my complaint. <br> <br>I am not very complex. I do not approve of racism. I do not approve of murder. I do not appove of war. I do not approve of genocide. I believe freedom of religion is sacred. On the latter I have no choice, my God is the 'very remarkable consular Pooh Bah, consul for the entire planet' who by more than coincidence was helpful in Jerusalem. When I die I get to go to Spain. Did you hear thunder? Oh God, strike me now Consular! <br> <br>Yup, I am as Koo-koo as a Christian, but Koo-koo's have rights too. <br> <br><i>The law, adopted unanimously in 1993, seeks to prosecute war crimes and genocide wherever they occur. It is unique in that, through the principle of "universal jurisdiction" it extends the reach of Belgium's courts to complaints against people and by people with no direct link to the country.</i> <br> <br>That law has been revoked to accommodate the "atrocities inflicted by so called modern democracy". <br> <br>Here is modern democracy. <br> <br><a href="http://www.palestinemonitor.org/gallery/Black_and_white_photo_collection.htm" target="_blank">http://www.palestinemonitor.org/gallery/Black_and_white_photo_collection.htm</a> <br> <br>By the way William, do the Palestinians on the other side of the <i>Jewish Apartheid Wall</i> get  to vote? Or is that a rhetorical question? <br> <br>Swastika's are not good for the European soul. More later. <br> <br> <br> <br> <br> <br> <br></p>
