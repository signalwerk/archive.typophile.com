    html: "<p><i>antisemitism</i> <br> <br>\"Semitic: <b>1</b> a member of a group of caucasoid peoples who speak a Semitic language, including the Jews and the Arabs as well as ancient Babaloynians, Assyrians, and Phoenicians.\" <br> <br>Buy yourself an Oxford. <br> <br>But for the record John, it was I that was responsible for turning in Lutjens to face trial for war crimes. He was, and I believe still is, the only Nazi war criminal to ever be deported from Canada, of which our country had many. I had letters to and from prominent Natzi's continuing through, and many years after the war. I had a bizarre photo journal compiled by Lutjens for his personal files. Many of him and Aldolf Hitler. Other pictures caused me personal grief. I became seriously depressed for several years. I nearly took my own life. It was very hard on the family. <br> <br>Also I have had two partners who were Jews. One who is one of my very closest friends. One of the only friends that came to stay with me in Prince Edward Island. I am not what you say at all. Coming from you I am even more greatly insulted. <br> <br>Anyone who knows me would never accuse me of anti-Semitism. Especially in the ignorant usage of this word. <br> <br></p>"
