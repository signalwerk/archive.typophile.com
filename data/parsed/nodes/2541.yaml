    html: <p>This thread has gone from a comment about a symbol to an anger management session. I was riding my bike in Central Park today in a Noreaster (Snow) and The road runners club had a running race that was going to start soon, my riding buddy and I came to 90th street on the east side and the runners were blocking the  whole road walking to the start/finish my friend Jose asked a runner to move over to allow us to pass and he went balistic, we just rode away and I remarked how he must of just had a fight with his wife or kids, that his anger had nothing to do with us but with his own issues - we just happened to be there. My point is stop this bickering take a deep breath and lets understand that no matter how much you think you are right, someone else has another opinion. I don't spend my engery being angry on my bike I have to use that energy to peddle it.</p>
