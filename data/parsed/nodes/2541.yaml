    html: '<p>William, <br> <br>You, and  they are just going to have to be a little more specific. <br>........... <br><i>Is Judaism a race? If you were to say so, most Jews would think you were an antisemite!</i> <br>.......... <br><i>A Jew is any person whose mother was a Jew or any person who has gone through the formal process of conversion to Judaism.</i> <br>......... <br><i>It is important to note that being a Jew has nothing to do with what you believe or what you do. A person born to non-Jewish parents who has not undergone the formal process of conversion but who believes everything that Orthodox Jews believe and observes every law and custom of Judaism is still a non-Jew, even in the eyes of the most liberal movements of Judaism, and a person born to a Jewish mother who is an atheist and never practices the Jewish religion is still a Jew, even in the eyes of the ultra-Orthodox. In this sense, Judaism is more like a nationality than like other religions, and being Jewish is like a citizenship. See What Is Judaism?</i> <br>..................... <br> <br><i>In the 1980s, the United States Supreme Court ruled that Jews are a race, at least for purposes of certain anti-discrimination laws. Their reasoning: at the time these laws were passed, people routinely spoke of the "Jewish race" or the "Italian race" as well as the "Negro race," so that is what the legislators intended to protect.  <br> <br>But many Jews were deeply offended by that decision, offended by any hint that Jews could be considered a race. The idea of Jews as a race brings to mind nightmarish visions of Nazi Germany, where Jews were declared to be not just a race, but an inferior race that had to be rounded up into ghettos and exterminated like vermin.  <br> <br>But setting aside the emotional issues, Jews are clearly not a race.</i> <br> <br><a href="http://www.jewfaq.org/judaism.htm#Nation" target="_blank">http://www.jewfaq.org/judaism.htm#Nation</a></p>'
