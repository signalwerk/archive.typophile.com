  - id: 20383
    user: 1262
    date: 2003-12-14T19:32:00
    date_raw: 14 Dec 2003 — 7:32pm
    votes: null
    html: "<p>Maybe it's time to move this over to the non-typographic thread. <br> <br><i>There is graffiti the world over (including one I saw in Halkidiki, Greece, last year) saying things like \"$ + Star_of_David = Swastika\". But the Star of David stays in the font.</i> <br> <br>What do you think was meant by the Star of David in that graffito? Israel or Judaism? If the latter, are you saying that the Star of David should be removed from the Bookshelf 7 symbol font because it may offend antisemites? There is a massive rise in antisemitism in the world, and Israel's existence and actions seem to me more an excuse than a cause. The plight of the Palestinian people is being used to legitimise hatred of Jews that is not new, is not a result of the situation in the Middle East, but is the same old cancer of hatred that has characterised European attitudes to Jews for centuries. I happen to think that it is perfectly possible to criticise the Israeli government and security forces, identify Ariel Sharon as the war criminal that he is, oppose the building of settlements in the occupied territories, favour the existence of a Palestinian state, etc. without accepting even a whiff of antisemitism. <br> <br> <br>Hrant, I am not being spineless in recognising a distinction between the expressions people use and their intent, especially in this emotional and historically charged discussion. Trust me, if I came to the conclusion that you actually are an antisemite, I wouldn't hold back from saying so. <br> <br>As a Catholic, I encounter antisemitism on a depressingly regular basis, most often from people who don't even realise that they are being antisemitic. They've simply grown up in a culture that has 1600+ years of ingrained prejudice behind it, and in a Church that has a long and problematic relationship with Judaism (despite the recent Vatican teachings against antisemitism). So maybe I'm particularly sensitive, but when I see careless language concerning Jews I'm very aware of how that is received by many people: with a nod and as a confirmation of their prejudices, and as a very hurtful threat against the security and lives of Jewish people. I don't have a problem with anyone being critical of Israeli policies -- I even accept arguments about whether the state of Israel should exist as legitimate debate --, but please, people, be careful how you phrase things and don't let your protestations be fuel for hatred of Jews. That's all.</p>"
