    html: "<p>Some superb coverage of symbolism: <br><a href=\"http://news.bbc.co.uk/2/hi/americas/3320237.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/americas/3320237.stm</a> <br> <br>-- <br> <br>Every year, in the shopping malls of America -the <i>real</i> classrooms of this society- the menorahs get bigger and the christmas trees get smaller... and still not a whiff of a crescent anywhere. I personally don't mind the menorahs - I mind people not noticing. <br> <br>Equality of religion. Just that some religions are more equal than others. <br>I can't change the reality of human nature, but at least I can point it out. <br> <br>And I wonder how long the poor snowman will last as Santa's replacement. <br>Neutrality is only useful to the rich when it's a transition to more authority. <br> <br>hhp <br></p>"
