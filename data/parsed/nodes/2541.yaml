    html: <p>Myke, <br> <br>Ahoy, and more silly is the fuss these people get themselves into. Name calling. You know something, when I was young they used to sing a song. <br> <br><i>sticks and stones will break my bones but names will never hurt me.</i> <br> <br>Mike, that's a lie, name calling hurts. <br> <br>It's just plain mean spirited. Absolutely no reason for incorrectly branding  people. Particularly friends. I mean read about this jerk. <br> <br><a href="http://history.freeyellow.com/mccarthy.htm" target="_blank">http://history.freeyellow.com/mccarthy.htm</a> <br> <br>The word <i>anti-semitism</i> used on innocent people symbolizes for me something far worse than the swastika. After all the 'evil' swastika is a symbol for a defunct political organization run by a crack-pot dictator, who now, thankfully, is dead. Unfortunately he was a great teacher. He used the same propaganda techniques as those that use the word <i>"anti-semitism"</i> to silence protest. <br> <br>To win argument at cost of human dignity or common respect. <br> <br>Thank you from saving me. I have been held hostage by mobbish bullies. Sometimes I wonder who wears the sheets. I appreciate that. You know, I was just thinking I didn't have a friend in the world and then you came along. <br> <br>I think the whole thing with Microsoft is silly. I find it unimaginable they could have missed that by accident. I do not believe that there was any nasty intentions for their inclusions however. I see no reason for over reacting. But I imagine some one used the <i>anti-semitism</i> word on them. <br> <br>Silly, although the right thing to do, to provide a tool for removal. However the problem I see is that the only people who will use it are the same people that would  not hit the Swastika Key in the first place. <br> <br>It is kind of like taking the guns from the good guys and giving them to the bad. But still, Microsoft has done the right thing, no matter how silly it is. <br> <br>Anything is better than been accused of <i>anti-semitism</i>. <br> </p>
