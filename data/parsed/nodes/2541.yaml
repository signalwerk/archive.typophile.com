    html: "<p><i>John, I understand that there is antisemetism in the world, but relating this back to the entire idea of this discussion, do you honestly believe that by removing the swastika from the font will stop any antisemitism. It is my belief that the only way you will ever stop this form of persecution is by exposing it and making people aware of it.</i> <br> <br>Sigh. I never said that removing the swastika from the MS fonts would achieve anything. In fact, I never related MS's decision, not once, to the issue of antisemitism. I only mentioned antisemitism when I saw statements in this thread that appeared to me to be antisemitic: as you say, the way to combat antisemitism is to expose it and make people aware of it. <br> <br>I do agree with Paul Nelson from MS that the context in which characters are used is important, and that there was no good reason for the Bookshelf 7 font to contain the swastika (nor the Star of David, for that matter, but I don't accept the parallel between the two symbols that Hrant is trying to make on Typographica), and that without a clear context justifying inclusion of such contentious symbols it is best to remove them.</p>"
    html_clean: "<p><i>John, I understand that there is antisemetism in the world, but relating this back to the entire idea of this discussion, do you honestly believe that by removing the swastika from the font will stop any antisemitism. It is my belief that the only way you will ever stop this form of persecution is by exposing it and making people aware of it.</i> <br> <br>Sigh. I never said that removing the swastika from the MS fonts would achieve anything. In fact, I never related MS's decision, not once, to the issue of antisemitism. I only mentioned antisemitism when I saw statements in this thread that appeared to me to be antisemitic: as you say, the way to combat antisemitism is to expose it and make people aware of it. <br> <br>I do agree with Paul Nelson from MS that the context in which characters are used is important, and that there was no good reason for the Bookshelf 7 font to contain the swastika (nor the Star of David, for that matter, but I don't accept the parallel between the two symbols that Hrant is trying to make on Typographica), and that without a clear context justifying inclusion of such contentious symbols it is best to remove them.</p>"
