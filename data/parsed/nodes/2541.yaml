    html: "<p>I added the cross back when it was suggested that those who opposed the attack on Iraq might add something 'peace' related to their Typophile picture. I'm not a 100% pacifist -- peace, yes, but not at any cost --, and I don't much like the 'peace symbol' (actually the old CND logo). So the cross is there in remembrance of the people who were being killed: in my religion one of the roles of the cross is as a memorial sign. So there's your interpretational context.</p>"
