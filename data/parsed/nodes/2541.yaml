    html: <p>John, I understand that there is antisemetism in the world, but relating this back to the entire idea of this discussion, do you honestly believe that by removing the swastika from the font will stop any antisemitism. It is my belief that the only way you will ever stop this form of persecution is by exposing it and making people aware of it. By removing the swastika, Microsoft has only swept another element under the rug, and this cannot be seen as a step forward against anti-semetism. Rather, this has hindered the cause, as people are able to make not thinking about this topic that much easier. Only when people become comfortable with and undertstand the meaning of the words Jewish, Jew, Nazi, etc. and the visual symbols that go along with them will people actually be moving in the right direction. <br> <br>By the way, I might be wrong when I'm saying this, but I don't believe the Hrant was saying that he thinks that the Star of David should be removed, he was just using this to show the fallacy of Microsoft's removal. Sorry if I interpreted it wrong, but whether or not he meant it that way, I whole-heartedly do.</p>
