    votes: null
    html: <p>This whole thing just seems silly and wrong in many ways. How can Microsoft believe that by removing the swastika from a typeface that they are doing the world any sort of good? It's just denying a part of the past, one that in my opinion should not be forgotten. Probably the next step would be to photoshop out any sign of a swastika from their photos in Encarta. I actually read a newspaper article a long time ago, where a teacher was demanding that the school board remove all photographs of Hitler and especially any photo with a swastika in it as supposedly they promote hate crimes. Now, maybe I just had teachers with a different sense of the cirriculum, but I remember WWII being explained as a dark time for humanity, not a promotion for Nazis. <br> <br>In short, as soon as we start to forget or wash over things that have happened in the past that we did not like, they are bound to happen again. If Microsoft is so worried about people's reaction to the swastika, then why not start an education program on what the swastika means and why it should not be forgotten instead of erasing a very important part of world history?</p>
