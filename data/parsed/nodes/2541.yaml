    html: "<p>Gerald, you're just not getting it, are you? Read my last message again. I'm not calling you an antisemite: I'm saying that your statements read as antisemitic because whether you realise it or not you are using phrases and ideas that belong to an establish antisemitic discourse. Remember, for 1600 years almost every statement about Jews by non-Jews has been negative and inciteful. In that context, you can't simply open your mouth and trot out statements like 'Nazis disguised as Jews' and not have it sound antisemitic, whatever your actual intent. <br> <br>All I'm saying is that you -- and me, and everyone else -- needs to be very careful and very specific in our language. <br> <br><i>Anything is better than been accused of anti-semitism.</i> <br> <br>Is antisemitism better than being accused of antisemitism? I'm not interested in 'silencing protest' or 'winning arguments at any cost'. I'm interested in you realising what your actual statements convey to people, rather than what you might think or hope they convey.</p>"
