    html: <p><i>In the same way you have stated that certain comments may appear antisemitic (their true intention irrelevant to their interpretation) will you concede that your cross sends out a rather medieval message, regardless of your honourable intentions? </i> <br> <br>No, I don't concede it at all, since the cross is the central emblem of Christianity, not of particular historic events of the mediaeval period, let alone the fumbled words of a twit like George Bush. Would I be offended if a Muslim Typophile included the crescent moon in his picture? No, not at all, despite the fact that Muslim armies assaulted Christian lands in the Middle East and Europe for a heck of a lot longer than the crusades lasted. I don't see the crescent moon and think of all those centuries of religious warfare, and more than I think of a couple of decades of Israeli history when I see the Star of David. <br> <br>However, I am offended by the suggestion that, in the name of not offending other religions, we should supress all public religious expression. In my experience, only secularists and atheists actually propose and benefit from such policies, and their aim is not harmony between religions but the destruction of religion.</p>
