    html: <p>I mind the menorahs. I mind the syndrome that makes western Christians so uncomfortable with the fact that not everyone celebrates Christmas, that they need to see other religions' winter holidays as simply alternate flavors of Christmas. <br> <br>I mind the menorahs because they say, "Chanukah is the Jewish Christmas," which relieves anyone of the burden of actually finding out what Chanukah <i>really</i> is, or of dealing with the ambiguity of religious variety. <br> <br>I mind the menorahs because they are another way of marginalizing those who don't celebrate Christmas <i>or</i> Chanukah.</p>
