    html: "<p>Gerald, I generally don't accuse <i>people</i> of antisemitism*, because often the people who make antisemitic statements have no clue that what they are saying belongs to an established anti-Jewish discourse. Your statements seemed to me be antisemitic. Criticising the policies and actions of the Israeli government is not antisemitism; calling them 'Nazis disguised as Jews' is. Gagging at the combination of 'human rights organisation' with 'Jewish' looks like an antisemitic reaction whether it is consciously intended as such or not. I'm not singling your statements out, Gerald; over on Typographica we had Hrant evoking the stock antisemitic international Jewish conspiracy theory with his 'dark undercurrents of international lobbying', and his bizarrely veiled references to a 'party' and 'people' with an agenda (whose 'tool' I apparently am because I disagree with Hrant); again, I don't think Hrant is necessarily intending to be antisemitic, but he is using terms and evoking ideas that belong to that discourse. <br> <br> <br>* In the sense in which the term is clearly and unambiguously understood by pretty much <i>everyone</i>. The insistence on the dictionary definition of Semite to negate the use of the term antisemitic is itself a well documented strategy of antisemites, who seek to deny the unique historical phenomenon of antisemitism in European culture. Other forms of European racism -- anti-Black racism for example -- are no less ugly and indefensible, but they are of a different character (in large part because they have not developed over almost 2000 years and are not so ingrained -- so ingrained that even people who do not consider themselves antisemtic hold Jews to standards that do not apply to any other peoples). The term antisemitism has been used to describe this phenomenon for a long time: when 19th century racialists wrote about 'the Semite' they meant a Jew. Individuals may, more accurately, be anti-Jewish, but their statements -- and even the statements of people who do not consider themselves anti-Jewish -- are likely to belong to a long tradition, and that is what we call antisemitism.</p>"
