    <p>Hello everyone,</p>
    <p>I'm currently starting a new company as a graduation assignment together with a friend of mine, and we are looking for some feedback on a logo we designed. We are both developers and therefor not so good at designing a logo :)</p>
    <p>We are going to develop mobile applications and games using Flash Lite. We came up with something and are wondering if you might have some critique.</p>
    <p>Thanks in advance,<br>
    Jasper</p>
