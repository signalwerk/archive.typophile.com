      <p>Speaking of advanced reading technologies, I have a new pair of glasses which I occasionally use to decipher handwriting.</p>
      <p>But seriously:<br>
      I won’t be applying for the job, however, there is one thing I think the ART team really could do, and that is to incorporate readability measurements into the type design process, i.e. product development. This would involve making variants of a typeface and testing which reads best. So far, all I have ever come across in the science of reading is one published typeface measured against another quite different typeface, or at best a face refined with ad hoc feedback from users. I’ve designed commissioned faces where several variants have been presented to the client, and these have been tested in mock-ups with focus groups, but the feedback is <em>ad hoc</em> rather than scientific.</p>
