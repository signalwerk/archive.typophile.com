      <p>Karsten, 'storytelling' -- new forms of literature -- strikes me as only one area in which reading on screen might differ from books, and not personally interesting to me. I spoke specifically about what one might be able to do differently with <em>text</em> on screen, and I meant in the visual sense of text not the literary. Sorry if that wasn't clearer. One obvious thing is the use of colour, which has tended to be absent from typographic printing -- due to cost, I think -- but which has a rich manuscript tradition, e.g. in Arabic and some Jewish vocalised texts and in Ethiopic in which bichromatic punctuation signs are normative in the manuscript tradition. The ART team has been exploring ways in which empirical testing might feed back into design -- which is why when they talk about 'better' they usually have an actual measure in mind --, and this strikes me as an area in which one might be able to determine whether something like traditional use of colour in text might actually aid aspects of reading such as comprehension. And if it does, then it raises the question how else might colour be used, and what would the result be?</p>
      <p>Printing has tended to be conservative; more so than the manuscript tradition in many respects. In large part this seems to me to have been the result of the manufacturing costs of type for most of the past 550 years, and the the material costs of publishing. No one wants to take risks when so much is at stake. Publishers are rightly wary of publishing books using novel types, let alone introducing new punctuation symbols or varying conventional typographic norms. What if no one wants to buy it? But the same electronic document can be read on screen in any variety of style sheets, and the reader can even apply his or her own preferences. How might this be extended? Style sheets for the most part remain static: they present a single way of viewing and reading, selected by the publisher or, less often, by the reader. Are more dynamic methods possible? Part of the job of a typographer is to select a typeface and layout appropriate to the subject matter and literary style of a document, taking into account both convention and possibilities for innovation. We all have an idea of what a novel looks like versus an annual report, and of what range of typeface options might apply to each. My guess is that a computer can very easily be taught to recognise what kind of document a reader is looking at, so could apply appropriate styles automatically. Or a reader could say 'This is what I want novels to look like when I read them' and 'This is how I want to read a newspaper' etc., and the computer would determine the document type and apply the desired style.</p>
      <p>You mentioned adaptive layout, and the trouble that designers have had 'getting the idea'. I agree, and I'm thinking its because adaptive layout probably isn't a design 'problem' in any traditional sense -- the sense of determining how a thing should look --, but is really an algorithmic problem: how to best fit this content into this area, and that seems to me mostly automatable if one knows what kind of content it is and how readers prefer to engage with such content.</p>
