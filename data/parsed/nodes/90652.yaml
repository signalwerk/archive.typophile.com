      <p>J.H. – <cite>but I think to make reading on screen a better experience you need to start thinking about what you might be able to do with text on screen that you can't do in a book</cite></p>
      <p>I agree. At the same time MS's "better" differs from your "better": The job description, in light of past activity, is mostly about the medium side, dealing with screens and their possibilities and limitations as to what they can display. What you bring up now is the narrative or storytelling side, which is not something I saw MS being concerned about. (And they shouldn't or don't need to.)</p>
      <p>K.S. – <cite>was a good overview of what is possible ...</cite></p>
      <p>The aspect of adaptive/flexible (and typographically refined) layout as made possible by wpf or html5+css3 is an old hat to me. Still I have trouble to understand why it did not happen ten years earlier.<br>
      Taking into account what John said and approaching it from the storytelling side, the adaptive-yet-typographic-layout technology is means rather than ends, it is but one core material condition <em>among others</em> to make new kinds of storytelling possible.</p>
      <p>K.S. – <cite>... but most publishers are only just getting to grips with these concepts, let alone the tools that make great digital typography possible</cite></p>
      <p>It needs new generations of publishers and designers.<br>
      Current print designers have trouble enough getting the idea of adaptive layout, which in turn requires conceptual/structural thinking rather than the static collage type of thinking. Ironically enough, an <em>earlier</em> generation of book typographers, working with tools like Berthold typesetting programs, were familiar with structural thinking – but most likely are long retired. (Put differently: PageMaker, XPress, InDesign, following a fixed collage mode of thinking, caused typesetters/typographers to un-learn structural thinking.)<br>
      And I think you over-emphasize the aspect of learning tools. Tools are easy to learn when you know what you want to do with them. The problem is that designers/publishers don't know what they want.<br>
      Moreover, what's an ebook, since you pointed at the presentation? Isn't that part of the problem rather than being the solution? Mostly it is about packaging old content in a slightly modified way ...</p>
