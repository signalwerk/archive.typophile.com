      <p>"but I think to make reading on screen a better experience you need to start thinking about what you might be able to do with text on screen that you can't do in a book."</p>
      <p>This is one of the major problems facing traditional publishers. There are many talented designers working on print material that do not understand how to engage with digital technologies beyond trying to transition traditional content to new formats and platforms. It is difficult but I think there is a lot to be gained from getting those designers to think about and work natively in digital publishing environments. Typographically so much more is possible now than even a couple of years ago and the technology is developing all the time.</p>
      <p><a class="freelinking external" href="http://www.toccon.com/toc2012/public/schedule/detail/22271" rel="nofollow">The Future of Reading</a> session at the recent Tools of Change conference was a good overview of what is possible but most publishers are only just getting to grips with these concepts, let alone the tools that make great digital typography possible.</p>
      <p>It sounds like a fascinating job and it is great that Microsoft continue to see the importance of those elements as part of single focused role.</p>
