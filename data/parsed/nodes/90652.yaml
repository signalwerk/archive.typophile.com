      <p>John – <cite>and I meant in the visual sense of text not the literary</cite></p>
      <p>Text(ure) production in a quite literal sense – then we are on the same page, including the entire second paragraph.</p>
      <p>As to the first paragraph: Given that "to make reading on screen a better experience than reading from a book" (from the text in question) is so boldly put, I would not have thought of something as simple as color. It was just normal with manuscripts and early printed pieces, and it had its come-back with website design (for visualizing the structure of a text and for indicating functionality). In so far I would turn the last sentence upside down: Not asking the theoretical question how else color might be used, but going by the assumption that each document will provoke the practical question how to visualize it.</p>
      <p>I don't see why adaptive layout should not be a design problem. It, too, is about getting relations/proportions right, among other things. The algorithm is the implementation of the answer to the question how a thing should look. The only difference is that it is not about how an individual fixed thing should look but about how a thing that adapts to certain medium-determined conditions should look. The target is not a static but a moving one. And your "if one knows what kind of content it is and how readers prefer to engage with such content" is nothing else but "design problem".</p>
