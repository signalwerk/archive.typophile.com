      <p>Karsten: <em>The only difference is that it is not about how an individual fixed thing should look but about how a thing that adapts to certain medium-determined conditions should look.</em></p>
      <p>This prompts two thoughts.</p>
      <p>The first is that adaptive layout doesn't need to presume <em>certain</em> medium-determined conditions; it can also presume <em>un</em>certain conditions, and this is where I see a difference between adaptive design and adaptive process. Adaptive design tends to extend concepts from static design into an adaptive framework bounded by certain conditions. An adaptive process is one that is scalable to unknown conditions.</p>
      <p>The second thought is that adaptability, in terms of display of electronic documents, may be a strong constraint within at least some important conditions. Now, good design thrives on constraints, or at least responds to them effectively, but strong constraints are determinative of form, and hence at once limit design options and offer themselves to automated solutions. This thought can be expressed in a question: 'How many viable options are there to lay out a particular document type adaptively on my phone?' My sense is that while there remain many design decisions to be made in the styling of documents, there are relatively few options in terms of effective layout at the smaller end of the media spectrum, i.e. where people are reading more and more. So that strikes me as something that is at once not a significant arena for design, but conversely a great area for automation.</p>
