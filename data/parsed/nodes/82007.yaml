    <p>Hi,</p>
    <p>I have only started reading posts on this forum today, so apologies for any faux pas I may commit. </p>
    <p>I am considering using Optima as the typeface for an organic cosmetic company. The basic attributes I am after are: Beauty, Nature, Friendliness, Elegance. In a nut shell I am after "natural beauty".</p>
    <p>What do you think about using Optima as the typeface for this logo? Also, are you even permitted to use Optima for logos using a regular license. </p>
    <p>Thanks</p>
