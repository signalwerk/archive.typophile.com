    html: |-
      <p>Optima is an elegant and sophisticated typeface, and that's something so universally agreed upon that it virtually became the Helvetica of cosmetics. Optima has been the go-to typeface for the cosmetics industry for decades; so much so that major brands that used it have recently been moving away from it. </p>
      <p>It's not a bad choice but it's not something that's going to differentiate your product in the marketplace.</p>
