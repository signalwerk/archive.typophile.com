      <p>Bendy: I guess I’m looking for design flaws: Letters that are denser (darker) than the other letters in the typeface, ex: a binocular g that isn’t well optically adjusted. </p>
      <p>I’ve got an art project on the stairs with a writer friend. We’re “drawing” with text, hence I’m looking for design features that could give me some shades. We’ll use white space (paragraphs, line breaks) and italics (speach) for light shades, and capitals plus the stuff I’m requesting here for darker shades. It will be quite big, and divided in narrow coloumns allowing us to construct the sentences more carefully. It will be a real short story illustrating itself.</p>
