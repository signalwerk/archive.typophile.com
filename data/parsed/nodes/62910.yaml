    <p>I’m looking for a (text) serif with as/descenders that are darker than the x-height area. I’m not even sure if such a thing excists. They must not be to obvious at close inspection, but notable in a large block of text.</p>
    <p>Also typefaces with letters that are denser then the rest (with the same effect on text color in large blocks of text) are of interest.</p>
