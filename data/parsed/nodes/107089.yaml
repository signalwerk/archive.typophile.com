  html: |-
    <p>Dezcom is proud to announce the release of a new typeface. Dez Petranian is a story-telling fantasy friendly family of fonts. It is a warm face that looks like the spoken word, perfect for tall tails, fantasy-world adventure books, creative writing, and poetry. Dez Petranian includes multiple language support, nearly 1,200 glyphs, stylistic sets, and many alternates. Think of it as a warm reminder of real story writing</p>
    <p><a href="http://www.myfonts.com/fonts/dezcom/dez-petranian/?refby=_dezcom" title="http://www.myfonts.com/fonts/dezcom/dez-petranian/?refby=_dezcom">http://www.myfonts.com/fonts/dezcom/dez-petranian/?refby=_dezcom</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DezPetranianBanner_5901.jpg"></div><p></p>
