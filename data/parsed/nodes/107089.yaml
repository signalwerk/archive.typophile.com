    html: |-
      <p>I approve of creating some more typefaces to fill this particular niche; fantasy books are popular, but they are usually typeset in faces like Times Roman - it shouldn't just be children's story books that make an effort to match the atmosphere of the story.</p>
      <p>Of course, there are existing typefaces suitable for such use, but it just doesn't seem to happen.</p>
      <p>Now, though, with the name of the typeface, I had expected it to support Armenian!</p>
