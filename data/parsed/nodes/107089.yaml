    html: |-
      <p>Incidentally, seeing a typeface intended to promote the right mood for reading a work of fantasy led me to speculate on what the best typeface would be for a book containing nonsense presented as fact... one that would serve as an anaesthetic to the reader's critical faculties. And then I recalled the thread a while back on an article claiming that too-good typography did just that!</p>
      <p>An investigation of the typography used for the works of Le Plongeon, Churchward, von Däniken and Sitchin now suggests itself...</p>
      <p>Typography Is Dangerous!</p>
