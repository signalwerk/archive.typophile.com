    html: |-
      <p>I intended it to be more of a Roman inference.  The name comes from 2 sources:<br>
      1. Petra, Greek word for stone, a tribute to Sumner Stone.<br>
      2. Roman-Latin "ian" as in many names from ancient times as well as more modern fantasy hers.</p>
