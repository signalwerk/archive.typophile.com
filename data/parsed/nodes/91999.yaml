    html: <p>Zadie may be “inspired by Edwardian railings surrounding the Royal Army Medical College in London,” but it certainly wasn’t inspired by Edwardian letterforms. It's certainly whimsical, but it falls into illegibility pretty quickly at smaller sizes…IMHO.</p>
