  html: |-
    <p>I'm looking for a font from (or derived from) the Edwardian era - (Not the font, 'Edwardian' or Edwardian Script)<br>
    It must be...<br>
    Legible on HD res screen for relatively quick reading<br>
    Hint at Elegance and Romance without being overtly so<br>
    It could be either...<br>
    A font from that era<br>
    or...<br>
    A contemporary interpretation derived from signage or calligraphy of the era.<br>
    Any advice would be gratefully received,<br>
    Thanks<br>
    Alex</p>
