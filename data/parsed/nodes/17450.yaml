      <p>Johsnton never considered his work for LU a typeface. He called it an "alphabet" for signage and display only - never envisioned some of its present uses. It is truly monolineal, but I still like it better than Gill for display. Johnston isn't perfect, but anyone that visits London knows that it just plain works. This link is interesting as a corporate identitiy textbook:<br>
      <a href="http://www.tfl.gov.uk/tfl/about/corp-design/design-standards.asp" title="http://www.tfl.gov.uk/tfl/about/corp-design/design-standards.asp">http://www.tfl.gov.uk/tfl/about/corp-design/design-standards.asp</a></p>
