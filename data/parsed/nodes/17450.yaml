    html: <p>It's no surprise that the face had or has its faults. Not so long ago, I was reading 'London's Handwriting, the development of Edward Johnston's Underground Railway block-letter' by Colin Banks, and in it he states that Johnston did not believe in roughs, trials or mocks. Instead,"The first complete working out, would if possible, be the final thing".</p>
