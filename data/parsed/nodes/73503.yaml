  html: |-
    <p>Hi,</p>
    <p>This is my new typeface project, inspired by attached image of Alvar Aalto's design for a door handle ("VEDÄ" = pull, "TYÖNNÄ"  = push in Finnish). I fell in love with the unorthodox proportions of Aalto's lettering (which was of course made to fill certain width) and I have tried to keep that mood in my letterforms. I'm planning to include some alternative glyphs of different widths so user can more easily create words that have right amount of narrow and wide letters.</p>
    <p>Though Aalto's Ä is superb, I couldn't figure out any decent way to make it work, so I just made up my version.</p>
    <p>Any comments / suggestions are welcome!<br><img src="/sites/default/files/old-images/alvar_6480.jpg"></p>
