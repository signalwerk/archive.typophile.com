    <p>I'm unsure of the best way to present this paragraph. The first has oldstyle figures and the second has lining.<br>
    There's a mix of currency (R), numbers, percentages and times of day. </p>
    <p>To my eye the lining figures look neatest, but perhaps I should think about using oldstyle because it's part of an extended block of text where there will be other numerals dotted around. </p>
    <p>I've turned the am and pm into small caps and now wonder if the R (rand) currency symbol should be a small cap too (if I go with OSF). Is it conventional to have the currency symbol before the numeral or after?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SA info_6662.jpg"></div><br>
    What's the general preference?<p></p>
    <p>(And I've just noticed that hyphen between Cape Town and Simon's Town, which I'll change to the word 'to'.)</p>
