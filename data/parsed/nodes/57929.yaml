      <p>Hi Bendy</p>
      <p>Definitely o/s numerals with the small caps, and this nice classy face.<br>
      For the "R8" I'd manually decrease the height of the R about 10% I don't know that a true small-cap will be appropriate there.</p>
      <p>For the phone number you might consider changing 'Tel' to small caps as well. </p>
      <p>If you do end up with the lining, be sure to bump the hypens up a half-point or so ;-)</p>
      <p>Cheers<br>
      Peter</p>
