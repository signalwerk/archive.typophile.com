      <p>Oh I also discovered, that if you start with the 2 circles as suggested by Hrant, Group them, then go to Object&gt;Transform&gt;Transform Each and set the Scales to something less than 100% (I used 90%) and set Rotate to 30 degrees and press the Copy button. Then duplicate this over and over (Ctrl+D or Cmd+D), till you get what look like 2 spirals that seem to reduce infinitely. When you've duplicated till your hearts desire. Select all these new circles, group them and then rotate them 45 degrees, do this 2 more times for a much tighter looking spiral-graph.</p>
      <p>Comparison Spirals:</p>
      <p>Original Technique on Left. New Technique on Right.</p>
