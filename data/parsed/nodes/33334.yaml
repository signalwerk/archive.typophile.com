      <p>I'm not sure how to do a tutorial for this. It's something you have to experiment with to really get the idea. </p>
      <p>Just draw 2 or more lines, then blend them together with a few steps. Using the direct select arrow (the white arrow) select the lines that form the blend and add anchor points or using the Convert Anchor Point tool (carrot), add curves. The effect becomes even more apparent when you crisscross curved lines. </p>
      <p>Below is a simple blend of 2 lines with 10 steps. The lines have a simple s curve and I rotated the bottom line 90 degrees perpendicular. The lines I started with are in black and the blended lines are red.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/curve_3749.gif"></div><p></p>
