      <p>timd: actually, you're right, it's based on 12-fold symmetry, rather than a Fibonacci spiral.</p>
      <p>So probably the simplest way to do this is to take a 1/12th slice, draw it more or less by hand, then replicate it around 12 times. That slice also has a mirror symmetry, but it may be easier to just draw both halves rather than trying to draw a single half and doing a mirror copy.</p>
      <p>I find the Fibonacci spiral more appealing - it's closer to what's in nature - but it is more complicated to pull off, for sure.</p>
