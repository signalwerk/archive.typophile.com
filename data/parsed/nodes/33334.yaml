    html: <p>Eben, I did something similar for a project in college using the Transform Palette. But, more recently I figure out how to do it using the Blend tool, which gave me a lot more control and broke away from that Spiral-graph look. Start with 2 lines (straight or curved) then blend them together using 20, 50, 100 steps, sometimes the more the merrier. You can alter the lines themselves (adding anchor points and curves), and/or you can alter the blend path (more anchor points and curves as well). You can also blend multiple lines together for an even more intricate look. This method would be closer to mimicking that Certificate look.</p>
