    html: |-
      <p>Do you want to create the shape before it was distorted?<br>
      It is essentially based on a twelve pointed star with curved sides, create a basic star in Illustrator to get the centre and then draw one half petal using the start and finish points of one segment of the star, reflect/copy that to form one petal, position your smallest circle and use the rotate tool to position it along the line of the petal, using the centre of your base star as the point it rotates around, and then scale them, reflect/copy the circles and using the centre again rotate copy them 30º.<br>
      More confusing to write than do, honest.</p>
      <p>Tim</p>
