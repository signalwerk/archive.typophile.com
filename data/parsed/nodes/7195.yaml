  html: <p>It's rather shocking that ITC doesn't include the alternate characters in <a href="http://www.itcfonts.com/fonts/detail.asp?sid=R75XH6KCTKXJ9KKME3TGE3AP1PKA7FDF&amp;sku=ITC2450" target="_blank">the Busorama it sells on its site</a>. That's true of all their older fonts, I guess. (ITC Bookman, ITC Avant Garde, etc.) I think they would do well to re-release these as OpenType with all the original characters included.</p>
  html_clean: <p>It's rather shocking that ITC doesn't include the alternate characters in <a href="http://www.itcfonts.com/fonts/detail.asp?sid=R75XH6KCTKXJ9KKME3TGE3AP1PKA7FDF&amp;sku=ITC2450" target="_blank" class="link-external">the Busorama it sells on its site</a>. That's true of all their older fonts, I guess. (ITC Bookman, ITC Avant Garde, etc.) I think they would do well to re-release these as OpenType with all the original characters included.</p>
