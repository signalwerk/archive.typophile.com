    <p>I have a document that I'm designing which has normal auto page numbering in the bottom left corner.</p>
    <p>I also have a section in the middle of the document that is going to change order as we edit.<br>
    I would like to find a way to have something like auto page numbering as well so that if I reorder these pages, they get auto-renumbered as well. Almost like having two sets of page numbers. </p>
    <p>Heres an example</p>
    <p>pg. 1 TOC<br>
    pg. 2  Content<br>
    pg. 3  Content<br>
    pg. 4  1.1<br>
    pg. 5  1.2<br>
    pg. 6  1.3<br>
    pg. 7  Index</p>
    <p>In this example, if I swap pages four and 5, the auto page numbering in the left is still correct, but now 1.2 comes before 1.1</p>
    <p>I hope this makes sense and would appreciate any help you can give.</p>
    <p>Thanks,</p>
    <p>-Thomas</p>
