    html: |-
      <p>I was a-lurking, hoping someone else would chime in with a brilliant solution and/or a valid reason why it can't work...</p>
      <p>Try these ideas for size (OTOH and such disclaimers):</p>
      <p>InDesign can't 'flatten' auto pagination to real numbers [*]. So if you use real page numbers, you cannot move pages around keeping the same numbers. That's #1. Besides, you mention you already are using those 'real' numbers.</p>
      <p>However, moderately modern versions of CS (you don't mention a version number--hint) have <em>auto-numbering lists</em>. Now you <em>can</em> convert these to text. On the other hand, it's not necessary if you create linked text frames from each page to the next, containing a paragraph with an auto number (so each paragraph appears once on each page), you can move the pages around at will. The original link connections between the pages will still be there, so the original order of the numbering stays the same. That's #2.</p>
      <p>For hard core InDesign questions, feel free to subscribe to <a class="freelinking external" href="http://www.adobeforums.com/webx/.3bbf275c/" rel="nofollow">Adobe's InDesign User to User Forums</a>. The very best minds--as well as me--that work daily with ID hang out there, and occasionally an interesting question may attract actual Adobe employees. (Not endorsed by the firm--off the record, so to speak.)</p>
      <p>[*] If you feel it'd be a valued addition to the package, put it on <a class="freelinking external" href="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform" rel="nofollow">Adobe's InDesign Wish List</a>. Pers'nally, I prefer to stick to the natural order Descartes proposed. :-)</p>
