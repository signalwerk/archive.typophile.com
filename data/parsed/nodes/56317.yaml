      <p>Maybe I'm missing something here, but I'd just put my auto page numbers in in another set of master pages. When done, or just before printing a version, "apply master to pages . . ."</p>
      <p>I believe you can also "delete master from pages" if you absolutely have to reorder after applying. If so, just delete, reorder, and re-apply.</p>
