    html: |-
      <p>Show the logotype or show something similar, that would be helpful. Is it set tight, loose, in all caps, with background, in a box etc.?</p>
      <p>Btw. it's not necessarily good that a corrosponding serif shares too much design with the logotype face. Think of contrast, tension.</p>
      <p>You might ask for a serif that works with Akzidenz Grotesk (BC is [identical] similar design), some folks knows AG better.</p>
