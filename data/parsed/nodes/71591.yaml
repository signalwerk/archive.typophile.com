    <p>Hi,</p>
    <p>I am looking for any suggestions for a transitional or modern serif that will pair well with a logotype that uses Basic Commercial Black: <a href="http://new.myfonts.com/fonts/linotype/basic-commercial-lt/" title="http://new.myfonts.com/fonts/linotype/basic-commercial-lt/">http://new.myfonts.com/fonts/linotype/basic-commercial-lt/</a></p>
    <p>Thanks in advance.</p>
