    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Edward&nbsp;Johnston</strong></p>
    <p>English letterer most famous for his book <a href="/node/14645" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writing <span class="amp">&amp;</span> Illuminating, <span class="amp">&amp;</span> Lettering</a> and his commissioned work on the lettering for the <a href="/node/add/wiki?edit%5Btitle%5D=London%20Underground" title="Create node &quot;London Underground&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">London Underground</a>, which was later turned into a typeface for use by the same organization and, famously, served as the basis for <a href="/node/12115" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eric Gill</a>’s <a href="/node/12627" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gill Sans</a>.</p>
