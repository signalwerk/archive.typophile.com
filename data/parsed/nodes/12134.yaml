    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Edward Johnston</strong></p>
    <p>English letterer most famous for his book <a href="/wiki/Writing%20and%20Illuminating%20and%20Lettering" class="freelinking" rel="nofollow">Writing &amp; Illuminating, &amp; Lettering</a> and his commissioned work on the lettering for the <a href="/wiki/London%20Underground" class="freelinking" rel="nofollow">London Underground</a>, which was later turned into a typeface for use by the same organization and, famously, served as the basis for <a href="/wiki/Eric%20Gill" class="freelinking" rel="nofollow">Eric Gill</a>'s <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a>.</p>
