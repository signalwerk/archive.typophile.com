    date: 2009-05-22T13:29:00
    date_raw: 22 May 2009 — 1:29pm
    votes: null
    html: <p>The tilde before the component is an instruction not to reposition the component. One assumes that the .case or .small accents are designed at the appropriate height to correctly position over the glyphs. If you left the tilde out FontLab would raise the position of the accent assuming it was originally positioned for the lowercase.</p>
