    date: 2009-05-06T06:39:00
    date_raw: 6 May 2009 — 6:39am
    votes: null
    html: |-
      <p>It is a text edit procedure. Here are the first few lines of the alias.dat file:</p>
      <p>%%FONTLAB ALIASES<br>
      % Build 2005-09-05 for FontLab Studio 5.0 or higher<br>
      AE A_E<br>
      AEacute AE+~acute.case<br>
      AEacute AE+acutecomb<br>
      AEacute AE+acute<br>
      AEacute.small AE.small+~acute.small<br>
      Aacute A+~acute.case<br>
      Aacute A+acutecomb<br>
      Aacute A+acute<br>
      Aacute.small A.small+~acute.small<br>
      Abreve A+~breve.case<br>
      Abreve A+uni0306<br>
      Abreve A+breve<br>
      Abreve.small A.small+~breve.small<br>
      Acircumflex A+~circumflex.case<br>
      Acircumflex A+uni0302<br>
      Acircumflex A+circumflex<br>
      Acircumflex.small A.small+~circumflex.small<br>
      Adieresis A+~dieresis.case<br>
      Adieresis A+uni0308<br>
      Adieresis A+dieresis<br>
      Adieresis.small A.small+~dieresis.small<br>
      Agrave A+~grave.case<br>
      Agrave A+gravecomb<br>
      Agrave A+grave</p>
      <p>As you can see there are several formulas for constructing the composite glyph. If the components are available for the first formula, it will be used. If not the the second formula will be tried, and finally the third.</p>
      <p>You can edit these, so if you don't use .case, but use .cap instead, do a find and replace and change it.</p>
      <p>Just make sure you have a backup of the original in case you screw it up.</p>
    html_clean: |-
      <p>It is a text edit procedure. Here are the first few lines of the alias.dat file:</p>
      <p>%%FONTLAB ALIASES<br>
      % Build 2005-09-05 for FontLab Studio 5.0 or higher<br>
      AE A_E<br>
