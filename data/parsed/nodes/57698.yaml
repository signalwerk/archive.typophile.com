    <p>Well, this is probably a easy one:</p>
    <p>When working in FreeFont mode, how can I assign automatically a lower-case acute mark to a lower-case glyph and a upper-case mark to a upper-case glyph?</p>
    <p>Fontlab insists on giving lower-case marks to all characters.</p>
    <p>Thank you in advance.</p>
