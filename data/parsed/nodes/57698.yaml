      AEacute.small AE.small+~acute.small<br>
      Aacute A+~acute.case<br>
      Aacute A+acutecomb<br>
      Aacute A+acute<br>
      Aacute.small A.small+~acute.small<br>
      Abreve A+~breve.case<br>
      Abreve A+uni0306<br>
      Abreve A+breve<br>
      Abreve.small A.small+~breve.small<br>
      Acircumflex A+~circumflex.case<br>
      Acircumflex A+uni0302<br>
      Acircumflex A+circumflex<br>
      Acircumflex.small A.small+~circumflex.small<br>
      Adieresis A+~dieresis.case<br>
      Adieresis A+uni0308<br>
      Adieresis A+dieresis<br>
      Adieresis.small A.small+~dieresis.small<br>
      Agrave A+~grave.case<br>
      Agrave A+gravecomb<br>
      Agrave A+grave</p>
