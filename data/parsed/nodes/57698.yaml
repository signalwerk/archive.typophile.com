    user: 17101
    date: 2014-07-31T12:09:00
    date_raw: 31 Jul 2014 — 12:09pm
    votes: null
    html: |-
      <p>Aacute A+~acute.case<br>
      aacute a+~acute</p>
      <p>From the FontLab forum:<br>
      “You'll find it in the "Creating Composites and Ligatures" section in the manual:</p>
      <p>In the composition recipe, the "+" command may be followed by one or<br>
      two alignment commands:<br>
      ^ align component to the uppercase position<br>
      ~ do not move component vertically<br>
      &lt; align component to the left of the base glyph<br>
      &gt; align component to the right of the base glyph<br>
      | center component horizontally</p>
      <p>[...]</p>
      <p>Use "%=" instead of "=" to decompose created composite glyph. For<br>
      example:<br>
      A+^ring%=Aringdecomposed”</p>
      <p>You won’t run into problems when opening the font on another computer.</p>
