    html: |-
      <p>alias.dat is used for generate glyphs, and also when you double-click on an empty slot in the font window.</p>
      <p>.cap or .case doesn’t matter as long as there is the matching data in alias.dat. On a technical level, you could even use some of each, but that would probably get confusing!</p>
      <p>I’d name it the alternate caron... caron + some extension. Could be caron.commalike or caron.alt.</p>
