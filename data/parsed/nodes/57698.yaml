    date: 2009-05-05T18:31:00
    date_raw: 5 May 2009 — 6:31pm
    votes: null
    html: <p>If you name your uppercase accents with a .case suffix FontLab will use most of them. You can customize all of this by editing the alias.dat file. You can go as far as using small cap accents named with a .smcp suffix and most of them will work as well. Watch out for those caron.case and caron.smcp uses. You really have to edit alias.dat for those to work.</p>
