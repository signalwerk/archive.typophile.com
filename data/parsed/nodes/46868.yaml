  html: <p>When I think of a city I think of the hustle and bustle of the people everyday trying to get to work on time. Then I think of New Orleans and what comes to mind is the excitement of the creativity that just seems to flow through every person in this city. This is obvious by the artwork and architecture of the city. One of my favorite places to look at is Sucre, the dessert shop on Magazine street. Just looking at this place from the outside is amazing. It is one of the most unique designs and brands, I believe, to be in this city.I for one thought that it had to be a chain from some foreign city and I was very much mistaken. It actually was conceptualized by someone who has been in the city of New Orleans for a while and I could not believe it. The creativity and uniqueness makes it seem very foreign, unlike the rest of the shops. What makes it even more amazing is the design of the boxes as well as their dessert displays. It is so unique because of the color scheme which is a baby blue color mostly with other soft colors. The overall design of this brand is amazing and that tends to be the case with all things in New Orleans. I mean, I know a lot of people tend to think of drinking and partying but when you are able to view the beauty of the architecture as well as just feel and see the artistic vibe in this city, then you will experience more than just a party.</p>
