    html: <p>Looks like it's a condensed Didot of some kind (hence the "t" shape). A decent approximation would be something like <a class="freelinking external" href="http://new.myfonts.com/fonts/typofonderie/ambroise-std-firmin/" rel="nofollow">Ambroise Firmin</a>, though it has a slight dip in the T shape which is easy enough to change if you're doing a logo.</p>
