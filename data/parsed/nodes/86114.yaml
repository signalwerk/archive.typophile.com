      <p>In terms of 'just working without problems' you are likely to run into the same problem in any font tool that made the transition from AFDKO code 1.0 to the more recent version, because Adobe made necessary changes in that code to make new functionality work. This means that older feature code needs to be fixed up to work with the new AFDKO, and this will be true in other tools, not just FontLab.</p>
      <p>This doesn't excuse the FontLab support folk for apparently failing to process your forum approval, or otherwise providing you with some kind of response. But making fonts is a fairly complicated technical process, and being willing to read release notes and understand changes in software is a pretty standard expectation in professional manufacturing tools.</p>
