    html: |-
      <p>BTW, They fixed this with the new release.  If you have not already, download it from FontLab.</p>
      <p>On a different note:</p>
      <p>With "A little Help from My Friends" Erik, Adam, and Frederik, I have finally succeeded in getting Python, RoboFab, and FontLab 5.1 running merrily hand-in-hand with OSX Lion 107.2 and executing Python scripts!  Did I say a LITTLE help? That should read "Great Gobs of Gargantuan Help!"<br><a href="http://forum.fontlab.com/python-scripting/instructions-installing-robofab-12-rev-226-in-fls-51-on-mac-os-x-1072-t8300.0.html">http://forum.fontlab.com/python-scripting/instructions-installing-robofa...</a><br><a href="http://groups.google.com/group/robofab/browse_frm/thread/9b587051ca7a9554/386b482a829738bb#386b482a829738bb">http://groups.google.com/group/robofab/browse_frm/thread/9b587051ca7a955...</a></p>
      <p>Instructions from Adam Twardoch:</p>
      <p>"1. Quit FontLab Studio.</p>
      <p>2. Download:<br><a href="http://robofab.org/download/current/RoboFab226M_plusDependencies.zip">http://robofab.org/download/current/RoboFab226M_plusDependencies.zip</a></p>
      <p>2. In Finder, navigate to the location where you downloaded the .zip<br>
      file, double-click to unzip it (if it already hadn't happened). You<br>
      should see a folder named "RoboFab226M_plusDependencies".</p>
      <p>3. Open the Terminal app</p>
      <p>4. In Terminal, type "cd " (with a trailing space) but don't hit Enter.<br>
      Drag the RoboFab226M_plusDependencies folder to the Terminal window. You<br>
      should see something like this in the Terminal window:</p>
      <p>cd /users/[your username]/Downloads/RoboFab226M_plusDependencies</p>
      <p>5. In Terminal, hit Enter.</p>
      <p>6. In Terminal, do the following:<br>
      (Hit Enter after each line. After the first "sudo" you'll need to enter<br>
      your administrator password.)</p>
      <p>cd FontTools<br>
      sudo /usr/bin/python setup.py install<br>
      cd ..<br>
      cd RoboFab<br>
      sudo /usr/bin/python setup.py install<br>
      cd ..<br>
      cd DialogKit<br>
      sudo mv Lib/dialogKit/ /Library/Python/2.7/site-packages/</p>
      <p>7. In Finder, do File / New Finder Window</p>
      <p>8. If you have enabled "Use custom locations for user data folders" in<br>
      FontLab Studio / Preferences / General Options / Folders and paths,<br>
      navigate Finder to folder that you've set as the "FontLab Studio user<br>
      data files" folder, and skip to step 11.</p>
      <p>9. If you have not customized the location, then in Finder's menu,<br>
      choose Go / Go to Folder...</p>
      <p>10. In the text box that appears, enter:<br>
      ~/Library/Application Support/FontLab/Studio 5/Macros<br>
      and click on Go.</p>
      <p>11. Your Finder should now should show a Macro folder with at least<br>
      three subfolders in it (Effects, Export and System).</p>
      <p>12. Switch to the Finder window that has the<br>
      RoboFab226M_plusDependencies folder, and open the subfolder<br>
      RoboFab/Scripts folder that is inside.</p>
      <p>13. You should see a folder with several subfolders: "Contributed",<br>
      "RoboFabIntro", "RoboFabUFO", "RoboFabUFO2", "RoboFabUtils".</p>
      <p>14. Select those folders and drag them to the Macro folder in the other<br>
      Finder window.</p>
      <p>15. Open FontLab Studio and in the Edit Macro panel type in:</p>
      <p>import robofab<br>
      import dialogKit</p>
      <p>If you don't see anything in the Output panel, you have installed<br>
      RoboFab and its FontLab macros and DialogKit successfully.</p>
      <p>Best,<br>
      Adam"</p>
