    <p>Hi All, </p>
    <p>I'm looking for a good substitute for the font Fleece. Attaching an image. I like the modern look of this script, as opposed to older looking options like Fenway. But I don't think this font is quite perfect - the connecting lines between the letters are a little distracting. Any help is greatly appreciated!</p>
    <p>Thanks,</p>
    <p>Tal</p>
