  html: |-
    <p>Unicode font will have approx. 2000 glyphs; all glyphs supplied. Font will consist of centered English grapheme/phoneme pairings.<br>
    Pairings will include: one letter/one phoneme; two letters/one phoneme; 1 letter/two phonemes; 3 letters/2 phonemes, etc. All pairings defined.</p>
    <p>single weight and style; exclusive font.</p>
    <p>Font used for reading instruction.</p>
