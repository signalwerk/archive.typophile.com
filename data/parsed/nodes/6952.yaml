    html: "<p>Dear Geraint: <br> <br>Thank you for your reply. However, I have both Stempel Garamond and Sabon, and I think neither of them are goof renditions. Sabon is quite different, really. Stempel Garamond seems to me to have a very rigid and 'Teutonic' manner about it which I find totally allien to the original design. In that respect, and even if it is too smooth, I prefer Slimbach's version.  <br> <br>What I am looking for is a very high resolution photo of the Berner original print, because I want to be able to study the very small characters (Galliard, Non Pareil, and even the slighly bigger ones).  <br> <br>In any case, I'd like to know if the book of which I give samples below is Garamond or not. They will look huge, but I did try to make them small; the text size is about 10 points.  <br> <br>Here they are: <br><img src=\"http://www.typophile.com/forums/messages/30/50264.jpg\" alt=\"Is this Garamond?\"> <br> <br>and here a sample of the text <br> <br><img src=\"http://www.typophile.com/forums/messages/30/50265.jpg\" alt=\"text sample\"></p>"
    html_clean: "<p>Dear Geraint: <br> <br>Thank you for your reply. However, I have both Stempel Garamond and Sabon, and I think neither of them are goof renditions. Sabon is quite different, really. Stempel Garamond seems to me to have a very rigid and 'Teutonic' manner about it which I find totally allien to the original design. In that respect, and even if it is too smooth, I prefer Slimbach's version.  <br> <br>What I am looking for is a very high resolution photo of the Berner original print, because I want to be able to study the very small characters (Galliard, Non Pareil, and even the slighly bigger ones).  <br> <br>In any case, I'd like to know if the book of which I give samples below is Garamond or not. They will look huge, but I did try to make them small; the text size is about 10 points.  <br> <br>Here they are: <br><img src=\"http://www.typophile.com/forums/messages/30/50264.jpg\" alt=\"Is this Garamond?\"> <br> <br>and here a sample of the text <br> <br><img src=\"http://www.typophile.com/forums/messages/30/50265.jpg\" alt=\"text sample\"></p>"
