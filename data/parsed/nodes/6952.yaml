    html: "<p>Rodrigo: your best bet is this folio: <br> <br>Type Specimen Facsimiles, Reproductions of Fifteen Type Specimen Sheets Issued Between the Sixteenth and Eighteenth Centuries, John Dreyfus, ed. <br> <br>abebooks.com has it from about $65 to about 160. Of course, if you don't already have Carter's \"A View of Early Printing\", you must have it immediately. <br> <br>I have a decent scan of the Dreyfus reproduction, 200dpi versions are at <a href=\"http://levien.com/type/berner/\">levien.com/berner</a>, I can get 1200 dpi scans to you on request. Let me know.</p>"
    html_clean: "<p>Rodrigo: your best bet is this folio: <br> <br>Type Specimen Facsimiles, Reproductions of Fifteen Type Specimen Sheets Issued Between the Sixteenth and Eighteenth Centuries, John Dreyfus, ed. <br> <br>abebooks.com has it from about $65 to about 160. Of course, if you don't already have Carter's \"A View of Early Printing\", you must have it immediately. <br> <br>I have a decent scan of the Dreyfus reproduction, 200dpi versions are at <a href=\"http://levien.com/type/berner/\" class=\"link-external\">levien.com/berner</a>, I can get 1200 dpi scans to you on request. Let me know.</p>"
