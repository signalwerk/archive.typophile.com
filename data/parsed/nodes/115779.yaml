    html: <p>Or you can go the Bringhurst route and refer to typefaces by the reigning visual art movement under which they were designed, which I have to say makes a whole lot more sense to me than random made-up terms like "oldstyle." True, the Bringhurst way doesn't tell you whether a postmodern face, say, is a serif or sans, but once you've established the general category into which a face falls (serif, sans, script, blackletter …) the art-movement method seems to be the clearest way of further specifying a style.</p>
