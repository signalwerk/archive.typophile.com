      <p>&gt; Now this is where it gets tricky - do I list Blackletter, Mono Spaced,<br>
      &gt; Decorative, Symbol etc. separately or try and classify them<br>
      &gt; all under one category: Display.</p>
      <p>Monospaced is a synonym for mechanical typewriter, computer-typewriter, OCR.<br>
      Decorative is a vague notion that integrates many styles and artistical movements.<br>
      Symbol is synonym for pictogram.<br>
      When it comes to Blackletter, it fits the calligraphy category and this calligraphy category integrates the scripts: French (XVII th century) and English (XVII and XVIII th century) scripts that you call formal scripts. Casual script is identical to graphic type.</p>
