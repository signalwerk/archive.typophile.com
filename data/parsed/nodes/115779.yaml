      <p>The Serif category  has a total of five groups:<br>
      Venetian (Jenson)<br>
      Old Style (Garamond)<br>
      Transitional (Baskerville)<br>
      Modern (Didot)<br>
      Slab Serif (Clarendon)</p>
      <p>And amongst the Old Style group, you've got<br>
      Italian Old Style (Manuce)<br>
      French Old Style (Garamont/Granjon)<br>
      Belgium Old Style (Plantin/Van Den Keere)<br>
      German Old Style (Sabon)<br>
      Dutch Old Style (Van Dijck/Kis)<br>
      English Old Style (Caslon)</p>
      <p>And amongst Blackletter, you've got a wide range of styles: Old French, Old English, Textura, Rotunda, Bastarda, Schwabacher, Fraktur, Granjon's Civilités, and others. Enough said.</p>
