    <p>Hi All,</p>
    <p>I am putting a small guide together for non-designer types to explain the different categories of typefaces.</p>
    <p>As you know this categorisation can go on and on, but I want to keep it as concise as possible without being incorrect.</p>
    <p>So far I have:</p>
    <p>SERIF<br>
    - Old Style<br>
    - Transitional<br>
    - Modern<br>
    - Slab</p>
    <p>SANS SERIF<br>
    - Grotesque<br>
    - Neo-grotesque<br>
    - Humanistic<br>
    - Geometric</p>
    <p>SCRIPT<br>
    - Formal<br>
    - Casual</p>
    <p>Now this is where it gets tricky - do I list Blackletter, Mono Spaced, Decorative, Symbol etc. separately or try and classify them all under one category: Display. </p>
    <p>Overall  -  Is there a better way of doing this classification?</p>
    <p>Any help on this would be much appreciated</p>
    <p>Thanks,<br>
    S</p>
