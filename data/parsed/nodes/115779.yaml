    html: |-
      <p>‘the art-movement method seems to be the clearest way of further specifying a style.’</p>
      <p>I do not think that the ‘art movement method’ really works. Shure one can link some obvious classes of display typefaces to them, but not all of them. Also, the ‘art movement method’ denies the fact that both art and typefaces design recycle the works from their own movements. And they do not do it the same way and in the same period. Also, art movements and typeface design are both international, but their paths through history are not always the same. Just as it is difficult for laymen to be able to tell the difference between impressionism and expressionism it will be difficult to explain to them why FF Meta can be considered to be a post-modern sans. I read Bringhurst with great pleasure but I think his approach to typeface classification is rather romantic. People look at forms without knowing where they come from or what they may be good for, typeface designers create forms. The most direct way to connect these two should be visual. All other means are nice to have extras. They may be good for various reasons, but when they play the first role, they are rather obfuscating than making things clearer. I consider the Vox terminology is one of the best examples of a terminology which obfuscates things to the non-expert user.</p>
