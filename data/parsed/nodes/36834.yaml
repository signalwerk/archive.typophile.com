      <p>Thanks for sharing Jackie. I love Harold's work too; I've enjoyed a friendship with him by correspondence since 2003. Some time in the first half of 2008 I plan to publish an interview with Harold about his font work, since he is so underappreciated. Hoping to reverse that I will post a news release here at Typophile and on Fontlover.com when the interview goes online. It will be the third installment in my "A conversation with..." series.</p>
      <p>Cheers.</p>
