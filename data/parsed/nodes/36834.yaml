    <p>I never really see anyone here mention Harold Lohner. He has offered many free and $5 fonts which, some are quite nice. Besides my love for Sarah Script from Charles Borges de Oliveira, I have also been infatuated with Imitation from Harold. I just enjoy the face. If I ever did a poster about Paris in the early 1900s - that font would be perfect.</p>
    <p>I received an email about Harold Lohner's art show, <em>Wheel of Life</em>- and I thought I'd share it with you. (You've probably received it as well, and if not - here goes.)</p>
    <p>Subject: September News from Harold’s Fonts + Art Opening</p>
    <p>September News from Harold’s Fonts + Art Opening</p>
    <p><a href="http://www.haroldsfonts.com" title="http://www.haroldsfonts.com">http://www.haroldsfonts.com</a></p>
    <p>Back to school, back to font-making...</p>
    <p>But first I wanted to tell you about an opening this Friday. I’m doing a outdoor projection piece on the Opalka Gallery at Sage College of Albany, where I teach. “Wheel of Life” is a cycle of portrait drawings I made using a scanner. Here’s the invitation; please check it out. <a href="http://www.haroldsfonts.com/wheeloflife.pdf" title="http://www.haroldsfonts.com/wheeloflife.pdf">http://www.haroldsfonts.com/wheeloflife.pdf</a></p>
    <p>The new font this month is SWEET SPIRIT, an intricate design that’s a cousin to my popular Graceful Ghost. Drawn with long flowing lines and adapted from a historical source, perfect for suggesting embroidery or engraving. Now available from Font Bros.</p>
    <p>And thank you for the positive response to my new arrangement with Font Bros. It’s getting me a wider audience for my work. I appreciate those who’ve followed and supported my work for almost 10 years now. So many have asked that I provide easier shopping or encouraged me to charge more for commercial fonts. And I’m happy to be able to continue to offer free and $5 fonts as well.</p>
    <p>Thanks again,<br>
    Harold Lohner<br>
    <a href="http://www.haroldsfonts.com" title="http://www.haroldsfonts.com">http://www.haroldsfonts.com</a></p>
