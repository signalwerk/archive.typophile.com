  html: |-
    <p>For Immediate Release<br>
    Buffalo, NY- June 1st, 2009</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CaffeFlag_5345.jpg.jpeg"></div><p></p>
    <p>P22 and the International House of Fonts announce Caffe- a new flavorful<br>
    font designed by Gabor Kothay.</p>
    <p>Caffe was originally designed for the Artz Gallery Cafe in Budapest<br>
    Hungary. The design is a contemporary handwriting style adapted from<br>
    examples in lettering exercise books. It has been redrawn and expanded into<br>
    six styles. The four weights were created by drawing the style using<br>
    different mediums: Cappuccino in pen, Pastry in felt-tip, Lemonade in brush<br>
    and Tobacco, the original, in pencil. Poster and Poster Inline are well<br>
    suited for display purposes and round out the family. This font family is<br>
    perfect for bistro menus or other European-flavored poster &amp; print design.</p>
    <p><a href="http://www.p22.com/ihof/caffe.html" title="http://www.p22.com/ihof/caffe.html">http://www.p22.com/ihof/caffe.html</a></p>
    <p>Introductory offer through June 30th</p>
