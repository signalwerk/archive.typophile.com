      <p>Sorry for the late reply, been away/busy/etc.<br>
      For the record, I'm not «offended» as such when people post suggestions, but frankly I think more often than not it's beside the point. The question is how the person who already has the job (me, in this case) can come up with the best solution – and this <em>needs</em> to be fueled by a strong concept in turn fueled by communication with the client. Therefore I feel that questions usually help more than direct suggestions, and words usually more than pictures; and when people start posting pictures, threads sometimes develop a competitive side that is really beside the point. But everyone sees this a bit differently.</p>
      <p>That said, I'm one for minimalism in terms of only using the elements I need to communicate; and frankly, I don't feel my concept is «lacking» any additional elements, some of which seem nice, but all of which to me seem to water down the clarity of the concept. Thanks for the food for thought, though.</p>
      <p><cite>"The form of an "A" without its crossbar feels foreign and intimidating (to me)."</cite><br>
      Really? Feels more techy to me, but it's been done a number of times. See the <a href="http://www.jigyo.com/Military/Memorabilia/SmallPatches/NASA/7401.jpeg" rel="nofollow">old NASA logo</a> or <a href="http://www.theautochannel.com/news/2008/06/24/091044.1-lg.jpg" rel="nofollow">KIA Motors</a>. There are more. </p>
      <p><cite>"It needs a personal touch to push it in that direction. Right now, the cursor idea is not clear enough to stand out"</cite><br>
      How do others feel about this? All the people I've directly tested it with so far have immediately seen the arrow/cursor. (I'm thinking the fact that the black shape seems slightly odd – with the thick serifs that are also longer on the inside [which however is not at all unheard of for "A"s BTW] – may help people see there is something else going on, too.)</p>
      <p>Will check back once I have more to show. Thanks all, so far.</p>
