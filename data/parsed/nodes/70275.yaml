      <p>I totally agree. I also hereby release any and all ownership of the four examples above. They were meant to serve as inspiration, not as final examples in their own right.</p>
      <p>I don't really truly believe that we can "own" something as abstract as a shape, no matter how specific that shape is. Sure, we should get paid for our work, but eventually we'll die. The shape lives on in the mind and the void forever.</p>
      <p>It's like how we think we "own" land...but really, the land owns us. The earth was here before us, and all shapes already exist, theoretically. We aren't really designers, just "finders." :D</p>
      <p>Perhaps I should upload poorly-done loose pencil sketches instead?</p>
      <p>But thanks for the tip – I had no idea how popular this site was.</p>
