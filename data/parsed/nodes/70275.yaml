    html: |-
      <p>I like it! I'm a bit hesitant on the arrow though. Not for the design of it, but from a cognitive science perspective. You'll have a part of the population who won't be able to spot the arrow unless they are given cues.<br>
      This may be a non-issue, but I thought it might be worth to keep in mind.</p>
      <p>As a side note, an alternative to giving cues is to have the image be nonsensical when something recognizable is expected, thus forcing the observer to cycle through alternative modes of observation in order to try to make sense of the image. Obviously, this won't work here, since logotypes are expected to be abstract.</p>
