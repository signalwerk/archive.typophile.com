    html: |-
      <p>KIA and NASA use the 'A' in context with a word. That makes it readable and obvious that it is the letter 'A'.</p>
      <p>Using a standalone "A" without a crossbar and without a phonetic context makes it more obscure and intimidating. It feels "alien" without support around it, or something to signify that it is a letter. Your slab serifs help to explain that it's a letter and I recommend serifs if you use that direction, but I stand by my earlier comment: a lone 'A' without a crossbar (in any font) feels a bit awkward. If nothing dynamic is happening with it (slab serif, basic structure), it will have a harder time communicating something specific. Interpretations of its significance would probably vary wildly if you shared it with people and asked for opinions on its meaning (which has already happened in this thread).</p>
      <p>The bottom line: I feel that people should be able to look at this and:</p>
      <p>1. immediately see an 'A'<br>
      2. immediately tell that it is for a tech company</p>
      <p>"diligence, stability, hard-working no-frills trustworthiness and such"</p>
      <p>I think a banner, shield, cropped figure/ground rectangle could help solidify the mark.</p>
      <p><a class="freelinking external" href="http://www.portland.com/portland/wp-content/uploads/rose-quarter-logo.jpg" rel="nofollow">http://www.portland.com/portland/wp-content/uploads/rose-quarter-logo.jpg</a></p>
      <p>This logo uses a crop box and the mark becomes a sort of stamp or plaque. That approach might be more appropriate for what you're doing.</p>
