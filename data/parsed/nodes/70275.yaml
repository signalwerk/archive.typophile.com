    html: |-
      <p>Well, lets say your redesign is seen by the client (this website is truly a Google magnet) and they want to use it. So, now what? Either you've just "stolen" a job from another designer, or, that designer steals your work? They can't take credit for it legally, and the sure as hell would be crazy to put it in their portfolio. </p>
      <p>Even if the client doesn't see it, NO WAY I'd submit somebody else's work to my client. It's unethical. So, even if your solution is REALLY great...I can't use it. If you had described it rather than drawn it, I could have made the design myself. And for that, yes, I'd be grateful.  </p>
      <p>Imagine somebody walked into Picasso's studio midway through a painting and picked up his brush? Then paints over half his painting? Hubris? You bet! I'm not saying we're all Picassos, but you can see the analogy, yes?</p>
