  html: '<p>TRUTH in Design is proud to announce <a href="http://www.Ultrafonts.com" target="_blank">www.Ultrafonts.com</a>, a screenfont foundry combining the best features of pixel fonts and anti-aliasing.  <br> <br>Typophiles like Miguel Hernandez, Gustavo Ferreira, Hrant Papazian, Hugo Perez, Christophe Badani and Nathan Matteson painted every shade of gray in each Ultra Pixel Font . <br>Hand-painting beats machine anti-aliasing, especially at small sizes: <a href="http://www.ultrafonts.com/images/posters/UPF-vs-normal-screen-fonts.gif" target="_blank">http://www.ultrafonts.com/images/posters/UPF-vs-normal-screen-fonts.gif</a> <br> <br>Ultra Pixel Fonts are compatible with Flash and many other TrueType environments. Two free fonts, Silkscreen Remix and Verity, are downloadable for testing. <br> <br>Please contact me with comments, or if you want to paint your own fonts the UPF way. <br> <br>Thank you Typophile! <br>-chris@[nospam]truthindesign.com</p>'
