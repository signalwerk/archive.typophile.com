    html: |-
      <p>I really like it!<br>
      One concern: the "r" seems a bit heavy and too close to the following "t", almost suggesting a "d".<br>
      A subtle adjustment: I would recommend thinning the bottom curve of the "r", and moving the vertical stroke of that "t" a little to the right.<br>
      Also, you might consider tweaking the two "p"s so that they are not identical -- after all, it's supposed to look hand done, not mechanical.</p>
      <p>Is it too retro for today's young woman -- grandma's brand?<br>
      It's hard to say. Kids rock those styles, which is annoying. When I dress like my dad, I look like an old geezer--when my son does it, he looks hip.<br>
      So, it might be a good idea to present your client with some alternatives, and have them tested by a focus group.</p>
