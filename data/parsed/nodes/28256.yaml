    html: |-
      <p>I think your logo is great, but I'm quite sure it wouldn't work for modern young women in the market where I currently work (south-eastern Brazil). Since I don't know anything about the "average young modern woman" in your market (Scandinavia?), I would strongly suggest that you try this logo on a focus group.</p>
      <p>Maybe you'll find out that you're in perfect tune with average modern young women in your corner of the world, maybe you'll come to the conclusion that their taste sucks, or that they don't get and/or don't interpret your logo the way you would like them to. Problem is, you can't change the target audience (well, at least not without spending several million dollars on a massive campaign); you must adapt to it.</p>
      <p>Get your focus group to rate your logo on several different criteria, using a scale from 1 to 5. For instance:</p>
      <p>(a) This logo suggests products that are:<br>
      1 (old-fashioned) ... 2 ... 3 (neutral) ... 4 ... 5 (modern)</p>
      <p>(b) You're most likely to associate this logo with:<br>
      1 (techno music) ... 2 ... 3 (rock'n'roll) ... 4 ... 5 (classical music)</p>
      <p>(c) A product bearing this logo is likely to be:<br>
      1 (horribly expensive) ... 2 ... 3 ... 4 ... 5 (dirt cheap)</p>
      <p>And so on. Example (b) might be silly, but questions along these lines can be helpful, since people normally associate things in intricate ways. And anyway, you may want to know whether a girl would feel comfortable wearing an Oppskjørtet skirt to a hip nightclub.</p>
      <p>Make sure your scale isn't always 1=low/bad, 5=high/good, or people may become biased towards one end of the scale.</p>
