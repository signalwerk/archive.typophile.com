      <p>Hi there!</p>
      <p>Nice work! I think it looks appealing - I'm not 100% sure about the 'Since 2006' typeface - I'd be tempted to try a less organic-looking font (it looks a bit like a celtic type style). It was only on the second viewing that I saw the needle - I like the idea, but I think you're trying too hard to make the acsender of the k like an eye of a needle, and it looks a bit awkward. Why not try to make it flow more and not be 100% like an needle eye as you don't get a counter anyway in the letter k, so it would be noticeable and might well encourage someone to asscoiate the meaning with it). Leave the eye in - the logo doesn't depend on someone 'getting it' to read it - but it's a cute touch if they read that meaning into it.</p>
      <p>I'd like to see it at a small size also - the eye of the needle might fill in when it goes small.</p>
