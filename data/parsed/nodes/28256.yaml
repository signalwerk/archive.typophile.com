      <p>There is a little inconsistency between the line weight of where the interior swash meets the right side of the "O" and where it emerges. It might be an optical illusion, but line seems to dramatically narrow as it "passes through" the O.</p>
      <p>Also, the curve of the swash on the interior of the O doesn't match the angle that it emerges from the O and travels up to the K. The curve on the interior looks like it produce an exterior swash curving lower, more toward the tops of the Ps. Right now it looks too stiff as it emerges from the O--the swash needs to feel as fluid as it does on the interior of the O.</p>
