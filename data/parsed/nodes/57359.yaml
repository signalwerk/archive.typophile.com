      <p>I don't know how "superb" it is, but...</p>
      <p>It sounds like you're not clear on the meaning of "kerning".</p>
      <p>Every character in a font has a certain width. These widths are where the normal spacing in a font comes from.</p>
      <p>In a proportional font, these widths vary, depending on the <em>proportions</em> of the character. So, as you mention, the "i" and the "m" would be different widths.</p>
      <p>In a monospaced font--also called non-proportional--, the characters are all made to fit into the same width. So, the "i" is made wider, or has more space around it, and the "m" is made narrower.</p>
      <p>Kerning is a method of adjusting the spacing between certain pairs of characters, such as "A" and "T", for which the normal spacing is too loose or too tight. A monospaced font would never have kerning pairs.  If it did, it would, in effect, cause some characters to have different widths, and then it wouldn't be monospaced anymore.</p>
