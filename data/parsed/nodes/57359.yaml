      <p>If you want to have a set of glyphs that will set both monowidth and proportionally spaced, then kerning will do the trick.</p>
      <p>Of course, the glyph widths should be all the same.<br>
      Next, kern the font.<br>
      So, "kerned" will be the default. (But not in Word.)<br>
      But if a typographer wants monospaced, then all that is required is to enter "0" in the kern field of the Character palette in InDesign.</p>
      <p>It would be possible to do it the other way round, i.e. to kern a proportionately spaced font to set as though it were monospace, however, there would be a problem at the beginning of lines.</p>
      <p>The easiest thing to do is two separate fonts, one monospaced, one proportional.</p>
      <p>I have actually had requests for a kerned (proportional spaced) version of Panoptica, but as the whole raison d'être of that typeface is to be monospaced-unicase, to provide a proportional version would negate its personality.</p>
