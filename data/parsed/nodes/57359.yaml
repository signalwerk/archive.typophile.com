      <p>There are also mono style fonts which are made to give the look of a mono without actually being one. They have different widths and probably kerning as well but of course then, by definition they are not Monospaced.</p>
      <p>It is not easy to make the width of the m &amp; i that same. But if you look a many Monospaced fonts you will begin to see what the strategies being used are.</p>
