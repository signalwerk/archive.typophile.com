    html: "<p>Viejo, how much money you make from a font usually depends on how popular the font turns out to be, i.e., how many copies of the font will be sold. <br> <br>Most foundries pay a specific commission to the designer for each sale they make; a percentage. The important thing to keep in mind is the question: \"how much mileage is this foundry going to give my font?\" Let's say that one foundry offers you 25%, and a second just 15%.</p>"
