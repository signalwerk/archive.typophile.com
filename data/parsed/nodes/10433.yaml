    html: "<p>Thanks for your commments. Do you have any good or bad experience with the Scriptorium foundry? That was my first choice due to the nature of my project. I am doing some analysis on mexican hand-lettering and on mexican/spanish vintage type and lettering (from the previous three centuries). I want to make an interpretation of those letters in order to create a set. The people at Scriptorium were interested in the project, but I want to know a little bit more about the normal price paid for such things. <br> <br>Allan Haley, at Monotype, kindly answered to me on this subject: <br> <br>\"Hello Mosh, <br> <br>The price of font can range from \"free\" to over $100. Generally, they run from $22 to $49. We price the new releases into the ITC and Monotype libraries at $39 and $55 for OpenType. <br> <br>Royalties are paid on fonts sold. We make royalty payments quarterly.\" <br> <br>Is this an OK price? I had thought that it would be more, but if that's the standard, I'll accept it. <br> <br>I am still doing my first sketches on this project, though. I am mexican, but I am living since six months ago in Munich, Germany, so I am resourcing to my personal photo archive for sources. <br> <br>And H</p>"
