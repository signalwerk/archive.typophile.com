    html: <p>Well, I'm going to try and guess what Stephen is talking about. <br> <br>FontShop Berlin publishes a large, many-page full color newletter. Often. Maybe every month even. German designers seem to swear by these things, although all other German foundries cut these out of their budgets years ago because they did not generate sales anymore (yeah internet!). I must admit that the FS Berlin mail is very well designed, and presents the typefaces of many foundries, not just FontFont's, in a very good light. <br> <br>Perhaps this will be picked up by FS SF.</p>
