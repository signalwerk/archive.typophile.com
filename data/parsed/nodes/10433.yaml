  html: <p>After ten years or so at doodling fonts now and them for personal pleasure, I am considering the option of offering them for sale to type vendors, be it a big or a small one (depends on the money they pay). I have got no clue, though, as to which is the price range for fonts. Can I get some insight into this? I would appreciate it a lot.</p>
