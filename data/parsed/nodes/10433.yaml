    html: "<p>I couldn't agree more. When I was just getting into digital type sales in the early 90s, I assumed that any reasonably decent font would sell at least 10,000 copies at retail. Even then, I was told, 200 copies was considered hugely successful at retail.  <br> <br>Given how hard it is to sell large numbers of fonts retail, your royalty isn't the important thing: getting promoted is. Yet who is really doing promotion today?  <br> <br>Corporate sales are the way to go, but do you have  a product that a corporation will like well enough to pay let us say $80,000 for a 10,000 seat license?</p>"
