  html: '<p>A type style with slab <a href="/wiki/serif" class="freelinking" rel="nofollow">serifs</a> circa mid-to-late-19th century, a low <a href="/wiki/contrast" class="freelinking" rel="nofollow">contrast</a> design of uniform stroke. So-named for the fashion for Egyptian art and artefacts in Europe when Egyptian types were designed and used. Major Egyptian examples: <a href="/wiki/Memphis" class="freelinking" rel="nofollow">Memphis</a> and <a href="/wiki/Serifa" class="freelinking" rel="nofollow">Serifa</a>. Also applied to sans serif types of the same era.</p>'
