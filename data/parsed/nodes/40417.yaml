  html: '<p>A type style with slab <a href="/node/13702" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">serifs</a> circa mid-to-late-19th century, a low <a href="/node/14546" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Contrast</a> design of uniform stroke. So-named for the fashion for Egyptian art and artefacts in Europe when Egyptian types were designed and used. Major Egyptian examples: <a href="/node/18601" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Memphis</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Serifa" title="Create node &quot;Serifa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Serifa</a>. Also applied to sans serif types of the same&nbsp;era.</p>'
  html_clean: '<p>A type style with slab <a href="/node/13702/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">serifs</a> circa mid-to-late-19th century, a low <a href="/node/14546/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Contrast</a> design of uniform stroke. So-named for the fashion for Egyptian art and artefacts in Europe when Egyptian types were designed and used. Major Egyptian examples: <a href="/node/18601/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Memphis</a> and <a href="/node/add/wiki?edit%5Btitle%5D=Serifa" title="Create node &quot;Serifa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Serifa</a>. Also applied to sans serif types of the same&nbsp;era.</p>'
