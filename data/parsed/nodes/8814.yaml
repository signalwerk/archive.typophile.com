    date: 2005-01-26T21:23:00
    date_raw: 26.Jan.2005 9.23pm
    votes: null
    html: <p>Well, another way to look at this is that trying to stamp out the <br>existing fonts leaves nobody happy. To say that doing so does <br>honor to Francois Boltana is open to argument. I dare say that <br>most of us, were we Boltana now and able to look from our <br>resting place, would MUCH rather see two lovingly made fonts <br>that make available the exquisite Champion to be seen and <br>used than to have our typeface tied up in some copyright limbo <br>or, worse, the copyright holder seeing it as not worth digitizing <br>and having no intent to release a font. Saying otherwise takes <br>a certain measure of arrogance, in my opinion. <br> <br>If anyone knows who owns the rights to Champion, please <br>speak up so that I might write and urge the creation and <br>release of a nice, better made, truly legitimate font that would, <br>indeed, make everyone happy. <br><br></p>
