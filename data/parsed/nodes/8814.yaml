    html: <p>I understand Jean (and Yves I see the edit you made). I am sorry if that was an oﬀensive thing to do. The font I showed is not making money for anyone else, and I did not point to where I found it, and as far as I could ﬁnd there was no available version of Francois Boltana’s font. Do you know of one? <br><br>In the past, when we found a digitized version of a font that was not oﬀered commercially we have shared information about it, so I thought I was not promoting a pirated version. <br><br>I can see this is a ‘gray’ area, and I accept your opinion that in this case, the design is too recent to be&nbsp;‘revived’.</p>
