      <p>Without reading the description, I thought this was a logo for a nightclub or a bar.</p>
      <p>If I were buying sausage, I wouldn't want to think of how it was made. The name reminds me enough without having to look at an image of a gritty, dirty grinder.</p>
      <p>I'd suggest reworking this from the start. What kind of image are you trying to convey for your client? Based on nothing but my own opinions, I'd go with a clean, retro 50s look, evoking the friendly neighborhood milkman. Maybe in baby blue, white, and red.</p>
      <p>If you want to appeal to the "foodie" crowd (upper age range of your demographic), maybe focus on the handcrafted aspect of the sausages. <a href="http://www.jbfinecheese.com/index2.html" target="_blank" rel="nofollow">This</a> is a local cheese shop with a nice clean image that is probably closer to what you want.</p>
      <p> - Lex</p>
