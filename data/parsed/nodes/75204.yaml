    html: |-
      <p>Hi Brad,</p>
      <p>my first thought: <a href="http://en.wikipedia.org/wiki/The_Green_Butchers" title="http://en.wikipedia.org/wiki/The_Green_Butchers">http://en.wikipedia.org/wiki/The_Green_Butchers</a><br>
      If I had to guess the target group I’d say splatter film freaks.</p>
      <p>It doesn’t say traditional to me but it DOES say unique. In a way.<br>
      I guess it could work for a small business, willing to take the risk (of grossing out potential cutomers) in order to (possibly) establish a very unique brand.<br>
      A GrindHaus truck driving by is definitely something to stick in one’s brain for quite a while.</p>
      <p>For the logo:</p>
      <p>- the grinder looks very industrial to me. Doesn’t work for homemade sausages IMHO<br>
      - I think a logo like this requires a very careful use of colours. Yellow looks purulent, purple reminds of veins and old meat.<br>
      - i’d avoid any kind of grunge/worn look. Nobody wants to eat food from a dirty/filthy place.<br>
      - the G in No. 2 could only work if the ‘RIND HAUS’ was in the same colour as the G (the clamp). Then again, it emphasises the clamp, not the grinder.</p>
      <p>So I think the best way this could work was a reworked clean monochrome version, maybe with rounded edges in order to add a little softness/friendliness/wink. If you use colours, look for ‘butcher-friendly’ colours (with a rather bold logo like this I’d avoid red – green could be a good choice)</p>
      <p>Cheers,</p>
      <p>Ari</p>
