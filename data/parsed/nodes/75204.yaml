    <p>This is my first post but I'd like to see what everyone has to say about these two takes on a similar logo. I am partial to 1,3,4. And I'd like to ask the forum if having the Grinder clamp act as a "G" is cliche at all.</p>
    <p>Background: This will be the logo for a small specialty shop as well as a mobile truck serving homemade sausages (traditional/unique). Catering to an after hours crowd ages 21-35.</p>
    <p><a href="http://en.wikipedia.org/wiki/Exploitation_film" title="http://en.wikipedia.org/wiki/Exploitation_film">http://en.wikipedia.org/wiki/Exploitation_film</a></p>
    <p>Thanks!</p>
