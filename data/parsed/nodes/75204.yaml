      <p>hey dude, there's small problem i find with the 3/4 view of the grinder.<br>
      while much better than the other version the fact that theres so much of an angle means that its hard to see both 'the' and 'grind'<br>
      might i suggest making it less acute.. and maybe placing 'the' in more centred on the side of the grinder.<br>
      i only say this because when your dealing with walk-in/by clientele you need to be able to immediately communicate how cool you are and what your offering (probably in the other way around..) the extra 2 seconds it takes for people to say 'oh its grind' and the other 2 to notice 'the' could hurt business.. just saying..</p>
      <p>i think the concept is really cool, brilliant approach to a fairly original idea. i like the two-color logo on the top right. but i think maybe you should explore blue and red (?) whenever i hear butchers stores i think of red white and blue.. i think this juxtaposed with your logo could work well... now doubt you've already tried this..<br>
      i think maybe your grinder and the black outline on the text should be of the same darkness.. in my opinion it would give the logo more fluidity..<br>
      i hope the business goes well</p>
      <p>kia ora bro</p>
