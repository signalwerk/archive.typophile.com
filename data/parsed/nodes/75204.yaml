      <p>I like the logo, looks cool and exciting. I'd definitely like to try some of their sausages, but they'd have to work pretty hard to make them as exciting as the logo. I'm into offal and sausages etc, so it would be good if they could make a type of sausage that was hard and dry, not too much fat and definitely no stringy bits - that's if they make cured sausages rather than the fresh stuff.</p>
      <p>That said, #4 looks best but I think that the perspective is a little wrong. You have a vanishing point to the left but the word "The" doesn't vanish in the same direction as the words "Grind Haus". I think that the design would benefit from drawing some temporary grid lines to position the perspective effect (take out later). You might also have to bend the meat grinder a little to get it completely into the right perspective.</p>
      <p>Also the words "Los Angeles" have some problems: 1. Are not in the same perspective (don't get bigger as they approach the viewer.) 2. Different feeling font 3. Bit hard to read when put over the other font, esp if reproduced in B&amp;W. My suggestion: Use smaller point size of same font as "Grind Haus", put it under the word "Haus", put it in same perspective as "Grind Haus". This will help to reinforce the "coming at you" feel of the logo.</p>
    html_clean: |-
