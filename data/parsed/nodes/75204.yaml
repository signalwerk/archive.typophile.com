      <p>It's cool and technically well done....however, it reminds me of the gruesome scene in that Pink Floyd video when the children blindly march into a meat grinder. Not exactly the place I'd want to eat dinner!</p>
      <p>If you're forced to use a meat grinder, there must be a less-ominous, less violent-looking way to portray it? Maybe even if it were a "stainless steel" grinder instead of black?</p>
      <p>Even so, I might try harder to convince my client that a visual of the grinder itself might not be the most appetizing way of selling sausage. I mean, heck, "sausage making" is <strong><em>actually the phrase used</em></strong> to describe something revolting! Why would you use a VISUAL of "sausage making" as a logo? It's a bit like using a photo of a bloody, decapitated pig to sell honey baked ham. </p>
      <p>Oh, and I have about 20 years experience in the restaurant industry. Before I went back to college for graphic design, when opening a new restaurant, I hired qualified designers to help craft an effective identity package. Sure, I had ideas based on my restaurant expertise....but I knew I didn't have the visual design and marketing skills to excel at logo development. In other words; convince your client to trust you. If you believe a meat grinder logo will hurt their business, tell them! Show them what would reach a broader, more targeted audience. That's what logo development is all about!</p>
