  html: <p>hi guys, i'm currently undertaking a large typographical project, and at present i am focusing on displaying the script from abbott and costello's 'who's on first' classic  <br>comedy sketch. as usual i need some advice! <br> <br><a href="http://dorkinout.com/movies/whosfirst.avi" target="_blank">http://dorkinout.com/movies/whosfirst.avi</a> <br> <br>what are the most prominent typefaces from new york around 1930-1955 and who were the most influencial type designers of the period.  <br> <br>just to give you an idea i am trying to project abbott's physicality and personality through a typeface which is to be a little more 'sensible'. <br>and costello as a little more dysfunctional (?) and messy. of course i am not there yet, but i was looking at cochin for abbott and blockhead (darkside) for costello. <br> <br>any thoughts are warmly appreciated.</p>
