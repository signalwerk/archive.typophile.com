      <p>Hi again Alaskan</p>
      <p>Yes, please send the generated report to us for further analysis. The easier way to send it is using the 'Help' -&gt; 'License Information' -&gt; 'e-mail To Support' which sends also some technical info about your O/S version etc.</p>
      <p>Regarding your other question, no there is no such message as "no matching fonts", you just get a blank list.</p>
      <p>About the behavior you describe, i.e. to see some matches which disappear latter, this is perfectly normal. Each search is performed in 2 phases: The first one is faster and may find some fonts which are then rearranged or discarded in phase 2 according to your preferences.<br>
      If you want to make the application less strict and keep more matches, go to 'Preferences' -&gt; 'General' tab and move the 'Matching Accuracy' slider to the right (best matches - value: 100).<br>
      This may slow down a bit the matching operation but it will usually provide you with more font matches.</p>
      <p>Thanks again for your valuable feedback.</p>
      <p>Fivos</p>
