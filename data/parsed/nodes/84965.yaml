      <p><strong>Nina</strong> I fully understand your concerns, but it's not the collector mentality that I personally fear the most.</p>
      <p>If somebody has the moral strength and the maturity to respect the work of others, he will do it anyway, by checking every time if a font he/she downloaded from a (supposed) "free fonts" site is really free, or there is actually a commercial license to be acquired before using it in a project.</p>
      <p>On the other side, I suppose that many people are searching for a font using e.g. the WhatTheFont service and then they download the matching font from other illegitimate sources and sites.<br>
      The later I'm sure they will do exactly the same, even if we provide them with downloadable Find my Font libraries.<br>
      They will also do the same with our software: Instead of buying Find my Font, they will try to find an illegitimate cracked version of it.</p>
      <p>What I'm trying to say is that Find my Font is just another tool and every good or bad usage of a tool depends -finally- on the wisdom, maturity and ethics of each user.</p>
      <blockquote><p>This sounds interesting. In case you can share, what sort of «information» would this need to be? Perhaps just outlines of a few key glyphs?</p></blockquote>
      <p>I can't say much because I don't want to accidentally reveal any details about our matching algorithm but I can say this:<br>
      a) All glyphs must be present in the library because we don't know in advance which glyphs a user may select for matching or preview<br>
      b) The glyph outlines are not required; a low resolution bitmap image should be sufficient for a small-size preview. This way a font vendor can be sure that there is no way for anyone to acquire the original outline font data from our libraries.</p>
      <p>At this point I need to repeat that, we haven't yet decided how we will implement the feature of non-local fonts matching (it can be downloadable libraries, but it can be as well a connection to a remote server) and we also cannot promise yet any release date for this feature.</p>
      <p>Thank you for your thoughts</p>
      <p><strong>Bob</strong>,<br>
      you are so right! Even I, which I have zero background on font-design and a highly untrained eye, I have come to realize that there can be so many small variations based on each font designer decisions, that is almost impossible to visually remember all the details and differences between 2 similar fonts.</p>
