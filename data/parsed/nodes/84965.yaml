      <p>Hi Ben,</p>
      <p>although at the last messages we all talk about Font-Libraries etc,<br>
      you should consider that the primary purpose of Find my Font,<br>
      is to match an image against local fonts on your computer.<br>
      This is not possible -or at least it would be much more difficult and very slow-<br>
      if  the application is offered <strong>only</strong> as a web service.</p>
      <p>More than this, I don't think anybody will be willing to pay for such a service when he can use instead e.g. WhatTheFont or your excellent ID forum here in Typophile.</p>
      <p>An alternative is to offer both:<br>
      (a) Find my Font (for local fonts) + connection to a web-service (for vendor fonts)<br>
      (b) An independent payed iPhone application (vendor fonts only)</p>
      <p>..but that's another story, and only the future can show us if there is a market big enough to support the developing of such applications.</p>
      <p>Fivos</p>
