      <p>I think your interpretation of Accuracy is a bit over-simplified at this context.<br>
      The number of matches to show is a different thing and can be set by the 'Max. Matches to Show' (bellow) and you can set it to 1 if you wish to see only the top match.</p>
      <p>The 'Matching Accuracy' factor is just an easy way to let the user control Accuracy vs Speed and yes it will finally deliver more accurate results (not less results but more accurate in general) because there will be more candidate fonts to examine in phase 2.<br>
      If you still feel that the term 'Accuracy' is counter-intuitive I'm open to suggestions but I don't thing 'inaccuracy' is a term that can be used.<br>
      Maybe we 'll just change the limit-names to "max speed" and "more matches" and that's enough...</p>
      <p>In the next paragraph you lost me a bit... Did you finally get a result or not?<br>
      Because you say "it wasn't showing any results at any setting" and then you say "it shows accurate results at the default setting, and at any setting +20/-20 points" and this sounds like a contradiction to me.</p>
      <p>I will be really surprised to find out that the application is not working with a single specific font, because we tested it with many hundreds of thousands fonts.<br>
      Can you attach a screen capture of the application screen to understand the font you are using and the selection you have made when you get no results?<br>
      If this is not possible due to image size, please send me a screen capture by e-mail.</p>
      <p>Thank you again for your time<br>
      Fivos</p>
