    html: |-
      <p>Chris,<br>
      thank you so much for your time and the extended test you performed!</p>
      <p>(a) Regarding the screenshot tool, you are right: It gives a black image in OSX Lion - we will fix this on next release.</p>
      <p>(b) Regarding your comment "I also tried glyphs with diacritics such as eogonek but had no way to let the software no the proper glyph name?"<br>
      You are right again, although the "Text To Match" box accepts the full unicode range of characters you need to switch to the appropriate keyboard to type the character you want. I think we should develop an alternate input method to allow easy insertion of any unicode character.</p>
      <p>(c) Many many thanks for the font-variations test!<br>
      We never performed such a test, and I'm glad the results are good.</p>
      <p>(d) Regarding your comment "could not separate reverse figure ground here;"<br>
      you can use the following options to separate/select letters when their color is very close to background:<br>
      1) Change the Tolerance Letter Selection Tool to a lower level from e.g. 32 (the default) to 10 or lower. This can be modified either in preferences or by click and hold the mouse button on Letter Selection Tool.<br>
      2) If after lowering the tolerance, the letter selection tool selects only part of a letter, you can hold-down the Shift or Control key and append many selections to the current letter until all main parts of the letters are selected.<br>
      (See also:<br>
      Help -&gt; How To Procedures -&gt; Letter Selection -&gt; Selecting multi-part letters)</p>
      <p>(e) Regarding your comment "I could not get the cropping tool to do anything but draw blue lines"<br>
      The Letter Splitter Tool does not actually crop the image but enables you to draw blue lines which are used as boundaries when you select the next letter. You just draw a line at the position you want the letters to be split and then you select the next letter as usual. I think it's easier this way...<br>
      This will also work well with the Greek double Gamma letters.<br>
      (See also: Help -&gt; Tutorials -&gt; Split Text)</p>
      <p>(f) Regarding your comment "Ligatures and swashes were problematic but as long as I chose a normal glyph, it works pretty well!",<br>
      I suppose this is related to Letter Selection Tool tolerance and multiple selection method I described in (d) above.<br>
      If not, would you please elaborate more on this issue?</p>
      <p>Thank you again for your time :-)<br>
      Fivos</p>
