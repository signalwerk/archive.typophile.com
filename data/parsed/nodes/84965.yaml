      <p><strong>Hi Ben</strong>,</p>
      <p>about the possibility of searching distributor databases in the future, see my answer to Nina above, and you can see also my answer in previous page about the ways this can be implemented (e.g. downloadable font libraries, having only the information needed for matching and not the actual fonts).</p>
      <blockquote><p>One final question: how good is it at recognising photographs of text, which may have some perspective, slant, distortion or squooshing?</p></blockquote>
      <p>The current version recognizes just italic &amp; bold variations by creating an artificial Oblique or artificial Bold typeface based on your original font file.<br>
      You can also rotate the whole image, horizontalize the text baseline, or split connected script letters.</p>
      <p>For the future we plan to add some new tools to recognize artificially expanded or condensed letters or letters slanted to the left (reverse italic?) but these are not yet included in the current distribution.</p>
      <p>Fivos</p>
      <p>PS: I missed one of your questions: Yes it can also search in any network location you have access from your computer. You can specify either a local directory or a network location as a new discreet 'FontSet' which you may also switch on/off in every match you perform.</p>
