      <p>As the others have said, it would be extremely useful to plug it into the databases of type distributors, as well as find local font files. I do see the second function as highly useful too as I don't always remember the fonts installed by default with the OS (Like Nina I tend to use only the ones I've licensed or been given), and I know publishers/design agencies that have thousands of font files scattered haphazardly around their networks. (Does it search networks too?)</p>
      <p>One final question: how good is it at recognising photographs of text, which may have some perspective, slant, distortion or squooshing?</p>
