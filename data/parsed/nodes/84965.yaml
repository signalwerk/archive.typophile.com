    html: |-
      <p>Bob, Stephen &amp; Karsten<br>
      thank you all for your thoughts.</p>
      <p>I'm glad you find the interface easy and straight forward because that was one of our primary goals.</p>
      <p>I agree that a different UI skin would make the application more attractive, but there are some inherent limitations due to the Nokia's Qt framework we use to produce the dual Windows / Mac version. Every "beautification" of the UI must be designed &amp; tested to work well on both Mac &amp; Windows and this is not always easy.</p>
      <p>I agree that a connection to a big external font library would be a great plus for the application, although as Karsten pointed out the "restriction" of searching only your own library can also be considered as a big advantage: You may find similar fonts that you already have and you could avoid to buy a new one (or the same one).</p>
      <p>Another alternative could be to create a proprietary font library for each major font distributor (e.g. Adobe, Linotype) and let Find my Font download them and use them for matching. Such libraries will contain off-course only the required matching information -not the actual fonts- and maybe a link to the distributor's site to view/buy any fonts you need. But you already have WhatTheFont if you want to go this way.</p>
      <p>We are examining carefully all the alternatives and some of them are even under development, but I can't say more or promise anything at the moment.</p>
      <p>Best<br>
      Fivos</p>
