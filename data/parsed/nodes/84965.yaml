      <p>"I suppose this is related to Letter Selection Tool tolerance and multiple selection method I described in (d) above."</p>
      <p>Fivos,<br>
      That is part of the story but not what I was looking for. For me, it would be valuable to find and match ligatures and even alternate for a font.  When designing type, I often make many variations on either ligatures or mostly contextual alternates that only come into play in certain situations or combinations of glyphs. I find it hard to tell from my printed samples, which of the variants was chosen by the coding.  Most variants are there to get around awkward joins.  An example might be the ear of the g.  It can work fine with most letters but get awkward next to a "y"--a common possibility.  I realize that his is a very specialized need and surely not worthy of you losing any sleep.  There might be 500 people in the world who might care--hardly a big market!</p>
      <p>Chris</p>
