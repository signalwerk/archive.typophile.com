    <p>Hi everybody,</p>
    <p>my name is Fivos Vilanakis and this is my first post in Typophile forums.<br>
    I'm the chief technical officer at Softonium Developments Inc and I'd like to introduce our new application named "Find my Font".</p>
    <p><img src="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-Win-Connected-Letters_sm.png" alt="Find my Font Screenshot 1"> <img src="http://www.findmyfont.com/images/stories/fmf/screenshots/FMF-OSX-Main_sm.jpg" alt="Find my Font Screenshot 2"></p>
    <p>Product site:  <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
    <p>'Find my Font' reads scanned images or photos and then goes through all the fonts on your computer and matches the letters in the scanned image against the fonts in your computer. You are provided with a list of matching fonts along with the matching accuracy for each one. You may also type some text and see how well the matching went.</p>
    <p>It's ideal for font designers, graphic designers and creative professionals who would otherwise spend hours trying to find a matching font.</p>
    <p>The main features of "Find my Font" are:</p>
    <p><strong>1. It runs natively on both Windows (XP, Vista, Windows 7) and Mac OS/X (intel based)</strong></p>
    <p><strong>2. It works with all common image formats or a screen capture</strong><br>
    You can load any common image file (bmp, gif, jpg, png, tif, +others) or use the screen capture tool to work with a web image or a the on-screen image of another application.</p>
    <p><strong>3. Smart selection tools - No special image preprocessing required</strong><br>
    It provides special tools to easily select any letters present in a color image with no need for a white-background or special image preprocessing. You can e.g. rotate the image, make the text baseline horizontal, split any script letters, or select a letter placed on a complex color background with a few simple clicks.</p>
    <p><strong>4. Matches all of your OTF/TTF fonts either installed or not</strong><br>
    It matches the letters you select from an image, against all Open Type (*.otf) or True Type (*.ttf) fonts installed in your system. You can also specify any number of additional folders containing not installed OTF/TTF fonts and even switch on/off any of these font-sets on a specific matching.</p>
    <p><strong>5. Unicode support</strong><br>
    The Find my Font (Pro edition) supports both matching &amp; indexing on the full unicode range of font characters.</p>
    <p><strong>6. Incredible matching speed!</strong><br>
    The latest version of 'Find my Font' achieves incredible matching speeds. Thanks to our new proprietary indexing algorithm the application is able to scan up to 5 million fonts per minute. At these speeds you can examine e.g. 100.000-200.000 fonts in just 5-10 seconds!</p>
    <p><strong>7. Precise Matching!</strong><br>
    You can find both exact matches of the font you are searching and/or similar fonts.<br>
    <strong>When it comes to matching accuracy we are confident enough to say that, If you don't see an exact match of the font you are searching on the top 5 matching positions, this font probably does not exist in your computer!</strong><br>
    Try the free-trial edition to believe it!</p>
    <p>You can find more on product-editions or download the free-trial application here:</p>
    <p><a href="http://www.findmyfont.com/index.php/download/compare-editions" title="http://www.findmyfont.com/index.php/download/compare-editions">http://www.findmyfont.com/index.php/download/compare-editions</a></p>
    <p><strong>Using "Find my Font" as a copyright protection tool</strong><br>
    There is a special use of Find my Font for font designers: To protect your copyrighted work.<br>
    We all know there are many sites out there claiming they have "free fonts" but most of these are not actually free but illegal copies of commercial fonts packaged under different filenames and/or different family names.<br>
    If you download all available fonts of a "free fonts" site and use your font design as input, Find my Font can tell you in seconds if there are any illegal copies of your design in the downloaded fonts.<br>
    ...and this is only possible because you can instruct Find my Font to match against e.g. 100.000 fonts and still get very accurate results in just 5-10 seconds!</p>
    <p>I know that font designers are actually the most demanding users of our application and I'd love to hear your opinion and thoughts whatever it is - things you like, you don't like, things to improve, anything.</p>
    <p><strong>For this reason we have decided to give 15 Promotion-Codes for Typophile users to download the Find my Font Pro edition for Windows or Mac OS for free.</strong><br>
    The only thing we ask in return is to write your opinion here in this thread to help us improve our product.</p>
    <p><strong>Feel free to respond to this message and ask me to send you a free promotion-code to download the Pro Edition.</strong></p>
    <p><strong>Current Count: All PROMO-CODES are given!</strong></p>
    <p>I wish you lots of creative time!</p>
    <p>Fivos Vilanakis<br>
    Software Engineer<br>
    Softonium Developments</p>
    <p>PS: Although the main purpose of this message is promotional, I have to admit that I'm personally involved in both design and coding of the product and I'm really proud of the final result, therefore I really need to hear your opinion about it. Thank you for your time!</p>
    <p>===================================================<br>
    <strong>UPDATE - 11 May 2012</strong><br>
    New posts:<br>
    <strong>7 Dec 2011: </strong><a class="freelinking external" href="http://typophile.com/node/88132" rel="nofollow">Find my Font v2.3.0 - Find fonts in Images &amp; Browse fonts by Visual Similarity</a><br>
    <strong>11 May 2012: </strong><a class="freelinking external" href="http://typophile.com/node/92904" rel="nofollow">Find my Font v3.0 - Find fonts in Images: Both Local and Online font matching is now supported!</a></p>
