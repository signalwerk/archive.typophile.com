      <p>Thank you for the promo code. I spent quite a while today using "Find My Font" and trying different settings -- it's very useful! For the record, I have a good friend who is a manager at Adobe and I'll show him the software next month when I see him. He doesn't work in Adobe acquisitions, but nonetheless I think he'll be impressed.</p>
      <p>So, here are my notes. I've been told I can be brutally critical....so don't take my opinion personally. It's meant to be constructive criticism. </p>
      <p>After I entered my license number to activate the software, a popup dialog said the application "will restart" so I clicked OK. It didn't restart; it just quit. Eventually, I stopped waiting and restarted it myself. No big deal, but it made me wonder how stable the software was.</p>
      <p>It works pretty well; no crashes, freezes, or confusing/incomplete documentation. It accurately finds fonts based on pixels, which is impressive and quite useful. I expect to use it often. If I don't encounter bugs over the next few weeks, I'll gladly recommend it to clients and co-workers. </p>
      <p>What would I change? Rather than showing a (text-only) list of possible matches, I'd like to see thumbnails. It's kinda cumbersome to scroll through and see each font preview individually. I'd rather compare thumbnail previews of all the possible matches visually in one window. </p>
      <p>Honestly? This might sound harsh, but……I'd be very unlikely to buy this software based on the website and logo. No offense, but clearly your logo wasn't done by a professional graphic designer. Had I found your software/website via google, I'd seriously doubt this company knows anything about type design, graphic design or typography. In fact, the only reason I even noticed you on Typophile was because I was puzzled how somebody who used a faux-metallic gradient avatar (that isn't optically centered) had an eye sharp enough to visually identify so many fonts in the forum. </p>
      <p>This fear was not abated (heightened actually) when I saw the very first page of "Tutorial 1" boldly featured Arial, Comic and Calibri. (Shudder!) Frankly….I was embarrassed to have the window open to the tutorial graphics and looked over my shoulder hoping my co-worker didn't notice! :) </p>
      <p>So, if your target market is graphic designers..….maybe hire one to add some visual sophistication? And, for the love of Jan Tschichold, stop with all the Comic Sans unless you're a kindergarten teacher!</p>
      <p>On the upside, the documentation is comprehensive and well-written. So, in conclusion; it works well and does what you advertise, but it could use some refining from a type snob. If you can do that, well, "Find My Font" could become genuinely indispensable for anyone who works with type. (wow!)</p>
