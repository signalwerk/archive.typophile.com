      <p>At last I’m adding my two cents about the tool.<br>
      They’re pretty random observations and I’m sorry if they overlaps with the ones of others.<br>
      1. First thing, since it is aimed at professional users, which most probably use some font management software or another, Find My Font should, upon the first launch, ask the user where they keep their font files. And/or ask if they would like the app to scan their drives for font files.<br>
      2. I like the single window approach, I find the numbers between parentheses (used to order the steps) distracting. They should at least be replaced by more graphic elements or, better yet, with a different solution (maybe disabling input on the not ready yet steps and/or highlighting the current step).<br>
      3. Some kind of auto-discovering/guess of shapes would be welcome.<br>
      4. Some of the common behaviours I’m missing are:<br>
      - Click and drag to zoom a portion of the image (with the auto-guess thing it would be useful a click and drag selection too).<br>
      - Command-z to undo.<br>
      - In the Finder, the ability of right click on a image file and have Find My Font on the list of "Open with…" apps.<br>
      5. The tooltips on the icons show the Windows keyboard shortcuts even in the Mac version (and Command-s is always used for Save, so it’s a bit confusing having it for Screenshot).<br>
      6. Adjustable/moveable letter splitters would be a nice addition.</p>
      <p>That’s the main of it :-)</p>
