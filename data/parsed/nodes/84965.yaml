      <p>This is certainly an impressive application, and it's proven already that it's highly capable in performing the task it's developed to do. I'll bite and say what has made me a little queasy about this from the start: I wish this wasn't an installable app that uses local fonts. I would really like to see this, as some others have said, as an online service connected to databases of major vendors. That would be so much more helpful.</p>
      <p>Using locally installed fonts, I have to admit that to me for instance this would be of very limited use since I only have a limited set of (licenced) fonts installed, and the ones I have I usually know what they look like (since I also paid for them, or selected them carefully from free stuff, or was given them by their designers, etc). So frankly for me the whole concept seems kind of besides the point, since the fonts I'd usually be looking for would be ones I <em>don't</em> have installed. Is it just me?</p>
