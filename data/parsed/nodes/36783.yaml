      <p>Hi Scruggdesign, sorry as far as I know there are no links to anything related to the paper. Typeface Design hasn't been offered at Massey for years due to low numbers and/or no tutor available. This is the first time in [I don't know how long] it's been able to run thanks to Kris. In fact, it must have been quite a while because nobody has any records of past student work or project briefs or anything. </p>
