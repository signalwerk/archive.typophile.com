      <p>Instead of an unusual/experimental font, have you considered expressing the suffering of Job in another way? His story strikes me as one of complete bleakness, darkness, and deprivation. Why not go Modernist/Minimal? Helvetica blind embossed into black paper? At first it might be orderly and robust, then it might start to wander and disperse, until finally the words are crawling across the page as if on the desert. But they are still Helvetica. </p>
      <p>H. Todd Duren,<br>
      designer. educator. yada yada</p>
      <p>myopendoor.net</p>
