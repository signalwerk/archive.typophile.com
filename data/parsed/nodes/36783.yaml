    <p>Greetings!<br>
    I trust most of know fellow member Kris Sowersby? I'm a student of his pilot Typeface Design class at Massey University. I am in my final year of a 4 year Bachelor of Design degree and am currently doing my major (honours) project on expressive typography. Kris suggested starting a thread here since you guys could point me in some directions for research/inspiration or just general feedback and ideas. </p>
    <p>I'll outline my project for you:</p>
    <p><strong>"Can typography be used in an expressive and symbolic way to visually interpret/extrapolate meanings contained within the words of the Bible?"<br>
    To test this I will  visually interpret/express the book of Job of the Bible.</strong></p>
    <p>I'm looking for any examples of expressive typography that you know of that may help or relate to my project. I am especially on the look out for work that visually interprets a text (poetry for example) and feelings/atmospheres. It can be crazy and 'fine-artsy' as well! </p>
    <p>Any help would be hugely appreciated. Thanks a lot, and I hope to hang around for a while--Kris' type design paper has re-energised my love of typography.</p>
    <p><em>EDIT: As an example of the kind of thing I'm looking at, Tomato's Mmmm... Skyscraper I Love You. I'm looking for work that's much cleaner and/or minimalist than that too.</em></p>
