    <p>Hi all,</p>
    <p>just a quick question for you. I have a logo that I've created for my company. The text for the logo is all lower case and is two words together as one word (like facebook for example), but when I mention the name of the company in a sentence, I'm not sure how to write it. Is there any kind of convention to go by for this?</p>
    <p>I noticed facebook writes it as "facebook" or "Facebook" most times. Its always one word. </p>
    <p>Where as if I look at my bank, their logotype is "CommonwealthBank". In sentences they write it as Commonwealth Bank. That seems more acceptable since the B is capitalized in Bank within the logo...</p>
  html_clean: |-
