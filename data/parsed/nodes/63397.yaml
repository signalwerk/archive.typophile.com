      <p>Okay nice answers guys, thanks a lot! My company name is "creativelifeform" all in lower case. But when I write it in a sentence, I am going to capitalize the "C" so it will be "Creativelifeform". </p>
      <p>Facebook does this, even though their logo text says: "facebook" and I think its fine. I am happy with it being lower case in my logo, but when its in a sentence, I think it should take on the form of a proper noun to give it more presence compared to other words in the sentence. </p>
      <p>Thanks again guys.</p>
