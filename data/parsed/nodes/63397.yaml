      <p>&gt; Where as if I look at my bank, their logotype is “CommonwealthBank”. In sentences they write it as Commonwealth Bank. </p>
      <p>I suspect the name of the bank is Commonwealth Bank, and thus that is how it should be written in text. The omission of the space is only a design thing, and thus only should apply to the logo. On the other hand, if the company name is spaceless, like WordPerfect, then you would omit the space in all cases.</p>
