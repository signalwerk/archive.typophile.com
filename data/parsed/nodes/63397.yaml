      <p>Hi viceversarohan,<br>
      Your logo is your companies identity. The text phrase for your company is also your companies identity. The text phrase can be Trademarked with no specified typeface or color specificatons for use in editorial material and legal documentation, such as, yourcompanyname®. </p>
      <p>The only rules you need to apply are the ones that promote your objective. Consider the context in which you want to be percieved, and apply it to your decision making process. I'm guessing that whenever you write your company name, you want people to be reminded of your logo. </p>
      <p>Be consistent with whatever elements of style you apply to your companies identity and you wont have to worry about trends.</p>
      <p>Mike Lee | <a class="freelinking external" href="http://www.readytype.com">ReadyType™</a></p>
