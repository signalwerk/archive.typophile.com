    html: <p><i>Mostly, any shared culture in the UK has come from the colonial capital, London, and that would certainly be true in the bulk of the 20th century.</i> <br> <br>I wouldn't go that far, Nick. The shared Culture of the British Isles is more about internal migration than anything else. The non-stop movement of enormous numbers of people between Ireland and  mainland Britain (and between Scotland and the North Eastern corner of Ireland in particular) has been going on for thousands of years.  <br> <br>Ans don't forget that 25% of Britons have at least one Irish relative.  <br>Who's been colonising who? <br> <br>Matha</p>
