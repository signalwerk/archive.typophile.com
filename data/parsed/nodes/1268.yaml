    html: <p><i>preposterous...</i> <br> <br>A very dramatic word that, Fredrik. You need to be standing, handcuffed in a courtroom to get the full effect, though. Otherwise, I think it's a bit strong. <br> <br>As to a typeface reflecting a country, I think that if it's used for printing practically everything in a particular geographical area or if it's used nowhere else, we would certainly be tempted to associate the place with face. <br> <br>For a certain number of people, Gaelic typefaces reflect Ireland. Caslon was the typeface used for official publications of the British government and at one stage was used for nearly everything else too (I think).  <br> <br>Did it enjoy the same popularity in Ireland as in mainland Britain? Did it manage to get into the corners of Scotland? I don't know. <br>Could we call it an Anglo-Saxon typeface rather than a British Isles one? I'm thinking of its use in America. <br> <br>Matha</p>
    html_clean: <p><i>preposterous...</i> <br> <br>A very dramatic word that, Fredrik. You need to be standing, handcuffed in a courtroom to get the full effect, though. Otherwise, I think it's a bit strong. <br> <br>As to a typeface reflecting a country, I think that if it's used for printing practically everything in a particular geographical area or if it's used nowhere else, we would certainly be tempted to associate the place with face. <br> <br>For a certain number of people, Gaelic typefaces reflect Ireland. Caslon was the typeface used for official publications of the British government and at one stage was used for nearly everything else too (I think).  <br> <br>Did it enjoy the same popularity in Ireland as in mainland Britain? Did it manage to get into the corners of Scotland? I don't know. <br>Could we call it an Anglo-Saxon typeface rather than a British Isles one? I'm thinking of its use in America. <br> <br>Matha</p>
