    html: <p>Strictly geographical or state-based typography may be a red herring. But typography that reflects culture is, of course, very much a part of our world.  <br> <br>Britain, being a union of several countries and even more cultures (in England, Cornish culture is still identifiably different to, say, Tyneside culture), would find it difficult to be identified by one typeface. <br> <br>Put it this way. Ask any visitor to the UK who has travelled around the various countries and regions about (aural) accents, and you begin tog et a flavour for just how varied the regions and cultural bases are.</p>
