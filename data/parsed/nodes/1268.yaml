    html: "<p>Fredrik, why? <br> <br>Could: I think many fonts do indeed have a certain ethnic/geographical character. <br> <br>Should: Nationalism doesn't have to be bad. And sometimes it's the only tool for a culture to survive the massive attack of Capitalism. I agree that a British type isn't something that needs to worry us too much (unless -like I suspect Matha- we need it as something to <i>counter</i>), but maybe a Serbian one (like Sava*, which I just found out about) does deserve [positive] attention? <br> <br>* <a href=\"http://www.adobe.com/type/browser/P/P_1506.jhtml\" target=\"_blank\">http://www.adobe.com/type/browser/P/P_1506.jhtml</a> (The Cyrillic component, and maybe the rest too.) <br> <br>hhp <br></p>"
