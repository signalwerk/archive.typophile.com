    html: <p>Mostly, any shared culture in the UK has come from the colonial capital, London, and that would certainly be true in the bulk of the 20th century, when the dominant fonts were made for Linotype and Monotype machines. So, that means Times and Gill Sans. <br> <br>However, during much of the 19th century, Scotland was a stronger cultural player than subsequently (on the world scene, too).  <br> <br>So perhaps the 19th century "Scotch Roman", which was influential on a lot of London founders, makes the "Modern" style that was so dominant in that century (and for the first decade of the 20th) a better candidate to represent more than just London. <br> <br>It must be said, however, that this style became popular throughout the English speaking world -- the US and the Empire, so it lacks an exclusive UK association.</p>
