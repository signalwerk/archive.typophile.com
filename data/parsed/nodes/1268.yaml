    html: <p>OK, so I thought the above was pretty damn funny, but nobody responded and I started to wonder. I googled "Galileo" and "inquisition", and found out that I had totally mis-remembered what he said when he "...raised his voice against the ignorance of the Middle Ages." I thought it was "And yet, it still turns," but it really was "And yet, it moves."  <br> <br>So, instead of rhyming with "kerns" and being clever, it's just stupid ... and totally off-topic, to boot. <br> <br>I'm going into the corner to eat kerns.</p>
