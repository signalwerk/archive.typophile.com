    html: |-
      <p>In the early to middle 1800s, typefaces generally didn't have names as such. They were commonly named by the type size and sometimes the general style.</p>
      <p>The word "Duodecimo" in printing refers to a particular size of book, printed with 12 pages per sheet. In context, "duodecimo typeface" would probably refer to whatever particular typeface a given printer chose to use for books of that page size. One printer's "duodecimo typeface" would very likely be different from the next, and a given printer might have more than one "duodecimo typeface."</p>
      <p>Unless you can name a specific book, my prediction is that it will be impossible to determine a single typeface that <em>uniquely</em> fits that description. However, it might not be too difficult to come up with one or more candidates.</p>
      <p>Regards,</p>
      <p>T</p>
