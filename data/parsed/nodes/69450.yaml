    html: <p>That’s one of the myriad scotch roman types of the era. There were loads of them, many being knockoffs of knockoffs of… You won’t find a perfect match because these designs are products of the printing and paper of their time, and tended to have some flaws that aren’t revived today, but if you want a really nice scotch look at Matthew Carter’s Miller.</p>
