      <p>Thanks for the clarification. I thought that name sounded like a printing term a may have heard some time ago.</p>
      <p>The specific book it was used in was the first printed edition of the Book of Mormon. Egbert B. Grandin was the printer/publisher and John H. Gilbert was the typesetter. It was printed in 1830 in Palmyra, NY. Below are some scans of a potential original edition I found online.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/1_4495.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/9_6507.jpg"></div><p></p>
