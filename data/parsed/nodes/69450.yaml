    <p>I am trying to hunt down any visual reference anyone can share of a typeface named Duodecimo. It was at least available during the early to middle 1800s. A serif typeface used in book printing and was available in the United States.</p>
    <p>If this exists in a digital font that would be interesting to see a sample or link of.</p>
    <p>I appreciate any insight into this typeface anyone might have.</p>
    <p>Thanks much,<br>
    JM</p>
