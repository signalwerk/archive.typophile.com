    html: |-
      <p>“Next” is simply Linotype’s label for typefaces that they feel have been revised enough to warrant a new name. Some are more comprehensive revisions than others. Of course, marketing does have something to do with this, but the distinction is also useful because the typefaces really are different.</p>
      <p>The Next label has no direct relation to webfont quality. As Riccardo said, the best way to judge that is by viewing screenshots. Webfonts.fonts.com offers the two Trade Gothics and DIN Next. DIN (the <a href="http://dinfont.com/story/">original name</a> is indeed all caps) is also available as <a href="https://www.fontfont.com/fonts/din">FF DIN Web</a> (no screenshots yet available, but I can tell you it's quite good) and <a href="http://www.myfonts.com/fonts/parachute/pf-din-text-pro/?refby=typographica">PF Din</a> (<a href="http://www.myfonts.com/fonts/parachute/pf-din-text-pro/regular/gallery.html">screenshots</a>), which is quite a different design.</p>
