    html: "<p>An unsuccessful Senatorial candidate here in Minnesota had a radical departure from the sans-on-stars n' stripes approach: <a href=\"http://www.kenpentel.org/\">Ken Pentel</a>. I believe his approach could be summed up in one word: Borax; i.e., cleaning up Congress. <br> <br>And our <a href=\"http://archive.wellstone.org/sites/campaign2002/index.aspx\">Senator Wellstone</a> (RIP) stood out from the crowd by using white on green. <br> <br>What I was trying to suggest above was not a study of how two stars n' stripes logos differentiate from one another, but how some candidates go out of their way to be different.</p>"
