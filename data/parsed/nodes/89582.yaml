      <p>...and if you are looking for an ID...</p>
      <p>1st Image:<br>
      "The Catcher in the Rye" - it could be <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/bell-mt/" rel="nofollow">Bell MT SemiBold</a></strong></p>
      <p>2nd Image:<br>
      "The Catcher in the Rye" - it looks like <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/new-caledonia/" rel="nofollow">New Caledonia Semi Bold Italic</a></strong> or <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/transitional-511/" rel="nofollow">Transitional 511 Bold Italic</a></strong></p>
      <p>while the text body is also close to <strong>New Caledonia Semi Bold</strong><br>
      but it's not a perfect match.</p>
