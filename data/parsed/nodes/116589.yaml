      <p>My first thought is that they used something other than FontLab Studio to do the conversion from TTF to OTF. I’ve never seen that result before in a conversion.</p>
      <p>FWIW, in the image you show, the angled one and the curved one have the exact same number of points. It's just some of what used to be off-curve points defining the shape of a curve, are now part of a straight line segment.</p>
