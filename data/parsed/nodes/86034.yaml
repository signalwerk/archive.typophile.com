  html: |-
    <p>Hello. I hope find you well!</p>
    <p>I have a dude about programming some glyphs with OT features, for various alternates of any letter. For example, I have a J, it is the normal or simple version. Then, this J can be down in its trace of baseline, thinking in a J swash. However, I programmed it J swash using feature with this code:</p>
    <p>feature swsh {<br>
      sub J by J.swash ;<br>
    } swsh;</p>
    <p>Now, I have a new version for J with a extended curve to left, thinking for a initial version, however, it was programmed with:</p>
    <p>feature init {<br>
      sub J by J.ini ;<br>
    } init;</p>
    <p>For one third version of this J, that can be swashed and extended to left for only initial versions, how can I program it mixing both features, initial and swash? Can it be possible?</p>
    <p>My English is not very fluently, I am Spanish-speaker, I hope you can understand me.</p>
    <p>Thank you.</p>
    <p>Vargas1974</p>
