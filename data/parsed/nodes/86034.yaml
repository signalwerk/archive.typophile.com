      <p>If the init features comes after the swsh feature, wouldn't it work to simply add<br>
      sub J.swash by J.swash_ini;<br>
      (or whatever you've named the new character)?</p>
      <p>If it were me, I would probably put the descending /J/ into a "stylistic alternate" feature (salt or ss01) rather than swsh, and I'd put the initial forms in swsh instead of (or in addition to) init.</p>
