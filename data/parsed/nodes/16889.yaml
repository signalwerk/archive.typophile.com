    html: <p>I think the problem may be a little too <em>au courant</em> for the formal authorities to have ruled on the subject, so do the small cap thing for the all-caps acronymns and the U&amp;lc thing for the mixed-case terms. Besides, do you REALLY think that anybody who reads your résumé (besides, perhaps the editors of <em>The Chicago Manual of Style</em>) is going to have any better idea of the RIGHT way to do it?</p>
