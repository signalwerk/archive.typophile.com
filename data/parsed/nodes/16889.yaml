  html: |-
    <p>What is the proper way to set things such as “VoiceXML” or “VoIP”? With other acronyms, I use true smallcaps with extra letterspacing. However, I’m not sure what to do with the lowercase letters in the middle of the acronyms. Do I set it all in smallcaps? Do I ditch the small caps and set it using both u&amp;l?</p>
    <p>I’m redesigning my resume (a computer networking guy) as I read through Bringhurst’s book (with an interest in type). In the “Skills” area of my resume, I have a bunch of acronyms listed such as TCP/IP, BGP, HTTP, SMTP, SNMP, etc. Included in this list are the above mixed case acronyms.</p>
    <p>Any pointers would be appreciated.</p>
    <p>Thanks,<br>
    Pete</p>
