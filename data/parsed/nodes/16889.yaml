    html: |-
      <p>I would use all smallcaps for them, a mix of smallcaps and lowercase may look a bit ackward, maybe not much (depends on the typeface) but you could have problems distinguishing smallcap v, x, z, o, s, k, c or w from their lowercase form.</p>
      <p>Héctor</p>
