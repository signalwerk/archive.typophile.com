    html: |-
      <p>Theo Van Doesburg: Principles of Neo-Plastic Art. Mainz: Florian Kupferberg, 1966.</p>
      <p>This refers to the 6th edition.</p>
      <p>This might not be what you are looking for per se but is the kind of material that inspired the first wave of modernist designers including Paul Rand who was modernist more by his way of thinking rather than clean line aesthetic.</p>
