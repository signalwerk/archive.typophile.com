      <p>Trial and error, right. You have to use your imagination as you're looking through a selection of candidate faces, asking yourself not only "Does this suit the criteria?" but more importantly, "How could I make this suit the criteria?" </p>
      <p>Typefaces certainly have connotations which typographers and graphic designers are aware of, but the reader is unaware of these. For the reader, the meaning derives from the page as a whole. Consider blackletter: what vibe does the reader pick up from such a style, Christmas or Fascism? (To name but two.) The designer decides.</p>
      <p>Whether a typeface will be perceived as ’contemporary’, ’elegant’, friendly’, or ’neutral’ depends on how you use it. Choice of style (weight, slant, horizontal scale), size, color, tracking--these are decisive.</p>
