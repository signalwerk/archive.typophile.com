    <p>I have this project in my Graphic Design class, which is to re-design a packaging for Alice's Stick Cookies. The cookies are great but the design on the packaging sucks (at least according to the Instructor).<br>
    <a href="http://www.magnificentgifts.com/members/821963/uploaded/ASC-8.jpg" title="http://www.magnificentgifts.com/members/821963/uploaded/ASC-8.jpg">http://www.magnificentgifts.com/members/821963/uploaded/ASC-8.jpg</a></p>
    <p>Can you guys recommend a typeface for the company name "Alice's Stick cookies" and maybe another face to go with the (miscellaneous) text on the box?<br>
    I'm going for something that looks contemporary, yet organic, and something that feels a bit sophisticated but not 'elitist' since these are gourmet cookies afterall. Also, the typeface must be available in Font Folio.</p>
    <p>The cookies are shaped-like biscotti if that helps in any way. </p>
    <p>If you also have any other ideas on how to approach this, please feel free to chime in.</p>
    <p>Thanks!</p>
