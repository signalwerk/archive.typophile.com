      <p>Mirko,</p>
      <p>A few first view thoughts of "firstchoicenm1":</p>
      <p>- If the photo is full-color, why not have more color everywhere?<br>
      - Are the cookies beautiful enough to merit a die-cut? If they are, what color are they? You'll want the color of the cookies to be harmonious with everything else you choose.<br>
      - Could the lemons be used more dramatically? Does it have to be a photo? </p>
      <p>I'll add that at this point the type isn't necessarily bad. I like Cronos. Again, once the packaging takes on more direction you'll know more of how/where to use the type.</p>
