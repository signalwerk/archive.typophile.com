      <p>OK, friends, the hotel situation is sorted out. I called our contact at the Hyatt, and we have indeed been filling our room block so availability was tight on some days. The Hyatt was gracious enough to give us a few more rooms at the cheap TypeCon rate, and fixed a glitch in the system that didn't allow singles or kings to be specified on some dates. So if you booked a double and want a king, if you go back now and amend your reservation, you'll be able to fix it. We are going to be short on doubles this year, so please do give up your double if you have one and won't need the extra bed.</p>
      <p>That said, book your rooms fast. They are going quicker than in past years, and more people are coming in early and staying late. We will sell out well in advance of our cut-off, and you don't want to miss being in the conference hotel (especially at such a bargain price).</p>
      <p>I can wholeheartedly echo the sentiments about the lack of pretension and ego in the type community. After admiring the work of people like Matthew Carter and Erik Spiekermann from afar for years, I was so pleasantly surprised to find out what lovely people they are. We are very lucky to have such a welcoming community, and newcomers should never fear - it's easy to make friends at TypeCon.</p>
