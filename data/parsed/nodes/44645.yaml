      <p>Ah, Tiff, finally I'll have a chance to say hello in person. Looking forward to seeing who else is planning on attending so that I might connect face to face with some of the gang I've interacted with around here over the past few years.</p>
      <p>I'm going to spend the entire week in Buffalo (15-21), then head off for a week in NY, with a day at the NY Center for Book Arts, an afternoon each at the Grolier Club and the NYPL Rare Books Division, an afternoon at Poets House (browsing their over 8,000 poetry chapbooks), and then a couple of days visiting galleries &amp; book stores. </p>
      <p>As a tangent to this thread, anyone know of any book shops in NY similar to <a href="http://www.wlbooks.com/cgi-bin/wlb455.cgi/index.html" target="_blank" rel="nofollow">Wessel &amp; Lieberman</a> in Seattle (with dedicated sections of typography &amp; fine-press books)? I'll spend some time at Strand, of course, but I'm looking for small-/fine-press stuff that might be done letterpress.</p>
