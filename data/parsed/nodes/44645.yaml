    html: |-
      <p>Katherine -- </p>
      <p>I don't know what would qualify as beneficial for you. But the truth of the matter is that TypeCon is expressly for people who have an interest in type. It's only incidentally useful for type designers per se.</p>
      <p>TypeCon got its start as a get-together of typophiles (lowercase 't') who just wanted to hang out and indulge/share their love of all things typographic. It just so happens that Bob Colby (the guy who started it, who isn't even a designer at all) convinced Matthew Carter to come and talk. Chank was at the first couple too. And so was David Berlow.</p>
      <p>So, before you know it typophiles of all stripes -- graphic designers, type designers, letterpress printers, non-design-related aficionados: users <em>and</em> makers -- were all congregating together and having a good ol' time.</p>
      <p>The presentations range from historical to technical, from fanciful to practical, from making to using, and everything in between. There's a lot of overlap with design issues and interests -- like past presentations by Kit Hinrichs (SF) or Paula Scher (NY). (And have you heard: Stefan Sagmeister is speaking this year at the Wednesday pre-conference talk.)</p>
      <p>One of the great benefits of TypeCon (compared to conferences like AIGA or HOW or even ATypI) is that it is pretty small and informal, so there is a lot of mixing and mingling -- very little (if any) of that cliquishness that you can find at larger gatherings.</p>
      <p>It really isn't out of the question, for instance, to end up at a coffee break sitting on a bench next to Matthew Carter, James Montalbano, John Downer, or Akira Kobayashi (or even all four!). Plus, type designers get to interact directly with users and hear what they're liking and not liking, etc.</p>
      <p>It's really beneficial for anyone who is interested in type.</p>
      <p>Now, whether or not you can make that case to your boss . . . that's another matter. I suppose it just depends.</p>
      <p>-- K.</p>
