      <p>Yay, TypeCon! I can't wait. The program is coming together, and it's going to be an amazing lineup. The website is so close - our wonderful volunteers are building a better one, and it always takes more time than we think. We changed the early bird registration deadline so you'll all have plenty of time to register at the lowest rate once the website goes live.</p>
      <p>Do book hotel fast, no matter what. We contracted for a very large block of rooms at the Hyatt for our group, but the super low rate of $109 per night means more of our attendees than ever will stay at the conference hotel. We have always sold out our room block in the past, and it looks like we will sell out a lot quicker this year.</p>
      <p>I'm headed back to Buffalo for more planning meetings and to finalize special events and such, just in time for Cinco de Mayo. The weather is wonderful, and everyone in Buff is so excited that we're coming!</p>
