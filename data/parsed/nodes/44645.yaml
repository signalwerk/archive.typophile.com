      <p>Jason -- Glad to hear that you're planning to come this year. That's great. I'll be there, of course. </p>
      <p>We're a little bit behind schedule getting the full TypeCon website up and running (<a href="http://www.typecon.com" title="www.typecon.com">www.typecon.com</a>). There have been some structural overhauls behind the scenes and the web wonks (all generous volunteers!) are working hard to get everything buttoned down. Hopefully soon. </p>
      <p>Naturally, the early registration cut-off has been adjusted accordingly.</p>
      <p>Also, Tamye is still fielding those last-minute proposals and juggling everything to put together another dynamite program.</p>
