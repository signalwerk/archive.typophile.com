    html: |-
      <p>Usually this means your 'em square' is not set to the size the letters have been drawn. Check in particular to make sure your tallest letter above the baseline is the same, or ideally less tall than the value in Font Info/Metrics and Dimensions/Key Dimensions/Ascender. </p>
      <p>Increase that Ascender value to cover the tallest letter, or scale the whole font so the tallest letter fits inside the Ascender value.</p>
      <p>It could be something else, but this is usually checked first.</p>
      <p>Cheers!</p>
