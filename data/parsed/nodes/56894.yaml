  html: <p>Does anyone know how to make a font display correctly in Font Book on the mac? I made it in Fontlab, and generated a TTF, which looks and works fine in Illustrator and other software, but has its head cut off in Font Book. Sorry for newb question. Cheers</p>
  html_clean: <p>Does anyone know how to make a font display correctly in Font Book on the mac? I made it in Fontlab, and generated a TTF, which looks and works fine in Illustrator and other software, but has its head cut off in Font Book. Sorry for newb question. Cheers</p>
