    <p>I have attached a sample of the font I need identified, and it can also be seen at the link below:<br>
    <a href="http://www.empirepalace.net/images/logo.gif" title="http://www.empirepalace.net/images/logo.gif">http://www.empirepalace.net/images/logo.gif</a></p>
    <p>All the lowercase characters are very similar to Bickham Script, but the uppercase characters are throwing me off.<br>
    The uppercase "E" seems pretty standard and can be found in a few English fonts as well as others.<br>
    But that "P" has a pretty unique style to it, so surely someone has seen this before.</p>
    <p>Ive been searching through all my font books with no luck, so im hoping the collective wisdom of the world wide web can be of some help. </p>
    <p>Maybe it is even a combo of different fonts.</p>
    <p>Thanks.</p>
