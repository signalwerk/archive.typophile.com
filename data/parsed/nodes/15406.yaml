    <p>Hi<br>
    A new client has a horrible font for a logotype - they are not that happy with it, but dont want to change it either!<br>
    Does anyone know a similar typeface (dropped serifs etc) that will ‘fool’ them into thinking they are still using the same logo - I want to propose a subtle change.</p>
    <p>Thanks for your time</p>
    <p>Matt Appleton</p>
