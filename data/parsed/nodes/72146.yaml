    date_raw: null
    votes: null
    html: |-
      <p>I would keep time &amp; expenses entirely separate. If you need to spend time picking a printer, getting printing bids, doing a press check, etc then there's no reason to hide that in your markup. It's a legitimate part of your design fee. </p>
      <p>Expenses such as printing should be itemized separately on your invoice, and it's customary to add a markup (in the ballpark of 15% is fairly common). And always mention the markup in your estimate ("a standard markup of x% will be added to all expenses") so there are no misunderstandings later.</p>
