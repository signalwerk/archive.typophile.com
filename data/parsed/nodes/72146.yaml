    html: |-
      <p>&gt; Often the markup is justified because<br>
      &gt; the designer gets a trade discount...<br>
      &gt; The client can't really complain</p>
      <p>Yes, but as long as the markup is reasonable, there's no reason for a designer to ever feel the need to "justify" adding a markup. Adding a markup is standard business practice. Every plumber, carpenter, painter, optician, ad agency -- virtually anyone in any business -- adds a markup to their expenses.</p>
