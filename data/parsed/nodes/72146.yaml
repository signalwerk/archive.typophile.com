    html: <p>You can also negotiate a flat consulting fee for print management. You and your client may both prefer this, since you won't be penalized financially if you reduce their printing costs.</p>
    html_clean: <p>You can also negotiate a flat consulting fee for print management. You and your client may both prefer this, since you won't be penalized financially if you reduce their printing costs.</p>
  - id: 419756
    user: 58010
