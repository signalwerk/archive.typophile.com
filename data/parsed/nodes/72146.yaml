  html: <p>When you guys have some things printed for a client, do you charge a fee if you find the printer, or do you just include it in the cost.  Like carpenters get a cut of all materials bought.</p>
  html_clean: <p>When you guys have some things printed for a client, do you charge a fee if you find the printer, or do you just include it in the cost.  Like carpenters get a cut of all materials bought.</p>
comments:
  - id: 419722
    user: 14722
    date: null
    date_raw: null
    votes: null
    html: <p>If you pay for printing costs you should be marking the cost up 5–10% to cover your associated labor, costs, the risk you take of losing the money if the client doesn’t like the final product, and the time your money is tied on the line while you wait for the client to pay you back. If the client doesn’t want to pay your markup, you give them the files on CD and tell them to deal with printing themselves.</p>
