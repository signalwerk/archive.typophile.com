    <p>We've released several new fonts in the past couple of months, so I thought I'd issue an update.</p>
    <p>The most recent releases at <a href="http://www.fontcraft.com" rel="nofollow">The Scriptorium</a> include Rasael (a lovely script), Rockne (a somewhat psychedelic design), Agravain (a lovely pen hand font) and tomorrow we're releasing Red Star which is based on Soviet era poster lettering.</p>
    <p>A little bit of everything.  Come check out the new fonts and the updated site design at <a href="http://www.fontcraft.com" rel="nofollow">fontcraft.com</a>.</p>
    <p>Dave</p>
