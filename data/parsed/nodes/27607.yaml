    html: |-
      <p>The type in the design is heavy, but its stroke contrast is greater than that of either Clarendon Black or Century Schoolbook Bold.</p>
      <p>Century Schoolbook Ultra is closer in stroke contrast, but then it's too heavy.</p>
      <p>All that said, Clarendon is indeed closer in design. I agree with Mike that it was probably used as the starting point.</p>
