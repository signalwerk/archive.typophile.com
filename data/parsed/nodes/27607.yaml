    html: |-
      <p>You know, I think we're only offering the closest fonts that resemble the lettering. The artist can distort the size and shape of the strokes, serifs and interior spaces (counters). Most likely, no digital font was used in the production of the Love logo. If it was designed before 1980 that is almost a certainty. I think a Clarendon was the typeface he started from.</p>
      <p>- Mike Yanega</p>
