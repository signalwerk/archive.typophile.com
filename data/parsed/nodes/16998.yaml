    html: <p>i’m guessing that this has to do with most fonts coming standard with <a href="/web/20081011044424/http://typophile.com/wiki/tabular%252Bfigures" class="wiki">tabular figures</a>. With <a href="/web/20081011044424/http://typophile.com/wiki/OpenType" class="wiki">OpenType</a> fonts, you can have several sets of figures, proportional figures in addition to tabular figures. However, with your standard Postscript/TrueType font, the decision has to be made about which style of numerals will be most useful. Apparently in many cases this means tabular figures.</p>
