    <p>I’m sure this has been brought up before, so sorry.</p>
    <p>It seems some people don’t think the combination of a <em>1</em> and a <em>9</em> ever comes into play. This lack of attention to detail is pretty sad. Here are some random examples. Trust me, there are MANY more.</p>
    <p>Avant Garde (avantgarde.gif). The Adobe OpenType version vs Berthold. Adobe loses, big time.</p>
    <p>American Typewriter (amtype.gif). Once again, Adobe OpenType loses to Berthold.</p>
    <p>Bembo (bembo.gif). One more time. Adobe loses.</p>
    <p>Aachen (aachen.gif). HEY! Adobe gets it right. This time Bitstream screws the pooch.</p>
    <p>Why is this even an issue?</p>
    <p>Before you defend Adobe, don’t. I’m just stating that their version has this problem, not saying that they suck.</p>
