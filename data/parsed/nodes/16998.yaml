    html: |-
      <p>My guess is that you are seeing the tabular figures which are monospaced.  Many foundries will push the 1 to the right to try to compensate but then it looks weird at the beginning of as line.  Proportional figures solves the problem.</p>
      <p>ChrisL</p>
