    <p>Geography meets typography: The world in words. Starting as an experiment, it turned out to be an exciting product. Finally available here: http;//www.typomaps.net</p>
    <p>The Typomaps are awarded with the IF Design Award and are nominated for the Design Award of the Federal Republik of Germany 2011.</p>
    <p>The Typomaps are handset, and not automatically generated by computer program. Thereby we achieved an astonishing closeness to the conventional worldmap. For the type-interessted people: we used the font ﻿„Helvetica Neue Black Condensed﻿“.</p>
