      <p>Thanks guys,<br>
      Reducing the point size is not an option, it is already as small as it could possibly allow it to go at 7.5pt. I don't think sans + condensed always equals unreadable (the majority of the time maybe), one just has to be careful. I recall the old quote (can't remember from who) "typography is a beautiful collection of letters, not a collection on beautiful letters", so it is really what you do with the typeface that counts. I think a large x-height and small ascenders/descenders could be pretty key, so thanks Nick, Sense is a great recommendation that I didn't know of. Only aesthetic issue is that I am not keen on humanistic faces, which this is. I am quite attracted by Proxima Nova (<a href="http://www.myfonts.com/fonts/marksimonson/proxima-nova/" title="http://www.myfonts.com/fonts/marksimonson/proxima-nova/">http://www.myfonts.com/fonts/marksimonson/proxima-nova/</a>), although I'd imagine the condensed faces are just too tight for any amount of body text, so Sense may win there – I like the idea of it being 'semi-condensed'.</p>
      <p>Hrant, you are not wrong with the idea of a slab-serif number, the previous typeface for the magazine before I redesigned it last was Soho (<a href="http://www.linotype.com/3273/soho.html" title="http://www.linotype.com/3273/soho.html">http://www.linotype.com/3273/soho.html</a>). Ernestine (which I have seen before) is lovely but not right for the job, and the characters are quite wide in regard to the space issue. Olsen would have been good though, just unfortunate in this case it would appear like a step back into the Soho era of the magazine! The irony, maybe grovelling back to Soho would solve my problems!</p>
