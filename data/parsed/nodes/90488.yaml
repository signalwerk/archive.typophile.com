    <p>Currently the typeface of choice is Neuzeit for everything (Headlines, body, footnotes, standfirsts etc) along with a tiny amount of Eagle (black for section tabs, light for pullquotes). I am a big fan of the classic grotesque faces such as Akzidenz and Neuzeit. But it is time for a change and address some practical issues. The main issue is space – I am often cramming content in, and having to reduce the body text tracking when typesetting, despite writers sticking to our current word counts. I know – change the word counts, but I'd rather not for various reasons. </p>
    <p>What I am looking for is a sans serif typeface that will work well in it's condensed form. I recently used Univers condensed for a publication and it worked well at a small format (A5) but I find it 'too much' (i.e. not as easy on the eye) in large amounts. Okay, that may then apply to any condensed face, but a recent discovery of Bauer Neue (<a href="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/" title="http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/">http://lineto.com/The+Fonts/Font+Categories/Text+Fonts/Brauer+Neue/</a>) has been much to my liking, although it is pretty expensive. I like the slightly quirky character whilst retaining a certain formal, 'old school' grotesque demeanour. It also works well for both body and headlines (some may argue against body, but I think it works). Having stated my preferences, I am willing to consider a lot of things, even serif faces. </p>
