      <p>Sans + Condensed = Unreadable.  :-(</p>
      <p>For one thing, saving space doesn't have to come from choosing<br>
      a condensed design; mostly it comes from a large apparent size:<br>
      if you have a font that's large on the body you can simply set<br>
      it smaller; one thing that does is economize with every line,<br>
      with no "cancellation of savings" as when you hit a paragraph<br>
      break with a condensed font.</p>
      <p>As for sans: you can get away with a sans (especially a highly<br>
      readable one like Legato) for a fair amount of text, but I think<br>
      making the reading experience suffer for fashion is anti-design.<br>
      If you choose a "slanted slab" (AKA "sheared wedge") serif font<br>
      you might end up with something modern with great readability.</p>
      <p>This will all sound like a ploy to plug a font that<br>
      I collaborated on, but: <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a><br>
      If you don't like that there are a number of other<br>
      good recent designs in that genre, such as FF Olsen.</p>
      <p>hhp</p>
