      <p>&gt; But isn't Times rather narrow?</p>
      <p>When Times was designed, it was standard practice to<br>
      use different "optical masters" for different sizes, and the<br>
      smaller sizes of Times look nothing like our digital cuts<br>
      of the face - they're much wider (and looser, and larger<br>
      on the body). In fact if you set digital Times at 7.5pt the<br>
      results are pretty useless.</p>
      <p>hhp</p>
