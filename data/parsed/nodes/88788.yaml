    html: |-
      <p><em>The curator looked as if you had farted in his face.</em></p>
      <p>Or smelled one of his own, as it dawned on him that his audience were type designers not academics, and that he was way off base.</p>
      <p>I had paid TDC good money to attend a seminar which included a visit to the New York Public Library to look at specimen books, and instead there I was being forced to sit through a dreary unillustrated talk on Russian history, which had very little to do with type. After 15 minutes of that, and with the clock ticking down to closing time, I decided I’d do us all a favour at the expense of a little personal embarrassment. I don’t recall exactly what I said, but I’m pretty sure I would have interrupted the curator as politely as possible, with “Excuse me…” which is by way of an apology.</p>
      <p>I didn’t feel an apology to the other designers was necessary, as I assumed they were thankful for my little “outburst” and I didn’t poll them to see whether they were appalled, offended, or merely amused by it.</p>
