      <p>&gt;Once you’ve got both faces drawn, glyph by glyph, you need to apply metrics and kerning.</p>
      <p>This is very wrong. Carl points at why. But you should not draw all your glyphs first, and space them second! Instead you should space each glyph as you draw it. As you draw say, the n, open up the metrics window in FL and type is something like nnnnnnnnn and get the spacing right. Then another letter. It doesn't have to be o, but if it was then you could check oooooooooo then ooonooo then nnnonnn then nonononono onononon or whatever! But typeface design isn't a 1-2-3 thing, i.e., drawn-space-kern. More like draw-space-print-test-print-cry-draw-print-test-look-space-draw-sleep etc.</p>
      <p>After you've spaced all your glyphs as best you can, then bring in kerning to solve the space problems that might still be there.</p>
      <p>As to your other question, if you want to buy Superpolator, go ahead! In fact, I want to license it, too. But for your brief, you'd probably come along just fine with FL's MM capabilities.</p>
