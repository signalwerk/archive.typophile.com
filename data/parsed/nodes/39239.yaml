      <p>Well, we do everything in MM space when possible. So we've got fewer fonts than it "looks like" - for example the six weights of Hypatia Sans are generated from an MM base with two masters (with a few exceptions).</p>
      <p>But to answer the question, even then, the kerning of the different masters is related, and one master may start as a copy of another.</p>
      <p>Somebody like Miguel Sousa or Christopher Slye could speak a lot more authoritatively about the whole Adobe kerning workflow with related fonts and big character sets - we've evolved it considerably in the last couple of years, and I managed to duck kerning Hypatia Sans when we ran out of time (Miguel and Robert did it, which I will be eternally grateful for). I'm going to stop commenting now before I say something that's just wrong.  :)</p>
      <p>Regards,</p>
      <p>T</p>
