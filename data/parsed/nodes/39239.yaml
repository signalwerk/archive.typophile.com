      <p>There have been many threads here covering the topic of which software to use for making type. My basic message throughout has been: Eliminate Illustrator from your workflow. The only reason people use it rather than the tools in FontLab or Fontographer is because they are used to Illustrator, and unfamiliar with the type program. Be clear on this; Illustrator is absolutely not better at drawing letters; nor more intuitive, nor faster. It is purely a matter of what one is used to. Believe me on this. And there is no way around the additional steps of importing outlines from Illustrator to FL or FOG. It is only when the outlines are in a type design program that you can align the letters and space them. Bite the bullet, spend one week (seriously) using only FL for digitizing, and I assure you the benefits will become clear. You will no longer prefer Illustrator for type drawing. And you will realize a time savings. </p>
      <p>That is a separate issue from kerning efficiency. Having done type design in 4 different appplications (all on Mac platform), I can say that FL has a much improved set of kerning tools, and the drudgery of kerning that I used to dread is considerably reduced when I use the shortcut Thomas mentions: Do careful, thorough kerning on one weight, export an AFM, and then import only the kerning values from the AFM into the other weight. Run thru them in the kerning window and make adjustments with the arrow keys. Done!</p>
      <p>This also presumes that you've done your spacing well. There are various approaches, but it is clear that the spacing of type is intrinsic to the design of the letters; the proportions, texture and color of a typeface are a function of the spacing as much as the letter shapes. So be sure that each style (or each master, if you want to save even more time) is spaced well before you start your kerning process. </p>
      <p>This suggests yet another time savings; if you are making a range of weights, consider digitizing only extremes of weight or width (or other stylistic variable) and blending the intermediate weights. Superpolator can streamline this as well. FL has options that do in fact propagate changes throughout all masters, based on changes to one master. FL allows you to keep masters linked in an MM file. Research these options; I haven't used them much yet. </p>
      <p>Best of luck and please report back!</p>
