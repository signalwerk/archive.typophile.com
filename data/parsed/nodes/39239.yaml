      <p>Thanks Thomas, I appreciate input from someone with such an authoritative background.</p>
      <p>Your comment brings me to another point, though; in the construction of the truly massive faces produced by Adobe, for example, there are hundreds and sometimes thousands of glyphs multiplied by numerous weights. I'm curious as to how the workflow is managed on a project with so many variables.</p>
      <p>Is each weight of each font an "island"? In my workflow, which is centered around Illustrator and FontLab, the answer is unfortunately yes. In other words, I usually keep detailed notes as I make changes to a given weight, because all of those changes will have to be made in, or rather "translated" to, the other weights. From what I know about FontLab, there's no way for changes to propogate through an entire typeface family based on changes made to a single weight/style.</p>
      <p>So when you say "parallel", is it just a figure of speach, or does Adobe's workflow actually somehow allow changes to be made automatically across an entire typeface as a particular font within the family is modified?</p>
