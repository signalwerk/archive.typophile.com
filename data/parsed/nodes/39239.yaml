    html: |-
      <p>James -- </p>
      <p>The process you describe is not unreasonable, in general. It depends, in part, upon how divergent your ideas are for the four different weights and how far apart you plan to have them. Obviously, it's perfectly feasible to create a Light and Bold that interpolate just fine for Regular (without refinement) and Semibold. </p>
      <p>Alternately, you might want to try designing the Regular and Bold as your starting points; then interpolate the Semibold; and extrapolate and refine the Light. </p>
      <p>Yes, extrapolation is often less reliable than interpolation. But this way if you only end up having time for two weights, they will be the more useful ones. </p>
      <p>The usefulness of the extrapolation will depend upon how careful you are in creating your base designs with perfectly harmonious point structures. </p>
      <p>Since I tend to think of Regular as the home base in my designs, creating a Light pole that will interpolate a Regular where I want it is too abstract for me. If I'm going to have to spend time tweaking something, I'd rather design the Regular how I want it and tweak the Light. (I'm talking about serif designs. I imagine sans serif would be a little easier to predict.)</p>
      <p>-- K.</p>
