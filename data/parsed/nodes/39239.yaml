      <p>As my thesis work involves creating a face with four weights (and a very limited character set!) I am very interested in this topic. Would it be possible to generate light, regular, semibold, and bold weights with the following process?<br>
      1 –&nbsp;Draw light and bold weights<br>
      2 – Use Fontlab’s blending tool to create a regular weight from light and bold.<br>
      3 – Refine the regular weight<br>
      4 –&nbsp;Blend the regular and bold to create the semibold</p>
      <p>If that process is completely loopy, should I just try to pick up the basics of Multiple Master? Or would I be better to just buy Superpolator?</p>
      <p>And before anyone points it out, yes, I realize how stupid trying to do four weights for a school project is, and yes, I fully expect it to go horribly wrong. But if I shoot for four and only end up with two, it will still impress people.</p>
