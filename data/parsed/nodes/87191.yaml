  html: |-
    <p>A fully functional, freeware OpenType font editor/designer for windows.<br>
    Allows you to design, edit and convert OpenType TrueType (.ttf) and PostScript (.otf) fonts.</p>
    <p>Type light is free for personal and limited commercial use (you can sell your fonts provided that is not your profession). Please read the license.</p>
    <p>Features:</p>
    <p>    Convert between OpenType TrueType and OpenType PostScript fonts.<br>
        Edit glyphs as TrueType or as standard PostScript curves.<br>
        Create and edit fonts containing up to 65535 glyphs.<br>
        Map glyphs to any of 65536 unicode characters.<br>
        Input OpenType metrics, names and parameters.<br>
        Refer to an easy to read, colour PDF manual.<br>
        Obtain free support and technical assistance.<br>
        Ten levels of undo/redo.*<br>
        Mapping Window bookmarks.*<br>
        Unicode input for names table.*<br>
        Adjustable Mapping Window cell size.* (*new in 3.1) </p>
    <p><a href="http://cr8.netfirms.com/typelight.html" title="http://cr8.netfirms.com/typelight.html">http://cr8.netfirms.com/typelight.html</a></p>
