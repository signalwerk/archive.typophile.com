    <p>Hi there!</p>
    <p>Looking to find out what font is used for the "Thirst Quencher" bit. Or at least something really close to it! I assume this is NOT a custom typeface, given how much it is used on the label, etc. I also assume this treatment has been skewed. Or maybe this is the italic form?</p>
    <p><img src="/sites/default/files/old-images/Screenshot 2014-03-26 14_5960.53.48.png"><br><img src="/sites/default/files/old-images/Screenshot 2014-03-26 14_5782.53.57.png"></p>
    <p>A shot of the "lemon ice" which appears to be in the same font.</p>
    <p><img src="/sites/default/files/old-images/Screenshot 2014-03-26 14_5334.57.39.png"></p>
    <p>Thank you!</p>
