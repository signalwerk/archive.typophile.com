      <p>Claire, something I want to mention is that in addition to any legal statements you want to make in the contract, it's also an opportunity to make sure that you and your client have similar expectations about the job, in order to prevent misunderstandings or disputes later.</p>
      <p>It's a place where you can state 1) what services you intend to provide, 2) what your charges will be, and 3) what the project's schedule will be.  Even if you've already discussed these things verbally with your client, putting them in writing and having your client sign off on them is a good idea.</p>
      <p>If you and your client are in agreement on those things BEFORE the work begins, it will greatly reduce the chance of problems later.</p>
