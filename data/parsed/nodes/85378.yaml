      <p>Unless you stated it in your contract, the 'due on x' is fairly arbitrary...especially if your client is a big company. They'll pay when they're ready to pay, unfortunately.</p>
      <p>You can declare interest after x days. How well you can enforce it is another issue.</p>
      <p>For most of my clients (that I have a good relationship with) my invoice is typically just an email:</p>
      <p>Subject: Invoice for (work description)</p>
      <p>date: xx/xx/xx<br>
      description: (what the work was)<br>
      amount: $x @ x hours = TOTAL</p>
      <p>And then add my address for payment.</p>
