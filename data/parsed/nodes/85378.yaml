      <p>This is the text of my invoice, which is more or less the text recommended by the Graphic Artists Guild. Of course, for most of this to be applicable and.or enforcible, you need a similarly worded contract to begin with. Oh, and in the process of copying this, I noticed a typo. So thanks, Claire, for giving me a reason to look over my invoice.</p>
      <p>FRONT:</p>
      <p>CONTACT INFORMATION<br>
      Contact name:  <br>
      Company:  <br>
      Position:  <br>
      Address:  <br>
      E-mail:  <br>
      Phone:   </p>
      <p>ASSIGNMENT DESCRIPTION<br>
      Date:  <br>
      Assignment number:  <br>
      Delivery date:  <br>
      Commissioned by:  <br>
      Purchase order number:  <br>
      Materials supplied by:  </p>
      <p>DESIGN FEES<br>
      Conceptualization:  <br>
      Execution:  <br>
      Development:  <br>
      total design fee:  </p>
      <p>HOURLY SERVICES<br>
      Typesetting (English):  <br>
      Copywriting:  <br>
      Photoshop work:  <br>
      Typesetting (other):  <br>
      Proofreading:  <br>
      total services fee:  </p>
      <p>EXPENSES<br>
      Client shall reimburse the designer for all expenses.<br>
      Illustration:  <br>
      Photography:  <br>
      Typefaces:  <br>
      Models and props:  <br>
      Materials and supplies:  <br>
      Messengers:  <br>
      Copies:  <br>
      Printing:  <br>
      Client’s alterations:  <br>
      Toll telephone calls:  <br>
      Transportation:  <br>
      Shipping:  <br>
      Other:  <br>
      total expenses:  </p>
      <p>total fee due to designer:  </p>
      <p>RIGHTS TRANSFERRED<br>
      The Designer transfers to the Client the following exclusive rights of usage:<br>
      Title or product:  <br>
      Category of use:  <br>
      Medium of use:  <br>
      Edition:  <br>
      Geographic area:  <br>
      Time period:  </p>
      <p>Any usage rights not exclusively transferred are reserved to the Designer. Usage beyond that granted to the Client herein shall require a mutually agreed-upon additional fee subject to all terms. Any transfer of rights is conditional upon receipt of full payment.</p>
      <p>BACK:</p>
      <p>1. Time for payment<br>
      All invoices are payable within 30 days of receipt. A 11⁄2% monthly service charge is payable on all overdue balances. The grant of any license or right of copyright is conditioned on receipt of full payment.<br>
      2. Default in payment<br>
      The client shall assume responsibility for all collection of legal fees necessitated by default in payment.<br>
      3. Expenses<br>
      The Client shall reimburse the Designer for all expenses arising from this assignment, including the payment of any sales taxes due on this assignment,.<br>
      4. Changes<br>
      The Client shall be responsible for making additional payments for changes requested by the Client in original assignment. However, no additional payment shall be made for changes required to conform to the original assignment description. The Client shall offer the Designer the first opportunity to make any changes.<br>
      5. Cancellation<br>
      In the event of cancellation of this assignment, ownership of all copyrights and the original artwork shall be retained by the Designer, and a cancellation fee for work completed, based on the contract price and expenses already incurred, shall be paid by the Client.<br>
      6. Ownership and return of artwork<br>
      The Designer retains ownership of all original artwork, whether preliminary or final, and the Client shall return such artwork within 30 days of use unless indicated otherwise below:</p>
      <p>7. Credit lines<br>
      The Designer and any other creators shall receive a credit line with any editorial usage. If similar credit lines are to be given with other types of usage, it must be so indicated here:</p>
      <p>8. Releases<br>
      The Client shall indemnify the Designer against all claims and expenses, including reasonable attorney’s fees, due to uses for which no release was requested in writing or for uses that exceed authority granted by a release.<br>
      9. Modifications<br>
      Modification of the Agreement must be written, except that the invoice may include, and the Client shall pay, expenses that were orally authorized in order to progress promptly with the work.<br>
      10. Uniform Commercial Code<br>
      The above items incorporate Article 2 of the Uniform Commercial Code.<br>
      11. Code of Fair Practice<br>
      The Client and Designer agree to comply with the provisions of the Code of Fair Practice.<br>
      12. Warranty of originality<br>
      The Designer warrants and represents that, to the best of his knowledge, the work assigned hereunder is original and has not been previously published, or that consent to use has been obtained on an unlimited basis; that all work or portion thereof obtained through the undersigned from third parties is original or, if previously published, that consent to use has been obtained on an unlimited basis; that the Designer has full authority to make this agreement; and that the work prepared by the Designer does not contain any scandalous, libelous, or unlawful matter. This warranty does not extend to any uses that the Client or others may make of the Designer’s product that may infringe on the rights of others. Client expressly agrees that it will hold the Designer harmless for all liability caused by the Client’s use of the Designer’s product to the extent such use infringes on the rights of others.<br>
      13. Limitation of liability<br>
      Client agrees that it shall not hold the Designer or his agents or employees liable for any incidental or consequential damages that arise from the Designer’s failure to perform any aspect of the project in a timely manner, regardless of whether such failure was caused by intentional or negligent acts or omissions of the Designer or a third party.<br>
      14. Dispute resolution<br>
      Any dispute in excess of $8,000 arising out of this Agreement shall be submitted to binding arbitration before a mutually agreed-upon arbitrator pursuant to the rules of the American Arbitration Association. The Arbitrator’s award shall be final, and judgment may be entered in any court having jurisdiction thereof. The Client shall pay all arbitration and court costs, reasonable attorney’s fees, and legal interest on any award of judgment in favor of the Designer.</p>
