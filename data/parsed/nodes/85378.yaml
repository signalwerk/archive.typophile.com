      <p>Claire, I’m not familiar with the rules outside Norway, but here you need to have (or be part of) a firm to make an invoice. You also need to state your address and business information (organization number &amp; name), the customer’s address and list the items and/or services purchased and/or licensed and specify their price and any additional taxes and fees. You’ll probably also want to include some information on how one can pay you (account number, IBAN, BIC, bank name, &amp;c). Each invoice must have a unique number (invoice #0001, invoice #0002 etc), and these must be generated by an automated system. The invoice must be in a read-only mode. I use a web service to make mine, and often provide a translated copy for international customers. </p>
      <p>I suggest you contact an accounting office to ask about what rules apply to your situation.</p>
