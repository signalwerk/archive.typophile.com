  html: <p>hi, hi!!!! i'm very anxious. sometimes ago i did a job for a local gallery and now when it's time to pay they would like an invoice. i have never done this type of thing. how do i make the invoice. please help me. do i design it myself. can you show me some examples of your invoices if you have please please, thank you so much!!!!!!!!!!! ok bye.</p>
