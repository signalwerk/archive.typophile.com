      <p>I started using contracts when someone took a brochure I designed for them, put it on a billboard, and didn't pay me for the additional use. My favorite part of the contract is this fantastic bit here:</p>
      <p>————————<br>
      RIGHTS TRANSFERRED<br>
      The Designer transfers to the Client the following exclusive rights of usage:<br>
      Title or product:  <br>
      Category of use:  <br>
      Medium of use:  <br>
      Edition:  <br>
      Geographic area:  <br>
      Time period:  </p>
      <p>Any usage rights not exclusively transferred are reserved to the Designer. Usage beyond that granted to the Client herein shall require a mutually agreed-upon additional fee subject to all terms. Any transfer of rights is conditional upon receipt of full payment.<br>
      ————————</p>
      <p>What this section does is makes it clear that you grant the client only the right to reproduce your work in a certain medium for a certain amount of time, and that you are NOT selling them the copyright to the design itself. Because graphic design is technically not copyrightable in the first place, you need to kind of invent your own copyright protection, which you do by including the above section in a contract. It also says that the client does not have the legal right to use your work until they've paid you, which is nice.</p>
      <p>(By the way, my source for this wording is the Graphic Artists Guild, which publishes a "handbook" of sample contracts for all occasions.)</p>
