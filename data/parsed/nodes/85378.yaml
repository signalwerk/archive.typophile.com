      <p>Claire, an invoice is just a bill. A Google search will show you many sample invoices.</p>
      <p>Things may be different in your country, but in the U.S. an invoice doesn't have to use a specific design. I've received invoices from individuals that were just emails, or were just handwritten on a plain sheet of paper. But if you want the invoice to look more professional you can use a pre-printed invoice form (available at office supply stores or on the internet) or design your own, and then either mail it to them or send as a PDF attachment. Here's the info on a typical invoice:</p>
      <p>Date: today's date</p>
      <p>From: your name and mailing address</p>
      <p>Identification: In some countries you may need to list a government identification number for yourself, for tax purposes. A local business person or accountant (or maybe even a librarian) could tell you if this is necessary where you live.</p>
      <p>To: name and address of the company or person you are billing</p>
      <p>Description: Describe what the bill is for, and list the price. Be specific in your description so they clearly know what the bill is for. Also list taxes, if appropriate, and then a grand total.</p>
      <p>Payment Instructions: I'm guessing the gallery will just mail you a check, so say "Make check payable to [your name or business name]." If they want to pay you by electronic funds transfer, you'll need to give them the appropriate bank info for that.</p>
      <p>Reference Number: Each invoice should have a reference # of some kind. You could call it "Invoice #001". Or if you don't want to reveal that this is your very first invoice, number it #501 or pick some other number.</p>
      <p>Terms: State when the bill is due (30 days is typical in the U.S.) and tell if there are any penalties for late payment.</p>
