      <p>“How do I politely tell them we’d like the rest of our money and to finish off the project?”</p>
      <p>You don’t. Politeness has nothing to do with this.</p>
      <p>You say “We’ve finished the project as outlined in the proposal. Please pay the attached invoice. As for the additional changes requested, we will prepare a separate proposal and get that to you ASAP.”</p>
      <p>Also, get used to using the term ’change order’ ;o)</p>
