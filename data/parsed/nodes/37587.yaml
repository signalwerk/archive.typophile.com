    html: |-
      <p>I’m assuming with a ’new’ client you obtained half the budget up front before undertaking any work?</p>
      <p>Start by trying to see the problem from their perspective. Many designers talk about reaching a good rapport with a client as a way of doing good work. This works both ways, they need to believe you are on their side and interested in what they are doing and are’nt just trying, rightly or wrongly, to make a quick buck.</p>
      <p>If and when problems start on a job, I try and meet the client face to face as soon as possible. By nature people tend to take a more even handed tone in these situations, then when firing off emails. Its up to you, once in this sitution, to put your case for extra on the budget etc whilst discussing the merits of the job.</p>
      <p>There is nothing like money and deadlines to get a client thinking straight.<br>
      Its all a game of cat and mouse really.</p>
