    <p>My partner and I took a freelance job a few months ago and the project is basically done. </p>
    <p>Unfortunately the clients keep asking for more little things here and there and frankly the tone is starting to get a little bit abusive. Things like constantly calling us at home and during work after we’ve repeatedly asked just to be emailed, telling us their deadlines (often give to us short notice) are more important than our real job etc etc.</p>
    <p>The “edits” are starting to get a bit outlandish as well. Things like programing a spell checker into their back end mailing list. (when the the simple answer would just be for them to update their ancient versions of IE)</p>
    <p>How do I politely tell them we’d like the rest of our money and to finish off the project? The contract never stipulated how many revisions were to be made (learned my lesson) but this project has gone at least a month over schedule.</p>
    <p>Frankly I don’t take abuse very well and I’d really like to finish this on an as polite note as possible. You know reputation and karma and all that.</p>
