      <p>Was a spell checker on the mailing list part of the original project? When new things are suggested that were not part of the original agreement, you respond with a cheery “Sure, we can do that. It will only cost $xxxx” (or better yet, change the second sentence to “Would you like me to get a price for that.”</p>
      <p>You will find that a lot of essential, important, can’t-live-without-it changes become unnecessary when there is a price tag attached to them.</p>
