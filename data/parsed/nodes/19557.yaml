    html: |-
      <p>First the logo: while at first I didn't especially love it, especially the width and feeling of slowness (at least for me) of the W, I'm now growing to like it a bit more, especially when it's compared to the <a href="http://www.ps3rules.com/ps3-images/ps3-screenshots/ps3-logo.jpg" rel="nofollow">PS3</a> and <a href="http://www.eurogamer.net/assets/articles/a58844/a_med_allegedxbox360leakedlogo.jpg" rel="nofollow">X360</a> logos. To me, the logo sets the console apart; there is such a difference between the more angular PS3 and X360 logos and this one that you can't help but think that Nintendo's system is different (for better of worse...).</p>
      <p>Briefly on the name: I actually don't hate it. While of course the first thought that came to my mind was the bodily fluid (makes me feel very mature...), I think that the most important thing about it is that it's distinct. While "Revolution" did communicate the essential idea about the system, it does blend together a bit too much with the other names...think about the potential mixup between "360" and "Revolution." While Revolution wasn't anywhere near bad, Nintendo really wants to set itself apart from the field, which is obvious if you take a look at the current concepts for the console.</p>
      <p>I also just found (I think via Gamespot, but I'm not sure) a <a href="http://www.snarkhunting.com/2006/04/nintendo-wii-brilliant/#comments" rel="nofollow">blog post</a> that suggests that the whole "Wii" thing is a giant publicity stunt, a la "I love bees." It makes a compelling point, but I feel like Nintendo wouldn't have made such a strong point for it in their press release if it were just a hoax.</p>
