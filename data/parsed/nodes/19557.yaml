    <p>Nintendo's next gen console logo "wii".</p>
    <p><a href="http://www.nintendo-europe.com/NOE/en/GB/news/article.do?elementId=8BSOIycJ4t1tpTSwy9u2VmCZRDTV1y8N" title="http://www.nintendo-europe.com/NOE/en/GB/news/article.do?elementId=8BSOIycJ4t1tpTSwy9u2VmCZRDTV1y8N">http://www.nintendo-europe.com/NOE/en/GB/news/article.do?elementId=8BSOI...</a></p>
    <p>Personally I'm not really liking the name or the logo. I like the concept behind it, but I can't help but think "wee". And I don't think the characters have been designed and spaced very well either, they don't seem to fit togther nicely.</p>
    <p>What do you think?</p>
