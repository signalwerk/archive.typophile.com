    html: |-
      <p><strong>TYPOPHILE AT LAST!</strong></p>
      <p><em>First time poster, here!</em> I love type, don't know much about it... I did subscribe the RSS and have been watching you go on about it, though, and "I'm lovin' it!"™</p>
      <p>About wii... well, I must say I didn't like the name at first -- lets be honest, I rejected it immediately --, but now that I know the concept behind the idea, it is growing in me... so, the name is OK. In a bit of a strange way, it actually fits the product (though I think they could probably have taken a more serious approach to it). But I'd probably like it even better if they hadn't come up with such a "toyish" looking logo... it also reminded me immediately of other things, so much that when I took a first glance at it, it didn't even make me stop for a while –- as one of us does -– because I just thought it was an old "over and over again" logo from some wi-fi protocol or something like that. It surely doesn't seem like a strong enough kind of image for such a risky kind of product. Have you seen it? It really is a shot at changing the way we play...</p>
      <p>The logo actually makes me feel like we've been there and done that. Reminds me of Intel's viiv, reminds me of Sony's VAIO -- the wave with the straight edges that is the W in wii and the VA in VAIO, mostly -- and of their whole communication style, and also... I'm sure I've seen that same WI somewhere else but I just can't quite put my finger on it... so it's clear: they should probably take a bit of a walk on the wild side. The name doesn't help with that, either.</p>
      <p>On the other hand... maybe that's their whole idea! They make it look like anything else and everything else so that we absorb it without even noticing! Hahaha! xD (not)</p>
      <p><em>(I need to come up with an original signature)</em></p>
    html_clean: |-
