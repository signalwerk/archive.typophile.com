      <p>I'd be extremely surprised if the logo for classic Danish record company Mega records was anything other than lettering. This style of writing is technically not impossible to reporduce with 1983 font technology, but I'd still wager good money on it being made by hand.</p>
      <p>One good indicator of this is that the original logo was slimmer and slightly different:</p>
      <p><img src="http://cdn.discogs.com/QRHCJ1mufHSoj50AmPMknkCw3NA=/fit-in/180x180/filters:strip_icc():format(jpeg):mode_rgb()/discogs-images/L-2061-001.gif.jpg"></p>
