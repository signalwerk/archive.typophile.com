    <p>I was wondering if anyone could identify this font from the HBO show Deadwood. Both the font in the title and the text at the bottom of the poster.</p>
    <p><a href="http://www.libertyhill.org/images/2009_auction/2009/deadwood.jpg" title="http://www.libertyhill.org/images/2009_auction/2009/deadwood.jpg">http://www.libertyhill.org/images/2009_auction/2009/deadwood.jpg</a></p>
    <p>Also, any suggestions for other fonts one would put under the category of "Americana"? (not saying the aforementioned font is one, but I would like any help.)</p>
    <p>thanks.</p>
