    html: <p>OTs handle like PS Fonts in most other applications (depending on whether it is a PS-based OT or a TTF-based version, but most Pro-OTFs should make no trouble with PS-Output), but of course you won't get the additional OTF-Features. I think its about time other programs start implementing OT. Professional Open Type is a wonderful thing, and yeah, I find myself working more and more with InDesign because of this, even with jobs I might have done in FH before. </p>
