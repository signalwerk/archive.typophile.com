  html: <p>Since I started using the OpenType version of the  <br>Neutraface family in InDesign <i>(this is what digital  <br>typography always was meant to be, although the  <br>OpenType features of Neutraface are VERY basic  <br>unfortunately)</i> I constantly need to switch back to  <br>the PostScript version when I want to work in  <br>other software. <br> <br>For example for a congress book I'm currently  <br>designing, the cover is done in Adobe Illustrator 10  <br>(no support for OpenType), but the book itself is  <br>in Adobe InDesign 2 (OpenType supported). I  <br>can activate only one version at the time in ATM,  <br>because it sees them as conflicting duplicates  <br>(quite logical IMO). So when I want to switch  <br>software, I have to deactivate and remove one  <br>version of the fonts and then import the other  <br>version. This is a bit tedious. <br> <br>Does anyone know a more elegant way for doing  <br>this? (And please don't give me any "try designing  <br>your cover in InDesign too" nonse, smartypants!)  <br><img src="http://www.typophile.com/forums/clipart/wink.gif" border="0"></p>
  html_clean: <p>Since I started using the OpenType version of the  <br>Neutraface family in InDesign <i>(this is what digital  <br>typography always was meant to be, although the  <br>OpenType features of Neutraface are VERY basic  <br>unfortunately)</i> I constantly need to switch back to  <br>the PostScript version when I want to work in  <br>other software. <br> <br>For example for a congress book I'm currently  <br>designing, the cover is done in Adobe Illustrator 10  <br>(no support for OpenType), but the book itself is  <br>in Adobe InDesign 2 (OpenType supported). I  <br>can activate only one version at the time in ATM,  <br>because it sees them as conflicting duplicates  <br>(quite logical IMO). So when I want to switch  <br>software, I have to deactivate and remove one  <br>version of the fonts and then import the other  <br>version. This is a bit tedious. <br> <br>Does anyone know a more elegant way for doing  <br>this? (And please don't give me any "try designing  <br>your cover in InDesign too" nonse, smartypants!)  <br><img src="http://www.typophile.com/forums/clipart/wink.gif" border="0"></p>
