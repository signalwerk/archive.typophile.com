    html: <p>I'm not as up-to-date on Illustrator 11 as Jean is; however, I have encountered a similar problem with a corporate identity piece I designed in InDesign. The client came back to me and asked for a .dxf file of the logo for output on a CAD system. Fortunately, I had both the OT and PS version of the font, but had to revert to using an Expert font to get the old style figures. Good thing I didn't need to match the tracking and kerning exactly. Matching the Optical kerning and Optical margin alignment from InDesign in Illustrator would be tedious.  <br> <br>I agree with Yves though, for single pages of closely integrated text and illustration, I still prefer Illustrator.</p>
