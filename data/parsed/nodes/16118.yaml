    html: |-
      <p>All I can think of is Law firms and brokerage firms.  They are all lists of names. Eventually they either succumb to logic and adopt a shorter name or use an acronym.<br>
      Sometimes the full name is used until a brand is identified. Then they switch to something logo-able later.  I have never seen a laundry list brand-name which works as a logo. You may be bucking with the partner ego problem where each partner wants billing.</p>
      <p>ChrisL</p>
      <p>Merril, Lynch, Pierce, Fenner, Smith and Ross became Merril Lynch<br>
      International Business Machine became IBM<br>
      United Parcel Service became UPS</p>
