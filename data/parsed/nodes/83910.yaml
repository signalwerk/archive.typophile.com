    <p>Attached is a logo proposal for a publishing and communications company with environmental objectives. They are branching out to include web media services.</p>
    <p>The idea behind logo1 and logo3 is for the leaves to show the recycling around the globe (to show digital communications). we have been unsure about if this is too much and so tried to simply add a leaf into the r on logo2</p>
    <p>any feedback would be amazing..</p>
