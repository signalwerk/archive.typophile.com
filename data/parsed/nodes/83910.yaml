    html: "<p>I didn't see #2 as a leaf, and the others feel too generic in their treatment of such a common symbol as a leaf.  I get the recycling/leaf idea, but I would brainstorm some more concepts.  Maybe something speaking to the kind of media they are involved in.  Especially with the name being so vague, you might want to really focus on communicating that essence of who they are.</p>"
