    html: |-
      <p>Regarding #1 and #3: that's a charged symbol in a bunch of contexts, see <a href="http://en.wikipedia.org/wiki/BDSM#Symbols" rel="nofollow">BDSM emblem</a> and generally <a href="http://en.wikipedia.org/wiki/Triskelion" rel="nofollow">Triskelion</a>. I'm not saying avoid generally, but be aware of how much this might be reminiscent of.<br>
      To be honest in #1 I didn't see leaves, but some sort of a propeller or something. I'm not sure it needs this rotating motion; «leaf» already says «environmental», to include recycling on top of that seems redundant (and potentially mismatched imagery).<br>
      I most like the idea behind #2, although I agree it needs some work still to clearly read as a leaf.</p>
