    <p>...makes the font developers life happier.</p>
    <p>On several threads on typophile I read, font developers having massive problems updating their font in the development process. They have to search for font caches, deleting them and so on. In these days most developers made OpenType fonts and using InDesign for testing like I do. So hopefully this methode will work for you too guys.</p>
    <p>tested on: Windows XP, InDesign 2 and InDesign 4 (CS2) and several OpenType (CFF) fonts with feature code.</p>
    <p>1. Use the native font directory of InDesign for your test fonts.<br>
    e.g. /InDesign/Fonts/myfonts/</p>
    <p>2. Start InDesign, made a new document and made a text box using your test font.</p>
    <p>3. Made a second text box with an other OpenType (CFF) font like Myriad Pro shipping with InDesign. (an OpenType (TrueType) font like TNR don't worked for me - don't know why)</p>
    <p>InDesign is now "holding" your font since you have activated it by making a text box using it. So InDesign has to cover an other font, but in general it will not "decover" your font you like to update. - But here is the clue.</p>
    <p>4. Select the second text box with Myriad Pro or any other "higher" OpenType (CFF) font.</p>
    <p>5. Open the GLYPHS window, the same font should be seen like the active one from the text box - Myriad Pro, and now select any glyph and make a double click, so the glyph will appear in this text box.</p>
    <p>Strange, but now InDesign will lose the selection of your first font, your test font.</p>
    <p>6. Switch to your directory tool/manager and now its no problem to delete your test font from InDesigns native font folder. Don't use overwrite - you have do delete it first.</p>
    <p>7. Now made your changings (kerning, feature code, outlines... ) and compile your new test font. Copy this font with the same file name (the internal font names should be the same) right into your native InDesign directory.</p>
    <p>8. Switch back to InDesign. InDesign will renew its font engine - like a new font is activated and vola, you have the new test font active without closing InDesign.</p>
    <p>So, try this and tell me if its working for you too. I hope InDesign will react the same way on a Mac system.</p>
    <p>--<a href="http://www.astype.de" target="_blank">astype.de</a>--</p>
