      <p>&gt; <em>I hope InDesign will react the same way on a Mac system.</em></p>
      <p>It does.</p>
      <p>In fact, I do something similar to what you do, but probably more simple. What I do is to generate with FontLab any .otf font I'm testing, and save it directly in InDesign's own Fonts folder, overriding any previous version of that same font. And this can be done with InDesign running. Once you switch to InDesign, you'll get the hourglass/beachball and after a couple of seconds you're font is updated on-the-fly.</p>
