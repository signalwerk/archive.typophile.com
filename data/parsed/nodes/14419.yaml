    html: |-
      <p>I think this has a lovely 'classic' feel to it. I agree with Hrant that it's worth while finishing it.<br>
      Personally I kinda like the 'e'. OK, it will give you problems solving the graytone in your font, but if I see how you've managed your first curves, I'm fairly confident you'll do just fine.<br>
      Get it into FontLab and you can more easily work on the harmony of the font. </p>
      <p>Some little things you might wanna look for:<br>
      - Maybe give the foot of the 'y' a bit more weight. It ends a bit to thin, if you ask me.<br>
      - The spine of the 'S' is to heavy. And it seems to be hanging backwords just a bit. You might wanna rotate a degree clockwise.<br>
      - The 'M' could be more heavy overall.<br>
      - Perhaps you should modify the bowl of the 'p'. It's to much an 'o' with a stem stuck to it. Technically you did it right, but optically something bothers me about the bowl/stem configuration (look at the word 'Up'). The 'q' seems fine to me.</p>
      <p>I love:<br>
      - Your big 'O'<br>
      - Your numerals look very promissing. I want to see more, please. I think they'd be very lovely as OSF (Old Style Figures).<br>
      - Your sharp curves, they have a freshness to it.</p>
      <p>Keep up the good work and give us an update when you've put it into FontLab. I'd like to see some text set in this font. </p>
      <p>Regards,<br>
      ®ené</p>
      <p>*** <a href="https://web.archive.org/web/20150123112328/http://www.characters.nl/" title="www.characters.nl">www.characters.nl</a>  { Typography to express yourself } ***</p>
