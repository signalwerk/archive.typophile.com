    html: |-
      <p>Tina,<br>
      The "e" problem mentioned by William may be a "total width" problem as opposed to a stroke weight problem.  Without measuring, widen the e, keeping the stroke weight the same, until it feels equal to the o.  You will probably have to test text sizes to really know if it works.  Letters with several strokes can start to feel heavy--the 2 story g is typical but even e and a have need for optical correction. The diagonal crossbar on your e causes dark spots at joins but that doesn't mean don't do it, it just means you have to find other ways to counter the effect. You will probably learn more about designing glyphs as a set by doing it your way than doing it an easier way so keep it up!</p>
      <p>ChrisL</p>
    html_clean: |-
