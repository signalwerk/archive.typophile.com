      <p>This seems like a typeface that Doyald Young would love, largely because it feels like it descends from an inscriptional model (i.e. the caps feel a lot like Optima to me). It's very clear and fresh feeling, although there's a tiny whiff of late-70s high-class apartment lobby to it (don't ask me where I come up with these associations, I just do).</p>
      <p>More specifically, the bar on the R feels weak, I like the X although I fear it's a little out of character for the rest of the font, and the slanted bar in the e is cute, although it inevitably calls Kabel to mind. I want to see b, d, p and q larger, because right now I'm not sure I'm that enthusiastic about the d and the p's counters.</p>
