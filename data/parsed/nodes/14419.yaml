      <p>&gt;a tiny whiff of late-70s high-class apartment lobby </p>
      <p>I think that in developing this font you have the challenge of creating self-made 'rules' consistently carried out (such as problem of the light weight of the bottom of the R bowl), but without making it staid or stale--you don't want that 'tiny wiff' to become more than that.<br>
      Balanced and consistent, but still fresh--not easy to pull off, but great if you can.</p>
