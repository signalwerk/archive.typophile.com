    html: |-
      <p>Tina,</p>
      <p>What you have taken on is quite difficult for a first font. It looks great, so keep going! There are several influences that might be hard to reconcile: The 2 looks like a good old grotesque, the e says "70's" to me, and the vertical stroke axis is reminding me faintly of Peignot. Otherwise it looks like a very strong, classic humanist sans with a little geometric stiffness thrown in. Nice!</p>
      <p>I hope you have been looking at other modulated sans designs all the while. Though the style is very different (and should stay that way), look at Legacy Sans for ideas about distributing weight and how far to go with modulation. Stellar is another design you could study; it's quite subtle and interesting (metal versions preferably). Also Charlotte Sans, which is subtly modulated if a bit stiff. </p>
      <p>I'm intrigued you are exploring this area; If we are going to have another century of Sans Serif type, it ought to evolve, and modulating the stem weights opens a lot of possibilities for typefaces which have been seen as limited in usefulness.</p>
