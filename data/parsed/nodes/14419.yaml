    html: |-
      <p>here's some advice to take with a grain of salt:</p>
      <p>overall the contrast patter seems rather spotty: too spinly in some places, too beefy in others. i'll try to point out some trouble spots i felt were distracting.<br>
      Too heavy: upper arm of K, upper join of R's bowl to the stem, as are the points (both) where the bowl of the P joins the stem.<br>
      Too light: the diagonal stroke of the N, also the second stroke of the M (middle left).<br>
      The S needs more contrast between thicks and thins.<br>
      The e with a diagonal bar feels out of place. maybe it just needs to be more subtle.</p>
