    html: |-
      <p>Tina,</p>
      <p>I don't have much to add to what's already been said. There are definite problem areas which have mostly been mentioned, like the too-thin part of the R. </p>
      <p>It does appear that you have a good grasp of the basic tricks of construction (e.g., correcting for optical effects, visual vs. geometric center, etc.). </p>
      <p>I would agree with Carl about the numbers. They are very nice, but don't seem to fit the rest of the design. </p>
      <p>I think I would rather see a horizontal bar on the e. The Jenson e does not really seem to fit this design. If want to keep it, you could try to work more angular stress into the overall design. Then it might work better.</p>
      <p>I would be tempted to put a crossbar on the G. In a face like Optima, you can get away with that form because all the other curved forms are very open. Here, your curved forms are more closed, so it leave a sort of trapped empty space in the G. A crossbar might mitigate this. It's worth a try, anyway.</p>
