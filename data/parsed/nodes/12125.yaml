reelink-freelinking_prepopulate notfound freelink-internal link-lost">Czechoslovakia</a>, while still being very much his own&nbsp;work.</p>
    <p>Late in life, he followed developments in the <a href="/node/13713/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Bauhaus</a> scene, developing his own groundbreaking <a href="/node/13674/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Kabel</a> typeface alongside <a href="/node/13376/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Jakob Erbar</a>’s <a href="/node/13675/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erbar</a> and <a href="/node/12191/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Paul Renner</a>’s <a href="/node/12494/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Futura</a>, as well as designing the lesser-known but equally significant <a href="/node/add/wiki?edit%5Btitle%5D=calligraphic%20sans" title="Create node &quot;calligraphic sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">calligraphic sans</a> <a href="/node/add/wiki?edit%5Btitle%5D=Stahl" title="Create node &quot;Stahl&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Stahl</a>, which was finished after his death by <a href="/node/add/wiki?edit%5Btitle%5D=Hans%20K%C3%BChne" title="Create node &quot;Hans Kühne&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Hans Kühne</a>.</p>
    <p>Koch was also a prolific teacher. In 1908, he began teaching calligraphy at the <em>Technische Lehranstalten der Stadt Offenbach a.M</em>, which became the <a href="/node/12107/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">HfG Offenbach</a> in 1970 . His courses developed into a type of special studio, called the Offenbach Workshop. In addition to calligraphy, students at the workshop produced everything that could conceivably have lettering on it, including tapestries, metal work, and church bells. Like the <a href="/node/13713/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Bauhaus</a>, the workshop developed an international reputation during the 1920s, attracting students from foreign countries. <a href="/node/add/wiki?edit%5Btitle%5D=Warren%20Chappel" title="Create node &quot;Warren Chappel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Warren Chappel</a> studied under Koch during the 1930s&nbsp;there.</p>
    <p>A word should be said to Koch’s nationalism (one should remember that nationalist feelings were common throughout the western world in the pre-<span class="caps">WWII</span>-era). Koch fought as an infantryman on both the western and the eastern fronts during the first World War. Reading his recollections, one might get the feeling that he loved every minute of it. It was also during these war years that Koch became increasingly devout. Rudolf Koch died in 1934. This for him was fortunate. Many of his students emphatically embraced Nazism, lending their calligraphic skills to the&nbsp;movement.</p>
    <p>It is possible that Koch would have avoided this. He had strong ties to the Jewish community in Offenbach, and on at least one occasion (in 1927), produced a complete Haggadah (<a href="/node/12173/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Offenbacher Haggadah</a>). The book is part of the <a href="/node/13012/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Klingspor Museum</a>’s collection&nbsp;today.</p>
