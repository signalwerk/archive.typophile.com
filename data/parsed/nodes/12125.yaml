    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoWiki</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Rudolf&nbsp;Koch</strong></p>
    <p>German type designer, calligrapher, and artist,&nbsp;1876-1934.</p>
    <p>Designed both <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> and <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> alphabets. Strongly <a href="/node/12429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Christian</a> (and Lutheran Protestant) as well as an exponent of  <a href="/node/12205" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">German nationalism</a> in the arts, Koch had an affinity for the <a href="/node/add/wiki?edit%5Btitle%5D=Arts%20%26amp%3B%20Crafts" title="Create node &quot;Arts &amp;amp; Crafts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Arts <span class="amp">&amp;</span> Crafts</a> movement spearheaded by <a href="/node/12139" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">William Morris</a>. Some of his art, as well as his typefaces, have a strongly <a href="/node/add/wiki?edit%5Btitle%5D=Art%20Nouveau" title="Create node &quot;Art Nouveau&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Art Nouveau</a> flavor. Koch’s great passion was infusing the stately opulence of <a href="/node/add/wiki?edit%5Btitle%5D=Baroque" title="Create node &quot;Baroque&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Baroque</a> forms with the raw energy of the <a href="/node/add/wiki?edit%5Btitle%5D=Romantic" title="Create node &quot;Romantic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Romantic</a>, and his most well-known typefaces, The <a href="/node/12169" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Deutsche Schrift</a> family (also kown as <a href="/node/add/wiki?edit%5Btitle%5D=Koch%20Schrift" title="Create node &quot;Koch Schrift&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Koch Schrift</a>), <a href="/node/add/wiki?edit%5Btitle%5D=Maximillian" title="Create node &quot;Maximillian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Maximillian</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Wilhelm%20Klingspor%20Schrift" title="Create node &quot;Wilhelm Klingspor Schrift&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wilhelm Klingspor Schrift</a>, <a href="/node/40011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">neuland</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Jessen" title="Create node &quot;Jessen&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jessen</a>, <a href="/node/13150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Wallau</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Koch%20Antiqua" title="Create node &quot;Koch Antiqua&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Koch Antiqua</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Fr%C3%BChling" title="Create node &quot;Frühling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frühling</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Holla" title="Create node &quot;Holla&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Holla</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Zepelin" title="Create node &quot;Zepelin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zepelin</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Prisma" title="Create node &quot;Prisma&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Prisma</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Offenbach" title="Create node &quot;Offenbach&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Offenbach</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Marathon" title="Create node &quot;Marathon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Marathon</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Koch%20Kursiv" title="Create node &quot;Koch Kursiv&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Koch Kursiv</a> and <a href="/node/13674" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Kabel</a> all have this balance between elegance and raw&nbsp;energy.</p>
    <p>Koch was an in-house designer at the Gebr. <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> foundry from 1906 until his death in 1934 (with a short gap for service in the first World War). All of his typefaces were released by Klingspor. After the Klingspor foundry closed in the late 1950s, the foundry <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> in Frankfurt, who had owned the Klingspor foundry for over a decade, assumed the rights to the designs and continued the distribution of the commercial successful&nbsp;ones. </p>
    <p>Koch was also concerned that with the development of industrial typography in the form of <a href="/node/add/wiki?edit%5Btitle%5D=hot%20metal%20typesetting" title="Create node &quot;hot metal typesetting&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">hot metal typesetting</a> much of typefounding’s history might be lost. He was a gifted historian, and many of the most well-known illustrations of traditional <a href="/node/add/wiki?edit%5Btitle%5D=punchcutting" title="Create node &quot;punchcutting&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">punchcutting</a> were drawn by him. He also produced a large volume of elaborately detailed, traditional German <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Calligraphy</a>, some of it exceedingly beautiful. His book on calligraphic instruction <em><a href="/node/12438" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Das Schreiben als Kunstfertigkeit</a></em> is still one of the best works on the subject ever printed in the German language, and is worth a look for non-German readers as well, even though it is almost entirely focused on <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> hands. The book was one of the catalysts that began the career of <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a>, as well as that of  his wife, <a href="/node/add/wiki?edit%5Btitle%5D=Gudrun%20Zapf-von%20Hesse" title="Create node &quot;Gudrun Zapf-von Hesse&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gudrun Zapf-von Hesse</a>.</p>
    <p>It would be a mistake, however, to peg Koch as a strict traditionalist. He was a relentless experimenter, seeking in particular to reconcile the traditionally popular German <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> / broken-letter types with the <a href="/node/13832" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Antiqua</a> or <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> types used in the Western parts of Europe and the United Kingdom. Some of these experiments were unsuccessful, like the intriguing but ungainly <a href="/node/add/wiki?edit%5Btitle%5D=Offenbach" title="Create node &quot;Offenbach&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Offenbach</a>, but others, such as <a href="/node/13150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Wallau</a>, were both in keeping with the spirit of the times and successful in their own right. Probably his most significant achievement during this time, and the most widely-known of his experiments, is the rough-hewn <a href="/node/40011" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">neuland</a>, a deceptively sophisticated, very black lino-cut <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sans serif</a> that pointed to some of the more expressionistic types coming from further east, such as <a href="/node/12202" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Vojtech Preissig</a> in <a href="/node/add/wiki?edit%5Btitle%5D=Czechoslovakia" title="Create node &quot;Czechoslovakia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Czechoslovakia</a>, while still being very much his own&nbsp;work.</p>
    <p>Late in life, he followed developments in the <a href="/node/13713" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bauhaus</a> scene, developing his own groundbreaking <a href="/node/13674" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Kabel</a> typeface alongside <a href="/node/13376" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jakob Erbar</a>’s <a href="/node/13675" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erbar</a> and <a href="/node/12191" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Paul Renner</a>’s <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a>, as well as designing the lesser-known but equally significant <a href="/node/add/wiki?edit%5Btitle%5D=calligraphic%20sans" title="Create node &quot;calligraphic sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">calligraphic sans</a> <a href="/node/add/wiki?edit%5Btitle%5D=Stahl" title="Create node &quot;Stahl&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stahl</a>, which was finished after his death by <a href="/node/add/wiki?edit%5Btitle%5D=Hans%20K%C3%BChne" title="Create node &quot;Hans Kühne&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hans Kühne</a>.</p>
    <p>Koch was also a prolific teacher. In 1908, he began teaching calligraphy at the <em>Technische Lehranstalten der Stadt Offenbach a.M</em>, which became the <a href="/node/12107" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">HfG Offenbach</a> in 1970 . His courses developed into a type of special studio, called the Offenbach Workshop. In addition to calligraphy, students at the workshop produced everything that could conceivably have lettering on it, including tapestries, metal work, and church bells. Like the <a href="/node/13713" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bauhaus</a>, the workshop developed an international reputation during the 1920s, attracting students from foreign countries. <a href="/node/add/wiki?edit%5Btitle%5D=Warren%20Chappel" title="Create node &quot;Warren Chappel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Warren Chappel</a> studied under Koch during the 1930s&nbsp;there.</p>
    <p>A word should be said to Koch’s nationalism (one should remember that nationalist feelings were common throughout the western world in the pre-<span class="caps">WWII</span>-era). Koch fought as an infantryman on both the western and the eastern fronts during the first World War. Reading his recollections, one might get the feeling that he loved every minute of it. It was also during these war years that Koch became increasingly devout. Rudolf Koch died in 1934. This for him was fortunate. Many of his students emphatically embraced Nazism, lending their calligraphic skills to the&nbsp;movement.</p>
    <p>It is possible that Koch would have avoided this. He had strong ties to the Jewish community in Offenbach, and on at least one occasion (in 1927), produced a complete Haggadah (<a href="/node/12173" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Offenbacher Haggadah</a>). The book is part of the <a href="/node/13012" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor Museum</a>’s collection&nbsp;today.</p>
