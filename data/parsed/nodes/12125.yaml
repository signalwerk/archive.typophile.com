    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Rudolf Koch</strong></p>
    <p>German type designer, calligrapher, and artist, 1876-1934.</p>
    <p>Designed both <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> and <a href="/wiki/roman" class="freelinking" rel="nofollow">roman</a> alphabets. Strongly <a href="/wiki/Christian" class="freelinking" rel="nofollow">Christian</a> (and Lutheran Protestant) as well as an exponent of  <a href="/wiki/German%20nationalism" class="freelinking" rel="nofollow">German nationalism</a> in the arts, Koch had an affinity for the <a href="/wiki/Arts%20%2526amp%3B%20Crafts" class="freelinking" rel="nofollow">Arts &amp; Crafts</a> movement spearheaded by <a href="/wiki/William%20Morris" class="freelinking" rel="nofollow">William Morris</a>. Some of his art, as well as his typefaces, have a strongly <a href="/wiki/Art%20Nouveau" class="freelinking" rel="nofollow">Art Nouveau</a> flavor. Koch's great passion was infusing the stately opulence of <a href="/wiki/Baroque" class="freelinking" rel="nofollow">Baroque</a> forms with the raw energy of the <a href="/wiki/Romantic" class="freelinking" rel="nofollow">Romantic</a>, and his most well-known typefaces, The <a href="/wiki/Deutsche%20Schrift" class="freelinking" rel="nofollow">Deutsche Schrift</a> family (also kown as <a href="/wiki/Koch%20Schrift" class="freelinking" rel="nofollow">Koch Schrift</a>), <a href="/wiki/Maximillian" class="freelinking" rel="nofollow">Maximillian</a>, <a href="/wiki/Wilhelm%20Klingspor%20Schrift" class="freelinking" rel="nofollow">Wilhelm Klingspor Schrift</a>, <a href="/wiki/Neuland" class="freelinking" rel="nofollow">Neuland</a>, <a href="/wiki/Jessen" class="freelinking" rel="nofollow">Jessen</a>, <a href="/wiki/Wallau" class="freelinking" rel="nofollow">Wallau</a>, <a href="/wiki/Koch%20Antiqua" class="freelinking" rel="nofollow">Koch Antiqua</a>, <a href="/wiki/Fr%C3%BChling" class="freelinking" rel="nofollow">Frühling</a>, <a href="/wiki/Holla" class="freelinking" rel="nofollow">Holla</a>, <a href="/wiki/Zepelin" class="freelinking" rel="nofollow">Zepelin</a>, <a href="/wiki/Prisma" class="freelinking" rel="nofollow">Prisma</a>, <a href="/wiki/Offenbach" class="freelinking" rel="nofollow">Offenbach</a>, <a href="/wiki/Marathon" class="freelinking" rel="nofollow">Marathon</a>, <a href="/wiki/Koch%20Kursiv" class="freelinking" rel="nofollow">Koch Kursiv</a> and <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a> all have this balance between elegance and raw energy.</p>
    <p>Koch was an in-house designer at the Gebr. <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry from 1906 until his death in 1934 (with a short gap for service in the first World War). All of his typefaces were released by Klingspor. After the Klingspor foundry closed in the late 1950s, the foundry <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> in Frankfurt, who had owned the Klingspor foundry for over a decade, assumed the rights to the designs and continued the distribution of the commercial successful ones. </p>
    <p>Koch was also concerned that with the development of industrial typography in the form of <a href="/wiki/hot%20metal%20typesetting" class="freelinking" rel="nofollow">hot metal typesetting</a> much of typefounding's history might be lost. He was a gifted historian, and many of the most well-known illustrations of traditional <a href="/wiki/punchcutting" class="freelinking" rel="nofollow">punchcutting</a> were drawn by him. He also produced a large volume of elaborately detailed, traditional German <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a>, some of it exceedingly beautiful. His book on calligraphic instruction <em><a href="/wiki/Das%20Schreiben%20als%20Kunstfertigkeit" class="freelinking" rel="nofollow">Das Schreiben als Kunstfertigkeit</a></em> is still one of the best works on the subject ever printed in the German language, and is worth a look for non-German readers as well, even though it is almost entirely focused on <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> hands. The book was one of the catalysts that began the career of <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>, as well as that of  his wife, <a href="/wiki/Gudrun%20Zapf-von%20Hesse" class="freelinking" rel="nofollow">Gudrun Zapf-von Hesse</a>.</p>
    <p>It would be a mistake, however, to peg Koch as a strict traditionalist. He was a relentless experimenter, seeking in particular to reconcile the traditionally popular German <a href="/wiki/fraktur" class="freelinking" rel="nofollow">fraktur</a> / broken-letter types with the <a href="/wiki/antiqua" class="freelinking" rel="nofollow">antiqua</a> or <a href="/wiki/roman" class="freelinking" rel="nofollow">roman</a> types used in the Western parts of Europe and the United Kingdom. Some of these experiments were unsuccessful, like the intriguing but ungainly <a href="/wiki/Offenbach" class="freelinking" rel="nofollow">Offenbach</a>, but others, such as <a href="/wiki/Wallau" class="freelinking" rel="nofollow">Wallau</a>, were both in keeping with the spirit of the times and successful in their own right. Probably his most significant achievement during this time, and the most widely-known of his experiments, is the rough-hewn <a href="/wiki/Neuland" class="freelinking" rel="nofollow">Neuland</a>, a deceptively sophisticated, very black lino-cut <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> that pointed to some of the more expressionistic types coming from further east, such as <a href="/wiki/Vojtech%20Preissig" class="freelinking" rel="nofollow">Vojtech Preissig</a> in <a href="/wiki/Czechoslovakia" class="freelinking" rel="nofollow">Czechoslovakia</a>, while still being very much his own work.</p>
    <p>Late in life, he followed developments in the <a href="/wiki/Bauhaus" class="freelinking" rel="nofollow">Bauhaus</a> scene, developing his own groundbreaking <a href="/wiki/Kabel" class="freelinking" rel="nofollow">Kabel</a> typeface alongside <a href="/wiki/Jakob%20Erbar" class="freelinking" rel="nofollow">Jakob Erbar</a>'s <a href="/wiki/Erbar" class="freelinking" rel="nofollow">Erbar</a> and <a href="/wiki/Paul%20Renner" class="freelinking" rel="nofollow">Paul Renner</a>'s <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>, as well as designing the lesser-known but equally significant <a href="/wiki/calligraphic%20sans" class="freelinking" rel="nofollow">calligraphic sans</a> <a href="/wiki/Stahl" class="freelinking" rel="nofollow">Stahl</a>, which was finished after his death by <a href="/wiki/Hans%20K%C3%BChne" class="freelinking" rel="nofollow">Hans Kühne</a>.</p>
    <p>Koch was also a prolific teacher. In 1908, he began teaching calligraphy at the <em>Technische Lehranstalten der Stadt Offenbach a.M</em>, which became the <a href="/wiki/HfG%20Offenbach" class="freelinking" rel="nofollow">HfG Offenbach</a> in 1970 . His courses developed into a type of special studio, called the Offenbach Workshop. In addition to calligraphy, students at the workshop produced everything that could conceivably have lettering on it, including tapestries, metal work, and church bells. Like the <a href="/wiki/Bauhaus" class="freelinking" rel="nofollow">Bauhaus</a>, the workshop developed an international reputation during the 1920s, attracting students from foreign countries. <a href="/wiki/Warren%20Chappel" class="freelinking" rel="nofollow">Warren Chappel</a> studied under Koch during the 1930s there.</p>
    <p>A word should be said to Koch's nationalism (one should remember that nationalist feelings were common throughout the western world in the pre-WWII-era). Koch fought as an infantryman on both the western and the eastern fronts during the first World War. Reading his recollections, one might get the feeling that he loved every minute of it. It was also during these war years that Koch became increasingly devout. Rudolf Koch died in 1934. This for him was fortunate. Many of his students emphatically embraced Nazism, lending their calligraphic skills to the movement.</p>
    <p>It is possible that Koch would have avoided this. He had strong ties to the Jewish community in Offenbach, and on at least one occasion (in 1927), produced a complete Haggadah (<a href="/wiki/Offenbacher%20Haggadah" class="freelinking" rel="nofollow">Offenbacher Haggadah</a>). The book is part of the <a href="/wiki/Klingspor%20Museum" class="freelinking" rel="nofollow">Klingspor Museum</a>'s collection today.</p>
