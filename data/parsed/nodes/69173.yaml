      <p>If you count the transitions (green to white to green to white...) left to right, or top to bottom, you'll find you have just barely enough pixels at 16 to represent this image. I'd start with a 16X16 photoshop file and do your best. It's not that many pixels.</p>
      <p>Cheers!</p>
