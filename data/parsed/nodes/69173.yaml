    <p>Hi everyone,</p>
    <p>We have a little problem here: How do I convert a picture (EPS, TIFF, etc.) to 16 x 16 pixels for use on the web? For the best result?<br>
    Thanks in advance for your kind assistance!</p>
    <p>Best,<br>
    Morten</p>
