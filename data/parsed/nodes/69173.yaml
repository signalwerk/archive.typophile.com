    html: <p>Yours looks good, Wormwood, although I actually prefer mine. Yours is a bit smoother, and if I had spent more time doing mine, it would probably have been a little more like yours in some parts. For example, I think you did the back of the cyclist better. On the other hand, I prefer my rougher style when it comes to the head, which I think should be separated from the body, and the wheels, which I deliberately made bigger, to make it look more like a bike, and less like a kick scooter.</p>
