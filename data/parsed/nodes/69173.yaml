    html: |-
      <p><em> ... 16 x 16 pixels for use on the web ..</em></p>
      <p>You are looking for the term "favicon".</p>
      <p>Try downscaling the image to about 64 x 64. Clean up as much antialiasing as you can -- it's of no use for anything this small. You can even try downscaling without resampling, and check if there is enough recognizable detail left to work with.<br>
      From that version, scale down to 16 x 16 and clean it up one pixel at a time.</p>
      <p>I drew my own favicon literally one pixel at a time, from scratch:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/favicon_6255.png"></div><p></p>
      <p>-- worth the effort, as it preserved the black-white pixelated view I was after.</p>
