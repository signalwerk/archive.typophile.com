  - id: 509656
    user: 1043
    date: 2012-05-14T06:27:00
    date_raw: 14 May 2012 — 6:27am
    votes: null
    html: <p>It's Arial Bold, but the letters have been doubled up and offset to make it bolder, the trick that is used in some cases when there is no bold font. In this case it may be that the "bold" style was applied to Arial Bold, in effect double-bolded.</p>
