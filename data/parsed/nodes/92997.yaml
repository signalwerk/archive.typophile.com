    html: |-
      <p>Thanks for the help -- I think you're right about it being Arial, but this still looks strange to me. Until recently the apostrophe would not have been tapered, it would be a rectangle, and the letters would not be rounded at all. I say it's "my system" because it's appearing like this in all applications, not just web pages. Anyone know what could be causing this?</p>
      <p>EDIT*** -- Fixed! For some reason, the italic, bold, and bold italic styles of Arial were disabled in my Font Book. I reenabled them and all is back to normal. Thanks guys! That was killing me =P</p>
    html_clean: |-
