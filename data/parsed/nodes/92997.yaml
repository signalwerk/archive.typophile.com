    <p>My system (mac os x, latest) is displaying bold/strong/big fonts everywhere in a strange way recently. It looks like this: </p>
    <p><a class="freelinking external" href="http://cl.ly/GbCj" rel="nofollow">example one</a></p>
    <p>I'm trying to ID the "new" font. Any help? It should be Arial Bold, but it's not -- note the tapered apostrophe, which should be a straight rectangle. Here's another example:</p>
    <p><a class="freelinking external" href="http://cl.ly/GbVk" rel="nofollow">example two</a></p>
    <p>Again, the letters look slightly rounded when in the past they have been blocky, like Arial. </p>
    <p>Edit: Moved</p>
