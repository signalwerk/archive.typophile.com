    <p>Grueber, a new release by Dalton Maag, is a two weight slab serif for display usage. The typeface is based on designs by Austrian architect Paul Grueber in the early 1900s for castle Hoch Osterwitz.</p>
    <p>Dalton Maag also releases true Italic forms for our popular typeface Effra. The addition of Italics makes Effra a versatile choice for any design project.</p>
    <p><a href="https://web.archive.org/web/20150123035106/http://www.daltonmaag.com/" title="www.daltonmaag.com">www.daltonmaag.com</a></p>
