    html: |-
      <p>Franz, you refer to Effra, I presume. Do you think this is anything like Frutiger? Well, I have no problems to agree that Frutiger is a good typeface, but Effra is about as close to it as I am as close to become the next UK prime minister.</p>
      <p>Nick, no Grueber has no l/c alternates - yet at least. In fact, on the original carvings at the castle, what are now alternates were the actual letters. Together with Lukas we decided that we need more traditional designs in the base keyboard positions to cater for the more conservative tastes. As the l/c had no template to work from we decided for the time being not to include alternate designs.</p>
    html_clean: |-
