  html: <p>General by Kevin Dresser was released today. Kevin Dresser worked for a number of years at The Hoefler Type Foundry, before striking out on his own with <a href="http://www.dresserjohnson.com">Dresser Johnson</a> and pursuing <a href="http://www.kdee.net">painting</a> endeavours. <br> <br><img src="http://www.typophile.com/forums/messages/72/12463.gif" alt="kd"> <br> <br>This fifteen-font family could best be described in the Helvetica / Akzidenz / Trade Gothic vein, with its own subtleties to make it unique.  <br> <br>Watch for an exclusive behind-the-design with Kevin Dresser in the coming weeks as we talk to him about his design process, sketches and the inspiration that led to General's creation. <br> <br><a href="http://www.dresserjohnson.com/retailfonts.html">Buy it</a> <br></p>
  html_clean: <p>General by Kevin Dresser was released today. Kevin Dresser worked for a number of years at The Hoefler Type Foundry, before striking out on his own with <a href="http://www.dresserjohnson.com" class="link-external">Dresser Johnson</a> and pursuing <a href="http://www.kdee.net" class="link-external">painting</a> endeavours. <br> <br><img src="http://www.typophile.com/forums/messages/72/12463.gif" alt="kd"> <br> <br>This fifteen-font family could best be described in the Helvetica / Akzidenz / Trade Gothic vein, with its own subtleties to make it unique.  <br> <br>Watch for an exclusive behind-the-design with Kevin Dresser in the coming weeks as we talk to him about his design process, sketches and the inspiration that led to General's creation. <br> <br><a href="http://www.dresserjohnson.com/retailfonts.html" class="link-external">Buy it</a> <br></p>
