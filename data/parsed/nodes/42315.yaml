  html: |-
    <p>I've been hopelessly attached to Terminal Design's Alfon as a body font for many of my book, magazine and newsletter projects for the past couple years.  I tend to get hooked on a font &amp; use it to excess, before moving on.  I still love Alfon, but am looking for something new for a new book project.  Would like something with a similar feel, readability, and versatility. </p>
    <p>My only gripe with Alfon is that the Regular weight seems just a hair too light, and the medium is much too bold to use as an alternate.</p>
    <p> I looked at TD's Enclave font, but it seems like it might be too condensed.</p>
    <p>Can anyone offer some suggestions to check out?  </p>
    <p>Thanks</p>
