    html: |-
      <p>Well  on Alfon, something just a hair heavier than the regular would be nice. Some of my clients think it tends to print a little light.</p>
      <p>But right now I'm also just looking for another font that I like as much as your Alfon for a book job I'm about to start. I've used Alfon so much over the last two years, I just want to try something else. </p>
      <p>I have always been pretty good at choosing and working with display fonts, but I always thought I was weak on choosing body fonts.  Tended to use all the basics, or whatever I had on hand.  I designed a magazine using Alfon a couple years ago, and felt I hit it right on. So I've used it for just about everything else since.</p>
      <p>Body fonts to me are like wine.  I know what i like when I see (or taste) it, but I am overwhelmed by the details and choices available, and am usually too busy with my million projects, to actually focus on the details of choosing new typefaces.</p>
      <p>So just looking for new recommendations.  I think it was someone on here who first recommended Alfon.</p>
