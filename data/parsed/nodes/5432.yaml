    html: <p>Somboedy e-mailed me a few years back and asked for an authentic tattoo font. This was an amalgum of my research. I also was aware of Christian's font so I decided if I was gonna do one that I had to do a convincing job of one that was original enough to bring to the masses. <br> <br>It was doubly verified for 'street cred' with tattoo barren fellow type designer Brian Bonislawsky of Asigmatic. <br> <br>Stuart :D</p>
