    html: <p>&gt;You think you could e-mail me a copy of it once you buy it? Ha, sorry. Just kidding, just kidding. <br> <br>HA  HA. :D I thought it was funny. <br> <br>Stuart, your face is looking really nice. It definately has a much more refined feel to it than Sailor Gothic, much more of a typophiles version of Tattoo type . Nicks comment to Benton or Cooper are interesting, because I think your version does have a bit of their spirit to it. It does a nice job of elevating the vernacular to a different place than where it started. Mine tends to keep a lot of the quirks of the "unedumicated" letterer. <br> <br>&gt;Was the 1930s the classic era for tattoo art? <br> <br>Sort of. The motifs started in the late 19th Century but really came into their own by WWI &amp; II. The American Tradition was established between 1920 and 1960, with some designs by guys like Gus Wagner dating as far back as 1900. Most of the design motifs we see today are revivals of the highpoint in American designs from the 50's and 60's, artists like Sailor Jerry, Don Hardy, Bert Grimm to name a few who helped define the aesthetic. By this point the motifs had been established for years and the craft was stressed more.  <br> <br>&gt; There is an old wood type called "Circus" that has the "half &amp; half" motif. Did tatoo artists travel with the show? <br> <br>Again, sort of, think ports and sailors, in New York it was Coney Island,Times Sq and the Bowery. In LA it was the Pike, in Honolulu it was Hotel Street. Carneys, Tattoos and Sailors always seemed to go together. <br> <br>Cheers, <br>Christian</p>
    html_clean: <p>&gt;You think you could e-mail me a copy of it once you buy it? Ha, sorry. Just kidding, just kidding. <br> <br>HA  HA. :D I thought it was funny. <br> <br>Stuart, your face is looking really nice. It definately has a much more refined feel to it than Sailor Gothic, much more of a typophiles version of Tattoo type . Nicks comment to Benton or Cooper are interesting, because I think your version does have a bit of their spirit to it. It does a nice job of elevating the vernacular to a different place than where it started. Mine tends to keep a lot of the quirks of the "unedumicated" letterer. <br> <br>&gt;Was the 1930s the classic era for tattoo art? <br> <br>Sort of. The motifs started in the late 19th Century but really came into their own by WWI &amp; II. The American Tradition was established between 1920 and 1960, with some designs by guys like Gus Wagner dating as far back as 1900. Most of the design motifs we see today are revivals of the highpoint in American designs from the 50's and 60's, artists like Sailor Jerry, Don Hardy, Bert Grimm to name a few who helped define the aesthetic. By this point the motifs had been established for years and the craft was stressed more.  <br> <br>&gt; There is an old wood type called "Circus" that has the "half &amp; half" motif. Did tatoo artists travel with the show? <br> <br>Again, sort of, think ports and sailors, in New York it was Coney Island,Times Sq and the Bowery. In LA it was the Pike, in Honolulu it was Hotel Street. Carneys, Tattoos and Sailors always seemed to go together. <br> <br>Cheers, <br>Christian</p>
