    html: "<p>I'm a maniac for written tattoos. I got one that goes from my shoulder to my hip and it's in Greek using specific characters. It was hard to get it. At first I got the wrong text and had to get an appointment at the <a rel=\"follow\" href=\"http://www.newlookhouston.com/\">Houston tattoo removal </a> clinic to get it out. I didn't quit, found the right text, the right font and got me my tattoo. It says: Lasciate ogni speranza voi ch'entrate! And it's the curse from Dante's book, the one placed above the gate of hell.</p>"
