    html: <p>Looks like a cousin to the Art Deco lettering style that Benton turned into "Broadway". Or Cooper's modernistic "Boul Mich". Was the 1930s the classic era for tattoo art? <br> <br>The decorated version has a real circus/fairground feel. But as a device, it seems much older, 19th century -- I suspect circus/fair tradition preserved that look. There is an old wood type called "Circus" that has the "half &amp; half" motif. Did tatoo artists travel with the show?</p>
