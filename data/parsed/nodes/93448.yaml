  html: |-
    <p>Hello typophiles,</p>
    <p>After having sat lazily on an interest in Type Design for far too long, I've finally found the courage (through the help of a course at University) to delve into the wonderful world of fontlab.</p>
    <p>I was hoping for some critique of what I've got so far, I have been working with a strict grid system which has worked well most of the time although I'm still having a lot of trouble with the s, z, x and c. Getting the spacing right has also been quite hard, (especially with the extremities on the r and e) and has led me to create a series of Ligatures which I believe solves the problem and adds more visual interest. I set these up as dlig in fontlab because I read somewhere that it was appropriate however, I'm tempted to just put them through as liga. Advisable?</p>
    <p> I am fully aware that this font completely loses itself in small sizes, however I believe that in larger sizes when I've tweaked it properly, it could work really well.</p>
    <p>What do you think?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fabrik_RLM_4381.jpg"></div><p></p>
