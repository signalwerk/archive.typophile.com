    date_raw: 13.Oct.2009 4.45pm
    votes: null
    html: <p>Unfortunately you can't have it both ways - if you want to give the creatives freedom to choose any font from any vendor you will end up with them picking expensive fonts, and those with licenses that are difficult to manage (such as extra fees for use in logos and publicly posted PDFs, or prohibit commercial use as some dafont fonts do). As these font vendors are unlikely to reduce their prices or change their licenses, you have to live with it. I don’t see any alternative other than limiting the creatives choice to cheaper fonts and more liberal licenses. Or am I missing something?</p>
