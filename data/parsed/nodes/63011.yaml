    html: <p>Mark, I'd be inclined to build relationship with two or three local type designers/vendors, who license fonts under workable terms, and direct your users to fonts from this set of vendors. After a few big deals (ie. your clients obtaining site licenses via your firm) I'm sure the font vendors would be more than happy to provide you with fonts under an evaluation license.</p>
