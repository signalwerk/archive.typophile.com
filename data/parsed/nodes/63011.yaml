  html: |-
    <p>So I read on the tech' blogs NBC is being sued for $2million for pirating a few fonts. The blogs are repeating the same copied lines (another copyright issue surely?) and the comments are "Fonts are too expensive and EULAs unworkable anyway". </p>
    <p>How does FB know NBC pirated their fonts and not have one person doing all the work and supplying JPGs? NBC must have a leak who grassed them up.</p>
    <p>I agree with Font Bureau and would really like to see this come to an end. I managed licenses for 60 users and have invested about €30k in various font licenses, each with their own restrictive EULA, it's a nightmare trying to maintain control and more and more users are saying "I just want to try it" and "how can I convince client to buy it if I can't test it". </p>
    <p>From my perspective we're now in a world where we expect client to pay to use their choice of font, rather than the company paying for fonts as well as Photoshop and Word. </p>
    <p>Anyone else manage large groups of licenses?</p>
