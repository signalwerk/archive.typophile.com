    html: |-
      <p>Dr Jack, I agree completely, but I suffer a constant battle against project managers, cratives and account people (advertising types) and need more ways to explain to users who don't care to read EULAs.</p>
      <p>Sli, we have relationships with some great designers in Russia who have produced some beautiful work for us (paratype.com) but I work with about 30 creatives from all over the world, some who chose House, others prefer Dutch Type Library, some go for TradeGothic EVERY SINGLE JOB and a couple of designers who think dafont.com is a great place to chose fonts for producing global TV and print advertising! Just managing licenses has become a major part of my daily workload, even with Universal Type Server, which as I understand is one of the few system that track font licensing. </p>
      <p>I love the idea of Linotype Font Explorer with a yearly fee for access to all fonts, but I've already got thousands invested in Adobe Font Folio and can't just drop that. </p>
      <p>I'm just hoping none of my creatives see Antenna on Fontbureau.com, $1400 per license! </p>
      <p>Cheers</p>
      <p>Mark</p>
