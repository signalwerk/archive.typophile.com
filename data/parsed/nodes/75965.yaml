    <p>Can anyone help me find a typeface that would suitably replace the one used in this beuatiful 17th Century engraving of a stellar atlas by the astronomer Johannes Hevelius:</p>
    <p><a href="http://upload.wikimedia.org/wikipedia/commons/f/f1/Scutum_Hevelius.jpg" title="http://upload.wikimedia.org/wikipedia/commons/f/f1/Scutum_Hevelius.jpg">http://upload.wikimedia.org/wikipedia/commons/f/f1/Scutum_Hevelius.jpg</a></p>
    <p>more from the collection here:</p>
    <p><a href="http://commons.wikimedia.org/wiki/Category:Uranographia_by_Johannes_Hevelius" title="http://commons.wikimedia.org/wiki/Category:Uranographia_by_Johannes_Hevelius">http://commons.wikimedia.org/wiki/Category:Uranographia_by_Johannes_Heve...</a></p>
    <p>Any help will be appreciated</p>
