      <p>The font format I usually use is Postscript Type1. I have used kerning by classes in Fontforge, which greatly reduces the work involved in handling many glyph variants. However, a quick trial generated about 4500 kern pairs, which I thought looked excessive.</p>
      <p>Does OpenType have class-kerning built in to the format?</p>
      <p>By the way, there is a thread in Build which already covers this topic. I missed it before I posted here.</p>
