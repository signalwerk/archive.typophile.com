      <p>Well Brad, I'm gald you think it is attractive. When Clearview was discussed on Typographica a while back a lot of folks thought it not.</p>
      <p>AS to the too light warning signs, Black letters on light backgrounds (Negative Contrast) are a problem. We have designed a series of ClearviewHwy fonts specifically for Negative Contrast applications (they have a B in the name). All the fonts a a bit bolder and have tighter letterfit. As of this date the FHWA has not approved the negative contrast designs for use, but  alot of copies are being licensed, so I think they may be making it onto the roadscape without the Fed approval.</p>
      <p>On another note our ClearviewOne fonts (the general purpose version of the Highway fonts) are being updated to OpenType and should be on our website when our new site goes up in a few weeks.</p>
      <p>Cyrillic versions are underway and we hope to add Greek this year as well.</p>
      <p>James</p>
    html_clean: |-
