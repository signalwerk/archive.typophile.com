      <p>Back when I first realized that all the smaller street signs in Glendale (and maybe further afield, and I do mean field :-) were handmade, an improbable mental image popped into my head, and I've never been able to get rid of it: a man gets a phone call at home from the city, turns to his wife and yells "hun, thems be needin' a sign fer 'Wabasso' by noon-like Thursdee", and the somewhat portly and very white woman in the other room whips out here scissors, pulls out the special black sticky paper stuff, and starts a'cuttin'. She used to REE-ly on this fancy maynooal with the pitchurz of how them city folk would rather have the letters on their signs be lookin' like if they had their druthers, but these days she just cuts 'em from her good ol' Germanic memory. Meanwhile, the husband goes to the shed in the back, pushes the goats aside, and PROH-seeds to cut some o' that white plastic or metal or whatever backing. He counts: W-a-b-a-s-s-o, makes 7, so 7 times 3, is 21, plus two inches on each side, makes 25, and WHAM, cuts the COH-rectly sized piece right up, and takes it back in to his old lady, god bless her steady hand.</p>
      <p>BTW, that sign is nothing: you should see how distinctly egg-shaped all the "O/o"s are around here - it makes you think there was indeed one person doing all of them, and maybe she ran a chicken coop on the side.</p>
      <p>I don't know how old they are. But when it comes to "missing"<br>
      shapes, like the tilde, anything can still happen to this day:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cañada_1_4451.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cañada_2_6359.jpg"></div><p></p>
      <p>And here's the cruncher:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cañada_3_3919.jpg"></div><br>
      "Goldangit, just put in a 'y' ya smartass!"<p></p>
      <p>hhp</p>
