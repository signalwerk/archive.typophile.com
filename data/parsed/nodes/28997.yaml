    html: <p>One of the things I like about Clearview is it basic form similarities to the father of most modern humanist sans faces - Johnston's Underground type. I know Clearview is nothing like a copy of Johnston, that Clearview is much more sophisticated, and that there are many important differences. But the fact that James arrived at his face after exhaustive research and it still resembles Johnston at so many points says something about the genius of Johnston's work, and James's too.</p>
