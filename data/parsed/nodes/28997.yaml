      <p>I don't see many similarities to Transport and Johnston stylistically. Jonhston is far more humanist in its construction than Transport. Transport is a little more draftsman and Akzidenz influenced than Johnston. </p>
      <p>I think a better comparison would be to Jock Kinneir's other design Rail Alphabet, which was one of the first sans serif signage faces (if not the first) to create both a negative and positive version of the design at different sizes to account for the optical trick of reversed out type looking larger.</p>
