  html: <p>I drove to Pennsylvania over the weekend and, as I had hoped, saw some road signage in <a href="http://clearviewhwy.com/" rel="nofollow">Clearview</a>. It's as good as advertised - much better than Highway Gothic. Some of the warning signs were done up in too light a face, but that was the signmaker's fault, not Terminal Design's. Anyone else see it regularly?</p>
