      <p>My guess is that most designers would shirk from using it not because the typeface itself is bad – but because it's a common typeface found on consumer computers, and thus is used in endless amateur publications. Combined with its distinctive looks, this has the unfortunate and rather unfair effect of <em>making it associated with</em> amateurism; all typeface "meanings" are, of course, socially contructed, and this would play into that.</p>
      <p>Zapfino is certainly not the only good typeface that's underused for this reason.</p>
