    <p>Hello </p>
    <p>I recently got in to a heated discussion with a designer friend of mine, who believes "Zapfino" can never be used in graphic design or art to produce "amazing" work.</p>
    <p>I personally think typefaces are like tools, each with a spectrum of uses or applicable scenarios. Some typefaces have a wide spectrum of uses while some have a much narrower window. I think to suggest that a typeface can never be used to produce beautiful work is underestimating human creativity and the infinity of creative possibilities. </p>
    <p>I have tried to find examples of Zapfino used amazingly but have not managed the  knock-out punch. I would greatly appreciate help in locating these.</p>
    <p>Plus what do you guys think about this debate in general.<br>
    Its my first time here so be nice. Thank you.</p>
