    html: "<p>Kim, what I would say is that you can use things like Typophile to counter the \"isolation\" you feel. I've learned a lot on-line in the past 5+ years, although I've probably learned more through books, so try to read a lot. <br> <br>I would also advise you to strongly pursue your interest in semi-serifs: it's a very promising avenue, and there's very little good work in that style. Most semi-serifs are either too calligraphic (see Mayer's stuff), or too concerned with formal style. Besides Aicher, I would recommend following the work of another thinking type designer: Evert Bloemsma. <br> <br>As for your technical/critique issues, go ahead and start new threads (in the correct sections), and hopefully we can help each other! <br> <br>hhp <br></p>"
