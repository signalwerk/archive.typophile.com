    votes: null
    html: "<p>Jimmy and Siti: <br> <br>I agree that it is a tough project to attempt a text face under a short deadline. Usually a person's first design is a display face, and that is also not easy to do under a tight timeline. <br> <br>Are you required to submit a computer-ready typeface, or can you submit tight pencil drawings? If you need not do the digital work the task would be a little easier, but it is still a very difficult task. <br> <br>I also agree that the best way to decide a direction is to study the types that have been done over the past few hundred years to today, and absorb and learn. There is no better school than your own observations and developed taste. <br> <br>Whatever way you decide to tackle the project, I think there is no better way to get your head and hand into it, than that of drawing letters loosly with a flat graphite sketch pencil. Study a few old layout books of the sixties and seventies.  <br> <br>Adrian Wilson wrote a very good book on book design. The title escapes me at the moment, but there are some very good illustration of the terchniques of sketching type for layout. Anything by Alexander Lawson is also good.  <br> <br>Dover Books in the past ten years re-published Frederic Goudy's two treatises: The Alphabet, and Elements of Lettering under one binding. Goudy's Typologia is another good source. <br> <br>Read Alan Haley's Hot Designers Make Cool Types. <br> <br>Best of luck to you, and don't be discouraged. <br> <br>Jim Rimmer</p>"
