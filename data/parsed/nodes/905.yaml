    date_raw: 26 Aug 2003 — 9:27am
    votes: null
    html: <p>David, I didn't mean to pick on the students; I'm sorry if it appeared this way. As an amateur typofile, my concern is with what is being taught in design schools. I see from JFP that a first rate professional shares my concern.  <br> <br>I think you will find that readers of English, French, etc. are considerably slowed down by not having caps at the beginning of sentences.  <br> <br>For that reason, using 'no caps' in text is to my eyes a forced 'trendiness' that is in fact bad typography. <br> <br>As to your own 'no caps', you may be influenced by your native Hebrew, which of course has no caps. Frankly, I do think it is a mistake in English text.  <br> <br>Incidentally, this doesn't apply to short display text or even poetry. I notice you (instinctively?) start each sentence on a new line, which overcomes the main problem of no caps.    </p>
    html_clean: <p>David, I didn't mean to pick on the students; I'm sorry if it appeared this way. As an amateur typofile, my concern is with what is being taught in design schools. I see from JFP that a first rate professional shares my concern.  <br> <br>I think you will find that readers of English, French, etc. are considerably slowed down by not having caps at the beginning of sentences.  <br> <br>For that reason, using 'no caps' in text is to my eyes a forced 'trendiness' that is in fact bad typography. <br> <br>As to your own 'no caps', you may be influenced by your native Hebrew, which of course has no caps. Frankly, I do think it is a mistake in English text.  <br> <br>Incidentally, this doesn't apply to short display text or even poetry. I notice you (instinctively?) start each sentence on a new line, which overcomes the main problem of no caps.    </p>
