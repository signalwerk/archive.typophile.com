    html: "<p>Hello everyone, <br> <br>First, I wanted to thank hhp, Jim Rimmer and david hamuel for the kind replies. And to Kim, welcome to this forum. I really think that you have a great possibility to become a fine typographer, not dumb like me. The font used for The Best Of Bjork album is a beautiful piece of type-art, I'm agree with you for that. And about the lack of typographic books to read, I have the same problems too here in Indonesia. I guess this  happens in every country in Asia (except Japan and Singapore) because of the local governments' low concerns about the development of formal design education(or stuffs like that) compared to the other major educations. I hope you can reach what you're up to, good luck Kim, and wish me luck too. <br> <br>Now can ask all of you where can i find a complete(am I asking too much?) tutorial about using Fontographer, any version is fine, I'm just starting to learn anyway. <br> <br>That's all I'm asking for now, but don't worry, there's more to come <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>PS : I got a bad english too, really sorry for that.</p>"
