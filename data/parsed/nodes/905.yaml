    html: <p>Excuse me, Siti. I'm just like you too, after few months of learning about typography (or may be a year, starting when i was studying the typographic elements of poems in my indonesian lecture class).I'm very new to typography. <br> <br>And I think I'm going to ask Mr. Hrant too, just like you Siti. <br> <br>So how do I have to start, Mr. Hrant ? <br>There are few simple 'stencil lookalike' A to Zs I had in mind (i called it 'stencil lookalike' because i don't know what typeface classification are they in)and they're pretty easy to be drawn on paper using pen and ruler. But I'm just not that patient when drawing them using curves on computer. I'm very new to Fontographer (4.1) and need help to make my typefaces look pretty similar to each other, with the same basic identities or something like that. <br> <br>Thank you very much. I'm really hoping of any of your reply.</p>
