    html: "<p>&gt; So how do I have to start, Mr. Hrant ? <br> <br>1) How should I know?!  :-) <br>2) Just call me hhp. <br> <br>There is no one way to learn type design, or anything else for that matter. But it's generally safe to say that you should: think about what you're trying to achieve; dissect the work of others, with a critical eye, and never imitating; learn through doing; trust your instincts, but also be analytical enough so that you're not just making pretty paintings. <br> <br>Read, discuss, do, iteratively, until you get bored. Keep doubt and faith in balance. <br> <br>-- <br> <br>I hope some others will help out here!  :-/ <br> <br>hhp <br></p>"
