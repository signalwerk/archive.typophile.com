    html: <p>Hello I'm 16 years old pupil from South Korea and I am new to this forum as well. <br> <br>My interests in typeface design kept growing since I graduated from primary school. <br> <br>Since I started enjoying generating visual images by computing my eager towards creation of typefaces has grown and when Sydney 2000 took place I was so sure that learning to design typefaces is obviously important factor to realise my dream as a Visual Artist in the future. <br> <br>When sydney 2000 was going on, I could see all the free and aboriginal, hopeful and traditional australian visual themes achieved by australian olympic visual makers but what fascinated me, most of all, was the type that were written in 'Share the Spirit' with other official signatures during this olympic. <br> <br>I kept looking them got impressed by the slicker, elegant lines of the Semi-serif atmosphere, all the integrations with picturesqueness of the visual theme and extremely modern Semi-serif typeface - it was an idealistic coordination of conventional, craftsmen's ways and experimentalism. <br> <br>I was inspired a lot even though I was a naive novice kid in a sense of being a well-disciplined artist. (there is no difference in presence as I couldn't improve myself under extremely irrational and dehumanised education system of south korea) <br> <br>It took a year for me to find the name of that font which is 'Binary' as I was looking around similar typefaces and I could also find out that it was originated from 'Rotis Semi Serif' style by Otl Aicher. I suppose, in my opinion, Semi-serif aspect  in typeface design is an ideal module to combine both traditional and experimental new modern trials. It looks like symmetrised yet each serif is irregular, whenever I look at them I get some hopeful,  sense between static mood activeness. <br> <br>The time I spent at school under the restrictive pressure of the irrational education policy of south korean government kept me even further from collecting and researching things that had to do with my dream - typographic references, intepreted book, imported copies of books like 'The elements of typographic design' etc. <br> <br>As even the environment for pupils to be educated in a peaceful mood at school are not provided, it is virtually impossible to get some good, specific written reference in a special, acrobatic field like typeface design, typography in south korea. <br> <br>Notwithstanding the suffocation, I didn't at least give up my interests in typeface design for example, even when I was having an apple pie in McDonalds, I was happy having discovered a special ratio of numbers, figures. (I really liked this sensitive aspect of figure designs, I still have no clue of the origin of these, yet, I can at least make like these ratio. 1,2,4,0 - normal 3,5,7,9 - down 6,8 - up. If you have any specific reference of this ratio in numbers please let me know) <br> <br>Well I should give an end to this ideal talk (I will disscuss about favourite fonts I liked each season later) <br> <br>I am recently preoccupied by the visual designs and types designed by M/M PARIS group of which the artists achieved Bjork's current album artworks. It is the first time I get this mad and visually influenced by certain artworks of a group. <br> <br>Here are some examples of M/M Paris typefaces in Bjork Album artworks. <br>http://unit.bjork.com/77island/77island/images/greatesthits26big.jpg <br>http://unit.bjork.com/77island/77island/images/greatesthits15big.jpg <br> <br> <br>Like other new comers up here, I have a struggling anxiety to learn to get used to converting the typographical blueprints on my head into real ones. I am improvising and practising a little in spite of lacking in references, but I think it is a time for me to take one step further to start theorically and conventionally train myself with type making. <br> <br>I will uploads few questions from now on. I would be very grateful if you could help and offer me some references I couldn't get offline in south korea. <br> <br>I am having hard time figuring how to set each side's angle THE SAME and accurately design on fontographer without tracing bitmap files and also wish to know the how traditional, conventional, normal process of developing typefaces is etc. These are my main curiousity. <br> <br>Oh and here are some of my improvisationsI know it is effortless and looks terrible compared to hard workers here. I just wish you to taste and let me know what is an ideal way corresponded to my typographical preference. Having only remoteness conception of the theory, improvising makes me worried. <br> <br>P.S. My english is terrible. Notice me when there are expressions that can hardly be understood. <br> <br>Examples of my improvisations <br>http://hps.netian.com/funnybook.jpg <br>http://hps.netian.com/preorder/notice.gif <br>http://hps.netian.com/hps.gif</p>
