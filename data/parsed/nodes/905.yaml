    html: "<p>If you're sharp and dedicated, you might be able to produce something usable in 8 months. But that's using my definition of \"text face\", which happens to be pretty tight. <br> <br>In terms of reading/perception, there really isn't any single book out there that directly addresses the things a type designer would need. In fact Herman Bouma himself never wrote a book at all - just a large number of interesting and relevant (but also very technical) research papers. So in order to extract useful conclusions about readability you have to spend many man-months reading and absorbing a large number of studies from the past 100 years and try to reconcile and assimilate all the different insights... Too much. <br> <br>Since this is just a start for you, instead of pushing the functionality boundaries you might try to stay within the conventional limits for now. You can easily do this by following the general design attributes of a really good font, depending on your application, like you could look at Unger's Swift if you want your font to be tuned for newspaper setting. But by \"general design attributes\" I don't mean details, I mean things like vertical proportions, color, width (overall and letterwise divergence), letterspacing, etc. <br> <br>One other thing: look at the work and developmental path of Aaron Sittig: <br><a href=\"http://www.xtypa.com/\" target=\"_blank\">http://www.xtypa.com/</a> <br>There might be things you can fruitfully emulate there. <br> <br>Good luck, and keep us in the loop, we'll try to help! <br> <br>hhp <br></p>"
