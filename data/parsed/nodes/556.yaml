    date: null
    date_raw: null
    votes: null
    html: <p>It seems like that "Italian Grill" should provide some clues, as I'm guessing it's all one typeface. Those low, sharp serifs on the italic, the wide crossbar and short top on the t -- it must be a font we can find, but I've looked up and down MyFonts and haven't been able to nail it down. Not one of the million Garamonds, not a Palatino. Arrgh!</p>
