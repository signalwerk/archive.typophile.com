      <p>Hi,<br>
      I’m not sure if you can find an exact match.<br>
      A suggestion for ‘Converse’: <a href="http://www.fontshop.com/fonts/downloads/bitstream/bitstream_cooper_medium_ot/?sample_text=CONVERSE%20ALL%20STAR&amp;sample_size=32">Cooper Medium</a>.<br>
      Looking at the details (top of ‘A’, leg of ‘R’, serifs on ‘E’ and ‘C’) and not at the overall appearance, I’d say <a href="http://www.fontshop.com/fonts/singles/linotype/memphis_medium/">Memphis</a> is quite close.</p>
