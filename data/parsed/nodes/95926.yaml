    <p>In a recent web search, inspired by the thread here about a Devanagari font from Adobe, I came across this fascinating web site:</p>
    <p><a class="freelinking external" href="http://nordenx.blogspot.ca/2012_04_01_archive.html" rel="nofollow">http://nordenx.blogspot.ca/2012_04_01_archive.html</a></p>
    <p>In the 1600s and before, the writing system used in the Philippines for Tagalog was, like those of Thailand, Burma, and Tibet, an abugida derived, like Devanagari, from the ancient Brahmi script.</p>
    <p>EDIT: My first search result was probably</p>
    <p><a class="freelinking external" href="http://istoryadista.blogspot.ca/2011/09/baybayin-way-of-writing-in-our-own.html" rel="nofollow">http://istoryadista.blogspot.ca/2011/09/baybayin-way-of-writing-in-our-own.html</a></p>
    <p>Another important site, with different fonts, is</p>
    <p><a class="freelinking external" href="http://www.mts.net/~pmorrow/bayeng1.htm" rel="nofollow">http://www.mts.net/~pmorrow/bayeng1.htm</a></p>
