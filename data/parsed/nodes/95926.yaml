    html: <p>It is fascinating to me too. Buhid is another one derived from Kawi; it hasn't died out and is still apparently in use in the Philippines. Needless to say, these abugidas and those of Indonesia (Batak, Balinese etc) are extremely under-represented in the type world. Hopefully that will change in time to stop these scripts from fading into obsolescence.</p>
