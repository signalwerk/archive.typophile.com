      <p>I believe the reason for your difficulty is that the lettering is probably hand-drawn, but the large letters are rather like Pink Broccoli's <a class="freelinking external" href="http://new.myfonts.com/fonts/pink-broccoli/hideaway/">Hideaway</a>. You could probably use any of several formal scripts in place of the script used here and no one would notice the switch.</p>
      <p> - Mike Yanega</p>
