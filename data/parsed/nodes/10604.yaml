    html: <p>I like it - I think it is simple and clever and very friendly. Don't be distracted by trying to prove it is designed. I think perhaps a weight change in single color versions would help and might give that tiny bit extra you are looking for. I would love to see what two colors you plan to use as I think that the branded image and trade dress will carry a large part of the personality as well. I am eager to see where you go with it. Good job.</p>
