  html: <p>I just discovered this site about a week ago and have enjoyed reading the mostly honest and thought out critiques here (It's rare to find that in most forums) <br> <br>Anyway I thought I would take advantage of others experience and see what I could do to improve on this logo. <br> <br>The company is a small employment agency that wants to seem "contemparary, national, and friendly" She has looked over a few samples I provided her and likes this one, but I think it needs a little more, It does'nt have much personality yet. <br> <br>Any suggestions, tips, etc... would be a huge help. <br> <br><img src="http://www.typophile.com/forums/messages/29/70969.gif" alt="GP Logo"></p>
