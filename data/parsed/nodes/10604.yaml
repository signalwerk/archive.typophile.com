      <p>Voiceof,</p>
      <p>I just found this thread, and I must say I kinda like the logo. I don't know if I'm to late with my answer, but I'll do it anyway. The idea is good and it has a personality for itself. As a logo I think it'll work.</p>
      <p>Maybe try to take the 'serifs' (or how are they called?) off of the 'p' and 'd' to accentuate the circles more. The stems then connect directly to the circle without that little serif.<br>
      You have to re-space it a bit then and do some optical glyph corrections, but that might work.</p>
      <p>Regards,<br>
      ®ené</p>
