  html: |-
    <p>Hey guys, just had a little tiff with a moody copywriter at work, talking about the way a "deck" or subheading should look. I work at an online publication and we have a lot of old newspaper types here, was hoping to get some opinions on this. </p>
    <p>He's saying that the break in the deck from one line to two should happen so that they are as close as possible in width, which i agree with, except for when the second line would be longer than the first. Am I incorrect? Should I be breaking headlines and subheadlines without regard to keeping the first line longer than the second?</p>
