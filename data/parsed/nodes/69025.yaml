      <p>///////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p><strong>BROWNSTONE SANS </strong> ::: NEW SUDTIPOS RELEASE</p>
    <p>///////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p>We are very happy to announce the release of <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Brownstone Sans &amp; Frames</a></strong>.</p>
    <p>Last week we announced that it just received a <strong>Certificate of Excellence</strong> at the Bienal Tipos Latinos 2010! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TypoBrownstone2_5826.jpg"></div><p></p>
    <p>///////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p>One design sparks another. As Alejandro Paul experimented with the strokes and curves of the monoline script Business Penmanship, he discovered interesting new forms and shapes that didn't fit the Spencerian theme of that typeface. These forms simmered in Ale's subconscious over the next three years, during which time he visited New York City, pored over rare type specimen books in the New York Public Library, and explored Brooklyn's neighborhoods.</p>
    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Brownstone</a></strong>, the face born from these explorations, is an original 21st-century design, yet one subtly infused with historical and cultural references - keen observers might spot influences from decorative typefaces of 19th-century foundries. And just as faces from that era were influenced by contemporary architecture, the frames included with <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Brownstone</a></strong> echo the ornate iron railings of Park Slope's row houses. (There's also a slight 1960s vibe to <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Brownstone</a></strong>, of novelty swash-sans photocompositing faces, that can be played up at your discretion.)</p>
    <p>Influences aside, <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Brownstone</a></strong> has broad appeal to modern audiences. A soft, monoline sans-serif, with elements of Swiss geometry (see the 'k' and 'x'), its marriage of highly legible, draftsman-like letterforms with decorative swashes and ornaments reflects the old-meets-new aesthetic of the DIY craft culture seen in Brooklyn and other urban centers. It's ornamental but unfussy, romantic but understated - a design theme well-suited to recession-era cynicism.</p>
    <p>Individual weights are being offered: <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000599" rel="nofollow">Thin</a></strong>, <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000600" rel="nofollow">Light</a></strong>, <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000601" rel="nofollow">Hole</a></strong> or <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000598" rel="nofollow">Complete</a></strong>. Also there is some options to get only the <strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000602" rel="nofollow">Frames</a></strong>.</p>
    <p>////////////////////////////////////////////////////////////////////////////////////////////////////</p>
    <p>ABOUT THE <strong>BROWNSTONE SPECIMEN</strong></p>
    <p><strong><a href="http://www.sudtipos.com/downloads/Brownstone-Specimen.pdf" rel="nofollow">Brownstone Specimen</a></strong> in PDF format is available <strong><a href="http://www.sudtipos.com/downloads/Brownstone-Specimen.pdf" rel="nofollow">here</a></strong>. It was written and photographed by our good friend <strong>Jon Parker</strong> who lives in Brooklyn.</p>
    <p>While we have been waiting for the release of the Brownstone specimen we did some <strong><a href="http://www.behance.net/Gallery/Brownstone-Sans-Sneak-Preview/461293" rel="nofollow">"Behance's sneak preview images"</a></strong> of this one.</p>
    <p><a href="http://www.sudtipos.com" rel="nofollow">www.sudtipos.com</a></p>
