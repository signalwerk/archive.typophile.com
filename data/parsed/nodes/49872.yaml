      <p>Thank you for your advice and remarks. I think you, John, get the drift of what I complained about. David, you seemed to defend Dr. Chromsky by asserting that there is no simple rule, only chain reactions.</p>
      <p>===</p>
      <p>Many people believe mistakenly that the two-day High Holiday of Rosh Hashana is in a similar theme as of the other holidays in this season: remorse for past short-comings, and a firm resolve for a better future; blessing for a good and sweet year; a time to get closer to G-d; and happiness for the Torah.</p>
      <p>Actually, Rosh Hashana stands apart, as it is not self-centered, and having to do mainly with us. Rather, the focus of Rosh Hashana is only upon G-d's role as king of the universe and every single living being in it.</p>
      <p>In that way, Rosh Hashana is a universal holiday, which affects all humanity - perhaps, more than any other holiday (although many people point to Chanukah for its universal message of religious freedom).</p>
      <p>The sealing of ones fate, so to speak, is about three weeks later, on Hoshana Raba. According to Chassidic understanding, based upon the teachings of Jewish mysticism, if one is not satisfied with the outxcome of G-d's judgement, one still has the opportunity to "turn over the cart" and earn remarkable blessings by dancing excitedly on Simchat Torah, as is the custom of Lubavitchers. We are never satisfied with whatever we get. :)</p>
      <p>===</p>
      <p>Ktiva vachatima tovs - may you be written and sealed for a good year!</p>
