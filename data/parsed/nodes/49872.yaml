      <p>Michel,</p>
      <p>Thank you for these five examples of the word, "גְּאֻלָּה", "redemption", each with a dagesh both in the gimmel and lamed.</p>
      <p>This word, "גְּאֻלָּה" is not with a shuruk (with a vov), but with a kubutz under the aleph, and without a vov.</p>
      <p>Hence, the correct way to represent "גאולה" with a vov, is to place a dagesh both in the gimmel and the lamed.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Geulah2_4104.jpg"></div><p></p>
      <p>.<br>
      .<br>
      When I originally quoted this term, גאולה, I really wan't referring to any point in Hebrew grammar, or to its typical Biblical usage. Rather, I was referring to itsusage in modern terms, as the end of גלות, the 2,000 year old exile of the Jewish people, known as the גולה, the diaspora. By inserting an aleph, א, into the word, גולה, between the gimmel and the vov, the results are: גאולה, redemption.</p>
      <p>This was in continuation to my quotation from the book, "Letters of Light", which attributes Divine significance to the meaning of an aleph.</p>
      <p>Our discussion was parenthetical.</p>
      <p>Why is a vov included in the spelling of "גאולה", and not without a vov, like the Biblical spelling: "גְּאֻלָּה"?</p>
      <p>One answer can be like David's pointing to the habit to drop the vov or yud in words spelled with nikkud, and their insertion when words are spelled without nikkud.</p>
      <p>I would like to suggest that here too the reason of inserting the vov is because of a lofty reason.</p>
      <p>The Biblical term, "גְּאֻלָּה", is different in its usage than "גאולה", which refers to end of "גלות", or the "גולה". A vov refers to the concept in Jewish mysticism of "hamshachah", a drawing down from Above to below, or how G-d illuminates this world.</p>
      <p>If so, you might ask, isn't there also a vov in "גולה"?</p>
      <p>The basic Chassidic belief from the teachings of the Baal Shem Tov is that even during this time of "גלות", exile, G-d is with us in an open and revealed way.</p>
      <p>We say this in Psalm 23:4-:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Ps_23_4_4198.jpg"></div><p></p>
      <p>.<br>
      Chapter 23:4<br>
      ...ki atah eemahdee... for You are with me...</p>
      <p>Atah, You refers to G-d directly, His very essence;<br>
      eemahdee, are with me refers to an essential relationship.</p>
      <p>This shows that G-d's presense is not normally hidden, but enjoins a person, even in times of trouble.</p>
