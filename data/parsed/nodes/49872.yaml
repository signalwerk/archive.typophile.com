      <p>I heard a very wonderful explanation why we use an apple specifically to dip in honey.</p>
      <p>Aren't there other sweet fruits to use?</p>
      <p>In Hebrew, an apple is called a "tah-pu-ach".</p>
      <p>"Tapuach" means something filled up very full.</p>
      <p>On Rosh Hashana, we beseech G-d to be blessed with a good and sweet year filled up very full with blessings. This prayerful wish is symbolized by using an apple.</p>
      <p>I also heard that red is associated with sweetness, and green is less, as we see often with apples in general.</p>
