      <p>So, the Golem's remains are still here with us. And I assume the ancient Torah scroll, I think one of the oldest, is similarly 'living' proof of one of Masoretic texts.</p>
      <p>I know that every Purim holiday, when we recite this passage from the Sefer Torah scroll, we "read" both versions out loud, even if only one version is written there.</p>
      <p>About the wildcard searches, I will discuss with you by email what I have in mind. Actually, I want to use this feature in a few different ways, as we will discuss.</p>
      <p>===</p>
      <p>In Michel's example, this is a strong dagesh, because most gimmels which follow a vowel do not have a dagesh. Usually, only a gimmel which begins a verse has a dagesh. Some gimmels that begin a verse do not have a dagesh. </p>
      <p>What is a gimmel without a dagesh which begins a verse called?</p>
      <p>===</p>
      <p>On Rosh Hashana, as I recited in the prayerbook the holiday prayers, I noticed the appearance of the gimmel a lot, whether it had a dagesh or not, and whether it followed a vowel or not.</p>
      <p>First, I noticed that in general the gimmel appeared with much less frequency that most other letters. Is this why its form is less significant (i.e. more narrow)? :)</p>
      <p>Second, when any noun followed after a "hei ha-ye-di-ah", a hei with a patach (eg. the xxxx), the first letter has a dagesh. Hence, even if the gimmel follows after a vowel, in this case it has a dagesh, and is not necessarily a strong dagesh.</p>
      <p>In this second example, what is this dagesh called?</p>
