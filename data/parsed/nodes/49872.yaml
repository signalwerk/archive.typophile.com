      <p>Aside:</p>
      <p>The old Jewish quarter in Prague is very well preserved, Israel, as is most of the rest of the city. Prague was spared from major aerial bombardment during the war and, with characteristic perversity, the Nazis planned to preserve the Jewish quarter as a museum of the people whom they intended to destroy. There are at least two pre-war synagogues still standing, as well as the cemetery, and many houses and buildings where Jews lived, ran businesses, and met in the many philanthropic and devotional organisations. It is a fascinating neighbourhood to walk around.</p>
