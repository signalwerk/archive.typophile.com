      <p>Israel, you may like Weingreen's <em>A practical grammar for classical Hebrew,</em> which is well structured and quite clear. Complex topics are followed by a summary, making it easy to check that you have understood the preceding explanations and examples. For example:</p>
      <p><cite>‘Dagesh Lene applies to the six letters בגדכפת and, when inserted in them, hardens them by changing the sound from spirant to momentary. Dagesh Lene occurs in these letters at the beginning of a syllable, provided no vowel immediately precedes.’</cite></p>
      <p>This still leaves some questions, but these too are clarified. For instance, if the preceding word ends in a vowel, will the gimel etc. at the beginning of the next work take dagesh or not?</p>
