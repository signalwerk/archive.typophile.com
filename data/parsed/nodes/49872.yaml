      <p><em>Was one of the old synagogues still standing in Prague, the Old-New Shul, that housed the remains of the Golem?</em></p>
      <p>Yes, the Old New Shul is still there. The upper room, the genizah where the legendary Prague Golem was kept, is closed to the public of course.</p>
      <p><em>In a CSUB string can wild cards be included, John?</em></p>
      <p>Note: <strong>G</strong>SUB, not CSUB. G for glyph.</p>
      <p>It is possible to define glyph groups that can then be employed like wildcards in context strings. So, for example, you might have a glyph group for 'any_mark' or for 'any_letter' that would contain all the appropriate glyphs. These can be used in both GSUB and GPOS lookups.</p>
