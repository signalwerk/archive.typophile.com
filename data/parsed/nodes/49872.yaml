      <p>I briefly reviewed David Kimchi' Hebrew Grammar by William Chomsky. I am studying it more seriously.</p>
      <p>My first response to Dr. Chomsky's thorough presentation of Rabbi Kimchi's broad knowledge of classical Hebrew Grammar, is that it lacks a comprehensive analysis of its topics, and a systematic presentation.</p>
      <p>Who is writing to? </p>
      <p>Peers, who appreciate his subject matter and array of examples, do not need a paragraph overview or two and a definition of a rule of the Hebrew Grammar that those examples illustrate.</p>
      <p>I am a student of Hebrew Grammar. Not a peer. I seek a short overview of each rule of Hebrew Grammar. I would gain increased knowledge from a comprehensive analysis of its topics, and a systematic presentation.</p>
      <p>I hope the other books suggested on this topic are not as limited as this one.</p>
