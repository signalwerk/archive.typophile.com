      <p>John,</p>
      <p>&gt; I visited Rabbi Loeb’s grave when I was in Prague.</p>
      <p>I was told that in World War II, when the Nazis were leveling Prague, many non-Jews gathered by Rabbi Loeb's gravesite, for there was a tradition among the non-Jews that in times of peril, they should collect by his grave, as Rabbi Loeb would protect them.</p>
      <p>===</p>
      <p>The oldest standing synagogue existed in Prague. I believe the Nazis destroyed it. It housed the body of the famed Golem, creatred by Rabbi Loeb, upstairs in the attic, among the shaimos, old books and manuscripts that contain G-d's holy name.</p>
      <p>Once when the fifth Lubavitcher Rebbe, the Rebbe Reshab, was traveling, he took his only son, Rabbi Joseph Isaac, with him to that synagogue to pray. Rabbi Joseph Isaac was only a young boy then, and curious, he ascended the stairs to the attic to see if there really were the remains of the Golem there. After a short time, he descended with a scared white look on his face. The Rebbe Reshab took a very long time to pray the evening service. He then told his son: "I had to turn around the heavens for you."</p>
      <p>Why did he say that?</p>
      <p>===</p>
      <p>Many years later, the Nazis overran Prague, and invaded this synaggue. Two Nazis brazenly ascended the steps too, in search of the Golem. </p>
