    date: 2008-09-29T15:00:00
    votes: null
    html: <p>The vocalisation of the Bible text as standardised by the Tiberian -- i.e. Palestinian -- Masoretes, represents the pronunciation as current around the 8th–10th Century, i.e. more than a thousand years after the last of the original consonantal texts was written. We know for a fact that this mediaeval pronunciation did not perfectly match the ancient pronunciation, because of those places in the text where the vowels do not match neatly the number of consonants, the most famous example being the vocalisation of YRShLM as if it were YRShLYM. As I wrote in one of the other threads, vowels are the most fluid aspect of language, both in terms of individual pronunciation and in terms of regional and historical variation. A vowel is a movement of air through the throat and mouth, and as such is much less precise than a consonant, which is a restriction or stoppage of air at a specific point in the throat or mouth. I remember reading some time ago about a linguistic professor who had trained himself to perfectly produce cardinal vowel sounds according to the open/closed, front/medial/back analysis of vowel sounds, but this was remarkable exactly because this is not how people normally talk.</p>
