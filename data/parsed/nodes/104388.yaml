    html: <p>Agree with aluminum about consulting your printer. You should  be okay if the printer is careful, but newspapers are usually printed on a web press (a big roll of paper that's not cut apart until after it's printed) and the emphasis is on speed rather than quality, so you might want to avoid tiny reversed-out type until you're sure the printer is really doing a quality job with good color registration.</p>
