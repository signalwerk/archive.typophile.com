      <p>I am the creative director of a large newspaper that is currently going through a redesign. We have decided on Coranto 2 for body text and Coranto 2 Headline for (obviously) headlines.</p>
      <p>Immediately, there are some really problematic things that I see with your design that can be fixed relatively easily, depending on how good of an eye you have for these things.</p>
      <p>Firstly, I think Coranto 2 is set too large for the body type – but maybe just by a few tenths of a point. Certainly the leading is too tight. It definitely needs to go up. I'm not sure if you read it, but the post just above your return to this thread details a problem that is caused by your leading. Definitely have a read into that.</p>
      <p>The widths of the teaser boxes seem to have been chosen arbitrarily. That's not good at all. Given that there are four boxes in the space of four columns, it looks very jarring to not see them match up with the columns. If you had a different number – say three or five — then you could work with it, but not like that. </p>
      <p>The way you have that photo of the woman in a sash and the way it doesn't match up with the column is also very jarring. Having the credits running on the side is not a justification for not running the image the full column width. It just looks wrong.</p>
      <p>Finally, the "Sabio: One band, one sound" piece also looks wrong because the text box doesn't fit the width of the column, and it looks like you've done it this way just so it can have a line running down the right. I would get rid of it.</p>
      <p>I am on a panel of judges of a secondary school newspaper and magazine design competition, and these are the things that I would pick out as problematic things.</p>
      <p>But the reasons I would pick out these things, especially the way you've overlooked really core typographic features like adequate leading, is because design is not how it looks. It's not that veneer and those pretty font choices, but how it functions as a newspaper for the reader. Design is how it works!</p>
      <p>You need to go back to basics and look at it from that point of view: you are designing things in such a way so as for them to have a function that benefits the reader.</p>
      <p>(Also, I am not sure I like the way the "T" runs into the "h" in the masthead – it draws too much attention onto an unimportant word in the title. I also feel like the kerning around the "O" in "Pioneer" is too tight.)</p>
