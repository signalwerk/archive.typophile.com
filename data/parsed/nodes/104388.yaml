      <p>I think your third new layout shows most promise. I assume it'll have variants with more conventional headlines? Headline-in-picture looks very professional, but it's restricted to top newspapers for a reason: it's difficult to do convincingly and requires the right picture material to work. (I've worked as a page editor at one of Sweden's biggest newspapers, trust me on this.)</p>
      <p>Things in general you'll want to consider, that are more or less problematic accross the different layouts at the moment:</p>
      <p>* Establishing a clear hierarchy of articles and headline styles. A messy layout with articles of different length and different headline size placed willy-nilly is more difficult to read and orientate yourself in. If you're going for (for instance) a bigger-font-size one-column headline (which seems to be the case here), make sure it's consistently applied as such, is clearly delimited from other headline styles, and perhaps if possible always has the exact same font size, number of lines, and position on the page.</p>
      <p>* Establishing a clear demarcation if what articles belong together and which don't. A hairline-width line between articles on different topics (and the absence of one where the two are on the same topic) is one helpful way of doing this, or it can be achieved with clever picture placement, colour boxes... (PS. Why are your lines generally this thickness? It's probably a personal preference, but most newspapers at least here tend to have thinner lines, or intentionally chunkier ones. :))</p>
      <p>* Establishing a set of clearly navigable page layouts/grids. There's a reason most five-column-design tabloid-size newspapers have 3+2 and/or 4+1 layouts (one or two columns divided off, consistently, on every page or every alternate page) – it makes reading and article hierarchy all the easier. Another classic is having (consistent-height) small articles running along the bottom of pages. These same columns and bottom articles can also be used for side content on feature pages. (Clearly, this does not apply to the front page, but having a consistent layout idea helps there, too.)  One thing it definitely makes easier – which I see you're having problems with – is getting elements to line up visually. If something on a page sticks up a centimeter above something else, you're probably doing it wrong. </p>
      <p>* Use consistent spacing between elements as far as possible. One example: those writer bylines! In every layout, they're floating all over the place, sometimes far from the headline, sometimes far from the body copy. Stuff like this needs to be consistent, or it looks messy.</p>
      <p>* Give stuff room to breathe! If there's anything that looks unprofessional at first glance in your layouts (which otherwise are frankly very well done for high-school level) it's the way things are occasionally squeezed into too-tight containers, tracked too tightly, line-spaced too tightly. For instance, all of your colour boxes (that are a great way of establishing hierarchy) have the text simply running too close to their edges – you sould narrow the text column inside to give at least a milimeter or two more margin, it'll make them instantly more readable. And in general: Good use of white space is one thing that truly sets apart professional products.</p>
    html_clean: |-
      <p>I think your third new layout shows most promise. I assume it'll have variants with more conventional headlines? Headline-in-picture looks very professional, but it's restricted to top newspapers for a reason: it's difficult to do convincingly and requires the right picture material to work. (I've worked as a page editor at one of Sweden's biggest newspapers, trust me on this.)</p>
      <p>Things in general you'll want to consider, that are more or less problematic accross the different layouts at the moment:</p>
      <p>* Establishing a clear hierarchy of articles and headline styles. A messy layout with articles of different length and different headline size placed willy-nilly is more difficult to read and orientate yourself in. If you're going for (for instance) a bigger-font-size one-column headline (which seems to be the case here), make sure it's consistently applied as such, is clearly delimited from other headline styles, and perhaps if possible always has the exact same font size, number of lines, and position on the page.</p>
      <p>* Establishing a clear demarcation if what articles belong together and which don't. A hairline-width line between articles on different topics (and the absence of one where the two are on the same topic) is one helpful way of doing this, or it can be achieved with clever picture placement, colour boxes... (PS. Why are your lines generally this thickness? It's probably a personal preference, but most newspapers at least here tend to have thinner lines, or intentionally chunkier ones. :))</p>
      <p>* Establishing a set of clearly navigable page layouts/grids. There's a reason most five-column-design tabloid-size newspapers have 3+2 and/or 4+1 layouts (one or two columns divided off, consistently, on every page or every alternate page) – it makes reading and article hierarchy all the easier. Another classic is having (consistent-height) small articles running along the bottom of pages. These same columns and bottom articles can also be used for side content on feature pages. (Clearly, this does not apply to the front page, but having a consistent layout idea helps there, too.)  One thing it definitely makes easier – which I see you're having problems with – is getting elements to line up visually. If something on a page sticks up a centimeter above something else, you're probably doing it wrong. </p>
      <p>* Use consistent spacing between elements as far as possible. One example: those writer bylines! In every layout, they're floating all over the place, sometimes far from the headline, sometimes far from the body copy. Stuff like this needs to be consistent, or it looks messy.</p>
      <p>* Give stuff room to breathe! If there's anything that looks unprofessional at first glance in your layouts (which otherwise are frankly very well done for high-school level) it's the way things are occasionally squeezed into too-tight containers, tracked too tightly, line-spaced too tightly. For instance, all of your colour boxes (that are a great way of establishing hierarchy) have the text simply running too close to their edges – you sould narrow the text column inside to give at least a milimeter or two more margin, it'll make them instantly more readable. And in general: Good use of white space is one thing that truly sets apart professional products.</p>
