    <p>Hello everyone. I am designing a high school newspaper for my campus, called "The Pioneer". What it pioneered, I do not know.</p>
    <p>Here it is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BoxxyPioneer_4210.jpg"></div><p></p>
    <p>Some info: the campus publication industry in the Philippines is hyper-competitive -- annual press contests influence school press offices to twerk their writing bugs. And being stuck with Arial and Times New Roman means total loss in this arena (because duh).</p>
    <p>Last year, they used system Franklin Gothic and Proforma. Here, it's Flama and Farnham. Thoughts?</p>
