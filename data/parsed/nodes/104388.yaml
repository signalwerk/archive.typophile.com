      <p>I'm not very used to so much running text on the front page of newspapers, so they all present more than what's «necessary» to me, but I guess that's conventional elsewhere. </p>
      <p>I prefer the third one; I think the title set on white and the sections on top makes it the most clean and tidy design.<br>
