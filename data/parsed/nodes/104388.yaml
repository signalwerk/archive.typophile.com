      <p>I know it’s placeholder text, but you can see that the narrow columns with justified text as it is will cause a lot of issues with word spacing/rivers that needs to be fixed.</p>
      <p>The content is separated by colored boxes, but I’m not sure if the colors are supposed to denote a specific news category or level of importance, or is arbitrary? They might not be aiding the reader by making different articles grab for attention at the same time. Lighter color or lines between columns might be a more subtle but still clear content separator. Is there a reason one headline is italic serif while the rest are bold sans serifs? </p>
      <p>The bullets next to the page numbers in the «Inside» box seem superfluous.</p>
