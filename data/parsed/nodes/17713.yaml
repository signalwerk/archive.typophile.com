    <p>——————————————————————<br>
    We are proud to announce the first issue of the Kitabat conference newsletter.<br>
    It contains regularly updated information on the upcoming conference.<br>
    ——————————————————————<br>
    We have just launched our website: <a href="http://www.kitabat.org" title="http://www.kitabat.org">http://www.kitabat.org</a><br>
    Log on to check out regularly updated information, to register online for lectures, workshops and events.<br>
    email: <a href="mailto:info@kitabat.org">info@kitabat.org</a></p>
    <p>SPECIAL RATES FOR ATYPI MEMBERS AND EDUCATIONAL GROUP PRICES</p>
    <p>——————————————————————<br>
    Kitabat is the first major Arabic calligraphy and typography conference in the region.<br>
     &nbsp;<br>
    Hosted by the Visual Communication Department at the American University in Dubai,<br>
    in partnership with Linotype GmBH (Germany) and the Khatt Foundation: Center for Arabic Typography (Amsterdam)<br>
    and in collaboration with the Association Typographique Internationale (ATypI).</p>
    <p> &nbsp;<br>
    The aim of this conference is to bridge Eastern and Western design and lead to a two-way cultural exchange. &nbsp;<br>
    It also seeks to enhance the dialogue between calligraphy and typography.<br>
    An Internationally-renown line-up of speakers (from the world’s largest  type foundries, software companies,<br>
    and award-winning Arab and Western designers) will be discussing the future of Arabic typography<br>
    and corporate design.</p>
    <p>A new fresh vision of Arabic fonts will be unveiled at the awards ceremony of Linotype’s Arabic Type Design Competition.</p>
    <p>The main topics of Kitabat<br>
    — History of Arabic calligraphy and printing<br>
    — Arabic typeface design and type technology<br>
    — Arabic typography and graphic design in the Middle East.<br>
     &nbsp;<br>
    There will also be workshops, panels and exhibitions on Arabic calligraphy, typeface design, graphic design,<br>
    type technology, and type education.</p>
    <p>——————————————————————<br>
    Confirmed speakers to date</p>
    <p>— Dr Nabil Safwat (keynote speaker)<br>
    — Prof. Ugur Derman (Istanbul, Turkey)<br>
    — Mohamed Zakariya (Virginia, USA)<br>
    — Dr Goeffrey Roper (London, UK)<br>
    — Mamoun Sakkal (Seattle, USA)<br>
    — Johannes Bergerhausen (Germany)<br>
    — Adil Allawi (Diwan, UK)<br>
    — Kamal Mansour (Monotype, USA)<br>
    — Bruno Steinert (Linotype, Germany)<br>
    — Mounir Al- Shaarani (Cairo, Egypt)<br>
    — Huda Smitshuijzen AbiFares (AUD, UAE / Khatt, Holland)<br>
    — Nadine Chahine (Linotype, Germany)<br>
    — Gerard Unger (Bussum, Holland)<br>
    — Tajelssir Hassan (Sharjah, UAE)<br>
    — Reza Abedini (Teheran, Iran)<br>
    — Tarek Atrissi (Utrecht, Holland)<br>
    — Ihsan Hammouri (Jordan/USA)<br>
    — Obeida Sidani (Dubai, UAE)<br>
    — Yasmine Taan (LAU, Lebanon)<br>
    — Aida Sakkal (Seattle, USA)<br>
    — Antonia Carver (Dubai, UAE)<br>
    — Zeina Maasri (AUB, Lebanon)<br>
    — Fawzi Rahal (Dubai, UAE)<br>
    — Nadine Touma (Beirut, Lebanon)<br>
    — Leland Hill (VCU, Qatar)<br>
    — Petr Van Blockland (Holland)</p>
