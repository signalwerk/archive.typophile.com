      <p>Yes.</p>
      <p>I'm guessing if you have Word 2010 you also have Corbel and Calibri, both have a ‘full’ set of figures (proportional &amp; tabular versions of lining &amp; old style = 4 sets). Checking in Word 2007, Corbel seems to use proportional old style figures by default. (They're both part of the <a class="freelinking external" href="http://www.ascendercorp.com/catalog/microsoft/clear-type-font-collection/" rel="nofollow">ClearType Font Collection</a>, which are almost certainly the most feature-rich faces you have on your office comp.)</p>
      <p>There are <a class="freelinking external" href="http://myfonts.us/td-yrrGne" rel="nofollow">many</a> other sans-serif fonts with OSF(old style figures) if you want to buy a specific one.</p>
      <p>If your company has a designer, I bet they'd be happy to consult with you too.</p>
