  html: |-
    <p>Hello all. </p>
    <p>I have been given the job of trying to give our Board Reports a bit of a face-lift (largely on the strength of my desktop wallpaper being 'typographically themed' - now I'm in a panic! Our corporate typeface is Helvetica (but the brand guide actually endorses the use of Arial due to its ubiquity in most large companies). Our MD has said that he doesn't particularly like Arial and would not object to some other styles, "as long as they are easy to read".</p>
    <p>Board reports have typically been in Arial at 11pt size, with standard page layout of 1inch margins all around (something I would also like to change), justified (which has resulted some awful looking pages when web addresses have been included). Line spacing has varied between 1.25 and 1.5. The software used for producing the reports is the standard version of Microsoft Word 2010.</p>
    <p>This may sound like a daft question from an utter newbie (which I am), but: are there any sans-serif fonts that have 'old-style' figures included as well as the 'lining' type as well? If not, then I am guessing that I am after a serif font (slab or otherwise) that can offer this option.</p>
    <p>Commercially available fonts as well as 'free' fonts suggestions are welcome. Hope that some of you can help.</p>
