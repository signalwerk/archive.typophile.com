    html: |-
      <p>Most commercial fonts and faces are targetted at the printing industry which regards a resolution of 600×600 dpi as shockingly coarse. A computer monitor usually has a resolution of 100×100 dpi or thereabout. ClearType and similar tricks can fake ca. 300×100 dpi on a sunshiny day. So, Win or Mac, text will rarely look as good on screen as on paper. And, yes, hinting is about nudging the font into looking as good as possible on screen.</p>
      <p>On the other hand, text on screen can be resized and reset to what feels good for <em>you, here and now.</em> Rather difficult to do that on paper.</p>
