    <p>Meet the Metro Nova typeface family, new from Monotype. Designed by Monotype’s Toshi Omagari, Metro Nova is the next-generation version of William Addison Dwiggins’ Metro design, released into the Linotype library in 1930. </p>
    <p>The initial Metro was designed for use in industry-standard typesetting machines for the printing of newspapers, magazines and posters from the late-19th century to the 1970s. Metro was a "duplexed" typeface, whereby a pair of styles, such as roman and italic, was drawn with matching individual character widths. Dwiggins' design took this into consideration. </p>
    <p>Metro Nova comprises seven weights, from ultra thin to extra black in regular proportions, and six weights as condensed designs. Each has an italic counterpart for a total of 26 fonts. The family is available as OpenType Pro fonts, which provide for the ability to easily insert typographic features such as ligatures, fractions and alternate characters. Pro fonts also offer an extended character set to support most Central European and many Eastern European languages. Metro Nova may be licensed as either desktop fonts or Web fonts from <a href="http://www.myfonts.com" title="www.myfonts.com">www.myfonts.com</a>, <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a> or <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. </p>
    <p>The new fonts are also available as Web fonts through all <a class="freelinking external" href="http://cts.businesswire.com/ct/CT?id=smartlink&amp;url=http%3A%2F%2Fwww.fonts.com%2Fweb-fonts%2F&amp;esheet=50680336&amp;newsitemid=20130730005456&amp;lan=en-US&amp;anchor=Fonts.com+Web+Fonts&amp;index=6&amp;md5=31ebcf776b09a2a170898c205971bf1d " rel="nofollow"> Fonts.com Web Fonts</a> paid subscription plans. In addition, Metro Nova is available as both Web fonts and desktop fonts through <a class="freelinking external" href="http://cts.businesswire.com/ct/CT?id=smartlink&amp;url=http%3A%2F%2Fwww.fonts.com%2Fweb-fonts%2Fplans-and-pricing&amp;esheet=50680336&amp;newsitemid=20130730005456&amp;lan=en-US&amp;anchor=Fonts.com+Professional+and+Master+subscription+plans&amp;index=7&amp;md5=f73b14ae499a4515f499baaf06613ffa " rel="nofollow"> Fonts.com Professional and Master subscription plans</a>.</p>
