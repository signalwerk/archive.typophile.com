  - id: 52368
    user: 1250
    date: 2004-11-17T10:48:00
    date_raw: 17 Nov 2004 — 10:48am
    votes: null
    html: "<p>This looks pretty promising! <br>I agree with Eduardo about the descenders (way too long for a paperback face - since economy is critical there) and the \"i\" (the dot is also too small), but I think the \"a\" is fabulous as it is, and the serifs being strong might be a good thing - in fact I would make the ones on the ascenders longer. <br> <br>More: <br>- Considering this is for smaller point sizes: your x-height is too small; the overshoots (like in the \"o\") need to be more; don't forget the trapping*. <br>- I'm not sure what problem you're seeing with the \"v\". Maybe just shorten the inside-right serif. <br>- The spacing (besides being uneven - although I'm sure you haven't gone there yet) might be a bit loose, but maybe not - depending on your target point size. <br>- Color might be right on, considering press gain. <br> <br>* <a href=\"http://www.themicrofoundry.com/ss_trapping1.html\" target=\"_blank\">http://www.themicrofoundry.com/ss_trapping1.html</a> <br> <br>hhp</p>"
    html_clean: "<p>This looks pretty promising! <br>I agree with Eduardo about the descenders (way too long for a paperback face - since economy is critical there) and the \"i\" (the dot is also too small), but I think the \"a\" is fabulous as it is, and the serifs being strong might be a good thing - in fact I would make the ones on the ascenders longer. <br> <br>More: <br>- Considering this is for smaller point sizes: your x-height is too small; the overshoots (like in the \"o\") need to be more; don't forget the trapping*. <br>- I'm not sure what problem you're seeing with the \"v\". Maybe just shorten the inside-right serif. <br>- The spacing (besides being uneven - although I'm sure you haven't gone there yet) might be a bit loose, but maybe not - depending on your target point size. <br>- Color might be right on, considering press gain. <br> <br>* <a href=\"http://www.themicrofoundry.com/ss_trapping1.html\" target=\"_blank\" class=\"link-external\">http://www.themicrofoundry.com/ss_trapping1.html</a> <br> <br>hhp</p>"
  - id: 52369
