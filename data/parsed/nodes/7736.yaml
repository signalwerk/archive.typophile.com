    html: <p>Thanks for all of your valuable comments. I see what you two are saying about the descender and the "i" dot. The trapping instructions will be really useful too - I haven't considered it much before. <br> <br>The "v"? Well for one thing, the bottom bit looks like it could poke someone's eye out! It has also been pointed out to me that the angles of the left and right strokes aren't balanced. And I am sooo not at the spacing stage yet... <br> <br>About space economy considerations, actually I was basing the x-height on what I saw being used in recent fiction novels. I looked at 16 books that were published within the last 15 years. Four were set in Sabon, four in Bembo, two in Adobe Garamond, then one each of Stempel Garamond, Minion, Centaur, Monotype Garamond, Perpetua and Fairfield. I don't really have a method to determine what sizes to use yet, so I figured I probably wouldn't go wrong if I didn't stray too far from what was already out there. <br> <br>I also read that a typeface which is too uniform will not be easy to read. But are there any particular letters or parts of letters that you pick to make them quirky?</p>
    html_clean: <p>Thanks for all of your valuable comments. I see what you two are saying about the descender and the "i" dot. The trapping instructions will be really useful too - I haven't considered it much before. <br> <br>The "v"? Well for one thing, the bottom bit looks like it could poke someone's eye out! It has also been pointed out to me that the angles of the left and right strokes aren't balanced. And I am sooo not at the spacing stage yet... <br> <br>About space economy considerations, actually I was basing the x-height on what I saw being used in recent fiction novels. I looked at 16 books that were published within the last 15 years. Four were set in Sabon, four in Bembo, two in Adobe Garamond, then one each of Stempel Garamond, Minion, Centaur, Monotype Garamond, Perpetua and Fairfield. I don't really have a method to determine what sizes to use yet, so I figured I probably wouldn't go wrong if I didn't stray too far from what was already out there. <br> <br>I also read that a typeface which is too uniform will not be easy to read. But are there any particular letters or parts of letters that you pick to make them quirky?</p>
