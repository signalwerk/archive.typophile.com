    html: "<p>&gt; I was basing the x-height on what I <br>&gt; saw being used in recent fiction novels. <br> <br>Very smart of you to do that \"legwork\". <br> <br>I should ask: what point size are we talking about? <br> <br>&gt; are there any particular letters or parts <br>&gt; of letters that you pick to make them quirky? <br> <br>Now <i>that's</i> a question! <br> <br>Paul wrote about amplifying \"personality\", which is very cool, but that's different than divergence for the sake of readability. But it's very hard to say <i>where</i> divergences should go, and how far. One mainstream way to incorporate divergence is in widths: you'll notice that many good faces have what might seem to be an overly narrow \"s\", \"t\", etc. A less mainstream but still acceptable area of divergence can be the extenders, for example making the tails of the \"j\" and \"y\" very different. Another way is through color (weight), by making some glyphs slightly darker/lighter than the \"norm\" - although this generally imparts a crude feeling, so it has to be done with great subtlety. Beyond that you can start to get pretty deep, like varying serif sizes, the bowls of \"b\"/\"d\"/\"p\"/\"q\" and their relationship to the \"el\" and \"o\", etc. Tricky stuff. But highly magnetic to some of us. <br> <br>hhp</p>"
    html_clean: "<p>&gt; I was basing the x-height on what I <br>&gt; saw being used in recent fiction novels. <br> <br>Very smart of you to do that \"legwork\". <br> <br>I should ask: what point size are we talking about? <br> <br>&gt; are there any particular letters or parts <br>&gt; of letters that you pick to make them quirky? <br> <br>Now <i>that's</i> a question! <br> <br>Paul wrote about amplifying \"personality\", which is very cool, but that's different than divergence for the sake of readability. But it's very hard to say <i>where</i> divergences should go, and how far. One mainstream way to incorporate divergence is in widths: you'll notice that many good faces have what might seem to be an overly narrow \"s\", \"t\", etc. A less mainstream but still acceptable area of divergence can be the extenders, for example making the tails of the \"j\" and \"y\" very different. Another way is through color (weight), by making some glyphs slightly darker/lighter than the \"norm\" - although this generally imparts a crude feeling, so it has to be done with great subtlety. Beyond that you can start to get pretty deep, like varying serif sizes, the bowls of \"b\"/\"d\"/\"p\"/\"q\" and their relationship to the \"el\" and \"o\", etc. Tricky stuff. But highly magnetic to some of us. <br> <br>hhp</p>"
