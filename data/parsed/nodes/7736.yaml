    <p>Hello! This is my first post, and my first attempt at type design. I am trying to create a text face that could be used in paperback novels or other papers of lesser quality, and is a little different from the usual Garalde faces we see so often in novels nowadays (thus the name). I realise that the "v" is awkward, so just ignore that one for now. All comments are appreciated. <br> <br> <br>Cherry <br></p>
