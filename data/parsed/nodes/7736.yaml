    html: "<p>It looks nice! <br> <br>A few observations: <br>- 'a' is a bit too wide; <br>- serifs are too heavy (they're heavier than the thin parts of the letters); <br>- descender is too long; <br>- the dot on 'i' is too low.</p>"
