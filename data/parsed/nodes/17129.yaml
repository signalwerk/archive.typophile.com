      <p>Calypso is a very pop art font.<br>
      The prominence of the halftone was a device used in the '60s by artists Roy Lichstenstein and Richard Hamilton, among others. Chris is right, the letterforms are a bit cheesy, but that's also pop art territory. The outrageous formal invention is all Excoffon.</p>
