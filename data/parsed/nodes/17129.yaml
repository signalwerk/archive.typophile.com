      <p>When I was in my mid-teens I traveled with a school group to a Inuit community in the Northwest Terriories, (now in Nunavut.) When we found out that "eskimo" means "one who eats raw meat", we asked one of our hosts how he felt about being called eskimo. He said, "Well, we do eat raw meat. Be I prefer 'Inuit'."</p>
      <p>I'll just reiterate here that my objection isn't to the bared breasts, but to the source of the advertising: A German foundry. As a Canadian I am allowed to make fun of my hockey- and curling-loving countrymen, myself included (Go Habs!) and I appreciate the "I am Canadian" ad campaign because it was made by Canadians. I'm pretty sure that the rum ads — for Captain Morgan's Parrot Bay brand — were created by a U.S. ad agency for U.S. consumption.</p>
      <p>Propagate your own stereotypes and myths if you must, but don't do it for other people. That's not being Politcally Correct, it's just being correct.</p>
