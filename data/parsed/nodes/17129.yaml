      <p><em>we got kids in the audience</em></p>
      <p>Do we? I mean, I've never thought about using this kind of advertising either, but I wouldn't say that font-shopping is a universal thing. You need a credit card to buy fonts. How may kids have their own credit cards? (somehow, I'm afraid of the answer here…)</p>
      <p>And moreover, even if there are "kids" in the audience, meaning 13–17 year olds, is it really that bad if they see some partial frontal expose? I mean, they are on the internet and all… it isn't like the real porn isn't hidden away somewhere where they'll never find it. </p>
      <p>I doubt that real children (i.e.,the PG crowd, who do deserve protection) are shopping for anything online, much less fonts.</p>
      <p>Chris: <em>“Babe Glitz"</em><br>
      In Europe, the best selling newspapers are mostly tabloids. I can't speak for the rest of Europe, but Germany's #1 tabloid (<a href="http://www.bild.de" title="www.bild.de">www.bild.de</a>) has a topless girl on the cover (albeit below the fold) five days a week. Don't tell me the PG crowd, or even the G crowd, never sees a paper purchased by 5% of the population daily.</p>
