      <p>Why is showing an Inuit on a Klondike bar racist? Inuit are the major group in the Klondike, so it's representative of the area. What exactly is the evil stereotype? That Inuit wear parkas?</p>
      <p>Likewise, what is the stereotype in the Calypso illustration? That in many Carribean countries, the majority of people are black? Isn't this just fact? Having a white woman there would be like a Quebec tourism ad with English-speakers, when we are only 10% of the province's population and only 25% of Montreal's (even if we're a majority in Westmount).</p>
      <p>Selling a blackletter font with an image of Hitler would be bad because Hitler was evil and killed people. However, if it were to be marketed with images of steins, lederhosen, and sauerkraut - things which are typically german - it might be cheesy, but not racist.</p>
      <p>&gt;My problem is that these rum ads are obviously made by an American ad agency, and there is nothing redeeming about their portrayal of black Caribbeans.</p>
      <p>I don't know which brand you are talking about, but most of them are based in the countries where their product is produced. Anyway, whatever the owners' race or nationality, I wonder why the only way to feature any minority on television is for the portrayal to be "redeeming".</p>
      <p>Let me make a literary connection here. The Apprenticeship of Duddy Kravitz. Is it a book about a greedy jew, or a greedy man of the jewish faith? Anyone who claims that Duddy Kravitz is an anti-semitic story is wrong. Instead, they are projecting their own prejudices and stereotypes onto the story. Nowhere is it implied that Duddy is greedy because he's jewish (I doubt Mordecai Richler, a jew himself, would be a very big anti-semite), and nowhere is Duddy's faith ever connected in any way to his character. Rather, those who claim that it's so have made the connection themselves, either through internalized racism or some other hidden prejudice.</p>
      <p>In the same way, it is <cite>you</cite> who have made the connection between the negative portrayal of <cite>people who happen to be black</cite> and the fact that they are black, when in fact the creator probably had no such connection in mind, but rather was trying to tap into a cheesy image like the one of Curling and Canadians or Lederhosen and Austrians/Germans.</p>
      <p>It is people like you (and I promise you that I am in no way trying to be insulting or accusative when I say this, but merely pointing out an observation) who propagate these stereotypes by insisting that any greedy person on tv or in a book who happens to also be jewish is greedy <cite>because</cite> he's jewish, or that any black person on tv or in a book who falls into some other stereotype does so <cite>because</cite> he is black.</p>
