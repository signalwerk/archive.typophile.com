      <p><em>Why is showing an Inuit on a Klondike bar racist? Inuit are the major group in the Klondike, so it’s representative of the area.</em></p>
      <p>Ahem.The Inuit have never been the major group in the Klondike and there are very few of them living anywhere in the Yukon and, as far as I am aware, there are no longer any specifically Inuit settlements. The Canadian Inuit are concentrated in the other northern territories, and only in Nunavut are they the sole significant aboriginal population.</p>
      <p>In the Yukon, aboriginal groups account for less than 15% of the current population, and almost all of them are indian, not Inuit, most being speakers of one or other of the Athapaskan or Tlingit family of languages. The indian band located in the Klondike region are Han, an Athapaskan group. They are ethnically and linguistically unrelated to Inuit.</p>
