  html: |-
    <p>I've been looking for a Neutraface stencil font. House Industries did a refresh of this typeface but does not include a stencil version. Was one ever made? I was told there was but have not been able to locate it. Apparently, architects favor these stencils and often use the number stencil set on their plans.</p>
    <p>If anyone could point me in a direction, it'd be greatly appreciated.</p>
    <p>Cheers</p>
