  html: |-
    <p>Paul has done a very nice thing with the alternate forms in Tourist Gothic.</p>
    <p>I quote from the read me:<br>
    "Stylistic sets have been designed to use all alternate characters together (set 1), or to apply alternates to one letter (series=all accented variations of that letter) only (sets 2-16)."</p>
    <p>This seems very flexible. Now, if only we had a way for apps to report something meaningful in their UI, rather than just "Set 13"!</p>
