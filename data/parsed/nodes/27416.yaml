      <p>John, thanks for your compliment. I'm glad someone appreciates this typeface. I got this way of thinking from <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a>, when he was talking about his stylistic sets in <a href="http://www.ms-studio.com/FontSales/proximanova.html" rel="nofollow">Proxima Nova</a>.<br>
      Henry, basically what John is saying is that you can apply all the alternates at once or handpick which letters you want to be substituted by their alternates by using <a href="/wiki/stylistic%20sets" class="freelinking" rel="nofollow">stylistic sets</a> when using the <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> version of <a href="http://www.p22.com/lanston/products/touristgothic.html" rel="nofollow">Tourist Gothic</a>.</p>
