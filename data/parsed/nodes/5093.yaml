  - id: 37060
    user: 1250
    date: 2004-08-08T14:58:00
    date_raw: 8 Aug 2004 — 2:58pm
    votes: null
    html: <p>Nice stuff. <br>For the serif version, I think you should try making <i>all</i> the serifs flare out (like you have in the "c" for example). If not, try making them thicker. I think the "reverseness" of the contrast needs to be reflected in the serifs too, somehow. <br> <br>BTW, during the recent type conference in Greece I saw something that made me think of this design, and I've been meaning to let you know about it. It's called Goudald Serif (apparently it's based on Goudy's work), it's by Aldo de Losa of Argentina, and it was made between 1996-99. And now I realize that it's also in tipoGr</p>
  - id: 37061
    user: 1353
    date: 2004-08-09T11:59:00
    date_raw: 9 Aug 2004 — 11:59am
    votes: null
    html: <p>I wonder why did it become so light? <br> <br>Also, regarding the serif version, it seems that the serifs are simple 'add-ons' to your sans version. <br>I think the serifs should be more 'organically' <i>incorporated</i> in the design, they shouldn't be 'add-ons'.</p>
