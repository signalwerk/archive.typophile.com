    html: "<p>This is pretty nice! Besides the flipped contrast, it's also top-heavy, which makes it more unique. And the forms are very warm, but also contemporary. Plus it's slightly dark, which I personally like. <br> <br>The only problems I see: <br>-The trapping in \"w\" and \"y\" doesn't match the rest. <br>-The \"x\" seems off. <br>-The spacing is uneven. <br> <br>For the serif version, consider half-serifs. <br> <br>BTW, besides Olive, check out FF-Balance by Evert Bloemsma. <br> <br>hhp <br></p>"
