  - id: 37047
    user: 1250
    date: 2004-06-06T21:55:00
    date_raw: 6 Jun 2004 — 9:55pm
    votes: null
    html: "<p>Half-serifs: If/when you make a serif version, consider making it similar to FF Avance. <br> <br>Semitic mixing: Arabic and Hebrew [traditionally] have stroke stress opposite to Latin - the horizontals are thicker than the verticals. Since Chile* is like that, it would make for an interesting companion to a Semitic font. <br> <br>* BTW, I don't think the name works - unless I'm missing something. <br> <br>BTW, I think your \"v\", \"w\" and \"y\" should have symmetrical stress, not \"traditional\". <br> <br>hhp <br></p>"
  - id: 37048
    user: 1353
    date: 2004-06-07T12:41:00
    date_raw: 7 Jun 2004 — 12:41pm
    votes: null
    html: "<p>Very nice, Miguel. <br>I'd just say that some round characters (c, e, o) look too dark next to straight ones (n, for example). <br> <br>Hrant: <br>&gt; ...FF Avance. <br> <br>My only complaint with Avance is that it is too dark. I got it from FF some time ago, so I was able to take a closer look. I think the serifs are too heavy. <br> <br> <br>&gt; * BTW, I don't think the name works - unless I'm <br>&gt; missing something. <br> <br>I agree, I don't think it's a good idea to name fonts after your own country.</p>"
  - id: 37049
    user: 1109
    date: 2004-06-07T23:44:00
    date_raw: 7 Jun 2004 — 11:44pm
    votes: null
    html: "<p>\e&gt;Hrand and Eduardo said... <br> <br>* BTW, I don't think the name works - unless I'm missing something. <br>I agree, I don't think it's a good idea to name fonts after your own country. <br> <br>I was talking and discuss with friends, a lot of time, about how to name a font, which kind of words can i use or how much are not good for a typeface, there are all kind of names, city name, but if you ask me..i never knew about a font with the name of a country. <br> <br>This is for the Hrant missing arguments for the name... <br> <br>I think in use Chile for my proyect, is a challenge, because i know that many of the discussions about design here, in Chile, are about identity of our country, there are many people that will be desagree about nemed a font as a country, they can have political or ethic arguments, or just personal thoughts. <br> <br>Name a font just like my country is about that, i like the word, the sound of it a lot, i like the ch starting names, i think it have a commercial potential too, is short, easy to learn, it is my interpretation of the following question..how can be you personal popular culture enviroment interpretation of a useful local press font family? can a font or a group of fonts help to the richness of the culture in your town, better if your town or country have not his own typography tradition?, etc.. <br> <br>It is rude to use the name you think guys?</p>"
