    votes: null
    html: "<p>Pablo: <br> <br> Youre right about the fact in the press and editorial inminent advance, here in latinamerica. <br> <br>_____________________________________________________ <br>Can you post an image or a link to the Andralis family? <br>_____________________________________________________ <br> <br> <br>When i discover the fact that, when start a sans regular font based on vernacular handwriting, i noticed the inverse contrast was the more interesant topic to rescue, because of the heavy weight on the top and base, it can be very necesary on types with no serifs.Looking around for similar proyects like Antique Olive and  FF-Balance (i think Quimera too, but more in a way to revival of Olive, more close in display and decorative function) <br> <br> Now, the fact that really matter to me on this is to search for more ways to make different sans weight unions between letters with no serifs on the base, so this help to union letters on words..thats the relation that Meier discover on Raphael Frank's handwriting. <br> <br>&gt; el estudio de la escritura devanagari <br> <br>I dindt know about this, is very interesting related to the topic about union on the x top base. Devangary and related langages of the world here <br> <br><a href=\"http://www.proel.org/mundo/indoeuro.htm\" target=\"_blank\">http://www.proel.org/mundo/indoeuro.htm</a> <br> <br><a href=\"http://www.sanskritweb.de/sansdocs.htm\" target=\"_blank\">http://www.sanskritweb.de/sansdocs.htm</a> <br> <br>Any relation by origin in the words sanskrit an sansserif <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> ? <br> <br>Now i am surprised about the origin and the importance of this languages on the base in our actual serif readable alphabet. <br> <br> <br>&gt; Half-serifs: If/when you make a serif version, consider making it similar to FF Avance.  <br> <br>Yes, Hrant. Now i understand the relation. <br> <br>mh.</p>"
