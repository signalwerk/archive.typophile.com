    <p>Hello Typophiles, <br> <br>This is the first advance on a proyect called Chile, a family of fonts in the search of an identity on local design. The font is inspired in italics, made by hand by vernacular painters in the popular commerce. The attached pdf pages shows the comparision between the italic a and my regular interpretation of the inverse contrast of italics.  <br> <br>You can take a look here for more chilean handmade italics <br><a href="http://www.tipografia.cl/catalogo/catalogo_muestra/emiliana_muestra.htm" target="_blank">http://www.tipografia.cl/catalogo/catalogo_muestra/emiliana_muestra.htm</a> <br>I notice that the inverted contrast its similar to Antique Olive, so i found very interesting that i dont know about other fonts with invert contrast, working as a text font..? <br> <br>Thanks for your critiques! <br> <br>mh <br> <br></p>
