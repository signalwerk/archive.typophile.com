    <p>I've been wanting for some time to somehow combine my love for movies and posters (ok, I'm also writing my thesis on that subject :), but all that "alternative movie posters" thing seemed too obvious and trendy (many great designs, though). That's when the idea of doing an (educational?) "Who's who in a film crew" poster series came to my mind.</p>
    <p>I remember having lots of discussions with friends, after the credits of a movie rolled, on things like "Well, what does a producer really do in a movie?" - and I didn't really know how to explain it, either. But through some wiki-consulting :) I tried to find what is the core of each profession, and then present it visually, with just a few simple words of explanation...</p>
    <p>There are six posters for now; new ones possibly on the way...<br>
    Would like your feedback on these ones, though. :)</p>
