      <p>Oldnick, Shlain's alphabet/goddess book is a travesty. As the linguist William Bright concluded in his critique of the book at the 1988 Unicode conference keynote: <em>‘Any writing that purports to be non-fiction – whether scholarly books, technical reports, journalism, or business documents – is supposed to meet a basic criterion: You're not allowed to just MAKE IT UP. Shlain's work fails to meet this criterion.’</em></p>
      <p>Bright's full paper is available <a href="http://www.google.ca/url?sa=t&amp;source=web&amp;cd=2&amp;ved=0CB0QFjAB&amp;url=http%3A%2F%2Funicode.org%2Fiuc%2Fiuc17%2Fka%2Fpaper.doc&amp;ei=TK0bTIq8EI7anAewnJS1Cw&amp;usg=AFQjCNEHbRqlAgoS3dV8olyqguvBmTEE3Q&amp;sig2=rOkD-ew9wgRub_D0Omhgrg" rel="nofollow">here</a> [MS Word file].</p>
