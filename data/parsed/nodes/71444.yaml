      <p>Shlain's alphabet/goddess book</p>
      <p>I wouldn't call it a travesty. He presents his thesis: that the introduction of alphabetic literacy causes a temporary cultural emphasis towards left brain thinking. He backs it up with historical observation. The author does not present himself as an expert in the field, but as an amateur philosopher, who has glimpsed a pattern and through the research for the book, has tried to see where his insight leads him. The book is not a scientific work, nor is it presented as such.</p>
