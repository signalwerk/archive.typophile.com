      <p>Copyright.</p>
      <p>For instance, the Worshipful Company of Stationers in the UK was a Royal body that exercised a monopoly over publishing in the UK from before the invention of moveable type until 1709, in practice until the 19th century in England, restricting the number of printers and what might be printed. The powers that be recognized the revolutionary power of the printed word. This made for a dismal, stagnant print culture in the UK, and prior to Caslon, the best types in the UK came from Holland. Caslon made his name making scholarly scripts, not the Latin alphabet. </p>
      <p>The transitional style of typography emerged in Scotland (Baskerville came later), at the Foulis Press, because Scotland put into effect the 1709 repeal of the Company of Stationers' monopoly before the English did, thereby developing a thriving and dynamic publishing industry in the mid 18th century.</p>
      <p>Concerning writing, in the early 19th century the practice of reading was spreading throughout the UK population, but books were still relatively expensive, so many people hand-copied popular novels &amp;c., and circulated them amongst friends.</p>
