      <p><em>He backs it up with historical observation.</em></p>
      <p>No, Shlain backs it his theory with claims about history, linguistics, literacy and neuroscience that are demonstrable <em>not true,</em> poorly understood or willfully misrepresented. In doing so, he also ignores actual socio-economic and other factors affecting the lives of actual women in actual historical and social situations, in favour of his ‘thesis’ that alphabetic literacy is responsible for social inequality of the sexes.</p>
