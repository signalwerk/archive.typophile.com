      <p>Also to consider: the abolition of various publishing taxes (stamp and paper) in England in the 1830s.<br>
      This reduced the selling price of books, and especially newspapers and magazines, boosting circulation and stimulating these as vehicles for the advertising of products such as books, as consumer items. The new magazines were breeding grounds for authors such as Dickens and Thackeray.<br>
