    html: |-
      <blockquote><p>The <strong>category section</strong>  is absent from the new site, by the way, hence the confusion.</p></blockquote>
      <p>fully agreed! The advantage of the category section is that one gets the possibility of accessing the library by <em>visual means</em>. Which on the old site got lost a bit on the second level, because many families appear several times. Also it was not possible to compare weights such as italics, condensed, extended, whatever between families. The FontBook app is better of course, but unfortunately lacks this kind of type browsing. I still miss a digital implementation of a ‘type browser’ like <a href="https://www.flickr.com/photos/kupfers/8571656301/" rel="nofollow">Berthold E3 Headlines</a> or Photolettering’s One Line Manual of Styles. Or Photolettering’s <a href="https://www.flickr.com/photos/nicksherman/8609661427" rel="nofollow">Alphabet Theasaurus</a>. Books like these were rather expensive to produce and for the user, finding the right category was always a bit cumbersome. One had to go through the alphabetical index first or guess in which classification slot a particular typeface could be hiding. And the text in which the typefaces could be compared was of course fixed. This could be made so much better, faster and flexible today, but no one has really managed to come up with something that comes even close to these books.<br>
      I think this could be extremely useful when one is looking for a condensed text typeface for small text on packaging. Or a bold condensed sans for magazine headlines. I think that the lack of this sort of dedicated browsing is one of the reasons that unexperienced designers who are looking for a typeface for a claim or a brand name usually pick a far too informal script instead of an italic. As far as I know, there is simply no web based type browser (my fonts, monotype, linotype, anyone?) that allows a user to fast and easily compare similar italics with each other in the way one can compare scripts …</p>
