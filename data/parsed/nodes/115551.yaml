    html: <p>An interesting tool! Checked <a class="freelinking external" href="http://www.identifont.com/differences?first=DIN&amp;second=DIN+Next&amp;q=Go" rel="nofollow">FF DIN and DIN Next</a> :–) It does not do what I expect from a digital type browser though. As a user, I either think I know what might be similar, or I do not know this yet. As a logical consequence, a digital type browser should primarily be able to show me what it thinks that is similar instead of asking me. In the case of this particular Identifont menue, I’d expect it to work it in a way that when I type / pick a name of a typeface I’d like to see in the left window, Identifont will present a range of fonts that I can klick through in the right window. The name field on top of the right window could be used to  add fonts to Identifont’s choice, so that I can compare my own guess with that of Identifont.</p>
