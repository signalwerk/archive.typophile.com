    html: |-
      <p>Your criteria concerning type browsing are valid and relevant.<br>
      Identifont provides a very 'basic' tool to explain the type differences and it shows rapidly its internal limitations as you pointed it out.</p>
      <p>If you're interesting in comparing the many designs of one single typeface,<br>
      try the <em>Garamond</em> comparing because it allows to witness the proportions:<br>
      <a href="http://www.garamond.culture.fr/en/page/comparing_typefaces" title="http://www.garamond.culture.fr/en/page/comparing_typefaces">http://www.garamond.culture.fr/en/page/comparing_typefaces</a></p>
      <p>Select  two interpretations<br>
      Select the styles (Roman or Italic)<br>
      Click on a specific and idiosyncratic letter from the alphabet (Cf. "a", "e", "P", "6", "9")<br>
      Click on the 'Comparing typefaces' button</p>
      <p>You obtain the template of type comparing.</p>
