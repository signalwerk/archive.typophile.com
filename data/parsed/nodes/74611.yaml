    <p>I've been trying to come up with a logo for a hotel project and am having the worst time trying to create something that matches my hotel vibe.</p>
    <p>I attached my moodboard, sample of directions I was going in.. but none of them have been "winners" and my professor wasn't too excited about any of them (nor was I). </p>
    <p>Also, I really don't want to purchase a font because it's only going to be used for this specific logo, so am trying to find free fonts to create this.</p>
    <p>ANY help would be appreciated, thank you!</p>
