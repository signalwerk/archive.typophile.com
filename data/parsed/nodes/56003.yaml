      <p>Thanks for the feedback.</p>
      <p>Yeah, some problems can't be avoided, following the constraints of the grid.</p>
      <p>You're right, it wouldn't work on a sign, it wasn't really intended to do that either though. It might be a bit too weak in general but I quite liked it being so thin. I have been considering making a few other weights though, which would extend the possible areas where it could be used.</p>
      <p>It works best in printed media and in fairly large point size on screen.</p>
      <p>/A</p>
