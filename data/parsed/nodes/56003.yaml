      <p>It has some interesting shapes. I like the flow of the characters. The z, q &amp; x mess with me, but I see no other alternatives considering the constraints of the design. My biggest problem is, from a sign design stand point, that it is too weak. It would get lost in the negative space from any distance at all. Still looks cool.</p>
      <p>~~~~~~~~~~~~~</p>
