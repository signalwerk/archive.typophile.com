    <p>Hey guys, </p>
    <p>I recently finished a display font. It is called rund which is Swedish for round.<br>
    It is based on 12 circles laid out on a 3x4 grid.</p>
    <p>It comes with a PDF poster that follows a similar 3-column grid, with the main copy laid out as the 3x4 grid used for the font. The color scheme is based on hue increments of 30, going from 0 to 360, thus completing the whole color wheel/circle. </p>
    <p>It is downloadable for free from my site  <a class="freelinking external" href="http://www.andersorrberg.com/index.php?/personal/rund---display-font/" rel="nofollow"> | you can get it here</a></p>
    <p>Let me know what you think.<br>
    Hope you enjoy it.<br>
    /Anders</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rund_1_5483.jpg"></div><p></p>
