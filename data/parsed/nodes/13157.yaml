      <p>It is not so much a bug. There are actually typographic considerations here. Hyphens should break at the end of a line; discretionary hyphens, therefore, can break at the end of line. Em dashes--those long separators that I'm using two hyphens for here--can break at the end of a line or the beginning of the next, as either way would make gramitical and typographic sense. The en dash, which is usually used to mean "to" or "through" in such expressions as "9-5" are set up as non-breaking in InDesign (QuarkXpress as well) so that one doesn't get 5- at the end of a line and 9 by itself at the beginning of the next line.</p>
      <p>I think InDesign needs to add a couple or three keyboard sequences. One would be to have an equivalent of the Quark discretionary line break command. The command allows a line to break (as does discretionary hyphen) but without the hypen. When placed before an en dash, a line could have an en dash at the end or the beginning of the line. Another command to add specifically for the en dash--a breaking en dash. A third might be the flex space command that Quark has. The space is flexible in that any value may be set up for the space in preferences based on, if I remember this correctly, the width as a percentage of an word space. The flex space acts as a word space in that it represents a distinct breaking word space. If a flex space is added to InDesign, you could set it up to have an equivalent value to a thin space. You could then key "word-flex space-en dash-flex space-word." The program then would have the option to break around either end of the en dash. I still think InDesign is far typographically superior to QuarkXpress. But there are a couple of small items that could have been picked up to make life even better in InDesign.</p>
