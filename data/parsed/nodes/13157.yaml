      <p>John, thanks for pointing that out. I'll take another look at the Adobe EULA to get up to speed.</p>
      <p>Charles, I couldn't agree more with what you've said here. I won't presume to speak as a type designer -- the few custom ligs I've drawn involved a lot of anxiety &amp; frustration -- but it can be equally frustrating to find that even with a beautifully drawn font I can't set the copy I need to set.</p>
      <p>I can completely understand the instinct to keep a novice like me (let alone an over-eager beginner) from bungling the good work a type designer has done, but I can't help but think -- perhaps naively -- that once someone has learned enough about this sort of thing to recognize a problem in a font's mentrics or kerning, or to identify a missing glyph, and beyond this to have gained the skills to make these sorts of adjustments, I can't help but think that by this point one would have the respect &amp; restraint to tread carefully.</p>
      <p>As for my current situation, I'm grateful for the suggestions posted here, and those I've gathered from a few other sources, which it appears I'm stuck with at the moment.</p>
      <p>As FontLab 4.6 can't recompile this specific font's kerning feature, and VOLT doesn't like PS outlines, it looks like I'm stuck with fixes and work-arounds. However, if anyone out there knows where to find Adam's post on working around this issue in the archives, please let me know as I'd like to take a look. If I understand correctly, the new FontLab Studio will be able to tackle this task?</p>
      <p>Thanks again for all the input on this topic...</p>
    html_clean: |-
      <p>John, thanks for pointing that out. I'll take another look at the Adobe EULA to get up to speed.</p>
      <p>Charles, I couldn't agree more with what you've said here. I won't presume to speak as a type designer -- the few custom ligs I've drawn involved a lot of anxiety &amp; frustration -- but it can be equally frustrating to find that even with a beautifully drawn font I can't set the copy I need to set.</p>
      <p>I can completely understand the instinct to keep a novice like me (let alone an over-eager beginner) from bungling the good work a type designer has done, but I can't help but think -- perhaps naively -- that once someone has learned enough about this sort of thing to recognize a problem in a font's mentrics or kerning, or to identify a missing glyph, and beyond this to have gained the skills to make these sorts of adjustments, I can't help but think that by this point one would have the respect &amp; restraint to tread carefully.</p>
      <p>As for my current situation, I'm grateful for the suggestions posted here, and those I've gathered from a few other sources, which it appears I'm stuck with at the moment.</p>
      <p>As FontLab 4.6 can't recompile this specific font's kerning feature, and VOLT doesn't like PS outlines, it looks like I'm stuck with fixes and work-arounds. However, if anyone out there knows where to find Adam's post on working around this issue in the archives, please let me know as I'd like to take a look. If I understand correctly, the new FontLab Studio will be able to tackle this task?</p>
      <p>Thanks again for all the input on this topic...</p>
