      <p>By the way, QuarkXPress works similary as far as dashes go. A line will break after an em dash if it has to, but not after an en dash. Quark as a work around for this. The discretionary new line command (command-return) placed after an en dash will allow the line to break after an en dash. I found no equivalent discretionary new line command in InDesign. Also, with the thin spaces around the dash, the entire word including dashes and thin spaces will not break.</p>
      <p>But there may be work around. It’s a little cumbersome. First of all, use an em dash manually condensed 50%. This tricks InDesign into thinking there’s an en dash. Em dashes will break and that includes a 50% condensed em dash. Instead of thin spaces, uses plus kerning around the condensed em dash of 125 units (or whatever kind of spacing you want). That allows the line to break around either side of the fake en dash.</p>
