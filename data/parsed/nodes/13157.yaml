      <p>Jason – yes, I understand. Minion Pro is one of the few OpenType fonts where FontLab 4.6 will not decompile/recompile the Features properly, due to something in the Kern feature. I think what is going on is that one string (one class definition) is too long &amp; the syntax is violated by this truncation, but I’m not sure. Adam of FontLab has suggested a work-around, but it is buried in the Archives somewhere, and as you say, it isn’t simple.</p>
      <p>My solution was to just give up &amp; start to rebuild the kerning – everything will decompile/recompile if you delete the kerning feature &amp; start it over. It is a lot of work, but a font that we can’t add to &amp; modify has no value in our work, which is setting scholarly monographs. There are just too many characters needed (&amp; a few glyphs to boot) that are not in the font. </p>
      <p>As far as the EULA goes, no one should buy any font that does not permit modification for one’s own use. Type designers are not, by in large, type users – as the best of them not only admit but state. One real risk in using OpenType is that more &amp; more, how type works (Features) is being turned over to type designers. If the users of type can't modify these things -- the featues, including kerning, and the character/glyph compliment, other font formats will be preferable.</p>
      <p>The model should be the old one of metal – Thank you Monotype for these nice fonts. What I put in the matrix case is my business.</p>
      <p>Charles</p>
