      <p>I think what I'd do in this situation, esp. if you don't need the traditional em-dash, is to use FontLab to make up an em-dash using the en-dash with sidebearings equal to the thin space you want to use. You now have one character for the dash, &amp; if I understand Thomas, it will behave.</p>
      <p>We routinely remake the emdash in all our fonts to be a dash 3/4 of an em long (i.e., the dash is 750 units on a 1,000 unit em), with left and right sidebearings of 125 units. It looks fine at either the end or begining of a line; the only wrinkle is that I have to make up two- and three-em dashes as well. We make the two- and three-em dashes with no sidebearings, so any longer dashes can be made up from them.</p>
      <p>FWIW</p>
      <p>Charles</p>
