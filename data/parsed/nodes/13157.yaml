      <p>Good points. The way we have our TeX set up, there is a small penalty for breaking after an em-dash (about like an existing hyphen), and a rather larger one for breaking before an em-dash, but the break is allowed.</p>
      <p>For en-dashes, what I think is needed in InDesign is another dialogue box, like the one for hyphens – break only when so many letters or numbers are left up, and so many taken down. For instance, I’d break pp. 192{endash}94n after 192 just about anywhere, esp. when setting footnotes, endnotes or bibliographical material. En-dashes are also used between words sometimes, or in structures like 10 June{endash}12 July 1962. Again, the break should be allowed.</p>
