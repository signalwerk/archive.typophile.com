    <p>Wondering if anyone has come across this. I'm setting a book of letters that is unusual in that it is heavily peppered with dashes and some odd punctuation. Other than this the copy is relatively standard. The strange part is that InDesign is forcing word-breaks in very unhealthy places, and it's doing so without adding hyphens. The pattern seems to be that when a word is followed by {thinspace}{en-dash}{thinspace}, InDesign seems to want to avoid beginning the next line with that en-dash, therefore it's breaking the previous word no matter what (ie: dissipati|on &amp; otherwi-se in the attachment below).</p>
    <p>The real bug is that simply fixing these manually is sometimes introducing additional breaks further into the flow, so it's been a headache trying to remove these.</p>
    <p>Does anyone have any idea why this is happening? And better yet, how to adjust so that it won't happen at all?</p>
    <p>ps. I'm running InDesign CS on Windows XP; the font is Adobe Minion Pro.</p>
