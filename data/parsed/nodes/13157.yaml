      <p>The bug is InDesign's treating the thin space as non-breaking.</p>
      <p>More details: If you place a discretionary hyphen after most dashes &amp; slashes we will do a discretionary break WITHOUT inserting a hyphen.  However, in this case the culprit is actually the thin-spaces -- we treat them as non-breaking and so we get</p>
      <p><code>word thinspace en-dash thinspace word</code></p>
      <p>as a non-breaking sequence.  And adding discretionary hyphens in between doesn't help.  We are considering this a bug for the next version of InDesign.</p>
      <p>The reason we break "anywhere" without adding a hyphen is that we are falling into the "bunch of characters that don't break" code which was designed to handle cases like people typing "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" or URLs or the like.</p>
      <p>Thanks to my colleague Eric Menninga for looking into this.</p>
      <p>T</p>
