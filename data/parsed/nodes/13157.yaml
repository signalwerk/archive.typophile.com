      <p>Thanks to Thomas for specifically describing InD's process here, and to everyone for their input. The issue for me is that I prefer to use thin-spaced en-dashes -- like this* -- for supplementary content, rather than non-spaced em-dashes. Thus, I wasn't speaking to the standard use of en-dashes for number ranges. The book I'm currently setting is absolutely saturated with asides within the narrative, and so InDesign is having a hell of a time figuring out where to break the lines. My concern was simply the way InD was breaking words without hyphenating them, and Thomas' last post describes why this is happening. There are a variety of work-arounds, but it always seems to help me to understand the bug, rather than just swat wildly at it in ignorance.</p>
      <p>* This example obviously uses HTML em-dashes rather than en's, but you get the idea...</p>
