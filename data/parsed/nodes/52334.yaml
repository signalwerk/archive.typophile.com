      <p><strong>Introducing Photofont WebReady</strong><br>
    <em>Use any font on your own website</em></p>
    <p>For Immediate Release<br>
    December 3, 2008</p>
    <p>Port Angeles, WA, USA — December 3, 2008. Fontlab Ltd. announced today the release of Photofont WebReady, a font converter for Mac OS X and Windows that allows users to enhance their web pages with custom fonts of their choice.<br>
    </p><div class="imageWrap"><img src="/files/SnellBlack_3960.jpg"></div><br>
    FontLab’s product and marketing manager Adam Twardoch explains: “Creators of web pages often wish to use custom fonts on their web pages instead of standard fonts such as Verdana, Georgia or Arial. The use of non-standard fonts can dramatically increase the attractivity of a website and help apply corporate branding on the web. However, the traditional way of creating custom website headlines by applying typographic effects to text and saving the result as a PNG or GIF graphic has many disadvantages. The text saved as a graphic is not ‘visible’ to search engines, screen readers or the Find function of the browser; it also does not perform well on small-size screens on mobile phones. However, with Photofont WebReady, you can customize the typographic appearance of your website without sacrificing searchability and standards compliance of your web pages.”<p></p>
    <p>With Photofont WebReady’s flexible Flash®-based solution, compatible with the popular sIFR technology, the headlines on the website can be displayed using any OpenType or TrueType font. Going beyond the capabilities of sIFR, Photofont WebReady can also create dynamic headings using the Photofont® font format. Developed by FontLab, Photofont® brings the beauty of full-color bitmap fonts (with alpha transparency) to print and web. The Photofont WebReady solution is seamless: if a website visitor’s browser does not support Flash® or JavaScript (for example on mobile phones), the visitor will still see the text rendered in the default web font specified by the CSS stylesheet. Also, regardless of the browser used, the text always remains searchable and visible to search engines.<br>
    </p><div class="imageWrap"><img src="/files/Flame_36_3484.jpg"></div><br>
    “People call and write us all the time asking for color fonts. Now they can actually do it,” said Ted Harrison, President of FontLab.<p></p>
    <p>Photofont WebReady retails at US$79.95. For more information visit the Photofont WebReady product page at <a href="http://www.fontlab.com/photofont/webready/" title="http://www.fontlab.com/photofont/webready/">http://www.fontlab.com/photofont/webready/</a> and the Photofont technology page at <a href="http://www.photofont.com/" title="http://www.photofont.com/">http://www.photofont.com/</a></p>
    <p>For a limited period of time (until December 31) Fontlab is offering a 25% discount to readers of Typophile. Just click <a class="freelinking-external" href="http://www.fontlab.com/photofont/webready/">here</a> and use coupon code ZZ1-NE8-W31 for the Windows version or coupon code G16-GW6-3AR for the Macintosh version.</p>
    <p>###</p>
