      <p>Look at the fonts published by Paratype.com<br>
      Several of them are shown at Myfonts.com</p>
      <p>Aleksey Kryukov's Old Standard is a good, free font to refer to for Cyrillic letter forms and encoding.<br>
      <a href="http://www.thessalonica.org.ru/en/fonts.html" title="http://www.thessalonica.org.ru/en/fonts.html">http://www.thessalonica.org.ru/en/fonts.html</a></p>
      <p>Read the Wiki pages on the cyrillic alphabet.</p>
      <p>Get the book "Language Type Culture", read the Zhukov and Yefimov essays in it, and enjoy the specimens of new types!</p>
      <p>See what the Lebedev studio is doing.<br>
      <a href="http://www.artlebedev.com/" title="http://www.artlebedev.com/">http://www.artlebedev.com/</a></p>
