    <p>Hi Everyone! I have an assignment that I hope you can help me with. I’m designing a Lego advertisement billboard which is targetted towards parents about their past interactions with Lego. </p>
    <p>What I need is a typeface that reflects on the 1950’s (Because Lego first began to use plastic injection moulds around this time), however needs to have a friendly, inviting mood. The other problem is that the typeface can’t look too out dated because it’s a billboard for the present time. I’ll bulletpoint things to make it easier: </p>
    <p>- Require a 1950’s typeface<br>
    - The type needs to have an inviting, friendly mood<br>
    - When parents look at this billboard, the typeface should have a nostalgic feel<br>
    - The typeface can’t look too out dated (Sounds like a contradiction - how can it be nostalgic and not look too outdated???) </p>
    <p>It seems like I’m having trouble. I thought about using Comic Sans since it has a kid like feel, however, doesn’t reflect a 50’s feel. </p>
    <p>If anyone has some really good suggestions about choosing a good typeface or anything else, Please post! =)</p>
