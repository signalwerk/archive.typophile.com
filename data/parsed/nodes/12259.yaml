    <p>I really hope I’m posting this in the right place… Well, here goes!</p>
    <p>I need to provide some examples of how certain type faces might be used. I hasten to add that I have little control over which faces they are. Some of them are nice, some are not my favorites. Anyway, what I want to know is: can some of you good people think of any really amazing things that have been done using:</p>
    <p>Futura, Univers 55, Mrs Eaves, Optima, Helvetica Neue Black Extended, VAG rounded or Minion?</p>
    <p>Hmm… An odd collection to be sure.</p>
    <p>Well, let me know if you think of anything. If you provide a link I’d love you forever, but just the info would be good.</p>
    <p>Thanks :)</p>
    <p>—sn0w</p>
