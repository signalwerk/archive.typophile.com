    html: |-
      <p>Looks to me like someone drew a pencil line and then aligned all the characters to that line, regardless of whether they have an optical correction or not. A minor sin compared to dzp's note: where descenders are also placed above the baseline.</p>
      <p>I remember using letraset back in the day, and then they had little lines so that one would align the letters correctly. Perhaps this kit was a clone that does not have that nicety, or the applier just ignored them (possibly not understanding them). "Hey, why should I waste my time reading instructions."</p>
