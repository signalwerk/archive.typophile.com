      <p>Choz, thanks for the reply.<br>
      Reading it, and Eben's five levels, you mention multiplying the exclamation point for increasing volume of exclamation, so perhaps the tilde can be multiplied for varying degrees of irony?!</p>
      <p>The fly turd comment was quite sincere, for which a sincerity mark would have helped, to denote the absence of sarcasm?!:-)<br>
      What I mean is that it is too easy to mistake the tilde for a dash, given the frequency of dashes at the end of sentences, and if that is the case, then the period would be assumed to be an artefact in the paper, the printing, or the said fly dropping. Or possibly a booger courtesy of a previous reader.</p>
      <p>Good point about the happyface emoticon -- it has emerged as a genuine mark, and I will in future font designs consider kerning these characters.~  There, you see, the snark doesn't need a separate code point, because it is quite happy as a composite, like the happyface emoticon.</p>
      <p>On a tangent, in setting the scotch roman mid-19th century, compositors used a triple space between sentences. I've recently been reading a new book set in Bembo with kerning between the space and cap A, V, T, W, and Y, and it's very annoying. Really, I don't see that there's anything fundamentally wrong with a double space between sentences. Typographers today have a notion of spaces that is generally quite rigid and simplistic, compared to how those in the past used a variety of spaces. So a double space after the snark (which is how I set it above) is an option. There is also the custom in many languages (eg French) to insert spacing before the end mark -- actually an English language practice that has died out. It has especial merit where the mark is x-height (ie the colons) and follwing an x-height character. The composite snark may have that kind of a problem, and shouldn't be too close to the word -- another reason to prefer the "arbitrary" snark. </p>
      <p>What was the tipping point that established the happyface emoticon? Hindsight may be able to say, but it's always complex and you can't guarantee results, so all one person can do is push. In the 16th century Trissino advocated the addition of j, u and long o (omega) to the roman alphabet, and much later in the next century two out of three of his reforms had become established. So keep at it (because you never know where things will lead) and I hope the criticism is useful.</p>
