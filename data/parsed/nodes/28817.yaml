      <p>I am going to have to revise what I said before about needing 3 marks. Actually you need five for the 5 levels of irony.</p>
      <p>0 utter earnestness ( no irony )<br>
      e.g., Q: "What do you think of the squash soup?"<br>
      A: "I don't like it."</p>
      <p>1 crude sarcasm<br>
      e.g., Q: "What do you think of the squash soup?"<br>
      A: "Mmmmm ... I loooooove squash soup!!"</p>
      <p>2 refined wittiness<br>
      e.g., Q: "What do you think of the squash soup?"<br>
      A: "Oh goodie ... squash soup!"</p>
      <p>3 subtle misdirection<br>
      e.g., Q: "What do you think of the squash soup?"<br>
      A: "What sort of soup is this again?"</p>
      <p>4 dead-pan mockery<br>
      e.g., Q: "What do you think of the squash soup?"<br>
      A: "Sometimes squash soup can be quite tasty."</p>
      <p>5 utterly earnest acceptance of the world in all its absurdity ( the highest form )<br>
      e.g., Q: "What do you think of the squash soup?"<br>
      A: "I don't like it."</p>
      <p>This level theory of irony was proposal by Art Walaszek sometime around 2000.</p>
      <p>Without indicating which of these you mean you run the risk of making all snarked sentances into level one. Level one irony is next to worthless. Level 5 is one of the highest compliments you can offer.</p>
