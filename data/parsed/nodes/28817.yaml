    html: |-
      <p>Biddy: <em>In body copy, it’s just plain ugly. This mark disturbs the flow of reading with a jarring break in a paragraph.</em><br>
      Is this because it is simply unusual? Is jarring caused by the ugly or vice versa? Any suggestions on design to suit body text? I dunno if emoticons can be made to look good in type. I find them irksome, though unavoidably effective, in even screen-based messages (perhaps  because there are so many variants that I have to decode the ideographic qualities of each).</p>
      <p>Nigella: <em>... One could suppose that’s the real irony here.</em><br>
      Wiki sez: "Irony is a literary or rhetorical device in which there is a gap or incongruity between what a speaker or a writer says, and what is understood." I believe that "incogruity" encompasses the entirety of <a href="http://en.wikipedia.org/wiki/Irony#Verbal_irony" rel="nofollow">sarcasm</a>, which lives alongside many other types of paradoxical absurdist, and metastatic writing. And nothing in Alanis's song. (Someone had to mention it, but why me?)</p>
      <p>----</p>
      <p>The Awesome &amp; Convenient Power of Anecdotal Evidence (<em>this is not science, I know</em>)</p>
      <p>I mentioned the irony mark and discussion to someone typing away on a sidekick today. They were a generation older than what I might have assumed the average text messager's age , but they say they use it constantly with their spouse. During the several-second conversation, their eyes lit up, and they said it made total sense. So, I sum up the survey of 1 whole person as:</p>
      <p>1. they said they thought they would use the idea.<br>
      2. it was nice that the tilde be for something finally.<br>
      3. the best part was that it was simple to use and easy to explain.</p>
      <p>I couldn't have hoped for a better reaction.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
