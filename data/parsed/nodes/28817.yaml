      <p>Yes, either because it was, or because you used the mark incorrectly.</p>
      <p>Now to be completely candid and not ironic in the least. My original, personal motivation to popularize the snark is to, first, preempt the popularization of other alternatives that also (less tastefully) mark the beginning of a sentence or section, and two, see that it looks pleasant, yet practical. As to the details of proper usage, that is all speculated upon previously in this thread. In the end, it is whatever people think it is the most. The lives of the semicolon, the exclamation and even the full stop are not static. The snark is crawling. I hope to be around when it takes its first staggering, bouncy steps.</p>
