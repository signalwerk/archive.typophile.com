    html: |-
      <p>Aside from unofficial concensus, what ways might be a good way to settle amongst the designs here?</p>
      <p>Eben: Whether you, or I, "like it" matters, for the mark is still at a  formative stage. In essence, I am promoting the use the existing tilde for <em>some purpose at all</em>, aside from programming or mathematics, since we are stuck with it in the basic ASCII glyphs forever, and immense hardware and software support. To strengthen it's use, I propose adding the irony mark to typefaces, essentially as a nicer adaptation, where one wants it to look prettier or more flowing. Meanwhile, others are independently developing and applying a similar  mark. That's why I brought it up here, amongst those most likely to care about that component and able to do something about it, before something dorkier is adopted.</p>
      <p>From a digital type vocabulary view, I <em>think</em> I am suggesting support for a unique character that is a ligature of two existing glyphs. I think that the tilde alone(no period) looks awful!) Anyone familiar with Unicode's design philosophy is welcome to correct my description.</p>
      <p>biddy: No. 4 might make a nice fancy alternate, or one of several with the descended tilde in different places? That might be a bit much for now. At the moment, I am leaning towards something along the lines of No. 2, as it seems like (for now) the healthiest compromise of:</p>
      <p>tilde-ness,<br>
      pleasant flow in body copy<br>
      standalone* or end-of-line use<br>
      clarity or legibility from other marks<br>
      adequate visual connotation</p>
      <p>Are there other factors we should consider?</p>
      <p>*I can totally see this mark useful on it's own as a, "Tell me that you are kidding!", "No way-you aren't serious!?", or as an anti-exclamation vibe, in a balloon over a cartoon character's head.<br>
      (P. 1: Jon says something sappy. P. 2: Garfield thinks, ".~")</p>
      <p>Ben (George?)<br>
      <em>There's an "insert image" graphic text below the comment input box, that lets you pick a file from your local computer, then stores it on the Typo...com server and puts a bracketed link to it at the end of whatever you've typed in the comment box. This can then be moved to wherever you want it to appear. The links you put work just fine as well, though.</em></p>
      <p>The proposals you put up look pretty good. It is unambigously not an ellipsis, question mark or other sentence terminator, and the final curl may lead into the next line well. Do you imagine this looking different in seriffed fonts? We should probably examine it in body text, so I think i will doodle a bit on that late tonight. Because the tilde does nothing else that a normal English speaker might come across, I don't suppose having the look of the two overlapping is a bad thing. Plus, the  designs ideas of the existing tilde can be drawn upon.</p>
      <p>"Snark" has been suggested as a 'typographer jargon'-nickname previously by a commenter on Greenman's article suggesting borrowing the inverted exclamation point from Ethiopian script. I think this might be a great primary name, or an endearing pet name. I'm also partial to "Zing". To compare, the forward slash is also known as a solidus, slant, stoke, scratch or any of a handful of other names.</p>
      <p>Geo Ben: <em>it would appear that your idea is growing legs</em></p>
      <p>This is hardly my idea. I drew this most heavily from the proposal by the blogging couple @ liloia.com. I was just motivated to try and pre-empt the masses from any use of a preceeding mark, as that variation galls me so much that it puts me in the camp of the most cynical responses in this thread. Then, I thought, lets all make this look a little better, by involving the both-sides-of-the-brain type gurus here.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
