    <p><a href="http://www.pointdironie.com/" title="http://www.pointdironie.com/">http://www.pointdironie.com/</a></p>
    <p><a href="http://www.slate.com/id/2111172/fr/ifr" title="http://www.slate.com/id/2111172/fr/ifr">http://www.slate.com/id/2111172/fr/ifr</a></p>
    <p><a href="http://blogs.msdn.com/fontblog/archive/2005/12/22/506936.aspx" title="http://blogs.msdn.com/fontblog/archive/2005/12/22/506936.aspx">http://blogs.msdn.com/fontblog/archive/2005/12/22/506936.aspx</a></p>
    <p><a href="http://www.exclamachine.com/snark" title="http://www.exclamachine.com/snark">http://www.exclamachine.com/snark</a></p>
    <p><em>*name proposed by Geo Ben. All those in favor say 'aye.' Good. -Choz </em></p>
