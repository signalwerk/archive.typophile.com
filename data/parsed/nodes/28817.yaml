      <p>I think this is a great idea. I love when a common way of thinking is challenged. </p>
      <p>While I like the idea of this, I think there's one problem with it. In body copy, it's just plain ugly. This mark disturbs the flow of reading with a jarring break in a paragraph. Maybe the mark could go <em>under</em> the last word of the sentence, or <em>above</em> it?</p>
      <p>Mr. Lozos and Ms. Wardle bring up good points about internet communication and using emoticons to describe sarcasm or irony. I find the :) or the :/ to be less jarring when typing a message. Internet emoticons have yet to find their way in "printed" written communication, however. </p>
      <p>Should we then be talking about emoticons as being adopted into written language? Just a thought...</p>
      <p>Let's hope that we'll still be capitalizing words and spelling them completely out. When was the last time anyone saw the word "doughnut" and not "donut" or "drive-through" for example?</p>
