      <p><strong>OpenType (OT) Implementation</strong><br>
      The introduction of OpenType  fonts allows for interesting advanced typographic substitutions to be made while the user is typing, along with many other font refinements. In this case, it can be used to place the snark in easy reach of common users, by “seeing” when they type (period)+(tilde). Adoption of OT is expected to continue to grow.</p>
      <p>The ligature substitution will work, whether the glyph is mapped to any Unicode space, or even named, as long as the character  is included in the font file. IT is called up in any OpenType (OT) font through the use of the  Contextual Ligature feature. This class is currently supported by virtually all design-oriented OT-aware programs. Unlike other ligature substitutions, the  class is specified to default to “on”, meaning the substitution will happen automatically, as the user types. (This can be turned off.)</p>
      <p>Because the feature is watching an atypical character combination, the command is fairly simple to include. Using  VOLT (the Visual OpenType Layout Tool), the substitution mapping is as follows:</p>
      <p><code>Script, Language, Feature<br>
      Latin 	&lt;latn&gt;, Default&lt;dflt&gt;, Contextual Ligatures 	&lt;clig&gt;</code></p>
      <p>A substitution is then added:</p>
      <p><code>glyph#1 glyph#2 -	&gt; glyph#3</code></p>
      <p>“#1” is the number or name of the standard period or full stop.<br>
      “#2” is the number or name of the ascii tilde.<br>
      “#3” is the number or name of the snark.</p>
      <p>Finally, the substitution is dragged to the  feature, tested and shipped. Now, the substitution should be automatic in Adobe’s OpenType-friendly applications and more.</p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
