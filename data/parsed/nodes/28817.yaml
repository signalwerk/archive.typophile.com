      <p>Just a random thought:</p>
      <p>In this age where communication has been dumbed down to chatting we depend so much on emoticons that I think we've lost some of our ability to use words. I'm completely guilty of this myself. I find myself feeling the urge to use emoticons when I write to people just to make sure they know what emotion I'm trying to betray. </p>
      <p>I wonder if we really need an irony mark?</p>
