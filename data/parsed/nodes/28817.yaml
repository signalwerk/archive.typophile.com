      <p>I plan to revise the Irony Mark guide on my site to reflect refinements based on this discussion, as well as update the fonts that already include it. At the <em>very least</em>, I will be shorting the recommended length, and improving white space. Anybody here who contributes will be credited, and I would be happy to begin a linked list of what fonts feature it.</p>
      <p>--</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/altironymarks_5191.jpg"></div><p></p>
      <p>Verdana unsmoothed 12 pt, TNR unsmoothed 14 pt.<br>
      1. Almost original proposal. Tilde scaled 85%w, dropped 2pts.<br>
      2. Colon-like. Tilde scaled 80%, left alignment with period<br>
      3. Dropper. To right of period, scaled 75% (both axes), then rotated right 90° and aligned with period top.<br>
      4. Floater. Full size period, moved into descender and aligned to period right.<br>
      5. Dropped G. Flipped with redraing to incorporate period.</p>
      <p>I am pretty sure I didn't do quite what Biddy was describing in most of these. I suspect that 6 is the most innacurate draft, but anything else I tried looked far too 'heavy' to not impede word flow.</p>
      <p>I like 2. I also like 4, but that might conflict with descending letters. What do the other designers here think?</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
