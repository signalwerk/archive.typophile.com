      <p>I use emoticons because they work. I try not to do it too much, but it is an effective tool. I don't think any written system will every convey all that the spoken word offers, but writing has its own advantages. This just might be something that contributes to helping it do even more. And, it isn't as smarmy as a ;) or a 8-O</p>
      <p>Keep in mind we romaticize the past. Excellent literary works  from the European nobles were written on the backs of an immense illiterate poor class. And while we remeber the genius of works like Star Wars (originals), we forget that 20 craptastic movies came out with glaring ly pointless pulp dialogue those same summers. Speaking of which, Pulp fiction and Memento are pretty recent examples of simplistic speech worked to high effectiveness.</p>
