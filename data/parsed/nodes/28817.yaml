    html: |-
      <p>I'm not holding my breath. I'm singing. Activism in type!</p>
      <p>I don't see the interrobang as being 'ahead' of this character. Its adoption stems from other issues. It offers no communicative value over !?  and/or ?!, and is less clear than either of those, as it removes the inflection that ordering the marks offers, towards being rhetorical or actually a question. Additionally, there are unicode spaces for both, allowing individual glyphs, if a designer prefers. Those preceded the late inclusion of the interrobang. I find it mostly 'cute' but redundant. The comparisons are unfortunate, however, since the purpose of the irony mark isn't to be visually 'smart' (though I think it is), but to convey a new meaning to a sentence, that neither '.' or '~' does.</p>
      <p>The irony mark (in one form) was first suggested in the late 19th cetury, according to the Wiki-p, and recirculated in the late `60s. The interrobang, Martin K. Speckter's 1962 invention,  was, in my opinion, inspired by the comic and newspaper book use of '!?', since the 1920's. I think some of Menken's ideas were better than others. This one keeps popping up.</p>
      <p>Right now, people are beginning to use the tilde, along with lots of other hacks to convey this idea anyway. I'm suggesting standardizing, more than inventing, and inviting others to do so. By "cheating" with OpenType we might expedite adoption.</p>
      <p>If it looks too similar to a point of ellipsis, that sounds important. Any suggestions on improving that? An up-sweep, more curve?</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
