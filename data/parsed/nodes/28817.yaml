      <p>M. Cunningham makes a very good point in the snarks appropriateness in relieving us of the variety of marks used to select text from context  (presumably)to indicate irony. it occurs to me, however, that such usages are usually inline rather than terminal. How would the snark be used in such instances?</p>
      <p>eg: the store advertised a 'free gift' with purchase. (any usage that can be described as both tautological and oxymoronic MUST be ironic, intent notwithstanding).</p>
      <p>geo.</p>
