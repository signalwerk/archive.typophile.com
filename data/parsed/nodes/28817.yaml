      <p>That is a wonderful link! The illustrated sarcastic examples in the orig. post were chosen for their inherent brevity. In this proposal, verbal contradiction as irony, as well as the surreal and tragic are all assumed to be identified with one mark, most likely used at the 'revelation', which may be the end of sentence or passage. This still leaves something for a clever reader or writer to play with, too.</p>
      <p>It could be appropriately used, amongst other places, where one has concocted an entire hoax: Wells's "War of the Worlds", Menken's "Bathtub Hoax", Hendersen's "The Gospel of the Flying Spaghetti Monster", etc. At the very end, after taking in the audience for the entire duration, it could be something of a "gotchya", or escape clause (at the author's discretion, of course).</p>
      <p>Presumably, the most common uses might be in sarcasm's identification, or to denote false innuendo, but I feel there is no limitation to simply that.</p>
      <p>Choz Cunningham<br>
