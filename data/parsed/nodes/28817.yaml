      <p>lysdexia's in love with words, and apparently pays for it!</p>
      <p>This thing with underware indicates, at least to me, that introducing new marks for irony or whatever is a good gimmick that gets some publicity. I guess until the people of letters (not letterforms) really see the need for a new mark we'll just end up with a few useless designs.</p>
      <p>Emoticons were, I think, a bottom up phenomenon that gave us some very exciting and often very funny combinations of quotation marks to represent an array of feelings, situations, states of mind in informal communication. Where are they now? They were reinvented as a series of readymade, and disturbingly unpleasant, cartoons.</p>
      <p>You've probably gathered by now I'm not very keen on the idea of pushing for its use, or including it in fonts. I'm all for the fun of designing and discussing it as if it were something serious!</p>
