      <p>M. Shinn,</p>
      <p>There is much truth in what you say. but.... the matter of what constitues irony has long since been swept from the table, notwithstanding out insistence to the contrary. When you consider that the recognized master of IRONY is Seinfeld ("not that there's anything wrong with that"), we have to accept that we are stuck with sarcasm as irony (As M. Shaw suggests).</p>
      <p>To be honest, I do not believe that I would ever use the snark, but i suspect that many people would find it useful. Real irony being a rather difficult trick to pull off, it would certainly help to have some sorta signpost indicating that one tried. </p>
      <p>But mostly, i was intrigued by the design aspect. We may have little use for fadas and umlauts either, but ...</p>
      <p>And I am learning about glyph design in the process. </p>
      <p>geo.</p>
