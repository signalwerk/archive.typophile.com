      <p>Proposed copy for design recommendation (please comment!):<br>
      ---</p>
      <p><strong>Snark</strong><br>
      A mark used to terminate a statement or passage of verbal irony.</p>
      <p>•	 Unicode:  Private Use Area U+58066 (Hexadecimal $E2D2)</p>
      <p><em>Design:</em> The snark is a ligature of the period and tilde. The dot is centered under the lefthand arc of a condensed swung stroke. The forms of the ligature components closely mimic the original glyphs of the font. If the bottom dot of the question mark and exclamation mark are different from the period, the snark’s bottom dot should match them. The tilde is shortened to 70-90% of its original width. Care should be taken to insure that the tilde’s weight remains appropriate to the typeface, and the question mark’s weight is a good measure.</p>
      <p>Usage Note: Similarly to a question mark, exclamation mark or period, the snark is placed immediately after the last letter of a sentence, and followed by a single space. </p>
      <p><em>Height alignment:</em>  The bottom dot aligns with the lowercase overshoot in round designs and the baseline in square designs. The top of the upper stroke may align with the center bar of the lowercase letters, the x-height, or anywhere in between. There should be space equal to the diameter of the dot between the dot, and the bottom of the top stroke.</p>
      <p><em>Advance width rule: </em>The snark should fit between the width of the question mark and an N-space.</p>
      <p><em>Other Notes:</em>  The snark is inspired by the unofficial French point d’ironie, a reversed question mark proposed in the 19th century. This variant may be possibly preferred for historical typefaces, or as an alternate design.</p>
      <p>Despite the similarity between the French design and the Arabic  question mark (U+1567), a designer should not substitute one for another, as this may cause rendering problems in some applications.</p>
      <p>Should the snark become popular in languages that employ the inverted question mark and exclamation mark, designers may want to include an inverted version, following the conventions of the established marks. The dot should align with the question and exclamation mark’s (now) top dots. Suggested unofficial mapping would be U+58067 (Hex: $E2D3)</p>
      <p>---<br>
      <a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
