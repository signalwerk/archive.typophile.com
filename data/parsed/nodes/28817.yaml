      <p>There is much truth in what you say. but.... the matter of what constitues irony has long since been swept from the table, notwithstanding out insistence to the contrary. When you consider that the recognized master of IRONY is Seinfeld ("not that there's anything wrong with that"), we have to accept that we are stuck with sarcasm as irony (As M. Shaw suggests).</p>
