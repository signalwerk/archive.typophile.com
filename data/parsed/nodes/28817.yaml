      <p>I still remain skeptical but part of the reason for that is I have not had time to really chew on this question &amp; I will not have it for some time. I Do hope you are successful if only because I like the idea of extended expressive possibilities. But really despite all I have read so far I am unconvinced. A tilda might easily be pressed into use here. That might really be enough. But for the sake of looks I think the main thing to avoid is making the mark look too much like an exclaimation or Question mark on it's side. When I look at your icon I keep thinking question mark &amp; it doesn't work for me. A tilda is even and suggests abiguity that needs resolution. In other words it says "Hang on - Reconsider this phrase." Perhaps there should be three kinds of marks short ones for nasty snide snarkyness. Medium ones for run of the mill irony. And long ones for really dry wit. It's a slipperly slope.</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/ironymarks_5692.gif"></div><p></p>
