      <p>Snark</p><div class="imageWrap"><img src="http://typophile.com/files/snarcopy_5636.jpg"></div><br>
      Book Antiqua, 30 point, optical spacing, hyphenated and flushed. The snark is a 30 point period, with a bold 23.pt tilde. A 15 point space was added, to imitate proper spacing. One thing to keep in mind is that the snark is less necessary in the center of body text. The context usually will nornmally make any verbal irony clear. I think it will be most useful in very short strings. For illustrative purposes, however, I've attemped to justify the use by creating verbal irony that may be ambigous without it.<p></p>
