      <p>Nick, you bring a lot of valid and very interesting points up. I am quite fascinated by what you have seriously considered and insightfully explained. My reply is not brief, but I hope it is coherent and interesting to you and others.</p>
      <p>I don't think the the snark is perfect. Nor do I believe I nor any other 'author' of a glyph can have it perfect in advance. Unlike Claudius or Peter, I cannot simply decree its implementation either, so, while it must  be somewhat adequate at 'birth', it must be seeded into the wild, and any success will come paired with an evolutionary change in form or function, through a gradual social process. I anticipate alterations to meaning, use and design. It may become very good at some point.</p>
      <p>A question is as often tonal as it is stressed, with a rising pitch. Either way, I find that both the common P-shaped and the more ornate curvy-z style both imply a pause born of idleness, which is presumably the wait for a response from the listener (or reader, in their head), and is pretty much perfect. Like the period, I would say it does its job very respectably.</p>
      <p>The '!', on the otherhand, I think is rather weak, from a voice-minded view. I tend, when lacking enough, see as an across-the-sentence increase in volume, hardly  prosodic. If  there is enough narrative flow, I may create a more appropriate sound in my head, but that's hardly the mark's doing, and still not prosodic. That's more being used to it than anything, like other reading preferences. I think that if normal writing included double and triple exclamations, a lot more vocal clarity could exist. Also, from an abstract visual design point, I imagine that a dot and asterisk or hash/pound (#) would be more effective at creating the 'Blammo!" tone.</p>
      <p>The slightly controversial ampersand and the downright pointless interrobang are closer examples of questionable ligatures. They offer no great quality over ‘and’ and “!?” They are alternates with advantages that match their drawbacks. At least the “.~” creates new meaning. Unfortunately, the target users will be limited to just that for a time, while the rather literate, and typographers who need this the least (due to historical interest, high literacy, care for sentence construction, value of tradition etc.) will see it as extraneous, until it is unavoidably required in fonts. I just hope there are enough progressive designers to meet the texters in the middle. And if type designers weren’t generally conservative, why would f<em>x</em> ligs still exist in non-decorative faces?</p>
      <p>As far as the snark, I think you are saying it does actually sing a song, just not the right song?</p>
      <p>At this point, the snark is a mark of verbal irony, including but not limited simply to sarcasm. I think you are saying that it isn't appropriate because it visually implies only a sneer, which universally means sarcasm. I wouldn't say so, though wife, however, wishes I felt otherwise, as she takes my most resigned sarcasms as complicity. I am more likely to sneer when using hyperbole or absurd understatement than sarcasm, which would mean the prosodic qualities still will suit the inferred acoustics you describe.</p>
      <p>Also, any verbal irony requires a modulation of speech for effectiveness seems the kind most appropriate to mark in text. To complicate the debate, others seem to adopt different connotations to quite different examples. Previous posters have stated that it reminds them of a wide range, from outright levity to in-joking, ambiguity to scorn. This suggests that they are getting a different image or sound. Since they still find ways to attach it to their models of verbal irony, it is still working, in a way.</p>
      <p>The :) is a humorous mark, and there is already a smiley-face character in ASCII and all its derivatives for it. It is too cute and specific to cover many, many types of humor, coming off as smarmy. The angry mark, I think, is fulfilled by the use of expletives in so many pretty ways. Particularly as participles and interjections, they fulfill this niche well. On the sincerity mark, it would immediately become co-opted as a sarcasm mark, if I can presume the behavior of people. Aside from that, all I can say is that perhaps there should be some more sentence terminals. I haven't the resources to tabulate all of what we say and mean, and the conditions where we do it. That would codify what’s most ambiguous. Until then, I'd say this is a bit arbitrary, but I can cope with that. I consistently see a problem with people using verbal irony in places where it cannot be clear, but they weren't intending ambiguity. So, to me, broken is a good place to fix things. I think this is supported by people trying to use quotes, percent pairs, already-loaded inverted exclamations or questions, technically problematic arabic glyphs, tilde pairs, parenthesized exclamations and/or questions, faux-markup tags, real markup tags, abbreviations, narrative sequences and even hand-drawn solutions to easily convey irony.</p>
      <p>There is some controversy about the terms “Irony” and “Sarcasm”, and what is which. The definitions of both may be changing. This mark cannot resolve that debate, and shouldn’t suffer for it, but unfortunately does. </p>
      <p>Despite the arbitrary method you assign fear to being worthy of characterization, over, say, sincerity, that sounds like one hell of an idea! I’ve been annoyed by the portrayals of fear in written work, from text-like to design-like ends. I would love to see what you come up with, and might just give that a go sometime. And no, I am serious, it is a very weak point of text.</p>
      <p>I am inclined to take any description of a baseline dot, considering its successful use in so many other punctuations, as a fly-turd as simply hyperbolic. Likewise, the other individual component, the swung dash, is not ugly either, though that is subjective, of course. We’ve been moving towards N sized, not M sized, in body-oriented typefaces. I am more than eager to see any revisions you suggest, and very democratic in my consideration. I am sorry if it appears apologetic.~ My goal is to see something beautiful, consistent and practical replace the motley array of marks beginning to be adopted.</p>
      <p>I don’t see the snark as confusing clutter, but as a specialty product, like the pilcrow, section or  Circled R. To be used only when it it appropriate, which is not all irony in all places.</p>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
    html_clean: |-
      <p>Nick, you bring a lot of valid and very interesting points up. I am quite fascinated by what you have seriously considered and insightfully explained. My reply is not brief, but I hope it is coherent and interesting to you and others.</p>
      <p>I don't think the the snark is perfect. Nor do I believe I nor any other 'author' of a glyph can have it perfect in advance. Unlike Claudius or Peter, I cannot simply decree its implementation either, so, while it must  be somewhat adequate at 'birth', it must be seeded into the wild, and any success will come paired with an evolutionary change in form or function, through a gradual social process. I anticipate alterations to meaning, use and design. It may become very good at some point.</p>
      <p>A question is as often tonal as it is stressed, with a rising pitch. Either way, I find that both the common P-shaped and the more ornate curvy-z style both imply a pause born of idleness, which is presumably the wait for a response from the listener (or reader, in their head), and is pretty much perfect. Like the period, I would say it does its job very respectably.</p>
      <p>The '!', on the otherhand, I think is rather weak, from a voice-minded view. I tend, when lacking enough, see as an across-the-sentence increase in volume, hardly  prosodic. If  there is enough narrative flow, I may create a more appropriate sound in my head, but that's hardly the mark's doing, and still not prosodic. That's more being used to it than anything, like other reading preferences. I think that if normal writing included double and triple exclamations, a lot more vocal clarity could exist. Also, from an abstract visual design point, I imagine that a dot and asterisk or hash/pound (#) would be more effective at creating the 'Blammo!" tone.</p>
      <p>The slightly controversial ampersand and the downright pointless interrobang are closer examples of questionable ligatures. They offer no great quality over ‘and’ and “!?” They are alternates with advantages that match their drawbacks. At least the “.~” creates new meaning. Unfortunately, the target users will be limited to just that for a time, while the rather literate, and typographers who need this the least (due to historical interest, high literacy, care for sentence construction, value of tradition etc.) will see it as extraneous, until it is unavoidably required in fonts. I just hope there are enough progressive designers to meet the texters in the middle. And if type designers weren’t generally conservative, why would f<em>x</em> ligs still exist in non-decorative faces?</p>
      <p>As far as the snark, I think you are saying it does actually sing a song, just not the right song?</p>
      <p>At this point, the snark is a mark of verbal irony, including but not limited simply to sarcasm. I think you are saying that it isn't appropriate because it visually implies only a sneer, which universally means sarcasm. I wouldn't say so, though wife, however, wishes I felt otherwise, as she takes my most resigned sarcasms as complicity. I am more likely to sneer when using hyperbole or absurd understatement than sarcasm, which would mean the prosodic qualities still will suit the inferred acoustics you describe.</p>
