      <p>The final word on width lies in the hands of the font designers, but I can imagine the variable widths easily following your suggestion, with the witty, pithy and most tongue-in-cheek typefaces employing a longer variant. (Also, those are less likely to be used in long copy.) It is a slippery slope, indeed. I'll let time do it's magic, once this is off the ground.</p>
      <p>The dot under the stroke is to give a 'completeness of thought' look to sentences terminated with a snark, as well as too make it appear 'official' alongside other sentence termination marks. The QM and the ExM both are modified periods, so it seems suitable that this is as well. The tilde's wavy symmetry is of value for exactly why you describe. There's a reason why I don't suggest any of the other unused accents on a US keyboard. </p>
      <p>You bring interesting thoughts to this, I will be pondering what you say most of the day.</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
