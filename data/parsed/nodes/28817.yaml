      <p>If you have to explain a joke, the joke failed. Explaining that a hurtful comment was intended as humor only increases the hurt, not the humor. Advising the reader that you are be 'being ironic' is rather like removing the petals of the rose to reveal the source of its beauty. </p>
      <p>geo.</p>
