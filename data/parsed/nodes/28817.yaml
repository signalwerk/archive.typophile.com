    html: |-
      <p>The Underware solution places the irony mark in the ASCII Circumflex's position. I don't think that is a good long-term solution, though it certainly makes spreading it easy enough.</p>
      <p>Previously, I had been recommending placing the snark in the Unicode private use area (at E2D2), where it was not too likely too cause problems, and accessing it through OpenType -clig-. This has two drawbacks: possible conflict with other common "add-on" uses of the PUA, and problems encoding the contextual ligation to work when you want it and not other times.</p>
      <p>On the first issue, the snark is very similar to the Medieval Unicode Font Initiative's "Punctus Interrogativus Horizontal Tilde" which they encode @ F1E8. I am tempted to change the recommendation, but our earlier experiments suggest that a "basic" snark's top bar sets best at about 3/4ths the width of the ASCII tilde. Nevertheless, compatibility with MUFI standards may be good.</p>
      <p>-clig-, it turns out, is not the greatest place to offer the .~-to-snark conversion. Even though it is a terminal mark, it is not always followed by space. Sometimes it is followed by a carriage return, and I am sure there are other exceptions. Any thoughts from the othere 'philers on that? A stylistic set perhaps, or in -dlig-? The goal is to offer a painless transition from a dot-tilde to a snark biglyph.</p>
