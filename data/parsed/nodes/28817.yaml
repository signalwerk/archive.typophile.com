      <p>Should I ever again molest an innocent page with a broadnib pen, it would be a torture to the ink, a humilation to the pen, and completely denied by me on any public occasion. All my lettters are drawn directly into a computer, or inked/painted/drawn with a variety of nontraditional media and scanned.</p>
      <p>I have been surfing the net for articles about irony marks, and seeding the idea of the snark. In the proccess, I revisted Kevn Larson's always interesting blog, and he seems aware and supportive of this implementation of an irony mark, since it will offers easy implementation. I have commented on the wikipedia pages for the sarcasm mark (discussion and article) and irony mark (discussion only). </p>
