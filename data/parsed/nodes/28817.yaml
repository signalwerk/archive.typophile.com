      <p>I'm afraid I'm not convinced of the merits of this mark.</p>
      <p>In the first place, semantically, it's confusing, rather than helpful. The reason is that while the two standard "prosodic" marks used in English -- the question and the exclamation point -- indicate a stress both in voice and meaning, the snark does not. It suggests a sneering tone of voice, which is rarely appropriate to irony. In other words, irony requires understatement, eg "They teach you to be a gentleman there". Even sarcasm benefits from understatement. It is up to the reader to determine the degree of sneer in the character's voice, or up to the writer to better express ironic intent.</p>
      <p>To further illustrate this point, why not have a "humorous" mark, to indicate that the author is making a joke? Or an "angry" mark to indicate that the author is pissed off? Or a "sincerity" mark, to indicate that the author really, really means what they're saying -- that would be the opposite of an irony mark, ennit, and surely just as appropriate. I mean, the project seems quite arbitrary if you are attempting to nuance the meaning of text.</p>
      <p>That is why the question mark and the exclamation mark make sense, because they are truly prosodic. The interrobang, too, is prosodic. But the snark is not, except for the special case of sneering sarcasm. A more useful prosodic grammar mark would be "fear", indicating a pathetic whine as in "please don't hurt me".</p>
      <p>In the second place, as a typographic design the tilde+period snark is unsuccessful. It is apologetic and lacks distinction, looking like a wobbly emdash and a fly-turd. That is the interpretation it must elicit, appearing at the end of sentences. By trying to re-use the ascii tilde, the design is compromised. The s-curve idea would be better if applied with purpose, as something with the size and angle of the slash, perhaps. In fact, the original thingy at the top of this thread showed more promise.</p>
      <p>But really, the snark is, grammatically, confusing clutter, no matter how well designed.</p>
