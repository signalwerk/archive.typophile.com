      <p>This is not a meant to be a replacement for the joys of subtlety in conversation. I use it myself, through the '.~' proxy, to add clarity in busy realtime chats. With close friends, one linear dialog may have several concurrent threads (because we both type simultaneously), and the timing of sarcasm may be inadvertantly lost. In a mixed online videogaming team, I may be speaking in a mixed group of long-time, new- and non-friends simultaneously, and it helps all understand more similarly what I am really saying.</p>
      <p>Conversely, I stay in touch with my family via standalone IM and we have yet to have any need for it, even when my sister and I are comparing the finer points of our work in less than enthusiastic terms.</p>
      <p>Suffice to say, if we put it there, it can be used when it suits. And, still, some peole will abuse it.You know the sort: "OMG.~ STFU! LOL!1!! Hi.~ I &lt;3 U.~ Yer smart.~"</p>
      <p>Choz Cunningham<br>
      !Exclamachine Type Foundry<br>
      <a href="http://www.exclamachine.com" title="http://www.exclamachine.com">http://www.exclamachine.com</a></p>
