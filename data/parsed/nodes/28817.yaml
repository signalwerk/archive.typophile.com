      <p></p><div class="imageWrap"><img src="http://typophile.com/files/snarks-of-many-stripesdistressed_5667.jpg"></div><br>
      <em>Found this in an old remnant of a specimen book, conveniently missing the cover and title pages. It looks like we are a season late and a shilling short.</em><p></p>
      <p>&nbsp;<br>
      I think the multi-exclamation and multi-snark are neat ideas, but I don't think semi-formal use is about to change on the exclamation, and it would seem to inconsistent to encourage it on the other. This would suggest that there is still a place for either in casual use. Poetry and comics are some of the limited applications where a need for typographic quality would overlap the highly vocalized stylings that might use it.</p>
      <p>I hypothesise that the fly-turd effect is simply from a shortage of well kerned examples of the snark, added to its unfamiliary. I imagine it living side-by-side with the "franken-"snark: ".~" for quite some time. By the time support is common enough, it will be familiar. As for the kerning; hey, it's at version .3 beta right now!</p>
      <p>I really would suggest that people play with the bearings and arrangement when adding the mark. Particularly in its infancy, it needs to be a beautiful and readable improvement ofver ".~", or who would care?</p>
      <p>Re-reading my last post, I was a bit harsh in lamenting the use of quotes. They are very good for ironic intra-sentence use. They are also well established, even referred to back in vocal irony. Unfortunately, they are used at the full sentence level in some places online. Ugh. The rest of the mix is also used at the full sentence level, a lot of them at the beginning (as part of a pair) as well as at the end.</p>
      <p><strong>Perhaps</strong> there need not be a separate code spot altogether for the snark. I think it looks "just okay" in a few fonts, where the tilde sits around the x-height. In ones where it sits at the M-height, or higher, it looks bad (for making a snark). Others may disagree, but the look of ".~" in several common screen fonts bugs me. Typophile's default font does a better job than most.</p>
      <p>The illustration above shows that there is a lot of range in what the snark could become in different fonts, and those were just ideas from one noggin. I plan to have a contest soon to promote the idea, tageting traditional illustrative artists. And this may spawn even more variations within the basic idea, inspiring us.</p>
      <p>I wonder how Trissino would have promoted his ideas today. Aside from open design discussion here, and practicing it in my own fonts, naturally, I am considering an emailing campaign (real mail, not spam, to relevant outlets), contests, clothing and any ideas anyone offers that sound not-too-impossible. Suggestions?</p>
      <p>Here is something just to muse:</p>
      <ul>e.g., Q: “What do you think of the squash soup???”</ul>
      <ul>A: “Squash soup!!! I don’t like it.~.~.~”</ul>
      <p><a href="http://www.chozcunningham.com" rel="nofollow">Choz Cunningham</a><br>
      <a href="http://www.exclamchine.com" rel="nofollow">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark" rel="nofollow">The Snark</a></p>
