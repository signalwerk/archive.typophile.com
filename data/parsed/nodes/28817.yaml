  - id: 162595
    user: 14556
    date: 2006-10-14T15:40:00
    date_raw: 14 Oct 2006 — 3:40pm
    votes: null
    html: <p>At display sizes or at the end of a line I don't think it would be easily mistaken, but in an extended body of text it would resemble an ellipsis in quick reading, as it presents similar color and spacing issues. Overemphasising the uptick of the baseline tilde could get the form interpreted as a sideways question mark instead of a sideways exclamation point. Keeping the whole assemblage longer than an ellipsis in the same font might limit the confusion, but present more spacing issues. Both seem to visually indicate a verbal hesitation or sustained fade, and that's not always intended in an ironic comment.</p>
