    html: |-
      <p>Would that it was so simple as picking a typeface.  Letters in a typeface are what they are to be used in many combinations with all sorts of text.  To make this possible, they are designed to be agreeable with many different neighbors.  A logo has only one pair of neighbors and must send one message above all others.  This means much more is involved.  Start by playing with many fonts in the required letters and see what interactions take place with that finite set of letters.</p>
      <p>ChrisL</p>
