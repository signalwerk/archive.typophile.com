    html: |-
      <p>“designed to be agreeable with many different neighbors”</p>
      <p>By this I mean that each letter in a typeface must be able to be used next to every other letter.  Some languages may have different combinations than others but  generally, there must be allowance for all letters working together.  In a logo, there are only a few letters.  If you look at IBM, for example, there are only 3 and only one combination.  Since that is true, I would not have to be concerned with how those letters work with anything other than I or B or M and therefore have more freedom with them but I aalso have less material to carry the message.</p>
      <p>ChrisL</p>
    html_clean: |-
