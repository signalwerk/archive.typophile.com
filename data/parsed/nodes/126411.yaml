    html: |-
      <p>Your sample is made from a lettering plate in Otto Heim's book "Farbige Alphabete"<br>
      It does not have a name - the book dates from 1925. The whole plate is reproduced in "DECO<br>
      TYPE, Stylish Alphabets of the '20s &amp;'30s" by Steven Heller  &amp; Louise Fili on page 73</p>
