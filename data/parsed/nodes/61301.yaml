    <p>I know there are plenty of superfamilies that have a serif and sans version, but I was wondering if there are any serif families that were designed or developed similar to Univers. Not that they would necessarily go well with Univers, but they would have the 20+ widths/weights and italics system.</p>
    <p>Are there serif faces with 20+ widths and weights (and italics)?</p>
    <p>Does a thin ultra condensed or extra black extended serif exist?</p>
