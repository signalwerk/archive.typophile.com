      <p>Font Bureau has been in the habit of making extensive width+weight ranges in many of its serif display families. You won't find the kind of extremes as in Univers, and especially not the more Extended widths. </p>
      <p>Examples include:</p>
      <p><strong><a class="freelinking external" href="http://www.fontbureau.com/fonts/BentonModernDisplay" rel="nofollow">Benton Modern Display</a></strong> -- 4 widths in 4 weights, plus 2 heavier weights in normal width<br>
      <strong><a class="freelinking external" href="http://www.fontbureau.com/fonts/Escrow" rel="nofollow">Escrow</a></strong> -- 3 widths in 5 weights (except only 4 weights in compressed width)<br>
      <strong><a class="freelinking external" href="http://www.fontbureau.com/fonts/ModernoFB" rel="nofollow">FB Moderno</a></strong> -- 4 widths in 4 weights<br>
      <strong><a class="freelinking external" href="http://www.fontbureau.com/fonts/Rocky" rel="nofollow">Rocky</a></strong> -- 4 widths in 4 weights</p>
      <p>All of the above examples include italics for all styles.</p>
      <p><strong><a class="freelinking external" href="http://www.fontbureau.com/fonts/WhitmanDisplay" rel="nofollow">Whitman Display</a></strong> has 3 widths in 7 weights, but italics only in the normal width. (See also this <a class="freelinking external" href="http://www.kentlew.com/WhitmDisMap.html" rel="nofollow">style map</a>.)</p>
      <p>The astute observer will notice that all of these fall more or less into the Modern genre, which is more amenable to this kind of range treatment.</p>
