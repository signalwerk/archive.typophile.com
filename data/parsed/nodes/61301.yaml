      <p>Thank you all for so much good information.</p>
      <p>@ Florian: URW Antiqua caught my eye. The whole URW Antiqua and URW Egyptienne volume seemed like a very nice deal for the wide range of fonts in each family.</p>
      <p>@ Nick: I really enjoy Beaufort. Too bad you aren't making Pro versions of the other 20 fonts. Are the Pro versions and regular versions of the normal width interchangeable? If someone were to get the regular version, set something, and then later on get the Pro version, could they replace it without displacing the copy?<br>
      Also, where would I find McGrew?</p>
      <p>@ Kent: Rocky was news to me! I enjoy that face a lot. I've always wanted to see Latins that weren't as narrow as Birch or as extended as Wide Latin. Whitman Display's style map was also very helpful.</p>
      <p>@ Aa: I enjoy Minion and Warnock Pro (see avatar) and I love Warnock's optical sizes (caption, subhead, display) but they don't have the variety of widths I'm curious about.</p>
      <p>@ Christopher: Starling's heavier weights and italics are nice. Must be nice to design type AND and a be a playboy sailor...</p>
      <p>@ Bert: I feel like I find more fonts in the Thesis family every day. Did he make them all at once, or has he just been making them for a long time? Are there different widths of TheSerif?</p>
      <p>I suppose all this info leads me to another question: Did Frutiger use the numeral naming system on any serif faces, or have other designers? As far as available widths, URW Antiqua and Beaufort really impressed me. </p>
      <p>Any faces with more widths than the ones already mentioned?</p>
      <p>I understand serifs don't usually withstand the thin ultra condensed and extra black extended treatment, so lately I've been interested to see some. Thanks again for the responses. Apologies for the flurry of @.</p>
