      <p>Hi Aaron,<br>
      yes, there are a few.<br>
      The most obvious candidate would be URW Egyptienne, an expanded version of <a href="/wiki/Adrian%20Frutiger" class="freelinking" rel="nofollow">Frutiger</a>’s Serifa. AFAIK, this slab serif has 25 styles (widths + weights), each with obliques. The family ranges from Extralight Extranarrow to Extrawide Bold. Both extrema can’t compete with sans systems like <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a>.</p>
      <p>URW Antiqua by <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> – not a slab – has ~30 styles (excluding Outline styles), plus another ~30 italics (most – but not all – of them actually obliques). The narrowest weight is Regular Condensed, while the widest is Ultrabold Extrawide. There’s also a Super: darker, but not expanded.</p>
      <p>Note that for serif typefaces, traditionally and intrinsically, there are aspects that are considered more important than sheer weight count. <a href="/wiki/Optical%20Size" class="freelinking" rel="nofollow">Optical sizes</a>, for instance. Or <a href="http://www.typography.com/ask/recentTopic.php?rtID=89" rel="nofollow">grades</a>. Or <a href="http://www.teff.nl/fonts/ruse/" rel="nofollow">contrast</a>. In case you’re looking for records, note that <a href="/wiki/Multiple%20Master" class="freelinking" rel="nofollow">Multiple Master</a> typefaces let you generate an infinite number of styles, if you want to.<br>
      F</p>
