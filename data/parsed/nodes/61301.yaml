      <p>David Berlow used a numbering system for Font Bureau's <a class="freelinking external" href="http://www.fontbureau.com/fonts/Giza/styles" rel="nofollow">Giza</a>. </p>
      <p>First digit is weight (larger number = heavier) and second digit is width (larger number = wider).</p>
      <p>Actually it's quite convoluted to follow. The confusion was compounded by the fact that the numbering system for FB's Bureau Grotesque was the opposite of Giza (width first, then weight) -- although that family has now been superceded by the expanded Bureau Grot, with more typical designations for weight and width.</p>
      <p>The Giza styles were developed piecemeal for clients and so not all points in the grid are covered.</p>
