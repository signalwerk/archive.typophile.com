    <p>The type community has a variety of means for testing characters - pangrams, brute force testing, language based character frequency lists ( and words ), all of which are good, but I may have thought of another wrinkle. No doubt others have preceded me if it's a good idea (or perhaps it's a silly one), but in any event: </p>
    <p>What do you think of making a shared Unicode text file that has words made to highlight a glyph in use? It's purpose could extend to kerning etc but the emphasis I want to give the list is aesthtic and and to a certain extent cultural and linguistic. </p>
    <p>So for example for C, I think Cancer &amp; CANCER are quite good. These two forms of the word seem like an elegant and concise way of examining if you like the way the C &amp; c in your font looks. For Cap W I think WAVE, Wave, LAWYER, Lawyer would be good ones to use. The idea being that when a glyph has cases where it fits well and also where it sometimes fits poorly ideally they should both be presented. It would probably be good to have 3-5 words in each case to allow for a variety of aesthetic issues and combinational issues like double letters, round vs. flat neighbor glyphs and position in the word as well. So for C again maybe we would have cc: (the contaction), PINOCCHIO, Pinocchio,  as well as a word with c At the end like ZINC, Zinc. And maybe one or two more.</p>
    <p>The real reason I started thinking like this has nothing to do the glyphs used in English. Instead, I started thinking about this when I was looking at glyphs whose diacritics seemed especially aesthetically challenging because of their novelty. And what I wanted to see was a word that used them so I could start to build aesthetic context. Of course it would be good to have samples of the glyphs in use to look at too but what I want to have words which highlight the aesthetic concerns for glyphs like:  ẗ, ť, ǻ Ǻ and ď etc. Ideally someone from or well versed in the cuture or cultures that use the glyph would give the examples. </p>
    <p>Let me know if these last glyphs don't render for you. They were: latin small letter t with diaeresis,  latin small letter t with caron, latin small letter a with ring above and acute, latin capital letter a with ring above and acute, and latin small letter d with caron.</p>
    <p>Does something like this exist already? </p>
    <p>Obviously there is </p>
    <p><a href="http://diacritics.typo.cz/" title="http://diacritics.typo.cz/">http://diacritics.typo.cz/</a><br>
    and<br>
    <a href="http://diacritics.typo.cz/index.php?id=10" title="http://diacritics.typo.cz/index.php?id=10">http://diacritics.typo.cz/index.php?id=10</a></p>
    <p>Which will continue to improve (and provide in-use examples) which is excellent!</p>
    <p>But for the purposes of testing my fonts I would like to go further and have a text file like the one I have described as well!</p>
    <p>What do you think?</p>
