      <p>Eben, the zdot will appear in Polish close to i in quite a few words, so IMO it looks like a mistake to have it lower than the i dot. And when you get into Celtic....</p>
      <p>As a principle, I'd say it's OK to have umlaut dot accents a tad lower than the i dot, if they're also smaller, and because they're two of them. But really, the dot on the eye IS an accent (note Turkish), so it should be treated consistently.</p>
