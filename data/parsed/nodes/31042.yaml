      <p>Tiffany Wardle mentioned that she tries setting her full name in the type as a test, not out of vanity, because it shows how the characters work. </p>
      <p>Generalizing this, I find that a good aesthetic test is to set proper names in the type, perferably somebody you know and respect, either current or historical. </p>
      <p>Somehow the emotional weight of a proper name, and thinking of it on a letter head or sign makes the success or failure of the glyphs more obvious.</p>
