      <p>Well, I don't know. To me it's important to put a letter between both straight and round letters to see how it relates. You can use all kinds of words for the goal here, like 'rhythm' and 'color' and 'notan', but this is all about getting the letters to work together. To me there's an additional 'pizzaz' factor, which is that it doesn't only work, but brings some beauty or excitement or authority to the words. </p>
      <p>I switch back and forth between faces, comparing the same name in the Preview Panel in my typeface and in other type faces I admire. This is a humbling experience!  When mine starts to look better to me, in some respects anyway, I figure I'm getting somewhere.</p>
