      <p>It is a stop-gap in some sense yes, to be sure. I see your point I think. More rez more subtlty and less being forced. That's true up to a point. But even if you magically get a device with greater rez than paper - ( say what? - it's just an agrgument - hang in there ) the deeper tension between elements is going to remain. 300+dpi can't make things 'even'. Why? </p>
      <p>If you know your going to carry umlauts in your design it's good to know that from the beginning. If you have a Finnish audience in mind specifically then it's good to know that too. And so on. Think about this : it has been noted that type made for german looks better in german &amp; type made for latin in latin. It's true. There are real reasons for this. Lots of them. All the little details! They all interact. Plus the pattens and habits seen in the language/s supported must be factored in and in that a balance has to be struck. So type made specifically for say Danish if it's well made will express itself in the context of Danish needs and priorities and will look and 'act' differently than one made for English. That is why you have to design for a specific set of circumstances every time. </p>
      <p>Think about a custom shoe vs a really well designed shoe made for the masses. They will both have alot in common, and might both be plenty good but if the level of quality is the same something made to fit youspecifically will always 'suit you' better.</p>
