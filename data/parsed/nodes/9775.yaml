  html: <p> I purchased Futura today from Creative Alliance, because it was needed for an assignment (otherwise I have used Futura only once or twice since the late 80s). <br> <br>Can anyone explain why the Heavy face is slightly condensed? If you inspect the UC O it is not perfectly circular. All other weights are. <br> <br>Soren </p>
