    html: "<p>Soren, <br> <br>Let me commend you on your abstinence from Futura. It's a *parody* of a typeface, and I don't care how many graphic designers would blacklist me for saying that. You can make all the lines &amp; circles you want, just don't pretend it's an adequate way of making letters, and least of all *words*. Try setting \"tobacco\" in Futura and see what you get... <br> <br>There's a variant of Futura called \"Steile\" (you know, the one everybody and their mother is reviving now), and here's something I just whipped up in its \"honor\": <br> <br><a href=\"http://www.themicrofoundry.com/other/steile.gif\" target=\"_top\">http://www.themicrofoundry.com/other/steile.gif</a> <br> <br>hhp</p>"
    html_clean: "<p>Soren, <br> <br>Let me commend you on your abstinence from Futura. It's a *parody* of a typeface, and I don't care how many graphic designers would blacklist me for saying that. You can make all the lines &amp; circles you want, just don't pretend it's an adequate way of making letters, and least of all *words*. Try setting \"tobacco\" in Futura and see what you get... <br> <br>There's a variant of Futura called \"Steile\" (you know, the one everybody and their mother is reviving now), and here's something I just whipped up in its \"honor\": <br> <br><a href=\"http://www.themicrofoundry.com/other/steile.gif\" target=\"_top\" class=\"link-external\">http://www.themicrofoundry.com/other/steile.gif</a> <br> <br>hhp</p>"
  - id: 62341
    user: 518
    date: 2001-05-30T00:43:00
    date_raw: 30 May 2001 — 12:43am
    votes: null
    html: "<p> Hrant, <br> <br>I partially agree with you. You would be right if you said that Futura is unsuitable for making *sentences*. As for *words*, I haven't tried to set \"tobacco\" but I know some very nice typographic arrangements of Futura (eps light weights). One example of that could be (Denmark's only world-wide recognized graphic designer) poster artist Per Arnoldi.  <br> <br>Arnoldi uses one trick: Primary colours, simple geometric shapes, Futura light, and creativity. All Bauhaus, of course - but it still works. And Futura works. And he is able to pay the rent, just making posters! Take a look: www3.famille.ne.jp/~poster-m/perarn.html <br> <br>I may be indisposed on this matter, as I graduated in 86, when the mere sight of Futura Light sent me into drool mode ;-) <br> <br>Soren </p>"
    html_clean: "<p> Hrant, <br> <br>I partially agree with you. You would be right if you said that Futura is unsuitable for making *sentences*. As for *words*, I haven't tried to set \"tobacco\" but I know some very nice typographic arrangements of Futura (eps light weights). One example of that could be (Denmark's only world-wide recognized graphic designer) poster artist Per Arnoldi.  <br> <br>Arnoldi uses one trick: Primary colours, simple geometric shapes, Futura light, and creativity. All Bauhaus, of course - but it still works. And Futura works. And he is able to pay the rent, just making posters! Take a look: www3.famille.ne.jp/~poster-m/perarn.html <br> <br>I may be indisposed on this matter, as I graduated in 86, when the mere sight of Futura Light sent me into drool mode ;-) <br> <br>Soren </p>"
