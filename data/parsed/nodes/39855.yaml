      <p><cite>Just a general observation: Most book (interior) designers pick the text font first, and get that to look right.</cite></p>
      <p>Not so. I design illustrated books, mostly art books and cookbooks and am often required to do the cover before I design the interior. So frequently I know my display or headline font before I have settled on a text face. I am also often using more than one font: one for body copy, another for captions, sidebar elements, etc. It sounds like Sumila's project is more in this vein. </p>
      <p>For trade book design, the interior and cover are often designed separately and there I agree with Charles that the text face is the most important choice.</p>
      <p><cite>Frequently, they are given a characters-per-page specification</cite></p>
      <p>I more often deal with words/page. Although that number isn't given to me, it's something I need to figure out based on word count, page count, number of pix and approx. sizes.</p>
      <p>I agree that you MUST print the pages out and cut them down before you have committed to your font choices, you really can't judge by the computer screen. For example, I have to view a page at 137% in order to see the text at actual size. You probably do too if you have a newish computer.</p>
