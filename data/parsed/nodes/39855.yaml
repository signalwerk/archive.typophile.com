      <p>Jim -- One of the unique things about the golden ratio is that it is essentially the same going each way. The ratio of long to short is 1.618; conversely the ratio of short to long is 0.618. (Rounded off, of course.)</p>
      <p>So, you and Charles are both correct.</p>
      <p>-- K.</p>
