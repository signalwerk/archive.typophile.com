    html: |-
      <p>Just a general observation: Most book (interior) designers pick the text font first, and get that to look right.</p>
      <p>This is not simple. Usually, the designer is given the trim size (must be 6-1/8 x 9-1/4 inches, for example). Frequently, they are given a characters-per-page specification. With a 6x9 trim, you are likely to see the  2,800 character number, but sometimes it is 2,900, and I've seen as high as 3,200 or as few as 2,000.</p>
      <p>And you must have margins. You are designing a page -- actually, a pair of pages, with the mechanical intervention of the binding. While old-school, a 26 pica measure with a 42-pica depth (for 6x9) is both traditional, and follows the old golden ratio to 1 to .618. Shorter measures are OK, but remember that regular, even wordspacing is by in large determined by the number of words on a line. The number of words determines how many wordspaces, and wordspaces are the best place to vary for justification.</p>
      <p>One thing I still do is to print out the pages on the laser printer, cut them to final size, and slip them into a book to see how it is all working. You would be surprised to see how much the extra white space on an 8.5x11 sheet (or worse, the computer monitor) throws off your eye.</p>
      <p>Obviously you have some idea of the display face when you pick the text, but usually the text font is the most important design choice. Once the text is working, it is time to finalize &amp; maybe change your thinking about the display face.</p>
      <p>Why all this? Books are meant to be read; the audience will spend many more hours with the text type than with the display type. This is different from book JACKET design, poster design, or advertising design.</p>
      <p>Which may explain why there are so few good designers  of book interiors -- it isn't terribly exciting, just a lot of work requiring a good eye.</p>
