      <p>Any grotesque sans would match, as that is the comparable 19th century style.<br>
      So Arial or Helvetica would be fine, although Arial is not really a display face.</p>
      <p>For a serif text face, a Scotch (another 19th century genre) would work, so Georgia.</p>
      <p>You don't have to buy those faces, as they are likely on your school computers.</p>
      <p>In general, I would recommend the principle of historical allusion, i.e. matching types designed in the same era, because they tend to have an inherent harmony of shape.</p>
