    <p>Hi!</p>
    <p>I’m trying to track down this font (script) even though I think it may be a custom font. The closest I could find was Dear Sarah but that is more oblique/slanted than I would like. Any recommendations for other typefaces with this organic/handcrafted type of feel? I have looked at the following: Olduval, Galahad, Baker Script, Modern Blues, Sunshine and Tree. Basically, I am looking for a font to serve as a starting point for a logo for a handmade jewelery (beads, etc.) company.</p>
    <p>Thanks so much!</p>
    <p>Josh</p>
