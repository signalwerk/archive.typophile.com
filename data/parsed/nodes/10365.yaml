  html: "<p>Hi, I've haunted these halls (off and on) for over two years now without posting...sorry. I have a good deal of respect for most of you and must thank you for the knowledge you make available.  <br> <br>Here's a link to some of my stuff: <br><a href=\"http://natenielson.com/type/type.html\" target=\"_blank\">http://natenielson.com/type/type.html</a> <br> <br>Most are, well, crappy but some are pretty mediocre if I do say-so myself. If you can bring yourself to critique something I'll be pleased. If you can say even more, I'll be happy. And if you're harsh, I'll be overjoyed. <br> <br>nate</p>"
