    html: <p>I like to think of myself as an illustrator, but all my sketchbooks from the past year or so are filled with letterforms! Hah! <br> <br>I never consciously thought, "i'm gunna make a font." It's been  as if something possessed me, whether I liked it or not. So having been a designer (with an MFA no less) and never studied type, what could I do?... Haunt, and try to apply what I learned. <br> <br>So this is what I have to show after a year. Don't ask me where I got the nerve to post 'em though. <br> <br>nate</p>
