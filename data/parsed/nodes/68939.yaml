      <p>It's not a coincidence.<br>
      Sveinn's E, for instance, is a novel idea, quite unlike any character in the runic faces.<br>
      It's a Runic "F" with an extra bar; however, the usual Runic "E" looks like M.<br>
      Check out the alphabets on the Rune Wiki, you will find no glyph like it.<br>
      <a href="http://en.wikipedia.org/wiki/Runic_alphabet" title="http://en.wikipedia.org/wiki/Runic_alphabet">http://en.wikipedia.org/wiki/Runic_alphabet</a></p>
      <p>Having said that, It looks like general inspiration and some copied letter forms, with a grunge finish; a lot worse has been done.<br>
      In fact, the overlapping strokes of "ingwaz" (O) have been applied to B in the derivative font, something which Sveinn didn't do.</p>
      <p>(Hope I've got this right. Not a Rune scholar!)</p>
      <p>Also, has this supposedly derivative font been published, or just used privately to create artwork?</p>
