    html: |-
      <p>Yes, I honestly think it's a coincidence. Sometimes font design under strict limitations produces similar results. Try making a geometric font out of circles. You have to try really hard not to end up with Avant Garde Gothic. When you start dealing with pure geometry you always going to get something similar to something that's already been made. </p>
      <p>If you set up a grid for this, of course you're going to make it an odd number vertically so you something like a D or S crosses in the middle. The grid would most likely be the same if I were to make a Romanized runic font. Then you're going to try to let the lines pop into 45 degree angles as much as possible.</p>
      <p><em>Now why would he/she use the same grid as I did for all the characters that look exactly the same, and then throw it away for just few others?</em></p>
      <p>In my opinion, that's what you're "supposed" to do when you make a modular font. You make it modular but then you do things to it after to make it look more interesting, less modular. In this case, it's supposed to look hand drawn . . . or kind of ancient or something. So you'd should deliberately go off grid. If you were trying to make something that was drawn by a computer plotter, then you'd want to always stay on grid. From the looks of it, it wouldn't surprise me if it wasn't a runic font that was scanned in from a book and altered to look Romanized . . . I only say that because of the weight variation, perhaps it comes from different sample sizes, scaled to look the same Also consider: maybe the grid was twice as fine and the designer was sticking to every second square except in cases where something else was needed, like the cool little crossover on the B.</p>
