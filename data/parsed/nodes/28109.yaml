      <p>Thanks William Berkson, OCRK is indeed the answer, and available from MyFonts!</p>
      <p>Re health coverage, I’m deciding in the coming months whether to move from HIP Prime for $418 a month, with lower co-pays and lower prescription drugs rates through the mail, accessed by membership in a nonprofit association, New York Artist’s Equity, for $75/year membership, OR go through the anal-retentive hassles required by the Freelancers Union, including having two or more of your *clients* fill out forms...$287 a month, but with higher co-pays and higher drug costs, etc. The Freelancers Union is absurdly complicated in its requirements...you must *prove* that you are a freelancer...whereas nobody cares when you join a nonprofit trade association to get an HMO.</p>
