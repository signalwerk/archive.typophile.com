      <p>$418 vs $287?</p>
      <p>A month?</p>
      <p>Wow!  I’m glad I moved back to Canada.  Even here in “pay your own way” Alberta, we shell out $123 a month.  </p>
      <p>For two of us.  </p>
      <p>That includes things like drugs (there is a small co-pay, but we get $125/quarter back), ambulance, psychotherapy, physio, and a bunch of other stuff.</p>
      <p>If we wanted the whole dental et al, we’d pay another $100 a month for both of us.</p>
      <p>And folks wonder why I moved back to the Great White North....</p>
      <p>L.</p>
