    html: |-
      <p>About Titillium.<br>
      I just updated this year's exams on original website.<br>
      The font now is more complete than last semester (there have been 2 intermediate upgrades since font squirrel's version):<br>
      <a href="http://www.campivisivi.net/titillium/?page_id=2" title="http://www.campivisivi.net/titillium/?page_id=2">http://www.campivisivi.net/titillium/?page_id=2</a><br>
      now is far more complete, but it's obviously not a professional work.<br>
      In this course students make their first experience with type design (and most of them with typography in general) and they are not exactly students of graphic design: they come from interaction design, video, motion graphics or illustration.<br>
      Every year a new group of pure beginners works 30-40 hours on Titillium during 3-4 months, after a brief introduction to type design and some hours of handmade exercises.<br>
      This is just the 3rd year we are working on Titillium (the project started in 2008, 8-10 students per year).<br>
      The project started from an exercise of a student (a square-sans "dotted" typeface). We chose to work on this specific "square sans" because it was, in our opinion, the easiest starting point for neophyte among all the other options presented by students.</p>
      <p>This explains the lack of kernings, the simplistic naming and the other inconsistencies.</p>
      <p>We decided to release Titillium under Sil license because:<br>
      1) we'd like to give to the students (not just to ours) the possibility to use and modify a font instead of using illegally commercial fonts (under this point of view probably it make sense even to work on a sort of "paradigmatic" square shape);<br>
      2) in order to make an experiment of collective design process, defining just simple basic rules (maybe too much strong?). This is the main task of the course, even more important than speaking of typography (students doesn't aim at being typographers);<br>
      3) we'd like that everybody who wants could use, modify, republish his version of the font.<br>
      In my opinion it makes sense to share what you do, when it is possible. Users will help you to fix problems or will discuss with you about the sense of what you are doing.</p>
      <p>We are very pleased that so many people liked and used Titillium and that it was "hand-selected" by Fontsquirrel. Maybe this typeface has some qualities even if it is a permanent work in progress, but we never claimed that this is a professional font or a particularly original one.</p>
