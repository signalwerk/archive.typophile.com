    html: '<p>I prefer Titillium over Klavika, Neo, etc. for many reasons: it is free, I can modify it if I need to, it has more weights, it is softer, conceptually more consequent, has a nice g and it feels fresh and experimental. I use it for one client in particular: a foundation for experimental music. We are not interested in "pro" features, HZ optical kerning in InDesign works fine, and the fact that the Titillium is still in a positive evolution is a big plus for us.</p>'
