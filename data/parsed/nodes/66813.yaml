    <p>Can anyone help me identifying this font?</p>
    <p>Does anyone know which fonts are these? (both the ones in the title, in white and the smaller ones also in white) Maybe "Dobra", by DSType? I wonder.</p>
    <p>I was doing a research on Fontshop.com, it's not Absara, because the "M" in Absara "touches" the baseline. In this case, the "M" is "suspended" and the "O" is very "oval"-like. Notice also how the "R" "leg" goes a little beyond it's own space...(I don't know exactly how this is called in typography, sorry!)</p>
    <p>Geogrotesque? I don't know...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Um_Enigma_Chamado_Brasil_capa_de_livro_12863_gg_4525.jpg"></div><p></p>
    <p>Thanks in advance for your help!</p>
