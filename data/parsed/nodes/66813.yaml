    html: |-
      <p>Well, where to start?<br>
      What is the reasoning behind 5 of the 7 weights being numbered (250, 400, 600, 800, 999), and 2 named ‘Text Bold’ (style: ‘Regular’) and ‘Title Thin’ (style: ‘Thin’)? Especially intriguing: why is the ‘Text Bold’ of the same light weight as the ‘Title Thin’ (lighter than ‘250’)?</p>
      <p>Keeping the widths of all characters consistent over 5 weights hardly ever works out.</p>
      <p>Titillium might be a style that doesn’t need extensive kerning –&nbsp;but zero kerning pairs is a bit meager.</p>
      <p>Have you tried typing an eszett (ß) or guillemets (»«)? Don’t need those? Okay, try Dollar ($) or section mark (§). Looks okay in the Thin? Try switching to a bolder weight.</p>
      <p>Here’s an image, showing some glyphs from the 400 weight.<br>
      There are at least 3 different weights in one font, sometimes 2 of them combined in 1 glyph.<br>
      What about that overlap in the Ð?<br>
      What’s going on with the g? 3 alternates, all in 1 slot?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/titillum_3773.png"></div><p></p>
      <p>I understand that this is a collaborative students’ project. And as an Open Source font, it’s kinda permanent beta.<br>
      What the participants (I assume they haven’t been exposed to type design before) have accomplished is very respectable, and could serve as a good base.<br>
      I also understand that the <a href="http://www.typophile.com/node/28458" rel="nofollow">Square Sans</a> is just a very popular genre, and there’s room enough next to Klavika et al.</p>
      <p>My object of disapproval is not so much them or their font, but rather Fontsquirrel labeling this work-in-progress as “only the best commercial-use free fonts”. Titillium is not on a par with Aller or Museo. I wouldn’t want to work with this tool.</p>
