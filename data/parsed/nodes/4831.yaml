    html: <p>I think that is better, Julio. It's not the 'a' that bothers me, Hrant (although it may not hurt to try it)--the 'e' seems like it's just about the fall to the left. Maybe it's just me... <br> <br>Perhaps the sharper corner could be placed elsewhere on the 'e'? Like the bottom left curve or the top right curve? <br> <br>Does the 'n' need to be a tad heavier? You should carry this through when you get a chance and make a complete font from this. I'm havin' fun just thinkin' about it... <br> <br>Well, I don't want to be a nit-picker--it's working out nicely so far. <br> <br>BTW, the corner definitely belongs on the 'd'. :-) <br> <br>-Addison</p>
