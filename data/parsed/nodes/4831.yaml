    html: <p>Julio, <br> <br>I hate to barge in at this late hour, but this logo has great potential and I see some issues. The main problem is in the balance of the letters. Right now the i is stable, the n is stable (the curves look wobbly but it's hard to tell), the d is falling to the left, the e is falling to the left the a is relatively stable. <br> <br>In my opinion it doesn't have to do with the location of the corners, but rather an instability in your master glyph shape from which all the others are derived. If you balance that shape, then your letters will be balanced. The following illustration highlights what I'm talking about. <br><img src="http://www.typophile.com/forums/messages/29/36662.gif" alt=""> <br>Very nice work! <br>Randy</p>
