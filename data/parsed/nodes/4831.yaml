    html: <p>I agree with Christos. do the rest of the letters. They are very nice. If you do not have the time and/or budget try something else. Officina is OK in my opinion, but you can do better. <br>In the future, working in layers with a text font / weight you intend to use underneath new letters can make it easier to get matching fonts. I am not suggesting de-construction of existing paths but general characteristics <br> <br>btw. your type design remind me of Darren Scott's Hydrate, although yours is more legible. Here is a link to Darren Scott's work for those interested. <br> <br><a href="http://www.fontworks2.type.co.uk/fw/shop/catalog?q=byCatSubCat&amp;p=1&amp;f=" target="_blank">http://www.fontworks2.type.co.uk/fw/shop/catalog?q=byCatSubCat&amp;p=1&amp;f=</a>*&amp;qa=font,Darren_Scott</p>
