      <p>This Italian lettering reminded me of the underlying letterforms of the Ferrari logo, which has been made into a font by Michael Hagmann as Ferro Rosso <a href="http://www.dafont.com/font-comment.php?file=ferro_rosso&amp;text=P+I+A+N+O+F+O+R+T+I" title="http://www.dafont.com/font-comment.php?file=ferro_rosso&amp;text=P+I+A+N+O+F+O+R+T+I">http://www.dafont.com/font-comment.php?file=ferro_rosso&amp;text=P+I+A+N+O+F...</a>  Clip the length of the serifs and automotive styling overlapping bars, add a few serifs where they are missing and it would look fairly close if you edited the leg on R.<br>
      Presumably if there is a closer matching font one of the other font detectives will tell you about it.<br>
      Don</p>
