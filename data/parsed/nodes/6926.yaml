    html: <p>I would have to agree that it needs refinement, I can't say exactly what the company is at this stage as it is not yet public, but it is going to have something to do with helping smaller companies and young entrepreneurs make it overseas.  <br>Type will be part of the logo in the end but I would like to get the symbol working by itself first before I add another element.  <br>I will do some research into Maori designs as this seems a popular suggestion. In doing this I wil have to take care as it is easy to put your foot in it when you don't have a solid understanding of a culture. Thankyou for all the great feedback. <br>Jill</p>
