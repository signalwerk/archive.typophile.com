  html: <p>Hi, I am creating a logo, which represents New Zealand, for a new company. I want to represent freedom and the relationship between the great outdoors and the cities. I have made the logo so average New Zealanders' can understand it, therefore it has a friendly 'clip art' feeling.<img src="http://www.typophile.com/forums/messages/29/50116.gif" alt=""></p>
