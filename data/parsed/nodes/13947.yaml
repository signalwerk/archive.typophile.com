    <p>A page layout program from <a href="/wiki/Adobe%20Type" class="freelinking" rel="nofollow">Adobe</a> that has emerged as the main competitor of <a href="/wiki/QuarkXPress" class="freelinking" rel="nofollow">QuarkXPress</a>. InDesign plays particularly well with other applications from Adobe such as <a href="/wiki/Adobe%20Photoshop" class="freelinking" rel="nofollow">Photoshop</a> and <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Illustrator</a>, and it is particularly good at creating <a href="/wiki/PDF" class="freelinking" rel="nofollow">PDFs</a>. It also features support for <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts.</p>
    <p>More about Adobe InDesign <a href="http://www.adobe.com/products/indesign/main.html" rel="nofollow">here</a>.</p>
