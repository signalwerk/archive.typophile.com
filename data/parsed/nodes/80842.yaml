  html: |-
    <p>I'm looking for a web font that will closely match Trade Gothic, specifically the condensed, bold condensed, and bold no. 2 styles.</p>
    <p>I know that Franklin Gothic is available as a web font, and Trade Gothic is also available as a web font from Monotype under a subscription, but any other recommendations from TypeKit, Webtype, etc. would be greatly appreciated!</p>
    <p>Cheers,</p>
    <p>Jim</p>
