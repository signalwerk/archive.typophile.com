      <p>I can understand both sides.</p>
      <p>The professional would see at design contests as an easy (and cheap) way for 'clients' to choose the best design(s) from a whole catalogue of 'free' works, hence eliminating the professional consultation. It sucks.</p>
      <p>The amateur designer sees design contests as a way to test their work against like-minded amateur designers, and to build on their own competency/skills level in designing.</p>
      <p>Perhaps, a solution could be tutoring from the professional to the amateur? Takes time and considerable effort, of course.</p>
      <p>A professional could come up with a logo/design challenge and entries/submissions by amateurs are critique upon.. Amateur receives feedback required. In the long run, professional protects his rice-bowl..?</p>
      <p>nagfa</p>
