    html: |-
      <p>Spec work is an extremely touchy subject, and you should in absolutely no way attempt to learn anything from a real design process through these "contests." It's said ad infinitum why you shouldn't: you lose the chance to consult a client, the potential to be ripped off is extremely high, and you usually get less than what you're really worth (if you get paid at all).</p>
      <p>If you want feedback, why not try sites like Logopond, deviantART, Flickr... the list goes on and on. What's even more enraging is that I just found <a href="http://www.crowdspring.com/projects/graphic_design/logo/emergien_logo_logotype_design/details" rel="nofollow">the contest on Crowdspring</a>, and they're only offering $400? Seriously? A global firm whose image needs desperately to appeal to investors and businesses of all kinds, while showing dozens of personality traits... $400. That's the mark they will use for the rest of their existence as the face of their company, and you think that costs $400? That's not even one month's rent for you, even if you live in an efficiency apartment.</p>
      <p>Anyways, you posted up your design to be critiqued. I think that the type looks very dated. And why did you break the pattern of shapes at the bottom of the "e"? The first version possesses very muted and dull colors in my eyes, while the second... I like the cyan, but why the gradient? It looks like it's casting a shadow of doubt on the mark.</p>
    html_clean: |-
