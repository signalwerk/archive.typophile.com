    html: <p>i'm all for experimentation, and am entirely willing to crash and burn if it means i stand the chance of a) succeeding or b) learning. <br> <br>so, i applaud your willingness to share your concept. <br> <br>however, this one is a bit beyond my reach. <br> <br>in short, i'm not sure if you're just having a little fun with the folks here at the forum, or if you're really wanting feedback that will guide you to some goal-driven end. <br> <br>how are individual pixels of color going to take on the role of recognizable letterforms without a translator? <br> <br>i can't read rainbows, but i appreciate their beauty.</p>
