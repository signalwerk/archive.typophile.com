    html: <p>I wanted to make a 1 pixel typeface that was in some way readable.Iv always liked the font in Windows called small font[s]it had the letters at 2 pixels at starting point and iv always wondered if it was possiable to make a 1 pixel typeface readable. How does a person know the alphabet unless they learn it, its same thing, you have to learn everything. If you go to another country how do you know what letter is which and what it means. Why stop at shapes when you can communicate using color.</p>
