    html: <p>good point about learning how to read other languages. <br> <br>but how are you going to come up with 26 different colors that will be distinguishable enough from one another to function as letters in an alphabet unless you treat the colors like phone keys? <br> <br>take 1800-collect, for example. each key on the phone can be three or even four different characters... <br> <br>it'll be interesting to see where you take this.</p>
