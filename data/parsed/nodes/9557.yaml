    html: <p>I have started making the full version and its possiable to have a 26 character set, but not all fonts have a working 26+ character set take 3x3 pixel font for example or even 2x2 the 2x2 lower case b looks great 2 pixels on the left side one pixel on the bottom right and you have a nice bold lower case b blow that up in vector and it looks nice! iv always been a fan of small fonts some of them don't fully work but they have nice characters that can be used, look at the LFO album cover using 3x3 pixel font that F is NICE!. The 26 1px color character set is possiable Cc could be Cyan Ll lime green and so on, i havn't decided on the final colors for the full 26 character set, ROYGBIV is usable and so it RGB as long as it has the characters u need. Know what i mean? <br> <br> <br>DOH! i just realized i spelled my nickname wrong hehe oh well.</p>
