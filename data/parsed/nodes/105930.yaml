    html: |-
      <p>To my knowledge, ‘slanted’ is not used to describe serif forms. Slanted is normally used for letters, words or fonts being skewed ‘electronically’ i.e. by means of simple software modification and without any optical compensation. Or have I missed something?<br>
      When you refer to the serifs in C and E, I’d say something like: the diagonal serifs in C and E. Or are you pointing at something else?</p>
