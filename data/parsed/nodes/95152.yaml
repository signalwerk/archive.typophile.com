    html: |-
      <p>At the start of my career, I used Antique Olive a lot (though not the elephantine Nord weight). I even used transfer lettering to set my second freelance business card in Antique Olive.<br>
      It was the Age of Helvetica, and the popular sans-serifs were all monoline, and therefore tiresome to read at small sizes and too bland to attract attention at display sizes. Optima was a nice alternative, but even at its heaviest weight, Optima was just too damn tasteful.<br>
      Then I discovered Antique Olive. It had lots of punch, and was full of the little eccentricities that other sans-serifs lacked: The vertical cutoffs on the <strong>C</strong>, <strong>G</strong>, and <strong>S</strong>; the unexpectedly square bowls on the <strong>P</strong> and <strong>R</strong>; and the way the curved strokes taper when joining the straight strokes on <strong>a</strong>, <strong>b</strong>,<strong>d</strong>, <strong>g</strong>, <strong>h</strong>, <strong>m</strong>, <strong>n</strong>, <strong>p</strong>, <strong>q</strong>, <strong>r</strong>, and <strong>u</strong>.<br>
      That's what amazed me as a newbie. Some of my early font faves kind of embarrass me now, but I'm still a big fan of Antique Olive.</p>
    html_clean: |-
