    html: <p>When I ﬁrst started teaching type design at York University, about 10 years ago, it was rather open-ended, meaning that students came up with their own ideas for typefaces—and this method (photo-found letter forms) was used by several to kick-start their projects, generally because they weren’t inspired directly by the world of type, not because of any Sagmeister inﬂuence.</p>
