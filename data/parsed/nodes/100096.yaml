    <p>HI guys,<br>
    I've started a project called the LADproject, it's a "letterform a day" exercise. I was hoping to see if anyone else would like to join me in this experiment/project. The basics of it are, to "find" or make a letterform a day for 50 days. It can be found anywhere or in anything. You can make one or draw one. Paint one or just find one that's already made. I consider it an exercise to open up the possibilities of what can be considered typography, or where we can find typography.<br>
    Inspired by Stefan Sagmeister and Michael Beirut, I've dedicated myself to find or make a letterform a day. You can follow the progress here...http://nicolascervantes.wordpress.com/ Post your letterforms there and also comment. Thanks guys, here's aB that jumped out at me today.</p><div class="imageWrap"><img src="http://typophile.com/files/b_small_4135.jpg"></div><p></p>
