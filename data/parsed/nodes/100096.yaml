    html: "<p>I agree with Nick: if it ain't type, it ain't typography. Which is not to say it isn't interesting in its own right, as a way of looking at the world through the filter of letter shapes. And if you were to collect all these images into a <a href=\"http://www.photofont.com/\" rel=\"nofollow\">Photofont</a>, <em>then</em> it would be type and you could make typography, of a kind, with it.</p>"
