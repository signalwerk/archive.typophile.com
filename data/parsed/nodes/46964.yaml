      <p>I cannot stress this enough: go to Typecon. I went last year and learned so much that my brain still hasn’t recovered from the swelling.</p>
      <p>Aside from that, get the beginner’s triumvirate:<br>
      <a href="http://www.amazon.com/gp/redirect.html?ie=UTF8&amp;location=http%3A%2F%2Fwww.amazon.com%2FLogo-Lettering-Bible-Leslie-Cabarga%2Fdp%2F1581804369%3Fie%3DUTF8%26s%3Dbooks%26qid%3D1214939895%26sr%3D8-1&amp;tag=onst-20&amp;linkCode=ur2&amp;camp=1789&amp;creative=9325">Logo Font and Lettering Bible</a><br>
      <a href="http://www.amazon.com/gp/redirect.html?ie=UTF8&amp;location=http%3A%2F%2Fwww.amazon.com%2FDesigning-Type-Karen-Cheng%2Fdp%2F0300111509%3Fie%3DUTF8%26s%3Dbooks%26qid%3D1214939980%26sr%3D8-1&amp;tag=onst-20&amp;linkCode=ur2&amp;camp=1789&amp;creative=9325">Designing Type</a><br>
      <a href="http://www.logofontandlettering.com/bookorder.html">Learn Fontlab Fast</a></p>
      <p>I also recommend <a href="http://www.amazon.com/gp/redirect.html?ie=UTF8&amp;location=http%3A%2F%2Fwww.amazon.com%2FExploring-Typography-Design-Exploration-Rabinowitz%2Fdp%2F1401815057%3Fie%3DUTF8%26s%3Dbooks%26qid%3D1214940099%26sr%3D1-1&amp;tag=onst-20&amp;linkCode=ur2&amp;camp=1789&amp;creative=9325">Exploring Typography</a>. It’s a general typography textbook, but it has a long and thorough chapter about the process of designing type. </p>
      <p>Or you can always pay me to digitize your fonts—I need the work!</p>
