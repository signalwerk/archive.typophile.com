    html: <p>You could learn by doing. Develop your chops using bezier drawing tools. Buy a copy of a font editor and start hammering away at your design. You’ll find out pretty quick if you have the stamina to do type design. Remember, the first 40 or 50 fonts are the hardest.  After that, it goes from being really painful, to only somewhat painful. But the pain never really goes away, it just changes from being your enemy to being your friend.</p>
