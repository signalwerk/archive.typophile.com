    <p></p><div class="imageWrap"><img src="http://typophile.com/files/quinchaflickr_3451.jpg"></div><br>
    Hello typophiles<br>
    This is Quincha, the new type-release by Cocijotype, its designer Diego Sanz based his work on incan walls, which fit their stones perfectly one to another. Quincha has 10 stylistic alternates to build your own wall, moreover, it has a large amount of contextual alternates (over 700). You can get it at <a href="http://new.myfonts.com/fonts/cocijotype/quincha/" rel="nofollow">MyFonts.</a><br>
    Regards.<p></p>
    <p>Eli</p>
