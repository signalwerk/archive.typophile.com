  html: |-
    <p>Hello. This summer I've been introduced to Wordpress and I liked it. So I decided to use it for my sites. I've begun with the site about the <a href="/wiki/Fell%20Types" class="freelinking" rel="nofollow">Fell Types</a>. Essentially I've added a page about their history. It's far to be exhaustive but it's better than nothing. I think I will use the Wordpress' "post mechanism" to add other infos easily (doing something I haven't done for years!).</p>
    <p>I hope you like it.</p>
    <p>Igino Marini</p>
  html_clean: |-
