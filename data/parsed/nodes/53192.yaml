    html: |-
      <p>designing forms and statements is essencially information design. </p>
      <p>Read about that. There are big names who do Iformation design. </p>
      <p>Here the functionality is more important than the appearance, but at the same time, if you come up with a functional (easy to follow, intuitive &amp; readable) form or statement that doesn't put people to sleep or have them pulling their hair out, it will, coincidentally, be also be attractive, becuase of its tidy simple functionality. </p>
      <p>'least that's what I think.</p>
