      <p>Hi Lajos,</p>
      <p>recently, German publisher Hermann Schmidt Mainz has published a voluminous book about the sometimes boring art of designing forms, compiled by Borries Schwesinger, called <a href="http://www.planb2.de/en/index.htm" rel="nofollow">Formulare gestalten</a>. Schwesinger has been awarded with several prices for the lovely design.</p>
