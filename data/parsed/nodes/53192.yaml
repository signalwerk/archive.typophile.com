    <p>Hi All,</p>
    <p>I am desperately seeking information about this challenging typographic (partly graphic design) project. I need to redesign ugly looking statements and invoices. Do books or websites/blogs exist covering this field? Who are the big names and experts? Any help is appreciated.</p>
