    <p>My company has been working with Lucida Sans for print and screen text, and lately I have been fielding complaints about what is perceived as a patchy, low-res look of the typeface as it appears on screen (apps, email etc). It performs well in print, however. </p>
    <p>I asked a type designer, and he told me that Lucida Sans was originally designed for low-res screens, and on today's high-resolution screens maintains an appearance that has not aged well with the times. He also said that Microsoft has largely abandoned Lucida Sans as a font it supports.</p>
    <p>Can anybody affirm this problem? Is there a version of Lucida Sans that has been "modernized", smoothed out so that it takes on a better appearance on screen/the web?</p>
    <p>We are looking at alternate plan B solutions such as Segoe, Myriad, Calibri and Verdana. We would like to avoid this as we have set many templates in Lucida Sans as is and it will be a pain to change them all.</p>
