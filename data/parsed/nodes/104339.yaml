      <p>How Lucida Sans appears on screen depends on several factors: the platform/apps, the screen resolution and point/pixel size, and which of the three common versions is actually being used. Windows has Lucida Sans Unicode (one weight), Mac has Lucida Grande (regular and bold), and some Microsoft products ship with a family that has true italics but covers a smaller character set. While these versions are largely identical in design, differences in their hinting can affect screen appearance at smaller sizes. Here's an article that examines some of the rendering inconsistencies: <a class="freelinking external" href="http://www.brownbatterystudios.com/sixthings/2007/03/14/lucida-hybrid-the-grande-alternative/" rel="nofollow">Lucida Hybrid: The ‘Grande’ Alternative</a>.</p>
      <p>However, this is mainly an issue for lower-res devices that use hinting more aggressively in rendering (i.e. Windows). Higher-res devices should render the font more closely to how it looks in print, which you say performs well.</p>
