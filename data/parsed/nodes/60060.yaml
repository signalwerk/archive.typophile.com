      <p>This type seems to have italic features in a vertical form, and the stems are quite odd. The font Mikey picked above is similar, and the best I could come up with is also only similar. It's Victor de Castro's <a class="freelinking external" href="http://www.unifonts.com/h_pages/hudsonbold.htm" rel="nofollow">Hudson</a>. </p>
      <p>- Mike Yanega</p>
