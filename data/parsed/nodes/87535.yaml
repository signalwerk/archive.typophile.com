      <p>Some of us prefer to distinguish between legibility and<br>
      readability; the former refers to the decipherability of<br>
      individual symbols, while the latter refers to the actual<br>
      facilitation of what some call "immersive reading". For<br>
      example a large sans-serif letter is highly legible, but<br>
      a lot of text set that way is not readable.</p>
      <p>My contention is -and has long been- that Modernism<br>
      is not in fact motivated by functionality, but merely<br>
      the illusion of functionality via [over-]simplification.</p>
      <p>hhp</p>
