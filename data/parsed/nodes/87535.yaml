      <p>You say you are writing your thesis?<br>
      Why not do it with a broad nibbed pen, using the New Alphabet?<br>
      (After all, it is an alphabet—unless the name is purely ironic—and so may be rendered in many ways.)<br>
      That would constitute critical design, which is the appropriate form of "critical analysis" for designers.<br>
      See if you can learn to read and write fluently with it.</p>
      <p>**</p>
      <p>I too designed a monowidth, unicase alphabet, which I termed the Panoptic alphabet, and executed it in a number of different typographic styles, as the typeface Panoptica.<br>
      But I was not influenced by Crouwel's work.<br>
      In fact, the "orthogonal" version of it ended up looking more like Doesburg's de Stijl lettering (also revived by the Foundry).</p>
      <p>**</p>
      <p>Zuzana Licko's Oblong is somewhat like New Alphabet, in that it exploits its constraints in an inventive, decorative/stylish manner, rather than putting a premium on legibility. Certainly in comparison to her earlier, more verbatim transcriptions of the alphabet to the low-res no-diagonal screen.</p>
