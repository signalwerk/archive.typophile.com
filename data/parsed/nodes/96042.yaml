      <p>Are you sure you haven’t got that backwards? </p>
      <p>The ITC Galliard that I have from Adobe has an ‘rv’ kern pair of 53, pushing them clearly apart. In contrast, the ITC Galliard CC from Carter &amp; Cone has an ‘rv’ kern pair of -16, allowing them to touch. (Note: the native fitting is different between the two versions as well.) I don’t have the Bitstream version, but I would expect it to reflect the thinking of the C&amp;C version, for the reasons Mark explained.</p>
      <p>The “original” would actually be Mergenthaler Linotype Galliard for phototype composition, released in 1978, before ITC acquired the licensing rights (in 1981). </p>
      <p>But, in terms of digitizations, the Bitstream and CC versions hew more closely to the original Mergenthaler drawings than the Adobe version, which contains some modifications done during the early days of Postscript.</p>
