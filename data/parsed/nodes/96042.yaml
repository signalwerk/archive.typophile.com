      <p>The Bitstream version is probably truer. Matthew Carter (Galliard's designer) was one of Bitstream's founders and probably supervised its digitization. The Linotype/Adobe version has also been criticized for the spacing in the italics. (I wish I could remember where I saw that, but it was a long time ago.)</p>
      <p>Carter &amp; Cone (Carter's current company) also has a version. It's full-featured, but it lacks the bolder weights, and looks like it's only available in PostScript Type 1 format.<br>
      <a href="http://www.fontshop.com/fonts/downloads/carter_and_cone/itc_galliard_cc/" title="http://www.fontshop.com/fonts/downloads/carter_and_cone/itc_galliard_cc/">http://www.fontshop.com/fonts/downloads/carter_and_cone/itc_galliard_cc/</a></p>
