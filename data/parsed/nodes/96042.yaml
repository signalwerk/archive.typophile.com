  html: <p>There is the ITC Galliard that's sold by Adobe etc, and the Galliard BT from Bitstream....There are some kerning differences, for example in the ITC Galliard the small letter "rv" combo touch each other, where in the Bitstream "rv" lettering combo they do not....So i was curious which version is the "original"?</p>
