  html: "<p><img src=\"http://www.typophile.com/forums/messages/72/57284.gif\" alt=\"3rd Tuesday\"> <br>From the Typographic Circle <br><a href=\"http://www.typocircle.co.uk\" target=\"_blank\">http://www.typocircle.co.uk</a> <br> <br>3rd Tuesday <br> <br>Our new monthly event, 3rd Tuesday launches 18th January. <br> <br>Our members and audience often mention that one of the nicest things about  <br>our lectures is that they are social and an opportunity to meet, talk and  <br>exchange ideas. Bruno has responded by starting up 3rd Tuesday in  <br>association with The Friends of St Brides who will be helping out also to  <br>subsidise the bar. <br> <br>So far we have not planned to hold formal talks or to have any structure but  <br>hopefully it will take on a life of its own. <br> <br>3rd Tuesday will always be represented by the attached logo which will soon  <br>begin to appear in badge and t-shirt form of course. Orders are already  <br>being taken, sight unseen! <br> <br>The Friends of St Brides and the Sign Design Society have expressed a wish  <br>to have ties with the Typocircle, I am circulating details of lectures from  <br>both groups, for which our members will receive discounted entry. <br> <br>Alessio Leonardi <br> <br>We now have a venue and date for Alessio's Typocircle North talk. The Circle  <br>Club, 8.30pm on the 2nd February. The London lecture will take place 3rd  <br>February, we are yet to confirm a venue but tickets are selling fast  <br>nevertheless. <br> <br>Associated lectures <br> <br>Friends of St. Brides <br>Tuesday 11 January <br>Hans Schmoller: The Penguin Years <br>Speakers: Jerry Cinamon and Phil Baines, to be introduced by Tanya Schmoller <br>More information at <a href=\"mailto:friends@stbride.org\">friends@stbride.org</a> <br> <br> <br>Sign Design Society <br>Wednesday 19 January <br>Inclusive Design <br>A talk by June Bretherton of JBC-Londonon <br>More information at <a href=\"mailto:enquiries@signdesignsociety.co.uk\">enquiries@signdesignsociety.co.uk</a> <br> <br>Thank you for taking the time to read all this.</p>"
  html_clean: "<p><img src=\"http://www.typophile.com/forums/messages/72/57284.gif\" alt=\"3rd Tuesday\"> <br>From the Typographic Circle <br><a href=\"http://www.typocircle.co.uk\" target=\"_blank\">http://www.typocircle.co.uk</a> <br> <br>3rd Tuesday <br> <br>Our new monthly event, 3rd Tuesday launches 18th January. <br> <br>Our members and audience often mention that one of the nicest things about  <br>our lectures is that they are social and an opportunity to meet, talk and  <br>exchange ideas. Bruno has responded by starting up 3rd Tuesday in  <br>association with The Friends of St Brides who will be helping out also to  <br>subsidise the bar. <br> <br>So far we have not planned to hold formal talks or to have any structure but  <br>hopefully it will take on a life of its own. <br> <br>3rd Tuesday will always be represented by the attached logo which will soon  <br>begin to appear in badge and t-shirt form of course. Orders are already  <br>being taken, sight unseen! <br> <br>The Friends of St Brides and the Sign Design Society have expressed a wish  <br>to have ties with the Typocircle, I am circulating details of lectures from  <br>both groups, for which our members will receive discounted entry. <br> <br>Alessio Leonardi <br> <br>We now have a venue and date for Alessio's Typocircle North talk. The Circle  <br>Club, 8.30pm on the 2nd February. The London lecture will take place 3rd  <br>February, we are yet to confirm a venue but tickets are selling fast  <br>nevertheless. <br> <br>Associated lectures <br> <br>Friends of St. Brides <br>Tuesday 11 January <br>Hans Schmoller: The Penguin Years <br>Speakers: Jerry Cinamon and Phil Baines, to be introduced by Tanya Schmoller <br>More information at <a href=\"mailto:friends@stbride.org\">friends@stbride.org</a> <br> <br> <br>Sign Design Society <br>Wednesday 19 January <br>Inclusive Design <br>A talk by June Bretherton of JBC-Londonon <br>More information at <a href=\"mailto:enquiries@signdesignsociety.co.uk\">enquiries@signdesignsociety.co.uk</a> <br> <br>Thank you for taking the time to read all this.</p>"
