  html: '<p>Hope to find out what this font is, or something very similar. <br>It comes from Sears (Roman Coins books) and is used to denote the writings on roman coins. Preferrably a font with greek letters in same style. <br>url for picture: <a href="http://www.insane.org/sears.png" target="_blank">www.insane.org/sears.png</a> <br> <br>i tried <a href="http://www.myfonts.com/WhatTheFont/" target="_blank">http://www.myfonts.com/WhatTheFont/</a> and it gave me linotype charon medium as the closest match but its not quite perfect imho. <br>(<a href="http://www.myfonts.com/fonts/linotype/charon/linotype-charon-medium/" target="_blank">http://www.myfonts.com/fonts/linotype/charon/linotype-charon-medium/</a>) <br> <br>thank you <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>sears[at]insane.org</p>'
