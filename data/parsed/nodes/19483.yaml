  html: |-
    <p>Any recommendations for a font that will be vinyl lettered on the back of a sailboat. The sailboat name is Esprit and we are looking for a font that "captures" this name below. The definition of esprit is liveliness of mind or spirit; sprightliness.</p>
    <p>The fonts that we are considering are:</p>
    <p>Jeffriana<br>
    Marmalade<br>
    Mr. De Haviland<br>
    Valentina Joy<br>
    Ministry Script<br>
    LoveLight<br>
    UpDock<br>
    Sarah Script</p>
    <p>Thanks for any help that you can offer!</p>
