      <p>@J. Tillman. Agreed it would be interesting to have figures on which sectors buy how many fonts, and perhaps also what kind of fonts.</p>
      <p>Judging from the live sales map on myfonts.com, it seems sales are literally spread out over the globe. Most are sold in Europe, then the US, South America, and a surprising amount in India. What I'm trying t say is, it's hard to 'reach out and say hello' to an audience all over the globe...</p>
      <p>@Jeremy: Remember it's just one weight. The entire family comes out more expensive when you give one for free, compared to a 90% discount, I'd say. Plus, there's something to say for allowing designers to use and test the font in any environment before paying for the rest of the family.</p>
