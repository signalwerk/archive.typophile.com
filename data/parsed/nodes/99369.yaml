      <p>Jasper, I'm interested in these ideas also. But I want to take a different view. What you mentioned is good, assuming that people interested in type are going to hit your website. But what if the seller is an little-known type designer, with no web-site traffic? This brings up the real guts of marketing--identifying potential customers and then reaching out to them.<br>
      So who are the buyers of type? Is this information available? Hey, we're in the age of big data! Here are some parties that might buy type: book publishers, magazine publishers, newspaper publishers, self-publishing authors, tech writers and tech companies, in-house design departments, graphic design companies, independent graphic designers, book designers, typesetters, newsletter publishers, commercial writers, web designers, and so on. If you knew who was buying type, then you could reach out and say hello. Maybe through social media, or through a printed letter (in a stamped envelope), or in some other way. But I don't think that marketing, for the little guy, is about waiting for people to hit your website. It's about identifying an audience and communicating as directly as possible with them. Is this being done? That's what I would like to hear about.</p>
