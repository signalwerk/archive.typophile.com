    html: <p>The boost in sales you get at MyFonts for being in Rising Stars is incredible, which explains how they can charge so much for being a sponsored font (incidentally, this is one marketing strategy not mentioned above). I believe it's only a matter of time before the MyFonts team start taking into account massive introductory discounts and featuring more 'worthy' entries. That's purely speculation, but they did mention in the Best of 2012 newsletter that they'd weighed up font sales <cite>correcting for what we might call the Introduction Sales Peak (ISP)</cite> in order to get the list. They also limited it to two families per foundry, which I guess went some way towards stopping it being a Yellow Design Studio advertisement!</p>
