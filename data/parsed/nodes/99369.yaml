    <p>It seems the marketing of fonts has recently taken a rather ugly direction, with 90 or 8o% discounts becoming usual for newly released fonts. Ugly, I dare say, because it just devalues it too much. Basically, so it seems, it's just a way to get your fonts into the temporary-bestsellerlists, which generates more sales. I've always been inerested in marketing in general, (this includes commercials, but also pricing, distr. etc.) so I was wondering about some interesting ways of marketing fonts. Underneath is a decent start:</p>
    <p>For example, I know that House Industries make beautiful products and artpieces using their fonts. Check this! <a href="http://www.houseind.com/objects/objects/" title="http://www.houseind.com/objects/objects/">http://www.houseind.com/objects/objects/</a></p>
    <p>There are some promotional videos: for the Soho fontfamily here: <a href="http://www.youtube.com/watch?v=naBDGHYORH8" title="http://www.youtube.com/watch?v=naBDGHYORH8">http://www.youtube.com/watch?v=naBDGHYORH8</a> and for Gira here: <a href="http://vimeo.com/45750412" title="http://vimeo.com/45750412">http://vimeo.com/45750412</a></p>
    <p>Then there's this beautiful video (not intentional marketing, but what the heck) on akzidenz: <a href="http://www.youtube.com/watch?v=jtvq46zafOk" title="http://www.youtube.com/watch?v=jtvq46zafOk">http://www.youtube.com/watch?v=jtvq46zafOk</a></p>
    <p>Some foundries (exljbris) offer a single style for free, and the rest for a reasonable price. Also interesting marketing.</p>
    <p>William's Caslon got a beautiful article about it here: <a href="http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authenticity/" title="http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authenticity/">http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authe...</a></p>
    <p>So, what else is out there? That's what I'm wondering.</p>
    <p>Cheers! jasper</p>
