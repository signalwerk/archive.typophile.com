    html: |-
      <p><cite>...Tschichold’s rejection of modernism...</cite></p>
      <p>He didn’t so much reject modernism as give up on the dogmatic side of modernism, the notion that modernism was superior, and that everything else needed to be pushed aside. This was a combination of his experiences with Nazi dogma and a pragmatic decision—if he wanted to survive by designing books sticking to modernism was pretty much out of the question. I think that people have a tendency to pick up on the mordant nature of the open letters Tschichold and Bill were writing and apply Tschichold’s feelings toward Bill to Modernism.</p>
      <p><cite>...less about typography and more about graphic design...</cite></p>
      <p>Don’t worry, they’re not mutually exclusive subjects, especially when Tschichold is being discussed.</p>
      <p><cite>Is my scope too narrow?</cite></p>
      <p>Not if you have access to a halfway decent library.</p>
