  html: |-
    <p>I'm doing a paper in which I select two typographers and explore any kind of connection between them. (This paper will later be used as copy for a book I design.) I chose Jan Tschichold and Paul Renner. I'm going to cover the basics of their careers, but I thought it would be interesting to the focus on Tschichold's rejection of modernism, and Renner's attempt to set a middle course between Tschichold's conservatism and Max Bill's attacks on Tschichold.</p>
    <p>I'm not very knowledgable about typography, and I'm worried this will end up being less about typography and more about graphic design. Does anyone have any advice? Is my scope too narrow? Are there any other connections between Tschichold and Renner that would be good to consider?</p>
    <p>I'd just like some advice about direction. Thanks.</p>
