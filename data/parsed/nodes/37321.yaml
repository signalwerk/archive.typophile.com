    html: <p>You need to get hold of the 'Reading Typography Papers' Volume 4 of 2000. The 1946 article ‘On Typography’ by Max Bill (“Typography is the design of of text-images, in the same way that modern, concrete painting is the design of rhythms of space.”), Tschichold’s rather condescending response ‘Belief and Reality’ ("Obeying good rules of composition and book design in the manner of traditional typography is not ‘putting the clock back’; but an eccentric style of setting is almost always debatable. Thus, the layout of Bill’s article is exciting because unusual, but is not to be taken as a model for general imitation.”) and Renner’s article ‘On Modern Typography’ 2 years later (“The Bauhaus style is, as Jugendstil and the arts &amp; crafts of the Wiener Werkstätte once were, a station on the way to the style of our time. One should not linger too long at these stations if one does not want to miss the connection.”) are all reproduced with an introduction by Christopher Burke and Robin Kinross.</p>
