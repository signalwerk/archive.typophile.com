    html: "<p>There is a new book on Tschichold by Christopher Burke: <a class=\"freelinking external\" href=\"http://www.hyphenpress.co.uk/books/978-0-907259-32-9\" rel=\"nofollow\"><em>Active Literature</em></a>. Given how great his Renner book is, I'm really looking forward to reading this one, as Tschichold is, I believe, a more pervasive influence. Between Burke's two books you should have a lot of information.</p>"
