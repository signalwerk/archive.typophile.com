      <p>Both U+0328 and U+02DB are included in Arial, Batang, Calibri, Candara, Consolas, Constantia, Corbel, Gabriola, Gulim, Meiryo and Times New Roman in my Microsoft fonts. If you are on a mac and if you have the Apple font tools installed, you can list installed fonts having those two characters with the line command</p>
      <p>ftxinstalledfonts -U 'U+0328,U+02DB' -f -l | grep YES</p>
