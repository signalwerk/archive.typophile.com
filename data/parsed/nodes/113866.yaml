      <blockquote><p>I'm assuming that the combining marks do not need widths assigned since it would seem to be irrelevant, whereas those in the 02xx range would need those widths, like other glyphs. Correct?</p></blockquote>
      <p>Yes. Combining mark characters are specifically intended to be zero-width; it isn't just that there is no need for them to have widths, but they really shouldn't.</p>
