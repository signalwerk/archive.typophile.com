      <p>I have a slightly different take on the characters in 02B0-02FF. As John says, when used as accents, the combining diacriticals should used. But remember that some of the *glyphs* in the Spacing Modifiers have dual uses (I suppose a few do not), and such usage may call for a different *character*. Different character, different encoding, just like the Latin Capital Letter A and the Greek Capital Letter Alpha are always different characters, but often the same glyph.</p>
      <p>Secondly, if I am <strong>referring to</strong> an ogonek rather than using it -- as in "the ogonek is used in Polish, Navajo, and a few other languages" I would set that ogonek (reference) using U+02DB. Otherwise, you're left with setting an extra space and the combining diacritic (U+0328), or using a huge kern with the combining diacritic (still probably preferable to putting it over a word space). As far as syntactic meaning goes, I think this better preserves things. YMMV.</p>
