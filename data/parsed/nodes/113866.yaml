    html: <p>The spacing accent marks such as 02DB are legacy characters, included only for backwards compatibility with pre-Unicode standards. Unicode's preferred mechanism for handling diacritics is with non-spacing combining marks. If you look at precomposed diacritic characters in Unicode, you'll see that they all have canonical decompositions to base letters plus combining marks.</p>
