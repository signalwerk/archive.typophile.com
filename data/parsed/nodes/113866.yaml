    <p>There are a number of Unicode characters called combining or non-spacing marks. Here's a link to a list of them: <a href="http://bit.ly/1bVPnBU">http://bit.ly/1bVPnBU</a>.</p>
    <p>They appear to be nothing more than repeats of other unicode diacritics. For example the ogonek and ring (Unicode 02DB and 02D8) appear to be the same as Unicode 0328 and 030A. Some fonts, I've noticed, contain one range of these Unicode characters while others contain the other range.</p>
    <p>I'm confused as to why separate unicode designations exist for, what appears to be, the same characters. Maybe this is an obscure question, but can anyone here shed some light on it? Both Google and the search feature here seems to be failing me?</p>
