      <p>Charles is right. I should have paid more attention to the original post. Many of the 02xx block characters are spacing modifiers, used in various notation systems. I was thinking primarily about the legacy spacing characters in the basic ANSI Latin set.</p>
      <p>Fonts would mostly only need to support the 02xx characters if it were intended for specialist publishing in linguistics. The 03xx combining characters are more widely useful. I recommend including at least those that correspond to precomposed diacritics in a font, and to use these in composites rather than spacing characters. This will make future extensions of the font to support GPOS mark positioning easier.</p>
