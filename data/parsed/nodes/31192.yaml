    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span>&nbsp;Scala</strong></p>
    <p><a href="/node/31193" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Martin Majoor</a>,&nbsp;1987-1990</p>
    <p>In 1988 Majoor started working as a graphic designer for the Vrendenburg Music Center in Utrecht, for which he designed the typeface <span class="caps">FF</span> Scala especially for use in its own printed matter. In 1991, <span class="caps">FF</span> Scala was released on <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop</a> International’s <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> label as its first serious text face. Later on Martin included the much-requested Bold Italic as well as the missing small cap weights. There are also two condensed weights, well-suited both as display faces and for narrow columns of&nbsp;text.</p>
    <p>Martin Majoor then enhanced his elegant serif with a companion sans-serif family. Again it is the simplicity that makes <span class="caps">FF</span> Scala Sans so captivating, while at the same time its distinct character is immediately recognizable. The family comprises six variants including an italic small caps style, a fairly rare beast in the typographic zoo. All weights come with both old style and lining&nbsp;numerals.</p>
    <p><strong>External Links</strong><br><a href="http://scalafont.com/"><span class="caps">FF</span> Scala microsite</a><br><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Scala"><span class="caps">FF</span> Scala</a> at FontShop<br><a href="http://www.fontfont.com/fonts/scala"><span class="caps">FF</span> Scala fonts</a> at FontFont<br><a href="http://www.martinmajoor.com/6_my_philosophy.html">Martin Majoor’s Type Design&nbsp;Philosophy</a></p>
