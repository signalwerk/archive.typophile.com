      <p>No worries on the detail, I actually started mentioning some of those points in my earlier response but didn't want to muddy the issue :)</p>
      <p>You understand pretty much everything. Fonts can certainly contain objects that aren't letterforms, and any of those could be protected as images by copyright because they aren't functional (your contrasting star examples are perfect). There's no easy way to know at what point a court would consider an image an original creative work.</p>
      <p>In terms of licensing and limitations on use, the only way to enforce a restriction would be through contract law, not copyright. Whether or not (and in what ways) a standard EULA can restrict use can be a contentious issue around here, so I won't give you a simple answer, but in terms of copyright law, once you have the shape of the letter, you can quite literally do whatever you want with it.</p>
      <p>You can indeed drop your type into Illustrator, convert to outlines, and then adjust whatever you like in order to make a logotype fit together better. You could also, as you suggest, convert or scan every letter in a face and then make your own font out of it and resell it. But you'll have to go through and do all the hinting, all the kerning, all the testing and balancing over again, which is a lot of time-consuming skilled work. If you remember those CDs that were popular in the 90s with 5,000 fonts for $49, generally they were filled with fonts that were made in just that way (except without all the care!). The quality of a font made that way is not very high -- its one of those things that sounds a lot easier than it really is :)</p>
