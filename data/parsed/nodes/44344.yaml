    html: <p>Just to clarify what seems to be a contradiction between what I've said and what Thomas is talking about -- while the shapes of the letters are not protected, the specific selection of points and curves that the creator uses to accomplish that shape is protected by copyright. Anyone who works with bezier curves knows that you can create the same shape a thousand different ways, and doing a literal point-for-point, curve-for-curve duplication or derivation of someone else's choices isn't allowed (much like the phone book case, where the arrangement itself is a creative work).</p>
