      <p>There are several aspects to this. I'll point out that I'm not a lawyer, and you're really wanting legal advice, so you might be best off talking to a lawyer. Frank Martinez is knowledgeable in this area, for instance.</p>
      <p>a) do you need to purchase it first? The common wisdom in the type design community is that the usage you describe would not violate US copyright law. (Your user profile says you're in the US, so we'll assume this is the relevant question.) However, the recent paper by J.D. Lipton suggests that the matter isn't completely certain. I'd add that it would presumably violate a design patent, if one existed for the typeface. But if there's no design patent, and you trust the "common wisdom," then no, you don't need to license it to do the usage you describe.</p>
      <p>b) If you do license it, then it becomes dependent on the license agreement in addition to other restrictions due to copyright or design patent. </p>
      <p>The simplest thing might be to identify the font, and ask the folks who sell it.</p>
      <p>Cheers,</p>
      <p>T</p>
