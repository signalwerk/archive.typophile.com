      <p>This is fascinating, and a very much needed topic for discussion. </p>
      <p>In the spirit of continuing the discussion, I'd like to postulate a hypothetical: As we've seen here a few days ago, web browsers (particularly WebKit/Safari) are starting to correctly parse CSS3, including the 'embedded fonts' feature. This conflicts sharply with most foundry's EULAs regarding uage of their font files. From what I'm reading here, would it not be an acceptable (in a practical sense-ethics aside) end run around this issue to take the font you want to use, create outlines in Illustrator, create your own font file from these outlines (hopefully with attention paid to kerning tables, hinting, etc., of course!), and use that as the embedded font in your website?</p>
      <p>While it would seem to me that the foundry's EULAs are in sore need of rewording in order to reflect current and future usage practices, this would seem, at face value, as an alternative to exposing yourself to litigation, while still enjoying the new typographical features available on modern browsers.</p>
      <p>Any thoughts?</p>
