    html: <p>Also, just to clarify, one can definitely get a design patent, which will protect the design itself completely, for 14 years. A copyright offers a far longer term of protection, but the patent is a good start. The name of the font can also be trademarked, so that if you develop recognition of the name, even if someone steals the design, you'd still have the advantage of the naming rights.</p>
