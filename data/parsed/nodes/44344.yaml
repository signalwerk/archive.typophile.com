      <p>@JosafeenGrey: <em>...so james, when you say commercial use (as in the paid licensing), do you mean redistribution?</em></p>
      <p>For Pyke's Peak Zero and its Zero Cost EULA, users may distribute (redistribute) the font file on an unlimited number of web servers as a download for redistribution provided they don't charge money for it or claim it as their own work. PP Zero may also be "embedded" on webpages using the CSS @font-face property which requires the font to be installed on a web server as a live webpage resource, in unlimited fashion.</p>
      <p>That means PP Zero may not be redistributed on a commercial basis, ie: distributed "for profit" by charging money for it.</p>
      <p><em>I’m trying to get a grip on what exactly commercial use is...</em></p>
      <p>I define "commercial use" as; Use of the font for the purpose of promoting a commercial product, goods sold, or a service that makes its proprietor a monetary profit. That definition is not in my Zero Cost EULA, but the term "commercial use" is adequately defined by common commercial law in most countries. My commercial rights and "right to profit from my invention" are guaranteed by common commercial law, just as they are for any other merchant or entrepreneur.</p>
      <p>j a m e s</p>
