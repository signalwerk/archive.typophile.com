      <p>I'm not a lawyer, and this is a legal question for which you really ought to consult a lawyer.</p>
      <p>That being said.... At least in the USA, the outlines from the font software ARE protected by copyright. At least, that's how I as a non-lawyer read Judge Whyte's summary judgment ruling in the Adobe vs SSI case.</p>
      <p>"Adobe claims there is some creativity involved in the manipulation and editing of the on-curve and off-curve reference points. Defendants claim there is no protectable creativity contributed by the editor in determining the desired character outline for each font."<br>
      ...<br>
      "The evidence presented shows that there is some creativity in designing the font software programs. While the glyph dictates to a certain extent what points the editor must choose, it does not dictate every point that must be chosen. Adobe has shown that font editors make creative choices as to what points to select based on the image in front of them on the computer screen. The code is determined directly from the selection of the points. Thus, any copying of the points is copying of literal expression, that is, in essence, copying of the computer code itself."</p>
      <p>Full decision here: <a href="http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4">http://directory.serifmagazine.com/Ethics_and_Law/Copyright/judgement.php4</a></p>
      <p>Now, most licensing of fonts seems to allow you to use the outlines for things like logos. But that doesn't mean there's no copyright inherent in the outlines.</p>
      <p>Cheers,</p>
      <p>T</p>
