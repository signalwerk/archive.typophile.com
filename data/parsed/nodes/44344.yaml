      <p>Okay, so I'm the editor and (given the size of the staff) designer for my school newspaper. We reach maybe 220 people max, and print 125 copies. I was looking for a way to get Poynter Agate for free one day and I stumbled upon a Yahoo! Answers page that had a guy giving a link to Font Bureaus fonts. Like, at least one hundred fonts. Not the newest stuff, but a ton of stuff that would have cost thousands of dollars if I had bought all the licenses. </p>
      <p>Then, I found a BitTorrent file that had 65k fonts on it. Mostly they're junk but it probably has several hundred commercial fonts.</p>
      <p>I really don't like using these fonts illegally. However, there is no way in the world that my school newspaper would ever in a million years be able to pay like $600 to use each of the fonts. We're not making any money off of this, and in the future if I ever worked at a real newspaper of any kind (including college papers for example), I wouldn't use these "bootlegged" fonts.</p>
      <p>Now my question is, in essence, what are the ethics of this, and what are the actual legal issues in doing this. Are the font companies going to sue my school, sue me? And basically, since I assume the answer to that is no, since they probably have no clue I exist, and are probably more focused on serious abuses of their copyrights, what do you guys think of me doing this?</p>
      <p>I would ideally like reassurance that while what I'm doing may not be strictly kosher, it's not horrible either. I am open however, to being shamed into deleting these font files from my computer and going back to producing a paper consisting 90% of Georgia.</p>
      <p>The reason I use the commercial fonts is because, obviously, they make the people look 1000 times better, which makes people read it. And in an age in which nobody reads the paper, especially teenagers, I feel like anything I can do to attract readers is worthwhile.</p>
      <p>Thoughts?</p>
