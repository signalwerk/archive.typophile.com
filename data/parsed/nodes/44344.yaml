      <p><em>For example, they have a “basic” license that lets you use the font for setting general type like body copy, then a more-expensive license that that you must purchase to use the font to create a logo design. Since the letterforms aren’t copyrightable, does that mean you can legally purchase the less expensive license, type out all the letters in the font in Illustrator, convert them to outlines, and then use the outlines to create a logo design without having to pay for the other license?</em></p>
      <p><em>Also, doesn’t this mean that you can alter the letterforms in a font without permission even if the license agreement specifically says you can’t create “derivative works” or “manipulate” the letterforms?</em></p>
      <p>As I understand it: No, you're not allowed to do this. Because you licenced the font you are bound by the licence agreement. Copyright laws don't apply unless there are any illegal licence terms in the EULA, in which case only these terms would be void and legal restrictions or permissions  determined by copyright laws would replace them.</p>
      <p>There are, however, certain conditions in which a licence agreement is not effective. For example, in Germany, if you purchase software on a physical medium, your right to use the software comes from the possession of the medium, so any licence agreements you have to accept later (e.g. when installing the software) are void. Then your use of the software would only be bound by copyright laws.</p>
      <p>That being said, I'm not a lawyer.</p>
      <p>Jens</p>
