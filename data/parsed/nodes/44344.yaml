      <p>Kari - No. All font usage should be based on the license with which the font was received. If you're not sure, use a web search (or even post on Typophile) to find the correct copyright holder and ask them specifically about your particular use case. Even if there is no posted copyright, the fact that the item "exists" means whoever originally created it has some form of rights ownership on that particular item. </p>
      <p>At any rate, your question should be directed towards the creator of the particular font about what is or isn't allowed with their creation.</p>
