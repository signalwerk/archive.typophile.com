      <p>Dear Okay:</p>
      <p>What you are describing is a creative act, and you violate no copyright agreements by manipulating the character(s) in this manner. You make decisions about where to place your control points, orientation of the handles, etc., so you are creating a new, copyrightable work of art. It's not much different than my taking a photograph of a sculpture in a public plaza; while the sculptor may own the rights to his work, my photo is a creation in and of itself; I must make decisions about composition, exposure, lighting, and so forth. Note, however, that the sculpture is in a <em>public</em> plaza; artist’s works in museums are usually protected from being photographed without express permission.</p>
      <p>It gets a bit murkier when one creates outlines from an existing typeface, and then modifies them; one would then be using the control points determined by the original creator, arguably a violation of the EULA. But if one creates outlines, rasterizes them, and then uses the rasterized file as a reference to create new vectors, that would be a new creation. The law, at least, seems to be even more arcane than typography.</p>
