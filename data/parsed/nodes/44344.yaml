      <p><cite>If I could find it for free and download, why wouldn't I just go ahead and do that, and am I violating any laws by doing that (and how would I know?)</cite></p>
      <p>One of the biggest problems with free font sites is that some of the fonts are commercial fonts. In some cases this is the entire point of the site, but even on sites that do not allow pirate fonts users rename commercial fonts and upload them. If you don’t do enough design work to know which is which just buy a font. Really, they’re not that expensive.</p>
      <p><cite>can I use the typeface in my logo and in my other business-related material</cite></p>
      <p>You need to read the license of a font before you buy it. Few font licenses will prevent you from using the the font in your day-to-day business materials or logos, but they are out there.</p>
