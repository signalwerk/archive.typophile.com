    html: <p>Pabla -- your situation is certainly possible (again, in terms of copyright -- whether or not the license prohibits it and is binding in your jurisdiction is a totally separate issue). But like I said, the quality of such a project is generally not going to match up with expectations. You'd certainly get a much better looking site by using well-designed, professionally optimized fonts that are allowed to be downloaded, or are widely distributed, than trying to hack out look-alikes of some offbeat face. It's much simpler to use existing image replacement techniques for headings and other small blocks where a really unique face needs to be used.</p>
