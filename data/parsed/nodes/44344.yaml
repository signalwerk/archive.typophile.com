      <p>Not to forget Malory's definitive compilation <em>Le Morte D'Arthur</em></p>
      <blockquote><p>…which copy Sir Thomas Malorye did take out of certain books of French, and reduced it into English.  And I, according to my copy, have done set it in imprint, to the intent that noble men may see and learn the noble acts of chivalry, the gentle and virtuous deeds that some knights used in those days, &amp;c., &amp;c…"</p></blockquote>
      <p>—according to Caxton's preface (1485).</p>
      <p>I wouldn't say that Caxton was attempting to justify Malory's appropriation of foreign texts by the virtue of his disseminating their nobility, because nobody then would have seen anything wrong in Malory's modus operandi.</p>
      <p>The ethics of copyright, and the laws, have evolved over time.<br>
      But Shakespeare's observation (via the role of Angelo) holds up.</p>
