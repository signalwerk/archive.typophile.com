      <p>As always, it depends on what the license terms say. You should read the licenses for Mac OS and for the Adobe software the fonts came with. If anything is unclear, in principle you ought to consult a lawyer. Not that anybody usually does, but that's the theory.</p>
      <p>If you want a non-legally-useful opinion? For these two sources (Apple and Adobe), I'm pretty sure you're fine designing and selling greeting cards or making invitations using the fonts. However, there are some foundries that have additional requirements, such as crediting the foundry on the card or some such. Some require additional licensing fees when the font makes up the primary element of the item you are making, such as magnetic letters for a fridge. But AFAIK Apple and Adobe have no such interesting issues.</p>
      <p>Regards,</p>
      <p>T</p>
