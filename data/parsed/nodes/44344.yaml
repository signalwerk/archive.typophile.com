      <p>There are good fonts available for free, and the advice would be to go for that!</p>
      <p>For example the Russian Paratype foundry has issued free fonts paid for by the Russian government which supports Latis script and every script used in Russia itself. PT Serif and PT Sans. The Serif is a bit squared, slightly condensed, tall x-hight, fresh and modern font, which could be easily used as a newspaper font. It is slightly more condensed than Utopia for example, which is a classic for newspapers. </p>
      <p>PT Sans is pretty useful, there is as well a condensed version, which could substitute Poynter Agate, as there are 2 Caption (small text) weights, 4 normal weights and 2 condensed weights.</p>
      <p><a href="http://www.paratype.com/public/">http://www.paratype.com/public/</a></p>
      <p>Utopia itself comes for free too, in an older version. A classic newspaper Serif<br><a href="http://www.ctan.org/tex-archive/fonts/utopia/">http://www.ctan.org/tex-archive/fonts/utopia/</a></p>
      <p>Other free serifs, maybe not for newspaper, but good quality and several weights (regular, bold, italics) are<br>
      Bergamo, Gentium, Droid Serif, all on <a href="http://www.fontsquirrel.com">http://www.fontsquirrel.com</a> Gentium and Droid could be useable. </p>
      <p>Junicode, a text face following the English tradition, condensed, but long descenders and ascenders, so it would be only so so for newspaper. <a href="http://junicode.sourceforge.net/">http://junicode.sourceforge.net/</a></p>
      <p>There is a free Garamond version, again maybe not that suitable for newspaper, as it has a rather small x-height and more wide characters. Garamond 8 from URW: <a href="http://www.artifex.com/downloads/">http://www.artifex.com/downloads/</a> </p>
      <p>Another useful sans is aller in 7 weights<br><a href="http://www.fontsquirrel.com/fonts/Aller">http://www.fontsquirrel.com/fonts/Aller</a></p>
      <p>And Lato - a sans in 10 weights<br><a href="http://www.fontsquirrel.com/fonts/lato">http://www.fontsquirrel.com/fonts/lato</a></p>
      <p>Really, with this choices, you do not need to steel others work, if there are some people giving away their work for free. </p>
      <p>I did not check any of their licences for your specific use, so do this please before using them. </p>
      <p>best</p>
