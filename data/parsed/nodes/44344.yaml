      <p>Your understanding is essentially correct in the USA. The actual software (the font file) is protected by copyright, so everyone who uses the font on their computer needs to buy a copy or have a license. But the visual image of the font and the outlines generated by Illustrator to be used in a logo have no protection whatsoever.</p>
      <p>The legal reasoning is that the alphabet itself is purely functional, but the software that makes up a complete font is a creative work.</p>
      <p>Similarly, the information printed in the phone book is factual and anyone can reproduce it, but the phone book itself is protected by copyright because that particular chosen arrangement of the collection of facts is a creative work.</p>
