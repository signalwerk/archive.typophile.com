      <p>Thanks nmerriam </p>
      <p>I had no idea that the legalities of typefaces were so...strange? I always assumed that typefaces were copyrightable and that in order to use a typeface for something you had to have a specific license to use it in that way. Personally I don't see how anyone can say "that drawing of a cat is copyrightable but that drawing of the letter 'A' isn't", but I'm sure I'm not the only person who disagrees with the way the court handle this. :-)</p>
      <p>I don't mean to explicitly lay out all the ways in which people can legally steal font creators' work, but I want to understand the situation as well as possible so I thought of some examples.</p>
      <p>Say you purchase a font from a foundry with different licensing agreements based on the way you're going to use the font. For example, they have a "basic" license that lets you use the font for setting general type like body copy, then a more-expensive license that that you must purchase to use the font to create a logo design. Since the letterforms aren't copyrightable, does that mean you can legally purchase the less expensive license, type out all the letters in the font in Illustrator, convert them to outlines, and then use the outlines to create a logo design without having to pay for the other license? If this is the case, why do they even have a license like that in the first place? It seems like this is an instance of someone essentially trying to "trick" people into thinking they have to purchase licenses they can can legally avoid purchasing, which seems about as unethical as stealing letterform designs. Shouldn't font creators be trying to change the laws by suing people? I know it's not that easy, and I'm not saying people should be expected to create designs and just let people do whatever they want to with them without paying them. I just want to know what the "courts" say about it, whether it makes sense or not.</p>
      <p>Also, doesn't this mean that you can alter the letterforms in a font without permission even if the license agreement specifically says you can't create "derivative works" or "manipulate" the letterforms? As long as you're not altering the font program itself, there's no legal issue, right? For example, say I use a font I've purchased to create a logo of the word "Forkz", but I want to change the K so it joins up with the Z. This is legal as long as I convert the letters to outlines (which you would have to do anyway) even if the license says I can't alter the letterforms, right? Having a general stipulation like that in a font license would be invalid to begin with, right?</p>
      <p>I guess what I'm trying to ask is, does the license for a font only extend to the program and not in any way to the letterforms contained in it? If this is the case, why don't people just make new fonts using the letterforms contained in existing fonts? Once again, let me say that I don't think this is "right" in any way, and I would never do that myself. I'm just trying to understands the situation.</p>
      <p>One more example. Say you've purchased a font that contains the usual tyopgraphic symbols, plus a drawing of a monkey that was created by the font creator. The tyopgraphic symbols would be uncopyrightable, but since the money isn't a letterform, it would be protected by copyright, right? The font creator wouldn't have to have a "design patent" for that symbol in order to lay claim to the design, right? So, for instance, the designs in a font of "dingbats" WOULD be protected as long as they were unique enough to be copyrighted? Like, a generic five-pointed star wouldn't be protected, but a five-pointed star with a human face drawn inside would be?</p>
      <p>Sorry about the length of this post, I'm just interested in the intricacies of this.</p>
