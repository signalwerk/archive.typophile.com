      <p>Nick, why'd you have to quote that slimeball pirate Shakespeare?</p>
      <p>From <a href="http://www.rhetoricainc.com/MellinkoffLecture.html">The David Mellinkoff Lecture: 8 February 2007, UCLA Law School</a> by Professor of Rhetoric Richard Lanham, also of UCLA.</p>
      <p>"It is no exaggeration to say that Chaucer could not have put forth most of his work had he worked under current copyright law. One can easily imagine the letters of warning he would have gotten from agents and copyright lawyers and the permissions he would have had to pay, if he had been lucky enough to be allowed to pay them—and could have found the money. </p>
      <p>"But Chaucer’s difficulties would have seemed trifling to a later pillar of English literature, <strong>William Shakespeare</strong>, had he lived in our current copyright world. Almost all his plays have sources, some of them very close. Take, for example Romeo and Juliet. Shakespeare’s immediate source was a poem by Arthur Brooke, The Tragicall Historye of Romeus and Juliet, published in 1562, some 35 or 40 years before Shakespeare’s version. Shakespeare’s play follows Brooke’s poem in embarrassing detail, everything almost, except poetic quality. Brooke’s poem is excruciatingly dull, Shakespeare’s play has given love its native language. This huge difference, this unbridgeable gulf, would not have protected Shakespeare from Brooke’s wrath, had they both lived in the present climate, however, because artistic quality is not allowed as a criterion in copyright cases. But Shakespeare could have pointed out, in self-defense, where Brooke stole the story from. It was not theft, Brooke might have replied, but honest borrowing since his (that is, Brooke’s) title page says “written first in Italian by Bandell” (a short-story writer named Bandello, whose stuff was often “adapted” into French by someone named Belleforet) and his (again Brooke’s) “To the Reader” preface mentions a play on the same subject “lately set forth on stage.”</p>
