    html: |-
      <p>&gt; <em>This font must exist…</em></p>
      <p>I've taken a little time to scan through <a href="http://www.myfonts.com" target="new" rel="nofollow">MyFonts.com</a> but haven't come up with an exact match yet.</p>
      <p>Yes, it may indeed be a font, but don't assume that it is a font for a PC or Mac. It may be an older proprietary font for a signmaking device like the Gerber SignMaker. You are showing us an outdoor sign to match, and an older looking one at that.</p>
      <p>The sign industry has followed different standards for decades. Only in the last 10 years or so has some of the equipment frontends merged onto PCs. I'm sure you know this Nick, but I just wanted to remind some of the novice onlookers that NOT ALL FONTS were made for the same devices or equipment, and many adapted designs to suit the output device.</p>
      <p>Even if a sign is brand new, it depends on the equipment used (or manual adaptation if cut or painted by hand).</p>
