    html: |-
      <p>Matt, you should be able to find the files online. It's license is, well, disputed. I discussed this with a bunch of Ubuntu people <a href="https://answers.launchpad.net/ubuntu/+question/115258" rel="nofollow">here</a>, and according to HF&amp;J the files were never released under GPL conditions, but exclusively to HP (maybe HF&amp;J is planning to sell them publicly later? Wouldn't be the first time.)</p>
      <p>Paul asked Bdale Garbee at HP about the status of the font, but we haven't received an answer yet. At any rate, unless HP has full rights to the fonts and decides to release them, the files are in a very, very dark-gray zone, legally speaking.</p>
