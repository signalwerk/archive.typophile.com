    <p>Hi all,<br>
           I have designed my studio logo with Adobes Futura. But i want to know which version of futura is best b4 i buy it. I tried to do the logo with Gotham. But somehow it didn't fit me. So i have made it with Futura. Esp i love the the Caps in Futura which i have used. Pls give me suggestions.Thanks in advance.</p>
    <p>regards,<br>
            Vansep</p>
