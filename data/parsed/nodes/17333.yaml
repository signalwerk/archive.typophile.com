      <p>Hi Simon,<br>
      Thnx for the announcement. I got the latest VOLT, but there seems to be a bug in the installation process (using XP here). When installing it points out at least 3 version conflicts, claims that my existing files r more recent, and recommends that I keep my existing files. When I got to the supplemental files I realized something was wrong and, sure enough, the supplemental files contained in the latest VOLT are newer, though the installation claims the opposite. If I followed the install advice I would not have got the new supplements.</p>
      <p>Now I do not know if I was supposed to update the dll's that the install claimed were "older". Any advice?</p>
      <p>Best<br>
      I</p>
