      <p>It is known problem with VOLT setups. I planned to move VOLT installation to the better technology for this release but did not have time for that, so this will be left for the next update.</p>
      <p>For this version you can do follwoing:</p>
      <p>1. Uninstall all previous versions of VOLT.<br>
      2. When installing this update, keep files with higher version number in Windows\System32 folder.<br>
      3. (If you did not unistall VOLT as I recommended in item 1,) overwrite any file in VOLT installation folder.</p>
      <p>Thanks,<br>
      Sergey</p>
