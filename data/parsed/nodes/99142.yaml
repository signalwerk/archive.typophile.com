  html: |-
    <p>In black typefaces with low contrast, the weight distribution of the bowl of "p" and the likes often gets pushed outwards at 2 and 4 o´clock (see illustration), making the diagonal B a whole lot wider than the horizontal bowl width C. Would you regard this as a problem? "o" in mask layer for comparison.</p>
