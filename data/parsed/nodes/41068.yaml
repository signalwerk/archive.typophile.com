    <p>hello.</p>
    <p>and help.</p>
    <p>I’ve embarked on a redesign of a printer’s logo.<br>
    the original is pretty good - it features a lovely ligature,<br>
    but is pretty much a straight out treatment of Mrs Eaves.</p>
    <p>I have taken a fresh look, and decided to develop a modified version<br>
    using classic British font Clarendon, customised and redrawn to become a unique, distinctive and balanced logotype unique to miter.</p>
    <p>job done?</p>
    <p>not quite. my lovely clients cannot quite see the point, or much of the difference between the forms. To me, the new, bold version is punchy, solid and prestigious.<br>
    they think its just an old font...</p>
    <p>so, its to the forum...</p>
    <p>I’d like some thoughts, any thoughts... but mostly a vote for A, B or C:<br>
    old, plain or bold (both custom variations of the clarendon font)</p>
    <p>thank you!</p>
