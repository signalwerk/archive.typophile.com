    <p>hello,</p>
    <p>...<br>
    because its my first one, the font istn a really specific one,<br>
    but it should be good readable in small sizes (9-12pkt) with<br>
    a dynamic character and maybe intressting glyphs.</p>
    <p>there are 2 versions of the font. the one try to keep similar<br>
    contures. (for headlines)<br>
    the second one works with a little diagonal (renaissance-antiqua?)<br>
    contrast, but i think i must re-form the contur more clean. (for small sizes)</p>
    <p>thanks for any help</p>
    <p>*Update font<br>
    *last update</p>
    <p>...</p>
    <p>*Update with Caps II</p>
    <p>Maybe some one has the experience to say something about the stroke relation from caps and symbols and small glyphs. I am not conten with the cap "y" and "X" because they look real creepy, maybe toi narrow.<br>
    i hope i've create the classic-antiqua contrast as good as i can to all glyphs.<br>
    Tracking and the space between the extra symbols would be the next work to do.</p>
    <p>...</p>
    <p>Ok, another version with caps and cap-numbers. but i have to track the numbers.<br>
    i need a good print out, that i can see maybe more details to repair.<br>
    please comment again (in front of older versions)</p>
    <p>thanks again</p>
