      <p>spacing:</p>
      <p>I’d say look at it the size you design it for, i.e. a text font looser than a font for display use etc.<br>
      Have a look at other fonts that are designed for your target point size.</p>
      <p>ligatures:<br>
      as they’re only one glyph they stay the same. that’s why it is important that they work well in your ‘intended’ point size</p>
      <p>In your ‘quick brown fox’ PDF, the h stands out – the stem looks too thin. It should fit the other ascender height vertical stems, like on d, b etc.</p>
