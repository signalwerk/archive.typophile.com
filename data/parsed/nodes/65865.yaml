    html: |-
      <p>Hi Oli, and welcome to Typophile! This is remarkable for a first effort! </p>
      <p>&gt;how can i scipt a command to have more versions of alternatives (3 or 4 alternate sets</p>
      <p>Sounds like you need to use Stylistic sets rather than alternates. You can have up to 20 sets I think. Define ss01, ss02, ss03 and ss04; you can put as many sets and features as you like into a stylistic set, I think.</p>
      <p>&gt;what happend to ligatures if i track the font very ''open'' or very tight? do they broke? </p>
      <p>I don't think there's anything you can do about that; the software should handle that sort of thing.</p>
      <p>I wonder if you should add some definition to the ears of g and r. k looks narrow. </p>
      <p>Keep going with this. I'm not going to crit much for now as I think you should find your own preferred direction, but you'll need to pick a point size and optimise everything for that size, printing, testing and tweaking until it looks perfect. There's not a quick way to do that ;)</p>
      <p>My advice would be to draw the caps and numerals — you'll probably find you need to make different sorts of design decisions as you go.</p>
      <p>:)</p>
