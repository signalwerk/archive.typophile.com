      <p>Sorry, what I meant about the "t" was that it was missing that little bit that runs off the end of the straight lines which create the stems of the glyphs, almost like the subtlest serif. It recurs throughout most of the font and the "t", in my opinion, should have it too.</p>
      <p>I personally prefer the modern "g", it somehow blends into the general style better than the classical counterpart. And also, there's something interesting about the third Eszett (I hope I got the name right); I like it.</p>
      <p>I like the new sample, spacing after the punctuation marks does look a little big, although the top right sample block looks good. I hate to be a pain, but a sample of some sentences or pangrams in the same size as the first (or just a little smaller) sample glyphs would be nice. The new sample is very good as it focuses on legibility in big chunks of small text but glyph style and consistency is more important at the moment to master first.</p>
