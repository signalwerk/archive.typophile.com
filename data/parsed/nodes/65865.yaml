      <p>If your going for legibility you should make the horizontal stroke in the f and t continue like it does in moest fonts. Furthermore, your g is a bit condensed and thereby to dark, Make it just a little bit wider. Maybe your Q stands out a bit to much for text purposes. It's probably better to make the current Q an alternate and make a new 'normal' one. I have to say I'm impressed. Especially if this your first font. Could you have a look at my 'Expletus Sans'?</p>
      <p>Jasper de Waard</p>
