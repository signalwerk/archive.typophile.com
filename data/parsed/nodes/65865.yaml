    html: <p>Not bad; very good for a first typeface. I noticed a few things though; the contours for your ligatures need merging as you can see the subtle lines from the individual glyph overlaps. Also the "v", "w" and "7" look a little out of place (it might be just me though) and the "t" is missing that nice subtle accentuation (or pointy tip) which is visible on the other glyphs. It would be nice to see some written sentences as part of your sample to see how the glyphs act together naturally.</p>
