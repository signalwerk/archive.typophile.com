      <p>Hi Oli,</p>
      <p>good start - I personally prefer the second one with the more diagonal contrast (with a revision of the contours, as you said). I think the diagonal contrast in page 2 goes much better with your dynamic letter shapes. Some of your numerals stick out too much, more precisely 2, 3, 4 and 7 (the shapes got worse in the second page - I’m sure it’s but a result of hasty contrast modification ;) )<br>
      The “Bogen” of your r looks too thin, as if it was a cut “n” it has to be thicker to match the other glyphs. But as Domenico said, some written sentences would be nice for a better comparison.</p>
      <p>Keep it up!</p>
      <p>Jörg</p>
