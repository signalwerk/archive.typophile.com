    <p>Hello,</p>
    <p>I am creating a new modern/quirky dictionary and I wondered if a modern looking sans serif font would work well rather than the serif type that is usually used on dictionaries for the main text.</p>
    <p>I wonder if any on here knew of any good types.</p>
    <p>I am basically trying to combine (stylish/modern/cool/classy/sleek/sophisticated/) with the idea of the dictionary.</p>
    <p>I hope you can help!</p>
    <p>this was one example I thought of: <a href="http://www.hypefortype.com/nuorder.html" title="http://www.hypefortype.com/nuorder.html">http://www.hypefortype.com/nuorder.html</a> </p>
    <p>or maybe not, you might have better types</p>
