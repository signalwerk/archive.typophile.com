      <p>Personally I'd only use Didot as a text face if I hated my readers.</p>
      <p>If you want a didone-esque face (something with both crisp contrast and decent heft, say) then something like <a href="http://www.myfonts.com/fonts/adobe/utopia/" rel="nofollow">Adobe Utopia</a> would probably work better.  For something a little warmer and more organic, <a href="http://www.myfonts.com/fonts/berthold/comenius-pro/" rel="nofollow">Comenius</a> might do (though perhaps it's not as modern as you would like).</p>
      <p>I don't know what you mean exactly by "cool" and "modern".  However, I'll name a couple of faces which I think are distinctively quirky while still looking nicely readable in small close-set text: </p>
      <ul>
      <li><a href="http://www.myfonts.com/fonts/mti/cartier-book/" rel="nofollow">Cartier</a>
      </li><li><a href="http://www.myfonts.com/fonts/adobe/chaparral/" rel="nofollow">Chaparral</a>
      </li><li><a href="http://www.myfonts.com/fonts/lanston/ltc-deepdene/" rel="nofollow">Deepdene</a>
      </li><li><a href="http://www.myfonts.com/fonts/emtype/relato/" rel="nofollow">Relato</a>
      </li><li><a href="http://www.myfonts.com/fonts/fontfont/scala-pro/" rel="nofollow">Scala</a>
      </li></ul>
