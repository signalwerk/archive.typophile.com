    html: |-
      <p>A bit clearer, but I’m not sure I’m on the same page yet (pun intended). I understand:</p>
      <p>a) You have a client<br>
      b) you are making a printed promotional piece for them of sorts, which consists of words selected from the OED, but with funny twists<br>
      c) You are not actually setting an entire dictionary<br>
      d) And the company is rebellious,  slightly differemt, modern, classy, innovative, and caring.</p>
      <p>From what you have posted here, I think you are free to set the type as you see fit given you don’t need to concern yourself with the pragmatics of size, thin paper, economy of space &amp;c like a real dictionary. It just needs to look like dictionary text so people get the visual reference. You might be able to use slightly more contemporary, hip, trendy &amp;c fonts, but stray to far from the norm, and people will probably think “what’s up with this weird type that looks something like a dictionary?” You are already making it clever, different &amp;c by changing the language.</p>
      <p>That aside, what exactly does this company (brand) do? Are they a band? A clothing store? A blog? A software company? A design firm? Perfume? This is a critical piece of information. Those adjectives can be applied to anything. </p>
      <p>And what is the budget for this job?</p>
