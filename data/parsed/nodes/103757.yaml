      <p>Oh, and you have posted this in the wrong area. The “Critique &gt; San Serif” board is where you would post the design of a san serif font you have designed and ask for feedback. Notice how you haven’t been getting any feedback? Questions like this should be on the <a href="http://typophile.com/readme" rel="nofollow">General Discussion board</a>. I will move it for you. </p>
      <p>In addition, you will find that you get better feedback if you show and tell people what you have already tried. There is a tendency for many new members to simply ask the group to do their home/work for them, right down to the Google search. I once saw a post from a student asking Typophile “I need to write a paper about this Baskerville guy. Can anyone tell me a bit about him?” He didn’t get much feedback ;)</p>
