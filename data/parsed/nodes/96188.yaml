      <p>@cerulean i think, There are some metaphors,</p>
      <p>- Social network websites are a kind of transportation platform for today's information (person to person)<br>
      - If there is no official van design for any of them, it is very fun to view/show it.<br>
      - Social Network websites are also like today's collection boxes. We are storing billion of things from our life or our obsessions.<br>
      - And i love to make extraordinary icons...<br>
