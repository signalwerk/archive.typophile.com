    date_raw: 12 Sep 2012 — 9:00pm
    votes: null
    html: <p>Seems to me you're distancing form from meaning. Icons are for us to recognize and distinguish easily from one another. So it may be good to click a shipping van for a shipping company, but that is lost if it's among a lot of other vans that have nothing to do with the subject. There's no metaphor, just the obscuring of more effective symbols by skewing them nearly out of view or making one big thing into four smaller things.</p>
