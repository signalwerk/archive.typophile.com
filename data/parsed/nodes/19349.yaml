    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Emtype</strong></p>
    <p>Emtype is a “small” type foundry currently based in Barcelona, Spain, founded by <a href="/wiki/Eduardo%20Manso" class="freelinking" rel="nofollow">Eduardo Manso</a>. He has designed and published several types through <a href="/wiki/International%20Typeface%20Corporation" class="freelinking" rel="nofollow">International Typeface Corporation</a> (ITC), <a href="/wiki/Bitstream" class="freelinking" rel="nofollow">Bitstream</a>, <a href="/wiki/T26" class="freelinking" rel="nofollow">T-26</a> and <a href="/wiki/Linotype" class="freelinking" rel="nofollow"> Linotype</a>. The “Emtype Foundry philosophy” is to produce types of high quality, as much for display as for text use.<br>
    <a href="http://www.emtype.net" title="http://www.emtype.net">http://www.emtype.net</a></p>
