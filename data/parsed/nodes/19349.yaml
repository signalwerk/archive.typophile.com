    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;Emtype</strong></p>
    <p>Emtype is a “small” type foundry currently based in Barcelona, Spain, founded by <a href="/node/29117" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eduardo Manso</a>. He has designed and published several types through <a href="/node/13399" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">International Typeface Corporation</a> (<span class="caps">ITC</span>), <a href="/node/13429" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bitstream</a>, <a href="/node/add/wiki?edit%5Btitle%5D=T26" title="Create node &quot;T26&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">T-26</a> and <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"> Linotype</a>. The “Emtype Foundry philosophy” is to produce types of high quality, as much for display as for text use.<br><a href="http://www.emtype.net">http://www.emtype.net</a></p>
