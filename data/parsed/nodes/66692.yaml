  html: |-
    <p>I'm working on a small first edition of a book and now that they're printed, the client would like to have them hand numbered.</p>
    <p>So I'm wondering. If written by hand, what kind of ink?<br>
    Permanent, but that won't bleed through a matte coated stock.</p>
    <p>Or perhaps one of those old-fashioned number stamps, but what kind of ink?</p>
    <p>I'd love to hear from anyone with experience in signing or numbering limited editions or with suggestions for this.</p>
    <p>Thank you.</p>
