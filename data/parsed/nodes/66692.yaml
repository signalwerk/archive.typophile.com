    date_raw: 27 Jan 2010 — 8:58pm
    votes: null
    html: <p>Speedball, or better yet Brause, nibs need not be dunked, and should not.  Keeping them clean and sharp is part of the game, but you can always just buy them new.  You feed them with the eyedropper/cap thingie, just not directly over your work.  I still use a drafting pen once in a while, too.  I love doing calligraphy and have done it for three quarters of my life and am perfectly steady, comfortable, and sometimes even creative with pen &amp; ink.  Maybe you should have a professional calligrapher number them if this book project is not appropriate as a learning project.</p>
