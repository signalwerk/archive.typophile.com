      <p>That Comicraft font seems to share some features with Abbadon, which was a Dave Nalle adaptation of a typeface by Alex Jay for a 1981 book called "The Dinosaurs" by William Stout. Jay's type design was inspired by lettering of Alfonse Mucha, the Art Nouveau illustrator and graphic artist.</p>
      <p> - Mike Yanega</p>
