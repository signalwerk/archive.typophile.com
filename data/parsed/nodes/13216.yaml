    <p>Hello,</p>
    <p>To those who know quite a lot about Japanese fonts, I'm asking this question : according to you, what is the Japanese font that would look good when placed close to some Times New Roman?</p>
    <p>The ones I've chosen are :<br>
    - DFGyoSho-Lt-WIN-RKSJ-H<br>
    - DFHS-Mincho-W7-WIN-RKSJ-H</p>
    <p>What do you think about this choice?<br>
    Do you have a better idea?</p>
    <p>Thanks ! :)</p>
