  html: |-
    <p>Hi there,</p>
    <p>I would like to ask the experts around here what level of TTF hinting a font should need to have in order to be a good performer as webfon (and please do not tell me 'as much as possible' :) ). </p>
    <p>Specifically I would like to know what tasks should be done after converting PS hints to instructions or on top of auto TTF hinting.<br>
    (or maybe well done auto TTF in Fontlab or AFDK is enough?).</p>
    <p>Thanks in advance.</p>
