    html: <p>Hinting is a design process, so this question cannot be answered without first knowing for what kind of typeface and how that typeface is intended to be used, e.g. at what sizes.</p>
    html_clean: <p>Hinting is a design process, so this question cannot be answered without first knowing for what kind of typeface and how that typeface is intended to be used, e.g. at what sizes.</p>
  - id: 428878
    user: 2969
    date: 2010-09-09T04:38:00
    date_raw: 9 Sep 2010 — 4:38am
    votes: null
    html: <p>As the world has turned, there is little in the way of "intended use" that effects what a font developer can do to improve the appearance of an existing font on the web. There is no difference in the hints one adds for a display face vs an agate design, pretty much regardless of what kind of typeface it is.</p>
    html_clean: <p>As the world has turned, there is little in the way of "intended use" that effects what a font developer can do to improve the appearance of an existing font on the web. There is no difference in the hints one adds for a display face vs an agate design, pretty much regardless of what kind of typeface it is.</p>
  - id: 428902
    user: 1137
    date: 2010-09-09T08:14:00
    date_raw: 9 Sep 2010 — 8:14am
    votes: null
    html: |-
      <p>Thanks for the answers.</p>
      <p>My question aim to the fact that I always knew that good perfomance in screen was equivalent to high level TT hinting. Well, as we all know this work was in the hand of a limited group of people and the amount of hours was considerable to have something as good as 'Verdana'.</p>
      <p>Well, now we see foundries releasing fonts to be used in browsers by means of @font-face linking. </p>
      <p>Since I suspect these new fonts are not hinted to the level of Verdana, what sort of optimizations is being used or what not-so-deep level of hinting is now considered acceptable for 'webfonts'?</p>
