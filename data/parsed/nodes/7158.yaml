    html: <p>Pavel, what you're describing is most certainly illegal. But to me that's secondary, and the worse part is that most people don't have the self-discipline to keep it <i>ethical</i>, by subsequently deleting all the fonts they downloaded but didn't end up buying. Many people wouldn't even bother paying for the chosen font in the end! Do you have the self-discipline to keep your illegal action from infesting the ethical sphere? I know I generally might not. Fortunately I don't <i>use</i> fonts very much - I just make them.  :-) <br> <br>So unless you're sure you have the self-discipline to overpower the illegality of an action by shining in the ethical sphere, don't do it! It would be like Martha Stewart comparing herself to Nelson Mandela. Can you <i>believe</i> that shite? <br> <br>hhp</p>
