    html: <p>&gt;Since it's not the final press copy to be displayed there wont be any legal &gt;issues. <br> <br>This is ridiculous! Of course there are legal issues invoved here! What you are saying is that someone who does this is less likely to get caught. Posting commercial fonts on the net, and downloading them, are both illegal. If you illegally download a font, but never "use" it, you've still broken the law. Fonts aren't "pay to use," they are "pay to have." <br> <br>By saying, "oh, I'll just download these ten fonts for a 'test,' but I'll buy the one that I really want later," you tread down a slippery slope. It is comments like this that both silently encourage piracy, and which devalue all of our work!</p>
