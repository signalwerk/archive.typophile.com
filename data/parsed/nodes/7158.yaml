    html: <p>Uploading commercial typefaces to sites where other designers can download them is illegal. That is what I meant by "posting" commercial typefaces online. "Sharing" your typefaces with other designers is also illegal. If no designers ever broke their EULAs, then there would be no font piracy! But there is font piracy, because there are so many illegal "copies" of fonts floating around our community. Only we can put a dent in this practice. <br> <br>This isn't about the clients at all. This is about you, and me, other designers, and our ethical systems. It is the legal and moral responsibility of all individual designers to use typefaces properly and "legally." Your telling people just to "borrow" fonts is part of the problem. <br> <br>You started your posting by stating that others would dissagree with the ethics of your suggestion; you knew that what you were suggesting was wrong. Piracy poses a serious threat to our industry, and to the livelihoods of many people who post on these boards, including myself. Fonts don't grow on trees, they are made by real people. If these people aren't prepared to give away "test" versions of their fonts for free, then you should respect that. <br> <br>Type designers don't give away test versions of their fonts because they know that not everyone will delete these "test" copies after the "tests" are over, or buy proper font licenses 100% of the time when they already have a "working version" on their hard drives.</p>
