  html: <p>I haven't worked in a long while so the answer to my questions may seem obvious to all of you but please bear with me.... <br> <br>When working on a small budget what is the best way to present an idea to a client besides purchasing a font immediately and using it in a design. What do most people do, buy the font or first show a PDF downloaded from one of the type shops hoping the client has enough immagination? <br> <br>It would be nice to pay a small fee for using it in the presentation process and then paying the entire fee once it's going to be used, is that possible?</p>
  html_clean: <p>I haven't worked in a long while so the answer to my questions may seem obvious to all of you but please bear with me.... <br> <br>When working on a small budget what is the best way to present an idea to a client besides purchasing a font immediately and using it in a design. What do most people do, buy the font or first show a PDF downloaded from one of the type shops hoping the client has enough immagination? <br> <br>It would be nice to pay a small fee for using it in the presentation process and then paying the entire fee once it's going to be used, is that possible?</p>
