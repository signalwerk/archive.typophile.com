    html: <p>Ok so what would be the difference between a designer who presents his own work having fully purchased all the type and someone who hasnt. The client is totaly oblivious in this matter. Its just a matter of ethics on the part of the designer. Furthermore when it comes to the subject of type which is so widely proliferated on the net it would be ignorant not to take such simple measures. Plus you are not actually using the font commercialy so I don't know where you got "Posting commercial fonts on the net" from, but just for viewing purposes. Just like the original source allows you to do. Finaly there is absolutely no personal or commercial gain because any application that you use the type for requires a license; common sense.</p>
