    date_raw: 15 Oct 2004 — 7:11am
    votes: null
    html: <p>Most foundries and resellers have an area on their website, or under each font in their display list that reads something like "Test" or "Try" <br> <br>You can type in a few words, and sometimes even select size or color, and it will render those specifications in the font accordingly. You can then make a screen shot of the image to show to a client. Some even have "Save Image As" options built in (On the Linotype website, under each individual font display, you can "make a postcard with this font" or something like that, which you can then e-mail. Every web site does this differently, and some smaller foundries' sites aren't sophisticated enough to have these options built in (although if they sell over MyFonts, you can do it there). <br> <br>If a few words aren't enough to persuade your client, you'll have to show them a PDF of the font, if the foundry has that as an option (even if they do have it, the PDFs are not always good or interesting <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0">  ). In general, there are no "try before you buy" fonts, because that type of license cannot yet be controlled easily with present technology (although I'm not sure why not!)</p>
    html_clean: <p>Most foundries and resellers have an area on their website, or under each font in their display list that reads something like "Test" or "Try" <br> <br>You can type in a few words, and sometimes even select size or color, and it will render those specifications in the font accordingly. You can then make a screen shot of the image to show to a client. Some even have "Save Image As" options built in (On the Linotype website, under each individual font display, you can "make a postcard with this font" or something like that, which you can then e-mail. Every web site does this differently, and some smaller foundries' sites aren't sophisticated enough to have these options built in (although if they sell over MyFonts, you can do it there). <br> <br>If a few words aren't enough to persuade your client, you'll have to show them a PDF of the font, if the foundry has that as an option (even if they do have it, the PDFs are not always good or interesting <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0">  ). In general, there are no "try before you buy" fonts, because that type of license cannot yet be controlled easily with present technology (although I'm not sure why not!)</p>
