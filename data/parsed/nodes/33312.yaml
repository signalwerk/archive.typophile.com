      <p>Hi David, Im so pleased to get hold of you. I dont think I remember receiving your email.</p>
      <p>I'd be really interested to talk to you more about the lettering on the Millenium Centre/David Jones/and Welsh typography. I've also been in touch with John Hudson who's been really great. He sent me a link to the Gododdin the other month, which sent me on a quest to the British Museum to meet a Prof of Illuminated Manuscripts to try and understand more abouc what we term "Celtic" lettering.</p>
      <p>Would it be possible to have a chat with you? Im attempting to make a typeface for the Welsh language at the moment, something I've never done before.</p>
      <p>Any advise/comments would be greatly appreciated.</p>
      <p>Siaron</p>
