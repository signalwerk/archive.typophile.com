    <p>Hi all</p>
    <p>My name is Siaron Hughes, and I'm studying an MA in Graphic Design at London College of Communication. Being Welsh, I'm keen to explore my national identity with visible words, type and language. </p>
    <p>My field of study is Typography, Welsh National Identity and  Culture. And the questions I'm exploring are:<br>
    1) Can typography enhance national and cultural identity?<br>
    2) Can a typeface communicate the special character of a national  identity?<br>
    3) Can typography reflect the richness of the way we speak, through  accent, gender, age, speed, rhythm and geography in order to  preserve meaning and identity?<br>
    4) How does a personal identity get constructed and reflected  through typography and graphics?<br>
    5) Could a typeface be engineered with sense-of-place somehow sewn in? </p>
    <p>I noticed there was a discussion David Earls posted some time ago about the lettering on the front of the Millenium Centre building in Cardiff, and I'd very much like to talk to him further about this.</p>
    <p>If anyone else has some thoughts/adivse on my field of study, Id appreciate it also!</p>
    <p>Thanks<br>
    Siaron</p>
