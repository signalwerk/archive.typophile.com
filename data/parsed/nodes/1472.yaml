    votes: null
    html: "<p>I'm realizing that part of the problem is resolution/visibility: people want their design to be highly visible, but since screen resolutions are so much lower than your eye, the graphics are made larger than they'd normally be. I know that \"the boys\" give us zoomed views sometimes, but that seems to be mainly when some type is totally illegible (and probably when one of them isn't on vacation), as opposed to for counteracting the \"diluting\" effect of low resolution. Maybe next year every shirt should have an automatic zoom of the pritable area(s), preferably provided by the submitter. <br> <br>hhp <br></p>"
