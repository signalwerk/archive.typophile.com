      <p><a class="freelinking-external" href="http://www.typodermic.com/10.html">Chinese Rocks</a> was based on hand cut lettering from Chinese wholesale containers. From the looks of the original lettering I’d say it was made using hand-cut rubber - similar to the rubber in a rubber stamp. I think they used a tampo machine but only Chinese factory workers know for sure.</p>
      <p>I’ve seen the same lettering recently on a box of machine dies (make your own bolts, threaded rods etc.) in an antique shop. Check out the numeral 2 - I’ve seen a similar style of 2 stamped on Chinese bike wheel rims.</p>
      <p>Another common feature of Chinese roman lettering is chopping or raising letters with descenders. Descender chopping isn’t restricted to China as anyone who’s played Japanese RPG games can attest.</p>
