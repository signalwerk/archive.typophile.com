    <p>I’ve become fascinated with the odd fonts you see on Chinese packaging, particularly in herbal medicine shops. Some of the designs use stock western fonts, but there are fonts I’ve never seen anywhere else, and some have a delightful slightly off-kilter spidery look that probably comes from being designed by someone whose natural idiom is not the Roman alphabet.</p>
    <p>Has anyone seen any articles about these fonts, or websites or listings?</p>
