  html: |-
    <p>I am looking for an ID on the font used for this logo—If there is one. I know it's not a lot of letters to go on, but the R is pretty distinct.... I was initially heading towards News/Trade Gothics but the O's on those are upright and not as round. </p>
    <p>If it helps, their secondary fonts are Frutiger and DIN</p>
