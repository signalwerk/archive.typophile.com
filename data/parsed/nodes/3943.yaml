    html: '<p>ahh… damn. Thanks Mike, <br><br>Its a really nice loose slab.  <br><br>I found this on their site: <br><i>- Our “Severance” font was originally hand drawn by our former Design Director (and named after her). As the company grew, she couldn’t keep up with all the writing, so her hand lettering was converted to a computer format so we could type in the lettering rather than keep her up 24 hours a day. It is a proprietary font, owned by Ben <span class="amp">&amp;</span> Jerry’s and is <b>not available for sale or downloading</b>.</i> <br><br>boo-hoo… <br><br>Bren</p>'
