    html: <p>Firstly thought it could have been a bespoke typeface exclusively done for ESPN The Magazine. Found 2 similars <a class="freelinking external" href="http://www.myfonts.com/fonts/suitcase/atrament" rel="nofollow">Atrament</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/pagan-sharp/malleable-grotesque" rel="nofollow">Malleable Grotesque</a>. Gave up twice. Finally, found <a href="/wiki/https%3A/%252Fwww.playtype.com/index.php%3Fq%3Dnode/331" class="freelinking" rel="nofollow">Aveny</a> and looks quite matching everything (part of /G).</p>
    html_clean: <p>Firstly thought it could have been a bespoke typeface exclusively done for ESPN The Magazine. Found 2 similars <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/suitcase/atrament" rel="nofollow">Atrament</a> and <a class="freelinking external link-external" href="http://www.myfonts.com/fonts/pagan-sharp/malleable-grotesque" rel="nofollow">Malleable Grotesque</a>. Gave up twice. Finally, found <a href="https://www.playtype.com/index.php?q=node/331" class="freelinking link-external" rel="nofollow">Aveny</a> and looks quite matching everything (part of /G).</p>
