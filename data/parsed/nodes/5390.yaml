    html: "<p>The thread of another thread is that free fonts are not bad per se but knockoffs are bad whether you give them away or sell them. Here you are saying the major players (software houses) shouldn't give away fonts because they also take away business you may get. <br> <br>While it may appear that the bundled fonts have an impact on your income, the \"Type Designers and Foundries of the World\" can't control the font market. <br> <br>(a. There are too many free fonts in the world,  <br> <br>(b. There are thousands of \"too too similar for coincidence\" fonts coming from every major or minor player (which I can't prove) or anyone who buys some $50 software product and  <br> <br>(c There will always be CD offers of 10,000 fonts for $10.  <br> <br>So, if I don't get it from Microsoft, Adobe or Corel, I'll pay $10 and get it myself, or pay nothing and get it off the web. In the end I'll have a fairly complete library of fonts and still bypass the font designer. <br>   <br>So, stop making new fonts for income as you can't protect the product. Give away your fonts so your design expertise is seen widely. Concentrate on your artwork -- that's where the money and protection is. <br> <br>Fonts are not like music which has its RIAA because the RIAA enforces the end product of the musicians' efforts not the clefs, sharps, flats or notes. Have another musician record the same song and then give it away and it would be okay with RIAA. The law would do the same for you if I copied and distributed your artwork for instance -- it passes on the font and hangs me on the arrangement. All fonts should be free as they are only \"the notes\" to compose the music! <br> <br>Another half thought, after all this time there must not be an original font design possible but at the most only tweaks! Thus to be gainfully working you have to make knockoffs... a terrible overstatement and a terrible dilemma. <br> <br>ps: I don't know the economics of the Font Design Industry. Who buys? How much do they pay? How much does the Designer get? How many designers can live on their font sales? Does the Fonts-For-Purchase industry support the Sellers or the Designers? Making all fonts free would change this equation, but would the font designer lose all that much?</p>"
