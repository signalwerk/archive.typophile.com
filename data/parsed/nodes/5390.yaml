      <p>I wonder if that will fly. A better analogy might be plots in literature. Viewed one way, there aren't any new ones. Viewed another, depending on detail, there might be. In any case, if I recall correctly, court cases over plagiarism  usually require more than the same plot.</p>
      <p>As long as you're talking about a *font*, there is the computer program -- essentially, a set of instructions about "how to draw this shape." </p>
      <p>If you're talking about *design* of letters, then you let in all the hand lettering down the years. The main reason we have so many "new" fonts nowadays is anyone with a computer &amp; some relatively cheap software can take their hand-drawn letters and make type from it. Hard to be precise about what's new &amp; what's derivative. Also hard to judge how much society wants to protect what's been judged essentially derivative. Why lawyers &amp; other salesmen get the big bucks, I suppose.</p>
