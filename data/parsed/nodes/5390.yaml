      <p>DPape on 30 Jun 2004 — 11:04pm:</p>
      <blockquote><p>The thread of another thread is that free fonts are not bad per se but knockoffs are bad whether you give them away or sell them. Here you are saying the major players (software houses) shouldn't give away fonts because they also take away business you may get.</p>
      <p>While it may appear that the bundled fonts have an impact on your income, the "Type Designers and Foundries of the World" can't control the font market.</p>
      <p>(a. There are too many free fonts in the world,</p>
      <p>(b. There are thousands of "too too similar for coincidence" fonts coming from every major or minor player (which I can't prove) or anyone who buys some $50 software product and</p>
      <p>(c There will always be CD offers of 10,000 fonts for $10.</p>
      <p>So, if I don't get it from Microsoft, Adobe or Corel, I'll pay $10 and get it myself, or pay nothing and get it off the web. In the end I'll have a fairly complete library of fonts and still bypass the font designer.</p>
      <p>So, stop making new fonts for income as you can't protect the product. Give away your fonts so your design expertise is seen widely. Concentrate on your artwork -- that's where the money and protection is.</p>
      <p>Fonts are not like music which has its RIAA because the RIAA enforces the end product of the musicians' efforts not the clefs, sharps, flats or notes. Have another musician record the same song and then give it away and it would be okay with RIAA. The law would do the same for you if I copied and distributed your artwork for instance -- it passes on the font and hangs me on the arrangement. All fonts should be free as they are only "the notes" to compose the music!</p>
      <p>Another half thought, after all this time there must not be an original font design possible but at the most only tweaks! Thus to be gainfully working you have to make knockoffs... a terrible overstatement and a terrible dilemma.</p>
      <p>ps: I don't know the economics of the Font Design Industry. Who buys? How much do they pay? How much does the Designer get? How many designers can live on their font sales? Does the Fonts-For-Purchase industry support the Sellers or the Designers? Making all fonts free would change this equation, but would the font designer lose all that much?</p></blockquote>
      <p>Dick, I know it was a long time ago, so maybe you've changed your mind, but there are two specific things I'm wondering about:</p>
      <blockquote><p>stop making new fonts for income as you can't protect the product.</p></blockquote>
      <p>Do you think that being able to make money has an effect on the quality of the results?</p>
      <p>Do you believe everybody pirates all the fonts they have?</p>
      <blockquote><p>Thus to be gainfully working you have to make knockoffs.</p></blockquote>
      <p>Does this mean anybody making money in type is a plagiarist?</p>
      <p>No pressure to reply - I'm just curious.</p>
      <p>hhp</p>
