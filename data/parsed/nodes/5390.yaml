      <p>Okay... what I am about to write no longer means anything in Canada, because this is my 2 cents worth: )</p>
      <p>1. Fonts that come bundled with PC or Mac OS, are *mostly* non- to semi-professional in their utility... okay for personal correspondence to church newsletters (even Pope Benedict XVI's photobook is apparently being done in Comic Sans... seriously) [ <a href="http://www.nrc.nl/nieuws/2013/03/07/vaticaan-doet-het-gewoon-comic-sans-in-fotoboek-benedictus-xvi/" title="http://www.nrc.nl/nieuws/2013/03/07/vaticaan-doet-het-gewoon-comic-sans-in-fotoboek-benedictus-xvi/">http://www.nrc.nl/nieuws/2013/03/07/vaticaan-doet-het-gewoon-comic-sans-...</a> ]... but most folks certainly do not appreciate the art or communication subtleties of typography. But the folks who do appreciate having the correct tools for the correct objective absolutely find value in more professionally designed and marketed typefaces. Isn't this the 'low hanging fruit' of the market, and where type designers, graphic artists, and communication folks should focus their attention?</p>
      <p>2. A couple of decades ago, I helped to set up what is called "technology transfer" infrastructures throughout the US (commercializing intellectual property throughout public and private stakeholders, from research labs to universities and corporations). So, a single piece of technology from a small lab in New Mexico (which was designed for a single and specific purpose, would be channeled through the tech transfer process to find MULTIPLE uses, and thus multiply its revenue). Following this example: if a font designer designs a font, and company A produces something which includes the design of the font (say, a logo), Company A is receiving revenues from its product, but the type designer is not... but it could, yes? Couldn't type designers, graphic artists, even basic human labor receive a percentage of the sale of the product, rather than a "token" exchange of value? Why have we all just accepted the notion that the resources necessary to produce a product are just tokens of value? We treat each other as tokens... and we treat the environment as tokens.  But what is the REAL value of human labor, or of water, or a font?</p>
      <p>Okay, time out...</p>
