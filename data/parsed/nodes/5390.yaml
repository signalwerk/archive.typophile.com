    html: <p>Tomas, <br> <br><i>He seems to think that bundling software together is legally the same as giving some of the pieces away for free. I suggest that's a question for lawyers and courts, but I am unaware of any cases relating to that Canadian law which support Nick's interpretation.</i> <br> <br>Font specific, no, not yet. But "giving" and "tied products" are both damaging to competition, and in summary could be considered "dumping". All which are founded in Canadian law. Apparently American and European law also.  <br> <br>One law which may be of interest to Nick is "Canadian Content in Broadcasting". Particularly of interest now that the delivery systems come over satellites and cable. Or more commonly understood as "internet". <br> <br>What may be a problem for Nick however, I can not see anyway he would personally profit from pursuing these lines.  <br> <br>Since my company is in Finland it is of no interest to me. What is of concern over hear is this. The EU consumer laws. Customers can return goods "two years after purchase no questions asked". That could pose some difficulty with the "software upgrade path"</p>
