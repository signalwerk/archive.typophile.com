      <p>Having seen patent design misapplied in an unrelated field, I'd say be careful what you wish for. </p>
      <p>The patents tend to be granted without much proof. In the case I'm thinking of, someone got a design patent on something I and others had both built &amp; used years earlier. I didn't care, it's my hobby only, but the patentee got one major company to pay him off before other major companies made it go away. </p>
      <p>To put everything in terms of cliches, (1) God fights on the side of the most lawyers, and (2) (in terms of the major company who paid off) if you want to get their the firstest with the mostest, pay the blackmail &amp; get a head start. Business ain't about what's right.</p>
      <p>As for Adobe-- let's see, trying to remember, who was suing who over all those fonts? &amp; Wasn't there a Windows/Apple lawsuit over user interfaces? &amp; couldn't Xerox have sued Apple? </p>
      <p>As for the future -- if design patents are awarded to typefaces, expect the Monotype Conglomerate to grab all they can, then get injunctions against  all the small guys, whether the cases have merit or not. Monotype(conglomerate) seems to be  staking out their turf, and they have money for lawyers &amp; lobbying...</p>
