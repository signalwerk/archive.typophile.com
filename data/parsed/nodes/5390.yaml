    html: <p>&gt;Is this an opportunity for positive development, or is this a pipe dream? <br> <br>Chris, new technology offers the opportunity for all kinds of change, and the coming of digital media would seem to lead to a decentralization and democratization of power and wealth. However, it's a battle that large corporate interests (even if they started out small) always seem to end up winning. <br> <br>I would love to challenge Adobe and Apple in court, because the way I see it, the situation is hugely unfair, and there are laws against unfair business practices. Here I am, trying to sell fonts to people who have already been supplied, free of charge, with a large selection along with their operating system and major software applications. But really Thomas, easy for you to say this is a matter for lawyers and courts, but what a waste of time and money it would be for me to test the legality of this practice in court. <br> <br>Leaving aside the amateur or prosumer market for now, my potential customers are design professionals who, by and large (ie 95%) use Apple computers and Adobe software. These software giants are, to all intents and purposes, and notwithstanding Corel and web designers on Wintel, monopolists. So when they bundle fonts, everyone gets them. <br>I'm very familiar with their customer, because before I started my foundry in 1999, I was one of them (an art director). From 1989 to about  1993, I bought a lot of fonts. Then, Quark and Adobe started releasing their major upgrades on CD, and Adobe started bundling large numbers of fonts on the CDs. <br> <br>As Pamela Pfiffner says in the Adobe book "Inside the Publishing Revolution",  the early years of digital were a boom for Adobe font sales. But the boom levelled off as designers rounded out their font libraries, as more digital foundries entered the competition, as piracy and free fonts became widespread, facilitated by the Internet, and as, most significantly from my perspective as a font user, I was getting a large supply of fonts (spam, according to Gerald) from Adobe every time I upgraded Illustrator. <br> <br>Bundling is continued with the CS, and Apple has upped its participation, with a large collection of fonts (not system fonts) that come with OS X. <br> <br>The numbers involved are quite shocking in the disparity between what is acquired by the licensee and what is paid for. <br>A top selling "indie" typeface may perhaps sell, at a guess, a couple of thousand copies worldwide, during a year. However, every font included in an Adobe bundle is distributed by the million. <br> <br>Historically, very few type designers have made much of a living at it. Now it's a bit better, but, compared to the potential of digital media, all those hundreds of millions of computer users as potential retail customers, the realization may be even smaller.  <br> <br>Perhaps I am wrong on this, as I have no data to support my claim, other than my own experience and observations, but I believe that the vast majority of independent foundries are able to exist thanks to custom work and niche markets of publications and corporations that require large multi-user licences, while the "retail" mass market of millions of graphic artists/designers does not support them. And of course, many independent foundries are also supported by the "other" work of their pricupal(s), such as graphic design. <br> <br>There appear to be other niches that are profitable for indie foundries, genres such as pixel fonts, and scripts, but it's worth noting that these are genres that have little or no representation in the bundles from Adobe and Apple. <br> <br></p>
