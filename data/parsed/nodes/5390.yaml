    html: "<p>To run with this notion... <br> <br>I have a feeling that the \"Type Designers and Foundries of the world\" would be willing to shoulder the blame for \"the decision no longer include a package of fonts with our software,\" considering they would become the immediate benefactors of such a decision. I mean, Quark doesn't come with any fonts, right? It's not an absolute must-have-to-stay-competitive kind of a feature. <br> <br>The registration incentives that Thomas envisioned could be a way to start people off, but then they'd have to go and ::gasp:: buy any others they'd need. And it's not as though Adobe wouldn't be able to put a link to their own font library right on the registration site, so they'd have a leg-up on the competition, but wouldn't be \"spamming\" them out of the market. <br> <br>Am I wrong? <br> <br>(By the way, I'm not trying to target Adobe as the big evil monster of fonts. They're just the easiest example.)</p>"
