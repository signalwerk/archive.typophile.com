    html: <p>Nick claims that font bundling with OSes and applications is illegal in Canada. I believe that his interpretation of the relevant law is more than a little suspect. He seems to think that bundling software together is legally the same as giving some of the pieces away for free. I suggest that's a question for lawyers and courts, but I am unaware of any cases relating to that Canadian law which support Nick's interpretation. <br> <br>In any case, the main problem with giving users a choice of fonts is that it means another variable that you've introduced that makes everybody's setups different. Even though you and I are both using "only what came with the computer" we will have different sets of fonts. From the point of view of diversity that's great, but it makes it harder for us to work together. It also means tons more testing and development for the folks selling the OS/apps, and increases their support costs. <br> <br>I like the idea personally, but I suspect that app/OS developers are unlikely to take the route to that extreme any time soon. <br> <br>On the other hand, I can easily imagine with a situation like the Adobe Creative Suite, where you had a choice of "registration incentives" and one of them was a font family, one could offer a choice of several different families instead. Not quite as extreme, but still plays on the same theme. <br> <br>Regards, <br> <br>T</p>
