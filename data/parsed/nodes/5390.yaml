      <p>"I thought, perhaps mistakenly, that the U.S. had recently amended its copyright laws to include font designs, but under some new category so that they didn't get the same treatment as literary works."</p>
      <p>Nope. The abstract design (typeface) is not protected by copyright in the USA. However, the implementation of that design as a font file is protected like software.</p>
      <p>Status quo in the USA: The copyright office accepts registrations of the font file code, and the Adobe v SSi case upheld the principle in federal district court. But that's not new: registration of fonts dates back about 20 years, and the court ruling was 15 years ago.</p>
