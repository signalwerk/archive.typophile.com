      <p>Which is true, but it seems that at least the fonts that are bundled are sure to sell less.</p>
      <p>"It makes sense only if one assumes every purchaser of an operating system has a vested interest in purchasing commercial fonts."</p>
      <p>That is clearly not logically true. It makes sense if you assume that SOME purchasers of OSes would be interested in purchasing fonts if hardly any were bundled, and that SOME portion of their demand for fonts will be sated by bundled fonts.</p>
      <p>Even when I was at Adobe, I don't think I ever disputed Nick Shinn's arguments that bundled fonts reduced the sales of other fonts. Of course they do. It's only a question of how much, and whether it's perceived as "good" (value for end users) or "bad" (reduced sales for folks who are not the lucky ones whose fonts got bundled).</p>
      <p>Regarding bundling of fonts vs whether "average users" would pay for fonts, there was a brief period in the early 90s when computers were taking off, few fonts were bundled, and quality fonts were sold in high volumes to average users, but in heavily discounted bundles (not so much with apps, except Corel's, mostly just fonts).</p>
      <p>Then once large numbers of fonts were bundled with OSes and apps, and the cheap bundles had sold lots, the retail market for full-price fonts collapsed in a hurry, around 1994 or so. The big corporate version of the type industry has never been the same since.</p>
      <p>Charles E wrote: "As I understand it, in the United States at least, a type face *design* cannot be copyright protected."</p>
      <p>Quadibloc replied: "That *was* true, but now there is some limited protection for font designs in the U.S."</p>
      <p>Perhaps Quadibloc is under some misconception that design patent for fonts is the same as copyright, and that this is new? But as mentioned above, it is 170 years old. I know of no new, limited protections for font designs in the abstract (as opposed to their instantiations as specific computer font files).</p>
      <p>US design patent has a very brief term, and only exists after an expensive registration process. That's why pretty much nobody besides Adobe uses this approach.</p>
