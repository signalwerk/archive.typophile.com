  html: |-
    <p>I am fine-tuning my course materials and could use some advice:</p>
    <p>The materials are printed on letter paper and bound with cerlox. To reduce costs, I've decided to layout the text in two columns in 10 pt Minion. There are some figures, but no marginal notes. The document is prepared with LyX/LaTeX.</p>
    <p>Any advice for me on typeblock size and placement on the page?</p>
