    html: |-
      <p>Menu "Tools", bottom entry sez "Options". Oh .. there are a few more than I remembered ...<br>
      Well, the option to output kerning in a 'kern' table (rather than what you are <em>probably</em> using now, the kerning <em>OpenType feature</em>) is in the section "Generating Opentype and Truetype". Expand this item, and there it is at the bottom.<br>
      See p. 109 of the <a class="freelinking external" href="http://www.fontlab.com/fontlab-font-editors/fontlab-studio-8212-professional-font-editor/download-fontlab-studio.html" rel="nofollow">FontLab manual</a> -- it even states,</p>
      <p><cite>It is highly recommend to enable this option for TrueType / OpenType TT fonts. For OpenType PS fonts, the OpenType specification does not envision the “kern” table to be part of OpenType PS fonts but it is possible to include the table nonetheless. Mac OS X and <strong>Adobe applications</strong> will read and use this table.</cite></p>
      <p>which, coincidentally, might be a pre-CS3 remark, as you can read in the thread I referred to.</p>
