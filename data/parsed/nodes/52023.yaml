    html: |-
      <p>Make sure you have your font properties set to metrics in the Character property part.</p>
      <p>I've got caught on that before, it remembers your last font on exit and if it was set to something different with the new font loaded the metrics part is grayed out looking like you cannot change it. You can change it though set it to Metrics.</p>
