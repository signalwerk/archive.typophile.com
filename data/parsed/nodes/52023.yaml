      <p>No, rebooting alone does not clear your font caches. They may not be the culprit (Theunis' explanation may be at least as likely), but if they are, you haven't tried killing them.</p>
      <p>In this particular case, it would be the Adobe-specific cache files which could create different results across different versions of apps. You can kill them manually, or with a utility (the first one listed is even free):</p>
      <p><a href="http://www.jamapi.com/pr/index.html" title="http://www.jamapi.com/pr/index.html">http://www.jamapi.com/pr/index.html</a><br>
      <a href="http://www.versiontracker.com/dyn/moreinfo/macosx/22795" title="http://www.versiontracker.com/dyn/moreinfo/macosx/22795">http://www.versiontracker.com/dyn/moreinfo/macosx/22795</a><br>
