      <p><cite>I am running fontlab 5.0.2, and believe that as the kerning works in CS3 it is not an issue with the actual font creation.</cite></p>
      <p>Yes, that's what I understand from the thread. That's exactly the point: The kerning system that Adobe uses changed between CS2 and CS3, and pre-CS3 versions might encounter problems.</p>
      <p>Have you tried writing the font from FontLab with a kern table (instead of, or in addition to the OTF kern <em>feature</em>)? In FontLab, go to Tools -&gt; Options, bottom item is Kerning. It has a couple of choices, just because kerning caused problems in different programs. I'd start with just switching on 'Export kern table'.</p>
