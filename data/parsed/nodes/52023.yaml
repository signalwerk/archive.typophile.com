    <p>Hi</p>
    <p>Hope someone can help,<br>
    I have managed to somehow make a font in fontlab 5.0.2</p>
    <p>So i export it out at an OT font, i have automatic lig replacement...<br>
    looks fine in the preview in suitcase, ligs work<br>
    but when I try to use in inDesign CS2, the metrics seem to drop out...<br>
    the ligs do work though<br>
    so then i tried in inDesign CS3 and the kerning works...</p>
    <p>can anyone explain this, or point me in the right direction<br>
    i really dont know about proper export settings/process for fonts, so I might have tripped up something there...<br>
    just weird that it works in CS3 but not CS2...</p>
    <p>many thanks!</p>
