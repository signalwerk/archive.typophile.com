    html: |-
      <p>I have discovered my oversight...<br>
      i was working on two fonts that are related but seperate<br>
      one with a lot of ligs<br>
      and the one that is problematic, actually had no ligs<br>
      (as i have buried myself in ligs for 2 weeks, i thought it did)<br>
      and did not check that it was generating the GSUB (sp) table...</p>
      <p>i added f i sub fi;</p>
      <p>and it works...</p>
      <p>my sincere thanks and simultaneous apologies for being so blind...<br>
      a good learning experience though...</p>
