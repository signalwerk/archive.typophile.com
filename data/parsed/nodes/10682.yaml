  html: '<p>Call for papers and presentation proposals <br> <br>Association Typographique Internationale (ATypI) annual conference <br>Vancouver, Canada, 24-28 September, 2003 <br> <br>BETWEEN TEXT &amp; READER : an exploration into the activities, influences, theories and obsessions that exist between the creation of text and the reading of text. <br> <br>The ATypI 2003 programme planning committee invites submissions of abstracts for presentations on any theme related to type, typography and the creative space between text and reader. Appropriate topics include, but are not limited to: typeface design, typographic media new and old, font technology, printing history, the use of type in graphic design, multilingual typography, and design education. Proposals are welcome for practical demonstrations as well as lectures and panel sessions. <br> <br>Abstracts should include the title of the proposed presentation, the presenters name(s), and a short summary (approx. 100 words) suitable for publication in the conference programme. Please also indicate the length of the presentation if it is shorter than forty minutes. Forty minutes is the maximum length for a lecture or demonstration, including questions, but panel sessions may run longer and include short presentations by participants. The deadline for submissions is 30 April 2003. <br> <br>Presentation proposals should be sent to the programme planning committee by e-mail to &lt;<a href="mailto:atypi2003@tiro.com">atypi2003@tiro.com</a>&gt; or by mail to <br> <br>ATypI 2003 Vancouver <br>P.O. Box 3346 <br>Vancouver, BC V6B 3Y3 <br>Canada <br> <br>Please note that all other correspondence should be addressed to the ATypI Secretariat and Conference Office in the USA (see below). <br> <br> <br>About ATypI : Association Typographique Internationale is the only worldwide organisation dedicated to type and typography. Founded in 1957, ATypI provides the structure for communication, information and action within the international type community. Recent ATypI annual conferences in have been attended by delegates from more than 40 countries. <br> <br>For more information, visit <a href="http://www.atypi.org" target="_blank">http://www.atypi.org</a> or contact the ATypI Secretariat &amp; Conference Office <br> <br><a href="mailto:secretariat@atypi.org">secretariat@atypi.org</a> <br>6050 Boulevard East, #2H <br>West New York, New Jersey, USA <br> <br>t. +001 201-453-1775 <br>f. +001 201-861-3365 </p>'
