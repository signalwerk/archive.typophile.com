    html: |-
      <p><cite>by publishing date and/or some kind of regional influence</cite></p>
      <p>Are you talking about <a href="http://www.linotype.com/2393/fontexplorer.html">Font Explorer</a> (FE)? Not to be confused with the rather new FontExplorer X (FEX)! The former can<br>
      <cite>[f]ind fonts fitting each historical era</cite> and <cite>[s]elect a mix of emotions and impressions and find the fonts that suit them all</cite>.</p>
      <p>Yet, I don’t think this app is suited for <em>managing</em> fonts. For that, the latter is the right thing – however the Windows version of that is currently not available due to revision.</p>
      <p>There’s a <a href="http://typophile.com/node/15290?">FAQ on the Best Font Management</a>.</p>
      <p>Though there are tags like ‘designer’ or ‘description’ in FEX, you have to do the sorting yourself, I’m afraid.</p>
    html_clean: |-
