  html: <p>del 8 al 16 de mayo de este año se realizó la segunda bienal de tipografía Letras Latinas 2006 sede Santiago de Chile. <a href="http://www.teletipos.org" rel="nofollow">Teletipos</a>, un blog dedicado a la disciplina tipografica se rearmó para registrar y comentar en formato podcast las charlas efectuadas en la escuela de diseño de la Universidad Diego Portales. Invito a la gente de habla hispana que se da vueltas por Typophile a escuchar los podcast diponibles en <a href="http://www.teletipos.org" title="www.teletipos.org">www.teletipos.org</a></p>
