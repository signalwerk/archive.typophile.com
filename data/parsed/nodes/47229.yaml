    <p>The Hague, 9 July 2008</p>
    <p><a class="freelinking external" href="http://www.type-invaders.com/feisar-express/" rel="nofollow">Feisar Express</a>, designed by Paul van der Laan, is the latest addition to the everexpanding Feisar family:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/feisar-express-overzicht_6369.gif"></div><p></p>
    <p>Feisar Express could be called a ‘retro-futuristic inline script typeface family’. But it would be better to say that it is the outcome of an experiment to explore what can be done with current font technology. This family comes in two different inline styles (called One and Two) and each inline style comes in three different variants for up, down and alternating connections (called Uptown, Downtown and Crosstown).</p>
    <p>More information, examples and a specimen can be found at the <a class="freelinking external" href="http://www.type-invaders.com/feisar-express/" rel="nofollow">Type Invaders website</a>. A special introductory price of 50 euros for the complete bundle applies until 15 August.</p>
    <p>Thanks!</p>
    <p>Paul van der Laan<br>
    <a class="freelinking external" href="http://www.type-invaders.com//" rel="nofollow">www.type-invaders.com</a></p>
