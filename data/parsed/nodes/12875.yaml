      <p>If you look at the Linotype page for Old English (<a href="http://www.linotype.com/11949/oldenglish-font.html">http://www.linotype.com/11949/oldenglish-font.html</a>), you'll notice that its dscription says that it was designed by Monotype. So, this design came to us by way of them. I suspect that E+F's version was licensed from Monotype, too. Orm they may have digitized their own version of a similar pre-digital face, in which case they would have there own.</p>
      <p>In this case, you could license the face from whichever company you prefer to get your fonts from. I'm sure that they are all good fonts.</p>
      <p>__<br><a href="http://www.typeoff.de">www.typeoff.de</a></p>
