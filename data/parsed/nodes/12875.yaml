      <p>Jenni </p>
      <p>The earliest of the Old English variants is generally credited to Morris Benton at ATF in 1901. There were many others that followed: Intertype, BB&amp;S, more ATF, Ludlow, more ATF, Monotype. It was known as Engravers Old English, Engravers Old Black, etc. Likely the worst interpretation of blackletter ever to grace the planet.</p>
      <p>Gerald</p>
