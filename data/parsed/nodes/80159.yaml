    <p>Leibix, inspired by a jolly trademark of the past, is a fun family of five typefaces which transcends different eras of the past.  It has elements of the 1920s in its design, but is equally at home with projects having a 1970s theme of an up to the minute modern one.  Leibix is intended for eye catching cartoon captions, in posters of anywhere else a casual impact is required.</p>
    <p>Greater Albion is offering Leibix at an introductory 40% discount on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/leibix/ " rel="nofollow"> Myfonts</a>.</p>
