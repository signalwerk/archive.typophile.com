    <p>Free to members of <a href="/wiki/The%20Typographic%20Circle" class="freelinking" rel="nofollow">The Typographic Circle</a>. We aim to publish two editions per year (contributions and help are welcome). It is also available to non-members at a price of £10. Back issues can be ordered at a price of £6 if available.</p>
