    <p>I've been working on a logotype design, using <a class="freelinking external" href="http://www.linotype.com/searchresult?q=plantin" rel="nofollow">ITC Plantin</a> as the source font.</p>
    <p>Initially, I tried a number of weight variations before settling on one that I felt was most suitable. But it dawned on me that perhaps there may be some use in the alternatives when it came to displaying the logotype at different sizes. After all, typefaces are designed with multiple weights for just such occasions.</p>
    <p>It may be complete overkill, and I realise I could be making more work for myself than necessary. But I was wondering if anyone had any experience or knowledge of logotypes, or rather 'families' of logotypes, that have slight variations in weight/thickness for different display resolutions.</p>
    <p>Chris.</p>
