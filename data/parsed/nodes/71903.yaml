      <p>One problem with using multiple logo weights is that someone may accidentally use the "small" version in a large size and it looks way too heavy. On vice versa.</p>
      <p>Another problem is that it doubles the number of logos to keep track of. Most companies already have multiple versions of their logo -- a CMYK version, an RGB version, a version in PMS flat colors, a black-and-white version, versions with tag lines, versions without tag lines, etc., and if you do them in multiple weights then you've got to have 2 (or more) versions for each.</p>
      <p>Not trying to talk you out of it, but just be aware of the downside.</p>
