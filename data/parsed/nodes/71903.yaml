      <p>No matter what you do, someone will use the logo incorrectly. There is a 99% chance that that someone is in the IT department and "just needed to fit the logo in that footer". They will use the wrong size logo with the wrong color scheme in a location it should never be located with not enough space around it, per the spec. "The spec? What's that?".</p>
      <p>I've seen this poor scenario played out at every large corporation I've been a designer at, from Nationwide to AOL to Fortune 500 financial services companies.</p>
      <p>I can't count on 10 hands the number of times I've heard "the logo doesn't work on the web" only to find out the graphic designer gave a CMYK jpg reduced to 72 dpi to some poor unsuspecting .NET developer. I think it happens once a quarter :)</p>
      <p>Regardless, you should have a set of logos developed, but absolutely stick to the basics. Create specialized versions when the need arises so you can have the client use exactly what they need for exactly what they are trying to do.</p>
