    <p>Hello all,</p>
    <p>I am looking for a corporate typeface for a company about to enter the mobile phone service market and was wondering if anyone had any ideas.</p>
    <p>Here are some further details:</p>
    <p><strong>Audience</strong><br>
    working professionals, core being around 25-50</p>
    <p><strong>Message</strong><br>
    All aspects of the financial sector (traditional, secure, etc.) BUT ALSO sophisticated/clever, inventive, stylish</p>
    <p><strong>Media</strong><br>
    Mainly web-based (then only as display font), although there will be print advertising plus annual reports, etc. (then, of course, both as display and text font)</p>
    <p><strong>Special requirements</strong><br>
    The font should have an extensive special character set to work with most Latin character languages; if possible, the font should retain its characteristics/legibility in extremely small sizes (mobile phone screen), but also extremely large sizes (billboard advertising)</p>
    <p><strong>First ideas</strong><br>
    I am generally looking more in the sans serif direction; the font should be clean and legible, while keeping some small quirky elements/attention to detail.<br>
    I have already looked at <a href="http://www.fontshop.com/search/?q=malm%C3%B6&amp;site=d&amp;btnG=Go" rel="nofollow">Malmö Sans</a> (love the Headline version), <a href="http://www.fontshop.com/search/?q=reykjavik&amp;x=0&amp;y=0" rel="nofollow">Reykjavik</a> (added bonus of male/female versions).</p>
    <p>It would be brilliant if anyone has any ideas in that direction!</p>
    <p>Many thanks, Max</p>
