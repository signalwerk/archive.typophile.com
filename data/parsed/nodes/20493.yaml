    <p>I’m looking for a suitable sans and small caps faces to use with Gentium, since this beautiful (and free!) font comes with neither.</p>
    <p>Lucida Sans seems to be a good match, but it lacks caps and old-style numerals. Still suitable, though. I have no clue about which small caps face to use. I was thinking Apolline by Porchez, but I’d rather get some informed opinions before laying out the cash.</p>
    <p>Gentium is here: <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=Gentium</a></p>
