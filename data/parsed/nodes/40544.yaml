      <p>I remember a similar series of jokes from when I was a kid:</p>
      <p>Q. How do you get an elephant into the refrigerator?<br>
      A. You open the door and put him in.</p>
      <p>Q. How do you get a giraffe into the refrigerator?<br>
      A. Open the door, take out the elephant, and put in the giraffe.</p>
      <p>Q. The lion king calls all the animals to a big meeting. Who doesn’t show up?<br>
      A. The giraffe - he’s in the refrigerator.</p>
      <p> - Lex</p>
