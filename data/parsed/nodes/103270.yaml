  html: |-
    <p>Rolls is a typeface designed by Georg Salden. It belongs to the Eurostile font style. But what’s really interesting is the rather calligraphic italic, which forms a great contrast to the angular upright. Salden himself said that Rolls is one of his few typefaces that also can be slanted automatically. But only this gentle and zestful italic unfolds its charm.</p>
    <p>More <a class="freelinking external" href="http://www.typemanufactur.com/eng/fonts/rolls/overview.html" rel="nofollow">here</a> and <a class="freelinking external" href="http://www.behance.net/gallery/Rolls-Typeface/8815389" rel="nofollow">here</a>.</p>
