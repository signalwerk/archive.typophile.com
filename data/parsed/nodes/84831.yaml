    <p>Hello all! I'm a new member here, but have been impressed with the quality of the advice given here for some time now. I am sorry to barge in with a question, but hope you can forgive me and help me on my quest. Thanks!</p>
    <p>Short version: I'm looking for a typeface that says "warm and cozy coffeehouse/pub"</p>
    <p>Now, I have recently started working on a personal project (non-commercial) that can best be described a virtual coffeehouse or pub. An online hang-out, if you will. The place is called <em>Oldenburg's</em>, named after Ray Oldenburg, the professor behind the third place theory, stating that every person needs a neutral place other than home (first) and work (second) to socialize with his community.</p>
    <p>I have decided to <a class="freelinking external" href="http://www.oldenburgs.org/" rel="nofollow">blog</a> every step of the way and have now officially entered the stage of identity design. I'm really, really torn between a pub-like Copperplate or a—more personal—script for the logo typeface. In any case, it should be timeless, as if it could've been around for decades already.</p>
    <p>My question to the hive mind: what kind of logo typeface would you associate with a warm, cozy, homely "third place"? My <a class="freelinking external" href="http://www.oldenburgs.org/post/9171821801/did-a-moodboard-i-thought-my-palette-lacked" rel="nofollow">latest post</a> has a moodboard that might inspire ideas. And I know it's subjective as hell ;)</p>
    <p>Your opinion is very much appreciated!</p>
    <p><a class="freelinking external" href="http://www.oldenburgs.org/" rel="nofollow">http://www.oldenburgs.org/</a></p>
