      <p>Welcome!<br>
      Good mood board, I wish more people looking for advice would add one.<br>
      A <a href="http://new.myfonts.com/fonts/bitstream/clarendon/?refby=i" rel="nofollow">Clarendon</a> / Slab Serif comes to my mind. One with some nice little imperfections, like <a href="http://new.myfonts.com/fonts/urw/volta/?refby=i" rel="nofollow">Volta</a>, <a href="http://new.myfonts.com/fonts/urw/egizio-urw/?refby=i" rel="nofollow">Egizio</a>, <a href="http://new.myfonts.com/fonts/fontbureau/belizio/?refby=i" rel="nofollow">Belizio</a> etc (browse similar typefaces for more). I wouldn’t go for a more wood-type-y, decorated font, nor for the obvious candidate these days, the condensed grot (<a href="http://new.myfonts.com/fonts/fontbureau/titling-gothic-fb/?refby=i" rel="nofollow">Titling Gothic</a> of the like).</p>
