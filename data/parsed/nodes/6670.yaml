    <p>I know this isn't strictly related to type, but I am trying to impart some kind of 19th century flavor to a project I am working on. I've been looking for a while, not finding a heck of a lot, and I thought some designers here might know of some good CDs. <br> <br>&lt;a href="<a href="http://www.missmary.com" target="_blank">http://www.missmary.com</a>"&gt;Miss Mary&lt;/a&gt; is sorta close to what I have in mind, so is &lt;a href="<a href="http://www.oldtimeclipart.com" target="_blank">http://www.oldtimeclipart.com</a>"&gt;Old Time Clip Art&lt;/a&gt;, though they don't seem to be very high-res. (I'm asking them by email.) Here are some images that may give some idea of what I'm looking for. (I'd use the CD these came from, but they are all pretty lo-res.) <br> <br>Older art (of evil spirits from Middle Ages, for example) is okay too. <br> <br><!--attachment: Advertisement_077_copy-48903.unk*attachment_icon.gif*image/tiff*72.2*1*Advertisement+077+copy%2etif --></p><center><br>
