    html: |-
      <p>Creating a <cite>freezing quick</cite> logo using a typeface alone might not do it. What I mean is, there may be something potentially interesting in the actual letters used in spelling whatever the word or name is.</p>
      <p>When I create a logo I look at specific characters within what's being spelled, be it a word or initials. When you create a memorable and recognizable logo, you sometimes rely on the uniqueness of individual characters and not the whole typeface.</p>
      <p>Sometimes replacing or modifying one of the characters makes it sing.<br>
      Maybe instead of trying to look freezing it could look ultra futuristic giving it a super high-tech feel. Being literal is not always creative.</p>
      <p>Just for a trial reaction, spell the name out using the EPCOTT or DECOTECH fonts available on the Disney Experience site: <a href="http://www.disneyexperience.com/fonts.htm" title="http://www.disneyexperience.com/fonts.htm">http://www.disneyexperience.com/fonts.htm</a></p>
      <p>or SPACE AGE at MickeyAvenue Fonts:<br>
      <a href="http://www.mickeyavenue.com/fonts/spaceage/" title="http://www.mickeyavenue.com/fonts/spaceage/">http://www.mickeyavenue.com/fonts/spaceage/</a></p>
      <p>See if that melts their popcicle!<br>
      ---------------------------------<br>
      Yes, I'm old, but I'm back in style!</p>
