    html: |-
      <p>You might be able to use frost, as opposed to snow or icicles, in a non-corny way. There are <a href="//blog.chadbrandos.com/archives/2004/12/25/frost/" rel="nofollow">photos</a>  on the internet as well as <a href="http://www.fractality.com/950404/frost.JPG" rel="nofollow">fractal recreations</a> of frost that might give you ideas.<br>
      <a href="http://livingindryden.org/images/weather/frostOnly.jpg" rel="nofollow">Here's</a> another photo. Frost can be incredibly varied in look and sometimes quite beautiful. If you have swash caps, the ends might turn into frost - like frozone! Sometimes the most obvious is best, if well executed. Another way is to have Windsor solid and Freezer outlined with the frost inside, in a fat face like FF Trademarker fat. </p>
      <p>I don't know, they may look awful, or great. You could try.</p>
    html_clean: |-
      <p>You might be able to use frost, as opposed to snow or icicles, in a non-corny way. There are <a href="//blog.chadbrandos.com/archives/2004/12/25/frost/" rel="nofollow" class="link-external">photos</a>  on the internet as well as <a href="http://www.fractality.com/950404/frost.JPG" rel="nofollow" class="link-external">fractal recreations</a> of frost that might give you ideas.<br>
      <a href="http://livingindryden.org/images/weather/frostOnly.jpg" rel="nofollow" class="link-external">Here's</a> another photo. Frost can be incredibly varied in look and sometimes quite beautiful. If you have swash caps, the ends might turn into frost - like frozone! Sometimes the most obvious is best, if well executed. Another way is to have Windsor solid and Freezer outlined with the frost inside, in a fat face like FF Trademarker fat. </p>
      <p>I don't know, they may look awful, or great. You could try.</p>
