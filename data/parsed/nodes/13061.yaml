    html: |-
      <p>Yeah, I don't want anything lame like icicles.  I'm making a logotype for a freezer company.  They just have a warehouse where they freeze things for people.  They wanted to advocate that they did things quickly, hence why I wanted a typeface that advocated frost and speed.</p>
      <p>I'm still not really sure what I want to do for the logo type. Any of the obvious stuff is taken by competitors.  In fact, all of their competitors are some shade of blue, from teal to like navy blue.  They mentioned that they wanted some kind of stainless steel look, but even their largest competitors is already doing that.  So my main focus was to do something very different and unique for them.  Something to really set them apart from the rest of the competition.</p>
      <p>Some of their competitors use snow on top of the letters and it looks really, really gay.  Others have like snowmans and stuff.  It's just so unprofessional and ugly looking.</p>
      <p>Pretty much the best competitor is this site:<br>
      <a href="http://www.versacold.com/template.asp?pageID=5#warehouseserv" title="http://www.versacold.com/template.asp?pageID=5#warehouseserv">http://www.versacold.com/template.asp?pageID=5#warehouseserv</a></p>
