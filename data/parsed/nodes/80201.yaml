  html: |-
    <p>Here’s a list of typographic/design related items one can buy to help:<br>
    <a href="http://jeansnow.net/2011/03/15/japan-earthquake-disaster-relief/" title="http://jeansnow.net/2011/03/15/japan-earthquake-disaster-relief/">http://jeansnow.net/2011/03/15/japan-earthquake-disaster-relief/</a></p>
    <p>In particular, at <a href="http://wordshape.com/" title="http://wordshape.com/">http://wordshape.com/</a> 100% of all money generated by font sales are being sent to the Japanese Red Cross.</p>
    <p>I will again mention <a href="http://www.sogojapan.org/" title="http://www.sogojapan.org/">http://www.sogojapan.org/</a> and <a href="http://www.typesociety.org/fontaid/" title="http://www.typesociety.org/fontaid/">http://www.typesociety.org/fontaid/</a></p>
    <p>Someone knows of others?</p>
