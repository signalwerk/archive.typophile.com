  html: |-
    <p>I want to share with you a tool I developed to help us designers choosing fonts for our css stacks that are similar in aspect values and alphabet widths for a given font size.</p>
    <p>The tool, FontInstead, can gather metrics of the fonts you have installed on your computer and give you statistics about gathered font metrics.</p>
    <p>Please, visit <a href="http://adrianodigiovanni.com/fontinstead" title="http://adrianodigiovanni.com/fontinstead">http://adrianodigiovanni.com/fontinstead</a> to let FontInstead analyze your fonts and grow the list.</p>
    <p>FontInstead is a beta project. I would appreciate comments, suggestions, bug reports.</p>
    <p>Thanks in advance,<br>
    Adriano</p>
