    <p>Hello everyone, this is my first post here. I couldn't figure out this font with whatthefont or identifont or the help of a few co-workers, or going through my whole font library one at a time, so I ask if you recognize this font.</p>
    <p>I have a photo of the font, and a version where I blackened a selection of the letters, and a version where I blackened and sheared the letters back to an angle that seemed non-italicized. Thanks guys.</p>
