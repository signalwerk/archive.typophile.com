    <p>Greater Albion Typefounders has just launched the Doncaster family on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/doncaster/ " rel="nofollow"> Myfonts</a> and <a class="freelinking external" href="http://www.fontspring.com/fonts/gatf/doncaster " rel="nofollow"> Fontspring</a>.</p>
    <p>Doncaster is a bold display face which emphasises legibility and clarity, but which combines those qualities with a distinctive flair.  The designs have a timeless quality, making them equally at home today or even in Victorian inspired design work.  All of the faces are ideal for poster work, signage or for really eye-catching but not ostentatious headings and titles.  Seven faces are offered combining upper and lower case forms with incised and embossed decoration as well as an italic form.</p>
    <p>Here is a specimen sheet showing all seven faces:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Doncaster_Gallery5_4462.png"></div><p></p>
