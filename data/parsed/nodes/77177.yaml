      <p>Zeb -- <cite>Still haven't found a way to use stylistic set 7 in InDesign.</cite></p>
      <p>It is possible with a little trick, by activating the built-in World-Ready Composer. On Thomas Phinney's website there is <a href="http://www.thomasphinney.com/2009/01/adobe-world-ready-composer/" target="_blank">an article</a> about it, including an InDesign template document and scripts by Peter Kahrel both of which allow to activate the WRC. This screenshot shows some text typed right into the template document, with Gabriola and Stylistic Set 7 applied:<br><img src="/sites/default/files/old-images/Gabriola_SS07_in_IDCS4_5382.gif"><br>
      This is in CS4. I assume it works in CS5 too.</p>
