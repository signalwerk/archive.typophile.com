    html: <p>The clipping in Word is related to a performance optimization that treats each line with in a paragraph as independent when it is rendered to the screen. The “empty” space between lines is drawn as white, which can be drawn over other lines – and therefore clip those lines. When you print, the empty space isn’t drawn so hence no clipping.</p>
