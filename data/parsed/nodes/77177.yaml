    html: <p>My interpretation was that "ss07" does not work in InDesign because its native layout engine, in contrast to the WRC, is ignorant of type 2 lookups [one-to-many] which are involved in Gabriola's Stylistic Set 7. Other fonts' last Stylistic Set features seem to work in CS4. Of course it were nice if Adobe apps would support all lookup types by default.</p>
