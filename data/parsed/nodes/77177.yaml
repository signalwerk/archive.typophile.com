      <p><em>Still haven't found a way to use stylistic set 7 in InDesign. Oh well.</em></p>
      <p>Karsten, I don't think this is a WRC issue.</p>
      <p>There seems to be a bug in CS4 that results in the last stylistic set feature present in a font not working (even if there is only one stylistic set feature). In the case of Gabriola, this means the stylistic sets 1-6 work fine, but set 7 does not. I don't know if this is fixed in CS5.</p>
