    html: |-
      <p>The vertical metrics in the Gabriola font are set to prevent this kind of clipping, so it isn't a bbox issue. I've all but given up trying to understand how Word interprets those metrics, though, and how it relates to user choices about how to specify linespacing.</p>
      <p>I would experiment with setting linespacing as absolute values in point sizes rather than multiples, as this often removes clipping, even if the resulting linespacing is identical.</p>
      <p>As Si notes, the clipping should not appear when printed.</p>
      <p>I also advise against using stylistic sets 6 and 7 to address envelopes, unless you want all your mail to have to be manually sorted.:)</p>
