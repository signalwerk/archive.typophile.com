      <p>I think the top two samples could be House Neutraface bold. the M and G are alternates in the set.</p>
      <p>NITRO is a Latin style with those triangular serifs, but I'm having trouble finding ones with straight-legged R's. <a href="http://new.myfonts.com/fonts/nobodoni/nirvanium-nb/" rel="nofollow">Nirvanium</a> is sort of close, but the vertex on the N baseline is not wide enough.</p>
      <p>- Mike Yanega</p>
