    html: |-
      <p>Wow. I’m really surprised this is so ill received. Before everyone knocks portfolio by email let’s consider a few things:</p>
      <p>1. Is your final product typically in a digital medium? If so, a pdf should be <em>more than</em> suitable.<br>
      2. You have MORE limitations with a web site than a pdf.<br>
      3. Your work should speak for itself. You shouldn’t need to be there, in person, to explain anything.</p>
      <p>I can give even more concrete reasons to back myself up if the discussion turns to disagreement. Of course, (for example) if you’re applying to cut blocks for a printing press, a pdf might not be suitable medium for your portfolio. However, it’s 2008, so I can’t imagine you’re going <!--
