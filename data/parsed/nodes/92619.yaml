    <p>This might seem like a silly question. I never had to buy<br>
    licenses for anyone but myself.</p>
    <p>If someone wants to buy 5 licenses of a font I've created,<br>
    how do I supply that? After payment, do I send the font<br>
    with a EULA that specifically mentions how many licenses<br>
    are included for their specific purchase? Or is it the font file,<br>
    the standard EULA, and # of licenses included  only on the receipt?</p>
