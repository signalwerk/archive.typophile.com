    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Eastburghposter1_6669.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Eastburghposter2_4198.gif"></div><p></p>
    <p>Eastburgh is a bit upscale, but also a pragmatic character, as one who loves beautiful things. Good food but no frills. A good conversation with friends while enjoying a drink, the latter in moderation. Athletic as it is, it happily wears sturdy shoes that can take a beating - it provides a stable sense and it makes you feel comfortable while walking your dog in the Dutch polders. Eastburgh has a sense of humor with its frolic e and busty g, Y and y. It is somewhat cocky with his tight j, f and J and the stinging A, W, V, W, V and M. And then the N, which is not to be pushed around: simultaneously blunt and sharp.</p>
    <p>Now available at <a class="freelinking external" href="http://new.myfonts.com/fonts/atelier/eastburgh/" rel="nofollow">MyFonts.com</a></p>
