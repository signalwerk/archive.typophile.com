    <p>The wait is over and we're certain you'll flip over the fourth installment in our Machine Wash Image Filter Collection! We've pulled out all the stops to create the perfect compliment to our complete Machine Wash Filter Collection featuring 60 original NEW Wash Effects to texturize, age, and weather and distress your images in Photoshop.</p>
    <p>Get total control with our award winning GUI Plug-in Interface designed to apply our Wash Effects at a maximum live area of 18" x 18" at 300 dpi cause we knew you'd want the flexibility to use them for high resolution print projects as well as screen resolution web projects!</p>
    <p>Use the Machine Wash IV Image Filters whenever you're working with a design that could use a tactile textured look. Logos, apparel, advertisements, brochures, websites, plus so much more - You're only limited by your imagination, now that you have even more tools to get the job done.</p>
    <p>Developed by high end apparel and typeface designer, Brian J. Bonislawsky, he's created over 3,000 silkscreen t-shirt designs for such clients as: Universal, Hard Rock Cafe, SixFlags Theme Parks, Hang Ten, Norwegian Cruise Lines, NASA, Las Vegas Properties, Major League Baseball, and numerous major tourist attractions.</p>
    <p>Get yours for only $49.95 for any Machine Wash Volume or SAVE BIG $$$ when you buy all four Machine Wash Filter Collections online!</p>
    <p>Testdrive the NEW Machine Wash IV Image Filters online at: <a href="http://www.misterretro.com/machine_wash_filters_four.html" target="_new" rel="nofollow">http://www.misterretro.com/machine_wash_filters_four.html</a></p>
    <p>Or, view our entire Machine Wash Image Filter Collections at: <a href="http://www.misterretro.com/image_filters.html" target="_new" rel="nofollow">http://www.misterretro.com/image_filters.html</a></p>
