    html: |-
      <p>With Vietnamese, it occurred to me that even a simple copy paste with TextEdit in a .txt file on the Macintosh did not preserve the sequence of unicode characters. Both texts looked the same but were only <a href="http://en.wikipedia.org/wiki/Unicode_equivalence" rel="nofollow">Unicode equivalent</a>. For instance, the unicode character </p>
      <pre>  1EBF  LATIN SMALL LETTER E WITH CIRCUMFLEX AND ACUTE
      </pre><p>is equivalent to the three characters (its NFD decomposition)</p>
      <pre>  0065  LATIN SMALL LETTER E
        0302  COMBINING CIRCUMFLEX ACCENT
        0301  COMBINING ACUTE ACCENT
      </pre><p>To compare two strings str1 and str2, you then need to compare their normalized forms. With Python, you can use the <a href="http://docs.python.org/2/library/unicodedata.html" rel="nofollow">unicodedata</a> library; with Java, there is the <a href="http://docs.oracle.com/javase/7/docs/api/java/text/Normalizer.html" rel="nofollow">Class Normalizer</a>.</p>
      <p>On the Mac or on Linux, given two utf-8 encoded .txt files, you can simply normalize both line by line and then compare the normalized outputs with diff.</p>
