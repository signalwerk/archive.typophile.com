    html: <p> I like this. My only criticism on first glance is that some of the character widths seem to be inconsistent, primarily in the lower case characters. Lc "r" and "s", for example, seem a bit wide, while lc "k", "x" and perhaps "f" seem a bit narrow. <br> <br>On the whole, the upper case seems a bit narrow compared to the lower case, also. I'm not sure, however, if the upper case should be widened or if the lower case should be narrowed. I suppose it depends on the overall width you're going for. <br> <br>Aside from this, I like a lot of the design decisions you made. You've managed to soften and humanize a very rigid geometric genre. <br> <br>David </p>
