    html: |-
      <p>The word "italicize" certainly predates computer type, and simply means "to print in italics." Its usage is similar to "capitalize." It would be impractical for a grammar and style handbook to avoid straightforward verbs like "capitalize," "italicize" and "underline" when telling you what to do with your words.</p>
      <p>Nobody refers to an italicized word as "an italic word," because an Italic word would be one with roots in the Italic family of languages. It's like the difference between an emphatic word (one might say that "preposterous" is an inherently emphatic word) and an emphasized word (you can emphasize any word; it's a thing you <em>do</em> to it when you represent it in sounds or type).</p>
      <p>In typophile terms, you can only oblique a glyph, but you can italicize a letter. You italicize a letter by using an italic glyph for that letter.</p>
    html_clean: |-
      <p>The word "italicize" certainly predates computer type, and simply means "to print in italics." Its usage is similar to "capitalize." It would be impractical for a grammar and style handbook to avoid straightforward verbs like "capitalize," "italicize" and "underline" when telling you what to do with your words.</p>
      <p>Nobody refers to an italicized word as "an italic word," because an Italic word would be one with roots in the Italic family of languages. It's like the difference between an emphatic word (one might say that "preposterous" is an inherently emphatic word) and an emphasized word (you can emphasize any word; it's a thing you <em>do</em> to it when you represent it in sounds or type).</p>
      <p>In typophile terms, you can only oblique a glyph, but you can italicize a letter. You italicize a letter by using an italic glyph for that letter.</p>
