    <p>good morning/day/night,</p>
    <p>is the term <em>italicize</em> acceptable? to me, it has more to do with the way that most people use the italic button in programs like Word (and even Quark!) </p>
    <p>we all know that we're supposed to use the actual italic face, so when we do that, should we avoid use of the term <em>italicize</em>? is it better to simply say “…use an italic face” or something like that?</p>
    <p>has this term been used in the past or is it a reflection of more common type usage?</p>
    <p>i guess it just bugs me when the term appears on client revisions…</p>
