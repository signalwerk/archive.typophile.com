      <p>From the OED (the M-W agrees):</p>
      <p><strong><em>trans.</em> To print in italics, or (in writing) underscore with a single line as a sign that the word or words thus marked are to be so printed, or in order to emphasize or otherwise distinguish them.</strong><br>
      <cite>1795 PARR Rem. Statem. Combe 78 In p. 17 of his pamphlet the Dr. has printed, but not italicised another inaccuracy. 1858 RUSKIN Arrows of Chace (1880) I. 139 The words which I have italicized in the above extract are those which were surprising to me. 1865 Spectator 28 Jan. 100 The lines we have italicized are lines of very great beauty. 1871-3 EARLE Philol. Eng. Tongue (ed. 2) §30 There are no words in the Latin answering to the words which are italicised in the English version.</cite></p>
