      <p><em>are you saying that the (newer) bold button replaces the font with the true bold weight?</em></p>
      <p>the purpose of these buttons in most applications it to call the <a href="/wiki/style_linked" class="freelinking" rel="nofollow">style-linked</a> <a href="/wiki/bold" class="freelinking" rel="nofollow">bold</a>, <a href="/wiki/italic" class="freelinking" rel="nofollow">italic</a> and bold italic fonts. However, some applications (like MS office apps) may apply <a href="/wiki/faux%20formatting" class="freelinking" rel="nofollow">faux formatting</a> if there is no bold or italic style linked to the font.</p>
  - id: 120443
    user_id: 2021
    user_name: Nick Shinn
    user_path: null
    date_raw: 26 Apr 2006 — 12:07pm
    date: 2006-04-26T12:07:00
    votes: null
    html: |-
      <p>Well put Kevin.</p>
      <p>It's also true that in the derivation of a verb from a noun or adjective, the first option to consider is using the word as is, unchanged. So, the word <em>italic</em> could theoretically be used as a verb, which is what happens with <em>underline</em>. So, "Did you underline/italic that phrase?"</p>
      <p>But given the choice, people tend to prefer a word which contributes to a pleasant rhythm in sentences (and also perhaps looks good and reads well), even if, considered in isolation on purely grammatical grounds, it contains redundancy.</p>
      <p><em>Underline</em> sounds nice, no need for underlinify or underlinize.</p>
