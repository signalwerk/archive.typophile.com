    <p>Hi,</p>
    <p>I really like this font but I am looking for something with more weights. An opentype face with lots of glyphs would be great too.</p>
    <p>Things I like about this face is </p>
    <p> - its condensed nature,<br>
     - vertical terminals on diagonal characters (e.g leg of the R)<br>
     - and the digits</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Thanks,</p>
    <p><a class="freelinking external" href="http://andychung.ca/work/neighbourhood/ " rel="nofollow"> Link to Neighbourhood</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/neighbourhood_4223.png"></div><p></p>
