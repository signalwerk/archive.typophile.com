    date: 2010-07-05T14:53:00
    date_raw: 5 Jul 2010 — 2:53pm
    votes: null
    html: |-
      <p>Hi</p>
      <p>Thanks for all your nice words about hyphenator.js (It makes me feeling great;-)<br>
      I just stumbled upon this very interesting discussion and I'd like to share some thoughts:</p>
      <p>(a) When I started the hyphenator.js-project I wasn't sure if it is right to do such things in Javascript. In my opinion this definitely should be done by the browser. But the parts of the CSS3-Specification treating hyphenation haven't changed for a long time and there seems not to be much work on it currently. So I thought it would be nice to have this 'crutch'. And I hope that it is used and that the demand for a native solution grows with it. I think that Bram Steins excellent work tends to create the same demand.<br>
      And if there are some browsers supporting hyphenation and/or hq linebreaking it's great to have this 'crutches' for the others in the meantime.</p>
      <p>(b) As every JS-library guy, I'm struggling with browser flaws an inconsistencies. It's often hard to decide, if I should wait for the browser to fix it or if I should do a hack to work around it.<br>
      The issue with copy and paste is just one example. BTW: it's fixed. Thanks to <a class="freelinking external" href="http://github.com/aristus/sweet-justice" rel="nofollow">sweet-justice</a><br>
      @Richard Fink: it's the same approach you made. We did some double work here. Are there more such nice things to come?</p>
      <p>(c) Many people are asking for new features. Meanwhile I'm trying to hold the library as small as possible and for most requests there are two answers: 'it's already in there' or 'it shouldn't be in there'.<br>
      Having a selector engine to select elements to be hyphenated is one of it. In hyphenator.js one can redefine the <a class="freelinking external" href="http://code.google.com/p/hyphenator/wiki/en_PublicAPI#property_selectorfunction" rel="nofollow">'selectorfunction'</a> so it's not necessary to include an engine that has to be loaded twice if there are other libs that use it.</p>
      <p>(d) I did a lot of investigation about how to avoid the 'shotgun method' (nice wording, though;-). The problem is that changing the DOM is very expensive and measuring lines and getting hints about where the line is broken means inserting a lot of spans (and re-doing the whole process upon resizings). So the actual method is ugly but turned out to be very effective.</p>
      <p>Greetings from Switzerland,<br>
      Mathias</p>
