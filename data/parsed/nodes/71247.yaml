      <p><cite>(i.e. closer to the global minimum amount of word-spacing per paragraph.)</cite></p>
      <p>Shouldn't that be the global <em>optimal</em> word-spacing?</p>
      <p>As for 'widows and orphans', those are per definition page terms. On a web page, the page vertically never ends, so you'll never have to worry about windows or orphans! I think Richard may mean 'runts' -- a very short last line of a paragraph. Those can be avoided by stopping scanning for feasible breakpoints before the end of the actual paragraph is reached.</p>
