      <p>One thing to note here, hyphenation controls are included in the Editor's Draft of the CSS3 Paged Media spec:</p>
      <p>  <a href="http://dev.w3.org/csswg/css3-gcpm/#hyphenation" title="http://dev.w3.org/csswg/css3-gcpm/#hyphenation">http://dev.w3.org/csswg/css3-gcpm/#hyphenation</a></p>
      <p>I don't know if there are any implementations of this already (Prince? Antenna House?) but it would interesting to hear opinions as to whether these properties cover the desired functionality.  The hyphenation resource property is interesting, it avoids the problem of how to cover a wide set of languages.  Seems like it might be good to include 'auto' in there, to pick up system dictionary resources if available.</p>
