    html: |-
      <p>@Richard Fink</p>
      <p>For the record, I do not know for sure that Internet Explorer uses the Knuth and Plass algorithm for justification when <code>text-justify</code> is set to <code>newspaper</code>. I only compared the justification of my implementation with the one created by Internet Explorer, and found them to be identical for my sample text.</p>
      <p>I agree that just hyphenation (using Hyphenator.js or some other script) is the more practical solution right now. I'm hoping to convince browser authors to implement the Knuth and Plass algorithm instead of trying to provide this as a drop-in script. I'm looking forward to your article (is it going to be published at ALA again?) Are you planning on mentioning the sub-optimal justification done by most browsers? I was planning to write a technical article on that, but perhaps I don't need if you cover it as well.</p>
      <p>With regards to re-rendering; almost every change to a page requires re-rendering, the question is where that re-rendering is executed. With Hyphenator.js it is done by the browser, with my implementation it is done by JavaScript. Both are doing essentially the same---calculating font metrics, and re-doing the justification. The greatest slow down in my implementation is not actually the Knuth and Plass algorithm (which runs very fast) but getting font metrics back from the browser. I'm currently not caching any of the measurements I do, so there is room for improvement there. There are however a myriad of other problems as you mentioned. I'm slowly working my way through them, but I doubt it will ever be as good as a native implementation. It is kind of fun to see how far I can push it though :)</p>
