      <p>Thing is, depending on the device it’s displayed on and the users settings the width of a text block will vary. That is the nature of the web, but also what gives it it’s unique quality. </p>
      <p>I’d love to see this as a CSS feature, with desired justification specified as a percentage number or a few level keywords like for example “tight”, “normal” and “loose”. </p>
      <p>font-align: justify;<br>
      desired-justification: 90%;</p>
      <p>It would have to be smart enough to adjust the percentage according to the width, though.</p>
