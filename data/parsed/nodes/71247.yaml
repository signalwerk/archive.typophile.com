      <p>Bram&gt;There is also a proposal for a CSS3 text-justify property, but it seems they leave the actual justification algorithm up to the browser.</p>
      <p>So this is pretty exciting. </p>
      <p>JDagget&gt; Seems like it might be good to include 'auto' in there, to pick up system dictionary resources if available.</p>
      <p>I think it'd be cool to survey the roles of the Composer (in an old letterpress shop), a role which the browsers don't seem quick to embrace and foundries are not likely to fully play. Role 1 is computing which glyphs are required for a particular document (subsetting, not traditionally foundry business), Role 2 is knowing which of the glyphs to use when the right pairs or groups of characters occur, (with OT, founders and browsers can-do together, someday), Role 3's knowing how to break lines according to every language, including the rules of role 2, (hyphenation, nice like you see it here for English), so in Role 4 the composer can be getting even lines at a given column width if "the boss" says so, (justification, nice like you see it here for English in this font at this size, leading and line length).</p>
      <p>I don't know how that relates to the hooks and barbs CSS has and needs, but the role of the Composer is hardly diminishing over time on the web. No party in the modern process except the browsers can actually put it all together. Can they?</p>
      <p>I can't wait for the next episode.</p>
      <p>Cheers!</p>
