    html: |-
      <p>Finally! Knuth on this in <em>The TeXbook</em> (1984):</p>
      <p>"TeX breaks lists of lines into pages by computing badness ratings and penalties, more or less as it does when breaking paragraphs into lines. But pages are made up one at a time and removed from TeX's memory; there is no looking ahead to see how one page break will affect the next one. In other words, TeX uses a special method to find the optimum breakpoints for the lines in an entire paragraph, but it doesn't attempt to find the optimum breakpoints for the pages in an entire document. <em>The computer doesn't have enough high-speed memory capacity to remember the contents of several pages</em>, so TeX simply chooses each page break as best it can, by a process of "local" rather than "global" optimization."</p>
      <p>(my emph.)</p>
      <p>(It's possible you already read and memorized every page.)</p>
