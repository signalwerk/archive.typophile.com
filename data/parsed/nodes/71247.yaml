    html: |-
      <p>@Mathias Nater<br>
      &gt;http://bitbucket.org/webvariants/jquery-hyphenator/wiki/Home</p>
      <p>Thanks! I have to experiment with it. I'll post a page along with some other plugins that add some touchscroll functionality and other fun stuff.<br>
      (I don't know about anybody else, but I find it easier to read a scrolling document if I can push it up slowly with my mouse acting like a finger on a touchscreen. Like you can do in a PDF. Makes it easier to keep my place in the text.)</p>
      <p>I also found out just today that the epub format can be unpacked, the individual files posted on a web server, and read by a javascript library.</p>
      <p>This is all getting more and more interesting.<br>
      Being done <a href="http://threepress.org/static/epubjs/" rel="nofollow">here</a> with <a href="http://blog.threepress.org/2009/02/09/introducing-epubjs/" rel="nofollow">epubjs</a>.</p>
      <p>Now, I don't think anybody's incorporated hyphenator.js into *that* yet.</p>
      <p>Here's more info, it seems there are some other ePub javascript readers, too:<br>
      <a href="http://ajaxian.com/by/topic/ebooks" title="http://ajaxian.com/by/topic/ebooks">http://ajaxian.com/by/topic/ebooks</a></p>
      <p>I'm going to start writing my article in earnest now, and shine a light on all this stuff.<br>
      I'll email you and come back here, too.</p>
      <p>@frode<br>
      &gt;Are there any issues with @font-face?<br>
      No.<br>
      And as far as printing I found -  testing in IE and Firefox - that as long as the style sheet has the right media attribute or @media rule: "all" or "print", an external font prints fine, too. And I'm able, in the print style sheet, to get the in-between font sizes: like the difference between 16pt, 16.5pt, and 17pt that the browser won't distinguish because everything has to snap to the pixel grid. (Values of 12.5 px not being allowed.)<br>
