      <p>Ah, yes: from a point of view of <em>adjustment</em> to space it should be as minimal as possible, either positive or negative.</p>
      <p><cite> It would be possible to avoid runts by choosing one that might be (slightly) less optimal but has one line more or less to avoid single word lines. I think early stopping might also work, but I haven't tried that yet.</cite></p>
      <p>I don't even know why I wrote that down! I was, in fact, thinking of the TeX way: find all breakpoints but assign a penalty for the final line length; huge for a very short line, small for a rather short line, and perhaps a negative value ("I want this!") if it's an exceptionally <em>good</em> last line (by some objective definition ...).</p>
      <p>I don't think this will need any adjustment of the rest of your code -- i.e., a paragraph <em>is</em> typeset optimally if it avoids an ugly runt at the end.</p>
