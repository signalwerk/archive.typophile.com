      <p>@Richard Fink</p>
      <p>Perhaps my statement about not releasing the code came out a bit weird. I'm not holding back any code for idealogical reasons. :) I merely made a proof-of-concept implementation but never actively promoted it because there are some limitations to it. I have now added the proof-of-concept to the Typeset page at:</p>
      <p><a href="http://www.bramstein.com/projects/typeset/" title="http://www.bramstein.com/projects/typeset/">http://www.bramstein.com/projects/typeset/</a></p>
      <p>The code can be found on my Github page (browser-assist.js):</p>
      <p><a href="http://github.com/bramstein/javascript/tree/master/src/typeset/" title="http://github.com/bramstein/javascript/tree/master/src/typeset/">http://github.com/bramstein/javascript/tree/master/src/typeset/</a></p>
      <p>What it does is split a paragraph into lines according to the line breaks found by the Knuth and Plass algorithm and then wraps each line in a span element with an individual CSS word-spacing attribute.</p>
      <p>The main problem with this approach---and the main reason I think this should be done in the browser---is floating elements (i.e. elements that affect the layout of the text.) A JavaScript implementation would need to measure the "shape" of the text before it can do line breaking. As far as I know there is no easy way to get this text "shape" back from a browser, you can only approximate it by trying to lay out text and see where line breaks happen.</p>
      <p>I'm still thinking about an efficient way of solving the above problem in JavaScript. If successful it would be possible to create a script that fixes both justification and hyphenation until browsers implement it natively.</p>
      <p>As an aside, someone (@lqd on Twitter) combined my Typeset code with hyphenator.js and sent me the following screenshots:<br>
      * <a href="http://twitpic.com/1zdlh6" title="http://twitpic.com/1zdlh6">http://twitpic.com/1zdlh6</a><br>
      * <a href="http://twitpic.com/1zdh4a" title="http://twitpic.com/1zdh4a">http://twitpic.com/1zdh4a</a></p>
