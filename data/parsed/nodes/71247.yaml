    html: |-
      <p>@frode</p>
      <p><em>By “smart” I’m thinking it should be able to detect the width of the block and adjust the desired percentage accordingly.</em></p>
      <p>Thanks for this. I've done quite a bit of experimentation with H&amp;J in browsers but I never really thought about handling the column width (measure) as a "liquid" variable before now. Just fixed-width. (In pixels at least, which isn't physically fixed like print.) There is probably some ratio that can be determined.</p>
      <p>@james puckett<br>
      <em>And of course, this raises an interesting question about H&amp;J on the web—should it be done by the browser, or should designers have more control as they do in print?</em></p>
      <p>As far as justification, there's already quite a lot of control using the CSS word-spacing and letter-spacing properties along with either the HTML spacer entities or the Unicode general punctuation spaces. (But the font needs to have them to use them.) These things in combination will give control down to the pixel level, at least. Just tightening or loosening the word-spacing can have a big effect. In a print style sheet, where things don't have to be rounded for the raster grid, I would imagine you get about as much control as you can in any app. (Gotta test that, though. Never checked.)<br>
      As far as hyphenation, the soft hyphen is supported now in every major browser and there's a javascript implementation of Franklin M. Liangs hyphenation algorithm from LaTex available that works pretty darned well. I suppose a native in-browser implementation would be a bit more thorough, but not by much. (I can only vouch for how it works for English.)<br>
      The biggest problems I've run into stem from how different browsers work with the em unit. Rounding and such. Plus, I've never been able to get rid of at least some reflow on Zoom which runs the risk of text that looks fine at 100% but sprouts widows and orphans and other undesirables at, say, 130%.<br>
      And then, because soft hyphens are added at every available breakpoint, there's also a need to remove them via javascript on cut-and-paste. Detecting line endings and placing the soft hyphens more selectively would be more elegant, but tough to do cross-browser right now.<br>
      It's a pain. But a lot of control <em>is</em> already there with CSS. And whether or not the browser handles hyphenation, that won't change.</p>
