      <p>@jdaggett</p>
      <p>Thanks very much for the heads up. I'll look over that spec carefully.<br>
      I do think Prince supports H&amp;J but not sure how they're implementing it.<br>
      Must look.</p>
      <p>@bram stein, frode, theunis, et al:</p>
      <p>Here's a crude and <a href="http://readableweb.com/justify/Conrad_Heart_chap1.htm" rel="nofollow">basic page</a>, but with pretty decent H&amp;J, I think.<br>
      Using a font stack of constantia, georgia, serif.<br>
      It's the first chapter of Joseph Conrad's Heart Of Darkness.<br>
      Looking good in Chrome, FF, IE, Opera, Safari.<br>
      You can Page Zoom it, Text Zoom it, and it still holds up. (The font-size is px, so IE's text size menu won't do squat.)</p>
      <p>Uses Sizzle as the selector engine and my own fork-in-progress of hyphenate.js.<br>
      Many improvements to make, still, but so far, I like the results.<br>
      (I would love some font-family/font-size/word-spacing/line-height/column-width widgets on the page to speed up the design process instead of bouncing back and forth from the style sheet to the browser. Only a matter of time, I guess.)</p>
      <p>My next move might be to do a print style sheet using points and inches instead of pixel values and see how that pans out. Try some different stuff and print to PDF's to see what's coming out. Break out of the pixel grid a little.</p>
      <p>Print stylesheets never got much traction - they remain largely unexplored territory. But if you can include a printable version of a document with really nice typography along with the screen version, that would seem to make a lot of sense to do. No?</p>
      <p>Anyway, that seems to be what the folks at Prince and Antennae House that JD mentioned are banking on - with PDF as the intermediary format.</p>
      <p>Rich</p>
