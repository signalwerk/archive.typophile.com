      <p>Thanks.<br>
      Media Queries (CSS3) hold the most promise for getting the text to fit the viewport with the least amount of hassle. But there's stuff that can be done now, today, that will work pretty well, too.<br>
      I played around with H&amp;J quite a bit last year and there's tricks I didn't pull out for this demo.<br>
      For font sizing - unless you provide a Text Size widget in the page itself - we're stuck with Zoom. But it does Zoom and re-hyphenate without any hiccups.<br>
      Makes you wonder WTF is up with iBooks, doesn't it?</p>
      <p>@Mathias Nater </p>
      <p>You da man! I like the way you constructed hyphenator.js a lot. It's easy to follow what function is doing what. Easy to see where to hook in something like a selector engine, for example. Or the copy-paste fix. (Next problem is dealing with the right-click contextmenu.) The browser makers should be automatically stripping the soft-hyphens. I'm going to file bug reports on it and personally bug the sh-t out of them about that.<br>
      &gt;the actual method is ugly but turned out to be very effective<br>
