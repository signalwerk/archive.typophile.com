      <p>@mn<br>
      Yeah, I saw the merge and pack. An excellent idea as well. There's a lot more optimization is to be had by cutting down the HTTP requests through incorporating everything into a single .js file than anything else. At least on the first visit, with nothing in the browser cache, that's for sure.</p>
      <p>Also, as long as we're rockin' and rollin' in the optimization department, there's a little used default behavior in IE6, 7, and 8 (don't know about 9 yet) called the userData behavior that gives you expanded local storage. Like a super-large cookie. Sort of a precursor to webstorage.</p>
      <p>http://msdn.microsoft.com/en-us/library/ms531424(VS.85).aspx<br>
      <em>The userData behavior persists information across sessions by writing to a UserData store. This provides a data structure that is more dynamic and has a greater capacity than cookies. The capacity of the UserData store depends on the security zone of the domain. The following table shows the maximum amount of UserData storage that is available for an individual document and also the total available for an entire domain, based on the security zone.</em></p>
      <p>I've used it and it works. I'll play around with it as time allows and let you know if I think it can be helpful to Hyphenator.</p>
      <p>rich</p>
