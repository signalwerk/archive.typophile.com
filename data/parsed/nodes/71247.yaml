      <p>@Mathias Nater,</p>
      <p>Good to see you join the discussion! How was BachoTeX? I couldn't make it unfortunately.</p>
      <p>I'm not sure if I can take justification to the same level that you've taken hyphenation. Doing proper justification requires a lot of measuring and DOM modifications. What it comes down to is redoing (in JavaScript) most of the work the browser has already done. I'm actually surprised by how far I've gotten.</p>
      <p>You said people are asking for more Hyphenator.js features. Here's a new one, I would like to have less features. Do you have any plans to make Hyphenator.js more modular? I am mainly interested in the hyphenation core and don't have much need for all the DOM manipulation code. You could of course bundle the modules in a single file for distribution like you do now.</p>
      <p>@Richard Fink</p>
      <p>I'm actually working on an ePub reader with proper hyphenation and justification, hence my interest and recent work on the subject :)</p>
      <p>Dealing with the pixel grid has been interesting: it seems Webkit based browsers actually round values before they use them in their calculations while Gecko (Firefox) based browsers use the values and then round the result. The latter is of course preferred by me because I can then set word-spacing to values less than one pixel, and have it distribute the word-spacing evenly before snapping to the pixel grid. (You can do this manually in Webkit based browsers, but it is a bit more involved.)</p>
