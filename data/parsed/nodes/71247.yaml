    html: |-
      <p>Frode told me you were having an interesting discussion here about my line breaking implementation so I thought I would chime in. In my opinion justification should be done by the browser, preferably with some user defined properties. However, this won't be that much of an improvement until browsers also support hyphenation, which in turn requires them to know or detect the language of any given page. Even though those features won't be implemented any time soon, I believe that replacing the current text layout engines with a Knuth and Plass based algorithm would increase the quality of justification on the web. The Knuth and Plass line breaking algorithm guarantees results no worse than the naive implementation browsers currently use.</p>
      <p>If I remember correctly, Internet Explorer exposes a <a href="http://msdn.microsoft.com/en-us/library/ms534671(VS.85).aspx" rel="nofollow">CSS property</a> that affects justification. There is also a proposal for a <a href="http://www.w3.org/TR/css3-text/#text-justify" rel="nofollow">CSS3 text-justify property</a>, but it seems they leave the actual justification algorithm up to the browser.</p>
      <p>I ran into similar problems as those mentioned by Richard Fink. Wrapping each line in an element and setting the word spacing is fragile (at best) since there is no way to get reliable font metrics back from the browser. Print stylesheets would still need flexible widths as there are different paper sizes and orientations, all out of your control. That's the beauty of the web :)</p>
