    html: |-
      <p>@frode frank</p>
      <p>See the "Assisted browser line breaks" section and below.</p>
      <p>@Richard Fink</p>
      <p>I had a go at a bit more serious implementation today:</p>
      <p><a href="http://www.bramstein.com/projects/typeset/flatland/flatland.html" title="http://www.bramstein.com/projects/typeset/flatland/flatland.html">http://www.bramstein.com/projects/typeset/flatland/flatland.html</a></p>
      <p>The page contains two texts: the one on the left is justified by your browser, the text on the right is justified by my implementation and hyphenated by Hyphenator.js. Canvas is not used. Both texts use fonts from Google's Font Directory. I have tested it in Firefox, Safari and Chrome, and all seem to work.</p>
      <p>There are some (small) problems but I think most of them can be worked out:<br>
      * Selection looks ugly (this is to workaround a bug in Webkit that ignores subpixel word-spacing)<br>
      * Copied and pasted text includes the soft hyphens<br>
      * Chrome sometimes executes the H&amp;J before activating the font (refreshing usually fixes it.)<br>
      * Floating elements are not yet supported (that is what I meant with the "shape" of the text, the line breaking algorithm needs to take the space that floating elements take up into account.)</p>
      <p>Loading may look slow, but that is mostly caused by downloading the fonts from Google's Font Directory. Only then can the H&amp;J algorithm run (as it needs the correct font metrics.)</p>
      <p>What exactly do you mean by finding where line-breaks occur in all browsers?</p>
