  html: |-
    <p>Greater Albion Typefounders has just released Clementhorpe on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/clementhorpe/ " rel="nofollow"> MyFonts.com</a>.</p>
    <p>Clementhorpe is inspired by the lettering on an early 20th century enamel advertisement-for chocolate. From the dozen or so hand drawn letters found in that source we have constructed a family of Roman faces for display and text work, with bold weights, an italic form as well as condensed, small capital and title forms, all (hopefully!) preserving the fun of their inspiration.  Here's a sample of Clementhorpe 'in action':</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Clementhorpe_Gallery1_3851.png"></div><p></p>
    <p>We've just posted further samples on our <a class="freelinking external" href="http://gatf.wordpress.com " rel="nofollow"> blog</a>.</p>
    <p>We intend the Clementhorpe family to provide a complete solution for early 20th century inspired design work with Character, offering all the faces needed to complete a project or a range of projects within the one type family. </p>
    <p>This is our largest family to date, with twelve faces-one of which, the italic form, is available free on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/clementhorpe/ " rel="nofollow"> MyFonts.com</a>.</p>
