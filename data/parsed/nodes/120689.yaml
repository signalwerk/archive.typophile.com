  html: |-
    <p>This is a monogram I have been working on for a school. My problem is with the width relationships between the stem, the leg and the arm of the K. I think I'm almost close to nailing it but it's such a difficult letter.</p>
    <p>I also tried to compensate for the brightness of the F making it slightly narrower on the stem than the J and the K.</p>
    <p>Thanks for your time.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Monogram_4089.png"></div><p></p>
