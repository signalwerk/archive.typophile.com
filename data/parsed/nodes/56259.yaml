      <p>I agree with sii.</p>
      <p>Though some may say an American face should have been chosen (Gotham, for example, or any of the myriad others [no, not <em>that</em> Myriad]), I think Optima has an arguably American feel to it.</p>
      <p>But more importantly, why "seriously?" in regard to Optima? Sure it's overused, happens to be a system font, and lots of other appropriate faces could have been used, but really, this is a great example of the right tool for the job (which, after all, is one of the tenets of good typography).</p>
