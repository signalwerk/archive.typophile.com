      <p>You might find these 2 docs interesting: first is a photo of the interior of Santa Croce Basilica (in Firenze), and on the floor, you can see the gravestone (in Roman churches, it is a very common view to see gravestones of important people on the very floor of the church; most of the time an early priest, William the Conqueror on the floor of Abbaye aux Hommes in Caen / Normandy, Grace Kelly in Monaco, etc). On the second photo, you'll see a close-up of the gravestone. That's THIS gravestone Hermann Zapf used to design Optima. By looking at the letters, one can understand the genius of Zapf - Optima is quite different and refined IMHO.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Santa_Croce_interior_5978.JPG.jpeg"></div><p></p>
