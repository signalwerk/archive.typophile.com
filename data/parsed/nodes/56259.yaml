      <p>With respect to those posting good information about Optima's pedigree, and admitting that the font looks better in use for this project than it seemed to me it would before I saw the images:</p>
      <p>The connection to Lin's Vietman memorial is <em>precisely</em> the reason why I think Optima is a bad choice. Most people in the US would not be able to tell you Optima's name, but they have seen images of the memorial (if they haven't been there themselves), and seeing the font in political and military contexts inevitably evokes the memorial, and by extension, people's opinions about the war. I am convinced that this is why McCain's campaign chose Optima, and why they used it light against dark--to evoke the memorial, the war, and people's memories about the war, hence to associate McCain with his fallen fellow servicemen and -women and to activate the emotions and issues and divisions people used during and after the war to frame political questions and sort information about the 2008 presidential campaign.</p>
      <p>No matter where you stand on the so-called 'global war on terror', and no matter what you think about Vietnam and about the political divisions in the US it prompted and reinforced, those emotions and issues and divisions are not an appropriate way to frame the September 11 attacks. The people who died in the crashes and collapse were not analogous to soldiers, the hijackers were not analogous to the Viet Cong or the NVA, al-Qaeda and the Islamist movement are not analogous to Chinese or Soviet communism, and the fights over how to respond to terrorism not analogous to the debates in the US between the hawks and the doves. </p>
      <p>To draw the connection on purpose, even in a subtle way, is to invite people to remember the attacks and evaluate policy and events in the intervening years in an unproductive and misleading way at best. At worst, it reinforces the efforts of those in the US who would like nothing more than to relive the last 40+ years of American political-culture warfare on a global stage, with new names for the antagonists.</p>
      <p>The board should have stuck with Scala.</p>
