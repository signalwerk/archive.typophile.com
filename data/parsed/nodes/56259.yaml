      <p>It's not militarism I'm talking about; the issue isn't that visitors will somehow see Optima and want to kill terrorists harder. It's that a memorial to the victims of the September 11 attacks uses an important part of the design vocabulary of a prominent national monument to the soldiers who died in another war, in a way that I think unmistakably and inappropriately evokes in the viewer's mind that other war as a framework for interpreting the September 11 attacks.</p>
      <p>Do people here think that visitors to the site will not draw the connection? As a designer, do you think that the meaning and significance of the elements you use in a design are purely a matter of the history and contexts you as the designer choose to think about (basilicas in Firenze and German type designers, not wars in SE Asia and black granite memorial walls) and not what people who see what you do bring to your design? It doesn't matter that they won't know Optima's name. William's right that Optima gets used in many contexts that don't evoke Lin's memorial. But in <em>memorial</em> contexts, where the viewer is invited to <em>mourn people who died</em>, the connection is immediate (if not wholly conscious).</p>
      <p>People respond automatically and emotionally to elements of design all the time, based on their personal experience and the culture they share with others; designers make choices about what elements to include in their work based on the assumption that they do. Why should we think that isn't true here?</p>
