  - id: 580671
    user: 88704
    date: 2014-06-14T08:50:00
    date_raw: 14 Jun 2014 — 8:50am
    votes: null
    html: <p>Thing is, based on the layout style, the subject matter (a guide to exotic fruits), the oxidization colour of the paper and the presence of a section in Univers at the far right, I'd say this is from the mid-eighties at the very earliest, probably a decade later. Don't think any Swedish newspapers were still using hot-metal processes at that point, let alone letterpress, and most had already switched over to digital.</p>
    html_clean: <p>Thing is, based on the layout style, the subject matter (a guide to exotic fruits), the oxidization colour of the paper and the presence of a section in Univers at the far right, I'd say this is from the mid-eighties at the very earliest, probably a decade later. Don't think any Swedish newspapers were still using hot-metal processes at that point, let alone letterpress, and most had already switched over to digital.</p>
