    <p>While visiting some family my grandmother had an old article from a Swedish newspaper taped to the inside of a cabinet. Anyone know the name of the headline slab serif being used?</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_2766_4895.JPG"></div><p></p>
