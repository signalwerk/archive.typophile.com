      <p>First of all, I think calling this a slab serif is not correct. Both previous suggestions are close, and I want to add <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/monotype-century-schoolbook/?refby=bowfin" rel="nofollow">Century Schoolbook</a> as another that I think is close.</p>
      <p>Apparently there are untold versions of Century/Scotch Roman faces that were created in metal type, and what we can do is suggest similar digitized fonts, but the choices are relatively narrow compared to what probably existed in metal type.</p>
      <p>- Mike Yanega</p>
    html_clean: |-
