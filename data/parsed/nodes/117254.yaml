    date_raw: 14 Jun 2014 — 8:58am
    votes: null
    html: <p>(Also, the headline's negative leading – not sure about phototypesetting, but it seems to me to be a feature distinctly of the digital age. And IIRC four-colour printing of photographs would not feature in most newspapers before the 90s.)</p>
