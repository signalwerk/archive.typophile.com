      <p>Mike, I agree that Scotch Roman is a good category to check for a match. Luc Devroye has a page with a wealth of information on Scotch Roman <a href="http://luc.devroye.org/scotchroman.html" title="http://luc.devroye.org/scotchroman.html">http://luc.devroye.org/scotchroman.html</a><br>
      Some good digital versions of Scotch Roman  and similar designs:<br>
      Monotype Scotch Roman <a href="http://www.myfonts.com/fonts/adobe/monotype-scotch-roman/" title="http://www.myfonts.com/fonts/adobe/monotype-scotch-roman/">http://www.myfonts.com/fonts/adobe/monotype-scotch-roman/</a><br>
      Scotch FB [David Berlow] <a href="http://www.fontbureau.com/fonts/ScotchFB/" title="http://www.fontbureau.com/fonts/ScotchFB/">http://www.fontbureau.com/fonts/ScotchFB/</a><br>
      Scotch Modern [Nick Shinn] <a href="http://www.myfonts.com/fonts/shinn/scotch-modern/" title="http://www.myfonts.com/fonts/shinn/scotch-modern/">http://www.myfonts.com/fonts/shinn/scotch-modern/</a><br>
      Matthew Carter's Scotch Romans, including his FB Miller <a href="http://www.fontbureau.com/fonts/Miller/" title="http://www.fontbureau.com/fonts/Miller/">http://www.fontbureau.com/fonts/Miller/</a><br>
      Also Caledonia <a href="http://www.myfonts.com/fonts/linotype/new-caledonia/" title="http://www.myfonts.com/fonts/linotype/new-caledonia/">http://www.myfonts.com/fonts/linotype/new-caledonia/</a> and <a href="http://www.myfonts.com/fonts/adobe/new-caledonia/" title="http://www.myfonts.com/fonts/adobe/new-caledonia/">http://www.myfonts.com/fonts/adobe/new-caledonia/</a><br>
      And also Linotype Monticello <a href="http://www.myfonts.com/fonts/linotype/monticello-lt/" title="http://www.myfonts.com/fonts/linotype/monticello-lt/">http://www.myfonts.com/fonts/linotype/monticello-lt/</a><br>
      Don</p>
