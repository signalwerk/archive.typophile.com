      <p>To answer your question in the title: Not much. They’re both serif typefaces.<br>
      But Georgia is a Scotch Roman optimized for the screen, whereas Copernicus is a typeface stylisticly similar to Plantin, a French Old Style face.</p>
      <p>Check this: <a href="http://typophile.com/courses/type101" rel="nofollow">Jonathan Hoefler’s Type Styles</a></p>
