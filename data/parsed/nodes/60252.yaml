      <p>Galaxie Copernicus is a take on Plantin, a 16th-century genre, and Georgia is a Scotch Roman, a 19th-century genre. Plantin does have a large x-height compared to other designs of its era, but if you go into the details, there is very little similarity between the two genres and hence the two faces.</p>
      <p>However, Georgia, as you noted, was designed for the screen, and Galaxie Copernicus was designed as a member of the Galaxie family that includes a grotesque (a sans serif subgenre), so those decisions probably affected the proportions, colour, and sturdiness of the designs. That could be said about a lot of other contemporary designs, though.</p>
