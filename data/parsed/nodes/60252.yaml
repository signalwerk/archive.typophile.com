      <p>I bought Copernicus in one weight not too long ago.<br>
      I bought it because it was markedly different from Georgia and I wanted to test it out on screen as an alternate body font. (Won't get into the results of that here.)<br>
      The biggest diff I notice right off was the counters in the letters B, D, O, and the like. Much larger than Georgia.</p>
      <p>My eye is anything but trained with regards to typefaces.</p>
      <p>Forgive my being flip, but have you been to the optometrist lately? ;)</p>
