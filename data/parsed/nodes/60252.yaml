    <p>This gem: <a href="http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/" title="http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/">http://vllg.com/Village/GalaxieCopernicus/mudTyper+Weights/</a></p>
    <p>...was posted on iLT not too longer ago and I only know how begun to notice it. I'm rather curious: What visual and design quality do the two fonts share that make them appear so similar in strength and weight? Corpernicus doesn't seem to have been designed for Web (is it?) so I'm very interested in how the two look so alike. I have always like Georgia, but it's a little meaty for print so I've been interested in examining fonts of similar quality. Sadly, I lack the eye and vocabulary to put my finger on it.</p>
