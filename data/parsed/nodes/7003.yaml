    html: <p>Oli, I smiled when I saw this. I think it would be very difficult to get the balance that you have with such a low waistline in the glyphs. <br> <br>I really like the P.  <br> <br>I think the B is all right too but it's bottom left seems to rush up too fast to the vertical stem. Maybe try squaring it just a little. I think more like the D and less like the C. <br> <br>The bottom of the S might need to be the tiniest bit wider because of the overall low waistline of the alphabet. The R might need this too. <br> <br>Thanks for sharing. <br> <br>Jon</p>
