      <p>Agree that the relationship between n and e does make sense of the slight outturn on the n vertical, I felt that the font in text use, and admittedly I didn't see that much of it, seemed to have a tight fit. The circular imagery is still rolling out, I suspect that some will be more popular than others, for example circling hippos and wall of death riders seem better conceived and realised and more potential longevity than the football and moon/ships.<br>
