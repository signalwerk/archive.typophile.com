      <p>My first reaction was a bit shocked (to see new BBC ident) and very positive. Though you see the ident logo for a short period of time its has a strong presence and communicates a fresh and solid feeling. After seeing the first time  - I knew I liked it and was looking forward to seeing again. I could tell it was from Fontsmith as has an attitude resemblance to the 'friendly media' itv typeface.</p>
