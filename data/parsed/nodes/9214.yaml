    html: <p><i>&gt;And most significantly to us today, the contemporary vilification of fraktur comes from those who have the most to gain from perpetuating the remembrance of Nazi attrocities, the most to gain from brandishing something to hate.</i> <br> <br>I'm sorry, Hrant, but I can't agree with this. I'm not aware of any organized political, social, business, or industrial movement attempting to keep fraktur out of the public sphere. In my experience, what keeps it out of sight and out of mind has been personal, individual gut reactions.</p>
