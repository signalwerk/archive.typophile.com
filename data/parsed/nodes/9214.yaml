    html: <p>I'm not saying there's a conspiracy. I'm saying that some people -yes, individuals- with certain political agendas use whatever is in their field (in Heller's case, a symbol, a typestyle) as tools to further those agendas. Some people do it as a "reflex" of sorts, others do it concertedly - but the result is that the "abused tool" suffers, through no fault of its own, and hence people who'd like to use that tool for good (like you and me) suffer too. <br> <br>Fraktur is a doberman, that has simply switched abusive masters. <br> <br>hhp</p>
