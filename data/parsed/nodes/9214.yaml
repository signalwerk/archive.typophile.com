    html: <p>Forrest, thanks for the firsthand account. <br> <br>&gt; came across as a bit snide or triumphalist.  <br> <br>Indeed. <br>A superset of Heller's flawed stance on the Swastika, blacketter, and anything that the Nazis happened to touch is his blind partisanship of the West, and condemnation of anything that tries to fight the tyrannies of the ascendant JudeoChristian establishment. By distracting us from the fascism of our <i>present</i> age, he's basically an agent for the powers that be. <br> <br>In a past issue of Print he had a short piece about alleged similarities between the UN logo and the old Soviet crest. And we know what the US and Israel think of the UN... In that piece Heller uses classic local news innuendo, as well as phrases like "evil Soviets" with a straight face. Disgusting. <br> <br>-- <br> <br>&gt; The real extraction of blackletter <br>&gt; from public life came after 1945 <br> <br>And most significantly to us today, the contemporary vilification of fraktur comes from those who have the most to gain from perpetuating the remembrance of Nazi attrocities, the most to gain from brandishing something to hate. That would be OK if they were still the underdogs, but that's no longer the case. <br> <br>-- <br> <br>&gt; all arguments that attempt to tie particular <br>&gt; forms to particular ideologies are flawed. <br> <br>Eternally, yes, that's not possible. But treating forms are shapes devoid of cultural context is just as naive. <br> <br>hhp</p>
