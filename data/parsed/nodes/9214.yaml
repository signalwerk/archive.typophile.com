    html: "<p>&gt; On the contrary, there is much overlap between Nazi neoclassicism and modernism, witness the architecture of Albert Speer: big and plain.  <br> <br>I would never claim that any artistic development happens in a vacuum; I was discussing the modernists' aspirations more than reality. <br> <br>Speer's work reminds me of those 18th century designs for monumental mausoleums. Stasis and heaviness are built into the architecture so strongly that I really wonder how he expected people to live with his designs over the long term. Even Nazis, who presumably thought that sort of thing was cool. <br> <br>&gt; Coolhunter Hitler. There is no absolute bond between the folky-blackletter-German idea of Kultur, and Nazi political power. As the wind turns, so does the creative director. <br> <br>Good phrase, and accurate too. All I'm saying is based on the evidence I've seen, blackletter held onto its role in articulating the visual identity of Nazism to the public of the Reich for what seems to be the duration of their rule, regardless of Hitler's edicts. Given time, I'm sure Hitler would have moved them on to something else, but he didn't have that kind of time. <br> <br>&gt; I'm saying that some people -yes, individuals- with certain political agendas use whatever is in their field (in Heller's case, a symbol, a typestyle) as tools to further those agendas. <br> <br>I really think it's unfair to pile all this baggage onto Steven Heller. There's a certain broadness to his moral judgments and a kind of blithe \"America #1!\" attitude in how he discusses the Soviets, but it's not like he's some kind of SECRET ZIONIST VINDICATOR. He's just a Jewish New York art director who likes being a Jewish New York art director, which makes it entirely logical and not really axe-grinding that he has problems with totalitarian regimes, anti-Semitism, and Stalinism. I mean, accusing the art director of the New York Times as being a tool of the establishment is not picking a very tough fight. <br> <br>Picking on blackletter as a visual symbol of Nazism is a bit of a facile (and unfair) judgment, but as Dan keeps saying, in the grand scheme of things, it's really not Heller who's keeping blackletter down.</p>"
