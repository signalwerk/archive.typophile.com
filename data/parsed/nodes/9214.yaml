  html: <p>A friend and I went to hear Steven Heller speak at California College of the Arts tonight, without any prior knowledge of the topic of his lecture. Heller's interests slew all over the map, but most of the reason I was interested in hearing him speak had to do with <a href="http://www.typophile.com/forums/messages/4077/17238.html?1072731339">this old thread</a>, which has caused me to do a certain degree of muttering about him to my friends. (I'm in the throes of blackletter mania right now, you see. Or at least Rudolf Koch mania.) <br> <br>As it turns out, that thread's perfect prep material for the lecture we saw, which concerned the uses of design within 20th century totalitarian regimes. As it turns out, it was a lively, fascinating, and only occasionally irritating lecture about Nazi Germani, fascist Italy, Mao's China, and the Soviet Union. There's no question Heller's a popularizer (anytime he started straying onto topics where I had some expertise, his arguments started to sound facile), but he presented a lot of interesting material I hadn't seen before. <br> <br>He did repeat his potted history of how the Nazis used "volksschrift" (i.e. blackletter) as part of their totalitarian "brand", and once again he neglected to mention how the Nazis eventually rejected blackletter, just as they'd rejected modernism in the first place. I think I only noticed that because I was looking for it (just like I only noticed that he misidentified a schwabacher script as a fraktur because I was just studying the differences last night). <br> <br>What comes through in his lecture was how much more effective the Nazis were at creating a unified "brand identity" than any of the other groups. He spent a lot of time presenting materials from the  </p>
