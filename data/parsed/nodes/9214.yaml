    html: "<p>&gt;the stripped ahistorical minimalism <br> <br>On the contrary, there is much overlap between Nazi neoclassicism and modernism, witness the architecture of Albert Speer: big and plain. <br> <br> <br>Following the Hitler as Creative Director meme, and noting the relatively brief historical trajectory of National Socialism, it's reasonable to assume that the direction follows an expoitation (and distortion, of course) of cultural trends. Coolhunter Hitler. There is no absolute bond between the folky-blackletter-German idea of Kultur, and Nazi political power. As the wind turns, so does the creative director. <br> <br>Orwell noted that hypocrisy was a meaningless crittique of those who rule through Doublethink: \"Doublethink means the power of holding two contradictory beliefs in one's mind simultaneously, and accepting both of them.\" This is why the Nazis \"about face\" over the use of blackletter was possible, and why all arguments that attempt to tie particular forms to particular ideologies are flawed.</p>"
    html_clean: "<p>&gt;the stripped ahistorical minimalism <br> <br>On the contrary, there is much overlap between Nazi neoclassicism and modernism, witness the architecture of Albert Speer: big and plain. <br> <br> <br>Following the Hitler as Creative Director meme, and noting the relatively brief historical trajectory of National Socialism, it's reasonable to assume that the direction follows an expoitation (and distortion, of course) of cultural trends. Coolhunter Hitler. There is no absolute bond between the folky-blackletter-German idea of Kultur, and Nazi political power. As the wind turns, so does the creative director. <br> <br>Orwell noted that hypocrisy was a meaningless crittique of those who rule through Doublethink: \"Doublethink means the power of holding two contradictory beliefs in one's mind simultaneously, and accepting both of them.\" This is why the Nazis \"about face\" over the use of blackletter was possible, and why all arguments that attempt to tie particular forms to particular ideologies are flawed.</p>"
