      <p>Tallington Modern by Letterhead Fonts appears to be a decent match for THE PROFESSIONAL:<br><a href="http://www.letterheadfonts.com/fonts/tallington.php">http://www.letterheadfonts.com/fonts/tallington.php</a></p>
      <p>LÉON is not the same typeface, however. House Gothic Condensed Black seems to work:<br><a href="http://www.houseind.com/search/?search=House%20Gothic%20Black">http://www.houseind.com/search/?search=House%20Gothic%20Black</a></p>
      <p>The movie came out in 1994. House Gothic has been around since 1993, but Tallington has a copyright date of 2005. If the title sequence is from the the original release of the film, it must share an original typeface source with Tallington....</p>
