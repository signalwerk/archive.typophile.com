    html: <p>It's probably not a typeface really, but something like <a class="freelinking external" href="http://www.identifont.com/show?O3" rel="nofollow">Kabel</a> or <a class="freelinking external" href="http://www.identifont.com/show?3RV" rel="nofollow">Scala Sans</a> will get you close to the mark. (These aren't perfect matches. The C in Kabel lacks the angled terminals on the C—probably because it was designed by a German designer—but Scala isn't quite geometric enough.)</p>
