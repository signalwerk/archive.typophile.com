      <p>CID’s (also called ’double byte fonts’) are used by InDesign to facilitate the use of another-language-typesets. They are supported by PostScript since 1999.<br>
      Due to a bug in older versions of InDesign even typefaces with only Western-encoding were converted to CID’s during the PDF-ing process. This has been remedied in the last version of InDesign (CS2 or 4.0).</p>
      <p>Mind: All up-to-date RIPs should not have any problem processing CID’s. It is known that some of the third-part ones do, eg Harlequin (upto the last update, I guess).<br>
      Using Distiller on a PS-dump removes some of the CID-encoding (mostly that on those Western-encoding fonts), but possibly not all of it, depending on the kind of font(s) you are using.<br>
      Beste way to ascertain a problem-free work flow is to use up-to-date RIP’s, preferably one with the real Adobe’flavour’...</p>
