      <p>That’s what InDesign does — Go to</p>
      <p><a href="http://www.adobe.com/products/postscript/pdfs/cid.pdf" title="http://www.adobe.com/products/postscript/pdfs/cid.pdf">http://www.adobe.com/products/postscript/pdfs/cid.pdf</a></p>
      <p>for a discription of CID fonts.</p>
      <p>Bear in mind that some printers (book printers, not laser printers) refuse to take PDF files that have mixed CID and “non-CID” Type 1 fonts. They report that characters drop out, &amp; we’ve seen it happen. Whether this is a problem due to a non-Adobe RIP or an older RIP, I don’t know.</p>
