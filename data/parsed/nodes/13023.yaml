    <p>I know that weird stuff happened with fonts when you exported pages intto pdf:s in InDesign 2, and that the only proper way to get printable pdf:s was to print ps:es and distill them. When the cs version came, I was told that the problems were gone and that InDesign cs actally does everything ps+distiller did. However, when I analyze all possible problems with pdf:s created with cs in Acrobat, it still says that fonts are cdi type 0. Why? What are cdi fonts anyway?<br>
    Jesper</p>
