      <div class="comment-spam-body"><p>1971 is near the apex of the photolettering era when fonts were commonly squeezed, stretched and otherwise distorted on demand.<br>
      so the nameplate _THE BLACK PANTHER_ may be somewhat different from the font used to derive it.<br>
      In no particular order, here are some fonts based on narrow linears of the era.<br>
      Permanent Headline URW<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/PermanentHeadlineURW-AsBLACKPANTHER_5780.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/urw/permanent/" title="http://www.myfonts.com/fonts/urw/permanent/">http://www.myfonts.com/fonts/urw/permanent/</a><br>
      Plakette TS Light<br>
      <div class="imageWrap"><img src="http://typophile.com/files/PlaketteTSLight-AsBLACKPANTHER_5068.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/ef-typeshop/plakette/" title="http://www.myfonts.com/fonts/ef-typeshop/plakette/">http://www.myfonts.com/fonts/ef-typeshop/plakette/</a><br>
      British Inserat MN Cond<div class="imageWrap"><img src="http://typophile.com/files/BritishInseratMNCond-AsBLACKPANTHER_5343.gif"></div><br>
      <a href="https://www.myfonts.com/fonts/itfmecanorma/british-inserat/" title="https://www.myfonts.com/fonts/itfmecanorma/british-inserat/">https://www.myfonts.com/fonts/itfmecanorma/british-inserat/</a><br>
      Don<p></p>
      </div>
