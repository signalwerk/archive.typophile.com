    html: <p>If they are engraved, wouldn't they be called <em>typefaces</em>?  Still I have found similar typefaces in many other books, they seem quite standard for the time.  These <em>italic</em> typefaces very much resemble the early scotch modern type, for example the italic fonts made by William Miller (according to <a class="freelinking external" href="http://typefoundry.blogspot.be/2007/02/scotch-roman.html" rel="nofollow">this article</a>).  Does that mean that these <em>late neo-classical</em> fonts are based on the english modern type?  Also, has William Miller invented the fonts, or based the design on predecessors?</p>
