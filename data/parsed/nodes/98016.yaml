      <p>In the 20th century, a lot of commercial scores of popular music simply had the lyrics typed in - using an IBM Executive typewriter, so that they would almost look printed - usually with the Documentary typestyle.</p>
      <p>It was a cheap way to do what would have been very expensive to do with conventional typography, to align each syllable below the appropriate note, and it was well-suited to offset lithograpy.</p>
      <p>I'm pretty sure somebody would also have used the Vari-Typer for this (although the chief musical use I remember is the round paper stickers in the middle of LPs) as well. And no doubt others splurged on a Selectric Composer. But the Executive was very widespread.</p>
