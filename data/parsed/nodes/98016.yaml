      <p>Thanks, I didn't know about the vari-typer!  But since this is a 20th century invention, 19th century engravers still had to punch each letter, right?  What about henle, who did metal plate engraving until the 90's?</p>
      <p>Regarding Baskerville, Bell, etc, the italic does look mostly like the scotch modern italic, with exceptions: for example the lowercase p has a rounded tail in scotch modern.  That's how it's in most scores, even early ones (from 1830).</p>
