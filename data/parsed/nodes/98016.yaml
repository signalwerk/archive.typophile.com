    <p>Fortunately I have a large library of musical scores, most of which are still hand engraved (from dover publications, many edition peters, etc...).  Since music engraving had reached most of it's form in the 19th century, I found that the typefaces used were mostly modern (neo-classical).  Titles are mostly modern (display) faces, but other faces, including slab serif are also used.  For lyrics also the modern face was often used, but not exclusively.  I've found that tempo markings are exclusively set in bold modern, and dynamics in italic modern.</p>
    <p>When I looked through "typefaces for books", I found that the font the resembles these the most are modern scotch, rather than the bodoni and didot.  The italics look rounder and also the roman t ends in an upwards shape.  I have many books, reprinted from old editions that use this font (Forsyth Orchestration, Harry Olson music physics and engineering, Raleigh the theory of sound).  Also Donald Knuth's Computer Modern Roman was based on this design.</p>
