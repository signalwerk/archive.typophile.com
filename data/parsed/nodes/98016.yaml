    html: <p>You can definitely call these engraved (or lithographed) <cite>lettering</cite> based on typefaces designs. Richard Austin cut the punches for the types sold by the Miller typefoundry in Glasgow — his designs owe something to those of Baskerville, and are typical of a very specific brand of British neo-classical type style, less severe than the continental one (Didot, Bodoni, Walbaum). See also related designs such as Bell or Bulmer.</p>
