    html: |-
      <p><a href="http://www.tsengbooks.com/images/6680s.pdf" title="http://www.tsengbooks.com/images/6680s.pdf">http://www.tsengbooks.com/images/6680s.pdf</a></p>
      <p>This book has significant polytonic Greek, one reason the designer selected Palatino. It was an AAUP Book Show selection in 2003. Details:</p>
      <p><cite>The Cast of Character</cite><br>
      Nancy Worman<br>
      University of Texas Press</p>
      <p>trim size: 6 × 9 in;  pages: 288<br>
      text: 9.75/14 Palatino × 27 pc<br>
      display face: Syntax<br>
      book design: Heidi Haeuser</p>
      <p>Category: scholarly typographic<br>
      Judges’ comments: This book works in a lot of ways: the two-color jacket is strong; the combination of Palatino and Syntax seems exactly right for the topic and the format; and the page size is very pleasant in the hand. (kf) I feel the type ornament is too dominant (perhaps it would have been more effective screened back), but the use of Palatino and its accompanying Greek font is to be applauded. (cz)</p>
