  html: |-
    <p>I'm trying to build a photo collection of Palatino in use (for a school assignment). If you know of any resources that feature Palatino, or have some of your own, I'd be very appreciative if you'd be willing to post those here to help me collect a number of examples. Outside of specimen sheets it can really be anything - signage, posters, book text, on-screen use, etc. </p>
    <p>Thanks for your help!</p>
