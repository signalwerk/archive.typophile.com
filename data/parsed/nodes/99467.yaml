  html: <p>I’m searching for a big, wild, confident <strong>M</strong> that conveys a sense of movement. Inspiration for a quickie logo I’m going to make for a techno project (dance music).  Nothing too painterly, graffiti or cutesy. I’m currently raiding Fontsruct but would love any suggestions from you guys!</p>
