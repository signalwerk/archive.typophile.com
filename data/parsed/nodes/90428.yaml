      <p>Windows has a limit on the number of styles in a font family. You can only have plain, italic, bold, bold italic. Any more than that and the fonts will not be available in standard Windows apps. (You will be able to use them in Adobe apps and some others.) Basically, you need to break your family into smaller sub-families that fit this limitation.</p>
      <p>Adam Twardoch has written a guide on how to do this on the FontLab Forum: </p>
      <p><a href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html" title="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html">http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-nami...</a></p>
