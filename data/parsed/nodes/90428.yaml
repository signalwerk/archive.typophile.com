    <p>I have designed a custom type family for a client. It´s an OTF family with 6 weights plus their italics. All has been well so far, and the fonts have worked well in both Mac and Windows. However, now that they install the fonts to PCs using Office 2007 programs (Word, Excel, Powerpoint) there are problems that, I guess, are caused by the naming of the fonts: the fonts are not visible on the pull-down menus or they appear there with strange names. Is there something specific to this generation of Windows? I really am not an expert on this, and would appreciate any help for finding solutions or hints as to where seek for help!<br>
    Thanks, Saku.</p>
