      <p>If you think you guys are having troubles, try using an old Mac with OS 9!!</p>
      <p>I can't get pages to open; I can't get an indication that my posts made it without getting a timeout or error message message(even though the post worked). The site is S-L-O-W-E-R than one of our Northwest slugs. Even when I retarted my computer into OS X with Mozilla everything seems so painfully slow. I had to Stop loading a page, just to try something else. </p>
