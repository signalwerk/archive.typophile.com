      <p>You know there is a time for Flash and there is a time for using 'K.I.S.S.' Don't you think a forum that deals with inanimate image posts, and wants as many contributors as possible (not just those with hot new computers) is the time to go for Simple?</p>
      <p>You know, the last time we 'upgraded' some of us (like me) lost capabilities at this site. It seems that you have done it again, and I can't see anything that we have gained, except maybe the indication of how many posts are new. </p>
