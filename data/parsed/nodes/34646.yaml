    date: 2007-06-26T14:33:00
    date_raw: 26.Jun.2007 2.33pm
    votes: null
    html: |-
      <p>OT Std is like PS or TT, just converted to OT format so it becomes cross-platform. So you could call Std "normal". </p>
      <p>OT Pro is cross-platform plus alternates, small caps, swash, oldstyle figs, aligned punctuation, possibly large, Central European language support, and any other bells and whistles the designer wants to add, plus the feature code to make it easy to use all those glyphs. So you could call Pro "extra" or "expert", but since mostly they're called Pro, I'm using that name in the new versions.</p>
    html_clean: |-
