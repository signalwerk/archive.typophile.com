    <p>Just watched an interesting <a class="freelinking external" href="http://vimeo.com/forrestmedia/the-history-of-typography" rel="nofollow">animation</a>* about the history of typography where the creator tells that typography was invented by Gutenberg. Is this correct? The creator also mentions that the first sans-serif fonts were created by William Caslon's great-grandson Caslon IV who disliked serifs. I'm very curious to know about the accuracy is this information, so any insight about this would be appreciated. Thank you.</p>
    <p>*<a class="freelinking external" href="http://vimeo.com/forrestmedia/the-history-of-typography" rel="nofollow">http://vimeo.com/forrestmedia/the-history-of-typography</a></p>
  html_clean: |-
    <p>Just watched an interesting <a class="freelinking external link-external" href="http://vimeo.com/forrestmedia/the-history-of-typography" rel="nofollow">animation</a>* about the history of typography where the creator tells that typography was invented by Gutenberg. Is this correct? The creator also mentions that the first sans-serif fonts were created by William Caslon's great-grandson Caslon IV who disliked serifs. I'm very curious to know about the accuracy is this information, so any insight about this would be appreciated. Thank you.</p>
    <p>*<a class="freelinking external link-external" href="http://vimeo.com/forrestmedia/the-history-of-typography" rel="nofollow">http://vimeo.com/forrestmedia/the-history-of-typography</a></p>
