    html: |-
      <p>Printing from movable type was first invented, as far as we know, by the Chinese printer Bi Sheng. This isn't necessarily the only definition of typography, and doesn't preclude that Gutenberg too may have "invented" typography, even if he wasn't the first.</p>
      <p>The first sans serif (latin) type appeared in a Caslon family catalogue, so the second anecdote sounds plausible. Sans serif <em>lettering</em> was around quite a bit earlier.</p>
