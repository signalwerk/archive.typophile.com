    html: |-
      <p>Here is the original font , from McGrew's book _American Mental Type_, rearranged for the narrow window format used by Typophile<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ParsonsBoldMcGrewSM_6315.jpg"></div><br>
      Your sample seems to be from the photo-lettering era. A swash has been added to _P_ based on the swash _T_ in the type as shown in the ATF Specimen Book of 1923.<br>
      Don<p></p>
