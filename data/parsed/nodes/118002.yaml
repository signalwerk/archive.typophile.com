      <p>I have a moderately strong belief that the whole Burgess thing was a mammoth practical joke. If not, Parker invented some completely bogus/imaginary supporting evidence.</p>
      <p>Mike Parker claimed there was a written document that bound Lanston Monotype and its successors to secrecy, and it was suggested that Gerald Giampa had it and had seen it and felt bound by it.</p>
      <p>But when Giampa sold his business, assets and the Lanston name to P22, they found no trace of it, nor any other evidence.</p>
