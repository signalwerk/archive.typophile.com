    html: |-
      <p>@hrant:<br>
      Luc Devroye's web site claims that the notion that William Starling Burgess was the real designer of Times Roman was a joke.</p>
      <p>If so, I don't think that Monotype is laughing.</p>
      <p>I don't think that is the case. I think that Burgess did design a face, and it did look a lot like Times Roman, and so Mike Parker acted in good faith.</p>
      <p>However, I think he was still <em>wrong</em>.</p>
      <p>Basically, I think the original face by Burgess derived from De Vinne, while Times Roman derived from Plantin, and the similarity between them was coincidental (to the extent that it exceeded the similarity to be expected from having Caslon and Dutch types among their models and influences).</p>
      <p>@riccard0:<br>
      Actually, this doesn't have anything much to do with the difference between "typeface" and "font" in the usual sense, but rather with the difference between "typeface" and something else, which is sometimes taken as another meaning of the word "font".</p>
      <p>That is, the thing we want people to use the word "font" for is one of the following:<br>
      - a package of lead type slugs for printing in a given typeface, perhaps containing 20 a's and proportional numbers of the rest of the letters in the alphabet;<br>
      - a file with the extension .ttf or .otf used to allow a computer to print in a given typeface;<br>
      - an element for a Selectric composer, the brass matrices to fill a Monotype matrix-case, or the round or square negative to put in a photocomposition machine.</p>
      <p>The alternate meaning of font, for which we really need a <em>third</em> word, is a specific weight, size, and drawing of a given typeface. It's the "sometimes subtle difference between <em>typeface</em> and" <em>that</em> which Times Roman in this discussion would help to explain.</p>
      <p>And it doesn't help that this third thing is much closer to being like a typeface (as it is an abstract way of shaping letters too, just a more specific one) than it is to be a font. So as long as you call the third thing a font, you end up increasing confusion rather than decreasing it.</p>
