      <p>One difference - I'm not saying it's significant - that lets people quickly identify whether a font is based on Linotype Times Roman or Monotype Times (New) Roman - is the shape of the lowercase z in italics. The Monotype version has a simple sloped z; the Linotype version has a swash on the bottom stroke.</p>
      <p>Any other differences (Linotype vs. Monotype, as opposed to Times versus Times Ten) are generally too subtle for the layperson and not particularly significant. Times Ten, on the other hand, is based on the 10 point size of Times, and so genuinely addresses a common flaw in digital adaptations of metal type - they're used to set text, but they're based on large sizes of the metal face, not text sizes, because they're easier to trace from.</p>
      <p>The history is that Monotype invented Times Roman; Linotype licensed it, and copied it just about as closely as they could, and then Monotype had to use a slightly different name in the U.S. to avoid a trademark conflict.</p>
      <p>Oh, yes, I almost forgot - and Linotype machines had a very serious limitation, in that the regular and italic forms (and usually the bold as well) of a face had to have the same widths for every letter. This meant, for <em>many</em> Linotype typefaces, that the italic was wider than it should be.</p>
