      <p>If you're on Windows get <a class="freelinking external" href="http://typophile.com/node/115075" rel="nofollow"> Microsoft's Font properties extension</a> then check the <strong>Names</strong>, <strong>Version</strong> and <strong>Charset/Unicode</strong> tabs for each of the fonts to compare them.</p>
      <p><strong>Times LT Std</strong> is from Linotype (LT) and a standard version (Std), which means it supports only American and Western European letters.<br>
      <strong>Times</strong> is probably also from Linotype and the lack of "Std" <em>could</em> mean that it supports more than the standard character set, but you'll have to check.</p>
      <p><strong>Times New Roman MT Std</strong> is from Monotype (MT) and also just a basic version.<br>
      <strong>Times New Roman</strong> is probably also from Monotype and the same thing I wrote for <strong>Times</strong> applies.</p>
      <p>Basically, you want to keep both Monotype and Linotype version, but you'll have to compare all of their properties to see which of the four families are the best versions for each foundry.</p>
