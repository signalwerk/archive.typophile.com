    html: |-
      <p>Times Roman is a typeface, designed in 1931 for the Times of London.<br>
      Times, Times New Roman, Times LT (Linotype) Std, and Times MT (Monotype) Std are four different type foundries' digital adaptations (fonts) of that typeface. (Actually, I think Times and Times New Roman probably each correspond to Linotype and Monotype— maybe someone can confirm?)<br>
      There are subtle differences in the letterforms and typesetting functionality (letterspacing, hinting) of each. Which one you use is entirely up to you. And Charles, if someone ever insists that you *have* to use Times MT Std try using LT and dare them to tell the difference.</p>
