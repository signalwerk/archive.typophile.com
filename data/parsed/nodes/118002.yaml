    html: |-
      <p>Surely it would be semantically correct finding a new term defining the “abstract way of shaping letters”, but I think that, apart from historical contexts, that’s exactly what I think “font” is good for.<br>
      After all, the meaning of the word has already broadened (abstracted) its meaning along with the evolution of type. Otherwise, we’ll need a new term also for files used to produce vector-based letters, because they’re not size-specific, like a lead font is.<br>
      So, given there will always be philosophical and semantical nuances, I think the best way to discriminate is to referring to the “thing”, the œuvre, the platonic idea, as <em>typeface</em>, and as <em>font</em> to the technical mean needed to deliver it.</p>
