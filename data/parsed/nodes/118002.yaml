      <p><a>From </a><a class="freelinking external" href="http://www.linotype.com/1537/Times-family.html" rel="nofollow">Linotype's web site</a>:</p>
      <blockquote><p>In 1931, The Times of London commissioned a new text type design from Stanley Morison and the Monotype Corporation, after Morison had written an article criticizing The Times for being badly printed and typographically behind the times. The new design was supervised by Stanley Morison and drawn by Victor Lardent, an artist from the advertising department of The Times. Morison used an older typeface, Plantin, as the basis for his design, but made revisions for legibility and economy of space (always important concerns for newspapers). As the old type used by the newspaper had been called Times Old Roman," Morison's revision became "Times New Roman." The Times of London debuted the new typeface in October 1932, and after one year the design was released for commercial sale. The Linotype version, called simply "Times," was optimized for line-casting technology, though the differences in the basic design are subtle. The typeface was very successful for the Times of London, which used a higher grade of newsprint than most newspapers. The better, whiter paper enhanced the new typeface's high degree of contrast and sharp serifs, and created a sparkling, modern look. In 1972, Walter Tracy designed Times Europa for The Times of London. This was a sturdier version, and it was needed to hold up to the newest demands of newspaper printing: faster presses and cheaper paper. In the United States, the Times font family has enjoyed popularity as a magazine and book type since the 1940s. Times continues to be very popular around the world because of its versatility and readability. And because it is a standard font on most computers and digital printers, it has become universally familiar as the office workhorse. Times™, Times™ Europa, and Times New Roman™ are sure bets for proposals, annual reports, office correspondence, magazines, and newspapers.</p>
      <p>Linotype offers many versions of this font:<br>
      <strong>Times™</strong> is the universal version of Times, used formerly as the matrices for the Linotype hot metal line-casting machines. The basic four weights of roman, italic, bold and bold italic are standard fonts on most printers. There are also small caps, Old style Figures, phonetic characters, and Central European characters.<br>
      <strong>Times™ Ten</strong> is the version specially designed for smaller text (12 point and below); its characters are wider and the hairlines are a little stronger. Times Ten has many weights for Latin typography, as well as several weights for Central European, Cyrillic, and Greek typesetting.<br>
      <strong>Times™ Eighteen</strong> is the headline version, ideal for point sizes of 18 and larger. The characters are subtly condensed and the hairlines are finer.<br>
      <strong>Times™ Europa</strong> is the Walter Tracy re-design of 1972, its sturdier characters and open counterspaces maintain readability in rougher printing conditions.<br>
      <strong>Times New Roman™</strong> is the historic font version first drawn by Victor Lardent and Stanley Morison for the Monotype hot metal caster.</p></blockquote>
      <p>You have not specified the origin for the versions you have, which would be key to identifying whether they are commercial retail versions or OEM operating system versions.</p>
