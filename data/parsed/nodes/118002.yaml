      <p>When I was a design student in college around 1980 a professional type designer —&nbsp;can't recall who — showed us his work. He drew the letters on paper and then placed a sheet of rubylith over them and cut them out, with huge letters about 12" high. </p>
      <p>(Rubylith is a 2-layer film with a transparent red layer and a clear base layer. The red layer can be cut away with an x-acto knife, the clear base layer remains and holds everything together. It works well for tracing with a knife.)</p>
      <p>I have no idea if that was a common method back then or not.</p>
