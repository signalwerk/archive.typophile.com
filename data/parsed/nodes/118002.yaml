      <p>Well, although this may not answer your question, what Thomas Phinney was referring to was the fact that back around 1931, while Stanley Morison came up with the basic idea of a modernized Plantin for the Times, and had Victor Lardent draw it, the bold face was an afterthought, and someone <em>else</em> drew that - and thus, even then, at the time of the original hot metal introduction of Times Roman by Monotype (the one called Times New Roman in the U.S. for trademark reasons) the mismatch between the bold and the normal typeface was highly criticized.</p>
      <p>Times Titling was drawn by Eric Gill and to me it looks like it could have been a titling font for Perpetua (although there is a Perpetua Titling and it is different).</p>
    html_clean: |-
      <p>Well, although this may not answer your question, what Thomas Phinney was referring to was the fact that back around 1931, while Stanley Morison came up with the basic idea of a modernized Plantin for the Times, and had Victor Lardent draw it, the bold face was an afterthought, and someone <em>else</em> drew that - and thus, even then, at the time of the original hot metal introduction of Times Roman by Monotype (the one called Times New Roman in the U.S. for trademark reasons) the mismatch between the bold and the normal typeface was highly criticized.</p>
      <p>Times Titling was drawn by Eric Gill and to me it looks like it could have been a titling font for Perpetua (although there is a Perpetua Titling and it is different).</p>
