    html: |-
      <p>Two important considerations:</p>
      <p>1. ANYTHING smaller than 3.5”Hx5”W is NOT mailable.</p>
      <p>2. Square invitations may look classy, but they’ll cost you an extra 12¢ apiece to mail (non-standard surcharge).</p>
      <p>If you have ANY questions. contact your local USPS BMEU (Business Mail Entry Unit) and request a FREE Notice 3A: Letter-size Mail DImensional Standards Template.</p>
