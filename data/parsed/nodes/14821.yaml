    html: |-
      <p>CHeck with the post office. Then check with another. I made the mistake once of checking with one Post Office saying my postcards were just fine then finding out at another one that the postcards were two small and I’d instead have to use envelopes for them all.</p>
      <p>As for wedding standards, I don’t think there really is one…they just adhere to standard greeting card/envelope sized.</p>
