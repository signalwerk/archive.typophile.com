    <p>Hello,</p>
    <p>Has somebody encountered problems when printing to PDF from FL? I'm trying to generate font samples, but the glyphs are distorted!</p><div class="imageWrap"><img src="http://typophile.com/files/test_6384.jpg"></div><p></p>
    <p>Take a look at the screen capture. There are some strokes noticeable darker than others... strangely, when printing to PDF from InDesign everything seems to be OK.</p>
    <p>What the problem could be?</p>
