    <p>Now, there are two workarounds here. One can reinstall the system and install the 10.6.6 combo update from the apple support website. OR There is a work-around, to install some parts of 10.6.6 upadte onto the 10.6.7. This is mentioned here: <a href="http://i.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/" title="http://i.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/" class="link-external">http://i.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/</a> direct link: <a href="http://azlist.info/kj/downloads/" title="http://azlist.info/kj/downloads/" class="link-external">http://azlist.info/kj/downloads/</a> the link in the bottom of the green area. </p>
