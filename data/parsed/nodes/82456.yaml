    <p><strong>obsolete, just see second post. There is a system update solving this issue</strong></p>
    <p>Just to warn everybody, after I had a lot of troubles with this and deleting the font cache innumerable times, which did not make the bug disappear, I want to share this. Mac OS 10.6.7 has problems with OpenType PostScript fonts. It will print them with errors and produce broken PDFs no matter if the internal PDF function is used or if Adobe Acrobat is used. These PDFs are broken forever.  <a href="http://www.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/2" title="http://www.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/2">http://www.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/2</a> <a href="http://reviews.cnet.com/8301-13727_7-20048314-263.html" title="http://reviews.cnet.com/8301-13727_7-20048314-263.html">http://reviews.cnet.com/8301-13727_7-20048314-263.html</a></p>
    <p>Now, there are two workarounds here. One can reinstall the system and install the 10.6.6 combo update from the apple support website. OR There is a work-around, to install some parts of 10.6.6 upadte onto the 10.6.7. This is mentioned here: <a href="http://i.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/" title="http://i.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/">http://i.tuaw.com/2011/03/28/10-6-7-update-causes-opentype-font-issues/</a> direct link: <a href="http://azlist.info/kj/downloads/" title="http://azlist.info/kj/downloads/">http://azlist.info/kj/downloads/</a> the link in the bottom of the green area. </p>
    <p>I personally experienced  following errors:<br>
    - Fonts are replaced with bullet signs are not displayed at all.<br>
    - Adobe PDF crashes when trying to handling the OT PS fonts.<br>
    - The PDF with Adobe can be created, but then the print-server or the laser printer couldn't handle the PDF and I couldn't print the documents.</p>
