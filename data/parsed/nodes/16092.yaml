  html: |-
    <p>This is driving me absolutely bonkers: a friend of mine runs a <a href="http://www.helenscarsdale.com/" rel="nofollow">small record label</a> that features releases with beautiful, if austere, handmade packaging. For his most recent <a href="http://www.helenscarsdale.com/published/omittracer.htm" rel="nofollow">very mysterious</a> release, he went to the <a href="http://www.sfcb.org/" rel="nofollow">San Francisco Center for the Book</a> and used their letterpress to make the cover art. If you've been to the center, they have several trays of sorts you can use for lettering, most of which have little or no identifying information.</p>
    <p>The font he used for the track titles is an absolutely gorgeous old 8- or 9-point extended gothic that looks a lot like Trade Gothic but isn't. The caps remind me a lot of Copperplate Gothic with the brackets removed. I've been through my Rookledge and my copy of Jaspert, Berry &amp; Johnson pretty closely, and neither of them have a face that has the same high middle bars in the BEFHPR combined with the quirked tail on the Q, which is one of my favorite features of the typeface. Do any of you with more experience with metal type recognize this? It's safe to say that the numbers are in a different font, as there are several places elsewhere on the notes where I've caught the designer substituting sorts from different fonts in the same word as he runs out of the appropriate letters.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/extended-commercial-gothic.gif"></div><p></p>
    <p>I can provide higher-resolution portions if it would help.</p>
    <p>I would be very surprised if this were available in digital form.</p>
    <p>Anyway, thanks for your eyeballs and your attention!</p>
