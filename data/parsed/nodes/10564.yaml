    html: <p>Perhaps this is related to Adobe's acquisition of Macromedia? In that Adobe may integrate PDFs and Flash to create a more flexible PDF online, etc. to keep this MS offering at bay. <br> <br>I always worry when one company has far-and-away dominance, but I get an extra chill with MS, since they're OS producers (and therefore biased towards their own environment). I admit, I hope it flops just so I don't have to deal with its inevitable rancor on other OSes.</p>
