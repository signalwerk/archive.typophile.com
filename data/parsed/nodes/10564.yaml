    votes: null
    html: "<p>ed: at the syntactic level, being based on XML vs. the Forth-like stack language in PostScript is pretty much a wash. It will no doubt result in large files and take lots more memory to run, but what else is new? Also keep in mind that PostScript hasn't seen any new development for about six years; Adobe's been putting their resources into PDF instead. <br> <br>Metro is definitely resolution independent, being based on the Avalon imaging model. <br> <br>I don't yet have authoritative answers to your other questions, but from what I've seen so far I would be <i>very</i> surprised to see Metro lack any significant and useful feature present in PDF.</p>"
    html_clean: "<p>ed: at the syntactic level, being based on XML vs. the Forth-like stack language in PostScript is pretty much a wash. It will no doubt result in large files and take lots more memory to run, but what else is new? Also keep in mind that PostScript hasn't seen any new development for about six years; Adobe's been putting their resources into PDF instead. <br> <br>Metro is definitely resolution independent, being based on the Avalon imaging model. <br> <br>I don't yet have authoritative answers to your other questions, but from what I've seen so far I would be <i>very</i> surprised to see Metro lack any significant and useful feature present in PDF.</p>"
