    html: <p>"Can something written in XML really rival Postscript for sofisticated WYSIWYG printing?" <br> <br>XML is just a descriptive language like Postscript. XML is just a container for data, so I imagine the document format can be as elaborate as the data entered. (SVG is all xml based too). <br> <br>I agree with Ed, MS (nor adobe, really) are currently after the DTP market. They're after the enterprise document management market. The one advantage of PDF is that is has a rather strong following outside of Adobe (Ghostscript, etc.) and the one advantage of MS's offering is that it's XML based...but there can be a big difference between XML and 'MS' XML. ;o)</p>
