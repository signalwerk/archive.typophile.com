  html: <p>Microsoft just now put up a spec and other info for <a href="http://www.microsoft.com/whdc/device/print/metro_FAQ.mspx">Metro</a>, their new document format. I haven't had a chance to read the specs carefully yet, but I will be over the next few days, as this is potentially an important subject for my work. Things certainly promise to get interesting in the document format world.</p>
