    html: <p>Can something written in XML really rival Postscript  for sofisticated WYSIWYG printing? <br> <br>What about font embedding? document signing, user notes, zoom (free scaling) etc? <br> <br>Microsoft tried and failed to unseat PDF with the e-book format. Metro does sound scary - that its free, like IE was free back in the 1st browser wars. It will probably be tied to MS Office Suite for authoring, or any office suite for that matter, since its nuts and bolts are available to all. <br> <br>http://www.infoworld.com/article/05/04/25/HNmetro_1.html <br></p>
