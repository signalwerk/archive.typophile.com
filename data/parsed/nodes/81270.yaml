    <p>Hi everyone,</p>
    <p>I know subject of piracy comes up again and again, but I feel compelled to make this public.</p>
    <p>Does anyone know anything about the Fontpark website? </p>
    <p><a href="http://www.fontpark.net" title="http://www.fontpark.net">http://www.fontpark.net</a></p>
    <p>Please forgive my ignorance if this is legit, but it certainly doesn't look legit to me. I found some of my own fonts there, free to download, no questions asked. Not to mention fonts by high-profile international foundries, which I have contacted to inform.</p>
    <p>I Googled around but found few if any references to this site.</p>
    <p>With no "Contact" links on the site (why would they?) is there any way of sending them a "Cease and Desist" notification? I'm sure someone here on Typophile must have some experience in this area?</p>
    <p>Thanks, Wayne<br>
    Australian Type Foundry</p>
