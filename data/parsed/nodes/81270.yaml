      <p>There are links to Fontpark's Twitter and Facebook on that page.</p>
      <p>There is also a link at the bottom of the page to what appears to be their host server. You might contact them and inform them that they are hosting pirated software and it must be taken down, but there might be a communication difficulty as it appears to be located in Czech Republic. <a class="freelinking external" href="http://www.snekweb.cz/kontakt/" rel="nofollow">http://www.snekweb.cz/kontakt/</a></p>
