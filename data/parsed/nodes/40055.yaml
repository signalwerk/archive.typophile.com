    html: <p>I fear this is something you’ll have to design yourself. Any similar typeface that we might suggest will probably be quite different in specific characters. It’ll never be what you want and you’ll have to end up customizing it in such a way that creating it from scratch is a much faster and more cost-effective solution. As it is a very strict constructed and geometric face this shouldn’t be so hard.</p>
