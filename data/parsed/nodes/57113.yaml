    <p>Outras Fontes is an independent digital type foundry based in Rio de Janeiro, Brazil. It was founded in 2006 and it is currently managed by Ricardo Esteves Gomes, a graphic/type designer and researcher.</p>
    <p>URL: <a href="http://www.outrasfontes.com" title="http://www.outrasfontes.com">http://www.outrasfontes.com</a></p>
