  html: "<p>Jeremy: <br> <br>The only suggestions that come to my mind are to check the library &amp;/or web under \"Superman\", \"comic books\" or \"DC Comics\"; check DC Comics' website (<a href=\"http://dccomics.com/\" target=\"_top\">http://dccomics.com/</a>); or contact DC Comics directly in New York City. A trip to your local comic book store might be fun and productive, too. <br> <br>I know that his \"S\" symbol has evolved considerably since its debut. <br> <br>Good luck! Sounds like a fun project. <br> <br>It might be fun to start a thread discussing the impact of comic books (and other vernacular, primitive and bourgois forms of illustration -- and I use those terms respectfully in the artistic sense <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":)\"> ) on modern typography. Cartooning, grafitti, folk art and craft and the like could all be on-topic.... <br> <br>David</p>"
