    html: |-
      <p>Karsten (<em>Vielen Dank!</em>) was able to determine that my 'aalt' feature was indeed not being generated and that the problem was with my code rather than with FontLab Studio.</p>
      <p>Now I have a followup question:</p>
      <p>How many users would be terribly annoyed by a font which lacked an 'aalt' feature altogether?</p>
      <p>I ask this because the face I'm working on has a rather large glyph complement and some fairly complex code. I've spent a lot of time trying to optimize the code because earlier versions were getting coverage offset overflow errors when compiling. I'd finally managed to pare things down so that it would compile, but that was while I was under the mistaken impression that my 'aalt' feature was in fact being generated. Once I restore it,  the GSUB table again becomes too large.</p>
      <p>To me, 'aalt' seems less critical than the other features in the font, but I don't know what problems (if any) might result from omitting it.</p>
      <p>Opinions?</p>
      <p>André</p>
