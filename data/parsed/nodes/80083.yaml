  html: |-
    <p>I've discovered that FontLab appears to ignore whatever code I put into my 'aalt' feature and simply generates its own code for this. There are some features which I would like to exclude from 'aalt' but which FLS seems determined to add back in. Is there some preference that I am missing in FLS, or is there simply no way to control the 'aalt' feature from within FontLab?</p>
    <p>André</p>
