    html: |-
      <p>Thanks for your response, Karsten.</p>
      <p>My original suspicion was due to opening the generated font files in FontLab.</p>
      <p>I've now tried opening them in both ttx and OTM, and in neither of these can I find *any* evidence of an 'aalt' feature at all, though I admit that I'm not very comfortable with interpreting the output of either of these tools.</p>
      <p>André</p>
      <p>UPDATE: While I can't find my 'aalt' feature in either ttx or OTM Lite, I am getting little triangles showing up in InDesign's glyph palette, and they seem to be what I'd expect from my aalt feature rather than the one FLS5 is displaying, so it appears that your assessment was correct.</p>
