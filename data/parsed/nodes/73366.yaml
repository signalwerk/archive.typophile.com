      <p>Yes you can. Open both in FontLab Studio and go to Tools&gt;Blend Fonts… and select Build the Multiple Master font.</p>
      <p>That should get you started. Read up on or experiment with the different panel options, and look in the FontLab Studio manual about the requirements of compatible outlines/contours etc.</p>
      <p>Once you figure all that out look into Prepolator and Superpolator which is a superior way of building out multiple weights/styles.</p>
