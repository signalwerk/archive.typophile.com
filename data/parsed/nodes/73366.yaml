  html: |-
    <p>I'm having trouble figuring out if it’s possible to create a multiple master font from two separate weights of one font. I have designed a bold and a light version both in their own separate files. Is it possible to create a multiple master file from the two individual files? </p>
    <p>This is my first attempt at multiple master, so any help would be greatly appreciated.</p>
    <p>—B</p>
