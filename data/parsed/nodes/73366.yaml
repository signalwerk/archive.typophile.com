    html: |-
      <p>Make sure each glyph has the same number and type of nodes. Also the start point must be in the same location.</p>
      <p>I would recommend ignoring the 'Blend" feature and use the older "Mask-to-Master" Technique.</p>
      <p>Assign one of your font to the mask layer of the other. I find it easiest to assign the light weight to the mask layer of the bold. Use the Mask to master command, pick the MM Instance you want to be replaced by the Mask and make sure you check "Do not insert points"</p>
      <p>All of this is in the FL manual. I learned how to do it by reading the instructions contained therein.</p>
