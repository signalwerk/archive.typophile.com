      <p>1. I would recommend drawing in FontLab.</p>
      <p>2. For a sans serif, a good method is to draw the extra bold and ultra thin, and interpolate the rest. The ultra thin is relatively easy, as it can be handled as a stroked path ("Make Parallel Path" in Fontlab).</p>
      <p>3. It depends on how the type may be used. If printed body copy of contrasting weights is anticipated, then the bold should have a larger x-height, so that, for instance, bold subheads don't look smaller than the following regular text. However, if display combo (eg in the same word) are anticipated, then x-height should be the same. When it comes to low-res screen display, it is better to standardize x-height hinting/alignment zones/overshoots.</p>
      <p>4. Verticals should be thicker than horizontals (except in ultra thin, see above), otherwise your maximum weight is constrained to be no more than the thickness of E's horizontal stems in your boldest weight. </p>
      <p>You should start right now on the ultra-bold of this typeface. There are so many "techno" faces that have a limited weight range; they lack personality and usability. In fact, all types show more personality in the extreme variants -- consider Frutiger and Myriad for instance -- Myriad is more distinctive in its bolder and condensed styles.</p>
