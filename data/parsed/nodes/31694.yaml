    <p>Possibly the longest thread name in the World, ever.</p>
    <p>OK, so I've been lazy with the new redraw of my typeface 'Magnitude'. I started the redraw by creating each character as a single outline in Illustrator, with the intention of outlining the paths, resizing and tweaking later, once a base character set had been drawn.</p>
    <p>'Magnitude' Typophile critique thread here: <a href="http://typophile.com/node/31634" title="http://typophile.com/node/31634">http://typophile.com/node/31634</a></p>
    <p>I started the outlining and resizing and noticed a flaw with my technique. When I resize each different weight the x-/cap/ascender/descender height changes, depending on whether I resize according to x- or cap height. The PDF attached kind of illustrates the point.</p>
    <p>What I wanted to know was...</p>
    <p>1. Is there a preferred method for resizing a typeface designed in this way, or is it just not recommended to do it with this technique?</p>
    <p>2. Is it better to design a regular weight and then completely draw from scratch a light and bold weight (or start with a light then do regular and bold)? Are there any standard techniques for up and downscaling type weights?</p>
    <p>3. I've noticed some typefaces where each different weight has different x-height and overshoot. Do you think these should be the same throughout a font family or should they vary between weight?</p>
    <p>4. Even in a monoline typeface, it it advisable to have at least a small difference in thickness between horizontal and vertical stems? I've had conflicting viewpoints on this one so far. If it's advisable, home much less (as a percentage) should the horizontals be to be optically the same width as the verticals?</p>
