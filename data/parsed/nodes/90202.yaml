    date_raw: 21 Feb 2012 — 3:36pm
    votes: null
    html: |-
      <p>I really like the serif. It is very harmonious/classic warm. So I want to see the sans-serif to be as good.<br>
      The "trapeze"  where the vertical weight goes from thick, to thin, to thick is interesting.<br>
      Personally on the /l/ &amp; /h/ &amp; /b/ &amp; /d/ I find it creates a "top heavy" font, a little unbalanced for my taste.<br>
      Also, I miss the beautiful bowls of the serif /d/ &amp; /b/ ... in this condensed sans-serif version.<br>
      Additional I would love to see a sans-serif where you keep the original's playfulness, like the /f/ ascender, and elegance like the /j/ descender. </p>
      <p>I see great potential in this sans-serif font, maybe you could keep more of the original's caracter.</p>
