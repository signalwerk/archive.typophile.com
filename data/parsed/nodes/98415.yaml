      <p>These two types, along with the Futura forms to which they obviously refer, seem to me to represent three examples of a particular genre. Renner's designs may be the first expression of this genre in type, but I reckon one would need to look at a lot of German poster and sign lettering of the 1920s to determine what extra-typographic inspirations he might have had.</p>
      <p>The whole point of a stylistic genre is that is permits of more than one product in that style: different designs with common elements that make them clearly related.</p>
