      <p>The font doesn't appear to be "in the process of designing", since it's being sold for €75.  I don't see any particular resemblance in the glyphs you cite. Both typefaces have what to me is a disturbing mixture of 'standard' glyphs and specialty letters that interrupts reading.</p>
      <p>Euclid has some very strange ligatures; the 'bw' looks more like a misprint than anything else! It has some other natural similarities to Dessau Pro Zukunft - such as Euclid's 'u' compared to Zukunft's 'n'.</p>
      <p> - Herb</p>
