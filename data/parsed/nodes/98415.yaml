    <p>Having a conversation on twitter.</p>
    <p>This morning I was having a conversation with the foundry <a href="http://swisstypefaces.com/">Swiss Typefaces</a> (@swisstypefaces). They are in the process of designing a typeface called <strong><a href="http://swisstypefaces.com/fonts/euclid-bp/euclid-bp-bold/">Euclid</a></strong>.</p>
    <p>I responded asking them if it was inspired by the <a href="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro/">Dessau series of typefaces</a>.</p>
    <p>They responded “<em>no</em>.”</p>
    <p>I was particularly interested in the similarities between the [&amp;] and [a] in <strong><a href="http://www.fontshop.com/fonts/singles/fountain/dessau_pro_zukunft/">Dessau Pro Zukunft</a></strong>.</p>
    <p>I’ll let you decide:</p>
    <p><img src="/sites/default/files/old-images/Euclid and Dessau_5902.jpg"></p>
