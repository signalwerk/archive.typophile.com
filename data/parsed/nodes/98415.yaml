      <p>I know the history of the typeface, and to quote Swiss Type, “<em>Euclid BP is a 21st century font: not another wise revival of an early 20th century geometric font</em>.”</p>
      <p>Gonna have to play the BS card on that one.</p>
      <p>“<em>I don't see any particular resemblance in the glyphs you cite</em>.” </p>
      <p>You’re kidding, right?</p>
      <p>The best I can say is that Euclid is clearly an homage to early 20th century geometric fonts, specifically old Futura sketches. Anything other than that, to me, is a bit of a stretch.</p>
