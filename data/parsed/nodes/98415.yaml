  html: |-
    <p>Having a conversation on twitter.</p>
    <p>This morning I was having a conversation with the foundry <a href="http://swisstypefaces.com/" rel="nofollow">Swiss Typefaces</a> (@swisstypefaces). They are in the process of designing a typeface called <strong><a href="http://swisstypefaces.com/fonts/euclid-bp/euclid-bp-bold/" rel="nofollow">Euclid</a></strong>.</p>
    <p>I responded asking them if it was inspired by the <a href="http://www.fontshop.com/fonts/downloads/fountain/dessau_pro/" rel="nofollow">Dessau series of typefaces</a>.</p>
    <p>They responded “<em>no</em>.”</p>
    <p>I was particularly interested in the similarities between the [&amp;] and [a] in <strong><a href="http://www.fontshop.com/fonts/singles/fountain/dessau_pro_zukunft/" rel="nofollow">Dessau Pro Zukunft</a></strong>.</p>
    <p>I’ll let you decide:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Euclid and Dessau_5902.jpg"></div><p></p>
