      <p><em>The Panose system describes fonts with numbers. Whether it makes it more scientific is arguable.</em></p>
      <p>The purpose of Panose is to map similarities of weight, width and other proportions, along with some stylistic details, between different fonts. Insofar as it does this based upon precise measurement of these features, calculation of proportional ratios, etc. it is objective and methodical (i.e. what people tend to call 'scientific'). Of course, the goal of Panose was font matching and substitution: a way of coming up with the 'best fit' font if the original font in a document were missing. So it works -- assuming font developers accurately recorded the Panose data, which most did <em>not</em> -- within that conceptual and practical framework. It isn't a classification system per se, and the numbers won't necessarily tell you what you want to know about a typeface, but it should tell you what other types are similar in certain ways.</p>
      <p>Unfortunately, like most type description or classification schemes, it breaks down completely beyond the Latin script.</p>
