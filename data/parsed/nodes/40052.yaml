      <p>Back at the top..."Rigorously scientific descriptions and classifications of typefaces are certainly possible..." says RB, but if one asks for a rigorous scientific description and classification of <em>a</em> typeface...what would that be? The periodic table of typographic elements, <em>Elements of a Type's Style</em> has not yet been written, and even it was, without it's companion volumes, <em>Elements of a Type's Use</em>, and <em>Elements of a Type's Output</em>, what do you know?</p>
      <p>Panose, e.g. asketh, and I slightly paraphrase: What number (from 0 to 9) would best describe the X-height, (i.e. the relative height of lowercase characters, presumably to the uppercase;) <em>and</em> the treatment of uppercase glyphs with diacritical marks. That's one number, like it's a toothbrush <em>and</em> a stun gun. John Hudson points out that Panose breaks down "completely" beyond the Latin script. It breaks down partially before it finishes the Latin type circa 1994...and in classification theory, partial breakdown and complete breakdown can be hard to distinguish, I think.</p>
      <p>Dez says, "It seems the moment you have a classification system [...] the arguments begin as to what fits where."<br>
      My experience is quite different. Conflicts occur naturally in the formation of classification systems that, by the nature of what they are trying to classify, cannot be complete or fully described, variety in the characters themselves making rigorous scientific description impossible. Nevertheless, once the system is completely argued out — what fits where, is over, the arguing stops, and the ignoring begins. ;)</p>
      <p>Cheers!</p>
