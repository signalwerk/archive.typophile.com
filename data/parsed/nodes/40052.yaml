      <p>It seems the the moment you have a classification system is the moment the arguments begin as to what fits where. There are always faces that don't fit the scheme exactly and the time and energy it takes to agree to disagree on which pigeon hole to select far outweighs the value of the system. This hardly seems scientific to me but I am not a scientist. As long as we don't take the persuit too seriously, there is some basic value in general categorization just for the sake of description. If you have the argumentative mindset, you might like dueling intellectual arguments over categories but you really have to enjoy that sort of thing.</p>
      <p>ChrisL</p>
