      <p>Type varies across numerous distinguishable dimensions. The most important of these are contrast and construction. These alone make classification possible and useful. If you are insensitive or not attuned to types of contrast or to patterns of construction you loose your grip on form and your sense of where to go. The effort to categorize alone can be enriching, because it forces attention to distinguishable dimensions. So this has a pedagogical benefit. Without it the 'kinship domain' of type is almost unsurveyable, and it becomes difficult to get yourself oriented or locate oneself within it. </p>
      <p>The danger is that a scheme that codes for too-few dimensions or gives pre-eminence to subordinate dimensions blinds one to the relevance of important others.</p>
      <p>Classification or filling-in a niche is not a destination, just a servicable and sometimes fertile strategy or heuristic.</p>
