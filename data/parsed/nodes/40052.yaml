      <p>There are some expectations about type classification which assume that a scientific method would produce accurate identification of type specimens.</p>
      <p>But the distinction must be made between classification and identification, and between typographic images and fonts.</p>
      <p>Trying to identify a typeface from a specimen of a few letters, using a classification system, won't get you very far without expert knowledge. But the same could be said for trying to identify an animal from its tracks--there's a lot of missing information.</p>
