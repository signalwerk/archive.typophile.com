      <p>Developments on the web have changed some approaches to classification that might be worth pondering in relation to type. Here's an interesting article: <a class="freelinking external" href="http://www.shirky.com/writings/ontology_overrated.html" rel="nofollow">Ontology is Overrated</a><br>
      Shirky's observation about the Balkans and Asia made me think of Vox's categories of Garaldes and sans-serifs. Seems like Shirky identifies some of the same types of pitfalls that Dixon did. But following his lead in envisioning a <a class="freelinking external" href="http://en.wikipedia.org/wiki/Folksonomy" rel="nofollow">folksonomy</a> of type looks like a very different kind of solution than Dixon seems to be proposing. (The link to the pdf with more details in the Dixon article seems to be broken, so I'm a bit mystified about what her solution actually is)</p>
