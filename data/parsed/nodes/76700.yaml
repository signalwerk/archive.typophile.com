    html: |-
      <p>Just one more instance of "If it's Tuesday, it must be Belgium" kind of thinking. Typically, the widest element in the last column is "aligned right" i.e., goes to the right edge of the table, but even that is full of assumptions. The data may well be decimal aligned, and one element may have more numbers to the right of the decimal. The column head too is a factor -- sometimes the shortest element in the column head is longer than any entry in the column. If the general style of a table is for the data to center under the column heads, a long word in the column head may set the right margin. Even more so when the style is for the data to be left on the column head.</p>
      <p>Then, not all tables are full measure, nor is all placement of tables less than full measure "right" or "left" on the text page.</p>
      <p>Finally, there are the rules -- top, middle, bottom -- that can be used to give the table a desired width. Often they are just the width of the elements in the table, but they can be extended. Just the ticked when you're setting a table on a 26-pica page, but the data, with reasonable gutters, only reaches 24 picas. You can ether add space to the gutters, or extend the rules to reach 26 picas. If you extend the rules, in effect you have a dummy column on both the far left and right of the table. Alternatively, you can set the table short, but as it approaches the full measure of the text, that usually looks odd.</p>
      <p>The most common approach with the "almost" table above is to just add space to the gutters. For those of you who actually read tables, you know that too much gutter space can make it hard to follow the alignment of the data in a row. Using a dummy left &amp; right column can be a good solution.</p>
      <p>Designing good tables can be as involved as designing a text interior.</p>
