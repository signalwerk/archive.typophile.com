    <p>1. If body text contains small caps, what would happen if in equations/formula there were capital letters as well, would you use small caps for them?</p>
    <p>2. Superiors/subscript, how are they to be best set? I know some fonts have them built in, but are there any guidelines for how the can be best set? One guideline could be, for superiors, align them with the top of the body text ascender, then align the bottom of the superior with top of the x-height. For subscript, align the top of the superior with say half the height of the x-height, then align the bottom of the subscript with the descender?</p>
    <p>3. What is the best way to set numbers in tables? Should they always be set right aligned and the numbers should not be old style, so they align up, and does this really help readers?</p>
