      <p>If anything is «completely incorrect» in this discussion it's general statements. (Ah, the irony.) «Numbers in last column at right must be aligned right.» Must! Across all tables in the world, ever, no matter what they may contain, what the layout looks like, how wide the table is (and the column), and what the number is…</p>
