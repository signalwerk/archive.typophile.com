      <p>Sorry if "unfair." How about this? You're wrong.</p>
      <p>As a general practice, rule or not: with the exception of the stub, the most common arrangement of numerical data in a column is decimal aligned, and centered under the column head. The far right column should be no exception. In the cases where the column head is shorter than the data, the data will perforce be flush right. In my experience, IN GENERAL, column heads are wider than the data in their column.</p>
      <p>EDIT:</p>
      <p>And as long as we're going to fight, using small caps in equations goes against all established conventions. You might as well say that sentences can begin with small caps, except for c, o, u, v, w, x, and z. Get that one by an editor.</p>
      <p>In passing, variables expressed with letters in math are usually set italic. The number of fonts with italic small caps is growing, but far from universal.</p>
      <p>In short, your advice sounds uncritical to me; a knee-jerk reaction -- so we're back to the old cartoon of Tuesday and Belgium.</p>
