      <p><cite>Just one more instance of "If it's Tuesday, it must be Belgium" kind of thinking.</cite></p>
      <p>Just one more instance of misuse of other's words. It's completely incorrect to compare my answer, valid for general and most common situations, and a nonsense statement as "If it's Tuesday, it must be Belgium". You don't need to distort my advice to add your own, especially when you are handling exceptions to general rules considering other graphic elements and particular situations.</p>
      <p>.<br>
      <cite>Why must they always be aligned right, out of curiosity? I can understand from an aesthetic point of view, but I would think that the readability of the column is better when the figures are left-aligned, no?</cite></p>
      <p>The aesthetic question is relevant. But there is also the readability of numbers. If you have just numeric data, right aligment is more adequate because our number system is based on RTL position. So, to quickly identify and compare different quantities, a right aligment is better because it preserves the position of units, tens of units, hundreds etc. The same justifies use of decimal aligment when there are numbers with decimals.</p>
