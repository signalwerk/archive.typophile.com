      <p><strong>1</strong>. Good question. I don't see a problem to use small caps if they result clearly identified as caps in the formula. But most fonts have small caps with the same height of lowercases. This produces rather small characters, probably so much small to replace a uppercase in a formula. In other hand, there are many new fonts with bigger small caps and this seems to be the best choice. Of course, you must do tests to evaluate it better.</p>
      <p><strong>2</strong>. Traditional superscript setting is size reduced to 58% of normal one and position with +33% of baseline shift. Nowadays, many designers consider this somewhat small and you can find larger superiors in recent fonts (Guardian, Meta, Vesper). Additional information <a class="freelinking external" href="http://typophile.com/node/16879" rel="nofollow">here</a>.</p>
      <p><strong>3</strong>. Numbers in last column at right must be aligned right. To other columns, this will depend on your data. If you are handling many columns with numbers, overall alignment at right seems better. With decimals, the decimal dot alignment is preferable. When mixing text and numbers, I prefer to use left or justified alignment.</p>
      <p>Tabular numbers makes sense if exact vertical alignment means something to your table. For example: accounting data, where reader would compare numbers between different lines, is a typical scenario for tabular numbers. But for tables with few numbers, menus, timelines or TOCs (for example), tabular figures are not necessary and may be even distracting.</p>
