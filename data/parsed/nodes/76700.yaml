      <p>Part of your question is, who are you designing for? If you're entering book shows, and your audience is other designers, use small caps everywhere -- Well, maybe not to begin a sentence. But I've seen the word "TiVo" with small caps used for the "T" and "V". Just because it is hard to read doesn't mean it isn't really cool.</p>
      <p>If, on the other hand, the text is suppose to be read by people in a particular field, like mathematicians, take a look and see what they do. (Hint: I've never seen small caps substituted for full caps in an equation).</p>
      <p>The same would apply for old style versus lining figures in a table. A series of dates and dollar amounts, for example, reads quite well when set in os figs, particularly in a book dealing with the 19th or earlier centuries. Did you think they didn't set tables before Victorian times? Once again, what would the audience be comfortable with, on the assumption that audience isn't graphic designers.</p>
      <p>Go to the library. Take a look at the first-line journals in the field. When you feel you want to challenge their ways of presenting information, write your own book. Keeps everybody honest.</p>
