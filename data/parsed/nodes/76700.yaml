      <p>1. I think the equation is clearer when you use regular caps.<br>
      2. Use a font that looks like the one you want to give superiors/subscript which has them build in and use it as a guideline. Best is to simply go for a font that has it already built in.<br>
      Use tabular lining figures, if your font doesn't have that, make sure they're all the same width (including spacing+kerning) It doesn't really help readers, but it's more comfortable to read, i guess.</p>
