      <p>Mr. Freiberger:</p>
      <p>I think the term you want is simply "decimal aligned." This applies whether there is an actual decimal or not. It says simply that within the column, 1s, 10s, 100s, etc, all share a common vertical position.</p>
      <p>It says nothing about where things are located within the column. That's where the miscommunication arises. For example, numbers can first be decimal aligned, then centered, flush right, or left.</p>
      <p>What does bother me is </p>
      <p><cite>especially when you are handling exceptions to general rules considering other graphic elements and particular situations.</cite></p>
      <p>Ah, but who's rules? Readers? Editors? Typographers and graphic designers who've done little of either? Or typographers and graphic designers who who work a lot with both?</p>
