      <p>I'd think the problem isn't just that the Helvetica Neue provided by the system is wonky, but you have a different version of the font than your colleagues. It's also possible you have multiple versions.</p>
      <p>It would help if confirmed exactly which font is involved, and which program you're seeing the problems in.</p>
      <p>Cheers,</p>
      <p>T</p>
