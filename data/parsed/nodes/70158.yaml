    html: |-
      <p>That looks like Helvetica Neue, and it sounds like an all-too frequent occurring problem on Macs.</p>
      <p>(From hear-say:) The problem is caused by the Mac OS; the Helvetica Neue provided by the system is wonky, and causes problems when you are using it in a program such as InDesign. The solution is to install a new, "real font" Helvetica Neue.</p>
      <p>Do some googling -- it's been seen before.</p>
