    <p>Our agency works on our packaging files and sends them back to us to load to our internal system. We use all the same typefaces, etc and everything works fine except the polish is missing characters on my system vs. theirs. Any ideas or solutions to this? </p>
    <p>Any help is greatly appreciated.</p>
    <p>This is what I see...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Polish_Mine_5367.png"></div><p></p>
    <p>This is what they see...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Polish_Powers_3512.png"></div><p></p>
