    html: |-
      <p>The base font is a Didot variation with the leg well up the arm. The closest I found with a quick check was <a href="http://www.myfonts.com/fonts/stawix/seravee/" rel="nofollow">Seravee</a>. The designer has replaced the head serif with a loop. Perhaps someone knows of a font that does this. I don't. To create the k and similar letters you could start with Saravee, or a closer Didot variation, and make loops.<br>
      Don</p>
