  html: <p>Someone in another forum suggested to me that to find out a font name used in a particular pdf file, I could just select some text and from any "context menu", see what the name of the font selected was.  Does anyone know what a context menu in Acrobat is, and if this guy was wrong, how do you find out the name of a particular font in a pdf document, such as the front page of a newspaper?</p>
