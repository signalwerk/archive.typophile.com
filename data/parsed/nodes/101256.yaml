    <p>Hi, </p>
    <p>Is there a typeface that is similar to that of the initials on this book cover from 1537. </p>
    <p>If it helps, according to Wikipedia it was designed by Hans Holbein the Younger. </p>
    <p>Here's some info about the book cover: </p>
    <p><a href="http://commons.wikimedia.org/wiki/File:Design_for_a_metalwork_book_cover,_by_Hans_Holbein_the_Younger.jpg" title="http://commons.wikimedia.org/wiki/File:Design_for_a_metalwork_book_cover,_by_Hans_Holbein_the_Younger.jpg">http://commons.wikimedia.org/wiki/File:Design_for_a_metalwork_book_cover...</a></p>
    <p>Thanks!</p><div class="imageWrap"><img src="http://typophile.com/files/Design_for_a_metalwork_book_cover,_by_Hans_Holbein_the_Younger_3808.jpg"></div><p></p>
