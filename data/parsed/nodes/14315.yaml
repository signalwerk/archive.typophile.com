      <p>Eduardo: This latest round of revisions was great!</p>
      <p>I agree with Tiffany on the crossbar of the E, F and H being too even.<br>
      Notice you your vertical stems have a waist and flair into the serif. Try this here too. Gradually get thicker until the serif (more bracketing too), or in the case of the H maybe a little thinner in the middle and thicker as the crossbar approaches the stems.</p>
      <p>Nick: <cite>I don’t have much experience of looking at faces on the critique forum, but it seems that designers just say, here it is, what do you think? and the critics say, “correct this detail, correct that detail”, and the poor thing gets normalized into oblivion.</cite></p>
      <p>I have to disagree. I have looked at a lot of faces in this critique forum. What I see are the same novice mistakes in the vast majority of cases (eduardo's effort here excepted). Sometimes they have naive charms yes. I don't feel like I'm doing anyone a diservice by pointing them out. As Ed Benguiat says in his classes: "That letter is wrong. But if you want it wrong, do it." He's being totally sincere, and points to Barry Deck as a person who's wrong is right to many many people.</p>
      <p>Great to see you in the critique forums.</p>
      <p>Randy</p>
