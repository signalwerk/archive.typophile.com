    html: |-
      <p>The new lc "g", although well-made, is a bit boring. Ask yourself frankly what was wrong with the original one. The fact that it's anti-chirographic or not how some established designers always make their "g"s is really entirely moot - readers don't react to that stuff, at least not in a text face. And I realize now that the lc "k" needs more character as well.</p>
      <p>Boring might seem "safe", but in this overcrowded scene it more often translates to reduced salability. Unless you have a stellar pre-existing reputation, the font includes thousands of glyphs, or something else that makes it stand out. Slimbach can get away with being boring, in fact he's probably come to depend on it, but you and I Eduardo cannot.</p>
      <p>Like Erik S points out, the funky "g" in Meta<br>
      has been an <cite>asset</cite> more than a drawback.</p>
      <p>hhp</p>
