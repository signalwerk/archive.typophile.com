    html: |-
      <p>Hi Eduardo,</p>
      <p>Two comments after a brief look:<br>
      1. The lowercase looks much better than the uppercase. The main problem with the uppercase is inconsistent weighting of the thin strokes. Compare the middle crossbar of the E with the top. Yes it should be thinner, but only slightly so. And the serif is too lightly bracketed. Compare the top of the E with the thin part of the O, of the U, of the G, of the Q etc. Those are too heavy in my opinion. They match the M and N thin strokes which are also too heavy I think. The caps need consistent modulation. I think matching all the thins to the top of the E will give a good feel. Also, I think the uppercase is slightly too dark compared to the lowercase. For languages with frequent caps (like german) this is a distraction. One other thing: The points on the W and V are not very pointy! They seem too chunky and out of place.</p>
      <p>2. The lowercase j<br>
      The terminal is too weak. It should be as strong as the f. Also, the j needs more support at the baseline. The problem is accentuated by the tapering stem. It almost shrivels away to nothing. Perhaps less taper and start the curve a little higher (closer to the baseline)?</p>
      <p>JFP: What makes a good guillemot? How should his be revised? More point? More stroke modulation? Slightly higher so they work with caps too?</p>
      <p>Randy</p>
