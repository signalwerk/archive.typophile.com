      <p>&gt;there’s a difference between interesting structure and just bad finish,</p>
      <p>Interesting structure can easily look like bad finish, because it stands out and creates unevenness. So it's easy to notice and say, 'clean that up'.<br>
      So if you have a few examples of weirdness, they are excised, and the thing gets an even finish, but ends up bland.</p>
      <p>The other route to go is to multiply the weirdness so that it takes over the font, but in an even, well-finished-weird kind of way.</p>
      <p>Weirdness, pardon me, I mean personality, can also camouflage bad finish, by rendering "good" finish an unecessary fussyness.</p>
