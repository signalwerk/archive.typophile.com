      <p>OK, I guess you've settled on that "g" structure... What I would do though is make the top-right corner of the bottom bowl thicker, towards the outside. The "j" needs slightly more stroke contrast in the tail I think; and I would make its head serif longer.</p>
      <p>UC: Isn't the "C" too wide, and its bottom curve too flat at the end? The "G" I would make a hair narrower too.</p>
      <p>The bar in the ordinals seems too close - in small sizes it will clot. I like your "ch" ligature - very nice. The other two though are a bit unhappy at the head of the "t" though. The bottom-left of the eth seems unhappy. And I would make the bar of the Eth go in less deep.</p>
      <p>Spacing: unless it's for smaller sizes (in which case the color is a bit light, and the vertical proportions a bit too deep*) the spacing is a bit loose - although at "boundary conditions" (like in the "ki") it's fine.</p>
