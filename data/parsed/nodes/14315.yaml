      <p>&gt; creates unevenness</p>
      <p>It depends how you look at it. If somebody considers a certain conventional mean as being some sort of formal requirement then I guess any divergence from that could be called "uneven". But since I don't believe such a mean exists (at least not at the formal visual level) I prefer to see "uneven" as: something confined to overly distracting color; and something that can actually be useful - with there being such a thing as <cite>too much</cite> evenness.</p>
      <p>In this design for example the original "g" -which JF complained about- I would never consider "uneven", even though I can't really be sure it's structurally ideal (although I suspect it's fine, and I like to give the benefit of the doubt to divergence/innovation - as long as it's well-motivated).</p>
      <p>hhp</p>
