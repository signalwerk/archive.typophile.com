  html: <p>This typeface is based on the notion of suggestion vs. statement, and testing the boundaries of legibility and practicality.  The goal is to achieve a subtle, elusive quality, while remaining somewhat comprehensible.   <br>I'm also intrigued by the eye's automatic ability to connect un-connected marks, for example, lines to dots, etc.   <br>I still have some unresolved issues with line variance, and possibly spacing, both of which can be fixed. <br> <br>I appreciate any and all feedback offered.   Bring it. <br> <br>Merci. <br><img src="http://www.typophile.com/forums/messages/29/7431.gif" alt="One curtail"><img src="http://www.typophile.com/forums/messages/29/7432.gif" alt="One Bold Curtail"></p>
