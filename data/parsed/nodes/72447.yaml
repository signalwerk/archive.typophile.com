  html: |-
    <p>Today the Daily Pangram celebrated another milestone: 600 original pangrams have now appeared on the blog, one for each of the last 600 weekdays going back to April 2008.</p>
    <p>I'm marking the occasion by making the pangrams for this week assemble into a pangram-only short story (okay, very short story). You can follow it at <a href="http://dailypangram.tumblr.com/" title="http://dailypangram.tumblr.com/">http://dailypangram.tumblr.com/</a></p>
