    html: <p>Well Jens, that depends which hinting parameters you are talking about, printed on which printer using which driver? High resolution devices are not really supposed to use hinting instructions, but never the less they sometimes render differently on the printed page if you change the hinting. The problem is the total lack of documentation of how printers <em>actually</em> render glyphs. It's the infamous 'black box' where you can poke around inside of it with a knitting needle in search of clues as to what it contains. I have given up on finding the perfect printer. Some are too dark, some are too light, and all of them have issues with overshoot.</p>
