      <p>Claus, I was talking about hints on vertical and horizontal stems, together with the font-wide PS "standard stem" values which as I understand it make sure that similar stem widths are rounded to the same pixel/printer-dot values by the rasterizer.</p>
      <p>In this respect it is a remedy for James’ problem regarding the inconsistent stem weights. But of course it's not a good way to look at the details in the design phase of a typeface. All the methods you mentioned are preferable for that purpose. But you should anyway keep in mind that this specific rasterizing issue will not be present in the final, hinted fonts.</p>
      <p>And yes, usually there's a visible difference between unhinted and hinted fonts on a 1200 dpi printer. Perhaps that's not really a high-resolution device ;) My 1200 dpi printer suffers from the blue zone bug, btw, it suppresses overshoot at all (?) sizes.</p>
