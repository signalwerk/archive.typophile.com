  html: <p>I have noticed that the vertical stems of light sans type have inconsistent stem weights when printed on laser printers, even real 1200 DPI postscript printers. Is this just something that I have to accept and should design proofs that only show text at larger sizes? Should I hint the type before I run my proofs? Are the better printers that I can have print shops run proofs on for me?</p>
