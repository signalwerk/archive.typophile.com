    html: |-
      <p><em>hp?</em></p>
      <p>Correct, Nina :) An old LaserJet 4050 with emulated PostScript. Didn't know that before I got it, but it is still a huge improvement over my previous 600 dpi LaserJet 6 MP (which had real PostScript ...).</p>
      <p>Claus: <em>Regarding the standard stems, I seem to remember that the hinting settings are only supposed to be used from 300 dpi and down. Quite understandable there, but on 1200 dpi printers Georgia in 9pt has a H vertical stem width of 16 dots. One more or less would probably still be visible upon closer examination. The horizontal crossbar in the e is only 6 dots, so one dot more or less would relatively make much more of a visual impact. I still can’t find any information on how this is implemented in printer drivers. If someone has some info on this please post it.</em></p>
      <p>I also was under the impression that hinting was ignored on high-res devices, but I today looked into the Type1 spec and another book and can't find any evidence to support it. There is however a value, <em>BlueScale</em>, which controls at which point size the overshoot suppression stops working. But hints seem to be applied at every size.</p>
      <p>Which seems quite logical to me now, because when type size or resolution increases, the absolute rounding error (1 dot) stays the same, but the relative error in relation to the stem width gets smaller. So hinting isn't ignored, but just becomes more insignificant at higher resolutions. So there's no real need to implement a limit for hinting in rasterizers.</p>
      <p>Georgia, being a font with TrueType outlines, is a different matter. In TT-based fonts you can set specific ppm sizes above which alignment zones or all hints are ignored. (I'm not sure where to find these values in a decompiled font though ...)</p>
      <p>And to mention my printer again, usually I see the effect of hinting in TT fonts at normal text sizes too; a badly hinted TT font can really spoil the printed appearance.</p>
      <p>I completely agree with you that there are too many variables when it comes to hinting and printing :)</p>
