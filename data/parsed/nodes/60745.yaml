      <p>Some points:<br>
      * Make bloody sure the stems really are the same width in Fontlab.<br>
      * Remember to delete all hints AND make sure the option to 'Hint font on export' in Fontlab is disabled.<br>
      * Even blue-zones (vertical alignment zones) can make the printer do un-funny stuff.<br>
      * Print in target size and in something like 4-500% and take a step back.<br>
      * Get a magnifying loupe and study what happens in the target size, I have found that helpful in some instances.<br>
      * Try rendering some text in Photoshop in the printers resolution and see how that compares to what you are seeing through the loupe.<br>
      * Make sure your printer is not crap. Compare it to other printers. All printers have their peculiar rendering quirks.</p>
