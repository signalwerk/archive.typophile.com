      <p>Dear Jens, Nina et al<br>
      That overshoot problem is not on all HP printers, and I think it also depends on how the font-file was generated, the layout application, and how it was printed, eg. directly from the layout application or via a PDF, then in Acrobat or Preview – multiply that with OS version and printerdriver version and printer firmware version. If one was methodical, one could go through the mutations one by one and get closer to what is happening. I will probably not be that person.</p>
      <p>The worst problem I've seen is a special variant of the overshoot problem, where characters with overshoot would simply be moved up the difference between the baseline and the overshoot under the baseline. A bizarre bug, never the less I've seen that one several times from Xerox colour laser printers. I've heard anecdotal reports of the general overshoot problem with HP printers, but it's not present on my Laserjet P2015 if that is any help. Be aware that these things are moving targets, things change from version to version of software and hardware, so don't rely on that old HP story be hold true on today's setup.</p>
      <p>Regarding the standard stems, I seem to remember that the hinting settings are only supposed to be used from 300 dpi and down. Quite understandable there, but on 1200 dpi printers Georgia in 9pt has a H vertical stem width of 16 dots. One more or less would probably still be visible upon closer examination. The horizontal crossbar in the e is only 6 dots, so one dot more or less would relatively make much more of a visual impact. I still can't find any information on how this is implemented in printer drivers. If someone has some info on this please post it.</p>
