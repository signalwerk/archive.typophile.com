      <p>Spook, I think you'll be able to find some great typefaces that would suit your needs for an identity and/or interface, without resorting to the destruction of something else, (not to say that this method doesn't work for some people). There are a lot of questions to be answered first in order to give a proper recommendation. What kind of game is it?*<br>
      I have looked at a lot of new game promos recently, and much of what I have seen in the logos don't exactly fit a distorted, or even a grunged out aesthetic. Many of the darker games are using <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a>, and I see a lot of clean, sans serifs being used for war-based games and fantasy RPGs. I guess I just hate to see game design fall into such a generic style.</p>
      <p>*sorry, I missed the Wrestling part earlier</p>
    html_clean: |-
