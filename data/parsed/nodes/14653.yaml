    html: |-
      <p>&gt; Wrestling: I assume you mean the lucha libre stuff, not Greco-Roman. In which case you might consider Motter Corpus.</p>
      <p>I think Lithos would work in both cases.</p>
      <p>But, seriously if you're looking to include the font or a derivative in your game (say for UI use) you'll need to work out licensing rights with the font owner. I've not seen a standard off-the-shelf EULA that allows distribution of fonts or derivatives with games. </p>
      <p>If the font is going to be used to generate a static bitmap logo then almost any font will do - almost all EULAs allow you to make complete logos and redistribute them in bitmap form with products like games.</p>
      <p>More info on the type of game may help us guide you towards some good font choices. Are you looking for fonts with rivets? </p>
      <p>Cheers, Si</p>
