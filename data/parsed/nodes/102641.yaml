    <p>Ok, so I need to figure out what this font is.  I've compared this to all my fonts and have also used several online sources to try and decipher it but all to no avail.  It's late, I'm tired, my eyes are getting blurry and a proofing deadline looms...</p>
    <p>The kicker is that this looks so familiar - I just KNOW I've seen it somewhere, but do you think I can remember? (Of course not...)</p>
    <p>Anyone have any ideas what font this is?  </p>
    <p>Thanks in advance for any replies :)</p><div class="imageWrap"><img src="http://typophile.com/files/SampleText_6744.jpg"></div><p></p>
