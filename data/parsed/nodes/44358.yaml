      <p>Most likely, Gill Sans Light was "designed" by some team working for Monotype, then approved by a committee before being cut. </p>
      <p>And the specifics of a "design" usually changed from metal to photocomp to digital. Usually not for the best, though sometimes fonts were improved. Gill died around 1940, before photocomp.</p>
      <p>BTW, Gill's best text font was probably Pilgrim, which to my knowledge, has never been digitized. There was a photocomp version, not too successful because the setwidths were poorly done. With a lot of work on the kerning, it was quite nice. We use to set the <cite>South Atlantic Quarterly</cite> in Pilgrim, but had to change to different fonts when PostScript &amp; PDF files became the norm.</p>
