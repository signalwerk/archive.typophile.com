      <p>I understand how in Britain you could get thoroughly sick of Gill Sans' eccentricities, from overexposure to it. But I don't agree with much of Archer's sour analysis of it. </p>
      <p>Yes, you can argue about the "a" tail being too small, but it is in character with the two-weight or relatively highly modulated g and e, and does have a flavor and way of spacing that is a different and arguably good solution. </p>
      <p>There are to me a lot of virtues in Gill's design, and shortcomings in Johnston's that Archer doesn't note. </p>
      <p>The biggest defect in  Johnston's Underground is that the lower case has clotted joins. This is a fundamental defect that needed to be remedied somehow. It is still that way in P22 London Underground, which I think is a pretty faithful revival. Others under the influence of Johnston's none the less still great type face have fixed it in different ways. </p>
      <p>Still, Gill's ideas are by and large very good and to me work visually. The two-weight a is a way of getting all those stacked strokes into the space without being clotted. The g does the same and I think beautifully. </p>
      <p>The spurless b d p q are also ways of reducing clotting in the joins, and add interest to the face, as well as solving a problem. I don't think they are a defect at all. Jeremy Tankard's beautiful Bliss follows Gill here,  with characters that I personally like better than Gill's, but draw on his ideas. Tankard's g also follows Gill's lead, again with a different solution, though in this case not superior to Gill's. </p>
      <p>Gill's face, with its modulations in key spots, overall gives a clean confident impression. Its sharp  t and other details make it a bit too aggressive for my taste, which is why I prefer the softer and more elegant Bliss. </p>
      <p>Still there are occasions on which Gill's more assertive look will do better. It may be way over exposed in Britian, but it was and still is a good typeface. I really can't see the lower case of Johnston's face being well used "as is" for text at all. I fondly remember Johnston's caps on Underground stations from my years in England, and I hope they never change them. The lower case is not so bad on big signage, but still not so great either. </p>
      <p>For all its eccentricities, Gill Sans is still a great face for print. I can't say that for Johnston's lower case.</p>
