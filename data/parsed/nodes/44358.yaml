      <ul>
      <li> <em>It looks to me like the Light face is too thin for use in metal, so I had guessed it was developed as an addition to the Adobe Gill suite, but I’m perfectly willing to accept that it was cut for photocomp.</em> </li>
      </ul>
      <p>There are grounds to believe that Gill Sans Light was developed before the advent of phototypesetting.</p>
      <p><em>‘Monotype’ Book of Information: New Enlarged Edition</em> (London &amp; Salfords: The Monotype Corporation Limited, [1959]) shows Gill Sans Light (Series 362) on pp. 104 and 116. </p>
      <p><em>Specimen Book of ‘Monotype’ Non-Latin Faces</em> (London &amp; Salfords: The Monotype Corporation Limited, [1963]) shows the Cyrillic and the Greek versions of Gill Sans Light (series 362 and 672).</p>
      <p>Both titles were printed letterpress, quite neatly.</p>
      <p><em>A Book of Type and Design</em> by Oldřich Hlavsa (New York: Tudor Publishing Co., 1960) says, on p. 220, ‘Gill Sans was produced in 1927, and between 1928 and 1930 was gradually introduced to the market in the light, medium, bold and bold condensed weights mostly with italics, in sizes from 5 to 72 points.’</p>
      <p>FWIW.</p>
