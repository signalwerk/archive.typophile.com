      <p><cite>It looks to me like the Light face is too thin for use in metal . . .</cite></p>
      <p>As a rule of thumb, you can use a lighter typeface with letterpress than with offset. The ink spread will make the type appear a little heavier in letterpress. This happens with all papers, even coated stocks, though the amount of spread will vary with the paper. Usually the center of the stroke is lighter with letterpress -- the ink is pushed out -- but the edge heavier, so the general appearance is of a little more weight, and better definition.</p>
