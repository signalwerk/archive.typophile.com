      <p>A few notes on the Gill article by Ben Archer in Wills link</p>
      <p><cite> There are three developmental forms of the Gill Sans lowercase ‘a’ on record; revisions were made at the Monotype drawing office and passed back to Gill for approval. The original design for ‘a’ is strikingly similar to Johnston’s (as might be expected), followed by a second attempt which was put into production and can be seen on early specimen sheets. The third and least satisfactory character is seen in all versions of Gill Sans since the early 1930s</cite><br>
      I have seen the second version in logos and signs dating from at least the mid eighties, so at least in photo comp &amp; display it must have survived much longer.</p>
      <p><cite> Gill obliterated the terminus endings of the vertical stroke in ‘b’, ‘d’, ‘p’ and ‘q’; the Monotype drawing office again came to his assistance and revised the forms so that they were preserved in the medium weight (this can be seen on early samples of the series 262). Today however, this feature only persists in the lightest weight of the digital GillSans.</cite> </p>
      <p>These details have survived in the regular cut of Bitstreams version.</p>
