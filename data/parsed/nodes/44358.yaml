      <p>Ah, thank you. It seems like the conglomerate finally got around offering it in PostScript. Unfortunately, no old-style figures or small caps; without them, it is useless to me (&amp; should be useless to everybody). Looking at it, I suspect that all they did was re-digitize the Linotron 202 font, which had such a bad character fit.</p>
      <p>The basis for Pilgrim was Bunyan, a private press font. I believe Bunyan never had an italic -- I use to know what Linotype did for an italic, but have forgotten. It would be nice if the new Linotype/Monotype conglomerate had gone back to the metal fonts &amp; done it right. Pilgrim was a better text font than Joanna &amp; far better than Perpetua.</p>
      <p>* * * </p>
      <p>I just went &amp; looked, Gill Sans Light was available for the Linotron 202, a photocomp machine. Linotype &amp; Monotype cross-licensed fonts in those days, since fonts were proprietary to the typesetting machine.</p>
