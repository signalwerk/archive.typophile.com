  html: <p>80 years after its initial release, it seems I can't walk 100 metres without seeing something set in <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a>. But can anybody provide any info on the fantastic light weight – like who designed it? Linotype, MyFonts and the other usual sources simply state 'by Eric Gill', but I doubt it's quite as simple as that! Thanks, Lir</p>
