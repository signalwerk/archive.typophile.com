      <p>Nick, I am sure you know that what you show here is the <em>custom version</em> of Gill Sans created for the continental/international market. It is an imitation of Futura commented on by Walter Tracy in his <em>Letters of Credit</em> (p. 95). Its alternates — AJMNQRWW and abdgpqstuw (roman), and JMQ and aaefgptu (italic) — are set in a separate line in the <em>‘Monotype’ Book of Information</em>. The figures look especially unauthentic...</p>
