      <p><cite>Most likely, Gill Sans Light was “designed” by some team working for Monotype, then approved by a committee before being cut.</cite></p>
      <p>I was guessing something like that had happened. It looks to me like the Light face is too thin for use in metal, so I had guessed it was developed as an addition to the Adobe Gill suite, but I'm perfectly willing to accept that it was cut for photocomp. It's a shame that history doesn't record Gill's posthumous 'collaborator', Gill Sans Light is something to be proud of, IMHO.</p>
