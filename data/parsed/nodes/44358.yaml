      <p>The identity of the "collaborators" in the drawing offices of both Monotype and Linotype are generally obscured in the mists of time. You have to remember that up until recently the manufacture of type was viewed as just that: manufacturing. Type design was essentially an industrial art. There were scores of folks working in the drawing office dutifully drawing out all the characters for each size of any given design. They were not generally acknowledged individually. </p>
      <p>Some of these identities can be recovered, at least for Linotype, by searching the archive of drawings at the Museum of Printing in North Andover. Linotype drawings used a format similar to industrial or architectural drawings, with title boxes listing all the pertinent manufacturing information, project number, date, etc., including the worker who did the drawing and approval signatures from the chain of approval. (I not familiar with the Monotype drawing practices.)</p>
      <p>-- Kent.</p>
