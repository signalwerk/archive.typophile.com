    <p>So I have a new client. He's got some demands that are a bit funny to me. But then, when doesn't the client have these?</p>
    <p>For example, he wants his product to use a light bulb... yeah It's too cliche for me but he's the client. The logo is for software apps... the trick is that he wants icons too. SO I extended the light bulb logo to implement through the icons too... like so:</p>
    <p>It is what it is. Obviously very riffed, very early, and just throwing it out there... The thing is he turned it down and said he wants more "3D" and more Helvetica rounded... he pointed me to this... yikes!</p>
    <p>So I decided I needed to see some stuff with Helvetica rounded that I like. I'm just having a hard time finding good logos with it off the top of my head. </p>
    <p>p.s.... be nice:)</p>
