      <p>Also the 2.0 doesn't read to me 2.0 at all.  But the raised o with a dot/line under it has a special meaning in Spanish and some other romance languages.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
