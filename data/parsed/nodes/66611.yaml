      <p>Thanks everyone! This font is going to be amazing. We had 379 people submit designs from 37 different countries. </p>
      <p>Chank Diesel is doing an amazing job behind the scenes putting the font together. The font will be sold for $20 (same as Font Aid III) through several different font distributors. We’ll announce which distributors once the contracts and plans are finalized. </p>
      <p>All money raised will be donated to Doctors Without Borders to help with their work in Haiti. </p>
      <p>The SoTA board is overjoyed by the response to this project. We hope many of you will join us at our annual conference being held this year in Los Angeles, California at the end of August (<a href="http://www.typecon.com" title="www.typecon.com">www.typecon.com</a>). We also encourage you to become a member of SoTA to help support projects such as Font Aid (<a href="http://www.typesociety.org/memjoin.html" title="http://www.typesociety.org/memjoin.html">http://www.typesociety.org/memjoin.html</a>) . SoTA is an international not-for-profit organization dedicated to the promotion, study, and support of type, its history and development, its use in the world of print and digital imagery, its designers, and its admirers.</p>
      <p>Thanks again! You guys are amazing!</p>
      <p>Michelle &amp; the SoTA board</p>
