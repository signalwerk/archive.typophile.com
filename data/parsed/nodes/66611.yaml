  user: 30066
  date: 2010-01-24T15:50:00
  date_raw: 24 January 2010 - 3:50pm
  votes: 0
  html: |-
    <p>For those who have contributed to the Font Aid IV Project, I thought it would be cool to get a cheeky preview of what you lovely people submitted.</p>
    <p>Its not necessarily a crit, just a place to see what different styles and variations you come up with. Feel free to comment how you wish tho.</p>
    <p>I went for a simple, circley, wiggly, snowman style :)</p>
    <p>And off course what a great thing the Font Aid team are doing to raise money for this tragedy. Good to know there's so many caring people out there.</p>
    <p>---<br>
    Joe</p>
    <p><img src="/sites/default/files/old-images/snowman_6518.png"></p>
