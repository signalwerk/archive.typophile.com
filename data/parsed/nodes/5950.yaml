    html: '<p>Howdy Mr. Jefferson Lomax. <br> <br>Definitions and samples of kerning are written in many books, <br>but since the physical square of the letter is disappeared, <br>you have to be able to read the white and imagine it. <br>Kerning is about painting somehow. <br>A link for you: <a href="http://www.owlsoup.com/foamtrain/glossary/" target="_blank">http://www.owlsoup.com/foamtrain/glossary/</a> <br>I played with your logo. Cool monogram. <br> <br>Best, <br>AS <br><img src="http://www.typophile.com/forums/messages/4100/42354.gif" alt=""></p>'
