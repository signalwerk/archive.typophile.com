    html: "<p>Jefferson, <br> <br>I think the kerning  looks better and the words more even. <br> <br>For what it's worth: I really have to say that the i should keep its original round dot. The combination of letters 'ig' make a nice vertical balance at that part of the word and the modified dot just makes the letter and word look somehow squashed or imparied. <br> <br>The a in Lomax looks a little small like the bottom of the bowl isn't descending below the baseline as it should and the  recessed crown on it make it look like it's timid. <br> <br>Jon</p>"
