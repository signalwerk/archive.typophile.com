    html: <p>Howdy John, <br> <br>I have replaced the dot on the "i" but haven't changed the "a" though. It is the original "a" from Friz Quadrata and in Illustrator it bottoms out at the same level as the other round letters used here. I wonder if the shortness your seeing may be due to conversion to raster format. When I am more confident, I'll just design all the lettering instead of "adjusting" someone elses design.   ...gimme time. <br> <br>On a sidenote, I am designing my first font that I'll post in the critique section soon. I've listened to this forum for a while now and am impressed by the professional critiques that are given.</p>
