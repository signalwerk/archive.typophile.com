      <p><cite>Also when is the right time to use petite caps?</cite></p>
      <p>For abbreviations in running copy or to establish a hierarchy. </p>
      <p>• It feels more like haughty clothes for older women than creative couture. This is a combination of the monogram, only using a single color, type choices, and overuse of caps all combining into something stuffy.<br>
      • The use of bullets in ”• LORRI • C“ feels unbalanced within your compositions.<br>
      • The connection between the letters in the monogram looks bad and is not necessary. If you really want letters like this to connect in that way, draw them.<br>
      • “High Fashion and Dressmaking”, not “high fashion &amp; dressmaking”. You’re resorting to gimmickry with the ampersand and all-lowercase. That makes the script, the small caps, and the monogram feel like gimmicks as well.<br>
      • Go easy on the small caps. They don’t harmonize well with the figures the LORRIC set in caps all over the place gets monotonous.</p>
