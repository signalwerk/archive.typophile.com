    <p>I've created the logo and identity for Lorri C. - A high fashion design &amp; dress making business.</p>
    <p>It's the first time I've used Mrs Eaves as a typeface so I wanted some clarifications on the usage:</p>
    <p>On the business card, I've used Mrs Eaves Small Caps for most of the text (except Roman for one line) however it seems the numbers are a lot smaller than the rest of the letters and the brackets a lot bigger, I've had to make the brackets two point sizes smaller. Is this what I should be doing?</p>
    <p>Also when is the right time to use petite caps? And I wish there was a bold small caps :(</p>
    <p>In general, any feedback would also be appreciated. It's my first post on here but I want as much criticism as I can get so don't hold back.</p>
    <p>Thanks in advance.</p>
    <p>Jacob</p>
