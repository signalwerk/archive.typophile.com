      <p>Hi Tilman,<br>
      I'm afraid that my specimen PDF is not faulty :-P<br>
      The idea is that the user can combine two Alternate/Style setting to access the variants in this typeface. </p>
      <p><strong>Alternates / Style 1:</strong><br>
      By choosing <em>Stylistic Alternates</em> (in Illustrator for example) or <em>Stylistic Set 1</em> (in InDesign) you’ll get round punctuation marks and alternates of "I", "a", "b", "g", "i", and "l".</p>
      <p><strong>Style 2:</strong><br>
      Only choosing <em>Stylistic Set 2</em> will give you access to an alternate "a" as well as "y", upright italic designs if you will.</p>
      <p><strong>Alternates / Style 1 + Style 2:</strong><br>
      Combining <em>both styles</em> will give you the same alternates as in Style 1 but with (humanist) upright italics for "a", "g" and "y".</p>
