      <p>Very common problem. See this solution <a href="http://forums.creativecow.net/thread/2/917034" rel="nofollow">Creative Cow:</a><br>
      my solution was to create a composition from one of the AE presets first and then tweak the settings slightly to match my movie properties. Adding my movie clip to this composition gives me no errors and we're good to go.</p>
      <p>&gt; update the trial version from 8.0.0.298 to 8.0.2<br>
      Better idea: try their new deal (till next month) — PPK: Pay Per Keyframe. That said, you have the full version for a limited time  :^)</p>
