    <p>Can anybody here help this volunteer?</p>
    <p>This is a huge long shot and I know this isn't the Adobe support board but... this is slightly type related.</p>
    <p>I am making some short videos for Typecon in a 30 day trial of Adobe After Effects CS3. And While it is a hellaciously cool and powerful program it also seems to be hellaciously buggy. The error I keep getting is cutting into my productivity is and so it is putting the project into real jeprody. </p>
    <p>The error itself is ' overflow converting ratio denominators ( 17:: 19 ) '</p>
    <p>There are very few references online regarding this error but all of them suggest that the error is associated with pushing the limits of memeory with 2 hour long projects with huge file sizes. This project is the opposite. Super short &amp; very small data sizes for the cast members. The time on the project is 9 min. It does use a Sound file ( 4.5 Megs )</p>
    <p>In case it is of any help - what I am doing is panning over and fading in and out of photos and Jpegs of Fonts.</p>
    <p>The one idea I had which was to update the trial version from 8.0.0.298 to 8.0.2 did not work probably because the trial version is not eligible for the upgrade.</p>
    <p>Thanks!</p>
