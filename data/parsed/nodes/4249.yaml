    html: "<p>{Constantin, I'll try to stop - but you gotta get Kent to cooperate too! :-} <br> <br>It's strange: I dug out my copy of the ATypI Delegates Report of 1999-2000 (wonderfully set by Maxim Zhukov) and the Fenway in there (at a larger point size) seems to work great; so I assumed that it's spaced tighter than an SI. But then I scanned it up, and you're right - it's the same! This is especially strange because the point size in SI is smaller, which means more looseness would be better, but then how could the BW setting look better?! Well, it did to me at least. <br> <br>But maybe my memory of the SI/BW difference has been flipped? That would surprise me though. Or is it possible that the too-great <i>leading</i> in SI (which we agree on) is making the boumas seem too loose? Like I said, strange. <br></p>"
