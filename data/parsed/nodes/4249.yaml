    date_raw: 19 Apr 2004 — 10:37am
    votes: null
    html: <p><i>&gt;Kent, I'm simply assuming that Carter spaced Fenway very well, and coupled with the fact that the setting in SI is too loose (besides the too-great leading you point out), this leads to the conclusion that they messed with it (or at least that BW messed with it less).</i> <br> <br>Hrant, SI uses Fenway exactly the way Carter spaced it, as near as I can tell from what I have. (John might be able to corroborate this, if he wants to take the time to compare SI and his copy of Fenway.) So you are in fact criticizing Carter's spacing. Fine, no problem. I'm sure Matthew would not claim to be perfect, and everyone's entitled to their opinion; but I just thought you should realize that. <br> <br>I think <i>Men's Fitness</i> is probably using Farnham, but that could have been what I saw and didn't look close enough.  <br> <br>Daniel, <i>Esquire</i> uses Hoefler's Mercury -- which is based on some of the same models as Carter's Fenway, with a similar stylistic approach, so it's easy to confuse them. <br> <br>Constantin, sorry to further the tangent to "your" thread.  <br> <br>But your initial query is somewhat contradictory. You ask for "an honest top-10-fonts-list of the fonts you most use"; but later refer to a "fav 10". These are not necessarily going to be the same list. As John implies in his post, a list of favorites will not necessarily include fonts that are most used, depending upon the needs of one's projects, and vice versa. <br> <br>Which would you rather have -- a list of my current favorites, or a list of the fonts I find most useful and use most? <br> <br>-- K. <br></p>
