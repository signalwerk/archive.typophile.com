    html: "<p>In no particular order, my current favorites: <br> <br>Centaur <br>Futura <br>Brioso <br>Warnock <br>Minion <br>Myriad <br>Arcana <br>Caecilia <br>Iowan Oldstyle <br>Kabel (non-ITC) <br>Goudy Sans <br> <br>Special mentions and guilty pleasures: <br> <br>Albertus <br>Blue Island <br>Chaparral <br>Columbus (ATF display face, not the Monotype face of the same name) <br>Gill Sans <br>Kepler <br>Le Monde Livre <br>Optima Nova <br>Sabon Next <br>lots of funky stuff circa 1885-1925 <br> <br>The list is slanted to stuff available through Adobe because those are the typefaces I work with all the time. There's plenty of other good or great stuff out there, but most of it I have not used enough to really get a strong opinion of its wonderfulness. <br> <br>List subject to change without notice. Except where required by local law, all warranties are expressly disclaimed. Fnord. <br> <br>T</p>"
    html_clean: "<p>In no particular order, my current favorites: <br> <br>Centaur <br>Futura <br>Brioso <br>Warnock <br>Minion <br>Myriad <br>Arcana <br>Caecilia <br>Iowan Oldstyle <br>Kabel (non-ITC) <br>Goudy Sans <br> <br>Special mentions and guilty pleasures: <br> <br>Albertus <br>Blue Island <br>Chaparral <br>Columbus (ATF display face, not the Monotype face of the same name) <br>Gill Sans <br>Kepler <br>Le Monde Livre <br>Optima Nova <br>Sabon Next <br>lots of funky stuff circa 1885-1925 <br> <br>The list is slanted to stuff available through Adobe because those are the typefaces I work with all the time. There's plenty of other good or great stuff out there, but most of it I have not used enough to really get a strong opinion of its wonderfulness. <br> <br>List subject to change without notice. Except where required by local law, all warranties are expressly disclaimed. Fnord. <br> <br>T</p>"
