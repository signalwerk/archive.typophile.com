    html: <p>Hrant -- <br> <br>I remain mystified about what you mean when you say that <i>BusinessWeek</i> does Fenway greater "justice" than <i>Sports Illustrated</i>. <br> <br>If you'd said you prefer BW to SI, then so be it -- to each his own.  <br> <br>But "justice"? <br> <br><i>Sports Illustrated</i> is, of course, the client for whom Carter designed Fenway. They use it, basically, at the size for which it was originally intended and at the default spacing that Carter gave it. Mostly, I believe, they use it at 9 point (on 11). Carter has cited Fleischmann's smaller types (approx. 8 pt) as an inspiration. <br> <br>I have no quibble with <i>BusinessWeek</i>'s setting (except that inexplicable thing with the f-ligature spacing). But why do you say that setting Fenway with tighter tracking and less leading is doing it more "justice"? <br> <br>It's been a while since I compared the two settings directly, but mostly what I recall is that BW is set tighter with less leading, and SI has H&amp;Js that vary letterspacing a little more (too much for my taste).  <br> <br>BTW, I recall noticing recently that another magazine has adopted Fenway for text, but I can't remember exactly which -- some men's health magazine or something, I think. <br> <br>-- K. <br></p>
    html_clean: <p>Hrant -- <br> <br>I remain mystified about what you mean when you say that <i>BusinessWeek</i> does Fenway greater "justice" than <i>Sports Illustrated</i>. <br> <br>If you'd said you prefer BW to SI, then so be it -- to each his own.  <br> <br>But "justice"? <br> <br><i>Sports Illustrated</i> is, of course, the client for whom Carter designed Fenway. They use it, basically, at the size for which it was originally intended and at the default spacing that Carter gave it. Mostly, I believe, they use it at 9 point (on 11). Carter has cited Fleischmann's smaller types (approx. 8 pt) as an inspiration. <br> <br>I have no quibble with <i>BusinessWeek</i>'s setting (except that inexplicable thing with the f-ligature spacing). But why do you say that setting Fenway with tighter tracking and less leading is doing it more "justice"? <br> <br>It's been a while since I compared the two settings directly, but mostly what I recall is that BW is set tighter with less leading, and SI has H&amp;Js that vary letterspacing a little more (too much for my taste).  <br> <br>BTW, I recall noticing recently that another magazine has adopted Fenway for text, but I can't remember exactly which -- some men's health magazine or something, I think. <br> <br>-- K. <br></p>
