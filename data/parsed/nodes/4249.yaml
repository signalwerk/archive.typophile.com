    html: "<p>The best typeface is always the best typeface for a specific job, and it is pointless to try to identify top typefaces without the context of a particular text or project. So here is a list of typefaces that I currently admire very much as works of design, for various reasons, with the caveat that I might never have a good reason to use some of them (to date I have used six of the ten). In alphabetic order, currently available digital Latin typefaces only: <br> <br>Caecilia (Peter Matthias Noordzij) <br>Coranto (Gerard Unger) <br>Dante (Giovanni Mardersteig)* <br>Erhardt (? Monotype) <br>Fenway (Matthew Carter) <br>Haarlemmer (Jan van Krimpen) <br>Kinesis (Mark Jamra) <br>Plantagenet Novus (Ross Mills) <br>Shaker (Jeremy Tankard) <br>Trinit</p>"
