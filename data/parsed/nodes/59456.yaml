    <p>Hi everybody,<br>
    I have a major problem with my (already quite short) descenders: they don't appear on screen! It seems to be a hinting problem, but I tried the auto-hinting in fontlab and a manual basic hinting (even worst), the alignement zones are set, and still I have nothing under the baseline (the commas do strange things as well... oh wait, the g is ok)<br>
    Another typeface I am working on works fine on screen, without hinting and with completely screwed up zones, and I couldn't find any difference in the font infos.</p>
    <p>Does someone have a idea?</p>
