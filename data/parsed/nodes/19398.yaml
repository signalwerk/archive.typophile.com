    <p>Hello.</p>
    <p>I wonder if any one can help me. I have a bit of a typographic design problem.<br>
    I have to lay out a design that is going to be carved onto Portland stone by a stonemason.<br>
    Hope the following makes sense.<br>
    There are blocks of portland stone. Please see image.</p><div class="imageWrap"><img src="files/panels.jpg"></div><p></p>
    <p>The panels are marked Type A1.<br>
    Names are going to be carved into the stone.<br>
    The first Type A1 column from the right is the first column to have names on. These people are more important. These will have two names on each panel within the column. The biggest sized font.<br>
    The second Type A1 column will have three names on each panel within the column. The medium sized font.<br>
    The third Type A1 column will have five names on each panel within the column. The smallest sized font.<br>
    This isn’t the way I would have done it. I would have had the font size all the same!!<br>
    But no…<br>
    As you can see the layout of the stone panels makes a strong grid. I have decided because the strong grid and its a modern building that the text should be right aligned. Fine.<br>
    Names might have to be added later on so this means that the names should be aligned to the top of the panel (theres a margin). OK.<br>
    But here is my biggest problem. Is it right to align the fonts of each of the three different type sizes to the top of the font rather than the baseline? If I align to the baseline there will be more of a gap at the top of the panel with the smallest font. What do you think I should do? Hope this all makes sense. This is giving me a headache!</p>
    <p>D.</p>
