    html: |-
      <p>My take would be to align the baselines because they are the most constant element. I would also use the baseline grid set by the largest point size to use for the next two columns.<br>
      e.g. (these are hypothetical sizes) 1st 24/30, 2nd 18/36, 3rd 12/42 [point size/leading].</p>
      <p>What typeface are you using, is it being routed or carved?</p>
      <p><em>These people are more important… The biggest sized font.</em> Clients you’ve got to love them (or bury them under a block of Portland stone)</p>
      <p>Hope it all works out<br>
      Tim</p>
