      <p>This is amazing! I hadn't seen this before; it's really delightful! I wonder who had the time to put together such an incredible pastiche. It's like Ninja Burger, or the Yes Men, or Spinal Tap in the thoroughness of execution. I love all of the links to other pastiche sites, and the goth "calligrapher", and the custom type projects. (A logo for a local band. Brilliant.)</p>
      <p>I'm curious to know what the end game is for this project. Bravo!</p>
      <p>JN</p>
