    html: <p>The album was released in 1977, so this is pre-digital. It's closer to Monotype's version of Benton's <a href="http://www.fontshop.com/fonts/singles/creative_alliance/eagle_bold/&amp;sample_text=%E2%80%9CHEROES%E2%80%9D&amp;sample_size=72" rel="nofollow">Eagle Bold</a>. Font Bureau's <a href="http://www.fontshop.com/search/?q=eagle" rel="nofollow">Eagle</a> is a bit more narrow, but a better digitization with more weights and decent spacing.</p>
    html_clean: <p>The album was released in 1977, so this is pre-digital. It's closer to Monotype's version of Benton's <a href="http://www.fontshop.com/fonts/singles/creative_alliance/eagle_bold/&amp;sample_text=%E2%80%9CHEROES%E2%80%9D&amp;sample_size=72" rel="nofollow" class="link-external">Eagle Bold</a>. Font Bureau's <a href="http://www.fontshop.com/search/?q=eagle" rel="nofollow" class="link-external">Eagle</a> is a bit more narrow, but a better digitization with more weights and decent spacing.</p>
