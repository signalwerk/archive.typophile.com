    <p>I am looking for a handwritten font to use for my own personal signature/autograph. Can anyone offer suggestions for a font that can serve this purpose that is professional and sophisticated yet sporty and casual? Something a bit flowy, flourishy and calligraphic but not too much.</p>
    <p>Olicana Rough is almost perfect.<br>
    <a href="http://www.veer.com/products/typedetail.aspx?image=GTT0000020#flont" title="http://www.veer.com/products/typedetail.aspx?image=GTT0000020#flont">http://www.veer.com/products/typedetail.aspx?image=GTT0000020#flont</a></p>
    <p>Emily Austin is great but I'd like something more modern.<br>
    <a href="http://www.typequarry.com/type.html?sku=042&amp;cart=10614938411026231" title="http://www.typequarry.com/type.html?sku=042&amp;cart=10614938411026231">http://www.typequarry.com/type.html?sku=042&amp;cart=10614938411026231</a></p>
    <p>Caliban is close but I'm looking for something with a bit more personality.<br>
    <a href="http://www.myfonts.com/fonts/linotype/caliban/" title="http://www.myfonts.com/fonts/linotype/caliban/">http://www.myfonts.com/fonts/linotype/caliban/</a></p>
    <p>Gizmo.<br>
    <a href="http://www.veer.com/products/typedetail.aspx?image=GTT0000006#flont" title="http://www.veer.com/products/typedetail.aspx?image=GTT0000006#flont">http://www.veer.com/products/typedetail.aspx?image=GTT0000006#flont</a></p>
    <p>Thanks so much for any help you can provide!</p>
