  html: |-
    <p>Originally from Chile, Rodrigo 'Tuco' Ramirez graduated from Universidad Catolica de Valparaiso in Chile. Self-taught in typography, he has been involved with type design since he was a kid 'trying to invent his own letters'.</p>
    <p>Rodrigo is a lecturer in the School of Design at the Pontificia Universidad Catolica de Chile (more info at <a href="http://www.det.cl" title="www.det.cl">www.det.cl</a>) and Universidad Diego Portales in Santiago.</p>
    <p>As a member of the TCL collective he publishes his non-commercial fonts (TCL IndoSans, TCL Escuelera) through Tipografia.cl.</p>
    <p>More recently he has released Digna, his first commercial font, through Union Fonts.</p>
    <p>[Rodrigo Ramirez, April 2005]</p>
    <p>Web site: <a href="http://www.tipografia.cl/" title="http://www.tipografia.cl/">http://www.tipografia.cl/</a> [link not working anymore]</p>
