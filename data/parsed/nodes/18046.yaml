      <p>Nothing like getting a head start, I suppose.</p>
      <p>The ornament silhouette doesn't really work for me. Maybe the pattern in the clef could be made more snowflakey?</p>
      <p>Why is the type so many different sizes? Restraint is always tasteful.</p>
      <p>Why is "Joyous" capitalized?</p>
      <p>Not so wild about the swashy initial 'W'. Perhaps it would be best to replace all of the text with a more scriptlike serif face like Brioso or one of the ten gazillion excellent script faces that have come out over the last few years.</p>
