      <p>I read the ornament as a cartoon bomb, the top right ornament seems superfluous as does the full stop at the end of the message.<br>
      You need to spend some time working on the type; it seems tracked too tight and the relationships between the lines aren't working in terms of size or alignment and further have little relationship to your note device.<br>
      Tim</p>
