  html: |-
    <p>A sub-genre of <a href="/wiki/blackletter" class="freelinking" rel="nofollow">blackletter</a> scripts. Like all blackletter and humanist scripts, this evolved over the Middle Ages from <a href="/wiki/Carolingian%20miniscules" class="freelinking" rel="nofollow">Carolingian miniscules</a>. The main characteristic is that of rounded letterforms, or rather curves that are broken os less places than other blackletters. It does not have the strict vertical stress of the <a href="/wiki/textura" class="freelinking" rel="nofollow">textura</a> style of blackletter.</p>
    <p>Rotunda letters, also called <em>Rundgotisch</em> in German, were more popular in Southern Europe as printing was inaugurated, whereas the textura and the <a href="/wiki/bastarda" class="freelinking" rel="nofollow">bastarda</a> seemed to dominate Northern Europe.</p>
    <p><strong>Popular Rotunda Typefaces</strong><br>
    <a href="/wiki/Wallau" class="freelinking" rel="nofollow">Wallau</a><br>
    Weiss Rundgotisch</p>
