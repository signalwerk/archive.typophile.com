  html: |-
    <p>A sub-genre of <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> scripts. Like all blackletter and humanist scripts, this evolved over the Middle Ages from <a href="/node/add/wiki?edit%5Btitle%5D=Carolingian%20miniscules" title="Create node &quot;Carolingian miniscules&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Carolingian miniscules</a>. The main characteristic is that of rounded letterforms, or rather curves that are broken os less places than other blackletters. It does not have the strict vertical stress of the <a href="/node/13831" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Textura</a> style of&nbsp;blackletter.</p>
    <p>Rotunda letters, also called <em>Rundgotisch</em> in German, were more popular in Southern Europe as printing was inaugurated, whereas the textura and the <a href="/node/28150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bastarda</a> seemed to dominate Northern&nbsp;Europe.</p>
    <p><strong>Popular Rotunda Typefaces</strong><br><a href="/node/13150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Wallau</a><br>
    Weiss&nbsp;Rundgotisch</p>
