  html: <p>Founded in London in 1964, the Society is interested in the history of printing and encourages both the study and the preservation of printing machinery, records, and equipment of historical value. Their website is at <a href="http://www.printinghistoricalsociety.org.uk/" title="http://www.printinghistoricalsociety.org.uk/">http://www.printinghistoricalsociety.org.uk/</a></p>
