    html: <p>Considering there's only few letters, could be a custom based on an existing typeface. <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100013" rel="nofollow">HTF Knockout no26 Flyweight</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/dtptypes/newhouse-dt/super-condensed/" rel="nofollow">DT Newhouse Super Condensed</a> or <a class="freelinking external" href="http://new.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/reforma-grotesk-medium/" rel="nofollow">Reforma Grotesk Medium</a> could easily do the job (manually lowering crossbars and chunking some terminals).</p>
    html_clean: <p>Considering there's only few letters, could be a custom based on an existing typeface. <a class="freelinking external link-external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100013" rel="nofollow">HTF Knockout no26 Flyweight</a>, <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/dtptypes/newhouse-dt/super-condensed/" rel="nofollow">DT Newhouse Super Condensed</a> or <a class="freelinking external link-external" href="http://new.myfonts.com/fonts/paratype/reforma-grotesk-bold-e/reforma-grotesk-medium/" rel="nofollow">Reforma Grotesk Medium</a> could easily do the job (manually lowering crossbars and chunking some terminals).</p>
