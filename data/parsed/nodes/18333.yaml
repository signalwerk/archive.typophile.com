  html: |-
    <p>I am doing a project on Japanese music and wanted to use Japanese text, but I do not know how the kanji characters are ordered in the glyphs in the unicode for the Hiragino Mincho Pro and Kazuka Mincho Std fonts.  The characters are not ordered by stroke number, so does anyone know how to find the correct character that you need.  Thank you for any help anyone can give me.</p>
