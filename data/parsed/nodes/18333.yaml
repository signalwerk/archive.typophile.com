    html: <p>If you are using a Mac, open your international settings and allow all Japanese settings. If your Mac is set for American English, a little American flag will appear at the top of your screen. Drag down to Katakana, then phonetically type in the Romaji version of the kanji- teh corresponding kana will appear. Highlight it, change to the Kanji setting, and left- or right-arrown to get the correct character. (You may arrow for a bit to find the correct character.) :)</p>
