    html: <p>I am using a computer in a computer lab at my school, so many people use the computers.  I know that someone used Japanese before, but it was very difficult to switch back to English.  I have no idea what they did to enable the Japanese settings, so I was wondering, with your way, how easy is it to switch back to English?  And I probably should know this, but where are the international settings?  Thanks for you help.</p>
