    html: |-
      <p>In my opinion, in a perfect world, the First Amendment would be the law of the land in every nation. This would mitigate against penalties for inappropriate use of Comic Sans. Thus, the rule <em>de gustibus non disputandum</em>, usually translated as "there is no accounting for taste", should continue to hold.</p>
      <p>This, of course, does not change the fact that in a <em>perfect</em> world, no one would be <em>tempted</em> to misuse Comic Sans. Maybe Microsoft would license an appropriate typeface from Comicraft to include with Windows that would replace it for the uses to which it is not suited.</p>
      <p>Oh, wait a moment. In a <strong>perfect</strong> world, we wouldn't be <em>using</em> Microsoft Windows on our computers.</p>
      <p>But I do think it's excessive to praise Helvetica as the world's "most beautiful" typeface. It <em>is</em> a beautiful one that nears perfection. But it's still excessive to praise Helvetica, Times Roman, Baskerville, Garamond, or even Eusebius, Centaur, or Doves in that respect. There are too many typefaces out there that are beautiful and near perfection to single out just one as standing above all the others.</p>
