      <p><img src="/sites/default/files/old-images/comic_5385.jpg"></p>
      <p>Actually I don't love it, but as others have mentioned the problem is that it's used inappropriately.</p>
      <p>I like Helvetica and use it all the time (some of my clients use it as a corporate font), but you need to be careful as it was heavily used a few decades ago and work can look dated if you're not careful, especially using the heavier weights. For heads I try to stick to lighter and/or condensed.</p>
