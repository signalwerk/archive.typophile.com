      <p>While Comic Sans is not the world's prettiest or most perfect font, it has its uses but it should be limited to those. In a perfect world, we would have laws mandating its permitted use with enormous financial penalties for inappropriate use or perhaps even prison time. </p>
      <p>There are certainly fonts that are far uglier which have also been used inappropriately, but that's just my opinion. There are also fonts that are technically well made and otherwise inoffensive that others consider ugly. Beauty is in the eye of the beholder.</p>
