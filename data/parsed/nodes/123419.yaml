      <p><cite>“it’s the most neutral typeface that doesn’t interfere with the conveyance of content”</cite></p>
      <p>Depends on the content. I agree that this is "nonsense" in one way: Helvetica isn't even a particularly good text typeface. Univers is much better for that purpose if one must use a sans-serif.</p>
      <p>However, Helvetica Medium does get overused for signage for a reason. In that sphere, it is what people are used to, what they don't notice, what is invisible as a typeface. That, though, is clearly culturally based - a consequence of exposure to current fashions in typefaces.</p>
      <p>The biggest problem with such comments is that they're dated. Extravagant praise of Helvetica was warranted when it first came out, as it gave the typographer something that just wasn't provided by previous sans-serif typefaces, whether of American or European origin. Today, though, its lessons have been fully assimilated by designers of sans-serif faces, and so many alternatives exist.</p>
