      <p>“Helvetica is neutral” is a myth, to be sure.</p>
      <p>Some people doubtless think it the most beautiful. I don’t share that view, and I think those who do are a minority among typographers and even among designers in general, but beauty is in the eye of the beholder. Still, Helvetica’s biggest fans should be aware that plenty of other typefaces are at least as likely to win a beauty competition.</p>
