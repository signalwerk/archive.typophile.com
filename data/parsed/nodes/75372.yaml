      <p>For a digital version, I was going to recommend DIN 16 italic, but I couldn't find it anywhere. I was asking about DIN 16 on this site several years ago, and it's even more scarce now. I was able to find DIN 16, but not the italic:<br>
      <a href="http://www.fontmarketplace.com/font/din16.aspx" title="http://www.fontmarketplace.com/font/din16.aspx">http://www.fontmarketplace.com/font/din16.aspx</a></p>
      <p>The faux italic of DIN 16 would work, as much as that irks me to say.</p>
