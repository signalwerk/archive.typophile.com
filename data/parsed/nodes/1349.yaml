    html: "<p>Dawn, it appears that you are as safe purchasing at that site <br>as you are purchasing from fonts.com. <br> <br>Fonts.com has set up dozens and dozens (hundreds?) of sites -- <br>i'm going to call them <i>Joker Sites</i> -- that appear to <br>be operated by third-parties, but are really set up and maintained <br>by fonts.com, which is <i>powered by AGFA Monotype.</i> <br> <br>Anybody googling a typeface has tripped over these annoying sites,  <br>which inevitably lead to fonts.com. <br> <br>The site you refer to**, with it's \"volume discounts\" (lol), looks <br>like a Joker Site -- still, it'd be reasonable to assume that <br>it's e-safe and the fonts are legit. <br> <br>This appears to be just another boardroom idea*** to move type;  <br>the joker sites build traffic and google status. <br> <br> <br> <br> <br>bj <br> <br>* an example of a Joker Site is <br><a href=\"http://www.fonts-free.com/\" target=\"_blank\">http://www.fonts-free.com/</a> <br> <br>** Ironwood is No. 1 on the best seller list. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>*** Apparently designers are suckers for <br>Market Price: <strike>$20.00</strike> <br>Our Price: $15.00 <br></p>"
