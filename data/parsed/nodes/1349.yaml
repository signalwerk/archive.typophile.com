    html: |-
      <p>sorry to waste more time and pixels on this.... <br> <br>this is as-is from the terms and conditions posted on the professionalfonts.com site. <br> <br> <br><br>
      </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>IMPORTANT NOTICE  <br> <br>Each font downloaded from Professional Fonts is encoded <br>with a unique transaction identifier. This makes it possible <br>for us to track illegally distributed fonts back to the original <br>purchaser. This anti-piracy feature does not violate your <br>privacy in any way, only our database can relate the <br>embedded code to a specific purchase. Do not redistribute <br>the fonts you purchase from Professional Fonts, we will <br>pursue copyright violaors.<!---/quote-!--></p><hr size="0"></blockquote>
       <br> <br>and this is from the About Us... <br> <br><br>
      <blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>About Professional Fonts <br> <br>How can we bring you quality fonts at such low prices? <br>The answer lies in our three operating principals. <br> <br>Volume <br>We negotiate with the owners of existing font libraries for <br>the rights to distribute their fonts. These 'block sales' mean <br> large chunks of money for the library owners up front, in <br>exchange for us being able to bring the individual fonts to <br>market at whatever price we choose. If you are the owner <br>of a font library (at least 100 fonts please) and would like <br>to receive a signifigant one time payment for the rights to <br>distribute, contact Alicia in our acquisitions department. <br><a href="mailto:Acquisitions@ProfessionalFonts.com">Acquisitions@ProfessionalFonts.com</a>.  <br> <br>Simplicity <br>To keep our costs low, we cannot offer technical support on <br>the fonts you purchase from us. If you need high quality <br>technical support, may we suggest purchasing your models <br>from Fonts.com. You'll pay a lot more, but you'll also <br>receive great tech support. Also, we only distribute the <br>most popular fonts, and only for the PC platform. <br> <br>Automation <br>Our system of font packaging and distribution is totally <br>automated. This allows us to bring you fonts quickly and <br>efficently, without raising our prices.<!---/quote-!--></p><hr size="0"></blockquote>
       <br> <br> <br>this site is embarassing on so many levels... <br>I'll refrain from commenting further, but yes <br>I did notice the misuse/misspelling on two <br>key words, "principle" and "violators"... <br> <br>hmmm. apropos. <br> <br>bj<p></p>
