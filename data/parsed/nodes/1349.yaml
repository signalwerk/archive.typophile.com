    html: "<p>It's very scary what you can find on the net after a few simple searches and viewing source code. I found out that this site is registered on Tucows and Tucows listed an address and a phone under their domain listing. The address is for a Mailboxes N More in Everett, WA and the phone # is not a valid phone # (several reverse searches on the big guys revealed no such number). The Sec of State in WA website did not list this company so I emailed them and they said no such company existed in the state of WA nor was there any pending paper work. Oh, well, such much for the bargain of the week. I'm off to Phils!</p>"
