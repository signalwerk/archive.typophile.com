    html: <p>Hi Daniel, <br> <br>&gt; How's the OpenType library coming? <br> <br>Well, we finished converting our existing type library early in the year (we were almost done last year, except for a handful of stragglers). There are about 35 fonts we can't ship in OpenType format because our licensing doesn't allow for it, but the other 2250 or so are all out there. <br> <br>I'll have a presentation at ATypI this weekend that's a "technology preview" of Unicode and OpenType functionality in a future version of Adobe Illustrator. <br> <br>Cheers, <br> <br>T</p>
