      <p>I jump to the defense of Lucas! (Belatedly!!) I think Thesis is an amazing, and well thought out, family. I've never had trouble using it, in either display or text settings. It's easy to work with, which is to say it's character spacing and it's kerning tables are good and do not require further fine-tuning. It's a very well designed face. (family of faces??)</p>
      <p>Though quirky, I love the Q. Especially in text. In English, the Q occurs infrequently enough to give bodycopy (set in TheSans) more personality than, say, Frutiger. Without overdoing it.</p>
      <p>However, now that one of my fave faces has properly been defended from you scurvy lot, I wholeheartedly agree with Michael's observation that an alternate Q would be a good thing.</p>
      <p>(Can't comment on Freight Sans. I've never used it.)</p>
