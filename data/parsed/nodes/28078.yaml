      <p>I think Dan's right about this (and it crossed my mind to mention this at the initial rag on the Thesis Q). If it was such a problem one might have come up with a custom Q (either drawn or set as a compound character) and done a search and replace within the text to get rid of the (one or two?) dodgy Thesis Qs actually in the text.</p>
      <p>The only time an idiosyncratic Q caused me a problem was at the beginning of my career. The job was done in Queensland, Australia so I should have thought about the incidences of Qs in the text <strong>beforehand,</strong> but in my naïvety I went ahead and set the whole thing in Bookman. Now there's an ugly Q...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Queensland_3457.jpg"></div><p></p>
      <p>But it turns out I was the only person who had a problem with it at the time. It still makes me shudder to see it.</p>
