      <p>Designers sometimes (alright, all to often!) try to make them different and quirky for the sake of doing so. It's better to make something good than to make something original. Just browse around Dutch Type Library's and Enschedé's offerings. It's occurred to me more than once that DTL Documenta and Documenta Sans is the only font family I'll ever need. A bit daft, I know, but no one ever got fired for using Documenta.</p>
      <p>Take Dederon Serif. It's *actually* advertised as a Book font. Are they serious?</p>
      <p>Ludwig Übele's Mokka is another example. Lately it's become fashionable for some reason to shape the top-most serif of the letter "a" into a sharp, downward-pointing beak. The reasons for this escape me, although it seems like an artful attempt at style. It doesn't aid reading, nor does it make text look good. Skolar seems to suffer from the same non-psittacine beak disease. Another example of what appears to be artfulness for its own sake is the bowl of the letter "a" in Mokka.</p>
