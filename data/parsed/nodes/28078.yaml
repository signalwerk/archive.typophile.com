      <p>My primary recollection of what I've said previously on the "some-stencil" issue is that I prefer the bowl to be closed when I make a P. I love a good Baskerville as much as the next good shepherd and no blanket should be laid over the issue of topology until one is dead, I think. </p>
      <p>Little white spaces in metal type "scaled" exactly the way the type designer wanted them too, (at a different rate than big white spaces), and thus are resolved for the user. Little white spaces in digital type (for most users), scale out of the type designer's control, making some-stencil a non-trivial issue to resolve. If a type is only for display, it matters less, stencil away, drive a Ford over it, use XP. </p>
      <p>But I don't think some-stencil g's are rare because they're harder to make, so much as they are harder to use well. That little inlet at the bottom should NOT sparkle. Stencils broaden at small sizes to appear as a white counterpoint to, e.g. a serif... narrow as the size increases to remain well integrated to the eye. </p>
      <p>The harder that is made by technology, the fewer of these, Didots, grass scripts and other extremely humanistic typographic elements we'll see in a culture going fast forward, I think. But rejoice, we have a full alternate explanation of the g-ness of the species coming soon.</p>
