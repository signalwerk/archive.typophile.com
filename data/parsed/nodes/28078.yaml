      <p><cite>I wanted it to work “right out of the box.”<cite></cite></cite></p>
      <p>Since we are living in the world of scaleable type, one could argue that there is only one instance where a font will work "right out of the box". All other instances will require some user modifications, to word space, letterspace, kerning etc. It seems that your "out of the box instance" and Freight's "out of the box instance" are two different things. I guess that is going to leave you with an awful lot of pet peeves.</p>
      <p>Who has the time?</p>
      <p>James</p>
