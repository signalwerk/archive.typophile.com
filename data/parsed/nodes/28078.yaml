      <p>"Often Emigre doesn't style link … I think that's crap, especially for mere mortals who use word processing programs."</p>
      <p>But they do have a point. What’s good for some is not good for all. Style-linking isn't great for Adobe CS users, or those who use a Regular, a Medium, and a Bold for instance. The solution —&nbsp;inelegant as it may be — is to offer separate versions to please both camps. This is FSI’s goal with <a href="http://www.fontshop.com/fontlist/n/fontfonts_in_office_format/" rel="nofollow">Office FontFonts</a>.</p>
