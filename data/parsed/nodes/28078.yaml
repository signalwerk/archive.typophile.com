      <p>"I think that Trebuchet umlaut is awful - dots should be closer together."</p>
      <p>This may be a screenfont issue.  Screenfonts have to find a happy place where a 2-pixel wide and a 1-pixel wide stroke work well.  This means  small shifts are not possible as they are in fonts made for print. This is a similar problem to small type designed for use in phone books being enlarged for use as display type.  Sometimes the specific intent of the font precludes its use outside of that arena.<br>
      I would be curious to see if the German speakers here on Typophile can point to some examples of very good and bad umlautes in fonts and tell us why this is so. The same is true for any diacritic glyph.  I was quite happy to see Oscar Bjarna, an Icelandic speaker, comment on glyphs peculiar to his language in a previous thread.</p>
      <p>ChrisL</p>
    html_clean: |-
