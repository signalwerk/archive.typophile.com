      <p>Michael, your pet peeve is a daily aggravation for me. I do a lot of intensive math and engineering typesetting, and we're forced to pull characters from about a dozen different fonts to set everything we need. Rarely do any of the special characters mix well with the text fonts (in terms of style, size, or spacing), which have almost none of the math characters we regularly use.</p>
      <p>Technical stuff presents specific problems that have caused us to switch typefaces over exactly the kind of details everyone is talking about here, since characters so often appear in formulas or by themselves, rather than within normal words. If the lowercase l looks too much like the uppercase I or the numeral 1, a typeface will never work for most of what we publish. Or if the lowercase x looks too much like the times sign, etc.</p>
      <p>So many headaches...</p>
