    html: |-
      <p><cite>@-signs that sit too high.</cite></p>
      <p>To me, not just the @ sign, but the copyright symbol ©, parentheses (), brackets [], and braces {}, as well as the slash / and mathematical operators, sit too high in most fonts—especially when used with old-style numerals. (In Adobe Caslon, even the hyphen, the en dash, and the em dash look too high to me.)</p>
      <p>Parentheses, brackets, and braces also tend to have too little space “inside” them. Actually, I find even periods and commas too tightly spaced in many fonts—for example, the ubiquitous Adobe Garamond Pro (the same goes for many of the kerning pairs, e.g. Ta To Te Tu).</p>
      <p>These are part of the reason why I would want to be allowed (by the EULA) to modify the fonts I use.</p>
      <p>In ITC Mendoza, I didn’t like the old-style numerals 1 and 3, so I made my own versions (thought 3 didn't turn out that well), along with “correcting” many of the things that I mentioned above.</p>
      <p>EDIT: I do understand that those of you who design type from scratch might not be too happy about the thought of someone modifying the actual outlines of glyphs (esp. when that someone is a beginner like me). But fonts aren't really works of art, are they?</p>
      <p>But to go back to the start of this thread, I think the <em>character</em> spacing is too tight in most sans fonts—especially the lighter ones. For example, Frutiger Light is much less readable than the normal weight (Roman). Sans fonts, of course, have the problem that when there are no serifs to tie the characters together, spacing that is loose enough for readability tends to look too loose esthetically (so I don't like to use them for extended texts). Just my two cents' worth.</p>
      <p>Olli</p>
