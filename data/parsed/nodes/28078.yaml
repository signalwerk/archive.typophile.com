      <p>Great thread Michael. I agree with what you say about Syntax and Joanna (although the Perpetua italic is pretty darn narrow too – it was just the Gill style).</p>
      <p>The weight progressions in Gill Sans <strong>are</strong> ludicrous, and in a (yet unpublished) piece called 'Eric Gill got it wrong' I've written a critique of how self-contradictory Gill was in the context of the sans' weights and the 'Essay on Typography'. </p>
      <p>To respond to your initial point, I can still remember being hauled out during a class critique many, many years ago, for using overgenerous word spacing; therefore I completely support the word spacing arrangement in Freight Sans and see no problem with it. I also sympathise with some of what is said in the chapter called "The school of close spacing" in <a href="http://www.amazon.com/exec/obidos/tg/detail/-/0712306935?v=glance" rel="nofollow">Ari Rafaeli's 'Book Typography'.</a></p>
      <p>Other pet peeves? Most of them have already been listed, like the wonky italics in Caslon, but most of all, my peeve would be about the complete lack of balance or grace in the lowercase of <a href="http://www.spiekermann.com/iblog/C1109747452/E1829097339/index.html" rel="nofollow">Rotis.</a> It makes no difference if one is talking about the sans or the serif or the semi of either – the fault is in the construction. The 'e' and 'c' look like they are falling over backwards.</p>
      <p>At the Spiekerblog they are talking about it looking OK as signage – but here in Auckland it is the corporate face of the town council and used for a lot of the municipal signage. It looks plain awful in every application.</p>
