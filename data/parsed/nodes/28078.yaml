      <p>It looks odd within the context of the typeface, not the language.<br>
      The Souvenir "g", for instance, is odd, but not in an English-usability manner, because of glyphs like "y" which are similarly strange.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/souv_6032.png"></div><p></p>
      <p>So in the case of Dolly, it is not a German-usability issue, other than the problem character only appearing in German text, because the glyph is clearly recognizable as eszett (unlike the Freight glyph mentioned earlier).<br>
