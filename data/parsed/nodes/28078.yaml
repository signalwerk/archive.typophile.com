      <p>My native Finnish, too, has ä and ö in its orthography. I can't name any fonts offhand, but for one thing, I remember seeing umlauts that are too small (and perhaps sit too low), thus looking like insignificant flyspecks. The umlauted version represent different phonemes than a and o, so the umlauts are important.</p>
      <p>Also, Tä and Tö kerning pairs are often too tight.</p>
      <p>Olli</p>
