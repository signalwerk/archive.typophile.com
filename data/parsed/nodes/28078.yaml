      <p>Nice thread idea, Michael. The Thesis Q is something we hear about at FontShop at least once a month. I know more than one company that has created and licensed their own version of the font with a more reasonable tail.</p>
      <p>Adding to the pet peeve pile: @-signs that sit too high. It's amazing how many type designers are still plopping the @ circle on the baseline. I assume they haven't broken free of the pre-digital era when the symbol was aligned with lining numerals instead of lowercase. The more thoughtful type users will see this and baseline shift, but it's often overlooked.<br>
