      <p>That kind of "Å" is perfectly all right for logos and stuff. (I too like the Åhléns logo). But for text use, I'd say it's no good. I asked several people at work today (two journalists, three editors and one typographer). Five of them thought the merged versions looked odd or ugly (I showed them Benton Sans and Nobel), while one of the editors thought the Nobel "Å" looked cool, but the Benton one looked weird. Neither of them had thought about this before. </p>
      <p>Perhaps the Danes are more open to weird "Å"s because they started using it much later than we did (1948 vs. 1917, but some Norwegian writers, among them Henrik Ibsen, used it from the 1890s on).</p>
