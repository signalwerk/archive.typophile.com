      <p>Michael:<br>
      You asked: `... really any good solution for typesetting mathematics with a sans.'</p>
      <p>Math typesetting with a sans is quite unusual (at least in print --- about the only time I see it is in slide presentations). Some reasons for this were discussed in Johannes Küster's  presentation on `Fonts for Mathematics' at ATypI 2004. A pdf of that (excellent) presentation is available at:</p>
      <p> <a href="http://www.typoma.com/publ/20041002-atypi.pdf" title="http://www.typoma.com/publ/20041002-atypi.pdf">http://www.typoma.com/publ/20041002-atypi.pdf</a> </p>
      <p>The only two (complete) math sans fonts that I know of are<br>
      * HV math (a sans `inspired by Helvetica'), and<br>
      * Computer Modern Bright (designed by Walter Schmidt),<br>
      both marketed by MicroPress: </p>
      <p><a href="http://www.micropress-inc.com/fonts.htm" title="http://www.micropress-inc.com/fonts.htm">http://www.micropress-inc.com/fonts.htm</a></p>
      <p>Both of these come with LaTeX support; I have no idea how difficult it would be for you to use them in MathType (but at least they have a complete AMS symbol set, which should be adequate for almost all math typesetting).</p>
      <p>Grant</p>
