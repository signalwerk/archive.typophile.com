      <p>Regarding Freight in it's Sans and Text variants: I, inter alios, have to say that they're pretty much unusable for German. The esteemed Mr. Darden decided to not design an ß for them, but to prove instead that he knows about its ancestry, the Antiqua's ſs ligature (an assumedly younger, but still century-old variant of the Textura's and the Fraktur's ſʒ ligature which gave the ß one of its names, the Eszett). No modern ß is provided as an alternate glyph.</p>
      <p>The other Freight family members (Big, Display, Micro) do have an ß, but for some curious reason, Micro's ß changes into ſs in its italic, so Micro falls into the unusable-for-German-unless-you-don't-plan-on-using-the-italic category.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/eszett_4601.jpg"></div><br>
      <em>Freight has been a little overfreighted with<br>
      well-meant typographical fanciness</em><p></p>
      <p>This inconsistency alone would make the Freight family an iffy choice for German, even if the ſs ligature wasn't completely out of use. While the elderly or typographically educated may recognize the ſs as ß (and yet trip over each instance), the rest will just wonder Whatthefont this is (and/or read it as fs).</p>
      <p>I've heard the ß being referred to as an ſs ligature, but it's more precisely a single letter that evolved from the ſs ligature. Freight illustrates the point.</p>
