      <p>Thanks, all, for posting images of diereses and i's together and discussing them. This is useful information for a type designer, book designer or graphic designer, since we all are likely to deal with multilingual texts going into the future. Does anyone have comments about the height of accents over capitals? </p>
      <p>It's little things such as have been mentioned here, which are deal-breakers for me in purchasing a type family for general use; if I spend a few hundred dollars for a tool, I want it to work all the time, as well as it can. As James points out, no type works perfectly in every setting, at every size, without some modifications. But individual letters shouldn't bother the user. </p>
      <p>There were problems with every humanist sans I knew about, when I started drawing Mundo Sans; the obliques in so many (Syntax), irritating spurs and curved terminals (Today, Gill Sans), and other things like the narrow oldstyle 5 and unjoined Q in Thesis. Some were spaced obviously for display, some had proportions that wouldn't work below 24 point. I wanted a family that could work at a lot of sizes; Syntax starts to look weird at display sizes, as does Gill, and others like Formata look regimented and square in text sizes. Gill's weight progression is bizarre; the mismatch of weight and contrast between the caps and lowercase always bothers me, as do some of the wide caps. Mundo is meant to have a wider range of sizes it performs at, without any distracting bits. Unfortunately you can't space a typeface to look good at every size; the only typeface I think does this well is Frutiger, and some weights are spaced tighter than others. </p>
      <p>Yes, I'm very very picky. If I hadn't drawn Mundo, I'd probably be using Kievit.</p>
