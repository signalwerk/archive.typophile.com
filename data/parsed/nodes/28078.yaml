      <p>Well, I have a handful of pet peeves:</p>
      <p><strong>01</strong>. Kerning too loose for digit 1 in Minion.<br>
      <strong>02</strong>. Oldstyle 0 is almost a circle in many Galarde and Venetian typefaces.<br>
      <strong>03</strong>. Oldstyle numbers too much out of x-height in some serif fonts.<br>
      <strong>04</strong>. Small caps with the same height than lowercases in many serif fonts.<br>
      <strong>05</strong>. Absence of small caps in Utopia italic and Cartier Book italic.<br>
      <strong>06</strong>. Absence of small caps in the whole Myriad family.<br>
      <strong>07</strong>. Absence of small caps and alternate numbers in Iowan OldStyle.<br>
      <strong>08</strong>. Position and size of acute and grave accents over lc in Meta Serif.<br>
      <strong>09</strong>. Lowercase m is much condensed in Meta Serif.<br>
      <strong>10</strong>. Lack of a light style for Tisa.<br>
      <strong>11</strong>. Terminals very big in a, 2 and 3 in Greta Serif.<br>
      <strong>12</strong>. Lining 5 in Arno and Sabon.<br>
      <strong>13</strong>. Uppercase U in Bembo.<br>
      <strong>14</strong>. Dollar in ITC Caslon.<br>
      <strong>15</strong>. Question mark in Futura.</p>
