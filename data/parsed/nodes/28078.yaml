      <p>William Berson: </p>
      <p>My main gripes are the following. I prefer umlauts that harmonize with the dot above the "i", they may be a bit smaller but not tiny. Others may think differently.</p>
      <p>I dislike:<br>
      * fonts where the umlauts don't have the same basic shape the dots over the "i". For instance, in ITC Frankling, with round umlauts and a square "i" dot.<br>
      * also fonts where the umlaut dots/squares are tiny and not of the same proportion as the "i" dot. Example: Bitstream Franklin.<br>
      * fonts where the umlaut dots are placed too close together. Like Bitstream Franklin, again.<br>
      * Typefaces where the umlauts on the capital O sit like little ears almost on the sides. Like Typeshop Franklin (simply impossible to use).<br>
      * as an example of great umlauts in a Franklin, check out the Eisner+Flake cut. Now that's good umlauts and my favorite Franklin. </p>
      <p>That's just off the top of my head. In fact many great cuts are ruined by poor umlauts.</p>
      <p>I think it's pretty obvious that Swiss or German designers (languages with umlauts) pay more attention to this whereas for instance English- or French-speakers often do not.</p>
