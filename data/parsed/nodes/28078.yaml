    <p>OK, yesterday I rejected Freight Sans for a project. It's simply beautiful, but I believe its narrow word spaces hinder legibility, especially in comparison with other humanist sans faces.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/freightsans_3885.gif"></div><p></p>
    <p>This morning I briefly considered using TheSans, until I got a look at that uppercase "Q" with its disconnected tilde for a tail. Please, Lucas! I absolutely love TheSans, but no alternate for that Q?!!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TheSans_6540.gif"></div><p></p>
    <p>So it got me thinking... What common typefaces are "spoiled" for you by their quirks? And what makes these features deal-breakers?</p>
    <p>Thanks in advance,<br>
    --Michael.</p>
  html_clean: |-
