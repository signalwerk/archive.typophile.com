      <blockquote><p>My pet peeve: the silly "I" in Bell Gothic. It's a serif "I" in an (otherwise great) sans serif typeface.</p></blockquote>
      <p>Keep in mind that Bell Gothic was originally designed for telephone directories. Also keep in mind the existence of CamelCase names. Once I came across the name "DiIorio": that's dee-eye-eye-oh-ar-eye-oh.</p>
      <p>Personally, I hate that "I" and "l" collide in too many sans-serif typefaces to list.</p>
      <p>As for confusing characters: I hate the "0" (zero) as it appears in the modern take on oldstyle figures. When I saw "1950s" (or something similar) in a book once, I parsed it as "195 os" before inferring the meaning from the context.</p>
      <p>Note to typographers: The outline for a proper oldstyle zero as used in old books is a perfect circle (<em>circle</em>, not oval or anything else) inside another perfect circle. That's it, that's all.</p>
    html_clean: |-
      <blockquote><p>My pet peeve: the silly "I" in Bell Gothic. It's a serif "I" in an (otherwise great) sans serif typeface.</p></blockquote>
      <p>Keep in mind that Bell Gothic was originally designed for telephone directories. Also keep in mind the existence of CamelCase names. Once I came across the name "DiIorio": that's dee-eye-eye-oh-ar-eye-oh.</p>
      <p>Personally, I hate that "I" and "l" collide in too many sans-serif typefaces to list.</p>
      <p>As for confusing characters: I hate the "0" (zero) as it appears in the modern take on oldstyle figures. When I saw "1950s" (or something similar) in a book once, I parsed it as "195 os" before inferring the meaning from the context.</p>
      <p>Note to typographers: The outline for a proper oldstyle zero as used in old books is a perfect circle (<em>circle</em>, not oval or anything else) inside another perfect circle. That's it, that's all.</p>
