      <p>Sorry to keep raggin' on the "Q" in Thesis, but I completely agree. There should be an alternate, I also am not a big fan of it. But, this leads me to my typeface pet peeves.</p>
      <p>1) Too few sans serif typefaces have "small caps." When setting copy or used to display many levels of information, this is a necessity for me. </p>
      <p>I use Thesis a lot of the time for this reason. Zwo and Meta are the only others with small caps I can think of off the top of my head.</p>
      <p>2) Too many sans serif typefaces don't have true italics. The sloped roman is simply not enough when setting a large amount of body copy.</p>
      <p>3) The number 7 in <a href="http://www.fontbureau.com/fonts/Meno/styles" rel="nofollow">Meno</a>, too weird, almost a deal breaker.</p>
      <p>4) I'd like to see more experimentation in the design of serif typefaces. While there are always exceptions, there doesn't seem to be enough experimentation in the design of these faces. Classics are beautiful, don't get me wrong...but I'd like to see some more modern approaches to serifs. Stormtype, Emigre and Font Font seem to be pushing the envelope to me along with a handful of smaller foundries.</p>
    html_clean: |-
