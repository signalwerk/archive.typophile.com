    html: <p>Medieval where? Assuming you mean Europe, there would still be several writing systems in use. I doubt there would be any Merovingian minuscule in use by the eleventh century, but the Visigothic script was still predominant in Christian Spain and the Beneventan script in Latin southern Italy. Plus, of course, Greek, Arabic, Cyrillic, Glagolitic, and Futhark.</p>
