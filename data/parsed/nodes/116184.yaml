      <p>The most widespread calligraphic standard around that time was the so called Carolingian minuscule. There are plenty of fonts to be found if you look for "carolingian". Please don't expect any upper case letters. It's a minuscule, right? The fusion of majuscule and minuscule into one script system was later on. And you might miss some other fancy letters like €®†¨Ω¨⁄øπå‚∂ƒ©ªº∆¥≈ç√∫~µ∞üöäß!"§$%/()= to name just a few.<br>
      <a href="https://en.wikipedia.org/wiki/Carolingian_minuscule" title="https://en.wikipedia.org/wiki/Carolingian_minuscule">https://en.wikipedia.org/wiki/Carolingian_minuscule</a> </p>
      <p>Although officially deprecated by Charlemagne the hard-to-read but easier to write script called Merovingian was still popular among scribes and chanceries, so that would be another candidate:<br>
      <a href="https://en.wikipedia.org/wiki/Merovingian_script" title="https://en.wikipedia.org/wiki/Merovingian_script">https://en.wikipedia.org/wiki/Merovingian_script</a></p>
