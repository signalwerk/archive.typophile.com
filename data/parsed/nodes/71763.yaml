      <p>Hi Sascha,</p>
      <p>French school books completely avoid this question: the alphabet showings never contain this glyph. As far as I know, it is just two capitals letters, very tightly spaced, sometimes even touching. Hence, something like your #4 for a cursive style, or #5 in a ‘blockier’ style.</p>
      <p>Florian</p>
