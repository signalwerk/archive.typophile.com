    <p>Hi everybody,</p>
    <p>I have a general designquestion that is more related to native french speakers and writers. I'm doing a small research on school scripts and i want to know what is the tought or prefered Version of the /OE, especially the uppercase version in french school. I made some combination which you can see in the picture, but i don't know which one is the right one.</p>
    <p>Thank You.</p><div class="imageWrap"><img src="http://typophile.com/files/OE_schoolscript_4878.jpg"></div><p></p>
