    <p>I am currently re-designing a homes, architecture and design magazine and i need to find two fonts (one serif, one sans) that go well together, are a bit edgy and will also not date within the next five years.<br>
    I would be most grateful if anyone could recommend anything that they think would work well.<br>
    The fonts also need to have a foundry so that my boss will think he’s getting his money’s worth!</p>
