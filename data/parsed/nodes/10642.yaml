    html: <p>The first question to ask yourself regarding the S is whether it will have a totally smooth curve in the middle or will incorporate a short straight segment in the middle. In either case, a good way to begin is without a straight segment. Put a node at the outside left edge and inside left edge, and at the inside right edge and outside right edge of the S-bend section. These should be extreme points, with a smooth fixed transition perfectly vertical. You can now play with the control handles between these points to define a nice curve. In FontLab, you can also grab the curve itself, at any point, and it shift up or down. Note that where you grab the curve will affect how the curve is modified by movement. I recommend playing around with this at some length, getting comfortable with how the curve responds to your touch before trying to achieve a specific result. <br> <br>Once you have pleasing curves definining your stem, you should either insert a short straight segment if you desire (generally I don't), or a transition single node at the flex point of the S-bend. The most reliable way to do this, in FontLab, is to use the knife tool and to drag a straight line between the off-curve control handles defining the curve and bisecting it. This will put a point in the optimum position. <br></p>
