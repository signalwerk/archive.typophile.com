    html: <p>Thank you very much for fast replies! <br> <br>I know the proper way to design a decent font is to draw it by hand, but I need to start somewhere and get to know Fontlab first. The link you gave me is a good starting point! Thank you<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">. <br> <br>Another thing, beeing a graphic designer myself with not much experience in designing typefaces, I see alot of designers on the net offering fonts <br>and getting alot of exposure in magazines etc. <br>Youworkforthem, Identikal etc. <br> <br>I have nothing against these people, but looking at their fonts, and comparing them to some of the stuff I have seen in this forum, there is an enormous gap in quality!? I mean, these guys sell their typefaces with a pretty heavy price tag, but they look *nothing* like some of the stuff I see here!  <br>Do you consider them as *real* typeface designers, or just graphic designers wanting to break into another field in graphic design? <br> <br>After reading alot of posts here, I would never consider selling my fonts, just because I see the amount of work you put into your typefaces! <br> <br>I hope someday my typefaces will be good enough, but for now I realize I am just learning!<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Tom I.</p>
