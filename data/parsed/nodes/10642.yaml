  html: <p>Ok, I'm quite a newbie when it comes to fontmaking, so I am almost embarrased to ask this. You guys are so good at this, but anyway... <br> <br>I make all my fonts in Illustrator, drawing curves, chopping circles etc. I'm pretty familiar with bezier curves, but there is one letter I just can't get right yet. The "S"!. I can build it with chopped circles and simple blocks, but to get my font a little more exciting(and atleast half-decent, not compared to any of you guys stuff though!), I want to make it with the bezier tool. But I can't get it right! Is there like a manual on how to make certain letters? I can't be the first person to struggle with this letter?<img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Tom I.</p>
