    html: "<p>I know of no definitive answer to how a given letter must be drawn. In my research, I've found diverse theories on letterform construction, and I'm preparing a piece right now for Typophile which compares and contrasts them. <br> <br>My only suggestion would be to try to hand draw your S rather than try to construct it from primitives. And read this thread: <a href=\"http://www.typophile.com/forums/messages/29/477.html\" target=\"_blank\">http://www.typophile.com/forums/messages/29/477.html</a></p>"
