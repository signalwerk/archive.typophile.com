    <p>Some questions for those who give critiques in that forum:</p>
    <p>What makes a font sample useful for evaluation?<br>
    What sizes, layouts, arrangements give you the information you need on which to make informed commentary?<br>
    What statements do you hope to read when designers submit their designs for critique?</p>
    <p>(Posted here since it's as close to a Forum Advice column as we have, though so far not very close at all.)</p>
