    html: '<p>Another variable you can test is the size of the small caps. You can adjust this:  <br> <br>"Choose Edit &gt; Preferences &gt; Text (Windows and Mac OS 9), or InDesign &gt; Preferences &gt; Text (Mac OS 10). <br>For Small Caps, type a percentage of the original font size for text to be formatted as small caps. (The default value is 70%.) Then click OK." <br></p>'
