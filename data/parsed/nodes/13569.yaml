      <p>Thanks. The powers-that-be (you know who you are) should put a link to the blogs in the navagation.</p>
      <p>OK, about the "access denied" thing, this is what I have figured out so far. It appears that the Wiki is making up incorrect addresses for some of the links, and the addresses are case sensitive. For example, when you click on the "Indicies" link, it uses this address - <a href="http://typophile.com/wiki/indices" title="http://typophile.com/wiki/indices">http://typophile.com/wiki/indices</a>. But it should be this - <a href="http://typophile.com/wiki/Indices" title="http://typophile.com/wiki/Indices">http://typophile.com/wiki/Indices</a>. The difference is the cap "I" on "Indices" in the address.</p>
      <p>Another example: This link to Blackletter - <a href="http://typophile.com/wiki/Blackletter" title="http://typophile.com/wiki/Blackletter">http://typophile.com/wiki/Blackletter</a>, should have a lower case "b". So there doesen't seem to be any rhyme or reason to the link names case.</p>
      <p>I have also found this kind of link - <a href="http://typophile.com/wiki/sans%20serif" title="http://typophile.com/wiki/sans%20serif">http://typophile.com/wiki/sans%20serif</a>, which dosen't work. the "%20" part of that address represents a "space", so that is OK. But if I change the first "s" to a "S" then it works. Hmmm.</p>
      <p>I have also found this oddity. In a Wiki link to a string like " Barnhart Brothers &amp; Spindler", it will truncate it to "Barnhart Brothers", ignoring everthing after the "&amp;"... sometimes... not all the time.</p>
      <p>I think I understand the -Title Link|Title Displayed- syntax, but I don't think everyone gets this. Not everyone is going to type -American Type Founders|ATM-. And since there is not a real search yet, it is sometimes hard to tell if a Wiki link does not have an entry or if it is not linking properlly to an existing entry. I guess we just have to police this as best we can to try to avoid multiple entrys.</p>
