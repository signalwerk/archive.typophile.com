      <p>(I will preface this by saying that I happily use digital type 95% of the time, and am not one to say that letterpress composition is <em>always</em> better . . . it depends so much on the nature of the individual job, the typeface chosen, and who the comp and printer are. That said, I do feel lucky that I get to use metal in some of my work.)</p>
      <p>I have a copy of Zapf’s <em>Manuale Typographicum</em> (the later, 1968 edition published with MIT Press) which is set in many dozens of different types. The Optima pages in this book have a kind of noble and magical radiance that I have never experienced in offset reproductions of the type, whether from VIP or 202 or later digital typesetting. Maybe the impression accentuates or highlights the subtle swellings of the strokes in some way. Whatever it is, the sure gives that type <em>presence</em>.</p>
      <p>Optima seems to garner more fierce pro and con statements than most designs. I can remember one of my favorite art directors in the 1980s talking about characteristics of the quintessential client from h*ll, and saying in tones of disgust: “Yeah, you know, the kind of person whose sister-in-law went to art school and she loves Optima!!”</p>
