    html: |-
      <p>I misspell my own name too :-)</p>
      <p>The difference is that I don’t like the Roman Palatino either and feel the sans does not look a bit like it—maybe that is why it looks better to me. With the sans, there was a commitment to making it work as a sans. Optima just doesn’t fall enough either way to work for me. Beorcana does a much better job of it. It is more gutsy than Optima and looks like it should hold up well under text use.</p>
      <p>I don’t blame Zapf as much for the problems with Optima as I do the technology change. As noted by Muzz, it can work when set well in hot metal. When first translated to phototype, they must have just used the drawings uncorrected for photo and offset. I am sure Herman(n) worked from hot metal proofs to finalize his drawings and figured in inkspread in his design. When you take phototype (moreso with dirty lenses) you weaken the marginalness of Optima to begin with. Then you put it in front of a Robertson to shoot film and it degrades more. Next step, platemaking where someone gets heavyhanded with the rouge—add light ink on an offset press and bingo, the poor thing is dead. Pressman were trying to hold it from plugging and yet keep the color even.  Ask an oldschool pressman running 6pt Optima on an old offset press how much fun it was (then ask him how printing a reverse was). Early digital type (and Optima was one of the first) didn’t remedy much if any. I am glad the Nova version has moved it towards the better.</p>
      <p>ChrisL</p>
      <p>PS: I don’t know why LinoType named the sans version Palatino at all unless they were looking at it purel;y as a marketing thing to cash in on the name recognition of the roman original. They should have just named it Zapf Sans or some such thing.</p>
