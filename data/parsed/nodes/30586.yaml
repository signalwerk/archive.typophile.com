      <p>I Do Not Like the Stress-ed Sans<br>
      (To the meter of “Green Eggs and Ham”)</p>
      <p>Oh would you, could you use Beorcana?</p>
      <p>Nuh-uh, I won’t! I just don’t wanna. </p>
      <p>But could you see it on a sign? </p>
      <p>It has no reason, and no rhyme.</p>
      <p>I do not like the stress-ed Sans,<br>
      I do not like it on tin cans,<br>
      I do not like its thicks and thins<br>
      I do not like its b’s and n’s.<br>
      I do not like it on a flier,<br>
      I do not like it selling tires.</p>
      <p>Would you have Tiepolo on a sheet?<br>
      Would you like Amira, looking sweet?<br>
      Would you have Rotis, on a package,<br>
      Would you use Amerigo, selling snackage?</p>
      <p>I do not like the serifless roman,<br>
      I do not like it nuh-uh, no, man.<br>
      I hate it on annual reports<br>
      I hate it advertising sports.<br>
      It will not crackle, in a book,<br>
      It slows me down, it strains to look.</p>
      <p>But what of Optima Display?<br>
      Would Albertus not somewhat sway?<br>
      Could Alinea work for telling news,<br>
      Or Lydian bring some zing to shoes? </p>
      <p>I do not like sans with contrast,<br>
      I do not think their charm can last.<br>
      I won’t read cookbooks set in these,<br>
      Or install them for any fees.<br>
      In hospitals they make me cringe,<br>
      Cosmetics packs give me a twinge.</p>
      <p>They are a blight on our fair land.<br>
      I do not like the stress-ed sans!</p>
