      <p>Well, I guess I don’t fit too well into this Optima love fest. I don’t like it even a little bit. It does look better set letterpress though, the inkspread helps it look less wimpy. The early digital version that came out in the 80s that Patty spoke of just looks flat out anemic to me. I just never understood the fasination nor the overuse of it. I used to call it spayed Roman. It always seemed to have the worst of both the sans and the serif faces instead of the opposite which was the intention. Sorry Herman, I just can’t see using that one.</p>
