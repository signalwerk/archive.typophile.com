    <p>Hi,</p>
    <p>I have tried to find Greek Bauhaus fonts but had no luck. I thought of designing such, starting from latin Bauhaus characters but the Corel (limited edition) program that I have did not help. Does anyone know where I could find the fonts I look for, or would it be practical (i.e. cost effective) to have this designed by a professional? Would anyone in this forum be inetrested? At what price? Thank you.</p>
