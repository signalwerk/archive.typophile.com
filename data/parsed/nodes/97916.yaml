      <blockquote><p>or would it be practical (i.e. cost effective) to have this designed by a professional?</p></blockquote>
      <p>That would be the best option but getting this done professionally is likely to cost several thousand pounds per weight/style. The difference between something barely workable and a professionally finished font is worth every penny though!</p>
