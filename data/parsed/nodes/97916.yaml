    html: "<p>Well, such prices are far beyond the available budget. It seems to me that designing Bauhaus Greek for commercializing the font family will be well worth it, since the latin family is quite popular already. It looks like I will have to change plans about the font family to use! Just an extra note: About 22 years ago a graphics designer professional had designed a logo using Bauhaus Greek from the Letraset families. Unfortunately Letraset is no longer available!</p>"
