    <p>Hi,</p>
    <p>I’m looking for the name of the fat Bodoni used for the text “SPRING, SUMMER &amp;.-10. AUGUST...”</p>
    <p>It’s not Carter’s Elephant/Big Figgins or Sahara Bodoni but it’s something along that line. Any ideas?</p>
    <p>(The “COPENHAGEN FASHION WEEK” looks like Didot)</p>
    <p>Peter</p>
