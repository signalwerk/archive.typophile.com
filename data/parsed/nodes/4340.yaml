    html: "<p>&gt;I don't think that random glyphs are an important step in the development of typography <br> <br>Oh no, randomness offers amazing opportunities! <br>I can think of two avenues worth exploring: <br> <br>Firstly, it is necessary to introduce an element of randomness into a font that truly emulates handwriting -- not contolled, professional script, but real writing which has the rough creative imperfection of humanity, where whole-word \"ligatures\" are created on the fly. Moving beyond, this process, once formalized, could be used to design fonts which are not mimics of handwriting, but something else again. <br> <br>And secondly: If one wanted to mimic the inconsistent quality of letterpress type, which is admirable when subtle, giving it life, rather than the dull predictability of high-res digital type, then one could arrange a \"type tray\" of glyphs, where each character has variants that are \"worn\" differently, or \"print\" differently (simulating arterfacts in paper or printing), and selected at random. <br> <br>And is there not an element of randomness (effected by a lack of total control) in the design variants that occur between different type sizes in foundry type? </p>"
