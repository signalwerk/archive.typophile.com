    html: <p>One point of concern I'd have is that should you design something with a random font and save it our output at a service bureau, they may open up a different setting of the font and the really nice random combination you saw on your computer will look totally different when you send it to press assuming you don't convert the text to outlines first. <br> <br>Beyond that, making an intelligent OT version of the font will preserve the text setting you intended to reproduce. <br> <br>Stuart :D</p>
