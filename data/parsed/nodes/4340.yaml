    html: <p>The only folks I know who have done work with truly randomizing glyph selection are LettError, with FF Kozmik. <a href="https://web.archive.org/web/20150123232942/http://www.letterror.com/foundry/kosmik/index.html" target="_blank">http://www.letterror.com/foundry/kosmik/index.html</a> <br> <br>However, FF Kozmik is not a handwriting font, but hand-printing. <br> <br>Several handwriting fonts have been developed that use elaborate contextual rules which produce a variable effect similar to randomness, though in fact it is deterministic. One is Linotype's Zapfino, in the AAT TrueType version of the font that ships with Mac OS X. I am having difficulty finding a good link to something that explains its contextual goodies, however. <br> <br>Two other contextual-letterform type families are Caflisch Script Pro (Robert Slimbach after Max Caflisch) and Bickham Script (Richard Lipton after George bickham). These two are in OpenType format, and can display their functionality in applications such as Illustrator CS and InDesign. By way of example, Caflisch Script Pro has 12 different forms for the lowercase "p," and picks one depending on the context. <br> <br>For more information on OpenType, see <a href="https://web.archive.org/web/20150123232942/http://www.adobe.com/type/opentype" target="_blank">http://www.adobe.com/type/opentype</a>. See particularly the OpenType User Guide PDF (linked on right).</p>
    html_clean: <p>The only folks I know who have done work with truly randomizing glyph selection are LettError, with FF Kozmik. <a href="https://web.archive.org/web/20150123232942/http://www.letterror.com/foundry/kosmik/index.html" target="_blank" class="link-external">http://www.letterror.com/foundry/kosmik/index.html</a> <br> <br>However, FF Kozmik is not a handwriting font, but hand-printing. <br> <br>Several handwriting fonts have been developed that use elaborate contextual rules which produce a variable effect similar to randomness, though in fact it is deterministic. One is Linotype's Zapfino, in the AAT TrueType version of the font that ships with Mac OS X. I am having difficulty finding a good link to something that explains its contextual goodies, however. <br> <br>Two other contextual-letterform type families are Caflisch Script Pro (Robert Slimbach after Max Caflisch) and Bickham Script (Richard Lipton after George bickham). These two are in OpenType format, and can display their functionality in applications such as Illustrator CS and InDesign. By way of example, Caflisch Script Pro has 12 different forms for the lowercase "p," and picks one depending on the context. <br> <br>For more information on OpenType, see <a href="https://web.archive.org/web/20150123232942/http://www.adobe.com/type/opentype" target="_blank" class="link-external">http://www.adobe.com/type/opentype</a>. See particularly the OpenType User Guide PDF (linked on right).</p>
