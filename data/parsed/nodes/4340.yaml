    html: <p>Constantin, I would explore randomness if the tools I use made it possible, or if I was a programmer. But like most type designers, that's not the case. <br> <br>The OpenType format, with its ability to contain mutliple glyphs for a single character, can be used to give the appearance of the randomness you seek, by assigning different glyph variants of the same character according to the adjacent character (i.e. with "invisible ligatures"). However, it is only since last year that the Mac version of Fontlab that does OpenType has been introduced, so give it a little more time.</p>
