    html: "<p>Sure. Assuming you want it to work in some existing applications, you have an unexciting choice insofar as each approach is very limited in how/where it works: <br> <br>- OpenType (contextual, WYSIWYG, currently only supported by Adobe's apps, any output device, easiest to code but that's not saying a lot, use FontLab or maybe DTL FontMaster to make it) <br> <br>- AAT (contextual, WYSIWYG, Mac only, currently only supported by a handful of apps, any output device, hard to code contextual stuff, use Apple's command-line tools to compile the features into a pre-existing font) <br> <br>- Type 1 (true random, non-WYSIWYG, will work in many apps but not most recent Adobe apps, will only work with PostScript output devices, you'd probably have to be a programmer to code it) <br> <br>I hope that helps clarify your choices, <br> <br>T</p>"
    html_clean: "<p>Sure. Assuming you want it to work in some existing applications, you have an unexciting choice insofar as each approach is very limited in how/where it works: <br> <br>- OpenType (contextual, WYSIWYG, currently only supported by Adobe's apps, any output device, easiest to code but that's not saying a lot, use FontLab or maybe DTL FontMaster to make it) <br> <br>- AAT (contextual, WYSIWYG, Mac only, currently only supported by a handful of apps, any output device, hard to code contextual stuff, use Apple's command-line tools to compile the features into a pre-existing font) <br> <br>- Type 1 (true random, non-WYSIWYG, will work in many apps but not most recent Adobe apps, will only work with PostScript output devices, you'd probably have to be a programmer to code it) <br> <br>I hope that helps clarify your choices, <br> <br>T</p>"
