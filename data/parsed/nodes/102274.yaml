  html: |-
    <p>I’m so leaned, my verses in italic<br>
    I always come hard, my flow be phallic<br>
    Rhymes so clever, yeah I’m a smart aleck<br>
    My gat like movable type, hella metallic<br>
    I don’t beat around the bush<br>
    I don’t speak oblique<br>
    Your future looking bleak<br>
    I know your girl a freak<br>
    We doing positions like a ligature<br>
    Kama Sutra, she read that literature<br>
    This song ain’t over, this just the overture</p>
    <p>Hop up in the Cadillac, I’m riding slab serif<br>
    I run this town, everybody call me the sheriff<br>
    A nick gets sold in the park, I gets paid a tariff<br>
    My flow got the manual kerning<br>
    Son, you best get to learning<br>
    If you yearning for what I’m earning<br>
    My enemies, I leave ‘em burning<br>
    With jealousy. F*ck with me<br>
    I put bullet holes in your organs<br>
    Leave your wife a widow and your kid an orphan<br>
    Wack emcees, I don’t listen to y’all raps<br>
    Come at me with your crew, I’m peeling all caps<br>
    At every concert I get mobbed by fans<br>
    I’m Times New Roman, you Comic Sans</p>
