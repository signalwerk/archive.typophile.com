    <p>Hi all. This one is killing me. A friend asked me to reproduce his band logo. I am so sure this is Clarendon but I cannot find a variant with the same lowercase 'g'. I've looked at too many g's now and I'm losing it. I even thought it was a Bookman Demi for a minute (can't be, the uppercase 'T').</p>
    <p>Thanks in advance.</p>
