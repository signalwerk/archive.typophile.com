      <p>This is one of the few font packages (if you call 2 fonts a package) from H&amp;FJ that sells for less than three figures. And if you only want only one font from H&amp;FJ, you usually have to buy a mega-package.</p>
      <p>If H&amp;FJ want's to keep their fonts for the well heeled, so be it. Just on GP, I'd get Chuck.</p>
