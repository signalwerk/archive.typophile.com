    html: "<p>First of all thank you all for your sympathy and kindness. You are helping me a lot, since I'm doing this research by chance, in spare time. <br> <br>Nathan: the dinosaur book is fantastic! Maybe Filosofia is not so conceptual (not in the way I meant) but this use is so unexpected I just love it! the two images you've scanned are *great* could you send me the same two in hi-res at <a href=\"mailto:claudioNOCRAP@docdesign.it\">claudioNOCRAP@docdesign.it</a> <br>That's my work e-mail and I have DSL. Drop the NOCRAP line, Ive put it to avoid spam. <br> <br>Dave: Your post made me genuinely laugh. It's great how, when we refer to colleagues or occasional type friends to our close ones, assuming they are familiar with them. My mother has yet to figure out quite well who's Jonathan, who's Oded, who's Alan. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br>The Aztec use is really interesting. <br> <br>Isaac: thank you so much for the card with Template Gothic. I think this is more an occasional use of the face, given is wide diffusion, than a conscious choice. Anyway I've downloaded the lowres. <br> <br>I keep using the stupid \"star-rate\" system to let you focus best on what I seek. <br> <br>thank you! thank you! thank you! <br></p>"
