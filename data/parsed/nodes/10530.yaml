    html: "<p>John: your spotting seems intriguing. <br>Can you send me a low-res scan of an example? <br> <br>Karen: what is exactly a \"spa\"? The use might be curious but the design is sloppy. I'm trying to find examples both significant and well designed. <br> <br>My last picks: a big thank you to Simon Schmidt (Closefonts, Fountain) for a job he used Manson Sans in. And another big thank you to Isaac for sending me hi-res scans of the christmas book. <br> <br>This afternoon I've found with an incredible luck the poster for a \"Jasus Christ Superstar\" theatrical piece held in my city, Modena. Together with the Duncan novel cover they are a great example on how Manson is appealing to represent the most varied situations, being them ethical-related or not. <br> <br>Thanks to everyone's collaboration!!!</p>"
