    html: "<p>&gt;do you have any samples of ma(n)son from barbie packaging? my neice loves  <br>the barbie fruit snacks, so i can easily scan a box for you if you need it. <br> <br>Isaac, I love you! I did not imagine they have used Manson in other products beside the Barbie DVD (and I wasn't even sure they did outside Italy). Here Rapunzel translates as Raperonzolo, which is one of the most ridiculous names you can find in Italian. I guessed the original german name would have been something like that. After all it's from an old fairy tale. Barbie just plays the role of the Princess. <br> <br>Please do send the hi-res scan. The size you've used here it's just fine: make it 300ppi and it would be A-OK. In fact I mean to showcase the DVD cover in big size. <br>This is because in it the \"dreamy\" and \"fairytalish\" atmosphere is so strong contrasting with Manson in an incredible way. The logo is also clean (without nifty digital effects like I see in your cereal box) but the cereal box is an excellent addition. I need it anyway! <br> <br>Now you can send it to my thought mailbox (<a href=\"mailto:thoughtNOCRAP@nettuno.it\">thoughtNOCRAP@nettuno.it</a>). Leave out the NOCRAP string, which I put to avoid spam engines. Now I have a DSL connection at home (sort of, it's pretty crappy). <br> <br>I wish to thank Nathan for sending the Dinosaur scans. I repeat my request to him anyway, to have the two beautiful interior pages as they appear in the low res above, and not cropped like the ones he sent me. <br> <br>Guys, you are really helping me! <br>Thanks and love to you all. <br> <br>P.s. Nathan, you can use the thought address, too, for re-sending the two interior pages. <br>There is no need to make them huge. Smaller files with a less lossy jpg compression would be better, in fact. <br>Have you guys ever used proJPEG plug-in? It's *amazing* for the quality and compression. <br>I have to see if they've released a OsX version.</p>"
