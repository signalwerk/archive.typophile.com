  html: "<p>Hello, <br>I'm doing here and there (mostly by chance) a reseacrh of certain contemporary typefaces in use (almost all from the boom years of Emigre, the first middle of the 1990s). <br>What intrigued me most was the use of a specific face (Jon Barnbrook Ma(n)son) in a widespread way but also unexpected situations: <br>from the latest Barbie cartoons DVD to the novel \"I, Lucifer\", to religious theatrical pieces posters; from Snow White and the Seven Dwarfs to a big (and embarassingly banal) Italian shopping center logotype. <br> <br>I would really love if you could drop me a line (and possibly the URL) when you see Manson used in unexpected (or even expected but good) ways. <br> <br>Other typefaces with a conceptual background (which users cannot guess from the face itself) I'm interested in seeing and collecting samples of their use are: <br> <br>Template Gothic (Emigre) <br>Keedy Sans (Emigre) <br>Exocet (Emigre) <br>Democratica (Emigre) <br>Prozac (Virus) <br>Auferstehung (Linotype) <br>Circumcision/CQN Molecular (T-26) <br>Merlin (FontFont) <br>Oneleigh (FontFont) <br> <br>Most of these may be seen by many people as \"novelty faces\" but part of them have been and are undoubtedly faces reflecting our times and the relationship with the emerging computer technology from the late 1980s early 1990s. <br>In different ways, of course. <br>Oneleigh (and Merlin), for example, I would be really interested to know if someone have used them in books or textsetting. <br> <br>Please, report freely also examples of any other face (expecially conceptual) used in an original or surprising way. <br> <br>Thank you SO much!</p>"
  html_clean: "<p>Hello, <br>I'm doing here and there (mostly by chance) a reseacrh of certain contemporary typefaces in use (almost all from the boom years of Emigre, the first middle of the 1990s). <br>What intrigued me most was the use of a specific face (Jon Barnbrook Ma(n)son) in a widespread way but also unexpected situations: <br>from the latest Barbie cartoons DVD to the novel \"I, Lucifer\", to religious theatrical pieces posters; from Snow White and the Seven Dwarfs to a big (and embarassingly banal) Italian shopping center logotype. <br> <br>I would really love if you could drop me a line (and possibly the URL) when you see Manson used in unexpected (or even expected but good) ways. <br> <br>Other typefaces with a conceptual background (which users cannot guess from the face itself) I'm interested in seeing and collecting samples of their use are: <br> <br>Template Gothic (Emigre) <br>Keedy Sans (Emigre) <br>Exocet (Emigre) <br>Democratica (Emigre) <br>Prozac (Virus) <br>Auferstehung (Linotype) <br>Circumcision/CQN Molecular (T-26) <br>Merlin (FontFont) <br>Oneleigh (FontFont) <br> <br>Most of these may be seen by many people as \"novelty faces\" but part of them have been and are undoubtedly faces reflecting our times and the relationship with the emerging computer technology from the late 1980s early 1990s. <br>In different ways, of course. <br>Oneleigh (and Merlin), for example, I would be really interested to know if someone have used them in books or textsetting. <br> <br>Please, report freely also examples of any other face (expecially conceptual) used in an original or surprising way. <br> <br>Thank you SO much!</p>"
