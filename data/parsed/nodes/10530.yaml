    html: "<p>Karen: please, I didn't mean to let you down! <br>I appreciate a lot any indication from you all and I'm really grateful! <br>Samples of any kind are fine! It's just me: I tend to be selective when I do such researches... ;) <br> <br>Exocet for Tazo is an appropriate use (and good design, too!). Exocet being based on greek and early latin stonecarving embodies the ancient origins of that kind of beverage (assumed the data they provide is true!). <br> <br>Thank you, Karen! <br>And please let me know if you are looking for examples of other kind. I'll be glad to help if I find something in Italy. In fact in each country many of these fonts have been used in very surprising ways. I hope more and more people will aid me! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
