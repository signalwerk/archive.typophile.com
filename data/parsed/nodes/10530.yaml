    html: <p>this book is for grown-ups, although it's disguised as a children's book. <br>i don't know if you have board books in italy. in case it's a purely north american <br>phenomenon, board book are printed on very thick, almost cardboard like paper. <br>it's like two sheets of 179 lb. (488 gsm)cover paper, each printed on one <br>side with a glossy finish, and then stuck together. this particular <br>book is about 5.25 by 5.75 inches and is 0.75 inches thick, yet has <br>only 28 pages, including the covers. the point is the pages are very thick, <br>made so chubby little baby hands can easily grab the pages and turn them. <br>the book is about a man who builds a village to protect all of his <br>children from the dangerous forest surrounding them. one of the kids <br>finds a whole in the outer wall of the village and crawls through, <br>gets lost, etc. the man comes and saves him, etc. it's obviously an allegory <br>for the choices we make and how god will help us and all of that stuff. <br>email me and let me know where i should send the high res images. btw, i <br>think the designer should have left the title unicase instaed of faking <br>the caps. it's just weird seeing it like that.</p>
