  - id: 66340
    user: 1316
    date: 2003-03-04T13:45:00
    date_raw: 4 Mar 2003 — 1:45pm
    votes: null
    html: "<p>PS. My stupid \"star\" votes are not meant to be a real \"vote\" they're just to help you grasp what I'm looking for in particular. <br> <br>I have another great example in my collection: A book dustjacket by Mucca Design (NY) for Rizzoli (Italia). It's for the italian edition of the scientific essay \"Impossibilities\", and it's the best use I've seen of Barry's ubiquitous face yet. <br> <br>The book (by famous scientist John D. Barrow) talks about the limitations of scientific thought (and of man's \"God complex\" in general), and this is echoed masterfully by the use of Template Gothic, designed by Barry in a deliberately \"irregular\" way to underline the imperfection and irregularity (and thus the limits) of this life.</p>"
