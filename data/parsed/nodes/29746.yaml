    date: 2006-11-27T14:34:00
    date_raw: 27 Nov 2006 — 2:34pm
    votes: null
    html: |-
      <p>I'm pretty sure the sans is Apex New Medium [Small Caps], available exclusively from Village:<br>
      <a href="http://vllg.com/Thirstype/ApexNew/mudTyper+Weights/" rel="nofollow">http://vllg.com/Thirstype/ApexNew/mudTyper+Weights/</a></p>
      <p>Look at the glyph table for Medium:<br>
      <a href="http://vllg.com/images/font_family_members/Thirstype/ApexNewMedium_glyph.gif" rel="nofollow">http://vllg.com/images/font_family_members/Thirstype/ApexNewMedium_glyph.gif</a></p>
      <p>The "earmarks" in the glyphs are:<br>
      A's crossbar and stance<br>
      C's openness<br>
      G's crossbar<br>
      M's raised center<br>
      R's straight leg<br>
      S's center</p>
