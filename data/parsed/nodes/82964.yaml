    <p>Hello, </p>
    <p>I recently read "On the Road" by Jack Kerouac... really liked it, and now I'm trying to design my personal cover for it.<br>
    The illustration is not 100% finished; but what I'm most worried about right now is the type... so if you'd take the time and help me choose the most appropriate type treatment, that would be great. :)<br>
    Of course, beside just choosing a design, I'll be also happy to hear some new suggestions as well as overall critique of the cover!</p>
    <p>Thanks!</p>
