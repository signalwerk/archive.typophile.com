    html: <p>I like the car hood. I like the white line in the road and the white letters for On The Road. I like the edgy tilted horizon. The author's name looks okay, but for an alternate look you could go with Jack Kerouac in a sans serif font (first and last name treated the same) along the lower edge of the book cover. Can you put some of that red from the hood into the sky to increase the contrast with the white letters? I am not sure specifically how. Maybe emanating from the sun (or is that the moon?) or in some other way. A gray sky does not seem right for this book.</p>
