    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ode_specimen_new_6586.png"></div><p></p>
    <p>Ode is a pleasant and vibrant family with a strong personality. It comes in five weights and is equipped with every feature a good quality text typeface needs: ligatures, extended language support and various figure sets as well as a fractions feature. Ideal for everything culinary!</p>
    <p>Find out more and try it out at <a class="freelinking external" href="http://www.martinplusfonts.com/" rel="nofollow">MartinPlusFonts.com</a></p>
    <p>Read the (German) article about the making of on <a class="freelinking external" href="http://www.designmadeingermany.de/magazin/4/ode/" rel="nofollow">www.designmadeingermany.de</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ode_visual_small_5683.png"></div> <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ode_gullivers_new_6115.png"></div><p></p>
