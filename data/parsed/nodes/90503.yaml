    <p>I was asked to design a simple site for a friend who runs a beauty supply company.</p>
    <p>I was thinking in 2012, it's nice to use a typeface beyond the regular.</p>
    <p>Does anyone have any advice for using <a href="http://www.google.com/webfonts" title="http://www.google.com/webfonts">http://www.google.com/webfonts</a> or <a href="https://typekit.com/" title="https://typekit.com/">https://typekit.com/</a>?</p>
    <p>I just want a simple font for body copy.</p>
    <p>Do these fonts work in IE and Safari?</p>
