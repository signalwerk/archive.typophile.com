      <p>What I meant, other than what Hrant already said, is that you <em>can</em> compete with “standard fonts”.<br>
      It’s a matter of offering something different or something fresh or something more (not necessarily design-wise). H&amp;FJ do it in a way, Jos Buivenga do it in a different way, just as Christian Schwartz do in yet another.<br>
      But my advice would be starting with something you like or, better yet, with something you want to make better. And remind that success isn’t always tied to money making. Just ask Pablo Impallari or James Edmondson.</p>
