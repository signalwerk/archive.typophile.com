    <p>Hi guys,</p>
    <p>I'm getting back to typography and wondering: "How to make money with typography"<br>
    Kind of a silly question I know but still... Isn't it worth answering?</p>
    <p>I had three (bad) fonts on the MyFonts for some years. They've been selling for like 50$ a year but now... I want to do something that is worth of my time.<br>
    There are a lot (really a lot) of good fonts for sell. So the question is once again, how to make money with typography?</p>
    <p>(It seemed to me a fun topic to start)</p>
