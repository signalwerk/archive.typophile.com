      <p>To amplify on “special”: while it is possible to make something special in an established genre, it is more special to create something original by visually addressing (exploiting) some new or emergent quality of technology in an imaginative way. The issue you identify may be a quality of font production tools, or of font rendering tools, or of font marketing methods.</p>
      <p>David Byrne’s new book sounds interesting, especially the chapter where he goes into the economics of music making in detail. Perhaps someone will do that for the font business.</p>
