      <p>@hrant &amp; frode frank: it's misleading because their "standard" fonts. What do I mean by standard? Well... Helvetica is like... "When you don't know what to use, use helvetica". Museo, Futura, DIN, Univers, Frutiger became quite "standard" also. So standard, I guess I'm using the word to explain that most of people use those fonts. Fonts that here for a long journey already and became standard, they may not be the best fonts but since they're here for a while already...</p>
      <p>There really is a difference between short-term and long-term success but still... If I could see a bigger bestseller list like... 200 fonts I guess it would be less misleading.</p>
      <p>Anyhow, trying to get some info from the 50 top list, it seems to me that people really like these "modern" sans-serif (I don't know how to call these straight lines and stuff eheh). When It comes to script and calligraphy seems to me that people goes for the "strange" category. There are exceptions of course like Almibar which by the way seems to me a really good font.</p>
