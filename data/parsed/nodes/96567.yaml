      <p>Ok. I see here three statements: special, love, hard work. The three are, as always on these matters, fine. I've been a web and graphic designer for some time already (10 years) so I know that those statements are really a need.</p>
      <p>I was although trying to get a more defined answer.<br>
      What do I mean by this? Something like which sells more? Script, sans-serif? Where do you get inspiration for fonts? Do people (the ones that earn money) still do revivals? Is a revival a good profit? Isn't just one more of the same?<br>
      I guess my overall question is where to explore on type? Isn't everything (usable) more a less explored? Or there is still plenty of space for more fonts (there is always space but...)? In which categories?<br>
      What do you have to say to this matter?</p>
