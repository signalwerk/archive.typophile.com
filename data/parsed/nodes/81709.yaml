  html: |-
    <p>I was researching something else today and I found the pretty well put together <a href="http://www.doubletongued.org/Official_Dictionary_of_Unofficial_English-Grant-Barrett-0071458042.pdf" rel="nofollow"><cite>Official Dictionary of Unofficial English</cite></a> (it even has a quote from William Safire on the cover!). And it includes Hrant's famous "bouma", along with a quote from him as one of its seminal uses. </p>
    <p>I couldn't find any evidence that this news has been broken to Hrant and the rest of the Typophile community, so I thought I ought to make a topic.</p>
