      <p>The connection between coins and type is that the minting of coins was a pre-existing technology that used letter punches in the making of coin dies. Whoever introduced the use of letter punches and matrices into typefounding was probably inspired by the letter punches used in making coins, but it's worth noting that the styles used were different. Early type was usually bastarda or textura, whereas the letter punches used on fifteenth-century coins in Latin Europe were normally lombardic.</p>
      <p>If Needham and Agüera are correct that Gutenberg wasn’t using punches and matrices, then minting technology contributed to a subsequent improvement of Gutenberg’s technology, not to its initial creation.</p>
