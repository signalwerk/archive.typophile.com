      <p>I think all engraving for casting or impression can be, in a way, practice for punchcuttery. Seals, dating back to the mess in potamia were produced in limited editions for official use, until metal became less precious, and note they used one of the less precious metals once they started making type.</p>
      <p>But minting,  gun, and other weapon making, and  gold smithing, we know were all related to early famous type designers. Near the end of punch cutting, at least in the U.S., founders were based in places where there were significant clusters of industrial engravers and machines were made, like Milwaukee, Chitown, St. Louis, and the industrial centers of the northeast. In Philly, NY, and Boston, they made coins too.</p>
      <p>All these places and more, had people skilled enough, e.g. to make very tiny parts for early watches, and kinds of less tiny but still very small gears and nuts and bolts... You know parts, and every one of those parts, started on a drawing board, ended with a master drawing, and proceeded to production to tolerances reaching 1/10,000 of an inch by 1900 or so.</p>
      <p>By then bridges, telegraphs lines, and a few inside inventions, made the Linotype machine go viral, and that changed a lot. Whether making coins breeds type, great great great grampa, I'm thinking.</p>
