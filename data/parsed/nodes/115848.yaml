    <p>I’m starting a topic about the relation between coin and type.<br>
    Does the engraving of coins breed the making of typefaces?<br>
    Is there an economical overtone?<br>
    As a lead, in the XV th century, typeface designer Nicolas Jenson was first the head engraver/master of the French Royal Mint at Tours for King Charles VII.</p>
