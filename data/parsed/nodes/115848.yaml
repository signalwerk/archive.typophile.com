      <p>In the Report of the Maine Press Association for 1883, I found the confident assertion on page 9:</p>
      <p><cite>Up to 1450, the types used by Gutenberg were cut by hand in wood or metal. At this date Peter Schoeffer invented a process by which types could be cast, and which constituted one of the most valuable improvements in the history of printing.</cite></p>
      <p>Another book gave a wide spectrum of claims. <em>Typographia</em> noted the specific credit for type casting was given to Schoeffer by papers left by Fust, and that this book</p>
      <p><a class="freelinking external" href="http://www.smu.edu/Bridwell/Collections/SpecialCollectionsandArchives/Exhibitions/PeterSchoefferPrinterofMainz/EarlyMasterpieces/Durandus1459" rel="nofollow">http://www.smu.edu/Bridwell/Collections/SpecialCollectionsandArchives/Exhibitions/PeterSchoefferPrinterofMainz/EarlyMasterpieces/Durandus1459</a></p>
      <p>which indeed came after the 42-line Bible, was the first one set with the new-style cast types.</p>
