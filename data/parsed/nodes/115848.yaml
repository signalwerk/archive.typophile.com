      <p>One web page giving an account of their research said "The scholars said they discovered that individual letters differed in shape from one another in such a way that they could not have come from the same metal mould. For example, the ‘A’s, ‘B’s and so forth on any given page on Gutenberg’s papal bull are not always exactly the same shape."</p>
      <p>I really hope this was garbled. Scholars of printing long knew that Gutenberg had two forms of each letter, to simulate the effect of a hand-produced manuscript with movable type.</p>
      <p>If Needham and Agüera actually discovered that there were many more than two forms of each letter, so that Gutenberg really printed from, say, hand-carved wood blocks, contrary to popular belief, that would be a major discovery. If, on the other hand, they jumped to their conclusion because of the two forms of each letter that were already well known, because they put a magnifying glass to Gutenberg's Bible without doing a <strong>literature search</strong> beforehand...</p>
      <p>EDIT: A fuller account, at</p>
      <p><a class="freelinking external" href="http://www.open.edu/openlearn/history-the-arts/history/history-science-technology-and-medicine/history-science/the-discovery-changed-our-view-gutenberg" rel="nofollow">http://www.open.edu/openlearn/history-the-arts/history/history-science-technology-and-medicine/history-science/the-discovery-changed-our-view-gutenberg</a></p>
      <p>is now leading my thoughts in the direction labelled "deliberate hoax", rather than the previous conclusion of "unutterable stupidity".</p>
      <p>This is because</p>
      <p>"To their surprise each letter in its many reproductions on each page varied, even though they could find identical repetitions of that letter on other pages."</p>
      <p>So either Gutenberg still made use of movable type, even if by cutting up his woodblocks into pieces to re-use the letters (one can't really say he invented it, of course, thanks to Pi Sheng)...</p>
      <p>or, instead, we are in error to think that Linn Boyd Benton originated the typographical use of the pantograph!!!!</p>
      <p>And if <em>that's</em> true, then all I've got to say is</p>
      <p>♫ <em>God didn't make little green apples,/and it don't snow in Indianapolis/in the summertime</em> ♫</p>
      <p>For another musical selection, connected to cutting-edge research on the history of technology of apparently similar quality, go here:</p>
      <p><a href="/wiki/https%3A/%252Fwww.youtube.com/watch%3Fv%3DYhwkdJfsAKg" class="freelinking" rel="nofollow">https://www.youtube.com/watch?v=YhwkdJfsAKg</a></p>
      <p>At least the music was well done...</p>
      <p>Oh, wait; I <em>am</em> being too harsh. If Gutenberg did invent/use movable type, but not punches and casting molds, then perhaps they were merely claiming that Gutenberg used individual hand-made movable types. That would explain no two letters on the same page ever being identical, which is what they claim to have seen.</p>
      <p>The Press has been known to badly garble the results of research before. Or it is but my own failing in not reading the post mentioning them more carefully, which did speak but of punches and matrices, although the web articles I found spoke of movable type itself.</p>
      <p>EDIT: Searching for images of the pages of the 42-line Bible led me to this more conventional research,</p>
      <p><a href="/wiki/link.springer.com/article/10.1007%252Fs10032-010-0140-6%2523page-1" class="freelinking" rel="nofollow">link.springer.com/article/10.1007%2Fs10032-010-0140-6#page-1</a></p>
      <p>which claims the use of multiple matrices for each letter as a <em>recent discovery</em>, rather than something that was long known. The paper dates from 2010, and I thought I had seen the alternate forms of Gutenberg in books on typography from the 1970s if not earlier.</p>
