      <p>As for the bouncy letters in _ANOTHER FILM COMPLETELY_ you could substitute a font like Schnitzle <img src="/sites/default/files/old-images/SchnitzleAsANOTHER_6221.gif"><a href="http://www.myfonts.com/fonts/astigmatic/schnitzle-aoe/">http://www.myfonts.com/fonts/astigmatic/schnitzle-aoe/</a><br>
      Similar bouncy style letters, but in a narrower width, are found in Rather Jazzy <a href="http://www.myfonts.com/fonts/pintassilgo/rather-both/">http://www.myfonts.com/fonts/pintassilgo/rather-both/</a> and Lemon Yellow Sun <a href="http://www.myfonts.com/fonts/hanoded/lemon-yellow-sun/">http://www.myfonts.com/fonts/hanoded/lemon-yellow-sun/</a><br>
      Don</p>
