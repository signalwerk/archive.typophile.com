      <p>The info at the bottom looks like Helvetica.<br>
      As for the rest the _Holy Grail_ has some similarity to some of the "pirate" fonts like Blackmoor <a href="http://www.myfonts.com/fonts/itc/blackmoor/">http://www.myfonts.com/fonts/itc/blackmoor/</a> Windlass <a href="http://www.myfonts.com/fonts/scriptorium/windlass/">http://www.myfonts.com/fonts/scriptorium/windlass/</a> and captain Kidd <a href="http://www.myfonts.com/fonts/scriptorium/captain-kidd/">http://www.myfonts.com/fonts/scriptorium/captain-kidd/</a><br>
      Don</p>
