    html: |-
      <p>The lettering in _AND NOW! AT LAST!_ has a sort of Looney Tunes style. It would be difficult to create the overlap effect with a font, but Marvin Shadow captures the spirit <img src="/sites/default/files/old-images/MarvinShadowAsAND_5884.gif"><a href="http://www.myfonts.com/fonts/canadatype/marvin/">http://www.myfonts.com/fonts/canadatype/marvin/</a> For more fonts similar to Marvin go to <a href="http://www.identifont.com/find?font=marvin&amp;q=Go">http://www.identifont.com/find?font=marvin&amp;q=Go</a> and follow the link to _Show more similar fonts_.<br>
      Don</p>
