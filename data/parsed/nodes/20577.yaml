    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : David Thometz</strong></p>
    <p>David Thometz was born in Everett, <a href="/wiki/Washington" class="freelinking" rel="nofollow">Washington</a>, USA, in 1966.</p>
    <p>He moved to South Jordan, <a href="/wiki/Utah" class="freelinking" rel="nofollow">Utah</a>, <a href="/wiki/United%20States" class="freelinking" rel="nofollow">USA</a>, in 1979, and studied Graphic Design and Illustration in the late 1980s and early 1990s at the <a href="/wiki/University%20of%20Utah" class="freelinking" rel="nofollow">University of Utah</a> in <a href="/wiki/Salt%20Lake%20City" class="freelinking" rel="nofollow">Salt Lake City</a>, Utah, USA. He served as the Communication Specialist in Graphic Design at the <a href="/wiki/Westminster%20College" class="freelinking" rel="nofollow">Westminster College</a> Communication Office in Salt Lake City from 1996–1998, and has run his own graphic design studio, David Thometz Design, since 1996.</p>
    <p>In April of 2004, he moved his office to Hampton, <a href="/wiki/Tennessee" class="freelinking" rel="nofollow">Tennessee</a>, USA, in the Tri-Cities area of the Northeastern Tennessee Appalachian Mountains, where he now lives with his partner, Bryan, their three cats, three dogs and hundreds of wild birds which visit their feeders regularly.</p>
    <p>Among his typeface designs are the DTD Hefeweizen family, the DTD Silvertone Woodtype family and DTD Seriatim Ornaments, all of which appeared on <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>.com and are now available throught MyFonts.com.</p>
    <p>From 2004 through 2006, he designed the DTD Erwin Text family for the weekly newspaper, The Erwin Record, in Erwin, Tennessee. The DTD Erwin Text family is a large-bodied newspaper text face based on Cloister and Plantin.</p>
