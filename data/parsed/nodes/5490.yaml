    votes: null
    html: <p>I like the name, but not the typeface. This begs for something a bit more fun and a bit more display-oriented, rather than typesetting-oriented. A bit more geometric and a bit less industrial gothic. The design seems aimed towards the fun and friendly, but the type is pulling it in another direction. <br> <br>Personally, I don't think the mark is such a big deal, but it definitely doesn't say 'this is a tart' to me at all, but if you both agree that this is a visual element that captures the essence of your studio, then convention be damned. If you'd like it to be more accessible, perhaps you should do something with crust and filling. Right now it looks like a bite, but the bite and the tart edge read as the same thing, which confuses both. Here's a photograph of a <a href="http://www.proppersource.com/images/foods/tart-rasp.jpg">stage prop tart</a>, which could be a good model for judging proportions of various details, since stage props are designed to read from a distance. <br> <br>That said, it's a good sTart. (I couldn't help myself.) You've got an intriguing concept to work with.</p>
