    html: <p>How about if only the "T" in tart were reversed out of the cloud shape and the "art" would stay black?  This would make a double meaning with the word ART so that it would read "T" "ART" as well as TART.  The "T" could mean typographic, TEAMED (since there are 2 of you), or suit you to a "T".  The ART would refer to your business function, an art/design studio. <br>It would still be fun and playful but at least give the viewer a hint as to what you do.  As it stands now, it could mean anything from a florist toi a baker. <br> <br>ChrisL</p>
