    <p><cite>A series of seventeen Didot fonts sized between 4.5 point and 21 points were founded using matrices supplied to Joh. Enschedé en Zonen (Netherlands)... </cite></p>
    <p>Above is an example from something I am working on.<br>
    Though both sizes are more than one, and hence plural, it would seem grammatically correct to say <strong>points</strong>.<br>
    I prefer <strong>point</strong> as it seems more modern and can exist with out the superfluous s on the end.</p>
    <p><strong>but</strong> why does it feel natural to use both in the same sentence. I could have just gone with one of the two options above but I thought I would see if anyone had an opinion on this.</p>
    <p>So, I am proposing a style where in the <strong>first instance the singular</strong> is used and for the <strong>last instance in a sentence plural</strong><br>
    BTW when I refer to points as a size of a type the number is a figure.</p>
    <p>here is another example:</p>
    <p><cite>A ‘9 on 12 point body’ describes a type usual to a 9 point body which is cast onto a body three points larger.</cite></p>
    <p>Any thoughts or known facts...</p>
