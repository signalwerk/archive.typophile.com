      <p>Almost there. The shift to singular happens when the measure is part of a compound adjective that modifies a noun. Compound adjectives should also be hyphenated: a 3-inch nail, an 80-year-old man, 12-point type.</p>
      <p>The measure stays plural if it's in a phrase on the other side of a verb. Then it's modifying an adjective. The actual adjective of the phrase is sometimes missing but implied: "The race is ten miles" really means "The race is ten miles <em>long.</em>"</p>
      <p>Now, some fudging occurs when people start to think of a compound adjective as one that can be used where any other adjective can. Arguably, you can say "The type is 12-point" as easily as the "The type is black." But it's an unusual way to say things in most situations; we don't say "The race is ten-mile."</p>
      <p>So let's look at your example.</p>
      <p>"A series of fonts sized between 4.5 points and 21 points was founded."<br>
      ("was", not "were", because the subject is "A series".) I would argue that the word "sized" demands this form. "This font is sized to 21 points" is like "This building was built 21 floors tall."</p>
      <p>I think that use of "sized" is awkward anyway. I would say:<br>
      "A series of fonts between 4.5 points and 21 points in size was founded."</p>
      <p>You could also say:<br>
      "A series of fonts from 4.5-point to 21-point was founded."<br>
      This treatment of adjectives is similar to that in such phrases as "all creatures great and small".</p>
      <p>Above all, measurements listed together as the same part of speech should be in a consistent form, no matter how much more "specific" you think one number is than the other!</p>
