      <p>If developing a 'house-style' for usage do you think it would be good to differentiate between size (as dimension) and physical state?</p>
      <p>[Updated from top] So far when referring to points as a 'physical state' of a (metal) type the number is a figure. [i.e. 7-point type]. (Is referred to in singular, and is hyphenated)</p>
      <p>So with the convention of writing out numbers as words in running text helps identify a size (as dimension) [i.e. three points larger] clearly differentiating from the 'physical state' which uses a figure [i.e. 7-point type].</p>
      <p><cite>A ‘9 on 12-point body’ describes a type usual to a 9-point body which is cast onto a body three points larger.</cite></p>
      <p>Concerning sizes (as a dimension of scale)<br>
      <cite>...investigating features considered extraordinary or specific to the design of a typeface concerned with reproduction and legibility at sizes less than 7 points.</cite><br>
      <strong>becomes</strong><br>
      <cite>... and legibility at sizes less than seven points.</cite></p>
      <p>So taking two quotes (that I won't change in the text (as they are are quotes) but will apply the 'house-style' rules here for clarity are as follows:</p>
      <p><strong>Quote</strong><br>
      <cite>The process was reversed for the large sizes, 18 points and larger, where legibility was not a problem and an aesthetic motive could apply.</cite>  [Walter Tracy]<br>
      <strong>would become</strong><br>
      <cite>... for the large sizes, 18-point and larger, where legibility was not a problem and an aesthetic motive could apply. </cite></p>
      <p><strong>Quote</strong><br>
      <cite>Shorted descending and ascending strokes are unforgivable on bodies over 18 points. It is quite legitimate to shorten the tails of the small fonts [lowercase] to increase legibility and to lengthen them in the display size of the same face for the sake of elegance.</cite>  [Harry Carter]<br>
      <strong>would become</strong><br>
      <cite>...on bodies over 18-point.</cite> (as is descriptive of the physical body of type)</p>
      <p>So far so good?</p>
