      <p>I'd say it's a matter of nominal vs. adjectival forms. In adjectival forms with units of measure, you use the singular (e.g., "20-dollar bill"). When used as a noun, the unit of measure takes the plural with numbers other than one (e.g., "it costs 20 dollars"). So <em>A series of seventeen Didot fonts sized between 4.5 point and 21 points </em> is not correct, because both instances are functioning as nouns rather than adjectives, whereas <em>A ‘9 on 12 point body’ describes a type usual to a 9 point body which is cast onto a body three points larger</em> is correct, because it uses singular where the number plus unit function as an adjective modifying a noun, and plural where the unit is used as a noun.</p>
      <p>It might be different sometimes in a language that has plural adjectives, assuming it allowed such constructions.</p>
