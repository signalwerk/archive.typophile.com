  html: "<p>ANNOUNCING: <br> <br>Emigre #16: Collector's Copies Sale <br>+ Rare Emigre Poster Sale <br> <br> <br>-------------------------------------------------------------- <br>Emigre #16 <br>To celebrate the upcoming release of Bruce Licher's new Scenic <br>CD (see Emigre #63), we are offering for sale 20 copies of <br>Emigre #16, which sold out years ago. <br>Published in 1990, the cover of this issue was designed and <br>printed by Bruce Licher at Independent Project Press in <br>Los Angeles. 3,000 covers were printed on a hand-fed Vandercook <br>219 letterpress on plain chipboard. Since the printing took a <br>gruesome four days, a different color was used each day in order <br>to break the monotony of hand-fed printing. Therefore there are <br>four different colored covers; copper, dark red, black, and brown. <br>We have unearthed 20 copies of the copper colored covers, and are  <br>offering them for sale on a first come first serve basis. <br>Emigre #16 featured the inauguration of Emigre Music. It includes <br>interviews with Bruce Licher, Fact TwentyTwo, Every Good Boy <br>and others. It also includes a large pull out poster announcing <br>the birth of Emigre Music. <br>Emigre #16 was published in the original size of 11 x 17 inches. <br>Price: $25.00 <br> <br>See the cover image at: <br><a href=\"http://www.emigre.com/EMag.php?issue=16\" target=\"_top\">http://www.emigre.com/EMag.php?issue=16</a> <br> <br> <br>-------------------------------------------------------------- <br>Press Time! 2 Poster Set <br> <br>Limited edition 2-poster set. These two posters were originally <br>printed as part of Emigre #12 (published in 1989), and were <br>designed to function as signatures for Emigre magazine and <br>as posters when unbound. <br>Printed in two colors on heavy stock, 25\" x 38\". <br>(This set is part of the permanent design collection of the <br>San Francisco Museum of Modern Art.) <br>Price: $25.00 (FedEx Shipping only) <br> <br>See the cover image at: <br><a href=\"http://www.emigre.com/EPosters.php?set=POEMPRSSTME\" target=\"_top\">http://www.emigre.com/EPosters.php?set=POEMPRSSTME</a> <br> <br>To avoid receiving damaged posters, express shipping is required. <br>(3 item shipping) Express shipping for this item is: US $21 / <br>Canada $27 / S.America $48 / Western Europe, Asia, Australia and <br>Middle East $33 / Elsewhere $60</p>"
