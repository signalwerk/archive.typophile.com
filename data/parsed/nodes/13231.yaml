    html: <p>The basic tenet of these articles, which appears to be that wacky fonts cause kids to behave in a wacky manner, is certainly one of the most bizarre contentions I have heard in a long time. Of course, for parents I suppose it is always easier to find something (or someone) else to blame for a child's bad behavior.</p>
