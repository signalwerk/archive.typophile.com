    html: |-
      <p>I was just amazed that topics about typefaces (fonts as the rest of the world commonly misuses) should appear in a forum for new fathers.</p>
      <p>On the other hand, it occurred to me that urban graffiti letter shapes of the sixties have evolved into a sort of youth art form commonly associated with hiphop, rap gangs and wannabees.</p>
      <p> It was just a matter of time before some "styles" were available as fonts.</p>
      <p><a href="https://web.archive.org/web/20150124155854/http://members.chello.se/johan.waldenstrom/fonts11d1.htm" target="new" rel="nofollow">Johan Waldenstrom's designs</a> apparently were used for the <a href="https://web.archive.org/web/20150124155854/http://members.chello.se/johan.waldenstrom/font_examples.htm" target="new" rel="nofollow">Coca-Cola Soundwave campaign.</a></p>
      <p>Just as with music, art and clothing, each generation creates a genre to represent itself. And as always, marketers are there to repackage old snake-oil.</p>
      <p>---------------------------------------------<br>
      Yes, I'm old, but I still wear beads and sandal!</p>
