    html: <p>My problem is that I love the work, and find it difficult to turn down an interesting sounding project, even if I already have too much on my plate. Recently, I started finding creative ways to deal with this, such as inviting colleagues to collaborate on projects, so I don't feel like I'm under a mountain of work that is only getting heavier, but this is only possible because I'm 100% my own boss. I feel really sorry for the people who are overworked through someone else's decision; at least I know I have only myself to blame.</p>
