  html: <p>Today is a sad day for the company where I work. My supervisor had an heart attack and is on hospital with a very reserved coma status. He his 35 years old, and like many of us had a very stressed "modern" life. I come from a very small village and I've seen my family with no stress whatsoever. I usually spent 8 hours on work before a computer, go home eat something, and usually go and work freelancer more 4-5 hours a day... I wonder if it's necessary all of this. Modern life...</p>
