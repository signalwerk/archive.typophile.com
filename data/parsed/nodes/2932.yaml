    html: <p>I also think that the only reason why I sit again at home doing the "same thing" but with extra feeling and with more passion is because I LOVE WHAT I DO. This takes so much time and energy from my life that i have the same problem as you John H. I just can't turn off this design way of life. I don't know if this will change with time (kids &amp; other extras <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">) but we'll see. On this last year I also got a pile of work that I've accepted (with no time at all to do a good job) and got my friends to work on these projects. On the first years I did everything and this is a serious mistake. <br> <br>That 20/20 rule is a good idea! <br> <br>Thanks for the good vibes and support.</p>
