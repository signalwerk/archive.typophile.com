    html: <p>Boy, good advice, Hrant. <br> <br>Debt reduction and freedom from feeling like I just *have* to buy stuff has been the focus of my household the last few years. <br> <br>We are not anti-stuff. We just feel like we want to be free of it - get rid of its hold on us. We still enjoy things. <br> <br>Too bad about the fellow struggling for his life now. It seems to be a roll of the dice. Genetics, environment, temperment ...etc. <br> <br>Live every day as if it is your last - love you family and friends. Sounds sappy, but it is true.</p>
