  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_4_6221.jpg"></div><br>
    .<br>
    Ladies and gentlemen,<p></p>
    <p>I take the pleasure to finally announce the release of <strong>Lapidaria</strong>. A warm Thankyou to those of you fellow typophiles who helped me with advice during the last weeks.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_1_6257.jpg"></div><br>
    .<br>
    <div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_2_5644.jpg"></div><br>
    It is a family of nine fonts: three versions (maior, medior, minor – which is upper-, middle- and lowercase) in three weights each. I thought it might be somewhat nice to try a kind of uncial script in a non-historic manner, even as a sans. Hope you like it.<br>
    The triple allows to do typography like this:<br>
    <div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_3_5317.jpg"></div><br>
    The fonts are completely equipped for any Euro-Latin language (yes, even Maltese and Welsh ;-). Note that they also contain Greek.<br>
    <div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_5_4100.jpg"></div><br>
    The fonts are available seperately and in varios packs. For instance, there are sets which bundle all Regular fonts or others which bundle all Minor or Medior fonts.<br>
    Best of all: one font is <strong>free!</strong><p></p>
    <p>Now you’re welcome on the <a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/lapidaria/" rel="nofollow">Myfonts-Lapidaria site</a> where specimen in Deutsch and English are waiting for you.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_7_4849.jpg"></div><br>
    For those who’d like to look a bit in the faces’ background I’ve written something <a class="freelinking external" href="http://typophile.com/node/71253" rel="nofollow">there</a>.<p></p>
