    html: |-
      <p>OS X has always required AAT fonts for complex scripts like Arabic, Devanagari, etc.    There are exceptions however.  For example, the app TextEdit should display Arabic OpenType fonts correctly, and the app Mellel uses its own text engine specifically designed to do the same (but it cannot do Devanagari).</p>
      <p>Pages and all iWork apps and iWeb have various other bugs that make them generally unsuitable for RTL scripts even with AAT fonts.   MS Word for Mac OS X has also never supported Arabic with any kind of font.  Adobe apps should be the ME version to work properly. Recommended apps for Arabic are Mellel (easily the best), TextEdit, Nisus Writer, or Open/Neo/LibreOffice.</p>
