    html: |-
      <p>Lots of near matches (30 typefaces matching in a range from 94% to 97%) when I searched using FindMyFont. Nothing with both the stepped back upper story on the |B| and the exact same length (short) crossbar on the |E|.</p>
      <p>Maxine Sans Heavy topped the list:<br><a href="http://www.myfonts.com/fonts/activesphere/maxine-sans/">http://www.myfonts.com/fonts/activesphere/maxine-sans/</a></p>
      <p>EDIT: A post on this forum from two years ago claims it is ITC Blair. Good for the |E|, not so much so for the |B|:<br><a href="http://typophile.com/node/96757">http://typophile.com/node/96757</a><br><a href="http://www.myfonts.com/fonts/linotype/blair-itc/">http://www.myfonts.com/fonts/linotype/blair-itc/</a></p>
      <p>According to this, the type is bespoke:<br><a href="http://www.kms-team.com/en/referenzen/bentley#details">http://www.kms-team.com/en/referenzen/bentley#details</a></p>
