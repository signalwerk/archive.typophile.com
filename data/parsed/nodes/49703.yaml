      <p>my 2 cents</p>
      <p>I think you got a bit carried away with the different fonts you used<br>
      (count about 18 including the weights). I would decide on 2-3 font families<br>
      and stick with them...</p>
      <p>a few points:<br>
      - listen to jazzhustler (try some serifs...you will be surprised)<br>
      - dont use the reflection on the top<br>
      (works for apple i know...but it doesnt suite your newspaper)<br>
      - try the boxes and dividers without the double lines<br>
      - the captions and some of the titles have to much space between the letters<br>
      (makes it hard to read)<br>
      - check the dots on the “inside box”</p>
      <p><a href="http://www.smashingmagazine.com/2008/02/11/award-winning-newspaper-designs/" title="http://www.smashingmagazine.com/2008/02/11/award-winning-newspaper-designs/">http://www.smashingmagazine.com/2008/02/11/award-winning-newspaper-desig...</a><br>
      for your inspiration</p>
      <p>hope this helps...keep us posted</p>
      <p>PS: tried to download an older version of the newspaper (baronbanner.com)<br>
      but the download was 40mb...wow...a bit too big...smile</p>
