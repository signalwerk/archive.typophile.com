      <p>I was the high school newspaper editor in high school, and got to design the layout too — that’s how I got into graphic design. I wanted to be a journalist before that.</p>
      <p>I would agree with all the comments above. Part of the issue, as I remember it, was the fact that the paper’s budget is a few thousand dollars, so you’re limited to some not so great fonts and some not so new software. Definitely choose a couple fonts, like a serif font for copy and a sans serif for headlines, and simplify the boxes for callout info — a simple thin dividing line would look much cleaner than a black box.</p>
      <p>I would say you should speak with your other editors and your adviser about what the goal of the paper for the year is. Do you want to win awards and send your senior editors off to journalism school on scholarships? Or do you want to be something that connects with the students at your school and is fun for the newspaper staff? A lot of people are going to say “that’s not mutually exclusive,” but in my experience they were. </p>
      <p>I went with the latter my senior year — it had a zine-like feel, different fonts on every page, everyone got to design their own story</p>
