    <p>I’m the layout manager for my high school newspaper, and I uploaded a sample of my redesign of the paper. Please critique it and inform me of any flaws so I can improve.</p>
    <p>I particularly want feedback about these areas of my design:</p>
    <p>text font: I used a sans serif text font, but most newspapers use a serif font. Is my break from tradition okay? My goal in using the sans serif text is to make the paper look more modern to attract the high school audience.</p>
    <p>nameplate: For a special effect, I used an idea from Apple Mac OS X Leopard’s Dock by reflecting the nameplate. Will this effect be a problem when printed on paper? Also, I am concerned with text boldness.</p>
    <p>use of blacks: Most newspapers use grays instead of blacks for contrast, but I used white text on a black background for even more contrast. Is this a good idea?</p>
    <p>Thank you for your comments on my design.</p>
