      <p>First off the bat, you’ve stretched the text for the Newspaper’s name (Copperplate Gothic?) by 227%, which looks obvious and doesn’t look great IMO.  I think it’s best to find a font that fits the space better, with any stretching of the font kept to a minimum.  You applied stretching to other areas too, so I’d say try and apply the same discipline by finding a condensed font that fits better.</p>
      <p>Using a serif font for body text won’t necessarily make the newspaper look old fashioned.  There are some really forward looking serif fonts out there that’ll make it look great.  Sans Serif fonts are harder to read for lengthy passages, although this being a two page newsletter, I don’t think that’ll be an issue in this case.</p>
      <p>Hope this helps, and please post subsequent versions when you’ve taken enough advice on board - I’d like to see it develop.</p>
      <p>JH</p>
