    <p>I know in every graphic department the eye should be the final judge, but somehow I seem to have more faith in my mathematical skills than my optic senses. One thing I can’t seem to figure out though is how to make a nice S (even in existing fonts I usually dislike the S-character the most)...<br>
    Any suggestions on the “scientific” approach of the S would be much appreciated!</p>
