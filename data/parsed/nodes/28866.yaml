    html: |-
      <p>as a novice, my input may not be as valuable as those above... then again...</p>
      <p>The Briem site is terrific. His advice to draw the damned thing again and again...</p>
      <p>and again...</p>
      <p>is right on. I must have drawn 20 esses before i got to one i was ready to settle on... at least until i get back to balancing weights and such. The following samples each have 10 bezier pts.</p>
      <p></p><div class="imageWrap"><img src="/files/s_5367.jpg"></div><p></p>
      <p>If they don’t look much different to you, again, M. Briem has the right advice. sit. look at them. and then look at them some more. I take a printed page of chars with me when i ride to the beach every day. and look at them.</p>
      <p>Once i got to where i like the basic shape, I removed the points  from the top and bottom of the bowls and from the mid stroke and added points to the outsides of the bowl strokes, resulting in 8 points which gave me better control of the weight and curvature. </p>
      <p></p><div class="imageWrap"><img src="/files/s2_3412.jpg"></div><p></p>
      <p>of course, this is a pretty simple shape.</p>
      <p>geo.</p>
