    html: |-
      <p>Equal length of control vectors does not improve the geometric qualities of the spline, I am afraid. It seems to be one of the most widespread fallacies.</p>
      <p>If your curve looks somehow wrong or discontinuous you almost always need to shift the position of the actual nodes. Fiddling about with the control points does not help.</p>
      <p>Tim</p>
