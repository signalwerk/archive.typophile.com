      <p>Science measures what nature provides. Sometimes a mathematical measure is far more complicated than just providing it naturally.  Do a lot of drawing of the s and get inside of it.  You may have a better idea of what the mathmatital measurements you get are all about—you may even pass on the math :-)</p>
      <p>ChrisL</p>
