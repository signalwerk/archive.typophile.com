    <p>I am currently doing a book for final year students that is useful to potential employers if they are willing to take on new designers for work placements or may it be for a job. It is a book that has been produced every yr and now this yr, it is it’s tenth anniversary. So i was wondering if you think this solution is ok or not?</p>
