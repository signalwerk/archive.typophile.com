    <p>I understand that in order to fully enjoy OT characters that are beyond the default 256 I am used to, I need a program like In Design. I am curious does it have the same “save as” functions as PS, or do you have to import your layout back to PS to view things like results of .jpg compression choices?</p>
    <p>What brought this on was after viewing Paul Hunt’s new <strong><a target="_blank" a="" href="http://www.p22.com/ihof/zanerset.html">ZANER SET</a></strong> and <strong><a target="_blank" a="" href="http://p22.com/ihof/allyson.html">ALLYSON PRO</a></strong> fonts, I am burdened with an urgent feeling that I will soon need to start thinking up a series of excuses to explain to my wife why I need In Design. Not to mention the sale price of both sets. This will be one of my hardest sales ever, so any additional excuses, gladly accepted.</p>
