    html: |-
      <p>I’m not quite sure what you’re planning re:”results of jpeg compression”; using inDesign to create jpegs is kinda like banging on a  screwdriver with a hammer to chisel out some wood; it works, but a chisel would do a much better job. </p>
      <p>InDesign does have an export to jpeg function, but it’s not very robust: I haven’t found any way to make the export anything other than 72 dpi. If I need a bitmapped version of something I’ve done in InDy, I usually export it as a pdf, then I open the pdf with Photoshop. That way I get much more flexibility.</p>
      <p>Illustrator does OT, and has stronger jpeg export functionality. (I think it’s cheaper than InDy, too.) Depending on what you are intending to create, it might be something to look into.</p>
      <p>Jay</p>
