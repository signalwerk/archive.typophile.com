    html: |-
      <p>Like it or not, you can also do this very easily in PowerPoint, which allows you a variety of ways of looking at page thumbnails.</p>
      <p>For the magazine layouts at work we have sheets of paper with post-it notes citing article titles. These are in plastic sheet protectors in a binder. The page protectors have numbers on them in marker and we just shuffle the contents around between the protectors until we get an structure we like. You don't really need the sheet protectors (you could write the page numbers on the paper), but it keeps the post it notes safe when moving it around.</p>
