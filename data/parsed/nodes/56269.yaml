  html: <p>I have a client that needs to be able to visualize a pagination and shuffle things around for a multi-page publication. ONLY page numbers and page titles. It has to be extremely easy to use. Can anyone recommend a solution for this? I'd think it could be done in MS Word. But i get greatly frustrated with that program within minutes of opening it.</p>
