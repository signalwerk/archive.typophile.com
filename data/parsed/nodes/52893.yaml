      <p>I like the direction this is going in, but a lot of letter combinations need work.  </p>
      <p>td, tg, te, rc are slightly off.  </p>
      <p>kt, av, rv, dw and similar combinations need custom ligatures, but I'm sure you know that. </p>
      <p>sw, rv and rp look great. </p>
      <p>I think the uppercase M is wrong... shouldn't be squashed. </p>
      <p>-matt</p>
