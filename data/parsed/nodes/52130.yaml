  html: |-
    <p>one of the perks of working where i do is that behind me sits a lady who is responsible for maintaining a music library for the salvos.</p>
    <p>when she gets multiple copies of songs and other materials, she often needs to throw them out because of space... well... when i found this out i asked her if it would be possible to pass them along to me. so i'm often getting beautiful old music books and others odd pieces of paper.</p>
    <p>here is a couple of things i recently acquired, and i think they are beautiful.</p>
    <p>first the front of a page titled 'Famous Cornet Solos'</p>
    <p>does anybody know what the sans used could be?</p>
    <p>second is from the back of that page - it looks like a beautiful piece of penmanship, but i'm unsure.</p>
    <p>thanks for listening</p>
    <p>byebye - sye :)</p>
