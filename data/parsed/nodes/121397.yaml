    votes: null
    html: |-
      <div class="comment-spam-body"><p>Thanks to both of you. I had forgotten about Cabarga Cursiva. It really does have somewhat of the flavor. The other fonts are also interesting.<br>
      It occurred to me that this type of cursive lettering has some similarity to the angular cursive style of handwriting that was taught in German schools as  Kurrentschrift <a href="http://en.wikipedia.org/wiki/Kurrent" title="http://en.wikipedia.org/wiki/Kurrent">http://en.wikipedia.org/wiki/Kurrent</a><br>
      But Kurrent lacks the thick and thin character and is less regular.<br>
      I wonder if there are any more fonts in the Cabarga Cursiva genre?<br>
      Don</p>
      </div>
