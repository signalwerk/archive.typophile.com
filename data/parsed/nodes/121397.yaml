      <p>Thanks for the BB&amp;S 1907 ref to Lining Jewel Script. The lowercase really has some similarity. Also the Cincinnati 1882 Script Text.<br>
      BB&amp;S was a notorious font imitator, so I expect that digging through the competition might turn up more that are similar.<br>
      Big problem with the pre WW I font specimen books is that all one gets is a few phrases of the font in use rather than a character set. Tantalizing but not fulfilling.<br>
      Your research shows that this general idea was a font genre at least as far back as the 1880s. So digging might indeed be productive.<br>
      Don</p>
