    html: <p>Have you done your usual thrawl of exciting old type specimens? I'm by no means as much of an expert as you, but just leafing through some fairly random online material, the Lining Jewel Script <a class="freelinking external" href="http://archive.org/stream/bookoftypespecim00barnrich#page/586/mode/2up" rel="nofollow">here</a> is an extremely angular formal script, as is the Four-Line Pica Script Text <a class="freelinking external" href="http://archive.org/stream/fifteenthbookofs00cincrich#page/56/mode/2up" rel="nofollow">here</a>.</p>
