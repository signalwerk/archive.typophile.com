    <p>Here is the famous Deutsche Grammophon yellow logo with the crown of tulips, designed by Siemens advertising consultant Hans Domizlaff in 1949 or shortly thereafter, who perhaps also did the script. <img src="/sites/default/files/old-images/DeutscheGrammophon2Detail_6608.jpg"> The complete logo is attached.<br>
    I know it's hand-lettered and not produced directly from a font. The repeating _e_ and _o_ are not identical.<br>
    But what font or fonts might have inspired the lettering?<br>
    And what fonts since then have this distinctive angular formal style?<br>
    Very interested in your ideas. Thanks.<br>
    Don</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/DeutscheGrammophon2.jpg" width="1060" height="620" alt="">
