    <div class="node-spam-content"><p>Here is the famous Deutsche Grammophon yellow logo with the crown of tulips, designed by Siemens advertising consultant Hans Domizlaff in 1949 or shortly thereafter, who perhaps also did the script. </p><div class="imageWrap"><img src="http://typophile.com/files/DeutscheGrammophon2Detail_6608.jpg"></div> The complete logo is attached.<br>
    I know it's hand-lettered and not produced directly from a font. The repeating _e_ and _o_ are not identical.<br>
    But what font or fonts might have inspired the lettering?<br>
    And what fonts since then have this distinctive angular formal style?<br>
    Very interested in your ideas. Thanks.<br>
    Don<p></p>
