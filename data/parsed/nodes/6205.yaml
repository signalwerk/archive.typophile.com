    html: <p>Thanks Randy.  <br> <br>I really couldn't find anything negative within your advice.  <br> <br>I work alone and sometimes lose sight of whats before me. But now I actually feel motivated and want to finish this font. Thank you... Your insight is great and valuable.</p>
