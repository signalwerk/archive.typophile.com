    html: "<p>Hi John. <br> <br>I think many of your characters contribute to setting up a good rythm in this font: the a,b,c,d,e,g,h,i,j,l,m,n,o,p,q,r, and u. OK, maybe it would have been easier to point out the ones that are breaking the rythm, but I'm trying to keep it positive :-) I like the diagonal terminals very much (f,g,j,r etc). <br> <br>As for advice, let me start by saying in a heavy condensed face you are going to have \"holes.\"  Here the f and r are glaring. Consider extending the crossbar on the f. <br> <br>Also consider bringing the crossbar on the f and t to the same diagonal as your terminals. <br> <br>As mentioned before some characters arent following your rythm: k,s,and x (v &amp; w?) Some suggestions on how to bring them in. <br> <br>k. consider echoing the feel of the h. Give it that vertical feel. <br> <br>s. consider extending the terminals. Also the diagonal spine feels out of place. I think either take it up in weight (to visually match the verticals), or really take it down in weight (to match the horizontals, maybe even make it horizontal - like the e). <br> <br>If you keep the v and w the same, take some weight out ie taper the stems to create more white space (particularly the bottom of the w. <br> <br>x. condense it up. Echo the vertival? The n and u sitting piggyback? or just condense it. <br> <br>Hope that wasn't too much negative. A as mentioned almost all of the characters are working. I'm sure my type-o-terminology is all wonky. Just some suggestions... off to a great start. <br> <br>Good Luck! <br>Randy</p>"
    html_clean: "<p>Hi John. <br> <br>I think many of your characters contribute to setting up a good rythm in this font: the a,b,c,d,e,g,h,i,j,l,m,n,o,p,q,r, and u. OK, maybe it would have been easier to point out the ones that are breaking the rythm, but I'm trying to keep it positive :-) I like the diagonal terminals very much (f,g,j,r etc). <br> <br>As for advice, let me start by saying in a heavy condensed face you are going to have \"holes.\"  Here the f and r are glaring. Consider extending the crossbar on the f. <br> <br>Also consider bringing the crossbar on the f and t to the same diagonal as your terminals. <br> <br>As mentioned before some characters arent following your rythm: k,s,and x (v &amp; w?) Some suggestions on how to bring them in. <br> <br>k. consider echoing the feel of the h. Give it that vertical feel. <br> <br>s. consider extending the terminals. Also the diagonal spine feels out of place. I think either take it up in weight (to visually match the verticals), or really take it down in weight (to match the horizontals, maybe even make it horizontal - like the e). <br> <br>If you keep the v and w the same, take some weight out ie taper the stems to create more white space (particularly the bottom of the w. <br> <br>x. condense it up. Echo the vertival? The n and u sitting piggyback? or just condense it. <br> <br>Hope that wasn't too much negative. A as mentioned almost all of the characters are working. I'm sure my type-o-terminology is all wonky. Just some suggestions... off to a great start. <br> <br>Good Luck! <br>Randy</p>"
