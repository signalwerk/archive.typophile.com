    <p>A friend of mine, a professional font developer (15+ yrs of experience) is available for freelance and contract work assigments.  </p>
    <p>She can do manual TrueType instruction and PostScript hinting, font digitization, contours optimization, font building and rework, codepage transformations. </p>
    <p>Resume and an overview of past projects are available at:<br>
    <a href="http://flavours.me/fontworks" title="http://flavours.me/fontworks">http://flavours.me/fontworks</a></p>
    <p>Do you think she has a fair chance to build a small practice on this?</p>
