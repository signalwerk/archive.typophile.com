    <p><span class="caps">DIN</span> is short for the German acronym “Deutsches Institut für Normung”, which translates as the German Institute for Standardization. There are various typefaces created by the Institute for road signs, license plates, and other civic uses. Here are a few digital&nbsp;interpretations:</p>
    <p><a href="http://www.adobe.com/type/browser/P/P_176.html"><span class="caps">DIN</span> Schriften</a>, <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a><br>
    Includes <span class="caps">DIN</span> Neuzeit Grotesk (<a href="/node/add/wiki?edit%5Btitle%5D=Wilhelm%20Pischner" title="Create node &quot;Wilhelm Pischner&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wilhelm Pischner</a>), <span class="caps">DIN</span> 1451 Mittelschrift, <span class="caps">DIN</span> 1451&nbsp;Engschrift.</p>
    <p><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=DIN%20MITTEL"><span class="caps">DIN</span> Mittel</a>, <a href="/node/17073" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Elsner+Flake</a></p>
    <p><a href="http://www.identifont.com/find?font=normalise"><span class="caps">MN</span> Normalise <span class="caps">DIN</span></a>, <a href="/node/add/wiki?edit%5Btitle%5D=Mecanorma" title="Create node &quot;Mecanorma&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Mecanorma</a></p>
    <p><a href="http://www.identifont.com/find?font=ITC%20Conduit"><span class="caps">ITC</span> Conduit</a>, <a href="/node/13398" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark van Bronkhorst</a> for <a href="/node/13402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span></a></p>
    <p><a href="/node/32973" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> <span class="caps">DIN</span></a>, <a href="/node/40008" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albert-Jan Pool</a> for <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a></p>
