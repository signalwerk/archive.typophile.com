    <p>DIN is short for the German acronym "Deutsches Institut für Normung", which translates as the German Institute for Standardization. There are various typefaces created by the Institute for road signs, license plates, and other civic uses. Here are a few digital interpretations:</p>
    <p><a href="http://www.adobe.com/type/browser/P/P_176.html" rel="nofollow">DIN Schriften</a>, <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a><br>
    Includes DIN Neuzeit Grotesk (<a href="/wiki/Wilhelm%20Pischner" class="freelinking" rel="nofollow">Wilhelm Pischner</a>), DIN 1451 Mittelschrift, DIN 1451 Engschrift.</p>
    <p><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=DIN%20MITTEL" rel="nofollow">DIN Mittel</a>, <a href="/wiki/Elsner%2BFlake" class="freelinking" rel="nofollow">Elsner+Flake</a></p>
    <p><a href="http://www.identifont.com/find?font=normalise" rel="nofollow">MN Normalise DIN</a>, <a href="/wiki/Mecanorma" class="freelinking" rel="nofollow">Mecanorma</a></p>
    <p><a href="http://www.identifont.com/find?font=ITC%20Conduit" rel="nofollow">ITC Conduit</a>, <a href="/wiki/Mark%20van%20Bronkhorst" class="freelinking" rel="nofollow">Mark van Bronkhorst</a> for <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a></p>
    <p><a href="/wiki/FF%20DIN" class="freelinking" rel="nofollow">FF DIN</a>, <a href="/wiki/Albert-Jan%20Pool" class="freelinking" rel="nofollow">Albert-Jan Pool</a> for <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a></p>
