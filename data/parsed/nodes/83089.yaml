      <p>John is correct. Figuring out what might make sense with the TDC is genuinely complicated. And making these things happen takes a long time. I am not complaining here - just explaining the reality of the pace at which things can move. </p>
      <p>Making an arrangement with SoTA was a kind of low hanging fruit to reach for in the sense that both boards seemed interested in finding a way to do it, and as John points out the purposes of the ORGs and even the events are similar. So I went for the easiest thing first. Also, I am new to this stuff and still learning about it so simple was better to start with.</p>
      <p>I am quite keen to find agreements with all kinds of org groups and business (including the TDC) provided the arrangement is mutually beneficial and satisfying to both groups. I am not the arbiter of this question, and I won't and can't be. I am in a sense just doing a bit of matchmaking. </p>
      <p>I do think more of these arrangements can and should be created and with luck I will be able to announce more in the future. </p>
      <p>In fact if anyone has a suggestion of a benefit they would like to have (or offer) vis a vis ATypI  free to let me know privately or here on this thread as you prefer. This isn't just for organizations but also applies to schools and business'.</p>
      <p>Similarly if you would like to see an arrangement made or can help me to generate one - be in touch!</p>
      <p>And finally, if I have my facts straight, the TDC doesn't send its show for free. Sending the show to ATypI is a service ATypI pays TDC to do. As a result, the sending of the show doesn't make sense as a reason for ATypI to offer TDC members benefits. They are separate issues.</p>
