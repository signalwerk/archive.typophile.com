    <p>ATypI and SoTA (TypeCon) will be offering each others members a 15% discount on conference fees*. </p>
    <p>Both organizations are very pleased to offer this new benefit their members. </p>
    <p>Members will receive an email telling them how to take advantage of this offer soon. </p>
    <p>If you are not a member of ATypI or SoTA you may want to join or re-join now to take advantage of this new benefit. </p>
    <p>ATypI and SoTA hope that this discount will further promote relationships, dialog and education about type and typography. </p>
    <p>*Note: The 15% discount applies to conference registration, but not to individual classes, hotels or airfare etc.</p>
