      <p>James, I'm sure Eben -- who is looking after member benefits for ATypI -- would be happy to discuss a reciprocal arrangement with the TDC. I don't think it's lame to have <em>begun</em> by seeking an agreement with an organisation whose event is most similar in terms of structure, frequency, etc..</p>
      <p>The TDC organises many more events than either ATypI or SOTA, and also has a regular publishing programme, so I can imagine that finding a mutually fair reciprocity might involve more careful examination that would have been necessary for ATypI and SOTA, who basically have the same sort of thing to offer each other's members.</p>
