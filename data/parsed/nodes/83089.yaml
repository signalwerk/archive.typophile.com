      <p>Just to clarify, ATypI and TDC both have major costs in putting on the TDC display at ATypI. ATypI pays for the mounting of the show, and for the space for the show, and gives free admission to two people to the whole ATypI conference. TDC pays for shipping the stuff to the conference location, and travel costs for the two people who put it all together. The ATypI part typically amounts to $4000+ in direct expenses, plus about $2000 worth of free conference admission (~ $500 of that being hard costs). I expect the TDC's costs are similar, though I haven't asked.</p>
      <p>I think all parties benefit from it as well. The ATypI conference attendees get to see a fabulous showing of typography and type design. The TDC is promoted to the ATypI conference attendees, and these sorts of showings of the honorees help justify the submission fees for the contests (which in turn presumably fund the TDC's costs in doing the showing).</p>
      <p>So, nobody is getting something for nothing, and everybody benefits.</p>
      <p>I don't think I am speaking too far out of turn to say that even prior to this thread, we began talking with the good folks at the TDC. We're still wrestling with the rather different kinds of events involved, so it is TBD whether we will come up with a mutually agreeable solution.</p>
      <p>Regards,</p>
      <p>Thomas<br>
      (ATypI treasurer)</p>
