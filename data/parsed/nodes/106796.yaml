    html: "<p>Nice idea! I think you need to work on the execution a bit, the colours clearly, but also lots of elements not really lining up, and little inconsistencies in the construction: the two different s constructions, the detached r, the fact that on most letters the instroke is behind the outstroke, but not on the first p, which frankly gives me an escherian headache trying to figure out its twisted 3d construction. (Actually, that's not the only letter than feels internally twisted. Have alook on the other p too. and, as you mention, the i.)</p>"
