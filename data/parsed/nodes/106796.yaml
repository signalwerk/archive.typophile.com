  - id: 565753
    user: 70779
    date: 2013-10-16T11:20:00
    date_raw: 16 Oct 2013 — 11:20am
    votes: null
    html: <p>Thanks for your detailed feedback, Birdseeding. Funny because all the things you mentioned, with the exception of instroke/outstroke inconsistencies, were intentional on my part. Mostly in the name of variation, i.e. I didnt want the two p's to look exactly the same, detached r to make it look more handwritten, etc. But perhaps I should reconsider some of these elements if they take away from the design. I definitely don't want to be responsible for any Escherian headaches!</p>
