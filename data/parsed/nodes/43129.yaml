    html: |-
      <p>Tomtype, I recommend sitting down for an hour or two at a time and mixing and matching faces. You'll learn what works and what doesn't, and out of that, you'll find matches that you can and will depend on for the rest of your career. Sure, you'll keep finding new ones, but you'll find the combinations that work particularly well, and they'll be part of your stable. </p>
      <p>I'd start with one typeface, like you have for this client, and just work with some that seem to go with it. Practice with the two of them to learn how the subtleties work together, then refine your choices based on what works best. You'll probably find two or three that work well with your "control" face.</p>
      <p>And, of course, when you see a good combo used elsewhere, find out what the faces are.   </p>
      <p>To me, it's a lot of fun, but my wife doesn't like it so much as a theme for a date.</p>
