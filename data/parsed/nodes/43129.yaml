    html: <p>Design texts make people way too paranoid about font matching. As long as the proportions aren’t noticeably different for type being used on the same line, what really matters is that the fonts look good together. Using fonts that clash can be a fabulous way to build a hierarchy. I just did an organizational press kit that Pill Gothic for text and a mix of Pill Gothic Condensed and New Baskerville italics for headlines. The distinctiveness gets pretty wild in places, and it’s all kinds of fun to work with.</p>
