    html: |-
      <p>1.) Compare the height and weight of the letters, particularly if you are using an ital. from one font and a reg. from another.</p>
      <p>2.) Match the historic period, or at least look for influences between.</p>
      <p>3.) Similarity of letter shapes, particularly common letters like the <cite>a</cite> and <cite>e</cite>, can create a sense of harmony.</p>
      <p>4.) Consider first the options designed by the same person.</p>
