    <p>What methods do you use in matching different fonts to make sure they work well together?</p>
    <p>For example, I am designing a website for a medical consulting firm.  They already have a logo using Kuenstler 480 Bold.  So I am looking for another font to use for the headings and pictures of the site.  I want the font to be friendly and professional fitting a medical website.  I also would like it go work well with the logo which is very prominent.  How do you approach this?  Thank you.</p>
