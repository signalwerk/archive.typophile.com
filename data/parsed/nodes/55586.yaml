      <p>Thank you. As I said, Karsten Lücke is in favor of the option you suggest, but I'm not the number one supporter of excessively automated things, since they tend to compensate a lack of professional skills which you should acquire to lay out a page, no matter if you see it as a "graphic designer", graffiti artist, stonecarver or plain street guy.<br>
      I already have conceptual sets, but when it comes to single glyphs I think the ability to access them relies also on how good is your layout software (and interface).</p>
      <p>So I'd like to hear the procedures of others to see how they behave when there is a single (or few) alternate glyphs which by no means represent a stylistic set, but just a viable alternate form.</p>
