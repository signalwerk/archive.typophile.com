      <p>Hi Adam, thanks for the very clear explanation. For now I will keep my Set names as mere comment tags.</p>
      <p>I keep calling FontLab simply FontLab, since "Studio" evokes confusion in my mind, as it was my beloved FontStudio (from Ares/Letraset), the program I used before FontLab.<br>
      Yes, of course I'm using FontLab 5.0.4, and I can't wait for version 6. :=)</p>
      <p>On the [a] issue: seriously, I can't understand what you don't understand: [a] and [à] are not "glyphs in a rleationship", but the same glyph. The fact they use different Unicode values is probable to make them more easily accessible, but an accent or diacritic does not make a letter turn into another letter.<br>
      The relationship within Sets should be somehow intrinsecal, and defined by a principle, be it historical, experimental, cultural, or others. I agree it doesn't need to be a full-range substitution: even a few letters can result in enough context for a Set.</p>
      <p>A classic example could be the Italic Set Karsten embedded in Litteratra: here the Italic (which is, in fact, a style more used than others) is treated within the typeface instead of outside.<br>
      Some people tend to prefer the opposite approach: OpenType or not, styles are considered better accessed as separate font files as it was previously, only with the benefit of Unicode full-range support.</p>
      <p>Examples of a more experimental nature could be the four Set variants Nick Shinn has included in Duffy, which they cover all the alphabetic range, and cultural examples may be what House Industries has done with a recent script family which addresses different styles of Latin lettering sourced from varied context of countries and cultural zones.</p>
