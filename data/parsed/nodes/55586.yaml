      <p>Adam, <em>a</em> and <em>á</em> -- and <em>à â ã ä å</em> etc. -- do not form a stylistic set because they are a single letterform with different marks. That they are also separate characters in Unicode and <em>may</em> be rendered using separate glyphs is simply a technical accident. In terms of the stylistic change it is a single substitution: this letterform <em>a</em> to a different form of the same letter.</p>
      <p><em>Now let’s take the following characters:<br>
      ñ h ń ȷ m ɲ j ŋ<br>
      Which of those characters are “the same letter as n” and which are not, and why?</em></p>
      <p>ñ ń are the same letter</p>
      <p>h ȷ m ɲ j ŋ are different letters</p>
      <p>Let me put it this way: if the relationship between two letterforms is one of <em>identity</em> -- they are identical (not necessarily in the sense of having identical outlines, but of being clearly recognisable as the same form of the same letter) -- then a single stylistic substitution is being performed. If the relationship between two letterforms is that of difference but with some similar features and those features are changed in the same way by the substitution, then you have a set substitution.</p>
