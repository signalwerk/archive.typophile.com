      <p>Adam, read what I wrote in response to your first set of ‘is this the same letter as this?’ questions. Also note that I used the term letterforms, since a letter is an orthographic concept: the same diacritic might be considered a letter in one alphabet but not in another. The term letterform clarifies that we're talking about shapes and the effect of variant substitutions on shapes.</p>
      <p>So, once again: If the letterform-part of a diacritic is identical to the base letterform and to other diacritic forms of that letterform, and therefore consistently follows the same stylistic variation patterns, then the mapping of that letterform to a variant form is a single substitution, not a set substitution. Nowhere did I say that this was a matter of spatial separation of ink: it is a matter of whether there are corresponding letterforms and whether (see last paragraph below) the designer wants those corresponding letterforms to be affected in the same way by the substitution.</p>
      <p>Remember, I am making these points in light of the upcoming registration of one hundred new features for character variation, and trying to come up with a distinction that will guide developers in deciding what to include in those features and what to include in the stylistic set features. This is a separate issue from whether it is ‘kosher’ for someone to put <em>a à á â ã ä å</em> into a stylistic set feature today. In the future, we are going to have distinct features for distinct purposes, and we need to determine what kind of substitutions belong with which features.</p>
      <p>Let's come at this from the other side of the future: let's suppose that the character variant features are registered, published and supported. Now, should the substitution that maps double-storey <em>a à á â ã ä å</em> -- and also <em>ā ă ą ǻ ȁ ȃ ȧ</em> and any precomposed-glyph representations of <em>a</em> plus combining mark -- to corresponding single-storey <em>a</em> variants but put into a character variant feature? Or into a stylistic set feature? Remember, the substitution only affects the <em>a</em> letterform (consider that we're dealing with a typeface like Helvetica in which the lowercase <em>g</em> is already single-storey, so there is no multi-letterform set to be formed, just this one lowercase character and its diacritic forms).</p>
      <p>It seems completely obvious to me that this is a single character variant feature substitution, changing the appearance of a single letterform. And this is the only basis on which it is sensible to make the distinction between the purpose of the character variant features and that of the stylistic set features.</p>
      <p>Now, as Thomas indicates, what matters in the development of a specific font, is what the maker wants to happen when features are applied. And it is this desire that determines what letterforms and diacritics should be grouped within a single character variant feature. So your question about whether <em>a</em> and <em>ą</em> are the same letter is the wrong question: the right question is whether the font maker want <em>ą</em> to change in the same way as <em>a</em> when a particular character variant feature is applied. But what I think is obvious is that the choice is between whether to put both substitution in one character variant feature or in separate character variant features, and not whether the substitutions belong in stylistic set features. If the character variant features are to have a meaningful distinct purpose, then variations that only affect single letterforms must not be treated as stylistic set substitutions; otherwise, you will have a permanent grey-area between stylistic sets and character variants.</p>
