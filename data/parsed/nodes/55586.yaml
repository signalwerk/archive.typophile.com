      <p>Charles, I think you are right practically that the 0 comes in the middle of other figures, and so is not confusing. The same argument applies to the 1, though, so in theory editors should not be bothered by the small cap 'I' style. </p>
      <p>As to the O being confused with the o, I'd have to check, but IIRC originally they made the 012 exactly at x-height, not bigger as we do now, so then it was more of a problem. Here in Georgia you don't notice any problem.  But when the year 2010 comes, maybe true old style will look better?</p>
      <p>By the way, I suspect hinting makes the 0 and o of Georgia look more different in size here on the screen than they do in print.</p>
