      <p>Claudio, </p>
      <p>“lslash” was a name given to the glyph by Adobe. An American company. Why? Because they needed to give some glyphs some names, for technological reasons. </p>
      <p>"ł" in Polish represents a sound that is pretty identical to the English "w", i.e. a labial consonant that sounds like a short "u" (not really very similar to "l"). I.e. the Polish "lot" sounds more-less like the English "lot" but the Polish "łot" sounds pretty much like the English "what". </p>
      <p>It is futile to assume that letters have some universal similarity in regard to the sounds that they represent. </p>
      <p>In Polish, the letter "w" stands for the same sound that in English is written "v", while the letter "ł" stands for the same sound that in English is written "w". In German, the letters "w" and "v" stand for the same sound but in English they represent two very different sounds. In German, the letter "e" represents some vowels of which some are similar to what this letter represents in English (e.g. in English "error") but is radically different from what it stands for in some other English words (e.g. "erase"). </p>
      <p>In Polish and in German, the letter "c" represents a sound that in English can be written as "ts" or "tz", and in German as "z", while in English, the letter "c" represents sounds that in German or in Polish can be written using "k" or "ss"/"ß". In German, the letter "s" is mostly used to write a sound that in English and in Polish is written as "z". Etc. </p>
      <p>The diacritic marks have been introduced in many languages (Romance, Germanic and Slavic) because the Latin alphabet had enough letters to represent the sounds found in the Latin language but was definitely not sufficient to represent all sounds found in those languages. </p>
      <p>Other alphabets used a different path. For example in Slavic languages using the Cyrillic script (e.g. Russian), the completely distinct and graphically unrelated letters с, ш, з, ж represent sounds that in Slavic languages that use the Latin script are written using Latin letters with or without diacritic marks (in Czech respectively s, š, z, ž) or digraphs (in Polish respectively s, sz, z, rz/ż), and other European languages use yet different letters to represent the same sounds (in French respectively, s, ch, z, j; in German respectively ß, sch, s, — and the last one does not have any representation at all). </p>
      <p>In short, using phonetics as a means to make assumptions about relationships between letterforms is a dead end. </p>
      <p>Best,<br>
      Adam</p>
