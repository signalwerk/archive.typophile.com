      <p>In my experience typesetting things with alternate glyphs I found it incredibly useful to be able to access each alternate in separate stylistic sets. So your t.alt would go in Stylistic Set 1, a Q.alt in Stylistic Set 2, etc.</p>
      <p>This allows for someone to easily select a block of text and toggle each alternate individually. You should do it this way, unless there's a conceptual reason to group things together in a single feature. Or unless someone with actual technical knowledge of proper opentype etiquette wants to weight in.</p>
