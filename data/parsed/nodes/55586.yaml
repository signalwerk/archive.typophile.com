      <p>That's a fairly common strategy -- if you are using AFDKO tools are providing for doing this using a GlyphOrderAndAliasDB file. </p>
      <p>Within FontLab, you can also edit your standard.nam file to include your preferred names prefixed with an exclamation mark. FontLab will then correctly assign unicode values based on those names but, when asked to generate names from unicode values will use the more standard ones. Unfortunately, this solution isn't really viable if you are using lots of alternate glyphs since it will only rename glyphs which are mapped to unicode values.</p>
      <p>André</p>
