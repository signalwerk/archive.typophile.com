      <p><em>I ask because I have never used other applications than InDesign and basic Apple apps, and I can’t figure out precisely how the three [b] variants are accessed in this way.</em></p>
      <p>The idea behind OT one-to-one-of-many enumerated substitutions is that an application could provide a dynamic mini-palette of variants for the user to select from. So, for instance, you would select a character, apply the [salt] feature, and up would pop a little palette showing the variant forms available for that character. This is similar to some of the input method editors for Chinese characters, in which one types a series of phonetic characters and is presented with a palette of the possible Chinese characters.</p>
      <p>I'm not sure if anyone has actually tried to implement this aspect of OT in a UI. Perhaps Apple? It would adapt perhaps more easily to their approach to typographic feature menus than to some others.</p>
