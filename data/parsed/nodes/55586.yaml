      <p>@William: You can put them in a font. Adobe has not made any statements about when they'll be supported in applications.</p>
      <p>@John et aliae: The new character variants are a fine thing in principle. The problem is they require significant UI to work at all, and this means they'll probably never be supported by MS Office or Adobe Creative Suite. At least, "not in the foreseeable future," if "never" is too strong a word. </p>
      <p>The problems with 'salt' for this purpose are (1) that it can't be easily applied globally across text for a specific affects, and (2) it doesn't easily do a consistent affect even for a base letter plus its accented variants, or for both the tabular and proportional versions of a number. (There are few basic English letters that don't have accented forms in a reasonably large multi-lingual font.)</p>
      <p>I don't have a good solution, really. My personal fallback as a type designer and font developer would be to use stylistic sets for now, while badgering Microsoft and Adobe. But I don't hold out much hope on that latter front. Plus, there's a tragedy of the commons issue: we'd all be best served by getting apps to support the character variants feature, but we'd most effectively pressure the app/OS people by building lots of fonts that use that feature... yet we'd be doing the best thing for ourselves in the short term by ignoring the feature in favor of stylistic sets. Ouch.</p>
      <p>Cheers,</p>
      <p>T</p>
