      <p>And should you feel experimental, here's some ideas for you: </p>
      <p><code>feature ss01 {<br>
      sub a by a.ss01;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      sub a.ss01 by a.ss02;<br>
      sub b by b.ss02;<br>
      } ss02;</code></p>
      <p><code>feature ss03 {<br>
      sub a.ss02 by a.ss03;<br>
      sub b.ss01 by b.ss03;<br>
      sub c by c.ss03;<br>
      } ss03; </code></p>
      <p>When <code>ss01</code> is enabled, <code>a</code> will be replaced by <code>a.ss01</code>. </p>
      <p>When <code>ss02</code> is enabled, <code>b</code> will be replaced by <code>b.ss02</code>. </p>
      <p>But if <code>ss01</code> and <code>ss02</code> are enabled at the same time, <code>b</code> will be replaced by <code>b.ss02</code> but <code>a</code> will be replaced by <code>a.ss02</code> rather than by <code>a.ss01</code>. </p>
      <p>In other words, you can design your stylistic sets so that something happens on ss01, something else happens on ss02 and something yet different happens on ss01+ss02. </p>
      <p><code>feature ss01 {<br>
      sub a by a.ss01;<br>
      sub d by d.ss01;<br>
      sub g by g.ss01;<br>
      } ss01;</code></p>
      <p><code>feature ss02 {<br>
      sub b by b.ss02;<br>
      sub e by e.ss02;<br>
      sub s by s.ss02;<br>
      } ss02;</code></p>
      <p><code>feature ss03 {<br>
      sub c by c.ss03;<br>
      sub f by f.ss03;<br>
      sub w by w.ss03;<br>
      } ss03; </code></p>
      <p><code>feature calt {<br>
        sub [a.ss01-z.ss01] [a-z]' by [a.ss01-z.ss01];<br>
        sub [a.ss02-z.ss02] [a-z]' by [a.ss02-z.ss02];<br>
        sub [a.ss03-z.ss03] [a-z]' by [a.ss03-z.ss03];<br>
      } calt;</code></p>
      <p>Doesn't make so much sense by itself but illustrates the idea that the stylistic sets by themselves can perform some actions but they can also trigger different behaviors of, say, the "contextual alternates" feature, so in essence, you could have different "branches" of contextual behaviors implemented that way. </p>
      <p>BTW, you can even implement separate contextual behaviors within each ssXX feature. The ssXX features do not have to be simple "a by a.1, b by b.1" substitutions.  </p>
      <p>Regards,<br>
      Adam</p>
