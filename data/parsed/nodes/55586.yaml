      <p>Adam: <em>But in Adobe InDesign, the user interface treats them as additive, so the user can enable ss01 and ss04, for example, at the same time. And there have been more and more fonts that make use of this notion. I myself am a proponent of that approach as well — or at least, of the notion that it should be up to the type designer to choose whichever method works for him best.</em></p>
      <p>I agree with the sentiment of allowing the type designer to choose whether the ssXX features should be additive or exclusive, but I can't figure out how to make them truly exclusive within the InDesign UI model. One can make the lookups map variants from all sets to the specific stylistic set variants, but the order of the lookups still means that if more than one feature is turned on the later-processed lookups will override the earlier ones, regardless of the order in which the user has turned the features on. So, presuming lookup order follows feature order, if the user turns on stylistic set 7 in the InDesign UI, and then turns on stylistic set 4, the stylistic set 7 glyphs will still display, because that lookup is processed after the stylistic set 4 lookups.</p>
      <p>So the user, not the type designer, is ultimately responsible for making the sets exclusive through selection of only one feature at a time.<br>
      ___</p>
      <p>Regarding use of stylistic set features to implement changes to single glyphs, rather than to sets of glyphs such as alphabet subsets: this is not what I had in mind when I defined the stylistic set features, and this is also why there are only twenty such sets. If one wanted to use stylistic sets to mix and match different variants of individual glyphs one would quickly run out of features.</p>
      <p>Peter Constable at MS, working with his former colleagues at SIL, have been working on a feature spec for a hundred character variant features.</p>
