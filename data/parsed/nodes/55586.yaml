      <p>&gt; so ss20 has the highest priority, then ss19, and so on.</p>
      <p>Quadibloc, </p>
      <p>You're wrong. The priority between different user-controlled OpenType Layout features is determined by the order of the lookups in the font. In one font, you can have "liga" to have higher priority than "smcp", and "ss01" have a higher priority than "ss20", and in another font this can be exactly the other way around. If features use multiple lookups, then those can interweave: one lookup from the "ss01" feature is processed, then a lookup from "ss20", then again one from "ss01". </p>
      <p>There is no "canonical order" for any of the user-controllable features in the OpenType spec. It is the font developer who decides on the priorities within a font. The rule is, that some features (ccmp, locl) are applied before the script shaping, then the script shaping features are applied (this is done differently for each script, and each script shaping engine automatically picks the appropriate features), and then finally, the user-controllable features enabled by the user are applied in the order of the lookups defined in the font.</p>
