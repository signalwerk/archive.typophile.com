      <p>As I understand it, a stylistic set is a set of alternate glyphs that changes the appearance of a typeface when they are used. I don't see any logical reason why such a set could not consist of a single glyph (possibly including its related variants such as accented forms) as long as it changes the appearance of the typeface when it is used. The fact that there are only twenty possible sets does not necessarily have a bearing on this issue, unless you have more than twenty alternate glyphs that you want to use in this way.</p>
