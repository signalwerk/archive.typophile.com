      <p>Adam, read my lengthy reply to Mark Simonson. I don't have a quantitative minimum for a stylistic set. The set is a concept, the contents of which are recognisable by their relationships. Since a single glyph possesses no such relationships, it doesn't meet the definition of a set, and I believe that using the stylistic set features for this purpose is a hack response to the lack of a viable alternative feature and UI.</p>
      <p>Thomas: <em>The new character variants are a fine thing in principle. The problem is they require significant UI to work at all, and this means they’ll probably never be supported...</em></p>
      <p>But this is also true of any extension to the existing twenty stylistic set features (especially if one wants to take advantage of human-friendly name strings), and those have already been demonstrated to be insufficient for single character substitutions. Any advance on the present position will require significant UI, and this may well mean that it doesn't happen, or happens only slowly. But in that case why not spec it the right way? At least we'd be pretty much guaranteed that it will be supported in XeTeX. :)</p>
      <p><em>yet we’d be doing the best thing for ourselves in the short term by ignoring the feature in favor of stylistic sets.</em></p>
      <p>For those who want short-term and possibly partial support for character variants via the stylistic set features, there's nothing to stop them implementing substitutions in both those features and the new character variant features. It isn't an either/or situation.<br>
      ___</p>
      <p>Of course, another approach to this whole issue would be to start defining Variant Selector sequences for common character variant forms and propose them to Unicode. That solution would have the benefits of standardisation and interoperability.</p>
