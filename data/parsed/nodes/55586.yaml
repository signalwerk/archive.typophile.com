      <p>Charles mentioned phonology; and that's another area where Unicode chose to describe form, rather than function (at least in some cases).</p>
      <p>Take the phoneme 'ɔ'. Its phonological name is "open o", and, as it happens, Unicode also calls it that. But another one, the phoneme 'ʌ', is a variant of 'a' and goes by the ungainly name of "open mid-back unrounded vowel". Unicode calls this one a "small letter turned v", although it has nothing to do <em>at all</em> with the letter 'v' -- its shape has been derived from a small caps 'A' without the crossbar.</p>
      <p>--</p>
      <p>Theoretically, it's <em>possible</em> to assign a couple of different names to each of the Unicode characters. But I think they are trying to avoid that, so the confusion of 'what name describes what character' doesn't get any more complicated than it already is.</p>
