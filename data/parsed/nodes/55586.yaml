      <p>The fact that certain sounds in a language are written with an "old letter" that comes from the original Latin alphabet, or a "newer letter" of the Latin alphabet (K, W, Z), a newly-designed letter which does not resemble any of the existing ones, a digraph (two letters), or an "old" letter with some added graphical mark — this does not influence the fact whether that given graphical sign is a "real letter" or not. Those are all real letters, and they're equally important. </p>
      <p>Every language uses a different set of letters. In a way, the difference between L and Ł is the same kind as the difference between E and F. Or between A and Ä. Different letters, they just share some common graphical elements, and differ on others. </p>
      <p>The naming of glyphs, or the naming of letters in the Unicode Standard is just a sketchy convention that allows us to communicate about the graphical forms, and is usually based on the English language. In Polish, nobody calls Ł a "letter L with stroke" or "Lslash" or whatever. People just call it Ł (in English, the name could be represented, in a simplified way, as "ehw" or "ehoh"). </p>
      <p>Cheers,<br>
      Adam</p>
