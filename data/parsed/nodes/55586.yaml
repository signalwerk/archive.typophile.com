      <p>André: <em>[...] I assume you were involved in the conference [....]</em></p>
      <p>All FM conferences so far were organized by DTL, so I was indeed involved in the conference at The Hague. </p>
      <p><em>sub s' @Letters by s.hist; # s.hist = long s</em></p>
      <p>To be honest, I have not seen the other discussion in question, but I can imagine the preservation of the Unicode value of the s for exchangebility reasons (there was also a discussion on the ‘hist’ feature and related ligature stuff on the ATypI list recently, but I did not find time to look at it yet). Glyph variants like <em>s.hist</em> should be left unencoded by definition, of course (otherwise the use of <em>s.hist</em> here instead of <em>longs</em> would not make sense either).</p>
      <p>At the conference Jürgen (Dr. Willrodt) did not discuss this topic specifically. You can watch his talk at <a href="http://river-valley.tv/opentype-status-2009/" rel="nofollow">River Valley TV</a> (around the 20th minute the PDF page in question shows up). I will forward your question to him, by the way.</p>
      <p>As Adam pointed out, using ‘uniXXXX’ entries instead of ‘AGLFN’ names can prevent problems under older Mac OSes. My problem is that working on the features files, character layout files and kerning pairs is not easy with the non-descriptive ‘uniXXXX’ naming, so I made simple AppleScript files that translate (in BBEdit) the entries in forenamed files from ‘AGLFN’ to ‘uniXXXX’ naming and vice-versa.</p>
      <p>FEB</p>
