      <p>What I had in mind when spec'ing the Stylistic Set features, and discussing them with folk at MS and Adobe, were exactly typefaces like Zapfino and Poetica in which there are sets of variants that a) are harmoniously consistent with but distinct from the other sets and b) harmoniously consistent within themselves. If you consider the sets of Poetica letters with formata and corsiva extenders, you have a pretty good idea of what I had in mind. At the time, we had recently worked on the Apple version of Zapfino, and knew that Linotype would want a mechanism to address the variants in an eventual OT version, and that Adobe were facing similar needs for Poetica and perhaps some other designs.</p>
      <p>Of course, the definition of what constitutes a ‘set’ for such purposes is vague or, rather, design-specific. I wouldn't try to assign a minimum a quantity of glyphs, but would try to rationalise sets in terms of consistent variation of related shapes or concepts, e.g. ascenders, descenders, terminals, single- vs double-storey a and g, etc. Obviously, what happens to a base letter may be expected to carry across to diacritic forms of that letter, but these would not necessarily constitute a set to my way of thinking, unless the base letter varied in some unique way that was not applicable to any other letter.</p>
      <p>Some of my colleagues very quickly adapted the stylistic set features to access more finely granulated and additive variation, facilitating easy mixing and matching of variants of individual letters. I can't blame them because there were no similarly useful and widely supported layout features specifically for individual characters. But I knew it would only be a matter of time before the limit of 20 stylistic set features became an issue for such usage, and I'd say that this became a significant problem for some in 2008. For example, SIL are developing fonts for large numbers of languages with fluid orthographic norms and inconsistent interpretation of letter shapes, so they need a mechanism to allow users to mix and match desired forms for individual characters. Critically, the variation in forms is not a consistent stylistic feature applied across related shapes, but fundamental inconsistency in the shape of letters that Unicode considers a single character. They already have defined more than twenty such variations. Another example is that of the very complex OT Arabic font being developed by Idris Samawi Hamid, which requires a mechanism to mix and match multiple stylistic variants of individual letters in a free way. Again, the number of variants exceeds twenty, and are not classifiable as related sets.</p>
      <p>So we're at a point where one of two things needs to happen: either we massively increase the number of registered stylistic set features, and in the process redefine the purpose of those sets and abandon their original intent, or we register new features specifically to address single character variants and maintain a distinction between that functionality and that of set variation. I favour the latter for a couple of reasons, not least because SIL and MS have already come up with a viable feature spec (including, by the way, name string indexing, allowing font developers to link human-friendly menu names to features, e.g. 'Left hook Y' or 'Right hook Y'; a similar mechanism is spec'd to be added to the existing stylistic set features). The other reason is that rather than having a hundred stylistic set features -- with no very obvious way to tell whether an individual feature applies to a set of letters or to an individual letter--, we would have twenty stylistic set features and one hundred character variant features, <em>which a font developer could make interactive.</em></p>
    html_clean: |-
      <p>What I had in mind when spec'ing the Stylistic Set features, and discussing them with folk at MS and Adobe, were exactly typefaces like Zapfino and Poetica in which there are sets of variants that a) are harmoniously consistent with but distinct from the other sets and b) harmoniously consistent within themselves. If you consider the sets of Poetica letters with formata and corsiva extenders, you have a pretty good idea of what I had in mind. At the time, we had recently worked on the Apple version of Zapfino, and knew that Linotype would want a mechanism to address the variants in an eventual OT version, and that Adobe were facing similar needs for Poetica and perhaps some other designs.</p>
      <p>Of course, the definition of what constitutes a ‘set’ for such purposes is vague or, rather, design-specific. I wouldn't try to assign a minimum a quantity of glyphs, but would try to rationalise sets in terms of consistent variation of related shapes or concepts, e.g. ascenders, descenders, terminals, single- vs double-storey a and g, etc. Obviously, what happens to a base letter may be expected to carry across to diacritic forms of that letter, but these would not necessarily constitute a set to my way of thinking, unless the base letter varied in some unique way that was not applicable to any other letter.</p>
      <p>Some of my colleagues very quickly adapted the stylistic set features to access more finely granulated and additive variation, facilitating easy mixing and matching of variants of individual letters. I can't blame them because there were no similarly useful and widely supported layout features specifically for individual characters. But I knew it would only be a matter of time before the limit of 20 stylistic set features became an issue for such usage, and I'd say that this became a significant problem for some in 2008. For example, SIL are developing fonts for large numbers of languages with fluid orthographic norms and inconsistent interpretation of letter shapes, so they need a mechanism to allow users to mix and match desired forms for individual characters. Critically, the variation in forms is not a consistent stylistic feature applied across related shapes, but fundamental inconsistency in the shape of letters that Unicode considers a single character. They already have defined more than twenty such variations. Another example is that of the very complex OT Arabic font being developed by Idris Samawi Hamid, which requires a mechanism to mix and match multiple stylistic variants of individual letters in a free way. Again, the number of variants exceeds twenty, and are not classifiable as related sets.</p>
      <p>So we're at a point where one of two things needs to happen: either we massively increase the number of registered stylistic set features, and in the process redefine the purpose of those sets and abandon their original intent, or we register new features specifically to address single character variants and maintain a distinction between that functionality and that of set variation. I favour the latter for a couple of reasons, not least because SIL and MS have already come up with a viable feature spec (including, by the way, name string indexing, allowing font developers to link human-friendly menu names to features, e.g. 'Left hook Y' or 'Right hook Y'; a similar mechanism is spec'd to be added to the existing stylistic set features). The other reason is that rather than having a hundred stylistic set features -- with no very obvious way to tell whether an individual feature applies to a set of letters or to an individual letter--, we would have twenty stylistic set features and one hundred character variant features, <em>which a font developer could make interactive.</em></p>
