      <p>&gt; So, it should have been called "Ehw", or "Ehoh". A transliteration is surely<br>
      &gt; better than an "Lslash".</p>
      <p>No, it isn't. The same character can be used in different languages and can be pronounced differently. "Z" describes a different sound for Polish and for German, and "Ó" describes a very different sound for Spanish, Czech, and Polish. And what about "Ż" and "Ź" — in Polish, their pronunciation is quote close: clearly distinct to a Polish ear but often not distinguishable to foreigners. There are no effective ways to transliterate this. Letters are letters, graphical marks. We need language to describe them. But every description of a graphical mark is inadequate, just like every description of a sound is inadequate. Yet it's the best we can get in order to communicate using language. </p>
      <p>This is how language works, fundamentally. </p>
      <p>The glyph names were picked in very early PostScript days, decades ago. This also applies to many other glyphs, e.g.: “ (LEFT DOUBLE QUOTATION MARK, quotedblleft) might imply that this quotation mark is to be used on the left side of the quotation. But this is only true for English. In German, this mark is actually the closing quotation mark, to be used on the right side of the quotation. </p>
      <p>Both PostScript glyph names and Unicode character names have a long history, and especially the earliest additions are full of inconsequences. Today, we should just take them as they are. Just DON'T assume that the inventors of these conventions were always right, and your life will be easier. Don't treat these names as something they aren't: full descriptions, of informations about the shape, or the use. Treat them just as names. </p>
      <p>Best,<br>
      Adam</p>
