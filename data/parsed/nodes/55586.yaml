      <p>Originally, when stylistic sets were conceived, the authors of the OpenType specification throught that they should be mutually exclusive. And indeed, in the user interface of Mac OS X (the Typography palette), they are accessible through a series of mutually-exclusive radio buttons. </p>
      <p>But in Adobe InDesign, the user interface treats them as additive, so the user can enable ss01 and ss04, for example, at the same time. And there have been more and more fonts that make use of this notion. I myself am a proponent of that approach as well — or at least, of the notion that it should be up to the type designer to choose whichever method works for him best. </p>
      <p>I guess a sensible principle is: one stylistic set should substitute glyphs that should be substituted together (at the same time). </p>
      <p>Whatever that may mean in practice. In some cases, it may mean that an entire alphabetic range is substituted by one ssXX feature, especially if the type designer thinks that mixing glyphs from different sets does not make much sense. But if your design has an alternative "R", an alternative "K" and alternative "M", and each of those glyphs is in a way independent of the others, so selectively substituting them one by one does make sense design-wise, I would then by all means put them into separate sets. </p>
      <p>As far as salt vs. ssXX is concerned, I've outlined my view here:<br>
      <a href="http://typophile.com/node/17887" title="http://typophile.com/node/17887">http://typophile.com/node/17887</a><br>
      <a href="http://typophile.com/node/32399" title="http://typophile.com/node/32399">http://typophile.com/node/32399</a></p>
      <p>Best,<br>
      Adam</p>
