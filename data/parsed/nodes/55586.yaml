    html: |-
      <p>As primarily a type user, I use the stylistic sets for single glyphs when I want them "on" or "off" always in a text. For example, I usually draw up an alternate old style "1" for fonts where the os "1" looks like a small-cap "I". If I don't, sure as shootin there will be an editor who insists on not using os figs at all, because of that "1." That alternate "1" goes in a stylistic set, which will be on for the whole job; I'll  switch it on in the basic paragraph on which all other paragraphs are based.</p>
      <p>Though it is a set of two, I've also taken to making angle brackets for text fonts. I have a stylistic set where I switch them with the greater and less glyphs. The reason is, many text's have URLs where the author insists on using the form &lt;http&gt; as a part of the reference. So, for the bibliography paragraph style, I'll switch on that set &amp; not think twice. If the text proper has such constructions, you have to search the text &amp; make sure that "greater" and "less" aren't used mathematically. If not, again, I'll switch on the set in the basic paragraph style.</p>
      <p>On the other hand, glyphs intended for occasional use should probably not be a part of a stylistic set, but placed by the compositor by hand. An obvious example would be swash letters, though that's handled by a separate feature.</p>
      <p>For me, it is a matter of how stylistic sets are best used, not "how many" members a set has.</p>
      <p>FWIW</p>
