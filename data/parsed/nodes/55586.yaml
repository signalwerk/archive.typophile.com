    html: |-
      <p>Piccic, </p>
      <p>The rationale is given here:<br>
      <a href="http://typophile.com/node/2994#comment-23796" title="http://typophile.com/node/2994#comment-23796">http://typophile.com/node/2994#comment-23796</a></p>
      <p>With some additional explanations here:<br>
      <a href="http://typophile.com/node/29469#comment-404691" title="http://typophile.com/node/29469#comment-404691">http://typophile.com/node/29469#comment-404691</a></p>
      <p>Glyphnames have been part of PostScript since 1982, long before Unicode was conceived (around 1991). This is why there is a set of glyphnames that have "mnemonic" glyphnames such as "A", "asterisk" or "zero". The "uniXXXX" convention has been introduced in OpenType (1999) after Unicode has become a dominant standard for text and font encoding because it did not make sense to come up with mnemonic glyphnames for all Unicode characters. </p>
      <p>If Unicode existed before PostScript, there would have probably been no glyphnames, Unicode codepoints would be the only identifier. Which would then introduce other problems, such as the inability to include multiple alternate glyphs for one Unicode character. </p>
      <p>You're free to engage into an academic debate about an ideal glyph identification scheme. Such exercises have been done in the past (e.g. Apple's "Zapf" TrueType table), but have not been widely adopted. There is nothing academic about PostScript, Unicode, OpenType, glyph naming or character naming. All these things come from a fairly long technological evolution, and carry a lot of evolutionary weight. </p>
      <p>Admittedly, the PDF-compatible glyph naming scheme may be one of (many) font technology's coccyxes. I think that it does not make much sense to debate whether it is necessary, we should just acknowledge that it's there and move on. </p>
      <p>Best,<br>
      Adam</p>
