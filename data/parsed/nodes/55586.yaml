      <p>I'd say that if "gcommaaccent" only works on Mac OS X 10.5 and 10.6, while "uni0123" works in all Mac OSes dating from 10.3 or probably earlier, there is no reason to ship "gcommaaccent". </p>
      <p>The current STANDARD.NAM and all the encodings that ship with *Fontographer 5* follow the updated naming guidelines, so "gcommaaccent" will be changed to "uni0123" if you choose "Make PDF-compatible naming" in FOG, and -- if you install Fontographer 5 on the same machine as FontLab Studio 5 -- will also work when you choose "Generate Names" from Glyph / Glyph Names in FLS5. </p>
      <p>As I wrote earlier, I recommend installing Fontographer 5 demo if you're using FontLab Studio 5. You'll get updated glyphname-to-Unicode lists and encoding files as well as a set of new "OpenType" encodings ("OpenType Std", "OpenType LatPro", "OpenType LatPro SC", "OpenType LatCyrGrk", "OpenType LatCyrGrk SC", "OpenType LatCyrGrk WGL4" and "OpenType LatCyr Asia"). </p>
      <p>A.</p>
