      <p><em>Are the letters H and Ĥ the same letter?</em> Yes.<br>
      <em>Are the letters H and Ħ the same letter?</em> Probably.<br>
      <em>Are the letters L and Ľ the same letter?</em> Yes.<br>
      <em>Are the letters L and Ł the same letter?</em> Probably.<br>
      <em>Are the letters E and F the same letter?</em> No.<br>
      <em>Are the letters F and Ƒ the same letter?</em> Probably.</p>
      <p>Where I have written yes, it is because the letterform-part of the diacritic is identical and therefore consistently follow the same stylistic variations.</p>
      <p>Where I have written probably, it is because there is an identical relationship between this diacritic and a base letterform in most designs such that a stylistic variant in one would be consistently followed by the same variation in the other; however, in some designs this might not be the case due to idiomatic conventions.</p>
      <p>Where I have written no, it is because there is never a case where these two are considered diacritic forms of the same letterform. They are different letters that share some features in common; hence they are logically put into a stylistic set if stylistic variation modifies these shared features in the same way.</p>
      <p>Here is another way to look at it:</p>
      <p>Imagine all text is subject to Unicode normalisation form D (fully decomposed), and imagine that fonts only use GPOS mark positioning to display diacritic letters. You wouldn't have <em>a à á â ã ä å</em>: you would only have <em>a.</em> Hence, one can say that there is only a single substitution in stylistic variation of that letterform, not a stylistic set.</p>
      <p>On the other hand, if fully decomposed text still makes a distinction, as it obviously does, between <em>E</em> and <em>F</em>, then those are clearly separate letters that, if following the same stylistic variation belong in a set.</p>
      <p>The diacritic letters that do not have canonical decompositions may or may not belong in sets. I argue that if the basic form of the letter is identical to that of another letterform, then they share in a single substitution and not a set substitution. So, for example, a stylistic variation affecting the o-shape in <em>o</em> and <em>ø</em> would be a single substitution, but a variation also affecting <em>œ</em> would be part of a stylistic set substitution.</p>
      <p>I don't claim this is the only way to look at this question, but insofar as the Stylistic Set features were intended not for changes to individual letterforms, this seems to me the best way to draw the distinction between what belongs in such sets and what should be in [salt] if that feature were adequately supported and what should be in the new character variant features when they are approved and, hopefully, supported. And we do need to have a basis for such distinctions if we are going to recommend any sensible use of these similar layout features.</p>
