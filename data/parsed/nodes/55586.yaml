      <p>Thanks all for excellent info!<br>
      This is my attempt to resolve OSF problems with stylistic sets:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/osf_modern_5604.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/OSF_classic_5503.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/roman_num_4519.png"></div><br>
      [vide: <a href="http://typophile.com/node/73413" title="http://typophile.com/node/73413">http://typophile.com/node/73413</a> ]<br>
      ss01 substitutes [one] by [one UC I like: \one.osf.alt]<p></p>
      <p>lookup ss01StyleSet1lookup6 {<br>
        lookupflag 0;<br>
          sub \zero by \zero.osf ;<br>
          sub \one by \one.osf.alt ;<br>
          sub \two by \two.osf ;<br>
          .....<br>
          sub \nine by \nine.osf ;<br>
      } ss01StyleSet1lookup6;</p>
      <p>hope it works...</p>
