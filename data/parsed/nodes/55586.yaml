      <p>I've just come up with a workaround how to rename glyphs (e.g. through Generate Names) including making the changes inside of the OpenType features definitions, completely within FontLab Studio 5, without using any scripts. It's not a superbly polished solution, but it works well. </p>
      <p>1. In Preferences / Opening OpenType &amp; TrueType, enable "Store binary OpenType layout tables".<br>
      2. Generate the .vfb font as .otf or .ttf.<br>
      3. In the .vfb font file, choose Glyph / Glyph Names / Generate Names.<br>
      4. Open the newly-generated .otf, and there, choose Glyph / Glyph Names / Generate Names.<br>
      5. Generate the newly-opened .otf again as .otf, and in the dialog box that appears, choose "Binary".<br>
      6. Close this font and open it again: note that in the OpenType panel and in the Classes panel, the data now uses the new glyph names.<br>
      7. Save the features into a file from the OpenType panel, and save the classes into a file from the Classes panel.<br>
      8. Close this font and go back to the original .vfb file.<br>
      9. Open the newly saved classes and features using the Classes panel and the OpenType panel. </p>
      <p>This way, you'll have the classes and the OpenType feature definitions that use the new glyph names. </p>
      <p>It's not very elegant but it works. </p>
      <p>Best,<br>
      Adam</p>
