      <p>&gt; If I use FontLab to generate the typeface, is there<br>
      &gt; a way to add those names?</p>
      <p>Certainly not if you use FontLab, as this is an ancient product (ceased to exist with version 4.6), and also not if you use FontLab Studio, as the current version 5.0.4 uses Adobe FDK for OpenType (AFDKO) version 1.6 to generate OpenType Layout features. Support for human-readable names for stylistic sets has been added to Adobe FDK for OpenType 2.5, which has been released only six weeks ago. AFDKO 2.5 will be integrated into FontLab Studio 6, and then you'll be able to add human-readable stylistic set names easily. </p>
      <p>&gt; How could you possibly use “human-readable names”<br>
      &gt; for the Sets if most applications will not show them? </p>
      <p>The same way people used Unicode in their fonts in 1996 even though most applications did not support it. At some point, applications caught up. </p>
      <p>There is a chain of things that need to happen: first, you need a certain functionality registered in the specification (which is the case now, with OpenType 1.6), then you need an development tool that allows you to add this functionality (AFDKO 2.5, which will be incorporated into FLS6), then you need some fonts that actually have this functionality included (the OpenType fonts that are yet to be developed), and finally you need some applications that expose that functionality (the developers of those apps need some fonts to test the functionality with, so they won't likely develop the functionality without any test fonts in place). </p>
      <p>Regards,<br>
      Adam</p>
