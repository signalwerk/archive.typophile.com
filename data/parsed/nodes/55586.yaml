      <p>@guifa, who said: <cite>Actually, “1 or 2” in Spanish would be written “1 ó 2” and the accent is placed for precisely this reason.</cite></p>
      <p>Yes, I remembered that this morning. I agree with you, but not completely. As Jorge de Buen says in his <em>Manual de diseño editorial</em> (third edition), the accent would only be applied “In the strange case of a conjunction ‘o’ in risk of being confused with a zero” (p. 417). This would be certainly the case.</p>
      <p>But, if there’s no room for confusion (lining numbers, for example), the accent is pointless.</p>
      <p>Anyway, I think it is better for everyone to design a zero different from the letter o. Someday your font could find a lazy or ignorant editor or graphic designer. Or maybe simply someone that believes that there’s no such confusion. Or a book that changes from lining numbers to oldstyle numbers in the next edition, &amp;c.</p>
      <p>But maybe we are a little far away from the main subject… A new thread?</p>
