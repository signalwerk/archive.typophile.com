    <p>Although I have read about the issue occasionally in a few threads, I am unsure about this question:<br>
    Stylistic sets are ideally created to address a range of glyphs substitution, and I also think it works better to use them for full range substitutions (i.e. Swashed forms, Mediaeval forms, etc.)<br>
    Inversely, I may just wish to have a single alternate glyph, which may allow the user to have – let's say — a more traditional [t] than the one I have decided to be standard.</p>
    <p>In these cases, how do you think it's better to place that simple alternate?<br>
    I know some designers (for example, Karsten), like the idea of using Stylistic Sets as well, even for a single glyph, but I'm not so attracted by this "multiplication of the sets"… :)<br>
    Would it be fine to use [salt], or maybe I could just include the glyph and not address the automatic handling of the substitution?<br>
    After all, in lead we just entered the single alternates manually… :=)</p>
