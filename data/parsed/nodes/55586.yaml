      <p>John, </p>
      <p>so n and ń are "the same letter" in this context we are talking about. Are ȷ and j the same letter? Are a and ą the same letter? Are L and Ł and same letter? </p>
      <p>I guess it would be useful if we could work out some reliable terminology and distinctions in this realm, especially because the conceptual or "ideal" set-up is often not quite the same as the de-facto or technical set-up. The best example may be something like the ogonek: is ą a base letter with a mark or is it a new letter? Technologically, there is no clear answer: some fonts provide an ą as one solid outline, others as a composite glyph consisting of a and the ogonek, and yet others include a solid outline for ą but in addition include OpenType GPOS mark attachment code for dynamic positioning of ogonek under any letter. </p>
      <p>So is your criterion the spatial separation of ink? Is it the fact of touching or overlapping that constitutes identity? Is the glyph's identity a "closed shape"? </p>
      <p>If "á" is "the same" as "a", but "ą" is different from "a", what's with "Å" (where in some typefaces the ring is part of the letter and in others it is a mark)? What's with the semicolon? (Spatial separation of ink). </p>
      <p>In other words: if we agree on a working term of <em>glyph identity</em> to separate it from the font-technological meaning of "glyph" and to denote this certain unique characteristics that makes one glyph differ inherently from another, I gather that your position is, a stylistic set can be formed only if there are two or more glyph identities involved. So now we need a clear agreement on what exactly this glyph identity is :) (And perhaps a different term.)</p>
      <p>A.</p>
