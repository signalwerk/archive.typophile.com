      <p>Theunis de Jong writes:</p>
      <p><cite> Take the phoneme 'ɔ'. Its phonological name is "open o", and, as it happens, Unicode also calls it that. But another one, the phoneme 'ʌ', is a variant of 'a' and goes by the ungainly name of "open mid-back unrounded vowel". Unicode calls this one a "small letter turned v", although it has nothing to do at all with the letter 'v' -- its shape has been derived from a small caps 'A' without the crossbar. </cite></p>
      <p>'Open mid-back unrounded vowel' is a phonetic <em> description </em> of the vowel, but I wouldn't consider that to be its <em> name </em> (the usage I'm most familiar with is simply to call it 'wedge'). Calling it 'turned v', though is rather accurate insofar as that is how it was commonly produced in metal. I don't think that there is any standardised set of names for IPA characters (Pullum and Ladusaw would likely be the closest thing to a standard, but many of the names they use don't reflect colloquial usage among linguists and, like the names adopted by the U.C., tend to be graphic descriptions -- the one which always gets me is 'turned f' to describe [ɟ]).</p>
