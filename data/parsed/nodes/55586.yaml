      <p><cite>Charles, that’s interesting. So it is the old style 1 and not the old style “ring” 0 that’s the problem for some editors?</cite></p>
      <p>Yes. The ring zero, or worse, the reverse-stress "Stempel" zero are problems for graphic designers, but usually not editors. Most of the designers I know just avoid a font if they can't abide a glyph, editors are different creatures. And it is a little different, as there are those lining numbers for the editors latch on to.</p>
      <p>I have been known to make up alternate zeros as well, for the few designers that ask. I don't countenance the argument that a zero that looks like a lower-case "oh" is confusing, for the simple reason that you almost never see an "oh" in the middle of a string of numbers. And in the style we usually (have to) follow, single-digits are usually spelled out, so you don't see just a zero by itself.</p>
      <p>To somewhat tie this in to the original question, I suppose I'd put an alternate zero in a stylistic set by itself.</p>
      <p>I'm more sanguine about alternate alphabetical characters -- the only one's I can thing of off-hand would be lower-case a (one &amp; two tiered), and maybe the lower case g &amp; y. If you're going to switch the g &amp; y, with most designs it is best to do them together.</p>
      <p>I do think a text typeface with too many alternate glyphs is just a real chore to use. You have to hope the font designer provided adequate notes with the font. In any case, if all those 20 stylistic sets are filed up, using the font is going to get confusing unless there is a real logic to it all. Display type could be a different matter, but then why not just get the glyphs from the glyph pallet where you can (somewhat) see what you are doing?</p>
