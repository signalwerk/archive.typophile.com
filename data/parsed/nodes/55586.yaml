      <p>Charles, that's interesting. So it is the old style 1 and not the old style "ring" 0 that's the problem for some editors?</p>
      <p>Here on Typophile some folks have strongly objected to the ring old style zero on aesthetic grounds. But they don't usually mention the one, which looks like a small cap I, as you say. </p>
      <p>I have just completed doing small caps figures, and in the process have finally understood the logic behind the design of the old style 0 and 1. --The clue was that I needed to narrow the old style 2 to make it harmonious with the regular, narrow 0 for the small caps, as opposed to old style figures.    </p>
      <p>By hanging the 34579 and raising the 68, the oldstyle design enables the part of the figure between the base line and x-height to have a width and color similar to the lower case letters, and still look properly proportioned to be recognizable. That's why they fit so well with text. </p>
      <p>The 012 pose problems. You can make the 2 wide and be still recognizable, which is what is normally done. You could also make the top into an ascender, which I think a few typefaces do. </p>
      <p>Making the 1 like a small cap I enables you to stretch the serifs, and push it wider than the one with a barbed top, so it fits better with the other letters and still looks not too bad. And after all it is differentiated from the lower case i and the cap I, so it works in text. </p>
      <p>Making the 0 wide, as the design concept demands visually, can confuse it with the lower case 'o'. Hence the 'ring' or relatively unstressed zero solves the problem by avoiding confusion and keeping the width. I think the ring 0 can also look decent by 'cheating' and making it a bit oval instead of circular, and a bit stressed. There are more difficulties, as people here have pointed out, with heavier weights--which old style fonts originally didn't have.</p>
      <p>But what I am realizing is that because there is no ideal solution you have to choose your poison, so to speak. If you have a wide stressed 0 it is going to be confusable with the 'o'. If you have the barbed 1 it is going to look less harmonious with the other old style figures. </p>
      <p>To get around to the point, I think that if you have old style figures, particularly in a seriffed font, the situation argues for putting both an alternative old style barbed 1, and alternative stressed, wide old style zero each in its own stylistic alternative set. Then people can choose among four options, and "sei gesunt", go off in good health.   </p>
      <p>Personally, I prefer the original old style design, but then <a class="freelinking external" href="http://www.youtube.com/watch?v=gYXHeP9PydQ" rel="nofollow">I'm old fashioned.</a></p>
