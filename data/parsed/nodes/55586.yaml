    html: |-
      <p><cite>but this does not mean we could attain some consistency by asking people which actually have those letter as representative of sounds in their own language, right?</cite></p>
      <p>It's not a perfect world.</p>
      <p>A number of characters came to have meaning simply because they were available. Phoneticians, being fairly clever, didn't threaten to hold their breath until they turned blue unless type foundries made up new characters for them. They adapted what was available. It is understood those characters have a technical meaning to signal sounds.</p>
      <p>Along come anthropologists and use those phonetic symbols (in written form) to represent sounds in languages that had no written form. They're already there, and the anthropologists want to publish, right?</p>
      <p>Along come people proud of their ethnicity, who -- after the fact -- derive a written language.</p>
      <p>Example: L-slash is used in the written form for some Central American native languages. The written forms are late 20th century; the language is ancient.</p>
      <p>Question: What should Unicode call those characters? In other words, who should be offended?</p>
