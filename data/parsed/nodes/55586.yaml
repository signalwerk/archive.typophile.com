      <p>From the documentation on the ss tags, ss03, for example, can remap characters in ss01 and ss02 as well as from the default set. So ss20 has the highest priority, then ss19, and so on.</p>
      <p>So one could have lining figures as the default, regular oldstyle figures as ss01, and an alternate short 1 that looks like a lining 1 instead of a small-cap I in ss02.</p>
      <p>The problem is now "solved" except for applications in which there is no way to enable or disable any of these features. I would recommend font designers to make all their glyphs available as just plain characters in the Private Use area in addition to having the fancy processing for normal characters.</p>
