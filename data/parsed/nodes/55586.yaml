    html: <p>On top of what Thomas has written, I should add that in older versions of Mac OS X (10.4 and I believe even 10.5), if you don't have PDF-compatible glyphnames in OpenType PS (.otf) fonts, some glyphs may not even display in applications such as TextEdit, Keynote or Pages. (This is because the font renderer in those OSes used glyphnames rather than the font's "cmap" table to map Unicode codepoints to glyphs. This has been resolved in Mac OS X 10.6).</p>
