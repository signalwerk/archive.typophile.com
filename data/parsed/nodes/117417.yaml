  html: |-
    <p>Hi,</p>
    <p>I'm wanting rather urgently to know whether I can use Calibri roman and bold for an ebook. The Author at this stage is not yet sure whether the book will be sold in the apple store but there is a good chance it will be. </p>
    <p>I have the fonts on my mac because they came with software and I will now purchase them, but can they be used for the ebook? I really hope so. I can officially purchase them here - <a href="http://www.fonts.com/search/all-fonts?searchtext=Calibri&amp;SearchIn=all-fonts#product_top" title="http://www.fonts.com/search/all-fonts?searchtext=Calibri&amp;SearchIn=all-fonts#product_top">http://www.fonts.com/search/all-fonts?searchtext=Calibri&amp;SearchIn=all-fo...</a></p>
    <p>... but do I need to since they came with office products and even if I do purchase them, will that allow me to use them in the ebook? I believe the fonts are packaged when the fixed layout epub is created using CC Indesign 2014 meaning if the epub was taken apart by someone, they could potentially install the fonts, which I believe is a no no (despite them being available for free on the internet). </p>
    <p>Hoping someone knows the answer or can point me in the right direction. We need to publish in 2 or so days!! HELP. </p>
    <p>Kind regards,<br>
    Kat.</p>
