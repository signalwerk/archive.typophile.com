    <p>Through the generosity of a gentleman who posts on here, he identified (mostly, anyway) a font for me. Interceptor by Device Fonts. It's essentially a revised version of STOP, by Aldo Novarese.</p>
    <p>However, "Interceptor" is based on some other font (also a redraft of STOP). I'd like to know what that font is. Some photolettering typeface? Or? This earlier source would have been in existence in 1990, and earlier.</p>
    <p>Sample of Interceptor Italic:<br>
    <a href="http://devicefonts.co.uk/fontshow-b2/Interceptor-Italic.png" title="http://devicefonts.co.uk/fontshow-b2/Interceptor-Italic.png">http://devicefonts.co.uk/fontshow-b2/Interceptor-Italic.png</a></p>
