    html: <p>Wow, I wasn't expecting quite such a profound philosophical response to my innocent question, especially from Flooce and Typerror!  Still I have read somewhere that to be 'inspired' is to be possessed by the spirits or gods, so maybe that's what was going on?  I quite like the idea of myself as an instrument of the divine, but more often than not I feel the same resignation as Nick Shinn.  Thank you all for your insights.</p>
