    <p>They say an author sometimes gets taken over by his characters and they, rather than he, decide the outcome of the story.  I felt a bit like that having designed (or begun the design) of Pagoda (see attached sample) which I intended to have a solidly mechanical feel.  I began with the lower case c which looked rather like the head of a spanner, and laboured on from there.  Pagoda, however, had other ideas and decided to reinvent itself as something decidedly delicate and oriental!  In the end I gave in played the part of the oily rag to the engineer!  Anyone else have a similar experience?</p><div class="imageWrap"><img src="http://typophile.com/files/Pagoda Poster_3500.png"></div><p></p>
