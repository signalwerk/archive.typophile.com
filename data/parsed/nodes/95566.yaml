      <p>In a way... I took my <a href="http://www.myfonts.com/fonts/ourhousegraphics/silex/" rel="nofollow">Silex</a> which is pretty much 100% straight lines, converted all lines to curves and made all connections smooth to see what I'd get. ... I  ended up with <a href="http://www.myfonts.com/fonts/ourhousegraphics/kush/" rel="nofollow">Kush.</a><br>
      The description on MyFonts, is a literal interpretation of the process; "Kush is what happens when you let your fonts sit around watching cartoons and eating cake and ice-cream all day—When their vectors are freed from constraints and allowed to follow their bliss"<br>
      It sounds like a "just a few clicks and voila! A whole new font" scenario but the amount of work involved in correcting shapes and connections, re-spacing and re-kerning was just about the same as starting from scratch.</p>
      <p>the name, by the way, started out as "Cushy" for soft. The opposite of Silex. It looked better with a 'K'</p>
      <p>... Then my son says, "Uh, Dad... " </p>
      <p>:o)</p>
      <p>No evidence stronger sales to beatniks and hippies though.</p>
