    html: |-
      <p>I have often felt this. It seems that designing a typeface can be rather like my dear friend Sean Stewart's experience of writing novels. At some point in the process you find the "voice" of the novel and follow it, even if it leads you in directions you did not originally intend. Things that conflict with that voice must be discarded, no matter how fabulous they might seem in and of themselves. I often have that experience with type design, where an interesting idea must be thrown away for the greater good of the typeface, because it doesn't fit with the whole.</p>
      <p>In a typeface one may find one or two keystone glyphs that define the direction of the typeface, and then seeing for others whether they fit with those keystones, or not....</p>
