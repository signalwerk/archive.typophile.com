      <p>I can recall one time, while playing with serif shapes, I started curving the serifs into themselves like perfect circles, and eureka, there was Thai!</p>
      <blockquote><p>They say an author sometimes gets taken over by his characters</p></blockquote>
      <p>That's the feeling I get when I'm working effectively. When everything I'm doing seems a natural choice.</p>
      <p>When I'm sketching, the first letter "falls from the sky", and what comes next ist just a reprise/reaffirmation of that. Most of the ideas take more time to unfold. I normally choose letters like /R/, /K/, /Q/, /k/, /a/, /g/, /z/ or /q/, that are more complex in construction, but I may also start, not with a specific character, but with a "rhythm", if i'm working with a broad nib.</p>
      <p>After all, all typefaces are just a single-glyph idea spread out into the rest of the character set, for the sake of consistency. The less characteristics you choose to stick to, the more "mechanical" a typeface will look, I guess.</p>
