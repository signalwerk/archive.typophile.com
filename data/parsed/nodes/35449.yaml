    html: <p>The "Budweiser" above looks more like <a href="http://www.myfonts.com/fonts/fontmesa/brewmaster/regular/"><strong>Brewmaster regular</strong></a> than <a href="http://www.myfonts.com/fonts/fontmesa/brew-master-modern/brew-master-modern/"><strong>Brewmaster modern</strong></a>; similar fonts are <a href="http://www.myfonts.com/fonts/urw/englische-schoolbook/joined-bold/"><strong>Englische schoolbook joined bold</strong></a>, <a href="http://www.myfonts.com/fonts/fontmesa/draft-beer-classic/draft-beer-classic/"><strong>Draft beer classic</strong></a>, <a href="http://www.myfonts.com/fonts/agfa/atflorentine-script-ii/atflorentine-script-ii/"><strong>Florentine script</strong></a>. [edit] ... and also <a href="http://www.myfonts.com/fonts/astype/gracia-series-50/gracia-as-no55/"><strong>Gracia AS</strong></a>.</p>
    html_clean: <p>The "Budweiser" above looks more like <a href="http://www.myfonts.com/fonts/fontmesa/brewmaster/regular/" class="link-external"><strong>Brewmaster regular</strong></a> than <a href="http://www.myfonts.com/fonts/fontmesa/brew-master-modern/brew-master-modern/" class="link-external"><strong>Brewmaster modern</strong></a>; similar fonts are <a href="http://www.myfonts.com/fonts/urw/englische-schoolbook/joined-bold/" class="link-external"><strong>Englische schoolbook joined bold</strong></a>, <a href="http://www.myfonts.com/fonts/fontmesa/draft-beer-classic/draft-beer-classic/" class="link-external"><strong>Draft beer classic</strong></a>, <a href="http://www.myfonts.com/fonts/agfa/atflorentine-script-ii/atflorentine-script-ii/" class="link-external"><strong>Florentine script</strong></a>. [edit] ... and also <a href="http://www.myfonts.com/fonts/astype/gracia-series-50/gracia-as-no55/" class="link-external"><strong>Gracia AS</strong></a>.</p>
