      <p>I would bet that the logo was custom lettering, rather than just typeset in a font. (United could certainly afford that sort of thing!)</p>
      <p>But if you're looking for something with a similar feel, Handel Gothic isn't too far off the mark:</p>
      <p><a href="http://www.fontshop.com/search/?q=handel+gothic&amp;x=22&amp;y=11&amp;sample_text=UNITED%20AIRLINES">http://www.fontshop.com/search/?q=handel+gothic&amp;x=22&amp;y=11&amp;sample_text=UN...</a></p>
