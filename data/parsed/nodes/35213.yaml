      <p>"Humanist" is used to refer to a whole class of letterforms and calligraphic style from the 15th-century Italian Renaissance, which were based on 12th-century Carolingian style. Granted, this is writing/lettering and not type, per se.</p>
      <p>I wouldn't be surprised if Johnston (Gill's teacher) were using the term in <cite>Writing &amp; Illuminating, &amp; Lettering,</cite> first published in 1906, though I'm sure that's not the first use of the term.</p>
      <p>D.B. Updike refers to the Humanist book hands in an early chapter of his seminal <cite>Printing Types</cite> (first published in 1922). But he doesn't use the term to refer directly to types. When discussing the influence of the Humanists on the first Italian types, he uses the term "Humanistic influence."</p>
      <p>-- K.</p>
