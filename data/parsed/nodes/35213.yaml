      <p>Globe Gothic, from the 1890s, has a lot of "humanist" qualities -- unfolded curves and (pen-angled) terminals in the lower case.</p>
      <p>Bernhard Gothic, a type of similar vintage to Gill Sans, is far more chirographically informed in general.<br>
      But Gill's "a" and "g" really make a statement -- perhaps in contrast to the quite geometrically modern (or neoclassical) proportion of the rest of its letters.</p>
      <p>Round about 1980, when I was becoming familiar with type, there were only two "humanist" faces -- Gill and Syntax -- although I don't recall them being referred to as that. Even in the mid '80s, when I designed Shinn Sans, I thought of it as a calligraphic face, not humanist, and could only really add Eras and Shannon to the genre, and possibly Frutiger.</p>
