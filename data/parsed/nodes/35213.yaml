      <p><em>Would you not have classed Frutiger alongside Gill and Syntax back then?</em></p>
      <p>I didn't know what to make of Frutiger, it was transcendent, in a class of its own. What perplexed me most was the ease with which it could convincingly present the most banal messages -- in huge Bold Italic all cap headlines, for instance, in trade advertisements in Advertising Age magazine.</p>
