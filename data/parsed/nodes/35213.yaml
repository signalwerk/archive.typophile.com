      <p><em>Was Johnston’s underground actually produced as a typeface to be used for materials within the system, or was it a series of guidelines for drawing the letters used in the signage?</em></p>
      <p>As I understand it, Johnston's design <em>was</em> made into a type near the time of its design, but I think it was only used by the railroad (not sold), and Johnston's involvement in that stage of his letters' use may have been pretty removed. Robin Kinross: "Johnston's Arts &amp; Crafts scruples and his natural diffidence obstructed any collaboration with the world of machine production: he never developed the alphabet as a typeface (i.e. in a range of sizes, with variant forms) for a typefounder, still less for machine composition." (<em>Modern Typography</em>, p75)</p>
