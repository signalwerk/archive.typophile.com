  html: |-
    <p>I am trying to trace the history of the use of the term "humanist sans serif." It seems pretty indisputable that Gill Sans is the first of this kind, but I have found that, though from early on Gill Sans is promoted as a sans of a different kind to the contemporary geometric sans-serifs from Germany, "humanist" doesn't seem to have been the word used to name this "different kind." </p>
    <p>A companion question (which actually may go pretty far in helping to answer the first) is when was "humanist" first used to describe specifically ANY lettering (that is, seriffed types or script)? B. L. Ullman in 1960 still opines that humanistic script has been deplorably neglected in scholarship, but cites Morison's writings of the early 1940s as the "leading treatment." Was "humanist" used in any of the turn-of-the-twentieth-century books? (I have Theodore Low De Vinne's 1900 Practice of Typography here and I don't see the term used.)</p>
    <p>So: what's the earliest you've seen "humanist" used to refer to a sans-serif type?</p>
    <p>And what's the earliest you've seen "humanist" used to refer to any lettering?</p>
    <p>Thanks for any help you can provide!</p>
