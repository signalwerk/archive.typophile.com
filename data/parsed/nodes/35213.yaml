      <p>&gt;do you have other information?</p>
      <p>Yes, Jaspert's Encyclopedia and also Mac McGrew's American Metal Typefaces says that the first foundry type version was done in 1922. They both say the Lanston Monotype version was done 1929-1930. </p>
      <p>Bringhurst says that Goudy Sans is the "spiritual father" of "several recent typefaces, including Erik Spiekermann's Meta and Officina." Perhaps Erik will chime in and let us know if Goudy sans was indeed an influence or inspiration.</p>
      <p>Goudy Sans has never been very popular, but I have a feeling that subsequent designers of humanist faces have been aware of it. I my guess is that it was path-breaking, though is not entirely successful as a design.</p>
