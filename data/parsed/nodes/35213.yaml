      <p>&gt;pretty indisputable that Gill Sans is the first of this kind</p>
      <p>Not Gill Sans, but Johnston's Underground is usually credited with being the first to depart from 19th century models. Full proportions of a traditional seriffed type may have been first done, though I'm not sure, in Goudy Sans, which was first shown in 1922, a number of years before Gill Sans--which is I believe also less fully 'humanist' as far as proportions.</p>
