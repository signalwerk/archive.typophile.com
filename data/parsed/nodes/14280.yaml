      <p>I'm not an expert but I've had similar problems.</p>
      <p><strong>Kerning</strong>. You may already know this but if not: prior to generating the font make certain to do two things.<br>
      1. Go to Tools&gt;Kerning Assistance&gt; Apply and Save<br>
      2. Open the OT panel and compile the tables.<br>
      You have to do the above two steps before generating the font if you've changed any of the kerning or feature definitions!</p>
      <p><strong>Naming</strong>. This is a bitch. Through trial and error I've discovered a method that works, although it may be <em>The Wromg Way™</em>. One or more of the following steps may be completely unnecessary or even BAD, but it works, InDesign gets it, and ATM gets it. I think you need to make certain that you've set OpenType Export Options to "Export only OpenType name records". (but I may be confused about that). What I do know that works for families larger than the basic 4 (Regular, Bold, Italic, BoldItalic) is the following.</p>
      <p>Say you have font MyFont and you want to add an ExtraBold weight and have it appear in the subfamily menu in InDesign (where the Regular and Italic appear). Do the following:</p>
      <p>In the Font Info dialog go to Names &amp; Copyright &gt; Basic set of font names</p>
      <p>Family Name: <strong>MyFont ExtraBold</strong><br>
      Weight: ExtraBold [800]<br>
      <em>don't check "font is bold" it confuses things</em><br>
      Style Name: ExtraBold<br>
      Font Name: MyFont-ExtraBold<br>
      Full Name: MyFont ExtraBold<br>
      Menu Name: MyFont ExtraBold<br>
      FOND Name: MyFont ExtraBold</p>
      <p>Go to the next page <strong>OpenType-specific names</strong> There are three fields.<br>
      Family Name: MyFont ExtraBold<br>
      Style Name: ExtraBold<br>
      MacName: MyFont ExtraBold</p>
      <p>Now the fun part. Page 3, <strong>Additional OpenType names</strong></p>
      <p>Click the auto generate button. That should do the trick. Of course, I may have forgotten something. If so, let me know and I'll try again.</p>
