    <p>I am having some difficulties with FL 4.6 in windows when generating OTF fonts. I used to use Fontographer and then load T1 fonts into fontforge/Cygwin to generate OTF fonts. With some experimentation, I got it working fairly well. You would think that after mastering that process, I would be able to get FL to generate some OTF fonts that work properly.</p>
    <p>My problem is this. I have 6 faces in a family, Promethian. I generate all 6 (A standard 4, with 2 small caps variants.) The main face, Promethian generates its name properly, but has no kerning in Illustrator or Indesign, but it does in Photoshop. The other five generate, but in Indesign they are segregated to the bottom with (cyrillic). It's just a standard windows font- I took out all mentions of anything weird in the scripts. Some of these come through with ok kerning (in Illustrator and InDesign), some don't. All of them have kerning in Photoshop.</p>
    <p>This is bizarre. Any thoughts? I'm seriously thinking of going back to my old workflow. I bought FL to streamline generation, but this has taken me weeks to try to figure out. Hoping for some good expert advice. It's probably as simple as a checkmark I forgot somewhere. Let me know if you need any more information.</p>
    <p>Much appreciated!</p>
