    html: <p>Hmmm. Seems like there are several problems. No matter what you do, probably you wouldn't be able to make a "real" Sogdian font and type in Sogdian in Office XP. You'd need Sogdian to be in Unicode and Office or Windows to have the Unicode properties for those codepoints to have much of a chance. With the OpenType approach to language support, the OS or app needs to "know" the language. <br> <br>So I can see why you'd be tempted to break down and make a fake Arabic font as an alternative. <br> <br>I will caution that part of your rationale for making a font that lies about its encoding is that you don't want people to install anything other than the font. That would apply for any language that doesn't have built-in keyboard support, including many that might otherwise work fine as long as somebody bothered to make a keyboard for them (which is a lot less work than making a font). <br> <br>From my point of view, lying about codepoints in a font is a Bad Thing. It creates text that is font-specific, and can be easily misinterpreted. Not wanting folks to have to install a custom keyboard isn't really a good enough rationale in the Unicode era. People who made hacked fake encodings in the single-byte era were working around some nasty problems, but it was a choice between several evils. <br> <br>However, in your case, where getting correct glyph processing might be difficult or impossible without a hacked encoding, I can understand the temptation. (I'll note that it is unnecessary in an AAT environment, where the processing is all built into the font.) <br> <br>You don't need to only understand GSUB, but also to understand how substitution is handled by your tool of choice. What tool you need depends somewhat on what you need to do. <br> <br>Does Sogdian require mark positioning and attachment, like Arabic? <br> <br>Do you have a preference between TrueType and PostScript types of outlines? <br> <br>Regards, <br> <br>T</p>
