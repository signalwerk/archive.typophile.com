    html: <p>It is exactly because of that (LTR/RTL) and because the arabic script is present on every computers. I want to be able to switch to arabic script in Mac or Windows Word and just begin typing in sogdian. If there is an other simple solution, i am ready to try to implement it, but i want that, with my font (and my font only, something which exclude Word macro), colleagues can type directly in sogdian with tools (arabic or farsi script) they will find on all their computers (at least recent ones). It works perfectly with textedit on a mac. But I want to use it also on Office XP.  <br> <br>Basically, I do not understand the way GSUB works and I would need a tutorial designed for contextual left-to-right script. <br> <br>Etienne</p>
