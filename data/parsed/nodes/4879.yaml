    html: |-
      <p>Vaissi,<br>
      I initially wanted to write to say faking a code point is a very bad idea. But when I tried to find a solution for you I realized that you understood your dilemma fully and your solution might be the only one. Specially when it comes to Windows platform. But you should make sure that the Soghdian font that works correctly on TextEdit, is indeed using OpenType specific (init-medi-fina-isol) features and tables and not AAT ones. Such font can then be used by an Arabic or Persian keyboard which will be identified as such by Word and the correct directionality will be provided... at least, this is your best chance!<br>
      I hope you push Unicode to encode those characters. It has to happen.<br>
      Best of luck,<br>
      Behnam</p>
