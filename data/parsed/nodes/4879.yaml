    html: "<p>dear Thomas <br> <br>What I need is to insert sogdian in articles or books, most of which are written with Word. I already know that my font cannot be used directly with Word for Mac as it does not handle at all RTL scripts (even the new Word 2004). It works with textedit and I am wondering if by cutting and pasting from textedit in the new Word 2004 (which is unicode) I might insert sogdian text in word (not yet tried).  <br> <br>But I made the assumption that Word XP, which handles RTL and Unicode, would rely on the GSUB table of the font to handle the substitution. So your phrase \"I'll note that it is unnecessary in an AAT environment, where the processing is all built into the font.\" is frightening for my idea: do you mean that it is not the case in Word XP ?  Word XP does not use the GSUB but its own system ? <br>If not, you are right that I should think to another solution. With a specific keyboard can I insert easily anything RTL ?  <br> <br>Sogdian does not require mark positionning. It is a cursive script with different shapes at the beginning, middle and end of the word, that is all. No diacritics or subscript vowels. <br> <br>Etienne</p>"
