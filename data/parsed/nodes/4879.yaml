  html: <p>Dear all <br> <br>I am an historian who has drawn a font for very specific purposes, ie a sogdian font, reproducing the main script used along the Silk Road between the Vth and Xth century. Sogdian is based on aramaic, and the sogdian script gave birth to the medieval uighur one which itself is stil alive through the manchu and mongol scripts. <br>There is no unicode encoding for sogdian and, althoughh it was used from India to China and from Samarkand to the crimea, with extensive textual remains, I am not aware of any plan to have a unicode encoding for it (very strange to see that even in what should be a world project, we are still narrowly westerners. No old or middle iranian script is encoded (thousands of texts) while the Phaestos disk (one text) is !! but it is not the question</p>
