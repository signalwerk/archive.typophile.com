    html: <p>With all due respect to Typophiles, I think giving your friend a relevant chapter from Bringhurst or some similar book would be more instructive than reading an online thread full of disagreements and fragmented conversations. Especially for the basics. Or maybe Thinking With Type, by Ellen Lupton, which is a fun introduction. (I'm not sure how much your friend knows, but if he is trained as a designer, he has likely already read these and similar books. Although I don't actually know "what they teach them anyway," as I'm self-taught.)</p>
