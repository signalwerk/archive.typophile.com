    <p>Hello all,</p>
    <p>I'm new to this forum, but as all of you, I've been interested in typography for a long time. (maybe not as long as most of you, but I think of it as long)</p>
    <p>Why am I reaching towards you for help?<br>
    Well, I've got to write a thesis to be able to graduate from my education (Communication &amp; Multimedia Design, I'll get to that later on). I want to do a paper on a typography related subject, but so far the only thing I've come up with is this:</p>
    <p>Can typography change the reaction / emotion a viewer has?</p>
    <p>I'm not quite satisfied with it, so I would like to know if anyone has some idea's that could point me in a different direction, or could help me redefine my question, prefferably with some resource links.</p>
    <p>(I'm not asking you to write my paper for me, that's my job, but a hint or advice on a direction would help)</p>
    <p>So what is Communication &amp; Multimedia Design?<br>
    Communication &amp; Multimedia design is a study taught in the Netherlands (at least that is where I'm attending). It focusses on combining the new and old media whilst creating new and innovating ways of using them.<br>
    (the website of my education can be found here <a>http://www.cmd-breda.nl</a>, but it's in Dutch. And please look through the not so well designed website.)</p>
    <p>Thanks in advance,</p>
    <p>Vincent Delahaije</p>
    <p>P.S. As most of you would've probably noticed; English isn't my primary language.</p>
