      <p>"Can typography change the reaction / emotion a viewer has?"</p>
      <p>Hi Vincent. That probably needs to be a little more focussed. What is the approximate length of the paper? If it's not a sort of thesis then it's better to look at typography in a specific industry/application/historic context. </p>
      <p>A few stray ideas for whatever they may be worth.  </p>
      <p>1. There are typefaces like Clarendon, Century and Gill Sans that are very reminiscent of the British empire. Institutions, businesses, publications etc of that period used a lot of those faces. The Netherlands too had overseas colonies. Maybe you can access examples of typography from that period to see if there was any consistent style. You could also examine if it would give any hints on how different nations looked at their overseas dominions (benign, domineering, mercantile etc). The VOC monogram of the Dutch East India company could be a starting point   </p>
      <p>2. In a time when the Latin script is gaining ascendence the world over, it may be interesting to look at factors that can influence growth/decline of typography in vernacular scripts. Factors like technology, government intervention, chauvinistic politics, market pressures etc. You can do this by looking at examples from different countries.... Across the middle east, government regulations require the use of Arabic. In the early 90s the Indian goverment set up a project to design and propogate vernacular language fonts primarily to stem the outflow of foreign exchange to overseas foundries. You could look at examples from Israel, Thailand, China etc.  </p>
      <p>3. You may also find it interesting to look at the evolution of typography in currency notes; both in your country and elsewhere. It might reflect the changes in how governments have wanted to be percieved over the years: from distant and majestic to today's friendly and inclusive. After all curreny notes carry the most ubiquitous form of typography and everyone would be familiar with those letters.  </p>
      <p>Hope some of this may be useful, or at least would spark off useful ideas.</p>
