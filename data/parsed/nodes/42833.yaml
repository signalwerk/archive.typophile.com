      <p>Maybe a more interesting question would be "Can a typeface illicit zero emotional reaction in the viewer?"</p>
      <p>I think it's pretty obvious there are a lot of typefaces that have a clear emotional message -- fancy scripts convey elegance and romance, bold sans serifs convey a no-nonsense bluntness -- but are there typefaces that say absolutely nothing, and allow for a completely transparent text, where the only thing that matters is the words of the writer? If you've seen "Helvetica" (the movie), you know this was a major goal of modernist thinking in typefaces. To me, there's a much bigger question surrounding the notion of a "neutral" typeface being possible.</p>
