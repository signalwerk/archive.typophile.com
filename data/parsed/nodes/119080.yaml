    html: |-
      <p>Thanks, Dick.</p>
      <p>The page at abfonts you linked to says the following: "Cutin" is Cut-in Medium on page 163 of The Solotype Catalog of 4,147 Display Typefaces. Apparently "Cut-In" was released by Letraset in at least Medium and Bold weights. So at least now I have a name–but no information on a designer.</p>
      <p>The font called "Simplement" that you linked seems to be a pretty nicely done digitization of the Medium weight, updated with additional characters and most common diacritics, though there are no kerning pairs. I wonder why this one has slipped though the cracks in terms of digitization and release. I'm not going to go searching for a complete source of now, but this might be one to keep on the backburner for later consideration. Might be nice to see a good rendition of the family. Perhaps Old Nick will give it a go.</p>
