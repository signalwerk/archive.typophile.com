    html: |-
      <div class="comment-spam-body"><p>Your letters seem to match Cutin Bold by Letraset. The character-set is shown in the old Letraset Product Manual for 1985, and probably for other years. Just the upper and lower case [multiple versions of _C_ (5), _E_ (5), _S_ (2), _c_ (6), _e_ (4), _s_ (2), _y_ (2), and _z_ (2)], numbers, German double s [ß and ss], ampersand, dollar [simplified from regular], pound, and basic punctuation.<br>
      Don</p>
      </div>
