  html: |-
    <p>I recently needed to recreate some lettering on some 1970s electronic studio equipment, but could not for love or money identify the typeface used in the equipment name/logo. I've since recreated the letters I needed, about 20 in all, but I'd still like to know if one of you might identify it for me.<br>
    <img src="http://typophile.com/files/flange_0.png"><br>
    If this has never been digitized I might be interested in finishing what I have already started and putting it out there as a revival font. See what you think.</p>
