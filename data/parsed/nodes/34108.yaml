      <p>Regarding glyph-sorting on the Glyph palette, I'll take this opportunity to point out that InDesign CS3 allows the glyphs to be sorted by Unicode*, in addition to the usual GID order. </p>
      <p>The images below display the same font sorted by GID (top) and by Unicode (bottom). The new sorting method might be more intuitive for some people, as it puts together all the things that are somehow related with each other.</p>
      <p>* Unencoded glyphs, such as alternates and ligatures, are sorted as well.</p>
