      <p>As a computer programmer by profession, hearing of using "x" in place of the multiplication sign fills me with horror; it reminds me of using the lower-case L for the numeral 1.</p>
      <p>But with that, as in the case of the characters for minutes and seconds, many people typing text will not know that the correct characters even <em>exist</em>.</p>
      <p>So while I believe that sound practice in handling UNICODE is something that is genuinely needed, I also heartily agree that special characters are much too difficult to enter.</p>
      <p>However, there are two little problems...</p>
      <p>Problem 1: If the mechanism for entering special characters is part of the <em>application</em> instead of the <em>operating system</em>, then, because people may well be using more than one application for preparing documents, they will be less likely to learn how to use each such mechanism.</p>
      <p>Problem 2: There are a <em>lot</em> of special characters in UNICODE. Some of them might be relevant in an application for typesetting mathematics. Others would be relevant in an application for doing fine typography of books or advertisements. Hence, if you leave special characters up to the operating system, you have to support all of them, which leads to unusable mechanisms like typing in four-digit hex numbers.</p>
      <p>The Apple Macintosh computer offered a solution which, while certainly open to criticism, was, I'm sure, genuinely helpful to many people; it had a standard default set of extra characters reachable by a third shift on its keyboard. At least they would include some of the ones you wanted, and thus they would be better than nothing. The latest versions of Windows finally include something somewhat similar for people desiring the U.S. keyboard layout.</p>
      <p>The solution that seems to make sense, in terms of the way I've framed this, is a standard way to type more characters than are normally presented on the keyboard, which, on its simplest levels, is subject to influence by the application.</p>
      <p>That is, you have a third shift, it gives you special characters, but the layout may be changed by an application to favor the ones relevant to its purpose.</p>
      <p>And you can navigate through special character sets without changing to a different keyboard layout (associated with customizing your computer to being used in another country with a different language), and define a keyboard layout in a simple and standard manner which doesn't require modifying your operating system (although that may not be a fair description of, say, installing the .NET framework, which is essential for using a <em>lot</em> of things...) - well, a rant is perhaps not useful.</p>
      <p>In any event, the issue is basically that the computer keyboard has not been designed as a device for accessing an enormous and shifting repertoire of characters.</p>
      <p>As utilizing more than the basic ASCII set, modified by a few accented letters for one's home language, is perceived as being something done so seldom (except for the speakers of Chinese, Japanese, and Korean, who just have to suffer with cumbersome input methods), providing an extra key or two on the keyboard to support this, for example, is unlikely, and even significant operating system support is unlikely.</p>
      <p>Except, of course, in Linux, where you can do exactly what you want...</p>
      <p>In the old days, what people were used to is having access only to the 94 standard ASCII printable characters, and using a font with totally nonstandard glyph assignments to type special characters. Atrocious from the UNICODE viewpoint, but at least it <em>worked</em>. Can a proper solution be made at least as usable as that was?</p>
