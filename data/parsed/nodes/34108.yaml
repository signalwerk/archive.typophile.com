      <p>OK, more devil's advocacy:</p>
      <p>Standards aren't the be-all and end-all. They're just a means to an end, and sometimes the means can screw up the end.</p>
      <p>I appreciate the breadth of John and Adam's concern for the integrity of the text across different media, but this may sacrifice initial typographic quality, and that seems absurd in, for instance a print piece where the text has little likelihood of being digitally searched, or reset.</p>
      <p><em> the old adage that typography should serve the text?</em></p>
      <p>I'm not sure how old that one is, although it does kick off Bringhurst's Style Guide ("honour" the text, actually). The older adage is serving the reader.</p>
      <p>As Charles mentioned, knowing one's market (or audience) is important, and I wonder how many typographers who might be inclined to use the special characters I mentioned, would be comfortable entering unicode numbers? Not many, I would say -- they're going to use the glyph palette, now clutttered up with the wonders of massive Unicoded OT fonts. Sure, the filing systems described by Miguel will help, but in practice it's next to impossible to distinguish an apostrophe from a minute from an acute from a tonos. </p>
      <p>I am always amazed to come across typographic boo-boos in communications from blue-chip companies. Never mind that, in its printed missives to the design industry, Veer routinely abbreviates numbers with left-quotes, following the InDesign/SmartyPants practice. Good WYSIWYG, but poor typography.</p>
      <p>Surely the best way to encourage typographers to produce more sophisticated typography -- to serve the reading public, not the great god WYSIWYG -- is to make it really easy for them to, for instance, set the multiply sign, by simply applying the "Stylistic Alternate" feature to the character that's already in the text? (It would certainly have been easier for me to do something like that earlier in this thread, where I got minute and second muddled.)</p>
      <p>And despite Unicode's assertion that x and multiply are different characters, visually they really are stylistic alternates of the same character shape, and, in the context of any text where a faux Stylistic Alternate substitution would be made, there could never be any problem with meaning. Even in proper maths, because an italic font would be used for "x", precisely because of the interchangeability of "x" and "multiply".</p>
      <p>Consider this hypothetical scenario: an InDesigner is setting the captions for an art catalogue, and, for the artwork dimensions, wants to insert the correct multiply symbol in place of the manuscript's "x", throughout the text. Global substitution won't work, as that would change all "x"s, so "find/change" might be used. Except that the glyph palette doesn't connect to the "change to" field, and "multiply" isn't one of the characters available in the list of suitable substitutions (nice touch Adobe, BTW). So the InDesigner must do the job manually. I would be inclined to make the change once, then copy and paste. But how to make the first change from x to multiply? The glyph palette, of course, but if the font has the "salt hack" I'm proposing, that would be easier. And it would also work to convert the hash marks that measure the painting sizes in inches, into the proper inch mark (second).</p>
      <p>In the most recent art catalogue I have (Contact photo festival), the designer has used all caps of a sans face (X really does look like multiply), and spelled out inches -- I would guess the difficulty of getting the proper characters/symbols has something to do with that decision.</p>
