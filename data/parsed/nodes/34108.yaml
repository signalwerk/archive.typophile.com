    html: <p>Quadibloc, Windows and OS X users may change their keyboard layout quite freely as well, but of course that’s usually restricted to their box at home, see <a href="http://www.microsoft.com/en-us/download/details.aspx?id=22339" rel="nofollow">MSKLC</a> and <a href="http://scripts.sil.org/ukelele" rel="nofollow">Ukulele</a>. In theory, customization like that could work on Android as well. Apple finally will allow 3rd party keyboards in iOS 7, but at least the default key layout makes more characters accessible than the default Android one.</p>
