      <p>Nick, regarding organising glyph sets in intuitive ways to assist users of glyph pallette entry:</p>
      <p>Pretty much every project I do begins with the definition of a glyph set, usually in an Excel spreadsheet. This will contain at minimum a list of my development (human friendly) glyph names and corresponding Adobe Glyph List and uniXXXX form final names. I often include other information: if for instance I am working on a script for which I do not already have a FontLab .nam names-to-Unicode mapping, I will include encoding information in the spreadsheet. Obviously, after one has done a number of projects one has a collection of spreadsheets which can easily be manipulated to build new glyph sets. The listing of glyphs names can be copied into FontLab .enc files to create custom 'encodings', i.e. glyph sets in FontLab.</p>
      <p>Using this approach, I group like-with-like glyphs in ways that, I hope, will be intuitive for locating and selecting from glyph pallettes.</p>
