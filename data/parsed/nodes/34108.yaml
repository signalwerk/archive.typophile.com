      <p>That's what the Glyph palette's tooltip is for.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/quoteright_ttip_4605.png"></div><div class="imageWrap"><img src="http://typophile.com/files/singlequote_ttip_5058.png"></div><div class="imageWrap"><img src="http://typophile.com/files/acute_ttip_5089.png"></div><div class="imageWrap"><img src="http://typophile.com/files/prime_ttip_4004.png"></div><p></p>
      <p>John: <em>What would make it easier? If the find/replace dialogue had context fields! Then you could say, e.g. replace x with × when preceded and followed by any numeral.</em></p>
      <p>You can do that with GREP, in InDesign CS3. The Find/Change expressions would be:<br>
      Find what: <code>(\d)x(\d)</code><br>
      Change to: <code>$1×$2</code></p>
      <p>Nick: <em>How about if instead of substituting “Multiply”, applying Stylistic Alternate to “x” substitutes “x.alt” — which has the same glyph as Multiply?</em></p>
      <p>That is a "better" approach, but it does not solve anything. The underlying character will still be 'x', therefore any Search/Replace or screen reader software will always be fooled by that. They "see" characters, not glyphs.</p>
