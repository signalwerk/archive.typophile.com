      <p>Nick, remember the old adage that typography should serve the text? Let me propose a new one: digital typography should serve digital text. One of the implications of this is that the default glyph for a given character should not pretend to be a different character. Digital typography and text processing present us with a complex set of relationships between glyphs and characters, and we shouldn't make it any more complicated and we should avoid situations in which we basically use glyphs to lie about the identity of the underlying character.</p>
      <p>We've fairly recently come out of a period in which designers became used to using encoding hacks to get at the glyph shapes they wanted (e.g. 'expert sets' for ligatures). These hacks were necessary because of the lack of a suitable mechanism for cleanly weaving display and text encoding. Now, with Unicode and OpenType, we have such a mechanism, but we also have a lot of possibilities for using glyph hacks to get at the glyph shapes of characters that might be less convenient to enter in text (despite the profusion of input methods, character and glyph pallettes, custom keyboard drivers, etc.). I understand the motivation, but I think it obscures exactly what we have gained in the Unicode/OpenType model -- a way to separate the sophisticated display of text from the encoding of text -- and that gain is best appreciated, and not needlessly muddied, if one observes some basic principles about character identity.</p>
