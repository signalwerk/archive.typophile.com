      <p>Crissov, I think you should avoid text correction on the font level. What may work in English may not work in other languages. There are also many exceptions where the font substitutions fail: while 1939–1945 is an interval with en-dash, 1939-1945 might be a product with a hyphen; if you substitute hyphen with en-dash, how would user correct it then? OpenType cannot solve such issues.</p>
      <p>In my design studio, we've created an extensive and language sensitive list of find-change entries. We use it as a script for InDesign (based on the default FindChangeByList.jsx script) and we run it whenever we import a text in InDesign. It is 1000× smarter than OpenType features, it includes several very complex and contextual solutions.</p>
      <p>I think it is pretty easy to develop such find-replace tool for texts on websites as well. There is one similar plugin for WordPress for instance wp-typography (<a href="http://kingdesk.com/projects/wp-typography/" title="http://kingdesk.com/projects/wp-typography/">http://kingdesk.com/projects/wp-typography/</a>), maybe there are now newer ones available.</p>
