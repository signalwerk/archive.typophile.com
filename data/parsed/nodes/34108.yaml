      <blockquote><p>What may work in English may not work in other languages.</p></blockquote>
      <p>That’s what <code>languagesystem</code> is for, which, admittedly, is missing from my code above.</p>
      <blockquote><p>if you substitute hyphen with en-dash, how would user correct it then?</p></blockquote>
      <p>I would of course only substitute the legacy character U+002D ‘-’ Hyphen-Minus and never the specialised characters U+2010 ‘‐’ Hyphen, U+2212 ‘−’ Minus or U+2012/2013/2014 ‘Figure’/‘En’/‘Em Dash’ etc. Also, like I said, this is nothing that should be done on the professional production side. I don’t claim that the lookups I posted above are perfect either, they are not even tested.</p>
      <p>For what it’s worth, I’m using a user script and stylesheet in Wikipedia to improve foreign typography and a customized keyboard layout to generate “correct” typography myself.</p>
