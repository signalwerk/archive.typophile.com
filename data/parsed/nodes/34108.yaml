      <p>Nick: <em>Consider this hypothetical scenario...</em></p>
      <p>Not so hypothetical: this is the sort of thing I do on a regular basis. It's a pity that the glyph pallette doesn't accept focus to the find/replace dialogue, but this is easy enough to workaround. Make one manual substitution and then copy/paste the multiply symbol into the replace field of the dialogue and away you go.</p>
      <p>What would make it easier? If the find/replace dialogue had context fields! Then you could say, e.g. replace x with × when preceded and followed by any numeral. I think context fields should be standard in find/replace functions, and am amazed that no one seems to have thought of this.</p>
      <p>But the basic point, Nick, is this: what you are complaining about is application functionality. And I don't think it makes any sense to try to solve application limitations in fonts. It is something that is very tempting to do sometimes, especially if it seems like there is an easy way to do it, but having spent the past decade working closely with application developers I've come to the conclusion that it is a really bad idea to second-guess them. Chances are that the way the application works will change -- hopefully improve -- and you are left with a quirky font that does odd things and a pile of poorly encoded text.</p>
