      <p>&gt; X really does look like multiply</p>
      <p>In some fonts X really looks like multiply, and in some fonts l really looks like 1. In some fonts, rn looks like m. So what? Would you put this code into your font: </p>
      <p><code>feature liga {<br>
      sub r n by m;<br>
      } liga;</code> </p>
      <p>? Makes no sense whatsoever. </p>
      <p>Character encoding must bear necessary semantic differentiation, because a lot of software depends on it. For example, in Unicode, some characters have the property of being "letters" while some don’t, some have the property of having uppercase or lowercase variants, they belong to different writing systems etc. </p>
      <p>All this information gets screwed up if you start making glyph alternates the way you suggest it. This interfers with various mechanisms such as spellchecking, hyphenation, the way OpenType features are being applied to a string or not. </p>
      <p>The solutions you propose are OK for fonts that you produce on a completely custom basis, for very controlled, closed environment, where you maintain contact with the client in future. But never for retail fonts, because despite what you may write in your user’s manual for the font, people will use the font their way, may use it on systems and applications that you never heard that they existed, and, above all, may use them *according* to the standards that you choose to ignore. </p>
      <p>This reminds me of the situation when people started producing Cyrillic or CE fonts in Type 1 format in the early 1990s. They simply placed the Cyrillic glyphs, or the accented Polish or Czech glyphs, in the slots of Western glyphs (using the fact that one code position in the Western codepage stood for some particular character in the Cyrillic or CE codepage). They didn’t care to set up appropriate glyph names and encoding flags. Those fonts worked fine in QuarkXPress 3 and 4, and in PageMaker, and in Illustrator 6, and in Photoshop 4. </p>
      <p>But these fonts are STILL in circulation. 15 years later, people moved to a Unicode-based system. When they open old Quark documents in Quark 7, the automatic conversion from codepage-based encodings to Unicode fails because Quark "thinks" the document is set in French and not in Russian, so the user ends up with character spaghetti. Also, these fonts are virtually unusable in Quark 7 or InDesign. And the users curse the font vendor. </p>
      <p>On the other hand, there are Type 1 fonts from other font vendors that were created by the rules. They worked just exactly as fine in the old apps, *and* 15 years later they still work, and the documents created with them also do work. </p>
      <p>If you make the fonts "your way", they may work fine in InDesign CS3 but perhaps will stop working properly in InDesign CS5, because Adobe would have introduced a mathematical typesetting engine that correctly enters and formats math equations, but this engine might rely on arithmetic operators being encoded *properly*. So if the user opens an old document typeset in your font that says "5×6", the math engine will recognize this as an equation and add some extra spacing around the × sign accordingly, but if the text in the document looks like<br>
      "5×6" but actually <em>says</em> "5x6", then the math engine may reformat it to "5<em>x</em>6" because it thinks the "x" is a variable name. </p>
      <p>Etc. etc. </p>
      <p>The advantage of using standards is that they offer much larger future stability. I.e. even if the standards change or get replaced, there is a great chance that the people who develop the new or the modified standards in future will also develop <em>standard</em> ways of migrating the old structures to the new ones. If you deliberately <strong>break</strong> today's standards, it's almost certain that this will <strong>break</strong> the future migration, either of the fonts or of the documents that the font was used in. In any way, your users will be penalized -- either today (those who use your font on platforms that you didn’t bother testing, or using them in a context that you didn’t envision or that you deemed "unimportant") or tomorrow. </p>
      <p>I personally would always warn users from purchasing hack-encoded fonts. The graphic qualities of such fonts may be fine but the functional side of the design is broken. I'm not interested in wearing a wrist watch that looks great but every now and then randomly stops working for 15 seconds or jumps ahead one minute. The same is with fonts. </p>
      <p>A.</p>
