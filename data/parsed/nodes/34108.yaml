      <p>BTW, the faux italicization really comes from the *extremely* early days of computing, where you had bitmap fonts, very few fonts, low-resolution printers etc. (where you wouldn’t even actually tell the roman from the italic, easily). Remember, those were the days where fonts came on floppy disk and using three different fonts on a page might overload your printer’s memory. And the expression "electronic documents" probably didn’t exist (neither did the PDF format). </p>
      <p>We’re 20 years into future now. Yes, some apps still maintain the faux italic for backward-compatibility reasons. But there is no need or reason to come up with NEW solutions that still follow this old-style way of thinking. </p>
      <p>A.</p>
