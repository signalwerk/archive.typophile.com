    <p>Here are a few ideas:</p>
    <p>Superior:<br>
    ® becomes "registered.alt" -- a small, superior version of the character<br>
    † becomes "dagger.alt" -- a small, superior version of the character<br>
    ‡ becomes "daggerdbl.alt" -- a small, superior version of the character</p>
    <p>Stylistic alternates:<br>
    ' becomes "second"<br>
    " becomes "minute"<br>
    x becomes "multiply"<br>
    - becomes "minus"<br>
    l becomes "liter" (u+2113)<br>
    &gt; becomes "fist" (u+261E)</p>
    <p>These seem reasonably intuitive.<br>
    Is there any reason not to implement them?<br>
    Anything else that could be added?</p>
