      <p>You know, I posted this same thread in the general section and got one response (plus Adam). I just get the feeling that we're so into all these OpenType complexities, ramping up the characters and features in fonts, while the OT menu remains buried and unheralded in CS and Quark (not to mention Microsoft) -- and meanwhile the vast majority of users think OpenType is just for fancy script ligatures.</p>
