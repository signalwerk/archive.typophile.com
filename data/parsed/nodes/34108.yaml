    html: |-
      <p>Paul, </p>
      <p>the Scedilla-&gt;Scommaaccent case is indeed special. The proper Unicode codepoint to be used with Romanian is that of Scommaaccent (U+0218). Unfortunately, some old Unicode implementations use U+015E (Scedilla) in the Romanian locale. This means that the Romanian text can be represented in two different ways, "old" (using Scedilla) and "new" (using Scommaaccent). The "locl" OpenType replacement helps migrate the electronic text from the old to the new encoding. In this very case, the font helps fix a particular isolated encoding problem. </p>
      <p>Also, the Scedilla-&gt;Scommaaccent replacement in "locl" for Romanian has become a widely accepted practice now. Both Unicode and OpenType work on that very principle: if something becomes widely accepted practice, it can be codified. So if you manage to convince enough people to follow a particular method, you may be lucky with your stuff getting "standardized". </p>
      <p>A.</p>
