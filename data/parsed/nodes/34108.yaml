      <p>I agree with your criticism in principle, but in practice it's very hard to find unusual characters in the glyph palette, especially in OT fonts with 1000s of characters. It always used to bug me looking for the "second" and "minute" in the Symbol font, with only 100 or so.</p>
      <p>Possible negative consequence of this stylistic alternates proposal: a document with a "liter" symbol is set in a font using the "el-to-liter" feature, but then reset in a font that just sets the plain "l"; or the fist comes out as &gt;; or multiply reverts to x, etc. Is that so terrible? Surely the meaning is intact, although some typographic subtlety is lost.</p>
