      <p>&gt; <em>I don’t get the Name line — but then, I’m using CS (not CS2 or CS3) — is that a later addition?</em></p>
      <p>Not sure when it got added, but it's definitely in CS2. It got improved in CS3, where the "Name:" entry was added. The tooltip is also displayed for alternate glyphs and ligatures. In these cases, the Unicode displayed is the one of the base character(s).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/liga_ttip_4415.png"></div><div class="imageWrap"><img src="http://typophile.com/files/smcp_ttip_6559.png"></div><div class="imageWrap"><img src="http://typophile.com/files/ornm_ttip_4713.png"></div><p></p>
      <p>&gt; <em>BTW how does the screen reader handle “second”? — it’s going to get it wrong if it’s supposed to be inches or degree of arc! Those should have separate Unicode points…</em></p>
      <p>I'm not sure how the reader will make the distinction between minutes and feet, or between seconds and inches, given that there's only one codepoint for each. Unicode calls them 'prime' and 'double prime'. <a href="http://www.unicode.org/charts/PDF/U2000.pdf" title="http://www.unicode.org/charts/PDF/U2000.pdf">http://www.unicode.org/charts/PDF/U2000.pdf</a></p>
