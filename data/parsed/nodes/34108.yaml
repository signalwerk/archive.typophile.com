      <p>Kent, Karsten, you're right -- My mistake. For books published in the states, perhaps as a remnant of times when library sales were important to university preses, there was a block of copy furnished by the Library of Congress which was usually printed on the Copyright page. If it was in the book when printed, and in the same form as provided by LOC, the libraries could, in theory, get the books on the shelves faster.</p>
      <p>The content of the copy was inviolate. The form was suppose to be followed as well, but Richard Eckersley (designer of <cite>The Telephone Book</cite>) started a bit of a revolution over that one, so now the form is often more in keeping with the rest of the interior design.</p>
      <p>Anyway, the number I was talking about, my wife informs me, is (she thinks) part of the Dewey Decimal system, and she further informs me that the prime seems to be absent from the newest material.</p>
      <p>Edit:</p>
      <p>For an example: <cite>Retreat from Gettysburg</cite> by Kent Masterson Brown, University of North Carolina Press, ISBN 0-8078-2921-8 &amp; "funny little number" 973.7'349--dc22 (&amp; BTW, my Janson). I have seen the period "interact" with the prime, but don't have one to hand.<br>
