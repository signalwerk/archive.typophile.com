      <p>This thread is quite dated, but I’d like to comment on it nevertheless, because two important aspects are missing from all answers that opposed Nick Shinn’s idea (the second part of it that is).</p>
      <p><strong>1.</strong> Not all text can be controlled by the same person or entity who chooses the font.<br>
      This applies most prominently to the Web where the reader can ultimately choose the font and a multitude of stakeholders can suggest one (or actually more than one). </p>
      <p>Site owners, their designers, editors and authors should enforce the correct character which will have the correct glyph as long as one of the typefaces used supports it, but browser vendors and users may use techniques to correct typographic nonos. This could be done by scripts, e.g. Greasemonkey, that replace <em>characters</em>, but why not let fonts replace <em>glyphs</em> instead?</p>
      <p><strong>2.</strong> Not all of the suggestion are the same.<br>
      There are several legacy characters in Unicode that fulfill multiple functions with a unified glyph. I strongly believe it’s fine for smart fonts to make these characters adapt their glyphs to the context when an appropriate one can be chosen without ambiguity.<br>
      This applies to U+0027 <code>'</code>, U+0022 <code>"</code> and U+002D <code>-</code> most prominently, but maybe , U+0060 <code>`</code> and perhaps U+00B4 <code>´</code> or U+002A <code>*</code> as well.</p>
      <pre><code>@DIGIT = [zero one two three four five six seven eight nine]; 
      # also .*num
      feature <strong>salt</strong> {

      lookup <strong>prime</strong> {
        # second or inch and minute or foot
        # context: following a digit without a space in between
        # U+0027 ' quotesingle ➞ U+2032/02B9 ʹ prime / primemod / minute
        # U+0022 " quotedbl ➞ U+2033/02BA ʺ doubleprime / doubleprimemod / second
        sub @DIGIT [<strong>quotesingle quotedbl</strong>]' by [<strong>prime doubleprime</strong>]; 
      } <strong>prime</strong>;

      lookup <strong>apostrophe</strong> {
        # apostrophe, also Hawaiian okina etc.
        # context: between letters
        # U+0027 ' quotesingle ➞ U+2019/02BC ’ quoteright / apostrophemod
        sub @LETTER <strong>quotesingle</strong>' @LETTER by <strong>quoteright</strong>; 
        # An apostrophe may appear at the start or end of a word,
        # but it then can not be distinguished from a single quote mark reliably,
        # because looking for a matching one can only be done for very simple cases in OT.
        # In English, both look the same at the right-hand side anyway
        # and one could add lexical rules for words where initial apostrophe is common, e.g. ’n’, ’tis.
      } <strong>apostrophe</strong>;

      lookup <strong>quotemark</strong> {
        # default, also English
        # context open: between a space or certain punctuation and a letter or certain punctuation.
        # U+0027 ' quotesingle ➞ U+2018 ‘ quoteleft
        # U+0022 " quotedbl ➞ U+201C “ quotedblleft
        # U+0060 ` grave ➞ U+2018 ‘ quoteleft
        sub @WORDBOUNDARY [<strong>quotesingle quotedbl grave</strong>]' [@LETTER @DIGIT @INITIALPUNCT] 
         by [<strong>quoteleft quotedblleft quoteleft</strong>];
        # context close: between a letter or certain punctuation and a space or certain punctuation
        # U+0027 ' quotesingle ➞ U+2019 ’ quoteright
        # U+0022 " quotedbl ➞ U+201D ʺ quotedblright
        # U+00B4 ´ acute ➞ U+2019 ’ quoteright
        sub [@LETTER @DIGIT @FINALPUNCT] [<strong>quotesingle quotedbl acute</strong>]' @WORDBOUNDARY 
         by [<strong>quoteright quotedblright quoteright</strong>];
        # to do: add localized variants
      } <strong>quotemark</strong>;

      lookup <strong>mathoperator</strong> {
        # U+002A * ➞ U+00D7 × multiply
        # U+002D - ➞ U+2212 − minus
        sub @DIGIT        [<strong>asterisk hyphen</strong>]' by [<strong>multiply minus</strong>];
        sub @DIGIT @SPACE [<strong>asterisk hyphen</strong>]' by [<strong>multiply minus</strong>];
        sub [<strong>asterisk hyphen</strong>]'        @DIGIT by [<strong>multiply minus</strong>];
        sub [<strong>asterisk hyphen</strong>]' @SPACE @DIGIT by [<strong>multiply minus</strong>];
      } <strong>mathoperator</strong>;

      lookup <strong>dash</strong> {
        # U+002D - ➞ U+2013 – endash or U+2014 — emdash
        ignore sub hyphen hyphen' hyphen' hyphen';
        sub <strong>hyphen' hyphen' hyphen'</strong> by <strong>emdash</strong>;
        sub <strong>@SPACE' hyphen' hyphen' @SPACE'</strong> by <strong>emdash</strong>;
        sub <strong>hyphen' hyphen'</strong> by <strong>endash</strong>;
        sub @SPACE <strong>hyphen'</strong> @SPACE by <strong>endash</strong>;
      } <strong>dash</strong>;

      @SIPREFIX = [Y Z E P T G M K k H h D d m micro mu n p f a z y];# without deka
      lookup <strong>litre</strong> {
        # l ➞ U+2113 ℓ litre
        # context: after a digit, perhaps separated by a space, 
        #   perhaps preceded by an SI prefix (1 or 2 letters), not followed by a letter. 
        # only lowercase, because ‘L’ is already an unambiguous variant
        ignore sub <strong>l</strong>' @LETTER;
        sub @DIGIT                  <strong>l</strong>' by <strong>litre</strong>;
        sub @DIGIT @SPACE           <strong>l</strong>' by <strong>litre</strong>;
        sub @DIGIT        @SIPREFIX <strong>l</strong>' by <strong>litre</strong>;
        sub @DIGIT @SPACE @SIPREFIX <strong>l</strong>' by <strong>litre</strong>;
        sub @DIGIT        d [a k]   <strong>l</strong>' by <strong>litre</strong>;
        sub @DIGIT @SPACE d [a k]   <strong>l</strong>' by <strong>litre</strong>;
      } <strong>litre</strong>;

      } <strong>salt</strong>;</code></pre><p>
      Unlike the asterisk, the glyph for the lowercase letter <code>x</code> must not be replaced by the one for times <code>×</code>, because neither is the cross a normal glyph variant (like the script el) nor is the letter a generic/unified character.<br>
      At least the first of these reasons also applies to the suggested fist replacement U+003E <code>&gt;</code> ➞ U+261E  ☞.</p>
      <p>I’m not sure, <code>salt</code> is the best feature for this, though.</p>
