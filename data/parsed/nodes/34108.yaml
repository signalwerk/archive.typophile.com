      <p>Nick,</p>
      <p>For a comp anyway, the best way to enter such characters in InDesign is to enter the the Unicode number, not by using the Glyph Pallet. Using the Glyph Pallet puts all sorts of extra code in the file, which may or may not block other actions, like ligaturing.</p>
      <p>More important is that you kern your minutes/seconds characters (aka prime/doubleprime) properly with all the numbers, and the period (check an ISBN format)</p>
      <p>I suppose less and less composition is being done by compositors &amp; more &amp; more by graphic designers. You know your market. But to take this another step back &amp; let composition fall to the font designer seems fraught with peril.</p>
