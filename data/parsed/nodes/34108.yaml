    html: <p>Nick, when curly quotes are automatically substitued for ' and " keystrokes in InDesign etc. this is a <em>character</em> conversion. When you enter "QUOTE" what ends up in the text string are the curly quote characters U+201C and U+201D, not the keyboard entered straight quote U+0022. Essentially, the application providing users with an input method editor for typographical quote mark characters. This is a very different scenario from what you are proposing, which is a glyph conversion.</p>
