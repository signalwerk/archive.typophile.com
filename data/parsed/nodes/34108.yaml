      <p>&gt; ’ becomes “second”<br>
      &gt; ” becomes “minute”</p>
      <p>You mean: ’ becomes ″(which means "second") and ” becomes ′(which means "minute")??? </p>
      <p>To me, it makes no sense whatsoever. Why would one stroke be replaced by two strokes, and two strokes be replaced by one stroke? </p>
      <p>Well, I know, you made a typo and meant this to be the other way around, but it actually shows very well that your concept is flawed. It defeats WYSIWYG, it defeats Unicode. </p>
      <p>I definitely recommend AGAINST "codepoint hacking", i.e. assigning characters that have their own Unicode codepoints as glyph alternates of characters that have other Unicode codepoints, and are only mildly related by appearance. </p>
      <p>The problem is that you invalidate the principle of "text accessibility". If you lie about the semantic level of text, i.e. you use a hack encoding to represent the litre symbol using the letter "l", then texts encoded electronically using Unicode lose their primary advantage, namely that the encoding of the text is *predictable*. Which means that one can cut-and-paste the text into a different software and he will get an approximation that will be as good as possible, even set in a different font. If the font is not available, the replacement will at least not be awkward. </p>
      <p>What if someone (a disabled person) uses a screen reading software? This software does not "see" the glyphs, it can only read the character encoding out loud. The screen reader software would read "two ex three" instead of "two times three", and "two hyphen five" instead of "two minus five". </p>
      <p>What if somebody is using search-and-replace in the "naiive" hope that what he sees as being a minute or second symbol actually is encoded as such? What if in half of the book typeset using your font the symbol has been typed in using the proper Unicode, and in the other half it was typed in using the hack Unicode with the feature applied? What if then, someone needs to do some text transformation, like global search-and-replace? </p>
      <p>I mean, theoretically, you could put code in your font such as</p>
      <p><code>feature calt {<br>
        sub quotedbl' [A-Z a-z] by quotedblleft;<br>
        sub [A-Z a-z] quotedbl' by quotedblright;<br>
      } calt;</code></p>
      <p>but this is just a nasty hack. The encoding starts to be font-dependant again, and we are back to times where you had to type in "M" to get a "fi" ligature. </p>
      <p>Remember old typewriters on which there was no key for digit "1" because the user was supposed to type in lowercase "l" instead? My mom had one like that. Well, why, it worked fine back then. These two glyphs look as much alike as ″ and ”. </p>
      <p>Adam</p>
