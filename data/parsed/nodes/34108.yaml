      <p><cite>KL: Hello Charles, in ISBN I find numerals with hyphen mostly, do you mean kerning period with minutes/seconds, or period with numberals?</cite></p>
      <p>Karsten, I think Charles meant to reference the LOC CIP listing, not ISBN. In the CIP data (formally: Library of Congress Cataloging-in-Publication Data), there is a catalog string that frequently uses a prime (very often mistakenly converted to an apostrophe by inattentive comps) and which may occur in conjunction with a period (although, off-hand, I can't think of an instance where I've encountered this).</p>
      <p>Charles, did I get that right?</p>
      <p>-- K.</p>
