  - id: 304550
    user: 1844
    date: 2008-10-03T04:40:00
    date_raw: 3 Oct 2008 — 4:40am
    votes: null
    html: |-
      <p>&gt; <em>where do these replacements actually occur? i’m curious. i’m still trying to understand the workings behind the scenes. for example, if you have a font that substitutes f f i (u0066 u0066 u0069) by ffi (uFB03), what problems will arise?</em></p>
      <p>There are no actual replacements in e.g. InDesign. The underlying characters will remain the same when you apply the features; only the displayed glyphs will change. The issues may occur latter when, let's say, you generate a PDF file, send it to someone, and that person tries to retrieve the text from the PDF (or perform a search). If the PDF has a ToUnicode table, the text might come out with U+FB03, instead the original U+0066 U+0066 U+0069. If there's no ToUnicode table in the PDF, the glyph name will be parsed. According to <a class="freelinking external" href="http://partners.adobe.com/public/developer/en/opentype/glyphlist.txt" rel="nofollow">this list</a> the glyph name ffi will correspond to character U+FB03, and according to <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/archives/glyph.html" rel="nofollow">these rules</a> the glyph name f_f_i will be mapped to the characters f, f and i. <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/archives/glyphnamelimits.html" rel="nofollow">This page</a> explains where and why glyph names are used.</p>
      <p>&gt; <em>what will happen if you name the substituted glyph f_f_i and still assign the unicode point (uFB03)?</em></p>
      <p>I think it will depend on how the glyph was inserted, which app generated the PDF and which app reads it and accesses the PDF contents. Ideally, the glyph f_f_i should be unencoded, and a glyph duplicate of it — named uniFB03 (or ffi) — should be the one to carry the encoding. But what you describe is not at all bad. That's actually what we do in our fonts. The reasoning being that we favor the ligature aspect — therefore the glyph name f_f_i and not ffi —, but at the same time we don't want people to get notdefs if the text happens to contain the character U+FB03 — therefore we assign the code point.</p>
