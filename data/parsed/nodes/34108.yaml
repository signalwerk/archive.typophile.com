      <p><em>That assumes that the effect of case feature substitutions is always equivalent to a baseline shift...</em></p>
      <p>That wasn't my assumption, although I did express myself sloppily. Although I didn't say "some of" the alternate glyphs, I didn't mean *all* of the substitutions are equivalent to baseline shifts.</p>
      <p>I was just giving an example of how a font can solve a layout application difficulty.</p>
      <p>And really, isn't that how OpenType features work? The substitution coding is in the font.<br>
      It would in theory be possible to just name the glyphs in a font, and have the app do the substitutions. For instance, with "one.numr", "fraction", and "nine.dnom" as font glyphs, an application fraction-maker could construct 11/99.</p>
      <p>I would imagine that might be how Adam's putative CS5 math engine would work.</p>
