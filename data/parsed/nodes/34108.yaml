      <p>"Smarty Pants" are an extension of the keyboard driver -- assisting the user in typing in the correct Unicode. That's perfectly fine, because what ends up in the electronic text is Unicode-compatible, i.e. is what everybody expects. </p>
      <p>The advantage of a standard is that it is a standard. Unicode has great chances to become THE standard to encode human writing (except perhaps for CJK languages that have some alternatives). </p>
      <p>The WYSIWYG principle (What You See Is What You Get) these days is not only limited to "what you see on screen is what you get on the printer". It also means "what you see on screen is what you get when you copy-paste or search". This is why Adobe-compliant glyph names are important, and this is why adherence to the Unicode standard is important. </p>
      <p>Adam</p>
