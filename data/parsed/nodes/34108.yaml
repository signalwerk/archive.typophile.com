      <p><em>For example, many PC users are used to the automatic replacement of 1/2 to ½ and of (C) to ©.</em></p>
      <p>But these are character-level substitutions performed by the application. So what ends up in the text string when (C) is coverted to © is © not (C). If this substitution were performed at the glyph level, then the text string would remain (C), which is not the copyright symbol.</p>
