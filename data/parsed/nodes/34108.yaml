      <p>I agree with John.</p>
      <p>Many of Adobe's early Pro fonts have similar kinds of substitutions (e.g. in Warnock Pro the ornaments are alternates of lowercase Latin letters), but this is not really a good practice*. These and other substitutions (like <code>sub [a A] by ordfeminine;</code>) were implemented in the font to make its usage convenient from the user's POV, but they're not good because they replace character(s) by other character(s). On the other hand, a substitution like <code>sub a by a.superior;</code> is perfectly legitimate, as long as 'a.superior' is left uncoded. (FWIW, a superior variant of the lowercase 'a' is not present in Unicode; although 'a.superior' and 'ordfeminine' U+00AA might look alike and even share the same glyph form, they are semantically different)</p>
      <p>The bottom line is, OpenType layout (OTL) should not be involved in character transformations. The user is the one responsible for encoding his/her message appropriately, and this means using the correct codepoints, even if these are not readily accessible from the keyboard. The function of OTL is to style the message/content, not to alter it.</p>
      <p>* Unlike the 'fist', which is encoded in Unicode, ornaments are an interesting case because they don't have their own codepoint, so how should we access them/provide access to them? The current practice we're using is to treat them as alternates of the 'bullet'. This treatment does not apply to dingbats and other symbols such as arrows, since these generally have their own Unicode codepoints.</p>
