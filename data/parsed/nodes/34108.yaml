      <p>I think the superior ideas are fine. There are quite a lot of characters that may take superior forms in some kinds of publications, and most do not have dedicated superior encodings in Unicode. So using the 'sups' layout feature is the obvious and legitimate way to access them.</p>
      <p>But I disagree with your proposed stylistic alternates, because all the target glyphs do have their own Unicode encodings, and if someone wants those specific forms then they should use the appropriate characters, not disguise other characters as them. The fact that lots of people type x instead of × doesn't mean that the latter is a stylistic variant of the former; it just means that those people are using the wrong character. And who says that the fist is a stylistic variant of &gt;? why not a stylistic variant of •? Thankfully, we don't need to play such guessing games, because we have ☞</p>
