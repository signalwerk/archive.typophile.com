      <p>Nick: <em>It can be useful. The alternate glyphs in the case feature, for instance, solve an application problem (manual application of baseline shift) by automatically repositioning punctuation such as parentheses.</em></p>
      <p>That assumes that the effect of case feature substitutions is always equivalent to a baseline shift, but this is not so. case feature substitutions may involve changes to the form of glyphs as well as to their vertical positioning, not to mention spacing. In fonts in which the default numeral forms are oldstyle, it makes sense to put mappings to lining numerals in the case feature. So the case feature is not simply doing in the font what could be done at the application level: it is things that are glyph centric and need to be controlled at the font level.</p>
      <p><em>John states that fonts shouldn’t attempt to fix application shortcomings with hacks, but the converse is exactly what apps do with faux features.</em></p>
      <p>And I likewise think that they should not or, at least, should not do so automatically. If, when the user clicked the italic button in Word, for example, a dialogue popped up saying</p>
      <p>'The font family you are using does not include an italic font. Do you want Word to slant the regular font to fake an italic?'</p>
      <p>that would be preferable to automatic slanting.</p>
