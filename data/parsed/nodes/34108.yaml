      <p>where do these replacements actually occur? i'm curious. i'm still trying to understand the workings behind the scenes. for example, if you have a font that substitutes f f i (u0066 u0066 u0069) by ffi (uFB03), what problems will arise? what will happen if you name the substituted glyph f_f_i and still assign the unicode point (uFB03)?</p>
