      <p>Adam: <em>What if in half of the book typeset using your font the symbol has been typed in using the proper Unicode, and in the other half it was typed in using the hack Unicode with the feature applied? </em></p>
      <p>I see what you mean. Or if a typographer has already been through the text and changed all the "x"s to faux "multiply", using my suggested Stylistic Alternate feature, and then the font is changed to one without such a feature, it would be a pain to have to do it all over again with the correct Unicode procedure.</p>
      <p>So I'm conviced it's a *bad idea* and won't do it in any fonts.</p>
