      <p><em>Any good models to follow?</em></p>
      <p>set your font to unicode mode and then go to gylphs &gt; sort glyphs &gt; by encoding. then switch to index mode and you can drag things around to where you'd like them to be. once you have everything set, you can save a custom encoding, next time you want to sort glyphs, set font to names mode, select your custom encoding and then go to glyphs &gt; sort glyphs &gt; by encoding. if there are any characters that are outside this encoding, you can again switch to index mode and move glyphs around as you like.</p>
    html_clean: |-
