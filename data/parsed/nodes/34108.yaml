    html: |-
      <p><em>...they should not or, at least, should not do so automatically.</em></p>
      <p>The same is true of "SmartyPants", and "Typographic Quotes", which is a default of InDesign, isn't it?</p>
      <p><em>Yes, some apps still maintain the faux italic for backward-compatibility reasons.</em></p>
      <p>I don't think that's the main reason. It's because application engineers think their application can fill in the gaps in a font family, and they believe it's a genuine service to the user to do so. For instance, InDesign offers users small caps of any font, even those with no true small caps.</p>
      <p><em>no need or reason to come up with NEW solutions that still follow this old-style way of thinking.</em></p>
      <p>The need for Smarty-Pants: typographers hate seeing hash mark quotes and apostrophes, and if Smarty can fix that, they don't mind the hack, even if it screws up abbreviations like '07. </p>
