    html: "<p>Paul, fractions are an interesting case. A fairly small subset of common fractions happens to be encoded in Unicode as precomposed characters, e.g. ⅛; so far as I can gather, most of these encodings are for backwards compatibility. But fractions are by their nature generative and one very quickly exceeds that set of common fractions if one starts doing things with them: a fraction is, after all, a mathematical expression, a way of writing a division operation. So the logical way to encode fractions is as numerals separated by an operator: 1/8.</p>"
