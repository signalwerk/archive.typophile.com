    html: <p>As was brought up in <a href="http://www.typophile.com/forums/messages/83/24826.html?1075471587">the recent thread</a>, the ITC version is not the same as the version shown in Richard's sample, especially in the lowercase. The original Bookman Italic had a slanted roman lowercase, not the cursive italic of the ITC version. This is the biggest difference between the two. There are also a lot of other less obvious differences.</p>
