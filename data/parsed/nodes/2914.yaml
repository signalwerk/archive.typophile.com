    html: "<p>Sorry, Adriano, I wasn't sure what you meant when you then showed the ITC version. <br> <br>For the benefit of anyone who would like to see the differences between the two: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/25242.gif\" alt=\"bookmans\"> <br> <br>It's too bad that the original has not made it to the digital realm. (Supposedly, Castcrafters did one, but it's apparently no longer available. Bitstream has a version, but no swashes and no Bold or Bold Italic.) It's not exactly fashionable, but it's an historically significant face.</p>"
