    <p>Hi everyone,<br>
    I'm fairly new to the typography community, although I have been using FontStruct for a while. I'd like to move on to non-modular typography but I'm not sure which font maker to buy. Should I use FontLab, FontCreator, or FontForge? Or is there an even better one?</p>
    <p>Some requirements are:<br>
    OpenType ligature support<br>
    Anti-aliasing /supersampling options (not necessarily ClearType)<br>
    FULL Unicode support, including private use</p>
    <p>Some things I'd like:<br>
    Macros for adding diacritical marks, super/subscript, &amp;c.<br>
    Ability to export to SVG</p>
    <p>Thanks,<br>
    truth14ful</p>
    <p>PS: I have tried making a few glyphs in SVG, but it was very slow and not visual in any way. I'd like a program that doesn't require this.</p>
