      <p>I’ve switched from Fontlab to Glyphs.</p>
      <p><cite><br>
      OpenType ligature support<br>
      Anti-aliasing /supersampling options (not necessarily ClearType)<br>
      FULL Unicode support, including private use<br>
      </cite></p>
      <p>Glyphs handles Unicode and OT ligatures automatically provided you use correct glyphnames. Name your glyph uniE020 or f_f_j and everything's alright.</p>
      <p>Not sure what you mean by anti-aliasing options.</p>
      <p><cite><br>
      Some things I'd like:<br>
      Macros for adding diacritical marks, super/subscript, &amp;c.<br>
      Ability to export to SVG<br>
      </cite></p>
      <p>Diacritics handling in Glyphs is the best I’ve seen so far since it makes extensive use of anchors. Glyphs also has a few options for realtime manipulation of multiple glyphs. Plus, just like Fontlab and Robofont, it has a Python interface, so you could write your own macros.</p>
      <p>Exporting to SVG? Use Fontforge.</p>
