    html: |-
      <p>AFAIK, all those mentioned can do OT ligatures (and other features) and the PUA in their sleep. The PUA is just a range, after all. Same with the GASP table (which lists at which pixel size ranges the MSWindows renderer should apply hinting or smoothing (anti-aliasing)).</p>
      <p>Ware, FontForge is not install-and-go. There is at least one pre-packaged Windows version, I think, mentioned elsewhere on Typophile, but its primary distro is source-only. Makes sense, since its target is Unix/Linux machines, and these vary a lot.</p>
      <p>Can't tell you how FF feels in use, since I never compiled X on my LinuxFromScratch5.* box and can thus only run it in scripting mode.</p>
      <p>If you are a Python programmer or hacker, FontLab and FontForge will both integrate with Python.</p>
      <p>Remember, the payware font editors do come with explicit support, possibly some hand-holding as well.</p>
