      <p>IIRC, there are two paths from [OT]TF to SVG: <a class="freelinking external" href="http://fontforge.sourceforge.net/" rel="nofollow">FontForge</a> and <a class="freelinking external" href="http://xmlgraphics.apache.org/batik/" rel="nofollow">Batik</a>. I think <a class="freelinking external" href="http://www.inkscape.org/" rel="nofollow">Inkscape</a> has SVG as its native format. Some folk like to draw their glyphs in Inkscape and then pull them into FontForge.</p>
      <p>Seems to me that lots of folk here swear by FontLab. Or at it. Sometimes even both.</p>
