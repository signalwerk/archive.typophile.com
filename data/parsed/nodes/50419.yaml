      <p>There have been countless rips of Hermann’s work over the last 5 decades. Although it is strikingly similar to Michaelangelo let me make a few observations. There was never an italic, it is too bold and the R is not right as well as many of the serifs. Possibly phototypositor magic and a bit of noodling.</p>
      <p>Michael</p>
