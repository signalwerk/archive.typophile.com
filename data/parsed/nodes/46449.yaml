      <p>I don't think the illustration is cheesy. On the contrary - just the text would probably have difficulties standing out. I think you could even enlarge the illustration somewhat (and perhaps place the quill in the ink bottle) to give it increased emphasis.</p>
      <p>Is there a particular reason why you have chosen oblique Courier for the text? Given the style of your home page, I guess your intention might be to resemble typwriter text. In that case, it might be better to use an upright style. On the other hand, given the feather pen, a script style would perhaps be more suitable. Also, the text would probably be easier to read if the letters were not outlines.</p>
      <p>Just my two nickles.</p>
      <p>/Måns</p>
