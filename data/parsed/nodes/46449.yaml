      <p>Seen in your post, it looks decent.  Seen in context of your website, it falls a little flat.  The separation between the first and second lines of text suit the placement of the quill but not the integrity of the interaction of the text.  I'd like to see the quill interact with the well, and then those two elements correspond with your text.  Furthermore, don't neglect to take Måns's suggestions into account.</p>
      <p>--<br>
      Nick Hladek</p>
