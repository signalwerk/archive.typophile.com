    <p>The SignWriting script is universal for the sign languages of the world.  Any sign language can be written by hand or with a computer  using the SignWriting script.</p>
    <p>For computers, individual symbols were designed that represent hands, actions, locations, timing, dynamics, punctuation, and more.<br>
    <a href="http://signbank.org/iswa" title="http://signbank.org/iswa">http://signbank.org/iswa</a></p>
    <p>The individual symbols are used in 2-dimensions to create meaningful signs that equate to a word.</p>
    <p>The SignWriting standard currently uses SVG and a lite ASCII markup to support the script.  The ASL Wikipedia is a great example.  It has over 50 articles.  It uses the Vertical Writing Mode which is available everywhere but in Firefox.<br>
    <a href="http://incubator.wikimedia.org/wiki/Wp/ase" title="http://incubator.wikimedia.org/wiki/Wp/ase">http://incubator.wikimedia.org/wiki/Wp/ase</a></p>
    <p>3 years ago, Typophile members helped me automate the construction of a truetype font using FontForge.  We were able to load 37,811 glyphs indexed against 674 PUA Unicode characters.<br>
    <a href="http://signpuddle.net/iswa/#smartfont" title="http://signpuddle.net/iswa/#smartfont">http://signpuddle.net/iswa/#smartfont</a><br>
    <a href="http://typophile.com/node/78542" title="http://typophile.com/node/78542">http://typophile.com/node/78542</a></p>
    <p>Additionally, we were able to leverage Graphite to support the 2-dimensional nature of SignWriting with an additional 505 PUA Unicode characters.</p>
    <p>If you install the 6 MB font file, you can see the experimental smart font in action on the SignWriting Font test page.  It requires Graphite which is enabled in Firefox by default.<br>
    <a href="http://signpuddle.net/iswa/swfont_test.html" title="http://signpuddle.net/iswa/swfont_test.html">http://signpuddle.net/iswa/swfont_test.html</a></p>
    <p>For the official Unicode specification, the SignWriting symbols were split from the 2-d layout characters. The first proposal has passed through the various committees and will be released in Unicode 8 next year.  </p>
    <p>The second proposal to handle the 2-d layout has not been started.  A working character prototype is available with Private Use Area Unicode characters and the TypeType Font listed above.</p>
    <p>Currently, there is no font that supports the Unicode 8 characters for SignWriting symbols.  I would like to help to create such a font.  Recently, I found the specifications for SVG Glyphs in OpenType Fonts.  I wish this would have existed 3 years ago.</p>
    <p>The ISWA 2010 SVG Refinement is a 2-color font where every symbol is a described as a unique glyph with an SVG string. Each glyph is identified by 1 to 3 Unicode characters on plane 1. There are 37,811 glyphs in the font.<br>
    <a href="http://signpuddle.net/iswa/#unicode8" title="http://signpuddle.net/iswa/#unicode8">http://signpuddle.net/iswa/#unicode8</a></p>
    <p>I have a data file which contains the raw material needed to create a working OpenType Font based on SVG Glyphs. Inside is a text file with 37,811 lines. Each line starts with the Unicode 8 name, followed by a tab, followed by the SVG.</p>
    <p>ISWA 2010 SVG Glyphs with Unicode 8 names 1.1 MB zipped, 24 MB unzipped<br>
    <a href="http://signpuddle.net/iswa/iswa_unicode.zip" title="http://signpuddle.net/iswa/iswa_unicode.zip">http://signpuddle.net/iswa/iswa_unicode.zip</a></p>
    <p>The first 2 lines look like this<br>
    <code><br>
    u1D800  &lt;g&gt;&lt;path...<br>
    u1D800_u1DAA1   &lt;g transform=...<br>
    </code></p>
    <p>I am hoping to automate the construction of an OpenType Font for SVG Glyphs.  If any additional information or data is required, I can provide or reformat as needed.</p>
    <p>If you have any ideas, I would appreciate the help.  In theory, the project should be quick if I knew the right tools or knew the right freelancer.  </p>
    <p>Thanks for reading.<br>
    -Steve</p>
