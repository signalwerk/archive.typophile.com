      <p>Thanks everyone. I had started thinking it must be hand drawn, but I just saw that the same font is used all over their website for menu titles (<a href="http://www.blueoystercult.com/Band-main.html">http://www.blueoystercult.com/Band-main.html</a>). I am going to try to contact the webmaster to see if I can find out what they used, as the titles are all graphics. We'll see. </p>
      <p>Thanks again!</p>
