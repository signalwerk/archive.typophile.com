    html: |-
      <p>It reminds me of Neville Brody's <a href="http://new.myfonts.com/fonts/adobe/insignia/insignia-roman/characters.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Insignia</a> if you stripped it down and melted a bunch of it away, so to speak.</p>
      <p>Note that there is an alternate S sort of like the logo's. Even the lines through the stems have an echo in the logo, as do the foot serifs on the the L's. </p>
      <p>Saying all this only means I am suggesting maybe Insignia helped inspire the logo lettering, but I don't think the logo is a font. It is simple enough to have easily been hand-drawn.</p>
      <p> - Mike Yanega</p>
    html_clean: |-
