    <p>Hi everyone,</p>
    <p>While I’ve been a member here for some time, and had an interest in type design for probably just as long I haven’t really posted here a lot. I will be seeking critique on my fonts upon me reaching something of substance that I need help with, but that’s along way off. I hope to get to know many of you over the next few months.</p>
    <p>If you want to check some of my work out,<br>
    My formal portfolio is <a href="https://web.archive.org/web/20081013104717/http://davethedesigner.net/">here</a></p>
    <p>and</p>
    <p>My Path to Type Blog logging my progress is <a href="https://web.archive.org/web/20081013104717/http://pathtotype.blogspot.com/">here</a> </p>
    <p>The more people looking at my blog, the more pressure on me and the less chance I slack off!</p>
    <p>ta!</p>
