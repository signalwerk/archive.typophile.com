    <p>By sheer accident while researching for an article I came accross a free font download from General Mills... Alpha-Bits font!</p>
    <p></p><div class="imageWrap"><img src="/files/Alpha-bitsTypophile.png"></div><p></p>
    <p>So if any of you need a tasty new font for FREE, <a href="http://www.thinkalphabits.com/alphafont.html" target="new"><strong>here ’tis</strong></a>.</p>
    <p>They even have an Alpha-Bits font EULA :-)</p>
    <p>Plus they try to educate cereal munching kids about the <a href="/wiki/orgins%252Bof%252BLETTERS" class="wiki-create">orgins of LETTERS</a>!
    </p><ul><strong>Who Invented Letters?</strong><br>
    Writing hasn’t been around for very long, relatively speaking of course. It was invented much later than drawing and building, but it’s just as important.
    </ul>
