    html: <p>At the very least re-make the images for the menu and the header, they look a bit rough.  Or change the menu to text instead.  I also notice the center header is not flush with the sidebars.  Another possible change would be making the image box a standard height, regardless of image size. This would lock the product pages into a uniform grid, rather than where it waves up and down depending on product images</p>
