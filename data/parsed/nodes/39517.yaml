      <p>Oops. Just noticed that Tony was looking for suggestion on the logo, not the website as such :(</p>
      <p>Frankly, it’s not a script face I particularly like. Even here it’s a bit all over the place.</p>
      <p>Yeah, your right. Luxury brands generally have just beautiful type nicely spaced. Besides, as a general rule of thumb, if the name is expressive, then keep the graphic simple. Blissful Couture even in this text, communicates a lot, so perhaps go for just a nice typeface. Warnock come to mind. </p>
      <p>What may be really cool would be to use:<br>
      <a href="http://www.optimo.ch/pages/departement/view_font.php" title="http://www.optimo.ch/pages/departement/view_font.php">http://www.optimo.ch/pages/departement/view_font.php</a></p>
      <p> </p><div class="imageWrap"><img src="/files/Bliss_6690.jpg"></div><p></p>
