    html: <p>I was thinking (before I even looked at your wordmark) the name looks as if  it would be nice in a Spencerian Script. You guys beat me to it. I think the only change that could be made would be to not have a Rasterized image of the wordmark. Also create an initialized version of the type, i.e. “BC”. Also mess around with the composition and placement of the words “blissful” and “couture”.</p>
