    <p>So, I just started a webstore @ <a class="freelinking-external" href="http://www.blissfulcouture.com">http://www.blissfulcouture.com</a>.  We sell luxury goods at discount prices.  The target audience is women of all ages.  The savvy internet shopper would probably be the main demographic; the ability to recognize a deal should influence one’s decision to purchase at our site.  </p>
    <p>So, most luxury logos I see are simple - text on solid backgrounds, etc.  I would like the same for ours but I’m curious as to what I’d be looking to do.  Obviously our current logo (if it can be called that) is awful and we need to do something pronto.  </p>
    <p>Any help is appreciated.</p>
