    html: |-
      <p>A few more possibilities:</p>
      <p>:: Avoid the bevel effect on the flag for the language options. It takes away from the premium look a bit. </p>
      <p>:: Probably not have the menu run so close to the logo. Would it be an idea to relocate it horizontallly in a slim strip below the black band?</p>
      <p>:: Could take the currency and brand selectors also into the lower band to avoid clutter on the top of the page. </p>
      <p>:: A relatively large image, some kind of headline, or even a fine pattern on the home page may set the tone of the brand. Right now it seems to get transactional too soon. Even if they are dicounted, you may still want to communicate that they are luxury products.</p>
