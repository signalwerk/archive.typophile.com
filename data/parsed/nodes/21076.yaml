    date: 2006-07-03T16:15:00
    date_raw: 3.Jul.2006 4.15pm
    votes: null
    html: |-
      <p>I had two HPs in a row start being fussy about picking up paper after 2 years, so I decided to switch to Epson since it doesn’t pick it up, but has gravity helping feed it.</p>
      <p>Also since most of my output is for the web, and I rarely print anything important, I decided to stop buying expensive printers. I just got an R300 for $79 with a coupon about a year ago at Costco. It does a decent job. I have to say I’m satisfied with it.</p>
      <p>Someday when money isn’t so tight, I’ll splurge on a decent one again that prints up to 13”x19”. I have a bunch of expensive oversized paper to use up. But I don’t think I’ll buy HP again because of the pick-up thing.</p>
