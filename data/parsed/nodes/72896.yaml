      <p>The heading is a special version of DTL Caspari Bold and the text typeface is a special version of DTL Porta.<br>
      Read more about it in the Nieuws section of the Dutch Type Library website. (Fonts voor tabloids)<br>
      <a href="http://www.dutchtypelibrary.nl/" title="http://www.dutchtypelibrary.nl/">http://www.dutchtypelibrary.nl/</a></p>
      <p>Pieter</p>
