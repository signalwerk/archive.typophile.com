      <p>IMO, the by far best font manager for Windows currently available is Bitstream Font Navigator 5.0. Unfortunately, it’s not available stand-alone but only bundled with Corel Draw 12. </p>
      <p>I’m looking forward to Linotype releasing FontExplorer X for Windows. Currently, Linotype only offers a Mac version of their free font manager: <a href="http://www.fontexplorer.net/" title="http://www.fontexplorer.net/">http://www.fontexplorer.net/</a> </p>
      <p>Regards,<br>
      Adam</p>
