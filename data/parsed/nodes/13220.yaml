    <p>I need to find a  typeface that when you see it inmediately you think: Latino América.<br>
    Is there such thing as »recognizable« Latin American typefaces? or typefaces that people<br>
    could define as such, as is the case for example of Cheltenham, Century,<br>
    News Gothic, Goudy in North America?</p>
    <p>Thanks</p>
    <p>Patricia</p>
