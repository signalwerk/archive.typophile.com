      <p>That's a very good question. There are certainly fonts that stereotype Latin America, or have been used so often for Latin American content that they have become falsely associated with the culture (<a href="http://www.fontshop.com/showfont.cfm?fid=LH.398.0.0" rel="nofollow">Lithos</a>). </p>
      <p>For something authentic I'd look to almost anything by <a href="http://www.kimera.com.mx/mac/tipoinicioing.html" rel="nofollow">Gabriel Martínez Meave</a>.</p>
