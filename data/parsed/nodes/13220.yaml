      <p>Well, Optima could qualify as a latin american looking face as I find that it shares some similarities with Gabriel Martinez's work.</p>
      <p>A very popular byble edition the "Biblia Latinoamericana" is set on Korinna, indeed many ITC and Bitstream "ugly" faces with a naive charming intention may match this kind of look such as Belwe, Benguiat, Seagull or Souvenir.</p>
      <p>I think that the essencial characteristic behind this look is the hand carved or hand made quality, which is present in many in the previously posted examples.</p>
      <p>Stephen, you're welcome.</p>
      <p>Héctor</p>
