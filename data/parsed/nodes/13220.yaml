    html: <p>Bureau Grotesque (once labeled as having "too much salsa" by the AD of Time Mag.), Giza, Rhode and now FB Titling Gothic are all working hard down there. In addition, Cyrus' faces, like Prensa and Dispatch do very well. We've been doing a lot of custom work and licensing in L.A. (admittedly a huge place), over the past 10 years. I'm not sure if this is because we speak the language (literally), or our fonts do, but having exchanges with designers, editors and publishers every week, if not every day, also helps. By and large, I feel L.A. publications, ones that must attract L.A. audiences in the 100's of thousands, are drawn to organic, hand-made-looking and humanist inspired fonts rather than modernist, computer modernist styles, or anything "Germanic" (whatever that is). We are expecting to see, in the next 2-5 years, much more home rown design there and expect it to go along these same stylistic lines, but who knows.</p>
