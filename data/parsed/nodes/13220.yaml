      <p>Patty,</p>
      <p>I wouldn't say there's a particular type to associate with Latin-America, since our foundries -when printing started in America- used European material for their labour (mostly). Even though, modern attempts have been made. Héctor's fonts are a good example, in my opinion. </p>
      <p>....................</p>
      <p>I am not sure if the following can help you, but anyway I post it. These are some qualities I have noticed in present, hand-drawn lettering in my homecountry (México). Maybe it could help you when choosing your type. At least, the display type.</p>
      <p>Corrosion (due to climate factors or to cheapness of materials)<br>
      Irregular baselines<br>
      Elaborate -almost Victorian- ornamentation (outlines that outline outlines!)<br>
      Lack of mechanical precision<br>
      Colour explosion (primary colours). Words might even have different colours to them in a single sentence.<br>
      Mixed use of serifs in the same "font".<br>
      Mixed use of bold type along with italics set in smaller sizes and in diagonal angles.<br>
      Lots of ornamental "dingbats" like stars, dots, lines...<br>
      A lot of signs are still done by hand and not by computer. A colleague of mine has a formal training in Graphic Design, but still makes hand-rendered signs for several clients.</p>
      <p>There's even a design style in vogue in México called Feísmo ("uglyism" is my free translation of the term). Some fonts have been made with that approach in mind (I recall "Luchita Payol" from Edgar Reyes, another colleague of mine- you can ask him for samples at <a href="mailto:fabrikavisual@hotmail.com">fabrikavisual@hotmail.com</a>).</p>
      <p>.................</p>
      <p>Of course there are stereotypes, but stereotypes are not to be avoided without a second thought. Stereotypes have the great advantage of aiding in easiness of communication. I have seen lots of (in my opinion: farfetched) type from US products that try to depict Latin-America. Although they seem to me to be more a Tex-Mex result, they actually convey the flavour of the latin countries to the US people due to repeated media exposure.</p>
      <p>..................</p>
      <p>I wouldn't say Lithos would be the wisest choice. I would go for a more grungier contour...</p>
      <p>..................</p>
      <p>I am living in München. If I can be of any further help for your project, feel free to contact me at <a href="mailto:moshdesignerERASETHIS@yahoo.com">moshdesignerERASETHIS@yahoo.com</a></p>
      <p>-Mosh</p>
