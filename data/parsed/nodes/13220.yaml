    html: |-
      <p>I'm with the folks who advocate avoiding stereotypes. I live in an area that has a 40% Hispanic population, and there are a couple of free Spanish-language newspapers available at the bus stop I use every day to get to work. Every now and then, I pick up a copy and use my VERY limited knowledge of Spanish to see what's buzzing among many of my neighbors. Being typographically inclined, I also notice that there is precious little, typographically speaking, to distinguish these publications from the others, all written in English for English speakers, that are available at the bus stop.</p>
      <p>So, if you want to know what constitutes up-to-the-minute Latino typography, visit Spanish-langauge websites, go to a library and check out their Spanish publications, or hang out at bus stops.</p>
    html_clean: |-
