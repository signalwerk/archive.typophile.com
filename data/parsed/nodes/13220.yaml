      <p>Patty, latin american typographic scene has been under great efervescence during the last three or four years. Since then some quality foundries have appeared and as Stephen Coles noted every place is developing it's own characteristic work.</p>
      <p>Gabriel Martínez is a must, he is actually the most oustanding mexican typographer, but south america -specially Argentina- has a more developed type scene. To my eye Alejandro Lo Celso's work has a very refined latinamerican taste.</p>
      <p>I can only say that there is not enough tradition in latin american type as to have characteristic faces yet. If I had to define the distinctive characteristic of latinamerican typefaces of the last years I would say that chunkyness, quirkness and organic angularity, but there are as well another trends towards, voluptuosity and roundness.</p>
      <p>You may want to read this interview "Latin Alphabet in Latin Hands"<br>
      <a href="http://www.typofonderie.com/gazette/articles/latintype" title="http://www.typofonderie.com/gazette/articles/latintype">http://www.typofonderie.com/gazette/articles/latintype</a></p>
      <p>Letras Latinas (Latinamerican type biennial)<br>
      <a href="http://www.letraslatinas.com" title="http://www.letraslatinas.com">http://www.letraslatinas.com</a></p>
      <p>Look at Alejandro Lo Celso's work<br>
      <a href="http://www.pampatype.com" title="http://www.pampatype.com">http://www.pampatype.com</a></p>
      <p>This site shows work from various argentinian designers<br>
      <a href="http://www.sudtipos.com/" title="http://www.sudtipos.com/">http://www.sudtipos.com/</a></p>
      <p>This site shows work from various chilenian designers<br>
      <a href="http://www.tipografia.cl/" title="http://www.tipografia.cl/">http://www.tipografia.cl/</a><br>
      The site is in remodelation so try this(<a href="http://www.tipografia.cl/sitioantiguo/index.htm" title="http://www.tipografia.cl/sitioantiguo/index.htm">http://www.tipografia.cl/sitioantiguo/index.htm</a>)</p>
      <p>Héctor</p>
