      <p>The source was from Grafik magazine and the logo was designed by Neil at Design n/a. He was good enough to tell me he drew th V from a letraset font he had called Madelaine. The rest of the type is set in Carousel.</p>
      <p>Octopuss is pretty similar so maybe that is the closest thing that is digitised.</p>
