    html: <p>Not knowing much about Flash, an obvious question is, "Does an embedded version Verdana (with the real Verdana removed from the machine) display correcty?" <br> <br>If so the problem would most likely be with Frutiger. Maybe use Font Validator to see if all the codepage and Unicode range bits are set correctly, or if the font has other errors.  <br> <br>If the embedded Verdana fails then the problem is likley with Flash itself - either in it's Unicode support or in it's subsetting of the font (removing the Polish characters). <br> <br>Si</p>
