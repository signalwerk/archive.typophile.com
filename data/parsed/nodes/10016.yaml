    date_raw: 1 Apr 2005 — 5:45pm
    votes: null
    html: <p>Thanks Ricardo, will have a look at the Cs again. I wanted something not quite vertically symmetrical, if you know what i mean, kind of like a vertically flipped version of Rotis' Cs, but i might need to re-think this. Never been the biggest fan of Rotis myself. <br> <br>Anyone know of a good face with a balanced, vertically asymmetrical C? <br> <br>And I do need to exaggerate the triangular cust in the counters of P &amp; R. Even though they're not truly closed counters already, it is such a small gap and small angle, that when printining it out, it fills in on a laser printer. <br> <br>Thanks for all your feedback so far guys, it's very much appreciated. And I will let you know how the competition goes.</p>
