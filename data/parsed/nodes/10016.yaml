    <p>Okay, so this a little daunting, putting this out for some people with experience to see, but here it is: <br> <br>&lt;img&gt; <br> <br>Couther Sans is a typeface I am designing for the DIA (Design Institute of Australia) Student Design Awards, I've explained the brief and my rationale in the pdf further below. <br> <br>As this is for a competition, I chose only the weight I thought most elegant: light. I am trying to work off stereotypes of uncouth Aussies (thus, Couther Sans), and wanted the most sleek and modern feel I could get. However, this would be used more for display sizes, thus the "display" tagged on the end, although the face is intended also for body copy. <br> <br>There are little ink traps in it (very small) because it is intended for display sizes. <br> <br>Please, I would love any and all feedback, even harsh critiques are welcome. I've done a handful of other fonts before, a hand script, a type revival and a typeface that was half-done and then lost in a hard drive incident, but nothing designed for body text. <br> <br>This incarnation must be ready by the end of next week, however more detailed feedback for when I develop the complete family is also welcome. The alphabet and numerals are done and ready for tweaking, the analphabetic glyphs including punctuation are yet to be done, or we just thrown together for this sample sheet. <br> <br>Sorry if I've rambled. <br> <br></p>
