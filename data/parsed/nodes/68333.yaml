      <p>Hi Dösi,</p>
      <p>in addition to Dan’s article (which omits the Kurrent genre, the script equivalent of <em>Gebrochene Schriften</em> – I suppose deliberately, as it never was significant in typography), there’s also the classification that <a href="/node/add/wiki?edit%5Btitle%5D=Judith%20Schalansky" title="Create node &quot;Judith Schalansky&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Judith Schalansky</a> uses in her <a href="http://typographica.org/2010/typography-books/fraktur-mon-amour-2nd-edition/">Fraktur Mon Amour</a> – basically a similar approach, with a finer differentiation of experimental (display) styles, see <a href="http://www.fontblog.de/picts/FrakturMonAmour.pdf">this overview PDF [3.8mb]</a> by Fontblog.de.</p>
      <p>As you speak German, see also the <a href="http://www.typografie.info/typowiki/index.php?title=Gebrochene_Schrift">TypoWiki</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Wolfgang%20Beinert" title="Create node &quot;Wolfgang Beinert&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Wolfgang Beinert</a>’s <a href="http://www.typolexikon.de/g/gebrochene-schriften.html">Typolexikon</a>, and <a href="http://www.beepworld.de/members66/vau-ef-be/gebrochene.htm">this article</a> by <a href="/node/add/wiki?edit%5Btitle%5D=Bernhard%20Schnelle" title="Create node &quot;Bernhard Schnelle&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bernhard Schnelle</a>. Offline reading recommendation: <a href="http://www.typografie.de/product_info.php?products_id=389&amp;cPath=">Fraktur</a> by <a href="/node/13549" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albert Kapr</a>.</p>
      <p><cite>a guide out there that breaks up blackletter forms to it's very basic elements</cite></p>
      <p>Do you mean a list of form details like the <a href="http://www.fontshop.com/fonts/downloads/elsnerflake/neue_luthersche_fraktur_ot/?&amp;sample_text=ABFLMNPRVWY&amp;update=0">Elefantenrüssel</a> [‘elephant's trunk’]? I’m not aware of such a guide.<br>
      F</p>
