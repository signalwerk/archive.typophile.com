      <p>Hi Dösi,</p>
      <p>in addition to Dan’s article (which omits the Kurrent genre, the script equivalent of <em>Gebrochene Schriften</em> – I suppose deliberately, as it never was significant in typography), there’s also the classification that <a href="/wiki/Judith%20Schalansky" class="freelinking" rel="nofollow">Judith Schalansky</a> uses in her <a href="http://typographica.org/2010/typography-books/fraktur-mon-amour-2nd-edition/" rel="nofollow">Fraktur Mon Amour</a> – basically a similar approach, with a finer differentiation of experimental (display) styles, see <a href="http://www.fontblog.de/picts/FrakturMonAmour.pdf" rel="nofollow">this overview PDF [3.8mb]</a> by Fontblog.de.</p>
      <p>As you speak German, see also the <a href="http://www.typografie.info/typowiki/index.php?title=Gebrochene_Schrift" rel="nofollow">TypoWiki</a>, <a href="/wiki/Wolfgang%20Beinert" class="freelinking" rel="nofollow">Wolfgang Beinert</a>’s <a href="http://www.typolexikon.de/g/gebrochene-schriften.html" rel="nofollow">Typolexikon</a>, and <a href="http://www.beepworld.de/members66/vau-ef-be/gebrochene.htm" rel="nofollow">this article</a> by <a href="/wiki/Bernhard%20Schnelle" class="freelinking" rel="nofollow">Bernhard Schnelle</a>. Offline reading recommendation: <a href="http://www.typografie.de/product_info.php?products_id=389&amp;cPath=" rel="nofollow">Fraktur</a> by <a href="/wiki/Albert%20Kapr" class="freelinking" rel="nofollow">Albert Kapr</a>.</p>
      <p><cite>a guide out there that breaks up blackletter forms to it's very basic elements</cite></p>
      <p>Do you mean a list of form details like the <a href="http://www.fontshop.com/fonts/downloads/elsnerflake/neue_luthersche_fraktur_ot/?&amp;sample_text=ABFLMNPRVWY&amp;update=0" rel="nofollow">Elefantenrüssel</a> [‘elephant's trunk’]? I’m not aware of such a guide.<br>
      F</p>
