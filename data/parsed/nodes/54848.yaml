    <p></p><div class="imageWrap"><img src="http://typophile.com/files/collage_O_4904.jpg"></div><br>
    As a sketchbook assignment, we were to cut out 20 different fonts of a letter of our choosing, and then find 20 images starting with that letter. I used O, bad idea, but it turned out okay.<p></p>
    <p>Yes. That is Rosie O. Donald. And yes I know that Healthy Skin Glow Sheers Foundation does not start with O, but it's still O-range! Orange makeup squirting O's onto the Oven. (That is saying O shit. Yes I know it's an anti-obama sticker.. but it's still so funny!)</p>
