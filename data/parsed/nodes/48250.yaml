      <p>If I were to make up something (which am doing) I’d say an Office weight would be a typeface with characteristics optimized for office reproduction systems, such as laser printers, photocopiers, and fax machines, at a typical correspondence size (10-12 pt).</p>
      <p>This may or may not relate to any real world definition, but it should, because I say so.</p>
