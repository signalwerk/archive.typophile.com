    <p>So, I’m reading my <a href="https://web.archive.org/web/20081122101523/http://www.fontshop.com/products/fontbook/">FontBook</a>, as I do with my morning coffee, and I keep noticing certain fonts with an “office” weight, version, style &amp;c.</p>
    <p>What does it mean? To my eyes, and I’m only up to the Mm’s in the sans serif section, it looks like they sort of pseudo mono-space it and cross breed it with Courier.</p>
    <p>Any thoughts?</p>
