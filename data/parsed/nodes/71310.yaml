    html: |-
      <p>Surely you mean .bmap? These are cached bitmaps, not actual outlines. Clients that supplied .bmaps used to be a royal pain in the rear, because these look good on screen -- because they were scaled to be used as such -- but were, obviously, worthless in print.</p>
      <p>Replace with the correct outline fonts, I'd suggest.</p>
      <p>Reason the files are 0 kb is because those were the days of the dreaded Apple Resource Fork: a separate part of each file where data was supposed to be stored. Almost no other file system could handle such an advanced file system (in fact, Apple itself abandoned it with, if I remember it right, OS X). Most file packers <em>also</em> had problems with these: either when packing (so the data forks never were stored), or when unpacking (as it needs a resource fork aware OS to be able to <em>store</em> that blasted data again). But since it's highly unlikely these particular files would be of any use, I wouldn't bother about it any further.</p>
