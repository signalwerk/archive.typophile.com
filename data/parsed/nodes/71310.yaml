  html: <p>A ZIP package of fonts from a client contains a couple of .bmp fonts which, after unpacking, turn out to have no data (0 KB). The file names have no extension and, as they also are dated some 1992 or 1997, my guess is they are old Mac OS 9 fonts. The question is - how to restore the files and - as converting them would probably be not a welcome solution - how to use them for an InDesign project I am working on (translation and localization of some technical manuals). Thanks.</p>
