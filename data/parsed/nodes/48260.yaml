      <p>Just a couple of other things: Courier was not designed for the Selectric, but rather well before; and I don't know of a proportional variation.</p>
      <p>Frutiger DID NOT WORK ON ANY VERSION OF COURIER. This was an error on the Agfa/Monotype website that should long ago have been corrected. There is no basis for this claim whatever. Frutiger however did work on some fonts for the Selectric Composer: </p>
      <p>"Bud [Kettler] worked with Adrian Frutiger on fonts for the IBM Selectric Composer. Frutiger was very good but Bud had to help him through some technical problems. The upper case M and W of Frutiger's design were too bold for the limited impact from the type element. Bud decided he could cut down on the surface area without cutting down on the surface size. Bud did this by redesigning the M and W with a series of lines that would resemble a plowed field in a shallow pyramid pattern. The ribbon that was impacted by the modified M and W would spread across the furrows on the face of the characters and make them appear on paper as solid characters."</p>
      <p>(from my temporarily down 'graphos.org' page on Bud Kettler; reminiscence by Paul Rainey, one of Bud Kettler's colleagues on the IBM/Lexmark type team)</p>
      <p>I'm going to suggest to Lexmark that they do an IBM/Lexmark typewriter typeface ID page. They have all that info on file.</p>
