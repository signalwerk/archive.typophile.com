      <p>Thanks for the thoughts - very appreciated.  The g and a are what caught my [very untrained] attention too.  Most typewriter type fonts use a double story g - which I find very distracting - barf.</p>
      <p>I was going to ask about the proportional vs not - thanks for letting me know about that - and the IBM part too. A big help. </p>
      <p>If you put the likely time frame and the proportional bit together you would end up with perhaps an IBM Executive typewriter:<br>
      <a class="freelinking external" href="http://amygdalagf.blogspot.com/2004/09/ibm-executive-typewriters.html" rel="nofollow">http://amygdalagf.blogspot.com/2004/09/ibm-executive-typewriters.html</a></p>
      <p>The picture from the above page/link is very poor quality.  I would say that this might be IBM Secretarial Type but the lowercase y does not seem to match.  It looks pretty close though.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tpyewriter_sample_2_3887.png"></div><p></p>
      <p>Are there any resources that you may know about for the various IBM types that have been made into current fonts?  Or anywhere I might find good information about the various IBM types?  There were gazillions of these typewriters made [Executive &amp; Selectric] - they were the most popular typewriters on earth with gazillions x gazillions of pages of documents typed on these things.  I would think that someone would have taken it on to recreate these types?  Or am I just talking crazy analog?  Am I in the wrong forum?</p>
