      <p>I can definitely say that none of the typeface samples listed here so far is IBM Secretarial (public release 1939), a typeface I know well and really love and which I have worked on digitizing. If the typewriter division is still going at Lexmark, they would be able to help identify the typeface. Otherwise, email me and I will try to look up some of the old IBM typeface designers who helped me with Bud Kettler's bio for the Courier page at graphos.org - - which is now down but which I hope to have up again in a few weeks. Secretarial is a simple 5-unit slab, very similar to faces like Rockwell. </p>
      <p>With regard to the Dan Rather/G Bush letter, one of these ex-IBM/Lexmark/ people, examining the admittedly dreadful quality fax that was made available to the public, came to the conclusion that the typeface used must have been from the IBM Executive that had Times -- this was based, I think, on the eccentric height of the hyphen. And there were known sales of IBM Executive typewriters to that office. But with that lousy fax, who could really tell? Will anyone ever get to the bottom of that freakish story?</p>
