      <p>If you put the likely time frame and the proportional bit together you would end up with perhaps an IBM Executive typewriter:<br><a href="http://amygdalagf.blogspot.com/2004/09/ibm-executive-typewriters.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://amygdalagf.blogspot.com/2004/09/ibm-executive-typewriters.html</a></p>
