    <p>This font is a real old font from a typewriter - then copied/reproduced.  Probably 40-50 years old [I think]. I can scan &amp; submit more samples if needed.  Any help identifying or approximating this font is appreciated. The end result does not need to look dirty/typewritten/reproduced like the sample - the clean, modern equivalent would actually be preferable.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/typewriter_font_sample_4313.png"></div><p></p>
