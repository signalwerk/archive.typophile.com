      <p>This is what i got when I put IBM into font font which is kind of interesting, It looks like Courier was actually designed specifically for the Selectric typewriter series... It also showed <em>Letter Gothic</em> as a specific typeface designed for the Selectric series! (maybe you all ready knew this from your research)</p>
      <p><em>Courier draw line – Designed as a typewriter face for IBM, Courier was redrawn by Adrian Frutiger for the IBM Selectric series. Courier is a typical fixed pitch design, monotone in weight and slab serif in concept. The Courier font is used to emulate typewriter output for reports, tabular work and technical documentation.</em></p>
