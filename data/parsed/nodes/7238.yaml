  html: <p>Has anyone figured out a good and practical way of using the oldstyle numerals in fonts like Adobe Garamond Pro etc., in MS Word? One can of course do a substitute routine when the document is finished, but it would be nice to be able to type them in directly. Any hints would be welcome.</p>
