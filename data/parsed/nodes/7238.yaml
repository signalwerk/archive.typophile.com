    html: <p>if the font has them then all you have to do is..Menu/Insert/Special and the font's glyphs that are mapped in Unicode show up and you click on them. On the Mac it might be the same... <br> <br>If the font doesn't have them or they are not in unicode you probably won't see them.</p>
