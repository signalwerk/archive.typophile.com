    html: <p>The font has them, but since the oldstyle numerals are in the private use area (for some reason - I can't understand why there isn't a regular unicode number for them...), they don't show up in the Insert/Special window. I can copy and insert them from the Fontmapper facility, but it is a bit cumbersome to do that every time I need a numeral...  <br>I'll try the MSKC thing - I don't use auto numbering anyway. :-)</p>
