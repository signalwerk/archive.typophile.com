      <p>I've used it a good bit in my thesis since I'm quoting from a book from the 17th century.</p>
      <p>I agree with oprion too, I'd love to use thorn but between not being terribly recognizable outside of the linguistics  / typography / Icelandic community, it goes the way of fraktur or the long s.   I suppose you could print a book of Old English poetry and use that along with the æ-macron :)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
