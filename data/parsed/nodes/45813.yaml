    html: |-
      <p>There are no easy ways to access characters outside the standard codepages. </p>
      <p>You may try:<br>
      -The hex input keyboard layout<br>
      -The character palette (Command + Option + T)<br>
      -Third party tools like PopChar<br>
      -Third party replacement tool (to create your own replacements) like TextExpander, Typinator or RapidoWrite</p>
    html_clean: |-
