      <p>Newspapers don't need to use the marks in regular headlines or articles. However they're a good idea in newspaper ads or promotional pieces. Or if the newspaper mentions a trademark that they own themselves. But when simply reporting the news, they aren't needed.</p>
      <p>&gt; In printed promotion, it is also common to use the<br>
      &gt; mark with the first instance of a product name, but<br>
      &gt; omit it thereafter.</p>
      <p>Most corporations I've worked with use the mark on the first instance on each page, rather than just the first instance in the publication. But this isn't a legal requirement.</p>
