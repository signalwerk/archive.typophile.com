    html: |-
      <p>In HTML, we're aiming for the actual ™ and ® glyphs. I've found the ℠ glyph to be inconsistent across browsers and fonts, though.</p>
      <p>As you can see the registered glyph differs from the TM glyph in that it's not super scripted by default. So we manually created some classes for each that end up optically adjust them to be relatively the same.</p>
      <p>The complaint is, indeed, that people feel they are too large in display sizes (we've optically adjusted them to be roughly 50% the cap-height aligned to the cap-height which looks fine as body text, but does tend to be a bit large in display settings). I don't necessarily disagree but feel that the optimum solution is to not even use them in display sizes (as newspapers seem to agree on). I was hoping to perhaps find some established style rule that the press uses.</p>
