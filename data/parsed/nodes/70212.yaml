    <p>An interesting conversation popped up recently in our group about super-scripting the Trade, Service and Registered marks. </p>
    <p>The context is specifically web, but we wanted to apply any tried and true typography rules to our decisions and then realized we didn't necessarily have any tried and true typography rules that apply to this handy.</p>
    <p>Are there any?</p>
    <p>More specifically, we're interested in the use of them in headlines. It occurred to me that I never see those marks in newspaper headlines. I'm assuming there's perhaps an AP style guide that references this issue but haven't had much luck via google finding that yet.</p>
