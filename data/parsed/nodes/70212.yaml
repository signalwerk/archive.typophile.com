    html: |-
      <p>There is no legal requirement to use the ™ or ® symbols when referring to companies or products editorially, according to <em>Chicago Manual of Style</em>, 15th Ed., §8.162.</p>
      <p>If you’re creating promotional material, then what OldNick said: place a general declaration of trademarks at the footer or on an About page. </p>
      <p>In printed promotion, it is also common to use the mark with the first instance of a product name, but omit it thereafter.</p>
