      <p>I assume you aren’t using anything but the actual ™, ℠, and ® glyphs. Don’t try to do anything special with them on the Web, save perhaps for headlines you know will be large.</p>
      <p>I think it is generally accepted that, at display sizes in print, such glyphs should be manually shrunk to tiny size.</p>
