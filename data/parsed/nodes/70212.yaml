      <p><em>More specifically, we're interested in the use of them in headlines</em></p>
      <p>Quite simply...don't. And minimize the use of same in body copy, as well. A footnote on the home page stating that "OurCompany" is a Registered Trademark of OurCompany, Unltd. or whatever will suffice.</p>
