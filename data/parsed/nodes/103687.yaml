    html: <p>and yes, "different things could happen" that might be interpreted as degradation, but I don't know what they would be.  I might guess that too open a spacing would cause a reader to look more closely at individual letters instead of perceiving the word as a unit.  My guess with too tight a spacing is that the shapes between letters could be confused with counters and cause confusion like the r-n as m problem, c-l as d, v-v as w. Or just an unclear mashup of forms that become confusing and need to be reread more times in context to decipher meaning.</p>
