      <p>In well functioning text types, interletter spacing should be bear a certain balanced relationship to "intraletter spacing" i.e. counterspaces. Changing the spacing of a given typeface is "breaking" that relationship, and makes me wonder whether the measured reading inefficiencies reflect that the adjusted spacing is not in the "sweet spot," or just this brokenness instead. </p>
      <p>Would it make sense to test well-designed condensed and expanded cuts of a typeface family in place of altered regular fonts?</p>
