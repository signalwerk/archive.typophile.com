      <p>In exchanges with other researchers doing spacing tests I've tried to argue for a better benchmark than default values. </p>
      <p>In my personal thinking about spacing I’m beginning to work with a notion of “cohesive equilibrium.” A metric of cohesive equilibrium was introduced by William Dillard Orbison way back in the 1930s in a little-known paper published in 1939 in <em>The American Journal of Psychology</em>, titled:  "Shape as a Function of the Vector-field." The paper uses ideas about dynamic forces present in gestalts which resemble those Chris described two posts above. This notion of cohesive equilibrium links up intuitively with some of the ideas I’ve explored on typophile about “narrow phase alignment” in type, and with Gerrit Noordzij’s notion of a rhythmic cohesion or equivalence of the whites inside and between letters.</p>
      <p>My thought is that type designers and typographers shoot for a cohesive equilibrium — the sweet spot — in their design processes, and any changes to optimal spacing introduced by increasing or decreasing between-letter space relative to within letter space, will disturb the cohesive equilibrium and affect readability. So a gauging of cohesive equilibrium for letters in words could provide a spacing benchmark. I don’t know if the Orbison metrics can actually find positions of cohesive equilibrium in type. His study uses geometric shapes superimposed on complex geometric fields. I’ve pointed out before that Fourier Transforms (frequency channel) appear to gauge phase alignment in type, independent of style, weight size and contrast, so now I’m thinking Fourier Transforms will help gauge cohesive equilibrium quickly and easily.</p>
      <p>The question for psychologists would be what happens to the process of reading when you change the amount of space between letters so letters are no longer in positions of cohesive equilibrium, and how does word spacing modulate this. </p>
      <p>The mathematical challenge would be to find algorithms that capture the narrow phase alignment typical of well-designed and well-spaced type, and use this alongside of a “metrics of readability.” </p>
      <p>The thing about  the eye tracker data is that some measures appear to point in slightly different directions and might lead to conflicting inferences, for example the first fixation durations (target-word-dependent measure) align pretty well with the overall reading time (a global measure) for experiment 1 (see the data and link in my earlier post), but the average fixation duration data (a global measure) for experiment 1 shows a different trend. The + 1/2 and + 1 spacing perform progressively better. So a key will be to learn how to read the data in such a way that they will indeed provide a reliable metric of readability.</p>
