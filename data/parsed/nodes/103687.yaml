      <p>[Nick Shinn] <em>So, they have discovered that spacing (“selecting default spacing values”) is a part of typeface design.</em></p>
      <p>No, the discovery, if that’s what you want to call it, is that spacing influences a number of eye-tracking measures. </p>
      <p>Sentences, like “They shouted at the driver who wildly cut them off” were used. In the first experiment 10-point Cambria and 10pt Times New Roman with Microsoft ClearType subpixel rendering were used. There were four levels of spacing: reduced by half a pixel, normal, increased by half a pixel, and increased by a full pixel. </p>
      <p>The global measures of sentence reading used were: mean fixation duration, number of fixations, total sentence reading time, and comprehension question accuracy. The “target-word-dependent measures” used were: first-fixation duration (the duration of the first fixation on the target word), gaze duration (the sum of all first-pass fixations on the target word), skipping rate, and the length of the critical saccade that landed on (or beyond) the target word. Of the target-word-dependent measures, the first fixation duration is interesting:<br>
      Spacing: –1/2 px  normal   +1/2 px   +1 px<br>
      Cambria: 263 (7.7) 244 (7.9) 248 (8.7) 253 (6.5)<br>
      Times New Roman 261 (9.4) 255 (8.0) 236 (8.1) 246 (8.2)</p>
      <p>For total sentence reading time (a global measure) there is this chart:<br>
      <a href="http://www.enneson.com/public_downloads/typophile/2013_slattery+rayner_chart.jpg" title="www.enneson.com/public_downloads/typophile/2013_slattery+rayner_chart.jpg">www.enneson.com/public_downloads/typophile/2013_slattery+rayner_chart.jpg</a><br>
      [insert image not working for me]</p>
      <p>Not all the measures are equally informative, and some show complicating trends, but that’s why a ‘metric’ of readability has to be developed around them.</p>
