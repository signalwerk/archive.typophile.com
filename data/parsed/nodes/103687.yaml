      <p>Kevin: <em>If everyone agreed on the best amount of spacing then we wouldn’t see the difference between typefaces that we see today. In this study Times New Roman has a tighter default spacing than Cambria.</em></p>
      <p>In this regard it is important to understand why different fonts are spaced the way they are, and hence why particular apples and oranges might not be the best subjects for this sort of testing. Times New Roman shows all the signs of inherited unitised advance widths from previous typesetting technology. Take a look at the advance widths of the upper- and lowercase letters: they are a small set of common widths, based on multiples of appoximately 115 units (the actual number varies, due to rounding from the original unit metrics to the TrueType 2048 UPM grid). So this is a font that has been spaced not with regard to 'the best amount of spacing', but according to the limitations of obsolete technology. </p>
      <p>[Unitised widths will have had an impact on letter proportions as well as interletter spacing. Note, for instance, that the counters of the lowercase <em>m</em> are actually slightly wider than that of the <em>n</em>, which is the opposite of most design practice.]</p>
