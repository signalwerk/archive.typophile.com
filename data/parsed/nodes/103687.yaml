      <p>Craig: <em>In well functioning text types, interletter spacing should be bear a certain balanced relationship to "intraletter spacing" i.e. counterspaces. </em></p>
      <p>That's a given for most typographers. But I believe in terms of empirical testing it would constitute only an hypothesis, i.e. something that has not yet been experimentally confirmed but on which one could base reasonable predictions that could then be tested with a well-designed experiment. Bill Berkson has taken the hypothesis one step further in suggesting a reason why it might be the case: mental alignment of features to a perceptual grid that is aided by regular arrangement of visual features, i.e. your 'certain balanced relationship'.</p>
