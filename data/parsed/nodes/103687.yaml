      <p>There are many interesting ideas for further study here. Peter, I too am interested in having a metric for evaluating the evenness of spacing within a typeface, though have not been satisfied with anything I’ve seen yet. </p>
      <p>It is not the goal of this test to compare TNR against Cambria. We’ve made no press releases publicizing these findings. </p>
      <p>The goal is to learn more about the role of letter and word space in reading: what happens to eye movements when you reduce letter space, when you reduce word space, when you increase letter space, and when you increase word space? These results could be used to inform future typeface designs.</p>
      <p>Since only Peter has had the opportunity to read the paper, would anyone else care to predict what happens to eye movements when letter and word space are increased or decreased?</p>
