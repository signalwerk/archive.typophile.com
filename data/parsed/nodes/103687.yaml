      <p>[Nick] <em>While Fourier analysis does reveal some kind of pattern grid, I would think that spacing design acts against the grid in a subtle manner, so how would readability metrics even begin to identify how that happens?</em></p>
      <p>Yes! that’s why it’s <em>narrow</em> phase alignment.  In narrow phase alignment the information coming from the vertical strokes and the vertical means of curved strokes clusters around a phasal mean but rarely sits right on it. It’s emphatically not <em>perfect</em> phase alignment. A metrics of readability is not a spacing formula, but would be a way of weighting and integrating the measures eye-tracking technology provides.</p>
      <p>In an earlier thread we were able to see subtle but distinct differences in the kind of phase alignment different spacing methods produce.</p>
