      <p>The question being addressed in this paper is what happens to the process of reading when you change the amount of space between letters, and when you change the amount of space between words. Eye tracking lets us see if these manipulations change the amount of time a word is fixated, the length of the saccades, and the number of regressions (backward saccades).</p>
      <p>While everyone recognizes that there is a sweet spot of optimal letter and word spacing, I don’t think it’s clear where that sweet spot is located, nor is it clear what happens when the spacing is too tight and when it is too loose. If everyone agreed on the best amount of spacing then we wouldn’t see the difference between typefaces that we see today. In this study Times New Roman has a tighter default spacing than Cambria.</p>
      <p>My multidisciplinary team (psychologist, typographers, mathematician, and computer scientists) was interested in this question, and funded Slattery &amp; Rayner to find out. We also provided them with the tool that they used to generate their spacing conditions. Before I say anything about the results of their studies, would anyone like to guess what happened to fixation times, saccades, and overall reading time when A) letter spacing changed, B) word spacing changed, and C) if those changes impacted TNR and Cambria differently?</p>
