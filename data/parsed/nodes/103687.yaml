    html: <p>It seems clear from experience that spacing is affected by weight and the absence or presence of serifs.  This is the relative interaction of counter space to letter space and proximity attraction/repulsion (also stroke contrast).  Generally, the bolder weights need less letterspacing (which makes spacing extrabold weights tougher than light and open weights.  It would make sense to assume that a reader is looking for an amount of space where the word holds together as a word without either falling apart into discrete letters or jamming into an unclear mass. The "How Much" part is very much dependent on glyph shape interactions and would be very difficult to generalize about across typefaces.  Since they mention pixel units, I assume the whole study refers to screen reading, not print.  Units are much cruder on screen than print so the sweetspot would appear to be less forgiving than with print.  One unit tracking in print is a far finer change than one pixel change in screen reading of a comparable size.</p>
