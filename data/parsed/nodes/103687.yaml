      <p>" by degradations, I assume that you mean that all of the above would happen: "<br>
      Kevin,<br>
      What I mean is that their may be some correlation between eye movements and reading variables, but I don't buy that we really know cause and effect properly.  Therefore, my use of the term "degradation" refers to reading efficiency as a generality without determining if forward saccades get shorter or if their are more regressions. Before we can, with certainty, rule out other factors as contributory (such as awkward sentence construction, unclear wording, readers knowledge of the words  or context), I don't know what to make of regressions.  If I read a word or words which reminds me of something else, I am sure to have a regression even if I know the meaning intended by the author.  I don't know how you can rule out attentiveness or distraction by other mental processes not in evidence. Someone with ADD may be a prime case.  Another just might be me seeing the possibility of a pun unintended by the author or not even consciously brought on by me.</p>
