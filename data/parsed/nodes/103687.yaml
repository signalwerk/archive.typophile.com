      <p>I expect that in general, changing the tracking (all spacing including intra-word) or the between-word spacing will harm readability.</p>
      <p>That being said, Times probably won't get hurt much by just a *little* increased tracking. It might even be an improvement. That would be because it was optimized to balance saving paper against maximizing legibility.</p>
