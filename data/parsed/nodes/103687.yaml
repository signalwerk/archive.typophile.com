      <p><em>Prior research suggests that the proximity of flanking letters influences the identification of a central letter via lateral inhibition or crowding. If so, decrements in intraword spacing may produce inhibition in word processing. Still other research suggests that increases in intraword spacing can disrupt the integrity of word units.</em></p>
      <p>In other words, existing research suggests that there is a sweet spot for intraword spacing, which is wide enough to minimise the effects of crowding but not so wide as to disrupt the integrity of the word as a visual unit. That conclusion shouldn't be any kind of surprise to any type designer or typographer. What might be interesting is developing methods to experimentally quantify that sweet spot, and hence determine whether that sweet spot corresponds to conventional text spacing as practiced by type designers and typographers.</p>
