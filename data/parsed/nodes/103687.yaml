      <p>Thomas, I think John just did so very nicely!</p>
      <p>In this test, what is the point of testing Cambria vs. Times?</p>
      <p>Certainly, it confirms that Cambria, designed by Microsoft for digital display, reads faster on screen at 10 pts than Times, designed long ago for letterpress, somewhat out of its element.</p>
      <p>So this research validates Cambria according to the readability mantra associated with corporate efﬁciency.</p>
      <p>But what does this reveal about the “metrics of readability”?<br>
      It’s been obvious to typographers for 20 years that Times, even the heavily hinted “core TrueType” fonts distributed with IE, has some spacing issues—accidental ligaturing, for instance—at low resolution screen display.</p>
      <p>Now let’s see Cambria go up against a WebType font!</p>
