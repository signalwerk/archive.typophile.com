      <p>Yes, default values are discretionary, determined by the foundry.<br>
      Kerning has an effect too.<br>
      John Hudson has suggested some kind of “envelope” algorithm for spacing.</p>
      <p>This kind of tracking (typographic, not eye) test seems particularly divorced from the spacing considerations type designers address.</p>
      <p>While Fourier analysis does reveal some kind of pattern grid, I would think that spacing design acts against the grid in a subtle manner, so how would readability metrics even begin to identify how that happens?</p>
      <p>How does fence-posting effect reading speed?<br>
      How does stem thickness and contrast effect fence-posting?</p>
      <p>How would a readability metrics theory be able to accomodate both the incunabula and neoclassical methods of spacing?—<br>
