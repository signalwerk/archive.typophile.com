      <p>I think, e.g. this should never be said idly...<br>
      "...the goal is to learn more about the role of letter and word space in reading: what happens to eye movements when you reduce letter space, when you reduce word space, when you increase letter space, and when you increase word space? These results could be used to inform future typeface designs."</p>
      <p>...without qualifying at least the ballpark of resolution in which the study is being done. </p>
      <p>What is resolution in this study? After all, if everything that were true about reading, was resolution-independent, it would be further proof that we know nothing. </p>
      <p>Then, most likely...the goal is to learn more about the role of letter and word space in reading at course screen resolutions: what happens to eye movements when you reduce letter space, when you reduce word space, when you increase letter space, and when you increase word space in huge increments relative to what readers are used to, and at lower resolutions than they are accustomed to reading? </p>
      <p>These kind of results <em>have already</em> been used to inform typeface designs for text at lower resolutions. You see, it's best to leave these types of fonts alone (RE series, Verdana, Poynter Agate, e.g.), as far as spacing goes. It's only fonts that don't work well at low resolutions and small sizes, that "seem to" react well to re-spacing in low resolutions, you see...</p>
