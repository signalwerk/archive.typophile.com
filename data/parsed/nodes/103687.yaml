    html: <p>The logic of the sweetspot is any digression from it in either direction (given all other variables remain the same) would cause degradation.  The weight/contrast/shape values would determine the degree of degradation.  I would assume the heavier weights would suffer more than the lighter ones.  I would assume Times would suffer more than Cambria, as well.</p>
