    <p>Hello everybody and regards from Switzerland.<br>
    I am in the process of rewriting some websites for friends, personal business and family, and would like to integrate some of the new @font-face techniques in my CSS.<br>
    Being that I am not a typographer by trade or schooling I had really never thought much about usage rights, licensing, etc.<br>
    As of yesterday, let's say that I wanted to use, say, Century Gothic - I'd just code it in my CSS, and specify the fallback alternatives and that was it.<br>
    So if I'm coding my CSS to instruct the browsers to call up that specific font which is installed on the users' machines, there is no problem because the licensing fees have been paid by the OS manufacturer (and/or the computer manufacturer as well?).<br>
    On the other hand if I'm using the @font-face declaration, and have a copy of the font stored locally on my server space I would need to pay licensing rights, (except if it's a free-font). Would this apply even in the case that the @font-face url is on a third-party server (e.g. the font designer's own site)?</p>
    <p>Thank you for your kind help!</p>
    <p>Ciao, tschüss, a bientôt</p>
    <p>Paul</p>
