      <p><cite>if I'm using the @font-face declaration, and have a copy of the font stored locally on my server space I would need to pay licensing rights, (except if it's a free-font).<br>
      </cite></p>
      <p>Correct!<br>
      (And it must be a webfont license. A normal “print font license” usually won't suffice)</p>
      <p><cite><br>
      Would this apply even in the case that the @font-face url is on a third-party server (e.g. the font designer's own site)?<br>
      </cite></p>
      <p>Of course!<br>
      Keep in mind that some browsers even have a same-origin rule for @font-face linking, so the font file must be on your server (or delivered from a webfont service provider) to even work on your site. Hot-linking is not a way to go.</p>
