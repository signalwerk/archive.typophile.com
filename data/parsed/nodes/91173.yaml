    html: |-
      <p>Paul,<br>
      font:14px "Georgia",Verdana,Helvetica,Arial,sans-serif; </p>
      <p>these fonts are pre-installed on almost each computer of the world and no webfont is loaded, but the font installed on your <strong>local</strong> Operating System.<br>
      the above declaration just says : “use Georgia, if installed on the local computer; if there is no Georgia, look for Verdana instead; if no Verdana, look for Helvetica then […], if no font found, use de default sans-serif/serif”.<br>
      With this logic, you can set a font, hoping people has installed it (for instance Myriad / Myriad Pro, installed with every Adobe product). </p>
      <p>font-family: Myriad, "Myriad Pro", Trebuchet, sans-serif;</p>
      <p>this means :  “look for Myriad, if not present for Myriad Pro, if not present Trebuchet, if not present a generic sans-serif”.</p>
      <p>If you want to be sure people see your website in Myriad, you should embed it as a webfont. Only browsers unable to read webfonts will use the fallback fonts in the list.</p>
      <p>3 obvious consequences :<br>
      1. there is no sense paying for 2 webfonts where the 2nd is the 1st fallback.<br>
      2. the fallback font should be a <em>standard font</em>, installed by default on Win, Mac, and possibly Linux. You can find many web pages listing them. Here one of them : <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code><br>
      3. you, as the publisher, pay a licence to have the right to display your website with an X webfont. Probably, if you use a service like typekit (based on pageviews), if the internet user applies his own style sheet and disables javascript, he wouldn't be counted in the total page views of your font. But I guess it’s the 0,01% of cases.</p>
