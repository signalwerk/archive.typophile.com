    html: |-
      <p><em>Looking at the CSS of this site (e.g. font:14px "Georgia",Verdana,Helvetica,Arial,sans-serif; etc): does this mean that the webfont usage rights are being paid for all those single typefaces, even though I may be using my own browser-specific stylesheet to display a totally different font?</em></p>
      <p>No. These are fonts that <a href="http://www.ampsoft.net/webdesign-l/WindowsMacFonts.html" rel="nofollow">ship with common operating systems</a>.  If one doesn’t have the first installed, the browser uses the next, or in the end if none are present uses the standard “sans-serif” defined in your system. No font files are served, it just use the fonts that are already on your computer.</p>
