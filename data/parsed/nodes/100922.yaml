  html: |-
    <p>Good afternoon fellow folks of fonts,<br>
    The company I work for is going to purchase a new printer for my department (Design Department). We are currently using a Recoh C8111... we'd like something as good or better. It's a Laser Toner, maximum size is 12x18 (via bypass tray). Any recommendations/experience to be shared?</p>
