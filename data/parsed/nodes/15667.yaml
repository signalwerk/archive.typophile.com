      <p>While there are serious age-related vision problems such as macular degeneration, the  main difficulty for reading as you get older is the reduced flexibility of the cornea.</p>
      <p>This results in the eye muscles around the cornea being unable to compress it enough to focus for near objects, such as text. One becomes long-sighted.</p>
      <p>Glasses can remedy this, and return the reader to perfect vision, but the situation is progressive, so that over the years one’s glasses creep down one’s nose to maintain the same degree of acuity. </p>
      <p>Not everyone gets their specs upgraded often enough, and many people end up making do, reading text which is not quite in focus. Many prefer to make do rather than constantly upgrade, which is a hassle and an expense.</p>
      <p>When text is not quite in focus, that which causes difficulty is:<br>
      - too small<br>
      - too fine<br>
      - too much contrast</p>
      <p>Typography is multivariant design, so it’s possible to improve legibility by selectively adjusting these parameters. Officials and accessibility advocates are apt to overdo things, mandating massive clunky sans type, but that’s a bit like shouting at everyone just to benefit a few hard-of-hearing. </p>
      <p>Serifs are not an issue. If you go to the “large print” section of a bookstore or library you will find everything set in serif fonts. The wisdom of the market.</p>
      <p>I don’t know how old you are Stuart, but assuming you’re young, why not go to an optician and ask him/her to make you a pair of glasses which simulate your vision when you’re 60?</p>
