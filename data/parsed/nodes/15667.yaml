      <p>Thanks for the great discussion.</p>
      <p>Nick - Your background info is illuminating and I love the idea of the glasses (walk a mile in another man’s shoes - read a chapter with his glasses?) I’m in my 30s and despite the time spent staring at montiors, the eyesight’s holding on. I’ll have a talk to an optometrist about the glasses.<br>
      I also agree with your comments on typography, and selectively adjusting parameters. I wonder whether the large print sections of the market are dictated by the wisdom of the market or perhaps by convention as well. It fits with Hrants comment on boumas helping recognition but as terminaldesign mentioned earlier, most research points to sans serif although I’m not sure on the length of the texts used in the tests.</p>
      <p>The research also points to type size being more important than typeface selection (within reason as Joe Clark points out). The italics of Century Schoolbook would rule it out for me, as I feel they are too script-like for this sort of work. </p>
      <p>If a serif face, perhaps something like ITC Mendoza has merit, with an eveness of stroke weight, and a less cursive italic. FF Legato could be a good choice for a sans.</p>
      <p>A little more background - I’m looking at typefaces for use in a government department dealing with ageing and disability that produces a wide variety of printed material, some specifically for a 60+ audience for example. I’m therefore doing some research so I can make informed choices that I can justify. </p>
      <p>Stuart</p>
