      <p>I’ve read about this, actually. Not sure why it has to be so complicated. </p>
      <p>Choose a legible serif face, use it at higher point sizes, apply generous leading, and set the text rag-right. Ensure that line length is fairly short. I’m sure that 45-55 characters per line will do. </p>
      <p>Perhaps Robert Bringhurst’s book on typographic style offers advice as well.</p>
