    <p>Does anyone have some experience in specifying and setting type specifically for the elderly and vision impaired? I’ve searched on the web, and the studies done and the advice given by support organisations seem to have fairly general conclusions that lean towards sans serif type over serif  and minimum point sizes to work with (12-14pt), maximising contrast, using uncoated stocks to avoid reflection among others.</p>
    <p>It seems that people with a background in design or type are not involved in the studies or in specifying fonts for use. They always suggest Arial or Helvetica, which whilst they are freely available, tend to make work feel generic. I am considering Robert Slimbach’s Cronos, which has some character and a generous x-height, but would like to hear other suggestions. I also wonder if the serifs are not such a problem, but the contrast between strokes with some serif faces that cause problems in legibility (Bodoni would be an exreme example). For instance would not Caecilia be a good  typeface for this audience, even thought it has serifs?</p>
    <p>Would anyone like to share their direct experience of working on projects for elderly/vision impaired audiences, and the typefaces they’ve selected or would suggest. Can anyone point me to good resources on this topic?</p>
    <p>Thank you,<br>
    Stuart</p>
