      <p>&gt; most research points to sans serif</p>
      <p>Most research is bunk.  :-/</p>
      <p>&gt; type size being more important than typeface selection</p>
      <p>With the important caveat that people prefer point sizes slightly too large for optimal reading... For the elderly with vision problems, it’s a tough call, because you have to balance their greater experience with leveraging the parafovea (where a smaller size helps) versus the faltering acuity of the whole of the retina (where larger is better).</p>
      <p>Legato might very well be the BEST choice for a sans. On the other hand, the more curvy a font the more blur (or alternatively aliasing) you get during lo-fi rendering, like onscreen.</p>
      <p>hhp</p>
