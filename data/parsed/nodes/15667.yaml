      <p>Actually most of the human factors research I have seen in this area points to sans serif over serif. The Lighthouse of Chicago is successfully using our ClearviewADA family. One of the directors there who is visually impared thought the ClearviewADA was the best thing he had ever read. But that is just one person’s opinion.</p>
      <p>Bringhurst’s book is really only about classic book typography, and offers no serious information on any other typographic venues. It is not the bible.</p>
