      <p>I’m critical of the research into <a href="http://screenfont.ca/fonts/today/Tiresias/" title="Debunking the research on Tiresias Screenfont">Tiresias Screenfont</a>, which is not applicable to the large-print use being discussed here. I also agree that you just can’t trust the typeface suggestions of blind/low-vision organizations. They simply don’t know what they’re talking about. It’s even fworse for LD groups – they actually recommend Comic Sans!</p>
      <p>I also don’t know of any really credible research... at all. Nonetheless, I don’t see how you could possibly go wrong with Century Schoolbook for fiction. I further hypothesize that, as with screenfonts, size trumps a lot of factors, and nice big type (at least 14pt) in nearly any typeface that any of us here would agree is not “eccentric” will be readable.  You  couldn’t use Hobo or Balloon Extra Bold, but you could surely use  Seria Sans or Quadraat or Balance, particularly for heds.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
