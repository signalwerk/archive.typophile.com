    <p>I thought someone had once mentioned that it was possible to increase letterspacing in all Caps above what the normal sidebearings make by using some opentype feature. Is this possible and how would I code it?</p>
    <p>Thanks for all geekly advice!</p>
    <p>ChrisL</p>
