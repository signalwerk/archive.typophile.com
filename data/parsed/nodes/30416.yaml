      <p>Hey ChrisL,</p>
      <p>I'm sure other people know much more than I do, but I was trying teaching myself how to do this the other day so I'll at least get you started. If all of your caps are in a class (we'll call the class "caps" in this example), then you can just use the OpenType cpsp feature do add units (xx) to the sidebearings as such:</p>
      <p>feature cpsp {<br>
          pos @caps &lt;xx 0 xx 0&gt;;<br>
      } cpsp;</p>
      <p>I bet I'm missing something important, so I encourage others to respond and fill in the gaps.</p>
      <p>Good luck,<br>
      David</p>
