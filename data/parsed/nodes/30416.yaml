    html: |-
      <p>At best with two examples:</p>
      <p>pos Adieresis &lt;5 0 10 0&gt;;<br>
      pos @caps &lt;5 0 10 0&gt;;</p>
      <p>The 'pos' command is followed either by a glyph name or a class name.</p>
      <p>Enclosed are, left to right: x placement adjustment, y placement adjustment, x advance adjustment, y advance adjustment.<br>
      So, the example says: The outlines of glyph 'Adieresis' are moved to the right at 5 units, and then the advance width is increased by ten.<br>
      This looks a bit complicated at first, but has to do with the fact that a font does not know about a rightside bearing; rather, the rightside bearing is advance width  -- the glyph's total width including leftside and rightside bearings -- minus leftside bearing.<br>
      What the example does is: it increases both leftside and rightside bearing at 5 units each.</p>
      <p>The second and forth number remain zero because you do not want to move the glyph up or down.<br>
      (Instead of adding extra glyphs and substitute them in the 'case' feature, you could as well add a lookup with commands like<br>
      pos parenleft &lt;0 20 0 0&gt;;<br>
      pos parenright &lt;0 20 0 0&gt;;<br>
      which will raise glyphs a bit if you select 'All Caps'.)</p>
      <p>The Feature File Syntax (html) document which accompanies the AFDKO is a very good reference for this.</p>
