    html: |-
      <p>Well, it’s a Stabil II. The ink reservoir  is missing, but you can still see the base for it under the ink dish. The roller arms are also manufactured for three rollers – 2 form rollers and one for the reservoir. There is an extra set of holes in the roller arms for a third roller hook. The missing hooks and roller has been removed together with the reservoir sometime in the past.<br>
      18x20 cm. is that the size of the platen, the bed or???? I think your press must be a Stabil II EH<br>
      Gott grüß die Kunst<br>
      Jens</p>
