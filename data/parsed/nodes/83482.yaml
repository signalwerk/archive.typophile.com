    <p>Dear typophiles,</p>
    <p>I'm the happy owner of an old small letterpress.<br>
    I'm trying to identify the machine and year of production.<br>
    Can anyone here identify it? I can understand (to dirty) the logo embenbed in the machine. I tryed to take a picture but its on a hard place.<br>
    I managed to "get a simple" design of the logo and what I think is some letters, but I dont find any similar names on letterpress supplier on a web search...<br>
    The seller said that the machine could be from the 1920's.<br>
    Can anyone here identify this?<br>
    Thanks in advance.</p>
    <p>António</p>
