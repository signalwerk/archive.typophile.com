    html: <p>The type of press is called a Platen Press.  they come in many styles but the basic mechanics of them are pretty much the same.  I couldn't tell you any more about the press but I can find out for you.  I am a volunteer at the international printing museum in Los Angeles <a href="/wiki/www.printmuseum.org" class="freelinking" rel="nofollow">www.printmuseum.org</a> I will be there this saturday and could bring pictures to show some of the guys.</p>
