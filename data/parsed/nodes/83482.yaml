    html: '<p>I am not familiar with the various types, but I can confirm that you’ve read the name correctly: A. Hogenforst was a manufacturer of ‘Tiegelpressen’ in Leipzig. You could try asking Jens Jørgen Hansen, he has a few pictures of a Hogenforst leaflet on Flickr: <a href="http://www.flickr.com/photos/bogtrykkeren/3546176794/in/set-72157618477822478/" title="http://www.flickr.com/photos/bogtrykkeren/3546176794/in/set-72157618477822478/">http://www.flickr.com/photos/bogtrykkeren/3546176794/in/set-721576184778...</a></p>'
