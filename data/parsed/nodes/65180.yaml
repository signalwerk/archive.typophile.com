    <p>I'm trying to emulate this type and having a hard time finding any spray-painted typefaces that don't use stenciled letterforms. I know the type on this isn't a typeface so I'm not looking for a type ID, I'm just wondering if anybody's ever seen a spray-painted face that's more of a script or hand-lettering rather than looking like it was stenciled?</p>
