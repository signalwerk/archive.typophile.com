    html: |-
      <p>Apart from mentioned, the biggest problem i see is that most stems on lowercase letters seem to have different widths. Try comparing "h" and "f" stems.<br>
      "Ss" - doesn't look good because "s" spine is about to have its widest part in the middle.<br>
      In cyrillic set i personally have problems with "Дд" and "Уу".<br>
      - Slanted bar on top of "Дд" doesn't seem appropriate at all to me.<br>
      - "Д" and "Л" come in pair so you just cannot leave triangular "Л" when making "Д" trapezoidal.<br>
      - I don't think that two-sided serif on the "У" lower terminal is a good solution. Also there should be a similarity between uc and lc terminals of the same letter and i don't think it's ok to use 2 totally different types of terminals.</p>
