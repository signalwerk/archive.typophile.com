    html: |-
      <p>It seems to me like you have a few different styles and tendencies that are all jostling for primacy. For example, the terminal on /c/ doesn't resemble the one on /f/ doesn't resemble the one on /g/ doesn't quite resemble the one on /r/. You can make each terminal unique, of course, but some of these just don't seem thematically related enough to belong in the same font. Terminals are a large part of what gives a font its distinct identity and I think an organized approach to them is a hallmark of a font that works well. The serif on the bottom of /L/ is different from the one on the bottom of /E/. Also contrast /p/ and /n/, looking at the spot where the vertical stroke joins the top of the bowl. They're totally different shapes, and another important part of giving the font its character is the shaping of the curves. The form of the serif is by comparison minor, since it doesn't really show up too well at text sizes. Obviously it's important to get the right shape for the serif, but at least to me, that doesn't seem like as big a deal as the issues of shapes and terminals. </p>
      <p>I can't see a lot of detail in this latest image, so I can't say as much as I'd like about the Cyrillic, but I do think the inside point of the /З/з/ should come over a lot further to the left, and the lc /ф/ is much too wide. UC /У/ and lc /т/ are also probably too wide, and in this font the /б/ would probably be better off with the more humanist form (see Minion, for example). The hybrid /Д/д/Л/л/ still seem weird to me (though much better than those bizarre-looking diagonal-topped ones), but a native reader could opine more authoritatively. The roman is a bit better worked out, aside from the thematic and shaping issues I mentioned, but the /s/ could still use some work. Its left curve is too pointy, and the whole letter might just be too wide. The four-way join in the /k/ probably shouldn't be so chunky (that is, I'd reduce it to a point that just kisses the stem). And the very pointy points on /V/W/Z/v/w/z ought to get blunted.</p>
      <p>In general, I'd work on making all the letters look more like they came from the same font, and I'd work on matching up the thicknesses optically (compare the hairline of /e/ with the hairline of /s/).</p>
    html_clean: |-
      <p>It seems to me like you have a few different styles and tendencies that are all jostling for primacy. For example, the terminal on /c/ doesn't resemble the one on /f/ doesn't resemble the one on /g/ doesn't quite resemble the one on /r/. You can make each terminal unique, of course, but some of these just don't seem thematically related enough to belong in the same font. Terminals are a large part of what gives a font its distinct identity and I think an organized approach to them is a hallmark of a font that works well. The serif on the bottom of /L/ is different from the one on the bottom of /E/. Also contrast /p/ and /n/, looking at the spot where the vertical stroke joins the top of the bowl. They're totally different shapes, and another important part of giving the font its character is the shaping of the curves. The form of the serif is by comparison minor, since it doesn't really show up too well at text sizes. Obviously it's important to get the right shape for the serif, but at least to me, that doesn't seem like as big a deal as the issues of shapes and terminals. </p>
      <p>I can't see a lot of detail in this latest image, so I can't say as much as I'd like about the Cyrillic, but I do think the inside point of the /З/з/ should come over a lot further to the left, and the lc /ф/ is much too wide. UC /У/ and lc /т/ are also probably too wide, and in this font the /б/ would probably be better off with the more humanist form (see Minion, for example). The hybrid /Д/д/Л/л/ still seem weird to me (though much better than those bizarre-looking diagonal-topped ones), but a native reader could opine more authoritatively. The roman is a bit better worked out, aside from the thematic and shaping issues I mentioned, but the /s/ could still use some work. Its left curve is too pointy, and the whole letter might just be too wide. The four-way join in the /k/ probably shouldn't be so chunky (that is, I'd reduce it to a point that just kisses the stem). And the very pointy points on /V/W/Z/v/w/z ought to get blunted.</p>
      <p>In general, I'd work on making all the letters look more like they came from the same font, and I'd work on matching up the thicknesses optically (compare the hairline of /e/ with the hairline of /s/).</p>
