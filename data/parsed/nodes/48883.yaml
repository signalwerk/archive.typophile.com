      <p>While I can certainly see the influence, I think there's a enough changes that I wouldn't mistaken the two fonts.  Some of the clear differences can be seen in the m and the r, where 5th Leg has a semicircle extension and the m has smoother humps and flat feet and is a bit stouter.  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
