    html: |-
      <p>Any system which uses the terms Modern and Contemporary is extremely time-sensitive. In other words, it will quickly become meaningless, as what is now contemporary and modern becomes passé. It seems absurd to describe Meta, soon to celebrate its quarter-century, as contemporary. Well yes, it is still quite popular, but so is Bembo!</p>
      <p>You have to decide on which system to classify by, for instance:</p>
      <p>- a description of physical characteristics<br>
      - provenance</p>
      <p>"Modern" could conceivably be a phyllogenetic term, but it would have to relate to the Modernist movement in art and design, which would include both grotesques in the early years (see Lissitsky's <em>The Isms of Art</em> and then geometrics, clearly related to De Stijl and Purism. </p>
      <p>Are we not in the post-modern era? So why not have typefaces that belong to multiple categories?<br>
      Isn't that the way that metadata now works, in keywording at various websites?</p>
