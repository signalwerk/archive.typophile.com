      <p>Here is the Sans Serif classification I propose in my book (that is basically the one proposed by Lewis Blackwell in "Typography of the 20th Century" with some modification by myself):</p>
      <p>– Grotesque, the first sans serif, from the early 19th century to the 1920's : Akzidenz Grotesk, Franklin Gothic ;<br>
      – Humanistic : Gill Sans, Johnston ;<br>
      – Geometrical : Futura, Avant-Garde, Kabel ;<br>
      – Modern : Helvetica, Univers, Folio ;<br>
      – Contemporary : FF Meta, Fedra Sans, Hybrea, FF Cocon…</p>
      <p>dr</p>
