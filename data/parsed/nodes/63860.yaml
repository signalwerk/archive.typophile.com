    <p><img src="/sites/default/files/old-images/Typophile1_4221.jpg"></p>
    <p>I am trying to understand the classification of sans-serif typefaces, but more specifically that of the Grotesque.</p>
    <p>The early British design shown in the example has clearly different qualities to say a typeface like Univers.</p>
    <p>Is anybody aware of any better classification systems? because to my eye, Helvetica, Univers should not be in this category.</p>
    <p>Thanks in advance.</p>
    <p>Fenton</p>
