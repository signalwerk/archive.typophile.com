      <p>Hello all,</p>
      <p>Thanks for the input!</p>
      <p>I managed to track down an earlier definition taken from Wikipedia in 2007 which clearly puts Helvetica and Univers in the Neo-grotesque category,  this seems to be a little more logical now. </p>
      <p>(We corrected Wiki also)</p>
      <p>For those of you raising the Grotesque v Grotesk issue; it seems the German term Grotesk originally stems from the British word Grotesque (definite origins slightly cloudy). But today is used more as an umbrella term for what the British might call (or Wiki) the Sans-serif category.</p>
      <p>To nick, thanks for your comments, although i feel slightly more comfortable with this definition?<br>
      Although i do wonder why the British Grotesques developed those certain characteristics, such as the slightly concave endings and contrasting thicks and thins?</p>
      <p>Anybody got a theory on this. I did hear it might be remnants of traces left-over from calligraphic types? or maybe an attempt to simulate a certain primitive quality?</p>
      <p>I wonder what you guys thought?</p>
      <p>Thanks again.</p>
