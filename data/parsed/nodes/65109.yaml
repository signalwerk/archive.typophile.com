    date: 2009-12-12T20:48:00
    date_raw: 12 Dec 2009 — 8:48pm
    votes: null
    html: |-
      <p>As I understand it, the limit is 64K per lookup. The issue most often crops up with the <code>kern</code> feature, which can become quite large even in modest-sized fonts. You'll usually know you've hit the limit when your feature fails to compile and the error mentions something like "offset overflow." (The <code>kern</code> feature is easier to deal with since it supports subtable breaks, so you can divide it into subtables with simple "<code>subtable;</code>" statements.)</p>
      <p>It's worth mentioning that the order of lookup subtables does matter, just as with the order of statements and features. There's actually a flaw in my example code above; the lookups should be in the opposite order. If "<code>sub f i by fi</code>" runs first, then "<code>sub f f i by ffi</code>" won't do anything since every instance of "<code>f i</code>" has already been substituted by "<code>fi</code>". (Sure, "<code>sub f fi by ffi</code>" would work, but feels less elegant.) Be careful to keep potential conflicts such as this in mind when organizing your code.</p>
