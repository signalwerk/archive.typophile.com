    html: |-
      <p>You can put all the ligatures into one liga feature, but you may need to break them into multiple lookup subtables. There is no practical limit on the number of substitutions you can associate with a feature (a feature is just a tag), but there are limits on the number of substitutions you can put into a single lookup table.</p>
      <p>What software are you using for the OpenType Layout?</p>
