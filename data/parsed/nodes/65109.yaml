    html: |-
      <p>A single Sub would be sub A By B<br>
      A multiple Sub would be<br>
      Sub A By A B C<br>
      Or<br>
      Sub A B C By A<br>
      you cant mix single with multiple subs in one lookup</p>
      <p>Regarding limits<br>
      there are some limitations<br>
      to meny lookups, subs, marking, context, will prevent the font from compiling</p>
