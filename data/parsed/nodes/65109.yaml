  html: |-
    <p>hi, everybody<br>
    i just completed a font with about 1200 ligatures (Grec du Roi) and I need to know if it's possible to make all that substitutions in one Liga feature. Is there any limit? Can I add more than one Liga feature in the same font (Liga1, Liga2...)?</p>
    <p>Konstantinos Siskakis<br>
    Anagrafi<br>
    Greece</p>
