    html: |-
      <p>In FontLab the syntax ought to look something like this:</p>
      <p><code>feature liga { # Default ligatures</code></p>
      <p><code>&nbsp;&nbsp;  lookup liga_1 { # lookup subtable 1</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;    sub f i by fi;</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;    sub f l by fl;</code><br>
      <code>&nbsp;&nbsp;  } liga_1;</code></p>
      <p><code>&nbsp;&nbsp;  lookup liga_2 { # lookup subtable 2</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;    sub f f i by ffi;</code><br>
      <code>&nbsp;&nbsp;&nbsp;&nbsp;    sub f f l by ffl;</code><br>
      <code>&nbsp;&nbsp;  } liga_2;</code></p>
      <p><code>&nbsp;&nbsp;  <em>etc.</em></code></p>
      <p><code>} liga;</code></p>
      <p>With 1,200 ligatures, grouping them into separate lookups should also make them all a bit easier to manage.</p>
