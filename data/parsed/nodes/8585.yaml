    html: <p>Nicolaj, the graphic is wishy washy It needs to be simplier and stronger. The type is fine but I would look into closing up the spacing between the MOL. Its floating a bit.  <br>Now for the hard part what is this company? What do they make, or what do they serve. You may need a tag line to help with the idenity. Remember the reason IBM and other corporate giants could get away with just a name or letter logo is because they could poor millions of dollars into advertising. I would guess your client can't, so make the mark clear and direct to its target audience.</p>
