    html: <p>wow, that's a bad logo. I agree, it doesn't come close to conveying what the company sells. The tree image makes me think of furniture, paper, or cleaning products. <br> <br>I'm guessing that the area where the company is located has a lot of trees and the owner asked whomever designed the logo to include that. <br> <br>The high end kitchen manufacturers I'm familiar with are bulthaup and Varenna, both of which rely on a logotype created out of an existing typeface (bulthaup=rotis and varenna=helvetica black, though I could be wrong.) <br> <br>If the owner wants to compete with those companies, and he can by the looks of the picture you provided, then he should really consider a serious rebranding effort.</p>
