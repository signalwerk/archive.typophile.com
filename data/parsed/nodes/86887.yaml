  html: |-
    <p>A while back I made a little font on <a href="http://fontstruct.com/fontstructions/show/26932" rel="nofollow">Fontstruct. </a>. Since then, I have completely re-drawn it. At this point, it has little more than a passing resemblance to the Fontstruct font, but there is a line in  font info that reads, "Sample	FontStruct is a trademark of FSI FontShop International GmbH" and which originated with the Fontstruct version and which I can not figure out how to get rid of. </p>
    <p>Any advice on that?</p>
    <p>thanks.</p>
