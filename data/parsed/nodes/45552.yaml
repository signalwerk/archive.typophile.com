    html: |-
      <p>Hi Kaile,</p>
      <p>‘single-storey a’ resp. ‘double-storey a’ are certainly the most common terms, and with them, everybody knows what you’re talking about.<br>
      I have heard ‘open/closed a’, too (in German), but it doesn’t make that much sense to me. Same with ‘script a’ (for the single-storey version).</p>
      <p>Some fonts that regularly have a double-storey ‘a’ (and ‘g’) are also available with single-storey alternatives for these letters. They are usually referred to as ‘Schoolbook’ or ‘Infant’ fonts. The idea behind this is that the letterforms for reading should be similar to those for writing. Relevant examples would be Gill Sans Schoolbook or Bembo Schoolbook. However, you won’t call the letter a ‘schoolbook a’ for this reason.</p>
      <p>F</p>
