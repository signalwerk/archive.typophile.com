    html: |-
      <p>James -- </p>
      <p><em>Unicameral</em> and <em>bicameral</em> used in that way are misnomers. The stem <em>-cameral</em> comes from the Latin <em>camera,</em> meaning "room" or "chamber". The terms are usually used to describe different forms of government with one or two legislative houses. </p>
      <p>When applied to type (i.e., by Bringhurst), these terms are usually used to describe whether an alphabet has one or two "cases" -- e.g., Latin script is considered bicameral, since there are upper case (majuscule) and lower case (miniscule) forms. Cyrillic is also bicameral. By contrast, Devanagari (the script for writing Sanskrit, Hindi, and others) is unicameral; there is no upper case.</p>
      <p>It's a bit unusual to apply the terms to the different forms of 'a' or 'g'.</p>
      <p>-- K.</p>
