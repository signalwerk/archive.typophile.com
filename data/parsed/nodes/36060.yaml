    html: |-
      <p>If you give a price and the client says "Yeah, OK" without batting an eyelid you know you're not charging enough. </p>
      <p>If the client does a sharp intake of breath, you're in the right area.</p>
      <p>If the client wants you to do it for a bit less, so much the better - they won't think you're a money grabbing son of a .... they'll just think you're a pro who knows his worth. A bit of negotiation does no harm to your credibility - don't be afraid to do it.</p>
      <p>Nick Cooke</p>
