    html: |-
      <p>The last time I adjusted my own rate by a considerable amount, I didn't hear so much as a peep about it, and I had expected at *least* one of my clients to complain. I think they all knew I had practically been giving my work away.</p>
      <p>Maybe you just need to do it and get it over with.</p>
      <p>You'll like the feeling you get when you make the jump to where you ought to be. Less self-loathing and more focus on quality work.</p>
