      <p><em>A bit of negotiation does no harm to your credibility </em></p>
      <p>Ah, if only there were negotiations. I find that young Art Directors and Designers have no idea how to conduct business. They call, we talk about a project, I give them a price, and  either they accept that price, or I never hear from them again. No negotiations. It's making doing business a real bore.</p>
