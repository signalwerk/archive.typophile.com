    <p>No matter how many articles i have read about pricing my work i just dont seem to have the guts to lay down the amount my work is probably worth.</p>
    <p>Or maybe i have too many sympathy for the clients (don't know why) its like everybody is just as poor as i am to me.<br>
    Where and how do i find the confidence to lay down shocking but realistic price tags on my work? </p>
    <p>I'm a designer + art direction type figure.</p>
    <p>Any tips?</p>
