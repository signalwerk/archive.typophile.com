    <p>Hey guys!</p>
    <p>Wondering if you could ID what font is in this YouTube song. Note that the lyrics are a little profane, being as the song features the F-word. So I guess not for the faint of heart?</p>
    <p><a href="http://www.youtube.com/watch?v=CAV0XrbEwNc&amp;has_verified=1" title="http://www.youtube.com/watch?v=CAV0XrbEwNc&amp;has_verified=1">http://www.youtube.com/watch?v=CAV0XrbEwNc&amp;has_verified=1</a></p>
    <p>That's the video!</p>
    <p>And I was also wondering about the rules of the Type ID board. I always try to look on here to help someone out, but I feel like I post so much on the ID board without really helping anyone because I'm still honing my typography skills and can't ID most things. Is this okay? Will I go to Typophile hell for this?</p>
