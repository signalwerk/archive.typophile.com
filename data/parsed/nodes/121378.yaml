    <p>Hi all,<br>
    I'm working on a magazine supplement and I was asked to set the body copy in a "modern, classy sans-serif font." Yeah, I know, modern and classy...<br>
    I've set it in Gotham for the moment, but I was wondering if anyone has an idea for a typeface that will work better or any tips for making Gotham and sans-serif in general more readable as body copy.<br>
    Thanks in advance!</p>
