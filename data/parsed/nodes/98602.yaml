      <p>I can't find an exact match, but it seems very close to an expanded &amp; modified <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Dafont-2&amp;ffam=Old%20Republic%20-%20Bold&amp;fid=1e048a2122409cd7df7c5df044083324&amp;fsize=36&amp;text=SC%20SUPER%20CARGO&amp;wrap=2" rel="nofollow">Old Republic (Bold)</a></strong> by Trollax Kinora (free for personal use).<br>
      |C| &amp; |E| requires minor modification and you can easily construct a square |O| based on |C| or |Q| </p>
      <p>-----------------------------------------------<br>
      I found it using Find my Font - <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
