    <p>So this is the final round of revisions to this logo - and i'm attempting to center / and make equal distance the letters in this mark. the crest / rum bar are perfectly centered - but i'm running into issues with the width of the words the O in house and I in saint are giving me troubles - i'm wondering should i tighten? or scale it out - or does the overall width of saint and house have to be the same? (which is what i'm trying to do).</p>
    <p>After futzing with it for a while i came pretty close... i'm still not happy with the O and I - I added small slab serifs to help balance it (i think it helps some). </p>
    <p>any thoughts greatly appreciated.</p>
