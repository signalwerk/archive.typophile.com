      <p>To my eye,the word 'SAINT' is much too spread out relative to the word HOUSE. In fact, I just measured and on my screen it's about 10% larger!   Similarly, RUM is has too much space relative to BAR. And they are far from  "perfectly centered".  RUM starts about 44mm to the left of the center of the crest, while BAR ends 39mm to its right. The only thing that's "centered" is the right edge of the M and the left edge of the B.  Stop looking at individual letters and look at the visual effect of the logo as a whole.</p>
      <p> - Herb</p>
