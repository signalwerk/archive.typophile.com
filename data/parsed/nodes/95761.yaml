    html: |-
      <p>Depending on what you're using, you should be able to move each element (letter) completely separately. You are not creating text with a font - you're creating a graphic design with design elements, some of which just happen to look like letters of the english alphabet. Do NOT use whatever kerning or letterspacing is inherent in the font- it is completely irrelevant to your task at hand.</p>
      <p>You'd probably be better off opening your logo in a program like Adobe Illustrator or Corel Draw, converting the text to curves, grouping each element, and then sliding each design element or groups of elements around until they fit and look right.</p>
      <p> - Herb</p>
    html_clean: |-
      <p>Depending on what you're using, you should be able to move each element (letter) completely separately. You are not creating text with a font - you're creating a graphic design with design elements, some of which just happen to look like letters of the english alphabet. Do NOT use whatever kerning or letterspacing is inherent in the font- it is completely irrelevant to your task at hand.</p>
      <p>You'd probably be better off opening your logo in a program like Adobe Illustrator or Corel Draw, converting the text to curves, grouping each element, and then sliding each design element or groups of elements around until they fit and look right.</p>
      <p> - Herb</p>
