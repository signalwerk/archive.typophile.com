    html: |-
      <p>My inclination would be to sort the HOUSE kerning (the HO combination is a little too tight); then work on SAINT to a similar visual amount of kerning; then work on the spaces either side of the device (the T• is a bit loose thanks to the open space under the bar).</p>
      <p>Then, when it is in use, centre on the device not on the overall width (you might want to drop in an invisible exclusion area box to make life easier).</p>
      <p>Tim</p>
