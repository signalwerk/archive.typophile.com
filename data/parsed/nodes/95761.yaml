    html: <p>Yes, Nick, there ARE many ways to skin a cat.  But esigns that are significantly unbalanced are more psychologically acceptable than those that are only a LITTLE off; it's clear that that's the way they're meant to be. When something is just a little off, it looks like a mistake.  That's why both versions of The Times' nameplate look fine, while "Saint House" just looks slightly askew.</p>
