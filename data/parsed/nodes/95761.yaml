    html: |-
      <p>In the illustrator file create a box with no fill and no stroke, centred on the logo device, make it larger than the logo. The area surrounding the logo into which no other graphic element or text should intrude – the exclusion area, this surround could be based on half the height of one of the characters or maybe the height of the device.</p>
      <p>When you import it into InDesign, for example, and size it and centre it in a picture box, it will position the device on the centre line because it uses the invisible box to centre.</p>
      <p>Tim</p>
