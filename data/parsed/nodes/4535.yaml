  html: <p>Identity for Buddha Jewelry, large guage tribal jewelry hand crafted in Bali. materials- stone, jade, bamboo, coconut shell, mother of pearl, wood and buffalo horn -for the modern primitive. Rush job- 9 days. 8 pages. Identity, in-house photography, print collateral, print management. This client rules- paying fair rates, good communication and creative freedom. Wish there had been more time. Things can be less than perfect doing 18-28hr. work sessions, with 2-4 hour naps <br>inbetween. Thank Buddha for espresso. Images shown do not have final SKU numbers or titles which just arrived this morning. <br>+++ jpeg +++ 34681 +++  <br>Identity-type +++<img src="http://www.typophile.com/forums/messages/29/34689.jpg" alt="type in use"><img src="http://www.typophile.com/forums/messages/29/34690.jpg" alt="catalog cover"><img src="http://www.typophile.com/forums/messages/29/34691.jpg" alt="simplified logo"><img src="http://www.typophile.com/forums/messages/29/34692.jpg" alt="jewelry detail"><img src="http://www.typophile.com/forums/messages/29/34693.jpg" alt="sample catalog page"> <br>typefaces used. "Buddha" -custom, "Jewelry"- Peter BIlak's Fedra Normal Small Caps, Body Copy- Mark Von Bronkhorst's Conduit. <br>( wanted to use new Suitcase Foundry fonts but was unable to obtain in timeframe). Custom Tribal text face design was killed due to rush. <br>Web design with proprietary CMS in works. Initial comp. <br>Collaborators- my biz partner Michael Greenwood (web/coder/ <br>co-creative) and Brad Peterson (Layout and production)-thanks bro you saved our ••• with the endless pre-work and production.</p>
