    html: <p>There are two outline fonts in old Adobe Optima files, one hi-res and another low-res. If you can open the font file with Fontographer (maybe with FontLab also, but I've never tried to do this on FontLab) you can generate a "low resolution vector font" that is exactly what you are looking for. <br> <br>jmc _=+</p>
