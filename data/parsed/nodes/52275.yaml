      <p>Nick: it takes time and courage for a designer to spend a huge amount of time digitizing another artist's design in order to revive it, to dedicate one's skills to the art of someone else so that the typographic creation and the creator himself doesn't fall into oblivion. I will not put Dwiggins designs in the book and say "this is my design". I will say "This is William Dwiggins design" and I will explain as much as possible about it. And hopefully if a designer uses my book to revive one of these typefaces, he will do so with respect, as many designers did (some of them contributing to this very forum), never forgetting to mention the original creator. I don't see any "swiping", stealing, or disrespect in my project, but feel free to do so. </p>
