      <p>Yes.<br>
      In Scotch Modern I worked from original impressions of metal type, drawing the glyphs by eye, with no scanning or tracing.<br>
      I didn't change the design of any of the letters. My intention was to make "facsimile" fonts, although in a different medium (digital-offset, rather than metal letterpress).</p>
      <p>From my perspective David's book would be useful if it encouraged redesigners to seek out the raw material which he has drawn their attention to, rather than just scan and autotrace from his reproductions.</p>
