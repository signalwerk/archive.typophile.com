      <p><em>I don’t see any “swiping”, stealing, or disrespect in my project, but feel free to do so.</em></p>
      <p>David, I'm using the term "swipe" in a light-hearted manner, as per my local design book store:<br><a href="http://www.swipe.com">www.swipe.com</a></p>
      <p>You're not swiping, but are creating a book that other designers can "get inspiration" from.<br>
      Really, any design book with a lot of pictures falls into that category, but those with images that invite scanning, particularly so.</p>
      <p><em>it takes time and courage for a designer to spend a huge amount of time digitizing another artist’s design in order to revive it, to dedicate one’s skills to the art of someone else so that the typographic creation and the creator himself doesn’t fall into oblivion.</em></p>
      <p>Bullshit. Sure, it takes time and effort to do a good job of digitizing an old face, but you're pouring it on a bit thick with the rescuing from oblivion malarkey. By providing high resolution images, you will be making it easy for hacks to do a quick and dirty job autotracing from second-hand material. Where's the nobility in that?</p>
      <p>Here's an idea: perhaps it is actually more daring to design a typeface of one's own.</p>
