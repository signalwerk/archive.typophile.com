      <p><cite> Piccic: I thought about that, but in all honesty, the original Futura is already available in many books, not to mention the web... I will though investigate the Gill Sans alternates (I think I saw some at the St Bride library). </cite><br>
      Yes, David, but I don't think there is a consistent version of Futura conveying its essence.<br>
      Personally, I don't like Futura so much, but there is too much that got lost in early digitizations (for Gill, that's infinitely multiplied). It all depends on where the focus of the book will be…</p>
      <p>I do not agree with Nick when he says, after David's comment:<br><cite> it takes time and courage for a designer to spend a huge amount of time digitizing another artist’s design in order to revive it, to dedicate one’s skills to the art of someone else so that the typographic creation and the creator himself doesn’t fall into oblivion. </cite><br><strong> Bullshit. Sure, it takes time and effort to do a good job of digitizing an old face, but you’re pouring it on a bit thick with the rescuing from oblivion malarkey. By providing high resolution images, you will be making it easy for hacks to do a quick and dirty job autotracing from second-hand material. Where’s the nobility in that?<br>
      Here’s an idea: perhaps it is actually more daring to design a typeface of one’s own. </strong></p>
      <p>"Bullshit" un corno. It takes <cite>a lot </cite> of courage to take on one's shoulders the task of *properly* digitize a typeface, in order to get into its timeline spirit, the designer, to catch its essence and rework it for the present.<br>
      It may take a lot more courage than designing one's own typeface, since it requires one's own "ego" to be left apart in order to devote themselves to the work of another person.<br>
      At least, so it's always been for me. I've never been able to complete any re-production of lead types because it always seemed more attractive to work on original designs.</p>
      <p>Surely Nick is right when he says this makes life easier for superficial people hacking existing work, but it all depends on how David will plan and project his book.<br>
      Unfortunately such things have always been, but if we keep worrying about this we'll be concentrating merely on potentially negative behaviors, not good ones…</p>
