    html: <p>You might consider including display cuts of more common typefaces, many of which have never been digitized. The typical faces offered by the big foundries, such as Linotype and Monotype, are based on the text sizes, since that's what their pre-digital equipment was made to set. Before the digital era, most hand-set cold type (Typositor, rub-down sheets, etc.) for display sizes was based on large sizes of foundry metal type. There are significant differences between the text cuts and display cuts of metal faces, and we've lost a big part of typographic legacy in the one-size-fits-all digital era.</p>
