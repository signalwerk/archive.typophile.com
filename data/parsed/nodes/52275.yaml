    <p>Hello fellow typophiles,</p>
    <p>I am currently preparing a book in french and english, due to be released in Europe and America around september 2009 at Atelier Perrousseaux publishing (the french publisher of Adrian Frutiger books), about 'forgotten typefaces': alphabets which have been drawn, possibly cast and used 500, 100 or 30 years ago but, for numerous reasons, didn't make it (yet) to the digital age and are not available on any computer. </p>
    <p>The increasing rarity or lack of documentation about these might bring them to complete extinction, so I thought it would be a great idea to document these letters and their authors, and to provide good quality, high resolution prints of them for the courageous designers who would have the good idea to digitize them, or simply for the pleasure to see these letters again and again. </p>
    <p>I already have quite a big amount of documentation, but I am very much looking for help: if you have any document (visual and/or text) about a 'forgotten typeface', I'd be very happy to consider it. Be sure that any help will be thoroughly aknowledged in the book.</p>
    <p>Thank you in advance,<br>
    dr</p>
    <p>ps: In the framework of this project, I am looking for some high resolution scans from the "book of oz" which I (unfortunetaly) still don't own. If some good (and lucky) soul wants to help...</p>
