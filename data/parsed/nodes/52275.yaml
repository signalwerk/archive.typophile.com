      <p>If you're going to look at Cooper's work, then you should also consider the lesser known designs by his contemporaries Goudy and Dwiggins. There are probably dozens of Goudy faces that are undigitized. After all, he claimed to have designed more than 100 typefaces, some of which didn't even make it into much metal distribution (including many which may not warrant revival). Jim Rimmer would probably be an excellent resource for information about Goudy's oeuvre.</p>
      <p>Works by Dwiggins (my area of some expertise) that might fit your criteria would include:</p>
      <p>Charter (although Sibylle Hagman's Odile is a nice homage)<br>
      Hingham (Christian Schwartz had started something loosely based this newsface experiment; I don't recall how loose.)<br>
      Arcadia<br>
      Stuyvesant (I've been working on an interpretation/homage off and on)<br>
      Falcon<br>
      Tippecanoe<br>
      Experimental 276D</p>
      <p>Of these, Falcon is the only one that was ever commercially produced (posthumously). Charter, Arcadia, Stuyvesant, and Tippecanoe made it into at least one commercial publication, but were not produced. Experimental 267D made it into one rare piece of ephemera that I know of. Not all of these necessarily warrant revival either. And I'm not considering other experiments that didn't reach a certain level of fruition.</p>
      <p>I have a fair amount of documentation on many of the above list. If you're interested in pursuing any of these for your book, let me know. Your brief is pretty wide open, so I'm not entirely sure what you're looking for. I'm not so interested in contributing to a swipe book, but historical documentation is right up my alley.</p>
      <p>-- K.</p>
