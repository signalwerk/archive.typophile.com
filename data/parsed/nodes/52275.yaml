      <p>Maybe we agree, it's just your frankness which may be misinterpreted, expressed with your vocabolary it may sound presumptuous. I know the problem very well, suffering from it… :=)<br>
      But I don't think David meant the book as a source for "scanning and autotracing". It seems more about important steps under the dust in the course of history, I hope. Although it seems not easy…</p>
      <p>I don't like the term "revival" because to me it implies a sort of superfluous addition to an original.<br>
      While this may be fine, the example of Odile is fitting. I think Sybille Hagman reworked the original forms of Dwiggins enough to make the whole typeface her own.<br>
      For the same reason I think Dwiggins Charter deserves a good digital version. It's radically different from Odile, I would never use them for the same purpose.</p>
