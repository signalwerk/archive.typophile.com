      <p>Hello everyone,</p>
      <p>Oh my, that's a lot of answers - thanks, first. I will answer precisely to everyone today but it will take a little time. Right now, I just wanted to let you know that my book will not be a swipe: I am working closely with my publisher, Yves Perrousseaux, a well-known typophile, holding conferences in Lure every summer since 1969, close friend to Adrian Frutiger (as mentionned above, he published 4 of his books in France), currently writing the second volume to his monumental typography encyclopedia (volume one being translated in english right now). My own first book contains contributions by Erik Spiekermann, Ale Paul, Bas Jacobs and Xavier Dupre and was approved by Zuzana Licko and Peter Bil'ak; I am not preparing something else than a fully documented homage to some typefaces with hopefully great visuals and interesting texts. So, don't worry.</p>
