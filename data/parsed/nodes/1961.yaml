    html: <p>I'm glad we're finally on to discussing concept and tossing around ideas.  <br> <br>I agree � there are some shirts that have some solid concepts behind them but are poorly executed. Then there are some nice <i>looking</i> designs that just don't really say anything. And there are a few standouts. <br> <br>To answer the question, yes, I have sumbitted a few, and I'm working an a few more. So I'm putting myself out there for criticism as well. (Actually I was working on an anagram-based idea yesterday, but it looks like that avenue is being covered...) <br> <br>BTW, Hrant, it is not illegal to use Emigre fonts in Flash. I actually spoke with a woman at the company before we started using Mrs. Eaves on our site and obtained their permission. It's more PDF and Flash <i>applications</i> that they are concerned with. I'm told they are working on a Flash-specific licensing agreement to be released in a few months. FYI. <br> <br>:-)</p>
