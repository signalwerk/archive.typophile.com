      <p>Kim,</p>
      <p>You can hire a graphic design student who still in school, check around your area to see if there was any design school, they would do anything for experience, and for $50 or so, but it won't be that great.</p>
      <p>If you are serious about the business, then you should be serious about the image of your company. Paula Scher designed citibank logo for half million in couple minutes. Do you think it worth it? I would suggest spend a little bit more on the budget range, not to mention there are also fee for trademark, copyright and all that too. :)</p>
      <p>But i think it would help to shop around, see who you can afford.</p>
