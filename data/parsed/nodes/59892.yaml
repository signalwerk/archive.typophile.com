    <p>My sincere apologies if this is not the forum for such a request. Came here because you guys are the pros ... </p>
    <p>I've just set up new business and looking for ideas for logo font type for my company name (Great font = great logo) "Tudor&amp;Company" promotes brands through equestrian lifestyle marketing.  Tudor name is known in my biz so have been advised to use it.  Guess Tudor goes with "heritage" of elite equestrian lifestyle. Sounds a bit like "Town&amp;Country" or "Tiffany&amp;Co" which will ring true to the elite horse biz. Suggestions appreciated! </p>
    <p><a href="mailto:kimtudor@aol.com">kimtudor@aol.com</a></p>
