    <p>As part of my studies I needed to create a personal logo using only my initals (C.M). This was never going to be an easy task. But I am reasonably happy with what I came up with.</p>
    <p>I think if I looked long enough I would be able to see some faults with the design, but for the time being it will stay as it is (I’m not going into business any time soon I don’t thin).</p>
    <p>I am just wondering what might be some suggestions for slight/major alterations and just general thoughts on what I have designed.</p>
    <p>Thanks for any thoughts.</p>
    <p></p><div class="imageWrap"><img src="/files/LogoForm_Final_3918.png"></div><p></p>
