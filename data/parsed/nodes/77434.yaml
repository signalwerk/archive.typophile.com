    html: <p>You can always explore the option of opening up the intersecting strokes, especially for print purposes. I am assuming this will go on a business card or something? Creating some "clog reduction" would most likely reduce the "type color" for the NN, especially if it is displayed at a larger size or for print, and it does not compromise the rest of the letterform. You can see this extreme example here from Matthew Carter's font <a class="freelinking external" href="http://nicksherman.com/articles/bellCentennial/inkTraps.gif" rel="nofollow">Bell Centennial</a>.</p>
