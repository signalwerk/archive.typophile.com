      <p>John: <em>...can't imagine, from what little I know of him from having seen his site, why anyone would feel that way about him.</em></p>
      <p>Back when Luc was active in comp.fonts and other discussion forums, he was very outspoken in opposition to intellectual property protection for type design, so rubbed a lot of designers the wrong way. It wasn't just the opinions that pissed people off, but the fact that they came from a tenured academic who can do and say pretty much whatever he wants without any consequences. It seemed too easy, from such a position, to make pronouncements about things that other people perceive as affecting their livelihoods.</p>
      <p>As for his site, I've never found it very useful for the things that interest me, despite or perhaps because of its unselective exhaustiveness. Huge numbers of the links are dead, especially in the non-Latin pages, and appear not to have been checked since he first added them, sometimes many years ago.</p>
    html_clean: |-
