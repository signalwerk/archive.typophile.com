      <p><em>The original reasons why those laws came to be seen as a good idea were from an age when authoring, publishing, and modifying published works required large capital expense. </em></p>
      <p>That’s true, up to a point, and not quite in the way that you intended.</p>
      <p>Originally, copyright was maintained by royalty to prevent the spread of seditious ideas.<br>
      That monopoly, lack of competition, and small runs of dull books, kept prices high.<br>
      When copyright was redistributed to publishers in the 18th century, it created a boom in books by the early 19th century, with lower prices and mass readership.</p>
      <p>See St Clair:<br><a href="http://www.amazon.com/The-Reading-Nation-Romantic-Period/dp/052181006X">http://www.amazon.com/The-Reading-Nation-Romantic-Period/dp/052181006X</a> </p>
      <p>However, that was within countries. Internationally, there was no copyright!<br>
      The work of Charles Dickens, for instance, while protected in the UK, was pirated in the US, prior to the international agreements mid 19th century.</p>
      <p>So the argument that the pre-digital international copyright paradigm established in the mid 19th century was favored because of the large investment required in authorship and publishing doesn’t make sense; it was political, driven by a sense of fair play. And Dickens’ celebrity advocacy.</p>
      <p>In some ways, Dickens’ tour of the US was like a rock star today; he was making no money from book sales, although they had created his fame. He was selling tickets to speaking performances of his works, which he delivered with great drama.</p>
