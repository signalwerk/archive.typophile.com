      <p>The bottom line is that the laws for physically distributed media aren't enforceable for digital media. (Or, at the very least, they are weakened to a point where they aren't much more than symbolic in strength.)</p>
      <p>And that's that. Let's move on. We can wax about whether making a copy of something should or should not be a crime or not till we're blue in the face, but it won't make a difference.  </p>
      <p>Something like the level of protection for physical media in days of yore COULD be enforced for digital media but the costs - every kind of cost you can name - would be madly insane.  And you would certainly have to kiss the First Amendment goodbye.<br>
      The bottom line here is that the polity doesn't want it. Strong copyright protection isn't wanted. It's not welcome. And you can preach about "good" content inevitably disappearing without protections till you're blue in the face from that, too, but it still won't make a difference.</p>
      <p>To the topic: Luc's site is awesome. Always was. Font ugly or no.</p>
