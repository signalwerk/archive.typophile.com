      <p><em>I think that only used to be true in the past, and is now an outdated view; I think monopoly rights restrictions today tend to retard progress</em></p>
      <p>As Utah Philips said, the past didn't go anywhere. The fact that intellectual property laws have been hijacked by corporations doesn't mean that the original reasons why those laws came to be seen as a good idea have gone away. Indeed, today they are often the only thing standing between a creative individual and the uncompensated economic exploitation of his work <em>by those same corporations.</em> If you want to do away with corporate monopoly rights restrictions, you need to come up with an alternative mechanism to prevent exploitation of individual creators.</p>
