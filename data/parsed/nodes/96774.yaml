      <p>@oldnick:<br><cite>Using that same logic, I suppose that nobody really deserves to live, either.</cite></p>
      <p>Well, the wording of the poster you quoted began the process of confusing things.</p>
      <p>The statement "Artists deserve to be paid for their work" (which I will refer to as X) has more than one meaning.</p>
      <p>To say:</p>
      <p>P: <em>Artists should not have their work appropriated without compensation.</em></p>
      <p>is <em>not</em> to say</p>
      <p>Q: <em>Artists are entitled to compensation for their creative work irrespective of whether or not there is any market demand for that work.</em></p>
      <p>So when someone makes the ambiguous statement X in a context where it is clear that person is asserting P, for someone to say that, no, X is false, because <strong>Q</strong> is false... begins the process of creating confusion.</p>
      <p>I think, though, that your post <em>continued</em> the process of getting things thoroughly confused.</p>
      <p>An example of an opinion that avoids confusion might be:</p>
      <p>Artists do deserve to live, <em>and</em>, like everyone else, they deserve to be free from interference in their efforts to live.</p>
      <p>Thus, on the one hand, they do deserve protection from having their work appropriated without compensation.</p>
      <p>On the other hand, if their work is not of interest to the market, the best they should expect from their right to live is to get welfare like anyone else, not to have the government support their art with tax dollars.</p>
      <p>I'm not saying one has to agree with that opinion.</p>
      <p>On the one hand, some Libertarians strongly support copyright laws, while followers of related political beliefs question where the authority to enact a copyright or patent law could come from (on the assumption that without a natural law right as its basis, such a law would be a government tax decree, not a protection against force or fraud).</p>
      <p>On the other hand, non-Libertarians might see government patronage of the arts (but hopefully with <em>some</em> judgment of the quality of what is supported) as essential to a civilized society.</p>
      <p>I'm not even claiming the opinion given as an example as my opinion; I'm just noting that here is how one can debate these issues while keeping them sorted from each other.</p>
