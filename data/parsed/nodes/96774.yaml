      <p><em>It certainly is true that IP protection is essential to allow people to make a living from their creativity or inventiveness; it promotes a faster pace of creation and progress.</em></p>
      <p>I think that only used to be true in the past, and is now an outdated view; I think monopoly rights restrictions today tend to retard progress, cf Benkler.</p>
      <p><em>No, it's not. Artist should be paid for their work, just like butchers get paid for a leg of lamb. “Virtual” goods are still goods…</em></p>
      <p>I agree labour should be paid, but I don't think that artists or anyone else <em>deserves</em> to be paid for their work. People deserve to earn what others are willing to pay them for; if someone's art is shit, they're shit outta luck. ;p</p>
      <p>And I disagree that "“Virtual” goods are still goods" - digital works and physical property are fundamentally different in nature, since digital works can be duplicated and redistributed, and modified, in a way that physical property can not. But the labour/service of creating the works remains open as viable commercial activity.</p>
