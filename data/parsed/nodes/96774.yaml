      <p>Dave: <em>The business value would shift from copies to production.</em></p>
      <p>How? Will authors be paid some sum up front to produce novels? Paid by whom? On what basis would the sum be calculated? The commercial value of such creative works cannot be determined until they exist and are products in the market, then it is determined precisely by how many copies sell. If you make all copies free by making copying free, how is the value monetised? Copyright enables monetisation of copies, and hence of income to the author. The reduction in capital expense that you describe affects who may publish and how, which is a good thing, and reasonably should affect pricing -- as it very obviously has in the case of fonts --, but it doesn't change the situation of the author with regard to uncompensated exploitation of his work, including the exploitation of readers who want to enjoy what he has produced without paying him anything.</p>
