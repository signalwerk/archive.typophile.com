      <p>@John Hudson:<br><cite>How? Will authors be paid some sum up front to produce novels? Paid by whom? On what basis would the sum be calculated?</cite></p>
      <p>While this business model would result in grossly inadequate compensation for creators, it is not quite as totally unworkable as your questions suggest.</p>
      <p>After all, people do get paid for, say, preparing the masters for printing ruled ledger paper, despite the fact that anyone can do it, so one could imagine novelists being paid on the same basis.</p>
      <p>Thus, a society that saw novels as merely a way to promote the sale of newsprint, and which was content to have only as many works of real artistic merit as people might, as an amateur pursuit, make and give away for free, might feel entirely content to have no copyright laws.</p>
      <p>In Canada, once upon a time, while music could be copyrighted, musical works weren't eligible for royalties until something like ten or twenty years after they were first published. Thus, while composers of works of enduring merit would be rewarded, those who composed ditties that were mere passing fads would not be.</p>
      <p>One could easily imagine the United States, at some time in the 1950s, deciding  to adopt such a rule so as to destroy the music industry (this, of course, is before the RIAA had its lobbyists firmly in place) in order to save the nation's youth from the pernicious influences of that musical genre known as "rock and roll".</p>
      <p>Sadly, artists and creators are not universally loved. But while musicians and composers are sometimes hated, the fate of type designers is more likely to be ignored and forgotten.</p>
