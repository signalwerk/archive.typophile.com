  html: |-
    <p>Hi<br>
    Im doing a book on art and museums, and I was thinking of using Centaur...can you please suggest a sans serif font that is a good combination with Centaur?<br>
    Also, would you recommend any other serif/sans serif font combinations which are historically relevant to art and museums?<br>
    Any feedback would be much appreciated.<br>
    ...Thank you!</p>
