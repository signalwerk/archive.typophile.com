    html: |-
      <p><a class="freelinking external" href="http://typophile.com/user/909" rel="nofollow">Thomas Phinney</a> wrote: <cite>Most humanist sans would work quite well [with Centaur], especially those with a classical architecture. ITC Legacy Sans, for example.</cite></p>
      <p>An eminent choice. Ronald Arnholm's <em>Legacy</em> and <em>Legacy Sans</em> are based on the work of the Venice-based punchcutter Nicolas Jenson (as is Bruce Roger's <em>Centaur</em>). You might even use those two faces for the body and marginalia, respectively, and use <em>Centaur</em> for headings or as a display face. Robert Slimbach's <em>Adobe Jenson</em> also has much to recommend it, and like <em>Legacy</em> was designed on a computer (whereas <em>Centaur</em> is a digitization of a Monotype revival of a roman cut in 1469).</p>
