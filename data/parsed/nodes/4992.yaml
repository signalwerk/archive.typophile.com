  html: <p>I bought an HP business inkjet 1100 which works fine but prints incomplete text (missing characters, even missing lines) when using the Adobe Type Mannager Deluxe to load postscript fonts, when this program is off text prints ok, but when it�s on words start disspearing from printed text, even using true type fonts. <br> <br>I am using a pc running win 98 second edition and adobe type mannager to load fonts. <br> <br>I would like to know if someone else is using this printer on windows and using ATM as well. <br> <br>Anyone who know how to fix the problem? I have tried all of the available HP drivers and patches.</p>
