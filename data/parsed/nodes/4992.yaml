    html: <p>Back on the Type 1 to TrueType angle again, I should add that my comments about TT autohinter quality are solely for the readily available retail-priced solutions. Various companies have proprietary or high-end TT autohinters that may do a significantly better job. Ditto the outline conversion. <br> <br>Now, going from TrueType to Type 1, the outlines aren't harmed any, and the readily available auto-hinters are pretty good (and likely to improve more soon). But mostly it depends on how well hinted the TrueType was, and the particular imaging environment. Getting worse and getting better are both pretty plausible outcomes, as is "different but equal." <br> <br>Cheers, <br> <br>T</p>
