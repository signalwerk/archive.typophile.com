  - id: 36321
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>TT curves need more on-curve points, but fewer BCPs, than PS. But some conversion algorithms (like Fog's) brute-force it and put way too many points - and sometimes ruin things too. Try this for example: take an \"s\" that has no explicit inflection points in its spine (so just a point at each end of each spine curve - nothing in the middle) and convert it to TT... <br> <br>Screen rendering: <br>Actually, unless the hinting is totally ruined (something Fog would probably do though...) the TT renderer will generally do a better job than the PS renderer! But if not what you can do is turn on anti-aliasing for all PPEM sizes. You can use FontLab or VTT to do this. <br> <br>hhp <br></p>"
    html_clean: "<p>TT curves need more on-curve points, but fewer BCPs, than PS. But some conversion algorithms (like Fog's) brute-force it and put way too many points - and sometimes ruin things too. Try this for example: take an \"s\" that has no explicit inflection points in its spine (so just a point at each end of each spine curve - nothing in the middle) and convert it to TT... <br> <br>Screen rendering: <br>Actually, unless the hinting is totally ruined (something Fog would probably do though...) the TT renderer will generally do a better job than the PS renderer! But if not what you can do is turn on anti-aliasing for all PPEM sizes. You can use FontLab or VTT to do this. <br> <br>hhp <br></p>"
  - id: 36322
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Actually, TT curves need more total points, period, for reasonably equivalent curves in all but a few simple cases. However, it's certainly true that most conversion approaches tend to use more points than one might think necessary in an attempt to get a closer match to the original. This occurs because you can't make a perfect match to cubic curves with quadratic curves (though you can going the other direction). <br> <br>Contrary to what Hrant suggests, it is my experience that auto-hinted TrueType generally does not render as well as auto-hinted Type 1. You can of course do a lot more with manual TrueType hinting, but when we're talking simple conversions without manual work, yes, the rendering generally suffers. Even if you do it in FontLab. Turning on anti-aliasing for all sizes will help, though. <br> <br>T</p>
    html_clean: <p>Actually, TT curves need more total points, period, for reasonably equivalent curves in all but a few simple cases. However, it's certainly true that most conversion approaches tend to use more points than one might think necessary in an attempt to get a closer match to the original. This occurs because you can't make a perfect match to cubic curves with quadratic curves (though you can going the other direction). <br> <br>Contrary to what Hrant suggests, it is my experience that auto-hinted TrueType generally does not render as well as auto-hinted Type 1. You can of course do a lot more with manual TrueType hinting, but when we're talking simple conversions without manual work, yes, the rendering generally suffers. Even if you do it in FontLab. Turning on anti-aliasing for all sizes will help, though. <br> <br>T</p>
  - id: 36323
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>I guess any conversion entails a loss of efficiency*, which accounts for both the increase in points and the decrease in hinting quality. But doesn't the same thing happen the other way? Take a good TT font, convert it to PS, and you'll end up with more points and worse rendering. So I suspect it depends on the quality of the conversion most of all. <br> <br>* Are you sure PS to TT is lossless? <br> <br>As for on-screen rendering quality, it's pretty clear to me that the TT algorithms are much better - it's just that it's harder to take proper advantage of them. Like stickshift versus automatic transmission. Certainly in Windows, PS rendering is the pits - and on the Mac you had bitmaps to help out - although no longer, since they've now adopted the full-fuzz delusions. <br> <br>hhp <br></p>
    html_clean: <p>I guess any conversion entails a loss of efficiency*, which accounts for both the increase in points and the decrease in hinting quality. But doesn't the same thing happen the other way? Take a good TT font, convert it to PS, and you'll end up with more points and worse rendering. So I suspect it depends on the quality of the conversion most of all. <br> <br>* Are you sure PS to TT is lossless? <br> <br>As for on-screen rendering quality, it's pretty clear to me that the TT algorithms are much better - it's just that it's harder to take proper advantage of them. Like stickshift versus automatic transmission. Certainly in Windows, PS rendering is the pits - and on the Mac you had bitmaps to help out - although no longer, since they've now adopted the full-fuzz delusions. <br> <br>hhp <br></p>
  - id: 36324
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>No, this isn't a matter of \"loss of efficiency.\" Given a constant em square, the cubics used by PostScript are a higher order math than the quadratics used by TrueType. They are a superset. You can go the one way losslessly, and not the other. <br> <br>I'm taking it from this discussion that you have never read my article on font formats. It's available in various locations, including here: <br><a href=\"http://www.font.to/downloads/TT_PS_OT.pdf\" target=\"_blank\">http://www.font.to/downloads/TT_PS_OT.pdf</a> <br> <br>There's no question that *if* one puts manual hinting work in, TrueType will look better than Type 1 in Windows in apps that use the OS rendering. It also helps if the developer manually fixes up the outlines, if they were converted from Type 1. However, we're talking about automated conversions. In such cases, they generally look the same as or worse than the original. <br> <br>So, yes, the TrueType format has a bazillion capabilities that Type 1 lacks. But hardly any of these get used particularly well in simply converted fonts that have not had any manual work. Even with pretty good converters, it has always been my observation that Type 1 fonts converted to TrueType render about equally well at best, and generally look worse. <br> <br>When you're talking Apple's current OS X rendering, it's not at all clear to me that there is any reason that even superhinted TrueType should fare any better than auto-hinted Type 1. <br> <br>Regards, <br> <br>T <br></p>"
    html_clean: "<p>No, this isn't a matter of \"loss of efficiency.\" Given a constant em square, the cubics used by PostScript are a higher order math than the quadratics used by TrueType. They are a superset. You can go the one way losslessly, and not the other. <br> <br>I'm taking it from this discussion that you have never read my article on font formats. It's available in various locations, including here: <br><a href=\"http://www.font.to/downloads/TT_PS_OT.pdf\" target=\"_blank\" class=\"link-external\">http://www.font.to/downloads/TT_PS_OT.pdf</a> <br> <br>There's no question that *if* one puts manual hinting work in, TrueType will look better than Type 1 in Windows in apps that use the OS rendering. It also helps if the developer manually fixes up the outlines, if they were converted from Type 1. However, we're talking about automated conversions. In such cases, they generally look the same as or worse than the original. <br> <br>So, yes, the TrueType format has a bazillion capabilities that Type 1 lacks. But hardly any of these get used particularly well in simply converted fonts that have not had any manual work. Even with pretty good converters, it has always been my observation that Type 1 fonts converted to TrueType render about equally well at best, and generally look worse. <br> <br>When you're talking Apple's current OS X rendering, it's not at all clear to me that there is any reason that even superhinted TrueType should fare any better than auto-hinted Type 1. <br> <br>Regards, <br> <br>T <br></p>"
