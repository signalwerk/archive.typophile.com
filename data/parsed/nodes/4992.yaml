    html: "<p>I converted a couple of postscript fonts to true type format, they worked but had a couple of bugs: <br> <br>1) They had a bunch of innecesary extra vector points in the outlines, specially on curves <br> <br>2) They rendered awfully on screen <br> <br>Is there a way to avoid this?</p>"
