    <p>I found this free font the other day and wanted to share it. Its called VAL and has a lovely rounded form with curved lines making it really striking and different.</p>
    <p>You can find it here…</p>
    <p><a href="http://fontfabric.com/?p=585" title="http://fontfabric.com/?p=585">http://fontfabric.com/?p=585</a></p>
    <p>Its seems to look really good in simple short forms of type. Perfect for logos or headlines, though the legibility is not amazing, but hey, its not really about that!</p>
    <p>I also love the way it is displayed on this site. Gives good examples, but also shows the font as an alphabet form in posters with 4 fonts per page. I think this is a really interesting and original way of showing a font. It also directly shows you how effective it is in simple form.</p>
    <p>Anyway, hope you think its as nice as I do.</p>
    <p>Enjoy.</p>
