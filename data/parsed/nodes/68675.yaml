    <p>When I put http://en.wikipedia.org/wiki/Chrząszcz it ought to be "turned into links automatically", but isn't. The aogonek tricks the forum. BTW double square brackets work<br>
    <a class="freelinking external" href="http://en.wikipedia.org/wiki/Chrząszcz" rel="nofollow">http://en.wikipedia.org/wiki/Chrząszcz</a><br>
    Unluckily I'm not able to fix it in my post <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">thread</a></p>
