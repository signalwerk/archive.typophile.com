    html: <p>Unfortunately, browsers are stupid enough to expect non-ASCII characters to be percent-encoded in URLs. Hence it would be typical to see browsers, including the one you’re using to compose the link, borking at a structure like <code>&lt;A HREF="http://en.wikipedia.org/wiki/Chrząszcz"&gt;</code>. It would have to be encoded as <code>Chrz%C4%85szcz</code>, I think.</p>
