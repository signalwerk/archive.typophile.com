    <p>Cameron Adams is one of those rare designer/developers that breaks right-brain, left-brain stereotypes. <a href="https://web.archive.org/web/20080821164014/http://www.themaninblue.com/experiment/Cubescape/load.php?id=894">Cubescape</a> is one such example of an experiment in code that performs as beautifully as it is designed. </p>
