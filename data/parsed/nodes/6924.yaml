    html: <p>It depends on bunches and bunches of things. <br>It might take a couple of days to hack out a cheesy display face, or it might take many hundreds of hours to craft a good text face. The slowest I've gone averages out to one glyph a day. <br> <br>Typically though, for a person with decent talent and skill, it might take two solid weeks to produce a basic character set that's minimally good. For a novice, maybe 2-3 times longer? I'm just guessing though. <br> <br>hhp</p>
