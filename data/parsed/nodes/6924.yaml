    html: <p>thanks hrant, <br> <br>i'm on the verge of starting some typefaces i've been playing around with for quite some time. i've got a lot of motivation and ambition right now, but those 2 things usually hit the wall of reality at some point and never really setting out and doing it the right way from step 1, i'm just curious and interested as to what i can expect my pace to be. my guess will be slow. very slow.</p>
