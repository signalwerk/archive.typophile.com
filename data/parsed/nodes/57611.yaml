      <p>Looks great! I have some notes for you:</p>
      <p>- The image is too wide for my screen resolution, hopefully the website itself won't have this fixed weight.<br>
      - The © in your footer is missing.<br>
      - I personally dislike Arial, but it may look better with just ClearType.<br>
      - You could add some effects to the blue headers. Gradients, patterns and/or shadow under the logo.</p>
      <p>Good luck :)</p>
      <p>Kind regards,<br>
      Martijn van Berkel</p>
