  html: <p>Hi everyone! I'm new in this forum, and I hope the discussions can seriously contribute for my projects. <br>Anyway, I'm attaching a sample of a new displays typeface (that don't have a name yet). <br>What I'm looking for, in the shape of these characters, is something innovative. Shapes unconventional, but still functional. <br>I'm a little worried about the letter "A" legibility. Maybe it's too much innovative. <br>What do you think? <br> <br>thanks a lot! <br>Haag<img src="http://www.typophile.com/forums/messages/29/13301.jpg" alt=""></p>
  html_clean: <p>Hi everyone! I'm new in this forum, and I hope the discussions can seriously contribute for my projects. <br>Anyway, I'm attaching a sample of a new displays typeface (that don't have a name yet). <br>What I'm looking for, in the shape of these characters, is something innovative. Shapes unconventional, but still functional. <br>I'm a little worried about the letter "A" legibility. Maybe it's too much innovative. <br>What do you think? <br> <br>thanks a lot! <br>Haag<img src="http://www.typophile.com/forums/messages/29/13301.jpg" alt=""></p>
