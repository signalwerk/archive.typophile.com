    votes: null
    html: '<p>I would encourage you (if you question it) to develop alternates - why not retain the current glyphs (spectacular, by the way) and develop additional characters with more information and uniformity? <br> <br>Allow me to elaborate: your strokes are meticulously consistent, save for the upswing in the H, downstroke on the R and the convention on the S. However, I find all of these characteristics to be appealing. <br> <br>If you question it, design a more lexically complete group without "missing" pieces where the viewer would expect them to be. <br> <br>I wish you the very best with this project - <br> <br>Nathan Williams <br>Baseline Fonts</p>'
    html_clean: '<p>I would encourage you (if you question it) to develop alternates - why not retain the current glyphs (spectacular, by the way) and develop additional characters with more information and uniformity? <br> <br>Allow me to elaborate: your strokes are meticulously consistent, save for the upswing in the H, downstroke on the R and the convention on the S. However, I find all of these characteristics to be appealing. <br> <br>If you question it, design a more lexically complete group without "missing" pieces where the viewer would expect them to be. <br> <br>I wish you the very best with this project - <br> <br>Nathan Williams <br>Baseline Fonts</p>'
