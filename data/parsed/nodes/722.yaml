    html: <p>Very nice Fabio. I am new to Typophile as well, and am amazed by the quality of the work (and people) that I have seen thus far. I just stumbled here by accident this morning but hope to contribute some thoughts and ideas. <br> <br>The only letters that I seem to stumble across are the M, N and B. The M and N seem ordinary compared to the other letters. They don't have the same "airy" quality. Could they be broken somehow or do you think that would be awkward? The letter B seems sad to me. Could the center stroke mimic the letter E?  <br> <br>Anyhow, keep up the good work!</p>
    html_clean: <p>Very nice Fabio. I am new to Typophile as well, and am amazed by the quality of the work (and people) that I have seen thus far. I just stumbled here by accident this morning but hope to contribute some thoughts and ideas. <br> <br>The only letters that I seem to stumble across are the M, N and B. The M and N seem ordinary compared to the other letters. They don't have the same "airy" quality. Could they be broken somehow or do you think that would be awkward? The letter B seems sad to me. Could the center stroke mimic the letter E?  <br> <br>Anyhow, keep up the good work!</p>
  - id: 5075
    user: 2079
    date: 2003-08-01T06:45:00
    date_raw: 1 Aug 2003 — 6:45am
    votes: null
    html: <p>Thanks Tom for your comments. <br>Actually, they match with the suggestions from another typedesigner, my friend. <br>Characters like N, M, S,... don't have the same expression as all the others. They need to be more opened and lighter. <br>As you said, designing the center stroke more thin (like "E") is a solution. I'm working on it. <br>I agree with you that B is looking weird. <br> <br>I'm also amazed how this forum is a nice and helpfull resource for developing serious typefaces. Thanks for all of you. <br>Fabio <br></p>
