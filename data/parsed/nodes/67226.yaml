  - id: 395069
    user: 2021
    date: 2010-02-10T08:50:00
    date_raw: 10 Feb 2010 — 8:50am
    votes: null
    html: |-
      <p>It's their prerogative, and quite legitimate.<br>
      For just a few letters in a logo, they may have thought it unnecessary to purchase the font, and they could do a screen grab at my site, or one of my distributors, of the letters they needed, and use that as the basis for making their own custom version of the wordmark. </p>
      <p>Or perhaps they considered that the font was almost right for the job, but too slick and the wrong weight.</p>
      <p>At any rate, the re-working provides a custom logo that cannot be exactly duplicated by anybody else using the font.</p>
      <p>I just googled "Glitch", and came up with this:<br>
      <a href="http://www.guardian.co.uk/technology/blog/2010/feb/10/glitch-game-butterfield" title="http://www.guardian.co.uk/technology/blog/2010/feb/10/glitch-game-butterfield">http://www.guardian.co.uk/technology/blog/2010/feb/10/glitch-game-butter...</a></p>
      <p>I don't hate that, I love it!<br>
      I wonder how Amanda feels?</p>
      <p>So perhaps the main reason is that the letters needed to be re-drawn for the illustration anyway, because it would be just too stilted for the illustrator to duplicate the font shapes (which are in essence a hardened-up version of hand lettering), especially considering the perspective dimensionality required.</p>
