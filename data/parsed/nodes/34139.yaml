      <p>I suggest that like a program or code you write you list for yourself all the goals you have in mind for the design. And your survey your competition so you see what you are competing against, what you need to be different from &amp; maybe better than. When you have made your survey of what is around you you can decide on tone. I don't suggest half serious that's too wishy-washy. Pick a direction or emphasis - especially when you are small. </p>
      <p>BTW- Why 'something that makes you smile'? That is only one way to make people remember you. It might be the right way to do that - but keep in mind the larger goal it serves. Being remebered is usualy the #1 goal of a logo design. </p>
      <p>I suggest that even though what you made is nice - it isn't memorable. I would start again with a plan &amp; work up to the solution in an intentional/deliberate way.</p>
      <p>Feel free to post more stuff or talk about your thought process.</p>
