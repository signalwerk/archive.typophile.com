      <p>The last version seems strong to me. And any of these ideas might be a good direction but I suggest that you have to be more rigorous to pick the right one to focus on. You can just decide that you like one best or that it is the most memorable - but that is just 'shooting from the hip'. Who are you competitors? What do they do for logos?  Take a look at it against it's competition. </p>
      <p>This is beyond what is normally done for a small company but to take things to a really professional level you could do a careful experiment with strangers ( maybe pay them a small fee ) &amp; see if your logo is more memorable than your competitors* by flashing the logos in a random order on a screen and then asking for the names. Or by showing the logos again with extras they didn't see &amp; asking which ones they subject saw in the series. Time the response. There are many possibilities. 20 people or so may be enough to get a good sense. You can also ask what people feel or associate with your logo &amp; the others - you may be surprised.</p>
      <p>*you should mix in local logos from other categories of business as well and maybe some famous ones too.</p>
    html_clean: |-
