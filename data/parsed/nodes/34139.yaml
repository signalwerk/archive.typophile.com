    <p>Hi guys. It came to a point I had to design a logo for my own company. Just when I got to do it I found out I'd rather change the name of my company. I made it too complicated for me.</p>
    <p>I'm a actually a developer but I also do design jobs (press/web/ux/ia). I used to do design as my second job but I ended up without any time of my own so I focused more on development lately.</p>
    <p>About the logo. I made many designs so far but I couldn't get any "wow idea" so far. I tried all kinds of stuff (starting on paper) but ended up with some very clean and too simple logo that just has a font variation. I wanted something that makes you smile.</p>
    <p>Logo should be half serious and reflect (if possible):<br>
    - software solutions on Microsoft products<br>
    - innovation<br>
    - quality<br>
    Logo should be applicable on different mediums of different quality.</p>
    <p>Since it's sole proprietorship company it has a rather complicated full name (EN translation):<br>
    Inovares, innovative solutions Robert Koritnik s.p.</p>
    <p>I would be really glad to get any input from you gurus.</p><div class="imageWrap"><img src="http://typophile.com/files/inosp_6288.jpg"></div><p></p>
