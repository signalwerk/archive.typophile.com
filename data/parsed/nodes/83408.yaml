  html: |-
    <p>Tuscaloosa has just launched on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/tuscaloosa/ " rel="nofollow"> Myfonts</a> and <a class="freelinking external" href="http://www.fontspring.com/fonts/gatf/tuscaloosa " rel="nofollow"> Fontspring</a>.</p>
    <p>Tuscaloosa is a classic American ‘Wild West‘ Tuscan typeface-we thought it would make a suitable Independence Day tribute to our American clients.  It’s ideal for wherever that ‘Western‘ feel is wanted.  Posters, signage, the sides of stagecoaches etc… Three faces are offered, a pristine and sharp regular form, a somewhat distressed ‘Rustic‘ face and the rather more distressed ‘Extremely Rustic’.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Tuscaloosa_Sample_5172.png"></div><p></p>
