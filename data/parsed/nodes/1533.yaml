    html: "<p>Hi again, <br> <br>Here's the latest version of this font, with a complete set of capitals and some sample text. I'm pretty happy with most of the capitals finally, but I think a few might still need some work, like the 'H', 'K', 'T' and 'Z'.  <br> <br>Here are the links: <br> <br><a href=\"http://www.oogby.com/lj/letters.swf\" target=\"_blank\">http://www.oogby.com/lj/letters.swf</a> <br><a href=\"http://www.oogby.com/lj/sample.swf\" target=\"_blank\">http://www.oogby.com/lj/sample.swf</a> <br> <br>What do you think?</p>"
