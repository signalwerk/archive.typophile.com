    html: <p> Brian, <br> <br>I like the spirit of the face in general and the g and m are quite nice. You say the k bothers you, but I don't mind it. <br> <br>It seems like a few of the elements are a bit forced, like the spur on the q and the tail on the p. Also, the loops on the some of the letters seem a little awkward (too exagerated, perhaps and the ovals not highly refined). <br> <br>As an exercise, it would be interesting to see a sample setting of the face, where you could more easily see the relationships between letters outside their order in the alphabet. <br> <br>Post it again when you've developed it further. <br> <br>Cheers. //Joe </p>
