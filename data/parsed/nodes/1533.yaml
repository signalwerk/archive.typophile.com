  - id: 138406
    user: 103
    date: 2003-01-13T18:17:00
    date_raw: 13 Jan 2003 — 6:17pm
    votes: null
    html: "<p>Brian! So glad to see you're back. It's looking tasty.  <br><a href=\"http://www.virusfonts.com/virus.html\" target=\"_blank\">Barnbrook</a> should be pooping his trousers right now. <br>Let's get your hands dirty... <br> <br><b>1. Balance.</b> I think the upright quality of this design is  <br>what makes it great. You lost that with the new 'd'. But the  <br>new 'p' is better - the original being off-balance. The 'g'  <br>leans a bit too much to the right as well. <br> <br><b>2.</b> Good work moving the 't' crossbar to the x-height. <br> <br><b>3.</b> I thought Christopher's ideas on the 'y' and 'w' were  <br>good. Maybe just move the left v stroke of the 'w' to the left  <br>a tad. He might be right about the 'r' too, but I can't tell <br>without a text setting. <br> <br><b>4. Caps.</b> Your best uppercasers are the simple ones: 'V', <br>'w', 'A', 'Q'. Don't touch those. I think there's too much going  <br>on in the 'N', 'T', 'F', 'C'. The Tim Burton curl isn't working  <br>for me and it belies the smooth, calligraphic nature of the  <br>face. The ornate 'O' might work as an alternate, but the <br>simple stressed oval is just fine I have no idea what to do <br>with the 'E'. <br> <br><b>5. Punct.</b> Pretty.</p>"
