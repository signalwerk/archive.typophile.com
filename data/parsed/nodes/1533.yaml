    html: <p>I see that this thread has been quiet for almost a year, which is sad as this font has some real possibilities. (has the font been published? If so, where can I get it?) <br> <br>I really like what is happening here. However, the new p and q don't quite fit. I like the theme of the upright ascenders, and the cursive loop descenders like on the g, j, y, z, and old p. Perhaps the q could share this theme with a loop descender similar to the y.  <br>I agree with christopher on the begining stroke on the r.  <br>Would it look out of place to give the d an ascender in the style of the b, f, h, etc.?</p>
