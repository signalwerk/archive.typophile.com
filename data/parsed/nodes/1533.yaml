    html: <p>I personally would like the H better if it were a little wider, or if the bar were lower, or both. It just seems to uptight to me, especially next to the with the P and the R.  <br> <br>The T I thought looked great in the word "Tulip", but on the first page I have trouble recognizing it (and only then by process of elimination). Perhaps if the horizontal stroke extended a little further to the right? Or perhaps if the vertical stroke curved in the opposite direction it would be more recognizable by evoking the shape of a lowercase t. </p>
