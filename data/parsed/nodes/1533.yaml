    html: "<p> There it happens again! Another font that I like from a category that I don't. (Is it me, or this forum?...) Script fonts are usually hopelessly imitative and non-typographic, but this one's cool. <br> <br>I'm not sure what bugs you about the \"s\" (maybe a little too wide) and the \"k\" (I think it's dandy). The \"f\" bugs me (the descender shouldn't do that), and the \"p\" looks like it's running for cover, but otherwise I think you have a winner. <br> <br>But what about the caps? Allow me to make a suggestion: don't try to make the conventional Roman cap structures work; instead, look to the uncial tradition. Hammer might have been too much of a purist, be he was onto something - something that remains largely ignored by most. <br> <br>hhp </p>"
    html_clean: "<p> There it happens again! Another font that I like from a category that I don't. (Is it me, or this forum?...) Script fonts are usually hopelessly imitative and non-typographic, but this one's cool. <br> <br>I'm not sure what bugs you about the \"s\" (maybe a little too wide) and the \"k\" (I think it's dandy). The \"f\" bugs me (the descender shouldn't do that), and the \"p\" looks like it's running for cover, but otherwise I think you have a winner. <br> <br>But what about the caps? Allow me to make a suggestion: don't try to make the conventional Roman cap structures work; instead, look to the uncial tradition. Hammer might have been too much of a purist, be he was onto something - something that remains largely ignored by most. <br> <br>hhp </p>"
