    html: <p> Wow,  <br>cool script font. It would even look good on a shiny new toaster! <br> <br>It seems to be a consensus. The 's' is fine, and I'm in love with the 'k'. Please don't change it. The 'p' does look forced, but everything else seems to fit in quite nicely. The tail on the 'q' works for me.  <br> <br>I wonder if the 'f' would perk up if the descender wasn't as heavy... maybe narrowed just a hair. Or try using the 'q's tail without the flip.  <br> <br>The whole face seems like a modern caligraphic form. What if all of the letters w/ascenders and descenders varied ever so slightly from top to bottom?  <br> <br>Really nice first face... can't wait to see more stuff. Can you post a set paragraph? <br> <br>HiggledyPig <br>Eric </p>
