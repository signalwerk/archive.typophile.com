  html: "<p>Hello everybody, <br> <br>My name's Brian, and I hope you don't mind my totally flailing newbieishness here... This is my first font (well, the first one at all close to completion, anyway), and I'm having trouble figuring out where to go from here... the 's' and 'k' in particular are bothering me. <br> <br>My only goal with this was to create a stylized script that didn't look like it belonged on a shiny chrome toaster. <br> <br><!---Attachment: positronic_effigy.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">positronic effigy<br><a href=\"http://www.typophile.com/forums/messages/29/positronic_effigy.swf\"><b>positronic_effigy.swf</b></a> (5 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>Any thoughts? <br> <br>Thanks, <br> <br>Brian<!--!-/attachment-!--><!--!-attachment:--><p></p>"
