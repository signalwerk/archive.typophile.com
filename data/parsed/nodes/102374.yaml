      <p>And most real race cars are covered with sponsor logos:</p>
      <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20150123173219im_/http://typophile.com/files/car-logos_3548.jpg"></div><p></p>
      <p>I know this info isn't particularly helpful to you, but just thought I'd point it out. </p>
