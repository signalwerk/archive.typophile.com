    <p>Hi Guys,</p>
    <p>I have two questions for you,</p>
    <p>1) Does anyone have any complains about the kerning in this design with any of the letters?, have I broken any don't do's?<br>
    2) Would you notice any change if I was to purchase "Eurostile Next" and changed the font to that? It is currently set in the old Eurostile and I can't really see a difference between the two, I have only used "try font" on a font website for me to determine this.</p>
