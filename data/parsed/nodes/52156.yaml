    html: |-
      <p>I'm with Nick on this one. There are competing factors in spacing. One is how far apart the closest blacks are. Another is visual equality between the letters. Another is balance between inner and outer. Your first goes for the first one. I think that is OK, if you want compactness, which you might want in a logo. The other way is what Bert said, but if you want to go that way I think you need the S still further away. </p>
      <p>As Nick says, the joins on the N may be too heavy. Try slightly reducing the width of the verticals.</p>
      <p>On the bottom line the OT looks too wide, but slightly tweaking the whole thing is probably needed for perfect balance. I don't see why you need the period at all.</p>
