      <p>OK, Here’s what I think:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SNAG_spacing_4450.jpg"></div><p></p>
      <p>What you need to aim for is a balance between innerspace (space within— lightblue) and intraspace (space between — pink).<br>
      Start with the largest of the innerspaces, in this case N or G, and then try to make the intraspaces equal to that. In your sample the S is way to close to the N.<br>
      Once you have balanced everything you can either substract or add equal amounts of space between the glyphs, depending on what your aiming for (tension, or light colour, etc.).</p>
      <p>The other line: Wordpace is excessive. Wordspace equal to the innerspace of N is adequate. The dot should be way closer to the O, and do not line it up with the topline, but let it stick out somewhat.</p>
      <p>And try looking at this up-side-down or in a mirror.<br>
      Hope this helps.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
