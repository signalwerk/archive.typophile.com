    <p>We vacationed in Door County, WI this past week which finally gave me an opportunity to make the mecca to The Hamilton Wood Type Museum in Two Rivers.</p>
    <p>We arrived on a rainy (and slightly busy) Wednesday and ended up having a great conversation with Jim Moran, the Director and sole employee who dedicates 7 days a week to keeping the place open. </p>
    <p>I wish I could say there were other reasons to visit Two Rivers, but there isn't a whole lot going on there, but if you are ever in the region, do try to make it over and say 'hi' to Jim and check out the space and ephemera. It looks like Jim has lots of great ideas to grow exposure to the place. </p>
    <p>Here are some photos (alas, I have a crappy camera and was never a great photographer to begin with, but if you thumbnail them all, they don't look too bad...)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/hamilton_3634.jpg"></div><p></p>
