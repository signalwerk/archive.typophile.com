      <p>No, not studio, but a fake word like "studeum" that has no real English pronunciation (only a fake Latin one) is pretty easy to be read the wrong way.</p>
      <p>A "studeum" sounds like an arena with all-nude oil wrestling. No naming company in a million years would let you get away with it, for good reason.</p>
      <p>Don't forget the lesson we learned in the past decade about how a very clear name can get pronounced in unfortunate and unprofessional ways when it goes beyond the controlled environment of a business card and letterhead.</p>
      <p>A consulting company called "the Experts Exchange" sounds reliable, but if you go to <a href="http://www.expertsexchange.com" title="www.expertsexchange.com">www.expertsexchange.com</a>, you might expect to be sold hormone supplements and saline implants, not advice on tax shelters. A few spaces can mean the difference between professional respect and being the butt of dirty jokes. Nobody is going to hire the Expert Sex Change people to revamp their accounting system, regardless of their qualifications or references.</p>
      <p>As people who often work with identities, this is the sort of worst-case scenario we're supposed to be looking for and trying to avoid as part of our responsibility to clients. Even putting a harmless name into foreign dictionaries just to make sure it doesn't mean something horrible in Turkish or Swahili is standard procedure. I mean, I don't want to be the marketing guy in Finland who has to explain to my boss what Jussipussi means in English and why it was a bad brand name for our bread.</p>
