      <p>my thoughts on it.</p>
      <p>Latin is an old, dead language.  when used, to me at least, it invokes an association with the roman empire and simpler times.  I think some of the most beautiful poetry was written in latin, and I'm reminded of conquerors and poets.</p>
      <p>Graphic design is a relatively new thing.  Not too long ago it was called 'graphic arts' and has been called 'corporate arts' before that.  To me, taking a modern job and concept and applying it to an antiquated language is an anachronism.  Out of place in time.</p>
      <p>It's like painting the mona lisa with an iPod and trying to pass it off as valid.  I mean yeah, everyb'dy's got an iPod, and yes, the Mona Lisa was a woman, so by that logic she must have had one right?</p>
      <p>I think the first time guilds of artists (sculptors, painters and the like) appeared on the scene would be likely in italy.  Check out Florentian and Venetian art history (which you should know anyway) and you'll see how the guild system worked.</p>
      <p>Maybe, it's a stretch for sure, but maybe the language that would best suit this would be italian, but because there are still italians running around today, all of the non-italians will likely assume you're italian and operate your business in that language as well.  Or else italians will incessantly talk to you in italian because you have an italian name.</p>
      <p>So, maybe other languages as fun as they are sometimes, don't suit our industry as well as they would other fields.</p>
      <p>For advice on a creative name, I'd start with this:  how many people are in your studio?  If it's just you, use your name, make it a beautiful, classy, elegant design and use your name.  If you're John Anderson, you could use Anderson design, and even if you hire 50 people, the name still works, where 'John Anderson design' begins to break down.</p>
