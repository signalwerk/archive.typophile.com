    html: <p>Karmadrome, if you need the font, if you like the font, <i>buy</i>  <br>the font, trust me. Do you really think that someone would  <br>put all his/her skill, eﬀort and dedication into a type design  <br>and then make it available for <i>free?</i> I mean, what do <i>you</i>  <br>do for a living? Would you be prepared to give away your  <br>wage, your salary, just like that? Or worse, how would you  <br>feel if somebody else gave it away? <br><br>Think about that before you come asking for rip-oﬀs&nbsp;again.</p>
