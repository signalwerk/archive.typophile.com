    html: |-
      <p>No, TTX does require Python. It does not, however, require FontForge. Now, on OS X Python is usually pre-installed, so that may be a no-op.</p>
      <p>One big reason to use TTX is that it is lossless. Decompiling with FontLab and exporting a font out is not lossless.</p>
      <p>Writing your own apps to do this is really quite complicated. I know somebody who thought fonts were simple data structures and surely he could write an app to do what he wanted (similar kinds of manipulations, mostly to the name table). After spending about 20-40 hours of looking into it he realized that I was quite correct, and it wasn't worth writing an app from scratch.</p>
      <p>Cheers,</p>
      <p>T</p>
