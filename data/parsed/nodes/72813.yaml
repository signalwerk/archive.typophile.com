      <p>That's exactly what I was about to suggest. TTX can do lossless round-tripping of TTF/OTF, though it works best if one goes through the pain of installing version 1.3 (due to compatibility with latest version of OS/2 table).</p>
      <p>Note also that the name table can have multiple versions of any given name string. One usually has both Mac and Windows versions for almost every nameID, and occasionally one sees different versions for different languages.</p>
      <p>Cheers,</p>
      <p>T</p>
