    html: |-
      <p>At what point did you get stuck on writing your own program?</p>
      <p>All of those strings are in the 'name' table -- one of the easier tables, although there are two layers to each string (encoding and language).</p>
      <p>After changing something in this (or any) table, you have to recalculate the checksum of that table alone and of the entire file; the exact procedure is outlined in MS's documentation, with sample code in C.</p>
      <p>Anyhow, perhaps it's easier to use <a href="http://www.letterror.com/code/ttx/index.html" rel="nofollow"><strong>TTX</strong></a>: expand font to XML, change strings, recompile into font.</p>
