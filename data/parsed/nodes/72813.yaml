    <p>I am looking for a utility that allows me to change the actual family names of fonts.<br>
    assume i had 100 fonts, and i want to givr all of the a prefix so they all group up in the font menu.<br>
    say i had a family name<br>
    XXX regular<br>
    XXX Bold<br>
    XXX Heavy</p>
    <p>And i want them all to be<br>
    PFxxx Regular<br>
    PFxxx Bold<br>
    PFxxx Heavy and so on.</p>
    <p>i am not talking about a utility that renames the ttf file such as the family name but actualy changing at once the font internal name<br>
    1. family name<br>
    2. sub family name<br>
    3 full name</p>
