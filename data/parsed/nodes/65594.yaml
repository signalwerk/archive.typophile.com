  html: |-
    <p>In the <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100035" rel="nofollow">blurb for Tungsten</a> H&amp;FJ describe the style as a "Modern Gaspipe". I particularly like this style, with strong vertical lines, an explicit diagonal in the S and corners like a race track at the top and bottom.</p>
    <p>Googling Modern Gaspipe doesn't yield much besides Tungsten. Does anyone know of some other good examples of this style, preferably with a lighter weight, such as <a class="freelinking external" href="http://www.virusfonts.com/fonts/bourgeois#characters-42" rel="nofollow">Bourgeois</a>?</p>
    <p>Many thanks,<br>
    Stephen</p>
