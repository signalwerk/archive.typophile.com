    html: "<p>The <b>f</b>, <b>g</b> and <b>t</b> in the red lettering matches a font called \"Artic\" in Rookledge's Type Finder (1990 edition, sample #353 shown below). The <b>a</b> and <b>p</b> don't match though. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/66819.gif\" alt=\"artic.gif\"> <br> <br>Good catch on the upside-down <b>B</b> and <b>S</b>. I had initially thought of Benguiat Frisky but dismissed it because these letters didn't match. Hm.. maybe the <b>p</b> is an upside-down <b>b</b>, and the <b>a</b> is a <b>d</b> with the ascender chopped off. And it's been squished, too. Who would do such a thing? Barbarians!</p>"
    html_clean: "<p>The <b>f</b>, <b>g</b> and <b>t</b> in the red lettering matches a font called \"Artic\" in Rookledge's Type Finder (1990 edition, sample #353 shown below). The <b>a</b> and <b>p</b> don't match though. <br> <br><img src=\"http://www.typophile.com/forums/messages/83/66819.gif\" alt=\"artic.gif\"> <br> <br>Good catch on the upside-down <b>B</b> and <b>S</b>. I had initially thought of Benguiat Frisky but dismissed it because these letters didn't match. Hm.. maybe the <b>p</b> is an upside-down <b>b</b>, and the <b>a</b> is a <b>d</b> with the ascender chopped off. And it's been squished, too. Who would do such a thing? Barbarians!</p>"
