    <p></p><div class="imageWrap"><img src="http://typophile.com/files/skeletonfingerpen_4025.jpg"></div><p></p>
    <p>This has got to be my favorite project at the moment. Seriously steppin' into the Goth side of life with this project, it's due out in limited numbers spring 2012 :)<br>
    Working with the fountain pen manufacturer, the main design challenge is trying to keep the barrel size as close to actual bone size as I can (redesign of standard cartridge seems to be required).</p>
    <p>It'll be simply awesome when the pen (both ball point and cartridge) and pencil (mechanical) prototypes are done!! A detail I really want to pursue is to have the upper nob created in the shape of a crown, I think it would compliment the Gothness of it all :)</p>
    <p>Thought I'd share...</p>
