      <p>Here is a grab of how Acrobat Reader 10.1.7 renders the font Ezra in the file <code>texmf/tex/makor2/refcard.pdf</code> of the makor2 TeX package (dated 2003) that I still have in my things.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ezradist_5387.png"></div><br>
      The cause of the distortion was not, so far as I understand, "crappy curves". The elements in <code>BlueValues</code> were <code>-320 5 -76 707</code>, which just makes no sense. After changing <code>BlueValues</code>, the font was working without problem.<p></p>
      <p>Interestingly, Fontforge complains about the elements in BlueValues/OtherBlues of Bebas neue. Maybe the distortion on dafont also comes from there.</p>
