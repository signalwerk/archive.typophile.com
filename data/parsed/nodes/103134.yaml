      <p>The "2" in Bebas is defective, and will sometimes come out distorted. Considering the designer doesn't seem to mind, there might be (and probably are) other serious technical issues. Unless you have the software and the skills to fix such problems on-the-spot, you might realize too late that you have to switch fonts. The "perfect" might become "putrid", and publicizing that turn-around would be a useful public service.</p>
      <p>hhp</p>
