    html: <p>One bad curve does not make any font unusable. Run a FontAudit on many commercial fonts and it makes suggestions on some curves, not all that are very critical or even really worthy of being marked. That being said, I really do not think anyone would say that commercial fonts have as many problems as free fonts. A commercial foundry would not stay in business very long if they became known for problem fonts. It is said on Typophile often enough that you are safer with professional commercial fonts.</p>
