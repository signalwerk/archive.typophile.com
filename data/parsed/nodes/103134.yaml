      <p>That one bad curve makes the font essentially unusable ("2" is not exactly a rare character). And Bebas might have other problems (like in its kerning) that don't show up as quickly, but could end up ruining a project after it's too late to change the font. Then you need a font editor (and the expertise to use it) or you need to pay somebody to fix it. So in the end, not at all free.</p>
      <p>Of course not all free fonts are bad. But pretending commercial fonts have a comparable degree of problems is not realistic. You need to be able to trust your tools.</p>
      <p>hhp</p>
