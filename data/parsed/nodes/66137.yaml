    html: |-
      <p>Helvetica is not very geometric, IMO.</p>
      <p>I'm not sure what you mean by “terminals paralel to the baseline”. Are you talking about how Gothams terminals are at an angle, as opposed to completely vertical or horizontal? Perhaps you'd like <a href="http://typographica.org/2008/typeface-reviews/graphik/" rel="nofollow">Graphik</a> or <a href="http://www.vllg.com/Village/Galaxie_Polaris#panel=poster" rel="nofollow">Galaxie Polaris</a>? (The latter doesn't have the 90 degree terminals, but they are rather close to it.) Another one that might be of interest is <a href="http://new.myfonts.com/fonts/urw/neuzeit-grotesk/" rel="nofollow">Neuzeit Grotesk</a>.</p>
