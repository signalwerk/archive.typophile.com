    <p>Hi all</p>
    <p>Does anyone have any sugestion, on a font similar to avant garde geometry but with a modern feel?<br>
    Something like gotham will not work as i'm looking for a font with terminals paralel to baseline like in avant garde or helvetica.</p>
    <p>All sugestions are very welcome<br>
    Thanks in advance</p>
    <p>Best regards</p>
