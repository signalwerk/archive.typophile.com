  html: |-
    <p>Founded in 1907, California College of the Arts (<span class="caps">CCA</span>) is the largest regionally accredited, independent school of art and design in the western United States.<span class="caps">CCA</span> educates students to shape culture through the practice and critical study of the arts. The college prepares its students for lifelong creative work and service to their communities through a curriculum in art, architecture, design, and&nbsp;writing.</p>
    <p><span class="caps">CCA</span> has two campuses located in San Francisco and&nbsp;Oakland.</p>
    <p><a href="http://www.cca.edu/">http://www.cca.edu/</a></p>
