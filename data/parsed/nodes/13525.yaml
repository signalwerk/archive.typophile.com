  html: |-
    <p>Founded in 1907, California College of the Arts (CCA) is the largest regionally accredited, independent school of art and design in the western United States.CCA educates students to shape culture through the practice and critical study of the arts. The college prepares its students for lifelong creative work and service to their communities through a curriculum in art, architecture, design, and writing.</p>
    <p>CCA has two campuses located in San Francisco and Oakland.</p>
    <p><a href="http://www.cca.edu/" title="http://www.cca.edu/">http://www.cca.edu/</a></p>
