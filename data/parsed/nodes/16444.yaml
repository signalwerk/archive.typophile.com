      <p>Well, I have a small confession to make. I have only made monospaced bitmap fonts and at some point I vowed never to develop monospaced fonts again (bitmap or not). So I have a certain degree of antipathy about this, but for what it's worth:</p>
      <p>I printed the sample of you font today (only the original one, since the PDF with C-code didn't want to print) together with an excerpt of that same C-code set in Consolas, Lucida Console, and Vera Mono. Okay, so Consolas is pretty nice. But I also printed the code set in Lucida Sans to compare it with it's monospaced version, and I must say I don't see what is gained by fitting letters to an imaginary grid. Lucida Console was just uglier. So, my million dollar question is: do you want a "programmer's" typeface or a monospaced one? Because I don't think a programmer's typeface has to be monospaced. So maybe Times New Roman or Myriad aren't a staircase to heaven for the hacker next door, but has anyone attempted to make proportional typeface with code listing in mind?</p>
      <p>Now, about your font. It goes without saying that it looks generic. It feels weird because you made it a pasticcio of all your nice little ideas. But it's not bad - I've seen things that are much worse. I just think it's lacking in the basics department. It's too spaced out - make it tighter, or bolder. Consistency! c is too big, z is too black. N seems to be wider than M and H. A as the only spiky letter - why? g a bit too light, W too. G too complex. What's with the ugly Matthew Carter tail on the Q? I'd shift J and j a bit to the left, especially j. Cross-sections on X and x could use a fix. The point of a few curvy letters is exactly ... what?</p>
      <p>One thing I can't stop wondering about is why you don't recreate Consolas with your own flavour if you like it so much. Why use News Gothic or whatever as a template?</p>
