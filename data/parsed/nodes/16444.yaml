      <p>I've looked at your font in FontForge. Measuring N compared to M showed that it's not wider. But it looks that way. Did you make H so narrow on purpose? It also has an unusually thin horizontal stem. I mentioned spacing before - I think reducing width to 550 is pretty safe. Not completelly safe if you consider bold style, so maybe plus-minus 10.</p>
