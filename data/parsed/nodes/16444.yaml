    <p>I'm working on a monospace font specifically geared to print and other high-resolution reproduction. Many of the other available monospace fonts are optimized for screen rendering and don't really have the craftsmanship of a print font. I hope you agree that Inconsolata does.</p>
    <p>For samples, including downloadble draft versions, visit the <a href="http://levien.com/type/myfonts/inconsolata.html" rel="nofollow">page</a> I've created for the font.</p>
    <p>All feedback is welcome. Obviously, monospace is a narrow niche, but for some things, like code listings in books and journal articles, it has continuing appeal. Would you be likely to use Inconsolata in this context? Are there other places you can imagine a monospace font being a good choice?</p>
