      <p>As a professional software developer and an amateur type enthusiast, I am always excited to see a new monospaced font designed for code.</p>
      <p>A few quick comments:</p>
      <p>The <cite>r</cite> seems too "seriffy" compared to the rest of the face. It sticks out like a sore thumb.</p>
      <p>The <cite>i</cite>, which has serifs out of necessity, seems to cause uneven spacing. Perhaps it could be moved a bit to the right within its cell. Same goes for the <cite>f</cite>, <cite>j</cite>, and <cite>J</cite>.</p>
      <p>Similarly, the <cite>G</cite> might benefit from being nudged a tiny bit to the left. (Or, if that is not possible, narrowed slightly to allow more space on the right.)</p>
      <p>The curvy and nonvertical <cite>t</cite> seems too "happy" compared to the rest of the characters.</p>
      <p>The way many of the stems have slightly flared ends is a little disorienting. I'm not quite sure what to make of it. Even at very large sizes, these tiny serifs seem too subtle -- especially next to the giant exaggerated slab serifs of the <cite>i</cite>, <cite>j</cite>, <cite>l</cite>, and so on. At smaller sizes, they might disappear entirely. I know that Inconsolata is designed for high-resolution print; however, it is still not a display face. While I understand and appreciate the desire to inject some character into the design, I have a feeling that this sort of subtlety might be inappropriate for this kind of face.</p>
      <p>On the whole, I think this face shows a lot of promise, and I am looking forward to seeing the finished product. I hope these observations are of some help.</p>
      <p>(BTW, I composed my post before reading the whole thread, so as not to be influenced by others. I now see that some of the things I said have already been mentioned.)</p>
