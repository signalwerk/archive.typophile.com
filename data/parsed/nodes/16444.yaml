      <p>Thanks for the feedback. I was starting to wonder if I was being deliberately ignored or if I had just posted the least interesting face on the critique board.</p>
      <p>Eben: as you suggest, the goals of this font are quite similar to those of Consolas, and of course Luc(as)'s command of the craft of fontmaking is awe-inspiring. There are going to be some differences in the details, but there are two main things I saw in Consolas that I didn't much like, or at least wanted to do differently.</p>
      <p>First, the primitive curve in 'bdpq' has a very strong diagonal stress. That's fine, it's almost his signature, but I personally much prefer the round forms of classical typeface.</p>
      <p>Second, I see several places where the needs of ClearType called for horizontal strokes to be perfectly horizontal (or near enough to perfectly that there is no significant rendering difference, particularly after hinting). Letters most noticeably affected are the top and bottom stems of the 'g', the 's', and, to a lesser degree top of 'f' and bottom of 't'. I wanted to see what might happen if the constraint of good CT rendering contrast were removed. So yes, I am specifically not trying to optimize for low-resolution screen rendering. The client, the TeX User Group, is primarily concerned with print and their software does not do interactive screen rendering.</p>
      <p>At some point in the Star Trek future, I also expect screens to be high resolution, at which point I expect the rendering considerations will be more similar to those of print than those of low-res screen rendering. Of course, by then it's possible that monospace will have become completely obsolete.</p>
      <p>A lot of the letters ended up coming out looking much like News Gothic, especially with respect to the roundness of bdpq and the curviness of fgs. Of course, my good friend Morris Fuller Benton didn't mess around with the curvy tvwy on the News/Franklin family, so maybe my introduction of them does not adequately respect his memory. (Memories of Souvenir and Hobo, of course, would be a different story :)</p>
      <p>I'm surprised to hear that the feeling of the font is "wierd". I was more concerned that it looks too generic (especially the uppercase, which could be mistaken for Letter Gothic). I'd really appreciate it if you guys could put that sense into more precise words.</p>
      <p>Also, I've put up examples of Inconsolata in both <a href="http://levien.com/type/myfonts/inconsolata-c-example.pdf" rel="nofollow">C code</a> and <a href="http://levien.com/type/myfonts/inconsolata-python-example.pdf" rel="nofollow">Python</a>. The links on this site may be aesthetically pleasing because they don't stand out so much, but on the other hand it can also make them quite a bit harder to find.</p>
