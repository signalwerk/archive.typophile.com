      <p>&gt; Because I don’t think a programmer’s typeface has to be monospaced.</p>
      <p>I should be clear that while there are other people who agree with Sergej on this topic they are few in number. And the vast majority of programmers are not only clear that they want to use monospaced fonts - they give many articulate reasons why. Sergej can of course code however he likes. And you may not care about programmers' screens anyway. Neither attitude makes sense to me yet - but there you are.</p>
      <p>&gt; make it tighter, or bolder. </p>
      <p>This is complicated in most monospaced fonts by the question of how many pixel spaces you put between glyphs. My own mono is is one pixel type which creates one kind of problem. Most monos assume two until about 8 pt on screen. Two pixels tends to look pretty light when printed. And your font looks like these. ( Courier doesn't because it is quite exagerated.) </p>
      <p>On the other hand you said that you don't care about sceeen use so you could go bolder, and alter your glyph shapes where needed without much worry. I think doing this is a good idea if you don't care about screen use or plan to let cleartype hinting fuzz your way out of the pixel issue. That's what Consolas does to some minor extent. Consolas is quite rational most of the time and hinted nicely the rest of the time - which is why it looks good on screen in Cleartype.</p>
      <p>&gt; I just think it’s lacking in the basics department. </p>
      <p>I would have put this more gently but I garee that the face doesn't quite hang together yet. The biggest offender is the 'g'. It simply doesn't fit. There are many way to fix this &amp; I don't want to prescribe one over another. The two primary issues with the g are that it doesn't seem to be the same weight as the rest of the glyphs ( and it isn't it actually is light ) and it looks shorter at the x height than the other glyphs. I see it is not shorter but that's visual illusion for you.</p>
      <p>The 'a' feels like it is too tall. The overshoot seems to go too far down too.</p>
      <p>The glyphs with curves are too strong, too noticeable. The v, t &amp; w jump out too much.</p>
      <p>I like your s. and too a lesser extent your o. I think this is partly because they seem heavier than the others &amp; that seems right. In the case of the s I think you have a nice motion and a nice forward ballance.</p>
      <p>The contrast on your p seems too strong in the context of the rest of the face. The contrast in the d is too weak. Oddly the b seems better. Something to do with the foot of the b I think.</p>
      <p>&gt; Cross-sections on X and x could use a fix. </p>
      <p>I agree.</p>
      <p>But the main thing I notice is more systemic. Even though it is impossible to make a mono where all the srokes are even ( not that they would look even if you did) there is not enough evenness in the overall look of the font. The m &amp; W seem pale. I know why but they have to be a little paler but I think you have gone too far. The N seems dark. </p>
      <p>This uneven feeling is also cause by the curves you are using, and the slighly overzealous contrast in the diagonals.</p>
      <p>Sergej's last point about Consolas is a good one. If you really like Consolas why not step out &amp; do something more humanistic?</p>
      <p>On the other hand you could probably whip this into shape. It's got a nice openess too it. It has a nice feeling.</p>
      <p>As I said before I don't quite get your motivation for making this font. I don't quite get who will use it or how. Despite this, I hope I have been of some small help.</p>
