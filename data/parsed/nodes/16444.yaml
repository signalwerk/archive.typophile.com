      <p>Great, these detailed comments are really helpful. Some of the consistency issues I agree with completely and will fix next go-round. On the "G" complexity, I went back and forth between Univers and News Gothic models, and will probably go back to the Univers on Sergej's advice. I did want to address some of the more philosophical concerns before going back to the drawing board, though.</p>
      <p>Do we still need monospace fonts? I am in partial agreement with Sergej here. Given the choice, the constaints of monospace force an overall degradation of text quality. Also, while monospace is traditional, just because it's code doesn't mean it has to be monospace.</p>
      <p>That said, monospace does have its strengths. In particular, when the text needs internal alignment, monospace offers a clear solution. Examples in C include lining up multiline expressions just to the right of the opening paren, and, in some coding styles, putting declarations in two columns with the types on the left and the variable names on the right. It's also possible to use the width of strings to determine their length, which can be tricky especially when spaces are involved. <code>" "</code> and <code>"&nbsp;&nbsp;"</code> are easily distinguished in a monospace font, less readily so otherwise.</p>
      <p>Other languages and contexts have their own alignment needs. For example, assembly language always lines up in columns, and just wouldn't look right proportionally spaced. Of course, in the Star Trek future, there is a question whether we'll still need that.</p>
      <p>But the argument for simplicity may be more compelling. The simpler something is, the less likely it will be screwed up. A typographer may well be able to hand-align code listings so that meaning is not degraded, but it aesthetics are much better than with a monospace font. However, this requires fairly sophisticated tools, and an understanding by the typographer of the meaning of the spacing. Programmers cannot be expected to possess those tools, as they usually use editors rich in logic but poor in typography.</p>
      <p>Just deciding to use a monospace font makes the world simpler, at some aesthetic cost. The space bar becomes a powerful and precise tool for alignment, and the formatting is robust against changes in font, tools, and other variables.</p>
      <p>Why am I doing this font? Several reasons. As Sergej suggests, it's a good learning exercise to adopt difficult constraints. These are especially comforting because this is my first real original design, as opposed to a revival of old metal type. Also, because monospace is such a specialized niche, I have a pretty good shot at achieving one of the ten best in the category.</p>
      <p>The specific usage intended for this font is code listings in books and journal articles. These publications (the ones that contain code) are often made with TeX software, and its default monospace font is quite poor typographically. Other common choices are also fairly poor, notably Courier because it's too light and too wide. I checked recently and saw that O'Reilly uses TheSans, which is good for them. There are some people who care what this stuff looks like!</p>
      <p>Why not closer to Consolas? Simple, my personal taste favors the round basic forms of classical fonts over the strong diagonal stress of much of Luc(as)'s work. Since this is my font, I get to draw it the way I like :)</p>
      <p>Why the curves? Well, I'm getting beaten up enough on these that I may relent. I <em>thought</em> that they'd make the font more lively and friendly, but perhaps their inconsistency with the rest of the font is a stronger argument. When I was drawing these glyphs, I had Evert Bloemsma's dictum in my head, "a straight line is a dead line," but perhaps in order to make that work I would have had to apply it consistently across all the letters in the font.</p>
      <p>I probably won't get serious drawing time until the weekend, but then hopefully I can post a revised version and see what you guys think. Thanks again for the crit so far.</p>
