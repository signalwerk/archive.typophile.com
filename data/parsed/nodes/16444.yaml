      <p><cite>There are some weird things going on with the way the dlyphs are drawn.</cite></p>
      <p>Yes. As you can imagine, this is driving me nuts. What you're seeing is the result of FontForge's "simplify" operation, which simply does not have The Quality. If I don't do that, then there are way too many points, and FF uses a lot of "div" operations to store the fractional coordinate values, further bloating the footprint of the font. But perhaps I simply shouldn't care about that.</p>
      <p>I think I'm just going to have to code up my own algorithms to produce optimized outlines. I've done a little research into doing that for TrueType, and that seems promising. My current prototype doesn't try to optmize for eliding the on-curve point between two off-curves, and that seems very worth doing.</p>
      <p>Optimizing for Type1 outlines is trickier, because there are so many more choices. It's tempting just to stay with TT because it makes life simpler.</p>
      <p>Why am I working on my own tools instead of using "orthodox" spline drawing? Why am I so unconcerned about bitmap generation? Because I'm stark raving mad, that's why. Mwahahahaha!</p>
