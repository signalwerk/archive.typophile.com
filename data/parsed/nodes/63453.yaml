    html: |-
      <p>What it matches exactly is the alternate ampersand of  Pistilli Roman (a film type shown in the 1985 Phil's Photo book called "Homage to the Alphabet"). The closest digital font I know to Pistilli Roman is <a class="freelinking external" href="http://new.myfonts.com/fonts/linotype/carousel-lt/regular/characters.html" rel="nofollow">Carousel</a>, however Carousel does not have this alternate ampersand. It also has differences mainly in the lower case (e, g, k, v, w, x, y, z). Uppercase K and Q are different.</p>
      <p>- Mike Yanega</p>
