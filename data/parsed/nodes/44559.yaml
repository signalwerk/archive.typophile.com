  html: |-
    <p>I would appreciate suggestions for a Beaux-Arts style font. My client would like me to create a logo that utilizes a Beaux-Arts style font… a font that has a 1930s look to it but not an Art Deco font.</p>
    <p>Any ideas?</p>
    <p>Thank you in advance.</p>
