  html: <p>FOR IMMEDIATE RELEASE <br>August 27, 2003 <br>					 <br>ATypI opens registration for some events to the public <br>ATypI Conference 2003 - Vancouver, Canada <br>September 25-28, 2003 <br> <br>Association Typographique Internationale announced today that some events taking place at their Vancouver 2003 Conference will be available for the public to register to attend. In particular, the pre-conference events as well as the keynote address and the Gala Dinner are available to those who are not able to attend the entire conference. <br> <br>The conference, with the theme </p>
