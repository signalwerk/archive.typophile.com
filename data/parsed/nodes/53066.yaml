    html: <p>maybe somebody could just direct me to a heavier serifed Trajan style font. that 'Q' is key to the logo, and is clearly from Trajan, but the "M" has serifs on top and the 'P' has a closed bowl, and the serifs look substantially heavier than Trajan's.</p>
