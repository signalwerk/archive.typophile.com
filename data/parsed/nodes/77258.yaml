      <p>The acute needs to be bolder and the D appears weak in comparison to other characters) whether this is fault of the typeface or not is irrelevant, I would suggest widening these a little manually). The N on the other hand looks a little too bold in comparison to the M. Possibly the centre of the O could be larger with a larger 'record-centre' if you will. </p>
      <p>Lovely idea and not too far off being a brilliant graphic.</p>
