    html: "<p>Since the OP didn't come back yet, I will post the reply she received from the publisher. She sent it to me as a follow up for her request for an ID also: <br> <br><i>\"Thank you for contacting Ronnie Sellers Productions. <br> <br>In regards to your question about the font in the Power of Women <br>calendar, you'll be interested to know that it is the artist's own font. <br>Unfortunately, I do not have permission to give you this font.  If you <br>are interested in more information, visit Jane Evershed's web site at <br><a href=\"http://www.janeevershed.com/new/home.htm/\" target=\"_blank\">http://www.janeevershed.com/new/home.htm/</a>. <br> <br>Kind regards, <br>Customer Service \"</i> <br> <br>[Note:  I told her it was a font I didn't recognize, and then I saw her post here. When I saw she didn't post the same information I thought maybe I could close it out for her by this method.]</p>"
