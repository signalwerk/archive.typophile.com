      <p>Thanks, David. Am I right in thinking that the interserif space idea refers to letter spacing within the italics, to make the italic letter spacing match that of the roman? That is another problem from the italic offset, I think, though it is also interesting, as the different lower case serif shapes and placements in roman and italics give rise to different spacings to the main stems, and it is typically only in the capitals that the serifs are the same in italic and roman.</p>
      <p>Looking at the offset point, I gather that you would place the alignment line (as shown in John's attachment) at half of the cap height, so an italic 'H' would be centered between two roman 'Hs'. Your alignment line is therefore higher than that suggested by Mark, Thomas, and John, which is a bit above half the x height. I would have thought that lower case words and phrases embedded in roman sentences (the most common case?) would look displaced too far to the left with your choice of offset.</p>
