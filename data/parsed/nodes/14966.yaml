      <p>I hadn't before considered the roman-italic spacing question in the terms David suggests, but I can see the sense in beginning with spacing the italic H so that it centres between roman Hs. As David says, if you use any other approach, the italic H will always be offset to the left or right (unless the design happens to have very short caps, in which case one might get close to a centered H following my recommendation or Thomas'). The problem I have with this approach, though, is that if you do centre the H, you end up with the lowercase offset to the left. When a word is set in italics within roman text -- or in roman within italic text --, I like the space before and after the word to be equal. Following David's recommendation, an italic word drifts to the left. Also, depending on the design, the italic letters may noticeably protrude into a left margin defined by roman letters above and below. For me, the whole question is really what aspect of mixed text setting you wish to compromise.</p>
      <p>An illustration to these thoughts is online at: <a href="http://www.tiro.com/John/RomanItalicSpacing2.gif" title="http://www.tiro.com/John/RomanItalicSpacing2.gif">http://www.tiro.com/John/RomanItalicSpacing2.gif</a></p>
