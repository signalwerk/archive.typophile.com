    html: |-
      <p>What I've always done is to shift the italic left so that the point midway between the baseline and the x-height of the roman and italic align, like this:<br>
      <code><br>
      _________________ x-height<br>
      .....|.../<br>
      .....|../<br>
      .....|./<br>
      .....|/<br>
      .....|<br>
      ..../|<br>
      .../.|<br>
      ../..|<br>
      ./...|   _________ baseline<br>
      </code></p>
      <p>There's really no way to make every combination between roman and italic fit perfectly. Lowercase-to-lowercase would seem to be the most common situation, so that's why I do it this way. </p>
      <p>Punctuation is not really a problem except in a situation where you have roman followed by italic punctuation in which case the punctuation will be a bit too close. The reverse situation is probably more common--italic followed by roman punctuation. In that case, the punctuation will be spaced a little loose, which I think is okay. In any case, the rule I learned years ago about typesetting is that, with rare exceptions, punctuation should match the style that precedes it.</p>
