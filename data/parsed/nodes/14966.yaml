      <p>I set both roman and italic sidebearings measuring from the stem/bowl at a fixed height a little more than halfway up the x-height. I use the same height for both styles, and this ensures that along a visual line through the middle of the x-height all glyphs are proportionally spaced relative to each other.</p>
