      <p>I consider the roman and italic spacing method I use as OMEGA tested: In 1992, just previous to my having deciding I'd seen everything, a client came and told me they were going to set headlines made of alternating Roman and Italic letters (in a Transitional typeface). The spacing method I've described was Norbertequesly old by then, but it worked in what I think we could agree was perhaps the most extreme "useful" case. I.E. mixed words of 12 or 13 degree italics would be more extreme but not likely to be tasty on the eyes. I absolutely know of other methods well enough to tell you when they Could be used (quite often), and when they Will fail (rarely). With enough experience you can use any number of methods because you know what to look out for...in the mean time, any complaints about the FB, Bitstream or Linotype libraries? I'm all ears.</p>
      <p>Also, "Berownese" should always contain some kind of nut, otherwise, they're just lumps of chocolate, which is okay, but after a while you crave something c'runchy.</p>
