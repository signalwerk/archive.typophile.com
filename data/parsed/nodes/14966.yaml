      <p>Glyn, I don't think you've translated the 'Berlownese,' as John Hudson calls it, correctly. The italic H will have the same or slightly less space between the serifs--and stems, as these are the same shape on both sides of the H. The italic H should also be centered between the side bearings, if I understand him correctly. But the n will be offset to the left of center between its side bearings in order to center between two H's. This will put the n somewhere in the neighborhood of where Mark and John will put it according to their rules. But it may be different from font to font, according to the design. </p>
      <p>The rest of the italics may be spaced relative to the italic H and n. Did I get it right, David?</p>
      <p>p.s. Just testing with an italic I am working on now, David's method made the side bearings of the italic n equal with the guideline at 63% of the x-height--about the same as Thomas's method, for this particular design, anyway</p>
