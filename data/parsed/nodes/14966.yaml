    html: |-
      <p>"the same interserif spacing as the Roman"</p>
      <p>The interserif space (i.e. the space between the serifs of two adjacent H's), should be about the same, or slightly less than the Roman...if there are no serifs, well, then the space between italic H's should be slightly less than the roman space between H's...</p>
      <p>There're two things: getting the basic H space, (and n space), fromRoman to Italic, and determining how and which way to offset either the upper, or lowercase, or both. I space the Uppers as I've described, and offset the lowers to the left...</p>
      <p>The fundamental principle is rooted in the following: you really do want to center the Roman by itself, don't you?, you really cannot effectively offset into the word space, can you, and you can't control any interfont spacing, thus: if the italic caps are not centered between romans, they never will be...and that is the basic need because the l.c. can only look bad if too far right...and this you can see a lot of these daze.</p>
