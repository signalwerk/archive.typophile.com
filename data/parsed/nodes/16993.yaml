    html: |-
      <p>Both Atlantica and Esta are OK.<br>
      However I'm actually looking for something that would be less nostalgic and more straight and newsy. Large xheight and ability to be tightly kerned is a must.<br>
      The Daily Teleraph font is perfect because it's less romantic than Basilia* and it's more sexy than Palatino* while keeping elegant vertical accent of Fenice*.<br>
      Do you think I won't finf alternate?<br>
      knap<br>
      *just examples</p>
