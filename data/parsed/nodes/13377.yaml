    <p>1879-1956</p>
    <p>Vice-President of Typographic Development for the <a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a> Company of New York. </p>
    <p><a href="/wiki/William%20Addison%20Dwiggins" class="freelinking" rel="nofollow">William Addison Dwiggins</a> and <a href="/wiki/Rudolph%20Ruzicka" class="freelinking" rel="nofollow">Rudolph Ruzicka</a> worked for him.</p>
