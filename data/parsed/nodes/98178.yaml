    html: |-
      <p>Two different things here:</p>
      <p>- whether the foundry and classification info shows up in Suitcase Fusion.<br>
      - what metadata is in the font.</p>
      <p>SF uses internal databases to map from fonts to what it displays in its user interface. For foundry name, SF has a list of "known" foundries, and can't recognize any other foundries. For classification, SF has a database of known families, and has classifications for those.</p>
      <p>For any family or font that SF is lacking pre-existing data, an end user may add classification or foundry name info, but this only works for their particular local copy of Suitcase Fusion.</p>
      <p>Regards,</p>
      <p>T</p>
