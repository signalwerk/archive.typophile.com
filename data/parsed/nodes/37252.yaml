    html: |-
      <p>I fiddled around with VOLT for a little while before deciding it was a little too challenging for (lazy) me, but I'm fairly sure that, while it can add OpenType tables and features to a font, it won't generate those features (although there's an active VOLT forum in MSN Communities, and someone among them may have developed add-ons which they are willing to share).</p>
      <p>Another option--if you're not up to tackling the .afm file editing mentioned earlier--is to set up a kerning pairs text file that makes the task a little simpler, such as...</p>
      <p>AVÀVÁVÂVÃVÄVÅV</p>
      <p>...and so on. Once you determine the first value, you can simply tab over and fill it in the same value for the remaining pairs. Or upgrade to FontLab Studio...</p>
