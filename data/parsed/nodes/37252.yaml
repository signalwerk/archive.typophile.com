    votes: null
    html: <p>Searching the TT3 manual for the word "class" gives me a description of class-based kerning in "what is kerning" and lists it as a feature in "the advantages of OpenType", but it is mentioned nowhere else. Opentype support in TypeTool is basically limited to exporting a font in Opentype format with no Opentype-specific features. I haven't acquired VOLT yet; maybe it does class kerning as well as lookup tables?...</p>
