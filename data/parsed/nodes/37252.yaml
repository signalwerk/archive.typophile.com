    date: 2007-09-19T09:48:00
    date_raw: 19 Sep 2007 — 9:48am
    votes: null
    html: <p>It's my understanding that TypeTool 3 will generate OpenType fonts (TT2 doesn't), so I would assume (perhaps foolishly) that it also supports class-based kerning. If it doesn't, however, you can generate a PS Type 1 font, open the .afm file in a simple text editor, make changes there, then import the new metrics back into your .vfb file. Admittedly, it's a pain, but it may be less painful than coming up with the cash to upgrade to FontLab Studio...</p>
