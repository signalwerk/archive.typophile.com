  date: 2007-09-19T01:35:00
  date_raw: 19 Sep 2007 — 1:35am
  votes: null
  html: <p>This is driving me spare. In Typetool 3, I copy my "A" into "Aacute", edit the glyph, and then have to type lots of numbers into the Metrics window so that PÁTÁVÁWÁYÁOÁGÁC kerns the same as PATAVAWAYAOAGAC does, and hope I haven't forgotten any pairs. I'm not looking forward to doing this too many more times. Is there a way to copy all the kerning-pair information from a character and put it into another?</p>
  html_clean: <p>This is driving me spare. In Typetool 3, I copy my "A" into "Aacute", edit the glyph, and then have to type lots of numbers into the Metrics window so that PÁTÁVÁWÁYÁOÁGÁC kerns the same as PATAVAWAYAOAGAC does, and hope I haven't forgotten any pairs. I'm not looking forward to doing this too many more times. Is there a way to copy all the kerning-pair information from a character and put it into another?</p>
