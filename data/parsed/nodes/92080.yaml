    html: |-
      <p>The overall look <em>is</em> the harmony.  :-)</p>
      <p>This is quite like how darker weights need to have a slightly higher x-height to look the same.</p>
      <p>But the size is central to this: the more you deviate from your target size range the less your design will work.</p>
      <p>hhp</p>
