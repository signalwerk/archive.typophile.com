      <p>Dear Fredrik,</p>
      <p>Your guess is correct. Unfortunately there is no such word as<br>
      ‘ναρχσω’ in classical Greek. I think You should type ‘ναρκόω’<br>
      instead. That would mean ‘jag bedövar’ or ‘benumb’, ‘deaden’<br>
      in English.<br>
      The false (top) and correct (below) forms have been presented<br>
      in an attached image.</p>
      <p>Sincerely,<br>
      Petri L.</p>
      <p>P. S.<br>
      The typeface used here is the original ‘Monotype Porson’.<br>
      A free version, named ‘GSF Olga’, can be obtained here:<br>
      <a href="http://www.greekfontsociety.org/pages/en_typefaces.html" title="http://www.greekfontsociety.org/pages/en_typefaces.html">http://www.greekfontsociety.org/pages/en_typefaces.html</a><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/benumb_6109.jpg"></div><p></p>
