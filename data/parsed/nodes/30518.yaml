    <p><strong>Greetings everyone.</strong></p>
    <p>I'm designing a typeface parallell to designing a book which will be set with the new type. Not exactly an ideal situation for everyone, but I find it a good excuse to finish the type face I've been working on for quite some time. Anyway, I have a couple of questions (more will follow in later posts).<br>
    The book includes ONE Greek word, and this will sound pretty lame, but could anyone identify the actual letters? The only version the publisher have is of an earlier printed edition. If You yourselves have a copy of Jüngers <em>Annäherungen: Drogen und Rausch</em> You could perhaps have a better version.</p>
    <p>My guess is an italic version of <em> Nu, Alpha, Rho, Chi, Sigma</em> and<em> Omega</em>. But that's the ultimate amateur's guess I'm afraid.</p>
    <p>Thanks in advance,<br>
    </p>
    <p>ƒ</p>
