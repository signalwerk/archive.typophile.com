  html: |-
    <p>While discussing typography over dinner, my friend and I ended up talking about designers we knew. His impression where that most designers are arrogant, bitter and often very negative. Thinking through my own experiences, I realized I had crossed paths with quite a few visual artists fitting that description as well. </p>
    <p>Now, I truly hope this is not the case. I feel most typophiles are very humble and helpful in dialog with youngsters &amp; newbies, like myself. </p>
    <p>What’s your impression?</p>
