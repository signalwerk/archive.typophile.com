    html: |-
      <p>I am not sure if you are aware of it or if this applies to your case, but you may want to read this from H&amp;FJ website:</p>
      <p>“Our end-user font licenses allow only the production of Workflow PDFs, not Public PDFs. For organizations that need to circulate PDFs more widely, we offer an Embedding License as a supplemental product.”</p>
      <p><a href="http://www.typography.com/ask/faq.php?faqID=16#Faq_16" title="http://www.typography.com/ask/faq.php?faqID=16#Faq_16">http://www.typography.com/ask/faq.php?faqID=16#Faq_16</a></p>
      <p>“Once converted to outlines in a drawing program, you can alter the shapes of letterforms (for example, in producing a logo.) But you may not alter the data contained within the fonts themselves, or use this data to produce new fonts.”</p>
      <p><a href="http://www.typography.com/ask/faq.php?faqID=32#Faq_32" title="http://www.typography.com/ask/faq.php?faqID=32#Faq_32">http://www.typography.com/ask/faq.php?faqID=32#Faq_32</a></p>
