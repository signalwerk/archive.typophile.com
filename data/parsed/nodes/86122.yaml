  html: |-
    <p>Hello :)<br>
    I'm working on a project using the font verlag, however there are several characters whose heights are lower than the rest (u,y,v,x) Is there a way to set the font to adjust these so they are uniform with the rest of the text? It is quite a long document so adjusting each character individually is not practical.</p>
    <p>Thank you</p>
