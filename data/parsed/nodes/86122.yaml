    html: <p>How are you determining that the characters are "lower". In all fonts (properly constructed, that is) characters with rounded elements, like c, o, e, etc. will rise higher at the x-height than the characters you mention, in order to appear visually correct. Mathematically identical heights are the error, not the correction.</p>
