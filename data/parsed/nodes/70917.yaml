      <p>Constantia was going to be my second suggestion. Cambria works better as a screen font, although both typefaces were designed to look good with Microsoft's ClearType rendering system, but Constantia is a warmer text face and sets very well for print.</p>
      <p>Note that if you are going to be setting math equations, the Cambria family includes Cambria Math, which is built to work with the new math handler in Word 2007. So this is another reason why you might consider Cambria.</p>
