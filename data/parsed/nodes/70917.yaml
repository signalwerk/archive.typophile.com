    html: <p>So — basically — if your typeface is going to be viewed on screen, your best bet is a typeface that is hinted to preform well on screens with low resolution. Have a look at the <a class="freelinking external" href="http://www.fontshop.com/fontlist/n/web_fontfonts/" rel="nofollow">Web Fontfonts</a>. They have a number of good serifs, amongs them Celeste might be the most bookish. Cambria and Constantia are also hinted for the screen. Monotype also have a section of fonts (although quite a few of them are very spindly) classified under the label <a class="freelinking external" href="http://www.fonts.com/FindFonts/searchresults.htm?st=4&amp;cid=ESQ%C2%AE%20%28Enhanced%20Screen%20Quality%29" rel="nofollow">Enchanced Screen Quality</a>, amongst them Sabon and Plantin – the latter might be too magazine-ish for what you want.</p>
