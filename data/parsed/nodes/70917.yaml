    <p>Hello all,<br>
    I've been lurking around the forums trying to get a "feel" for the answer to this before I posed it, but I still feel clueless, so I was hoping the great Typophile Hive Mind might have a good idea :)</p>
    <p>I'm looking for a good font for my PhD thesis document in Computer Science. My university gives me significant leeway in how I format the document.</p>
    <p>I've been using the Classic Thesis template for LaTeX, which has an <a class="freelinking external" href="http://mirror.ctan.org/macros/latex/contrib/classicthesis/ClassicThesis.pdf" rel="nofollow">example pdf</a>, and that's typeset in Palatino. The author also suggests Minion Pro would be a good substitution.</p>
    <p>I am not adverse to Palatino particuarly, but something feels not quite right about it, and I can't put my finger on it. The thesis needs to look great on screen and in print (perhaps more so on screen, as I expect that's how most people will read it), and Palatino seems to do that.</p>
    <p>I can't decide if I feel like it's a bit straight-laced for a CS document, maybe it's a bit too elegant and needs something "cleaner" (would humanist be a good description?)</p>
    <p>Apologies in advance for my general typographic newbieness. I know what I like when I see it, I'm just not at the critical level to communicate why yet. Like I am with wine :)</p>
    <p>Thanks in advance!</p>
