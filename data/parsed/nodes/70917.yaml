    html: |-
      <p><em>does hinting effect fonts displayed in a PDF document?</em></p>
      <p>Yes. Acrobat uses Adobe's CoolType renderer, rather than system rasterisers, so what you get in PDF is outlines and hints as interpreted by CoolType, which will differ from how the same fonts are rendered by the OS in other applications.</p>
    html_clean: |-
