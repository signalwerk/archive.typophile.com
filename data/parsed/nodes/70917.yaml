      <p>Frode: <em>What happens then?</em></p>
      <p>You get whatever rendering that application is using. It might be a system renderer, or it might be FreeType. It it unlikely to be something custom, particular to the application, but that is also a possibility. The only renderer I am aware of that deliberately ignores all hints is Apple's Quartz renderer.</p>
