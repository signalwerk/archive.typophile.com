      <p>You mention LaTeX, so I'll throw out either Minion or Utopia as possibilities. Both have good LaTeX math support, and Utopia seems well-suited for on-screen reading. I don't know that either recommendation is particularly tied to CS, but I have used both for mathematical writing. I have a soft spot in my heart for Charter as well, and it also displays well on-screen.  Charter doesn't seem elegant to me, and perhaps it's not suited to a dissertation that wants a more formal feel, but I do like the clean and open feeling it has.  Perhaps it would mix well with code snippets, etc.</p>
