    html: <p>It is possible to use a math font based on Minion or Utopia and then use another font for text; for instance, one can call the MinionPro package with the onlymath option so as to get all the necessary symbol characters and the Minion letters for the formulas, and then use Arno for text. I tried that and the result was quite nice till I got some indexed variable  immediately followed by an Arno comma that, at least on the screen, almost seemed to clash with the lower index. When there is some computer stuff, there is often also the need for a non proportional font that fits. Finding the right mix is not always easy and depends a lot on the text. For me, when in doubt,  use... Utopia for body text, but I like using other fonts with XeLaTeX when nothing clashes.</p>
