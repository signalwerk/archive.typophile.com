      <p>I saw this thread and decided to add my two cents to this cauldron of suggestions (even though Lewisham appear to have made his mind up).</p>
      <p>&gt; <em>I am not adverse to Palatino particuarly, but something feels not quite right about it, and I can't put my finger on it. The thesis needs to look great on screen and in print (perhaps more so on screen, as I expect that's how most people will read it), and Palatino seems to do that.</em></p>
      <p>How about using <a class="freelinking external" href="http://www.linotype.com/255806/aldusnova-valuepack.html#info" rel="nofollow">Aldus Nova</a>? The com version of Aldus is specifically designed for display work (what Linotype call XSF). Aldus (for text) is to my eyes the better Palatino, and Aldus nova is its definitive digital incarnation. If you use Aldus you could use Palatino as an auxiliary font for the math work and for the display sizes.</p>
      <p>I think that both Palatino and Aldus work <em>very</em> well for CS work. I have read a lot of published and unpublished CS related work set in various forms of Palatino, and it appears to me that this seemingly unlikely marriage between typeface and subject matter works quite well…</p>
      <p>If on the other hand, you want to go for a more neutral (yet highly readable) look, I would consider using <a class="freelinking external" href="http://www.dutchtypelibrary.nl/DTLDocumenta.html" rel="nofollow">DTL Documenta</a>. Although admittedly, it may literally dissolve your wallet...</p>
