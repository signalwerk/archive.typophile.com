      <p>Hi guys, thanks for the discussion here.</p>
      <p>Utopia does come with the math fonts, but I think the Palatino set math fonts with Constantia look pretty nice too.</p>
      <p>I uploaded two PDFs of example output: <a class="freelinking external" href="http://dl.dropbox.com/u/59692/utopia.pdf" rel="nofollow">Utopia</a> and <a class="freelinking external" href="http://dl.dropbox.com/u/59692/constantia.pdf" rel="nofollow">Constantia</a>. </p>
      <p>I think Constantia works better zoomed further out, and Utopia better further in. I also think Constantia looks slightly better printed.</p>
      <p>I think you can flip a coin, safe in the knowledge wherever it lands, it'll look great.</p>
      <p>I may go for Utopia because it's more portable and easy to put into LaTeX (doesn't have the XeTeX dependency).</p>
      <p>Thanks everyone!</p>
