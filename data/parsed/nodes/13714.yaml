    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Herbert Bayer</strong></p>
    <p>Born 1900 in Austria. Died 1985 in California.</p>
    <p>Herbert Bayer was a student at the <a href="/wiki/Bauhaus" class="freelinking" rel="nofollow">Bauhaus</a>, who later became a <strong>Master</strong> there (their egalitarian term for professor). At the Bauhaus, he developed several typeface proposals along the lines of his idea for a <a href="/wiki/Universal%20Typeface" class="freelinking" rel="nofollow">Universal Typeface</a>, which would be unicase. Bayer helped keep almost all type at the Bauhaus during its Dessau years lowercase only. On the school letterhead, which he designed, was an enormous footnote explaining the lack of capital letters ("why write big when you cannot speak big?").</p>
    <p>After the close of the Bauhaus, Bayer was one of Germany's leading commercial artists. Somehow untainted by the Bauhaus' communist reputation, Bayer spent much of the 1930s designing for the Nazis (see <a href="/wiki/German%20Nationalism" class="freelinking" rel="nofollow">German Nationalism</a>). Never a Nazi party member himself, he emigrated to New York in 1938.</p>
    <p>Bayer would become an executive at J. Walter Thompson, and a consummate American. His Nazi party associations have rarely been brought up, either during his life or after it.</p>
