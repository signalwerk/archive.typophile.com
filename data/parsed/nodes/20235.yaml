    <p>hey there, i have a client who currently has a simple logo, just their business name set in avant garde. now a wee while back i learnt about avant garde and its history (and its ligatures)... </p>
    <p>but now i  was wondering, i’d quite like to update the logo as it really is just carelessly set, and just tweak it slightly (so nothing drastic, maybe just some ligatures). an overhaul is not an option (despite my wishes)</p>
    <p>am i going to go to typography hell for mucking about with ag and its ligatures?</p>
    <p>or does anyone have any alternative typefaces that might be subtle alternatives...</p>
    <p>danke,</p>
