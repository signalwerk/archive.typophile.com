      <p>Magritte is an example of the blending of commercialism and art. Working within advertising while painting, where would his pipe or apple paintings be without his commercial background, and where would so many album covers be without Magritte? </p>
      <p>Van Gogh produced drawings in chalk (among other media) that show an ability that is not limited to paint.</p>
      <p><a href="http://poulwebb.blogspot.co.uk/2012/11/vincent-van-gogh-drawings-part-3.html" title="http://poulwebb.blogspot.co.uk/2012/11/vincent-van-gogh-drawings-part-3.html">http://poulwebb.blogspot.co.uk/2012/11/vincent-van-gogh-drawings-part-3....</a></p>
      <p>And you could make the point that Pollock had less conventional talent for paint than many other artists, there is a sea-change between the abstract expressionism of Blue or Shimmering and the drip paintings – a separation from the canvas. </p>
      <p>Is notoriety a talent?</p>
