      <p>The Van Gogh affair is the prime example of the romantic myth of the artist as outsider, serving to marginalize art and artists as mentally other and not requiring remuneration, with the value of their work transferring to dealers, curators, collectors, publishers and investors.</p>
      <p>Artists have been complicit in this, e.g. <em>The Death of Chatterton</em> (a young poet, in 1770), by Thomas Wallis, 1856:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/henry-walliss-chatterton_6152.jpg"></div><p></p>
