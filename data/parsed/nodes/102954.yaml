    html: <p>Inateness is usually presumed in talent, a kind of built-in advantage or proficiency that makes it relatively easy for someone to excel at a certain skill. However, in use we are frequently judging talent on the basis of output, rather than input, and don't always know how much effort has gone into developing a skill.</p>
