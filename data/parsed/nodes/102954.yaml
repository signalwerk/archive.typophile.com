      <p>There is a lot of recent research on this issue. I believe that they hold that a factor called 'grit', which is devoted persistence practicing the task, even the face of difficulty, is also necessary. That ability to focus and persist, which is fed by passion for the task and other factors is as important or more important to high achievement as raw talent. </p>
      <p>But raw talent is important. One of the coaches at my high school used to say "you can't win the Kentucky Derby with a mule." In the case of Mozart or Van Gogh, I think the 'instrument' misleading. Mozart would have been a great musician with a different set of musical instruments. And Van Gogh could have been great with water colors. What is pretty clear is that musical talent and artistic talent—or talent in poetry or mathematics—are rather specific endowments, which don't necessarily carry over to other aspects of life. I was reading recently that Van Gogh was, outside his huge artistic gift, a sadly inept and psychologically fragile individual, who was regularly taunted and bullied by cruel young men.</p>
      <p>The real geniuses in my view always have both: a rare gift for what they do, and a huge passion and devotion of time to exercising and cultivating the gift.</p>
