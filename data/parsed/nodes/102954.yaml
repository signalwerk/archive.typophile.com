    html: <p>The word talent suggests an expressible skill that is most often presumed to be inherent in the person and contrasted with the kind of skill that is developed with hard work and experience. It follows that if you remove the means of expression, an inherent skill remains in the individual, just as it does if that individual chooses not to express the talent. This is what makes it possible to say that someone is wasting his talent.</p>
