      <p>Don’t confuse talent with genius. I know a lot of talented people, I think I also have some talent, as do most people. If one chooses to use these talents is a different matter.</p>
      <p>The prototypical genius like Mozart is not a normal situation, it is more like a myth: only those with such huge talents are worthy of making great art, others just have to work very hard to even stand in their shadows.</p>
