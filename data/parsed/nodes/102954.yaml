      <p>Talent is not the innateness of a skill, but the innate ease of learning such a skill. As such, it is still dependent on the time spent training that skill (i.e. effort), which is again dependent on the personal emotional value (i.e. motivation). However, talking about a built-in skill is pointless.</p>
      <p>Talent is of course as well a relative term. It only means something when contextualized within a certain social environment and within a certain time lapse. The top athletes of the 1896 olympic games may have seemed plainly untalented put next to today's top athletes. From this point of view, "Am I talented?" is less a question about yourself than a question about which people you consider talented.</p>
      <p>But it's a good question, Neil.* What would have been of Van Gogh if you'd only given him a piece of chalk? Does the tool makes the artist?</p>
      <p>(As type designers, it's essential to keep asking ourselves whether the tools we use are nourishing our ability of expression or not. Bézier curves are the most numerically stable representation of an outline, but they are surely difficult to handle (pardon the pun), as smoothness depends on the position of two Beziér handles. On the other hand one has the constraint of in-extrema point-placing. Therefore, at least to me, it makes an enormous difference to draw sketches by hand before working with Beziér curves, one reason for this being that with a pencil I'm able to <em>sculpt</em> the glyphs into paper.)<br>
      _______<br>
      * A kind of question which is more easily answered with a beer in hand on a saturday afternoon.</p>
