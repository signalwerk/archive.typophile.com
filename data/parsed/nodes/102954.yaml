      <p>To me I see a phrasing, a voice if you will, and to me that is the talent to interpret a chosen subject matter.  </p>
      <p>Over at Christie's auction house Wednesday last, Jackson Pollock's Number 19 sold for 58.4 million US dollars ...not bad for a canvas that most everyone here thinks they can do. And that's fair. It's fair because we all can see the phrasing Pollock clearly stated. </p>
      <p>No matter how hard talent is pushed ...until a clear concise voice is achieved the work will sound/look like background noise. I'm guessing within type design that that is even more so?</p>
      <p>These masters, Mozart, Van Gogh, Pollock etc., seem ...and I hesitate to say this... destined to be who we see what they are. </p>
      <p>Honesty is rare. And perhaps that that is what talent only is ...the ability to be true to yourself.</p>
    html_clean: |-
      <p>To me I see a phrasing, a voice if you will, and to me that is the talent to interpret a chosen subject matter.  </p>
      <p>Over at Christie's auction house Wednesday last, Jackson Pollock's Number 19 sold for 58.4 million US dollars ...not bad for a canvas that most everyone here thinks they can do. And that's fair. It's fair because we all can see the phrasing Pollock clearly stated. </p>
      <p>No matter how hard talent is pushed ...until a clear concise voice is achieved the work will sound/look like background noise. I'm guessing within type design that that is even more so?</p>
      <p>These masters, Mozart, Van Gogh, Pollock etc., seem ...and I hesitate to say this... destined to be who we see what they are. </p>
      <p>Honesty is rare. And perhaps that that is what talent only is ...the ability to be true to yourself.</p>
