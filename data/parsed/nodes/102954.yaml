      <p>I don't think that you can deny the existence of talent.  You can deny the proper attribution of it, though.  Because someone has never been made famous by their talent, does not mean t does not exist.  It just means that they were not discovered.  The odds are that there have been plenty of talented folks who never made it into the Who's Who of the human race.  Imagine 3rd World countries with little media exposure.  I am sure that there must be some very talented folks from the Amazon jungles and elsewhere.<br>
      Cultivation and exposure brings fame, but talent is a prerequisite before we can apply the cultivation and exposure.  I am sure Van Gogh would have also slipped between the cracks into obscurity if it were not for certain quirks of fate and certain speculative art collectors as well as greedy opportunists.</p>
