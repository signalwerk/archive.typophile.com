      <p>Wittgenstein was brilliant, and did publish two works that had a huge influence, his Tractatus Logico-Philosophicus, and Philosophical Investigations. Russell wasn't wrong about his brilliance, but he was not only personally tortured, but also philosophically on a fundamentally wrong track, and tied himself in philosophical as well as personal knots. </p>
      <p>Russell after being deeply impressed with Wittgenstein, rejected his views and lost patience with him. In the infamous incident of the clash between my late teacher, Karl Popper, and Wittgenstein, Russell took Popper's side. (The book on this incident doesn't quite get right the argument at its core.) I have Popper's and Russell's bias on Wittgenstein, but a great number of people idolize both him and his philosophy. </p>
      <p>I think Nick Shinn is right that the picture of the tortured genius, which Van Gogh represents, and Wittgenstein fits, is unfortunately overemphasized. There are happy geniuses like Benjamin Franklin and Richard Feynman.</p>
