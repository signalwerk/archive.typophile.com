    <p>Hello,</p>
    <p>i am thinking of using Benton Sans (<a href="http://www.fontshop.com/fontlist/families/benton_sans" title="http://www.fontshop.com/fontlist/families/benton_sans">http://www.fontshop.com/fontlist/families/benton_sans</a>) for a bilingual book, and i am looking for a serif font to pair it with, not only for body text but as well for display.<br>
