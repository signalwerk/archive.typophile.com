      <p>There is a matching seriffed text face too—<a class="freelinking external" href="http://www.fontbureau.com/fonts/BentonModern" rel="nofollow">Benton Modern</a>—but you have to contact Font Bureau directly for licensing. </p>
      <p>I'd say almost all transitional typefaces will work well, so would modern bracketed ones with not too much stroke contrast like Century. Perhaps take a look at what Font Bureau is suggesting to be compatible with Benton on the right side here: <a href="http://www.fontbureau.com/fonts/BentonSans/" title="http://www.fontbureau.com/fonts/BentonSans/">http://www.fontbureau.com/fonts/BentonSans/</a></p>
