      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lorem_6209.png"></div><p></p>
      <p>Benton (News Gothic shown here) lends itself to this kind of effect because, with no thinning at the joints (owing to the abrupt angle at which curves intersect with straights), it is very monolinear. Similarly, there must be no bracketing of the display didone serifs. Berthold Bodoni shown here. You have to get the relative sizes just right; for larger display type, use Bauer Bodoni.</p>
