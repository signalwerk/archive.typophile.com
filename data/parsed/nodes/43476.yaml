    <p>I’ve been doodling around with font managers recently and found this interesting quirk in Font Agent Pro (FAP).</p>
    <p>If an OpenType/CFF font has a PostScript name longer than 28 characters,  FAP does not recognize it as a font.</p>
    <p>FontBook handles the font fine, as does dropping it directly into the various font folders on OSX. And when running the name audit in FontLab, PS names longer than 28 characters (29 and 30 char. in my examples) are deemed to be fine. The font also work fine in WIndows XP.</p>
    <p>If I remember correctly this 28 character limit was an old spec. Hasn’t this changed? What are current best practices?</p>
    <p>James</p>
