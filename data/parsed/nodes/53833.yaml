    html: |-
      <p>Strengths:<br>
      - somewhat gothic charm - reminds me of Edward Gorey<br>
      - variation of treatment of bottoms of letters gives baseline energy<br>
      - approximate consistency of diagonal lines ties letters together</p>
      <p>Weaknesses:<br>
      - unseriffed stroke of u looks odd to me.<br>
      - the ornamentation (on b, g, f) isn't consistent in style and scale.<br>
      - e and o don't fit (but you already knew that!). Try something narrower.<br>
      - the s should be thickest in the middle<br>
      - the jpg is too large! :-)</p>
