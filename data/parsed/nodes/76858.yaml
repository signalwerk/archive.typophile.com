  html: |-
    <p>Hi all,</p>
    <p>I am working on a greeting card for a women's non-profit<br>
    organization and the theme is about peace, hope, faith, etc.<br>
    for the holidays and I am creating the words to be the shape<br>
    of a gift box, so I am trying to decide what kind of typefaces<br>
    I should look for. There is one called Lobster I like and others<br>
    such as Rosewood fill and Mrs. Eaves Bold. I have other slab<br>
    serifs and a few scripts, but nothing jumps out at me. </p>
    <p>Would any of you have some suggestions? Thanks!!</p>
    <p>bonnie</p>
