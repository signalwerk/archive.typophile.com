    html: |-
      <p>Ummm . . . let's clarify something about the number of copies to be printed.</p>
      <p>When you typed "between 2-10,000 copies", did you mean "between two copies and ten thousand copies"? Or did you mean "between two thousand copies and ten thousand copies"? If it is the latter, digital printing is probably out of the question. Digital printing, in the right shop, is getting very good. But there are not enough "right shops" around yet.</p>
      <p>Not that this has much reflection on the basic design fee. But it may have some bearing on your fee for dealing with the printer, who will probably need to show you several sheets and talk about the cost variables among them.</p>
      <p>patty's price structure is a good place to start thinking about this. But, I, too, worry about what kind of swamp you may be getting into here. I do not mean to bash anyone, but very often clients who are not accustomed to publishing book-like things don't really understand all that this means. They very often need close attention and forthright direction so they may do their jobs with as little pain all around.</p>
