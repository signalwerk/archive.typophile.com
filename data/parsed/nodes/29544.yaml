    html: |-
      <p>For an illustrated book I usually charge between $40 and $50 per page. That includes design, layouts (plus one round of revised, additional correx at $50/hour), typesetting. Does not include picture research, scanning, retouching art, or dealing with the printer. </p>
      <p>So I'd say for a book that short about $2000. But be sure to make them understand it's only one round of layout changes.</p>
