      <p>Between 2-10,000 copies...</p>
      <p>If the total count of printed copies will be low, and your client is concerned with price over perfection, see if you can find a good digital printer. Lower quality, but much cheaper for low runs..</p>
      <p>I do prepress for a digital press, and with the right attention, it's acceptable stuff. Obviously, it's not going to rival offset anytime in the near future, but then again, ask for a large press to print 150 copies of something and they make look at you sideways!</p>
      <p>Just food for thought. Comments/criticism welcome.</p>
