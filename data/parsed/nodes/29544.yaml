    <p>I have been asked to provide a rough estimate for the design and production of a 40 page soft back book. The publication will be an architect's monograph to be sent to clients and potentially sold in select bookstores. </p>
    <p>We are currently getting quotes from printers for between 2-10,000 copies, and I'm really just curious what others would (very roughly) charge for the design of a project of this kind.</p>
    <p>Thank you, Ed</p>
