    <p>I wasn’t able to go to <a href="/web/20080908102032/http://typophile.com/wiki/TypeCon" class="wiki">TypeCon</a> this year so when I saw all the features on the TypeCon website (TypeCon Talk, Type Gallery, TypeCon TV!) I was excited that I wouldn’t be totally missing out. Well, it’s been a few weeks now and theres still nothing up. I was hoping to see video or audio of speekers, blog posts... It looks like TypeRadio didn’t do anything special either. So... what happened? Those that went, what was the highlight for you. Best presentation, workshop, best thing you learned...</p>
    <p>Josh</p>
