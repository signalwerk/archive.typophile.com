      <p>Ha! </p>
      <p>But we should get back to answering Josh’s question I think. </p>
      <p>I’ll have a slash - </p>
      <p>Best workshop - for me Adam Twardoch and Thomas Phinney talking about using MM tech with fontlab.</p>
      <p>Best pressentation - That’s hard because I liked nearly all of them and the vast majority were very strong.  But if pushed I would make it a 3 way tie between John Benson talking about Dwiggins, Bruno Steinert talking about Adrien Frutiger &amp; Mike Parker talking about  Adrien Frutiger. </p>
      <p>Best thing I learned... probably the current state of font tech/management and how difficult is is inevitably going to be to be even mostly on top of it.</p>
