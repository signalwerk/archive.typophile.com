      <p>Being a “grass roots” organization, SOTA relies on locals for a significant part of its attendance. Conferences are organized by a local committee, and these are also people who have been involved as volunteers at previous TypeCons. So there is a combination of conference experience, committment, and local knowledge and connections going into every TypeCon.</p>
      <p>A number of South Americans have attended TypeCon, and one board member, Claudio Rocha, is from Brazil. So Sao Paulo would be a more likely venue than Tijuana.</p>
