    html: |-
      <p>David Berlow “Scrolling all the way to Martha’s Vinyard” </p>
      <p>I did not say that...we were too far north at the time and looking at a character that had no descenders, (I).</p>
      <p>Thanks to Sota and the attendees, there was a good amount for content with guts. My faves: Apple admitting their font management is thin. w3c’s Lilly announcing that the “network” was going to take care of this (screen font) problem. MS announcing that they would not help was also refreshingly honest. The fashion show was really cool, I wish now that I’d bought a “kern” hoodie. And it’s always nice to be un-caffeinated, as I always am, amongst a whirling swirl of addicts. But the most joy I always get at conferences is seeing the people come out of the engine rooms of this industry to sit in the sunshine and hear nice things about type, because they deserve it the most.</p>
    html_clean: |-
