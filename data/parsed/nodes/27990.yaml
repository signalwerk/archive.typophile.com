      <p>I really enjoyed meeting all the real live typographic afficionados and talking to them face to face (rather than online). It was so wonderful to be surrounded by people who all dealt with and who were all involved with type in different ways. I thought the most entertaining bit was the typographic videos that were presented at the start of the conference and especially the little video on what a typographer sees when out in the real world. I would *love* to get a copy of that to show my students!</p>
      <p>For me, seeing the Helvetica film preview was a real treat; hearing personal stories about Adrian Frutiger was really impressive; meeting other type teachers and attending the type education forum was great fun and provided me with lots of ideas; and I really enjoyed the presentation by Nicolas Benson on the memorial he designed and his experience with cutting all the letters into the stone and battling the elements.</p>
      <p>It was a really great time.<br>
      Andi</p>
