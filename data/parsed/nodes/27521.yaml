    <p>I'm working on a website design, and I'm currently looking with my client for a font for headings graphics throughout the site.</p>
    <p>One of the fonts we considered is Bannikova from Paratype, but in my eye something is wrong with the digitization. It's a beautiful and very unique Soviet typeface designed by Galina Bannikova in the 1950s.</p>
    <p>I'll let you guys judge whether the quality is good enough for use in a design (with a little manual kerning). Once again, it's only for some headings to be read on screen. I'd also like to hear suggestion for similar typefaces.</p>
    <p>Here are a couple images:<br><img src="/sites/default/files/old-images/bannikova2_6636.png"><br><img src="/sites/default/files/old-images/bannikova_4625.png"><br>
    &nbsp;<br>
    The corresponding Identifont page: <a href="http://www.identifont.com/show?GG">Link</a><br>
    &nbsp;<br>
    I'm especially drawn by the beautiful serifs and "organic" letterforms.</p>
