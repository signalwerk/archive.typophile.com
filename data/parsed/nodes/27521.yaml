      <p>We don't have the C in native Finnish words.</p>
      <p>The lowercase "k" is also "cuddly" but retains a sort of dignity.</p>
      <p>It's only 10-15 heading images around the website. Screen typography is so easy because of the low resolution, it's mostly only a question of style. Don't have to worry that much about legibility problems, eye flow or stuff like that.</p>
