      <p>Suggestions Suggestions Suggestions :)</p>
      <p>By the way, we're running into a deadline and I'm relatively happy with the book weight of Bannikova. I don't only need to tweak the kerning, I even have to position some of the letters vertically. Like, consider the uppercase "B" <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=PG.109426.0.1&amp;attributes.sampleSize=48&amp;sampleText=Bay+City&amp;sampleSize=48">in this example</a>.</p>
      <p>By the way, here's how Bannikova was probably supposed to look before digitization: <a href="http://babich.spb.ru/pics/lj_pix/Bannikova/Baikonur1b.jpg">Link</a> (I only need the western alphabet, though).</p>
