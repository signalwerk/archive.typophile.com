      <p>Seems like par for the course. The nature of design is that -- on any given project -- you are often working with many different people, departments, and 3rd parties. It is often out of anyone's ability to control the situation.</p>
      <p>If you are a good designer who can consistently line up clients, at any one time you should be waiting on a few clients for material/feedback, and you should have a few clients waiting ON YOU to finish their work. That way, if a client has delays, you can give them some time without taking a financial hit.</p>
      <p>Waiting on a client with nothing in the queue is definitely bad resource management for a designer. Of course, I am the first to admit that it's hard to juggle doing work and marketing my services. In fact, I'm terrible at it. :-)</p>
