    html: <p>All of these are good options. Create a production schedule ahead of time. Indicate that each day late pushes back your delivery date, and/or add a rush fee when materials are late. I wouldn't walk away from the job unless you absolutely don't care to work with them again. And try to work with your clients, sometimes things happen, you may need an extra day of time too at some point. And communicate with them ahead of time, when a deadline is coming up remind them about your policy.</p>
    html_clean: <p>All of these are good options. Create a production schedule ahead of time. Indicate that each day late pushes back your delivery date, and/or add a rush fee when materials are late. I wouldn't walk away from the job unless you absolutely don't care to work with them again. And try to work with your clients, sometimes things happen, you may need an extra day of time too at some point. And communicate with them ahead of time, when a deadline is coming up remind them about your policy.</p>
