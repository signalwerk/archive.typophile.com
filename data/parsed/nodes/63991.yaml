    <p>Recently, I was hired to do the layout for a magazine. Three days past the deadline, I still hadn’t gotten half the content. How would you deal with these kind of situations? I eventually got everything, but had to finish the job a lot quicker than I had planned, causing the quality to drop. Would you ask for more money when the client breach the contract (if specified beforehand)? Is it an option to keep the advance and just tell them you can’t finish the job when it’s not taken seriously?</p>
    <p>I’d love your opinions.</p>
    <p>(Please forgive my poor English!)</p>
