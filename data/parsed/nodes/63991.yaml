      <p>Hm, I guess it depends a lot on the client and your relationship to them; the contract (if any); and of course the assignment and context.<br>
      FWIW I just had the same thing happen, except I got everything 2 weeks! late, which would have made it completely impossible for me to finish on time. So I talked to the client, and we ended up moving my deadline back by 2 weeks as well. That of course is an ideal situation, but I try to always build relationships with my clients where I can talk to them on a no-BS level. Helps in situations such as this.</p>
