  html: "<p>A couple of days ago I watched a documentary on archaeologists digging in Egypt. They had pre-printed forms to take notes. Now, take a guess what the pre-printed font on those forms was. (hint: If they’d been digging in Switzerland it would have been Helvetica.)</p>"
