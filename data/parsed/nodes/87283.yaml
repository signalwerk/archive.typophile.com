      <p>The discussion would indeed prove to be fascinating, Especially to see the difference between the normal Unicorn typeface and the sans version (without horn) Also, what would your terminals/serifs be when your stroke is a rainbow (like with the numerals) I believe it should be pots of gold.</p>
      <p>Due to comments about usability, especially on machine stress, I made 'Unicorn light' available now as well, for if your machine isn't rainbow powered!.<br>
      <a class="freelinking external" href="http://www.arthus.nl/files/light.zip" rel="nofollow">unicorn light</a></p><div class="imageWrap"><img src="http://typophile.com/files/light-specimen2_4316.jpg"></div><p></p>
