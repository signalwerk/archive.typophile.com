      <p>Hi Ted,</p>
      <p>I’m assuming that you have ruled out the idea of getting a designer to do this project, although you may want to consider it if it’s worth it to the residents’ group.</p>
      <p>Give us some more information:</p>
      <ul>
      <li>What kind of residents’ group?</li>
      <li>Who are members of the residents’ group?  Give us some demographic information about the group.</li>
      <li>What is the purpose of the residents’ group?  What do they do?</li>
      <li>Could we see the current logo?</li>
      <li>What would you like to achieve with the logo?  What does the current logo lack that would require a redesign?</li>
      </ul>
      <p>Let’s start there.  If you’re willing to learn, then I’m sure people will be willing to help you.</p>
      <p>Yours,<br>
      Nick</p>
      <p>—<br>
      Nick Hladek</p>
