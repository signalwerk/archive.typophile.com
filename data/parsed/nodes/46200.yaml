    <p>Let me start off by saying I am in no way a graphic designer, although I do know what looks good and what doesn’t.</p>
    <p>Basically, the place where I live has a residents group (?!) and I am interested in designing a new logo for them, not that they have on e now.</p>
    <p>It’s a very rural area, and the logo will have to reflect that (the current ’symbol’ is a Lapwing). As much as I would like, it can’t be too abstract.</p>
    <p>So, has anyone any ideas for a logo concept?</p>
    <p>Thanks,<br>
    Ted</p>
