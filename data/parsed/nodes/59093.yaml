      <p><em>What is a naked email address? Is this a problem? How do I fix this?</em></p>
      <p>Christopher, I believe I tried to warn you about this in an older post of yours. By naked e-mail address, Ben means that you are using the e-mail address, as is, on a website (this one), where it can be picked up by a <a href="http://en.wikipedia.org/wiki/Spambot" rel="nofollow">spambot</a>. A way of avoiding this is by typing it indirectly. For example, like this:</p>
      <p>typographer [at] gmail [dot] com</p>
      <p>or like this:</p>
      <p>typographer-at-gmail-dot-com</p>
      <p>The idea behind this is that thinking humans will get it, but unthinking spambots won't. :-)</p>
      <p>[EDIT] Ack, I belatedly see that Ben already answered your question. Oh well...</p>
