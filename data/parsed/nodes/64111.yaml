    html: |-
      <p>Many things said on that "Font Forging Industry" web site are true, but some of them are false, and there are a fair number of misleading things stated or implied on that site. Most notably, the use of the term "forging" is not consistent with normal English usage: in English a "forgery" is something which claims to be something valuable which it is not. Most of the cases Uli writes about are cases where something imitates something else, but under a different name, OR is in fact stolen material under a different name.</p>
      <p>Cheers,</p>
      <p>T</p>
