    html: |-
      <p>York Script (a.k.a Yorkshire) is a revival of an old film type as far as I know. It is shown in the Solotype Catalog on p.96, as part of a series of Y and Z named script styles. I realize these names may have been Solotype's own inventions in many cases. "Yorkshire" seems identical and shows up in a 1993 German type book of Script Types as coming from a foundry called Typo Bach in Frankfurt and Munich. Whose revival is legitimate is not easy to say in many cases, although reputations have been established by the type community, presumably based on some knowledge that I don't have. Opti had a York Script, and I know of three other aliases used by sources of fonts I do not trust at all.</p>
      <p>- Mike Yanega</p>
