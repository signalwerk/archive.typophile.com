      <p>Pattyfab:<br>
      Do you recommend Firefox over Safari? If so, why?</p>
      <p>There was some security scare about Safari, so I decided to change. Also, not all websites worked with Safari.<br>
      I’ve been told that Safari is faster with things like browsing for pictures in picture banks, but I don’t think there’s much in it. On the negative point with the Firefox, occasionally I can’t see letters ä and ö on some websites. And since they are in Finnish, it’s rather annoying.<br>
      Firefox remembers, when allowed, passwords etc, which I find quite useful in an one-person office.</p>
