  html: |-
    <p>Hello Typophiles,</p>
    <p>I'm designing a book using Maiola as the main typeface. The book is an essay on the nature &amp; purpose of art and an analysis of a few key pieces from different traditions: a Lohan, an ancient Egyptian sculpture, a Vermeer, a Rembrandt, etc. I feel the Czech references in Maiola suit the author and his conversational style. I also think it's a fine typeface.</p>
    <p>I'm using Maiola throughout, but for captions, space is limited. I'd like to use a condensed sans, but I'm struggling to find something that really complements Maiola.</p>
    <p>Any suggestions would be appreciated.</p>
    <p>thanks</p>
