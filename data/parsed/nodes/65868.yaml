    <p>I am finally giving a lecture on my vast collection of handmade typography used by merchants to mark pieces of cloth that were sent around the world from manchester, England in the 19th and early 20th centuries.<br>
    The type was handmade, by hammering copper strips into fruit wood blocks, and many fonts are unique to the textile trade. I have never shown these items before and am hoping that someone will be able to make use or at least be inspired by this unseen part of typographic history.<br>
    The Type Directors Club, based in the Garment District of NYC, seems a perfect location for this lecture. I will be showing original sample books, blocks, lettering and describing the history of this long gone typography.</p>
    <p>Please come along or pass the invite along to anyone who may be interested in the event.</p>
    <p>Thanks</p>
    <p>Adrian Wilson<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/TEXTile-lecture_4102.jpg"></div><p></p>
