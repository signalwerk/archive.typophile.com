      <p>I am a photographer and could put together a website but really the collection has many varied strands to it, from art history to typography etc so I haven't got around to even thinking about a website.<br>
      The talk is hopefully a first step in getting the information out there. I was a guest on the Antiques Roadshow when it went to Manchester but apart from that, this collection has just been sat around.<br>
      Tobias Frere Jones came to see part of the collection and he thought many of the fonts were unique to the textile trade but that was maybe 3 years ago and I have done nothing since in terms of displaying them.<br>
      I am hoping the lecture will generate some interest and hopefully lead to an exhibition or maybe some of the fonts could be digitized.</p>
      <p>I really have no idea but they are wonderful objects.</p>
      <p>Adrian</p>
