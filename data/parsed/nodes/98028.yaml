    html: <p>You can get the even rhythm with sans, but the 'dance' part of it seems me to be more difficult. With seriffed fonts you have both the serifs and the thick-thin contrast to play with. This gives you a lot of scope to 'cheat' this way and that to give more variety to the characters, so they have even color, but are quite varied. That seems to me more difficult with a sans. My feeling is that sans in general do not do so well in extended text, and this may be why. There are other issues, but that's a start. But not having done a sans yet, I'm not the best one to say.</p>
