      <p>Ryan, checking out Storm's site, your design looks a lot like Storm's Lexon. Biblion, which is his earlier and similar design was innovative in the way it succeeded in remaining legible at very small sizes, as I remember. Lexon is a bit less weird but still intended for reading at small sizes. Anselm is a design of his that is dialed back still further, and more traditional. </p>
      <p>I don't see any of these as good display faces, which you say is your goal, but this is a matter of personal taste. To me their quirkiness doesn't have the charm of a Cooper Black or much of Goudy's stuff. </p>
      <p>In the case of your design, I don't think it's as well executed as in Storm, as, for example, the terminal on your r is too light in comparison with the a s c  and the design of your m and n are not as harmonious with the rest of the design as in Storm's Lexon. </p>
      <p>I think your design here is too close to Lexon for comfort. I think you should take what you've learned on this and try to get a new design idea that is less close to Lexon. Also I'm sure there are others who like these Storm designs for their aesthetic, and those who like them can probably give you better guidance on executing it well. Generally speaking, if you are going for quirky in a display—and that can be very successful—it should have cuteness or scariness or some other mood going for it.</p>
