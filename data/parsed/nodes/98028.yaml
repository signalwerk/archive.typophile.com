      <p>Hi Ryan. Thanks for your appreciate comments. Could you correct the spelling on my name?  :)  I did write a similar essay <a href="http://ilovetypography.com/2010/11/02/reviving-caslon-part-2-readability-affability-authority/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Reviving Caslon, Part 2</a> over at ilovetypography.com .</p>
      <p>You'll see in the ilovetypography essay some of the visuals that illustrate my point about the need for both even rhythm and for variation or 'dance' (as Hrant has put it) that both gives a 'signal' to the eye of what letter it is, and keeps the face lively. I re-used some of those visuals in my slides in the talk. </p>
      <p>But I'd be happy to go further into it, if you have further questions.</p>
