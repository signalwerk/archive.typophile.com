    <p>I watched the video you took part in at Cooper Union  <a href="http://www.youtube.com/watch?v=z2hhkfUzZtw">http://www.youtube.com/watch?v=z2hhkfUzZtw</a>  (a great video and worthy of watching) and took note of how you described your Williams Caslon Text.  If I can paraphrase, how you believe the weight of individual glyphs need to dance around, how you don't want it too look even, but not predictably uneven either. You talk about this at about the 20 minute mark in the video.</p>
    <p>I wonder if the is any text out there describing this that you know of, I am very interested in this and would like to learn more.</p>
