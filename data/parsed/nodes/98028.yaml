      <p>Thing is though, because sans are often so geometrical and have such straight lines and less polymorphism between glyphs, sans fonts could use this effect a lot more than serif fonts do.  In fact I'm working on a face right now that is made up of all straight lines, and not straight lines so short that a sequence of them may be mistaken for curves, but straight lines that are meant to be seen as straight.  I find making the bottom of the O for example, slightly thicker than the top seems to take on this effect.</p>
      <p>I was hoping perhaps you came across this idea not from studying other typefaces, but perhaps read about it in some book somewhere.</p>
