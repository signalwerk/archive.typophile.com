      <p>I've learned about type first from reading my Uncle Ben Lieberman's old book, Types of Typefaces, which sparked my interest in it. Then from Tracy's Letters of Credit. Most of all by opening and comparing typefaces in FontLab, and then by drawing, drawing and comparing the effects of different variations of Caslon. And then from the folks at Font Bureau, especially David Berlow and Jill Pichotta. </p>
      <p>I think there's no way to really learn type design other than by drawing, looking and comparing over and over and over again.</p>
