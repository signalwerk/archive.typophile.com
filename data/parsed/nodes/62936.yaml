    <p>...is there such a thing? As a designer I need a base simple base font I can play around with and amongst other things create my own work from but according to all I've read  - I just can't do it - do I now have to design my own font before I can start work?, it seems daft. A bit like building a petrol motor car before I can design an electric car of the future.</p>
    <p>Any simple answers?</p>
