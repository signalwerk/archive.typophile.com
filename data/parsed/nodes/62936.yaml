      <p>Thanks for the input. In response to the 'lazy' insult - it is in fact just the opposite reason - I have designed over four new fonts in as many months based (and I use the word loosely) on the Arial family. These are highly stressed and deliberately damaged by over scanning, often with strange and wonderful results!<br>
      The reason for asking is these new designs make the font completely - and I mean completely unrecognisable from their former life.<br>
      ..And as for learning from scratch, I learnt my trade using Letraset.<br>
      I was just trying to do the decent thing!</p>
      <p>Campaigner</p>
