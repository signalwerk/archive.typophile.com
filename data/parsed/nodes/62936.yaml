    html: |-
      <p><em>The word lazy comes to mind.</em></p>
      <p>that is a bit harsh, perhaps, but pretty accurate. you shouldn't be afraid of doing the amount of work necessary. shortcuts only get you mediocrity. Here are my thoughts, hopefully they will help.</p>
      <p>if it is just the experience of drawing letters yourself that you are after, you don't need anything but illustrator, inkscape, or any other vector drawing software. sophomore year of college I drew an entire alphabet plus 12 or so letters for 3 other fonts in about 3 months as part of a project. this was really quite easy, but there was no functional font at the end. for functionality, those letters would have had to be imported into FontLab or another font development software.</p>
      <p>if a functional font, designed by you, is what you want, then you will need to start from scratch. or, perhaps, what Jens mentions above might work. just <em>please</em> obey other peoples' intellectual property rights.</p>
      <p>if you are simply looking for a free font, then google 'free fonts' there are tons out there that, while generally mediocre, can work for a variety of situations. just remember to respect the designer's intellectual property rights.</p>
      <p>cheers.</p>
