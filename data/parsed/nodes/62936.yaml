    html: <p>I spent months building a monstrous grunge font with 1,144 different characters (no repetition/components) and OT features that cycle them. So I feel qualified to say that it’s a waste of effort and once you move on to better things you’ll regret wasting time on something that designers could do in thirty seconds with Photoshop.</p>
