      <p>There are some font licences that allow modification. The fonts are not "absolutely free" though – you may not claim your modifications are entirely your own work for example.</p>
      <p>Check out these fonts licenced under the <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=OFL_fonts" rel="nofollow">Open Font Licence</a> OFL, or the Creative-Commons-licenced modular fonts at <a href="http://fontstruct.fontshop.com/" rel="nofollow">Fontstruct</a>. Tweaking the modular Fontstruct fonts with optical corrections in a "proper" font editor might be a really good exercise for a start.</p>
