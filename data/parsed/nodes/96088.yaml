      <p>It should be mentioned that the German word "Fraktur" was not in use during the centuries, when the Fraktur typefaces were in use.</p>
      <p>While the huge, multi-volumed Grimm's dictionary</p>
      <p>see <a href="http://woerterbuchnetz.de/DWB" title="http://woerterbuchnetz.de/DWB">http://woerterbuchnetz.de/DWB</a></p>
      <p>includes the word "Schwabacher", it does not include the word "Fraktur".</p>
      <p>Therefore, you cannot find an old handwriting specimen of the word "Fraktur" drawn in Fraktur letters.</p>
      <p>For details see <a href="http://www.sanskritweb.net/fontdocs/walbaum.pdf" title="www.sanskritweb.net/fontdocs/walbaum.pdf">www.sanskritweb.net/fontdocs/walbaum.pdf</a></p>
      <p>Nota bene: This refers to general dictionaries only.<br>
      Some old typesetting books used the word "Fraktur".</p>
      <p>In 1793, Johann Gottlob Immanuel Breitkopf used the word "Fraktur" repeatedly in his book "Ueber Bibliographie and Bibliophilie", but before 1850, the word "Fraktur" was not common in German dictionaries.</p>
