      <blockquote><p>"fraktur" and "schwabacher" are two styles of blackletter</p></blockquote>
      <p>If you look at the 22 languages using the latin or the cyrillic script (excluding simple english) that are offered as alternatives for the Wiki entry <a href="http://en.wikipedia.org/wiki/Blackletter" rel="nofollow">Blackletter</a> (left pannel), 20 of them call those fonts "Gothic", one uses the word "Gebrochene" (which for me conveys a meaning close to fraktur) and one (Latin) uses "Litterae fractae". </p>
      <p>Do you really think the English term "Blackletter" is  of any help here?</p>
