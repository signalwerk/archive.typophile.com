    html: |-
      <p>Terms are helpful in proportion to their acceptance. I myself don't mind revising [my] terminology (for example I'd love for people to start calling the Nazi swastika "hakenkreuz" instead) but the reality on the ground is that those other terms you mention* are virtually unknown. Now, it might make sense to call it something else in another language, but we <em>are</em> presently using English.</p>
      <p>* Especially "gothic", which means "sans" to many people.</p>
      <p>hhp</p>
