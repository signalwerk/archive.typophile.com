    html: <p>Harrr, shiver me counters! <br>I was actually asking on behalf of a font house where the font technician was absent during some emergency, and I was asked to help. <br>Somebody* actually sent me just what they needed. Although now I've become curious if there's anything that does this on the Mac too. <br> <br>* And it's somebody who would look quite incongruous donning an eye-patch. <br> <br>Adam, by renaming I meant a "full rename", where every field in the font is updated. In this case it seems just a prefix needed to be changed though. <br> <br>hhp</p>
