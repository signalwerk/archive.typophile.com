    html: <p>There was a set of utilities that came with Y&amp;Y TeX that would do what you want. Sadly, Y&amp;Y TeX is no more, but I imagine there are similar utilities available from the Tex Users Group (TUG). <br> <br>These utilities run in a DOS shell on a windows machine . . . <br> <br>First, using one utility, you make a PFA from the PFB. Once you have a Printer_Font_ASCII, you can rename the font with the utility, &amp; it goes inside &amp; makes sure everything that needs renaming is renamed. (We�ve done this, &amp; ATM doesn�t squawk a bit with the renamed fonts.) You then simply run the PFAtoPBF &amp; you�re back in business. There is also a �mactopfa� utility, but I�ve never tried a round-trip back to a Mac. I imagine the Pyrus program would be easier anyway. <br> <br>Another utility in this set I�ll make use of lets you make up a list of characters to rename in a PFA and/or an AFM file. I�ve already started such a file, to rename glyphs Asmall to A.sc, etc., Qswash to Q.swash, etc. You make up the list &amp; add to it as you find new glyphs that need renaming for OT font files. (Or if you are working from one of the Type 1 fonts where the small caps were named �a�; you write a separate S&amp;R file for these fonts to rename �a� to A.sc etc.) This will let one rename the glyphs in all the old Type 1 fonts &amp; AFM�s so that it is much faster &amp; easier to construct an OpenType font (where permissible under the licensing agreement, of course). <br> <br>And of course, if you're in a DOS shell, you canusually make a .bat file to do batch procesing . . . <br> <br>Best, <br> <br>Charles</p>
