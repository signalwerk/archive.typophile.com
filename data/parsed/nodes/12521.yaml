    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Ampersand</strong></p>
    <p>The ampersand is a punctuation character evolved from the Latin word <em>et</em>, meaning <em>and</em>. The visual evolution of the word et into a ligature and then into the common form we use today. Many contemporary typefaces offer alternate ampersands with the old form. See an article by <a href="/wiki/Max%20Caflisch" class="freelinking" rel="nofollow">Max Caflisch</a> which offers some historical background and several typographic examples showing <a href="http://www.adobe.com/type/topics/theampersand.html" rel="nofollow">the progression of the ampersand</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/12426" rel="nofollow">Appropriate use of the Ampersand</a>.<br>
    <a href="http://typophile.com/node/28831" rel="nofollow">What is the Difference between "&amp;" and "and"?</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://store.adobe.com/type/topics/theampersand.html" rel="nofollow">The Ampersand from Adobe.com</a></p>
