    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;:&nbsp;Ampersand</strong></p>
    <p>The ampersand is a punctuation character evolved from the Latin word <em>et</em>, meaning <em>and</em>. The visual evolution of the word et into a ligature and then into the common form we use today. Many contemporary typefaces offer alternate ampersands with the old form. See an article by <a href="/node/add/wiki?edit%5Btitle%5D=Max%20Caflisch" title="Create node &quot;Max Caflisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Max Caflisch</a> which offers some historical background and several typographic examples showing <a href="http://www.adobe.com/type/topics/theampersand.html">the progression of the ampersand</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/12426">Appropriate use of the Ampersand</a>.<br><a href="http://typophile.com/node/28831">What is the Difference between “&amp;” and&nbsp;“and”?</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://store.adobe.com/type/topics/theampersand.html">The Ampersand from&nbsp;Adobe.com</a></p>
