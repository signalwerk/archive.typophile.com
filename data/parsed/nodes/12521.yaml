    <p>The ampersand is a punctuation character evolved from the Latin word <em>et</em>, meaning <em>and</em>. The visual evolution of the word et into a ligature and then into the common form we use today. Many contemporary typefaces offer alternate ampersands with the old form. See an article by <a href="/node/add/wiki?edit%5Btitle%5D=Max%20Caflisch" title="Create node &quot;Max Caflisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Max Caflisch</a> which offers some historical background and several typographic examples showing <a href="http://www.adobe.com/type/topics/theampersand.html" class="link-external">the progression of the ampersand</a>.</p>
