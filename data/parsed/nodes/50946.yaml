    <p>The latest beta and the nightly builds of Firefox 3.1 now support webfonts.<br>
    Full article: <a href="http://opentype.info/blog/2008/10/25/sneak-peek-font-face-in-firefox-31/" title="http://opentype.info/blog/2008/10/25/sneak-peek-font-face-in-firefox-31/">http://opentype.info/blog/2008/10/25/sneak-peek-font-face-in-firefox-31/</a></p>
    <p>BTW: The final release will support Access Control Headers, which can be used to control from which domains the font can be accessed - a kind of server-side URL-binding.</p>
