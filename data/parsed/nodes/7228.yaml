    html: <p>hrant, <br> <br>readership age is fairly mixed but the most prominent age group would be early 30's to early 40's...i would guess target age is about 33/34....definitely geared toward people with money (my sentiments are the readers are just out of touch with what's hip and want to feel hip by reading articles about hip things...supposedly hip. whatever that means) <br> <br>as for the treatment of the text benefiting from a condensed standpoint; no, not really. although they usually use it for single words and 3 lines...sort of develops a squareish composition of 3 words....although when one word is significantly shorter than the others it gets tracked all to hell to fit. argh. it makes my skin crawl just thinking about it.  <br> <br>i guess my feeling is there are better faces to use besides supersizing folio and tracking it out to fit in a space. i just dont think slamming type into a system like that is good for anyone but it's their consistent look and the funny thing is it looks awful and seems to not fit with the rest of the mag. it would be like taking the cover page of a bad tabloid and using at the cover for the wall street journal. neither of the two support the other so there is just a lack in flow. so i'd really like to propose a differnet face to use for these headlines...or better yet develop something. i just started this job about 2 1/2 months ago so  my outgoing attitude is still at </p>
