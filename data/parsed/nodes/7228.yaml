    <p>so i work for magazine doing design and layout. sometimes it's creative, most times it's not. it's a fashiony/modern living type magazine. when i signed on there were things i just cringed at dealing with their use of type...my question is this, when dealing with headlines (that would be larger text used for display headlines on a page in a magazine) what would you recommend fitting the modern living fashion criteria? currently they are using something like Folio Bold Condensed at like 48 to 72 point depending on the situation. personally, i can stand it. don't mind it small for caption stuff but for my eyes it seems to just fall apart at larger scales. some other faces they use are akzidenz and weiss.  <br> <br>if you have any example pics, stories or whatever i;d love to see and hear. thanks! <br> <br>will</p>
