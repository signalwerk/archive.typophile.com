    html: <p>Changing to another version of Windows or to the Mac or to Linux will change nothing if the problem is due to too many kerning pairs, or overflowing tables etc. The limitation comes from the original specification of the font files (truetype or opentype); with Fontlab, you would just get another message (that might be more meaningful to those populating this site).</p>
