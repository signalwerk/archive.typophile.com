      <p>There are many fields (of type USHORT, SHORT, FWORD, UFWORD, uint16, offset ...) in opentype fonts that are 16 bits</p>
      <p><a href="https://www.microsoft.com/typography/otspec/otff.htm">https://www.microsoft.com/typography/otspec/otff.htm</a></p>
      <p>Your Windows 7 Enterprise 64 bits won't help with that.</p>
