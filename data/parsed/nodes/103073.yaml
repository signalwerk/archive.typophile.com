    <p>Hi<br>
    I am editing an Arabic ttf  unicode font in FontForge. After doing some lookup edit I get following error on generating TTF.</p>
    <p>"Attempt to output 2147483647 into a 16-bit field. It will be truncated and the file may not be useful."<br>
    I am using Windows 7 Enterprise (64 bit)</p>
    <p>Everything was working fine an hour back and then it started giving above error.</p>
    <p>I have attached the options chosen while generating ttf.</p>
    <p>2nd issue:<br>
    ========<br>
    I was trying to edit .fea file and merge it with FontForge but getting following error:</p>
    <p>There were errors when parsing the feature file and the features have not been applied</p>
    <p>Feature file is also attached</p>
