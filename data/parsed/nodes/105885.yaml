      <p>The book is printed in a typeface of the era classified as "modernized old style."<br>
      Foundries had very similar versions under various names, e.g. ATF's Binny &amp; Bradford. Here are a couple of generally matching samples from Devinne's 1899 book on printing types:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Devinne1899p195detail_3657.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/Devinne1899p196detail_4769.jpg"></div><br>
      These typefaces virtually disappeared after 1900 with the revival of classic typefaces of the 17th and 18th centuries, e.g. Caslon, and new designs, particularly those produced by ATF under the direction of Morris Fuller Benton, which are still in the standard repertoire for book printing.<br>
      Don<p></p>
