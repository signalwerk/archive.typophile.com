      <p>I wish I could offer you a digital revival of a 19th century "modernized old style" but so far I have drawn a blank. Another popular font of the era, Ronaldson, has been revived by Canada Type, but it has much larger serifs on the arms and looks quite different.<br>
      Don</p>
