    html: <p><a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/century-old-style/" rel="nofollow">Century Oldstyle</a>, though not introduced until after 1900, has a bit of the right feel, as does <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/bookman/" rel="nofollow">Bookman</a> (<em>not</em> Ed Benguiat's 1975 version of Bookman for ITC). They are both revivals of Old Style Antique designed by Alexander Phemister in 1858 for the Miller and Richard foundry in Edinburgh. Bruce Type Foundry produced a US version.</p>
