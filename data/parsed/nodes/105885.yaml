      <p>The story of Century Oldstyle is interesting. The publisher of the Century Magazine, Theodore Low De Vinne, was unsatisfied with the available typefaces, whether "modernized old style" or "modern" Bodonis, and in 1894, or thereabouts,  commissioned Linn Boyd Benton at ATF to create a font with higher technical standards using new punch-cutting  technology at ATF. Century Oldstyle was the first of the new generation of fonts that we still use today. Also note that the appearance of Century Oldstyle is blacker than the rather wispy "modernized old style" fonts. It also has larger x-height and more condensed proportions.<br>
      As for the BT Bookman, I agree that given the lack of "modernized old style" revivals, BT Bookman might be as good a substitute as any if we were to reset the text in this specimen in something that had some of the flavor of the "modernized old style" type used in it.<br>
      Don</p>
