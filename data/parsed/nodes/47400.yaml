      <p>Here's a few that I use oftenr than others:</p>
      <ul>
      <li><a class="freelinking external" href="http://www.smashingmagazine.com" rel="nofollow">Smashing Magazine</a> for looking at current trends, free stuff.</li>
      <li><a class="freelinking external" href="http://psdtuts.com" rel="nofollow">PSDTuts</a> for when what I want isn't available elsewhere for free, I might as well make it myself.</li>
      <li><a class="freelinking external" href="http://ascii-table.com/html-table.php" rel="nofollow">Ascii-table.com</a> for when I need to add an ASCII/UNICODE character to a website.</li>
      <li><a class="freelinking external" href="http://css-tricks.com/" rel="nofollow">CSS-Tricks.com</a> for good tutorials and techniques regarding design and javascript.</li>
      </ul>
