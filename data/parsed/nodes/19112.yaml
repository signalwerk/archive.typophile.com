    <p>Is anyone going? Are there any New Yorkers who can recomend a decent reasonable hotel near by?</p>
    <p>TDC FontTech Weekend<br>
    Friday evening, April 21, 6 to 8 p.m. Cocktail reception<br>
    Saturday &amp; Sunday, April 22–23, 2006, 9 a.m. to 5:30 p.m.<br>
    TDC Conference Center<br>
    127 West 25 Street, 8th Floor<br>
    New York, NY</p>
    <p>ChrisL</p>
