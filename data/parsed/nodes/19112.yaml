      <p>Chris, may I recommend the <strong>Carlton Arms Hotel</strong>? An old NY friend of mine spoke well of it once, and I passed his tip on to some friends who were here last July for TypeCon... they liked it... not too expensive, either.</p>
      <p>160 E. 25th St. (tel. 1-212-679-0680), between Third and Lexington Ave.</p>
      <p>My old <em>Let’s Go</em> guide says, “54 spacious rooms, each decorated by a different artist.” Another good reason to check it out.  :-)</p>
