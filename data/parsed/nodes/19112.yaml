      <p>i say check out <a href="http://www.hotels.com">hotels.com</a>.. you can even search for hotels by their vicinity to famous locations (Madison Square Garden seems closest to that address you listed).</p>
      <p>personally i’d recommend the Milford Plaza, but it’s not really nearby your address there.. it’s up just a few blocks from Times Square. nice hotel though, and reasonably priced considering the very central location.</p>
