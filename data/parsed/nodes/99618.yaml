      <p>Technically, the magazine title, "WIRED" isn't called the masthead, but the nameplate. The masthead is the list of owners, staff, departments, addressed, etc. found on the inside. However, the term 'masthead' has been misused often enough that some dictionaries now include that title page definition.<br>
      - Herb</p>
