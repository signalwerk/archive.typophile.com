    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jan2013_cover_5844.jpg"></div><p></p>
    <p>I've done a search in the forums for typefaces used on WIRED magazine. From searching, I've concluded that the masthead is a custom typeface by Hoefler &amp; Frere-Jones. (Correct me if I'm wrong please.) However, it seems WIRED changes their cover typefaces every issue.</p>
    <p>I think that this issue has used two different typefaces for the Jan. 2013 cover - a serif and san-serif. I've used identifont.com and whatthefont.com and haven't had any luck. Hoping someone has an idea. </p>
    <p>Thanks,<br>
    Cynthia</p>
