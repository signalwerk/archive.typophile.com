      <p><cite>There already is a topic which anwsers most of your questions: <a class="freelinking external" href="http://www.typophile.com/node/34111" rel="nofollow">http://www.typophile.com/node/34111</a></cite></p>
      <p>Ah, that was a fun thread. To repeat some of the relevant bits:</p>
      <p>John Hudson: <cite>Actually, Unicode encoded the Dutch IJ/ij digraphs as distinct characters, separate from the I+J and i+j sequences, because they were pre-existing characters inherited from a Dutch telecom standard. For the most part, Unicode does not encode digraphs. But some are encoded for backwards, roundtrip compatibility, as in this case.</cite></p>
      <p><cite>For the most part, Dutch users do not use the digraph characters -- although some, like Thomas Milo, certainly advocate its use -- they just type I+J and i+j. So far as I know, the IJ/ij digraph characters are not accessible via the standard Dutch keyboard.</cite></p>
      <p>Me: <cite>I don't think automatic ligation is the best option because not every 'ij' combination in Dutch is the digraph (even if for 99% of the time it is). The 'i' and 'j' might come from different syllables, or it might be a loanword.</cite></p>
      <p><cite>My take: to use special 'ij' and 'IJ' ligatures for Dutch, one should manually search and replace the 'ij' and 'IJ' combinations in the text, taking care to make sure to replace only when the digraph is wanted.</cite></p>
      <p>Does anyone know of a dictionary of the kind Michel was looking for, that distinguishes between the digraph 'ij' and the non-digraph 'i'+'j' sequence? I doubt one exists.</p>
