      <p>There already is a topic which anwsers most of your questions: <a href="http://www.typophile.com/node/34111" title="http://www.typophile.com/node/34111">http://www.typophile.com/node/34111</a></p>
      <p>As a Dutchman myself, I can say we type i + j, but see them as a single character. So they get capitalized together, and also stay together in vertical writing. (They also go into a single square in crossword puzzles ;) )</p>
      <p>The only instance I can think of where i+j isn't seen as a single character is when they are the end and beginning of two seperate syllables, like in Bijoux (bi-joux), which is a word we borrowed from French.</p>
