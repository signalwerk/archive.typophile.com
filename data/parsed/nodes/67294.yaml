    html: <p>What problem would it cause to temporarily encode ĳ as ÿ and Ĳ as Ÿ. The letters Y and y with dieresis do not occur in Dutch, so far as I know, and should be as easy to type as ë for instance. The names Meÿdrecht and Meydrecht would be properly sorted. After sorting, globally substituting ĳ for ÿ and Ĳ  for Ÿ would produce a file ready for final processing. In fact, it should also be quite easy to modify a keyboard layout so that the combination normally giving ÿ would produce ĳ and the one normally giving Ÿ would produce Ĳ. Again, global substitution between ÿ and ĳ can be applied for sorting and backwards for producing the final text.</p>
