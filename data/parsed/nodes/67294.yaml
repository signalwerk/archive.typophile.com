      <p>Concerning spacing, here is what the <a href="http://www.unicode.org/versions/Unicode5.2.0/" rel="nofollow"><strong>Unicode Standard, Version 5.2</strong></a> says (chapter 7, pages 203-204):<br>
      <cite><br>
      Another pair of characters, U+0133 latin small ligature ij and its uppercase version, was provided to support the digraph “ij” in Dutch, often termed a “ligature” in discussions of Dutch orthography. When adding intercharacter spacing for line justification, the “ij” is kept as a unit, and the space between the i and j does not increase. In titlecasing, both the i and the j are uppercased, as in the word “IJsselmeer.” Using a single code point might simplify software support for such features; however, because a vast amount of Dutch data is encoded without this digraph character, under most circumstances one will encounter an &lt;i, j&gt; sequence.<br>
      </cite></p>
    html_clean: |-
      <p>Concerning spacing, here is what the <a href="http://www.unicode.org/versions/Unicode5.2.0/" rel="nofollow" class="link-external"><strong>Unicode Standard, Version 5.2</strong></a> says (chapter 7, pages 203-204):<br>
      <cite><br>
      Another pair of characters, U+0133 latin small ligature ij and its uppercase version, was provided to support the digraph “ij” in Dutch, often termed a “ligature” in discussions of Dutch orthography. When adding intercharacter spacing for line justification, the “ij” is kept as a unit, and the space between the i and j does not increase. In titlecasing, both the i and the j are uppercased, as in the word “IJsselmeer.” Using a single code point might simplify software support for such features; however, because a vast amount of Dutch data is encoded without this digraph character, under most circumstances one will encounter an &lt;i, j&gt; sequence.<br>
      </cite></p>
