      <p>Thomas, I never questioned the proper typographic practices regarding ij in Dutch. While I appreciate the numerous examples, what they showed—IJ capitalized as a unit, treated as a unit when letterspacing, etc.—were certainly not new to me, and have all come up in the discussions here.</p>
      <p>Surely, such appropriate typographic treatment would be much, much easier if the Dutch ij was encoded as a single character (well, you know what I mean), so I see where your argument is coming from. Also, electronic dictionaries with the ij encoded appropriately would be a great aid in automatized text processing.</p>
      <p>However, my suggestion was based not on that ideal situation but on the reality that the vast majority of digital texts in Dutch including electronic dictionaries do not encode the ij as a single character but use the sequence i+j. The standard Dutch keyboard has no way of inputting the Dutch ij other than as the sequence. Even if the Dutch adopt a new keyboard enabling them to enter ij, there will be a huge amount of legacy texts to deal with, plus the fact that outsiders will presumably continue to type i+j for any ij in Dutch.</p>
      <p>So I am operating under these assumptions when I oppose automatic ligation for ij, even if in Dutch texts 99% of the i+j combination represents the character ij (as you can check, I already acknowledged this). That and the fact that language tagging of existing digital texts is not entirely reliable. Do we trust that texts in Dutch will be consistently tagged as being Dutch, and that portions of non-Dutch text in a predominantly Dutch document will also be appropriately language-tagged? This just isn't realistic.</p>
      <p>I said "one should manually search and replace the 'ij' and 'IJ' combinations in the text, taking care to make sure to replace only when the digraph is wanted." Maybe I made it sound cumbersome, but is it really too much to ask that a human editor check to see if the text is (a) in Dutch and (b) doesn't contain one of the very, very rare instances in Dutch where the combination i+j shouldn't be replaced by the ij character? It's still search and replace, which the software automatically does for you. I'm merely warning against blind automatism, where you think you can simply build this functionality into a font, for instance.</p>
