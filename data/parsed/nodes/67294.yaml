      <p>Martin Majoor writes in <em>'Had de Franse koning schoenmaat 49?'</em> (his chapter in <em>'Letters, een bloemlezing over typografie'</em>):</p>
      <p>"De typisch Nederlandse diftong <em>ij</em> wordt in alfabetische lijsten op grond van haar klank vaak tussen de <em>y</em> geplaatst. Dat is net zo onjuist als dat met de letter <em>c</em> op grond van haar klank tussen de <em>k</em> of <em>s</em> rangschikt. En ook de andere diftongen (<em>au, eu</em> etc.) staan gewoon in alfabetische volgorde. Het gebruik om bij een beginhoofdletter de beide tekens van de <em>ij</em> in kapitaal te zetten - zoals in IJmuiden - is formeel gezien niet juist (men maakt er ook geen AUsterlitz van of OUde Pekela). De oorspronkelijke schrijfwijze Ymuiden ligt waarschijnlijk ten grondslag aan dit ingeburgerde gebruik. Bij spatiëren van een kapitaal woord met een lange IJ moeten dus ook de I en de J gespatieerd worden.<br>
      I J M U I D E N en niet IJ M U I D E N ."</p>
      <p>(I'll try to translate it in English for those who don't speak Dutch.)</p>
      <p>"In alfabetical ordered lists, the typical Dutch diphtong <em>ij</em> is often ordered with the <em>y</em>, based on it's pronounciation. That is just as wrong as ordering the <em>c</em>, based on it's pronounciation, with the <em>k</em> or <em>s</em>. Also, other diphtongs (<em>au, eu</em> etc.) are ordered in a normal alfabetical way. The use of capitalizing both characters - as with <em>IJmuiden</em> - is formally wrong. The original spelling <em>Ymuiden</em> is probably the basis of the common practice. When spacing a word in capitals with an IJ, the I and J should be spaced seperatly.<br>
      <em>I J M U I D E N</em> en not <em>IJ M U I D E N</em> ."</p>
    html_clean: |-
