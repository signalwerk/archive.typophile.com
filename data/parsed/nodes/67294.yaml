      <p>Fiji (fi-ji) is another word that shouldn't have the <em>ĳ</em>. </p>
      <p>This also brings up another ligature problem: In most cases it should be f+ĳ (as in <em>fijn</em>) and not ﬁ+j (as in <em>fiji</em>).</p>
