      <p>Thanks for your reply and the link.</p>
      <p>'Bijoux' is the sort of example I was interested in.</p>
      <p>The reason I had asked is because I am working on a face where some of the alternate forms of ij differ from those which would be produced by the sequence i + j. Since I assumed most Dutch speakers would enter this character as a sequence, I was thinking of including a localised 'ccmp' feature which substituted the sequence with the digraph, but the existence of words like 'bijoux' demonstrates that that isn't a viable option.</p>
      <p>André</p>
