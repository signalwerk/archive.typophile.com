    html: <p>The North German tomb stone doesn't seem to be in Frisian, it's more like slightly antiquated German. The place name Keijtum looks indeed Frisian. There are many Frisian place names ending in -um ("heem", "Heim", "home"?) in a broad Frisan belt that starts just North of Amsterdam (West Friesland), and that follows the coastline (Friesland, East Friesland) - all the way to the Danish border.</p>
