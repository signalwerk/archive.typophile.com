      <p>André</p>
      <p>In French, when using Word, the spelling dictionnary automatically substitutes (if automatic correction is activated) sœur for soeur, Œuvre for Oeuvre but leaves moelle and incoercible intact.  There is no need to type the letters Œ or œ.</p>
      <p>For Dutch, the only words containing ij as two letters in  my Thunderbird dictionary are</p>
      <p>Anastasija, Beijing, Dimitrij, Fiji, Henrijette, Maija, Marijanne, Mija, Mirijam, Mirijana, Nadija, Naija, Neija, Seija, Taija, Veijo, bijektion, bijektionen, bijektionerne, bijektiv, bijob, bijobbet, bijouteri, bijouterivarer, dijonsennep, fijianer, fijiansk, frijord, hijacker, hijacking, politijagt, rijsttafel</p>
      <p>(is "rijsttafel" really with two separate letters?). That means (in my  opinion) the words with the letter ĳ should be automatically corrected by the spell checker. That is part of its job.</p>
      <p>Michel</p>
