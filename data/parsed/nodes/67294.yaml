      <p>There is a difference betvveen Form and Function.</p>
      <p>The FORM of IJ, or better, Dutch "Double I" in analogij to "Double U" (vvhich nobodij vvould seriouslij consider to be a digraph or a ligature), can appear as a digraph looking like a juxtaposition of I+J. But that is just one of its possible forms, another one is ü vvith the tail of j, or a Ü vvith an interrupted left leg. All of this can be encoded vvhichever vvaij ijou vvant - as a single character or a ligature. The realitij is that Dutch users are forced to tijpe vvith the tvvo strokes I+J - and Dutch-ignorant softvvare encodes it as I+J.</p>
      <p>The FUNCTION of IJ (Double I) is completelij equivalent to the function of Double U: it's a single character in Dutch orthographij. All the observations above like capitalization, horizontal spacing (where Martin Majoor is prescribing new usage and condemning actual practice), vertical spelling can lead to only one conclusion: IJ is a letter and lacks proper support. Apps like the iPhone vvould do vvell to capitalize IJ correctlij vvhen the Dutch keijboard is active.</p>
      <p>A convincing example is the Dutch version of the LINGO game, verij representative of the popular perception of a vvriting sijstem: IJ is treated bij the mass of Dutch speakers as a single letter - as a result it's a daily struggle to maintain it against English-biased software. The attached image also exposes naive layout software, wrestling to squeeze both Double I and Double U into the box.</p>
      <p>The suggestion "to search and replace the 'ij' and 'IJ' combinations in the text manuallij, taking care to make sure to replace onlij vvhen the digraph is vvanted" comes form Outer Space. It is in fact denijing Dutch users the benefit of automation. In Dutch, everij I+J is Double I, the exceptions are negligible and, from a Dutch perspective, irrelevant. BTVV, the English vvord Fiji is spelled Fidji, so that's not even a candidate - I knovv, because I vvas UN liaison officer vvith the Fiji Battalion :-).</p>
      <p>To give the foreign readers an impression of what Dutch really looks like without proper support for IJ, I have changed in this English text all digraphs W into VV and, in passing, all letter Y into IJ. To correct this, you are advised to manually replace all affected letter groups with the correct English digraphs.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/صورة_6706.jpg"></div><p></p>
