      <p>I know that the Dutch "ij" glyph has a separate character in OCR-B, and that at least some manual typewriters sold in the Netherlands did have a key for "ij" even if the Dutch keyboard for Microsoft Windows does not. So it is indeed more than just a ligature, even though the fact that it is treated as a letter of the alphabet by the Dutch is confusing to everyone else.</p>
      <p>Of course, the thought that "ij" is really the Dutch way of writing "y" would mean that there <em>is</em> a key for it on every Latin keyboard... and all one has to do is draw the glyph appropriately. That, though, is probably not a realistic option - and, indeed, one of the examples given shows IJ as collating as though it were i + j instead of as Y, even if another example shows it drawn almost as a y-umlaut.</p>
      <p>I had remembered about IJ in OCR-B from the article "Inside ASCII" by Bob Bemer in Interface Age: I was able to find two examples on the web:</p>
      <p><a href="http://www.fontage.com/pages/ocrb10n.html" title="http://www.fontage.com/pages/ocrb10n.html">http://www.fontage.com/pages/ocrb10n.html</a><br>
      <a href="http://www.barcode-soft.com/kb/ocrb.aspx" title="http://www.barcode-soft.com/kb/ocrb.aspx">http://www.barcode-soft.com/kb/ocrb.aspx</a></p>
      <p>showing this - the face is monospaced, so the IJ characters omit the serif which is present on I and J as individual letters.</p>
