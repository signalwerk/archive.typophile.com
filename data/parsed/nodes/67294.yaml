    <p>Are there any instances where Dutch distinguishes between the digraph 'ĳ' and 'ij' as a sequence of two distinct graphemes?</p>
    <p>And a followup question: Do Dutch speakers normally type this character as U0133 or as sequence of i + j?</p>
    <p>TIA</p>
    <p>André</p>
