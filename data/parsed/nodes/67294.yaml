      <p>Using the proper codes for UC&amp;lc "Double I" would be best, and I agree that without an input method, this will not happen.</p>
      <p>A hardware keyboard is a no-brainer. Easiest would be a Dutch keyboard driver or locale that intercepts all I+J sequences and and replaces them. Without manual or automatic correction it would of course also affect a minimal number of borrowings. But it would be ridiculous to consider minimal damage to a limited number foreign words a problem, while real damage to Dutch words was never a concern. After all we now have have a legacy of tons of miscoded text - a fact that UNICODE standard has the chutzpah to use as an argument to perpetuate this bizarre situation :-)</p>
      <p>Alternatively, smart font technology could be deployed to display I+J sequences as Double I. This makes sense, after all for the end-user it makes no difference how it's done, as long as it works. But that doesn't solve the problem of sorting. "Double I" really belongs at the end of the alphabet, because words so spelled often correspond with words that have Y. This is especially the case with names. Some branches of the same family spell their names as Meijdrecht, others as Meydrecht. When correctly sorted, these names would be mixed into the same positions, but when sorted with I+J they are split up. Very unpractical and counter-intuitive.</p>
      <p>In either case, but especially when using font technology instead of proper coding, some kind of language tagging is helpful, but not mandatory. Not to have language tagging is harmless when compared with the present automatism, that blindly - and wrongly - assumes that for Dutch, like for English, any combination of I+J is not a Double I. For Dutch it's really more pragmatic to assume that all cases of I+J are Double I, and accept some marginal collateral damage. At least then you get the casing and sorting, and about everything else, right.</p>
