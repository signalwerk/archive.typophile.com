      <p><cite>Does anyone know of a dictionary of the kind Michel was looking for, that distinguishes between the digraph 'ij' and the non-digraph 'i'+'j' sequence? I doubt one exists.</cite></p>
      <p>Not that I know of. It never has been a problem ;-)</p>
      <p><cite>(Michel) That means (in my opinion) the words with the letter ĳ should be automatically corrected by the spell checker. That is part of its job.</cite></p>
      <p>Jah. Well. Maybe not. Being Dutch, I'd object against forcing all ij's to be typed as ĳs. (Not really visible, is it? I mean the separate 'i' 'j' to be typed as a single character.)</p>
      <p>The "ij" has a <em>status aparte</em> in Dutch but it does not need any specialized software handling, where "oe" vs. "œ" <em>does</em>.<br>
      The status aparte is especially significant when capitalizing (IJmuiden, IJstijd) and sorting (as a single glyph in the place of "Y" -- and suddenly, I have no idea what happens with native words starting with an "Y"! (before? after? interleaved?)).</p>
      <p>Granted, sorting and capitalizing would be easier for programmers if the digraph was a single glyph, but virtually all of our current "smart" software would need to be re-written ;-)</p>
