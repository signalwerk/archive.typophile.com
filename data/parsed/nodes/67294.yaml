      <p>I now found a manual for the DEC VT340 terminal which gives a "national replacement character set". This includes a y-umlaut, which presumably is a misprint for ij.</p>
      <p>The Dutch 7-bit modified ISO 646 or CCITT Telegraph Alphabet No. 5 which I found there has the following changes from ASCII:</p>
      <p># -&gt; British pound sign<br>
      @ -&gt; 3/4<br>
      [ -&gt; ij<br>
      \ -&gt; 1/2<br>
      ] -&gt; | (!!!)<br>
      ^ as is<br>
      _ as is<br>
      ` as is<br>
      { -&gt; diaresis combining form<br>
      | -&gt; florin sign<br>
      } -&gt; 1/4<br>
      ~ -&gt; acute accent combining form</p>
