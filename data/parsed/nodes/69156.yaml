  html: |-
    <p>Does anyone have intelligence (or heard rumors) about which fonts will be bundled with Adobe CS5?</p>
    <p>Meanwhile, I've been auditing installed fonts at computer labs in a couple of institutions (as well as on my own Macs), and was hoping to get a handy list of which fonts shipped with which versions of Adobe CS. I remembered there had been conversations here about this, so I poked around and figured it might be useful to re-post Thomas Phinney's lists from his Typblography (thanks again, Thomas):</p>
    <p>Fonts that shipped with CS3<br>
    <a href="http://blogs.adobe.com/typblography/2007/04/cs3_bundled_fon.html" title="http://blogs.adobe.com/typblography/2007/04/cs3_bundled_fon.html">http://blogs.adobe.com/typblography/2007/04/cs3_bundled_fon.html</a></p>
    <p>Fonts that shipped with CS4<br>
    <a href="http://blogs.adobe.com/typblography/2008/09/cs4_fonts.html" title="http://blogs.adobe.com/typblography/2008/09/cs4_fonts.html">http://blogs.adobe.com/typblography/2008/09/cs4_fonts.html</a></p>
    <p>I'm left with some questions -- like, did Warnock Pro or Brioso Pro fonts ever ship bundled with other Adobe products? How'd they get on these lab computers!? Cussed pirates!</p>
    <p>- Matthew</p>
