    html: <p>Every October in Central Park there is a Falconery show and one speaker was talking about the Bald Eagle reentry program (They use to be all over the Hudson River). For four years they released 4 birds, all with tracking devices on them to tell where they went. The park they released them from is at the north end of Manhattan, I don’t remember the park. Well one Bald Eagle flew up to a branch and looked upriver and took off in a shot. One of the observers used his radio tracking to follow the eagle 12 miles up the Hudson where the eagle had seen another eagle and went to meet it.</p>
