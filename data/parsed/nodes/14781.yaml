      <p>&gt; as I am the one who pays (and thereby provides…) I have some say.</p>
      <p>That’s certainly true here too - probably even more so. But the thresholds seem to be very different. So for example lasik is much cheaper here, but that’s because: people are looking after every penny; and the whole thing has been streamlined. The end result is if you want something different, you <strong>can</strong> get it, but you have to find somebody “special” and the price goes through the roof. Like bathroom tiles: if you’re a person with normal finances, your choices are limited to what I call the Draconian Color Trio: White, Black, Almond. “White, black, or almond, sir?”, “White, black, or almond, sir?”, that’s all they know how to say, repeatedly, until you break down and choose one. And Almond is a joke. You want a window installed that’s not a white-aluminun double-pane with FAKE divisions deal? Pay through the nose and wait a month. You want a deep tan fridge to replace the one in your old kitchen where everything is deep tan? Well, screw you, you eccentric but not-rich-enough freak. The whole thing is becoming an Infernal Average.</p>
      <p>hhp</p>
