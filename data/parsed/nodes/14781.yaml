      <p>I discussed it with the guy who did the lasering and it’s perfectly feasible. My intention was to postpone the need for reading glasses as long as possible (since I an working with stuff at arms length mostly, like books. monitors etc.).</p>
      <p>He told me a ‘funny’ anecdote about the capabilties of the brain to adjust: seems that when older people that have cataracts have their natural lenses removed and exchanged for artificial ones are sometimes unable to discern distances at all, upto a year. Their brains can’t adjust as easyly anmore.<br>
      Since I don’t consider myself old yet, I was not to worried about this. ; )</p>
      <p>Adapting to the ‘dual vision’ was quite easy and the sensation of being able to see sharply when going for a snacking spree in the middle of the night is still a thrill…<br>
      (I was L -7.0 and R -3.5, thereabouts).</p>
