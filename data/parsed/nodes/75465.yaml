    <p>The Northern European Type Collaboration Typolar has started. Find us at <a href="http://www.typolar.com" title="www.typolar.com">www.typolar.com</a>. Founded by type designers Saku Heinänen, Jarno Lukkarila and Teemu Ollikainen, Typolar operates from Helsinki and London. </p>
    <p>Typolar builds on the Nordic tradition of sturdy functionalism. For us it means fresh ideas and practical results. Working closely with publishing industries has made our typefaces naturally suitable for editorial work. However, many have found them highly useful in branding and identities as well. And that’s how we like it.</p>
    <p>We are launching two brand new font families together with our site. Calypso E and Vinkel are both versatile and hard-working types with optimized weight ranges,&nbsp;extensive character sets and useful OpenType features. Calypso E is also available as web fonts.</p>
    <p>You are most welcome to have a closer look at our site! Find our specimen pdfs there.</p>
