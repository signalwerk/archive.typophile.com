  - id: 10034
    user: 851
    date: 2002-07-05T21:35:00
    date_raw: 5 Jul 2002 — 9:35pm
    votes: null
    html: "<p>Thanks for the support, Christian. I agree with you on the italic. I won't mess with the non-round letters, just the c, e, o, and s. Which lc k are you referring to in the Roman: the loopy one or the angled one? I thought at the beginning that the loopy k and w and the small-cappish q would add more uniqueness to the lowercase, but I don't want to end making it jarring to read, or for a few quirky characters to look like a crude attempt to counteract an otherwise unremarkable general letter structure. I'm not sure I understand what you mean by \"loosen[ing] up\" the circles. <br> <br>As for OpenType, if you're doing Latin scripts, the cheapest way is to download Adobe's OpenType FDK. The newest <a href=\"http://partners.adobe.com/asn/developer/type/otfdk/main.html\" target=\"_top\">version 1.5</a> can now be downloaded via a click-through agreement. <br> <br>I personally use <a href=\"http://www.fontlab.com\" target=\"_top\">FontLab 4.0.5</a>, which currently requires Windows. I'm curious to hear if Mac support will be part of the new version 4.5 announcement at the upcoming TypeCon. Both FontLab and DTL's new app, <a href=\"http://www.fontmaster.nl\" target=\"_top\">FontMaster</a>, use the Adobe FDK to compile OpenType fonts. The fact that FL4 lets you test the feature code visually without having to export the font saves tremendous time, and makes the price tag easily worth it. But you have to be willing to learn and use the FDK's feature description language, which looks vaguely like Perl. And for now, you have to settle for working on a Windows machine. <br> <br>(PLUG) If you want to build OpenType fonts but find the learning curve or Windows requirement prohibitive, you can certainly hire me to do it for you. :-) If interested, contact me off-list.</p>"
