    html: <p> If indeed the italic is your own idea and it is the roman that is only 'ostensibly of Dwiggins and Ruzicka', then you must have Dwiggins' spirit floating around feeding you ideas. :| The italic looks much better at smaller sizes, although it would be interesting to be able to use at display sizes. perhaps you create two versions? I have to agree that some of the characters are odd, but again these odd characteristics hide themselves at text sizes. But that makes sense because Dwiggins' designed for text. So I assume you are following along with the same idea of using the roman capitals with the lowercase italic? Or are you still working on the uppercase? I'd be very interested to see these when completed. (I did read what you just wrote, so I guess we will wait.) If it is a transitional, you still have too much of the rigid scotch showing, I'd try to apply a little more pen to it. <br> <br>the lc 'g' looks to be falling backward, and the upper-story is perhaps too small for how large the x-height appears in the other characters. the alternate lc 'r' calls too much attention to itself. the lc 'u' is too open. the lc 'a' is a bit too wide. i prefer the open lc 'k'. there is something fun and clever about the second (from the left) of the three lc 'x'.  <br> <br>How about a paragraph setting? And perhaps you need to refer back to your McGrew under the Arcadia and Charter. </p>
