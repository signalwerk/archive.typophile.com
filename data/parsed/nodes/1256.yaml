    html: <p> I don't have much to say as to the historical nature of this face, but I can look at it freshly with eyes accustomed to purusing 'techno album covers'. <br> <br>I don't think you should round out the italic. It is the squarish roughness that gives it its charm, in my oppinion. Perhaps, as you say the c, o etc. are extreme, but the h,n,m are also pretty square. I wouldn't sacrifice the blocky energy for the sake of the roman. As for the roman, I would take some cues from the italic. While the g is a little wobbly, it seems to correlate most closely, because it's wholely organic. I think loosening up some of the rigid, compass like circles would tie the roman to the italic without having to 'eliptify' it. While the roman isn't as dazzling as the italic, it certainly has promise (the lc k is great, among other things). <br> <br>Question for John (Butler)... you mentioned the extended abilities of OpenType for ligutures. Where can I find information on how to create open-type fonts? What kind of software do you use, etc.? </p>
