    html: <p> Kent -- The proof is obviously pre-release as it isn't the  <br>line setting. In the listing I have (just found) the 'fhlm'  <br>proof is from '37 and it was completed (last worked upon)  <br>in '43. I hope you don't think I meant to say the proofs  <br>were dated later, because they are not. --- And it wasn't  <br>completed because Linotype, at that time, was not in a  <br>position, financially due to the war, to create what  <br>Griffiths called "advertisement" types. </p>
