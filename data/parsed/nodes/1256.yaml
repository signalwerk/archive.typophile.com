    html: "<p> John, I think your self-doubt concerning the letterform integrity of this design well-placed: I have to frankly state my opinion that many of the glyphs need more than a little polish...  :-/ <br> <br>However, it has the right kind of originality at its core (unlike 90% of contemporary fonts, which either lick the boots of precedent, or overdose on their own ego), and seems to exhibit a wonderful, non-cloying nostalgia, while remaining a viable text face. <br> <br>Also, there is greatness in the italic, and not just for stand-alone use: I think it [will] integrate superbly with the roman. It's modest slant and potentially too-close color, proportions, etc. are handily overcome by that wonderful texture. If the similarity to the work of Dwiggins is coincidental (and I don't doubt it), then I think you've chosen the right field to work in, dude! That's a textbook omen, right there. <br> <br>As for the issue of display-versus-text, I think in both the roman and the italic you've struck it just right: details that give interest at the \"contemplative reading\" level, but fade into the functional whole at immersive reading sizes. <br> <br>So I'd say look forward to a lot of arduous refinement, concluding with a wonderful, usable design in the end! <br> <br>hhp </p>"
