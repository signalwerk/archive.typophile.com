    html: "<p> Tiffany: Thanks for the encouragement. To answer some of your questions: Yes, it's only a text design. I might make a display version some day, but I expect this one to be used at around 13pt or less. <br> <br>Understand I'm not explicitly shooting for a Dwiggins look. That was just a starting-off point. I sat down in front of the screen and drew these from the top of my head with no reference material. I wanted (among other things) to see what my conception of a transitional font would end up looking like. It grew out of some exercises I was forcing myself to do at the time, like staring at an arbitrary font specimen, say Palatino, and then sitting down and trying to draw it from memory. Inevitably you will introduce new elements or variations that are products of your own mind. In the end, I don't know how useful these kinds of exercises are, but I guess I'll find out once I finish this! :-) I've accepted the possibility that this might not end with anything anyone would want to buy, but since I have no formal instruction in type design, exercises like this are all I can think of to get proficient at it. (Apart from calligraphy exercises, which unfortunately are not an option until the nerve damage from my recent hand injury heals further.) <br> <br>John: I'm glad you like the half-r. It was actually once a somewhat common character, used contextually like a long s, but more common in blackletter than Roman. There were, however, a few Roman types that included it, even if it was seldom used. I'd encourage anyone to include a half-r in any fonts where they include the long s and its associated ligatures. The font will be OpenType-only, and the half-r only gets substituted when there's an r next to a round-right-side letter (b,o,p) when Contextual Alternates is turned on.  <br> <br>And yes, Tiffany is right, the thing is not in common use and calls attention to itself, so I've put it into the Contextual Alternates feature. I'd put it in HIST as well, but InDesign doesn't currently support HIST. (Grrr.) Lots of the unconventional ligatures and alternates you see in the showing will definitely not be the defaults, if they even make it through at all. <br> <br>The italic will have at least two sets of capitals: an upright set and a slanted set. There will probably also be swashes further down the road, but I want a good base design that can stand on its own before I froof it up with swashes. But when the froofing does begin, it will arrive with a vengeance. <br> <br>I'll post some more specimens when I iron out the most pressing problems in the lowercase. Those s's are fired. My one big worry is that the Roman and the italic won't look good together. I've taken care to keep the minimum and maximum stroke weights consistent, as well as x-height, ascenders, descenders, cap height, and serifs, but I worry that the italic is too superelliptical compared to the Roman, and I really don't want to embark on a superelliptical Roman just now. So the round italic letters will likely get rounder. </p>"
