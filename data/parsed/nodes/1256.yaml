  html: "<p><!---Attachment: butlerantiqua.gif-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"image/gif\">Butler Antiqua lowercase<br><a href=\"http://www.typophile.com/forums/messages/29/butlerantiqua.gif\"><b>butlerantiqua.gif</b></a> (31 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>The working title is Butler Antiqua. The roman is a transitional ostensibly in the tradition of Ruzicka and Dwiggins. The italic, which I'm happier with, is based on one of my own ideas from a few years back, for better or worse one of my best ideas. There are several problematic glyphs in the roman, particularly the s. Some of the alternates are silly. The half-r might not make it in the final cut. I want to iron out the problems in the lowercase before I embark on the caps. <br> <br>The italic round letters (c e o &amp; s) might be too superelliptical and end up being trashed. S's, as you can see, are a pain for me. <br> <br>I'd love to hear some comments. This started out as an exercise in drawing in FontLab. I'm now comfortable drawing in it, so I achieved that goal. I want to move on now and eventually build it into something commercially viable. The italics are IMHO unique, but outside of the quirky alternates (which serious printers would likely find more irritating than useful) the Roman just seems to lack any compelling originality. But I'm a pessimist and hoping to hear a second opinion. :-)<!--!-/attachment-!--><!--!-attachment:--><p></p>"
  html_clean: "<p><!---Attachment: butlerantiqua.gif-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"image/gif\">Butler Antiqua lowercase<br><a href=\"http://www.typophile.com/forums/messages/29/butlerantiqua.gif\" class=\"link-lost\"><b>butlerantiqua.gif</b></a> (31 k)</td></tr></tbody></table></center><!---/Attachment-!--> <br> <br>The working title is Butler Antiqua. The roman is a transitional ostensibly in the tradition of Ruzicka and Dwiggins. The italic, which I'm happier with, is based on one of my own ideas from a few years back, for better or worse one of my best ideas. There are several problematic glyphs in the roman, particularly the s. Some of the alternates are silly. The half-r might not make it in the final cut. I want to iron out the problems in the lowercase before I embark on the caps. <br> <br>The italic round letters (c e o &amp; s) might be too superelliptical and end up being trashed. S's, as you can see, are a pain for me. <br> <br>I'd love to hear some comments. This started out as an exercise in drawing in FontLab. I'm now comfortable drawing in it, so I achieved that goal. I want to move on now and eventually build it into something commercially viable. The italics are IMHO unique, but outside of the quirky alternates (which serious printers would likely find more irritating than useful) the Roman just seems to lack any compelling originality. But I'm a pessimist and hoping to hear a second opinion. :-)<!--!-/attachment-!--><!--!-attachment:--><p></p>"
