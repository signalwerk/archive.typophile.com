    html: "<p>John -- As long as you do give Dwiggins credit and it <br>does become your own design, I don't think there  <br>should be any problems. Especially since you have <br>mentioned this is simply an exercise in learning and  <br>not something to be released. Understand I am not  <br>trying to come across as some historical curmudgeon --  <br>although some who know might disagree. I've taken  <br>the liberty of putting together some bits that you might  <br>find interesting. These are images used in my dissertation.  <br>The two line setting are from Mac McGrew's book  <br>(&lt;http://www.oakknoll.com/&gt;)  and the bottom bit is a  <br>scan from one of the smoke proofs (that is what I think,  <br>can't find my notes on it). <br> <br><!---Attachment: arccha.gif-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"image/gif\">arccha.gif<br><a href=\"http://www.typophile.com/forums/messages/29/arccha.gif\"><b>arccha.gif</b></a> (67 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
