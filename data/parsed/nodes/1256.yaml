    html: <p>John, I think your last statement is an accurate assessment. Some of the similarities between your italic and Dwiggins's Charter experiment are uncanny, but I don't think that your design is dangerously derivative. However, you will want to keep working on both the italic and the roman to get them up to a serious, saleable quality, as you recognize. <br> <br>When I first looked at your sample, I found the italic eerily familiar, but it wasn't Charter that I thought of. I immediately thought of a few letters in Bernhard's Tango. I could also swear that I've seen something similar in some of Ruzicka's experiments, but I couldn't find what I was thinking of in my collection. The roman, for some reason, reminds me a little of Bob Aufuldish's New Clear Era. I point these out not as accusations of derivation but in the hopes of finding examples that might help you find your own voice. <br> <br>BTW, Tiffany, I'm pretty sure the second Charter example you show (the one from the smoke proofs) is a "pre-release" version. When I look closely at the final cut (as shown in the [original] Typophiles' <i>Postscripts</i>) the low branching is not quite that open. I think Dwiggins must have modified his approach for the "final" cut. I've always admired this experiment and think it's a shame that he didn't finish out the capitals. <br> <br>-- K.</p>
