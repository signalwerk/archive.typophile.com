    html: <p> OK, I've definitely never seen that italic that you post. Up until now, all I've known from Dwiggins is Electra, Caledonia and Metro, plus that famous title page he did in his letter to Ruzicka. The italic I drew was totally mine. This is a weird coincidence. It was the roman that I thought would be closer to Dwiggins. The lowercase roman n and derived letters reminded me of Electra, so that's where I thought the Dwiggins influence came in. <br> <br>But now I'm worried. I said that this *started off* as an exercise in learning, but I'm really hoping to release it in the end, because only when I start selling type will I be able to finally call myself a type designer. And I do want to release something that's historically informed, as opposed to Yet Another Abstract Design For Techno Album Covers. Dwiggins and Ruzicka were also not the only designers whose faces I stared at. There was also Baskerville, Walbaum, Fournier, Bodoni, Didot... all the definitive classics, and even Bernhard Modern and Lucian. Then, like I said, I sat down and drew the roman, and paired it with the italic that I already had sitting around in my brain. So the idea that this design would be too derivative did not cross my mind, and I'm still nowhere near convinced that that will be a problem. Every designer today that releases text faces with any degree of classic feel will agree that there are some historical nods in there, but that doesn't make it excessively derivative. So think of it as something I intend to sell eventually. <br> <br>So being dangerously derivative is not what I'm worried about. I'm worried about it looking like crap, which in its present state, it does. </p>
