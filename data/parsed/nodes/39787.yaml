  html: |-
    <p>Very characteristic drawings, I like the way the face is a central element in all the drawings. 'Cause when you think about it you always look a person straight in the eyes to check them out, right? Even shy people hiding in the back of the bus ;) </p>
    <p>And in animated movies, it's always so hard to capture the soul through the eyes, but when drawing with the face as a central element, you might have a better chance…? </p>
