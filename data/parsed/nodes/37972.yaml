      <p>I don't have an exact match (this probably started as a conventional serif and then was heavily customized), but these might interest you:</p>
      <p>Patzcuaro, from Storm Type<br>
      <a href="http://stormtype.com/typefaces-fonts-shop/families-34-patzcuaro" title="http://stormtype.com/typefaces-fonts-shop/families-34-patzcuaro">http://stormtype.com/typefaces-fonts-shop/families-34-patzcuaro</a></p>
      <p>Merlin, from Shinntype<br>
      <a href="http://www.shinntype.com/merlin.html" title="http://www.shinntype.com/merlin.html">http://www.shinntype.com/merlin.html</a></p>
