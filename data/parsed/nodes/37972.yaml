      <p>I don't know about your sample, but since you were in Salamanca you probably had the chance of seeing the awesome Universitas Studii Salamantini designed by Typerware (Andreu Balius and Joan Carles Casasin) specially for the Universidad de Salamanca.<br>
      There is a very interesting article (sorry, just spanish) about the whole thing in <a href="http://www.andreubalius.com/andreubalius/type02_universitas.html" rel="nofollow">Andreu Balius site</a>, don't miss the last link at the bottom of the page for more information.<br>
      I don't believe it is available for purchase though.</p>
