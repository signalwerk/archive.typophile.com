    html: <p>Thanks Ignacio and marcox.  While I was over there I did see the Salamantini type, but I thought it was just a ancient font from the Universidad.  Glad I now know where it really comes from! As for my website I decided to go with Patzcuaro.  Thanks again for all your help.</p>
