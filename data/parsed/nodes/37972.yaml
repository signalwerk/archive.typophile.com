    <p>Hey everyone,</p>
    <p>While I was studying over in Salamanca, Spain I noticed a very neat font used on all of their publications.  I searched for it on the internet and still have not found it. I am designing a website for a web design class and would love to incorporate it in my layout.   Any information on the name and where I could obtain it would be much appreciated.</p>
    <p>Thanks</p>
