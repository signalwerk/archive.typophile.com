    html: |-
      <p>I left the attachment at the original large scale.<br>
      The curve back on the ascender is a feature found, in modified form, on the _h_ for Troubadour <a href="http://www.myfonts.com/fonts/rmu/troubadour-pro/" title="http://www.myfonts.com/fonts/rmu/troubadour-pro/">http://www.myfonts.com/fonts/rmu/troubadour-pro/</a> and Wagner Script <a href="http://www.myfonts.com/fonts/canadatype/wagner-script/" title="http://www.myfonts.com/fonts/canadatype/wagner-script/">http://www.myfonts.com/fonts/canadatype/wagner-script/</a> but "Grossdeutschland" is a much more cursive script. Troubadour dates from 1926 (Wagner &amp; Schmidt). Some variations: Butterfly (Schriftguss), Donatello (Nebiolo), Hertha (Berling) [Info. from Jaspert's _Type Encyclopedia_.]<br>
      Any suggestions?<br>
      Don</p>
