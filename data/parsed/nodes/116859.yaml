    <p>Found the word _Grossdeutschland_ on the cover of a Military history of a German WWII army unit.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GrossdeutschlandSM_6504.jpg"></div><br>
    It might be taken from a uniform wordmark armband. As such, it's lettering. But is there a font similar to the lettering?<br>
    Thanks.<br>
    Don<br>
    p.s. I replaced the image with a smaller one to make it easier to follow the script<p></p>
