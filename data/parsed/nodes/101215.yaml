      <p>A bowl with 2 fish (symbolizing life) is the Herald of Hope + New Beginning to those who celebrate the first day of Spring (last day of Winter) as the beginning of a new year.</p>
      <p>By typographically translating (Happy + Prosperous 1392) into the bowl-shaped letter Qaf and its 2 fish-like dots, MaryamSoft.com is encouraging Font Lovers to get Qalambartar before its price goes higher 2 weeks after 01.01.1392 (Wednesday March 20th).</p>
