    <p>Netherlands based type designer for <a href="/wiki/Monotype%20Imaging%20Inc." class="freelinking" rel="nofollow">Monotype Imaging Inc.</a></p>
    <p>Born 1959 in Rijswijk, the Netherlands<br>
    Bosma studied at the Royal Academy of Art in The Hague under Gerrit Noordzij</p>
    <p>Bosma's type designs include: Forlane and Cambria</p>
