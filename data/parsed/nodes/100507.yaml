      <p>Steve, thanks for posting this.</p>
      <p>Questioning the quality of resolution and color on a typographic forum is not bitching.<br>
      400 dpi is not high resolution for type.<br>
      I always like to see the impression that metal type makes, and the ink gain, and can never get enough res.<br>
      One doesn’t have to be a “literal revivalist” to want that.</p>
      <p>Of course, it would be too many megabites <em>now</em> to scan the whole catalog at “super high res”, but if the internet is to present a simulacrum of the real object, some artefacts must be shown, say a few pages, in higher resolution, and perhaps in oblique views revealing depth, or even in 3D.</p>
      <p>One day, thanks to Moore’s Law, this sort of zoom in will be possible:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/A_foot_4119.jpg"></div><br>
      (This image from a $50, 10mp camera.)<p></p>
      <p>As an aside, scanning a 35 mm color slide on a transparency scanner ($150 scanner, 9600 dpi), you can get down to the ﬁlm grain. Accordingly, I calculate the 35 mm recorded image as around 15 megapixels.</p>
