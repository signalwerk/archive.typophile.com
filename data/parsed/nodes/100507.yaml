      <p>Well, if one is using a camera, one can control its distance from the source material. As well, while sensors have a fixed spacing, the time intervals between when they are read during scanning can sometimes be controlled flexibly, giving one near-unlimited choice of resolution in one direction.</p>
      <p>As it happens, 0.0081734 mm, or 1/3107.6 of an inch, is very nearly exactly 1/43 of a point and 1/46 of a Didot point, making it a nearly ideal standard scanning resolution for both Continental and British/American type specimen books both.</p>
      <p>Neglecting, of course, effects due to changes in the size of the paper due to humidity and suchlike...</p>
