      <p>@John: <em>I still think that someone interested in performing a type revival would have the data he needs from the specimen book as it is provided, even if it will mean a little more work.</em></p>
      <p>I used a 10× loupe on 10 pt. type when I was working on my Scotch Modern revival.<br>
      I needed to look that closely, because I was trying to make a font that would create a facsimile, with today’s high-res offset lithography, of mid 19th century high-res letterpress printing. The amount of press gain is quite different now, and works differently on different parts of the letter than it did back then. I needed to see the variations in hairline and serif thicknesses in the original, closely, and how much of that was in the metal and how much the result of ink gain, in order to understand the structure and function of that type design and thus enable an accurate simulacrum.</p>
      <p>One of the things I discovered in the Scotch Modern project was that facsimile revivals, with their antiquarian ﬂavour, are an abstruse taste. Bembo has a broader appeal and usefulness than Poliphilus.</p>
      <p>So you are correct John, that there is enough information in these ATF PDFs for “a type revival”, if not for facsimile quality.</p>
