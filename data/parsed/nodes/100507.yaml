      <p>The delicate details of craftsmanship are the key to understanding letterpress.<br>
      Firstly there is the work of the punch cutter and the letter founder.<br>
      Then there is the work of the press man.<br>
      Those are connected.<br>
      One has to see how the metal bites into the paper, and how the ink is deposited.<br>
