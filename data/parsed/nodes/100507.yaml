      <p>Steve, I don’t have a copy of this particular specimen book.<br>
      This new online project is of absolutely no use to me.<br>
      And yet surely I represent the kind of person that would be interested in an historical type specimen book.<br>
      I have been all over the internet looking at scans of old typography, and there is NEVER ENOUGH RES!<br>
      I’m not satisﬁed with admiring page layouts, as a typophile—a connoisseur  of type—I want to see those delicate details of craftsmanship (both founding and printing) that Hrant refers to. That’s the <em>sine qua non</em> of letterpress.<br>
      I don’t think it’s too much to ask for bigger ﬁles—after all, people are downloading gigabytes of movies—and this is surely the trend. So I say to those altruists who scan and post, get with the tour!</p>
      <p>In the meantime, I will continue to collect original historical documents, or reference material with ultra-high resolution photographic reproductions printed by gravure, such as <em>The Art &amp; History of Books</em> by Norma Levarie:<br>
      <a href="http://www.alibris.com/booksearch.detail?invid=10024732733&amp;qwork=425630&amp;qsort=&amp;page=1" title="http://www.alibris.com/booksearch.detail?invid=10024732733&amp;qwork=425630&amp;qsort=&amp;page=1">http://www.alibris.com/booksearch.detail?invid=10024732733&amp;qwork=425630&amp;...</a><br>
      (This is the 1968 edition which I refer to, I don’t know how good the reproductions are in subsequent editions.)<br>
      Online scans have to be better than those in this book, which has the advantage of being printed on paper, the reﬂective medium of the originals, and thus has that quality of facsimile authenticity which online resources don’t have—unless one can print out a page from a digital scan at comparable resolution, but that’s a tall order.</p>
