    <p>Hello there. I am on the hunt for an essay that W.A. Dwiggins wrote about the way that commercial artists/graphic designers are treated in American society. I read it years ago, but have completely forgotten the name of the piece. Anyone have any idea what it is or where I could find it?<br>
    Thanks!!</p>
