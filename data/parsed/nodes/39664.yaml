    html: |-
      <p>I believe the piece you are looking for is "A Technique for Dealing with Artists." It's a little bit tongue-in-cheek, in a Jonathan Swift sort of way.</p>
      <p>The original article was published in 1941 by the Press of the Woolly Whale. It's since been republished in a number of places. One is the 1947 Typophile Chapbook XVII -- <cite>MSS. by WAD</cite>.</p>
      <p>It looks like it's also included in the more recent <cite>Looking Closer 3: Classic Writings on Graphic Design,</cite> from Allworth Press.</p>
      <p>I hope this helps.</p>
      <p>-- K.</p>
