    <p>Hi,<br>
    I’m looking for the font in which the titles of “Il Sole 24 Ore” newspaper are set in.<br>
    Here are some examples:</p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font01low_4094.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font02low_4500.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font03low_6429.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font4low_3874.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font05low_6079.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font06low_4905.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080828032001im_/http://www.typophile.com/files/font07low_6331.jpg"></div><p></p>
    <p>The newspaper has been redesigned by <a class="freelinking-external" href="https://web.archive.org/web/20080828032001/http://www.cases-assoc.com/">Cases i Associats</a> not so long ago.</p>
    <p>Feel free to ask for more letters if needed, I’ll post other scans.</p>
    <p>Good search,<br>
    bye</p>
