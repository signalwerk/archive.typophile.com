      <p>Super, Nick. All of this professional insight is very helpful. Being that I like working with my hands so much and that I am growing increasingly sick of my illuminated screen of a desk AND that I'd rather be outside today (and almost every day!), maybe I should focus on becoming a farmer. Kidding, mostly...just like my comment about giving professional hand letterers some competition...you all knew there was a chuckle attached to that, right?</p>
      <p>And Mark, thanks for all the links. Typophile is a great resource.</p>
      <p>Here's a link to some <a class="freelinking external" href="http://www.heavydutypress.com/services/for_Hire" rel="nofollow">samples of my work</a>. I try to make it a point to tug on vector handles of outlined type when and where I can, as you mentioned, Nick. It's admittedly primitive and not too slick, but I like it for what it is, and I like to think I specialize in cranking out half-way decent stuff for average folks who don't have a lot of money...which is just about everyone where I live!</p>
