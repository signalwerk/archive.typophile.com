      <p>Koppa, you said, "<cite>And if I understand your commentary correctly, Mr. Shinn, few ADs will go the hand lettering route these days because it’s too expensive and too unpredictable, and any impact to be gained through the unique, human element of hand drawn lettering is just not enough to make it a regular consideration.</cite>"</p>
      <p>I think the answer is probably more generational - the people that hire for hand lettering learned in an era where you select the typeface from the list on your computer.  Signs have gone vinyl for convenience and cost.  Ads and other publishing have gone digital.  Finding someone to do competent hand lettering got difficult years ago, and people stopped looking.</p>
      <p>There are a few cases where new fonts are designed, and new designers are earning reputations, but for the most part the world changed.  The craftsmen are competing with MS Word and The Font Thing - and the amateurs and young designers don't understand the difference.  </p>
      <p>I think the issue is less the actual difference in cost or convenience, than AD's being unfamiliar with when hand lettering is appropriate or even available.  "The tool defines the task" sort of thing, once a publisher gets out of the habit of hand lettering.</p>
