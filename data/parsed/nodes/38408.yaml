      <p>Yeah, I had the same experience. I hated doing marker comp layouts. I had to lay out a whole catalog that way once. Page after page of sketching photos and greeked type blocks with markers. I still have a set of AD markers I used to use for comp layouts. Some of them still work. </p>
      <p>When I started out, I sometimes put type specimen sheets into a Lucy (a kind of overhead opaque projector that could reduce and enlarge things) in order to accurately trace letters onto a layout. Somebody I knew worked at a place were they let them use Letraset type and dummy text in their comps. Then they would send that to the typesetter to match. I was astounded (it was expensive) and jealous.</p>
      <p>Around 1980, I worked at a magazine where we had access to a photocopy machine that could enlarge and reduce. That changed everything (until desktop publishing).</p>
