      <p><em>The growing flexibility of type in the post-metal world (phototype and digital type) is what killed hand lettering</em></p>
      <p>Right. The phototypositor simplified art direction and empowered art directors by giving them a system for specifying headlines which produced inexpensive results within predictable horizons of expectation, but with enough complexity to enrich the product. As an AD, I worked with lettering artists occasionally, and it could be fantastic, but it was always expensive, and you never knew quite what you'd be getting, so headlines set by a type-house was the advertising agency norm. </p>
      <p>An AD could do a rough comp (comprehensive layout), and everyone involved -- creative director, account executive, client, photographer, type house -- knew how the end result should turn out. At the same time, there was room to exercise typographic nuance, by spec'ing type style, size, letterspacing and leading precisely, even horizontal scaling.</p>
      <p>I worked like that during the late 1970s through the '80s. For some reason, I only kept one example of my work which shows the process, and as fate would have it, the typeface is Helvetica.</p>
      <p>This ad from the early '80s was 15-20 years after the demise of widespread hand-lettering of headlines, and represented a regime that lasted, say, from around 1960 to around 1990. </p>
      <p>I wonder if my perspective is typical. Anybody?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Perma-LocA_4331.jpg"></div><br>
      .<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Perma-LocB_3477.jpg"></div><p></p>
