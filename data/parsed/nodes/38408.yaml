      <p>The growing flexibility of type in the post-metal world (phototype and digital type) is what killed hand lettering as a mainstream graphic art. Lettering stepped in where type could not. Now type can be used for practically anything, including personal correspondence. </p>
      <p>The only reason anyone hires a lettering artist anymore is when they are going for a very hand-made look or trying to recreate the look of classic hand lettering. </p>
      <p>There are still a few who can and do do it (me for one), but it's a very tiny niche. On the bright side, digital tools have made have made hand lettering easier to produce. I don't miss ink, white-out, or razor blades.</p>
