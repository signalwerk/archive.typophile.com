      <p>Well, if you are going to resurrect an old thread,</p>
      <p>This really hits close to my heart. I am 32 years old, and I still use a paper calendar, take paper notes, and even perform the occasional pencil-and-paper calculation. I have developed a style of handwriting for numerals which is almost like a typeface, and I use it together with similarly-styled caps. (My lowercase, though, is another matter.)</p>
      <p>For some reason, when people see this special style of handwriting, they say that it is very neat. One even told me he would like to see it as a typeface. To me, though, it is just a utilitarian style of handwriting I use so that others and myself can read what I wrote.</p>
