      <p><em>...few ADs will go the hand lettering route these days because...</em></p>
      <p>...because it wouldn't mean anything.<br>
      99 times out of 100 when typographers use a "hand-written" script, it's typeset, and there is often the illogical occurence of two rough-looking letters side by side that are identical. But nobody notices the absurdity, within the ecosystem of designer--supplier--client--consumer. Such critical awareness and appraisal has generally vanished from the culture of commercial production, where I suggest it evolved related closely to the practice of "comping" with rough sketches, which required a keen eye for the relationship between sketched and finished art, from those involved in the production process, whether client or supplier. Now concept artwork looks as slick as finished art (as Mark notes, the photocopier made its contribution). </p>
      <p><em>unique, human element of hand drawn lettering</em></p>
      <p>Is that really the issue? You may be refering to "natural" media, as opposed to digital media.<br>
      Natural media, and the quality of capturing a critical live performance with pen/brush and ink, with its extemporization, idiosyncracies and accidents. But even there, few of those pieces are left in their raw state. It's not a black/white distinction, as drawing and vector-adjusting handwork are an integral part of digital glyph-making in almost all fonts. It wasn't always that way -- once, letters were mainly written or punchcut. Drawing, i.e. taking a line from point A to point B, is an integral part of digital letter-making.</p>
      <p>It matters little now whether a piece of what looks like hand lettering is:<br>
      1) natural media scanned and bitmapped<br>
      2) natural media scanned, (auto-) traced to vectors and modified<br>
      3) original digital artwork drawn in Photoshop<br>
      4) original vector artwork drawn in Illustrator<br>
      5) combination of above<br>
      6) digital artwork made from plain "script" fonts with vector-drawn glyphs, not outlined<br>
      7) digital artwork made from OpenType "script" fonts with vector-drawn glyphs, and contextual alternates<br>
      8) vector artwork built on 7 or 8, then modified by further drawing in Illustrator/Photoshop</p>
      <p>Professional lettering artists, not to mention type designers, use many of these techniques--mixed media.</p>
