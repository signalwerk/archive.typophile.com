    <p>Can't remember what typographer said it, but he said, about drawing letters, "I think of a letter and then I draw a line around it." I told that to my 4 1/2 year-old the other night at the table, and now she's drawing really nice outlines of uppercase A's.</p>
    <p>This reminds me how much I like to draw letters...and always have. Can anyone direct me to some web sites featuring "hand lettering service for the graphic arts" so that I can begin formulating a plan to give them some competition?</p>
    <p>Relatedly, I am saddened to see so many posts asking, "What font is this?" As if all anybody does is "choose a font" anymore. I think it sucks that we don't see nearly as much hand lettering in advertising and in logos, etc. as we used to (open any magazine from 1950). The current and future generations are already brainwashed to believe that the best letters are created by choosing a font on their computer. I used to teach jr. high English...the kids' penmanship, most of it, was terrible. The consensus was, "Why should I know how to write cursive when the computer makes letters so much better than I can?"</p>
    <p>What font is "Coca-Cola"?</p>
    <p>Please cheer me up with examples of hand lettering in the modern world of graphic art. I want to be proven wrong.</p>
