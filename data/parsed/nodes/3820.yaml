  html: "<p>I need a text file of all the characters in a generic 256 character typeface.  <br> <br>something to the likes of this: <br><a href=\"http://www.adobe.com/type/browser/gifs/HLNQ/C_HLNQ-10055000.GIF\" target=\"_top\">http://www.adobe.com/type/browser/gifs/HLNQ/C_HLNQ-10055000.GIF</a> <br> <br>I'm not even sure how to get some characters with my keyboard. i actually had such a text file at one point before i had a massive hard drive problem. anyway, something like this would be greatly appreciated.</p>"
