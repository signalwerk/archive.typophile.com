  html: <p> Hello <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>I saw a show last night called 'OPERATION SANDMAN' on UPN.  <br> <br>A font was used for a logo CE 3 in the show.  <br> <br>The font looked like a bitmap font but edges were slightly rounded (rounded squares). <br> <br>I have a font called MOONBASEALPHA which is similar but not the same. <br> <br>Does anybody know where I could find a font or fonts like this (kind of like the 'truth' anti-smoking logo - but solid) <br> <br>commercial of freeware? <br> <br>Thx! <br> <br><img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br> <br>Glen T. </p>
