    html: <p>Glen - Here are a few rounded-square grid fonts... <br> <br>- <a href="http://www.veer.com/results.asp?Image=DET0000137" target="_blank">Mastertext</a> by Rian Hughes <br>- <a href="http://www.myfonts.com/FontFamily19425.html" target="_blank">EF SCREAM.hot</a> by Ulf C. Stein <br>- <a href="http://www.myfonts.com/FontFamily7185.html" target="_blank">SB Byte</a> by Craig Stainton <br>- <a href="http://www.thirstype.com/font_punch.html" target="_blank">Punch</a> by Rick Valicenti and Gregg Brokaw <br>- <a href="http://www.myfonts.com/FontFamily9605.html" target="_blank">SB Modem</a> by Craig Stainton <br>- <a href="http://www.interq.or.jp/ox/gau/gau_pra/font/index2.html" target="_blank">GAU Private</a> by Toshiyuki Takahashi <br>- <a href="http://www.synfonts.com/aspersion/index.html" target="_blank">Aspersion</a> by Don Synstelien <br>- <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=1013&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">DPI</a> by Jakob Straub <br>- <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=969&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">Element 15 Round</a> by Ben Husmann <br>- <a href="http://66.70.183.115/fonts/fontshow/db.cgi?db=default&amp;uid=default&amp;ID=32945&amp;ww=on&amp;view_records=View%2BRecords" target="_blank">Union Round</a> by Lewis Tsalis <br> <br>Stephen</p>
