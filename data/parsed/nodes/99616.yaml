    html: |-
      <p>Not exactly, John<br>
      That is the fact old-school forms of "Ł" "H" "Ó" (almost) disappeared*. But as "H" [hard h] changed* into [soft h], the difference between "L" and "Ł" is still great, they are two distinctive letters, no matter how negligently spoken.</p>
      <p>Exercise: chatka, chałka, halka</p>
      <p>* in the spoken language</p>
