    html: <p>Yes, the cedilla can be formed in a cursive fashion based on some kind of reversal from the terminal. However, such a cedilla should carry some of the same sense of speed and of the script style, and your cedilla shape is too slow and formal. A shape more open, like that in the Apolline example, would be appropriate.</p>
