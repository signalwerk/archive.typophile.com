    html: |-
      <p>From the Wikipedia article, apparently most of Poland doesn't need the Ł anymore; while its sound is preserved in Eastern Poland, the rest of the country just pronounces it as a W. However, in Polish, W is pronounced as V, if I remember correctly. But then, V is also pronounced as V.</p>
      <p>So Ł may be a casualty if Polish is ever subjected to orthographic reform.</p>
