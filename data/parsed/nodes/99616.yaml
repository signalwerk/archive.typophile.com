    <p>Currently working on a script font, and I've got two questions:<br>
    1. is ccedilla ever written with the cedilla as a continuation of the stroke? I'm thinking when the c doesn't connect to the next letter, as in ç’est bon<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cestfrancais_3915.JPG"></div><br>
    2. is lslash used in any languages other than Polish? and if it is, should the script form of lslash be default or language specific?<br>
    <div class="imageWrap"><img src="http://typophile.com/files/lodz_3991.JPG"></div><p></p>
