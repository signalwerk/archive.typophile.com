      <p>Craig: ‘<em>Digital typefaces: description and formats (1994)</em>’<br>
      &nbsp;<br>
      The ﬁrst edition of this book was titled <em>Digital Formats for Typefaces</em> and was published by URW Verlag in 1987. At the DTL FontMaster conference of 2009 in The Hague, Dr. Karow’s <a href="http://www.fonttools.org/downloads/TD_2009/Digital_Typography_and_AI.pdf" rel="nofollow">presentation</a> was on his <strong>highly</strong> impressive contribution to our profession. Peter Rosenfeld’s <a href="http://www.fonttools.org/downloads/TD_2009/Re-Inventing_Technology_09.pdf" rel="nofollow">presentation</a> was about the early days of digital typography and the ideas behind the IKARUS system.<br>
      &nbsp;<br>
      FEB</p>
