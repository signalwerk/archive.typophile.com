      <p>Nick: ‘<em>I am in dire need of a program to help me start and get creating.</em>’<br>
      &nbsp;<br>
      It is difﬁcult to advise in this when there is not a clear deﬁnition of what you want to achieve. What exactly is your starting point? Are these analog drawings or glyphs made in for instance Adobe Illustrator? Depending on the quality of analog drawings, manual digitizing or scanning combined with auto-tracing are the two main options. Glyphs made with Adobe Illustrator can be imported and adjusted in all available programs for type design and font production. And then, do you want to batch as much as possible, do you want to script or program this yourself, or do you want to make use of ‘prefab’ functionality? And there are other matters, such as the fact that applying tools which are commonly in use will ensure a greater support from the type community than using applications developed for niche markets.<br>
      Perhaps it makes sense to draw a block diagram in which you try to deﬁne the things you want to do and the route you have in mind for this. Such a diagram can be used as a point of reference for further advise then.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Glyphs_4991.jpg"></div><br>
      I concur with Richard and James that <em>Fontographer</em> and <em>Glyphs</em> are very suitable programs for the starting type designer. Glyphs is my personal favorite when it comes to the two new representatives in the font tools market (at DTL we will investigate the option to produce plugins for it, but ﬁrst we will ﬁnish the development of the spacing and kerning tool <em> KernMaster 2012</em> [for Mac OS X, Windows and Linux]).<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Module_overview_4573.jpg"></div><br>
      Referring to the recent developments and discussions on font tools, I want to add some comments and remarks to two aspects here, namely on the obviously increased interest in <em>modularity</em> and the growing support for the <em>UFO</em> format. After propagating modularity for more than a decade with the DTL/URW++ font tools, especially with <em>DTL FontMaster</em>, I am pleased to see that this structure is more generally accepted now than when we released FM. I recall the e-mails of potential customers who declared that they would buy FM if we would put all functionality into <strong>one</strong> program. One of my arguments for modularity was that the modules could be enhanced by the programmers without the potential risk of shuffling other functionality. I read the same argument recently in relation to one of the two newly released font tools.<br>
      &nbsp;<br>
      <div class="imageWrap"><img src="http://typophile.com/files/IKV6_5113.jpg"></div><br>
      Of course, FM was not the ﬁrst modular-based application for type design and font production, although it made modularity more easily accessible. The <em>IKARUS</em> system was designed that way from the beginning on (1970s) and besides FM we are using the IKARUS V4 program with its <strong>huge</strong> amount of very sophisticated <em>command line</em> tools for the DTL font production under X11 still.<br>
      &nbsp;<br>
      The support for the UFO format seems to be growing fast. Although I personally see no reason to trade-in the very versatile IKARUS-based ﬁle system that the DTL/URW++ font tools are using, I think that it is good for the font business when there is a common ﬁle format. So, all DTL/URW++ font tools will support the UFO format in the near future too.<br>
      &nbsp;<br>
      FEB<p></p>
