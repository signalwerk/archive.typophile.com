    <p>I am in dire need of a program to help me start and get creating. At the moment I have Fireworks, and many of the other Adobe programs, but I am sure they're effectively useless in the typography world.<br>
    What I am seeking is knowledge as to what program is most effective, I had my heart set on the program used by Matthew Carter at around the 15 minute mark in the documentary Helvetica. Whether or not this a suitable program, I am unsure but I value your opinions.<br>
    Thankyou, Nick.</p>
