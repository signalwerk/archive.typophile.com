  html: |-
    <p>I know, good fonts usually do not come cheap. But I am writing my first novel and typefaces are not something I can be spending money on because I am pretty much broke. But I might be able to get some better suggestions if I tell you that it is realistic si-fi and much of it has to do with robots. Some of the fonts I have been looking at are Perpetua and Trump Mediaeval and they are both very good, so something similar would be great.</p>
    <p>              -Thanks,<br>
                      Yamfox</p>
