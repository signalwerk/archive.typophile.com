    html: <p>I think the ligatures were an attempt to solve the problems caused by the shape of the letter f. So if your pairs "do not look that bad" without the ligature, or if the ligatures would look worse than these pairs - I wouldn't make them... Anyway, some typefaces have ligatures fi,fl, of the same width as f i, f l (so it is not a sort of design necessity but rather a nod to tradition). Some other have ligatures that look much worse (introduce much more chaos into spacing) than the components... I am always in debt, thinking of, and testing ligatures.</p>
