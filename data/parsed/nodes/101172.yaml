    <p>Hi everybody,</p>
    <p>While kerning my latest font I have noticed that some traditional ligature pairs (fi, fl, ff, and so on) do not look that bad without the ligature, so I wonder if it's always necessary to make them or not. Also, is there like a standard for defining when a ligature is necessary or not?? It may be that what looks acceptable to me may look like a total abomination to someone else, so I'd like to play safe.</p>
    <p>Thanks!</p>
