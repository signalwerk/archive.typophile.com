      <p>&gt;Well, how about all those typefaces that need REdigitizing?</p>
      <p>There is always scope to do a digital version of any metal type, with much leeway for interpretation. First, there is the question of which size(s) one uses for one’s master.<br>
      Then there is the question of “process”, or ink gain: for the model, does one take a clean piece of type (or even the designer’s drawings), or a printed image with a lot of gain — or something in between? Also to be considered: the amount of gain to be expected in printing from the digital type (if indeed print is going to be the final medium). </p>
      <p>And of course, every designer has their own personality to put into a typeface, in both their conceptual attitude, and in their feeling for form, expressed in the particular shape of curves and texture of detail. A physical signature. </p>
      <p>So it’s not really a question of faces that NEED re-digitizing, but of what fresh interpretation a type designer today can bring to bear on something from the past.</p>
      <p>Having said that, I still side with Hrant in preferring new original work, even though I am quite happy to oblige clients/customers by reworking older designs. C’est la vie.</p>
