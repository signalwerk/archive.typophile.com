    <p>i’ll be the first to admit i don’t know everything there is to know about type... but i keep finding great faces that seem to exist only in metal or are otherwise unavailable in a quality digital rendring. Just a couple:</p>
    <p><a href="/wiki/Oldrich%252BMenhart" class="wiki">Oldrich Menhart</a>’s Manuscript<br>
    <a href="/wiki/Hermann%252BZapf" class="wiki">Hermann Zapf</a>’s Civilite<br>
    <a href="/wiki/Inland%252BType%252BFoundry" class="wiki-create">Inland Type Foundry</a>’s Commercial Script</p>
    <p>I think that the Inland Script is public domain by now, but there are most likely restrictions on digitizing the other two (for commercial resale anyway). So my question is, what are some other great faces that have yet to become available generally in digital format?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/18963" class="topic-previous" title="Go to previous forum topic">‹ FontLab's PhotoFonts</a> <a href="/node/28270" class="topic-next" title="Go to next forum topic">Does anyone print? ›</a></div>
