      <p>Oh God, can one keep nothing private anymore? I suppose I must be the first to have digitized and used Luce’s ornaments (which, personally, I would loosely describe as faux gothic) and have used them for a good ten years, but I have sedulously kept them away from the eyes of known typophiles. </p>
      <p>With regard to the digization of old metal typefaces, the problem is laziness on the part of designers. What makes a metal typeface great is not the design per se, but the implementation at the various sizes. Until you are willing to restrict a metal design to one size you cannot get it to rival the printers’ work of yore. But this applies to new designs too, doesn’t it? Hence Sumner Stone’s Cycles in 7, 9, 11 points.</p>
    html_clean: |-
