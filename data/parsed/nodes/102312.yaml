  html: |-
    <p>I have seen this font (digits and math symbols only?) in a number of places having to do with Japanese abacus and mental arithmetic practice.<br>
    If you google "flash anzan" (that is, a rather intense form of mental arithmetic practice), you will likely see this font used for the numbers.<br>
    I chose this for my sample because it contains all ten digits. The character that looks like a solidus is really the digit 1 (one). I believe that commas, decimal points, and symbols for basic arithmetic exist for this font, but as far as I know, it contains no characters beyond this.</p><div class="imageWrap"><img src="http://typophile.com/files/japanese_math_font_4381.png"></div><p></p>
