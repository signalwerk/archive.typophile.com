    html: |-
      <p>As I understand it, you can set the kerning pair for apostrophe+s (or any other) and you could set pairs up for a-z+apostrophe although if you set the sidebearings well on the apostrophe you shouldn’t need to do all of them. But even so one can only do an optimum spacing for a perceived use, so a display face might be tighter than a text face, but if you use a text face at a large size you should bear that in mind.<br>
      Tim</p>
