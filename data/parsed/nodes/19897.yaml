      <p>Kerning depends on the scale that the finished object is going to be seen at, so a headline will probably need tighter kerning than body copy. At the scale it is showing on my screen I would say your “as” is okay but the apostrophe should move slightly to the right. Given the tightness of Alterations, the a’s does leap out but you shouldn’t hide the meaning just because it looks ugly.<br>
      Tim</p>
