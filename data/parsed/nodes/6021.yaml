    date_raw: null
    votes: null
    html: <p>I actually think the figures are derived from the very similar Zapf face <a href="http://www.myfonts.com/fonts/linotype/aldus/roman-small-caps-and-oldstyle-figures/testdrive.html?s=250&amp;p=72">Aldus</a>. At the junction between the straight and curved parts of the "5", the curve starts upward before it goes downward in the Palatino figures, but in the sample and Aldus, the curve just goes downward.</p>
