    html: <p>Many thanks, all! <br> <br>Obviously a newbie ? - how could one purchase, say, Aldus Roman, and still have access to the Aldus OS figures?</p>
    html_clean: <p>Many thanks, all! <br> <br>Obviously a newbie ? - how could one purchase, say, Aldus Roman, and still have access to the Aldus OS figures?</p>
  - id: 42607
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Some fonts come with OS figures built into the normal uppercase/lowercase set, but most of the ones from the giants like Adobe and Linotype have a separate small caps/OSF font for each weight that you have to buy for an extra $20. If want to recreate the logo, all you need is the small caps/OSF font ($20), but if you want the full set of roman, italic, and SC/OSF, you'll have to shell out ~$57 on MyFonts (there's also an Italic Oldstyle Figures, for an additional $20, but if you're trying to save money I wouldn't buy that unless you find yourself with a specific need for the figures in italics) <br></p>
    html_clean: <p>Some fonts come with OS figures built into the normal uppercase/lowercase set, but most of the ones from the giants like Adobe and Linotype have a separate small caps/OSF font for each weight that you have to buy for an extra $20. If want to recreate the logo, all you need is the small caps/OSF font ($20), but if you want the full set of roman, italic, and SC/OSF, you'll have to shell out ~$57 on MyFonts (there's also an Italic Oldstyle Figures, for an additional $20, but if you're trying to save money I wouldn't buy that unless you find yourself with a specific need for the figures in italics) <br></p>
