      <p>Hello there:</p>
      <p>I own Big Figgins and it has many kerning pairs. As I have used it more and more I have come to notice there is not a single curve out of place—I happen to think it’s perfectly harmonious. </p>
      <p>There are not too many Bodoni/Figgins interpretations that are as good. The only one I can think of is not released just yet:</p>
      <p><a href="http://www.christianschwartz.com/brunel.shtml" title="http://www.christianschwartz.com/brunel.shtml">http://www.christianschwartz.com/brunel.shtml</a></p>
      <p>Also here is a script I use to test the kerning in the fonts I own—here; set in Big Figgins Roman:</p>
      <p></p><div class="imageWrap"><img src="/files/figgins_4994.png"></div><p></p>
      <p>Mikey :-)</p>
