    <p>Hello. </p>
    <p>Just wondering if anyone knows of a newer / better version of Elephant / Big Figgins. I am looking for a stylized Bodoni much like it, but with nice kerning pairs, and a little bit ’updated’.</p>
    <p>Thanks.</p>
