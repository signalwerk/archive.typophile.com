  html: |-
    <p>Organon comprises two distinctive new families from type designer Nick Cooke, Organon Sans &amp; Organon Serif, released through his G-Type foundry and distributed by Fontworks UK Ltd (<a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a>).</p>
    <p>'Organon' was the name given by Aristotle’s followers, the Peripatetics, to the standard collection of his six works on logic. The order of the Organon works was deliberately chosen by Theophrastus to constitute a well-structured system. Cooke's six weight Organon Sans &amp; Serif typefaces form an in-depth type system, both components complementing eachother wonderfully to create an elegant, legible and thoughtfully designed suite of fonts. Tapered stems give the Organon OpenType fonts an attractively robust appearance.</p>
    <p>All Organon OpenType fonts contain 4 sets of numerals (lining, old-style, proportional, tabular) plus Small Caps, ligatures, discretionary ligatures and CE language support. In addition the Sans versions contain extra OT style sets with alternate lower case y, infant a, and double decker g.</p>
    <p>View both families and download a free PDF specimen here:<br>
    <a href="http://www.type.co.uk/a_to_z/id/38975" title="http://www.type.co.uk/a_to_z/id/38975">http://www.type.co.uk/a_to_z/id/38975</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Organonbanner560_3836.gif"></div><p></p>
