      <p>An experience such as Peter had designing that book for Netherlandic Press does not come along very often. Such clients are rare. Most often a publisher decides trim size and desired number of pages. Then it is up to the designer to make sure everything fits. Often by either setting things very tightly or very loosely to meet those design guides. Even presses noted for design excellence (such as Graywolf) rarely move a book beyond those bounds.</p>
      <p>Paper and presses come in standard sizes which yield a few standard book sizes. Bookstores have pretty standard size shelves, and marketing people have standard expectations about what books should look like.</p>
      <p>In the instance of the book I noted above, for which I changed the page size, that only happened because the production manager at the design shop and I were good friends with the managing editor at the publisher. We prepared estimates showing how much the oversize book would cost against the standard size, showing that there'd be little cost difference. That sealed the deal.</p>
      <p>Kudos to Netherlandic for letting the designer exercise some muscle and thought.</p>
      <p>An article about designing poetry from the Canadian magazine "Devil's Artisan" is available here:</p>
      <p><a href="http://www.sentex.net/~pql/DA.html" title="http://www.sentex.net/~pql/DA.html">http://www.sentex.net/~pql/DA.html</a></p>
      <p>you need to scroll down a ways to find the link to get the PDF.</p>
      <p>powers</p>
