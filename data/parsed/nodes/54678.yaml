      <p>I don't at all mean to be facetious, but the poetry itself is the "best reference." </p>
      <p>Long lines? Indented lines? If lines turn, will they conflict with the indented lines? But if there are also short lines, does it all get lost with too long a measure?</p>
      <p>How about titles, will they center, or look odd that way?</p>
      <p>Are there subtitles? Do some poems have a dedication?</p>
      <p>And so on. Poetry is usually graphic, so the design has to accommodate what is there.</p>
      <p>BTW the story Bringhurst told (at least, at one time), was that his start in printing came about when he was a member of a group of poets. They decided that one of them had to learn about printing, and he drew the short straw.</p>
