      <p>Hey Will, Paragraph and Charles, thanks for the tips and stories. I really appreciated.<br>
      I did not receive the poems yet, so I do not know what I'll be facing. Of course the poem itself is the best reference. I just felt like doing some "homework" before getting to it. </p>
      <p>Clarice Lispector was a big brasilian writer. (actually she was born in Russia, but moved down here pretty young). This is a letter she wrote to her linotypist at the time:</p>
      <p>"I'm sorry if I've been making too many typing mistakes. First, I burnt my right hand. Second, I really don't know why. Now, may I ask you a favor: do not correct me. Punctuation is the phrase's breath, and my phrases breath like this. If you find it weird, respect that too. Even I was obliged to get used to myself. Writing is a curse."</p>
      <p>:)</p>
