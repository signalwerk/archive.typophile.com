      <p>paragraph wrote about "respecting the poet’s intentions." Here's a tale about that.</p>
      <p>When a publisher brought me a poetry ms a few years ago, there was the instruction to "maintain all the poet's line breaks." Looking for line breaks that might give trouble, I found one really long line, too long for the publisher's requested trim. But the publisher wanted graphic proof, so I set the poem with that long line, as well as a poem made up primarily of very short lines, and showed sample pages. To fit that long line (this poem was centered; not all others were) I had to set the sample in something like 7.75/10 and take that line far too close to the bind. Then, going beyond the call of duty and budget, I redesigned the whole book for a larger trim to fit that one poem, set at a better (larger) type size. I showed both samples and the publisher chose the larger trim. I set the whole book. It was sent out to the poet in page proofs.</p>
      <p>When page proofs came back, the poet had asked for that whole damn line to be deleted. Not shortened through editing, but deleted. I got on my high horse and told the publisher the line was NOT going to be deleted. I was not going to have all my work disrespected like that. Besides, the line meant to much to the poem, at least to my reading of it.</p>
      <p>In the end we kept the long line, all the poet's other line breaks mirrored her ms, and we used the larger trim size.</p>
      <p>Sometimes a typographer knows a poet's intentions better than the poet does.</p>
      <p>powers</p>
