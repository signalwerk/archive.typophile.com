      <p>Tiffany's right: One good way to think about designing poetry books is to go to a library or a bookstore and look at lots of poetry books. See what you can figure out about the relation of the design to the actual texts. Some questions: What do you know about the poets? Do the poems demand extra special design considerations? When were the poems written? When were the books published? Who published the books? How much importance do you think the publishers place on design?</p>
      <p>It is especially helpful to look at poetry anthologies. In those you will be faced with many styles of poetry, requiring some complex design decisions.</p>
      <p>I'm not sure exactly what help the Minnesota Center for Book Arts would be, unless one were designing and printing an artist book or limited edition. But we do have presses here in Minnesota that publish poetry, often in well-designed editions: Graywolf Press, New Rivers Press, Holy Cow! Press, Milkweed Editions, Coffee House Press among them. They may be hard to find in Brazil.</p>
      <p>From one who has designed many a poetry book. have fun; good luck.</p>
      <p>powers</p>
