      <p>For an award-winning long poem by the Canadian poet John Terpstra published by the Netherlandic Press and printed by The Porcupine’s Quill, I took the approach of having the longest line determine the width of the page; the number of lines in the longest section determine the height of the book, and the number of sections determine the length of the book. I used Monotype Sabon and one of Jan Tschichold’s methods of 'non-arbitrarily’ determining the  positioning of the textblock and the margins. Furthermore, rather than clothes-lining the lines in each section from the top of the text-block, I anchored every section to the bottom of the text-block. Only one section went the distance. Because John sectioned the poem so that sometimes there was only one or two lines to the section, several pages have only a line or two, again anchored to the bottom of the text-block. In one instance a verso contains only one word and the facing recto, two.</p>
      <p>It worked wondefully. The lines appear to well up from below, and the pacing is great.</p>
      <p>I believe I was immersed in the book-design practives of the Dutch graphic designer Henk Krijger at the time. He pioneered a ‘gestural’ approach to formatting text, positioning type, especially standing heads, running heads, folios and the like as well as orchestrating pages.</p>
