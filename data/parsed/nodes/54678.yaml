      <p>I don't know of any books specifically about poetry book typography. But, I'd actually go to a bookstore and look through the poetry books. Find a few that you think have good typography and then decide what it is that makes them good. </p>
      <p>You could also find sites of book artists such as Jason DeWintz at <a href="http://www.greenboathouse.com/books/backlist/index.html" rel="nofollow">Greenboathouse Press</a> and observe what they are doing. </p>
      <p>Other than that Bringhurst is always a good start.</p>
