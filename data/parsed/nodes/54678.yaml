      <p><a href="http://www.sentex.net/~pql/DA.html" title="http://www.sentex.net/~pql/DA.html" class="link-external">http://www.sentex.net/~pql/DA.html</a></p>
      <p>you need to scroll down a ways to find the link to get the PDF.</p>
      <p>powers</p>
