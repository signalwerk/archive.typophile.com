      <p>With poetry you usually cannot take alot of liberty with regards to typographic embellishments; e.g. indents, tabs, line breaks and whatnot. Adding such things might completely alter the meaning of the poem, which isn't desirable.</p>
      <p>When I typeset poetry -- which I do quite alot -- it's usually a case of typesetting it the way the poet wrote it. I have to decide what typeface, pointsize, leading, how many empty lines between the title and the first line and between the last line and the poets name, etc. </p>
      <p>If problems arise, for example if a line doesn't fit the width of the page, care must be taken with the solution, usually by asking the poet what he thinks would be acceptable.</p>
