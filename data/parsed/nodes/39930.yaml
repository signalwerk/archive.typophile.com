  votes: null
  html: |-
    <p>hello,</p>
    <p>In expectation of <a class="freelinking external" href="http://www.kalliculator.com" rel="nofollow">KalliCulator</a> hereby another program I worked on: <a class="freelinking external" href="http://www.fontconstructor.com" rel="nofollow">Font Constructor</a>. It's a free to download! </p>
    <p>This project started as an tool to explain construction of an alphabet to students. Font Constructor is not only ment for students. The application can be used by graphic designers, typedesigners or be anybody who has fun with it.</p>
    <p>You can:<br>
    import/export UFO's<br>
    export OTF's (be aware, very rough: no hinting, no kerning, no features)<br>
    copy paste from Illustrator or Fontlab<br>
    it has a small vector editor inside. </p>
    <p>More info about the application is available on the <a class="freelinking external" href="http://www.fontconstructor.com" rel="nofollow">Font Constructor</a> website.<br>
    There is also some basic <a class="freelinking external" href="http://www.fontconstructor.com/documentation/index.html" rel="nofollow">documentation</a> online.<br>
    You can also join the Font Constructor <a class="freelinking external" href="http://groups.google.com/group/fontcontructor" rel="nofollow">mailing list / group</a> if you want to be informed.</p>
    <p>enjoy it</p>
    <p>greetings<br>
    Frederik Berlaen<br>
    <a class="freelinking external" href="http://www.typemytype.com" rel="nofollow">typemytype</a></p>
