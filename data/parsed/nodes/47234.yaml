      <p>Don't know anyone. but this is a handy resource for finding calligraphers. </p>
      <p>I think you might want to ask them to try and replicate a sample first as a lot of calligraphers tend to just do standard calligraphic hands since their main work source is usually invitations, envelope addressing, etc. I've had to replicate that style a bit now and then for greeting cards, but I have to retain a higher degree of  legibility. But, unfortunately, I am quite far from Barcelona.</p>
      <p>Stephen</p>
