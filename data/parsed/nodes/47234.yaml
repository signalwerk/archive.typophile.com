    <p>Hey guys, I'm currently working on a project in which we need a calligrapher to write us a small text. The text is to written in a style somewhow similar to this one: <a href="http://www.veer.com/products/typedetail.aspx?image=PTT0000041#specimen" title="http://www.veer.com/products/typedetail.aspx?image=PTT0000041#specimen">http://www.veer.com/products/typedetail.aspx?image=PTT0000041#specimen</a></p>
    <p>If you live or work in Barcelona and you are interested on this project, please contact me via Typophile or for this e-mail: nuno AT estudipuk DOT com</p>
    <p>UPDATE-----------------------------</p>
    <p>Ok, change of plans, the number of invitations just raised to the point that it’s not possible to wright everyone’s name on the invitation so basically now anyone can help even if you’re in china.</p>
    <p>So Here is the Brief:</p>
    <p>- We need a nice text for something close to 500 characters for an invitation.<br>
    - The style of the text we need is similar to:<br>
    this one: <a href="http://www.veer.com/products/typedetail.aspx?image=PTT0000041#specimen" title="http://www.veer.com/products/typedetail.aspx?image=PTT0000041#specimen">http://www.veer.com/products/typedetail.aspx?image=PTT0000041#specimen</a><br>
    or this one: <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000104" title="http://www.veer.com/products/typedetail.aspx?image=UMT0000104">http://www.veer.com/products/typedetail.aspx?image=UMT0000104</a></p>
    <p>Basically we’re searching for the type of style of a writer from the XIX century, something that isn’t totally perfect, that is warm and human.</p>
    <p>If you want to make it an effective selection process, what I’ll need will be:</p>
    <p>- How much will you charge for this work<br>
    - 2 samples of a phrase. One with the style we are looking for, and other in case you have a style that fit’s this project and you feel more comfortable about.</p>
    <p>the sample phrase is: “Jackdaws love my big sphinx of quartz.”</p>
    <p>Send it to: nuno AT estudipuk DOT com</p>
    <p>thanks alot :)</p>
