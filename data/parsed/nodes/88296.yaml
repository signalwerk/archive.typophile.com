      <p>Nina, even the petite caps have a good difference from lowercase in Ernestine. Nice. Besides GmbH, the Italian SpA is also a possible use.</p>
      <p>Quadibloc, acronyms with plural are quite common. The SUVs example Nina used is almost global these days. In Spanish and Portuguese there are tons of these. An almost universal acronym in Spanish is BsAs, meaning Buenos Aires, a tricky one to set properly.</p>
      <p>In answer to your question <em>what are small caps for?</em>, I could add:</p>
      <p><strong>04</strong>. Set proper names. In some areas and cultures it's usual to detach with UC/SC the name of a relevant author. Indexes and bibliographical lists also adopt this with some frequency.</p>
      <p><strong>05</strong>. Achieve another level of subtitle without using bold.</p>
      <p><strong>06</strong>. Combine with oldstyle numbers in mixed expressions.</p>
      <p>About small and petite caps, two other interesting topics: <a class="freelinking external" href="http://typophile.com/node/21293" rel="nofollow">extra small caps</a> and <a class="freelinking external" href="http://typophile.com/node/40920#comment-252257" rel="nofollow">plural words</a>.</p>
