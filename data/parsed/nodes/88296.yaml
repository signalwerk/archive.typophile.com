    <p>Does anyone have experience setting Irish names in small caps? I am particularly concerned with traditional medial casing: Is it necessary to indicate this somehow? Is there a common Irish precedent?</p>
    <p>I'm tending to think it's okay to set the whole name in the same small caps, without making any distinctions.</p>
