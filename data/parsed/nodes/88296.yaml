      <p>Nina, not only Ernestine is a beautiful, well-crafted font, but the description you used to petite caps (a second, smaller set of small caps) is very good and help people to understand this still obscure resource.</p>
      <p>Hrant, I'm not sure if petite caps slight taller than x-height would produce enough distinguishability from the lowercase to easily identify a pluralized acronym. Maybe it would achieve better results in fonts with small x-height (like Mrs. Eaves) than a project like mine –where the somewhat large x-height does not let much room to play with petite height (<a class="freelinking external" href="http://www.if.pro.br/PC01.png" rel="nofollow">sample</a>).</p>
      <p>Anyway, this is a nice approach to reduce the problem of pluralized acronyms. In my professional area this is one of the worst issues as there are lots of legal acronyms and many admit plural form.</p>
