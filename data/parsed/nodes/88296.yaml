    html: |-
      <p>Pluralizing an acronym? I have <em>seen</em> acronyms typeset in small caps, but that only in British typesetting, not American.</p>
      <p>Petite caps are an interesting idea. If small caps are visibly larger than the x-height, lower case could be used when something "smaller" has to be mixed with small caps. Although I admit that might not produce the desired result. And "petite caps" are obviously to be preferred over just mixing point sizes.</p>
      <p>But the thing is, of course, that "petite caps" are <em>nonstandard</em>. So word processors wouldn't have a conventional way to handle them (as if most of them could handle small caps, of course, but they <em>should</em>).</p>
      <p>If I was doing an Irish telephone directory, of course, I wouldn't paint myself into a corner by doing the names in small caps in the first place. I'd use regular caps (in a smaller size, with leading) and then use small caps where the petite would have been used for that particular visual effect.</p>
      <p>And this suggests a thought. What are small caps <em>for</em>? If you need to mix lower-case with small caps, or petite caps with small caps, perhaps you shouldn't be using small caps in the first place. If you need the full corpus of typographical resources, use a smaller type size - that will have a matching lowercase and a matching small caps.</p>
      <p>The advantage of this is due to the fact that small caps are heavier and wider than normal caps of the same size. So a corresponding lower case would have to be wide enough to have problems, at least with some typefaces. The petite caps presumably would be just smaller, not heavier and wider still, only partaking in the heaviness and width of the small caps, so they manage well enough.</p>
      <p>This is starting to suggest, if not infinite regress, at least something daunting.</p>
      <p>Upper case.<br>
      Lower case.<br>
      Small capitals.</p>
      <p>Reduced upper case (X% of cap height, scaled down)<br>
      Reduced lower case (X% of the size of lower-case)</p>
      <p>Petite caps. (X% of small capitals, scaled down)</p>
      <p>So one can choose to use upper case, lower case, and small capitals - with petite caps used within the small capitals - <strong>or</strong> one can use upper case, lower case, and reduced upper case - with <em>both</em> petite caps and reduced lower case available for use with the reduced upper case.</p>
      <p>So "X%" would be the proportion of x-height to small cap height from this logic.</p>
      <p>And the "reduced caps" could still be somewhat heavier and wider than caps, rather than being merely scaled down - just not so much so as the regular small caps, so that a coherent lower case could accompany them.</p>
