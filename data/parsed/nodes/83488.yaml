    html: |-
      <p>I was going to say that going non-voice wouldn't make much sense, as you'd be limited to one letter at a time communication, without the ability of phonetics to create words.</p>
      <p>However, the current scientific understanding of reading is that it IS letter-driven, and there is no "word superiority effect" (see Kevin Larsen, frequent Typophiler).</p>
      <p>**</p>
      <p>The attribution of sound to shapes, be it simple alphabetic letter shape, or the more complex tonality of a type style, is not something that can be done by a self-evident generative algorithm/transform, but is something that requires a high degree of subjective interpretation.</p>
      <p>One would expect a binocular "g" to have a "busy" sound, and a serif style likewise to be busier than a sans: that in itself is an interpretation.</p>
      <p>However, if the alphabet is coded by pitch, does that mean that "g" would have the lowest note, and "l" the highest?<br>
      Or would pitch be allocated according to the frequency of letters in text? Or sequence in the alphabet? These are too language-specific, or would that just be accent? It's hard to escape the logic of phonetics as being your best bet, scientifically.</p>
      <p>Type style would seem to correspond to timbre.</p>
      <p>Certainly a low bit rate sound (eg primitive video game or 1980s drum machine) would indicate a simple techno typeface. </p>
      <p>**</p>
      <p>Fonts exist as digital data, so you should be able to try different generative models.<br>
      In the Softmachine video, Eric assigned a different note to each letter. The initial result was extremely irritating, percussively, so he ran it through a filter to end up more like a gamelan.</p>
