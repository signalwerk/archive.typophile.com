    <p>Hi.</p>
    <p>I am brand new to Typophile (thanks to @litherland!) and am here to pick people's brains on the translation of type to sound. My background is in interaction and visual communication design and I'm doing research on designing for the blind, specifically via physical interfaces using Arduino and Processing.</p>
    <p>My goal is to create an audible alphabet, if you will, translating type to sound. Is anyone aware of previous research in this area?</p>
    <p>Thanks!</p>
    <p>Callie Neylan</p>
