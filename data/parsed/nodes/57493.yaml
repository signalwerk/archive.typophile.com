      <p>I don’t think this is a font. If it is, it’s very intelligent about contextual alternates and/or ligs. Those kinds of connections don’t come easy. What you need is a lettering artist or a lot of time from a type designer. </p>
      <p>If she can give up some of the custom connections she might like <a href="http://www.fontshop.com/fonts/singles/comicraft/matinee_idol_regular/">Matinee Idol</a> or <a href="http://www.fontshop.com/fonts/downloads/type_o_tones/memimas_family/">MeMimas</a>.</p>
