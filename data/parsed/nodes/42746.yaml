      <p><cite> &gt; Hard to believe that huge news companies don’t have composition systems that include basic typography elements.</cite></p>
      <p>Not all that hard for me to believe, actually. Consider: Through much of the 20th century, the vast majority of newspapers used Linotype systems for setting their newspapers. As we all know, Linotype metal technology did not allow for kerning. Most faces included f-ligatures, but they were time-consuming to implement, so they weren't really used in newspapers. (Imagine if you had to actually type shift-option-5 every time you wanted an ﬁ ligature, instead of today's software handling it for you.) But since Linotype f's were designed not to crash, it wasn't really an issue.</p>
      <p>I can imagine a pretty straight line from that predominant newspaper technology through the development of digital pagination systems for newspapers, with the result that today there are still many such systems without the kinds of typographic niceties that we take for granted in other applications.</p>
      <p>I'm not defending, just trying to reason out an explanation.</p>
      <p>-- K.</p>
