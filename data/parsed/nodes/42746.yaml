      <p></p><div class="imageWrap"><img src="http://typophile.com/files/firefly_3544.jpg"></div><br>
      Here are some of the "no lig" types I've done for newspapers--Chicago Tribune, Globe and Mail, Daily Express (Worldwide), and Nicholas (not for a specific newspaper).<p></p>
      <p>The arm of the f has to work with the shape and position of the i (and j) and l (b, h, etc.)<br>
      It's actually not as difficult as it would be for a text type, as those have a lot of width to "f", and large features. So it's easier to tuck the ball of "f" and the dot together in display type. Nonetheless, it can sometimes be a bit of a trade-off, and I think the ball of the Chicago "f" and the ear of the Nicholas Bold "f" are a bit twee, but not hopelessly so, and they do combine neatly.</p>
      <p>Ligatures may not really be appropriate for headline type, in as much as they are too fussy for news. So they have the opposite effect to their original function at text size. Is it possible that for ordinary readers the typophile-offending example Chris posted is fine, and a ligature would be problematic?!</p>
      <p>IMO the ideal solution is a "ligature" glyph (or contextual alternates), but with non-ligating forms nuanced for good fit, but of course, that won't work with CCI just yet.</p>
    html_clean: |-
