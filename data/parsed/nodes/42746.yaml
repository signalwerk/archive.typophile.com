      <p>My thinking is that part of it is newspaper culture being accustomed to minimal typographic niceties. The other part is that the original development of pagination systems, following on what came before, probably did not put a premium on new features. There is a good chance that much of the layout infrastructure is still built upon something very close to the initial systems. The older and larger the paper, the more likely that would seem to me.</p>
      <p>Newspapers are massive undertakings, with very intricate and interdependent editorial &amp; design interfaces/workflows. I don't have first-hand experience with newspaper systems. But I would guess that implementing even very seemingly straightforward refinements might be more difficult than one might otherwise assume.</p>
      <p>-- K.</p>
