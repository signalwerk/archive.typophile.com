    <p>It is bad enough when the Classified section gets suckful H&amp;J and poor decision making in line length and leading--what can I say, there is a mortgage "crisis"--but when the the editors miss a crying need for a ligature in a story headline on page one of the Sports page, I begin to wonder where all those good typesetters I used to know have gone to retire. The Washington Post is not exactly some small town rag put together by cousin Jethro and Aunt Mae.</p>
    <p>ChrisL</p>
