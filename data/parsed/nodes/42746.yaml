      <p>A lot of the systems actually descended from pagination software that was never intended for newspapers or anything that remotely resembles fine typography. They mostly descended from the pagination software designed to layout phone books.</p>
      <p>Think about how awful it would be to paginate a phone book by hand? I get nightmares even thinking about it. </p>
      <p>So they developed the software to do it for them. That software then was picked up by newspapers originally to do classifieds. Before you know it, the entire works was dominated by the software, primarily because of a newspaper's primary source of revenue, the ads.</p>
      <p>These systems are designed for the placement of ads, keeping track of ads, and billing for ads. Typography is far, far down that list.</p>
