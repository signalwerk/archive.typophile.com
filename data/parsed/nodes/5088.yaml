    votes: null
    html: "<p>Hey, nice! \"Serious fun\" is how I'd describe it. And great modulation on the tight joins. <br> <br>UC: \"C\" might be wide; I'd raise the bar of the \"E\", and maybe make it slightly thinner; the \"F\" isn't working; killer \"K\"!; not sure about the \"Q\"; great form on the \"S\", but maybe a bit wide; \"X\" seems too strong; amazing Pilcrow; the \"N\"-tilde is too cool. <br> <br>Nums etc.: I'd make the square brackets concave; the \"1\" and \"4\" seem a bit strong; \"6\", \"8\" and \"9\" need modulation. <br> <br>lc: the \"e\" needs modulation; great \"fi\"; make the eszet sharp on the inside. <br> <br>Other: great Yen; amazing \"@\"! but make the belly-button bigger; great Section. <br> <br>Eduardo, you really have a knack for inventive shapes. Don't lose it! <br> <br>hhp <br></p>"
    html_clean: "<p>Hey, nice! \"Serious fun\" is how I'd describe it. And great modulation on the tight joins. <br> <br>UC: \"C\" might be wide; I'd raise the bar of the \"E\", and maybe make it slightly thinner; the \"F\" isn't working; killer \"K\"!; not sure about the \"Q\"; great form on the \"S\", but maybe a bit wide; \"X\" seems too strong; amazing Pilcrow; the \"N\"-tilde is too cool. <br> <br>Nums etc.: I'd make the square brackets concave; the \"1\" and \"4\" seem a bit strong; \"6\", \"8\" and \"9\" need modulation. <br> <br>lc: the \"e\" needs modulation; great \"fi\"; make the eszet sharp on the inside. <br> <br>Other: great Yen; amazing \"@\"! but make the belly-button bigger; great Section. <br> <br>Eduardo, you really have a knack for inventive shapes. Don't lose it! <br> <br>hhp <br></p>"
