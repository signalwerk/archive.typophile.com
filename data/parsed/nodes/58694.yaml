      <p>If you're ever tempted to stretch or squish a font, use the extended or condensed version instead.</p>
      <p>But the greater benefits of an expanded font family come into play when setting complicated documents, such as magazines that need various styles to distinguish photo credits, captions, pull quotes, footnotes, etc. without detracting from the body text, headlines, and subheads, etc. Each of those could be of a different size, weight, width, and even a different variant specialized for very small or large display. Maps have need of many varied type styles to distinguish different feature types too. Examine a copy of National Geographic, where you can see examples in both of these situations.</p>
