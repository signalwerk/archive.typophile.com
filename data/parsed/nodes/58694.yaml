      <p>phrostbyte64:</p>
      <p>No I know, I'm just taking in an extreme point of view to get the discussion going, but I still think the use of condensed and extended is limited. I am traditionally oriented and of course I'm not accusing anybody of the wrong use of type. I just want to make people realize that there are designers with opinions based on air and not knowledge and experience. We are working in a critical time of transition between techniques. From metal type to digital, it took almost 600 years for this to happen. The computer opened the world of design for the mass, which results in a lot of designers not being educated and capable. Keep tradition, history and most important quality alive.</p>
      <p>Thanks for discussing this,<br>
      See you around</p>
