    html: <p>I totally agree James and cfish, but I also think that condensed and extended styles are pure evil and the inbreeds of comercial typography. There so many solutions with good typefaces that have small-caps, good italics/cursives and a bold style. Maybe extended and condensed type can serve a purpose in logo-design or posters, but some typefaces like Helvetica have so many styles that you can easily end up with a circus of unclear typography. We don't need 30 styles, just several good ones.</p>
