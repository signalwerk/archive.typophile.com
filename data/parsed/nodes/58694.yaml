      <p>I don't know if it matters, but condensed and narrow versions of fonts are very important in signage. When you first set up a directory of any kind you try to plan for every contengency, start out with the normal scale, but it doesn't work all of the time. You always run into a name that will not fit but can't be shortened or made smaller. This saves you from squashing the font, which I don't allow unless otherwised ordered.</p>
