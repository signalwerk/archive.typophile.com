      <p><cite> &gt; In poetry, especially in translation, you might have a line that won’t fit on one line. [. . . ] a condensed font most of the time would help out a lot.</cite></p>
      <p>In fact, in the late 1700s, before any real concept of condensed or extended, a relatively narrow style of typefaces by Luce (and picked up also by Fournier le jeune) were known as <em>Types Poétiques</em>. (cf. Updike, Vol. I, figs 176 &amp; 183.)</p>
