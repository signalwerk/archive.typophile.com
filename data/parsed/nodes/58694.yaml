      <p>phrostbyte64:</p>
      <p>Your right about the condensed type in signage. My only point was that all those condensed and extended styles are made for offering and selling more fonts by foundries. Because these styles are easy to make by interpolation you just need to extreme designs and interpolate everything in between. In my opinion if you need a condensed face for signage that gets a lot of readable characters on one line, design one that fits that purpose. An extended or condensed Helvetica is not what the initial idea was behind the typeface just some idea from the foundry to make more money out of it. But maybe I'm to traditionally biased.</p>
