      <p>I think Condensed is far more useful than extended, for example, in the Madrid Metro, there is a limitted amount of space to use to put the name of each station.  Sadly they switch to Arial Condensed from the normal Helvetica or just squash it, but this is when a well-done condensed variant could be useful.  In poetry, especially in translation, you might have a line that won't fit on one line.  I personally think it's rather unsightly to use the open bracket + rest of the line combination right justified and a condensed font most of the time would help out a lot.</p>
      <p>That said, designing the condensed to 50% makes it obviously out of place.  Subtlety (as best possible, like the æ lig) is key.</p>
