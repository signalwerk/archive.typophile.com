    <p>(This is my humble first post on this forum. I have searched via google, this forum and the typowiki for the answer. If I have overlooked the answer I apologize, but would very much appreciate it if you could point me in the right direction.)</p>
    <p>As I understand it fonts are not generally considered copyrighted, but there names can be trademarked as a form of protection.</p>
    <p>If this is true how many or in which countries should I trademark my font?</p>
    <p>Also I have designed the font in the UK. will it be subject to copyright here? Is there any additional steps I need to take to secure copyright?</p>
