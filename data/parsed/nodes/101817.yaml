    <p>A competition</p>
    <p>…<br>
    Typophile  has launched The University of Canberra Logo Competition - an international challenge to the world’s finest logo designers to capture the style, spirit, prestige and character of The University of Canberra.</p>
    <p>The winning design, which will receive one pint of Portland's finest beer at TypeCon 2013, will be selected by a jury of distinguished Typographers and Designers.<br>
    …</p>
