    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Stefan Hattenbach</strong></p>
    <p>Stefan Hattenbach (born 1961) is an espresso-fueled art director and graphic designer specializing in type and logo solutions. </p>
    <p>After two decades in the industry, a third of that running his own studio, he has managed to keep his work strong and compelling via a dynamic balance of experimentation and traditionalism: a blend which has worked to the benefit of clients such as Greenpeace, Amnesty International, Telia, and Hennes &amp; Mauritz. </p>
    <p>He is an avid traveler with a special passion for Italy, and proudly claims A.S. Roma as his favorite soccer team. He, wife Catharina, son Victor and daughter Sarah live in a sunny flat in downtown Stockholm. </p>
    <p>Stefan's work is released under his <a href="/wiki/MAC%20Rhino" class="freelinking" rel="nofollow">MAC Rhino</a> label.</p>
