    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Stefan&nbsp;Hattenbach</strong></p>
    <p>Stefan Hattenbach (born 1961) is an espresso-fueled art director and graphic designer specializing in type and logo&nbsp;solutions. </p>
    <p>After two decades in the industry, a third of that running his own studio, he has managed to keep his work strong and compelling via a dynamic balance of experimentation and traditionalism: a blend which has worked to the benefit of clients such as Greenpeace, Amnesty International, Telia, and Hennes <span class="amp">&amp;</span>&nbsp;Mauritz. </p>
    <p>He is an avid traveler with a special passion for Italy, and proudly claims <span class="caps">A.S.</span> Roma as his favorite soccer team. He, wife Catharina, son Victor and daughter Sarah live in a sunny flat in downtown&nbsp;Stockholm. </p>
    <p>Stefan’s work is released under his <a href="/node/add/wiki?edit%5Btitle%5D=MAC%20Rhino" title="Create node &quot;MAC Rhino&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">MAC</span> Rhino</a> label.</p>
    <p><strong>External Links</strong><br><a href="http://www.macrhino.com/"><span class="caps">MAC</span> Rhino</a><br><a href="http://stewf.com/work/hattenbach/"><span class="caps">MAC</span> Rhino Type&nbsp;Specimens</a></p>
