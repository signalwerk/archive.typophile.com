      <p><cite>I read a lot of Quadraat every other week in the London Review of Books, and the long arm of the “f” frequently distracts me, as it often jumps across word spaces and collides with a following capital — a frequent occurence in book titles.,/cite&gt;</cite></p>
      <p>Yes, Quadraat is one of many typefaces that need a terminal f (f.terminal) set up in a contextual alternate so the terminal "f" is used when a word space follows. You both shorten the arm of the "f" a bit, and increase the right sidebearing. Of course, you can't do this with Quadraat ;) -- because it is a FontFont font, &amp; they forbid the end user from fixing all their errors.</p>
