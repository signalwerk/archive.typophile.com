    <p>As a sort of response to the thread about overused types, suppose we focus on things we want to see <strong>more</strong> of. The additional benefit to this is the possibility that some of the faces people mention might make good projects for students or designers. Faces not yet digitized are fair game, as well as those available digitally.</p>
    <p>I'll kick off: Albertina and Breughel.</p>
