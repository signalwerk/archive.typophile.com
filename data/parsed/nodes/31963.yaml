      <p>Bill, I bought Trinité when the exchange rate of the euro was 85-cents. I guess it is more expensive for those of us in the States now. But you get a bunch of fonts, and for the Type-1 days, they were pretty complete. Anyway, I bought Trinité because Richard Eckersley wanted to use it, and when Richard began using a font, you knew he would use it for years. A good investment.</p>
      <p>It comes with no ligatures, and no kerning. And yes, it does need an f_i and f_f_i ligature. Even the old trick of setting the dotless "i" following an "f" doesn't quite work. I doubt it is available in OpenType, but it also needs a terminal f. An f-space kern won't cut it.</p>
      <p>Back to money for a bit. If a set of fonts costs $1,000 and you use it for 10 books, that's cheap, given the "new book, new fonts" approach of too many designers. And by the way, for my money, it takes designers a while to understand how to use a font, and comps a while to learn how to set it -- but then, I'm a dinosaur.</p>
