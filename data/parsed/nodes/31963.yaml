      <p>"Microsoft is now to type was Apple was to type 2–3 decades ago."</p>
      <p>Off topic: I remain to be convinced. Maybe in future, but right now as a Mac user interested in seeing what they're doing...the website is a joke. All fonts are shown with text samples in <a class="freelinking external" href="http://www.microsoft.com/typography/fonts/family.aspx?FID=28" rel="nofollow">Cyrillic and Greek first</a> even though I'm looking at an English-language webpage! And I can <a class="freelinking external" href="http://www.microsoft.com/typography/fonts/default.aspx" rel="nofollow">only find a list of fonts</a> on Windows 8, not 8.1. Did extra new stuff arrive with 8.1? Who knows? There's <a class="freelinking external" href="http://www.google.co.uk/search?q=sitka+site%3Awww.microsoft.com%2Ftypography&amp;oq=sitka+site%3Awww.microsoft.com%2Ftypography&amp;aqs=chrome..69i57.5383j0j4&amp;sourceid=chrome&amp;es_sm=122&amp;ie=UTF-8" rel="nofollow">nothing</a> on the website explaining Sitka or how I could use its optical sizes as a consumer, either. (There's <a class="freelinking external" href="http://msdn.microsoft.com/en-us/goglobal/bb688099.aspx" rel="nofollow">a bit</a> explaining it for developers.) Was it worth commissioning a huge MM font family if nothing but IE can safely use it? Or can other applications safely use it? Is it worth the hassle for me to update to Windows 8.1 if I'm a Windows 7 user to get it? Why does <a class="freelinking external" href="http://support.microsoft.com/en-us/kb/2800393" rel="nofollow">Office 2013</a> seem to come with far fewer fonts than <a class="freelinking external" href="http://support.microsoft.com/en-us/kb/2121313" rel="nofollow">Office 2010</a>? What happens if I reinstall Windows and never install Office 2010, do my documents suddenly stop being in Garamond and start being in Calibri? Who knows? </p>
      <p>The big giveaway is that when you go to the <a class="freelinking external" href="http://www.microsoft.com/en-us/Typography/aboutfontsoverview.aspx" rel="nofollow">'overview'</a> page on fonts, it points you to an exciting list of new fonts that come with Windows 7. Check the 'last updated' date for yourself, nobody's touched it in half a decade. </p>
      <p>And Sitka is just one font. The <a class="freelinking external" href="http://www.microsoft.com/typography/fonts/product.aspx?PID=164" rel="nofollow">Windows bundled font library</a> has always been a bit rubbish, but it's really rubbish now. Meanwhile, buying a cheap Mac is effectively buying a decent starter font library and a <a class="freelinking external" href="http://www.apple.com/uk/mac/pages/" rel="nofollow">basic DTP app</a> with a computer thrown in for free.</p>
    html_clean: |-
      <p>"Microsoft is now to type was Apple was to type 2–3 decades ago."</p>
      <p>Off topic: I remain to be convinced. Maybe in future, but right now as a Mac user interested in seeing what they're doing...the website is a joke. All fonts are shown with text samples in <a class="freelinking external link-external" href="http://www.microsoft.com/typography/fonts/family.aspx?FID=28" rel="nofollow">Cyrillic and Greek first</a> even though I'm looking at an English-language webpage! And I can <a class="freelinking external link-external" href="http://www.microsoft.com/typography/fonts/default.aspx" rel="nofollow">only find a list of fonts</a> on Windows 8, not 8.1. Did extra new stuff arrive with 8.1? Who knows? There's <a class="freelinking external link-external" href="http://www.google.co.uk/search?q=sitka+site%3Awww.microsoft.com%2Ftypography&amp;oq=sitka+site%3Awww.microsoft.com%2Ftypography&amp;aqs=chrome..69i57.5383j0j4&amp;sourceid=chrome&amp;es_sm=122&amp;ie=UTF-8" rel="nofollow">nothing</a> on the website explaining Sitka or how I could use its optical sizes as a consumer, either. (There's <a class="freelinking external link-external" href="http://msdn.microsoft.com/en-us/goglobal/bb688099.aspx" rel="nofollow">a bit</a> explaining it for developers.) Was it worth commissioning a huge MM font family if nothing but IE can safely use it? Or can other applications safely use it? Is it worth the hassle for me to update to Windows 8.1 if I'm a Windows 7 user to get it? Why does <a class="freelinking external link-external" href="http://support.microsoft.com/en-us/kb/2800393" rel="nofollow">Office 2013</a> seem to come with far fewer fonts than <a class="freelinking external link-external" href="http://support.microsoft.com/en-us/kb/2121313" rel="nofollow">Office 2010</a>? What happens if I reinstall Windows and never install Office 2010, do my documents suddenly stop being in Garamond and start being in Calibri? Who knows? </p>
      <p>The big giveaway is that when you go to the <a class="freelinking external link-external" href="http://www.microsoft.com/en-us/Typography/aboutfontsoverview.aspx" rel="nofollow">'overview'</a> page on fonts, it points you to an exciting list of new fonts that come with Windows 7. Check the 'last updated' date for yourself, nobody's touched it in half a decade. </p>
      <p>And Sitka is just one font. The <a class="freelinking external link-external" href="http://www.microsoft.com/typography/fonts/product.aspx?PID=164" rel="nofollow">Windows bundled font library</a> has always been a bit rubbish, but it's really rubbish now. Meanwhile, buying a cheap Mac is effectively buying a decent starter font library and a <a class="freelinking external link-external" href="http://www.apple.com/uk/mac/pages/" rel="nofollow">basic DTP app</a> with a computer thrown in for free.</p>
