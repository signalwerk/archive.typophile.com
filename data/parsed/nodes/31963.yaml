      <p>My list of underused/underexposed types includes:</p>
      <p><a href="http://www.stonetypefoundry.com/" target="new" rel="nofollow">Cycles</a> -- Surprisingly, someone did use Cycles for the logo of Cymbalta, an antidepressant medication being advertised widely these days. But I haven't run across it many other places. I used the original release in a book several years ago and loved it. (I only wish we'd printed on a slightly softer paper.) Charles, most of the cuts in the family I have include OsF. In which size(s) are you missing them? </p>
      <p><a href="http://www.dutchtypelibrary.nl/Documenta_rdrct.html" target="new" rel="nofollow">DTL Documenta</a> -- I've only seen it once or twice here in the States.</p>
      <p><a href="http://www.houseind.com/index.php?page=showfont&amp;id=171&amp;subpage=viewfonts" target="new" rel="nofollow">Paperback</a> -- I'm surprised this hasn't been picked up on more. I found it a little dark for a book I tried it with, but I would have thought I'd see this more in advertising. I should think it's quirks would be perfect for the zeitgeist.</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/iowan-old-style/" target="new" rel="nofollow">Iowan Old Style</a> -- Another John Downer design. This used to be a workhorse and fallback for me. But I haven't seen it used much elsewhere.</p>
      <p><a href="http://www.fontshop.com/?fuseaction=catalog.fontpackage&amp;searchby=manufacturer&amp;displayfontid=FF.6180.0.0" target="new" rel="nofollow">FF Quadraat</a> -- I used to see this a little more, but it disappeared pretty quickly. I still love it's look. The one quibble I have is that there aren't kerning pairs for quotation marks with periods and commas in any combination. And so, it was a little unfortunate that Quadraat was used in the American edition of <cite>Eats, Shoots &amp; Leaves</cite> -- a book about punctuation, of all things -- and the lack of kerns didn't get addressed, which meant that there were all sorts of distracting gaps around the many quotation marks. </p>
      <p>-- K.</p>
