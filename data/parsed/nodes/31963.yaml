    html: |-
      <p>Jacques,</p>
      <p>In a lot of ways, I agree with you. One of the virtues of Trinité is that it looks quite good when set by application programs that do not support kerning or ligaturing. It is a masterful execution from that perspective. But I bought the fonts to set some books for Richard Eckersley, who also owned the fonts &amp; set some books himself. If you knew him, you know he was not satisfied with less than what <cite>could</cite> be done, and I don't think anyone would disagree that the fonts can be improved with kerning and ligatures </p>
      <p>Somewhere in all my email correspondence with Peter Noordzij, he mentioned that if I kerned it, he would like to see the result. I guess I haven't followed up on that. And I think he mentioned once that de Does had changed his mind about the need for ligatures.</p>
      <p>I don't think a properly set up font (which Trinité is) should be tracked. But if you must track it, you can always break the ligaturing.</p>
      <p>The crack about the EULA concerns the price: I asked Peter Noordzij about the extra cost for allowing full embedding of the fonts in a PDF file, which some publishers require. His response was that the number of people (computers) then involved was the whole world, and of course, that price would be astronomical – at the time I bought it, 2,000 computers would have been about 76,000 euros.</p>
      <p>So for the numerous academic publishers that have a contract with NetLibrary, which <cite>requires</cite> a PDF with full embedding, Trinité should not be used.</p>
      <p>Best,</p>
      <p>Charles</p>
