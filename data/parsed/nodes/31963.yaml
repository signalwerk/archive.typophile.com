      <p>Kent, I read a lot of Quadraat every other week in the <em>London Review of Books,</em> and the long arm of the "f" frequently distracts me, as it often jumps across word spaces and collides with a following capital -- a frequent occurence in book titles. Nonetheless, it's a great face which I really enjoy reading, but I'm glad I rarely come across it outside the LRB.</p>
      <p>Certainly, some faces are overused, but the issue is not that there are great type designs particularly scorned and overlooked in relation to their merit. I'd say that art directors should go out of their way to choose special typefaces, and make every publication as unique as possible. After all, there are gazillions of typefaces available, and, by astute typography, many more may be massaged into respectability than just adopting the aficionados' favourites.</p>
