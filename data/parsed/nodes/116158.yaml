    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Figure 21 Identity for Century_5484.jpg"></div><p></p>
    <p><a href="http://www.aiga.org/century-exhibition/" title="http://www.aiga.org/century-exhibition/">http://www.aiga.org/century-exhibition/</a> </p>
    <p>Interest in type, typefaces, typography and fonts has grown far beyond the graphic design community, yet few truly understand how and why these vital components of design are created and applied. This exhibition, organized by Monotype and designed by Pentagram for the AIGA National Design Center, celebrates 100 years of type as a constant influence in the world around us.</p>
    <p>Gathering rare and unique works from premier archives in the United States and London, Century will serve as the hub of a series of presentations, workshops and events held at the AIGA gallery as well as the Type Directors Club and the Herb Lubalin Study Center of Design and Typography at Cooper Union in New York City. The exhibition features a range of artifacts representing the evolution from typeface conception to fonts in use. Typeface production drawings by the preeminent designers of the last 100 years, proofs, type posters and announcement broadsides are supplemented by publications, advertising, ephemera and packaging.</p>
    <p>Exhibiting and event partners for the exhibition include Monotype, AIGA, Pentagram, Mohawk Paper, The Type Directors Club, Condé Nast, Hamilton Wood Type &amp; Printing Museum, The Type Archive, The Herb Lubalin Study Center at Cooper Union, Alan Kitching and The Museum of Printing.</p>
    <p>Exhibition design: Abbott Miller, Pentagram Design. </p>
    <p>See the exhibition:</p>
    <p>The exhibition is on view from May 1 at the AIGA National Design Center in New York City. The exhibition is free and open to the public. Tickets for guided tours can be booked here: <a href="http://bit.ly/AIGAreg" title="http://bit.ly/AIGAreg">http://bit.ly/AIGAreg</a></p>
    <p>Follow #Century online for previews and images from the exhibition. </p>
    <p>To see the release and sample images, please click here: <a href="http://bit.ly/1rLlBJs" title="http://bit.ly/1rLlBJs">http://bit.ly/1rLlBJs</a></p>
