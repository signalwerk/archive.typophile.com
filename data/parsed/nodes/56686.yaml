      <p>Thanks for the comments, William. The circular letter ㅇ is indeed problematic. Most of today's hangul text faces add a tiny entry stroke to the ㅇ, as in the sample of Batang below:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ieung_4019.gif"></div><p></p>
      <p>This solution isn't satisfactory for me because of the problems it causes in small sizes distinguishing between such pairs as 흥 and 훙, as shown above. Also, I would prefer my typeface to be extended to cover obsolete letters, among them ㆁ, which is a ㅇ with a small vertical stroke on top. A ㅇ with an entry stroke would be too easily confused with ㆁ.</p>
      <p>The entry stroke on the ㅇ must be a recent innovation, because I don't recall seeing a pre-20th-century hangul typeface having this feature. The following is from <em>Oryun Haengsildo</em> ('Illustrated Acts of the Five Relationships') of 1797, and shows ㅇ without any entry strokes.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/oryun_4086.gif"></div><p></p>
      <p>I think it may have been the type designer Choe Jeongho who popularized if not invented the entry stroke on the ㅇ, presumably to make it look like it was written with a brush so that it would harmonize better with the other letters. Ironically, when actually writing hangul with a brush, this entry stroke appears only in some really cursive styles.</p>
      <p>I'll have to find a way to harmonize the ㅇ with the other letters without adding an entry stroke, perhaps by making the shape slightly more irregular. Perhaps I can do something with the counter shape to suggest the movement of a brush. Making the circles a longer ellipse, while widely applied on sans-serif designs, isn't really appropriate for this style, though.</p>
