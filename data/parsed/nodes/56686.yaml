      <p>Do you think breaking the strict left-right symmetry and going for an oblique stress may be a step in the right direction? Excuse the rough curves, but here's a quick sketch, with the old shapes for comparison on the right. I've never seen this oblique stress in a hangul text face, but in a way it recalls how the circular letter is formed when writing with a brush—by making two crescent-shaped strokes.</p>
