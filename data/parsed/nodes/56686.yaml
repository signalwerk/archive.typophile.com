      <p>I know nothing about hangul script, but just looking at it as glyph design it feels to me like there's an inconsistency between the circular part and the other strokes. The others have a brush feel, and the circle does not. </p>
      <p>I just looked at the Wikipedia article on hangul, and I see that the circle comes from cursive where as the rest comes from the straight Chinese brush style. So I guess its an inherent problem getting it to look right. I see in the article that some of the circles are a longer ellipse, which looks more harmonious in the illustration in the article. </p>
      <p>I guess my feeling is that if the straight strokes look brushed--and they look lovely--then the circle should have more of that look for consistency of look.</p>
