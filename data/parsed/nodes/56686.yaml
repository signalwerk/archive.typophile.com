      <p>Yes, to my eyes, the one on the left is much better. I think it needs some more massaging, but yeah, that's it. That's what I was thinking of: the o shape should reflect the assymetry of the top down and left to right brush strokes. </p>
      <p>If it hasn't been done before, then I think you've really got an improvement. You might try experimenting with a brush, to get ideas, though the final form you'll probably end up not being strictly by the brush. </p>
      <p>Of course, I'm looking at it with eyes accustomed to looking at latin type, so you'd need to see how those accustomed to reading Hangul script react, once you're happy with it.</p>
