      <p>Hello, Jongseong.</p>
      <p>I came across this post while I was searching for a way to replace the ugly Korean system fonts installed by default in the Ubuntu Linux distribution, and found the discussions of Korean typeface on the forum very fascinating.</p>
      <p>I'm a fairly proficient non-native Korean speaker, and when I write a ㅇ (with a ball-point pen), not only is the stress obliquely centered on the upper right and lower left as you showed in your second illustration, but the ellipse itself is oriented obliquely.  I think the obliqueness of the stressed portions of your ㅇ show its connection to a brush style, and I definitely agree with your decision to remove the top entry stroke, for the reasons that you pointed out above.</p>
      <p>Have you done any more tinkering with this typeface since your last post?  I'm interested in seeing more.</p>
