    html: |-
      <p>Thanks Jeff, for that post. Sorry I didn't see it until now.</p>
      <p>I think in most examples of proficient handwriting (at least of the older generation), the ㅇ becomes an oblique ellipse as you described. Also, horizontal strokes will tend to slant upwards. This reflects writing speed. A text typeface will need to have a more static form, but just a touch of the obliqueness may make the design more lively.</p>
      <p>I'm glad you agree with dropping the top entry stroke. It's a pretty radical decision, so I would like to hear what people think about it.</p>
      <p>As you might imagine, designing a Korean typeface is a time-consuming process. As I am a beginner, I'll have to figure everything out from scratch.</p>
      <p>I posted some proofs from a couple of weeks after my original post here in <a href="http://typophile.com/node/57311" rel="nofollow">this blog post</a>. It has been worked on since, but most of the work has been on setting up scripts to generate variations of the different consonants and vowels to be composed into the syllables. It's programming work<br>
      mostly; not much I can show at this point.</p>
      <p>I'm juggling a number of different, mostly non-Korean original typeface designs in my spare time, so I'm afraid progress will be very slow.</p>
