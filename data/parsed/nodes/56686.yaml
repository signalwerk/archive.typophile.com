      <p>I think you're right that the entry stroke does not make it consistent. I see the straight strokes are brushed top to bottom, left to right, so perhaps the circle can reflect that. </p>
      <p>Giving it some kind of asymmetry and molding may work. Also it's very tricky getting the weights of everything just right. This is one of the big issues in Roman type also--getting the round and straight strokes to play with each other happily.</p>
