      <p>I grew up in <em>a</em> world where things were just things. I never thought of definite or indefinite articles, because the context of <em>a</em> thing was always clear. And then I started to learn English.<br>
      Today, me, and thousands of other younger Poles, speak "<em>this</em> water is too cold" or "take <em>any</em> pen" which are subconscious cliches of English use of "the" and "a". We have adapted <em>a</em> different point of view.</p>
