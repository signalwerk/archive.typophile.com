      <p>There was a link to the New York Times article from the original page noted, and I found that quite interesting. Old ideas about Italian being musical and German rough had much less to do with the book than the Sapir-Whorf Hypothesis.</p>
      <p>As I find it easier to keep compass points straight than left and right, which just seem so identical, I could relate to the exotic linguistic example they used for much of the article.</p>
