    html: "<p>When I started learning calligraphy, my teachers made us buy German-made Brause broad-nib pens :  we were told that they were stiffer than other brands, therefore they were easier to handle for beginners, since they move slower onto the paper. We used coarse papers for the same reason : to slow down our not-so-assured hand moves in order to control them better.</p>"
