    html: |-
      <p>If you would really like to learn the old-fashioned way, you certainly can't go wrong with some Brause or HB (Heintze &amp; Blankertz if I am remembering the spelling) dip pens and a holder from someone like Koh-i-noor. Fit yourself out with a range from 3/4 mm up to 2mm or even 5mm and go to town. These pens work really well with ink, and you can also feed gouache into them by touching the tip of a loaded brush to the edge of the reservoir. In my experience, they are in a completely different class from the Speedball nibs sold widely in the U.S. (I forgot to look to see where you are located.)</p>
      <p>Use these nibs with some quadrille paper and you can have a great time.  The quadrille paper saves the tedium of ruling guidelines and if you can find some ruled in metric, so much the better.</p>
      <p>Then pick up a nice used fountain pen with an edged nib, as long as it flows well. I struggled for years trying to get Platignum pens to work smoothly and flow-ily and never succeeded, but there are other (more expensive) brands that work very nicely. I had a Pelikan at one point with an edged nib that was pretty nice. You're right, though, about that feeling of the nib cutting into the paper. For this reason, i just use a fountain pen with a round nib and leave the edged-pen stuff to dip pens.</p>
      <p>If you find a decent fountain pen you can carry around it in your pocket as you move through the world, and have the pleasure of making letters with it, but at home you have the ideal setup with your Brause nibs and some good black ink. Oh, and don't use India ink -- use good quality fountain pen ink (India almost always too thick!)</p>
      <p>If you haven't picked on up already, a good book is a big plus. I recommend Edward Johnston's "Writing and Illuminating and Lettering" and Friedrich Neugebauer's "The Mystic Art of Written Forms." I think Johnston is perpetually in print; Neugebauer is not in print but can be found used. (Important disclosure: I translated Friedrich's book from German into English back in 1980. Hope no one feels it is inappropriate for me to plug the book here -- my own involvement aside, I still feel it is the best calligraphy text ever written.)</p>
      <p>hth,</p>
      <p>Bruce</p>
