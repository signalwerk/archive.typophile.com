      <p>I wouldn't scrimp on the pen, it really can make a difference, however the best way to find one that is good for you is to try them –&nbsp;obviously expensive, my search led me to these two, Rotring sketch pens and Pilot parallel, I find they clog up less than any others and produce predictable consistent line widths, allowing one to concentrate on the lettering. On the other hand there is a lot to be said for the marks that dip pens and brushes make.</p>
      <p>Tim</p>
