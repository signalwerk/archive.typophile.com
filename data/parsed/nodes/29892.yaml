    html: <p>Thanks for all the advice. There is a local shop here that literally has thousands of pens, so I might go in and try a few out, just to see how they feel in my hand. Generally, I like a heavier pen, something that makes me feel like I have something in my hand, and a nib which doesn't make it feel as though I am cutting into the paper. These are the problems I have often had with pens I have used in the past, but this could be due to poor technique, rather then poor equipment as well.</p>
