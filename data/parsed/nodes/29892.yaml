  html: <p>I would like to learn how to letter by hand, the old fashioned way. I checked to see if there were any threads previously, and didn't have much luck with my search. My main question is what kind of pen I should choose. Things will start of real basic, and I would like to learn how to use both the broad nib and round hand styles. Any suggestions?</p>
