  html: "<p>Not if already one will have struggled on the <br>subject, I am so new in TP that almost even not <br>as you think the others. <br>  <br>This year I have the personal commitment to <br>conclude a typography that I began years ago but <br>that by personal causes I have posponed during <br>long time. <br>  <br>This year I feel with renewed energies to give <br>aim him in which to structural design one talks <br>about, I have many feelings involved in this <br>typography and I do not want to conclude it by <br>the simple fact to conclude it. <br>  <br>I take advantage of east event to reframe new <br>questions to me, and one of them is the one that <br>always moves my acts:  As it is the process by <br>which a typography arises? On which I am based <br>to create it. <br>  <br>I want to reflect this personal feeling in you, <br>and I would like that all we expose our mental <br>fluids for meditation of the rest, and I say <br>meditation instead of critic. <br>  <br>Thanks to hold to me. <br>I wish a happy and productive year to you. <br>ODA <br> <br>(sorry for my english) <br>powered by google translation <br> <br>'''''''''''''''''''' <br>Masticando Pensamientos. <br>No se si ya se habr</p>"
