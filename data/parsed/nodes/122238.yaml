    <p>This headline style was established by M/M from Paris. They said the following about the redesign of Vogue's typography, but I can't see that this is one of those typafes:</p>
    <blockquote><p>The foundation of Paris Vogue’s redesign is a new typographic system. Using Gerard Unger’s Paradox for body copy and the 18th-century Fleischmann for stand-firsts, M/M adopted a rough-edged schoolbook typeface for headlines (a face they named Gulliver after the subject of the book) and employ one of their own existing designs (now called Carine) to title fashion spreads. </p></blockquote>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2014-12-29 at 20_5005.10.39.png"></div><p></p>
