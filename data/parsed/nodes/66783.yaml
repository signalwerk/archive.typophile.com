  html: '<p>Google <a href="http://googleblog.blogspot.com/2010/01/unicode-nearing-50-of-web.html" title="Google blog post about Unicode" rel="nofollow">now has the reading abilities of a teenager</a> and can read <cite>f</cite>-ligatures: “[T]he characters <cite>fi</cite> can... be represented as two characters (<cite>f</cite> and <cite>i</cite>) or a special display form <cite>ﬁ</cite>. A Google search for [financials] or [office] used to not see these as equivalent – to the software they would just look like *nancials and of*ce. There are thousands of characters like this, and they occur in surprisingly many pages on the Web, especially generated PDF documents. But no longer – after extensive testing, we just recently turned on support for these and thousands of other characters,” ostensibly including hieroglyphs.</p>'
  html_clean: '<p>Google <a href="http://googleblog.blogspot.com/2010/01/unicode-nearing-50-of-web.html" title="Google blog post about Unicode" rel="nofollow" class="link-external">now has the reading abilities of a teenager</a> and can read <cite>f</cite>-ligatures: “[T]he characters <cite>fi</cite> can... be represented as two characters (<cite>f</cite> and <cite>i</cite>) or a special display form <cite>ﬁ</cite>. A Google search for [financials] or [office] used to not see these as equivalent – to the software they would just look like *nancials and of*ce. There are thousands of characters like this, and they occur in surprisingly many pages on the Web, especially generated PDF documents. But no longer – after extensive testing, we just recently turned on support for these and thousands of other characters,” ostensibly including hieroglyphs.</p>'
