      <p>An update on progress. Since I have a web site and portfolio to finish first, I've decided that if I don't find something that would satisfy me, I'll give it a rest for a couple of weeks.</p>
      <p>You'll be amused to know I've managed to get some unbelievable shapes combining z and g letters, including cow's portrait:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cow_wink_6382.jpg"></div><p></p>
      <p>Of all the concepts I came up with, I found only two worth considering. The first one you already saw. I've contacted author of type and he approved me using it in logo, which is a big plus. It's inspired by polaroid, but that doesn't mean it associates on it. I also have to say I don't agree with type weight critique, since I've experimented with all possible combinations, and this one seemed to do the trick (and it was deliberate juxtaposition). I've also tried printing it, and it's legible, and for web 100 and 200 px version seems fine too (without words).</p>
      <p>There's also this other concepts, and tell me what you think about it:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/concepts_5623.jpg"></div><p></p>
