      <p>What a broad amount of things to convey in a poor single little logo! ;-)<br>
      The overall composition isn’t bad (which it’s not easy given the many different elements. I suppose being a photographer helps :-)<br>
      Some random thoughts:<br>
      - I would revise the colour palette (they seems too many and don’t blend well together). Also, if you think of the logo in a portfolio website, too many colours could distract away from the photographs.<br>
      - I don’t like the slanted light grey “photography”. You could try an upright light (as in font weight) black version.<br>
      - Compared with the serene samples you provided, the eye in your logo appears almost menacing...</p>
