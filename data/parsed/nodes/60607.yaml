    html: |-
      <p>I'm still liking the one from August 5th the best. It looks strong, yet with it as all lowercase it has a pleasant friendly appeal. The lowercase g looks like a subliminal smile. It's not really noticeable or distracting, but I like it a lot. I like how the "holes" of the o, g &amp; c resemble the circle of the lens/eye, so the type looks like it belongs to the mark. Nice! I like the thickness of the outer circle of the lens/eye, cause it matches the thickness of the letters. I'd maybe play the lens/eye some more and see if you can make more resemble a camera lens. Myself, I don't mind it al all.</p>
      <p>In the other versions, the type doesn't especially balance with the thickness of the mark, except maybe #8 &amp; #10. On #5 as all uppercase, the name seems to long to me for all uppercase. I think it would be painful reading on a large scale sign for your studio. Like emails "shouting" being all uppercase. </p>
      <p>Some of the letters stand out badly to me in certain versions: The s in 3 &amp; 4, the i in 3 &amp; 9, the accents in 13 &amp; 14, the t in 14, the g in 3 &amp; 4 will look like an 8 at small sizes</p>
      <p>The first zg logo is interesting, and is worth some exploring - it might not be recognizable unless you repeat or resemble those characters in the name. The gray makes it look like a hour glass to me.</p>
      <p>The second looks like 29. The 3rd, well... not seeing anything.</p>
