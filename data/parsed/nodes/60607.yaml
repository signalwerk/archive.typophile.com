    html: |-
      <p>In the end, as i see it, it comes to two frames - white one(that will be questionable for applying on white) then the grey one.<br>
      Symbol inside that is trapped inside that grey frame, that can survive pretty on its own without one or two frames with decent wordmark. </p>
      <p>Name set in Futura displaying the name is too tight spaced, and photography beneath too wide, thus creating not so pleasing contrast. Photography looks to light and zlatkogudasic to thick. So that tells that there is a problem with typesetting in the beggining, selection, coloring, composition, and proportions and spacing itself generating too much contrast and negative dynamics (note too tight set nameplate, and too light and wide spaced photography).</p>
