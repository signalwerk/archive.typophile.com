    <p>I'm working on a personal photography web site project, in my spare time, so it's unlikely it will be out anytime soon, but nevertheless I'd like it to have recognizable identity.</p>
    <p>I’d like to put couple of personal collections, like seascapes (examples 1 and 2), subtle suburban shoots (example 3), there’s one nostalgic grunge collection I’m working on, etc. and there’s one ongoing project I’m working on with local photo club that includes on location people shoots like example 4 (it should be interesting locations and use of external strobes).</p>
    <p> </p><div class="imageWrap"><img src="http://typophile.com/files/example1_3731.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/example2_4647.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/example3_6693.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/example4_6130.jpg"></div><p></p>
    <p>I’m attaching the logo I like best of those I’ve played with until now (so far i like light gray, blue, orange combo):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/identity_5536.jpg"></div><p></p>
    <p>I've also played with logo from letters GZ, I'll post best what I came up until now (by my opinion) a little later, because I don't have it with me right now.</p>
    <p>I’d like the logo, type and color used to say:<br>
    vision in photography (hence my idea for the stylized eye)<br>
    urban<br>
    art<br>
    professional (as in high quality)<br>
    grunge (eyelashes and pupil on the eye are sort of grungy to communicate that)<br>
    positive (by the use of blue, green colors, maybe put pupil in orange for accent).</p>
    <p>I'd like to attract young crowd.</p>
    <p>I was looking for type that would not be to strict, but not too loose either, and that has sort of "artsy" feel to it (possibly countered by word "photography" in sans serif). You can see on the logo what I thought might be a good idea, but I'd really like more input from experienced people.</p>
    <p>Any help and input appreciated!</p>
