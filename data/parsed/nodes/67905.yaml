    html: '<p>Here’s the cigar, albeit not a Swiss one: The font used for the signage is <a href="http://7und40.com" rel="nofollow">Diseased Pen</a> by the Austrian designer Janto Lenherr. It has also been used in the book <a href="http://www.typografie.de/Unsere-Buecher/Grafikdesign/Fons-Hickmann_Christof-Nardin/beyond-graphic-design::87.html" rel="nofollow">Beyond Graphic Design</a>, issued by a German publisher (see also this <a href="http://www.youtube.com/watch?v=xTInn_GitHU" rel="nofollow">video</a> on YouTube). Alas, I can neither contribute a decent specimen nor any information about the availability of the typeface.</p>'
