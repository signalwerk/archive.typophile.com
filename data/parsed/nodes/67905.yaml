      <p><a href="http://www.identifont.com/show?PQM" rel="nofollow">Relevant</a> by Mika Mischler and Nik Thoenen has a similar feel but differs in one or the other detail. It may be a customised version.</p>
      <p>If I am not mistaken, ‘Strasse’ (instead of ‘Straße’) is a Helvetian spelling variant. The company with a ‘Kältezentrale’ may reside in Switzerland. This makes the use of a Swiss typeface for their signage even more likely. Can you say where these photographs have been taken, breckon?</p>
