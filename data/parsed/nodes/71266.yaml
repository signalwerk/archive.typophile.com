    <p>Trying to help a friend figure out the font of this logo for his boss. </p>
    <p>To me, who is not any kind of expert, the J looks like Georgia or NC Schoolbook, the M like Plantin. It's hard to believe they'd actually be from different fonts, but who knows? </p><div class="imageWrap"><img src="http://typophile.com/files/JM-out_6735.jpg"></div><p></p>
