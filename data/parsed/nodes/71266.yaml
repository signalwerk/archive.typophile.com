    html: |-
      <p>There is something about the serifs, in the way they are not sharp-edged, that is not typical. Ray Larabie's <a href="http://new.myfonts.com/fonts/typodermic/winthorpe/" rel="nofollow">Winthorpe</a> has an M very much like this M, although a bit curved on top, and not curved in the left M leg as much. The J has the rounded serif, but it is too long and the hook and ball isn't right. It's possible that it was shortened and a ball terminal was grafted on, but that might be reaching a bit.</p>
      <p>Taken by itself, I think the J looks most like Scotch Roman, rather than New Century, but the serifs are not as soft looking as these. It's possible some tweaking was done, and if you consider that 'cheap' sometimes appeals to designers, it may have been an inexpensive (or free) font, or something that comes with standard font packages. I thought the Plantin M looked more twisted than this one.</p>
      <p>I think you could be right about mixed fonts, because there were no serif families I know that have this J and a similar splayed M.</p>
      <p>- Mike Yanega</p>
