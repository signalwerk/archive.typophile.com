      <p>And if the letters are being modified, why not consider that a ball was added to the hook of the J?  I kept looking for a match to the counter at the J hooks, and very few were anywhere near the right shape, mostly because the serif wasn't a round ball. If you add your own ball, you only need the 'jawline' of the J to be the right shape.</p>
      <p>- Mike Yanega</p>
