    html: |-
      <p>Thanks for your help!</p>
      <p>If we work under the assumption that the two fonts are different, I definitely think Winthorpe is a possibility for the M.</p>
      <p>The J still puzzles me. After a closer look, I think Schoolbook is out, but Scotch Roman doesn't look right to me either. Poking around a bit, I think <a href="http://new.myfonts.com/fonts/bitstream/century-731/" rel="nofollow">Century 731</a> or something in the News (<a href="http://new.myfonts.com/fonts/bitstream/news-705/" rel="nofollow">News 705</a>?) family might be more likely. Still, neither of those seem quite right either, and definitely I think it's possible that the serifs on the J were modified, perhaps to more closely match those on the M.</p>
    html_clean: |-
