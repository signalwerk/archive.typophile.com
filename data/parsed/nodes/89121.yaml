    <p>The type designer Jean François Porchez will be giving a free public lecture on his work at the University of Washington in Seattle on Wednesday, February 15th. </p>
    <p>Jean François Porchez's biography is online here:<br>
    <a href="http://www.typofonderie.com/profile/profilejfp" title="http://www.typofonderie.com/profile/profilejfp">http://www.typofonderie.com/profile/profilejfp</a></p>
    <p>The lecture will be on the UW campus in Kane Hall.<br>
    Directions and parking information here:<br>
    <a href="http://www.css.washington.edu/KNE_Directions" title="http://www.css.washington.edu/KNE_Directions">http://www.css.washington.edu/KNE_Directions</a></p>
    <p>Here's a Facebook page for the lecture:<br>
     <a href="http://www.facebook.com/events/321905661175081/" title="http://www.facebook.com/events/321905661175081/">http://www.facebook.com/events/321905661175081/</a></p>
    <p>There is also simple web page here (in case you are not on Facebook):<br>
    <a href="http://depts.washington.edu/uwch/projects/colloquia-and-conferences/letters-from-france" title="http://depts.washington.edu/uwch/projects/colloquia-and-conferences/letters-from-france">http://depts.washington.edu/uwch/projects/colloquia-and-conferences/lett...</a></p>
    <p>The event is free to the general public.<br>
    This event is sponsored by UW Simpson Center for the Humanities and the UW Division of Design.</p>
