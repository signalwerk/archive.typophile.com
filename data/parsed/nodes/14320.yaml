      <p>This thread is all over the place but for what it's worth, I know someone who bought one and this is what he had to say:</p>
      <p><em>Well so far it's been just trying to say something new about what is essentially just a mouse.</em></p>
      <p>Ran the installer which required 152mb of space?!! Mighty is not the word.<br>
      Restarted and set up the preferences to use the scroll ball as Expose--&gt; Show desktop and the side buttons to Expose--&gt;Show all windows</p>
      <p>The scroll ball is quite springy in that pressing down. I was expecting it to be quite rigid but any amount of force will press it down into it's hole. I would wonder about the durability of this as it does seem mounted on a soft spring. The side buttons do require a good squeeze between the thumb and ringfinger. The sound they emit is very quiet though the scroll ball sound is very realistic</p>
      <p>I have put up the tacking speed on everything to it's highest as I like a fast mouse. The right click action is identical to the action I use on the intellimouse.<br>
      Been using it in Photoshop/Preview in place of the usual spacebar action to move around the document and it works well though a bit jerkier.It means a quicker workflow in some instances.</p>
      <p>The short cord is actually good for powerbook users as I use it on the right with the cord plugged in on the left hand side. It definitely would be awkard plugging it into a g5 under the desk and using it that way.</p>
      <p>All in all a good mouse for creative work but I'll have to road test it a bit more.</p>
      <p>He's an icon designer, if you were wondering.</p>
    html_clean: |-
