      <p><em>Wait a second… $49 and it’s not even bluetooth? What are you thinking?</em></p>
      <p>Maybe he's thinking "let's not make this one eat batteries."</p>
      <p>Bluetooth is a nightmare. One of the worst examples of Engineering By Committee. Someone just wrote a Linux program that lets you break into the Bluetooth Audio channel used by new luxury cars for their speakerphone function and yell at the driver. "Hey you in the Crackura! Pull your head out of (etc.)"</p>
      <p>So the Mighty Mouse is multiple button yet it isn't. This is ultimately a concession by Apple. The first thing I do when I get a Mac is hook up a four-button PC trackball. I'll see if this new one is better than discrete buttons.</p>
