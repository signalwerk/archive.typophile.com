    html: |-
      <p>Err, because — if we took the pessimist look on things — back in the day when Futura was so popular, everybody made a copy of their own interpretation — all supposedly look very close to the original — and ran away with it. Spartan and Geometric 231 are good examples (no offense to anybody).</p>
      <p>In my opinion, there is two branches of mid-century architectural face. One is more geometric (Futura, Kabel, etc.) and one more along the lines of grotesk (Neutraface, Proxima Nova and what have you).</p>
