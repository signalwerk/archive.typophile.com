    <p>I am happy that the traditional look isn't dead<br>
    in newspaper design.</p>
    <p>The New York Times, The Wall Street Journal,<br>
    The Washington Post, great examples like those.</p>
    <p>I don't like the convenient tabloid look, though,<br>
    but the old-fashioned look is king with me.</p>
