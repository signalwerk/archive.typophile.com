  html: <p>I just heard a nice little lightweight article on ‘fonts’ on BBC Radio 4's Satuday Live programme. Obviously it's a weekly show so it won't be available to listen to for that long - somewhere between 6 and 8 days would be my estimate ;^). You can access the show from the show's homepage <a class="freelinking external" href="http://www.bbc.co.uk/radio4/saturdaylive/saturdaylive.shtml" rel="nofollow">here</a></p>
