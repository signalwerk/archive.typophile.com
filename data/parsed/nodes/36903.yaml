      <p>Is that how we sound? (I realize that I'm definitely a johnny-come-lately here, and that many of you have really been having these ongoing dialogues for quite some time; it's more the earnestness I'm talking about.) It's kind of funny. I'm listening as I type this. I must admit, the article was pretty much just a short, little confection and so is the aftertalk (though not with as much enthusiam). But it made me smile, and did establish that there's a real interest out there in fonts for some people. </p>
