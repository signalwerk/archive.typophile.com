    html: "<p>The “Guerrilla Report” by Paul Finn starts around 36:30 in the show. Of course it’s a bit weird: trying to describe some features of single glyphs without the audience seeing them sure is problematic and the speaker sounds a bit over-enthusiastic, but it’s nice hearing typography discussed on a major BBC show anyway.</p>"
