    <div class="node-spam-content"><p>Ganden means ‘joyous’ in Tibetan and is the name of the Western Paradise (also known as Tushita) that is home to Jampa, the Future Buddha.   <strong><a href="http://www.chinatour.com/" title="Visit china" rel="nofollow">Visit china</a></strong> to explore.There is a certain irony in this because, of all the great monasteries of Tibet, Ganden suffered most at the hands of the Red Guards, possibly because of its political influence.<br>
    Today it is the scene of extensive rebuilding, but this does not disguise the ruin that surrounds the new structures. <strong><a href="http://www.chinatour.com/" title="Travel China" rel="nofollow">Travel China</a></strong> for more. In 1959 there were 2000 monks at Ganden; today there are just 300. The destruction was caused by artillery fire and bombing in 1959 and 1966. New chapels and residences are being opened all the time, so even pilgrims are sometimes unsure in which order to visit the chapels.<br>
    Ganden was momentarily shut to visitors in 1996 after aggressive presentations against the government’s prohibiting of Dalai Lama images. There were further scuffles in 2006 when priests broke a sculpture of the questionable deity Dorje Shugden. Read also <a href="http://www.chinatour.com/private/train-tours.htm" title="China Train Travel" rel="nofollow"><strong>China Train Travel</strong></a>. A new cops place and army barracks were designed at the monastery following the riots of 2008.<br>
    Interior photography charges are ￥20 per chapel; video clip charges are an awesome ￥1500. Make sure you check out the monastery in the morning hours as many chapels are shut in manufactured.<br>
    Ganden is also the start of the well-known forests travel to Samye Monastery.<br>
    Read also: <a href="http://www.chinatour.com/tools/visa.htm" title="China Visa" rel="nofollow"><strong>China Visa</strong></a></p>
    </div>
