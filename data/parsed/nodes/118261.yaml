    html: |-
      <p>Jackfahnestock, the original typeface dates from 1932, the company dates from 1895, so I suspect the packaging design long predates the era of digital type (the digital version of the typeface dates from 2000).</p>
      <p>It wasn't unusual, up until the advent of the computer, for designers to use type specimen books as the basis for drawing (and I do mean by hand) a logotype. Not all logos are hatched directly from a font file. </p>
      <p>And thus ends my cranky old(er) man speech.</p>
      <p>The vertical and horizontal proportions have been played with a bit, and a few details squared off (such as the leg of the R), but I still contend that it is Futura Display:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FuturaDisplay_3990.png"></div><p></p>
