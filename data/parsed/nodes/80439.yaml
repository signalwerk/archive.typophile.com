      <p>BKKMLL,</p>
      <p>The rendering process should look like the following: </p>
      <p>1. You feed in a Unicode string (for plain characters, not the alternates), the font and a set of OpenType Layout feature tags into an OpenType Layout library such as HarfBuzz, ICU Layout, Uniscribe or the Adobe Flash Text Framework.<br>
      2. The OpenType Layout library analyzes the Unicode string and the font, and applies the transformation of Unicode codepoints to glyph IDs and their positions using the OpenType Layout rules included in the font's GSUB and GPOS tables.<br>
      3. The font information, the sequence of glyph IDs and their positions are then fed into the rasterizer such as FreeType or the system rasterizers, which produces a bitmap image (in a memory buffer).<br>
      4. The bitmap memory buffer is fed into a tool such as ImageMagick, PIL or any other image processing library, and a formatted image (e.g. in the PNG format) is produced. </p>
      <p>This means that for use with PHP you need a tool that glues together HarfBuzz, FreeType and perhaps ImageMagick (or libpng or something similar). You should not deal with the unencoded glyphs in any way -- this is what the OpenType Layout layer (the first one, i.e. HarfBuzz) needs to take care of. </p>
      <p>Unfortunately, the opensource community so far has failed to produce such a tool, while in fact it'd be a simple undertaking (probably some 2-3 days of coding tops). </p>
      <p>This is why I've linked to the HarfBuzz mailing list, where I've been raising this issue regularly for quite a while. The developer of HarfBuzz Behdad Esfabod wrote in the linked thread that if he gets "kicked" regularly on this, he might finally do it -- so I recommend that you join that list and postulate this as well. </p>
      <p>The only workable and simple enough solution I've found so far, which enables typesetting with OpenType fonts using OpenType Layout features is to employ XeTeX+XeLaTeX. The simplest way is to install the TeXLive distribution on the server, have PHP generate a .tex file, call xetex or xelatex, grab the output PDF and feed it into ImageMagick, GhostScript or other PDF-to-bitmap conversion utility. </p>
      <p>XeTeX/XeLaTeX include an integrated version of the OpenType Layout library ICU Layout, which does all the processing of the GSUB/GPOS tables behind the scenes. The workflow is not superfast, but quite easy to implement. </p>
      <p>I've put up some quickstart TeX samples here:<br>
      <a href="http://www.twardoch.com/tmp/xetex-typesetting-samples.zip" title="http://www.twardoch.com/tmp/xetex-typesetting-samples.zip">http://www.twardoch.com/tmp/xetex-typesetting-samples.zip</a><br>
      I hope they're clear enough to follow and modify. </p>
      <p>Best,<br>
      Adam</p>
