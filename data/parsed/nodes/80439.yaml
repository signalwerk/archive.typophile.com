    html: |-
      <p>BTW, the TeX samples I've posted product the following results (reduced in size): </p>
      <p><code>xelatex-multiline-1024x768.tex:</code><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/xelatex-multiline-1024x768_3778.png"></div><p></p>
      <p>and<br>
      <code>xetex-sample-cropped.tex:</code><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/xetex-sample-cropped_3822.png"></div><p></p>
      <p>In XeTeX/XeLaTeX, you can easily specify the OpenType Layout features to be applied as in <code>+smcp,+onum,+pnum</code>. Unlike other primitive methods that try to read/process OpenType Layout tables directly (say using FontTools/TTX), this method also works with Arabic or Indic scripts which require special processing by the OpenType Layout library. ICU Layout is such a library that is quite full-featured in this regard.</p>
      <p>I think this might be what you need. (It's certainly what *I* need :) ). </p>
      <p>Best,<br>
      Adam</p>
