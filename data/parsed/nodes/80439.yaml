    html: |-
      <p>Tom, </p>
      <p>I have very good news for you. My laments have worked and Behdad Esfabod has written a small tool "hb-view" as part of the HarfBuzz project:<br>
      <a href="http://cgit.freedesktop.org/harfbuzz/tree/src/hb-view.cc" title="http://cgit.freedesktop.org/harfbuzz/tree/src/hb-view.cc">http://cgit.freedesktop.org/harfbuzz/tree/src/hb-view.cc</a></p>
      <p>You need to install or compile the following packages on your server: glib, cairo, freetype and the Git version of HarfBuzz from:<br>
      <a href="http://cgit.freedesktop.org/harfbuzz/" title="http://cgit.freedesktop.org/harfbuzz/">http://cgit.freedesktop.org/harfbuzz/</a></p>
      <p>The usage is very simple:<br>
      <code>hb-view --background=00000000 --features=onum=1,calt=1,dlig=1 --font-size=72 --foreground=FFFFFFFF --line-space=30 --margin=10 --output=test.png fontfile.otf "Text to display as UTF-8"</code></p>
      <p>So you specify the font file (.otf or .ttf), the list of OpenType Layout features, the text and a few other parameters (--background and --foreground are RGBA where A is alpha transparency), and of course a PNG file (if you omit it, the tool will feed the PNG stream into stdout, which you can of course capture from PHP). There are a few more options (for script, language and direction if you deal with non-Latin), which you can look at in the source code of the tool. </p>
      <p>The tool is actually very small and very clearly written. I don't read C++ at all, but I was able to read the source of hb-view and figure out exactly what each part is doing and how. By modifying the source of hb-view a bit, you're even able to replace the PNG output with SVG or PDF because the underlying graphics library (cairo) supports those backends. </p>
      <p>Using hb-view way easier and much faster than using XeTeX. </p>
      <p>Best,<br>
      Adam</p>
