    html: '<p>This is due to how Word create PDF files. It will rasterize rather than embed "no embedding" fonts and non-TrueType fonts. It was never ment for this kind of work anyway. If you have the budget for a graphic designer, I’d be happy to typeset the document for you. Feel free to contact me! Other options: try Cute PDF Writer or MakePDF.</p>'
