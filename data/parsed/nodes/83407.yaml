    html: <p>Minion Pro has editable embedding. The Adobe website says so, and I confirmed it with my installed Minion fonts using the Microsoft font property extension. I just PDF'd a Word document (on Windows) with over 10,000 words and no graphics using the "Convert to Adobe PDF" plugin in Word and it came out 14 KB. If I printed the Word document to a .ps file and distilled that, it came out 46 KB. This is not a Word problem (unless there's something in the Word document that hasn't been mentioned -- for instance, is track changes turned on, or do you have versions?). More likely, Distiller is set up wrong.</p>
    html_clean: <p>Minion Pro has editable embedding. The Adobe website says so, and I confirmed it with my installed Minion fonts using the Microsoft font property extension. I just PDF'd a Word document (on Windows) with over 10,000 words and no graphics using the "Convert to Adobe PDF" plugin in Word and it came out 14 KB. If I printed the Word document to a .ps file and distilled that, it came out 46 KB. This is not a Word problem (unless there's something in the Word document that hasn't been mentioned -- for instance, is track changes turned on, or do you have versions?). More likely, Distiller is set up wrong.</p>
