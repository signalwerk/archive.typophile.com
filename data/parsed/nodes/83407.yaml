    <p>Hi there,</p>
    <p>Over the past few years I have set many documents in Minion Pro. Typically they're only about 3,000 words long and have no graphics, but when printed as a PDF out of Microsoft Word (I tried LyX but my citation format does not play well at all) the PDF file is a whopping 62mb! Trying to send a document of this size to a printer over our organisation's (unfortunately) browser-based print server is a nightmare. </p>
    <p>Does anyone know how to reduce the file size of PDF documents set in Minion Pro? Is there some export setting I have overlooked in Microsoft Word?</p>
    <p>I am running Mac OS10.6.8 with Word 2011.</p>
    <p>Many thanks.</p>
