    <p>I'm printing and comping up this for my final critique so I figured that I would post it here. Basically it was a 10 week course where we picked a company, researched and designed a set of comprehensive spreads that would cover the possibilities within an annual report. Creating a whole report would be ludacris in that time period obviously. All the icons within the report were created by me, the only thing I didn't make is the actual RR logo and the body copy. I had never done anything corporate, design wise so that's what I wanted to do with this project...stressing the iconic nature (hence the ones I created) of the company itself. The facts in the beginning are an introduction to the report as a way to ease you into the information and make you realize the sophistication of the British culture and history.</p>
