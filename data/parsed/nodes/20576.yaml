    html: |-
      <p>Rolls-Royce are notoriously protective of their image (quick anecdote, the only vehicle to officially carry their emblem that wasn't made by them is a mock-up of Lady Penelope's pink Roller from Thunderbirds and they want to buy it in order to crush it, I know that the car division is a separate entity now but the message is clear), so I have to join in and say that you will need to have a major rethink, in fact it is probably good practice to never refer to a company's logo in a document unless specifically requested. I would definitely include some images, I saw on the website they have an <a href="http://www.rolls-royce.com/media/gallery/default.jsp" rel="nofollow">image library</a>.</p>
      <p>The facts at the beginning are not performing as you want them to – tea, Wimbledon and Magna Carta provide very little in the way of an introduction to the company and its values and are wildly disconnected.</p>
      <p>More basically on the design, the document would presumably be perfect bound, which means that the centre of the spread is pretty much impossible to view and will need a larger gutter than you have allowed. Where you have used ranged right text you should look at overhanging punctuation. In the tables where you have a negative value (signified by parentheses) the numerals should align with the numerals above, the parenthesis should overhang the column. You will need a folio throughout and a clear title showing the dates it covers on the front cover.</p>
      <p>Sorry to be so negative, but it is better to discover this now.<br>
      Tim</p>
