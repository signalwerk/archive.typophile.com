      <p>David, to be blunt, if this is for your final critique; there are some inconsistencies that you'll probably be docked for. First off as mentioned above, using the logo in such a manner is surely against their Standards guide; while I got the shapes in the front section and thought it was clever it's a blatant disregard for brand standards. A few other things to consider: there's no name on front to signify which company it is, there doesn't appear to be a consistent grid structure throughout the piece, text alignment tends to very (probably better to stick to one) and the repeating seems to be there just to fill space. </p>
      <p>I hope that helps you out a bit. </p>
      <p>Cheers!</p>
