      <p>I see where you are going with the "icons' for lack of a better word. I use logos and deconstruct them myself in my work, I happen to like patterns of this sort.<br>
      With a client (real or school project) such as Rolls Royce, I do not think they would allow a designer to take the steps you have taken by the manipulation (turning, mirror, duplicate, etc) the RR mark. This is not to say that other clients would not allow this, but I believe RR is too established and upscale to risk such a direction.<br>
      What exactly do these "icons" represent?</p>
