    <p>aka "chester"<br>
    b. 1971 in <a href="/wiki/Montreal" class="freelinking" rel="nofollow">Montréal</a>, <a href="/wiki/Canada" class="freelinking" rel="nofollow">Canada</a></p>
    <p>Selected published types:<br>
    FF Schmelvetica<br>
    Eclogues<br>
    Pixella<br>
    Freedumb<br>
    Galaxie Polaris</p>
    <p>Selected published types, collaborations:<br>
    Infinity (with Rick Valicenti)<br>
    Apex Sans (with Rick Valicenti)<br>
    Alexey (with Rick Valicenti)<br>
    Apex Serif (with Rick Valicenti)<br>
    Orbit (with Rick Valicenti &amp; Robb Irrgang)</p>
    <p>Co-founder with Tracy Jenkins of <a href="/wiki/Village" class="freelinking" rel="nofollow">Village</a>.</p>
