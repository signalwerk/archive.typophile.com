      <p>Classic does not mean beloved by all. You must also consider some visions of classic are marketing attempts. A true classic defines a model.  As John Hudson points out, the one you compare the others of its kind to. The older a type is, the less argument about its status as a classic.  Nobody argues Garamond but there is more angst about Helvetica. To me AG is the classic European grot but Helvetica rained in many peoples faces since 1957.</p>
      <p>ChrisL</p>
