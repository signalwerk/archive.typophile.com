    <p>I am currently writing my dissertation about ‘classic’ typefaces, well those that make up the Linotype Platinum Collection (<a href="http://www.linotype.com/1805/platinumcollection.html" title="www.linotype.com/1805/platinumcollection.html">www.linotype.com/1805/platinumcollection.html</a>), and was wondering if I could get your opinions on a few questions that I have to ask…</p>
    <p>-	what defines a ‘classic’ face? Is it its age, individuality, history etc.<br>
    -	do you think the faces chosen are a fair selection or have they missed a face or even got it wrong?<br>
    -	do you think they even needed reinventing?</p>
    <p>Thanks</p>
