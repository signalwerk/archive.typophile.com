      <p>The British historian and critic James Secord made this observation about literary classics</p>
      <p><em>'Those books that allow us to forget the most are accorded the status of a classic.'</em></p>
      <p>And I think this is applicable to type design in many respects too. A classic typeface is one that dominates an idiom or genre, such that any other typefaces in that idiom are automatically compared to it. A classic typeface also becomes a kind of filter through which we view typographic history. So, for example, we have come to view Venetian typography through the filter of Bembo. And here is where Secord's observation applies, because the filter makes us forgetful and we ignore large amounts of actual Venetian typography.</p>
