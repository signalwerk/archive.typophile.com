      <p>Hey,<br>
      Optima is a classic font. It really was the first humanist sans. It is often copied, poorly used and applied to the lowest rung of the typographical ladder. That said though, when used properly it still looks beautiful. It started on fire, has been through metal, film, phototypesetting and now digital. If a font is continually in use, perhaps not always at the zenith of popularity, but used enough through several generations, it becomes a classic. Some fonts are found again and become popular again. I think it is easier to figure Oldstyle and transitional fonts being classic compared to most sans, as time appropriates the classic line.<br>
      Plantin is a classic while almost every font from film-O-type is not. Why? who uses the fonts from film-O-type (Skokie, Ill)? I did, but it has been 20 years. Photolettering fonts (which I thought were great) are pretty much not in any use (except House did revivalof sorts), of 12,000 font library. Gone. Poof. au revior.<br>
      I guess just as important as to what is a classic is what is not.  </p>
      <p>The Truth shall set you free</p>
