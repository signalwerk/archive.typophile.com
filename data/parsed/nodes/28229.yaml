      <p>But who are the "We" who become forgetful?</p>
      <p>There are media involved, most obviously when a classic has not been in continuous use.<br>
      Then it is the cultural arbiters such as Updike, Meggs, Heller and Bringhurst, and the commercial influences such as Linotype, who have some say in the matter.</p>
      <p>This is driven home by Charles Murray in his statistical analysis of "Human Accomplishment", where he correlates achievement with mention in published reference works.</p>
      <p>Also, if a particularly talented redesigner, or one who works for a dominant font distributor, goes to work on reviving a face, it stands a much better chance of becoming a classic.</p>
