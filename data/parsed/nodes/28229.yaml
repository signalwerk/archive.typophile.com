      <p>Their Platinum collection certainly isn't a classic collection in my opinion. I think a better way to describe it is that it is a quality collection.</p>
      <p>In my mind 'classic' font's are font's that have proved themselves by standing the test of time and probably a good breadth of uses. The ones that jump to mind are Helvetica (Linotype), Garamond, Eurostyle, Gill Sans (Monotype), Times New Roman (Monotype), Baskerville.</p>
