    <p>Hi, <br>I made an Arabic TTF with AAT for Mac which also includes Roman char range. <br>I want to have Arabic char samples in preview of Font Book (as default and not custom set in Font Book) but it shows Roman samples. Arabic fonts bundled with OS X do show Arabic samples by default (and Chinese and Japanese samples for those fonts) <br>How do you do that? <br>I use FontLab and Apple font tools for OS X.</p>
