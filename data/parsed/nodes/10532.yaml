    html: <p>I just learnd how to do MIF for Arabic script (in a very basic way) and I'm working on it right now. This language identification of the font is not necessarily related to AAT but maybe to other issues more general in fonts or at least common in TTF fonts. I doubt that MS Arial which inludes Arabic range has any AAT but it still shows Arabic samples in Font Book. <br> <br>I'll post here if the Arabic AAT font I'm working on was successful.</p>
