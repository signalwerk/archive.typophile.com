    <p>I’m currently working on a pastiche of Friedrisch Willhelm Kleukens <cite>Ratio Latein &amp; Ratio Kursiv</cite> – D.Stempel AG Frankfurt am Mein (1923). My problem is that I can’t find an adequate amount of specimen – only a small sample in <cite>Deutsche schrift kunst</cite>. Any tip? Or where I might find the actual font?</p>
    <p>Thank you!<br>
    K.T.K Möller</p>
