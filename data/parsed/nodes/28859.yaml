      <p>Mr. K.T.K Möller:</p>
      <p>I should like to add that Ratio-Latein was usually used as slug casting font, not as hand-composition font. As a slug or line-casting font, Ratio-Latein had identical alphabet-lengths of Roman/Italic/Bold, the variation of stroke (contrast between upstrokes and downstrokes) was mininal, and kerns (of letter f etc.) did not exist.</p>
      <p><a href="http://www.sanskritweb.net/temp/ratio5a.gif" title="http://www.sanskritweb.net/temp/ratio5a.gif">http://www.sanskritweb.net/temp/ratio5a.gif</a></p>
      <p><a href="http://www.sanskritweb.net/temp/ratio5b.gif" title="http://www.sanskritweb.net/temp/ratio5b.gif">http://www.sanskritweb.net/temp/ratio5b.gif</a></p>
