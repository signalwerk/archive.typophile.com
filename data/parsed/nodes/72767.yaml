    <p><strong>Hi everybody</strong><br>
    I've been working on a new serif (and a new sans).<br>
    I only have theese sings, but they need a lot of work.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fenixsample_5670.png"></div><p></p>
    <p><strong>Problems I see:</strong><br>
    - I dont know how to solve the upper part of the "f".<br>
      Do you think it needs more ascender space?<br>
    - "g" weard<br>
    - "j" cant solve lower part<br>
    - "k" boring<br>
    - "s" not quiet working yet<br>
    - "v" "w" need work<br>
    - "y" cant solve lower part<br>
    - "z" a nightmare!<br>
    - Just started working on kern and track<br>
      Will do Walter Tracey's method soon.</p>
    <p>Recieving feedback!.<br>
    Best regards and thanks!<br>
    (También hablo español,<br>
    cualquier cosa a las órdenes)</p>
