    html: |-
      <p>Hola Fernando. My considerations:</p>
      <p><strong>01</strong>: acute inclination was the first thing that did call my attention. It's semi-horizontal and very large. Of course, this is a design choice, but you must take in account three consequences: (a) large acute means large grave, with undesired collision in fì. (b) It demands special kerning to i as the accent is larger than the letter. (c) You need alternate accents to get correct Polish diacritics because kreska, although similar to acute, is almost vertical.</p>
      <p><strong>02</strong>: c seems a bit narrow to me.</p>
      <p><strong>03</strong>: g could get two small improvements. Ear may be more thin at the base, where it links to the first bowl. And second bowl could have a subtle angle in its internal curve at left, following in some degree the standard of o.</p>
      <p><strong>04</strong>: I understand you want to apply the angled cut in all glyphs as this is a distinctive element of Fenix. But sometimes this may need to be softer to avoid a forced appearance. It's the case of j. Right line seems OK, but the left side would have a simple curve or a very subtle angled line.</p>
      <p><strong>05</strong>: I like your k. Not boring to me. The same about z, quite good.</p>
      <p><strong>06</strong>: s may work better with terminals reduced a bit.</p>
      <p><strong>07</strong>: what about an ink trap inside the middle internal angle of w?</p>
      <p><strong>08</strong>: I'm not the one to talk about y terminal or f ascender as these were problems to my own <a class="freelinking external" href="http://typophile.com/node/67787" rel="nofollow">font</a>...</p>
      <p>Your tilde is very nice, but the dieresis needs dots a bit more near. Excellent p, q and x. General design is beautiful, with a lot of character. I think this will develop to a very good result, as you already done with Quiroga.</p>
