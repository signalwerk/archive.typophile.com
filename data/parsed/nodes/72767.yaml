      <p>You could also lower the crossbar of /f/ (and correspondingly that of /t/, I guess) a bit, rather than raising the ascender.<br>
      I think you've observed well the parts that most need work. (Though the /z/ isn't a nightmare - maybe just needs a wider base.) Once you can get a good suitable hook shape, that will largely solve the problems of /f/j/y/ (and /r/ too, and maybe even /s/).<br>
      I'd try a /v/ and /w/ that are less flat on the bottom.<br>
      Bottom of /t/ looks a little weird to me too.<br>
      I find the /x/ very interesting!</p>
