  html: |-
    <p>Hi,<br>
    I have recently taken on a print design job for a high class directory of top top restaurants, hotels and golf courses. The directory in question is not a publication like a phone directory, more of a listing of participating high brow establishments that members who subscribe to the directory can get benefits from and therefore has more extensive body copy for each establishment that that of a directory such as a phone directory (I only mention as I think it is an important factor on the selection of font choice). </p>
    <p>Anyway, I was looking to use a nice serif font for these listings although the text size is restricted to that of 6pt and therefore not suitable for all serifed fonts due to loss of definition at smaller sizes. I was hoping though of some possible suggestions by posting my situation on this forum. The main qualities I am looking for from my font choice is that it works at 6pt, has a good variation between bold and book/light and have a high class look. Any suggestions would be much appreciated. Thankyou.</p>
