    <p>I'm a fan of Costa coffee and at the moment think they are spot on in their promotion and look and feel. Even if the imagery is a little 'Pret' styled. 7 out of 10 for  kARMARAMA </p>
    <p>Use of this typeface is what makes it for me..</p>
    <p>Find it here... <a href="http://www.costa.co.uk/" title="http://www.costa.co.uk/">http://www.costa.co.uk/</a>  (actually not so keen on appearance on screen)</p>
