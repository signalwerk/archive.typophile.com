      <p>Thanks. Note that Rosewood is a chromatic font and has been designed to complement the Fill version, for two-color printing. (So is Pepperwood and Zebrawood, too.)<br>
      Using it without its companion might be considered a bit, well, apish.</p>
      <p>See this thread:<a href="http://typophile.com/node/21280">Is Rosewood Fill the new Comic Sans?</a></p>
