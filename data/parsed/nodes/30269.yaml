      <p>I can see what you mean by the design being to busy, I agree with that - and I think that leads into the legibility (or the lack of) of the logo design.</p>
      <p>However, I disagree with the strait forwardness of fly fishing.  After doing my research, (which included many different sources, including a trip to a fly fishing shop in the Chicago area) my understanding that fly fishing was anything but basic/strait forward. It's an art that takes years and years to perfect, which might even be impossible with all the little things that can always be improved on.  I think thats why makes most people go to fly fishing, and why they enjoy it (the challenge, and the detailing of everything).</p>
      <p>Most people I talked to compared it to chess, and regular fishing being checkers - which I think sums it up perfectly.</p>
      <p>Anyone agree/disagree?</p>
