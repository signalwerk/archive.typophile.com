      <p>Areas I would look at in the wordmark are the bottom loop of f and y, the f needs one to improve its recognisability and the y's is too cramped; does it really need the ligature between fly and tie? I would read it as flytie rather than two words; the e should have a small amount of overshoot on the top of the x height to avoid it appearing smaller than the other characters which have a flat serif, the tail seems to taper rather quickly. The feature where the ‘vertical’ translates into a curve works well on the l and t, I wonder if the inside of the f should do that, it currently creates a little notch.</p>
      <p>Tim</p>
