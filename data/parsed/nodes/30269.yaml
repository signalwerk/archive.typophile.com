    <p>Starting Fall semester (I'm in my senior year at college) we drew a specialty shop category out of a hat, I received "Fly Fishing".</p>
    <p>From there we were to think of a name - but the teacher pretty much vetoed all of our ideas, and named the stores herself, so I ended up with "Fly Tie".</p>
    <p>From there we had to decide what our specialty shop offered to make it so special. Obviously with such a name, I didn't have much room - so my shop offers a place for urban professionals to come learn how to tie flies in between their fly fishing trips. Think of it as a sewing club for men that like to fly fish, it's a place to chat and gossip and learn more about their favorite sport.</p>
    <p>From there we had to create a logo, it was hard to come up with something that represented fly fishing as a whole, and showed the community/group aspect of my store. I finally decided on the "knot" or line wrapping look. It's based on tying flies, how you wrap the line around the hook to get started, and continue to wrap the line to add materials to the hook. It also represents the "Duncan loop" probably the most common knot tied in fly fishing. Finally the knot presents the individuals wraps (the customers) coming together to form one solid piece (the store).</p>
    <p>So I thought this idea covered, fly tying (what the shop offers), the actual fishing part (what the customer loves to do), and the community aspect very well (the essence of the store). Not to mention it had an upper class, sophisticated look to it (read more about the font in the communication plan below).</p>
    <p>Check out my communication plan here for more info:</p>
    <p><a href="http://www.rosem.com/work/random/commPlan.pdf" title="www.rosem.com/work/random/commPlan.pdf">www.rosem.com/work/random/commPlan.pdf</a></p>
    <p>Let me know what you guys think. I know the logo is no where near done as of now, that why I'm looking for comments. Next semester is starting soon and I want to get to see what other designers things of it as is.</p>
    <p>Thanks,<br>
    Mike</p>
