      <p>A coordinated family like Freight.... Solves all problems at all sizes. Pick the size variants you need. Arnhem is also nice for this reason. Or, X. Dupre's new Absara and Absara Sans.</p>
      <p>I have to ask, why are you talking about negative tracking your text before you even have the type selected? Very few text fonts are spaced too widely to begin with. I would expect you to open the spacing of a normal text face for use at caption size.</p>
