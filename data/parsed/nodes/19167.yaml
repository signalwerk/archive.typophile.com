      <p>Your budget will force you to be very picky. Anything from H&amp;FJ will be cost prohibitive since they don't sell single weights.</p>
      <p>I like Hrant's suggestion of a Fleischmann-based design. Take a look at Farnham:<br>
      <a href="http://www.fontbureau.com/fonts/Farnham" title="http://www.fontbureau.com/fonts/Farnham">http://www.fontbureau.com/fonts/Farnham</a></p>
      <p>Whitman is also nice, but has a more limited weight range:<br>
      <a href="http://www.fontbureau.com/fonts/Whitman" title="http://www.fontbureau.com/fonts/Whitman">http://www.fontbureau.com/fonts/Whitman</a></p>
      <p>Some sans serifs for headlines/subheads:</p>
      <p>Benton Sans<br>
      <a href="http://www.fontbureau.com/fonts/BentonSans" title="http://www.fontbureau.com/fonts/BentonSans">http://www.fontbureau.com/fonts/BentonSans</a></p>
      <p>Agenda<br>
      <a href="http://www.fontbureau.com/fonts/Agenda" title="http://www.fontbureau.com/fonts/Agenda">http://www.fontbureau.com/fonts/Agenda</a></p>
      <p>Nobel<br>
      <a href="http://www.fontbureau.com/fonts/Nobel" title="http://www.fontbureau.com/fonts/Nobel">http://www.fontbureau.com/fonts/Nobel</a></p>
      <p>These are very safe recommendations, and may not be distinctive enough, but there you have my 2 cents. Good luck.</p>
