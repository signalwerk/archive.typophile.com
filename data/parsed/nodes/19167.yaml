    <p>Hey Everyone, I have been tasked with developing a new magazine... from scratch (pause) and I need some help with font choices.<br>
    Here is a short hand version of the project:</p>
    <p>Metro-style magazine<br>
    Lifestlye and arts focus<br>
    clean text blocks<br>
    largely photo-driven<br>
    Published in WV (believe it or not)</p>
    <p>What I need from my fonts:</p>
    <p>Serif family - Reasonable sans mate<br>
    No more than about 3 familys altogether<br>
    fresh look (Not garamond, or TNR)<br>
    OTF please, with SC, Ligs and Con. Alts.<br>
    Title, Subheads, callouts, captions, the WORKS</p>
    <p>How I will be abusing them:</p>
    <p>10/12  w/ -10/1000 letterspacing<br>
    8/9 captions<br>
    Justified... less hyphens.<br>
    I will figure the rest out when I am actually setting them up</p>
    <p>My Boss and Co. Like:<br>
    Garamond<br>
    Akzidenz Grotesk<br>
    Caecilia<br>
    and a whole pantheon of other specimens I showed them = clueless.</p>
    <p>Please, I know that this is alot of info, but you can live vicariously through me and pick anything you want, as I have an unlimited font budget(up to $300, LOL)</p>
    <p>Feel free to pimp your own work, or your friends, or your moms... :) TIA</p>
