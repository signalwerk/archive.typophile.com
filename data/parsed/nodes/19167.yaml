      <p>FANTASTIC suggestions everyone, I have examined most of them, but I will be re-examining them this week. My boss is carrying around the sheet of the Cæcilia sheets that I printed, I am going to try to pry them from his fingers...as I don't believe that is what I am looking for exactly. </p>
      <p>The reason for the negative tracking spec is that when I am showing sheets, they keep using the words tighter. I have Cæcilia set at 9/10.2 and -25/1000 tracking... and it may still be not enough. It is killing me. </p>
      <p>So far, I have liked the Fleischmann revivals alot, but I am not sure the x-height is what I need, since they keep talking smaller. I downloaded a pdf of it, and will be printing it tommorow. ( I LOVE TYPE SPECIMENS ) Thanks, everyone... your thoroughness and dilligence is much appreciated. I will be sure and post a proof of the *finished* product. I have to get my æss to work</p>
      <p>Oh yeah, Stefan, thanks for pimpin' and for Hattrick... what is the license on that anyway? I converted it to PC TT and would like to use it on my site...</p>
