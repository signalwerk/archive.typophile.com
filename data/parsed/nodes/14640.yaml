    html: <p>A few points one loose the twig as Bart suggests. The G has the shape of an ear with an ear ring hanging from it already. Maybe slighly modifing that shape will make it clearer what you are making. Over all the letter and word spacing needs major work. Start with one word get the spacing working then use that word as your benchmark for the other two. Good start keep going.</p>
