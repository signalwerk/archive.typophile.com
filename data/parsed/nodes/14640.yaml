      <p>Hey Forrest,</p>
      <p>I am sorry to say that it doesn’t work for me. The type is somewhere near okay (the lowercase e looks smallish, though), but the twig just doesn’t have the right feel. Too literal, in my opinion.</p>
      <p>I think the rather straight shape of the words collides with the loose treatment of the twig. The two should be a unity.</p>
      <p>The twig refers to the organic, but I think some reference to jewelry might be better.</p>
      <p>Keep up the good work! </p>
      <p>——————————————————————————<br>
      My work is a game. A very serious game [M.C. Escher]</p>
