      <p>I regularly weed out my font library, not for un-licensed fonts (which I don't have any of, thank you very much), but for cruft.</p>
      <p>It's truly a thought provoking experience, going through things and asking yourself "Do I need this?" "Do I want this?" "Will I ever use this, and why not?"</p>
      <p>You'll find that you can pare down your font menu significantly, without really impacting your ability to do your work.</p>
      <p>What I would do, because it is what I do, is if I see a font that I like, I try to visualize immediately what I would use it for. If not now, perhaps at a future date, but I always try to focus on actual use. Keeping in mind real-world use, not pie-in-the-sky wishfulness or greedy materialism, will really help you in adding to or paring down your font library.</p>
