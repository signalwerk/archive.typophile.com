    <p>Hi all,</p>
    <p>I know I'm going to touch on some topics which have definitely been written about at length here on Typophile. My intent is not to rehash any open threads...just point me in the right direction. </p>
    <p>I guess my question had its inception when I recently decided to weed out all the non-legit fonts on my system. I never really realized that there was a real connection between decisions I made when I loaded fonts onto my machine and decisions I made when deciding to spec a font for use. It’s hard to find a value in an otherwise masterful typeface when you may just as easily have a handful of equally apt alternatives on hand. Until recently (and this is true for the majority of designers I know) choosing a typeface for a job meant ticking through 1500+ typefaces (most of them non-legal) and occasionally buying something once something goes into production and you’re “forced to”.  </p>
    <p>My workflow has changed pretty dramatically now that the handful of fonts I use are ones I have researched, contemplated and purchased. It’s also difficult at times. There’s a lot of “standards” that I, frankly, just can’t afford. There are a handful of gems in the free-font world and I’ve also started to draw some of my own faces.<br>
    Do you all have any sage advice in the area of starting a type collection on a shoestring budget?<br>
    What, if any, great values are out there?</p>
    <p>Thanks</p>
    <p>chris</p>
