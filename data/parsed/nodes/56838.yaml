    html: |-
      <p><em>What, if any, great values are out there?</em></p>
      <p>Depends on your work. </p>
      <p>If you go by price per glyph, you've got to figure whether you would ever need all the glyphs in a big font.<br>
      For instance, if you buy a 10-member family of OpenType fonts with Latin Extended encoding and many features (small caps, OSF, etc.) for $300, is that a great value for you? Would you use all the weights? Would you use small caps, superior figures, fractions. etc? Do you need CE coverage?</p>
      <p>Would you be able to use the typeface for many years on work for different clients, or would it go out of fashion, or be too idiosyncratic (or too samey) for more than one client?</p>
      <p>But most importantly, do you think it's the kind of typeface you'd be comfortable working with, that would fit your style and make <em>your</em> work look good, and be effective for your clients?</p>
