      <p>If you're using Adobe Creative Suite, you should already have some professional OT fonts installed by default (Adobe Garamond, Minion, Caslon, Trajan, Myriad, Chaparral, Arno - depends on which CS version, and more). Then there are some nice, low-budget packages which I strongly advice:</p>
      <p>Ascender Creativity Font Pack<br>
      <a href="http://www.fontmarketplace.com/font/ascender-creativity-font-pack.aspx" title="http://www.fontmarketplace.com/font/ascender-creativity-font-pack.aspx">http://www.fontmarketplace.com/font/ascender-creativity-font-pack.aspx</a><br>
      You should get this even only for Today Sans, one of the best digital sans serif ever made - it truly shines.</p>
      <p>Adobe Type Basics OpenType Edition<br>
      <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1902" title="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1902">http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=...</a><br>
      Besides some fonts featued in CS, here you can find a couple of Slimbach's jewels like Utopia and Kepler, in regular, italic, bold and bold italic, open type.</p>
      <p>I had the chance to buy, for a very small price, old font collections from Corel Draw (Bitstream) and Deneba Canvas (URW Library): both contains hundreds of fonts from the early digital era, with limited glyphs and functions, but they work fine (Deneba offers them in TT and PS format) and you can find some great stuff too (like Monotype Grotesque).</p>
      <p>You could also have a look at the Softmaker MegaFont XXL 2.0 <a href="http://www.softmaker.com/english/megafont_en.htm" title="http://www.softmaker.com/english/megafont_en.htm">http://www.softmaker.com/english/megafont_en.htm</a>, a package whose legimity is debatable but which contains lots of true type fonts (clone?), some with small caps and old style figures (but no ligatures). I haven't had the opportunity to test these fonts in high resolution press, anyway, while I can swear on the funcionality of the Bitstream and URW original fonts.</p>
      <p>Also, Elsner and Flake site <a href="http://www.fonts4ever.com/free_font.php" title="http://www.fonts4ever.com/free_font.php">http://www.fonts4ever.com/free_font.php</a> offers a free Alternate Gothic, a nice display font. And don't forget the top quality free fonts by Jos Buivenga <a href="http://www.josbuivenga.demon.nl/" title="http://www.josbuivenga.demon.nl/">http://www.josbuivenga.demon.nl/</a></p>
      <p>That said, holding very few fonts in one's system can be a limit, or a challenge. Many great typographers based their work in using a very limited range of typefaces. As Slimbach states in The Elements of Typographic Style, it's bettere to have one fully functional font than hundreds of crap typefaces.</p>
