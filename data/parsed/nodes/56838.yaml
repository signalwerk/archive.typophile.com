      <p>&gt; Uli, is there anything special about the forged version of Palatino you mention in your link under the Softmaker section? </p>
      <p>I am not quite sure what you mean, but if you are alluding to this sentence:</p>
      <p>"It includes many original fonts of the Berthold period 1858–1993 no longer available elsewhere, e.g. the original Palatino by Hermann Zapf of 1950"</p>
      <p>then the situation is the following:</p>
