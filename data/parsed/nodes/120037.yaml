    <p>Hi, there!</p>
    <p>I have a problem with kerning using VOLT.<br>
    I completed kern settings in VOLT and it works, but only in VOLT. When I ship the font it recognize only kerning between numbers, but not between numbers and some letters (isolated letters eg.). </p>
    <p>How do you solve this problem if you have it?</p>
    <p>A.</p>
