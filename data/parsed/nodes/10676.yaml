    html: <p>I think usually the top of the S is smaller than the bottom. Eg. when I look at your S upside down it looks better. Randy Jones calls this the <a href="http://www.typophile.com/forums/messages/29/21083.html?1069882058" target="_blank">trapezoid effect</a>. I know you are limited by the monospace, but maybe trying the smaller tops will give you a solution. <br> <br>The the curves on your characters are so sweet for a monospace, it is amazing - well done. I think the K needs work, as well as the S. I like the first E and more conventional N better.</p>
