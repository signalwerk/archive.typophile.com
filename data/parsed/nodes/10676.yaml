    date_raw: 13 Aug 2002 — 2:25pm
    votes: null
    html: <p> Hi Jacques. I know what you mean and I and knew this may be an issue from the beginning. I set up the rules early on which included monoline, the slightly angular curves, flatening any curve if possible without sacrificing aesthetics, keeping all the usual "G" "O","Q","S"and "U" withing the parimeter of the base character height. Character width is not designed for a true monospaced OCR, but I wanted to make keep it going in that direction aesthetically, so several letters like the "M"'s are narrower because of this. I tried some wide "I"s but I didn't like them so went more in the direction of small slab srifs on the "I". There was consideration to having 2 alternates of each letter character, which i will properly still do. one of the could be optically adjusted, which is actually a really good idea you brought up. <br>Marketing. I am not sure. I know Rod at PsyOps and would be proud to be distributed by him. He is very ethical and trustworthy as well as talented in the design and distribution of type. <br>I am currently working on some promotional collateral for Psy/Ops's latest release "Reform". Emigre would properly be the most prestigious distributor but they are really hard to get distributed by, according to people I know who have approached them with good designs. Lineto is premium, I like their collection a lot and I do think it would be the best match aesthetically. </p>
