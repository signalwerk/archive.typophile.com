    html: <p> Thanks Dylan. I think it is about time I get working on this face again. I showed it as work in progress when I met with a multi-national ad agency this past friday and they were impressed. <br>They would like to hire me on freelance basis especially for type and photoshop work which are my strongest skill sets. I was thinking during the meeting how it is kind of pathetic that I am so into type yet have never finished a full face. I guess i get a bit overly critical which often kills the joy of making type. In the beginning I was working on this constantly for a few weeks and got stuck in the lowercase which is about 40% completed. I am thinking I will properly finish the unicase first as itis something I use a lot. Thanks for the encouragement. I will post as it progresses. Ole </p>
