    html: |-
      <p>Hi Felix, welcome to Typophile. </p>
      <p>Are you a student? If so, where do you study?</p>
      <p>I recommend the following books to help get you started.</p>
      <p>Bringhurst, R. (2004). <em>The Elements of Typographic Style</em>. Point Roberts,WA: Hartley &amp; Marks.</p>
      <p>Müller-Brockmann, J. (1981). <em>Grid systems in graphic design</em>. Arthur Niggli Limited, Switzerland.</p>
      <p>Tschichold, J. (1991). <em>The form of the book. Essays on the morality of good design</em>. (H. Hadler, Trans.). In R. Bringhurst (Eds.), Washington, United States: Hartley &amp; Marks Publishers Inc. (Reprinted from <em>Aufsätze über Fragen der Gestalt des Buches und der Typographie</em>, by J. Tschichold, Ed., 1975, Basil, Switzerland: Birkhäuser Verlag).</p>
      <p>Looks like you have some reading ahead of you!</p>
      <p>(I would also recommend using your real name as your screen name. It has been my experience that you get more and better responses that way)</p>
