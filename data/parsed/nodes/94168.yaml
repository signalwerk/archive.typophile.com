    html: |-
      <p>1) I thought I'd try to do a text face influenced by the marks you might get with a fat marker pen. I never actually used a marker pen so it's kind of an imagined result. All the rounds from stems (b, d, p, q, r, m, n, a) have the same straight bit going to a curve.<br>
      2) It barely has a roman, but it will have an italic at some point. I've got a new script font almost done then I might make this the next one I get round to, so it'll probably be in the critique section soon.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cedion_6679.JPG"></div><br>
      That e needs some work!<p></p>
