    html: <p>According to Jan Middendorp in his book ‘Dutch Type’ from 2005 the only digital version is the light and medium version from Dennis Ortiz-Lopez. I compared it with the one in my specimen from LA and I think he should never called it Egmont. I think there is too much difference and it hasn't got the finesse the original has. The ‘W’ and ‘w’ are terrible! The Italic is totally different but he said already that this was not made to look like the one from De Roos.</p>
