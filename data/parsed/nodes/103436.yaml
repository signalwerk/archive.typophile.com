      <p>Late, I know, but was just made aware of this post. I am aware of two similar versions, one is the mentioned Euboea - which is a copy of Rakowski's Elizabeth-Ann and is also known as Martina and Queen Elizabeth. The other one is the OPTI De Roos Inline Initials, also copied as if there were no tomorrow (Debut, Theodor Initials, Dagenham DB). As usual, for both versions no guarantee that the lists are complete.<br>
      See <a href="http://koeiekat.com/images/egmontinline.png">http://koeiekat.com/images/egmontinline.png</a></p>
