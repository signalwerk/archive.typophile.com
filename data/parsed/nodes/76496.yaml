    <p>Our typefaces Adelle and Maiola were selected in the first Ukrainian typeface competition and then exhibited at the Rutenia Calligraphy &amp; Typography Festival in Kyiv. Lectures, master-classes and an open-air workshop "Street Calligraphy" were all part of the two-day event. The exhibition though runs until the 22nd November. On the festival website it reads: "The festival mission is to revive an interest in calligraphy and typography in Ukraine, to provide a place to communicate for calligraphers, typeface designers, typographers, publishers, creative professionals, advertising industry workers, art students, and all the people who care about visual form of word or book as well as about its content."</p>
