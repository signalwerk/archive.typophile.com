      <p>I could see Justin Trudeau leading a resurgent Liberal party in the next election. If, however, there were a merger of the Liberal party with the NDP under present circumstances, the result would be led by Jack Layton - for obvious reasons.</p>
      <p>Then, after Justin Trudeau's term as Liberal leader ends - perhaps after only a few years if the resurgent Liberals fail to defeat Harper, the race will perhaps be between Bob Rae and Belinda Stronach - whoever wins, Liberal fortunes will decline again (even if not quite so precipitously), and so there will be another Liberal leadership convention.</p>
      <p>If the Liberals utterly fail to regain ground in Quebec under Justin Trudeau - or whoever their next leader may be - then being subsumed into the NDP is possible. But I would not bet money on that.</p>
