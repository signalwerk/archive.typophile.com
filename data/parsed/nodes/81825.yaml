    <p>Times Roman, the typeface of the Liberal Party, went down to a substantial defeat in the Canadian general election yesterday.<br>
    The NDP's Dax (albeit often doctored) made unprecedented gains, but the eventual winner was not a typeface per se, but a typographic logo, the Conservative "Möbius C".<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/470_iggy_kennedy_091021_6099.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/PC_090314jack_layton_npd_8_5420.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Federal-Conservative-leader-Prime-Minister-Stephen-Harper-during-an-election-campaign-stop-in-Vancouver_4212.jpg"></div><br>
    A newcomer to the federal font scene was the Greens' Avant Garde, OK, it's er, 20th Century??<br>
    <div class="imageWrap"><img src="http://typophile.com/files/elizabeth_may_4864.jpg"></div><p></p>
