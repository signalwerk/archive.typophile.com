    html: |-
      <p>Nick: <em>a merger of the Liberals and NDP</em></p>
      <p>Both unlikely and unwelcome, I think. The mainstream press in Canada is busy trying to paint the election outcome in terms of Conservatives and NDP moving towards the centre, squeezing out the Liberals. But the NDP moved towards the centre a long time ago, and it made no difference to their political fortunes prior to this election. Harper's Conservatives were found in contempt of parliament for failing to disclose spending to enable the state to lock up more Canadians and conduct air strikes on more foreigners, hardly centrist policies. Everyone I've talked to since the election thinks Canada has taken a step towards much greater polarity, and the Liberals got slaughtered at the polls not because the Conservatives and NDP had moved onto the centrist turf but because the centre has been evacuated by the electorate. I don't get any sense that people who oppose the Conservative policies for the country want the NDP to be centrists taking over Liberal positions. I heard <a href="http://www.youtube.com/watch?v=ONWn6hfd7Uk" rel="nofollow">Tommy Douglas</a>’ name mentioned more times during this campaign than in any recent election. I suspect a great many people who voted NDP in this election are already somewhere to the left of the party, especially in Quebec and out here.</p>
      <p>But you're right about the Canadia/en Airlines logo. :)</p>
