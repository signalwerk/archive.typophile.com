    html: |-
      <p>If you just want to know what the names of the typefaces are (loads probably don't even have names/have never been digitized) then I am of no real help. But if you want to find fonts that are similar (and can be used for modern designing) then the first thing I would check is Walden Fonts for anything close to that style. They have a good selection of those old-timey display faces; and while they may not be exact matches they will be somewhat close. There are plenty of other places </p>
      <p><a href="http://waldenfont.com" title="http://waldenfont.com">http://waldenfont.com</a></p>
