    <p>Hi Everyone, </p>
    <p>I'm new to Fontlab, and this forum has be extremely helpful for figuring out how to create my font.  So thank you all for that! I have one question that I was hoping you lovely type designers might be able to help me with. I'm creating an all uppercase font with programed faux randomization, with 3 glyphs per character. I've spent the longest time figuring out how to get that to work, and it's finally running smoothly. Now, after all that work I don't know what to do with the lowercase characters!  For now they're empty,  Is there anyway to just scrap the lowercase glyphs? I really don't need them. Or if I copy the character, metrics, and kerning of my "default" glyphs to the lowercase, how do I also program all the contextual alternates to follow it? If I program a=A will it then abide by the programming of that uppercase "A?"  As it stands, I have to hold down shift or press caps lock to use my font.  Thanks in advance for your help! </p>
    <p>Cheers!</p>
