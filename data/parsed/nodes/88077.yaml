    html: "<p>Are you going to print this letterpress? This makes a big difference. If you are going to print it letter press, then one of the classic metal faces that look anemic in offset printing will probably be good in polymer letter press: such as digital <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/agfa/bembo/\" rel=\"nofollow\">Bembo</a>, or <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/agfa/electra-lh/Electra\" rel=\"nofollow\">Electra</a>. Otherwise, you might want to use a font that was popular in letter press, and has been re-done to emulate letter press, such as <a class=\"freelinking external\" href=\"http://new.myfonts.com/fonts/agfa/bembo-book/\" rel=\"nofollow\">Bembo Book</a> or <a class=\"freelinking external\" href=\"http://www.linotype.com/795518/parkinsonelectraregular-font.html\" rel=\"nofollow\">Parkinson Electra</a>, though I'm not sure whether the latter is beefy enough. I might mention also <a class=\"freelinking external\" href=\"http://www.fontbureau.com/fonts/WilliamsCaslonText/\" rel=\"nofollow\">my own Caslon revival</a>, <a class=\"freelinking external\" href=\"http://ilovetypography.com/2010/07/26/reviving-caslon-the-snare-of-authenticity/\" rel=\"nofollow\">discussed here</a>, which is meant to capture the feeling of the letter press versions of Caslon at text sizes.</p>"
