    html: |-
      <p>Ascenderfonts sell some pre-digital typefaces for 20USD per weight. Those pre-digital ones there have however only around 250 glyphs, other typeface-vendors give you the full character-set and ask for the full money. </p>
      <p>@Andreas: the one you linked yourself.</p>
      <p>Sorry to be offtopic here, but I have to say I came to realize that Andron is one of a kind. One would think that the market for renaissance and baroque typefaces (equals (?) old style) is saturated. However, besides the wide character set I find Andron unique in its design, as (1) it has both character to the individual glyph, as well a harmonic appearance on a page and it is not too reductionistic it its drawing. Some recent text serif typefaces, although well balanced and harmonic, are somehow generic, as they are too “digitally conceived” in a way. Plus (2), I love how the “f” is both beautiful and does not create collision with non-english characters.</p>
