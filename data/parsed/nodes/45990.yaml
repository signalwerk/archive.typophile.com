      <p>I guess what rubs me the wrong way about your posts, John, is that you phrase your opinions as though they were objective fact. The fact is, you prefer Syntax, and I can’t see why, now that it’s 2008 and so many other options have appeared since Syntax. Syntax starts to look weird and clumsy at large sizes, and has a limited range of weights. It’s a pure humanist sans, like Caspari, Bliss, Freight Sans, Haarlemmer Sans, Scala Sans, etc, with the typical low contrast. The more modulated options like Legacy Sans, Amira, Beorcana, Optima Nova, Chianti and Argo are better for longer text.  </p>
      <p>Often I get the feeling that you resist even appreciating new designs because they represent a financial outlay. When people ask for recommendations, their concerns and budget may be different from yours. </p>
      <p>Chris: Avenir is overtly geometric. It’s been called “the better Futura” and is even named to pay homage to Futura. Gotham isn’t all that readable either; what it has going for it is its big x-height and wide, open shapes. Still pretty monoline and not very humanist. </p>
      <p>For yet another addition to the world of humanist sans faces, see <a class="freelinking-external" href="http://www.linotype.com/5300/berlingnovasans.html">Berling Nova Sans,</a> an addition to the updated Berling family by Linotype.</p>
