      <p><cite>The sans faces mentioned by Chris above, though excellent, do not offer oldstyle figures (except for one version of Futura from Berthold)</cite></p>
      <p>That’s plain wrong. Both <a href="http://www.linotype.com/53781/frutigernext-family.html">Frutiger</a> and <a href="http://www.linotype.com/90672/avenirnext-family.html">Avenir</a> are available with old-style figures, in their ‘Next’ incarnations. <a href="http://www.adobe.com/type/browser/P/P_1706.html">Myriad</a> of course has osf, too. And there’s even a <a href="http://www.fontshop.com/fonts/singles/monotype/gill_sans_book_sc_osf/">Gill Sans</a> with osf. (The latter should be proof enough that the availability of osf is not the sole and crucial criterion for  choosing a text face.)</p>
