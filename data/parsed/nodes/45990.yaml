    date_raw: 7.Jun.2008 9.07am
    votes: null
    html: <p>Agree with Evan...often, it’s not a choice of sans-serif alone, because in your design work a serif may be doing the primary work, leaving you to choose a matching sans for sidebars and secondary uses. Another reason I often favor Syntax is how well it matches and blends with the serifs my clients use. But there are also some funkier choices on the market worth looking at too—Anivers, Prokyon, and Giacomo, which offer fresh subtle details not always found on older sans classics, and these blend better with serifs for that very reason. You’ll have a lot of fun researching such choices.</p>
