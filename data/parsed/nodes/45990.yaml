    html: <p>As I’ve advocated on other threads, Linotype Syntax with oldstyle figures is the best of all sans text faces, mainly because the base weight is so well judged, just a tad lighter than so many other starting weights, so it has just a tad more delicacy than its competitors. The sans faces mentioned by Chris above, though excellent, do not offer oldstyle figures (except for one version of Futura from Berthold) and nowadays all my clients demand oldstyle figures. That’s a shame, especially with Avenir, which otherwise I adore. Josh Darden’s Freight Sans is a good alternative to Gill Sans because it does offer default-loaded oldstyle figures while maintaining a similar look. Check that one out too.</p>
