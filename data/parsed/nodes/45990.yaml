      <p>I think when it comes to choosing a typeface, you have to consider a lot more that humanist or geometric, personal abuse or delicacy of a font — put them to test.</p>
      <p>I agree that as a rule, a humanist style sans is a great choice, and I would definitely  begin with that. But grab a couple old stand-by’s (like gill sans, helvetica, syntax, myriad, and so on) and see what feel right.</p>
      <p>One other thing to consider is the other typefaces you are using. What serif fonts are you using?</p>
      <p>Good luck,</p>
      <p>Evan<br>
      <a href="http://evanmade.com/">evanmade(dotcom)</a></p>
