      <p>As requested, I’m giving my own opinion, Crossgrove...perhaps you can do so too without personally abusing other posters.</p>
      <p>I’ve used Legacy Sans for long texts but find it too low-slung, which of course was intentional in order to match its serif version.<br>
      I’m also using newer sans with more funky details like Anivers and really liking them, but they may be too edgy to recommend more widely.</p>
      <p>Thanks Florian for those osf updates...OpenType is now starting to fill glyph gaps at long last...very encouraging indeed.</p>
