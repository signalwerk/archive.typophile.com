      <p>I have searched my reference books and have not been able to locate this. It is probably something that was not used in the U.S., or I think it would have showed up in at least one of my books. It is not in the Jaspert "Encyclopaedia of Type Faces" or "Rookledge TypeFinder" either.</p>
      <p>Can I ask why you didn't post this in the part of the Type ID Forum for unsolved fonts?</p>
      <p>Where I found your question is an area where I would not have expected to find open questions, as this category is supposed to be Solved ID's only. People rarely would be looking into the Solved ID section.</p>
      <p>- Mike Yanega</p>
