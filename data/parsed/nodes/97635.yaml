    <p>I've looked everywhere for this, online, old type specimen books and I simply can't recognize it. </p>
    <p>A letterpress printer friend of mine suggested it could be a customisation on Windsor or Hallamshire Old Style, but I think it maybe quite a big customisation for a book binder.</p>
    <p>The book was published in London, around 1924.</p>
    <p>Any help on this is much appreciated,</p>
