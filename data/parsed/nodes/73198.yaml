      <p>It's not just a question of one foundry's cut of a particular face being better than another's, they may well be different interpretations which appeal to different people for different reasons, and to the same person on different occasions.</p>
      <p>But choosing a font isn't the be-all and end-all. Once you have decided on a font, if you've never used it before you still have to become familiar working with it, and experiment with the setting for the job in hand. So why not trust your instinct in the first place, and then trust your skill to make your choice work, rather than second-guessing yourself to distraction.</p>
