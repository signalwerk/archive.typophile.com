      <p>Rose Marie - </p>
      <p>If you look, you'll see that there's a forum named "Type ID Board", which is where people hang out who like identifying fonts, rather than this 'general discussion' group.</p>
      <p>However, before you move it there (or someone moves it for you) I have a couple of questions:</p>
      <p>What do you mean "actually located on 'this' site"? What website are you talking about? Or, where did you find these images? Offhand, they look like they're from an alphabet of raster graphics (like jpg images) without the clean outlines that a font will usually have. Either that or they're a font created from a very low resolution scan.</p>
      <p> - Herb</p>
