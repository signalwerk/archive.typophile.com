      <p>Those are almost certainly Initial Caps rather than a complete UC and LC font and probably are ca. 1870's.</p>
      <p>I too could not find the font either in current fonts, specimen books on hand or the net, but I have a big shortage of European specimens so it may have originated there. When you do your search, I suggest keywords: ornate, initials, ornamented, etc. in various combinations and see what you may turn up.</p>
