  - id: 360792
    user: 20494
    date: 2009-08-10T04:02:00
    date_raw: 10.Aug.2009 4.02am
    votes: null
    html: |-
      <p>Transitional and Modern Serifs should work quite well, but also Garaldes like Garamond – depends on what kind of atmosphere you aim at. If you are looking for a more human, legible, friendly touch, choose an open typeface from the Garalde subclass like Plantin, Galliard, Swift or Proforma For more neutrality browse the Transitional/Baroque like Utopia, Rotation, Farnham. More classy, austere look in the areas of Modern (bracketed) typefaces.</p>
      <p>good suggestions: <a href="http://www.fontshop.com/fontlist/subclasses/" title="http://www.fontshop.com/fontlist/subclasses/">http://www.fontshop.com/fontlist/subclasses/</a><br>
      <a href="http://www.fontshop.com/fontlist/alternatives/times_new_roman/" title="http://www.fontshop.com/fontlist/alternatives/times_new_roman/">http://www.fontshop.com/fontlist/alternatives/times_new_roman/</a></p>
      <p>I would recommend a rather broad face with not too much contrast, something sturdy, real estate.</p>
