    html: <p>Thanks to all of you... I want to create a brochure for a real estate agency... I am using Helvetica neue and I would like to complement it with another one for the text within the brochure (long sentences). I tried using the same font everywhere (different variations though) but while I like the font for headers, logo letters and so on, I found it very cold and too... mechanic?... for long paragraphs of text. Was wondering if there was another font I could use to ease a little on legibility. Your suggestions are welcome.</p>
