      <p>It's all just on the screen.</p>
      <p>Apparently, all of these programs use different anti-aliasing techniques. There is no monitor sharp enough to draw a slightly slanted line without jaggies, and it only depends on the drawing algorithm how bad they are.</p>
      <p><cite>However, when printed the jagginess of those edges is observed in outputs from both Illustrator and TextEdit.</cite></p>
      <p>How much dpi? 300? 600? Inkjet, laser? Offset printing?</p>
      <p>If it really bothers you (as in "I want to have it look good, even on a 50 dpi '90s VGA monitor"), make the lines perfectly perpendicular to the horizontals and/or verticals, and hope no-one rotates your font.</p>
