  html: |-
    <p>I'm going to be paying a short visit to San Francisco in a few weeks and was wondering if anyone here has any bookstore recommendations. I'm not particularly looking for bookstores that sell books that are still in print, although if there is a bookstore that has a particularly fantastic design section, I might check it out anyway. What I'm really looking for are antiquarian booksellers, especially sellers that carry the usual suspects (books on the history of typography, printing, the book trade, writing systems, calligraphy, and graphic design).</p>
    <p>I'll be driving around a bit, so recommendations in the surrounding environs are OK, too. But I don't have time to make any longer trips to any other parts of the state, unfortunately.</p>
