    html: <p><a href="http://www.brickrow.com/cgi-bin/brickrow" rel="nofollow">Brick Row</a> is probably the best antiquarian shop in San Francisco. It is located in office space at 49 Geary Street, near Union Square. <a href="http://www.johnwindle.com" rel="nofollow">John Windle</a> is in the same building, and I purchased a nice Estienne leaf book there on my last visit.</p>
