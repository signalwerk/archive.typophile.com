      <p>If you're in Northbeach (A San Francisco neigborhood just north of Chinatown, which is on most people's list anyway), try "William Stout Architectural Books".</p>
      <p>It's not an antiquarian bookstore, but it does have a small, dense typography section plus a good design section. They have two locations now. The Northbeach one is better (I think).</p>
