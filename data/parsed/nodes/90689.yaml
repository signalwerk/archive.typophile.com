    html: |-
      <p>You can do this in FontLab with the Paste Special command. Select the base glyph in the font window and Copy. Then select all the component glyphs and select Edit &gt; Paste Special and choose Left Sidebearing, Right Sidebearing, and Adv. Width from the dialog.</p>
      <p>Note: you may want to check the Use Measurement Line While Copying Sidebearings option at the bottom if you have diacritics that extend horizontally beyond the base glyph (and set your measurement line somewhere in a “safe” zone beforehand, obviously).</p>
      <p>Of course, if you have a large number of glyphs that you want to operate upon, then a Python script will work better, and I’m sure someone has probably written one.</p>
