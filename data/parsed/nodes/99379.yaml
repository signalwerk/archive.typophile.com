      <p>I would prefer to make a serious reply to this post.</p>
      <p>As I have noted, the "philosophical" reasons for this proposed change are inherently devoid of merit to anyone who isn't a Hindu; how much relevance they may have to most members of that faith is a question I am not competent to judge.</p>
      <p>It's true that English with the unmodified Latin alphabet is widely used in India, and the OP's suggestion does not seem to have caught on there - but advocating something like this, however eccentric it may seem, at least has an intelligible basis in that context.</p>
      <p>But what I would note is that many if not most commercial fonts have licensing restrictions that prohibit modifying them, even for your own use. Thus this could be an unwise move.</p>
