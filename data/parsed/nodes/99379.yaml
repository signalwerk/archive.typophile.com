    <p>Turn various things you use and buy to non-suicidal fonts using ebay<br>
    for example at  <a href="http://www.ebay.co.uk" title="www.ebay.co.uk">www.ebay.co.uk</a> / <a href="http://www.ebay.com" title="www.ebay.com">www.ebay.com</a> </p>
    <p>Do not use the suicidal k/K shaped letter and instead use non-suicidal<br>
    क/क shaped letter.  Go on ebay internet site and in the search area<br>
    put ‘custom font’ or similar and a bunch of customization services for<br>
    things should get listed. </p>
    <p>Examples of customization things:<br>
    Iron on transfer to use on any materials £2.99 excluding postage<br>
    Personalized name badge £1.99 excluding postage<br>
    Personalised T-shirt £9.99 excluding postage<br>
    Customized letter / number sign £9.95 each excluding postage<br>
    Custom font decals £2.65 excluding postage<br>
    Customized plastic letters and numbers £0.99 each excluding postage<br>
    Custom motor car etc sticकers £2.49 excluding postage<br>
    Custom internet site window, motor car sticकers £3.49 for 2 </p>
    <p>GET non-suicidal BBT or Rail Model fonts:<br>
    <a href="http://www.archive.org/details/BbtFont" title="http://www.archive.org/details/BbtFont">http://www.archive.org/details/BbtFont</a><br>
    <a href="http://code.google.com/p/railmodel/downloads/detail?name=RailModel.ttf&amp;c" title="http://code.google.com/p/railmodel/downloads/detail?name=RailModel.ttf&amp;c">http://code.google.com/p/railmodel/downloads/detail?name=RailModel.ttf&amp;c</a> </p>
    <p>SEE philosophical reasons for not using suicidal k/K shaped letter:<br>
    <a href="http://Kalphabet.googlepages.com" title="http://Kalphabet.googlepages.com">http://Kalphabet.googlepages.com</a></p>
