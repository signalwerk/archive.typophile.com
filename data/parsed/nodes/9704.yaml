  html: <p>I am processing some illustrations, from paintings to lithograph <br>look alike flat colors Illustrator files ; I would like to know <br>how, if possible, I could paste collected (exported .ai) Photoshop <br>paths from a X-Y position to the same X-Y position of a main <br>Illustrator document (same size document -- 'illustration processed'). <br>I am on Illustrator CS, Macintosh. <br> <br>Thank you, <br>Alessandro</p>
