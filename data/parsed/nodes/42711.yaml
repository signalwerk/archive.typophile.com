  html: |-
    <p>I am working on a logo for a website called ’foto8’ and would like to hear your comments/criticisms on where I have got to thus far. </p>
    <p>Background information: The logo is also to be partially used on a bi-annual magazine called ’8’ and I am working on trying to incorporate the 2 logo’s in order form some kind of a cohesive identity (so the website is called ’foto8’ and the magazine just ’8’ as a number). The style of letters used is in tune with the headline typography of the magazine, so I wouldn’t want to deviate from that too much. </p>
    <p>In particular, it would be good to have comments on how readable/effective it is as a logo; as well as ideas on achieving the best balance between the ’f’ and the ’t’; and any other comments would be much appreciated.</p>
    <p>Thanks,<br>
    Mike</p>
