    html: <p>When I originally generated the font, I was still running 9-- <br>I've only recently upgraded to X. <br> <br>After a little more testing, I've found that all of the issues <br>crop up in FH10. If I set everything up in, say, AI10, it <br>works just fine. <br> <br>I tried regenerating some of my older font files in Classic, <br>(running OS X) and they don't seem to have any issues. <br> <br>Would stray or overlapping points cause this issue?</p>
