    votes: null
    html: <p>Have you tried starting up with Classic as the boot OS  <br>(as opposed to launching Classic from inside OS X)? <br> <br>I'm not familiar with this particular bug, but give that <br>a try. Sometimes Classic apps don't play well when <br>running inside OS X. <br> <br>Although, as some others have discovered, some newer <br>Macs won't boot into Classic.</p>
