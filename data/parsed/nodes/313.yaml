  html: <p>I'm having trouble generating a font from FOG... <br> <br>I'm running OS X 10.2.6 w/Classic 9.2 and FOG 4.1.5 <br> <br>Every time I generate the font in question, the capital A <br>does not show up and none of the outlines are generated. <br>I've tried correcting the path direction and copying all the <br>characters into a new font file, to no avail. <br> <br>I tried generating one of my old font files, and it seemed to <br>work fine.  <br> <br>Does anyone have any troubleshooting tips or suggestions?</p>
