    html: "<p> Beautiful. It has a nice Bayer flavor. It's a  <br>rare gem of a bitmap where multiple sizes and  <br>weights feel like a cohesive family. <br> <br>The U and V seem very close. Perhaps the U needs  <br>a stem. <br> <br>I see you're using Verdana-like widths for  <br>the 'regular' weight--great for readability. The  <br>'thin' set is very nice. As much as I like  <br>Verdana, I've often wished it had a more elegant  <br>set, that wasn't so clunky (New Yorker's would  <br>say horsey) at 11pt. <br> <br>I'd love to see a text setting... even if it's in  <br>French. <br> <br>My humble plea: sell this to Microsoft so  <br>they can distribute it freely with their browser.  <br>It would make the Web a much better place. </p>"
