    html: <p>Also thought instantly to Avenir but if you want to match 'COMMUNITY' word with a single typeface, Gotham is the only one I know that could fit both lettering at the same time mainly because of /M pointy and above baseline centre vertex, a specific earmark of Gotham.</p>
