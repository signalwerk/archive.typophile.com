  html: |-
    <p>I'm trying to identify the font used in "new hope". I think it may be Gotham, but the bar on the "e" seems to be the same width as the rest of the type. If this is bold, and if it is Gotham, I have seen the bar on the "e" thinner when it is set to bold, black or ultra. </p>
    <p>Is it a typeface other than Gotham?<br>
    Is it possible that the designer adjusted the bar?<br>
    Are my eyes playing tricks on me? </p>
    <p>I would appreciate any help in ID'ing this font, thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/new_hope_3830.jpg"></div><p></p>
