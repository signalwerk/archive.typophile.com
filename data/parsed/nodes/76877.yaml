    <p>Hello all,<br>
    I was browsing the web for fonts for my next tattoo idea, when I came upon this website.  I saw many great postings, so I decided to see if anyone could possibly help me find pictures of the font in a very early bible from Italy, from Rome or the surrounding area if possible.  I just need a few pictures, so I can have my artist draw from them.  I am getting the 23rd psalm written out across my chest, and I wish to have the most accurate font possible.  Thanks all!</p>
