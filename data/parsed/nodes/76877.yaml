    html: <p>As it happens I'm reading Fred Smeijers' Counterpunch at the moment, and there's a very nice example of Pierre Haultin's (French, not Italian) Nonpareille Romaine, a 6 pt roman punchcut from 1557, originally made for bibles. Alternatively you might want to look in to Francesco Griffo (Italian), who around 1499 cut the basis for what later became Bembo.</p>
