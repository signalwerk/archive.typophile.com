      <p>You wrote: "I know that Old Navy uses Eames in their in-store displays, website, and even on their apparel, and I didn't see the font 'credited'."</p>
      <p>House Industries license reads, in part: "...agrees to credit House Industries as the trademark and copyright owner of the House Industries fonts and list the font names, wherever and whenever design, production, or any other credits are shown."</p>
      <p>In other words, if other credits (for instance Set Designer: John Smith) are given then credit must also be given for House Industries if their fonts were used.</p>
