      <p>&gt; the purchase of a license for your client is required</p>
      <p>I assume they're thinking that clients sometimes ask the designer to email them copies of the fonts when the project is done (for future editing, etc.). </p>
      <p>And that does indeed happen occasionally, although in my experience it doesn't happen very often, because clients also need the native files to do any editing, and small clients don't own the necessary software (InDesign, Photoshop or whatever), and larger corporate clients usually understand the issue of licensing already.</p>
