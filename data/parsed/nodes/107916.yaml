    <p>I am reading through the license for Eames by House Industries:</p>
    <p>"If you are an advertising agency, acting on behalf of an advertising agency or otherwise acting in a similar capacity or for the benefit of a third party, the purchase of a license for your client is required..."</p>
    <p>Does this mean that I have to purchase a license for this font every time I use it for a different client if I am an independent designer?  That isn't how I have understood font licenses to work.</p>
    <p>Also,</p>
    <p>"The user of this House Industries font software agrees to credit House Industries as the trademark and copyright owner of the House Industries fonts and list the font names, wherever and whenever design, production, or any other credits are shown."</p>
    <p>This seems a little absurd.  Does this mean whenever the font is used, it must be identified/credited at the bottom of the design or something?  I know that Old Navy uses Eames in their in-store displays, website, and even on their apparel, and I didn't see the font 'credited'.</p>
