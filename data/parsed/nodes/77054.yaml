  html: |-
    <p>Hello everyone, </p>
    <p>I'm putting together PowerPoint templates (yeah, I know...) for two classes: Roman History and Greek History. I'm not the one teaching these classes, which by the way are at college level, and I don't have any of the material so I can't let the content inform the design.</p>
    <p>At this beginning stage of the project, I'm looking for inspiration. Do you have any samples of well designed books/magazines on Roman/Greek art? </p>
    <p>And to make this related to typography, any suggestions regarding typefaces? For the titles I might try to achieve an inscribed letters effect (if I go with a rock surface background, and I can pull it off in PPT).</p>
    <p>If all goes well, I might be posting here screenshots of the work in progress over the next two weeks. </p>
    <p>Thanks for your help.</p>
