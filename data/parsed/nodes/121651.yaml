    <div class="node-spam-content"><p>Instagram's old logo </p><div class="imageWrap"><img src="http://typophile.com/files/InstagramLogoOldVer_3581.jpg"></div> looks like Billabong <div class="imageWrap"><img src="http://typophile.com/files/BillabongAsInstagram_5958.gif"></div> <a href="http://www.myfonts.com/fonts/typeassociates/billabong/" title="http://www.myfonts.com/fonts/typeassociates/billabong/">http://www.myfonts.com/fonts/typeassociates/billabong/</a> and the lettering of the reworked logo <div class="imageWrap"><img src="http://typophile.com/files/InstagramLogoRemakeByMackeySaturdayA_4444.jpg"></div> which was created by Mackey Saturday, is apparently a smoothed out revision rather than a different font.  <a href="http://taufanwords.wordpress.com/2013/08/31/the-fonts/" title="http://taufanwords.wordpress.com/2013/08/31/the-fonts/">http://taufanwords.wordpress.com/2013/08/31/the-fonts/</a><br>
    I would be interested in opinions as to which digital font is closest to the new logo.<br>
    Thanks.<br>
    Don<p></p>
