      <div class="comment-spam-body"><p>Edited:<br>
      Many thanks to both of you for the font suggestions. Quite helpful.<br>
      Ryuk, your critique is perceptive Gives me a better insight into the merits, or perhaps demerits, of the redesign. I agree a cursive style  _s_ works better when it is allowed to punch above the X-height. The cursive letter _r_ is always a problem. Handling the _gr_ link is particularly difficult. Should the tail of _g_ snake up to follow the pattern of letters like _a_ and _e_, compare to Aaron Script by Seniors </p><div class="imageWrap"><img src="http://typophile.com/files/AaronScriptAsInstagramSM_4703.jpg"></div> or should it stay below the baseline and allow a break in the cursive structure. I wonder if that would have been a better version for _Instagram_? compare to Shintia Script by Seniors<br>
      <div class="imageWrap"><img src="http://typophile.com/files/ShintiaScriptAsInstagramSM_6139.jpg"></div><br>
      Riccardo, indeed Authentica is close to clonesville -- "legitimacy" in the font business is often an oxymoron that matches "jumbo shrimp." :)<br>
      Just for ease of future reference:<br>
      <a href="https://creativemarket.com/Seniors" title="https://creativemarket.com/Seniors">https://creativemarket.com/Seniors</a><br>
      <a href="https://creativemarket.com/artimasa" title="https://creativemarket.com/artimasa">https://creativemarket.com/artimasa</a><br>
      Don<p></p>
      </div>
