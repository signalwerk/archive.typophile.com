      <p>About the Instagram reworking, I understand the need to smooth the logo down and to make it more a logo and less a word set in a nice font. But I think the result took away too much of the liveliness from the original. In this regard, for the g_r pair probably a more “twisted” curve would have helped (less tame loop for |g|, less wide counter for |r|, a bit like your Fertigo Script sample*).<br>
      As for Authentica, it’s not the first time someone is called out for ripping off Wisdom Script (see <a href="http://typophile.com/node/93171" title="http://typophile.com/node/93171">http://typophile.com/node/93171</a>).<br>
      If you need to “improve” upon an existing script, at least do it with something which allows it (example: <a href="https://www.behance.net/gallery/Blenda-Script-Free-Font/13832171" title="https://www.behance.net/gallery/Blenda-Script-Free-Font/13832171">https://www.behance.net/gallery/Blenda-Script-Free-Font/13832171</a>).</p>
      <p>* Although in Fertigo |g|’s loop could look a bit cramped, and the joining a bit thin.</p>
