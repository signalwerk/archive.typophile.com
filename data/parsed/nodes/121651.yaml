  - id: 594527
    user: 205259
    date: 2014-11-29T05:41:00
    date_raw: 29 Nov 2014 — 5:41am
    votes: null
    html: |-
      <div class="comment-spam-body"><p>Good point: liveliness vs. regularity in script font design. This seems to me to be perhaps the most difficult issue for a script font maker. The new _Instagram_ logo does indeed seem to emphasize regularity at the expense of liveliness.<br>
      Blenda Script as a remake of Lobster -- one of the most successful font designs of recent years -- is not close to _Instagram_ because it is too crisp and regular for a match. Is it an improvement? Perhaps. In any case, It looks like a good font for some uses.<br>
      Thanks for the comment on the _gr_ pair issue.<br>
      Don</p>
      </div>
