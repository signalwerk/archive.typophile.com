      <p>Sorry to somewhat hijacking the thread, my links were intended to illustrated points only tangential to the main topic.<br>
      On the question on which digital font is close to the revised Instagram logo, I’d say that the closer general style is the modulated-but-not-too-contrasted upright brushy cursive favoured by vintage advertising, sign painters and phototype.<br>
      Some examples:<br>
      <a href="http://www.myfonts.com/fonts/typesetit/style-script/" title="http://www.myfonts.com/fonts/typesetit/style-script/">http://www.myfonts.com/fonts/typesetit/style-script/</a><br>
      <a href="http://www.myfonts.com/fonts/sideshow/impala-script/" title="http://www.myfonts.com/fonts/sideshow/impala-script/">http://www.myfonts.com/fonts/sideshow/impala-script/</a><br>
      <a href="http://www.myfonts.com/fonts/bomparte/retroscript-bf/" title="http://www.myfonts.com/fonts/bomparte/retroscript-bf/">http://www.myfonts.com/fonts/bomparte/retroscript-bf/</a><br>
      <a href="http://www.myfonts.com/fonts/underware/liza/" title="http://www.myfonts.com/fonts/underware/liza/">http://www.myfonts.com/fonts/underware/liza/</a><br>
      <a href="http://www.myfonts.com/fonts/suitcase/bistro-script/" title="http://www.myfonts.com/fonts/suitcase/bistro-script/">http://www.myfonts.com/fonts/suitcase/bistro-script/</a><br>
      <a href="http://www.myfonts.com/fonts/mika-melvas/alina/" title="http://www.myfonts.com/fonts/mika-melvas/alina/">http://www.myfonts.com/fonts/mika-melvas/alina/</a></p>
      <p>A few by Filmotype:<br>
      <a href="http://www.myfonts.com/foundry/Filmotype/" title="http://www.myfonts.com/foundry/Filmotype/">http://www.myfonts.com/foundry/Filmotype/</a></p>
      <p>A lot by Fenotype:<br>
      <a href="http://www.myfonts.com/foundry/Fenotype/" title="http://www.myfonts.com/foundry/Fenotype/">http://www.myfonts.com/foundry/Fenotype/</a></p>
