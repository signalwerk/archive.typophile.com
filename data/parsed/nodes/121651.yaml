      <p>My 2 cent... I'm not great fan of this rework. It gives the impression of exactly what it is, a rework. /m and /n look out of the scope now, still too close of Billabong's, /n and /s feel unbalanced together (don't like the way /s x-height has been reduced to be aligned with the rest), /g loop and following /r look weird creating a big gap probably because the designer wanted to keep the tracking (making /g leg longer and reworking loop).<br>
      That said you may like to have a look to <a class="freelinking external" href="http://creativemarket.com/Seniors" rel="nofollow">Seniors</a> and <a class="freelinking external" href="http://creativemarket.com/artimasa" rel="nofollow">Artimasa</a> fonts, 2 fresh and new foundries.</p>
