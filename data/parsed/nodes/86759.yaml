      <p>You could license a legitimate version of <a href="http://www.linotype.com/en/526/Helvetica-family.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Helvetica</a> or <a href="http://www.linotype.com/1266/NeueHelvetica-family.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neue Helvetica</a> as required. Better yet, you could license the digital revival of <a href="http://www.linotype.com/en/808330/NeueHaasGrotesk-family.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Neue Haas Grotesk</a>!</p>
      <p>It is worth noting that a standard license will only cover you for traditional print publication and not any kind of commercial digital distribution that requires embedding of the font data. However, some digital platforms have versions (certain weights/styles) of Helvetica available as system fonts that can be used in those scenarios. Outlining is another option to consider.</p>
      <p>You may also find the discussion of Helvetica in this <a href="/node/add/wiki?edit%5Btitle%5D=Helvetica%20and%20Deja%20vu%20book%20pairing%20for%20web...%20is%20it%20a%20crime%3F" title="Create node &quot;Helvetica and Deja vu book pairing for web... is it a crime?&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">thread</a> of interest.</p>
