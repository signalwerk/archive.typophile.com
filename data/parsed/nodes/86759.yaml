    <p>hi, am a colombian grafic designer, and i have this client that am designing a book for, so, this cliente decided he wanted to use helvetica in the entire book (wich is a bit crazy but there is nothing i can do to change his mind), as the book was inicialy inteded for a non commercial use i had no problem making the book, but then he just kinda slipped the news that the book was gonna be sold in the US.... so now am a bit worried that using this helevtica font (wich i got somewhere aroun, i didnt buy it)may be ilegal.</p>
    <p>i know all about tracing the typeface and making my won font option being "legal", but thats definatelly nooot an option for me right now....</p>
    <p>so yeah.. whats my situation?</p>
    <p>thanks in advance for your help!</p>
