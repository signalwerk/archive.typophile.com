    html: |-
      <p>You could license a legitimate version of <a class="freelinking external" href="http://www.linotype.com/en/526/Helvetica-family.html" rel="nofollow">Helvetica</a> or <a class="freelinking external" href="http://www.linotype.com/1266/NeueHelvetica-family.html" rel="nofollow">Neue Helvetica</a> as required. Better yet, you could license the digital revival of <a class="freelinking external" href="http://www.linotype.com/en/808330/NeueHaasGrotesk-family.html" rel="nofollow">Neue Haas Grotesk</a>!</p>
      <p>It is worth noting that a standard license will only cover you for traditional print publication and not any kind of commercial digital distribution that requires embedding of the font data. However, some digital platforms have versions (certain weights/styles) of Helvetica available as system fonts that can be used in those scenarios. Outlining is another option to consider.</p>
      <p>You may also find the discussion of Helvetica in this <a href="/wiki/Helvetica%20and%20Deja%20vu%20book%20pairing%20for%20web...%20is%20it%20a%20crime%3F" class="freelinking" rel="nofollow">thread</a> of interest.</p>
