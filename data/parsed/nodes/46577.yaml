      <p>Phew.  No, I know that’s all true.  Thanks though for not being mean about it.  I needed the little kick!  I do appreciate it.  I’d all ready learned from viewing this site that there is a LOT more that goes into a logo than I had any idea.  As an “outsider” I would strongly suggest to any logo designer they create something (website, brochure, etc) that shows the entire process of designing a logo.  I saw it somewhere on this site.  Maybe that’s something that’s all ready a norm...  It’s like me and grooming dogs - people think it is easy and should only take an hour to bathe and groom their dogs...little do they know the process. Until I show it too them.  And, I should have taken the same advice I give dog people - there are professionals that do this for a REASON!!!</p>
