      <p>I’m truly not saying this to be bitchy, but it needs to be said: hire a professional. There’s just too much wrong here to even begin breaking it down. </p>
      <p>If your target market is affluent clientèle, having a professional logo is crucial to your success. The affluent are impressed by elegance and class and distrustful of anything less. </p>
      <p>You want your brand to be something they brag about to their friends, right? You want your cards to be on refrigerators, right? Then, it’s all about appearances. Your logo has to get their attention and fit into their world. What you have (so far) says appearances don’t matter. You NEED them to trust your aesthetic to even try you out - so your logo needs to be as gorgeous as (insert a fabulous dog here).</p>
      <p>You wouldn’t do your own plastic surgery, right? You’d hire a pro, because it’s your appearance - your very identity, and you have to live with it forever. Your logo is the exact same thing.</p>
      <p>Sorry if this sounds harsh, it’s just meant to be honest.</p>
      <p>Eileen</p>
