      <p>ebreiner,</p>
      <p>I understand what you are trying to say with the comment “create something (website, brochure, etc) that shows the entire process of designing a logo.” </p>
      <p>The thing is, that “something” includes all the knowledge earned in a bachelors degree or the equivalent in self-study and apprenticeships, a ton of obsessive thinking on symbolism, focus groups and/or random opinions of strangers AND trained eyes, a couple grand worth of software and the years it takes to earn the skills to use it all properly, and a commitment to learn the details of each new business and THEN the ability to boil a whole company down into something about an eight of the size of a business card.</p>
      <p>It’s so hard to explain to people that logo design is infinitely more complex than the final result, and that’s rather the point. Again, it’s like plastic surgery. The world sees the beautiful face, but only the surgeon truly knows the science that makes it beautiful.</p>
      <p>Eileen</p>
