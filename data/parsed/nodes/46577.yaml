    <p>I’m not a designer, as you’ll see.  I’m opening a pet grooming salon and spa. (my second - sold my other one and moved.)  It is called Unleashed Pet Salon.  I designed the attached logo but now I don’t like it.  It’s simply too busy, doesn’t work well small...  I don’t know.  I would really appreciate any help, suggestions, modifications, etc.  </p>
    <p>I want the ’feel’ to be modern, upscale but still pet friendly.  Not cutesy stuff. Simple.  I really need some help here.  I just can’t get it.  I feel like I need to redo the entire thing.  What really made me start looking at it again was getting ready to order window decals...they’re white and it just doesn’t seem to work.</p>
    <p>Thoughts?  Please!  Thank you in advance!!</p>
    <p>Erika</p>
    <p></p><div class="imageWrap"><img src="/files/unleashed logo_3759.gif"></div><p></p>
