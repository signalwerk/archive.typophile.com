      <p>You started the whole thing with the wrong sentence: I’m not a designer. Replies reflect that. Even though I think we may come to some sort of a logo for you. First of all you should post smaller images.</p>
      <p>First of all I would make a nice dog stylisation and not just a side outline. A semi front stylisation would probably work much better.</p>
      <p>But before that you should think what’s more valuable to you: your time spent on this logo (based on your lack of knowledge it would be at least a month of full days of work) or a designer that will produce a nice contemporary logo for you. Maybe in the same time but may still be much cheaper. In the end you’ll also need collateral stuff that a designer will be able to produce much faster and better aligned with your logo than you. I guess.<br>
      ___________<br>
      <em>Robert Koritnik</em></p>
