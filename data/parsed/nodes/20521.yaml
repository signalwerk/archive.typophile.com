    html: |-
      <p>“InDesign comes with 28 Proximity dictionaries for the following languages: Catalan, Czech*, Danish,<br>
      Dutch, English (Canadian*, UK, USA, USA Legal, and USA Medical), Finnish, French, French Canadian,<br>
      German (Reformed, Swiss, and Traditional), Greek*, Hungarian*, Italian, Norwegian (Bokmal and<br>
      Nynorsk), Polish*, Portuguese, Brazilian Portuguese, Russian*, Slovak*, Spanish: Castilian, Swedish, and<br>
      Turkish*. (Languages marked with an asterisk have been newly added to InDesign CS2.)”<br>
      <a href="http://www.adobe.com/aboutadobe/pressroom/pressmaterials/creativesuite/pdfs/id/id_faq.pdf" title="http://www.adobe.com/aboutadobe/pressroom/pressmaterials/creativesuite/pdfs/id/id_faq.pdf">http://www.adobe.com/aboutadobe/pressroom/pressmaterials/creativesuite/p...</a></p>
      <p>4.0.2 update adds support for seven Central European languages.<br>
      <a href="http://www.adobe.com/support/downloads/detail.jsp?ftpID=3168" title="http://www.adobe.com/support/downloads/detail.jsp?ftpID=3168">http://www.adobe.com/support/downloads/detail.jsp?ftpID=3168</a></p>
      <p>It is possible to use older Proximity dictionaries with InDesign CS by placing them from “Adobe\Linguistics\Providers\Proximity" to “Indesign CS\Plug-Ins\Dictionaries\Proximity" directory as Paul described here:<br>
      <a href="http://www.typophile.com/node/17681" title="http://www.typophile.com/node/17681">http://www.typophile.com/node/17681</a></p>
