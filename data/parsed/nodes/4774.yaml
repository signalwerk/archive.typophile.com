  html: "<p>Working in Quark, is there any kind of golden rule regarding H&amp;Js? ex: one set of configurations works best for sans serif and another for serif fonts? Is there one universal setting? Or is it just trial and error until one finds their personal preference? Same for fraction preferences?</p>"
  html_clean: "<p>Working in Quark, is there any kind of golden rule regarding H&amp;Js? ex: one set of configurations works best for sans serif and another for serif fonts? Is there one universal setting? Or is it just trial and error until one finds their personal preference? Same for fraction preferences?</p>"
