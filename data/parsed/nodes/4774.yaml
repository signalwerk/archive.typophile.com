    date_raw: 14 May 2004 — 7:39am
    votes: null
    html: "<p>Trial and error for me, with a few provisos: <br> <br>As little letterspacing as possible (ie, Minimum, Optimum and Maximum Char space set to either the same or a teeny bit different -- like -0.5, 0, 0.5); <br> <br>With most typefaces, Optimum word space can come down significantly (like to 85 or 90%). Char space can often come down too (like -3, -2.5, -2); <br> <br>Auto hyphenation off -- best do it manually. <br> <br>ymmv, obviously. <br> <br>R</p>"
