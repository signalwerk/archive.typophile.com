      <p>I would prefer Lanston’s or Font Bureau’s Californian to ITC Berkeley, but the work requires Berkeley, so that’s what I’m using.</p>
      <p>I don’t mind Berkeley so much — to me it has an 80’s vibe, makes me think of Roger Black’s story on magazine layout in U&amp;lc. And I use the word “sedate” because it’s much more homogenized than the real Goudy font — not nearly as unique.</p>
      <p>This is the first time it’s had small caps and osf, right?</p>
