      <p>I’ve never really liked Berkeley, I wouldn’t really consider it sedate, especially with the victorian crossbar on the e. I had a client once who’s identity guidelines required Berkeley Old Style set at 85% width with -40 tracking. It was beyond painful to read. By contrast, the regualar setting of started to look really nice. They also used Avenir with 115% width. Anyway, the “Pro” version just looks like they bundled it up into opentype format. </p>
      <p>Does Tony Stan remind anyone else of Iron Man?</p>
