      <p>I have seen Berkeley used very successfully. </p>
      <p>I think more ’sedate’ is accurate, and that can be good or bad depending on what you want. If you want something with that Goudy warmth but less assertive—with the slanted ’e’—then Berkeley is good. It is well drawn and sets very smoothly. </p>
      <p>By the way, the slanted crossbar is not Victorian, but Renaissance—Jenson.</p>
