    <p>I’ve recently been hired by two new clients that both require me to use Berkeley Old Style (who’d of thunk it?) so I visit itcfonts.com and lo-and-behold, there’s <a href="http://www.itcfonts.com/Fonts/NewFonts/2006/June2006.htm">Berkeley Pro</a> fresh out this month! I know Tony Stan gets ripped here every now and then (mainly for ITC Garamond) but this looks nice if you prefer a more sedate Goudy font. Has anyone else tried this out?</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/20634" class="topic-previous" title="Go to previous forum topic">‹ wich typeface is this one?</a> <a href="/node/19295" class="topic-next" title="Go to next forum topic">Typophile: Feature request / wish list ›</a></div>
