    html: "<p>I'm taking this class now, and there are so many good reasons  <br>to sign up, I can't begin. Whether you're interested in theory  <br>or practice, Gerald is your man - he manages to both instill a  <br>respect for letterpress (sans the cloying nostalgia) as well as  <br>give all the insight needed in those 14 wonderful weeks, with  <br>no preaching whatsoever. A surprising proportion of the class  <br>is devoted to \"self-study\" - especially suitable to those who  <br>already have some typographic attitudes in place.  <br>  <br>And if you're not in Southern California, consider moving.  <br>As we say: the weather is here, wish you were beautiful.  ;-)  <br>  <br>hhp  <br></p>"
