      <p>Maybe you could explain some of the reasons why you chose the 3 squares and the style of the AMG text.  Without knowing what this is intended to communicate or what concepts went into it so far, it is kind of hard to suggest some ways to refine the subtitle.</p>
      <p>One thing that is not quite working is the scalability of this mark.  It looks fine at larger sizes, but as it gets smaller, it will loose definition and clarity.  The small cuts in the letters will be invisible and the squares will be tiny dots.  I would work toward something that will maintain its appearance at 1cm width.  Good start!</p>
