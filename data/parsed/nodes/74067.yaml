    <p>Hi everyone,</p>
    <p>I am back with a problem that had me gone nuts over the last weeks. I am developing a corporate logo for an engineering company called "AMG", the client is quite happy with the "AMG" text and the three colored squares on top of it but, both me and my client, are quite quizzed about the text underneath the main text( engineering).</p>
    <p>I feel like it's all wrong but I can't find a solution. Ihave no clue of what font could fit nicely in the composition. Do you have some suggetions?</p>
    <p><a href="http://img14.imageshack.us/i/amgo.png/" title="http://img14.imageshack.us/i/amgo.png/">http://img14.imageshack.us/i/amgo.png/</a></p>
    <p>Thanks for the help,<br>
    Pierluig</p>
