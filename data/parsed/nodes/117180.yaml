  html: |-
    <p>I am putting together a new 7x10 book in a classic pulp layout with the 2 columns, illustrations and ads. I was wondering what font choices the typophile community would recommend.</p>
    <p>I am a big face of deco display faces, but I am having a hard time deciding what would be an optimal body font. </p>
    <p>The wrinkle that complicates things is that the visual style of the book is a combination between the 1970s and the 1930 after the books 2 protagonists. </p>
    <p>I am mainly concerned for the print edition at this point, but something that would be able to be embedded in an ebook would be a plus.</p>
    <p>Many thanks</p>
