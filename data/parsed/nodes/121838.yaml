      <p>&gt; The booklet is not part of the designed system,<br>
      &gt; but it should be coherent with the rest since<br>
      &gt; they are going to be presented together.</p>
      <p>Not sure I understand. If they are related projects then using the same font families for both (and same graphic style) would help.</p>
      <p>If they are unrelated projects then normally the fonts don't need to match. Unless you view them as "related" since they are part of the same presentation in which case a similar style for everything might make sense.</p>
