  html: |-
    <p>Hi everyone,</p>
    <p>I made a design project using Expo Serif Pro and Bernini Sans (a book and a website) and now I'm doubtful about which font to be used in the booklet describing the design process. The booklet is not part of the designed system, but it should be coherent with the rest since they are going to be presented together.<br>
    Do you suggest that I should use the same fonts or not? If not, do you have any recommendation for a coherent serif typeface?</p>
    <p>Thank you very much in advance.</p>
