    html: |-
      <p>Who is your intended audience of readers?</p>
      <p>Do you need nikkud alignment?</p>
      <p>Contact <a href="http://www.fontworld.com" title="www.fontworld.com">www.fontworld.com</a>. They have a superior version of FrankRuhl. Also, Scott Keofsky's Milon has many advantages over FontBit's New Hadasa. </p>
      <p>Who is doing the typesetting?</p>
      <p>Only modern texts, like those used in Israel, use Narkiss for the body text. If your audience is the Mishna Brura crowd, Narkiss is not a good choice.</p>
