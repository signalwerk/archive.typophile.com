    <p>I'm designing a 250-or-so page Hebrew book. It's my first, and as I'm not used to reading long stretches of Hebrew text, I'm wondering which font to use for the main body copy.</p>
    <p>The obvious suggestions were FrankRuel, David, Narkis, and Hadassah. Of those four, I most prefer the Narkis for the bodycopy and FrankRuel for the headings. Any additional suggestions to consider? </p>
    <p>Just as good, are there particular editions of these standards which excel in anyone's opinion? I've seen Hagilda's FrankReul and it looks quite beautiful. I'm also taken by FontBit's Hadassah Chadash, as well as Oded Ezer's Meoded Serif (both only as display faces). Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-4_6111.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Untitled-5_6385.gif"></div><p></p>
