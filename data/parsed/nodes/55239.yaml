      <p>Pittsburgh Steeler proprietary font--as in you have to pay the NFL and get permission to use it. You are better off going to MyFonts.com and searching stencil fonts and picking a look-alike.<br>
      This is fairly close, it is called Coalites:</p>
      <p><a href="http://new.myfonts.com/fonts/words-pictures/coalities/" title="http://new.myfonts.com/fonts/words-pictures/coalities/">http://new.myfonts.com/fonts/words-pictures/coalities/</a></p>
      <p>ChrisL</p>
