    <p>Hello again all...long time no see!</p>
    <p>I am no way an expert on this...but I thought I'd ask some of the UI and programming geniuses on here if you'd had a chance to play with Android yet.</p>
    <p>How powerful is it?</p>
    <p>Is it capable to be used as a fully functioning non-mobile OS on it's own?</p>
    <p>If so (and if not) how does it handle type rendering as compared to others?</p>
    <p>And lastly...do you think Android can potentially change how we view operating systems, mobile devices (or even other devices like e-Readers)?</p>
