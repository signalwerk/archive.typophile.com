      <p>I'm not a developer, but as a UI designer I have had a chance to play with Android in action on the G1.</p>
      <p>Despite the poor visual design (and interaction for that matter), Android itself has a lot of potential and can be a very powerful system if the right people get their hands on it.</p>
      <p>Again, I don't know a lot about the development side of things, but it is my understanding Android has a unique rendering engine for type, though apparently has some difficulty with many TrueType fonts (if you were to install your own) - other than Droid, which is currently the default used on the G1.(It is also important to note that processing speeds of the hardware can be an obstacle for the OS)</p>
      <p>Here are a couple of resources:<br>
      <a href="http://androidguys.com/?p=656" title="http://androidguys.com/?p=656">http://androidguys.com/?p=656</a><br>
      <a href="http://understandinglimited.com/2009/03/07/android-complex-script/" title="http://understandinglimited.com/2009/03/07/android-complex-script/">http://understandinglimited.com/2009/03/07/android-complex-script/</a></p>
