      <p>William: I was familiar with most of those. Thanks for rounding out my knowledge - the less classical, or as Nick would say, “fogey” interpretations are also interesting.</p>
      <p>I’ve been looking into this more deeply, and now have more insight into why I’ve been struggling with this. The first issue is the age-old one of “how long should the descenders be”, and the second is how to keep the type from looking really small compared to other fonts of the same nominal size, all without clipping.</p>
      <p>The fashionable descender length goes up and down almost as regularly as dress hemlines. Ridiculously short in Gutenberg. Nice and long in Jenson and Aldus. Short in Guillen de Brocar’s 1517 Polyglot Bible. Consistently pretty long in the French work (but see Tory’s Champfleury) and short in the German. Very long in the Monotype heyday of the ’20s and ’30s. Shrinking to almost nothing by the ’70s ITC days. Not quite that bad, but shorter than the metal, when we get to the digital version of just plain Bembo, but lengthened again in the more faithful Book.</p>
      <p>This question clearly hasn’t been resolved any time in the last 500 years, and might not in the remainder of the millennium. What’s a good postmodernist to do? Variation, of course! And yes, Nick, I am writing (and using) software “like Superpolator”.</p>
      <p>But I think I’m also running into a purely technical problem. The entire issue of what I call “height metrics” is messy and complicated (to me, “vertical metrics” means metrics for vertical writing modes, as is common in CJK). There’s a <a href="http://typophile.com/node/13081?">How-To</a> here with input from paul hunt and John Hudson, but I must say reading it left me almost as confused as before. Certainly, whenever I’ve created a font, I’ve felt the need to stay within the 1000 unit prison, lest I get clipping when using it in various applications.</p>
      <p>I think, but am not 100% sure yet, that there is a safe way to get past 1000 units without clipping. I think the reason I haven’t figured that out before is that the rules changed between the Type1 and the OpenType days. I have yet to discover a clear explanation of these rules, but <a href="http://www.adobeforums.com/cgi-bin/webx/.3bc1ee0e">Adobe’s releases</a> certainly show a discrepancy.</p>
      <p>As for my own default descender lengths, I’m just going to go with my eye. I did a test set with too-short descenders, which turned out not too bad, but I want them longer to do book-like settings. This will be a useful model for the smaller optical sizes, though, which obviously need short descenders.<br>
      </p><div class="imageWrap"><img src="/files/cecco_size_4567.png"></div><p></p>
