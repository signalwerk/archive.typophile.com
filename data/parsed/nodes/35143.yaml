      <p>The need to support languages that use diacritics extensively was behind Victor Gaultney’s decision to increase ascender length and to decrease the cap size in Gentium from what is considered typical. Especially with stacked diacritics as in Vietnamese, the long ascenders provide enough room above the x-height for the lowercase while the smaller caps allow space for their own diacritics as well. In addition, for languages such as German that use capital letters frequently may be helped by making the caps a bit smaller and therefore less obtrusive.</p>
      <p>I like Gentium, but it probably represents the case of going as far as you can with that approach with regards to what’s acceptable. For most uses, I’m guessing decreasing the ascenders of Gentium a hair while keeping the cap size would yield usable proportions. What sort of uses do you have in mind for Cecco, and what size range are you targeting?</p>
