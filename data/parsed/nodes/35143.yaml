      <p>Bear in mind that in the heyday of this kind of old-style revival, it was often set leaded solid (I’m thinking of the Morison/Monotype practice).<br>
      </p><div class="imageWrap"><img src="/files/First_4216.jpg"></div><p></p>
      <p>Today, with Quark and MS Word with their default or built-in extra leading, and the general sloppiness of typography, copious leading has become the norm — and that aesthetic tends to weaken the presence of liberally-extendered faces. If you’re going to produce a fogey face, don’t pull your punches. Forget theory and accomodating today’s practice, and produce a thoroughly prescriptive specimen which shows people exactly how they should use the damn thing tomorrow.</p>
