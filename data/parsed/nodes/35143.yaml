    <p>I’ve gotten enough positive feedback that I’ve decided to plug forward with my Cecco font. However, one thing that’s clear is that it looks too “small” for its point size, because the extenders are so long. In fact, I based the height metrics on metal Centaur, which is a very arty font as such things go, quite a bit more so than the foundry version, in fact.</p>
    <p>In the Star Trek future, I’ll make fonts with variable extender length. Coming back down to earth, I need to pick some now so that I can hammer out usable glyphs today. To help me understand the decision better, I made this chart:</p>
    <p></p><div class="imageWrap"><img src="/files/extenders_5075.png"></div><p></p>
    <p>The axes are descender length (measured baseline to lowest ’p’ peak) and ascender length (measured highest ’x’ peak to highest ’l’ peak), in standard Type1 units of 1000/em.</p>
    <p>Of the ones on this list, I’m sorta inclined to copy Gentium. It gets away with its tall ascender because it makes the caps quite a bit shorter (X-height:l-height of 615:757), thus leaving adequate room for umlauts and other accents on the caps. Does this seem like a reasonable compromise, or do the caps seem wimpy and insubstantial? Certainly that’s a completely different approach than the Scotch Roman tradition, in which caps are big, beefy, and strong.</p>
    <p>Just so I’m clear, imagine I’m designing this for technical papers, books, and so on, in which economy of fit is important (i.e. not art books).</p>
    <p>Is there a definitive reference on the subject, or, failing that, a Typophile thread? I know one recent project to tackle this systematically was the Vista ClearType font collection, but they were designing for 100dpi displays. I’m targeting print and high resolution displays. I’ve also reviewed Ch. 6 of “Letters of Credit,” but feel it was prescriptive enough, and besides, I don’t think he’s giving enough consideration to accents and non-Latin scripts.</p>
    <p>Your advice, as always, is welcome!</p>
