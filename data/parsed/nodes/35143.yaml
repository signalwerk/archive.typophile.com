      <p>&gt;Variation</p>
      <p><a class="freelinking-external" href="http://www.teff.nl/fonts/trinite/trinite.html">Trinité</a> was done in three different extender lengths. Recently <a class="freelinking-external" href="http://www.typotheque.com/fonts/">Fedra Serif</a> was done with two different extender lengths, both on the short side. These, Peter  Peter Biľak explains, are intended for different optical sizes. </p>
      <p>I find the look of Fedra Serif quite innovative and interesting, though I like longer extenders in books. My feeling is that what is best will vary with the destination; shorter columns, more tightly packed, will work with shorter extenders...</p>
      <p>Slimbach’s Optical sizes for Adobe also all have variations in extenders for optical size. </p>
      <p>On the issue of clipping, you probably already know this, but you don’t have to have the actual extenders sum to the 1000 em. There is usually additional space, partly to accomodate upper case diacritics—which are recommended to extend no more than 1200 from the descender, to avoid clipping. </p>
      <p>You didn’t ask, but your ’b’, above, screams out at me as too wide in relation to the other characters.</p>
