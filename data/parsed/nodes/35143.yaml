      <p>William: yes, I agree that my description is too vague.</p>
      <p>I am working, in my extremely spare time, on a mathematical publishing system called Ghilbert. This is a very long term, somewhat speculative project, with a high risk of never paying off. Even so, it is immensely rewarding to work on, and I’m hoping that even if it never achieves the main goal, the spinoffs will be useful.</p>
      <p>One such spinoff is the default font for text. Essentially, this font will fulfill the same role for Ghilbert as does Computer Modern for TeX. It should be a usable, readable, friendly font, versatile enough that it would rarely be a <em>bad</em> choice for such documents. Further, it should be suitable for immersive text reading, as in books. Essentially, I want a font good enough that a non-typographer user has a better chance of sticking with the default rather than choosing another readily available font.</p>
      <p>The Cecco sample paul posted is essentially an exercise in reinterpreting the Jenson Eusebius with my own eyes. Basically, what I want to do now is roll the clock forward - smooth over a few of the quirks of that seminal work, such as the diagonal e (still present as an alternate, though). At the same time, I want to subtly reword the metrics of the font to make it more practical, in much the same way that Bible Centaur did for Centaur.</p>
      <p>I want the font to be beautiful without calling attention to itself. Imagine, say, that you have before you a flagon of wine. There is a school of thought that maintains that Bembo is the highest accomplishment in all fonts designed for books, and that all deviations from that near-Platonic ideal are degradations. Cecco Text will, I hope, not be a disappointment to such folk, and will also exist in digital form with good spacing and more than two instances of optical sizes. At the same time, it will be far from a mechanical clone, and in particular will retain enough flavor of the original Jenson that he might be able to recognize it if he were alive today.</p>
      <p>I also have a few requirements specific to the 21st Century: it must handle accents without compromise, and, eventually, I hope to have at least Greek and Cyrillic complements as well. Further, this font must either harmonize with or be used as the basis for math typesetting.</p>
      <p>Nick: thanks for the encouragement. Yes, it is valid to assume that I have full control over all typesetting parameters, definitely including things such as leading. In the most ambitious plan, my layout algorithms will automatically be able to select width alternates to improve fit, just as Mardersteig and Blumenthal did in the first half of the last century.</p>
      <p>Hope that fills in some more context. Apologies if my ambitions sound too grand - but then, if I only accomplish a tenth of what I set out to do, it will still be useful and enjoyable.</p>
