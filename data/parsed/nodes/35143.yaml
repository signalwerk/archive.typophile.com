      <p>Raph, you’ve put a lot of demands on yourself. The math setting is evidently a key one for you. My guess is that you will have to feel your way, perhaps doing the math characters first, then doing trial and error to find the proportions you like best. And optical size is important, as I’m sure you know.</p>
      <p>Here are two ideas you might want to chew on. First, I wonder if you are not multiplying conflicting demands on yourself, so that the project becomes an impossibility. How important is it to you to be able to set mathematics text books in Vietnamese *and* beautifully set a novel? From the point of view of being able to get it done, it is maybe a better tactic to decide on a core purpose, and if you can accomplish that to your own satisfaction, then look to expanding later. </p>
      <p>Second, there are a lot of recent interpretations of Jenson worth having a look at to see what you like and want to avoid. I don’t know how many you’ve studied, but there are quite a few recent interpretations such as Jim Parkinson’s Parkinson, John Downer’s Iowa Old Style, Nick Shinn’s Goodchild, Christian Schwartz’s Houston, Randy Jones’s Eason and so on. And of course there is Adobe Jenson, which sets a pretty daunting standard as a revival.</p>
