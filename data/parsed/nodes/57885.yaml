      <p>I got more: </p><div class="imageWrap"><img src="/files/sign-jewelrepair_6033.jpg"></div><br>
      Compare the first watch batteries sign to this one - same business. At first glance, no frills...squeezing as many letters as possible, overlapping for maximum impact. But then I noticed the arched “jewelry” and the capital I with dainty dot added. It’s distinctive. Is this folk art also?<p></p>
      <p></p><div class="imageWrap"><img src="/files/sign-freshfish_5698.jpg"></div><br>
      This is in the multinational immigrant ’hood. They sell<br>
      “a Lot of sea food,” I see. “Freshfish” is one word......why U.S. catfish? Is foreign catfish suspect to their American customers? “Free cut and clean” sounds like a classified ad in a gay alternative rag. The sign DOES have a sense of neatness, style and proportion...yet looks like it’s speaking with an accent. What would you call this style of lettering?<p></p>
      <p></p><div class="imageWrap"><img src="/files/sign-maharaja_5040.jpg"></div><br>
      This restaurant is one of my favorites - but the sign hurts to look at it. The background illustration might’ve been peeled off a webpage. The word “Maharajah” is almost illegible. “Cuisine of India” has an outline so thick, the original font is almost submerged. The other text - what is that, Tiffany Heavy? Comments?<p></p>
      <p></p><div class="imageWrap"><img src="/files/sign-adultstore_5256.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="/files/sign-taxservice_6668.jpg"></div><br>
