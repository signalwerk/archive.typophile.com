    <p></p><div class="imageWrap"><img src="/files/sign-watchbatteries2_6696.JPG"></div>This eccentric sign is in West Seattle’s Alaska Junction. I’m strangely fascinated. What is your take, lettering experts? <p></p>
    <p>1. The ornate gold &amp; red headine: Is “Watch Batteries” the name of the shop? Seems odd!</p>
    <p>Watch batteries, sinuous organic script, and climbing roses are things that usually would not go together, right? </p>
    <p>Is the owner saying: “I do mechanical work for a living, but at heart I’m a sentimental old-fashioned lover of beauty and art”?</p>
    <p>2. The second headline -“Fast Quality Repairs” - is in a completely different, equally ornate Art Nouveau style in small-caps lettering embellished with a wing and swashes, but the letters are oddly spaced and placed.</p>
    <p>3. The phone number doesn’t match the other lettering in color or style. A thick blue outline doesn’t enhance legibility, because of the low contrast with the green background.</p>
    <p>4. The (misspelled) phrase “Whole Sale Prices,” is squeezed right underneath the second phrase and overlaps the phone number, as if it was an afterthought. The snaky script does not match the headline style exactly (look at the W). </p>
    <p>Then there’s the huge flower, and the pocket watch perched on top of the headline script, containing a giant diamond. The whole thing is set in a rusty metal holder mended with duct tape. </p>
    <p>Is this a relic of the 60s? Was the sign painter stoned or tripping when he created this art? Or does it go back even further? Someday I’ll ask the owner</p>
