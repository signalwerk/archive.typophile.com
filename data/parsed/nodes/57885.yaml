      <p>Folk art (and its eccentric sibling, visionary art) appeals to us because it displays imagination and manual dexterity in their raw state, unrefined by formal rules of composition or fitness for a practical purpose. Who’s to say that art nouveau flowers don’t go with watch batteries? Who cares if <em>Watch Batteries</em> is the name if the shop? It’s really the only piece of information their customers need to know. Who cares if you can read the phone number? This looks like a place that gets more walk-ins than phone orders anyway.<br>
      <em>Watch Batteries</em> and the phone number are almost certainly the work of the same hand (maybe the lettering artist for <a class="freelinking-external" href="http://www.bluebeat.com/albums/13513">this album</a> ended up fixing watches in Seattle). The white lettering was done by a different, less skilled hand, probably at a later time (perhaps painted over something else that previously filled that space).</p>
