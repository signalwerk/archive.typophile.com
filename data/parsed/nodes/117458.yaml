  html: |-
    <p>Howdy, fellow typophiles! I love writing, specifically the act of writing. I am obsessed with handwriting, especially knowing that we've preserved the actual handwriting of some of the greats of history.</p>
    <p>I have started making jewelry from these historical icon's handwriting, and have found many of the people requesting their own are fellow typophiles and history buffs. I'd love to know what you guys think - what font/word would you wear?</p>
    <p>Here's a pic of a Jane Austen pendant I made: <a href="http://imgur.com/a/mSRHR#0" title="http://imgur.com/a/mSRHR#0">http://imgur.com/a/mSRHR#0</a></p>
    <p>Happy to post my website here, too, upon request, but I don't want to be spammy. </p>
    <p>Thanks, guys!</p>
