    html: |-
      <p>Martin, I searched on the title as a whole, the author's name as a whole, and then on individual letters. No luck on finding anything comparable to that F.</p>
      <p>If you search on Google, a later (mid 1930s) German edition actually used Kabel on the cover. Your options are to find a sans serif that is close to the proportions of the original and customize it, or work backwards from Kabel.</p>
