      <p>Thank you K.C. Thompson and LiLianJie for your help! </p>
      <p>K.C. Thompson's suggestion Kabel seems closer to me, only because of the angled terminals of the E and L. The G seems pretty special, too. And the extended horizontal bar of two of the A's in the title. I wonder if any types uses an F like the one in "Farewell"?</p>
