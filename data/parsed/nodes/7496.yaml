    html: <p>Do you have photos of the chandelier? The illustration seems a little off, particularly the perspective of the bottom part.  <br> <br>Also  the size of the chandelier is overwhelming your logo. I know you want to express the grandness of the space, but I do not get an impression of the space nor the size of the chandelier. Maybe if you juxaposed it with another object in the room (without adding too much clutter) you could get a better relational idea of the space. Or even cropping the illustration asymetrically might give some interesting white space.</p>
