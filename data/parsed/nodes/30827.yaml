    <p><a href="http://www.tipo.net.ar" title="www.tipo.net.ar">www.tipo.net.ar</a></p>
    <p>Tipo is formed by typographers Darío M. Muhafara and Eduardo Rodríguez Tunni, who started creating a type foundry that would promote high quality, Latin American typographic families, stressing those typographies which are used for text and trying to insert them within the international market.</p>
