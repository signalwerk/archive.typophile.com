    <p>Here is an idea, intentionally simplified to a point beyond the possibility of its being true.<br>
    There are two kinds of admirable art. One produces pleasure for the recipient insofar as he is a recipient of a certain kind; let's call this art "good", and the better the kind of person, the better the art. The other produces pleasure insofar as it is good and then insofar as it is perceived as <cite>not</cite> aimed at any particular kind of recipient, even if it could in fact only please an audience of the recipient's kind; let's call this art "great", and the more apparently impersonal the art and disinterested the pleasure the greater the art. </p>
    <p>So how does type ideally respond, in making verbal art physical, to greatness? It cannot now be a matter of matching the personality of the writing, since a fundamental quality of the art is its refusal of directed personality. Here's a famous example to focus thought, from a response to tragic death in <cite>Cymbeline</cite>. The stanza is wholly inappropriate, and in the last couplet meta-inappropriate:</p>
    <p>Fear no more the heat o' the sun,<br>
    Nor the furious winter's rages;<br>
    Thou thy worldly task hast done,<br>
    Home art gone, and ta'en thy wages.<br>
    Golden lads and girls all must,<br>
    As chimney-sweepers, come to dust.</p>
