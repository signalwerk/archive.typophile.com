      <p>I think you're onto the tension between what people used to try to call "universal" themes and those that are more "particular." The problem is that we know that all artifacts are "marked" culturally. But "culture" is not something you can essentialize-- cultures always interact, overlap, intersect, etc. We can speak of "American" but also "Western," of "urban" but also "Parisian." And those are just a couple among thousands of cultural markers-- from the extremely broadly dispersed (middle-class technologically-savvy culture) to the extremely local (neighborhood culture).</p>
      <p>Also, consider that even on this forum you have members of a certain culture-- wildly divergent as their "cultural backgrounds" may be, you have people here, who, in one of their signature cultural practices, think and talk about typography. They (we) will construct discussions about type in that light; you might get a different discussion of, say, what type looks "good" or "great" among a group of high-school students in the Bronx or among fishermen in Thailand. (Or they might just wonder why the hell you're asking.)</p>
      <p>So... for me, what makes any typeface good or great or just interesting is that it combines some formal features and some cultural markers in ways that make some kind of sense to me. I don't just mean, "I like what I like"-- I DO try at least to think about why I like what I like. I won't go as far as Plato and say that if I like it, I MUST believe it's good (so, if I like something bad, I must believe the bad is good and therefore have my head screwed on backwards). But I hope the two line up in some way.</p>
