      <p>I hate to sound like a cafe philosopher, but what is transparent? Either something <cite>marked</cite> as neutral for historical and geometric reasons, like Helvetica or Sabon, or a non-choice, like Times, which certainly doesn't stop seeming a non-choice just because it's botching great art, or a genuinely functionalist design like Unger's Gulliver, which at 11 or 12 point would cease to be functionalist - beyond 10 point type can't abdicate from the possession of character. None of these versions of transparency would work.</p>
      <p>I suspect that one thing the type needs is a kind of traditionality, a perceived removal from the present without exoticism - as Shakespeare in the stanza above is traditional in his removal from the Marlovian "mighty line" and reversion to unpastoral but rustic rhyme. Another necessary thing is dignity, a combination of unimpeachable austerity and high purpose, not nostril-flaring classicism but granite inhumanity. But I'm not going to answer my own question, because I don't know the answer. </p>
      <p>If you want a simpler question: what typeface do you use to set one of Shakespeare's mature plays? Or, if none of the existing faces are suitable, which do you modify and how?</p>
