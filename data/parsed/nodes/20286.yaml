      <p>As for setting Shakespeare's plays... One problem is that Shakespeare, like any author from "the past" whose works people still read, is paradoxically detached from us culturally (we don't live in Elizabethan England, most of us anyway) yet part of contemporary culture pretty much worldwide (he's read and has devoted fans and scholars of his work in every corner of the globe, pun semi-intended). So... we can't presume that there is a "period" typeface that must be suited, nor a "contemporary" type that we might like but which cannot be suited. </p>
      <p>Given that quandary and all the preceding cafe philosophy I've just blabbed, I'd actually probably just default to a something that says, "Here is some writing that is richly textured and greatly admired by many people. It's not sacred, and it's not the best or only great writing in the world. But it deserves to honored as well as transmitted clearly."</p>
      <p>Of course, that just sounds like a bad imitation of Bringhurst on picking any type. But there you have it.</p>
