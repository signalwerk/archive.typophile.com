    html: |-
      <p>Up until now the policy has been that documents are upward compatible (eg you can open a CS3-doc in CS4), but NOT downwards (eg you can not directly open a CS4-doc in CS3, but have to export a file in the IDX-format to open it in the lower version, one step at a time — from CS4 to CS3 works, but not to CS2 — you have to re-export in CS3).<br>
      Chances are that the new version works likewise.<br>
      It has to do with new features being introduced in new versions that will not translate well to the older ones.</p>
      <p>I may be not correct, but this was what I understood from the demo I attended.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
