    <p>Hello folks.</p>
    <p>Our design department is with some doubts about CS3 to CS4 compatibility. We work mainly with InDesign, so I’d like to ask you guys if I can just save a document in .indd from CS3 and open it in CS4 right away. And of course saving it in CS4 and opening it in CS3. </p>
    <p>I realize this may be a hard question since the software ain’t out yet, but someone could have read about this somewhere else.</p>
    <p>If you happen to know any other compatibility issues between these two, don’t hesitate on telling me.</p>
    <p>Thank you.</p>
  html_clean: |-
    <p>Hello folks.</p>
    <p>Our design department is with some doubts about CS3 to CS4 compatibility. We work mainly with InDesign, so I’d like to ask you guys if I can just save a document in .indd from CS3 and open it in CS4 right away. And of course saving it in CS4 and opening it in CS3. </p>
    <p>I realize this may be a hard question since the software ain’t out yet, but someone could have read about this somewhere else.</p>
    <p>If you happen to know any other compatibility issues between these two, don’t hesitate on telling me.</p>
    <p>Thank you.</p>
