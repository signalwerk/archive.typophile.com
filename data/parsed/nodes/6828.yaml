  html: "<p>I just got De Vinne's \"Plain Printing Types\" today, and among the many treats therein is this curious sample: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/49665.jpg\" alt=\"Anglo-black from Plain Printing Types, p.312\"> <br> <br>De Vinne's commentary: <br> <br>The designer of the Anglo-black has given a good imitation of an incised letter, in the gothic style, cut in stone by different blows of the chisel. It has no beauty of form to recommend it, but is an appropriate letter for the representation of inscriptions on tombstones. <br> <br>Do typophiles know of any revival of this face? Is it really as charmless as De Vinne makes it sound?</p>"
  html_clean: "<p>I just got De Vinne's \"Plain Printing Types\" today, and among the many treats therein is this curious sample: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/49665.jpg\" alt=\"Anglo-black from Plain Printing Types, p.312\"> <br> <br>De Vinne's commentary: <br> <br>The designer of the Anglo-black has given a good imitation of an incised letter, in the gothic style, cut in stone by different blows of the chisel. It has no beauty of form to recommend it, but is an appropriate letter for the representation of inscriptions on tombstones. <br> <br>Do typophiles know of any revival of this face? Is it really as charmless as De Vinne makes it sound?</p>"
