    html: "<p>De Vinne was sort of a wet blanket to some extent*, although \"Plain Printing Types\" and parts of his other two books are great. One font he shows that I do think deserves a revival is on page 201: the #19 of Phelps, Dalton &amp; Co. - check out them hybrid numerals. <br> <br>* Which doesn't mean I disagree with him about this particular font... <br> <br>hhp</p>"
