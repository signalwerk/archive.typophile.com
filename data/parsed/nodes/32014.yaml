    html: |-
      <p>Searching Typophile - maybe via google is best - is your single best source for diversity &amp; richness of information. But it will require a lot of reading, and evetually re-reading because the assumed shaded ( or not shared ) contexts which you might not get yet. There are also many good books but there is no single best or complete source for this topic. You have to assemble your own picture of this question from the parts available. </p>
      <p>Partly this is an accident of history, the way people think about type has undergone several revolutions in the last 100 years, partly this is because what looks like one thing is hyper-complex. Plus, it’s not a question just of how you make type but rather how type is used; actually that’s just history; instead it’s a question of what it’s used for, and then you can work back. Erik Spiekermann has a nice quote about that which I don’t seem to be able to find just now. Anyybody?</p>
      <p>The one book that I know of that does the best job of attempting to circle the whole field is Ellen Lupton’s ‘thinking with type’.</p>
      <p>ISBN-10: 1568984480 ISBN-13: 978-1568984483</p>
      <p>http://www.papress.com/thinkingwithtype/<br>
      <a href="http://typographi.com/000917.php">http://typographi.com/000917.php</a></p>
      <p>That might be a good place to jump in from.</p>
      <p>Ellen, if you read this: I would like a bigger inside margins so I don’t have to break he spine of the book while reading it - see page 141!</p>
      <p>Good luck!</p>
