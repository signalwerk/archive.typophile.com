    html: |-
      <p>Hello Jesper Winther, it’s a well, we see typefaces on the surfaces.<br>
      You want to start from hand-drawn rough <a href="http://www.typeworkshop.com/index.php?id1=type-basics">sketches</a> or from a whole alphabet of tight drawings. You want always to sketch something first (rather than starting from scratch on the computer), but you know already that most of the real design work happens once you get the shapes on the computer screen because we read and write words not letters, so don’t get sad if you spend less time drawing on paper. The iterative process of shaping letters on screen and proofing them at different sizes on various machines is where the designing happens.</p>
