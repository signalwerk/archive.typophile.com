    <p>Hi,</p>
    <p>Back in Dec. 05 Thomas Phinney said in <a href="http://typophile.com/node/16942" title="http://typophile.com/node/16942">http://typophile.com/node/16942</a></p>
    <p>"If things proceed on schedule, Adobe hopes to release AFDKO 2.0 around February, and then have an AFDKO 2.x release around the end of the summer. That latter release will support mark attachment (and all OpenType lookup types), at which point FontLab and FontMaster will have the source code to do the same."</p>
    <p>Is there any news on the 2.x front? In particular I'm interested in the currently unsupported features of the OpenType Feature File Specification such as those mentioned in the above quote.</p>
    <p>Any news will be greatly appreceiated!</p>
    <p>Best wishes<br>
    Idris</p>
