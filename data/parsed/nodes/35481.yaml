      <p>I don't think that answers the actual question, which is more about the 2.5 (or will it be 3.0?) release than the 2.0 release that already happened.</p>
      <p>There are some real uncertainties right now in work that Read will be doing before the work on the next big FDK release. I would bet that it will not ship for at *least* three months, and quite possible a fair bit longer than that.</p>
      <p>Regards,</p>
      <p>T</p>
