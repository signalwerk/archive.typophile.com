      <p>Bill: <em>…instead of drawing a line directly, you have to deal with nodes and handles.</em></p>
      <p>I'm still not sure that pen on paper is less direct than bezier drawing.<br>
      Drawing a circle or a square with vector tools is far simpler than with pen on paper using templates, t-square &amp; set-square, or compasses.<br>
      And applying a manual transformation (scale, skew, rotate) interactively is positively transcendental in its WYSIWG-ness, compared with old media.</p>
      <p>Furthermore, with old media one has to deal with ink flow and the tooth of paper.</p>
      <p>None of these different qualities of new and old media are bugs, they are features. The tooth of paper, for instance, provides the fundamental upstroke-downstroke construction of letter forms, just as the width of a broad pen provides contrast and stress.</p>
      <p>By being able to imitate all forms of previous media, digital media appears to have no style of its own, but surely this is a fallacy, because the same situation occurs with every fresh generation of technology.</p>
      <p>Just because digital media finds it so easy to mine analog media for form and content, this doesn't mean that it doesn't have its own predispositions to form and content—it's just hard to see what they are right now.</p>
