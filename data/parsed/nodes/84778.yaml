      <p>The degree of finishing in the Lexicon drawings seems strange and unnecessary for 1991, well into the digital era.</p>
      <p>I didn't notice the reserved and conventional Lexicon when it was published, at the time being more interested in the less traditional approach represented by Emigre, which was in full swing at least until Filosofia and Mrs Eaves were released in 1996. (Traditional being new work in a conventional manner: not to be confused with revivals.)</p>
      <p>Scala (1990), perhaps, and especially Quadraat (1992) were more instrumental in putting this kind of design into wider circulation, due to their being FontFonts, heavily promoted.</p>
