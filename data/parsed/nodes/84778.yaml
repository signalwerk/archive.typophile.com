      <p>Bill, I think the uprightness of the Jenson letters and the horizontality of the serifs is directly related to harmonisation with the classical capitals. If you look at the use of capitals in manuscripts of the period, especially prestige editions, you see a move towards drawn capitals based on classical model, rather than written forms, as part of the overall aesthetic. The letters are a) more regularly upright and b) the serifs are flatter and more horizontal. These are exactly the characteristics that you observe Jenson applying to both upper- and lowercase.</p>
      <p>The variations of weight are more interesting and, as you say, not directly related to the harmonisation of the cases, but I interpret them slightly differently from you. Jenson's types are smaller than most preceding types and almost all scribal bookhands. I think Jenson's genius is in achieving a great evenness of tone at these new, small sizes while anticipating print conditions of paper and ink (over which he had control, of course). That is to say, I think the variations in weight that he 'sculpts' in the punches are reactive to size and conditions. Manuscript letters tend to be sharper than print, since they are not pressed into the fabric of the paper but are defined by the sharp edge of the nib, so typographic letters need to compensate in various ways for the conditions of their reproduction, as well as optically for their smaller size.</p>
      <p>Earlier in the thread you referred to type 'which repeats the same exact shape for each letter'. In fact, the accurate reproduction of a the same shape for each instance of a letter is a relatively recent phenomenon that is pretty much impossible to attain in hand-pulled letterpress printing. The evenness of inking doesn't come about until roller systems are introduced, and it isn't until offset lithography does away with the impression of metal into fibre that significant variation disappears. Witness my <a href="http://tiro.com/John/Baskerville-a.jpg" rel="nofollow">collection of Baskerville lowercase a letters</a> from a single page of one book that he printed himself. A scribe needs to write very slowly and carefully to faithfully reproduce the same shape of a letter in two places, but he can get the same ink density and sharpness of the letter with an ease that escaped the printers.</p>
