    html: <p>The NRC (the newspaper I read) uses Lexicon as their text typeface, in combination with a custom-made Lexicon Display. I must say that Lexicon represents my idea of modern typedesign. Nothing looks crisper, or newer than Lexicon, in text that is. For Display use (The Display variant, that is) it disturbes me. The finished font files are very similar to the pic you showed, which could mean that the drawings are really good (which they are), but it might also mean that Bram just didn't spend the necessary hours to make everything look 'like it's supposed to look' when a large size reveals all details. Perfecting outlines is a boring job... Don't get me wrong, though. I love it.</p>
