      <p>&gt;faithfully copying styles of penmanship. Which was what type design started out as being about, until people gradually became aware of other possibilities, and exploring them became acceptable.</p>
      <p>Um, no. The Gutenberg Bible was 1455. Jenson's Roman was 1475, only 20 years later, and it already started modifying the stroke in a way different from pen-drawn. And it was done for both aesthetic, and I think readability reasons. As we have discussed here before, as soon as you have type, which repeats the same exact shape for each letter, the design demands have changed, and call for much more strict control, as well as the need for the shape to relate to every other letter. </p>
      <p>Hand writing is a different animal than built-up or cut-out letters. That's why it can inform design in a different way from building up. The pen front of a broad pen has its own rules, and creates its own natural variations. But when it comes to punch cutting, before 1890, or built up type with pencil and paper—1890 to 1985—or drawing with bezier curves, it's really not fundamentally different, in that it's the eye and not the tool that determine the shape. There are influences of the tool in each case, but the fundamental thing is gradually building up the letter, as judged by the eye. Punch cutting had the disadvantage of only being able to take away, not add. Bezier curves are not as natural to draw with as a pencil, which is a drawback. But you can move things around, adding or reducing a stroke, even more easily, which is a plus.</p>
