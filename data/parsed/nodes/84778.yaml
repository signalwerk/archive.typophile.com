      <p><em>So I thought that perhaps one would be better off making the drawings on paper, putting graph paper over them, and specifying the endpoints of the component splines of each glyph as numbers - something which font making programs generally don't provide for.</em></p>
      <p>That's more or less how the earliest outline fonts were digitized, except that they used a special mouse with crosshairs to input the x,y coordinates instead of typing them in. When you have existing analog art (which is pretty much all they had back then), it's a practical method. But once you're used to "drawing" with bezier outline tools, and the "existing art" may be little more than an idea, it's much faster, more flexible, and efficient to work directly on the computer.</p>
      <p>Perhaps de Does was more comfortable using traditional methods at the time.</p>
