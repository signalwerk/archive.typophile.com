      <p>William, I found two publications in my home library: the one you mentioned, by Mathieu Lommen: ‘Bram de Does, typographer &amp; type designer’ (bi-lingual - Dutch and English, published by De Buitenkant, Amsterdam, 2003) and BdD’s ‘Romanéé en Trinité. Historisch origineel en systematisch slordig’ (Dutch, published by De Buitenkant, Amsterdam and Spectatorpers, Aartswoud in 1991. The latter being BdD’s own imprint). </p>
      <p>I will re-read those and get back to you!</p>
      <p>BTW The second book mentions being the first publication using the PS-version of Trinité, as digitized by PMN with Ikarus M. Other instances of Trinité in this smal book were typeset by Enschedé on an Autologic APS153 in 1982.</p>
      <p>[UPDATE] There is nothing in these about other type designers, apart from the observation that Unger and BdD shared an office at Enschedé’s in 1970–71 (a period in which Unger produced his first typeface: Markeur — intended for signage); and that British designer Ray Preston won a Morisawa first price with his ‘Prentis’ which is a knockoff of Lexicon (Preston called it ’inspired by…’).</p>
