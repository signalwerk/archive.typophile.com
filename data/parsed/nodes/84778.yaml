      <p>Lexicon has a couple of weights to choose from, as indicated by quadibloc, so it may be more appropriate to say that the newspaper designers chose a too dark weight rather than "[Dutch newspaper print of Lexicon] looked too dark to me".&nbsp;&nbsp;:)</p>
      <p>As to being worth studying, I am certain that both typefaces have been studied extensively. Looking around suggests that they are among the handful of giants on whose shoulders typefaces-considered-as-modern stand. Or put differently, many typefaces that look contemporary or just cool owe something to either Trinité or Lexicon in one way or another, even indirectly via typefaces that drew on them.</p>
      <p>1996type – <cite>Perfecting outlines is a boring job...</cite></p>
      <p>Unfortunately I have not seen actual Lexicon fonts, but afaik it has been digitized with Ikarus, when generating PS/TT fonts involves conversion of outlines (UPM change, i.e. scaling, as well as outline description format change) which produces artefacts.</p>
