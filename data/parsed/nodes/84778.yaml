      <p>John, I may be wrong about this, and I don't have books to hand to check it out, but my memory is that Jenson's types were pretty big, and only Aldus and Griffo started producing smaller types. </p>
      <p>Also I think that the variation because of varying ink spread is still much less than the variation in spacing and letter width and shape in a hand-written manuscript. </p>
      <p>In other words, I think you are underestimating the way type, as opposed to handwriting, forces the issue of evenness of color to the attention of the producer of type. This is true even at 16 or 18 point, and more so at 8 or 10 point. So small type certainly forces the issue of even color, but if my memory serves me (which it may not!) think it was present and noticed at larger sizes first.</p>
