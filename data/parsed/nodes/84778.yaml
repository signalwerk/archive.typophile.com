      <p>With Jenson, there are a number of things going on, but I was referring to the way he makes the letters different from what would be written by a scribe. They are more upright, the serifs more horizontal, and the changes in weight depart from the pen, going toward more even color than scribal writing would have. Jenson's page is extremely even, strikingly more so than a manuscript, I think. </p>
      <p>John, the other issue of how to harmonize the caps, which evolved out of a brush drawn letter, and the lower case, which came from the pen, is related but not the same. I guess I wasn't clear, but I was referring to being vertical and adjusting weights for evenness of color.    </p>
      <p>The overall point, which I think we agree on, is that while type is derived from writing, it is also modified, and both the ancestry and the modification are important. The modification involves sculpting, rather than writing. So some of the gestural qualities that Nick refers are retained—particularly in Jenson—but they are also modified. I don't know how people work with connected scripts that are supposed to look more like they came from the hand, but I think with roman text type a lot of the work is the sculptural thing. And that is best done with the precision of the Bezier curve. </p>
      <p>Nick, when I said less natural, I meant that instead of drawing a line directly, you have to deal with nodes and handles.</p>
