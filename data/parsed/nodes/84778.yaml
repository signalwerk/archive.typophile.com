      <p>Bill: <em>As we have discussed here before, as soon as you have type, which repeats the same exact shape for each letter, the design demands have changed, and call for much more strict control, as well as the need for the shape to relate to every other letter.</em></p>
      <p>This seems a bit vague, and I think what happened is much more particular: Jenson's types formalised the uppercase letters along classical Roman lines, reflecting larger woodcut letters already in use pre-type rather than the written capitals of the humanist book hand.* This in turn prompted modelling the lowercase in the same way: it isn't as if the shapes of the humanist bookhand failed to 'relate to every other letter', but that they related in a different way. To put it another way: the scribes wrote their majuscule letters in a way that harmonised with their minuscule letters; Jenson designed his minuscule letters in a way that harmonised with his majuscule letters.<br>
      ___</p>
      <p>* I see this as another example of text type being tailored upwards to a larger document aesthetic, itself part of a broader cultural aesthetic. This is why it is helpful to look at the illustrations and, particularly, decorative caps and other ornamentation of renaissance books, to understand the context in which the classical Roman capitals provide the model for the new roman types. I don't believe there is anything internal to typography that demanded those forms, and if it weren't for the broader context I don't see a reason for Jenson to have veered from the humanist bookhand that was the scribal norm.</p>
      <p>Two books are particularly worth perusing:</p>
      <p>Grafton, Anthony, ed. <em>Rome Reborn: the Vatican Library and renaissance culture.</em> 1993.</p>
      <p>Alexander, Jonathan J.G., ed. <em>The Painted Page: Italian renaissance book illumination 1450–1550.</em> 1995.</p>
