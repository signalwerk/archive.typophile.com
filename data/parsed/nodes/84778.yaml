      <p>Jenson's types are larger than modern text standards, but are small compared to most formal manuscript bookhands.</p>
      <p><em>I think you are underestimating the way type, as opposed to handwriting, forces the issue of evenness of color to the attention of the producer of type.</em></p>
      <p>Let's be clear that I'm not talking about 'handwriting' in the sense that we use the term today. The humanist bookhand is a formal manuscript hand, used to write <a href="http://upload.wikimedia.org/wikipedia/commons/5/53/Book_of_Hours_Bentivoglio_.jpg" rel="nofollow">prestige editions</a>. It is written slowly and with great care, with the pen lifting from the page between each stroke (i.e. it is not cursive). I've looked at a lot of this stuff, and evenness of colour is not an issue, far less so than in the frequently unevenly inked early printing; the latter, of course, is not the fault of the type maker, but it is one of the things that he needs to anticipate. Bear in mind also that books about typography, like books about calligraphy, tend to reproduce images of the good stuff, so are unreliable witnesses to quotidian quality.</p>
      <p>I am not underestimating the way type forces the issue of evenness: I am saying that the reasons why it does so, and how it does so, are internal to the size and medium of type, especially to impression in the page, and not relative to manuscript, which has its own approach to evenness.</p>
      <p>It turns out we've <a href="http://typophile.com/node/37310" rel="nofollow">been here before</a>.</p>
