      <p>The period in which highly finished technical drawing were required for the production of typefaces was relatively short. It begins with the introduction of the pantograph cutter in the late 19th Century, and comes gradually to an end with digital type as more and more designers begin working in tools like Fontographer and FontLab, rather than using plotting systems such as Ikarus. In other words, it corresponds to the industrial period during which type was manufactured by technicians rather than by craftsmen. Prior to the pantograph, when punches were cut by hand, the drawings provided by the designer needed only to convey the character of the design: the proper balancing of weight, the spacing and alignment, etc. was provided by the punchcutter. Somewhere, Hermann Zapf writes about this in terms of his collaborations with the punchcutter August Rosenberger, during which he realised that his drawing didn't need to be perfect because they would be interpreted by Rosenberger. Similarly, today, while drawing remains an efficient way to develop ideas, those drawings do not need to be completed to technical standards, since more often than not the designer is also the manufacturer, who can take a craft approach to the interpretation of those ideas in font software.</p>
      <p>Bram de Does learned his craft in the era when finished drawings were a necessary stage of manufacture. I've worked with other designers who began work in that period and who still prefer to work in this way, not because it is necessary, but because they have trained themselves to think through this process. Tim Holloway still produces beautifully finished drawings, even though he digitises these himself and may, in the process, make further modifications to the design at the outline stage. Most of my contemporaries, though, work directly in the digital medium and, if they draw at all, only produce sketches and roughs, not finished 'artwork'.</p>
