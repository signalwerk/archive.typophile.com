      <p>@William: The redesign was that of a daily insert. Very fancy with a lot of different typefaces and the use of a top bar of 8cm height that’s mostly empty, with some small pictures and sidebarrish quotes. Bram de Does‘s commented that the new design was an eyesore because of the multitude of fonts and their diversity; mine was a sardonic remark that after the switch from broadside to tabloid they’d shrunk even more by leaving the top 8cm blank.</p>
      <p>I have a snapshot somewhere, but can’t find it.</p>
      <p>Re the remarks about the influence of L &amp; T: I think that can’t be underestimated. The reach of Lexicon thru its use in the Van Dale lexicons (obligatory for most students) is immense and NRC Handelsblad (which uses it too) is considered to be the NYT of the Netherlands.<br>
      An image I found: <a href="http://ftpte222.home.xs4all.nl/fonts/customfonts/nrc_voorpagina-nl.html" title="http://ftpte222.home.xs4all.nl/fonts/customfonts/nrc_voorpagina-nl.html">http://ftpte222.home.xs4all.nl/fonts/customfonts/nrc_voorpagina-nl.html</a><br>
      BTW The guillemet of Lexicon is the main character in the promotional campaigns of NRC.</p>
      <p>The fact that Trinité was released in 1982 implicates that it had been around for some time when the second wave (far bigger than the first) of Dutch type creators hit the market (Swift was released in 1985, Dan — before L, after T). Adding to that that Noordzij is very influential (through his long involvement with KABK) and BdD’s work shares a lot with that of Noordzij senior (and junior), it is quite clear that a lot of contempory type design can be considered ‘attributable’ to the work of BdD.</p>
