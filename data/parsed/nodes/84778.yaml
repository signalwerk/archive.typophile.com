      <p><em>Bezier curves are not as natural to draw with as a pencil…</em></p>
      <p>They aren't the tool.<br>
      The constraint of working with a mouse, trackball, or stylus as the hand tool is that one isn't looking at the tool tip, but aiming a cursor. But that is an adjustment that can be learned, and I don't think it effects precision, because one can zoom in.</p>
      <p>The constraint of working with old media (which, BTW, is no more "natural" than digital media) is quite pertinent to type—namely that one is trying to create a hard, clean, high-contrast image. This is very difficult with pen and ink, much easier in PostScript. I would argue that it is more natural—with greater "truth to materials" to draw digital type with a stylus and tablet, rather than pen and ink.</p>
      <p>The idea that drawing with pencil or pen and paper is natural is incorrect. Those are merely the primitive media we learn with, which do have an important historical status; but tradition is not nature.</p>
      <p>The only advantage that old media has is its ability to capture the vitality of gestural movement, and this has two aspects. Firstly, the deft touch can be a way of making a delicate, precise mark, but as I said, this is rendered redundant by zooming on screen.</p>
      <p>Secondly, in certain types, for certain kinds of curve, the gestural line has a human authenticity which the constructed curve (or one drawn with pen and french curve or templates) does not have, although it can be mimicked to a degree.</p>
      <p>And if one is working with gestural shape, the overall effect tends to have a subtle, organic quality. </p>
      <p>However, it seems to me that the rigidity of PostScript type forms, such as it is, is informed by hinting requirements—the standardization of alignment zones and stem widths in particular, and perhaps the desire of typographers who are able to inspect type zoomed right in, to see that it is "clean", equating cleanliness with professionalism. (Maybe one reason Arial gets such a bad rap.) But there is no fundamental reason to make digital styles antiseptically neat and tidy; I drew Oneleigh roughly, scanned it, traced it with a bezier line, and cleaned it up—but as I had not been working on a grid, this only involved making the fit sweet and the details pretty, not standardizing vertical metrics and stem widths.</p>
      <p>I haven't seen Lexicon hinted on screen, but I would imagine it's a bit gnarly, with details like the unequal stem widths of "o".</p>
