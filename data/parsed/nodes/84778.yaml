      <p>&gt;my experience with paint programs did not lead me to be sanguine.</p>
      <p>Quadibloc, paint programs, being drawing with pixels, are very different from vector programs. Since the end product, the digital font, is a set of vector drawings, this is completely accurate to the final product. That why most type designers now spend most of their drawing time with Bezier curves.  </p>
      <p>Of course the final result you want is not the digital font, but something rendered on screen or paper, and this may be significantly different. So the vector outline needs to be proofed with the final use in mind. </p>
      <p>I think a lot of folks try things by hand on paper, because the hand in motion can teach you things. But polishing is generally done on the computer, rather than on paper. I see there's a new pad, Inkling, which enables a person to draw with ink on paper, and also records what is done digitally. So the two are moving closer together...</p>
      <p>About influence, I don't particularly see De Does influencing Scala or Quadraat. I do think I see it in Swift, but I may be wrong. I think Gerard Unger has had a big recent influence though his teaching at KABK and Reading, as well as through his superb types. I'd be interested in whether Unger thinks he was influenced by Trinité in designing Swift.</p>
