      <p>@Nick Shinn:<br>
      <cite>The degree of finishing in the Lexicon drawings seems strange and unnecessary for 1991, well into the digital era.</cite></p>
      <p>This brings to mind one of my earliest posts to this forum, which provoked a reply to the effect that I certainly couldn't be a type designer myself - which, indeed, I am not.</p>
      <p>In my naïveté, I had assumed that drawings with "that degree of finish", or at least an approximation thereof, were essential to the creation of a worthwhile typeface (for certain purposes, at least), and it was unclear to me that a mouse and a computer screen would lend themselves to producing them - at least, my experience with paint programs did not lead me to be sanguine.</p>
      <p>So I thought that perhaps one would be better off making the drawings on paper, putting graph paper over them, and specifying the endpoints of the component splines of each glyph as numbers - something which font making programs generally don't provide for.</p>
