      <p>You can't just compare any two types of different dates that look similar, and say that the earlier one influenced the later.<br>
      The design of new oldstyles, informed by the pen stroke, has a long tradition, many threads.</p>
      <p>The old style tradition I was familiar with ran through Gill and Syntax, in the sans serifs, and Goudy and Usherwood's types in the serifs.</p>
      <p>It's easy to overestimate the exposure that existed locally, to foreign types, in the past, pre-Internet.<br>
      Certainly, there was an international type scene, but nowhere near as broad and open as it is now.<br>
      It depended much more on the scope of foundries' advertising and promotion, and local distributors.<br>
      In the first decade of digital fonts, roughly 1988-98, promotion was done primarily via direct mail and trade journals, and there was a very real language barrier, more so going to English than the other way around.</p>
      <p>Rather than Lexicon, I was very aware of contemporary types like FF Thesis, FF Quadraat and FF Scala, because as a Canadian Mac-using art director I was targeted by FontShop International, but up until a few years ago I always thought that Enschede was an obscure, old-fashioned foundry with a very small niche, not much of a player. Such is prejudice! LettError were rockstars, but although the "stroked" Advert was part of their work, it was the oddity, they were better known for being random and distressed.</p>
      <p>In North America, most eyes were turned West, not East, pointed by Raygun and Emigre magazines, or if West, towards the work of Neville Brody, he and Carson being heavily popularized by monographs. Looking west to Wired magazine, TheMix came into view.</p>
      <p>A lot of this Dutch style, with its large x-height and shorter-than-ascender cap height, and its micro-detailing, is like the ITC faces of the 1970 and early '80s.<br>
      ITC Garamond, ITC Caxton, ITC Berkeley, ITC Veljovic, ITC Giovanni, ITC Galliard, ITC Usherwood, ITC Tiepolo, etc.<br>
      But who would dare say that classic ITC influenced the recent "Dutch School"?!</p>
      <p>When I designed the humanist sans Sensibility for the Globe and Mail in 2007, one critic dismissed it as Dutch wannabee, comparing it with Auto, but I was working within my own tradition—it was a development of Shinn Sans, a "stroked" type I designed in the mid '80s.</p>
