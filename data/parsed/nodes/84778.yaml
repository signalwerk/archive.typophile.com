      <p>I wish people would stop not referring to vector drawing as drawing.<br>
      I use a tablet and stylus to draw, just like the ancient Egyptians.</p>
      <p>Admittedly, vector drawing is usually more about manipulating path shapes than actually drawing out a line, but the process of limning outlines and filling in the solid is the same as that used in the Lexicon drawings. And vector drawing tools are indeed called drawing tools, and have icons that look like a pen.</p>
      <p>The Lexicon inkings are not "good" enough to use as finished art for phototype, as you can see by zooming in—they would require a sharper edge, made darker, and cleaned up with white opaque, with the addition of "ink traps" and ticks, for that.</p>
      <p>The drawing process was nonetheless culmulative and constructive (akin to vector drawing in that respect), refining the shape of curves from pencil lines which would have been erased here and there and re-drawn, I would imagine, as that's the way I worked and it seemed pretty basic.</p>
