    html: <p>Thanks for the correction, Dan. I got it mixed up with Trinité, which is earlier than Swift. Trinité does have the relatively sharp joins to the stem, with much thicker serifs. Though the structure of the serifs in Swift is different I think I see an influence in the sharp joins and the beefy serifs, which I think is original with Trinité, though it could have been taken from Van Krimpen—I haven't studied this stuff enough to know. Swift's design could be independent also, of course. However, there is also a similarity in the relatively flat curve of the top of the mnh, which are features of both Trinité and and Swift. When I checked Unger's work before Swift, the curves were the more conventional, more rounded ones.</p>
