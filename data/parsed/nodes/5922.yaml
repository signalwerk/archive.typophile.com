  html: <p> This is a logotype I created for the US office of this fine cheese. Parmiggiano-Reggiano is about 800 years old, and far tastier and more nutritious than any aerosal cheese product. The giant wheels of cheese are incised with the name in pindot lettering all along their sides. This lettering cannot be used as the logo for trademark resons. I handlettered the same letterforms as solid lines. The curve on the "O" resembles the arc of the cheese wheel's side. I'm entertaining creating the rest of the font in Fontographer, but would appreciate feedback from those who can spare it. Thanks. </p>
  html_clean: <p> This is a logotype I created for the US office of this fine cheese. Parmiggiano-Reggiano is about 800 years old, and far tastier and more nutritious than any aerosal cheese product. The giant wheels of cheese are incised with the name in pindot lettering all along their sides. This lettering cannot be used as the logo for trademark resons. I handlettered the same letterforms as solid lines. The curve on the "O" resembles the arc of the cheese wheel's side. I'm entertaining creating the rest of the font in Fontographer, but would appreciate feedback from those who can spare it. Thanks. </p>
