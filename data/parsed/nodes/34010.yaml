      <p>"as many foundries do not allow embedding on the web."</p>
      <p>Perhaps this is a goofy and innaccurate term the foundries have coined, but there is no such thing as 'web embedding' these days. I've seen this term pop-up in here a few times.</p>
      <p>At one point in time, you could embed the font in your HTML page and it'd get downloaded by the browser. NN4 and an early version of IE supported this). But browsers no longer support this.</p>
      <p>Nowadays, you can embed fonts in a PDF or in a SWF file. These aren't inheritently 'web' based, though they certainly can be.</p>
      <p>You can just convert your type to outlines as well, though that defeats the purpose of it being text and accessible online.</p>
      <p>In the end, if you REALLY want a custom font, just make it an image. That gets around any silly licensing and if implemented correctly, can still be very accessible (within reason).</p>
