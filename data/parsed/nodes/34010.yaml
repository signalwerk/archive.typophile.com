    html: |-
      <p>Adobe defines embedding this way:<br>
      <cite>Font embedding is a process by which fonts used in the creation of a given document, are incorporated within, and travel with, the document. When a document with an embedded font is viewed, the viewer sees the document exactly as the creator intended the document to be seen. The formatting and stylized design of the document are retained. (<a href="http://www.adobe.com/aboutadobe/antipiracy/ff_faq.html#section-2" rel="nofollow">Adobe Anti-Piracy Initiative: Font FAQ</a>)</cite></p>
      <p>As far as usage ... -<br>
      <cite>14.7.5 You may embed copies of the font software into your electronic documents for the purpose of printing and viewing the document. If the font software you are embedding is identified as "licensed for editable embedding" on Adobe’s website at <a href="http://www.adobe.com/type/browser/legal/embeddingeula.html" title="http://www.adobe.com/type/browser/legal/embeddingeula.html">http://www.adobe.com/type/browser/legal/embeddingeula.html</a>, you may also embed copies of that font software for the additional purpose of editing your electronic documents. No other embedding rights are implied or permitted under this license. (<a href="http://www.adobe.com/type/browser/legal/pdfs/EULA5seat_USEnglish02.03.04.html" rel="nofollow">Software License Agreement</a>)</cite></p>
      <p>Granted, that doesn't mean that it's a universally agreed upon definition, and really doesn't apply to the web - though  the method I was talking (sIFR) about <em>does</em> fall under this definition, but I did leave out a crucial tid-bit of information - sIFR is set up in such a manner that the font usage is restricted to a domain, thus preventing said piracy.  Also, most of what I'm reading pertains more to print than it does to the web.</p>
      <p>Anyway, it does seem a tad vague and subject to situational judgment.</p>
