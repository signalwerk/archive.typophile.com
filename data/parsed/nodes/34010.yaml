    html: <p>I think you're going backwards with the design process here. Rather than try to match the site's identity to the web font, I'd finish the design and then set the text in a web font that fits. In this case, I think Georgia, Gill Sans, Verdana, or Tahoma would be better suited to  News Gothic. Not to mention they are more readable typefaces than Trebuchet.</p>
