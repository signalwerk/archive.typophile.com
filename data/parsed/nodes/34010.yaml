      <p>Perhaps they fear having to identify every form of embedding. This could also be the reason some foundries keep it simple and don't allow embedding at all or they only list PDF embedding. </p>
      <p>In the end I've found that many foundries have a basic license which either allows for most reasonable things and don't want to be bothered with random questions ... OR ... their basic license only allows for a few things and they do want you to call them and open up dialogue with them. This is over-simplifying, of course, because their are also those foundries who offer extended licenses online.</p>
