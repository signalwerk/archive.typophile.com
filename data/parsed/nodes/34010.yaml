    <p>I'm working on a redesign of a website for a College of Fine Arts.  I've got a fair amount of flexibility creatively, but I'm trying to remain true to the established ID system, as well as give a bit of a nod back to the design I'm replacing.</p>
    <p>Now, one of the things I'm keeping from the previous design is <a href="http://www.myfonts.com/fonts/ascender/trebuchet/regular/" rel="nofollow">Trebuchet</a>, which I'm using for the copy (it's currently also used for headlines, and just about everything save for the Logo type - that's done in <a href="http://www.myfonts.com/fonts/itc/friz-quadrata/friz-quadrata/index.html" rel="nofollow">Friz Quadrata</a>).  I would like to find a good headline font, and my options are pretty open - I intend to use font replacement to combat the more restrictive choices I face if I rely solely on browser-friendly fonts (currently, I'm looking at <a href="http://www.mikeindustries.com/sifr/" rel="nofollow">sIFR</a>).  Of course, if I don't have to, I would rather use something more universal.  The big rub of all this, of course, is that these headlines need to be dynamic, so creating a static image for each headline is not a solution.</p>
    <p>I'm trying to maintain a more modern feel, and to keep the design clean.  I've been placing <a href="http://www.myfonts.com/fonts/linotype/news-gothic/bold/" rel="nofollow">News Gothic (bold)</a> as my headlines, and I like the way it feels, but my fear is that the difference between the two fonts - Trebuchet and News Gothic - is not different enough, and/or that either of them don't sit nicely with Friz Quadrata.  Any suggestions?</p>
    <p>Sample from one of the sites (includes all in their respective uses):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/panpainter_trebuchet_4360.jpg"></div><p></p>
