      <p>(Just as follow up, and to close this out... )</p>
      <p>Thanks everyone for being kind to a new-poster.  What I ended up doing was leaving Trebuchet out of the equation entirely, and instead I'm using a Helvetica/Verdana pairing; Verdana's too wide for the headlines, but it works better for the body copy.  Trebuchet just didn't reduce as well as I'd like, and I moved away from News Gothic in favor of something more standardized.  </p>
