    <p>There's a fast-food restaurant in Brooklyn, NY. It's called Roll 'N' Roaster and has been there for as long as I can remember. It's an eyesore and hasn't changed it's aesthetic since AT LEAST the 80s when they released their one and only commercial (as far as I know, I'm only 21). Anyway, their main selling item are their cheeseburgers and their roast beef sandwiches with cheese. As a matter of fact, you can "put cheez on anything you pleez!" </p>
    <p>Anyway, I want to rebrand the whole place (starting with the logo.) I want it to look like a high-class restaurant, but keep the attitude that makes it a neighborhood landmark (they call themselves the "not-so-fast fast-food restaurant.)</p>
    <p>I've never had any real-world critiques outside of school, so it would be great if you all could drop some knowledge on me.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Roasters4_5220.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Roasters2_4265.jpg"></div><p></p>
    <p>Yeah, that's a little hamburger there in the negative space, in case you couldn't see it already.</p>
