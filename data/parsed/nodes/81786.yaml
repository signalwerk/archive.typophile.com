    html: |-
      <p>That RoboFog folder must be pretty old since it’s not part of the RoboFab installation for a long time anymore. So that is certainly not the origin of the problem.</p>
      <p>Here’s a screenshot of the location of the RoboFab folder on my system (OS X 10.6.6):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/librarypython_5397.png"></div><p></p>
      <p>And when I open the RoboFab.pth file it looks like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/robofabpth_5903.png"></div><p></p>
      <p>If this is all exactly there I can imagine there’s a problem with the permissions. Select the folder ‘site-packages’ and choose ‘Get Info’, then set the permissions according to this screenshot and choose ‘apply to enclosed items’.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/permissions_4359.png"></div><p></p>
      <p>Hope that will do the trick..!</p>
