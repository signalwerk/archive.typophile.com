      <p>Hi Morten,</p>
      <p>Appararently Robofab is not correctly installed. :(</p>
      <p>Check if there’s a Robofab folder in /Library/Python/2.3/site-packages/<br>
      In the same folder there should be file called "RoboFab.pth" as well.</p>
      <p>If they are not there, run the latest version of the RF installer again and make sure you are logged in as an administrator.</p>
      <p>Hope that helps.</p>
