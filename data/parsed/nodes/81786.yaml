  - id: 478069
    user: 4346
    date: 2011-09-21T07:30:00
    date_raw: 21 Sep 2011 — 7:30am
    votes: null
    html: |-
      <p>From the FL Beta forum:</p>
      <p>1. If you don't have it already, get the "RoboFab + FontTools + DialogKit Combo" zip here: <a href="http://robofab.com/download/index.html" title="http://robofab.com/download/index.html">http://robofab.com/download/index.html</a><br>
      2. Unpack the zip and put it in a location where you want the files to live. For example /Applications/RoboFab.<br>
      3. Open Terminal.<br>
      4. Type "cd " (the space is required) and drag the FontTools folder to the Terminal window. This should give you something like "cd /Applications/RoboFab/FontTools". Hit return.<br>
      5. Type "sudo python2.5 setup.py install". Hit return.<br>
      6. A bunch of installation notes should appear.<br>
      7. Type "sudo python2.5 " (the space is required) and drag the install.py file in the RoboFab directory to the Terminal window. Hit return.<br>
      8. "Robofab is now installed." should appear along with some other text.<br>
      9. Type "sudo python2.5 " (the space is required) and drag the install.py file in the DialogKit directory to the Terminal window. Hit return.<br>
      10. "dialogKit is now installed." should appear along with some other text.<br>
      11. Restart FontLab if you have it open.</p>
