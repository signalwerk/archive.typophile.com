  html: |-
    <p>I'm currently working on a project where Paratype's cut of Bodoni seems to be the perfect fit for titles, but is too contrasty to work well for body text.  Is there anything that would be a comparable substitute?  Is there a Bodoni designed for text that has less contrast &amp; perfectly horizontal serifs?</p>
    <p>Sorry if this has been discussed before, but a "bodoni" search pulls up just about everything under the sun.</p>
