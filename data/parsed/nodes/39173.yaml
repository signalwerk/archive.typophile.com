    html: |-
      <p>How about Caflisch Script?<br>
      It's casual because it's a script, but it's also very disciplined and sophisticated, and the OpenType alternates make for a very "organic" font!<br>
      If you are using Paradigm U&amp;lc large, you could also try it as "all small caps" at text size, with the Caflisch, that would be a nice triad of typographic forms.</p>
    html_clean: |-
