    <p>Hi I am working on an Organic Wine label.</p>
    <p>I am looking for a font that is clean, understated and contemporary. I want a font that looks soooo good with out screaming look at me. A font that a designer might say “I want to know what that font is. A font the average consumer won’t see anything unique with but they will sense quality. A font for an organic wine consumer who shaves her legs (target market).</p>
    <p>Am I asking to much? I thought I’d toss it out there.</p>
