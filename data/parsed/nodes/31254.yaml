      <p><a href="http://www.myfonts.com/fonts/paratype/liana/" rel="nofollow">Liana</a> or Lainie Day and Alejandro Paul has it as <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000079" rel="nofollow">Mr. Lackbows</a>. Don't know what is the hen or the egg. See for example <a href="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=43341" rel="nofollow">this discussion</a> at WTF. </p>
      <p>EDIT: As I see now, there ARE differences between Liana and Mr. Lackboughs. Sorry for that.<br>
      EDIT2: Ah, Mike Y has also <a href="http://typophile.com/node/9942" rel="nofollow">valuable background information</a> on this font. So roostertypes has it as <a href="http://www.roostertypes.com/view_fullfont.asp?catalogid=19848&amp;issingle=yes" rel="nofollow">Lady Dawn</a>.</p>
