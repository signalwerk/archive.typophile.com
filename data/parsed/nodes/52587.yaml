    <p>Hi all let me introduce myself.<br>
    My name is simone (but i am known as simsy to my friends) was born in a place called melbourne australia but i now reside in the United kingdom with my partner and his dog chloe... you are most likely wondering the hows whys and whatfors about me so here it all is (or an abbrevated version at the very least).</p>
    <p>I am a lover of typefaces (which is a recent aquired obession.)and abstract art (i am an amater abstract artist i have no formal graphic design/art training whatsoever) </p>
    <p>I know you are wondering why am i obessed with typefaces,well fonts can express so many emotions, express a viewpoint or even just be plan fun. </p>
    <p>And thats why i love typography. It can express many moods, it can be formal or informal.. its just that versitile and if its well done a font can stand the test of time.. like sands though the.. </p>
    <p>sorry i had a days of our lives moment there (an old american soapie for those who had no idea about the reference)</p>
    <p>anyway this is my blog, sometimes about fonts, sometimes about art...<br>
    and maybe just maybe sometimes about something totally unrelated to the world of art and typography.</p>
    <p>Peace out</p>
    <p>Simone</p>
