    html: '<p>I would like to point out that Fontlab Ltd. offers two products:  <br> <br>* TypeTool 2 at US$99 -- offers the essential tools for designing a typeface (drawing, metrics, kerning). Creates high-quality Type 1 and TrueType fonts.  <br> <br>* FontLab 4.6 at US$449, and at $299 for registered Fontographer owners -- offers an extensive set of tools for designing typefaces (everything TypeTool offers plus effects, scripting, manual hinting, OpenType layout features support, extensive font info editing). Creates high-quality Type 1, TrueType and OpenType fonts.  <br> <br>In order to get the autotracing facility working, you also need ScanFont 4 (US$99) which works as a plugin for either TypeTool or FontLab.  <br> <br>The recent issues of the British magazines "Computer Arts" and "Computer Arts Projects" include full versions of TypeTool 1.3 (Mac &amp; Windows) and ScanFont 3.2 (Mac) -- fully-functioning older versions of our products. They can be used without limitations, and can be upgraded to recent versions at reduced prices.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd. <br></p>'
