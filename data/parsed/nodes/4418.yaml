  html: <p>Ok... I am finally using all my thousand of images to generate new typefaces... That would be my first time designing typefaces using a computer software. Do you guys have any suggestion regarding the best software to do this... to transform my Adobe Illustrator sketches in real fonts? It must be Mac OS 10.3 compliant... I know Fontographer but doesn't run on Panther... :-(... Thanks a lot!</p>
