    html: |-
      <p>Thanks for the feedback! I knew there was something off with the /M/. I first tried narrowing the entire letter, which, as eliason pointed out, wasn't the correct solution. Proportionally, I believe the /M/ should be about 120-130% wider than the /D/ or /E/. I'll have to try closing up the "V" in the middle, as you said.</p>
      <p>Regarding the /R/, I typically like a wider stance, but that's just my preference. I'm planning on doing a bit of customization to a few of the letters after I get the general forms designed (once they are in the context of the logo) -- one of which may help out the /R/.</p>
    html_clean: |-
