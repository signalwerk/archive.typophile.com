      <p>This is looking nice — only a couple things that stick out to me:</p>
      <p>–The right leg of the 'R' seems like it should slide back toward the stem a bit; its stance feels rather wide.</p>
      <p>–The 'M' feels quite wide; there's a big hole of white space in the central valley. I want to pinch the two sides in toward the center.</p>
