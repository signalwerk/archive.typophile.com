    <p>Hi guys,</p>
    <p>It's been a while since I've posted something myself here. I'd like your input on my latest font NOVA. NOVA is a solid grotesk font that has loads of wow-stuff under the hood. I've been working on it for about a year now, and I'm getting close to a semi-final version. I always liked typefaces that I can both use as a serious workhorse and for creative playing. NOVA has all that (imho)!</p>
    <p>The ones who are following me on Facebook, Twitter or Flickr, have seen this font before and also reacted on it (very positive I must say). Here's one of the latest discussions about NOVA on Typophile:<br>
    <a class="freelinking external" href="http://typophile.com/node/91652" rel="nofollow">http://typophile.com/node/91652</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Typophile_critique_01_3543.gif"></div><p></p>
    <p>The design is still a bit rough, so I'll do a few more rounds later on. I just want to first get all the automated stuff in place before I start polishing. I'm almost done with the basic OpenType features, but I'd like your input on discretionary ligatures &amp; swashes that help me make a good strategy for the first release. I don't want to end my days programming OT features and get frustrated, so I want to put all the right stuff in here that should serve most people.</p>
    <p>Please help me fill in the gaps, name me the ligatures and swashes that I've missed and that are important in your language. The attached PDF file gives you a good impression of the vast range of options NOVA has under the hood.</p>
