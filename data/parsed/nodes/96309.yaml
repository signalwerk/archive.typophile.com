      <p>The "logic" you're talking about is specifically called the "moving front" (by Noordzij), and it does make sense, in its own world.</p>
      <p>What bothered me about how Fábio expressed his intentions was the apparent view that the moving front is how typographic forms look "perfect". To me this is totally wrong.</p>
      <p>As for whether a beginner should start with the obvious precedents or not, the problem is this precedent is a bad one (something Vivaldi and Mozart are not). I guess it also depends greatly on the individual beginner: some people are strong enough to turn a bad precedent to their advantage; but some people get hopelessly stuck for the rest of their lives.</p>
      <p>hhp</p>
