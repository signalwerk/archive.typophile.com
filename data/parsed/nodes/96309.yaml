      <blockquote><p> But we should be drawing the border between black and white, not pairs of lines enclosing the black </p></blockquote>
      <p>Hrant, perhaps you misunderstood me in my last comment. What I intended to say was that, if your design is chirographical, then your anchor points should <em>reflect that logic</em> you have chosen. But there is not and should not be a fixation towards a chirographical logic, or any other logic at all. I completely agree with you in that aspect. </p>
      <p>But there <em>is</em> a logic between the two lines that delimit the shape of a letter. If that interrelationship is meaningful in some way, then this shape will be of some value for "the mind's eye".</p>
      <p>However, I don't understand why you would discourage a chirographical approach by someone who has presumably just started with typography. I assume you didn't wan't to discourage the chirographical logic itself (but I may be utterly wrong), but the fixation to that kind of logic. I think it is pretty useful as a starting point, and I also think one has to be careful by making such preclusive statements against chirography, in particular in front of people who do not have any judgement yet. After all, it's better to try to understand Vivaldi and Mozart before trying to understand Thelonius Monk and Keith Jarret.</p>
