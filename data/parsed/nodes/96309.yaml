    <p>Hello typophiles</p>
    <p>Im learning the principles of designing a typeface via software assistant. So, when I need to control beziers to make a 'perfect curve' I fail again and again. I know that failing is good, but I think that the position of points and handles have some science on it. </p>
    <p>Today I realize something that perhaps could help me, but I dont know if it make sense, have a look:<br><img src="/sites/default/files/old-images/handles_6446.png"></p>
    <p>It seem to me that handles follow a certain logic that we can find in the structure of calligraphic variations…<br>
    This make sense to you?</p>
    <p>Where do you [typographers] learn the 'art' of place perfect points and handles?</p>
    <p>--------<br>
    Thanks<br>
    Fábio Santos</p>
