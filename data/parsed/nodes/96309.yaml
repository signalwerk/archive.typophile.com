      <p>Always play with the modifier keys when you're learning a program, and you'll discover all sorts of things.</p>
      <p>In Fontlab, holding down Alt/Opt while moving a cusp node will move the node while its handles stay in place. Holding down Shift before moving a smooth node will keep the handles in place and constrain the node to the line segment between them. (Shift after you've picked up the node is your usual rectilinear constraint.) Holding down Alt before moving a smooth node will scale and rotate the handles according to the node's relative position along the curve. Alt after you've picked up a smooth node will work like it does for a cusp node, creating a false cusp that will spring back to smooth the next time you mess with the handles.</p>
    html_clean: |-
