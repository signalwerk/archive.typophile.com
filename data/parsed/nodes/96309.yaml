      <p>I'm not sure I understood everything you wrote (and I don't know what you keep smiling at) but:</p>
      <p>Don't confuse drawing with -what can quite accurately be called- painting. I draw by hand all the time - it can be wonderfully useful. But we should be drawing the border between black and white, not pairs of lines enclosing the black (which makes no sense functionally, hence is an arbitrary design constraint, a lazy shortcut to nowhere).</p>
      <p>Painting only "trains your mind and knowledge" about type's arbitrary past; when it comes to what function type needs to perform, it can only distract you. It doesn't matter if you're using a broad-nib pen, béziers or a ripe avocado tied to a stick.</p>
      <p>Related:<br><a href="http://typophile.com/node/31095">http://typophile.com/node/31095</a></p>
      <p>hhp</p>
