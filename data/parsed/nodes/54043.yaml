    html: |-
      <p>Regarding Univers, as Poms mentions, this is not the "official German font"… rather, the names of Government ministries, etc. are set in a condensed Univers. You see their names next to the stylized flag and eagle motif.</p>
      <p>Otherwise, NeueDemos and NeuePraxis are used. Designers and agencies creating documents or doing design work for the Federal Government license these fonts from Linotype.</p>
      <p>Here is a link to the German government's official style guide:<br>
      <a href="http://styleguide.bundesregierung.de/Webs/SG/DE/Homepage/home.html" title="http://styleguide.bundesregierung.de/Webs/SG/DE/Homepage/home.html">http://styleguide.bundesregierung.de/Webs/SG/DE/Homepage/home.html</a></p>
      <p>Here is their bit on fonts:<br>
      <a href="http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Basiselemente/Schriften/schriften.html" title="http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Basiselemente/Schriften/schriften.html">http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Basisel...</a></p>
      <p>Note these fonts:<br>
      <a href="http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Basiselemente/Schriften/Zusatzschtiften/zusatzschriften.html" title="http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Basiselemente/Schriften/Zusatzschtiften/zusatzschriften.html">http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Basisel...</a></p>
      <p>And here is typography:<br>
      <a href="http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Druckschriften/Gestaltung/Typografie/typografie.html" title="http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Druckschriften/Gestaltung/Typografie/typografie.html">http://styleguide.bundesregierung.de/Webs/SG/DE/Print-Styleguide/Drucksc...</a></p>
