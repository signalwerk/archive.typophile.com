      <p>Kris, I'm glad this peaks your curiosity. That's a good sign. Ganymede and Primex two of my early type designs from a time when I didn't know better. Making them taught me <em>why</em> reductive design is a dead end : )</p>
      <p>In that sense, having made them qualifies me to recant and be critical of reductive design years later. I've been there and done it, and recoiled.</p>
      <p>Primex suffers less from reductive properties than Ganymede does. Primex is benefits from its simplicity, whereas Ganymede seeks to disappear up its own arse. Its capitals have uses but its lower case is apparently pointless.</p>
      <p>By the way, the terms of use for the Myfonts site prohibits distribution and external use of font samples generated by its test-drive feature. Please read the Myfonts site terms of use and abide by it.</p>
      <p>Thankyou. Peace.</p>
      <p>j a m e s</p>
