      <p><em>I’m not that fond of the stemless look, which always strikes me as a little self-conscious and awkward. On the other hand, the original Dax makes something of the stemless look: a strong individuality and a certain sweetness.</em></p>
      <p>I see Dax in a similar light. It is a bit self-conscious and "high-concept" (borrowing a term from the film indistry) but it holds up nonetheless. My main complaint is about Dax's reductive design qualities. Simple is good, but the omission of spurs make Dax a champion of reductive modernism. The face's popularity makes it influential for other typeface designs. That bugs me because I'd rather live in a world unaffected by  reductive modernism and "the failure of modernism".</p>
      <p>j a m e s</p>
