    <p>I've spent the last three weeks trying to stumble across a typeface of which i didn't know the name - i found out today that the typeface in question is FF Dax and has a similar cousin under the name of FF Sari.</p>
    <p>Just wondering if anyone has any ideas as to the best place to buy this font family</p>
    <p>Also, what is the general consensus? Is it already over-used, or is it a viable option for the right project? I think it would work well in a professional context maybe with another, subtle sans-serif based font... </p>
    <p>Any ideas would be appreciated!!<br>
    Thanks,<br>
    Jeremy Green</p>
