      <p>I'm not that fond of the stemless look, which always strikes me as a little self-conscious and awkward. On the other hand, the original Dax makes something of the stemless look: a strong individuality and a certain sweetness. </p>
      <p>Daxline seems to loose some of the merits of the original Dax--the individuality and sweetness--though you might not get tired of it as soon. If you wanted a more usual look, I'd think maybe a different face altogether might work better, as you would't have the distraction of the stemless n m etc.</p>
