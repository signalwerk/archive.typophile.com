  html: |-
    <p>DSType introduces some of the latest releases. Comments welcome! </p>
    <p><strong>Dobra Slab</strong><br>
    Dobra Slab is robust serif companion to Dobra and it's available in 5 weights with matching italics. Soon available for licensing.<br>
    <a href="http://www.dstype.com/index.php?id=63" title="http://www.dstype.com/index.php?id=63">http://www.dstype.com/index.php?id=63</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DobraSlab_5736.gif"></div><p></p>
    <p> <strong>Finura</strong><br>
    I don't even know how to describe it. I designed it by impulse and I wonder how it's going to be used! Soon available for licensing.<br>
    <a href="http://www.dstype.com/index.php?id=61" title="http://www.dstype.com/index.php?id=61">http://www.dstype.com/index.php?id=61</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Finura_6590.gif"></div><p></p>
