    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_6009.jpg"></div><p></p>
    <p>for me it has this kinda dreamy vibe and it almost feels like it really was just written onto the print I saw</p>
    <p>I already tried different font recognizers but none found the right one. the most obvious charateristic for me is the capital D where the leg doesn't touch the curve.<br>
    Furthermore the font is mostly sans-serif, the only serif character I saw was capital I</p>
    <p>As far as I know it's not a windows/microsoft font, I'm using a regular laptop with windows 8 and I can't find it here, however I did saw it once on a mac computer</p>
