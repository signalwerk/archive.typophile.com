  html: |-
    <p>Hello fellow typophiles.</p>
    <p>I'd like to show my new release. It's a sans called Gesta.</p>
    <p>Gesta is a friendly versatile sans serif typeface suitable for corporate and editorial purposes.<br>
    With its generous x-height and slightly curved strokes, Gesta combines a distinctive and warm feel with a modern look.<br>
    It is available in four weights from light to bold with four matching italics and its OpenType features include small caps and old style figures for every weight.</p>
    <p>it is available at MyFonts. <a href="http://new.myfonts.com/fonts/r-type/gesta/" title="http://new.myfonts.com/fonts/r-type/gesta/">http://new.myfonts.com/fonts/r-type/gesta/</a></p>
    <p>I would also like to thank Typophile and the typophiles for your help.<br>
    This where I got help and great suggestions: <a href="http://typophile.com/node/53140" title="http://typophile.com/node/53140">http://typophile.com/node/53140</a></p>
    <p>Warm Regards.</p><div class="imageWrap"><img src="http://typophile.com/files/textSetGesta_5241.jpg"></div><p></p>
