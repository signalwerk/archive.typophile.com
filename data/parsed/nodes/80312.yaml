    html: |-
      <p>This isn't really a typography nor visual design question nor marketing, but...</p>
      <p>We don't need CAPTCHAs. But we use them to be pragmatic when we don't have the technical or human resources to handle the issues associated with not using them on the back-end.</p>
      <p>A CAPTCHA, as stated, is an attempted way to determine that the web form is being filled out by a human rather than an automated script. It does this on the client side, meaning the onus is on the customer to pass the test as opposed to handling this on the server side, which can be more effort.</p>
      <p>General rule of thumb is to avoid them at all costs from a user experience perspective. People hate them. Only use them if there simply isn't another solution available.</p>
