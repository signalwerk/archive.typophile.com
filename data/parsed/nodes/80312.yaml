    date: 2011-03-21T06:08:00
    date_raw: 21 Mar 2011 — 6:08am
    votes: null
    html: |-
      <p>I've put up testing web sites with very obscure addresses that no human could find, yet the spammers are always able to find them and write very complimentary blog comments on those sites telling me how great my articles are. The article writing they compliment is complete "lorem ipsum dolor" style gibberish, and they always add a few spammer style links within their blog comments to sites for Viagra, or gold sales, or some other non-sense. And I'm sure they have scripts that write those same comments on a multitude of sites. Without protection, spammers will find and abuse any form of web communication.</p>
      <p>One of the simple ways to thwart the spammers using automated tools is the CAPTCHA:</p>
      <blockquote><p>"CAPTCHAs, or Completely Automated Public Turing Tests to Tell Computers and Humans Apart, exist to ensure that user input has not been generated by a computer. These peculiar puzzles are commonly used on the Web to protect registration and comment forms from spam. To be honest, I have mixed feelings about CAPTCHAs. They have annoyed me on many occasions, but I’ve also implemented them as quick fixes on websites."</p></blockquote>
      <p>Source: <a class="freelinking external" href="http://www.smashingmagazine.com/2011/03/04/in-search-of-the-perfect-captcha/" rel="nofollow">http://www.smashingmagazine.com/2011/03/04/in-search-of-the-perfect-captcha/</a></p>
