  html: <p>I’m newbie to internet marketing. I know it’s very silly questions but I really want to know that why do we need captcha for registration to our website?</p>
  html_clean: <p>I’m newbie to internet marketing. I know it’s very silly questions but I really want to know that why do we need captcha for registration to our website?</p>
