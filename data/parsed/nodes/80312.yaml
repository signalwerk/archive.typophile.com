    html: |-
      <p>CAPTCHAs reduce the effectiveness of every form they are on by significant percentages. There are alternatives, such as Akismet, and in my opinion they are worth it even if the odd spam bot still manages to get through.</p>
      <p>I would rather manually remove occasional spam than lose 20% of my registrations or sales to have a CAPTCHA.</p>
