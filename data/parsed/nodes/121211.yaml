    Perfect pangrams from restricted sets[edit]<br>
    Chemical element symbols[edit]</p>
    <p>It is not possible to make a perfect pangram out of current chemical element symbols, but it is possible using two disused ones. Unq, for unnilquadium, now known as rutherfordium, Rf, is in every pangram, as it is only one of two chemical symbols with a Q. The two Us in Uuq (ununquadium, now known as flerovium, Fl) prevent its use. The other letter necessitating disused symbols is J; the available symbols are J (for iodine, I), Jg (for argonium/hafnium, Hf), or Jo (for joliotium/dubnium, Db).</p>
    <p>Here is one of many possibilities using Jo:</p>
    <p>    Al, Bk, Cf, Gd, H, Jo, Mt, P, Si, Unq, V, W, Xe, Y, Zr</p>
    <p>Country codes[edit]</p>
    <p>All countries have a two letter ISO 3166-1 alpha-2 code. Here is an example of a pangram using these:</p>
    <p>    BD, CV, ET, FR, HN, IL, JP, KG, MX, QA, SO, UY, ZW</p>
    <p>Self-enumerating pangrams[edit]</p>
    <p>A self-enumerating pangram, or a pangrammic autogram, is a pangram which describes the number of letters it itself contains. The first such sentences were constructed in 1984 by Rudy Kousbroek and Lee Sallows.[12]<br>
    Initial letter pangrams[edit]</p>
    <p>An initial letter pangram is a sentence in which all the letters of the alphabet occur as first letter of each word - preferably in alphabetical order. Thus a sentence will count 26 words. Some examples in Dutch:</p>
    <p>    Achter Beatrix’ cementen demente echtgenoot fluisteren geen heiligen in Japanse kimono’s langzame mantra’s, noch preken quasi-intellectuele rijmpjesvertellers Sinterklaasachtige terzines uit versboeken, wel xylofoneren yogaleraren zangstukken. (Translation: Behind Beatrix demented husband made of cement whisper no saints in Japanese kimonos slow mantras, nor preach quasi-intellectual rhyme tellers Christmas-like tercets from verse books, but play yoga teachers vocal pieces on the xylophone).</p>
    <p>    Als buitenzintuiglijke chirurgen drugs en fantastische geestverruimende heroïne in jouw kop loslaten, mag Nederland, ondanks protesten, quota regulerend stellen tot uiterlijk voorbij waar xtc-slikkende yuppies zeggen. (Translation: If extrasensory surgeons release fantastic hallucinogenic drugs and heroin in your head, the Netherlands may set, despite protests, regulating quotas to the point where ecstasy swallowing yuppies say).</p>
    <p>A three-sentence example in English, containing three consecutive initial letter pangram sentences which alternate in descending, ascending, descending order:</p>
    <p>    Zidane, Yiddish xylophone wonder, vanquished undesirables through simply rendering quisling patterns on neatly maintained long keys, justly instigating heartfelt gratitude for exemplary deeds captured by audio. Adoring brilliant creativity, daring entrepreneurs funded grand halls, inducing judicious kibitzing, lessened measurably night one; perhaps quelled rapidly since tickets usually vanished when xylophonophilics yelled “Zidane!” Zealots yodeled xylophone whimsies, violently upending the standard rigor quieter patrons observed, neatly mutilating long-kept jive interactions, harmony gone, frantically enabling dire change by armfuls.</p>
