    votes: null
    html: |-
      <p>On a Mac, taking a screen shot just saves the portion of the screen visible on your monitor, so long web pages might get cut off. </p>
      <p>A workaround is to press Command-P (Print) and in the print dialog box choose Save as PDF. The resulting PDF will be of the entire web page.</p>
