    html: <p>The display face on this site is Knockout from the Hoefler Type Fountry. <a href="http://www.typography.com" target="_top">http://www.typography.com</a> <br> <br>There are several condensed weights of Knockout available that may look similar, but the specimen above is not Knockout... (note the lower case g.) <br> <br>My guess is Trade Gothic condensed or perhaps News Gothic condensed. <br> <br>//joe</p>
