      <p>dezcom,</p>
      <p>The way you see it, is the way I see it for me. Not my freewheeling style at all. I change my mind all the time and like to try things out. Keeping a chessboard in my head is not my idea of fun, either. I get it.</p>
      <p>So, I'm not optimistic about avoiding the problem entirely.</p>
      <p>However, I found one way to speed it up.<br>
      Let's say it's the lc 'e'.<br>
      I can select the row of usually composited glyphs like eacute, etc...  the whole group.<br>
      Select Paste Special and check "Glyph As Component" and it pastes into all the selected glyphs.<br>
      A small win, I'll take it, until I figure out something more comprehensive.</p>
