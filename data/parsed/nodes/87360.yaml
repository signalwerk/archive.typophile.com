    html: <p>FontForge calls it references, there is a "Replace with Reference" feature that takes the currently selected glyph(s) and replaces any occurrence of that glyph with a reference to it. Any changes any the referenced glyph will propagate to glyphs referencing it, there is also a "Use My Metrics" lock, so that the side bearings are kept in sync as well (I think the later is even a feature of TrueType fonts, not something FontForge specific). May be FontLab have similar features.</p>
    html_clean: <p>FontForge calls it references, there is a "Replace with Reference" feature that takes the currently selected glyph(s) and replaces any occurrence of that glyph with a reference to it. Any changes any the referenced glyph will propagate to glyphs referencing it, there is also a "Use My Metrics" lock, so that the side bearings are kept in sync as well (I think the later is even a feature of TrueType fonts, not something FontForge specific). May be FontLab have similar features.</p>
