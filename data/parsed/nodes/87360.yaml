      <p>At the suggestion of Sumner Stone, I tried using "components" as a way to design a typeface. I tried sticking with it and eventually completed the character set.  True, I was able to try numerous modifications and permutations and created dozens of alternates. Surprisingly, it seemed to take quite a bit longer than I expected for the options it allowed me.</p>
      <p>I am sure there are plenty of type designers who can work this way, but.  After the "experiment", I happily went back to my old way of working.  The component thing was just not a good fit for me.  It requires a sense of organization and labeling that just is not me.  I am more suited to open-ended flurries of doing whatever seems right at the time.  I might call it my "organic method" of taking root in a form and then growing it as nature seems to provide.</p>
      <p>This is not to say that I condemn or even cast a glance of jaundice at the method.  It just means, if the suit fits comfortably, where it to work. If you are more comfortable in a T-shirt and jeans, it might not suit you to a T--(or any other glyph. ;-)</p>
