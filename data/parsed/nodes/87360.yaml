    html: "<p>Here's a tip: Before you paste all those components, clear the mask on all the target glyphs (assuming there's nothing in it you care about), then swap the outline with the mask. Now when you paste the components, you will have the original outline in the mask layer as a reference to check that the position of the component matches.</p>"
