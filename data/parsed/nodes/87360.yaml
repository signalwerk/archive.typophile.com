      <p>Oh, and you shouldn't apologize. FontLab Studio has so many freakin' features, and they are often non-obvious.... Every now and then I am trying to do something I haven't done before, and find a new-to-me feature that helps, even though I have been using it since 1994.</p>
      <p>Trivia point: FontLab 2.5 had a different kind of subroutine feature that allowed you to do something like components, only it even worked with parts of paths! So you could for example have a serif shape as a subroutine that you could edit once and have take effect everywhere. I still miss this feature. Reportedly FontLab Studio 7 may have some serious moves in this direction again.</p>
