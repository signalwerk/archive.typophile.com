    <p>I feel like apologizing up front, because this is probably a FontLab 101 question, but let's say composites are disabled and I make a change to the lc 'a'.</p>
    <p>How do I go about propagating - meaning that the other glyphs change along with that lc 'a'? A script? A feature that I'm missing in FL?</p>
    <p>Any help, I'd appreciate. Thanks.</p>
    <p>rich</p>
