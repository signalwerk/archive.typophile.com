    html: |-
      <p>Either a script, or use components. There's no other magic feature.</p>
      <p>This is a major headache in dealing with already-compiled fonts. For the kind of work you are doing, you should try to get FL source files when possible (in the hope that they have components already existing).</p>
      <p>Another plus of components is that they can translate nicely to TT composites, making for smaller initial TTFs. (How much size reduction composites offer once you gzip the result is an interesting question I'd love to know the answer to....)</p>
