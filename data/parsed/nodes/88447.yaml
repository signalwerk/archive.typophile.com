    <p>I have been having weird ligature issues for some time on random jobs.</p>
    <p>I have been having an issue with Indesign and PDF files</p>
    <p>We are getting font character "Glyphs replacing other characters"</p>
    <p>Specs of the machines</p>
    <p>Mac OsX=10.5.8</p>
    <p>ID version=ID-CS5 ver 7.0.3</p>
    <p>Acrobat Distiller version = 8.0</p>
    <p>Fonts we have had this issue with</p>
    <p>Sabon LT Std.</p>
    <p>Garamond MT Regular</p>
    <p>Fairfield LT STD</p>
    <p>TimesLT Std</p>
    <p>Palatino LT Std</p>
    <p>Minion Pro Regular</p>
    <p>Verdana Italic</p>
    <p>Times New Roman PS</p>
    <p>Adobe Garamond Pro Regular</p>
    <p>Cresci Regular</p>
    <p>Characters that have been causing the issues.</p>
    <p>io, il, hn, hk, SY </p>
    <p>The characters they are replaced with.</p>
    <p>Ú Ÿ Õ Š Ỳ §</p>
    <p>We run font cache cleaners such as Font Nuke, Font smasher and we even created our own from information found in other places where all the font cache's hide as well as suitcase's.</p>
    <p>We tend to catch this issue in out PDF outputbut it does show up in the Indesign files. We have noticed that when we catch it in the Indesign file we can turn of ligatures in the Paragraph style and the characters go back to how they should display. But then the fi, fl, ffi, ffl, and Th ligatures are gone in the paragraph.</p>
    <p>We process many jobs on a given day via 3 different machines that are setup to create PDF files. On total we do about 170 new jobs in a month this doesn't count revisions of the job and since August we have only discovered it in 11 jobs.</p>
    <p>Other people are having similar problems but similar to our issue its not something one can replicate all the time.<br>
    Please see the following link to the adobe forums.</p>
    <p><a href="http://forums.adobe.com/message/4084426#4084426" title="http://forums.adobe.com/message/4084426#4084426">http://forums.adobe.com/message/4084426#4084426</a></p>
    <p>Link to the image of the issue on Adobe forums.<br>
    <a href="http://forums.adobe.com/message/4093188#4093188" title="http://forums.adobe.com/message/4093188#4093188">http://forums.adobe.com/message/4093188#4093188</a></p>
    <p>Thank you<br>
    Matt</p>
