      <p>Your first one is close to how I would do it. I would also add a shadow in the ball terminal, like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/acccc_6441_5637.png"></div><p></p>
      <p>I would also tend to do the shadow transitions on curves at 45 degrees. For this kind of effect, it tends to look better if the light is coming at a 45 degree angle, rather than straight vertically or horizontally. Those can work too, but you get less satisfying modeling of forms.</p>
