      <p>Are they supposed to be inset (engraved) or outset (relief)?  Judging from the shading on the A it appears outset (which is fine, as long as that's the effect you want).</p>
      <p>With the C you seem to be having trouble visualizing which direction the light is shining from.  Going by the A it seems to be shining from straight above (12 o'clock), so in that respect #1 is actually closest to the right track.  But you need to rethink the transition of shading from one side of the curve to the other.  Try starting with an angled transition as follows:</p>
      <ul>
      <li>On the outside curve, a transition in the \ direction, from dark to light, with the inner end starting at about 7 o'clock.
      </li><li>On the inside curve a parallel transition from light to dark, with the inner end starting at about 11 o'clock.
      </li><li>The outside ends of these two angled transition should both hit the edge of the letter at 9 o'clock.
      </li><li>During this transition, the centre spine will be unmarked (invisible).
      </li></ul>
      <p>That'll give you the basic idea.  Then you'll obviously want to tweak the angle of the transition so that it appears to reflect the curve of the letter (rather than being a straight line).</p>
