    <p>Dear Typophile</p>
    <p>I'm trying to use my mark as in an illustration, where I'd like the A &amp; C part seem as if it was chiseled.<br>
    If I may say so myself, I think my A is quite okay. But the C is driving me mad! </p>
    <p>I'd like to convey the effect in only two colours, and all the c's presented seems a bit off to me. Number 4, of course, is the most sketchy one. Just wanted your take on it, before I go on.</p>
    <p>best regards<br>
    Mads</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/acccc_4963.png"></div><p></p>
