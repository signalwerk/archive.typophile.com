  html: |-
    <p>Imagine the I/i of a serif typeface. Where do I put the ogonek/nosinė so they look right in Lithuanian? I gather the nosinė should be more or less visually centered below the letter as a whole. But does it attach to the right serif (right extension of the serif) or to the center of the serif? Or does it not really matter?</p>
    <p>In most typefaces, the ogonek attaches to the center, but I have seen instances (especially bold cuts) where it was put more to the right. Any Lithuanians here who can clarify?</p>
