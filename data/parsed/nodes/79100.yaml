    html: |-
      <p>The only exceptions about ogonek positioning I know are |a| and |u| in some Native North American languages, where it is connected to the bottom middle. For Polish and Lithuanian, I'm using connections at right, except for |A|. Ogoneks at middle of |I|i| stem seems to have a weak link with the base letter and broke the flow ogonek curve produces.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ogos_6714.gif"></div><p></p>
      <p><em>Some ogoneks from a font project.</em></p>
