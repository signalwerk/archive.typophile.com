      <p>Size matters. Huh!?</p>
      <p>Font matters? 2xHuh!?</p>
      <p>The other interesting thing, (besides that Mark did not give up the secret of optical scaling nor did Mr. Fink leap forward to accuse NPR of being part of the Founding Fathers Conspiracy), is that All the Type In the Document must be 10 point Century Gothic! Clear! You start printing even a few pages of "GO PACK GO!" in Impact all caps 456 point, and You Are On Double Secret Probation. </p>
      <p>And the other other thing is, why don't they just make the windows users buy and carry around their own cartridges!? ;)</p>
      <p>Cheers!</p>
