      <p>Mark, they seem to be recommending increasing the type size. Their "how to" indicates switching to 12 and 11. </p>
      <p><a href="http://www.uwgb.edu/compserv/ehelp/office2007/fontchanges.htm" title="http://www.uwgb.edu/compserv/ehelp/office2007/fontchanges.htm">http://www.uwgb.edu/compserv/ehelp/office2007/fontchanges.htm</a></p>
      <p>This sets quite a bit longer than 10pt Arial or the more recent 11pt Calibri defaults. </p>
      <p>Incidentally Printer.com compares ink usage of 11pt Arial against 10pt Century Gothic. </p>
