    html: <p>"I was so much older than, I'm younger than that now" Bob Dylan. High school students think of themselves as hip and more sophisicated than adults. A happy smiley face won't cut it and I agree the colors aren't "cool". The graphic is fine for a younger audience so don't loose it just save it for the next job. I would gather ads that target your audience and see how they are marketing to them.</p>
