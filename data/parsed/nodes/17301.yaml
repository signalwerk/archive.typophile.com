    date: 2006-01-19T07:33:00
    votes: null
    html: "<p>I'm with Dan, the card is not sophisticated or hip enough for that age range. Your audience wants the accountrements of adulthood without the stuffy conservative feel. The card should probably feel like a funky credit card or exclusive pass. Look at the palettes of hip companies that thrive on that market: Apple, MTV, Reebok, etc. I recommend eliminating the cuteness and pushing towards funky edge. Only go cute if you can contrast it with another option as well. But if you do go cute, maybe think <a href=\"http://www.kidrobot.com\" rel=\"nofollow\">Kid Robot</a> cute.</p>"
