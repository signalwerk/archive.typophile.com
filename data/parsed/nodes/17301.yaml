    <p>Dear typophiles,</p>
    <p>I've been asked to design a logo for the "Culture Card", a credit-card format card that'll give high school students discounts on the ticket price of musea, movie theaters, concerts et al.</p>
    <p>I'm not too sure of the type treatment quite yet, but I like the graphic mark.</p>
    <p>Please tell me what you think, thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/culturecard.jpg"></div><p></p>
