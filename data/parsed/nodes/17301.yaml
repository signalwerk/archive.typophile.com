      <p>After thinking about this a little, I take back my initial opinion of the colors. I agree with Dan and g_u_y_t that they really don't work with your target audience. </p>
      <p>After a little more thinking, I really don't agree that the Dylan quote applies to your typical high-schooler. I went back to a younger time (a whopping 3 years ago), and really tried to analyze what high school was about to me and the people I attended it with. Most students are in the least bit interested in being sophisticated, they want to be the exact opposite of their parents. Most do have an interest in being "hip," but high school "hip" is nothing sophisticated. Keep in mind, this is just my experience in a middle-class, Southern California city, so it may not be the same for other parts of the country.</p>
      <p>I agree with Dan, look at the advertising, and even the people you are trying to market to, and try to get a feel for their interests and style.</p>
