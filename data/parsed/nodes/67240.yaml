    html: |-
      <p>By the way, the groups can be made either in the OT editor in FontLab, either just before the feature code, or in the lower pane of the OT editor panel. Or, you can use the Classes panel, select "New OpenType Class" from the pop-up, and use this syntax:</p>
      <p>group_name: <em>list of glyphs</em></p>
      <p>I prefer putting it all in the OT editor. Seems easier to manage.</p>
