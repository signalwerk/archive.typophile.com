    html: |-
      <p>Python? Do you mean coding an OpenType feature?</p>
      <p>If so, it goes like this:</p>
      <p>Make a few groups:</p>
      <p>@any_letter = [ <em>a list of all letters from your font that could be part of a word</em> ] ;</p>
      <p>@not_final = [ <em>a list of the non-final glyph forms</em> ] ;</p>
      <p>@final = [ <em>a list of the final glyph forms (same order, same number of glyphs) </em>] ;</p>
      <p>Here is the feature code, which should be put in the calt feature:</p>
      <p>feature calt {</p>
      <p>lookup fix_finals {<br>
      ignore sub @not_final' @any_letter ;<br>
      sub @not_final' by @final ;<br>
      } fix_finals ;</p>
      <p>} calt ;</p>
      <p>The "ignore" part means skip the rest if another letter follows. If no letter follows, then the substitution happens.</p>
