    html: |-
      <p>Is this the only feature in the font? There is a bug in InDesign where it ignores a feature if it is the only one.</p>
      <p>If that's not the case, it could be that you have contextual alternates unchecked in InDesign.</p>
      <p>It's also possible that you are not including OT features when you generate the font. There is a checkbox for this in the preferences.</p>
