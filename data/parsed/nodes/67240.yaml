  html: |-
    <p>Hey, I was wondering if anyone could help me with a python script. I'm making a script font, and would like to substitute out the final glyph in each word (with one that has a finishing flourish).</p>
    <p>I remember seeing something like that here before, but I can't find it now :(</p>
