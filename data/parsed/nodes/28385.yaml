      <p>im a student like you, so please keep that in mind while reading. some words regarding akzidenz grotesk (AG) and helvetica:<br>
      often people say that AG is a direct ancestor of helvetica, but this is wrong. as far as i know, akzidenz grotesk itself is derived from various sources, mainly royal grotesk by theinhardt. many cuts were added over time (AG Schulbuch, AG Schoolbook, etc.) and werent part of the original design. more about this <a href="http://typophile.com/node/17643" target="_blank" rel="nofollow">here</a> and <a href="http://www.typophile.com/node/4567" target="_blank" rel="nofollow">here</a> - in all details. erik spiekermann wrote: «The original series remained quite divers, individual weights showing not much resemblance but name. It was mainly a marketing and naming success.».</p>
      <p>helvetica on the other hand, especially the redesign of it by linotype (helvetica neue), is a very clean, neutral grotesk with way less character than AG - which was the aim back then but seems like a negative point to me nowadays. both Credit Suisse and McDonalds use AG as they're corporate typeface, which maybe shows some of the credit it has regained over the last years.</p>
      <p>françois rappo, swiss type-designer, created a revival named "Theinhardt Grotesk" which is probably based on original drawings of royal grotesk, and it really looks lovely. google doesnt find much about it, but its used in the nice book "We Make Fonts" by ECAL, the design&amp;arts-university of lausanne, switzerland. <a href="http://img135.imageshack.us/img135/5339/294027176301ss500sclzzzzzzzv59053959yi2.jpg" target="_blank" rel="nofollow">here's a link to the cover</a>. i think the book's worth its price just for showing theinhardt grotesk… </p>
      <p>if this last link ever goes down (its hosted on a free image hosting website), go to amazon.com and search for "we make fonts". the picture comes from there.</p>
