      <p>Dag, as I am working on a new revival of Caslon, I have looked in to the history of the revivals. One of the things I found, as I explained in my talk at TypeCon this summer, is that all of the revivals from the second part of the 19th century on have recut characters in them, particularly in the italic. None of the revivals is in fact a replica of the original, including Founder's Caslon, though most, including Founder's, have claimed to be 'authentic'. (I am not aiming to be authentic, just good!) </p>
      <p>What happened, as historian James Mosley explained to me, is that in the mid-19th century machine casting of type came in, and this burned out matrices in a way that hand casting had not. And punches break. Consequently there was a lot of recutting in the 19th century, generally none of it admitted. To track and sort out the whole story would take a year's work, at least. </p>
      <p>ATF's versions are regularized compared to Caslon's original (especially in digital versions of course, such as digital Caslon 540). Monotype had to work with the limitations of their 'unit' system, and Linotype their 'duplex' system, both of which limited in different ways how accurately they could reproduce the originals that they had--which were not actually original in many cases, as I said. Also they often shortened descenders, which was the fashion then for economical setting. The most recent versions of Caslon are, I believe, Founder's Caslon, and Paul Hunt's redigitization for P22 of Lanston Monotype's version. Also P22 issued a 'Franklin's Caslon' based on things Benjamin Franklin had used.  </p>
      <p>Through all this, Caslon has retained an elusive magic and fascination that has continued from its first revival in 1844.</p>
