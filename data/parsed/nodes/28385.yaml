    <p>Hi everyone,</p>
    <p>Im looking for a typeface which was cut/redesigned few times<br>
    through the history. Its for a project im working on<br>
    concering colonialism/post colonialism – and I would like to use<br>
    the different cuts over time to emphasise the change and influence over time.</p>
    <p>Im really looking for sans serif examples (how far does it go back - 1850s?)<br>
    I know also Caslon has been recutted many times over time,</p>
    <p>I would really like to have some advise concerning this<br>
    question and also if you could recommend typefaces<br>
    that has been changed over time.</p>
    <p>/ Dag Brandsaeter</p>
