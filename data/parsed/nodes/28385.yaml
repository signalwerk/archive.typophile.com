      <p>This is tricky because when they re-cut a design (which was certainly done a lot) they also usually renamed it! And in a way that was part of the natural cultural transition of the day. So maybe it's better to look at the transformations of type design as a whole - which is of course of a very broad and fuzzy subject (and well presented in Lawson's Anatomy). Maybe you could narrow this down by choosing a "lineage" that's long and relatively focused (even if it's had offshoots). In the sans realm this is especially hard because the history is so much shorter (in typography if not lettering). Maybe the ?...AkzidenzGrotesk...Helvetica...Unica...? lineage.</p>
      <p>hhp</p>
