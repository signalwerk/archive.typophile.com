    <p>Hi guys,</p>
    <p>Could anyone please help me identity these fonts? I'm looking at the typefaces you find on the round ink postage stamps (do they have a different name to normal paper stamps?) - in particular these:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Post_Card__Envelope_2_3504.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Post_Card__Envelope_3_6220.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Post_Card__Envelope_4_4700.jpg"></div><p></p>
    <p>If anyone knows what they are or knows of anything similar I would really appreciate it.</p>
    <p>Thank you.</p>
    <p>Jordan</p>
