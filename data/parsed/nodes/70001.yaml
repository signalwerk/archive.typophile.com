    html: |-
      <p>I suspect they are a special set of letters that were created to make these cancellation stamps. These are too old to be 'fonts' in the sense of something you put on your computer. I couldn't find fonts made to look like this exactly, but <a href="http://new.myfonts.com/fonts/fontfont/ff-stamp-gothic/" rel="nofollow">FF Stamp Gothic</a> might make a close substitute.</p>
      <p>- Mike Yanega</p>
