    <p>Hello-</p>
    <p>This evening I had a look at some old logos I've made, and came across a bird I've made to a friend of mine. It's fleur de lis turned into a bird; a cardinal. I wanted to use that as a fleuron, so I copied it to FontLab, and started buggering about. Soon it started to have very Caslon-like look, so I went with that.</p>
    <p>Here is what I have this far:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/cardinale_5512.png"></div><p></p>
    <p>And here's a pdf.</p>
    <p>Lower case 'g is a bit dark, but otherwise it's not too bad in my opinion.</p>
