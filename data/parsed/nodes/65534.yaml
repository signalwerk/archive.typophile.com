    html: |-
      <p>Hi, Stefan-</p>
      <p>Italics are under way. You can see them in this same Serif critique, under 'Cardinale'.</p>
      <p>And yes, that Fourier: I was commissioned to make a bold version of the typeface, and I made that. While doing that I noticed the state of MT Fournier; it was horrendous! Points were all over the place, and beziers pointing everywhere. I started thinking about making a revival of Fournier then.</p>
      <p>But then I went to my library, and found a facsimile of <em>Fournier's Modéles des Characteres de l'Imprimerie</em>. It's a copy number 320 of 600 from the Printing Library of the Saint Bride Institute from 1965 with an introduction by James Mosley.</p>
      <p>There is no bold variant there. It is a single font with sizes from larger than Gros Canon to Nonparelle with italics and small capitals and some special cuts and a huge amount of ornaments and borders.</p>
      <p>Adobe seems to be the only seller of Monotype original. This should be an interesting project with pretty steep learning curve.</p>
      <p>This will take a while, though :·)</p>
