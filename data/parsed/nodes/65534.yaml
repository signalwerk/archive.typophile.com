    html: |-
      <p>Whoah! Sorry I missed this one! Great stuff, Tomi :)<br>
      Only a few little comments for the mo. Hopefully I'll call back later ithis week.<br>
      D looks a bit light on the right, and perhaps a bit too oval. I think O, o and Q could be somewhat darker on the heavies.<br>
      R is quite skinny, especially in the middle.<br>
      b looks a bit unresolved on its bottom spur. I'm afraid it'll look blobby in small settings.<br>
      I'd make the foot serifs on p and q longer I think. And probably r as well. r could be wider?<br>
      Join of u looks high.<br>
      y looks a bit sloped.<br>
      Think the corners on z should be slightly rounded.<br>
      The uppercase looks a bit light compared to the lowercase and I suspect the serifs would look nice a few units thicker as well as perhaps the hairlines.<br>
      I like the fleuron.<br>
      I know you're a fan of flipped quote marks but do you think they fit this font?</p>
      <p>Is this quite a display sort of font?</p>
