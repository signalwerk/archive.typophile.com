    html: |-
      <p>Hi Tomi,</p>
      <p>sure is, that Fournier is one of the most beautiful typefaces all over the history of printing. Not casualy early Bodoni works were (successfully) inspired by it.<br>
      Italic is particularly charming and unbeaten in my eyes.<br>
      And Monotype versions in the past have been weak, indeed.<br>
      I also found beautiful specimen of Fournier type in the university library at Hamburg, Germany,<br>
      though I believe that were reprinted ones.<br>
      Go on with Fournier!<br>
      You should also look for Fournier interpretations on this site. I belive Raph Levian did one, but I am not quite sure about. But if he did it will sure be worth looking for it.</p>
      <p>Salute<br>
      Stefan</p>
