    html: <p> I had a discussion with a big wig at the publishing company that bought MIS Press. They have no intention of reprinting the book and they have no intention to allow permission to copy the books contents in any format even though a copy of the book cannot be located. <br> <br>What's frustrating is that the book is very very good and as relevant today as it was when it was written due to Fontographer not seeing an update in lo these many years. <br> <br>I wrote several e-mails to Stephen with no reply and I'm not sure if there is any way to share the fantastic information that is contained within this book. Any ideas? It's as good as you think it is. <br> <br>Funny side note, I found a copy of the book on eBay right after as the auction ended and the seller was thrilled to get $15 for what he felt was "dry and bording" <br> <br>Stuart :D </p>
    html_clean: <p> I had a discussion with a big wig at the publishing company that bought MIS Press. They have no intention of reprinting the book and they have no intention to allow permission to copy the books contents in any format even though a copy of the book cannot be located. <br> <br>What's frustrating is that the book is very very good and as relevant today as it was when it was written due to Fontographer not seeing an update in lo these many years. <br> <br>I wrote several e-mails to Stephen with no reply and I'm not sure if there is any way to share the fantastic information that is contained within this book. Any ideas? It's as good as you think it is. <br> <br>Funny side note, I found a copy of the book on eBay right after as the auction ended and the seller was thrilled to get $15 for what he felt was "dry and bording" <br> <br>Stuart :D </p>
  - id: 2615
