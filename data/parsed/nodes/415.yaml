    html: <p> Jared -- <br> <br>Regardless of whether a publisher intends to keep a book in print or not, the rights to publish, adapt, and distribute a work are retained by the copyright holder (usually either the author or the publisher). This includes electronic forms. <br> <br>There is an provision to the copyright law known as the "fair use" exception which allows for some copying without permission for cases of criticism, reporting, teaching, and scholarship. These exceptions, however, do not generally allow for the copying and distribution of an entire work. <br> <br>So if you wanted to create and distribute a digital "reprint" of Moye's book, you'd need to get permission first. <br> <br>-- Kent. </p>
