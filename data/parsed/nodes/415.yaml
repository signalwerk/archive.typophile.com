    html: "<p> &gt; the seller was thrilled to get $15 <br> <br>The seller wasn't smart enough to advertise the sale properly. <br> <br>---- <br> <br>WARNING: controversial opinion below. <br> <br>&gt; Any ideas? <br> <br>In situations where the legal owner of the \"property\" is seen as sufficiently unreasonable, I would recommend taking guerilla action. For example, re-publish the work on a site of a political entity that doesn't have a copyright agreement with the US. Failing that, on a site of a country that does have a treaty, but also happens to have enough bigger problems that they would never come after you. This includes most countries on this planet. <br> <br>The letter of the law must not be allowed to overpower decent behavior. <br> <br>HOWEVER, you need to make sure that: <br>1. Your guerilla action is motivated by unreasonable behavior on their part, and not simply because you don't have the mettle to do things legitimately. <br>2. You make no material profit from the process. <br> <br>hhp </p>"
