    html: "<p> Hrant: I'm not saying it's fair. Jared just asked what the law says. I think the publisher is being short-sighted and will tarnish it's reputation with stubborn practices like this. Hopefully, Mr. Moye will negotiate a better contract next time. <br> <br>Stuart: The information in the book is not copyrightable -- that is, the ideas are not protected, just the actual expression of them. You can share the same ideas in your own words with your own examples. Mr. Moye could re-express the same ideas in new ways and possibly publish a new book on the same topic (with another publisher, undoubtedly). <br> <br>There is, of course, a gray area where new expression of old ideas and plagiarism meet. My point is, just because a bull-headed publisher refuses to reprint (which I can understand) or to give permission (which I can't necessarily agree with) doesn't mean that the information is lost or trapped.  <br> <br>Disclaimer: I'm not a copyright attorney, nor have I ever played one on TV. <br> <br>-- K. </p>"
    html_clean: "<p> Hrant: I'm not saying it's fair. Jared just asked what the law says. I think the publisher is being short-sighted and will tarnish it's reputation with stubborn practices like this. Hopefully, Mr. Moye will negotiate a better contract next time. <br> <br>Stuart: The information in the book is not copyrightable -- that is, the ideas are not protected, just the actual expression of them. You can share the same ideas in your own words with your own examples. Mr. Moye could re-express the same ideas in new ways and possibly publish a new book on the same topic (with another publisher, undoubtedly). <br> <br>There is, of course, a gray area where new expression of old ideas and plagiarism meet. My point is, just because a bull-headed publisher refuses to reprint (which I can understand) or to give permission (which I can't necessarily agree with) doesn't mean that the information is lost or trapped.  <br> <br>Disclaimer: I'm not a copyright attorney, nor have I ever played one on TV. <br> <br>-- K. </p>"
