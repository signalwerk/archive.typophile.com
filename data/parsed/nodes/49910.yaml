    html: |-
      <p>First thing that strikes me is optical correction. Even when you are making a typeface based only on geometrics, optical corrections are really important. </p>
      <p>Problem areas are:</p>
      <p>Where strokes join a stem (e.g. on the a, c, d, g, and also the r !) Usually it looks better optically if you let the strokes become <em>slightly</em> thinner where they join the stems. Eventhough this goes against a geometrical approach, it will look better. It will, for example, eliminate evil black blobs from appearing. You create some open space.</p>
      <p>Also horizontals. Those should be slightly thinner than other strokes. This is because our eyes make horizontal lines look heavier. You have to adjust this by eye, so that it <em>looks</em> the same weight as the rest. Look at your 'e' for example (especially in the bold 'Boulevard). Lightly thinning up the crossbar will also open up the counter(s).</p>
      <p>The same goes for diagonal lines, those usually also look fatter when they are actually exactly the same as the other strokes. Those need adjustments by eye as well.</p>
      <p>So you have to 'cheat' here and there: it's all about <em>making it look</em> geometrical. Apart from that, I think you are nicely on your way. You could ask yourself if people are waiting for another geometrical sans serif, since the competition in that area is pretty heavy. But designing it for yourself; as a means of learning type design, it's perfect. :)</p>
      <p>For better critiques on lettershapes themselves, it's best to post a PDF, so people can take a better look at them (and maybe even print it so to be able to judge it even better).</p>
