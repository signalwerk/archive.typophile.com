    <p>I spotted a nice font on the Sonic menu a few weeks back, and today I saw it also featured on the menu at Steak 'n Shake. I've searched high and low and I can't find! It's driving me nuts.</p>
    <p>Here's two examples from Sonic (sorry for the lack of size):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/sonic_type_4129.jpg"></div><p></p>
    <p>And two from Steak 'n Shake:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/steaknshake_type_5884.jpg"></div><p></p>
    <p>I thought about it being a corporate font, but I am not sure that the same company owns both places. Any help would be appreciated!</p>
