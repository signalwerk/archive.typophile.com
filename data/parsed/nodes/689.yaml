    html: "<p>hi, Tiffany. <br> <br>I worked with Natalia at the same publisher where she developed her typeface (it was done for a series of schoolbooks), and I'm pretty sure the typeface belongs to the publisher, called Puerto de Palos (<a href=\"http://www.puertodepalos.com\" target=\"_blank\">http://www.puertodepalos.com</a>). Natalia no longer works there, but I could send you the current art director's contact info (it's not on their website). Or you could just contact Natalia (see Hrant's message above). Let me know what you think. <br> <br>btw, Natalia posted here once, on a Hispanic Community thread: <br> <br><a href=\"http://www.typophile.com/forums/messages/4077/5025.html?1056987523\" target=\"_blank\">http://www.typophile.com/forums/messages/4077/5025.html?1056987523</a> <br> <br>her message is at the very end. :-) <br></p>"
