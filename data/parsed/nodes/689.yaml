    html: <p>Tiffany <br>Natalia's work is a custom typefaces.... like my Estrada Hand too. <br><a href="http://www.sudtipos.com.ar/servicios.htm" target="_blank">http://www.sudtipos.com.ar/servicios.htm</a> <br> <br>There are some characters shapes in education here that doesnt fix with the existing tyefaces. <br> <br>In my case, Editorial Estrada called me because they were using a handwriting font to teach 6 years old childs to write. But the problem was that the teachers seems to use diferent characters than the editorial used at the book. So... childs were confused and we had to develope a lot of changes at the original font.. <br> <br>Sorry for my english</p>
