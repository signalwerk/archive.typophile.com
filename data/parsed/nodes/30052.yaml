      <p>I like the drum from version A better than the one from version B. The drawing is a little less rigid-looking.</p>
      <p>I'd increase the white around the bottom of the 'J' (where it overlaps the drum) just a little bit. Remember that if this logo is reproduced in one-colour at a small size (say in a faxed letterhead) the 'J' may become one with the drum. I'd also recommend creating a second version of the logo without the subtitle for this kind of purpose.</p>
      <p>I second Ben's suggestion to dehyphenate "custom drums".</p>
      <p>Overall, it looks very clean and connotes "high quality" to me. Good job.</p>
      <p> - Lex</p>
