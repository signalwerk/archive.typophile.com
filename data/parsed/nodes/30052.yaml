    <p>hello all,</p>
    <p>i am creating a logo for a guy who builds high quality african drums.<br>
    for those who know more, they are called djembes and dununs.</p>
    <p>my first samples for him included more "african" fonts, bolder and more playful.</p>
    <p>he really likes the Trajan and wants to go with a font like the Trajan.</p>
    <p>My Questions to you:</p>
    <p>A) What is your overall impression if you see these logos? Does it look like high-quality drums? does it still look like he is selling affordable drums? do you think it needs a more "african/ethnic" touch?</p>
    <p>B) Which version do you like best?</p>
    <p>C) Any suggestions for another font and general comments.</p>
    <p>Thank you.</p>
