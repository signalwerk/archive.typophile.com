      <p>I'm actually not a huge fan of either Trajan or the old "ethnic" font -- Trajan seems more appropriate for a wine bottle or movie poster and the sans seems too wiggly, suggesting more a toy store than anything else. I do like the illustrations you did on the capital letters, although in the end it might prove to be an unnecessary extra flourish.</p>
      <p>My suggestion is to go somewhere more in the middle. A humanist sans-serif, maybe one based on a seriffed roman (like StormType's <a href="http://www.myfonts.com/fonts/storm/john-sans" rel="nofollow">John Sans</a> and <a href="http://www.stormtype.com/typefaces-fonts-shop/families-58-amor-sans" rel="nofollow">Amor Sans</a>, although those aren't great for your project -- maybe someone more familiar with humanist sans-serifs could help out?) would be good, combining the new with the old. But I think any fun, humanist sans-serif (but not too whimsical a sans) could be perfect. However, as I mentioned, Trajan is fine if it has to stay.</p>
