      <p>I like them! I think that your drum logo in A is terrific -- B is still good, but A and C have more flowing and therefore musical feels to them. The abstractness of the drum shape makes it seem like your client got someone to design the logo for him (which he did), which suggests that he has high-quality products.</p>
      <p>I think that the illustration is strong enought to convey the message regardless of the typography (although I can scarcely believe that I'm saying this, especially here). That said, I'm not sure if Trajan is a great match -- Trajan connotes Roman statues, not African music. I'd think that a modern, <em>flowing</em> sans-serif might work better, to combine with the clean, sleek lines of the drum. But if the client is set on Trajan, as Ben and Lex said, it still looks quite elegant and different.</p>
