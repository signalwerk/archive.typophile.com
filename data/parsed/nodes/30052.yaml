      <p>For your business card I would consider centring the type on the JebeBara side and have the drum illustration hanging off to the left. On the reverse I would drop the zigzag and knockback drum and some of the drummers, the zigzag could cause problems to the printer when it comes to trimming and doesn't seriously add to the design, however if you needed/wanted to keep it consider moving it away from the edge, the knockback drum also doesn't add to the design, while your logo is a combination of brush illustration and elegant type the reverse is a little overpopulated, the illustrations are charming, however, some of them look a little like drafts for the others and one of them looks like a banjo player, while the central figure resembles a butler, stiff posture and not as fluid as the others. Finally why print the texture and not use a proper textured stock?<br>
      Tim</p>
