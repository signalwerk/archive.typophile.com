      <p>Hi Anke</p>
      <p>Reading your post I was thinking '...ohhh this will be another job set in Neuland', so I'm happy to see otherwise on the samples. Trajan has a historical 'high-quality' association in the West, and maybe in other parts too, so it's a good pick on your clients' part. It appears to me that the brush drawn illustration is trying to do two things at the same time – be approachable/good value <em>and</em> be upmarket. My advice is to settle for one or the other.</p>
      <p>I prefer version A for the relationships between the image and the type.</p>
      <p>You really don't need to hyphenate 'custom-drums' (the fact that they are custom, and that there are many of them, will stand as it is, with only a wordspace between the two).</p>
      <p>Note that you can always get titling capitals to look classier (and therefore more upmarket) by letterspacing generously.</p>
