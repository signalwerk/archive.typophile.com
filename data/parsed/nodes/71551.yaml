    <p>From the end of September 2010, expert classes on type design will be provided by the Plantin Society in Antwerp. The secrets behind the contemporary formal typographic representations of the Latin script, i.e. the underlying harmonic, proportional and rhythmic structures of the capital, roman and italic letters and the related typographic conventions and rules, will be analyzed and dissected. Available software for font production for Mac OS, Windows and Linux, like (but not limited to) FontLab Studio, FontForge and DTL FontMaster, will be reviewed and first steps towards designing type will be made.</p>
    <p>The lessons are divided into two modules; for the first module no specific entry level is required, for attending the second module, the first one has to be successfully completed.</p>
    <p>The lecturer is Frank E. Blokland, founder of the Dutch Type Library, architect of the DTL font tools, and Senior Lecturer ‘Letters’ at the Royal Academy of Art, The Hague.</p>
    <p>The expert classes will take place at the beautiful historical premises of the Museum Plantin-Moretus (<a href="http://www.plantin-moretus.be/" title="http://www.plantin-moretus.be/">http://www.plantin-moretus.be/</a>).</p>
    <p>More info can be found at: <a href="http://www.plantingenootschap.be/?page_id=67&amp;lang=en" title="http://www.plantingenootschap.be/?page_id=67&amp;lang=en">http://www.plantingenootschap.be/?page_id=67&amp;lang=en</a></p>
