    <p>What are the best setups of opentype classes for working with diacritics and other modified letters?</p>
    <p>My font has stylistic alternates and small caps. I'm hoping for advice both on how to structure classes, and efficient ways to set them up.</p>
    <p>Do you have a giant @diacritics class with all of those letters in a long list? (and a @diacriticals.smcp class to go with it)? Do you organize by key letter (@adiacritics, e.g.) and then list all those in the smcp code? Or can you have a class of classes?</p>
    <p>Are there shortcuts for generating any of these classes?</p>
