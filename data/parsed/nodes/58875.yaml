    html: |-
      <p>I suspect a lot depends on what font editing program you have.</p>
      <p>I too use a text editor, but one that has numerous capabilities, such as a column mode, sorting, change to case, etc. I use Vedit, but it is out of date. EditPad Pro would be much better.</p>
      <p>I can describe a couple things that I do, but this should be taken only a suggestion of how to think about things, not a recipe.</p>
      <p>First, I write off an .afm file. It will have all the characters. On a PC, you can them use grep to search for all instance of, say, ".sc" in the afm file, and pipe them to another file. Working in that file, the columnar mode will quickly let you erase everything but the character names. Search &amp; replace the returns with a space, and you now have a row. Copy the row, and search &amp; delete the .sc (or .scmp or whatever). You now have a second row with the same order as the first. Copy that row, and apply a lower case" routine to the third row.</p>
      <p>You now have three rows, one with all the small cap characters, and matching rows with the caps &amp; lower case. Each to become a class. The only potential problem I'm aware of is the dotted cap I and small cap "I" for Turkish. Likely you could come across others, in some languages. But since you started with only the small caps, the problems will be minimal.</p>
      <p>A similar search of the .afm should work for you stylistic variants, which you will have named ".alt" or ".alt01" ".alt02" etc. A sort may not be needed, but a text editor that will do that can be handy.</p>
      <p>etc.</p>
      <p>If I'm making a few changes to a font, I trust myself to the new add glyph names to the end of the class row. If there are a lot of changes, I write off a new .afm &amp; do the construction work again. It doesn't take long.</p>
      <p>I do something a bit different with the numbers; each kind of 0-9 has its own row. Then other thing also switched with numbers, (dollarsign, plus, minus, divide, etc. etc. for lining versus oldstyle) has it's own row, as does comma, period if I've made ones up for tabular numbers. Here, the splitting into separate rows makes things easier when you have to find things (read: fix problems).</p>
      <p>On purpose, I'm not efficient with classes. I'll make more than are needed, so I as a human can find things &amp; work on them. For example, I make up separate classes for the features tnum, pnum, onum and lnum. Each feature having 2 classes e.g., -- tnumb1 and tnumb2 as well as pnum1 and pnum2. The features programming doesn't need this -- but it is easier for me as an older human being (so I claim) to keep track of things. A real programmer would likely object to this wastefulness, and if you're careful, you can use fewer classes &amp; maybe save some space in the file. Not my biggest problem.</p>
      <p>But enough -- if this is the sort of thing you're interested in, you get the idea. If not, sorry to waste your time.</p>
