    html: |-
      <p>When I was working on the classes in Black Monday I did a copy/paste from the font window to Textedit, saved it to a text file, used this command:</p>
      <p>tr '/' '\n' &lt; ./bmonday_encode.txt &gt; ./bmonday2.txt </p>
      <p>to insert real line breaks, and this one:</p>
      <p>sed -e s/$/.alt1/g bmonday_formatted.txt</p>
      <p>to create my big alternate classes. This allowed me to deal with the classes in Textedit where I can use 14-point Verdana to spot any mistakes before I work them into Fontlab.</p>
      <p>And remember, save your OpenType classes any time you edit them in Fontlab. You <em>will</em> accidentally use the evil class sorting button that deletes them at some point, so be ready.</p>
