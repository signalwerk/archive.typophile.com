    html: |-
      <p>If you're talking about classes for layout features and not kerning (well, kerning is a layout feature, but you know what I mean), then a lot of it comes down to what makes the most sense for you as a font editor.</p>
      <p>There is sense in setting up a big lowercase class, @LC = [a b c d ...], and having a matching small caps class, @SC = [a.sc b.sc c.sc d.sc ...]. Such classes could include all the accented characters. These classes could be fairly easy to manage with a visual editor like FontLab.</p>
      <p>When it comes to some contextual substitutions, you might want a class of "all letters" for some particular contextual rule, so you could then make a "class of classes": @LETTERS = [@LC @UC @SC].</p>
      <p>If you're using a text editor and a features file, you might eventually find, as I did, that editing large classes like this can be difficult. Complementary classes have to match 1-to-1, and if there's an error, you'll find yourself poring over long class definitions trying to find the error.</p>
      <p>In practice, you can specify basic letter ranges in shorthand, e.g. [a-z], so this can help. But I've found in some cases that it's helpful to see a list of single substitutions, e.g.</p>
      <p>sub dollar by dollar.oldstyle;<br>
      sub cent by cent.oldstyle;</p>
      <p>and so on. It's tempting to start by putting everything in classes, but it's not always the best solution.</p>
