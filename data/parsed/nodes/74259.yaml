    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ion_c_poster_01_3869.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ion_c_poster_05_4922.jpg"></div><p></p>
    <p>Hello everyone, this is my newest typeface that started as a Python script experiment and now transformed into a regular font family.</p>
    <p>ION superfamily consists of 3 families  — condensed (ION A), normal (ION B) and wide (ION C). The glyphs are based on the classic 7-segment display. Every ION family has a compelling range of 10 weights, supports more than 70 Latin-based languages and various OpenType features, including discretionary ligatures, fractions and stylistic sets. The family is completed with a special box-drawing font called Cells. See and read more at <a class="freelinking external" href="http://www.urtd.net/ion" rel="nofollow">Urtd</a> or go check it at <a class="freelinking external" href="http://new.myfonts.com/foundry/Urtd/" rel="nofollow">MyFonts</a>.</p>
    <p>Thanks for your comments!</p>
