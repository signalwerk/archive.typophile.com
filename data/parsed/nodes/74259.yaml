    <p><img src="/sites/default/files/old-images/ion_c_poster_01_3869.jpg"></p>
    <p><img src="/sites/default/files/old-images/ion_c_poster_05_4922.jpg"></p>
    <p>Hello everyone, this is my newest typeface that started as a Python script experiment and now transformed into a regular font family.</p>
    <p>ION superfamily consists of 3 families  — condensed (ION A), normal (ION B) and wide (ION C). The glyphs are based on the classic 7-segment display. Every ION family has a compelling range of 10 weights, supports more than 70 Latin-based languages and various OpenType features, including discretionary ligatures, fractions and stylistic sets. The family is completed with a special box-drawing font called Cells. See and read more at <a href="http://www.urtd.net/ion" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Urtd</a> or go check it at <a href="http://new.myfonts.com/foundry/Urtd/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MyFonts</a>.</p>
    <p>Thanks for your comments!</p>
