      <p>You're welcome Mike. I have seen additional letters but I can't recall offhand where this was. Anglo Gothic may have originated in England. It was registered by Miller &amp; Richard in 1869. Perhaps one of our Typophiles in England, or elsewhere, has access to an old Miller &amp; Richard  book with the font and could post a good quality scan or put it on a file hosting service if it is too large for a post at Typophile.<br>
      Unfortunately for modern font makers, it was very rare for Victorian foundries to publish complete alphabets. This might be obtainable from the English registration or from a font acquired by the McBride Museum in England.<br>
      Don</p>
