    html: |-
      <p>Found a digital font with a somewhat similar simplification to monoline:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Marianblack_5171.jpg"></div><br>
      <a href="http://commercialtype.com/typefaces/marian" rel="nofollow">Marian Black</a> by Commercial Type. "Marian imagines the classics of the typographic canon reinvented for the contemporary world: Garamond, Granjon, van den Keere, Kiš, Fleischmann, Fournier, Baskerville, Bodoni and Austin restyled and revived. These aren’t strict revivals, for they are not accurate recreations, nor are they interpretations per se. Instead they reduce the historical models to their basic skeletal forms. Nine serrifed typefaces and one Blackletter reduced to their basic structure. This reduction strips them to their core, whilst at the same time retaining the life and spirit of the letters."<br>
      Don<p></p>
