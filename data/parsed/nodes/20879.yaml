      <p>Tiffany,<br>
      I understand your concerns, and it has been my concern for a long time.  But you can't stop people from reading whatever may be said and replying with "This Empire is crumbling", or here's a link to a bbc website with something that has nothing to do with the topic, or "here's a link to pictures of cute bunnies". Random stuff that people are obsessed with.   These things come in and the ---- hits the fan. </p>
      <p>People are itching to talk about this stuff. They hang out here because they're with friends of similar interest in design so they may feel more comfortable than going to some wacko political site.  And maybe they feel with time they can enlighten some of their type friends, with whom they have so many other things in common.  They will continue to talk about politics and it "will be more than they can handle" here, or on another thread, so just give them a place.</p>
      <p>&gt;Same with food.<br>
      The food talk went on in a thread about a magazine cover that had nothing to do with food whatsoever.  That was my point about people not sticking to the context, including yourself.</p>
      <p>If this thread doesn't stick around then I'll go with Patty's suggestion of the cable news graphics, put them up and people can discuss politics in that "context".  It'll just take me some time but in the end we'll be right here all over again.</p>
      <p>ER</p>
