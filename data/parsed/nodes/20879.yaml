      <p>From what I see I think you mean that music or food are fine threads to have because they inspire or have something to do with people and their work.  I don't listen to music while I work, and don't cook.  I eat, but don't think about food while I work at all.  I do think about politics, and at times it inspires me.  There might be some others that are inspired by the same thing and they should have a place as well.  Everyone's work is not quiet or apolitical or simply about aesthetics.  There should be room for them and their negativity, or what I like to call their reality.  </p>
      <p>But, as moderator, you run the place, so it's really your decision to make in the end I suppose.</p>
