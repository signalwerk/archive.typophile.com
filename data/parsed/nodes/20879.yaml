  html: <p>I think everyone needs a place to vent and talk about the issues of our very complex world.  This thread could help that discussion.  How to start? Well, are typographers and designers responsible for how their work, especially fonts, is used in propaganda and communications by governments, the military, and the media?  You are also encouraged to post pictures of your pets!  We can talk about them too!</p>
