      <p>Norbert,</p>
      <p>Well, when the "sage" comes in and says "kid, take it with a grain of salt", I listen.  So, there won't be any ranting from me anyomore I think.  Pretty hard, came from the "if you get hit, hit 'em harder school".  I don't think there are problems here when you talk about the "how" work gets made.  It is a wonderful resource for everyone.  Occasionally the "why" we do it will come up, which I think is a great subject.  That's when things could easily go bad.  </p>
      <p>So, when that happens, I encourage everyone to write "Hey, get Norbert over here", or send him a message to come over on the double.  I think that's the best solution I can come up with so far.  You could become a very busy man.  Or, we can just have better, more constructive, and thoughtful comments on the forums.</p>
      <p>In the meantime, I hope this thread becomes more of a hangout for some abstract thought, mindless discussion, a place to figure out where the "right" side of the bed really is, if driven snow is really pure, whatever.  This is the stuff that brings inspiration.</p>
      <p>j_polo9:  the thread you seek is somewhere, but I shall not guide you there from here. Seek and ye shall find.</p>
      <p>Thanks,</p>
      <p>ER</p>
