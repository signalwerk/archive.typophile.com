      <p>&gt;don’t let the door hit you on the way out.</p>
      <p>Now we're talking! that's pretty good for a personal attack, keep it up.</p>
      <p>&gt;Going for the jugular with a line about America being to blame for the world’s problems </p>
      <p>I mean, they are, look around the globe, they're taking over every country. If not through war, then through the Capitalism they export. And what is the tool of Capitalism if not Typography and logos and graphics.  So, to some degree, I think designers should take some responsibility for creating fonts that the military can use in their e-mails, papers the Pentagon prints up, etc.  Fonts are used by all the television media to promote war and mayhem on a constant basis.  So, I think designers should take some responsibility for that too.</p>
      <p>When you design a font, is there a way of stopping someone from doing something malicious with it, such as promote war?  </p>
      <p>&gt; If you had opened the thread with a comment on, say, the use of typography in political propoganda I think we might have a lively discussion going on here</p>
      <p>check out the image I mentioned above: <a href="http://lmno4p.org/images/01.04/state_of_the_union.jpg" title="http://lmno4p.org/images/01.04/state_of_the_union.jpg">http://lmno4p.org/images/01.04/state_of_the_union.jpg</a></p>
      <p>It's typography and political propaganda, and it's ineffective.  It's just confusing I think.  The peace sign kind of gets in the way.  It's a statement upon a statement.  Maybe just type would have read better, don't you think?</p>
      <p>ER</p>
