      <p>Hmm.... I see a new problem with my solution to this protest sign:</p>
      <p><a href="http://lmno4p.org/images/01.04/state_of_the_union.jpg" title="http://lmno4p.org/images/01.04/state_of_the_union.jpg">http://lmno4p.org/images/01.04/state_of_the_union.jpg</a></p>
      <p>If the peace sign moves over to where the "O" is in "NO", then one poor schlub is left holding the blank space sign.  What self respecting protestor would want to do that?  So therefore, I think they sacrificed typographical integrity for the needs of the individual to feel some sense of importance.<br>
      Do you think that is a worthwhile pursuit?  Are there times when a person's need to feel like they "count" gets in the way of good design?</p>
      <p>ER</p>
