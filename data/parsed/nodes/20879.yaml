      <p>Thank you, Edel, I am heartened by your reply.</p>
      <p>&gt; <em>So, I’ve lost some of my initial respect for this place.</em></p>
      <p>This is a point shared by some other forum regulars. Myself, I've been here for scarcely over a year and found Typophile to be one of the few forums with depth and breadth for those of my ilk.</p>
      <p>Typophile has in the past and is currently beset with occasional but intense rants and bashing. You happened to enter during one of "slug-fests" and some of that blood lust leached into topics unwarranted. </p>
      <p>I wouldn't want to see <em>more action</em> taken by moderators, but I also wouldn't want to see active and viable contributors retreat from posting for whatever personal reasons they have.</p>
      <p>What has made Typophile such a unique site is the level of free assistance the experienced and learned contributors are openly willing to give any newcomer, noobie, novice, lurker, student, teacher, et al, without being condescending. It's tough enough for some of these folks to post a reasonable or legit question (silly or not). The fear of being bashed or trashed will only cause a dwindling down of actively inquistive membership, the result being a small camp of closed minded <a href="http://curmudgeons.blogspot.com/" target="new" rel="nofollow">cumudgeons</a>.</p>
      <p>So I'm not really sure where this particular topic thread will go, or if the bashing will subside of its on avail. I just hope individuals such as yourself and others who frequent the forum, those with a passion for the craft, a love of art and who are in awe of life, continue to mix it up for the greater good of all.</p>
