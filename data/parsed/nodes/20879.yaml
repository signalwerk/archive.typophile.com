      <p>Tiffany,<br>
      This is a good place for people to come when politics intrudes onto the type threads.  People could be sent here instead to discuss their issues.  </p>
      <p>About trying to keep Typophile "on topic" there is a lot of stuff that doesn't belong here then.  Maybe you can delete "who are the rock stars here?", "hey, what are you listening to?", "happy birthday, such and such", or "most recent issue of CA", no type on that cover at all.</p>
      <p>Here is a link that brings type and politics together, maybe we can discuss that:  Do you think this protest sign is successful?  I think a better solution would have been to put the peace sign in place of the "O" in "NO WAR".  And the "W" seems a little strange looking.  Also, if people would have moved closer together, I think the kerning would have been more successful.  What do you guys think?:</p>
      <p><a href="http://lmno4p.org/images/01.04/state_of_the_union.jpg" title="http://lmno4p.org/images/01.04/state_of_the_union.jpg">http://lmno4p.org/images/01.04/state_of_the_union.jpg</a></p>
      <p>ER</p>
