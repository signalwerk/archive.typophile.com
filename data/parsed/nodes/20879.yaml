      <p>I have found your comments, interviews and samples of your work on other sites not only engaging, illuminating and insightful...<br>
      which makes it a wee bit troubling seeing that insight turn to incite!</p>
      <p>This thread is a little too rambling (yes, I've lurked) and has lost (though never had) central focus. Your contribution to the graphics and illustration world is too significant to be mal/misaligned through knee-jerk reactions, and I believe your contribution to this forum can be formidable when grounded with more of your own true being.</p>
