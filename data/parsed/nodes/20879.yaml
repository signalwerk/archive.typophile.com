      <p>Norbert,<br>
      Thanks for the compliments, from what I can glean you are probably one of the old sages around here.  And yes, you're right, I'm not a raving loon.  </p>
      <p>Unlike others here, I did not put up my work for discussion.  I found that it was being discussed and thought I'd bring something to the table of learning by giving some input and some of my "own true being", which is what I thought people where interested in. </p>
      <p> Instead, I have just spent a couple of weeks on a thread where my work has been called "utter cliche crap", the work of a 16 year old, or a college freshman.  My opinions, which are farely educated ones, have been called those of "someone half my age".  Some of my simple questions have made some "want to puke".  So, I've lost some of my initial respect for this place.  Unfortunately, one thing I do, is that I don't leave an attack unanswered.  Usually with some comedy, which at times isn't "gotten" by some.</p>
      <p>I thought a little satire would be in order and I started this thread as a silly provocation to just get these subjects going on here.  I thought it could become everyone's bathroom wall, a place they can come to vent so that other threads could remain cleaner.  But, hey, we're people, so let's keep on keepin' on hijacking other threads with our personal politics.</p>
      <p>I also believe my contribution to this forum can be an addition.  Since I'm actually a purchaser of what you make and have a track record of good work, I thought my opinions could bring something to the place.  However, sometimes it seems like people, even many that are in college and could actually learn something from experience, could care less.</p>
      <p>ER</p>
