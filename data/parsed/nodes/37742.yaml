  html: |-
    <p>I have a query on how the cmap table works with glyph ID which I’m hoping somebody can shed some light upon:</p>
    <p>Are glyph ID number font specific, or encoding specific? </p>
    <p>For example, I have a font which I am working on and the ’ydiresis’ glyph has a glyph ID ’203’. I checked this against the Georgia font on my operating system, and here the ’ydiresis’ glyph has a glyph ID ’185’.</p>
    <p>As long as the cmap table is correctly defined, would this function properly on older apps/os, or do glyph ID’s have to conform to an encoding (and then this has to be specified in the cmap table)?</p>
