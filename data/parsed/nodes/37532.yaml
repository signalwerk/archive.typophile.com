  html: <p>There was a client change suggested to a logo I'm working on for the phrase "Memories are made of..." Now since this is a company name, they want it to say "Memories Are Made Of..." Setting it that way seems a little off since half those words usually don't take initial caps. Is there any standard regarding this? Should I push to keep them lower? or maybe compromise with "Memories are Made of..."?</p>
