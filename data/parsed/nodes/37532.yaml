    html: <p>The grammatical rules are good if you're in automatic mode for a repetitive situation like headlines, but for a one-off title or name you have to use some aesthetic discretion and take into account things like word length and the size of initials as well. So really -- whatever looks best, and damn the rules. If you flout convention, this will really only be offputting to a very small percentage of literary editors.</p>
