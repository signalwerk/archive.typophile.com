    date: 2007-09-26T07:20:00
    date_raw: 26.Sep.2007 7.20am
    votes: null
    html: |-
      <p>Usually just conjuctions and articles (in, of, to, the, this, that etc) take lower case (ie not verbs). A common mistake is to capitalise based on the size of the word rather than the part of speech (eg verbs, adjectives, adverbs and nouns would usually be capitalised in Title case). The temptation in this case is to put 'Memories are Made of...' but I think that's poor. I thinnk it should really be 'Memories Are Made of..." but that looks weird. Since it is the theoretical start of a longer sentence (hence the ellipsis) I would push for all lower case with an initial cap M.</p>
      <p>No doubt some will disagree with me and want to drop the caps for some verbs which are short.</p>
