    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mackinac_news_6743.jpg"></div><p></p>
    <p><strong>P22 type foundry proudly announces P22 Mackinac Pro, a brand new font family designed by Mike Beens for the International House of Fonts.<strong></strong></strong></p>
    <p>P22 Mackinac Pro (pronounced Mackinaw) spans four centuries of type design, bridging the Old World with the New. This family of four weights and corresponding italics is of old style construction, with a diagonal weight stress. Contrast between thick &amp; thin is modest and proportioned the same for all fonts. The tall x-height recommends itself to a wide variety of text and display uses; including advertising, publishing, signage and packaging.</p>
    <p>The P22 Mackinac Family contains 24 styles: 8 Pro styles for applications that support OpenType features and 16 companion styles in basic OpenType format for use with document-based applications. P22 Mackinac Pro OpenType features include: small caps, ligatures, ordinals, numerous figure options and other bonus features. Mackinac supports 56 languages using extended Latin character sets.</p>
    <p>For more information or to download the Mackinac Family pdf:<br>
    <a href="http://www.p22.com/ihof/mackinac.html" title="http://www.p22.com/ihof/mackinac.html">http://www.p22.com/ihof/mackinac.html</a></p>
