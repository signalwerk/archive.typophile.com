  html: |-
    <p>Got a great gig designing an iPad app with a decidedly comedic twist, but it must embody a Medieval spirit. For font choices the previous designer started with Gryphius for body copy (which I think will work) and a blackletter font for the headers. For titling and subheads I'm open to also considering a more Celtic Uncial style but want it to 1) have a bit of a soft or crumbling edge and 2) maintain legibility since it will be read on screen, so the counters can't be too narrow and pinched looking. I'm considering Brokenscript and Canterbury but not crazy about either of them. Any ideas? Thanks.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Gryphius_3557.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Brokenscript_3762.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Canterbury_5948.png"></div><p></p>
