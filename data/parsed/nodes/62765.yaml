    <div class="info">Submitted by <a href="/user/827" title="View user profile.">Ale Paul</a> : 6.Oct.2009 8.54am </div>
      <p><a href="http://www.sudtipos.com" rel="nofollow">Sudtipos</a> is proud to announce the release of two really different new fonts. <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000502#specimen" rel="nofollow">Ricotta</a>, a fresh new ingredient for your packaging designs and <a href="http://new.myfonts.com/fonts/sudtipos/cascabel/" rel="nofollow">Cascabel</a>, a modular modern font with multiples alternates.</p>
    <p></p><div class="imageWrap"><img src="/files/typophilericotta_6206.jpg"></div><p></p>
    <p>About <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000502#specimen" rel="nofollow">Ricotta</a><br>
    Another unmistakable Koziupa/Paul production, Ricotta has very little baby fat for a sturdy brush script. What movement it shows is effective and integral to its expression, which is at once compact, lush and eye-catching. Ricotta, and its subtle details in just the right places, should feel at home among the bright and cheerful colors of dairy product and pizza packaging.</p>
    <p>About <a href="http://new.myfonts.com/fonts/sudtipos/cascabel/" rel="nofollow">Cascabel</a><br>
    Cascabel was built on a modular harmony and creates visibly maze-like geometric structures. When typeset in complete words, it conveys an unmistakable architectural approach to a design project. Ideal for magazines, posters or flyers, Cascabel is an alphabet functionally defined by a concept similar to that of building blocks. Designed By Ariel Di Lisio and digitized by Ale Paul.</p>
