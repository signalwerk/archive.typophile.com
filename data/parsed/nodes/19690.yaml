    <p>hello</p>
    <p>im looking for opinions on <a href="http://www.lineto.com/The+Fonts/Categories/Text+Fonts/Akkurat/" target="_blank" rel="nofollow">akkurat</a>, esp. its use for text - i know, there are more suitable faces for longer texts, but i rather think of short paragraphs of text, its use in short letters, etc.</p>
    <p>hows the quality of "craftsmanship" in akkurat? after all, it would eat nearly half my month income, so i dont wanna spill out that money for "nothing".</p>
