    html: |-
      <p>I've been using lots of Akkurat for the last year, since it had already been specified as the primary type for a client of mine. I actually think it's a lovely design, with more personality than Helvetica. It has a certain crisp, clean feel to it, but doesn't feel nearly as cold and precise as Helvetica, IMHO.</p>
      <p>It works pretty well as text in short bursts, although I find it the regular weight a little heavy for most text uses. The light weight works well, and has nice contrast when mixed with the bold. The spacing overall feels pretty good, although I tend to tighten it up a little bit for text use.</p>
      <p>For the moment I still have a couple of sample postcards you can look at for an idea of how it works as text versus display:</p>
      <p><a href="http://transfer.ultrasparky.org/ps122/postcards/Danceoff_postcard.pdf" title="http://transfer.ultrasparky.org/ps122/postcards/Danceoff_postcard.pdf">http://transfer.ultrasparky.org/ps122/postcards/Danceoff_postcard.pdf</a></p>
      <p><a href="http://transfer.ultrasparky.org/ps122/postcards/Hell_postcard.pdf" title="http://transfer.ultrasparky.org/ps122/postcards/Hell_postcard.pdf">http://transfer.ultrasparky.org/ps122/postcards/Hell_postcard.pdf</a></p>
    html_clean: |-
