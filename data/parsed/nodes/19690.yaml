      <p>Well, I'm certainly not an admirer of Helvetica in the first place, but why spend more than $400 for a typeface with only six weights when it looks like a copy of ... HELVETICA. There are so many other options for better looking Sans serifs. The second best option would be to buy a bunch of adobe Helvetica Nuew and at least save you some money for other fun things!</p>
      <p>Please note that this is a very personal opinon, and secondly no offence towards Lineto, I just think the prices are out of range...</p>
