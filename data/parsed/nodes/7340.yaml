  html: <p>What are good typefaces for gravestones? <br> <br>All things being equal, I would have the Johns Stevens Shop in Newport carve me a stone. My question here is theoretical, though. If you were looking for a typeface to use on a grave stone, which would it be? <br> <br>Unfortunately, John Benson hasn't ever released any of his inscriptional typefaces!</p>
