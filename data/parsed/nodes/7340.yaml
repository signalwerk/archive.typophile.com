    html: "<p>I think you'll might find Martin Andrew's talk at St.Bride's last year interesting. He spoke about (and showed some super examples of) coffin plates from the vaults of St.Marylebone Church, London. The plates date from 1801. He also talks about 'The Universal Penmen' a hugely influential book on lettering in the 18th century.  <br> <br>The paper is up on the website (<a href=\"http://www.stbride.org\" target=\"_blank\">http://www.stbride.org</a>). Unfortunately the site doesn't allow you a direct link but if you're interested, look under 'conference' and then 'Hidden Typography: the 2003 proceedings'. Its the first paper there, aptly titled Stiff Type<img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>RR</p>"
