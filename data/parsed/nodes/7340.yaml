    date_raw: 28 Oct 2004 — 12:20pm
    votes: null
    html: <p>I don't think that any type can be used to cut on stone. A proper design is requested, not all typefaces are suitable. <br> <br>If you know for example the British Museum stone cuts, you can see there that the horrible Rotis is again used for the stone carving as model. BUT, hopefully, the stone cutter have done a very good job and transformed the original Rotis into a workable type for such job. <br> <br>Also, I don't see any Garamond, Baskerville, Bodoni or a Grotesque Sans, cut on stone. Specially not so much lowercases and specially not Italics!  <br> <br>Humanistic Caps only (or something like Lithos), a good creative letterform design, not specially connected to usual Rome models. Well spaced, with some ligatures :-) <br> <br> <br>(I'm probably to traditionnalist on that area?)</p>
    html_clean: <p>I don't think that any type can be used to cut on stone. A proper design is requested, not all typefaces are suitable. <br> <br>If you know for example the British Museum stone cuts, you can see there that the horrible Rotis is again used for the stone carving as model. BUT, hopefully, the stone cutter have done a very good job and transformed the original Rotis into a workable type for such job. <br> <br>Also, I don't see any Garamond, Baskerville, Bodoni or a Grotesque Sans, cut on stone. Specially not so much lowercases and specially not Italics!  <br> <br>Humanistic Caps only (or something like Lithos), a good creative letterform design, not specially connected to usual Rome models. Well spaced, with some ligatures :-) <br> <br> <br>(I'm probably to traditionnalist on that area?)</p>
