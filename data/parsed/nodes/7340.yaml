    html: <p>Ireland's most famous stonecutter Ken Thompson is a great fan of Eric Gill and his beautiful lettering is based on Gill's Perpetua face. I think its important to note that we are talking of letters carved in stone where each character can vary to improve legibility or to enhance the design and not type design where the characters do not vary but must still fit together to compose harmonious text. On monuments where a typeface has been used - usually sandblasted - the results always -to my eye- look awkward</p>
