    html: <p>After coming to Germany, I've noticed that your "average gravestone" here looks very different from those back home in the States. In America now, some sort of Times Condensed variant is usally sandblasted into stone, along with kitchy decorative elements. Here, Solid pieces of stone are used without much ornament, but the letters are cast in metal and attached on top of the stone's surface. When a stone is actually carved, the letters are usually Koch's Neuland, or something similar and expressionistic.</p>
    html_clean: <p>After coming to Germany, I've noticed that your "average gravestone" here looks very different from those back home in the States. In America now, some sort of Times Condensed variant is usally sandblasted into stone, along with kitchy decorative elements. Here, Solid pieces of stone are used without much ornament, but the letters are cast in metal and attached on top of the stone's surface. When a stone is actually carved, the letters are usually Koch's Neuland, or something similar and expressionistic.</p>
