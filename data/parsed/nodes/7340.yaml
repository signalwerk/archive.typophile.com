    votes: null
    html: "<p>Hrant: no. The dates (1955 and 1975) were hand carved by John Benson. The text is Optima, the font he recommended to Maya Lin; this was not hand carved. <br> <br>The FDR memorial's text was designed by Benson. He made a font, and then sandblasted all of the letters. It looks very good, even though it isn't hand carved. Benson never released this face. <br> <br>His son Nick designed and carved the text for the WWII memorial in DC. This was also made via a Johns Stevens Shop proprietary font that was sandblasted. <br> <br>The reason that John and Nick sand blast large amounts of text is that in these cases, it would cost too much and take to long to do by hand. Nick spent 11 months working on site at the WWII memorial. <br> <br>John Benson and the John Stetevens Shop hand carved all of the text at the JFK memorial at Arlington, and in  I.M. Pei's East Wing of the National Gallery of Art.</p>"
    html_clean: "<p>Hrant: no. The dates (1955 and 1975) were hand carved by John Benson. The text is Optima, the font he recommended to Maya Lin; this was not hand carved. <br> <br>The FDR memorial's text was designed by Benson. He made a font, and then sandblasted all of the letters. It looks very good, even though it isn't hand carved. Benson never released this face. <br> <br>His son Nick designed and carved the text for the WWII memorial in DC. This was also made via a Johns Stevens Shop proprietary font that was sandblasted. <br> <br>The reason that John and Nick sand blast large amounts of text is that in these cases, it would cost too much and take to long to do by hand. Nick spent 11 months working on site at the WWII memorial. <br> <br>John Benson and the John Stetevens Shop hand carved all of the text at the JFK memorial at Arlington, and in  I.M. Pei's East Wing of the National Gallery of Art.</p>"
