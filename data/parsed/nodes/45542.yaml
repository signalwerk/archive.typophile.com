      <p>Well it's not an error message. For some reason after shuffling my font files around, Illustrator doesn't like Avenir Book Oblique. It's fine with every other weight in the family, but it tells me that Avenir Book Oblique isn't licensed and then it won't create outlines. It literally disappears from the menu, and of course it gives me the standard thing about not saving it.</p>
      <p>It's pretty weird.</p>
      <p>Up until just now it was doing it also with Avenir Heavy too....</p>
      <p>But then it let me choose create outlines from the menu.</p>
      <p>Kinda driving me nuts today!</p>
