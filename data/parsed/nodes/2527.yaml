  html: "<p>Hi all, <br> <br>First of all, a merry christmas and a happy new year to you all. <br> <br>I was browsing the web looking for info about dyslexia. Suddenly I found smth very interesting. <br>Natascha Frensch, a Dutch designer made a typeface for dyslectic people, called 'Read'. <br> <br>You can find more info here: <br><a href=\"http://www.readregular.com\" target=\"_blank\">http://www.readregular.com</a> <br> <br>A lot of care is given to 'b' and 'd' kind of problems. People with dyslexia have problems with characters that look alike.  <br>So a 'd' is not just a mirrored 'b' but it needs more characteristics to distinguish it from the 'b'. Same goes for 'p' and 'q' etc. <br> <br>I love this initiative. Maybe some of you have interesting things to say about this. I myself do not design type, I just use it as a graphic designer.</p>"
  html_clean: "<p>Hi all, <br> <br>First of all, a merry christmas and a happy new year to you all. <br> <br>I was browsing the web looking for info about dyslexia. Suddenly I found smth very interesting. <br>Natascha Frensch, a Dutch designer made a typeface for dyslectic people, called 'Read'. <br> <br>You can find more info here: <br><a href=\"http://www.readregular.com\" target=\"_blank\" class=\"link-external\">http://www.readregular.com</a> <br> <br>A lot of care is given to 'b' and 'd' kind of problems. People with dyslexia have problems with characters that look alike.  <br>So a 'd' is not just a mirrored 'b' but it needs more characteristics to distinguish it from the 'b'. Same goes for 'p' and 'q' etc. <br> <br>I love this initiative. Maybe some of you have interesting things to say about this. I myself do not design type, I just use it as a graphic designer.</p>"
