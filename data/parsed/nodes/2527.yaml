    html: <p><i>People with dyslexia have problems with characters that look alike.</i> <br> <br>The biggest problem I have with Frensch's project is that it is so poorly documented that it is impossible to tell whether the design decisions actually address anything more than a particular sub-problem of a particular kind of dyslexia. Even if you look at the rather sparse information on dyselxia provided at <a href="http://www.readregular.com/english/dyslexia.html" target="_blank">http://www.readregular.com/english/dyslexia.html</a> it isn't at all clear how differentiating letterforms in the way Frensch has done addresses any of the reading disorder symptoms illustrated there.</p>
    html_clean: <p><i>People with dyslexia have problems with characters that look alike.</i> <br> <br>The biggest problem I have with Frensch's project is that it is so poorly documented that it is impossible to tell whether the design decisions actually address anything more than a particular sub-problem of a particular kind of dyslexia. Even if you look at the rather sparse information on dyselxia provided at <a href="http://www.readregular.com/english/dyslexia.html" target="_blank" class="link-external">http://www.readregular.com/english/dyslexia.html</a> it isn't at all clear how differentiating letterforms in the way Frensch has done addresses any of the reading disorder symptoms illustrated there.</p>
  - id: 20280
    user: 2305
    date: 2003-12-29T17:26:00
    date_raw: 29 Dec 2003 — 5:26pm
    votes: null
    html: <p>Frensch's project seems to target only one of several different dyslexias, too, which dilutes its worth.  On the other hand, many other dyslexias can't really be tackled at all with typography - I wonder if it's the same with character-recognition dyslexia.</p>
