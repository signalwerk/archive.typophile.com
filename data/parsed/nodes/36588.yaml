      <p><em>the 's'</em> - yes, it's an attention grabber, although I think it works within most words, indeed a word like 'assassin' would be too much. I had already played around with a more 'normal' s-shape, but nothing definitive as of yet.<br>
      I'm not really sure what you mean with it being a <em>random s</em>. It's random because it's a break from the norm? My idea behind it was a mix between a 'cursive s' and a 'long s' (that's why it sticks out above an below of the x-height).</p>
      <p>here's an example of your 'assasin' in both the regular as wel as an alternate/normalized 's':</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/lasagna_assasin_4341.gif"></div><p></p>
      <p><em>more of a marker than a brush</em> - yes this was intentional, I didn't want to have too much contrast, so I opted for a oval brush, wich basicly gives the same effect as a marker. Although a marker would have even less contrast (imho).</p>
