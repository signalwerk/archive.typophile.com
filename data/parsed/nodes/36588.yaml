      <p>What I meant by random was that it was a random "s" in the flow of the word, whether it was at the beginning, middle or end of the word it would still be very pronounced, effectively blurring the word as a whole.</p>
      <p>It's really all in how your eye scans a line of text. Most people rarely read entire words (that's why people can usually read this without problems: <a href="http://www.funny-potato.com/read-this.html"> Can You Read This? </a>)</p>
      <p>With a unique "s" like yours it breaks up the flow of the eye as it tracks alone the text. It can be confusing to the reader, either appearing as if the word was actually several words smashed together, or it just slows the eyes down making reading laborious. </p>
      <p>Does that make sense?</p>
      <p>I would recommend creating a more standard "s" shape that doesn't bring as much attention to itself and using the long "s" as your alternative, or in a display/swash version of your font. </p>
      <p>It's a very unique character and I'm not dissuading you from using it, I just think a more suitable "s" would better, more effective and expected.</p>
