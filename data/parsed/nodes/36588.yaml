    <p>Hello typophiles,<br>
    since I'm new to these forums I'll start off with a little about me:<br>
    I'm a Dutch Graphic Designer (recently Graduated) who's also into programming.</p>
    <p>Recently I've been working on a script font for display sizes, the working title of the font is 'Lasagna' (that was the first word I wrote in it). It's my first ever attempt at a complete font, so any help/critique is welcome to improve it.<br>
    At this point it's just shapes in Illustrator, but I like the way it's coming along and might ask someone to help me make it into a working font.</p>
    <p>Anyway, without further ado...</p>
    <p><img src="/sites/default/files/old-images/lasagna1_6478.gif"></p>
    <p>Because of the lettershapes I had a large number of overlaps, wich meant a need for ligatures:</p>
    <p><img src="/sites/default/files/old-images/lasagna2_4036.gif"></p>
    <p>thanks!</p>
