      <p>I don't think that building a font the way I described would contravene a font EULA, because you are modifying typography created by the font, not the font itself. The act of making a bitmap file destroys the font outline BCPs, which are what's protected.</p>
      <p>That's particularly so with the noise filter, which is unlike most if not all other Photoshop filters in that it produces a different result every time, with the same settings.</p>
