    <p>Hi everyone,</p>
    <p>I am right now in a project where the client wants to edit and existing font by adding a noise texture to it and then maybe change some of the shapes in the font as well, but adding the noise texture is the most important.</p>
    <p>I wonder how that could be done in the best way, lets say I add the noise texture to each letterform in Illustrator or photoshop and then, how do I take it from there?</p>
    <p>Any tips, links or guiding will be much appreciated!</p>
    <p>Thanks<br>
    Roger</p>
