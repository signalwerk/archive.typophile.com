    html: |-
      <p>I would suggest making a high-contrast Photoshop file, importing it into the background layer in FontLab or Fontographer, auto-tracing, and then optimizing and/or cleaning up, if there are too many paths.</p>
      <p>You will need to experiment to get the scale right.</p>
      <p>I believe there was a Typophile thread about the limits to the number of points/paths in a glyph or font.<br>
      There is also information on importing bitmap images into Fontlab etc., to get the size consistent.</p>
