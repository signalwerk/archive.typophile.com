    html: |-
      <p>Since you said it was an existing font already: Make sure the EULA allows modifications! Many don't, and those few that do rarely allow you to sell the results.</p>
      <p>You'll need some kind of font editor and a method of creating (tracing?) vector files from the noised-up letterforms. From there on it's just a matter of copy+paste. Off course, if you want it to look beliveable, you'll have to figure out how letterforms are distressed in real life, create multiple variants of each letter (informed by the real thing) and write some Opentype code to put it all together.</p>
