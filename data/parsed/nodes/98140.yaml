  html: |-
    <p>Does anyone know of a Sans Serif, slightly condensed, italic font similar to Containment: <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/containment/" rel="nofollow">http://www.myfonts.com/fonts/typodermic/containment/</a> but with regular dots on the interior. </p>
    <p>Does such a font exist? If it's not multilayered it's not a huge issue. The regular dots are the key feature.  </p>
    <p>Thanks!</p>
