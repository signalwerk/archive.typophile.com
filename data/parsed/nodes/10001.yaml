    html: <p>This is a good thread. Thanks Keith. However, I only can say "it depends on the job". Each job asks different questions, and those questions create different needs. I've dealt with each of these and they've come in different orders for different jobs.  <br> <br>I am blessed with clients that trust my judgement as far as type selection goes. I tend to talk their ear off about why they should choose a specific typeface or why I have used it. They then go pale and ask me never to do that again. <br> <br>If I had a dollar for every client that thanked me for the unnecessary type history lesson... <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
