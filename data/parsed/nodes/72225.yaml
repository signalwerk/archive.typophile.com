    html: |-
      <p>I have read the two reviews. I wonder why they appear rather narrow-minded to me.</p>
      <p><cite>Ha ha ha!</cite></p>
      <p>Wait.<br>
      Maybe you’ll cease laughing about it quite soon.</p>
      <p>No point in comparing this new app with FontLab or Illustrator. No reason to delete it after only one font has been made (as Brian Hudson suggests).<br>
      The iPad does not only look like the good old slate, it *is* a slate as a matter of fact – the more so with this new application.</p>
      <p>You may laugh on it because it seems to come as a kind of childish toy-tool of little professional value. But hey! It breaks fonting down to writing. Radically. In my opinion this is a very serious thing.<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Steinach_1_5876.JPG"></div><p></p>
