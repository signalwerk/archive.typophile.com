    html: <p>:) Yeah, these are more fun then serious. I also think direct manipulation, as opposed to indirect manipulation with a mouse, is a very interesting concept. I just tried Freeform and it's pretty bad. A lot of essentials is missing, most noticable, the lack of a shift button to keep bezier handles at 90 degrees and move nodes along an axis and no way to select multiple nodes in a shape. I can't find a way to add nodes neither. I might write a review if I find the time.</p>
