  html: |-
    <p>Designers, here's the place to go when visiting O'Hare (O'Hell in my experience) airport in Chicago: a trashy little deli/bar in one of the terminals named "CHICAGO salutes THE GRAPHIC ARTS". The form of the salute? A cheesy mural on one wall. Maybe they should rename it "CHICAGO salutes NON-STANDARD CAPITALIZATION" or "CHICAGO salutes SIGNS SET IN HELVETICA".<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/chicago_6452.jpg"></div><p></p>
