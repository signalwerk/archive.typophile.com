    <div class="info">Submitted by <a href="/user/1085" title="View user profile.">dan_reynolds</a> : 15.Mar.2006 2.02am </div>
      <p><strong>Linotype’s LinoLetter for March 2006 – Free professional font management from Linotype</strong></p>
    <p>Check out the full version of this month’s newsletter at the Linotype website: <a href="http://www.linotype.com/8-38-8-19420/issue200603.html" title="http://www.linotype.com/8-38-8-19420/issue200603.html">http://www.linotype.com/8-38-8-19420/issue200603.html</a></p>
    <p><em>Content Preview:</em> Linotype is pleased to announce that the first full version of FontExplorer™ X, a freeware application to solve all your font management and shopping needs, is now available for Mac OS X! A PC version will be released shortly. Another highlight in this month’s newsletter is the work of Jürgen Weltin, one of Germany’s hottest young type designers. Jürgen’s two type families in the Linotype library are worth a closer look, as are two other display faces that round out our themes for March: Linotype Gavotte™ and Linotype Killer™. Linotype Gavotte™ is a classic calligraphic piece by Rudo Spemann, and André Nossek’s Linotype Killer™ is a techno face from the 1990s, whose design is as contemporary a model as Linotype Gavotte’s is noble.</p>
    <p><a href="http://www.linotype.com/8-38-8-19420/issue200603.html">Read the rest of the Linoletter at Linotype.com!</a> </p>
    <p>Or, <a href="http://www.linotype.com/webshop/newsletter.php">subscribe to the Linoletter</a>, and get the information delivered every month directly to your mailbox.</p>
