  html: |-
    <p>I have a client -- an egg farm -- that I am developing a display font for. Originally I offered them exclusivity for 1 year, with an option to renew.</p>
    <p>But they want to buy the font outright.</p>
    <p>I'm kind of against this. For one thing, do they really need it? Secondly, could they afford it? Third, I've never sold a font through a foundry or MyFonts or whatever, so I'm kind of looking forward to trying it out.</p>
    <p>Any thoughts? How much is a ballpark figure for selling a display typeface? I've heard the $5K figure but that seems high to me.</p>
