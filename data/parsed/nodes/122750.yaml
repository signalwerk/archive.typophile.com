    html: |-
      <div class="comment-spam-body"><p>I had thought Times Roman. But a direct comparison of Starling Roman -- top sample -- and Times Roman</p><div class="imageWrap"><img src="http://typophile.com/files/StartlingRomanVsTimesRoman_5370.jpg"></div><br>
      reveals that Starling Roman is a better match. Slightly wider lower case and easy to spot differences like the terminal on _r_.<br>
      The serifs are modified to Latin/triangular versions.<br>
      Don<p></p>
      </div>
