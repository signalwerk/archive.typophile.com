    html: |-
      <p>I want my bank to be credible and trustworthy. I want the guy who fixes my car to be credible and trustworthy too.<br>
      If my bank uses Trajan for their logo, the message I get is "credible and trustworthy." If the guy who fixes my car uses Trajan for his logo, the message I get is "expensive and slow."<br>
      As James and Jörg said, context is everything.</p>
