    html: |-
      <p>Yes context plays a major part, but of course it's not <em>everything</em> – on a deeper level there are certainly parameters that up a font's general "credibility meter", like a certain solidity/stability for example in terms of width (not too narrow), weight (not too fragile), rigidity (not wobbly), serif structure/shape (solid, not lyrical – maybe even slabs). It should make the client feel good and secure; so no surprises, no unexpected strangeness or quirks, and probably nothing aggressive (like spikiness).</p>
      <p>But that still leaves a wide range, and these criteria will also vary depending on context; so. What does that client even <em>do</em>?</p>
    html_clean: |-
