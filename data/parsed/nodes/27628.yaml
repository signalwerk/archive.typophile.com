      <p>Hi Sharon,</p>
      <p>I continue to be pleased with FontExpert, both in terms of ease of organization and, in particular, the preview options. I'm curious to see the new Suitcase, and I must admit I haven't tried FAP, but at this point it would take a fair bit to pull me away from FE.</p>
      <p>That said, there are still a couple of bugs that irritate me. The main thing is that there is a significant lag in starting the program, and if you use the auto-activation plugin for InDesign it significantly slows down opening your InD files because each file you open must first call up FE to check which fonts need to be activated, and thus the program start-up lag comes into play. I've actually turned the plugin off to speed things up in InDesign, but I'm a freelancer so I'm not having to juggle more than a handful of projects at a time, so auto-activation isn't a big issue.</p>
      <p>Setting up groups is very simple, and I love that I can back-up my groups, something I could never seem to do with Suitcase.</p>
      <p>If you have any specific questions I haven't touched on, let me know.</p>
