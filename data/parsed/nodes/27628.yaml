      <p>As a follow-up, a few notes on what I've found after a couple of days working with FontExpert:</p>
      <p>Auto-activation via the InDesign CS2 plug-in:<br>
      For fonts to auto-activate they must, of course, be included in a custom font group in FontExpert. On opening a document in InD CS2 which uses a non-activated font, the file simply opens and the font is loaded. This seems to work by creating temporary font shortcuts in the Windows Fonts folder, which means that the activated fonts are available to any program while activated. Fonts de-activate on rebooting.</p>
      <p>Program loading and system tray:<br>
      Unlike Suitcase (which I've used for years), FontExpert does not load on boot, which means it's not loaded into the system processes on start up. This, however, results in a bit of a lag when you open FontExpert for the first time after a reboot. On my part, this may be because I've loaded a lot of groups with shortcuts pointing all over my font library, but it is a noteworthy lag and so I'm mentioning it here.</p>
      <p>Bugs/observations:<br>
      On starting FontExpert all custom font groups are listed in the Groups pane, but a small irritant is that you must double-click on a font group folder (thereby "opening" it) in order for its contents to show up in the preview pane (unlike Suitcase, which showed preview on single-click). This means you can't simply click on the first group and "scroll" down to preview each group's fonts, which would be nice. Once a group is "open" and each font is previewed, you can then click on a single font to see the character map, font info, and sample text.</p>
      <p>I'll post more as I continue to explore the program...</p>
