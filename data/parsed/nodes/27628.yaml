      <p>One of my frustrations with Font Expert (at least I think it was Font Expert--I've tried out so many managers in the past few weeks that I'm having trouble keeping them all straight) is that it organizes your fonts into sets by moving the actual files. I much prefer a system like Suitcase or the old Font Reserve for Windows, which can organize your fonts into sets without moving or reorganizing your actual font files. (These managers simply create a database that contains information on the location of all of your font files.)</p>
      <p>I want to keep my font files as they are now: in folders that are organized alphabetically by typeface. But I also want to create sets for projects and for general classification purposes. Am I correct in thinking that Font Expert can't do this?</p>
