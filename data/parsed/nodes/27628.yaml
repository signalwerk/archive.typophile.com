      <p>Jason, I wonder if you are still sold on FontExpert.  I have downloaded Font Agent Pro Public Beta for Windows and it's acting very beta-ish on my computer, crashing often and very slow.  I have Suitcase now and will be interested in seeing their upgrade later this month.  </p>
      <p>I do like the way Font Agent manages your fonts.  It makes it very easy to separate out the necessary system fonts from the unnecessary and it does a good job of weeding out problem or duplicate fonts.  But I spent hours trying to recreate my Suitcase sets.  The method required is cumbersome and buggy. I have deactivated Suitcase while I try out FAP. </p>
      <p>If you have a chance, can you tell me how you like FontExpert after using it a few months?</p>
      <p>Thanks,</p>
      <p>Sharon</p>
