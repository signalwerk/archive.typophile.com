    <p>A long time coming, Proxima has finally responded to the call for a solid font manager for Windows users, including auto-activation for Adobe InDesign CS2. I've only just downloaded the trial (it was released only a few days ago), but from what I've seen so far, it looks great, and the auto-activation is working without a hitch.</p>
    <p>The interface is fully customizable, and the configuration I've put together has a pane for my source font files, a pane for my customized groups, a live sample of each font name, a full character map, font info pane, and a good sized pane for sample text (granted, I'm running a 1680x1050 display, so I have the necessary real estate for such a comprehensive workspace - screenshot attached).</p>
    <p>But the real gravy is the auto-activation. Even better, a license is only $59US.</p>
    <p>While I know Linotype will (maybe, eventually, some day) be releasing a version of FX for Windows (for free), quite frankly I'm tired of waiting, and if nothing else I want to support Proxima for getting there first, finally.</p>
    <p>For full release details try the <a href="http://www.proximasoftware.com/fontexpert/index.html" target="_blank" rel="nofollow">Proxima</a> website.</p>
