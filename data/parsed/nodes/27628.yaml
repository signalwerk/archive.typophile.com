      <p>Matthew,</p>
      <p>It's been a while since I switched from FontExpert to High-Logic's MainType (see my post on MainType <a href="http://typophile.com/node/32985" rel="nofollow"> here [32985]</a>), but I'm pretty sure there was a preference/option that you can set in FontExpert to tell the program to create sets by linking, rather than moving/copying fonts.</p>
      <p>In MainType, each time you create a set and/or install the fonts you're asked if you want to copy/move/shortcut the font(s). Here's a screenshot during the add to group step:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/activate_5928.jpg"></div><p></p>
      <p>Like I said, have a look at my post on MainType if you're still looking around for a manager; I've been running it for about 6 months now and am very pleased with it. It's quick, does (almost) everything I want it to do, and it's nicely inexpensive, and Erwin at High-Logic is very open to feedback and suggestions.</p>
