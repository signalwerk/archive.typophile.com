    date_raw: 5 Nov 2003 — 9:13pm
    votes: null
    html: <p>Back when I used to work for the <a href="http://www.kinkos.com" target="_blank"> "McDonalds® of graphic design"</a> I used Freehand. Illustrator was available to us, but boy was it confusing to me with it's many different selection tools. I bought FH for home use as Macromedia had one of their early sweet suite deals that included Fontographer (and some other products that eventually dissapeared ~ Xres anyone?). Also, back then in my PC-centric days there had been no recent upgrade to Illustrator in many a moon. <br> <br>Since then I've figured out Illustrator and eventually switched. it's nice to check out FH once in a while though ~ it has some nice things like multiple pages. But I do recall it had it's own confusing palette problems back in the day that could be sort of "unpalettable" to the newbie. <br> <br>Remember when three upgrades of FH came out in the course of about a year as it switched "owners" from Aldus to Altsys to Macromedia?  <br> <br>I'd love to switch to FontLab but $$$ seems to be an issue these days as I attempt to pay bills during my adventures in unemploymentland. I'm also looking forward to speedier Adobe products but I think I need a roof over my head more than I need new software. <br> <br>Hmmm... maybe I could be the graphic designer who lives under the bridge. I can hear it now, "He does great work with the latest software as long as you bring some gas to help power the generator."</p>
