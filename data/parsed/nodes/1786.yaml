    date: 2003-10-24T21:13:00
    date_raw: 24 Oct 2003 — 9:13pm
    votes: null
    html: <p>I have always used Adobe software (notably Illustrator since version 1.1), probably much in the same way that I have always been a Mac user. You stick with what is comfortable, fits your workstyle, makes functional sense, and continually allows you to do your work in an efficient and creative manner. I'm not going to go into why Illustrator is better or why Freehand is not - suffice it to say that the tools and interface of Illustrator simply work for me better than Freehand ever has. I have never been comfortable using Macromedia products probably because my workflow has become attuned much more closely with the Adobe interface aesthetic (and quirkiness in its own right). <br> <br>And yes, I use Fontographer (since version 2.x, back in 1988 as a matter of fact). This is due to no other reasons than force of habit and lack of time to properly acquaint myself with FontLab. FontLab is clearly the superior (and supported) tool - but the adjustment in order to migrate is daunting.</p>
