    html: <p>Massimo, <br>While the Direct Selection tool (white arrow) works as does the Seletion tool (black arrow) when the fill of an object is clicked, it selects only that segment or that anchor point on which you click when the actual Bezier curve (outside edge) is clicked. As well, if a marquee (rectangle shape) is dragged with the Direct Selection tool, only those anchor points that are enclosed by the drawn marquee are selected. <br>I hope that this is of some small help. <br>Dana</p>
