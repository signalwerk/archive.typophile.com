    <p>Hi all,</p>
    <p>Could anybody explain the following situation:</p>
    <p>I’m using an Opentype font (Type1 flavour) in AICS2 and export it to a pdf.<br>
    When i check the fonts in acrobat they are presented (or converted) to a Type1.<br>
    So the font is using the type1 icon and not the opentype icon. I saw pdf’s before with opentype fonts / using the opentype icon. Why is that?</p>
    <p>thx,<br>
    Steven</p>
