  html: |-
    <p>Why no glyph palette in Photoshop CS or CS2? I thought Adobe was all about consistifying their suite.</p>
    <p>I know PS is not supposed to be a type-centric app, but trying to access OpenType* features without the glyph palette is a pain in the pooper. No one wants to trial-and-error all the contextual/stylistic/swash options in the Character fly menu.</p>
    <p>* Adobe's ballyhooed format!</p>
