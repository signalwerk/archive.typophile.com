    date: 2010-09-10T13:23:00
    votes: null
    html: <p>Nope. The implementation and user interface for OpenType fonts has barely changed in any of the CS apps since OpenType support was added to each. The most significant change I've noticed in CS5 is that Illustrator now (correctly) has Contextual Alternates on by default, which I consider a bug fix, not a new feature.</p>
