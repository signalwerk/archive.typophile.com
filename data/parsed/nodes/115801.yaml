  html: |-
    <p>I’m in the process of redoing a fairly experimental typeface I did around a decade ago called <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_roice_ot/" rel="nofollow">Roice</a>.</p>
    <p>The new version will probably be called NuRoSlab (NuRo being short for New Roice) and it aims to be a version of Roice for the real world, meaning, among other things, that it’s a lot less experimental.</p>
    <p>Right now I’m testing it as a webfont on my <a href="/wiki/www.alexscholing.nl" class="freelinking" rel="nofollow">website</a>. Let me know what you think.<br>
    Cheers, Alex</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alxstest_5716.jpg"></div><p></p>
