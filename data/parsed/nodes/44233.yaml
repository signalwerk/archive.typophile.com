    <p>Im sure this question has been asked many times here before, but im still going to ask.</p>
    <p>I haven't cut a font for a few years, I used Fontographer previously, and found it a bit clunky and illogical at times, but it was all that was there and i got good results.</p>
    <p>But i'd like to start designing type again properly and am looking at software, I will create the vector files in Adobe Illustrator (post pen) but would like to know what people recommend for the final steps in the process.. having nosed around and downloaded a few demos, Fontographer seems no different to the old version, and Fontlab seems to have quite a nice bezier curve editing system, but without using either for a decent project or two its really hard to make a choice.</p>
    <p>so basically, is it just a choice between these two, or is there any good software i've not come across? Im not worried about the cost (within reason) as its just one computer. so what does anyone recommend.</p>
    <p>(sorry for the dull question)</p>
    <p>thanks</p>
