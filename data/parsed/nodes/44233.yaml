      <p>I was in your position about a year ago. I hadn't messed with font making for about 15 years, and suddenly I caught the bug again. Fontographer had a new version for the Mac, so I took it as an omen and bought the upgrade. I had created several alphabets in Illustrator, but found it tedious to get the glyphs into Fontographer. Cut and paste didn't work - possibly because my version of Illustrator is old. Fontographer also lacked the ability to create OpenType fonts, and that was a feature I really wanted. I ended up getting the upgrade to FontLab Studio, and I haven't regretted it.</p>
      <p>I still do my preliminary work in Illustrator, and it's very easy to paste the glyphs into FontLab. Most users say they prefer to do everything in FontLab so I may change my methods one day. Not yet though. </p>
      <p>Leslie Cabarga's book,  <a class="freelinking external" href="http://www.logofontandlettering.com/bookorder.html" rel="nofollow">Learn FontLab Fast</a> was a big help with the learning curve.</p>
