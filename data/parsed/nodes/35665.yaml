    date: 2007-08-06T07:59:00
    votes: null
    html: |-
      <p>Here's a tip for identifying a font that you suspect is being SIFR'd onto the page. If you use FireFox with the adblock extension, click on the adblock button in your browser to load a list of all the adblock-able scripts, objects, and images in use on the page. (The idea is that you can use one to create a filter for excluding content originating from servers you don't like).</p>
      <p>When you use SIFR, it's common practice (though I don't think it's required) to name the Flash SWF file after the font it contains. So when you load the adblock list, look for a file ending in .swf with "object" category that has a font-like name. In this case, it's beorcana_titling_medium.swf.</p>
      <p>Alternatively, you can always view source and hunt for ".swf".</p>
      <p>EDIT: Actually, just viewing source probably won't work since SIFR now pulls in the entire object/embed code via javascript. You'd have to "view generated source" or work your way through the DOM inspector.</p>
      <p>hth</p>
