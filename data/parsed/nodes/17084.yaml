      <p>Hi, the Mac Office people confirmed that they do have a hard-coded list. In their defence I think detecting symbol encoded fonts on the Mac has never been straight-forward. </p>
      <p>The list doesn't however include the three non-symbol fonts listed (Apple Chancery, Bauhaus, or Zapfino) but apparently they are treated this way because their WYSIWYG appearance would be too tall (18 pixels).</p>
      <p>Cheers, Si</p>
