      <p>Well I know that the trick in Zapfino is that the hhea table vertical metrics are designed to clear the tallest glyph, which is a huge swash variant f. We discussed metrics at some length with Apple when we were making the font, and they decided that although this would result in bizarrely huge interlinear spacing even when the taller variants were not used, this was preferable to clipping of those variants. After the first version of Zapfino was shipped, the Apple font folk got a lot of complaints both internally and from users, that the font looked small compared to other fonts. This is because the x-height is so small relative to the regular extender length, which we wanted to correspond fairly closely to the em height (left at the 1000 units of the PS source fonts, since we wanted to avoid outline rounding errors in converting everything to the more common TrueType em of 2048). The height of the font's extenders were actually pretty similar to the average font, but Zapfino appeared much smaller because the x-height was tiny in comparison. When we made the second version -- for which Hermann completely redesigned the entire typeface for what must have been the third or fourth time -- we kept the same metrics as the first version so that this, at least, would remain the same for users. But very late in the project, Apple suddenly decided that they wanted the whole font to look larger, so that the x-height would be closer to that of other fonts, and so avoid the complaints they had received about the small size. Their remarkable solution to this was to leave the outlines and hhea metrics exactly as they were already, and simply to change the upm value from 1000 to 400. Of course, this means that relative to other fonts the extenders are now huge. </p>
      <p>This is why the Apple version of Zapfino will not fit in the Word menu. Probably more than you wanted to know, but I like this sort of story.</p>
      <p>So you can't trick the Word menu into displaying the font name in regular text without also making your font behave in some weird ways in applications, e.g. giving it huge interlinear spacing.</p>
