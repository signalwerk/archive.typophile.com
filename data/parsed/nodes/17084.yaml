    <p>I'm currently developing a set of Symbol/Alternate Glyph fonts and have a question regarding the font preview in the font menu in Microsoft applications on the Macintosh. I'm creating the font in FontLab 4.6, generating the fonts as PostScript with the Macintosh Roman encoding for the Macintosh version of the font, and I'm testing the font in Word 2004.</p>
    <p>Since the font is non-alphabetic, I would like the font name in the menu to substitute to a default font instead of displaying the font's name set as a font preview.</p>
    <p>From a FontLab forum thread I found that setting the "Microsoft Character Set" to "Symbol" in the "Encoding and Unicode" section of the Font Info does exactly what I want it to do in Windows but not on the Macintosh. I've also tried setting the PANOSE description of the family kind to "Latin Symbol" but this changed nothing.</p>
    <p>The odd thing is that in Word for the Mac, several other alphabetic font names (Apple Chancery, Bauhaus, Zapfino) are shown as a default font in the preview and I'm not able to find out how they could be tagged to do this by looking around through the font in FontLab.</p>
    <p>Can anyone explain how Microsoft Word on the Mac decides whether or not to use a default font for the font menu name rather than display the font's name as a preview?</p>
    <p>Thanks!<br>
    -- Andy</p>
