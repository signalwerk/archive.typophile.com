      <p>I’m using FontExplorer X in 10.4.6 (not upgraded to 10.4.7) but there, you set the preferences WITHIN FontExplorer, under Advanced. There’s a box you can check that says “Use FontExplorer X as default handler for font files” </p>
      <p>You might want to see if FontLab has a similar option.</p>
