    html: <p>GetInfo will change one file but “change all” reverts the default application back to Font Book. Default App has FontLab Studio as the associated application, though that’s no help. Even if I delete Font Book altogether, the system wants to use either FontThing or Lemkesoft’s FontBook. “Change all” and “always open with” don’t seem to override the new association for FFIL files.</p>
