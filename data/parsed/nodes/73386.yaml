      <p>I like <a href="http://moorstation.org/typoasis/designers/steffmann/samples/f/fettetrump.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fette Trump Deutsch</a> by Georg Trump (which is offered for free by Dieter Steffman, who digitalized a LOT of blackletter typefaces, some better than others, check his the listing from the link above) </p>
      <p>Another favorite is <a href="http://new.myfonts.com/fonts/urw/weiss-rundgotisch/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Weiss Rundgotisch</a> by Emil Rudolf Weiss</p>
      <p>Interesting contemporary interpretations of Blackletter are <a href="http://new.myfonts.com/fonts/canadatype/blackhaus/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Blackhaus</a> from Canada Type and <a href="http://new.myfonts.com/fonts/finefonts/fine-gothic/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Fine Gothic</a> by Michael Harvey and Andy Benedek.</p>
