    html: |-
      <p>I second riccard0's recommendation if you want an artistic interpretation of blackletter rather than a historical example. Gabriel Martínez Meave's Darka is gorgeous. I set my notes from a Hegelian philosophy class in Darka just cause it's so darn pretty. It's also dense and very readable once you get used to it, but set it with plenty of leading for those ascenders, descenders, and vast capitals to breathe in.</p>
      <p>If you're more historically minded, you might find this online blackletter history interesting: The Gutenberg Press: Five Centuries of German Fraktur, by Walden Font (<a href="http://www.waldenfont.com/downloads/gbpmanual.pdf" title="http://www.waldenfont.com/downloads/gbpmanual.pdf">http://www.waldenfont.com/downloads/gbpmanual.pdf</a>). You can also download samples of many of the historical fonts they discuss from their site.</p>
      <p>Bringhurst's The Elements of Typographic Style also lists some worthy blackletters, if you're looking for a list to get started with.</p>
