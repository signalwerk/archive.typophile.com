      <p>I like <a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann/samples/f/fettetrump.htm" rel="nofollow">Fette Trump Deutsch</a> by Georg Trump (which is offered for free by Dieter Steffman, who digitalized a LOT of blackletter typefaces, some better than others, check his the listing from the link above) </p>
      <p>Another favorite is <a class="freelinking external" href="http://new.myfonts.com/fonts/urw/weiss-rundgotisch/" rel="nofollow">Weiss Rundgotisch</a> by Emil Rudolf Weiss</p>
      <p>Interesting contemporary interpretations of Blackletter are <a class="freelinking external" href="http://new.myfonts.com/fonts/canadatype/blackhaus/" rel="nofollow">Blackhaus</a> from Canada Type and <a class="freelinking external" href="http://new.myfonts.com/fonts/finefonts/fine-gothic/" rel="nofollow">Fine Gothic</a> by Michael Harvey and Andy Benedek.</p>
