      <p>If you go with the definition "It's blackletter if the ink coverage is over 50%" -- well, that's an all-different sheila.</p>
      <p>The Wikipedia page on <a href="http://en.wikipedia.org/wiki/Blackletter" title="Click to visit an external URL." class="freelink freelink-external freelink-external">blackletter</a> has some background info.</p>
      <p>Peter Wiegel (<a href="http://www.peter-wiegel.de/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">CAT Design</a>) has a few German blackletter bread faces.</p>
      <p><a href="http://www.fraktur.biz/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dipl.-Ing. Gerhard Helzel</a> is a commercial supplier.</p>
