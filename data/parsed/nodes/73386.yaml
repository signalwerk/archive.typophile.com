      <p>If you go with the definition "It's blackletter if the ink coverage is over 50%" -- well, that's an all-different sheila.</p>
      <p>The Wikipedia page on <a class="freelinking external" href="http://en.wikipedia.org/wiki/Blackletter" rel="nofollow">blackletter</a> has some background info.</p>
      <p>Peter Wiegel (<a class="freelinking external" href="http://www.peter-wiegel.de/" rel="nofollow">CAT Design</a>) has a few German blackletter bread faces.</p>
      <p><a class="freelinking external" href="http://www.fraktur.biz/" rel="nofollow">Dipl.-Ing. Gerhard Helzel</a> is a commercial supplier.</p>
