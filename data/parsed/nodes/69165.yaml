  - id: 405214
    user: 4467
    date: 2010-04-06T18:50:00
    date_raw: 6 Apr 2010 — 6:50pm
    votes: null
    html: |-
      <p>On the first sample you can create a brush in photoshop that gives you that finish; In Photoshop CS4 which is the one I have now I found brush 59px or 39px that could give you that effect.<br>
      You can also draw directly in a piece of acetate with a sponge and create the effect to then burn it in a silkscreen and come up with a result like it.<br>
      The second one could also be a big brush in photoshop, but I could also think that if you<br>
      don't ink a silkscreen evenly you would have this result.</p>
      <p>Hope this helps. </p>
      <p>Patty</p>
