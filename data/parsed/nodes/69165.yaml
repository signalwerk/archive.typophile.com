    html: <p>seconding JanekZ; yes, screen printing can be very accurate. I used to screen print tiny, tiny little circuit boards using a stainless steel mesh, and -not sure what to call them, but sort of like pegs on circuit display boards in hydro generating plants that had less than a thousandth of an inch tolerance. The registration was set with a micrometer and a magnifying glass.</p>
