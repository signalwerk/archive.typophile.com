      <p>Good lord.</p>
      <p>I used to work my butt off trying to avoid effects like that :o)</p>
      <p>silk screen is a visceral medium. You can create the exact effect you like digitally, or you can play around and you could come up with something magical, be it as simple as a dull and nicked squeegee, rough texture under your paper or some judiciously placed dirt on the screen...</p>
