    <p>I'm designing a "gig" poster and was wondering how you achieve this type of weathered effect. Does the designer use brushes or is it a silkscreening technique that causes the speckles? Or is it a little of both?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/B1A791_fullsize_6629.png"></div><div class="imageWrap"><img src="http://typophile.com/files/35521_9752892_l_4531.jpg"></div><p></p>
