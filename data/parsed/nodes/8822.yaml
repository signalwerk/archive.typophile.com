    <p>I am currently going through all the unorganized free fonts I've collected over the years, and have found that font doctor is great for this weeding out of the bad fonts and organizing the good ones, but...There is a setting in font doctor that creates a new suitcase file for the fonts. Should I select this or just ingnore it and let it organize fonts? I get what it does, but has anyone tested this to see if its better to leave them, or to let font doctor do its thing. By the way this if for OSX. <br> <br>oh and its my first post here. hello!</p>
