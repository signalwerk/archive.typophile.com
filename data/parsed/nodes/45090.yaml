      <p>Byron,<br>
      General advice before the typographic composition critique:<br>
      Depending on your choice of career, I would thin out this resume to the three or four jobs that will mean anything at all to your next employer (or maybe just two jobs and really emphasize your education). Your employer needs to see that you are capable of choosing only the elements that are most pertinent before beginning a composition. Keep in mind also that intelligent use of negative space is important and will really set your resume apart from the rest.<br>
      The typography:<br>
      first impressions—you need more margins. The difference between the bold and the regular is too much; find and use a middle weight. Use leading more generously between lines.<br>
      If you're wanting to make a statement with Futura then make it loud and clear—including your name at the top. Otherwise, choose something else that fits you better.<br>
      Suggestions:<br>
      Try making the type a little smaller. Instead of explicitly using dark black rules all the way across the page, consider something implicit that fulfills the same task. As I write this I get the feeling that you should be spending the majority of your resume telling the story of your education. I would also suggest creating a book PDF or website and linking your resume to it.<br>
      Best Regards<br>
      David</p>
