      <p>My 2 cents:</p>
      <p>- Overall it's a bit dense and clunky. Try reducing the font sizes and increasing your margins.<br>
      - To open some whitespace you could easily move your dates inline with either your job title or company<br>
      - month abbreviations should be consistent (Sep Jun Mar) and use an en dash between dates instead of a hyphen<br>
      - Don't think the one instance of Frutiger Extra Black works. I think Futura Medium at that size would work or you could pick a more complimentary typeface.<br>
      - I  think your email and phone number should be the same size and weight. Could also go on the same line with some sort of separator (bar or bullet).<br>
      - Not a fan of the oblique style of Futura.</p>
