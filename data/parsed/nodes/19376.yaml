      <p>&gt;Kerning is about bringing two letters close enough that the positive and negative space within the pair looks balanced among the rest of the text…</p>
      <p>I agree but just wasn't clear enough.</p>
      <p>In fact, I think it's an engineering marvel (but sometimes a problem!), that pairs can be formed <em>in isolation</em> and yet still serve the larger context of the line, paragraph, etc. Although, again, here Adobe's InDesign comes into play: I am guessing that Adobe's "optical" metrics, which substitute for the fonts built-in metrics, actually kern pairs in terms of the whole paragraph's layout, since the paragraph is the unit Adobe uses for tracking, kerning, hyphenation, etc.</p>
      <p>As for this matter of "hey, maybe this QU can be a ligature!" I don't see the grey area (or white space, to be more accurate?) Hrant and others seem to be exploiting. I mean, of course negative space (if "white" under normal circumstances) is important. But let's not play silly semantic games for a moment: if the term "ligature" is gonna have any usefulness, it needs to refer to something specific. And I'm suggesting that it refers <em>not</em> to the pair of letters that are designed in one piece, and/or that may have been joined as one piece in metal, and/or that come as one glyph in modern fonts, but either (a) to the pair when joined by a specific <em>chunk of stuff</em> (when the letters are black, the stuff is black), or (b) the to chunk of stuff itself.</p>
      <p>Anyway, that's my own sense of the term <em>ligature</em>. Otherwise, you just have pairs (or larger sets) of glyphs that happen to be real close together and happen to sometimes appear as a unit in various systems.</p>
