      <p><em>To me a ligature is any glyph the designer defines in the liga feature that replaces 2 or more other glyphs. Anything beyond that may be just a fun academic excursive for those who wish to indulge.</em></p>
      <p>Awww, c'mon! Indulge! Seriously, though. I only would want to play these "academic" games in order to clarify my own thinking about type. I agree that it's silly to try to establish, once-and-for-all, precisly what word X refers to and what it doesn't. But I see it the other way around-- the more we wonder about what it could refer to and maybe what it shouldn't, the more the we can question what we've long supposed the term to "mean," and thereby, the more we can question our own assumptions and understandings. That's where I'm coming from, anyway.</p>
      <p>Some really dig this term "notan," for example. Well, what in the hell is it? If I say, "notan" is "not tan," somebody's gonna bark that's wrong. And then we get to wondering what the term <em>is</em> about, which leads to (we hope) more interesting ideas about type than we'd previously had.</p>
