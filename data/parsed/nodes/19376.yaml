      <p><em>Just another reason to be careful using Helvetica</em></p>
      <p>Yes, that is a "Helvetica" weakness, as is the r_n combination.<br>
      But any reasonably tightly fitted sans serif will have a weakness somewhere, because it is impossible to design every glyph to fit evenly with every other glyph.<br>
      If the ear of the "r" in Helvetica curled a bit more, or had a non-vertical termination, so that it fit better with the "t", that would create fit problems elsewhere.<br>
      Where a typeface's fit problems are concentrated determines its personality. Also, given the varying frequency of different character combinations in different languages, there you have a reason for linguistic personality of a typeface.</p>
      <p>However, it should now be possible to employ contextual alternates in OT fonts to address fit-problem concentration. But not so obviously as with the long-eared "r" in Cheltenham Oldstyle. Why not have a Helvetica "r.alt" specifically for use before a "t"? -- very slightly altered in shape to avoid the present dubious almost-ligature.</p>
      <p>This doesn't require massive class-substitutions, as there are hardly any accented versions of r and t.</p>
      <p>I'm experimenting with this kind of feature in a sans serif I'm developing at the moment.</p>
