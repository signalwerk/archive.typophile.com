      <p>My understanding is that a ligature requires touching. Hence the root in Latin "ligare": "to bind." Otherwise you're just talking about tight kerning. Kerned pairs involve various overshoots and undershoots, like the QU above. </p>
      <p>Kerning is all about bringing two letters just close enough that the positive and negative space across the pair looks balanced. The more kerned pairs (where appropriate), the more balanced a font will look along the line.(Although... Adobe can do its own metrics ("optical"), but I have yet to test a kerned-pair-less font with it...)</p>
      <p>Notice that your Q and U would look odd if the Q was spaced further out to the left. There'd be this big white space between the two. Then again, the tight kerning only makes sense because of the Q's tail and the U being an oddball small size (small cap, lowercase, or just it's own thing).</p>
      <p>So what you have above is a kerned pair that is more than the sum of its parts. But not a ligature! Still... if you joined the right end of the Q's tail to the end of the right side stroke of the U, then you'd have a ligature that doesn't fuse the letters in a bad way. </p>
      <p>By the way, check out newspaper headlines-- they're often so tightly tracked that you get damn near ligatures across letters, but not intentionally.</p>
