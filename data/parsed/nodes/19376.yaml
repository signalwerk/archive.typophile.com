    html: |-
      <p>&gt; do you have any supporting data</p>
      <p>Nope. Just like there's no data proving that serif fonts<br>
      have higher nominal readability, but no decent designer<br>
      will set a long book in a sans.</p>
      <p>This idea stems from the belief that divergence (at least when<br>
      properly controlled) helps our heuristic reading mechanism<br>
      extract more meaning faster. Really, humans can handle a lot<br>
      more than 26 x 2 (+ odds &amp; ends) symbols. If they couldn't,<br>
      the Chinese wouldn't be about to womp us.  :-)</p>
      <p>hhp</p>
