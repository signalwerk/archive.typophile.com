      <p>I could be wrong, but "why not" is: you're merging two major vertical strokes. Does that happen in other (Latin) ligatures? Like a ligament, ligatures  usually are fairly minimal as, um, "thingies," but serve an important function in holding two larger "thingies" together. So that's why fl, ffl, fi, etc., get ligatured -- it's across minor areas of horizontal space where they're almost already touching anyway? q and u, to be properly ligaturized, would just maybe join the q's top right serif and the u's top left. Right?</p>
      <p>Exceptions: archaisms like AE (Æ)and OE (Œ), where the two letters are fused along long stretches of vertical stroke. I notice, though, that they're not diphthongs-- you don't say "Ay-Ee-sopp," but "Ay-sop." Not "Oh-ee-di-puss" but "Eh-di-puss." That's probably relevant.</p>
      <p>Seems like the "why not" answer has formal/perceptual, historical, and phonological roots. Not to say it isn't worth trying, though. But if we're gonna start making lig's along big strokes, then we could conceivably have them for every possible pair of letters.</p>
