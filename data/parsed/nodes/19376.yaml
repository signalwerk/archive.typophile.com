      <p>Let's forget the term "ligature" for a moment and look at the various conditions relative to the individual glyph's nominal metrics, and controlling for tracking (i.e., track it tightly enough and they'll touch, so let's assume standard tracking):</p>
      <p>1. Positioning changed<br>
      2. Shape(s) changed<br>
      3. Touching</p>
      <p>Seems like there's no point belaboring the term "ligature," if we can come up with a vocabulary for all seven permutations:</p>
      <p>1 alone: position changed but no change of shape, and not touching (i.e., "raw" kerning)</p>
      <p>2 alone: could happen anywhere, but if shape <em>alone</em> is the condition, then spacing along the line may not really be at issue at all</p>
      <p>3 alone: hard to imagine except in conditions of extremely tight tracking but no other alterations (or when kerning brings it about)</p>
      <p>1&amp;2: this might be like the "notan" example above-- no touching, but a  stroke may be altered to improve balance</p>
      <p>1&amp;3: probably most examples of ligature</p>
      <p>2&amp;3: that wacky, contrived "st" ligature, perhaps, and perhaps fl and ffl, depending on tracking ("touching" <em>without</em> kerning would entail <em>adding</em> some stroke that wasn't there before, like the little arc that binds the lower-case s to the t in the st lig)</p>
      <p>1, 2, &amp; 3: all hell can break loose! </p>
      <p>- Jay</p>
    html_clean: |-
      <p>Let's forget the term "ligature" for a moment and look at the various conditions relative to the individual glyph's nominal metrics, and controlling for tracking (i.e., track it tightly enough and they'll touch, so let's assume standard tracking):</p>
      <p>1. Positioning changed<br>
      2. Shape(s) changed<br>
      3. Touching</p>
      <p>Seems like there's no point belaboring the term "ligature," if we can come up with a vocabulary for all seven permutations:</p>
      <p>1 alone: position changed but no change of shape, and not touching (i.e., "raw" kerning)</p>
      <p>2 alone: could happen anywhere, but if shape <em>alone</em> is the condition, then spacing along the line may not really be at issue at all</p>
      <p>3 alone: hard to imagine except in conditions of extremely tight tracking but no other alterations (or when kerning brings it about)</p>
      <p>1&amp;2: this might be like the "notan" example above-- no touching, but a  stroke may be altered to improve balance</p>
      <p>1&amp;3: probably most examples of ligature</p>
      <p>2&amp;3: that wacky, contrived "st" ligature, perhaps, and perhaps fl and ffl, depending on tracking ("touching" <em>without</em> kerning would entail <em>adding</em> some stroke that wasn't there before, like the little arc that binds the lower-case s to the t in the st lig)</p>
      <p>1, 2, &amp; 3: all hell can break loose! </p>
      <p>- Jay</p>
