  html: |-
    <p>My first question is--in all <a href="/wiki/Latin" class="freelinking" rel="nofollow">Latin</a> script languages, is the Q always followed by a U?<br>
    If this is so, then my second question is--why is there not a single QU <a href="/wiki/glyph" class="freelinking" rel="nofollow">glyph</a>?<br>
    My third question--why would we not at least have a qu <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligature</a> as a normal part of a font?<br>
    There is no <a href="/wiki/hyphenation" class="freelinking" rel="nofollow">hyphenation</a> between q and u anyway so that does not figure in. Would it just be quaint or quizical to quiery quietly or do we need a poll?</p>
    <p>ChrisL</p>
  html_clean: |-
    <p>My first question is--in all <a href="/wiki/Latin" class="freelinking link-lost" rel="nofollow">Latin</a> script languages, is the Q always followed by a U?<br>
    If this is so, then my second question is--why is there not a single QU <a href="/wiki/glyph" class="freelinking link-lost" rel="nofollow">glyph</a>?<br>
    My third question--why would we not at least have a qu <a href="/wiki/ligature" class="freelinking link-lost" rel="nofollow">ligature</a> as a normal part of a font?<br>
    There is no <a href="/wiki/hyphenation" class="freelinking link-lost" rel="nofollow">hyphenation</a> between q and u anyway so that does not figure in. Would it just be quaint or quizical to quiery quietly or do we need a poll?</p>
    <p>ChrisL</p>
