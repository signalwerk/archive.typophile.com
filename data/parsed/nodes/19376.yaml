      <p>I'd say it depends on what's done to the constituents. If the "f" and "i" are just slapped together (which I've seen done, I think by Unger, or was it Zapf) and at the default spacing (probably simply because software expects something there) then that's not a ligature. But if the shape, or really even the spacing, of one or both has changed, then there's <cite>something</cite> going on, and it's useful to have a term for it; and since the thing that's going on is almost certainly related to the notan relationship (implying some "linking" in/of the white) then maybe an extension of the term "ligature" is best.</p>
      <p>BTW, remember Legato (and its name!) which was designed to ligate the whites.</p>
