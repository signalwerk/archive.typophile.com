    html: |-
      <p>Even "just" in English there are borrowed words (mostly from Arabic) where the "q" is not followed by a "u". But it's usually an "a", and very rarely a letter with a descender. Check out "Making the Alphabet Dance" by R Eckler for a list of words that contain every combination of two letters!</p>
      <p>BTW, metal fonts used to offer single sorts of "Qu", but<br>
      that's because <cite>their</cite> kerns were liable to break off!  :-)</p>
      <p>&gt; Ligatures are for where not every character combination is good</p>
      <p>In my talk at the Thessaloniki conference in 2004<br>
      I tried to show that ligatures run deeper than that,<br>
      and I think they can run far deeper still. In fact a<br>
      ligated "qu" can arguably help reading.</p>
      <p>hhp</p>
