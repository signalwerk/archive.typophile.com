    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alin_atf_missal_caxton_1_3662.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/alin_atf_missal_caxton_2_6094.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/alin_atf_missal_caxton_3_3943.png"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/alin_atf_missal_caxton_4_4148.png"></div><p></p>
    <p><strong>Short Description:</strong>The third release in our series of <a class="freelinking external" href="http://www.alterlittera.com/al_htm/initials.htm" rel="nofollow">Initials</a> fonts. A comprehensive set of initials, frames and borders, adapted from American Type Founders (ATF) Company's <em>American Specimen Book of Type Styles</em>, Jersey City, 1912 (pp. 944-5). The font contains over one hundred glyphs, including clean renditions of both <em>Missal Initials</em> and <em>Caxton Initials</em>, plus adaptations of <em>Department Store Initials</em> and <em>French Cast Squares</em>.  </p>
    <p><strong>Font Details:</strong>  <a class="freelinking external" href="http://www.alterlittera.com/al_htm/initials/atf_missal_caxton.htm" rel="nofollow">Font Page</a>  at <a class="freelinking external" href="http://www.alterlittera.com" rel="nofollow">Alter Littera's website</a>.</p>
    <p>Please visit our website's  <a class="freelinking external" href="http://www.alterlittera.com/al_htm/about/news.htm" rel="nofollow">news</a> section for latest news and updates.<br>
    Thanks in advance for your interest.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/al_logo_4597.png"></div><p></p>
