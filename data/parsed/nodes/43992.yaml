    html: |-
      <p>I recently bought it. It works very well. I wanted to change some of my library over to OT, and it went very smoothly.</p>
      <p>My only disappointment is that you have no control of the font’s metadata(?). I was spoiled trying out TransType Pro, which allows you to fine tune some things (family, etc). FXC doesn’t have anything extra. It just does a straight conversion, albeit excellently.</p>
      <p>Go ahead and demo it. You may love it!</p>
