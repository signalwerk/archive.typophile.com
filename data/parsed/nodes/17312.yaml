    html: |-
      <p>Aerosyn-Lex, </p>
      <p>any Mac font editor from Fontlab Ltd. (TypeTool, Fontographer, FontLab, FontLab Studio) can open LWFN and FFIL files (it’s better to open the FFIL files since they contain metrics and kerning, and will automatically locate the matching LWFN file). </p>
      <p>The Windows versions of our software cannot open these files, except TransType SE and TransType Pro for Windows, that can convert them into PC formats. Also, FontLab Studio 5 for Windows can open LWFN and FFIL files if they have been encoded as MacBinary (.bin) or BinHex (.hqx). </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
