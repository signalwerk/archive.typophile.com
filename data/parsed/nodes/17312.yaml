    <p>BEST REGARDS TO ALL HERE IN THESE TYPOPHILE FORUMS<br>
    _________________________________________________________</p>
    <p>I’ve returned for a bit of beginners advice on the world of </p>
    <p>font creation, or in this case modification.</p>
    <p>THE QUESTION<br>
    _______________</p>
    <p>I’ve done some reading and research in trying to find the</p>
    <p>easiest method to creating or modifying a usable font.</p>
    <p>This is for a school project and I would simply be seeking</p>
    <p>to build on top of some pre-existing work; not at all for</p>
    <p>professional use or consumption.</p>
    <p>What I wanted to ask was,</p>
    <p>IS THERE A WAY TO OPEN STANDARD FONT FORMAT FILES i.e OTF TTF LWFN FFIL</p>
    <p>DIRECTLY INTO FONTLAB, so that the file opens with all the metrics and kerning in tact ? ? ?</p>
    <p>I AM IDEALLY looking to simply modify a work by</p>
    <p>filling in BOWLS, changing the TERMINALS; I by no means expect to create a classic work.</p>
    <p>__________________________________________</p>
    <p>I found this file linked on a previous post .</p>
    <p><a href="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675" title="http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=2675">http://groups.msn.com/FontLab/tipsandtricks.msnw?action=get_message&amp;mvie...</a></p>
    <p>.</p>
    <p>If the above mentioned DIRECT technique is not possible</p>
    <p>would i then have to create a FULL CHARACTER GLYPH SET in ILLUSTRATOR</p>
    <p>and then manually port over each characters modified PATH ? ? ? ?</p>
    <p>——————————</p>
    <p>PLEASE PLEASE</p>
    <p>lend any and all advice on how i could</p>
    <p>complete a fairly simple yet fleshed out + usable</p>
    <p>modified typeface</p>
    <p>.</p>
    <p>as always my thanks and praise to all</p>
    <p>the supportive and knowledgeable members</p>
    <p>here at TYPOPHILE .</p>
    <p>.</p>
    <p>PEAC BE WITH YOU </p>
    <p>.</p>
    <p>Aerosyn-Lex</p>
