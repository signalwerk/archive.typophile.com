  html: |-
    <p>That disease in the form of bad lettering will never go away.  </p>
    <p>Check out the Epiduo acne treatment commercials and website, or the art of James Victore, or the pathetic new Hallmark ad campaign.  </p>
    <p>All of this can be dated back to when designers like Paul Rand experimented with informal and abstract lettering for ads.</p>
    <p>I like Paul Rand's work a lot.  Don't get me wrong.  His well-disciplined examples command praise.  Cummins diesel engines is still using his logo today.  ABC is still using his logo today.  So do IBM and Westinghouse.  It's just that he made mediocre letterforms famous as well.</p>
    <p>Now, any dumb schmoe with a set of pens who think they can draw can create juvenile lettering and PRESTO!  It's all over the advertising landscape like a cancer!</p>
    <p>Alexander Pope wrote this on vice...</p>
    <p>"Vice is a monster of so frightful mien<br>
    As to be hated needs but to be seen;<br>
    Yet seen too oft, familiar with her face,<br>
    We first endure, then pity, then embrace." </p>
    <p>We are living in an age where bad is the new good.</p>
