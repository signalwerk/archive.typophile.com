    <p>Does anyone know the story behind this mistake?</p>
    <p>Adobe’s first release of ITC Eras (version 1.000) was not slanted 2° as was intended by the type designers; Adobe fixed the mistake with version 1.001.</p>
    <p>Does anyone have any similar examples of errors from major type foundries?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ErasMistake_4197.jpg"></div><p></p>
