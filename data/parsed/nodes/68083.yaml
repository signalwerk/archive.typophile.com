    html: "<p>Early versions of ITC Eras from Adobe included two versions: One for low resolution (300dpi) devices and one for higher resolution. The \"low-res\" version was upright. I don't have anything but my memory to back this up. It was something I learned during a visit to a service bureau in the early DTP days. Adobe's Optima had a similar \"low-res\" and \"hi-res\" version.</p>"
