    html: |-
      <p>IIRC, it wasn't an error but a decision motivated by the difficulties involved in rasterizing a stroke that deviates from the vertical by a small angle. At the time, laser printers were 300 dpi, and screen resolution was coarse of course.</p>
      <p>Another interesting issue was that because Eras only has four letters, some software applications didn't recognize it in the "font name field", as they were set up to register no fewer than five letters!</p>
      <p>IIRC, there were also some straightened out versions of Optima. Again, not an error, but a liberty taken, occasioned by lower resolution technology.</p>
      <p>I could go on, to discuss the "error" of turning metal types that were optically scaled into single-master digital typefaces.<br>
      Slanted italics.<br>
      Auto-tracing.</p>
