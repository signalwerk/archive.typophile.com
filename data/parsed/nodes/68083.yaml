      <p>Thanks, Nick.</p>
      <p>We all know Paul Renner never intended for Futura to have crashing ascenders and descenders, either (the font was originally cast on a larger body to prevent this), yet that (error?) has persisted since the introduction of phototypesetting.</p>
      <p>Don't get me started on italics styled italic, i.e., Perpetua Italic, originally designed by Gill to have an 8° slant, styled italic at 12° equals an abomination at 20°! (Let's not get into Gill's personal abominations.)</p>
