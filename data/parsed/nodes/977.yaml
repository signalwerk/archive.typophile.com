  date_raw: 19 Aug 2003 — 8:47pm
  votes: null
  html: <p>Does anyone know of any faces that  <br>1) are suitable for newspaper text <br>2) would work well with Gotham (the headline face) <br>3) are available in small caps (text figures would be nice too) <br>4) and can be had for not much more than $300? <br> <br>ITC Charter was suggested on the "Newspaper redesign" thread. I like it, and it meets all the above requirements, but I find it a tad bit bland, so I thought I'd see what else was out there. I haven't been able to find anything better. We've only got Quark right now, so OT fonts may not be workable. (Considering going to InDesign...) <br> <br>Thanks so much to everyone who gave advice on the last thread I started. <br> <br>zach</p>
  html_clean: <p>Does anyone know of any faces that  <br>1) are suitable for newspaper text <br>2) would work well with Gotham (the headline face) <br>3) are available in small caps (text figures would be nice too) <br>4) and can be had for not much more than $300? <br> <br>ITC Charter was suggested on the "Newspaper redesign" thread. I like it, and it meets all the above requirements, but I find it a tad bit bland, so I thought I'd see what else was out there. I haven't been able to find anything better. We've only got Quark right now, so OT fonts may not be workable. (Considering going to InDesign...) <br> <br>Thanks so much to everyone who gave advice on the last thread I started. <br> <br>zach</p>
