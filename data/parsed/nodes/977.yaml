    html: <p>&gt; narrower overall <br> <br>Kent, I've come to the -admittedly counterintuitive, and somewhat tentative- conclusion that narrowness is an illusional virtue in a news face. When you take into account the frequent linebreaks in news setting (and possible a negative effect in apparent size), it turns out that it might in fact backfire*. So the choice of width in a news face has more to do with the atmosphere you want to convey than economy. I'm talking about body here, not headings, where horizontal economy is of obvious benefit. <br> <br>* Does this jive with what the FB experts have told you? <br> <br>Also, when you pull in the extenders you automatically create a perception of width. When I was deriving Patria from Harrier, I ended up with a much more squat and masculine design than I expected, or even originally wanted. I'm lucky I ended up liking it like that!  :-) <br> <br>In the case of Whitman, it depends on the atmosphere you want to convey. If you want it wide/homey (which to me fits well) rather than narrow/elegant, chances are just pulling in the extenders is enough. <br> <br>hhp <br></p>
    html_clean: <p>&gt; narrower overall <br> <br>Kent, I've come to the -admittedly counterintuitive, and somewhat tentative- conclusion that narrowness is an illusional virtue in a news face. When you take into account the frequent linebreaks in news setting (and possible a negative effect in apparent size), it turns out that it might in fact backfire*. So the choice of width in a news face has more to do with the atmosphere you want to convey than economy. I'm talking about body here, not headings, where horizontal economy is of obvious benefit. <br> <br>* Does this jive with what the FB experts have told you? <br> <br>Also, when you pull in the extenders you automatically create a perception of width. When I was deriving Patria from Harrier, I ended up with a much more squat and masculine design than I expected, or even originally wanted. I'm lucky I ended up liking it like that!  :-) <br> <br>In the case of Whitman, it depends on the atmosphere you want to convey. If you want it wide/homey (which to me fits well) rather than narrow/elegant, chances are just pulling in the extenders is enough. <br> <br>hhp <br></p>
