  - id: 7260
    user: 2091
    date: 2003-08-21T17:35:00
    date_raw: 21 Aug 2003 — 5:35pm
    votes: null
    html: "<p>&gt;Soft and populist, now we're getting somewhere.  <br>&gt;Question: do you think something like the new  <br>&gt;LA Times body face is too homey for you?  <br> <br>I must confess I haven't seen it... I haven't found a bookstore that carries more than the basic Boston/NY papers plus some international ones. And a few minutes searching the internet yielded no high-res images. <br> <br>Sorry, I had meant to answer you about the demographic and viewpoint of the paper earlier but forgot. Gordon is a private, religious, liberal-arts college -- officially \"evangelical\", which is a kind of catch-all term for conservative Protestants. The student body however is more diverse than that, with both very liberal and very conservative Christians, and many non-Christians as well, (though that's rarely talked about). <br> <br>So handling the demographic is tricky: wheras a national newspaper can carve out its niche in the political spectrum, we probably have a more complex range of readers to serve. The task would be easy if a garden variety, conservative evangelical Protestant had gotten the editorship: you just select and deliver the news from that point of view, and basically preserve the Gordon status quo. But I'm more of a progressive pseudo-Christian (a Quaker to be precise), so I have to think really hard about how to balance my views with what the Gordon community would prefer to hear. For example, we will probably publicize the nasty things done by some the companies Gordon is invested in, though it will probably make many people upset. <br> <br>And though we will be pretty leftist, I don't want us to be either shrill (trying to find common ground whenever possible) or alarmist (talking about important social issues, sure, but not trying to put everyone in a perpetual state of moral outrage). So a simple and gentle typeface might reflect that well. </p>"
