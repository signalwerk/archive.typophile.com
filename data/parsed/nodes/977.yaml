    html: <p><i>&gt;The wonderful Whitman is a book face; its x-height  <br>is too small for news setting.</i> <br> <br>I have to agree. Whitman would not be well suited for  <br>news. Given some of its roots in Scotch forms, however,  <br>I have wondered if it couldn't be reconfigured for  <br>newspaper work. I have sketches somewhere that I  <br>started a while back to adapt the proportions to news --  <br>much taller x-height and shorter extenders, narrower  <br>overall, etc.  <br> <br>But that is on a back burner and may never come to  <br>any fruition. <br> <br>I'm personally a great admirer of both Charter and  <br>Swift. Understatement and neutrality are generally  <br>good qualities in a news face. These two might not  <br>work in commercial newspaper circumstances, but I  <br>think they might serve well in a school paper.  <br> <br>-- Kent. <br></p>
    html_clean: <p><i>&gt;The wonderful Whitman is a book face; its x-height  <br>is too small for news setting.</i> <br> <br>I have to agree. Whitman would not be well suited for  <br>news. Given some of its roots in Scotch forms, however,  <br>I have wondered if it couldn't be reconfigured for  <br>newspaper work. I have sketches somewhere that I  <br>started a while back to adapt the proportions to news --  <br>much taller x-height and shorter extenders, narrower  <br>overall, etc.  <br> <br>But that is on a back burner and may never come to  <br>any fruition. <br> <br>I'm personally a great admirer of both Charter and  <br>Swift. Understatement and neutrality are generally  <br>good qualities in a news face. These two might not  <br>work in commercial newspaper circumstances, but I  <br>think they might serve well in a school paper.  <br> <br>-- Kent. <br></p>
