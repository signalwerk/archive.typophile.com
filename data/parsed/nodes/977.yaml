    html: <p>&gt;the "stateliness" conveyed by its narrowness <br> <br>Actually, Worldwide might be a bit too condensed to work with Gotham, which is quite squat and wide looking. However, it could work with Gotham Condensed. But really, it's tough to know till you actually start playing around. There are so many typographic parameters that a designer can fiddle with these days in news design -- a huge difference from the rigid restrictions of the pre-digital era. <br> <br>A few years ago, North American web presses went narrower, causing all kinds of design problems for news designers, who generally responded by going to narrower faces. So there is definitely a "semi-condensed" look to the genre -- but of course we don't know where Zach is is heading in relation to the trend.</p>
