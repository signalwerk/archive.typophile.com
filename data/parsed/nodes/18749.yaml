  html: <p>Is there a set number or maximum number of digits that the Type-1 Unique ID Number can be?  Also, are there applications, OS versions, or printers that sometimes have trouble reading fonts that have no ID numbers, or longer ID numbers?  What might happen if two fonts loaded on one system shared the same ID number?  Thanks in advance.</p>
