      <p>Here's a slightly updated/expanded version of some information that I wrote for Adobe developer support on this question. (Edited again on 3/23 to improve clarity/accuracy.)</p>
      <p>Yes, Type 1 UniqueIDs are a set number. No, neither Type 1 nor OpenType CFF fonts require UniqueIDs. Nothing will break if you omit them.</p>
      <p>Back in the mid-80s, when printing might be done on a 57K serial connection and printers might have 8 MHz processors, the caching of font bitmaps in PostScript devices enabled by UniqueIDs made a noticeable speed difference. With today's connection bandwidths and printers, the printing speed difference was insignificant for western-language fonts in our tests, and not enough to outweigh the risks of collisions between UniqueIDs for different fonts and the trouble of tracking the ID numbers. (Note that there did seem to still be some advantage for our Asian fonts with 10,000-25,000 glyphs.)</p>
      <p>A collision between UniqueIDs can cause glyphs from the first font printed to substitute for those of the second font with the same UniqueID. Although it is rare, it is a serious problem - and hard to diagnose when it happens, because it is rare enough that most people have never seen it themselves before.</p>
      <p>If you must use UniqueIDs for some reason, you should get them assigned by Adobe to minimize the risk of collisions.</p>
      <p>XUIDs can be guaranteed to be unique, thanks to the extensible mechanisms and vendor ID registration involved. However, the same comments about minimal speed improvement apply here.</p>
      <p>For these reasons, Adobe has stopped using UniqueIDs (and XUIDs) in our western OpenType CFF fonts. If we still made Type 1 fonts, we wouldn't use UniqueIDs for them, either. We *do* in fact still use XUIDs and UniqueIDs in Asian CID-keyed fonts, because the same analysis showed that there was some printing performance benefit in this case.</p>
      <p>Regards,</p>
      <p>T</p>
