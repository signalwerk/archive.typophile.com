      <p>An honour it was. I first read the book in 1967 as it came out. After almost fifteen years I decided to translate it (from original German, of course). A contract with Arthur Niggli was signed by Kniga, so we used the original films received from Zürich. Phototypesetting in Univers 55 was done by Pravda on Linotron 202.</p>
      <p>And yes, there was plenty of space, so, based on the same grid, I used either single-, or double-, or triple-column page layout.</p>
    html_clean: |-
