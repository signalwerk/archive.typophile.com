      <p>So is mine, actually (3rd edition, New York: Visual Communication Books, Hastings House, Publishers, Inc., 1977). My translation of <em>Typographie</em>/<em>Typography</em> was published by Kniga (Moscow) in 1982. It was just Russian (no German, English, or French), so I had to adapt the text layout accordingly.</p>
