    <p>WikiLeaks is having a t-shirt design competition over at <a class="freelinking external" href="http://99designs.com/t-shirt-design/contests/t-shirt-design-wanted-wikileaks-70772" rel="nofollow">99designs</a>. And could really like WikiLeaks to get an appropriate and effective t-shirt, <a class="freelinking external" href="http://99designs.com/t-shirt-design/contests/t-shirt-design-wanted-wikileaks-70772/designers/473745#entry-720" rel="nofollow">I have tried and it is fun</a>, but the competition holder seems to mostly appreciate geeky or in my opinion some very bad designs. I got so desperate I even tried to do Star Wars and Matrix series to please the hackers... But we really seem to have different tastes...</p>
    <p>However I still think WikiLeaks deserves the best, so I would like to find the middle ground between us.</p>
    <p>Please help me and WikiLeaks, either tell me what I should do or what I have been doing wrong or contribute your own better designs to this competition! Any advice and opinion would be greatly appreciated!</p>
    <p>I think WikiLeaks needs a typographically strong t-shirt since it is about freedom of mostly verbal information and a very serious matter indeed. Graphics and gimmicks are very subjective and may or may not appeal to certain demographics, strong typography is more universal hence more appropriate imho. But I think any t-shirt needs to be very clean and simple, since there are limitations in the printing techniques and also because people will look at your face and not your shirt so the shirt needs to be very simple in order to even get noticed!</p>
    <p>Thanks.</p>
