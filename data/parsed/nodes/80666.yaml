      <p>Mandelum, since you are new here you may not know that many of us are opposed to design contests (also known as "spec work"), as we consider them to be bad for the design profession. You can read more about the reasons at <a href="http://www.no-spec.com/faq/" title="www.no-spec.com/faq/">www.no-spec.com/faq/</a>.  </p>
      <p>But even if we put that issue aside, in this particular contest you are competing against over 700 other entries (so far), you're designing for a client you've never met or talked to, and who has provided only brief and vague instructions, and the client appears to have bad taste in design. Not a good situation for a designer.</p>
