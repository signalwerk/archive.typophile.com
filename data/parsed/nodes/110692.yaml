      <p>Very helpful Albert. So lets look for a version of Times Roman that fits the letter-forms better than the usual suspects. There is a matching g in the version designed by Francesco Simoncini and W. Bilz in 1965, for Ludwig &amp; Mayer and now sold in digital form by Bitstream as Life. So lets try a compressed version of Life [80%]<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LifeCondensed_6351.jpg"></div><br>
      Part way there. Closer than Kozuka Mincho Extra Light.<br>
      Can see how selective widening of some glyphs, such as j, and narrowing of others, such as m and w, while keeping the weight could make a monospace.<br>
      Don<p></p>
