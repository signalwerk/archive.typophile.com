    html: |-
      <p>bojev: To me it looks like Adobe more or less generated a Latin counterpart to Kozua Mincho using Adobe Serif MM. On the other hand, I get the impression that many Latin counterparts to Japanese typefaces are designed in a similar style. Especially those who are designed in Japan. A kind of middle-of-the-road Century Old Style design with a large x-height and a weight that is too light. The weight and proportions of such typefaces may be a good-enough-match to Japanese Mincho, but they are often too light to serve as a decent text typeface for readers of the Latin script. </p>
      <p>TGabriel: The typeface in the sample you posted looks as if someone tried to create a monospaced version of Times Roman. Smells like ‘default design’.</p>
    html_clean: |-
