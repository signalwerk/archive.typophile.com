    html: <p>I didn't do much research before I posted this. Now that I see that this has already been done a million times, I'll just play around with it so I can <em>see</em> the difference myself. I won't worry too much about whether the methodology is rigorous. I think I'll print some random phrases in different faces and sizes and see how hard they are to read from different distances. Later, I may also try setting random texts in different faces and timing myself to read them, but I still have to figure out how to choose suitable texts without reading them.</p>
