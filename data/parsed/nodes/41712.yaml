      <p><cite>I’ll set the same word in different fonts, have subjects read through them in random order, record how long each took. I still have to decide what “reading” means here; I’ll figure out the details over the week.</cite></p>
      <p>Those test are done for decades. You should do a little research before you start your own survey.<br>
