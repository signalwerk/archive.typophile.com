    <p>I just read <a class="freelinking external" href="http://typophile.com/node/41365" rel="nofollow">this</a>, so now I want to perform such a legibility test. Actually, I really want to test readability.</p>
    <p>I'll set the same word in different fonts, have subjects read through them in random order, record how long each took. I still have to decide what "reading" means here; I'll figure out the details over the week.</p>
    <p>I could also do the same for longer texts to test readability, but there are obvious problems with this: The text would need to be really long in order to measure legibility properly, so I'll have to come up with some way to account for the memory of the previous readings of the same text.</p>
    <p>I already know I need help determining how to account for differences in width among fonts for testing readability. How do you suggest that I account for this? Here are my only ideas so far:</p>
    <ul>
    <li>Adjust the width of the column such that the number of characters per line is equal for all fonts.</li>
    <li>Do not adjust the width of the column, but stop each line at the same place.</li>
    <li>Do not make adjustments to account for the different widths of characters, but test different column widths to see which fonts are best at which column widths.</li>
    </ul>
    <p>All of the fonts should be set in whatever way is best because that's how anyone who cares about readability is going to set them, so, ideally, I should to adjust column width, leading, margins, &amp;c. where such adjustment is appropriate.</p>
    <p>I'm also wondering what English words and text to use. Any ideas?</p>
    <p>EDIT: Cool, <a class="freelinking external" href="http://en.wikipedia.org/wiki/Readability_survey" rel="nofollow">people already do this</a>, except it seems like font hasn't been tested so much as general layout.</p>
