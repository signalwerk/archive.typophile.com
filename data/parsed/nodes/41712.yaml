    html: <p>Before you create a experiment I suggest you talk a bit more with the folks already doing this kind of research so that you get an idea of what research has already shown so you can better understand what it would take to do a meaningful piece of research. Peter Enneson &amp; Kevin Larson might be willing to talk to you. I applaud your enthusiasm; But as they say, "Festina Lente,” the Latin phrase meaning “hasten slowly”.</p>
