    html: |-
      <p>When I'm developing news text faces, I pick an existing face as a benchmark and try to match the character count, with identical leading, column width, and h&amp;j settings.</p>
      <p>I then try to match the apparent size of my new face to the benchmark.</p>
      <p>This approach is necessary because my clients always compare my new face to their existing face, and want it to look "as big" -- which is code for readability -- if not bigger, and they don't want to lose words.</p>
      <p>It's sometimes difficult to get an exact match, and the comparative settings may involve fractional point sizes and leading sizes. However, the main thing is character count.</p>
      <p>Having done this, it's still not unusual for a client to nuance the setting once they have the finished font. For instance, I had optimized one typeface for 9 on 9.5, and my client bumped it up to 9.3 on 9.5. Another client decided that their face needed negative 10 tracking. Yet another likes to horizontally scale 95%!</p>
      <p>Minute changes to the polyvariant complex of size, leading, scaling, tracking and h&amp;js can have a huge effect, which is why the idea that typeface readability can be reduced to a simple measurement is completely banal.</p>
