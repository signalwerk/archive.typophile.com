  html: |-
    <p>Warmer gear has finally arrived at <a class="freelinking external" href="http://typographyshop.com" rel="nofollow">TypographyShop</a>. We're pleased to present <a class="freelinking external" href="http://typographyshop.com/helvetica-sweatshirt.html" rel="nofollow">Helvetica Neue Descending a Sweatshirt.</a></p>
    <p>They're on pre-release sale for $24.99 until December 31st, though we'll be shipping on the 20th.  The classic ash crewneck is screened in black on a 9 oz. classic ash crewneck 90/10 sweatshirt. </p>
    <p>We've sold its companion, <a class="freelinking external" href="http://typographyshop.com/helvetica_t-shirt.html" rel="nofollow">Helvetica Neue Descending a T-shirt</a> to buyers in over 20 countries now and hundreds of design blogs have featured us. We’ve got a new site and tons of new product coming in 2009, including some designs by some very prominent practitioners.</p>
    <p>As Typophile has brought us a great deal of traffic this year I'd like to say thanks to our many buyers.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/helvsweatborder_4645.jpg"></div><p></p>
