      <p>@ Crossgrove: “Sadly you’ve missed the real reason students use fonts they don’t have licenses for: They can.”</p>
      <p>I ended my first post in this thread by saying “Of course, a lot of students will steal type because they can, but maybe a lot of students are stealing type because there’s no product out there filling that void.” So I agree with you to some extent, I just think there’s a lot of students who would be willing to buy type, but it’s not marketed to them in the right way. The best way, I think, to get students to buy type is to have it listed as required materials by their teachers. This would overcome a number of mental hurdles — it becomes like any another book they have to buy for their quarter/semester, it gets them in the habit of buying type, and they need to have it by a certain date, whereas downloading it off the internet is unreliable. If student font packs were marketed to teachers as packs for expressive typography, or editorial design, or beginning typography, advanced typography, etc, I think a lot of people would tell their students it was a required material. The basic idea is that a font pack could be a way to enrich the curriculum. Not that this would be the end-all solution to stopping piracy by any means, but it’s an idea. I think most students are like people who download music illegally — just because they have a lot of illegal music on their computer doesn’t mean they don’t have a shelf full of CDs and a closet full of band t-shirts. Of course there’s going to be that person who downloads 200,000 songs onto their hard drive, but most people don’t have the patience for that.</p>
      <p>@ Dan: “Can someone please point out the typical graphic design student to me? Where I sit, the typical graphic design student is not American. Moreover, English is probably not his or her first-language either.”</p>
      <p>My point was that the typical graphic design student is not going to get terribly excited about typefaces of the workhorse variety, where I used the examples of something like old-style lining figures and an extended character set as something that makes a typeface very valuable but isn’t necessarily attractive to most design students. The typical graphic design student probably is not American, I agree — half my graduating class spoke a language other than English as their first language. But I think I was more interested in non-Latin scripts and extended character sets than anyone I went to school with (actually, the only one), and I’ve found that to be even more true since I started working. This could be due to the fetishizing of English as the language of high design, and it could just be that type plays a small role in the work of a lot of designers.</p>
