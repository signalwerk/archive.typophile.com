      <p>On 1. When the student’s work goes into the book to be published - who holds the copyright? Did the student sign an agreement to be in the book - if yes, what did that agreement say? If no, does the university/college/school/organization own its copyrighted material? Was the student advised of his/her rights. </p>
      <p>I ask this because of an essay I once wrote. I wrote it during a college course on the history of New York and the professor used it in a compilation. My compensation - a good grade and I no longer had any legal rights to my “own” work.</p>
      <p>2. This is such a difficult question in today’s world. Yes, illegal is illegal - and thanks to the Clintons we have a don’t ask, don’t tell policy as a normal way of life. It’s illegal. Some fonts are fine for personal work - and I love Jens response. Education is the best way to go for the future. An understanding of the hard work that went into creating the font (sorry guys, not everyone can make a font) the thought process of the personality of the letters - how they fit together - work together, etc. If the designer is alive - it would be great if you could get them to come in for a class to discuss type. What an opportunity.</p>
      <p>3. I would like to share, once again, the Quark story. They went after a computer specialist company in New York City. The “gurus” had bought about 12 copies of Quark. They installed them for one company and were paid. They submitted it to Quark under their own company’s name. When they were called into the next company to get them computer-ready — they used the same 12 copies. And they did this over and over and over and over... well, you get the picture. When Quark put out its next program and the upgrades kept coming in with the same serial numbers - they had a lawsuit to pursuit. They did and they won.<br>
      The moral of this story: If it’s big enough to go after - they will.</p>
      <p>OT - hey Dark Knight - you ready to turn to the Dark Side?</p>
