      <p>@ Dan: I don’t want to disparage support for multiple languages in any way, particularly ones that have taken a back seat to more dominant business languages. My purpose was to compare something that people in the type community get excited about vs. what a typical graphic design student is going to be excited about.</p>
      <p>@ Nick: I wish that everyone did pay for font licenses, as probably 99% of people on Typophile do. In the graphic design world, it’s something that is rarely confronted — you walk into an agency with 10,000 fonts on their system, and you know that it’s probably pirated, but what are you going to do? The options are to 1) prosecute aggressively, which is a financial impossibility for most foundries, and regardless of how right the foundries are, they’re going to be seen as raining on the parade of people who should be their customers 2) create a copy safeguard in the software, which will be easily hacked and shared on p2p networks 2 weeks after it’s released, or 3) develop a new means of distributing fonts, that encourages designers to purchase fonts.</p>
      <p>One thing that makes stealing fonts really attractive is that it’s private: you get on a p2p network, move everything into your font management program, and it looks like you bought them legitimately. I work with designers all the time who have $100,000 of fonts on their system, but I’m not going to accuse them of stealing, even though it’s highly unlikely that they bought them. Maybe font foundries need to start publicly praising those clients who do purchase licenses. And perhaps there’s some way to publicly shame agencies and corporations that use fonts without proper licenses?</p>
