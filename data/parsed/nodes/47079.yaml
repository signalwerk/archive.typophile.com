      <p>Well, maybe you guys went to a different school than I did, but the way I saw it then, and still kind of see it now is that when you are in school- it’s all “fair game”. School is expensive enough and it is no time to be saving up 200 dollars so that you can get five weights of “Interstate”.</p>
      <p>Once you are out in the real world it is up to you to risk getting caught with your hands in the cookie jar, but until then pay no attention to the man behind the curtain.</p>
      <p>Although I’m sure it is technically illegal on paper, I really don’t think type foundries have become so far removed from schools that they could sue students. So in effect it is legal until a foundry sues (and wins), which so far as I know they never have.</p>
      <p>Imagine a publisher of sheet music suing a student for using a photocopy to win a recital!</p>
