      <p>Numbers not necessarily corresponding to the original questions.</p>
      <p>(1) The content of an essay/paper is text. It is not the font. Therefore, any copyright issues would have to do with the content. Most teachers dictate 12pt Times New Roman (or similar), so it’s not a terribly big deal. I found Palatino or Garamond on most computers I ever used, so when I could I used them - especially Palatino, which has greater space between lines and looks very comparable to Times New Roman 12pt when at 11pt. </p>
      <p>If the paper’s going to be put in a compilation, the student really doesn’t have any dictate as to the font used therein...digital copies are the thing nowadays, so it’ll get formatted however the rest of the book is formatted (literary journals sometimes make exceptions, but not often).</p>
      <p>(2) Teacher’s rules stand; were I a teacher, grading an essay, font wouldn’t even come into the picture, unless it were Comic Sans 20pt or something like that. </p>
      <p>(3) Now, if this is a graphic design project...slightly different, I guess. However, if the school provides all the applications/materials, and hence fonts...yeah. And like a lot of people here have said, it’s really hard to track this kind of stuff. When I do Photoshop work, I’ll typically set the height at 75% or so, which distorts the font even more, just as an example. </p>
      <p>So I guess my final thoughts would be this: chances of getting caught are near nil, so it’s up to the teacher to give final say, I should think.</p>
      <p>Peace,<br>
      JT</p>
