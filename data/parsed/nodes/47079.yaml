      <p>Lantz: the sheet music analogy does not work. Fonts are tools with value; sheet music doesn’t have a lot of its own value without a performer interpreting it. Is there a big market for pirated sheet music? </p>
      <p>Fonts are a new kind of property; virtual, “intellectual” property that can be replicated infinitely, like software programs and songs. That analogy (pirated songs) holds up much better if you are going to make a comparison. Be wary of making comparisons between anything physical, which requires additional resources to reproduce (copy) and digital data which does not. It’s a new concept.</p>
      <p>FeelTheKern: Sadly you’ve missed the real reason students use fonts they don’t have licenses for: They can. Kent points out that there previously was no way to get these products/services for free, so students didn’t just sit around bitching and scheming ways to get them for free. Now that this concept of instant download, instant replication is so widespread, students don’t think about how what they are doing is illegal, unethical, problematic, or anything. What’s their motivation? They would prefer to lean on all the excuses Nick lists, and demonize anyone who suggests that they do the right thing. Many students and designers are equally blithe about using pirated copies of InDesign, Illustrator, etc. for all the same reasons, “It’s too expensive/a rip-off”, “everyone’s doing it”, or “nobody is going to arrest me”. They are excuses and rationalizations, not reasons. But they are widespread because there is very little enforcement or other electronic barrier to copying/downloading. If students could get their books, rent, food and clothing for free thru a magical TV, believe me they would. </p>
      <p>In the case of a large agency with thousands of unlicensed fonts, that’s easy: get them licensed. How old or well-paid do you have to be to finally accept that tools and supplies cost money? If you don’t pay rent or utilities on your agency’s studio space, do you just get to skate along hoping the landlord doesn’t notice? “Yeah but our rent is rilly high so I shouldn’t have to pay”.   ;)   A well-run design house makes font purchases part of their budget, along with all the other costs that go into their business.</p>
    html_clean: |-
      <p>Lantz: the sheet music analogy does not work. Fonts are tools with value; sheet music doesn’t have a lot of its own value without a performer interpreting it. Is there a big market for pirated sheet music? </p>
      <p>Fonts are a new kind of property; virtual, “intellectual” property that can be replicated infinitely, like software programs and songs. That analogy (pirated songs) holds up much better if you are going to make a comparison. Be wary of making comparisons between anything physical, which requires additional resources to reproduce (copy) and digital data which does not. It’s a new concept.</p>
      <p>FeelTheKern: Sadly you’ve missed the real reason students use fonts they don’t have licenses for: They can. Kent points out that there previously was no way to get these products/services for free, so students didn’t just sit around bitching and scheming ways to get them for free. Now that this concept of instant download, instant replication is so widespread, students don’t think about how what they are doing is illegal, unethical, problematic, or anything. What’s their motivation? They would prefer to lean on all the excuses Nick lists, and demonize anyone who suggests that they do the right thing. Many students and designers are equally blithe about using pirated copies of InDesign, Illustrator, etc. for all the same reasons, “It’s too expensive/a rip-off”, “everyone’s doing it”, or “nobody is going to arrest me”. They are excuses and rationalizations, not reasons. But they are widespread because there is very little enforcement or other electronic barrier to copying/downloading. If students could get their books, rent, food and clothing for free thru a magical TV, believe me they would. </p>
      <p>In the case of a large agency with thousands of unlicensed fonts, that’s easy: get them licensed. How old or well-paid do you have to be to finally accept that tools and supplies cost money? If you don’t pay rent or utilities on your agency’s studio space, do you just get to skate along hoping the landlord doesn’t notice? “Yeah but our rent is rilly high so I shouldn’t have to pay”.   ;)   A well-run design house makes font purchases part of their budget, along with all the other costs that go into their business.</p>
