      <p>There are many products available to students (who show enrollment) at substantial discounts. Sometimes they are limited versions, but often they are no different from regular versions. I like this, because it acknowledges that students don’t have the same income as professionals, and it also acknowledges that the software is worth something and should be licensed legitimately. Foundries can offer similar discounts.</p>
      <p>“students will use the fonts anyway[s]”  Is that really a reason to offer the fonts for free? To me it seems to be saying “oh well, we can’t make you buy them, so go ahead”. I don’t think that’s a realistic position for a business. It also says the fonts don’t really have any value. </p>
      <p>When students graduate, typically they stretch their student licenses out as long as possible. They aren’t eager to pay full prices for conferences, software, periodicals, etc. When they are forced to upgrade at full price, they do. With fonts, there’s no upgrade path, so those graduates can then use the fonts they got for free indefinitely (or until the next big format shakeup). </p>
      <p>Maybe what would be useful is limited (basic) versions of fonts at lower prices. Some foundries already offer a number of options.</p>
      <p>And then there’s the whole literacy issue: Too often it seems, someone is crying about how terribly expensive a font is, and it turns out they aren’t really looking at the prices, they’re just seeing the one, full OpenType family price and apparently assuming that is the price for one face. If people really want to license type, there are options, and they are affordable, if they would be bothered to shop around. But it’s unrealistic to expect unlimited choices, if one’s budget is limited.</p>
