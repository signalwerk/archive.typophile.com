      <p>When I was a student, I either had to comp lettering up by hand, buy the Letraset and rub it down, or pay to have text galleys typeset by my local type shop. Stealing Letraset or stiffing the typesetter was never an option.</p>
      <p>I understand the pragmatic arguments that are used to justify students not licensing fonts, but I think they should realize how lucky they are to have so much available to them and that by living in this legal gray area, they actually get off pretty easy.</p>
      <p>And that hypothetical student who won the recital? They may indeed have been able to photocopy the sheet music from the school’s music library (that’s covered by the Fair Use doctrine), but I’m pretty sure they had to purchase or lease their violin. It’s a shaky analogy — is a font the music, or is it the instrument?</p>
      <p>— Kent.</p>
