      <p>1. A student book into a contest and show doesn’t cease being a student book. So I see no issue here. </p>
      <p>2. Theoretically one could get in trouble, but it almost never happens. It’s very hard for type designers/foundries to track who is purchasing and using their fonts, and even then it’s rare for anyone to get sued.</p>
      <p>3. Because file sharing generally requires the user to upload the file to other users while downloading downloaders expose themselves to lawsuits for making a copyrighted work available. Penalties can be as high as $250,000 per work, and if a user is downloading a large collection of typefaces, theoretical damages could escalate into the tens of millions of dollars. The Record Industry has used these theoretical damages to strongarm students and into forking over their life savings and selling all of their assets rather than go to trial. But nobody outside of the RIAA actually pursues these kind of suits against individual downloaders; the likely penalty is corporate lawyers sending a cease-and-desist letter to the offending ISP or University, who then calls up the user and threatens to cut off internet access.</p>
