      <p>I totally agree with Lantz on this one, and I have been a typography teacher for 4 years in a well known french school. some posters here are extremely disconnected from reality. I am, for one, convinced that if today’s students in the whole world stopped using the fonts they could not afford in their learning time, most of you designers would be in big trouble.</p>
      <p>I do now own the license of the fonts I use for any job I do, but I didnt own any font while I was a student myself, and it was obvious that 99% of my students didnt own these either, but I honestly didnt care. I spent enough time explaining them that they have to get the license of a type at the moment they use it for a job or whatever, and I am sure most of them understood this point. If all of you guys are trying to tell me now that you owned the rights to all the fonts you were using as a student, you are either lying or very very rich, or you are using only Helvetica and Times. In any case, you are not what a student generally is: eager to learn and use the latest creations to be able to stay tuned to what’s being done, and completely broke. What if Van Gogh had no money at all to buy his paint tubes? I guess you would tell him to wait until he could.</p>
      <p>dr</p>
