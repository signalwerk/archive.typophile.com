      <p>“the agreement would be between the foundry and the school, so any violation of the EULA would be the school’s issue.” — That’s right, but unless the student somehow became bound by the EULA, the student’s conduct is not a “violation of the EULA”. If the foundry can point out a breach by the <em>school</em>, then it could take action against the <em>school</em>. Any rights of the foundry against the student must be found outside the EULA.</p>
