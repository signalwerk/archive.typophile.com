      <p>Are 99% of design students type thieves? Sure, but pointing that out won’t make type designers any richer. Instead, foundries should be looking to new business models.</p>
      <p>There’s probably two reasons most students steal fonts: the urge to collect, and the feeling that they don’t have any good typefaces. There’s not a lot anyone can do about the urge to collect. But I think the right kind of marketing could help alleviate the feeling that they don’t have any good typefaces.</p>
      <p>I think only a few students have 100% pirated fonts on their computer. Most type teachers include something like Adobe’s Student Type Collection on their required materials list the first day of class, and being under $100, most students don’t have too big of a problem going out and getting it legitimately. I think the problem arises because, wisely, the Adobe Type Collection is mostly workhorse type families, and these are not overly exciting, especially in the hands of people who aren’t skilled at using them. So the solution is usually to believe there’s something wrong with those fonts, and that if you download 10,000 fonts then your problems will be solved. </p>
      <p>Half the problem, then, is education — teachers need to show students early on how much power they can get out of a seemingly bland type family, and feel confident that they can do great work if they only have a few fonts installed on their system. The second thing that could help this problem is to fill the void in the marketplace — students want what’s new at Veer, or the latest House Ind. script. Most students are not going to get too excited about a classic multi-weight text family with old-style lining figures and support for some Eastern European language they’ve never heard of. I think a supplementary pack or packs that address this desire would do really well commercially. The key is that the fonts be up to the minute, reflecting what’s cool in graphic design at that exact time. Of course, a lot of students will steal type because they can, but maybe a lot of students are stealing type because there’s no product out there filling that void.</p>
