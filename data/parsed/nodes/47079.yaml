      <p>At my school, and probably most schools I would imagine, students can’t install anything on school computers. Also, the school used all proper protocols for getting the rights to the fonts they had (and they had quite a few). But if I turned in a project using one that wasn’t on the school computers, which I did a few times, the teachers never questioned it. They spent their time like most teachers probably would, talking about how I applied them in the project. As I’m sure we all know getting a font does not a project make, and learning how to use fonts, and finding the appropriate treatment of them, requires that you play with them and see how they look—whether you draw them by hand, or trace them in illustrator, or “steal” them.</p>
      <p>Of course no analogy is perfect, but I think the best analog of the violin is the computer, not the font, in this case. Copying sheet music from the library would be fair use, if it wasn’t public domain. I think copying a font, however you go about copying it, in the pursuit of education, is fair use too.</p>
      <p>As I say though, everything changes when you get into the real world, as it should.</p>
