      <p>Some great comments here. It is difficult to completely prevent students from having access to free typefaces, especially when they are so widely available. It’s even harder to prevent students from obtaining them on file-sharing networks. </p>
      <p>From an ethical standpoint, as a professor, if I find out that a student used a typeface obtained illegally, could I tell them to use another typeface or fail them for ’stealing’ a typeface? Yes, technically I can. I can also lecture about professional ethics, stealing, use of ’free’ typefaces, etc. </p>
      <p>But, remembering my time as a student and how much money I had, I didn’t have enough to purchase typefaces. While I can’t order a student to purchase a typeface, should or rather, CAN I fail a project because they utilized a stolen typeface? </p>
      <p>As Lantz said, a typeface doesn’t always make a project. On our machines at school we have a set of fully-licensed typefaces that students are welcome to. And, it’s a quite extensive set! In theory, a student should be able to find a typeface for any project. While it is the professor’s duty to educate student about ethical use of type, is it on their shoulder to prevent student’s from using typefaces found through illegal means? If the students used school equipment to illegally download/install fonts, that’s one story. But if they do it at home, on their own computer, should I still forbid the use of typefaces obtained in such a manner?</p>
