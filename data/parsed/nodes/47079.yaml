    <p>A few legal questions related to typefaces that I’m still a bit...how can you say...thick on?</p>
    <p>1. Work is created on a school computer (since I work in the academic world) and a certain typeface is available. A student submits it for a book and it gets selected, wins a competition, have it included in a show, etc. Is there any potential for legal consequences, since the student used a typeface w/ an academic license?</p>
    <p>2. A question that some of my students are particularly interested in. Since you can find almost any typeface online illegally (i’m referring to torrents and other file sharing communities), if a student of mine download a typeface illegally, uses it for a project, and they create the work at home and not on a school computer...a. can they get in trouble for it legally? b. can I get in trouble as an educator, knowing that they did not purchase the typeface? c. if they face any legal issues, can their work be disqualified/kicked out of a competition, art show, etc</p>
    <p>3. If someone downloads typefaces from a file-sharing community, what are any/all legal consequences that they can face? </p>
    <p>Any other legal tidbits/suggestions/advice would be great. Thanks!</p>
    <p>Nikita</p>
