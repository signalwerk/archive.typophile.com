      <p>Not a legal advice, but the fonts that can be found for download from dubious sites are often not the official foundry versions. They get extracted from PDF or Flash files, autohinted, autokerned if at all, format-converted ... So basically if students work with these they are learning to work with less than optimal tools. It’s for their own good to work with decent material.</p>
      <p>Might be an opportunity to analyze font quality issues with your students, compare badly done typefaces with good ones &amp;c.</p>
      <p>Jens</p>
