    <p>Hello everyone!</p>
    <p>I have a question:<br>
    I've search for lot of materials and books on design, but still have no satisfactory answer at all. Opinions differs, so I ask yours!</p>
    <p>Problem: position of the picture in the text on the page and it's relation to the baseline grid and text, In the case of modular grid.<br>
    Now I found two general opinions:</p>
    <p>1)<br>
    The bottom always is standing on the baseline, and the top is on the mean line (x-hight).</p>
    <p>2)<br>
    The bottom is standing on the desent line, and the top is on the ascender line (Caps hight).</p>
    <p>What you think about it?</p>
    <p>Maybe there are straight solutions, or reasoned opinions.<br>
    Thank you</p>
