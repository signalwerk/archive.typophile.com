      <p>We both enjoyed reading about Aichel, and love <a href="http://www.brno.cz/index.php?lan=en&amp;nav01=2222&amp;nav02=2038&amp;nav03=84&amp;obrazek=198">his church architecture.</a> Dad was a devout Catholic, and he’d like the connection. </p>
      <p>Mom also likes the idea of a subtle Irish influence.</p>
      <p>I’m still on the fence ... opinions?</p>
