      <p>If you could, please tell us something about your father, e.g.: his career, hobbies, interests. Not all of that can be expressed through a typeface, but it would give us something to go on in offering selections.</p>
      <p>There are considerations in lettering design for monuments to forestall erosion and such, but with modern techniques that usually involve sandblasting through a computer-cut template into very hard stone such as granite, those considerations don’t really apply.</p>
