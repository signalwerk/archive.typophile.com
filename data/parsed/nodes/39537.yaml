      <p>Thank you all so much for your condolences and great suggestions. So far, I rather like Aichel.</p>
      <p>To answer the questions thus far ... </p>
      <p>My dad lived his entire life in the Boston area, but I’d love suggestions for stone carvers anywhere in the northeast. I’ve only visited one monument shop, and it wasn’t memorable.</p>
      <p>I’d love hand carved lettering, but I’m not opposed to a well crafted sandblasted stone. The photos posted above are gorgeous, but are too flourished for my dad — and the stone will have my mother’s name added when she dies, and she prefers a more simple, somewhat stoic look.</p>
      <p>About my dad?  Well, his parents came over on the boat, literally, from Ireland just before he was born.  I’d love the stone to have an old world feel with just a touch of Ireland implied.  He was a very simple, understated man, often quiet, and exceedingly kind. I don’t think he had a single mean thought in his entire life. <a href="http://www.asimas.com/ASIMAS/everett/obituaryDescription.jsp?domain_id=224&amp;deceased_id=141638">His obituary. </a></p>
