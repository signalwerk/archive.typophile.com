      <p>I’ve been unable to see a sample of Adobe Penumbra Flare since the Adobe website keeps stalling out on me.  Munc is a lovely uncial, but my mother (an elementary teacher) says it looks “too much like a mix of uppercase and lowercase letters.” </p>
      <p>I’d love to know if anyone has ever seen <a href="http://www.myfonts.com/fonts/storm/aichel/aichel/">Aichel</a> (or similar) carved in stone, and if so, did it work well or look awkward?  I’ve never designed for stone carving before. </p>
      <p>I’m also still searching for a Boston area stone carver. My mom really wants to pick the actual stone personally, but doesn’t want to travel too far out of Boston. </p>
      <p>Thanks to all the comments here, I’ve learned a lot about what to look for. It’s important to me that I’m proud of it when it’s finally installed, and you’ve all been a great help.</p>
