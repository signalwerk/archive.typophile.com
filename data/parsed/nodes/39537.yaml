    <p>I’m charged with designing my father’s tombstone, and I have very little time to select a typeface. Any suggestions would be helpful. </p>
    <p>His name is (was) Francis G Burke, and I find both the B and the K to be a challenge when the whole name is capitalized as required by the graveyard regulations.  I just don’t want Times New Roman, and that’s what the engraver uses most of the time. </p>
    <p>Thanks,</p>
    <p>Eileen</p>
