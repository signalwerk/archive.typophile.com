      <p>First off, quite sorry for your loss. </p>
      <p>You should keep in mind, that some of the most beautiful stones are done by hand-lettering... even though the above examples are quite nice in their own right, they are some examples of less refined hand carved lettering... or rather, very stylized versions. </p>
      <p>A good stone letter carver letterforms can be as nicely refined as formal typefaces... with those small idiosyncracies that make them amazing. Granted, it is pricier... although I do not think that it is prohibitively so. </p>
      <p>If you choose a font / typeface, it will most likely be sandblasted on the stone... giving perfection and a flat back... whereas with hand done lettering, you get those really nice V cuts within the letterforms.</p>
      <p>I am sure, whatever you do, it will be the right + nice solution for you, however, I would keep solid hand carved letters in mind if it is a priority to get the most beautiful results possible.</p>
