  html: |-
    <p>Hi all,</p>
    <p>I've just released 2 new packs including 1150 Vintage Vector Ornaments &amp; Borders.</p>
    <p>All picked from 2 legendary 19th century type foundry catalogs.<br>
    I'm very proud of this release, the quality is amazing and they are all vectorized by hand, with great attention to the details and the soul of this decorative art.</p>
    <p>"PRINTER'S PARADISE" contains 430 frames and 179 seamless patterns, taken directly from George Bruce's Son &amp; Co Type Catalog (1882). The seamless backgrounds are perfect for retro packaging, posters and flyers, and you’ll also find hundreds of eclectic borders, corner fills and embellishments.<br>
    <a href="http://www.vectorian.net/collections/printers-paradise" title="http://www.vectorian.net/collections/printers-paradise">http://www.vectorian.net/collections/printers-paradise</a></p>
    <p>"LUXURIOUS FLOURISHES" is perfect for wedding invitations and certificates, with its 543 ornaments and 179 frames taken from Specimen Album catalog, by the Charles Derriey French type foundry (1862). If you need some authentic French penmanship in your life (and who doesn’t?), this pack has everything you could ever want.<br>
    <a href="http://www.vectorian.net/collections/luxurious-flourishes" title="http://www.vectorian.net/collections/luxurious-flourishes">http://www.vectorian.net/collections/luxurious-flourishes</a></p>
    <p>These packs give you the exact tools a printer would have had in the late 19th century – meaning you can mix and match frames, ornaments and backgrounds from each pack, knowing they’ll work perfectly together.</p>
    <p>I would love to hear your feedback on it!</p>
    <p>Vincent,</p>
    <p>PS:<br>
    I plan to release very soon thousands of victorian illustrations, coming from original catalogs - 1879<br>
    - Zeese's Specimens Of Electrotypes: Comprising Cuts, Borders, Initials, Ornaments...<br>
    (a very rare book, which was the foundation of a lot of type foundry illustration catalogs)<br>
    - James Conner's Electrotype Specimen - 1888</p>
