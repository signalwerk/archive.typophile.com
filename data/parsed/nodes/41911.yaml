      <p>It kinda looks muted instead of highlighted to me... Especially in the blue one... I'm not sure if that's due to the specific colors or if it's just that it's in the background element as well - but yeah, I'd look into alternatives if I were you...</p>
      <p>Try something in the same hue, but a little lighter on the background, or darker on the highlights, for instance, or try a different color alltogether... Or perhaps make the color a solid background to the highlighted words, with white text? (Though that may be a bit too much, as it's the same 'style' you've chosen for your main headlines..)</p>
