    html: |-
      <p>Hi Dan</p>
      <p>You are not insane :)</p>
      <p>To me the black text seems a lot stronger than the highlight colors you have chosen. Using the same color in the background lessens the highlighting effect even more.</p>
      <p>I would have all text the same color, or emphasis words using a stronger weight rather than color. </p>
      <p>Or you could try using a dark grey for the secondary text and a stronger color for the highlighted words.</p>
      <p>I am thinking if this gets printed by a potential employer on a standard black and white printer, possibly photocopied and sent around the pale colors will be lost all together. </p>
      <p>I also think having you text set in one color increases the legibility. It does depend on the sort of job you are going for, you want your resume to make an impact visually but you also want it to be easily read.  </p>
      <p>Hope this helps</p>
      <p>Zennie</p>
