    html: |-
      <p>I think this design is insane.  The diagonal lines are extremely distracting; your resume would be *much* easier to read without them.  It would even be easier to read with vertical or horizontal lines -- diagonal lines are the worst.  The pink is especially visually assaulting. </p>
      <p>I think the diagonal lines contradict the line that says "Skilled at communicating through considered typography." </p>
      <p>I assume you'll be submitting some sort of portfolio or collection of work with this resume -- let *that* speak for your design abilities and keep the resume simple and clean.</p>
      <p>If you were to keep the stripes, which you shouldn't do, make them lighter, thinner, and increase the empty margins around the text. </p>
      <p>I don't mean to be overly negative, but I do think it's a bad choice.</p>
