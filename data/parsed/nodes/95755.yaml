    <p><a href="http://www.boldmonday.com/en/nitti" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.boldmonday.com/en/nitti" rel="nofollow"><img src="http://typophile.com/files/nitti-40-580-typophile_6328.png"></a></div><p></p>
    <p>We’re happy to announce a new version of <strong>Nitti</strong>! We’ve (finally) added italics to this mighty popular family, and Pieter took the opportunity to tweak and improve many details in the roman styles as well.</p>
    <p>Now, with five weights, and support for Latin, Cyrillic and Greek this is our most complete typeface family yet. And we’re offering a temporary 25% discount on all styles of Nitti to celebrate its release!<br>
    More info: <a href="http://www.boldmonday.com/en/nitti" rel="nofollow">http://www.boldmonday.com/en/nitti</a></p>
    <p>Best wishes from Den Haag!<br>
    <strong>Bold Monday</strong><br>
    <a href="http://www.boldmonday.com/" rel="nofollow">www.boldmonday.com</a></p>
