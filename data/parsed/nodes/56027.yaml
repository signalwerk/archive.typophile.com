    <p>Hey all,</p>
    <p>I've been trying to identify two (to three) fonts from the old TV series 'The Dukes of Hazzard' (1979; <a class="freelinking external" href="http://www.imdb.com/title/tt0078607/" rel="nofollow">imbd-link</a>).</p>
    <p>One (or two) would be the lettering on the car, General Lee, especially the <strong>'01'</strong> on the side of the car, as depicted in the attachment. And I was wondering if the font of the letters differs from the font of the ciphers 01 (unfortunately, I could not find any decent images for the letters, just <a class="freelinking external" href="http://i28.photobucket.com/albums/c214/orange01/dukes_of_hazzard.jpg" rel="nofollow">this one</a> or <a class="freelinking external" href="http://www.prnewswire.com/mnr/cmt/21313/images/21313a.jpg" rel="nofollow">this one</a>).</p>
    <p>The other font would be the logo of the series, as depicted <a class="freelinking external" href="http://www2.warnerbros.com/dukesofhazzard/img/splash/DH_Splash_left_p2_off.jpg" rel="nofollow">here</a> or <a class="freelinking external" href="http://images.amazon.com/images/P/B0001WTWXI.01.LZZZZZZZ.jpg" rel="nofollow">here</a>.</p>
    <p>But I'm guessing that would be a custom made one..</p>
    <p>Thanks a lot,<br>
    alex.</p>
