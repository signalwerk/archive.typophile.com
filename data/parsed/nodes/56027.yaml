    <p>Hey all,</p>
    <p>I've been trying to identify two (to three) fonts from the old TV series 'The Dukes of Hazzard' (1979; <a href="http://www.imdb.com/title/tt0078607/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">imbd-link</a>).</p>
    <p>One (or two) would be the lettering on the car, General Lee, especially the <strong>'01'</strong> on the side of the car, as depicted in the attachment. And I was wondering if the font of the letters differs from the font of the ciphers 01 (unfortunately, I could not find any decent images for the letters, just <a href="http://i28.photobucket.com/albums/c214/orange01/dukes_of_hazzard.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this one</a> or <a href="http://www.prnewswire.com/mnr/cmt/21313/images/21313a.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this one</a>).</p>
    <p>The other font would be the logo of the series, as depicted <a href="http://www2.warnerbros.com/dukesofhazzard/img/splash/DH_Splash_left_p2_off.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> or <a href="http://images.amazon.com/images/P/B0001WTWXI.01.LZZZZZZZ.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
    <p>But I'm guessing that would be a custom made one..</p>
    <p>Thanks a lot,<br>
    alex.</p>
