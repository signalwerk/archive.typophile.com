      <p></p></center><p></p>
      <!--/attachment--><!--/attachment--><p> <br> <br>A lot of problems, I know. I'd like to get some impressions and feedback so I can keep working on it. I'm looking more for design feedback at this point, rather than technical, but of course all comments are welcome. <br> <br>Personally, I feel like I designed myself into a corner... And now it feels like Optima, which I didn't want it to feel like. There are several letters I really like, so maybe I need to apply the spirit of those to the ones I like less. <br> <br>I set out to design a sans with higher contrast in the strokes, but after looking at the results, I'm not thrilled. I'm discovering the low contrast of most sans serifs is what gives them that sans serif "feel". The higher contrast makes the letters more elegant, and I wanted something more robust and contemporary.</p>
