    html: "<p>I see a bunch of existing fonts in this, but nonetheless I think it can turn out individual enough to stand out and \"click\" for a bunch of users - go at it! <br> <br>Your hand sketches were looking a bit too Optima, but this digital rendering is encouraging. In terms of even color, there's no way we can tell from a screen image - gotta see a PDF. The \"b\" is a bit wide. The terminal of the \"j\" is unconvincing. As for the \"e\", I would be cautious, but not so rejectionist: it could in fact turn out to be what makes the font most attractive to a large chunch of users. <br> <br>hhp</p>"
