    html: <p>hrant, <br> <br>thanks for the feedback. Could you elaborate a bit on your comments about the j and e? If I'm understanding what you mean about the e, I think it has the most personality in the group. I'd like to retain that as much as possible. <br> <br>also, this may be premature, but I'd love to get your feedback down the line with regards to readability. I'm trying to use this to learn and explore why certain forms are more readable. I'd like this font to be as utilitarian as possible. <br> <br>eric</p>
