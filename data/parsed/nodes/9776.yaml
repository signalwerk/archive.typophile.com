  html: "<p>Hello all, <br> <br>I'm working on my first attempt at a complete typeface. It may be ambitious on the first time out, but I figure it's the best way to learn. <br> <br>I'm trying to develop a text face that incorporates the readability attributes of a serif but retains the spirit of a \"traditional\" sans. I want to stay away from the elegance of Optima, and lean more towards a true sans, while still pushing the stroke contrast and such. I guess it's a gray area I will have to explore, hopefully with your help. <br> <br>Here are my initial lc pencil drawings. There are obviously still a lot of problems with the axis in some of the letters. I want a vertical axis. Also, please note that none of the strokes are meant to be flared. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/67405.jpg\" alt=\"roman sans\"> <br> <br>Here are my thoughts as I develop it: The e, k, l and j feel like what I'm going for. Some of the other letters feel too \"pretty\". <br> <br>Also, after I get the basic shapes and proportions right, I'd like to add a little more character to some of the forms. The h, m, n and u feel lifeless, for example.  <br> <br>I'd love comments as well as perhaps some guidance in the technical aspects of developing this typeface, like translating it accurately to vector art and then into Fontographer. But one step at a time... <br> <br>Thanks <br> <br>eric</p>"
  html_clean: "<p>Hello all, <br> <br>I'm working on my first attempt at a complete typeface. It may be ambitious on the first time out, but I figure it's the best way to learn. <br> <br>I'm trying to develop a text face that incorporates the readability attributes of a serif but retains the spirit of a \"traditional\" sans. I want to stay away from the elegance of Optima, and lean more towards a true sans, while still pushing the stroke contrast and such. I guess it's a gray area I will have to explore, hopefully with your help. <br> <br>Here are my initial lc pencil drawings. There are obviously still a lot of problems with the axis in some of the letters. I want a vertical axis. Also, please note that none of the strokes are meant to be flared. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/67405.jpg\" alt=\"roman sans\"> <br> <br>Here are my thoughts as I develop it: The e, k, l and j feel like what I'm going for. Some of the other letters feel too \"pretty\". <br> <br>Also, after I get the basic shapes and proportions right, I'd like to add a little more character to some of the forms. The h, m, n and u feel lifeless, for example.  <br> <br>I'd love comments as well as perhaps some guidance in the technical aspects of developing this typeface, like translating it accurately to vector art and then into Fontographer. But one step at a time... <br> <br>Thanks <br> <br>eric</p>"
