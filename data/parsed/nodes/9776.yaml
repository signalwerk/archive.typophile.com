    html: "<p>here are a few refined characters: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/67565.jpg\" alt=\"\"> <br> <br>the b and e seem too light and the v and k seem too heavy. In fact looking at the other characters (not shown) all the round letters are on the light side, while all the diagonals are a bit heavy. I'll adjust on the next pass. <br> <br>As Jurgen noted, it's feeling a bit Meta-esque, which I'd like to avoid somewhat (although I like Meta). Maybe it's the slanted entry strokes on the stems. <br> <br>I think the unity is improved. Opinions? <br> <br>eric</p>"
