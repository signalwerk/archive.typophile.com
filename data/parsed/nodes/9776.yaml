    html: "<p>The \"j\": it just looks like the descender is being \"interrupted\", somehow. The \"e\": it's certainly an unconventional form; this doesn't mean it can't work, but it does mean its merit hasn't been \"proven\" via extended mainstream usage. So you have to try it out in actual printed text, show it to people (the right people), take a break from it and come back later (like a month at least) to see if you still think it works, etc. <br> <br>Readability: you really have to make some \"internal\" decisions first, like how to balance readability versus style (since neither can ever be total); and how you'd like this font to be used (large text in a magazine, small type on labels, or what). There really is no generic solution that can make a design good for everything (although you could say some uses are much more common than others, and it might make sense to target that mainstream primarily). <br> <br>One big factor in readability though is variance (which it seems you've already noted). It's hard to glean your stance on that from the digital glyphs, but your hand sketches are encouraging - you're putting some nice \"spin\" among letters that tend to be too close. I think the \"a\" could have a smaller bowl, the \"t\" slightly more presence, the \"w\" a shorter middle peak, the \"y\" a stronger tail, and the \"f\" a stronger beak. I think the descenders could be slightly shorter (or the ascenders longer, depending on the font's intended usage), and the \"g\" is a bit too classical (although it's highly readable). <br> <br>hhp</p>"
    html_clean: "<p>The \"j\": it just looks like the descender is being \"interrupted\", somehow. The \"e\": it's certainly an unconventional form; this doesn't mean it can't work, but it does mean its merit hasn't been \"proven\" via extended mainstream usage. So you have to try it out in actual printed text, show it to people (the right people), take a break from it and come back later (like a month at least) to see if you still think it works, etc. <br> <br>Readability: you really have to make some \"internal\" decisions first, like how to balance readability versus style (since neither can ever be total); and how you'd like this font to be used (large text in a magazine, small type on labels, or what). There really is no generic solution that can make a design good for everything (although you could say some uses are much more common than others, and it might make sense to target that mainstream primarily). <br> <br>One big factor in readability though is variance (which it seems you've already noted). It's hard to glean your stance on that from the digital glyphs, but your hand sketches are encouraging - you're putting some nice \"spin\" among letters that tend to be too close. I think the \"a\" could have a smaller bowl, the \"t\" slightly more presence, the \"w\" a shorter middle peak, the \"y\" a stronger tail, and the \"f\" a stronger beak. I think the descenders could be slightly shorter (or the ascenders longer, depending on the font's intended usage), and the \"g\" is a bit too classical (although it's highly readable). <br> <br>hhp</p>"
