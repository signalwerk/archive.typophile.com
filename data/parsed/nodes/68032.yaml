    <p>Hello all,</p>
    <p>I am working on a logo design for a photographer. I am finally to playing with beziers. I'd like some feedback on my progress. Attached is a little process of the modifications.</p>
    <p>Let me know if you think something is too much or too little or if you have other suggestions. I want it to feel a little more natural, but mostly to just feel "right" if that makes sense.</p>
    <p>Thanks!!</p>
    <p>evan</p>
