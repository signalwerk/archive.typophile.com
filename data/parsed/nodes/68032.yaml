    html: <p>I like the second "Jaquilyn", apart from the q, and the third "Shumate". Perhaps the tail of y could also be straight to match horizontal strokes on the h and t. The q looks like it wants to be slanted and looks uncomfortable amongst all the other upright letters. Very nice, but does this retro-look suit her work?</p>
