  html: |-
    <p>Please correct me if I'm wrong about these statements:</p>
    <p>1. embedding fonts in software/games is considered commercial use</p>
    <p>2. making a logo for a client  is considered personal use</p>
    <p>3. embedding in a book/pdf for sale  is considered commercial use</p>
    <p>are  these statements true?</p>
