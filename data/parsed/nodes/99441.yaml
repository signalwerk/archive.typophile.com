    html: |-
      <p>Actually, I'd say 1) false, 2) false (since in that question you were asking if it was personal use), 3) false. Because while 1) and 3) are definitely not personal use, they aren't covered by authorization for commercial use either.</p>
      <p>If you have a license for commercial use, you can do (2): make a logo for a client for which you get paid.</p>
      <p>If you have a license for commercial use that also permits PDF embedding - <strong>reasonably</strong> common, but not true of all commercial use licenses, you can do (3): embed it in a PDF that you distribute.</p>
      <p>If you want to do (1), use the font internally in some software you will distribute, you will have to negotiate a special contract with the font provider in most cases. (I've run across one company that charges $69 for a font and $690 for a license to do this, so there <em>are</em> cases where this type of licensing is routine. I believe the company makes fonts of comic book typefaces.)</p>
    html_clean: |-
      <p>Actually, I'd say 1) false, 2) false (since in that question you were asking if it was personal use), 3) false. Because while 1) and 3) are definitely not personal use, they aren't covered by authorization for commercial use either.</p>
