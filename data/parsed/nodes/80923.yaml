    html: |-
      <p>Joe, for someone so picky about grammar, it's ironic that you would misuse "malapropism".</p>
      <p>What do you suppose "Fontographer" sounds like, but isn't?<br>
      Photographer? Pornographer? </p>
      <p>This is more neologism than misuse.<br>
      Deriving a generic noun or verb from a brand name may be considered as neologism, a form of proprietary eponym.</p>
      <p>Fontographer, as a noun used to describe a person who makes fonts, is quite logical, because it avoids the ambiguity of using "typographer" for type designer</p>
      <p>If there is no allusion (intended or otherwise) to the software product, "fontographer" follows the non-professional trend that assumes "font" to mean "typeface". If "typographer" exists, why not "fontographer"?</p>
      <p>Nonetheless, I still prefer to call myself a type designer.</p>
    html_clean: |-
