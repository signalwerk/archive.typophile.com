    <p>I'm looking for some background on the traditional scale of sizes used for type sizes: 8 ... 12, 14, 18, 24, 36, 48, 60, 72, 96 etc. I am interested in finding out what the progression is. Why is it so handy for creating contrasts of size, for example, 36 pt heading with either a 24 pt. or 18 pt. subhead? As opposed to something more arbitrary, like 43 pt with 21.5 pt subs? How would the progression extend to very large sizes (say, above 120). </p>
    <p>I appreciate any thoughts from anyone less numerically challenged than myself.</p>
    <p>Jim</p>
