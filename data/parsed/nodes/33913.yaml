      <p>The de facto standard list of point sizes used across many computer programs probably got its start with the original Macintosh, which, due to technical limitations, came with matching bitmapped screen and printer fonts for only certain point sizes. If I recall correctly, the list was 9, 10, 12, 14, 18, and 24 for most fonts. (There were a few oddball fonts that didn't follow that rule; for example, I remember Venice being available in only 14, and Athens and San Francisco being available in only 18. But these were the exceptions.)</p>
      <p>I believe that most of the standard point sizes in use today were chosen because they're divisible by six, which makes them both easily halved and easily divided by three.</p>
      <p>At smaller point sizes, you need finer granularity, which is why the list starts out with small steps. But beyond, say, 36 points, there is very little to be gained from offering default sizes in a smaller increment than six. If user wants something around 50 points high, he can just select 48 from the list, and then manually adjust it later if 48 turns out to be a bit too small.</p>
      <p>Above a certain size (maybe at 48 points), it would probably be practical to increase the default increment to 12 points, and later to 24.</p>
