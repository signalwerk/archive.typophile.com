      <p>As an Alphatype shop - the progression was:<br>
      6, 12, 18, 24, 36, 48</p>
      <p>When Alphatype created new typesetting equipment that went beyond 48 points - it continued wiht<br>
      64 and 72.</p>
      <p>Some how there is some rhyme and reason to it - the point system itself in increments of 12.</p>
      <p>If you ever look at old type speciman books, the ones designed to help designers do proper character counts for lines, these were set as standards.</p>
      <p>I remember in the 1950s when artists were able to start using typositor for headlines - that started the change in headline sizes. Stat cameras were available to reducing and increasing type - most artist would ask that the Cap Height would be in "inches."</p>
      <p>It may also have to do with what was the most popular sizes being sold in hot metal. - This is only an educational guess and not fact. A typeshop had to buy type sizes in lead - and several ofr the same point size. (After all, how many lowercase Es do we use in a paragraph?) </p>
      <p>When cold type came about - the manufacturers used standards to make their master fonts. Mergenthaler used 6 point type - and blew it up - which is why their type always "chunky." Compugraphic used 24 point masters - creating all their point sizes from that. I was Alphatype, because they used several point sizes to create their masters, so the type set from them was closer in feeling, positioning, to hot metal type. </p>
      <p>I just wonder if this was another one that the answer to the real question was money...</p>
