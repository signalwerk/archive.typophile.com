    html: "<p>I think your sketch is sweet! Kerning aside, i think it's got a more accurate baseline and a more descernable form for the 'e,' a better series of terminals, and, well, I dig the curves.  <br> <br>Not knowing who this hiphop/electronica folks are, I can't tell you whether or not the fluid is better for them, but I know visually I find the sketch more interesting, and more cohesive. The strokes on the 'm,' for instance, are a lot more similar to the rest of the letters, where as the digitized versions don't quite match.  <br> <br>I think the angle of the 'm' strokes aren't supported by the angle of the 'e,' which appears to be violently attacking the m. maybe if the left corner of the e was not a corner this would be different. <br> <br>Anyway, rock on, this is interesting stuff! <br> <br>Aaron <br> <br>EDIT: I just noticed that in your hand drawn sketch, the 'lk\" ascenders are not really lined up, which I think is a great detail and could help liven up your digital versions!</p>"
    html_clean: "<p>I think your sketch is sweet! Kerning aside, i think it's got a more accurate baseline and a more descernable form for the 'e,' a better series of terminals, and, well, I dig the curves.  <br> <br>Not knowing who this hiphop/electronica folks are, I can't tell you whether or not the fluid is better for them, but I know visually I find the sketch more interesting, and more cohesive. The strokes on the 'm,' for instance, are a lot more similar to the rest of the letters, where as the digitized versions don't quite match.  <br> <br>I think the angle of the 'm' strokes aren't supported by the angle of the 'e,' which appears to be violently attacking the m. maybe if the left corner of the e was not a corner this would be different. <br> <br>Anyway, rock on, this is interesting stuff! <br> <br>Aaron <br> <br>EDIT: I just noticed that in your hand drawn sketch, the 'lk\" ascenders are not really lined up, which I think is a great detail and could help liven up your digital versions!</p>"
