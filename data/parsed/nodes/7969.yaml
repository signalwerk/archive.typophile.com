  html: "<p>EDIT: Had some trouble uploading the pictures in this post; they're in the follow-up. <br>-- <br> <br>Hello people. <br> <br>I'm doing a logotype for a group called Melk. <br>http://www.madshougaard.dk/typophile/melk_1.gif <br>I started out with this (very loosely outlined - no consistency whatsoever) <br> <br>Then decided it was a bit too 'sharp', so I reworked it, trying to get a Cooper / Sauna Black -quality to it: <br>http://www.madshougaard.dk/typophile/melk_2.jpg <br> <br>..then decided it was, after all, a bit too loose. <br>http://www.madshougaard.dk/typophile/melk_4.gif <br> <br>However, I did like the slanted look of the previous sketch, so I did this: <br>http://www.madshougaard.dk/typophile/melk_5.gif <br> <br>Something doesn't look right to me. It is the M I think. Maybe partly the E as well (btw: is it legible?). <br> <br>Please comment... <br> <br>regards, <br>Mads</p>"
  html_clean: "<p>EDIT: Had some trouble uploading the pictures in this post; they're in the follow-up. <br>-- <br> <br>Hello people. <br> <br>I'm doing a logotype for a group called Melk. <br>http://www.madshougaard.dk/typophile/melk_1.gif <br>I started out with this (very loosely outlined - no consistency whatsoever) <br> <br>Then decided it was a bit too 'sharp', so I reworked it, trying to get a Cooper / Sauna Black -quality to it: <br>http://www.madshougaard.dk/typophile/melk_2.jpg <br> <br>..then decided it was, after all, a bit too loose. <br>http://www.madshougaard.dk/typophile/melk_4.gif <br> <br>However, I did like the slanted look of the previous sketch, so I did this: <br>http://www.madshougaard.dk/typophile/melk_5.gif <br> <br>Something doesn't look right to me. It is the M I think. Maybe partly the E as well (btw: is it legible?). <br> <br>Please comment... <br> <br>regards, <br>Mads</p>"
