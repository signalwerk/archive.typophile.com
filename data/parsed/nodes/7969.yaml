    html: <p>hey - the e in your sketch...I think you might need the curve in the eye from the sketch onto your comps. in fact if you traced your sketch excatly, smoothed out some curves, I think you got something, well I like it at least, rather then the hard lines. <br> <br>strangely enough before your last revision I can't quite see the e - seems more like "c" or just some undesernable glyph but when you flipped the m, I see more e-ness, but the direction bothers me - unless you extend the strokes on k to the same degree and lenght for some sort of balance? <br> <br>just my tidbits. <br>-t</p>
