    date: 2005-02-05T16:21:00
    date_raw: 5 Feb 2005 — 4:21pm
    votes: null
    html: <p>Alessandro has a good point - the logomark and the typographic elements compete with each other too much. my first thought was to see the brackets in a screen of black to push it back a little visually. But, When i see what Alessandro has done I think it works just fine without the brackets.&lt;/font&gt;</p>
  - id: 59222
    user: 5834
    date: 2005-02-06T10:14:00
    date_raw: 6 Feb 2005 — 10:14am
    votes: null
    html: <p>Alessandro, you are right; the typographic elements, the logo, and the other graphics seemed to be at war with each other.  <br>Mike, I am interested by what you said about the "brackets behind a screen of black". Do you mean a black zone behind logo and bracket? <br>Thanks for all of your help, A and M.</p>
  - id: 59223
    user: 4325
    date: 2005-02-06T10:54:00
    date_raw: 6 Feb 2005 — 10:54am
    votes: null
    html: <p>Hey Adam, <br> <br>I don't think this was mentioned, but you want all the important info to be on the front of the card, you can't really count on the recipient turning the card over.  <br> <br>By screening the brackets back, he meant turning down the opacity so they were a lighter tint.  <br> <br>Everything on the card could still be smaller, right now, the logo has alot of visual impact, but so does your name, which doesn't need to be that big. I do have a tendency to go towards smaller type, but large copy just looks bad.  <br> <br>Good luck.</p>
  - id: 59224
    user: 4774
    date: 2005-02-06T11:44:00
    date_raw: 6 Feb 2005 — 11:44am
    votes: null
    html: <p>It looks great, but my comment would be to thin up the lines of the logo and brackets. They are way too heavy and that's one reason they compete with the text. The suggestion to screen them back would also help alot.</p>
  - id: 59225
    user: 1689
    date: 2005-02-06T12:42:00
    date_raw: 6 Feb 2005 — 12:42pm
    votes: null
    html: <p>That's right. I meant that you should try them at a percentage of 100% black. So, they would be more of a grey and not as powerful visually. <br> <br>Just a thought - not certain how it would look ...</p>
