    html: <p>Alessandro, you are right; the typographic elements, the logo, and the other graphics seemed to be at war with each other.  <br>Mike, I am interested by what you said about the "brackets behind a screen of black". Do you mean a black zone behind logo and bracket? <br>Thanks for all of your help, A and M.</p>
  - id: 59223
    user_id: 4325
    user_name: david_fung
    user_path: null
    user_image: null
    date_raw: 6 Feb 2005 — 10:54am
    date: 2005-02-06T10:54:00
    votes: null
    html: <p>Hey Adam, <br> <br>I don't think this was mentioned, but you want all the important info to be on the front of the card, you can't really count on the recipient turning the card over.  <br> <br>By screening the brackets back, he meant turning down the opacity so they were a lighter tint.  <br> <br>Everything on the card could still be smaller, right now, the logo has alot of visual impact, but so does your name, which doesn't need to be that big. I do have a tendency to go towards smaller type, but large copy just looks bad.  <br> <br>Good luck.</p>
