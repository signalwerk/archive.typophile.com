    html: |-
      <p>Yeah. I don't actually think that's a good thing. Apparently neither does Frutiger; when he and Kobayashi redrew it as Frutiger Next, they gave it a single-story italic "a."</p>
      <p>Meighan, if you were a chef, and a client wanted you to serve vanilla ice cream with ketchup and vinegar to their guests, would you do so? You could point out to your client that most typefaces that have that property are thought of as "oblique" rather than italic, and that most typographers think obliques suck.</p>
      <p>T</p>
