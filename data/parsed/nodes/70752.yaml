  html: <p>I'm working with Myriad Pro for a client- They would like to use that typeface for roman letters, but when making it italic- the a loses its ascender. Is there a stylistic alternative for this to change the a to look like its roman? I've looked through glyphs and can't seem to solve this.</p>
  html_clean: <p>I'm working with Myriad Pro for a client- They would like to use that typeface for roman letters, but when making it italic- the a loses its ascender. Is there a stylistic alternative for this to change the a to look like its roman? I've looked through glyphs and can't seem to solve this.</p>
