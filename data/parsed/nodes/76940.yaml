  html: |-
    <p>I have made an OT font using FontLab Studio 5.0.4 - composed of 1231 characters.<br>
    In my font i have total of 18350 kerning pairs that i have made myself.<br>
    Operating System: Mac OSX 10.5.8</p>
    <p>My problem is the following:</p>
    <p>When i try to generate final OT font in section Compile this error occurs:</p>
    <p>[FATAL] GPOS feature 'kern' causes overflow of offset to a subtable (0x1267e)</p>
    <p>Can anybody HELP ME to solve this problem PLEASE !!!</p>
    <p>Thank you very much in advance.</p>
