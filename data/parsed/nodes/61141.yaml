    html: |-
      <p><em>are the base glyphs (such as dotlessi and dotlessj) and diacritics which need to be kerned/moved over them useful to typesetters/compositors at all?</em></p>
      <p>Note: positioning of combining diacritics over bases is a GPOS anchor attachment lookup, not kerning. Kerning affects the position of all subsequent glyphs, while anchor attachment is mark-specific.</p>
      <p>The value of supporting dotless variants of soft-dotted letters and combining marks depends on the target languages. There are lots of languages in the world that rely on such mechanisms, because Unicode only includes precomposed diacritic letters for backwards compatibility. In effect, this means that only major languages that were supported in pre-Unicode charsets get precomposed diacritics: everyone else relies on combining marks.</p>
      <p>My clients request such things, but then they tend to be either involved in internationalisation or in scholarly publishing.</p>
      <p>One thing I do strongly recommend is to include Unicode combining mark character support for any accents used in precomposed glyphs in your font, not just the subset spacing accents (which are also backwards compatibility characters) and use the combining mark glyphs as components in composites. This has two benefits: it means that all your diacritic components can have shared x,y coordinates, rather than having different offsets with some components based on spacing diacritics and some on non-spacing, and it means that if you do decide to add GPOS anchor attachments you can use the component offsets to give you a head start.</p>
