    <p>Hello,</p>
    <p>I am considering removing the following glyphs from the character sets of fonts that I produce in the future (or not designing them at all for fonts I design in the future):</p>
    <p>1. Aringacute (U+01FA)<br>
    2. AEacute (U+01FC)<br>
    3. Oslashacute (U+01FE)<br>
    4. aringacute (U+01FB)<br>
    5. aeacute (U+01FD)<br>
    6. oslashacute (U+01FF)<br>
    7. dotlessj (U+0237)</p>
    <p>Aside from the dotlessj, I had heard that the other glyphs were for Danish, but that they are not used in contemporary, written Danish. Can anyone point to references where they are used?</p>
    <p>Are any of these glyphs used in any other languages? If not, I do not feel that it is necessary to include them in standard character sets any further, as least as far as fonts that I produce go. I am not sure if their being in older character sets or in other fonts' character sets (from e.g., Microsoft? Adobe?) is a convincing enough argument. What do you think?</p>
