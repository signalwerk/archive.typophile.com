      <p><em>The existence of free fonts did not harm the market, but rather stimulated more commissioned work to fill in the existing gaps.</em></p>
      <p>I was referring to the market for fonts, not commissioned work.</p>
      <p>The idea that flooding potential consumers with free product somehow stimulates the market is erroneous: while a small percentage of users may be interested enough to go out and buy something different than the bulk of their peers, it's a minority sale achieved at the cost of surrendering the bulk of the market. This situation may seem to benefit consumers, but it impoverishes content production in general, channelling it into the hands of a small group of commissioned workers who may be well paid, but undermining the potential greater income to be made from creative work by spreading it around. After all, you can't make money from something you don't own. The real money is in the mass market. </p>
      <p>Do consumers benefit from the situation where content producers are not making mass sales? No, because they still have to pay for media, whether it be digital devices or internet access. So "free" digital product just shifts profit from the creative sector to the hardware sector (and that includes Internet access).</p>
      <p>And ultimately, all consumers are content creators. So if, as a consumer, you play the game where you get free creative content, you are endorsing a system that restricts your ability to derive income from creative work.</p>
      <p>Beyond that, creative work gets redefined, stripping its value, becoming craft and production work that is bought outright by manufacturers, rather than warranting "points".</p>
