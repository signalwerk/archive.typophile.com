      <p>Those involved in scholarly publishing have been hearing that the sky is falling so long now that we cannot help but take new threats with a certain equanimity.  As for "cheap and cutthroat" competition, the usual strategy is to offer something better.  Of course, one of the things we all appreciate about the font John Hudson is working on is that it isn't cheap (assuming he isn't some weirdo "ragged-trousered philanthropist").</p>
      <p>As for John's work ever becoming a "profit center" for Brill, I have my doubts.  It doesn't take a genius to suppose that Brill commissioned the font to simplify their production of scholarly material covering a very wide range of subject areas and languages (more subtle is the need control licensing for use in their on-line publications).  Limiting the font's free distribution to published authors isn't practical: authors of books and articles not yet written are just as deserving -- and one hopes there will be sufficient scholarly "competition" so that poorer mss. can be rejected.  Bert Vanderveen has already referred to Brill's prices as limiting readership, and many with access to an institutional subscription forego a personal purchase, especially when on-line is so convenient: does Brill want to look like they're trying to squeeze something extra out of individuals already accustomed to reading for free?  I suspect they'd rather enjoy the gratitude of having made a tool developed for their own benefit available to anyone interested (where most of that category is both a prospective customer and makes library recommendations).</p>
      <p>Then there's the current economic situation.  But even here, beer offers us hope: according to this morning's <a href="http://www.npr.org/templates/story/story.php?storyId=112164683" rel="nofollow">National Public Radio</a>, here in the U.S. craft beer (less than 2 million barrels per annum) is doing better despite the downturn.  Anheuser-Busch may control much of the market, but there is room for competition based on quality.</p>
      <p>David</p>
