      <p>Nick: <em>The retail market is squeezed to the sidelines, the bell curve distorted.</em></p>
      <p>This seems to assume that the retail font licensing market is naturally the central business of type, and hence something that marginalises this market is a distortion. I'd counter that the retail market as we know it is a recent phenomenon, invented in the latter 20th century during the phototype period. Prior to that, the manufacturing costs led to a closer balance of custom and off-the-shelf type purchase, with even the latter necessarily calculated as an investment cost for most customers. I make my living designing custom typefaces. I don't engage in the retail market at all, and I make no apologies about that: I reject the notion that there is something normal or preferred in the retailing of fonts, or that this market deserves some kind of protection.</p>
