      <p><cite>Scholars and scholastic publishers, it seems to me, want every obscure character/glyph ever used, and if a character is not in a system font will make hacks or acquire freeware fonts made by other scholars, rather than buy fonts.</cite></p>
      <p>The scholars generally won't buy them; they'll use Gentium. But the publishers do buy fonts, and they do take glyph coverage into account, as long as someone who knows typesetting has any say in the matter. For example, one publisher I've worked for a fair amount chose Minion Pro for their house style several years ago, specifically because they need a well-integrated polytonic Greek for a lot of their books. The same logic applies to Scotch Modern, but it's also more distinctive.</p>
