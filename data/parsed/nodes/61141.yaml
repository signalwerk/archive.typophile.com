      <p>Nick—your first question is a hard one. I really don't know. Scholars and scientists are never satisfied with anything. That's why they're scholars and scientists. </p>
      <p>If I were you, I would approach the relevant linguistic institutes of larger universities, the more prestigious, the better, and tell them I can solve their transcription problems once and for all. Make a highbrow-looking type specimen, with complex texts set in languages relevant to them. Send it by ordinary mail. Give them a telephone call subsequently. If you at all can stand being a salesman. </p>
