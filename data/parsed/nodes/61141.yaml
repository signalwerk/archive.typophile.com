      <p><cite>Sorry for the distraction: Charles, are the base glyphs (such as dotlessi and dotlessj) and diacritics which need to be kerned/moved over them useful to typesetters/compositors at all? What would you like to see included in fonts?</cite></p>
      <p>If you're a "normal" typesetter, yes, you need the base glyphs. All a typesetter can do is to laboriously make up the needed characters --  much as had to be done with a macron accent in the type 1 days.</p>
      <p>At our shop, unless the occurrence of such characters is only once or twice in the job, we'll decline it if the designer insists on using a font where the EULA forbids modification. For fonts we can modify, our rule of thumb is the comps (both of them) are expected to make up such accented characters if they occur once or twice, otherwise, I'll make up the needed characters in the font, and write a ccmp feature if needed. It's all about what is fastest without leaving any little encoding or character lies in the final files.</p>
