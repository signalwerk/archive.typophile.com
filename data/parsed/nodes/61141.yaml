      <p><em>Only among individual scholars.</em></p>
      <p>That's not the scholastic market!<br>
      The primary (potential) scholastic market for fonts is not publishers, but educational institutions, and the scholars are faculty and students, who could buy (licence) the fonts they use, just as they or their institution buy the books they use.<br>
      A non-commercial licence of Brill fonts for students and faculty (assuming faculty are "non-commercial") would make Brill books a first-choice for mandatory text-books, but wouldn't Brill be ignoring a profit-centre in not charging for fonts? </p>
      <p>This is difficult to think all the way through, but one would assume that other publishers will develop their own 6000-character non-commercial scholastic fonts, to stay in the game. If their fonts aren't as good as the Brill fonts, or are "similar to", then scholars (and institutions) who haven't bought Brill books will be able to use superior quality Brill fonts and not buy Brill books.</p>
      <p>How about bundling "fonts on CD with book purchase"? That would consolidate everyone's understanding of the fonts' dual function in textbook and in student work.</p>
