      <p>Si, in our case, that would be a Euro sign… but I quite like the idea :-)</p>
      <p>James (Puckett), I hear your pain! But CE and Eastern European language support is essential. Really, Cyrillic is too. These are languages and countries that cannot be ignored. The comparison with Old Norse is not apt. Of course, official Norwegian, Icelandic, Danish, Swedish, etc., are 100% essential to support. As are the official languages of all other European countries. But archaic, unofficial languages are another matter. Of course, we'd be happy to build in special support to any of our fonts if a customer would commission that. But I don't think that Old Norse (sorry, I don't want to pick on this language too much!) publishers represent a significant portion of our customer base.</p>
      <p>It isn't just licensing to customers in Poland, Hungary, Romania, Latvia, Bulgaria, Russia, etc. It is licensing to companies down the street in Frankfurt who sell their products to consumers in those countries or do business there otherwise. I know that it might be a little different in New York, but we are long past the discussion-phase as far as these languages go. One can still decide not to support them at their peril, though.</p>
