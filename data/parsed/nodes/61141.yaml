      <p>The currency symbol (U+00A4) is a standard character in the Latin 1 character set and others; for that reason alone it should not be omitted from any font that claims to support that character set. Since the ANSI Latin 1 -- or a related codepage such as Windows CP 1252 -- is the first building block of pretty much any Latin script font, this character should be included in most fonts.</p>
      <p>If you want to be discretionary in your support of characters that are not part of 8-bit codepages, and disagree with e.g. some inclusions in the WGL4 list (which deliberately errs on the side of inclusion), that's fine. But I recommend against cutting characters that are part of 8-bit codepages, if your font is going to claim support of those codepages in the OS/2 table.</p>
