      <p><cite>But otherwise, a blanket “non-commercial” licence for Brill will effectively kill any potential scholastic market for fonts, if freeware and Adobe and Microsoft bundling haven’t already done so.</cite></p>
      <p>Actually, the Brill fonts prove the opposite. We (SIL) have a number of freely available fonts (Gentium and others) that do a reasonable job of meeting most scholars' need for linguistic Latin fonts. Brill took a good look at them, and decided that there were particular publishing needs that our fonts did not attempt to meet. So Brill decided to spend good money to hire an expert designer to spend months creating a new type family, and make them available to the publishing community. The existence of free fonts did not harm the market, but rather stimulated more commissioned work to fill in the existing gaps. </p>
      <p>This is a benefit for everyone. Scholars get a wider variety of 'standard' fonts to use for research and publishing. Brill gets great PR and goodwill, and very likely a richer base of authors. Typographers may get better-quality fonts to use when typesetting odd academic texts. Designers get more fonts to study as they try to figure out what rather odd letters are 'supposed' to look like. Overall, the typographic quality of academic publications gets a boost.</p>
      <p>Neither the Brill fonts, or ours, will meet all the needs. There will still be room for more work by professional designers. There may even be increased demand, as other publishers want to get into the game, and as the academic community grows in their appreciation for fine typography and fine type design.</p>
      <p>I never used to spend money on beer - a result of growing up around mediocre American stuff. I didn't even like it when it was free at a party. After a few friends here in England bought me pints of English Real Ale, I got used to how good a beer could get, and now find myself making special visits to my favourite brewery. A free bit of the Good Stuff can develop a habit of paying for more of it.</p>
