      <p>Old Norse never really died out, as long as the written language is still understood by speakers of Icelandic and to a great extent Faeroese (even Norwegians and I think Swedes and Danes get the general idea when reading it, but the complex grammar is largely incomprehensible without some education). Written Icelandic is virtually indistinguishable from Old Norse, though the pronunciation is quite different and the vocabulary is vastly increased, almost exclusively building on Norse roots, not by importing loanwords. There is a huge body of literature written in Old Norse, the Kings' sagas (including the great works of Snorri Sturluson) and the Icelanders' sagas probably the most read today. These are still printed in their original language or in bilingual versions. I own several of them.<br>
      Old Norse is still taught in the Norwegian equivalent of high school (at least, it was when I attended).<br>
      There are several web pages containing Old Norse texts, most of them suffer for lack of proper glyph support. </p>
      <p><a class="freelinking external" href="http://etext.old.no" rel="nofollow">Just</a><br>
      <a class="freelinking external" href="http://www.northvegr.org/language.php#norse" rel="nofollow">some</a><br>
      <a class="freelinking external" href="http://www.onp.hum.ku.dk/litindex.html" rel="nofollow">very quick</a><br>
      <a class="freelinking external" href="http://en.wikisource.org/wiki/Poetic_Edda/V%C3%B6lusp%C3%A1_I" rel="nofollow">links</a></p>
      <p>A Google search of "hljoðs bið ek allar", the opening stanza of Voluspá in normalised Old Norse ortography, returns 927 hits, while a Google search for "Mieleni minun tekevi aivoni ajattelevi", the opening stanza of the Finnish national epos Kalevala, written in modern Finnish, returns 1200 hits.</p>
