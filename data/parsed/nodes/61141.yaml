      <p>AEacute/aeacute and Oslashacute/oslashacute is used for modern scholarly transcription of Old Norse and Old Icelandic, marking distinctive opposition by quantity. The latter pair replaces the earlier OEacute/oeacute usage. Old Norse is still read and written by scholars and enthusiasts (myself included), and speakers of Icelandic and Faeroese (to some extent) can read it untranslated. </p>
