    html: |-
      <p>&gt; I am not sure I understand completely how soft<br>
      &gt; returns and stanza breaks would work</p>
      <p>Are you currently separating stanzas by inserting a blank line?  That technique has some disadvantages. Suppose you decide later to change the spacing between stanzas. You'd have to go back and individually select and change each blank line. Or you could select all the text and change the spacing, but unfortunately that would change the spacing of all lines, not just the blank lines.</p>
      <p>A better technique is to treat each stanza as a separate paragraph, use space before (or space after) in paragraph styles. That way in a few seconds you can globally adjust the spacing between all the stanzas without that affecting the space between individual lines. </p>
      <p>Another advantage of eliminating blank lines is that you won't accidentally end up with a blank line at the top of a column.</p>
      <p>Since each stanza is one paragraph, if you want to manually insert a line break within a stanza you'd use a soft break (Shift + Return). A soft break tells the application that you want a line break but you're not starting a new paragraph.</p>
