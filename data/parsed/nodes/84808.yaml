    <p>Hello All</p>
    <p>This is my first post and I have read through posting guidelines and threads about students and questions and was weighing up whether to still post. I decided to as I would value any input, not just for coursework, but also because I am genuinly interested in typography and the knowledge and experience that is available as part of this community.</p>
    <p>Anyway, here goes.  I have a piece of coursework where I have to lay out the first pages of a book.  I can choose what kind of book and would like to use poetry, specifically by the Sufi 12th Century poet Rumi. Although I have done a lot of research and have books on type and book design, I would like to see how others feel about this. My reason for choosing poetry is that it needs a different treatment to a text book, a novel or similar. Also it is something that inspires me and I would like to do it with as much care as possible. My reason for posting is that although I have been able to find some information about poetry, as opposed to prose, I would really welcome a discussion of this with any interested parties.</p>
    <p>I have looked at various typefaces and narrowed it down to Jenson, Bembo, Bodoni, Adobe Caslon and Goudy Old Style. After looking at various things such as the tail on the upper-case Q and the lower case gs I decided to go with Goudy Old Style, which I realise some may find slightly out of date, or hackneyed. </p>
    <p>I am also interested in using page margins that have the left page margin largest on the outside and the right page margin largest on the inside. My book will be 6 1/2 x 4 1/2.  I intend to put the folios at the bottom and centred.</p>
    <p>Anyway, I am really interested in opinions about setting poetry and the differences that there might be for this.  I would like to use upper case for the titles, but maybe in a small caps version.</p>
    <p>Thank you for reading</p>
    <p>Kathy</p>
