      <p>Very nice. I have set an entire <a class="freelinking external" href="http://www.amazon.com/Last-Days-Keats-Other-Poems/dp/0578005530" rel="nofollow">poetry book</a> in Arno Pro, and it worked nicely. Caslon is also a good possibility, though maybe look at other versions, like Williams Caslon. Also, have you thought about using less than a full blank line between stanzas? The break is looking a little large, I think (or are you using more than a full line space already?). You may also want to differentiate the titles a little more with size or some other form of emphasis. And think about making the space after the title larger than the stanza breaks. Actually, with more space, the titles as you've designed them might work fine. For more feedback, it would be helpful if you could link to or upload a PDF.</p>
      <p>Edited to add some more thoughts: I'm not a fan of the swash caps in the last example. Also, have you looked at other similar Slimbach faces, like Warnock (very different, a bit spiky), Brioso (very calligraphic), or Garamond Premier Pro? All of these could be used quite well for poetry, I think, depending on the feel you're looking for.</p>
