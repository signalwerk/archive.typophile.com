      <p>"Apply leading to entire paragraphs" …</p>
      <p>But since in the case of poetry each line constitutes a "paragraph," this wouldn't make a difference. Unless, of course, you end each line with a soft return, which is actually a handy thing to do, since you can then specify stanza breaks as before/after paragraph spaces. This avoids ending up with blank lines at the tops of pages, and makes it easier to change them all at once.</p>
