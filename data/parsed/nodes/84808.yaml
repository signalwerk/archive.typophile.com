      <p>I don't know how this will be printed, or what size the type, but I suspect that Goudy Old Style, in the digital versions available, may be too refined and hence too precious for Rumi. It would tend to sentimentalize and not be "old" enough.</p>
      <p>Bear in mind that it is one of the earlier classic old style faces to be digitized, and, based on intermediate sizes, is thus a bit emaciated at usual text sizes, due to the lack of "press gain" — i.e. as if it had been printed letterpress on coated stock.</p>
