      <p>Hi Kathy</p>
      <p>Most of what is written in typography textbooks about setting poetry concerns the need to distinguish it from any surrounding prose – see <a href="http://webtypography.net/Rhythm_and_Proportion/Blocks_and_Paragraphs/2.3.4/" rel="nofollow">Bringhurst 2.3.4 Indent or center verse quotations.</a></p>
      <p>Most verse in my view, is set pretty open and generously-leaded, perhaps sometimes just to make the minimum extent that would justify a bound volume, however slim. </p>
      <p>But you have a whole book to set (albeit not a very big one?) so, having arrived at the decisions you mention re: page size, margins, position of folios, typeface choice etc. the only thing to do is to try it out... set the pages and see what you get <em>en masse</em>. Test the design by getting other people to read it and tell you their responses. Don't forget the title pages and prelims.</p>
