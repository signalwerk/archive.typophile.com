    <p>Do you know if it's possible to move a post from one category to another?</p>
    <p>Actually my post is in the release category, but I have no longer released the display font, so now I want to create a new post for the font in the Display section to get opinions, critics and suggestions of all the users.</p>
    <p>Thank you.<br>
    Best Regards.</p>
