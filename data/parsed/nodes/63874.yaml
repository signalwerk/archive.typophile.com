      <p>An exception to what I mentioned about spacing from the Penguin Guide to Punctuation:</p>
      <p><cite>...in the rare case in which a sentence is broken off abruptly without being completed, a single dash is also used:</cite></p>
      <p><cite> General Sedgwick's last words to his worried staff were<br>
        'Don't worry boys; they couldn't hit an elephant from this dist—'.</cite></p>
      <p><cite><strong>Note that, in this case, the dash is written solid next to the unfinished piece-of-a-word which precedes it.</strong></cite></p>
