      <p>When typsetting a book, or a text in a paragraph document, I prefer en dashes, in dialogues or in the middle of a sentence. Like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dashes01_3778.jpg"></div><p></p>
      <p>The same text with em dahses looks weird. The em dashes are too wide (it also depends on the the typeface you're using), and deleting the blank spaces doesn't help:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dashes02_5863.jpg"></div><p></p>
      <p>In names and numerals/dates, I prefer using the hyphen, without blank spaces, instead of en dash; for the same reason: en dash in this case looks too wide:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dashes03_4612.jpg"></div><p></p>
