      <p><em>Am I right in remembering English style train of thought is interrupted by space-en dash-space, while Americans interrupt using the em dash solus (w/o spaces)?</em></p>
      <p>That is certainly what I do in documents – described in Bringhurst as ‘a phrase marker’ in a sentence with normal word spaces. I have seldom used an em dash except when I found the en dash too narrow.</p>
      <p>However, to indicate 17–20 March (meaning something runs from 17th until 20th March inclusive) I use an en with no spaces. For a date as numerals I would use 17/05/09 although that might change if using non-aligning numerals as here.</p>
      <p>Bringhurst also mentions the three-to-em dash (which I have never used), he also gives a pithy criticism of the em dash as belonging in “the padded and corseted aesthetic of Victorian typography”.</p>
      <p>Tim</p>
