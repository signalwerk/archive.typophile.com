      <p><em>for example in a date do i use emdash or endash ” 17-05-09”</em></p>
      <p>In this case I would use neither, instead use a regular dash, or if you can, a figure dash.</p>
      <p><em>also for example on a poster say an expo runs from 17 “until” 20 march 2009 (meaning that actualy the expo ends on 19 march. do you use en or emdash between “17 and 20”)</em></p>
      <p>Here you would use an en dash. En dashes are used anytime you have something in a range (times, dates, etc.).</p>
      <p>As far as em dashes go, you use them mostly in body text when interrupting a train of thought.</p>
      <p>Patrick</p>
