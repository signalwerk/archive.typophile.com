    <p>hello everyone,</p>
    <p>i was wondering if maybe someone could explain how en when to use the em and endash correctly. i remember reading somewhere that they both have different functions.</p>
    <p>for example in a date do i use emdash or endash " 17-05-09"</p>
    <p>also for example on a poster say an expo runs from 17 "until" 20 march 2009 (meaning that actualy the expo ends on 19 march. do you use en or emdash between "17 and 20")</p>
    <p>here in holland for dates they have "tot" and "tot en met" meaning "till" and "till together with the date listed" ...</p>
    <p>don't know if i'm explaing it wright, hope you guys kind of understand what i mean here :D</p>
    <p>thnx so much in advance everyone</p>
