    html: <p>That logo is pretty old. I'd say it was almost certainly custom designed and I can't think of any fonts which look exactly like it. If you're just looking for something with a similar feel, <a href="http://www.myfonts.com/fonts/linotype/itc-novarese/ultra/testdrive.html?s=NASA&amp;p=48" target="_blank">Novarese Ultra</a> might work.</p>
