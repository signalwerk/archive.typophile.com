      <p>OK, Hrant, I’ve got to get my Baltimore pride on…</p>
      <p>That was <a href="http://en.wikipedia.org/wiki/Mencken">H.L. Mencken</a> (after whom JFP named the new typefaces for the Baltimore Sun). Mencken wasn’t the paper’s founder (the paper dates back to at least the early 1800s). He was an editor during the first half of the 20th century, and was one of the centuries most influential american writers and journalists.</p>
      <p>He suggested the irony slant be added to the Linotype machine’s (?) offering of faces, because he saw Americans as being incapable of understanding humor.</p>
