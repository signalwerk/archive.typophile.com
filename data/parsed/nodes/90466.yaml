    <p>Does anyone have Typographica volume 16? It was released about 1959 from what I understand.I'm particularly interested in this article: Modern hebrew typefaces, Henri Friedlaender. If you have it, would you be willing to take pictures of or scan those spreads? :) I'd willing to offer some modest compensation if that's necessary.</p>
    <p>I have found copies for sale around $150 US, which is a little more than I'd like to unpocket at this point.</p>
