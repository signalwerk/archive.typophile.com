  html: <p>The wood printing type exhibition, "WANTED.  WOOD TYPE.  AN AMERICAN <br>ORIGINAL", is now (mostly) up at the Paul V. Galvin Library at the Illinois <br>Institute of Technology in Chicago in the Kemper Room (upstairs).  If anyone <br>is in the area feel free to stop by and take a peek at it.  There are still <br>a few pieces that haven't arrived yet (read eBay purchases), but they should <br>be up soon. <br> <br>I want to thank the Hamilton Wood Type and Printing Museum for loaning a <br>beautiful number 2 that is 150 lines tall and Ed Regan for loaning some 72 <br>and 100 line type. <br> <br>The exhibition poster can be viewed at <br><a href="http://alexia.lis.uiuc.edu/~golden/woodtypepostercolor.jpg" target="_top">http://alexia.lis.uiuc.edu/~golden/woodtypepostercolor.jpg</a> <br><a href="http://alexia.lis.uiuc.edu/~golden/woodtypeposterblack.jpg" target="_top">http://alexia.lis.uiuc.edu/~golden/woodtypeposterblack.jpg</a> <br> <br>I hope to make a few more photos available later this week. <br> <br>I printed up extras of both of these posters.  If you are interested in <br>purchasing one, drop be an e-mail directly.  The money <br>will go towards purchasing more wood type.  You just can't have enough of <br>the stuff. <br> <br>Vincent Golden <br>IIT - Paul V. Galvin Library <br>35 W. 33rd St. <br>Chicago, IL  60616 <br>312-567-6843 <br><a href="mailto:golden@iit.edu">golden@iit.edu</a></p>
