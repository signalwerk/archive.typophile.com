  html: <p>Elbowruminations is a graphic design blog for non-designers, businesspeople and designers, maintained by <a href="http://www.elbowroomdesign.com" rel="nofollow">Elbowroom Design</a>. Based in Calgary, Alberta, this blog <a href="//www.elbowroomdesign.com/musings/category/aroundcalgary/”" rel="nofollow">critiques good and bad graphic design</a>, spotlights <a href="http://www.elbowroomdesign.com/musings/category/technology" rel="nofollow">new technology</a> and <a href="http://www.elbowroomdesign.com/musings/category/blogs/" rel="nofollow">great blogs</a>, and encourages <a href="http://www.elbowroomdesign.com/musings/category/features/" rel="nofollow">creativity in business</a>. Elbowruminations aims to be a thorough and thoughtful resource for designers and non-designers alike.</p>
  html_clean: <p>Elbowruminations is a graphic design blog for non-designers, businesspeople and designers, maintained by <a href="http://www.elbowroomdesign.com" rel="nofollow" class="link-external">Elbowroom Design</a>. Based in Calgary, Alberta, this blog <a href="//www.elbowroomdesign.com/musings/category/aroundcalgary/”" rel="nofollow" class="link-external">critiques good and bad graphic design</a>, spotlights <a href="http://www.elbowroomdesign.com/musings/category/technology" rel="nofollow" class="link-external">new technology</a> and <a href="http://www.elbowroomdesign.com/musings/category/blogs/" rel="nofollow" class="link-external">great blogs</a>, and encourages <a href="http://www.elbowroomdesign.com/musings/category/features/" rel="nofollow" class="link-external">creativity in business</a>. Elbowruminations aims to be a thorough and thoughtful resource for designers and non-designers alike.</p>
