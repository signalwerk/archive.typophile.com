  html: |-
    <p>This is some lettering for a church sign. It was installed many years ago, and over time, they lost some of the letters. They replaced them with a different font, but decided they wanted to revert back to this one. However, nobody knows what font it is.<br>
    I’m having trouble finding a font that matches the “R” and the numbers.</p>
    <p>Any help would be greatly appreciated!</p>
    <p>In the second picture, it's the serif font, not the sans serif numbers on the right.</p>
