    <p>Hello</p>
    <p>My name is Siaron Hughes, and I'm a graphic designer. I re-trained by studying<br>
    a Graphics MA at London College of Communication 2006-2007, gaining a Distinction.<br>
    I'm having a book published, and it will be in the shops in mid-Feb. The subject<br>
    is on the rhetoric of fast food and dirty chicken shops.</p>
    <p>Published by <a href="http://www.markbattypublisher.com/" title="www.markbattypublisher.com/">www.markbattypublisher.com/</a> in NYC.</p>
    <p>I'd be really grateful for any feedback or advise on my book, please see some<br>
    spreads below.</p>
    <p>Many thanks<br>
    Siaron</p>
