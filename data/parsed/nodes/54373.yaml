      <p>Normally, when I look at book covers from a far (at bookstore racks, for example), I focus on the visual/image/logo first. As I get closer, my eyes definitely scans from top-left to bottom-right.</p>
      <p>You could try putting the book's title below the logo, IMHO.<br>
      Without aligning it to the image's curve.</p>
      <p>Your logo's outmost outline is bolder than the book title.<br>
      I found that a bit distracting.<br>
      Try blurring your eye while looking at your attached image. :)</p>
