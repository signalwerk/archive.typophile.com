    <p>This is inspired by previous threads like <a href="http://typophile.com/node/34363" target="_blank" rel="nofollow">proper placement of exclamdown and questiondown</a>, especially Eben's recent remark, and <a href="http://typophile.com/node/33045" target="_blank" rel="nofollow">guillemets in English text</a>.</p>
    <p>On the one hand there are recommendations for proper shapes of glyphs or accents <cite>rooted in language specific typography</cite>. On the other hand growing glyph sets of OpenType fonts and <cite>international use of fonts</cite> suggest that one better find shapes which please everybody, or at least, an imaginary majority.<br>
    It is not that much of a contradiction as my words suggest -- one can still add alternate forms. Yet I think that these will only address specific languages (so fonts are just as suited for <cite>particular</cite> languages as the individual type designer's knowledge goes) and add complexity to fonts.<br>
    (My own current position is that one should go for internationalization of forms and give up certain national peculiarities.)</p>
    <p>I would like to hear your opinions on ...</p>
    <p>-- proper positioning of acute and grave: rather steep and start at the horizontal visual center on the base glyph? rather flat and lying on the base glyph?<br>
    -- vertical alignment of accents: vertically centered? their x-minimums aligned?<br>
    -- proper shape of the uppercase Aring: (traditional) connected form? unconnected since Uring joined the glyph set so that it makes sense to treat them similarly (rather than connecting one but not the other)?<br>
    -- ogoneks and cedillas: connected? unconnected?</p>
    <p>... and others!</p>
