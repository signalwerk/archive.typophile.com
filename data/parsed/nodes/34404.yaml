      <p>I think you can do it many ways Karsten, but not in the same typeface.</p>
      <p>For instance, a small x-height face may have steeper accents.</p>
      <p>Also, the ogonek is nice extended to descender depth, but not in faces with long descenders, or heavy sans serifs -- it becomes too big.</p>
      <p>Then you have to decide how to relate the vertical position of the dot on the "i" with the dieresis.</p>
      <p>If I see any principle, it's the old design one that if things are close to concurring, they should, otherwise they should obviously not. With a little "cheating" allowed.</p>
      <p>So my principle is that the accents should look good for the typeface, not for a particular language.</p>
      <p>It's up to the specific language users (typographers, editors, clients, readers) to decide whether the face is smooth or awkward in a specific setting.</p>
