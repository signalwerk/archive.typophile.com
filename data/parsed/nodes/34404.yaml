      <p><em>This is a good rule for display design, but for text it’s too Modernist.</em></p>
      <p>I think you have to do things the modern way if the face is modern, rather than old style. But you have a good point. </p>
      <p>At the moment, my "dasia and varia" polytonic characters have the dasia the same size as when it's the only diacritic (centre, below). This is the common practice today. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/dasia_5554.jpg"></div><p></p>
      <p>Top: Plain typeface (Monotype, early 20th century). The "curly" mark is a different size in all combinations.<br>
      Centre: My modern, with first two dasia "curly" marks the same height.<br>
      Bottom: My modern, with the dasia in "dasia and varia" the same size as the psili in "psili with perispomeni".</p>
      <p>But I'm now thinking that the bottom option is better. What do you think?</p>
