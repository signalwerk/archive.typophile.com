  html: |-
    <p>Hi all,</p>
    <p>I'm working on a logo for a company and it's looking likely that they'll go for Meta Serif as their brand face but I need to find a sans serif partner which will work well with Meta Serif (for use in body copy, not the logo itself). I realize Meta Serif is designed to work with Meta but they're not keen on the overuse of that typeface.</p>
    <p>Can anyone suggest any other sans serifs that will work with Meta Serif.</p>
    <p>Thanks!<br>
    Tim.</p>
