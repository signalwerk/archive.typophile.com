    html: <p>Mine too! I love the italic k.  <br> <br>But I recently used it for a project and the roman turned out a little light even though I printed on uncoated stock. <br> <br>The printer's "inkjet" proofs were lovely though. <br> <br>I don't think I'll ever understand printing. I thought the uncoated paper would make it nice and earthly. It wasn't that thin a font to begin with. <br> <br>Anyone know why this happens?</p>
