    html: <p>Luc(as) de Groot designed TheAntiqua because he was <br>appalled at how often he saw TheSerif used for long text. <br> <br>But I used TheSerif as the text font for 4 years in a student  <br>magazine and it worked very well. The rag was printed on  <br>bad newsprint so it performed better than most types  <br>would. Maybe if the company you're working for is printing  <br>a lot of glossy stuff it might be too stark, but I wouldn't  <br>flatly recommend against it. It depends more on the <br>personality of the company.  <br> <br>But give TheAntiqua and PMN Caecilia a try. <br> <br>Your user icon is very pretty, btw, PD.</p>
