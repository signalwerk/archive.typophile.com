    html: <p>Karen on press they can control the amount of ink and vary it across the sheet. The hardness of the uncoated makes alot of difference. I've run 4 color on a linen finish paper and the ink sits right on top like a coated paper. Why because when you make Linen finished paper they press the finish between two drums and create a hard surface. </p>
