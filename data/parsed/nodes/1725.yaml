  html: "<p>I'm working on a corporate branding project for a major forestry association in British Columbia, and right now I'm using DIN as a primary typeface with The Serif for secondary usage. <br> <br>My question is: in the experienced opinions here, is The Serif suitable for body text? I think it's a lot better than the sans serif faces that some companies use for long copy, but if there are other suggestions, I'll hear them. <br> <br>Paul</p>"
