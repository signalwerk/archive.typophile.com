    html: |-
      <p>Apparently not the first time someone has digitized this design. Steve Jackaman claims he saw an Adrian Williams typeface like this. If so, Adrian must have found inspiration in Alf Becker's book. See Red Rooster's <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/saint-louis-rr/" rel="nofollow">Saint Louis</a>. I notice the 'a' is a different style, but otherwise the resemblance is startling.</p>
      <p>- Mike Yanega</p>
