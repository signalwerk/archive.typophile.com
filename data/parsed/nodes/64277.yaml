      <p>That is Chicago Modern, Alf Beckers 44th demonstration lettering from <em> Signs of the Times</em> magazine from August of 1935. It is available in digital format from MyFonts at...<br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/fontry/arb-44-chicago-modern/" rel="nofollow">http://new.myfonts.com/fonts/fontry/arb-44-chicago-modern/</a></p>
      <p>or <a class="freelinking external" href="http://www.thefontry.com" rel="nofollow"><em>...from the Fontry </em></a></p>
