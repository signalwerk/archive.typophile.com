    html: <p>Bingo. Markham appears to be Adobe Bickham Script Swash Caps. <br><br>I have to attribute this <span class="caps">ID</span> to <span class="caps">RF</span> on the MyFonts forum, but … he/she <br>only said Bickham Script <span class="caps">MM</span>. It took a lot of hunting to ﬁnd a view of <br>the Swash Caps font. <br><br>Forget about <a href="http://www.adobe.com/type/browser/P/P_1421.jhtml" target="_blank"> Adobe’s</a> own site. I guess now that they don’t support <br>the Multiple Master technology any more, the <span class="caps">MM</span> fonts went out the <br>window? <br><br>Forget also Phils Fonts and <a href="http://www.fonts.com/findfonts/detail.asp?pid=408351" target="_blank"> Fonts.com</a>. <a href="http://www.veer.com/results.asp?image=ADT0000435" target="_blank"> Veer</a> appears to carry the <br>Swash Caps font, but doesn’t show it to us (sorry Grant, but Veer’s <br>previews leave much unseen). <br><br>I ﬁnally turned to the resource we know and&nbsp;love </p>
