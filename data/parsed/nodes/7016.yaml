    html: <p>On that note Yves, I went to a free font site and saw something called Hannible Lecture which was a direct rip-off of Cezanne, I contacted P22 and they of course were on top of it. It turns out that the guy who has the free font site touts himself to be a big time Christian and Richard's comment to me was it isn't a very Christian thing to do to promote ripping off other peoples intellectual property. FYI</p>
