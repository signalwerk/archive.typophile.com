      <p>Tough riddle. Not quite Permanent though.<br>
      Some caps are similar to “Normal Grotesk” which was a design cast by many foundries pre ww2 under different names like Edel-Grotesk, Aurora, Favourit etc, at least in metal.</p>
      <p>In fact, the type looks rather handmade, the figures even like not really belonging to the rest, the 3’s differ quite a bit. (The 2 feels very Nebiolo.)</p>
      <p>Would be easier with lowercase. Or do you have any rough information about age and where it comes from?</p>
