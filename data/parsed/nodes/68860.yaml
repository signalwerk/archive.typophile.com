    html: |-
      <p>According to Jaspert, Berry &amp; Johnson's <em>Encyclopaedia of Typefaces</em>, 4ed, 1970, kupfers Permanent specimen is labelled Medium and seems somewhat lighter in colour than Dash_X's specimen. Permanent Bold is definitely darker and the numerals are all notably narrower. It might be helpful to see the lower case alphabet. The specimen's letters that have rounded strokes seem a little squarish. Perhaps that is why kupfers showed us Normal Grotesk. The irregularities are quite intriguing.</p>
      <p>Permanent was designed by German calligrapher <a class="freelinking external" href="http://www.kghoefer.de/English/KgHoefer_Typefaces.html" rel="nofollow">Karlgeorg Hoefer</a>, also known for the Monsun (Monsoon) display face from Klingspor and script faces Elegance (Ludwig &amp; Mayer), Saltino and Salto (Klingspor) and the curious tinted Zebra from Stempel among others.</p>
      <p>I couldn't find another similar typeface amongst those displayed in the EoT quite like the specimen fount.</p>
      <p>PS kupfers: your kupferschrift.de is a very interesting web site, I'm glad you also write in English, my German is practically non-existent. Thanks for sharing.</p>
