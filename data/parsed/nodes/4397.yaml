      <p>From the Wikipedia: </p>
      <p>***<br>
      The word nerd gained currency from the 1950s at a time when many school students did not see excelling at school as "cool". Therefore nerd originated as a derogatory word (although some people now consider it a compliment), while the term geek became widespread later (1980s) and has avoided many of the negative connotations. Geek as a milder version of nerd may also apply to socially insignificant people, while nerd refers more to socially inept people.</p>
      <p>Pundits and observers dispute the relationship of the terms nerd and geek to one another. Some view the geek as a less technically skilled nerd. Some factions maintain that "nerds" have both technical skills and social competence, whereas geeks display technical skills while socially incompetent; others hold an exactly reversed view, with geek serving as the socially competent counterpart of the socially incompetent nerd, and call themselves geeks with pride.</p>
      <p>Some regional differences may exist in the use of the words nerd and geek. Some claim that on the North American west coast the population prefers the term geek to nerd, while the North American east coast prefers the word nerd to geek. Others on the east coast dispute this, claiming that they have always found nerd used disparagingly and geek used in a positive light. In Britain, this latter view tends to apply — nerd has more offensive connotations than geek, which speakers of British English often use affectionately. Compare anorak.<br>
      ***</p>
