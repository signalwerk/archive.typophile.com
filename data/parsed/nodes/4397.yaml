    votes: null
    html: |-
      <p>My friend is a good semi-pro photographer. I would not call him a photography nerd, though photography is one of his common topics of conversation, and he spends alot of time on it. Most people enjoy a good photograph, even though they may not understand all the technical details, and many people take photographs themselves.</p>
      <p>Someone who designs typefaces, for fun or professionally, is in a different position to a photographer. Most people cannot see what the fuss is about. Almost any serif text typeface looks like Times Roman to the untrained eye.</p>
      <p>This means that a consuming interest in type as such is most definitely nerdish. Nothing wrong with that, I say, except that it is not conducive to light conversation:</p>
      <p><em>Freind at the pub:</em> "So, what did you do last weekend?"</p>
      <p><em>Type nerd:</em> "I designed a nice letter 'g'. It was particularly well thought of."</p>
      <p><em>Friend:</em> "Oh. Hmmm..."</p>
      <p><em>Type nerd:</em> "Can I get you a pint?"</p>
