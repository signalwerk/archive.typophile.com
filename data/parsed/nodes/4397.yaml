      <p>From the Wikipedia:</p>
      <p>A geek is a person who is fascinated, perhaps obsessively, by obscure or very specific areas of knowledge and imagination. Geek may not always have the same meaning as the term nerd (see nerd for a discussion of the disputed relation between the terms).</p>
      <p>The definition of geek has changed considerably over the years. Below are some definitions of the word "geek", in order from newer to oldest. All are still in use.</p>
      <p>A person with an encyclopaedic knowledge of random trivia especially those bordering on the highly obscure. Trivia geeks are often also known as ubergeeks.<br>
      A person who is interested in technology, especially computing and new media. Comparable with the classic definition of hacker. Late 20th century and early 21st century<br>
      A person with a devotion to something in a way that places him or her outside the mainstream. This could be due to the intensity, depth, or subject of their interest. This definition is very broad, and allows for mathematics geeks, band geeks, computer geeks, politics geeks, geography geeks, geeks of the natural sciences, music geeks, history geeks, Good Eats geeks (Briners), linguistics geeks, sports geeks, figure skating geeks, SCA geeks, gaming geeks, typography geeks, ham radio geeks, public transit geeks (metrophiles), anime and manga geeks (otaku), Stargate geeks (Stargate SG-1/Atlantis fans, Gaters), Buffy the Vampire Slayer and Angel geeks, Star Wars geeks, Star Trek geeks (Trekkie), Tolkien or fantasy geeks (Tolkienite), geeks of many colours, genders, and styles, and last but not least, Wikipedia geeks. Late 20th Century and early 21st century<br>
      G.E.E.K. as an acronym came from the United States Military. It stands for General Electrical Engineering Knowledge. It is unclear if this was the origin of the current meaning for geek, or if the acronym was used in a joking way toward the pre-established meaning for geek (a backronym).<br>
      A person who swallows live animals, bugs, etc., as a form of entertainment at fairs etc. This often included biting the heads off of chickens. The Geek would usually perform in a "geek pit." This probably comes from the Scottish geck, meaning 'fool', in turn from Low German. 19th century</p>
