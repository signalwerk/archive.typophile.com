    <p>Found these letters in "Philadelphia" on the title page of an old book. The page was printed in one color letterpress.</p>
    <p>The letterforms reminded me of some that I saw in Hill's Manual of Business Forms. There are 2 versions of what Thos Hill called "Brush Letters". I've included them for reference in case it helps, but I'm really looking for the name of the typeface used to print this word "Philadelphia"</p>
    <p>Any help or leads of any kind are welcome and appreciated.</p>
    <p>All my best,<br>
    –Nic</p><div class="imageWrap"><img src="http://typophile.com/files/Philadelphia_6546.JPG"></div><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-06-18 at 11_6722.47.40 AM.png"></div><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2013-06-18 at 11_5460.47.54 AM.png"></div><p></p>
