  html: |-
    <p>Hello,</p>
    <p>We are grateful for the world-ready composer in CS4, which allows one to set Indic unicode fonts, and grateful to Thomas Phinney for revealing how to activate it. </p>
    <p>Has any additional functionality been added in CS5—like, for instance, page numbers in whatever script one wants?</p>
    <p>(Previous thread on CS4 and Indic scripts <a href="/wiki/Does%20Indesign%20CS4%20support%20Indic%20scripts%3F" class="freelinking" rel="nofollow">here</a>.)</p>
    <p>—D</p>
