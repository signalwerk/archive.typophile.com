    html: |-
      <p>I'm liking it.<br>
      I also noticed the optical shift in points on the 'u' (and other similar glyphs), as sgh describes. But this can easily be fixed, by making it optically aligned.<br>
      I like the 'g', but I can also imagine that for some people it might be distracting. You could always create two g's, as an alternate or something. Or just ignore it. ;)<br>
      The horizontal join of the 'k' works well, but I usually like that a lot. Reminiscent of Smijers, which is a good thing.<br>
      I am not really bothered by the 'X'. The 'z' might be a bit wide, but that is probably a matter of taste.</p>
