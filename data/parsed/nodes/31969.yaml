      <p>Thank you all for you comments.</p>
      <p>Alessandro: Out of key? I don't understand. You say the diacritics should be stronger and bigger and I can see what you mean there. Wider 't', yes, but a more heavy 'X' - really? Would others care to comment on that?</p>
      <p>Chris: The shape of the 'g' is part due to my danish heritage, where that shape has become somewhat of a Danish trait in typedesign, and partly because the decender lenght is so short that any other shape is hard to squeese in - but I'll try again :-)</p>
      <p>Brett: Thanks. Perhaps it IS too fat to be called medium, I will compare to others... And yes I'm planning to do a super-family out of it, but I'm taking one step at a time, even though I have started a black weight just to see what happens.</p>
