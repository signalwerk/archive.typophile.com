    <p>Hello dear Typophiles<br>
    Kulby is a humanist sans I'm currently working on. It's purpose is to be legible at small sizes, yet still be harmonic and not disturbing at larger sizes. Therefore I have avoided ink-traps and other more or less extreme compensations for setting small.</p>
    <p>It's is my first attempt at making a 'real' typeface, but please give it all you got, I want it to become good ;-)</p>
    <p>The two things that are the most difficult for me to spot now after working with it, are the widths of the characters and the character colour (stroke weight).</p>
    <p>Many thanks<br>
    Claus Eggers Sørensen</p>
