      <p>Hi there<br>
      I have made some modifications to the face per your comments. S, s, C and c have been opened up slightly. The way the curve meets the stem in n and related characters have been optically corrected. And finally the diacritics have been beefed up considerably. There is still a problem in getting room for the lower comma-accents, and I not quite sure what to do there. The X have been changed, and the g is now a two storey shape, let me know what you think about that one compared to the previous shape.</p>
