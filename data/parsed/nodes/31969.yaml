      <p>Kulby is very nice--well-balanced and legible.  I like the g and think it fits in well with the other characters, but to me it creates an impression that the bottom stroke has been cut off (as if the line below is overwriting the g).</p>
      <p>I have two suggestions:  First, the top right stroke of the S and s seem to be pointing too much downward.  Second, there appears to be an optical illusion in the "notch" of the u: because of the curved stroke, the point B seems to be to the left of the point A.  This can also be seen in the d and a.  It seems to be less prevalent in the n,m,p,etc---maybe because the curved stroke is just starting there and doesn't have as much "motion"?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Kulby_u_6398.png"></div><p></p>
