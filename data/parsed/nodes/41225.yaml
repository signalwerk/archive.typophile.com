    html: <p>You are right it is Helvetica neue. At this point I am not sure how the small caps are accomplished. You all think it is ugly. Please look at the sample I have attached here. Does anyone know of a Font family that has a structure/feel like this. I am hoping for one that feels a little more refined than the sample.  I feel like I have seen one/some like it, but I can't seem to locate what I am imagining. And yes,  NBC has been doing a nice job in their promotions with Klavika, I agree. jhouff</p><div class="imageWrap"><img src="http://typophile.com/files/grandezza_4034.jpg"></div><p></p>
