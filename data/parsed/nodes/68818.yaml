    <p>I did some concept drawings for my "art studio/company". The name Eggroll Industries dates back to high school and my nickname is Eggroll. </p>
    <p>I want it to look a little retro/artsy and simple so it won't detract from my art. I didn't buy the font yet so I can't provide larger examples. These are all roughs. I think the finished version I'm going to use a scanner technique or print them so it has a screened poster feeling.</p>
    <p>I'm using a costume to brand myself. You can see a photo I took of me in it...long explanation.</p>
    <p>Anyways, feedback welcome!</p>
    <p>Thanks</p>
