    <div class="info">Submitted by <a href="/user/1160" title="View user profile.">Joe Pemberton</a> : 10.Nov.2003 3.52pm </div>
      <p><b>P22 Operina</b> <br> <br><img src="http://www.typophile.com/forums/messages/72/20220.gif" alt=""> <br> <br>Operina is based on a 16th-century lettering model of the scribe Ludovico <br>degli Arrighi used in his 1522 instructional lettering book, "La Operina da <br>Imparare di scrivere littera Cancellarescha." This book contains what is <br>considered to be the earliest printed examples of Chancery Cursive. <br> <br>There are three fonts in this set that range from simple italic lettering to <br>rather ornate swash calligraphy. Letters from all three fonts can be used <br>interchangeably to create just the right style for your needs. We know <br>you'll find good uses for Operina for invitations to special events, <br>arts programs, restaurant menus, and more--we look forward to seeing them! <br> <br>See the fonts at: <br><a href="http://www.p22.com/ihof/operinaset.html" target="_blank">http://www.p22.com/ihof/operinaset.html</a> <br> <br>Download sample pdf: <br><a href="http://www.p22.com/ihof/files/P22OperinaSample2.pdf" target="_blank">http://www.p22.com/ihof/files/P22OperinaSample2.pdf</a></p>
