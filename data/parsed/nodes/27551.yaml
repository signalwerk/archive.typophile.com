      <p>"But as far as I know most top level URLs, the ones mentioned on ads, do start with ‘www’."</p>
      <p>That's a completely arbitrary thing most of the time. It's just an old habit. And if the old habit is 'ugly' then the solution, IMHO, is to drop it. And I do see a lot more folks dropping the www. in their marketing. Off the top of my head, my 4 year old walks around the house singing 'pbs kids dot org' each morning. </p>
      <p>Not that this isn't an interesting challenge. It is, and is fun, but I'm not sure how practical it actually is in real world use. Is it more useful to have an odd looking glyph that might take a second look to fully understand or to just drop it altogether?</p>
