    html: |-
      <p>Besides that (I think) links are, like in HTML, stored separate from the text that links them.  (Although, totally OT, I find it interesting that there can ever be a "go back" or "up a level" hyperlink, since by definition that's a hypolink)</p>
      <p>But, if you name the glyph w_w_w then Adobe Reader will extrapolate that it's a ligature for the sequence of characters named w, w, and w.  If you wanted to do a ligature for "http://www.", then you would name it<br>
      <code>h_t_t_p_colon_slash_slash_w_w_w_period</code> and the resulting text for copy and paste or other purposes would be as expected.  If you named it "weblig" though, a copy and paste or whatnot will give garbled results.  </p>
      <p>You would assign a unicode value of -1, unless any of the psuedo-standards for the PUA include a glyph for it already, in which case I'd use that. </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
