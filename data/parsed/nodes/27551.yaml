    <p>Hai,</p>
    <p>Whenever there is a URL to be typeset I get really annoyed by the three W´s. Those characters will never space nicely and they don´t give any information anyway. So therefore I thought of a new sign, a new character, to replace `WWW´. And it looks like this</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/world wide web character_4957.gif"></div><p></p>
    <p>Anyone in favor of adding a new sign to the world? Any suggestions are more than welcome!</p>
    <p>Cheers,</p>
    <p>Tijs Krammer<br>
    (The Netherlands)</p>
