      <p>Thanks for the thread. Very interesting. But everybody's writing nice options without much real visual proposals. The large W with the two small w's beside is nice, but not a serious option in my view, because it takes up too much space. A W combined with a 3 is a thought, but remember that people should always have the option to use three w's instead of the new sign.</p>
      <p>One of the comments had me thinking. Wouldn't it be a nice idea to use a very simple globe as a sign for the world (!) wide web?</p>
      <p>Cheers</p>
