      <p>"It is indicating that a web adress is following. Just like the at-sign is always a part of an email adress and immediately recognisable."</p>
      <p>Visually, I agree, though technically speaking, this isn't necessarily true.</p>
      <p>An email address must have an @ sign. </p>
      <p>A URL doesn't have to have the www at all, and, these days, most competant sysadmins know enough not to require the www to get to one's web site.</p>
      <p>As such, I'd agree that the solution to the problem is to just drop the www altogether. I think the presence of a .com/org/net/etc is enough to clearly indicate a URL these days.</p>
