      <p>Well, aside from FontShop in Kreuzberg, there aren’t any foundries left in Berlin, although the city is awash in type designers! </p>
      <p>In terms of letters, I love to visit the city’s many cemeteries. Here are a few photos – <a href="https://web.archive.org/web/20080905090050/http://www.flickr.com/photos/typeoff/sets/72157600961533746/" title="http://www.flickr.com/photos/typeoff/sets/72157600961533746/">http://www.flickr.com/photos/typeoff/sets/72157600961533746/</a></p>
