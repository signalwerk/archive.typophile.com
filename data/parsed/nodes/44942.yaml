    <p>I’m trying to save what is yet to be saved, as I did not manage to ask this in time.</p>
    <p>I’ve got some more days left, and wanted to ask, what not to miss in Berlin, typographically?</p>
    <p>Any museums, exhibitions, foundries to visit? Any signage to look out for?</p>
    <p>All tips appreciated!</p>
