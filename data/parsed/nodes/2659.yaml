  html: <p>We are currently in the early stages of designing a book to printed in both English and German editions. Does anyone know a good rule af thumb for how much the text length will increase once the translation into German occurs? <br> <br>A colleague of mine remembers an increase of around 30% in overall length. Can anyone confirm this figure or offer a more educated answer?  <br> <br>Thanks in advance...</p>
