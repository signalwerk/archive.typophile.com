      <p>OK, so we exclude fonts designed after the 1970s. The G does not fit Rockwell or Stymie, but does fit Adrian Frutiger's Serifa [1966] <a href="http://www.myfonts.com/search/serifa/fonts/" title="http://www.myfonts.com/search/serifa/fonts/">http://www.myfonts.com/search/serifa/fonts/</a><br>
      and his Glypha [1977] <a href="http://www.myfonts.com/search/glypha/fonts/" title="http://www.myfonts.com/search/glypha/fonts/">http://www.myfonts.com/search/glypha/fonts/</a><br>
      Scale is small so some guessing.<br>
      As for width, this was the era of photo lettering when shrinking and expanding of fonts for LP covers, books etc. was common.<br>
      Then again, this might be something else?<br>
      Don</p>
