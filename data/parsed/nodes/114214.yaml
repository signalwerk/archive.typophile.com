    html: |-
      <p>Hi Danny, as for private e-mail, I prefer to share my info with all readers of this forum.<br>
      In terms of reproducing the letter forms and width in a clean text, i.e. not a distressed, worn or aged typewriter style, I like ITC American Typewriter Cond or Cond Bold <a href="http://www.myfonts.com/fonts/adobe/itc-american-typewriter/cond/" title="http://www.myfonts.com/fonts/adobe/itc-american-typewriter/cond/">http://www.myfonts.com/fonts/adobe/itc-american-typewriter/cond/</a> <a href="http://www.myfonts.com/fonts/adobe/itc-american-typewriter/cond-bold/" title="http://www.myfonts.com/fonts/adobe/itc-american-typewriter/cond-bold/">http://www.myfonts.com/fonts/adobe/itc-american-typewriter/cond-bold/</a> If you can use a font editor to blend the two fonts 50-50 you should end up with a demi-bold weight that is really close to your sample.  Joel Kaden and Tony Stan created this  proportionally spaced typeface in 1974, four years after release of Tell the Truth. BTW, for the best Otis song  "(Sittin' On) The Dock of the Bay" you need another LP. Another candidate with almost the right weight, but not quite as close in letter forms and too wide, is Italian Typewriter Bold  by Leonardo Di Lena for Flanker <a href="http://www.myfonts.com/fonts/flanker/italian-typewriter/bold/" title="http://www.myfonts.com/fonts/flanker/italian-typewriter/bold/">http://www.myfonts.com/fonts/flanker/italian-typewriter/bold/</a><br>
      Don</p>
