    html: |-
      <p>Seemingly many CJK fonts contain this design:</p>
      <p>--SimSun -- of course, MS Windows Font, which your Wikipedia link says is proportional.<br>
      --FangSong - MS Windows Font<br>
      --Zhongyi Electronic - BIG5-HKZHT<br>
      --Zhongyi Electronic - ZYSongKX-16_24_32_52<br>
      --Ricoh - MS Mincho</p>
      <p>I could not find a design match smaller than 5mb.</p>
