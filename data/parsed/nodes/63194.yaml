    <p>I have experimented with various tutorials and filters in photoshop (cutout, stamp, notepaper etc) hoping to replicate the clean smooth lines (image is based of a photo I presume), but are yet unable to get so nice and clean lines, so I'm not sure if I meant to be doing something else before applying those filters etc or.</p>
