    html: |-
      <p>It is actually possible to bind sheets into books so that they open out completely flat--the device used is like two very narrow pages that are glued together with the insert in the middle, but only part way, at the edge. So the effect is a "stalk" or "Y" shape that flattens to a "T". </p>
      <p>Not really relevant here. Especially good for maps.</p>
