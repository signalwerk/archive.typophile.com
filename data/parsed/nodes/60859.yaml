    html: |-
      <li>How is the book being bound? Leave 7-10 mm for perfect binding, 5+ mm if it is Smyth sewn, and minimal extra space if it is saddle stitched. (If it's a mechanical binding, like wire-o or spiral, I recommend you change the design so display lines don't straddle the gutter.)</li>
      <li>Don't split a letter across a spread. If possible, don't split a word across a spread. Using two separate text boxes will probably make this easier.</li>
      <li>Book binding is an industrial process, and facing pages can only be made to align within certain tolerances. As you move forward with this design, bear in mind that on some copies of the book, the baseline alignment on facing pages will be off by a couple of mm.</li>
