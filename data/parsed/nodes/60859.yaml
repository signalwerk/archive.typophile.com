  html: |-
    <p>Hello,</p>
    <p>I'm designing a book in which the chapter titles are presented in spreads. While some of the titles are fairly easy to lay out, some are a bit trickier - see attached. I need tips on how much allowance I should give the letters in the gutter, and if I should create separate text boxes for each page rather than one across the entire spread (if this lessens headaches with the printer down the road).</p>
    <p>Thanks in advance!</p>
