    html: |-
      <p>Chris, if you mean "different weight, same <em>width</em>" then that's what I use "uniwidth" for. Some people call it "duplexing" (from way back actually) but there's a confusing Two in that term, plus no reference to width.</p>
      <p>BTW it doesn't have to be just weight: like in Sabon and Asap it could include Italics. Or even multiple styles, like in my Daam Entity from the 90s:<br><a href="http://themicrofoundry.com/s_latin.html">http://themicrofoundry.com/s_latin.html</a></p>
      <p>hhp</p>
