      <p>Not that you need my permission or anything, but: if all the characters in all the three weights of Benedictine Pro (including kerning) take up exactly the same width, then it is indeed what I'd call uniwidth. One thing that's not clear in your text though is how the Italics play into this: I assume they're not uniwidth with the Romans, but are they uniwidth among themselves?</p>
      <p>BTW, here's a nice new uniwidth design that really pushes the weight range envelope:<br><a href="http://typographica.org/typeface-reviews/axia/">http://typographica.org/typeface-reviews/axia/</a></p>
      <p>And here's an old related thread:<br><a href="http://www.typophile.com/node/61252">http://www.typophile.com/node/61252</a></p>
      <p>hhp</p>
