    html: <p>There is an interesting article in <a href="https://ia601406.us.archive.org/28/items/typographica600unse/typographica600unse.pdf">Typographica 6</a> from December 1962 about typewriter faces. On page 59 is a list of specimen of proportional typewriter faces including Documentary, Arcadia, or Charter. They seem like interesting picks, but it might be difficult to find digitizations of them?</p>
