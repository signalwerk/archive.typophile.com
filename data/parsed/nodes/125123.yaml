  html: <p>I’m looking for recommendations for a text typeface for a book. The book is the biography of a workman and union activist in the 1950, but the story stretches from a few years before into the 1980/90s. I thought of a commonly-used typeface from that time, e.g. <a href="https://www.myfonts.com/fonts/linotype/palatino/">Palatino</a> or <a href="https://www.myfonts.com/fonts/adobe/melior/">Melior</a>, combined with a <a href="https://www.myfonts.com/fonts/fontfont/ff-trixie/">typewriter typeface</a> for the headings.</p>
  html_clean: <p>I’m looking for recommendations for a text typeface for a book. The book is the biography of a workman and union activist in the 1950, but the story stretches from a few years before into the 1980/90s. I thought of a commonly-used typeface from that time, e.g. <a href="https://www.myfonts.com/fonts/linotype/palatino/" class="link-external">Palatino</a> or <a href="https://www.myfonts.com/fonts/adobe/melior/" class="link-external">Melior</a>, combined with a <a href="https://www.myfonts.com/fonts/fontfont/ff-trixie/" class="link-external">typewriter typeface</a> for the headings.</p>
