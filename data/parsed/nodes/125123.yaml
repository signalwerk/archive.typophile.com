    html: <p>I don't think Palatino or Melior were ever popular for books in that period. Palatino maybe if it was "arty". The most common book faces that I recall were Times and Caledonia. Another popular one was Fairfield (or maybe I'm thinking of Electra). Sometimes Century Schoolbook or Baskerville. For the most part, the choices were limited to faces that were appropriate for book work that were available on Linotype and Monotype casting machines.</p>
