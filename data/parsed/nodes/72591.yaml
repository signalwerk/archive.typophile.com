  html: <p>In <cite>Typeforms – A History</cite> (Oak Knoll Press/British Library, 2007), Alan Bartram shows a sample of metal Monotype Falstaff (1935) with matching italic. How come the digital version of Falstaff currently offered for sale by Monotype (and Adobe, etc.) has only a roman version ?</p>
