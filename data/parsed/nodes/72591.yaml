    html: <p>Yes, it’s Matthew Carter’s Big Figgins Italic with another name, for whatever reason. But still I just can’t understand why there are so many classic Monotype typefaces which remain unreleased in digital form — Joseph Blumenthal’s Emerson, for instance.</p>
