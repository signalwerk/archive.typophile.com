  html: |-
    <p>Speaking as someone who's not a type designer, can any of you explain the rationale behind not grouping font families? Ungrouped families are incredibly difficult to work with in InDesign, especially when there are a lot of weights. Grouping seems to be the norm (at least that I've noticed?) so it's always jarring to come across one that isn't grouped. </p>
    <p>So, is it a conscious decision to set the files up like that? A technical limitation with the software used to create the font?</p>
