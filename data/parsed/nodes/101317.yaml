    html: |-
      <p>Its dreary to think of someone out in Woburn, Massachusetts trying to sort out the intricacies of font style-linking. I'm in Somerville, which is basically the same. There are probably more worthwhile endeavours.</p>
      <p>I used to use a free tool called TTX to dump out font tables in XML, not so much to solve problems, but to explain to others why things don't work in a particular OS/application.</p>
      <p>I think in ancient times, applications such as Quark would intervene, but it seems like a losing game because it doesn't really fix things at the generalized font level. Perhaps it will work for you over the interval at which you care.</p>
      <p>Let us know if you get it working.</p>
