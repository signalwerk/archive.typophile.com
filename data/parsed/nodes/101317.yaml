    html: |-
      <p><cite>So is it technically possible to have a family of singletons that still displays as a family in InDesign?</cite></p>
      <p>Yes, but it requires a rather complex work-around (to create several naming systems within one font), which most newer professional font families will have. But thousands of font families where planned before there was an app called InDesign and it’s not as simple as activating a check-box somewhere to make the grouping work in a way that is compatible with each and every software. </p>
      <p>By the way: What makes ungrouped families “incredibly difficult” to work with in InDesign?</p>
