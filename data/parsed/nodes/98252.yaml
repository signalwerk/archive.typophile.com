    <p><em>Meleo</em> is the font I put out for critique almost a year ago. After endless tweaking and retouching, now it’s finished, and can be found in MyFonts under the following link:</p>
    <p><a class="freelinking external" href="http://www.myfonts.com/fonts/alexis-luengas/meleo/" rel="nofollow">http://www.myfonts.com/fonts/alexis-luengas/meleo/</a></p>
    <p>The Regular weight is almost free, I hope I can also get some students to buy it ;^) Please let me know what you think!</p>
