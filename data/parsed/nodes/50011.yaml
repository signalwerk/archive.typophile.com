    <p>British crime author Sir <a href="http://www.sherlockholmesonline.org/">Arthur Conan Doyle</a> named his story <em>The Hound of the Baskervilles</em> after his compatriot John Baskerville’s well-known and much-venerated typeface. In my current photo op, Boroondara Kew Cemetery, last week I stumbled across <a href="http://www.flickr.com/photos/arboghast/2898366374/">what looks to be the grave of a Baskerville</a> who lived in the late 19th century, one George Baskerville.</p>
    <p></p><div class="imageWrap"><img src="/files/george_baskerville_4480.jpg"></div><p></p>
    <p>I plan to go back this week and take loads more pix of George Baskervile’s fallen tombstone. Many thanks to <strong>flickr</strong> pal <a href="http://www.flickr.com/photos/tom-margie/">Tom Margie</a> for noticing the name on the monument.</p>
    <p>j a m e s</p>
