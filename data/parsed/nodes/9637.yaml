    html: "<p>I think the style of the typeface is fine and an interesting contribution to the argument of your article. The obvious conscious design decisions about letterform are generally reasonable, but the execution seems uneven, and some letters create a sense of arbitrariness, e.g. the splayed and imbalanced lowercase w, and I find it hard to consider that you might have intended them that way, since they don't seem to contribute to the readability of the face. The lowercase s seems too light. The open lower bowl of the g is fine, but the upper right transition of the same bowl is both heavy and awkward and is contrary to the 'movement' of the other letters. I don't think you gain anything from the lower right termination of the d that you would not gain from modelling it on the same area of the a. I think the top bowl of the e is a bit too large: I understand your desire to make it taller than 'normal', but I think you've overdone it a bit: the bar is optically pressing down into the lower part of the letter, an effect strengthened by the straight transition on the right. The giant white space in your fi ligature seems to me problematic in terms of 'bouma' shape; if you want to preserve the dot on the i, why not consider what Jelle Bosma did in Cambria and have a contextually substituted narrower f before i? I don't understand why the external serifs on the m are so much shorter than on the n: are serifs important to readability or not? Some letters are very nice: I especially like the lowercase c.</p>"
