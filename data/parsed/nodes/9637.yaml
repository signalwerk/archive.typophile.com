    html: <p>&gt;is there any other rules or considerations? <br> <br>Mark Jamra's theory considers white space -- the area between characters. While this is most useful, there are other parameters of spacing, such as "near-point distance". <br> <br>The extreme instance of near-point spacing is the setting, popular for advertising headlines set by phototypositor in the era c. 1965-85, known as "tight but not touching". <br> <br>Some typefaces, in particular Goudy's Old Style (1920s), were designed for a tight fit, in metal setting, in text, so they excelled in the TBNT setting. <br> <br>The light weights of Helvetica Neue (done in the TBNT era) are tightly fitted, with near-point spacing having a greater role to play than white-spacing. <br> <br>It's also interesting to compare the metrics of the original Univers (not much kerning there) with the new version, especially concerning the lower-case "r".  <br> <br>Jamra rightly identifies the primary importance of using the judgement of one's eyes to determine "even rhythm", and, to continue the analogy musically, bear in mind that there are many different rhythms, some simple, others complex. Sure, you need a basic rhythm for legibility, but beyond that, the question is will the type march, skip, dance or drag its feet?</p>
