    html: <p>Hello, <br> <br>For legibility, is anyone have some suggestions or nice research papers for character spacing setting?  <br>I read one paper wrote by mark Jarma about the basic character spacing in type design. (Link as follow) <br> <br><a href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_20.pdf" target="_blank">http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_20.pdf</a> <br> <br>So, apart from the basic idea, when typeface desiger design the character spacing of fonts, is there any other rules or considerations? <br> <br>Or is there more suggestions from the psycology field?  <br> <br>Thanks for any advice!! <br> <br>y</p>
