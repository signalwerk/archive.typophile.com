    html: <p>The only real way to measure font legibility is to create some sort of human factors cognitive research study.  <br> <br>Identify the font you want to test, and develop a hypothesis that you will test. <br> <br>Create a set of stimuli that will be simple enough to clear response from your test population so you may test your hypothesis.  <br> <br>Assemble a test population and give them a pre-test that is designed to leave you with a fairly uniform population so any results can be attributed to that population, this will help future researchers working on similar material.   <br> <br>Administer the test and and do a statistical analysis of the results. <br> <br>Rinse and repeat.</p>
    html_clean: <p>The only real way to measure font legibility is to create some sort of human factors cognitive research study.  <br> <br>Identify the font you want to test, and develop a hypothesis that you will test. <br> <br>Create a set of stimuli that will be simple enough to clear response from your test population so you may test your hypothesis.  <br> <br>Assemble a test population and give them a pre-test that is designed to leave you with a fairly uniform population so any results can be attributed to that population, this will help future researchers working on similar material.   <br> <br>Administer the test and and do a statistical analysis of the results. <br> <br>Rinse and repeat.</p>
