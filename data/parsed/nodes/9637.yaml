    html: <p>I think it's certainly <i>possible</i> to do sensical testing, but it's also extrememly difficult to do it <i>right</i>, at least in the realm of immersive reading (as opposed to just individual letters/words). And the main thing is that, in the absense of reliable empiricism, a typographer still has to make design decisions, he can't put his head in the sand. This is where plausible theorizing can be more useful than to "measure font legibility". That's what I've been trying to do in various ways myself, and my article in TYPO is a representative culmination of it all. <br> <br>hhp</p>
