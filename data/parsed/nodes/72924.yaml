    html: <p>I use Windows 7 and I still manage to crash thrice a week. I recently had to do a fresh OS install and it crashes at the same frequency. It depends what I'm working on. If I'm arrow key tapping points, it's unlikely to crash. If I'm messing with the mask layer, composites, paste special, classes or dragging and dropping glyphs, I'm more likely to crash it. The current version of FLS doesn't crash as predictably as older versions did. I used to have to do certain things to avoid crashes. But now it's different. I can do something to make it crash, load the same font, do exactly the same thing again and it won't crash.</p>
