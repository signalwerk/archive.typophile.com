  html: |-
    <p>I've been developing a new sans serif/display typeface for a concert poster design, a super geometric typeface design to complement Avenir or Avant Garde in uppercase, that I would like to call Britannica. I was just looking for some suggestions for ways I could give it more of a personality to the letterforms. This is my first formal typeface, and I haven't done lowercase yet, but I was looking for some creative imput. Thanks...</p>
