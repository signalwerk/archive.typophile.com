      <p>First look I'd say, this typeface seems to have potential. At my point of view, I'suggested to raise the middle bar of th E, F, H, B, The K looks like it's an arrow hurting a vertical line and this arrow is too in the middle. The Z is too wide and the G too narrow compare to the C and the O. The diagonale line of the S seems to low.</p>
      <p>The Q is right on.</p>
