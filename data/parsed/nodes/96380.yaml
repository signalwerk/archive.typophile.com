  html: |-
    <p>Often font changes are good for blood pressure.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Often_font_changes_are_good_for_blood_preasure.gif" alt="" title="Often_font_changes_are_good_for_blood_preasure" width="500" height="300" class="alignnone size-full wp-image-2134"></p>
    <p>Kerning day.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Too_much_kerning.gif" alt="" title="Too_much_kerning" width="500" height="323" class="alignnone size-full wp-image-2135"></p>
    <p>Hm, is spacing too tight?</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Hm_is_spacing_too_tight.gif" alt="" title="Hm_is_spacing_too_tight" width="500" height="299" class="alignnone size-full wp-image-2136"></p>
    <p>Crap, this font I just made already exists. Burning evidences before somebody see it.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Crap_this_font_already_exists.gif" alt="" title="Crap_this_font_already_exists" width="500" height="227" class="alignnone size-full wp-image-2137"></p>
    <p>Waiting to font start selling.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Waiting_for_font_starts_selling.gif" alt="" title="Waiting_for_font_starts_selling" width="500" height="227" class="alignnone size-full wp-image-2138"></p>
    <p>It's always nice to see feedback from our customers.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Its_always_nice_to_see_feedbacks_from_our_customers.gif" alt="" title="Its_always_nice_to_see_feedbacks_from_our_customers" width="500" height="362" class="alignnone size-full wp-image-2139"></p>
    <p>Guy who made too much fonts for his life now can finally relax and enjoy in royalties.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Guy_who_made-too_much_fonts_for_his_life_now_can_relax_and_enjoy-in_incomes.gif" alt="" title="Guy_who_made-too_much_fonts_for_his_life_now_can_relax_and_enjoy-in_incomes" width="500" height="212" class="alignnone size-full wp-image-2140"></p>
    <p>Good thing about making fonts is that you get total understanding from your surrounding.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Good_thing_about_making_fonts_is_that_you_get_total_understanding_from_your_surrounding.gif" alt="" title="Good_thing_about_making_fonts_is_that_you_get_total_understanding_from_your_surrounding" width="500" height="228" class="alignnone size-full wp-image-2141"></p>
    <p>Waiting for @MyFonts monthly payment.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Waiting_for_myfonts_monthly_payment.gif" alt="" title="Waiting_for_myfonts_monthly_payment" width="500" height="299" class="alignnone size-full wp-image-2142"></p>
    <p>The process of thinking about font name for your next release.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Thinking-about-font-name-for-your-next-font.gif" alt="" title="Thinking-about-font-name-for-your-next-font" width="500" height="323" class="alignnone size-full wp-image-2143"></p>
    <p>Hinting is important part of customizing font for screens.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Hinting-is-important-part-of-customizing-font-for-screens.gif" alt="" title="Hinting-is-important-part-of-customizing-font-for-screens" width="500" height="399" class="alignnone size-full wp-image-2144"></p>
    <p>Researching is important part of font development.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Researching-is-important-part-of-font-development.gif" alt="" title="Researching-is-important-part-of-font-development" width="500" height="226" class="alignnone size-full wp-image-2145"></p>
    <p>Next 50 days after you release font on @MyFonts and waiting to appears on "Hot New Fonts".</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Next-50-days-after-you-release-font-on-myfonts-and-waiting-to-appears-on-Hot-New-Fonts.gif" alt="" title="Next-50-days-after-you-release-font-on-myfonts-and-waiting-to-appears-on-Hot-New-Fonts" width="500" height="293" class="alignnone size-full wp-image-2146"></p>
    <p>So, who made this kind of serifs first, you or me?</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/So-who-made-first-this-kind-of-serifs-you-or-me.gif" alt="" title="So-who-made-first-this-kind-of-serifs-you-or-me" width="500" height="222" class="alignnone size-full wp-image-2147"></p>
    <p>Releasing a new font is religious experience.</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Releasing-new-font.gif" alt="" title="Releasing-new-font" width="500" height="299" class="alignnone size-full wp-image-2148"></p>
    <p>Somebody is interesting to buy app license for my font?</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/Somebody-is-interesting-to-buy-app-license-for-my-font.gif" alt="" title="Somebody-is-interesting-to-buy-app-license-for-my-font" width="500" height="270" class="alignnone size-full wp-image-2149"></p>
    <p>On phone line with our vendor, asking what's going on, why aren't they published yet our latest font!</p>
    <p><img src="http://www.tourdefonts.com/wp-content/uploads/2012/09/On-line-with-our-vendor-asking-whats-going-on-why-arent-they-publishing-our-latest-font-yet.gif" alt="" title="On-line-with-our-vendor-asking-whats-going-on-why-arent-they-publishing-our-latest-font-yet" width="500" height="322" class="alignnone size-full wp-image-2150"></p>
