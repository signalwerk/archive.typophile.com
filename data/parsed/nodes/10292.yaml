    <p>&lt;font class="dontLookLikeCrap"&gt;Need some suggestions about condensed sanserif type that is legible at points (5,6 pt) for packaging. <br>(Vitamin drink) <br>I was thinking something along the line of DinCon but more legible at smaller sizes. <br> <br>Ps. It will be set in uppercase fopr the most part <br> <br>Thanks.&lt;/font&gt;</p>
