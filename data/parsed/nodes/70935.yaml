      <p>At first I thought it might be something in between Compacta and Compacta Black, skewed, but that doesn't seem quite right. If you're looking to recreate it, <a class="freelinking external" href="http://new.myfonts.com/fonts/bitstream/swiss-911/swiss-911/" rel="nofollow">Swiss 911</a> seems to come pretty close, this is what I got manually fitting it to your logo and skewing it in Photoshop (bearing in mind I don't own this font, so I transformed a MyFonts screenshot):</p>
