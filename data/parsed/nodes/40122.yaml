    html: |-
      <p>As far as I know there is only one release of <a href="http://www.myfonts.com/fonts/linotype/neue-helvetica/" rel="nofollow">Helvetica Neue</a>, and it is Linotype's (although you can also purchase it at fonts.com and MyFonts.com).</p>
      <p>I don't know of any titling alternates for this family... This may not be the answer you are seeking, but if you feel that it needs some tracking in an all-caps setting, then you will have to do the tracking yourself. At most, if you are working in Illustrator or in InDesign, you could try using the Optical Kerning option to see if more letterspacing is created that way... But that usually happens with smaller point sizes. Sorry.  :-)</p>
