      <p>FYI: In Europe the ‘Jingle Envelope’ does NOT exist. In other words: Mortgages can not be dissolved by sending the house keys to the bank — banks in Europe are more prudent when loaning to people, thereby protecting those that don’t have the means to pay back their debts. Some countries even have special guarantee funds to cushion mortgage defaults and so on. </p>
      <p>Even more remarkable for Americans may be the fact that Europeans in general don’t like to be in hock and prefer to save before purchasing luxury goods. We have a positive savings rate (as does Japan). The US has the reverse: a per capita (credit card) debt in excess of 20k. Plus a national per capita debt of over 50k because of the overspending of its government. </p>
      <p>Europe’s governments are basically social-democratic, in the sense that the state provides for at least a few basic needs, preventing inhabitants to drop to sub-existence levels. They also have national debts that are regulated to be within managable bounds.</p>
      <p>Americans may call this socialism, I like to call it social, because it is anti-social to burden the coming generations with financial debt as well as an environment that will be damaged beyond repair. I still remember how aghast I was the first time I visited the US when I rode the bus from the 42d St Terminal to Newark Airport: the desolation and the pollution of the industrial estates I saw was beyond anything I had seen before… (AD 1980).</p>
      <p>Because the US are a huge factor in international trade, the rest of the world has to pay for their foolish ways and the excessive avarice of their bankers, businessmen and politicians. Our only solace will be that this recession will be shorter for us than for it will be for the American people, because we have more financial reserves and the financial sector is far less important here. Too bad that people who are completely innocent will suffer the most (the poor masses of Africa, Asia and South America).</p>
      <p>I am sure the next president will be a lot smarter than the present one — let’s hope he will do a better job (and even that is a no-brainer)…</p>
      <p> . . .<br>
      Bert Vanderveen BNO</p>
