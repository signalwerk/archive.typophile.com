      <p>Burt — “we” Americans all get tarred with the same brush. Here is another true story about Americans that is just as typical: When my father turned 66, he bought a refrigerator on time (i.e., charged it), to see what that felt like. He decided he didn’t like the feeling &amp; paid it off the next month.</p>
      <p>From my perspective, it was a western-world-wide change in attitude that started about the 1980s that ruined things. I know, every older generation complains about the younger ones . . .</p>
      <p>People don’t take it seriously, but as an observation, monarchies seem to do better than democracies. The pattern with a monarchy seems to be “a good one, a bad one, a good one, a bad one . . .” — a pattern rarely achieved in a democracy. The only trick with a monarchy is to be born during a good one.</p>
