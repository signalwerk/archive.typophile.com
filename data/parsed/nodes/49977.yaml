      <p>Hrant, well, to somewhat tie this to the original post, what sells well (i.e., getting elected) isn’t often what is best for a task (i.e., running a government).</p>
      <p>What democracy did solve was the succession wars. Rome wasn’t the only country to fall prey to these. And certain present governments excepted, democracies do seem to generate fewer &amp; shorter wars. You can tell Johnnie Commoner he has to lay down his life for the good of the wealthy only so often, and for a shorter length of time.</p>
      <p>But Hobo is a high price to pay for these benefits, as is the font-of-the month club attitude amongst graphic designers. Of course, that whine presupposes you’re a type user rather than a product hawker.</p>
