      <p>Amen brother.</p>
      <p>People don’t take monarchy seriously because people believe what they’re told to believe, and politics is subject to fashion just like anything else. The denialism concerning the inadequacy of democracy is in fact precisely democracy’s final “closure”, fostering a hermetic system where people think they’re in control of their societies/lives, naturally developing an aversion to seeing the fatal flaw: that people are qualified to cook, build houses, make fonts, serve food, etc. and not qualified to grasp politics. If one wants to grasp politics, one must be trained to be a politician.</p>
      <p>Democracy thus seals the fate of the poor peons who are perpetually voting, expecting improvement, because, after all, they’re the ones making the choices, big and small. People don’t like admitting they don’t know what they’re doing. So what becomes very difficult for them to see is that the choices they’re given are pre-determined to avert true change, to avert true divergence from the hermetic plutocracy they’re stuck in. Essentially, they get to choose between “Original” and “Mint” toothpaste. In contrast, monarchy is easier to fix because when it’s bad there’s a groundswell of palpable discontent where nobody is being fooled, and this discontent will eventually explode in the face of the tyrants. That might sound necessarily bloody (which is not always the case) but is a short spurt of violence not preferable to interminable servitude? Democracy is the slow death of dignity. And the more hermetic a democracy, the more likely that change must -and eventually will- come from outside.</p>
      <p>hhp</p>
