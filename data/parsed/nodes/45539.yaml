    <p>The typeface foundry and subsidiary of Monotype Imaging Holdings Inc., Linotype GmbH, has introduced the Frutiger Serif typeface family, a new 20-font offering was designed by Akira Kobayashi, type director at Linotype, and Adrian Frutiger, who designed the original Frutiger sans serif design along with other popular typeface families including Univers, Avenir and Vectora. </p>
    <p>The Frutiger Serif design is based on the Meridien® typeface, one of Frutiger’s first, released in 1957. The Frutiger Serif typeface family is available in five weights ranging from light to heavy, and all weights are available in both regular and condensed versions. Each has a corresponding italic, in addition to a condensed italic. The Frutiger Serif fonts support 48 western, central and eastern European languages, including Baltic and Turkish. The fonts are available in the OpenType® cross-platform format and include OpenType features such as ligatures, small caps and several numerical figures.</p>
    <p>Individual Frutiger fonts, selection packs and typeface families can be viewed online at <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>, <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a> and <a href="http://www.faces.co.uk" title="www.faces.co.uk">www.faces.co.uk</a>. </p>
    <p>The initial Frutiger typeface was originally designed by Frutiger for the Charles-de-Gaulle Airport in Paris in the 1970s. In 1997, he completed the Frutiger Next family, developed for signage at the Alte Pinakothek in Munich and then becoming commercially available in 2000 as a Linotype typeface. Other variations available from the Linotype Library are the Frutiger Stones™ family, which incorporates the look of polished pebbles as the boundary; the Frutiger Symbols design, a family of symbol fonts; the Frutiger Capitalis design, a font containing ornamental glyphs; and Frutiger Arabic, designed by Nadine Chahine of Linotype and released last year.</p>
