      <p>Ohie, I'm not sure how I feel about this. I've been a long time fan of Meridien. I'm always for large families with many weights, but I'm not sure I understand why they would expand the weight set and then rename it Frutiger Serif (aside from the obvious importance of relating it to Frutiger). I really will detest the day that all fonts exist in Serif and Sans Serif versions—where's the variety?!</p>
      <p>Is it possible that the new Frutiger Serif is intended more purely for digital use, while Meridien would be expected more for ink on paper?</p>
