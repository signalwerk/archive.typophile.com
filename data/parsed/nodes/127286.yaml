  html: |-
    <p>I have enjoyed following Typophile for years. No, I am not type designer but I enjoy using and understanding type. </p>
    <p>I am completely discouraged by the amount of Spam that finds it's way into the various discussions. Right now there are over one dozen direct Spam entries on the front page of the website. Is there an Administrator out there that can AND WILL remove all of this crap? Of course it would be really nice if there was a way to try and avoid the issue up front but in that I am less hopeful. </p>
    <p>My guess is that this comment will probably be viewed as Spam. This used to be a really enjoyable site to take in the comments and expertise of so many respected type designers. Now, they appear to have all taken their insights to other locations and I am sure that many were driven away by the excessive Spam on the site. So sad...</p>
