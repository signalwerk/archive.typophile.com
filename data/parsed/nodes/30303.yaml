      <p>I cannot say anything about TrueType OTFs, but since Microsoft uses arbitrary glyph order, this seems to be fine.</p>
      <p>PostScript/CFF OTFs also allow arbitrary glyph order — but there is a little caveat which I found:<br>
      On Mac OS9 with ATM, you would not access the Euro via the according key. InDesign 2 is an exception since it does not rely on the OS or ATM. (I decided for a nice glyph order and against supporting OS9.)<br>
      With apps that run in OSX or Windows there does not seem to be any problem.</p>
      <p>Karsten</p>
