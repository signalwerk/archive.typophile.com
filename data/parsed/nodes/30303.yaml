      <p>There are a bunch of things related to glyph ordering. Here are just the few that I can think of off the top of my head.</p>
      <p>OpenType CFF fonts can be marginally smaller if the first couple of hundred glyphs are named and ordered according to a standard scheme.</p>
      <p>Glyphs being ordered consistently when they can be substituted from one group to another allows for block shifts, which makes for better glyph substitution performance. So for example if your regular numbers are zero through nine and are consecutively ordered, you should do the same with numerators, inferiors, oldstyle alternates, and so on.</p>
      <p>Some older versions of Photoshop expected the first glyph to be the notdef (was this only in OpenType CFF? I forget), and if you stuck a regular glyph in that slot, it would not be usable.</p>
      <p>Regards,</p>
      <p>T</p>
