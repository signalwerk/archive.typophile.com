    <p>Does the glyph order for the first 256 glyphs in an OT font have any effect on compatibility or performance? I noticed that the new set of ClearType fonts from MS have a quite human readable order starting with all uppercase glyphs, then small caps followed by lower case etc. Nice when you are picking a glyph from a palette with index order shown. Most OT/CFF fonts seems to be using some form of Adobe Standard Encoding for the first glyphs, is that necessary or just based on a tradition?</p>
    <p>/mårten</p>
