      <p>There are at least two more concerns with glyph ordering in OpenType fonts:</p>
      <p>- for TrueType-flavored OpenType, Apple’s TT spec dictates that the first two glyphs must be the notdef and null. It also puts some other requirements on character-to-glyph mapping. <a href="http://developer.apple.com/textfonts/TTRefMan/RM07/appendixB.html" title="http://developer.apple.com/textfonts/TTRefMan/RM07/appendixB.html">http://developer.apple.com/textfonts/TTRefMan/RM07/appendixB.html</a></p>
      <p>- the glyph ordering controls the order the glyphs are displayed in InDesign’s glyph palette</p>
    html_clean: |-
