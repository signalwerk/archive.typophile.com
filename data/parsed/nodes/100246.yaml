      <p>Whether the font is free or not, check the license agreement (or even ask the designer). The thing is, when you use a font for something that represents you (as opposed to a client) that might count as "personal use" (as opposed to "commercial use"). But it depends how the designer sees the situation, and it's always good to get an OK in writing.</p>
      <p>hhp</p>
