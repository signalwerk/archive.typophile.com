  html: |-
    <p>I need help!<br>
    I'm creating a website/social networking resource and I am designing a logo. I found a font that I like for free from a website and want to use just one letter "s" for my logo. I will not be selling the logo or distributing the font in any way, just want to have a clean logo for my website/potentially more than that in the future.</p>
    <p>1) can I do this?<br>
    2) can I customize the logo in photoshop or something and tweak it to make it original and use that?<br>
    3)if not, what steps do I need to take in order to do this legitimately?</p>
    <p>Any help or advice would be extremely appreciated guys!</p>
