  html: |-
    <p>It’s here! The first official Bold Monday type specimen: A5 format, 64 beautifully designed pages, produced in two colour offset printing, glue bound and showing all of our typeface designs including custom work and upcoming releases.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/specimen_02_3617.jpg"></div><p></p>
    <p>With guest contributions by Donald Beekman, Liza Enebeis &amp; Marc van der Heijden, Koen Geurts, Bart de Haas, Léon&amp;Loes, Max Kisman, René Knip, Dennis Koot, Indra Kupferschmid, Tobias Peier, R2 and Jesse Skolnik.</p>
    <p>Order your copy now at <a class="freelinking external" href="http://www.boldmonday.com/en/specimen/" rel="nofollow">http://www.boldmonday.com/en/specimen/</a></p>
    <p>Bold Monday<br>
    <a class="freelinking external" href="http://www.boldmonday.com/" rel="nofollow">www.boldmonday.com</a></p>
