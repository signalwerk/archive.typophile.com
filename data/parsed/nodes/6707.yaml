    html: "<p>To Mister Berkson: <br> <br>Well, I have Monotype, Adobe and Bistream Bembos. They all differ from this one inasmuch the x height is relatively greater; that is, the form of the characters (a, c, e m,and so on) is a faithfull copy (To the extent of having the slightly bent m), but both the ascenders and descenders have been reduced.  <br> <br>I think when Monotype digitized the font they tried to reach a sort of compromise - the new versions work well at 11 points, whereas the old book version was made, I think, with 12 points in mind (actually, it was 12 points). <br> <br>To Mr Serra, dear friend: <br> <br>Thank you. Could I second Mr Caston's request for a link - I can't seem able to find it.  <br> <br>And to all, thank you. I love the old Monotype Bembo - I really can't tell why, by I assume it is because of its extremely elegant proportions and, at the same time, the very slight irregularity and \"bite\" it possesses. Not so pronounced as, for instance, Galliard but far more so than Robert Slimbach's excellent Garamond.</p>"
