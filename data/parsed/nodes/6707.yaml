  html: "<p>Hi all: <br> <br>I'm new here. I'm not a professional typographer and my mother tongue is not English. So, please, be lenient with me. I just love books and typography - I've read a few (about a dozen) books on it and know almost all the classic typefaces and the rudiments on how to plan a book.  <br> <br>From my youth I was fascinated by two arguably similar typefaces: what I know now is Monotype Bembo (the metal version) and Garamond (I am fortunate my Grandfather had two genuine Plantin books - one published in the 17th Century and another one in the 18th).  <br> <br>I am fairly content with Adobe Garamond (which I think is generally closer to the original - I mean in the general way a page looks - than Stempel Garamond) but not with the digital Monotype Bembo. <br> <br>When I manage to locate Monotype Bembo I bought it, but the ascenders and descenders were quite reduced. I e-mailed Monotype, they said they were working on a new version, but, quite casually, I found a new digital version that is extremely similar (I mean, it copies it) the original Monotype Bembo. <br> <br>I asked Monotype again (I sent a specimen) and they told me it would probably be a metal font. Now I know it isn't. <br> <br>Does anyone know what it is and how I can get it?  <br> <br>I found it in Stereophile - a magazine dealing with hi-fi matters.  <br> <br>Any contribution will be warmly welcome. <br> <br>Yours, <br> <br>R de S�</p>"
