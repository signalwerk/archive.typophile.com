      <p>Geez, what a website John! Nice.</p>
      <p>mig85 i'm a graphic designer too and on my case would get a classic typeface. Palatino, Bodoni and so on and on are good classical typefaces. The only problem is that they are user a lot (Bodoni for example is part of Vogue's logo).<br>
      I would recommend you one of my ex-teacher <a class="freelinking external" href="http://www.dstype.com" rel="nofollow">Dino dos Santos</a>. He has really good typefaces. Check them.</p>
      <p>Joel Santos // youremin<br>
      sound &amp; visual</p>
