      <p>A couple of suggestions:<br>
      OutType's Fresco comes to mind: I don't have it, but it looks good. Their website doesn't let me link to Fresco, but go here:<br>
      <a href="http://www.ourtype.be/home.htm" title="http://www.ourtype.be/home.htm">http://www.ourtype.be/home.htm</a></p>
      <p>...and wait for the Flash to load, then navigate to Fresco and its related faces.</p>
      <p>Also on their site, check out Eva.</p>
      <p>or how about Adobe's <a href="http://store1.adobe.com/cfusion/store/html/index.cfm?store=OLS-US&amp;event=displayFontPackage&amp;code=1734" rel="nofollow"> Cronos</a>?</p>
      <p>Given the wide use you're contemplating be sure to check the EULA's for any fonts you consider. You want to be sure you can use the fonts in PDFs, for example.</p>
