    <p>Hi all,</p>
    <p>I'm a graduate graphic designer who really wants a proper education in typography! I've been signing up to dozens of typography foundries and browsing forums to try and understand the complex world of type. This forum has been extremely helpful.</p>
    <p>I'm starting a project for a new small company in the medical field. It's a medication review which offers a more holistic service...it's hard to explain! They need a logo, brochure, letterhead, report, website etc.</p>
    <p>The font has to be professional, simple, and maybe with a slightly 'caring' feel to it. It's aimed at medical professionals, hospitals etc. Doctors get heaps of promotional material so I think that using a quality font or complete font package, along with good graphic design, could help catch their eye.</p>
    <p>What would be a professional-yet-modern-yet-caring typeface? I'm open to using a combination of typefaces or a type family to create this brand.</p>
    <p>Thanks for your time.</p>
