    html: |-
      <p><em>I was told that my SS01 feature was valid, but not registered...</em></p>
      <p>Are you describing a Font Validator report message? Font Validator has not been updated recently, so OTL features that were registered in the spec annex after Font Validator was made will get this message. My guess is that other test tools will behave the same way when encountering layout feature tags that they do not recognise.</p>
