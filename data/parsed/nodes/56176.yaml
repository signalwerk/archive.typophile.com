    html: |-
      <p>What is "the manual"? The user manual for FontLab Studio 5? Something else?</p>
      <p>Each lookup (~="feature") needs to be associated with a particular language or set of languages. That could be 'dflt' (default), but it has to be something. Otherwise it will be in the font, but will never be used....</p>
      <p>T</p>
