      <p>If you type "Garamon" into the search box at the bottom of the <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php">Serif Guide search page</a> you get to see 27 Garamond/Garamont versions, more or less at once, and for many of them you can compare more complete samples. It shows how this 'a' really is not typical in the Monotype version.</p>
      <p>- Mike Yanega</p>
