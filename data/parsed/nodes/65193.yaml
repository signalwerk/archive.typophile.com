    date_raw: 9.Dec.2009 4.40pm
    votes: null
    html: <p>Tiffany, it's the lower case a. That seems to always be distinctive, and all the Garamonds are a little different. I'm not that fond of it, but someone who really knows the type told me that its swashes are some of the best. Just looking now, I can see what they meant.</p>
