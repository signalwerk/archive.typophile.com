  html: |-
    <p>FOR IMMEDIATE RELEASE</p>
    <p>BlueVinyl Fonts Releases Taroca</p>
    <p>BVFONTS.COM -- BlueVinyl Fonts is proud to announce the arrival of it's newest font Taroca! Taroca pronounced (Tah-Row-Kuh) is a word derived from the Italian word for Tarot. The Taroca font invokes the spirit of the traveling carnivals from the early 1900's. There are swash versions of: R, R small cap, Q, Q small cap, K and K small cap. Taroca Extras, which is included, is loaded with icons, word banners and flourishes. When using the OT version simply select Ornaments.</p>
    <p>Please visit this webpage for images and further details of Taroca: <a href="http://www.bvfonts.com/taroca.shtml" title="http://www.bvfonts.com/taroca.shtml">http://www.bvfonts.com/taroca.shtml</a></p>
    <p>Contact:</p>
    <p>Jess Latham<br>
    Email: <a href="mailto:bluevinyl@bvfonts.com">bluevinyl@bvfonts.com</a><br>
    <a href="http://www.bvfonts.com" title="http://www.bvfonts.com">http://www.bvfonts.com</a></p>
