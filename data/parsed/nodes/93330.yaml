    html: '<p>I doesn’t look like a font. Compare the three ‘o’ glyphs: Each of them is different from the two others. You would get that by applying an erosion effect to a typeface, in this case maybe something like <a href="http://www.fontshop.com/fonts/singles/process_type_foundry/klavika_medium_ot/?&amp;fg=000000&amp;bg=ffffff&amp;sample_size=96&amp;sample_text=Bookstore&amp;ft=liga&amp;acs_pt=32" rel="nofollow">Klavika</a> or <a href="http://www.stormtype.com/typeface-etelka-narrow-medium.html" rel="nofollow">Etelka</a>.</p>'
