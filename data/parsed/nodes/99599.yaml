    html: |-
      <p>Yes, the "w" and "M" especially are clotting.</p>
      <p>It's certainly true that the smaller the target size the more modulation you have to do, but the forms you have need <em>some</em> modulation for <em>any</em> size.</p>
      <blockquote><p>where can I find information about fixing that?</p></blockquote>
      <p>Here's one thing you can try:<br>
      <a href="http://themicrofoundry.com/ss_trapping1.html" title="http://themicrofoundry.com/ss_trapping1.html">http://themicrofoundry.com/ss_trapping1.html</a><br>
      Use a big Aperture and a low Multiplier.</p>
      <p>Also:<br>
      - Try moving up the tittles (dots of "i"/"j") to sit right above the top of the "t".<br>
      - I think the "6" and "9" would benefit from having a gap like some of your lc letters.<br>
      - You still need a lot of kerning.<br>
      - Your blank space could be a hair narrower.<br>
      - The parentheses are sitting too high, and the en-dash too low.<br>
      - The comma is out of character.</p>
      <p>And can we see a charset?</p>
      <p>hhp</p>
