      <p>I will try again using the flower trap method and I will post my result. Anyways, I don't know how far I can and should go.</p>
      <blockquote><p> - Try moving up the tittles (dots of "i"/"j") to sit right above the top of the "t".</p></blockquote>
      <p>Yes, I have considered that. There still is a lot of aligning to do... diacritics, punctuation marks and so on.</p>
      <blockquote><p> - I think the "6" and "9" would benefit from having a gap like some of your lc letters.</p></blockquote>
      <p> Good suggestion. I even think that more characters would benefit from that little gap, giving more consistency to the design.</p>
      <blockquote><p> - You still need a lot of kerning.</p></blockquote>
      <p> I know I know, and I haven't grasped the class kerning thing yet, so I'm manually kerning pairs... a pain in the a$$.</p>
      <blockquote><p> - Your blank space could be a hair narrower.</p></blockquote>
      <p>What do you mean by "blank space"? The advance width? the width of the "space" character perhaps?</p>
      <blockquote><p> - The parentheses are sitting too high, and the en-dash too low.</p></blockquote>
      <p>I designed the parenthesis to sit right on the baseline. In fact, the vertical stem goes straight from baseline to cap height, and then the curve protrudes from each end. The parenthesis is center-aligned to the characters inside... is this a wrong decision?</p>
      <p>What is the usual alignment height of the n-dash?</p>
      <blockquote><p> - The comma is out of character.</p></blockquote>
      <p>What do you mean?</p>
      <blockquote><p>And can we see a charset</p></blockquote>
      <p>I'm gonna try finishing some glyphs I have left and post a charset. Do you know any way of generating a charset in Indesign? I don't wanna type 400+ glyphs!</p>
