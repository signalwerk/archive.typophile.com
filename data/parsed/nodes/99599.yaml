    html: |-
      <p>Blank space: the blank space character (decimal 32).</p>
      <blockquote><p>I designed the parenthesis to sit right on the baseline.</p></blockquote>
      <p>Descenders are people too.  :-)<br>
      But you can have contextual alt parentheses that sit high for the caps.</p>
      <blockquote><p>What is the usual alignment height of the n-dash?</p></blockquote>
      <p>I think we had a thread about this recently; I myself put it at the same height as the hyphen - which you actually have at a good height.</p>
      <p>The comma: I meant it looks like it's from another font. In contrast, look at your nice straight quote.</p>
      <p>hhp</p>
