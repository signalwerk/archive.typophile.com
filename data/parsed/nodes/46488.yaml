  html: |-
    <p>Type Associates was formed in 1993 to provide typographic services to advertising agencies, graphic designers and publishers in the vicinity of its studios in Sydney, Australia. Its principal typographer Russell Bean is well known locally for a career devoted to all things typographic as well as stints on the executive committees of The Australian Type Directors' Club and the Australian Graphic Design Association and numerous awards for his typographic excellence. Type Associates has created a diverse collection of fonts which it markets through the following font vendors:</p>
    <p><a href="http://www.MyFonts.com" title="www.MyFonts.com">www.MyFonts.com</a></p>
    <p><a href="http://www.PhilsFonts.com" title="www.PhilsFonts.com">www.PhilsFonts.com</a></p>
    <p><a href="http://www.Fonts.com" title="www.Fonts.com">www.Fonts.com</a></p>
