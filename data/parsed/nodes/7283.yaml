    html: <p>I think the weight of the Rotis Bold does match better with your illustration. I don't think there is a big difference between the wider or narrower version of the T and L. However, to me, the striking thing about these Rotis caps is their apparent uniformity of width, which sets up a certain rhythm that is striking. You disturb that a bit by making the T and L wider.</p>
