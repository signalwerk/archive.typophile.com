    html: <p>Very nice work, i like it a lot. <br>From your proposals in the initial pdf you posted i favor variation A. The floating sinedots remind me of a mediterranean landscape. I agree with Ole that the circular cutout is too harsh, if you need to contrast the logo from the background i would go for a blurred and non-linear shape cutout. <br>Variation B is also nice, but a little too busy. Maybe if you would focus on the architectural reference, that is a great idea. <br>Variation C is too much like snow/winter to me. <br> <br>The logo is beautiful, once you got the spacing and kerning worked out one the type. Everything that i noticed has been mentioned by others before.</p>
