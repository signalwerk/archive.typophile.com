      <p>I agree with litera. </p>
      <p>The one at the bottom looks most promising to me. Perhaps consider styling C into an iris .. though it may come out cheesy. I would certainly drop the reflection and use same, sans serif type for both lines. Also the bottom line is kerned way too tight and it looks discomforting. Also 3 shades of blue in the way you have them is a one too many.</p>
