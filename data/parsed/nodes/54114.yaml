  html: |-
    <p>The purpose of this assignment is to develop a more acute understanding and appreciation for the intricacies of the letter forms that make up a typeface.</p>
    <p>The assignment was to create an upper and lowercase 27th letter of the western alphabet. The focus is on the stress, stroke, and serif of each individual letter, all of which contribute to the overall look, personality, and readability of the typeface.</p>
    <p>The typeface used was Times STD.</p>
