      <p>Ilene Strizver does great workshops and seminars through The Type Studio. She has held a number of "Gourmet Typography" workshops around the country and they always get a great response. The TDC has offered her workshop many times in NYC, with much success. I believe several AIGA chapters have hosted her workshops as well.</p>
      <p>I know she also does customized typography workshops for corporations as well.</p>
