    <p>I realize "typography workshop" is very vague, which is why I'm looking for input from others who have attended or even assembled workshops for events like TypeCon, et al. </p>
    <p>I'm on the board of directors for our local chapter of AIGA in Nebraska (USA). I'd like to consider hosting a one-day or two-day workshop that would allow our local design community to dive deeper into typography-related learning than what is available at most 4-year schools. Obviously I'm not looking to make them experts in 7 hours, but I would at least like to let them get their hands dirty doing something they wouldn't normally do.</p>
    <p>The key thing to keep in mind is that our community likes to be able to walk away with something tangible as a measuring stick of what they learned. We have less success with the abstract design lecturers (Ellen Lupton), and better success with speakers who offer something tangible (Jim Sherraden from Hatch Show Print brought his woodblocks for a printing workshop).</p>
    <p>Does anyone have any success stories to share, or ideas for topics that would be great for advanced non-type-designers? Modular typeface development? Lettering? Is anyone familiar with this: <a href="http://www.thetypestudio.com/workshops.html" title="http://www.thetypestudio.com/workshops.html">http://www.thetypestudio.com/workshops.html</a></p>
    <p>Thanks!</p>
