      <p>What I found quite rewarding – and truely tangible – when I held one-week seminars to undergraduate students was this: everyone to bring a dozen of potatos and a sharp knife. I provided simple A-Z sample sheets of some good typefaces. And the students were to cut these letters into the potato halfs and then stamped some posters with it. They enjoyed it very much and I think, one learns a good deal about type shaping from it.<br>
      Though this more a beginner’s exercise, naturally.</p>
