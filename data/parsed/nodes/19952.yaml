      <p>I am in search of font and type face creators who would like to sell their finished type faces and fonts to the end users- under the Angel Policy at my online Digital Art Images, Scrapbook Inspirations, Etcetera  consignment store. </p>
      <p>We offer a high percentage of the gross sales to our designers/ artists.  Our contract is very lenient. We do not require exclusivity.<br>
      We have a need for fonts and alphabets for the digital download paper craft and scrapbook industry.</p>
      <p>I would be thrilled to offer fonts and type faces online. It may generate a little bit of mad money for you.  I am an artist and not a font designer. So far, I 've enjoyed the freedom of selling my art work myself and have broken away from my licensing agreemnts. I am very happy to say that the new found freedom has inspired new creativity. </p>
      <p>We can get your product online within 2 weeks.  We can't fix your fonts, but if you have a font that is user friendly- and a limited key board:  A-Z, 0-9, !@#?~{}... it is good enough.</p>
      <p>Ronna Penner has had some success selling her fonts at Scrapbook-Elements. The fonts she offers at MyFonts.com are the expanded versions. Under her agreement with MyFonts.com she can also sell her scaled down versions at Scrapbook sites online.</p>
      <p>I am hopeful that some of you will be interested in offering your work at my store:  <a href="http://daisiecompany.com" title="http://daisiecompany.com">http://daisiecompany.com</a></p>
      <p>*** gina jane ***</p>
