      <p><em>If you have strong talents and skills in display face design (like Nick Shinn) you<br>
      can indeed make good money in retail. </em></p>
      <p>While it's true that it's generally easier to make money doing display faces (note that I said "easier," not "easy"), it doesn't mean there is no money in text fonts. There are independent font designers who specialize in doing text fonts and are doing well with it. </p>
      <p>Making any kind of retail font is something of a gamble. It may sell well, it may not sell at all. With a display font, you're risking some time and effort. With a big text and display family, you're risking a lot of time and effort, but the payoff can also be greater than with a display font. It takes a lot of successful display fonts to equal one successful font family. (Display fonts are more fun to do, though. :-)</p>
      <p>Regarding custom fonts: Yes, it is a more reliable source of income for a lot of professional font designers. But, it's like any other freelance creative work: The client sets the schedule and controls the creative direction. I worked as a freelance designer and illustrator for years, so I am very familiar and comfortable with this arrangement. But when I started having some success at selling retail fonts, I realized something about it: No client. Nothing against clients, but I found out that I really like working on my own schedule and having complete creative control, something I never really had before. If you can manage to get lucky sometimes and can live with the possibility that you may be completely wasting your time, doing retail fonts does have its pluses.</p>
