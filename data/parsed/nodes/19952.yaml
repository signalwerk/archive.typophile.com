      <p>Wow, sheesh! That would have been both incredibly depressing and alarmingly definitive. Heh.</p>
      <p>I guess as with everything, success with type might be a combination of raw talent and working one's derrière off. At least that's what I hope. </p>
      <p>To go off on my own tangent, I think what's most puzzling to me is that typography seems to be stuck in such a corner. Not to put down the subject altogether—it's definitely my favorite—but it seems like so much of the practice and the discipline is shrouded in some veil of mystery. For example: you'd think that because a huge proportion of the world is literate, many would be interested in the letterforms of their respective languages. I meet far too few people who actually understand even the most basic typographic principles, much less those who are as drawn to the topic as I am. When I finally stumbled upon this forum I was so relieved.</p>
      <p>And now that so much typography is digital, why is it so darn difficult to create a digital font? The process is so shrouded in nearly inexplicable technical detail; creating a good typeface design is one thing, but creating an effective font is far more difficult. I don't know where the root of this limitation lies, but it seems so unnecessary. Or maybe I'm naïve.</p>
      <p>I'll tie it all back to the original topic: I'm kind of concerned about the fact that I will have to make back a few hundred dollars worth of royalties in order to just break even. This is because when I created Bauer House, it seemed like it was working just fine on my machine, but t26 said that there were hours and hours worth of errors that needed correcting. So, I paid them out of pocket in advance to have these errors ironed out. Even after comparing their revision to my last draft, I am unable to figure out exactly what was changed. </p>
      <p>I kind of wish there was some way I could find out exactly how to properly create perfect digital typefaces, so that I would not have to spend actual money to have these errors fixed by one apparently more enlightened than myself...</p>
      <p>[ end bitching session ]</p>
      <p>- Josh (reminding himself to read his own sig)</p>
      <p>—æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ—<br>
      <strong>"Wishers and woulders be small householders."</strong><br>
      <em>—Wynkyn de Worde</em></p>
