      <p>Wow, Jill, thank you for that. I actually was hoping folks would post some rather spirited stuff, and yours was particularly helpful. I'm hoping I have "all of them"—and it would then be an honor to have you in my employ.</p>
      <p>Secondly, I posted on another one of my threads in regards to an idea; someone had pointed out that there might be some hinting problems with the typeface and I wanted to see if I could find an independent expert who would be willing to take a look at the font, if only to examine whether or not there were vast improvements made to it by T-26. I'd really like to perfect this typeface, because it means a lot to me, and with tweaking I think it can be better than it already is (at least on screen). </p>
      <p>Thirdly, I found in my contract that I'm actually still allowed to sell the typeface myself as long as I'm selling to end users only. This is good news. I could then put a little PayPal thing on my website and have a way to sell the font to those who want to buy it directly from the guy who made it. I could sell it at the same price and I wouldn't have to forfeit any of the proceeds. Then, T-26's value will be in selling the font to those who would not ordinarily see it on my site or otherwise. So I think I'm going to do that soon if anybody's interested.</p>
      <p>- Josh</p>
