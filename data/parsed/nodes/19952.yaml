    <p>Hey folks, </p>
    <p>I just released my first typeface for sale through t26, <a target="_blank" href="http://www.t26.com/fonts/display.php?f_id=935" rel="nofollow">Bauer House</a>. I'm somewhat new to the forums here, and to some degree I wish that I'd attempted to absorb some of the knowledge that all of you have in advance of making any distribution decisions about the typeface. But, just to start, I wanted to know if anybody has worked with t26 / Segura Inc. before and if anyone can offer any useful feedback in regards to business arrangements, etc. </p>
    <p>Secondarily, I'd like to start a sort of sub-discussion—although I'm sure this has been done many times over—about the business of type; is there as much of a typographical "elite" as there seems to be? Is it truly impossible to achieve monetary success through typography? In all honesty, for me, it's not cash that I'm after, per se; I just wonder who purchases type in the greatest volumes, and whether anyone has any sort of insight as to how well any licensing agreements actually do work. Having seen the amount of font piracy on the Internet (and all of the typographic piracy that has existed ever since the era of Gutenberg), it's just a bit intimidating. More than financial reward, I just want to be able to say that I've contributed some quality type to the world. I'd rather see a font of mine turn up somewhere influential than receive a tremendoid royalty check. But on the other hand, I don't want to get taken advantage of...</p>
    <p>Before I ramble on further, let's start some sort of loosely-integrated discussion, and maybe it'll branch off in interesting directions!</p>
    <p>- Josh Korwin</p>
    <p>—æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ——æ—<br>
    <strong>"Wishers and woulders be small householders."</strong><br>
    <em>—Wynkyn de Worde</em></p>
