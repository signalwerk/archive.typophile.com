      <p>Wow, thanks Jon! That'd be splendid. Heck, I'd be thrilled even if only you bought it. That's enough validation for me to feel like the whole thing is more than worthwhile. Hopefully more folks feel that way, though. ;)</p>
      <p>Yup, I mostly dealt with Carlos Segura for the creative portion of the discussion, but I was referred to other staff members for matters such as the contract and other technical stuff. Mr. Segura seems to be the one who had approved of the typeface in the first place. Everyone there is pretty friendly. The only real issue I had was that I had to keep up on things myself—and act a bit of a pest in the process—in order to catalyze progress. In general, though, as Tamye had said, it really does pay to be proactive, especially when dealing with something that one has such a vested interest in.</p>
      <p>With regards to software, so far I don't think I've really perfected my workflow. And I think this is something that contributed to me not knowing exactly how to best tweak the font before its final submission. I draw all of my glyphs in Illustrator (since I'm very comfortable with the interface) and then import them into FontLab piece by piece. The first issue that I initially came across was realizing that fonts still need to have some sense of scale, even though they are vector curves. Just by happenstance, the size of the glyphs I drew in Illustrator was something like three or four times the size of the "default" greyed-out characters in the FontLab table. So when I realized what the conversion ratio was, I applied the same scale percentage to each glyph before exporting each one to EPS and dropping it into FontLab. The whole thing seemed really clumsy and inefficient to me, and I feel like a complete n00b admitting to it now (but hopefully someone will drop some hints as to what I should do in the future). From that point, once all the glyphs were in FontLab, I did my tweaks and such within that program to save time and energy. I'm actually working on a new typeface now based on Bauer House but with a much more sleek, geometric feel, and multiple weights. I know, though, that I'm going to run into the same scale issue, because I based this new one off of the same Illustrator file that I used to draw Bauer House. [If anybody else knows of a better way for me to work, I'm open for suggestions!]</p>
      <p>Anywho, thanks again for the encouragement! I hope I'm of some help too. We're all in this together, typophiles.</p>
      <p>- Josh</p>
