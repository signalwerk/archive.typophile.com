      <p>Jon,</p>
      <p>I first generated a graphic to show off the typeface itself, which I will attach to this post. They wrote back a few days later and let me know that they were interested in the font and would like to see a PDF sheet of all the characters, since T26 has a minimum character set that they require for all typefaces. I was not yet done with the font, so I let them know that I would work as quickly as I could to generate it and that I would send it soon. I finished up the font (or so I thought) and sent them a character sheet in PDF format. Then I was told that I would have a much better chance of selling the font if it contained a lower case as well. I had originally designed it to only be used for upper case titling, and I had included a very small caps weight to be used as a companion (instead of a lower case). Following their advice, though, I created a lower case, finished up the complete T26 character set, and attached that, along with some samples of the typeface in use, to the email. Eventually they said that it was good to go and that I should give them the files that I generated along with the master files. I then got into the long process of discussing whether or not my font could be distributed solely as OpenType. This lasted a few weeks. Eventually they said it was possible, so I gave them the files, and they reviewed them. They got back to me 10 days later and gave me the list of repairs that needed to be made, and gave me the quote for the fee. I questioned it, and they told me that it was something that I <em>should</em> do if I am concerned at all with the quality of the typefaces that I produce. I decided to pay for them to make the fixes. 20 days later, after prodding, I was given the typeface in its repaired form, and it was posted online a few days thereafter.</p>
      <p>Their initial response to my first sketch was on 2/4/2006, and the typeface was posted on 5/15/2006, I think. So the whole thing took a while, partially because I hadn't completed the typeface in advance, but mostly because they took forever to get back to me, most of the time. Usually I would have to send multiple emails to have questions or concerns answered. They had even fixed the font and told me it was going to be posted soon <em>in advance of signing a contract with me</em>. I emailed them immediately to let them know that I would like to a) see the font first, and b) sign an actual contract before they went about selling the font on their site. They complied after that, but I was a bit shaken up by the fact that I had to tell them to do this. I felt silly at that point having given them the full files before having a signed contract.</p>
      <p>I hope this helps!</p>
      <p>- Josh</p>
