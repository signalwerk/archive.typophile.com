      <p>I actually thought that was fairly suprising, too, Thomas. That's why I thought, "What am I missing? What don't I know?" Because for some of the smaller fixes, I felt like someone could just say "hey, check this box instead of this box" and I'd just be able to do it myself. The "task list" was mostly non-specific, so while they named the category of error, I really didn't know precisely what about my version wasn't correct.</p>
      <p>That's part of what made me feel a little bleh about the whole thing. If it's all the same to them, I could have been told roughly what the errors were, and it would have saved them the trouble of having to worry about it. Instead it seemed like they definitely wanted the business, and that it was in their best interest to have the billable hours. So while I don't necessarily think I was ripped off, per se, I think that they may see the technical repair part of their business as being another viable source of income in addition to the resale of fonts.</p>
      <p>(Side note: I'd spent a lot of time on the kerning myself before giving them the files, so maybe only a few characters required touching up in their eyes. Perhaps that has something to do with that particular thing.)</p>
