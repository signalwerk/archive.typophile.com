      <p>Josh,</p>
      <p>I would suspect that telling you what or how to fix things may take longer than just fixing the things themselves. If you were their child (employee), it would be worth while to teach you to tie your own shoes laces. But if it's someone else's kid it's better to just tie it and keep the kid from tripping and falling on it's face than to try and explain.</p>
      <p>Selling a font can pay off tremendously. Or not. You can't tell which will catch on (think Remedy) and make you a fortune, or fall away and be forgotten (and perhaps have been your favorite and biggest labor). You may be the next Emigre, House, P-22. Or just be disillusioned after one font and quit.  </p>
      <p>But I wouldn't even bother with "you’d think that because a huge proportion of the world is literate, many would be interested in the letterforms of their respective languages." That's like saying because a huge proportion of the world has sewage systems, people should be more interested in plumbing. To the majority of type users pecking away on their computers type is just a means to an end. Just like plumbing is to me. The amount of people who have a greater interest than "copper, lead, or PCB ?" are few and far between. Just make it flush, please. </p>
      <p>You'd better love it! </p>
      <p>Whether you make money at it or not will greatly depend on how good a business person you are, how much you worship Mammon, how great your perserverance is (at learning the software for instance) and continuing to develop the other aspects of your craft. And maybe even how big your ego-fulfillment needs factor in  (anyone who speaks at every conference going and always has to be heard or seen probably has this paradigm). I know talent DOES figure in there somewhere, but I hate to say it that the other things can be just as important, or even more important, for Success.  </p>
      <p>The business/art isn't 'shrouded' in secrecy or obscurity. I have yet to learn anything about Python scripting (and I'd really like to) or any number of the more techie things about fonts, but that's just because other things have distracted me, my time and attention. You'll figure it all out if you just stick with it. Programming is not my thing so it's probably always going to seem a bit alchemical.</p>
      <p>The typographical "elite" is a funny concept. There are people who have been at it at a long time and/or are very accomplished. We all have our heros. Because typography is really such a small niche in graphic design (which is a small niche of design, art, advertising, manufacturing, etc)., it is actually very easy to access them, to speak with Carlos Segura, or Matthew Carter, or even Robert Slimbach (which was a little like playing hide and seek). It ain't rock n' roll.</p>
      <p>Personally, I don't think designing type is a great way to plan to earn a living in and of itself, because the market is incredibly flooded by fonts, good and bad (mostly bad, amateurish fonts made by people who know little about letters), and will only become more so and this devalues them in general as well. Of course the market is also broader which helps, but probably primarily at the lower levels. It just has to be taking work and income away from better type designers that there are so many of them, although most of the great ones that I know are pedaling as fast as they can to stay ahead in various ways. The greater number of bad fonts would actually provide hope and a market for the good faces if it weren't that aspiring designers in schools are taught less and less about good typography and can't tell the difference, I'm convinced. Some just want to break the rules.</p>
      <p>Most  of the BIG successful new foundaries really broke loose, got in the door, with the initial explosion of digital type. I don't think it will be as easy for subsequent type designers to get so big as easy....unless another technology comes along. That always changes everything.</p>
      <p>Since I'm on a rant, I also think we'll see further flooding of fonts coming from other countries, sold on the internet without the customer even knowing who or where they are buying from. Globalization.  South America is on track and producing some great stuff. But how about when China or other places with much lower standards of living start producing original fonts, where $1 a font would look like a fortune and would be a day's or a week's income? (and where they are really into pirating without scruples?). Don't think they don't get Roman (or any other type of) letters: Akira Kobayashi is an ace (and is fortunately in Linotype's hand). We can't see what is actually coming in 5, 10 or 20 years but it doesn't hurt to try. After all, that's what you are looking at isn't it? </p>
      <p>If you have enough drive, business sense, desire for money, perserverance, talent...and the love of letters (or a large amount of two or three of them), you should be able to find success on your own terms. </p>
      <p>And if you have all of them, I want to work for you!</p>
      <p>Jill</p>
    html_clean: |-
      <p>Josh,</p>
      <p>I would suspect that telling you what or how to fix things may take longer than just fixing the things themselves. If you were their child (employee), it would be worth while to teach you to tie your own shoes laces. But if it's someone else's kid it's better to just tie it and keep the kid from tripping and falling on it's face than to try and explain.</p>
      <p>Selling a font can pay off tremendously. Or not. You can't tell which will catch on (think Remedy) and make you a fortune, or fall away and be forgotten (and perhaps have been your favorite and biggest labor). You may be the next Emigre, House, P-22. Or just be disillusioned after one font and quit.  </p>
      <p>But I wouldn't even bother with "you’d think that because a huge proportion of the world is literate, many would be interested in the letterforms of their respective languages." That's like saying because a huge proportion of the world has sewage systems, people should be more interested in plumbing. To the majority of type users pecking away on their computers type is just a means to an end. Just like plumbing is to me. The amount of people who have a greater interest than "copper, lead, or PCB ?" are few and far between. Just make it flush, please. </p>
      <p>You'd better love it! </p>
      <p>Whether you make money at it or not will greatly depend on how good a business person you are, how much you worship Mammon, how great your perserverance is (at learning the software for instance) and continuing to develop the other aspects of your craft. And maybe even how big your ego-fulfillment needs factor in  (anyone who speaks at every conference going and always has to be heard or seen probably has this paradigm). I know talent DOES figure in there somewhere, but I hate to say it that the other things can be just as important, or even more important, for Success.  </p>
      <p>The business/art isn't 'shrouded' in secrecy or obscurity. I have yet to learn anything about Python scripting (and I'd really like to) or any number of the more techie things about fonts, but that's just because other things have distracted me, my time and attention. You'll figure it all out if you just stick with it. Programming is not my thing so it's probably always going to seem a bit alchemical.</p>
      <p>The typographical "elite" is a funny concept. There are people who have been at it at a long time and/or are very accomplished. We all have our heros. Because typography is really such a small niche in graphic design (which is a small niche of design, art, advertising, manufacturing, etc)., it is actually very easy to access them, to speak with Carlos Segura, or Matthew Carter, or even Robert Slimbach (which was a little like playing hide and seek). It ain't rock n' roll.</p>
      <p>Personally, I don't think designing type is a great way to plan to earn a living in and of itself, because the market is incredibly flooded by fonts, good and bad (mostly bad, amateurish fonts made by people who know little about letters), and will only become more so and this devalues them in general as well. Of course the market is also broader which helps, but probably primarily at the lower levels. It just has to be taking work and income away from better type designers that there are so many of them, although most of the great ones that I know are pedaling as fast as they can to stay ahead in various ways. The greater number of bad fonts would actually provide hope and a market for the good faces if it weren't that aspiring designers in schools are taught less and less about good typography and can't tell the difference, I'm convinced. Some just want to break the rules.</p>
      <p>Most  of the BIG successful new foundaries really broke loose, got in the door, with the initial explosion of digital type. I don't think it will be as easy for subsequent type designers to get so big as easy....unless another technology comes along. That always changes everything.</p>
      <p>Since I'm on a rant, I also think we'll see further flooding of fonts coming from other countries, sold on the internet without the customer even knowing who or where they are buying from. Globalization.  South America is on track and producing some great stuff. But how about when China or other places with much lower standards of living start producing original fonts, where $1 a font would look like a fortune and would be a day's or a week's income? (and where they are really into pirating without scruples?). Don't think they don't get Roman (or any other type of) letters: Akira Kobayashi is an ace (and is fortunately in Linotype's hand). We can't see what is actually coming in 5, 10 or 20 years but it doesn't hurt to try. After all, that's what you are looking at isn't it? </p>
      <p>If you have enough drive, business sense, desire for money, perserverance, talent...and the love of letters (or a large amount of two or three of them), you should be able to find success on your own terms. </p>
      <p>And if you have all of them, I want to work for you!</p>
      <p>Jill</p>
