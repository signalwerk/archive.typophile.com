      <p>Josh, congratulations on your typeface. It's a great achievement to have a font in release, and I hope it sells well for you.</p>
      <p><em>Their initial response to my first sketch was on 2/4/2006, and the typeface was posted on 5/15/2006, I think.</em></p>
      <p>I agree with Dan - the release of your font was quite speedy, especially for a large foundry.</p>
      <p>T-26 gave you some good marketing-related advice. Fonts really do sell better with a lowercase, even when they are originally intended for titling. And while OpenType is rapidly gaining acceptance, PS and TT are still very much in demand. Many designers and foundries are offering all 3 formats, as OT-only can be a tough sell.</p>
      <p>I can't comment on the quality or technical problems that your font might have had initially. I do know that 90% of fonts submitted to most foundries require quite a bit of work to get them ready for market. Some submitted fonts have severe technical issues that take many hours to repair.</p>
      <p>As long as you are dealing with a reputable foundry, it's OK to send font files for review purposes. They need to be able to take a close look under the hood before deciding whether or not to publish your font.</p>
      <p>I know it can be frustrating when communication isn't what you hoped for. You did the right thing by keeping on top of it. It's your font, and you care the most about it. The fact that it was released so quickly means your efforts paid off.</p>
      <p>Next time should be easier - good luck!</p>
