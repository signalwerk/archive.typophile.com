    html: "<p>Hey if I can add my two cents:  I don't have a problem understanding your concept and name, though I must admit because \"mintchaos\" is one word, it can have a tendency not to resonate clearly upon initial glancing... <br> <br>As for the altered \"g\": I think the reason why some people have a problem with it, is because it sticks out and seems to aggravate a seemingly cohesive and symmetrical design...perhaps this can be remedied by having the logo graphic be unsymmetrical in some way.  If some other part or section between the graphic and the typography were not so balanced, the altered g would not cause such a stir...this is what I see in my mind's eye, so forgive me if reality proves this advice otherwise...but I do feel you are very close to having this solution finalized.</p>"
