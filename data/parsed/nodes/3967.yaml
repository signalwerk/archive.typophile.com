    html: "<p>First off, thanks to all of you for your comments, they have been quite helpful.   <br> <br>I'm working on some new versions of the type that I should have ready to post tomorrow sometime. Trying to visually break up mint and chaos to increase recognition, without hurting the flow of the design.  <br> <br>I'm trying some versions that don't have 'design' in them at all. Because that is not all I do, and because it will make the logo more versatile. I am not pleased at all with how the above version looks horizontally.  <br> <br>I'm also trying some other fonts, although I really like <a href=\"http://www.myfonts.com/fonts/t26/target/\"> Target</a>. I keep coming back to it. I'll show you were all of that is going tomorrow. <br> <br>As far as the symbol goes, I'm in love with it, and doubt it will change. I think it will serve me well over time. Everyone seems to see different things in it: Darth Vader,  origami, a rocketship, a kite, a KKK mask, a nun. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Daniel: I really like this color of green. And while it isn't 'mint' in the artificial sense of the word it isn't all that far off from the <a href=\"http://www.pbs.org/wgbh/nova/shamanactivity/amazon4.html\"> real thing</a>. <br> <br>Scott: I took the shading out of the symbol to purify the internal shapes. I'm still undecided over which one I like better. I think both styles work well.</p>"
    html_clean: "<p>First off, thanks to all of you for your comments, they have been quite helpful.   <br> <br>I'm working on some new versions of the type that I should have ready to post tomorrow sometime. Trying to visually break up mint and chaos to increase recognition, without hurting the flow of the design.  <br> <br>I'm trying some versions that don't have 'design' in them at all. Because that is not all I do, and because it will make the logo more versatile. I am not pleased at all with how the above version looks horizontally.  <br> <br>I'm also trying some other fonts, although I really like <a href=\"http://www.myfonts.com/fonts/t26/target/\" class=\"link-external\"> Target</a>. I keep coming back to it. I'll show you were all of that is going tomorrow. <br> <br>As far as the symbol goes, I'm in love with it, and doubt it will change. I think it will serve me well over time. Everyone seems to see different things in it: Darth Vader,  origami, a rocketship, a kite, a KKK mask, a nun. <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Daniel: I really like this color of green. And while it isn't 'mint' in the artificial sense of the word it isn't all that far off from the <a href=\"http://www.pbs.org/wgbh/nova/shamanactivity/amazon4.html\" class=\"link-external\"> real thing</a>. <br> <br>Scott: I took the shading out of the symbol to purify the internal shapes. I'm still undecided over which one I like better. I think both styles work well.</p>"
