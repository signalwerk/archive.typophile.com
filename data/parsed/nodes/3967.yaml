  html: "<p>Here's the first draft of the logo/identity I am working on for my personal design firm Mintchaos. <br> <br><b>Note:</b> I apologize for the links instead of embedded images. I couldn't get them to work. <br> <br>Figures one and two show the two variations I'm working with. I started with #1 but my preference has been leaning towards #2. There are also small version of both to show how they read at very small sizes. <br> <br><a href=\"http://outbox.staging.mintchaos.com/logo/mc.1.logos.gif\"> Figures one and two</a> <br> <br>Figure three shows some colors: <br> <br><a href=\"http://outbox.staging.mintchaos.com/logo/mc.3.colors.gif\"> Figure 3 - color test</a> <br> <br>Figure 4 is a business card mockup (There is also a <a href=\"http://outbox.staging.mintchaos.com/logo/mc.4b.bcard.gif\"> version of the bcard using the logo from figure 2</a>: <br> <br><a href=\"http://outbox.staging.mintchaos.com/logo/mc.4.bcard.gif\"> Business card mockup</a> <br> <br>And now that you've seen it, a bit about the Mintchaos and the logo.  <br> <br>Mintchaos is my personal design firm. Our main focus is web but we do some of everything. The short version of my web-design philosophy is that everything should be done in the cleanest and most technologically \"correct\" way I can. This includes adherence to web-standards, accessibility, future-proofing, etc. while at the same producing visually appealing solutions that lack needless complexity. I probably sound like a pompous ••• saying it. but that's what I do. <br> <br>The logo is only made up of only one primary triangle, the one used for the wings. The shapes in the middle are made from the triangle. The triangle it self is a golden triangle. And the shapes in the middle are <a href=\"http://mathworld.wolfram.com/PenroseTiles.html\">Penrose Tiles</a> (these tiles can cover an infinite space and never create a repeating pattern).  There are only two edge lengths used in the entire logo, and they are the <a href=\"http://www.google.com/search?ie=ISO-8859-1&amp;q=the%2Bgolden%2Bratio\">golden ratio</a>. Mathematically speaking the longer length is 1 +  Ø long and the shorter length is 1 + 1/Ø long. (Not exactly the correct symbol for phi, but this forum eats HTML entities.) <br> <br>The goal of the logo was to create a simple and recognizable mark that betrayed the complex exactness that it is built on. Which is what I try to do. <br> <br>That said, have at it!  And thank you in advance for your thoughts!</p>"
