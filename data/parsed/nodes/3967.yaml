r create a repeating pattern).  There are only two edge lengths used in the entire logo, and they are the <a href=\"http://www.google.com/search?ie=ISO-8859-1&amp;q=the%2Bgolden%2Bratio\" class=\"link-external\">golden ratio</a>. Mathematically speaking the longer length is 1 +  Ø long and the shorter length is 1 + 1/Ø long. (Not exactly the correct symbol for phi, but this forum eats HTML entities.) <br> <br>The goal of the logo was to create a simple and recognizable mark that betrayed the complex exactness that it is built on. Which is what I try to do. <br> <br>That said, have at it!  And thank you in advance for your thoughts!</p>"
