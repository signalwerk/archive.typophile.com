    html: "<p>Tanya: I would say that the chaos part is all about the inspiration. Pulling all the random pieces together and 'mint'ing them into something well defined. Also it ties in with the use of penrose tiles(unrepeatable patterns), and golden ratio (an irrational number). <br> <br>Pronunciation: It is pronounced mint-chaos. I don't think I'll have a problem with people getting it. I've been operating under the name for a few years. <br> <br>Paul: Thank you for your comments, and yes, this mark has been harder for me than anything else I've worked on. I've revised it to not be tracked so loosely. I'm pretty sure I can see the value, but if anyone can explain (or point me to some information) about why, from a typographical standpoint this is unwise I'd love to hear it. Typography is one of my weaker design areas and is something I'm trying to learn more about.  <br> <br>Here are the new, and probably final versions. I've decided to go with the original (fig 1 above) design). I think it's stronger and more focused. And as a friend said \"#1 looks like an 'M' but #2 looks like <a href=\"http://homestarrunner.com/vcr_pp.html\"> Pom Pom</a>. I have toned down the 'g' in design a bit as Andrew suggested. <br> <br>The colors are still up in the air somewhat. Except for that green, I really like that. <br> <br>I want to print the ghosted repeating line that is behind the logo in the business card as a spot varnish, not as an actual inked color/value. <br> <br>Thank you all for your input! And if you have any more thoughts I'd love to hear them. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/32205.gif\" alt=\"MClogocombindedfile\"></p>"
