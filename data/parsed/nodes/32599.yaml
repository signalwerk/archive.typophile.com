      <p>I can't quote the specific problem, as I had it a few months ago... if i recall correctly, the "current" version of Ravenscroft (1.2) is a Windows TrueType download; yes, it _should_ work fine in OS X, and I think it will if I install it directly into the System's font folder(s), but FontAgent Pro and Linotype's FontExplorer both had difficulty with it -- it would not flag it as a "bad" or "corrupted" font, but the font wouldn't render (choosing it from the menu just got you geneva or whatever the default font is). Couldn't access/convert to the outlines in Illustrator either. I believe that I got it working (after a couple of tries and downloads) in FontAgent Pro, but unfortunately, my employer is cheap and we're running FontExplorer on most of the machines here (I bought my own copy of FA Pro 'cuz I love it).</p>
      <p>My workaround at the time was to open the TTF in FontLab and regenerate it as an OpenType font to install on the four machines that needed it at the time (an old-time circus project that Ravenscroft fit well into). Don't worry, I haven't distributed it or anything.</p>
      <p>Now we're working on a Style Guide for a major Hollywood Studio (name withheld), and as we were putting forth ideas for "offical" typefaces, Ravenscroft was one of the choices a designer threw in. It _would_ have been a great choice (free and all), but the Client Studio in questions is NOT Disney -- and they wouldn't appreciate us using a font with Disney logos embedded in it, downloaded from "disneyfonts.com", etc.</p>
      <p>My crisis erupted when the client asked us where they could get some of the fonts we were using... I didn't even know they had _seen_ them, much less decided which one(s) they wanted to use. So I had to scramble up an alternative that same day (thanks to you all who helped) to cover our butts.</p>
      <p>I agree that (MyFont.com's) Rubens is an inferior implementation to yours, but I couldn't in good conscience let the Studio use it and discover the Disney connection down the road. It's also safer legally to tell licensees to purchase a font for themselves rather than download a "free" one (there's no way to know wich version they might download, and I couldn't find any specific legal/license that applies to Ravenscroft -- is it public domain, is it freeware, is it only for personal use...?)</p>
      <p>Thanks for both the info and the original font... it's very much still in my library.</p>
      <p>Have you any plans for an OTF update?</p>
