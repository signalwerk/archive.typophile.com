      <p>Thanks Scott for sharing your troubleshooting details. I hadn't tried Ravenscroft in FontExplorer. I'm wondering if the embedded logos could be causing your grief in that area too, since a few of them have tons of compound outlines.</p>
      <p>My plan for the next version of Ravenscroft is to move all of that Disney stuff into its own font and finish the rest of the character set. It will definitely be OpenType, with stylistic alternates.</p>
      <p>Regarding the license, the only real guideline is in the text file where it does say "for personal use," mainly due to the trademarked logos within. But nobody reads the text file, and inevitably it's been sighted in plenty of commercial work. We don't really mind.</p>
      <p>I once licensed a logo-free version of Ravenscroft for a publishing company. If you're interested in working something out, please feel free to contact me either through <a href="http://mickeyavenue.com/fonts/contact/" rel="nofollow">my website</a> or my <a href="http://typophile.com/user/2438/contact" rel="nofollow">Typophile contact page</a>.</p>
