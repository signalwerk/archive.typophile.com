    <p>Hi, folks! Been lurking a while now, but this is my first post here...</p>
    <p>I need a little ID help... the (fairly) public-domain font Ravenscroft is based on an existing design, but for the life of me, I can't remember the name. I need a true commercial version for a project I'm working on. If you don't know, Ravenscroft was created and available at <a href="http://www.tombsweettomb.com" title="www.tombsweettomb.com">www.tombsweettomb.com</a> as a "Haunted Mansion" font, but it's now only available from an aol site (disneyfonts); the "current" version (I have no idea how old it really is) is PC-Truetype only, and it works like cr*p on Mac OS X.</p>
    <p>I actually worked on a Fontographer version years ago, then found Ravenscroft and ditched my effort. I'll wager I left all me research scans/files on that old 68040 mac as well.</p>
    <p>Thanks in advance for any help!</p>
