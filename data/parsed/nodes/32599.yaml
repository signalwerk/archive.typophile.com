      <p>Ravenscroft was indeed inspired by variations of the analog Rubens typeface. It was created by myself and Tim McKenny, in an attempt to emulate the particular style used in the signage at Disney's Haunted Mansion attractions. Its current 'home' is at <a href="http://mickeyavenue.com/fonts/ravenscroft/" title="http://mickeyavenue.com/fonts/ravenscroft/">http://mickeyavenue.com/fonts/ravenscroft/</a></p>
      <p>The Wooden Type digitization available on MyFonts appears to be based on a rather rough source. The only other commonly available digitization I know of is on Dan Solo's Victorian Type book/CD.</p>
      <p>The PC-TrueType version of Ravenscroft should work under Mac OS X, I've never noticed any problems. The old Mac version was ported by someone else, and I've never used it myself. If you would let me know what kind of trouble it's giving you, I might be able to repair or generate a different format.</p>
