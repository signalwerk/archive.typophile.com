      <p>Thanks... saved my bacon, so to speak, as the client wanted to know where they could get the font, and I never intended it to be "official."</p>
      <p>Rubens is close enough for my immediate crisis, but i have to wonder if there isn't another cut of this face out there. While legibility is not a word I would use describing either face, Rubens is a little heavy-handed for me personally (serifs are shallow, general angularity to the letters like lowercase "s", very short ascenders - or high x-height). The lowercase "t" and "f" are almost unreadable. </p>
      <p>I know that there is a non-digital version of this, I think as photo or metal type, out there somewhere (not that it does me any good on my Mac)... guess this is my excuse to unpack my vintage specimen books, as I can picture this face (non-condensed) in my favorite, from 1907 or so.</p>
      <p>The hunt continues! Set loose the dogs, jeeves!</p>
