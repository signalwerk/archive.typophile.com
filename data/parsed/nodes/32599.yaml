      <p>In case my first post was missed, I am the co-author of Ravenscroft, and can attest that Ravenscroft was based on Rubens, not Macbeth (is there a condensed weight of Macbeth?).</p>
      <p>To the best of my knowledge, Rubens was a Victorian-era typeface from the 19th century, produced in several weights. Ravenscroft is a fairly accurate revival of a condensed weight of Rubens.</p>
      <p>The version of Rubens sold on MyFonts is another independent revival. Unfortunately it seems to have been based on a rough source and lacks many of the font's finer details.</p>
      <p>Other digital versions of Rubens can be found in the aforementioned Dan X. Solo book/CD and an <a href="http://www.castcraft-software.com/designer3/designer3.11.html" rel="nofollow">extra-condensed weight</a> from the famously elusive <a href="http://www.castcraft-software.com/homepage.html" rel="nofollow">Castcraft Software</a>.</p>
      <p>Scott, if Ravenscroft is not working properly for you on Mac OS X, I would be interested to know what specific issues you are having. Even if you have reservations about using it for your project, it would be nice to improve future versions for Mac users.</p>
    html_clean: |-
