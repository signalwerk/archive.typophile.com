    html: |-
      <p>I downloaded the PDF when you first posted it, then got distracted and didn't follow up. I like it in general. A Goudy-like feel.</p>
      <p>A few random, non-exhaustive thoughts:</p>
      <p>LC e is perhaps a bit too closed<br>
      LC f needs a stronger crossbar<br>
      LC g is too noose-like. As Gary Munch keeps telling me: "Think of the bowl as if the counter were to be a soft triangular form." The upshot: raise the right side of the lower bowl.<br>
      LC r is a bit too wide<br>
      LC s and c don't show the same angle of movement. The s is too upright.<br>
      LC u us perhaps a bit too wide<br>
      LC x may be too wide, depending on your final spacing</p>
      <p>UC K (and perhaps also lc) has the leg too low and droopy.</p>
      <p>Curly braces are too shy. </p>
      <p>The cross bar in the 4 being warped just doesn't work for me.</p>
      <p>What is the D with the tilde?</p>
      <p>The grave accent isn't right. Check your curve's direction.</p>
