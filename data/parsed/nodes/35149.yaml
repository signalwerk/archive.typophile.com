    <p>This is my not-quite-first typeface. I'd like to hear the views by some more seasoned type designers. I'm more concerned with the letterforms, as I haven't put a huge amount of time into spacing yet, but feel free to comment on any aspect.</p>
    <p>EDIT (text-sample.pdf): Changed shapes of efgrstuxzK and Eth. Fixed grave direction. Spaced lower- and uppercase. Haven't done kerning yet.</p>
