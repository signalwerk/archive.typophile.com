    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Bruce Type Foundry</strong></p>
    <p>Founded in New York by Scottish immigrants <a href="/wiki/George%20Bruce" class="freelinking" rel="nofollow">George Bruce</a> and his brother <a href="/wiki/David%20Bruce" class="freelinking" rel="nofollow">David Bruce</a> in 1813, later joined by David’s son.</p>
    <p>In 1838 the foundry made a major advance in typefounding: <a href="/wiki/David%20Bruce%2C%20Jr." class="freelinking" rel="nofollow">David Bruce, Jr.</a> patented the Pivotal Typecaster in 1845. It made 6,000 pieces of type per hour, a rate that so threatened the employment of many handcasters that a group of them plotted to destroy the machine. The device was used by other typefounders, notably <a href="/wiki/Miller%20%2526%20Richard" class="freelinking" rel="nofollow">Miller &amp; Richard</a>.</p>
    <p>The foundry was acquired by <a href="/wiki/ATF" class="freelinking" rel="nofollow">ATF</a> in 1901.</p>
