    html: |-
      <p>Thanks Kent De Apologisto. Also:</p>
      <p><a href="http://www.engadget.com/2009/06/12/font-bureau-takes-credit-for-palms-cu" title="http://www.engadget.com/2009/06/12/font-bureau-takes-credit-for-palms-cu">http://www.engadget.com/2009/06/12/font-bureau-takes-credit-for-palms-cu</a>...</p>
      <p>&gt;Font Bureau takes credit for Palm's custom 'Prelude' fonts; our hearts melt</p>
      <p>I'm sorry the writers expressed it this way, or didn't read our release far enough?</p>
      <p><a href="http://typophile.com/node/58935" title="http://typophile.com/node/58935">http://typophile.com/node/58935</a></p>
      <p>Ascender Corporation was also integrally involved in the project though with was not mentioned in our release.</p>
      <p>As for the details of style:</p>
      <p>The uppercase I with serifs was presented to the client and remains as an alternate. The lowercase L with a tail was presented as well, and the client dismissed it for stylistic reasons on their own. I did not discourage them as the tailed l.c. single stroke and serif u.c. I character designs are nice until they gather in words.</p>
      <p>While some people may believe firmly enough to <em>only</em> supply tailed and seriffed versions of these letters, regardless of the size range of use or distance of the user, I remain skeptical of such an extreme view, preferring apparently now unconventionally that words are more important to readers than letters at nearly any distance and size. </p>
      <p>Cheers!</p>
