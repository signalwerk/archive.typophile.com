      <p>I was prepared to turn this job down when the VP of engineering sent me an email. He responded that this was not going to be like Windows or the Mac. I was skeptical, so I ticked off a list of capabilities that I felt were required in any model modern device, desktops included, to make me (users) happy. (I ticked off exactly the same list here sometime ago to dead silence). This client though, he said "We can do that... all of it!" The Pre is typographically for real: it uses TT, it scales according to code, it's got a sweet rendering, OT is supported and feature acceptance expanding, 180 dpi!, integer metrics, font fidelity and open. </p>
      <p>I hear what's being asked of the some-serif, and will endeavor to please, thank you. </p>
      <p>Read on! Hug a Tree!</p>
      <p>Cheers!</p>
