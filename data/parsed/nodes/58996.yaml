    html: |-
      <p><em>...they’ve lasted in the market for sometimes a century. Is something else happening too</em></p>
      <p>A few new things are happening. One is contracted text messaging, in which letters and also numerals are being used in novel ways, such that individual letter differentiation becomes more critical than in word recognition supported by familiarity and context. Another is the proliferation on non-linguistic informational text such as URLs, file names, etc. -- including critical information such as indicators on flight control monitors -- , requiring quick identification of individual letters rather than normal reading.</p>
      <p>I don't think there is an a priori problem with styles of lettering that make less differentiation between forms than other styles of lettering. Just choose the style that is appropriate to the functional requirements of the typography.</p>
    html_clean: |-
