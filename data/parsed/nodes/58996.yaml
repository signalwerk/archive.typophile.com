      <p>Probably not relevant to regular usage, but I'll submit an example in Romanian when I and l (similarly designed) create problems in reading religious texts. It's customary, globally I believe, to capitalize all pronouns that refer to God in such documents. This can confuse the reader in that he/she cannot easily distinguish between I (a pronoun referring to God in this case) and l (a pronoun referring to a human).</p>
