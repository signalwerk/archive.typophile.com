    html: "<p>There was once an article titled \"Which Caslon?\" in Serif magazine. It compared: Adobe Caslon, Berthold Caslon Buch BQ, Big Caslon CC, Lanston Caslon 337, Caslon 471 BQ, Adobe Caslon 540, Bitstream Caslon 540 and ITC Caslon 224 BQ. I've only kept one page of the article, showing the title of the article in the eight faces. Of those, to me the Adobe Caslon (first one) seems to strike a good balance between authenticity and readability. Then there's HW Caslon, of course: <br><a href=\"http://www.hwcaslon.com/\" target=\"_blank\">http://www.hwcaslon.com/</a> <br> <br>hhp</p>"
