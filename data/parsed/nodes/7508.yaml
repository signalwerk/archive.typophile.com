    date: null
    date_raw: null
    votes: null
    html: <p>The digital version of Caslon 540 is better suited for display use--Big Caslon and the display cuts of Founder's Caslon are made for display. Adobe Caslon, the text cuts of Founder's Caslon, and Lanston Caslon are geared for text use. <br> <br>Adobe Caslon has all the trimmings--small caps, swashes, ornaments--plus it's available in OpenType. <br> <br>I haven't used Founder's or Lanston Caslon so I can't comment on them.</p>
    html_clean: <p>The digital version of Caslon 540 is better suited for display use--Big Caslon and the display cuts of Founder's Caslon are made for display. Adobe Caslon, the text cuts of Founder's Caslon, and Lanston Caslon are geared for text use. <br> <br>Adobe Caslon has all the trimmings--small caps, swashes, ornaments--plus it's available in OpenType. <br> <br>I haven't used Founder's or Lanston Caslon so I can't comment on them.</p>
