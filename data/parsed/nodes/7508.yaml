    html: <p>Caslon 3 is bolder. <br> <br>540 has old style figures, small caps and swash variants. It's a more versatile choice. <br> <br>Depending on your application, you might also look at Adobe Caslon, Big Caslon, Founder's Caslon and Lanston Caslon.</p>
    html_clean: <p>Caslon 3 is bolder. <br> <br>540 has old style figures, small caps and swash variants. It's a more versatile choice. <br> <br>Depending on your application, you might also look at Adobe Caslon, Big Caslon, Founder's Caslon and Lanston Caslon.</p>
  - id: 51057
