    html: <p>If you intend to use Caslon Oldstyle for text it is highly recommended you use Lanston's Caslon 337. <br> <br>Lanston version ranked first ahead of Adobe in "Publish Magazine". <br> <br>Gerald Lange I believe was unable to distinguish the difference between the digital version and the hot metal version lines inserted in "The Fount". Caslon 337 was made using the original Caslon punches for source. <br> <br>Caslon 337 is a complete face, with oldstyle, lining, small capitals, full set of ligatures, italic, with swash and the long {s}. <br> <br>Also it is complete with long and short descenders.  <br> <br>The Boston Globe used Caslon 337 for their anniversary edition. <br> <br><a href="http://lanstontype.com/CaslonFountEight.html" target="_blank">http://lanstontype.com/CaslonFountEight.html</a> <br> <br>If you are reading impaired then you could take Hrant's advice into consideration. <br> <br>Hrant<i>"Adobe Caslon (first one) seems to strike a good balance between authenticity and readability."</i></p>
