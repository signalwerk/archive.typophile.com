    html: <p>Are you talking about the <em> actual </em> size of your ascenders and descenders or about the values in the OS/2 and hhea tables? If the former, I wouldn't worry about it (though in general you'll want the sum of your ascenders and descenders to be less than your UPM size). As for the latter, you can allow FLS to calculate these values automatically and it will generally assign sensible values.</p>
