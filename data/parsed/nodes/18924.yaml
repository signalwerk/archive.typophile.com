      <p>Alpine Village - a rotten Bavarian munchkin dream on the 110…<br>
      Have you been there lately? The last time I was there I walked into a sword shop and in the back was a counter selling Nazi memorabilia. I was with a friend who’s from San Diego but has lived in Berlin for the last 12 years and he was horrified. He told me he would be arrested if he showed up with any of that crap.</p>
      <p>I was also with my girlfriend who lived in Prenzlaurberg from 1995-2001. They both felt right at home.</p>
      <p>Now the Red Lion on Glendale is another story…<br>
      Great Bier und Wurst…</p>
      <p>peace</p>
