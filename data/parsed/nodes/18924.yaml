      <p>You’d even survive with your kafiyyeh - barely. Actually it’s mainly hipsters now so with your fashionable headgear you would fit right in. They have the best German food I know of anywhere near and they have a lot of German beer on tap. I like it there. It’s comfortable.</p>
      <p>They also have really cheesy lounge musicians in the downstairs part at night if you’re into that sort of thing. I’m not.</p>
      <p>Glendale just south of where Silver Lake Blvd. intersects on the east side of the street…</p>
      <p>peace</p>
