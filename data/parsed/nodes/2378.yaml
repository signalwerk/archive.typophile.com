  html: <p>When Panther was origianally released, I was under the impression that Classic Mode was to be discontinued alltogether. <br> <br>From a Mac buddy I have heard that it still is in Panther and classic apps can be launched and ran in the OS. In addition to this, I have also heard that FOG runs perfectly in Panther which is quite exciting to hear so I don't have to jump between two CPUs. <br> <br>In Jaguar, FOG hangs when you attempt to reposition a composite character such as an umlat u. <br> <br>Can anybody confirm this is now fixed in Panther? Thanks in advance . . . <br> <br>Stuart :D</p>
