    html: <p>Daniel, what type of Mac are you running it on? It may be something totally unrelated to Panther. The symptoms you describe sound creepily similar to something that I ran into a couple of months ago with my Titanium PowerBook that was was the result of a major hardware problem that required replacing the logic board and the top screen assembly. Does the screen look anything like <a href="http://www.ms-studio.com/badpb.jpg">this</a>? <br> <br>Regarding FOG on Panther, I would also be interested in knowing how it runs. I've been too busy to install it, but hope to very soon. My dad has Panther running on his system. I'll try to test it out this weekend when I visit my parents. <br> <br>(On the other hand, I've pretty much committed myself to using FontLab for any new fonts I develop, so I don't know that it will matter all that much to me in the long run. It really saved my butt with the batch I recently finished, even though most of the development on them happened in FOG.)</p>
