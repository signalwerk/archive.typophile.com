    html: <p>Stuart, I finally installed Panther. Man, is it great! Very snappy, speedwise. The most noticible speed improvement is in programs that have lots of windows and/or palettes.  <br> <br>Anyway, FOG does run faster. The screen redraw sluggishness that I used to see when running millions of colors seems to be gone, but, sad to say, the bug you describe is still there.</p>
