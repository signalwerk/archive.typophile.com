    html: <p>&gt; <i>When Panther was origianally released, I was under the impression</i> <br>&gt; <i>that Classic Mode was to be discontinued alltogether.</i> <br> <br>I think the confusion comes from the fact that Panther will not install the Classic environment by default, and unless you have an OS 9 System Folder already installed on your drive, it will not be updated when you upgrade to Panther from Jaguar. <br> <br>I'm finally getting around to installing Panther on my main box this afternoon. I'll let you know what I discover regarding FOG.</p>
