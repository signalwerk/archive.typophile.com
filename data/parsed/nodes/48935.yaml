    <p>Hello,</p>
    <p>Working on a logotype for a friend's Christian college ministry. Rather than develop a trendy shield/crest sort of thing as he asked (ugh), I thought a simple logotype would be much better. I'm not particularly well versed in drawing letters from scratch (versions 1 &amp; 2), so please be gentle.</p>
    <p>With all of these the idea was to hint at a shepherd's staff with the lowercase f.</p>
    <p><a href="http://metagramme.com/Flock_dd1_pres.pdf" title="http://metagramme.com/Flock_dd1_pres.pdf">http://metagramme.com/Flock_dd1_pres.pdf</a></p>
    <p>Thanks in advance for any/all advice.</p>
    <p>Matt</p>
