    html: |-
      <p>I really like number one. It's clean and has great character to it. </p>
      <p>I wouldn't have gotten the shepherd's crook from the f had you not said anything I don't think, but I'm not sure it's completely necessary to be so blatant about it. I think if it were too apparent it might be distracting. As it is, I can see that you were influenced by the idea of the crook but still kept the idea from taking over.</p>
      <p>I think I'd stay away from the circle around the text as it looks quite a bit like the food network logo.</p>
      <p>Iterations 3 and 4 remind me too much of the citibank logotype and I don't think they have the right character for this. </p>
      <p>One suggestion I might make for number 1 would be to thicken the crossbar of the "f" a bit. Other than that, I think you've got something really great here.</p>
      <p>penn</p>
