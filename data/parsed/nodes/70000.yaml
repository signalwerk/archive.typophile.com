    html: <p>Glad to help. I'm not a native Arabic, but Arabic letters do have a normal form in which they are not attached to other letters (called isolated). So it's certainly possible that it's not usual in the Arabic-reading world, but it's not entirely an imposition. (Certainly not like italicizing Arabic!)</p>
