    html: |-
      <p><cite>don't think i will use [drop caps] in arabic, i think it would look strange</cite></p>
      <p>As far as I know, Arabic allows very decorative typography (the limits reside more on the software side. For example, you will need the Middle-East version of InDesign to properly set a text in Arabic).<br>
      You could want to ask in a more specialised place:<br>
      <a href="http://typophile.com/forum/366" title="http://typophile.com/forum/366">http://typophile.com/forum/366</a></p>
