    html: '<p>Greek seems to have at least a historical basis for drop caps: See <a href="http://www.flickr.com/photos/joeking/3582811699" rel="nofollow">Aldus</a> and <a href="http://www.flickr.com/photos/typeoff/2211961045" rel="nofollow">Estienne</a>.</p>'
