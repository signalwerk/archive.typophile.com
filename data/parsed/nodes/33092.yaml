      <p>&gt; <em>It would be useful for such a stylistic set to also sub in non-descending versions of “J” and “Q”, since saving on linespacing is really the main point of lowering accents.</em></p>
      <p>You can get the non-descending 'J' by activating Stylistic Set #9.<br>
      There is no non-descending version of 'Q'; Stylistic Set #10 replaces the default form by another one with a longer and lower tail.<br>
