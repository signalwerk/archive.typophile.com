      <p>Paul: Currently, we intend to wait until the Hypatia Sans italics are done before making the typeface available as a regular retail item. Don't hold your breath, as I haven't started in on the italics seriously yet. Too much other pre-CS4 planning going on right now, and the echoes of CS3 still going on.</p>
      <p>Mark: I'll confess to a secret liking for Serif Gothic, ever since I first noticed it as the titling typeface for the boardgame "Empires of the Middle Ages" back in high school.</p>
      <p>Miguel: I am about 3/4 sure the idea for the vertical dots on the black Udieresis.alt was somebody else's suggestion. Darned if I can remember whose, though. Robert, or maybe one of our beta testers or somebody I showed the typeface to? I gather from your comment it wasn't your idea.  :)</p>
      <p>Carl, Miguel: Okay, I'll stop saying "it doesn't suck." Jim Felici was bugging me about that one, too. Be warned that you might see that phrase crop up in an interview I already did months ago for CreativePro.com, though.</p>
      <p>Wait a minute, if "it doesn't suck" "isn't at all appropriate for [my] accomplishment," are you saying it *does* suck? Darn, that's disappointing....   :)</p>
      <p>Cheers,</p>
      <p>T</p>
