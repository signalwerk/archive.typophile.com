    html: |-
      <p>Here's one of Hypatia Sans' features: Stylistic Set 12 replaces Ä, Ï, Ö and Ü by "display" versions where the umlaut/dieresis diacritics are positioned at the cap height. The coolest aspect of this feature, IMO, is the solution that Thomas used for the Udieresis on the Black weight, which has historical precedents, as he told me.<br>
      Although this feature is most suitable for when setting Germany texts, the feature was implemented in a way that does not restrict its usage to the German language.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/German_alts_6665.png"></div><p></p>
    html_clean: |-
