      <p>Katia, I do not normally treat ﷺ <em>sallallahou alayhe wasallam</em> glyph as an OT ligature, since it is a specialised representation, very distinct from how the words would appear in normal text. If I were to use a ligature lookup for this, I would certainly use the Discretionary Ligatures 'dlig' feature, not the standard or required ligatures features, since users may or may not want this form in specific situations.</p>
