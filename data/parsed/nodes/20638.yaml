      <p>1. I can not comment on this as I do not know enough about Arabic. We did not hear any requests/complaints about current behavior of these marks. Do you have any evidence that shaping should be enforced in this case? If tatween appears at the end of the word anyway, won't last letter be in the final form anyway? If it is a choice of the user, it should be implemented on the character level, possibly using zero width non-joiner. Especially if it changes meaning of the text.</p>
      <p>If you think it really should be done uncondtionally, my guess is that this would be part of Uniscribe rules. But font can also be tweaked if it is needed. Contextual lookups can adjust the forms of surrounding letters.</p>
      <p>2. Justification is higher level feature than shaping individual character runs. OpenType layout rules do not have any information about actual width of the line and what other content (from different scripts) is present. There is no standard protocol defined between font and text layout engine to achive what you want. Is it would exist, then VOLT will be able to implement it but so far it can't because of lack of the rules that should be followed.</p>
      <p>Thanks,<br>
      Sergey</p>
