    html: |-
      <p>In the mark-to-ligature lookup, the black mark indicates the mark to be positioned on the current component letter; the grey mark indicates the position of the mark relative to the other component(s). So consider the example of a lam_alif ligature: in the Glyph Edit window you have classified the lam_alif as a ligature with 2 components. In the mark positioning window, you can select the individual components using the drop down list in the top right corner of the window. In this case, the lam is component 1 and the alif is component 2. The first thing you want to do is to lock the position of the second glyph (the mark) so that it only moves relative to the first glyph (the ligature) not relative to itself (i.e. not relative to its zero-width). This is probably what you have failed to do if you are seeing the grey mark moving when you move the black one. Once you have positioned the mark on the lam, go to the component drop down list, and select 2. The mark you have positioned on the lam will become grey, and the one you are about to position on the alif will become black. There will always be a number of marks equal to the number of components.</p>
      <p>For your other question:</p>
      <p>1. Export a VOLT project file (see export menu). This is a text file that contains all your glyph, lookup, feature, glyph group and option settings for the font.</p>
      <p>2. Add the new glyphs in FontLab (I recommend adding them at the end of the glyph set to avoid having to reorder within the VOLT project).</p>
      <p>3. Generate a new font from FontLab with the additional glyphs.</p>
      <p>4. Open the new font in VOLT, and go to the import menu to import the project file you exported earlier.</p>
      <p>5. Go to the Glyph Edit window and ensure that the glyph order is consistent with the imported names, classes, etc. Go to the new glyphs and give them appropriate names.</p>
      <p>6. You are now ready to continue working in VOLT.</p>
      <p>PS. No it isn't one of my duties.</p>
