      <p><em>You can always do mark positioning in context of neighbor glyphs. So you can move marks higer if there are marks over other letters that can cause collision.</em></p>
      <p>In addition to this, I have also contextually inserted a very narrow joining stroke between two letters when I need to accomodate a mark that might otherwise collide with an adjoining letter. This is appropriate in more linear designs, rather than in the kind of calligraphic design shown in the illustration. Calligraphy has its own rules for mark size and positioning.</p>
