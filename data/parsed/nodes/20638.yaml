      <p>I believe the problem is that your cursive connection GPOS feature has the marks flag set to something other than NONE, probably all. Every OpenType Layout lookup has a flag that indicates whether all marks, no mark or a class of marks should be processed as part of the lookup. For features that involve interaction between adjacent letter shapes, such as ligature GSUB features and cursive attachment GPOS features, you want to set the marks flag to NONE. This means that marks in the glyph sequence will be ignored by this lookup. [Note that, obviously, this means that mark glyphs need to be classified as Marks in the VOLT glyph data.]</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/markflag_4824.png"></div><p></p>
    html_clean: |-
