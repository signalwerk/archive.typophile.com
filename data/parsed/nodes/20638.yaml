      <p>Aziz, I did not create the Arabic Typesetting font: I only designed the Latin portion of the typeface. Mamoun Sakkal designed the Arabic, beginning with an initial idea from Paul Nelson, and Mamoun also did the VOLT work for the font.</p>
      <p>I think the kerning problem you are seeing must be due to the Arabic Typesetting kerning being implemented as a width adjustment on the first glyph, which is how GPOS kerning is properly implemented for <em>left-to-right</em> scripts. When this font was made, no one had figured out that right-to-left kerning needs to be implemented differently -- as equivalent width and positioning adjustments to the second glyph --; I presume this will be fixed in the next version of this font. [Microsoft may be concerned about backwards compatibility and text reflow in existing documents, but this kerning problem is so bad that I think such concerns should be ignored.]</p>
      <p>If right-to-left kerning is implemented in the same way as left-to-right, only every second pair of glyphs gets kerned, and this is what you are seeing in your test. If you were to add another character before the sequence زرع then you would see the kerning suddently applied between رع. You see this in the graphic below. The second line shows the Adobe Arabic font, in which the kerning has been applied to the second glyph in the lookups, and the spacing is consistent regardless of the number of glyphs in the run.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ataakern_4689.gif"></div><p></p>
      <p>[Note that if one uses the kern2volt tool to convert a FontLab generated kern table to GPOS kerning in VOLT, the tool has an -RTL option that will correctly define the lookups for right-to-left scripts. You will need separate kern table sources for RTL and LTR kerning though.]</p>
