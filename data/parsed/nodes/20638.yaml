      <p><em>Is it possible to make 2 marks go with a single letter as shown here?</em></p>
      <p>Yes,* although what your image shows would normally be two different kinds of lookups.</p>
      <p>In the first word, with the damma above the fatha on the initial mim, this would be handled as an above mark-to-mark positioning. So the fatha would be positioned relative to the mim, and the damma would be positioned relative to the fatha.</p>
      <p>In the second word, both the shadda and the kasra are positioned relative to the letter, the medial qaf, using two separate anchor attachments, one above and one below.</p>
      <p>To render the second word, it is also possible to write the kasra directly below the shadda, with both marks above the letter. In this case, one would perform a mark ligation using the ccmp feature. This is a decision of the font developer.</p>
      <p>Note that above mark-to-mark and below mark-to-mark positioning should be defined in separate lookups, with the above mark-to-mark lookup set to ignore below marks and vice versa. This ensures that mark-to-mark positioning occurs even when, e.g. two above marks are separated in the character sequence by an interverning below mark.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arabmkmk_6170.gif"></div><p></p>
      <p>* Note: although OpenType allows you to apply mark-to-mark positioning for any sequence of marks, some applications or shaping engines may restrict certain sequences if they consider them to be grammatically invalid. So, for instance, the sequence of fatha with damma shown in your example is not recognised by the Uniscribe Arabic engine as a valid sequence, so the damma displays on a dotted circle. Personally, I think this is a really bad idea, and I suspect MS are beginning to think so too: a script shaping engine should not be acting as a spellchecker! The same sequence displays without the dotted circle in InDesign ME, with the damma above the fatha according to the OpenType mark-to-mark positioning.</p>
    html_clean: |-
