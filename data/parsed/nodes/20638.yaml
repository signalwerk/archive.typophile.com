      <p><em>Not including the Last Examples?!</em></p>
      <p>Why not? Any form that can be constructed as a ligature can also be constructed as strokes that, if arranged correctly, would be visually identical to the ligature. The question is whether the arrangement can be achieved in a reasonable (and efficient) way in a particular font format. When I wrote that I would avoid ligatures, I didn't mean that I might not end up using some ligatures, but only that I would first try to resolve the forms using individual glphs and contextual substitution and positioning. I was looking at some thuluth calligraphy today, and figuring out how I would handle it using a font; there were only a couple of forms for which I might use a ligature.</p>
