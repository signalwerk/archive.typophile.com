      <p><em>How if a word ends with R+TaMarbota and the Tanween of TaMarbota collides with R</em></p>
      <p>There are two ways to deal with this kind of collision. I believe the more traditional technique is to contextually lower the Tanween so that it no longer collides with the R. Another technique is to introduce a contextually sensitive kerning adjustment between the R and the TaMarbota when the latter is followed by a below mark. I think the decision which method to use depends very much on the type design. In a very modern, linear design one might want to make the heights of marks quite regular and not raise or lower them contextually, so in that case the kerning option might be best. In a traditional naskh design, though, one might want to preserve the letter relationships and allow the marks to move as necessary; this better emulates the scribal approach.</p>
    html_clean: |-
