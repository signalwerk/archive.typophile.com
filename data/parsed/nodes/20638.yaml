      <p>May God bless your Clicking Finger, Sergey.<br>
      &gt; We did not hear any requests/complaints about current behavior of these marks. Do you have any evidence that shaping should be enforced in this case? </p>
      <p>No complaints but enforcing Tanween Shaping will not only prevent connection with the following word in case a space goes missing but will also lessen the importance of preceding the following word with a space as well.</p>
      <p>&gt; Tanween is possible to do on font level without changing Uniscribe,<br>
      using contextual substitution based on first letter of following word</p>
      <p>Contextual substitution based on first letter of following word?!<br>
