    html: "<p>Aziz, a ligature is a particular technical solution to a written form, i.e. the representation of two or more character by a single glyph. The point which I am trying to make is that the richness of the Arabic script does not rely on this particular technical solution and there are other methods to capture that richness in typography. The examples you give of elegant letter combinations can all be broken down into constituent strokes, i.e. the elegance is not dependent on these being ligatures: they could be constructed from contextually appropriate strokes. The advantage of such an approach is that it is far more flexible than even the most extensive ligatured font.</p>"
