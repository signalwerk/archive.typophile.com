      <p>Sergey, a short while ago on one of the Unicode lists, Paul Nelson expressed the view that script shaping engines should not be performing what are, in effect, spellchecking functions. I took this as a hopeful sign that we might see a lot fewer dotted circles in future!</p>
      <p>In my Biblical Hebrew font, I actually include a lookup that removes dotted circles from glyph strings, so that any combination of marks can be applied to any base, because scholars working with ancient manuscripts may need to represent non-standard spellings. Looking at what Uniscribe is doing with Arabic, I'd be inclined to do the same sort of thing in Arabic fonts. But the problem then is that users who actually want to display a dotted circle, e.g. to show a mark in isolation, are unable to. It would be much preferable if Uniscribe simply gave up on trying to enforce 'valid' mark sequences. As far as I'm concerned, a valid mark sequence is any mark sequence that a user deliberately creates, and it is up to the font to succeed or fail in rendering the sequence in an acceptable way. So far as I know, there are no invalid mark sequences for Latin GPOS: marks can stack endlessly. It should be so for all scripts employing the mkmk feature.</p>
