      <p>Katia, here is an example of what I am referring to in VOLT's GPOS window. The red underlined anchor names must be unique for any different mark positioning. So, for example, if I have a second lookup that adjusts the position of marks contextually, e.g. raising or lowering them when preceded by certain letters, then the anchor names in that lookup could not be 'above' and 'below' as they are in this lookup, because any changes to positioning for the anchors named 'above' and 'below' will propagate to lookups using those anchor names, including work that I have already done.</p>
      <p>When you first create a GPOS anchor attachment lookup, the anchor(s) in it will be named 'default'. The first thing you should do is change this name to something specific to the lookup.</p>
