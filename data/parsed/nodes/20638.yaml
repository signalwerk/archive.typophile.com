      <p>VOLT for Arabic is not very complicated -- not compared to, say, Devanagari, which I'm working on at the moment. The basic GSUB shaping features -- init, medi, fina (isol is optional, basically only necessary if you want to perform contextual heh shaping) -- are very straight forward, as are the ligature substitutions. Things are trickier if you start getting into contextual substitutions, e.g. if you have different glyph forms that you want to employ in different situations, but even then you just need to keep track of your contexts.</p>
      <p>GPOS mark positioning is probably the most difficult thing you'll need to learn for Arabic, and is mainly tricky because the interface might not be intuitive at first. Read the tutorials carefully.</p>
      <p>VOLT isn't a massive program -- it does some specific tasks for OpenType Layout development -- so there isn't very much to learn in terms of interface. The thing that takes time is figuring out the best way to do things for different scripts, and also learning what expectations shaping engines have for those scripts.</p>
