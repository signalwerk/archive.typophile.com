      <p>John Hudson wrote: </p>
      <p>"Although all my own Arabic work has been in OpenType, I’m pretty convinced that only an approach like Tom’s can result in optimal mark positioning. The downside of such a system is that it tends to be very slow: not something you would want to use for, e.g. e-mail. But in the context of book production, it is the best thing available."</p>
      <p>This was not based on actual observation. The core code for ACE was written in 1984 for 4Mhz processors :-)<br>
      See: <a href="http://laits.utexas.edu/rfpit/texts/Mimesis.html" title="http://laits.utexas.edu/rfpit/texts/Mimesis.html">http://laits.utexas.edu/rfpit/texts/Mimesis.html</a></p>
      <p>Today it runs on 1Ghz, 2Ghz or even faster computers. ACE has never been slow, and it's certainly faster than OpenType. </p>
      <p>Moreover, what's wrong with elegant email. Ruqah, one of our projects, is perfect for (e)mail. Anyway, ACE is technology, not a specific font.</p>
      <p>Thomas Milo<br>
