      <p>Aziz, this is achieved using the OpenType Layout <a href="http://www.microsoft.com/typography/otspec/features_ae.htm#curs" rel="nofollow">'curs'</a> (Cursive Positioning) feature. The lookup type for this feature is a <a href=" " rel="nofollow">cursive attachment</a> GPOS, defining entry and exit points for a pair of glyphs. In your second example, the cursive attachment point on the right side of the seen_kah ligature is raised from the baseline, so any glyph that attaches to the right of this glyph will be raised. This feature accounts not only for the dramatic rise in this example, but also for the gradual incline of the first example.</p>
      <p>In VOLT, create a new GPOS lookup, and select 'Cursive Attachment' from the drop down menu of lookup types. You will be presented with input fields for first and second glyphs, and an anchor name, which is always 'exit' in this kind of lookup. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cursgpos_4655.gif"></div><p></p>
    html_clean: |-
