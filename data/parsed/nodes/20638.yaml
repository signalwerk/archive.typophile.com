    html: "<p>Titus, yes, one can certainly do contextual adjustments to mark positioning. In the Adobe Arabic font, we use both techniques: sometimes we raise or lower a mark to avoid a collision, other times we insert a narrow connecting stroke to move two letters further apart. Where we have an isolated or final form, e.g. waw, occuring mid-word, we might also employ a contextual kerning adjustment if the following glyph takes a mark that might collide with that letter. So there are three techniques for avoiding problems with mark collisions.</p>"
    html_clean: "<p>Titus, yes, one can certainly do contextual adjustments to mark positioning. In the Adobe Arabic font, we use both techniques: sometimes we raise or lower a mark to avoid a collision, other times we insert a narrow connecting stroke to move two letters further apart. Where we have an isolated or final form, e.g. waw, occuring mid-word, we might also employ a contextual kerning adjustment if the following glyph takes a mark that might collide with that letter. So there are three techniques for avoiding problems with mark collisions.</p>"
