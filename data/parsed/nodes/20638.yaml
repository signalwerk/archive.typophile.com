      <p><cite>The second issue is more surprising. I’ve tested this with a lot of different fonts, and the only ones in which the damma does not appear on a dotted circle are fonts that do not contain any OpenType GPOS mark positioning.</cite></p>
      <p>Arabic fonts without 'arab' script in GPOS are considered by Uniscribe as legacy fonts and processed by old shaping engine, which does not support lots of things like contextual substitutions or mark positioning. Marks can be processed using 'mset' feature. New fonts, recognized by presence of GPOS, are processed by new engine that supports all OpenType layout lookups. </p>
      <p>In Avalon, there is only one engine, which has the same rules as a new one in Uniscribe.</p>
      <p>I do not know exactly why limitation of a single mark of each type over the base was introduced for Arabic script. I can imagine some security (spoofing) or backward compatibility reasons. I will try to find out more.</p>
      <p>Thanks,<br>
      Sergey</p>
