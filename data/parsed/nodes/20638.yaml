    date: 2014-07-22T16:44:00
    date_raw: 22 Jul 2014 — 4:44pm
    votes: null
    html: <p>Yeh barree is very difficult in OpenType, because there is no way to kern the yeh barree against the letter with which it is colliding on the right, because of all the intervening letters. OpenType GPOS simply isn't a good format for handling this kind of problem (which is one that I will be discussing in my presentation at TypeCon next week). You can only kern adjacent glyphs, so in order to handle these situations you would need to have a contextual kern between the final letter in the previous word and the following space glyph, in which the context is everything up to and including the yeh barree. It's a nightmare. Also note that some browsers treat each word as a separate glyph run, so context lookups across word spaces might not work even if you made them. As I said, a nightmare. Oh, and if you were to build all of the separate contextual lookups necessary to handle all the variable spacing contexts, chances are that you would overflow the GPOS subtable boundaries and the font wouldn't compile. Did I mention that this is a nightmare?</p>
