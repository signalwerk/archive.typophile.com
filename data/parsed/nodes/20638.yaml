    html: |-
      <p>Ok, I now found more information about tanween and I think I understand what you are asking for. Tanween is possible to do on font level without changing Uniscribe, using contextual substitution based on first letter of following word. One thing that will not work is context not working across the lines, because each line is shaped independently.</p>
      <p>Working across the line is on higher level than a font, beyond OpenType layout. As with justification, there should be a protocol defined between higher level engine and the font (e.g. through applying particular feature) to communicate intended shaping.</p>
      <p>Thanks,<br>
      Sergey</p>
    html_clean: |-
