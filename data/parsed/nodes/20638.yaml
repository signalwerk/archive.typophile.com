      <p><em>Medial ligatures make words shorter (less horizontal) and more comfortable to the eyes ( for Arabs and non-Arabs)</em></p>
      <p>Less horizontal, of course, usually means more vertical, and this <em>may</em> have been a factor in the decision not to employ medial ligatures in the Arabic Typesetting font. This font is mainly going to be used in an application like MS Word, by users who are used to employing fonts using the default linespacing. In such a situation, having word forms growing tall through use of medial ligatures could cause problems with parts of letters being clipped as they extend beyond the font's WinAscent setting. Obviously in fonts designed primarily for use by experienced typographers such as yourself, or in professional page layout applications, this would be less of a concern.</p>
