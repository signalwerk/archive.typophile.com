    html: <p>That's certainly an easier solution technically, Bahman. We've done this sort of thing in non-traditional typefaces to avoid having the yeh barree collide with dots or marks below preceding letters. But in the traditional styles, how much do you want to corrupt their norms in order to accommodate technological difficulties?</p>
