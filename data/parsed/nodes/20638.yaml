      <p>Yes. Decisions about what glyphs are font contains and how they work are the decisions of the designer.</p>
      <p>In most Arabic fonts I have worked with, ligatures tend to be limited to a few isolated sequences, a few initial sequences, and generally more final sequences. But there is no reason why a font could not contain medial ligatures.</p>
