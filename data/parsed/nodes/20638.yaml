      <p>Re. the lam_mim ligature:</p>
      <p>I'm guessing that there are a couple of different situations in which you want this ligature not to form; when any mark follows the mim but perhaps also when a mark occurs below the lam?</p>
      <p>What you need to do in this case is create some separate lookups for this ligature, and a class for lower marks called e.g. 'marks_below', and another class for 'all_marks'.</p>
      <p>Your first lookup will form the ligature only if no below mark follows the lam. This is done by putting the 'marks_below' class name in the Process Marks field:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LM1_5027.png"></div><br>
      ___<p></p>
      <p>The second lookup decomposes the ligature when the mim is followed by a mark. This requires the Process Marks field to be set to ALL, so that the 'all_marks' class will be recognised in the context string:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/LM2_6393.png"></div><p></p>
