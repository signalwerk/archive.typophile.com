      <p><em>So, let us concentrate on Ligatures.<br>
      In ArabicTypesetting, a number of 2&amp;3-component ligatures were built.<br>
      In Nafees Naskh of <a href="http://www.crulp.org" title="http://www.crulp.org">http://www.crulp.org</a>, instead, all the possible shapes of characters to form ligatures were built — save LamAlif of course.<br>
      Which approach do you see better and Why?</em></p>
      <p>Although every Arabic font I have worked on to date has involved ligature glyphs for one reason or another, I actually think that the better approach is not to use ligatures, but instead to have component stroke shapes which are contextually substituted to produce the correct forms. This technique is much more adaptable and efficient. Consider, for example, Monotype Nastaliq, which had up to 22,000 ligature glyphs -- some for entire words -- in its late metal and final phototype versions, but which has recently been remade in OpenType using only a small fraction of that number of glyphs.</p>
      <p>I'm aware of some fonts that even use component strokes to create the lam_alif sequence, i.e. that do not contain any ligatures at all.</p>
