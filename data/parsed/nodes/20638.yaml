      <p>Katia, in answer to your first question:</p>
      <p>What you have, I presume, is the isolated character from the Unicode Arabic block (e.g. uni0628, beh) and a corresponding, redundant isolated character from the Arabic Presentation Forms (e.g. uniFE8F). The latter isn't necessary at all in an OpenType font (you only need character mappings for the Arabic block characters; everything else can be handled by glyph processing), but such redundant mappings might be used if the font encounters older software that uses presentation form mappings for Arabic shaping. If the redundant isolated characters are supported in the font using distinct glyphs, I would say that it doesn't really matter whether both are mapped in shaping features like init, medi and fina. OpenType Layout presumes a Unicode text handler which processes Arabic text using Arabic block codepoints. It is quite likely that such a handler will apply compatability mappings to Presentation Form characters encountered in text before glyph processing even begins, so the likelihood of e.g. the init feature needing to know what to do with uniFE8F is remote. That said, I don't think there is any harm in providing a double lookup.</p>
    html_clean: |-
