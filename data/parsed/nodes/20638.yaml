      <p>'Marrying the classmates' is a stylistic decision. There is either a lookup in the font that does this or there is not. So Tahoma doesn't do it and Arabic Typesetting does.</p>
      <p>The second issue is more surprising. I've tested this with a lot of different fonts, and the only ones in which the damma does not appear on a dotted circle are fonts that do not contain any OpenType GPOS mark positioning. In Tahoma, the marks are not positioned using anchors, they just fall wherever their offsets on their zero-widths put them, and they are not classified as marks in the GDEF table. So I think Uniscribe is dealing with these fonts in different ways. Uniscribe is not one shaping engine, but several, including different engines for different scripts, some for backwards compatibility. What Uniscribe does with a particular string depends on both the characters in that string and what tables exist in the font.</p>
