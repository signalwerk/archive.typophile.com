      <p><em>The left significant word in the lower line is a bit longer than the above due to the narrow stroke between its first and second letters, as mentioned by John Hudson.</em></p>
      <p>In this case, I believe the method is not an inserted narrow stroke but a variant form of the K, but yes the result is the same.</p>
      <p><em>The 3 words on the right of the lower line are not ligatured as above. In other words. Marks spoilt the ligatures.</em></p>
      <p>This font contains two different kinds of ligature lookups. Some ligatures are allowed to form even when marks are involved in the sequence (in VOLT, they are set to process NONE of the mark glyphs), and some ligatures are inhibited from forming when marks are involved (in VOLT, they are set to process ALL mark glyphs). This is a design decision. In the Arabic Typsetting font, Mamoun Sakkal decided to prevent ligatures involving vertical stacking from forming when marks are applied, because in these situations it is sometimes confusing, even for the reader, to know to which letter in the ligature a mark is applied.</p>
      <p>I use the same method when dealing with the initial lam_mim sequence, in which the mim portion of the ligature ends up to the right of the lam, which phonetically precedes it. So if the lam takes a mark, I prevent this ligature from forming because it is too easy to be confused about which letter is taking the mark.</p>
      <p>Of course, if one is seeking to emulate the traditional naskh style including its mark positioning, then one probably doesn't want to inhibit ligation in these circumstances. But then one is also presuming a level of readership that is quite high.</p>
