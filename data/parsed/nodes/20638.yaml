      <p>If VOLT compilation fails with no specific error message, it is most likely a problem that requires you to use extension lookups, format 2 lookups for pair positioning, or both. Go to Options under the Tools menu. There are two 'Compilation' options:</p>
      <p>[ ] Use extension lookups<br>
      [ ] Use PairPosFormat2 for pair positioning</p>
      <p>Turn on the first of these options, and try to compile the font. If it still will not compile, turn off the first option and turn on the second option. If the font will not compile with the second option set, turn on both options, and try again. If it still won't compile, let me know.</p>
    html_clean: |-
