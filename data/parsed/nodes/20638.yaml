      1 Justification is not possible by swashing though (Overlapped) Swashing is VOLTable.<br>
      2 en and em spaces (narrower or wider), are VOLT-Controlled also?</p>
      <p>Hope Uniscribe Rules will be modified to make life easier for VOL(un)Teers.</p>
