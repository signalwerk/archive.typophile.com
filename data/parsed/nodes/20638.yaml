  html: |-
    <p>Peace be on All Friends,<br>
    In VOLT, Marks Positioning is carried out Independently for each letter and for each component of every ligature?!<br>
    So, to avoid the Collision of Marks with Marks and/or Letters in Arabic Fonts:<br>
    1 The thinest letter or ligature should be at least a bit wider than the widest mark. Just like asking 3 cowboys to stand side by side without allowing their Hats to collide. And this can be done at the expense of Beauty.<br>
    2 Marks should be horizontally centered on top of or below each letter and each component of every ligature. And this is not always possible even if Beauty is sacrificed.<br>
    Samples speak louder than words?!<br>
    Daringly<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ATypeset_3857.JPG"></div><p></p>
