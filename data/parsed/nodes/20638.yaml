    html: |-
      <p><cite>for mark-to-base positioning is it better to use Anchor or cursive attachment operation?</cite></p>
      <p>mark-to-base, mark-to-ligature, and cursive attachment are all based on aligning anchors of two glyphs. Difference between them is that mark attachment will change offset of the mark and cursive attachment can change advance width of the first glyph and vertical offset of the second. So, for mark attachment, mark-to-base is the right lookup type.</p>
      <p><cite>also please for ئ ؤ shall I treat them as simple glyphs or is it better to consider them as ligatures?</cite></p>
      <p>There is no clear definition in OpenType specification of what is ligature and what is component. But clasifying glyphs as ligatures with several components is only useful when you plan to attach marks to each component separately. So, number of components is usually a number of base glyphs in the ligature.</p>
      <p>Your case is similar to Latin letters with accents, you do not need several components and you can define these glyphs as simple.</p>
      <p>Thanks,<br>
      Sergey</p>
    html_clean: |-
