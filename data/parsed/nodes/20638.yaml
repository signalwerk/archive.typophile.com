      <p>Aziz, the problem in the example you show is not because of the number of marks, but because the Arabic Typesetting font lacks a form of the lam_mim ligature with a short lam. It does have a short lam, which is automatically substituted before medial kaf, but it does not have a corresponding short form of the lam_mim combination. It is a design flaw, not a technology flaw.</p>
      <p>There is what I consider another design flaw: a fatha above the short lam is too high, I think, and still too close to the kaf. I would probably lower it, under the arm of the kaf, to make it more clearly associated with the lam.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/lkr_6118.gif"></div><p></p>
