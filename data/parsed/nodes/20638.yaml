      <p>Handling mark positioning on ligatures is more complicated than on single-component glyphs, but it certainly isn't impossible. One needs to define the ligature glyphs as ligatures in the GDEF table (using VOLT's glyph edit window) and correctly record the number of components in the ligature, e.g. 2 components for the lam_alif ligatures. Then you create a mark-to-ligature lookup associated with the mark feature, and define anchor attachments for the individual components. Here are some examples of mark-to-ligature positioning in two fonts I have worked on, Adobe Arabic and Karim LT, showing marks applied to several two-component ligatures.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arablgmk_6313.gif"></div><p></p>
      <p>My own dissatisfaction with ligatures is not with the relative difficulty of mark positioning, but with the awkwardness of the transition between two ligatures, e.g. between the theh_mim and the dad_yeh in the last word. Ligatures create elegant flowing forms for the invidiual pairs of letters, but the connection between them is not elegant and looks awkward compared to the ligatures. A ligature-free approach such as our Pakistani colleague can resolve this.</p>
      <p>The Arabic fonts I have worked on to date have all been based on a ligature model, because that was the nature of the designs as provided. When I design my own Arabic typeface, I intend to avoid ligatures.</p>
