      <p><cite>[Sergey, I thought there was a limit to VOLT ligature input length? Are you sure it is possible to create a ligature lookup that will handle input of 18 glyphs?]</cite></p>
      <p>When you define how many components your ligature consists of you are limited to 16 components (pretty much aritfical limitation, just to keep number of elements in the combobox reasonable). So, if you have very long sequence, you wont be able to correctly place marks on individual components - which you would not do anyway in this particular case. </p>
      <p>But ligature lookup itself does not have any limitation on length of glyph sequence being substituted. To be sure, I just succesfully tried replacing 60 glyphs into single ligature :).</p>
