      <p>David,</p>
      <p>Tom Milo's DecoType Arabic layout system uses a layering approach which follows the way in which calligraphers construct a word. First the 'archigraphemes' of the letters are written; these are the letters, correctly formed, but without any marks at all, not even the distinguishing dots. Then the dots are written relative to the letterforms and taking into account context of nearby strokes. Then vowels are written relative to both letterforms and dots. If I remember correctly, Tom breaks the system down into about seven different layers, based on classification of marks. Also, marks in the system are not of fixed size, but may be longer or shorter depending on context, as found in calligraphy.</p>
      <p>Although all my own Arabic work has been in OpenType, I'm pretty convinced that only an approach like Tom's can result in optimal mark positioning. The downside of such a system is that it tends to be very slow: not something you would want to use for, e.g. e-mail. But in the context of book production, it is the best thing available.</p>
