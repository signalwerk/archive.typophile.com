    html: <p>By the way, I don't think that OpenType is the <em>best</em> way to handle Arabic text. There are, for instance, good arguments for layout systems that treat diacritic marks as a separate layer applied after word formation. Contextual mark positioning and spacing adjustment is the most difficult and cumbersome aspect of Arabic OpenType, especially if one wants refinement. The benefit of OpenType is in its wide support and adaptability. If you have a different solution that works for your needs -- even if it only works in one application and requires macros --, is there a need to make an OpenType version?</p>
