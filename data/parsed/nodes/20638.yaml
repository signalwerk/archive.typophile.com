    html: <p>As discussed in the other thread Naji started on this subject, Mac Arabic support is currently stuck between two different implementations. They have started supporting OpenType Layout, and (strangely) give preference to OTL tables over AAT tables if both occur in the same font, but their OTL support is not advanced enough to handle Arabic. AAT Arabic works very well, but it is relatively difficult to develop AAT fonts. For the time being, you have to ship separate OTL and AAT fonts, and there are some things that are possible in OTL that are not possible in AAT and vice versa, so if you want cross-platform compatibility you have to limit yourself to the things that both formats can handle.</p>
