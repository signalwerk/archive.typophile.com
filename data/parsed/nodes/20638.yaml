      <p>1. Thanks John for the Clarification<br>
      2. What is the Alternative to Kashida?<br>
      Perfection of Arabic Calligraphy is achieved not by adding Kashida within words nor by changing Kaf — as in Adobe Indesign— but by controlling word spacings as in Adobe PageMaker—narrowing spaces between words ending with clockwise and others beginning with counterclockwise letters.<br>
      In other words: Space width Modulation.<br>
      Copyrighted by AzizMostafa (?)<br>
