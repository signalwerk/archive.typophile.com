      <p>You can always do mark positioning in context of neighbor glyphs. So you can move marks higer if there are marks over other letters that can cause collision.</p>
      <p>Dealing with ligatures is essentially the same, but may be tricky, though. OpenType model can not distinguish between mark over one or another component, except for mark-to-liga attachments. For example, for sequence of ligature and mark, lookup can say that something should happen only if mark is logically attached to the first component. There could be workaround for that, for example having separate glyphs for mark over first second etc. component.</p>
      <p>Thanks,<br>
      Sergey</p>
