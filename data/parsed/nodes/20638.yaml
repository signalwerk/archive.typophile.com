    html: |-
      <p>In an anchor attachment lookup, all second glyphs must be defined as marks in the font GDEF table. You set the category of glyphs in the VOLT glyph edit window. [Note that you can also define glyphs as ligatures, but you should only do so if you are planning to do mark-to-ligature lookups.]</p>
      <p>The 'cswh' feature works like any other contextual feature. You define contextual lookups to implement context-specific swash letters, as distinct from the 'swsh' feature which is used for non-contextual swash substitutions. This is an example of redundant features based on lookup type, which Adobe registered early on to limit the expected lookup types for each feature. Practically, the 'cswh' feature isn't needed, because you can put the contextual lookups in the 'swsh' feature alongside the non-contextual lookups.</p>
