      <p>There are plenty of font sets that include expert collections which let you compose your own fractions, such as the FF Meta family or the Thesis fonts. These fonts contain complete sets of numerators and denominators, as Florian mentioned. I think it may be easier to switch fonts than to ask your vendors to customize their fonts for you. </p>
      <p>There is no industry standard, unfortunately. I come across this problem a lot.</p>
      <p>Alternately, in InDesign, you can create character style sheets for numerators (I usually make them 3 points smaller than the regular size shift them up 2 1/2 or 3 points. Sometimes I go up a weight if the family has enough subtlety) and denominators (also 3 points smaller but no baseline shift). Just remember to use the opt+shift+1 character for the slash.</p>
