      <p>Hi Kristin,</p>
      <p><cite>3. I know that OpenType fonts CAN have fractions included in their glyphs</cite></p>
      <p>Yes, that’s the easiest way; the way it should be: type the ‘plain’ fraction, select figures and separator and choose the OpenType option ‘Fractions’. That, of course, is only possible if the font features numerator and denominator forms for all figures.</p>
      <p><cite>We are still stuck in Illustrator CS2 […] so that may be part of the problem.</cite></p>
      <p>No, this is available in Illustrator (and InDesign) CS2, too.</p>
      <p><cite>but I’m finding very few fonts that have fractions included </cite></p>
      <p>You can check: <a href="http://www.adobe.com/type/" rel="nofollow">Adobe</a> has icons that indicate if a certain OpenType feature (like fractions) is available in the font in question:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/adobe_5198.png"></div><p></p>
      <p><a href="http://www.fontshop.com/fonts/" rel="nofollow">FontShop</a> offers a customizable view of the character set:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fs_6128.png"></div><p></p>
      <p>Other foundries/distributors have different approaches; but most of them mention the (un)availability of OpenType features in some way on their website. All will be happy to let you know if you ask them.</p>
      <p><cite>I’m wondering if there are standards in the industry in regards to when to make fractions a part of the OpenType fonts and what we users can do to encourage that fractions be included.</cite></p>
      <p>Not really. Check out FontFont’s <a href="http://www.fontshop.com/fonts/download.php?docid=0" rel="nofollow">OpenType User Guide</a> [PDF, page 8]:<br>
      <cite>The number of fractions in a font may vary. OpenType Standard FontFonts include at least fractions for ¼, ½ and ¾.</cite><br>
      F</p>
