      <p>In the long run, it will be more productive to use OpenType fonts that have the Fraction feature.<br>
      That way you avoid faux fractions, and having to request foundries to add the feature specially for you--or to rumage through EULAs to find which foundries permit you, or a third party, to add the necessary glyphs and feature coding.</p>
      <p>However, that will severely restrict your choice of fonts, as it is really only in the past three years that Mac-based type designers have been making OpenType fonts, and the Fraction feature is not a standard, so you really have no way of knowing whether any particular typeface has the feature unless you check.</p>
      <p>MyFonts.com and FontShop.com are probably the best places to examine which OpenType features fonts have.</p>
