    <p>Hello,</p>
    <p>I need some advice about setting fractions in InDesign and Illustrator. This research is taking me in a couple directions.</p>
    <p>Our packaging team needs to be able to easily create fractions in Illustrator. Their goal is to have the fractions easily accessible for themselves and their vendors in the type styles they've chosen for packaging projects. Because our packaging is created by our vendors and not our internal teams, we are dealing with various unkown skill levels for the creative process!</p>
    <p>1. I tried to find plug-ins or scripts that can be used in Illustrator to create fractions. We could purchase this product and encourage our vendors to purchase it as well so we have consistency in usage and creation of fractions. I have not found anything for this as yet. We are still stuck in Illustrator CS2 because the corporation moves at a glacial pace when updating, so that may be part of the problem.</p>
    <p>2. I did find a plug in for InDesign that looks quite good from <a href="http://www.danrodney.com/" title="http://www.danrodney.com/">http://www.danrodney.com/</a>. I e-mailed Dan and learned that his plug in does not work in Illustrator and that he does not have the time nor the skills to script an equivalent product in Illustrator. So one option is to hire someone who can script a similar package in Illustrator. Any leads would be appreciated. We are likely to purchase this product for our InDesign users.</p>
    <p>3. I know that OpenType fonts CAN have fractions included in their glyphs, but I'm finding very few fonts that have fractions included, even in the OpenType format. I'm wondering if there are standards in the industry in regards to when to make fractions a part of the OpenType fonts and what we users can do to encourage that fractions be included.</p>
    <p>4. It has been suggested that I contact font manufacturers and ask for custom-made fraction fonts or fractions glyphs to be included in typefaces that we currently license. This seems bulky and expensive, but is also a possibility.</p>
    <p>So ... if my goal is to be able to create beautiful fractions consistently in Illustrator, what kind of solutions do you suggest?</p>
    <p>Thanks,</p>
    <p>Kristin</p>
