      <p>The basic fractions that have their own Unicode number:</p>
      <p>Half, quarters, fifths, eighths, and thirds.</p>
      <p>My present practice is to include these as pre-composed characters in all my fonts, and I suspect that other foundries are doing the same with their OpenType faces. It's a step beyond the basic three of the original digital font formats.</p>
      <p>So look for the latest OpenType fonts, check out their pdf samples, and I think you will find enough pre-composed fractions.</p>
      <p>But do you need sixths or sixteenths? Hardly any fonts have those as pre-composed, but if an OpenType font has the "Fraction" feature, it will be able to make those properly, and all you have to do is type "number slash number" and apply the<br>
      "Fraction" feature in the OpenType palette, as Florian explained.</p>
      <p>Do you like nuts, Kristin?</p>
