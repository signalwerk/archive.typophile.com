      <p>Thanks for your suggestions. We currently license very few OpenType fonts and the ones I've tried do not have full number sets for denominators and numerators. Darn it.</p>
      <p>Lots of these suggestions make sense, including choosing a different font. However, I work in a huge corporation. Things don't work that way. </p>
      <p>First, the fonts have been decided by some committee I haven't been invited to and can.not.change. </p>
      <p>Second, the production work is not done in-house, but by vendors around the world. </p>
      <p>Third, fractions are used very frequently.</p>
      <p>Fourth, we are limited to the Illustrator application.</p>
      <p>Given these conditions, we're working to improve the quality of the work we purchase. We have had some general success in reaching this goal by doing the following:</p>
      <p>We produce extensive style guides<br>
      We provide color specifications<br>
      We provide templates<br>
      We demand our vendors license the same fonts we license.<br>
      We provide clean, print-ready digital art files for patterns, logos, illustrations, etc.<br>
      We provide direction for copy tone, photography and illustration styles.<br>
      We provide sample documents.</p>
      <p>So now we are trying to find a solution for the extreme lack of quality in the fractions that appear in these documents. </p>
      <p>This is beginning to sound like a challenge for "Project Runway". Welcome to my job!</p>
      <p>Kristin</p>
