    <p>What are we discussing when we refer to 'warmth' in digital lettering? rounded edges? small discrepancies in point placement? or all of the above? any others that I have missed?</p>
    <p>from 'Just My Type' Garfield quoting Spiekermann:<br>
    "... I add it by not making my type too perfect - I leave stuff alone, I won't make it mathematically, so it can look unfinished and handmade."<br>
    quite self-explanatory there I think.</p>
    <p>from 'Designing Typefaces' Earls quoting Hoefler:<br>
    "It's not hard to evoke the warmth of foundry type in very superficial ways - bumpy edges, erratic baselines, and all that - and the results are often surprisingly effective"<br>
    "Matthew Carter's 'Galliard' and 'Miller' come straight to mind along with Bram de Does' 'Lexicon' - each of these face is a riot of sharp corners and parallel lines, and yet somehow they manage to have all the warmth of the best foundry types." </p>
    <p>The first quote is quite understandable (analog warmth a'la analog mixing desks/compressors etc..) but after reading the second quote from Hoefler I find myself questioning what 'warmth' in vector drawing is.</p>
    <p>How do you inject warmth into your vector drawings? any recommended reading?</p>
    <p>Best.</p>
