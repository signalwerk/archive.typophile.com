      <p>"Martin, the Hoefler quote implies that warmth, etc. comes solely from cultural norms. It might also imply that we can only get colder over time (which would be even more ridiculous)."</p>
      <p>How does it imply the first? I can see how the second implication follows from the first but I don't see how you got to the first.</p>
      <p>"I think I should try harder to get well versed in calligraphy so I can utilize many of these accidental irregularities</p>
      <p>Not so encouraging. :-)"</p>
      <p>I think it still IS encouraging. Mind you, I'm not saying I should put more calligraphic accidents in my typefaces. Not at all. What I'm saying is to become more familiar with chirography will give me more insight into what is possible. I don't base my typefaces on calligraphic forms but I do get insights into type in general from doing calligraphy. I suppose that's where I depart from Noordzij's theory of the stroke but I consider it a good thing to be well versed in calligraphy. I'm a fan of very dynamic angles and breaking patterns in typefaces though so stylistically I probably want to get away from calligraphy, but I suppose even there happy accidents could be utilized.</p>
      <p>"The problem with the irregularity of handwriting is that it's entirely arbitrary in the context of reading; you'll have to find a better source, in order to eschew contrivance."</p>
      <p>I suppose it is. I'm not using calligraphy as a basis for readable design though. Perhaps quite the opposite. I'm using it to experiment. The process of digital design is rigid so my calligraphy work is a way to sketch out ideas. Do note, it's A way. I don't consider it THE way.</p>
      <p>"As for "fluidity", the thing to keep in mind is that it applies less (and even becomes an obstacle) the closer you get to reading (as opposed to consciously looking at shapes)."</p>
      <p>I have the feeling you somewhat misunderstand what I mean by fluidity. Fluidity may be present in a typeface (as in Legato) but predominantly fluidity is a way of looking at type rather than a style. I see type as a black dot of paint which you want to keep in balance with the white at all times. If you move some black to the left, some black also needs to be moved to the right to keep it in balance. Imbalance may be added but this needs to be done subconsciously. What I consider fluidity is looking at type like it's a liquid which needs to be balanced at all times. Essentially this is done by any type designer but I feel Legato is a nice example of where it shows that the designer was highly conscious of this principle and thus managed to play with it in non-intuitive ways (anti-calligraphic as you say). He does strange things without making the typeface look unbalanced. I feel like most typefaces don't quite behave like that. They're balanced, but due to their more conservative features they're at a lower risk to become unbalanced, too. I think "fluidity" is the next step into the perception of what type is supposed to be which we are slowly making but we're not quite there yet. We still think too rigidly in general.</p>
      <p>This whole talk about the distinctions between "macro" and "micro" elements to make typefaces warmer or colder to me is evident of the notion that we haven't quite made that step yet. If you think of type as fluid, it makes absolutely no sense to disregard what Hoefler said as though it's just a post-effect. I'm not defending post-effects in this context and I highly doubt Hoefler was talking about post-effects.</p>
