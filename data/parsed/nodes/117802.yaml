      <p>Martin, the Hoefler quote implies that warmth, etc. comes solely from cultural norms. It might also imply that we can only get colder over time (which would be even more ridiculous).</p>
      <p>The Kallir book gets tiresome about half-way through; it's almost too thorough, considering so much of it is conjecture. But it's still one of my favorites.</p>
      <blockquote><p>I started using guidelines merely as reference points and the contours of each letter pretty much dances around those guidelines.</p></blockquote>
      <p>Very encouraging.</p>
      <blockquote><p>I think I should try harder to get well versed in calligraphy so I can utilize many of these accidental irregularities</p></blockquote>
      <p>Not so encouraging. :-)<br>
      The problem with the irregularity of handwriting is that it's entirely arbitrary in the context of reading; you'll have to find a better source, in order to eschew contrivance. And your citation of Legato is very telling here, since it's entirely non-calligraphic, in fact arguably even anti-calligraphic.</p>
      <p>As for "fluidity", the thing to keep in mind is that it applies less (and even becomes an obstacle) the closer you get to reading (as opposed to consciously looking at shapes).</p>
      <p>hhp</p>
