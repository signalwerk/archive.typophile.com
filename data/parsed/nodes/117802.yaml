      <p>"...in which warmth can be applied to a typeface"<br>
      When I was setting metal type in the 1960s, we considered the side effects of ink awareness as sloppy craftsmanship.  We tried for a kiss impression which minimized the blobby effect as much as possible.  We did not seek to add it in for warmth.  Why would I want to do that now? Garamond has warmth inherently even if set crisply--even digitally. Why do we always have to seek the arbitrary artifacts of prior technology to validate what we do today?  If you want it to look like metal type set letterpress then set it letterpress.</p>
