      <p><strong>hrant:</strong> I disagree. Color and shape themselves do not carry any inherent meaning; however, we have instinctual feeling responses bred into us or learned which are so instantaneous that what we perceive <em>seems</em> to carry meaning. But what we perceive does not carry meaning, the meaning is what we associate with what we perceive.</p>
      <p>As for warmth, that's an interesting subject. I agree with <strong>William</strong> and <strong>Nick</strong> etc.</p>
      <p>I agree that warmth is associated with organic flows (shapes, colors, textures) where "organic" often means a hint of chaos or disorganized. Simple structures often seem colder, rhythm that's too narrow seems boring.</p>
      <p>I noticed this in photography. For a while I removed noise (color and luminance) from digital images because I thought it's a bad thing, that it interferes with the image. But by removing the noise the colors become more monotonous, the image appeared flatter. It lost life, it became less organic, cold, boring. </p>
      <p>When we talk about warmth of a typeface I wouldn't want to just talk about the typeface itself, but also its context. The ink it's printed with, the material it's printed on. If everything is too smooth, too straight, too perfect, then it becomes sterile and, I think, loses warmth. With enough irregularity and life in paper, ink, typeface the whole page can appear warmer.</p>
      <p>I don't think that warmth is a property of a single thing (see above my answer to hrant) but instead it is how we perceive the page as a whole. Making it appear warm might just mean to make it less geometrical and perfect :)</p>
