      <p><em>Why do we always have to seek the arbitrary artifacts of prior technology to validate what we do today?</em></p>
      <p>I wouldn’t say they are arbitrary, every technology has its qualities.<br>
      When technology changes, what was invisible substrate becomes apparent, signiﬁcant, and interesting.</p>
      <p><a href="http://www.horton.ednet.ns.ca/staff/scottbennett/media/" title="http://www.horton.ednet.ns.ca/staff/scottbennett/media/">http://www.horton.ednet.ns.ca/staff/scottbennett/media/</a></p>
      <p>I theorize that when paper became smoother, ink darker, and metal harder, in the early 19th century, it created awareness of the newly minimized process of ink gain. Thus emerged the concept of bold style, expressed in Clarendon.</p>
      <p>That had nothing to do with “warmth”.</p>
