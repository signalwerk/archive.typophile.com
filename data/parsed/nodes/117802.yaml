      <p>Perhaps I'm missing something, but what is there to disagree about the Hoefler quote, or do you disagree about the importance of these features in regard to warmth? I wouldn't be using these features as a primary design to invoke warmth, but they do seem to add a lot.</p>
      <p>I've recently been researching Bram de Does' work and I noticed how irregular Lexicon is. So far I've always used guidelines to get the proportions of the letters exactly the same but I realize this is rather stifling and it makes the type feel cold and lifeless. As such, I started using guidelines merely as reference points and the contours of each letter pretty much dances around those guidelines. I'm now designing a typeface which is pretty clean and sharp, and yet by utilizing this technique the type is becoming a lot more vivid. I can imagine this could be vital to designing a warm typeface.</p>
      <p>I'm really not great at calligraphy and use it only for inspiration, but I think I should try harder to get well versed in calligraphy so I can utilize many of these accidental irregularities which are rather hard to reproduce digitally from scratch. I think type should be seen as fluid. I consider Legato to be a good example of a design where type is seen as being fluid and it seems to result in a much more vivid and arguably warmer typeface.</p>
