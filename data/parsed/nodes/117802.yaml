      <p>I think in a sense it can though. I suppose you could program a feature which applies the same kind of irregularities you would find in letterpress prints. I think letterpress typefaces usually aren't designed to be warm but become warm due to the printing technique. The same kind of effect could be applied digitally in principle. These irregularities are random and have nothing to do with the control you exert over the design of the typeface.</p>
      <p>So I think first you should define what you mean by a warm typeface or at the very least you should consider that warmth can be applied both to the design of the typeface as well as the effect. What Hoefler is talking about is the effect. In essence you could take a very cold typeface and apply the random irregularities Hoefler mentions and it becomes warm. That's different from DESIGNING a warm typeface.</p>
