      <p>"I disagree. Color and shape themselves do not carry any inherent meaning; however, we have instinctual feeling responses bred into us or learned which are so instantaneous that what we perceive seems to carry meaning."</p>
      <p>Hrant already responded to this well but I have one more thing to add. I completely agree with you here but in reality there is no distinction. We essentially live in a loveless world and yet by being here we do experience love because we make it so. Sharp edges inherently have no meaning, but almost any living organism with the ability to reflect will view sharp edges as something unpleasant, because to most it physically is. Hence we learn to associate sharp edges with unpleasantness and soft edges with the opposite. It does nothing to say that this is inherently not true. It may have relevance in some philosophical/metaphysical discussions but I don't see the implications within type design.</p>
      <p>"I don't think that warmth is a property of a single thing (see above my answer to hrant) but instead it is how we perceive the page as a whole. Making it appear warm might just mean to make it less geometrical and perfect :)"</p>
      <p>That's how I think about it, hence I don't see how Hoefler's quote can be dismissed on grounds of it being post-effects. They're not necessarily post-effects and whether you add bumpy edges and erratic baselines or you're rounding off all serifs, it all helps in breaking that geometry which we associate with coldness.</p>
