      <p>That’s not something I ever think about.</p>
      <p>The trace of process that occurs with letterpress printing is attractive when compared with the bland precision of digital offset. That’s something that can be parsed—but it occurs with all technological progress, look how Morris and Goudy did it.</p>
      <p>I would say, as Hoefler intimates, that any older, more hand-crafted technology will appear quaint, organic and “warm” when compared with subsequent generations of more precisely, mechanically polished engineering.</p>
      <p>Why does a character have to be rendered with exactly the same glyph every time? Changing it up is a strategy I continue to explore, but not in search of warmth, it’s a philosophical pursuit.</p>
