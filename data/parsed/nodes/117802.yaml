      <p>I find that analogy to be ridiculous. By that way of reasoning indeed you're "faking" warmth. What I'm suggesting is that there are two different scales in which warmth can be applied to a typeface. You seem to be completely disregarding one of these scales as "merely an effect". I think it's actually vastly different from applying a Photoshop filter. I'm talking about the design of the typeface in which you may utilize some programmable effects but this is very different from utilizing the post-production effects like in Photoshop.</p>
      <p>I think whether you digitize a letterpress typeface based on the prints, you design a warm typeface from scratch or you design a cold typeface (like the lead letters before it's printed) and apply the same irregularities you would usually get from printing digitally, I think you could still get to the same results. In fact, option 1 and 3 seem to be virtually indistinguishable. I have the feeling you guys are only considering option 2, in which case you would be designing an inherently warm typeface possibly but not necessarily without utilizing any of the irregularities you seem to consider to be "merely an effect".</p>
