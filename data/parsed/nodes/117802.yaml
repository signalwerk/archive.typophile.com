      <p>"When I was setting metal type in the 1960s, we considered the side effects of ink awareness as sloppy craftsmanship. We tried for a kiss impression which minimized the blobby effect as much as possible. We did not seek to add it in for warmth."</p>
      <p>That's completely besides the point. The fact remains that blobby effects do add warmth. Earlier Hrant argued that shapes have inherent values and rounded shapes invoke warmth and friendliness. Whether you utilize rounded forms in the design of the typeface itself or utilize the rounded shapes which come from inaccurate printing methods, in both cases it adds warmth. One type of warmth may be undesirable to some but that's besides the point.</p>
      <p>The design of a typeface should always start with considering the larger structure. However, I think if you want to go for a warm look you will often utilize some of the features I talked about fairly early on in the design process, rather than applying it as a post-effect. I absolutely don't believe Hoefler was suggesting that you can create authentic warm typefaces by (merely) making use of post-effects. I think what he was suggesting is that these are tools to utilize in making your typeface warmer. My research into Bram de Does' and Evert Bloemsma's work lead me to the conclusion that seeing type as fluid will do remarkable things in regard to the vividness and warmth of the typeface, and the use of erratic baselines – as Hoefler suggests – is a pretty powerful instrument to do this. In fact, Garamond utilizes this as well in a subtle way.  But speaking of bumpiness and rounded edges, look at how fluid of a typeface Garamond is. THAT's what makes it so warm. So, you're right Garamond has inherent warmth, exactly because of some of the things Hoefler talks about. I don't quite understand how you can dismiss Hoefler's quote and yet name Garamond, in which everything he talks about is utilized. Am I missing something?</p>
      <p>"We did not seek to add it in for warmth. Why would I want to do that now?"<br>
      I think this is just your philosophy though. Looking at certain typefaces done by professional designers strongly seems to suggest that.</p>
      <p>Besides, I can understand that you want to utilize a specific technique as best you can. Obviously you would try to avoid the blobby effect as much as you can to be considered a master at this craft, but looking back on older techniques I think we feel rather nostalgic about certain random effects and the more fluid appearance you get by utilizing these printing techniques. Isn't adding warmth to our typefaces a reference to classical typography?</p>
      <p>The more I talk, the more I get the feeling "fluid" is pretty much a keyword. A fluid appearance can be achieved by chirographic forms, by not repeating elements, by a dynamic display of lines, by unexpected curves, by rounded shapes, by irregularities in color and by erratic baselines. Why dismiss half of those as merely an effect? Why not consider them as part of the whole design process?</p>
