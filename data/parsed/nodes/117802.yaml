      <p>I agree with the opinion that a sense of warmth depends on curves, smoothness and small irregularities.</p>
      <p>The reason may be that these properties are evocative of the shapes found in humans/other organic beings, the shapes found in pleasent and comfortable objects in the physical world (like a soft feather bed), and a notion of freedom from restrictions.</p>
      <p>For example, Willberg compared the letters of humanist typefaces like Garamond with wanderers, and those of classicist typefaces like Walbaum with soldiers.  The rounded forms of a Garamond are reminiscent of a human’s natural posture.  The straight lines and perfection in Walbaum on the other hand are something found in humans only if external restrictions are imposed, like in the case of soldiers forced to show an unnatural behaviour.</p>
      <p>dezcom: <cite>Hoefler makes it sound like a photoshop filter being applied to Helvetica can make it warm feeling.</cite></p>
      <p>I believe this to work.</p>
