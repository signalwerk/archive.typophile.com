      <p>I can't top the resident gurus on recommended reading or theory but I can mention two type faces that I consider "warm." Applying the rounded serifs criterion to a conventionally regular font: <a href="http://www.myfonts.com/fonts/tiro/plantagenet/" title="http://www.myfonts.com/fonts/tiro/plantagenet/">http://www.myfonts.com/fonts/tiro/plantagenet/</a> Applying the irregularities criterion to a font without producing an unfriendly, i.e. cold, grunge or distressed appearance: <a href="http://www.myfonts.com/fonts/juraj-chrastina/besley-hand/" title="http://www.myfonts.com/fonts/juraj-chrastina/besley-hand/">http://www.myfonts.com/fonts/juraj-chrastina/besley-hand/</a><br>
      My opinion about a "warm" typeface is that the effect does not lend itself to a precise prescription of techniques, but the reader recognizes it as warm rather than cold when he sees it.<br>
      But I suppose nobody would be harmed by a theory of "warm" typefaces.<br>
      I wonder what are the limits of the discussion. Do the typefaces include cursive script -- which can have many tones from shaky and staccato [not warm] to rounded and "girly" with some but not perfect regularity [perhaps warm]. How much contrast is warm? Montotone, like Kaufmann is mechanical, not warm. The extreme contrast of the pen pressure in scripts like Snell Roundhand does not seem warm to me.<br>
      Don</p>
