    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Uitnodiging_6590.jpg"></div><br>
    From 10 September until 2 October 2011, <em>Expert class Type design</em> (EcTd) 2010–2011 students of the Plantin Institute for Typography will show their work at the famous Museum Plantin-Moretus in Antwerp. The title of the exhibition is <em>De magie van het letterontwerpen | Van schets tot digitale letter</em> (<em>The magic of type design | From sketch to digital type</em>).<br>
    &nbsp;<br>
    The students’ work is presented and explained on large panels, printed by Agfa. Also original sheets showing different stages of the design processes are displayed in showcases.<br>
    &nbsp;<br>
    The EcTd course takes place at the Museum Plantin-Moretus yearly. It spans ten teaching days spread over roughly eight months. In between the lessons the students have to work at home on their projects. The lecturer is Frank E. Blokland.<br>
    &nbsp;<br>
    As one can read at the <a href="http://www.plantingenootschap.be/?page_id=3102&amp;lang=en" rel="nofollow">website of the Plantin Society</a>:<em><br>
    ‘The Expert class Type Design given by the Plantin Institute of Typography examines the “secrets” of con­tem­po­rary repre­sen­ta­ti­ons of the Latin script (capi­tal, roman and cursive) in detail. The under­ly­ing har­mo­nic, pro­por­ti­o­nal and rhyth­mic struc­tu­res of charac­ters and the typo­gra­phi­cal con­ven­ti­ons and rules deri­ved from them are ana­ly­zed and dis­sec­ted.’</em><br>
    &nbsp;<br>
    The exhibition is sponsored by (in alphabetical order) <em>Agfa</em>, <em>Dutch Type Library</em>, and the <em>Museum Plantin-Moretus</em>.<br>
    &nbsp;<br>
    On Typophile some more information can be found <a href="http://typophile.com/node/84858" rel="nofollow">here</a>.<p></p>
