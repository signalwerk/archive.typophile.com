    <p>Hi,</p>
    <p>i'm doing a magazine and i wanted to use Big Caslon italic as a display font because of it swashes and elegance in bigger sizes, compared to adobe caslon pro italic.<br>
    Anyone knows if it is still wallpaper's exclusive font?<br>
    Can i buy it anywhere? Or can you think of any alternative fonts?</p>
    <p>And do you know an elegant dingbats font i could use with it? i need an elegant pointing hand...</p>
    <p>than you,</p>
    <p>jonas</p>
