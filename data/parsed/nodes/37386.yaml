      <p>You answered your question.&nbsp;&nbsp;:)&nbsp;&nbsp;Indeed you need to plan carefully which ligatures shall have priority.<br>
      Don't forget the space between 'a' and 'm', or 'c' and 'a' -- 'am' would be considered as one glyph named 'am'.</p>
