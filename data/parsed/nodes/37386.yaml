    <p>I'm probably answering my own question but:</p>
    <p>if i have ligatures for 'a_m' and 'c_a' and i write the word 'came' how it does it work exactly.</p>
    <p>if my coding goes</p>
    <p>sub am by a_m;<br>
    sub ca by c_a;</p>
    <p>then i'm assuming it would use the a_m ligature.</p>
    <p>I'm creating a ligature rich font and was wondering if people know of any problems with having a lot ligatures.</p>
