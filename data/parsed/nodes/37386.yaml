    html: |-
      <p>One very common mistake is to mix up the priority of overlapping ligatures, e.g.</p>
      <p><code>sub f f i by f_f_i;<br>
      sub f f by f_f;<br>
      sub f i by f_i;</code></p>
      <p>If that ffi ligature is not first, it will get preceded by the others and never appear.</p>
      <p>Also, beware of the output of other alternate features (e.g. 'salt') affecting the input of ligatures. You might want an alternate f to be included in your ligature substitution -- or you might not. If you have contextual substitutions ('calt', 'clig'), then you'll have to worry about other alternates and ligatures affecting the context in those features, too.</p>
