    html: |-
      <p>Well, fontobsession, at least you weren't defaulting to Helvetica or Myriad! </p>
      <p>If you were looking for something contemporary to Gill Sans and Futura (before they told you about Neutraface) but different, I would have said Goudy Sans...</p>
      <p>Avenir is a great suggestion - like a remix of the best of Futura and the neo-grotesque pattern, but how come nobody mentions the very workable Trade Gothic or Frutiger families in this discussion?</p>
      <p>Most clients can be persuaded to see the necessity of an update to Modula or Meta or Officina or even DIN (which I think is still dead fashionable despite having no italics...)</p>
      <p>Or how about Syntax, the world's most underrated humanist sans serif?</p>
      <p>IMHO, Gill Sans and Futura are the defining faces of the early twentieth century and represent two really contrary ideas about type design. They also came (by overuse) to represent the graphic vernacular of two entire nations; the mid-century joke was 'Q. How do you do British graphic design? A.Set it in Gill Sans and print it in racing green.'</p>
      <p>They BOTH use optical adjustment to tweak the letterforms into appearing like they're monoline, but they follow radically different patterns of construction. Each idea has its strengths and weaknesses, which can be revealed by examinining the progression of heavier weights in the family - by the time you get to Gill Elefant or Futura Extra Bold, it should be apparent that neither of them is perfect.</p>
