      <p>joe-<br>
      you're absolutely right, those are much better examples of  "simple, block type".</p>
      <p>i was more responding to the 'tired of defaulting to gill sans bit'.<br>
      gill sans was my ol' standby for ages when i needed a classic, clean, sophisticated, handsome type.  There are thousands of sans that fit that description, but in the  bolder weights the distinct personality of gill sans (with it's perfect circles and consistent stroke thickness) was hard to match.  I ran across neuraface a few years and found it to share a very similar geometric sensibility as gill sans... just interpreted a little differently.<br>
      i think of neutraface as being gill sans slightly more eccentric sister.<br>
      it appeals to the same type of clients and projects that would call for gill sans, but the deco element adds a little vintage flair.</p>
      <p>however, you're right, it's not really what i would call a general workhorse typeface.  i just like using it specifically as a gill alternative.</p>
