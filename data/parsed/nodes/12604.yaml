      <p>ok, ok!<br>
      so the O and Q are only 'optically' perfectly round then...<br>
      jeez!</p>
      <p>but i would argue that – (except for a few kooky places like a and e) -- the stroke thicknesses are in fact quite consistent in gill sans…<br>
      certainly more so than futura!</p>
      <p>compare b, p, or q for example.<br>
      futura takes a geometric approach to the letters, preferring a neat, circular eye (eye? Is that right?) putting the negative space of the stroke a priority over the stroke itself.  As a result, the stroke is steeply tapered at points.<br>
      gill is more interested in keeping a steady, consistent stroke that, yes, tapers subtlety at joints but quickly restores the established width... in return it’s curves are soft and flabby compared to futura, but the stroke retains it's established thickness much more than futura. </p>
      <p>as it's 'geometric sans serif' classification implies, futura certainly has the look going for it, but for some reason i tend to associate the humanist sans, particularly gill sans, with a more mathematical perfection. </p>
      <p>that's my story and i'm stickin' with it!</p>
      <p>really though, does that make since?  i'm curious.  or is my untrained eye seeing 'perfect circles and consistent stroke thickness' in places where it doesn't exist?!</p>
