      <p>Neutra needs to be thought of as a strong spice. If what your after is a nice pungent modernist aroma then Neutra is a good choice. And, you can tone it down if you license the entire opentype family by using the text versions with the alternates as opposed to the display versions. But, it isn't humanist it is definitely geometric.</p>
      <p>However, if you want something more humanist in a sans, and a little off the beaten humanist path, and still want that pungent aroma, check out <a href="/wiki/Anisette%20Petite" class="freelinking" rel="nofollow">Anisette Petite</a> from <a href="http://www.typofonderie.com/" rel="nofollow">Porchez Typofonderie</a></p>
      <p>Going down the unexpected grotesque aisle you could check out <a href="/wiki/Amplitude" class="freelinking" rel="nofollow">Amplitude</a> from <a href="http://www.fontbureau.com/" rel="nofollow">Font Bureau</a> which is rumored to be expanding its flavor (not) soon (enough).</p>
      <p>FF Bau from <a href="http://www.fontshop.com/" rel="nofollow">Font Shop</a> recently gave birth to italics -- not obliques which seem to be more in keeping with grots -- thanks be to the day.</p>
      <p>And if you really do like Gill, but hate the little intrinsic quirks that make it annoying -- the lowercase t -- you really should look at Bliss from <a href="http://www.typography.net/" rel="nofollow">Jeremy Tankard Typography</a>. And while you are there definitely check out Shaker too.</p>
      <p>I'm with Paul on Stainless. I lurv that typeface a little too much. </p>
      <p>(I must be hungry)</p>
