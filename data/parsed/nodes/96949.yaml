    The email I just received today asks about using one of my fonts for props for a Warner Brothers TV production. Last month I signed an amended agreement for someone that included some TV promotions, but it was a small scale client. So after all the paperwork and emails I sold 1 standard license. Hardly worth the time. It seems ridiculous to do that for a major deal like this, but I fear my current EULA is not putting me in a position for negotiation. The only tweak it has that might be in my favor and might be why they are asking is where it says "Use of this software beyond these parameters will require additional licensing. For large multi-end user licensing please contact Stephen Rapp at (my ph. number) for a quote."</p>
    <p>Any advice would be most appreciated.</p>
