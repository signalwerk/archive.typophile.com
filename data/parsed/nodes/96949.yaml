      <p>As someone that has had to license for movie and television use before, I can tell you that the easier you make it, the more likely it is to be used. I've spec'd a typeface before and the foundry was so concerned about every single possible permutation of use that we just went with someone else to save us the hassle. </p>
      <p>Don't get me wrong, you should do whatever makes you comfortable, but please don't punish people for playing by the rules. It's an industry that has ignored licensing (for at least the 15 years that I've been doing it), and it looks like Frank Martinez's work is changing that opinion. Work with them.</p>
      <p>Maybe add a clause to your EULA that television and movie usage is on a case by case basis and that you'd be happy to work with the studio or agency. It's in both of your interests for it to get licensed.</p>
    html_clean: |-
