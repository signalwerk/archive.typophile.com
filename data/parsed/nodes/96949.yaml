      <p>Neil—</p>
      <p>Are they public servers or in-house network servers. I am not really sure of a reason to treat licensing any differently in the latter instance: the total number of users is the total number of users, regardless of where they are geographically, as long as the corporate license covers them all.</p>
      <p>OTOH, if the fonts are mounted on a publicly-accessible server on the internet, then you have the thorny problem of exactly how many users you actually have, and how many of them are occasional or one-time users—as in the case of customization of products, from wedding invitations to t-shirts. As I have advocated elsewhere, the only sensible approach—to my fevered mind—would be to impose and collect a one-time DRM fee at the point of sale, a task which <em>ought</em> to be simple enough to accomplish…but, then, finding <strong>someone</strong> who can help me edit the spacers out of an AI swatch <em>ought</em> to be simple enough to accomplish, too; however, to date, not a single person has offered a solution. Go figure.</p>
