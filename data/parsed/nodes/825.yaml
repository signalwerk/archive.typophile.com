    html: <p>&gt;Now there's nothing wrong with freeware, but the people who go out to buy a book full of freeware are not very likely to be the same people that are going to help you build your career. <br> <br>I'm sorry but this is my point, even if expressed by an "Anonymous". <br>Putting myself in the shoes of a very young potential buyer I feel an abyss between what Typography Now represented and what a book like the one Jim's working on could do. <br> <br>I'm the first to say Max Kisman has never received the credit he deserve while other people have received far more credit than they deserve, but I cannot help but share most of what Joe VanDerBos (hey Joe!) and Nick have said. <br> <br>For me it's not something simply centered around trade ethics. You need flexibility as long as you care about not breaking anything apart. What I dislike about such things is the mixture of things without anything to share. <br>This sort of thing buries your own work under the work of any other, it's mutual, and in the end makes ANY given work anonymous. <br>While I think (in a timeline) often is not so important WHO does a specific thing as long as someone does it, I want also *criteria* in what I buy. What I usually try do do is exactly the opposite of a book of this kind. <br>No editorial direction at all, nothing left for history. <br> <br>Sorry, it's not aimed to anyone in particular, but to Max I can just say this kind of idea maybe gives you some exposure, but will never work any good in the long term. It will work good just for design leeches ready to copy your clipart to their hard drive and produce endless meaningless mimic acts. OK for f***ing italian "designers" which pirate all day and are worried just to cash and not at all by what they do. <br></p>
