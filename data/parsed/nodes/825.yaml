    date_raw: 6 Aug 2003 — 10:30am
    votes: null
    html: "<p>A few thoughts: <br> <br>If my work is so good big clients and publishers alike line up at my door,  <br>why should I care about a book with free clip-art design? <br> <br>If my work is so mediocre I feel threatened by the publication  <br>of a free clip-art design book, shouldn't I worry about more important stuff? <br> <br>What is the difference between clip-art and stock photography  <br>or illustration? the price? or the decisions we, as designers, make in order to <br>choose the images that are right for the project? <br> <br>If I need a high-quality, versatile, extended typeface family for a big corporate  <br>identity project, I know where to look for it. If I need a fresh, insolent,  <br>rebellious typeface for a guerrilla marketing project, I might not look for it <br>at the same place. <br> <br>Given that all the details are in the open, aren't we all adults enough <br>to decide wether we want to participate or not in any project? <br> <br>The fact that my work is offered copyright-free in this book, or copyrighted <br>in the latest AIGA annual, is not going to deter students, serious designers,  <br>amateurs or pirates from copying it, draw inspiration from it, ripping it off,  <br>referencing it, abusing it or, simply, laughing at it.</p>"
