    html: <p>Fontmonster has been giving free fonts away since 1998. Fontmonster.org is an outlet for the designers who give away fonts there. The designers in fontmonster have gained exposure and made connections through the site. <br> <br>We have done a free font project with Max, Erik Spiekermann, Jorge Alderete, Malcolm Garret and Designer Shock, and has acted as a stage for unknown designers to be seen by the design community (and developed in to other collaborations) <br> <br>If fontmonster had not been online a lot of  fonts would not have been published, used etc and I think that would be a waste. I know that at least one of the designers to do free fonts on fm got a job because of it. <br> <br>For me the book is a development of that idea, its an outlet for designers to produce creative work...</p>
    html_clean: <p>Fontmonster has been giving free fonts away since 1998. Fontmonster.org is an outlet for the designers who give away fonts there. The designers in fontmonster have gained exposure and made connections through the site. <br> <br>We have done a free font project with Max, Erik Spiekermann, Jorge Alderete, Malcolm Garret and Designer Shock, and has acted as a stage for unknown designers to be seen by the design community (and developed in to other collaborations) <br> <br>If fontmonster had not been online a lot of  fonts would not have been published, used etc and I think that would be a waste. I know that at least one of the designers to do free fonts on fm got a job because of it. <br> <br>For me the book is a development of that idea, its an outlet for designers to produce creative work...</p>
  - id: 6018
    user: 1461
    date: 2003-08-06T08:40:00
    date_raw: 6 Aug 2003 — 8:40am
    votes: null
    html: <p>I'm not against a book like this. I'm intrigued by ideas of 'open source' visual design. I think a designer could have fun with a book like this. <br> <br>What I didn't like is the 'pitch' claiming that by contributing to this project a designer will actually benefit from exposure. There is nothing to be gained from the contributor other than having a bit of fun. And that's fine. Don't try to sell it as more than that, though. <br> <br>Also, having to sign away all rights to work that will be simply used by the publisher (and subsequently 'maybe' used in the book and, if so, then given away) is simply spec work. And that's bad. Granted, I'm not really sure if this is different than any 'invitational submissions' Rockport book or some such thing.</p>
    html_clean: <p>I'm not against a book like this. I'm intrigued by ideas of 'open source' visual design. I think a designer could have fun with a book like this. <br> <br>What I didn't like is the 'pitch' claiming that by contributing to this project a designer will actually benefit from exposure. There is nothing to be gained from the contributor other than having a bit of fun. And that's fine. Don't try to sell it as more than that, though. <br> <br>Also, having to sign away all rights to work that will be simply used by the publisher (and subsequently 'maybe' used in the book and, if so, then given away) is simply spec work. And that's bad. Granted, I'm not really sure if this is different than any 'invitational submissions' Rockport book or some such thing.</p>
