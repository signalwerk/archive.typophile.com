    html: "<p>When I read the discussion, I realize that so many of the 'moral' values have changed in the last decades since I have been a professional designer. I was shocked that the photocopy machine made it much easier than the reproduction camera to reproduce line art work and type. At that time you could easily copy any typeface from any type specimen book for a headline. No problem for the inventive designer. The introduction of the desktop computer made the darkroom obsolete. And not only the darkroom, the type setter as well. And designers thought it was great to put hard working people out of business.  <br> <br>Or what? Computers then made designers obsolete, because everybody can be a designer. And why not? So you're on you own and nobody will help you. It's do or die. Some will be lucky (who would have set up a reasonable business) and some are screwed (who would think they were artists). Some survived and some barely make it. The thing is: it's all around. In music, In art, in business, in science, in politics. in advertising. You're not alone! <br> <br>If you think you're so great, well, get your act together, and eithter fight it all or sew everybody, be happy and retire. Or, be just ahead of it. ALL THE TIME. If you are such a champ you claim or think you are, you should know better, and deal with it accordingly, rather than whine. <br> <br>This book will come and go and will mean nothing more than any other great book as a sign of the times when we look back to it. And, Typography Now made a lot of things happen. <br> <br>To be honestly, under the (and my personal) current circumstances, I am happy with any exposure I can get. In Indie Fonts as well as the Fontmonster book, or an article in the Argentinean Tipografica magazine or the Brasilian Tupografia. In spite of my reputation or career. But I might have different expectations or even a different strategy then others of what I think I can get out of it. <br> <br>There are no ethics, but there are... A changing world demands adjustments and flexibility. I think it's so great that younger designers then me, worry about stuff their generation made me realize that the evolution in this profession won't stop with yourself. All is relative. <br> <br></p>"
