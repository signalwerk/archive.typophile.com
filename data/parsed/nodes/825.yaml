  - id: 6013
    user: 614
    date: 2003-08-05T14:35:00
    date_raw: 5 Aug 2003 — 2:35pm
    votes: null
    html: <p>Firstly I think Indie Fonts is great, and it is working well for us. But foundries don't get a cut of the revenue, they get 100 books, which they can sell to get back the money spent on being in the book. I don't have the figures in front of me but I think it cost us about $2000 (including the postage to get them to the UK). <br> <br>While this was a deal I am happy with, others may not have the money to do this. <br> <br>Would it be better to charge designers to be in the fontmonster book and self publish?  <br> <br>The fontmonster book is aimed at young designers, it will be published by Booth Clibborn Editions, a very well respected design publisher, and is aiming to be a Typography Now for a new generation.  <br> <br>I understand that people may not get the difference between this and a clip art book, really its just the quality of the stuff in the book, and the way in which it is promoted by the publisher. <br> <br>I also understand that people may not want to be in the book.</p>
