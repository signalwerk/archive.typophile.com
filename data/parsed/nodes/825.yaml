  - id: 6014
    user: 1329
    date: 2003-08-05T15:50:00
    date_raw: 5 Aug 2003 — 3:50pm
    votes: null
    html: "<p>I'm trying to find a polite way of saying this, but it's not coming out that way. I really don't understand the difference between this and a clip art book. Presentation? There are lots of ways clip art is being proffered these days. One more iteration won't make it any more respectable to me. The people who create the content get recognition, nothing else. The purchasers are rewarded, once again, for avoiding pay-per-use. Is it any wonder illustration as a way of life is nearly dead? <br> <br>I'm truly curious, not being mean about this point: The editors get... what? An advance against royalties for putting it together?  Royalties after a certain number of sales? Or only recognition? If its only recognition, then only the publisher will profit by the contributions, which is bad enough. Booth Clibborn isn't publishing it for \"recognition\" I suspect. <br> <br>I'm sure some young and inexperienced type designers and illustrators will find recognition an appealing prospect. But I've learned that recognition for giving away something for free leads to recogntion as an easy touch. You attract what you encourage. <br> <br>It's not something I want to do anymore. I'm only posting my position on giveaways as a bit of discouragement to any young designers who think lots of experienced ones are rushing to this opportunity. I'm not. I think reinforcing the idea of pay-per-use is the only way to turn the tide and get respect for the work we do as illustrators and type designers. <br> <br>That said, I'm turning 40 and am WAY less concerned about all these issues. There is a whole range of work out there for every audience. My audience is the one with money to spend. To each his/her own. Publish away!  <br> <br>Joe</p>"
    html_clean: "<p>I'm trying to find a polite way of saying this, but it's not coming out that way. I really don't understand the difference between this and a clip art book. Presentation? There are lots of ways clip art is being proffered these days. One more iteration won't make it any more respectable to me. The people who create the content get recognition, nothing else. The purchasers are rewarded, once again, for avoiding pay-per-use. Is it any wonder illustration as a way of life is nearly dead? <br> <br>I'm truly curious, not being mean about this point: The editors get... what? An advance against royalties for putting it together?  Royalties after a certain number of sales? Or only recognition? If its only recognition, then only the publisher will profit by the contributions, which is bad enough. Booth Clibborn isn't publishing it for \"recognition\" I suspect. <br> <br>I'm sure some young and inexperienced type designers and illustrators will find recognition an appealing prospect. But I've learned that recognition for giving away something for free leads to recogntion as an easy touch. You attract what you encourage. <br> <br>It's not something I want to do anymore. I'm only posting my position on giveaways as a bit of discouragement to any young designers who think lots of experienced ones are rushing to this opportunity. I'm not. I think reinforcing the idea of pay-per-use is the only way to turn the tide and get respect for the work we do as illustrators and type designers. <br> <br>That said, I'm turning 40 and am WAY less concerned about all these issues. There is a whole range of work out there for every audience. My audience is the one with money to spend. To each his/her own. Publish away!  <br> <br>Joe</p>"
  - id: 6015
    user: 2021
    date: 2003-08-05T15:50:00
    date_raw: 5 Aug 2003 — 3:50pm
    votes: null
    html: <p>Thanks for your support, Anon. <br> <br>Indie Fonts "does it right" because, as Stephen points out, it involves a "fair trade". Contributors get what they pay for. They prepare the artwork (some of it to template), and it gets printed. It is, in effect, a book of advertisements. <br> <br>Another acceptable model for a type book that covers a variety of foundries is Allan Haley's "Cool Fonts...", published by Rockport. This is a proper book, because it has a writer who chose the content, and a designer who gave it a consistent look.  <br> <br>Too bad if you can't afford to be in Indie Fonts, and Allan didn't pick you for his book. (That's me on both counts.) But that's no reason to create spec work.  <br> <br>Booth Clibborn should know better than to exploit "young" designers for the "young" design market. That doesn't make it OK. And the design "names" involved should know better than to take advantage of this kind of set-up. The paradigm is reinforced -- put up with the crap when you're starting out, and reap the benefits later. But only a few do -- there has to be a better way.</p>
