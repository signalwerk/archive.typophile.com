    html: <p>Darrel, I get where your coming from on the brief, and I agree it's a bit hardsell. <br> <br>The contract is actually with fontmonster, a not for profit organisation run by a collection of designers, so no big bad publisher can take the stuff and mess people about, the editoral board control the content up to the release of the book, and it will only be used in the book. <br> <br>The book aint a big money making scam, if it did make money that profit would be split between the publisher who has risked money on the venture and fontmonster, which like I say is a not for profit organisation and I guess we'd use it to keep fm online (hosting costs etc) or self publishing a second book. But even the most generous estimates put the profits at $2000 - $3000 if it makes a any money at all.</p>
