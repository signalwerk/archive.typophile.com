    html: <p>I have been burned by this sort of project before. <br> <br>People are asked to invest time and effort in submitting material to a book. In essence, it's a competition, with free content for the publishers. It's spec work, which is unprofessional, and a no-no for AIGA, GDC members. <br> <br>It's great for the celebrity designers who provide the "keystone" for this commercial venture, they are guaranteed free advertising. But for the rejects, well, we're just no-talent suckers, aren't we?  <br> <br>IndieFonts does it right.</p>
