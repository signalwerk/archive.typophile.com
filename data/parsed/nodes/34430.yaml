      <p>Hex isn't a color model, merely a way to write the RGB values using hexadecimal numbers.</p>
      <p>There's really no point in trying to find some set-in-stone numerical conversion of Pantone to RGB for on-screen media. Just hold your swatch up to the monitor and take a best guess at it. Nearly all monitors are going to be different from each other, so you're really just aiming for a ballpark approximation anyways.</p>
    html_clean: |-
