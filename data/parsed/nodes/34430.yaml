    <p>As colour on coated and uncoated paper appears different, so should be the RGB value to reflect this.</p>
    <p>Could someone in North America please do me a favour? I need the recommended RGB colour value for Pant 369 U and Pant 485 U. Could someone please look this up in the ColourBridge Uncoated?</p>
    <p>We would have bought the Colour bridge uncoated, but there is NO EUROPEAN VERSION. For some reason only a coated version of ColorBridge exists in Europe. Who knows why, but there is really little point for is buying the North American version.</p>
    <p>Many thanks.</p>
