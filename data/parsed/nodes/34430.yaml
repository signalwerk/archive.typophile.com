    html: |-
      <p>I agree with Linda. I would also note that Pantone color conversions tend to be more visually accurate (for print) in Illustrator and InDesign (which for me have always been identical). Photoshop almost always gives CMYK values different than both of those programs. Because of that, RGB values should also be off.</p>
      <p>I particularly have trouble converting blues from CMYK to RGB...which makes sense, given the different way print and screen see these colors. So your green might end up being off. Just go hex. Pick the closest match.</p>
