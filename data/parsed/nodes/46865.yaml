      <p>When doing a logo.. here is the general process I have learned.</p>
      <p>#1 Know your audience. You want to appeal to a UK and a Hong Kong Market. Hong Kong marketing is a much different ball game than the rest of the world. You're going to be competing alongside of a great deal of other companies that use bright colors to draw attention to themselves.</p>
      <p>#2 Brainstorm. Think of ideas related to your company, the products they will be selling and interesting ways to incorporate the idea into the typeface you select.</p>
      <p>#3 Research type options. You should be looking at examples of high-end design if you want to be high end yourself. In my experience, there's a lot of high-end logos that are usually just a type treatment, sometimes figuring out a new way to treat an old type face. (Making it look gold leafed for example, is the chintziest way to do it).</p>
      <p>Looking at the Falper logo, I can see where your ideas are coming from. Also, all the person doing who is giving you ideas from branding, is simply selecting modern fonts.. like Optima and Rotis and tracking them out. I think there's a more innovative solution...</p>
      <p>Here are some examples I thought might help. </p>
      <p><a href="http://www.dafont.com/theme.php?cat=717" title="http://www.dafont.com/theme.php?cat=717">http://www.dafont.com/theme.php?cat=717</a> - logos<br>
      <a href="http://www.phase-two.co.uk/logos_frank_hudson.html" title="http://www.phase-two.co.uk/logos_frank_hudson.html">http://www.phase-two.co.uk/logos_frank_hudson.html</a> - nice bespoke kitchen maker's logo<br>
      <a href="http://www.habitathc.com/assets/images/New_Logo__3_.gif" title="http://www.habitathc.com/assets/images/New_Logo__3_.gif">http://www.habitathc.com/assets/images/New_Logo__3_.gif</a> - high end modern furniture design, although this logo is pretty mediocre, it's still nice.<br>
      <a href="http://www.uwm.edu/Libraries/special/currentevents/recentacq/recentacqimages/Wright2.jpg" title="http://www.uwm.edu/Libraries/special/currentevents/recentacq/recentacqimages/Wright2.jpg">http://www.uwm.edu/Libraries/special/currentevents/recentacq/recentacqim...</a> - the font for wright, although it screams 1920s or 30s deco, I think, is a good example of modern/classic treatment. clean, simple, refined.</p>
      <p>I hope this helped..</p>
    html_clean: |-
