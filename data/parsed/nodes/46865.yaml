      <p>So I took a look at the new logos. Much different! Seems like you're headed in a different direction. The first ones that drew my eye would be the first and second one, even though I'm not so sure I'm liking that blue.</p>
      <p>The all caps logos remind me of pixar, or maybe something a little more technology based, not high end furniture. It also seems to make it faceless (just in comparison...I think that's why I really like the lower caps, the letters seem to give the word a personality, good form. Just my opinion. I took a look at the website. Is that the final design? Are you trying to make the logo fit that style or are you going to adjust the web page to the finalized logo?</p>
      <p>I would also have to agree with you that "old fashioned" probably isn't a good tag. I read it and instantly thought of the magazine "Country Living". :)</p>
      <p>I mean, I'm terrible at thinking up tags, but maybe something more like "cozy" or something? Again, I'm bad at thinking up those things, but I gave it a try.</p>
      <p>The font, to me, looks perfect. I mean if someone else can think of a better one then great. It seems very modern but has that swoosh to the ends that give it that softer feel and doesn't compromise the "high end" potential.</p>
