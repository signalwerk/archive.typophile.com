    html: <p>Very first thing that caught my attention was the black and white one. Where the ^ comes down and meets the letters, it has an overhang. The issue I see is that the overhang is far too small. You end up with a tiny bit of black still showing. Almost as if you meant to have it be flush, but didn't quite end up right. Looks like it needs to either be flush, or hang out more, so when someone sees it, they see it and move on and they don't stare and wonder why there is a speck of black showing.</p>
