    html: |-
      <p>You could get the look with Letterhead Fonts' <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/billhead.php" rel="nofollow">Billhead</a>, using the 1900 set for the small caps and 1910 for the caps. Coffee Bin's <a class="freelinking external" href="http://new.myfonts.com/fonts/coffee-bin-fonts/letterhead/" rel="nofollow">Letterhead</a> is based on similar source material. Check out their other offerings.</p>
      <p>Also, in future use the Type ID forum for requests like this. You might have got some more suggestions.</p>
