 to intermingle, join, mix. <br>confundo : to pour together, mix, blend /confound, confuse, trouble. <br>confusio : mingling, mixture /confounding, confusion, disorder. <br>farrago : mixed fodder for cattle, mash /mishmash, medley, mixture. <br>misceo miscui mixtum : to mix, mingle, blend. <br>promiscus promiscuus : mixed, indiscriminate /commonplace, usual. <br>putus : pure, unmixed, unadulterated. <br>tempero : to mix properly, temper, regulate, mitigate <br> <br>Also, <br>evalesco : to grow strong / become fashionable / prevail / be able. (Probably where evolve comes from) <br> <br>Of those I like: the Novo prefix (Nova Jenson), Farrago, Tempero, Tractus, Proficio, and Recipero. But, after a while they all start sounding like spells and potions from a Harry Potter book. Good ideas though. Any favorites from that group? <br> <br>Two more: <br>denuo : anew, again, a second time, afresh. <br>novitas : newness, novelty, strangeness</p>"
