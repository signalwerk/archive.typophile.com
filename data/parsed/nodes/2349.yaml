    html: "<p>Yeah, I think the average person would be looking for Kris Kringle. That's one main reason I'm keen to explore other options. Mitchell, LOL. <br> <br>Revive in Latin <br>-------------------------- <br>novo : to make anew, refresh, revive, change, alter, invent. <br>novus : new, fresh, young, inexperienced, revived, refreshed. <br>recipero : to regain, revive, restore. <br>recreo : to revive. <br>recro : to recreate, restore, revive. <br>renovo : to revive, renew, restore, repair, repeat <br> <br>Progress in Latin (evolution wasn't invented yet) <br>----------------------------------------- <br>processus : procession, progress. <br>proficio : to make progress, advance. <br>progressio : advance, progress, increase. <br>progressus : advance, going forward, increase, a royal circuit. <br>tractus : course, progress, movement. <br> <br>Latin for Change <br>---------------- <br>abeo : + in : to be changed. <br>abeo : to digress / change / vanish, disappear. <br>huius : (fem. sing. gen.) They are fond OF THIS (change). <br>illius : (fem. sing. gen.) They are fond OF THAT (change). <br>inclino : to bend, incline, turn, change / fall back, waver. <br>incommutabilis : unchangeable. <br>inconstans : inconsistent, changeable, fickle, unreliable / faithless. <br>inconstanter : inconstantly, changeably, inconsistently. <br>inconstantia : changeability, inconsistency / faithlessness. <br>inflecto : to warp /change, sway, affect. <br>mutatio : change, alteration, transformation. <br>mutatus : altered, changed, become different. <br>muto : to change, alter /exchange. <br>mutuus : interchanged, mutually, reciprocal / reciprocity. <br>novo : to make anew, refresh, revive, change, alter, invent. <br>varietas : changeableness. <br>varius : changing, changeable. <br>verto : [+ yerga, tergam] turn, retreat/ exchange. <br>vicissitudo: change, alteration. <br>volubilis : rolling, revolving, turning around /changeable, inconstant <br> <br>To Mix <br>------- <br>commisceo : to intermingle, join, mix. <br>confundo : to pour together, mix, blend /confound, confuse, trouble. <br>confusio : mingling, mixture /confounding, confusion, disorder. <br>farrago : mixed fodder for cattle, mash /mishmash, medley, mixture. <br>misceo miscui mixtum : to mix, mingle, blend. <br>promiscus promiscuus : mixed, indiscriminate /commonplace, usual. <br>putus : pure, unmixed, unadulterated. <br>tempero : to mix properly, temper, regulate, mitigate <br> <br>Also, <br>evalesco : to grow strong / become fashionable / prevail / be able. (Probably where evolve comes from) <br> <br>Of those I like: the Novo prefix (Nova Jenson), Farrago, Tempero, Tractus, Proficio, and Recipero. But, after a while they all start sounding like spells and potions from a Harry Potter book. Good ideas though. Any favorites from that group? <br> <br>Two more: <br>denuo : anew, again, a second time, afresh. <br>novitas : newness, novelty, strangeness</p>"
