    date_raw: 11 Dec 2003 — 5:49am
    votes: null
    html: "<p>I second Addison's comments. It's wonderful that you've managed to take such an established style and do something new and interesting with it. <br> <br>Specifically: I'm a sucker for numerals, and I just love the little serif on the '5' (though I agree that the zero needs some stress). The asymmetry of the 'N' works really well, and the 'T' looks really powerful, like a strongman holding weights at arms length. I don't mind the 'g' and I love the lc 'z'. <br> <br>I agree with Hrant about the 'y' and the 'K', I also think the beak of the 'r' looks too short, and maybe too sharp/angular. <br> <br>The new 'R' is a definite improvement. The old one looked as if it was falling forwards, he's certainly a bit more steady on his feet now. <br> <br>Excellent work, it's one of the nicest new text faces I've seen in a while. <br> <br>Jordan <br> <br>P.S. great 'Q'.</p>"
