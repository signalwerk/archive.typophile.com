    date: 2003-12-13T06:11:00
    date_raw: 13 Dec 2003 — 6:11am
    votes: null
    html: <p>Maybe that's because I'm using the wrong terminology. What will probably end up happening is there will be a text version (steming from *book*), and a display version (a modified *roman*). As it stands now, it didnt' make sense to call the roman display because i'd need to thin out the serifs and generally make it more delicate. I was motivated to do the text/book version because when I was printing text samples at smaller sizes 6-11 pt some of the defining details were fading. The top serifs for example, it wasn't clear that they weren't the triangular bracketed veriety found in most venetian oldstyles, so i deepened the cut. Certain joins needed to be reworked so I added trapping, and in some cases (the r, n, m etc) altered the stem (made it vertical) as well to open things up. <br> <br>The resulting text is crispier. And more characteristic of what I wanted. I think the confusion will go away when I call them text and display. (And when the display version is a proper display version :-) Hope that helped. <br> <br>Randy</p>
