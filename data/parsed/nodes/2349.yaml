  html: <p>Happy Holidays Typophiles. <br> <br>Here is the project that has gobbled all my spare time of late. First, let me say, <i>this is not a revival</i>. If you are looking for a proper revival, Bruce Rogers and Robert Slimbach have done nicely. This is me fiddling with Jenson. To be sure it has some venetian overtones, but is unapologeticly streamlined, most notably in the joins and serifs. I had a bit of fun with the f ligatures. They reference Jenson directly in a way I had not seen before, but still (i hope) subtle enough so modern readers don't hiccup. Italics are anybody's guess. Here, I just started drawing (my first true italics). Some of these will surely need revision. They are not overly narrow (a trait I find annoying). The color between the uppers, lowers, small cap and italics is very close. Another Jenson diversion is the short cap height. Numerals are straight ahead (more variations to follow) <br> <br>Curious to hear your reactions. Currently the font is outlines only. I will begin creating the font and get you a text setting shortly. <br> <br>Cheers! <br>Randy <br> <br><img src="http://www.typophile.com/forums/messages/29/22065.gif" alt=""></p>
