    html: <p>The new R is an improvement, but the bottom left serif looks a bit too heavy. <br> <br>I used to find R a difficult letter until I read a comment by Gerard Unger in his article about Capitolium in <i>Typography Papers</i> (issue 3, I think). He said he tried to make the R look like an orator standing with one foot forward. For some reason, this really made sense to me and I've found R much easier to draw ever since.</p>
    html_clean: <p>The new R is an improvement, but the bottom left serif looks a bit too heavy. <br> <br>I used to find R a difficult letter until I read a comment by Gerard Unger in his article about Capitolium in <i>Typography Papers</i> (issue 3, I think). He said he tried to make the R look like an orator standing with one foot forward. For some reason, this really made sense to me and I've found R much easier to draw ever since.</p>
  - id: 18904
