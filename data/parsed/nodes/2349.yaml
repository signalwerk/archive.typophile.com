    html: "<p>The g: I think your chances of pulling off that strategy are actually better than in Mendoza, since your x-height is smaller and your descenders not as short. The \"g\" in Mendoza looks <i>really</i> small - I think yours just needs a little bit of squishing in the bottom loop to give more room for a slightly larger head*. A \"real\" text face always has a slighly ungainly \"g\", because that's the first letter to suffer from the dictates of language (in terms of vertical proportions). <br> <br>* The problem might be keeping the join sitting on the baseline like that. But remember that letters don't get tired. <br> <br>hhp <br></p>"
