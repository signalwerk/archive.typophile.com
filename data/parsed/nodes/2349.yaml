    date: 2003-12-10T07:58:00
    date_raw: 10 Dec 2003 — 7:58am
    votes: null
    html: "<p>The R did give some trouble. Jenson's R is rediculous. Sooooooooo wide! Nice by itself, or as an alternate ending, but it makes for a huge hole. R came first, then the P actually. Do you think the open waist accentuates the issue? I debated about this characteristic, and decided to leave it in all the caps (A,B.P,R). <br> <br>Drawing in Illustrator has advantages. The largest being the ability to have uppers, lowers, smallcaps, and italics all in the same document for comparison. FontLab and Fontographer both feel like I'm working too isolated. It's not so easy to drop some italics in between the regulars to check color etc. If course, it adds the step of having to check over the contours after importing. <br> <br>Zero: Yeah, now that I look, even ciphers have slight optical compensation. <br> <br>y: A stonger tail would be better, i agree. <br> <br>I'll have to mull over the other suggestions <br> <br>Thanks, <br>Randy  <br> <br>Forgot to add: About the dark color. We will have to wait and see how it looks in a text setting. I did make it a bit darker on purpose. I think a light version somewhere between a *normal* roman and light could also be nice, the that is a daydream right now. </p>"
