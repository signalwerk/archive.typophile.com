      <p>I like it. No need to be trepid :)</p>
      <p>There is, however, some sharpness and angularity in the type while there is softness in the underscore and dot. Some further honing of the letterforms could have been done, I think, to bring them both into a better harmony.</p>
      <p>But overall it feels nice.</p>
      <p><em>penn</em></p>
