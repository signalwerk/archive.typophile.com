    html: |-
      <p><em>I think it only looks different because it's what was available in the context of the typewriter face.</em></p>
      <p>It's not about the shape, it's about the fact that an upright symbol was used in an italic context, thus following a convention that doesn't apply to maths (even though apparently the italic phi <em>was</em> available).</p>
      <p>On second thought, I'd say that setting captions in italics is a fairly stupid idea here. Formulae rely on the differences between italics (variables/functions), roman (units) and bolds (vectors). Changing the context like this is just going to make things confusing.</p>
