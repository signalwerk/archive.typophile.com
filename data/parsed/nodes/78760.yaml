      <p>Formulas should be the same, whether in an italic context (theorems are normally set in italics) or an upright context (definitions are normally set upright). If a letter phi represents an angle, then it should look absolutely the same inside a definition or inside a theorem.  In the example above, not only the phi was changed, but also the s. You just don't do that.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/formulas_4245.jpg"></div><p></p>
      <p>The conventions for the formulas are not universal. French mathematics uses upright roman capitals and upright greek letters (independently of the case). In the US, latin capitals and small greek letters are in italics, but greek capitals are normally upright. Journals may have their preferences for the font to be used for vectors, tensors, etc. Once you are given the conventions, you stick to them. If a symbol is to be written with an upright bold sans, then it needs to be an upright bold sans everywhere in the text, independently of the context. </p>
      <p>[Added] Here is how the formula may look like with the LaTeX Fourier math font (Utopia based). </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/forms_5011.jpg"></div><p></p>
      <p>The parentheses are upright even when the letters are in italics. The first line uses the US convention, the second uses the French convention. The examples show both LaTeX symbols \phi and \varphi.</p>
    html_clean: |-
