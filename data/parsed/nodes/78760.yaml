    html: <p>I agree that it looks horrible by modern standards, but I believe it's the result of the limited resources of a bygone time. Someone probably pasted the diagrams as images from another source, and the manuscript and captions probably come from an <a href="http://en.wikipedia.org/wiki/IBM_Selectric_typewriter" rel="nofollow">IBM Selectric typewriter</a> (note the paragraph about mathematics in the Wikipedia article). That's why Luca has all this work to do in the first place. I notice that the phi does have a mild slant even though it disappears in comparison to the slant of Courier.</p>
