    html: <p>Greek letter phi (φ), in the form that has a tall stroke. It may be either upright or slanted, according to the overall design. Here it looks like the intent is that the slanted ones are italic (as mathematical symbols often are) and the non-slanted ones regular (because they are a symbol that would normally be italic, within text that is as a whole italicized).</p>
