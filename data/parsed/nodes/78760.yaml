    html: |-
      <p><em>... and the non-slanted ones regular (because they are a symbol that would normally be italic, within text that is as a whole italicized).</em></p>
      <p>Which is really odd. It's true that, in terms of typographic operators, italic² = regular.</p>
      <p>But I've never seen this convention applied to formulae. Variables and function names are usually set in italics no matter the context (the <em>s</em> is, for example). This matters, because some functions and variables are distinguished from others by setting them upright — in quantum mechanics, for example, Schrödinger's wave function is often written as <strong>Ψ</strong> in its time-dependent, and <strong><em>ψ</em></strong> in its time-independent form (at least in the textbooks I've come across). </p>
      <p>As such, I would suggest that you keep all φ's in italic here: both along the axes and in the caption.</p>
