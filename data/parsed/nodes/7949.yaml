    html: <p>Maybe try decomposing the characters before generating the fonts (after you have generated the instances). <br> <br>Do the characters look okay in the instances you generate? <br> <br>Also you might try clearing the system font cache using <a href="http://versiontracker.com/dyn/moreinfo/macosx/22795" target="_blank">Font Finagler</a>, for example.</p>
