  html: <p>Hi <br>I'm using Fontlab 4.6 in MacOsx Panther 10.3.  <br> <br>I'm generating intermediates from light and black weights using multiple master weight axis. When I generate the different weights of a font (Light, Book, Medium, Bold, Black) it goes ok on the screen. But when I print them, the caps accents of all of them, except the Book weight, appear printed by half. Some of the descendents like the lower limit of "g" and florin also appear incomplete. <br> <br>What's possibly happening? <br>Thanks.</p>
  html_clean: <p>Hi <br>I'm using Fontlab 4.6 in MacOsx Panther 10.3.  <br> <br>I'm generating intermediates from light and black weights using multiple master weight axis. When I generate the different weights of a font (Light, Book, Medium, Bold, Black) it goes ok on the screen. But when I print them, the caps accents of all of them, except the Book weight, appear printed by half. Some of the descendents like the lower limit of "g" and florin also appear incomplete. <br> <br>What's possibly happening? <br>Thanks.</p>
