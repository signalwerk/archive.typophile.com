      <p>I’m guessing you already have a font in mind form your post?</p>
      <p>While I see the benefit of having condensed fonts as part of a a family for a corporate font, I’ve never given it much consideration as part of the identity. I like identities to read well and to be useable at small sizes, something condensed or compressed fonts don’t always do. I think it’s fine to use condensed for small amounts of copy but would be leery of using it for a publication of several pages or more.</p>
