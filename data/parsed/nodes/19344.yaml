    <p>I’m considering a condensed font for a corporate identity application. It’s main uses would be the logotype (but this could also be regular width) on screen as headers and headlines, stationary materials (card, letterhead, envelopes, etc.), printed documents like one-page proposals and brief contracts (less than ten pages), and possibly some small format promotional materials.</p>
    <p>I like the character of the condensed version better than it’s normal width sibling, and while I’m sure they could be used n combination quite effectivley, I’m wondering if I can pull it off with just the condensed width. It is available in a wide range of weights (thin, light, normal, semi-bold, bold, black, and extra black).</p>
    <p>The two word logo will probably pair this font (but possibly in the regular width) with another font likely more of a thick brush stroke style.</p>
    <p>I’d like your opinions about the pros and cons of using a condensed font for a project of this nature, and really just some general feedback about condensed fonts and how they are used most effectivley.</p>
    <p>Regards,</p>
    <p> -t</p>
