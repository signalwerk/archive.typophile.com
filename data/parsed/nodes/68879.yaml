  html: |-
    <p>We are working on a cover for our book. We want to give a friendly first impression to a potentially intimidating topic. We have a great sculpture by Ann Smith as the centerpiece, but I'd like some feedback on choosing a typeface and layout. Right now we have 115% horizontally stretched Futura for the title text.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OneCoverB_3820.png"></div><p></p>
    <p>I've posted  <strong><a class="freelinking external" href="http://www.computingforbiologists.org/images/CoverMockupsMar2010.png" rel="nofollow">four design mock-ups</a></strong> to give you an idea, in addition to the preview above.</p>
    <p>Thanks for your thoughts.</p>
  html_clean: |-
