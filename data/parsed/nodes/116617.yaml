    html: |-
      <p>Edited -- second revision.<br>
      Campanile, a font patented by William W. Jackson as D11161 on April 15, 1879 and sold by MacKellar Smith's Jordan, and later by other foundries, under that name.<br>
      Dan X. Solo made a digital version, 1998, in the CD sold with the Dover book Victorian Display Fonts. Other independent digitizationas are by Aridi, as Aridi 70., and by Walden as Jugend. There is also an OPTI version which MAY be original, and a version by Deiter Steffmann which is a rip of the OPTI version. No legitimate digital that I can show as a link. As for Campanile from Aridi, <a href="http://www.aridi.com/images/fonts/70.gif" title="http://www.aridi.com/images/fonts/70.gif">http://www.aridi.com/images/fonts/70.gif</a> for a display. It's not clear to me if you can purchase it separately from a big bundle.</p>
      <p>Also worth reading the comment by Robert at <a href="http://www.myfonts.com/WhatTheFont/forum/case/76375/" title="http://www.myfonts.com/WhatTheFont/forum/case/76375/">http://www.myfonts.com/WhatTheFont/forum/case/76375/</a> reproduced here for convenience<br>
      ---start quote--<br>
      ...this typeface is Campanile originally cast by MacKellar, Smith and Jordan Type Foundry, not to be confused with Bodoni Campanile which was designed by Robert Hunter Middleton for Ludlow Typographic Company in the late 1930’s.<br>
      Campanile has been digitized by 3 people:<br>
      Mr. Dan X. Solo: 24 Victorian Display Fonts with CD-Rom available from Dover Publications.<br>
      Dieter Steffmann Fonts<br>
      Aridi (<a href="http://www.aridi.com" title="www.aridi.com">www.aridi.com</a>)<br>
      You can find a complete showing of Campanile in the following books:<br>
      VGC Alphabet Library (1973-1985)<br>
      Victorian Display Alphavets: 100 Complete Fonts<br>
      RyderTypes<br>
      You can find these books at your local library or get them through interlibrary loan.<br>
      Yours Truly,<br>
      Robert<br>
      ---end quote---<br>
      [Link to Steffmann font deleted/Don]<br>
      Don</p>
