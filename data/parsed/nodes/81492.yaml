    html: <p>Thanks for the additional suggestions.  I'm told that sans serif is more readable, especially at a distance.  It seems a good idea to err on the side of more readable, especially if one might encounter unfamiliar presentation conditions.  Still, I'm not sure how much of a difference it actually makes.  Serif might be fine if one uses reasonable font sizes (which many people don't).</p>
