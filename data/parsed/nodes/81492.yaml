    html: |-
      <p>I would actually argue that serif typefaces are easier to read.<br>
      Let us take books for an example, they are all written in a seriffed font.  The serif's give fluidity when reading, hence the reason why all books are written in it.</p>
      <p>A clean san serif typeface is usually more appropriate for headings and advertisements.  Main reason why they are used in most advertisements is for their clean look and appear more modern then serif fonts.</p>
      <p>However you did mention that this was a presentation, which I'm assuming entails the use of a projector.  If it's a bad projector, you might want to go with san-serif because some lower end projectors cannot project serif's in a clean manor, making it messy and harder to read.</p>
