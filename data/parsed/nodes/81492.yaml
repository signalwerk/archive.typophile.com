      <p>BrettR:  That's right, one sometimes does encounter poor-quality projectors, and the other problem is that you sometimes have people sitting far away.</p>
      <p>There's <a class="freelinking external" href="http://typophile.com/node/82273" rel="nofollow">a new thread</a> on this topic so I thought I would post with what I concluded.  (Not much of a "conclusion" really, just personal preferences of someone who is not a professional designer...)</p>
      <p><strong>The most attractive font</strong> I found was <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100042" rel="nofollow">Ideal Sans</a>.  Absolutely beautiful but prohibitively expensive for me:  I often need to post public PDFs of my slides and this requires an extra license that starts at $150 per style per year (!!).</p>
      <p><strong>Also quite nice:</strong> <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_yoga_sans_ot/" rel="nofollow">Yoga Sans</a>, <a class="freelinking external" href="http://www.linotype.com/183977/agilita-family.html" rel="nofollow">Agilita</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/shinn/sensibility/" rel="nofollow">Sensibility</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/exljbris/calluna-sans/" rel="nofollow">Calluna Sans</a>, <a class="freelinking external" href="http://www.vllg.com/Thirstype/Apex_Sans" rel="nofollow">Apex Sans</a>.</p>
      <p><strong>Others:</strong> <a class="freelinking external" href="http://new.myfonts.com/fonts/insigne/sancoale/" rel="nofollow">Sancoale</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/agenda/" rel="nofollow">Agenda</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100026" rel="nofollow">Whitney</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/ff-legato/" rel="nofollow">Legato</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/presencetypo/tschichold/" rel="nofollow">Tschichold</a>, <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/mundo-sans/" rel="nofollow">Mundo Sans</a>.</p>
      <p>For me personally, Sensibility or Calluna or just sticking with Gill Sans are currently the top choices.  Finally, you might take a look at this thread with many suggestions: <a class="freelinking external" href="http://typophile.com/node/13281" rel="nofollow">Looking for OpenType humanist sans</a>.</p>
