    <p>A significant part of my job involves giving lectures and presentations, and I like them to look good.  So I am in search of an attractive, readable font for presentation slides.</p>
    <p>The problem is that I'm having a hard time finding anything better than Apple's Keynote default, Gill Sans.</p>
    <p>Gill Sans is great – I think I'm looking for <em>some</em> humanist sans – but it would be nice to have something a bit more unusual, and for which /l/ and /1/ are more distinct.</p>
    <p>One problem in matching or exceeding Gill Sans's quality seems to be that it has hit some sort of a sweet spot in weight and/or kerning.  For example, the current contender is Calluna Sans. It seems GS is just a bit heavier than CS (at least CS regular; haven't tried semibold), and the effect is that the ratio of space-between-words to space-between-letters is higher in GS than in CS ... so it appears visually easier to pick out words in Gill Sans, and therefore it seems easier to read.  Or, maybe that's totally subjective.  (Or maybe I should be trying to make presentations <em>harder</em> to read ... but that's  <a class="freelinking external" href="http://www.nytimes.com/2011/04/19/health/19mind.html" rel="nofollow">another story</a>.)</p>
    <p>So I'm wondering whether anyone has suggestions on appropriate fonts, or the kerning/weight issue.</p>
    <p>Thanks for your time!</p>
    <p>– from a Typophile newbie.</p>
