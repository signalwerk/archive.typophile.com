  html: |-
    <p>I made a small TrueType style-linked family of fonts (Rg, It, Bd, BdIt) which work fine on my Mac, but when i test it on Win, Italic is displayed as a Regular (in WordPad), or Italic in unavailable (in Word). I have tripple checked the naming, and all seems to be fine. I suppose it has somehting to do with the &lt;head&gt; information, and i see how macStyle has to be set. Where is windows styling set? is there a bit i can change? <br> <br>Another problem i have with this family is inconsitant interlinear spacing. When i change the styles, the vertical lenght of the text changes, although the lineGap, ascend, and descent values are identical in all four fonts. Would anyone know what else can be a reason for such behaviour? I've spent a couple of nights trying to work it out, and i think i am at the limit on my own possibilities. Thanks for listening.</p>
