       Ambule BT <a href="https://www.myfonts.com/fonts/bitstream/ambule-bt/" title="https://www.myfonts.com/fonts/bitstream/ambule-bt/">https://www.myfonts.com/fonts/bitstream/ambule-bt/</a> which has a similar _N_ and _G_.<br>
      FF DIN Cond Black <a href="http://www.myfonts.com/fonts/fontfont/ff-din/" title="http://www.myfonts.com/fonts/fontfont/ff-din/">http://www.myfonts.com/fonts/fontfont/ff-din/</a> which has a similar _G_. Flip the _U_ for _N_. Similar Engschrift <a href="http://www.myfonts.com/fonts/urw/engschrift/" title="http://www.myfonts.com/fonts/urw/engschrift/">http://www.myfonts.com/fonts/urw/engschrift/</a><br>
      Don</p>
