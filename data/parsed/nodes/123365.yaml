    html: |-
      <div class="comment-spam-body"><p>Lithia has less contrast than Eunoia, which seems to be a better match to GUIDING LIGHT .<br>
      Note that Lithia Bold Small Caps </p><div class="imageWrap"><img src="http://typophile.com/files/LithiaBoldSCAsguiding@90_3433.jpg"></div> gives a wider result. Have to edit the _T_ and _L_, drop the center section on _G_ and flip _U_ to make _N_.<br>
      Otherwise, is it a closer match to GUIDING LIGHT than the upper case?<br>
      Don<p></p>
      </div>
