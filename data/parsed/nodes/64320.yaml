      <p>10.6.2 fixes the Type 1 problem. More info here: <a href="http://support.apple.com/kb/HT3874" title="http://support.apple.com/kb/HT3874">http://support.apple.com/kb/HT3874</a></p>
      <p>FontLab works fine (it didn't in 10.6.0).</p>
      <p>Adobe says Photoshop CS3 "works fine" on Snow Leopard: <a href="http://blogs.adobe.com/jnack/2009/08/pscs3_on_snowleopard.html" title="http://blogs.adobe.com/jnack/2009/08/pscs3_on_snowleopard.html">http://blogs.adobe.com/jnack/2009/08/pscs3_on_snowleopard.html</a></p>
