      <p>Re Snow Leopard problems with T1, see this extensive thread on Apple forums:</p>
      <p><a href="http://discussions.apple.com/thread.jspa?threadID=2154431" title="http://discussions.apple.com/thread.jspa?threadID=2154431">http://discussions.apple.com/thread.jspa?threadID=2154431</a></p>
      <p>Re font management in general, and OS manufacturers who are willing to support old software, it is difficult to beat the rock-solid combination of Windows 7 and gazillion-year-old ATM Deluxe for NT. Both work quite nicely together. You can even build your own MM instances -- which will be usable in ANY program running under Windows. Snow Leopard's inexplicable replacement of Mac-style Creator-based program opening with Windows-style extension-based program opening will also be a nightmare for anyone who has used a Mac prior to late 2009. It's difficult to understand what Apple is doing and why, as regards the OS.</p>
