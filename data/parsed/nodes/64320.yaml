      <p>I know you did not ask these things Michael, but I thought I might share some of the problems we have been having with snow leopard in our office. </p>
      <p>1. Does not support our color inkjet printer. The patch epson offers kinda works but not really. It actually has caused our HP Laserjet to start fussing as well. </p>
      <p>2. Our font management software, Suitcase, has gone haywire. </p>
      <p>3. Some of our smaller applications like Stopwatch (for timesheets) needed to be updated and fixed, which actually deleted all our timesheets.</p>
      <p>Anyways just some food for thought before you upgrade. I did some research but somehow missed that these things would cause a problem. We have had no issues with actual font files themselves.</p>
    html_clean: |-
