  - id: 30265
    user: 869
    date: 2002-12-12T02:50:00
    date_raw: 12 Dec 2002 — 2:50am
    votes: null
    html: "<p>Honest appraisal from the author: <br> <br>The introduction is self-absorbed and self-indulgent. Sorry. The cover is horrible, and I told my editor that countless times. Its ugliness is compounded by the fact that, amazingly, the repro house screwed up the alignment of some of the glyphs moments before going to print. If you buy the book, burn the dust jacket and send me a photo of the flames. Please. <br> <br>The main bulk of the book comprises of the interviews, however. There are some good chapters and some bad chapters, as you might expect from a first-time and inexperienced author, and from the range of those interviewed. Matthew Carter had some great things to say, based on a long and immensely enjoyable phone conversation with him, for example, and Jonathan Hoefler had some very valuable things indeed to share on the subject.  <br> <br>The interviews are accompanied by examples of the designers work, both straight typeface design and graphic design, and where possible there are early developmental examples to illustrate a typeface's progression. Jeremy Tankard's and Erik Spiekermann's early development work, both for typeface and typographic design, spring to mind as particularly strong examples. <br> <br>One thing that pleased me was the diversity of approaches from all the designers, mainly due to their different age ranges and cultural backgrounds, and I think this has been reflected in the book. Its non-prescriptive as a result. <br> <br>Anyhow. Its ok. I'm not Robert Bringhurst. <br> <br>One final point - the book is primarily aimed at students and designers in the early part of their careers, and the text will naturally reflect this. The tutorial bit, for example, is aimed at those VERY early on in their type design career, so dont beat me too hard on that one.  <br> <br>That said, there is plenty in the body of the book to be of interest to those further along in their hopefully lifelong studies.</p>"
    html_clean: "<p>Honest appraisal from the author: <br> <br>The introduction is self-absorbed and self-indulgent. Sorry. The cover is horrible, and I told my editor that countless times. Its ugliness is compounded by the fact that, amazingly, the repro house screwed up the alignment of some of the glyphs moments before going to print. If you buy the book, burn the dust jacket and send me a photo of the flames. Please. <br> <br>The main bulk of the book comprises of the interviews, however. There are some good chapters and some bad chapters, as you might expect from a first-time and inexperienced author, and from the range of those interviewed. Matthew Carter had some great things to say, based on a long and immensely enjoyable phone conversation with him, for example, and Jonathan Hoefler had some very valuable things indeed to share on the subject.  <br> <br>The interviews are accompanied by examples of the designers work, both straight typeface design and graphic design, and where possible there are early developmental examples to illustrate a typeface's progression. Jeremy Tankard's and Erik Spiekermann's early development work, both for typeface and typographic design, spring to mind as particularly strong examples. <br> <br>One thing that pleased me was the diversity of approaches from all the designers, mainly due to their different age ranges and cultural backgrounds, and I think this has been reflected in the book. Its non-prescriptive as a result. <br> <br>Anyhow. Its ok. I'm not Robert Bringhurst. <br> <br>One final point - the book is primarily aimed at students and designers in the early part of their careers, and the text will naturally reflect this. The tutorial bit, for example, is aimed at those VERY early on in their type design career, so dont beat me too hard on that one.  <br> <br>That said, there is plenty in the body of the book to be of interest to those further along in their hopefully lifelong studies.</p>"
