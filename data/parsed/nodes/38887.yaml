  html: |-
    <p>Hi,</p>
    <p>I am laying out a book for a client and in the templates I received, I found that a tracking of -2 (Quark) had been applied to the body text (12 on 15pt Congress Sans).</p>
    <p>Now, the client insists that this is proper, but I usually never use tracking, as this messes up the careful spacing of the original font designer.</p>
    <p>Any opinions? Should I use the tracking or better not?</p>
    <p>Thanks!</p>
