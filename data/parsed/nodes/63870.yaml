      <p>The Offenbach Klingspor Museum knows a "Zeitungs Grotesk" from Bauersche:<br>
      <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Bauer/Bauersche.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Bauer/Bauersche.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Bau...</a><br>
      Seems it was designed by Otto Weisert:<br>
      <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Weisert/OWeisert.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Weisert/OWeisert.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftgiessereien/Wei...</a></p>
      <p>The name is rather generic ("Newspaper Sans" for the non-German-speaking world) and there may have been more than one font design under that name. </p>
      <p>Perhaps this link can get you further:<br>
      <a href="http://dbs.hab.de/wbb/entrysearch.php?docID=28442&amp;PHPSESSID=5ceb9bddb3064aeec2455f44effe472b" title="http://dbs.hab.de/wbb/entrysearch.php?docID=28442&amp;PHPSESSID=5ceb9bddb3064aeec2455f44effe472b">http://dbs.hab.de/wbb/entrysearch.php?docID=28442&amp;PHPSESSID=5ceb9bddb306...</a></p>
      <p>(Depends on how close you live to Wolfenbüttel.)</p>
      <p>Andreas</p>
