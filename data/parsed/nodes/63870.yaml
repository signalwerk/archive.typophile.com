      <p>First of all:<br>
      Thanks a lot for your support.</p>
      <p>@ Florian<br>
      No, I just need it to classify this font for the font collection of lead fonts on my website: <a href="http://www.bleisetzer.de/schriftensammlung.html" title="http://www.bleisetzer.de/schriftensammlung.html">http://www.bleisetzer.de/schriftensammlung.html</a></p>
      <p>@ Andreas<br>
      Thanks for the links. The problem: They show some data, but no scan of the font. </p>
      <p>I found a "Zeitungs Grotesk" on <a href="http://www.global-type.org/" title="http://www.global-type.org/">http://www.global-type.org/</a> from Lars Kähler:</p>
      <p>[URL=http://img291.imageshack.us/i/59720192.jpg/][IMG]http://img291.imageshack.us/img291/7360/59720192.jpg[/IMG][/URL]</p>
      <p>It is very close, but my font is more bold, I guess.<br>
      Well.. we'll see...</p>
      <p>Georg<br>
      _______________________________________________<br>
      „Ich bin ein Preuße, kennt Ihr meine Farben...“</p>
