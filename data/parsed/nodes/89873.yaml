      <p>Chris, it looks like you're trying to run it directly in the terminal, maybe by pasting code? Try doing this instead:</p>
      <p>1. At the terminal prompt, type "python " including the space, but not the quotes, and don't hit return yet.<br>
      2. Drag the "stamina.py" file onto the terminal window. (This enters the path to the script.)<br>
      3. Now hit return. (Be sure Terminal is the front-most app when you do this.)</p>
