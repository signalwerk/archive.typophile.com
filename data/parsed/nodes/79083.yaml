  html: |-
    <p>I'm designing a website in which headlines will use Avant Garde. But I'm having a very hard time coming up with a companion font for body type. Whatever I try seems to clash.<br>
    Can someone recommend a websafe font that I can use in combination with AG?</p>
    <p>these are basically the options I have to work with:<br>
    <a href="http://www.codestyle.org/css/font-family/sampler-CombinedResults.shtml" title="http://www.codestyle.org/css/font-family/sampler-CombinedResults.shtml">http://www.codestyle.org/css/font-family/sampler-CombinedResults.shtml</a></p>
