      <p>Through the window of your mind<br>
      the ghost of Aldus is enshrined,<br>
      Let the Word of Aziz all be said,<br>
      I too see wisdom in his head<br>
      To catch or hatch your Windows patch,<br>
      Your IE browser can make you scratch.</p>
