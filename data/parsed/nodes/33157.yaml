    <p>Surely, I fear no Sword<br>
    And love Typophile Board<br>
    Taking my Lord's Word,<br>
    I divorced Ms Wor(l)d<br>
    To hold the record,<br>
    I ran and ran to catch<br>
    what Aldus did hatch!<br>
    the palette with no match<br>
    that watches what I patch<br>
    To Windows, what a Latch!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fatbelt_liam2_3978.gif"></div><p></p>
