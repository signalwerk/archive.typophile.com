      <p>Another interesting point I could ask now is: I'm design the letter in my favorite drawing tool (freehand). Already made some search about the best way (price/quality) in software to produce fonts. Is FontForge a good soft? I dont want to spend money in a software, like FontLab Studio or Fontographer that I will use a couple of times...</p>
      <p>Thanks for the input.</p>
