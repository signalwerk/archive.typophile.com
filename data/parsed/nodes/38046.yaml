    <p>Hi all!<br>
    I'm thinking in develop a new typeface.<br>
    After some reasearch and studies I found in an old Portuguese Pharmacie lettering (60/70's). Quiet nice and decided to do a "similar" typeface with some personal adjustments and "feelings".<br>
    But since the ideia from an lettering I dont want to waste my time in develop something that already exist (and there is a lot of typefaces outhere).<br>
    Once again I added something personal but I want to know (from your expertise) if there is something like the letters that I designed.<br>
    Its just a first studie. Any ideias/critics welcome.</p>
    <p>António</p><div class="imageWrap"><img src="http://typophile.com/files/amarantino2_5634.jpg"></div><p></p>
