    <p>On page 204 and 205 in Elements of Typographic Style Bringhurst uses script to show how adequate the kerning of a font is. </p>
    <p>“Ask Jeff” or ‘Ask Jeff’. The chef d’œuvre!<br>
    Two [of] (of) ‘of’ “of” of? of! of*.<br>
    <em>Two [of] (of) ‘of’ “of” of? of! of*</em> ...</p>
    <p>I have my own with my name, a short paragraph I made up, and words that use ligatures. Are there other "scripts" or words that should be included in my Font Tester Script. One I have "LATIN HILLY POTATO RAVINE"</p>
    <p>Knowing which fonts in your library are suitable for long passages of text is invaluable.</p>
    <p>Mike Diaz :-)</p>
    <p>I wonder what would happen if I sent a PDF of a kern testing script showing a font not performing well to the type designer?<br>
    Anger or Gratitude?</p>
