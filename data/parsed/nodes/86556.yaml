      <p>peterfwyang</p>
      <p>You have shown a picture of your paragraph options. "Single" is highlighted in blue. </p>
      <p>Select, in your document, several paragraphs of mixed text. Then go to the paragraph options and replace the "Single" with "Exactly" from the drop down list. Then type in the leading to the right of "Exactly". Try 14. How does your text look now? Increase this number or decrease it as necessary.</p>
      <p>Apply this setting to the style for your body text.</p>
    html_clean: |-
