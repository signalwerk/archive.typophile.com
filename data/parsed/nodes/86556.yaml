    html: |-
      <p>Hi all,</p>
      <p>Fron the screenshot attached it shows how the default microsoft font (PMingLiU) uses only very little space between lines, whereas the MHeiHK font is much more spaced. I have put underlining and captured the screenshot while selecting some text in this example to illustrate my point. On the right of the image (you may need to scroll), you can see the paragraph settings. </p>
      <p>It has been suggested that I set an "exact" height for MHeiHK or indeed all text - this is fine, providing that I use only one typesize i.e. 11. I create documents that fit certain criteria for visual design. I.e. Firstline headings are 50% larger than body text for example and I also use this font in conjunction with Latin fonts as the latin characters in MHeiHK and PMingLiU are horrible. Now having said that, I know that it is not the Latin fonts causing this situation, you can see from the examle of PMingLiU and MHeiHK sitting ont he same line that the MHeiHK sits slightly higher on the line, than PMingLiU and after typing the MHeiHK text the line space automatically increases but this is not actual line space from word, but caused by the font itself.</p>
      <p>This problem, does not however exist in Illustrator or InDesign, so it is something to do with how Word handles the font.</p>
      <p>Any suggestions as it is rather frustrating that I can not simply type document like I would with PMingLiU.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Screenshot of Word 2010_3589.gif"></div><p></p>
