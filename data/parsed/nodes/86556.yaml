    <p>Recently I have been using a colleague's computer to type traditional chinese using Monotype's MHeiHK-Light, -Medium, -Bold and -XBold. When opening MS Word 2010 (docx) documents written in PMingLiU (default traditional chinese font in Windows), and later highlighting all the text and changing to the MHeiHK fonts the spacing around the font is incredibly large causing a 1 page document to be reformatted to be 1.25 pages. Note that the line spacing is not changed, but the actual white space arount the font is changed - probably to do with how it has been made) </p>
    <p>Now my colleagues computer is running Windows 7, Office 2010 and using an OTF font format. Aside from manually adusting line spacing for each line of text to match PMingLiU - an incredibly tedious task to say the least involving many hours of guesswork, is there something I can do, becuase this problem is not apparent when using other foundry's donts nor in Illustrator / Indesign CS5 on Windows or any program on Mac OSX (Word 2011, AI, ID CD5.5)</p>
    <p>My Colleague and I jsut want to be able to type and everything is taken care of automatically - to create beautiful looking documents - simply. Aside from this, the final DOCX will be imported into Adobe Live Cycle Designer to create interactive forms (hence the need to use Word 2010 as PDF files imported to this program are a nightmare!!!).</p>
    <p>I would really appreciate any assistance with this one as Monotype are less than helpful.</p>
