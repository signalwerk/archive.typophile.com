    html: |-
      <p>I don't have a copy of M Hei HK Light so I can't check how it's vertical metrics are set, but it sounds like there are probably inconsistent metrics in the OS/2 and hhea tables.</p>
      <p>Assuming you're using the same version of P Ming Li U which came with my (rather old) version of Office, then its default spacing will be roughly 120% of the point size plus whatever amount of leading word adds automatically. Try setting the line spacing to 120% of your point size and see if that looks roughly like the spacing word produces for Ming Li when an exact value is not specified. If that looks right, you can use it for both fonts.</p>
      <p>André</p>
