      <p>Just an addendum to what J. Tillman writes...</p>
      <p>If you're using Word on both Macs and PCs it's probably a good idea to *always* use a fixed line height since there are differences between how line height is calculated on Macs and PCs -- differences which shouldn't really exist except that the specs for vertical metrics haven't been followed consistently by all application developers.</p>
      <p>André</p>
