      <p>Hello,</p>
      <p>As far as I know, Rotis's EULA does not allow for any modifications by the user to the fonts. If you purchased these fonts from Linotype, please contact our sales department at <a href="mailto:info@linotype.com">info@linotype.com</a>. They can give you definitive answers. Also, they could discuss with you more possibilities about commissioning a custom version with the glyphs you need.</p>
