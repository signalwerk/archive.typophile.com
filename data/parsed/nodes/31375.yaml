      <p>Lucian,</p>
      <p>Swedish is not that crazy really, just "å", "ä" and "ö" which are all part of the standard West European set. The CE is separate though. Depending on how fast you need it and what the budget is, I would consult Linotype for license part, and then get help from for example Filip Blazék to make the actual signs needed for Polish and Czech.</p>
