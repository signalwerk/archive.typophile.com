    <p>hello friends. I’d like some comments on an angular script logotype i’m working on as a personal project. I’m pretty inexperienced when it comes to drawing letters. My main concerns at this point are trying to get a nice even x-height across the lowercase letters and achieving bold, foward moving slant to the right and legibilty. </p>
    <p>Here is another go at it. Ive removed the flourishes from the W and increased the height of the middle hump. comments?</p>
