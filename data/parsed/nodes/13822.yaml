      <p>Reminiscent of two scripts discussed <a href="http://www.typophile.com/forums/messages/83/20332.html?1069226113">here</a>.<br>
      The main difficulty I have with reading it is the shape of the bowl on the y and the baseline of the W which is making the o seem high and breaks the angle of the lowercase. The two flourishes on the W and y are also fighting the direction of the lowercase, perhaps if you applied the same angle on the flourishes that might resolve it.<br>
      Tim</p>
