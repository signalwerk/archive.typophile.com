  html: |-
    <p>I'm looking to ID the types used in <a href="http://international.loc.gov/cgi-bin/ampage?collId=gcbr&amp;fileName=001//gcbr001.db&amp;recNum=6&amp;itemLink=r%3Fintldl%2Fascbrbib%3A%40field%28NUMBER%2B%40od1%28gcbr%2B001%29%29&amp;linkText=0" rel="nofollow">"The Amazon an Madeira Rivers"</a> (via the Library of Congress.) Both the title page and body text please. Images are attached as well.</p>
    <p>I was looking at Nick Shinn's Scotch Modern and it looks very close to the body.</p>
    <p>Thanks for all your help fellow typophiles.</p>
    <p>Andrew</p>
