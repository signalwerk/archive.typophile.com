  html: |-
    <p>From the <a href="http://www.typographer.org/2005_05_01_digests.html#111497422114520602" target="new">May 1st edition</a> of Bald Condensed:<br>
    <em>”(…) They all seem to suffer from the same disease that plagues Hollywood, content with releasing the Next tired remake of a classic blockbuster, or clogging the market with corny genre faces.”</em></p>
    <p><a href="http://www.linotype.com/6-2461-6/foreignlanguagepack.html?PHPSESSID=ded6594053176b2d11296d891ae20d80" target="new">This</a> epitomises everything that’s wrong with the current state of the type industry. I rest my case.</p>
    <p><em>Frankly, somebody should be held accountable and brought to justice for atrocities like this.</em></p>
