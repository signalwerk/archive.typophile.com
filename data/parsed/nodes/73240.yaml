      <p>Unless you're aiming to become a font engineer, I think you'll find that Fontographer 5 is just what a long-in-the-tooth type designer needs. Fontographer's huge advantage for me is its superbly  intuitive drawing tools.</p>
      <p>Fog enables and encourages me to think about designing rather than fighting with the TypeTool user interface that is not as elegant or FontLab's which is complicated by more bells &amp; whistles than I'll ever need.</p>
      <p>Fontographer 5 now opens and generates Fontlab quality OpenTypes, glyphs look beautifully antialiased, keyboard commands are still where they used to be in Altsys Fontographer - better because command+7 gives you a really useful 1600% view of a glyph. If you're already familiar with ye olde Fontographer, version 5 is just as delightful to use and has added Fontlab funtionality too.</p>
