      <p>Emkeyser, </p>
      <p>unfortunately, FOG is still missing an important bit, which is decompilation of feature definitions into the Adobe FDK format. FontLab Studio can do this (you can download the demo version, open an OpenType font, save the decompiled features into a text file, and proceed in Fontographer). The DTL OTMaster which is also available from our website can also do it, and does a somewhat better job since it supports the AFDKO 2.5 syntax. </p>
      <p>Best,<br>
      Adam</p>
