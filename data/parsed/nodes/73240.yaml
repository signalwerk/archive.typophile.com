    html: |-
      <p>Yes, it can.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/FOG-OT_4079.jpg"></div><p></p>
      <p>Now, please note that Fontographer can create OpenType fonts, but you cannot create OpenType features inside Fontographer (i. e., automatic glyph substitutions such as ligatures, small caps, contextual alternates and so on). According to Adam,  <a href="http://typophile.com/node/65415" title="http://typophile.com/node/65415">http://typophile.com/node/65415</a>, 17.Jun.2010 8.13am: “The main organization for the windows is largely the same as in FOG 4, i.e. a Font Window, a Glyph Window, a Metrics Window. No classes editor, no OpenType features editor, no Preview panel etc. You can specify OpenType Layout features in an external text editor using the AFDKO 2.5 syntax. We plan auto-generation of OpenType Layout features for common European scripts in a later version, but there won't be a "visual" feature editor -- this is something for FontLab Studio. I mean, you can use Microsoft VOLT or the demo version of FontLab Studio, or one of the DTL applications or FontForge etc. to develop the features if you want. Or a text editor. Or something else”.</p>
    html_clean: |-
