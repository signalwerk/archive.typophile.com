    html: |-
      <p>FontLab is geared  toward the professional — there's not much it won't do. It has a steep learning curve, and it is more expensive than Fontographer. Leslie Cabarga's book, "Learn FontLab Fast!" is highly recommended.</p>
      <p>I prefer Fontographer. The interface is much, much easier, and it's generally a joy to use. All of the shortcomings of the current version will be addressed in a later update, as promised by the developer.</p>
      <p>I'd get both, as I prefer doing most of the work in Fontographer, and fine-tuning and finishing up in FontLab.</p>
      <p>If you can only get one, and a full battery of OT tools is a deal breaker, FontLab is probably the better choice.</p>
