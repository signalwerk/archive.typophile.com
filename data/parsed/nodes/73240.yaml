    <p>I'm looking to get back into type design after being away from it for quite a while.</p>
    <p>I'm a bit long in the tooth, (<em>I'm one of the people who can actually remember the last glorious days of hot metal</em>) and when I last had anything to do with font creation on a Macintosh, Fontographer was the industry standard program.</p>
    <p>I've just checked the comparison charts between this and FontLab Studio on their website, (<em>which didn't really give me the information that I wanted</em>) and I'm now not sure whether I need to spend the extra money.</p>
    <p>Essentially, I'd like to be able to create OpenType typefaces, (<em>possibly sometimes using an OpenType face as a starting point for the creation of the font</em>). The programs look broadly similar to each other in terms of what they can and will do, and I'm not really sure what the pros and cons are of the two programs when compared to each other.</p>
    <p>Can anyone help please? Thanks!</p>
