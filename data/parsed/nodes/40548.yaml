    <p>Hey Guys,</p>
    <p>Looking for a new font with the following specs to use for a Cleint logotype:</p>
    <p>The specs are as follows:</p>
    <p>a) Must be a lowercase sans-serif font<br>
    b) contemporary<br>
    c) similar in look to Frutiger font<br>
    d) some distinctive element (maybe in the ascenders/descenders etc)</p>
    <p>Any help??</p>
    <p>I guess as a designer i have exhausted my ability to look at fonts as for the past 4 days i have been going through FontFont,Emigre,Adobe and Linotype sets....so i a bit saturated..<br>
    I was thinking dax or interstate but have overused those altogether so quite keen on something new!</p>
    <p>seeming you all are so good with your opinions and feedback was hoping maybe some of you could make suggestions to fonts for this purpose</p>
    <p>Links to samples and sites for purchase also appreciarted!!</p>
    <p>thanks</p>
    <p>Robby</p>
