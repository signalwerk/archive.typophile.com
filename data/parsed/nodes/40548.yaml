      <p>Have a look for example at <a href="http://www.fountain.nu/catalogue/stalemate.asp" rel="nofollow">FTN Stalemate</a> by Stefan Hattenbach. Or <a href="http://www.veer.com/products/typedetail.aspx?image=FOT0000081#specimen" rel="nofollow">Lisboa</a> by Ricardo Santos. Great italic characters, love’em.  </p>
      <p>EDIT: Don't forget <a href="http://www.identifont.com/show?4Y2" rel="nofollow">Nubian</a> by Nick Cooke. Also his <a href="http://www.identifont.com/show?4Y1" rel="nofollow">Houschka-Family</a> is worth a look … Oh, and, yes, <a href="http://www.ourtype.be/" rel="nofollow">Sansa</a> by Fred Smeijers is great, too.</p>
