  html: |-
    <p>Qualified candidates should be hard working, have a flair for all things retro, be willing to learn, have a taste for designing in the retro aesthetic, and a strong desire to pursue the craft of display font making.</p>
    <p>The work ain't steady right now, but if you prove yourself, more will come . . .</p>
    <p>Looking for some fresh young talent or older talent that's willing to work cheap, not to say we won't pay fairly, just to say the level of help we're looking for is somewhere between intern and newbie level designer so the pay is appropriate to the position, plus you can put on your resume that you work with us . . .</p>
    <p>Interested parties should e-mail us the following:</p>
    <p>1) A sample or samples of your retro inspired design chops, scans of brochures, website links, you name it . . .</p>
    <p>2) The name of your top three display fonts</p>
    <p>3) A simple statement why you want this gig</p>
    <p>E-mail us at: diner (at) fontdiner.com</p>
    <p>Sincerely,<br>
    The Management</p>
