      <p>SciTech,<br>
      Economy of fit and comfort of reading interplay to define what is chosen to use.  Also, there are individual differences in peoples preferences. How something is to be used is always the big player and why, when coding, a monospace font is a better choice than a fine book font.  Given your particular circumstances, I think you have chosen quite well. Keep in mind (as you have)  your purpose and audience as well as your means to acquire, and you will continue to make the right decision for your own work.  Book publishers and advertising agencies have different needs than you as well as each-other. You may pick a modest putter over a driver for a 10 inch tap no-matter how fantastic or expensive that driver may be.</p>
