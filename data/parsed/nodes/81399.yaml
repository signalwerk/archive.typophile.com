    html: |-
      <p>If I'm gonna write literally in a word document, with the idea someone else will open it file in their own copy of word, there's no point in selecting a font outside the handful that are on almost every pc. So, Georgia.</p>
      <p>I dunno, sometimes I feel like I have no appreciation for serif faces, I'm clueless about 'em. I go sans-serif as much as possible. If I had to print in one I'd probably pick rockwell.</p>
