    votes: null
    html: <p>When writing on screen, I go with Cambria or Georgia for serif and often Helvetica or Calibri for sans. If I'm printing it, well, that's a whole other story. These typefaces are pretty safe choices for sharing docs, which is my second consideration when composing for Word. I usually write in TextEdit, then just send as RTF. Word can handle TextEdit output just fine.</p>
