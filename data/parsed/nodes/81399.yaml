      <p>@BrettR:</p>
      <p>One of the things I've learned about typography is that there are many fonts for many contexts. And the first step toward good font selection is the ability to categorize both contexts and fonts. </p>
      <p>If I were looking for an answer to this sort of question, I would limit the inquiry to a specific class of fonts (e.g., contemporary humanist sans or something that narrows the thousands of possibilities). Or maybe you could start with the context, like "What's your favorite font for menus at Mexican restaurants."</p>
      <p>I think for most designers, a font is just not that interesting without knowing the context or classification.</p>
      <p>A good way to see what people are the sales charts at myfonts.com. Right now, the hottest new font on myfonts is probably "Gibson". It just came out and it costs $48 for the complete 8-weight family. All its weights look usable (which is not always the case).</p>
