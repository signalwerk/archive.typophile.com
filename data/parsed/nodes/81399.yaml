    <p>Well, I was searching through old posts within the forum, and to my amazement, I could not find a "Favourite Font" topic anywhere.<br>
    Now this could be in part with my inability to search effectively, but regardless we shall continue forward.</p>
    <p>I realize that plenty of you who call this forum your home, are designers and typographers, and have see your fair share of typefaces through the years.  And through the years, there is a very good change that you have grown a liking towards certain fonts.</p>
    <p>So what is your current <em>favourite</em> serif font/s for using when writing a paper/novel/report/etc?</p>
