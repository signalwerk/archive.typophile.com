    date_raw: 23 Apr 2011 — 8:00am
    date: 2011-04-23T08:00:00
    votes: null
    html: <p>When I write, if it is anything more than a few pages, I can't stand Word, so I just write in InDesign. Adobe has InCopy to go with InDesign for writers. But I'm supposing this is only for in house journalists, etc. I'm wondering why it doesn't compete directly with Word. Does anyone have experience with this?</p>
  - id: 461626
    user_id: 3135
    user_name: dezcom
    user_path: null
    user_image: /files/pictures/picture-3135.gif
    date_raw: 23 Apr 2011 — 9:35am
    date: 2011-04-23T09:35:00
    votes: null
    html: <p>InCopy is a workflow piece that is part of a larger publishing system.  When there are designers, writers, editors, photographer, in a workflow, they each have different needs,  The writers and editors have read/write ability to text but not formatting.  Designers perhaps the other way round.  This way, a document can be worked upon simultaneously by many people without the danger of unwanted overwrites.</p>
  - id: 461634
    user_id: 83892
    user_name: SciTechEngMath
    user_path: null
    user_image: null
    date_raw: 23 Apr 2011 — 10:47am
    date: 2011-04-23T10:47:00
    votes: null
    html: |-
      <p>I'll preface this by saying that I'm by no means a competent typographer -- just a grad student/scientist with a keen interest in the type I look at not looking like crap...and boy a lot of it does!</p>
      <p>I'm befuddled by the people who are advocating monospaced faces for writing. I use monospaced faces for editing code, as spacing can be very important in some languages (Python, matrices in MATLAB), and you can use appropriate spacing to make the code easier to read and understand (I often make all the entries in vectors that have a one-to-one correspondence line up, for example). When writing documents with lots of text, however, I like to look at something proportionally spaced as I find it is much easier to read the text when revising my document. For example, I use Verdana in the text editor I use with LaTeX as a compromise -- while other faces may look prettier on the screen when editing, Verdana is at least fairly decent, and has very good distinction within Il|1 and O0o.</p>
      <p>For general-purpose documents (progress reports, research summaries, homework assignments, etc.) I generally set the document in Minion, mostly because it is the only font (other than Computer Modern) for which I have gotten reasonably full support for equations working in LaTeX, but also because I think it looks nice without being over-the-top. (And in some ways its math support [using MinionPro.sty] is actually better because it supports upright and/or bold lowercase greek letters, which Computer Modern does not -- then I can adhere to ISO recommendations regarding π being upright when used as a physical constant, and my own preferred convention of unit vectors such as <strong>ϕ</strong>-hat, <strong>θ</strong>-hat and <strong>ζ</strong>-hat being upright bold and ordinary vectors such as <strong><em>ω</em></strong> being bold italic...but that was probably more detail than you wanted in this thread!)</p>
  - id: 461636
    user_id: 1551
    user_name: William Berkson
    user_path: null
    user_image: /files/pictures/picture-1551.gif
    date_raw: 23 Apr 2011 — 11:12am
    date: 2011-04-23T11:12:00
    votes: null
    html: |-
      <p>&gt;I'm befuddled by the people who are advocating monospaced faces for writing. I use monospaced faces for editing code</p>
      <p>I think your view is shared by most people. Monospaced fonts are used for coding or occasionally for their aesthetic effect, in display. Courier is also required for screen plays, and a few other places. </p>
      <p>But in general most people feel that proportional spacing is more readable, and I think they're right. </p>
      <p>Minion is a great workhorse font, and I admire its great craftsmanship. But for me personally, I think it is a little too compressed for maximum reading comfort, and also the punctuation is kerned too tightly. </p>
      <p>I recently went through the exercise of setting a few pages of the same text in Minion, and then in Williams Caslon. Though Williams Caslon is a bit wider and more loosely set, used slightly smaller, it ended up with the same material in the same space, but being, to my eyes, a bit more comfortable to read. Of course, I am prejudiced as the designer of Williams Caslon, but there is a more general point here, which is that using a very compact face, such as Times New Roman or Minion is not necessary the best way to fit a lot of words on a page.</p>
