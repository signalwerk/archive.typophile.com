      <p>I'd say word processors are tools of confusion. I wonder how much money I've made removing super-hyper-nested styles, attempts at manual style overrides, ridiculous attempts at prettying the document, general clutter, tabs, excessive space usage, faux tables etcetera ad nauseam. </p>
