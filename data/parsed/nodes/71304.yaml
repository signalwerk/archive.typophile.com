  html: |-
    <p>I really like Phaeton!</p>
    <p>It looks a bit steam punkish -- evoking associations with Victorian metalworks, pre-Jugendstil; kind of a prelude to Arnold Boecklin. It would look <em>great</em> on screen in a steam punk game such as "The Chaos Engine"!</p>
    <p>(It's a pity the entire Steam Punk genre had only a fleeting moment of success. William Gibson/Bruce Sterling's co-op "The Difference Engine" is still a good read.)</p>
