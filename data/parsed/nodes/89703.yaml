    html: |-
      <p>I got mine for around $125, I think, about a decade ago. It's in good condition. I could see a fine copy going for maybe $200. But unless it’s very fine, pristine actually, I don’t know if you’ll get $350. </p>
      <p>And I don’t see the biggest market for this being serious book collectors, so condition is less of a value. As long as the pages are clear, most type hounds will be happy to save a couple hundred and get a fair or good copy and don’t need pristine.</p>
      <p>Still, can’t hurt to start as an asking price, I suppose. Good luck.</p>
