  html: <p>There is a font I've seen that is all-capped and sans-serif, with sometimes one "leg" slanted. This is usually on the M's, A's, and V's. It has a very disco feel to it and I believe it has been used on quite a few records in the 70's. I'll look for an image example, but in the meantime does this sound familiar to anyone?</p>
