      <p>It worked better when you were mixing Avant Garde and Myriad. Not mixing sans faces is usually a good policy because the similarities between sans faces can create a sort of dissonance in which the viewer can’t figure out why the words don’t seem to work together. But in a case like this, where there is strong contrast in size, form, and the contrast of case, there is no dissonance. In Myriad, the tagline, also feels much more subservient to the rest of the logo, whereas in Avant Garde the all caps seem to be screaming for attention. </p>
      <p>I think that you did a very good job with the logo mark—it can stand on its own in places where the wordmark is inappropriate. I would keep it on the right to really anchor things.</p>
