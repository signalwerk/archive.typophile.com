      <p>Needs contrast (even your bold is medium at best) and something other that avant garde. The ste combo is just bad IMO. In otherwords, set this one aside and start again. You can always come back to it.</p>
      <p>Suggestions:<br>
      I’d move to something bolder (a black), headline version of the contrasty sans used in the original, with more contemporary flavor. Such as a Quadraat Sans Black (if such an animal existed). Or a punchy headline sans like Knockout Ultimate Welterweight. Whitney Condensed Black.  And then possibly try Online in a light, maybe monoline script. Like a more flowing version of Handsome Pro Light.</p>
      <p>Maybe the script idea won’t work. But shoot for contrast that says “bang”</p>
      <p>Whatever you do, it should have some personality. This feels like you opened up a font, typed the letters and picked your colors.</p>
