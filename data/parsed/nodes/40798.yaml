      <p>It’s a general rule to not mix sans serif typefaces in copy- the same goes for logos with taglines. I suggest making the tagline a serifed typeface for contrast’s sake. Your kerning is off throughout the logo itself- the S is pulling away, and the space between the N and the B is off. The shape of the B is weird, as well. The mark you’ve thrown in there is too low-contrast (and looks like a low-rent version of the Fila logo).<br>
      If I were you, I’d kill the mark, then vary the weight between “Steinbach” and “Online”. Make Steinbach heavier, as that’s what’s important.</p>
    html_clean: |-
