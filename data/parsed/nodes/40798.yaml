      <p>Focus on taking stuff out. The logo should just read “Steinbach“ or “Steinbach Online“ and not “Steinbach Online.com.“ Get that tagline out of the logo, too. All of the extra crap in the current logo makes it look like the company behind the logo is run by people who were too stupid to let the people paid to design the logo actually design the logo.</p>
      <p>As for typefaces, first you need to figure out what kind of feel you want this logo to have. Sit down with a thesaurus and start creating long lists of words and synonyms until you just can’t do it anymore, then put the whole project away for a day and then refine the list. Once you know what you want to evoke, sit down and start looking at fonts to find some that echo your sentiments. Test the word or words that will go into the logo in every font that fits. Pick the ones that work and look over them again. Keep refining. Then it’s time to start tweaking letters and such.</p>
    html_clean: |-
