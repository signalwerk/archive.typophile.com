  html: |-
    <p>I have a font that has grown over time. I need to sort it by Unicode for ease in use with InDesign. The problem is all those glyphs (186 of them) that don't have Unicode indexes, just names -- all the number variants, small caps, etc. Is there some way I can get FontLab to let me organize them, so that A.smcp - Z.smcp are found sequentially, etc.?</p>
    <p>TIA</p>
