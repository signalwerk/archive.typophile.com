      <p>An old thread, revived. As long as it did, I'll report that</p>
      <p><cite>First sort by name, then sort by Unicodes</cite></p>
      <p>doesn't work for me. I like all my tabular figures together, all my proportional figures together, all my basic small caps together, with the accented ones in a group by themselves, etc.</p>
      <p>The control I wanted was over the "unencoded" glphs -- those without a Unicode number. I guess Chris's approach would work, and Paul's might work. What I finally wound up doing was to paste all the unencoded glyphs into a new font window, then paste them back in the order I wanted. Not as good as Chris's method, because when I add enough more glyphs to get lost, I'll have to do it all over again.</p>
