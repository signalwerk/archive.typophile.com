      <p>sort by name<br>
      switch to Unicode mode<br>
      sort by codepage<br>
      switch to Index mode<br>
      select all unencoded characters and drag to the end of the block<br>
      tweak sorting as necesary<br>
      save codepage for future sorting</p>
      <p>...just a suggestion</p>
