    html: |-
      <p>I have a suggestion for you.</p>
      <p>1. Open your font</p>
      <p>2. Save an encoding based on the glyphs you have made. Just like that. By doing this you get the names of all the glyphs in a text document.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/saveeenc_5887.png"></div><p></p>
      <p>3. Open that enc-file in a text editor, and sort the glyph names the way you want them. You can take away the numbers before the names, no problem. </p>
      <p>In the top of the enc-text document, you can name the encoding as you wish.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/encod_4303.png"></div><p></p>
      <p>Then choose this encoding in FontLab and sort the glyphs by that (sort by encoding). You can now have this encoding file as a base and then further on add more glyphs, or make changes in the order you want the glyphs to appear. Make all these changes in a text editor and then re-select it in FontLab for it to update.</p>
