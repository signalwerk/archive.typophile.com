      <p>Artur:</p>
      <p>Works fine as long as you are a font designer only. Might consider shipping your fonts with instructions to graphic designers not to use them when they need characters you haven't included -- like small cap D,H,S,T,Z with dots below.</p>
      <p>As someone who uses type, I have found that there is no telling when a (graphic) designer will pick a font to set a text with transliterated Arabic, "Sanskrit", etc. If you think this a rare occurrence, just look a the current political scene . . .</p>
      <p>So, I have to do make up characters the (font) designer left out. Worse, I have to do it on an as-need basis; as they come up. No pre-planning. About the only thing I can tell the (graphic) designer is such &amp; such a designer/foundry absolutely prohibits modifying the font, so they'll have to use something else. But sure as shooting, the something else won't support these characters and glyphs either. I'll have to add them, and eventually get to a point it becomes hard to see just what is there.</p>
