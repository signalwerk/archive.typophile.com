    html: |-
      <p>I use the same method as John describes here:</p>
      <p>1 — Create a custom .enc file in which you define the order of the glyphs the way you would like to see them in your fontwindow.<br>
      2 — In the fontwindow's Names mode you select your custom encoding<br>
      3 — Then: Tools &gt; Sort Glyphs &gt; By Encoding<br>
      4 — Switch the fontwindow to Index mode to check if the index order now equals your encoding order.</p>
      <p>Best,<br>
      Artur</p>
    html_clean: |-
