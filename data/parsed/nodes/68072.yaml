    html: |-
      <p>I think, the problem can be solved by switching to the index mode in FontLab, saving the encoding in the directory, in which the encoding files are stored, and – the font that has a different glyph order opened – selecting the saved encoding in names mode. (You have to start FontLab again, after saving the encoding file.)</p>
      <p>Alternatively you probably can decompile the font with TTX and replace the Glyph-Order-Table by one, that is your standard. But this requires, that only the order of the glyphs is different in your fonts, but not their names and not the number of characters. (Or the table, in which the Unicode points are defined. I think, they are not defined in the Glyph-Order-Table.)</p>
      <p>Once again, I am amateur. Corrections are welcome, if I am mistaken.</p>
      <p>Edited:</p>
      <p>The first alternative likewise requires same names in both fonts. And the font with the lowest number of glyphs should be used as reference. So I propose alternative 3:</p>
      <p>You create your own FontLab name table in the directory "Mapping" and you define there PUA Unicode points for the characters, that have not standardized Unicode points.</p>
