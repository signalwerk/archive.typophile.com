  html: |-
    <p>Hello.<br>
    I have some english fonts with sanskrit diacritics(TT and OT), created with different font mappings, which means that certain symbols used by one font appear as something different when the font is changed. I'm wondering is there a program that actually synchronize font mappings, or converts one font to match with the other one? </p>
    <p>Thanks :-)</p>
