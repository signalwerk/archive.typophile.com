      <p>1. Yes<br>
      2. Unit Slab, with ample leading, expanded 10% horizontally. There is a prejudice against horizontal scaling, but the effect varies from type to type, and IMO a face such as Unit Slab is not adversely affected by it; let your eyes be the judge.</p>
