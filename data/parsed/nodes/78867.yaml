    <p>I was thinking of pairing <a href="http://Gotham Narrow" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Gotham Narrow</a> and <a href="http://klim.co.nz/unitslab_info.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Unit Slab</a>together for a magazine. Stylish but serious. I may also use them in print for a book that accompanies the magazine's branding. </p>
    <p>Two questions:</p>
    <p>1) Are these a good match?</p>
    <p>2) If you had to pick a simple typeface (serif) for the book's body text, what would you choose?</p>
    <p>Thanks!</p>
