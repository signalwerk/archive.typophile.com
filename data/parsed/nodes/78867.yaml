      <p>I don't see why not, but why not work with it on a page and see for yourself?<br>
      After all, if you are already using it in the magazine, wouldn't you want to see if such a magazine choice could also be made to work in the accompanying book? Isn't that the challenge, to find a typeface that has such brand consistency across two (or more) genres, and presumably different paper stock, and yet still excels in each?</p>
