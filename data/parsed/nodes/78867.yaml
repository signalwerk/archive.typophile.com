  html: |-
    <p>I was thinking of pairing <a class="freelinking external" href="http://www.typography.com/fonts/font_inside.php?wipID=19&amp;productLineID=100008" rel="nofollow">Gotham Narrow</a> and <a class="freelinking external" href="http://klim.co.nz/unitslab_info.php" rel="nofollow">Unit Slab</a>together for a magazine. Stylish but serious. I may also use them in print for a book that accompanies the magazine's branding. </p>
    <p>Two questions:</p>
    <p>1) Are these a good match?</p>
    <p>2) If you had to pick a simple typeface (serif) for the book's body text, what would you choose?</p>
    <p>Thanks!</p>
  html_clean: |-
    <p>I was thinking of pairing <a class="freelinking external link-external" href="http://www.typography.com/fonts/font_inside.php?wipID=19&amp;productLineID=100008" rel="nofollow">Gotham Narrow</a> and <a class="freelinking external link-external" href="http://klim.co.nz/unitslab_info.php" rel="nofollow">Unit Slab</a>together for a magazine. Stylish but serious. I may also use them in print for a book that accompanies the magazine's branding. </p>
    <p>Two questions:</p>
    <p>1) Are these a good match?</p>
    <p>2) If you had to pick a simple typeface (serif) for the book's body text, what would you choose?</p>
    <p>Thanks!</p>
