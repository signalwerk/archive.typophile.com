    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FONTRY sinder_540_001_4805.jpg"></div><p></p>
    <p><em>From the designer:</em><br>
    Sinder began life as a custom block font that was begging to be distressed. Of course it was only an experiment, not to be taken seriously, until a customer needed a face of just about these proportions to give his "paranormal investigation" hobby an appropriately scary image. It was out of necessity, then, that I finished the entire font. It never pays to be caught off-guard at a critical point in a layout.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/FONTRY sinder_all_alpha_530_3775.jpg"></div><p></p>
