  html: |-
    <p>After the excitement of hosting Typecon in Seattle this past August, several local people expressed an interest in having a regular gathering for “type geeks” in Seattle. We had our first gathering last month and there was lots of enthusiasm to continue.</p>
    <p>We’re going to meet at the Pub at 3rd Place books in Ravenna on Tuesday November 6th at 7:30pm. The pub is underneath the bookstore at the corner of 65th Street and 20th Avenue NE. <a href="http://www.3rdplacepub.com/" title="http://www.3rdplacepub.com/">http://www.3rdplacepub.com/</a></p>
    <p>No meeting or agenda, just stop by and have a drink. </p>
    <p>Michelle</p>
