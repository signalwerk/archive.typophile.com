    <p>From 10 September until 2 October 2011, <em>Expert class Type design</em> (EcTd) 2010–2011 students of the <em>Plantin Institute for Typography</em> will show their work at the famous Museum Plantin-Moretus in Antwerp.<br><img src="/sites/default/files/old-images/MP-M_1_5351.jpg"></p>
    <p>The applied illustrations here are coming from (in order of appearance):  Wikipedia (user: Manfreeed [no typo]), FEB, Ann Bessemans (2x), Stijn Cremers, and Henrik Kubel.<br><img src="/sites/default/files/old-images/Affiche_5149.jpg"></p>
    <p>The EcTd course also takes place at the Museum Plantin-Moretus. It spans ten teaching days spread over roughly eight months. In between the lessons the students have to work at home on their projects. As one can read at the <a href="http://www.plantingenootschap.be/?page_id=3102&amp;lang=en: ">website of the Plantin Society</a>:<br>
    ‘<em>The Expert class Type Design given by the Plantin Institute of Typography examines the “secrets” of con­tem­po­rary repre­sen­ta­ti­ons of the Latin script (capi­tal, roman and cur­sive) in detail. The under­ly­ing har­mo­nic, pro­por­ti­o­nal and rhyth­mic struc­tu­res of cha­rac­ters and the typo­gra­phi­cal con­ven­ti­ons and rules deri­ved from them are ana­ly­zed and dis­sec­ted.</em>’<br><img src="/sites/default/files/old-images/Bessemans_2_4963.jpg"></p>
    <p>The type designs may be shaped in Antwerp, not all students come from Belgium though (although the majority does). Some students come from the Netherlands, and there was one Danish, and one English student this year. Their backgrounds differ from bachelor to master educations in the graphic ﬁeld. Some of the students were experienced in type design already and used the course to reﬁne their skills and to enhance their insight. Another one used the course to make a thorough start with a typeface, which is part of a PhD research at Leiden University. Some of the students are lecturing themselves at graphic courses. Above all, all students share a deeply rooted passion for type.<br><img src="/sites/default/files/old-images/Bessemans_1_3939.jpg"></p>
    <p>At the end eight students decided to take part in forenamed exhibition (participating is quite demanding). Of course, it is a unique opportunity to exhibit one’s work at the Museum Plantin-Moretus. Normally one has to be <em>stone dead for ages</em> to be allowed to present work at this sacred place for typography. So, the students work will be shown in the same building as where one can ﬁnd the ﬁnest work of <em>Gutenberg</em>, <em>Griffo</em> and <em>Garamont</em>.<br><img src="/sites/default/files/old-images/Cremers_1_6011.jpg"></p>
    <p>I will not state here that the Belgian students’ work is the ﬁrst milestone in Belgian type design since the contributions by <em>Van den Keere</em> and <em>Rosart</em>, but it is at least a signiﬁcant one. I include here the <a href="http://www.typefaces.nl/Temporary/Downloads/PG2011/Uitnodiging_PG_EcTd_2011.pdf">link to the invitation</a> (PDF).<br><img src="/sites/default/files/old-images/Kubel_1_6084.jpg"></p>
    <p>And for those who are interested, the EcTd course for 2011–2012 starts on 16 November 2011.</p>
    <p>FEB</p>
