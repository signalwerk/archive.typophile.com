    html: "<p>As mentioned, participating in the exhibition <em>De magie van het letterontwerpen | Van schets tot digitale letter (The magic of type design | From sketch to digital type)</em> is quite demanding and not every graduating student is taking part. The students who exhibit are (in alphabetical order):<br>

      &nbsp;<br>

      &nbsp;Ann Bessemans<br>

      &nbsp;Stijn Cremers<br>

      &nbsp;Henrik Kubel<br>

      &nbsp;Peter Van Lancker<br>

      &nbsp;Jan Neyens<br>

      &nbsp;Mario Schellingerhout<br>

      &nbsp;Anne Verlent<br>

      &nbsp;Jeroen Visser<br>

      &nbsp;<br><img src=\"/sites/default/files/old-images/EcTd_students_1_3477.jpg\"><br>

      During the course the students investigated the nature and origin of typographic conventions. Partly they did this empirically in the best tradition of Edward Johnston and Gerrit Noordzij, i.e. with pen and ink, as one can see on the photo above. Furthermore they explored to which extent writing was responsible for the shaping of movable type and which other factors played a role.<br>

      &nbsp;<br>

      There is no discussion possible about the fact that written letters were initially standardized and eventually formalized by the Renaissance invention of movable type.<br>

      For instance Edward Johnston wrote on this subject: ‘<em>The ﬁrst printers’ types were naturally and inevitably the more formalized, or materialized, letter of the writer</em>’ (Edward Johnston [Heather Child ed.], <em>Formal Penmanship and other papers</em> [London, 1971] p.43).<br>

      That being said, it is the question to which extent the effects of writing should<br>

      be (re-)applied or preserved by present-day type designers in a profession that was shaped not by calligraphers, but by craftsmen. For instance Nicolas Jenson was an engraver from origin and Francesco Griffo was a goldsmith, as were Claude Garamont and Christoffel van Dijck. Type was developed mostly independently from writing since the ﬁrst formalization of letterforms, and the ideas about the sense of re-using writing as a basis for contemporary type design clearly differ.<br>

      &nbsp;<br>

      In a reaction on an article on type classiﬁcation by Gerrit Noordzij in <em>The Journal of Typographic Research</em> (Summer 1970), Walter Tracy states: ‘<em>The fact that the prehistory of type design is to be found in handwriting is interesting but of little value in the practical affairs of typography and printing today</em>’ (Walter Tracy, ‘Type Design Classiﬁcation’, <em>Visible Language</em>, Volume V, Number 1, [1971] pp.59–66 [p.59]).<br>

      So, I discussed with the students the different theories and opinions on this subject, including my <em>model-doctrine</em> (see the illustration below).<br>

      &nbsp;<br><img src=\"/sites/default/files/old-images/Model-doctrine_4895.jpg\"><br>

      In my opinion basically the grapheme systems in use are quite arbitrary. As soon as a grapheme system is set up, the further development (evolution) and consequently the related conditioning is deﬁned by the applied structures themselves, and what is considered to be optically correct is only purely relative to (the conventions of) the models (it is unlikely that Jenson and Griffo did any legibility research before they developed their archetypes).<br>

      Conditioning is based on conventions and conditioning preserves conventions or even enhances them. Thus the snake bites its own tail; to be able to use one’s ‘eye’ like for instance Fournier advocated in his <em>Manuel typographique</em> (1764–1766), one has to be educated to look at type in the same way.<br>

      &nbsp;<br><em>Come and see the students’ work in Antwerp!</em><br>

      &nbsp;<br>

      FEB</p>"
