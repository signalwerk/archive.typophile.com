      <p>@Henry:</p>
      <p>as I said before, I know how to get the en-dash in InDesign. And for sure I would never use the mouse for that. There is not enough time in my life to do something with the mouse that could be done with the keyboard. My problem was to produce an en-dash within Illustrator, there the keyboard shortcut from InDesign didn’t work. In the meantime I tried to look it up and didn’t find any predefined shortcut for dashes in Illustrator. But one could use the standard keyboard shortcuts:<br>
      <code><br>
        en-dash -- ALT+0150 (PC) -- Option+Hyphen (Mac)<br>
        em-dash -- ALT+0151 (PC) -- Option+Shift+Hyphen (Mac)<br>
      </code><br>
      Using the middot is a good idea!</p>
      <p>Robert</p>
