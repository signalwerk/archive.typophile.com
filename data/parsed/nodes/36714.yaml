      <p>Last week we got the stationary from my printer. Initially I had planned to use a cotton paper similar to Strathmore, the logo printed with a steel engraving. For reasons of economy, this had to be reduced to a cheaper paper with an embossed logo. To give the very clear and rather cool look of the stationary a bit more softness, I rounded the corners of the paper and printed some gradient shades into the corners. The wine labels will be printed next spring, the work on the website is in progress. I put some pictures onto our website: <a class="freelinking-external" href="http://www.aperion.de/portfolio.php?pid=25">http://www.aperion.de/portfolio.php?pid=25</a>.</p>
