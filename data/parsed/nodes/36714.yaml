      <p>First, you can get an en-dash in InDesign using the context menu: right-click, insert special character, en-dash (the details vary depending on your InDesign version).</p>
      <p>Second, what I was trying to say about the tag line tracking is that you can’t pre-determine both the font size and the width of a line ever, because they are interdependent to each other.</p>
      <p>Third, I *am* sure that the slash is “totally wrong” — in German as well as in English (not that English matters in this case). People who can’t read German may not know what “a. d.” means, but absolutely nobody is going to mistake it for “anno domini”, as that can only follow a number.</p>
      <p>I do understand your discomfort with the optics of the comma or slash, which will be non-existent if you decide to go lowercase with the tag line. But if you must use all-caps and don’t want to use “a. d.” (which I frankly don’t understand), the most acceptable alternative would be the middle dot, i. e.:</p>
      <p><cite>Rieslinge aus Steillagen</cite><br>
      <cite>Winningen (middot) Mosel</cite></p>
      <p>Or:</p>
      <p><cite>Rieslinge aus Steillagen (middot) Winningen (middot) Mosel</cite></p>
      <p>Do not use both en-dash *and* middle dot because that’d be confusing and look funny.</p>
