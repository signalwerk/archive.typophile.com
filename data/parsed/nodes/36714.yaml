      <p>First, I agree with everyone that the overall design is really well done. That said, I do have some points of critique:</p>
      <p>1. The kerning (individual letter spacing) needs a lot of fine-tuning. For instance, in “WEINGUT”, “GU” are too far and “UT” are too close. I supposed you’ve relied on automatically metric kerning, which isn’t good enough for logos.</p>
      <p>2. The tracking (general letter spacing) of the tag line (“RIESLING [...]”) is too wide. You’ve pre-defined the width of the whole line *and* the font size, which is always a bad idea, because it makes the tracking arbitrary. Also I think the line could work better in normal case (as opposed to all-caps).</p>
      <p>3. A hyphen is used in the tag line though it should be an en-dash (“Halbgeviertstrich” in German). The slash is totally wrong and should be replaced by a comma — or much better, “Winningen a. d. Mosel”.</p>
      <p>Given 2 and 3, I’d consider splitting the tag line in two lines, i. e.:</p>
      <p><cite>Rieslinge aus Steillagen</cite><br>
      <cite>Winngen a. d. Mosel</cite></p>
