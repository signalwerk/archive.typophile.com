      <p>Thanks to all three of you for the kind words!</p>
      <p>@Seb: Yes, should have seen the kerning problem—-guess I didn’t take care because I considered the Sans to be a placeholder.</p>
      <p>@Dan: <em>QUOTE: [...] it might blend in to the crowd of other wine bottles out there.</em> Almost all of their wine is sold directly to oenophiles and restaurants, so the wine label doesn’t have to campaign against other labels in a shelf battle. On the other hand I can imagine the label—-bright and low in contrast—-to be optically competitive against a crowd of colorful labels demanding for attention on the shelf of the liqour store. I would love to see the label with a strict typographic layout, maybe the lower part of the label completely covered with justified text, set in very light gray, important wine data popping out with a contrasting color (the blue of the label). So the blue color could be used for the wineries main grape variety, the Riesling, and alternative colors (similarly bright and desaturated) for other grape varieties. Regrettably, this concept is hardly ever feasible. Due to the absurd typgraphic specifications of the German wine law, almost every word on the label has to have a differing size.<br>
      I tried a lot of things to work around the balance problem of the dash, like using the dipping pen dot of the logo sign, equals sign, colon divided by dash etc. I found the orignal dash of the Jenson to be the best solution. Robert Slimbach really did a great job!</p>
      <p>@aluminum: White space will be no problem with the client, we talked about that. Certainly white space won’t be available on the wine label, which has to be cramped with a whole lot of information. Above all, the label needs have a small height, because the shape of the local wine bottles—-in German called “Schlegelflasche”—-provides a rather small cylindrical part and a very long tapered neck. This is going to be a typgraphic nightmare! What a wonderful life I could have being a wine label designer in Bordeaux or Tuscany...</p>
      <p>Robert</p>
