    html: |-
      <p>Henry,</p>
      <p>thank you for your critique! The GIF showing my logo design above is nothing more than some kind of digital scribbel.</p>
      <p>1. As I said in my first posting, “WEINGUT” is a placeholder for something set in a font that I do not own yet. I just typed it in using Johnston due to its similar “feeling”—-at least for these uppercase letters and in favour to anything else in my font folder—-to Gotham. No fine-tuning was done, you’re right. Due to seb’s comment I corrected that.</p>
      <p>2. &amp; 3. The claim is also a placeholder. Here it is not the font, but the content which doesn’t exist yet. The line of text is just showing the right place to be for the tag line. Its content is a shot from the hip. That will be discussed when the customer is going to see the sketch sometime next week. You’re right that I was a slave to my construction measures. Though I would use a similar tracking and small case for the final claim to reduce its color in relation to the logo. I would like to give it a more graphic character, building the logo’s base, making it graphically less instable.<br>
      Using Illustrator to draw the logo, I tried to type in ALT+- to get an en-dash like I do in InDesign a dozen times a day, but it rather opened a window related context menu than producing a “Halbgeviertstrich”. I even opened the glyphs window to get the en-dash, but obviously double-clicked the wrong glyph (due to its perishable appearance I didn’t care anymore). If I had typed a hyphen, for Jenson Pro it would look like the sloped wedge shaped hyphen in the name of the winery. Hopefully, there will be no dash at all in the final claim, as well as no slash. Though I am not sure wether the slash is “totally wrong”. A comma stabbing out of the optically closed small caps tag line would disturb my feeling for symmetry and balance—-which does the slash as well, but at least maintains some of the horizontal symmetry. Using “A.D.” instead of the slash, that would be ok within Germany, but I can imagine that the rest of the world—-a great part of the winery’s production is exported—-would rather read “anno domini”.<br>
      Anyway, most likely the content of that line will be something else. If that lines width isn’t roughly in the area of the circles diameter I constructed, I will not force it to this size. Then it will be either shorter or split into two lines. And of course, before I present it to my customer, it will be typographically as good as I am able to do.</p>
      <p>Robert</p>
