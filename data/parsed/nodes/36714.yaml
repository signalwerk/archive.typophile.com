    <p>This is the first time I am posting something for critique. Hope you can handle my poor English… </p>
    <p>I designed a logo for a winery. In the briefing fell words like <em>clear</em>, <em>clean</em>, <em>modern</em>, <em>not forgetting tradition</em>, <em>reserved</em>. The heraldic figure of the winery has to be given up. They would like to see the color blue - which rather unusual for a german winery. I used the logo sign to smuggle in some black letters (black letter still has a hard life here in Germany, in a knee-jerky manner people see it connected to national socialism, despite any historic evidence). Tried to create a ligature for K and L with a dipping pen, when I found that in some black letter fonts the K is a ligature of L and K in itself. The sign has been mirrored to form a reminiscence to the old heraldic figure. The three dots are symbolizing the three generations of the family working in the winery. Looking at it, I see a kind of proliferating foliage similar to the real grapevine, with the dots as grapes. The colors I used are Pantone 5435 U and Warm Gray 8 U, so the blue isn’t too luscious and the overall appearance is rather silent.</p>
    <p>Since I am an electrical engineer and not a graphic designer, the logo is heavily constructed (like almost everything I do), with the golden section as the most important proportion - there are pentagons all over the place. The unserifed font I would like to use would be something not seen here in Germany everyday, classic and classy - like Gotham, Sackers Gothic or Blair. Since I don’t have one of these, I used Johnston for the first approach. </p>
    <p>So, enough babbling - any comments or critique?</p>
