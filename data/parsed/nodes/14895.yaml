      <p>I can fully appreciate the time it must take to keep Typophile going. Volunteer efforts are often taken for granted by the public as a given. Typophile is a great resource and the fact that it exists is reason enough to thank the people behind it...often and with sincerity. But they, like most of us, have day jobs and most likely devote their “spare” time to keeping Typophile up and running. I look forward to future updates to the site, but will allow it to happen when it can.</p>
      <p>That said, I am very interested in the status of the travelling book project. Who currently has one? Is anyone interested in setting up a tracking system for the books?</p>
