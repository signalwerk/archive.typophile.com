    <p>Hi,</p>
    <p>I’m just wondering : on Typophile, when will the Projects and the Ressources sections be available ? Before the launch of this new version, there was some very interesting content in these sections.</p>
    <p>- Bitmap fonts grid, etc.<br>
    - The project of the “traveling book” where you had to create a page and then send the book to someone else (hey, I was on the list of people wishing to receive it ! i’m stil VERY interested !)<br>
    - etc.</p>
    <p>Does anyone have more info on when these will be online ?</p>
    <p>Thanks so much,</p>
