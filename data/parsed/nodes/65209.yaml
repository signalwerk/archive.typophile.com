    <p>We have just added 18 new styles into Tanger Serif Type Family. Book, Light and Ultra-Light fonts now complement previously released styles in all three widths. </p>
    <p>Tanger Serif is a warm and friendly, multi width, New Transitional text face. New weights expand its use range especially towards big sized texts like headlines, logos etc. Take your time and check out possibilities this type family offers. </p>
    <p>Find out more at <a href="http://www.jarnolukkarila.com" title="www.jarnolukkarila.com">www.jarnolukkarila.com</a><br>
    Send us an email and we'll reply with renewed specimen pdf!</p>
    <p>Br,<br>
    Jarno</p>
    <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -<br>
