    html: <p>Looks like you could us a lowercase s with an upstroke for beginnings and combos like the p s in ipsum. I would also look for solutions to crashing descenders like f g as well. The size of your dollar and cent signs seem a bit odd, but perhaps the dollar is raised like a superior character.</p>
