    html: "<p>Here are some shots of those plates:   <br>Ohio...  <a href=\"http://www.worldlicenceplates.com/usa/US_OHXX.html\" target=\"_blank\">www.worldlicenceplates.com/usa/US_OHXX.html</a> <br>West Virginia...  <a href=\"http://www.worldlicenceplates.com/usa/US_WVXX.html\" target=\"_blank\">www.worldlicenceplates.com/usa/US_WVXX.html</a> <br>Virginia...  <a href=\"http://www.worldlicenceplates.com/usa/US_VAXX.html\" target=\"_blank\">www.worldlicenceplates.com/usa/US_VAXX.html</a> <br> <br>In this case, I think it's good.  You'd think that seriffed forms would not be the best choice for an object that requires easy recognition and travels at high speeds (or moves at all), but just a few days ago I had the rare opportunity to observe three cars on the highway just outside of Cleveland--one from Ohio, one from West Virginia, and yes, one from Virginia.  I realized that some cosmic force was allowing me the chance to test legibility among the three classes I just listed above; so I slowed my speed and watched...   <br> <br>-At about 25 feet legibility was comparable in all three classes. <br>-At around 35 feet Ohio was seriously losing ground. <br>-At about 45 feet Ohio was entirely out, West Virginia was OK, and Virginia was clear as a bell. <br>-Past 80 feet Virginia was at least discernible, while Ohio and West Virginia were difficult to distinguish their state of origin. <br> <br>I'm not sure that too much research has been done in this field, doesn't seem that way.</p>"
