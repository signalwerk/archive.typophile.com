      <p><em>I'd planned on opening the one of the fonts and moving the glyphs from the other fonts into that one font</em></p>
      <p>You can save yourself a lot of time--and get some sleep: 4:45 am?--by opening both fonts and using the TOOLS &gt; MERGE FONTS function.</p>
      <p>I doubt that the differing metrics will cause too many problems because the baseline will remain the same. If the final product is going to be a CFF-flavored font, you're probably better off sticking with the Type 1 originals. And the accents shouldn't figure in setting your Ascent values, but will affect the bbox values, which will be calculated automatically.</p>
