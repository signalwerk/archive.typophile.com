    html: |-
      <p>As usual when I answer your posts, I'm sitting at the kitchen table, with no copy of FontLab in the house. So working from memory . . .</p>
      <p>I never work on features within the FontLab application. No editing capabilities. Screen area too small. Type too small. Etc. </p>
      <p>FontLab lets you write off the features (I believe it is "Save Features". Open up the resulting .fea file in your favorite text editor (I like something with power, like VEDIT or now, EditPad Pro). Rename classes as you want. Treating text as a block, having an all uppercase and all lowercase, etc., tools in a text editor is handy. The features file is just a text file, treat it as such &amp; play around a bit -- just don't wipe out what you need to save by something silly like using the same file name. </p>
      <p>Be sure your class definitions are in the feature file (.fea file). Or, if for some reason, you want to keep features and classes separate, write off a class file in the same way. When you do you S&amp;R, if you have two files, obviously you need to do them in both. One reason I prefer everything in one file. Always a compromise.</p>
      <p>To import the file, again open the FL OT panel, and click on (I believe) Open Features, read it in, and compile. Then start fixing the inevitable syntax errors you make at first, import again, compile, etc. Or maybe you won't make any errors, who knows?</p>
      <p>Be careful about the "generate kerning" or some such line in the OT panel. If your kerning is all within the FL metrics file, that may be OK. After generating kerning the first time, I keep it separate, so after that, if I hit the wrong button, I lose my kerning. </p>
      <p>Which brings up a point. There are many ways of working. You better have a plan.</p>
      <p>For example, I keep all the fonts we're serious about in their own family subfolder, within a !fontwork folder. Within each individual font-family folder, I keep the .fea files. All class-based kerning is in these .fea files, with a separate ADD.txt file with a copy of any class-based kerning, just in case I hit the wrong button. Been known to do that. I use FLs metrics file only for exception kerning, which is always pairs.</p>
      <p>These files within the folder are considered the gospel, rather than the stuff in FontLab. If further work is to be done later, it is done in these .fea files. I'm not particularly advocating this, but trying to make the point that when you go back in a year from now (and you will), you better have a system in place to know what's current, what's gospel. For that reason, I NEVER work in the FL OT features panel. If you prefer that, the only sane thing to do is treat the .fea files you may make as temporary, and delete them once FL will compile the features. Your choice, but decide on a system fairly early, changing you mind involves a painful amount of work.</p>
      <p>[edit]</p>
      <p>Along those lines, If you want, you can also do all your OpenType work in Adobe's AFDKO 2.5, using FL only for the glyphs. If you are a serious programmer, that may be the way to go. There are things available in AFDKO not yet available in FL, such as mark and mkmk positioning routines. How you work depends on how the fonts are to be used. For example, I work only on fonts we use to set type. We don't sell fonts. I need a method where I can quickly go into a font, add a character or feature, recompile, and generate the font. Fairly often, one of the comps is waiting for me to get that done, in order to finish a typesetting job. A very different situation from someone who sells fonts as a product.</p>
      <p>Etc.</p>
