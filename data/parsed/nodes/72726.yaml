      <p>Me again,</p>
      <p>I've started to move the characters from our "special" font into the correct Unicode positions. For many of the characters FontLab does a great job of creating the glyphs in one way or another, but for some it can not associate a name with a Unicode. Two instances are a cap Latin Y and lowercase y with macrons.</p>
      <p>These characters appear in the Unicode code charts as part of the Latin Extednded-B code set.</p>
