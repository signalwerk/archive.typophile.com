    html: |-
      <p>Everything I wrote assumes you have kerning data in each of the fonts you're trying to preserve. If you have no kerning data, you have a much easier chore. You also probably have cruddy fonts, but that's a different story.</p>
      <p>Pasting a glyph into the correct cell may or may not solve all your problems. As I remember, if you place the glyph in the proper cell, it will have the right Unicode number. It may not have the right name, and in FL, you write features based on glyph names. You can use FL to generate the right name from the Unicode number. Exactly how this affects kerning data depends. If you type in the name by hand (control+G+R), FL will update the character name everywhere IN THAT FILE, depending on which boxes you've checked off. But not in the other files, of course. That means the other file's AFM will no longer have the *KPX ? ? value* you need for you new file.</p>
      <p>For that reason, when I work by hand, I make sure the old type 1 font files (well, the .vfb and .afm files) have the names as they will be in the new file. Then cut &amp; paste, both characters via FL, and metrical data in a text editor.</p>
      <p>It is almost impossible to list a procedure in detail that will meet your needs and involve no screwups. So, (1) try small files to completion until you get a technique that covers all your needs. (2) save often, and with different file names, so you can backtrack when something goes wrong. It will, and you don't want to start completely over.</p>
      <p>Sorry about the "character stripping in the PDF file" -- not well put. They will appear in the PDF, but if you subsequently extract text from the PDF, they may be missing.</p>
      <p>You need to look at what constitutes canonically correct Unicode. If, for example, you want a "c" with a dot under and an acute over, canonically correct Unicode is the character "c" followed by U+0323 followed by U+0301 (the latter are combining diacriticals). Now *rendering* this is the job of the layout program / text editor. But the *meaning* is correct in Unicode and for any Unicode-compliant program. I believe, but do not know, that MS Word will render this with no extra work on your part. InDesign will not, without a further OT feature(s), either *mark* and *mkmk*, or *ccmp*. With *mark* and *mkmk*, no extra glyph is needed. Each method has its share of compromises. With *ccmp* you do make up a glyph, and it's name must be uni006303230301, and it is subbed in by a ccmp line,</p>
      <p>sub c uni0323 uni0301 by uni006303230301</p>
      <p>or, if you've *named* the combing acute "acutecomb" and the dot below as "dotbelowcomb", use those instead e.g.</p>
      <p>sub c dotbelowcomb acutecomb by uni006303230301</p>
      <p>The replacement glyph is named uni006303230301, (Adobe requirement for PDF) but has no Unicode number.</p>
      <p>Or, you put it in the PUA and call if *Fred*. But subsequent use of the files will ignore Fred, he has no meaning.</p>
      <p>* * *</p>
      <p>No, you can't hire me, and a good thing. There are people who hang out on Typophile who are real experts, and I'm not one, save for making font files that will set with InDesign, for printing books, and where the text can be extracted for latter use. AND always assuming that the files coming in are in a certain form. For example, we have never had a manuscript (file) where the author used language tags, so I don't bother with them. Etc.</p>
      <p>All these tips can do is help with the testing you'll have to do. Again, "Save As" often, and make a list of what's in each version, because I guarantee you'll be backtracking some at first.</p>
