    html: <p>Various companies and organizations have internal standards for placement of glyphs in the PUA. Some of them are listed in the FontLab interface; others aren't. Nothing's going to break if your font overlaps with those assignments. The main potential issues are (1) if somebody changes the text to some other font, they might get a different character, which is an unavoidable issue anyway with PUA slots, and (2) if you ever need your font to be compatible with, say, the Medieval Unicode Font Initiative internal standard, then you may find you have conflicts.</p>
