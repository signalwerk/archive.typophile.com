      <p>BTW, forgot to add: If your Type 1 fonts (roman and italic etc.) have the same encoding, if your programming skills are up to it, you can make a PFA from the PFB, and write a list (program) to rename all the glyphs in both the PFA(s) and the AFM(s). Then open the PFA's in FL.</p>
      <p>There were some TeX routines that would do just this, dunno if they're still available.</p>
