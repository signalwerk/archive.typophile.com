      <p>I think the space value in the Greek was done as it is just to make the Greek set well by default, hard to say though, I wasn't on board at the time.</p>
      <p>Good point about the justification and makes perfect sense. I did create a class in to which I would put all the Greek characters. With that I did a very simple calt, shown below. I was mainly fiddling to see if anything was even possible and only checked a single line of type in InD. I bet justification WOULD be an issue.<br>
      feature calt {<br>
        sub @class4 space ' by  space.greek;<br>
      } calt;</p>
      <p>I'm not sure what you mean by GPOS routine.</p>
      <p>We are knocking around the idea of multiple fonts, thanks for the suggestion. Right now I think we're going to simply make some decisions of how things will go, (oh did I ever mention we may put Greek accented small caps in the font as well?) put together the Unicode font and give it to the guys handling the web and see what they say.</p>
      <p>Thanks, Jens for chiming in, much appreciated! The Kern feature seems to be a possibly. Does using the "grek" mean I have to define certain glyphs as Greek? Can a glass be used?</p>
      <p>With the few features I've been fiddling with I've been opening other fonts to see how they're written. I found the registered features on Microsoft's site which lists what they do but I've not found a place showing syntax for the features. Is that available anywhere?</p>
      <p>And last but not least annoying: How the heck does one rename a class in FontLab 5? Creating and filling one is easy, but I've been unable to rename it to something that makes sense.</p>
      <p>Thanks a gain for the time and input.</p>
      <p>All Best,<br>
      Ken</p>
