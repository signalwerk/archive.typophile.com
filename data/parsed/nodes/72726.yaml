      <p>That *is* a good idea, and I don't think it should cause any problem at all.</p>
      <p>As for the ID Glyph panel order: you can toggle between Unicode and Glyph id sorting. The former is useful if you know (roundabouts) what you are looking for, but the second one can also be very useful -- <em>if</em> the font designer anticipated its use, that is. I used Glyph order (I think FL calls it Character Index) to group 'similar' phonetic characters together, whereas in Unicode they are all over the font.</p>
      <p>You are already free to choose any order in your PUA, but you could use this to offer an <em>additional</em> character sort.</p>
