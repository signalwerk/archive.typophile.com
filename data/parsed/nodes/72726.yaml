    html: |-
      <p>Isn't this fun? -- Actually, I enjoy it when not under time pressure. FL will help you with names. The *Rename glyph* pallet has two green things off to the right of the place you enter the name and Unicode number. If you have one filled out, try clicking the greenie of the other. If FL is to assign the name, a further menu setting is needed. Use the Adobe name WITHOUT Afl(whatever) -- nothing wrong with the "Afl (or something similar), but it will drive you nuts writing features, which are name-based in FL.</p>
      <p>This trick is esp useful if you know the name but not the Unicode number. No pawing through the book trying to fnd the number. Try this. Cut and paste an alpha somewhere in the PUA region. Bring up "rename glyph" (control G R on a PC). Type in "alpha" in the name spot. Click on the green button next to *Unicode*, and voila, FL will assign the right Unicode number. Further, it checks to insure you haven't already used either that name or number. And it will "move" the character to the correct position (that's a visual move only, glyph order (index) is set differently). Now, if you've already got an alpha in your new font, this won't work, because FL is checking. If you've already done "alpha", delete it &amp; try this trick. As always, save the file before, don't save after, unless all the metrical data will come later.</p>
      <p>I usually work this way, (1) when doing things by hand and (2) I know the name. All this is "a faster way to use the program" not "must do it this way."</p>
