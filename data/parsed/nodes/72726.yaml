      <p>Ken, about your special characters in the PUA: the glyphs in the PUA only have a semantic meaning in the <strong>exact font</strong> they are defined in -- that puts the "P" for "Private" in "PUA".</p>
      <p>With regard to special characters, yo have two options:</p>
      <p>(a) You assign no Unicode to these characters, but (as Charles said) you can only use them in programs that allow inserting any glyph from any font (as with InDesign's Glyph panel). You probably could use OTF features to call them up (i.e., if you have an alternate double arrow glyph, replace "=&gt;" with that) but then you would be at the mercy of OTF support in the programs you work with.</p>
      <p>(b) You assign PUA codes to your special characters. That means you can use them in any program (provided it can handle Unicode text; but you've got to start <em>somewhere</em>), and you don't need to rely on custom features.</p>
      <p>But: in both cases <em>you cannot use any text in this font</em> for web content. Characters without a Unicode cannot be represented in HTML, and <em>neither</em> can PUA characters -- a typical web viewer, John W. Browser, who doesn't have your font but sees Times and Arial instead, will either see the PUA characters of Times/Arial in that position (which can be <em>anything</em> else), or the default "I dunno what this is supposed to be" Missing Glyph Squares.</p>
      <p>That said: What sort of special characters were you thinking of?<br>
      Some limitations can be worked around. Suppose you want to include several different kinds of bullets (only graphic variations, not semantic ones). You could put the variations as 'alternates' under the regular Bullet character, and use the full range with advanced software, or copy them into HTML text, and you'd get the standard bullet.</p>
