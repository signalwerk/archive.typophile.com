      <p>Before I say something stupid, why do you want to put characters in the PUA? And maybe this breaks done to "what applications programs do you need the variant characters available in?"</p>
      <p>For example, I put in most of the Grec du Roi ligatures in a font; they can be accessed by any OT program that has a glyph pallet, or one supporting stylistic sets (Does Word support stylistic sets? Are 20 sets enough for you?). I believe that as of today, characters without a Unicode number not accessible in MS Word, but I bet that changes. Won't display on the web, but they wouldn't anyway.</p>
      <p>What I know about the Private Use Area can be written in a match book -- as long as what you write is "Don't use it if at all possible" The only reason is that you can't access the characters in Word, or, Unicode has abandoned you, and won't give a codepoint, a situation the medievalists face. How important is that for your fonts, anyway? If they are just stylistic variants, they can be handled better in an OT-compliant program like InDesign in other ways.</p>
      <p>BTW, If they do wind up in the PUA, if you name them something like alpha.01, alpha.02 etc, text extracted from a subsequentPDF will show them as alpha's. PDF is name based, and everything after the period drops out. XML-compliant coding is different, as it presupposes Unicode. I believe they will just be gone.</p>
