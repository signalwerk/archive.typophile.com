    <p>Hi Guys,</p>
    <p>I'm combining a client's series of fonts into Unicode/Opentype and I'm wondering about the best way to get started. The fonts were originally created in Fontographer 3.5 and were used primarily as Type1 with some occasional use in TrueType.</p>
    <p>I'd planned on opening the one of the fonts and moving the glyphs from the other fonts into that one font. The Ascent and Descent values for the various fonts do differ a bit, not sure whether that matters.</p>
    <p>Opening the Type1 in FontLab 5 the Ascent and Descent values are different from what was in Fontographer. Opening the TrueType they seem to match. Am I better off using the TrueType as a starting point?</p>
    <p>Some of the glyphs have stacked accents. Is that something I need to be concerned about beyond setting an acceptable Ascent value?</p>
    <p>Does anyone know of a good source for further information regarding the PUA? Are there any even loose "standards" in existence?</p>
    <p>Many thanks for any insight that can be offered.</p>
    <p>Ken</p>
