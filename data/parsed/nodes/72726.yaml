      <p>Best I remember, when you merge fonts, if there is a name conflict, you get A.1 (or something) for the "A" merged in. Now, suppose in your Greek font that you have Alpha in the "A" position -- with the name "A" (PostScript Type 1 goes by names). If you used any of the layout programs with hard encoding (Quark, PageMaker, etc.), it had to be that way -- "Alpha" wasn't in the encoding vector.</p>
      <p>In the new, program-merged font, it will be named "A.1", and no Unicode number will be assigned. Etc. I also had trouble with the kerning. Best I remember, when a character was in the leading position, all the kerns made it, but when it was in the trailing position, no. No idea why.</p>
      <p>Give it a try. I think your original idea was best, but who knows? Think I was working with 4.2 at the time, FLS5 may do better with the kerning. But so far, no program can guess what a mis-named glyph *should* be. I believe it was one of your posts where I estimated 2-3 days for roman + italic, assuming the kerning and OT features needs aren't too great.</p>
      <p><cite>Is there anyway with Open Type to know, for instance, that Greek is being used and to go get an alternate character? I'm thinking probably not.</cite></p>
      <p>Sure. It doesn't even depend on language, just glyph names are needed. For example, in a calt feature, you can write something like </p>
      <p>sub sigma' space by sigma.final;<br>
      sub sigma' comma by sigma.final;<br>
      sub sigma' period by sigma.final;</p>
      <p>etc. or, make up a class that has as it's members all the things where a preceding sigma would be the final sigma., and write</p>
      <p>sub sigma' @clasname by sigma.final;</p>
      <p>Actually, I'd not recommend this for sigma, it is just an example. But does show the importance of having things properly named, either in accordance with the Adobe standard, or (PITA) by using the Unicode number, preceded by "uni" for the glyph name.</p>
      <p><cite>Does anyone know of a good source for further information regarding the PUA? Are there any even loose "standards" in existence?</cite></p>
      <p>The thing about loose standards is they keep changing. Adobe use to put all kinds of things in the PUA. Believed they have stopped. Characters in the Private Use Area HAVE MO MEANING! If you aren't going to be using a layout program/text editor that can only access characters with a Unicode number, don't give one. If, for some reason, characters have to have a Unicode number, you can use PUA. Use to be they'd be stripped out of a subsequent PDF file, though.</p>
      <p>You need a full-blown expert to do this work, and I'm limited to what works with InDesign, where printed books are the final product. You can either spend the time to learn, and it won't be quick, or hire it out.</p>
      <p>Sorry for the water on the dreams.</p>
