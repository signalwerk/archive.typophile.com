    html: |-
      <p>I could think of several ways to do it, depending on which OT features your applications support.</p>
      <p>If your app can use the »Localized Forms« (locl) feature:</p>
      <p><code><br>
      feature locl {<br>
        script grek;<br>
        	language dflt;<br>
        		sub space by space.grek;<br>
      } locl;<br>
      </code></p>
      <p>Or as part of the kern feature, with no extra glyph:</p>
      <p><code><br>
      feature kern {<br>
        script grek;<br>
        	language dflt;<br>
        		pos space &lt;50 0 100 0&gt;;<br>
      } kern;<br>
      </code></p>
