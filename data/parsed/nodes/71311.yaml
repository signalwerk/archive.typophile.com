    date: 2010-06-18T18:53:00
    date_raw: 18 Jun 2010 — 6:53pm
    votes: null
    html: <p>Serifs can look good on TV. I opted for slab serifs for Cinecav because anything thinner caused interlace flicker. Although they weren't designed for the screen, have a look at Courier and Officina. Test them on screen and make observations . . . I think you can learn a lot from looking at the way print fonts behave on screen. Century Schoolbook kind of works on screen. Looking at the way existing fonts behave on screen before you start designing can set you on a clearer path.</p>
