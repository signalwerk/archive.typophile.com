    html: |-
      <p>I was a game developer for years and have worked on lots of fonts tuned for TV. </p>
      <p>There's no better way than getting some tv sets and testing. Figure out your worst case scenario TV set and set up a video card to output to it. When I designed Cinecav, I used a TV which I found on the curb and a few other low end sets. I found that the higher end sets didn't give much better feedback than a computer monitor. When I worked in games, we didn't have gold standard set for testing. Any reasonably shitty TV will do the trick. I never tested in PAL but I imagine it would be similar. The resolution is irrelevant because you never know what size the font will be scaled to.</p>
      <p>Here are some tips for making CRT fonts. Some of these rules may apply to plamsa &amp; LCD but maybe not.</p>
      <p>When dealing with CRT with interlace it's best to avoid thin horizontals. If you're doing a serif font, make sure the serifs are beefy enough that they don't cause interlace flicker. How beefy? Depends. You have to test the serifs at different sizes. Short sharp serifs still flicker but they may not be noticeable. Times New Roman regular is an example of too thin/too long. My Byington font is an example of serifs that were designed to avoid excessive flicker. Compare with other Trajan based fonts which have sharp serifs.</p>
      <p>Near horizontals look like blurry horizontals on a CRT. Subtlety in horizontal angles is going to get lost so stay flat when possible. Avoid angled ends. Compare Arial to Helvetica on a CRT. Arial's ends don't look angled, they just look fuzzy.</p>
      <p>Near verticals? No problem. Vertical lines are pretty much just as blurry no matter the angle. Enjoy your vertical freedom.</p>
      <p><em>Phosphor traps</em> are like <em>ink traps</em> or <em>light traps</em>. Unlike ink traps, they tend to look best when they're squared off. Pop over to <a href="http://www.ccfonts.com/" title="http://www.ccfonts.com/">http://www.ccfonts.com/</a> and you can see phosphor traps that are really exaggerated. You don't have to go so wild with the phosphor traps but that squared trap strategy can shed a few crotch pounds when needed.</p>
      <p>Counters fill in like crazy on a CRT so take care and test a lot.</p>
