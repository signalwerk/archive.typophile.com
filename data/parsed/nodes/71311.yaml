      <p>@_leigh the closed captioning on my Toshiba Regra TV set is enormous and blazing white. I can't change the font size so it's really irritating. The text often covers half the screen so you can't even see the actors through all the kanji. My Panasonic phone has a TV with closed captioning . . . it also obscures a lot of the screen but it's not as bad. Subtitles in the movie theater are more subtle. I've seen a few movies with English audio and Japanese subs. They use really thin fonts as not to be so distracting. On DVD, they use reasonably sized fonts for Japanese subs. When things get too wordy, they edit the text to fit. I notice a lot of dialog gets left out, probably just to make the text fit or for simplicity's sake.</p>
      <p>TV variety/talk/game shows have their own "hard subs". You've probably seen clips on YouTube where certain words are displayed in colorful fonts. They started doing that about 15 years ago so now it's expected for most variety/talk/game shows. Since they don't subtitle every word, they can afford to use huge lettering, often with special effects. If you watch those shows with closed captioning, they sometimes leave out the words which are already displayed on-screen but sometimes they're duplicated. It's not that consistent. A large percentage of talk/variety shows have no closed captioning.</p>
