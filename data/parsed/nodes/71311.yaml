      <p>Yup, what he said. Fine advice.</p>
      <p>And obese it is! Learn to love it.</p>
      <p>Also, just to complicate it further,It would also depend on how the font is being outputted, your digital programme guide is being rendered by the device, where as things like Now/Next/Later would be broadcast and decoded like an image - that will also effect the quality.</p>
      <p>My bad, didn't mean to imply your 16pt needs 3pt strokes, but as a rule I try never to let any single lines drop below that mark, for boundaries and horizontal rules etc.</p>
      <p>@typodermic, i've wondered how they cope in Japan using their alphabet on crappy CRTs - did they just have to make everything huge?</p>
