      <p>I know a few very loose rules...<br>
      I'd like to know if you do find any good books on the subject - most my my knowledge is from working with guys who've been making broadcast ads since before, well, computers.</p>
      <p>So, take 16pt (on an average 1000upm face) as your minimum. With that in mind, any strokes thinner than 3pt are going to start to strobe depending on the quality of the TV. So your looking for something with strong strokes, and large open counters to stop it appearing uneven.<br>
      Obviously upwards from 16pt and you can get more free, but remember the strobing problem still applies even on large sizes.</p>
      <p>I think some of the older computer games developers would know more on the subject than anything broadcast centric - they've been dealing with complicated interfaces and typography for years on PAL, HD has eliminated most of those issues now. Most broadcast stuff is big and in CAPS for the reasons above.</p>
      <p>VAG, Gill Sans, and Zurich have all had long and fruitful lives on TV. Maybe they hold the secrets...</p>
