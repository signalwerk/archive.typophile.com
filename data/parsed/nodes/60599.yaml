    html: |-
      <p>Will she be typesetting letters on screen and then printing them out on your stationary?<br>
      Or are you just designing the letterhead and then your client will compose the letters by hand?</p>
      <p>If it’s the first, then you have a larger issue on your hands. If it’s the second, then really just about friendly sans will do. And yes, the font should emote “friendly”— after stationary is for “personal correspondence”.</p>
      <p>Narrow your choices (or help us narrow them for you) by telling us what them are elements are you using and style are you tring to create. Bauhaus Geometric then Futura. ArtDeco- Nuetraface. Minimalism- a bitmap... etc</p>
      <p>Does she owns a business and her stationary might do double duty? then allow for that too.</p>
      <p>Mikey :-)</p>
