  html: <p>I'm looking for an elegant, yet not feminine font for a woman's personal stationery. She is very sophisticated, elegant (and somewhat modern) and does not like frilly or feminine things. Her preference is sans serif but I'd like to explore both, seeing as she is open to suggestions. Thank you very much!</p>
