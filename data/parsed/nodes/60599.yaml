    html: |-
      <p>Simone:<br>
      I hear you on the money thing!....I just had to drop some cash on a new face for a job I'm doing myself.</p>
      <p>But, I usually look at that as an opportunity to do my part to help type designers make a living...educate your client about what good type costs. Show her a range of options, and tell her what each typeface costs (and that she should probably own a license for her own identity typeface!)</p>
      <p>I find that usually you can't do a stationery / letterhead job "for free" just because you own the fonts yourself because (1) you shouldn't be giving a client copies of fonts you already own, (2) quite often, the identity fonts need to be paired with the fonts that will be used in the body of the documents that she types and prints onto the preprinted letterhead you design, and (3) that usually limits you to templating the body content with default system fonts that your client owns, which is usually a VERY WOEFUL and limiting selection.</p>
      <p>So, unfortunately, I think your letterhead type choice also needs to be designed with the body content type choice in mind....so they make "good bedfellows" as it were... ;-)</p>
      <p>Cheers</p>
