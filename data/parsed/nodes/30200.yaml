      <p>What was it Tschichold said? </p>
      <p>'Standardization, not individualization.<br>
      Cheap books instead of fine press editions.<br>
      Active literature, instead of passive leather bindings.'</p>
      <p>Don't get me wrong, the bibliophile in me will NEVER stop marveling and collecting fine printing.</p>
      <p>I've been following this area for the past couple years now (having ordered examples from a number of printers), and I've been meaning to take advantage of it for quite some time. I don't intend for the projects I have in mind (all personal) to imitate fine press or conventionally offset books. A lot of Jason's gripes, I agree with. Instead, I'd like to take advantage of the roughness of the medium, in much the same way that photocopied zines hit the scene a couple years ago. </p>
      <p>I've ordered a number of POD books, and they generally look like sh-t because they're obviously not designed by someone armed with book skills, or more often than not, the pages are simply reprinted scanned reproductions of the original pages. I understand the importance of democarcy of literature, butlet's ensure that the medium is as flavorful as the content.</p>
      <p>______________________________</p>
      <p>The major problem against POD and publishingall those wonderful outof print and obsucre books is copyright issues, especially  the risky situation of accidentally infringing on an existing work without knowing it.</p>
      <p>The following is from a website whose author is dealing with his own copyright battles with POD publisher Kessinger.</p>
      <p><a href="http://new.businesscommonsense.com/enews/fullStory.bsp?sid=32029&amp;var=story" title="http://new.businesscommonsense.com/enews/fullStory.bsp?sid=32029&amp;var=story">http://new.businesscommonsense.com/enews/fullStory.bsp?sid=32029&amp;var=story</a></p>
      <p>April 9, 2006, Financial Times, Patti Waldmeier wrote an article titled, “Copyright is stifling US Culture.”</p>
      <p>'American universities, museums and libraries hold huge collections of material that they dare not post online because of the risk of massive liability if an unknown copyright owner later surfaces to sue them. Dealing with all these orphans is a hugely costly business: Cornell University, for example, says it spent $50,000 of staff time and several months calling publishers, authors and authors’ heirs, trying to get permission to digitise 343 monographs on 19th- and 20th-century agriculture—and still failed to identify 58 percent of the owners.'</p>
