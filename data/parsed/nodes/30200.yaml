      <p>Jason, although I agree with much of what you are saying, I think there are examples of high production values in POD, just as there have been high and low values in traditional printing, typesetting, etc.</p>
      <p>My first adventure with POD occurred last year. In 2004-2005 I developed a highly visual book with two authors who wanted to find the right publisher, but who did not want to submit a manuscript and a bunch of prints. They preferred to put the book into full design first and then shop that around to the publishers, because they felt it was the only way to ensure that their ideas would be properly understood. It is a complex subject, about the relationship between the built environment and our needs as humans. Authors are an architect and a psychiatric social worker. (<a href="http://www.amazon.com/People-Places-Connections-between-Landscape/dp/1931807450" title="http://www.amazon.com/People-Places-Connections-between-Landscape/dp/1931807450">http://www.amazon.com/People-Places-Connections-between-Landscape/dp/193...</a>)</p>
      <p>The solution was to design the book, and have 25 copies run off for them to send to prospective publishers. I had Acme Bookbinding (just outside Boston) do the work and although it was not as good as the final printed edition, it completely captured the feeling of the design. Syntax Antiqua type reproduced well and had the proper color. Photos were not super-sharp, but all the detail in them was perceptible and color balance quite good. The book was printed on Monadnock Astrolite alkaline pH uncoated paper, 100-lb basis, and all 25 copies were Smyth-sewn and bound in the same cloth that we would later use in the normal offset-printed edition. Jackets were also produced digitally and overlaminated. The result was very close in spirit to the final edition.</p>
      <p>So I am not disagreeing with you on much of what you say, but I think in the hands of a designer who is willing to push hard for quality, and with staff and equipment who are dedicated to doing a really fine job, a lot is possible. (Acme's main work is very high quality edition binding, so their standards are already high.)</p>
      <p>In a shop such as Staples or W. H. Smith's, it'll be an entirely different matter.</p>
