      <p>Karsten, I actually woke this morning feeling somewhat hypocritical and arrogant, determined to pop open Typophile to say that I am also often forced to rely on digital printing, due both to finances and short-run projects; I suppose my grouching here is more about aspiration. For years now I've produced very limited-edition chapbooks of poetry by Canadian writers, and from the first my intention has been to build well designed books by relatively unknown poets in a format and at a price that anyone can afford: it always seemed somewhat pointless to expect a reader to shell out a bunch of money for a handful of poems by someone they've never heard of. The idea was to make the book a sort of introduction for the reader &amp; writer, and if that invitation could include the dignity of decent typography &amp; book design, that has been my goal. However, as I don't own a press myself, and offset printing of 100 copies is impossible (ie: cost), I've tended to print the pages myself with a high-resolution laser printer, and the covers printed ink-jet on alum-treated paper to secure the colour. All of this has been a source of considerable irritation for me, because what I would like to be doing is printing these books by hand, with metal or polymer. Alas, for the time being that's not a possibility, so I have had to settle for what seems to me to be a sad compromise.</p>
      <p>Thus, I don't mean to say digital printing has no place, just that it is, to my mind, a bitter yet often necessary evil. The real problem, and here's the part that concerns me, is that it is beginning to be seen not as a necessary evil, but a reasonable and, more, acceptible substitute for "the real thing." The fact that I am running in to more and more freelance clients who are considering this option for edition printing is what worries me.</p>
      <p>As for myself, much of what I'm doing now involves a compromise I'm uncomfortable with, but the goal is that this work will contribute to the plan of setting up a press so that I can some day (hopefully soon) be able to produce books that honestly deserve their name.</p>
      <p>ps. Karsten, thanks for your off-list email &amp; the doc you sent. I'll have a look &amp; respond soon.</p>
