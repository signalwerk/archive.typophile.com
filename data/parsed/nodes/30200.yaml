      <p>I am excited about this idea for 15 years now and hope much that it will be a success.</p>
      <p>It will turn into a really big thing if copyrighted books were made available that way, say scientific literature, and royalties instantly forwarded to publisher/author with each order.</p>
      <p>Also, I am curious what a copy will look like! (Quality of printing and binding.) Or, in which data format books are provided -- as static layouts (PDF, scans), or can the purchaser select a different typeface, type size, margins? I think this technology will make it more clear that there needs to be a document format which serves both the screen and print -- i.e. as flexible as html (new text flow according to window size, or paper size) and typographically as sophisticated as PDF. The document would be the same, regardless of being presented on a small or big screen, or printed. But I bet this will remain a dream for the next 15 years to come.&nbsp;&nbsp;:)</p>
