      <p><cite>I am excited about this idea for 15 years now and hope much that it will be a success.</cite></p>
      <p>I've been sharing your sentiments, albeit not for 15 years ;)</p>
      <p>I've also thought about future document formats and automated typesetting. It seems that with some (relatively) simple rules and limits; ie. a range of DIN page sizes, font size limits, and tagging words to prevent hyphenation, it won't be hard to pull this off. It's the sort of thing I think we can expect to come from Adobe over the next decade as Adobe enhances Flash and Flash replaces XHTML as the standard for web design. I expect that eventually Adobe will merge XML/XHTML, CSS, Flash, and PDF into some new uber-format. Maybe it's a bit much to expect this from Adobe, especially with Warnock and the other PARC guys on their way out the door, but the addition of new blood from Macromedia might light a fire under the collective butt over at Adobe HQ.</p>
      <p>How cool would it be if we see a Google/Adobe merger, and get software that allows us to design for every format under the sun, and has instant access to nearly every piece of content in the universe? I'm really taking this offtopic fast...</p>
