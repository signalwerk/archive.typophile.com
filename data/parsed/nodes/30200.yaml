      <p>I've been really interested in self-publishing for a little while now. I looked into using Blurb's 'BookSmart' software, which was deliberately limited in terms of creating of layouts but let you choose the type of typefaces you would like to use which made me pretty happy.</p>
      <p>Unfortunately the postage to the U.K. was too pricey for a test run so I recently tried Lulu.com instead (they have helpfully set up a U.K. devison). Lulu.com is a great system for self publishers, particularly if you are a designer used to supplying files as PDFs and I love the way they have utilised the concept of Print on Demand to it's full extent... here comes the but... </p>
      <p>I thought the print quality was really disappointing. I had expected something similar to the look and feel of a decent quality offset job but the reality was more like a high quality Colour Laser Copier. In particular, the full bleed photographic images highlighted the jarring contrast between the thick, layers of glossy ink and the uncoated stock. I'm guessing this is where the whole Print on Demand idea starts fraying at the edges. Either colour laser printers need to get a lot better real soon or designers and the general public will have to come to expect a low standard of quality from publications using a POD system. </p>
      <p>In terms of my self-publishing project, I haven't given up. I know what to expect now, I'm 'reshaping' the project to match the medium... I'm now thinking 'zine'. :)</p>
