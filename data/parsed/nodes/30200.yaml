      <p><a href="http://www.lulu.com/content/333763" rel="nofollow">Friends of Don at LuLu.com</a></p>
      <p>I printed this photography book last year POD with LuLu.com and it came out awesome. At least, as awesome as a self published photography book with no up front costs can look. We ran a few test books just to tweak the photos, but in the end it came out great.</p>
      <p>An amazing service for students. I plan on designing a ton of books to print, just to beef up my portfolio.</p>
      <p>If anyone needs a cheap, nice portfolio, POD is the way to go.</p>
      <p><cite>It seems that with some (relatively) simple rules and limits; ie. a range of DIN page sizes, font size limits, and tagging words to prevent hyphenation, it won’t be hard to pull this off.</cite></p>
      <p>It's even better than that. There are size limits and bleeds and stuff, but basically you just give them a .PDF of whatever you want printed. You can give them a .DOC file, but they convert it into .PDF on their end anyway. As long as there are no technical problems with your file it should print exactly the way you want it to, warts and all.</p>
