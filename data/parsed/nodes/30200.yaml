    <p><a href="http://money.cnn.com/magazines/fsb/fsb_archive/2006/12/01/8395114/index.htm?postversion=2006121409" rel="nofollow">CNN is reporting that on-demand book printing machines will be turning up in stores next year</a>, and will be able to reprint books with no/expired copyrights in Google books and the Open Copyright Alliance.</p>
    <p>I'm pretty excited about this—think about all the classic, impossible-to-find type/bookmaking tomes that we'll be able to just order up and start reading!</p>
