      <p>Further evidence that I'm turning into an old grouch: there seems little or nothing positive about the "potential" for POD printing, and while others here have voiced a certain excited anticipation at the prospect, personally it finds me with a sense of impending doom. While the technology has, indeed, improved in the last few years, with POD we're talking toner, not ink, and even with the latest machines, simulated linescreen of any resolution still looks like a bunch of sloppy dots. Add to this the fact that any decent print requires super-smooth stock, yet most POD printers throw in the cheapest paper they can find, wrapped up with cheap glue in a poorly scored cover and physically the fate of the short-run book looks bleaker and bleaker.</p>
      <p>Add to this the discussion above about on-the-fly font changes and now I'm feeling really queasy. Given the considerable time and skill required to flow a text smoothly, to balance the content and find the appropriate typographic voice, to carefully fit awkward line/word wraps, widows &amp; orphans, images &amp; captions, tables, etc., the thought of randomly picking a font and forcing it through a template to spit out a poorly printed, poorly bound, badly typeset bundle of cheap paper doesn't seem to me to present much to be excited about.</p>
      <p>Too many books are already designed and set by in-house staff who don't know anything about typography and don't have a clue how to utilize a decent page-layout application, who then hand the file off to an ever-growing print emporium that gives less and less attention to the product they're pumping out. And this will somehow be improved by trusting a glorified photocopier to typeset AND make the book?</p>
      <p>While the digitization of information is one thing (allowing access to 500 year old texts at the click of a button), I certainly wouldn't fool myself into thinking that a POD copy of such a thing is in any way a copy of that text; it would be, in fact, a shallow and lifeless clone. If what I want is to read a rare text, great, give me the text in a relatively neutral PDF, but please don't demean the thing by shoving it through a cookie-cutter and calling it a book.</p>
