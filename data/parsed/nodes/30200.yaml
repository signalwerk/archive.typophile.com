      <p>Jason, do you really read my post as advocating low quality? To the contrary, my aim is to increase quality in a segment that normally produces crap.</p>
      <p>(a) What is html/css today? A document format that lacks any typographic quality. Yet html is used to provide long texts that require to be printed before reading. If I ask for a document format allowing for flexible typography, this implies that this document format (and/or the reader software) has some built-in "typographic knowledge", so it does care for widows, orphans, images, captions &amp;c. What Tschichold calls "good typography", or many of the things you have learned from Mr Bringhurst's book, can be automated. Sorry that this didn't become clear in my earlier post.</p>
      <p>(b) It is a misreading if you think that from now on <cite>all</cite> books are to be produced that way.<br>
      If you ever digged into scientific literature, down to dissertations, you many know that this is a huge segment where quality never really mattered: For both lack of typographic knowledge and finances, authors "typeset" books by themselves -- earlier on a typewriter which then was scaled down and reproduced, now in Word, neither margins nor leading and wrapped into a cover designed by the editor-professor's assistant or, yes, a printer's inhouse-staff. Reading that is pain.</p>
      <p>(c) If you lament about possibly missing printing quality, well, have a look into many paperbacks today which seem to be reproductions of reproductions of reproductions of ...</p>
      <p><cite>If what I want is to read a rare text, great, give me the text in a relatively neutral PDF, but please don’t demean the thing by shoving it through a cookie-cutter and calling it a book.</cite></p>
      <p>(d) If you ask for mere access to <cite>texts</cite>, then POD is neither better nor worse than a "neutral PDF" printed out at home. If you want a high quality reproduction to get a spirit of the original, then neither POD or your printer is a solution, and the high quality reproduction -- still a reproduction -- may cost you a fortune.</p>
      <p>(e) One should not mix up the idea of printing (books) on demand, the particular service of On Demand Books or technology they use, and the quality that <cite>could</cite> be achieved (please test the Kodak NexPress 2100 which even prints on rough papers, with offset-like matt printing of colors). As to Google's monopoly, I would feel more comfortable had all the university-based attempts at creating digital libraries been successful. Since universities are the institutions to produce and keep knowledge, it would have been their damned job. But then, in future they'll buy not only the e-learning platforms but also the content, I-don't-want-to-know-where.</p>
      <p>So, printing books on demand is a solution for a special segment. I hope nobody considers printing fine or illustrated books that way. Neither will bestseller paperbacks be printed that way -- too slow, too expensive.</p>
      <p>(Yes, the smell of the book is important, but honestly, I am more interested in the <cite>text</cite>. If the typographic representation assists me with this and maybe pleases my eyes, I'm a happy man.)</p>
