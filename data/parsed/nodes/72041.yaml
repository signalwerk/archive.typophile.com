      <p><cite>the German practice of using short s medially at the end of the elements of a compound word (e.g. misverſtants, Rechtsgeleerden, wisconſtige, Straatsburg, Godsdienſten, misgaan, boosheyt, dusdonig  and misbruyk).</cite></p>
      <p>Am I right, that this cannot be solved without a dictionary in the feature code? Alternatively a rule like this could help:</p>
      <p><code>sub longs exclam' @letter by sindicator;<br>
      sub longs sindicator by s;</code></p>
      <p>Exceptions for the 17th and 18th century are likewise problematic.</p>
      <p>It is a bit comparable with the different rules for the Latin figures. The feature in P22 Operina (?) does not match all rules and exceptions. (Nevertheless it is a cool feature.)</p>
      <p>I think, that fonts, that contain those features, require a manual with the typographical rules and a warning, that the user should not blindly trust in certain features.</p>
