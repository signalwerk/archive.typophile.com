      <p>I don't think there's a problem with having English-only features, Nina, I have included a German-only feature, lowered dieresis, in several fonts.</p>
      <p>Filip, that's very clever, but perhaps it's best to include this "historical" feature as a Stylistic Set, although that would still be no guarantee it wouldn't be misused by unsuspecting Germans.</p>
      <p>Anyone who wanted to use it "seriously" would be prepared to edit it accordingly, and those who like the gimmick effect without too much stricture would be happy to settle for the one "late model" convention it presents, which is pretty standard, IMO, for English.</p>
      <p>It's true that the conventions regarding long s vary, even in English, but why should that mitigate against such a feature?<br>
      After all, layout application "smart quotes" f*ck up apostrophes at the beginning of words, and there are no warnings about that.</p>
