      <p>Unfortunately most fonts are very incomplete with regard to the ſ-ligatures, although it would not require much efforts to create them, if the f-ligatures are already present. In most fonts ſ and f are almost identically with regard to the shape. If you have a ſ followed by a ſt-ligature in the German word "gewuſſt", this looks very ugly and inconsequent in many typefaces. Either no ligature or an ſſt-ligature or the Eszett (ß). Is it somehow contradictory to make use of the longs and to follow the reformed German orthographic rules?</p>
      <p>I assume, that there are no or almost no German words, in which you could use a ſſb-ligature, but the ſſt-ligature could be used very often in German (in contradiction to the fft-ligature). And it would not cost the typedesigner much efforts to add all these ſ-ligatures to fonts.</p>
      <p>(I just had a look on the features of [the genial] Williams Caslon. The font contains a horizontally shortened alternate f. [More fonts should contain a shortened f! Typedesigners forget the accented letters, that are used in combination with the f, too often.] I don’t know, whether it also contains a shortened ſ, but it should.)</p>
      <p>Somehow I felt in love with the ſ. It invites to puns.</p>
