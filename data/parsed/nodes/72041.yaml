    html: <p>Nick, InDesign supports 'hist' feature, although it is hidden. Choose Edit &gt; Keyboard Shortcuts, then select the list of keys for the panels. There is a list of shortcuts named Characters:OpenType. And there is a possibility to add a keyboard shortcut for historical variants of glyphs. You can't access this feature through menu, only via keyboard. An easier way to access the feature is to use free plugin Keyboard Shortcuts by DTP Tools (<a href="http://www.dtptools.com/product.asp?id=ksin" title="http://www.dtptools.com/product.asp?id=ksin">http://www.dtptools.com/product.asp?id=ksin</a>) - you can type the word "hist" to the search window to quickly find the correct function.</p>
