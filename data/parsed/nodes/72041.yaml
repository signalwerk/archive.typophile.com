    html: "<p>Juan Pascoe, a great printer and researcher settled in Mexico, has just told me via e-mail that, in his opinion, in Spanish some complicated uses had to do with the lack of some characters: for example, he says that the ſb ligature was not common, so if you had to write about Liſboa (Lisbon) the space between these two characters was too wide, so you used a short s instead. The same goes for something like “ilustriſſimo”: the ſſi ligature was pretty rare, so you can only use the best available combination: “ilustriſsimo”.</p>"
