      <p>@Arno: Yes, I meant that in the vast majority of cases it was not available. Or at least it wasn’t used – presumedly because they didn’t have such ligature. Old printing in Spanish-speaking countries often had very limited resources. BTW, Juan Pascoe just told me that if we are looking for rules for ſ in Spanish, we may have a better chance by studying some well-chosen manuscripts (i. e., written with care by professionals), since they didn’t have to worry about lack of characters.</p>
      <p>And sorry for the self-promotion, but given your love for ſ I guess you (and others) may be interested: I am finishing (kind of) my Espinosa Nova, which will include f- and longs- ligatures.</p>
      <p>As for the code, I chose the easiest way: “sub s by ſ” in hist feature, and “sub longs longs b by longs_longs_b”, “sub longs longs h by longs_longs_h” and so on in liga (or dlig). I think it is a safe bet (but I still studying an approach similar to the one presented by Nick for a future update).</p>
      <p>[Red color indicates a stylistic variant; the two first lines are for standard ligatures, the last one for discretionary.]</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/EspinosaNovaLigatures_5401.jpg"></div><p></p>
