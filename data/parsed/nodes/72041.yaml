  html: |-
    <p>Although the "hist" feature is not presently supported by any layout applications, I am putting it in all my new fonts, along with longs.<br>
     <code><br>
    sub s by longs;<br>
        sub longs' f by s;<br>
        sub longs longs' by s;<br>
        sub f longs' by s;<br>
        ignore sub longs' @letter;<br>
        sub longs' by s;<br>
    </code></p>
    <p>This satisfies all the circumstances listed by <a href="http://babelstone.blogspot.com/2006/06/rules-for-long-s.html" rel="nofollow">Andrew West</a>, except the Genesis abbreviation, of course.</p>
    <p>I haven't developed codes for other languages.</p>
    <p>It would be cool to be able to apply this feature to e-books, especially those written in the longs days.</p>
    <p>nb. "@letter" is a class comprising all letters other than "s". The "ignore" command is a clever way to handle substitutions at the end of words.</p>
