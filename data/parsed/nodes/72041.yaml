    html: |-
      <p>Nick, </p>
      <p>&gt; Typographic aesthetics over-ruling orthography.</p>
      <p>this has been happening quite often. My favourite example is the Polish ą and ę. First, there was the Latin “e caudata”, which was used as an alternative graphic form of the Latin vowel “æ”: </p>
      <p><a href="http://www.flickr.com/photos/adamt/3630379481/" title="http://www.flickr.com/photos/adamt/3630379481/">http://www.flickr.com/photos/adamt/3630379481/</a></p>
      <p>As it was present in typefaces that were imported to Poland, typesetters adopted the glyph to be used as the graphic representation of the Polish “nasal e”. The other nasalized vowel (“nasal a”) was represented as an “a” with a thin, simple stroke — which did not at all look like the “ogonek” in “e caudata”. Look at the “ą” and “ę” in:<br>
      <a href="http://www.flickr.com/photos/adamt/3630378529/" title="http://www.flickr.com/photos/adamt/3630378529/">http://www.flickr.com/photos/adamt/3630378529/</a><br>
      <a href="http://www.flickr.com/photos/adamt/3630381453/" title="http://www.flickr.com/photos/adamt/3630381453/">http://www.flickr.com/photos/adamt/3630381453/</a></p>
      <p>Only some time later, the typographic æsthetics “ruled” that those two forms should be “made alike”, and the more sophisticated, mature one (i.e. “e caudata”) has been chosen as the source. </p>
      <p>Adam</p>
