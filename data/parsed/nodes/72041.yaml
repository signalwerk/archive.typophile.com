      <p>In Latvian long s was used for the sound of "z" so it could end the word. For the sound of "s" in the middle of the word was long s with a slash except for ligature st. Also there was capital S and capital Sslash.</p><div class="imageWrap"><img src="http://typophile.com/files/avize_4097.jpg"></div><br>
      as you may see two orthographic rules in one page - ones for blackletter, the others for Latin letters.<p></p>
