    html: |-
      <p>My impression is that the crossbar of “Æ” also isn't broken in most native handwriting. So the handwritten forms are just a guide, and for typographic forms different considerations come into play.</p>
      <p>To risk pointing out the obvious, the crossbars of the uppercase letters A and E are almost always simple horizontal lines, while this is not the case for the lowercase a and e. So it makes sense to me that different rules may be used for the uppercase and the lowercase.</p>
      <p>Speaking as a non-native and not having actually tested this, I think I would find both forms of “æ” equally readable.</p>
