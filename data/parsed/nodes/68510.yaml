      <p>Marcin, the æ is deliberately narrower than its components. If it were wider (and I have tried it that way), then it looks too much like a compromise, and not enough like a distinct character. Also, larger bowls make it look too "big" for the style of the face. </p>
      <p>I don't think it's a good idea to make the angle of the o slash slash correspond to that of v, because it makes the bar stick out too much at top and bottom, protruding into the extender area.</p>
      <p>John, the small bowls of a and e are an important part of the design of the typeface, and why I posted this thread.</p>
      <p>Craig, your eyes aren't deceiving you, but the halves are equal. This is a screen grab from FontLab, so it's not particularly accurate.</p>
