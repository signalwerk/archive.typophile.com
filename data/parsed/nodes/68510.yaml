      <p></p><div class="imageWrap"><img src="http://typophile.com/files/aefinal_5260.png"></div><p></p>
      <p>Here's a comparison of æ treatments in a humanist sans with small bowls in a and e, and horizontal crossbars in those characters.</p>
      <p>(1) repeats the shapes of a and e, with two crossbars of different heights.</p>
      <p>(2) has a single, angled crossbar, and is a narrower, unique character rather than a composite -- but with similar-sized bowls (enclosed counters) as a and e.</p>
      <p>Which do you prefer?</p>
