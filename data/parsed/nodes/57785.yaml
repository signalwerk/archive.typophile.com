      <p>Hey Martijn,</p>
      <p>Nice to see you getting into font-design at such a young age. For a first attempt this looks really nice, and certainly very complete! </p>
      <p>There are a couple of points I'd like to address, but they all seem to have the same origin; you following your grid very strictly (something I do too sometimes). But as you said you purposly based this design on geometrical forms, so I guess they are not really <em>flaws</em>. And all I will suggest to take a good look at how a font like Century Gothic (also based on geometrical shapes) sometimes breaks the grid a little to make sure there is not too much negative space between the glyphs, ensuring everything fits together a bit better.</p>
      <p>Succes ermee!</p>
