    <p>Hi all,</p>
    <p>I collected my courage (as we say that in Holland) and I posted my font here.<br>
    It's my first some kind of Sans-Serif-Display-OpenType font, based on circles and rectangulars and other shapes. Most drawn with FontCreator (my previous font maker program).<br>
    &nbsp;<br>
    Here's an (older) image, which I made with Illustrator at school:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/geometro_4120.PNG"></div><p></p>
    <p>I've made a little test specimen, which I added in my attachment. Not all glyphs are listed, but it contains Latin, wide range of accented letters, Greek, Cyrillic, Small Caps and more.<br>
    I think I need to get InDesign somewhere and learn how to use, because PowerPoint (2007) can't access my OpenType glyphs and alternates, etc.</p>
    <p>Please note:<br>
    - I'm 15 years old, so big way to go and enhance.<br>
    - Never had any lessons on type designing.<br>
    - My first "meeting" with FontLab Studio.<br>
    - My first OpenType project.</p>
    <p>Thanks for your replies!</p>
    <p>Kind regards,<br>
    Martijn van Berkel</p>
