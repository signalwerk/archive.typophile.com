    html: <p>I finally had the sense to check the <a href="http://www.unicode.org/charts/PDF/U0100.pdf" rel="nofollow">Unicode pages</a>. G, K, L, N, R all have cedillas; I'm going to have to correct this in my own fonts. Since so many people use Fontlab, I wonder how often this happens. For S and T, <em>both</em> exist; make sure they're in the right codepoints. Though I get the impression that Romanians always use the cedilla codepoints and expect to see commas there anyway. Such are the trials of we, the obsessive-compulsive...</p>
