  - id: 345959
    user: 14604
    date: 2009-05-08T09:51:00
    date_raw: 8 May 2009 — 9:51am
    votes: null
    html: |-
      <p>Hi Martijn,</p>
      <p>I agree with Wouter above me, nice that you're exploring type design at your age. How did you get interested in it? Anything in particular?</p>
      <p>I also think that you should 'let go of the grid' in certain situations. I understand that geometry is the basis of your design, but ultimately it all comes down to how it <em>looks optically</em>. You'll see that well known geometric typefaces, like Avant Garde or Futura aren't actually completely geometric. </p>
      <p>For example, the strokes of the bowls in those typefaces taper when they meet the stem (where the rounds meet the straights the lines get thinner), to make sure that no 'black blobs' appear. That's one of many details you can use to make sure everything looks balanced.</p>
      <p>Another thing you should probably take a look at are the dimensions of certain characters; some of them are very wide, while others are too narrow. This is probably also something that you can solve by letting go of the grid. For example:</p>
      <p>lowercase:<br>
      - The f is too wide on the top<br>
      - The h is quite wide (so the m, n and u as well)<br>
      - The ear of the r is also very wide<br>
      - The s is too narrow, and the spine (the middle part) could be a bit more smooth<br>
      - The t is too wide<br>
      - The v, w and z are probably also slightly too wide</p>
      <p>uppercase:<br>
      - The top bowl of the B should be slightly narrower, so that they are optically equal. As you can see now, the top bowl looks larger than the bottom one, eventhough they are the same size.<br>
      - A, H, M, U, W, X, Y, Z are too narrow<br>
      - L is too wide<br>
      - S spine again could be a bit more smooth</p>
      <p>numbers:<br>
      - 3 top should be smaller, it now looks larger eventhough it isn't<br>
      - 4 the crossbar (horizontal) should probably come down<br>
      - 5 the bottom part should be larger / top is too high<br>
      - 8 same as 3, top probably too large, make them optically the same</p>
      <p>I would just take a look at Futura, and the dimensions of its characters in relation to each other. Not to copy them, but to learn from.</p>
      <p>Veel succes! :)</p>
