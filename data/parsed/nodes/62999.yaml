    html: |-
      <p>Who is the audience for this book?</p>
      <p>I wish to point something out regarding the demographics of computer-based designers. The most expensive and the most free software is often the same product. This is because pirates always target the most expensive release.</p>
      <p>In other words, the people who want to pay the reassuringly high price and the people who spend their time acquiring the free - each end up with the same product! In software, second place means obscurity.</p>
      <p>It is hypocritical when Adobe or Microsoft complain about pirates, because when pirates take Adobe or Microsoft products, it is their competitor who loses money!</p>
      <p>There are some people in the middle, who might be smarter or more honest, and who would probably love a book that explains how to use their purchases.</p>
      <p>Returning to the book, is the target audience computer-based?</p>
