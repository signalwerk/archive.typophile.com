    <p>Hi all,</p>
    <p>I'm currently creating a cover for a new design book, which will act as a handbook for designers needing to produce great creative work with very small budgets.</p>
    <p>To avoid hypocrisy, the designer of the book needs to create it at low cost. This involves using a free typeface!</p>
    <p>Any good suggestions?</p>
