    <p>Today we celebrate the launch of Typophile, on April 16th, 2000. Hard to believe it's already been 13 years, and still going strong! We certainly wouldn't be here without the ongoing support and activity of this awesome community. </p>
    <p>Happy Birthday everyone!</p>
