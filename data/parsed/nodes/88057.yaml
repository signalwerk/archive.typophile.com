    html: |-
      <p>&gt;Good point Nick. Postscript fonts work on the "5-3-3" rule for proper naming. I can anticipate the issues with font names less and 5 characters long to begin with.</p>
      <p>I'm working on a new family of fonts with a multitude of weights and variations.</p>
      <p>I've studied what other type designers are utilizing for font naming schemes and solutions.</p>
      <p>TypeName-A SER 500, Typename-B SLB 600, and so forth (A, B, etc could imply variations in body proportions, or whatever).</p>
      <p>Question: Is this a good idea or practice? I mean using hyphens, and other such stuff?</p>
      <p>I like the idea of using acronym to shorten and abbreviate words like "Serif" or "Slab", etc.</p>
      <p>I'm currently trying to figure out my own strategies going forward.</p>
      <p>It would be interesting to hear what others think on the matter.</p>
      <p>Any ideas or suggestions welcome. Thank you.</p>
