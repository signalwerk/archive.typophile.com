      <p>I love "Plaxo." It works with the font. </p>
      <p>But to get back to the original debate, one of the most respected and influential alternative rock bands on the current music scene -- Radiohead -- stole their name from the title of a 1986 Talking Heads song. Catherine Wheel (the band) lifted its name from the title of a 1981 Twyla Tharp dance piece. Even the Rolling Stones riffed their name from an old Muddy Waters song. I'm sure there are many other examples of this kind of artistic "homage." </p>
      <p>I'm not sure what the legal precedent might be if you employ the name "Metalica" for a font family that could never be confused with a metal band -- especially since you've spelled your family with one "L" and the band spells its name with two. But if you like the name, you might consider consulting an intellectual property attorney before abandoning it.</p>
      <p>~ K.</p>
