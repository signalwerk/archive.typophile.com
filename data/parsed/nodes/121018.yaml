    <p>The Vtg Stencil series of fonts from astype are based on real world stencils. Vtg Stencil Germany No. 101 is modeled after historic stencil plates from Bavaria.</p>
    <p>These stencils are a unique find. The unevenness of the single plates suggest that they were not produced industrially. The design itself, a blackletter chancery, is a romantic reprise of a style that was common in German writing offices from the 14th to the 16th century. The flourishes stylistically quote the Baroque period. A talented mind, perhaps around 1890, has transformed the textura shapes into a modular stencil system.</p>
    <p>Overall, this decorative blackletter doesn't look like a stencil design. Maybe it was originally used by a sign painter, and all the typical stencil bridges would have been painted over in the final work.</p>
    <p>If you're looking for a decorative blackletter font with a unique touch and a romantic feel, you will love Germany No.101.</p>
    <p>The font is avilable at <a class="freelinking external" href="http://www.myfonts.com/fonts/astype/vtg-stencil-germany-no101/?refby=as " rel="nofollow"> myfonts</a> and <a class="freelinking external" href="http://astype.de/font_v_vtg_stencil_germany_no101.php?fontname=vtgstencilgermanyno101 " rel="nofollow"> astype</a>.</p>
    <p><a class="freelinking external" href="http://www.astype.de/s/specimen/VtgStencilGermanyNo101_web.PDF " rel="nofollow"> specimen</a> pdf</p>
