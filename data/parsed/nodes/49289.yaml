    html: |-
      <p>Answer #1<br>
      - Click on "My Account" in the right-hand column<br>
      - Click on "Edit" in the black bar<br>
      - Scroll down until you see "Picture"<br>
      - Upload your image following the given instructions</p>
      <p>Answer #2<br>
      - 450 Pixels wide</p>
      <p>Answer #3<br>
      - Click on "Edit" in the black bar<br>
      - Scroll down to "Attach new file:"<br>
      - Click on "Choose File"<br>
      - Choose your file and follow the remaining instructions.<br>
      Note: The creator (and moderators) can always edit the original thread to modify the text and/or add images/PDFs.</p>
      <p>Answer #4<br>
      - Start a new thread</p>
