  html: |-
    <p>I need some help and directions about how to go doing the following. Can anyone help me please.</p>
    <p>1. How do I insert an icon for my ID in Typophile?</p>
    <p>2. Which is the ideal size in mm and resolution for inserting / posting images?</p>
    <p>3. How do I post a PDF file in a thread (instead of an image - which is the default type)?</p>
    <p>4. I have sent a typeface for critiqe under a preliminary name (Thetis) and now I want to alter to another one (Semele) which is the final name, do I start a new thread under the final name? Do I contact the Typophile webmaster for that? What would you advise that I should do?</p>
  html_clean: |-
    <p>I need some help and directions about how to go doing the following. Can anyone help me please.</p>
    <p>1. How do I insert an icon for my ID in Typophile?</p>
    <p>2. Which is the ideal size in mm and resolution for inserting / posting images?</p>
    <p>3. How do I post a PDF file in a thread (instead of an image - which is the default type)?</p>
    <p>4. I have sent a typeface for critiqe under a preliminary name (Thetis) and now I want to alter to another one (Semele) which is the final name, do I start a new thread under the final name? Do I contact the Typophile webmaster for that? What would you advise that I should do?</p>
