      <p>&gt; <em>Whereas type design creates letters that must function under the broadest possible circumstance, lettering is created for the most narrow of applications.</em></p>
      <p>I feel this helps the novice designer to grasp the <em>difference</em> between designing (or selecting) a typeface for broad text applications and the approach one should consider when designing a logo, masthead or book cover. It is not an answer, but an attempt to bring about awareness. </p>
      <p>Though this topic is basically about advertising faces of the 1950s, I  believe Mark and Carl wanted to point out these major distinctions.</p>
      <p>Even when I was at Agfa-Compugraphic during the 1980s many of the designs were still offered as text, text/display and display (T, T/D, D).</p>
      <p>Carl Crossgrove's suggestion to show samples could also help in detailing differences between display, text and lettered designs prior  to digital fonts. Whether that should be added to this thread or a new one is strictly up to Carl's intent.</p>
