      <p>I am trying to find suitable samples regarding 1950s advertising typography. From what I recall seeing in books about that design period is common usage of sans serifs Futura, Helvetica, Univers and frequent use of Moderns such as Bodoni, Poster or Ultra Bodoni, <a href="http://www.identifont.com/show?60V" rel="nofollow">Craw Modern</a>, <a href="http://www.identifont.com/show?66N" rel="nofollow">Torino</a>, and slab serif/Egyptian variants like Craw Clarendon and Melior.</p>
      <p>Two giants of the period were <a href="http://ndm.si.edu/dfl/daily/mademoiselle.htm" rel="nofollow">Bradbury Thompson</a> and Paul Rand. Here's a site that thumbnails samples along a <a href="http://www.101010.it/storiagrafica/1950.html" rel="nofollow">timeline from 1950 -- 1998</a>. I'm sure there are better samples out there.</p>
