      <p>I just wanted to bring up James Montalbano's personal view on lettering found on the <a href="http://www.terminaldesign.com" target="new" rel="nofollow">Terminal Design</a> web site:</p>
      <p><strong>Lettering vs. Type Design</strong></p>
      <p>"Lettering is, in many ways, the opposite of type design. Whereas type design creates letters that must function under the broadest possible circumstance, lettering is created for the most narrow of applications. A word or phrase, be it a logo or a book jacket, is custom tailored to work in that environment alone. Every letter drawn to fit perfectly within it’s own small world. Even lettering that at first looks like typography, has been custom tailored letter-by-letter, and space by-space to work perfectly."</p>
