      <p>&gt; <em>and it was very common for ads to have hand-lettered headlines—I would say even the majority.</em></p>
      <p>Mark, that's absolutely true. If we were to divide "American advertising" of the mid-nineteen-fifties, you would have <em>high design</em> style such as Bradbury Thompson, a huge <em>mid-range</em> and off course, <em>schlock</em>.</p>
      <p>Handlettering was prevalent in use before the 50s because offset photo-lithography became the common and inexpensive means of printing and therefore affordable to most advertisers. By 1955, New York City became the mecca of lettering artists with an estimated 300 professionals employed. <a href="http://www.stbride.org/conference2003/proceedings2003/phototype.html" target="new" rel="nofollow">(Please read Peter Bain's great article on phototype.)</a></p>
      <p>Photolettering, Inc. (PLINC) in New York, was quickly building one of the largest libraries of phototype, with a stable of fledgling and veteran lettering artist such as Vinny Pacella, Vic Caruso and Ephram Benguiat.</p>
      <p>Beautiful scripts and brush lettering abounded, and a popular treatment during the 50s was "Frisky" headlines (<a href="http://www.myfonts.com/search?search%5Btext%5D=frisky" rel="nofollow">bouncing and rotated baselines)</a>.</p>
      <p>Also, after Sputnik, the "Space Age" style became popular as well.<br>
      Believe it or not, Myfonts.com has a category of <a href="http://www.myfonts.com/browse/keyword/1950s/" rel="nofollow">1950s type suggestions</a>.</p>
