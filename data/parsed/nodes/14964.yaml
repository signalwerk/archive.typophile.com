      <p><em>and it was very common for ads to have hand-lettered headlines—I would say even the majority.</em></p>
      <p>Recently, in poring over a stack of magazine ads from LIFE, LOOK and other magazines from that period (1946-59), I noted this very fact. Almost none of the larger color ads used type for headlines. The lettering artists apparently had tons of work, since every car, orange juice, diamond, washing machine, brandy, and shoe had not only the unctuous body copy but an accompanying headline, sometimes lettered in a refined display version of the text face. There are some wonderful, slightly loose hand-lettered versions of grotesk sans and modern romans in those headlines. The best source for those same styles now would be PLINC, or House Industries, the library's guardians. Perhaps they would set a headline for you, or maybe they could hand-letter it. John Downer is also versed in several of those advertising styles. He does hand-lettering. </p>
      <p>&gt; TRUMPETS &lt; Please support your local hand-lettering artist! </p>
      <p>It's interesting to realize that at that time, graphic artists were clearly able to discern the issues separating display and text sizes of type. Not much is left of that awareness now.</p>
