    html: <p>I would remove Helvetica from Norbert's list (released the late fifties, but didn't become common until the sixites). I would add Venus (especially Venus Extended), News Gothic/Trade Gothic, Alternate Gothic, Century Schoolbook, Century Expanded, Baskerville, Caslon 540, Stymie, Futura Display, Bauer Topic, Onyx, Brush Script, Latin, Playbill, Balloon, Flash Script... and it was very common for ads to have hand-lettered headlines--I would say even the majority. There are some fonts around that simulate some of the lettering styles used then. I would suggest the book All American Ads of the '50s (Taschen) to get a better idea what to look for.</p>
    html_clean: <p>I would remove Helvetica from Norbert's list (released the late fifties, but didn't become common until the sixites). I would add Venus (especially Venus Extended), News Gothic/Trade Gothic, Alternate Gothic, Century Schoolbook, Century Expanded, Baskerville, Caslon 540, Stymie, Futura Display, Bauer Topic, Onyx, Brush Script, Latin, Playbill, Balloon, Flash Script... and it was very common for ads to have hand-lettered headlines--I would say even the majority. There are some fonts around that simulate some of the lettering styles used then. I would suggest the book All American Ads of the '50s (Taschen) to get a better idea what to look for.</p>
