  html: |-
    <p>P22 and the International House of Fonts announce the release of Lucilee by Michael Clark.</p>
    <p>Lucilee is a full-featured, OpenType script font from Michael Clark. It is a sweeping italic with many alternates, including ligatures, beginning and ending swashes, and a full Central European character set. This joining script is fluid and elegant and can be used for a wide variety of uses. Lucilee was designed with packaging in mind, but is well suited for titling and bold statements.</p>
    <p><a href="http://www.p22.com/ihof/lucilee.html" title="http://www.p22.com/ihof/lucilee.html">http://www.p22.com/ihof/lucilee.html</a></p>
