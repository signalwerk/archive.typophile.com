    html: |-
      <p>Couple of points:<br>
      • The pen angles on the <em>d</em> and <em>q</em> are different from the rest of the font; did you just mirror the <em>p</em>?<br>
      • The <em>k</em> is just odd but almost works.&nbsp; (What does it look like in the source text?)<br>
      • The <em>s</em> is too light in the main stroke of the letter.<br>
      • The <em>t</em> is very awkward; note the height of the cross-bar and the rounding-off of the bottom of the stem in the original.<br>
      • Where the original <em>o</em> has full-width stroke at either end of the stroke, yours just looks like somebody bit into the letter.<br>
      • The <em>v</em> is a bit too wide, the <em>y</em> and the right half of the <em>w</em> much more so.&nbsp; (Yes, I see that they're all the same width; they shouldn't be.)</p>
      <p>On the other hand…<br>
      • Good job on replacing the teardrop dot on the <em>i</em>, though the height and shape could be improved.&nbsp; (Maybe a slightly curve-y teardrop, almost a comma, a bit higher up?<br>
      • Love the <em>m</em>.&nbsp; This font needs more such flourishes—why'd you drop the dangling bit on the <em>r</em>?</p>
      <p>—Joel</p>
