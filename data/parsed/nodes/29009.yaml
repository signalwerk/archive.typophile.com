    html: <p>I think you’d be better off using Requiem with Whitney because they’re by the same designer. Those Requiem ligatures are such a cool concept but I wish there were more of them, like ‘gg’ or ‘ir’ would be tops.</p>
    html_clean: <p>I think you’d be better off using Requiem with Whitney because they’re by the same designer. Those Requiem ligatures are such a cool concept but I wish there were more of them, like ‘gg’ or ‘ir’ would be tops.</p>
