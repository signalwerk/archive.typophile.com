    html: "<p>&gt; I'm not prepared to pay an assistant for work that's not already backed by a committed client. <br> <br>Which is why a [committed] font house is a great substitute. <br> <br>&gt; it seems that \"carolingian\" half-serifs are rather uncommercial, aren't they? <br> <br>For text work, yes - there's too much lethargy. <br>But for display work it might be the other way around. I know a [relatively famous] French type designer who recently made a semi-serif even though he didn't want to, because there was high commercial demand for it. <br> <br>Syndor is too affected. Plus it leans backwards. <br> <br>BTW, I wouldn't call Karole carolingian - it's better than that. <br> <br>&gt;&gt; \"... this gives the eye the scanning time it needs for reading text at small sizes.\" <br> <br>Which is completely contrary to how we really read... I guess Smiejers has the talent/instinct to make a good text face (Quadraat) without really understanding reading. The danger is that -as he progresses- he might find such faulty theories subduing his original good direction. Which is exactly what happened with Dwiggins: he thought extenders contributed nothing to readability (which he was apparently confusing with legibilty), so he never made anything better than his early Electra. \"Things are at their best in their beginning\" - Pascal. <br> <br>&gt; .... Roman relies in large part on the baseline for stability and balance .... <br> <br>This is some interesting theorizing! <br>But to me it might exhibit a somewhat dangerous reliance on the display realm. <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; I'm not prepared to pay an assistant for work that's not already backed by a committed client. <br> <br>Which is why a [committed] font house is a great substitute. <br> <br>&gt; it seems that \"carolingian\" half-serifs are rather uncommercial, aren't they? <br> <br>For text work, yes - there's too much lethargy. <br>But for display work it might be the other way around. I know a [relatively famous] French type designer who recently made a semi-serif even though he didn't want to, because there was high commercial demand for it. <br> <br>Syndor is too affected. Plus it leans backwards. <br> <br>BTW, I wouldn't call Karole carolingian - it's better than that. <br> <br>&gt;&gt; \"... this gives the eye the scanning time it needs for reading text at small sizes.\" <br> <br>Which is completely contrary to how we really read... I guess Smiejers has the talent/instinct to make a good text face (Quadraat) without really understanding reading. The danger is that -as he progresses- he might find such faulty theories subduing his original good direction. Which is exactly what happened with Dwiggins: he thought extenders contributed nothing to readability (which he was apparently confusing with legibilty), so he never made anything better than his early Electra. \"Things are at their best in their beginning\" - Pascal. <br> <br>&gt; .... Roman relies in large part on the baseline for stability and balance .... <br> <br>This is some interesting theorizing! <br>But to me it might exhibit a somewhat dangerous reliance on the display realm. <br> <br>hhp <br></p>"
