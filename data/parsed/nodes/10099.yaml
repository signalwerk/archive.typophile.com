    html: "<p>Rodolfo, this is very nice - although I do have a weakness for semi-serifs. There's a bit of Unger, a bit of Granjon, and a bit of Times in there. But the result is totally original. <br> <br>I won't go into specific glyphs (yet). What I'd point out is that I think you need to make some text versus display decisions here (as you're already prepared to do, it seems). For example, the Sharp and the Hard are very well suited to display work (at large and moderate sizes, respectively), so the narrowness is right on. I agree that the color and contrast of the Soft make it the most suitable for text (while maintaining that rigidity I for one find priceless), but there the degree of narrowness will act against readability too much. <br> <br>The other thing I'd point out is that you're <i>mostly</i> avoiding the classic problem with semi-serifs: backslant. The delicacy of your serifs helps. But do consider putting slight swells* on the other sides of the semi-serifs, especially in the display cuts. <br> <br>* But definitely not mushy ones like in Avance. Look at FF Profile, or maybe Proforma. <br> <br>hhp <br></p>"
    html_clean: "<p>Rodolfo, this is very nice - although I do have a weakness for semi-serifs. There's a bit of Unger, a bit of Granjon, and a bit of Times in there. But the result is totally original. <br> <br>I won't go into specific glyphs (yet). What I'd point out is that I think you need to make some text versus display decisions here (as you're already prepared to do, it seems). For example, the Sharp and the Hard are very well suited to display work (at large and moderate sizes, respectively), so the narrowness is right on. I agree that the color and contrast of the Soft make it the most suitable for text (while maintaining that rigidity I for one find priceless), but there the degree of narrowness will act against readability too much. <br> <br>The other thing I'd point out is that you're <i>mostly</i> avoiding the classic problem with semi-serifs: backslant. The delicacy of your serifs helps. But do consider putting slight swells* on the other sides of the semi-serifs, especially in the display cuts. <br> <br>* But definitely not mushy ones like in Avance. Look at FF Profile, or maybe Proforma. <br> <br>hhp <br></p>"
