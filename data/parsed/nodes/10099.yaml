    html: "<p>&gt; But the drill work involved in making a complete face bores me big time. <br> <br>Some font houses are willing to apply their in-house designers towards the completion of a promising font, although your cut of any profits would go down. <br> <br>&gt; You know I like Times, don't you? <br> <br>I like it too, but only for display. <br> <br>&gt; Smeijers's theory <br> <br>It doesn't make sense, because we read boumas, and that relies on tight spacing. Loose spacing is in fact the main weakness in Eureka and Rotis. Smeijers might be talking about very small sizes? There greater letterspacing is indeed more important, but so is large apparent size: if you save horizontal space through narrowness, you'll need to make it up through a larger point size. <br> <br>The general view concerning narrowness is that it causes a drop in legibility through decreased decipherability of individual letters, but that's also misguided. The real problem is two-fold: <br>1) Bouma decipherability relies heavily on the overall width of the silhouette, and narrowness causes a decrease in the absolute difference of width in the lexicon of boumas. In the parafovea, the best way to tell apart \"dearly\" and \"dastardly\" for example is through their width primarily (and the second \"d\"'s ascender secondarily). <br>2) Too much narrowness also puts a given bouma too far outside familiarity. <br> <br>BTW, do you think Patria is wide or narrow? <br>You might be surprised that it's more economical than Times... The trick is the massive counters. On the other hand, that has a certain bad effect in the subvisible realm. <br> <br>&gt; mostly with flat-foot half-serifs <br> <br>Wouldn't serifs rotated counter-clockwise actually cause <i>more</i> of a problem? <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; But the drill work involved in making a complete face bores me big time. <br> <br>Some font houses are willing to apply their in-house designers towards the completion of a promising font, although your cut of any profits would go down. <br> <br>&gt; You know I like Times, don't you? <br> <br>I like it too, but only for display. <br> <br>&gt; Smeijers's theory <br> <br>It doesn't make sense, because we read boumas, and that relies on tight spacing. Loose spacing is in fact the main weakness in Eureka and Rotis. Smeijers might be talking about very small sizes? There greater letterspacing is indeed more important, but so is large apparent size: if you save horizontal space through narrowness, you'll need to make it up through a larger point size. <br> <br>The general view concerning narrowness is that it causes a drop in legibility through decreased decipherability of individual letters, but that's also misguided. The real problem is two-fold: <br>1) Bouma decipherability relies heavily on the overall width of the silhouette, and narrowness causes a decrease in the absolute difference of width in the lexicon of boumas. In the parafovea, the best way to tell apart \"dearly\" and \"dastardly\" for example is through their width primarily (and the second \"d\"'s ascender secondarily). <br>2) Too much narrowness also puts a given bouma too far outside familiarity. <br> <br>BTW, do you think Patria is wide or narrow? <br>You might be surprised that it's more economical than Times... The trick is the massive counters. On the other hand, that has a certain bad effect in the subvisible realm. <br> <br>&gt; mostly with flat-foot half-serifs <br> <br>Wouldn't serifs rotated counter-clockwise actually cause <i>more</i> of a problem? <br> <br>hhp <br></p>"
