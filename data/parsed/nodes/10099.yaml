    html: "<p><i>BTW, I wouldn't call Karole carolingian - it's better than that.</i>  <br>  <br>I don't know if it's \"better\", but certainly it's not really a   <br>\"carolingian face\". This was just a way of subclassifying   <br>the larger field of half-serifs, based on how the serifs work.  <br>  <br><i>This is some interesting theorizing! But to me it might   <br>exhibit a somewhat dangerous reliance on the display realm.</i>  <br>  <br>Most certainly. In small text sizes things may be the opposite.  <br>As we've talked about once, in small text sizes we're in a   <br>quantum-mechanical world: all our macroscopic intuition may  <br>break down.</p>"
    html_clean: "<p><i>BTW, I wouldn't call Karole carolingian - it's better than that.</i>  <br>  <br>I don't know if it's \"better\", but certainly it's not really a   <br>\"carolingian face\". This was just a way of subclassifying   <br>the larger field of half-serifs, based on how the serifs work.  <br>  <br><i>This is some interesting theorizing! But to me it might   <br>exhibit a somewhat dangerous reliance on the display realm.</i>  <br>  <br>Most certainly. In small text sizes things may be the opposite.  <br>As we've talked about once, in small text sizes we're in a   <br>quantum-mechanical world: all our macroscopic intuition may  <br>break down.</p>"
