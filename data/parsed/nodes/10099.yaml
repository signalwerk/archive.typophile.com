    html: "<p><i>Some font houses are willing to apply their in-house designers towards    <br>the completion of a promising font, although your cut of any profits would    <br>go down.</i>   <br>   <br>In that case maybe that's what an assistant is for, right? Only, I'm   <br>not prepared to pay an assistant for work that's not already backed   <br>by a committed client. On the other hand, it seems that \"carolingian\"   <br>half-serifs are rather uncommercial, aren't they? Has anyone ever seen    <br>a real-world usage of Syndor? I have not.   <br>   <br><i>&gt; Smeijers's theory    <br>   <br>It doesn't make sense, because we read boumas, and that relies on tight    <br>spacing. Loose spacing is in fact the main weakness in Eureka and Rotis.    <br>Smeijers might be talking about very small sizes? There greater    <br>letterspacing is indeed more important, but so is large apparent size:    <br>if you save horizontal space through narrowness, you'll need to make it    <br>up through a larger point size.</i>    <br>   <br>The \"theory\" boils down to one caption (on page 139): \"we tend to assume   <br>that a typeface for a small body needs to be wider than one for a larger    <br>body. Haultin doesn't follow this rule. Instead he justified small characters   <br>rather widely, and this gives the eye the scanning time it needs for reading   <br>text at small sizes.\"   <br>   <br><i>BTW, do you think Patria is wide or narrow?</i>   <br>   <br>I'll have to check again.   <br>   <br><i>&gt; mostly with flat-foot half-serifs    <br>   <br>Wouldn't serifs rotated counter-clockwise actually cause more of a problem?</i>   <br>   <br>No, I believe, because of our cultural frame of references and some   <br>important differences in the way roman and italics work (I'm talking    <br>about \"conventional\" serif faces here). Roman relies in large part    <br>on the baseline for stability and balance. You can call that static    <br>equilibrium. Italics, on the other hand, has a sort of \"dynamic    <br>equilibrium\" (isn't this perhaps the most important difference between    <br>them?), even though it's of course also sitting on a virtual baseline.    <br>When you have a \"flat-foot\" (roman) half-serif it seems as if the glyph's    <br>center of gravity isn't quite supported by the base and it tends to fall.    <br>The same effect doesn't happen in a \"carolingian\" half-serif as the base    <br>is not what supports it to begin with. Also the serifs angle provide a  <br>sort of southwest-northeast thrust to the stems that helps to keep   <br>them afloat.    <br>   <br>BTW, this kind of investigation was one of my interests here.</p>"
    html_clean: "<p><i>Some font houses are willing to apply their in-house designers towards    <br>the completion of a promising font, although your cut of any profits would    <br>go down.</i>   <br>   <br>In that case maybe that's what an assistant is for, right? Only, I'm   <br>not prepared to pay an assistant for work that's not already backed   <br>by a committed client. On the other hand, it seems that \"carolingian\"   <br>half-serifs are rather uncommercial, aren't they? Has anyone ever seen    <br>a real-world usage of Syndor? I have not.   <br>   <br><i>&gt; Smeijers's theory    <br>   <br>It doesn't make sense, because we read boumas, and that relies on tight    <br>spacing. Loose spacing is in fact the main weakness in Eureka and Rotis.    <br>Smeijers might be talking about very small sizes? There greater    <br>letterspacing is indeed more important, but so is large apparent size:    <br>if you save horizontal space through narrowness, you'll need to make it    <br>up through a larger point size.</i>    <br>   <br>The \"theory\" boils down to one caption (on page 139): \"we tend to assume   <br>that a typeface for a small body needs to be wider than one for a larger    <br>body. Haultin doesn't follow this rule. Instead he justified small characters   <br>rather widely, and this gives the eye the scanning time it needs for reading   <br>text at small sizes.\"   <br>   <br><i>BTW, do you think Patria is wide or narrow?</i>   <br>   <br>I'll have to check again.   <br>   <br><i>&gt; mostly with flat-foot half-serifs    <br>   <br>Wouldn't serifs rotated counter-clockwise actually cause more of a problem?</i>   <br>   <br>No, I believe, because of our cultural frame of references and some   <br>important differences in the way roman and italics work (I'm talking    <br>about \"conventional\" serif faces here). Roman relies in large part    <br>on the baseline for stability and balance. You can call that static    <br>equilibrium. Italics, on the other hand, has a sort of \"dynamic    <br>equilibrium\" (isn't this perhaps the most important difference between    <br>them?), even though it's of course also sitting on a virtual baseline.    <br>When you have a \"flat-foot\" (roman) half-serif it seems as if the glyph's    <br>center of gravity isn't quite supported by the base and it tends to fall.    <br>The same effect doesn't happen in a \"carolingian\" half-serif as the base    <br>is not what supports it to begin with. Also the serifs angle provide a  <br>sort of southwest-northeast thrust to the stems that helps to keep   <br>them afloat.    <br>   <br>BTW, this kind of investigation was one of my interests here.</p>"
