  html: <p>Dear typophiles,   <br>   <br>what follows is something I've done a few years ago    <br>as a kind of warm-up exercise before a very different    <br>job (which didn't turn out as expected BTW). I only    <br>did then part of the lowercase set (the easier glyphs ;),   <br>and five or six UC letters. Recently, I've come across    <br>these files again and wondered if it would be worth the    <br>trouble to revive and complete them.    <br>   <br>What do you think?   <br>   <br>   <br><img src="http://www.typophile.com/forums/messages/29/6871.gif" alt="karolehard.gif">   <br>   <br>There were three versions, which I'm calling <i>hard</i>,    <br><i>soft</i> and <i>sharp</i>. The <i>hard</i> version was the less    <br>incomplete, so it's the only one I'm displaying here.    <br>The <i>soft</i> version would naturally be the one more    <br>appropriate for text (well, would it?). I compare   <br>the three below.   <br>   <br>   <br><img src="http://www.typophile.com/forums/messages/29/6872.gif" alt="karoletrio.gif">   <br>   <br>   <br>The <i>soft</i> version is of course the most difficult and    <br>demanding. I had a vision of how it should be, but    <br>haven't been competent enough to do it back then    <br>(or rather I didn't invest the necessary time on it).    <br>But I guess <i>sharp</i> was the sexiest baby to me. ;)   <br>   <br>   <br>   <br><img src="http://www.typophile.com/forums/messages/29/6873.gif" alt="karolesharp.gif">   <br>   <br>   <br>General or specific comments are welcome.   <br>   <br>Thanks.</p>
