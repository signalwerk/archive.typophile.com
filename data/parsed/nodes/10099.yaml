  - id: 64153
    user: 1250
    date: 2003-02-25T12:33:00
    date_raw: 25 Feb 2003 — 12:33pm
    votes: null
    html: <p>&gt; what kind of lethargy? <br> <br>In this case, the kind that says that only the conventional serif structure works for text, and/or anything between a full-serif and a sans can never be serious. In reality though, serifs are not "appendages", they are very much structural elements (scary but true), so the presence/absense of a give serif (or half-serif) needs to derive from readability, not how dead people used the pen, or how your teacher taught you to draw pretty fonts. <br> <br>In another case, the kind that says that the bowls of the "bdpq" must have the same structure - while the truth (as far as text faces are concerned) is exactly the opposite. <br> <br>hhp <br></p>
    html_clean: <p>&gt; what kind of lethargy? <br> <br>In this case, the kind that says that only the conventional serif structure works for text, and/or anything between a full-serif and a sans can never be serious. In reality though, serifs are not "appendages", they are very much structural elements (scary but true), so the presence/absense of a give serif (or half-serif) needs to derive from readability, not how dead people used the pen, or how your teacher taught you to draw pretty fonts. <br> <br>In another case, the kind that says that the bowls of the "bdpq" must have the same structure - while the truth (as far as text faces are concerned) is exactly the opposite. <br> <br>hhp <br></p>
