    html: "<p><i>The only thing that I would like to ask you is that your l/c (k)    <br>don't need a cursive terminal on the leg of the letter? like you    <br>use on the stroke of the same letter</i>   <br>   <br>Ricardo: well, that would be a different design. I like the contrast   <br>when the shapes, instead of acknowledging the pen, suddenly seem   <br>to acknowledge the brush (thus annoying Hrant even more ;).   <br>   <br><i>i looked at it again, and now i realize that hard k seems very    <br>different (the arms' proportions) from sharp k. i think sharp k    <br>is ok. but hard k still bothers me: doesn't it look too wide in    <br>\"ikko tanaka\"?</i>   <br>   <br>Maybe, Eduardo - isn't that an image artifact? I think it's more or    <br>less the same. The \"sharp\" version is lighter, in any case.   <br>   <br>It seems that this k is somewhat polemic. Just to give the due    <br>credit: its design is partly derived from the famous gala portrait    <br>of Louis XIV by Hyacinthe Rigaud. Look it up and you'll see how.  ;)</p>"
