    <p>Wondering if someone can tell me how to make a 'faded' effect on some text.</p>
    <p>Following up on a font that was ID'd here:</p>
    <p><a class="freelinking external" href="http://dv3.typophile.com/node/72910" rel="nofollow">http://dv3.typophile.com/node/72910</a></p>
    <p>How would I go about getting that faded effect on the font. Not sure what that would be called - grunge, eroded, faded. </p>
    <p>It would be great if I could do that in indesign, but not sure how.<br>
    I have CS5 so I can use other programs as well.</p>
    <p>Thanks!</p>
