    html: |-
      <p>If you want to do it as vector...</p>
      <p>1. Get some acetate and distress in whatever fashion you prefer. Scratch...ink...wrinkle...<br>
      1a. You can photocopy/print textures onto acetate too...</p>
      <p>2. Scan this in and adjust the colour and the levels until you get the image some black and white griminess<br>
      3. Import into illustrator and Live Trace, expand and release the paths<br>
      4. Scale this until the crappy pathing is acceptable<br>
      5. Punch cut across your glyphs</p>
      <p>Usually I can't condone illustrator live tracing, but as your willfully distressing the face, it seems acceptable. You will get a horrendous amount of points in play using this method.</p>
      <p>Edit.<br>
      Thinking about it, I bet there's already prepped distress illustrator textures on the interweb. Although you will miss out on the fun destruction of acetate.</p>
