    html: |-
      <p>One quick, simple way with a black background:</p>
      <p>1. Set your type in white.<br>
      2. Create a new layer, fill it with 50% black.<br>
      3. Add a lot of noise.<br>
      4. Use Gaussian Blur to create clumps.<br>
      5. Copy this layer, load the type as a Selection, and Paste your clumps Into the Selection.</p>
      <p>There are many other methods, of course...</p>
