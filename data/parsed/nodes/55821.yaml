  html: |-
    <p>When all-caps and bold isn't enough.</p>
    <p>I want to make characters exclusively from combining characters and box-drawing characters.</p>
    <p>The problem encountered is that diagonal lines (and therefore glyphs which normally require diagonal lines) are difficult to render appealingly. V? X? K? Z? How should I go about 'making' these using box-drawing characters and combining characters, while maintaining visual appeal?</p>
