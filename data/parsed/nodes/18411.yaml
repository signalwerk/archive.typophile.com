  html: |-
    <p>Hi all,<br>
    is there a typographical term in English for “a document overladen with running text, which make it difficult to read due to low line spacing and a lack of paragraphs”. In German this is called “Bleiwüste” (literally: desert of hot type).</p>
    <p>Thanks</p>
