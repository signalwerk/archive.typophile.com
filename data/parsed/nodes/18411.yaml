      <p>I’ve often heard (and used) the term “<em>agoraphobic</em>” applied to metaphorically imply the design lacks white space. (Agoraphobia being the part of social anxiety panic disorder that keeps people confined to their homes, characterized by the <em>fear of open spaces</em>).</p>
      <p>But that’s probably just as obtuse as using the German term <em>Bleiwüste</em>!</p>
