    <p>Hi, this is my first post but I wonder if anyone can help me identify this font? <a href="http://www.letterpress.co.uk/uploads/eloise_big.jpg" title="http://www.letterpress.co.uk/uploads/eloise_big.jpg">http://www.letterpress.co.uk/uploads/eloise_big.jpg</a><br>
