      <p>“closely based on Bitstream’s Prima”: <a href="http://en.wikipedia.org/wiki/Bitstream_Vera" title="http://en.wikipedia.org/wiki/Bitstream_Vera">http://en.wikipedia.org/wiki/Bitstream_Vera</a></p>
      <p>AFAIK you are allowed, according to the Vera font license, to make your own medium weight, as long as you don’t call it Vera $SOMETHING. The Fontographer “Blend Fonts” feature comes in handy for that (use normal and bold weight). Check your Vera license to see exactly what you are allowed to (IANAL). Andreas</p>
