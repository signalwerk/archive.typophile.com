      <p>Better yet, you could do it with Deja Vu Sans (another Vera derivative <a href="http://en.wikipedia.org/wiki/DejaVu_fonts" title="http://en.wikipedia.org/wiki/DejaVu_fonts">http://en.wikipedia.org/wiki/DejaVu_fonts</a>) and share it back with the world! :-)<br>
      That said, you can try to obtain a “medium” look just adding a thin stroke to the regular weight using the desktop publishing app of your choice.</p>
