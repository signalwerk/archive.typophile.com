    html: |-
      <p>A laptop often gets used in environments with lighting outside your control, so to me a glossy screen is bad news. I have no personal long-term experience with anti-glare add-ons - that could be a good solution. The 17.3" Dell Precision I've been looking at getting has a 1920×1080 matte display, and it's great.</p>
      <p>Most people want a glossy screen for the same reason they want a 16:9 aspect-ratio: they watch movies. Type design is sort of diametrically opposed to watching movies.  :-)</p>
      <p>hhp</p>
