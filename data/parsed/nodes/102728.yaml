    html: |-
      <p>I have a 15" MacBook Pro with the optional antiglare screen and love it. The resolution makes UI elements smaller but for me it hasn't been a problem, but I suppose that can vary depending on the application you're using. But most folks these days seem to want a glossy screen as it has deeper blacks and other advantages. </p>
      <p>As Mark says, controlling lighting and position can help. Also I've seen some folks buy (or make) a black screen hood to block overhead lights and side lights.</p>
