    <p>Hello all,</p>
    <p>I recently purchased a Macbook Pro and went for the antiglare screen – unfortunately it only comes in high resolution (not Retina) and there was no way to scale up the UI elements without compromise of quality... I exchanged it for normal glossy screen.</p>
    <p>I'm looking for solutions to decrease glare and have read some reviews of various options; however I'm concerned about the loss of quality (blurriness, prismatic effect) with respect to doing type design. </p>
    <p>What are your experiences? Does a anti-glare film decrease the quality enough introduce problems – i.e. for proofing text and so on.</p>
    <p>Thanks</p>
