    <p>Hi Folks,<br>
    This sample was sent to me for an ID and I said the closest I could find was<a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11004.8.4&amp;attributes.sampleSize=48&amp;sampleText=Gnostech&amp;sampleSize=48"> FF Transit Back Positive Italic</a>. Then I suggested graphic widening to get closer, but I know how we all hate those answers, so I was hoping someone might recognize the font. </p>
    <p>Thanks,  - Mike</p>
