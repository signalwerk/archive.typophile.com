    <p>Hi, I remember there used to be an archive of the old MSN FontLab group that had specific settings for illustrator and fontlab when importing files from illustrator.</p>
    <p>I cannot find those old tips and I see that that forum is gone on MSN - though that was for an older version of fontlab. Are there similar settings for illustrator CS and fontlab 5.0?</p>
    <p>If not, can anyone give me suggestions for H/W dimensions for inside illustrator for creating glyphs?</p>
    <p>Any help or feedback appreciated</p>
