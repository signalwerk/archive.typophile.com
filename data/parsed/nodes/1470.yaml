    html: "<p>On 39 alt. It does say the most about typoﬁle, and is in that sense most complete, as Christos has pointed out.  <br><br>But completeness is not always an aesthetic virtue. In drama one of the ways that dialogue fails is being “on the nose”:  <br>it says exactly what the character is thinking, which people rarely do in life.  <br><br>I think 39 is too ‘on the nose’. Also the multiple perspective ‘T’ is awkward looking. <br><br>In the context of a ‘T’ it seems to me that being visually exciting and causing the viewer to ask ‘What’s that about?’ is&nbsp;preferable.    </p>"
    html_clean: "<p>On 39 alt. It does say the most about typoﬁle, and is in that sense most complete, as Christos has pointed out.  <br><br>But completeness is not always an aesthetic virtue. In drama one of the ways that dialogue fails is being “on the nose”:  <br>it says exactly what the character is thinking, which people rarely do in life.  <br><br>I think 39 is too ‘on the nose’. Also the multiple perspective ‘T’ is awkward looking. <br><br>In the context of a ‘T’ it seems to me that being visually exciting and causing the viewer to ask ‘What’s that about?’ is&nbsp;preferable.    </p>"
