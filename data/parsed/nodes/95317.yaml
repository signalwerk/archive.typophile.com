      <p>How do you know how many apps or ebooks will be sold? Should the publisher tell you this after each year and you will charge then?</p>
      <p>From a user’s perspective I really like the FSI way of having an app license but not having it based on sales at all: <a href="http://www.mobilefontfonts.com" title="http://www.mobilefontfonts.com">http://www.mobilefontfonts.com</a></p>
