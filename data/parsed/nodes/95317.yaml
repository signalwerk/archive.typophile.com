  html: |-
    <p>What would you consider a reasonable price for embedding fonts in apps and ebooks?</p>
    <p>I think units sold per month is a good way to determine the price, because it differentiates between small and big publishers, and if someone starts selling big all of a sudden they can purchase a new license. My gut feeling is that something like 50, 500 and 5000 units sold per month would cover most cases. What would you consider a reasonable price (for one style)?</p>
