  html: <p>I find the K in most web fonts to be one of the least attractive letters yet have a blog with a name beginning with a K. I am looking to change my current title font, Pupcat, to something with a similar retro feel but a nicer k, and something that will look good used alongside Trebuchet. So far the only possible font I have identified is Bistro Script. I would really welcome some other suggestions. Thank you.</p>
comments:
  - id: 538025
    user: 48268
    date: 2013-01-15T03:57:00
    date_raw: 15 Jan 2013 — 3:57am
    votes: null
    html: <p>I am not sure if these would suit your blog (though I think so), but having re-read a recommendation from Hrant elsewhere on the site, the Ks (upper and lower) in <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/fontfont/ff_pitu_pro/" rel="nofollow">FF Pitu</a> are beautiful! I am also a big fan of Monokrom's designs, <a href="/wiki/https%3A/%252Fmonokrom.no/fonts/faunus" class="freelinking" rel="nofollow">Faunus</a> and <a href="/wiki/https%3A/%252Fmonokrom.no/fonts/satyr" class="freelinking" rel="nofollow">Satyr</a>. Finally, a little less conventional, with a slant to the left, I really like <a class="freelinking external" href="http://www.fontshop.com/fonts/designer/mark_fromberg/" rel="nofollow">Canary by Mark Frömberg</a>.</p>
  - id: 538088
    user: 207047
    date: 2013-01-15T11:36:00
    date_raw: 15 Jan 2013 — 11:36am
    votes: null
    html: <p>Given the 60s aesthetic of the font you currently use and your interest in Bistro Script, I thought maybe <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/sudtipos/hipster_script_pro/" rel="nofollow">Hipster Script Pro</a>, <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/flatit_type_foundry/sneaker_script_ot/" rel="nofollow">sneaker script</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/mawns/channel/" rel="nofollow">channel</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/jbfoundry/old-french-school/bold-italic/" rel="nofollow">old french school</a></p>
