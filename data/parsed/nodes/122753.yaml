    html: <p>Even though I am not from Britain (but from its neighbour to the east), I think the political party visual identities are rather nice over there. The trend of flat design has certainly hit the party headquarters in Britain. Labour use Neo Sans as their main font.  The Tories apparently use Futura as their new font (a departure from Lucida Sans and Franklin Gothic).  UKIP use Interstate and The LibDems use Helvetica. Don't care about SNP... Separatists.</p>
