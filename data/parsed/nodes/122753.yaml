    html: |-
      <p>No specific problem with the font choice - it's readable, clean and modern as reflects their (self-)image. Given their financial problems, I'm not entirely startled to see them using a freebie font - at least they picked a well-designed one. I'm not too keen on those apostrophes, though, and the spacing around the top 'r's' looks very off.  Not awful, but the whole thing is lacking in flair.</p>
      <p>And using a generic font is a mistake, as you say, for any organisation that expects to be mocked and parodied. Anything that helps pranksters create fake Labour posters easily is a big mistake. </p>
      <p>The Tories (Britain's Conservative party) found this out the hard way last election - within days of their poster launch there was a <a class="freelinking external" href="http://mydavidcameron.com" rel="nofollow">website that let people make parody posters</a>.</p>
