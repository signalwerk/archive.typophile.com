      <p>hello Reetsde,</p>
      <p>i am native cyrillic reader, and generally i like your cyrillic. i disagree with Hrant about curved arms -- it is not any requirement at all. </p>
      <p>first of all, you need to draw a capital Д -- now you have Л on this place ))<br>
      your black seems almost good, but i think you need to reduce blackness in small ovals in в, ь, з and similar letters. м also looks too dark, and л looks too light for me.<br>
      i think you need make similar forms for upper and small Лл Дд and i like less rectangular form (like your lc). small descenders in д, Цц, Щщ in light and normal is far away from letter body, and ш and щ is too wide themselves. i think you need to double left vertical stem of л in д and make its conjunction with lower horizontal so curved. i'd like to see narrowed ю (like a Ю), wider Жж, higher Ф, and better balanced Зз.<br>
      can you try to add some upturn for acsender in б?</p>
      <p>sorry for my english, and good luck!</p>
