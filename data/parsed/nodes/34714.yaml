      <p>i'm no expert in Cyrillic, but a few things i noticed:</p>
      <p>the Д is completely wrong, it's missing the baseline and the descending strokes<br>
      it is very good that you didn't just double the К to make your Ж, but these two should share a similar structure. I might try adding the horizontal connecting stroke to your К.<br>
      The descending stroke on Ц and Щ is too short, IMO, as is the flag on Ъ.<br>
      the same comments apply to the lowercase and SC versions of these letters.<br>
      the vertical stroke of the Ф could benefit from overshooting the capline/baseline, esp in the heaviest weights.</p>
