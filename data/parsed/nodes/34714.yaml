      <p>Who said anything about "requirement"?</p>
      <p>Often, making certain parts of Cyrillic forms straight and not curved is a symptom of the desire to be more Western and less Russian. Quite ironically -as John H once astutely noted- natives tend to suffer from this more than outsiders (speaking more broadly than only concerning Cyrillic).</p>
      <p>hhp</p>
