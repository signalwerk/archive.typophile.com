      <p>I agree with not breaking up the url. I understand the thought behind visibility across distance, but bigger doesn't always mean better. Breaking up the url starts to diminish the recognition of it being a url in the first place. You want to keep the message simple, but breaking it up makes the person read the two parts, then mentally reconnect them on their own, it's not intuitive, even with the reenforcing of the complete url below it. You could also use a headline to promote the site instead of the url (i.e "Buy your music from the comfort of your home").</p>
      <p>As for the white mess, it doesn't help the guitar stand out (I hate the word "pop"), from the background because it actually overpowers the guitar. If the guitar has a black outline or something to that effect, then the shape recognition would be stronger and it would cause more contrast.</p>
      <p>Having the products offered layered so far in the back makes them become part of the background graphics, and no longer selling points. You could also use those with the icons for reenforcement.</p>
      <p>Overall, it's a little busy, you may want to remove some of the additional wisps of white in the background. I think the forefront ones work well, but the background ones start to over saturate the piece. You might also want to consider loosing the burgundy ring of fire.</p>
      <p>I'm sorry about your brief, I wish people knew how to write those. White, made of paper, and something you wipe you arse with doesn't tell me it's toilet paper, it could be anything.</p>
