    <p>Hello Typophiles,</p>
    <p>I am working on a print banner for an online music store.</p>
    <p>This banner will primarily function as a roll-out signboard when the client sets up a booth at bazaars, etc. Approximate dimensions: 850 x 2000mm (33 x 78 inches)</p>
    <p>The brief - Something bright, modern, fun, and visually attractive.<br>
    Key purpose - Draw customers (youth &amp; young adults) to his booth.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CN_01_4979.png"></div><p></p>
    <p>#1: Concepts revolve around a guitar motif. Flames &amp; light streams to convey the effect and energy that music can have on your life.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CN_02_5396.png"></div><p></p>
    <p>#2: I replaced the client's logo with a more prominent URL bar, with his approval.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CN_03_4354.png"></div><p></p>
    <p>#3: Added 3 little icons depicting 'Music', 'Gifts', 'Books' as requested.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CN_04_4167.png"></div><p></p>
    <p>#4: My latest design.<br>
    I received a call from him today, he now wants it vertically-oriented.<br>
    The icons seemed to detract from the overall feel, so I replaced them.<br>
    I feel that type alone is sufficient in communicating the products.</p>
    <p>Type: I've chosen Chaparral Bold as I think its friendly appearance works pretty well for the client.</p>
    <p>Your thoughts and comments will be appreciated, thanks!</p>
    <p>(First time ever posting a project online for critique &amp; comments. A little nerve wrecking!)</p>
