      <p>Make the b in books clearer.</p>
      <p>I'm not sure about the white behind the guitar. It looks like an area of colour has been scraped off and the rather harsh white which is meant to be a background element becomes the focus of the whole poster.</p>
      <p>I'd get rid of as much of that white area as possible, leaving something to outline the guitar, but then have the "books, music, gifts" in solid white.</p>
