      <p>It functions to help the guitar 'pop' off the background, since the colours are pretty complementary. I see your point though. I might try removing it just to see where that goes.</p>
      <p><cite>I would avoid breaking the url, especially one that creates a double letter when joined, the lower and uppercase oneliner works well.</cite></p>
      <p>Breaking the URL for the 'headline' allows it to be displayed in a larger size, helping to communicate the store's identity from a further distance in a crowded hall.</p>
      <p>But yeah, that is something that still bugs me, which is why I added the complete url in #4 - to reinforce the URL as a whole. I hope that mitigates the initial break.</p>
      <p>I'll have to think about revising the icons.</p>
      <p><cite>Don’t flames have a negative connotation for Christians?</cite></p>
      <p>I'm sure they may have a negative connotation, especially for the more conservative set. The client's audience (with this banner) is primarily youths to young adults who are fans of rock music. We believe they are more likely to associate flames with passion and energy, than fire and brimstone. :D</p>
      <p>Justin and Tim, thanks for taking time to share your thoughts.</p>
      <p>Cheers!</p>
