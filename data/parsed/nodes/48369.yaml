    <p>Proud papa here, showing off the card my daughter made for her friend’s 5th birthday. I had nothing to do with it. I don’t think I’ve ever shown her how to draw letters on an arc. She didn’t do it in pencil first. When she showed it to me it was done, and I was pretty amazed...I mean, how did she know where to put the B?  I couldn’t do that when I was 5.</p>
