      <p>I figured it's wise to follow some standard, especially that it's my first typeface. After consideration I decided to go with Adobe Latin 4. I'm working on a rather decorative display type. I've been thinking and you're right, I will actually skip the small caps for this typeface. Also no weight or width variants, it wouldn't suit this typeface. </p>
      <p>If I may, I have one more question. How to approach the combing characters, there are some in the Latin 4 set. What do they do? Is this some kind of automatic combining of say diacritics with base glyph, or one can do so manually when using the font? I don't understand the purpose, what combining characters are and do.</p>
      <p>Thanks so much!</p>
