    <p>Hello Everyone,</p>
    <p>I'm a Graphic Designer learning new skills in typography and type design. Actually I'm about to design my first typeface. I have a rough idea. But I'm stuck at making decision on the character set that I want to cover. What character set should I cover? I'm pretty confident I want to cover all (ALL) Latin scripts. Nothing non-latin for starters. And no specials such as phonetics etc. But I would like say SmallCaps etc. I'm just confused. Can someone tell me how to go about it? How to choose which character ranges I need to include?</p>
    <p>(I have FontLab Studio 5.1.2 on Mac)</p>
    <p>Thanks a lot for help!</p>
