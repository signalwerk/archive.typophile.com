    html: |-
      <p>One thing you didn't mention in your original post is what type of design you are doing. If it is a display font, Small Caps may not be appropriate whereas with a text face, they likely would be. Having said that, it is not an ironclad rule because some display faces would merit having Small Caps.</p>
      <p>Examine current designs done by others that are similar and use those as a starting point.</p>
