  - id: 589175
    user: 2462
    date: 2014-09-25T09:47:00
    date_raw: 25 Sep 2014 — 9:47am
    votes: null
    html: <p>A combining mark has zero advance width, and its glyph outline is set to the left of the start. This makes it appear over the previous character when it is typed. Try to position it for the width of an ideal average lowercase character; the results will often be inexact.</p>
    html_clean: <p>A combining mark has zero advance width, and its glyph outline is set to the left of the start. This makes it appear over the previous character when it is typed. Try to position it for the width of an ideal average lowercase character; the results will often be inexact.</p>
