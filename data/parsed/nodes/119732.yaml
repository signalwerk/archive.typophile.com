      <p>For Adobe, Thomas Phinney put together some Latin character sets of increasing levels of linguistic inclusiveness:<br>
      <a class="freelinking external" href="http://blog.typekit.com/2008/08/28/extended_latin/" rel="nofollow">http://blog.typekit.com/2008/08/28/extended_latin/</a></p>
      <p>Small caps are a different matter. They aren't included in any character set; they are alternate glyphs for the regular letters.</p>
