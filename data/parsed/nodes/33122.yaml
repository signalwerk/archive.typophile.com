    html: <p>I think the problem here is that developers have to choose between API’s provided by the operating system and developing their own text layout components. The latter is a huge engineering challenge, which is why only a couple of companies have done it. If Windows Presentation Foundation and Cocoa provide easy access to this sort of functionality it might suddenly start showing up in all kinds of programs. Programmers love adding features, they just have a limited amount of resources. The trick is helping them get this stuff “for free” simply by using programming components that support it.</p>
