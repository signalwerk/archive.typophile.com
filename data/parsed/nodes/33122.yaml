    html: |-
      <p>I feel very torn by this lack of support. I’m very keen to ship fonts with advanced typographic support, but part of me feels that it is not necessarily in the customers’ interest. In the bad old days, we had things like alternate characters in separate fonts, leaving it to the user to sort out. But at least it was a level playing field—no special application or OS support necessary to use alternate characters and such. With OpenType, if you don’t have one of the few programs that fully support the fonts, you’re stuck with a limited version of the font (in effect).</p>
      <p>I just got my Adobe CS3 upgrade today, and was disappointed by the relative lack of progress in the OT area. (I know, I should go make a feature request in the appropriate place.) In InDesign, for instance, it’s even harder to find the OT stuff than the previous two versions.</p>
      <p>Realistically, I know that most people buying my fonts will have one or more of the first four programs on my list. But I really feel frustrated when I get a complaint from a Flash user wondering why they can only access the basic characters in an “advanced” font they just bought from me.</p>
