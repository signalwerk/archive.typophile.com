      <p>I’ll note that this subject is going to be covered at TypoTechnica next week:</p>
      <p><strong>Status of OpenType support 2007</strong><br>
      The presentation will summarize the status of OpenType support in different applications and on different platforms. We will give an overview of the feature support, the existing bugs, problems and shortcomings related to OpenType fonts. The following issues will be covered in detail and will be demonstrated:<br>
      — Unicode support, Glyph naming and Encoding problems<br>
      — Fontnames and platform compatibility<br>
      — GSUB vs. KERN : Kerning support<br>
      — Ascender, Descender and Linespacing<br>
      — Overview of feature support in different Applications for different scripts and languages<br>
      — Summary</p>
