    <p>I’m trying to come up with a current list of applications that support OpenType advanced typography features (especially things like Contextual Alternates). So far, this is what I have:</p>
    <p>Adobe InDesign (all versions?)<br>
    Adobe Illustrator CS or later<br>
    Adobe Photoshop CS or later<br>
    QuarkXPress 7.0 or later<br>
    Mellel (Mac OS)<br>
    Windows Presentation Foundation (which would include what applications?)</p>
    <p>Anything else?</p>
