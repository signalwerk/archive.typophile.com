      <p><cite>I think the problem here is that developers have to choose between API’s provided by the operating system and developing their own text layout components.</cite></p>
      <p>There are cross-platform text rendering systems like XcgfK (google for this term) by em2 Solutions which supports OT features. It  can be licensed by application developers.</p>
      <p><cite>I feel very torn by this lack of support. I’m very keen to ship fonts with advanced typographic support, but part of me feels that it is not necessarily in the customers’ interest. [...] With OpenType, if you don’t have one of the few programs that fully support the fonts, you’re stuck with a limited version of the font (in effect).</cite></p>
      <p>Yes.<br>
      We must hope that the next OSX’s OT support will be assimilated to that in Adobe applications or WPF, so that OT fonts behave the same way in TextEdit and Pages (and third party developers’ applications) as they do in Creative Suite.</p>
