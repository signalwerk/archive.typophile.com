    date_raw: 5 Dec 2003 — 10:05am
    votes: null
    html: <p>I like the alternates; they feel 'right' and balanced to me.  <br> <br>You might consider what they call 'trapping' - a widened, deeper 'v' of white space on some of the narrow angle joins, such as on the narrower versions of the tzadi sofit, and on the middle arm of all the widths of shin. This will make it not 'close up' with ink or on screen when it is small.  <br> <br>I think the numerals need some work, but I'm not sure how. I know that Arabic numberals are handled different in Roman fonts than in Arabic ones. Are they handled yet again differently in Hebrew fonts, to harmonize with the Hebrew? <br> <br>In the big size I can see better what is going on, and I like the way you've rounded the bottom of the tet, and rounded outside corners. This adds a finesse that I have sometimes found missing in Hebrew sans faces, as I said.  </p>
