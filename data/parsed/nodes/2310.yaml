    html: <p>Thank you for your responce, William! <br> <br>You are right about the Tet, I made an alternative version of it, without a slanting line, it has much more inner white space. <br> <br>About the Tzadi Sofit, I also made an alternative shape that has a lower intersection point (positioned on its baseline). <br> <br>I'm including an image of the alternative letters compared with the originals. <br> <br><img src="http://www.typophile.com/forums/messages/29/21821.gif" alt="&quot;Methoda&quot; Tet And Tzadi Sofit"></p>
