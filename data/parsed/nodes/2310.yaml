    html: <p>My Hebrew is poor, and my eye for it not good enough to really comment, but a lot of the 'sans' style Hebrew fonts look very clunky to me, not having the subtle modeling that the best modern Roman sans do.  <br> <br>I was struck by the sign in back of the four security chiefs that appeared recently in the papers that the font was very well done in this respect. (Yes I read the 'we are headed for catastrophy' message - I was glad I could think about the font!)  <br> <br>Your font is more graceful than some other Hebrew sans I have seen. My only questions would be about your tet and tsadi sofit, which don't seem quite as balanced. But I don't know enough to comment further. </p>
