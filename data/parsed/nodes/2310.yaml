  html: <p>Hello everyone! Itay K introduced me to these forums, and it's a real pleasure seeing such widely active discussions on type. <br> <br>I'm uploading a sample of a typeface I've been working on, it's a simple Hebrew font, stretched to fit three different "x-heights". The basic letter shape is also my design. <br> <br><img src="http://www.typophile.com/forums/messages/29/21813.gif" alt="&quot;Methoda&quot;"></p>
