  html: |-
    <p>For an identity project, I am looking for serif fonts in which the leg of the cap R drops below the baseline. Can anyone please make a recommendation? I have the ability to extend it further, if needed, and this needs to be more exaggerated than normal. Thanks a lot.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ra_4271.jpg"></div><p></p>
