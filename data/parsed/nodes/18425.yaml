    <p>I have client who has been using Magistral ( <a href="http://www.myfonts.com/fonts/paratype/magistral/" title="http://www.myfonts.com/fonts/paratype/magistral/">http://www.myfonts.com/fonts/paratype/magistral/</a> ) for most of their materials. I want to improve on the typeface, so looking around I found Neosans/Neotech ( <a href="http://www.monotypefonts.com/WhatsNew/Releases.asp?show=neo" title="http://www.monotypefonts.com/WhatsNew/Releases.asp?show=neo">http://www.monotypefonts.com/WhatsNew/Releases.asp?show=neo</a> ) which I love but the price doesn’t love me so does anyone know of any other typefaces similar to Neosans that are more affordable</p>
