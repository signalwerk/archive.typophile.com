      <p>I hate to sound like an aßhole, but... You get what you pay for. An affordable font is likely not as well-made as an expensive one. (This is not a hard and fast rule, but it tends to be true most of the time.)</p>
      <p>If you only purchase the weights you need, Neo might be exactly what you’re craving.</p>
      <p>Anyhow... I’m sure that someone who is better-acquainted with all of the new releases from all foundries will be along in a short while to provide some alternatives for you.</p>
