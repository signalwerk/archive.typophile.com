      <p>I have to say that at $42 per single font ($49 in OpenType format), or $450 for a pack of 14, Neo Sans/Tech certainly has premium pricing.</p>
      <p>Mind you, premium pricing of key new releases seems to work well for Monotype and Linotype, so I’m not going to knock it. (Note: NOT trying to start a discussion of how everybody should price their fonts, as that gets into anti-trust territory.)</p>
      <p>T</p>
