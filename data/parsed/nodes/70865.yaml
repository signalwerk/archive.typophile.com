      <p>Actually, although Nick Shinn only has proportional small cap figures (roman and italic) in <a href="http://www.shinntype.com/figgins.html" rel="nofollow">Figgins Sans</a>, he also includes authentic nineteenth-century three-quarter-height figures (roman and italic) in both proportional and tabular spacing.</p>
      <p>Also, his <a href="http://www.shinntype.com/scotch.html" rel="nofollow">Scotch Modern</a> also has small cap figures (roman and italic, proportional only) and three-quarter-height figures (roman and italic, proportional and tabular).</p>
      <p>Extra kudos for also including nut fractions in both of them, along with superiors and inferiors and numerators and denominators. Both faces are rich in figures. Nicely done, Mr. Shinn.</p>
