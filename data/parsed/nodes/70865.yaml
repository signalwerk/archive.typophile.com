      <p>In fact, I am quite satisfied with what is currently on offer. Most problems concerning small cap figures seem to have been solved already by ingenious colleagues. My motivation to post above list did not arise from discontent with fonts I knew; it is just recommendable to gain a comprehensive overview of available typefaces before making any decisions, I think. Your suggestion to draw a set of figures myself is valuable, nonetheless.</p>
      <p>Further contributions to the list remain welcome. Most recent addition: VoiceOS by Hubert Jocham — nice one.</p>
      <p>P.S.: Here comes an example of tabular small cap figures in a sans-serif typeface (Calibri by Lucas de Groot, another ClearType font):<br>
      &nbsp;<br>
      </p><div class="imageWrap"><img src="/files/table_5869.png"></div><p></p>
