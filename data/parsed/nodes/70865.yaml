      <p>You’re right, shrinking capitals and lining figures is a viable option, as long as you have a slightly bolder weight at hand. And that’s where I have encountered problems: Optical sizes are usually too close to each other in terms of stroke width, whereas semibold cuts often tend to look too dark. At precisely this point, tabular small cap figures come in. Alas, they are comparatively rare in sans-serif typefaces (though not as rare as I thought them to be before compiling this list), but so are optical sizes.</p>
      <p>About half of the fonts in the current version of the list seem to offer both proportional and tabular small cap numerals — among them such different typefaces as Neutraface, Grotext, Seravek and Morris Sans. It’s admittedly a limited selection, but I expect it to grow over the years. Small cap figures apparently and, to my mind, deservedly see an increase in popularity.</p>
