      <p>I am a supporter of small caps figures but have never considered them to be tabular. I also wouldn't naturally consider setting a table in caps (small or otherwise) so I am interested if there traction to this trend...</p>
      <p>I have been working recently on developing the Bembo Model (Italian Renaissance) partly to get my head into italics and scripts.<br>
      I show for your interest a first draft [below] – which shows my current thinking on numbers for a text face - being four basic Number sets.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bembo-Model_4582.png"></div><p></p>
      <p>I was thinking of calling the Default smallish example "Tabloid" - but that would just be confusing! Now that we have so much control over numbers - I see offering a 'smallish' set as a good option. I used to find the slightly smaller Figures in the early Helvetica intriguing though their size was less aesthetic and more to allow them to fit into a tabular system. Can anyone confirm this? </p>
      <p>Anyway I am very much into the default figures adopting a natural and unforced form - this I think has been achieved when you compare the smallish default set to the 'standard' tabular lining figures (which historically have tended to be offered as the default in the Bembos from Adobe and Berthold. (This may not be true of Monotype Bembo Book?). This thread is showing that this practice is becoming less acceptable for professional/typographic enduse fonts.</p>
    html_clean: |-
