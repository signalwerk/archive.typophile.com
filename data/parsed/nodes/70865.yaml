      <p>Designing - or simply making an 8 work  at regular caps height is difficult enough! There is a certain amount of skulduggery that needs to take place to make the 8 and the other 'complex' figures like 3 and 5 fit into such a restricted space (small caps). Match that with making them bold and you can see why small caps figures are not so prevalent. </p>
      <p>You (as a designer) have to consider and allow the most difficult detail occurrences in glyph construction to inform the detailing for the rest of the typeface. Why set the bar where it becomes so much more difficult to accomplish a design scheme or makes you compromise the rest of the glyphs? </p>
      <p>R. - I think it is good to lead by example - Since you have compiled a pretty comprehensive list already, try to work out what it is you like about particular designs - this can suggest a model by which you can promote your cause.  It would be cool to see the results of your research. Have a go at creating a set of figures yourself. Rather than hoping someone else *might* create what you want - create it yourself. If you are dissatisfied then create something satisfactory. </p>
      <p>You show the previous tabulated example which is serifed? Perhaps we need to see it again sans-serif? </p>
      <p>If you think about it - each example in the top list has solved a typographic problem (i.e they are not display faces and therefore need to look nice appear interesting/ punchy etc.) What is the problem that you still feel needs to be solved?</p>
