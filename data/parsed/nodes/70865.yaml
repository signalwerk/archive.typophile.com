      <p>Of course, this is a frequent question. I use proportional small cap numerals in running text when figures are adjacent and belonging to letters in (all) small caps. This is regularly the case in those scientific publications that prefer the ‘Smith 2009’ format for references. Fixed-width small cap figures, on the other hand, render it possible in tables to reach a certain degree of optical evenness (that obviously cannot be obtained with old-style numerals) and to keep the line height moderate at the same time (which would not be possible with taller lining figures and majuscules). Just have a look at the following example (the typeface is John Hudson’s Constantia):<br>
      <strong></strong><br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/table_3843.png"></div><br>
      <strong></strong><br>
      Further additions to the list are highly welcome, by the way.<p></p>
