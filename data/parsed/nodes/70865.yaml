    <p>Hey folks,</p>
    <p>Lately I have been looking for a sans-serif with rather specific properties: a character set covering many languages (including at least Polish, Turkish and Czech), small cap figures (desirably proportional and tabular) and as wide a range of weights as possible (more than two, preferably each with corresponding italics). I thought the list I put together might be useful to others. And I hope for additions and corrections, this compilation being far from exhaustive. Display fonts are excluded on purpose.</p>
    <p>The list gives the name of the typeface as well as—in brackets—the foundry that has issued it and, if necessary, some detail on the small cap figures.</p>
    <ul>
    <li><a href="https://ourtype.com/#/try/alto/" rel="nofollow">Alto</a> (OurType)</li>
    <li><a href="http://www.fontshop.com/fonts/downloads/moretype/alwyn_new_family_pro/" rel="nofollow">Alwyn New</a> (Moretype)</li>
    <li><a href="http://www.stormtype.com/typefaces-fonts-shop/families-84-anselm-sans-pro" rel="nofollow">Anselm Sans</a> (Storm Type; only tabular)</li>
    <li><a href="http://vllg.com/Thirstype/Apex_New" rel="nofollow">Apex New</a> (Thirstype)</li>
    <li><a href="http://www.germantype.com/cms/front_content.php?idcat=81" rel="nofollow">Arventa Sans</a> (GTF)</li>
