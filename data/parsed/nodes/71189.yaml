      <p><cite>It's funny how this style, invented in England in the 1860s (as a moderation of the completely bizarre "Italian"?), has come to signify the American Wild West.</cite></p>
      <p>I have noticed the same things; lots of styles that came out of New York or Boston, created by Scot, German, and English immigrants, all on the covers of books about cowboys. I think it probably has something to do with the American Wild West being largely mythical to begin with.</p>
