    html: |-
      <p>Many thanks to all of you guys for your kind words about Manicotti.</p>
      <p>I agree that it's funny, and at the same time a little sad, that this style has been pigeonholed to the extent that it has. While Manicotti doesn't follow the old French Clarendons very closely, it does take almost every opportunity to play into that faux-Western stereotype.</p>
      <p>This is the exactly the kind of thinking that encouraged me to return to this style and draw <a href="http://www.fontbureau.com/fonts/trilby/" rel="nofollow">Trilby</a>. Among other things, it was an attempt to cast off some of the long-held associations of reversed-stress slabs.</p>
