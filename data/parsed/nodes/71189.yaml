    <p>Hi everyone,</p>
    <p>I wanted to let you know that my typeface <a href="http://www.djr.com/typefaces/Manicotti" rel="nofollow">Manicotti</a> is now <a href="http://new.myfonts.com/fonts/djr/manicotti/" rel="nofollow">available for licensing on MyFonts</a>. It was honored by the Type Directors Club in 2007, and since then I've expanded it to include lowercase, unicase, more swash variants, and ornaments. Manicotti was a whole lot of fun to draw, so I'm hoping that it is equally fun to use!</p>
    <p>Warmly, David</p>
    <p><a href="http://www.djr.com/typefaces/manicotti" title="http://www.djr.com/typefaces/manicotti">http://www.djr.com/typefaces/manicotti</a><br>
    <a href="http://www.myfonts.com/fonts/djr/manicotti" title="http://www.myfonts.com/fonts/djr/manicotti">http://www.myfonts.com/fonts/djr/manicotti</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/manicotti_590_1_5624.png"></div><p></p>
