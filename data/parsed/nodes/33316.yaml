    <p>I normally wouldn't ask for help with something like this since I am a control freak and generally knowledgeable but I am redesigning a magazine in a hurry and was looking for input since you guys and gals know your stuff. I am looking for a good legible sans serif with a modern touch but without the goofy flourishes that many of the modern humanist faces have – basically I'm looking for a Trade Gothic but with an edge. It needs to have a big family (condensed, three or four weights and italics a must). The Bold faces need to be cover-line solid and because the magazine has a humorous tone, it needs to be able to carry that tone as well. Trade Gothic was great for Vice Magazine when I was there because it had this exact quality but it's too visibly dated for this magazine, which is trying to be more modern to go with the rebranding of the company.</p>
    <p>I'd say the closest I've gotten is FF Bau, which is nice and classy with a potential for humour but its heavier faces are just a touch clunky and Kabel-ish for my taste.</p>
    <p>Any help appreciated - even just suggesting foundries to check out (Font Bureau is good - I bought our slab serif font – Dispatch – there). I've got FontFont's book of fonts being delivered as well so hopefully that will turn up some things. </p>
    <p>thanks</p>
    <p>edit: I should note that currently the magazine is using Myriad Pro and while it's fine for a women's health magazine or Punch Bowl Monthly, it is killing me with it it's complete lack of sleekness. </p>
    <p><a href="http://www.3eige.com" title="www.3eige.com">www.3eige.com</a>  |  <a href="http://www.arstechnica.com" title="www.arstechnica.com">www.arstechnica.com</a></p>
