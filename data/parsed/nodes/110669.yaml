      <p>You're welcome Matthew. There are some digital fonts with  the flavor of the lettering of the era shown in your image. They lack the tilde feature and would need to be expanded in width.<br>
      1. Two independent digitizations of the another old font, name unknown:<br>
      Milton by Mecanorma [demibold]<br>
      <a href="http://www.myfonts.com/fonts/itfmecanorma/milton/" title="http://www.myfonts.com/fonts/itfmecanorma/milton/">http://www.myfonts.com/fonts/itfmecanorma/milton/</a><br>
      Musketeer by Tony Geddes [demibold, light &amp; regular]<br>
      <a href="http://www.myfonts.com/fonts/mti/musketeer/" title="http://www.myfonts.com/fonts/mti/musketeer/">http://www.myfonts.com/fonts/mti/musketeer/</a><br>
      2. Kleukens Antiqua typeface designed by Friedrich Wilhelm Kleukens in 1910 for Bauer<br>
      <a href="http://typophile.com/node/52222" title="http://typophile.com/node/52222">http://typophile.com/node/52222</a><br>
      Sold under the name Trieste EF by Eisner &amp; Flake. Veronika Elsner &amp; Günther Flake did bold, medium &amp; light weights<br>
      <a href="http://www.myfonts.com/fonts/ef/trieste/" title="http://www.myfonts.com/fonts/ef/trieste/">http://www.myfonts.com/fonts/ef/trieste/</a><br>
      Also Trieste SB by Scangraphic, bold, medium &amp; light weights<br>
      <a href="http://www.myfonts.com/fonts/efscangraphic/trieste-sb/" title="http://www.myfonts.com/fonts/efscangraphic/trieste-sb/">http://www.myfonts.com/fonts/efscangraphic/trieste-sb/</a><br>
      Nick Curtis has a medium weight sold under the name Kleukens Antiqua NF.<br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/kleukens-antiqua-nf/" title="http://www.myfonts.com/fonts/nicksfonts/kleukens-antiqua-nf/">http://www.myfonts.com/fonts/nicksfonts/kleukens-antiqua-nf/</a><br>
      3. Other fonts  with some similarity and based on sources from the era include Windsor, P22 PanAm, and Edwardian.<br>
      Don</p>
