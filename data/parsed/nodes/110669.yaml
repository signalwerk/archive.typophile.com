    html: |-
      <p>Can't name this one and doubting actually it could have been a font, more probably a sign painting or a custom lettering for Gieve(s) (which could make sense when talking about tailors to the King...).<br>
      I'm wondering also if the /E median crossbar is <a class="freelinking external" href="http://typophile.com/node/103815" rel="nofollow">flame-shaped</a>. Anyway, some clients for customization: <a class="freelinking external" href="http://www.myfonts.com/search/bolyar" rel="nofollow">Bolyar</a> (removing some spurs), <a class="freelinking external" href="http://www.myfonts.com/search/trieste" rel="nofollow">Trieste</a>, Aviano <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/aviano-flare" rel="nofollow">Flare</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/insigne/aviano-serif" rel="nofollow">Serif</a>, LHF <strong><a class="freelinking external" href="http://www.letterheadfonts.com/fonts/cameo.php" rel="nofollow">Cameo</a></strong> (my vote), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/bostontruckstyle.php" rel="nofollow">Boston Truckstyle</a> (interesting but enough elegant even reworked I guess), <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/esoteric3.php" rel="nofollow">Esoteric 3</a></p>
