    html: |-
      <p>Probably lettering in a popular style of the early 20th century, rather than a specific font. Note the tilde shape for the center stroke on E. Here is a somewhat similar digital font called Jonquin<br>
      <a href="http://www.myfonts.com/fonts/gatf/jonquin/" title="http://www.myfonts.com/fonts/gatf/jonquin/">http://www.myfonts.com/fonts/gatf/jonquin/</a><br>
      by a British foundry, Greater Albion Typefounders, which is "inspired by some hand lettering seen on a World -War One recruiting poster."<br>
      Move the tilde stroke to mid level and do some other relatively minor tinkering and you are in the ballpark for your lettering.<br>
      Other digital fonts with the E tilde include Tenebra by František Štorm<br>
      <a href="http://www.myfonts.com/fonts/storm/tenebra/" title="http://www.myfonts.com/fonts/storm/tenebra/">http://www.myfonts.com/fonts/storm/tenebra/</a><br>
      The E tilde is in the lowercase.<br>
      For more information on fonts with the tilde see:<br>
      <a href="http://typophile.com/node/103815" title="http://typophile.com/node/103815">http://typophile.com/node/103815</a><br>
      Don</p>
