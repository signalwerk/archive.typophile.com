    <p>Basically what the subject reads. The guidelines I have are that I need to have a chess king and the colour, other than that there isn't anything specific I need to take into consideration (other than the personal opinion of them...)</p>
    <p>The name means "economists day" and it has the date of the actual fair underneath. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ed_chess_logo_5986.jpg"></div><p></p>
    <p>What do you guys think I could do better?</p>
    <p>btw, I'm not really feeling the chequered pattern but my boss really wants me to somehow incorporate it.</p>
