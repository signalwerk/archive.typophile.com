  html: |-
    <p>The Solopedia is an outstanding resource for identifying fonts.<br>
    For many years it has been updated monthly by "Character" and posted at usenet newsgroup alt.binaries.fonts.<br>
     The updated version is then incorporated in <a href="//abfonts.freehostia.com/solopedia/solopedia-c.htm /" rel="nofollow">the web version</a>.<br>
    The final issue of the Solopedia curated by "Character" was released today. Here is his post to alt.binaries.fonts:<br>
    "Attached is the zipped version of the May 2013 edition of the Solopedia....<br>
    Due to some severe health problems, this will be the last edition that  I'll be able to produce or contribute to.<br>
    It would be great if someone would take up the reins and continue to oversee its continued progress."<br>
    Character"<br>
    I have posted this information in the type ID board as it is primarily of interest to type ID specialists rather than other activities of Typophile.<br>
    We will miss character's contribution.<br>
    Perhaps one of the contributors to the type ID board might consider taking over this project.<br>
    Don</p>
