  html: |-
    <p>I am on the lookout for a well typeset Bible. I am most interested in finding one that's set in a nice serif face, ideally with some contemporary styling (e.g. something like Fedra, or Tiempos), but I'm open to any good suggestions. I've had a look at <a href="http://www.bibledesignblog.com/" title="http://www.bibledesignblog.com/">http://www.bibledesignblog.com/</a> but he's a bit more focused on binding &amp; materials than the typesetting. </p>
    <p>Thanks for any good direction you can point me in.</p>
