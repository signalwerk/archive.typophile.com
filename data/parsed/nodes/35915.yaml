  - id: 219194
    user: 14529
    date: 2007-08-13T23:20:00
    date_raw: 13 Aug 2007 — 11:20pm
    votes: null
    html: <p>The two best sans serifs on the market are Linotype Syntax, whose basal weight is just perfect (many of its wannabes, like Myriad, start with too heavy a base weight, although if that's what you need for web use, then look at Myriad, used on Apple screens nowadays), and Joshua Darden's Freight Sans, a very subtle Gill-inflected design. Both offer oldstyle figures and different weights. Both look very stylish without hitting you over the head that way Klavika and Etelka do.</p>
