  html: |-
    <p>I recently started some projects for a company that until recently have been using a very cheap font (dont' remember the name, but I believe it was free) for most of their body copy. They use a lot of caps &amp; numbers that look really bad because of the lack of small caps and proportional numbering in the cheap font.</p>
    <p>They are technology/web based, so I'm looking for something modern looking, yet professional. I would prefer a sans serif, but I might be able to convince them into a semi-sans as long as it has that "modern" touch. Of course it would be nice to have small caps, and a large family to choose from.</p>
    <p>Let me know if you have any suggestions, I'm pretty much open to anything.</p>
