    html: |-
      <p>"The two best sans serifs on the market are..."</p>
      <p>In Your Humble Opinion.</p>
      <p>Note that Klavika and Etelka are really in a different category from Syntax and Freight Sans (and all the equally excellent members of that category), and that Myriad isn't known as a "wannabe" of Syntax. Klavika and Etelka do offer some of what Mike seems to be asking for: Modern. </p>
      <p>For web use, Storm's Vida might be useful; it's made for low-res situations and has the square shapes that may telegraph "modern" to your client. Very large family with 3 widths and Mono versions.</p>
      <p>For something more typographic (less screen-tuned) try the new Mundo Pro family. Good for all purposes, at all sizes.</p>
