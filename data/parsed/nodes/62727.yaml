  html: <p>Somebody just brought this up at work. A job they had set in Stempel Schneidler was sent back for fixing because of the question mark. I had a look and was a bit surprised to see this. At first I thought maybe they had accidentally typed a Spanish one, but the dot is on the bottom. I find the design of it kind of extreme for an otherwise very legible face.</p><div class="imageWrap"><img src="http://typophile.com/files/Stempel_3958.png"></div><p></p>
