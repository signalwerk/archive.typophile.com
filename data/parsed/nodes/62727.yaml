    html: <p>See Rainer’s answer (first comment). To my eyes, it sure is a non-standard design, but definitely acceptable. Having said that, I haven’t seen a lot of Schneidler recently. The typeface also is not mentioned as one of the commonly used ones for book design, in the 2005 sample compiled by the Museum der Arbeit. This analysis looked at 1207 books printed by Clausen &amp; Bosse, for various publishers. Assuming it is somewhat representative, even Trump, Goudy and Berling are more ‘accepted’ than Schneidler.</p>
