      <p>The 3-D effect is inconsistent - in more than one way. First, the gradient suggest the letters are on a curved surface, yet they’re not slightly warped as they should be — if you put a chess board on a spherical surface, the squares won’t be square any more, right? Second, the letters “DOCK” are plain white without any gradient, which is wrong — just like the black background, even originally plain white area get a gradient if the surface isn’t flat.</p>
      <p>3-D effects are tricky to get right, and they’re guaranteed to give you headaches to get printed right. So unless your logo is primarily used on screen (which doesn’t seem to be the case according to your description), you should re-think at least three times if it’s worth the trouble.</p>
