      <p>&gt;The word “sophistication” should be used to describe an inevitably complex solution to a complex problem.<br>
      &gt;Sophisticated vs. complicated, complexity vs. appropriate solution</p>
      <p>Why can’t something be sophisticated yet simple? The implications above are that anything that is sophisticated is therefore complex, and anything complex, that is executed well, is therefore sophisticated. I’ve seen plenty of good design that is complex, yet not sophisticated. I feel sophistication is more like elegance or boldness. While it is a trait often desired, it is not inherent in every (good, complex) design, nor should it be. Similarly, elegance is something to be admired, but it is not necessarily appropriate in every situation.</p>
      <p>&gt;Are they sophisticated or simple?<br>
      I think your list includes many logos that are both, and some that are one or the other (easyJet, for example, while simple, is more casual than sophisticated).</p>
      <p>I agree with hola that the font choice is a little too heavy. Maybe even try a serif? Although knowing more about the company and its personality would certainly help.</p>
