    html: <p>I understand what sophisticated means, but in relation to design, I think the key word there is “developed.” Yes, it <em>may</em> be complex, but that is not a requisite. However, something that is highly developed doesn’t have to be complex (nor does it have to be sophisticated, for that matter). I just don’t think one can pass judgment on the sophistication of a mark based simply on its relative complexity or simplicity. That is a completely separate matter, IMHO.</p>
