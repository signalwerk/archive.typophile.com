      <p>You really need to understand that design isn’t pure art, it’s applied art, and as such, the basic principle is: “simplicity = good, complication without absolute necessity = bad”.</p>
      <p>To be clear, we’re not talking about “sophisticated”, but “complicated” in this case. The word “sophistication” should be used to describe an inevitably complex solution to a complex problem. Obviously, that requires great skill. But the more basic and more important skill is to recognize how complex the problem is in the first place. Intentionally aiming for a solution that is more complex than the problem itself, is — without exception — a very wrong course.</p>
    html_clean: |-
