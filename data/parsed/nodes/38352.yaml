    html: <p>Cassie, I think you’re confusing the process with the outcome. A very complex concept can lead to a very simple result — that’s entirely possible and even quite usual in high-class design. This is basically what you’ve been talking about — a simple result that indicates a sophisticated concept and/or creation process. However, being able to *indicated*, *reflect*, *embed* something sophisticated isn’t equal to *being* sophisticated itself — the result still cannot be simple and sophisticated at the same time.</p>
