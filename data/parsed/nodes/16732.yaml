    <p>Greetings!</p>
    <p>I'm currently enrolled in Amy Conger's beginning digital type design class. She's asked us to post a sample of a typeface that we're working on. The one I've chosen to post is my handwritten font that I outlined in Illustrator. It's intended for my personal use only.</p>
