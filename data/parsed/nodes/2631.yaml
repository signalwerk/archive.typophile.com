    html: <p>The E with the wavy crosspiece definitely evokes a very coffeehouse image in my mind.  That said, I'm not sure how well the bottom serifs on the N and Y work with the rest of the glyphs.  The letter forms (contrasting with ornament) seem to ride high, and don't have the bulk of the E,B, and O - an impression only accentuated with the crossbar of the N riding so high.  It's not really an issue of color, the word EBONY just seems to fizzle and die at the end. <br> <br>Realize that this comes from someone who could probably never equal your work, so a critique is really all I have for you.  I don't know how else to preserve the elements of the face in the N and Y, so I guess it's up to you to decide whether I'm full of it. <br> <br>PS, I like this face a lot.  It seems to have a lot of the soul of the old-west woodcut lettering with a distinctly modern feel - a potent and interesting combination.</p>
