      <p>Well, first of all, isn't this a book from the 19th century? If so, we need a revival of something that was a metal typeface. To me this resembles <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/itc-usherwood/">ITC Usherwood</a> which was designed in 1984, but I think could have been based on much older typeface styles.</p>
      <p>- Mike Yanega</p>
