      <p>When you say narrow &amp; lighten you mean compared to the weight it had before - right? I just want to be sure I follow you. Why did you want to narrow or lighten the font in general? Was it to make it for a larger pt. size?</p>
      <p>What struck me about the Goudy modern is that while it felt 'period' from an aesthetic point of view &amp; somehow there fore superficially 'worked' in the context of reading Moby Dick, ultimately the 'w' overpowered the letters around it, was distracting &amp; compromised the word shapes. And there are dozens of similar problems. </p>
