      <p>Hi Eben, yup, I've been concentrating on the gelling of words, through the resizing of counters and also by rotating white space counter-clockwise relative to the axis of black. I've found that Griffo and, to an almost exagerrated extent, the draughtsman of Monotype Bembo observed the same dual-axis principle. It gives sparkle despite low contrast, which is now the most notable thing about this design, and it helps, as in FF Legato, to unite the word-image. </p>
      <p>The unterminated 'a' is found in Jenson's and Gill's types, and also in Lutetia.</p>
      <p>Sorry about not posting old PDFs, I've put up one previous version along with the current update.<br>
      George</p>
