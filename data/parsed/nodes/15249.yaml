      <p>&gt; It’s reassuring to ...</p>
      <p>Woah, don't be <cite>too</cite> reassured! :-)  Many accomplished type designers do not agree with that idea. These tend to be the same people who don't place a qualitative distinction between display and text fonts, believing that it's just a matter of changing stroke contrast, etc. to get one to be the other. But to me these are the designers who produce non-optimal (if still entirely serviceable) text faces.</p>
      <p>&gt; Do you have an opinion on whether Mamillius’ structure<br>
      &gt; is exaggeratedly or sufficiently “text”?</p>
      <p>No, I'm not good enough for that yet. Although the statement I made I have full faith in, I'm still not at a point where I can see exactly what it is and make it happen myself; which is why Patria is still too close to the Display end of things - although some of the people described above still complain that it doesn't have enough formal harmony. What they don't grasp is that that's a feature, not a bug.</p>
      <p>hhp</p>
