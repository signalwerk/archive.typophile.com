      <p>Hi Hrant, I doubt whether this would ever be used by anyone but me and a few friends, I'm afraid. I hope to do the MA in type design at Reading next year, and to immerse myself in Griffo sufficiently deeply to produce a really good Aldine type then, but for now this is both a chance to see how far I can go without training and a type for my own first book on Shakespeare. </p>
      <p>Until yesterday, this design looked terribly dull when (as it were) blown up beyond 13 point. Checking how a face looks a little larger than its intended size can show clearly some kinds of structural failure only vaguely and nigglingly apparent at true size.</p>
      <p>And what I should have said was "in particular, the weight of thins is not a design decision which should be imposed on letterforms in advance of their being drawn, except in the roughest terms". Which is rather different to, though much less silly than, what I in fact wrote.</p>
      <p>George</p>
