      <p>As a preface let me say that I too am impressed. I am naive about text faces still, and will be for some years yet I suspect. So take my crit/questions with some ( or even a lot of ) salt!</p>
      <p>So far all the comments I have read have dealt with letterforms rather than interletter spacing. Is it the case that eveybody is happy with that aspect of the font or is that being saved for later? When I look at the word 'child' the spacing does seem to be an issue. The l seems to be clinging to the i to escape the d. The w seems a bit over strong. It takes over. The c seems to be creeping to the lower left. The spacing of 'ya' in 'yard' seems to big. Overall it has the effect for me of reminding me of metal type that was set without kerning. The i in metal Bembo seems to creep to the a on it's right and away from an n on it's left. I wonder if philisophically you may be looking to relate closely to that history &amp; approach. </p>
      <p>Seperately, the tail of the 'y' seems to draw a little too much attention because of the weight. The 'a' does too but for the opposite reason - it's terminal is so light.</p>
      <p>The irregularity of the face does make it lively and pleasant ( other folks said organic, wobbly, pleasant warmth etc ). </p>
      <p>I also think that the ascenders &amp; descenders could be less tall &amp; deep with no ill effect.</p>
      <p>It would be nice if you posted the old PDFs so I could see the progress as you went along.</p>
      <p>Cheers!</p>
