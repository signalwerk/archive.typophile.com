      <p>Dear point918,<br>
      I've warmed it up further by reducing the concavity of serifs - discarding what is only a gimic without Baroque letterforms.  But this tends towards, not away from, digital regularity.  In fact I don't want irregularities in the sense of a pseudo-random scattering of yokelish accidents.  Rather, I want to avoid constructivist letterforms.</p>
      <p>You're right about y, I've enlarged the counter: thanks.</p>
      <p>George</p>
