      <p>Eben, it's OK, this is Mamillius 12 point, and will never appear at larger sizes if I have anything to do with it. I have indeed been thinking about intraverbal spacing a lot - that's why the head-serifs are how they are - what irks you about the current setup? l was loosely spaced to the right, but that's been changed.</p>
      <p>All links are very welcome. I'm not sure I trust Hoefler, who is, let's face it, better at display than text faces (Requiem Text is rather flimsy, and the letters in words are polite to one another rather than having fun with one another). I do know about <a href="https://web.archive.org/web/20150204032024/http://briem.ismennt.is/" title="http://briem.ismennt.is">http://briem.ismennt.is</a>, but it's pretty basic and can (&amp; did for me) give the wrong idea about eg relative stem weights - it's no good deciding how thick a thin is before drawing all the letters.</p>
      <p>George</p>
