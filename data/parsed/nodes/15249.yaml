    html: |-
      <p>Hi Randy,<br>
      Thanks for your sharp comments.  I've updated the pdf in partial agreement with them. </p>
      <p>s and z have been altered. the top terminal on s was a late-night accident, but the principle of uncharacteristically sharp terminals on s is I think defensible - though I've now regularised them. You were right about z.  I'm sticking with long descenders: it's a slippery slope down to ITC Garamond once you start shortening descenders. t I have grudgingly unwobbled a little. </p>
      <p>The serifs are now a bit more regular.  I think they were more continuous in their variety than perhaps you noticed - all head-serifs, for example, were rounded, though some more than others - but, as you say, they now make a better impression at display sizes. Bow-legs are staying.  Punctuation and dots on i/j I'm still not decided on.  Any ideas as to how it's best done?  </p>
      <p>George</p>
    html_clean: |-
