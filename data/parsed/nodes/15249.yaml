      I'm afraid I don't think there's any point going on with Mamillius, at least for a while. Were I to start again, I would do it differently, and much more as you would wish (also with a more rigorous set of central formal ideas), but I haven't time.</p>
      <p>Goudy Modern isn't really a revival - its "flavour", including odd horizontal proportions and spacing, is Goudy's imposition of his ideals on a histoorical style which was never so irregular. I agree that Goudy Modern, as is the case with even California Old Style at large sizes, is tiresome to read long-distance. I don't approve of that kind of flavour.</p>
      <p>In addition, I doubt there are many new insights into readability - I think, for instance, that Griffo's lowercase letterforms for the Hynerotomachia are more, not less, readable than those of (excellent) metal Bembo; the seeming narrowness of some letters ensures more even white within the word-image, or would if the press-work were better. 13/14 letterpress Poliphilus, though the design shows crudities not present in Griffo's original, is the most enjoyable reading I know.</p>
      <p>G</p>
