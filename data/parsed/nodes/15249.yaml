    html: |-
      <p>Hi George.</p>
      <p>This is really well done. On a structural level, the proportions and color look good. Here are a few areas to take a look at:</p>
      <p>h,m,n: the right legs seem a tad to bow-legged for my taste.<br>
      z: bottom is slightly long<br>
      y: agree with Point's above comments<br>
      decenders: slightly too long I think. (will help the y too)</p>
      <p>The next thing I think you should work on is the quality of the outlines. On the whole they look wobbly. You miss this at text sizes where things look fine, but look to the terminals of the s to see what I mean. Here are a few areas to look at: </p>
      <p>s: The spine looks fine. Nice and smooth curves. It gets ugly from there. The terminals (especially the top one) are very uncertain. Pick a line and go with it :-) Maybe look at your f/j terminals or z for inspiration. The curves in the counters are bad... too square. (Perhaps you adjusted the overshoot by dragging down the top points without adjusting the beziers?) Rework them so they flow with the same grace as the spine.</p>
      <p>t: upper left is wobbly</p>
      <p>There are many places where I expect a single curve, but find an s shape.</p>
      <p>You have three kinds of serf endings. Why? Some of the head serifs have totally rounded tips (p), some have corners and bowed sides, while others have corners and flat sides? You don't pick this up at text sizes but these are the kinds of things that make a quality face IMHO.</p>
      <p>I wouldn't mind seeing more pen in the punctuation ie not perfect circles.</p>
      <p>All that said, this is very well done.</p>
      <p>Randy</p>
