      <p>No doubt. It's looking good. Further thougts:</p>
      <p>y: Still don't like the tail. I think the tail is maybe a little too thick too close to the crotch. More of a flair might help, or some kind of foot, or terminal like your j.</p>
      <p>punctuation: I like the ductus! I wonder why the dot on the i and j don't also reflect this change?  The following is nit picky stuff: I like the diamond period (though it seems a little squished vertically -- like it wasnt' drawn with a pen at 45degrees in one stroke, upperleft to lower right. The comma is too angular imho. Try a more vertical hook (don't worry about keeping diamond shape at the top). This will have two benefits. Better spacing with letters like g. Also stylistically it works with your bowed nhm. Not hard angles in this whole font!</p>
      <p>It looks like you know what you're doing!</p>
      <p>R</p>
