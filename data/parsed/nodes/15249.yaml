      <p>About the size issue. If you have picked a size you are designing into then thats great. My sense was that you were thinking about evaluating the type at several sizes and so I started to think that you were attempting to straddle 9, 12 &amp; 15 or something which could only lead to misery. I see now that is not your intent. Chris Lozos recently said that rather than working on multiple weights (extra thin, thin, bold, extra bold or whatever) of a font it might be better to start by making the same font but cut for several intended use sizes. I think he is right about that. Even if you are designing for just one specific size.</p>
      <p>About relative stem weights. No source is completely oracular. Casting about for a source that dealt with the idea of interletter spacing that site was the best I could find quickly.</p>
      <p>Certainly there is a problem of overpoliteness in lots of digital faces. Adobe faces seem to exemplify that. And certainly you are well on your way to avoiding that problem. </p>
      <p>I am not inked by your type by the way. It's pleasing to me. It just lacks a certain virtue I would love to see it have. It's a virtue that is pretty rare and one that I am still developing my eye for myself.</p>
      <p>Because I am after a little more harmony in interletter spacing, some of what I am after could be construed as suing for that same well mannered but overly polite quality. But I don't think you have to sacrifice color &amp; warmth ( aesthetic virtues) or readability ( a use virtue) to achive better harmony.</p>
      <p>About this spacing issue you said:  that’s why the head-serifs are how they are.</p>
      <p>It isn't the serifs that concern me but the actual amount &amp; shape of the white space between glyphs. Not the black but the white. Look at the word 'was' The w is drifting away. You could say but the serif... but that isn't the issue. The issue is the design of the w ( and a), and the design of their relationship - the design of the interletter space. Theoretically the design of a given a or w could be perfect. As long as the other letters harmonize with it. But it is easier I think to design the harmony in the first place. </p>
      <p>I don't want to say make your 'a' like this or 'w' like that because that just deals with one or two specific places where something is happening. If I convince you at all ( which i might not ) I hope it will be to look at the type and judge it in an additional way.</p>
      <p>Hrant has influened my thinking about this a great deal when he wrote about Legato. (Scroll way down)<br>
      <a href="https://web.archive.org/web/20150204032024/http://typographi.com/000969.php" title="http://typographi.com/000969.php">http://typographi.com/000969.php</a></p>
      <p>He &amp; others have also talked about this idea and related ideas using terms like 'bouma' and 'notan'. You could seach for these terms on typophile &amp; see what you think.</p>
      <p>Here is what the designer said about Legato<br>
      <a href="https://web.archive.org/web/20150204032024/http://www.evertbloemsma.nl/legato/about_legato/about_legato.asp" title="http://www.evertbloemsma.nl/legato/about_legato/about_legato.asp">http://www.evertbloemsma.nl/legato/about_legato/about_legato.asp</a></p>
      <p>&gt;On the other hand, I personally feel that a “real” text face has to have a certain ugliness when viewed large.</p>
      <p>I agree. Features that are going to be preceived well at all at 12 point will become grotesque when large. And a display version will look weak-willed at a small size.</p>
