      <p>Hmmm I am not convinced about this yet. Rhythm which is regular in nature as in 'musical' would probably need to be constant or regular which is what I think you mean when you say 'continuous'. Continuous might just mean continuing with varied pace. But rhythm can also be irregular. Obviously this is bad in a heartbeat, and probably alot of music but other natural events have more complicated structures - like reading. But that irregularity &amp; complexity don't preclude rhythm in my mind. </p>
      <p>&gt; Now, some people will tell you that rhythm does not depend on motion. </p>
      <p>That sounds pretty specious to me! </p>
      <p>If somebody made a claim for visual rythym and wanted to allow for a wide variety of motions or complex motions a opposed to a single motion I would be willing to think about that.</p>
      <p>&gt; reading is an aggregation of discrete fixation-events</p>
      <p>Light is considered both a particle &amp; a wave. Reading is not light (obviously) but I am not sure that fixation events which occur between saccades preclude rhythm. Also, saccades are movement. Even if there is no motion/rhythm during a fixation event, something I am not sure is true yet*, there is the saccade itself.</p>
      <p>What makes me skeptical of the idea of rhythm isn't the objections you have brought up so far. It's the issue of 'frame'. In musical terms the 'frame' is very narrow. A moment of conciousness. In reading I wonder if the area of focus isn't too broad for the term to apply well.</p>
      <p>So am am ultimately ambivalent about the term. </p>
      <p>&gt; Quite often a stubborn/romantic apologism</p>
      <p>Romance is stubborn. It makes me laugh happily when you write stuff like this. ;-)</p>
      <p>Look, we are hijacking George's thread. </p>
      <p>George, I think your term 'interractions' is decent and covers the needed idea. But Hrant's term 'Notan' seems the richest and most satisfying to me for many many reasons not least of which because it is a term which is all about looking, noticing, and making your own judgement - a responsibility that can't ever be shirked in favor of typographic dogma of any stripe.</p>
      <p>*Hrant, If I am going to keep argueing with you about this kind of stuff I had better start reading some primary scientific literature!</p>
