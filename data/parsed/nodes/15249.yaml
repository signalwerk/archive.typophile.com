      <p>I like what you've done. I still wonder on the little flatop on the head serifs. It seems like a sub visible design element until the type gets to a size where this*feature* becomes odd. It just seems out of character. I don't see it being a result of ductus or of function or of style.</p>
      <p>Decenders: You've set with generous leading, because you must to prevent clashing. If this truely is for extended reading, consider heading down the slippery slope about 15%. It will still be elegant I promise.</p>
      <p>r: Did you modify this since last time? Hard to tell since I deleted the pdf I downloaded before. Anyhow, I like how you've dropped the connection down (compared to an n). And I like how you've tried to introduce more white space by raking back the head serif. I think you've overdone it a tad though. Consider bringing it back touch.</p>
      <p>Punctuation: Show some ductus, ie more diamond, less circle. It should reflect the angle of the *pen* used to create the leg of the n. It seems like slightly rounding the corners (or bowing the sides) will fit nicely with your serif treatments. You might start with the comma. Instead of a dot with a hook, try an arc as created by your *pen* And keep it nice and long. One critique I've received and seen repeatedly at critiques from Matthew Carter and Akira Kobayashi is "make the comma longer for text."</p>
      <p>Looking forward to caps and italic. This is a very elegant face. Well done so far.</p>
      <p>R</p>
