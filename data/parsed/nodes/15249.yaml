      <p>George</p>
      <p>The old-face irregularities in this font give it a pleasant warmth and – I agree with Chris G – make for a comfortable read. I would counsel against over-polishing it, as digital tools tend to encourage. The one thing that caught my eye (in a negative sense) in the test setting was the y. I wonder if the counter isn't just a tad small and contributing to the sensation that the long diagonal is too long ... in detail the terminal also seems tentative; unresolved in the context of the decisive and crisply cut serifs elsewhere in the face</p>
