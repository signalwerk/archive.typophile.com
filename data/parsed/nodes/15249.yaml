      <p>Miss Tiffany,<br>
      This isn't a revival of any design but rather a type developed independently, within the framework that Griffo invented: the motivation behind the letterform is roman-calligraphic, but this motivation is expressed through typographic marks, including typographically shaped serifs.  Rather than ideas I have brought my taste to the design.  Originality hasn't been a aim, though mamillius does have a character in text different to those of existing types.  And I think those concavities were pretty gross.<br>
      George</p>
