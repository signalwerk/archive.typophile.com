      <p>&gt; I haven’t kept old PDFs, or indeed dated backups.</p>
      <p>How extraodinarily naughty! You could change your habits now of course...</p>
      <p>As before take all of this with the understanding that there are lots of folks here who know far more than I but with that said:</p>
      <p>I was thinking about a face like this and it's connection to metal type and thinking that it would be a good idea now to decide if you are going to make different designs for different sizes, something I think would add to the value of the project, and if so pick a size to work into first. Then you can make it behave for that size and not try to straddle to many purposes at once. </p>
      <p>I also think that it's time for you to start thinking about interletter spacing and shapes at once. Even though you have been doing a great job in general there is just as much to accomplish in the spaces where letters are not as in where they are. And I don't just mean the bowls &amp; counters. And I don't just mean kerning, I mean that you should design the spaces that occur in between the letters. It's a different way of looking at the whole thing. Some folks would say that letter shapes should be done with those spaces in mind. I would be in that crowd.</p>
      <p>The used to be a nice teaching flash file on Typophile from Jonathan Hoefler that dealt with this. But the link to it is broken.</p>
      <p>If you want I'll point you at threads that deal with this idea &amp; other resources.</p>
      <p>Also, Have you been here? </p>
      <p><a href="https://web.archive.org/web/20150204032024/http://briem.ismennt.is/index.htm" title="http://briem.ismennt.is/index.htm">http://briem.ismennt.is/index.htm</a> </p>
      <p>It's pretty cool.</p>
