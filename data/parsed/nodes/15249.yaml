      <p>Dunno if I'm repeating anyone else's comments, so many apologies if I am.<br>
      The descender of the "y" gets pretty heavy. Maybe the right side of it could be taken in a little bit?<br>
      The bottom of the "g" looks a little flat; maybe tweak the curves leading to the point to give it a bit more curve.<br>
      The "j", "b", and "l" look a little heavy in context. Don't be afraid to make some of your verticals lighter than others; there are some "tricks of the light" which should be compensated for, even at the rsk of consistency of construction. (I have discovered this on even very constructed sans serif fonts.)<br>
      The "v", "w", and "x" look a little light in context.<br>
      The top of the "a" seems to be overreaching, but it works very well. I like it a lot.<br>
      The cap "I" looks light in context. Caps benefit from some additional thickness.<br>
      Keep rocking.</p>
