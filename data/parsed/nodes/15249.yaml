      <p>Eben and Hrant, this is interesting. I agree that Mamillius is missing something, no doubt several somethings, and I think one is white "rythm". But what genuinely accurate phrase should replace "rythm" there? An adequate name for it would also be a description of it. Smeijers' 'Counterpunch' has the beginnings of a description of white harmony through the reuse of counterpunches. But presumably there's a whole world of different kinds of white interractions, just as there is of black, and a big part of the problem for the novice is that the shapes involved are so different (that most are composite is a smaller and more obvious difficulty).<br>
      George</p>
