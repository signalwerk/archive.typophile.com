    html: "<p>Hi. Another voice of approval for the design and warmth here. It feels organic, like twigs growing unhurredly in the summer sun. I like how you've reinterpreted the classic Aldine by harmonizing it with notes from the endearingly wobbly Goudy; I particularly like its subtle, angular Jenson (Centaur, really) influence. Overall, it's a rather successful design, modulo a few letter sequences: the round, slightly bowed h/m/n combined with the angular e are stylistically jarring, for example -- Bembo vs. Centaur. But the overall effect is excellent, and I'd really like to see the UC and italic.</p>"
