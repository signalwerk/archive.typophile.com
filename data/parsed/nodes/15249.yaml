      <p>I totally understand deciding to put a project down - especially if you have decided that the ideas that originally informed the project are no longer ones you can get behind. Not fully grasping your current ideas &amp; insights I can't say I approve or disapprove ( not that I have a say ) but Like Hrant I respect your choice. It can't have been easy. I aught to confess that I have discovered that some of the faults I was finding with your font had to with my printer not with your font! But in general it's true that I find the GoudyModern-like direction gets tiresome over longer reading. I would have been keen to peek over your shoulder if your had decided to reform your face in one way or another. The material is new enough to me to be very interesting. Since I will not have that oppotunity ; would you be willing to show me some of the examples ( or point to them on the net or in books) you are referring to? I would also appreciate any additional insights you have or erecomendations on source material.</p>
