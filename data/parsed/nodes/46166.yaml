      <p>Yes, the idea is to minimize kerning by implementing a proper spacing from the get go. My main concern was applications and mediums which don't have sophisticated text rendering. Think of text messaging for example. But also, it seems that kerning chews a lot of CPU activities and slows down the process. I don't have scientific knowledge about it but in my experience it certainly feels that way.<br>
      So if we are designing fonts for high end publishing environment, it really doesn't matter. But if the intention is a general purpose font, minimizing kerning to strict minimum is important.<br>
      As I said earlier, I'm not a coder and have no knowledge about programming whatsoever. So I can't initiate a topic revolving the design of an Arabic script font tool. This is a very good idea though but it should be initiated by someone who actually intends to make a tool. Then we can all contribute and give our inputs for such project.</p>
