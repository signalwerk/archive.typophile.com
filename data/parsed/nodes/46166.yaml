      <p>It seems that with FLS5 it works like it should.<br>
      There is an 'RTL' button both in the Kerning Window and in the OpenType Feature section of the Preview panel. (Though not in the Preview section of this panel.) Since FLS5's internal logic for kerning and classes goes by "1st and 2nd glyph of a pair" (in RTL mode the 1st glyph of a pair is the right one), FLS5's kerning data can be transformed (almost) 1:1 into OT feature logic, e.g. with kern2volt. So it makes sense to use the Kerning Window's RTL mode when kerning Arabic.</p>
      <p>But if you have a workflow with text patterns and tools already, then there's no need for change.</p>
