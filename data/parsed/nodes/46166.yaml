      <p>In defense of Milo's fascinating work, he has produced a *working* Arabic engine that can work as a desktop publishing software to print involved texts like historical works, complete with few involved and high end fonts.  Tasmeem is not a common commercial application like MS-Word targeting the general audience ... at least not yet. One can agree with some of your points and disagree with others, but you have to keep in mind what Tasmeem is really targeting. Personally, I like to see Open Type flourishing for Arabic. I do not like to think of Decotype format as a replacement for it. </p>
      <p>-Saad</p>
