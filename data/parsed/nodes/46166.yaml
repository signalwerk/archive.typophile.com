      <p>I'm in the middle of moving now. I'll expand this idea when I have time. But until then, suppose this:<br>
      FontLab adds an Arabic spacing tool which produce a preview of that string (it has to be expanded and include initial jeem for example).<br>
      All characters are initially set at zero side bearing on both sides (where applicable). Then you have a 'master' side bearing glider that you can manually adjust the value of "s" as the value of side bearing. As you increase this value from initial zero, it is applied to all characters of that string with a coefficient number.<br>
      That coefficient number would be 1 for right side of all characters (except jeem for which it should be 1/2). And coefficient number for the left side should be zero for all, except reh and waw for which it should be -1 and for alef for which it should be +1/2.<br>
      Now as you slide the 'master' spacing line, you stop where that string looks good! That's your spacing!<br>
      Aziz you are right. I'm Persian that's why I usually use jeh in my string too, to make sure dots are not messed up!<br>
      This is my idea of spacing setting. I usually apply it to all characters, even assorted alefs. But we have not yet discussed in this topic about the 'kerning' part, which I usually use to undue the damage after the spacing is being set.<br>
      So this scheme can be applied to any font, regardless of the thickness of the characters. Actually in my experience, bold fonts tend to need less spacing.</p>
