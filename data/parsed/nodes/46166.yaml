      <p>Re-reading Bahnam's suggestion, I see that we are probably not talking about the same thing. In my approach, all restricted letters/glyphs get extra spaces: those that do not join on left - like Raa, Dal, waw... - get extra built-in space on the left; And those that do not join at all -like Hamzah - get space on both sides.  This would apply to all shapes: initial, isolated and final. </p>
      <p>Non restricted letters/glyphs are all the rest of the letters which can be either joined on both sides, one side, or be isolated, like Haa, baa, ayn, Faa, ..etc. These all get zero or one value side bearing. Again, this would apply to all shapes: initial, medial, isolated and final.</p>
      <p>Kerning can then be applied to final shapes of restricted and some non-restricted letters like jeem ...etc, depending on style, but it would not be required.</p>
      <p>-Saad</p>
