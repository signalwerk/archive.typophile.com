      <p>As I wrote previously: 'The advent of flat ’neo-naskh’ and other typographic styles with a horizontal baseline stroke introduces a more Latin-like spacing model, in which the connecting stroke is analysable independently of the letter as a kind of spacing.'</p>
      <p>Spacing is part of a trinity of factors, along with style and size, and isn't something to which I would describe myself as having 'an approach'. The appropriate approach -- or options for possible approaches -- depends on the individual typeface.</p>
