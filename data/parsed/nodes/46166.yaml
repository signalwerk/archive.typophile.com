      <p>Note that when talking about 'spacing' in the context of Arabic, as should be plain from my comment earlier about spacing medial forms between initial lam and final alif, we need to consider both letters with actual space between them, e.g. waw followed by another letter, and also the relationship of connecting letters, i.e. the length of the connecting strokes. In the various classical styles of Arabic writing, these strokes are analysable as part of the fusion, i.e. as part of the letter in its appropriate form in a specific context. The advent of flat 'neo-naskh' and other typographic styles with a horizontal baseline stroke introduces a more Latin-like spacing model, in which the connecting stroke is analysable independently of the letter as a kind of spacing. This is demonstrated in the illustration below, in which we can say that the connecting stroke to the left of the mim is too short,  and on the right it may be too long, i.e. that it is spaced too far to the left between the two upright letters. This could be a fault in the mim glyph, in the final alif glyph, in the initial lam, or any combination of the three. [Note that I messed with the spacing to produce this illustration; the actual font is not spaced like this.]</p>
      <p><img src="/sites/default/files/old-images/MimSpacing_4662.gif"></p>
