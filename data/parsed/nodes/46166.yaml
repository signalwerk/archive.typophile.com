      <p>&gt;&gt;&gt;The appropriate approach ... depends on the individual typeface&gt;&gt;&gt;<br>
      &gt;&gt;&gt;...see yourself!&gt;&gt;&gt;</p>
      <p>True it all depends on the design, and perhaps the only way to space it correctly is to use an intuitive 'see for yourself' approach. </p>
      <p>The spacing S of an Arabic script or font whatever its style might be quantified as follows:<br>
      S= M/W<br>
      where W is the typical width of a vertical letter like the alef, and M is the minimum horizontal distance between outlines in the font. For example in square kufi where the letter-width is exactly equal to the space between letters, S=1. In the texts above the space between alef and initial yeh (or the dot of the zain and the alef, or the dal and the alef) seem to have a typically minimum space between them. </p>
      <p>Then, roughly-speaking, S=2 for the comfortably-spaced top line, S=1 for the middle and S=0.3 for the tightly squeezed bottom example.  I guess one can also use other measures for example A/W where A is the average space.</p>
