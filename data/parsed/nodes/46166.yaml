      <p>&gt;&gt;&gt;’the internal white space of Arabic letters tends to be more variable’&gt;&gt;&gt;</p>
      <p>...and even more so between one calligraphic style and another, and their equivelant manifestations in various fonts.  For example in riq'a scrip the loops of letters like waw, ain, feh and so on are all closed, and a line of such script (or font) will have a rather spindly thorny appearance.  On the other hand more geometrical Arabic fonts with strong uprights and horizontal 'spine' will appear more like a compact frieze pattern.  I think this is all fine, and other distinguishing patterns and textures will appear in the scripts and fonts of other languages . That is why I am wary of the recent 'matchmaking' trend  where Arabic fonts are forced to lose their character by following the x-height and other features of Latin fonts.</p>
      <p>Having said that I feel there must be common guidelines applicable to all fonts in any language- for example a rule of thumb comparing letter width and the space between letter-outlines? The minimum or maximum size of dots and other martks? Human vision is an amazingly sophisticated system, and reading a font is an act of seeing to which the basics of perception must apply whatever is being seen and read.</p>
