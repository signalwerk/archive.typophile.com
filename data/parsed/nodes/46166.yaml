      <p>Yes I suspected that we were not applying the spacing the same way. But the point is that if we had an "s" variant and designated coefficient for side bearing classes, we could apply it anyway we want.<br>
      Having an equal spacing on the right side of all glyphs (where applicable) would ensure a better spacing (basic) setting for a character like reh, that could use a -1 coefficient for its left side and this cut-off portion would be absorbed by "s" value of the right side of any glyph which might be at the left side of reh. A +1/2 coefficient for the left side of alef (again, as a start) also is an important part of balancing the whole thing.</p>
