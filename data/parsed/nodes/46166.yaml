      <p>&gt;&gt;If the left side bearing of all glyphs are set to zero, the right side bearing of alef would define the right side bearing of dal, reh waw and all no right joiner glyphs. </p>
      <p>I too believe this is the best course in handling spacing. I used this principle in my fonts by divining letters/glyphs (from connectivity aspect) to restricted (no right joiner included) and non-restricted.  Restricted get built-in spaces to avoid kerning. Non restricted are set to zero (or more if one design isolated glyph fonts) side bearing.  </p>
