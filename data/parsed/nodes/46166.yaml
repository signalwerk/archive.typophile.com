      <p>Since there are already several typophile threads dealing with Arabic perhaps we should ask Miss Tiffany to kindly have them moved with forwarding to this Special Interest Group.</p>
      <p>In the thread referred to by Aziz there is an image <a class="freelinking external" href="http://typophile.com/files/MRALLAH1.jpg" rel="nofollow">MRALLAH1</a> of his font. I am not an expert of Koranic script, but I liked the elegance and smooth connectivity of the font. In some places it is too tight for example in the word كفار the kaf touches the feh. However in the word كزرع the ra and zain and kasratan fit beautifully within the curves of the ain.  In fact the marks everywhere fit very nicely within the outlines. Can you tell us more about this font family - its name, number of ligatures, kerning, hinting and other features. How long did it take you to develop? Congratulations with flowers.</p>
