  html: <p>There is a wealth of experience and documentation about testing, adjusting the spacing, kerning and hinting of Latin type. <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a> has a radically different sript structure - many letters are connected, dots and marks are significant design elements, and there is a lot more variation in the shapes of glyphs within one font. Software like FontLab are geared to Latin fonts for example there is no way to test Arabic using such rules of thumb as the XOX or HOH strategies. You are invited here to share your experience in dealing with these particular aspects of Arabic fonts, with thanks.</p>
  html_clean: <p>There is a wealth of experience and documentation about testing, adjusting the spacing, kerning and hinting of Latin type. <a href="/wiki/Arabic" class="freelinking" rel="nofollow">Arabic</a> has a radically different sript structure - many letters are connected, dots and marks are significant design elements, and there is a lot more variation in the shapes of glyphs within one font. Software like FontLab are geared to Latin fonts for example there is no way to test Arabic using such rules of thumb as the XOX or HOH strategies. You are invited here to share your experience in dealing with these particular aspects of Arabic fonts, with thanks.</p>
