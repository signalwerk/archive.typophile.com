    html: <p>As I wrote, 'the internal white space of Arabic letters tends to be more variable', so you can't use the internal white space as a guide to inter-letter spacing as one can, to a certain extent, with Latin. This is why I start with the simple upright letters, because they enable one to establish a basic rhythm within which the more complex shapes can be optically spaced. In Latin script there are also letters, such as a and s, that can only be spaced by eye within the general rhythm established by other letters; in Arabic, there are simply more such letters.</p>
