      <p>Well, this is my contribution, for however wants to implement it in a tool!</p>
      <p>I've been away from Iran too far and for too long to have any relevant information. But my instinct says that if the original manuscript of Khayyam existed, every single Iranian would have known it! In a region with a long history of far too many wars and far too many burnt cities and libraries, it is highly unlikely that we ever see the original manuscript of any great writer. But the manuscript of Oxford library seems to be one of credible references.<br>
      <a href="http://www.bestirantravel.com/culture/poetry/khayam_old.html" title="http://www.bestirantravel.com/culture/poetry/khayam_old.html">http://www.bestirantravel.com/culture/poetry/khayam_old.html</a><br>
      Edward Fitzgerald, as you mentioned, was a poet who made poetry based on his inspiration of Khayyam. I guess this is the best way to put it, and perhaps the only way to translate Persian poetry. Khayyam could not be known in English literary if it was otherwise. So I personally don't see this free style of translation as a fallback.<br>
      Even in Persian, it was not uncommon for someone to reproduce the book of a great poet with adding one or two verses of his own, inspired by his greatness! This makes the task of authentication very difficult for researchers. But 'culturally' speaking, this is not considered a forgery. It is considered a tribute to a great poet. If a verse is good enough to be Khayyam, it is Khayyam as far as I'm concerned!</p>
