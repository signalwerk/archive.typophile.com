      It is true that under Islam geometrical patterns and scripts were prized as a sophisticated  abstract art form. This led to illegible calligraphic styles that were enjoyed as decorative puzzles. At the same time it was a period of intensive scholarship when books on science, philosophy and theology were written by skilled scribes. For those books legibility would have been important. This lead to the highly legible naskh. Later for official Ottoman government documents the highly legible ruq'a was adopted.</p>
