      <p>Tom wrote:</p>
      <p>&gt;&gt;In this approach historical Arabic script is understood as a tool for text manufacture with not so much learnability, but legibility as its primary characteristic.</p>
      <p>The historical calligraphic script was not primarily about Legibility or learnability.  It was about speed and harmony. Read what one of the fathers of Caligraphy, Barmaki, said 1000 years ago:</p>
      <p>الخط صورة روحها البيان، ويدها السرعة، وقدمها التسوية، وجوارحها معرفة الفصول</p>
      <p>Translation: Calligraphy is a living picture, whose soul is representation, hand is speed, foot is harmony, and strength is the knowledge of derived styles.</p>
      <p>&gt;&gt;With ACE, Tasmeem can handle any Arabic script style.</p>
      <p>My font Mehdi, which uses both Tatweel (kashida) (not today's common dash-like imitation) and Irsaal (final form tatweel) was implemented across 5 fonts with more that 2500 glyphs and plenty of glyph substitutions. In Tasmeem, less than 500 glyphs were needed.  Plus, users do not need to keep changing fonts and they have additional power and flexibilty. This was accomplished with a simple template on Fontlab with no letter chopping.</p>
      <p>Also, Tasmeem can keep your flowers fresh: Users can not steal fonts since they can not work outside the environment.</p>
      <p>-Saad</p>
