      <p>I agree with Saad that there is room for both Tom's Tasmeem and Aziz' Open Type naskh. Once the user has access to both, either can be used according to availability, the level of control needed and platform used. As in Latin fonts there is always room for excellence, and healthy competition can benefit typography as a whole.</p>
      <p>As I understand it Aziz has made an incredible labor of love to create a unique font family  (Wurud??) TTF (or OT?)  with artistry and precision. Let us call it a full-course naskh meal by a master chef. We look forward to the feast.</p>
      <p>Tom's Tasmeem work is an incredible labor of love consisting of the scholarly analysis of the roots of what he calls the grammar (the visual language) of Arabic writing systems and naskh in particular. This has been ingeniously implemented by the decotype team in software where such writing can be re-created naturally on the computer. In Tasmeem's naskh the user can control spacing and choose the details of various letters and markings. This flexibility applies to any other font adapted for the system, where it can be fine-tuned according to need or level of design experience. One might say Tom makes available a gleaming  futuristic kitchen; and (as soon as any techno-phobia has had a chance to wear off) guides us to effortlessly create a superb meal to taste.</p>
      <p>Aziz gives flowers. Tom gives magic tulip bulbs to instantly grow your own.</p>
