      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Arabic spacing study_6031.jpg"></div><p></p>
      <p>As John has demonstrated the the spaces between connected letters is as important as the space between unconnected ones. The figure above (using Segoe UI and some fun with Gimp) can be used to point out various aspects of spacing. </p>
      <p>The colored areas are what I have been calling 'word shape' (perhaps another term is used in typography courses?). This shape is defined both by the letter outlines and the spaces between them.  Arabic word shapes are irregular as compared to those of Latin, and arguably this helps legibility in Arabic because each word looks different than the other (an advantage erased by 'matchmaking').</p>
      <p>Referring to the numbers in the figure I propose to use the term 'space' for  1,2,4,5 defined by the distance between the edge of the letter and the left or right sidebearings. Perhaps 'baseline distance' would be a good term for the distances defined by the length of the baseline in connected letters, such as in 3 (lam and meem). A 'gap' would be the visual space such as 3 or 8 that is defined by the word-shape and it depends on the design of the letters, the baseline distances and spaces involved.</p>
      <p>-In this font the spaces 1 , 2 and 7 are all different I wonder if this is intentional?<br>
      -The gap 3 will be large even if the baseline distances are tightened to the extreme.<br>
      -The space 5 is unavoidable in most Arabic fonts (if kerning is not used) - is that similar to what Aziz was saying about the dal?<br>
      -4 and 6 are the only spaces between words here. In the Latin the spaces between the words appear more prominent.<br>
      -Final letters like the yeh, seen sad etc. leave a large gap such as 8.</p>
      <p>In a good font  the careful design of glyphs so that the gaps, spaces and baseline distances all combine to produce a pleasing balance.  What would your idea of a 'pleasing balance' be? Examples of 'good' and 'bad' fonts in this respect would be useful for discussion.</p>
