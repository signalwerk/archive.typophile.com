      <p>For a typical horizontal Arabic type, I think a similarity of approach between Latin and Arabic can be found in beginning with the spacing of upright letters, i.e. alif and lam. Start with a run of isolated alif glyphs and space them so that the overall colour produced by the rhythmic repetition of black and white is neither too heavy nor too light. In Latin type, one generally starts with letters with strong uprights but also internal white space, such as H and n, but the internal white space of Arabic letters tends to be more variable, so at this initial stage I would work with simple upright forms.</p>
      <p>اااااا</p>
      <p>Once the isolated alif has been spaced, this gives you a guide for the left side of the final alif and the right side of the isolated and initial lam. The next step is to space the medial and final form of lam and make the connections of the appropriate length, again using the isolated alifs as a visual guide.</p>
      <p>اااللل </p>
      <p>The right side spacing of the medial and final lam provide a guide for the right side of the final alif. You now have a set of guide glyphs between which you can test the spacing of left-right connecting letters, e.g.</p>
      <p>ااالهاااا</p>
      <p>As with Latin spacing, the more glyph combinations you space, the more pairs you have against which you can check new combinations or refine previous spacing.</p>
