      <p>Thank you John. This is very helpful. Common and sensible advice for spacing Latin is to try to equalize the spaces within the outlines with those between the letters. In other words the line of text should have an even texture and 'color'. This is not always possible in Arabic- for example a downward-curving ra will always leave a void above it, while a tightly knotted initial heh will always look dark however one spaces it.<br>
      هرانت<br>
      Of course this effect will vary from font to font, and can be lessened with kerning. But generally-speaking why not simply accept this basic variability in the visual density of a line of Arabic text? Aesthetic and reading comfort considerations aside, this may well prove to be an in-built aid to legibility.</p>
