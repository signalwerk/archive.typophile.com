      <p>Thanks Saad! Your refreshing reminder that calligraphy and font design are (or should be) open to change, improvement and innovation is welcome. Over the centuries Arabic calligraphy has done very well for itself and the results are the fantastic 'polished' styles of classical calligraphy, with all their in-built rules and traditions. Enter printing, and now the calligraphers feel threatened but the font-designers gradually realize that here was a new opportunity to innovate. Because of technical issues like font metrics, the visibility of displayed and printed words font designers have to explore new issues, for example spacing, and find solutions to them.  </p>
      <p>By the way the tight spacing Aziz advocates is not a necessarily bad thing. In Chinese and Japanese characters the density of strokes is very high in a given space, but it seems that the eye can read such character-words at one glance. The Arabic equivelant to these characters would be, for example, the basmala ligature.  Perhaps with such software as Tom Milo's Tasmeem where such overlapping of glyphs is possible and easy to control, old and new styles of 'tight' Arabic can be displayed.</p>
