      <p>Vladimir, </p>
      <p>Thanks for clarifying this is such nice culinary metaphors. I love cooking, you could guess as you caught me the other day baking a loaf of bread and one day I hope to present you my version of felafel! </p>
      <p>But after some soul searching, I had to come to the conclusion that I am more of model builder where Arabic is concerned. Models you normally make from fascinating objects like intriguing cars or famous  airplanes. Grammars are models of languages - mental exercises driven by fascination and curiosity, attempting structurally to understand and reproduce what can be observed. The object of analysis itself, language, is is taught by examples and learned by imitating. I felt that Arabic script should be approached from the same point of view: not as a capricious art-form irreverently called AC, but as a  communication system where senders and receivers over a period of many centuries successfully shared the code. In this approach historical Arabic script is understood as a tool for text manufacture with not so much learnability, but legibility as its primary characteristic. </p>
      <p>Azizi Aziz, </p>
      <p>Lemme try to clarify what that implies.</p>
      <p>Naskh is a historical script style. We made a computer model of it. That's all.</p>
      <p>DecoType ACE is technology to make this possible (which incidentally was the proof of concept for OpenType). It is not naskh, but a programming environment we (for I am not doing this alone) developed over the years for projects like a naskh model - the ultimate challenge.</p>
      <p>Tasmeem is Adobe In Design with ACE built into it by WinSoft, who, together with DecoType, designed a User Interface around ACE. With ACE, Tasmeem can handle any Arabic script style.</p>
      <p>ACE was first conceived as early as 1982-83 to enable the creation of a ruq`a replica. As said, the result was not so much a font, but a computer model of ruq' a. It was licensed by Microsoft around 1993. It was Microsoft who asked us to do a naskh with the same method in 1995. But not after they had first asked us in 1991-92 to provide a realistic naskh solution within their very simple design template - but I suppose that's more a topic for the other thread.</p>
      <p>InDesign is a typesetter's tool with enormous precision and many specialized controls - for Latin-based scripts. Some people just want it like that. With Tasmeem, we try to introduce this kind of precision into the field of Arabic script.</p>
      <p>Against this background, Tasmeem provides the user with tools to adjust the positioning of points and vowels. And, it provides specialized kerning and tracking controls based on the structure of Arabic - which is I believe the subject of this thread.</p>
      <p>Tom's Tasmeem (nice alliteration, but it is really WinSoft's) and Aziz’ Open Type naskh are sooner complementary than mutually exclusive.</p>
      <p>Each is in it's own league.</p>
      <p>Bulbs,</p>
      <p>t</p>
      <p>Thomas Milo<br>
      DecoType<br>
      <a href="http://www.decotype.com" title="www.decotype.com">www.decotype.com</a></p>
