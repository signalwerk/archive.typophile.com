      <p>PS. The spacing of a lot of Arabic typefaces is really bad, so trying to find good models can be difficult. We spend a lot of time on spacing (and also kerning of non connecting letters), and I think the Adobe Arabic fonts are worth looking at in this regard.</p>
      <p>A major issue re. kerning is interaction between tightly spaced letters and vocalisation marks, which need to be contextually resolved to avoid unwanted collisions. Traditionally, this is done by shifting the marks, rather than by adjusting the spacing of the letters. I think that in a typographical environment, both techniques are valid, and can be used side-by-side and even in combination. However it is done, this is major work and one of the least attractive aspects of the OpenType approach to Arabic.</p>
