    html: |-
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ArabicSpacing_3592.png"></div><br>
      I don't know if this picture can illustrate it or not. It's setting the spacing based on above mentioned scheme, and then do the corrections by kerning. BTW I don't know how to edit previously posted text and this 'undue' in my previous post is getting on my nerves!.. Miss Tiffany, would you please undo the undue for me?!<p></p>
      <p>You may notice that in picture sample, the right side bearing of alef is not following that 1/2 value of "s". It is more. In some other faces, it should be less. The point is that you only have one single variant for spacing which is "s". Then if you had 'side bearing classes' for each, depending the font face, you'd assign certain coefficient for the characters, the spacing adjustment can be controlled by variant "s" on one hand, and occasionally fine tuning the coefficient for side bearing class. I do this by creating normal classes, selecting and increasing and decreasing the side bearing. But it's hard to keep-up with every little changes you do in the value of "s". I often ignore them and later regret!<br>
      A tool with those side bearing classes in which you can set the coefficient for the class is, for Arabic spacing, a tool made in heaven! also notice initial Khah (same thing as initial jeem etc.) has reduced spacing on its right. This is because the 'weight' of the character which is toward the left, remain balanced despite the extended line to the right.<br>
      The picture is for a sample with and without kerning.<br>
      As you see, I use the same spacing for alef with madda above. And madda, particularly in Persian use, can be really substantial! but I ignore it in spacing. Same thing with what in Persian is called 'sarkash' of kaf and gaf. I ignore them in setting spacing and I apply the side bearing based on its base body. Then I do the correction in kerning.<br>
      Lately I changed this method in my fonts because most browsers don't support kerning and as you see in the picture, the text without kerning correction can't survive. So now I do apply side bearing with considering 'sarkash' and then in kerning, I apply negative value when applicable. But the first method is better (in a perfect world).<br>
      Hope it interest you,<br>
      Behnam</p>
