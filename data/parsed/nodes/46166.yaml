      <p>Vladimir</p>
      <p>In my projects, I divide Arabic letters and glyphs into two groups based on their connectivity:  restricted and un-restricted.</p>
      <p>Restricted letters can only connect from one side (Alif, Waw, Ra, Dal, ..) or never connect (Hamza). These glyphs need spaces on the left.</p>
      <p>Un-Restricted letters can connect from both sides (the rest of the letters). No spaces are need for this group on either side.  </p>
      <p>I use minimum kerning depending on project and style.</p>
      <p>-Saad</p>
