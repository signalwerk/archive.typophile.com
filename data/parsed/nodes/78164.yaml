    html: |-
      <p><cite>Looks similar, but the bowl on the lower-case "e" is shorter in Mostra Nuova and there is no serif on the lower-case "d"</cite></p>
      <p>That’s what I meant by saying ‘somewhat based on (or rather inspired by)’</p>
      <p>Maybe a poor attempt of copycatting Mostra.</p>
      <p>My 2 cents:<br>
      If the client can’t provide you with the original font (and as penn already implied this wouldn’t be that bad…), suggest to use Mostra Nuova (or another professional font in this style). Some wouldn’t notice and those who do would get it as an improvement.</p>
