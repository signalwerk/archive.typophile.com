    html: |-
      <p>The Cursive handwriting font requires individual characters to have multiple beginning and ending strokes depending on the character pair combination used in a word. Around 1992 I designed and developed the typefaces for Zaner-Bloser Publishing who had the original drawing. Because the character set was limited I developed several font and a colleague designed a custom application to switch fonts on the fly. I assume this application is very similar.<br>
      Your right Si, OpenType would have made the project more interactive.</p>
