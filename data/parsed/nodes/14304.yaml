    html: |-
      <p>Some cursive font makers (for example Signature Software) map the alternate cursive forms to upper ASCII characters (eg all those accented characters) they then use a macro to switch these alternates into a passage of text. Apart from being a bit of a hack, the text is not searchable or cut and paste-able, and if you switch fonts becomes gibberish. Another reason why OpenType is a better bet. </p>
      <p>Si</p>
