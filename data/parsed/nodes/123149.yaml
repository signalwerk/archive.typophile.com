      <div class="comment-spam-body"><p>Thanks Ryuk, for mentioning my previous comment on the lettering on the sheet music cover being hand done. I should have repeated my observation that everything on the cover is lithographed or engraved.<br>
      None of the fonts mentioned are an exact match and most are much too wide, except for Spire and possibly Bordeaux.<br>
      If anyone wants to compare the sheet music cover to Ian Party's Grazia and L'Officiel, note that the links mentioned no longer work, but a specimen of Grazia can be seen at <a href="http://typecache.com/Ian_Party/" title="http://typecache.com/Ian_Party/">http://typecache.com/Ian_Party/</a> The website <a href="http://www.ianparty.com/" title="http://www.ianparty.com/">http://www.ianparty.com/</a> is not currently available.<br>
      Don</p>
      </div>
