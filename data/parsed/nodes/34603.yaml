    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Todor Vardjiev (Todor Vardzhiev)</strong></p>
    <p>Prof. Todor Vardjiev (born in 1943 at Blagoevgrad, <a href="/wiki/Bulgaria" class="freelinking" rel="nofollow">Bulgaria</a>) is a bulgarian graphic and type designer. He was a student of <a href="/wiki/Albert%20Kapr" class="freelinking" rel="nofollow">Albert Kapr</a> and he is teaching at National Academy of Arts, Sofia. <a href="http://www.nha-bg.org" title="http://www.nha-bg.org">http://www.nha-bg.org</a></p>
