    <p>MyType </p>
    <p>Extended (May 2nd – May 18th) : Type exhibit by Canada's rising star of new modernist typography</p>
    <p>Due to popular demand, 'MyType,' an exhibit of type-based, large format posters by Noel Nanton, has been extended through to Sunday, May 18th. Nanton will also be giving a talk and walk-through tour of the exhibit on Sunday, May 18th from 4:00 pm to 5:00 pm.</p>
    <p>Nanton, who is creative director of typotherapy+design, has created a series<br>
    of original, limited-edition posters reflecting his own, very new take on classic modernist typography. Each poster is an original work of art and showcases Nanton's unique, type-based language. The posters include original, typotherapy-created fonts along with edgy takes on classics including Helvetica and<br>
    Avant Garde. </p>
    <p>Nanton has been widely recognized in Canada, Europe and Japan for his original typography and graphic design.<br>
    typotherapy+design is a boutique, Toronto-based studio specializing in typography, editorial design, branding and packaging. </p>
    <p>What: MyType, an exhibit of type-based posters by typotherapy+design creative director Noel Nanton.</p>
    <p>Where: K6C Gallery, 938 Bathurst Street (just North of Bloor) Toronto, Canada.</p>
    <p>When: Show extended to Sunday, May 18th. Designer Noel Nanton will be<br>
    giving a talk and walk-through tour of the exhibit on Sunday, May 18th from 4:00 to 5:00 pm</p>
    <p> <a href="http://www.typotherapy.com" title="www.typotherapy.com">www.typotherapy.com</a>, <a href="http://www.keep6c.com" title="www.keep6c.com">www.keep6c.com</a></p>
    <p>For more information, please contact<br>
    Kate Cassidy at <a href="mailto:kate@typotherapy.com">kate@typotherapy.com</a></p>
