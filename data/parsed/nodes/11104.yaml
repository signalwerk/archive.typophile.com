  html: <p>The Society of Typographic Aficionados (SOTA) has announced plans for its fourth annual conference. To be held in Toronto, Ontario, Canada, TypeCon2002 will feature exciting presentations and educational workshops from a select group of type and design industry innovators. <br> <br>TypeCon 2002 will take place from July 12-14 at the Courtyard by Marriott in downtown Toronto. Conference activities will begin Friday morning and run through Sunday evening. Further details on participants and programming will be announced soon. <br> <br>TypeCon2002 is presented by the not-for-profit Society of Typographic Aficionados, an international organization dedicated to the promotion, study, and support of typography and related arts. The conference is attractively priced, with discounts given to students and current SOTA members. A one-year membership to SOTA is included in the price of conference admission. An additional discount is offered to those registering for the conference prior to May 1, 2002. <br> <br>Secure online registration and opt-in subscription for the conference email announcement list are now available on the conference web site. Sponsorship opportunities and vendor tables are still available. <br> <br>Further information about TypeCon2002 may be obtained at <a href="http://www.typecon2002.com" target="_top">http://www.typecon2002.com</a>, or by email at <a href="mailto:info@typecon2002.com">info@typecon2002.com</a>. For more information about SOTA, please visit the website at <a href="http://www.typesociety.org" target="_top">http://www.typesociety.org</a>, or email <a href="mailto:info@typesociety.org">info@typesociety.org</a>.</p>
