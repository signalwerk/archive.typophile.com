  html: |-
    <p>Today, James completed this totally amazing nameplate for a custom bass guitar. The mother of pearl shell is .060" thick and he used a jeweller's saw to cut the letters completely through the shell. Then the sawn out sections are filled with a mixture of epoxy and ebony dust. </p>
    <p>The plate is to be installed on a fingerboard with a twelve inch radius, so the form will distort a little after shaping. On the next one, I'll correct the artwork to allow for this final step.</p>
