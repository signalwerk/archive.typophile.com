    html: <p>the S is a bit top heavy, the B is too shy/narrow. the E too wide. i think generally the optical height isn't well adjusted yet. look at the word DESCENDER - the E letters appear to be heavier than the others.  <br>i like the lowercase better than the capitals. s is also a bit top heavy and leaning backwards. <br> <br>is "yeah" your real name?  <br>and welcome to typophile.</p>
