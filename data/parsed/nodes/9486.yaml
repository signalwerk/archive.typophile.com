  html: "<p>I've got a long business document to format. It contains many acronyms. <br> <br>The source text, which I received in Microsoft Word format, uses full caps for all the acronyms. I think small caps would be better, but am encountering the following problems: <br> <br>* Some of the acronyms are pluralised. For example, Local Authoritity is abbreviated to LA, but the text often refers to more than one and uses the term LAs. When I set this in small caps, it looks like LAS, which is no good. <br> <br>* Acronyms will occasionally start a sentence. To me, starting a sentence in small caps looks wrong. But using a full cap for the initial, followed by small caps, looks weird too. <br> <br>Ideas? I did try a search and Bringhurst, but there's no satisfactory conclusion. Some mention was given of faces with two different small cap heights, to overcome this problem (I think Mrs Eaves was cited). Can anyone show me what this looks like?</p>"
  html_clean: "<p>I've got a long business document to format. It contains many acronyms. <br> <br>The source text, which I received in Microsoft Word format, uses full caps for all the acronyms. I think small caps would be better, but am encountering the following problems: <br> <br>* Some of the acronyms are pluralised. For example, Local Authoritity is abbreviated to LA, but the text often refers to more than one and uses the term LAs. When I set this in small caps, it looks like LAS, which is no good. <br> <br>* Acronyms will occasionally start a sentence. To me, starting a sentence in small caps looks wrong. But using a full cap for the initial, followed by small caps, looks weird too. <br> <br>Ideas? I did try a search and Bringhurst, but there's no satisfactory conclusion. Some mention was given of faces with two different small cap heights, to overcome this problem (I think Mrs Eaves was cited). Can anyone show me what this looks like?</p>"
