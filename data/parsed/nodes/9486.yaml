    html: <p>I always thought that small caps were supposed to be level with the x-height. The only reason why they recently have not, was because people used shrunken caps and if they did it at the x-height then it would be way to thin. Of course doing it at 70% also thins it out but isn't as bad as doing it at the x-height.</p>
