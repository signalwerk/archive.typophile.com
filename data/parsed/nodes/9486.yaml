    html: "<p>Raphael, it seems you're talking about \"optimal\" <i>fake</i> caps, while the main issue here deals with fonts which have smallcaps provided... But come to think of it, Nick's idea of doing some \"fake\" stuff with the true smallcaps might be just the thing!  :-) <br> <br>Nick, I think larger apparent size certainly helps, but it's not enough - sort of how an upright italic doesn't work for emphasis: cursiveness usually helps, but alone it's too weak. Consider the \"LAs\" example: the lc \"s\" being a bit narrower than the SC one would not resolve the confusion. <br> <br>hhp</p>"
    html_clean: "<p>Raphael, it seems you're talking about \"optimal\" <i>fake</i> caps, while the main issue here deals with fonts which have smallcaps provided... But come to think of it, Nick's idea of doing some \"fake\" stuff with the true smallcaps might be just the thing!  :-) <br> <br>Nick, I think larger apparent size certainly helps, but it's not enough - sort of how an upright italic doesn't work for emphasis: cursiveness usually helps, but alone it's too weak. Consider the \"LAs\" example: the lc \"s\" being a bit narrower than the SC one would not resolve the confusion. <br> <br>hhp</p>"
