    html: <p>No, I was meaning real small caps. I was saying that according to my understanding people have got used to small caps being larger than the x-height because people used fake small caps and that fake small caps were larger than they "should be" because to make them the "correct" size would make them too thin. <br> <br>Of course it was always my understanding that true small caps were supposed to be x-height without really thinking about why I thought that. I would be interested to know where small caps came from and what their original use was.</p>
    html_clean: <p>No, I was meaning real small caps. I was saying that according to my understanding people have got used to small caps being larger than the x-height because people used fake small caps and that fake small caps were larger than they "should be" because to make them the "correct" size would make them too thin. <br> <br>Of course it was always my understanding that true small caps were supposed to be x-height without really thinking about why I thought that. I would be interested to know where small caps came from and what their original use was.</p>
