    votes: null
    html: '<p>Small caps go way back, as a form of contrast. Before there were sans serifs, or bold faces, and when it was a real pain to change size, printers would use the four main styles: Roman Caps, RomanU&amp;lc, Roman SC, Italic U&amp;lc, as their "palette" of tonality.</p>'
    html_clean: '<p>Small caps go way back, as a form of contrast. Before there were sans serifs, or bold faces, and when it was a real pain to change size, printers would use the four main styles: Roman Caps, RomanU&amp;lc, Roman SC, Italic U&amp;lc, as their "palette" of tonality.</p>'
