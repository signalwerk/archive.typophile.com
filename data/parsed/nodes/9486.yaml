    html: <p>&lt;font class="dontLookLikeCrap"&gt;I just finished typesetting a 180 pg academic text in Adobe Caslon (the new-ish pro OTF version). Tremendous number of acronyms, and, unfortunately, many in quoted text, which had to be set in italics. The font lacks an italic SC so I had to use 16-degree-obliqued smallcaps, slightly fudged to match the weight of the italic - you don't want to know what I had to do. <br> <br>I love this face but the small-cap height is too low and the plural acronym problem came up again and again. <br> <br>Unfortunately FF Atma would likely cost me several dozen hours' worth of wages and I just can't afford the investment now, so I end up with another, perhaps finer (that is, finer than, say, "fake" smallcaps), but still less-than perfect way of kludging it. <br> <br>The other face I'd really like to be using for book work is Mark van Bronkhorst's wonderful Verdigris family, but it doesn't yet have all the features I need it to.</p>
