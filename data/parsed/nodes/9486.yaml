    html: "<p>&gt; When I set this in small caps, it looks like LAS, which is no good. <br> <br>Which is why smallcaps are best when they're visibly taller than the lc x-height. Unfortunately most fonts have smallcaps that are too short. BTW, many people put an apostrophe when pluralizing an acronym, but I think that's a sad fallback. <br> <br>As for the initial-acronym situation, I certainly wouldn't \"capitalize\" it! You might just use full-caps there, especially if your font has smallish smallcaps. <br> <br>BTW, the richest font I know in terms of smallcaps is FF Atma: <br><a href=\"http://www.myfonts.com/fonts/fontfont/atma-serif/\" target=\"_blank\">http://www.myfonts.com/fonts/fontfont/atma-serif/</a> <br>And it's decently spaced. <br> <br>hhp</p>"
