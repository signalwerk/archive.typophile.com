    html: "<p>I usually make my small caps larger than x-height, more so if the x-height is small. There is a lot of historical precedent for this, Rafael.  <br> <br>But I don't think there is a formula. Goudy even made the SC of Italian Oldstyle smaller than the LC x-height (what a show-off), and it looked OK. So that's worth examining, and it confirms that a glyph contains a sense of scale.  <br> <br>Italian Old Style (the metal version) has very small counters in the bowls of the a and e, and is very tightly fitted. If you compare the counters in the SC \"E\" with that in the \"e\", they are of a similar size. And the SC is openly fitted (ie it looks \"tracked out\"). So the LC looks like a bigger \"optical size\" setting than it really is, and the SC look like a very small optical size setting of a cap. Hence they work together. (This beforesaid concerns the sense of scale of proportion for letter stem lengths and negative space; detailing such as stem and serif thicknesses is more about consistency of absolute values between SC and LC.)  <br> <br>So, if a typeface has small caps that look too small when they are set beside the lower case, they are not well designed. If a typographer is going to tinker with the setting to compensate for this, I would suggest combining three imperceptible adjustments:  <br>1) increase the SC size by a fraction of a point, such as 0.2. <br>2) increase the tracking of the small caps, possibly by quite a lot. <br>3) increase the horizontal scaling of the SC by a couple of percentage points.This is a technique that digital type designers often use when they are developing their small caps from the big uns, but you might decide a little more is required. <br> <br>There is not necessarily anything wrong with a typeface if you feel it is necessary to do this; it may be that some typefaces require a little more effort to work with than others of more easy virtue, or that typefaces not naturally suited to the requirements of a typographer or a project require some special treatment. Massaging a reluctant typeface to the requirements of a project can often result in more distinguished work than going with the most obvious or most comfortable choice. <br> <br>By way of a test to determine how thorough a typeface design really is, set the three \"O\"s (cap, sc, and lc) and the two zeros (lining and oldstyle) beside each other and compare how differentiated they are with how well they harmonize.</p>"
