      <p>I must say I really like them both, but I love Beast. I'm super interested to see it finished. The little "outgrowths," as you're calling them, are great. Adds a lot of flavor to the face. The /a/ in particular is a beautiful little nugget.<br>
      Candy is also really nice. It seems to flow well, but of course I'd have to see a lot more of it to gauge that accurately. I've always been a fan of the heavier style of font, and these are right up my alley. Really nice work.</p>
