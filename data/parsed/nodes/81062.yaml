    <p>I have been very interested in typography for a long time, and have only recently decided to start working towards actually completing a font. These are two projects I'm working on right now. They are both unicase (I really like unicase fonts) - other than that, I think they pretty much speak for themselves. The first one may be a bit ambitious, but hey, let me know what you think! Even if you think it isn't very good. I just want some perspective.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BEAST-01-01_6411.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CANDY-01_6106.png"></div><p></p>
