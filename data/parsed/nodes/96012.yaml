      <p>I like the conversation "n" and "o" are starting - it's actually quite promising.</p>
      <p>The "c" actually seems not too far from a decent form; the "e" though needs to be rethought.</p>
      <p>My main question would be: how "dorky" do you want this to be? Do you want the overall texture to be dorky (due mostly to those nice heavy serifs) or do you want individual glyphs to stand out as dorky? If it's the latter, I would say keep the unusually low and left-sitting tittle, the too-heavy beak of the "r", etc.</p>
      <p>hhp</p>
