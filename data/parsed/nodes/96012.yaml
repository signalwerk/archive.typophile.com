    <p>Hey folks. I'm starting to learn type design and would love some feedback on what I've got so far.</p>
    <p>I'm (obviously) having difficulty with 'c' and even more difficulty with 'e'. There are probably even more flaws that I'm just not seeing right now, but once they are pointed out to me I'll be able to improve.</p>
    <p>All criticism is greatly appreciated, thank you!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Bucko_4460.gif"></div><p></p>
