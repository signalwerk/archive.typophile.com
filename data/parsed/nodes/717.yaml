    html: <p>Beware laser printers that are not true PostScript. Most low-cost ones out there are PostScript emulators. When I was in the market for a new printer a couple of years ago, after the death of my beloved Personal NTR, I went through a hellish process of trying to find a reasonably priced laser with real PostScript. <br> <br>The problem is that most salespeople have absolutely no idea what the difference is, and some manufacturers are not totally up-front about the fact that theirs is an emulator. I bought a couple and then returned them, after discovering that the emulation was beyond awful. <br> <br>I finally ended up finding a used Apple 16/600 (which is very similar -- if not identical, structurally -- to an HP 5MP, I believe), and it creaks a little, but I'm plenty satisfied. I paid $225 for it.</p>
    html_clean: <p>Beware laser printers that are not true PostScript. Most low-cost ones out there are PostScript emulators. When I was in the market for a new printer a couple of years ago, after the death of my beloved Personal NTR, I went through a hellish process of trying to find a reasonably priced laser with real PostScript. <br> <br>The problem is that most salespeople have absolutely no idea what the difference is, and some manufacturers are not totally up-front about the fact that theirs is an emulator. I bought a couple and then returned them, after discovering that the emulation was beyond awful. <br> <br>I finally ended up finding a used Apple 16/600 (which is very similar -- if not identical, structurally -- to an HP 5MP, I believe), and it creaks a little, but I'm plenty satisfied. I paid $225 for it.</p>
  - id: 5026
