    html: <p>You can't really use an inkjet to proof your type; the output is invariably heavier no matter how good the paper is. Even a laser can be quite unpredictable. You have to always keep the toner at a reasonable level, otherwise it is hard to have a consistent distribution of toner on the page. I have an HP LaserJet 6MP. It's 600 dpi and it served me well for seven years, but I could do with a better machine. You can pick up a 1200 x 1200 dpi HP for well under $1000 now, so don't go for a used one.</p>
