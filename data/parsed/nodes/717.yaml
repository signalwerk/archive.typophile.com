    html: <p>I have a non-PS HP LaserJet 3200, a letter-size non-duplexing unit with fax and (sheetfed) scan capabilities, bought three years ago for $350 or so. There's an M version with Postscript as well, but I was too dumb to get it. Not big enough at this point, but the 1200dpi output is gorgeous and the toner cartridge has a fair capacity. <br> <br>About a week ago I bought a Lexmark C720 for a steal. The C means color. The color isn't too good, and there's only a black cartridge in it now (CMY will be an extra $600!) but it's PS so I can finally print from my Mac, hallelujah. <br> <br>The best PS printers these days are Xerox. Lexmark is also good. AVOID HP. They have gone WAY downhill... especially their PC printers, which install some crazy proprietary print driver that bypasses all of Windows' own print UI. Just give me pure, unfutzed-with Postscript 3, thank you.</p>
    html_clean: <p>I have a non-PS HP LaserJet 3200, a letter-size non-duplexing unit with fax and (sheetfed) scan capabilities, bought three years ago for $350 or so. There's an M version with Postscript as well, but I was too dumb to get it. Not big enough at this point, but the 1200dpi output is gorgeous and the toner cartridge has a fair capacity. <br> <br>About a week ago I bought a Lexmark C720 for a steal. The C means color. The color isn't too good, and there's only a black cartridge in it now (CMY will be an extra $600!) but it's PS so I can finally print from my Mac, hallelujah. <br> <br>The best PS printers these days are Xerox. Lexmark is also good. AVOID HP. They have gone WAY downhill... especially their PC printers, which install some crazy proprietary print driver that bypasses all of Windows' own print UI. Just give me pure, unfutzed-with Postscript 3, thank you.</p>
