  html: <p>Howdy. <br> <br>So I am really fed up with trying to proof my designs on an  <br>inkjet. Anybody have any suggestions on a good laser that I  <br>can get reliable prints from? I want to spend less than  <br>$1000. I'd like to spend a lot less if that's possible. I'd  <br>definately consider a used machine. <br> <br>Currently I'm going to Kinkos and chucking coins into the  <br>machine (a Xerox 4050 or something - pretty good). <br> <br>Thanks, <br>Randy</p>
