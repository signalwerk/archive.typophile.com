    html: <p>Good point; the darkening is much more severe with small point sizes. <br> <br>I have attached two versions, one at actual size (at 72 dpi) and one close up. I think that they will give an idea of the difference. I had to get rid of the paper texture (the printed example was on very textured paper) but I tried to keep the type from bulging. I hope these examples appear. I have never posted to a forum before yesterday, and am a little new to this. <br> <br>The details (in my opinion) are captured well (except for very fine differences) however the feeling is generally darker. This can be a problem when you are dealing with the color of the text in comparison with other graphic elements, or very large type (which looks impecable) with small type. <br> <br><img src="http://www.typophile.com/forums/messages/4101/24603.jpg" alt="actual size -- 2400 dpi"><img src="http://www.typophile.com/forums/messages/4101/24604.jpg" alt="actual size -- 1200 dpi"> <br> <br><img src="http://www.typophile.com/forums/messages/4101/24605.jpg" alt="close up -- 2400 dpi"> <br><img src="http://www.typophile.com/forums/messages/4101/24606.jpg" alt="close up -- 1200 dpi"> <br> <br>However, despite these shortcomings, I am still very pleased with the printer. When we print out first pages for a book, it takes only 1 hour, with no printing errors (aside from our own). This is in comparison to the day and a half we used to have to set aside for printing on our ink jet... and I cringe to think of all of the streaked sheets... and the cost of ink! <br> <br>I hope all this helps, <br>Robert <br> <br>P.S. I actually have been wondering about something related to this topic and I wonder if anyone has any thoughts...  <br> <br>Has the direct-to-plate technology changed the thickness and color of type (made it thicker)?  <br> <br>I have wondered about how the films (which are negatives) made type thinner, especially thin lines. However, direct-to-plate, which I think is more similar to a laser printer, dosen't go through the negative step, and may reseult in thicker type. Or type that is more like laser output.</p>
