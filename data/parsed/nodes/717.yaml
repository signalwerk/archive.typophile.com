  - id: 5030
    user: 1947
    date: 2003-08-11T08:42:00
    date_raw: 11 Aug 2003 — 8:42am
    votes: null
    html: '<p>&gt; <br> <br> &gt; How big is the difference between 1200 and 2400? &gt; <br> <br>A big difference. <br> <br>&gt; More than the rendering of details, what seems to change most &gt; significantly with resolution &gt; is typographic color: lower resolutions come out darker. Is 2400 much &gt; lighter than 1200? <br> <br>2400 is slightly lighter than 1200, (very close to how the type looks at repro resolutions) but the real difference is in the detailing. Shapes and forms that create "spots" in lower resolutions look cleaner at 2400. <br> <br>Conversely type color that looks even at 600 or 1200 looks spotty at 2400. <br> <br>An "unnamed" cut of Akzeiden Grotesk I once proofed at 600 looked great, but at 2400 it looked terrible. It looked terrible in film as well.</p>'
    html_clean: '<p>&gt; <br> <br> &gt; How big is the difference between 1200 and 2400? &gt; <br> <br>A big difference. <br> <br>&gt; More than the rendering of details, what seems to change most &gt; significantly with resolution &gt; is typographic color: lower resolutions come out darker. Is 2400 much &gt; lighter than 1200? <br> <br>2400 is slightly lighter than 1200, (very close to how the type looks at repro resolutions) but the real difference is in the detailing. Shapes and forms that create "spots" in lower resolutions look cleaner at 2400. <br> <br>Conversely type color that looks even at 600 or 1200 looks spotty at 2400. <br> <br>An "unnamed" cut of Akzeiden Grotesk I once proofed at 600 looked great, but at 2400 it looked terrible. It looked terrible in film as well.</p>'
