    html: "<p>My pleasure. It was interesting to see the difference. You're right, it is enormous. <br> <br>Yes, left/top are from actual printed examples. NB: I think I forgot to sharpen the 1200 dpi blown up version. <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/24620.jpg\" alt=\"blowup sharpened -- 1200 dpi\"> <br> <br>I think that the point size is 9 pt, but it is Perpetua, which looks small. I would have to go look in the backups for the exact size. The first examples shows the images at the visual size. The blown-up versions are more for fun.  <br> <br>I've meet people who claim that 600 dpi is good enough... but I think that this examples disproves that theory. <br> <br>Also, I should mention that we've noticed that the thicker the paper used, the greater the difference. That is: Thicker paper = thicker type. <br> <br>Good day, <br>Robert</p>"
