    <p>Hi guys,</p>
    <p>I'm trying to ID the chapter title font Rockstar have used in L.A. Noire, the game has some lovely use of typefaces scattered around the city but this one stands out.</p>
    <p><a href="http://media.multiplayer.it/thumbs/images/2011/05/16/la_noire_screenshot_363_jpg_640x360_upscale_watermark-small_q85.jpg" title="http://media.multiplayer.it/thumbs/images/2011/05/16/la_noire_screenshot_363_jpg_640x360_upscale_watermark-small_q85.jpg">http://media.multiplayer.it/thumbs/images/2011/05/16/la_noire_screenshot...</a><br>
    <a href="http://images1.wikia.nocookie.net/__cb20110518224142/lanoire/images/9/96/UponReflection.jpg" title="http://images1.wikia.nocookie.net/__cb20110518224142/lanoire/images/9/96/UponReflection.jpg">http://images1.wikia.nocookie.net/__cb20110518224142/lanoire/images/9/96...</a><br>
    <a href="http://images4.wikia.nocookie.net/__cb20110520194017/lanoire/images/0/06/TheGoldenButterfly.jpg" title="http://images4.wikia.nocookie.net/__cb20110520194017/lanoire/images/0/06/TheGoldenButterfly.jpg">http://images4.wikia.nocookie.net/__cb20110520194017/lanoire/images/0/06...</a></p>
    <p>It's slightly extruded.</p>
    <p>I thought it maybe Knockout, or Trade Gothic Condensed.  But I'm not entirely confident...</p>
    <p>Any help appreciated!</p>
