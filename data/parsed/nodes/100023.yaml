    html: |-
      <p>Making one language grey will automatically demote it and give it second place, so it’s not something I would do, unless that was intended. Here in Canada I would never deal with French and English together that way.</p>
      <p>For photo captions, your bits of text should be relatively short. What you need to do is keep the text in the two languages of equal visual colour, yet keep them distinct from each other. Going roman/italic is one solution. You could also go serif/sans. I wouldn’t worry about varying text lengths as you can accommodate them in your design; again, it’s the overall text colour I’d be more concerned about, so that one language doesn’t dominate the other.</p>
      <p>Another solution would be simple placement. Put enough space between the two captions so it doesn’t look like the reader should read on from the other and keep the positions of the captions consistent in relation to the photographs. Not knowing the nature of the photos or the trim size of the book, it’s difficult to be more specific, but a left/right or top left/bottom right arrangement could work in the right design.</p>
    html_clean: |-
