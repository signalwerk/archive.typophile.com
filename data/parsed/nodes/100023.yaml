    html: <p>Are the two languages appearing on the same page, or only on facing pages? What are the languages? Is one of the languages predominate in the sense of being the original language of the text or the language of the principle audience for the book (this can be the case, for example, in bilingual literary texts or scholarly editions). If the two languages are to be considered of equal importance, then you need to come up with a solution that doesn't give the impression of making one primary, e.g. by setting it in roman (regular) type and the other in italics.</p>
