    html: |-
      <p>I've done a number of these including a three-volume trilingual series. John pretty much nailed it. As long as there is no confusion about which language you're in as you read (&amp; that in itself would be a strange notion), why would you want to graphically say, "Boy, these languages are different"? Only if you can come up with a reason in a particular case, does the idea makes sense.</p>
      <p>There are other problems, usually one language is not as efficient as the other, so if you're going to maintain basically the same place on the page with a side-by-side presentation, you have that problem to address. It's easier to solve if you keep one language on the verso, one on the recto. If the trim is large &amp; two columns would work, that's an option, too. If you want the simultaneity across the page/spread really tight, set ragged.</p>
      <p>Footnotes, if used, can be a factor. Here's an example. The poetry volume in that tri-lingual series was trouble. Basically, the languages used were indigenous, English, and Spanish The editorial decision was to have the footnotes in both English and Spanish for the indigenous language, and then English with the English &amp; Spanish for the Spanish. As a design, it It would have been easy to just have four columns &amp; handle things that way, but the editors decided differently (&amp; wrongly, I felt).</p>
      <p>In another book I did, English was so much more efficeient that we set all the footnotes on the "English" page. Depends on how many &amp; how complex the footnotes are. </p>
      <p>Etc.</p>
      <p>So, I think a word in your thread title is important: <strong> editorial</strong>. The languages themselves in simultaneous presentations aren't really a graphical problem, but the layout can be greatly eased if the editors work with the designer.</p>
      <p>FWIW</p>
