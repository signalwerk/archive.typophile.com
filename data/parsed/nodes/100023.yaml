    html: |-
      <p>If you are able to maintain consistent positioning of the two language texts relative to the images to which they relate, I don't think you need any typographic distinction between them. The reader will quickly attune to the positioning convention, and immediately locate his or her language on each page.</p>
      <p>If you find you do need to make a typographic distinction, consider pair serif and sans serif, since most of the text  per page is presumably quite short.</p>
