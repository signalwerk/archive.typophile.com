    html: |-
      <p>Find out which language sets longer (if any). If one language is longer, choose a typeface with an italic that has a greater character count per pica.</p>
      <p>Also, try and make the layout consistent, so that when readers turn the page, they are anticipating seeing their language in “its” place. If you achieve this, it might be possible to use the same spec for both languages.</p>
      <p>I don’t like greying type (unless with a spot color) because it kills the sharpness of the type.</p>
