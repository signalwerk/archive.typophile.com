    html: |-
      <blockquote><p>the principal is the spanish.</p></blockquote>
      <p>Note that which language is the original versus which is the translation does not necessarily mean one should <em>look</em> more important. As David opines, that's rarely desirable.</p>
      <p>Concerning captions, one trick would be to use them to separate the two languages (like in Lane's "The Diaspora of Armenian Printing, 1512-2012", although in that case the <em>writing systems</em> are different).</p>
      <blockquote><p>Find out which language sets longer</p></blockquote>
      <p>Spanish is typically ~10% longer than English, but translation is about ~15% longer than the original, so you might be lucky and end up with very comparable lengths.</p>
      <p>BTW for comparative language lengths get a copy of "Typographia Polyglotta" by Maxim Zhukov and George Sadek. Although it's over $100 now, whereas years ago I got mine for ~$20.</p>
      <blockquote><p>try and make the layout consistent</p></blockquote>
      <p>Yes, this is key. But to me that doesn't make using identical typography (a Modernist fetish) a good idea; there is always something different about the two languages/cultures, and being sensitive to that difference does not have to result in gimmicky differentiation. It is however tricky business, which is why many people give up and pretend making them identical is a good solution.</p>
      <p>Concerning specific suggestions:<br>
      - I think using Roman and Italic is rarely a good idea - the latter is too casual.<br>
      - Using serif and sans is also problematic: big readability difference in addition to a huge formality difference.<br>
      - You need subtlety in your solution; check out Lisboa - see the first entry here:<br>
      <a href="http://typographica.org/on-typography/our-favorite-typefaces-of-2005/" title="http://typographica.org/on-typography/our-favorite-typefaces-of-2005/">http://typographica.org/on-typography/our-favorite-typefaces-of-2005/</a><br>
      It's not a serif font, but it <em>is</em> suitably Iberian!  :-)<br>
      - Consider using Rotis (as Aicher did in his monumental book) since it has four flavors, or Linotype's comprehensive Compatil system. Note that both of those designs are generally maligned, but I don't think they deserve that.</p>
      <p>hhp</p>
