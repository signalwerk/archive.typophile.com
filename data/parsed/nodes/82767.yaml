    <p></p><div class="imageWrap"><img src="http://typophile.com/files/apollineptf_01_6726.png"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ApollinePTF" rel="nofollow">ApollinePTF</a>, is a french classic dedicated to text settings and editorial projects. 2011 is year of the renaissance for this popular typeface now available in 10 series, romans + italics.</p>
    <p>→ Be among the first ten to <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ApollinePTF" rel="nofollow">ApollinePTF</a> and receive the <a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=481" rel="nofollow">PTF bag</a> with your purchase! Normally it apply only to any purchase superior to €211.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/348_5422.jpg"></div><p></p>
    <p><strong><a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ApollinePTF" rel="nofollow">ApollinePTF</a></strong></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/ApollinePTF" rel="nofollow">From € 210 for 8 users.</a></p>
    <p>→ <a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=509" rel="nofollow">Introducing Apolline PTF</a><br>
    → <a class="freelinking external" href="http://www.typofonderie.com/alphabets/try/ApollinePTF" rel="nofollow">Test it online</a><br>
    → <a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/ApollinePTF_pdf.pdf" rel="nofollow">Full pdf specimen</a></p>
    <p>The <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ApollinePTF" rel="nofollow">ApollinePTF</a> typeface family was created in 1993 as a means to study the transition from Renaissance writing into the first printing types. Rather than sticking to the method commonly used these days for the creation of revivals of Jenson or Bembo types, it seemed more interesting to try and get in the same mindset as those exceptional designers during this pivotal period in the history of typography.</p>
    <p>Initially Jean François Porchez made <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ApollinePTF" rel="nofollow">ApollinePTF</a> drawings modelled after his own calligraphy. They were done at a very small size on tracing paper (2 cm high for the capitals) to preserve the irregularity of human handwriting. Besides emphasising the horizontal parts of the letter forms, the serifs were designed asymmetrically to reinforce the rhythm of the writing. Read more on the <a class="freelinking external" href="http://www.porchez.com/article/657/apolline-ptf-renaissance" rel="nofollow">blog entry.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/352_3583.jpg"></div><p></p>
    <p><a class="freelinking external" href="http://www.typofonderie.com/alphabets/order/ApollinePTF" rel="nofollow">A typeface by Jean François Porchez</a></p>
    <p><strong><a class="freelinking external" href="http://www.typofonderie.com/gazette/hot_news/?id=509" rel="nofollow">Apolline PTF special offer</a></strong></p>
    <p>To celebrate the launch of the <a class="freelinking external" href="http://www.typofonderie.com/alphabets/view/ApollinePTF" rel="nofollow">ApollinePTF</a>, clients benefit a special price of only euros 168 of any of the packs (standard price at € 210). To access this special offer, you must login at, then jump to your account page.<br>
     → <a class="freelinking external" href="http://www.typofonderie.com/contact/" rel="nofollow">Please contact us for activation.</a><br>
    Available through 30 June 2011.</p>
