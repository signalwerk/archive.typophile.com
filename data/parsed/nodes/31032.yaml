      <p>I like XML. What I don’t like is that XPS is as equally proprietary as PDF but there are no current plans to make XPS cross-format; a PDF can be opened on Windows, Mac, Linux, BSD, Amiga, etc... an XPS only on Vista or a hugely upgraded (.NET 3.0) XP/Server 2003 machine.</p>
