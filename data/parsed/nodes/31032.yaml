      <p>I’m surprised ODF (Open Document Format), a format that was announced with much ado, isn’t really mentioned. XPS, I feel, won’t be a big thing because PDF workflows in print shops and graphic companies have been virtually standardised. It’s a file format that is ubiquitous, and while often (in Government and other instances) there is not even the question of cross-compatibility, the presence of the Mac in the graphic sector does command it. ODF is an open standard for a human- and machine-readable document, which I would truly love. </p>
      <p><cite><br>
      I too think competition is good but the best product does not always succeed. Often it has to do with market penetration and what becomes mainstream. Look at early examples, the querty versus the dvorak keyboard. I hope XPS inspires Adobe to further improve the PDF.</cite></p>
      <p>Well, Adobe’s hearing the hounds on it’s heels. The MARS project will be bringing (a bit) more XML into PDF, but I really hope to see ODF as even an option to export to. Hopefully, we will get a format out of this that is open, crossplaftorm, editable by hand and secure, since I don’t trust propietary DRM either (see cases of Fairplay and current encryption schemes in PDF). But more than often, we will see a pretty good starting position and an iron marketing strategy give Microsoft the upper hand.</p>
