    html: <p><i>There is a popular and strange impulse to expand blame for the Holocaust beyond the individuals who executed it and extend it to everything they saw, read, touched, drank, smoked, ate, discussed, thought about, no matter how incidental.</i> <br> <br>This is not a new impulse. During the Nurenberg trials, one of the American prosecutors drew attention to such impulses and warned against them, especially when they involved shifting responsibility for the holocaust onto those 'who had not done enough to prevent it' rather than those who actually did it.</p>
