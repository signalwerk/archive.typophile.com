  date: 2003-09-27T17:47:00
  votes: null
  html: "<p>A Chairde, <br> <br>Weird and wonderful things have been going on in here: <br> <br><a href=\"http://www.typophile.com/forums/messages/30/16916.html?1064708452\" target=\"_blank\">http://www.typophile.com/forums/messages/30/16916.html?1064708452</a> <br> <br>We've been discussing and debating and arguing about Steven Heller's fear of Fraktur. There's a bit of a whisper, now, of an open letter/ pamphlet to express our love for what he sees as \"ominous\" and \"frightening\" letterforms evoking \"iron-fisted authority\". <br> <br>Anyone interested in a collective <i>cri de coeur</i> set in Fraktur? <br> <br>Matha</p>"
