    date_raw: 27 Sep 2003 — 11:13pm
    date: 2003-09-27T23:13:00
    votes: null
    html: <p>&gt; why would we want him to populize it? <br> <br>It's not that Heller is Obi-Wan/our_only_hope or something and we want him to endorse blackletter. We just want him to stop defaming it. It's hard enough to revalidate blackletter without a generally respected pundit stating it's beyond salvation. <br> <br>My own reason to want a revival of blackletter is a desire to enrich the typographic palette; I want to [eventually] see books set in blackletter. The roman is stagnating. <br> <br>I'm ready to write something up, but will only actually do it if we get like 10 or so others to commit, including some big names, like maybe Bain. Then we can put something powerful together and get all the magazines to run a story. The point shouldn't be to lambast Heller (it's not like it's all his fault), but we can use his stance as a prominent example of what people should reject. <br> <br>hhp <br></p>
