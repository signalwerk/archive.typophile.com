    date: 2003-09-27T19:26:00
    votes: null
    html: <p>Matha <br> <br>Heller has always seemed a pretty much a populist to me. Publishing crap on the latest trend. Why would he be concerned about fraktur!?! And why would we want him to populize it? Let's keep some of the good stuff to ourselves. Yes, Steven, should be very afraid. Nasty stuff that fraktur. Stay away, far far away. <br> <br>Gerald</p>
