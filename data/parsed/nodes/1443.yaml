    date_raw: 24 Dec 2003 — 10:59am
    date: 2003-12-24T10:59:00
    votes: null
    html: "<p>More insight into Heller's Head: <br> <br>Recently he wrote a review of the book \"Beirut's Memory\" for Print magazine. It was fine, except for an innocent-seeming mini history of Lebanon that reeked of political propaganda (at least to somebody with a nose sensitive to that), buttressing the distortions of the powers that be. I wrote a reply, and it made it into the current issue: <br> <br>\" <br>I was delighted to see coverage of the book \"Beirut's Memory\" in the <br>July/August issue [\"Double Exposure,\" p. 98]. Sadly, this delight was <br>matched by disquiet in reading Heller's encapsulation of Lebanon's 17- <br>year civil war. Living that war as a non-Arab Christian in largely Muslim <br>West Beirut, I learned to glean the true motivations and mechanics of <br>political propaganda. Even if I suppress my tendency to assume the <br>worst, I have to note that virtually every single clause in Heller's history <br>seems strongly skewed to validate the American perspective, if not <br>U.S. foreign policy per se. This does not help. <br> <br> I'm sorry that my first letter ever to PRINT isn't strongly related to <br>design, except perhaps in this way: Graphic designers seem to have <br>developed a burning desire to be politically relevant, but the degree <br>to which they can avoid being manipulated depends most of all on <br>their political sophistication. <br>\" <br> <br>They did however make two [telling] edits: <br>1) \"Heller's history\" originally had both in capitals. <br>2) I used \"zeitgeist\" (a carefully loaded term), not \"perspective\". <br> <br>To the credit of Print though, they didn't allow the use of my letter as as excuse for more spin. That's what almost stopped me from sending it in: the fear that it would be capped by a \"carification\" from Heller... <br> <br>hhp <br></p>"
  - id: 11675
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 29 Dec 2003 — 12:55pm
    date: 2003-12-29T12:55:00
    votes: null
    html: "<p>There he goes again!! <br>Now that the System is after Iran for real*, Heller is ramping up the rhetoric towards his [self-]assigned demographic: soft-headed designers. In the current issue of Eye magazine** there's an interview with a young Iranian woman (living in Europe since age 14) who has put out an interesting comic book about her childhood during the Islamic Revolution. Any ambivalence in the interviewee is quickly redirected (carefully read the <i>questions</i>, more than the answers) towards a tacit condemnation of The Enemy... Who needs subtlety when your audience has the political sensitivity of an earth newt? <br> <br>* <a href=\"http://news.bbc.co.uk/2/hi/middle_east/3341233.stm\" target=\"_blank\">http://news.bbc.co.uk/2/hi/middle_east/3341233.stm</a> <br> <br>** An otherwise stellar issue - a typographic gold mine, this one. <br> <br>hhp <br></p>"
  - id: 11676
    user_id: 1316
    user_name: piccic
    user_path: null
    date_raw: 25 Mar 2005 — 8:08am
    date: 2005-03-25T08:08:00
    votes: null
    html: "<p>I think there is a consideration to be made. I investigated the fascination I myself had with the Blackletter, in subsequent times, and I felt it was difficult to completely separate it from Nazism. Even a pretty childish old idea for some type designs of mine was related to it. <br> <br>I feel like there is a general perception of it associating it with Nazism, which keeps going on, independently from what bad journalism (which here in Italy is the majority) may be pushed to sensationalize. <br> <br>So Heller may be annoying to accultured designers, but my own doubt is he may reflect a feeling to which a large portion of people keep clung to: something along the lines of \"Adolf Hitler was not a human being\" or so. <br> <br>In this way my fear is it would effectively be very hard to \"undemonize\" Blackletter, as much as it is hard to \"undemonize\" the figure of Adolf Hitler or treat Nazism with more historical fairness. <br> <br>The fact is that Blackletter seems to be in many ways a \"dead type style\", in the sense Ancient Greek or Latin are \"dead languages\". So, as you try to make it live in modern context, you are prevented by many obstacles. <br>How many times I'd have wished to use it for food packaging. But they would never allow me to do so. <br> <br>What do you think?</p>"
