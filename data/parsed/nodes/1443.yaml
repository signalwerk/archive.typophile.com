    date: 2003-10-13T11:45:00
    votes: null
    html: '<p>During the "Old Europe" opposition to Gulf War II, I was at a park in Montrose (an Angloer-than-average area) and I overheard two moms talking politics. One of them ended up saying: "The Germans should talk! I mean, with what they <i>let happen</i>." Talk about a coping mechanism. <br> <br>hhp <br></p>'
  - id: 11660
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 13 Oct 2003 — 5:00pm
    date: 2003-10-13T17:00:00
    votes: null
    html: "<p><i>I bet he'd oblige if you agreed to be professional.</i> <br> <br>What profession are we talking about? Although Heller poses as a serious design historian and commentator, everything I've read by him suggests that he is simply a journalist. The Fraktur article is a case in point: extremist, poorly researched, emotional ('What typeface says \"nigger\"?'). Of course, most graphic design writing is journalistic, but type has often been blessed with a much higher level of scholarship. We have serious historians and commentators like Robin Kinross, Peter Bain, and Paul Shaw who have written knowledgeably about the modern history of blackletter, and whose books and articles are read by a small number of type afficionados, and then we get a journalist like Heller who writes an hysterical account of an entirely personal reaction to fraktur, which gets read by a thousands of AIGA members.</p>"
  - id: 11661
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 13 Oct 2003 — 5:03pm
    date: 2003-10-13T17:03:00
    votes: null
    html: <p>&gt; To put Fraktur types fully back in good favor or to lambast Steven Heller? <br> <br>Mine is to create an atmosphere where people can use blackletter for projects without fear of being called anti-Jewish. Lambasting people who strike down blackletter on spurious grounds is one good way to do that. <br> <br>I think it would be great if you invited Heller here, although I'm not sure what making money has to do with it. <br> <br>hhp <br></p>
  - id: 11662
    user_id: 1262
    user_name: John Hudson
    user_path: null
    date_raw: 13 Oct 2003 — 8:45pm
    date: 2003-10-13T20:45:00
    votes: null
    html: "<p><i>Mine is to create an atmosphere where people can use blackletter for projects without fear of being called anti-Jewish.</i> <br> <br>I suspect that the best way to do this is to start using blackletter types, but to do so in a strategic manner. Heller -- and presumably other non-experts -- is able to distinguish between German fraktur and 'other medieval gothics, such as Old English', even if his terminology is shaky. One of the great things about Peter Bain and Paul Shaw's publications is that they have begin to educate people about the incredible variety of blackletter types and writing styles, and the development of the style in countries other than Germany. This, coupled with some understanding of the history of the late Middle Ages, reverses the 'national identity' trend of the 20th century, and properly situates blackletter as an aspect of 'international gothic' culture, which flourished in western Europe immediately before the renaissance. Gerrit Noordzij's essays on the Burgundian style are another contribution to this fuller understanding of blackletter. <br> <br>This suggests to me that a parallel to this educational approach would be to start using blackletter types of French, Spanish, Italian, etc. origins and influence: types that undermine the identification of blackletter with Germany and hence, however erroneously, with National Socialism.</p>"
