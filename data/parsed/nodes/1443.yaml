    html: "<p>Apologies to everyone for my late reply to this thread. This response uses styled text, so it's best when read on the typophile site and not in email. <br> <br>I own a copy of Heller and Fili's <i>Typology</i> and consider it a nice piece of work. It helped me to navigate all the subcurrents in modernism and what led up to them. It's got some great examples especially from the early part of the 20th century, including a few blackletter works. So you can imagine how frazzled I was when I read Heller's article. It's now two years old, so our responses are a little behind schedule, but it does need to be addressed. <br> <br>Heller's full article can be found <a href=\"http://designforum.aiga.org/content.cfm?contentalias=%5Fgetfullarticle%5F&amp;aid=%22%2C%230%20%0A\">here</a>. In it he writes: <br> <br><b>German Fraktur type (as opposed to other medieval gothics, such as Old English) still evokes iron-fisted authority. The words </b></p>"
  - id: 11657
