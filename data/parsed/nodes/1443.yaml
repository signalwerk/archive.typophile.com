    html: <p>&gt; why would anyone in their right mind do anything letterpress? <br> <br>Hey, you make a living at it! <br> <br>Anyway, I was reacting to John Butler's post right before mine. In fact I think a Fraktur revival might stand a better chance using offset. <br> <br>&gt; whatever would be a "mainstream fraktur"? <br> <br>It's tricky ground, certainly. To me it means a face that combines curves and angles (the way the fraktur subclass of blackletter does so wonderfully), and uses the extender space much more richly than Roman (see the blackletter lc "h" for example), but with individual letters that have conventional structures - like none of that funky lc "y" stuff, and certainly caps that can be deciphered easily. <br> <br>BTW, I can be mainstream when it's for a greater good. I'm not an artiste. <br> <br>hhp <br></p>
