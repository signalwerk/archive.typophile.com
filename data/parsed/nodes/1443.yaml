    html: "<p>By professional I meant the *corporate america definition,  <br>though Hrant's interpretation made me chuckle... <br> <br>After re-reading Hrant's first post here, I see that he  <br>already answered my question, which I respect. I should've  <br>read more carefully. <br> <br>For what it's worth, John Butler and John Hudson, you've  <br>put some meat on the credibility of this thread and I'm  <br>willing to listen to. <br> <br>* In corporate America speak, 'professional' has another <br>definition, which is something like: dress and speak  <br>appropriately. Have some manners and if you have alterior  <br>motives, just don't let them show. Keep them shielded by a  <br>rational tone. Oh, and don't chew gum.</p>"
