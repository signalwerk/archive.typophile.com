    date_raw: 13 Oct 2003 — 9:39am
    date: 2003-10-13T09:39:00
    votes: null
    html: "<p>Great post, John! <br> <br>&gt; Fraktur was considered Romantic and feminine. <br> <br>Maybe this is a digression, but: <br>If you mean that historically most people thought fraktur was romantic (not sure about your capitalization) and feminine, I don't know enough to counter that. But to me \"Antiqua\" (or Roman, or whiteletter) is much more feminine; even though blackletter is narrower, its great angularity (especially in styles like textura) gives it an essentially masculine being. \"Romantic\" though I'd agree with. <br> <br>&gt; chirogaphic blackletter design. <br> <br>Blackletter doesn't have to be chirographic. In fact I've noticed a tendency among blackletter revivalists to rely too much on chirography. That's basically swimming against the current, and it just makes it harder to dump the historical baggage. We need to distill blackletter into its structural, typographic essence. <br> <br>I have no doubt that blackletter needs reform to be revived as a text style (like by taming the caps), and the chirogaphic ghosts can be exorcised along with its archaic features in one fell swoop. And as much as spinning efforts (like getting Heller to back off) seem distasteful and/or tangential, they're really the fuel of such reform. <br> <br>(BTW, thanks for the warning about the styled text stuff - good netiquette.) <br> <br>hhp <br></p>"
