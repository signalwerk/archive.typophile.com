      <p>Is it possible that the “p” that sparked this whole thread was in fact a “q” applied backwards?  I’ve seen a sign that used an upside down “m” instead of a “w”.  Anyway, all the sheared stems in FHWA are cut southwest-to-northeast.  Does Interstate do that differently with some letters?</p>
      <p>By the way, I also like the new Clearview fonts for the most part; I’m not so enthusiastic about the numerals, however.  I thought the FHWA numerals were quite effective, and some of the Clearview numerals look too much alike — specifically, the free strokes of the 6 and 9 curve back towards the loops more than in FHWA, making them less distinct from 8.  I also miss the inflection in the middle of the curved stroke of the 2, but that may be more a matter of personal taste than function.</p>
      <p>Does this font make me look fat?</p>
