    <p>Yesterday I spent some more time than usual on the freeways, driving more casually than usual (so deliberative driving, not immersive :-) and something hit me*: I saw a “p” with its shear at the bottom in the opposite direction as Interstate. In know that Interstate is touted as a “cleaned-up” version of the FHWA design (with this particular difference striking me as chirographic in motivation - and actually less effective than the original) and now I’ve become quite interested in analysing the differences between the two. I think such analysis would expose interesting clues as to how a designer thinks. If TFJ himself would elaborate, that would of course rule.</p>
    <p>* I mean besides that loose bumper piece - damn thing knocked a fog light loose.</p>
    <p>hhp</p>
