      <p>Well, if you like Rockwell, it is what is called a slab serif. If you do a search on this site for "slab serifs" you will find many a discussion that mention some good ones. the other thing to consider is that you may want it to match with a neo grotesque, which is what Helvetica is. </p>
      <p>I hope that helps.</p>
