  html: |-
    <p>I am an architect designing my resume and portfolio for job applications. I want to use a serf font for the body text with Helvetica Bold for the project titles.</p>
    <p>Any suggestion for a very light weight serif font? I tried rockwell but felt it was too heavy.</p>
    <p>Thanks in advance for the advice!</p>
