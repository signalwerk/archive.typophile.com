      <p>P22's International House of Fonts presents: The Vale Fonts</p>
    <p>The Vale Press was one of the Arts &amp; Crafts presses founded in London in 1896 during the revival of fine book-making. The types used by the Vale Press were designed by artist Charles Ricketts, who also supervised the design and printing of Vale Press books. The main type used in Vale imprints was called the "Vale Type". Vale, like William Morris's Golden type, was based on the Jenson 15th century model and exemplifies the classic roman printing type style.</p>
    <p>The King’s Fount was an experimental semi-uncial font based on the Vale type, and while a bit unusual, Ricketts was quite fond of his creation. The King’s Fount was designed in 1903 for the Vale edition of the 15h century poem "The Kingis Quair". This semi-uncial font evokes old English and Anglo-Saxon lettering. Both Vale and King's Fount share many characters designed by Ricketts. The digitization of these faces, by Colin Kahn, are true to the original design’s intentions but are drawn with clean, rather than distressed, outlines.</p>
    <p>P22 Vale Pro combines the two fonts P22 Vale Roman and P22 Vale King’s Fount into one "Pro" font. This pro font also includes a Central European character set, old style figures, fractions, a few ornaments and a special faux "Middle English" feature to make "anee text appeer Olde."<br>
    This feature is not known to exist in any other font. The pro font also includes the "roman numerals" feature first used in the P22 Operina Pro font. For those without OpenType savvy applications, the single King's and Roman fonts are included with the Pro set.</p>
    <p>The fonts can be ordered online at<br>
    <a href="http://p22.com/ihof/vale.html" title="http://p22.com/ihof/vale.html">http://p22.com/ihof/vale.html</a></p>
    <p>As a special introductory offer, subscribers to the P22 mailing list receive a 20% discount on the Vale Pro set.<br>
    Simply enter the code during checkout: APR07VALE</p>
    <p>This sale price of $23.96 for the set will be in effect only until April 15.</p>
    <p>The fonts can be previewed on the TypeCaster <a href="http://www.p22.com/typecaster/master/caster.html" title="http://www.p22.com/typecaster/master/caster.html">http://www.p22.com/typecaster/master/caster.html</a></p>
    <p>P22 type foundry</p>
