      <p>I've had the same problems with this font -- getting strange x-instead-a-box characters instead of the italics. In my case, I *believe* it was caused when I used the "Replace Pages" feature in Acrobat 7 to swap out a page with an error with a corrected page, or possibly just when combining multiple PDF files into a single PDF file, but more than likely it was the combination of both that did it.</p>
      <p>The print version of the book was perfect, but I had numerous problems when assembling the PDF version. The PDFs were all created from distilled postscript files. Similar setup: PowerMac G5, InDesign CS2, Acrobat 7.</p>
      <p>I've just started work on another reprint of the book at a different printer, so I'll possibly learn some "new and exciting things" about this font and its wonky interactions very soon.</p>
