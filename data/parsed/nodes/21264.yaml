    html: |-
      <p>Problem solved! Thanks to Miguel Sousa with Adobe. There appears to be a problem when postscripting the file first, then distilling it. Since InDesign allows you to PDF directly through its software, it skips the postscripting process through Distiller, and just creates a PDF. We have specific settings that our printer requires, so it was just a matter of getting that from them and setting up a preset.</p>
      <p>It actually made it easier, since now it became a one step process. The bottomline is, it fixed the problem, and so far it has gone smoothly. Of course, I was told that InDesign 4.0 was necessary, as I guess earlier versions did not do as good of a job in the PDF workflow. But I wouoldn't know that from personal experience. That was according to my printer.</p>
      <p>According to Miguel, Adobe has been informed of the problem, and the developers are looking into it for Acrobat and Distiller to fix it. Thanks for everyone's input and hopefully this will help someone else with the same problem.</p>
      <p>Bryan</p>
