      <p>I may be way off base here, but...</p>
      <p>Try de-activating the fonts you used in the publication BEFORE opening the PDF. It could be that Acrobat is not bothering with the embedded fonts and is instead using the ones you have installed. I have noticed, from time to time, that when Acrobat embeds and creates subsets, the subsets aren't always mapped the same way the original font is.</p>
      <p>This may not be the answer, but it would explain why your printer isn't experiencing the same problems you are...</p>
