      <p>OK, here's an update on this issue:</p>
      <p>Bryan's workflow went like this:<br>
      InDesign (CS2/4.0.2) --&gt; PostScript files --&gt; Distiller 7.0.7 --&gt; PDF files --&gt; Acrobat Pro (7.0.8) --&gt; single PDF file</p>
      <p>Several PDF pages had indeed some characters replaced by <a href="/wiki/notdef" class="freelinking" rel="nofollow">notdef</a>s (technical name of the mentioned X-boxes), and overall it seemed to affect only fonts of the Garamond Premier family (not restricted to a specific weight or style). Upon further analyses it was diagnosed that the fonts had not been correctly embedded. It was suggested to Bryan to change his workflow. He did, and now the problem seems to be solved.</p>
      <p>New workflow:<br>
      InDesign (CS2/4.0.2) --&gt; PDF files --&gt; Acrobat Pro (7.0.8) --&gt; single PDF file</p>
      <p>Conclusion:<br>
      The fonts are working as expected</p>
