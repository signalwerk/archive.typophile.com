      <p>For the physical part -- #6. Rendering -- you could do no better than reading up on FreeType. Much of it is dedicated to pure code, but there is also lots of theoretical stuff.</p>
      <p>A side-track could be Maxim Shemanarov's <a href="/wiki/www.antigrain.com" class="freelinking" rel="nofollow">Antigrain Library</a> -- he has a nice page on rendering type as well, and even more theoretical stuff on the physics of antialiasing.</p>
      <p>On a more technical note, the divide in font technology is not "OpenType/TTF" but rather "CFF/TTF". Microsoft's 'TTF' technology uses TrueType curves &amp; hints, Adobe's 'CFF' uses PostScript curves and PostScript hints (not sure about the latter--wasn't Adobe phasing these out for OTF?). Both filetypes can have an OpenType wrapper; TTFs can also have a TTF wrapper.</p>
