    html: |-
      <p>Better to say: Hinting or instructions are added (automatically and/or manually) which can provide directions for conservation of the fonts design character in environments where less-than ideal output is to be employed.</p>
      <p>Hinting instructions are two confused fused terms. "Suggestions" about stem width, alignment zones, overlap management, is not a great term, for though TT instructions, and T1 hints do turn off, when turned on, they are simply obeyed, unlike a suggestion, which by definition may be ignored, just like this one. And—for TrueType hinting—actual pixel placement is never defined only actual outline placement is. This is a subtle difference, perhaps, though I would suggest it is crucial to understanding. </p>
      <p>As for reading Beat Stamm’s excellent article "The raster tragedy at low resolution", please remember this article is old, out of date in many respects, discussing only TT instructing for black and white fonts which is not terribly important today, and based on a world where TT instructions were interpreted by default in environments where less-than ideal output is to be employed, which is no longer the case.</p>
      <p>&gt;What details might you add?</p>
      <p>This is pretty good overall. </p>
      <p>Cheers!</p>
