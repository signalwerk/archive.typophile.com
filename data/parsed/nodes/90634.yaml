    html: |-
      <p>Charles — I think one of us has misunderstood the question. I took the problem to be one where the values appear correct in the Font Creator program, but do not appear correctly when the font is set in Adobe applications.</p>
      <p>For instance, the “VA” pair is shown in the screenshot from Font Creator with -117 kern pair value. But in the first screenshot, from Photoshop with Metrics kerning applied (i.e., the font’s native values), the “VA” pair is obviously not being interpreted as -117. Unfortunately, Photoshop won’t show you the value it’s applying in this instance. Which is why I suggested reading it out of InDesign (which the o.p. says also exhibits the problem, if I read that correctly).</p>
      <p>Looking at the Font Creator screenshots, I'm seeing by the values that this is probably designed on a TT 2048 upm. I’m thinking that maybe through some kind of mismatch somewhere along the way, the Adobe applications are assuming that this font is set on 1000 PS upm, yet still somehow applying absolute kerning values, not relative. That’s just a wild-ass guess, which is why I was asking for more specific information to support or dispel some of my theory.</p>
