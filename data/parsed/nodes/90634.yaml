      <p>Did you generate the fonts as TrueType TTF or Postscript OTF? </p>
      <p>What is the UPM setting for the font?</p>
      <p>Go to InDesign and type ‘VA’ (or any one of your problem pairs), place the cursor between the two letters and look in the Character &gt; Kerning field. What value does it indicate (it should be given in parentheses)?</p>
      <p>It seems like somewhere along the lines, your values are getting magnified, which suggests to me a mismatch between the units and the UPM and the format (or Adobe interpretation).</p>
