    <p>Hello my friends at typophile.com</p>
    <p>After installing my new fonts in the system and opening Photoshop or InDesign or Illustrator and starting using my fonts, I had terrible problems with kerning facilities.</p>
    <p>When I use "Optical" or "0" kerning options, I get a great view of my fonts but when I use "Metrics" option, I have a disgusted overlapping with letters of my fonts. You can get more about this problem in attached images. I try to check the kerning pairs in my designed fonts and find that the kerning pairs are all prepared correctly and they have no problem at all.</p>
    <p>Could any one help me in finding a solution for this sophisticated problem.</p>
    <p>Thank you for your time and help.</p><div class="imageWrap"><img src="http://typophile.com/files/1_6485.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/2_3703.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/3_4900.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/4_5218.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/5_5464.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/6_4394.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/7_5973.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/8_4526.jpg"></div><p></p>
