      <p>Now if your question is, in those projects where Gill would be good, what is a fresher face, then Bliss I agree is excellent. </p>
      <p>But if you are using Gill for almost all your projects then moving forward I think involves using different faces for different projects, and not having a 'standard'. The advantage of today's proliferation of good faces means that you can get distinctive, suitable faces to use for different projects, suiting the distinctive needs of the project.</p>
