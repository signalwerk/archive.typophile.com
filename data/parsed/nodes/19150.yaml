    <p>What are some typefaces you guys would recommend looking at if you wanted to move from using Gill Sans, forward in a more contemporary direction, say 10% forward (perhaps another more recently designed humanist sans) and maybe some directions that move more radically in a different direction but hint at the origins?</p>
    <p>Not sure I put it very eloquently, so I hope I've got my point across.</p>
    <p>Basically, suggestions for a small move forward from Gill Sans, and also suggestions for a large leap forward as well.</p>
    <p>Eg, off the top of my head a small move might be myriad, scala, meta or frutiger, a large move perhaps legato, DIN, helvetica?</p>
    <p>Anyway, any suggestions appreciated.</p>
    <p>Cheers,</p>
    <p>Christian</p>
