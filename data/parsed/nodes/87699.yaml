    <p>These are two pictures from the working process of a character I called <em> Memoir</em> .</p>
    <p>The photo in the background is by Paolo Roversi.</p>
    <p><a href="http://typophile.com/files/Bild+c!.jpg" target="_blank" rel="nofollow"><em>Memoir</em> c</a><br>
    <a href="http://typophile.com/files/c_cys!.png" target="_blank" rel="nofollow"><em>Memoir</em> c_cys</a></p>
    <p>MEMOIR</p>
    <p>Auf was ich mit der Memoir hinauswollte, ist nicht leicht zu beschreiben, so dass ich es zunächst über einen Ausschluss versuchen möchte. Die Memoir ist auf keinen Fall eine grafische oder lineare Schrift, sie verfolgt einen eher „malerischen“ Ansatz. Schon oft habe ich mich für meine Kreationen bei den Bildern Paolo Roversis inspiriert, diese ist jedoch wahrscheinlich die, die am „deutlichsten“  (in diesem Wort liegt ein gewisser Widerspruch) seinem photographischen Stil nahekommt. Eine grafische Schrift lebt durch ihre Struktur: hier jedoch fügen sich auf eine Art zwei Aussenlinien zueinander, deren Spiel mehr durch eine vage Erinnerung geprägt ist. Erst wenn man die Augen fast ganz zusammenschließt und sie wie durch einen schimmerigen Nebel hindurch betrachtet, erwecken die Buchstaben alt bekannte Formen zum Leben. Meine stets imminente Begeisterung für die Kursive Fourniers oder des frühen Bodoni zeigt sich im kleinen ‘g’; etwas von der fast „blechernen“ Faltung einer <em> Caslon No 540</em> kursiv verbleibt im ‘a’. <a href="http://typophile.com/files/agg_Skizze.png" target="_blank" rel="nofollow">[<em>‘agg_Skizze’</em>] </a><br>
    Um dem Spiel der Erinnerungen freieren Lauf zu lassen, habe ich einige Kurventeile mit schnellen Geraden gezogen. Aber auch in dem Zusammenhang zwischen geraden Kurventeilen und denen echter Kurven spielten Erinnerungen an den Detailcharakter einer klassizistischen Type eine Rolle. Ich habe erst später selbst etwas erstaunt festgestellt, dass es eigentlich keinen Grund gibt für den geschwungenen Abschluss an den Minuskeln mit Oberlängen wie beim ‘h’. Während ich zeichnete aber erschien mir das logisch.<br>
    Es ist merkwürdig. Wenn ich mich in eine Schrift verliebe, so ist es oft rein zufällig. Gerade die Elemente, wie hier das kleine ‘h’ entstehen am Rande und finden erst später, wie hier in diesem <a href="http://typophile.com/files/h+Image_ton_0.gif" target="_blank" rel="nofollow">Paolo Roversi Bild</a> eine Art Konterfei. Ich weiß, niemand mag die Memoir, nicht vielen vermag diese Schrift etwas zu sagen. Aber es genügt mir, wenn mir dieser Moment passiert. Eine inspirierte Kurve, die aus einem magischen Moment heraus zu einer Berechtigung kommt, zählt für mich sehr viel.<br>
    Es ist als zeige sie mir, dass meine persönlichen Erinnerungen an etwas, sagen wir fast an wie einer gemeinsamen <em>Erinnerung</em>, teilhaben. Und so erst fühlte ich mich nicht allein.</p>
    <p><em>In quanto ai sensi sono sempre degli strumenti per spiegarci la realtà: quella in cui ci fanno mettere un passo davanti all’altro con le nostre gambe. E quando attraverso di essi ci mettiamo in contatto con una persona che in seguito ci è dato di amare, loro non sono in grado di distinguere il livello della loro percezione, nel momento decisivo: è la memoria che fa questo. Dunque non c’è amore senza il ricordo.</em></p>
    <p><em>“Linger on, your pale blue eyes…”</em> [<em>Pale blue eyes</em>, The Velvet Underground]</p>
    <p>[-&gt; <em>«[…] mi aiutavano a intendere meglio quale contraddizione vi sia nel cercare nella realtà i quadri della memoria, ai quali mancherebbe sempre l’incanto che proviene loro dalla memoria stessa e dal non essere percepiti dai sensi.»</em> MARCEL PROUST, La strada di Swann]</p>
    <p><em>La sua capellatura prima apparsami d’un’oro così scintillante, una massa compatta e lucida, si prosciugava come uno di quei sassolini, cui bellezza, tirati fuori d’acqua a guardarli meglio, si perde fra un’attimo.</em> [Frammenti della Bellezza]</p>
    <p>*</p>
