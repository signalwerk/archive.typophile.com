      <p>Off the top of my head:</p>
      <p>You should visit the Sir John Soane Museum –&nbsp;a wonderful place. The V&amp;A is great and has lots of artists' books which you can arrange an appointment to see. Also, Postman's Park is a lovely spot (just google it). The Design Museum is an obvious choice. Check Time Out for current exhibitions.</p>
      <p>This is rather London-centric, I'm afraid...</p>
