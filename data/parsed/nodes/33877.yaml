    <p>Hello everyone,</p>
    <p>I am preparing for my first ever trip to the UK. We are going to London, Edinburgh, Manchester and Leicester at the end of the month and I am wondering if any of you might have recommendations for type or design related things I could do or see...? My experience from traveling to other places is that if you just go by what is in the guide books, then you are missing out on a lot of possibly more interesting things.</p>
    <p>Thank you,</p>
    <p>Duncan</p>
