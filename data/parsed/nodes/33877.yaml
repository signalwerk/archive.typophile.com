      <p>Here's some suggestions for Manchester as those who live in London get a nose bleed past Watford.</p>
      <p>1. The John Rylands Library. Recently refurbished and now open. Rare books and manuscripts housed in an amazing building.</p>
      <p><a href="http://www.library.manchester.ac.uk/" title="http://www.library.manchester.ac.uk/">http://www.library.manchester.ac.uk/</a></p>
      <p><a href="http://rylibweb.man.ac.uk/data1/dg/exhibition/unlock/" title="http://rylibweb.man.ac.uk/data1/dg/exhibition/unlock/">http://rylibweb.man.ac.uk/data1/dg/exhibition/unlock/</a></p>
      <p>2. Urbis. Usually has some design exhibtions on.</p>
      <p><a href="http://www.urbis.org.uk/" title="http://www.urbis.org.uk/">http://www.urbis.org.uk/</a></p>
      <p><a href="http://www.urbis.org.uk/page.asp?id=3134" title="http://www.urbis.org.uk/page.asp?id=3134">http://www.urbis.org.uk/page.asp?id=3134</a></p>
      <p>3. Manchester Art Gallery</p>
      <p><a href="http://www.manchestergalleries.org/" title="http://www.manchestergalleries.org/">http://www.manchestergalleries.org/</a></p>
      <p>4. Imperial War Museum North. Designed by Daniel Libeskind.</p>
      <p><a href="http://north.iwm.org.uk/server/show/nav.00c" title="http://north.iwm.org.uk/server/show/nav.00c">http://north.iwm.org.uk/server/show/nav.00c</a></p>
      <p>That's all I can think of for the time being. When is it your thinking of travelling?</p>
      <p>Have a great time!</p>
      <p>Dave</p>
