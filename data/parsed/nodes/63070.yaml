    <p>We are pleased to announce the opening of our new typefoundry <a href="http://www.motaitalic.com/" class="link-external">Mota Italic</a>! It took many long months of coding, designing, and bureaucratic paper work, but in the end we feel like we are offering some great font families and a totally unique shopping experience.</p>
    <p>Our first major family, <a href="http://www.motaitalic.com/fonts/vesper/overview" class="link-external">Vesper</a>, is a contemporary serif design I began in 2006-07 at the University of Reading. It has been almost fully redesigned and greatly expanded into a large, feature rich, 10 font family. These fonts are great for both text and display; check them out, they might be the perfect unique touch for your next book or identity project.</p>
    <p>Also up for grabs is the [free] two weight family <a href="http://www.motaitalic.com/fonts/mota-pixel/overview" class="link-external">Mota Pixel</a>. This design was originally made for the TypeShow interface, to test out our fonts online. It too has a large character set, wide language support, and many many OpenType features. Plus, you can use it with @font-face declarations!</p>
    <p>Finally, our web font policy has been of great interest. We offer a special package of "WEB Fonts" that are specifically made for online embedding. These packages come with two seperate sets of fonts, one for offline work and another for embedding online. There is a lot to say about them, but in short, you can use our WEB Fonts for @font-face, sIFR, Cufón, Typeface,js, and Flash. They also come pre-subsetted into smaller files for faster download times and they even allow you to select lining or old-style figures for your website.</p>
    <p>We have many updates, both for the website and fonts, planned that will be released soon. In the meantime, please check out <a href="http://www.motaitalic.com" class="link-external">motaitalic.com</a> and let us know if you have any questions or comments!</p>
