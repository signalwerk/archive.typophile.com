    html: <p>Well, I try to hold myself back from working in “I work for Linotype” into every posting. They certainly do not pay me to post things on the net, nor to do below-the-line advertising such as this. And I’m not typing this up at work either. <br><br>Plus, I will only be a Linotype employee for three more days! After that, I be in limbo for a few weeks, while the German government decides whether to renew my work permit or not <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> . I’ve already exceeded the amount that I’m “supposed” to work in one year. <br><br>– <br>That being said, let’s talk about “Old English Type.” (one last disclosure,  I did do some writing about the old englishness of old english types that will be released in later marketing materials from <span class="caps">LL</span>. But this is not a marketing ploy). Until last week, I thought that Old English was a total misnomer, something that ignorant font-buyers used when searching on the internet. Well, I was wrong! <br><br>Old English referes primarially to historized texturas design in England during the victorian era. Texturas were introduced into England during the 1400s. And, as everyone here probably knows, I <span class="caps">LOVE</span> <span class="caps">TEXTURAS</span>! The victorians loved them too, but thought them out of date and illegibile, it seems. So they “modernized” them. This is classicism. Mariage (in the Old English Pack) is a revival of Morris Fuller Benton’s Wedding, originally from 1901 and thoroughly Old English. <br><br>So almost anything “historicized”  and “textura-inspired” can be vaguely Old English, whether it was designed by an Englishman in England or not. Blackmoor is from Quay, and supposedly based on something old and english. Notre Dame and <span class="caps">WK</span> Gotisch are not english at all but are texturas, and <span class="caps">WKG</span> is very historicized, just in a beautiful germanic manner by Koch instead of Benton’s or the Victorian-style. <br><br>Notre Dame is not as historicized, but it is an interesting revival of pre-printing texturas. So I think that it is vaguely appropriate, too. <br><br>Monotype’s packet has more pure old englishes in it, maybe, but it also has a Fraktur, which I can’t see as being Old English at all. Way farther oﬀ than <span class="caps">ND</span> or <span class="caps">WKG</span> (oh heavenly diety, please lighten the typophile’s hearts so that they don’t think that I am trying to dis <span class="caps">AGFA</span>&nbsp;Monotype</p>
