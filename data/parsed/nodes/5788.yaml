  html: <p><a href="http://www.linotype.com/6-2162-6/oldenglishvaluepack.html" target="_blank">http://www.linotype.com/6-2162-6/oldenglishvaluepack.html</a> <br> <br>What do you guys think of Linotype's latest value pack? Six representative "Old English" fonts at such a low package price. I was even more impressed after I compared it with an older value pack on Fonts.com (<a href="http://www.fonts.com/findfonts/detail.asp?nCo=AFMT&amp;pid=371688" target="_blank">http://www.fonts.com/findfonts/detail.asp?nCo=AFMT&amp;pid=371688</a>)</p>
