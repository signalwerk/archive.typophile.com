    <p>Hi Everyone,</p>
    <p>Just a quick early bird shout out to let you all know that Colophon Foundry has just released Reader in 6 weights – Regular, Regular Italics, Medium, Medium Italics, Bold &amp; Bold Italics.</p>
    <p>For a limited time of a week only, get yourself a bargain!</p>
    <p><a href="http://www.colophon-foundry.org/newsletter/001/buy/" title="http://www.colophon-foundry.org/newsletter/001/buy/">http://www.colophon-foundry.org/newsletter/001/buy/</a></p>
    <p>Thanks</p>
    <p>Colophon Foundry</p>
