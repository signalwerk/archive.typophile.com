    html: <p>Thanks for the wisdom, Hrant. <br> <br>I notice Octavo has an edition of Champ Fleury for $35, which is an essential to my library. I'm wondering how many of Tory's letterings have been made into fonts. Coincidently, the Tory sample I found in Gray's book is a sample spread on the Octavo site, so I see that typeface is called "Fantastic Letters" (sample attached). Anyone know if this font exists? <br> <br><img src="http://www.typophile.com/forums/messages/4100/56975.jpg" alt="G Tory Fantastic Alphabet from Champ Fleury"> <br> <br>If Champ Fleury is full of Tory's letterings, would a person legally be able to fonticize a few of them, or would creating a typeface fall under digital reproduction of Octavo's copyright?</p>
