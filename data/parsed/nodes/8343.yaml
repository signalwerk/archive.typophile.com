  html: |-
    <p>I'm reading a 1971 book (Lettering as Drawing/Nicolete Gray) which contains historical images of letter sketches and type specimens from various artists and manuscripts from 1528 to 1970. My first thought is the author and publisher do not have copyright to these older letterforms. Should I even begin to consider digitizing some of these alphabets? <br> <br>Of course, some of the artists may have estates retaining rights to their works. In particular, I'm eyeing a line engraving from Lucs Materot (1608), woodcut alphabet from Champ Fleury by G. Tory (1529), and alphabet from E. Mulir's Lettres et Enseignes Art Nouveau.</p>
