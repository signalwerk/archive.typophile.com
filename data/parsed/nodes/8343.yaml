    html: <p>Publishing samples certainly doesn't give any rights to author or publisher. <br> <br>I know that Dyana Weissman (FontBureau) is working on a Materot script face. <br> <br>The Tory stuff is way too old/disinherited to enjoy any legal protection. <br> <br>hhp</p>
