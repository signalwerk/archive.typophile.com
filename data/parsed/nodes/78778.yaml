    <p>Hello All,</p>
    <p>Long time reader who just joined the Typophile fray.  I'd love to introduce one of three new families our team will be working on.  All should be available within the month. You can find our latest, as yet unnamed, at <a href="http://www.polyglyphic.com/news" title="http://www.polyglyphic.com/news">http://www.polyglyphic.com/news</a>.  Our other two are in the works and can be found under our fonts tab.</p>
    <p>Thank you for the attention! We're very excited to release these...</p>
