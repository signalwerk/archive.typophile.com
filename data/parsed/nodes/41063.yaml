  html: |-
    <p>I’m designing a logo for a stationary line, and after much research I’m still clueless about what font to use.  The stationary can be described as modern, bold, elegant and feminine (not overly feminine, though) and the company has a strong “earth friendly” profile.  I have been thinking of Coquette, but I’m not sure...  I also need a compainion font that can be used for product info placed directly under the logo.</p>
    <p>Any suggestions would be much appreciated!</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/40985" class="topic-previous" title="Go to previous forum topic">‹ mixed-type logotype</a> <a href="/node/39900" class="topic-next" title="Go to next forum topic">Fonts with old style tabular figures ›</a></div>
