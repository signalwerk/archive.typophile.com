      <p><a href="/wiki/Diotima" class="wiki">Diotima</a> is a great suggestion, and it boasts a splendid italic (having said that, I’ve never had a client accept it yet!)</p>
      <p>If you want something modern, elegant and gentle without being <em>too</em> feminine, why not consider a light weight of <a href="/wiki/Avenir" class="wiki">Avenir</a>? It’s hugely versatile.</p>
