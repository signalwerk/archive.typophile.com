      <p>If you mean you are designing a logo for a line of stationery, you might consider the elegant and rather feminine:</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/diotima/">Diotima</a> by Gudrun Zapf von Hesse,</p>
      <p><a href="http://www.myfonts.com/fonts/berthold/nofret-be/">Nofret</a> also by Gudrun Zapf von Hesse,</p>
      <p>or <a href="http://www.myfonts.com/fonts/urw/weiss-antiqua/">Weiss Antiqua</a> by Emil Rudolf Weiss, among several others like this.</p>
      <p>Really, any of the “classics” from richly calligraphic Venetian Humanist fonts like Jenson and Bembo to crisper Romantic Didones like Bodoni, Didot and Walbaum could be made to work very well for a project like this.</p>
      <p>David Thometz</p>
