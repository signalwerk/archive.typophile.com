    html: "<p>Does a BMW designer get annoyed by the fact that some people are stuck driving Trabants? Nope. But he sure gets annoyed when a Trabant designer pretends that his stuff is just as good as a BMW. Especially annoying is a Trabant designer who is put in a position to ask a BMW designer exactly how better design <i>doesn't</i> matter... What a wonderful maxim for type design: \"Good design doesn't matter.\" People don't drive crappy cars because there's nothing wrong with it, they drive crappy cars because they don't know any better. Don't celebrate ignorance, even if it makes your job a lot easier. Learn to see inside the murkiness instead, even though you will find no cozy Answer. <br> <br>hhp <br></p>"
