    html: "<p>I have the feeling that maybe the distinction between legibility and readability is not clear enough (or maybe I haven�t understood it well). <br>For legibility I�m understanding the typographic contrast which make letters recognizable, depending on the x height, the contrast, the conventionality, etc. <br>For readability I�m understanding the quality of a text by which it�s comprehensible, not having anything to do with type but with syntaxis, topic familiarity, clear ideas, etc. <br>The relation between them is proportionally inverse: a readable text relies less on legibility and an unreadable text relies more on it because there is a need for extra visual information to predict and confirm the sense of the reading. I also have the notion that text recognition can be affected by unreadability due to the lack of a predictive direction on the perceptive task given by the understood sense of the text. Right? <br> <br>I still can�t find the fault on the sake of an improvement nor a reason to pick on someone because of it, even if it�s not considered worthy or significant or by some.</p>"
