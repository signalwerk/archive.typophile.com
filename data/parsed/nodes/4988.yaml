    html: <p>Hrant, <br> <br>Ever heard of "Braille"? <a href="http://www.rit.edu/~easi/easisem/nemeth2.htm" target="_blank">http://www.rit.edu/~easi/easisem/nemeth2.htm</a>  <br> <br>Designing a BMW has nothing to do with speed. It it did they would be designing fighter jets. Old ladies drive cars. Even you can drive, almost anyone can drive. Read too. <br> <br>BMW design is about "style", <a href="http://www.crxsi.com/mycar/lada.htm" target="_blank">http://www.crxsi.com/mycar/lada.htm</a> <br> the "driving experience" and for you, maybe an "identity crisis". Car and type design are "fashion statements" <br> <br>"a matter of taste."  <br> <br>So it is understandable why you get confused. A type designer that hates poetry and art, to put it bluntly, is in the wrong industry. <br> <br>Also it is the last time I will be sympathetic to your attacks on people about "raw capitalism". Nothing could be more tacky than tooling around in some "bald mans" machine disguised as a wheeled Heinenken can burping out "unfashionable" hydocarbons. Are you old enough for this? � <a href="http://www.heineken.com/canada/" target="_blank">http://www.heineken.com/canada/</a> <br>Doesn't take a genius to drink either. You just have to be over nineteen. <br> <br>I would never have taken you for a yuppy. What do I know? Gullible I guess. You probably got one of those cell phone contraptions crazy glued to your ear. <br> <br>So ends your fable.  <br> <br><a href="http://www.aesopfables.com/" target="_blank">http://www.aesopfables.com/</a> <br> <br>Oh, yes, before I forget, I do like poetry. <br><a href="http://lanstontype.com/GiampaIntroduction.html" target="_blank">http://lanstontype.com/GiampaIntroduction.html</a> <br><a href="http://lanstontype.com/EzraPound.html" target="_blank">http://lanstontype.com/EzraPound.html</a> <br> <br> <br></p>
