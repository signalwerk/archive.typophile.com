    html: <p><i>... random words on text make it less readable</i> <br> <br>Random words in text make it less comprehensible, but not necessarily less readable in the sense that 'readble' is commonly used on Typophile. The line between the cognitive acts of text recognition and of understanding is a porous one, and 'reading' understood in toto involves both, but the impact of random words on reading speed has to do with our ability to make sense of the text, not our ability to recognise words. In most of the discussions of readability among typographers and type designers, the comprehensive aspect is ignored, since the professional obsession is with the cognitive act of text recognition. Introducing the comprehensive aspect of reading further diminishes the relative impact of type design, since it is obvious that good writing is more important than a good typeface.</p>
