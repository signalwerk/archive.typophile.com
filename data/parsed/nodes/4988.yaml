    html: "<p><i>I thought you had that already?</i> <br> <br>Not full stats. I'd observed the much greater incidence of word-terminal resh while examining various editions. Actually, I was surprised by how high the distribution of terminal dalet is in Eli's stats: I would have guessed that it was even lower. <br> <br> <br>By the way, I've just completed another Hebrew typeface design that is in many respects less traditional than SBL Hebrew, but using some of the same techniques for letter differentiation. Initial response from Hebrew readers has been very positive. I pursue advancement in typeface design as cumulative effort. One could spend years thinking and talking about the radical breakthrough that one intends to make, endlessly tuning the same typeface, or would could design and release a body of work.</p>"
