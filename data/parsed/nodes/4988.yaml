    html: "<p>That data is very nice - thank you. And it seems to support giving a spur to the final-kaf, at least for a font specifically for Biblical Hebrew. On the other hand (and especially if you believe Larson :-), overall frequency data would be important too, like if dalet is more frequent than resh overall. Also, I'd be interested to find out if general Hebrew text is different. <br> <br>But I don't want to divert from my main point: this sort of analysis is <i>doubly</i> \"insignificant\", no? :-/ <br>You really can't say readability is minutia and then spend so much effort analyzing dissimilation. <br> <br>&gt; you have frequently in the past insulted other type designers <br> <br>I'm frankly tired of the whining. I've been insulted 10 times more than any of you, but I don't allow that to derail the <i>content</i>. You're not going to get me to follow your particular shallow interpretation of how people should behave - so please just move on. And most of all, don't use my \"bad behavior\" as a proxy target, as an excuse for what you're <i>really</i> pissed about: my ideas. <br> <br>&gt; the only serious and worthy approach to their craft. <br> <br>I've never said such a thing - that would be inhuman. <br> <br>On the other hand, I certainly have a problem with people who value their own formal expression more than the needs of users. And I'm not the only one with this complaint, simply the most vocal one, and the one who doesn't believe in your rules of social behavior and hence is the most convenient target. <br> <br>&gt; I'm trying to figure out why you keep picking on my SBL Hebrew font <br> <br>Here you're either halucinating, or my memory is failing me in a way it almost never does. I've only said good things about SBL Hebrew - this complaint about the final-kaf is the only negative thing I've said about it, and it's minor* - certainly \"fatal flaw\" is way off. The only really bad design you've made (in fact it wasn't even you who made it!) is the Georgian component of Sylfaen: its cartoonish proportions make it indeed fatally flawed <i>as a text face</i>, while its Latin part is very much a text face**. Overall I think your work is very solid, if too conventional. Sort of like the Slimbach of the non-Latin world. To whom it may concern: take that as an insult if that turns you on - but it's not one. <br> <br>* Plus I might even admit it was an incorrect opinion, pending more data and thought. <br> <br>** And I understand that there were other attenuating circumstances: Dumbadze passed away during its development, and it was never supposed to actually be released. <br> <br>&gt; I was surprised by how high the distribution of terminal dalet is in Eli's stats <br> <br>That's normal: anecdotal observation typically exagerates the empirical \"truth\", possibly in order to better notice things and remember them. <br> <br>&gt; I pursue advancement in typeface design as cumulative effort. <br> <br>Me too. <br> <br>hhp <br></p>"
