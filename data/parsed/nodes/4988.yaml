    html: "<p><img src=\"http://www.typophile.com/forums/messages/30/37767.jpg\" alt=\"steinweiss\"> <br>Design and lettering by Alex Steinweiss, 1948 <br>From \"For the record\"  <br> <br>The incomparable Steinweiss used many pens, did plenty of embellishments in many genres, but never classical-style flourished ligatures. (So far as I can tell from my record collection and the examples in the book.) Here, he could have done the \"st\" lig in Kostelanetz. <br> <br>The style of lettering identified with him, now available as a font named \"Hairspray\" for some strange reason, and (shame!) unattributed (and I bet he doesn't get royalties either), is a casual, cursive, light monoline script. It was made into a font in 1939, \"Steinweiss Scrawl\", and available from Photolettering Inc. in the 1950s. <br> <br>Conclusion: the flourished joining ligatures are a product of writing with a broad-nib pen. They would be easy to do with a round-nibbed \"Speedball\" pen (presumably what Steinweiss used), but they don't belong ... unless the calligrapher is in a Post-modern groove.  <br> <br>Or Pseudo-proto-modern: Storm added the ct and st ligs to Sebastian, his 18th century sans serif.</p>"
