    html: "<p>I wrote: <i>Give me a couple of days.</i> <br> <br>We're in luck, the brilliant Eli Evans at Libronix, one of the partners in the SBL Font Foundation, quickly came up with this data. Over the past year, Eli has sliced and diced the Hebrew Bible for me in a variety of ways, providing invaluable insight on frequency, rare mark combinations etc. <br> <br>The graph below shows the frequency of individual consonant endings of the 263,654 words in the WTS electronic Hebrew Bible, analysing both <i>ketiv</i> and <i>qere</i> readings. Eli notes: 'X is for words that I didn't find an ending consonant in ... There are only 16, so I don't think I'll worry about it too much. I'm surprised that 9 words end with a non-final nun, though.' <br> <br>The middle column is the number of words ending in the consonant on the left. The column on the right is the percentage of the total number of words. <br> <br>X...........16..........0.01 <br>alef........11588.......4.40 <br>bet.........6678........2.53 <br>gimel.......418.........0.16 <br>dalet.......7230........2.74 <br>he..........39882......15.13 <br>vav.........29151......11.06 <br>zayin.......578.... ....0.22 <br>het.........3766........1.43 <br>tet.........1181........0.45 <br>yod.........28703......10.89 <br>kaf-F.......13520.......5.13 <br>lamed.......11907.......4.52 <br>mem-F.......38851......14.74 <br>nun-F.......12205.......4.63 <br>nun.........9...........0.00 <br>samekh......700.........0.27 <br>ayin........3736........1.42 <br>pe-F........2413........0.92 <br>tsadi-F.....3219........1.22 <br>qof.........1841........0.70 <br>resh........20974.......7.96 <br>shin........5818........2.21 <br>tav.........19270.......7.31 <br> <br>-F indicates athe final form consonant. Here is Eli's graph: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/37911.gif\" alt=\"Hebrew Ending Consonant Distribution\"></p>"
