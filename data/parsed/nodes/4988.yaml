    html: "<p>&gt; significantly improve <br> <br>And yet again I have to point out the obvious issue: <br>What is \"significant\" in type design? Almost nothing. So it's a matter of context, and a good craftsman needs to be very concerned with the smallest of gains - they are \"significant\" to him, as a person creating quality objects, if for no other reason than because that justifies his existence, because it makes him happy. It is in the context of our individuality that any of this is \"significant\" - otherwise there are <i>extremely</i> few really \"significant\" reasons to make new fonts. Plus that effort is usually better spent elsewhere anyway! <br> <br>Was it \"significant\" to use an esoteric pen to make SBL Hebrew*? Who the hell would have noticed any difference? And then you claim \"enhanced dissimilation between similar Hebrew letters\", but when needed you say it doesn't matter? And then you put the top-right spur on the final-kaf anyway, even though that's exactly opposite of the claim! Only the most conservative fonts -the ones that don't worry about dissimilation- do that. I honestly don't know what to think about the aggregate of your opinions on functionality. It really seems that you're just giving people what they <i>expect</i>, depending on context. Sure, expectation is part of functionality too, but there has to be an overall rhyme and reason, at least on the personal level - otherwise it's just reactionary. <br> <br>* Although when it seems necessary you tend to claim that the pen didn't influence the result... <br> <br>And then I have to repeat this yet again, apprently: There is a difference between what people think they can read comfortably versus what they can read comfortably for extended periods, without even realizing. It is in the latter arena that a good craftsman is most concerned. It is in the <i>promotion</i> of efficiency, not the assumption of its irrelevance, that good design is best expressed. People don't read \"fast enough\" [partly] because of bad typography (and type), not because they can't read any faster. That's why using a serif font for a book matters for example. They can read sans just fine, so why not use sans for books? Because the more you push the limits of performace, the more the supposedly \"insignificant\" things matter. <br> <br>&gt; you'd be talking about page layout <br> <br>But I don't like page layout. Get it? <br> <br>That's like me telling you: If you're really concerned about conveying information to people (the main point of typography), then dedicate your life to the publishing and distribution of books - and websites! Or maybe you should be <i>writing</i> book? And since conveying information to people is intended to help them, I might propose that you forget typography entirely, and concentrate on what the bulk of the human population is severly lacking and truly needs: not books, but food and decency!! Who was more significant, Claude Garamont or Rachel Corrie? Or Mother Teresa?! Who gives a crap about Garamont. <br> <br>But in order to propose such things I would need to ignore what <i>you</i> need out of life - what is in <i>your nature</i>. And I will not do that - because it doesn't make sense. <br> <br>hhp <br></p>"
