    html: "<p>Hrant, I never implied that good design didn't matter. What I challenge is the notion that changes in typeface design can significantly improve on what we already do so well: read text. There are plenty of other reasons to design new text typefaces and to design them well, but to pretend that we're chasing some elusive readability is, as I've said before, to willfully ignore the daily reading experience of many hundreds of miliions of people reading a great diversity of writing systems under incredibly diverse and often adverse conditions. Human beings are better at reading than any improvement at the type design level can significantly affect. If you really cared about readability, you wouldn't be talking about type design at all: you'd be talking about page layout, printing and screen technologies, and other things that do have a significant impact on readability. Readability at the type design level is the base prerequisite, not an achievement.</p>"
