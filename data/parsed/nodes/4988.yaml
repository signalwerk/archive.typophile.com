    html: "<p>Hrant, you have frequently in the past insulted other type designers for failing to accept your insistence on readability as the only serious and worthy approach to their craft. On Typophile and the ATypI list, and presumably elsewhere, you have been scathing about 'creativity', 'artistes', etc. It is to this that I was alluding and objecting, not because I'm a champion of romantic creation or artistry, but because my own interest in readability leads me to different conclusions from yours. You've put typeface readability on a pedestal, while I think it belongs in the foundation, where it can do most good. What we build on top of that foundation is cultural. <br> <br>I'm really not looking for a fight. I'm trying to figure out why you keep picking on my SBL Hebrew font (last time, you even used your favourite phrase: 'fatal flaw'), when numerous people -- the intended users of the font --, who know a lot more about Biblical Hebrew than either you or I, have described it as the best Hebrew font they have ever used. I suggest you conduct a survey of the printing of critical editions of the Hebrew Bible, as I have. Then you'll see just how significant is the improvement in letter differentiation between SBL Hebrew and the typefaces that Biblical Scholars have been working with for more than 100 years.</p>"
