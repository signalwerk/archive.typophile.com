    html: "<p><i>Yes, this would be significant - and it would be quite a nice refinement - as well as an endorsement for linguistic analysis! Is the data available?</i> <br> <br>I can probably get a count of word terminal letters. Give me a couple of days. <br> <br><i>And a question: So is it the opposite in general Hebrew text? </i> <br> <br>Probably. However, modern Hebrew distinguishes tense in a regular way, and I don't how this is done or what impact it might have on word endings. <br> <br> <br>I don't rely on writing instruments to make any font. In the case of SBL Hebrew, <i>unusually</i>, I began the design process by making letters with a broadnib. This wasn't designing per se, this was research on how the steep ductus of Middle Eastern scripts affects the contrast pattern of individual letters in specific writing styles. As I explained during my ATypI presentation on the subject, I think it is important to understand a script within a cultural and historical context, and the best way to understand a script is to write it as it has been written. It happened, at the time, that I didn't have a broadnib pen with the properly angled nib, so I just used a typical broadbnib calligraphy pen. For the next time I want to write Hebrew or Arabic, I now have a set of properly cut reed pens. <br> <br>I'm troubled that you seem to have conflated this initial research and sketching with designing the typeface, and in some determinative way. As I've explained several times in the past, I design my types entirely onscreen. If I sketch on paper, with outlines, shading, a nib, or any other method, it is only to explore ideas about form. I suppose there might be someone out there who could actually produce the forms of SBL Hebrew, with their various non-chirographic adjustments of weight and terminal, with a broadnib pen. I couldn't. <br> <br><i>Anyway, my point is that relying on a particular writing instrument to make a font is no less esoteric than worrying about readability. </i> <br> <br>Indeed, and there is nothing wrong with esoterica, especially not in this business. But there would be something wrong with demanding that all other type designers should use this particular tool, and insulting them if they don't.</p>"
