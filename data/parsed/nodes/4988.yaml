    html: <p>&gt; hand rendered <br>Yes, obvious, but I was putting it forward as an alternative to the upward movement over the second stroke of the c, with its risk of "pooling". I don't claim that it is easier, quicker or even more elegant, I assumed that one could extrapolate it to a calligraphic solution. <br> <br>&gt; humanly possible <br>People write in different ways, I don't write with my pen always on the paper, but after consideration and a few attempts it was not difficult. So I tried it and although it is a bit strange to make the strokes in haste, it would just be a question of getting used to it. The strokes, after all, are not that different one would use for most circular letters albeit at a smaller scale. <br> <br>I imagine that it wouldn't be a effective way to write quickly but as an ornamentation/affectation when doing calligraphy it can work � the main drawback would be mis-reading ct as et so care would have to be employed. Nor do I imagine that it would be a effective method for creating a ligature for a font (since one cannot govern the size that it would be used), but in a logo it might be useful. I have included an e so that the distinction is clear. I agree that the first sample is the easiest and probably what is generally used, but that shouldn't halt experimentation. <br> <br>Tim <br><img src="http://www.typophile.com/forums/messages/30/37749.jpg" alt="ct sample"></p>
