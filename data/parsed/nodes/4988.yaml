    html: <p>Tim, your demonstration is appreciated...  but it still doesn't prove the (human) possibility of creating the figure on the magazine cover by means of the broadnib pen.  The figure YOU created is fundamentaly different than that which adorns 'Practical Electrics'; the width of the loop's modulation is the same as the letter c's broadest arc--a human possibility (albeit strained). <br> <br>All apologies if that sounded rude, Tim.  I wasn't attacking you personally, just trying to show that the connective loop in that particular ligature is humanly impossible (regardless of whether or not that actually has any bearing on issues of readability or legibility).</p>
