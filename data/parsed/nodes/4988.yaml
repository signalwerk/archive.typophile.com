  html: "<p>Eduardo, Legato has its own site - one font that certainly deserves it: <br><a href=\"http://www.xs4all.nl/~ebloem/index.html\" target=\"_blank\">http://www.xs4all.nl/~ebloem/index.html</a> <br>It should have its own thread here too. <br> <br>The quantum leap contained in Legato is indeed somewhat \"covert\" - it seems highly conventional on the surface. But it's the first font (that I know of) that deliberately and intelligently breaks the domination of the Black. It's the first \"notanic\" typeface, where the importance of the White is given more than mere lip-service; it creates bonds in the White, hence promoting boumas. In this way it breaks the biggest barrier towards optimal text type. <br> <br>Which isn't to say I think it's perfect - in fact it has a serious drawback - it's a <i>constructed</i> font. It's basically too Modernist, too regular. It needs some Fleischmann hazy magic to become divine. <br> <br>Plus it doesn't have serifs.  :-) <br> <br>-- <br> <br>&gt; please don't think I'm arguing <br> <br>Why not?  :-&gt; <br>I appreciate you giving your best shot! It's how I learn. <br> <br>hhp <br></p>"
  html_clean: "<p>Eduardo, Legato has its own site - one font that certainly deserves it: <br><a href=\"http://www.xs4all.nl/~ebloem/index.html\" target=\"_blank\" class=\"link-external\">http://www.xs4all.nl/~ebloem/index.html</a> <br>It should have its own thread here too. <br> <br>The quantum leap contained in Legato is indeed somewhat \"covert\" - it seems highly conventional on the surface. But it's the first font (that I know of) that deliberately and intelligently breaks the domination of the Black. It's the first \"notanic\" typeface, where the importance of the White is given more than mere lip-service; it creates bonds in the White, hence promoting boumas. In this way it breaks the biggest barrier towards optimal text type. <br> <br>Which isn't to say I think it's perfect - in fact it has a serious drawback - it's a <i>constructed</i> font. It's basically too Modernist, too regular. It needs some Fleischmann hazy magic to become divine. <br> <br>Plus it doesn't have serifs.  :-) <br> <br>-- <br> <br>&gt; please don't think I'm arguing <br> <br>Why not?  :-&gt; <br>I appreciate you giving your best shot! It's how I learn. <br> <br>hhp <br></p>"
