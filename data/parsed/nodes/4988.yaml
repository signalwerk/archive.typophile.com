    html: <p>Nick <br> <br><i>Speaking of ligs, how about that "Ov" ?!</i> <br> <br>Strictly ornamental. <br> <br>���������� <br> <br>A. Scott Britton <br> <br><i>Won't the looped "ct" ligature rub someone the wrong way because they at least have some subconscious knowledge that it isn't humanly possible?</i> <br> <br>Strictly ornamental, people just love it. "talk about it too!" <br> <br>���������� <br> <br>Hrant <br> <br><i>"The difference between legibility and readability"</i> <br> <br>Strictly dismal. <br> <br>Where has our morality gone?  <br> <br>Readability is a conspiracy between the French eye glass manufactureres and book publishers which allowed printers to manufacture "smaller books", with "smaller type". Economy at the expense of the reader. Some present typophiles continue to convince the reader they are either blind, or stupid. <br> <br>Never believe your own advertising literature. Some typophiles have become victims of their industries plot?  Some believe the reason they can not read is because of some fault of the type. Well some people are blind, and some, are stupid. But not all. <br> <br>To think once we were the instruments of wisdom, instruments of enlightenment, freedom. <br> <br>Oh where, oh where has our humanity gone? <br> <br> <br></p>
