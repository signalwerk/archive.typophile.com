    html: <p>John, <br> <br><i>On Typophile and the ATypI list, and presumably elsewhere, you have been scathing about 'creativity', 'artistes', etc. It is to this that I was alluding and objecting, not because I'm a champion of romantic creation or artistry, but because my own interest in readability leads me to different conclusions from yours. You've put typeface readability on a pedestal, while I think it belongs in the foundation, where it can do most good. What we build on top of that foundation is cultural.</i> <br> <br>I think you have hit the nail on the head. Readability is naturally important. Such as tea, you drink tea, you don't eat tea. Maybe the English do, they like it strong. We should assume that tea is to be drunk, we should take that for granted.  Tea has other qualities that are of more interest. It is these other qualities that are of importance, the cultural, the serving, the ceremony. Little need to be said that you can drink tea. If that were not the case�it simply would not be tea�it would be something else. So why dwell on what simply is more than obvious. <br> <br>In fact, what makes tea more drinkable is not that it is pourable�it is the "taste". <br> <br>Yes, I may be one of those "Artistes" you are speaking of. <br></p>
