    html: "<p><i>What is \"significant\" in type design? Almost nothing. So it's a matter of context, and a good craftsman needs to be very concerned with the smallest of gains - they are \"significant\" to him, as a person creating quality objects, if for no other reason than because that justifies his existence, because it makes him happy. It is in the context of our individuality that any of this is \"significant\" - otherwise there are extremely few really \"significant\" reasons to make new fonts.</i> <br> <br>This is all fine and good: if you want to justify your existence by obsessing about the miniscule significance within a miniscule significance that is improved readability at the type design level, go ahead. But it is far from clear from your typical pronouncements on this subject that this is all about 'individuality', especially when you are insulting other individuals because they don't share your obsession. <br> <br><i>Was it \"significant\" to use an esoteric pen to make SBL Hebrew*? Who the hell would have noticed any difference? And then you claim \"enhanced dissimilation between similar Hebrew letters\", but when needed you say it doesn't matter? And then you put the top-right spur on the final-kaf anyway, even though that's exactly opposite of the claim! Only the most conservative fonts -the ones that don't worry about dissimilation- do that.</i> <br> <br>So you would prefer to confuse the final kaf with the resh rather than with the dalet? The distinguishing feature of the final kaf is its descender, which is perfectly sufficient for differentiation, especially since the letter only occurs in at the end of a word. Some typefaces model the transition from the horizontal to the vertical on the dalet (spurred) others on the resh (rounded), a few use a hybrid approach. Zvi Narkiss developed a neo-Sepharidic style that tends to favour the rounded form, and I admire his types very much, but in SBL Hebrew I decided to follow a more traditionally typographic, less cursive form. User expectation is one consideration, yes, because the users are Biblical scholars most of whom are familiar with only one or two other Hebrew typefaces (shifting from an 19th century Ashkenazic style to a Sephardic one was enough of a shock for some of them when they first saw SBL Hebrew). However, the other functional consideration -- and this is something that should be right up your street -- is that more words in the Biblical text end in resh than in dalet, therefore it seems  more important to distinguish the final kaf from resh than from dalet.</p>"
    html_clean: "<p><i>What is \"significant\" in type design? Almost nothing. So it's a matter of context, and a good craftsman needs to be very concerned with the smallest of gains - they are \"significant\" to him, as a person creating quality objects, if for no other reason than because that justifies his existence, because it makes him happy. It is in the context of our individuality that any of this is \"significant\" - otherwise there are extremely few really \"significant\" reasons to make new fonts.</i> <br> <br>This is all fine and good: if you want to justify your existence by obsessing about the miniscule significance within a miniscule significance that is improved readability at the type design level, go ahead. But it is far from clear from your typical pronouncements on this subject that this is all about 'individuality', especially when you are insulting other individuals because they don't share your obsession. <br> <br><i>Was it \"significant\" to use an esoteric pen to make SBL Hebrew*? Who the hell would have noticed any difference? And then you claim \"enhanced dissimilation between similar Hebrew letters\", but when needed you say it doesn't matter? And then you put the top-right spur on the final-kaf anyway, even though that's exactly opposite of the claim! Only the most conservative fonts -the ones that don't worry about dissimilation- do that.</i> <br> <br>So you would prefer to confuse the final kaf with the resh rather than with the dalet? The distinguishing feature of the final kaf is its descender, which is perfectly sufficient for differentiation, especially since the letter only occurs in at the end of a word. Some typefaces model the transition from the horizontal to the vertical on the dalet (spurred) others on the resh (rounded), a few use a hybrid approach. Zvi Narkiss developed a neo-Sepharidic style that tends to favour the rounded form, and I admire his types very much, but in SBL Hebrew I decided to follow a more traditionally typographic, less cursive form. User expectation is one consideration, yes, because the users are Biblical scholars most of whom are familiar with only one or two other Hebrew typefaces (shifting from an 19th century Ashkenazic style to a Sephardic one was enough of a shock for some of them when they first saw SBL Hebrew). However, the other functional consideration -- and this is something that should be right up your street -- is that more words in the Biblical text end in resh than in dalet, therefore it seems  more important to distinguish the final kaf from resh than from dalet.</p>"
