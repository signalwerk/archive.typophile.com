    html: "<p>&gt; the distinction between legibility <br>&gt; and readability is not clear enough <br> <br>Yes, it's confusing. <br>\"Legibility\" has a (relatively) focused meaning, concerning the decipherability of individual glyphs; but readability is over-loaded*, with at least three different meanings: to most poeple it refers to the textual content, as in text that's written so as to be easily understood; to most typographers it refers to the page layout, paragraph attributes like good leading, linebreaks, etc.; and the third -most esoteric and controversial, but I feel most impotant to the context of type design- meaning concerns the font itself: the way in which a font promotes decipherment of boumas - different than the decipherment of individual letters. So for example a sans is more legible but less readable than a serif font; and tight letterspacing helps readability but reduces legibility. <br> <br>* Such over-loading is certainly inconvenient, but it's common, and generally context -which is always there- focuses the meaning quite well. <br> <br>-- <br> <br>&gt; if you want to justify your existence by obsessing about .... <br> <br>OK, but I don't see how it's any less \"significant\" than what you choose to focus on. In the context of the world, they're really about the same. Does my preoccupation with reintroducing readability (in tandem with authenticity, in this case) into Armenian less significant that the way you choose to worry about what kind of pen to use for SBL Hebrew? <br> <br>&gt; it is far from clear from your typical pronouncements <br> <br>Yes, you have a point, and I'm slowly learning to tame my insistence that every other type designer worry [as much] about readability - it doesn't make sense. On the other hand, I think I will always get annoyed when a type designer claims that readability simply doesn't matter outright, and (to a lesser extent) when a user doesn't appreciate the difference between a designer who cares about fine-tuning readability and one who doesn't. <br> <br>BTW, I don't think it's \"obsessive\", because I know that it's just one factor - which is the reason for example that some glyphs in Patria (like the \"a\" and \"e\") have intentionally sub-optimal readability, to promote the \"robust\" character of the face. And like I've said before, one reason I drone on about readability is that so few other people do, and so many other people want it not to matter. <br> <br>&gt; you would prefer to confuse the final kaf with the resh rather than with the dalet? <br> <br>I actually don't know enough myself (what are the relative frequencies, especially wrt position?), I'm actually mostly referring to what \"native\" Hebrew designers (who have an innate linguistic sensitivity that we don't) are doing: it's not just one Narkiss font - the font in the Unicode table, Friedlaender's popular Hadassah of the late 50s, and every single Hebrew font in Bukvaraz*, with the highly notable exception of the hyper-conservative Nathan, uses the \"soft-corner\" form. <br> <br>* Even the super-blocky Atzmaut. <br> <br>And considering you're such a good researcher, I have to think that you knew about this general trend, but you either thought it's wrong, or you thought that in this case the spurred form makes more sense. Both could be valid, but the second one simply doesn't jibe with dissimilitude (as far as I can tell), which in turn doesn't jibe with what you've said in this thread! <br> <br>&gt; The distinguishing feature of the final kaf is its descender <br> <br>But the descender space is so weak in Hebrew - it doesn't seem safe to rely on it. But it depends -again- on the difference between legibility and readability. Sure, when you give a person many seconds to decide what a glyph is, there's no problem - there almost never is. But there are much more severe requirements of decipherability during high-speed immersive reading. Just like how an \"rn\" can be read as an \"m\" in English text - but only during immersion. And this is also why typos go unnoticed so frequently. <br> <br>&gt; I decided to follow a more traditionally typographic, less cursive form. <br> <br>Right. And my point is that to me it seems to have been at the expense of the \"dissimilitude\" that you claim. My impression is that this conservatism was the deciding factor, irrespective of dissimilitude, linguistics, etc. <br> <br>But really, what I mind most isn't that you're conservative, it isn't that you claim \"dissimilitide\", and it isn't that you're saying it doesn't matter anyway - it's the confluence of all three!  :-/ <br> <br>BTW, I'm really not trying to discredit you in toto, I just want to point out what I see as the flaw in the aggregate opinion/action. <br> <br>&gt; more words in the Biblical text end in resh than in dalet <br> <br>Yes, this would be significant - and it would be quite a nice refinement - as well as an endorsement for linguistic analysis! Is the data available? <br> <br>And a question: So is it the opposite in general Hebrew text? <br> <br>hhp <br></p>"
    html_clean: "<p>&gt; the distinction between legibility <br>&gt; and readability is not clear enough <br> <br>Yes, it's confusing. <br>\"Legibility\" has a (relatively) focused meaning, concerning the decipherability of individual glyphs; but readability is over-loaded*, with at least three different meanings: to most poeple it refers to the textual content, as in text that's written so as to be easily understood; to most typographers it refers to the page layout, paragraph attributes like good leading, linebreaks, etc.; and the third -most esoteric and controversial, but I feel most impotant to the context of type design- meaning concerns the font itself: the way in which a font promotes decipherment of boumas - different than the decipherment of individual letters. So for example a sans is more legible but less readable than a serif font; and tight letterspacing helps readability but reduces legibility. <br> <br>* Such over-loading is certainly inconvenient, but it's common, and generally context -which is always there- focuses the meaning quite well. <br> <br>-- <br> <br>&gt; if you want to justify your existence by obsessing about .... <br> <br>OK, but I don't see how it's any less \"significant\" than what you choose to focus on. In the context of the world, they're really about the same. Does my preoccupation with reintroducing readability (in tandem with authenticity, in this case) into Armenian less significant that the way you choose to worry about what kind of pen to use for SBL Hebrew? <br> <br>&gt; it is far from clear from your typical pronouncements <br> <br>Yes, you have a point, and I'm slowly learning to tame my insistence that every other type designer worry [as much] about readability - it doesn't make sense. On the other hand, I think I will always get annoyed when a type designer claims that readability simply doesn't matter outright, and (to a lesser extent) when a user doesn't appreciate the difference between a designer who cares about fine-tuning readability and one who doesn't. <br> <br>BTW, I don't think it's \"obsessive\", because I know that it's just one factor - which is the reason for example that some glyphs in Patria (like the \"a\" and \"e\") have intentionally sub-optimal readability, to promote the \"robust\" character of the face. And like I've said before, one reason I drone on about readability is that so few other people do, and so many other people want it not to matter. <br> <br>&gt; you would prefer to confuse the final kaf with the resh rather than with the dalet? <br> <br>I actually don't know enough myself (what are the relative frequencies, especially wrt position?), I'm actually mostly referring to what \"native\" Hebrew designers (who have an innate linguistic sensitivity that we don't) are doing: it's not just one Narkiss font - the font in the Unicode table, Friedlaender's popular Hadassah of the late 50s, and every single Hebrew font in Bukvaraz*, with the highly notable exception of the hyper-conservative Nathan, uses the \"soft-corner\" form. <br> <br>* Even the super-blocky Atzmaut. <br> <br>And considering you're such a good researcher, I have to think that you knew about this general trend, but you either thought it's wrong, or you thought that in this case the spurred form makes more sense. Both could be valid, but the second one simply doesn't jibe with dissimilitude (as far as I can tell), which in turn doesn't jibe with what you've said in this thread! <br> <br>&gt; The distinguishing feature of the final kaf is its descender <br> <br>But the descender space is so weak in Hebrew - it doesn't seem safe to rely on it. But it depends -again- on the difference between legibility and readability. Sure, when you give a person many seconds to decide what a glyph is, there's no problem - there almost never is. But there are much more severe requirements of decipherability during high-speed immersive reading. Just like how an \"rn\" can be read as an \"m\" in English text - but only during immersion. And this is also why typos go unnoticed so frequently. <br> <br>&gt; I decided to follow a more traditionally typographic, less cursive form. <br> <br>Right. And my point is that to me it seems to have been at the expense of the \"dissimilitude\" that you claim. My impression is that this conservatism was the deciding factor, irrespective of dissimilitude, linguistics, etc. <br> <br>But really, what I mind most isn't that you're conservative, it isn't that you claim \"dissimilitide\", and it isn't that you're saying it doesn't matter anyway - it's the confluence of all three!  :-/ <br> <br>BTW, I'm really not trying to discredit you in toto, I just want to point out what I see as the flaw in the aggregate opinion/action. <br> <br>&gt; more words in the Biblical text end in resh than in dalet <br> <br>Yes, this would be significant - and it would be quite a nice refinement - as well as an endorsement for linguistic analysis! Is the data available? <br> <br>And a question: So is it the opposite in general Hebrew text? <br> <br>hhp <br></p>"
