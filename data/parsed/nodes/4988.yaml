    html: "<p>H�ctor, <br> <br>What the question is, why is speed the only consideration in type design? When we are confronted with fathoms of illuminating objectives why would anyone pick designing for  \"the reading impaired\"?  If you want to \"speed read\" take the class. <a href=\"http://www.rocketreader.com/\" target=\"_blank\">http://www.rocketreader.com/</a> <br> <br>Think about it. Even they don't blame it on the type. Mind you they haven't seen everything. <br> <br>But to answer your question, naturally you want to improve your type design. Start by making it beautiful. It won't be if you can't read it, but don't worry, people know how to read. <br> <br>My friend, make your type sing like the nightingales. <br> <br>For Hrant, <br> <br>NIGHTINGALES <br>�� <br>BEAUTIFUL must be the mountains whence ye come,\t <br>And bright in the fruitful valleys the streams, wherefrom\t� <br>Ye learn your song:\t� <br>Where are those starry woods? O might I wander there,\t� <br>Among the flowers, which in that heavenly air\t <br>Bloom the year long!\t� <br>� <br>Nay, barren are those mountains and spent the streams:\t� <br>Our song is the voice of desire, that haunts our dreams,\t� <br>A throe of the heart,\t� <br>Whose pining visions dim, forbidden hopes profound, No dying cadence nor long sigh can sound,\t�For all our art.\t� <br>� <br>Alone, aloud in the raptured ear of men\t� <br>We pour our dark nocturnal secret; and then,\t� <br>As night is withdrawn <br>From these sweet-springing meads and bursting boughs of May,\t� <br>Dream, while the innumerable choir of day\t� <br>Welcome the dawn. <br> <br>Robert Bridges.�b. 1844</p>"
