    <p>Hoefler &amp; Frere-Jones is <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a> and <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a></p>
    <p>In 2004, <a href="/wiki/The%20Hoefler%20Type%20Foundry" class="freelinking" rel="nofollow">The Hoefler Type Foundry</a> entered its sixteenth year as Hoefler &amp; Frere-Jones. H&amp;FJ continues to work with brand leaders in every sector, developing original typefaces and licensing fonts from its library of nearly 1,000 designs, and it publishes fonts exclusively through its New York sales office and its web site at typography.com.</p>
    <p><strong>URL:</strong> <a href="http://www.typography.com" rel="nofollow">Typography.com</a></p>
