  html: |-
    <p>Hoefler <span class="amp">&amp;</span> Frere-Jones is <a href="/node/12061" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jonathan Hoefler</a> and <a href="/node/12062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tobias&nbsp;Frere-Jones</a></p>
    <p>In 2004, <a href="/node/add/wiki?edit%5Btitle%5D=The%20Hoefler%20Type%20Foundry" title="Create node &quot;The Hoefler Type Foundry&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">The Hoefler Type Foundry</a> entered its sixteenth year as Hoefler <span class="amp">&amp;</span> Frere-Jones. <span class="caps">H&amp;FJ</span> continues to work with brand leaders in every sector, developing original typefaces and licensing fonts from its library of nearly 1,000 designs, and it publishes fonts exclusively through its New York sales office and its web site at&nbsp;typography.com.</p>
    <p><strong><span class="caps">URL</span>:</strong> <a href="http://www.typography.com">Typography.com</a></p>
