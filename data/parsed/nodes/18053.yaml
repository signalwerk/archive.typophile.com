  - id: 109251
    user: 1115
    date: 2006-02-20T14:23:00
    date_raw: 20 Feb 2006 — 2:23pm
    votes: null
    html: <p>You have 2 different ideas happening here. I like the profile, and I like the idea of personalizing an IT firm (since they all tend to have swooshes, globes, and digital looking things flying around in their logos), but as Dan said, try to communicate what the business is about, what sets them apart? Is it personal service? Experience? What is their specialty. Of course, a logo should IDENTIFY and not EXPLAIN, so you don't need to depict an example of their service, but the SPIRIT of the company. If a figure/person is a core idea to who they are then choose either the profile, or a figure and work with it, but right now it isn't working. Best of luck.</p>
