    html: <p>Go away from the computer and start over again. Its just poor, it doesn't say High Tech or IT. Its just being cleaver for cleaver's sake. Make a logo clearly communicate what the business is all about as much as you can and have a positioning line to reinforce the new mark. Don't be cute be blunt. Dan</p>
