  html: '<p>Greetings fellow typophiles: <br> <br>I developed these templates a few years ago and thought they might be of some use to those who work in Illustrator. They are set up on 11 x 17 pages and accommodate 60 characters per sheet (there are 2 templates). I use them for roughing out ideas and storing glyphs for importing into FontLab. <br> <br>You can adjust the x-height, etc by unlocking the guides, selecting and moving their positions. (See below for a sample gif.)  <br> <br>The files are zipped for PC folks and stuffed for Mac users. You can download them here: <br> <br><a href="http://www.intelligentdesign.com/font_templates/" target="_blank">http://www.intelligentdesign.com/font_templates/</a> <br> <br>Also: If anyone has any bright ideas, please feel free to improve upon the existing design, email them to me and I will post new versions. <br> <br><img src="http://www.typophile.com/forums/messages/4101/14308.gif" alt=""></p>'
  html_clean: '<p>Greetings fellow typophiles: <br> <br>I developed these templates a few years ago and thought they might be of some use to those who work in Illustrator. They are set up on 11 x 17 pages and accommodate 60 characters per sheet (there are 2 templates). I use them for roughing out ideas and storing glyphs for importing into FontLab. <br> <br>You can adjust the x-height, etc by unlocking the guides, selecting and moving their positions. (See below for a sample gif.)  <br> <br>The files are zipped for PC folks and stuffed for Mac users. You can download them here: <br> <br><a href="http://www.intelligentdesign.com/font_templates/" target="_blank" class="link-external">http://www.intelligentdesign.com/font_templates/</a> <br> <br>Also: If anyone has any bright ideas, please feel free to improve upon the existing design, email them to me and I will post new versions. <br> <br><img src="http://www.typophile.com/forums/messages/4101/14308.gif" alt=""></p>'
