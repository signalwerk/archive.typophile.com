    html: |-
      <p>I'm trying to find a minimal set of characters with which i can cover the whole alphabet.</p>
      <p>c-f-r are the consonants of the (dutch) word 'cijfer' (engl. 'cipher') which has Arab origins (in Arabic, it says 'zero')<br>
      Somewhat esoteric maybe.</p>
      <p>Anyway, economy of form, that's what i'm looking for.<br>
      Besides that, legibility must be taken into account.</p>
