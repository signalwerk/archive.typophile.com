      <p>I’m sorry but I’m still not that clear what you’re asking. Do you want to know what trim size we like? For me, something I can fit in my handbag without folding - therefore no bigger than about 9 x 12. Preferably even 8 1/2 x 11. I like stapled rather than perfect bound because it’s easier to fold backwards but I guess that depends on page count.</p>
      <p>What sort of magazine are you working on. If it’s an art/fashion/architecture/design/style you could get away with a larger trim, if it’s a literary/reading mag I’d stick with letter sized. </p>
      <p>Is this helpful?</p>
