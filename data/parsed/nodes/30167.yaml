    html: |-
      <p>I feel that that the digest sizes are supposed to be more portable, but end up a PITA. They are too big for pockets, to small to keep track of. Any smaller than Nat’l Geo is too small. And I want bigger pics. (Nat’l Geo also the min. for that.) The mainstream approx. size suits me, because I can roll it up, or shove it in a notebook if i need to take it to go (since its thinner). Oversized, I personally love, except that they almost never choose thicker cover stock, so they end up to floppy, or extra-floppy if they go thin to keep the weight similar to the average size. Nevertheless, if the oversized ones would be a hair more rigid, Id prefer them becoming dominant, as they usually look better.</p>
      <p>Hurried, ATM, but does that answer ya?</p>
