      <p>Page sizes of magazines are affected by standard paper sizes and web widths. Typical point-of-purchase racks also follow suit. The user needs something portable fitting in a briefcase and storable on shelves and easily readable on a plane or subway car. The typical mag today seems about right for all this.<br>
      For my tastes, most magazines could use some more white space, they just look too crammed to me.</p>
      <p>ChrisL</p>
