      <p>“How do you think page dimensions of a magazine affect the user?”</p>
      <p>If it’s too big, it kind of flops over in the magazine holder in the bathroom, and then gets all warped and wrinkly.</p>
      <p>If it’s too small, then the magazine gets too think, and can’t even fit in the magazine rack so ends up on the floor where people drip all over it after getting out of the shower.</p>
      <p>It’s a fine balance.</p>
