    <p><strong>Monotype Imaging's XPS-to-PCL 6 and XPS-to-PostScript Vector Conversion Filters Selected for the Next Version of Windows</strong> </p>
    <p>Monotype Imaging Holdings Inc., a leading global provider of text imaging solutions, has licensed its XPS-to-PCL™ 6 and XPS-to-PostScript® vector conversion filters to Microsoft Corp. for use in the next version of Windows. Monotype Imaging's XPS-to-PCL6 and XPS-to-PostScript driver technology enables printer device manufacturers to quickly and easily support XPS (XML Paper Specification) without modification to their PCL6 or PostScript printers. </p>
    <p>"Printer OEMs gain a straightforward, vector-based solution for transforming XPS to PCL and PostScript," said Dave McCarthy, vice president and general manager of Monotype Imaging's Printer Imaging group. "Working closely with Microsoft, they have included our XPS conversion filters into the next version of Windows, providing a streamlined platform for OEMs to address their driver requirements. We're firmly committed to the success of XPS printing and offering device manufacturers a simple path that effectively strengthens their ability to print." </p>
    <p>Monotype Imaging's XPS solution enables device manufacturers to create PPD (PostScript Printer Description) or GPD (Generic Printer Description) files to support families of PCL6 or PostScript devices. Both inbox and vendor-supplied drivers can be created from the Windows solution using Monotype Imaging technology. In addition, the company offers a full suite of XPS products including XPS raster print drivers for Windows, XPS-to-XPS scalable consumption print drivers for Windows, and XPS embedded systems solutions. </p>
    <p>Monotype Imaging is exhibiting at Microsoft's "basecamp" at the BUILD Partner Expo, Sept. 13-16, 2011, booth 40, at the Anaheim Convention Center in Los Angeles. Expo attendees are invited to speak with Monotype Imaging at basecamp, which is a central location for Microsoft partners that are developing solutions for the next version of Windows. </p>
    <p><strong>About Monotype Imaging</strong> </p>
    <p>Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, navigation devices, digital cameras, e-book readers, digital televisions, set-top boxes and consumer appliances. The company also provides printer drivers, page description language interpreters, printer user interface technology and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 14,000 typefaces from the Monotype®, Linotype® and ITC® typeface libraries — home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Times New Roman is a trademark of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U. S. Patent and Trademark Office and may be registered in certain jurisdictions. Helvetica is a trademark of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. ITC is a trademark of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. PostScript is either a registered trademark or trademark of Adobe Systems Inc. in the U.S. and/or other countries. PCL is a trademark of Hewlett-Packard Company. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
