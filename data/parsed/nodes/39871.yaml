      <p>I’m surprised there has been no response yet on this question. Is this a modified version of Gill Sans Schoolbook (Infant), or is it truly a hybrid typeface, mixing Gill with a Futura-like type?</p>
      <p>I suggested that Ralf post this here, becuase I was hoping someone else might know whether type mixing was a common practice to create a ’new’ type look.  I know I am one of the older folks on this forum, but my background in type is based in my books, and not on firsthand experience in the field of typography. I was an engineer, not a typographer.</p>
      <p> - Mike Yanega</p>
