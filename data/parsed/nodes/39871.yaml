      <p>i seem to remember reading that Monotype tried several different attempts to Futur-ize Gill and this may be one of those permutations. If this is the case, I doubt that there has been any digital version made of this particular model.<br>
      You could get pretty close with P22 Underground Pro Light + several of the stylistic sets activated, but even that would not give you an exact match (there’s no splayed M, no single-story a with tail, no stem-less u—i had to stop with customizing options somewhere).</p>
