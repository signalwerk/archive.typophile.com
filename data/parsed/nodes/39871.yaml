    <p>I found this font in a german cookbook from the 50ies (DR.OETKER BACKEN MACHT FREUDE); Mike Yanega thinks it might be a hybrid typeface (Gill sans Infant with l, t, u and M out of Futura/Twentieth Century) and suggested to post it here.</p>
    <p>Has anyone another idea? Is it common to mix typefaces? Sorry, I am not a professional so please bare with my naive questioning.</p>
    <p>I would like to use the font for a publication, I find it very elegant...</p>
    <p>Thanks a lot for helping me!!<br>
    </p><div class="imageWrap"><img src="/files/oetker_0020_3428.JPG"></div><p></p>
