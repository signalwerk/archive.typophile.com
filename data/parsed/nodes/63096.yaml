    html: |-
      <p>Are you looking for just a general "design work" type of contract? Or one specifically tailored for magazine design and layout?</p>
      <p>The most important thing in any contract is to set reasonable limits (what you are or aren't going to do) and to make sure to get at least 1/3rd the payment up front (if not 1/2).</p>
      <p>Getting the payment up-front ensures that both parties have a vested interest in making sure the project is completed and completed to the specifications laid out in the contract.</p>
      <p>And if you really want a good contract that will survive scrutiny under the law, make sure to work with a lawyer.</p>
      <p>My 2 cents.</p>
