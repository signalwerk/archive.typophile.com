    <p>Carter Sans is Monotype Imaging’s Latest Addition to the ITC Collection by one of the World’s Premier Designers </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/CarterSansFaces_5465.jpg"></div><p></p>
    <p>WOBURN, Mass.--Monotype Imaging Holdings Inc. (Nasdaq: TYPE), a leading global provider of text imaging solutions, has introduced into its ITC® collection the latest typeface by the master typeface designer, Matthew Carter. The eight-font Carter Sans™ family can be licensed and downloaded from Monotype Imaging’s Fonts.com, ITCFonts.com and Linotype.com stores. Carter Sans is also available for website design from Fonts.com Web Fonts. </p>
    <p>“We approached Matthew, one of the world’s most accomplished type designers, to head the design of a new sans serif family for our ITC library,” said Allan Haley, director of words and letters at Monotype Imaging. “The result is Carter Sans – an exceptionally beautiful design that reflects a spirit of distinction and authenticity, perfectly suited to our ITC collection.” </p>
    <p>Carter Sans is a “sans serif with stroke endings that show the effect of the chisel more than the pen,” according to Carter. He was inspired by the work of his friend, the late Berthold Wolpe, and integrated the humanistic overtones, hearty shapes and the bold simplicity of Wolpe’s Albertus® typeface, which Wolpe completed for Monotype in 1940, modeling characters to resemble letters carved into bronze. While designing Carter Sans, Carter collaborated with Dan Reynolds, a senior type designer at Monotype Imaging’s Linotype subsidiary. Reynolds oversaw character set development and font production and also designed the small caps to complement Carter’s old style figures. “Carter Sans is ideally suited for display copy as well as text composition, thanks to the close collaboration between Matthew and Dan,” Haley said. </p>
    <p>Carter’s career has spanned decades, encompassing the evolvement of type from the printed page to the screen. He has embraced every form of type creation, first as a punch cutter, handcrafting letterforms in metal as a teenager. Moving into modern techniques as they became available, Carter has designed fonts that generate text using phototypesetting machines, desktop computers and now consumer electronics devices. He has created more than 60 typeface families and over 250 individual fonts, ranging from script designs such as the Snell Roundhand®, Cascade® and Shelley® fonts to modern classics including the ITC Charter®, ITC Galliard® and Olympian® faces. Carter’s work also comprises widely used fonts such as the Tahoma®, Verdana® and Georgia® families that are part of the Microsoft® Windows® platform. In addition, he has designed custom typefaces for publications including The New York Times, The Washington Post, The Boston Globe, Wired, Newsweek and Time, and clients such as AT&amp;T, which commissioned Carter in the 1980s to create a highly readable, space-saving font for phone books. Recently, Carter was honored as a MacArthur Fellow for 2010 and was also inducted into the Art Directors Club Hall of Fame. Today, Carter and Cherie Cone run Carter and Cone Type, Inc. in Cambridge, Mass., which produces and markets Carter’s designs. </p>
    <p>Availability<br>
    Carter Sans fonts, selection packs and typeface families can be viewed, purchased and downloaded from <a href="http://www.fonts.com" title="www.fonts.com">www.fonts.com</a>, <a href="http://www.itcfonts.com" title="www.itcfonts.com">www.itcfonts.com</a> and <a href="http://www.linotype.com" title="www.linotype.com">www.linotype.com</a>. Carter Sans is based on the OpenType® cross-platform format and comprises eight weights, including regular, medium, semibold and bold, each with corresponding italics. OpenType Pro fonts, which support OpenType capabilities such as the automatic insertion of ligatures and alternate characters, offer an extended character set to support most Central European and several Eastern European languages. Carter Sans is also available for website design to commercial subscribers of Fonts.com Web Fonts. </p>
    <p>Customers may contact Monotype Imaging in the U.S. toll-free at 800-424-8973, or in Europe at (+44 0)1737 765959, or 001781 970-6020, option 2. Linotype may be reached at +49 (0) 6172 484-418. Customers from other parts of the world may dial 001 781 970-6020 (U.S.). </p>
    <p>About ITC<br>
    ITC (International Typeface Corporation) is a Monotype Imaging brand and typeface collection that represents classic, high-quality typefaces for design professionals and brand managers. Established as a type manufacturer in New York City in 1970, ITC is rooted in American ingenuity and diversity, reflected by the originality and range of ITC designs. Today, typefaces are released into the ITC collection on an ongoing basis from some of the world’s most talented type designers. ITC’s printed publication, U&amp;lc, the International Journal of Typographics, is available for free download in a digitized form from the Fonts.com blog. Every month until completed, new volumes will become available, each representing a year’s worth of the quarterly editions that were read by type enthusiasts during the publication’s hard-copy lifespan, from 1974 to 1999. </p>
    <p>About Monotype Imaging<br>
    Monotype Imaging combines technology with design to help the world communicate. Based in Woburn, Mass. with offices in the U.S., Europe and Asia, Monotype Imaging brings text imaging and graphical user interface capabilities to consumer electronics devices such as laser printers, copiers, mobile phones, digital televisions, set-top boxes, navigation devices, digital cameras, e-book readers and consumer appliances. The company also provides printer drivers and color imaging solutions to printer manufacturers and OEMs (original equipment manufacturers). Monotype Imaging technologies are combined with access to more than 13,000 typefaces from the Monotype®, Linotype® and ITC typeface libraries – home to some of the world's most widely used designs, including the Times New Roman®, Helvetica® and ITC Franklin Gothic™ typefaces. Fonts are licensed to creative, business and Web professionals through e-commerce portals, direct and indirect sales and custom design services. Monotype Imaging offers industry-standard font solutions that support all of the world's major languages. Information about Monotype Imaging can be found at <a href="http://www.monotypeimaging.com" title="www.monotypeimaging.com">www.monotypeimaging.com</a>. </p>
    <p>Monotype is a trademark of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Carter Sans is a trademark of Monotype Imaging Inc. and may be registered in certain jurisdictions. Albertus and Times New Roman are trademarks of The Monotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain other jurisdictions. ITC, Charter and Galliard are trademarks of International Typeface Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. ITC Franklin Gothic is a trademark of International Typeface Corp. and may be registered in certain jurisdictions. Linotype is a trademark of Linotype GmbH registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Snell Roundhand, Cascade, Shelley, Olympian and Helvetica are trademarks of Linotype Corp. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions in the name of Linotype Corp. or its licensee Linotype GmbH. Microsoft, Windows, Tahoma, Verdana, Georgia and OpenType are either registered trademarks or trademarks of Microsoft Corp. in the U.S. and/or other countries. All other trademarks are the property of their respective owners. © 2011 Monotype Imaging Holdings Inc. All rights reserved.</p>
