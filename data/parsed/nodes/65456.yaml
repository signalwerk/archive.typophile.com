    html: |-
      <p>Ok, now I made some observation about this.<br>
      First: the idea came in my mind while I was reading Smeijers Counterpunch<br>
      To make things clearer (I suspect that one thing that makes my writing unclear is my funny english): what happens if drawing a glyph you are <em>forced</em> to draw the 'counterpunch' first?<br>
      Moreover, what if you the only thing you can really define is the counterpunch itself? Now you have a shape (te counterpunch) and you need to draw something around it in a different way. I discovered that you can do that by saying: move this point on the counter in such a way, move the other point etc.</p>
      <p>This is what I meant with the first image. The inner shape is the counterpunch and the arrows are the displacements that 'generate' the outer contour.</p>
      <p>(I call the displacements "rules" because I needed to generalize the concept.)</p>
      <p>Then I realized that this kind of constraint (drawing the counterpunch and then defining displacements to generate the other contour) was very useful to define a parametric glyph.<br>
      For example, the displacement of the lateral point of the counter of lowercase o is related to the weight of the glyph. And the displacement of the points in lowercase n, define the 'stem'. And the relation between the two displacement I mentioned is the difference of straight line to curves etc. </p>
      <p>Second:<br>
      At this point for me there is a conceptual problem: because if you 'parametrize' something you have to parametrize almost everything (the reason is clear when you think at the relation between horizontal and vertical: if the horizontals change with the verticals, you can: a. change the height of the counter (i.e. parametrize this as well) or b. change the x-height of the glyph.)<br>
      <em>But this move blurs the difference between drawing glyph in this way and drawing the usual way</em> (again, the vertical proportions problem)</p>
      <p>Third:<br>
      This tool is very impractical since you can do the same thing with interpolation etc. Moreover I really cannot see any way to trasform my awful python script into something more functional, like a software with a graphic interface etc. (here the problem is also being a really unskilled programmer).</p>
