    <p>I want to describe an 'idea' I had for a tool to be implemented.</p>
    <p>The idea is to have a tool for generating shapes in that order:<br>
    you give the tool a 'counter' an a set of 'rules'<br>
    the tool apply the 'rules' to the counter and generate the final shape.</p>
    <p>In the image below the rules are represented as vectors that map points on the inner contour to points on the outer contour. If the rules are changed the outer shape change, accordingly, if the 'counter' is changed the same rules generate another shape (in my image you see the difference of scaling the counter and scaling the resultant shape.)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/counters_5621.gif"></div><p></p>
    <p>To test the concept I've written a script (too ugly to show) in python and, using fontforge (as a python module), I generated a 'font' (actually three letters: I'm lazy).</p>
    <p>The script roughly performs the things I've described (it takes a shapes – the counter – and a set of rules for each node, and outputs the glyph).<br>
    While I was trying to write this script I realized that everything could be parametrized, so that you can make changes manipulating 'meaningful' parameters. The 'rules' can be as well thought as functions that respond to inputs from that parameters, and at the end you have two elastic boundaries tied together by some law.</p>
    <p>Ideally you can reuse a counter, transform it and attach new rules to define another glyph, etc.</p>
    <p>Below you can see some test:<br>
    changing the 'offset' (i.e. changing the stem width)<br>
    changing the width of counters<br>
    testing for extreme cases (almost Klimax-esque)<br>
    changing the defined 'contrast' parameter (horizontal/vertical offsets)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/variation_4865.jpg"></div><p></p>
    <p>Every variation required only one or two parameters to be modified.</p>
