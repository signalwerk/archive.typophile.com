      <p>Thanks for you comment Frank,<br>
      I drawn the simplified shapes because it is much easier :) but I made also other experiments with serifs etc:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/serif1_6257.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/serif2_5505.jpg"></div><p></p>
      <p>When I said that every point in the counter is mapped to a point in the contour I was imprecise: you can generate 0, 1 or even more than one point, i.e. you can attach more than one 'rule' to a point.<br>
      But this way of defining descender and ascender is impractical: In the examples I used more than one "counter" (notice also that I have closed and open counters), the descender being a line (this is cheating I know).</p>
      <p>To draw serifs I decided to also have simple contour (parametrized as well) that I can attach to the glyph (again this is cheating.)<br>
      (Yes, the glyphs have overlapping contours at the end, but my 'tool' is just a way to experiment, not a way to really draw a real font)</p>
      <p>edit: you can see the overlapping in the images.</p>
      <p>Being a piece of software you can also write a conditional statement to attach serifs when, for example, the contrast is greater than a threshold.</p>
