    html: |-
      <p>I am not a type-designer, but practically I think there could be massive benefits. If a type designer could articulate the "permissions" or aspects of a typeface to a developer such as Daniele through the design of a few key glyphs, who could then develop an algorithm to produce an entire character set, production time (and profits as a result) could improve significantly. Granted, there would need to be some review and tweaking by the type designer. </p>
      <p>If we wanted to be altruistic, we could pass the cost-savings back to our clients who could then re-invest their resources into other things like solar panels. </p>
      <p>I have a small amount of experience collaborating with a python developer in an effort to design a typeface so I know it's possible, but I am not familiar enough with the business of type design to know it it is actually practical (or profitable) but you never know until you try.</p>
      <p>Regardless of it's potential practicality, I think it worthy of exploration. I look forward to the results.</p>
      <p>(does anyone know of typefaces produced by automated processes?)</p>
