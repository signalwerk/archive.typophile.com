    html: <p>If your employer has licensed the font for use on that machine, then any use of that font on that machine permitted by the license would be legitimate from the EULA perspective. However, your employer may have something to say about the uses to which the font, for which the company paid the license fee, are put. Why don't you go ask your boss what he thinks?</p>
