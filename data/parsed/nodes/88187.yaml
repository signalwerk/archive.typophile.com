      <p>In the end, I decided to go with Palatino/mathpazo. Thanks at sgh for pointing out that indeed NCS is very heavy. My guidelines require a 12pt font, and after looking at some pages, I decided it is just not acceptable. I still think it might be a good choice for e.g. a thesis in liberal arts.<br>
      Small indices are not really an issue. My thesis is more CS than math-related, and there are few pure calculations. Rather lot's of relational and set notation.</p>
      <p>In fact this is also why I decided not to go with Utopia and fourier or mathdesign, or with Times and mathpmx or txfonts. I know that several famous journals in my field go with a times-look. But calligraphic math-symbols, such as \mathcal{R} which I make heavy use of, just stand out way too much.</p>
      <p>Thanks very much for your feedback everyone, especially pointing me towards the Math Font Survey.</p>
