      <p>Concerning indexed indices, I tend to avoid them because there is no appropriate "opticals" for small sizes. Also, the fourier package has very few options. If you don't have the expert fonts, I would say there is no option (the "upright" option being used for French math). Here is the ams testmath.tex file compiled with fourier, no frills added. </p>
      <p><a href="http://www.iro.umontreal.ca/~boyer/typophile/testmath.pdf" title="http://www.iro.umontreal.ca/~boyer/typophile/testmath.pdf">http://www.iro.umontreal.ca/~boyer/typophile/testmath.pdf</a></p>
      <p>You will see that <code>\mathcal</code> looks like the <code>\mathscr</code> of the <code>mathrsfs</code> package. If you want the cal font you are used to, you need to declare it yourself  (I call it <code>\mathcalus</code>).</p>
