      <p>I wrote my thesis before TeX even existed.  I often use fourier to reformat papers on the arXiv before reading them on screen. My formats are thus far from those of a thesis. You can have a look at <a href="http://www.iro.umontreal.ca/%7Eboyer/griggs/" title="http://www.iro.umontreal.ca/%7Eboyer/griggs/">http://www.iro.umontreal.ca/%7Eboyer/griggs/</a></p>
      <p>Added: Above I used \usepackage[upright]{fourier} to get upright capitals and greek letters in equations. After that I called a second package to use the Utopia Std font I had installed.</p>
