      <p>Can you post a typical page of your thesis, compiled with the different options that you're considering?  Certain features of the content may make one choice better than another.  For instance, one of my students is currently writing his thesis and is using Palatino through mathpazo.  In certain sections, there are a lot of subscripted <em>i</em>s and <em>j</em>s, and I find these hard to disinguish since Palatino has very little curl in the <em>j</em>.</p>
      <p>It is also true that Palatino is a lighter font, and New Century Schoolbook is heavier.  Requirements on margins and point size may also work better with one choice or the other.  Because NCS is so dark, I often find pages set to the full width in 12+ pt sizes to be too much.</p>
      <p>Best wishes, Stephen</p>
