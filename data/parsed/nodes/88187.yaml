    <p>First of all, I'd like to apologize, since this topic has been maybe discussed over and over again :-)</p>
    <p>However my choice of fonts is limited, since my thesis contains lots of math - thus there is no other choice than Latex.</p>
    <p>I do not like the Computer-Modern fonts very much. Printed, they look acceptable, and their choice is maybe of personal taste. But for on-screen reading, CM is just not dark and heavy enough. Since most readers - if someone ever looks at it at all, except of course the thesis committee :-) - will probably download and read the pdf on-screen. Thus CM is an option, but my least-preferred one.</p>
    <p>On the other hand, alternatives are few. While using different fonts is not so much of a problem in Latex, fitting math-fonts are few.<br>
    The options I have seem to be either<br>
    1.) New Century Schoolbook plus the Millennial Font-package for math<br>
    2.) Palatino and the Mathpazo Font-package for math<br>
    3.) just stick with Computer Modern.</p>
    <p>What would you choose? Is it acceptable to use NCS in a thesis? So far, I like option 1) most, but...</p>
