    html: |-
      <p>Mathpazo gives very nice results indeeds.</p>
      <p>&gt; <cite> calligraphic math-symbols, such as</cite> <code>\mathcal{R}</code> <cite>which I make heavy use of, just stand out way too much.</cite></p>
      <p>Those symbols come from separate fonts and can be changed by calling other packages. For instance (with MacTeX 2011 and I presume texlive 2011), there are at least two packages that do just that. You can use <code>\usepackage{eucal}</code> or <code>\usepackage[scaled=0.95]{esstixcal}</code> (with the scale you want). With Fourier, I sometimes just add the two lines (after calling fourier)<br>
      <code><br>
      \DeclareSymbolFont{cmsy}{OMS}{cmsy}{m}{n}<br>
      \DeclareSymbolFontAlphabet{\mathcal}{cmsy}<br>
      </code><br>
      which give the cal font you get by default with mathpazo. The blackboard and the frak fonts can also be changed with the packages <code>esstixbb</code> and	<code>esstixfrak</code>. I like inconsolata as the mono font (<code>\usepackage[scaled=0.95]{inconsolata}</code>).</p>
