    <p>I wanted your opinion in this subject:<br>
    I have built a font that uses only Class Kerning and decided not to expand to conventional kerning, so I have a very clean file, only a few kbs, etc.<br>
    the problem is that I can't have a correct preview of font in Linotype Fontexplorer X  nor in MyFonts preview. (Adobe apps all support)<br>
    do you think we have to still use conventional kerning creating redundant information in font files?</p>
