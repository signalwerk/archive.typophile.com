      <p>I suppose, as a stop-gap measure, you could write a script that would apply your class-based kerning indivudually to every single letter combination.  It would balloon file size but would allow you to continue working with class-based in program, and then only need to run the script once right before producing the font.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
