    html: |-
      <p><cite>the problem is that I can’t have a correct preview of font in Linotype Fontexplorer X nor in MyFonts preview. (Adobe apps all support)<br>
      do you think we have to still use conventional kerning creating redundant information in font files?</cite></p>
      <p>A 'kern' feature with class-based kerning is supported widely, thought still not everywhere. So this is what, in my opinion, you should count on. I think that font managers' and websites' font previews are the least thing to care for. They are just that: previews. It is them which should adapt to current OT standards, not the other way round.</p>
