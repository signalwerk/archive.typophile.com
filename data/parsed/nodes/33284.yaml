    html: |-
      <p>Tools &gt; Kerning Assistance &gt;Expand</p>
      <p>This will convert your class kerns into "hard" kerns stored in a separate font table which can be accessed by previewers.</p>
      <p>You can also inspect and edit these hard kerns in the list on the right side of the Metrics window.</p>
      <p>FL provides various criteria by which you may limit the number of kern pairs generated by the Expand process, allowing you to limit ballooning.</p>
