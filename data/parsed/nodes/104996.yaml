  html: |-
    <p>I'm looking for help picking up fonts to try with a logo design for my law firm.  It's a solo practice, with a modern edge in that it's a mostly paperless office.  I'm a fairly young attorney, so nothing too traditional or old-school, but I also need something fairly conservative. </p>
    <p>So, I'm looking for something that's modern/contemporary, conveys trustworthiness/warmth, sophistication and is still commanding enough to give the appearance of professionalism and knowledge.  </p>
    <p>And and all suggestions are appreciated!</p>
