      <p>Lauren, if you should decide to use clip art (such as the scales of justice), you might try iStockPhoto.com.  A huge selection of downloadable photos and illustrations, most are inexpensive, and legal to use (after you pay the fee).</p>
      <p>But one danger of clip art in a logo is that other lawyers in your area might be using the same or very similar images.  </p>
      <p>You might want to consider getting a professional graphic designer to help you out. Remember that designing the logo is just one step in establishing your identity, there's also the design of your letterhead, envelope, business card, mailing labels, your email signature, website, signage, advertising, etc. If any of your friends or business associates have logos and printed materials that you like, you might ask them for the name of their designer.</p>
