    html: |-
      <p>I think a Typophile type competition is a bad idea. </p>
      <p>One of the distinctive features of Typophile is its democatic voice. The most experienced and accomplished and the novice can post alike, and are treated with pretty much the same kindness and cruelty. </p>
      <p>This egalitarean voice has its drawbacks, but pretty much nowhere else is so open and equal. The market place of course is very competitive and always sorting out winners and losers, as well as competitions, so there is plenty of this in the world.  </p>
      <p>It is good that Typophile is a place of some respite from this. I don’t have a problem with Typophile being used by another sponsor to get democratic judging, but Typophile as a sponsor for judging critiqued faces it seems to me would put more pressure on those who submit for critiques.</p>
    html_clean: |-
