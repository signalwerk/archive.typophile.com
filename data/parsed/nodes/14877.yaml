      <p>Miles, you’re right: we would need to consider awards and judges at the beginning. For both of those, it might be best to look outside of Typophile… maybe there could be “sponsors” that could come up with prizes. I don’t think that Typophile has a budget that would allow for it to pay for prizes on its own.</p>
      <p>Also, judging is a big issue in its own right. Judges “make” a competition, don’t they? Either we could try to get “objective” judges from outside of typophile to do the judging (but who?), or we could arrange some sort of voting thing. I don’t like the idea of elevating a few people from within the Typophile community to ’judge’ status. But I also wonder if enough different kinds of people would vote if we had a voting system.</p>
