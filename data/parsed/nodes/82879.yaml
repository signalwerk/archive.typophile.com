  html: |-
    <p>Hello,</p>
    <p>Idea: Logo in the making in Illustrator, The top one is kerned by 'Auto', the bottom one is kerned by using 'pair of 3 letters kerning principle' (By lying white strokes above the rest of the type). Pouring water between the characters principle isn't always usable I think, squinting and looking at a whole is in my opinion more usable.</p>
    <p>Feel free to post a comment on the kerning or design.</p>
    <p><a href="http://jeroenboselie.blogspot.com/2011/06/museum-logo.html" title="http://jeroenboselie.blogspot.com/2011/06/museum-logo.html">http://jeroenboselie.blogspot.com/2011/06/museum-logo.html</a></p>
    <p>Thanks in advance, Jeroen</p>
