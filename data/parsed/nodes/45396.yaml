    <p>Well, I'm in the market for a new iMac. </p>
    <p>I did some cursory searching for a great deal on one of the newest iMacs.<br>
    I'd like to get this setup: </p>
    <p>Specifications:<br>
        * 3.06GHz Intel Core 2 Duo<br>
        * 2GB 800MHz DDR2 SDRAM - 2x1GB<br>
        * NVIDIA GeForce 8800 GS w/512MB GDDR3<br>
        * 500GB Serial ATA Drive<br>
        * Apple Mighty Mouse<br>
        * Apple Keyboard (English) + User's Guide<br>
        * Accessory kit<br>
        * SuperDrive 8x (DVD±R DL/DVD±RW/CD-RW)<br>
        * 24-inch glossy widescreen LCD<br>
        * AirPort Extreme<br>
        * Bluetooth 2.1 + EDR</p>
    <p>I'd also add iWorks '08</p>
    <p>At Apple.com without my employee discount the total is = <strong>$2,414.68</strong> (includes $136.68 for tax) Free Shipping with the discount it's = <strong>$2269.46</strong> (includes $128.46 for tax) Free Shipping. </p>
    <p>At Macmall.com, the same computer with iWorks '08 AND <em>Extensis Suitcase Fusion for Mac</em> = $2396.96 - $224.08 (in a total of 3 mail-in rebates) = <strong>$2172.88</strong>. The website didn't say it includes tax, but if it does it would be $141.77 more = $2314.65 (if you're curious, Extensis Suitcase Fusion is $99.99 - $90 MIR.) The tax for PA is 6% and usually applies to the total before MIRs and S&amp;H are added.</p>
    <p>Obviously, Macmall is the better deal (unless, of course taxes are included.)</p>
    <p>Does anyone know of any other discounts or sites that are offering bargains right now on the new iMac? I don't mind paying more if there are MIRs or worthwhile add-ons. A new printer is not a worthwhile add-on however.</p>
    <p>I've been out of the MAC game for about 6 years now, it's time I get back in it.</p>
