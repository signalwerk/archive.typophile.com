    html: |-
      <p>you're obviously going to get an iMac no matter what, now I don't know about iMac deals, but I do know about a couple of other things I wish somebody had told me as soon as I got my iMac.</p>
      <p>1) the iMac is an amazing machine, and the more you look at it, the more you realize how awesome it is.  Did you know every mac since 2005 comes equipped with optical audio in/out, just in case you need pure digital audio feeds.</p>
      <p>2) Bluetooth is amazing.  every mac has it, and so does the Nintendo Wii.  It's a little pricey, but dorpping 45$ on a Nintendo Wiimote when I don't even have a Wii was one of the best investments I've made this year.  using Darwiin remote (free) or RemoteBuddy (40$) you can use the Wiimote as a remote control for your iMac, and if you have a sensor bar, even as a wireless mouse!</p>
      <p>3) Quicksilver.  It's like a program-launcher, only way way more powerful, and it's now open-source.  Forget dragging a million icons into your dock and then having to hunt to find the program you want, now I open any program on my computer with a thought and 3-5 keystrokes (which is faster than you can read the aplication name when it appears on your screen anyway)</p>
      <p>Best of luck with your new love,<br>
      innovati!</p>
