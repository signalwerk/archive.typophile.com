      <p>MacMall has a horrendous customer support track record. Avoid them. And mail-in rebates are just adding to the mess that would likely turn into. Google both "MacMall support" and "MacMall rebates" and then rethink the 'better deal' ;o)</p>
      <p>Ways to save a few bucks on Macs:</p>
      <p> - Amazon and 'forget' to pay sales tax<br>
       - Apple.com refurbs<br>
       - find a .gov employee who can sponsor a .gov discount for you (saves about the amount you'd pay on taxes)<br>
       - Shop around for your own Ram. You can usually save a few bucks that way.<br>
       - Buy the low-end model of any product line rather than the high end model. In general, the higher end models don't give you the same ROI for the price. IMHO, you save money and have better equipment if you buy low-end, but upgrade more often. Not to mention that upgrading more often allows you to retain more of your resale value of the current box.</p>
