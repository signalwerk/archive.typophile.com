    html: |-
      <p>Well, if you think about it, this practice serves a very practical purpose, if you understand the context.</p>
      <p>Once upon a time, setting type meant placing individual, cast-metal letters in a composing stick, then manually justifying the line with spacing slugs, then transferring that line to a make-up form, and continuing the process. Which is hard enough, but the compositor had to work backwards while he or she was doing this, so it is not simple task. I worked for awhile at a print shop that still had foundry type and one guy who knew the art and craft. It was quite amazing.</p>
      <p>So, you figure that the page numbers ought to be enough to keep things in order, except for the fact that, every now and then, you have front material, which also has to be numbered; plus, perhaps, plates of various kinds. So, page numbering was probably the LAST thing that got done. So, leaving little "placeholders" in the locked up forms probably helped the compositor keep track of where he was, and what was supposed to come next.</p>
