  html: |-
    <p>I'm looking through some books from the 1800's within Google Books, and I found a few specimens where, on the bottom right corner of body copy, on every page, is the first word which will follow on the next page. Deviating from the body copy, all of these 'preview examples' are printed in the same font/face/size as what is to follow...</p>
    <p>This seems like a function of keeping print material in order, but the pages are also numbered...</p>
    <p>Then I thought this may be done for reading purposes, so an orator is primed with something to say while the page is being turned...</p>
    <p><a class="freelinking external" href="http://books.google.com.lb/books?id=l_rGTUXMx2gC&amp;printsec=frontcover&amp;hl=ar&amp;source=gbs_ge_summary_r&amp;cad=0#v=onepage&amp;q&amp;f=false" rel="nofollow">example</a></p>
    <p>Any insight would be great.</p>
