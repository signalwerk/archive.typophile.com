      <p>I wouldn't say it's a rule, just an observation and a recommendation.<br>
      There's something disconcerting about evenly matched values in a figure-ground relationship, because the eye is not quite sure which is which.<br>
      So I think it makes sense, when you're picking where to place your instances on the curve, to avoid that situation.<br>
      Here are two typeface examples of adjacent weights, Helvetica and Univers, which straddle the equivalent instance.<br>
      I haven't done a survey, but I suspect this is typical.<br>
      The general idea is that while a multiple master curve offers infinite choices, there are scales of visually-pleasing instances which restrict what is practical.</p>
      <p><img src="/sites/default/files/old-images/ns_5646.jpg"></p>
