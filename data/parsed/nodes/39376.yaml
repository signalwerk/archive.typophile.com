      <p>The LucasFont idea is this: all the formulas boil down to saying that b, the width of the "medial" stem, is the square root of the product of a by c, where a is the smallest and c the largest stem. This means that the width of the medium stem is the geometric mean of the widths of the smallest and largest stems. This is equivalent to saying that the logarithm of b is exactly the arithmetic mean of the logarithm of a and that of c. This is logarithmic interpolation and this looks interesting. My feeling is that Tim's interpolation uses a quadratic fit (whence the parabola). Am I wrong? Tim, would it make any sense to mix the two approaches (i.e. take a log, use a quadratic fit, and then exponentiate)? </p>
      <p>Michel</p>
      <p>[edit 1] Maybe the method should rather be called "exponential interpolation". I can find no reference for the moment.<br>
      [edit 2] Yes, it should be called exponential interpolation as can be found <a href="http://music.nuim.ie/musictec/docs/progr/interpolation.pdf">here</a>.</p>
