      <p>&gt; <cite>You can transform that into complicated formulas if you want, of course, but they will not say anything else.</cite></p>
      <p>I agree with your statement. However, if the smallest stem is a, the largest is c, and if you have 5 weights between a and c, then according to Lucas the stem of weights k=1 to 5 is a*(c/a)**(k/6.0) using Python code. The explanation in terms of geometric progression is nice but does not give Python code.</p>
      <p>[edit] I meant according to the formula y(x) = y0*(y1/y0)**x; here y0 = a, y1 = c; x is k/6 where k=0 for stem a and k=6 for stem c and k from 1 to 5 gives those in between.</p>
