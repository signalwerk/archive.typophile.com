    <p>I am working on a typeface and not looking forward to the idea of redesigning each glyph for every single <a href="/node/14703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">weight</a>, so I'm very interested in generating some of the weights using <a href="/node/17216" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">multiple masters</a> in FontLab.</p>
    <p>How does this generally work? I read the chapter in the FL manual and it seems that the best way to do it is:</p>
    <p>1) Create a regular weight<br>
    2) Create "extremes", for instance, "Ultra Thin" and "Ultra Black".<br>
    3) Interpolate the intermediate forms, like Thin, Light, Bold, Black, etc.</p>
    <p>Is this how it's generally done? Are most typeface families created from these three weights? Also, are the results acceptable if you're interpolating something across a wide range, such as an interpolation between a regular weight and an "Ultra Black" weight? Or should the extremes be closer together?</p>
    <p>Lastly, I want at least three weights-- light, regular and bold. I'd imagine that in this case, MM can't help me, as I would need at least these three weights before I could do any interpolation anyway. The only other way would be using extrapolation, but I don't trust the results of that particular technique for my font weights.</p>
