    html: "<p>As someone pointed out in another thread, a simple way of stating Lucas's idea is that the weights should be a geometric progression: the ratio of each term (weight) to the previous one is the same. For example, if you have three successively heavy weights, A,B,C, then algebraically A/B = B/C. Rearranging you get Lucas's formula: AC = B^2 . In a talk I saw him give, he explained a more complex version that takes into account double and triple horizontal strokes, but I don't remember it.</p>"
