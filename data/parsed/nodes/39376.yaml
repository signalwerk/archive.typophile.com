      <p><cite>My feeling is that Tim’s interpolation uses a quadratic fit.</cite></p>
      <p>Note that my diagrams are in different spaces than Lucas's. My approach does not say anything about the weight of the individual instances, it considers only the interpolation. By choosing the amounts of the three ingredients (which means two degrees of freedom) you can create any graph you want. All I am saying is that it should not have kinks. A pure interpolation with a kink is a special case in my approach.</p>
      <p><cite>Yes, it should be called exponential interpolation</cite></p>
      <p>No, it should be called geometric sequence or progression (see <a href="http://en.wikipedia.org/wiki/Geometric_sequence">http://en.wikipedia.org/wiki/Geometric_sequence</a>). This is precisely what it is, nothing more and nothing less. You can transform that into complicated formulas if you want, of course, but they will not say anything else.</p>
      <p>Lucas's concept is about the individual weights – despite the name it does not say anything about interpolation, actually.</p>
