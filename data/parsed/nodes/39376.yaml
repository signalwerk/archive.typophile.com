      <p>Yes, the Thin--Regular--Ultra system works for me.<br>
      Extrapolation is marginally useful.<br>
      Other than that--experiment! You don't need a whole font, just make a few letters and see what happens.<br>
      If you want three weights, it makes sense to have Hairline and Ultra as the extremes, rather than Light and Bold, because you will then be able to make those anyway, and interpolation is far better than extrapolation. And for a sans, Hairline is quite easy--just draw a path (using your Regular in the mask layer as a guide) and give it a stroke value of 20.</p>
