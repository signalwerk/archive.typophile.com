      <p>This is a real world example:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/p_extra_5569.gif"></div><p></p>
      <p>This is assuming a manually designed extralight (XL), regular (REG) and extrabold (XB) exist, otherwise my system cannot be applied.<br>
      If we want to generate a semibold (SB) we can do so by extrapolating from XL 'across' REG, as seen on the left. However, the horizontal bar is too heavy for this weight since it is (almost) proportional in both the source weights.<br>
      In the XB the bar is tweaked very much, which finds its way into the interpolated SB, as seen on the right: the horizontal is too heavy, and also the overall weight.<br>
      What we want is something in between: part extrapolation and part interpolation. This can be achieved by adjusting the weights in our cocktail that gives the semibold. I typically put the three weights into an MM font (which means, unfortunately, that two masters are identical) and then calculate the required MM positions to give the desired resulting weight, and amount of extra- vs interpolation. Note that in the above example the fact that there is exactly 100% REG is random, it could be more or less than that.</p>
      <p>This may all seem complicated and the improvements are not drastic. However, it amost does not cause any additional work – all you have to do is to combine your weights a bit differently when you generate the weights you do not design manually. It is my experience that the time you save for correcting the semibold outweighs (ha ha) the effort to set up the MM font.</p>
