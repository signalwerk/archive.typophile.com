      <p>The important thing to decide is how many instances you have between the lightest and the fattest.<br>
      You want to be very careful to avoid an instance where the stem width and the width between stems is identical.<br>
      That can happen if you have, say, x number of instances, but x+1 or x-1 will avoid it. However, then you have to consider another priority: you should have Regular and Bold work well together and look like Regular and Bold, not Regular and Extra Bold or Light and Medium.</p>
