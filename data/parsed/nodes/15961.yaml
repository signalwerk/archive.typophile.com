    <p>Been doing some housecleaning on my vast collection of images (just rolled over the 10,000 mark on my Sony camera), and found these type themed pieces. Now to have fun celebrating the inline image display!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo-o.jpg"></div><br>
    Not everyone wants an "O" on their peghead, but this particular Mr. O did. James did this inlay in mother of pearl.<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo-d.jpg"></div><br>
    Mother of pearl "D" on the workbench before inlaying. This one was drawn by Susan and cut by Mike. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo_salamon.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/typo-bear.jpg"></div><br>
    This is a regular request, a cut out slab of mother of pearl (done with a hair-line saw blade and small drills), refilled with a mixture of ebony dust and epoxy. Susan draws the letters, and James did these inlays. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo-de.jpg"></div><br>
    Susan designed this "DE" for an inlay on a bass with part of the "D" transformed into a bass clef. It's especially cool because of the different colors of shell. Mike did the inlaying. <p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typo_kaynostrings.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/typo_kaybass.jpg"></div><br>
    This one I drew in honor of a good customer's mother. Got some good advice on Typophile on this one! Mike did the inlay in mother of pearl.<p></p>
