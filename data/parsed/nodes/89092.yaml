    html: <p>Well, I just want to play with it as a font of only Unicode-based diacritical combining. It’s not for any historical record, so it doesn’t matter if my anchors would reflect the original ones as long as diacritics placement would be the same. Ironically, this arbitrariness in character to diacritic anchor matching is exactly what I was afraid of and what is the trickiest part of the task. Anyway, some utility that would somehow heuristically figure out such anchoring or even its approximation would be quite useful, I think, at least for modernizing old fonts. I’ll give it some more thought.</p>
