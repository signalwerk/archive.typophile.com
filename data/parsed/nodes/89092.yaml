    html: |-
      <p>Let us assume that like in the Adobe example <code>@TOP_MARKS</code>  of <a href="http://www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html#6.d" rel="nofollow">Mark-to-Base attachment positioning</a>, we have the base letters <code>a, e, o, u</code> and the diacritics <code>acute, grave, dieresis, umlaut</code>. Then it is true that to get the glyph for <code>aacute</code> all you need to do is to match the basis anchor for the <code>a</code> and the anchor for the <code>acute</code>, and you can decide arbitrarily to put either anchor wherever you want. For instance you can put the base anchor for  <code>a</code> at <code>(0,0)</code>. However, when you have done that arbitrary choice, all the other anchor positions are fixed; indeed,  there is then only one position for the anchors of <code>acute, grave, dieresis, umlaut</code> that will give the right looking glyph for <code>aacute, agrave, adieresis, aumlaut</code> when matching with the anchor for the <code>a</code> at <code>(0,0)</code>, and then there is also only one possible position for the base anchor on <code>e, o</code> and <code>u</code> that will match any of the anchors on the diacritics. The choice is thus unique up to a translation of all anchor pairs (you can add the same number to all x values, and the same other number to all y values of the anchor positions).</p>
      <p>In terms of programming, you can initialize one of the anchors to whatever pair  you want, and then run some algorithm. Now, I don't know what tools are available, I will just try to illustrate with one tool I use, namely FontForge. Here is a small script that takes as input a fontfile and a list of glyphnames and outputs their foreground; I called it <code>dmpfrgrnd</code>.</p>
      <pre>#!/usr/bin/env python

      import sys, fontforge
      fnt=fontforge.open(sys.argv[1],1)
      for gl in sys.argv[2:]:
        print gl, fnt[gl].foreground
      </pre><p>If I call<br>
      <code>dmpfrgrnd MyriadPro-Regular.otf dotlessi iacute acute</code><br>
      I get the following output (with one point per line however)<br>
      <code><br>
      dotlessi&nbsp;&lt;Layer(cubic)<br>
      &nbsp;&lt;Contour&nbsp;(161,0)&nbsp;on&nbsp;(73,0)&nbsp;on&nbsp;(73,484)&nbsp;on&nbsp;(161,484)&nbsp;on&nbsp;&gt;<br>
      &gt;<br>
      iacute&nbsp;&lt;Layer(cubic)<br>
      &nbsp;&lt;Contour&nbsp;(155,693)&nbsp;on&nbsp;(252,693)&nbsp;on&nbsp;(130,550)&nbsp;on&nbsp;(67,550)&nbsp;on&nbsp;&gt;<br>
      &nbsp;&lt;Contour&nbsp;(161,0)&nbsp;on&nbsp;(73,0)&nbsp;on&nbsp;(73,484)&nbsp;on&nbsp;(161,484)&nbsp;on&nbsp;&gt;<br>
      &gt;<br>
      acute&nbsp;&lt;Layer(cubic)<br>
      &nbsp;&lt;Contour&nbsp;(189,693)&nbsp;on&nbsp;(286,693)&nbsp;on&nbsp;(164,550)&nbsp;on&nbsp;(101,550)&nbsp;on&nbsp;&gt;<br>
      &gt;<br>
      </code><br>
      Here it is easy to see that the <code>iacute</code> is obtained by "pasting" the <code>acute</code> on top of the <code>dotlessi</code> and moving it <code>(-34,0)</code>. As a consequence if the anchor for the <code>dotelessi</code> is at say <code>(10,0)</code> then the anchor for the <code>acute</code> needs to be at <code>(44,0)</code>. The problem in this particular example is matching the countours. For some fonts, the contours for the diacritics are listed first, some other fonts last. Once you have matched the contours, it is easy to get the displacement.</p>
      <p>I don't know how far one can go with that. During my vacations, I generated an AAT font using anchors. Once I was done, I happily moved some diacritics to where they seemed to look better. I don't see why professionals (I am not one) would not do the same.</p>
