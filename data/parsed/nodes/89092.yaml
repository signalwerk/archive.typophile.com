    html: <p>Everything you’ve said is of course right, Michel. Thanks for making it so explicit, this indeed clarified my thoughts a bit. I even ran quickly all those calculations by hand sketching out the deltas in a matrix for both vowels and diacritics and… well, there was no consistency for any given anchor pair I tried. Must have been no anchors and no luck for me.</p>
