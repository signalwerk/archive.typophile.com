      <p>I don't think there'd be a way to figure out where the original anchors were, because anchors positions are arbitrary in relation to the glyphs as long as they match up between the base glyph and the mark.</p>
      <p>If you're planning to create more composite glyphs you wouldn't necessarily need to have details of the original anchors though. I'm not sure what your aim is.</p>
