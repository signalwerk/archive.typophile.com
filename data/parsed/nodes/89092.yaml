    html: |-
      <p><cite>Once you have matched the contours, it is easy to get the displacement.</cite></p>
      <p>I should have said "Once you have matched the contours, you have the displacement". Indeed, matching the contours means finding <code>(dx,dy)</code> such that the contours corresponding to the diacritic in the precomposed glyph are obtained by adding <code>(dx,dy)</code> to all pairs in the contours of the glyph for the diacritic: <code>(dx,dy)</code> is the displacement.</p>
