  html: <p>I have a font with all the diacritical Latin flattened, that is, precomposed and decomposed with no trace of anchors whatsoever. I would want to reverse-engineer placement of anchors if there indeed were any or other effectively same preplanning. Now, doing this somewhat intuitively and matching it all by trial and error is obviously insane. Do you guys know any step-by-step algorithm that would make such a task a finite one or at least determine there was no approximate anchoring in the first place?</p>
