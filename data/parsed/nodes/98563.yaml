  html: <p>Hi everyone, does anyone recognise this typeface? Used by an English department store circa 1900 - 1950. At first glance I thought it was good ol' Franklin Gothic, but the T, E are noticeably wider. Many thanks for your time.</p><div class="imageWrap"><img src="http://typophile.com/files/1_5757.png"></div><div class="imageWrap"><img src="http://typophile.com/files/2_4229.png"></div><div class="imageWrap"><img src="http://typophile.com/files/3_5642.png"></div><div class="imageWrap"><img src="http://typophile.com/files/4_5728.png"></div><p></p>
