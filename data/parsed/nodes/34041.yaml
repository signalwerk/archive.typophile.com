      <p>There are seven pages of samples of 'Childish' typefaces, which range from kid-like scribbling to clean, simple lettering done by adults, in Part 12 of the <a href="http://bowfinprintworks.com/Script12Pg1.html" rel="nofollow">Script Font ID Guide</a>. You can look up where any of them come from in the accompanying Script Font Reference List. Parts 5, 6 and 11 could also have more possibilities.</p>
