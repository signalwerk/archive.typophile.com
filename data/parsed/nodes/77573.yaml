  html: |-
    <p>Hi everyone,</p>
    <p>I’m trying to put FontLab’s super weak implementation of drawing things onto the glyph window canvas to some use. Y’now, the one that disappears once you move a toolbar over it or switch to another window or app.</p>
    <p>More specifically, I want to draw a path using a couple of LineTo-commands, but there seems to be no ClosePath implemented, or at least it’s not documented anywhere. So how do I close such a path to get a solid shape?</p>
    <p>And once we’re at it: Can one set drawing colors other than using the seven constants? They return integer values between 0 (black) and 16M (white), so could one set anything in between?<br>
    Edit: I tried: yes one can.</p>
    <p>Thank you,<br>
    Yanone</p>
    <p><code><br>
    canvas = fl.GetCanvas()<br>
    canvas.MoveTo(here)<br>
    canvas.LineTo(there)<br>
    canvas.LineTo(over there)<br>
    # now what??<br>
    </code></p>
