      <p>Hi Yanone,</p>
      <p>This is "von hinten durch die Brust ins Auge" but it may work.</p>
      <p>You can draw with a 'ReportLabPen' from FontTools (works also with robofab) to create a reportlab.graphics.shapes.Group. Then render this vector graphic with reportlab.graphics.renderPM.drawToPIL() to an image. Finaly paste this image with the FontLab Canvas.PutImage() method into your canvas.</p>
      <p>Eigi</p>
