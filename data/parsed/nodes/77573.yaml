      <p>Hello Yanone,</p>
      <p>Regarding the colors:</p>
      <p>You can use the FontLab build-in function RGB() to calculate the color values.<br>
      It is defined in Studio5/Macros/System/init.py and looks like this:</p>
      <p><code><br>
      def RGB(r, g, b):<br>
      &nbsp;&nbsp;&nbsp;&nbsp;return long(r) | (long(g) &lt;&lt; 8) | (b &lt;&lt; 16)<br>
      </code></p>
