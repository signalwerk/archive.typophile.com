      <p>Hi, oh i found it!</p>
      <p>I wrote this script to draw simple straight segment on FL canvas. For segments, curves and such... need to add few more lines. Basically FL canvas has no line thickness and no propper fill. So my solution: lets plot the image with geometric shapes that Fontlab supports. Rect and Ellipse. It runs instantly, thus: why not?</p>
      <p><a href="http://anton.korkork.com/tech_work/scripts/Draw_Thick_line.py" title="http://anton.korkork.com/tech_work/scripts/Draw_Thick_line.py">http://anton.korkork.com/tech_work/scripts/Draw_Thick_line.py</a></p>
      <p>Hope this helps.</p>
      <p>Anton<br>
      *Comments to improve are welcome. For example if i click on cavas my image disapears, in some other scripts it doesnt disappear so fast. I think it has to do with the code structure.</p>
