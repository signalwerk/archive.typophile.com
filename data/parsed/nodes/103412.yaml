    <p>Perhaps not the right terminology but I am looking for fonts that have a big 'swashes' associated with them. I new to create something similar in the attached image, whereby the last letter, y in my case and d in the example attached forms a swash. </p>
    <p>Do such fonts exist or is this something I would manually create. Appreciate any help.</p>
