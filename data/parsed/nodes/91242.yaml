  html: |-
    <p>Dear everybody,<br>
    Looking at Facebook this morning I noticed this awesome/hilarious ad.<br>
    Translated it says "Are you a typographer? - Receive Jobs from us via email. We guarantee payment. Register now!"</p>
    <p>Finally typographers become a target group for marketers! Now I also know how the average german typographer looks like!<br>
    Enjoy,<br>
    Harald.<br>
    Btw. you can like me too on <a class="freelinking external" href="http://www.facebook.com/pages/Harald-Geisler/157466307608426" rel="nofollow">Facebook.</a></p>
