      <p>The tombstone has high contrast heavy Didot letters, a style that was popular in the 1840s. It was also used on European street signs and is shown in Strasse, a digital font from H&amp;FJ:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Strasse_5179.jpg"></div><br>
      In this example the top stroke on the 5 tapers upward on the rhs. I have seen the same thing in old books from the era.<br>
      The hairlines from the top stroke to the curved stroke are far from conclusive, but I am inclinded to see this as a 3 rather than a 5.<br>
      Don<p></p>
