    <p>Hi. My main motive in identifying this font is because to me it looks like this tombstone states that my 5X-great-grandfather, Samuel Curtis, lived to be 93 years old, but every genealogical website I've found says he lived to be 95, and I'm assuming that's based on his tombstone. If you look closely at his age, the 2nd digit appears to be a flat-top three (like Typewriter font), with the top part being connected to the bottom part at the RIGHT, not the left as a 5 would be. So I'd like to know, based on the actual font, is it a 3 or a 5 because that would change his year of birth from 1751 to 1753. </p>
    <p>I've tried to search for this font all over the internet and used several identification sites to no avail. And I searched other graves in that same cemetery to see how 3's &amp; 5's look, but there were none like it (<a href="http://www.findagrave.com/cgi-bin/fg.cgi?page=pv&amp;GRid=59079185&amp;PIpi=33425931" title="http://www.findagrave.com/cgi-bin/fg.cgi?page=pv&amp;GRid=59079185&amp;PIpi=33425931">http://www.findagrave.com/cgi-bin/fg.cgi?page=pv&amp;GRid=59079185&amp;PIpi=3342...</a>). Does anyone have any clues? THANKS!! </p>
    <p>- R.J. Heddins (Lindale, TX)</p>
