      <p>It's nice, I like the simplicity. A couple of suggestions:<br>
      • The logo could do with some optical correction. Inner square should be slightly lighter than the outer circle as curves need more weight to look balanced. Horizontal lines of the box should be thinned slightly in relation to the verticals to look the same weight.<br>
      • Due to the interaction between the circle and the square, you should make the circle slightly superelliptical (pull out the bcps slightly away from the nodes). That way you'll avoid the optical illusion that the circle is slightly diamond shaped.<br>
      • Check the spacing around the logo. I'd suggest it should be about the same as the space between letters. Unfortunately with the shapes of the A and C surrounding the logo, you'll still end up with white triangles next to the circle. However, this can easily be put to use and solved by moving the logo upwards from the baseline.</p>
