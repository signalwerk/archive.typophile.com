      <p>I didn't get the coin at all, even though I've routinely used similar coins in the past. I think this was primarily due to square stroke being of the same weight as a circle. So, to echo Bendy's first suggestion - make it lighter, and not just slightly. </p>
      <p>Secondly, it may be worth noting that I keep seeing a pair of Playstation control buttons, one in another. Reducing the stroke weight will help getting rid of this association.</p>
      <p>Lastly, I would have a look at typefaces that have circle(-ish) capital C, e.g. like that in Proxima Nova or Gotham. This should help tying the type to the mark.</p>
