    <p>Hey guys, I'm relatively new to the realms of Typophile and graphic design, in about 15 days I begin my Bachelor of Design,</p>
    <p>My father, brother and I are partners of this company and I, due to my chosen career path, was tasked with assembling an identity.<br>
    The business is called China CV, I wasn't allowed to play with the name, its a online service that in 24 hours, using real people who can read/write both English &amp; Chinese, translates your resume &amp; other professional documents from English to Chinese.</p>
    <p>This is what I've come up with - </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_4236.png"></div><p></p>
    <p>The typeface is up for discussion, I used Lato because it is using a Free-Font License (as far as I'm aware this included commercial ventures but if i'm in the wrong I'd love if someone gave me the heads up?).</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chinacv_5421.png"></div><p></p>
    <p>I based it on Chinese coin designs that were used for centuries, in hindsight it kind've looks like a bank, which isn't a bad thing necessarily as we are involved in e-commerce, which is renowned for 'dodgeyness'. </p>
    <p>Tell me what you think!<br>
    Cheers</p>
    <p>chillphilli</p>
