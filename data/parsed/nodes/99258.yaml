    html: |-
      <p>There is an easily found group of four fonts named "Loose New Roman", including plain, swash, wide, and wide swash vairiants. The fonts are anonymous, with no copyright or creator information. In the copyright field they say "aka Romanopolis or Scrollopolis"</p>
      <p>There is also a free font named <a class="freelinking external" href="http://www.dafont.com/ziggy.font" rel="nofollow">Ziggy Standard, by Mickey Rossi</a>(subflux.com). It contains both regular and swash A-z glyphs, but no more than that, and the swash variants are in non-standard locations.</p>
      <p> - Herb</p>
