    html: |-
      <p>Nick - this is meant in the spirit of constructive criticism.</p>
      <p>Every time I see one of your recreations of a photo lettering font, I'm at first excited to see that a quality version now exists digitally - and then disappointed that you opt to pick and choose between the original's default and alternate characters. Why not include them all and make your offering so much more useful?</p>
      <p>In this case, the poster cannot use your font to recreate the second image because he/she needs both (very different) versions of several caps.</p>
      <p>The price you ask makes for incredible value, but what's the point if the user requires characters found in the original font that aren't in yours? I suppose that's not very common, but still ...</p>
      <p>What if you put the alternates in a second font  (relatively easy to do) and offered both for, in this case, $10.95 or so?</p>
      <p>Just my one cent worth ...</p>
