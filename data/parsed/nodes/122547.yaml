    html: |-
      <p>Don't think you'll have good suggestions. My 2 cent:<br>
      - 1: these typefaces are rather unique (at least to me) so pretty convinced nothing really approaching could be suggested<br>
      - 2: free fonts are not very appreciated by forum members. Most are type designers or type-business related, some sell their creations so suggesting alternative free fonts might sound off-topic<br>
      - 3: many free fonts are actually rip-off/bad copies/illegal clones and have fooled more than once many people from this community so suggesting free alternatives is always kind of risky<br>
      - 4: asking for free alternatives without specifying context/purpose could also be wrongly appreciated, possibly meaning you don't want to pay the price for the type designer hard work.<br>
      Anyway, here are 2 trusted sources for free fonts: <a class="freelinking external" href="http://www.google.com/fonts" rel="nofollow">Google Fonts directory</a>, <a class="freelinking external" href="http://www.fontsquirrel.com" rel="nofollow">Fontsquirrel</a><br>
      Good luck!</p>
