    html: <p>For my recent Williams Caslon, Font Bureau folks talked me into having my short tailed Q default,(IRAQ) and putting in the first stylistic an instruction to substitute Qu with the traditional long-tailed Q. There is also a stylistic set that substitutes in all the historical style characters, so the long-tailed Q is everywhere then.</p>
