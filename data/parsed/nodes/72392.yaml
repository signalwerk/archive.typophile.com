    html: |-
      <p>Ivan, adding a third space is probably a bad idea, if the InDesign files you're creating will be used for any other purpose, as they would in bookwork -- unless you know for sure that the result isn't the insertion of any Unicode *character*, such as the 3-to-em space. You need to export everything InDesign will let you &amp; check to see what's there. On the other hand, we know a kern won't show up as a character, but AFAIK, you can't insert a kern with the InDesign Find/Replace tool. </p>
      <p>The problem Q with the long tail mentioned above is the standard Q in Arno. There is an optional Q. It has a longer tail.</p>
      <p>What is (to me) a problem flag with any glyph is where it needs to be kerned to a following glyph using a kern value approaching or exceeding a wordspace. This may not give rise to any visual nightmares (be a problem) in some cases, but often is in others. That's when a solution is needed. Redraw the glyph, create an alternate with an accompanying feature that will automatically resolve the problem, something like that.</p>
