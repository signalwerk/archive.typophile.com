    html: |-
      <p><cite>AFAIK, you can't insert a kern with the InDesign Find/Replace tool.</cite></p>
      <p>Charles, you can use InDesign’s GREP search, and the ‘positive lookahead’ feature.<br>
      1. Create a character style that sets the needed kern.<br>
      2. Search for <code>Q(?=,)</code> – a ‘Q’, only if followed by a comma.<br>
      3. Replace with your style.</p>
      <p>Since CS4, you can make this even shorter and use a GREP <em>style</em> that automatically searches for this pattern and applies the desired formatting on the fly.</p>
      <p>I know this is not the same as ‘inserting a kern’, and you probably were already aware of this functionality.<br>
      Florian</p>
