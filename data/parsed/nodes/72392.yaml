    html: "<p>William: What I've been doing in my font (whose J, j, f, y tend to create collisions), is maintaing a list of letters that cause collisions (have descenders on the right side, in the case of J and Y, or spaces, since they just looked weird).  That way, whenever possible, the longer preferred form is used, but automatically switches to a shortened form as necessary.  Basically like what you've had to do with the Q+u, but doing it with Q+[abcedfhiklmnoqrstuvwxz].  You can have either one be the default in that case.</p>"
