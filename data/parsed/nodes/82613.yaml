    html: |-
      <p>It could be two different versions of Kabel. The bold lettering looks like ITC Kabel, but the lower case isn't right, because of the 'a'. The 'a' in Adobe's Kabel looks closer. There are several other Kabel versions, including Kaapeli from Tomi Haaparanta, but in most of them the boldest weights have flattened vertices on the N, or the l.c. 'a' isn't right.</p>
      <p>- Mike Yanega</p>
