    date_raw: 22 Sep 2010 — 10:41am
    date: 2010-09-22T10:41:00
    votes: null
    html: <p>I think the two foundries that have done the most newspaper fonts recently are Font Bureau and Hoefler &amp; Frere Jones. I would definitely look at their fonts and if anything looks interesting talk to them (via skype?) about your needs, as well as to Nick Shinn and Mario Feliciano. I am also very impressed with Peter Bilak's Greta Text. Adobe's Utopia is another one widely used for newspapers, I believe, and Jean Francois Porchez has done a number of fine newspaper fonts also. Personally, I like Rocky a lot as a headline font. (Le Monde is using it now, I think.)</p>
