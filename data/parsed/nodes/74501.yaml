    votes: null
    html: <p>I have never done newspaper work so I am out of my element. Aesthetics and personal preference aside, would any of you who have had extensive experience in this area consider <a href="http://www.fontbureau.com/fonts/Starling/" rel="nofollow">Starling</a> an appropriate newspaper face? I would be curious to hear your reasoning.</p>
