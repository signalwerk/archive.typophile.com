    date_raw: 26 Sep 2010 — 3:19pm
    date: 2010-09-26T15:19:00
    votes: null
    html: |-
      <p>Lot's of newspapers have at some time used Times New Roman for running text. None of them was printed sheet-fed as The Times was in 1932, so their results were often subpar. Times New Roman is a delicate design you see.</p>
      <p>These days newsprint is much better, CTP and all. Starling doesn't offer grades I far as I can see so colour will be a problem.</p>
