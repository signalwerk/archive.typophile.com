      <p>James, to my eye Adelle works pretty nicely in the <a href="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=2895&amp;id_section=146" rel="nofollow"><em>City Press</em></a>. It certainly wouldn't work in a more conservative news environment, but, like FF Unit Slab in <a href="http://www.readmetro.com/show/en/NewYork/20100921/2/1" rel="nofollow"><em>Metro New York</em></a>, it adds some useful flavor in a more adventurous publication. </p>
      <p>Christopher, H&amp;FJ describe grades beautifully in <a href="http://typography.com/fonts/font_features.php?featureID=54&amp;productLineID=100032" rel="nofollow">this description of Chronicle Text</a>. More information <a href="http://typography.com/ask/recentTopic.php?rtID=89" rel="nofollow">here</a>.</p>
      <p>There have been a lot of great newspaper faces mentioned already. A few not to miss are <a href="http://www.fontbureau.com/fonts/Quiosco" rel="nofollow">Quiosco</a>, <a href="http://www.fontbureau.com/fonts/Houston" rel="nofollow">Houston</a>, <a href="http://www.typofonderie.com/alphabets/view/MenckenText" rel="nofollow">Mencken Text</a> (no longer in use by <em>The Baltimore Sun</em>), <a href="http://www.linotype.com/521506/malabar-family.html" rel="nofollow">Malabar</a>, and <a href="http://typographica.org/2007/typeface-reviews/exchange" rel="nofollow">Exchange</a>.</p>
  - id: 431309
    user_id: 11702
    user_name: Reed Reibstein
    user_path: null
    user_image: /files/pictures/picture-11702.jpg
    date_raw: 26 Sep 2010 — 6:05pm
    date: 2010-09-26T18:05:00
    votes: null
    html: <p>And Jad, I've used Flama for a newspaper design in progress, and it's worked out nicely so far. Compared to some of the other straight-sided sans's, it has a characteristic warmth. If you need that hard-edged, almost techy feel, it might not be ideal. But more often than not some friendliness is a good thing in a newspaper setting.</p>
