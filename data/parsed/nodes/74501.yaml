    <p>I'm trying to decide on a font to use for the text of a newspaper. </p>
    <p>The ones I'm familiar with are:</p>
    <p>Excelsior<br>
    Ionic<br>
    Mercury<br>
    Eudald news <a href="http://www.felicianotypefoundry.com/cms/fonts/eudald-news" title="http://www.felicianotypefoundry.com/cms/fonts/eudald-news">http://www.felicianotypefoundry.com/cms/fonts/eudald-news</a></p>
    <p>are their any other great ones that I should check out before I make my decision? serif or sans serif. </p>
    <p>I also would like to know what peoples opinions are about Flama, is it a good choice for display type for a newspaper?</p>
    <p><a class="freelinking external" href="http://www.felicianotypefoundry.com/cms/fonts/flama" rel="nofollow">http://www.felicianotypefoundry.com/cms/fonts/flama</a></p>
    <p>Thank You.</p>
