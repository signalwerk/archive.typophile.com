    html: <p>Grades are fonts cut to different general <em>grades</em> of darkness. This is not a digital invention, some metal-type newspaper faces had it too. Example <a class="freelinking external" href="http://www.fontbureau.com/fonts/MillerDaily/" rel="nofollow">http://www.fontbureau.com/fonts/MillerDaily/</a></p>
