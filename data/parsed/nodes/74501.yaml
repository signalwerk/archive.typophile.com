    html: |-
      <p>Only slightly off topic...  Mencken Text, mentioned with a link in an earlier post, was named after H.L. Mencken. Here's what it says on the site:</p>
      <p>"The family’s name Mencken is a tribute to H.L. Mencken’s journalistic contributions to The Sun. According to the London Daily Mail, Mencken ventured beyond the typewriter into the world of typography. Because he felt Americans did not recognize irony when they read it, he proposed the creation of a special typeface to be called ironics, with the text slanting in the opposite direction from italic types, to indicate the author’s humour."</p>
      <p>This was a half-century before the proposed sarc mark!</p>
