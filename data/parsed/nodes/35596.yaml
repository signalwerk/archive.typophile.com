      <p>I am *so* going to quote this thread! </p>
      <p>For a project I was working on a couple of years ago, I was told to add the letter 'g' to the last line of a page and align the tail to a guideline so that we could feather the leading and still arrive at that holiest-of-holy places, the same last line position. This technique unfortunately resulted in a couple of left-over g's and some funny typos, and the biggest editorial sin: errors of commission.</p>
      <p>Also, I was not allowed to modify the white space between paragraphs or sections. It had to remain the same, which meant my only resource was tweaking the leading and eyeballing those 'g' tails until I got it just right (which varied a lot depending on the zoom and the way my screen was feeling that day).</p>
      <p>I just can't do it, and I requested not to be put back on the project unless I'm permitted to align to the baseline grid. What an utterly frustrating process. It's a 600+ page book! </p>
      <p>When I suggested running a line long/short or using H&amp;J to massage the page, I was snarfed* at. I was told that aligning to a baseline grid would add to the page count, it would be bad and wrong and a sacrilege, and who did I think I was? </p>
      <p>Thank you for providing, entirely unprompted, more evidence that there *are* other ways of doing things.</p>
      <p>K.</p>
      <p>*That's not a word, but the sound is perfect. Try it yourself: "snarf".</p>
