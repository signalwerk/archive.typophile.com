      <p>I used to do books a lot, and always used the long-short system. This means that if there is a widow, you make the prior spread a line short (43 lines, if the norm is 44). If that doesn't work, you go to line short on the prior set(s), if you can. If this fails, you try pages a line long (45 lines). But you never go from a short spread to a long spread in one step.</p>
      <p>If the page has a lot of subheads, space around these can be pulled, you can sometimes save a line by knocking out a few points before and after each subhead. A problem at the start of the chapter (when you can't go back for long/short pages) can often be corrected by stealing from or adding a line to the drop space at the top of the page. If there are illustrations, you can usually add an extra line of space around the illustration.</p>
      <p>Only when those things fail would I start mess with H&amp;J or tracking. Look for a long paragraph with only one word on the last line, and try to pull that back, or a long paragraph with a nearly full last line, and try to force a full word onto a new line.</p>
