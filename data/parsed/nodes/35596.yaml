      <p>You need to be careful that the lines don't get too closekindoflikethiswherethereisminmalspacebetweenthem, also if I've opened/closed the tracking right up to the limit at 20/-20 sometimes the paragraph looks different to the others on a page (like gappy or too tight) so I might apply the same or similar tracking to other paragraphs that are close by to soften the effect. Of course then you need to make sure that applying tracking to other paragraphs doesn't give you more widows or orphans!</p>
