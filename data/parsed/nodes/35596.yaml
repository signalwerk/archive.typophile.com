    <p>are there any tricks to balancing facing pages in a symmetrical layout?</p>
    <p>i am laying out a trade paperback novel and in trying to avoid widows and orphans, the last lines of text on facing pages don't always align to the same baseline. bringhurst suggests <em>exporting or importing single lines to and from the preceding or following spreads.</em> however, i don't understand how to technically implement this. importing a line from the previous spread would then leave those pages unbalanced, right? how do designers solve this problem? any hints on how to do this in InDesign CS would be GREATLY appreciated!</p>
    <p>finally, i'm wondering what you would suggest for the running heads. this book is co-written by 2 authors and the chapters are designated numerically (as opposed to being titled). again, bringhurst mentions that running heads are <em>often pointless with a strong authorial voice or unified subject.</em> every novel in my collection seems to incorporate running heads and i think i want to include it, but do you think is acceptable to have it read "Author Name and Author Name"?</p>
    <p>thanks,</p>
    <p>gregg</p>
