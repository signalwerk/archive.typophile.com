      <p>Cabbage -</p>
      <p>There are many schools of thought on this - I do art books and cookbooks which have a large variety of heads and types of text. I'm not a stickler for aligning text on the bottom unless it really looks bad not to, but I do try to align the body copy to the baseline grid. My MO is to keep the spacing as consistent as possible (as I said in my earlier post) and do my best to create a balanced spread. You can design your heads not to disrupt grid alignment by building in the right amount of space above and below them (and often creating separate style sheets for one-line heads and two-line heads). You also obviously never want to run a head at the bottom of a page with fewer than 3 or 4 lines below it.</p>
      <p>When it comes to straight running text though, it looks best to align it. You don't want to distract the reader, and anything that breaks the flow - anything at all - will take his/her mind from the content. But whether you accomplish this delicate balance through H&amp;Js, tracking, carding (horrors!) or letting a paragraph start on the last line, that's going to be a matter of personal preference and I don't think there are any absolutes - if this thread is any indication.</p>
      <p>Basically whatever position you stake out on typophile, someone is bound to come along and shoot a hole in it, and that's why we keep coming back. Just witness the en-dash, em-dash debate that rages on.</p>
