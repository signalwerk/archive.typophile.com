      <p>One of the complaints about carding is that the text lines don't "back." Unless the text stock is quite heavy, there is always some show-through. If you "lock" lines to the baseline, the lines overleaf are on the same position on the "grid" regardless of how the printer mistrims pages.</p>
      <p>Of course, in the old days of Photocomp when you supplied repro the printer shot &amp; then stripped up on flats, any carelessness in stripping also gave lines that didn't back up.</p>
      <p>Moreover, unless you always specify elements such that you return to the "grid" quite quickly (i.e., extra lead above &amp; below the subhead always totals to some integer of the basic leading, the extracts are set on the same leading as the text, etc. etc.), lines don't back anyway.</p>
      <p>Other complaints on carding come from the days of metal, when adding .35 points of space was virtually impossible. There is a lot of the 1920-1950 British Typography Aesthetic remaining in the English-speaking world -- though Eckersley, one of the proponents of carding, was a Royal Designer to Industry.</p>
      <p>As to what is best, much depends on your theory of the page. If equal depth pages are important to you, carding (feathering, vertical justification) is your best tool.</p>
      <p>Having said that, I don't use it in the few books I design; my views on the page don't have constant dept as high on the compromise list.</p>
      <p>FWIW</p>
