      <p>You should choose your baseline grid to align to your body copy, as you've done. </p>
      <p>But there are ways to insure that the captions will align with the text without visual guesswork. One way to do this is to choose "Only Align First Line to Grid" or, if you want the cap to align with the last line of text, go to Object: Text Frame Options: Vertical Justification: Align: Bottom and place the caption box at the bottom of the page. Takes the visual guesswork out of it. Visual aligning is tricky; you need to zoom in pretty tight to make sure it's truly aligned.</p>
      <p>I should add - the above instructions are for InDesign. Quark doesn't give you quite this many options.</p>
