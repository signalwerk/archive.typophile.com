    html: |-
      <p>One thing you do have to watch when making the pages on a spread a line short (or long) in order to achieve balance throughout, is the visual interaction of this with any page number, footer, rule or other design element that appears at the bottom of the page. Works best I think when there's nothing at the bottom, okay if a page number only. I've seen some books where they've moved the bottom elements to keep the same spacing between them and the bottom of the text.</p>
      <p>Re: last line of paragraph at top of page okay if it can be run all the way to the right margin. I do this in a pinch, but I'm not really happy with the indent of the next paragraph having only one flush left line above it. Doesn't look quite right.</p>
      <p>I never run pages longer than the normal maximum number of lines, but go one short when necessary. In InDesign I do this by putting a rectangular box (set for text runaround) over the last line rather than adjusting the text box, which is usually a master page element I don't want to tamper with. I just delete the added box if I decide that page doesn't need to run short. This is probably a hack: anyone have more elegant ways of handling this?</p>
