      <p>The idea is that a difference of .35 points in leading is not noticeable, even on facing pages. Having set a number of books this way, I'd allow that the difference in spacing is not really noticeable, but that the difference in color is.</p>
      <p>Richard Eckersley tended to use a leading of around 13.5 points, with a fairly small type size -- 9.5 (Galliard) to 10 point (with a slightly condensed version of Minion from Multiple Masters), and fairly narrow measure. Under these conditions, the difference is space between the lines wasn't really noticeable -- but as I said, the difference in color was.</p>
      <p>But one thing to remember about "color" is that a difference in word spacing also affects color. A paragraph with looser word spaces, as you would get if you have to "make a line" will appear lighter than a paragraph with the words tightly set. That being the case, much of the argument against carding seems wrong.</p>
      <p>On balance, carding does work if you pay attention to its effects when you design the page.</p>
