      <p><em>What’s carding - aside from the definition I just found on Wikipedia: “a method of torture using metal wool-combs”?</em></p>
      <p>It's only torture if you are a fleece.  :-)  Carding is what you do to prepare fibre for spinning, and can be done by hand or machine.  </p>
      <p>I've got an old manual <a href="http://www.patgreencarders.com/" rel="nofollow">Patrick Green carder</a>, a set of hand carders (<a href="http://www.joyofhandspinning.com/hand-carding.shtml" rel="nofollow">how to use 'em here</a>), and a <a href="http://ashford.co.nz/carding/carding-frameset.htm" rel="nofollow">flick carder</a> down the page on the left.</p>
      <p>What they all have in common is carding cloth, a fabric with little metal teeth to loosen the fibre, remove short bits and junk: the resulting product is usually used to spin a woolen yarn, unless it's been processed by a full-fledged roving carder (pictures on the Patrick Green site).</p>
      <p>Wool combs are used for combing, and with a diz, produce fibre to be spun worsted.</p>
      <p>(Yeah, I know, TMI....)</p>
