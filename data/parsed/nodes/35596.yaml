      <p>I avoid tracking text to contract a paragraph when trying to avoid widows and orphans, except as a very last resort, and then only a maximum of -10 in InDesign. I normally have my minimum word spacing set at 85% for justified text. For a paragraph I want to contract to see if I can shorten it by a line, I'll apply a minimum word space of 80% for that. Of course pick paragraphs with a short last line. If the author or editor doesn't mind, I'll make minor text edits to help with copy fitting too.</p>
      <p>Another way of fixing widows/orphans is to let both pages of a spread run one line short at the bottom. You'll see this done often.</p>
      <p>I avoid having a last line of a paragraph at the top of a page unless it fills the entire measure, but I consider it fine to have one line at the beginning of a paragraph at the bottom of a page. The process of balancing is easier if you only have to worry about those top guys.</p>
      <p>Sometimes a chapter can drive me batty trying to get everything balanced and  no paragraph ends hanging at the top. Often it takes several techiques to get a chapter right: tightenng paragraphs (or expanding them), taking off the bottom line on a spread, editing, and tracking.</p>
