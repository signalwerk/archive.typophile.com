      <p>Not totally sure if this is what you mean but --&gt; if the lines don't line up it probably means you aren't locking the text to baseline so that's the first thing to do. To resolve widows and orphans I will normally tighten tracking to indesign at the most +20 or -20 (sometimes -25 but that's just between you and me) sometimes this might require going back or forward a few pages until you get rid of the problem on your page. If it is ragged right you can manually alter the right hand rag with disc. hyphens or soft returns. Sorry I haven't gone into technical detail but this stuff seems a bit elementary so I'm worried that it's not what you mean, I will happily explain terms and stuff if you want to know this stuff.</p>
      <p>Running heads are good for complex works but for simple stuff, yeah maybe it's overkill but if that's a common style I say go for it  -- seems like you can go either way<br>
      cheers</p>
      <p>--N</p>
