      <p>Kristina,</p>
      <p>I could see, maybe, a professor (those who don't do, teach) asking you to align the tail of a "g" to a reference position for one page, but not for a 60-page book, let along a 600-page book. Tell him/her you can only it with metal type. Nonsense like this can give any composition technique a bad name.</p>
      <p>And for example, I'd bet that Don McCahill never actually tried carding (feathering) while at Toronto University Press; its evilness was revealed -- as are religious truths -- by a Press Style or Art Director. I could be wrong about this of course, and I don't mean to belittle either him or the dicta against carding pages. Carding has an effect, and unless you've tried it, looked at the pluses and minuses,  decrying it is just to report a current fashion.</p>
      <p>Take a look at Margaret Olin's <cite>The Nation without Art: Examining Modern Discourses on Jewish Art</cite>. (University of Nebraska Press,  2001). Can you really tell that carding was used? Don't you appreciate that all the pages go to the same depth (except for mis-folding, of course)?</p>
      <p>The point is always to look at what you are trying to achieve. Describe what is important about the page, what you are willing to give up, and in what order as the situation gets more complicated. All composition (including page makeup) involves compromise, so rules are useful only when you have some sense of these things. Even here, any hierarchy of rules must sometimes be broken, but at least if you know what end you're trying to achieve, it is done with that in mind.</p>
