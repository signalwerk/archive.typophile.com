      <p>In the book world, there are several methods used. One is to not balance pages; to let spreads misalign by one line. This is uncommon.</p>
      <p>If you are going to align spreads, you have three basic tools. The first is to allow facing pages to run up to 1 line long or short of the "nominal" page. Sometimes a designer will specify "short but not long," or "long but not short."</p>
      <p>A second method, which seems to be the basis of your question, is "to make a line" or "lose a line." Usually it is easier to make a line; look for a paragraph that ends almost at the right margin, &amp; try to bring down a word -- bring down at least as much as the following paragraph indent.</p>
      <p>The third method is to allow carding. I know that there is a convention that carding is never to be done, but is does work, and had a proponent in Richard Eckersley, a reasonably famous book designer who is even in Wikipedia.</p>
      <p>Something else to consider is to banish widows, but not worry about orphans (short last lines on a page). This is pretty standard in the University Press world. You still have to adjust pages, but there are fewer "problems."</p>
      <p>As to running heads, their purpose is to be useful to a reader. Repeating the author name on every page is simply a graphic device, of no use. Using the author's name is useful in an edited volume, which has multiple authors. Using the chapter title can also be useful. Using the subhead can be useful, but is a lot of trouble. Much depends on how the book will be read; if you anticipate a reader starting at the front &amp; moving to the end a page at a time, running heads aren't too useful. But if you think of a guide book,  obviously, running head selection is quite important.</p>
      <p>FWIW</p>
      <p>Charles Ellertson</p>
