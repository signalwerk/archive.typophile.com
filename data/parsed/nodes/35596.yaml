      <p>Adjusting H&amp;Js can be a better way than tracking to either pull up a widow or add a line to a paragraph. I usually have one H&amp;J called tight, one called normal, and one called loose. I don't like to mess around with tracking too much, it can make the type density look uneven.</p>
      <p>Here are my formulas:<br>
      Tight: 70/85/100<br>
      Normal: 75/100/120<br>
      Loose: 85/105/125</p>
      <p>I'm more accustomed to working with these in Quark than InDesign. I don't know if InD lets you name and choose individual H&amp;Js the way Quark does tho. In Quark you can do it quite easily in the paragraph palette. </p>
      <p>I just read Gary's comment, and realize he's getting at the same thing.</p>
