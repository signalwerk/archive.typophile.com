      <p>I do some work for a publisher who not only insists that the pages balance but does not allow you to go a line short or long on a spread in order to achieve that balance. With everything tied to the baseline grid except for the heads it makes the job of balancing pages pretty tricky. So what I often do is set my type and then proceed to go back and absolutely destroy it in order to follow their silly rules. And what I end up with is either very loose or very tight lines in order to gain or lose lines and acheive the nirvana they call balance. I've tried to point out that their insistence on following these rules results in very amateurish looking type but to no avail. It's very disheartening.</p>
