  html: <p>So, I've followed the many suggestions on typophile and am now ready to make my font public. What is the standard information to include in an EULA? Do I model mine after an existing example? What do I need to change, if I decide to follow my previous question. And what worked for you when you first started. Perhaps there is another thread that explains this, however I couldn't find one. Thanks for your help <br> <br>tim</p>
