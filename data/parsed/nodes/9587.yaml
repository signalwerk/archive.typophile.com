    html: <p>Tim, I would have to say that modeling your user agreement after an existing one is not such a bad idea. Take a look through a half dozen or so and pick and choose from these to create your own that fits your needs and desires. Keep what you like, throw out what you don't.  <br>  <br>Of the half dozen you choose to reference for your model make sure that they are reputable sources. The more legitimate the foundry is the more likely their licensing is legitimate to.  <br>  <br>But remember copying is bad. It needs to be <i>your</i> license in the end.  <br>  <br>Otherwise get a lawyer. But he/she would probably start from an existing one as well.   <br>  <br>I think you could write one yourself.  <br>  <br>Good Luck.   <br>  <br>-smc <br> <br>PS. I'm glad you liked my joke. I thought of it over a pile of beer-battered shrimp. Not to mention the beer.</p>
