    <p>hello,<br>
    i've got a problem with our version of CentaurMT. a huge gap occurs after every end quote glyph.</p>
    <p>when i check the kerning between the quote and the space it's 6967. {??!!??????}</p>
    <p>does anyone know what is causing this? is there a way to fix it without having to go in and manually set the kerning to 0?</p>
    <p>thanks in advance…</p>
    <p>------<br>
    nick cottrell</p>
    <p><a href="http://www.istitch.net/typophile/messedupquote.jpg" rel="nofollow">image</a></p>
