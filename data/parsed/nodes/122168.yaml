      <blockquote><p>Now, I have a bit of trouble with categorizing two of their typefaces: Romain and Sang Blue, which are both related.</p></blockquote>
      <p>¶ Based on the serif style, <em>Romain</em> is a transitional and <em>Sang Bleu</em> is a modern.<br>
      Both are hybrid, post-modernistic typefaces.</p>
      <p>¶ <em>Sang Bleu</em> features the trade mark of the French Royal Printing House on the lower-case "l" called the "sécante".</p>
      <p>¶ Swiss designer François Rappo used to fashion his own version of <em>Romain du Roi</em> called <em>LaPoliceBP</em> that he removed from the market.</p>
      <p>¶ Don't foget that the original <em>Romain du Roi</em> was digitized by Frank Jalleau in 1995 at the I.N.</p>
