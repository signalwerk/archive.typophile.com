    <div class="node-spam-content"><p>I saved pictures from typefaces from the foundry Swiss Typefaces and I always sort out the pictures I save according to category so I can find everything back on my computer. Now, I have a bit of trouble with categorizing two of their typefaces: <a href="/wiki/https%3A/%252Fwww.swisstypefaces.com/fonts/romain/" class="freelinking" rel="nofollow">Romain</a> and <a href="/wiki/https%3A/%252Fwww.swisstypefaces.com/fonts/sangbleu/" class="freelinking" rel="nofollow">Sang Blue</a>, which are both related. I have the feeling it's just the contrast that makes me think they're didone-like, while the model is actually transitional.</p>
    <p>The design of both typefaces is obviously inspired by Romain du Roi, which I always thought of as a transitional typeface (though exploring the boundaries thereof as it clearly takes things further than Baskerville). Gert Wiescher designed a digital version called Royal Romain, which on MyFonts is tagged as Bodoni (which I don't quite see, but I suppose it could just refer to Giambattista Bodoni's work in general) and Didone. On Wiescher's website his Royal Romain is labeled under "Antiqua fonts".</p>
    <p>So how would you label these typefaces? I think the flat top serifs give the designs a didone atmosphere, but they're less mechanical and lack the teardrop terminals usually associated with the didone style. Am I right to consider these typefaces to be transitional?</p>
    <p>Also, where exactly do you draw the line, or is there simply no line? I recently stumbled upon <a class="freelinking external" href="http://pedroarilla.com/en/valentina" rel="nofollow">Valentina</a>, which I would consider a didone but it's clearly blurring those lines quite a bit.</p>
    </div>
