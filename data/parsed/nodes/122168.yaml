    html: |-
      <div class="comment-spam-body"><p>Thanks for the video. That's very interesting. I still don't quite see it as just to call Romain du Roi a proper didone though. To me it seems like a bridge from transitional to didone. It would almost be deserving of its own style name, if only there were more typefaces like it. It's actually quite strange that this style was "developed further" rather than reproduced like the styles that came before it.</p>
      <p>I guess perhaps the style saw a quick development because of technological advances; as far as I know Baskerville was also an experiment to seek out the limits of design and technology, and after Romain du Roi it was important to take it an extra step further, rather than stick with a style that perhaps was seen as perfect in its own right. This is pure speculation from my part. Does anyone know why it's not a widely seen style?</p>
      </div>
