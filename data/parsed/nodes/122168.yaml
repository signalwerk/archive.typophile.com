    html: |-
      <blockquote><p>Based on the serif style, Romain is a transitional and Sang Bleu is a modern.<br>
      Both are hybrid, post-modernistic typefaces.</p></blockquote>
      <p>What difference do you see in serif style between Romain and Sang Bleu?<br>
      To me the it looks exactly the same.</p>
      <p>For me Didones represent a pointed pen contrast, which Romain clearly isn't.</p>
      <p>I think you shouldn't waste time on these classifications systems, they are really limited and outdated. They're necessary to give some initial understanding to students and beginners, but otherwise, describing typefaces by characteristics and other elements such as time of creation, epoch, country, mixes of influences… makes more sense to me – and is much more interesting – then trying to make them fit into boxes with essentially historical parameters. What happens with boxes is you always end up with boxes for "whatever don't fit in those other boxes".</p>
      <p>Also, the tags on myfonts don't mean much. Essentially it just means the designer hopes somebody searching bodoni will find his font and like it. </p>
      <p>Valentina feels like a mix of Bodoni and Fleischmann.</p>
