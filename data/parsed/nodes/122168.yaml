  - id: 597054
    user: 52182
    date: 2015-01-10T14:35:00
    date_raw: 10 Jan 2015 — 2:35pm
    votes: null
    html: |-
      <div class="comment-spam-body"><blockquote><p>I think you shouldn't waste time on these classifications systems, they are really limited and outdated.</p></blockquote>
      <p>I agree they are limited, but still very useful. Any model is limited but useful. As for classification systems being outdated, I have two responses to that. Firstly, I was making a consideration of classification about a typeface based on a historical one, so at least within this context the type classification system is not outdated. As for when it does seem outdated, how about upgrading the type classification system?</p>
      <p>I'm very aware of the limitations of classification systems, how some typefaces don't fit within certain classifications* and how predominantly new typefaces tend to not fit nicely within classes any longer. They're still working very well for me though and serves as a basis for all the characteristics and elements you mention. A type classification system and the rest you mention are not mutually exclusive. A type classification system should probably stand at the base of the rest you mention.</p>
      <p>*This doesn't happen as often as you might expect, as I currently have over 2500 pictures of typefaces sorted on my computer according to my own classification system with only 93 pictures in a miscellaneous folder. That amounts to 16 typefaces, and it's not like I didn't know how to classify them, but rather the miscellaneous folder includes display typefaces of varying classifications which I could have sorted among the other folders but I like to keep them in a distinct folder because the designs are distinct.</p>
      <p>The greater the amount of pictures within a category, the larger the need for sub-categories. This is how classification systems inherently work. The fact that current type classification systems are outdated is because it will be in hindsight that we will achieve the insight to classify them. Regarding the serif category the last sub-category I use (counting the slab serifs as a distinct model with its own sub-categories ) after "didone" is "contemporary", which at the moment is indeed an arbitrary category which fails to define the style in strict terms, but if or when we will be working with a new style, all typefaces designed currently which I couldn't fit into the historical categories will be redefined. Not using classification systems because they're outdated seems silly. You're essentially saying not to use any models at all when one model is outdated.</p>
      <blockquote><p>describing typefaces by characteristics and other elements such as time of creation, epoch, country, mixes of influences… makes more sense to me – and is much more interesting</p></blockquote>
      <p>I agree, but it's not an option between all these elements and a type classification system. In fact, the classification system is based on that and only serves as a model to get more insight. By looking at all the other information I can validate aspects of the typeface in regard to the model or realize in what ways the typeface deviates from the model and why, and this in turn will give a lot more insight into the typeface than "merely" looking at the time and country it was created in. </p>
      <blockquote><p>What happens with boxes is you always end up with boxes for "whatever don't fit in those other boxes".</p></blockquote>
      <p>How is that an argument against it though? Models are inherently incomplete or not fully descriptive of reality. That's why they're models. When the quantity within a certain (arbitrary) category becomes great enough you will achieve new insights regarding how they could be defined and categorized. For me the problem is not necessarily how to categorize the miscellaneous designs, but how to name these new categories.</p>
      <blockquote><p>Also, the tags on myfonts don't mean much. Essentially it just means the designer hopes somebody searching bodoni will find his font and like it.</p></blockquote>
      <p>I'm aware they don't necessarily mean much because it's generally not professional type designer and researchers that are tagging typefaces. The end users mostly tag, and so there are often tags being included which say something about the design but are not proper categories, and indeed you will sometimes find mistakes or loose associations in the tags as well. And yet, all these tags together can be somewhat descriptive of the typeface and offer (loosely) associated typefaces as well. I do find it useful to look at the tags, but also questioning them. I certainly don't confuse these tags to be a historical classification system though. It's not much more than a search system which is only partially based on the terms grounded in historical classification systems.</p>
      </div>
