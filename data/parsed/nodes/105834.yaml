    votes: null
    html: |-
      <div class="comment-spam-body"><p>Found it! Checked a copy of the Photolettering "Alphabet Thesaurus" when I visited a university library earlier today. It's _Sill "TV" Square Gothic_ designed by G. Reed Sill Jr.  The "TV" obviously refers to the O which has a squared letterform that is bowed out, just like the shape of TV screens in the pre-digital era.<br>
      Don</p>
      </div>
