    html: |-
      <div class="comment-spam-body"><p>I suspect that this is a Photolettering or Filmotype font that has not yet been digitized. In a recent discussion, <a href="http://www.typophile.com/node/104488" title="http://www.typophile.com/node/104488">http://www.typophile.com/node/104488</a>, we found a very similar font, Fiedler Gothic, for a 1963 book cover.<br>
      A check of the Photolettering "Alphabet Thesaurus" might find the match. Unfortunately, I don't have a copy but perhaps one of the other Typophiles has.<br>
      Don</p>
      </div>
