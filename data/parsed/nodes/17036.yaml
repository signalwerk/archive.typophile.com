      <p>Carl’s “a very faint, very lonely, slow trail” is pretty accurate. There is no cookbook how-to typedesign-for-dummies book because it does not work that way. For me, it is all about “seeing” not just looking. “Yes Grasshopper,” it is kinda like “<a href="http://www.tribuneindia.com/2002/20020616/spectrum/art.htm" class="link-external">Zen and the Art of Archery</a>”. You use your eyes to decide where to place the horizontal of the H and every other of the millions of decisions you will have to make. Type design is a prolonged study in angst while chasing a brief moment of eureka. The path is long with no road signs to guide you.  If Ed Benguiat and Matthew Carter were to follow “the path”, each would go a different way, one which befits them as individuals.<br>
      Having read Leslie Cabarga’s “<a href="http://www.amazon.com/gp/product/customer-reviews/1581804369/103-5504466-5358246" class="link-external">Logo, Font &amp; Lettering Bible</a>” does not change my mind. Leslie tells you his way but it is not a universal truth.  Don’t get me wrong, read it—there are plenty of good tips in there but it is not “to kill for” and it won’t help you much with your thesis.</p>
      <p>ChrisL</p>
