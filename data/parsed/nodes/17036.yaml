      <p>Hi Jason,</p>
      <p>I think your paper could be very useful. But rather than trying to paraphrase others, possibly losing something in translation, could you speak from your own experience?</p>
      <p>Suppose you start a typeface design, using feedback from the critique forums here, to help you proceed. Then, as the process moves along, you can document the steps you took. Save all your proofs. Show the first few letters, and what people said about them. Include your reactions, feelings and decisions. Include these Typophile threads, as they reveal the difficulty we all have in getting started. Other beginning type designers would be very interested in your journey. </p>
      <p>Each time something new happens (re-spacing, stem weights adjusted, serifs shortened, x-height adjusted), show new samples. It could be like a diary, with lots of illustrations. Describing type with words is as hard as describing colors, so use examples of your process. </p>
      <p>The conclusion can be a showing of the design, and the paper can be set in the final version of the typeface. Use earlier versions of the design in early pages of your document, to demonstrate to readers how it evolved. Maybe each chapter or section has a page summarizing that week’s changes, set in that week’s version of the font. </p>
      <p>If the entire project shows that evolution, and de-mystifies the process, then I think that would be a fantastic document. Instead of an instructional manual, it would be more like an expose or a case study. If it was all drawn from your own experience, there would be nothing factual for anyone to argue with. It would be a document of your learning experience, which others could be enlightened by. </p>
      <p>I know this is not what you intended to do, but it might turn out to be much more interesting, and you might be very glad to have your own typeface to use in future documents. The research you have done already would not be wasted, just re-purposed. </p>
      <p>I could begin right away making suggestions for your typeface project, including which letters to start with, how to space them, balancing proportions, etc. etc. I think others would gladly share along those lines. The critique forums are pretty lively. </p>
      <p>What do you think?</p>
