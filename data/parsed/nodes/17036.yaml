      <p><a href="http://typophile.com/wiki/Books" title="http://typophile.com/wiki/Books">http://typophile.com/wiki/Books</a></p>
      <p>The wiki has some books (not all have an article attached to them yet). The problems/opportunities faced when designing letters for, for example, <a href="http://www.myfonts.com/search?search%5Btext%5D=bell+centennial">Bell Centennial</a> are clearly different to those of <a href="http://www.typography.com/catalog/requiem/index.html">Requiem Display</a>. Perhaps you should look at a general approach to a design, what the designer would want to know before going ahead and designing, what is the purpose, maybe, then identify design decisions that have to be made from that base, rather than try to define a single method of designing a character which will always have exceptions to the ’rule’. I suspect you will have to narrow your subject in order to write a coherent thesis.<br>
      Also dissecting and overlaying letterforms will show that the m is rarely two ns, this is also a useful technique when examining other letterforms.<br>
      <em>I don’t care if it is serif, san serif, italic, or script. I just want to know everything you are willing to give me on the letter.</em> the trouble is that there are different considerations in each case, but you are aware of the basic shapes of B and b.<br>
      Tim</p>
