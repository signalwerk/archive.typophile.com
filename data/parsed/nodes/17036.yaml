    <p>Your last suggestions were great not for the next letter or letters. I thought it would be better to combine the two. My explination. I am wanting to know everybodys tips,opinions, and advice on designing the uppercase B and lowercase b. Are there any problems you encounter. Suggestions on how to attack it. Things you should pay attention to. I understand the whole typeface affects it and it will be addressed but i am more concerned with just the two letters for now. Please look at it as for someone who know nothing about type design. This is for my thesis and i just wanted to see what everyone had to say before i write the chapters. Thanks alot and i look forward to you opinions.</p>
