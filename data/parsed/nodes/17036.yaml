      <p>“The problem is to get it you have to ask people for it.”</p>
      <p>Isn’t it though?  ;)</p>
      <p>Jason, your posts about Letter A, Letter B and Type Design Movements sound like you are just getting started with research into your project. Is this the case? If so, I hope you are not starting out with the premise that research is a bother. Other posts you’ve made imply that this project represents an obstacle to you and little else. Given your disregard for research, reading and punctuation, how far do you expect to get? Will someone else do the writing? Read the original post you made to open your “letter B” thread. To me it carries a tone of entitlement and of disinterest, as if you are just carrying out a tiresome chore, one which you expect we will perform for you. </p>
      <p>I struggle attempting to answer your questions, because they are quite open-ended; they represent the beginning of a very arcane, detailed and subtle adventure, one you don’t sound very interested in. </p>
      <p>I’ll reply with a question: What kind of B? (Clues: Serif or Sans, Roman or Italic, formal or informal, script or.....). This may help you re-formulate your question about Type Design Movements. </p>
      <p>I reply with a question because the answer would otherwise be so layered, so packed with conditions and disclaimers, that it would quickly seem irrelevant, unintelligible, or both. Typefaces are made for particular purposes, and they are systems of interchangeable parts. Not only do the various letters influence each other, but the intended use of the typeface influences everything, down to the size of the dot on the i. Seriously. If you hope to get feedback that you can use, you may have to put more thought into your questions.</p>
