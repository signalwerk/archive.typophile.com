      <p>Jason,</p>
      <p>I’m not trying to get you to “leave us alone”. I just think your questions raise more questions than you are prepared for. I wonder if you have tried using abebooks.com or Amazon to find used copies of the out-of-print books you listed? Also, the resources listed in the wiki are very helpful. “Anatomy of a Typeface” by Alexander Lawson is especially good for some of your initial questions. </p>
      <p>“How big a difference is there between a Sans and a Serif”, is a question which might take 30 people 2 weeks to answer to your satisfaction. Could you rephrase this? I don’t really know where to begin. Suppose you start with a specific question about the difference between the structure of b in Jenson and in Univers, for example. </p>
      <p>Everything I know about the letter B is not likely to get you anywhere. I makes sense for you to pick an example, like a serif typeface for books, to begin with, in asking about letter design. The answers for that scenario are different than the answers for a sans for phone books, a condensed sans for highway signage, or a trendy serif face for a magazine. So, it might help you get farther if you did care if it is sans, serif, etc. Think of it as a test case which can be exlored fully, then contrasted with another test case to show the many, many exceptions to every rule.</p>
      <p>Your comment about “having to” write a thesis on the topic belies your impatience. I’m afraid there is no place where you can find all the information you need about this enormous topic. I suspect everyone who is actively designing type now has followed a very faint, very lonely, slow trail to discover what they know. Often, essential concepts like contrast or letterspacing require more experience than book knowledge to really grasp. Each book you encounter is likely to provide some bit of information you can combine with other bits to form an idea of the steps required to design a typeface, but short of actually designing a typeface, your results may be limited. This may be why it is hard to collect the information in one place. Even a book like “Designing Typefaces” by David Earls doesn’t cover everything. </p>
      <p>I encourage you to ask more specific questions, collect the replies, and see if it helps you focus your topic. You might find a subject that is just the right size, like Paul Renner’s Futura, and it’s importance in its historical context, or Bell Centennial and the specific purpose it was designed for, or the adaptation of a single metal typeface like Bembo for digital use. Or how a typefounder cut punches for the smallest size of a classic design like Garamond or Caslon, or the entire genealogical history of Helvetica, or.... </p>
      <p>To reiterate the main point, there are specific approaches to type design for each different design. There is no compendium of type design knowledge that can answer all your questions. So you may have a bit of a hunt on your hands.</p>
