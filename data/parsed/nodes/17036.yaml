    html: <p>Generally I agree with much of what Carl has written in response to Jason. However, I am willing to share this little gem on the design of the uppercase B. In <em>Carter’s Caps,</em> Will Carter records that Eric Gill always told him that the lower bowl of the B should hang slightly ’like a young girl’s buttock’. Given Gill’s proclivities as discussed elsewhere on Typophile quite recently, this is not so charming as it sounds. Carter’s B is, however, a fine example of the model.</p>
