      <p>Too answer your remarks. I am very interested in the subject that is why I picked it. The problem is finding the information. There is hardly non-on the subject of type design. There are a lot of pretty examples but nothing explaining the complications of developing the shape or face. Like the uppercase H. How you should place the bar a little higher for best optical effect. Or how when designing your n can turn into your h or two n’s get your m. Stuff like that. I have had no class on type design and out of the 150 typography books I have 8 actually talk about the science of designing a letter. </p>
      <p>Lettering (Thomas Wood Stevens), Anatomy of Lettering (Russell Laker), Fonts and Logos, Logotypes and Letterforms (Doyald Young) Lettering for Advertising (Mortimer Leach), Lettering for Reproduction (David Gates), The Alphabet and Elements of Lettering (Fredrick Goudy), and Roman Lettering (LC Evetts).</p>
      <p> All out of print. So if you know of any books on type design or places to look please tell me and I will leave you alone. </p>
      <p>I have some fascinating ones on the history but sense I was am out of town for the holiday break and could only carry a few on the plane is the reason for the type movement question. That one I was being lazy. </p>
      <p>These others yall are suppose to be the experts. And as you can see there is not much as of books so I thought I would ask. So cut me some slack. I’m sure yall asked several people what to do when yall were trying to figure it out. Its more complicate then drawing a letter. I’m learning that everyday. </p>
      <p>As for the open-endedness. It is open-ended. I just want you to talk about the letterform. Some things to look out for, problems you face, common frustrations or tips you have figured out. Yall have the experience not me.  I don’t care if it is serif, san serif, italic, or script. I just want to know everything you are willing to give me on the letter. That is all. </p>
      <p>YOU ARE NOT WRITING MY THESIS FOR ME. I will just simply add your information with mine the I WILL WRITE IT MY SELF. If it sucks you write one, any one write one then I wouldn’t have to. I could write a meaningless one on branding like everyone else.</p>
