      <p>@Nick Shinn:<br>
      it's a simulation. josip kelava made an actual redesign for the company's identity.<br>
      but i do not know when this design will be printed on real billboards.</p>
      <p>the font is not custom it just offers three different alternatives for each glyph, so talented people like josip can combine them with nice photoshop work.</p>
