    html: <p>I think this feature is stupid. When I see a specimen I prefer a pdf so I can print and see if the typeface works. Now foundries will remove their pdf.  <br>Is it possible to open the fonts also from protected pdf?</p>
    html_clean: <p>I think this feature is stupid. When I see a specimen I prefer a pdf so I can print and see if the typeface works. Now foundries will remove their pdf.  <br>Is it possible to open the fonts also from protected pdf?</p>
  - id: 46726
