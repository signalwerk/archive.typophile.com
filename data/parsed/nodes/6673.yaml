  date: 2004-09-15T06:00:00
  date_raw: 15 Sep 2004 — 6:00am
  votes: null
  html: <p>This Belgian company, Alt-Soft, has a new software for font edition and conversion, called FTM (Font Type Master). It's a simple app, not really good for drawing or creating new fonts, there's not even a good metrics tool. <br> <br>But this app has a <i>very, very</i> interesting feature. Maybe I shouldn't post this here, but... it opens fonts from PDFs! Using the demo, I was able to open a font from a PDF file. Quick and easy. No kerning though. I just wasn't able to save the font because it is a demo (no saving allowed). <br> <br>I will not post a link to this, but I think interested people will find it. <br> <br>Personally, I think this feature should be removed from this app. But, what do others think about it?</p>
  html_clean: <p>This Belgian company, Alt-Soft, has a new software for font edition and conversion, called FTM (Font Type Master). It's a simple app, not really good for drawing or creating new fonts, there's not even a good metrics tool. <br> <br>But this app has a <i>very, very</i> interesting feature. Maybe I shouldn't post this here, but... it opens fonts from PDFs! Using the demo, I was able to open a font from a PDF file. Quick and easy. No kerning though. I just wasn't able to save the font because it is a demo (no saving allowed). <br> <br>I will not post a link to this, but I think interested people will find it. <br> <br>Personally, I think this feature should be removed from this app. But, what do others think about it?</p>
