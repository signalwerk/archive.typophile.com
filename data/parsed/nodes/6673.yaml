    date: 2004-09-15T09:04:00
    date_raw: 15 Sep 2004 — 9:04am
    votes: null
    html: <p>Who is supposed to use the feature, and for what purpose? There really isn't a legitimate need to open a font from a PDF, because if you have a legitimate right to open a font it is because you have a license which says you can, which means that you have the font.</p>
    html_clean: <p>Who is supposed to use the feature, and for what purpose? There really isn't a legitimate need to open a font from a PDF, because if you have a legitimate right to open a font it is because you have a license which says you can, which means that you have the font.</p>
  - id: 46727
    user: 655
    date: 2004-09-15T09:10:00
    date_raw: 15 Sep 2004 — 9:10am
    votes: null
    html: <p>It looks like a nice engine for an font editor, but due to its feature set, its more a deluxe  ripper. <br> <br>It can't open protected pdfs, but experts will know how to do it.  <br> <br>So for pdf specimens, you should embed only a subset of your fonts and essential pages can be rendered as bitmaps only.</p>
