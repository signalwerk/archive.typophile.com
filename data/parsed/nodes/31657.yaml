    html: |-
      <p>A good codepage to begin with is MS Windows 1252 Western.<br>
      If you complete all those characters, you will get basic cross-platform compatability.<br>
      Actually, once you've done that, it's very easy to also do 1250 European, because if you have the separate characters and accents, FontLab automatically makes the composite characters, all you have to do is click on the grey box.</p>
      <p>When you generate your font, in "Font Info &gt; Encoding and Unicode", clicking on the magic green diamond will automatically tell you which code pages the characters you have created for your font will support.</p>
