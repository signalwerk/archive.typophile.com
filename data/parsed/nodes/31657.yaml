    html: |-
      <p>If your glyph is a default representation of a Unicode character, just pick the codepage, Unicode range or encoding in which this glyph is listed, and double-click on an empty glyph cell to create a blank glyph. A glyphname and a Unicode codepoint will be assigned automatically. (If you know the correct glyphname for your glyph, you can use Glyph / Generate Glyphs and type it there.) If your glyph is not a default representation of a Unicode character (i.e. it's a ligature, a variant glyph etc.), you need to name the glyph according to the recommendations described in the "Glyph Naming and Encoding" section of the FontLab Studio manual. </p>
      <p>A.</p>
