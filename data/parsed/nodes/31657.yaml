    html: |-
      <p>Rachel, </p>
      <p>the only thing that matters in OpenType fonts is that each glyph has an appropriate name and an appropriate Unicode codepoint. The codepages, encodings and Unicode ranges are for orientation only. They are not stored inside of OpenType fonts (unless you set the FontLab Studio Preferences to enable some special encoding options.)</p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
