  html: |-
    <p>I'm new to fontlab and just finding my feet.<br>
    What code page should I be using to develop my font ?<br>
    I want to make an opentype font to use cross platform, is the type of code page I choose going to effect the font I make or can I choose any code page and still get the same results?</p>
    <p>Regards</p>
    <p>RachelR : )</p>
