  html: |-
    <p>Hi, I'm currently developing the brand for a golfing company. We're now looking at typography, and found what we believe will be suitable for this particular company. It's the <a href="http://www.myfonts.com/search?search%5Btext%5D=Willard+Sniffin+Script+Bold" rel="nofollow">Willard Sniffin Script</a>. </p>
    <p><a class="freelinking external" href="http://www.puscas.com.au/uploads/willardsniffinscript.gif" rel="nofollow">http://www.puscas.com.au/uploads/willardsniffinscript.gif</a></p>
    <p>The company name will have the word 'Golf' in it, hence the text displayed above. Here's what I'm asking; do you see anything wrong with the way the 'L' and 'F' work together? To me they seem fine, but the boss doesn't like the two letters (they clash, in his words). I, nor the other guys here in the office, see anything wrong with them, so I thought I might ask you all. </p>
    <p>The rest of the letters are all fine, and this type would be very suited to the brand. Now, we've got 2 options; edit the type, or find another font. I'd like to try the former first. Do you have any suggestions in what can be done with the L and F characters? Or would you just search for a similar typeface that doesn't have the same issue with the two particular letters?</p>
    <p>note: font hasn't been purchased yet.</p>
