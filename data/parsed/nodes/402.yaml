    html: <p>I live right here in Minneapolis and have made plans to attend the conference. Unfortunately, I have not signed up for any of the workshops since I'm broke as a joke having just graduated college with no real job prospects. <br> <br>As far as antiquarian bookstores go, I'm not the greatest person to ask, but I do know of a few.  <br> <br>There's a store downtown on Nicolet Mall (pronounced NICK-eh-let, don't ask why) called James and Mary Laurie booksellers. I haven't perused their book selection, but they have a huge basement full of classical and jazz records. <br> <br>There's another large store equidistant from the two downtowns on University ave called Midway Used and Rare Books. <a href="http://www.midwaybook.com/">Here's their website</a> so you can check it out in advance. <br> <br>Hope this helps.</p>
