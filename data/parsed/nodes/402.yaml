    html: <p>Milan, the admission fee is one price for the main conference. There are no additional charges except for optional workshops. <br> <br>We had plenty of volunteer positions available earlier, but all those spots are filled. Sadly, we have no fonts to kern. I don't know about "whoring" a foundry - you'll have to approach the individual companies and see what kind of response you get. Using slightly different terminology would be more likely to produce positive results. <br> <br>FYI, the first email I've ever received from you arrived late Thursday night. I replied to you yesterday afternoon before taking a few hours off to see the fireworks with my little boy. Shocking, I know ;) <br> <br>If you're going to TypeCon, be sure and register by Tuesday - it's only $125 for 3 days of typographic goodness, and some free munchies for starving type-aholics like yourself. After Tuesday, late registration is $200. <br> <br></p>
