    html: "<p>John, <br> <br>I have had experience with only a few antiquarian book shops in the area. <br> <br>(1) Rulon-Miller is located in St. Paul; they have a nice typography selection, but are open by appointment only: <br><a href=\"http://www.rulon.com\" target=\"_blank\">http://www.rulon.com</a> <br>(approx. 7 miles from hotel) <br> <br>(2) Lien's, in Minneapolis, is close to the hotel, and is also very good... <br><a href=\"http://www.liensbooks.com\" target=\"_blank\">http://www.liensbooks.com</a> <br>(approx. 2 miles from hotel) <br> <br>(3) A lot of people like Magers &amp; Quinn, too: <br><a href=\"http://www.citypages.com/bestof2000/boughtandsold/bestof828.asp\" target=\"_blank\">http://www.citypages.com/bestof2000/boughtandsold/bestof828.asp</a> <br>(approx. 3 miles from hotel) <br> <br>(4) Finally, Loome Antiquarian Booksellers is 30 minutes out of the Twin Cities, but well worth the trip: <br><a href=\"http://www.loomebooks.com/booktown/valley.html\" target=\"_blank\">http://www.loomebooks.com/booktown/valley.html</a>  <br>(approx. 25 miles from hotel) <br> <br>Twin Citians: This list is undoubtedly incomplete; please add your favorites! <br> <br>Jon</p>"
