    html: "<p>I'll be there. It will be my first, too. I feel lucky that it's right in my neck of the woods and that I was able to be involved in it. It will be great to finally meet in person so many people I have gotten to know online. (We designed the name tags to be readable more than two feet away.) <br> <br>I'm attending three of the workshops: The Glass Guilding Demo and Paper Banner Demo on Thursday, and Ken Barber's workshop on Friday. There were other workshops I wanted to do, but many of them were being held at the same time. It was a tough choice, but I think I would have been happy no matter what I picked. <br> <br>I still have a ton of stuff to do before the conference and I'm at a family reunion for almost a week beforehand. Busy, busy, busy. See you there!</p>"
