    html: <p>Of course you didn't waste that 15 seconds, and it certainly wasn't a waste for Quay &amp; Sack - they got paid for it! But culturally it's going nowhere whatsoever. It's so generic that at most it's just a way to save money compared to a corporate license of an existing design. <br> <br>It reminds me of the Dutch phone book phone done by Majoor, which doesn't even bother with trapping! Instead of that MM they should have just gone with a custom instance of Myriad-MM. <br> <br>hhp <br></p>
