    <p>hi guys! I've designed a logo for a client and chose the typeface "Dax Condensed". However, he desperately wants to use "Myriad pro" as his corporate font for writing letters etc. etc.<br>
    would that be legit? mixing two sans serif fonts? </p>
    <p>cheers mike</p>
