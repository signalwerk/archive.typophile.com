  - id: 205166
    user: 14722
    date: 2007-05-28T17:17:00
    date_raw: 28 May 2007 — 5:17pm
    votes: null
    html: <p>The catch with using them together is to make sure that they aren’t used in remotely similar weights or sizes anywhere near each other. Mixing sans fonts (or some serifs) becomes a problem when the two fonts look mostly, but not entirely alike, generating a sort of visual dissonance for the reader.</p>
    html_clean: <p>The catch with using them together is to make sure that they aren’t used in remotely similar weights or sizes anywhere near each other. Mixing sans fonts (or some serifs) becomes a problem when the two fonts look mostly, but not entirely alike, generating a sort of visual dissonance for the reader.</p>
