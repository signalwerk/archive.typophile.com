    <p></p><div class="imageWrap"><img src="http://typophile.com/files/photo-main_5230.jpg"></div><p></p>
    <p>Hello guys, here I'm asking for your help to make my font project<br>
    Tweegi a reality. Tweegi is a super condensed fonts with two<br>
    variables regular and italic, it has a 600+ character set, with regular<br>
    and discretionary ligatures, alternate characters, complete set of<br>
    numbers, small caps and it covers 105 latin alphabets. The best of this<br>
    is that if I can reach the funding goal, it will be free for everyone<br>
    to use as they like. </p>
    <p>So please check it out and help me spread the word, every help<br>
    will be appreciated. </p>
    <p><a href="http://www.kickstarter.com/projects/...shionable-font" title="http://www.kickstarter.com/projects/...shionable-font">http://www.kickstarter.com/projects/...shionable-font</a></p>
