    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Video</strong></p>
    <p>In addition to appearing in quite a few videos himself, <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> also designed a photo-typesetting typeface family for <a href="/wiki/Mergenthaler%20Linotype" class="freelinking" rel="nofollow">Mergenthaler Linotype</a> in the 1970s, which he called Video. Video was designed to withstand all of the terrible scaling and scrunching that photo-typesetters who do to their type, instead of buying more weights.</p>
