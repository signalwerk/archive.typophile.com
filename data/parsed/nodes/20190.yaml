    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Video</strong></p>
    <p><strong>Films</strong><br>
    <a href="http://www.helveticafilm.com/" rel="nofollow">Helvetica</a>, a film about graphic design in the second half of the 20th century, using <a href="/wiki/Helvetica" class="freelinking" rel="nofollow">Helvetica</a> as an example to explore various themes.<br>
    <a href="http://www.linotypefilm.com/" rel="nofollow">Linotype</a>, a film about the <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a> machine.<br>
    <a href="http://www.p22.com/products/makingfaces.html" rel="nofollow">Making Faces: Metal Type in the 21st Century</a>, a film about the work of <a href="/wiki/Jim%20Rimmer" class="freelinking" rel="nofollow">Jim Rimmer</a>.<br>
    <a href="http://typeface.kartemquin.com/" rel="nofollow">Typeface</a>, a film about the <a href="/wiki/Hamilton%20Wood%20Type%20%2526%20Printing%20Museum" class="freelinking" rel="nofollow">Hamilton Wood Type &amp; Printing Museum</a>.</p>
    <p><a href="http://www.marksimonson.com/video/FontClip.mp4" rel="nofollow">CBS Sunday Morning, May 2006</a> hosted graciously by <a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a><br>
