    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoWiki</a>&nbsp;:&nbsp;Video</strong></p>
    <p><strong>Films</strong><br><a href="http://www.helveticafilm.com/">Helvetica</a>, a film about graphic design in the second half of the 20th century, using <a href="/node/13514" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Helvetica</a> as an example to explore various themes.<br><a href="http://www.linotypefilm.com/">Linotype</a>, a film about the <a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a> machine.<br><a href="http://www.p22.com/products/makingfaces.html">Making Faces: Metal Type in the 21st Century</a>, a film about the work of <a href="/node/13888" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jim Rimmer</a>.<br><a href="http://typeface.kartemquin.com/">Typeface</a>, a film about the <a href="/node/add/wiki?edit%5Btitle%5D=Hamilton%20Wood%20Type%20%26%20Printing%20Museum" title="Create node &quot;Hamilton Wood Type &amp; Printing Museum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hamilton Wood Type <span class="amp">&amp;</span> Printing Museum</a>.</p>
    <p><a href="http://www.marksimonson.com/video/FontClip.mp4"><span class="caps">CBS</span> Sunday Morning, May 2006</a> hosted graciously by <a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a><br><a href="http://www.typeculture.com/academic_resource/movies/movs/index.php?ID=Goudy_S3&amp;TYPE=mov&amp;W=320&amp;H=240">Goudy in his studio</a> (from <a href="http://www.typeculture.com/">Typeculture.com</a>)<br><a href="http://tdc.org/membership/2002goudytapes.html">Goudy Home Movie</a><br><a href="http://www.youtube.com/watch?v=TSBpgTAp8XI">Berthold Type adverstising</a><br><a href="http://www.youtube.com/watch?v=6wHiddZOfa8">Typesetting: Linotype - 1960 Educational <span class="caps">FI</span>lm</a></p>
    <p><strong>Discussion:</strong><br><a href="30381">Typographic Films</a><br><a href="http://www.typophile.com/node/43707">Typography videos</a><br><a href="100174">Interesting type&nbsp;movies?</a></p>
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;:&nbsp;Video</strong></p>
    <p>In addition to appearing in quite a few videos himself, <a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a> also designed a photo-typesetting typeface family for <a href="/node/13676" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mergenthaler Linotype</a> in the 1970s, which he called Video. Video was designed to withstand all of the terrible scaling and scrunching that photo-typesetters who do to their type, instead of buying more&nbsp;weights.</p>
