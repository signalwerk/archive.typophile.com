      <p>I think there may be some confusion on both out parts as to the meaning of the clauses. The way I understand it, the final approved designs (logo, CID materials) are for exlusive and unlimited usage/reproduction of the client. I.E., they’re the only ones allowed to use them, except me (for promotional purposes).</p>
      <p>The ownership clause is referring to “drawings, artwork, specifications, and other visual presentation materials” — not the final approved designs/services, yes? Doesn’t this just mean that all the materails that I produced to arrive at the final design are my property, but that I hold them for a year?</p>
      <p>Any lawyers in the house?</p>
      <p> -t</p>
