      <p>As Si says they have unrestricted usage of the logo and your artwork for their stationery* as long as they have paid the fees. </p>
      <p>*although you can request some kind of additional storage fee.</p>
      <p>Certainly you could/should charge for providing any other services, however, playing Devil’s advocate, the client has paid you for the work involved in the creation of the logo and they have a point in their assertion that they have paid for the logo and can use it however they choose, no matter what you advise them. </p>
      <p>To keep your relationship with the client, I think you should accede to their request with good grace, letting them know that you are not compelled to do this. Suggest that you act as a consultant/brand guardian (checking and approving) and, if you can quantify it, show how they have profited from your work. Insisting that they use your services in creating a standards manual will feel to the client as more extortion.</p>
      <p>Tim</p>
