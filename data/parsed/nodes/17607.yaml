    <p>Hi Typos,</p>
    <p>Recently a client contacted me about the terms of our (more than) year old corporate identity contract. The project consisted of the standard corporate identity materials: letterhead, faxhead, business card, two types of envelopes. The logo had been previously developed (by us), but the CID project consisted of doing some finishing work on it. Do to budgetary constraints, the client opted out of a graphic identity standards manual against my recommendation.</p>
    <p>The client called me with concerns about the ‘Rights &amp; Ownership’ clauses. I used the standard AIGA contract for this job. The section states:</p>
    <p>—-</p>
    <p>## 5. RIGHTS AND OWNERSHIP</p>
    <p>### 5.1. Rights</p>
    <p>All services provided by the Designer under this Agreement shall be for the<br>
    exclusive use of the Client other than for the promotional use of the Designer.<br>
    Upon payment of all fees and expenses, the following reproduction rights for all<br>
    approved final designs created by the Designer for this project shall be<br>
    granted:</p>
    <p>&gt; Unlimited reproduction/usage of Corporate Identity designs</p>
    <p>### 5.2. Ownership</p>
    <p>All drawings, artwork, specifications, and other visual presentation materials<br>
    remain the property of the Designer. The Client shall be entitled to temporary<br>
    possession of such materials only for the purpose of reproduction after which<br>
    all materials shall be returned, unaltered, to the Designer.</p>
    <p>All preliminary concepts and visual presentations produced by the Designer<br>
    remain the property of the Designer and may not be used by the Client without<br>
    the written permission of the Designer.</p>
    <p>The Designer shall retain all artwork, drawings, and specifications, for which<br>
    reproduction rights have been granted for a specified period from the date of<br>
    the signing of this Agreement. Upon expiration of this period, all such<br>
    materials may be destroyed unless the Client has requested, in writing, that<br>
    they be retained and agrees to pay reasonable storage charges. The Client shall<br>
    have reasonable access to all such materials for the purpose of review.</p>
    <p>The specified time for the Designer to retain such materials shall be</p>
    <p>&gt; 365 days/One year</p>
    <p>—-</p>
    <p>The client wants me to amend the contract to turn over ownership to him. This (BTW) is more than one year later. It appears that he never read the contract in the first place. He said things like “I don’t feel comforatble with this” and “what if you die tomorrow?” and “what if you try to screw me?” — sighting a past negative experience with a photographer. His rational that he paid for it so he should own it seems typical. What, in fact, he paid for was my creative problem solving/services to arrive at a corporate identity.</p>
    <p>It is my feeling (from his other questions/rhetoric) that this really has more to do with the logo than anything else. I think they think that they should just be able to take their logo and “slap it on” anything they like without my involvement. In fact, they already broke a previous (website) contract by attemting to have the logo and other design elements reproduced onto t-shirts. Naturally, they came out looking AWFUL. This makes both of us look bad — their corporate image and my reputation. To be fair, however, I don’t think they were aware that they had breached our contract.</p>
    <p>I never said anything about this, except that the t-shirts didn’t look very good and that they’d be lucky to get rid of them. Had they approached me, I would have been glad to design the t-shirts for a modest fee.</p>
    <p>Now that we’re onto designing their vehicles, this whole thing has reared it’s head. I almost feel like I had to force the issue of being involved with creating an appropriate design and use of the logo for the vehicles when they implied they just wanted a digital version to give to thier ‘vehicle guy’ to “slap it on.” </p>
    <p>They don;t have anyone in-house to manage design and the vartious parties who “slap it on” are neither qualified. That’s where I come in — or so I thought.</p>
    <p>This client has profited TREMENDOUSLY from my services over the past two years, and now I get the impression that they feel extorted and would like to get full rights and push me out the door. I don’t know this for sure, but it’s the feeling I get.</p>
    <p>My position is that I generally enjoy working with them and would like to continue to help them develop their visual identity in a logical and consistant manner.</p>
    <p>MY QUESTION(S) are really as regards to the legal issues here and how to respond/discuss this with the client. I’ve never come up against legal/contract question, although I hear it’s not uncommon. I’m inclined to not make concessions without renegotiation and financial compensation, and (at least) developing a standards manual). I think they may not respond well to this. Your feedback and advice is much needed. In addittion, any references to other sources of legal advice as related to design services/rights &amp; ownership/copyrights, etc. is most welcome.</p>
    <p>Kind regards,</p>
    <p> -t</p>
