    html: <p>Those different Font window options are just showing you subsets of possible characters you can add to your font. When you select one of these views, you can build characters in that subset. If you switch the view to a different subset, you can build characters in that subset. Any characters you have already made that are not part of the current subset will be displayed at the bottom of the Font window in the order you created them. (You can change the order in the Index Mode view.)</p>
