    <p>I want to start expanding some of my fonts to include full diacritics, thorn, eth, Cyrillic, and possibly Greek.</p>
    <p>Since I have never done this before, I am unsure how to create a blank Fontlab file which I will use for a template.  When I create a new (blank) file in Fontlab, I can't seem to find the option for ALL these options in one file.  I can get latin and cyrillic, but no greek, or I can get latin and greek but no cyrillic.</p>
    <p>Or maybe I'm just not understanding the Fontlab interface?  After I create a new file, I can flip through the options in the drop down menu at the top of the window--MacOS, ISO, Windows....  So maybe all the blank empty slots for the glyphs ARE there?  Usually when I open a well made font in fontlab I see all the glyphs of the entire font all in one window, that is I don't have to flip through the various OS/ISO settings to see the greek or diacritics, for example.</p>
    <p>How can I get all the glyphs for all these languages all in one "window"? (sorry my terminology is lacking here)</p>
    <p>Thanks, all.</p>
