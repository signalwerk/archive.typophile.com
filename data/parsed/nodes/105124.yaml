    html: |-
      <p>I saved these instructions from an earlier Typophile thread, but not the name of the author, so apologies to him/her for the lack of a credit:</p>
      <p>Select all the glyphs and hit copy. Then paste into a text editor, which will dump all the names with slashes in front of them. Then find/replace all of the slashes with line breaks in Indesign, Textwrangler, etc. After that add a header and you’re done.</p>
      <p>**</p>
      <p>You can always rearrange the glyphs in Index Mode and then Save the Encoding file. Relaunch FontLab and select the new encoding scheme under Names</p>
      <p>In Index mode, you can drag the glyphs around and rearrange them. Once you have an ordering you like, choose Glyph &gt; Glyph Names &gt; Save Encoding. (This is only available in Index mode.)</p>
      <p>By the way, if you want to start with a particular existing encoding before you start rearranging glyphs, switch to Names mode, select the encoding, then choose Glyph &gt; Sort Glyphs &gt; By Encoding. When you go to Index mode, the glyphs will be arranged in this order.</p>
