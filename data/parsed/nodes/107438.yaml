  html: |-
    <p>Hello everyone,<br>
    I've a question about horizontal and vertical stems in FontLab.<br>
    Going to Font Info --&gt; Hinting Settings --&gt; Standard stems (T1 hinting) it is possible to define values for horizontal and vertical font's standard stems.<br>
    But when I'm in a blank Glyph Window is there a way to visualize horizontal and vertical hints based on those values?<br>
    I mean, how can I make those values useful for the designing process of the glyphs?<br>
    Thank you for your help!</p>
