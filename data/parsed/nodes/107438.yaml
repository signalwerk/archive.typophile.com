    html: |-
      <p>Typophile has been down a lot lately, so I think your question has languished.</p>
      <p>AFAIK: Not directly, that I know of. However, you can see stem thicknesses of current stems, by autohinting them (F7). If you then use the option to convert hints to links, the links will dynamically adjust when you make changes to the outlines, to always show the current measurement.</p>
