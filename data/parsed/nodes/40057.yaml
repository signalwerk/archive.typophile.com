      <p>Oh! I see. </p>
      <p>If it was one you would be correct. And you are correct in the sense that - it is one stroke the way we write now. So what you are saying makes sense. But when you make the c as shown in these examples it's actually a two stroke process. First the lower left portion and then the top stroke. You can see the ink overlap which is a clue in this image. You say it before when you said <cite> a small smudge of ink can be seen on top of “c” </cite></p>
      <p>Look also at the o &amp; e too for help seeing it. The o uses the same stroke as the c on the left as does the e.</p>
      <p>This image is bigger so it may make more sense. You will have to scroll it because it doesn't fit the template. Sorry.</p>
      <p>Still, can you see it now?</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/seethec_5179.jpg"></div><p></p>
      <p>But I should point out too - the ct ligature parts are also two. The pen isn't pushed. Only pulled. So maybe it isn't <cite>so</cite> efficient in this case. But the long s &amp; t is! The top of the long s becomes the the downstroke of the t.</p>
