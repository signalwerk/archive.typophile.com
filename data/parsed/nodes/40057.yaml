      <p>There is much coming out of tradition in the craft and the old limitations of hot metal type or, more recently, 8-bit character sets. Today, with OpenType there are a great many ligature possibilities, some of which are not even apparent to the casual reader. Script type, partiiculary joined cursive, may contain dozens of ligated pairs. The connections typically are there to mimic handwriting.<br>
      Many pairs are not seen in all languages in roman faces. The combinations fj ffj fh ffh fb ffb appear in modern large text families with broad Latin language support. Discretionary ligatures like ct and st grew out of calligraphic tradition. They are available in many faces but are rarely used.  Sometimes kerning pairs fit the bill for combinations like ti and ft.</p>
      <p>ChrisL</p>
