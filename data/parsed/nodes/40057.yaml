    html: |-
      <p>Obviously you can lift the pen. Or just a use a font. But... if you are writing and joining letters the "unnnatural" shape as you put it has a purpose I think. If you try it you will see that pulling the line in other directions to the right or diagonally makes the c stop "reading" as a c. Maybe you can find a way. If you do you should show us!</p>
      <p>A related point: It used to be that the s was a long s much of the time. Like this: ſ. Look in an old book from 17XX. Or in the example above. Under "Perfectus". It says "potest". Or rather "potsſt".</p>
      <p>And if you connect it to the t - How would you do that? Exactly. </p>
      <p>And the c to t join followed. As did the st when the long s died out.</p>
      <p>So in some ways the answer to the question is also just "tradition".</p>
      <p>It may seem unnatural to you but then you don't live in the world of the long s. Or use a quill pen.</p>
      <p>I am serious about being interested in your alternatives BTW!</p>
