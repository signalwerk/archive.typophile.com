    <p>I’ve always wondered why only certain combinations of letters have <a href="/wiki/ligature" class="freelinking" rel="nofollow">ligatures</a>, and not others. For example, the “Fi” (Uppercase F and lower case i) combination or for that matter “ft” etc. there are so many instances where one can have ligatures as the letters collide.</p>
    <p>Strangely, I haven’t also understood the use of the “ct” and “st” combinations, here the letters dont collide, yet some fonts provide for these combinations with a very “weird” connection.</p>
    <p>Can anyone please explain these phenomena, and the use of the “ct” and “st” combinations.</p>
    <p>Thanks.</p>
