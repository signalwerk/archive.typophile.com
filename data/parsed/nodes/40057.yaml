      <p>The ct and st combinations are from historical precedent and I always view them as more decorative and less utilitarian. (Many designers overdo them, IMHO, and they are often too distracting to use.)</p>
      <p>Fi should never be needed if the designer has spaced or designed the character correctly. In addition if the typeface is spaced so tightly that it needs an Fi ligature that ligature could end up being confused with an h or another glyph that I'm suddenly blanking on. Same goes for ft. If the letters aren't designed to avoid it that ligature could end up looking like and H.</p>
