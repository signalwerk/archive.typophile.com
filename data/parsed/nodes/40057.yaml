      <p>Eben, I think you've misunderstood, or rather it was I who was not able to communicate properly.</p>
      <p>What I meant was, today when we "write" the "c" and "s" we start from the top, and go to the bottom. By what you have told me, for efficiency in writing fast, and for the connection between ct and st to work, the writer would have to start from the bottom (or lower) part of c and s complete it, do the join and then write the "t" from top to bottom again. It is this way of writing, that I found unnatural as per today's standards.</p>
      <p>In the second image that you've provided, I wonder why the writer has not connected the "c" to the "t" from the bottom like the "a" and the "c" are connected, I think what has happened in the process of connecting the "c" to the "t" from the top, a small smudge of ink can be seen on top of "c".</p>
