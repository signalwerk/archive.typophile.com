      <p><em>How can we use typography to further emphasise the emotional qualities of the written word?</em></p>
      <p>Why would we want to? It seems to me that if you want to employ emotional markup, then you need something other than punctuation as we have inherited it, because punctuation is doing a different and important job: it is marking the <em>structure</em> of text, and thereby helping us to avoid ambiguity of meaning and to communicate thoughts effectively.</p>
      <p>Of course, people use the bits and pieces of typographic punctuation to make emoticons such as ;) but that's using punctuation signs for something other than punctuation. That's fine, but you shouldn't confuse the two things: punctuation, which indicates structure (very precisely), and emoticons, which indicate emotions (very crudely).</p>
