      <p>Thank you for your pointers, sorry for not getting back to you all sooner, I have tonsillitis and a stinking cold right now but the lure of the web is too strong!</p>
      <p>Florian, I don't know of the 'Fisches Nachtgesang' but I have come across the John Harris book in my preliminary research. </p>
      <p>John, maybe we need to move on with English language and try to adapt a new stance towards providing emotion to the written. My head hurts too much right now to think about it in depth but with so many people having so much disregard for the rules of language maybe a system that is made 'easier'(I mean that in a very loose sense) or accessible to everyone, even a universal set of rules. I don't know, it is such a huge subject! </p>
      <p>Emotion cons are an area that could be defined as a way of expressing yourself but then everyone needs to be clued up on every possible combination that exists, I'm not even sure they do enough of a job of getting the point across in some situations. </p>
      <p>Thanks though, I'm off back to my bed with a lemsip and some essays I've just found :)</p>
      <p>Bec</p>
