      <p>Do you know <a href="http://christian-morgenstern.de/dcma/Fisches_Nachtgesang" rel="nofollow">‘Fisches Nachtgesang’</a> [The Night Song of the Fish] by Christian Morgenstern? It is said to be ‘the deepest poem in German language’ …<br>
      ;°)</p>
      <p>And, of course, check out John Harris: <em>Punctuation Personified, Or Pointing Made Easy By Mr. Stops</em>, a charming old children's book. There used to be an online version, but that seems to have disappeared. Still, you can have a look at it via the <a href="http://web.archive.org/web/20070117115231/http://www.make-believe.org/punctuation/" rel="nofollow">wayback machine</a> –&nbsp;unfortunately the text there got black on black; in order to read you have to ‘select all’.</p>
