      <p>Karl Kraus put it a bit more drastic:<br>
      <cite>Ein armseliger Hohn, der sich in Interpunktionen austobt und Rufzeichen, Fragezeichen und Gedankenstriche als Peitschen, Schlingen und Spieße verwendet.</cite></p>
      <p>[A miserable fool, he who exhausts himself on punctuation and uses exclamation marks, question marks and dashes as whips, springes and spears.]</p>
