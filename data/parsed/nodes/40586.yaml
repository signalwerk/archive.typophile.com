    <p>Hi,</p>
    <p>I'm wondering if anyone could point me in the direction of any discussions happening based on punctuation? I've used the search engine/typowiki/resources section of this site and unearthed a thread or two which have been a good insight. </p>
    <p>Google has not been my friend is this research instance, throwing up more pages aimed at how to use it properly as opposed to why we use it, how it could be changed and so forth. I've dug out a fair few of my type books including 'Hart's rules for Compositors and Readers' from the Oxford University press, which in some instances says when setting type leave the problem of punctuation to the author!</p>
    <p>I really want to know as a designer what other people are thinking about punctuation, why it has become so throw away, how can it be changed and adapted to suit our modern ways of communicating? How can we use typography to further emphasise the emotional qualities of the written word? </p>
    <p>It's a research idea I've had rattling around my head since my uni days so I thought I'd come here and see if some could shed some further light on the topic. </p>
    <p>Bec</p>
