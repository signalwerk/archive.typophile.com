  html: "<p>To my colleagues at the Typophile Forums: new graphic, typographic and Hebrew font design from Israel at <a href=\"http://www.ezerdesign.com\" target=\"_top\">http://www.ezerdesign.com</a> <br> <br>Oded Ezer Design Studio's new website now open ...you are invited ! <br> <br>I hope that you'll find the site relaxing, informative and an insight into the Oded Ezer Design Studio and its work. This website was built from the soul, so I hope that by visiting the site, you will use the opportunity to enjoy the creative process. <br> <br>Any comments, positive or negative, are most welcome. <br> <br>The address is <a href=\"http://www.ezerdesign.com\" target=\"_top\">http://www.ezerdesign.com</a></p>"
