    <p>The Corcoran design thesis exhibit (running concurrently with the all-senior exhibit) is on May 7, 2007 at 7pm, and you’re all invited. <a href="https://web.archive.org/web/20080709014133/http://www.jpad.biz/lavinia_sans.html">My thesis will be there</a> (I’ve printed 1,000 of them!) along with 18 others. You can download a PDF invitation at: <a href="https://web.archive.org/web/20080709014133/http://www.jpad.biz/pdfs/seniorexhibition.pdf" title="http://www.jpad.biz/pdfs/seniorexhibition.pdf">http://www.jpad.biz/pdfs/seniorexhibition.pdf</a></p>
