    html: |-
      <p>I meant this particular case of course. The pairing is typically meant for printed material with a lot of text. When you have just two words in a wordmark, it's an entirely different matter. There's no volume to get a general feel of the typeface, there are just individual glyphs. </p>
      <p>The reason they don't pair, in my opinion, is that there's just no visual consistency or relevancy between two lines. It's not a contrast, it's a complete dissonance. It's like trying to pair a banana with a screwdriver. They are great on their own, but they aren't related at all.</p>
      <p>Considering how visually diverse the existing part of the logo is, I think your best bet is not to further complicate things and just stick to the exact same font as INWIZ. There's already too much going on in the top line to add more to it.</p>
      <p>Alternatively, I'd try and simplify the top line by using a regular-width or a narrow version of the INWIZ sans. This could allow for some fancier stuff in the tagline.</p>
      <p>--</p>
      <p>Fellas? Chip in.</p>
