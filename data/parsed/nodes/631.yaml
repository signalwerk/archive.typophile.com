    date_raw: 23 Aug 2003 — 9:22am
    votes: null
    html: "<p>I really like where this has come, and I agree with Joe, you could kill it with too much fussing. That said, here are two observations: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/14644.gif\" alt=\"\"> <br> <br>1. You've got a nice thing going with the thick-to-thin transitions in the p, a, and s. The t-to-e connection still seems a bit fat, and the tail of the e also seems slightly less fluid than the other rest of the letterforms <br> <br>2. There's a little \"bump\" or \"kink\" near the top of the bowl of the e that is a tad distracting. <br> <br>Otherwise I think this is a great solution - well-crafted enough to be taken seriously, while retaining much of the playfullness of your original sketch.</p>"
    html_clean: "<p>I really like where this has come, and I agree with Joe, you could kill it with too much fussing. That said, here are two observations: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/14644.gif\" alt=\"\"> <br> <br>1. You've got a nice thing going with the thick-to-thin transitions in the p, a, and s. The t-to-e connection still seems a bit fat, and the tail of the e also seems slightly less fluid than the other rest of the letterforms <br> <br>2. There's a little \"bump\" or \"kink\" near the top of the bowl of the e that is a tad distracting. <br> <br>Otherwise I think this is a great solution - well-crafted enough to be taken seriously, while retaining much of the playfullness of your original sketch.</p>"
