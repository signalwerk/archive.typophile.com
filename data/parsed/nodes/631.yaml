    date_raw: 9 Aug 2003 — 11:25am
    votes: null
    html: "<p>I have to say, it's much easier to work with now that I have a clear direction. <br> <br>I definately see the Veer resemblence, but I personally like almost everything they do, so I will take that as a compliment. <br> <br>As far as the concept - I'm not really trying to express much (just a bit 'o style) via the logotype. I want to start with something solid and and eschew the 'cut'n'paste' aesthetic through the design of other identity materials... For example the business card is just a thick piece of card, with the logo and  information \"pasted\" on via a sticker. <br> <br>Anyways, I've tweaked all the letters and adjusted the \"tracking\"... I'm worried it's getting too thin, but it seems to gain perceived weight in print, and I guess I can always add a black stroke to it. <br> <br>Does the \"p\" look too slanted now? How's the \"poste\" effect? <br> <br>Before &amp; After: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13991.gif\" alt=\"\"></p>"
    html_clean: "<p>I have to say, it's much easier to work with now that I have a clear direction. <br> <br>I definately see the Veer resemblence, but I personally like almost everything they do, so I will take that as a compliment. <br> <br>As far as the concept - I'm not really trying to express much (just a bit 'o style) via the logotype. I want to start with something solid and and eschew the 'cut'n'paste' aesthetic through the design of other identity materials... For example the business card is just a thick piece of card, with the logo and  information \"pasted\" on via a sticker. <br> <br>Anyways, I've tweaked all the letters and adjusted the \"tracking\"... I'm worried it's getting too thin, but it seems to gain perceived weight in print, and I guess I can always add a black stroke to it. <br> <br>Does the \"p\" look too slanted now? How's the \"poste\" effect? <br> <br>Before &amp; After: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13991.gif\" alt=\"\"></p>"
