    html: |-
      <p>Nina,</p>
      <p>&gt; I don’t have a reason to ask, other than curiosity...</p>
      <p>the curiosity is a good reason.  if you like the subject see the book by Claude Mediavilla --  Histoire de la calligraphie française (Paris&nbsp;: 2006); his website -- <a href="http://claudemediavilla.com/index.php?lang=fr" title="http://claudemediavilla.com/index.php?lang=fr">http://claudemediavilla.com/index.php?lang=fr</a> </p>
      <p>if you have time  and want to understand the whole Financiere style read the book by John Salmon -- Renaissance and revolt: Essays in the intellectual and social history of early modern France.</p>
      <p>&gt; So is that just a stylistic variant?</p>
      <p>why not; look for the work by Louis Senault, Claude A. Berey and you'll find the letter "e" that looks like "c"; "R"  that looks like "v" and more and more....<br>
      Berey:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/berey_4293.jpg"></div><p></p>
      <p>&gt; ... a completely foreign character!</p>
      <p>maybe better to say/ask -- suitable for modern use? for example:<br>
      1. Insular half-unical (northern England, Ireland) -- the letter "g" dosen't look like the modern "g"<br>
      2. Beneventan style, 8th century (centered on the Benedictine monastery of Monte Cassino) --  you'll find the half "r" (see your sample), the letter "e" is tall; rising above the x-height and looks like modern ampersand.<br>
      3. Luxeuil style, 7th century (the monastery at Luxeuil in France) -- the letter "a" looks like "u" (quite a lot of ligatures and maybe since of that we see the "foreign character")</p>
