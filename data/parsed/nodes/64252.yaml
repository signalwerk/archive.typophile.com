    html: |-
      <p>What a peculiar piece of typography.<br>
      It has a lot of layout problems which seem to exist purely to show off contextual alternates.<br>
      For instance, the collision of the "P" in Paris with the ascender  above could have been avoided by setting "de" earlier in the line in "normal" type, or by using a swashless terminal "e" in "entrée". And yet a special form of "f" with no descender is used in "fondeur".</p>
      <p>But as this card is targeted at printers, I would assume this is typographic humour, a brazen display of affectation--for those in the know. We got these sorts, and we're gonna use 'em!</p>
    html_clean: |-
