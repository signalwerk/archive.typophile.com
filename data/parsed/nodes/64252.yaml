    html: |-
      <p>Thank you guys. Thomas, that is impressive. The "s" must surely be one of the most widely varied letters in history no?</p>
      <p>David – I thought the Bâtarde Italienne was sort of a precursor to the Bâtarde Coulée? It's less regularized, less connected, and note the absence of [closed] loops on ascenders, which seems rather common in the Bâtarde Coulée. But I might well be mistaken.<br>
      An "S" you say? Funky. So is that just a stylistic variant?<br>
      (BTW, I don't have a reason to ask, other than curiosity – that just looks like a completely foreign character!)</p>
