      <p>There are so damn many bugs in InDesign -- including CS6, which seems to have added more than it fixed --  it is borderline unusable. Problem is, for simultaneous print/epub work, it is currently also almost necessary.</p>
      <p>I'm with the guy who said  "NOOOOO." Well, like PageMaker and Quark, InDesign will eventually be replaced. Soon, I hope, and by someone who views typesetting software as a tool, one to be used by skilled craftsman, not a coffee grinder for text so you can have kewl graphics. XeTeX looks more &amp; more attractive.</p>
      <p>One thing that would help InDesign would be if there could be a plug in so the H&amp;J routines used the normal TeX routines instead of any of the "Adobe paragraph composers." I get so tired of InDesign not breaking the exact same text the same way in different proof stages. We have to run pdf-to-pdf comparisons at every proof stage, just to catch unwanted text reflow, which occurs with paragraphs that had no alterations. Publishers just don't put up with that kind of change in the text, so we have to catch it. So far, we've only had to pay for the reprinting of one book, but the time spent checking is not insignificant...</p>
      <p>I'm sure they will promise better bug fixing in the cloud versions, pardon my skepticism. There are bugs we reported &amp; were acknowledged with CS2 that still remain to this day.</p>
      <p>Edit:</p>
      <blockquote><p>but INDD documents are not readable by older versions</p></blockquote>
      <p>For archiving, save an idml  format file, too. Maybe .idml is what you should transmit as an "application" file, too. Except the text won't compose the same...</p>
