      <p>Just wonder how Adobe will manage continuous upgrades for InDesign. New application versions are not an issue to PSD or AI files, but INDD documents are not readable by older versions –and a similar issue arrives regarding plugins. Imagine a workflow broken or a production error because you used InDesign CC from September 9th while the printer was using the August 28th version. And then Adobe releases an update in September 17th changing the tool introduced in July 3rd but disabled due to an error in August 11th version, which are not compatible with plugin Xthing 9.9 so you downgrade to Xthing 9.4 and... Well, computers are here to make life easier.</p>
      <p>This may seem a bit dramatic, but Muse is experiencing such a quick versioning.</p>
      <p>Besides the marketing empty words, InDesign CC will offer no relevant addition except native 64-bit structure. Adobe really needs subscription revenues when their upgrades offer “modern black UI” as a great improvement. Better long document management? Maybe in InDesign CC7, or CS13, aka version 16.</p>
