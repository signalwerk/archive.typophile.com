      <p>“[The Adobe CEO] insists that the cost for Adobe CC is now lower for ‘any customer.’ Those costs are now more predictable, he added.”</p>
      <p>That’s simply not true. I, along with most designers I know, only upgrade when necessary. I skipped CS4 and CS5 before moving to CS6, and even that upgrade was more of a convenience than a necessity. While he says it’s not, this move by Adobe is all about the money and will ultimately cost me a lot more. I do see a silver lining with that though; it will cull the hobbyists from the market. </p>
      <p><em>&gt;What features need to be added to Quark Xpress 9 or Microsoft Publisher 2013 before they could become alternatives?</em></p>
      <p>That’s a very steep hill to climb. Adobe has done a masterful job of creating  brilliant software products while at the same time eliminating competition. The purchase of Macromedia to kill Freehand and the creation of InDesign to kill Quark were major coups. What stands out more than anything is the integration of product features. Quark and/or Publisher would need to integrate with fully featured vector and raster editors such as Photoshop and Illustrator. They would need a ubiquitous file format for export like Adobe’s PDF.  There’s also the learning curve. I’ve learned and forgotten multiple versions of PageMaker, Quark, Freehand, etc. The switch to new software is a serious drain on my increasingly limited cognitive resources. </p>
      <p>That’s the rub. Adobe wouldn’t dare do this move to the subscription model if there was a valid competing software product. They are being a bully because they know there’s no one to lose marketshare to.</p>
