      <p>@hrant:<br>
      <cite>to ban public ownership of companies (or at least limit it to less than 50%)</cite></p>
      <p>While I don't want to derail this thread into a political discussion, I do need to note here why this is a completely unrealistic suggestion, however meritorious it may seem.</p>
      <p>The reason we have laws that create things like limited liability corporations is because nations needed to foster the growth of large enterprises that could build larger wooden sailing ships than those available to other nations. Flash forward from the rivalry between Britain and Holland to the present day of tanks, airplanes, submarines, and intercontinental ballistic missiles and the nuclear warheads that adorn them, and you can see why anything that throttled corporate growth would be perceived as conflicting with national survival.</p>
