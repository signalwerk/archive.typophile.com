      <p>@charles ellertson:</p>
      <p>Although I'm not a professional investor, and thus some of that article you pointed to goes over my head, I do agree that return on assets is a very fundamental measure.</p>
      <p>If I'm setting up a small business - say a fast food restaurant - return on assets is really what I'm interested in, although it likely will be the same as ROI. Of course, though, how much of my own hard work goes into the business for each dollar I make will also matter.</p>
      <p>So in the case of a company like IBM or Apple, return on assets says how profitable the company is in the "real world", while ROI is pushed up or down by the effect of the whims of the stock market on share price.</p>
      <p>But if I'm playing the stock market, those whims affect me; ROA is a fundamental which guides me to the long-term value of an investment, but ROI is my direct goal.</p>
      <p>As it happens, I've been trying to find out what the Greek version of the Baudot/Murray/ITA-2/5-level teletype code is... and that led me to find out that the Greek telecommunications company OTE is in jeopardy, despite being profitable and well managed - because it has the misfortune of being located in a country whose people may end up not being able to afford to pay their phone bills (the impact of the Greek financial situation on them is actually more complicated than that, this is a gross oversimplification) - and so we see that the markets are not "fair", even if they are in one sense the most fair thing there is.</p>
