      <blockquote><p>it will be sufficient for consumers to aggressively explore alternatives to their products.</p></blockquote>
      <p>But that still costs the <em>consumer</em> time/money...</p>
      <p>Trying to be <em>relatively</em> realistic here, I think one viable way to attenuate damage from Capitalism (because that's really all we're doing with things like anti-trust laws) is to ban public ownership of companies (or at least limit it to less than 50%). When the owner of something only cares about the money it brings, with no effective concern for what it brings to society, it can only hurt the long-term viability of a society. Here's a specific example from our world: when Multiple Master technology couldn't be a cash cow, it got axed; it could have made some money if targeted to a niche (at a higher price), but it couldn't make enough money fast enough for shareholders to be able to buy their yachts <em>now,</em> dammit! Culture lost out.</p>
      <p>hhp</p>
