      <p>My point is that in the old days when I dropped off logo slicks to a client, the secretary didn’t have a set of Rotring technical pens, french curves, and triangles in her desk drawer to tinker with my work. As it is now, she has an old version of Illustrator and feels compelled to tinker with my work before I’ve left the parking lot. These people don’t make their livelihood from design, don’t invest the time to learn the tools and techniques, yet have the impression that access to the tools alone is all that matters to be a professional designer. It wasn’t that way with pen and ink. That impression has become pervasive and has become a chore to counter. </p>
      <p>It seems to me that in time the subscription mode for high-end design tools will eventually limit access to those willing to dedicate the time and resources needed to adequately learn the tools and techniques, i.e., people who spend all day, every day, making their livelihood from design. I see that as a good thing for the graphic design profession.</p>
