    <p>I knew this was coming, but it's here far sooner than I thought it would be. Adobe moves to the cloud only and disconnects those of us who want to work with our feet on the ground:</p>
    <p><a class="freelinking external" href="http://www.theregister.co.uk/2013/05/06/adobe_kills_creative_suite_for_cloud/" rel="nofollow">http://www.theregister.co.uk/2013/05/06/adobe_kills_creative_suite_for_cloud</a></p>
    <p>And unfortunately there's no alternative.</p>
