      <p><em>I said, "I do see a silver lining with that though; it will cull the hobbyists from the market."</em></p>
      <p><em>Quadibloc asked, "Why is that a good thing?"</em></p>
      <p>I see it as a good thing when people who want to use professional software, and call themselves professional, have to invest in the professional resources to do so. </p>
      <p>Back in the days of rubylith, wax, and photo-lettering, people didn’t dabble in graphic design. That’s not to say that graphic design back then was better. It wasn’t. The abilities brought by  software like Adobe’s Creative Suite have dramatically improved the possibilities and results of graphic design. However, it was strictly a professional endeavor back then. There wasn’t much in the way of hacking around on a whim and calling it professional graphic design. </p>
      <p>I see far more hack work these days. As it is now, I’ve seen way too many people who wound up with professional software with little or no expense and instantly declare themselves graphic designers — just based on possession of the software. I have too many stories of how that’s diminished our business to list here. Adobe’s move to the subscription model will ultimately cost me more, but will put an end to those dabblers. It’s put up or shut up mode from here on out. You either put up the monthly fee knowing you’ll get the return, or you stay out of professional graphic design and leave it to the pros. </p>
      <p>Is that a bad thing?</p>
