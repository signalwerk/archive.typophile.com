    html: |-
      <blockquote><p>InDesign has a nasty habit of occasionally recalculating line breaks on a paragraph in which there has been *no* editorial change, under certain [mysterious] circumstances.</p></blockquote>
      <p>Yes. You learn to look at potential trouble spots -- across page boundaries (text frames), wraparounds, etc., but it can occur anywhere, anytime.</p>
      <p>I had one recently, about a 5-line paragraph, middle of the page, where an editor changed (say) the words *if only* to *only if*. This in the middle of a line, in the middle of the paragraph. InDesign recomposed the paragraph, making different hyphenation decisions. But at least it happened in a paragraph being worked on.</p>
      <p>My guess is what will increase with upgrades is "features," not bug fixes. The thing about "features" is one group -- say book compositors -- doesn't give a hoot (not my chosen word), but the complexity of the program grows, and at some point, the program stops working correctly. Here's another one from CS6: After you use "fit frame to content" a number of times in a document, it stops working. Rebooting doesn't help, it's just a gone feature in that document from then on.</p>
      <p>* * *</p>
      <p>As to the cloud-based system, perhaps some of our concerns are not relevant. This from my business partner, who understands such things</p>
      <blockquote><p>I don't think the switch is going to change anything. Last year, they stopped selling upgrades in boxes and I had to buy/download online. Now they have discarded the idea of upgrades altogether.</p>
      <p>With creative cloud, you still have to download and install the software. You still have to update, which now includes feature upgrades as well (I expect, kind of like Gmail, when things would change from time to time).</p></blockquote>
      <p>So, Adobe gets rid of any shipping costs, and regularizes their revenue stream. A real bummer for someone who just spent $700 buying a new copy, though. And for those of us who like to pay once, with a check...</p>
