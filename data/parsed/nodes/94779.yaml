  html: |-
    <p>Daphne was developed from a text written with a broad nib pen. A large number of calligraphic swashes are available for the strong and sharp-edged figures of Daphne Expert. They can be added to the letters via OpenType feature. Because many swashes fit on different characters, the combinations possible are endless. Alternate and complete swash characters offer additional options. An unique application for designers with a calligraphic instinct.</p>
    <p><a href="http://www.typemanufactur.com" title="www.typemanufactur.com">www.typemanufactur.com</a><br>
    <a href="http://www.facebook.com/typemanufactur" title="www.facebook.com/typemanufactur">www.facebook.com/typemanufactur</a></p>
