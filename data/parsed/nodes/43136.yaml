    html: |-
      <p>At first I was confused, but then I got it, so I think it works. The only one that's a bit ambiguous to me is the "* selection of lovely seasonal fresh veg PUDDING * ice cream with chocolate sauce". Is this three items or two items?  If three, "PUDDING" is missing an asterisk. If two, is it "veg PUDDING" or "PUDDING ice cream?" This needs to be clearer.</p>
      <p>The "ice cream sauce" and "with chocolate" seem to be two different elements to me. It looks like "ice cream sauce" and "mousse gateaux with chocolate wedding cake". I'd tuck the "with chocolate" in between "ice cream" and "sauce" to be more consistent with the other items on the menu.</p>
      <p>Assuming "PUDDING" is its own item, I'd set "ice cream with chocolate sauce" (in a single column) in pink and "wedding cake" in white to help with clarity.</p>
      <p>I agree about the 'v' and 'w' - it reads as "roedding cake," "ice cream roith chocolate sauce".</p>
      <p>Otherwise, this looks really cool :-)</p>
      <p> - Lex</p>
