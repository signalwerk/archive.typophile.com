  html: |-
    <p>I've seen this type many times in my youth on TV station promos and now here's a hard copy  I found on this  <a class="freelinking external" href="http://deniskitchen.com/Merchant2/merchant.mvc?Screen=PROD&amp;Product_Code=PO_RC.ordinary&amp;Category_Code=PO" rel="nofollow">Robert Crumb poster</a>. I went through thousands of online fonts (which isn't a <em>chore</em>, exactly) and uploaded it to the various automated type ID sites but am still without clue. I've also seen it a lighter variant.</p>
    <p>Thanks in advance. You guys are great.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/phono_5514.jpg"></div><p></p>
