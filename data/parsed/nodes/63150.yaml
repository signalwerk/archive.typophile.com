    <p>Hi there,</p>
    <p>sometimes in vintage style show bills or packaging, you see these self-contained words, generally "and", "with", "to", etc.</p>
    <p>I have attached an example, which is circled within the poster.</p>
    <p>Does anyone know of a modern font specialising in this type of thing? I found one once, but can't remember the name. Plus, I don't know what the correct term for these "self-contained words" is, which makes searching difficult.</p>
    <p>Would appreciate help.</p>
    <p>Thanks</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Intern_Poster_4175.jpg"></div><p></p>
