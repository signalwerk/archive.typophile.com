    html: |-
      <p>"I have a client with a Christian-based business."</p>
      <p>That can mean one of two things, IMHO:</p>
      <p>a) they are a business related to the church industry (pews, bibles, hymnals, choir robes, etc.)</p>
      <p>b) they are a business completely unrelated to the church but think that saying they are christian will attract other christian's to hire them.</p>
      <p>with a), obviously, you can go nuts with religious iconography and fonts that are in the spirit of it. </p>
      <p>with b), though, unless they are wanting to be EXCLUSIVELY targetting other christians, I'd say you want to stay away from anthing too literal to avoid annoying those that aren't looking for 'christian based' companies.</p>
      <p>I also have to smile after visiting Nick's link, and also would agree that Beorcana is quite nice.</p>
