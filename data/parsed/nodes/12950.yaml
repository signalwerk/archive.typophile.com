    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Laurie McCanna</strong></p>
    <p>Designed several faces for the <a href="/wiki/Nimx" class="freelinking" rel="nofollow">Nimx</a> foundry in the early 1990s. Laurie has been the proprietor of <a href="http://www.mccannas.com/" rel="nofollow">Laurie McCanna's Free Art Site</a> since 1995 - providing inspiration, tools, tutorials. and recommended reading for designers and publishers. (Actually, the site has quite a bit more than free art.) Some of the typefaces designed by Laurie include Nimx Jitterbug and Nimx Holiday Mix, a collection of festive icons. </p>
    <p>Website:</p>
    <p><a href="http://www.mccannas.com/" title="http://www.mccannas.com/">http://www.mccannas.com/</a></p>
    <p>Identifont profile:</p>
    <p><a href="http://www.identifont.com/show?8LO" title="http://www.identifont.com/show?8LO">http://www.identifont.com/show?8LO</a></p>
