    <p>Hello,</p>
    <p>and sorry for opening yet another thread. </p>
    <p>I am running a web design business and my current logo can be seen here: <a class="freelinking external" href="http://www.designbits.de" rel="nofollow">http://www.designbits.de</a></p>
    <p>I am not happy with it however, and this is the new idea I just came up with:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/designbits_6465.png"></div><p></p>
    <p>The concept isn't radically new, I know, but it fits the purpose very well IMHO.</p>
    <p>What do you think?</p>
    <p>Thanks for any feedback...</p>
