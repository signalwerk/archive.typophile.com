    html: |-
      <p>Many of the best and most successful type designers, including Matthew Carter, have indicated the importance to them of the design ’brief’: the purpose and use of the planned font. Carter has said in a recent New Yorker article that if you asked him to design a font, without any further specification, the paper or screen would still be blank in another two weeks. </p>
      <p>However, the brief need not be purely utilitarian. The goals can be aesthetic as well.</p>
