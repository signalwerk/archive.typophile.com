  - id: 108955
    user: 762
    date: 2006-02-17T13:51:00
    date_raw: 17.Feb.2006 1.51pm
    votes: null
    html: <p>Once when I posted a font for the critique section here the most valuable question or comment was, “what is the type to be used for,” i.e., book text, display for books, book covers, poster display, whatever, and I didn’t have an answer. As William Berkson points out, in the case of Matthew Carter, or most likely many others as well, the design “brief” is obviously important. I didn’t have an answer, although I knew where the design came from, what motivated me to design the font in the first place. I think a very good source for information on the purposes of font design, that is, design with an end in mind, based as it were on a design brief, is Frederic Goudy’s “Goudy’s Type Designs.” He was very clear on what he was doing and why and he explains his ideas well.</p>
