    html: <p>The Eras released by Adobe in the late eighties included two versions--the normal, slightly slanted version and an upright version. The upright version was intended for low-res (300 dpi) laser printers that would have noticeable jaggies on the slight angles otherwise. I don't know if the non-slanted version is still available, but that may be what they are using.</p>
