    <p>Hi everyone,</p>
    <p>My first post and I'm after help already.</p>
    <p>My client's corporate style guide denotes Eras as their main typeface. So I load up our copy of ITC Eras only to notice that the style guide's version does not have that slight slant Eras is known for.</p>
    <p>Does a 'non-slanted' version of Eras exist? I've looked around on myfonts and linotype with no luck. Could it be that I'm being tricked by a sneaky modified version that only exists on a CD at the bottom of my client's desk?</p>
    <p>Any help would be laaarvely.</p>
    <p>Andrew.</p>
