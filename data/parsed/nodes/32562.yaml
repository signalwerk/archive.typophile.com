      <p>Note in folder of 1991 Adobe Copyright version of ITC Eras<br>
      A NOTE ABOUT USING ITC ERAS ON PostScript TYPESETTERS:</p>
      <p>		For best results on PostScript® Typesetters, ITC Eras® should be used at resolutions of 1270 lines per inch or greater.  At this resolution the highly readable face shows the distinctive, slightly cursive letterforms designed by Albert Boton and Albert Hollenstein.  At resolutions below 600 lines per inch, the printer uses a slightly modified version of the design in which the characters appear upright, but maintain the distinctive features of a large x-height, broad curves, open counters, and sharp angles.</p>
      <p>Adobe and PostScript are registered trademarks of Adobe Systems Incorporated registered in the U.S.A.  ITC Eras is a registered trademark of International Typeface Corporation.</p>
