  html: <p>Hello, Its my first time here very exciting. I was making this logo personally I dont like it but I am not sure if I dont like it because its for me considering we are our worst critics so I was wondering what you thought about it or if you can make any modifications of ideas youve, feel free. I was thinking in making it a lil stronger... <br> <br><img src="http://www.typophile.com/forums/messages/4100/34336.gif" alt="Logo"> <br> <br> <br>Its for a Wireless Internet Service Provider Red means Network in spanish and the W stands for Wireless.</p>
