    html: <p>Hi Benjamin, I'm also new here. Seems like a nice place. <br> <br>I think the logo has potential, I like how the connected cells make up a W, perhaps the strokes should be slightly thicker as it could cause problems at low resolutions. Also I'm not keen on the typeface, I think it needs something stronger to go with that logo, maybe a really simple sans serif?</p>
