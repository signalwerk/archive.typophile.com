      <p>I agree with you about using a serif for body text, for reasons of ease of reading. This is a topic of recurring debate on Typophile, <a class="freelinking external" href="http://typophile.com/node/86581" rel="nofollow">the most recent thread being here</a>. </p>
      <p>In my biased opinion, <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">an old style serif</a> gives the most comfortable read. </p>
      <p>But you may feel that a more contemporary mood goes with your topic, in which case you might consider <a class="freelinking external" href="http://www.typotheque.com/fonts" rel="nofollow">Fedra Serif and Sans</a>. The sans in lighter weights to me has a stylish architectural feel, which could work nicely for headings.</p>
