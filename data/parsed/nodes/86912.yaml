    <p>Here comes the time for an important design decision – choosing the right font for the main body of my ~6000 word piece of writing – and I'm not really sure where to start.</p>
    <p>The working title is "The Many Faces of a City", which is unlikely to change; and it basically looks at the relationship between type and city culture. Obviously the dilemma is I can't hand in a piece of about typography set in bad type. Even though the main points of it cover contemporary issues, I'm thinking that I should still stick to the traditions of using a serif for ease of reading, unless anyone can reason otherwise? </p>
    <p>One that I am thinking of is Utopia, since it just has a good rhythm and of course the content should do the talking rather than anything too extravagant. I'm definitely open for suggestions though, hence my being here, so please share your thoughts. Thanks.</p>
