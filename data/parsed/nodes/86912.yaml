      <p>Thanks for the reply, Celeste. In terms of the functional criteria, non-lining figures are quite crucial for my content. Small caps and uncommon diacritics are not so important. I'd just a character set covering basic latin glyphs. </p>
      <p>That's a good point about the sans serif, in which case do you have any suggestions on ones which work well in long text? I forgot to mention earlier but I am willing to pay for a good font, just so long as it doesn't completely break the bank.</p>
