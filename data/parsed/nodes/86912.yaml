      <p>Hello Vicke<br>
      In choosing a typeface for your dissertation, think first of functional criteria : do you need old-style figures ? small caps ? uncommon diacritics for foreign names ?</p>
      <p>The distinction between serif and sans-serif is not that important in terms of readability, in my opinion : you can easily compensate for the lack of serifs by setting a sans-serif with a little extra leading.</p>
