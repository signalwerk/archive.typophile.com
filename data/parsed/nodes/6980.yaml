    html: <p>Ray's Silentina appears to be based partly on an old BB&amp;S face called Pastel. I learned about Pastel when a guy contacted me a year or two ago wanting to know what font was used for the intertitles in a particular film he was restoring. Silentina Film matches the intertitles this guy showed me pretty well. The main difference from Pastel is in the caps and punctuation.</p>
