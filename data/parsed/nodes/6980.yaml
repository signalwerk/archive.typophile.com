    date: 2004-10-05T09:59:00
    date_raw: 5 Oct 2004 — 9:59am
    votes: null
    html: <p>I'm currently working on titling a silent film myself, so I've been studying the various types used. Silentina is an excellent match for the type which was commonly used, but there were others. I've seen Parsons and Hunt Speedball lettering used often as well. Camelot Oldstyle is also an excellent candidate, as well as the Meyer and Cantoria already mentioned. Some, if not many, silent films had hand-lettered titles, often done in the style of Fred Cooper.</p>
