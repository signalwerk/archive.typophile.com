  html: |-
    <p>1. Do you know the origin and date of creation of the <strong>bold</strong> style?<br>
    I read it was dated XVIth century. I don't know the precise date and who used to initiate it?<br>
    2. Apart from the creation of <em>italic</em> as a specific typeface by Alde Manuce and Francesco Griffo in the very beginning of XVIth century, when was <em>italic</em> first used as a way of highlighting a reference or a single word inside a paragraph?</p>
    <p>Thanks.</p>
