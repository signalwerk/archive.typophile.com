  html: |-
    <p>Hello,<br>
    I am working on a typeface and I am wondering which classification it could possibly be? I don’t know if you are familiar with the DIN 16518 classification <a href="http://de.wikipedia.org/wiki/DIN_16518" title="http://de.wikipedia.org/wiki/DIN_16518">http://de.wikipedia.org/wiki/DIN_16518</a> or/and any other ones? Are they any good anyhow? How would you describe this attached one? I am tending to come up with something like "Serifenlose  Klassizistische Antiqua" which could be translated as serifless neo-classical antiqua. :)<br>
    Thanks!<br>
    /T</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Example_5869.gif"></div><p></p>
