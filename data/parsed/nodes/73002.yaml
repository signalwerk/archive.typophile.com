    html: |-
      <p>I wouldn’t spend too much time thinking about classifications, at least not until the work is complete.</p>
      <p>The old DIN classification would probably throw this into the »Antiqua-Varianten« pot;<br>
      in German, you could indeed call it a serifenlose klassizistische Antiqua</p>
      <p>This might be of interest to you:</p>
      <p><a href="http://www.typolexikon.de/s/index.html" title="http://www.typolexikon.de/s/index.html">http://www.typolexikon.de/s/index.html</a>   &gt;see »Schriftklassifikation«</p>
      <p>It looks good btw!</p>
