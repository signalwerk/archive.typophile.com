      <p><em>The Uncle Sam posters where they say WE WANT YOU for the war? Were they pursuasive enough to get everyone going?</em></p>
      <p>This image and slogan, and others like it, were copied from this <a href="http://upload.wikimedia.org/wikipedia/commons/2/2a/Kitchener-Britons.jpg" rel="nofollow">British original</a>, depicting Lord Kitchener, then head of the British armed forces. The Uncle Sam version is graphically more sophisticated, particularly in its use of colour, but I think ultimately less powerful for using an imaginary representation of the nation rather than a real man (with a real moustache!).</p>
      <p>No, these posters were not persuasive enough to get everyone going. Both countries had to introduce conscription.</p>
