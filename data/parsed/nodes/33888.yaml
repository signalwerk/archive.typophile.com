      <p>Paul, if we were allowed to rate answers - I'd give yours a 10+.</p>
      <p>Meanwhile, one of the most successful advertising campaigns EVER in the United States was for Piels beer. That's right - the beer that tastes like crap. Fortunately, good sense followed after everyone tasted it, and knew it was crap. (But working my way as a waitress in a Steak &amp; Brew - all beer was crap to me!!! LOL) Comedians Bob &amp; Ray (oh my, you are probably too young to even know about them!) were hired for spot announcements and commercials - in fact, I don't have to write about it - someone did that for on on Wikipedia -- over here: <a href="http://en.wikipedia.org/wiki/Piels_Beer" title="http://en.wikipedia.org/wiki/Piels_Beer">http://en.wikipedia.org/wiki/Piels_Beer</a>  -- now that was strength in advertising...</p>
      <p>As for campaigns that I've enjoyed<br>
      1. Chivas Regal - a photo of a photostudio table that was empty - and a notice that it was too good to waste.<br>
      2. Fred and Ginger in a dance pose - and the caption - remember when all you needed was talent.</p>
      <p>In recent years - I'd say Budweiser. But I may be prejudice -- it was one of my neighbors who came up with that one.</p>
      <p>Or that EOS (?) car in Europe - those television spots are incredible. Though Bentley has been cute lately with the slogan "For When Your Penis Is Just Too Small" -- LOL</p>
      <p>If you can get 10% of the population to try your product because of your campaign - then you have truly had a successful run.</p>
