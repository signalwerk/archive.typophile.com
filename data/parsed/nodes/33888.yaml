      <p>Coca—Cola wins, although I don’t see the company as having different campaigns as opposed to one insane and unyielding effort to blanket the world in marketing. From what I’ve read that company is barely able to quantify the success or failure of individual ads or series of ads because there is literally too much Coke advertising to track it all anymore. As I pointed out in one of your other threads, Coke advertising is the only product campaign to ever near the level of placement that a true propaganda campaign requires, and that’s tough to do.</p>
      <p>Another great series of campaigns are the ones that the (American) National Football League did in the 1960s and 1970s to sell advertising to businesses. Those turned the NFL from a scruffy underdog into an indomitable juggernaut, and many people are not aware that they even existed. I don’t know if you can get access to them in the UK, but NFL Films did some great films for the NFL that really broke a lot of new ground in terms of sounds an cinematography.</p>
