      <p>If you’re looking for persuasive propaganda, look at massive campaign in against the Germans that led to US involvement in World War I. The government and the media worked most of the nation up into a fury, ready to fight against the Hun, who were clearly planning to destroy western civilization. Also look into the anti-Japanese campaigns of World War II; those did such a good job of convincing Americans that Japanese men were buck-toothed, violent, psychopathic rapists that the USA had to launch more subtle campaigns after the war to convince Americans that Japanese men were actually effeminate, weak, and poorly endowed. </p>
