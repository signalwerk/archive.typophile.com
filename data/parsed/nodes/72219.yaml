    <p>Hi guys,<br>
    I am new to this forum, but I have been reading and learning as an anonymous visitor for quite a while. Thank you, guys, for letting your awesome expertise be available to dilettantes like me! </p>
    <p>Here's my first question:</p>
    <p>Do any of you know any good examples of the use of Compacta. I recently used it for a project, after having researched which font to use for a few months, and can't entirely stop. Here's what triggered my use of the font, a cover I spotted while the camera trucked over a magazine rack in Jean-Luc Godard's "Sympathy for the Devil" (1968).</p><div class="imageWrap"><img src="http://typophile.com/files/sympathy-for-the-devil-Jean-Luc-Goddard-590_5874.jpg"></div><p></p>
