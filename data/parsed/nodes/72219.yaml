      <p>And then there's this book cover from 1965. The words "Sexual Fetish" is, I believe, Compacta.</p><div class="imageWrap"><img src="http://typophile.com/files/the sexual fetish front_3821.jpg"></div><p></p>
      <p>(By the way, the "Coming of Age In Samoa" book cover above is from 1963, so it seems they put that typeface to work right away! As far as I'm able to research it, the typeface is from the same year.)</p>
      <p>I wonder if anybody has any more info (more than the little I can find online,) on the typeface designer Fred Lambert, and the original Letraset font.</p>
