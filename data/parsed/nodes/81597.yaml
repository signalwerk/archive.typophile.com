  html: |-
    <p>This is my first attempt at designing a (very rudimentary) typeface. </p>
    <p>I've used a simple system where each letter is based on the letter "o" – although I'm aware that such a rigid approach is problematic to say the least. (I've tweaked only a few letters so far.) </p>
    <p>All feedback on further alterations I need to consider, etc, would be much appreciated, thanks.</p>
