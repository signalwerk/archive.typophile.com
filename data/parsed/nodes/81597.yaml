      <p>Thanks again for the feedback: this is exactly the sort of help I was hoping for. I don't really understand how one makes decisions about glyph width, etc, etc. Are there specific rules? Is it done purely by eye?</p>
      <p>I'd be happy to sacrifice the rigidity of the geometric system in an attempt to create a much more subtle typeface, although I don't want to lose the overall geometric feel. I will try making some alterations and upload the results soon.</p>
