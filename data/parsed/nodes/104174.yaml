    html: |-
      <p>Two quick clarifications. I believe the lower level DirectWrite APIs give the developer the ability to define their own palette colors. Secondly the Segoe UI Emoji font in the Windows 8.1 Preview includes two palettes, one for when the emoji are displayed on a dark background (eg. the touch keyboard key caps) and one used when they are displayed on a light background.  But as with many font related features, building UI and mark up to expose them is the hardest part.</p>
      <p>For traditional chromatic fonts, each layer (color) could also be exposed as separate, distinct stylistic sets, which would provide the level of customization needed by the high-end professionals. </p>
      <p>Cheers, Si</p>
