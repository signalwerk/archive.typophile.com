  html: |-
    <p>Cross-posting this message from the OpenType / MPEG Open Font Format lists. </p>
    <blockquote><p>
    Dear OpenType /MPEG OFF List members,</p>
    <p>Today at the Microsoft //build conference in San Francisco,  Dan McLachlan of our Graphics team will talk about Windows 8.1 approach to color fonts. We'd like to thank P22, Monotype, The Font Bureau and FontFont for providing us with font data that we were able to use to test this approach.</p>
    <p>Our implementation uses a base glyph for reference, which would be used for non-color situations. A data structure, implemented as a new 'COLR' table in OpenType, breaks down the base glyph into a separate set of glyphs, each with its own z-order and single color reference. The color references are handled has palette indices, with a separate table, 'CPAL' in OpenType that resolves the RGBA colors actually used for the glyph.</p>
    <p>We plan to submit documentation on this approach for standardization through the ISO MPEG process (for inclusion in the Open Font Format) within the next few weeks. However, if you'd like to see the approach in practice you can download the Windows 8.1 Preview and see a color font (Segoe UI Emoji) used on the touch enabled keyboard.</p>
    <p>I'll also be giving a talk at TypeCon on this, hope to see some of you there.</p>
    <p>Thanks, Michelle<br>
    </p></blockquote>
    <p>A video of the session should be posted here at some point... <a href="http://channel9.msdn.com/Events/Build/2013/3-191" title="http://channel9.msdn.com/Events/Build/2013/3-191">http://channel9.msdn.com/Events/Build/2013/3-191</a>  </p>
    <p>Cheers, Si</p>
