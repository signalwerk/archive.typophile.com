      <p>Here, with thanks to Si, is an illustration of the basic approach, as implemented in the MS colour emoji font included in the Win8.1 preview. The 'base glyph' is the single-colour representation of the character (in this case U+1F630), and the three COLR table glyphs are mapped from it. Note that each COLR table glyph shares the advance width of the base glyph, and the outlines are arranged so as to appear in the correct positions when the widths are overlayed (presumably a DirectX layout engine operation).<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/u1F630_3783.png"></div><br>
      Each of the COLR table glyphs would be assigned a colour reference, mapped to an RGBA value in the CPAL table (I presume this is simply an efficiency, rather than storing the RGBA values directly in the COLR table).<p></p>
      <p>It's an admirably simple system, at least on the font side. I can imagine all sorts of tricky business on the rendering side to deal with the antialiasing.</p>
