    html: |-
      <p>I haven’t seen any documentation of the tables but the contents are mostly straightforward:</p>
      <p>The COLR table describes the layers that replace the uncoloured version of a glyph. Three longs hold the number of glyphs, the offset to the glyph array and the offset to the layer array. Then there’s a short holding the number of entries in the layers array.</p>
      <p>The glyph array comprises three shorts, the GID to replace, the index into the layer array and the number of layers in this glyph (consecutive entries in the layers array).</p>
      <p>The layers array comprises two shorts, the GID representing that layer component glyph and the colour palette index.</p>
      <p>The CPAL table holds the colour palette and is slightly more mysterious. The header comprises a long (0x2c), a short (2 – number of shorts per entry or colour format?) and a short which is the number of entries in the palette. Then there’s a long of the offset to the palette array, then that 0x2c long again.</p>
      <p>The palette array (for this format?) comprises four bytes – R, G, B, A where A=255 means solid.</p>
      <p>So it’s all pretty trivial. Layering must occur after any GSUB substitutions, obviously, not that they’re likely. Other colour formats may be possible (CMYK, Lab etc) but there’s no reason why software can’t decompose the layers and apply whatever colours it likes to the layer glyphs.</p>
      <p>A note on efficiency: The Segoe UI Emoji font in Windows 8.1 could be more tightly defined – the repetitions in the palette indicate a lack of automation but more wastefully there are many cases where whole glyphs are repeated – a colour layer being identical to the monochrome original for example, or layer elements being repeated from glyph to glyph.</p>
      <p>As can be seen, the COLR table itself doesn’t place any such restrictions on the arrangement or ordering of the glyphs themselves. There’s also some slight inconsistency regarding overprint, or overlap. Some layers overlap quite happily if composed in the correct order, others are designed with knockouts and could be composed in any order. Odd.</p>
      <p>I’m not sure the alpha is much use beyond shadows, as any colour effects could have been decomposed and as I said before, I’d have liked to have seen optional interpolation between layers to achieve some degree of smooth shading, but it may be that a more complex format of CPAL would allow gradients to be defined, which may be enough.</p>
      <p>Microsoft’s current love affair with flat slabs of colour will not last forever.</p>
