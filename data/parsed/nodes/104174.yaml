      <p>John says: “… the user to specify colour mappings for those references that differ from what the font maker intended. I don't know how likely that is in terms of anyone bothering to do it…”</p>
      <p>I think it could prove rather convenient:</p>
      <p><a href="http://www.myfonts.com/fonts/hwt/american-chromatic/" title="http://www.myfonts.com/fonts/hwt/american-chromatic/">http://www.myfonts.com/fonts/hwt/american-chromatic/</a><br>
      <a href="http://www.photolettering.com/letterer/" title="http://www.photolettering.com/letterer/">http://www.photolettering.com/letterer/</a><br>
      <a href="http://www.typography.com/fonts/shades/overview/" title="http://www.typography.com/fonts/shades/overview/">http://www.typography.com/fonts/shades/overview/</a><br>
      <a href="http://blog.fontdeck.com/post/8383559711/chromaticfonts" title="http://blog.fontdeck.com/post/8383559711/chromaticfonts">http://blog.fontdeck.com/post/8383559711/chromaticfonts</a><br>
      <a href="http://www.adobe.com/type/browser/html/readmes/ZebrawoodStdReadMe.pdf" title="http://www.adobe.com/type/browser/html/readmes/ZebrawoodStdReadMe.pdf">http://www.adobe.com/type/browser/html/readmes/ZebrawoodStdReadMe.pdf</a></p>
      <p>For symbol fonts too, one can easily imagine a colour version of the Maki font that is proving popular in cartography:</p>
      <p><a href="http://www.mapbox.com/maki/" title="http://www.mapbox.com/maki/">http://www.mapbox.com/maki/</a></p>
      <p>In a colour version it would make sense to colour all water (there are 4 glyphs containing water in the font) with the same palette index, such that it could be altered font-wide. An organization having a green or blue in their identity could thereby tint all water in Maki to match.</p>
      <p>Implementation in CSS for colour webfonts can be quite easily imagined. For example, to change the background colour of all the emoji faces (which use, say, palette index 3) from yellow to pink across all emoji faces you might do something like:</p>
      <p><code>font-feature-settings: "palette" 3 #ffcccc;</code></p>
      <p>- Laurence</p>
