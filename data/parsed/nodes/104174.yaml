    html: |-
      <p>&gt;...colorized characters is not going to transfer well over to the typesetting area...</p>
      <p>With all due respect, I estimate having made 678 fonts for chromatic use in  the typesetting area, (another 345,789 were abandoned ideas and 65 missing in inaction.) They are hard to use, especially with multiple size masters, but we and 1,000s of others, have made them for print. So maybe I misunderstand your point.</p>
      <p>What is true though, is that none of the proposals have room for user choice beyond which font or which glyph. Right? So it's hard not to agree that the web is where this is going to happen for either print or online use. As long as the format can store the separated stack, we can offer a simple interface, they can edit the colors. 3 steps instead of 2. </p>
      <p>Without "user choice", I'm thinking of an app that automatically pops a menu, if there's an all white cpal. ;)</p>
