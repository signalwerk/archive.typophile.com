      <p>I would hazard that drawing colorized characters is not going to transfer well over to the typesetting area, and will be strictly limited to applications such as web browsers and messaging apps.</p>
      <p>You would need a 'toggle' option to switch from B/W to colorized fonts. And then the colors appear as RGB in your output file. Conversion to CMYK should not be a problem in most workflows, but you might want custom spot colors. Perhaps one would want an option to get the 'exploded' emoji -- all separate parts, to be colored individually.</p>
      <p>Nevertheless: from a technical point of view, this solution is superior to the ugly scaling bitmaps we've seen so far. Except now the target audience (the Instant Messaging Generation) is going to ask for "eye candy" such as gradients, transparency, animation ... sounds ...  😭  (animated and with "boo-hoo" sound clip).</p>
