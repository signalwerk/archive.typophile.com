    html: |-
      <p><em>I know but where's the w gonna come from in this emoji.</em></p>
      <p>In this particular emoji, the only 'white' is the background, which is just the same as for any other glyph. If one were designing a colour font which involved white counters, one would have a couple of different options, depending whether you wanted the counter to be the background colour or explicitly white. For the first, you would need to design the COLR glyphs with knock-through counters. For the second you would create counter outlines as separater COLR glyphs and assign a white colour to them (I'm guessing this is what happens for, e.g. the teeth in grinning face emoji, since you want the teeth to be white regardless of the background colour).</p>
      <p>If you're using the knock-through approach to have background colour counters, then of course things may look crap if the glyph is displayed on an inappropriately coloured background, but that's true of regular fonts too.</p>
      <p><em>So don't we have a MUST for legible b/w from color?</em></p>
      <p>The legible b/w is the base glyph. I'm guessing that there be accessibility options to disable colour font display for people with colour-blindness.</p>
      <p>This colour font scheme, as I understand, does not allow for user preference in the selection of colours. It's an explicit colour model in which the colour is determined by the font maker, not by the user. That said, the COLR table structure would seem to permit the possibility of CPAL overrides if that were something software makers saw a value in supporting. So, for instance, the COLR table might split representation of a character into three glyphs, assigned colour references of 1, 2 and 3. Those colour references would normally be mapped to specific colours in the CPAL table, but it seems to me that a piece of software could interrupt at that stage and allow the user to specify colour mappings for those references that differ from what the font maker intended. I don't know how likely that is in terms of anyone bothering to do it, but it would seem to be possible.</p>
