      <p>I was about to respond that, surely, the precise colours of the US flag are officially specified somewhere. <a href="http://en.wikipedia.org/wiki/Standard_Color_Reference_of_America" rel="nofollow">They are</a>, and yet...</p>
      <p><a href="http://en.wikipedia.org/wiki/Flag_of_the_United_States#Colors" rel="nofollow"><br>
      </a></p><blockquote><a href="http://en.wikipedia.org/wiki/Flag_of_the_United_States#Colors" rel="nofollow">Sometimes, Pantone Matching System (PMS) approximations to the flag colors are used. One set was given on the website of the U.S. embassy in London as early as 1998; the website of the U.S. embassy in Stockholm claimed in 2001 that those had been suggested by Pantone, and that the U.S. Government Printing Office preferred a different set. A third red was suggested by a California Military Department document in 2002. In 2001, the Texas legislature specified that the colors of the Texas flag should be "(1) the same colors used in the United States flag; and (2) defined as numbers 193 (red) and 281 (dark blue) of the Pantone Matching System."</a></blockquote><p></p>
      <p></p>
      <p>But surely the white stars and bars are meant to be solid white, and not transparent.</p>
