    <p>My recently released font "Octant"  is listed on MyFonts' "Recent Fonts" page, but it never appears on the MyFonts front page in the "Recent Fonts" column. I've refreshed the page dozens of times, and have seen other fonts that were released at the same time as Octant show up regularly (e.g., Sjiq). I've asked MyFonts about this, and they said a font has to be "web-enabled" to appear on the home page.<br>
    How do I web-enable my font?! Any ideas? Is that a matter on MyFonts' side, or on mine?</p>
    <p>I've already asked MyFonts, but they haven't responded yet. There are already 30 fonts that appeared after Octant since its release; if this reaches 50, it will no longer be a "Recent Font" and my opportunities to get some exposure on the home page will be over.  &gt;:(</p>
