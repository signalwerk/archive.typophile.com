    html: <p>Your font is only available for standard 'Desktop' licensing/usage as opposed to having the option to license it for web font usage as well. If you look under 'Buying Choices' for Slapjack for example, it is available for both 'Desktop' and 'Web Font' usage. I can only assume that this is what they mean...</p>
