    html: |-
      <p>I think I understand what you want. You could create separations; that is, two fonts with identical metrics, one with the outlines and one with the fills. Then when you’re using the font, you would duplicate your finished “text”, change the font to the fill font, change the color to white, and put it behind the original (and in front of the staff). Of course, you would have to do that over again every time you changed something.</p>
      <p>However, I think the easiest solution to your <em>specific</em> problem might be instead to incorporate the staff into the font. For the purposes it will be used for, do you expect to be combining the notes into chords?</p>
    html_clean: |-
