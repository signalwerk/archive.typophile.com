    html: |-
      <p>I mean that a character can have a single opaque color. For example, an “e” could be any solid color with a transparent hole through it, which would appear white so long as the background is white, but you cannot have an “i” that has a black shaft but also a red dot without using some graphics software that can separate the parts.</p>
      <p>The holes in the letters like “e” are not white, but transparent (i.e, there is nothing there). If you are laying text over the music staff, the intersecting lines will appear between the letters and through these holes. You will either have to reduce the size of the type so it fits between the lines or move it to a non-interfering area outside the staff.</p>
