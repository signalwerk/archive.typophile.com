    <p>Hi there,<br>
    I’m proabbly not even at the right forum :D but I have absolutely no idea where to start.</p>
    <p>I work with music notation and there is a font on the market called Opus Note Names - it has letters inside the musical notation.  However, this font doesn’t suit all our needs so we thought we’d try to make our own.</p>
    <p>The problem is - can you make a font that is already coloured?  (See, I have no idea about fonts at all :D)  I ask, because we want anything that is white in our font *not* to be transparent.  As it is, anything white can actually be seen through.  I’m looking for some kind of white fill to put on the white bits of the font.</p>
    <p>Any help for an utter novice will be appreciated.</p>
    <p>Thank you for your patience!</p>
