    html: <p>Does this mean that people blind in one eye can’t read?</p>
    html_clean: <p>Does this mean that people blind in one eye can’t read?</p>
  - id: 226243
    user: 2021
    date: 2007-09-11T08:16:00
    date_raw: 11.Sep.2007 8.16am
    votes: null
    html: |-
      <p>They read differently, I would imagine.<br>
      But to exploit that for reading research, subjects who were born with only one working eye would be required — how rare are they?<br>
      A significant number of people lose the sight of one eye and continue to read (and even make typefaces, in the case of Fred Goudy), but they have learned to read with both eyes, complicating theory.</p>
