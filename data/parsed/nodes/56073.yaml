    html: <p>It's really interesting. It doesn't at first seem to harmonize with Coruña, but since I'm totally unfamiliar with Tifinagh script I have no idea what the rules are regarding its design. That could just be from having to look at them separately, though. If you could set some lines in both scripts together, as one might see in Morocco as you describe, that might make it easier to comment on.</p>
