    <p>This is an addition to Coruña that was a bit tricky and so I'm hoping someone might have some suggestions.</p>
    <p>I've added the Tifinagh alphabet to Coruña.  It's shapes are deceptively simple, and being an unicase alphabet, making it match the color of the rest of Coruña wasn't easy.  This is a quick draft, I don't like the terminals at all, but just the same I'm not sure what will work.</p>
    <p>Since it's often seen in mixed script cases due to the commonness of Arabic and French in Morocco, I want to make sure it looks good on its on and mixed with Latin (I've only just begun Arabic so nothing to show yet).</p>
