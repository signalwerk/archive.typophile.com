    html: <p>And... after reading through my post I realize why <br>I don't post often. What an idiot! <br> <br>You're probably right John. It seems the "potentially complicated" <br>solution you're referring to may become somewhat of a norm. <br>I think it's still foggy though. <br> <br>I suppose what I was trying to say with the original post is <br>that (unfortunately) many people view OT with a mix of skepticism <br>and conspiracy theory. Fortunately we're at such an early stage <br> that it's possible to reverse this. Addressing the often confusing <br>language surrounding it could clear a few things up and help <br>type buyers make informed choices.</p>
