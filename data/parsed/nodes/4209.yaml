    html: <p>With PostScript flavored OpenType fonts, for most non-Adobe apps that are not specifically OpenType aware, the Win/Mac OS (or ATM for older OSes) presents to them the boiled-down class kerning. Basically, it's the class kerning expanded into pairs, and then reduced to just those pairs that for which both characters are in MacRoman/WinANSI. <br> <br>However, such apps get no kerning at all for these fonts with pairs where either member is outside the basic WinANSI/MacRoman range. <br> <br>With regards to TrueType flavored OpenType, they can contain both kern table pairs and GPOS kern feature class kerning. However, AFAIK today non-Adobe apps only see the pairs and not the class kerning. <br> <br>Finally, AFAIK Apple does not yet support any kerning of any sort in Cocoa for either PostScript Type 1 or PostScript flavored OpenType fonts. So the above only applies to Carbon applications.  <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"> <br> <br>T&lt;/font&gt;</p>
