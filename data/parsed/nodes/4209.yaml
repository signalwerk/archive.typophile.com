  html: <p>As most of you are likely aware, the tools and  <br>technology surrounding type design have changed at <br>an impressive clip in the last few years. The days of <br>Fontographer and Quark 4 are long gone. As a result, <br>the types we license have changed as well. OpenType <br>fonts with rich features are becoming common, though <br>they're still far from mainstream. With this change we've <br>become friendly with new programs (FontLab &amp; InDesign)  <br>but only slightly familiar with how to speak of these new fonts. <br> <br>Is a single file with Small Caps, CE accents, Cyrillic, Greek and  <br>6 styles of numerals really a single font? 4 years ago that might  <br>have been 12 fonts. How about "Pro" or "Basic"? Do we need  <br>language we can all agree on before we slide into the confusions <br>of SC, LF, OSF, Expert etc? <br> <br>Just my thoughts on this Friday afternoon</p>
  html_clean: <p>As most of you are likely aware, the tools and  <br>technology surrounding type design have changed at <br>an impressive clip in the last few years. The days of <br>Fontographer and Quark 4 are long gone. As a result, <br>the types we license have changed as well. OpenType <br>fonts with rich features are becoming common, though <br>they're still far from mainstream. With this change we've <br>become friendly with new programs (FontLab &amp; InDesign)  <br>but only slightly familiar with how to speak of these new fonts. <br> <br>Is a single file with Small Caps, CE accents, Cyrillic, Greek and  <br>6 styles of numerals really a single font? 4 years ago that might  <br>have been 12 fonts. How about "Pro" or "Basic"? Do we need  <br>language we can all agree on before we slide into the confusions <br>of SC, LF, OSF, Expert etc? <br> <br>Just my thoughts on this Friday afternoon</p>
