    html: <p>You're right. <br> <br>Sure, Adobe would love to make more money off of fonts, which are a tiny fraction of Adobe's business. But the strategy for doing that is to offer better technology so that people will want to use the new stuff. Users will only make the move if they see value in OpenType, and we're trying to give them that value. Mostly, we expect average users to buy their new fonts in OpenType format, not to replace their existing fonts any time soon. <br> <br></p>
