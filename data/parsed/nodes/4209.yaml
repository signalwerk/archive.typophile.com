    html: <p>Hmmm. I agree that many folks are skeptical. As long as they're still on QuarkXPress and Quark doesn't support the extra goodies or Unicode, they're not seeing a whole ton of benefits. Cross-platform fonts are all very well, but only compelling for a few customers. <br> <br>For those folks, I agree that they have no reason to replace any fonts they already have. However, that is different from whether or not they should buy new fonts in OpenType. <br> <br>With regards to conspiracy theorists do you mean people who think it's just a scheme to get them to spend more money to replace their existing fonts? There are a few people who have more elaborate conspiracy theories, but they seem like a pretty lunatic fringe. <br> <br>Sadly, if terms like SC, LF and Expert were confusing to certain people before, then most likely they'll still be confused. But at least they'll have everything in one font, so they just get what's available, and there are fewer decisions for them to make. No more having a customer buy an expert font and then complain that it doesn't have lower case, at least. <br> <br>Cheers, <br> <br>T</p>
