    html: "<p>I think the word you want is vocabulary, not syntax, but that aside... <br> <br>I think the model is that individual fooundries or designers are likely to specify minimum glyph sets that users can expect, and may market these under particular names. There will typically be two considerations: character or language support, and feature or typographic support. The interaction of these considerations may produce modular nomeclature. For example, a character set might be defined that supports particular languages, and some fonts supporting this set might also support a set of typographic features, while other fonts with the same language support may not have any typographic features, or a different set of features. This suggests to me that a clear, if potentially complicated naming system would include one part identifying the language support and another the typographic feature set, and these two parts could be mixed and matched to identify the combined language and feature support of a given font.</p>"
