      <p>If you already have Fontforge working give it a try and see how things go. At worst you dislike it, export your work and export it into Fontlab. Typetool is another option, but I found it just too limiting and upgraded to Fontlab. </p>
      <p>If you’re a student Fontlab offers a very substantial discount on Fontlab studio. I rank it among the better investments I made in school.</p>
