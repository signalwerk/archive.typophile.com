    <p>Just wondering if anyone else here has any kind of typographic tattoos here. My first tattoo just finished healing, it’s an ambigram of my last name ’bailey’ made to look like it’s embossed into my back (kind of hard to see in this photo). Mind you I did this shot on a self timer so I was trying to point to it and get in position at the same time...I had been thinking about getting a tattoo for a long time but decided that I would only get one if I designed it and if it meant something to me. </p>
    <p>This design became significant to me because of a) I designed it myself b) John Langdon told me it was one of the best ambigrams he’s seen out of any he’s ever been sent. To be complimented to this degree by the creator/inventor of such art form it humbled me to a great extent c) most importantly it’s to commemorate my grandfather and father who do amazing carpentry wood work, when they finish a piece they brand their names into their work (initials and date usually). When I showed this to my grandfather (the ambigram) he was ecstatic and so what I did was get him a self inking stamp of it for his birthday. He has since marked all of his cherished books and such with the stamp and it was the happiest I’ve ever seen him in the 20 years I’ve been alive. I’d like to remember that moment. I’ve essentially branded myself with one of my most cherished designs.</p>
    <p></p><div class="imageWrap"><img src="/files/myback.jpg"></div><p></p>
    <p>What’s yours and your story?</p>
