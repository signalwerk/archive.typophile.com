    html: <p>Wow, yeah I was talking to the artist while I got mine and he told me a story of spelling something wrong on a Hell’s Angel biker once...but he had drawn up the tat for him and said ’Is this ok?’ and the guy ok’ed the design but then later realized it was wrong. It was even the city he was from (the biker) oi...needless to say the tat artist was scared for his life, but the Hell’s Angel realized that it was his fault and my artist got out alive haha. He’s actually the guy giving the tattoo in the beginning of the show Oz on HBO if you’ve ever seen that. My friend grew up with him so I’ve been hanging out in his shop since I’ve been in Manhattan.</p>
