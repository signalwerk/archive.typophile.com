    <p>The "happy typographic families" is available!<br>
    Learn, understand, revise typography and its families with fun and with friends!<br>
    74 cards 5,8 x 9,3 cm in a plexiglass box.<br>
    60 fonts from the most famous foundries are presented.<br>
    In French or in English.<br>
    Published by Éditions Deux-Cent-Cinq: <a href="http://www.editions205.fr" title="http://www.editions205.fr">http://www.editions205.fr</a></p>
