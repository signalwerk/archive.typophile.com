    html: <p>At that time, logos were often drawn to order by lettering artists, and I think your example was done that way. The stroke weight and the shape of the serifs (the flat ones, not the curved ones) makes me think the artist was influenced by Bertram Grosvenor Goodhue's Cheltenham, introduced in the early 1900s and still popular in the 1940s.</p>
