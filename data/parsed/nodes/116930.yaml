    html: |-
      <p>To duplicate the rounded bottoms one could take a font like ITC Clearface Bold Italic and slant the letters left by 18 degrees.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ITCClearfaceBoldSlantedLeft18deg_4929.jpg"></div><br>
      A good starting point for creating the Phillips letters.<br>
      BTW the top terminal on _l_ can be used for the other letters if the angled peak is clipped to make it horizontal.<br>
      Don<p></p>
