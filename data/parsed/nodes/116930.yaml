    html: |-
      <div class="comment-spam-body"><p>Thank you Victor.<br>
      I never underestimate the techniques of predigital designers. In addition to the pantograph -- used in type design since the 19th century -- photo lettering methods were developed at least as far back as 1936, the date Photo-Lettering, Inc. was founded. By 1945 photo lettering techniques or custom results from a photo lettering firm, would have been available to leading logo designers. It may have been an assist in  developing some features of the Phillips logo, but I agree with your original assessment that it would most likely have been drawn by hand.<br>
      Don</p>
      </div>
