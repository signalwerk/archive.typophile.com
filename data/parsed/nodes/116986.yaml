    html: <p>Titling is generally expected to apply to all caps, or even more, not just two letters. If you have only alternate versions of J and M, consider some other approach.</p>
    html_clean: <p>Titling is generally expected to apply to all caps, or even more, not just two letters. If you have only alternate versions of J and M, consider some other approach.</p>
