  html: |-
    <p>Hello everybody.<br>
    I'm at the very end of designing font which contains ss01, ss02, ss03 and some alternates of single glyphs like J, M, Adieresis and so on. What I'm trying to figure out is the best way ho to get all the glyphs usable in apps like Indesign and Illustrator.</p>
    <p>so far I have<br>
    - ss01 glyphs<br>
    - ss02 glyphs<br>
    - ss03 glyphs<br>
    - salt with glyphs as ss01<br>
    - titling alternates J, M</p>
    <p>Where to put Adieresis and few other alternates? Don't want to have them with ss01, because there is different approach. </p>
    <p>Salt mabye? Or some different feature? </p>
    <p>And is any way how to get ss02 ss03 to illustrator or photoshop?</p>
    <p>Thanks.<br>
    Jan Charvat</p>
