    html: |-
      <p>[I posted this comment almost 3 years ago, but it's still true.]<br>
      Every tattoo is done by hand, and therefore is unique, which is the beauty of tattoos.<br>
      Now for the grumpy pedantic part: The way I understand the meaning of "font," it's a set of letters created for mechanical, optical, or digital reproduction. The lettering in a tattoo can be a hand-drawn copy of a font, but it won't be a font until they invent a tattoo robot.</p>
