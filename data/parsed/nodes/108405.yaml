    html: "<p>Sorry zunelle but, even if I can't agree more with Victor, you should reconsider your point of view for this one. I'm 100% positive. The base font is definitely Burgues Script. Have a look to the <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/sudtipos/burgues-script/regular/glyphs.html\" rel=\"nofollow\">glyph palette</a> if you need more flourish letters. And for the rest, it has been modified and adapted to look more \"tattoo\": letters have been outlined and some flourishes reworked to look more \"pointy\"</p>"
