      <p>I've done an extensive overhaul on this face. I decided it was time to split it off into separate display and text versions. Since I'm generally more interested in text faces, I decided to tackle that version first. </p>
      <p><a href="http://www.altsan.org/creative/fonts/alexandrinabk140131.pdf" title="http://www.altsan.org/creative/fonts/alexandrinabk140131.pdf">http://www.altsan.org/creative/fonts/alexandrinabk140131.pdf</a></p>
      <p>The glyph shapes have been modified to work better at smaller sizes. The overall contrast has been reduced and the transitions softened. Descenders are shorter, and old-style figures are now the default.</p>
