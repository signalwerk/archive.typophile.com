    html: |-
      <p>Those proportions are starting to click.<br>
      Now I would reconsider the serif-length. Upper- and lowercase serifs don't have to match, but maybe they should be a little closer to each other than you have here.<br>
      Also, watch for where too much bracketing is creating black spots in the capitals, perhaps in places like inside lower left of D and E and inside lower right of K, and definitely in the interior acute serif angles of the thick stroke of X. I'd just try a "smaller radius" curve in those spots (with the K you could try a one-sided serif or other terminal for the leg).<br>
      You might have too much overshoot (see the bottom of the stem vs. the bowl of /d/).</p>
