      <p>I think all font designers are familiar with suggestions from non-designers such as: why don't you make a font with letters made of puppies, hot dogs, naked people etc. Of all the terms I've heard, "theme fonts" seems to the most obvious and many font sites categorize them that way. I don't see how splitting into abstract sub-genres would increase clarity. Functionally, Ch's categories all function the same way. In a railway theme font: railway cars with letters on them, letters made of tracks, or letters that look like railway cars all perform the same basic function. Choosing one over another is just a matter of taste</p>
      <p>Concrete subgenres are self-evident. Flower theme fonts, footprint theme fonts, feces theme fonts etc.</p>
