      <p>The more I think about it, the more I like the term "theme". "Novelty" is traditional, but makes about as much sense as "miscellaneous" or "other" or "bizarre" or "unusual". It just says the fonts look... different. "Theme" goes more to the intention of the designer. </p>
      <p>I've also seen decorated fonts (basically normal letters with other stuff added) called "florid" or "floriated", although that seems to imply only flower-like additions.</p>
