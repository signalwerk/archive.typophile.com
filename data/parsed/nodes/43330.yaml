    <p>I know dingbat fonts are also called Pi fonts, (presumably short for pictogram or picture) and are symbols, logos, line drawings, fleurons, etc.</p>
    <p>I don't know if there is a name for a font:<br>
    (a) that has picture elements in it, i.e., letters that include hearts, flowers, flames, stars, etc.<br>
    (b) that uses symbols to form letters, e.g., Toolbox, Critter, Cutout, etc.</p>
    <p>If there is a term for either or both of these kinds of fonts, please enlighten me. (I'm looking for something beyond, "Yeah, bad fonts!)</p>
    <p>Thanks.</p>
