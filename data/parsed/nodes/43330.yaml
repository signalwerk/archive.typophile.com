      <p><em>...and what is the prize going to be...?</em></p>
      <p>How about 4 issues of <strong>U&amp;lc</strong>, one for the best answer in each of the 4 categories?</p>
      <p>The overall heading I'll concede as novelty fonts.<br>
      Under that heading, I'm looking for the best descriptor of:<br>
      * Fonts with each letter made of a <strong>different</strong> element (different tools, musical instruments, animals)<br>
      * Fonts with each letter made of a <strong>common</strong> element (nails, logs, barbed wire, typewriter keys, paper clips, bamboo, people in different poses)<br>
      * Fonts with letters <strong>embellished with</strong> picture elements (hearts, flowers, stars, eyeballs, bees, bugs, vines)<br>
      * Fonts with letters <strong>inside</strong> a picture element (animals, soldiers, trains, blocks, balloons, pumpkins, footprints, leaves)</p>
      <p>You can let me pick the best answer, or you can vote on it.</p>
      <p>In case of duplicate answers, or answers already suggested, the one with the most best answers or the first best answer wins. Obviously, thare may be overlaps, or my four categories may not be worthy of differentiation.</p>
