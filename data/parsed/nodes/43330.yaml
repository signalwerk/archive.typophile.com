    html: |-
      <p>I've been calling these "picture element fonts" because I didn't know what they were called. When someone asked me about them, I felt embarrassed because I didn't know what the "correct" name was, assuming there was a label for these kinds of fonts. </p>
      <p>I Googled "novelty fonts" and came up with this site <a href="http://ingrimayne.com/fonts2/_noveltya.html" title="http://ingrimayne.com/fonts2/_noveltya.html">http://ingrimayne.com/fonts2/_noveltya.html</a> that referred to "fonts in which the letters are made from things, from paper clips to bugs to tools" as letterbat fonts, which I had heard of a long time ago but didn't remember.</p>
      <p>I agree with Nick that there is a distinction between letters that are made of things, like tools, and fonts that are embellished with vines, hearts, stars, etc.  I'm not sure I like rebus fonts; that reminds me of the game (show) "Win, Lose, or Draw," or Pictionary.</p>
      <p>So far, I like Novelty, Picture fonts, and Pi letters, letterbats, embellished fonts, decorated fonts. I even found dinglets and dingfonts in a Google search! </p>
      <p>This probably doesn't interest the pros who set type or do layouts for magazines, advertisements, newspapers, brochures, etc. But every once in a while it's nice to use fun fonts. Even though  Judith Sutcliffe's Hibiscus is not very much liked by professional types, I once saw it used in a travel advertisement. And I'm sure more than one restaurant has used a font embellished with chili peppers. And yes, some of these fonts shouldn't ever see the light of day again (e.g., fonts made out of spermatozoon, poop, etc). Whether we like or hate all or some or none of them, why shouldn't there be a taxonomy of even these fonts?</p>
      <p>Maybe we should have a contest!</p>
      <p>• Fonts with each letter made of a different element (different tools, musical istruments, animals)<br>
      • Fonts with each letter made of a common element (nails, logs, barbed wire, typewriter keys, paper clips, bamboo, people in different poses)<br>
      • Fonts with letters embelished with picture elements (hearts, flowers, stars, eyeballs, bees, bugs, vines)<br>
      • Fonts with letters inside a picture element (animals, soldiers, trains, blocks, baloons, pumpkins, footprints, leaves) </p>
      <p>Even if this doesn't go any further, I thank those of you who uderstood my question --  and contributed ideas, comments, suggestions, and answers.</p>
