    <p></p><div class="imageWrap"><img src="http://typophile.com/files/03_5314.jpg"></div><p></p>
    <p>Bree was chosen as main typeface for body and titles in Deco, an ethical and ecologically aware French interior magazine.</p>
    <p>In most cases, the body text actually uses Bree's alternate characters to ensure best legibility. </p>
    <p>It was designed by Ljubomir Djordjevic from the French design studio Commeunarbre.</p>
