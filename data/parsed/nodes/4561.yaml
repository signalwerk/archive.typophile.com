    html: "<p>Tom: <br> <br>I just read all of these posts and there is an interesting dynamic in your revision process. I didn't comment when I first saw your design, because nothing immediately stood out for critique and I'm too lazy to just type \"well done\". Anyway, it seems at this point that one of the biggest issues with the design is the proportions of the duck. Interestingly, if you return to your initial post, the proportions are pretty accurate, while in your last post your proportions have created a baby duck (small underdeveloped wings and an oversized head). Also, although the smoother head is more beautiful, it reminds me more of a swan direction than the original mallard head. The first head seems to represent a more agressive, dynamic and proactive business (in flight). I will say, however, that your second approach to the tail is an improvement. I am glad that nobody has suggested a type alternative, because that's a really good selection</p>"
    html_clean: "<p>Tom: <br> <br>I just read all of these posts and there is an interesting dynamic in your revision process. I didn't comment when I first saw your design, because nothing immediately stood out for critique and I'm too lazy to just type \"well done\". Anyway, it seems at this point that one of the biggest issues with the design is the proportions of the duck. Interestingly, if you return to your initial post, the proportions are pretty accurate, while in your last post your proportions have created a baby duck (small underdeveloped wings and an oversized head). Also, although the smoother head is more beautiful, it reminds me more of a swan direction than the original mallard head. The first head seems to represent a more agressive, dynamic and proactive business (in flight). I will say, however, that your second approach to the tail is an improvement. I am glad that nobody has suggested a type alternative, because that's a really good selection</p>"
