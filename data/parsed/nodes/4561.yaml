    html: <p>Mallard Signs offers all types of signs. I am choosing with this logo to not reflect the subject matter because I think "signs" says it all. Most sign companies in town all offer the same services. There isn't (from my knowledge) a sign company that just sells roadside signs, then a company that just sells yard signs. <br> <br>Plus, there will be decriptive copy describing the types of services offered that go with the logo.</p>
