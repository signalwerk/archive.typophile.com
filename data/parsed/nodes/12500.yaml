  html: <p>As I am slowly but surely regaining my moderator/administrator superpowers (damned Kryptonite…) I can now edit thread titles again and have started cleaning the Type ID Board. I have noticed that — when I change a thread title — my RSS reader mistakes that thread as a new item. I thought I’d better report this.</p>
