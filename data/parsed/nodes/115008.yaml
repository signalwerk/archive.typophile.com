      <p>For a long time, and in more recent years off and on, it was considered the height of interior design skill to use one typeface for  both text and display.</p>
      <p>Playing on that notion, I'd at least take a look at Charter, free in the versions released &amp; distributed by one of the TeX groups. Charter will be quite similar to Georgia -- a familial resemblance -- but lighter in weight, so more in keeping with the larger sizes in heads. If in fact you want significantly larger sizes in heads. Space can be used for emphasis, often more effectively than type size.</p>
      <p><a href="http://www.ctan.org/tex-archive/fonts/charter/" title="http://www.ctan.org/tex-archive/fonts/charter/">http://www.ctan.org/tex-archive/fonts/charter/</a></p>
      <p>For a sans, Lato might work, if you absolutely must have a free font. TheSans will work if you don't mind paying a bit. With sans, pay attention to the lower case g's and y's when pairing with serif text fonts.</p>
