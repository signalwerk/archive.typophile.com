    html: |-
      <p>Trebuchet and Corbel are not free, but you probably have them if you have Calibri. I once used Trebuchet and Georgia in manual and liked the results. One advantage of Corbel is that its default figures are old style and would therefore match the default old style figures in Georgia.</p>
      <p>A number of free sans serif fonts (listed below alphabetically) are readily available for you to download and consider:</p>
      <p>Clear Sans from Intel<br>
      Fira Sans from Firefox<br>
      Lato from Google Web Fonts<br>
      Noto Sans from Google Web Fonts<br>
      Open Sans from Google Web Fonts<br>
      Source Sans Pro from Adobe</p>
      <p>Fira Sans and Source Sans include small caps, if that matters.</p>
