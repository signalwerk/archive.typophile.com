      <p>Thanks for your comments.</p>
      <p>The quote has been replaced at <a href="https://web.archive.org/web/20181209110338/http://www.alterlittera.com/al_htm/oldtype/wklingspor_schrift.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">alterlittera.com</a> (it seems it can't be removed from the first post, though ...). For modern uses of blackletter in general, you might have a look, for example, at "<a href="https://web.archive.org/web/20181209110338/http://slanted.de/shop/slanted-magazin-10-heavy-metal-lovers" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Slanted Magazin #10 – Heavy Metal. Lovers</a>." As a nice aside, I was gladly surprised a few months ago when I saw a <a href="https://web.archive.org/web/20181209110338/http://www.saxon747.com/en/index.php/band/releases/260" title="Click to visit an external URL." class="freelink freelink-external freelink-external">recent release</a> by rock veterans Saxon which made use of a somewhat popular version of Wilhelm Klingspor Schrift for some of the text. No hard rules, however: use blackletter at your discretion and see whether it fits your purpose. And finally, I would really like to include Yiddish in the font, but that is well beyond my (limited) knowledege of different languages.</p>
      <p>Thanks again.</p>
