      <p>Thanks, Nick.<br>
      The font includes an alternate /k/ with corresponding ligatures as a stylistic alternate. It can be seen (somewhat hidden) in the fourth line, second word, of the third sample image above. Here's a bigger picture:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/WKS10_5709.png"></div><br>
      I don't know whether I got it right or not (I think I did), but I sure didn't like the modern /k/ in Adobe/Linotype's Wilhelm Klingspor Gotisch, with its diagonal leg disrupting the darkness and vertical patterning of the lowercase "textura".<p></p>
      <p>Best wishes.</p>
