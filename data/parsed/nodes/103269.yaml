      <p>Thanks for your comments.</p>
      <p>The quote has been replaced at <a class="freelinking external" href="http://www.alterlittera.com/al_htm/oldtype/wklingspor_schrift.htm" rel="nofollow">alterlittera.com</a> (it seems it can't be removed from the first post, though ...). For modern uses of blackletter in general, you might have a look, for example, at "<a class="freelinking external" href="http://slanted.de/shop/slanted-magazin-10-heavy-metal-lovers" rel="nofollow">Slanted Magazin #10 – Heavy Metal. Lovers</a>." As a nice aside, I was gladly surprised a few months ago when I saw a <a class="freelinking external" href="http://www.saxon747.com/en/index.php/band/releases/260" rel="nofollow">recent release</a> by rock veterans Saxon which made use of a somewhat popular version of Wilhelm Klingspor Schrift for some of the text. No hard rules, however: use blackletter at your discretion and see whether it fits your purpose. And finally, I would really like to include Yiddish in the font, but that is well beyond my (limited) knowledege of different languages.</p>
      <p>Thanks again.</p>
