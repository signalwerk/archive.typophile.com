    html: <p>Quite impressive. My only gripe is with the lowercase /k/, which is historically accurate but rather confusing to someone not familiar with this particular rendering of the letter. The font might be more useful to a wider number of potential buyers if there were an alternate /k/ character, structured somewhat along the lines of the /sz/ ligature...IMHO. Otherwise, great stuff.</p>
