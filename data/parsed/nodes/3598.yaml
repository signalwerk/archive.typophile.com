  html: <p>Considering the professionalism of the people in here, I suppose I will be shred to parts. However, I would like to collect some opinions as well as ideas for improvements. <br> <br>The company main object is blank CD-R, CD-RW &amp; DVDR discs, and this is a trade company, eg they don't manufacture the CD's, they just sell them. I wanted to stay away from the "euro stars" cliche. Thank you, folks. <br> <br><img src="http://www.typophile.com/forums/messages/29/28592.gif" alt="Euro Optical Disc"></p>
