      <p><strong>What’s up with those little badges on peoples’ user icons?</strong></p>
    <p><a href="https://web.archive.org/web/20080906232216/http://typophile.bigcartel.com/"></a></p><div class="imageWrap"><a href="https://web.archive.org/web/20080906232216/http://typophile.bigcartel.com/"><img src="/web/20080906232216im_/http://typophile.com/files/typ_sponsor-levels_5368.png"></a></div><p></p>
