      <p>“If it looks good, it is good”.</p>
      <p>Word!</p>
      <p>We always have to come back to how the type is intended to be used. If the weights are there to look like a pretty and perfect progression when appearing together on a type specimen sheet, that is one thing. If the weights are there to function as text, reversed text, subhead distinction, and display distinction, it is another thing. All of these wonderful mathematical explanations and methods are terrific for academic discussion and may help us see what could be lurking beneath the core of our vision but, in the end, I don't see how it makes the design process any faster or easier than just using your eyes. There is a difference between the intellectual discussion of type design process and the actual doing of it. This was a wonderful thesis project and fascinating reading but I don't see how I personally would apply it to doing my own work.</p>
      <p>ChrisL</p>
