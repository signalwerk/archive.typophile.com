      <p>&gt;can be derived</p>
      <p>Yes the formula for n interpolated weights can be derived from the formula for three weights. An exercise left to the student :) </p>
      <p>The stuff about horizontals introduces new ideas, though, so there's new information there. I also didn't get that so clearly. I probably heard the same talk as Karsten, and it flew by pretty fast, and I wasn't even trying to take notes. </p>
      <p>I did get the problem he is addressing with his formulas, though. If you have a lower case c, and fatten the horizontals a certain amount, then try to apply the same to a lower case e, you are going to get into trouble on heavier weights because the counters will start to get too small and clott up. So if you want a rule, then you are going to have to include the number of horizontals as a variable. </p>
      <p>As to my own perspective, I am personally concerned more with the question of needed contrast between regular and bold, and in the adjustment of optical sizes, as I haven't yet focused on the multi-weight family. </p>
      <p>But to get back to Nick Job's original post, the number of 52% bolder seems to me may be misleading. It might be that this is too much for a bold weight in a serif font that is going to match with text, eg as a side head. And maybe too little for a headline. </p>
      <p>For example, Minion semi-bold n stem is 39% wider than the regular. The Minion bold is 62% greater than the regular. With Times the bold is 65% greater than the regular. If you average the weights of the bold and semi-bold of Minion, you get 50.5%, close to your number, but I am concerned that this may not work well for either purpose.</p>
      <p>By the way the relation of Minion semi bold and bold, 39/62, also is not a golden ratio, but also not that far off :)  </p>
      <p>Also I am a bit infected with Bringhurst's view that most bolds are too bold. </p>
      <p>I don't claim to know the answers here, I'm just asking.</p>
