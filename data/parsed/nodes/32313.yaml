      <p>Karsten, your link is what I referred to as "on the web site." There is a lot more to the theory, as I said. de Groot regards that page as quite inadequate. </p>
      <p>&gt;some more snippets </p>
      <p>Well, I only remember the general ideas. Since I am not focused on sans and am not totally convinced about the formulas, I was not concerned that much with the actual formulas.  </p>
      <p>He started out by saying that if you to the most obvious thing, and add a certain fixed amount to each width to get the next heavier weight, it will look wrong. The problem is that then that if you have a series of say 3 weights, then the ratio of a the lightest to b the middle will be different from the ratio of b to c. To look good, he thinks, you want the ratios of a to b and b to c need to be the same. </p>
      <p>That idea is the basis of his formula on the web site. He has generalized that formula to a formula that gives you the relative weights of n interpolated weights, given the extremes. </p>
      <p>But he also has a formula for how the horizontals should vary along with the verticals, depending on whether the glyph has 1 (T) 2 (D) 3 (E) or 4 (@) horizontals.</p>
