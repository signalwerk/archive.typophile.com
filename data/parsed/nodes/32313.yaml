      <p><cite>Yes the formula for n interpolated weights can be derived from the formula for three weights. An exercise left to the student :)</cite></p>
      <p>It seems that all the formulae of the <cite>Interpolation Theory</cite> can be derived from a very simple principle: That of <a href="http://en.wikipedia.org/wiki/Geometric_progression" rel="nofollow">geometric progression</a>.<br>
      The <cite>Interpolation Theory</cite> simply says: "The stem weights are to represent a geometric sequence." Nothing more, nothing less. Sounds less scary and complicated when it's put in words rather than a formula, doesn't it?</p>
      <p>However, I see one weakness in treating the stem weight as an absolute value between zero and infinity. I suggest to define "weight" not as stem weight but as black versus white, which means a number between zero (no weight, just white) and one (the point when the counters and white space becomes zero and we have 100% black.)<br>
      This would reflect that the geometric series gives nice relations only in the lighter weights whereas in the black regions a slight increase in stem weight can have a significant effect on the "colour" of the font.</p>
