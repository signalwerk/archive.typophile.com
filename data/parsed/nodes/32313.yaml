      <p>Thanks, Tim. That's quite right about the stem widths. </p>
      <p>De Groot's formula a = b x b / c can also be written a/b = b/c . In other words, the ratios between successive terms is the same--the defining feature of a geometric progression. </p>
      <p>And that's de Groot's basic  point in words: don't do successive weights by adding a constant--an arithmetic progression--but by having the ratios between successive weights the same--a geometric progression. </p>
      <p>No doubt a geometric progression makes successive weights in a sans *specimen* look nice. But it doesn't answer the question which Nick asked, which is how big a jump between weights is best, nor the general question what weights are needed or best for use as type on the page. </p>
      <p>Also the issue of bolding horizontals and curves seems to me a more complex issue, more resistant to simple formulas.</p>
