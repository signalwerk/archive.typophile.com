      <p>When I first got to Typophile I was looking at &amp; experimenting with this &amp; I found that while yes, there is definitely something there - like all things in type - it's just one of several factors. No formula can replace the eye. And there are many glyph specific &amp; style specific issues all of which must trump the formula in specific areas. The hyper bold &amp; the hyper thin also impose their own agendas. The hyper thin are difficult because of point placement issues and the hyper bold must be distorted beautifully/grotesquely in ways that the formula doesn't help with at all. AND if you have a font which is screen specific or is meant to be used in a particular media that may trump the value of the formula again - to the point where it may not be useful anymore. </p>
