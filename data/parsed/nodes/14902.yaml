    <p>A while ago I created a pixel font based on Herbert Bayer's Bauhaus alphabet, I suppose it could reside in the Bitmap Text area, as it does work pretty well in text settings (IMO) but I think display is right for now.</p>
    <p>Any opinions on it would be most welcome and gratefully received.</p>
    <p>Thanks all.</p>
    <p>Jordan</p>
