    votes: null
    html: |-
      <p>Tyler:</p>
      <p>Thanks for your comments. FWIW, an example of Bayer's Bauhaus letters can be found <a href="http://perso.wanadoo.fr/les.besnardtypo/typographies/ecritures/Images/Dbauhaus.gif" rel="nofollow">here</a> (check out the <code>g</code> and the <code>k</code>) (how the hell do we post images inline?).</p>
      <p>As you can see, my pixel font is not a perfect 'pixelisation' of the letterforms, the <code>c</code>, <code>g</code> (to some extent), <code>s</code>, <code>x</code> and <code>z</code> exhibit differences that I choose to make bayopic more readable. For instance, the narrower <code>x</code> didn't work at all, it just got lost in the text, and curving the <code>c</code> in at the stroke ends just didn't work either.</p>
      <p>I think re: the caps, it's important to note that Baypoic isn't supposed to be a text face. The caps and lowercase don't really harmonise because they didn't exist in Bayer's original, initial caps look out of place because they're so wide -- to fit in with the style, not the lc. (Though I agree with you re: the <code>W</code>, it's definitely too narrow -- it's the same width as the lc <code>w</code> for heaven's sake!)</p>
      <p>I think I'll definitely create two faces:</p>
      <ul>
      <li><strong>Baypoic display:</strong> as seen above, with a wider <code>W</code></li>
      <li><strong>Bayopic text:</strong> with narrower Uc, an extra px on the lc ascenders, and one less on the descenders, a less extreme <code>g</code> and a more conventional <code>k</code>.
      </li></ul>
      <p>And I love your idea of a uniheight version -- essentially, Bayer's alphabet was unicase anyway, caps have only been added by designers since. Definitely font-3 in the family :)</p>
      <p>Thanks again.</p>
      <p>Jordan</p>
