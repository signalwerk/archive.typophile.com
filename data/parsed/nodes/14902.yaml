    html: |-
      <p>i'm no type historian, that's for sure. this pixel font may or may not faithfully obide by the original bauhaus alphabet's dimensions/porportions--i wouldn't know.</p>
      <p>but i do feel that pixel fonts almost never work as 'renditions' of more sophisticated original typographic works. the reason is, that pixel grids just don't allow for the necessary nuance; the fine variation in width, and flexibility in diagonals to faithfully get the job done.</p>
      <p>so: i'd like  to see shorter descenders, a higher ascender on the 'k', less width on the 'x', perhaps even less width in the 's' and 'z', make an entirely new font out of the 'G' and remove it from this font, and although you have held a mathematically consistent width for much of the uppercase, it looks oddly inconsistent to me.</p>
      <p>i'd try a narrower 'A', 'C', 'F', 'H', wider 'W', narrower 'Z'</p>
      <p>also, you might try to make your x-height the same as your cap-height right now. make the whole font bigger. that way, your more sophisticated 'X' and 'N' and 'Y' might be used for the lowers, and bigger, equally sophisticated uppers may accompany them.</p>
      <p>you'd also have greater control over the width of all of your uppercase characters, which is something you could use right now, in my opinion. one pixel taken from four is a lot more noticeable than one pixel taken from 6.</p>
