    <p>I got a request from a Switzerland customer. He is looking for a lead font called "Basel" (which I cannot find as name anywhere). He sent me a book title and a pic from the font.</p>
    <p>I think it could be a PostScript font. Primafont offered a Basel, but I do not think, its this one. Am I right or not? Can someone help me?</p>
    <p>Georg</p>
    <p><img src="/sites/default/files/old-images/Basel Schrift_5016.jpg"></p>
    <p><img src="/sites/default/files/old-images/Schriftbuch_4139.jpg"></p>
