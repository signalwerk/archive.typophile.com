      <p>Image Club used to have Basilea in its early Letterpress CD's. I still have the font, but I don't think they offer it any more. Akira, that was a good find to recognize Kellie Ann as the same typeface. I've made a note of that one for the Serif Guide, as an alias.The image below is from thew Serif Guide, made from the Image Club font.</p>
      <p>- Mike Yanega<img src="/sites/default/files/old-images/basilea_full_5490.gif"></p>
