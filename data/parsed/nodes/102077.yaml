  html: |-
    <p>Hi all,</p>
    <p>I'm attempting to make some comparative graphics of various units of measure re. type-making history...<br>
    I'm trying to suss this out with <a class="freelinking external" href="http://en.wikipedia.org/wiki/Foot_(unit)" rel="nofollow">http://en.wikipedia.org/wiki/Foot_(unit)</a></p>
    <p>Specifically regarding '¶ 2 Of Letter' of Moxon's ...Art of printing:<br>
    When he speaks of 'feet' in 1683, should this be regarded as The Roman foot divided by the 10/11 rule of the 'Composition of Yards' law?</p>
    <p>∴ 10.59090... modern inches?</p>
    <p>Alternately, preferably - does such a chart already exist?</p>
    <p>-b</p>
