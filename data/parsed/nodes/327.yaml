    date: 2003-06-10T21:07:00
    date_raw: 10.Jun.2003 9.07pm
    votes: null
    html: <p>It would be unusual and, I suspect, would be counter to the design intent of the typical business card, in which information is visually separated out so that it is easily located. Using a semi-colon to separate a URL and an e-mail address might, however briefly, make both bits of information less than perfectly clear. If you're looking for an e-mail address on a card, you are unlikely to look at the end of what seems to be something else. It would be better to separate out the two pieces of information with a healthy space between them, or by putting them on separate lines.</p>
