  html: <p>hi, <br> <br>just wondering if its appropriate to use a semi-colon to separate information on a business card? <br> <br>ie. <a href="http://www.mywebsite.com" target="_blank">www.mywebsite.com</a>; <a href="mailto:myemail@anisp.com">myemail@anisp.com</a> <br> <br>if not, any other suggestions for a seperator? <br> <br>thanks <br>iota.</p>
  html_clean: <p>hi, <br> <br>just wondering if its appropriate to use a semi-colon to separate information on a business card? <br> <br>ie. <a href="http://www.mywebsite.com" target="_blank" class="link-external">www.mywebsite.com</a>; <a href="mailto:myemail@anisp.com">myemail@anisp.com</a> <br> <br>if not, any other suggestions for a seperator? <br> <br>thanks <br>iota.</p>
comments:
  - id: 1865
