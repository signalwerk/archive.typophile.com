    html: <p>And if the details get lost, you can interpolate the image to a higher resolution, and use some other method (not threshold) while converting to bitmap. <br>This will preserve some additional shading detail. Anyway, the best thing, if the sketch is needed in grayscale for better evaluation, is to go back and forth between FreeHand/Illustrator and Fontlab. With the new copying options it's a snap, and Freehand 10/MX works just great.</p>
