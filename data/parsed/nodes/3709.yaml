    html: "<p>I still don't understand.  <br> <br>1. Do you mean:  <br>(a) \"Template\", which is the vector-based drawing, one per font, that is used as reference for each glyph throughout the entire font, or <br>(b) \"Background\", which is the bitmap image, one per glyph, that is used as reference for a given glyph in a font?  <br> <br>2. In which application do you use the command \"Copy\"? In which application do you use the command \"Paste\"? (That is, are you copy-pasting from Photoshop to FontLab, or from FontLab to Photoshop?) <br> <br>3. Can you show the original image and a screenshot showing the result in FontLab?  <br> <br>4. If you are a registered FontLab user, you're obviously entitled to free technical support. Since this is a FontLab-specific problem, may I ask you to use the FontLab Problem Report Form at <a href=\"http://www.fontlab.com/html/support.html\" target=\"_blank\">http://www.fontlab.com/html/support.html</a>  <br>so that the personnel at Fontlab Ltd. can review your problem? If you're attaching multiple files, please zip them into one archive.  <br> <br>Best,  <br>Adam  <br></p>"
