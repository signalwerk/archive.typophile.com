    html: <p>Oh, now I see what you mean. FontLab only supports monochrome (black-and-white) images in the Background layer. Your original is greyscale, so it gets converted to black-and-white when pasting. The resolution remains the same.  <br> <br>You can covert it manually (e.g. in Photoshop). If the resolution is not sufficient, use a bitmap with higher resolution.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.  <br></p>
