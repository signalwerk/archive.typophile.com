    <p>Slow Print Letterpress announces <a class="freelinking external" href="http://slowprint.com/zen " rel="nofollow">"Zen of Business Cards"</a> letterpress cards in black and white.<br>
    We've provided templates for convenience, or will accept client provided art in the same Zen spirit.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/P2040015_6482.jpg"></div><p></p>
    <p>One popular option is to order these thrifty black and white cards and then get  a couple of groovy iconic rubberstamps (like from our dear friend <a class="freelinking external" href="http://ljackson.com" rel="nofollow"> Leavenworth Jackson</a> ) to customize the cards beyond your wildest dreams!</p>
    <p>They're printed on the very lovely Strathmore Writing Cover (Soft White 110#)<br>
    One catch: we have to fill a press-sheet of 6 to 12 slots before making the film and plates and printing, so putting out the word to your friends and peeps will get you your own cards that much faster!</p>
