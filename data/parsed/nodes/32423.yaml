      <p>&gt; the English and then the Americans have been<br>
      &gt; key power players over the past century</p>
      <p>Because they like Eastern Mediterranean food? My wild guess is it's because they have something to gain (at the expense of others). The Jews are Arabs are the two protagonists here, the ones with life, land and dignity to worry about (as much as the West plays favorites so heavily). The reason to have English in the logo is mostly due to the fact that it's currently the lingua franca of the world.</p>
      <p>Simplicity: I think it has a role to play, but too often it becomes a goal in its own right, harming the actual effectiveness of things. More than something you read, a logo is a shape you observe and memorize. In this case for example it might make great sense to have the English carry the burden of legibility while getting the Hebrew and Arabic to make the logo attractive and memorable. This happens to be something 9 does very well.</p>
      <p>hhp</p>
