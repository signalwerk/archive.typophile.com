    <p>hi everyone.<br>
    i posted here a little in the past, (hopefully more in the future).<br>
    my name is yaron and im a 25 years old design student from israel.<br>
    im now working on a fake rebranding for a left-wing non-partizan israeli organization that demonstrates for peace, human rights and against the israeli wall.<br>
    the original organization, still active in israel is "gush shalom" (something like peace-block) and i have renamed it to "peace core" as in "hard core", but also a core of which peace grows from.</p>
    <p>it's an exercise in the design school and not for real, but it's a very interesting<br>
    task that combines rebranding, type handling, and advertising.<br>
    im now working on the logo that combines three languages - hebrew, arabic and english. </p>
    <p>the logo is intended to be united (by using similar graphic language in each font), inseperable (thus naturaly connected by using ligatures between the languages) and strong (by using bold wheights, because the organization is considered a militant [but non violent] organization for peace).<br>
    my biggest problem is designing in arabic, sadly i don't know arabic. i don't know what's cool inarabic or what good fonts can assist me. only for the logo, the task is quite hard, as i try to make the connection flow in harmony.</p>
    <p>a good guy from lebanon assisted me and found for me an arabic type called "S kira" which can be good with some thickening and adjustments.<br>
    the hebrew type is "extrim black".<br>
    and the english one is "Futura LT ExtraBold".</p>
    <p>im open for any type/composition/linguistic suggestions. i also need names for three good fonts that are good for text (and the slogan below the logo).</p>
    <p>previous sketches :<br>
    here:www.flickr.com/photos/yaronimus/359638795/<br>
    and here: <a href="http://www.flickr.com/photos/yaronimus/367882739/" title="http://www.flickr.com/photos/yaronimus/367882739/">http://www.flickr.com/photos/yaronimus/367882739/</a></p>
    <p>i have attached a PDF file of the recent sketches.</p>
    <p>thank you all.<br>
    Yaronimus</p>
