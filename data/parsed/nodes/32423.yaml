      <p>I don't know anything about non-english characters, but it's my understanding that even the slightest change could alter their meaning; so I would be cautious of your "multilingual ligatures." </p>
      <p>With that said, I do think it's a very powerful mark. I think the aggressiveness that William is talking about is what, to me, makes the logo stand out. It's soaked in irony. In the U.S. especially (thanks to the media), many (ignorant) people see the Middle East as dangerous and threatening. So associating this belief with peace creates a more memorable mark. Much MUCH better than using a dove or an olive branch! ;) It's very masculine, which also sets it apart from the cliche delicate peace logos.</p>
      <p>I also agree with Nicholas - I'd love to see it spray painted on the sides of buildings and sidewalks.</p>
      <p>Nice work.</p>
