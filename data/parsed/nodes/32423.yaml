      <p>I like these explorations. Especially when the Hebrew and Arabic fuse while the English acts like a third party. On the other hand, most of those attempts have one serious problem or other (and in all of them the Arabic too large/dark). Number 1 is nice as an arrow, but too spread out; 2 is kind of a half-baked arrow; 3 and 5 are hard to read; 4 has great potential; 6, 7 and 8 could work, but probably not very well; 9 has potential; the rest are trying too hard, and will be pretty impossible to tame I think.</p>
      <p>Number 4 is interesting, dynamic, edgy and balanced except for the Arabic being too strong. I would make this one work. Alternatively 9 has a more classical feel, if you don't mind the centrality of the English (and the somewhat Arabic motif of the diamond). If you go with 9 you need to make the diamond equal-sided (right now it's rectangular) by shortening the top-left and bottom-right sides or lengthening the other two sides*. In the former case the bottom-right is easy (just shorten the alif and lam - the first two letters in the second Arabic word) and the top-left has some room in the last letter of the Hebrew. In the latter case you can easily place a tatweel (apparently a better term than kashida) after the "seen" but I'm not sure how best to lengthen the first word of the Hebrew (maybe by over-shooting the last letter outside the diamond, which might actually be a nice match to the Arabic "meem" which is already doing that).</p>
      <p>* Or a combination of both.</p>
      <p>All that said, are you sure you want to give up on your previous attempts?</p>
      <p>&gt; with the English and Hebrew words for core at the core.</p>
      <p>No concern for the Arabic? You could at least wonder<br>
      out loud which of the two Arabic words is the "core".</p>
      <p>In fact in 14 the Arabic reads out of order.</p>
      <p>&gt; I just worry that it might be too complex</p>
      <p>Sounds familiar.  :-)</p>
      <p>hhp</p>
