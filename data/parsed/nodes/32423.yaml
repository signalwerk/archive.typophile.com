      <p>William, it depends whether one thinks this juggernaut of warmongering can best be stopped gently or aggressively. In making this judgement one might take into account how much real effect the most recent round of US voting has had...</p>
      <p>Yaron, good call posting this here. I see you've changed things around. One thing I preferred in the old one is the counter-balancing of the ordering of the languages between the main logo and the subtext; in this one I would put the Hebrew first and the Arabic second in the subtext.</p>
      <p>Otherwise though this is a nice improvement. Some suggestions:<br>
      1) I don't know enough about Hebrew type, but in terms of style it seems well-matched to the Arabic. The English however is too mainstream, not rigid enough; instead of Futura I'd use something like DIN, ot maybe something a little bit softer, and more contemporary, like Klavika*.<br>
      2) I would close up the gaps around the Arabic "seen" at the baseline - it's inappropriately unconventional this way. I think the Hebrew (and certainly the English, even if you change it to something like Klavika) is relatively conventional, no?<br>
      3) Considering the "tah-marboota" (the last letter of the first word in the Arabic) only occurs as the last letter of a word, I'd close up the wordspace, maybe even completely, or almost completely. The Hebrew and English are enjoying a nice tightness, and the Arabic could too.<br>
      4) By being absorbed into the Arabic "meem", isn't the top-left letter in the Hebrew getting lost, causing confusion? Maybe the word is clear enough thanks to context and familiarity however.<br>
      5) I know the Arabic font you're using in the main logo has a little bit of a readability issue, but I think you should try to use it in the subtext too - the Hebrew and English fonts are the same after all.<br>
      6) In the main logo, the Arabic is too strong - try shortening the ascenders.<br>
      7) In the subtext, the English should be a bit darker, and the wordspace greater (or maybe better: lesser in the Arabic and Hebrew).<br>
      8) I would right-justify the bottom two lines in the main logo (to get the two "E"s lined up, avoiding that distracting slight difference).</p>
      <p>* <a href="http://www.processtypefoundry.com/typefaces/klavika/index.html" title="http://www.processtypefoundry.com/typefaces/klavika/index.html">http://www.processtypefoundry.com/typefaces/klavika/index.html</a> _<br>
      If expense is an issue, you might get Eric to donate an EPS of your setting,<br>
      seeing as how it's for a good cause. But it's a great font to own too.</p>
      <p>Good luck with the effort, and I don't mean just the logo!</p>
      <p>hhp</p>
