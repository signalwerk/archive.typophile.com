      <p>wow, thank you all!!</p>
      <p>nicholas gross - thank you!! i do feel that the logo has a real problem with the composition, something in it looks to "stacked" rather than really placed in order.</p>
      <p>William Berkson - well it's all about the attitude of the organization. they claim to be a militant organization for peace, so the type matches the feel they want to promote. it's a choice i could made between a more smooth and reconciliation feel, and a more "we have to unite and fight (with no violence offcourse) for it".<br>
      living in israel, i have to say that the 90's were all about dreams for peace, thus the dove and olive branch. people were hopefull that the next decade will be different. the word peace was used many times. but in time i think both sides got more cinical, apathic, and desperate about the current situation. i personaly feel, that a shout would do more than a wisper. there is an israeli song that goes something like this: "sing, a song for peace, don't whisper a prayer. sing, a song for peace, in a great shout".</p>
      <p>hrant - your helping is awesome. you are right about the english type.  i think it's boring, it has no "personality" and i believe it will create problems in the future because it has no interesting features to use. however the DIN font has no wheight that is black enough to match the others. i haven't seen any suitable wheights from that family and neither does klavika. any other ideas for an english font would be welcomed.<br>
      im working on the the other things you mentioned as well righ now, so i will get back here with the changes as soon as im done. </p>
      <p>sch2525 - thank you, that's exactly what i wanted to say in the logo.<br>
      i will add and just say that yitzhak rabin, once an israeli prime minister that was assasinated was well known as the "soldier of peace" for his actions for peace. this is a kind of explanation to what i want the logo and the rebranded organization to express. it's all about uniting fiercly and non violently for peace.</p>
      <p>a question - is there a way to actualy show the images i attach here, inside the post, (rather than just being a link)?</p>
