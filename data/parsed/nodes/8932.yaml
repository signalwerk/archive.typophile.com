    date: 2005-01-28T09:50:00
    date_raw: 28 Jan 2005 — 9:50am
    votes: null
    html: "<p>About 5.5 years ago I had an allergic reaction to all the preposterous typeface-rationalization crap some people were coming up with, and wrote the below parody of two ficticious faces. <br> <br>Note: if you're in the middle of eating something you might want to wait... <br> <br>Regurgita embodies the ironic millennial paradigm shift <br>that inescapably results from applying tomorrow's child-like <br>vernacular meta-language to the form &amp; function of our <br>technocratic past. <br>By combining the progressive sensibilities of the Bauhaus <br>with the palimpsest of Granjon (a French punchcutter of aeons <br>past), the letterforms of Regurgita tap into the psychosomatic <br>turbulence of Humanity's future. <br>And because Regurgita's forms each contain two levels of <br>information, it is twice as readable. <br> <br>Helvomita carries Regurgita's spirit to the next level. It combines <br>the alphabet with an anomalous biological process, yielding the <br>typographic equivalent of partially-digested food coming out <br>the wrong end. The question is, would you eat that? <br> <br>hhp</p>"
