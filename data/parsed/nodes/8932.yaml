    html: "<p><i>I am sure this was taken out of context and meant as a joke. I can't imagine Erik disrespecting Adrian Frutiger. </i> <br> <br>I certainly would never denigrate Univers which is one of the greatest typefaces ever. Helvetica is one of the most successful typefaces ever. I meant that one cannot compare them, like apples and pears. Perhaps I used the wrong words to describe those two fruits, I have been known to do that. One excuse is that English is not my first language, so certain four-letter words mean less to me than to native speakers. <br> <br>I did, however, make this Helvetica t-shirt.  <br><img src=\"http://www.typophile.com/forums/messages/30/64449.gif\" alt=\"helvetica brokenscript\"> <br> Later found out, of course, that <i>this</i> t-shirt had previously existed, but unknown to me.  <br><img src=\"http://www.typophile.com/forums/messages/30/64450.gif\" alt=\"helevetica garamond\"> <br>Good ideas often have many parents. And Robin Kinross said back in 1992: <br> <br><b>Meta is the Helvetica of the 90s.</b> <br> <br>I still don</p>"
