    <p>Jonathan Hoefler is a typeface designer and an armchair type historian who specializes in the design of original typefaces. Named one of the forty most influential designers in America by <em><a href="/node/add/wiki?edit%5Btitle%5D=ID" title="Create node &quot;ID&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">I.D.</span> Magazine</a></em>, Hoefler’s publishing work includes award-winning original typeface designs for <em><a href="/node/add/wiki?edit%5Btitle%5D=Rolling%20Stone" title="Create node &quot;Rolling Stone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Rolling Stone</a></em>, Harper’s Bazaar, The New York Times Magazine, Sports Illustrated, and Esquire; his institutional clients range from the Solomon R. Guggenheim Museum to the rock band They Might Be Giants. Perhaps his best known work is the <a href="/node/add/wiki?edit%5Btitle%5D=Hoefler%20Text" title="Create node &quot;Hoefler Text&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hoefler Text</a> family of typefaces, designed for <a href="/node/add/wiki?edit%5Btitle%5D=Apple%20Computer" title="Create node &quot;Apple Computer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Apple Computer</a> and now appearing everywhere as part of the Macintosh operating system. Hoefler’s work has been exhibited internationally, and is included in the permanent collection of the <a href="/node/add/wiki?edit%5Btitle%5D=Cooper-Hewitt%20National%20Design%20Museum" title="Create node &quot;Cooper-Hewitt National Design Museum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cooper-Hewitt National Design Museum</a> (Smithsonian Institution) in New York. In 2002, The Association Typographique Internationale (<a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AT</span>ypI</a>) presented Hoefler with its most prestigious award, the <a href="/node/add/wiki?edit%5Btitle%5D=Prix%20Charles%20Peignot" title="Create node &quot;Prix Charles Peignot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Prix Charles Peignot</a> for oustanding contributions to type&nbsp;design.</p>
    <p>Hoefler is the founder of <a href="/node/12018" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hoefler <span class="amp">&amp;</span> Frere-Jones</a>, the type foundry he runs with designer <a href="/node/12062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tobias Frere-Jones</a>. The designer of more than five hundred typefaces, Hoefler’s published work includes <a href="http://www.typography.com/catalog/hoeflertext/index.html">Hoefler Text</a> and <a href="http://www.typography.com/catalog/hoeflertitling/index.html">Hoefler Titling</a>, <a href="http://www.typography.com/catalog/knockout/index.html">Knockout</a>, <a href="http://www.typography.com/catalog/mercurytext/index.html">Mercury</a>, <a href="http://www.typography.com/catalog/requiem/index.html">Requiem</a>, and <a href="http://www.typography.com/catalog/proteus/index.html">The Proteus Project</a>.</p>
