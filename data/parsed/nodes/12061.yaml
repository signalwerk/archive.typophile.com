    <p>Jonathan Hoefler is a typeface designer and an armchair type historian who specializes in the design of original typefaces. Named one of the forty most influential designers in America by <em><a href="/wiki/ID" class="freelinking" rel="nofollow">I.D. Magazine</a></em>, Hoefler's publishing work includes award-winning original typeface designs for <em><a href="/wiki/Rolling%20Stone" class="freelinking" rel="nofollow">Rolling Stone</a></em>, Harper's Bazaar, The New York Times Magazine, Sports Illustrated, and Esquire; his institutional clients range from the Solomon R. Guggenheim Museum to the rock band They Might Be Giants. Perhaps his best known work is the <a href="/wiki/Hoefler%20Text" class="freelinking" rel="nofollow">Hoefler Text</a> family of typefaces, designed for <a href="/wiki/Apple%20Computer" class="freelinking" rel="nofollow">Apple Computer</a> and now appearing everywhere as part of the Macintosh operating system. Hoefler's work has been exhibited internationally, and is included in the permanent collection of the <a href="/wiki/Cooper-Hewitt%20National%20Design%20Museum" class="freelinking" rel="nofollow">Cooper-Hewitt National Design Museum</a> (Smithsonian Institution) in New York. In 2002, The Association Typographique Internationale (<a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a>) presented Hoefler with its most prestigious award, the <a href="/wiki/Prix%20Charles%20Peignot" class="freelinking" rel="nofollow">Prix Charles Peignot</a> for oustanding contributions to type design.</p>
    <p>Hoefler is the founder of <a href="/wiki/Hoefler%20%2526%20Frere-Jones" class="freelinking" rel="nofollow">Hoefler &amp; Frere-Jones</a>, the type foundry he runs with designer <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>. The designer of more than five hundred typefaces, Hoefler's published work includes <a href="http://www.typography.com/catalog/hoeflertext/index.html" rel="nofollow">Hoefler Text</a> and <a href="http://www.typography.com/catalog/hoeflertitling/index.html" rel="nofollow">Hoefler Titling</a>, <a href="http://www.typography.com/catalog/knockout/index.html" rel="nofollow">Knockout</a>, <a href="http://www.typography.com/catalog/mercurytext/index.html" rel="nofollow">Mercury</a>, <a href="http://www.typography.com/catalog/requiem/index.html" rel="nofollow">Requiem</a>, and <a href="http://www.typography.com/catalog/proteus/index.html" rel="nofollow">The Proteus Project</a>.</p>
