    date_raw: 12.Oct.2003 9.34am
    votes: null
    html: <p>I think there was a discussion here a while back about what  <br>typeface was used for the Microsoft logo.  <br> <br>Obviously, they use ITC Franklin Gothic extensively in the  <br>corporate identity, but if you look closely at the logo, you  <br>will see that it is not Franklin Gothic (ITC or otherwise). All  <br>the obvious Franklin Gothic details (including Benguiat's  <br>"keyhole") are absent. In fact, it looks as much like  <br>Helvetica as Franklin Gothic, but not exactly like either.  <br> <br>It seems likely that it started out as one of those two, but  <br>was redrawn and modified.</p>
    html_clean: <p>I think there was a discussion here a while back about what  <br>typeface was used for the Microsoft logo.  <br> <br>Obviously, they use ITC Franklin Gothic extensively in the  <br>corporate identity, but if you look closely at the logo, you  <br>will see that it is not Franklin Gothic (ITC or otherwise). All  <br>the obvious Franklin Gothic details (including Benguiat's  <br>"keyhole") are absent. In fact, it looks as much like  <br>Helvetica as Franklin Gothic, but not exactly like either.  <br> <br>It seems likely that it started out as one of those two, but  <br>was redrawn and modified.</p>
