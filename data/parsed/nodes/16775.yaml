      <p>I wonder what would happen if you rounded the clipped edges of the B/square. It might imply the letter B without distracting too much from the nice simplicity of the e.</p>
      <p>I’m not sure though, I’m always hesitant to round corners on anything given its trendy nature. At least there would be a specific reason besides “It looks cool.”</p>
