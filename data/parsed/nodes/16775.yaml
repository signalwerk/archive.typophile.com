    date_raw: 13.Dec.2005 8.42am
    votes: null
    html: <p>Honestly, the ’b’ part was an afterthought, and looking at it now, it looks like one. After making the ’e,’ I reversed it out in a red square and then decided to cut the corners. I was more going for something that implied the shape of a ’b’ rather than an actual ’b’. I think I still want to do something with the red square, but I’m not sure what. Any suggestions?</p>
