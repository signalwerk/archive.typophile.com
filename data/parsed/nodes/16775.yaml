    <p>Hi everybody -<br>
    This is my first time posting here. Right now, I’m working on a personal mark that I can use on my resume, business card, online portfolio, etc. I want it to be very distinctive and have lots of character without it becoming too stylized to the point where it is considered trendy/kitch. I ended up using only my initials (EB). If people could gimme some critiquing, it would be much appreciated. I am new to this site, but have been reading other posts and noticed a good amount of valuable constructive criticism.<br>
    Thanks,<br>
    Eric</p>
