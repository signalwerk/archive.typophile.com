  - id: 99832
    user: 7561
    date: 2005-12-13T09:06:00
    date_raw: 13.Dec.2005 9.06am
    votes: null
    html: <p>How about the ’e’ in the red square? It makes the stylised ’e’ look more like a marque when it’s encompassed by the square and it gives it more punch. The ’e’ is so nice on its own that the nicks out of the square to make the ’b’ just interfere with the ’e’. I know it’s a simple solution, but I think that’s just what it needs - the ’e’ is interesting in itself, has relevance and looks ’designed’.</p>
