      <p>+I like the lower case letters in general, although the f, l, g, and s [the eternal problem in this style] don't seem to blend as well as the others.  The i,j,k series is very nice, but the two small diamonds in the l don't seem to help.  The f and g seem too busy, too many pieces.  They don't "read" as easily as the other letters.  Great work, keep it up.  I could be a customer!  Please keep me informed.[michael@bsiw.us]</p>
      <p>mgk</p>
