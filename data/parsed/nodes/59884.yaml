    html: |-
      <p>Great work, I like it. Reminds me of the seventies.</p>
      <p>Yet the T, P and R look a bit unstable - gravitationally challenged, as if they might break a leg one day. IMV the F is a bit too massive, crossing the baseline with not only a line but a triangular shape.</p>
      <p>If you want to try alternatives:<br>
      - use a triangle instead of two legs for the R (open the bowel to compensate too much weight)<br>
      - try to give the T some kind of umbrella stand.<br>
      - give the P a stronger stem (cf. I and H)<br>
      For the F I could think of something like: upper half as it is, lower half like the H without the vertical line at the right.</p>
      <p>Andreas</p>
