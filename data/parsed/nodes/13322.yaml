    <p>Hello everyone!</p>
    <p>Myself and two other brazilian typophiles are planning our trip to Helsinki, and since we’ll be quite far from home, we plan on staying more than just the conference days. Does anyone have any recommendations on type-related [or any other interesting] events that will happen in Europe close to ATypI? Conferences, workshops, exhibitions? I know “Europe” is a bit vague, but once you’ve crossed the Atlantic, a few more miles are no problem. ;)</p>
