      <p>Hi there!</p>
      <p>I am Gérard Mariscalchi, 69, self made graphic designer.</p>
      <p>I designed the font which I named "Toots" as a very humble homage to Mr. Villu Toots, one of the best calligraphers ever but, alas, ignored by most of today graphic designers and especially the youngest ones.<br>
      The splendor of his work left me breathless years ago and I measured my obvious limitations admiring his masterpieces.</p>
