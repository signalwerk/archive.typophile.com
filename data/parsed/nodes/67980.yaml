    html: |-
      <p>As I said before, there are really only three uppercase forms to go by, so all of the other UC characters are my own. The lowercase are definitely inspired by the look of his piece, but I don't think they are so unique that they couldn't just as easily come from numerous other calligraphers' hands. I've done similar calligraphy myself in the past without seeing Villu Toot's work. </p>
      <p>The inspiration I gleaned came from the combination of the uppercase (quite flourishing) with the more traditional lower case.</p>
      <p>As I said, given that the font has only a few of the uppercase forms along with the lowercase, the font really is more my work that has been inspired by his. I definitely wouldn't think of this as a duplication of Villu's work.  Thus, I don't think permission is really necessary at all from an ethical standpoint and definitely not from a legal one. But the idea of contacting relatives is a good one.  If they have any objections to the font being released, I'll cross that bridge when I come to it... but honestly, I don't think it will be an issue.</p>
      <p>thanks</p>
      <p>Rob</p>
      <p>P.S.  Anyone have any idea how to go about contacting relatives of Villu Toots?<br>
      (Only my mama is allowed to call me Robert-- and that's only when I'm in trouble)</p>
