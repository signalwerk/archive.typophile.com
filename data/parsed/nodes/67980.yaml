      <p>To be frank, I think you are on tricky ground having developed something closely based on another’s calligraphy without already having had some understanding/agreement with the artist.</p>
      <p>I agree with Gustavo’s caution. Unless this was taken up with the explicit permission of the calligrapher, I would beware of potentially misleading people about the nature of your interpretation by using the calligrapher’s name directly.</p>
      <p>But, at the same time, you should make every effort to acknowledge the original inspiration at every turn in your promotions and descriptions, so that there can also be no question about your sources.</p>
      <p>I suppose a certain amount of this depends upon how closely you have chosen to follow the original model.</p>
      <p>Since, as you say, this artist has recently passed, I think the right thing to do would be to get in contact with any surviving family or heirs to the estate to make sure that you cause no offense with your homage and that it is not interpreted as exploitation of another’s work.</p>
