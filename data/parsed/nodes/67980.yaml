      <p>Let's see if this works...</p>
      <p>I'm interested in comments... I know I should probably posted this as a knew thread in the critique section... but since this is related, I thought I'd place it here.</p>
      <p>The lowercase forms combined with more elaborate/decorative script caps is what intrigued me about Villu's piece. The more Roman looking caps here are my own creation and the script caps are a variation of Villu's work. The lowercase are based on Villu's hand, but the swashes are also my own interpretation.</p>
      <p>Rob</p><div class="imageWrap"><img src="http://typophile.com/files/CalligSample_5507.jpg"></div><p></p>
