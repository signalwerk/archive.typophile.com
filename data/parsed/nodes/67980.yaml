    <p>Nick had said in another thread that he thought it was ok to name a font after a calligrapher whose work the font emulates. I have a font I'm working on that I intend to release to the general public (shown here). It's based on a piece of Villu Toot's work. I would like to name it after him, but I'm not sure if it's a proper thing to do. </p>
    <p>While I respect your opinion, Nick... I was wondering if there are others here with opposing views. I don't want to be controversial in my decision for a name, and I thought it best to give some kind of credit to the person who inspired the font.</p>
    <p>Thanks in advance</p>
    <p>RL</p><div class="imageWrap"><img src="http://typophile.com/files/Tootssample_4638.jpg"></div><p></p>
