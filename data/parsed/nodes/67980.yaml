      <p>To most American calligraphers Villu's work is individualistic and unique. If you can access some of the books produced on Estonian, and Russian, lettering you would be surprised at how similar many of the Estonian artists' work is. Some are his students but many preceded him. I was delighted and surprised at the work included in Eesti Kirjakunst (1940-1970) which Villu compiled. Some of the work done in the 30's and 40's was way ahead of the work being done elsewhere, at least in the expressive arena. At his death, in '02, his ongoing "trilogy" was produced in one volume. Kiri Eesti kultuuriloos was published and is very abbreviated. Well worth seeking out. </p>
      <p>Read between the lines Rob!</p>
