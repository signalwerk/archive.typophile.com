      <p>Rob, if you're only basing the design on a few caps, it sounds like maybe its a tribute to him, certainly inspired by him, but it doesn't sound like you are slavishly copying his work. It seems like most all of the creative part of this design is your own. It would, I think, be appropriate to acknowledge where your idea for it came from, but I don't think in your case you need to go beyond that. Nice to know that you are trying so hard to stay within ethical standards though. </p>
