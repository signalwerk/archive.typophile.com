      <p>Diligence is all very well, but isn't it disrespectful <strong>not</strong> to name the font after the script's originator?<br>
      Consider Steinweiss Scrawl for example.<br>
      It was created as a font in 1939 by Alex Steinweiss, representing one of the most distinctive lettering styles of the mid 20th century, by a seminal designer/illustrator/calligrapher.<br>
      The only digital version available is named Hairspray, and there is no mention of Steinweiss at Fonts.com (Monotype), which publishes it, or at Myfonts, where it is shown.<br>
      Sure, a little googling will help make the connection, but this shows what can go wrong with relying on metadata, rather than making the assignation in the font name itself.</p>
