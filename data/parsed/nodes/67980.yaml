      <p>I used to know Villu Toots. I met him in Tallinn, in the summer of 1959, and we’ve become good friends… We stayed in touch for many, many years. I last saw him in Moscow, on the eve of his flight to America; that was in the summer of either 1987 or 1988. We had a few drinks for the success of his lecturing tour. Villu was a great guy, and a great calligraphy professional and enthusiast. He is fondly remembered <a href="http://www.callig.ru/node/27" rel="nofollow">not only</a> in his native Estonia.</p>
      <p>Robert, I think it would be proper if you got in touch with Villu’s [grand]children, and secured their permission to (<em>a</em>) use their [grand]dad’s calligraphy for your type design, and (<em>b</em>) use his name. Since you “intend to release [your font] to the general public”, that is to give it away [?], it would be even better if you offered it for sale, so the proceeds would go to, say, a special “Toots Foundation” at the <a href="http://www.artun.ee/index.php?lang=eng&amp;main_id=362" rel="nofollow">Estonian Academy of Arts</a>, or something like that.</p>
