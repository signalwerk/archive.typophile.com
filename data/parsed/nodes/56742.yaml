    <p>This weekend, while hanging with a fellow designer, I stumbled across a brilliant idea to incorporate 2 of my favorite things. Drinking and Design. It's rather simple actually.</p>
    <p>Pick up a Design Annual of your choice (PRINT and HOW do nicely). The more categories the better.</p>
    <p>Now flip to a random page/spread and spend a minute looking at it. Hand it off to your friend(s) and allow them the same time to peruse the page/spread.</p>
    <p>The idea... to select 1 design that you think is the best on that page/spread. Each person will make 1 selection and you will go around the room asking your friend which they thought was your selection. </p>
    <p>If they guess right, you drink, if they guess wrong they drink. If it's unanimous and everyone likes the same design, everyone drinks.</p>
    <p>Now, obviously there's a bit of trustworthiness involved. You can't go changing your answer if someone picks your design. Really, what's the fun in that anyway.</p>
    <p>I'd be interested if there might be more ideas to add to the fun.</p>
    <p>Remember, drink responsibly. Course I'm not your parents, so do what you want.</p>
