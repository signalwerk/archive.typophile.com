      <p>Haha yes, very true.</p>
      <p>It seems to be a question of appropriateness: I agree entirely with the notion of functionality and freedom of expression- but to what end? I guess my point is that it isn't possible to encode traditional vocal cues in purely screen-based type: it's a sign of a sign, if you will.</p>
      <p>I mean obviously, type is about communication, and creating a voice in type work. We seem to have explored this whole screen type thing, and, alone, it is not an appropriate way to present a conversation. Sure, we're going to get higher resolution screens and the correspondingly-designed versions of Arial/Times, but isn't this a pointless exercise?</p>
      <p>I'd say I'm trying to synthesize a more appropriate system of conversation through type work, taking into consideration technological developments as well as traditional practice.</p>
      <p>And thanks, I really appreciate your participation!</p>
