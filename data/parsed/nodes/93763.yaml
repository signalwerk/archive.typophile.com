    <p>Evening all, </p>
    <p>Just to briefly introduce myself: I'm Brad- a 22yr old Graphic Design student from New Zealand, and am a Masters Candidate at the Whanganui School of Design.</p>
    <p>My dissertation looks into the current "state" of type work, both in terms of typography and typeface design. My primary focus is the mechanization/digitization of type work: the influence that mass-production and distribution principles have on both the value of a piece of work, and the extent to which its meaning can be read.</p>
    <p>I'm fascinated with how these values relate to the origins of our language- ie. the spoken word and conversation. As cultural participants, we are bombarded with short, sharp digital messages. Books are read on mobile devices, newspapers presented on tablets. Digital media creates an illusion of productivity: the click-snap instant transfer of image and text interferes with our perception of conversation. Why write when you can email? Why call when you can text? The instantaneous, pixel-based nature of modern communication is at odds with thousands of years of evolution.</p>
    <p>The precise Bezier curves and 1200dpi digital printing of our visual language bear no semblance to the gestural, cursive origins of our written language. The pixel is so far removed from our spoken language that it no longer bears any symbolic reference to the intended phrase, leaving majority of tone and voice up to the interpretation of the recipient.</p>
    <p>As a paper, it will investigate the influence of speed: of production and of delivery. It will entertain traditional notions of craft with respect for the influence that technology has on type work, and will propose a synthesis between digital type practices and traditional craftsmanship, in order to restore the conversation within our type work.</p>
    <p><strong>Where are we headed? How many Garamond revivals do we need? Can the pixel carry any cues as to the voice of a piece of type- or does a physically crafted work achieve a better result?</strong></p>
    <p>I'm not asking for anyone to do anything for me, simply challenge my way of thinking- and hopefully I can do the same for you. Thank you in advance for your participation!</p>
