      <p>The only thing I would say is that conversing with dead people is not fruitful, and "restoring the conversation within our type work" does not require a "synthesis between digital type practices and traditional craftsmanship", it requires what it always has: a forward-looking synthesis between function and self-expression. For example in the sphere of typeface design the breaking of the link with handwritten letterforms is not a bug, it's a feature - because it allows for both better functionality and more freedom of expression. Interestingly this even applied to the hand-made metal types of yesteryear.</p>
      <p>hhp</p>
