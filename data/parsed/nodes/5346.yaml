    html: <p>Thanks Mike, <br> <br>Gateway and Luggagetag are both nice, but just not quite there. DaFont also didn't have anything I hadn't already seen. It's for a logotype, so I'm making my own letters, but I was looking for some inspiration as I haven't made this type of letter before (the R and N are a pig to get looking right ...). I think I'm getting it working now though. <br> <br>R <br></p>
