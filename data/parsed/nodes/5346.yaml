  html: <p>Have searched the archives and looked through a load of bitmap fonts but haven't really found what I'm looking for ... <br> <br>I need something that approximates a hi-res dot-matrix display, something like in this image of the MorganStanley stock ticker from Times Square. <br> <br>Doesn't need to have the 'pixels' separate if you know what I mean -- just a nice, fairly functional-looking bitmap. <br> <br>R <br> <br><img src="http://www.typophile.com/forums/messages/83/39130.jpg" alt="StockTicker"></p>
