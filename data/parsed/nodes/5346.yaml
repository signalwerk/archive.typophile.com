    html: <p>FontFont and Emigr� both have some fonts that would approximate this look, but they are not 'bitmapped' fonts, per se.  FF Gateway, Aircraft or Luggagetag might all do, if a font is in order. <br> <br>Look at DaFont.com if you really want bitmapped fonts, or do a search with Google on that term.</p>
