    html: "<p>Chesh: Looked at those already, but ta anyways. <br> <br>bj: I'm OK with the emulation bit (working on a grid in Illustrator and then scaling each grid square is my way at the moment). <br> <br>Jan: I obviously wasn't looking hard enough at DaFont. Some of those look useful. I think I'm still going to go with custom letters but these are at least a bit out of the mainstream. <a href=\"http://www.dafont.com/theme.php?cat=302&amp;page=1\" target=\"_blank\">BigDots</a> and <a href=\"http://www.dafont.com/theme.php?cat=302&amp;page=3\" target=\"_blank\">DS Point</a> are definitely in the right area. <br> <br>Thanks guys, very helpful as usual. <br> <br>R</p>"
