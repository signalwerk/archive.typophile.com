      <p>This is one of my biggest pet peeves. The main reason it is still happening is because teachers are still teaching it despite the fact that many manuals of style have changed to the 1 space rule. If you don't believe me (or my sources in graphic design training), check with the "goddesses of all things editorial" The Chicago Manual of Style. </p>
      <p>For those of you who asked why one space is better or necessary really surprise me. Perhaps you aren't designers or typesetters, but this was something I was taught back in Design 101. Two spaces after a period is only necessary and required on a typewriter or a font like Courier (which you hopefully aren't using). It does not look better with 2 spaces. Books are not professionally set with two spaces, even when typewriters were the big dogs, since books were laid out and printed on a press. Pull down any book on your shelf—you won't find two spaces between sentences. We don't need the extra space to tell us when a new sentence has started. Now, with the creation of fonts and computers, the extra space is actually distracting. If you are a designer, especially a layout designer, you should know and vehemently follow this. It isn't a matter of whether or not people are actually going to notice or care. The premise of graphic design in the first place is to do something so beautiful that the design disappears and the content takes precedence. Design should never be distracting.</p>
