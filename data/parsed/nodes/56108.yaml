      <p><cite>I think even color and compactness also argue for no spaces in intermediate initials—M.F.K. Fisher—as Bringhurst advocates. But Chicago Manual of Style disagrees.</cite></p>
      <p>Being both an editor and a typesetter, I make a compromise on this (and on some similar issues, like ellipses). I use thin spaces or sixth spaces, depending on the typeface. I've found that it makes enough space that other editors won't object (or haven't so far, anyway), while keeping the gaps within reason.</p>
