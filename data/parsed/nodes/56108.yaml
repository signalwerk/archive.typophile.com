      <p>&gt;by mostly very young people who prefer to type in lowercase only.</p>
      <p>Typing in lower case only is a sign of callow youth that thinks it's discovered a better way, and are going to teach their elders. They generally wise up after some time. </p>
      <p>The most serious effort at no caps was the Bayer, whose desire to do away with caps was a part of the movement in Germany to reject Blackletter, without simply imitating the rest of Europe. The idea was to use only all sans, no caps. (German capitalizes all nouns as well as beginnings of sentences.) It flopped also, though the Bauhaus effort to establish sans as useful in text has won out as an option.</p>
      <p>Lowercase-only is a much worse practice than double spacing after sentences, because it slows the reader down by removing an expected symbol of the beginning of a new sentence.</p>
      <p>It's interesting that TeX enables you to adjust space after sentences. I assume you have to tell the computer that a sentence has ended, as I don't know how you could distinguish an initial or abbreviation from a sentence end otherwise. </p>
      <p>You can also play with this in InDesign using an additional thin space after sentences. I just can't see a double space as an improvement, except for monospaced fonts--and honestly I don't even see a double space as helping there either, because the period takes such a huge "M" space in a monospaced font anyway. </p>
      <p>Charles, I think over kerning of punctuation, such as is done in Minion, is a bad idea. It seems that Slimbach, who is great otherwise, has thought better of it in more recent fonts, though I don't have them myself, to check in detail. </p>
      <p>Speaking of thin spaces, do you have an opinion on what thin space is most useful? I read thin spaces as 1/4, 1/5, and 1/6 em. What is best?</p>
