      <p>I never typed seriously on a typewriter (only playing around as a kid on my dad's old one, but I already had a computer by that time) and I've always used two spaces.  For me, it's just another unit of division.  Book, chapter, section, subsection, paragraph, sentence.  The double space helps me quickly (and unobtrusively) find each sentence in a paragraph, but isn't so much that it makes wide gaps.  It also makes it clear when a period is used as an abbreviation mark or as an end-of-sentence mark.  Disambiguation is rarely a bad thing, especially when it doesn't make the text look bad.  (I've never understood why people think that two spaces = unprofessional looking).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
