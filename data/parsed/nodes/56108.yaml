    <p>I'm curious to see if others are observing the same anachronism that I am.<br>
    I used to take it for granted that people would type text with two word spaces after a period, because that's how you learned it on a typewriter. I patiently searched and replaced the double word spaces with single word spaces when importing text into a page layout program.<br>
    That was years ago. Now, the workforce is well-stocked with men and women who have never touched a typewriter, maybe never even seen one except in the movies. They don't know what monospaced letters are, or why such things existed. And yet . . . <em>they type two word spaces after a period.</em> It's as if they were reflexively waving their left hands at the end of every line to push a phantom carriage return (if you don't know what that is, <a href="https://web.archive.org/web/20190921222630/http://click here/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://click here</a>).<br>
    Do any of you notice this? Can any of you (especially those under 35) tell me how this archaic habit survived into the 21st Century?</p>
