      <p>i'm not looking for a "right" answer, since typography is often<br>
      "in the eye of the beholder".  i'm merely trying to ascertain the<br>
      "general practice".</p>
      <p>so the default behavior of a well-regarded system is informative,<br>
      which is why i brought up tex.  there's a reason that's its default.</p>
      <p>and if a newer system -- which i'd assume would be indesign? --<br>
      has changed that default, then that is instructive to me as well...</p>
      <p>and when you experts here tell me what you do, in your work,<br>
      it's meaningful to me too, so thank you for all of the responses.</p>
      <p>in many ways, i have a distinct luxury, in that i'm not obligated to<br>
      make any decisions that would make end-users unhappy.  rather,<br>
      i can make it a _setting_ which they toggle to their _preference_...</p>
      <p>indeed, if there is a striking difference of opinion on any issue,<br>
      it's _best_ for me to leave it up to the user to decide how it goes.</p>
      <p>and it's pretty clear to me that that's the case with this matter...</p>
      <p>and that was pretty clear to me before this thread.  this is one of<br>
      those issues with a long history of controversy associated with it.<br>
      (all the way back to "the mac is not a typewriter" by robin williams.)</p>
      <p>heck, it's even got a wikipedia entry associated with it:<br>
      &gt;   <a href="https://web.archive.org/web/20190921222630/http://en.wikipedia.org/wiki/Double-spaced_sentences">http://en.wikipedia.org/wiki/Double-spaced_sentences</a></p>
      <p>***</p>
      <p>nepenthe said:<br>
      &gt;   How did you accomplish the longer sentence space automatically, bb?</p>
      <p>well, the answer -- i move the position of the pen a little to the right --<br>
      is obvious, so i assume you're _really_ asking some other question, but<br>
      since there are many it _could_ be, i'll just ask you to be more specific...</p>
      <p>-bowerbird</p>
