      <p><cite>Jan, I like the British (and Australian) convention of abbreviating titles (Mr, Dr, St, Rd, Mt) without periods, because it keeps paragraphs from becoming cluttered with unnecessary and confusing punctuation marks. . . .</cite></p>
      <p>So, how about initials -- like G. E. M. Anscombe? You drop the periods here, too? BTW, Chicago style (U.S. academic) requires a space between such initials. So if you have to set, say, W. A. Smith, P. A. Jones, etc., there is a hell of a gap between the initials.</p>
      <p>In some ways, things are worse with modern thinking: where the space can have a kern, you can really get things mucked up with some constructions. Kerning with three letters rather than pairs only might solve some of that, with the expense of a lot of kerning work.</p>
