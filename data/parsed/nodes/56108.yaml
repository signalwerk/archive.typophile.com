      <p>Cerulean, I would ask why specifically one <em>should</em> use only a single space.</p>
      <p>Academia is open to new ideas, but only if it actually shows a benefit.  Working as a teacher now and being a child of the internet age, having sent my first e-mail in 1989 when I was 4, and programming from shortly thereafter, I'm not convinced of the benefit of computers in education (at least in foreign languages).  I was forced to use it teaching as a grad student and I saw no benefit, if anything the opposite: it was all a money-grabbing ploy by the book companies that resulted in extra work for everyone with no extra benefit. *</p>
      <p>For me the only benefit with one space was to crunch an extra letter or two per line in a newspaper or magazina, something that didn't have much importance most other print media.  So, it's always seemed to me an economic decision instead of an aesthetic.  That or an arbitrary rule.  I'm sure every now and then I'll use a single space or a space and a half if it looks better given the font.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
      <p>* This is not to say I can't have my mind changed.  But what I think would work hasn't been developed and I don't yet feel like doing it myself.</p>
