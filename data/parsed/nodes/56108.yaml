      <p>Yes, it is a matter of custom, of audience. Like so many things, this custom isn't simply a "national" matter.</p>
      <p>When I started setting type, the 4-5-7 rule was in effect for the value of the word spacing used to set justified copy. That's 4 to 7 units of space, using an 18-unit em. Anyway, we got a literary journal to set. My now-wife was in charge of design and production, and agreed to a simple test. I set an article using 4-5-7 spacing, and reset it, using 5-6-8 spacing. The design people at the press were asked which they preferred; all of them preferred the 4-5-7. Then the editorial people were asked which they preferred. They preferred the 5-6-8 spacing.</p>
      <p>There are any number of such examples, but at most publishing houses, the aesthetic of the design &amp; production people rules, for the simple reason that they are the ones who control paying for manufacturing -- or increasingly today, do the work. The larger audience doesn't get a voice.</p>
      <p>FWIW</p>
