      <p>One good reason against using a longer sentence space is obviously to produce an even color in the textblock. But most young students, even today, are taught by their teachers to double the word space--as if the period and following capital letter weren't a sure enough sign. </p>
      <p>But the doublespace is not just a typewriter thing. I've seen it in a number of older books. Many of my philosophy books have a larger sentence space. But if you'll notice, most books set on composition machines seem to have a wider average word space then texts set on computers. Modern texts seem to have a word space of about 6- to 4-to-em spaces, while it is not uncommon to see 3-to-em and wider on the older books. I find that this gappy word spacing actually makes the wider sentence spaces seem <em>less</em> noticeable, since the ratio of normal to wide appears less than with the tighter spacing.</p>
      <p>I suppose if you thought it were important to make the beginnings of a sentence visibly obvious when scanning the page--I can't think of a situation in which this would be important--then you might want to keep that second space. But if the document is something which lends itself to continuous reading, such as a novel, I'm not sure that one could defend it except by appeal to subjective preference.</p>
