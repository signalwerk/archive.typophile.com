      <p>kentlew said:<br>
      &gt;   No.</p>
      <p>ok, good.  thanks.</p>
      <p>now let me be a bit more specific.</p>
      <p>although bringhurst doesn't see any need for sentence-space<br>
      that's larger than the normal word-space, the _default_ in tex<br>
      is for an enlarged sentence-space, is it not?</p>
      <p>and, to prevent this from happening incorrectly mid-sentence,<br>
      the exception to this is when the word which is terminated with<br>
      a period is capitalized, the assumption being it's an abbreviation?</p>
      <p>indeed, the mere fact that the term "sentence-space" _exists_<br>
      means typographers differentiate it from "word-space", not?</p>
      <p>the /frenchspacing declaration turns the tex default _off_, not?<br>
      which implies a sentence-space is expected _in_english_, not?</p>
      <p>so i guess the more specific form of the question would be "what<br>
      _percentage_ of book-designers use an enlarged sentence-space?"</p>
      <p>note that by "enlarged", i emphatically do _not_ mean twice as large.</p>
      <p>and a follow-up question would be, "has this percentage changed<br>
      in the last 100 years or so?"  i ask this because i'm accustomed to<br>
      working with public-domain texts, and i'm quite certain that these<br>
      older books did indeed typically use an enlarged sentence-space.</p>
      <p>***</p>
      <p>altaira said:<br>
      &gt;   William: I mentioned the “lowercase generation”</p>
      <p>i find it amusing you think that "we" constitute a "generation"...<br>
      i haven't known anyone else who sticks to lowercase exclusively.</p>
      <p>&gt;   because I find it kind of funny/cute to observe how young hipsters</p>
      <p>i also find it amusing you think i am "young" and a "hipster"...<br>
      i'm probably older than you are, and probably...  well i probably<br>
      _am_ hipper than you, but i'm not sure how you would gauge it.</p>
      <p>&gt;   who refute traditional stuff! even capitalization!</p>
      <p>i reject quite a bit of "traditional stuff", because it's _stupid_.</p>
      <p>but i decline to use capital letters purely as an artistic statement.<br>
      (well, the fact that capital letters are _ugly_ plays a part as well.)</p>
      <p>there are times when it would be handy to use some uppercase.<br>
      i look at those times as accepting a constraint voluntarily, which<br>
      is a good thing for an artist to do.  (or anyone else, for that matter.)</p>
      <p>&gt;   sometimes refer back to something as quaint<br>
      &gt;   as the typewriter habit of double spaces</p>
      <p>as other people have pointed out, we see a use for an enlarged<br>
      sentence-space -- and it's worth noting that we've specified that<br>
      we don't need that sentence-space to be _twice_ as large as the<br>
      word-space -- so it's not accurate to describe it as being "quaint".</p>
      <p>besides, if you grant that it's needed in the _typewriter_ situation,<br>
      then it's worth noting that many of our current situations haven't<br>
      morphed completely out of that situation, like monospaced e-mail.<br>
      (i haven't used monospace in my e-mail for the last 25 years myself,<br>
      but some people -- including even here, i bet -- use it to this day.)</p>
      <p>&gt;   like a last faint attempt to make their sentences readable…<br>
      &gt;   (See, our very own lowercase bird does this too.)</p>
      <p>it _does_ make my sentences more readable, since i'm missing the<br>
      capital-letter at the start of a new sentence, which is the biggest tip.</p>
      <p>but i think the enlarged sentence-space makes text more readable<br>
      even if one uses the standard casing, by marking sentence-endings.</p>
      <p>still, you wouldn't know i use two spaces unless i had told you, since<br>
      the browser regards the second space as something nonsignificant...<br>
      (unless you have a weird habit of doing "view source" on these pages.)</p>
      <p>-bowerbird</p>
