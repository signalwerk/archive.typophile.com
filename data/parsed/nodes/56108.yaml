      <p>I imagine that a reader who is neither a typographer nor a type designer would either notice or care if word and sentence spaces are are easy to distinguish, at least not while reading. Just like many people don't notice whether there's space around a dash or not, or whether letters are perfectly spaced, and other subtle things like that. It seems to me that even collisions in combinations like "T.T" and "T.V" are more of a concern for typographers than readers. Would I care if I saw such a collision? Of course! Would many others? Probably not. So I guess it is up to the preference of who ever is paying the bill or whoever controls the typesetting choices. I can definitely see the advantage from a functional, as opposed to aesthetic, perspective of using a wider word space. But I've never heard anyone who wasn't involved in type-related fields ever mention that they wish typeset materials would return to the wider space, or that the continuous word spacing poses a challenge to their reading.</p>
      <p>I'm finding this really interesting. I had always just dogmatically assumed a preference for consistent spaces for everything but abbreviations, where I prefer thin spaces. But I typeset using mostly my own fonts, which are kerned to accommodate this usage. It seems that there is a stronger argument for using wider sentence spaces than I thought! Although I do think a ratio of 1.5:1 would be greatly preferable to 2:1.</p>
