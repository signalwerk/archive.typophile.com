      <p>Bill (as I take a break from placing 95 pictures with long captions in a 700+ page book), I don't think there is any answer. If you ask an old Linotype operator, he'd tell you that a thin space is an unexpanded spaceband -- about 2 points if you are using thin spacebands. Of course, the Linotype linecaster wasn't on the em-system; a Monotype operator would give a different answer.</p>
      <p>With modern computer fonts, back from the days when I was using TeX, I've used 155 units (1,000 unit em) for a thin space. I've been edging downward; sometimes using as little as 100 units. For me, a thin space should be recognizably smaller that the smallest wordspace that could occur with a justified setting. Obviously, with condensed fonts you need a correspondingly smaller value for a useful thinspace.</p>
      <p>What I put in Unicode 2009 depends on the font and it's nominal wordspace. I'm having to adjust -- TeX wordspaces are not characters, and you can program whatever you want for other spaces more or less "on the fly." InDesign requires both to be "in the font."</p>
      <p>My starting point is a thinspace (2009) about 150 units, with a hairspace (200A) about 55 units.</p>
      <p>BTW, we never used "French spacing" with TeX, but there is a way to signal when to use it in the file. Offhand, I can't remember just how.</p>
