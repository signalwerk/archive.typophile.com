      <p>I'm so used to reading all lowercase online—on websites and in emails—that I'm now getting used to it myself. However, I think <em>most</em> people don't do it as an artistic statement, but out of laziness: no need to hit the shift key and the letter key at the same time (phew!).</p>
      <p>But other than with TeX, which almost no one uses anymore, there is no straightforward way to automate this kind of spacing that I know of. I guess rather than use a space and a thin space, one could use an en space for sentences. But you'd still have to check each one in the document on replace, and I don't think I'd do that by choice if I were typesetting a long document.</p>
