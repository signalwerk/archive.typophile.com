      <p>@ Jan,</p>
      <p>preventing such bad breaks is the typesetters responsibility, not the font makers.</p>
      <p>@ All of you,</p>
      <p>There seems to be a profound difference in thinking between many people who make type, and people who use type, or just read. Theory &amp; practice, I suppose, but the world is better when the two are close to each other.</p>
      <p>As for not using a space between initials: Quick, how many of you kern the period after a W, T, V, etc.? Most everybody. And a number of fonts I've seen have the period kerned so tightly the advance after the period places the next character closer to a "W+period" sequence than to a plain "W". Now, how many of you also kern a period going *into* W, V, T, etc? Not as many, but some.</p>
      <p>All right, with such kerning, set "T.T.", "T.W." "W.W." etc. and watch things overlap.</p>
      <p>* * *</p>
      <p>I too tried using the thin space between initials, and about the 5th book, got some "P.E.--use equal space" with the space between initials and a word space circled. Just because editors don't agree with you doesn't mean they don't have a good eye.</p>
      <p>Likely these were on looser lines, which are sometimes unavoidable (like when "strengthen" is trying to be the last word on the first line of a paragraph). But occasionally, you wind up using a word space smaller than a thin space in a justified setting, and the the thin-spaced initials again stick out.</p>
