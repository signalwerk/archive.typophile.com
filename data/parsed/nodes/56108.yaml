      <p>Bringhurst--the Elements of Typographic Style--and Felici--the Complete Manual of Typography--strongly reject double spaces after sentences. The Chicago Manual of Style rules against them as well--both in manuscripts and in final publication. </p>
      <p>I agree. I think it only made sense: 1. In trying to make high contrast 'modern' typefaces in the 19th century, which were relatively unreadable, more readable in extended text. 2. When using monospaced typewriters, or monospaced fonts that imitate them. </p>
      <p>Because of the big space around a period, and the following cap, one word space between sentences still gives plenty of space to distinguish it from a normal word space. You could argue for slightly more, I suppose, but I just can't see a full extra word space as defensible.  </p>
      <p>There is such unanimity on this, at least in English, and has such a force of logic behind it--you put unnecessarily big holes in the text--that I think to double word space after sentences at this point in time is a blunder to be avoided. It is defensible if imitating a typewriter, but otherwise I don't see how. </p>
      <p>I think even color and compactness also argue for no spaces in intermediate initials--M.F.K. Fisher--as Bringhurst advocates. But Chicago Manual of Style disagrees.    </p>
      <p>In publishing whatever the money wants is more important that typographic nicety, but from a typographic point of view no double spacing really makes sense.</p>
