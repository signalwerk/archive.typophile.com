      <p>&lt;&lt;  a Monotype operator would give a different answer. &gt;&gt;</p>
      <p>Indeed, Charles, there was a way to get very thin spacing on a Monotype. Late-model machines employed a feature called "unit adding." With this one could add space to the right side of the last letter in a word and delete the word space following. This could give very thin space between words.</p>
      <p>There was also the possibility to subtract units from the body of some sorts and thus achieve, for instance, a kerned Wa combination right off the caster. In large display that was a huge bonus because the hand comp would not have to fiddle with the saw to make the kern.</p>
      <p>Exactly how unit adding worked in concert with the Monotype's justifying system I do not know. I never learned the unit adding technique because my time as a Mono keyboarder was pretty short. Good keyboard operators could make great looking lines of type with these and some other tricks. I hope someone is teaching these tricks to the hardy band of young folks who are learning Monotypes today.</p>
      <p>powers</p>
