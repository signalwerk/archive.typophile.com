    html: <p>John - you could always outline the paths. <br> <br>On the other hand fonts are created to be used and as such should be allowed to be embedded. I'm not sure how you could actually recreate a font from a pdf? Maybe the licenses should be more relaxed. <br> <br> I'm aware of some licenses allowing printers/prepress houses to use a copy for the express purpose of printing that document. All licenses should reflect real world usage - who wants to pay good money for a one off usage of a font only have it unprintable due to a printer not having it? (Or paying extra on the print job for the same reason!) <br> <br></p>
