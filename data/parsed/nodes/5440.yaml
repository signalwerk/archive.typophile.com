  - id: 39170
    user: 1215
    date: 2004-07-02T08:13:00
    date_raw: 2 Jul 2004 — 8:13am
    votes: null
    html: "<p>Marius -- <br> <br>I alerted Harry Parker at Font Bureau to your unanswered e-mail. He said he's been swamped and hasn't been able to answer all the general e-mail. I hope that he has replied to you by now. If not, let me know. <br> <br>Re: Font Bureau EULA. <br>This is not an official interpretation, so don't quote me . . . but, I believe the FB license is meant to allow embedding for a PDF print workflow, when the document is just being sent to a service bureau or commercial printer for direct output to film or plates for print reproduction. And to allow embedding in uneditable documents for sharing with clients for comping and approval purposes only.  <br> <br>On the other hand, I believe what they want to curtail (without an expanded, specific license for such) is embedding for digital documents that are being published and distributed online or in an all-digital environment -- i.e., where the digital document is the end-product. Or editable documents that are meant to be passed back and forth in a workgroup and edited using the embedded fonts by others who don't have the fonts licensed and resident on their machine. <br> <br>I've alerted FB that this is an area of confusion and frustration, and I've been told that they're in the process of clarifying what the EULA allows and forbids in this regard. <br> <br>Hope this helps. <br> <br>-- Kent. <br></p>"
    html_clean: "<p>Marius -- <br> <br>I alerted Harry Parker at Font Bureau to your unanswered e-mail. He said he's been swamped and hasn't been able to answer all the general e-mail. I hope that he has replied to you by now. If not, let me know. <br> <br>Re: Font Bureau EULA. <br>This is not an official interpretation, so don't quote me . . . but, I believe the FB license is meant to allow embedding for a PDF print workflow, when the document is just being sent to a service bureau or commercial printer for direct output to film or plates for print reproduction. And to allow embedding in uneditable documents for sharing with clients for comping and approval purposes only.  <br> <br>On the other hand, I believe what they want to curtail (without an expanded, specific license for such) is embedding for digital documents that are being published and distributed online or in an all-digital environment -- i.e., where the digital document is the end-product. Or editable documents that are meant to be passed back and forth in a workgroup and edited using the embedded fonts by others who don't have the fonts licensed and resident on their machine. <br> <br>I've alerted FB that this is an area of confusion and frustration, and I've been told that they're in the process of clarifying what the EULA allows and forbids in this regard. <br> <br>Hope this helps. <br> <br>-- Kent. <br></p>"
  - id: 39171
    user: 2925
    date: 2004-07-02T09:08:00
    date_raw: 2 Jul 2004 — 9:08am
    votes: null
    html: "<p>Hey Kent, <br> <br>Thanks. I contacted Christian Schwartz and he also gave me Harry's email address. The <a href=\"mailto:info@fontbureau\">info@fontbureau</a> address seems to be getting tons of spam, and I wrote to Harry, who has been very helpful. <br> <br>About embedding in PDFs: as far as I know, this is reminiscent from the old days when you could extract at least the glyphs from the temporary files Acrobat created when reading a PDF. <br> <br>It seems that extracting fonts from PDF version 1.5 or better is impossible. Maybe Thomas Phinney could tell us more? <br> <br>Same thing goes with Flash - most embedded glyphs are optimized, and lose details - they are not original shapes. <br> <br>Anyway, I think foundries should adapt their EULA to take into account the current technologies, and not restricting the users. <br> <br> <br></p>"
    html_clean: "<p>Hey Kent, <br> <br>Thanks. I contacted Christian Schwartz and he also gave me Harry's email address. The <a href=\"mailto:info@fontbureau\">info@fontbureau</a> address seems to be getting tons of spam, and I wrote to Harry, who has been very helpful. <br> <br>About embedding in PDFs: as far as I know, this is reminiscent from the old days when you could extract at least the glyphs from the temporary files Acrobat created when reading a PDF. <br> <br>It seems that extracting fonts from PDF version 1.5 or better is impossible. Maybe Thomas Phinney could tell us more? <br> <br>Same thing goes with Flash - most embedded glyphs are optimized, and lose details - they are not original shapes. <br> <br>Anyway, I think foundries should adapt their EULA to take into account the current technologies, and not restricting the users. <br> <br> <br></p>"
  - id: 39172
    user: 909
    date: 2004-07-02T10:30:00
    date_raw: 2 Jul 2004 — 10:30am
    votes: null
    html: "<p>Regarding embedding and extracting fonts from PDF: <br> <br>- yes, it is technically possible to extract fonts from PDFs. The kerning and any additional layout tables will generally be lost. Any glyphs not embedded will be lost. <br> <br>- More recent flavors of PDF make it even harder in that the encoding is very non-obvious. Of course, it once the font is in a font editor one can re-encode it, but there's extra work involved, probably manual work. <br> <br>Generally, Adobe does not claim that PDF is secure against having fonts extracted. But stuff gets lost along the way, and there are much easier methods of pirating fonts. We use PDFs for samples and such of our own fonts, and do not know of any significant real-world piracy resulting from this practice (although some font developers have certainly demonstrated the theoretical possibility). <br> <br>Regards, <br> <br>T</p>"
    html_clean: "<p>Regarding embedding and extracting fonts from PDF: <br> <br>- yes, it is technically possible to extract fonts from PDFs. The kerning and any additional layout tables will generally be lost. Any glyphs not embedded will be lost. <br> <br>- More recent flavors of PDF make it even harder in that the encoding is very non-obvious. Of course, it once the font is in a font editor one can re-encode it, but there's extra work involved, probably manual work. <br> <br>Generally, Adobe does not claim that PDF is secure against having fonts extracted. But stuff gets lost along the way, and there are much easier methods of pirating fonts. We use PDFs for samples and such of our own fonts, and do not know of any significant real-world piracy resulting from this practice (although some font developers have certainly demonstrated the theoretical possibility). <br> <br>Regards, <br> <br>T</p>"
