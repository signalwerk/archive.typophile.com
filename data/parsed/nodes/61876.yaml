    html: |-
      <p>To get to grips with this I have started to compile a spreadsheet which helps alot when grabbing lists of letters for Opentype code.<br>
      I haven't got quite this far yet - but if you had 4 columns, (expressed here in rows!) might help...</p>
      <p>[1] lowercase, (list continues with diacritics)<br>
      [2] Capitals, (list continues with diacritics)<br>
      [3] small caps: lowercase alternates, (list continues with diacritics)<br>
      [4] small caps: Capitals alternates, (list continues with diacritics)</p>
      <p>Once small caps are done - it might take me a day to sort out diacritics<br>
      and when that's done the duplicate 'Capital alternate' set should be simple enough to populate.</p>
      <p>Good Luck.</p>
