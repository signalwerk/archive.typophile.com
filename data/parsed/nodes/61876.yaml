    <p>Hi everyone!<br>
    after some search on web and typophile did not found a "anwser" to my question. So please help me with some info regarding small caps.<br>
    Is "standard" procedure to do small caps with diacritics? Only A-Z?<br>
    Please share some info on this please.</p>
    <p>António</p>
