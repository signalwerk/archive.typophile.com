  html: |-
    <p>The Golden Gate Bridge just celebrated its 75th anniversary.  I was wondering what typeface would best represent it.<br>
    Some attributes to think about…<br>
           -Built in 1937<br>
           -American Design<br>
           -Bridge Style: Art Deco / Modern</p>
    <p>I am leaning towards:<br>
           -Broadway<br>
           -Gill Sans<br>
           -Franklin Gothic<br>
           -Din<br>
           -Bank Gothic</p>
    <p>I would appreciate any thoughts.</p>
