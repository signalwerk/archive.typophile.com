    votes: null
    html: <p>The best second hand and antiquarian typography bookshop in London is Collinge &amp; Clarke on Leigh Street, north east of the British Museum and Russell Square. Definitely worth a visit. Just around the corner from them is Judd Books, which is a remainder shop that usually has some good stuff in their books-on-books section.</p>
    html_clean: <p>The best second hand and antiquarian typography bookshop in London is Collinge &amp; Clarke on Leigh Street, north east of the British Museum and Russell Square. Definitely worth a visit. Just around the corner from them is Judd Books, which is a remainder shop that usually has some good stuff in their books-on-books section.</p>
