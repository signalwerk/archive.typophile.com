    date_raw: 16 Aug 2004 — 1:00pm
    votes: null
    html: <p>Also, the bookshop at the British Library is excellent. It focuses on book typography rather than graphic design, but it has an excellent selection of scholarly books on type and printing history, many published by the BL. It is only a short walk north from Collinge &amp; Clarke.</p>
