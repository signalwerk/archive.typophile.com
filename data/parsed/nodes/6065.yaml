    html: <p>I was there just a couple of weeks ago scouting around for bookshops.  <br>There's a concentration of bookshops around Leicester square tube station.  <br>A lot are second hand shops, which are pretty much useless. There are also  <br>a few good shops on Charing Cross Road, literally one minute's walk north  <br>of Leicester Sq tube. There was one ... I can't remember its name ... but it had  <br>a lot of stuff you can't usually find elsewhere, a lot of Hyphen Press stuff. It's  <br>a good job I was short of cash, or I would have emptied my wallet. </p>
