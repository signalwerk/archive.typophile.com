    html: |-
      <p><cite> &gt; What is incredible to me is that without using any electronics — without having any kind of "brain" or processor — the keyboard is able to do the necessary division to arrive at these numbers. </cite></p>
      <p>Yes, this was indeed a brilliant bit of mechanical computing. </p>
      <p>This is also the crux of the reason for unitized widths in Monotype designs, which we often talk about, but which I don’t think [young] people realize the rationale behind.</p>
      <p>The Linotype had a completely different method for justifying mechanically (the tapered spaceband). And it had it’s own bit of brilliant mechanical computing for the sorting and redistribution of the matrices.</p>
      <p>These two hot-metal composing/casting machines really were *amazing* inventions.</p>
      <p>Excellent descriptions, Joshua. Congratulations on the whole experience.</p>
