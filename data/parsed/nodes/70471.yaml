    <p>Here is a book about wood that i found. (well i found it at a friends house but they didnt really care so i took it) </p>
    <p>its pretty interesting if not a little bit sloppy in the way it has been set. Well maybe not sloppy but there are better type set books.</p>
    <p>My question is this. At the foot of some of the pages there is a number (4,604) just to the left of the page number with a letter (from B to M) on the right on the page number. I think they are section markers and the number i can only guess is a word count. Is this right and if it is why is it there. was this a visual note to the book maker?</p>
    <p>anyway hope this makes sense and if not just have a look at the book. its alright.</p>
    <p>thanks</p>
    <p>P</p>
