    html: <p>The letter L on the right will be a signature mark, but I would guess that the 4,604 on the left will be the printer's job number for this title. It could be useful for this identification to be known in the bindery, partly to ensure that signatures from one book weren't accidentally bound with signatures from another; and partly, perhaps, for administrative purposes, so that workers would know which job number to enter on their work dockets (or something like that).</p>
