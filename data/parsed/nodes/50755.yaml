    html: <p>This is very cool, almost art decoish perhaps? I like some of the letters a lot more than others - A, B, K, M, N, X are my favorites. A couple of thoughts, probably ill informed and unhelpful — I think there may be too many geometric elements. Some of the letters are a clunky (S), and others seem not to fit in. For instance, B, P, and R all have somewhat different bowls. I actually really like the R and I suppose one shape wouldn't work for all three letters, but currently the P feels quite foreign. (I'm not sure about the diamond on the P either) Just a few random notes - G is the only letter without any ornamental thin lines, some curves taper to hairlines and others to more substantial intersections, and the Y is odd to my eye. Maybe structure it along the lines of the H? The numerals feel more Didone than blackletter but I imagine it is difficult to avoid. This seems like quite a tricky concept but for the most part it looks really good. Unfortunately I am not cleverer enough to actually be helpful when it comes to the rough edges. Sorry.</p>
