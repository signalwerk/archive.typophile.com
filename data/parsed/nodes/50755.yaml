  html: <p>So this is Vexation, a display face I'm working on based off black-letter forms with a strict geometric system. Its got some issues so any feedback would be greatly appreciated, and it is still a work in progress so rip it to shreds if you want to.<img src="/sites/default/files/old-images/Vexation_5377.jpg"></p>
