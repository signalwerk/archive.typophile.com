    <p>Hi folks,</p>
    <p>Does anyone here know what this font is.  I am not sure what word you would use to search for similar fonts - Victorian or Western perhaps?  I assume the font on the top line has been modified and the squiggle lines at either end have been added.  Any help is appreciated. </p>
