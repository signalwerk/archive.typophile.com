    html: <p>It is something along that line, however Tuscan fonts appear to usually have split ends on the letters.  The centre spurs are similar to some of the Tuscan fonts and to Old or Wild West fonts, but the curls on the P, B and E are different.  Now I am driven to find out what this font is ;)  It certainly is handsome.</p>
