  html: |-
    <p>I'm new to Robofont and opentype features. This is in fact my first foray in producing a font. I've got a base character set and and alternate characters for many of them. </p>
    <p>At the moment I am using stylistic alternates, but am finding that when I try to use the font in Illustrator or InDesign I change a character to it's alternate and all the following characters I type are also alternates when applicable. This doesn't happen all the time, only at certain times.</p>
    <p>Tried using feature ss01 and ss02 to define the .salt1's and .salt2's but I got the same issue regardless.</p>
    <p>Any advice on how to properly code multiple alternate characters and not have them replace base characters when typing would be appreciated. </p>
    <p>Thanks</p>
    <p>CODE:</p>
    <p>feature aalt{<br>
    feature salt;<br>
    feature liga;<br>
    } aalt;</p>
    <p>feature salt { # my Stylistic Alternates<br>
    		sub a from [a.salt];<br>
    		sub A from [A.salt];<br>
    		sub three from [three.salt];<br>
    		sub four from [four.salt];<br>
    		sub five from [five.salt];<br>
    		sub B from [B.salt B.salt2];<br>
    		sub D from [D.salt];<br>
    		sub E from [E.salt E.salt2];<br>
    		sub F from [F.salt];<br>
    		sub H from [H.salt];<br>
    		sub I from [I.salt];<br>
    		sub R from [R.salt];<br>
    		sub u from [u.salt];<br>
    		sub z from [z.salt];<br>
    		sub Z from [Z.salt];<br>
    		sub T from [T.salt];<br>
    		sub N from [N.salt];<br>
    		sub ampersand from [ampersand.salt];<br>
    	} salt;</p>
    <p>feature liga { # my Ligatures<br>
    		sub f f by f_f.liga;<br>
    		sub f i by f_i.liga;<br>
    		sub f l by f_l.liga;<br>
    		sub f f i by f_f_i.liga;<br>
    		sub f f y by f_f_y.liga;<br>
    	} liga;</p>
