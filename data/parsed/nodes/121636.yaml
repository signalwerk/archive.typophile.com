    html: <p>I think the problem here is your apps rather than the font. In Illustrator when you select a .salt glyph while typing it switches the "salt" feature on from that point on unless you flip it back immediately. I find that kind of behavior annoying, but that's how it's set up. So I always recommend setting all of your text first. That will put in ligatures and contextual alternates by default unless you deselect those features. Then afterwards you can either switch on salt or any other available feature to the whole thing, or use the glyph palette to change individual letters. I don't use InDesign all that much, but I suspect it has similar behavior with stylistic sets.</p>
