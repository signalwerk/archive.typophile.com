    html: |-
      <p><cite>"implement a sophisticated font crit tool"</cite><br>
      The «point to something inside an image» thing? Yes that is cool, but I don't even think you need Flash to do that.* (Someone with knowledge of the Canvas element &amp; such, please correct me if I'm wrong.)</p>
      <p>HTML has been growing up Hrant. The capabilities of HTML 5 and CSS 3 are much more of a reason to «bash Flash» – it's simply not necessary any more for most of the stuff it's been used for, and HTML is far superior in its lean-ness and its open-ness. Remember how back in the day, many people thought we «need» Java applets? :)</p>
      <p>(* All that said: To me using Flash for isolated tasks where it adds functionality that you can't have with HTML –as long as it degrades gracefully for people who can't view Flash– would be open for debate on a case-by-case basis. But that's really something else than having a site's core infrastructure and basic navigation rely on Flash to the extent that it does here.)</p>
