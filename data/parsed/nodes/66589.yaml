  html: <p>Every comment needs a permalink. A <a href="http://www.w3.org/TR/html4/struct/global.html#adef-id" title=" id attribute" rel="nofollow">fragment identifier</a> (starting with a letter, followed by letters, numbers, dashes, or periods) is sufficient if such is exposed to us without having to view source. (It doesn’t have to be like Twitter, where every Twit gets its own Web page.)</p>
  html_clean: <p>Every comment needs a permalink. A <a href="http://www.w3.org/TR/html4/struct/global.html#adef-id" title=" id attribute" rel="nofollow" class="link-external">fragment identifier</a> (starting with a letter, followed by letters, numbers, dashes, or periods) is sufficient if such is exposed to us without having to view source. (It doesn’t have to be like Twitter, where every Twit gets its own Web page.)</p>
