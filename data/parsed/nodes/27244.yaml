    date_raw: 27 Jan 2002 — 5:06pm
    votes: null
    html: "<p>I suspect that Günter Gerhard Lange supervised the digitization of Standard for the PostScript version of Akzidenz Grotesk, as he was only born in 1921, while Standard/Akzidenz was introduced by Berthold in their 1896 catalog. I've found no information about the original designer. <br> <br>More information about Günter Gerhard Lange can be found at MyFonts.com: <br> <br><a href=\"http://www.myfonts.com/Person205.html\" target=\"_top\">http://www.myfonts.com/Person205.html</a> <br> <br>Information about the H. Berthold Foundry: <br> <br><a href=\"http://www.myfonts.com/FontFoundry68.html\" target=\"_top\">http://www.myfonts.com/FontFoundry68.html</a> <br>and <br><a href=\"http://www.bertholdtypes.com/home.html\" target=\"_top\">http://www.bertholdtypes.com/home.html</a> <br> <br>David</p>"
