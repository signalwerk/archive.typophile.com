      <p>A few things to look for are fonts that look similar, fonts that were designed by the same designer, or fonts that were designed in the same time period. The book *The Elements of Typographic Style* by Robert Bringhurst is a great book that has a chapter on choosing and combining type.</p>
      <p>A few good serif and sanserif combination's are; Haas Claredon and Helvetica, Memphis and Futura, Berthold Bodoni and Futura, Meridien and Frutiger, as well as Syntax and Minion, .</p>
