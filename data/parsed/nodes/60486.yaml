  html: |-
    <p>How do you feel about breaking the baseline grid in a more complex table of contents?</p>
    <p>I've come across such a situation and have tried different solutions, yet it always seems to work best when I add some diversity and am in turn forced to break the grid. Since tables of contents often require more detailed control than the main text, I presume it's OK to design them a bit differently while still following the main established design principles.</p>
