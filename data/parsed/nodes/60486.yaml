    date: 2009-07-31T06:33:00
    date_raw: 31 Jul 2009 — 6:33am
    votes: null
    html: |-
      <p>There's nothing at all wrong with breaking the grid on a TOC. I do it all the time. The earlier suggestion about using a grid that is half the line advance of the text is a good place to start.</p>
      <p>I'd also suggest that you pull the column of page numbers to the left so there is about 1.5 to 2 ems only from the end of the longest line to the page numbers. That will lessen the overall gap between titles and page numbers (Berry mentions this as not always very good looking; he's right].</p>
      <p>powers</p>
