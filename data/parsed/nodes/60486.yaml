    html: |-
      <p>I think it's more important that the TOC be legible and look good than adhere to the baseline grid. You are likely the only one who will know it doesn't! I design books for a living and have never bothered much with aligning the TOC to the baseline grid. Make sure it's consistent in terms of sink or align the last line to the bottom and you'll be fine.</p>
      <p>I don't like that the spacing above the chapter titles is inconsistent. I see too much space above "Kroženje v r azpad"</p>
