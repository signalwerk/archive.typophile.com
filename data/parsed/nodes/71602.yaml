    votes: null
    html: <p>Your sample is an old Linotype face called Old Style No. 1. I don't think it has been digitized (other than Andrew Leman's distressed version). Century Old Style is similar in details, but heavier (as Nick mentioned). <a href="http://new.myfonts.com/fonts/bitstream/bruce-old-style/" rel="nofollow">Bruce Old Style</a> is closer in terms of weight and feel, but differs in the details.</p>
