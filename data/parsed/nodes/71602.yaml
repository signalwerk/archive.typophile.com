      <p>Thanks everyone, I knew it was connected to Old Style No. 1 but I didn't realize it actually was it. Too bad it hasn't been digitized, it's a nice text font that reminds me of school textbooks from my childhood. I did some snooping and actually found it in an old  <a class="freelinking external" href="http://books.google.com/books?id=XxcPAAAAIAAJ&amp;pg=PA38#v=onepage&amp;q&amp;f=false" rel="nofollow">Linotype Catalog</a> in Google books.</p>
      <p>Thanks again.</p>
