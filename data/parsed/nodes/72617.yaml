    <p>Hello,</p>
    <p>I've been scouring through google for the last few hours without any luck. I am trying to find a fairly accurate date for this typography quotation by Mac Baumwell...</p>
    <p>"Each letter should have a flirtation with the one next to it." - Mac Baumwell</p>
    <p>Can you anyone shed any light on the date of this quote? </p>
    <p>Thanks in advance!</p>
