    <p>I was curious if there is a definitive list of accented character pairs that have a tendency to 'clash' and that are most likely to occur in extended languages.</p>
    <p>I generally know what they are and have made pairs with exceptions in the past to handle the ones that I believe would be common.</p>
    <p>I was thinking that if there was a list I could prevent having to kern pairings that would potentially never occur.</p>
