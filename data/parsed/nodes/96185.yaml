    html: |-
      <p>Thanks. Filip, that article is excellent.</p>
      <p>I've pretty much solved the problem, in that I'm kerning every potential accented character clash, regardless if it's perceived as 'common', or not.</p>
      <p>I've been kerning 'lower case—upper case', 'unusual' combinations, and 'demoninators, numerators, superiors, inferiors' and others listed in the article for awhile now. I'm taking note on a couple things I've overlooked, such as 'german quotes' and having a closer look at Lcaron and the potential issues with lslash as well.</p>
