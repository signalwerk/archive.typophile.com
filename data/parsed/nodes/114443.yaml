    <p>Hello</p>
    <p>I'm looking into using Founders Grotesk for a project and I'm looking for other options before making my mind up… does anyone have any ideas for similar typefaces that have weights that have a similar style, work at text sizes but also have more condensed headline weights?</p>
    <p>Any suggestions welcome!</p>
    <p>Thanks</p>
