    html: |-
      <p>Thanks for the info guys. I've always felt that Lost Type's setup is probably more financially rewarding than dafont's "donate" button. Dafont's setup consists of a download button with a donate button directly below, allowing the downloader to get the font immediately. Lost Type's system (at least last time I was on there) forced the downloader to "name their price." Even though $0.00 is an acceptable value, being confronted with this screen might convince more people to donate. Maybe I'm over-thinking it...</p>
      <p>I've contacted MyFonts about getting it submitted onto their website and I'm currently talking back and forth with them. I've found out that they split the cost with their designers 50/50.</p>
      <p>After perusing their display face section, I'm thinking about selling it for $20-$30 (hopefully with a webfont version, too). I'm still really unsure if this is an appropriate price or not as I always seem to lowball myself when it comes to pricing... In the meantime I'm continuously tweaking the font and adding more and more glyphs :)</p>
