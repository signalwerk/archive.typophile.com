    <p>Slinkster</p>
    <p>A modular display face consisting of letters, numerals, basic punctuation, and a few extra goodies. Featured on dafont, Free Typography, and Pixel Pixel Pixel.</p>
    <p>When using this typeface, bigger is better ;)</p>
    <p>Available on my personal website here: <a href="http://willryan.us/content/slinkster.html" target="blank">http://willryan.us</a></p>
    <p>=======================</p>
    <p>I was recently contacted by someone asking if they can use a font I created for commercial use (the font is freely available for personal use). I'd like to get some money out of this if it's a possibility. How do I proceed from here?</p>
