    html: |-
      <p>In my experience, if you want to remain independent you would benefit from doing some research into equivelant commercial typefaces and what is being charged for them. It would also be worth considering an approach to embedding licensing and possible conversion for web font usage. PayPal is fairly standard in terms of payments and transactions.</p>
      <blockquote><p>I have it set up as donationware on dafont, but have yet to get any donations even after almost 25,000 downloads...</p></blockquote>
      <p><strong>Donationware</strong> usually gets ignored, which is unfortunate, but it is often the case that the person downloading a font for a company that is happy to pay for it would not be the person responsible for making that payment.</p>
      <p>Dafont offers the ability to post additional information about the font which you could use to make clear that commercial (print &amp; digital) use requires a specified payment or is subject to a scale which you can discuss in greater detail via email and which would be payable via PayPal.</p>
      <p>In my experience as someone that has negotiated this kind of payment the biggest obstacle when you want to license something appropriately is access to contact information, a clear overview of pricing and a convenient way to make payments.</p>
