    html: <p>I think Scriptorium has a version of Blanchard they call <a href="http://www.myfonts.com/fonts/scriptorium/ruffian/" target="_blank">Ruffian</a>. It's not italic either.  <br> <br>The problem is that often if people do digitize a classic typeface, they are cautious about using the name, and so you need to know it when you see it. I have tried to 'decode' the Scriptorium collection because David Nalle does a great job of recapturing some of the old designs, but he almost always changes the names. <br> <br>So I guess, unless someone knows of some more interpretations, the answer seems to be that they are mostly in books right now.</p>
