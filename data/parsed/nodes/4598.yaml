    html: <p>There's a lot of material in Mac McGrew's "American Metal Typefaces of the Twentieth Century", but the bottom line seems to be that Post Black Italic looks most like what your sample shows, although the R is not as 'swashed' as your sample. There are a number of other faces, like Blanchard, Roycroft, Buffalo and Ben Franklin that appear very similar. You are talking about original designs dating from the early 1900's, so they weren't fonts then (not digital ones, I mean). I don't know which have been digitized.</p>
