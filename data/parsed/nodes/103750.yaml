  html: |-
    <p>Hi,<br>
    I am getting this error message on generating the fonts. What needs to be done to correct it.<br>
    Lookup rligRequiredLigaturesArabic02 has an offset bigger than 65535 bytes. This means FontForge must use an extension lookup to output it. Not all applications support extensin lookups.</p>
    <p>Apart from that there are many lookups which are not working. I double checked that the combination I am entering in Word 2010 is perfect.<br>
    Please help.</p>
