  html: |-
    <p>Looking for an alternative.</p>
    <p>Trajan has the right "feeling" but would be lovely to find something with a bit more "ink" and less air around it, just a bit more compact. And perhaps an alternative with a broader uppercase S.</p>
    <p>Also, the bold isn't very bold.</p>
    <p>Anyone?</p>
    <p>EDIT: A family with small letters and not just uppercase letters would be fantastic.</p>
