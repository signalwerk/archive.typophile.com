      <p>I'm a fan of the Trump Mediaeval Italic ampersand. <a href="http://www.myfonts.com/fonts/linotype/trump-mediaeval/italic/glyphs/528505/7" title="http://www.myfonts.com/fonts/linotype/trump-mediaeval/italic/glyphs/528505/7">http://www.myfonts.com/fonts/linotype/trump-mediaeval/italic/glyphs/5285...</a></p>
      <p>I was wondering whether many people won't recognise that style of ampersand though?</p>
      <p>The 'et' is clear, but have most people forgotten that connection? Do most people only 'get' them from context? I sent an image to one of my friends with only that ampersand in but he didn't know what it meant until I sent another one showing "Jack &amp; Jill", where it was recognised in context.</p>
