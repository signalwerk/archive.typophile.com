    votes: null
    html: |-
      <p>The french ampersand comes from a contraction of an /e an a /t to get the /et (and &amp;) in english. That said, all aesthetic choice is open and up to the designer. You could find the way I've drawn my ampersand in other typeface too (Meridien italic for instance). Also, an ampersand is called “esperluette” in French, but only few people knows about it. Everybody calls the ampersand key  “et” according to its common pronounciation. </p>
      <p>More to read here : <a href="http://www.adobe.com/type/topics/theampersand.html" title="http://www.adobe.com/type/topics/theampersand.html">http://www.adobe.com/type/topics/theampersand.html</a></p>
    html_clean: |-
