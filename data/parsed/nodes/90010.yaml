  html: <p>I am new to Typophile, I want to grow as an Art Director/Designer through observation and eventually participation on this site, thank you in advance to all my teachers. I have been a designer for many years… started out as an industrial designer and evolved to where I am now. I am looking to grow as a designer and improve my critical skills and also increase my circle of creative people.</p>
