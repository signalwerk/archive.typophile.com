      <p>George:</p>
      <p>The word "sniping" wasn't coined by anyone on this list, so far as I know, and in any event, your disbelief is a bit misguided: of the three people you quote, two of them are self-confessed (and, speaking for myself, unapologetic) snipers who agree with your view that last-minute bidding is smart; no one here thinks computers are bad; and no one except Si called anyone names (and I would guess that Si doesn't <em>really</em> condemn the morality of those who snipe).</p>
      <p>Like I said (and as you quoted me saying), I <em>can't</em> think of any real reason why I would have any distaste for automatic sniping except my gut, and my gut is not an argument. If I <em>had</em> to think of a reason, I guess it would be that introducing such mechanisms creates tiers or classes of buyers: those who can afford such products and gain an advantage, and those who can't and don't.</p>
      <p>But again, on the other hand, there are already classes of buyers: for example, I have a job flexible enough to allow me to keep an eye on auctions during the day; I have internet connections both at home and at work; I have the resources to participate and bid high (though not nearly as high as some on eBay can), and so on. So I don't think that argument goes very far.</p>
      <p>Maybe the only thing I would have to say against software bidding (beyond that contained in the eBay system itself) is this: that using the software to snipe takes the fun out of the process. Imagine the person who sits at the poker table and, every time the bet comes to her, uses a PDA or calculator to figure her odds and those of the others at the table and bets or folds accordingly. It may be instrumentally rational, but it sucks the suspense and psychological guesswork (not to mention the competitive camaraderie) out of the process.* But again, that's a gut reaction, and not everyone thinks of eBay for its entertainment value.</p>
      <p>So relax: we like you. Snipe away in peace.</p>
      <p>* No, this is not a perfect analogy. Anyone sitting at a poker table who saw one player doing this, and could assume she knew what she was doing and that she always bet or folded accordingly, would be a fool to bet against her. She'd never win as much as she would if she bluffed and could tell when her opponents were bluffing, or not.</p>
