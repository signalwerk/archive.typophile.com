      <p>Yes, as Guerella said, bidding early only drives up the price. I would recommend the following, which I found to be working for me:</p>
      <p>1. Make up your mind and set yourself a maximum price</p>
      <p>2. In the last 40 seconds or so (depending how fast your connection is and how fast you are with a mouse), bid around 10% less than your maximum price (this way, any other bidders will think this is your maximum bid and will probably only want to outbid you by the minimum amount)</p>
      <p>3. Refresh the page after around 5 sec and see if you have been outbid</p>
      <p>4. If yes, bid your maximum price quickly, as there are around 10 sec left</p>
      <p>5. Now you either win or lose, but maximised your chances and did not use any evil snipers; and, just as Paul said: no regrets as you did not spend more money than you intended!</p>
      <p>Good luck!</p>
