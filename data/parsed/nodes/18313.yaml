      <p>I both sell and buy on eBay and there are a number of successful strategies for winning. Coming in at the last moment with a high bid is obviously the most common, and automated sniping is based on that. But that all depends on the item, bidding history, relative value, obscurity, etc. </p>
      <p>Sometimes an early placement (bid a low amount initially) will scare off other potential bidders. A seller likes an initial bid as it has the potential of attracting other bidders, and is a guaranteed sale, but not necessarily a high sale (as it might well indeed have dissuaded other bidders).</p>
      <p>The best way to play the eBay game is to do the research. Know what the market value of the item is. The value of antiquarian and collectible books, for instance, can easily be determined by a trip to abe.com. It's often unusual that a known book will go over 40% of the dealers price. I usually bid the lowest dealer price and rarely lose, and most often, get the item for a much lower price. But it is a game played best only if you really want the item.</p>
      <p>It is best to carefully study the item description. How much you will have to pay in shipping, condition of item, method of payment. It pays to take a good look at the seller, other items for sale, feedback history. There is nothing worse than being disappointed when the package arrives, and to some extent, you could have avoided that simply by paying a bit more attention to both description and seller's feedback. Though this can work to your advantage. If a seller doesn't offer PayPal, has high or undisclosed shipping rates, has a poor record in regard to shipping and packaging, etc., that seller's items are not going to gather substantial bids.</p>
      <p>It pays to study other listings for relative sale price as well. If there is a similar item up during the duration of bidding, that will could result in the items selling for less. Also, if the seller has described the item poorly in the subject heading or listed it in an inappropriate category, that can result in a lower auction price as well. But, sometimes sellers will do this on purpose because the potential buyers who do find the item are in game mode.</p>
      <p>Most importantly, look at the feedback of other bidders for the item. Their past bidding strategies are revealed here. </p>
      <p>Time of sale is important as well. A clue is to look at the numbers of folks using this list at any given time of the day and on specific days of the weeks. Web activity begins late Sunday night and tapers off by Thursday afternoon. Best time to buy and worse time to sell is during the off peak period. And during holidays. An acquaintance of mine picked up a photopolymer platemaking machine–which, because of its relative scarcity, has a common value of $3,500 and often goes for that–for $500 simply because the seller had the item ending on Christmas Eve.</p>
      <p>Gerald</p>
