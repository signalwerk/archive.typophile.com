      <p>I think Eric, John, Max, and Forrest are right--nothing ethically suspect about sniping. I share John's distaste at the software-based sniping out there, but I'm not sure I could back that judgment up with anything but my gut. I speak as an experienced sniper (mostly good writing pens and leather goods). The rules are what they are: information about what buyers will pay is not distributed evenly and is revealed in a certain order, and people learn to take advantage of the structure to pay less for an item than they might have to otherwise. It's like bluffing in poker--whether the people who write the rules wanted it or not, it's become part of the whole point of the game.</p>
      <p>It doesn't hurt the losing bidders so much as the seller, by the way, if you think about it: it compresses the real bidding period into a few minutes, but unlike in a live real-time auction, that time isn't continuous--there's the connection and database update delay--so despite the pressure and the thrill of competition, the last bidders could never get the price as high as they would if they were face to face in the same room and could raise the bid with a flick of the hand or nod of the head.</p>
      <p>Never overlook the entertainment aspect of eBay--it's what made the site so popular (besides the thrill of selling someone your ratty old bedsheets for $30). eBay does allow sellers to conduct blind auctions, where sniping is impossible or pointless (though the more neurotic of bidders might try it anyway).</p>
      <p>If the competition leaves you cold, then Paul C's advice is best: you figure out what you'll pay for the piece, set your maximum bid, and wait until the auction is over. Me, I'm too much of an adrenalin junkie.</p>
