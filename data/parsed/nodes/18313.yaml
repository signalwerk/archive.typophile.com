      <p><em>I share John’s distaste at the software-based sniping out there, but I’m not sure I could back that judgment up with anything but my gut. </em></p>
      <p>Jeez, are you guys still using buggy whips too? You talk like computers had never been invented. I buy and sell on eBay and have used a snipe service for years. I don't have time to hang around waiting for an auction to go off, I have a life -- and grandchildren to play with. I also don't want to bother getting up at some ungodly hour for an auction in some distant time zone or worry about bidding from a foreign country while traveling. This is what computer technology is for, to make your lives easier. Set your bid on the snipe service and win or lose without crying or gloating.</p>
      <p>The term sniping itself even implies there's something neferious about the practice when there isn't. I've sat through antique auctions in small midwestern towns on hot summer nights and big money auctions (art deco furniture) at Christies. The serious bidders come in at the end. It's not sniping, it's smart bidding. You wait for the amateurs to fade and the other serious bidders to come out. Bidding at auction really is a "use it or lose it" situation and if you won't use all the tools and techniques available then you're not that serious. </p>
      <p>People seem to think there's some sort of honor pretending they're standing in a dusty street blazing away like a gunfighter? Honor on eBay is doing right by your buyers and sellers not about how you bid your auctions. Well, go ahead and call me names for using a service, I'll take the stuff.  </p>
      <p>If you want a recommendation for a good snipe service I use:<br>
      <a href="http://www.snip.pl/en/my" title="http://www.snip.pl/en/my">http://www.snip.pl/en/my</a>.<br>
      They're inexpensive and pretty reliable.</p>
      <p>George</p>
      <p>I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
