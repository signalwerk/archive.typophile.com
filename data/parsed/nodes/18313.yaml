      <p><em>I don’t think I’d use a sniper service anymore than I would steal via bit-torrent “file sharing.”<br>
      On the other hand, are those modified sportsmen in your little pic there? I used to race when I was in college.</em></p>
      <p>But bit torrent is stealing, sniping isn't. What I objected to is people casting aspersions on something because they don't want to do it. It is what it is, there's nothing illegal, immoral, or unethical about it and trying to make it seem so is poor sportsmanship. People use proxy bidders in auctions all the time. There are those who make their living as proxy bidders. I don't see that using software instead of a person somehow makes it unfair. I'm not on eBay for recreation but to obtain things -- right now a lot of type specimens -- or sell things. I understand people get frustrated when they think they're going to win something and get outbid in the last seconds. I missed an excellent Hamilton specimen that way which is one of the reasons I use sniping. I don't use it all the time, but do for those auctions I'm not going to be able to bid on in person. </p>
      <p>The winning bidder is the one who bids the most. Whether the bid is the first one or the last one. If you got outbid then you didn't bid enough. It doesn't matter if the one who outbid you did it at the end or not. Ebay has a mechanism to set a maximum bid amount that gives you the opportunity to beat sniping so if you don't like snipers use it, just make the maximum high enough.</p>
      <p>I reacted to the "evil" comment because I felt it was overboard. A guy who committed mass genocide is being tried on the other side of the world. What he did was evil. What I do in sniping is, at most, annoying. And it wouldn't be annoying if people were serious about using eBay.</p>
      <p>As for the photo they're sprint cars, 1960s I think. One of them is Mario Andretti, but I don't know which one. I raced motorcycles, flat track, for awhile after college, but I was already too old to be competitive. Little kids were blowing by me laughing. There's an indoor go-kart track near me and I plan on trying that as I still would like to do some racing before I really am too old. If I can beat the eight year olds I going to pursue it this summer.</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
