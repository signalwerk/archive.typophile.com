      <p>And back to the reason we started reading this topic: Gerald's advice pretty much covers it. EBay does have a maximum bid system so you can set a high amount but it won't show up. EBay just bids you up to that figure. For some reason people don't see that as being naughty like sniping. Any snipers who come in at the last second and bid below you will lose out automatically. Don't bid too early as some bidders will just chip away by bidding up the minimum until they figure out what your maximum bid price is. Or get frustated and go away.</p>
      <p>And sometimes you can beat the guys oldnick mentioned -- they gotta eat sometime -- but not often. </p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
