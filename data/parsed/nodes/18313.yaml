      <p>Nice item, Eric. I use the same method you do. I think manual sniping is fair; I don't approve of these automated services though, and take satisfaction is believing that I manually outsnipe them. I also prefer the term gazumping, which originated in the UK housing market (when someone comes along and puts in a higher offer on a house after yours has been accepted but before the papers are signed).</p>
      <p>My most desperate sniping moment was when I was walking along the street and suddently remembered that an auction I had planned to bid on was ending in five minutes. I ran around with my Palm Pilot, desperately trying to find a strong and open wireless signal. Found one. Got logged in to eBay. Got to the item. And then lost it (in more than one sense) when the bid page didn't load quickly enough. Sort of sad and embarassing. I can't even remember what the item was now.</p>
