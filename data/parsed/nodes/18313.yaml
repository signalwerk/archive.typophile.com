      <p>I agree with the "set your price and stick with it" approach: just set your price realistically (Paul: don't expect to pick up a copy of the 1912 Western Type Foundry specimen book for less than $20), and bid as late in the game as possible.</p>
      <p>If you find yourself bidding on type-related items against <strong>goudyos, intypenut, pialley</strong> or <strong>st.gregory</strong>, don't bother...these guys have DEEP pockets, and have spent BIG bucks on rare specimen books. On the other hand, sometimes real goodies sneak under the radar: I picked up a less-than-stellar-but-still-quite adequate copy of the Barnhart Brothers &amp; Spindler Specimen Book #25 for $14.99, which was the opening price. I was willing to pay quite a bit more, but nobody else bid on it, so I stole it. I feel so ashamed...</p>
