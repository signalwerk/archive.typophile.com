    html: <p>FF Maverick has a very strong personality. It’s not the easiest task to find a suitable typeface for the corresponding body text. However, you could give <a href="http://www.fontfont.com/fonts/unit" rel="nofollow">FF Unit</a>, <a href="http://www.fontfont.com/fonts/unit-slab" rel="nofollow">FF Unit Slab</a>, <a href="http://www.fontfont.com/fonts/more" rel="nofollow">FF More</a> or maybe even <a href="http://www.fontfont.com/fonts/sheriff" rel="nofollow">FF Sheriff</a> a try.</p>
