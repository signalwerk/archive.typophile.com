    <p>Hi Typophiles, </p>
    <p>My client wishes to use a sans serif typeface for a book project. There are certain limitations on the point-size and number of pages.<br>
    When I substitute the serif body text with a sans serif, the page count exceeds the page limit by several pages. I wish to find a sans serif text face that has an average line width similar to serif fonts such as Times New Roman. Can you make a few suggestions?  Legibility and simplicity are key.</p>
    <p>TS</p>
