      <p>From the image, it looks like they didn't <em>have</em> small caps, and thus the words "Official Programme" were instead set in two different sizes of normal capital letters.</p>
      <p>And I don't think one needs to be "really picky" to find that unfortunate.</p>
      <p>Placing "at" on a line by itself, so that the names of the bride and groom can be on one line, and the name of the place can be on another line, seems quite reasonable to me for a document of this nature - a title page, at least, can legitimately have something of the category of an invitation card.</p>
      <p>What was the custom in olden times was that if Mary Jones married John Smith, she would still be addressed as "Mary" by her friends, but if she were addressed <em>formally</em>, she would be called "Mrs. John Smith", to indicate that she is the wife of John Smith - and, in fact, the form "Mrs. Mary Smith" would be improper, used only in the case of a divorced woman. (Referring to her less formally as "Mary Smith", however, was proper even then.)</p>
