    html: |-
      <p>I know that when I use the phrase "really picky", I am referring to a concern over things that... it is not really necessary to be concerned about.</p>
      <p>I think genuine small capitals are more in the category of things that one <em>ought</em> to be concerned about, even if many people are not these days, and so one could get away with cutting corners.</p>
      <p>However, until such time as small capitals are supported in a standard manner by the operating system itself - as opposed to being supported only in more expensive applications programs - I think it is still legitimate to exclude them from basic font packages. The criterion which I see as applicable is not concerned with the <em>intrinsic</em> importance of small capitals, but the simple fact that only professional users would actually be able to make use of them <em>if provided</em>, and so given this... environmental... circumstance, it's legitimate to make them one more item only included in the "professional" version of the font with its professional pricing.</p>
      <p>When, as, and if, Windows gets fixed so that small capitals are at least as easy to access as bold and italic from within <em>WordPad</em>, and any rich text control that might appear in an application or on a web page, <em>then</em> a regular font that doesn't come with small capitals would look silly. That day has not yet come.</p>
    html_clean: |-
      <p>I know that when I use the phrase "really picky", I am referring to a concern over things that... it is not really necessary to be concerned about.</p>
      <p>I think genuine small capitals are more in the category of things that one <em>ought</em> to be concerned about, even if many people are not these days, and so one could get away with cutting corners.</p>
      <p>However, until such time as small capitals are supported in a standard manner by the operating system itself - as opposed to being supported only in more expensive applications programs - I think it is still legitimate to exclude them from basic font packages. The criterion which I see as applicable is not concerned with the <em>intrinsic</em> importance of small capitals, but the simple fact that only professional users would actually be able to make use of them <em>if provided</em>, and so given this... environmental... circumstance, it's legitimate to make them one more item only included in the "professional" version of the font with its professional pricing.</p>
      <p>When, as, and if, Windows gets fixed so that small capitals are at least as easy to access as bold and italic from within <em>WordPad</em>, and any rich text control that might appear in an application or on a web page, <em>then</em> a regular font that doesn't come with small capitals would look silly. That day has not yet come.</p>
