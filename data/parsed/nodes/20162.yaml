    <p>Hi All,</p>
    <p>This is probably going to be the most generic question ever, but I’m looking for a typeface for a rebrand of a store I’m going to be working on. The current identity is very similar to ITC’s Edwardian Script (ugh!), and the company doesn’t want to move too far away from it. I’ve always been a bit cautious towards scripts, I rarely use them because I’ve always felt that they’re usually far too fiddly for identity work, have a tendency to fill in and aren’t particularly easy to read, as well as being old-fashioned for my purposes. Can anyone suggest contemporary, script faces that are elegant but are thicker than Edwardian Script? I’m also open to suggestions of italicised serif display faces that look modern.</p>
    <p>I know it’s all a bit woolly and I’ve not narrowed things down, but I’m hoping I might discover some fantastic new faces and/or foundries that can get me going in the right direction.</p>
    <p>Cheers</p>
    <p>Si</p>
