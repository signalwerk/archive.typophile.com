      <p>Doesn’t it matter what the store’s image is and what it sells, even if confidentiality requires that to be expressed at a certain level of generality?</p>
      <p>Do people really feel comfortable about suggesting typefaces without knowing anything about the history of a business, its current products and its intended customers?</p>
      <p>For example, yesterday somebody asked for advice on type for model/toy railroad accessories, and someone named Mark Simonson made what seemed to me to be some pretty important points about how history and the product and the geographic location of the customer might have a bearing on choice of type. To me, what he had to say made a lot of sense, applicable to any enterprise.  </p>
      <p>Just curious.</p>
