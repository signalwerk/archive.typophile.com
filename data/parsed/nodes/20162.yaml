      <p>Sorry Redge, you’re right, but Grot Esqué (I wish I’d thought of that name!) answered for me. The store is old, with very fragmented, inconsistent branding (that seems to have been amended by different signwriters on the few different branches of the store). As for what it sells, the store is quite upmarket and sells a very diverse range of homewares. The store has heritage but needs to be brought up-to-date considerably.</p>
      <p>I’m going to be presenting multiple approaches, so I’m keeping my options open. Really I was using the thread to discover new foundries/faces - If I don’t use them for one option, I can always bring them into play elsewhere. I tend to work on identities frequently, so I like to keep on top of what’s out there.</p>
      <p>Si</p>
