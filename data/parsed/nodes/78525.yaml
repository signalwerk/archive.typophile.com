      <p>To be more informative:</p>
      <p>The Greek letter mu does not have an agreed-upon way to represent it as a letter with the characteristics of a letter from the Roman lower-case alphabet - that is, with serifs.</p>
      <p>While there is a conventional Greek upper-case which is built from the same basic shapes as Roman capital letters, the traditional Greek lower-case is cursive.</p>
      <p>This has led to what is known as "Porson Greek". This is the type of Greek typeface with which people outside of Greece are most familiar. It looks like using a normal Roman face for capital letters, and an italic face for small letters.</p>
      <p>This is appropriate when one is using Greek letters in mathematical formulae. It has been used for text, simply because, outside of Greece, printers have had little else available. But most Greeks think it looks just as stupid as most non-Greeks would, encountering a page printed that way for the first time.</p>
      <p>Even Greeks had to use Porson Greek for a while, though, because Greece spent many years under the control of the Ottoman Empire, which suppressed the use of Greek in printing. At present, there are many Greek typefaces, which generally belong to the following three groups:</p>
      <p>1) Take Porson Greek, but italicize the capitals.<br>
      2) Take Porson Greek, but optically remove the slope from the small letters.<br>
      3) Go sans-serif, possibly including aspects of ancient Greek letterforms.</p>
      <p>Greek typography is still, in my opinion, in a parlous state, therefore. The upper-case and lower-case letterforms have been bolted together from unrelated originals, and they haven't really yet been harmonized into a generally agreed-upon way to represent the Greek alphabet in printing with a matching upper- and lower- case. Unless one goes sans-serif, and avoids much of the issue.</p>
      <p>But for your purposes, having a look at <code class="freelink freelink-error freelink-Array freelink-error-Array">[Bad link]</code> should suffice.</p>
