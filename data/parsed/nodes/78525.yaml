      <p><strong>Chris:</strong></p>
      <p>Surely a contextual evaluation would be better, but if the excessive simetry could be perceived in one single glyph, it also may be identified in others under similar condition. Thus your opinion (and also those from other Greek-speaking experts) would be valuable anyway.</p>
      <p>If the font just includes Greek characters as Math symbols or to support less knwon alphabets*, delta, mu and others will dialog mostly with Latin-script. So the dance would be with strangers, with a risky mixture between tango and syrtós. ;-)</p>
      <p>Most of deltas I verified (about 60) are very simetrical and the bottom half is usually based on o. So I <em>guess</em> the majority of these fonts did not follow traditional Greek style in lowercases. Happily, here in Typophile we can verify these issues to improve Greek characters.</p>
      <p>As long as I could conclude, my delta would benefit from a completely different top segment and a right curve with less mirror effect with the left one.</p>
      <p><strong>Nick:</strong></p>
      <p>If I understood correctly, there is a vivid discussion about the style to be adopted in Greek lowercase, with designers favouring cursive, traditional, less regular shapes, while others reputes this as a surpassed approach. And even about the cursive ductus there is a reasonable variation about what would be genuine and proper.</p>
      <p>As a sample, compare what Chris told about simetry and the very simetrical delta from Centro Serif (it's the first glyph of the second line).</p>
      <p>Parachute surely knows what they are doing. But I'm not Greek nor can speak Greek language –and hence I don't have the measure about how much I can let behind in terms of traditional style. In doubt, it seems safer to use shapes more usually recognized as typically Greek while your knowledge does not permit higher flights. My suggestion to TypeMind was based on this idea.</p>
      <p><em>* delta, lambda, theta and omega are used in native North American languages, mixed with a Latin alphabet.</em></p>
