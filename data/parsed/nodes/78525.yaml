    html: <p>In most (latin script) typefaces these greek glyphs are for use within latin script text eg. <code>10µF</code>. In these cases they can follow the design of the latin (general ductus metaphor). They have however the same unicode indices as the proper greek glyphs, so if the font is expanded to include the greek script they will have to be redesigned, or a separate greek font will have to be developed.</p>
