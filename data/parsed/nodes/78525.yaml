      <p>Igor,<br>
      Fixing the flag at the top would solve most of your problem and move the reading away from Serbian.  What I meant about dancing was more about the feeling of rhythmic movement than rigid bilateral symmetry. Sans serif can certainly feel much more geometric. The "countryman" perhaps was a bit misleading. It is not just about Greek glyphs, it is about all the glyphs and how you intend it to be used.  If you are only making the Greek that is also math symbols, then your purpose is far different than a complete script meant for reading Greek text. Personally, I wish that the math glyphs were not coded to language text slots so that you could adjust each for their separate uses.  Spacing and kerning Greek text is a different beast than just using a few occasional Greek glyphs with Latin and figures. Even x-height, slant and weight could be directed to math formulae instead of text.  The way a delta or sigma holds a line in a math expression, where there are mixtures of operators, figures, and cap or lowercase Latin glyphs, would perhaps be a reason not to saddle the math Greek to the text Greek. This is not just about Greek, it is also about the whole nature of the typeface. My personal opinion, which should certainly not be taken as THE Greek way by any means (Greeks rarely agree about much) so think more about your intended purpose with the face than with how "native" it looks. My opinion is that Greek text should dance more than say Times Roman Latin.  Many Latin faces have glyphs which appear as a single gestalt on the page and group together as words with a single gestalt. I feel Greek text swings together as a flowing, undulating tango rather than marching lockstep in very even time.  Think of it more as 6/8 time rather than 4/4 time. Like a tango, where both dancers must work quite together to avoid stepping on each-others feet, not like a march where one soldiers misstep will only betray his failure to match the rest.<br>
      Nick's mention of Futura is a perfect example of not throwing the baby out with the bath water. When someone chooses Futura for setting text, they are not choosing it to give the look of any traditional text.  Futura was not meant to evoke Katzanzakis text let alone Homer. The typographer has obviously a different purpose and that purpose needs to be respected.  My comment was just about that one glyph you first had shown and it did not look like it was in the modern vein of Futura or AG, or Univers. If someone were to do a Greek translation of a book on Paul Renner or Tschchold's "New Typography", or even some high tech subject matter, you might consider Futura to be a good fit.<br>
      That being said, that is not to say that fine Latin faces such as Greta or the more than lovely Maiola are not dancing perfectly in their Greek text.  They were not designed by Greeks but they certainly can Tsamiko or Kritiko if asked.<br>
      The reason I hesitate from picking a delta from your image is that I don't want you to think there is only one way to dance.  Fred Astaire and Ginger Rogers vs Nureyev and Dame Margo Fontaine have their own way of dancing but each is correct in its own right.<br>
      What I am saying is, put on the music that you ask them to dance to and then pick the best partners--don't just ask to see one of their feet.</p>
