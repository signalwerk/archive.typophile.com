      <p>Your design is very regular, without the cursive elements proper to Greek lowercase. It <em>may</em> work in a Latin font where Greek letters just appear as symbols, although I think even there it will seem a bit rigid.</p>
      <p>You can try to insert some small adjusts to make it less regular –minor variations in stems, non square shapes, terminals in angles different from 90°. I'm still learning how to handle Greek ductus, but this may serve as an idea:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/greek_5047.gif"></div><p></p>
      <p><em>u/mu and d/delta/eth comparison.</em></p>
      <p>Although I also built µ from u, terminals are slight inclinated and left leg is irregular. I don't think one can say this is a "genuine" µ, but it has enough elements not to be seem as just-an-u-with-leg. To be used besides other Latin letters, this is a possible intermediate solution –not completely Latin, nor truly Greek.</p>
      <p>Delta sample is just to show you can easily reuse elements from one character to build other within a same script (d–&gt;eth) but this is much harder with different scripts (Latin/Greek). For delta, use of o, d or g elements would simply cause bad results and I chose to begin a new design to build it.</p>
