    <p>I'm wondering how to correctly draw the Greek character μ. Upon inspection, many fonts' μ's look like a u with a leg pasted on like this:<br>
    <a href="http://s1100.photobucket.com/albums/g409/pdnamateuruser/Typophile%20Images/?action=view&amp;current=PFCentroSlabProMedium-mu_u.png" target="_blank" rel="nofollow"><img src="http://i1100.photobucket.com/albums/g409/pdnamateuruser/Typophile%20Images/PFCentroSlabProMedium-mu_u.png" border="0" alt="mu"></a></p>
    <p>This doesn't look right to me, but I'm new to this stuff. Is this how it's supposed to work? It seems like there should be some stroke thinning where the leg descends.</p>
