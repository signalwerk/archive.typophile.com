      <p><strong>Nick</strong>, thanks for the link. Very informative and useful.</p>
      <p><strong>Chris</strong>, the dancing metaphor is a very nice one and I think the whole idea is clear now. Many thanks for your detailed and highly instructive message.</p>
      <p><cite>I wish that the math glyphs were not coded to language text slots so that you could adjust each for their separate uses.</cite></p>
      <p>Many Latin-script fonts add pi, mu and omega twice, both as Greek letters and as math symbols, probably due to backward compatibility. It seems it will took some time until authors, editors and typographers fully adopt the correct Unicode characters.</p>
      <p>In my case, initial idea was to use just the mathematical symbols. But later I discovered some languages using Greek characters mixed in Latin alphabets, as Wakhi and a few native North American. Some even mix Latin, Cyrillic and Greek glyphs (!), demanding additional glyphs to a complete language support.</p>
      <p>When these glyphs are used in a Latin context and in small number, I believe a Latinish design does not cause great troubles. But this may be tricky in a font with Greek support. A Greek lowercase with the dancing dinamism you described would not fit well mixed <em>inside</em> a word with the more static Latin approach. Of course, linguists who built these mixed alphabets hadn't typographical knowledge.</p>
      <p><cite>I feel Greek text swings together as a flowing...</cite></p>
      <p>I love Greek letters, but I find they very difficult to draw. My hand is still a bit rigid to achieve their swings. Hope in the future I learn some Zorba-tango. :-)</p>
      <p><cite>The reason I hesitate from picking a delta...</cite></p>
      <p>Understood. Thanks again, the thread become a nice lesson. Hope TypeMinds forgive us to took it so far away from the initial question.</p>
