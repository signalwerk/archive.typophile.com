      <p>From my tests, the best results in autohinting are achieved by:</p>
      <p>1- Generate a proper TTF font with well made blue zones in place.<br>
      2- Autohint with TTFAutohint<br>
      3- Use Fontsquirrel generator **in expert mode**, set to not autohint.</p>
    html_clean: |-
      <p>From my tests, the best results in autohinting are achieved by:</p>
