    html: |-
      <p>@Hrant: Well, conversion is OK if you compare and check against the original PS contours. First, I erase the mask layer and copy all the glyphs to mask layer. Only then I  convert the foreground to TTF outlines and I go glyph by glyph checking is everything is fine and eventually tweaking some details in TTF outlines.<br>
      Avoid "in poitn BCPs" (BCPs with zero value). They distort the contour when the line is converted to TTF.</p>
    html_clean: |-
      <p>@Hrant: Well, conversion is OK if you compare and check against the original PS contours. First, I erase the mask layer and copy all the glyphs to mask layer. Only then I  convert the foreground to TTF outlines and I go glyph by glyph checking is everything is fine and eventually tweaking some details in TTF outlines.<br>
