      <p>@Fink – IIRC, OS-X has a BSD foundation, so using <code>ttfautohint</code> there in a shell should be possible.</p>
      <p>@Pablo – I suspect that Fontsquirrelmort’s hinter is FontForge which, as I have seen, throws away any and every table it doesn’t understand, most likely because it won’t know if, when and how to rebuild them. One could probably work around that with <code>ttx</code> and a bit more scripting, though.</p>
