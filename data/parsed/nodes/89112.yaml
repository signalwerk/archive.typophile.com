      <p>I used to use the Fontsquirell generator, but it strip out most of the font metadata, so you may need to reopen the font and putt all the info back in, and regenerate the font (keeping the hints table).</p>
      <p>Now I'm using TTF Autohint v0.5 and I'm very happy so far.<br>
      If you want, I can give it a run on your font for you.</p>
