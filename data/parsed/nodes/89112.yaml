  html: |-
    <p>For the client of the "con-script" font I'm making I need<br>
    to provide a webfont so he can avoid text-as-image or his<br>
    users needing to install the font. The results do not have<br>
    to reach any pinnacle of quality - I simply need to end up<br>
    with a decent rendering - some blurriness being OK.</p>
    <p>I'm assuming there's a zero-cost way of doing this,<br>
    but I'm in the dark concerning "best practice".<br>
    Any pointers would be highly appreciated.</p>
    <p>hhp</p>
