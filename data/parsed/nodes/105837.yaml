    <p>I'm looking for a handwriting font like Qwitcher Brychen:</p>
    <p><a href="http://www.myfonts.com/fonts/typesetit/qwitcher-bychen/" title="http://www.myfonts.com/fonts/typesetit/qwitcher-bychen/">http://www.myfonts.com/fonts/typesetit/qwitcher-bychen/</a></p>
    <p>I am looking at the lowercase "s" and "h" together and I like the more s shaped "s" instead of the normal cursive look. I also like the open loop in the stem of the "h". Are there other handwriting fonts that this look?</p>
    <p>Thank you for any help you can offer!</p>
