    html: |-
      <p>Etah, good to see you're going for a public crit of this!<br>
      I think it's pretty fascinating, especially it terms of taking<br>
      something gritty and translating it to a "classy" idiom.</p>
      <p>I can't tell how clear the direction is in your head; it seems<br>
      a tough thing to settle on. But this has to be done before<br>
      we engage in much "this glyph is better than that glyph"<br>
      type of refinement. I will say however that personally I'm<br>
      very attracted to the especially strange structures, such<br>
      as the "E" in your original post. You don't want to go over-<br>
      board with that flavor though - some letters will have to be<br>
      quite tame in order to produce a nice contrast/balance.</p>
      <p>The main thing I'm wondering is: How obscure do you<br>
      want this to be? Of course you want it to be decipherable,<br>
      but how much effort would you like a reader to put into<br>
      actually reading text in it?</p>
      <p>BTW: <a href="http://luc.devroye.org/BasVaerewyck-RLF-2009.jpg" title="http://luc.devroye.org/BasVaerewyck-RLF-2009.jpg">http://luc.devroye.org/BasVaerewyck-RLF-2009.jpg</a></p>
      <p>hhp</p>
