      <p>@hrant<br>
      i don't want this to be obscure. the glyphs should be fairly recognizable as to what character is represents. the main objective was to take a foreign letter structure to typography, and turn it into modern type. When i set this into words, i want it to be obvious these aren't regular typographic letters. these are letters from some other subculture. but the treatment of these letters, is a didone one. i feel like i should get these critiqued by gang member or something.</p>
