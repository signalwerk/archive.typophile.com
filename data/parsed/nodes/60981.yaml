    <p><a class="freelinking-external" href="http://i26.tinypic.com/29giowo.png">My two favorites</a></p>
    <p>I like the legibility and clean look of the first (Mercury text) and the more intricate look of the second (Computer modern).</p>
    <p>I would use the second as my text font but it prints too light and it is less legible than the first. In addition, the line spacing is very annoying.</p>
    <p>Could you please recommend a happy medium? Also, which of these two would you use as a text body font?</p>
