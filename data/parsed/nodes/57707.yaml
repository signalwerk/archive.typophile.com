    <p><a href="http://www.flickr.com/photos/joepemberton/3502448324/" title="Patrick &amp; Co by Joe Pemberton, on Flickr"><img src="http://farm4.static.flickr.com/3382/3502448324_305c01a771.jpg" width="500" height="94" alt="Patrick &amp; Co"></a></p>
    <p>Sometimes I just say the word <a href="http://typophile.com/wiki/ampersand">ampersand</a> out loud because it's a great sounding word. <a href="http://typophile.com/wiki/interrobang">Interrobang</a> is a close second.</p>
    <p><a href="http://www.yelp.com/biz/patrick-and-co-san-francisco-2">Patrick &amp; Co.</a> is the last (and best) independent stationery and office supply places in SF. Photographed in San Francisco's Financial District. </p>
