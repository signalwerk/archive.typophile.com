      <p>Stephen, thanks for your reply. Unfortunately, the ITC site doesn’t feature full character maps—but I found this one at Linotype: <a href="http://www.linotype.com/16783100/itcgalliardproitalic-charactermap.html">ITC Galliard™ Pro Italic</a> (should be the same font, no?), so I took a closer look.</p>
      <p>As far as I can judge from that, you’re perfectly right. Just for the record: Most ligatures and swash alternatives were incorporated in the OT Pro version, others are missing (among them: alternative ampersand, 2-storey g, long-tailed Q, fj/fr/us/as/is-Lig, end swash forms for d, m, e) or look different (ij-Lig). Ornaments also only with ITC Galliard CC, I suppose.<br>
      Then, with ITC Galliard Pro you’d get <em>one</em> font with all the extra stuff comfortably accessible, not to mention all the foreign language diacritics.<br>
      Grrr, how I hate those decisions …</p>
