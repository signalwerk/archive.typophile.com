      <p>This is working off the top of my head, so some of the early stuff could be in error. The later information is likely correct, as I was a bit involved.</p>
      <p>Matthew Carter cut the original Galliard while still at Linotype. I imagine the font was licensed to ITC through Linotype. When he &amp; Mike Parker started Bitstream, it was likely re-licensed back from ITC (Something similar happened to Sumner Stone with the “Stone clan”). Or maybe Carter held onto some rights.</p>
      <p>There was a third incarnation when Carter started Carter &amp; Cone. though the Carter &amp; Cone fonts are not called “ITC.” At some point, a “Swedish” version was made, which had a slightly different “f” so as to fit with vowels with an umlaut better. A bit later, Richard Eckersley &amp; I got with Carter to work out tabular old-style figures, and I believe a few other glyphs.</p>
      <p>While too much a gentleman to say so, I believe Matthew is a bit tired of working on Galliard. It’s sparkle comes from the contrast of the letters; the relation of the fine strokes with the heavier ones. Galliard fared better when printed repro-negative-plate than direct-to-plate. To date, there has been no reissue of Galliard. I did make a slighter more robust version in OpenType —with some extra characters such as f-vowel-grave ligatures, and put the nut fractions into a stylistic set. This was for our own use, but I did send a copy of the font files to Matthew Carter. (We were on a panel at some meeting, &amp; he tacitly agreed that direct-to-plate printing was a little hard on the font.) Never did hear back from him on this one though, so maybe he disapproved of the changes.</p>
      <p>It may be that the Type 1 Carter &amp; Cone Galliard is to be the final form. For the heavier weights, the Bitstream was the final form (to date).</p>
      <p>Hope this helps,</p>
      <p>Charles</p>
