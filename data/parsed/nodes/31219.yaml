      <p>“Chuck” <a href="/wiki/Charles%252BBigelow" class="wiki-create">Charles Bigelow</a> wrote one of the definitive articles on Galliard in <a href="http://www.amazon.com/Fine-Print-Type-Magazine-Typography/dp/096072902X" target="new"><em>Fine Print</em></a> magazine, January 1979.</p>
      <p>Of particular note, it was <a href="/wiki/Mike%252BParker" class="wiki-create">Mike Parker</a>, then director of typographic development for Mergenthaler, who made an extensive study of punches and matrices of <a href="/wiki/Robert%252BGranjon" class="wiki-create">Robert Granjon</a>’s (1513—89) types found at the <a href="http://museum.antwerpen.be/plantin_Moretus/index_eng.html" target="new">Plantin-Moretus Museum</a>.</p>
      <p>Together, Parker and <a href="/wiki/Matthew%252BCarter" class="wiki">Carter</a> sought the “best” of Granjon’s faces suitable for contemporary typography, making Galliard more of an anthology than a revival of any particular type family.</p>
    html_clean: |-
