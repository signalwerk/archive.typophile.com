      <p>Just an addition of little know information about the development of Galliard—</p>
      <p>The <em>drawing</em> and refinement of the Galliard family was no small task, but it is interesting to note that the <a href="/wiki/Ikarus" class="wiki">Ikarus</a> System was used to interpolate the Roman Bold weight, and the Ultra was extrapolated from the Roman and Black weights. </p>
      <p>The italics, on the other hand, were drawn by hand and were based primarily on Granjon’s Ascendonica Cursive, cut for Plantin in 1570.<br>
      (<em>Reference— article by Chuck Bigelow on Galliard mentioned in my post above.</em>)</p>
