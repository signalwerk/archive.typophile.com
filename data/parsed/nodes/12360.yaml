      <p>The big films are timed to coincide with US releases. The German Star Wars premiere will be on May 17th (that’s right, the 17th) in Berlin. On the 18th (when I arrive), it would be showing on limited screens. On the 19th, I suspect that there won’t be a movie theater that is not showing it. The “official” German release date is on May 19th, just like the “official” US release date.</p>
      <p>So you will be in Berlin from the 20th? During the conference, I’ll be in the Linotype stand for the duration (stop by and pick up our new brochures!). On the evening of the 21st, I’ll probably attend FontShop’s closing party. But I’m game for anything on the 20th. I could see Star Wars then for (perhaps) the third time!<br>
      __<br>
      <a href="http://www.typeoff.de">www.typeoff.de</a></p>
