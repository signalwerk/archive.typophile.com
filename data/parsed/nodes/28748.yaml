  html: <p>Is there any consensus about whether or not to put spaces around dashes? Most of what I read says to use dashes without spaces, but I see a lot more dashes surrounded by spaces in print than without.</p>
  html_clean: <p>Is there any consensus about whether or not to put spaces around dashes? Most of what I read says to use dashes without spaces, but I see a lot more dashes surrounded by spaces in print than without.</p>
