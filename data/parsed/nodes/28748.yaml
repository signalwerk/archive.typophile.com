    html: |-
      <p>There is NO consensus, as in a previous thread:<br>
      <a href="http://typophile.com/node/27727" title="http://typophile.com/node/27727">http://typophile.com/node/27727</a></p>
      <p>In the US, Chicago Manual of Style says no spaces around dashes but sometimes you need to kern or add a thin space when they are too close to the type. The UK seems to have a different style.</p>
      <p>I found another thread on this subject too...<br>
      <a href="http://typophile.com/node/27727" title="http://typophile.com/node/27727">http://typophile.com/node/27727</a></p>
      <p>I should add that I'm a traditionalist on this score - but I come from book publishing where the editors are real sticklers for Chicago. It is most important (in my book pardon the pun) to be consistent in your use of dashes so as not to confuse the reader. The em and en dashes should be distinct from one another both in style and usage. Unfortunately their length varies widely from font to font.</p>
