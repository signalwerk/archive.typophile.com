      <p><a href="http://www.apstylebook.com/index.php" rel="nofollow">AP style</a> is to "put a space on both sides of a dash in all uses except the start of a paragraph [their version of a bulleted list] and sports agate summaries." See "Punctuation" chapter.</p>
      <p><a href="http://www.chicagomanualofstyle.org/home.html" rel="nofollow">Chicago style</a> is not as explicit, but all the examples in the 15th ed. do not contain preceding or following spaces (e.g.: "It was a revival of the most potent image in modern democracy—the revolutionary idea."). See sec. 6.87ff.</p>
      <p><a href="http://www.amazon.com/Elements-Style-Illustrated-William-Strunk/dp/1594200696/sr=8-1/qid=1160586190/ref=sr_1_1/102-4802936-5414569?ie=UTF8&amp;s=books" rel="nofollow">Strunk &amp; White</a> are not explicit either, but also do not include spaces (e.g.: "The rear axle began to make a noise—a grinding, chattering, teeth-gritting rasp."). See sec. I.8.</p>
      <p><a href="http://www.amazon.com/Elements-Typographic-Style-Robert-Bringhurst/dp/0881792055/sr=8-2/qid=1160586226/ref=pd_bbs_2/102-4802936-5414569?ie=UTF8&amp;s=books" rel="nofollow">Bringhurst</a> recommends using en dashes set off with spaces: "Used as a phrase marker – thus – the en dash is set with a normal word space either side." See sec. 5.2ff.</p>
      <p>I don't have MLA or APA style guides handy, but I'll hunt around for 'em — er, (bad) pun intended.</p>
