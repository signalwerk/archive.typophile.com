    <p>I am taking a 'Literature and Culture of the Old West' course and my professor has suggested I engage the topic of typography, in the attempts to tailor the assignment to my interests and educational goals.</p>
    <p>I am having trouble coming up with a clear grasp of what I'm going to do. I'm finding it difficult to pin down the concept of 'Old Western typography.' I am focusing primarily on the entire 19th century. Was there even a difference between typography used on the east coast vs. the western frontiers? There's the Gothic Tuscan style that one often associates with posters of the 'Wild West,' but were those same faces not also used on the east coast?</p>
    <p>I'm just looking for a little direction here. The goal for this project is to come up with some original research on typography as it relates to the American West (or the idea of the West) .</p>
    <p>I have checked out Rob Roy Kelly's American Wood Type, 1828–1900 from the library, as well as Philip Meggs' History of Graphic Design. Not sure where else to look, but then, I'm also not exactly sure what I'm looking for :/</p>
    <p>Thanks in advance!</p>
