      <p><cite>Is the idea an idealized fabrication?</cite></p>
      <p>Almost everything about the Wild West is a fabrication. Particularly the wild typography—if most of those farm hands and cattle ranchers had been literate they’d have been able to land good jobs in the East and not gone out there to begin with.</p>
      <p>The same types were sold from coast to coast, with type, or at least matrices, shipped from foundries to other dealers or foundries all over the country. And of course they knocked each other off like crazy. Printers in the southwest would have had a smaller selection to work from due to being remote and having limited financial means. It’s not likely that many had enough types to set the wild broadsides we associate with the period, much less big presses for working with big wood type. Some of them had a few fonts of wood type for posters, but nothing too fancy (no point ordering fad type on a frontier budget) and often they were of poor quality and hand-carved.</p>
      <p>As for the wild tuscan styles, that’s mostly east coast stuff. A good deal originated at William Hamilton Page’s firm, probably inspired by the lettering on lithographed advertising posters. It would be interesting to see if the wild west typography styles originated in advertising for Wild West shows and dime novels sold in East Coast cities and London</p>
