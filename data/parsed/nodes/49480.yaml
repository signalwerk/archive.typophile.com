    html: |-
      <p>It looks like it was poorly live-traced in illustrator. Are you going for a more organic letter-form feeling?</p>
      <p>For me, the forms are too broken up by the swashes and don't really look well crafted or well integrated. I'd suggest coming up with more variations on this that use different letter placements. For examples on swashes and similar letter-forms, I'd suggest looking at the <a class="freelinking external" href="http://www.sudtipos.com/home" rel="nofollow">sudtipos</a> type foundry. They have a lot of great script fonts with lots of open type options. </p>
      <p>Also, it looks more like D&amp;MH, not D&amp;HM.</p>
      <p>penn</p>
