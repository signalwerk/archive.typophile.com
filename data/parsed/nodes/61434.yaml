  html: |-
    <p>Has anyone ever seen a specimen of Doric Italic?</p>
    <p>It is mentioned by Roy Millington in "Stephenson Blake The Last of the<br>
    Old English Typefounders", Oak Knoll Press.</p>
    <p>The reference about Doric is:</p>
    <p>Doric 12 1870: Stephenson Blake reissue. The first example of a sans serif letter taken from the William Caslon N 1816 specimen book.</p>
    <p>Doric Italic 1892: Purchase of punches cut in Hamburg by H. John.</p>
