  html: |-
    <p>Hi,<br>
    I'm a newbie creating my first font and trying to learn as much as possible at the same time.</p>
    <p>I've created all my glyphs, kerned etc and generated a Truetype Font.<br>
    I'm just in the early days of testing and tweaking.<br>
    I'm not too precious about the font as it's the learning that matters.<br>
    Have run the font through FontValidator and I am getting an Error message E6039 (in red) , see below,<br>
    --------------------------------------------------------------------------------<br>
    <em>Message: E6039<br>
    Rasterization Test: Point out of range</em></p>
    <p>Either the zero-based point value exceeds the larger of the maxp table values of maxPoints - 1 and maxCompositePoints - 1, or the zero-based point value exceeds value for the number of points in outline - 1, including phantom points.<br>
    --------------------------------------------------------------------------------</p>
    <p>Fontvalidator, via a link, then directs me to Microsoft were I now need to download the set of 4 Truetype Word Instructions documents.Done.<br>
    I have started to read these(without understanding all I'm reading!)and I was wondering if someone could explain my Error message more easily in layman's terms, and if this message seriously effects my font. The font so far works fine in Word, illustrator and Indesign.Is there an easy fix I'd understand?</p>
    <p>It gets a bit overwhelming when I try to learn and fix up a problem, only to find I need to study and understand another whole branch of typography just to get ahead.<br>
    (I'm probably only whining like a newbie, so please forgive me.)</p>
    <p>Any...and I mean any help would be greatly appreciated.</p>
    <p>Thanks in advance guys.</p>
    <p>Drj</p>
