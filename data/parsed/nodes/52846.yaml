      <p>Hi, this appears to be a problem with the way the TrueType file was generated; either incorrectly calculating the maxp table, or incorrectly recording values in the glyf table. </p>
      <p>These are things that should be done automatically by your font creation program. Could you give us some more info about what programs you used to draw the glyphs and create the font?</p>
      <p>Jason C</p>
