    <p>Hi there,</p>
    <p>My first post on the Typophile forum. My issue: Some glyphs of my first ever font Agràve aren't showing properly in Chrome and Safari. In FireFox and Internet Explorer the …  : and ; do show how they supposed to look. For example the triple dots are reduced to just 1 dot. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/chrome_vs_firefox_5679.png"></div><p></p>
    <p>I use @font-face in the CSS code and the original OTF (from Glyph App on the Mac). So I assume there is nothing wrong with font file, and nothing went wrong in convertng becauce nothing was converted :-)</p>
    <p>What can be causing this strange problem? Anyone?</p>
    <p>Daan</p>
