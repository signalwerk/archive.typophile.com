    html: |-
      <p>I'm a bit unclear on why you think you need to create duplicates of your ligatures.</p>
      <p>You can encode (e.g.) your <code>f_i</code> ligature as UFB01, include a rule <code>sub f i by f_i</code>, and omit the duplicate <code>fi</code> character altogether. Note that either name (<code>fi </code> or <code> f_i</code>) is consistent with proper naming conventions (though personally I'd use the latter).</p>
      <p>Including capital versions of the ligatures is only necessary if you want to accommodate users who employ hard-coded ligatures in their text (something which I view as a bad practice).</p>
      <p>André</p>
