    <p>Hello typophiles:<br>
    I'm writing the opentype code of a font, starting with ligatures I have some doubts about encoded ligatures and not encoded ones. In a previous thread <a href="http://typophile.com/node/35174" title="http://typophile.com/node/35174">http://typophile.com/node/35174</a> Miguel Sousa suggested to duplicate the encoded characters fi (FB01) and fl (FB02) for the liga feature and rename the duplicates as f_i, f_l. Then in small caps generate the glyphs fi.sc and fl.sc to replace fi and fl. And the OT code should look like this:</p>
    <p>feature smcp {<br>
    sub fi by fi.sc;<br>
    sub fl by fl.sc;<br>
    } smcp;</p>
    <p>feature liga {<br>
    sub f i by f_i;<br>
    sub f l by f_l;<br>
    } liga;</p>
    <p>My question is what about the other encoded ligatures? I dont know what is better, unencode them or keep the encoding and duplicate them as suggested. I also have these characters: ff (FB00), ffi (FB03), ffl (FB04), s_t (FB06) and longs_t (FB05). I have decided to duplicated them but i don't know if it is the right decision, here are my glyphs and my code. Could you advice me?</p>
    <p>Encoded: fi(FB01), fl (FB02), ff (FB00), ffi (FB03), ffl (FB04), st (FB06) and longs_t (FB05)<br>
    Duplicated: f_f, f_f_i, f_f_l, s_t, longs_t.hlig<br>
    Generated for smcp: fi. sc, fl.sc, ff.sc, ffi.sc, ffl.sc, st.sc</p>
    <p>feature smcp {<br>
    sub ffi by ffi.sc;<br>
    sub ffl by ffl.sc<br>
    sub ff by ff.sc;<br>
    sub fi by fi.sc;<br>
    sub fl by fl.sc;<br>
    sub st by st.sc;<br>
    } smcp;</p>
    <p>feature liga {<br>
    sub f f i by f_f_i;<br>
    sub f i by f_i;<br>
    sub f l by f_l;<br>
    } liga;</p>
    <p>feature dlig {<br>
    sub s t by s_t;<br>
    } dlig;</p>
    <p>hlig {<br>
    sub ſ t by longs_t.hlig;<br>
    } hlig;</p>
    <p>As for the uppercase forms, should I generate especial glyphs to substitute the enconded ligatures when the user changes the text from lowercase to all caps? Thanks in advance.</p>
