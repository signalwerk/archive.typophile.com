      <p>My take is you grudgingly support legacy characters, you never encourage their use.</p>
      <p>We don't sell fonts, we work them over only to set type. Maybe my views shouldn't count, then. But when I run into a font with a fi or fl character, (and a Unicode codepoint), I take them out. At some point, the fi character should be *deprecated.* Far as I'm concerned, that was as soon as we could employ a character-glyph distinction.</p>
      <p>As for F_I ligatures, whether small or full cap, why? How many texts come to people who use type where that's been an issue? I've never seen one -- can somebody remember one, or is this just a theoretical exercise? </p>
      <p>What to do when small or full caps are both ligatures and letterspaced, esp. just below the point where any ligatures break into component characters? They're going to look dreadful. And both are commonly letterspaced.</p>
      <p>Etc.</p>
      <p>I say let a text show .notdef and salmon for any fi/fl etc. characters. Fix that text then &amp; there, and we've gotten rid of one more bum situation.</p>
