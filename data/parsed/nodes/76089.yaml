      <p>In theory, Unicode should not exist for ligatures, because they confound the distinction between character and glyph.</p>
      <p>However, Unicode accommodates many "legacy" typographic characters that were part of exisiting encodings -- and so, because "fi" was part of, for instance, the Mac OS Roman encoding, it is given its own Unicode.</p>
