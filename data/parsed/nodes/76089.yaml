      <p>Are your fi.sc a real ligature or a mere aggregation of f.sc and i.sc, if the later is the case, then I see no point in having an fi.sc glyph at all, it is just redundant. you can instead say:<br>
      <code><br>
      sub fi by f.sc i.sc;<br>
      </code></p>
      <p>and the same goes for other similar ligatures.</p>
