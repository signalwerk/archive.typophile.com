      <p>Hi Eli!</p>
      <p>I’d say the only encoded ligatures you should include are fi and fl, because there is a fair chance that in some texts they were set as one single character:</p>
      <p>(US keyboard)<br>
      <code>alt shift 5 = ﬁ<br>
      alt shift 6 = ﬂ</code></p>
      <p>(Spanish ISO keyboard)<br>
      <code>alt shift f = ﬁ<br>
      alt shift g = ﬂ</code></p>
      <p>Duplicate them as f_i and f_l is not mandatory, but doesn’t hurt anyway, since this way you are not depending on the Mac OS Roman encoding.</p>
      <p>At least, that is what I did for <a class="freelinking external" href="http://new.myfonts.com/fonts/estudio-ch/espinosa-nova/regular/characters.html" rel="nofollow">Espinosa Nova</a> (check out slots 386, 387, 390 and 391).</p>
      <p>———</p>
      <p>About the uppercase long s:<br>
      <a href="http://en.wikipedia.org/wiki/Capital_%C3%9F" title="http://en.wikipedia.org/wiki/Capital_%C3%9F">http://en.wikipedia.org/wiki/Capital_%C3%9F</a><br>
      (Included in Espinosa Nova as well, see slots 88 and 195.)</p>
      <p>———</p>
      <p>And please Eli, let me see your typeface when it is done. I am intrigued about the long s. Are you working on an oldstyle typeface?</p>
