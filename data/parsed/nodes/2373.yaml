    html: <p>An interesting "r" but I had to reference it in the words to make out what it was. <br> <br>"m" looks poor at small sizes (look in top-right corner in the WARNING area, the words "minors" and "<a href="mailto:hardcore@norm.to">hardcore@norm.to</a>" have weird looking "m"s. Although for some reason I have no problem with the "m" in "may".) <br> <br>I really like the font though, especially how well different bolds work together.</p>
