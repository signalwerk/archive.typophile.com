  html: <p>I just thought we could discuss a bit about monolined since it's still a contemporary type trend. We know some people love it and others just think it's too easy. This thread is open to all opinions. <br> <br>What about if we also try to create a list of the best types in this movement? <br> <br>Is Lineto a reference with their Gravur Condensed and simple? And about MM Paris?  <br> <br>Drop us your opinion here. <br> <br>thank you  <br>Helder <br> <br><img src="http://www.typophile.com/forums/messages/4100/22236.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/4100/22237.gif" alt=""></p>
