    html: |-
      <p>@ bert: Can you cite studies which support these points? Conventional wisdom dictates this, but there is little empirical data to back it up.</p>
      <p>@ jarsson: try looking at</p>
      <p>Stiff, P. (1996). The end of the line: a survey of unjustified typography. <em>Information Design Journal, 8(2)</em>, 125–152.</p>
      <p>Miles Tinker did a <strong>lot</strong> of work around the 1950's on type and reading, but he was more interested in speed and eye movements than comprehension. His studies, while not perfect, are quite easy to read and a great starting point.</p>
