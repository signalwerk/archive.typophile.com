    html: <p>I think studies have found that flush left works best, because the eye knows the proper point to return to at the end of a line. But this is in comparison to ragged left and centered. I suspect that in the case of those slanted, but otherwise consistent columns, there shouldn't be a significant difference (for that reason).</p>
