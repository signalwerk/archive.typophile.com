    html: |-
      <p>The case made for flush left (aka ragged right, if I am not mistaken) is twofold:<br>
      1. A consistent beginning of each line, which aids continuation after the end of a line<br>
      2. Identical wordspaces, which facilitates reading by consistency (the eye [brain] knows when the next word starts and how much to ‘jump’ to the next word)</p>
      <p>In your example both points can not be satisfied, hence these are less legible than flush left.</p>
