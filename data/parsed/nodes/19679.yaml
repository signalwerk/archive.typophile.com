    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 2.May.2006 2.50pm </div>
      <p>/ / / / /</p>
    <p>Hi!<br>
    Happy May Day from an island off the coast of America.</p>
    <p>There’s a lot happening, so we’ll get right to it...</p>
    <p>/ / / / /</p>
    <p>Odile by Sibylle Hagmann is released!</p>
    <p>This extraordinary new serif type family is Sibylle Hagmann’s first release on her own foundry. (You may be familiar with her Cholla family, published by Emigre.) The type is inspired by a W.A.Dwiggins design from the 1930s, but the design is completely contemporary. The family consists of two weights in roman and italic, along with two sets of initial capitals, the unique Upright Italic, and a set of beautiful Ornaments. (Even before its release, Odile was one the 18 winners of the Swiss Federal Design Competition for 2005.)</p>
    <p>Use the mudTyper to try the fonts out, and be sure to view the extended glyph tables for the types.</p>
    <p>Odile is shipped in OpenType and legacy PST1 formats; the OpenType fonts support dozens of languages, and include small caps (in the lighter weight), 6 numeral sets, and a collection of standard and discretionary ligatures.</p>
    <p><a href="http://vllg.com/Kontour/Odile/mudTyper+Weights/" title="http://vllg.com/Kontour/Odile/mudTyper+Weights/">http://vllg.com/Kontour/Odile/mudTyper+Weights/</a></p>
    <p>/ / / / /</p>
    <p>KLIM is the 11th member of the Village co-op!</p>
    <p>The great young New Zealander Kris Sowersby - aka KLIM - is the newest member of our group. His work has its roots in history, but his work is entirely 21st-century. Stay tuned to his page for a preview of Feijoa, which will be the first KLIM type family to be published.</p>
    <p><a href="http://vllg.com/KLIM/" title="http://vllg.com/KLIM/">http://vllg.com/KLIM/</a></p>
    <p>/ / / / /</p>
    <p>An offer you can’t refuse?</p>
    <p>To celebrate the arrival of Spring, we are offering a selection of recent display fonts: 5 type families from 5 foundries.</p>
    <p>Spring 2006 Display set:<br>
    / Bello Pro from Underware (Connecting script with OpenType ligatures and small caps)<br>
    / Garda from Feliciano Type Foundry (3 variants of classic capitals)<br>
    / Kaas by Hugo d’Alte for Thirstype (Silver prize in Finland’s Grafia competition!)<br>
    / Local Gothic from Orange Italic (with revolutionary OpenType randomization)<br>
    / Mavis from Village (2 variants with subtle alternate-replacement)</p>
    <p>Get these five families for only $229, one-third off the combined price of $353. Offer available through July 31, 2006.</p>
    <p><a href="http://vllg.com/offers.php" title="http://vllg.com/offers.php">http://vllg.com/offers.php</a></p>
    <p>/ / / / /</p>
    <p>With warm wishes from New York.</p>
    <p>Village<br>
    168 Second Avenue #253<br>
    New York NY 10003<br>
    USA</p>
    <p>telephone ++1 646 654 1506<br>
    fax ++1 646 429 8597</p>
    <p><a href="http://vllg.com/" title="http://vllg.com/">http://vllg.com/</a> / / / / / / / / / / / / / / / / / / / / / /</p>
