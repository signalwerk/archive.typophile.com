      <blockquote><p>They have identical Open Type tables, identical hinting, and nothing I see that would differentiate them. Do you, or anybody else, have any idea about why there such different file sizes?</p></blockquote>
      <p>Running them through TTX one clear difference between them is the presence of a DSIG table in the 'PC' version.</p>
