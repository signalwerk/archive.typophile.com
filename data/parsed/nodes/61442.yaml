    votes: null
    html: |-
      <p>Looks like the official word from FontLab is to hold off upgrading to 10.6 for now. In an email sent today to FontLab users from Ted Harrison:</p>
      <p>"Since our first tests showed FontLab Studio working fine on OS 10.6 we thought we were home free. But many reports are now coming in of unpredictable system crashes while using Snow Leopard and FLS5. And we aren't the only one. Photoshop Elements, Google Gears, Adobe CS2, CS4, RealVNC and Parallels 3.0 (and many others) reportedly either flat out don't work, or just don't work right. Apple has posted a support page that includes a partial list of software known not to work with Snow Leopard: <a href="http://support.apple.com/kb/HT3258" title="http://support.apple.com/kb/HT3258">http://support.apple.com/kb/HT3258</a> </p>
      <p>"Our recommendation is to stick with OS 10.5 until Apple comes out with updates.<br>
      Thanks for your patience."</p>
      <p>I would be curious to know if the update that was issued this afternoon (10.6.1) has any effect on this situation.</p>
      <p><a href="http://support.apple.com/kb/HT3810" title="http://support.apple.com/kb/HT3810">http://support.apple.com/kb/HT3810</a></p>
    html_clean: |-
