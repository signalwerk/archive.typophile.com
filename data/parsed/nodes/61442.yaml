    html: "<p>I was all set to upgrade until I saw this: According to <a href=\"http://forum.fontlab.com/fontlab-studio-problems/when-fontlab-crashes-on-snow-leopard-the-whole-os-crashes-t7189.0.html;new\" rel=\"nofollow\">this thread on the FontLab forum</a>, people are seeing random crashes, sometimes taking down the whole system, when running FontLab Studio on 10.6. A crash taking down the entire system is not something I've seen for a while, and prefer not to see again any time soon. Anybody else experiencing this sort of thing after upgrading?</p>"
