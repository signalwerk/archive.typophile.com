    <p><object width="521" height="347"><br>
    <param name="allowfullscreen" value="true">
    <param name="allowscriptaccess" value="always">
    <param name="movie" value="http://vimeo.com/moogaloop.swf?clip_id=973466&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=1&amp;color=00adef&amp;fullscreen=1"><embed src="http://vimeo.com/moogaloop.swf?clip_id=973466&amp;server=vimeo.com&amp;show_title=1&amp;show_byline=1&amp;show_portrait=1&amp;color=00adef&amp;fullscreen=1" type="application/x-shockwave-flash" allowfullscreen="true" allowscriptaccess="always" width="521" height="347"></object><br><a href="http://vimeo.com/973466">animated_text_1 / time &amp; motion design</a> from <a href="http://vimeo.com/cutupculture">Michael Hersrud</a> on <a href="http://vimeo.com">Vimeo</a>.</p>
    <p>From the instructor:</p>
    <blockquote><p>Each student had to select a short text excerpt that could be a quote, news headline, passage from a book or play, or poem. with the text create a 10-15 second animation using text only (graphical elements acceptable), black and white only (no gray scale but overlapping transparency is acceptable) and a san serif font. you cannot use any pre-determined 'special effects animations'. you should react to your content and develop an animation to reflect the content, have readability and rhythm, as well as visual interest and experimentation.</p></blockquote>
    <p><br><br><br>
    Added to the <a href="http://www.vimeo.com/groups/typophile">Typophile Group on Vimeo</a> </p>
