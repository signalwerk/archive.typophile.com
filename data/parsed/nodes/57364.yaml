    <p>From the instructor:</p>
    <blockquote><p>Each student had to select a short text excerpt that could be a quote, news headline, passage from a book or play, or poem. with the text create a 10-15 second animation using text only (graphical elements acceptable), black and white only (no gray scale but overlapping transparency is acceptable) and a san serif font. you cannot use any pre-determined 'special effects animations'. you should react to your content and develop an animation to reflect the content, have readability and rhythm, as well as visual interest and experimentation.</p></blockquote>
    <p><br><br><br>
