    html: |-
      <p>Aringacute and Oslashacute are almost obsolete, although still are used in some Danish grammars, dictionaries and other linguistic texts, perhaps also in some poetry (quoting John Hudson from <strong><a class="freelinking external" href="http://typophile.com/node/35221" rel="nofollow">here</a></strong>). kgreenlandic (aka <strong>kra</strong>)and napostrophe is almost extinct, but I still see them often implemented in many typefaces. They are described in this <strong><a class="freelinking external" href="http://www.evertype.com/alphabets/greenlandic.pdf" rel="nofollow">PDF</a></strong> by Michael Everson. Implementing it possibly would require to add also a specific Greenlandic uppercase K, as described <strong><a class="freelinking external" href="http://typophile.com/node/35971" rel="nofollow">here</a></strong>.</p>
      <p>About the lack of Unicode reference of Tcommaaccent the mistake is mine (in my old FontLab codepages I found only the glyph name, not Unicode values). Should have checked more thoroughly.</p>
      <p>None of these glyphs are in heavy use; I mention them only because they still exist in <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/WGL4.htm" rel="nofollow">WGL4 specifications</a> (i.e. Microsoft cosider them still not totally extinct).</p>
