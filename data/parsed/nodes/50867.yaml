      <p>Regarding Polish diacritics all but Ł and ł (uc and lc slashed L) are really well drawn, which is not common. Without Ł and ł (uc and lc slashed L) you cannot typeset texts in Polish language. There's also historical and rare ligature combining to lc "łs" <a class="freelinking external" href="http://typografia.ogme.pl/images/stories/podstawy/rys_roz_2/Ligatury_stadardowe3.gif" rel="nofollow">link to example of ligature łł</a>. BTW very interesting typeface.</p>
      <p>Cheers,<br>
      Antoni</p>
