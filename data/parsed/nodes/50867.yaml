    <p>This is a typeface I have been working on for some time now. The design is done, but I need some help with the non-English glyphs:</p>
    <p>1. I have gone through the websites of Gunnlaugur SE Briem, Adam Twardoch, Diacritics Project, and many pages on Typophile, and they all were extremely helpful. I don't know if I interpreted all the information correctly and would like people to comment on the accuracy their native language glyphs.</p>
    <p>2. The PDF shows the character set I have settled on, but I would like to know if I missed anything.</p>
    <p>3. What are the common ligatures of non-English languages.</p>
    <p><a href="http://typefetish.com/works/rm_it_cs.pdf" title="http://typefetish.com/works/rm_it_cs.pdf">http://typefetish.com/works/rm_it_cs.pdf</a></p>
    <p>much thanks<br>
    Michael</p>
