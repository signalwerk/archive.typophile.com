    html: |-
      <p>The typeface looks quite interesting. The important omitted glyphs are as follows:<br>
      Idotaccent (uni0130) and dotlessi (uni0131) (Turkish, discussed <a class="freelinking external" href="http://typophile.com/node/13570" rel="nofollow">here</a>)<br>
      Tcommaaccent and tcommaaccent (without Unicode reference, needed for Romanian)<br>
      Eng (uni014A) and eng (uni014B) (needed for rare languages like Sami and some African languages)</p>
      <p>If becoming punctual, there are also 4 optional glyphs you should add, although in many typefaces they are not present - <strong><a class="freelinking external" href="http://typophile.com/node/35221" rel="nofollow">Aringacute/aringacute</a></strong> and <strong>Oslashacute/oslashacute</strong> (although I'm too lazy to check the Unicode points for them). </p>
      <p>Also from WGL4 maybe you should add kgreenlandic (uni0131) and napostrophe (uni0149), although I haven't seen them in real use.</p>
      <p>The matter of adding CE charset is discussed in more detail <a class="freelinking external" href="http://www.typophile.com/node/2764" rel="nofollow">here</a>.</p>
      <p>Now about the quirks: I have some doubts regarding the ogonek placement in iogonek (Roman). Otherwise the diacritics placement looks ok to me.</p>
