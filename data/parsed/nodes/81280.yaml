  html: <p>Just mentioning this so that anyone else who hasn't noticed yet won't be surprised. You know how a few glyphs automatically get two codepoints because they appear in Latin-1/Mac junk and also in the Greek block? Now, say you open Tools:Actions because you want to slant every glyph 8 degrees, for instance. If you check "Apply to entire font", the action will be applied <em>twice</em> to any glyph with with two codepoints. The mu, Delta, and Omega will be slanted 16 degrees. Depending on how subtle the effect is, the difference could escape your attention for a while.</p>
