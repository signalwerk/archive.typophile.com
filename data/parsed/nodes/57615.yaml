    <p>Hi everyone,</p>
    <p>I'm new here, you've got a great thing going on! Congrats.<br>
    I would like to find some fonts that are similar to the following ones. I realized these are not fonts but hand-drawn lettering, but I guessed maybe you could give me a hand.</p>
    <p>These come from a 1950's argentinian melodrama. The most difficult one is the one in which is "Luis César" is written.</p>
    <p>Thank you so much for your help!</p>
