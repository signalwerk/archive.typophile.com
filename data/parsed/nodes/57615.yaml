      <p>I searched all the script fonts that might have been like this which I have collected for my Guide and really found nothing that had its blend of casual and formal letters. The most similar (to me) was Jason Walcott's <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=JBT0000048#flont" rel="nofollow">Shirley Script</a>, and then Mark Simonson's <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=UMT0000346#specimen" rel="nofollow">Lakeside</a>, which is a bit more monotone in its stroke. Neither is very close, but at least they have the feel of this era, and they use somewhat similar letterforms. I was governed most by the L and C initials, and so the D for "Direccion" is not too similar. That D style doesn't seem to go with most scripts that have a similar L &amp; C.</p>
      <p>- Mike Yanega</p>
