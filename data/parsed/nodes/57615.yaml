      <p>Mariano, </p>
      <p>Welcome to Typophile, I'm an old timer and also very new to this blog... I hope you'll enjoy it just as much as I do!</p>
      <p>FYI: All movie posters and titles in Argentina during this period and before the early 1960's, they were all hand-lettered. My former father-in-law, Alfredo Faistman was one of the busiest hand-lettering artist working in downtown Buenos Aires ad agency during the late 40's and early 60's. Alfredo worked mainly in movie titles and posters -- I considered him a genius w/ the brush and pen. I wouldn't be surprised if this is one of his works.  I can contact his living wife and ask her if that's the case, she might remember.</p>
      <p>Alfredo was my inspiration during my early graphic design career, and for the love I have for typography. I met him in NY in the early 60's while dating his daughter. He used to work for Norcross then, a very famous greeting card company based in NY (similar to the Hallmark company). Alfredo was hand-lettering greeting cards until the early 1970s. That's when the greeting card industry starting to switch to photo-lettering.</p>
      <p>When I get more information about your movie title... I'll pass that information to you.</p>
      <p>sal</p>
