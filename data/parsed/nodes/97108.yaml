      <p>Pronounciation is a very nice eggcorn — well done.</p>
      <p><a href="http://en.wikipedia.org/wiki/Eggcorn" title="http://en.wikipedia.org/wiki/Eggcorn">http://en.wikipedia.org/wiki/Eggcorn</a></p>
      <p>I believe: aerial is fine. Trinité is tri-ni-TAY — note the accent mark. Or, depending how much you want to anglicize is, tree-nee-tay etc.</p>
      <p>Haas is just hahss.</p>
      <p>AHK-zi-denz gro-TESK, as far as I know.</p>
      <p>Definitely bo-DO-nee.</p>
