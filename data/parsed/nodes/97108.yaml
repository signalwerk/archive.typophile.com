      <p>Speaking of pronunciations, we had a customer call from New Orleans once and ask if we had the typeface "Arostel".</p>
      <p>Arostel? Never heard of it. He didn't have anything with the name on it in front of him; it was given to him verbally. After several minutes on the phone with him, he was able to more or less describe it to us, and we finally figured it out.  Eurostile.</p>
      <p>We all had a good laugh about that one.</p>
