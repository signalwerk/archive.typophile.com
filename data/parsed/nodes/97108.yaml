    <p>There's just been a lot of type terms I've never really knew how to pronounce because they're just not words you hear everyday. Wondering if anyone could help me or at least say how you pronounce them</p>
    <p>Haas (hahss? ahss?)<br>
    Akzidenz Grotesk (always said ack-zee-dens gro-tesk, but I've heard a type director say a weird pronunciation along the lines of ack-zee-den grawt. Possible abbreviation?)<br>
    Lubalin (loo-buh-lin?)<br>
    Bodoni (bo-doe-knee or bo-doe-nai? I've heard both)<br>
    Arial (ah-ree-AL or like aerial? also heard both)<br>
    Trinite<br>
    Peignot</p>
