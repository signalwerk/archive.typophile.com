      <p>AFAIK,<br>
      Lubalin &gt; loo-BAH-lin (open a)<br>
      Bodoni &gt; boh-DOH-nee (closed o)<br>
      Arial &gt; ah-ree-AL or EH-ree-al<br>
      nonpareil &gt; non-pah-RAY (open e)<br>
      brevier &gt; breh-vee-EH (closed e)<br>
      bourgeois &gt; boor-GWAH (open a)<br>
      primer &gt; pree-MEH (closed e)<br>
      pica &gt; PAEE-kah (open a)<br>
      Trinité &gt; tree-nee-TEH (closed e)<br>
      Peignot &gt; pehn-OH (closed o)<br>
      Oldřich &gt; old-REE-eek (weak r, short ee)<br>
      Líčko? &gt; LEE-tch-koh (č = tch)<br>
      Veljovic &gt; feh-lee-OH-fee-tch (j = short ee)</p>
