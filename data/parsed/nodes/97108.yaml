      <p>I don't know IPA, so it would be something like "huh-rahnt" (we don't inflect syllables in names, or actually anywhere unless it's emphasized à la Italics... for which we have a floating mark*... which is why we don't need Italics nearly as badly as you guys :-). And please don't trill the "r" even if that makes it sound more authentically ethnic.  :-)</p>
      <p>* U+055B</p>
      <p>hhp</p>
