    <p>Hi All,</p>
    <p>I have been a lurker on this forum for a little while but now I have a question that I would like to ask. :)</p>
    <p>I am working on a property /  land release job and I am looking for a friendly and contemporary sans-serif face, perhaps with a hint of personality. NOT GOTHAM! But something in the same vein, perhaps something new that you have seen and would love to see used more.</p>
    <p>Suggestions welcome!</p>
    <p>Thanks!<br>
    Emma</p>
