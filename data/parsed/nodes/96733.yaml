    html: |-
      <p>You know, I was forced to license Omnes Pro for an ongoing project.</p>
      <p>It's friendly, yes, but probably looks too much like a pampers advert for what you need.</p>
      <p>The main reason I bring this up: at first, I wasn't entirely pleased to have to use it as I'm a bit tired of rounded fonts. However, I have become a fan -- with all its weights, stylistic sets, numbers that come enclosed in circles (massive, massive, timesaver), arrows of all sorts.</p>
      <p>I'm quite surprised to find that it is the best font I have ever used.</p>
      <p>It probably doesn't work for your project, and I don't mean to hijack your thread, but Omnes has helped me re-evaluate how I'll choose fonts for projects, especially if they involve a lot of typesetting and information display/design.</p>
