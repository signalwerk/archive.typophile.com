      <p>After 2+ years and a few twists and turns, I'm pleased to announce we've released the first revival from this foundry called Feather Script! Check it out at: <a href="http://www.fontbros.com/families/feather-script/styles/regular" title="http://www.fontbros.com/families/feather-script/styles/regular">http://www.fontbros.com/families/feather-script/styles/regular</a></p>
      <p>It was revived from the original glass masters used by Lettering Inc and originally designed in the mid-1940s by Patrick Griffin of CanadaType. It was originally listed as Script #3000 to Lettering Inc customers and internally referred to as Flamingo (already taken and in use)</p>
      <p>We're very excited to see this face back in action and it's wonderful to see how timeless and tasteful it remains today!</p>
