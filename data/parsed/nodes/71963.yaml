    <p>I've done a lot of work on <a class="freelinking external" href="http://typophile.com/node/40757" rel="nofollow">Rekord</a> recently, so I thought I'd share it with you. Since it has developed so much, I thought I'd start a new thread in the sans-serif section. The new Rekord will, if all goes well, be a six-weight family with italics, and be available later this year (after I've finished <a class="freelinking external" href="http://vllg.com/Incubator/Tram#panel=poster" rel="nofollow">Tram</a>, which is more than overdue).</p>
    <p>Also, Rekord is the new typeface used by <a class="freelinking external" href="http://rpho.nl/" rel="nofollow">Rotterdam's Philharmonic Orchestra</a>, which I'm very happy about. More can be seen here: <a class="freelinking external" href="http://www.gergievfestival.nl/" rel="nofollow">Gergiev Festival</a></p>
    <p>There's still a lot to do and refine, but so far I'm happy with the development... and curious to hear what you think.</p>
    <p>Cheers,<br>
    Hanno</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/REKORD_July2010_5199.jpg"></div><p></p>
