    <p>I've done a lot of work on <a href="http://typophile.com/node/40757" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rekord</a> recently, so I thought I'd share it with you. Since it has developed so much, I thought I'd start a new thread in the sans-serif section. The new Rekord will, if all goes well, be a six-weight family with italics, and be available later this year (after I've finished <a href="http://Tram" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Tram</a>, which is more than overdue).</p>
    <p>Also, Rekord is the new typeface used by <a href="http://rpho.nl/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Rotterdam's Philharmonic Orchestra</a>, which I'm very happy about. More can be seen here: <a href="http://www.gergievfestival.nl/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Gergiev Festival</a></p>
    <p>There's still a lot to do and refine, but so far I'm happy with the development... and curious to hear what you think.</p>
    <p>Cheers,<br>
    Hanno</p>
    <p><img src="/sites/default/files/old-images/REKORD_July2010_5199.jpg"></p>
