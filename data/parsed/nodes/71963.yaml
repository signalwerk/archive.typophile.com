    html: |-
      <p>Looking great! I'm weary of techno fonts but this is very lively and interesting, and carefully crafted. The bolder weights have a bit of early Soviet poster aesthetic to my eyes.<br>
      On the alternates, I really dislike the M's and N's (but of course, as alternates I'd be free to ignore them).<br>
      For the diagonal alts, did you consider making that change in angle a bend rather than a rigid angle?<br>
      The figures look like credit-card numbers to me. I wonder if six and nine can somehow partake of the interesting diagonals that are the typeface's signature (e.g. P/R).</p>
