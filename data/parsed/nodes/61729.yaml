      <p>It's definitely easier to see the lightbulb now though I'm wondering if it still works without showing it's winding in such a detailed way. This maybe causes problems when displayed in a rather small size.</p>
      <p>Regarding to the serifs I'd suggest adjusting them in a way that makes the "L" more suitable to the "O". Furthermore the serifs of "A" and "P" look too different. I can see why you've made them the way they are but especially "P" looks a bit strange. I would not establish serifs in "LIGHTING" since they're only applied to "L" and "G" and therefore feel out of place.</p>
      <p>Take a closer look at the kerning of "G" and it's neighbours since it looks like the distance is too wide compared to other letter-combinations.</p>
      <p>Nevertheless I think it's a big improvement.</p>
