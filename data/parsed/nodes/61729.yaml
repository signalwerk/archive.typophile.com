      <p>Finally, someone saw it. Thanks for that lovely info-graphic, epsilicon. Unfortunately, it's a bit too late for that version. I've already redesigned it, this time to be a bit more obvious. Bear in mind that this is only a wireframe:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/apollo-lighting-logo-small_5306.png"></div><p></p>
      <p>I wanted the type to be a bit more distant from Avant Garde, so I made some subtle alterations besides the pointed/sloped termini (widened the H, T, P and L's)—I tried to build on a theme of clarity, sharpness, boldness, and energy. The lightbulb icon can now stand alone, and the words can be displayed stacked or side-to-side.</p>
      <p>I feel like this design can work as a goofy faux-3d Web 2.0-ish logo or as-is. I like the idea of a chandelier or some sort of abstract lighting installation. I was actually hoping to build this logo with a real lightbulb and letters cut from some sort of material to act as a prop for the client's studio/showroom.</p>
      <p>(by the way, what's the norm here on Typophile for directing comments at folks? To use the first name in their profile or just their username?)</p>
