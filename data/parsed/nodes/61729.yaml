    <p>Hello, everyone.</p>
    <p>First time throwing out a design of mine on any sort of forum. I've always been a lurker of Typophile. This new logo I'm designing for a lighting company was born out of a commission for new business cards. Since I'm a fairly isolated and new designer, I'd like to have some thoughts from veterans before it gets hoisted up on 10000 cards, a new website, and possibly other things.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/apollo-lighting-typof_6485.png"></div><p></p>
    <p>...spent an obscene amount of time coming up with that after trudging through concept after concept. It was one of those "aha" moments when I finally decided to stop playing around with fancy type and symbols and fall back to trusty Avant Garde. Fair warning: I'm pretty new at designing logotype and getting paid for it. Am I on the right track?</p>
