      <p>I also dont really think there is any problems in legibility of the first concept you posted. </p>
      <p>At first I didnt really grasp the concept, but once you told us they were light bulbs it all came together for me. (The image you put together with the light bulbs actually illuminated is what did the trick)  Unfortunately, I feel that that symbol is kind of lost in the black and white wordmark.  Maybe the idea would come through stronger if you tried to hint in some threading on the light bulbs, or if you added a reflection in these somehow to make it seem more like glass within the negative space of the O/G. </p>
      <p>I like the design though, as it seems very modern and clean.. which is an image a lighting company should be trying to convey I would think.</p>
      <p>One thing I see though, is word "Apollo" is very powerful simply because of its attachment to mythology.  It might be a good idea to play around a little more with developing a concept around "Apollo" rather than "Light bulb".. although the fact that it is a lighting company certainly trumps the mythology factor in my mind. </p>
      <p>Good work.</p>
