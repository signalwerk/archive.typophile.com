      <p>Funny you should mention using a thinner weight, Alex. This is one of my earlier concepts using Avant Garde:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/apollo-light-3_6591.png"></div><p></p>
      <p>Modifying the G is what eventually led me to try out the lightbulb thing (think the type of spherical, perfect orb-like bulbs and not the normal kind). The sunburst was a pretty point-blank idea (Apollo...) though I thought the sun's rays could literally be "waves" because this particular lighting company provides a lot of marine lighting solutions for yachts and things. It was more recently that I learned the company has lights for residential and commercial needs, too.</p>
      <p>Just for the record, I don't like putting the sunburst around the O because a. it's cheesy, b. it weighs that side of the logotype down. If the mark is disembodied, I can't seem to make it play nice with the text.</p>
