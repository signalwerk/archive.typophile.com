      <p>As for the first logo, I had no problem reading it because "Apgllg", "Apcllc" and "liohtino" are not words, so the mind automatically reads the words that do exist. I'm not sure how fast the minds of other people work, but I don't even need time to figure anything out; I read it right away. That being said, I do think it's a bad logo for two reasons:<br>
      1) the light bulb isn't obvious enough<br>
      2) repeating the concept 4 times also weakens the concept by the factor 4.</p>
      <p>I think the design with the sun is very aesthetic, but doesn't seem to breath the atmosphere that a company like this should breath.</p>
      <p>I think you pretty much nailed it in the third logo. I quite like the serif on the A and P, by the way. But I do have to conclude that it's a bit distracting, and on top of that it reminds me of the Prada logo. The tight, bold geometric serif-sans logo you selected is perfect. I think the "lighting" part should be a bit heavier though. Not as bold as <a class="freelinking external" href="http://typophile.com/files/apollo-lighting-logo-small_5306_3897.png" rel="nofollow">here</a> though</p>
