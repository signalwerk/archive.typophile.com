      <p>&gt; it can help give some leverage to the workers </p>
      <p>Unions are generally most effective in occupations where employers hire a large workforce of union members -- places like factories, hospitals, schools, etc.  Employers know that if the union goes on strike they'll lose a large workforce that may be difficult to replace.</p>
      <p>There aren't many companies that have a huge staff of graphic designers. If a company has two graphic designers on staff, the threat of a strike won't mean much. If they go on strike they'll just be replaced.</p>
      <p>Also unions generally specify wages, which may be easy to do in a factory where you're paid by the hour, or a school where you get a yearly salary, but many (perhaps most) designers are self-employed and price each job individually based on a variety of factors.</p>
      <p>I just don't see a union happening.</p>
    html_clean: |-
