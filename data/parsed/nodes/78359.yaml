      <p><cite>Collusion on price fixing is not legal at least in the USA.</cite></p>
      <p>Unions and some professional organizations are not bound by the same antitrust rules that businesses and individuals are. This is why, for example, the Graphic Artists Guild can do a survey of hourly rates for design services and publish it.</p>
      <p>I can’t see how AIGA can even compare to a real union. For starters, how many unions not only demand membership dues but then also demand more money every time you want to show up at a meeting?</p>
