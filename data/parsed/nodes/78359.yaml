      <p>At one point a while back I had a concept to start a font foundry with a union theme but after running it past a few midwesterners, the idea was quickly dismissed. Unions aren't a creative theme to hang a hat on, they are very serious business here in the midwest and still very much active.</p>
      <p>I agree fully with James that there isn't really any advantage to unionizing the font industry because we're all independent contractors as it were not unified under any single organization that we work for or service . . .</p>
