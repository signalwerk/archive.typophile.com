  html: |-
    <p><em>Ommwriter is a humble attempt to recapture what technology has snatched away from us today: our capacity to concentrate.</em></p>
    <p>Ommwriter is a simple text processor that firmly believes in making writing a pleasure once again, vindicating the close relationship between writer and paper. The more intimate the relation, the smoother the flow of inspiration.</p>
    <p>Interesting concept, presentation and execution. Really well designed website too, with cufon'ed Quicksand for headers :)</p>
    <p><a href="http://www.ommwriter.com/en" title="http://www.ommwriter.com/en">http://www.ommwriter.com/en</a></p>
