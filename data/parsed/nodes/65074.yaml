      <p>Uhhh, did they really put that "meditation music" into the app? &lt;:-o<br>
      For my taste, this might still be too distracting for what should just be a text editor. And it's a bit too cute, but whatever floats your boat I guess.</p>
      <p>FWIW when I was writing a lot (like for my diploma thesis) I enjoyed Ulysses. Plain-text format, some nice productivity features (like an additional "notes" window for each document, which can even take images – very handy), AND a nice fullscreen mode with no distractions. Not even a winter landscape :)<br>
      (Disclaimer: It's been a good couple of years &amp; I haven't updated, so dunno how it is now.)</p>
