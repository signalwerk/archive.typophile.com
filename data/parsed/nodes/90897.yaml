      <p>Indications of which printing. They place a number for each of the anticipated printings from the get-go, then strike the lowest number each time to indicate which printing it is, instead of the more laborious process of composing the page with a new number each time.<br>
      Sometimes you'll see this kind of order:<br>
      1 3 5 7 8 6 4 2<br>
      That's one way to keep that line more-or-less centered as the numbers disappear with each printing.</p>
