      <p>The numbers at the bottom are reprint numbers.</p>
      <p>So, your copy is the 36th printing of the 1972 edition. Obviously, they didn’t go back on press 35 times in the first year; so your copy was certainly printed much later. </p>
      <p>But if there are no textual changes, then there is usually no change to the publication date. The only indication of the new reprint is to scrub another number from the plate.</p>
      <p>Usually, a new foreword or introduction to a reprinted edition should have a date of its own attached to it, I would think.</p>
      <p>If you wanted to find the exact actual printing date of a specific paperback edition, you’d probably have to find some business records of the publisher. I doubt this is something that anyone except the production director really cares to keep track of.</p>
