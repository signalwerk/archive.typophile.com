      <p>I don’t believe the practice existed when books were set in metal and printed letterpress. I believe it only came about as the confluence of two things: offset lithography and when it became practical to hang on to the plates for future reprints.</p>
      <p>I don’t think it was practical (certainly not common practice) to store the galleys for an entire book in metal.</p>
      <p>But with offset lithography, at a certain point it was more cost-effective to store the aluminum plates (or at least the photographic page flats) for a book with expected longevity, than to reshoot the flats or reburn the plates.</p>
      <p>At that point, it made sense to set a string of reprint numbers, where the only thing required when going to reprint would be to either opaque out the previous number (if working with the films) or scrub/degrease the number (if working with the plates). Easier than remaking the page (or, more likely, the entire form).</p>
      <p>Nowadays, the practice is probably more a matter of convention than practicality, since plates are no longer saved and pages are archived as files (either source, or imposed sigs) and it’s a relatively minor matter to make an adjustment to the copyright page on the way to re-plating.</p>
      <p>I don’t know, I suppose maybe there’s some minor advantage to being able to just delete the previous number, over resetting the line. Seems minor, compared to the origins of the practice anyway.</p>
      <p>Charles E will set me straight if I’ve made any incorrect assumptions or misstated anything.</p>
