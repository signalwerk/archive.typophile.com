      <p>The practice of using reprint edition numbers started when offset printing became the principal means of book printing. Only a simple rearrangement in one line was needed (remember doing that in film?) to adjust the line. In case of a symmetrical placement the numbers were blocked out or scratched of (depending on the base being a pos or neg).</p>
      <p>@HVB: In principle there won’t be differences between printings — except the number of the printing. Any changes would require it being named a new edition.<br>
      My guess is that the correction of a small number of (typographies) errors would not warrant it calling a new edition. There would probably be a kind of indication on the full printing forms to inform the printer and the publishers, maybe in the fold or in the bleed. Example (slightly out of the field): the different printings of the Tintin comic books are coded vy the publisher to reflect changes etcetera.</p>
    html_clean: |-
