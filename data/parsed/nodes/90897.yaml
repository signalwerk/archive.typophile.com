      <p>Thinking back to my early days, at the end of the hot metal age, of course you wouldn't have had pages stored. More likely it was stereo mats, that could be used to cast a new printing cylinder. I wonder if the system was in use then ... and if so, how did you cancel out a number on a mat? I like to imagine an old printer filling the mat with some chewing gum before casting it ... but really I have no clue.</p>
      <p>Don</p>
