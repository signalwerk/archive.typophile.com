      <p>If you use the search bar, and type in the word "management" you will be inundated with more information than you probably want. :^)</p>
      <p>I believe the big 3 have auto-activation, not sure if all do it for Photoshop. I've used auto-activation in Font Agent Pro and Font Explorer and found that I really prefer to activate things myself. But, to each there own. :^)</p>
