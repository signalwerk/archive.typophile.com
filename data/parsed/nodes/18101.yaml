    <p>Hello.</p>
    <p>I've got a question concerning font management. The topic has probably been discussed several times but couldn't find anything! Sorry!</p>
    <p>Q: I want to have all my fonts added to my font management software and I want illustrator/photoshop/indesign to be able to auto-active fonts when they are needed. E.g. I open a document using Elsner Flake Futura then I want it to be auto-activated. I also want the font tool to auto-update indesign/photoshop/illustrator when I am activating a font in the font management software. I am using Mac OSX.</p>
    <p>Cheers!</p>
