      <p>I agree completely with Nick, and I think he “understood” quite well what the intended point of this is…</p>
      <p><cite>“I chose to make the survey rather quick and easy to obtain as many samples as I could.”</cite><br>
      …which may just be what keeps you from getting any results that are actually <em>meaningful</em>.<br>
      To name just one thing, the method isn’t well thought out. You’re offering adjectives to pick and choose from; but certainly the range of words that designers and non-designers use to describe typefaces will not be congruent. </p>
      <p>Making a survey that yields meaningful results – and then actually finding those – doesn’t just mean filling in “quick questions” with equally quick multiple-choice answers, putting that online and telling people to go there. It’s actually a science in itself.</p>
