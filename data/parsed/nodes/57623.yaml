      <p>This is wrong.<br>
      It’s like asking the musician and the listener what they think of the sound of a particular musical instrument playing a random melody, and assuming that has some bearing on the effect of a musical performance.<br>
      Or asking the chef and the diner what they think of the taste of an herb, and assuming this has some bearing on the success of a dish.<br>
      For design it’s useless, and is detrimental to students developing their own discriminating taste.<br>
      As statistical research it is hopelessly amateurish.</p>
