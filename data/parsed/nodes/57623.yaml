    html: <p>I understand what you’re looking for, and I’m sure Nick did as well. But your survey is pretty much worthless considering you don’t actually gather any data about who’s opinions you’re soliciting. There are both designers and non-designers here. Type designers and graphic designers. People from all over the world. Young and old. Male and female. Etc. Also, what you’re researching is a complicated and multifaceted phenomenon that is amateurish to quantify it in such a superficial way. If you want some more useful data fluff you should develop a more robust semantic differential that also includes some information about your subjects.</p>
