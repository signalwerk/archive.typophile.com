    <p><strong>Are the characteristics of a typeface completely subjective, or are there certain visual elements that can be agreed upon, more or less?</strong> Please take my quick survey to help me answer this question for my research project.</p>
    <p>Here is the link:<br>
    <a class="freelinking-external" href="http://bearsinflight.com/type">http://bearsinflight.com/type</a></p>
    <p>I am surveying both designers and non-designers, to see if there is any correlation in opinion. When a designer chooses a typeface for an advertisement, is the effect of the typeface wasted on a different audience, or do they see the same thing? It is an important question and so far, the opinions have varied greatly.</p>
    <p>Please take the survey– all information will be put to good use. I am also interested in hearing your extended opinions here.</p>
