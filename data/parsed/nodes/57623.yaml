      <p>Some modifications for version 2:</p>
      <p>1. Investigate using <a class="freelinking-external" href="http://en.wikipedia.org/wiki/Pseudoword">pseudowords</a> instead of using real words as the semantics of the words will almost certainly influence subjective response.</p>
      <p>2. Randomize the order of the pseudowords <em>as well as the order of the responses</em> to counterbalance the design.</p>
      <p>3. Create a simple form which requires people to input demographic data: Age, gender, vision, first language, education &amp;c… so you can draw correlations.</p>
      <p>This is a good start.</p>
