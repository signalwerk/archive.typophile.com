      <p>It is axiomatic that lay readers and typographers see type differently, and that content, layout and specification affect the viewer’s perceptions.<br>
      Even for the typographer who is familiar with a face, and for whom it has a wealth of meaning of which the lay reader is ignorant, there are other considerations.<br>
      For instance, in the many ways of categorizing types, consider this index of familiarity:<br>
      - Types I have worked with but not used in finished pieces<br>
      - Types I have used in finished pieces<br>
      - Types I have seen occasionally used by others<br>
      - Types I have seen often used by others<br>
      - Types I have only seen in print or online specimens<br>
      - Types I have seen discussed</p>
