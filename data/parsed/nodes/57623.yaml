      <p>Okay, jackson, thanks for your feedback. What you are saying is absolutely correct and I realize this is not the most robust or comprehensive survey. All I am looking for is evidence of a trend. I chose to make the survey rather quick and easy to obtain as many samples as I could. I am treating this more like a preliminary study– to find if there is any trace of objectivity in the “personalities” of typefaces. My professor is actually hoping to take the study further in the near future.</p>
