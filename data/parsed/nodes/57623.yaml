      <p>I’d kind of agree too. The words on your list are not words I’d really use to describe fonts. You could add a field ’add your own tags’ which would perhaps give useful info. Or check out the tags people have added on MyFonts.com.<br>
      Or engineer it so that for each page, a random selection of 12 words from a dictionary of many more pops up. Having the same tags on each page makes it really difficult to differentiate my feelings about each font.<br>
      Perhaps you could also show all the samples on one page to be better able to assign different tags to each.<br>
      I’m also a bit mixed up about whether I should tag ’new’ for something that I haven’t seen before or for something I know was designed in the last few months or last year as opposed to centuries ago. The same goes for ’weak’...am I supposed to tag ’weak’ if I don’t like the font or if it’s light on the page?...it’s a bit unclear at what level the tags should be attributed.<br>
      Bear in mind that the designers and typographers here are pretty rigorous and that’s what makes Typophile so useful. But you won’t get anywhere near the same answers as non-designers, and quite probably the answers will be rather difficult to draw conclusions from. I guess I’m saying I’d like to see this work...good luck! ;)</p>
