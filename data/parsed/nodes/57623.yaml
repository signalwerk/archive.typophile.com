      <p>I’m not sure you fully understand what I am looking for. It is not about preference or success, it is about the underlying meaning found in type designs. Even if a typeface is intended to be completely neutral, it carries certain attributes along with it. For example, when a designer is creating a poster for a rock concert, they will, most likely, not choose an old-style serif type, because it implies some kind of formality and age. What I am studying is the consistency of this so called “typeface personality” among people of varying backgrounds.</p>
      <p>If you are still opposed to the study, that is fine. There are plenty of other people who have expressed interest in the topic.</p>
