      <p>Hi David,</p>
      <p>can you narrow that down please? I find it hard to think of anything typographic that would <em>not</em> be covered by this – well, okay, that was an exaggeration.</p>
      <p>Time period: of all times — post WWII — digital era — recent?<br>
      Geography/spread: world-wide — US — Europe — local?<br>
      Style/Importance: avant-garde/outstanding — idiosyncratic/representative — anything?</p>
      <p>Which Garamond?</p>
      <p>General clues for finding typefaces in use:<br>
      <a href="https://web.archive.org/web/20081011160748/http://www.typophile.com/node/12344">Search</a> typophile.com. Most of the faces you need have been asked for before. Like <a href="https://web.archive.org/web/20081011160748/http://www.typophile.com/node/42959">Meta</a>.</p>
      <p>Linotype.com has a pretty neat <a href="https://web.archive.org/web/20081011160748/http://www.linotype.com/2106/byalphabet.html">in use section</a></p>
