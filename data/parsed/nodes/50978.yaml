    date_raw: 28 Oct 2008 — 5:24pm
    votes: null
    html: |-
      <p>Moleskines are great because they are so well made and the paper is different. I have painted in mine using oils, acrylics, gouache, pastels and inks. The standard sketch books don't take water colour washes too well, but you can get interesting effects with it. If you use water colour than I would recommend the Moleskine water colour sketch books, these are very good and each page can be torn out with clean edges if need to.<br>
      For pens I use pencil, uniball vision elite, and Inoxcrom ball point.<br>
      Have fun.</p>
