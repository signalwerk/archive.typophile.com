  html: "<p>From the talented artist and typographic designer, Delve Withrington: <br> <br>\" <br>        I'd like to invite you all to some upcoming gallery <br>        exhibits that I'm participating in. They're all around <br>        the bay area so hopefully everyone will have a chance <br>        to see my work at a convenient location. The dates are <br>        listed below (beginning with one tomorrow night!) with <br>        the details on each following. For those of you not in <br>        the bay area, I'm looking for shows all over the country <br>        and I'll be sure let you know if something happens near <br>        you. In the meantime, you can get a sneak peek at some <br>        of my new work at my site: <a href=\"http://www.withrington.com\" target=\"_top\">http://www.withrington.com</a> <br> <br> <br>        Calendar at-a-glance: <br> <br>        1. Tomorrow, 6-8:30pm, Pro Arts Gallery, Oakland <br> <br>        2. 12/6/02, 7-10pm, City Art Gallery, SF <br> <br>        3. 1/3/03, 7-10pm, City Art Gallery, SF <br> <br>        4. 1/12/03, 2-4pm, Berkeley Art Center, Berkeley <br> <br>        5. 1/29/03, 6:30-8:30pm, Los Medanos College Art Gallery, <br>           Pittsburg, CA <br> <br> <br>        The Details: <br> <br>        The first event on the calendar is the closing party <br>        and final bidding opportunity in the silent auction at <br>        Pro Arts Gallery in downtown Oakland. I've a new piece <br>        called \"Axial Discord\" in this show and it could be <br>        yours for very cheap if you place the winning bid. The <br>        show (which is fantastic, by the way) is up right now <br>        but closes this Saturday. Pro Arts Gallery is located <br>        at: 461 9th St., in Oakland near Broadway (two blocks <br>        from the 12th St BART). Refreshments served. More info <br>        available at: <a href=\"http://www.proartsgallery.org\" target=\"_top\">http://www.proartsgallery.org</a> <br> <br>        The next two exhibitions are show openings at the City <br>        Art Gallery in the Mission district of SF. During the <br>        December show, I'll have a few pieces in the back room. <br>        However, for the January show, I'll have several works <br>        in the front room, so you city folk shouldn't miss it. <br>        And if you just can't wait for either of these shows, <br>        I've actually got a few pieces of art in the back room <br>        for the show currently running at City Art through the <br>        month of November. The City Art Gallery is located at: <br>        828 Valencia St. between 19th and 20th Streets. Refresh- <br>        ments served. More info is available at their website: <br>        <a href=\"http://www.cityartgallery.org\" target=\"_top\">http://www.cityartgallery.org</a> <br> <br>        Fourth on the list is a show at the Berkeley Art Center, <br>        which is just a bit North of downtown Berkeley. This is <br>        a fabulous members show that I'll have a piece in. It'll <br>        be on exhibit from 1/12/03 to 2/15/03. The BAC is located <br>        at: 1275 Walnut St. Refreshments served. Find more info <br>        about BAC online at:  <a href=\"http://www.berkeleyartcenter.org/\" target=\"_top\">http://www.berkeleyartcenter.org/</a> <br> <br>        Finally, I'm in a two-person show at the Los Medanos <br>        College Art Gallery in Pittsburg, CA. I do admit, this <br>        is a bit of a trek for some, but it will be well worth <br>        it for those of you who can make it. I will arrange a <br>        carpool so get in touch with me if you need a ride. <br> <br> <br>        That's it for now. I'll be sure to keep you all updated <br>        on when and where my new work can be seen. Otherwise, I <br>        frequently update my website regarding my exhibitions. <br> <br>        I hope to see you at one (or two) of them soon. <br> <br>        Yours, <br>        Delve Withrington <br>\"</p>"
