    <p>Any cheap alternatives to Gotham? I only need a few bold capital letters, so I am not gonna pay all that for the few letters i need.<br>
    I found a lot, such as Sackers Gothic, but most don't have that 3 with that flat head, so to speak.<br>
    Colin Samuels has though: <a class="freelinking external" href="http://www.myfonts.com/fonts/samuelstype/colin-samuels/" rel="nofollow">as you can see here</a>.</p>
    <p>And free alternatives are even better! It's just a small gig, but i need the Gotham look, not for the trend sake of it, but because it fits<br>
    the image of the company (traditional painter's company) so well in this case.</p>
    <p>Thanks for all your help.</p>
