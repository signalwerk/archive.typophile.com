      <p>Back in the days of the Linotron 202, it was nearly impossible to reverse out type easily. With the advent of PostScript this is much easier to do. Hence the reason for the lack of reversed-out fonts from major foundries—there just isn’t an industry demand for them.</p>
      <p>The only old technology work-around font that I am readily aware of is <a href="http://www.linotype.com/13619/neuehelvetica75boldoutline-font.html">Neue Helvetica 75 Bold Outline</a>. But who needs that is this day and age… just about every DTP app can display an outlined version of the font.</p>
      <p>I’m glad tht you found a work-around in Quark.<br>
      __<br>
      <a href="http://www.typeoff.de">www.typeoff.de</a></p>
