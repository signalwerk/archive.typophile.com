    <p>I am looking for reversed out versions of Helvetica and Garamond to mix with black on type in a document (long story short the client wants an interim document between two editions that indicates the areas that have changed and it must be possible to photcopy on a monotone copier). Failing Helvetica and Garamond any sans and serif could do. I know Linotype used to do a version of Helvetica and Univers Bold Reverse, ideally I would need a family though.<br>
    Thanks in advance with fingers crossed,<br>
    Tim</p>
