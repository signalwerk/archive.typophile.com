    html: |-
      <p>&gt;&gt; Many EULAs do not permit the modification of<br>
      &gt;&gt; fonts, even for private use.</p>
      <p>&gt; Is that even enforceable?</p>
      <p>In some countries, such an EULA clause is valid (most likely the U.S.) while in others (many E.U. countries) such clause is either invalid or only valid under certain limitations defined by the copyright laws. For example, the German and Polish copyright laws allow fonts to be converted of modified “to achieve interoperability with other software programs”. </p>
      <p>Regards,<br>
      Adam</p>
      <p>Ps. For German speakers, here the relevant portion of the German copyright law: </p>
      <p>Urheberrechtsgesetz</p>
      <p>§ 69c. Zustimmungsbedürftige Handlungen. Der Rechtsinhaber hat das ausschließliche Recht, folgende Handlungen vorzunehmen oder zu gestatten: (…) 2. die Übersetzung, die Bearbeitung, das Arrangement und andere Umarbeitungen eines Computerprogramms sowie die Vervielfältigung der erzielten Ergebnisse. Die Rechte derjenigen, die das Programm bearbeiten, bleiben unberührt; (…)</p>
      <p>§ 69d. Ausnahmen von den zustimmungsbedürftigen Handlungen. (1) Soweit keine besonderen vertraglichen Bestimmungen vorliegen, bedürfen die in § 69c Nr. 1 und 2 genannten Handlungen nicht der Zustimmung des Rechtsinhabers, wenn sie für eine bestimmungsgemäße Benutzung des Computerprogramms einschließlich der Fehlerberichtigung durch jeden zur Verwendung eines Vervielfältigungsstücks des Programms Berechtigten notwendig sind. (…)</p>
      <p>§ 69e. Dekompilierung. (1) Die Zustimmung des Rechtsinhabers ist nicht erforderlich, wenn die Vervielfältigung des Codes oder die Übersetzung der Codeform im Sinne des § 69c Nr. 1 und 2 unerläßlich ist, um die erforderlichen Informationen zur Herstellung der Interoperabilität eines unabhängig geschaffenen Computerprogramms mit anderen Programmen zu erhalten, sofern folgende Bedingungen erfüllt sind: 1. Die Handlungen werden von dem Lizenznehmer oder von einer anderen zur Verwendung eines Vervielfältigungsstücks des Programms berechtigten Person oder in deren Namen von einer hierzu ermächtigten Person vorgenommen; 2. die für die Herstellung der Interoperabilität notwendigen Informationen sind für die in Nummer 1 genannten Personen noch nicht ohne weiteres zugänglich gemacht; 3. die Handlungen beschränken sich auf die Teile des ursprünglichen Programms, die zur Herstellung der Interoperabilität notwendig sind. (…) (3) Die Absätze 1 und 2 sind so auszulegen, daß ihre Anwendung weder die normale Auswertung des Werkes beeinträchtigt noch die berechtigten Interessen des Rechtsinhabers unzumutbar verletzt.</p>
    html_clean: |-
