    <p>One thing that scares me with children is, what if You have one and they turn out to have the worst taste in music? My plan is to brain wash them from day one minus 9 months by playing my music over and over again. I'm fairly sure they will appreciate this later on. Not too sure about the mother, though. </p>
    <p>On to this particular case, I assume some of you have kids and You fear they will never spot the difference between Sabon and Sabon Next, Arial and Helvetica, Frutiger and Myriad, etc. Scary awkward dinner conversations ensue as an apparent divide between generations and interests manifest.  Now we don't want that. </p>
    <p>I'm not saying you're doing a bad job, but just to be on the safe side I thought I'll mention a book now available in english that Mark Batty recently published; <a href="http://www.markbattypublisher.com/servlet/book_view?number=47" rel="nofollow">The Serif Fairy</a> by René Siegfried, to hopefully avoid such situations. You can still dream of a Linn Boyd-Morris Fuller kind of relationship with the kid.</p>
    <p>Good luck!</p>
    <p>ƒ</p>
