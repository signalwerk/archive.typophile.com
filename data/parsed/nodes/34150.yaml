      <p>My son likes to have loud music in the car. He also likes me to "race" the other cars (pass them) and he is starting pressure tactics to get me to buy either a convertible or a jeep. He's 4. </p>
      <p>But, I like to listen to CBC so I can get the news (I don't read a daily newspaper or watch tv) and he gets very annoyed with all the talking. Occasionally I switch over to the rock station, CHOM, but often that's a lot of yapping too. More often than not, the little voice comes from the back seat asking me to turn it up at the first musical advertisement. :/ I've tried explaining it's not music, to no avail. But he also gets creeped out by the Floyd my daughter likes. He says it sounds like bad-guy music. :)</p>
      <p>The question of how much influence we have is really interesting. I think often the most powerful influence is the one we don't really notice. The other stuff, like hoping or trying to direct them to certain interests or abilities seem to most often have little effect, except in the residual "my dad wanted me to be a doctor like him and I've been a disappointment to him ever since I decided to go into widget-making." </p>
      <p>I do think parents pass on deeper (bad word choice, I know) characteristics, the kind that become a large part of who they are and how they see themselves. The interests, the skills, career, etc. are, in my opinion, pretty irrelevant.  </p>
      <p>Bad Saturday morning philosophizing. :)</p>
