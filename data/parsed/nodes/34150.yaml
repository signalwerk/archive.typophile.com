      <p>Well, if we’re going to share parent/children stories, here’s one from when I was a kid...<br>
      I used to make a lot of drawings for my family which they usually displayed on their fridge. When my aunt once told me I couldn’t make too many drawings for her anymore since she was running out of “fridge space”, I told her: “Just do what my mom does &amp; throw some away”. Apparantly the overdose of drawings I gave my mom somehow desensitized her for any emotional value of my artwork. To get back at her, I never got that “I love mom” tattoo ;-p</p>
