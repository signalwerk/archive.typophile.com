    html: <p>I don't think you can "enforce" your musical taste on your children (even on a subconscious level). I can only look at my family to see your upbringing doesn't have an influence on your personal taste. Best case scenario, you'll only be able to pass on your moral standards to your children and maybe spark an interest by showing them yours. Both my sisters &amp; I all have different tastes in movies, music,... &amp; overall different interests. I can't even seem to find a genetic reason in my entire family that explains my affection for typography, graphic design &amp; sharks. I think the only thing you can do with your kids is to keep your fingers crossed &amp; stimulate them in whatever turn out to be their interests.</p>
