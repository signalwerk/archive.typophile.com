      <p>You can "brainwash" your kids all you want, but once they hit puberty, they will suddenly become less enamored of your musical taste, maybe even hate it, even if they liked it when they were younger. It's nothing to do with the music per se, it's that your kids will associate it with "being a kid" and everything that means. Later on, as adults, they will rediscover your music and find it to be unaccountably beautiful. </p>
