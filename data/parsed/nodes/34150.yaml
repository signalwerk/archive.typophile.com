      <p>It's a little bit of a late reply, but I was out most of the day yesterday.<br>
      Hrant, maybe you'll find a better appreciation for lyrics if you don't see them as a whole, but break them down to little pieces? Music has always been very imortant to me (unlike for the rest of my family; combined they don't even own half of my collection &amp; they only occasionaly listen to them whereas I àlways have my headset on at home &amp; never leave the house without my trusted MD walkman (the best **** buy I ever did)) &amp; growing up I started paying more &amp; more attention to the lyrics as well. There are still some I find close to poetry &amp; others that sound worse each time you listen to them, but in almost every song, there's at least one thing that touches me. Not necessarely on an emotional level, but on a linguistic level as well. It can be something very plain, but described in a beautiful way (again I'm talking mere linguistics, no emotions attached). I write texts myself (mostly in English) which are probably best comparable with lyrics (without the music to accompany it). I've still kept the ones I wrote as a teenager &amp; even though those are really predictable &amp; overall crappy, there's always this one perfectly formulated sentence in each of them of which I am still proud to this day. Later on, I've started "experimenting" more with ambiguous texts &amp; starting doing a lot of "wordplay". I have seen my texts evolving immensely in a few years time &amp; I see the same evolution in the lyrics of some of my favourite bands. Right now, I'm completely consumed by the music of "the Smashing Pumkins" again (partially due to the upcoming new album) &amp; the lyrics are mostly quite predictable, but there's an obvious evolution in them. The funny thing with them is that for a long time I misheard one part of the lyrics from "Tonight, tonight" &amp; I was actually a bit disappointed when I read what they really said ;-)<br>
      I have many CD's from groups that might have benifited from limiting themselves to being instrumental, but if you'll look closely enough, you'll usually find something to appreciate. I have a little notebook in which I write everything that comes to mind that I can -at one point- use in one of my texts &amp; I've also started writing stuff down from existing lyrics hoping to try &amp; make a "compilation text" with them someday. A lot of them kind of lose their impact in the existing lyrics &amp; some of them might even sound bad or pointless on their own, but they can gain beauty from using them with other lyrics. It's just a matter of finding the beauty in the beast. Putting a puzzle together with pieces from different puzzles &amp; trying to make a nice (albeit abstract) picture nevertheless.<br>
      As for learning to appreciate your parents' musical taste, I think I've developped a love for it that exceeds my moms... Like SD's dad, my mom has gone from the Stones to Boccelli-like stuff. She even comlains to me when I put the Stones on now (luckily she still likes Janis Joplin &amp; Bob Dylan) ;-) It just goes to show that people have no definite taste &amp; are always changing. I wouldn't call this evolving at this point 'cause it still seems to me that her taste is going downhill, but maybe I'll learn to appreciate it in time as well... Either way, I think people's personal tastes (not only in music) are always influenced by circumstances (mostly interests &amp; the crowd you hang with), but as far a "indoctrination" goes, I don't think ànything can survive puberty, it's just plain murder in the first degree ;-)</p>
