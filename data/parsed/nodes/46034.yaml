      <p>There’s a 64K limit on the size of a subtable offset (I think I have that right). This can be worked around with the “extension” function and appropriate subtable breaks, although not all possible clients will recognize that. Usually this comes up with kerning for really big fonts (e.g. Arno Pro).</p>
      <p>There are a couple of size limits related to glyphs rather than features, as well:</p>
      <p>1) Mac OS used to have a limit on the total length of glyph name strings, as well. That has been fixed at some point.</p>
      <p>2) There’s the limit of 64K glyphs in the font.</p>
      <p>Regards,</p>
      <p>T</p>
