    <p>I was thinking about the practical issues involved in using Calt/Liga for text faces today, and I started wondering about how much larger a file might be if it has has 10, 50, 100, 1000 or 10,000 feature entries. And what the real practical limitations might be in terms of the file size, for the Operating System (OSX, Windows Vista, XP etc.) , and applications, any one of which might potentially choke on an overly big file. Maybe file size per se isn’t the only technical issue. I am BTW deliberately leaving out any mention of managing large #s of features which is essentially a different issue.</p>
    <p>It’s a broad question, and I know the answers are probably very specific and potentially very case dependent.</p>
    <p>Still, what is your take on this? Have you run into problems regarding this kind of thing as an OS, application, or font developer you would like to share?</p>
