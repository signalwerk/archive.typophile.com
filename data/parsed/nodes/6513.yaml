  html: <p>This is the very beginnings of this font - still need to create the Uppercase but sorting out the lower case first. The letters that have been bugging me are "a" "c" "e" "s" and I need to create more ligature style ones. I didn't mean it to end up looking this "jumpy" but I'm going with it now. I also want to create 3 more weights but this is just to get the "skeleton" of the font right. <br> <br>This is a screen grab from Illustrator if it looks a bit ropey (although that may just be the typeface!) <br> <br>Feedback, thoughts, hints, advice etc. are all more then welcome and would be appreciated!<img src="http://www.typophile.com/forums/messages/29/48117.jpg" alt=""></p>
