    html: <p>Aperture means opening -- all I meant was that it seems your 'c' is basically the same as your 'o' with a little section erased. In other words you might want to tinker with what part of the the 'o' you erase for the opening. IMHO I might make the opening a little larger. <br> <br>Or, alternatively, you could use the "mirror image" of the 'o' as your starting point for the 'c', as it seems you did on the 'p' and 'b'. It's hard for me to picture whether that would look good or bad though.</p>
