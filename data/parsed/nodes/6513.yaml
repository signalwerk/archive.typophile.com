    html: "<p>I like this (especially as white on black). <br> <br>Some suggestions: I think the tail of the 'q' looks out of place next to all those tight little curves on the other letters -- perhaps if the curve had a smaller radius like the 'l'? <br> <br>I like the funky round shape you have going on in the o, p, q, b, etc. So re your question about a, c, e, s, I think the c is fine overall (maybe some tinkering with the aperture) and the shape of the e is fine, with the exception of the middle horizontal piece. (Sorry I don't know my type anatomy better.) I think if it was more horizontal, or even inclined the other way, it would be an improvement.</p>"
