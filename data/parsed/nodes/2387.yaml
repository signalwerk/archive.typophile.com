    html: <p>I don't think they should have aligned the D and the n -- it causes problems with the visual hierarchy. The eye follows the n down instead of reading the rest of the word. They should have focused on even spacing on the line in which "Daily Care" falls. It look heavy and poorly balanced. Too many people focus on the seemingly obvious alignments when there are far more important alignments to be watched. Kyle, I'm not picking on you, I'm just remembering some past things of which you reminded me. <br> <br>Just my two cents. It is a little late to critique, but you guys seems to have so much fun critiquing work that is finished. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
