    html: <p>Tanya, I agree largely with what you say. Especially about the the smashing powerpoint. I have also just seen a job posting for a graphic designer for my city government cleverly disguised a clerical opening for a rate significantly smaller than what they pay me and requiring more technical knowledge in print and online work than I have with 7 years of experience. <br> <br>I DO undertand what you are witnessing. I just don't think that the inside/outside dichotomy is really the thing. <br> <br><i>Or perhaps there's some new school of thought that justifies gradients that no one knows about? </i> <br> <br>&lt;speculation&gt; Maybe a confluence of production technology with inadequate designers? I wonder if better techniques in printing, painting whatever, make things like gradients more doable and more tempting?&lt;/speculation&gt; <br> <br><i>I'm not trying to be elitist believe me, just pragmatic.</i> <br> <br>I wonder if it's not more pragmatic to think that <b>any operation</b>(inside or outside) will hire cheaper if they know they can sell the work. <br> <br>I don't think you're being elitist. I just think that the inside/outside dichotomy is false. <br> <br><i>hard to explain to our next clients why its bad and why these large co.'s are doing it wrong.</i> <br> <br>I know this is hard for those who really care about visual communication. But at least you know you're right and why so you can say it. <br> <br>Jon</p>
