    html: <p>Man, what is UP with Landor... do they have a copyright on gradients or what?  <br> <br> <br>And Daniel is right... even as a freelancer your work is messed up by stubborn customers and awful design-by-committee processes. At least as a free designer you can walk away from such jobs, if your financial status allows for it.  <br> <br>At least they visually stressed the BAKING SODA CLEAN, which is one of the most absurd poieces of advertisement. It was less conspicious before, but now this new package basically communicates the idea of smearing a paste of sodium bicarbonate on your teeth... which makes me imagine a pulvery, smeary, badtasting dry, awful substance... not what I'd like a customer to associate with my product at ALL... ugh :-).</p>
