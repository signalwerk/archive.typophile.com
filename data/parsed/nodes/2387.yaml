    html: "<p><i>someone should steal the computers away from the in-housers.</i> <br> <br>Tanya: perhaps <b>skill</b> has something to do with it. I doubt that you're impressed by all the stuff that <a href=\"http://www.landor.com/\">these guys</a> do (who aren't in-housers). <br> <br>While I appreciate the sentiment that some people have no respect or sensibility, I don't think that the test is whether you work inside the place or outside of it. Some of us struggle daily  trying to make the best of a bad thing left behind by people who weren't in house. And I am positive the opposite is the case as well. <br> <br>I am not impressed by this revision, in-house or not. Although I have no idea who did it, or what the design brief was (assuming there was one), I don't like the result. The puffy letters look like a certain <a href=\"http://www.cheerios.com/about/honeynut.asp\">cereal</a>, and kind of have a non-identifiable and indistinct harmless feel. At least the type in the original felt somehow reassuringly technical or clinically effective (It appears to be Avant Garde...anyone?). <br> <br>I question whether making something kind of mundane and me-too is what you really want do do when competing in the personal care market. <br> <br>Jon</p>"
