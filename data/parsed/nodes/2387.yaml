  - id: 19334
    user: 1019
    date: 2004-01-13T09:22:00
    date_raw: 13 Jan 2004 — 9:22am
    votes: null
    html: <p>&lt;font class="dontLookLikeCrap"&gt;Jon, my remark was a big generalization, but from my point of view its often true.  <br> <br>The new breed designer that gets hired in-house for minimum wage is given a computer for "tools" and a copy of photoshop for dummies. Often enough they get reshuffled from the communications dept once some manager discovers that John Doe created that smashing powerpoint with rotating globes. I've met plenty of them who now carry the title "graphic designer" on their biz card. <br> <br>However there are a few in-house designers, such as yourself I'm sure that do have the education to back the position.  <br> <br>One has to admit that their numbers are dwindling in favor of those candidates who meet job requirements which include 30 different software programs for 20K a year. <br> <br>The corporation is lucky that you can fix things nicely but sadly uneducated about your job and design in general if they are hiring these outside agencies responsible for gradient crap. <br> <br>In all, Its just hard to beleive that any respectable design firm would allow gradient tricks and plug-ins out the door to any client, committee or not. And who does that leave? students, beginners, and the cost-saving in-housers. I'm not trying to be elitist believe me, just pragmatic. <br> <br>On the other hand, I'm starting to think that these larger design firms are hiring the same dime a dozen. Or perhaps there's some new school of thought that justifies gradients that no one knows about? <br> <br>See its just very scary to see! If more and more large co.'s are getting 3-D'ed then its gonna be very hard to explain to our next clients why its bad and why these large co.'s are doing it wrong. <br>-t <br>&lt;/font&gt;</p>
