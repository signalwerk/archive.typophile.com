ans forever. <br> <br>With the spread of digital technologies at the beginning of the twenty-first century, we are experiencing a revolution in printing matched only by two previous events: Gutenberg's fifteenth-century invention of movable type and the advent of typesetting machines that replaced the Swifts. Joining narrative historians of technology such as Robert Darnton, Henry Petroski, Dava Sobel, and Ross King, Rumble tells a fascinating story that will entertain aficionados of print culture while explaining the larger cultural dislocations wrought by technological change. <br> <br>- - - - - <br> <br>This has got to be the first time I've seen the words \"working class hero\" used when talking about typography...</p>"
