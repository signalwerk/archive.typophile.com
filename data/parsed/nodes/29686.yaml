  html: |-
    <p>Hello everyone, </p>
    <p>i am currently working on a logo for a cell phone/web-based dating application. After some client feedback, I am now looking for some alternatives to the current font (Linear by E + F). The logomark has been approved, but the current type choice is lacking the ’speed’ element which should be reflected in the type. I’ve tried various light italic sans serifs (with Neutraface being the best match i’ve got so far), but i think that i need something with a lower x-height and shorter extender length (like Linear).</p>
    <p>I am grateful for any suggestions,</p>
    <p>Seb</p>
    <p></p><div class="imageWrap"><img src="/files/speedflirt_4623.png"></div><p></p>
