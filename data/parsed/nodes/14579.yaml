  html: |-
    <p>Debut Publications Ltd are pleased to announce a ‘Call for Entries’ for<br>
    our forthcoming <a href="wiki/freeware" class="wiki-create">freeware</a> and <a href="wiki/shareware" class="wiki-create">shareware</a> font directory. </p>
    <p>The directory will be an accessible resource for designers and industry<br>
    creatives, showcasing the very best of contemporary downloadable fonts. By<br>
    taking an innovative approach to the layout and ‘feel’ of the publication,<br>
    fonts will be displayed in an easy view index including designer’s<br>
    credits, information on variations within the family, platforms available<br>
    and a direct URL enabling the user to download the font and access futher<br>
    fonts from the same source. Any freeware or shareware font is eligible for<br>
    inclusion. We will endeavour to publish as many submissions as possible to<br>
    ensure the directory is as extensive and as diverse as possible. </p>
    <p>For a full brief, Terms &amp; Conditions and to download an entry form, please<br>
    visit: <a href="http://www.debutpublications.co.uk/forms/fsforms.pdf ">www.debutpublications.co.uk/forms/fsforms.pdf</a></p>
    <p>The deadline for all submissions is 31st October 2005. </p>
    <p>For more information please email: <a href="mailto:info@debutpublications.co.uk">info@debutpublications.co.uk</a> or write<br>
    to Debut Publications Ltd, Creative Industries Centre, Wolverhampton<br>
    Science Park, Wolverhampton. WV10 9TG. </p>
    <p>- Debut Team. </p>
    <p>Debut Publications Ltd are supported by SP/ARK and PLOT<br>
    For more information please visit:<br>
    <a href="http://www.wolverhamptonsp.co.uk/spark">http://www.wolverhamptonsp.co.uk/spark</a><br>
    <a href="http://www.plotonline.co.uk&quot;">http://www.plotonline.co.uk</a></p>
