      <p>Hi MSA,</p>
      <p>I am using FL5 with a Mac with OSX and I had the same "vanished classes" problem.<br>
      I think it happened to me specially whe I selected the pull menu to see only kerning or metric classes. When I tried to switch back again to the other classes, they were gone.</p>
      <p>Now I keep all the classes visible and of course I save them everytime I do something new.</p>
