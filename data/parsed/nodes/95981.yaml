      <p>There is an open source (OFL 1.1) version released through the OSP-foundry:</p>
      <p><a href="http://ospublish.constantvzw.org/foundry/osp-din/" title="http://ospublish.constantvzw.org/foundry/osp-din/">http://ospublish.constantvzw.org/foundry/osp-din/</a></p>
      <p>Under this license everything you want to do would be fine. However, you should read through the license carefully first, as if you end up distributing the fonts through digital embedding or bundling you will need to include the license in some form to accompany the fonts.</p>
