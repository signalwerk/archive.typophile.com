    html: |-
      <p>Karl—</p>
      <p>I have a note in with the folks at Fontspring. I would like for them to assume control of webfont and embedding rights to my entire collection, based on a somewhat different pricing model, especially where embedding is concerned.</p>
      <p>To my mind, it only makes sense to have embedding licensing fees tied to actual usage, as a fixed percentage of the retail price of the end product, no matter what it might be: eBook, video game, or any other kind of virtual product for sale. My initial thought is 2.5% of the retail purchase price, payable to the font author at time of purchase. In fact, an eBook publishing service—tying together font choice, document prep, publishing to various formats, and promotion considerations, all totaling no more than the standard literary agent fee of 10%—might be another adjunct to the iLUVfonts package, currently under development…</p>
      <p>Jeez: I just love my new Mr Coffee Keurig-style brewer; however, I am somewhat reluctant to have a third cup this morning…</p>
