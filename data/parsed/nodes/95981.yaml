    html: <p>As much as I have discussed this with copyright holders the perspective on why to charge and how much is tied to so many different reasons and usually dependant on foundry or developer specific ideas about the technology utilising their fonts. With ebooks there are a lot of technical issues associated with the security of embedding and this is a key issue for a lot of people.</p>
