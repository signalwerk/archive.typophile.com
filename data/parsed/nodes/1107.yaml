    html: "<p>And then they say capitals are useless... <br> <br>BTW, the other day (while in profound admiration of the use of Trajan* in the Victoria's Secret catalog...) I thought of a good example of the importance of UC: <br> <br>The answer to the question \"What is Victoria's [S/s]ecret?\" could either be \"a lingerie store\" ** or \"she's a guy\" ***. <br> <br>* Hey, it has a lowercase! What font is that? Latina? <br> <br>** <a href=\"http://www.victoriassecret.com/\" target=\"_top\">http://www.victoriassecret.com/</a> <br> <br>*** <a href=\"http://www.tutstore.com/Archive1996/VictorVictoria/\" target=\"_top\">http://www.tutstore.com/Archive1996/VictorVictoria/</a> <br> <br>**** Gotcha! <br> <br>hhp</p>"
