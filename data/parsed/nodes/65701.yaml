    html: |-
      <p>Between Charing Cross road between Cambridge Circus and Leicester Square tube are plenty of old book stores. Also on this stretch is Koenig Books which sells some nice new books. There are some more bookshops (and general collectibles, cards, prints, maps etc) between Charing Cross Road and St Martin's Lane.</p>
      <p>I seem to recall there are some second hand book stores across the way from the British <em>Museum</em> too, which I imagine you might visit.</p>
      <p>Also you should visit <a href="http://www.stbridefoundation.org/" title="http://www.stbridefoundation.org/">http://www.stbridefoundation.org/</a> but check it is open before you go. I think you can view some things there by appointment. Not sure anything is for sale!</p>
      <p>Best, enjoy London.</p>
