    html: <p>I also looked through Typophile for relevant stores before heading to London. Aside from Collinge &amp; Clark, the other place for secondhand type books I'm aware of is the <a href="http://quintobookshop.co.uk" rel="nofollow">Quinto Bookshop</a>. It's on Charing Cross Road, which I would recommend walking along. There are a ton of used bookshops there; at one I found Johnston's <em>Writing, Illuminating &amp; Lettering</em> for cheap. Check out Cecil Court, too; there were a bunch of interesting antique stores there, and I bought a seventeenth-century map there with terrific lettering for a reasonable price.</p>
    html_clean: <p>I also looked through Typophile for relevant stores before heading to London. Aside from Collinge &amp; Clark, the other place for secondhand type books I'm aware of is the <a href="http://quintobookshop.co.uk" rel="nofollow" class="link-external">Quinto Bookshop</a>. It's on Charing Cross Road, which I would recommend walking along. There are a ton of used bookshops there; at one I found Johnston's <em>Writing, Illuminating &amp; Lettering</em> for cheap. Check out Cecil Court, too; there were a bunch of interesting antique stores there, and I bought a seventeenth-century map there with terrific lettering for a reasonable price.</p>
