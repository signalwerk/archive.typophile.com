    <p>Hi</p>
    <p>With my end-of-the-year London trip ahead, I am looking for some good bookstores to visit. The subject: anything old/second hand on typography? All tips more than welcome!</p>
    <p>I have already found this one via the Typophile site: Collinge &amp; Clark, 13 Leigh Street.</p>
    <p>Thnx!<br>
    S</p>
