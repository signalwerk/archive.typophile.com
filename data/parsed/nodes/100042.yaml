      <p>Observation: it seems to me the more successful web fonts for body copy are all a bit slabby -- with a vertical slab on glyphs like the f, r, c, and so on. Tisa is an example of this, and so it skolar.</p>
      <p>Do you think these slabs are, um, "performance oriented"? Which it to say, the vertical slab on the f, for example, would take to hinting better than if the f ended in a thin stroke.</p>
      <p>?</p>
