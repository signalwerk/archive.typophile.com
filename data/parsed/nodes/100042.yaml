      <p>Well, for "stingy" there's always Google Web Fonts. Open Sans's x-height (<a href="http://www.google.com/webfonts/specimen/Open+Sans" title="http://www.google.com/webfonts/specimen/Open+Sans">http://www.google.com/webfonts/specimen/Open+Sans</a>) makes it very good at small sizes. I like Lato, though. (<a href="http://www.google.com/webfonts/specimen/Lato" title="http://www.google.com/webfonts/specimen/Lato">http://www.google.com/webfonts/specimen/Lato</a>)</p>
      <p>But I already know what I'VE seen. What I really wanna know is, what have YOU seen? What do you think are currently some of the best neutral, readable, up-to-date, professional sans faces, for body text, for websites targeted to web browsers on computer screens?</p>
      <p>I know there's always an "it depends" in there, but, what do you like these days?</p>
