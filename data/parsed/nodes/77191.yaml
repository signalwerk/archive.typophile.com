    <p>Type@Cooper has just announced the new summer intensive program 2011.<br>
    Sumner Stone, Sara Soskolne and Andy Clymer will teach an integrated and rigorous 5 week program from June 20–July 21, 2011 at Cooper Union in Manhattan. Applications will be accepted in February. 15 students will be accepted. For more information visit <a href="http://coopertype.org/" title="http://coopertype.org/">http://coopertype.org/</a></p>
