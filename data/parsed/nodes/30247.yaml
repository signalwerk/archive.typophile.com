      <p>With only one duplicated letter ('o') I find it hard to conclude that this is not a font, although it certainly may not be. I looked in Parts 12 (Childish printing) and 14 (Strange/Distressed scripts) of the Script Font ID Guide and came up with no matches, but a few fairly close alternatives, if you are open to that idea:</p>
      <p><a href="http://www.fonts.com/findfonts/detail.htm?pid=420862" rel="nofollow">Vreehend</a> from GarageFonts;</p>
      <p>Linotype <a href="http://www.myfonts.com/fonts/linotype/russisch-brot/" rel="nofollow">Russisch Brot</a>;</p>
      <p>and Ethan Dunham's <a href="http://www.myfonts.com/fonts/fonthead/good-dog/" rel="nofollow">Good Dog</a></p>
      <p>- Mike Yanega</p>
