  html: |-
    <p>I was loooking at some unicase typefaces (they fascinate me), and came across FF Disturbance:</p>
    <p><a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_disturbance_ot/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_disturbance_ot/">http://www.fontshop.com/fonts/downloads/fontfont/ff_disturbance_ot/</a> </p>
    <p>I find the letter "G" in it really interesting, and I've never seen anythig nlike it before. The G in Bayer Universal is similar, but this seems to me like a wholly new idea.</p>
    <p>Does anyone have any information on where this hybrid upper/lower case "G" originated? (I consider the Bayer Universal G to also be a sort of hybrid upper/lowercase, but I haven't seen one with a loop like that before)</p>
    <p>Edit: For those interested, upon some investigation, I found that the creator of Disturbance later created a super fleshed-out family based on the original Disturbance, called "Redisturbed":</p>
    <p><a href="http://typography.net/fontfamilies/view/23" title="http://typography.net/fontfamilies/view/23">http://typography.net/fontfamilies/view/23</a></p>
