    html: |-
      <p>I would second Simon’s suggestion: Look for the font you want to use and then contact to foundry/reseller. </p>
      <p>Even if "pageview tracking" is so 2001, "honesty in online-services" is probably too. If the page views are not tracked, a lot of users might just go for the lowest available page view option, even if they know upfront their sites will top the page view amount they have paid for. Why should they pay more? The foundry can't check it, can they? But if you contact the foundry and explain why you don't want to or can't use such a script, they might agree that you don't have to. Even webfont service providers might allow you to host the files yourselves, if you really need to avoid requests to external servers. </p>
      <p>BTW: Every parking meter tracks the actual use and no one complains that the city will not just believe you, that you payed enough. A little bit control helps to keep the service fair. That’s good for provider of the service, as well the honest customers. Embedding a tracking request in a site is not really an inacceptable burden, is it?</p>
