    html: |-
      <p>myfonts offers licences with or without tracking:</p>
      <blockquote><p>
      There are two ways pageviews are sold at MyFonts. It is up to the listing foundry to choose how a font will be licensed.</p>
      <p>Pay Once is based on expected monthly pageviews. It is a one-time purchase with no time limit; just make sure your monthly visits don’t exceed your license’s number of pageviews.</p>
      <p>Pay As Your Go is based on total pageviews. Picture it as a bucket of pageviews that you can use over time. We’ll let you know when you’re running low. When you do run out, just come back for more.
      </p></blockquote>
