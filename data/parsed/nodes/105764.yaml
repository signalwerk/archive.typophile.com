    html: |-
      <p><cite>myfonts offers licences with or without tracking:</cite></p>
      <p>Not anymore. It was this way, when the MyFonts Webfonts were first introduced, but if you buy a Pay Once license now, the webfont kit includes a tracking link (a CSS @import call) and the license says:<br>
      “You must retain the page view tracking code, as supplied in the Web Font Kit, on all Websites that Use the Licensed Web Fonts.”</p>
