  html: <p>I'm trying to find a web font license without pageviews tracking. So far with my search, Fontspring.com seems to be the only license available that does not require any tracking scripts to be installed with their web fonts.  Does anyone know of any other foundries that do not have the required page tracking scripts in their licenses?</p>
