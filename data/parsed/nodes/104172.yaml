      <p>Since it's a logo I expect there were changes from the original font. This is in the Bauhaus style and you could check <a href="//www.identifont.com/list?3+Blippo+0+23X+1+CFR+1+3V0+1+5Z4+1+1MU+1+3GX+2+8YS+2+M2Q+2+A5L+2+LZQ+2+2DPC+4+259D+4+OFX+4+OVA+4+P1T+4+NHR+4+ILY+4+77J+4+6IO+4+N7+4+6CV+4+F3R+4+51D+4+KJ3+4+MWH+4+68L+4+77Q+5+3CE+5+3UJ+5+3UL+5" rel="nofollow">Blippo &amp; similar</a> for something to modify.<br>
      There may be something closer, but it would perhaps be more effort to track it down than to start from Blippo or similar.<br>
      Don</p>
