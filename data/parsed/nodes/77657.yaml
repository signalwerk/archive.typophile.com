      <p>Let me preface this by saying that I am not a lawyer:</p>
      <p>I would think that if you made a completely new f and quotation marks for a font you purchased, then re-exported it for your own use, you shouldn't have problems. Realistically by doing this, the only thing the type designer could reasonably accuse you of copying would be the kerning pairs for those specific characters because once you replace their f “”, fontlab is still going to apply all the kerning pairs that the designer had originally built into the file onto your new replacement glyphs. That would be the primary difference I would see between simply doing those replacements in illustrator/indesign, and making the edits more directly in fontlab (solely for your own use of course).</p>
      <p>Honestly, I've done this to font files in the past and hadn't even thought of it as being potentially problematic (probably the first thing I did once I started working in fontlab was to export a version of futura bold that didn't have a hideous c). I also wouldn't really see the difference between what you are suggesting, and modifying specific letters of a typeface as outlines to create specific effects/unique elements in an identity mark (something which is fairly common practice).</p>
      <p>If you really want to get fancy and make sure you avoid any possible legal issue, you could always make your f and “” in a new file in fontlab, export a font, and do a simple find/replace on all f's and “” in your layout. If you did that, I honestly don't see how anyone could accuse you of doing anything illegal. Of course then you'd have to go through and do all the metrics for those glyphs...</p>
      <p>The concept of derivative work as I see it (and as I would be concerned with it as a type designer) would apply more to the idea of directly modifying the curves of an existing font file in fontlab, then re-exporting/re-selling the file as your own (not modifying a font file by replacing specific characters for your individual use). The world is full of "derivative" type design, so as long as you are actually making the new glyphs and not selling the work, you shouldn't have issues. There is precedent for this:</p>
      <p>Arial is most certainly "derivative" of Helvetica (I would call it a rip-off), and it is undoubtedly legal. With Arial, we're looking at a typeface which takes the character width, metrics, and basic structures of another font, and blatantly copies them. If that's acceptable practice, I would think redoing your f would certainly be ok. Realistically, the instance of Arial is far worse than what you are proposing, because in that case, the "derivative" work is now being licensed and sold, putting it in direct competition with the original.</p>
      <p>Now, if you were talking about modifying the f and “” in the file by dragging points around and moving curves, I would see you as falling a bit further into a nebulous grey area in which you would be opening yourself up for potential problems, since the starting point for your glyphs would directly be another person's work. Still though, designers do things like this all the time.</p>
      <p>Honestly though (since you admitted to not being a typographer), I would advise you to contact the designer/foundry, and see if you can get them to make a version of the typeface for you that suits your needs more completely. There is a lot of subtlety that goes into making type that you shouldn't expect to be able to get right the first time. The amount of time and specific knowledge that gets put into these things is considerable, and is not something I would expect you to be able to learn in a short amount of time to properly do this modification. Since you're here on a type design forum talking about this stuff and are even scrutinizing single glyphs within a typeface, I would say it's a safe assumption that you want this done right. If that's true (which I believe it is), get a type designer to do it. Type design is a craft based on a very refined and specific skill-set, like any other, and I would urge you to have these modifications done by someone who has the requisite knowledge to do them properly.</p>
      <p>Besides, as far as custom typefaces go, If all you need is something like modifying 3 glyphs, that shouldn't be really all that difficult to get them to do (assuming you're willing to pay them to do so).</p>
