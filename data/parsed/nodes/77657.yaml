      <p><cite>I downloaded FontLab Studio, opened up the font made the changes and saved it. Seemed to work. </cite></p>
      <p>A digital font (especially today's OpenType fonts) are a rather complex piece of software. You cannot just open it, make some changes and save it again like you would do with a Word file. That's why FontLab Studio has no function to "save" the font file, but a "generate font file" function. A lot of things will happen when you generate a new file, based on many many checkboxes you need to set carefully in the FontLab preferences. That's the job of professional type designers. </p>
      <p><cite>(I need to know what to do) </cite><br>
      If you need a different version of a font you should simply contact the font foundry. They can create an individual version of the font for you and make sure that everything is technically correct. In the end this will probably be even cheaper than investing your time with something you don't know how to do and maybe ending up with a faulty font that causes problems in the print production.</p>
