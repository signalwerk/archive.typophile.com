    date: 2003-06-20T14:06:00
    votes: null
    html: <p>FontLab also has a product called ScanFont which acts as a plug-in for either TypeTool or FontLab. It will take a scan of the complete character set and somewhat automate the process. Also available as a demo with downloadable manual. Another $100. And then there is TransType, a font format converter. Demo, manual, another $100. FontLab, yeah, they got it figured out.</p>
