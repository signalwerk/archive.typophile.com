    html: <p>Fontographer is most likely powerful enough to do what you need, but it's a dead end. So I'd second Gerald's suggestion. Also, in the case of your mom, she might be better off drawning the letters on paper (or maybe even in something like Illustrator), but leaving the gory stuff like spacing, encoding, etc. to somebody else - maybe you! <br> <br>hhp <br></p>
