  html: <p>Back in about 1996 I developed an interest in fonts and started making some.  I used Fontographer, the only program I knew of at the time.  I had a lot of fun, but I haven't done anything since then. <br> <br>Now I'd like to get back into things.  Not only that, but my mother is interested and wants to learn as well.  We have slightly different goals, but I'm hoping to gather some advice from all you experts about what software would be the best buy to meet our needs. <br> <br>I have a background in graphics design, and I just LOVE fonts, for reasons I don't think I need to explain to this audience!  I work with Photoshop a lot, but not with very many other graphics programs (though I am quick to learn).  I'd love to be able to create my own fonts to meet specific needs, and also just because it's art and it's fun. <br> <br>My mother is a schoolteacher, and her interest in fonts is primarily for her classroom.  She'd like, among other things, to be able to make a font of her own printing, plus various cute, theme-based letterings (animals, flowers, etc.) that can be personalized more than the downloadable freebies out there (we're talking pictures with letters pasted on top probably - nothing very fancy).  She is not very experienced with any design software though, so if this stuff is too complicated, it won't work for her (she does have 2 capable people to help her out though, but even then there are limits).  Also, since it's just for her own personal use and satisfaction, the "good enough" motto applies. <br> <br>We both use Windows (2000, probably XP sometime soon).  From what I have read, Fontographer seems easiest to use, but Fontlab sounds more flexible.  Can anybody comment?  Also, there seem to be a myriad of smaller, cheaper programs, but I can't tell for certain whether they will be a good enough starting place for us, or if we are better off with one of the big ones. <br> <br>Sorry for such a lengthy post, but when we are considering forking out $550 US (which is more like $800 Canadian, for us) it's a big enough investment that I want to make sure we make the right choice.  <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Looking forward to some interesting comments and advice!  Thanks everyone, <br> <br>Julie <br></p>
