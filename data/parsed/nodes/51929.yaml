      <p>Yeah, why does it have to be free?</p>
      <p>What about Mark Simonson's <a href="http://www.ms-studio.com/FontSales/grad.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Grad</a>, which is an updated version of Phil Martin's revision of Century Schoolbook?</p>
      <p>You can get Grad Regular, Italic, and Bold for $29 each or all three for $59 at</p>
      <p><a href="http://www.myfonts.com/fonts/marksimonson/grad/">http://www.myfonts.com/fonts/marksimonson/grad/</a></p>
      <p>Rahim</p>
