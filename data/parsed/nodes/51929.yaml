      <p>Why does it have to be free?<br>
      Why does it have to (Century, I assume?) Schoolbook?</p>
      <p>FYI: Three weights of Century Old Style are bundled with Adobe CS2.<br>
      Latin Modern Roman from <a href="http://www.ctan.org/tex-archive/fonts/lm/" rel="nofollow">CTAN</a><br>
        is not the most beautiful font in the world. But it is free and is in the same stylistic genre as Century.</p>
      <p>F</p>
