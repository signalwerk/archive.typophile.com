    html: |-
      <p>It's technically possible to write a program to scan all of your own fonts and somehow determine a "best fit". There is no guarantee <em>anyone</em> ever copied Clarendon's metrics, so it's possible the best fit, when only regarding metrics, is (uh), let's say "Comic Sans". To name a perfectly random font of which I'm pretty sure you <em>won't</em> say "oh that would be close enough".</p>
      <p>How would this best fit algorithm need to work? Mathematically closest for the average character width, or the entire font (so some chracters would be wide off and other would come close), or for a select set of characters?</p>
      <p>In any case, since font metrics per character are not publicly available, such a piece of software would only work on the fonts that you already have.</p>
      <p>If exact looks are more important to exact metrics, you could try Fivos Vilanakis' "Find my Font": <a href="http://typophile.com/node/84965" rel="nofollow">Win / Mac: New tool "Find my Font" to identify fonts in images</a>.</p>
