      <p>Unicom here in Calgary does cast type for sure, and I believe they also do plates -- I can call my friend there and ask on Monday, if you like (email me if you want her number directly), and I'm pretty sure Sundog does as well.</p>
      <p>Doesn't matter where you get it printed, so long as you (and presumeably the client) do a press check -- do they want to go to Montreal or do you want to come here?  We've got less snow....  ;-)</p>
