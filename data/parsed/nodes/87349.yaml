    <p>So ya, over the last little while one of my pet product projects is doing a series of candle guards. This one here is the prototype of my XOX candle guard. </p>
    <p>Black letter would be extremely awesome (especially in the shadows), but for now I'm just trying out this letter shape loosely based on a cut of Kabel.</p>
    <p>Thought I'd share...</p>
