    <p>I’m playing with the idea of using graphic design/type design for something meaningful, beside creating beautiful things, and wonder if any of you have some experiences to share.  </p>
    <p>Obviously, funding is a big aspect. I don’t intend to work for free — significant discounts make a lot more sense to me. I also plan to look into fundraising/donations for good causes. </p>
    <p>What is a good project, and how do you pick them? Is it better to approach potential clients than advertising your services? Are there any type related needs? </p>
    <p>On of my biggest dreams is to be able to assist in the developement of a new writing system, but how often does that happen nowadays? ;)</p>
    <p>This is a fresh idea for me. Please, share your thoughts!</p>
