      <p>It's extremely difficult to run an "ethical" business, because that's not the purpose of business.<br>
      It's the purpose of business to make a profit, and of government to regulate that process so that it's not too damaging.<br>
      Jane Jacobs discussed the mutual exclusivity of this relationship in <a href="http://en.wikipedia.org/wiki/Systems_of_Survival" rel="nofollow">Systems of Survival</a>.</p>
      <p>Self-regulation is corrupted by vested interests.</p>
      <p>People ("consumers") part with their money for price, quality, or service; virtue (e.g. fair-trade organic) is a harder sell.<br>
      Given the difficulty, you need exceptional business skills to make a "good" business work, and you will always be putting yourself at a competitive disadvantage to those who play by the existing rules, or cut corners.</p>
      <p>Therefore it is better for idealists to make a healthy income within the system, and use that wealth (and/or their professional skills) as 100% gift to idealistic organizations run completely by volunteers.</p>
      <p>I would be wary of supporting "establishment" do-good organizations with salaried staff, because these organizations generally rely for their funding on sponsorship (from various corporate sources and government bodies), as well as having an infrastructure to maintain, both of which compromise their integrity. Having to meet a "quota" of sales or income is, as Jacobs argues, fundamentally non-ethical. IMO, grassroots shit-disturbers make the most difference. </p>
      <p>"They sentenced me to twenty years of boredom<br>
      For trying to change the system from within"<br>
      --Leonard Cohen</p>
