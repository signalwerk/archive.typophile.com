      <p>Nick, "corporate" needn't be pejorative.  It can mean well-organized, paying for experience, being willing to hire professional services as needed (IT staff, accounting, even designers), etc.</p>
      <p>If we think that, say, human rights groups fighting discrimination should be exclusively done for free, there will be a big imbalance in our society with government and business being well-funded and having tools the nonprofits don't have. A few highly motivated activists with weak institutions will have a hard time achieving results. And what about helping homeless people or providing low-cost health services to poor communities (less of an issue in Canada but a big one in the U.S.).  Only volunteers?  It's hard to have sufficient scale and impact with all volunteers. They burn out (unless they are wealthy already w/o need for a "day job") and the organizations will tend to not have organizational structures in place to make best use of resources of donations (even donations of time from volunteers) due to burnout and turnover. </p>
      <p>If there is an emergency or short-term crisis, yeah, volunteers can make a huge difference.  But if we're talking about dealing with a long-term problems, we need long-term action.  And if we're talking about advocacy against, say, well-funded corporations on an environmental or health issue, you usually have to pay some people to succeed. I think in Canada about 7% of the economy is from nonprofit activities and in the US a little more.</p>
      <p>BTW, in most places "non profit" means that any money raised above costs must go back into programs that help people, rather than into the pockets of owners or investors.  So if a nonprofit runs a surplus one year, they have to do something useful with it that fits their mission. </p>
      <p>Good point that the phrase is lame - defining something by what it's not.  Some other phrases that avoid that problem, but are not great either are "civil society organizations," "private  public-serving organizations," and (for local groups) "community-based organizations."  Also "private voluntary organizations," but that term is very misleading since a lot of PVOs have paid staff and only the board is voluntary.</p>
