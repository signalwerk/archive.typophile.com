      <p>One thing you need to do before you get into this is research the seedy side of the non-profit world. There are just as many incompetents, scumbags, sleazeballs and sociopaths in the non-profit world as there are in businesses. Politicians set up charities run by their spouses as a way of taking bribes. Rich people start them to keep spouses busy and away from the pool boy. Technology corporations fund them as a way of bringing their products to the poor—they’re really just lobbying the government to help establish and expand monopolies. And when you have to deal with the legit non-profits they’re often staffed with crazy do-gooders who refuse to lose any argument because they’re convinced that they’re saving the world. So if you think focusing on non-profits is going to distance you from the disappointment of meaningless work, think again.</p>
      <p>I stopped working with non-for-profits entirely after the last one I worked with would set up meetings between myself and the guy who ran it for which he rarely showed. The unpaid interns were supposed to deliver his instructions or files or whatever but never actually knew where any of it was.</p>
