      <p>Good on you.. here's some things to think about:</p>
      <p>Identify your cause. Are you into politics, aid work, the local arts scene? </p>
      <p>Start networking, especially if it's local causes you're into. You mind find someone from your existing client base is also involved in charity work, can you do anything through them? Or if you're viewpoint is more global, get online, there's loads of volunteer networks out there, here's a couple:</p>
      <p><a href="http://www.volunteermatch.com.au/" title="http://www.volunteermatch.com.au/">http://www.volunteermatch.com.au/</a><br>
      <a href="http://idealist.org/" title="http://idealist.org/">http://idealist.org/</a></p>
      <p>People may be posting their design needs on there.</p>
      <p>Secondly, think about what you want to get out of it for yourself:<br>
      Are you looking for an opportunity to flex your creative muscles away from commercial pressures? Think hard about that because you're still offering a design solution to someone else's problem, regardless of whether there is a fee involved.<br>
      If you have an idea that's waiting for the right client to come along, why not get on and develop it anyway? If you open it up to collaboration (make it open source in other words) then probably the right recipient will come along through the glorious interconnectedness of the interweb.</p>
      <p>Finally; fees...<br>
      If you're serious about offering specialist design services to the non-profit and charitable sector as a commercial venture (for want of a better word) or as a second revenue stream, then you should treat it like any other target customer base.. build a portfolio, make a name for yourself, look for ways to get on their rosters. research who commissions design regularly, and which agencies do the work; that will give you a taste of what might be involved. But even then, be prepared for marked differences in corporate culture from what you may be used to in a wholly commercial context – not least decisions by committee, politically correct considerations and stakeholder interest.</p>
      <p>Alternatively, you mentioned fundraising. It's possible that you could approach your chosen cause with your great idea, and offer to raise your fee yourself – through normal activity like marathons or stunts or whatever, but be careful this doesn't just look like self interest. For most of Joe Public, justifying design fees would be a tall order, even heavily discounted ones. Better to look at where your chosen cause gets their funding from and make an approach to collaborate with one of their existing supporters (but make sure you have your cause's approval first). You could also think about match funding: both you and your cause agree to meet half of the fee each – they go to their supporters for the extra, you donate your time.</p>
      <p>As for fundraising itself, look at the work that the people behind building letters (<a href="http://www.buildingletters.org/" title="http://www.buildingletters.org/">http://www.buildingletters.org/</a>) have done. You could do something similar, that is to say, work out a way that your design skills could generate donations and build a system to involve the type community, in other words, get entrepreneurial. Forget taking a cut for yourself though.</p>
      <p>Last but not least, to cover your costs if that is really important, work out what proportion of your working month you will spend on Pro Bono work, and hike up your normal fees to compensate.</p>
