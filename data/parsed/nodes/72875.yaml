      <p>&gt;  you're still offering a design solution to someone<br>
      &gt; else's problem, regardless of whether there is a fee involved.</p>
      <p>Yeah, sometimes designers doing pro bono work assume that their client will give them complete creative freedom. But clients -- even pro bono ones -- expect you to come up with a design solution that they like and which effectively communicates their message. They don't care if it'll look nice in your portfolio or not, and they won't hesitate to say "I don't like that design."</p>
      <p>So it's important to pick your clients carefully and to discuss expectations before you start work. Show them examples of your work to make sure they're comfortable with your style.  Explain your working method. Find out if you'll be working with an individual or a committee. Ask them about their budget for things like photography, and ask who the printer is going to be and what the printer's expectations are (they may be printing the job for free or at a low cost).</p>
      <p>And if you're expecting a lot of creative freedom, make sure they agree to that from the start of the project.</p>
