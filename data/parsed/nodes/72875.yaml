      <p>"I stopped working with non-for-profits entirely"</p>
      <p>Good for you to generalize a bad experience into an overall policy....you don't seem cut out to work with crazy do-gooders....</p>
      <p>And on all-volunteer groups vs. organizations with some or all paid staff (apart from board members, who must be volunteers in most western countries): apart from small or ephemeral groups, effective nonprofits have to pay their staff. Otherwise they can't achieve good scale of impact and sustain their efforts. The volunteers burn out, cash isn't available for things like office space, etc. Energy is spent but long-term impact is low.</p>
      <p>The thing is is to look around at the nonprofits and see how much they spend on the mission and how much they spend on fundraising and everything else. ROUGHLY 20% on non-mission expenses is entirely normal. In some areas of work it's more, in some less.  It's the same in the for-profit world - would we invest in a company whose CEO brags about never spending anything on sales, marketing or HR, and only on direct production? Such a company couldn't even get product to market.</p>
