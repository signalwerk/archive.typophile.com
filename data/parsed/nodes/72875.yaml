      <p>You should move to the UK so you can join David Cameron's Big Society! (Only kidding, everyone should be trying to get the hell out.)</p>
      <p>Seriously though, I commend Frode. I too would like to do something that I felt made a difference somehow, though lately I question how much power there is to do this with design. I'm not really a business man, though I think lot's of people here are and I don't mean to be dismissive of that. Perhaps it's a lack of realism on my part, idealism. I could have gone and made money after school, I had the right grades, support etc., but I chose this profession and when it just resembles money making I wonder what the big difference is and why I became involved.</p>
