      <p>I'm fortunate to have spent many years working full-time for a not-for-profit educational and development organization whose overall purpose is to serve minority language communities (<a class="freelinking external" href="http://www.sil.org/" rel="nofollow">SIL International</a>). It is very rewarding to invest my daily work in projects that help people. I feel like my work is leaving a lasting legacy - not for me, as fonts can often be unnoticed and taken for granted - but for the millions of people trying to hold on to their language and culture while becoming citizens of the information world.</p>
      <p>The cost of this decision was not small, for me or my family. Because most of the funds given directly to SIL go to supporting development projects, most of the staff serve as unsalaried volunteers. We can do this because of a faithful group of friends and organizations who share our goals and provide financial support for our family. It takes significant effort to maintain this body of supporters, which obviously reduces my technical productivity - but also keeps me in touch with a lot of dear friends.</p>
      <p>It is also possible, though, to have an equal (or greater) impact while working for normal for-profit companies. I think of a couple of former SIL colleagues who now work for large corporations but have, through those jobs, made life better for minority groups. They've helped their companies understand the benefits of broadening their character set support and provided technical know-how to do it.</p>
      <p>We're also getting ready to unveil a new web site (ScriptSource) that will help link volunteers (designers and programmers) with font and software development needs. It would be a great way to find a project to contribute to. It's not public yet, but you can see where we're at by going to the <a class="freelinking external" href="http://www.scriptsource.org/" rel="nofollow">ScriptSource web site</a>. I'll be at ATypI in Dublin in case you wanted to chat about getting involved as a part-time volunteer with some project.</p>
      <p>It's humbling and satisfying to be able to create beautiful things that also meet people's real needs.</p>
    html_clean: |-
      <p>I'm fortunate to have spent many years working full-time for a not-for-profit educational and development organization whose overall purpose is to serve minority language communities (<a class="freelinking external link-external" href="http://www.sil.org/" rel="nofollow">SIL International</a>). It is very rewarding to invest my daily work in projects that help people. I feel like my work is leaving a lasting legacy - not for me, as fonts can often be unnoticed and taken for granted - but for the millions of people trying to hold on to their language and culture while becoming citizens of the information world.</p>
      <p>The cost of this decision was not small, for me or my family. Because most of the funds given directly to SIL go to supporting development projects, most of the staff serve as unsalaried volunteers. We can do this because of a faithful group of friends and organizations who share our goals and provide financial support for our family. It takes significant effort to maintain this body of supporters, which obviously reduces my technical productivity - but also keeps me in touch with a lot of dear friends.</p>
      <p>It is also possible, though, to have an equal (or greater) impact while working for normal for-profit companies. I think of a couple of former SIL colleagues who now work for large corporations but have, through those jobs, made life better for minority groups. They've helped their companies understand the benefits of broadening their character set support and provided technical know-how to do it.</p>
      <p>We're also getting ready to unveil a new web site (ScriptSource) that will help link volunteers (designers and programmers) with font and software development needs. It would be a great way to find a project to contribute to. It's not public yet, but you can see where we're at by going to the <a class="freelinking external link-external" href="http://www.scriptsource.org/" rel="nofollow">ScriptSource web site</a>. I'll be at ATypI in Dublin in case you wanted to chat about getting involved as a part-time volunteer with some project.</p>
      <p>It's humbling and satisfying to be able to create beautiful things that also meet people's real needs.</p>
