    html: <p>For print text, serifs are much more readable in my opinion. For headings and tables a sans is fine. Your 'contemporary, intelligent and rational' brings to mind <a href="http://fontbureau.com/fonts/Whitman" target="_blank">Whitman</a>.     Someone here mentioned a pairing of Whitman and <a href="http://www.typography.net/type/bliss.htm" target="_blank">Bliss</a>, which sounds to me just wonderful. <br> <br>I don't know about a serif pairing for Whitney, but no doubt you can get some suggestions here.</p>
