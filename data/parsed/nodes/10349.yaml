  html: "<p>Hi, I'm an information design student struggling to find a good typeface or typeface combination for my thesis dissertation, I've tried a bunch but none have convinced me. <br> <br>I was wondering if anyone could help me with the choice(s). Here are the absolutely necesary requirements: <br> <br>- That is prints nice on laser printers <br>- Very complete family sets, as I'll probably be using various levels of hierarchy <br>- Lining and old-style figures, as I'll be using lots of tables to display information <br>- The most important one: that it's extremely readable <br> <br>Desirable qualities: <br> <br>-A large x-height <br>-Economical on space without sacrificing readability <br>-That it looks contemporary, intelligent and rational <br> <br>I'm taking a look at Whitney (H&amp;FJ) right now for headings and tables. Is this a good choice? Any alternatives? <br> <br>I'm also torn between making the body serifs or sans-serifs, any help on the matter would be greatly appreciated.</p>"
  html_clean: "<p>Hi, I'm an information design student struggling to find a good typeface or typeface combination for my thesis dissertation, I've tried a bunch but none have convinced me. <br> <br>I was wondering if anyone could help me with the choice(s). Here are the absolutely necesary requirements: <br> <br>- That is prints nice on laser printers <br>- Very complete family sets, as I'll probably be using various levels of hierarchy <br>- Lining and old-style figures, as I'll be using lots of tables to display information <br>- The most important one: that it's extremely readable <br> <br>Desirable qualities: <br> <br>-A large x-height <br>-Economical on space without sacrificing readability <br>-That it looks contemporary, intelligent and rational <br> <br>I'm taking a look at Whitney (H&amp;FJ) right now for headings and tables. Is this a good choice? Any alternatives? <br> <br>I'm also torn between making the body serifs or sans-serifs, any help on the matter would be greatly appreciated.</p>"
