    html: |-
      <p>of course, the cheapest way (assuming you have an illustration program) would probably be just doing it yourself since the letterforms are dot-based. it could look something like this:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/ticket-type_3950.png"></div><p></p>
      <p>i did this in a jiffy just by using a grid and using the "Round Corners" filter (for an inkier look). it may take more time, but it might be worth it too since you can get it more the way you want it.. and it didn't cost $70 either.</p>
