      <p>Nice investigation.</p>
      <p>I'm not sure what Michael would have gained by copying the metrics from Arial. Arial's Armenian is neither passable nor in much use AFAIK. Tracing* on the other hand is advantageous - but of course not OK, at least not without permission and crediting.</p>
      <p>* By which I have to ask what exactly you mean.</p>
      <p>&gt; the x-heights, ascender and descender height are nearly identical.</p>
      <p>How nearly? Because in the past I've been surprised at how close I've come on occasion myself. After I made Patria I was curious to compare it against two highly reputable fonts: Times and Georgia. To my shock all three were quite close in vertical proportions! Plus as with the metrics, I can't think of a good reason to copy it. That is, unless Arial was in fact a direct source for the outlines (at least some of them) in which case it would be natural to keep the vertical proportions (and maybe change them a hair to divert suspicion).</p>
      <p>Concerning the "ho", IIRC* he asked me about which form to use and I strongly recommended what I consider to be the authentic form (especially since his design is classicist) and he used that. The "now" is the good form too (although the rendering is cruddy). Here BTW is a collage of the evolution of the "h", from the original capital, to the superb classical lc form, to the sad, Latinized junk from the 70s:</p>
      <p>_<br><img src="/sites/default/files/old-images/ho_evolv_3601.gif"><br>
      _</p>
      <p>* I really don't want to go back and read those disheartening emails again...</p>
      <p>Lastly, the Arial "keh" is Latinized and not to my liking, but it is in fact a valid historic form, so not totally off the wall. The Arial "sha" however, even though it does have some precedent from the 20th century, is almost as bad as the "ja" (that in fact Michael seems to have sadly used as a model).</p>
      <p>hhp</p>
