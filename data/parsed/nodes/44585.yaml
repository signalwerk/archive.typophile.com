      <p>I was looking through my fonts I have for armenian and might have found part of the problem.  While all the rest of the (granted, rather limited) Armenian fonts I have tend to have quite varied metrics, Mshtakan shares more than a few similarities with another font that I presume is well distributed (if not, as already noted by hrant, well designed).  Mshtakan is black, Arial Unicode is blue.</p>
      <p><img src="/sites/default/files/old-images/armenian_comparison_5905.png"></p>
      <p>The metrics are nearly identical, although Mshtakan (which as far as I know was designed to be more of a screen font) is bolder.  But the x-heights, ascender and descender height are nearly identical.  Some of the more unique letters seem to be almost traced out of Arial Unicode.  Specifically, է, ժ, ծ, ձ, ճ, մ, ւ, and ֆ.  I'm not saying he copied it of course, but he has a very clear influence (although, to his credit, he did go for what, if I've learned well from hrant and I'm sure he'll correct me if I be wrong, is a far better and more authentic հ and ն, and actually got the ք correct).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
      <p>[side note: hrant, within about a week or two once I'll have an interesting setup for the italic of Coruña with regards to Armenian]</p>
