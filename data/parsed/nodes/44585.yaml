      <p>When I said traced I didn't mean it quite so literally.  But, ժ, ծ, and է seem to curve virtually identically (cf to the letter f or ð, which start their curves at different points in different fonts, and varies its degree of overhang and level and angle of cross bars).  I'm not suggesting he intentionally copied Arial, but just might have thought of Arial too closely as a model.  I can't remember who said it on here, but I remember someone mentioning that the biggest problem Latin-native designers have with something like Cyrillic is that we tend to be at times too conservative as a sort of crutch.  Maybe that was part of the case.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
