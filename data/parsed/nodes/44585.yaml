      <p>My stars, Hrant. The mails you wrote me in 2002 were a lot more encouraging: <cite>So I took a look at your revised font: Wow, what a difference! I think the slant is a good amount. For the spacing you might consider making it even slightly looser. Don't worry about the liwn, it's pretty normal that way. Some people would call this very old-fashioned, but in the conext of all the contemporary crap that passes for Armenian fonts these days, I think this is a worthwhile effort. The main thing now would be to polish the forms. As for the name, maybe call it "Mshtakan", which means perpetual: it plays well with your last name, as well as the design's "old" nature.</cite></p>
      <p>I never looked at Arial Unicode. My source for shapes was font showings in Darbinyan 1965 and Gorcakalyan 1973. I sent you a copy of Darbinyan.</p>
      <p>I remember (six years on) some of the discussion we had about ho and ja and so on. I checked to see what ja variants I had, and it seems that you didn't like any of them. I'd be happy to improve the ja. I have a chance to do a update on the font just now. Perhaps there is no redeeming it in your eyes, Hrant, but if ja and anything else wrong with it can be corrected, I'll be happy to do so with your advice, which I respect.</p>
      <p>Michael Everson<br>
      evertype.com</p>
