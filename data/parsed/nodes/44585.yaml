      <p>Khajag, as you've probably noticed, Arasan is not Unicode. As you've found out however Mshtagan  (which is Unicode) does come with OSX. It's decent. But don't use Arial-Unicode's Armenian - it's quite horrid, and full of structural mistakes.</p>
      <p>&gt; what about Armenian typefaces for sale?</p>
      <p>Ironically enough it's hard to find an Armenian font for sale; people who design Armenian fonts don't expect to get any money for them! So they just give them away. This is of course why most Armenian fonts are so crappy.</p>
      <p>Besides the great classicist work done by Carolyn, I have a font called Nour (in four weights) which has won two competitions (one by the UK magazine Creative Review, the other by the government of Armenia). It attempts to be highly authentic but equally readable, and has a somewhat elaborate relationship with a Latin counterpart (called Patria). It's all Unicode (although I have it in other encodings too). Please feel free to contact me: hpapazian at gmail dot com.</p>
      <p>&gt; ARMSCII-8 [is] like pages still encoded Latin-1, Latin-2</p>
      <p>It's certainly worse than that. ArmSCII-8 is one of two quasi-standard 8-bit encodings; the other is mine (the one in Arasan).</p>
      <p>&gt; the script is not your achievment</p>
      <p>Well, we all participate. In fact some scholars think what Saint Mesrop invented looked quite different originally, and it's when the scribes started using the new script at speed that it started looking a bit Greek.</p>
      <p>hhp</p>
