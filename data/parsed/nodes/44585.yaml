    html: |-
      <p>Yeah, that Newspaper page is ARMSCII-8 encoded, not Unicode. (That's like pages still encoded Latin-1, Latin-2, etc. instead of Unicode: very common).</p>
      <p>You have to change the Encoding in your browser, something like: View &gt; Encodings &gt; [Other &gt; SE and SW Asia] &gt; Armenian (ARMSCII-8).</p>
      <p>Then it works fine.<br>
      I'm such in love with the looks of the Armenian script!</p>
    html_clean: |-
      <p>Yeah, that Newspaper page is ARMSCII-8 encoded, not Unicode. (That's like pages still encoded Latin-1, Latin-2, etc. instead of Unicode: very common).</p>
