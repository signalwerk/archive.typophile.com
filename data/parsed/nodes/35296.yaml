  html: |-
    <p>Good day everybody,</p>
    <p>A friend of mine forwarded me something saying that a black screen saves more energy, and if google were to have their main page as white on black, it would save ’750 mega watts/hour per year’.</p>
    <p>see here: <a href="https://web.archive.org/web/20080705154246/http://www.blackle.com/" title="http://www.blackle.com/">http://www.blackle.com/</a> </p>
    <p>I was wondering if anyone knows of any research regarding it being easier to read text on screen in white-on-black rather than black-on-white?</p>
    <p>Ta</p>
    <p>Graham</p>
