      <p>Hey Josh: I started coding in Python because I was sick of using PHP for my Web development work, then I started using it for general automation. I was delighted to find out it was the de-facto standard in the tyographic world. Python per se is not hard at all to learn (it’s a pleasure compared to other languages), but you might find it easier if you already know concepts of generic programming. In any case, Python is considered very good even as a first programming language, so don’t be scared. There are some good, free guides on the Web about programming, and some use Python as the teaching language like <cite><a href="http://www.ibiblio.org/obp/thinkCSpy/" rel="nofollow">How to Think Like a Computer Scientist</a></cite>. </p>
      <p>Most of all, what helped me while I was beginning (and still helps me, since I can’t really consider myself as a great programmer) is reading other people’s source code, figuring out why it worked and why it was written in a certain way. Then I could modify it for my needs and maybe add some of my own ideas. After that you gain confidence because you already know how to solve a certain set of problems, and then you can move on to more interesting ones. My advice is to pick a project that would be helpful to you right now, like building a photo gallery for your Web site, and automate its production. Sure, you’ll hit roadblocks along the way like “how do I install new libraries?” “where do I find the libraries I need?” “how do I get a list of file names from a directory?”, but all these will be chances to dig deeper and learn more.</p>
