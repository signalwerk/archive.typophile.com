    <p>Hello everybody, a couple of weeks ago I was chatting with <a href="http://www.tht.it/" rel="nofollow">Claudio Piccinini</a> and he showed me a (working!) copy of <a href="/wiki/FontStudio" class="freelinking" rel="nofollow">FontStudio</a>, the mythical Letraset font editor from the early nineties. He was taking me through the features he used to love the most and at some point he showed me <a href="/wiki/Automatic%20Text" class="freelinking" rel="nofollow">Automatic Text</a>, which was basically a generator of preview text sequences of characters, useful for checking and editing your font spacing/kerning. </p>
    <p>This was the original window:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/automatic-original_5593.png"></div><p></p>
    <p>I then set out to reproduce the same behavior, which I found very useful, in FontLab Studio via Python. It took a while to find a way to write to the metrics window (FontLab’s Python documentation is terrible) but eventually:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/automatic-text_4818.png"></div><p></p>
    <p>This is the end result, using the command “Generate h beside all characters”:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/automatic-text-result_3785.png"></div><p></p>
    <p>I think it’s very useful, but I’ll let you be the judge on that. </p>
    <p><strong>Get Automatic Text:</strong> You can get the code, with installation instructions, over here: <a href="http://code.unicoders.org/hacks/trunk/automatic_text.py" rel="nofollow">automatic_text.py</a> (or you can <a href="http://unicoders.org/code/hacks/trunk/automatic_text.py" rel="nofollow">read the source code online</a>).</p>
    <p>Comments and ideas are welcome. I developed and tested it on my copy of FontLab Studio 5.0.4 on Mac OS X 10.4.9, if anyone could test it under Windows that would be awesome. I couldn’t find a way to produce radio buttons via the FontLab Python API, so I had to fake them with checkbox controls, which is suboptimal because it’s not their default behavior. </p>
    <p><strong>Known issues:</strong> </p>
    <ul>
    <li>At the moment you can only enter either glyphs in the range <code>[a-zA-Z0-9]</code> in the text boxes, or the glyph names with the <code>/name</code> notation;</li>
    </ul>
    <p>That’s it, I hope this helps people with their metrics/kerning development. Cheers.</p>
