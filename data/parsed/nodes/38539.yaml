      <p>I worked around the first issue (the script was reordering your glyphs by Unicode name by default) by implementing an idea by Karsten Luecke: generate a temporary disposable copy of the font, sort <em>that</em> by Unicode name, and then delete it. This slows things down a bit, but it’ll do for now. I’m still curious as to why the glyph index is considered important, thought. As far as I know it’s a record of the order in which glyphs were entered into the font, maybe people are using to keep track of something more interesting? Also, is there a better way to get all the glyph names in a font, sorted by Unicode name? Now that I think of it, I could avoid the issue altogether and just use the default index order, but it didn’t seem significant enough to me.</p>
      <p>Anyway: thanks, Karsten!</p>
