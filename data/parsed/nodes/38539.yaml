      <p>Hello everyone. I worked a bit more on Automatic Text and on another script dealing with kerning stuff, and I have now changed idea regarding the sorting of glyphs. Yeah, at first it might be unexpected to have glyphs in random order when generated by Automatic Text, but fixing it just means putting order in your “messy” glyph index, which sounds like a good thing to me. So, in order to encourage people (and I’ll put myself first) to actually organize their glyphs in a sensible manner, I think Automatic Text shouldn’t do any re-ordering for you, which is what it will do starting from version 0.3 which should be out in a few days.</p>
      <p>Georg: regarding your requests about having more ranges available, I understand they’ll be helpful but I fear having too many options might make the dialog window more messy than it already is. As Claudio suggested, a good ordering of your glyph index plus the “generate behind selected glyphs in font window” should help you with accented letters, punctuation and figures. For small caps I have another script in the pipeline which basicaly converts all the caps in the current metrics window with their small caps counterpart.</p>
      <p>I also fixed the issue with being able to only enter glyphs in the <code>[a-zA-Z0-9]</code> range in Automatic Text, but before releasing it I’d like to make up my mind about a dependency issue I just introduced. Stay tuned.</p>
