      <p>Hi Georg, thanks for the explanation, I hadn’t paid attention to the InDesign glyph palette issue but it does sound like something significant for font developers. As for the glyph sorting, when I first developed the script I tested it with several of my (in progress) fonts, where the glyph index wasn’t really significant. That meant that when I was generating the sequences they weren’t making any sense. I could have sorted them alphabetically by glyph name, but that would have meant having more random sequences like having the infinity glyph near the lowercase i just because both started with the same letter. Sorting via the Unicode ordering seemed to make the most sense to me.</p>
      <p>Does this explain the need for sorting or do people still think it would be best to leave the glyph order untouched? I can remove the sorting step if needed, but I would like to do it only if it’s regarded as the best option by people who use the script.</p>
