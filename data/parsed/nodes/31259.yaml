      <p>Adam, InDesign lets you create shapes somewhat (although nearly not as sophisticated) as Illustrator.  You create one (in this case, I'd use a very tall and narrow rectangle), ensure that it has a text wrap put around it, and then go crazy adding points on the text wrap bit to nudge words over to fill spaces as necessary.  </p>
      <p>When you're done, you ensure the rectangle is "invisible" by making sure that "none" is checked for both line and fill.  You still have to tinker a lot by hand, but it's easier than mili's solution, particularly if you end up changing some of the text you're setting.</p>
      <p>Read InDesign's help stuff on text wrap, and it should be pretty self-evident.</p>
