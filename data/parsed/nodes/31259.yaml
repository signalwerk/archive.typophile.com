      <p>Adam, online resource-wise I think you'll only see Phil Baines’ more recent work and books (which have only a rather vestigal relationship to what you're attempting).</p>
      <p>The early work which I was referring to was profiled in baseline magazine #11, the Bradbury Thompson issue, which was published by Esselte Letraset in 1989. According to the current <a href="http://www.baselinemagazine.com/" rel="nofollow">baseline website</a> it is available but, as a very rare back issue, they'll want to charge you £50 for it.</p>
      <p>I've just tried out Reed's (auricfuzz) method for the flush space/forced justification and it will do what you want, but when he said <em> ...it’s still a manual process</em> he meant exactly that (Indesign does have scripting but I can't think of a way to automate this).</p>
