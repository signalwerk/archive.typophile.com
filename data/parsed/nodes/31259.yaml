    html: <p>What you need to do is draw the shape you want the tear to look like, with either the straight line tool, or shape, and if you're using the straight line tool, you need to select all the lines you have created (but do not group, or you'll end up with a rectangle block!) once you've selected the drawn lines or the shape, use the text wrapping tool to the tightest wrap, and then justify the text and make sure 'hyphenate' is not selected (in the paragraph options box) and that should wrap your text around the shape just nicely! I hope this helps.. :)</p>
    html_clean: <p>What you need to do is draw the shape you want the tear to look like, with either the straight line tool, or shape, and if you're using the straight line tool, you need to select all the lines you have created (but do not group, or you'll end up with a rectangle block!) once you've selected the drawn lines or the shape, use the text wrapping tool to the tightest wrap, and then justify the text and make sure 'hyphenate' is not selected (in the paragraph options box) and that should wrap your text around the shape just nicely! I hope this helps.. :)</p>
