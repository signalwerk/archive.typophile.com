      <p>Both Fay and Linda's methods should work, but I thought I'd add my own preferred method. If you turn on "justify all lines" (<em>not</em> "justify with last line aligned left"), you can add what's called a flush space (Type&gt;Insert White Space&gt;Flush Space) before the last word on each line. The cool thing is that the flush space will grow to whatever size is necessary to completely justify the line, without adding space between your other words. I think that would be quickest of all these methods, although it's still a manual process.</p>
      <p>To make it work best, you should decide before adding the flush spaces exactly which words you want per line, then add forced line breaks (shift-return) at the end of each to ensure that no words change position. I also deleted the final space on each line to make it all behave in an orderly fashion. Hope this helps.</p>
