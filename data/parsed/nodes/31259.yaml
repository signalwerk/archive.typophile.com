      <p>I haven't tested this, but what if you replaced all spaces but the last one in each line with fixed-width spaces; i.e., one of the Unicode code points in the U+2000 to U+200A range? (Pick the one that most closely matches the width of a "real" space, U+0020, in your selected font.)</p>
      <p>Whether this will work or not depends on how InDesign deals with those special space characters.</p>
