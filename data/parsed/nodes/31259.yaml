      <p>Personally, I wouldn't bother with crappy justification (which most letterpress printers frown upon anyway) and explore other "traditional" difficulties of handset type.</p>
      <p>Here's a quick test:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/fake_4989.jpg"></div><p></p>
      <p>1.I raised/lowered some letters a hairpiece away from the line.<br>
      2. Rotated individual lines by a few degrees to simulate uneven leading and bad lockup in the chase.<br>
      3. Added a tiny outline to some overprinted, and distorted some worn sorts.</p>
      <p>Naturally, this sort of thing is easier to do in Illustrator than ID.<br>
