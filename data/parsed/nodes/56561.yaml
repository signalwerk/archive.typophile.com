    html: |-
      <p>Now I've tested it on Windows:</p>
      <p>ctrl + alt + → = increase right sidebearing by 1 unit<br>
      ctrl + alt + shift + → = increase right sidebearing by 10 units<br>
      ctrl + alt + ← = decrease right sidebearing by 1 unit<br>
      ctrl + alt + shift + ← = decrease right sidebearing by 10 units</p>
      <p>ctrl + → = increase left sidebearing by 1 unit<br>
      ctrl + shift + → = increase left sidebearing by 10 units<br>
      ctrl + ← = decrease left sidebearing by 1 unit<br>
      ctrl + shift + ← = decrease left sidebearing by 10 units</p>
      <p>→ = move outline to the right by 1 unit<br>
      shift + → = move outline to the left by 10 units<br>
      ← = move outline to the right by 1 unit<br>
      shift + ← = move outline to the left by 10 units</p>
      <p>I'm using a German keyboard layout, but that shouldn't matter.</p>
    html_clean: |-
