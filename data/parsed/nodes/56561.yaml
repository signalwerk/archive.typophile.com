    html: |-
      <p>On Mac:<br>
      Option+arrow changes the right sidebearing<br>
      Cmd+arrow changes the left one</p>
      <p>On Win:<br>
      Alt+arrow does not work<br>
      Ctrl+arrow changes the left sidebearing<br>
      To increase the right sidebearing you must increase the left one and then move the glyph to the left accordingly.</p>
      <p>Not sure if that was documented. :)</p>
      <p>Regards,<br>
      Johnych</p>
