      <p>The argument of modernists is that Helvetica is the most neutral of all typefaces. Thus allowing the message to be communicated without carrying any exterior implications. Much related to Beatrice Ward's crystal goblet argument.</p>
      <p>"Now the man who first chose glass instead of clay or metal to hold his wine was a 'modernist' in the sense in which I am going to use that term. That is, the first thing he asked of his particular object was not 'How should it look?' but 'What must it do?' and to that extent all good typography is modernist."</p>
      <p>Which is also why many post-modernists do not care for Helvetica.</p>
      <p>Also, if you haven't noticed. It seems like Gotham is beginning to replace Helvetica in many instances.</p>
