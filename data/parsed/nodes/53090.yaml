      <p>I don't think in terms of sterile and nuanced as being good or bad. I loved Melior but hated Palatino. I love Univers and think Helvetica is good in display usage in the heavier weights. Actually, AG is better in the extra bold weight.</p>
      <p>The significance of Helvetica is that it helped launch an avant garde movement later called the International Style. It was the sign of the young brash designer going against the establishment arty style of the 50s. That seems strange today where the old geezer establishment is looked upon as being the Helvetica flush-left crowd. Times come and go and what seems so hot, young, hip, sweet, and in today will be scorned in 30 years as establishment Lemming following.</p>
      <p>Optima was decent enough but not earthshaking. It was something neither here nor there. Helvetica was the face that launched 1000 ships while Optima christened a few lovely yachts. There were two camps back in the 60s. The pro-helvetica were then the young firebrands and the anti-helvetica were the establishment. This is all flip-flopped now--even more, Helvetica hating is expected and cheered by the current young designers. Helvetica has become so overused and so very badly used in recent years that you cannot help but shun it. Today, we blame the sins of the sons on the conception of the fathers.<br>
      Optima filled a niche while Helvetica built the mountains, Today, the mountains have eroded badly and created many new niches to be filled. It is natures way, build, breakdown, and rebuild something new. We have all moved on and now can talk about Helvetica as a point in History--even make a film about it!</p>
      <p> ChrisL</p>
