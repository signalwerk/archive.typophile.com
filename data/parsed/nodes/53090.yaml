      <p>@Jelmar: <em>While Helvetica is described as objective and neutral, it isn’t really; it still has a lot of aspects that echo the broad-nib pen. E.g. contrast and stress (albeit little). I think the little flick on the leg of the R and the tail of the a also come from that.</em></p>
      <p>This leads to another question. *Who* describes Helv as "objective and neutral" ? It may have been described that way by respectable aesthetes 50 or more years ago—by today's standards the design cannot be so described. Q.E.D: the definition of objective and neutral has moved on since Helvetica was unleashed.</p>
      <p>These anomalies we're trying to explain could have their origins in the broad nib pen, or they could be imitation of traditional text typeface design. I favor the latter theory on the grounds that successful type designs are supposed to be closely based on existing types. Imitation of seriffed book romans is more likely than imitation of calligraphic forms.</p>
      <p>j a m e s</p>
