      <p>It's difficult to claim that any piece of art is entirely neutral.  One's associations with Helvetica are going to depend on the context in which one first saw it. Just as you might have feelings about a particular song and what it meant when you first heard it, not 20 years later after it becomes an overplayed classic you can no longer stand.</p>
      <p>While Helvetica may have been around since '57 it really took off later in the 60s.  The best early widespread use of it involved the greatest practitioners of the day and the results were stunning.  Helvetica may have been the face of choice that moment, but its usage was forever being showcased within the context of a bold new look in design in general. Had Helvetica not been there to use I'm sure they would have chosen any suitable sans.</p>
      <p>If your experience with the face began with more recent Helvetica usage revivals you might have a different association. Usages such as that employed by American Apparel, for example, are purposeful attempts to be ironic by employing the face to represent the unbranded, un-designed and personality devoid culture they espouse.</p>
      <p>Just as any color in a painting or note of a song is neutral until it is placed next to another, Helvetica's neutrality stops the moment it is placed into a layout, set in the words it will deliver.</p>
