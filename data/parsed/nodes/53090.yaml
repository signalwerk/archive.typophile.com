      <p>"...the train of the International Typographic Style just in time to make the world believe Swiss Graphic Design really was *that* bland, or that Helvetica was causatively connected to it."</p>
      <p>I agree. That is why I separate the earlier Swiss graphic Design from the International Style even though one grew from the other. Naming it Helvetica after Switzerland further pushed the Swiss notion. As I said before, I much prefer Univers as a typeface from that time but it lost the battle of distribution along with AG or Standard as it was known in American metal cuts. AG was really the founding father and a better display face than Helvetica. Ask Weingart what he thinks about Helvetica some day and you will have time to finish several beers before he finishes his comparison :-)<br>
      Helvetica won out not because it was better than Univers (or AG) but because it was quicker to phototype distribution and spread to typesetters with greater profusion. Typesetters usually did not have both Helvetica and Univers so they set what they had. Remember, purchasing a typeface in that day was a huge expense compared to the pennies they cost today.<br>
      I am not enamored of Helvetica, I am just explaining its prominence, indeed dominance, of usage in that era. That does not make it good. It just makes it a benchmark in typographic history. </p>
      <p>My favorite Swiss posters were Giselle and William Tell by Armin Hofmann. This may partly be due to studying with early students of Hofmann and Ruder.</p>
      <p>ChrisL</p>
