      <p><em>"That is why I separate the earlier Swiss graphic Design from the International Style even though one grew from the other."</em></p>
      <p>Very good point; it's puzzling that many people / sources don't seem to make this distinction. Of course, like you said, naming Helvetica Helvetica makes it even more confusing to realize that it actually hasn't fully pushed the "Swiss" aspect of the style, even if it is a Swiss design itself. As Colin Forbes is quoted in "Helvetica – Homage to a Typeface":<br>
      "Some years ago a young intern in our New York office, when looking at an old map where Switzerland was named Helvetia, said, 'Fancy naming a country after a typeface.'"</p>
      <p><em>I am not enamored of Helvetica, I am just explaining its prominence, indeed dominance, of usage in that era.</em></p>
      <p>Oh, absolutely. I didn't mean to disagree; and I also didn't assume you didn't already know what I wrote. But hey, you never know, there may be people reading this who didn't. In fact I wrote a design history paper back in school, setting out full of confidence to document the relationship between Helvetica and the Swiss Style, only to realize this didn't actually happen the way I [and many people around me] expected it to be, which would have been a near-symbiotic rise of Helvetica and the Swiss style as a couple made in heaven.<br>
      Since then, mentions of the Helvetica—Swiss connection still prompt my reflex to disambiguate their relationship. ;-)</p>
      <p><em>My favorite Swiss posters were Giselle and William Tell by Armin Hofmann. This may partly be due to studying with early students of Hofmann and Ruder.</em></p>
      <p>I'm envious! (And as a Basler, I'm of course proud you mention Hofmann rather than Müller-Brockmann.*) Where, and with whom did you study if I may ask?</p>
      <p>* I actually absolutely adore the work of Müller-Brockmann, except maybe the very late stuff. But Baslers of course relish any assertion that they're not any worse than the Zurichers. ;-)</p>
      <p>My favorite poster by Hofmann is "Spitzen" (Lace; pardon the bad reproduction). The way he works the letterforms into the illustration is just amazing.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/spitzen_4905.jpg"></div><p></p>
