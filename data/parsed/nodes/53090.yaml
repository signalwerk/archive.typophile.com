      <p>Chris, I can follow and accept what your saying, and I am not going to disagree with your over all assessment of Helvetica &amp; the 60's, but I quite like Optima &amp; Palatino and dislike Helvetica &amp; Melior, but I don't think these personal tastes are the core issue. Perhaps relevant in someway, but more a side issue.<br>
      You write: "It was the sign of the young brash designer going against the establishment arty style of the 50s." I agree, and this to me is the core issue that made Helvetica the monster it turned out to be, and it would suggest that it was usage and typographic/ graphic style that was really the issue and not the choice of type face. From my eyes there were better sans faces around long before Helvetica. Helvetica itself was nothing particularly new and certainly nothing creative or innovative at all in type face design as far as I can see (which may not be far). I think that Hans Mohring was far more interesting, different, innovative and creative in his sans designs during the 1920's (from memory) than Helvetica or anything produced in the 60's. The fact that Helvetica became the type face of the 60's and well into the 70's was more to do with it being a new release at the right time to suit the typographic style of the rebellious young graphic designers of the day.<br>
      Helvetica was used by the avant garde of the 60's because it was as far removed from the tastes of the day as they could get, not because it was a good design.</p>
