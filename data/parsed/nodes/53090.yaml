      <p>@Cory: <em>. . . the consistency between the uppercase “R” and the lowercase “a”,</em></p>
      <p>I don't think the curly bits on Helvetica's R and a are meant to be related, but evolved with separate, unrelated origins in seriffed roman types. They just happen to look very similar. Appearances can be deceptive.</p>
      <p>@Graham: <em>I dislike Helvetica and its derivatives, intensely.</em></p>
      <p>Q. What's the difference between Helvetica and a bucket of shite?<br>
      A. The bucket has a handle.<br>
      A. Shite can be used to fertilize plants.</p>
      <p>Q. Does my joke about Helvetica indicate I hate it too?<br>
      A. Nope. I just like making fun of things others despize.</p>
      <p>@Paragraph: <em>It could just be a sign of the times, a historical thing: a reaction to typefaces past? In the fifties some people might have felt aversion to Futura and it’s geometry, hence the ’serify’ or ’humanist’ R. Just a guess...</em></p>
      <p>The curly leg on Helvetica's R is a piece of baggage residual from the face's origins in Akzidenz Grotesk and numerous 19th century "grotesks". From everything I've read about Helv the curly leg is not a backlash against geometric linear types but a form of tacit lineage to Didots, Baskerville, Bulmer and the like.</p>
      <p>j a m e s</p>
