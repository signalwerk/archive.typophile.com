    html: <p>Yes, the R in Helvetica sucks. But the rest of it makes a pretty sweet display face. I think Mike Parker makes the best argument for Helvetica when he describes how the shapes of the letters and tight spacing combined to just grab the negative spaces and lock them in place. As for neutrality, Kai Bernau did a great job in his thesis explaining how neutrality is contextual; ubiquity of certain weights has made Helvetica anything but neutral in some contexts.</p>
