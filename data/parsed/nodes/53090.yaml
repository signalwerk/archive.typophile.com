      <p><em>The significance of Helvetica is that it helped launch an avant garde movement later called the International Style.</em></p>
      <p>It's actually kind of sad that Helvetica jumped onto the train of the International Typographic Style just in time to make the world believe Swiss Graphic Design really was *that* bland, or that Helvetica was causatively connected to it.</p>
      <p>Akzidenz Grotesk was the face that was almost invariably connected to the Swiss Style at its outset. A large majority of the earlier (Swiss) examples of the International Typographic, or Swiss, Style were set in AG, and Neue Haas Grotesk actually had a pretty slow start in Switzerland, most reactions indicating that graphic artists were very happy with AG, and weren't waiting for a "tamed" version of it. In fact, the power of many of those famous poster layouts relies in part on the greater tension and irregularity of the lettershapes – they would not have worked as well with Helvetica.* There is often a powerful but carefully balanced tension to those early layouts; many of them weren't anywhere near as bland as the Swiss Style has come to be seen (and reinterpreted) elsewhere, later.</p>
      <p>* Probably my favorite: <a href="http://www.plakatwp.ch/images/M%C3%BCller-Brockmann-02.jpg" rel="nofollow">"Weniger Lärm" bei Josef Müller-Brockmann</a> (1960).</p>
      <p>So, the avant garde of said movement, more often than not, <em>didn't</em> use Helvetica (and consciously so); the ones who copied and followed the avant garde did (and do) invariably use it, belying some of the original essence and intentions of the Swiss Style.</p>
