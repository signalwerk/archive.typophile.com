    <p>Hello -</p>
    <p><strong>Context</strong>:<br>
    As a packaging designer, my clients are often requesting that we add Arabic, Chinese and Hebrew texts on packaging.<br>
    More often than not, I receive 4 different types of text sources :</p>
    <p> —  1.<br>
    A .PDF containing a scan of the text needed (so nothing more than a picture).</p>
    <p> —  2.<br>
    A .PDF whereby I can select the text and copy it into MS Word® but the sentence is no longer the same as what I had copied from the .PDF file! (e.g. some of the characters are replaced by strange ones).</p>
    <p> —  3.<br>
    A .PDF file where the client has inserted an annotation which displays correctly in the Acrobat® but the moment that I do a copy/paste into MS Word®, the whole sentence is inversed (text appearing left to right instead of right to left -&gt; For Arabic).</p>
    <p> —  4.<br>
    Sometimes I also receive Excel® files.</p>
    <p>After copying the text into MS Word®, I save the file in .PDF format and I then re-open it in Adobe Illustrator®.</p>
    <p><strong>Softwares</strong>:<br>
    	•&nbsp;Adobe® CS5 (Illustrator,...)<br>
    	•&nbsp;MS Office® 2011<br>
    	•&nbsp;Mac OS 10.6.8</p>
    <p><strong>Question</strong>:<br>
    Is there an easier, faster and more reliable method to extract such "exotic" text?<br>
    e.g. a plug-in, another software, another method (instead of having to pass through MS Word®, ...)</p>
    <p>Thank you for your precious help.</p>
    <p>- Dimitri</p>
