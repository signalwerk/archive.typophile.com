      <p>Well, there are Middle Eastern and Asian versions of InDesign. I don't see InDesign mentioned in your post anywhere, but I would guess that if you're designing packaging, your art eventually ends up in InDesign, right? If you used one of these versions, ideally — I can't promise this — you should be able to copy the text from a PDF and paste it correctly without needing to go through Word, Illustrator, or anything else.</p>
      <p>I haven't done this myself, though, so someone correct me if I'm wrong.</p>
