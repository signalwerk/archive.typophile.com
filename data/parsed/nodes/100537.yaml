      <p>One of your problems is probably that MS Word for Mac has never supported Arabic/Hebrew, so you should definitely avoid that.  OpenOffice will normally work better. But I would agree with Joshua you should try the ME version of Adobe CS.</p>
      <p>PDF format is also unfortunately not reliable for copy/paste of non-Latin scripts because sometimes the way it gets created results in garbage internal coding.</p>
