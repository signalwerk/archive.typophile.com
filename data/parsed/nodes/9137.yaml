  html: '<p>---------------------------------- <br><a href="http://www.typofonderie.com/gazette/hot_news/?id=214" target="_blank">http://www.typofonderie.com/gazette/hot_news/?id=214</a> <br><a href="http://www.typofonderie.com/profile/profiletg" target="_blank">http://www.typofonderie.com/profile/profiletg</a> <br> <br>We are happy to announce that Tom Grace has joined <br>Porchez Typofonderie to work as type designer. Tom will <br>work on current custom fonts projects, his notable first job <br>is the completion the House of Dereon typeface family. <br>In addition, we will finally be able to finish some conversion <br>of our library to OpenType this year. <br> <br> <br>---------------------------------- <br>Porchez Typofonderie: <br>Founded in 1994, Porchez Typofonderie is an independent <br> digital type foundry in France, designing, manufacturing <br>and selling high quality typefaces for adventurous digital <br>typographers. This is the only place in the world to buy our <br>typefaces. <a href="http://www.typofonderie.com/profile/" target="_blank">http://www.typofonderie.com/profile/</a> <br> <br>Porchez Typofonderie <br><a href="http://www.typofonderie.com/" target="_blank">http://www.typofonderie.com/</a> <br>Buy and download your PTF fonts safely. <br> <br>14 rue Paul Bert <br>92240 Malakoff, France <br>33 (0) 146 542 692 Telephone <br>33 (0) 146 540 464 Fax</p>'
