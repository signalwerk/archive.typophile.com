    date: 2005-10-20T00:18:00
    votes: null
    html: <p>While I know there's a certain disdain, likely warranted, for web design/development, I'm always surprised by designers'/typographers' aversion to code. When I was first learning HTML, way back in 1997, the only route was to look at others' code and stare at it until the patterns emerged, and then to write a whole pile of it until something, anything, worked (in at least one browser on one platform, for starters). After many, many nights sitting up late and training my fingers to hit the angle-bracket keys it started to make sense. That process is the same one I go through every time I start a new book project, except instead of staring at code, I'm staring at a blank document in InDesign (or a blank sheet of paper). Format, text measure, margins, proportion, type size, leading, all of these are code, all the points and picas and glyphs; it's a matter of deciphering the blank space and finding the code to make it sing. This is what I meant by a missed opportunity. You hate code, fine. But in returning to it and grinding out a site, in going through that process, you're likely to bring something new to your book work. I'm excited these days by these kinds of challenges, even when they suck intensely in the moment. I know they're going to pay off, because the process is the payoff. All I'm suggesting is that you get away from ImageReady and dive in there. Carve out a means of presenting your work on-line by exploring the process of presenting your work on-line.</p>
