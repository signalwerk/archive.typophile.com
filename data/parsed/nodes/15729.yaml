    <p>I avoided creating webpages with zeal, but something (ok, a freelancing dry spell) inspired me to swallow my fears and put up an electronic portfolio. I'm primarily a book designer, and the concept of designing text for a screen gives me instantaneous hives. Anyway, what do you ladies and gents think of it. The website itself is very simple, most of the content is in the pdf portfolio.</p>
    <p><a href="http://www.garyrobbins.net" title="http://www.garyrobbins.net">http://www.garyrobbins.net</a></p>
