    html: |-
      <p>While I understand completely your reluctance to work with HTML, it seems to me you're missing an opportunity. Book design is all details work, each book brining with it a variety of challenges and leaps of understated risk, and so is web work. Every project has limitations: small budget, letterpress and so few type choices, stock, binding, etc. Same with web. And it seems to me you're cheating a bit. If you're going to go online, you should either produce or have produced for you something that speaks to your work and abilities. I guess what I'm saying is that an attempt to make HTML work seems important. One big graphic sliced up with a couple of links tacked on ain't no web page, and a glance at your code proves it. I don't mean to be a jerk here, but extending the edges of your graphic (for example) isn't really the issue. The issue (in this case) is integrating your graphic into the web page so that there is no distinction between the graphic and the background, regardless of how big or hi-res the viewer's monitor is. That same issue, I think, extends to the site as a whole.</p>
      <p>All that aside, you've got some great work in the portfolio. I just think the site should reflect and exemplify that work, not just provide a link to it.</p>
