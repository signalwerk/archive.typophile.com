      <p>Sorry for butting in late to the discussion. </p>
      <p>I don't think the original design is entirely HTML un-friendly. It even seems to have the navigation built into it with the skills listed on the wooden board. </p>
      <p>If I were to approach this, I would set out the content in a very simple HTML document (with no tables!):</p>
      <p>&lt;div id="content"&gt;</p>
      <p>&lt;h1 id="name"&gt;Gary Robbins&lt;/h1&gt;</p>
      <p>&lt;ul id="menu"&gt;<br>
      &lt;li id="gd"&gt;&lt;a href-"#"&gt;Graphic Design&lt;/a&gt;&lt;/li&gt;<br>
      &lt;li id="bd"&gt;&lt;a href-"#"&gt;Book Design&lt;/a&gt;&lt;/li&gt;<br>
      &lt;li id="bb"&gt;&lt;a href-"#"&gt;Bookbinding&lt;/a&gt;&lt;/li&gt;<br>
      &lt;/ul&gt;</p>
      <p>&lt;p id="dowload"&gt;Please download: &lt;a href-"#"&gt;Portfolio&lt;/a&gt; &lt;a href-"#"&gt;Resume&lt;/a&gt;</p>
      <p>&lt;/div&gt;</p>
      <p>Then with CSS I would put your image as the background image of the 'content' div and position the other elements over the appropriate parts of the image. Then I would hide the HTML elements so the links are still in the correct place and Google can read it all. Which should bring us back to where we started but with an accessible site.</p>
      <p>Oh, and I'd center the content div and add a background image to fill the white space if that is what was wanted.</p>
      <p>Err, anyway, I've probably gone on too much now anyway, I just wanted to point out that the HTML itself can be really simple if it isn't muddied with tables.</p>
      <p>I hope that is some help,</p>
      <p>Cheers,</p>
      <p>Ed.</p>
