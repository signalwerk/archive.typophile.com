      <p>Your portfolio is great! I especially like your "What is Activism?" poster. Parson Products seems like something fun to flip through. I like the 2 books in 1 type thing. </p>
      <p>I agree that there should be more on the site itself. Like edeverett suggested the list on the board is a very logical point to insert navigation. In fact, I thought that was the navigation. I was dissapointed when I found out there were no other links. </p>
      <p>I say you should take the idea/presentation of your portfolio and translate it to the web. I'd take the wooden background and make it the background for your site and learn how to make a div tag in css for the description. Even if you just have one sample link/image in each of the categories it would be better.   </p>
      <p>That may seem daunting but there are plenty of resources to help you. </p>
      <p>Check out:<br>
      w3c.org<br>
      csszengarden.org<br>
      oswd.org</p>
