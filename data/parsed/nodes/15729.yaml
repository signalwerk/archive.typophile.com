    date: 2005-10-19T16:28:00
    votes: null
    html: <p>I understand what you're saying, and its exactly what was keeping me away from html in the first place. I knew how to code in college (I went to design school at the height of internet fervor, when it seemed we were taken on weekly field trips to the offices of Razorfish to see what we were working towards--ahem) but I hated every minute of it and promptly forgot it. Its just not for me. I can't afford to hire a web designer who knows how to code. I know that a glance at my code (and by the way, how dare you!) makes me seem an incompetent web designer. I don't want to be hired to do web design anyway. Maybe the issue is that a web portfolio for a book designer is just a bad idea if it will turn people off. I had been sneaking my business cards into the books I designed at bookstores as a means of self promotion but I decided that lacked a certain amount of tact. But please explain further how I've cheated, and how what I've cobbled together isn't, in fact, a web page. Do you have to be a master to play the game?</p>
  - id: 91174
    user_id: 2942
    user_name: ebensorkin
    user_path: null
    user_image: /files/pictures/picture-2942.jpg
    date_raw: 19 Oct 2005 — 5:23pm
    date: 2005-10-19T17:23:00
    votes: null
    html: |-
      <p>I don't think you have to be a master by any means to get 90% of the benefit from a web site. All the razorfish style hoopla aside I think that :</p>
      <p>- Contact info is important. If you have just one page you should perhaps put at least a phone # on it. The first page of a web site is a little like a business card. It aught to meet at least that level of helpfulness.</p>
      <p>- Searchability ( google etc) is important. You can do this better via web pages than PDFs even if google is PDF friendly to a point. </p>
      <p>- Control is important. The web is great because it lets you take ( &amp; offer ) one small small bite of info at a time which means that the visitor can control what &amp; when they get their info. Certainly better than they can in a PDF. So break up your content into relevant parts! </p>
      <p>- Navigation is important. Navigation is the needed complement to breaking up content.</p>
      <p>- Speed is important. PDFs are great but they are data heavy. Letting someone get a taste of your stuff before you make them get the PDF is nicer. Some people will roll their eyes &amp; wonder - 'how big will this be?' Speed gives them a taste -  and as nice as your stuff is they will HAVE to have your PDF.</p>
      <p>I actually think you could make web pages that are nearly identical to your PDF ( visually ) and add in a contact page ( or put that info on the 1st page ) and you would be almost golden. The main task would be to design the navigation so it doesn't interfere. But this is not impossible. Then the last thing would be to deal with your meta tags &amp; descriptions ( different for each page ) and you will be quite well off. 90%!</p>
      <p>Lastly, I think the *content* of your site will quickly make it clear you are not a web designer - so that you can have as nice a site as you want without provoking that worry. And if you get inquiries you can pass them on to your web designer - no?</p>
