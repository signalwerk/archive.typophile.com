    html: |-
      <p>The upper one seems like a font that it's cloned by many known font-forgery companies like Brendel (Liliput), Fantazia Concepts (FZ HAND 6), ImageLine (Abera ttnorm), etc.<br>
      The original is probably <strong>Davys Crappy Writing</strong> by D. Rakowski (1992) but I'm not 100% sure about it.</p>
      <p>------------------<br>
      I found it using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
