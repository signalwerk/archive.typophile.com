    html: |-
      <p>Real pirates, like most criminals, were probably careful to avoid using fonts of any kind, lest they create a paper trail of their activities.</p>
      <p>The pirates depicted in books and movies are based on 19th-Century stories about the pirates who preyed on merchant vessels in the Atlantic and Caribbean in the 17th and early 18th Centuries. My guess is that 19th and 20th-Century publishers used blackletter fonts for the titles of these stories for much the same reason they used them for stories about Robin Hood or the Knights of the Round Table. At least in English-speaking countries, blackletter is often used to cue readers that the story took place a long, long time ago. </p>
      <p>I'd like to think that if Adobe had been around 350 years ago, pirates would have used Photoshop.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/dither_4474.jpg"></div><p></p>
