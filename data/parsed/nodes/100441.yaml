      <p>Herb, I'm beginning to be convinced that pirates themselves did not use blackletter but did use broad nibbed lettering all the same with more formal and exaggerated expressions. Here's a couple of grabs from a Spanish nautical chart of late 17th century...</p>
      <p>...a have little doubt that these notorious captains were well educated and knew a thing or two about expressive penmanship.</p>
      <p>Perhaps it is more likely that if blackletter is to be  strongly associated with pirates it is due to the periodicals of the day such as in my above post, and not used by the captains themselves. But, having looked into this most intriguing matter a little further there was for a brief time a pirate's government formed. Located in the Caribbean it must of had some form of printed material, perhaps even a charter of independence. Whether or not such material used blackletter or even exaggerated swashes as above I would really like to see. </p>
      <p>n.</p>
