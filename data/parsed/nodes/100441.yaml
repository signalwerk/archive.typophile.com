      <p><cite>The fonts used on the maps of the day were of blackletter .</cite></p>
      <p>I doubt that. The maps were either hand-written or (when printed) had the typical wood cut or (later) copperplate style using Latin script. I don't think I have ever seen a sea map using blackletter. Not that it was not done at all, but I doubt that is was typical at that time.</p>
