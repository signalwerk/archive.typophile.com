    html: <p>Quite a few years ago, an illustrator (whose name, alas, I have forgotten) sent me a portfolio that included one of my favorite art-director-and-client cartoons ever. It shows a pirate captain seated at a table surrounded by his pirate crew. Across the table, a man is holding up a picture of a skull and crossbones. In the caption, the pirate captain says, "Sure, it's a nice bold graphic, but does it really say 'piracy'?"</p>
