    <p>’<a href="https://web.archive.org/web/20080906124952/http://www.latinotype.com/espanol/fonts/CadenaBlack/index.html" target="_blank">Cadena</a>’ is a lovely new type family, currently in progress, by Miguel Hernández <em>(<a href="https://web.archive.org/web/20080906124952/http://www.latinotype.com/" target="_blank">Latinotype</a>)</em>. A specially offered prelease of ’Cadena <em>(Black)</em>’ is available through <a href="https://web.archive.org/web/20080906124952/http://www.flickr.com/photos/miguel_hernandez/" target="_blank">Miguel’s Flickr page</a>, for only $5, to support the further development of the entire ’Cadena’ range. A highly recommended purchase. ;)</p>
