      <p>I'm sure that they look the way they do because older ones, at least, only supported bitmap fonts. That would suggest that it's not TTF or OTF. That said, there may be modern cash registers that are more powerful.</p>
      <p>You could probably call a cash register company if you don't get an answer here.</p>
