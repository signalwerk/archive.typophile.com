    html: "<p>JF: pretty nice. <br>Question: how do you get multiple designers to work on one font? Collaborative type design has always seemed tricky - do you separate the tasks, or the glyphs, or what? <br> <br>Addison: If you're worried about duplicating the work of JF's students (although it doesn't seem finished - not that that should have been the point of the class), you might consider making your version more idiosyncratic (either by replicating the funkiness in the original Rosart fonts or maybe even by putting in your own). Another option though would be to make a \"clean\" font but <i>inspired</i> by Rosart, instead of a revival. <br> <br>hhp <br></p>"
    html_clean: "<p>JF: pretty nice. <br>Question: how do you get multiple designers to work on one font? Collaborative type design has always seemed tricky - do you separate the tasks, or the glyphs, or what? <br> <br>Addison: If you're worried about duplicating the work of JF's students (although it doesn't seem finished - not that that should have been the point of the class), you might consider making your version more idiosyncratic (either by replicating the funkiness in the original Rosart fonts or maybe even by putting in your own). Another option though would be to make a \"clean\" font but <i>inspired</i> by Rosart, instead of a revival. <br> <br>hhp <br></p>"
