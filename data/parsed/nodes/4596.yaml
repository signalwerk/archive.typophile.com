    html: <p>Nice illustration, Juan, I understand what you mean. I guess I'm still developing that sense of balance between the letterforms and the spaces between the letterforms. I don't use measurements all that much, perhaps I should... <br> <br>Hrant, I've made a note to remind you about the Fleischmann specimen. I can't believe you can get an Enschede specimen from a library--the bookstores here (Mississippi) don't know what a type specimen is... but we have the blues. Anyway... <br> <br>I need to get that Carter book, I'd like to see the V&amp;A font as well. <br> <br>Eduardo, the spacing was done in the layout (actually slapped together) so it doesn't really reflect the sidebearings. The sidebearings really haven't been set yet--I still haven't finished all the letters. So maybe the spacing would solve the problem (or help)? <br> <br>Thanks, <br>Addison</p>
