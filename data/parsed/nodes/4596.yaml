    html: <p>I'll be brave here and voice my opinion. (Gulp!) In this case, I like the broad letters--they have a bold, stately appearance that you couldn't knock over if you tried. In fact, that may have been one of the initial elements that appealed to me. Their forms and thick/thin relationships make them elegant. (I'm talking about the letters from the book, not mine.) <br> <br>In fact, I don't see this type being used for setting sentences or paragraphs. Titling may not be the right word, but I had assumed its purpose was for setting titles, two or three words and such.</p>
