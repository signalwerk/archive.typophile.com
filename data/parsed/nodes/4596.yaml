    date_raw: 6 May 2004 — 6:00am
    votes: null
    html: <p>About the width of capitals, I believe that for a titling face there is often more variation in width than in caps made with an eye to lower case. Personally, I think it is more elegant to have not uniformity in wide or narrow, but the variation, such as in Forum caps or Zapf's Michelangelo titling face.  <br> <br>I suspect that small caps may often work better for titling because they are designed and spaced for all caps setting, as opposed to regular caps, which are done with an eye to the harmony with the lower case. I am just guessing, and I'd be interested in hearing from those knowledgeable about this.   <br> <br>Jonathan Hoefler discusses the tension between the two goals for caps in an interesting interview at daidala.com.  <br></p>
