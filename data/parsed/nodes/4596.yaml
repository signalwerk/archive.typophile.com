  html: "<p>Earlier this year, I picked up a book in New Orleans containing two Greek plays: <i>The Frogs</i> and <i>The Birds</i>. The former is set Fleischmann with a great all caps display type. The following is based on (not exactly) those letters. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/35103.gif\" alt=\"Frogs sample\"> <br> <br>I am looking to create a titling font with the fine lines of Bodoni or Didot, but more Baroque in flavor. I suppose the actual types could be a display version of Fleischmann. I'll post the printed sample when I get a chance. <br> <br>Thanks, <br>Addison</p>"
  html_clean: "<p>Earlier this year, I picked up a book in New Orleans containing two Greek plays: <i>The Frogs</i> and <i>The Birds</i>. The former is set Fleischmann with a great all caps display type. The following is based on (not exactly) those letters. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/35103.gif\" alt=\"Frogs sample\"> <br> <br>I am looking to create a titling font with the fine lines of Bodoni or Didot, but more Baroque in flavor. I suppose the actual types could be a display version of Fleischmann. I'll post the printed sample when I get a chance. <br> <br>Thanks, <br>Addison</p>"
