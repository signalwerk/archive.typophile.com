    html: <p>You may find Zapf’s Palatino interesting. The original metal cut was actually quite lively and there’s an incomplete digitalization (look for Palatino BQ). Then along came Linotype, digitalized Palatino and it seems that ever since we’re stuck with a somewhat flat and limp version of the original metal cut. Sad, really... Not sure if this helps but it’s a nice illustration…</p>
