    html: |-
      <p>Maybe this will help.<br>
      I use a digital microscope for imaging those small specimens; for larger type such as 18 point and above I use an 8mp digital camera in Macro mode. Then I do post-processing in Photoshop to achieve what I want to work with.<br>
      I also only use specimens printed from original metal (hopefully not too worn) but none that have been reproduced by offset printing.</p>
