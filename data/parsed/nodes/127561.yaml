    html: |-
      <p>I'm writing a little article about the History of an old typography foundry. I found some old type specimens scattered around the world and I paid for their digitalization. However, these scans are almost always of insufficient resolution for the study of typefaces, mainly printed in small size (below 10pt). I wonder if anyone has thought about this problem and what solutions it has found.</p>
      <p>Thank you<br>
      António</p>
