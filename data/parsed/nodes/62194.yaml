    <p>Greater Albion have just released a set of travel poster images in their <a class="freelinking external" href="http://gatf.wordpress.com/gallery/golden-age-of-travel/ " rel="nofollow"> gallery</a>.  The poster designs all back to a time when travel was all about the fun and experience of seeing a simpler, uncomplicated world.  They also showcase our <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/brossard/ " rel="nofollow"> Brossard</a> family, a design with strong European influences, grounded in the 1920s and 30s.</p>
    <p>Here's a sample image:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Paris_5797.png"></div><p></p>
