    html: |-
      <p>I did a bunch of searching for school scripts and other handwriting. The most similar ones I found were Monotype's <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/school-script/" rel="nofollow">School Script</a> and <a class="freelinking external" href="http://new.myfonts.com/fonts/aviation/tenison/" rel="nofollow">Tension</a> by Nicholas Garner. The latter would need to be bolded to look closer, but many of the letterforms seemed close, although better formed than your sample.</p>
      <p>Dafont was not much help. This font connects rather well, and I suspect it is a commercial font from a small independent source.</p>
      <p>- Mike Yanega</p>
