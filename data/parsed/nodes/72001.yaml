    html: |-
      <p>Compared to the other shirts, the England jerseys are the best looking by far!<br>
      The Puma font looks way too busy and strange, especially when set in lower case only (never understodd why some teams seem to prefer lc only).<br>
      And the adidas font’s just terrible, you can’t really tell the difference between certain letters (e.g. /A/ and /R/) during the match when in motion. Every insight about readability and legibility is sacrificed to a perceived fancy look.</p>
