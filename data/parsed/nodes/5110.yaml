  html: <p>I would appreciate any help locating the font used in the weber logo. It can be found in the upper left corner on <a href="http://www.weber.com" target="_blank">www.weber.com</a>.  I have searched relentlessly and have had no success, I have found similiarities in the font Modula Regular. The spurs are somewhat similiar but the e is a little different. <br> <br>Thanks in advance for your help!</p>
  html_clean: <p>I would appreciate any help locating the font used in the weber logo. It can be found in the upper left corner on <a href="http://www.weber.com" target="_blank" class="link-external">www.weber.com</a>.  I have searched relentlessly and have had no success, I have found similiarities in the font Modula Regular. The spurs are somewhat similiar but the e is a little different. <br> <br>Thanks in advance for your help!</p>
