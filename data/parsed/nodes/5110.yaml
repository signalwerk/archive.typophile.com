    html: <p>This is almost definetely a custom designed logo which may have started life as something like <a href="http://www.myfonts.com/fonts/ef/compacta/ef-light/testdrive.html?s=weber&amp;p=72" target="_blank">compacta</a> or swiss 911 with modifications to the w and b. You may also want to check out <a href="http://www.myfonts.com/fonts/bitstream/aurora/condensed/testdrive.html?s=weber&amp;p=72" target="_blank">aurora condensed</a> for something similar.  Or they may simply have drawn it from scratch. Either way, I think they've modified their earlier logo and simply added little serifs.  <br> <br>Here's their original and modified logos. These larger images may also help someone else suggest something. I hope this helps <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><img src="http://www.typophile.com/forums/messages/83/37669.jpg" alt=""><img src="http://www.typophile.com/forums/messages/83/37670.jpg" alt=""></p>
