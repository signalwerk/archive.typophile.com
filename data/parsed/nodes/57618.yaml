    html: |-
      <p>I believe you need to create OpenType feature code to access these. Somewhere on this site there is a page on language and script features. I can't seem to find it at the moment, but I'm sure someone here can help with that. If you generated it as a Postscript font instead of an OpenType font, then you have limited it to the first 256 characters(the ones with the yellow bands at the top).</p>
      <p>Hopefully someone else will add some more useful information to this for you.</p>
