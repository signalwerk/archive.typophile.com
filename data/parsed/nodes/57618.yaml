      <p>If you merely *named* your glyphs with the numbers, then that is not sufficient. You must actually assign these numbers as Unicode values for your glyphs. Then I believe they will work.</p>
      <p><img src="/sites/default/files/old-images/u0401-prop_4784.png"></p>
