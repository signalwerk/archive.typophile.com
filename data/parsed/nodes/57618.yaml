  html: |-
    <p>Hello -</p>
    <p>Someone ask me to add some extra cyrillic and hebrew characters in one of my typeface (I made).<br>
    The person sent me a table with the OTF numbers.<br>
    After this I opened the font in FontLab® and create the extra characters with the OTF number reference (see attachment).</p>
    <p>But it seems that the person can't see those extra characters.</p>
    <p>Question:<br>
    -----------------<br>
    Where/how can I create special character (at the CORRECT place, means that will works correctly)?<br>
    Thank you, have a nice day…</p>
    <p>- Dimitri</p>
