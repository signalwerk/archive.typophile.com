    html: |-
      <p>I'm a fresh out of college designer. I landed my first job working at a new magazine in NYC. I accepted a full time position as a designer for $15/hr. I later realized there are absolutely no benefits included, and I'm paid on an hourly wage rather than a 40 hr work week because we are not needed to work everyday. There is a slew of other freelance designers that come every few days. One designer with nearly a decade of experience was being paid $25/hr while another with only a couple years more experience than me is being paid $30/hr. After realizing my position is financially no different than those of the freelance designers I requested being changed to a freelance position. However they agreed and want to continue paying me $15/hr for the work. </p>
      <p>Editorial design understandably does pay less than that of ad agencies. However, I think $15/hr even for a start out designer is ridiculously low in this market, especially in NYC. Any advice?</p>
