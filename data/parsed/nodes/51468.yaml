    html: |-
      <p><cite>All that said...$15? In NYC!?</cite></p>
      <p>Keep in mind that there is a glut of designers in New York. That keeps down prices, especially in this bad economy. There are too many design schools graduating too many students and too many of them have wealthy parents who can support them after college. And too many of those design students graduate without the high-tech skills they need to get a job because they spent their time in school focusing on conceptual fundamentals instead of keeping up-to-date with web trends. So some entry-level design jobs here can pay under $30,000 with <em>no</em> benefits. And low-end freelance work sometimes goes for $15/hour or less if the client is a small publisher or fashion house with its own budget problems.</p>
