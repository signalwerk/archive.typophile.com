    <p>Dear Forum<br>
    this is my first post here!</p>
    <p>I have a little question: I’m currently creating a font which contains 3 different widths for each character.<br>
    Imagine condensed, normal, extended.</p>
    <p>Is it, and how, possible to let the typeface itself change, or say randomly pick, one of these 3 possible widths while i’m typing it in inDesign? In heard that some handwriting typefaces apply such glyph-exchange-techniques to not let the typeface appear to stiff in a larger text.</p>
    <p>Any help or further reading is very much appreciated!<br>
    best wishes<br>
    Johannes</p>
