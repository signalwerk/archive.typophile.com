    <p>G-Type is Nick Cooke's Foundry</p>
    <p>Nick Cooke started his typographic journey as a lettering artist, in London, in 1982, crafting type by hand for book jackets. Working with David Cox (the great nephew of Eric Gill) was for him an apprenticeship into acquiring an appreciation of letterforms and proportions.</p>
    <p>Involved in the digital type eversince computers made it to the mainline, he began to experiment with designing complete typefaces using Fontographer. His first type family ’Penguin’, developed while working for Prima magazine, was accepted by Fontshop International in 1995. His second type family, an one-off script font ’ITC Dartangnon’ was produced in a similar manner at his next place of employment.</p>
    <p>His independent career started soon after, as Fontworks UK started comissioning him custom typefaces for their clients. Later on, following his suggestion, they were more than happy to market his proprietary designs under the G-Type Foundry name. So, he started the G-Type foundry in 1999 to develop innovative and original - but most importantly, usable typefaces.</p>
    <p>Nick Cooke is still doing comissioned work for Fontworks UK as well as custom type and lettering for his own clients.</p>
    <p>Creation Dates:</p>
    <p>FF Penguin - 1995<br>
    ITC Dartangnon - 1998</p>
    <p>G-Type fonts<br>
    Geetype - 1999<br>
    Gizmo - 1999<br>
    Houschka Family - 1999<br>
    Nubian Family - 1999<br>
    Digitalis - 2000<br>
    Accent Graphic Family - 2001<br>
    Precious Sans - 2001<br>
    Precious Serif - 2002<br>
    Amulet- 2002<br>
    Chevin - 2003<br>
    Sovereign Family - 2004</p>
    <p>Custom work<br>
    Vauxhall (UK) type family<br>
    Which? magazine type family Serif and Sans (Consumers’ Association, UK)<br>
    RAC typeface</p>
    <p>We can see G-Type fonts used in:<br>
    - national newspapers (Mail on Sunday)<br>
    - magazines (New Woman, Garden Answers, Cycling Weekly, Test Drive, F1 Racing, Brazilian Cosmopolitan, Home Entertainment)<br>
    - album sleeves (Peter Gabriel)<br>
    - supermarket signage (Tesco)<br>
    - corporate identity programmes (Royal Mail, SKF)<br>
    - branding (Scottish Power, Cadbury-Schweppes, Birmingham Selfridges)<br>
    - packaging (Marks &amp; Spencer chocolate bars, Jockey shorts, Pretty Polly)<br>
    - advertising (MacDonalds, Thameslink trains)<br>
    - TV ads (Lynx deodourant).</p>
    <p>This wide usage of his typefaces by major UK clients in publishing, retail, and branding is a testament to their versatility and quality.</p>
