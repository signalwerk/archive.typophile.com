      <p>I know what you mean about the density not being constant hrant - for the use of the font it wasn't possible to resize the dots, but rather to reduce and rearrange them for each size - so I have to live with the darker smaller sizes.</p>
      <p>I made a few adjustments circled in red. Fixed some of the S's and other letters, haven't touched the W's - not sure whats wrong with them.<br>
