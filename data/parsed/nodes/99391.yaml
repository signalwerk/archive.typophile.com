    <p>This is my first font.<br>
    It is an optical sizing font with 6 masters. The reason for this is the dots do not change size but multiply with sizing up.</p>
    <p>It is 6 individual sizes from 80pt to 180pt, with 20pt intervals. The lettershapes are based on railway thin, with some variation here and there.</p>
    <p>Some of the letters look a bit odd/ugly to me (the A, the Q, the B and P) I’m really after help mostly with the kerning  (but please feel free to comment on any aspect)</p>
    <p>Looking forward to some feedback. Thanks.</p>
    <p><a href="http://www.filedropper.com/pinpointstest" rel="nofollow"><img src="http://www.filedropper.com/download_button.png" width="127" height="145" border="0"></a>  <a href="http://www.filedropper.com" rel="nofollow">file upload storage</a></p>
