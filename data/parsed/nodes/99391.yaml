      <p>Nicer than I expected actually.</p>
      <p>To me two things jump out:<br>
      - The density is not constant (smaller = darker). This is usually avoided.<br>
      - You typically need more sizes on the smaller end - not equal steps.</p>
      <p>In terms of letterforms I think only the "W" is unhappy. And the "S" is leaning backwards.</p>
      <p>hhp</p>
