    <p>I have just been reading a book called About Face and in the description of sans serif it says "The first sans serifs, characterised (like Flat Face before them) by absence of serifs..." I was just wondering what a flat face was? Would they technically be the first sans serif typefaces even before caslon's sans?</p>
    <p>I tried googleing didn't go so well and search appears to be broken</p>
    <p>any links or info would be greatly appriciated, thanks</p>
