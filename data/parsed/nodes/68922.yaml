      <p>That's a typographic error and mis-spelling.<br>
      Fat Faces were a genre of ultra-heavy serifed type designs introduced in the early 19th century, arguably the first of the new commercial (job-printing for businesses) styles that evolved to meet marketing needs, rather than those of book-publishing.</p>
