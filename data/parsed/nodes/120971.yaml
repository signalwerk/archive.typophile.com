    html: |-
      <p>The curved serifs do add a nice touch—definitely an artifact of the phototypesetting process, and one sadly not easily replicated via type on a curve these days.</p>
      <p>Looks an awful lot like Modern No. 20, originally released by Stephenson Blake in 1905. Ed Benguiat's digital version came out in 1990:</p>
      <p><a href="http://www.myfonts.com/fonts/bitstream/modern-no-20/" title="http://www.myfonts.com/fonts/bitstream/modern-no-20/">http://www.myfonts.com/fonts/bitstream/modern-no-20/</a></p>
