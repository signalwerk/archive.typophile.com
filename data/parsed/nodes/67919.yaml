    html: |-
      <p>It's worth noting that the typography properties themselves are at a higher level than the OTL features, i.e. the latter represent one possible way of implementing a CSS3 typography property; the same property could also be implemented with equivalent e.g. AAT or Graphite features.</p>
      <p>I note that there doesn't seem to be support for caps as smallcaps (OTL=c2sc), which is a problem. This is probably a distinction that needs to be made at the caps-value level. [The same is true for caps as petite-caps, of course.]</p>
