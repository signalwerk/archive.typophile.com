      <p>Yes, the CSS properties merely correspond to OpenType. They could correspond to other implementations. In practice, will they, though?</p>
      <p>Now, since I’m one of those people who does <em>not</em> sit down to read the OpenType specification over coffee, which is odd because I have done exactly that with many other specifications, do please explain, John, if <code>c2sc</code> means “every single letter becomes small caps, whether originally capitalized or not.”</p>
