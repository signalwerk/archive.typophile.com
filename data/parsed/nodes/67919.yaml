    <p>Nobody else seems to have posted this, so I will: The current <a href="http://dev.w3.org/csswg/css3-fonts/" title="CSS3 Fonts Module" rel="nofollow">CSS3 Fonts Module</a> provides a syntax to use CSS to declare use of a few dozen OpenType properties. If I have the list correct, they are:</p>
    <ol>
    <li><code>afrc</code></li>
    <li><code>calt</code>, <code>clig</code></li>
    <li><code>calt</code>, <code>clig</code></li>
    <li><code>cswh </code></li>
    <li><code>dlig</code></li>
    <li><code>dlig</code></li>
    <li><code>frac</code></li>
    <li><code>fwid</code></li>
    <li><code>hist</code></li>
    <li><code>hlig</code></li>
    <li><code>hlig</code></li>
    <li><code>hojo</code></li>
    <li><code>jp04</code></li>
    <li><code>jp78</code></li>
    <li><code>jp83</code></li>
    <li><code>jp90</code></li>
    <li><code>liga</code></li>
    <li><code>liga</code></li>
    <li><code>lnum</code></li>
    <li><code>nalt </code></li>
    <li><code>nlck</code></li>
    <li><code>onum</code></li>
    <li><code>ornm </code></li>
    <li><code>pcap</code></li>
    <li><code>pnum</code></li>
    <li><code>pwid</code></li>
    <li><code>ruby</code></li>
    <li><code>salt </code></li>
    <li><code>smcp</code></li>
    <li><code>smpl</code></li>
    <li><code>ss</code></li>
    <li><code>swsh </code></li>
    <li><code>titl</code></li>
    <li><code>tnam</code></li>
    <li><code>tnum</code></li>
    <li><code>trad</code></li>
    <li><code>unic</code></li>
    <li><code>zero</code></li>
    </ol>
    <p>Remember: This is merely a proposal. CSS3 has been broken into modules so that that makers of browsers (etc.) can pick and choose which modules to support rather than being offered a package deal of every single CSS feature, which, experience proves, is too much to handle at once. (Hence it is impossible to state that a browser “supports CSS3.”)</p>
    <p>Nonetheless, this is surely a useful development. The <a href="http://dev.w3.org/csswg/css3-fonts/#acknowledgments" title="Acknowledgements" rel="nofollow">acknowledgements</a> on the page will reveal a few Usual Suspects.</p>
