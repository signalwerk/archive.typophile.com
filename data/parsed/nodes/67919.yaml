    html: <p>Joe, c2sc converts uppercase letters (and potentially lining figures and some punctuation) to smallcaps, and smcp converts lowercase letters to smallcaps. Practically, c2sc isn't expected to be applied independently of smcp, so I would expect the CSS3 caps-value to have options similar to InDesign's smallcaps (smcp) and all-to-smallcaps (c2sc+smcp) distinction.</p>
