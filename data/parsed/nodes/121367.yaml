    html: "<p>I don’t know about signage, but I set up all my DTP documents using millimetres: since I start with paper sizes expressed in mm (usually A4, 210×297mm) I find much easier setting a grid (margin, columns, baseline, etc.), it greatly simplifies any calculation involved. The rest is eye ;)</p>"
