      <p>&gt; Does this mean I should use millimetres<br>
      &gt; for everything now?</p>
      <p>I'd assume so, but you should ask the signage contractors.</p>
      <p>Normally text in signage is much larger than in a printed document, so millimeters should work okay. Just design the signage as you wish and then convert the measurements.</p>
