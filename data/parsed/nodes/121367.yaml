    <p>Hi guys</p>
    <p>When printing on paper, I use points spec everything, such as my baseline grids, leading, etc.</p>
    <p>However, now that I'm working on a signage project, the contractors require me to spec everything in millimetres — such as the cap height, margins and so on because it would not make sense for them to measure something that is "4.1574931 mm" or anything like that.</p>
    <p>Does this mean I should use millimetres for everything now? Such as margins, leading, baselines grids? How will it affect the overall aesthetic? Would using millimetres for leading go against any typographic best practices?</p>
    <p>Would be great if anyone could share how they set up their canvas. Any insight would be great! </p>
    <p>Thanks in advance!</p>
