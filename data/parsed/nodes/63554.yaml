    <p>Hello all,<br>
    Are italics acceptable for body copy?<br>
    I generally think they're much better looking than their roman counterparts, as well as being more economical to set, and this sounds like good enough reason to use an italic.<br>
    So, is it acceptable to use them for body copy, and if so, what do you use to indicate book titles and/or quotations? <em>eg</em> In an article in <em>eye Magazine</em>... or On the topic of italic text, Baines (2005, p.196) writes: <em>Italics originated as typefaces in their own right, but modern-day practice</em>...<br>
    Cheers,<br>
    Henry</p>
