      <p>I think what you guys are saying is true on a historical level, but you have to know you are really moving against the grain if you are using italics for large portions of body text. Many studies indicate that readability has to do with training, so for instance even though sans-serifs have a slightly easier definable shape, most people still find serif-fonts faster to read in large quanta. It's like with music and a lot of other things - you don't have to follow all the defined rules, but you have to know that you achieve a certain effect if you break them. If you set body text in italic, you probably will get a certain reaction (either conscious or subconscious) in the readers.</p>
      <p>Of course you will use roman to indicate book titles - as you do in for instance image captions where italic is the "normal" text.</p>
