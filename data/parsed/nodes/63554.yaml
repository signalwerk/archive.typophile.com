      <p>I have to agree with hassebasse, typographic conventions are established regardless of where they historically originated.</p>
      <p>Personally I use the Economist book of style to sort out arguments (you don't have to go by it, but it helps to have a guide, why constantly re-invent the wheel?). When working with an experienced editor, I'm always willing to debate, but in the end these things can be an editorial decision.</p>
      <p>I've just recently been dealing with a case where italics are used, I believe, inappropriately (<a class="freelinking external" href="http://www.garrettreil.ie/about-the-design-research-project.php " rel="nofollow"> on our road signs here in Ireland</a>). One of my arguments against this (beyond the legibility concerns!) is that conventionally italics are used to indicate a foreign language phrase, so using it for our native language demeans it in relation to English.</p>
      <p>Like any rule, it just requires a full and thoughtful understanding, before you set about breaking it. </p>
      <p>Garrett Reil<br>
      <a href="http://raindesign.com" title="http://raindesign.com">http://raindesign.com</a><br>
      <a href="http://garrettreil.ie" title="http://garrettreil.ie">http://garrettreil.ie</a></p>
