      <p><em>"you are really moving against the grain if you are using italics for large portions of body text."</em></p>
      <p>Going against the grain isn't inherently a bad thing! Forbidden is nothing. Make decisions with care, and think about what they imply/cause.<br>
      For instance, from what I understand, italics tend to slow down reading speed. And then of course, they tend to have a different flavor than the Roman, hence giving the text a different tone. Do you want these things? Do you need them? Observe carefully.</p>
      <p>Also: This whole question depends a lot on the design of the Italic at hand. That's one reason why I personally favor somewhat "subdued"/subtly differentiated italics with structures closer to slanted-romans – they're easier to use for stretches of text too if you need that; and when they're well-designed, they work just as well for emphasis. A classically chiro-"swirly" Italic on the other hand, which diverges a lot structurally from its Roman, is a lot less flexible as a companion.</p>
      <p>FWIW, I just designed/typeset a book where one chapter consists of interview-like question/answer paragraphs. The editor insisted on having the questions in italics – and sometimes those are half a page in length. At first I groaned; but choosing the right font fixed it, and it works pretty well now in terms of marking a rather subtle difference in tone.* But I'd say don't do this with a classical Garalde face.</p>
      <p>(* Not a difference in color – I offset that by choosing a slightly heavier weight. Beware that many Italics will be lighter than their Romans, and might be too light for extended text.)</p>
