    <p>This is a student project and I haven't really worked with this kind of type much, so there are issues I'm running into.</p>
    <p>This is for a metal band. Instead of just focusing on the heaviness, I wanted to emphasize the way the band uses epic smooth guitar melodies and harmonies in the music. </p>
    <p>I know there are issues. I'm having trouble resolving them, especially with "The." I'm not sure how exactly to resolve some of these things. </p>
    <p><a href="http://a.yfrog.com/img257/2165/absence3.jpg" title="http://a.yfrog.com/img257/2165/absence3.jpg">http://a.yfrog.com/img257/2165/absence3.jpg</a></p>
    <p>Any critique/ suggestions or anything you think should be changed are greatly appreciated!!!!!!!</p>
