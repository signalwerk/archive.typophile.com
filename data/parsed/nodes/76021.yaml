      <p>After a quick look, I like this logo. It fits with the genre and the name. I found two things that stick out: your "e" on "The" seems to just scaled down from the bigger one, so the inlines are now too thin, so you should fix that. And just make that "T" stem upright,  and fix that flat-looking right-hand swatch, and you're fine.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/absence_5584.png"></div><p></p>
