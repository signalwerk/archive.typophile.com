    html: |-
      <p>Ernst Pöppel has investigated the idea of the “temporal platform” of consciousness as having a two to three second duration. (<em>Mindworks—Time and Conscious Experience</em>)</p>
      <p>He has compared this with the length of phrases in speech, and lines of verse.</p>
      <p>I would take it a step further, and argue that there is a “three-second” quality to the typographic page.</p>
