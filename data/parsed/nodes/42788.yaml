    <p>I thought it would be interesting to typographically represent ’consciousness’. </p>
    <p> Whether it be human consciousness, a baudrillard simulation style consciousness, or perhaps an abstract artists viewpoint.  It is such a vast an interesting subject  Can anyone think of any interesting ideas for typographically representing this?   Or any links to any similar concepts?</p>
    <p>:)</p>
