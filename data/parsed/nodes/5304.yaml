    html: <p>There's a company called Ideazon that's created something called the <a href="http://www.hothardware.com/hh_files/S&amp;V/ideazon_keyboard.shtml">the Zboard</a>, in a practical variation on this idea. It's essentially a keyboard-like base which can accomodate interchangeable faces that use application-specific labels (and even keys). <br> <br>So, you can have a Photoshop keyboard and a Medal of Honor (a videogame) keyboard, etc. The shapes of the buttons themselves also vary, based on what the applications' keyboard usage techniques involve. <br> <br>In its current form, it's not directly related to typesetting, but I'm sure someone could develop an InDesign digital typsetting or  font-specific keyboard face</p>
