    <p>I'm pleased to announce <a class="freelinking external" href="http://www.myfonts.com/foundry/Glyphobet/" rel="nofollow">five new fonts for sale on MyFonts.com</a>:</p>
    <ul>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/glyphobet/anadolu/" rel="nofollow">Anadolu, a bold, fun sans-serif face</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/glyphobet/ljubljana/" rel="nofollow">Ljubljana, a unicase art-deco sans-serif face</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/glyphobet/haylurker/" rel="nofollow">Haylurker, a blackletter/serif face</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/glyphobet/breuckelen/" rel="nofollow">Breuckelen, an experimental broken grid face</a></li>
    <li><a class="freelinking external" href="http://www.myfonts.com/fonts/glyphobet/zenith/" rel="nofollow">Zenith, an experimental face</a></li>
    </ul>
    <p>For the first week, (until March 11th) Typophile readers will get a 20% discount with the code TYPOMAR10.</p>
