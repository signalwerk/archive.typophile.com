    html: |-
      <p>You need to state what text editor you are using. There is no such thing as "GREP" :-) There is a sort of basic functionality, but details in semantics and supported functionality differs wildly among GREP-aware editors.</p>
      <p>Using InDesign's GREP syntax, something like this ought to work: search for</p>
      <p><code>\b([at])\b</code></p>
      <p>and replace with</p>
      <p><code>$1.alt</code></p>
      <p>-- note this will only change the two examples you provided, and "at the same time" as well. Somehow I don't think there is any text editor that allows you to specify a host of strings to change <em>at the same time</em> ...</p>
