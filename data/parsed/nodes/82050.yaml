    html: |-
      <p>To get <code>/a.alt</code>, you need to "escape" the / in the resulting string, i.e. write <code>\/</code>; here is the trace on <code>in.txt</code> with the line <code>a t a t</code>:<br>
      <code><br>
      508 % sed 's/\([at]\)/\/\1.alt/g' in.txt<br>
      /a.alt /t.alt /a.alt /t.alt<br>
      </code></p>
    html_clean: |-
      <p>To get <code>/a.alt</code>, you need to "escape" the / in the resulting string, i.e. write <code>\/</code>; here is the trace on <code>in.txt</code> with the line <code>a t a t</code>:<br>
      <code><br>
      508 % sed 's/\([at]\)/\/\1.alt/g' in.txt<br>
      /a.alt /t.alt /a.alt /t.alt<br>
      </code></p>
