  html: <p>I have a long text document where I'd like to change few characters to a string of text. For example change "a" to "/a.alt" and "t" to "/t.alt". To do this properly, I need to execute the find&amp;replace commands at once. How to do it in a text editor? Can it be done with greps? If so, could you help me with the commands? Is there any MAC text editors that can do multiple f&amp;r commands automatically? I know there are workarounds for this in Fontlab and such, but I really need to do this in a text editor.</p>
