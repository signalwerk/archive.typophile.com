    html: |-
      <p>On the Mac, I use the line command <code>sed</code>. For instance, if the file <code>test</code> contains<br>
      <code><br>
      ccommaaccent<br>
      gcommaaccent<br>
      kcommaaccent<br>
      scommaaccent<br>
      tcommaaccent<br>
      </code></p>
      <p>then here is how one can match all those "one letter" followed by a commaaccent and generate a sub (this is a trace of execution, i.e. a copy-paste of what I get on in my shell window):<br>
      <code><br>
      586 % sed 's/\(.commaaccent\)/sub \1 by \1.alt ;/' test<br>
      sub ccommaaccent by ccommaaccent.alt ;<br>
      sub gcommaaccent by gcommaaccent.alt ;<br>
      sub kcommaaccent by kcommaaccent.alt ;<br>
      sub scommaaccent by scommaaccent.alt ;<br>
      sub tcommaaccent by tcommaaccent.alt ;<br>
      </code></p>
      <p>Also, sed allows scripting. Very handy when many substitutions are to be done.</p>
