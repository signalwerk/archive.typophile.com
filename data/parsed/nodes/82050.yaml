    html: <p>I do this sort of thing with the GREP functionality of Indesign's find &amp; replace tool, which has a GUI for generating some of the regexp.</p>
    html_clean: <p>I do this sort of thing with the GREP functionality of Indesign's find &amp; replace tool, which has a GUI for generating some of the regexp.</p>
