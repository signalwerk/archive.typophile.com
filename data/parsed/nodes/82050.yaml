    html: |-
      <p>Given an input file <code>in.txt</code> containing "a t a t", following Theunis' idea (with the <code>sed</code> syntax).</p>
      <p><code> sed 's/\([at]\)/\1.alt/g' in.txt</code></p>
      <p>gives the output <code>a.alt t.alt a.alt t.alt</code>; here there is just one rule. If there is more than one substitution rule, it gets more tricky; substitutions apply sequentially. Again with the <code>sed</code> syntax, if the letters are alone on their line (in this example blanks are not allowed) then </p>
      <p><code> sed 's/^a$/a.alt/; s/^t$/t.alt/' in2.txt</code> </p>
      <p>will do the job: for the substitution to apply, the rules for a and t specify that a and t must be at the beginning (^) and end ($) of line so that, if the input file <code>in2.txt</code> is</p>
      <p><code>a<br>
      t</code></p>
      <p>the output will be</p>
      <p><code>a.alt<br>
      t.alt</code></p>
    html_clean: |-
