    html: <p>Great! By the way, the pattern <code>\b</code> that matches a word boundary and was used by Theunis above is not available on the Mac sed. If you ever need it or one of the other <a class="freelinking external" href="http://www.gnu.org/software/sed/manual/sed.html#Escapes" rel="nofollow">GNU Sed extensions</a>, you can install <code>gsed</code> from <a class="freelinking external" href="http://www.macports.org/" rel="nofollow">MacPorts</a>, using the line command <code>sudo port install gsed</code>.</p>
