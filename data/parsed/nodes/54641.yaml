    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 10.Feb.2009 3.20pm </div>
      <p>TypeTogether are happy to announce the release of two new font families.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Skolar_4596.jpg"></div><p></p>
    <p>One is the award-winning <a href="http://www.type-together.com/ampl_font.php?idpuente=21">Skolar</a>, by David Březina, a 4 weight family which has been designed specifically for scholarly multilingual publications. Prominent serifs and low-contrast modulation give the typeface a fairly robust character. Its relatively large x-height sets the typeface proportions somewhere between book and newspaper typefaces. The capitals are rather low in comparison to the ascenders to give the typeface even texture and more space for capital diacritical marks. These characteristics were introduced to improve readability in smaller sizes. Additional 2 weights are planned for April 2009.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Alize_6598.gif"></div><p></p>
    <p>The other release is the beautifully poetic <a href="http://www.type-together.com/ampl_font.php?idpuente=20">Alizé</a> by Tom Grace, a three-weight typeface inspired by the chancery italic of the 16th century. It is a high-contrast face, created with syncopations in axes and proportions and subtle irregularities that form a lively and delicate weave, suitable for setting a single word, a special expression, or a short block of prose. The family does not contain a roman, and instead promotes the italic as a primary style, a common printing convention in the 16th and 17th centuries.</p>
    <p>For more information visit <a href="http://www.type-together.com" title="www.type-together.com">www.type-together.com</a>.</p>
