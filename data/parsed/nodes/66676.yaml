    <p>I am looking to find a designer that can design with a style similar to as in this image. Elegant with flourish, vintage, etc. The design work would be for invitations and a logo.</p>
    <p>I am having trouble finding examples of this type of work and designers that design this way. Can anyone help me to understand that design/typography style this is considered? Also, what are some good resources online for finding examples of this style and designers who can do this.</p>
    <p>Thanks.</p>
    <p>Joshua</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image_5133.jpg"></div><p></p>
