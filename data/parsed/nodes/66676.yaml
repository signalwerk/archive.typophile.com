    html: |-
      <ul>
      <li><em>I am looking to find a designer that can design with a style similar to as in this image.</em></li>
      </ul>
      <p>Dear Joshua,</p>
      <p>What you are showing here is the work of <a href="http://www.muccadesign.com/" rel="nofollow">Matteo Bologna</a>, done for the <a href="http://www.balthazarny.com/" rel="nofollow">Balthazar Restaurant</a> in New York City.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Matteo_Bologna_6001.jpg"></div><br>
      <a href="http://thebazaarium.bigcartel.com/category/the-dollar-dreadful-family-library" rel="nofollow">Will Staehle</a> is also <em>very good</em> at Victorian-inspired typography.<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Will_Staehle_5680.jpg"></div><p></p>
      <ul>
      <li><em>Can anyone help me to understand that design/typography style this is considered?</em></li>
      </ul>
      <p>I recommend two good books:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Doug_Clouse_6568.jpg"></div><br>
      and<p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Will_Loy_6073.jpg"></div><br>
      Good luck.<p></p>
