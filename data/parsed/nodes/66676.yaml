      <p>That book is good, I would also check out "New Vintage Type" I think youll find a little more of what you are looking for. </p>
      <p>Some design firms to check out who do this type of work:</p>
      <p><a href="http://www.ptarmak.com" title="www.ptarmak.com">www.ptarmak.com</a><br>
      <a href="http://www.gardnerdesign.com" title="www.gardnerdesign.com">www.gardnerdesign.com</a><br>
      <a href="http://www.muccadesign.com" title="www.muccadesign.com">www.muccadesign.com</a><br>
      <a href="http://www.louisefili.com" title="www.louisefili.com">www.louisefili.com</a></p>
      <p>If you are looking for someone more on a freelance basis to do a specific project for you, I know a few designers who have a knack for this, let me know if that is the case. Just know that type of design can be incredibly time consuming and not cheap.</p>
