      <p>I tried out another letter so see if the monoline -&gt; bubble in a single interpolation was a one-trick pony. It's not exactly right, but it's not terrible either. The middle was a first attempt. The bottom is after tweeking the ultra master. The mid-weights are still not right and I prefer the ultra version in the middle, but it's a decent start.</p>
      <p>If I was going to turn this into a font, I'd probably make the masters the light and black. Then do the doublestuff version on it's own. Too much of a stretch to use the same nodes as the light. Fun to push the limit though.</p>
      <p><img src="/sites/default/files/old-images/ssssss2.gif"></p>
