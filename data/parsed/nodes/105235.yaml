    html: |-
      <p>It would help if there was some information on the origin of these numbers, e.g.  rubber stamps.<br>
      Except for the $ sign, they look similar to house numbers.<br>
      Similar numbers are found in pre-WWI printers specimen books.<br>
      As for digital versions various typewriter fonts have some similarity.<br>
      <a href="http://www.myfonts.com/search/tag:typewriter/fonts/1-50/?sort=mob" rel="nofollow">See list at myfonts</a>, and <a href="http://www.dafont.com/theme.php?cat=113&amp;text=28035&amp;fpp=50" rel="nofollow">see list at dafont</a>.<br>
      Don</p>
