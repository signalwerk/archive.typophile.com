    <p>Drupa 2008: May, 29 to June, 11, 2008 in Duesseldorf, Germany:<br>
    <a href="http://www.drupa.de/cipp/md_drupa/custom/pub/content,lang,2/oid,11265/ticket,g_u_e_s_t/~/print_media_messe_-_drupa.html" title="http://www.drupa.de/cipp/md_drupa/custom/pub/content,lang,2/oid,11265/ticket,g_u_e_s_t/~/print_media_messe_-_drupa.html">http://www.drupa.de/cipp/md_drupa/custom/pub/content,lang,2/oid,11265/ti...</a></p>
    <p>I am born in Duesseldorf - drupa city.<br>
    And since more than 30 years I take the chance to meet guys from our industry.</p>
    <p>Is someone of you visiting drupa 2008?<br>
    Are you interested to visit our lead letter magazine?<br>
    Just let me know - you are welcome.<br>
    Preußisches Bleisatz-Magazine is just 15 minutes from drupa 2008</p>
