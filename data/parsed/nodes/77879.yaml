  html: |-
    <p>Hi,</p>
    <p>I'm looking for fonts with the ampersand rendered ornamentally as the word "and." I've seen this a lot in more retro, poster-style projects, and I'm not sure if this is the font itself, or the alteration/rotation/etc. of a regular font. I am looking for more vintage, poster-type fonts.</p>
    <p>Thanks in advance.</p>
