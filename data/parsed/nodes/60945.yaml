    <p>Hi everyone,</p>
    <p>I'm a graphic design student, and we've currently been given a project to design a restaurant identity. Now, I've chosen quite a complex theme - it's hard to describe - just think "grandma" "cozy cafe" "arts'n'crafts" "vintage/retro". So my idea is focusing somewhat on pretty decorative features but not heavily so. I don't like the tacky flowery crockery idea if you get me!</p>
    <p>Anyway, so after a few concepts, I've come up with this (semi final) logo design, and I want to know what you think. I have had some positive feedback from peers, but I'd like some more harsh and detailed criticm, you know? I've added the full poster image too, so you get more of a taste of the look I'm trying to get.</p>
    <p>I'm only at a rough draft stage, so not much attention to detail has been paid. I want to know if the typeface design is okay, if I should vertically align the text (I have it aligned so that the slopes of the two beginning and end initials align on an angle) or keep it the way I have it, and whether or not the bird even looks ok.</p>
    <p>Thanks for your time :)</p>
    <p>Samantha</p>
