      <p>I think it has a ton of potential and you're surely on the right track. The font matches both the mark and the concept rather well. I like the way the thorns relate to the font, but they're not quite unified yet. Perhaps three refined thorns would be enough?</p>
      <p>There are some technical problems. I suggest you mock up a business card and center the logo in it, then print it at actual size. You expose so much that way! IMO, printing different sizes is a very important exercise in logo development. Logos need to be readable at two inches (or even less) and if the mark becomes a blob when it's small, it's no longer doing it's job. If it needs to be big to show off it's true character, it's just not working, either.</p>
      <p>Lastly, the bird illustration is cute, but it feels kinda clip-arty. See what you can do to make sure it feels unique and stands out from the ... ahh, flock. There are a million ways to draw birds, so look around. A website with tons of unique bird art is: <a href="http://www.weebirdy.com/birdies/" title="http://www.weebirdy.com/birdies/">http://www.weebirdy.com/birdies/</a></p>
      <p>Good luck, and keep us updated with your revisions!</p>
