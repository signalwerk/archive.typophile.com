      <p>I agree with the thorn comment. Maybe a few tight thorns would be better. Less barbed wiry? I'm also not usually a fan of tracked out lowercase letters either. I don't mind them so much here, but did you try playing around with small caps to acheive the same spaced out and light effect? </p>
      <p>In the case of the bird, I agree with the above as well. At small sizes he'll become a blob of indiscernible black. maybe try opening up the tail white a bit and the other whites throughout as well. But yes, this mark is definitely headed down a nice path.</p>
      <p>For your poster, maybe try a dar gray mixed with a touch of color to soften up that harsh black on those soft pink colors. I think it will mesh better and feel truer with your layout</p>
      <p>w|m</p>
