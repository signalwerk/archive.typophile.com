      <p><cite>"there is no essential "this-ness" or "that-ness" in a type"</cite><br>
      …there doesn't <em>need</em> to be, a priori, but types <em>can</em> very well be strongly informed by, and infused with, «this-ness» or «that-ness» given their context.</p>
      <p>I would think that in a Globalized Latin-script context, questions of specific national/cultural influence might become largely negligible, as it's all sort-of washing out and blending together into a transnational mega-context;* but then again, these are the contexts were specifically local/national culture has become less vital or identity-defining overall, also outside of type. But I don't think this can be claimed generally. Think only of Ireland! Also, I would assume that for instance in more marginalized societies / [visual] cultures, local/regional/national visual traditions/specifics have a more crucial role in defining identity, hence are more at the core of people's consciousness, hence designers' consciousness, hence also their output. </p>
      <p>* Although I would still argue there is, for example, something like a specifically «Swiss style» in type design today (not to be confused with the historical Swiss Style), showing in the offerings of say Lineto or Optimo.</p>
