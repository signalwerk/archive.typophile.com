      <p>"...we didn't grow up reading the same books in the same fonts, at school we weren't taught the same things from the same models, when you were perhaps taught Dwiggins I was looking at Frutiger. ..."</p>
      <p>I understand your logic, Nina, but I was taught much more about European typography than American. Granted, it was the heyday of the Swiss/German modernist era when I studied typography. There were several American design schools including mine that were taught mostly by Europeans.  The actual and embarrassing truth is that I had no idea who Dwiggins was untill I went to TypeCon in New York 5 years ago and heard several presentations on Dwiggins from Typophile regulars like Kent Lew and Tiffany (and read her thesis). I was introduced to typography in the college classroom in 1963 by Fred Amery (a Brittish typographer) , Had fleeting conversations with Jack Stauffacher {An American) who ran the schools Laboratory Press; there were two type families only available for text setting as foundry type or Monotype, Baskerville and the entire Univers family; guest lecturers were several times by Herman Zapf. My sophomore year was taught by two Germans from the Ulm School, Gui Bonnsieppe and Martin Krampen.  Junior and senior year were taught by Ken Hiebert, an American who had just come from 8 years of study with Emil Ruder and Armin Hoffman in Basle. Ken  brought in guest lecturers like Wolfgang Weingart and Karl Gerstner. My first job out of Vietnam was at the Westinghouse Corporate Design Center where I worked for Peter Megert, a Swiss designer fresh from Bern who was apprenticed to Mueller-Brockman. In graduate school at OSU, the typography teacher was Willi Kunz and the rest of the design faculty at the time were either trained in Ulm or the Royal College of Art. etc, ...</p>
      <p>Yes, I am an all-american-boy and make no claim to be otherwise but that does not always mean what you might expect. I had better now go back and find out who those American guys were back then.  I do remember something about a Kelscott Press, though :-)</p>
    html_clean: |-
