      <p>Back even in the 1970s (and even 80s), it took some time and a well established foundry for a typeface to even be seen internationally.  Today, we see new fonts released almost hourly from all over the World. We see each others work in progress constantly via internet sites such as this one. International Type design students study together at places like Reading and are taught by people who have names like, Unger Leonidas, Zhukov, Milo, Chahine, and Kobayashi. It is quite clear that now what used to be an international smorgasbord of national styles, has become a well-simmered soup of intermingled flavors of the world.<br>
      Although I am living in America, I am far more likely to be discussing type with people from The Netherlands, Germany, or India than I am with another America. The old national boundaries may still have a bit of meaning in the insane world of politics, religion, and economics but in the type world, we are all just colleagues in the borderless world of the internet.</p>
