      <p>I want to second what Nina stated at the beginning: YES IT CAN ;-) – but it is not inevitably an aspect of every type.</p>
      <p>Just a few random thoughts.</p>
      <p>While type gets globalized like anything else typographic nationalisms get rediscovered and re-estimated as resources of originality and inspiration.</p>
      <p>Compare Gill Sans to Futura (both created at the same time) and you have samples *par excellence* for English and German type flavour.<br>
      Compare ITC Garamond to Stempel Garamond and …</p>
      <p>Nowadays, I feel many many – too many? – new text faces are born and bread Dutch. Not that they were made by Dutch. But many designers seem to prefer a certain dutchness in their type, be it consciously or not.</p>
      <p>And Bodoni might have been Italian.</p>
