    <p>I have recently decided to start working on a typeface reference book. I would like some feedback on how many typeface nationalities (German, Swiss, Dutch, etc.) there are in the world and how/what are the many typeface moods or expressions you think there are. I have looked at several typeface reference books and concluded that organization needs help-this is huge especially when I am trying to decide on a typeface for a design.<br>
    Thanks for your help!</p>
