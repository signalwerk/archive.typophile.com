      <p><cite>"we are all just colleagues in the borderless world of the internet"</cite><br>
      Yes we are. But that doesn't mean we are all influenced by the same things. We don't see the same type treatments every day, we're not exposed to the same kind of æsthetics, our signs look different, our shop lettering, our streets, our graffiti, the fliers in our mailboxes, the ads in our papers, the papers themselves. We don't work from the same historical background, we didn't grow up reading the same books in the same fonts, at school we weren't taught the same things from the same models, when you were perhaps taught Dwiggins I was looking at Frutiger. And so on. I believe these differences, this variety is a thing to cherish and sustain. It saddens me if, upon traveling to a new, excitingly unfamiliar place, I find that their airport signage looks the same as mine, and their road signs feel just like I was back home.<br>
      While it's massively useful, and sometimes enlightening, to be able to harness the possibilities of working (and networking) globally and learning from people in a different cultural context, there still is both beauty and relevance in the local; the context that surrounds us each day, that each of us is rooted in and that is rooted inside us in turn. I don't think these 2 perspectives have to be mutually exclusive.</p>
      <p>(Craig: Thanks for the link!)</p>
