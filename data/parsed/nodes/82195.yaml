  - id: 465213
    user: 45121
    date: 2011-05-19T20:33:00
    date_raw: 19 May 2011 — 8:33pm
    votes: null
    html: |-
      <p>Kent, I like Salvo Serif a lot. There are a good amount of weights but unfortunately it still falls short.</p>
      <p>Trevor, Serifa and Univers is a great font pairing.</p>
      <p>I would love it if there were a slab version of <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100013" rel="nofollow">Knockout</a>. I may ended up going with <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100013" rel="nofollow">Knockout</a> and <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100034" rel="nofollow">Sentinel</a>. Unfortunately Sentinel doesn't have a variety of compressed to entended styles, and Knockout doesn't have italics. I am thinking <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100032" rel="nofollow">Chronicle Text</a>/<a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100031" rel="nofollow">Chronicle Deck and Display</a> when I want to be fancy.</p>
      <p>I am branding a construction company so I think a slab serif fits perfectly. I would like to start with the slab and base my other typefaces around it. I like mixing different styles of typefaces. <a class="freelinking external" href="http://galp.in/" rel="nofollow">Tyler Galpin's website</a> is a good example of what I mean. His site uses the font <a class="freelinking external" href="http://www.houseind.com/fonts/unitedcollection/viewfonts" rel="nofollow">United</a> that I mentioned earlier in this thread.</p>
