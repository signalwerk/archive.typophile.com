    html: <p>I have been looking at a lot of slab serifs and I haven't had any luck finding one with a range of styles. My ideal font would have everything from hairline ultra compressed italic, to extra black entended italic. I have found some with italics, and I have found some with a wide range of styles but without italics. I haven't come across one with both yet. Is there a reason why something like this wouldn't be created? Are there technical limitations? Or does anyone know of anything out there like this that does exist?</p>
