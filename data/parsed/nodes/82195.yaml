      <p>Sorry, but the fact is that slab serifs do not mix easily with either serif or sans faces, lacking sufficient differentiation from either.</p>
      <p>However, if there is a large contrast in weight between the slab type and either the serif or sans face, then it might be OK.</p>
      <p>In the past, typographers would often set the entire job in a slab — e.g. Cheltenham in the 1900s, or Beton/Stymie/Rockwell in the 1930s.</p>
    html_clean: |-
      <p>Sorry, but the fact is that slab serifs do not mix easily with either serif or sans faces, lacking sufficient differentiation from either.</p>
