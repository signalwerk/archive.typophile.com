      <p>Update: <a href="http://www.fontbureau.com/fonts/SalvoSerif" rel="nofollow">Salvo Serif</a> (the font family formerly known as Boomer ;-) has just been released.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/SalvoSerif-styles_4958.png"></div><p></p>
      <p>&nbsp;<br>
      Probably not as many styles as Eric is looking for, but still plenty to work with.</p>
      <p>As seen in <em>AARP, TV Guide,</em> and <em>Outside</em> magazines. Last I checked, <em>AARP</em> was combining with <a href="http://www.typography.com/fonts/font_overview.php?productLineID=100017" rel="nofollow">Mercury Text</a> for body copy, while both <em>TV Guide</em> and <em>Outside</em> match up with <a href="http://www.fontbureau.com/fonts/Quiosco" rel="nofollow">Quiosco</a> for text. Of course, the sans companion in all cases is <a href="http://www.fontbureau.com/fonts/SalvoSans" rel="nofollow">Salvo Sans.</a></p>
