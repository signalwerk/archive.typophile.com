    votes: null
    html: |-
      <p>I think one does indeed need a weight difference to make a slab stand out from a serif (without resorting to a strong clash in style) but those huge serifs certainly make a slab stand apart from a sans! Especially when you consider that stroke contrast difference can also be leveraged (with both slab and sans capable of going either way).</p>
      <p>BTW Cheltenham's serifs (especially printed letterpress, like during the time period you mention) are too adnate for it to be considered a slab. I myself like calling it a "Doric serif" font. :-)  And I don't know about using Beton/Stymie/Rockwell for an entire job, but Cheltenham can certainly handle that with poise... not least because it's not a slab.</p>
      <p>hhp</p>
