    html: |-
      <p>AFAIK, no currently shipping Adobe programs support these (not counting ME versions - these may very well).</p>
      <p>Programming them would be easy in FontLab, though I’m not sure the FDK code used by FontLab supports them either. Version 2.1 will, but that’s not due out until much later this year (2.0 is due soon, though).</p>
      <p>Regards,</p>
      <p>T</p>
