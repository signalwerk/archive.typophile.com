    html: |-
      <p>I've spent some time researching wedding fonts for my job, and the sudtipos fonts mentioned above are definitely some of the best for wedding invitations. Burgues, Adios, and Miss LeGatees can be seen on Bella Figura's letterpress site for inspiration <a class="freelinking external" href="http://www.bellafigura.com/" rel="nofollow">http://www.bellafigura.com/</a> (although the fonts are given different names by Bella Figura)</p>
      <p>Other good script fonts for wedding invites besides the good but overused Bickham Script:<br>
      Novia (Font Bureau)<br>
      Sloop (Font Bureau)<br>
      Tangier (Font Bureau)<br>
      Gravura (myfonts, fontshop)<br>
      Citadel Script (fontshop)<br>
      Memoir (veer)<br>
      Montague Script (veer)<br>
      P22 Zaner<br>
      P22 Allyson<br>
      Plumero Script (veer, fontshop)<br>
      Feel Script (veer)<br>
      Olicana Smooth (veer, fontshop)<br>
      Annabelle (veer)<br>
      Dear Sarah (veer)<br>
      Nelly Script (myfonts)</p>
      <p>For complimentary type (usually set in all caps or small caps), engravers gothic and sackers gothic light go well with most scripts. Also, letterspaced geometric fonts in a lighter weight look good- fonts like Futura, Verlag, Mr. Eaves Modern, or Neutraface No. 2. I've seen some cool minimalist invites using H and FJ's Archer. For serif type, Mrs. Eaves definitely evokes wedding but is not the most original choice. Adobe Garamond capitals look good but are more formal. The trajan alternative called Classic Roman also works well in a wedding invite context.</p>
      <p>Elum also has some cool invites <a class="freelinking external" href="http://www.elumdesigns.com/letterpress/affordable-letterpress-wedding-invitations/15-15/" rel="nofollow">http://www.elumdesigns.com/letterpress/affordable-letterpress-wedding-invitations/15-15/</a></p>
