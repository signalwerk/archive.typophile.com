    <p>Hello,</p>
    <p>I rarely work with script typefaces, which I am trying to do more of, but for now, I am looking for some elegant yet legible script typefaces (and a body copy typeface, too, if you can find a good match of both) for some wedding invitations I am designing.</p>
    <p>I would appreciate any help.</p>
