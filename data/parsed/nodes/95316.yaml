    html: |-
      <p>In the old ASCII-8 encoding there was limited room, and Windows sacrificed "ff", "ffi" and "ffl". In turn, MacOS failed to support the thorn and eth for example (so you couldn't set Icelandic). The worse thing about all that wasn't the missing stuff in each OS, it was that although the bottom half of ASCII-8 (basically ASCII-7) was standardized, the upper wasn't. That might have been because Apple needed to sell itself as being typographically savvy (which it no longer bothers with - now it's all about music and movin' pitcherz) and it saw the fancy ligatures as more important than compatibility.</p>
      <p>hhp</p>
