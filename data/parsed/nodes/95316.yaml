    <p>Hello all.</p>
    <p>For book typography I've used for years and have become intimate w/ Electra, MFB's Bodoni Book, and several other Linotype digitizations.</p>
    <p>Only now getting around to asking (after having excitedly gone to purchase an OT Electra, expecting full ligs to be a part of it), Why on earth do they only feature fi and fl ligatures, whereas their Monotype peers feature full f ligs?</p>
    <p>The ff, ffi, and ffl ligs in the metal Electra are very handsome. I'd love to be able to use them still.</p>
    <p>Any wisdom much appreciated,</p>
    <p>JC</p>
