    html: |-
      <p>I thought there would already be a version with the extra ligatures.</p>
      <p>If you do need to have those added, there are quite a number of people here who could do it for you. Including yours truly. :-)  One thing to work out is the permission to modify Electra. The EULA (licensing agreement) of Monotype -now the owner of Linotype- does not seem to permit it (although we might be able to acquire permission).* There is a work-around however: Adobe happens to sell Linotype Electra, and their EULA <em>does</em> permit modification**... If the copy you have was not purchased from Adobe you might have to buy another copy from them first.</p>
      <p>* See point 9 here:<br>
      <a href="http://www.linotype.com/2061-28225/licenseagreementforfontsoftware.html" title="http://www.linotype.com/2061-28225/licenseagreementforfontsoftware.html">http://www.linotype.com/2061-28225/licenseagreementforfontsoftware.html</a><br>
      There is however a reference to "permitted modifications" in point 13...</p>
      <p>** I once modified Garamond Premier for a client.</p>
      <p>If you'd like to discuss this directly: hpapazian at gmail dot com</p>
      <p>hhp</p>
