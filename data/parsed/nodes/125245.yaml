  html: |-
    <p>Mehr-e-Nastaliq Web is especially developed according to the needs of modern web publishing and mobile applications following the calligraphy of Nasrullah Mehr one of the famous font designer and Internationally awarded calligraphers of Pakistan.</p>
    <p>Mehr-e-Nastaliq Web OTF is first font of Mehr font family, contains approximately 450 glyphs, including symbols and English support. This font allows Urdu computing on all platforms supporting OTF specifications e.g. Microsoft Windows, Unix, Linux, and Android. This font also enables web publishing, and electronic communication in Urdu using existing software (without any plug-ins) supporting OTF specifications, e.g. Google Chrome, Internet Explorer, Netscape Navigator, Mozilla and Safari.</p>
    <p>This font has following features:</p>
    <p>Fast rendering speed as compared to other Nastaliq fonts.<br>
    OTF Font file size is amazingly reduced up to 104 kb only.<br>
    Best look according to National Calligraphic Standards.<br>
    Open Type, character based, Lahori Nastaliq Font.<br>
    Aaraab and marks support.<br>
    Limited Kashida support.<br>
    Reduced line height.</p>
