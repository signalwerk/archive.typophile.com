      <p>Hi Neil,<br>
      and thank you for your response.<br>
      Regarding the spam mess: Sometimes a simple (but not so commonly used) method is more effective that a fancy (captcha etc) one. A simple question on user registration form like "Five and two equals: X" may result in a very good protection, even if the numbers are constant and not changing ;)<br>
      The reason for that is the spammers usually use automated tools which cannot parse generic questions, especially if the question is displayed as an image.<br>
      Even if you can't implement the solution, I hope that you can forward this option to the admins/owners. </p>
      <p>Fivos</p>
