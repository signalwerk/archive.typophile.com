      Maybe they try the words are seeing on other users' profiles.</p>
      <p>Another trick: Introducing a reasonable delay of e.g. 5 secs after any failed registration attempt, it would greatly reduce the success rate of any bot trying to get in with brute force attempts (random strings, etc).</p>
