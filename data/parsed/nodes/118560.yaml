      <p>Recreation seems the most feasible way of doing this. The font has similarities to Futura <a href="http://www.myfonts.com/fonts/linotype/futura/" title="http://www.myfonts.com/fonts/linotype/futura/">http://www.myfonts.com/fonts/linotype/futura/</a> and Twentieth Century <a href="http://www.myfonts.com/fonts/mti/twentieth-century-mt/" title="http://www.myfonts.com/fonts/mti/twentieth-century-mt/">http://www.myfonts.com/fonts/mti/twentieth-century-mt/</a>  Both have close numbers as well as letters. Another good candidate is Geometron -- very good for the letters, skip the numbers.  <a href="https://www.myfonts.com/fonts/marius-mitran/geometron-pro-angular/" title="https://www.myfonts.com/fonts/marius-mitran/geometron-pro-angular/">https://www.myfonts.com/fonts/marius-mitran/geometron-pro-angular/</a>  Any of these three could be modified to replicate the design.<br>
      UPDATE:<br>
      The numbers in Odessa <a href="https://www.myfonts.com/fonts/itc/odessa/" title="https://www.myfonts.com/fonts/itc/odessa/">https://www.myfonts.com/fonts/itc/odessa/</a> are pretty close if you delete the shadow effect.<br>
      Don</p>
