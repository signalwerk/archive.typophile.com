    html: |-
      <p>Hillary: snooz.</p>
      <p>Obama: I love the logo, but I have never liked it when an apostrophe is used in front of shortened dates, words, colloquialisms, etc.</p>
      <p>Edwards: That rising star gimmick would work a lot better if he had not sunk to blatant populism. </p>
      <p>Richardson: Fun type treatment and a cool logo. Nice stuff.</p>
      <p>Dodd: Oh look, pointless letterspacing!</p>
      <p>Biden: Joe, everyone in town already knows about your giant ego. But you still can’t be president.</p>
      <p>Vilsack: I really loved this one. Too bad his campaign tanked.</p>
      <p>Kucinich: Not remotely crazy enough to represent him.</p>
      <p>McCain: Ok, Ok, I get it, you’re a war hero.</p>
      <p>Rudy: Still buying his own post 9/11 hype. </p>
      <p>Romney: So he’s a viper disguised as an eagle? Backed by the USPS? Whatever, it has a vaguely corporate look, and that’s better than most campaigns.</p>
      <p>Huckabee: As much as I get sick of all federal election materials being red, white, and blue, adding yellow was a stupid idea.</p>
      <p>Tommy: That’s right, Townsend and Daltry are back on tour! He’s a pinball wizard...</p>
      <p>Brownback: A design that’s almost as stupid as the candidate.</p>
      <p>Hunter: Guess who hired a design team that only knows how to use Photoshop?</p>
      <p>Tancredo: I think they just re-used the "God Bless America" sticker design that was stuck to every taxi cab and ethnic restaurant in America on 9/12/2001.</p>
      <p>Gilmore: Yeah dude, we know that there’s an election in 08. Maybe if you had hired a decent designer you might not have dropped out already.</p>
      <p>Ron Paul: Conservative and simple, how appropriate. Too bad the kerning sucks.</p>
