    html: |-
      <p>Back when buying music on those shiny discs was a habit of mine, I'd often purchase music based purely on the cover art. I have to say, I was probably batting .700 or so via that method.</p>
      <p>So, based on this...hmm...</p>
      <p>Hilary is bold, iconic but not cliche even though it's using the stars and stripes. I like the fact that it's using her first name. Clever and probably a strategically good move. Type is nothing spectacular but feels very well balanced in relation to the mark.</p>
      <p>Obama has the best logo...it's an actual logo...with a concept...and some cleverness. I might have to give him the lead. But the type is so weak in comparison. </p>
      <p>But wait...Vilsack! Futura! Oh man, Futura...well played! Tempting...</p>
      <p>Rudy...wow...look at the size of his ego.</p>
      <p>McCain...subtle, but clever..."look at me...I was in the military!" (That really should be a plus for him right now...too bad he's been veering out of control for so long).</p>
      <p>Edwards, Richardson, Dodd, Biden, Kucinich, Romney, Huckabee, Thompson, Brownback, Hunter, Tancredo, Gilmore, Paul...*YAWN*...did you guys even try? You couldn't find ONE semi-design savvy intern to help you? Did you all share the same 'stars and stripes' clip art package?</p>
