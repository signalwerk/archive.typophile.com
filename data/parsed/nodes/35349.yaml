      <p>Clinton's and Richardson's look best to me. In average the Democratic ones are way better than the Republic ones.</p>
      <p>Too much symbolic elements in such a logo would only overcloud. Anything that doesn't trigger a reaction instantly is superfluous. However, the logo should at least give some hint that it's about the presidential race -- as opposed to any other arbitrary political race. This is where I think the Republican logos fall short.</p>
