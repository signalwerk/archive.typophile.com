    html: |-
      <p>Scribus has no OpenType support altogether, I've seen promises for years but nothing so far. Inkscape (and any other GTK+ or Qt application) does not support user controllable features, only features that are on by default for a given script. The only remaining option is modern TeX engines, both XeTeX and LuaTeX give you full control, and you can use <a class="freelinking external" href="http://www.ctan.org/pkg/fontspec" rel="nofollow">fontspec</a> package which abstracts the low level stuff and provides a fine, higher level interface to both engines.</p>
      <p>However, Linux distributions are usually a bit behind TeX developments, so I'd recommend installing <a class="freelinking external" href="http://tug.org/texlive/" rel="nofollow">TeXLive</a> and not using distribution supplied packages.</p>
