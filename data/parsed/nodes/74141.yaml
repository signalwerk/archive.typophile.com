  html: |-
    <p>Does anyone know of an application for Linux that lets me use OpenType features? I'm thinking alternate forms, swashes, dicretionary ligatures.</p>
    <p>I would like to migrate from using windows to linux, all the things I do I can do in Inkscape and Scribus, but the OT features would be a nice touch. I'm open to learning TeX or any other piece of software as long as it's usable.</p>
    <p>Thanks</p>
