      <p>Logo, also as in logotype - A whole word on one piece of type. </p>
      <p>The unmemorable name is also off centre.</p>
      <p>further to the irony of the Southwest-in-the-snow,/Romanesque/Industrial Park-style, it's a church with services in two languages: Mandarin and Cantonese, so the Greek reference in the name is probably innocent of the connotations that people like me can't escape. :-)</p>
      <p>-=®=-</p>
