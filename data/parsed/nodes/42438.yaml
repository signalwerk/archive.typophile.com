      <p>Luckily, this usage of "logos" has nothing to do with graphic design, or it would be a bit ironic looking at their nondescript unmemorable name above the entry. Almost as ironic as their Southwest-style building surrounded by huge mounds of snow.</p>
      <p>For anyone wondering what this means, "logos" is the same word in ancient Greek that forms the root of "logic." It means symbol, word, knowledge, etc. Hellenistic thought was very influential on the early Christians, above all the writings of Paul.</p>
