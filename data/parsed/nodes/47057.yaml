    <p>Hi,</p>
    <p>My friend is doing a lower budget, I say this cause its a low budget but its not to look cheap, adventure show where he travels the world. Sort of like Indiana Jones meets a regular travel - see/learn about the locations- type of thing.</p>
    <p>I unfortunately keep relying on my old tried and trues. </p>
    <p>Wondering if anyone had some suggestions that would spark something.</p>
    <p>Thanks in advance!</p>
