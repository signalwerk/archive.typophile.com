    html: <p>Just a note to this. I recently picked up a copy of Specimen de Caracteres of Typographie Firmin-Didot et cie that dates from the early 1920s. The specimen catalog has the Didot and Poetique Didot showings. Interestingly, unlike Anglo-American specimen books the name of the type size precedes the typeface name. While not as caught up with the typographic revival, as typical of Spain and Italy as well during this time period, some really nice vignettes!!!</p>
