    html: <p>What we know as Bodoni, historically followed what the Didot Family did. From what I remember from that lecture (given by James Mosley) Giambattista Bodoni was hired in Parma to create something similar to what was happening in Paris at the time. Some people had left Paris but still wanted to feel a part of what was happening. Even then people were aware of what we call today, trends. <br> <br>(I'd love for this to be fleshed out as I lost my notes)</p>
