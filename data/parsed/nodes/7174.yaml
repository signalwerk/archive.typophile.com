    html: '<p>Tiffany, without looking at any books, what I recall is something like that: <br> <br>Bodoni intentions was to meet Baskerville in England but stopped in Paris due to sikness. Anyway, before this trip his first types were much influenced by Fournier -- then, by Baskerville + Didot, its perhaps why Bodonis types are more flourished and round than the stricts Didots. <br> <br>Anyway, Didot was influenced by Baskerville when Bell, Austin were influenced by Didot! :-) Well, type history is complex. <br> <br>"Didones" is simply Did(ot) + (Bo)doni, like Garaldes is Gara(mond) + Alde. <br> <br>The concept of different style of typefaces probably appeared during the 19th century, period during which Caslon started a second career, Sans and Fat faces appaered and period which, people like Perrin and Jannet started to cut sort of revivals of old faces.</p>'
    html_clean: '<p>Tiffany, without looking at any books, what I recall is something like that: <br> <br>Bodoni intentions was to meet Baskerville in England but stopped in Paris due to sikness. Anyway, before this trip his first types were much influenced by Fournier -- then, by Baskerville + Didot, its perhaps why Bodonis types are more flourished and round than the stricts Didots. <br> <br>Anyway, Didot was influenced by Baskerville when Bell, Austin were influenced by Didot! :-) Well, type history is complex. <br> <br>"Didones" is simply Did(ot) + (Bo)doni, like Garaldes is Gara(mond) + Alde. <br> <br>The concept of different style of typefaces probably appeared during the 19th century, period during which Caslon started a second career, Sans and Fat faces appaered and period which, people like Perrin and Jannet started to cut sort of revivals of old faces.</p>'
