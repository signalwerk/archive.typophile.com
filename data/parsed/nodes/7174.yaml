    html: "<p>What I mean is: the faces which Françoise Didot, Françoise Ambroise Didot, Pierre l’aîné Didot and Firmin Didot cut – what were the original names of their typefaces? Is there a specific face which most resembled what we call ‘Didot’ today?</p>"
