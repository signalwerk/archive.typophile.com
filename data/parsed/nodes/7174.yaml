    html: <p>In old time, a typeface never got a name such we use now. We call Garamond, Bodoni, Baskerville to refer to a particular style ow their creators/designers/cutters. <br> <br>Typefaces used name following their sizes, cut, but it was a generic name not related to the style. <br> <br>So, in a print shop, around 1789 for example in France, the Mignone size can be a Fournier (how we call it now) when the Cicero can be a Garamond (how we call it now). <br> <br>And if you cross the street, and went to another print shop, well, perhaps this one is more up to date, and their you will found for same sizes, some earlier cut of a Didot...</p>
