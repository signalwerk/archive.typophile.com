    html: <p>Rod, in short, I don't know the answer to your question. <br> <br>But, the Didot family cut <b>many</b> typefaces (most of which were probably named by their <i>size</i> instead of their <i>styles,</i> as JFP said above). If you went to a Didot press to have your stuff printed, you got it printed in "their" typefaces. If you went somewhere else (esp. I guess, in Holland), you would get the typefaces that that printer used. I don't think that you could just walk into a printing office in the 1700s and say, "I really dig John Baskerville's types, can you print my book in that instead of Caslon's?" <br> <br>Bodoni in Parma used his own typefaces as well, which appear similar (relatively) to Didot family typefaces. But Giambattista Bodoni's typefaces were not Didot typefaces, and Didot family typefaces were not made by G. Bodoni, even though later historians grouped them all under the heading "Didones." Confusing enough? <br> <br>I'm not sure what Ralph is hinting at. (Can you elaborate, Ralph? Didot-made typefaces were never called Bodoni typefaces while the Didots were alive, as far as I know.)</p>
