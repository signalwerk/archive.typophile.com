    html: <p>I wish I could be more articulate on this, Tiffany, but I can't really explain it clearly. To me there is a kind of 19th century feel to his typefaces, which is not to my taste. <br> <br>It isn't exactly a Classic vs Romantic thing. For example, I love Christian Schwartz's work (Orangeitalic.com), and his stuff is very expressive, like his recent Amplitude. <br> <br>I'm sure Hoefler's work deserves its success, but I must admit it doesn't grab me.  <br> <br> <br> <br>   </p>
