    html: "<p>&gt;&gt; Which means of course that Capitalism opposes cultural progress.  <br> <br>Interesting. <br> <br>I think capitalism is actually highly dependent on cultural progress, because it is partly based on the idea of selling people stuff they either already have in some form (a stylistic or functional upgrade, if you will), that they don't really need (pure luxury) or that satisfies the basic human desires (among them: greed). <br> <br>This wouldn't be possible, if the good ol' wheel were not reinvented and remarketed as a 'brand-new must-have circular motion device' on a regular basis and if the stylistic definition of 'mainstream' didn't undergo a subtle but seismic shift every now and then. <br> <br>So, capitalism needs to at least look as if it's moving forward all of the time, even if it doesn't. It achieves this by using cultural splinter groups as 'idea incubators' on the fringes of the mainstream, testing what might work on a mass scale. If they have something, the mainstream moves to gobble it up, the fringes move elsewhere. <br> <br>The devious achievement of capitalism is in permitting and not repressing this process, a system which feeds off those that oppose it to reinvent itself and thereby stifle this opposition. <br> <br>If it weren't just human nature, I'd call it a damn cunning plan <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
