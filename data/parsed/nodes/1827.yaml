    html: <p>Requiring registration is a far cry from censorship. I for one welcome participation in any form, whether someone cares to post under their real name or a pseudonym. <br> <br>To get back to the original topic, I really appreciate fonts that come from The Hoefler Type Foundry. Now while some may consider my opinion biased due to the fact that I have worked with Jonathan for the last few years, I have genuinely found the HTF library incredibly useful for my needs as a graphic designer. The fonts range from classic text faces to contemporary display and are very well built and battle-tested at length before being released.  <br> <br>Now that Tobias Frere-Jones has joined Jonathan at HTF, I can think we can only expect great things to come.</p>
