    html: <p>The Proteus set (Ziggurat, Leviathan, Saracen and Acropolis) was designed for <i>Rolling Stone</i> magazine <br> <br>Champion Gothic was designed for <i>Sports Illustrated</i>. This design was later greatly extended in weights and widths to form the Knockout series. <br> <br>HTF Didot was designed for <i>Harper's Bazaar</i>. <br> <br>I believe Requiem was also designed for a magazine, but I can't recall which one. <br> <br>Jonathan designed Mercury Display for <i>Esquire</i> magazine in 1997, and in 1999 Tobias extended the design to create the newspaper type family Mercury. Mercury is not shown on the HTF wesbite yet, because it is still under exclusive license to New Times newscorp I believe, but you can see it in the ATypI/Graphis publication <i>Language Culture Type.</i></p>
