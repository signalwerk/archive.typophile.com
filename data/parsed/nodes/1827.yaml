    html: <p>Hrant, I have a feeling our reactions are for a different reasons.  <br> <br>I think text type is inherently more conservative than I suspect you think it is.  <br> <br>And I don't mind revivals - I like most periods, just not Victorian.  <br> <br>I have a feeling that I just don't resonate with the same historical stuff that Hoefler does. It's a way of handling detail and ornament...  <br></p>
