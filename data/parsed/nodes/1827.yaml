    html: "<p>From Kent Lew who is having posting issues on his console: <br> <br>Hrant, AFAIK Hoefler never worked at The Font Bureau. He started under Roger Black before breaking out on his own to do type design full time. <br> <br>Meredith, FB doesn't start with infants, but they do have a good track record with interns. Christian Schwartz did a stint with FB, I believe. There have been other names who got their start at FB, whom I can't recall off hand. Dyana Weissman is currently \"apprenticing\" there. Coincidentally (or maybe not) most of their interns get drafted out of RISD and Yale. <br> <br>RE: Eidetic. The other day, my wife -- who generously tolerates my type obsessions -- mentioned that she was reading a book which, although she was very interested in the content, she found tiring to read and she thought it had something to do with the typeface (yes, she actually said that!). So naturally I had to take a look. It was set in Eidetic Neo. <br> <br>-- K.</p>"
