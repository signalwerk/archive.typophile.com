    html: "<p>Okay, thanks for the clarification. Old maps, eh? I confess that at first I thought it was just off-the-shelf Walbaum Italic -- <a href=\"http://www.myfonts.com/fonts/agfa/walbaum-mt/italic/\" target=\"_blank\">Monotype</a>, not <a href=\"http://www.myfonts.com/fonts/linotype/walbaum/italic/\" target=\"_blank\">Berthold</a>. <br> <br>Wait a minute . . . You know what?: When the redesign first came out (ca. Oct 02), when they introduced the Archer, <i>MSL</i> was using off-the-shelf Walbaum Italic. Along with a display italic that is similar in flavor -- presumably Surveyor (see Oct 02, pg. 243, for example). <br> <br>Now -- Sept 03 (my mother-in-law hasn't handed down the Oct issue yet) -- I see that they're using some of what I presume is Surveyor roman (pp. 156-163, for example).  <br> <br>But they're also still using off-the-shelf Walbaum. See the article starting on p. 106, for instance. And what is that sans? That's not Benton Gothic. Looks like Tobias's digitization of S.H. de Roos's Nobel for Font Bureau. Hmmm. <br> <br>I'm not aware of the Gotham/Lever House connection, but maybe you're right. I see now, however, that the HTF catalog credits the whole Gotham family (not just the Condensed) to a <i>GQ</i> commission. <br> <br>-- K. <br> <br></p>"
