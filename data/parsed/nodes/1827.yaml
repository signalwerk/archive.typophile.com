    html: |-
      <p>In fact, I wonder if anyone will find this, way at the bottom of a 2 1/2 year old thread, but what the heck. </p>
      <p>Jonathan didn't work for me directly, or in the same room for long stretches. He knew all about the history and styles before I found him and all I really showed him was how the spaces and spacing worked, what all the modern characters were used for, and how "the business worked." I gave him a few projects to do and he honed his skills on his own, and was soon as busy as I was. Tobias knew less about the history and styles but for him the spaces and spacing, and what all the characters were for, was natural and known, respectively. He was not interested in the business at all. And then, he absorbed the history rapidly under the influence of myself, but more from Black, Parker and Carter while my main task was to see that he had interesting projects along with the dozens he had in mind. </p>
      <p>Whether or not you like their work, or you choose to tangent off into the relationship between commerce and art, it's an interesting duo. But what's clear to me, from reading this long dead thread, is that type design, in the case when the goal is a product, for either general or specific use, is not an art, and you need a patron, if not a client to get the best out of the best. </p>
      <p>"I've been painting nymphs on rocks for 13 years. I could do it for another 13 years. The commercial market tempts one to repeat oneself."</p>
      <p>But the Nymph might also have Something to do with it ... don't you think?/|\ ;)</p>
