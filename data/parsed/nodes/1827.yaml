    html: <p>I have tried to think more about what it is that I don't warm to in Hoefler's designs, in answer to Tiffany's question. They are of course masterfully executed.  <br> <br>The thing I don't like about Victorian design, and that I sense, rightly or wrongly, in Hoefler's designs, is that ornament is somehow laid on, rather than organic.  <br> <br>For example, I don't like the very sharp but old style serifs on Hoefler Text and Requiem. These are something new, I think, but to me they don't work.  <br> <br>Knockout is I think by intention is more reminiscent of the Victorian predecessors than many modern sans grotesques. I don't know enough to tell you the difference, but whatever they are I don't like look. For example the wide 'a' with the small tail I don't like, and some of the way the thick-thin transitions are handled on the heavier weights.  <br> <br>Now it may be that my reaction is influenced by my age. My (late) grandparents grew up in the Victorian era, and to me Victorian design always looks fussy and stuffy.  <br> <br>I lived in London for five years, and saw plenty of genuine Victorian stuff, but still never warmed to it. I felt as one of my teachers back then said, that it was as if during the Georgian period the builders could do no wrong, and in the Victorian they could do no right. <br> <br>Maybe those in a younger generation, like Hoefler are less prejudiced than I and can see the merits in the Victorian taste. But to me it almost always seems to have forced and laid-on ornament. <br> <br>Just not to be misunderstood, I am not against ornament. In the art nouveau and art deco periods I think they did wonderful things with ornament--and before. Queen Victoria, I am not amused. </p>
