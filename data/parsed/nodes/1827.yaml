    html: "<p>&gt; The marketplace has little to do with pursuits of capitalism. <br> <br>You are not using the word 'capitalism' in the way the word normally is used. Here is a definition of capitalism from Meriam Webster's on-line dictionary:  <br> <br>\"An economic system characterized by private or corporate ownership of capital goods, by investments that are determined by private decision, and by prices, production, and the distribution of goods that are determined mainly by competition in a free market\" <br> <br>The free market is part of the concept of modern capitalism. There is a struggle by large owners of capital to exercise monopolistic powers, which is restrained to a greater (eg. under Clinton) or lesser (eg. under Bush) degree.  <br> <br>A free market is largely due to vigorous government policy and enforcement of laws upholding contracts and supporting fair competition.   </p>"
