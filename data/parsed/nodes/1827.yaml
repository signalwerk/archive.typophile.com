    html: <p>What I find is most people now have an attention span of a flea. I was just in a checkout line at the supermarket and the two people in front of me were on their cell phones, trying to make a purchase and chat on the phone at the same time. The same is true with print communications, while they are looking at printed material they have the TV on in the background and a pda in hand. Typeface? What typeface? This may not be true worldwide but in my little corner of the USA it is. Dan </p>
