  - id: 14503
    user: 1250
    date: 2003-10-30T13:33:00
    date_raw: 30 Oct 2003 — 1:33pm
    votes: null
    html: <p>&gt; I think text type is inherently more conservative than I suspect you think it is. <br> <br>It's certainly more "conservative" (not sure if that's the right term) than display fonts. But it's a lot less conservative than most people who make text fonts think. In fact at some points in the past (like the first quarter of the 20th century) people had a lot more balls than us. And of course the reader couldn't even tell the difference (consciously). These days the fall in the level of craft versus pretentious artistry has annihilated the consideration of what the <i>reader</i> needs, especially in the subconscious realm. <br> <br>The other day I showed a setting of Eidetic to three laymen and asked some carefully tangenial questions about how they felt about it. None of them thought there was anything notable about it! Most "serious" type designers however think it's way out there. <br> <br>Break loose from that cozy old fireplace - there's a rich world outside, it's called the future! <br> <br>hhp <br></p>
