    html: "<p>The observation that the big money in type is typically associated with fairly conservative design can be interpreted in a number of ways, some of them clearly dubious. Proceeding from this observation to the conclusion that capitalism inhibits innovation requires making a number of assumptions. One of these assumptions is that innovation is measurable by the amount of money paid for a single product rather than on the number of products in the market. Obviously, in a capitalist economy, the number of products in the market is very much larger than in pre-capitalist or non-capitalist societies, and this is the usual measure of relative innovation, not how much money X producer obtained for Y product. Indeed, the greater the number of competing products in a market, the lower the average price will be. Since no capitalist economy is ever a purely capitalist economy -- not least because some notions of value are inherited from pre-capitalist societies, especially in 'craft' businesses such as type design -- we should not automatically conflate conservatism in type design with a specifically capitalist status quo. Despite what the most ardent capitalists proclaim, there remain more ways of measuring value than the price the market will bear. The commissions that type designers like Jonathan and Tobias receive from magazines and newspapers reflect interesting and contradictory client desires: to have something new and fresh and distinctive, and to have something with an enduring value that is not merely fashionable. The fact that Jonathan and Tobias so regularly deliver and satisfy these contradictory desires is testament to their considerable skills.</p>"
