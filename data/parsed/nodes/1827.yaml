  - id: 14525
    user: 1262
    date: 2003-11-01T11:27:00
    date_raw: 1 Nov 2003 — 11:27am
    votes: null
    html: "<p>Good points, Refusenik. Of course, we're all assuming that cultural progress = making new and innovative things, which on reflection I don't accept. Hrant made a jump from his claim that capitalism stifles innovation to capitalism stifling cultural progress. Now, those of us pointing out the various ways in which capitalism encourages innovation (albeit without necessarily paying for it) are in danger of making the same jump: that encouraging innovation = encouraging cultural progress. <br> <br>There are various ways of reckoning cultural progress, and innovation in the marketplace is not a universal criterion. How you measure cultural progress depends largely on your own cultural values.</p>"
