    html: <p>William, market forces play a role in the conservatism of HTF. <br> <br>The good commissions and sales for foundries are to large corporations and publications, with multi-user licensing. Those instiututions are very conservative. <br> <br>This is not to deny the innovative quality of HTF typefaces in many areas, but it is subtle. <br> <br>The designers at HTF have all done experimental, more uniquely contemporary work, but that's barely reflected in HTF's positioning. Compare the early Fetish and Gestalt with the bulk of the foundry's catalog. <br> <br>Rarely do the clients that pay best want one's most creative work. In fact, there's probably an inverse relationship between remuneration and creativity. <br> <br>The retail font market is different, you can do crazy work, but it's a crap-shoot.</p>
