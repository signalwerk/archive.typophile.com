    <p><strong><a href="/wiki" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypoWiki</a>&nbsp;:&nbsp;Merchandise</strong></p>
    <p><a href="/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a> has everything from posters and magazines to clothing and furniture:<br><a href="http://houseind.com/index.php?page=merchandise">http://houseind.com/index.php?page=merchandise</a></p>
    <p><a href="/node/13546" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span> Type Foundry</a> has an eclectic selection of shirts, books, audio <span class="caps">CD</span>s <span class="amp">&amp;</span> hockey pucks<br><a href="http://www.p22.com/products/merch.html">http://www.p22.com/products/merch.html</a></p>
    <p><a href="/node/15527" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mark Simonson</a> has some great lettering tees available through <a href="/node/add/wiki?edit%5Btitle%5D=cafe%20press" title="Create node &quot;cafe press&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">cafe press</a>.<br><a href="http://www.cafepress.com/marksimonson">http://www.cafepress.com/marksimonson</a></p>
    <p><a href="/node/12009" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Veer</a> has a great selection of <a href="/node/12157" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Books</a>, <a href="/node/add/wiki?edit%5Btitle%5D=typo%20tees" title="Create node &quot;typo tees&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">typo tees</a>, posters and even lamps!<br><a href="http://www.veer.com/products/merch">http://www.veer.com/products/merch</a></p>
