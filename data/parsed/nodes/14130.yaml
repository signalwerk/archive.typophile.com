    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : Merchandise</strong></p>
    <p><a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a> has everything from posters and magazines to clothing and furniture:<br>
    <a href="http://houseind.com/index.php?page=merchandise" title="http://houseind.com/index.php?page=merchandise">http://houseind.com/index.php?page=merchandise</a></p>
    <p><a href="/wiki/P22%20Type%20foundry" class="freelinking" rel="nofollow">P22 Type foundry</a> has an eclectic selection of shirts, books, audio CDs &amp; hockey pucks<br>
    <a href="http://www.p22.com/products/merch.html" title="http://www.p22.com/products/merch.html">http://www.p22.com/products/merch.html</a></p>
    <p><a href="/wiki/Mark%20Simonson" class="freelinking" rel="nofollow">Mark Simonson</a> has some great lettering tees available through <a href="/wiki/cafe%20press" class="freelinking" rel="nofollow">cafe press</a>.<br>
    <a href="http://www.cafepress.com/marksimonson" title="http://www.cafepress.com/marksimonson">http://www.cafepress.com/marksimonson</a></p>
    <p><a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a> has a great selection of <a href="/wiki/books" class="freelinking" rel="nofollow">books</a>, <a href="/wiki/typo%20tees" class="freelinking" rel="nofollow">typo tees</a>, posters and even lamps!<br>
    <a href="http://www.veer.com/products/merch" title="http://www.veer.com/products/merch">http://www.veer.com/products/merch</a></p>
