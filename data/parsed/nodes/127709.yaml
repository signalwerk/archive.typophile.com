    <p>I may have asked for this a couple of years ago here at Typophile, so I did a search and couldn't find anything.<br>
    I wonder what font is used on this infamous sign K. WEST, i.e. the one that can see on the David Bowie album 'The Rise and Fall of Ziggy Stardust and The Spiders from Mars'<br>
    Anybody know what this can be or if not, what could I use as an alternative. I want to make a T-shirt-screenprint</p>
    <p>by the way,  there is someone that has the original sign:<br><a href="http://www.5years.com/kwestsign.htm">http://www.5years.com/kwestsign.htm</a></p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/kwest.jpg" width="640" height="480" alt="K. West" title="K. West">
