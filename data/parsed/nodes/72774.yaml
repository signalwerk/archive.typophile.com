      <p>Thanks Craig.<br>
      Did some more work on that two story g. I can see why one would resort to a single story g here, but I think it's important enough to the character of the face that I want to stick with the two story.<br>
      Have been looking at both Titling Gothic Black and Franklin Gothic Heavy as example of successfully dealing with such heavy gothics.</p>
      <p>Mostly worked on the /S/ /o/ /O/ /G/ /Q/ and numerals since last posting</p>
