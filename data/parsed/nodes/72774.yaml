      <p>Seems to me like fit between letters will require, first off, some work on optically balancing the weights.<br>
      I think you've got quite a challenge to get a two-story /g/ into this weight of a font. Presently it looks like a bold glyph dropped in among ultra black letters. You can see why so many designers resort to a single story structure at this kind of weight--there's just not the vertical room to stack up four thick strokes.<br>
      Terminals of /C/ and /c/ are also worth reviewing. Getting enough breathing room under the tittles in confined ascender space is another problem ahead of you.<br>
      Basically these are the classic challenges of an ultrabold sans, and reviewing how they are addressed in others' previous attempts will be helpful.</p>
