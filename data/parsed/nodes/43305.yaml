    html: |-
      <p>I second that! All three points, that is:</p>
      <p>Great summary, interesting points. Thanks, Matthew.</p>
      <p>While I defintely prefer unobtrusive inline links to long lines of bulky URL rigmarole, the current implementation is way too subtle!<br>
      Under certain circumstances (screen angle, lighting, …), I cannot tell apart the regular text in Georgia Roman, without underline, in medium gray – from link text in Georgia Roman, without underline, in grayish blue.<br>
      Can’t we have a <code>text-decoration:underline</code>, please? (It doesn’t have to be the chunky default one.) And if that is too much of a revolution, what about a little icon, like the wiki entries have?<br>
      I’ve sent a <a href="http://typophile.com/contact">feature request</a>; if others suffer from the same thing, please do so, too.</p>
      <p>And yes, Matthew, your ideas deserve a better treatment than 10px type in lengthy lines. A max-width in ems would help a lot. </p>
      <p>[sorry for the off-topic comments]</p>
