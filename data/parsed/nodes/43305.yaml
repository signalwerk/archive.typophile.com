      <p>It should let you make the font bigger, in fact the majority of the page is based on em-scaling so changing font size should also nicely change image size as well. I just checked in FF, OmniWeb and Safari and Opera and the fonts go up.</p>
      <p>And yeah I need to work on my site a bit.  I've keep forgetting not everyone uses the smallest windows possible :)</p>
      <p>I would also like if any Portuguese-native users on the forums could tell me how they generally write the tilde over the A and the O. The standard Spanish handwriting for it I'm sure would be too easily confused for an acute accent.</p>
      <p>Also if there's interest I can go back and find more examples of older tildes.  (<a class="freelinking external" href="http://www.cervantesvirtual.com">Cervantes Virtual Library</a> is your friend). </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
