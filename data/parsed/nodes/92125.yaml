  html: <p>I've been working on a new font that for the time being is called New Cuisine. When I go to test things in Illustrator the menu ignores the New and places it where Cuisine would fall. Is the word New a trigger in Adobe apps making it use Cuisine as the family name even though its a single font for now?</p>
