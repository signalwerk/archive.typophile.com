    html: |-
      <p>It works fine; it just shows up under the C's instead of the N's in the font menu. I suppose if I took the space out in the name that would force it to be under the N's, but then it would list as NewCuisine. If it's something to do with the word New preceding it then by logic the same thing would happen with fonts starting with Old like Old English. I don't have Old English so I grabbed a font called Old Press (a freebie) just to see if that came up under P instead. It didn't.</p>
      <p>I remember other fonts doing this when I worked at American Greetings. I thought it had something to do with the font manager, but I'm not certain now. I'm using the old free version of Font Explorer on my Mac. I recently updated the system software to Snow Leopard, but I don't think that's a problem.</p>
