    date: 2012-04-18T01:28:00
    date_raw: 18 Apr 2012 — 1:28am
    votes: null
    html: |-
      <p>The specs for "Menu Name" (NameID 18):</p>
      <blockquote><p>Compatible Full (Macintosh only); On the Macintosh, the menu name is constructed using the FOND resource. This usually matches the Full Name. If you want the name of the font to appear differently than the Full Name, you can insert the Compatible Full Name in ID 18.</p></blockquote>
      <p>There is nothing in there related to this name mangling.</p>
      <p>I didn't test what happens when you use a <em>different</em> Menu Name ('cause I'm on Windows right now), but it's a reasonable assumption that even <em>if</em> you insert a 'different' name here – and InDesign actually uses this –, the result still goes through the "smart sorting" routine.</p>
    html_clean: |-
