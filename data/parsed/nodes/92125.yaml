    html: |-
      <p>Presumably, this behaviour had fonts like “New Century Schoolbook”, “New Aster”, “New Baskerville”, etc. in mind; However, it seems strange that this would be implemented as a general behaviour (rather than one for specific fonts in the Adobe library) since clearly there are many cases where it is entirely undersirable (New Century Schoolbook appearing alongside Century makes sense; New York appearing alongside York doesn’t).</p>
      <p>Unlike Theunis, I actually prefer foundry abbreviations to be ignored for sorting purposes, and have on occasion wished that the OT spec included a separate name field for “Sorting Family Name”. Applications could even include a preference for sorting fonts by either the family name or the sorting name.</p>
      <p>André</p>
