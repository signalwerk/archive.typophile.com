    html: |-
      <p>Yes, InDesign is using its own sorting method, so it won't matter which name field it's getting the name from.</p>
      <p>On reflection, I'm starting to rethink my desire for a 'sorting name' field since, unless different vendors adopted very similar conventions, this would probably cause as much problems as it would solve. I have my own personal preferences, but I doubt they match those of others.</p>
      <p>André</p>
