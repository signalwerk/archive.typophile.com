      <p>Fascinating. I get this exact same result on Windows, InDesign CS4, with a freshly created font.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/newcuisine_6367.png"></div><br>
      Nothing unusual in the name tables either -- this is my default naming scheme:<p></p>
      <pre>    Macintosh Roman (English)          Font family : (1) "New Cuisine"
          Macintosh Roman (English)            Subfamily : (2) "Regular"
          Macintosh Roman (English)            Full name : (4) "New Cuisine"
          Macintosh Roman (English)      PostScript name : (6) "NewCuisine-Regular"
      </pre><p>I also tried it as a Preferred Family name, but that didn't work either!</p>
      <p>I'll have to take a closer look at this. InDesign has a habit of ignoring 'font name prefixes' (and a nasty habit it is, as I feel it's actually inconvenient for browsing through your font list), but so far that only seemed to include foundry names such as Adobe, ITC, and Linotype. There isn't a foundry called "New", is there?</p>
