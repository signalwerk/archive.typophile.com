      <p>hey, hi, thanks for the post :)<br>
      Things have moved a lot since my last post. A friend of mine who has a serious background in graphic design told me that my font was too wacky and too unbalanced in general, but the idea was good and original. So he spends some time to explaine me why and some grid technics. i had so many corrections to do, so i decided to start over and be less fantasy this time.<br>
      In the good news section, i convinced the client to forget about linking the typo of the bold font (hurray!!)<br>
      so there is the new version of the typo, my friend tells me it's look a looot better.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/typo-V0_13_3695.jpg"></div><br>
      what do you think?<p></p>
