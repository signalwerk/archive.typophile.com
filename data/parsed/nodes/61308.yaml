      <p>There is just too much awkwardness where the curves meet the straight edges (for example the top of the right leg of your "M") on top of the mostly strange cuts in each of the characters (your "O"s for example) for the waviness to succeed. I think if you solve those first two awkward features, the curve of the characters might be acceptable.</p>
      <p>Also, there's a weird mix of upper and lowercase characters. Why always a lowercase "e" and "a" with everything else uppercase? It makes them look huge. </p>
      <p>penn</p>
