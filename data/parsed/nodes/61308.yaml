    <p>This post is kinda a follower of this post:  <a href="http://typophile.com/node/58334" title="http://typophile.com/node/58334">http://typophile.com/node/58334</a></p>
    <p>We recently agreed with DFi that they need a font for their lines of product. A first attempt of this project was made 10 years ago;<br>
    I've made drafts of some logos, but have to step back the project. One logo was made from these drafts i made, but not finalised by me.<br>
    here it is:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/old-Safe-Mail_4061.jpg"></div><br>
    This logo had a great success through DFi customers, and they were know for that technology and that logo (... :-/ )<br>
    So the font MUST look like that logo and match the style.<p></p>
    <p>After somes trial, we also agreed that one black font was too heavy to be used alone and must be tempered with a lighter font.<br>
    On basis of trials made with Myriad italic, they choose the Black/Standard mix. I tempered thas choice by making a semi-black (or extra-bold, i don't know how to call this) and a slighty bolder standard.</p>
    <p>here is the draft of the new SafeMail Logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/safemail03_5599.jpg"></div><p></p>
    <p>I've just finished the last letter of the extra-bold font, as it is my first work  of this amplitude, i need all the help i can find!<br>
    have all the letter the same boldness, have all the letter the same angle, is the style consistent enough, or whatever looks wrong or unbalanced.<br>
    Don't forget that the style of the font is predetermined by the old logo SafeMail.</p>
    <p>I join a PDF in file attachment of the extra-bold (or semi-black...) font. The standard font will come soon to join it.<br>
    Any help, any comments are warmly welcomed.</p>
    <p>EDIT02: i've just uploaded 2 new pdf where i've made some change to the G, J, L and Q in extrabold and reported these changes in the standard.</p>
    <p>EDIT03: i've tempered a bit the waveness</p>
    <p>EDIT04: i've removed the angles</p>
    <p>EDIT06: for the black font, i've have standardized the ascendant of letter, remake the K, modify the Q</p>
