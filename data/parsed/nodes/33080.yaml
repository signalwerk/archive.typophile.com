    html: |-
      <p>It's not either/or, there are shades of "call it what it is".<br>
      The book cover in question totally swipes someone else's layout -- but as we now believe, there's more to design than layout, concept is important too. Is the concept here original -- i.e. taking an old piece of artwork and substituting new copy for all or part of it?<br>
      Of course not, so the question is, how well or cleverly is the substitution handled; and indeed there is some subtlety in the choice of how much of the text has been rewritten, and how to highlight it in colour. There is also the quality of the reconstruction (or forgery as Uli would term it) to be considered. But despite all those considerations, it's still not as good as creating an original layout in the style of Rogers would have been.</p>
      <p>I produced a specimen brochure for my 1920s-style typeface Oneleigh, in which I took pages from old specimen books of that era and substituted Oneleigh, with fresh text. I also did some original layouts. Appropriation was a lot easier, of course, and you know the design is good, so no self-doubt about that. And the contrast between the original and the new is fascinating in its own right. But I'm not sure any of that really comes in to play beyond the redesigner and a few viewers, as most aren't aware of the repurposing. It does feel good, remaking something exquisite and venerable, which is a powerful justification for the redesigner. Like performing a classic piece of music, or copying an old type design, when it all comes together, bingo. Although others who have not been through the process might not be so convinced.</p>
      <p>Considered for its marketing power (getting people to look at the book and buy it), the Typology cover is outright plagiarism. But once you get the book, and realize how clever the relationship between past and present is, that changes things.</p>
      <p>These days, across the arts, more respect is given to thinking than making, which validates the process of "appropriation", as the use of that euphemistic term (with knowing irony or not) would suggest.</p>
