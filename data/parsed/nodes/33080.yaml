      <p>&gt;Anyone who believes in original ideas </p>
      <p>I believe in original ideas. Eccleciastes was wrong: there is something new under the sun. Airplanes were new. Computers are new. Even Art Nouveau was new. </p>
      <p>There is a novelty today even in type, which is an inherently conservative medium. Verdana was new, Amplitude, using traps decoratively, is new. Beorcana, handling serifs in a new way is new. There are minor novelties compared to the airplane, but still new.</p>
