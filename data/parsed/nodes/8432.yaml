    html: <p>No favs to list, but this last year I have been seeing of all things Papyrus. I see it on signage, eatery logos, display lettering and on packages for consumer goods. <br> <br>It drives me crazy. Just when I think its use has been stretched to the limits I find it in some new and sadly unique application. <br> <br>I have come to loathe the font to such a degree that it has become a joke around our studio. <br> <br>Mike</p>
