  - id: 55930
    user: 1085
    date: 2005-01-03T10:38:00
    date_raw: 3.Jan.2005 10.38am
    votes: null
    html: "<p>Question #1: <br>My favorite Linotype font of 2004 is the Adrian Frutiger/Akira Kobayashi masterful renovation and extension of Avenir, <a href=\"http://www.linotype.com/90672/avenirnext-family.html\" target=\"_blank\">Avenir Next</a> (OpenType). <br> <br>My favorite non-Linotype font of 2004 is Lineto's <a href=\"http://www.lineto.com/The+Fonts/Categories/Text+Fonts/Akkurat/\" target=\"_blank\">Akkurat</a>, designed by Laurenz Brunner. <br> <br>My favorite type design project of the year, was one of my own. I designed a little thin sans serif italic called Farewell, and then handlettered a large piece that was briefly exhibited in the Klingspor Museum. <br><a href=\"http://www.typeoff.de/english/html/artikel/k_f_o_b_writeup.html\" target=\"_blank\">http://www.typeoff.de/english/html/artikel/k_f_o_b_writeup.html</a> <br> <br>Question #2: <br>I don't know what the most popular font of the year was. Best sellers at Linotype were Neue Helvetica, Frutiger, and Linotype Univers. At MyFonts, Zapfino did really well, and so did Helvetica. I think that Helvetica Neue and Adobe Garamond are pobably the most popular fonts every year, in one sad sense</p>"
    html_clean: "<p>Question #1: <br>My favorite Linotype font of 2004 is the Adrian Frutiger/Akira Kobayashi masterful renovation and extension of Avenir, <a href=\"http://www.linotype.com/90672/avenirnext-family.html\" target=\"_blank\">Avenir Next</a> (OpenType). <br> <br>My favorite non-Linotype font of 2004 is Lineto's <a href=\"http://www.lineto.com/The+Fonts/Categories/Text+Fonts/Akkurat/\" target=\"_blank\">Akkurat</a>, designed by Laurenz Brunner. <br> <br>My favorite type design project of the year, was one of my own. I designed a little thin sans serif italic called Farewell, and then handlettered a large piece that was briefly exhibited in the Klingspor Museum. <br><a href=\"http://www.typeoff.de/english/html/artikel/k_f_o_b_writeup.html\" target=\"_blank\">http://www.typeoff.de/english/html/artikel/k_f_o_b_writeup.html</a> <br> <br>Question #2: <br>I don't know what the most popular font of the year was. Best sellers at Linotype were Neue Helvetica, Frutiger, and Linotype Univers. At MyFonts, Zapfino did really well, and so did Helvetica. I think that Helvetica Neue and Adobe Garamond are pobably the most popular fonts every year, in one sad sense</p>"
