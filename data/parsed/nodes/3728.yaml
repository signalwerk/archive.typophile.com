    html: <p>You're right Mike. There are a lot of interpretations that I overlooked. <br>I am also told that the actual font used by the magazine (maybe <br>not for the masthead itself but when they are doing illustrations <br>with similar type) was commissioned to Monotype and is called <br>"Irvin". It matches perfectly but is assumedly not for retail.</p>
