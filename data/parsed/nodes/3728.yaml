    html: <p>That's almost it. The real font is called "Irvin"  after Rea Irvin the original New Yorker art director. The main difference between the fonts like FF New Yorker, Manhattan and  Upper West Side, which are all Irvin look-alikes, is the Q. See the following sample scanned from McGrew's "American Metal Typefaces of the Twentieth Century" <br><img src="http://www.typophile.com/forums/messages/83/29037.gif" alt="Irvin Sample"> <br> <br>The next two samples are Manhattan from Franklin Type Founders (at Precision Type) and Upper West Side from Intecsas (also at Precision Type). You'll notice that only the Intecsas font tried to get the lettering right. <br><img src="http://www.typophile.com/forums/messages/83/29038.gif" alt="Franklin Manhattan"> <br><img src="http://www.typophile.com/forums/messages/83/29039.gif" alt="Intecsas Upper West Side"></p>
