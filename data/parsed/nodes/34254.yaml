    <p>Hi I accidentally found <a href="http://typophile.com/node/32397" rel="nofollow">this article</a> (and many others following) while searching other typographic related stuff over your forums, and I was suddenly shocked by the general misunderstandings that westerner people have about <a href="/wiki/Cyrillic" class="freelinking" rel="nofollow">Cyrillic</a> language and alphabet, so I’ve updated the sections of your site concerning the disputed language and writing system. I found it very non-polite and offending that a group of people professionally involved in typography, which I may consider for high educated, have so little knowledge about a culture, for which they actually are trying to produce typefaces.  </p>
    <p>And two more remarks:<br>
     I’m not trying to produce a cultural scandal…</p>
    <p>Don’t actually believe all those Russian authors, cited in your posts – do not forget that, in the time of our little (45 years) of Russian occupation of Bulgaria, a rumor was widely spread that the actual developers of Cyrillic alphabet were from Russian origins…. </p>
    <p>Kind Regards,<br>
    Kateliev</p>
    <p>PS: in the coming weeks,when i have time, i'll try to upload some works of famous Bulgarian typographers that are worth mentioning</p>
