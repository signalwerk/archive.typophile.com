      <p><em>I found it very non-polite and offending that a group of people professionally involved in typography, which I may consider for high educated, have so little knowledge about a culture, for which they actually are trying to produce typefaces.</em></p>
      <p>i'm sorry that you feel this way. regarding the <a href="/wiki/typowiki" class="freelinking" rel="nofollow">typowiki</a>, it is quite imperfect and incomplete and in some ways leaves much to be desired when compared to Wikipedia. However, those who contribute do so in good faith and with no malice or political agenda (i believe) and statements made in the wiki article that you changed were not meant to offend. i am sure there are several contributors here on typophile who understand the history of the Cyrillic script very well, but have not taken the time or made the effort to contribute to the article in question, so i am glad that you want to make sure that typophiles have access to the facts concerning the development of the Cyrillic script. However, as a rule, typowiki authors are encouraged to avoid copying from other sources and pasting directly to the typowiki as you did in this case. The article already linked to the Wikipedia article, which you copied and i felt this was sufficient for readers researching the Cyrillic script. Please understand that our wiki is still very much in a developmental stage, and in some cases, articles serve more as a repository for links to discussions on a particular topic and sometimes the actual article content is lacking, but even if somewhat inaccurate or incomplete, i usually let this stand in the hopes that someone will come along and improve upon the article (or until i have time to do that myself!) please continue to help us and welcome to typophile!</p>
