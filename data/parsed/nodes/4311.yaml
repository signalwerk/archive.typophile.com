    html: <p>I've always wanted to play around with Wilke, but never had a project where it was appropriate. That's a big problem with Wilke; it has a lot of "flavor" so you need a project where being that flavorful is okay, and that particular flavor fits. <br> <br>If "Cthulhu by Gaslight" were to get re-issued, Wilke would be perfect for that. It's a horror role-playing game set in the Victorian era, and typically in England. <br> <br>Regards, <br> <br>T</p>
