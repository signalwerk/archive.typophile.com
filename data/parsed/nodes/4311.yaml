  html: '<p>Hello, <br> <br>Does anyone know of good examples for the use of the font Wilke on the internet (or in pdf files)? I was hoping to get a better impression of how it is best used (being myself very much a typography amateur), so any examples would be much appreciated. Also, is there a good bundle of fonts where Wilke is included? <br> <br>Here is a link to the Linotype library: <br> <br><a href="http://www.linotype.com/1609/wilke-family.html" target="_blank">http://www.linotype.com/1609/wilke-family.html</a> <br> <br>Best, <br> <br>Alois</p>'
