    html: <p>If you're testing the font in TextEdit under OS X, I'm pretty sure that TextEdit doesn't support kerning unless the font is AAT. That means PostScript Type 1, OpenType, and TrueType will show no kerning in that application. Very lame. Is this how you're doing it?</p>
