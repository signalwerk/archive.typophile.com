    html: <p><i>Lame?</i> That's a little harsh. I think it's rather a pleasant surprise that an application such as TextEdit supports kerning at all. I can't think of any non-graphics or non-DTP programs that do it in OS 9, even at such a rudimentary level. <br> <br>I would assume that Nick is having kerning problems with programs that would normally be <i>expected</i> to support kerning (graphics or DTP programs). </p>
