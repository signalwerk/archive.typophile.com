    html: <p>Make sure you are using the most up to date version of Illustrator with OS X. I recently had trouble with missing kerning in PostScript fonts with this combination because I forgot to update Illustrator 10 to the newest version (10.0.3) when I switched to a new machine running OS X 10.2.4. The same goes for InDesign.</p>
