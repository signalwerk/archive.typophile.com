    html: <p>In fact, if you're trying to commute into Mountain View, you also have the light rail system coming up from San Jose (not to mention the bus) at your disposal. I grew up around Mountain View/Los Altos and think it's a great place to live. As you might imagine, it depends a lot on how much money you have. There are really a lot of charming suburban neighborhood along the Hwy 101/Caltrain corridor, but I'm guessing prices and rental availability vary a lot. Maybe if you can give us some idea of the price range you're after, we might have more helpful suggestions. (There was just a news story tonight about how rents are spiking up here -- so hurry up!)</p>
