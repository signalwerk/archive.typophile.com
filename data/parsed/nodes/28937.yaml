    <p>Hey Folks,</p>
    <p>We need some advice, I know a lot of you live in the bay area (jared, joe) and i need some advice on a good place/area/neighborhood to live for a small family of three. I will be working in Mountain View and will be commuting via bicycle or public transit. Also I need to have a garage to set up my letterpress studio. We will be renting.</p>
    <p>Any ideas? I hear San Mateo is a cool area... but I have never been there.</p>
    <p>In short, graphic designer and family are looking for a good neighborhood in the bay area... we need help.</p>
    <p>Best,<br>
    Josh</p>
