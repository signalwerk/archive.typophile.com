      <p>My wife and I live in Mountain View, and we're looking to move to a new place. We've looked in a variety of towns nearby such as Redwood City, Sunnyvale, Campbell, and Milpitas. (We're priced out of places like Menlo Park, Palo Alto, and Los Altos.) For what it's worth, we've decided that we want to stay in Mountain View. We haven't found a place yet though.</p>
      <p>I used to live near San Mateo. Like many towns, there are areas that are nice and there are areas that are not so nice. You really need to visit a neighborhood to get a feel for what it's like. Of course, it also depends on what you're looking for.</p>
      <p>If you end up living in San Mateo and commuting to Mountain View, there's a commuter train that you might be able to use. See</p>
      <p><a href="http://www.caltrain.com" title="http://www.caltrain.com">http://www.caltrain.com</a></p>
      <p>s'marks</p>
