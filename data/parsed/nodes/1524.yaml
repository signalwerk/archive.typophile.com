  html: <p>Hi, I am doing some work regarding a restored gas station (built in 1920s) and am wondering if anyone has any suggestions on type from this period. If there is anywhere in particular I can look for ideas that would be greatly appreciated as well. Thanks!</p>
  html_clean: <p>Hi, I am doing some work regarding a restored gas station (built in 1920s) and am wondering if anyone has any suggestions on type from this period. If there is anywhere in particular I can look for ideas that would be greatly appreciated as well. Thanks!</p>
