    html: <p>Although out of print, you might do a search of online used bookstores for a copy of "Trademarks of the 20's and 30's" by Eric Baker. <br> <br>There are also numerous resource books on the history of the American gas station at Amazon.com.  Just do a search for "gas station."  A client just got several of the books for a restoration project of the same period. <br> <br>- Jeff <br> <br>Jeff Fisher <br>Engineer of Creative Identity <br> <br>Jeff Fisher LogoMotives <br><a href="http://www.jfisherlogomotives.com" target="_blank">http://www.jfisherlogomotives.com</a></p>
    html_clean: <p>Although out of print, you might do a search of online used bookstores for a copy of "Trademarks of the 20's and 30's" by Eric Baker. <br> <br>There are also numerous resource books on the history of the American gas station at Amazon.com.  Just do a search for "gas station."  A client just got several of the books for a restoration project of the same period. <br> <br>- Jeff <br> <br>Jeff Fisher <br>Engineer of Creative Identity <br> <br>Jeff Fisher LogoMotives <br><a href="http://www.jfisherlogomotives.com" target="_blank" class="link-external">http://www.jfisherlogomotives.com</a></p>
