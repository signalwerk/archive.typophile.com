    date: 2003-10-15T08:29:00
    date_raw: 15 Oct 2003 — 8:29am
    votes: null
    html: '<p>For period reference and inspiration try: <br> <br><b>AD Access</b> (over 7,000 advertisements printed in U.S. and Canadian newspapers and magazines between 1911 and 1955) at <a href="http://scriptorium.lib.duke.edu/adaccess/" target="_blank">http://scriptorium.lib.duke.edu/adaccess/</a> <br> <br>or <br> <br><b>The Emergence of Advertising in America: 1850 - 1920</b> (Presents over 9,000 images, with database information, relating to the early history of advertising in the United States) at <a href="http://scriptorium.lib.duke.edu/eaa/" target="_blank">http://scriptorium.lib.duke.edu/eaa/</a> <br></p>'
    html_clean: '<p>For period reference and inspiration try: <br> <br><b>AD Access</b> (over 7,000 advertisements printed in U.S. and Canadian newspapers and magazines between 1911 and 1955) at <a href="http://scriptorium.lib.duke.edu/adaccess/" target="_blank" class="link-external">http://scriptorium.lib.duke.edu/adaccess/</a> <br> <br>or <br> <br><b>The Emergence of Advertising in America: 1850 - 1920</b> (Presents over 9,000 images, with database information, relating to the early history of advertising in the United States) at <a href="http://scriptorium.lib.duke.edu/eaa/" target="_blank" class="link-external">http://scriptorium.lib.duke.edu/eaa/</a> <br></p>'
