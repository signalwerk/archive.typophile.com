    date_raw: 6 Oct 2003 — 8:59am
    votes: null
    html: "<p>Another wonderful and amazing resource can be found through Louise Fili's book <a href=\"http://www.amazon.com/exec/obidos/ASIN/0811811352/typophile-20/104-0391134-8009546\" target=\"_blank\">Deco Type: Stylish Alphabets of the '20s &amp; '30s</a> as well as any of her other books. While her books are not an all encompassing explanation on design theory from that time, they are amazing little time capsules for those of us which love these periods.</p>"
