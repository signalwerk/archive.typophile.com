    html: <p>Although out of print, you might do a search of online used bookstores for a copy of "Trademarks of the 20's and 30's" by Eric Baker. <br> <br>There are also numerous resource books on the history of the American gas station at Amazon.com.  Just do a search for "gas station."  A client just got several of the books for a restoration project of the same period. <br> <br>- Jeff <br> <br>Jeff Fisher <br>Engineer of Creative Identity <br> <br>Jeff Fisher LogoMotives <br><a href="http://www.jfisherlogomotives.com" target="_blank">http://www.jfisherlogomotives.com</a></p>
  - id: 12390
    user_id: 1717
    user_name: steve_p
    user_path: null
    date_raw: 15 Oct 2003 — 8:29am
    date: 2003-10-15T08:29:00
    votes: null
    html: '<p>For period reference and inspiration try: <br> <br><b>AD Access</b> (over 7,000 advertisements printed in U.S. and Canadian newspapers and magazines between 1911 and 1955) at <a href="http://scriptorium.lib.duke.edu/adaccess/" target="_blank">http://scriptorium.lib.duke.edu/adaccess/</a> <br> <br>or <br> <br><b>The Emergence of Advertising in America: 1850 - 1920</b> (Presents over 9,000 images, with database information, relating to the early history of advertising in the United States) at <a href="http://scriptorium.lib.duke.edu/eaa/" target="_blank">http://scriptorium.lib.duke.edu/eaa/</a> <br></p>'
  - id: 12391
    user_id: 868
    user_name: geraintf
    user_path: null
    date_raw: 15 Oct 2003 — 10:49am
    date: 2003-10-15T10:49:00
    votes: null
    html: "<p>wow. what an amazing couple of links. <br> <br>The richard hollis* book is good on the period, and is organised by country and date. <br>there are many illustrations, but given the restrictions of the series format, the illustrations are tiny and b/w (almost all).  <br> <br>*Richard Hollis, Graphic Design: A Concise History , Thames and Hudson (World of Art series)</p>"
  - id: 138384
    user_id: 108
    user_name: Miss Tiffany
    user_path: null
    date_raw: 6 Oct 2003 — 8:59am
    date: 2003-10-06T08:59:00
    votes: null
    html: "<p>Another wonderful and amazing resource can be found through Louise Fili's book <a href=\"http://www.amazon.com/exec/obidos/ASIN/0811811352/typophile-20/104-0391134-8009546\" target=\"_blank\">Deco Type: Stylish Alphabets of the '20s &amp; '30s</a> as well as any of her other books. While her books are not an all encompassing explanation on design theory from that time, they are amazing little time capsules for those of us which love these periods.</p>"
