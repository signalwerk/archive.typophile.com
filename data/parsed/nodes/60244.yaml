      <p>Avenir is a great substitute for Gotham, as well as Museo and Proxima Nova. There are many alternatives...Frutiger/Myriad, Franklin Gothic/Trade Gothic, Gill Sans/Agenda...just off the top.</p>
      <p>Jeo.</p>
