  html: |-
    <p>Hi everyone. I'm designing a book that features Apolline as it's main display font. <a href="http://new.myfonts.com/fonts/typofonderie/apolline/" title="http://new.myfonts.com/fonts/typofonderie/apolline/">http://new.myfonts.com/fonts/typofonderie/apolline/</a></p>
    <p>This book has a lot of elements (a-heads, b-heads, lists, bullets, etc.) that I need a sans for. It's a simple, elegant, clean design. I've been creatively stuck on Gotham and Interstate. Does anyone have an alternative suggestion to get me out of my transportation rut?</p>
    <p>Thank you in advance-Janet</p>
