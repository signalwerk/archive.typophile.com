    html: |-
      <p>As for Autoplay, as of OS X it's a no-go. On a PC, it's entirely dependent on the system you are using. You'll have to enable it on that system, and create a file in notepad called autorun.inf with these two lines (substituting the name of your PDF file - no space characters allowed):</p>
      <p>[autorun]<br>
      shellexecute="yourfile.pdf"</p>
      <p>Save the autorun.inf file to the root level of your CD.</p>
