    html: |-
      <p>The popup warning has been added to Acrobat specifically to prevent unexpected takeovers.</p>
      <p>Perhaps you can find an older version of Acrobat Reader that doesn't have the warning, and tell your clients to download that.</p>
      <p>(Do you really think it's such a bad form to <em>tell</em> your clients that they can choose whatever they like, but your presentation is best viewed full screen?)</p>
