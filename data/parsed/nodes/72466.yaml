      <p>Do you actually have the full version of Acrobat, or are you creating the PDF using the source application's "save as/print to PDF" controls?</p>
      <p>If you have the full version of Acrobat, then the dialog box at <strong>File&gt; Document Properties&gt; Initial View</strong> has a checkbox "Open in Full Screen Mode", which (for a test doc on my machine at least) seems to do what you want...</p>
