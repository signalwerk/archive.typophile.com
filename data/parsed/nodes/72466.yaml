      <p>&gt; The problem is THE POPUP WINDOW</p>
      <p>It's possible to disable that popup on your own computer, but don't think it's possible to do so automatically on someone else's computer.</p>
      <p>&gt; If i wont find a solution ill have to make<br>
      &gt;  the presentation in flash</p>
      <p>Keep in mind that many users do not like documents/applications to take over their entire monitor by surprise. It's not expected behavior (except maybe for games). I've known folks who get very annoyed when a program does that unexpectedly.</p>
      <p>Asking the user's permission before going full screen is not necessarily a bad thing.</p>
