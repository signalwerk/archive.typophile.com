    <p>Hello,</p>
    <p>I have asked this on adobe forums but nobody answered so i thought people here might be better informed :)</p>
    <p>I needo to do a presentation in full screen in pdf format. I want to put it on a CD. It needs to autorun upon inserting the CD and automaticaly open in FULLSCREEN !!! How do i make it to skip the popup window asking if a viewer wants it in full screen? Is it possible at all?</p>
    <p>Thanks in advance</p>
