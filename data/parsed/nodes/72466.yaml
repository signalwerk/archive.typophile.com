      <p>Hm, that's what happens when I create a test PDF in Acrobat 7, and then someone views it in Reader 8! How rubbish! Can't help, in that case... </p>
      <p>So: what James &amp; Theunis said (though I don't imagine anyone would take to the suggestion that they downgrade their Acrobat reader!). (a) put up with the popup, (b) flash, (c) there are probably shareware utilities on the web somewhere that'd turn a PDF into a self-running executable (haven't looked into whether those would then be runnable full-screen) - see whether things like PDF2EXE are any good (no idea).</p>
