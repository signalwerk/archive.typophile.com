    html: "<p>Trends i see: less humanist, more classic grotesque and squarish typefaces; for example Benton Sans, Titling Gothic, Antenna, Franklin Gothic, Etica, Dagny and Ibis, Republic, Droid Serif, Meta Serif, PT Serif etc.</p>"
