    html: |-
      <p>Certainly, Sense is more popular than Sensibility.<br>
      (I refer to sales figures for the Shinntypes.)<br>
      Not seeing too much Carter Sans or Ideal Sans, either.<br>
      However, whether this situation/trend will remain or reverse is another matter.</p>
      <p>It might well be that as screen resolution increases, and web browsers come to support expert typographic features, and web developers become more typographically informed now that there is large selection of webfonts, that there may be a vogue for classic garalde expert typography online, with drop caps, small caps, figure alternates, ligatures &amp;c.</p>
