  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/marne-spec_4761.jpg"></div><p></p>
    <p>I wanted to post this for feedback before starting on the numerals and (possibly) a lowercase alphabet. It was somewhat difficult to balance a) blackness, b) extendedness, and c) a reversed stress, and some letterforms that might otherwise have shared a quasi-analogous construction, such as the X and Y, here do not. </p>
    <p>I'm going for a more fun, ultra-black vibe than anything mannered or historically reverent.</p>
