    html: |-
      <p>Try both ways and see what you think! A third possibility would be to use lining figures only in the legal citations, leaving osfs for the dates and footnote indices, like this: (bold=lining)</p>
      <p>120. Compare <strong>23</strong> US <strong>1380</strong> (1974); (2004) <strong>69</strong> Harv. L.J. <strong>28</strong> at <strong>65</strong></p>
      <p>(by the way, though, this method would drive the production people <em>insane</em>. )</p>
