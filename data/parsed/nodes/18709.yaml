  html: |-
    <p>I need to set an academic manuscript in Latex.  In addition to the typefaces provided by latex, sabon and albertina are also available. The text contains some dates and figures in the body text, but not too many. On the other hand, it contains about a thousand legal footnotes which all contain numbers, e.g.:</p>
    <p>120.    Compare 23 US 1380 (1974); (2004) 69 Harv. L.J. 28 at 65 (text)</p>
    <p>My question is this: oldstyle figures blend well with the text, but not with the footnote text because of the many capital letters. So what style figures to use? Oldstyle for the main text and lining for footnotes? Lining for both? </p>
    <p>what's your advice?</p>
