    html: <p>I've seen it put to lots of uses over the years and, to me, it can <br>serve nicely for, say, a magician's or horror show poster/flyer. <br> <br>It's found, however, in the oriental-style section of the Solotype <br>Catalog and called Japanette and that Japanese connection I <br>simply do not see at all. <br> <br>Oddly enough, though, my family and I went out for a Chinese <br>dinner last night shortly after I made the above post and what <br>typeface do you suppose was used on the packaging of our <br>fortune cookies?  You got it. <br> <br>Hey, Daniel, maybe if your Mac were Macanese ...  ? <br><br></p>
