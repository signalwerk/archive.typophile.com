      <p>I have an early scan of a Polo sketch from 1971. Salden released Polo in 1972. He had an contract with 6 typesetting companies to make 10 fonts per year (fonts, not families). The contract started in January 1972, and Polo was the first typeface he delivered.</p>
      <p>Brendel’s Glasgow was made and released almost ten years later, in 1980 I believe. And as Albert Jan Pool wrote, Brendel’s fonts were based on existing typeface designs. Brendel not only copied Polo but also four other fonts by Salden. They are still available at Elsner+Flake.</p>
      <p>What Gorissen and Möllenstädt mention is the Diatronic version of Polo, which was done 1981/82.</p>
      <p>Interesting in the early Polo sketch: It’s even closer to the later Glasgow (see the character e). In the sketch the g is still closed. Salden opened it in the released version of 1972. The first Polo release was only one font, a bold narrow headline version. More fonts were made until 1976.</p>
      <p><img src="/sites/default/files/old-images/Polo_1971_5901.png"></p>
