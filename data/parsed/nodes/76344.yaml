      <p>Thanks for your replies.</p>
      <p>On the old Quick Brown Fox website, Glasgow Regular was offered as a free download.  The site including the download is available in the Internet Archive, see e.g.:<br><a href="http://web.archive.org/web/20080302224520/http://www.qbf.de/tceng.htm">http://web.archive.org/web/20080302224520/http://www.qbf.de/tceng.htm</a></p>
      <p>In this Glasgow Regular file, the copyright information reads:<br>
      (C) 1993 B &amp; P Graphics, Ltd.</p>
      <p>This could of course mean that the typeface existed before and was digitized in 1993.</p>
      <p>It seems to be evident that Glasgow is based on Polo, but the typefaces are different (Polo on top):</p>
      <p><img src="/sites/default/files/old-images/Polo_3557.png][img:sites/default/files/old-images/Glasgow_6451.png"></p>
      <p><a href="http://On the Elsner &amp;amp; Flake website" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://On the Elsner &amp; Flake website</a> I found the following about Brendel’s typefaces:</p>
      <p><cite>The typographer and founder of the TypeShop Group* Walter Florenz Brendel (1933-1992) ordered the development of exclusive phototypesetting typefaces in the 70s and the beginning of the 80s for the phototypesetter he himself built, “Unitype”, which had their basis partially in historical but also in contemporary designs.</cite></p>
      <p>If Glasgow was made in the mentioned period, it must have been made shortly after the publication of Polo, which was developped 1972–1976 (according to Georg Salden).</p>
      <p>So maybe it was made by an unknown employee of Brendel or Walter Brendel himself.</p>
      <p>I’m eager to read it if someone knows more about the case.</p>
