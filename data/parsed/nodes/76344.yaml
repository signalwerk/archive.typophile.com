      <p>Walter Brendel (1933-1992) was the founder of Brendel Informatik, Brendel &amp; Pabst and the Type Shop group of phototypesetting houses. He also co-founded the European Typeface Corporation (ETC) which was connected with Typo Bach, another group of phototypesetting houses.<br>
      Brendel’s Serials were based on existing typeface designs, which had typically been made fit for creating a range of 7 weights from extra light to extra bold by interpolation. The Serials Typeface Collection used to be exclusively available through Brendel’s Type Shops, Typo Bach and others. </p>
      <p>The German type designer Georg Salden created another range of exclusive typefaces, they were only available through the GST group of typesetting houses. Similar to Brendel’s Type Shops and Adrian William’s Club Type, the GST group also tried to enforce customer loyalty by offering typefaces that were exclusive to their group. As all of these typesetting houses worked for the same advertising agencies, their typeface libraries show many similarities. Some of these similarities were created on purpose, some of them not. Some of them are just copies, some of them are re-engineered designs, some of them are adaptations of existing designs, some of them are originals …</p>
      <p>Currently, the Type Shop / Serials typeface library is maintained and marketed by Elsner+Flake.<br><a href="http://www.fonts4ever.com/foundry_detail.php?f_shops_id=3&amp;f_fonts_belegung_id=0&amp;view=1">http://www.fonts4ever.com/foundry_detail.php?f_shops_id=3&amp;f_fonts_belegu...</a></p>
      <p>The GST typefaces, such as Polo, are available through his company TypeManufactur<br><a href="http://www.typemanufactur.com/">http://www.typemanufactur.com/</a></p>
      <p>Adrian Williams Club Type is available through Club Type<br><a href="http://www.clubtype.co.uk">http://www.clubtype.co.uk</a></p>
      <p>also have a look into this thread for a similar case<br><a href="http://typophile.com/node/76806">http://typophile.com/node/76806</a></p>
