      <p>reveals that Polo is a straightforward copy of Glasgow</p>
      <p>(and vice versa)</p>
      <p>Which came first, the chicken or the egg?</p>
      <p>Visit the website <a href="http://www.glasgowpolo.com">www.glasgowpolo.com</a>,<br>
      and you'll understand,<br>
      why the font was called both Glasgow and Polo.</p>
      <p>The Berthold Types catalog of 1988 did not yet include Polo.</p>
      <p>So, which came first, Glasgow or Polo?</p>
