    <p>Dear Typophiles!</p>
    <p>I recently stumbled upon the Glasgow typeface:</p>
    <p><img src="/sites/default/files/old-images/glasg_3899.gif"></p>
    <p>I think it’s really neat, so I would like to find out where it originally comes from.</p>
    <p>It’s sold by Elsner &amp; Flake as part of their “Typeshop Collection”, which, as it seems, is the former <em>Quick Brown Fox</em> “Serials Typecollection”, which is the former <em>Brendel &amp; Pabst</em> “Serial Type Collection”.</p>
    <p><em>Softmaker</em> sells it, too (as “Glasgow Serial”), as does <em>Red Rooster</em> in two versions (stating on MyFonts it originates from <em>Quick Brown Fox</em>).</p>
    <p>While most Brendel &amp; Pabst typefaces are modelled after typefaces from other foundries, I couldn’t find out anything about Glasgow. Could this be a Brendel &amp; Pabst original?</p>
    <p>I hope someone can shed light on this!</p>
    <p>Thanks in advance — Joshua</p>
    <p><a href="http://new.myfonts.com/fonts/ef-typeshop/glasgow/">http://new.myfonts.com/fonts/ef-typeshop/glasgow/</a><br><a href="http://new.myfonts.com/fonts/softmaker/glasgow-serial/">http://new.myfonts.com/fonts/softmaker/glasgow-serial/</a><br><a href="http://new.myfonts.com/fonts/redrooster/glasgow-rr/">http://new.myfonts.com/fonts/redrooster/glasgow-rr/</a><br><a href="http://new.myfonts.com/fonts/redrooster/glasgow-pro/">http://new.myfonts.com/fonts/redrooster/glasgow-pro/</a></p>
