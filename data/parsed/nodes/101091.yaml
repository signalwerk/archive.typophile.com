    <p>Hi, I'm working on website that helps users find and understand treatments for their medical and psychological conditions. For example, if you have an aneurysm, the website will recommend you either surgery or statins, and explain to you which is the best treatment for you, based on your history and preferences.</p>
    <p>I chose Frutiger as the base typeface for this site because I feel it no-nonsense but without being stiff and unfeeling. People coming to the site are trying to find their way, and need vital information at a personal level. Also, I like the look of Frutiger.</p>
    <p>My question is - is there is suitable serif pairing for Frutiger in this context? It will be used for titles, but also some body copy, like captions and blockquotes and like. </p>
    <p>I was leaning towards Apollo or maybe Minion, because they look great with Frutiger, but I'm not sure if either of those two serve as a good fit for the subject matter of the site.</p>
    <p>Thanks!</p>
