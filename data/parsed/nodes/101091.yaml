    html: <p>When I was a student, Meridien (1957) was considered a standard partner. Now we have Frutiger Serif (2008). They are quite similar, with Frutiger Serif being a slightly “toned down” Meridien. A make-work project in my opinion. I’d kick it old-school and go with Meridien. Better for your street cred.</p>
