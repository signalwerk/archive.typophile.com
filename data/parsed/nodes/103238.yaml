    html: <p>You can also use computer plotted pounce patterns. They have an advantage over projections, first because there isn't the distortion a projector will give you, and second you don't need darkness. Of course, you need neither computer not plotter for the projection method.  In the end, it is six of one and a half dozen of the other.</p>
