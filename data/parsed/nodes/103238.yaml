  html: |-
    <p>I am hoping to create a signage across 3 walls (ceiling and 2 side walls) similar to the way finding system created by Axel Peemoeller for the <a class="freelinking external" href="http://asdlabs.com/blog/2008/09/26/axel-peemoeller-eureka-carpark" rel="nofollow">Melbourne car park</a>. I know that the designer created it using some type of mathematical system, but unfortunately I don't have his mad math skills to pull this off.<br>
    I was thinking of maybe projecting my design across the walls and tracing it on the spot. Any ideas would be greatly appreciated.</p>
