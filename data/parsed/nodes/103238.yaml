    html: |-
      <p>[I never did anything like this, so take this with a grain of seasalt.]</p>
      <p>On a planning stage, make a photo from the point you want to put the viewer(s)/projector, and plan by overlaying your image over the photo.  A tricky part would be to decide which kind of photo to take: rectilinear wide or fisheye wide.</p>
      <p>The idea is that for planning, you want a wide-angle photo such that rectangular pieces of this photo can serve as narrow-angle photos of the subject (assuming that you want your design to be viewed in a narrow angle).  This is not possible (due to sphere being “intrinsically” curved).  So for best result, loading a wide-angle photo into a specialized “panoramic viewer” (like Hugin) may be a better solution (if you can get familiar with its UI quick enough).</p>
