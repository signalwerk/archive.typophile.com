    <p></p><div class="imageWrap"><img src="http://typophile.com/files/06 normales 5 de julio_4239.jpg"></div><p></p>
    <p>hola a todos. Pongo aquí a su consideración un proyectyo en el que estoy trabajando. Está en su fase 1.0 (y creo deberé llegar a la fase 50 o 60 sobre el final). Pero la idea es presentar el proyecto desde cero para poder incorporar la mayor cantidad de aportes y experiencias al proceso. Desde ya muchas grtacias. </p>
    <p>Más info en <a href="http://www.tipografa.blogspot.com" title="www.tipografa.blogspot.com">www.tipografa.blogspot.com</a></p>
    <p>Económica sans es un proyecto de creación tipográfica que busca el ahorro de espacio (condensación) sin pérdida de altura "x".</p>
    <p>Este proyecto se inscribe en el rediseño de una publicación de mensual de programación de televisión por cable. Actualmente tiene un tiraje de 40.000 ejemplares mensuales lo que justifica que al menos se contemplen posibilidades de ahorro de papel.<br>
    En el diseño actual se imprime con helvetica ligth condensada (tercera línea de texto en la imagen) en un cuerpo de 7,5 en una línea de 8,3 puntos, sobre papel diario.<br>
    La primera opción manejada para el cambio fue la utilización de la tipografía myriad pro condensada (segunda línea de texto en la imagen). En el mismo cuerpo se pierde considerablemente la legibilidad por la menor altura de "x".<br>
    El proyecto consiste entonces en generar una tipografía con altura "x" igual o mayor que la helvetica condensada ligth, y nivel de condensación igual o mayor a myriad pro condensada. También se contemplará como meta un ahorro de espacio, con respecto al uso actual, del entorno del 20% de superficie empleada para un mismo texto.</p>
    <p><a href="http://www.tipografa.blogspot.com" title="www.tipografa.blogspot.com">www.tipografa.blogspot.com</a></p>
