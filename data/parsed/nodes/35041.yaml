      <p>Veo dos diferentes familias tipográficas, cada una luchando por definir su identidad. Ambas son viables, pero muy distintas. Me parece que la primera tiene mucha más personalidad que la segunda, y es además, más «económica«.</p>
      <p>Saludos cordiales,</p>
      <p>I see two different typefaces, each one struggling to define their identity. They're both  feasible, but very different. I believe the first has much more personality than the second one, and it's besides, more "economica".</p>
      <p>All the best,</p>
      <p>César Puertas<br>
      diseñador (tipo)gráfico<br>
