      <p>Strass ya ha dicho mucho de lo que diría sobre las letras principales.  Yo quizá tendría el tilde sobre la eñe subiendo en vez de bajando, como es la tradición española.  También, me parece que los tildes sobre las vocales menúsculas pueden ser un poco más estrechas.  La anchura para las mayúsculas es perfecta, aunque ellos están puestas demasiado a la izquierda. (creo que sólo es que no has ajustado una marca combinatoria para las mayúsculas).</p>
      <p>Es un buen tipo ya.  Voy a enseñarlo a un amigo porque él ha sido buscando un nuevo tipo sans.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
