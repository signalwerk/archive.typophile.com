      <p>Hola profe!</p>
      <p>Es muy interesante el desafío de ahorrar espacio...<br>
      Me gusta la resolusión de la "g", mucho ahorro de problemas aparte d espacio jeje... y luego te digo que es muy original en general, cada tipo tiene su particularidad que lo diferencia de los otros, lo cual la hace más legible (si, presto atención en clase)</p>
      <p>Bueno y ahora te doy mi MUY humilde opinión como estudiante y con mucho respeto...</p>
      <p>- Primero que nada veo el palito de la "ñ" como medio tímido comparado con el punto, o el tílde (que son bastante grandes)</p>
      <p>- Segundo la "s" y "S" se me "caen" un poco para la izquierda, tal vez sea pora la base que es media corta..</p>
      <p>- Tercero veo la "x" media pesada en comparacion con el resto...</p>
      <p>- Y cuarto tendría que verla impresa, para poder ver como se maneja realmente en un impreso.</p>
      <p>Espero te sirva de ALGO jeje,<br>
      yo sigo estudiando que me falta mucho todavía...</p>
      <p>Saludos (o abrazos tipográficos)<br>
      Ferchules</p>
      <p>PD: </p>
      <p>Te paso el link de las críticas a mi tipo...<br>
      aunque seguramente ya estas podrido de verla jaja<br>
      <a href="http://typophile.com/node/35021" title="http://typophile.com/node/35021">http://typophile.com/node/35021</a></p>
