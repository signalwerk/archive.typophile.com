      <p>Vic:</p>
      <p>Te dejé un comentario en el blog..</p>
      <p>lo pego acá por las dudas..</p>
      <p>***</p>
      <p>Fernando dijo...</p>
      <p>Hola Vic</p>
      <p>Vamos a darle el buen uso que se merece a este blog y que aparte tiene buena pinta.</p>
      <p>Espero que mi humilde opinión te sirva para algo, pero una vez más te digo que me falta mucho para saber lo que sabés vos... y siempre con mucho respeto...<br>
      Y como te dije anteriormente tendría que verla impresa, para poder ver como se maneja realmente en un impreso.</p>
      <p>Bueno me gusta mucho la nueva versión y el nuevo proyecto, más que nada veo, tal vez, algunos problemas de peso por ejemplo sinto que la "e,g,w" estan medias livianas y la "z,b,d,p,q" ligeramente pesadas. Estas 4 últimas letras lo que las hace pesadas podría ser la unión de la curva con el hasta.</p>
      <p>Y después según mi criterio pienso que algunos signos no forman parte del sistema tanto como otros... por ejemplo la "k" capaz que podrías probar hacer la segunda ascendente con una forma más curva. O la "t" la veo como muy cuadrada comparada con el resto.</p>
      <p>La "g" me gusta, pero le falta "coco" jeje siento que está media desequilibrada, lo mismo la "s".</p>
      <p>No hablo de las mayúsculas ni de los números porque nunca me llevé muy bien con ellos.</p>
      <p>Abrazos</p>
      <p>Ferch</p>
      <p>***</p>
