    date_raw: 18 Jan 2003 — 4:37am
    votes: null
    html: <p>This logo is made out of zipatone dry transfers circa 1980-82, i still have many of those. i wonder if they still work! the ss lig of this alphabet is simply wonderful if you could have the chance to see it. the whole thing was always like wow! <br> <br>If this typeface wasn't released as the default font in programs like CorelDraw it would very probably be better recognized as a staple of the late 70s <br> <br>Avant Garde's many weights and characters were big hits back then, along with Serif Gothic, which also used to have this hard-to-find xtra ligs and an ultra heavy weight. <br>i was in high school then.... <br> <br>oh que tiempos aquellos!</p>
