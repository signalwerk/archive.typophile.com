    html: <p>Thanks all! You made my day. I've been searching all over trying to figure it out. Now, so as not to be the same ... any ideas of a similar font for use in my pub?</p>
    html_clean: <p>Thanks all! You made my day. I've been searching all over trying to figure it out. Now, so as not to be the same ... any ideas of a similar font for use in my pub?</p>
  - id: 52251
    user: null
    date: null
    date_raw: null
    votes: null
    html: "<p>For a serif with Proforma's \"tradition with a twist\", take a look at Borges from PampaType. I just got the printed specimen book in the mail today, and it's a beauty. <br> <br><a href=\"http://www.pampatype.com/English.html\" target=\"_blank\">http://www.pampatype.com/English.html</a> <br><a href=\"http://www.myfonts.com/fonts/pampatype/borges/\" target=\"_blank\">http://www.myfonts.com/fonts/pampatype/borges/</a> <br> <br>Jeremy Tankard's Enigma is worth a look: <br><a href=\"http://www.typography.net/type/enigma.htm\" target=\"_blank\">http://www.typography.net/type/enigma.htm</a> <br> <br>Then there's Delicato, whose designer professes to have been inspired by Enigma and Proforma: <br><a href=\"http://www.veer.com/products/typedetail.aspx?image=FOT0000073\" target=\"_blank\">http://www.veer.com/products/typedetail.aspx?image=FOT0000073</a> <br> <br>As far as sans go, I prefer News Gothic to Trade Gothic, if you're looking for something that's *really* similar. <br> <br>If you want a relatively neutral modern sans, that still has some of the character of the the gothics, consider FF Kievit: <br> <br><a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11231.0.0\" target=\"_blank\">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11231.0.0</a></p>"
    html_clean: "<p>For a serif with Proforma's \"tradition with a twist\", take a look at Borges from PampaType. I just got the printed specimen book in the mail today, and it's a beauty. <br> <br><a href=\"http://www.pampatype.com/English.html\" target=\"_blank\" class=\"link-external\">http://www.pampatype.com/English.html</a> <br><a href=\"http://www.myfonts.com/fonts/pampatype/borges/\" target=\"_blank\" class=\"link-external\">http://www.myfonts.com/fonts/pampatype/borges/</a> <br> <br>Jeremy Tankard's Enigma is worth a look: <br><a href=\"http://www.typography.net/type/enigma.htm\" target=\"_blank\" class=\"link-external\">http://www.typography.net/type/enigma.htm</a> <br> <br>Then there's Delicato, whose designer professes to have been inspired by Enigma and Proforma: <br><a href=\"http://www.veer.com/products/typedetail.aspx?image=FOT0000073\" target=\"_blank\" class=\"link-external\">http://www.veer.com/products/typedetail.aspx?image=FOT0000073</a> <br> <br>As far as sans go, I prefer News Gothic to Trade Gothic, if you're looking for something that's *really* similar. <br> <br>If you want a relatively neutral modern sans, that still has some of the character of the the gothics, consider FF Kievit: <br> <br><a href=\"http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11231.0.0\" target=\"_blank\" class=\"link-external\">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11231.0.0</a></p>"
