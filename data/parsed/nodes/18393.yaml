    html: |-
      <p>Not really. Maybe it will help if I explain what I am working on. I’m making a book about Vincent (the poem by tim burton). This poem is so dynamic, going from sad to happy, cheerful to insane, young boy to old man, etc. that I thought that it would be nice to try and translate the story typographically. So I split the poem up in sentences and took 1 letter from every sentence and made it a lot bigger then the rest. The letter will be used to communicate the feeling of that particular part of the poem. So on every page I’m using bodoni as the text with one letter in the typeface best communicating the mood and everything arranged according to a grid around that letter to even more express the mood.</p>
      <p>So in this case anything will be good really as long as it’s a type that has a well known history since on the left side of the page next to the poem I will give a very brief history of the type used and a little bit about why I used that type to express that mood.</p>
      <p>I’m hoping that with this book I can playfully teach the reader a little bit about different typefaces and how they can be used for communication purposes.</p>
      <p>So I’ll do a little reading into helvetica vs arial (I think these are quite good because everybody uses them so much they should have a place in the book as well, I think). =)</p>
      <p>Thank you very much!!!</p>
      <p>None are so hopelessly enslaved as those who falsely believe they are free.<br>
      -Goethe-</p>
