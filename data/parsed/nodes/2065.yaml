    html: <p>Jason think in terms of the entire line of coffees. What is the color scheme for Decafe for instance? I also would like the background of the logo to be a richer warmer color. Also think about possibly printing on a metalic foil label. That way you could use white as a color to print and the background of regular blend could have a yellow printed over a silver foil and a white regular blend printed over that.  That way you could let the silver knock  out from your richer brown color for your logo. It would be a rich label. In the case I propose you'd need to include the "All in one coffee filters" into the single label. </p>
