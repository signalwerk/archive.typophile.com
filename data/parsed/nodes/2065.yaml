    html: <p>Jason, don't let the logo dictate the marketing. The  marketing is the cream sugar and coffee all in one. I think you should simplify the mark and let the packaging tell the marketing story. So concentrate on a mark that creates an umbrella for the coffee company. What if they came out with a coffee that after you drank it you'd have a mint after taste in your mouth. Ask yourself does the mark allow the coffee company to grow. Dan </p>
