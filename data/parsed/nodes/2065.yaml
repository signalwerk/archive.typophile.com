    html: "<p>So I gather then their is some phonetical reason for the umlaut? <br>Allthough it doesn't seem to connect with the brief you have set yourself or am I missing something? <br> <br>Long ü Short ü  <br>Spelling: üh, ü Spelling: ü, y  <br>Pronunciation: No similar sound in English, but the same as the vowel in French rue. To produce it, say the German long i, then round the lips as for long u. Do not allow your tongue to move toward the back of your mouth as you round your lips. Note the difference between the long rounded back vowel u, and the long rounded front vowel ü. Pronunciation: A shorter version of German long ü. To produce it, say the German short i, then round the lips as for short u. Do not allow your tongue to move toward the back of your mouth as you round your lips. Note the difference between the short rounded back vowel u, and the short rounded front vowel ü.  <br></p>"
