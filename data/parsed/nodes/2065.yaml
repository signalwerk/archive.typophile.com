    html: <p>Jason, <br>Just a quick note and I gues this may be deliberate? but it reads FUS not FYs? which could have both negative and posative implications. Too much fuss. I like the almost hand drawn approach to the three atoms and the way you have ballanced the coffee lettering with some heavy posative kerning, demonstrating some mature typogrphical consideration. Not into the FUZ, not liking the F and Z and I'm not even sure the futuristic look you where going for works with the rest of the sytle. Although there is something appealing about the U, sorry Y?</p>
