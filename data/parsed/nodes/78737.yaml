    <p>The main image is a 1-bit scan from the logo that i received printed on a letterhead (or a business card) many years ago but i don't have the original anymore.</p>
    <p><img src="http://typophile.com/files/c74ccf190af21d93c0f76c60b788ea37.13697.png"></p>
    <p>On the website of the company <a href="http://www.emm-camping-car.com/" title="http://www.emm-camping-car.com/">http://www.emm-camping-car.com/</a> we can find only this small color image…<br>
    <img src="http://typophile.com/files/EMM_gauche_haut.jpg"><br>
    …that allows to guess that the baseline "Europe Matériel Maintenance" (that reminds Triplex) is in the same font than "EMM" (the M looks similar despite of its microscopical size) (it was more obvious on the printed document that i had). Unfortunately there is nowhere on the site any bigger logo.</p>
