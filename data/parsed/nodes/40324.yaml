    html: |-
      <p>If you can figure out how to get the Word Options dialog to show up, for Display you want to Show Measurements in units of millimeters.</p>
      <p>And sure enuff, when you open the Paragraph dialog, Indentation is now set in millimeters, but Spacing &gt; Line spacing: "exactly" &gt; the measurements are still in points!</p>
      <p>So the only way is to calculate how many points to set. Not too difficult; 72 points per inch divided by 25.4 millimeters per inch comes to 2.8 points per millimeter. Multiply by 6 equals 16.8 points.</p>
      <p>I think. Try it. See if it works.</p>
      <p>j a m e s</p>
