    <p>hey guys am a newbie in fontlab could you help me how to select a unicode range using macro?<br>
    like the “select alphanumeric”, I can’t figure out how it selects by unicode range.<br>
    here is the select alphanumeric codes:</p>
    <p>fl.Unselect()</p>
    <p>for i in range(0x41, 0x5b):<br>
      fl.Select(Uni(i))</p>
    <p>for i in range(0x61, 0x7b):<br>
      fl.Select(Uni(i))</p>
    <p>for i in range(0x30, 0x3A):<br>
      fl.Select(Uni(i))</p>
    <p>fl.iglyph = 20</p>
    <p>now how do I change this to select unicode range from Amacron to Gdotaccent?</p>
