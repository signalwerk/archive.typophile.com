      <p>Will, I took a quick look at your site; you've done some beautiful work!</p>
      <p>&gt; a logo inspired by old-fashioned<br>
      &gt; camera manufacturers.</p>
      <p>I'm a graphic designer and I'd suggest that when working with whoever you hire, you suggest that as one possible direction but also let the designer know that you're open to considering other approaches, too. I've found over the years that the logo a client likes best is often totally different than what they had initially expected.</p>
      <p>A retro look based on old camera manufacturers, as you suggested, might work, but on the other hand your work has a contemporary look to me, and I imagine you use modern equipment, so you'd need to be careful that your logo didn't create the wrong impression.</p>
      <p>Since "panoramic photographer" is mentioned prominently on your home page, a logo design with panoramic aspects is an approach I'd suggest considering. Perhaps a business card with panoramic proportions, too.</p>
