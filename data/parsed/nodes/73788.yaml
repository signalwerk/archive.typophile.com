      <p>&gt; Yes. But honestly, it happens the other way round, too.</p>
      <p>I agree. </p>
      <p>It's important for the designer and client to go through the design process with an open mind.  You look objectively at the situation and goals, you do research, you come up with concepts, you critique and modify them (sometimes repeatedly), etc. </p>
      <p>At the end of the process, it may turn out that the designer's initial idea -- or the client's initial idea -- turns out to be the right solution. But sometimes the process takes you to a solution that neither of you expected.</p>
