    <p>Hi Typophiles</p>
    <p>I am looking for a typophile to work with me to design a logo for my photography web site (currently being re-vamped).  I am a London-based photographer and am looking for a logo inspired by old-fashioned camera manufacturers. </p>
    <p>If you're interested in talking further, please get in touch, giving me an idea of your rates for this type of work, and an indication of when you would be able to work on this.</p>
    <p>Many thanks!</p>
    <p>Will</p>
    <p><a href="http://www.willpearson.co.uk" title="www.willpearson.co.uk">www.willpearson.co.uk</a></p>
