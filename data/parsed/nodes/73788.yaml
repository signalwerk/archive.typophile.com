      <p><cite>… the logo a client likes best is often totally different than what they had initially expected</cite></p>
      <p>Yes. But honestly, it happens the other way round, too. Personally I find this equally refreshing to say the least: the *designer* ends up on a path where he didn’t expect to get to initially.<br>
      I just made this experience (again) with the brand design for a small music CD label:<br>
      .<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/tal_1-2_3514.jpg"></div><br>
      .<br>
      Top left is what I suggested first: something clear and strong. Then the client explained in more detail the mood he wanted to evoke. During the conversation I did a tiny scribble (bottom left). Then I scanned the scribble, did some image editing and proposed what is on the right side. – Amazing or not: that was accepted as fitting perfectly …  ;-)<p></p>
      <p>Alas, Will, splendid photographs! I’d apply.</p>
