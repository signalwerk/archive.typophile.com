      <p>Hi James</p>
      <p>Thanks for your reply.  I totally agree and am definitely open to suggestions.  I suppose what I was looking for was something really simple, just clean typography. </p>
      <p>Running searches trying to identify the vimeo font is what bought me to typofile.  I read a thread in the critique forum and thought IanCrombie summed up the requirements beautifully - <a href="http://typophile.com/node/72420" title="http://typophile.com/node/72420">http://typophile.com/node/72420</a></p>
      <p>"Inspired by the script identities of Leitz / Leica and other bygone camera manufacturers, I took the approach of combining a friendly script with mechanical germanic flair. As a photographer both relies on his personality and his technical skill to create images this dichotomy made sense to me."</p>
      <p>I love Ian's final design and typography, but recognise that I'll need something different that fits with my work / site.</p>
      <p>The panoramic business cards idea is also definitely worth considering - thanks for that!</p>
