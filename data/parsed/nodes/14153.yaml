    html: |-
      <p>Having been on this critique area for about 6 months ( or so ) I have not observed the kind of permission you describe being ask for or given. I have just seen people who come on have an idea &amp; solicit for opinions. Sometimes ( mostly ) the opinions are written. Sometimes ( less commonly) an idea is expressed with an image. Sometime people find the ideas ( written or otherwise ) useful and say so - sometimes they are ignored. Sometimes there is a stupid flame war.</p>
      <p>So far folks have either been happy with or ignored what I have to say - or show. It’s been kinda fab.</p>
      <p>I have never seen an objection to images being linked to - until now. </p>
      <p>BTW - Are you making a distiction between referencing an image that you didn’t make &amp; one that you made? This idea of yours is so vague so far…</p>
      <p>But my bottom line is you are suggesting a convention exists that I have never seen. Maybe you’r right about this - but so far I don’t see any evidence. </p>
      <p>When you used the word ‘publish’ I thought maybe you meant something specific by it. May I assume for now that you just mean showing the folks a visual idea on typophile on a thread started by someone other than yourself? Or do you mean even linking to a photo of a sign for instance?</p>
      <p>&gt; so that you didn’t discourage others from posting,</p>
      <p>I can’t figure out what you mean by this. I know you are trying to clarify this idea of yours but so far I am afraid I find it as opaque as ever. Do you think people would be so put off by am image link that they would fail to come &amp; ask for an opinion? Really?</p>
      <p>&gt; everyone has enough imagination to understand the concepts behind your post if they had been published in written form</p>
      <p>Thats a big assertion. I don’t buy it. First of all ‘Everyone’? You have to admit that’s going a bit far. Everyone is too big. Some people are imaginatuion challenged. Thats why there are designers. And that is why we show clients proofs - so they don’t have to imagine using just words. </p>
      <p>Secondly, every medium has it’s strengths and words are powerful to be sure - but they don’t &amp; can’t do the same job as an image. That’s why we have images. Maybe my specific ideas were simple &amp; stupid enough to have been expressed in words - you could have just said that instead of evoking ‘everyone’. </p>
      <p>&gt; Apologies to Greg for hijacking the thread.</p>
      <p>Me too. </p>
      <p>Greg, did you in fact feel injured by my post in some way? If you did I’d like to know. If you did feel irked I hope you know I had no intention of irking you.</p>
      <p>Tim, why don’t you start a thread where you can explain this so far strange point of etiquette. That way we can have this conversation properly &amp; in the right place. And if your point is bourne out then you will have served typophile well &amp; helped me too. However as of now, your idea appears to me to be not a convention to defend, but an uneforceable and incomprehensable innovation - so I think the onus* is on you.</p>
      <p>* <a href="http://dictionary.reference.com/wordoftheday/archive/2002/09/12.html">http://dictionary.reference.com/wordoftheday/archive/2002/09/12.html</a></p>
      <p>Start your thread!</p>
