  html: |-
    <p>This logo is for a Concierge Service that aren’t the traditional “keeper of the keys”. They are basically personal assistants that run errands, secritary duties, cook, clean, remind you of appointments &amp; birthdays, and many more things. </p>
    <p>The hard part of this logo is that you can’t show anything specific from what they do because there is such a large amount of duties. I decided to use time as the center of the name and logo (I thought of the name as well). I don’t like using a clock to represent time. An hour glass seems the best solution.</p>
    <p>In the illustrations, the hour glass is alot more sand in it because Time Design frees up your time. I didn’t want to make the hour glass too specific to an actual hour glass. I tried to simplify it, but I am not happy with it and would like fresh perspectives.</p>
