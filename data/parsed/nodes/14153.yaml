      <p>Eben,<br>
      I was pointing out a convention that has existed for several years on these forums, particularly the critique forum. I was not attacking you or implying that you behaved unethically, this convention was created because some posters did not appreciate uninvited amendments to their designs published (making a point of view generally known).<br>
      I accept and agree that it is sometimes a useful way to express your comments, however you should ask the thread poster before publishing (that word again). I don’t want to put you off posting, I wrote that part of that post so that you would be aware of the convention and so that you didn’t discourage others from posting, and I am certain that everyone has enough imagination to understand the concepts behind your post if they had been published in written form, which might be more useful than a quick &amp; rough sketch.<br>
      Apologies to Greg for hijacking the thread.<br>
      Tim</p>
