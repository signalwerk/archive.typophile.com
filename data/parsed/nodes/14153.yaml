      <p>Eben,</p>
      <p>I agree with Tim.  I’ve read posts here on Typophile for couple of years and I was aware of the convention and I’ve seen it discussed several times.  I’ll see if I can find some links.</p>
      <p>When you comment on (e.g.) logos and suggest improvements using words the designer is free to implement them any way they want, but when they’re shown an image of an improved logo they might not be comfortable adopting that approach since it’s somebody else’s idea, and they’d feel like it didn’t belong to them any longer.  So in a way, you might be robbing them of an avenue they might have travelled down on, if they could’ve done most of the legwork themselves.</p>
      <p>This is just how I feel.  So it might be a good idea to ask for permission first… and I’m in no way admonishing you (at all) since you weren’t aware of the convention and were just trying to help.</p>
