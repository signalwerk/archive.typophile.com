    html: |-
      <p>Greg,</p>
      <p>I agree with BartvanderGriendt that the name works, but as he and others have said, you’re emphasizing the less important aspect: the passage of time. Why not emphasize its organization (it’s ‘design’). Also, I think the imagery you’re using is counter-productive. Hourglasses and sundials imply older, slower technologies and a certain pastoral simplicity (though I like your original designs). Does a modern ‘time design’ service would want these elements associated with them? If you do use them, I’d make them much more modern and abstract. However, the idea of organization seems more important to the concept.</p>
      <p>The style of mark you’re working with now is well integrated with the type. The character of Rotis and the illustration match, but as Eben said, there are a lot of wispy details. If you print these at a smaller size, they may break or disappear. However, and this is entirely a personal preference, Rotis is really overused right now and isn’t that great anyway. Honestly, I’d drop it. What is it saying for Time Design? I’m not sure it’s saying anything beneficial.</p>
      <p>I prefer the design with the hourglass in the ‘g’. Also, I think the type benefits from tighter setting and a cutom adjustment or two (like the ‘Ti’), but I’m not sure about the second headless i.</p>
      <p>It’s an interesting design problem. I can see the good ideas in your work and look forward to see where you go with it.</p>
