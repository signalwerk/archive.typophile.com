      <p>400, H, and 120 are Helvetica Bold (the H has been artificially condensed):<br><a href="https://www.myfonts.com/fonts/linotype/helvetica/">https://www.myfonts.com/fonts/linotype/helvetica/</a></p>
      <p>PRO is something else entirely, and I’m not finding a spot-on match. Ocean Sans Semibold Extended has similar proportions, and could be edited to match:<br><a href="https://www.myfonts.com/fonts/adobe/ocean-sans-mm/">https://www.myfonts.com/fonts/adobe/ocean-sans-mm/</a></p>
