    <p>Hi,</p>
    <p>I my tests I've found that if you try to generate a non 'style-linked' family and therefore you do not check 'Font is Bold' checkboxs, then in Corel 12 (running in a PC) no Bold, SemiBold or Black version will show up in the font menu.</p>
    <p>The only way to see them  in Corel's menu is by marking them as 'bold' in the checkbox (which is indeed not recommended by Karsten Lücke in his paper (<a href="http://www.kltf.de/downloads/FontNaming-kltf.pdf" title="http://www.kltf.de/downloads/FontNaming-kltf.pdf">http://www.kltf.de/downloads/FontNaming-kltf.pdf</a>)</p>
    <p>Would I do any harm if I use the checkbox 'Font is Bold'  while making a non 'style-linked' family?</p>
    <p>Any advice?</p>
    <p>Ramiro E.</p>
