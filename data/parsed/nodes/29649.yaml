    <p>Hi everyone,</p>
    <p>I did the logo below for this Nicaraguan/UK environmentally sustainable surfboard company a few years ago...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OGfrontLogo_5459.gif"></div><p></p>
    <p>Now they are getting ready to go global and a makeover seemed in order.</p>
    <p>They produce a range of hand crafted hollow balsa and natural fibre surfboards that compete in both performance and price with the usual polychemical factory boards.</p>
    <p>Key words for the brand image include...</p>
    <p>Environmental<br>
    Quality / Craftsmanship<br>
    High Performance<br>
    Classic / Timeless<br>
    Slightly Retro<br>
    Stylish / Cool</p>
    <p>So is this new version better than the old...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OGLogoV2Proof01a_5364.jpg"></div><p></p>
    <p>Here's a simulated decal on a balsa and hemp board...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/OGLogoV2Proof01b_4632.jpg"></div><p></p>
    <p>Is the design any good at all? Any feedback would be great. I feel a real responsibility for this one.</p>
