      <p>Thanks guys for the feedback so far, and especially your enthusiasm Choz.</p>
      <p>Don't look at their website just yet. It's horrid and since that site was done the boards have improved 1000%. I'm in the process of giving the site a facelift too.</p>
      <p>The original logo type was hand lettering. That was back when i thought that kind of style was cool. The 2 waves in the first design were trying to suggest an O and G.</p>
      <p>I considered Cooper Black for the new version (what with the old Beach Boys Pet Sounds connection) but i think that typeface is still too retro despite it's recent trendy resurgence. And i didn't think it's flabby rounded serifs complimented the waves tapered strokes.</p>
      <p>A classic / timeless vibe is more important than a retro one. But it also needs to appeal to a youth dominant market as well as the more mature surfer if possible.</p>
      <p>One reason for the choice of font on the new version was to have an O which was perfectly circular (before slanting) both inside and out, so that it balanced with the negative circular space at the center of the wave. Therefore a typeface with a mono stroke width was needed.</p>
      <p>Todd, thanks for your visual, but i felt any swirliness in the font may detract from the impact of the wave.</p>
      <p>Lex, i like your Saracen suggestion. It could inspire a hand lettering job with slightly more subtle and contemporary serifs, maybe a mono stroke width and definately italic.</p>
      <p>And thanks Bill, for your comment "The mark itself is exciting". That's the kind of reassurance i needed :)</p>
      <p>Below is a pic of a leaflet i did for Ocean Green a little while ago which has a more up to date image of one of their boards than what's on the current website. The grungy style was to appeal to a particular surf comp/festival youth audience, but it's been decided to go with a slicker look since then.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/OceanGreenEcoFoilThruster01_5018.jpg"></div><p></p>
