  html: "<p>Hey everyone, <br> <br>A fellow student and I are creating a design studio freelance gig thing for a credit here. We came up with the name Letter Studio and now  we're working on a logo. There are several issues we have come up with in regards to these designs. <br> <br>Our idea was to have the T also look like an 'H'  to represent us, our last names being Helms and Heffron.. its also split into two halfs. Do the two t's on  #3 look like  ' F 's ? Is the nature of the top of the ' L'  less comfortable as far as readability? <br> <br> <br>Thanks for any comments. <br><img src=\"http://www.typophile.com/forums/messages/4100/19852.gif\" alt=\"logo\"></p>"
  html_clean: "<p>Hey everyone, <br> <br>A fellow student and I are creating a design studio freelance gig thing for a credit here. We came up with the name Letter Studio and now  we're working on a logo. There are several issues we have come up with in regards to these designs. <br> <br>Our idea was to have the T also look like an 'H'  to represent us, our last names being Helms and Heffron.. its also split into two halfs. Do the two t's on  #3 look like  ' F 's ? Is the nature of the top of the ' L'  less comfortable as far as readability? <br> <br> <br>Thanks for any comments. <br><img src=\"http://www.typophile.com/forums/messages/4100/19852.gif\" alt=\"logo\"></p>"
