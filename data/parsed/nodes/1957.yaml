    html: "<p>Drew. <br> <br>Your getting lots of suggestions. Here's a few more: <br>Try that curve on the inside of the e's - top round, bottom flat. Then try using that curve to form the r (flat on bottom, curved on top). <br> <br>BTW, all those nice little slits are going to close up at small size. You're probably better off just closing them up. Your letterforms will be unique enough without it. (if you choose to try this, you can still do the curve suggestion above, just overlap a tiny bit.) <br> <br>Randy</p>"
    html_clean: "<p>Drew. <br> <br>Your getting lots of suggestions. Here's a few more: <br>Try that curve on the inside of the e's - top round, bottom flat. Then try using that curve to form the r (flat on bottom, curved on top). <br> <br>BTW, all those nice little slits are going to close up at small size. You're probably better off just closing them up. Your letterforms will be unique enough without it. (if you choose to try this, you can still do the curve suggestion above, just overlap a tiny bit.) <br> <br>Randy</p>"
  - id: 15561
    user: 2403
    date: 2003-11-07T09:21:00
    date_raw: 7 Nov 2003 — 9:21am
    votes: null
    html: <p>Thanks alot of the suggestions guys. <br>I can see how all these important issues with my logo that you guys are bringing up goes right back to my typography class i'm in right now.. <br> <br>Daniel - Good point, I was actually trying that because the typeface was orginally like that.. but then i realised that using that would not only look bad, but wouldn't represent my ideas for the design. <br> <br>Hrant - I understand what Randy is saying, that at a small size it isnt really noticible. Maybe I've just been looking at it too long, but doesnt it seem akward joined? The rest of the letters have this rythmic space inbetween them and then one large glyph without a space looks weird. I guess if I join them all together it woudnt look bad. <br> <br> <br>Tiffany - Thanks for your suggestion. Do you think flipping it would create the same problem in my first designs.. that it would look like two tottaly differnt characters.. an 'f' and a 't'? <br> <br>Randy.. good point, I didnt think about the size thing with the gaps. But the 'R' .. your right on the money. I didn't even consider that. I mean, I know that it looked off, but I wasnt sure why. Making it more similar to the counter space of the 'E' has made the design more cohesive I feel. <br> <br>I'm trying to figure out what else I could do to this. Perhaps back to the drawing board. This forum is a great tool and is helping me learn alot about typography and design in general.. I just don't want it to seem like I'm coming here for someone to hold my hand and make the design for me, you know? Albeit, these suggestions are very helpful and have definately improved the design. I guess, as long as I understand why it makes the design more effective. <br> <br>Thanks again everyone <br> <br>Drew <br> <img src="http://www.typophile.com/forums/messages/4100/20014.gif" alt="letter 3"></p>
