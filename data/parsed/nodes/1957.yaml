    html: "<p>Of this batch, bottom is best. <br> <br>Ok, looking at the 2 t's: <br>The spacing is bad. Check the space between et vs. te vs. tt, they should visually the same, and all should be tighter to jive with the le and er spacing. <br> <br>The x-height seems too close to the ascender height. Seems like you have 2 choices: 1) raise up the L and the TT, and 2) lower them both to x-height, ok and 3) raise the L, but lower the TT. (maybe best?) <br> <br>Hard to tell from the gif, but double check to make sure the L isn't below the baseline. <br> <br>Randy</p>"
    html_clean: "<p>Of this batch, bottom is best. <br> <br>Ok, looking at the 2 t's: <br>The spacing is bad. Check the space between et vs. te vs. tt, they should visually the same, and all should be tighter to jive with the le and er spacing. <br> <br>The x-height seems too close to the ascender height. Seems like you have 2 choices: 1) raise up the L and the TT, and 2) lower them both to x-height, ok and 3) raise the L, but lower the TT. (maybe best?) <br> <br>Hard to tell from the gif, but double check to make sure the L isn't below the baseline. <br> <br>Randy</p>"
