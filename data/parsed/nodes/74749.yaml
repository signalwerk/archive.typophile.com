      <p>In fact commissioning a custom font is a great way larger companies can save money! And establish a unique (or at least distinct) visual identity in the process. On the other hand, getting a (legal) derivative of a "famous" font won't achieve that since the owner of the original typically wouldn't want to <em>lose</em> money. So the way to do it is find a modest but capable type designer to make a new font close to a style that you'd like. But yes, not <em>uncomfortably</em> close... lest you make the mistake that UPS did.</p>
      <p>hhp</p>
