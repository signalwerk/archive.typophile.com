  html: |-
    <p>This is mainly a question about licensing - apologies to those who were expecting something more exciting! With the age old problem of keeping typographic consistency within a large organisation (2000+ staff) I wanted to know: is it feasible for us to get slightly different cuts of dax/trade gothic done which we can rename and roll-out to all computers in our organisation for letters, presentations etc, rather than paying for a 2000 user license? if so, how much does a font have to be changed before you can own it in that way, and how much time/cost is it likely to incurr?</p>
    <p>Really just wanted to hear from a professional whether they thought this is the best way to go on this issue?</p>
    <p>thanks.</p>
    <p>Owen</p>
