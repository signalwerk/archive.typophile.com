      <p>As Ray mentions, many of the larger foundries customize their own typefaces and type families all the time. As far as I am aware, the process is typically two-fold. First, the customer licenses the number of font weights for the number of seats that they want. Then, the font files are modified according to the customer's design wishes, and the fonts are also occasionally renamed. These edited files are the fonts that the customer uses (they use the fonts on to the number of seats they purchased licenses for).</p>
      <p>The total fee (at least for the typefaces you mentioned) is likely less than what a custom, brand-new, from scratch, family of comparable quality would run at an outside designer or firm.</p>
