      <p>Hrant, $226 is the price of a 5 user license. 6 weights, no italics.</p>
      <p>I think a more probable use case for 2000 users would be a »Basic Set« of four style-linked fonts: <a href="//www.fontshop.com/fonts/downloads/fontfont/ff_dax_offc_basic_set/" rel="nofollow">Dax Offc Basic Set</a> (Regular, Italic, Bold, Bold Italic), for which the 5-user license is $142 (~ $28.40 per user).</p>
      <p>A 1000 user license for the Basic Set is $3124 (~ $3.12 per user; for 2000 users you would have to ask for a quote) at fontshop.com.</p>
      <p>But I agree, if you need more than these few styles, and can spend some more money, why not have somebody draw something unique that fits your company better.</p>
