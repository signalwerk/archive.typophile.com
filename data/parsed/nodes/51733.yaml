      <p>Raphael,</p>
      <p>So you hold that there are only nikkudot, which do not include metteg, and taamim, which do include metteg.</p>
      <p>Though the function of metteg with nikudot is different than metteg with taamim.</p>
      <p>Athough the metteg's graphical form is the same, their grammatical function differs.</p>
      <p>You also think that Shai Lemora's symbol for shvana looks like a football.<br>
      Do you think Kehot's small asterish looks like a hotdog, or is OK?<br>
      Does ArtScroll's rafe-like horizontal line look like a pickle? Sometimes over a vov or even a gimmel it is wider than them, like a deflated blimp.<br>
