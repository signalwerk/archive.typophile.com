      <p>@ Telishah: This is Telishah Gedolah and not Ketanah. </p>
      <p>When the stress is on the first syllable, you're going to see only one telishah (short words-- two letters); when the stress is on the second syllable (red arrow), then a second telishah gedolah is above the accented letter. However, this is an aid; to help the reader;<br>
       there's always a second telisha with any word with sheva na, or chataf; that said, sheva na, or chataf can't "hold" the melody.<br>
