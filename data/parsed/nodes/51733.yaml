      <p>Just out of curiousity, Raphael, how were they "mispronouncing" the prayers? I put that in quotes because according to the essay by William Chomsky on the shva that came up in these discussions, it is very questionable whether the "correct pronunciation" was ever correct. He says that historically the current views on the correct places to pronounce the shva have their origin in the views of David Kimchi, also known as RaDaK. But if I read him rightly--and I am a novice at this--these were conjectural attempts to make sense of the Tiberian system of nikkud, and are of doubtful value. </p>
      <p>He says that within living memory both Ashkenazi and Sfaradi speakers of Hebrew have followed much simpler spoken rules. These have been: 1. Pronounce a shva if it is under a prepositional prefix or a conjunctive vav. 2. Pronounce it if it is under the first letter, and the first letter is a 'liquid consonant'--yod, mem, nun, lamed, and resh. 3. It is the second of two successive shvas. (I suppose the rule about two successive letters, eg hallelujah, applies also.)   </p>
      <p>So, for example in k'tana and g'dola (little and big, feminine) the shva at the beginning is a shva nach, contrary to the 'right' rules which say that it is sounded. </p>
      <p>So if ignoring the supposed 'right' rules for the shva na is all they are doing 'wrong' my feeling is: "if this is wrong, I don't wanna be right", to paraphrase a country song.</p>
