      <p>If there are no taamim, then a rafe also works graphically because a horizontal line fits with the letters (eg a patach).</p>
      <p>Regarding the meteg. There is no meteg in nikud. However, traditionally just as Artscroll "incorrectly" use a rafe to indicate a shva na, the meteg was used "incorrectly" to indicate a mileil.</p>
