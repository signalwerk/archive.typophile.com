      <p>my critique:<br>
      1. putting a football over a Hebrew letter isn't very typographically aesthetic imho<br>
      2. the chirik under the first lamed is too far to the firght.<br>
      3. the shva doesn't sit correctly under the resh.<br>
      4. The kadma over the nun needs to move to the left.<br>
      5. the mercha under the chaf is too far to the right.<br>
      6. The lower nikud in general are too close to the letters.<br>
      7. the lower taamim have been lowered for some reason. It looks odd to me.<br>
      8. The font needs to be kerned a little better. The vav and nun need to be closer together for example.</p>
      <p>not exactly what I would call good typography, but that's just my opinion...</p>
