      <p>Raphael: <cite>Yes, but that is my point. With the furtive patach, you can encode it (if people actually want it is another question), but I still don’t see how you are going to even encode the kamatz katan. Even with our siddur we have made editorial decisions as to what is a kamatz katan or not based on various sources and changed our minds. How are you going to allow a person what to do?</cite></p>
      <p>I always cite the easy example of the Hebrew word for afternoon which the first kamatz is katan according to sefardim and gadol according to ashkenazim (and that’s an easy one). You have yet to address this problem.</p>
      <p>gohebrew: <cite>I would make all the different forms of kamataz katan. People can chose which glyph they want.</cite></p>
      <p>Chocalate for chocalate lovers; vanilla for vanilla lovers; and even strawberry for those daring type.</p>
      <p>If a GSUB routine can be written whereby ordinary kamatzes will be selectively replaced with one form of kataz katan, then so it shall be.</p>
      <p>I then make three nearly identical versions of the font, each with a different default. If you pay extra, you get chocalate. If you pay extra, you get vanilla.</p>
      <p>About kamatz katan for Ashkenazim, I was told by Israel-based kollel Hemdat HaAretz (the halachic decider for the OU) that even for them it is an issue, just not in recognizable pronunciation.</p>
      <p>I think they mean on how it impacts the shva-na.</p>
