    <p>Can the kamatz katan, meteg, and shva-na be automatically inserted by a "smart" OpenType font?</p>
    <p>David and Raphael say not. Israel says yes. John Hudson thinks maybe. William just thinks. :) Davis starting to think yes, too.</p>
    <p>Is there any different between a kamatz katan, a chataf kamatz, and a chataf kamatz katan?</p>
    <p>Raphael says no. Israel says yes. Prof. Dotan wonders. David didn't comment.</p>
    <p>Join the fun, and express your opinion. Loser buys lunch. (watch out, I'm hungry)</p>
