      <p>David,</p>
      <p>From studying patterns, I noticed that whenever the second letter was a shva, following a hei hayedi'ah, a hei with a patach, then the shva of the second letter was always na and not nach.</p>
      <p>In your two examples, you see that too.</p>
      <p>I posted other examples.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/et_habracha_shvana_6263.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/samples_ha_shvana_4271.jpg"></div><p></p>
      <p>I am certain that there is a different grammatical rule that these examples fall under.</p>
      <p>But, remember, David, I am seeking to define context based rules. At first, Prof. Dotan got emotional, and insisted that this was impossible. Then, he though out it for a long time, and concluded it was possible.</p>
      <p>When I asked R' Rabin in Toronto, he though long and hard about this, and concluded that it would take a lot of "sorting out", but it was in deed possible. But according Rav Henna (Hanau), it was most difficult, but was also possible.</p>
      <p>I think the key lies in old Kehot prayerbook which provides over a thousand examples of Rav Henna's system, and Shay Lemora's books which provides over a thousand examples of Minchat Shai's system.</p>
      <p>Where would I best read and analyze the significance of the seguence of the nikkud, and how one nikkud which precedes another nikkud 'influences' it. Where is the inter-relationship of different nikkud discussed?</p>
      <p>In a different type of thought, we see that each taam has a dual function in (a) cantillation grammar and (b) melody. Where is it discussed the interelationship between these two factors and each kind of taam?</p>
