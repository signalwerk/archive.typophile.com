      <p>I think the use of a rafe horizontal bar is not proper, because letters have different widths, from narrow to wide.</p>
      <p>If the rafe bar is one size fits all, over narrow letters its too wide, and over wide letters its too narrow.</p>
      <p>Using a round symbol like an asterisk is suitable for different widths.</p>
      <p>Your rejecting the Kehot asterisk or Shay Kemora's "football" ib favor of ArtScroll's rafe symbol, or the over emphasized extra bold shva is simply an issue of taam verayach - personal preference, with no logic. I like it this way; I don't like it the other way.</p>
      <p>Such lack of logic and reason is not convincing at all.</p>
      <p>For example, the elongated kamatz katan is hardly similar in bold emplasis like the highlighted shva. Are you a graphic artist? </p>
      <p>The one is weighted like the other nikkud, but shaped differently. The other is very very differently that any other nikkud, and draws way too much attention to itself.</p>
      <p>The small asterisk doesn't fraw any extra attention. Furthermore, according to the Minchat Shai's definition of shvana, it never occurs when there is a upper taam in its place. I checked.</p>
      <p>Now, this seems to imply that there is a relationship between thr tules of shvana and the taamim, even though we don't know what is yet.</p>
      <p>I think Rabbi Shmuel Yehuda Winefeld of Shay Lemora chose the football=like asterisk inside a circle to distinguish his Minchat Shai-based shvana symbol from Kehot's Rav Henna (Hanau)'s asterisk shvana symbol.</p>
      <p>So, in conclusion, ArtScroll's rafe symbol is illogical while Kehot's asterisk symbol is not.</p>
      <p>In my view as a professional graphic artist, there is nothing wrong with the current depiction of the kamatz katan.</p>
      <p>Regarding the meteg's widespread usage in non-taamim text, "go fight city hall" if you think that it will change. It ain't gonna happen.</p>
