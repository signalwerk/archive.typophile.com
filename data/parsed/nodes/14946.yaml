    <p><a href="/wiki/SOTA" class="wiki">SOTA</a> is making plans for its eighth conference, TypeCon2006, which will be held in Boston next July. Anyone in Boston/New England interested in volunteering and helping plan the conference should get in touch now. It’s fun, relatively painless, and you can have a say in making TC06 the best <a href="/wiki/TypeCon" class="wiki">TypeCon</a> ever. We’ll be coming to Beantown in October for planning meetings, but in the meantime, we’re starting on programming, workshops, venues, design, tours, and much more.</p>
    <p>To get involved, post here and/or email me privately at tamye /at/ typesociety.org, and I’ll be in touch.</p>
    <p>Non-Bostonians are also very welcome and encouraged to volunteer and help create a wonderful event! We have such an amazing group of volunteers each year - I can’t wait to work with old friends and new faces.</p>
