    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: <span class="caps">FF</span>&nbsp;Legato</strong></p>
    <p>The following text about <span class="caps">FF</span> Legato was written by its creator, <a href="/node/14630" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Evert Bloemsma</a> in <a href="http://typophile.com/files/ff%20-%20legato_about.pdf">this <cite>About <span class="caps">FF</span> Legato</cite> <span class="caps">PDF</span> file</a>.<br><img src="/sites/default/files/old-images/legato110906pdh01_5788.gif"><br>
    Most <a href="/node/12132" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">sanserifs</a> have very basic geometric shapes (like <a href="/node/12494" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Futura</a>), even those built using classical proportions (like <a href="/node/12627" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gill Sans</a>). But this is not the most satisfactory approach when trying to visually connect separate characters, which in turn usually leads to most long texts being set in serifed&nbsp;typefaces.</p>
    <p><span class="caps">FF</span> Legato abandons the idea of a sanserif consisting of simple rigid forms. The mirrored image below shows how (different from typefaces like Gill Sans and <a href="/node/15603" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Syntax</a>) movement and direction is expressed by outer- and inner-forms behaving relatively independent, and is maintained through all <a href="/node/14703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">weights</a>. It makes characters refer to previous and next letters to build better words and&nbsp;lines.</p>
    <p>Many sanserifs published these days combine a ‘pleasant’ appearance with a conventional construction. This is just what I wanted to avoid designing <span class="caps">FF</span> Legato. In discussions <span class="caps">FF</span> Legato has been compared with typefaces like <a href="/node/add/wiki?edit%5Btitle%5D=Finnegan" title="Create node &quot;Finnegan&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Finnegan</a> (<a href="/node/13697" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Linotype</a>) and <a href="/node/add/wiki?edit%5Btitle%5D=Cronos" title="Create node &quot;Cronos&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cronos</a> (<a href="/node/13428" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Adobe</a>). <a href="/node/14546" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Contrast</a> of such faces is strong and along a single vertical <a href="/node/79582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Axis</a>; vertical bars are emphasized. This becomes clear when looking at a character like the lowercase ‘o’ at bolder weights. The construction establishes a strong rhythm but does not necessarily improve word&nbsp;images.</p>
    <p>On the contrary; it optically splits up words into single letters with stems as independant elements, just as our alphabet already splits up terms in separate units on a ‘system-level’. Often the resulting austerity is then masked, for example by decorative details suggesting the touch of a brush or nib. Such typefaces will work fine for packaging etc. but their use for larger texts is questionable and they may not fit contemporary, transparent graphic&nbsp;design.</p>
    <p>In <a href="/node/add/wiki?edit%5Btitle%5D=1993" title="Create node &quot;1993&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1993</a> my rather experimental <a href="/node/add/wiki?edit%5Btitle%5D=FF%20Balance" title="Create node &quot;FF Balance&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Balance</a> was published. It completely reverses the conventional contrast (‘incorrect contrast’); horizontal parts are thicker than vertical parts. The illustration below compares the sanserifs <a href="/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a> (emphasizing vertical parts), <span class="caps">FF</span> Balance (emphasizing horizontal parts) and <span class="caps">FF</span> Legato (emphasizing diagonals from the upper left to the lower right). Each one of them builds a different rhythm, creates a different interaction between the characters; a different&nbsp;continuity.</p>
    <p><span class="caps">FF</span> Legato was recognized as one of its <a href="http://typographi.com/000969.php">Favorite Fonts of 2004</a> by the type blog, <a href="/node/12035" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographica</a>.</p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/7740">Legato <span class="amp">&amp;</span> Points</a><br><a href="http://typophile.com/node/55783">What Makes Legato So&nbsp;Unique?</a></p>
    <p><strong>External Links:</strong><br><a href="http://www.fontshop.com/search/?q=FF%20Legato"><span class="caps">FF</span> Legato at&nbsp;FontShop</a></p>
