    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Legato</strong></p>
    <p>The following text about FF Legato was written by its creator, <a href="/wiki/Evert%20Bloemsma" class="freelinking" rel="nofollow">Evert Bloemsma</a> in <a href="http://typophile.com/files/ff%20-%20legato_about.pdf" rel="nofollow">this <cite>About FF Legato</cite> PDF file</a>.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/legato110906pdh01_5788.gif"></div><br>
    Most <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sanserifs</a> have very basic geometric shapes (like <a href="/wiki/Futura" class="freelinking" rel="nofollow">Futura</a>), even those built using classical proportions (like <a href="/wiki/Gill%20Sans" class="freelinking" rel="nofollow">Gill Sans</a>). But this is not the most satisfactory approach when trying to visually connect separate characters, which in turn usually leads to most long texts being set in serifed typefaces.<p></p>
    <p>FF Legato abandons the idea of a sanserif consisting of simple rigid forms. The mirrored image below shows how (different from typefaces like Gill Sans and <a href="/wiki/Syntax" class="freelinking" rel="nofollow">Syntax</a>) movement and direction is expressed by outer- and inner-forms behaving relatively independent, and is maintained through all <a href="/wiki/weight" class="freelinking" rel="nofollow">weights</a>. It makes characters refer to previous and next letters to build better words and lines.</p>
    <p>Many sanserifs published these days combine a ‘pleasant’ appearance with a conventional construction. This is just what I wanted to avoid designing FF Legato. In discussions FF Legato has been compared with typefaces like <a href="/wiki/Finnegan" class="freelinking" rel="nofollow">Finnegan</a> (<a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>) and <a href="/wiki/Cronos" class="freelinking" rel="nofollow">Cronos</a> (<a href="/wiki/Adobe" class="freelinking" rel="nofollow">Adobe</a>). <a href="/wiki/Contrast" class="freelinking" rel="nofollow">Contrast</a> of such faces is strong and along a single vertical <a href="/wiki/axis" class="freelinking" rel="nofollow">axis</a>; vertical bars are emphasized. This becomes clear when looking at a character like the lowercase ‘o’ at bolder weights. The construction establishes a strong rhythm but does not necessarily improve word images.</p>
    <p>On the contrary; it optically splits up words into single letters with stems as independant elements, just as our alphabet already splits up terms in separate units on a ‘system-level’. Often the resulting austerity is then masked, for example by decorative details suggesting the touch of a brush or nib. Such typefaces will work fine for packaging etc. but their use for larger texts is questionable and they may not fit contemporary, transparent graphic design.</p>
    <p>In <a href="/wiki/1993" class="freelinking" rel="nofollow">1993</a> my rather experimental <a href="/wiki/FF%20Balance" class="freelinking" rel="nofollow">FF Balance</a> was published. It completely reverses the conventional contrast (‘incorrect contrast’); horizontal parts are thicker than vertical parts. The illustration below compares the sanserifs <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> (emphasizing vertical parts), FF Balance (emphasizing horizontal parts) and FF Legato (emphasizing diagonals from the upper left to the lower right). Each one of them builds a different rhythm, creates a different interaction between the characters; a different continuity.</p>
    <p>FF Legato was recognized as one of its <a href="http://typographi.com/000969.php" rel="nofollow">Favorite Fonts of 2004</a> by the type blog, <a href="/wiki/Typographica" class="freelinking" rel="nofollow">Typographica</a>.</p>
    <p><strong>Discussion:</strong><br>
    <a href="http://typophile.com/node/7740" rel="nofollow">Legato &amp; Points</a><br>
    <a href="http://typophile.com/node/55783" rel="nofollow">What Makes Legato So Unique?</a></p>
