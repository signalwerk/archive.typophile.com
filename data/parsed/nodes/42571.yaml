    html: <p>thanks chipman. it's my own type. the whole thing is connected and rather than a linear gradient, the colour transforms along the direction of the line. I drew it all out on graph paper, noted the co-ordinates and added all that data to a script to draw the bugger. I think it was done in 2003 maybe 04.</p>
