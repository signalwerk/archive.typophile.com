      <p>Psychology. They want to seem as if they're putting you in your place. It sets an uncomfortable precedent for the future: they're right and you're wrong. They sound somewhat arrogant actually. No big news here. Most graphic designers -- and moreso with those in 'high' positions -- as well being conservative, insular and unimaginative, are drunk with self-importance.</p>
      <p>did they say anything positive? how do you feel it went?</p>
      <p>honestly, sometimes people say you havn't been creative enough with your folio presentation, and other times the contrary. it's a minefield. to quote larry david: you just can't leave your house.</p>
