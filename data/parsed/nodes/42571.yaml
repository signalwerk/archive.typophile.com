      <p>I think nick was joking ch! I hope so :-) Seriously though, for me language is there to be warped, neologised, parodied, poeticised, ignored and more. It's a toolbox, not a doctrine. We need convention to communicate, but there is a lot of room for manoeuvre. The crux lies in whether meaning is communicated and even then it's a minefield of variables.</p>
