    <p>Yesterday I had my first ever portfolio presentation for a design agency. They absolutely tore me apart, but still wanted me to work with them. Interesting people:)</p>
    <p>First and foremost they really didn't like that I had "designed the portfolio". They told me my work should be enough on it's own.<br>
    One of the designers had to fetch his glasses to read my captions.<br>
    They rolled their eyes over some of my work, and also told me the way I presented it was terrible.</p>
