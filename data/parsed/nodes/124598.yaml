    html: |-
      <p>The lettering is in a pastiche of styles used in Hollywood medieval movies. A flavor of German and Olde English blackletter, seasoned with tendril and ball decorations etc.<br>
      For the blackletter lowercase the best general fit might be Morris Gothic, Digitized by HiH <img src="/sites/default/files/old-images/MorrisGothicAsGlenwood_3768.gif"><a href="http://www.myfonts.com/fonts/hihretrofonts/morris/">http://www.myfonts.com/fonts/hihretrofonts/morris/</a> also by Richard Kegler for P22 <a href="http://www.myfonts.com/fonts/p22/morris/">http://www.myfonts.com/fonts/p22/morris/</a><br>
      For the _o_  consider Will Bradley's 1894 lettering as made into a font for American Type Founders in 1895. Digital by Nick Curtis as Fyne Fish NF <img src="/sites/default/files/old-images/FyneFishNFAsGlenwood_4197.gif"><a href="http://www.myfonts.com/fonts/nicksfonts/fyne-fish-nf/">http://www.myfonts.com/fonts/nicksfonts/fyne-fish-nf/</a><br>
      For some tendril and ball decorations consider Euclid by Central Type Foundry in the 1880s. Digital by Nick Curtis as Oh You Klid NF<img src="/sites/default/files/old-images/OhYouKlidNFAsGlenwood_5371.gif"><a href="http://www.myfonts.com/fonts/nicksfonts/oh-you-klid-nf/">http://www.myfonts.com/fonts/nicksfonts/oh-you-klid-nf/</a><br>
      Don</p>
