    <p><img src="/sites/default/files/old-images/glenwoodletter_6450.jpg"></p>
    <p>Trying to identify a typeface used on an old theater sign in Kansas City. The top sign was the original from when the theater opened in the late 60s, the middle and bottom are from the "new" theater that was opened down the street when the original was torn down in 2000 (middle being a picture of interior signage and bottom being the new sign). There are slight differences, but they appear to be derived from the same source.</p>
