      <p>&gt;Platforms are immaterial today.<br>
      That's what I am hoping for. I am more proficient with InDesign than with Quark family, but I've heard (for the moment, only heard) about systems, like Quark Publishinig System, which supposedly streamlines the whole process. The question is — do I need it from the start up (probably, no), will I need it later, in 5 years, when the publication grows from a quartely issue to a monthly publication? If yes, should I start with Quark from day one? Is there a system like this, which can be incorporated into Creative Suite workflow?</p>
      <p>Prepress<br>
      To put it straight — we are based in Frankfurt/Main, Germany. Our whole clientele is in Russia and neighboring countries. So obviously the publication is thought to be set in Russian language. I am not sure if it makes any difference for a german prepress house to set text in Russian or German, but I would consider having someone in-house, where I can look over the shoulder and help with the stuff. But then again, it's not only about setting type. Will I find someone that good in DTP here in Germany? Or should I split the work between typesetting in-house and everything else as an external job?</p>
      <p>Staff<br>
      I've thought about starting with a full-time editor, an art director/production director, a full-time sales manager and myself as a creative director and project manager. If everything goes fine, the staff should grow with couple of editors, couple of sales/ad people, designers (possibly to return preproduction back in-house). I will definitely need a freelance translators, writers and photographers. This too is a field which I have to learn yet (though, this one seems least alien to me of all other aspects of the job).</p>
      <p>Software<br>
      As mentioned before, Adobe CS on a PC platform would be my obvious choice. At the moment we work on high-end Dell PCs (Core Duo + 4Gb Ram) and Eizo CE210 screens (hardware and software calibrated). I like the setup and do not know if an Apple with its Cinema displays would do better here. And I would be happy to spend some dough on new and custom type. :)</p>
      <p>Agencies<br>
      As for the outsourcing the whole process completely — it is my intention to spring out from the company with this project and actually ground an agency, which would do corporate publishing (as it is named in Germany and Russia), advertising localization, graphic design, industrial design, architecture (I like mini-toys and would be proud to have time to design a good chair :) ). So I am not really interested in giving out 80% of job to an agency and later trying to convince everybody, that I can do it better or more effectively or for less money or whatever. But you do have a point - I have to better inform myself about the whole thing. Any resources are very valuable for me, so, hey, thanks for the links.</p>
      <p>P&amp;L<br>
      In my 5 years span, the publication will be profitable from year 3 if everything runs as I have it described in my plan. Taking into consideration that I am new to the business, I tip, that the actual proceedings will differ from the original figures. And this is where my anxiety lies. How do I convince my sole investor, that this whole thing might get profitable only if he invests enough and keeps supporting me for another couple of years? It is obviously marketing in the first place and to get profitable it should get authorative in its field = time, money, efforts. The reasons for this should be very good and certainly a chance of getting profitable should not be excluded completely.</p>
      <p>Don and marcox, thanks for the insight. I do appreciate it.</p>
      <p>Cheers,<br>
      A</p>
