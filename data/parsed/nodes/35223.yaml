    <p>Hi,</p>
    <p>I am looking for any kind of information about equipment needed to set up a small team of art directors, authors and production designers to run a magazine. As silly/arogant/non-descriptive as it may sound, it is a question of resources I have to present to the investor, who is interested in starting a corporate publishing project. Should I ask it elsewhere, please let me know the resources (forums, articles, human contacts) where I could educate myself.</p>
    <p>Big thanks in advance.<br>
    -A</p>
