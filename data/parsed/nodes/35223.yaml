      <p>I published a Custom Magazine several years ago. Initially, I started with two Macs, a scanner, a good color laser printer for my own proofs and a staff of one other 3/4 time editor and about five part-time writers/editors. Started showing a profit in three issues, and by the time I quit it (to dedicate myself to other interests) it had a national distribution through niche stores and subscriptions, reaching into 32 U.S. states and Canada.</p>
      <p>You can produce the thing with the barest of resources, if you want. Advertising is, as stated above, very important. A good as salesman would be essential. I sold the ads myself, but that's mostly because I wanted that control and I had very specific content/ad ratios (70/30 editorial) I wanted to maintain and not exceed.</p>
      <p>Find a printer you're comfortable working with (and I chose one fairly close, because with the first year's issues, I was on press checks every run, catching mistakes (mine and the printer's), making changes, etc.).</p>
