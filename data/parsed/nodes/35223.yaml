      <p>There is an entire industry (of which I am a part) dedicated to helping companies like yours publish magazines for their customers and prospects. In the U.S., it's generally called "custom publishing"; in the UK and Europe, "customer publishing."</p>
      <p>Custom Publishing Council (US)<br>
      <a href="http://www.custompublishingcouncil.com/" title="http://www.custompublishingcouncil.com/">http://www.custompublishingcouncil.com/</a></p>
      <p>Association of Publishing Agencies (UK)<br>
      <a href="http://www.apa.co.uk/" title="http://www.apa.co.uk/">http://www.apa.co.uk/</a></p>
      <p>Within this group, there are as many publishing models as there are publishers. Some hire a custom publisher as a turnkey solution; the client acts as an editorial board/publisher to direct content, but the publishing company produces (i.e., writes, edits, photographs, designs, prints, distributes) the publication. Other companies just want help with a small part of the process.</p>
      <p>There can be economies of scale when working with an outside firm. We print more than 60 million magazines, so our buying power can secure lower print costs for our clients.</p>
      <p>I don't know what the advertising world is like in your market, but in the U.S. it's very difficult to make a custom magazine self-sustaining strictly through advertising revenue. Large advertisers aren't generally interested in small niche audiences, and your business partners and vendors may resent paying to help you increase market share -- they're likely to want to trade/barter for ad space, for example.</p>
      <p>Most of our clients look at their magazines as a marketing expense; they're able to demonstrate return on investment by tracking the calls/orders generated by the magazine, by tallying press mentions and other PR benefits, and by surveying their readers and measuring how their attitudes and buying patterns have changed as a result of receiving the publication.</p>
