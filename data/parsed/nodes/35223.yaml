      <p>I own just such a magazine. Dan is right about distribution - but it works hand in hand with advertising - and becomes a true Catch-22.</p>
      <p>There are professionals out there that know  just how to write the kind of report you are speaking of. It also goes beyond what you pay for rent, utilities, salaries, expenses in general. It also is about each one's experiences professionally, and what they bring to the magazine. Also, your 5 year plan. Your hopes for the magazine -- where you see it in 10 years, etc. A spread sheet alone will not do for an investor. </p>
      <p>Our magazine started 4 years ago - on a shoe-string budget and printing 3,000 -- no subscribers and well, we called it the immaculate conception. Today, we have investors, we print 7.500 copies and distribute all of them. (I could have done with another 2,000 for the July/August issue) We have subscribers - set up a way through  Paypal for potentials to subscribe on line. Our most important guy is our salesperson. Advertisers want more readers to spend their dollars -- and we need more dollars to produce the magazine. </p>
      <p>Interesting, I know a few that are in the magazine business. One told me not to consider selling till we reached a subscription base of 100.000 - because no one would look at the magazine seriously. Another made the magic number 20,000, Go figure.</p>
      <p>Meanwhile, it is fun to do the magazine - and ours has such a select audience, you have to love cars - and I'm not just talking new ones, but the old beauts... like Bugatis, Hispanas. And you really have to know your topic well. Oh, and get a good proofreader - they made me editor - and when I made a boo hoo -- it hurts!</p>
      <p>Good luck - and let us know how it turns out. If you'd like to email me, please do so through my website. Thanks.</p>
