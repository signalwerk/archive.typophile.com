      <p>&gt; not to consider selling till we reached a subscription base of 100.000 - because no one would look at the magazine seriously. Another made the magic number 20,000,</p>
      <p>The number will move around based on the target audience of the book. One aimed at a general market will need the six digit figure. But if your market is focussed enough, then a few thousand will attract people. </p>
      <p>&gt; Do I need Macs &amp; Quark or will PCs and CS3 do</p>
      <p>Platforms are immaterial today. If you know your talent in advance, go with what they are comfortable with. Just don't scrimp and buy home machines ... DTP works best with large hard disks, large monitors (a minimum of two per computer) and as much memory (RAM) as you can get in them.</p>
      <p>I would have outside prepress, if you can find a company/freelancer that you can trust to do good work and meet the deadlines.</p>
      <p>For staff, you can start off entirely with freelancers on the editorial side, although it might be smart to have the editor full time. Your advertising person should be full time ... a part timer is too quick to start selling for the clients that are easy to sell for, and ignoring the grunt work of developing an advertiser base. You also need at least one full time person to answer the phones ... it doesn't sound too professional when your call goes to an answering service.</p>
      <p>Printing is definitely farmed out, you seem to know this. As for how far to send it, I would suggest you stick close to your base if you can while learning, and then move to a cheaper/more distant printer after you have your act together (unless you develop a loyalty to your original printer).</p>
      <p>For software, you need the full CS3 print suite (InDesign, Photoshop, and Acrobat are mandatory and Illustrator is nice to have).</p>
      <p>And you will need to buy fonts. Lots of fonts. Tons and tons of fonts. Exclusively from the people who visit this forum. :)</p>
