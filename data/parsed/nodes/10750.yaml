    date_raw: 17 Mar 2003 — 9:31pm
    votes: null
    html: <p>I tried Inkwell and it's really accurate. My handwriting is not joined very much (italic hand) so that might be why it works well for me. But I think it's still a lot slower than typing. I find that I can't write properly any more on paper (I mean composing something), because I type much faster than I can write, and the speed of typing is closer to the speed I think. So I write more coherently on the computer. <br> <br>Chinese handwriting recognition has been around for over a decade (if not longer, I'm not sure) and it has been quite popular, as you can imagine typing in Chinese is much slower than you would in other alphabetic languages. Yet I still forced myself to learn to type in Chinese, because I still find writing on the tablet really unnatural. <br> <br>Somehow I don't think handwriting recognition is going to change typography/type design very much. In the end, what we write down is still converted into conventional typography. So you think the trend is going to be more fonts based on handwriting?!</p>
