      <p>If I recall properly, the metal type was created at Stempel during the 1950s, under the supervision of Hermann Zapf. Stempel would have later adopted the design for Linotype matrices, which are duplexed. But when Stempel made the phototype version (if there was one…) or the digital version now distributed by Linotype, their basis would have been the metal version, not the metal one. They would not have gone back to these intermediary, duplexed Linotype matrix designs.</p>
      <p>The Linotype—duplexed—version would have represented a design compromise intended just for typesetting with the old Linotype machine. The “proper” design would have been the hand set version, which would not have been duplexed (i.e., no weird f). There is no need, when there is a good hand setting model, to also convert the Linotype version to photo/digital/etc. I understand what you mean when you say that a digital version of the Linotype matrix version would help you reset the text, but really, the drawbacks outweigh the benefits. Everything is going to be slightly different in the present digital version… i.e., the letterspacing is most likely different now, so you wouldn’t be able to easily maintain the same line wrap anyway! Just reset the document and use a similar point size, leading, page size, margins, etc. That is enough, I think.</p>
      <p>Don’t worry about this thing with the wonky italic… the Linotype machine version that you are looking at is a work around, not the “proper” version. The current digital version is closer to the “proper” design. Using that is better ;-)</p>
