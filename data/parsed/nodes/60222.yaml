    html: <p>Linotype machines had a “magazine” which contained matrices (moulds) for two fonts at a time, but both fonts had to share the same character widths. Basically, there were two styles of a character on each matrix, and of course each matrix has only a single width. This was called “duplexing”. It was convenient because you could use two styles in the same line of type (roman + italic, or roman + bold), but sharing metrics meant that compromises had to be made in the design of the fonts. For example, for serif typefaces, the italics are traditionally narrower than the roman. When they duplexed a serif roman and italic, it was usually the italic that suffered most since it was probably not going to be used as much as the roman. Linotype also issued “true cut” italics for situations when the italic was going to be used alone, when the compromised metrics were unnecessary.</p>
