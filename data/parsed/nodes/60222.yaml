      <p>I agree with Dan. There’s no way to look exactly the same, except scanning and reproducing. Even in the remote case that you could get (or design) a revival of this italic, technology printing is different now, so you can’t get the same feeling. </p>
      <p>If you compare, let’s say, Adobe Garamond with an original sixteenth-century Garamond, differences are notable. But Adobe Garamond still a very accurate revival. </p>
      <p>Spacing is wider in the original, too, for italic AND roman. If you follow this in your digital font, it may generate a very loose aspect.</p>
      <p>Don’t worry about it, it seems that it’s the closest you can get —unless you can do it in a Linotype machine. I’d be more worried about false small caps and errata (INTSTRUCTIVE).</p>
      <p>But if you really want to look exactly the same, don’t forget Perpetua on the headline. ;-)</p>
