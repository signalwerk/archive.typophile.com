      <p>I don’t know… back in the early 1960s, you had a lot less typeface choice. I doubt that Neutra <em>decided</em> that this book should be set on a Linotype machine, and then printed from that type. Most likely, he and the publisher selected this option because it was the cheapest and/or most convenient option. Hand-setting the whole book would have most likely been too costly. I doubt that a whole lot of books were still being handset in the US in the early 1960s.</p>
      <p>Once the decision to use a Linotype machine was made, then Neutra and the publishers would have only been able to use whatever fonts that particular shop had in stock. Janson Text would have been one of the newest (and best) options at the time.</p>
      <p>You aren’t going to find an exact match of the design you want, because no one has made a digital version like that (with good reason, I think). But you can use the digital font that you have to better approximate the feeling of Linotype Machine-set text. Try these two steps: Turn off all Kerning in the document. So you’ll be using NO kerning pairs (the Linotype Machine did not support them). Then, you could letterspace all Italic text passages a bit. This won’t give you the wider letterforms you want, but it will open up and widen the text, and that will give a very close impression. Typography isn’t really about individual letterforms anyway. It is about how they all come together… what the pattern is. You can approximate one books pattern with similar, but not exact tools. I would not see this as being detrimental to Neutra’s legacy at all.</p>
