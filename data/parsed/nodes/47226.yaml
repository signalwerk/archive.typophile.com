    html: |-
      <p>I just remembered a workaround I once did:</p>
      <p>First, do the autobold effect to a lesser extent that you want. For example, give the parameters for weight in(de-)crease half the value.</p>
      <p>Hopefully, this retains the node structure because no overlaps occur.</p>
      <p>Then, use MM-extrapolation to double the effect. You would generate an instance at -1000 or at 2000, depending on your setup. This should lead to exactly the same result you initially wanted, but without removed overlaps.</p>
      <p>If halving the values is not sufficient (because it still creates and removes overlaps), try a third, or a quarter, amplifying the effect accordingly in the end. The more extreme your amplification the more rounding errors might come into play, however.<br>
      Note that when extrapolating you should always try to work with full numbers (i.e. thousands) because then at least this step is lossless.</p>
