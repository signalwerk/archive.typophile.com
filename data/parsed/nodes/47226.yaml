    html: |-
      <p>Adam, that is not what I was proposing but it is quite similar.</p>
      <p>While I suggested to remove the weight to a lesser degree (say, –5 instead of –10) in order to avoid overlaps and then <cite>amplify</cite> the effect, you would do the effect in the opposite direction and then <cite>reverse</cite> it. Both using MM-extrapolation.</p>
      <p>Hard to say which method gives better results since increasing the weight can easily produce overlaps as well. I guess it depends on design and the individual letter: the risk of overlaps through producing overly thin "negative weight" strokes vs. ending up with overly tight overlapping counters.</p>
      <p>Anyway, this whole mess could easily avoided if the internal overlap removal was simply switched off. People can apply it in a subsequent step if they want to so I wouldn't even keep it as an option.</p>
