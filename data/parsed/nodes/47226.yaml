      <p>I think what Tim means is: instead of using FontLab Studio 5's poor "remove weight" feature (in FontLab Studio 6 there will be a better algorithm that we've taken from Fontographer), you should ADD weight using FontLab's Bold feature, and then make an MM font out of your regular and bold (with a weight axis), and then generate an instance that would be an extrapolation "to the left", e.g. with -100 or -300 or whatever. Then the unwanted problems will not occur. </p>
      <p>A.</p>
