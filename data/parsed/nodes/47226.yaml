      <p>yes, FL weight modification tools are far less useful than they could be. I generally avoid to use them at all because of the reasons mentioned.<br>
      The macro I have been working on does make things better by retaining the original contour structure, so that interpolation is possible. It only works with TrueType curves since it was easier for me to write the code and fonts we produce are often OpenType TTF; but it should not be very difficult to make it work on PS contours as well.</p>
      <p>I think we can wait quite a long time before the release of FL 6... so it was not a waste of time to make such a script.<br>
      Still, it is a work in progress and only used internally.</p>
