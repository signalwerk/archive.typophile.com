  html: |-
    <p><a href="http://www.calligraffiti.nl" target="_blank" rel="nofollow">Niels Shoe Meulman</a> nasceu a 25 de Setembro de 1967 em Amesterdão . É um artista visual, grafiteiro, designer gráfico e diretor de arte. Alguns dos seus projetos estão em exposição permanente no <a href="http://www.stedelijk.nl/" target="_blank" rel="nofollow">Museu Stedelijk</a>&nbsp;de Amesterdão e no &nbsp;<a href="http://www.sfmoma.org/" target="_blank" rel="nofollow">Museum of Modern Art</a>, bem como em imensas colecções privadas um pouco por todo o mundo.</p>
    <p>É incrível o talento que&nbsp;<a href="http://www.nielsshoemeulman.com/" target="_blank" rel="nofollow">Niels Shoe Meulman</a>&nbsp;tem ao desenhar letras em praticamente qualquer tipo de superfície. Vê-mos trabalhos dele, no chão, como é o caso deste vídeo, mas também em paredes, terraços, telhados, enfim... quase qualquer superfície é suficiente para Meulman. Aqui, deixamos apenas este vídeo no qual. Niels Shoe Meulman escreve <em>beauty</em> apenas de vassoura e um balde de água em punho!</p>
    <p><a class="freelinking external" href="http://www.maisnet.net/category/design/tipografia-design/" rel="nofollow">Ver vídeo</a></p>
    <p>Qual a tua opinião a respeito?</p>
    <p>&nbsp;</p>
