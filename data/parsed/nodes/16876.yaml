  - id: 114835
    user: 7642
    date: 2006-03-27T13:43:00
    date_raw: 27 Mar 2006 — 1:43pm
    votes: null
    html: <p>That's what I'm talking about. What I really want is for more people to come here and comment on this. I'm afraid that if I make any mistakes here, it all falls down on you, and keep in mind that I haven't done any expert studies into type design--I just go by what looks good, and I'm self-taught (though by looking at fonts drawn by the experts)--and I'm still just 17, so there's that. All that said, with this larger sample I think I get a better idea of what you're trying to do, and it gives some of your decisions a rationale. The s doesn't actually look as bad as I thought (though it still needs something), and in regards to it working better when rotated 180°, one could say that about Weiss's s too, but then it loses the charm. I think the tail of the g does need to come right at least a little, and I stand by what I said about the flaring in the w,v,y. Also the f is out of character--too Baskerville. Centaur could be a good inspiration for some of the font. I look forward to whatever else you come up with as you take a sabbatical from Agnoti. I also wish someone <cite>else</cite> would come over here and look this over.</p>
