      <p>Before I could say a lot, I would have to see more sample than this. But I'd say that for the kind of font it is, it's coming along well. I'd work on having a consistent color throughout: for example, the o is some lighter than the n, and the eye of the g is even lighter. You can have a serif with somewhat random stress and still have all the characters the same color. Check out <a href="http://www.shinntype.com/" title="http://www.shinntype.com/">http://www.shinntype.com/</a> Nick Shinn's work, in particular Oneleigh. The tail of your g is interesting, and I haven't decided whether or not I like it. Maybe (maybe) it could come a bit farther right, but I'll let you decide. I think my lack of confidence in criticisms is due to not being able to see in more context how the letters turn out to work together. So... put up more sample.</p>
      <p>Nathanael</p>
