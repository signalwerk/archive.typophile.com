    <p>Hello all</p>
    <p>This forum has inspired me a lot. I have started making this font, agnoti. I have never made an entire typeface before but I am ambitious. Its missing some letters, the ones where I cannot find a nice solution. As I have said I've never made a font before and this is purely for my own pleasure and a good learning experiance.</p>
    <p>edit: *updated*</p>
    <p>Id really like replies, comments, crits or ideas so that I can finish the font. Thanks for your time. I have attached a pdf(570 KB) and a png.</p>
    <p>Best regards,<br>
    David Pache</p>
