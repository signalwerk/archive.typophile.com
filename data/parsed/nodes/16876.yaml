    html: "<p>What I really meant was could you post a PDF with, like, a few lines or so of running text, or maybe a pangram. You know, show off all your character set. I think the color is getting better. I have to say I kind of liked it when it was a little more jagged. I also like the old e. The w,v,y could do with some flaring on the thin strokes. Overall, I think the concept behind this gives you a lot of freedom to just do whatever... as long as you make sure it looks good. I think you could do more with faceting, like you did with the n,m,h,u: do it on the a, maybe the b,d,p,q, possibly even the s and o. (But with this concept, avoid monotony too.) Some letters are still bolder than others. I wish some other people would come here and critique this (and while we're at it, my font too), so you could get advice from more than just me. One last thing I'd say is work on making them all look like they're related: for example, the s doesn't look like it even knows the rest of the font. (For a good s, I'd think maybe Lydian.) The middle serif on the k is totally unrelated. Okay, so pretty soon I'll just be rambling, so I'll stop typing.</p>"
