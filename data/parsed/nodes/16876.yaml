      <p>Thanks again for being so helpful Nathanael, I really appreciate your aid. To make all the letters look like they belong together seems to be the hardest task for me, but Im slowly but surely getting there. As I said earlier, my s is probably the worst character to draw for me (it works better when its rotated 180 degrees!) but Im working on it everyday. I will check out that s you mentionned.<br>
      It has really evolved since last year. I do attach some nostaligie to the hard, jagged edges but the soft curved look it has now feels more appropriate for the kind of learning curve I have set myself. Honestly though, too much freedom is a bad thing ( for example the k ).<br>
      Well anyway, I attached the pdf which has a few missing letters still.<br>
      Sorry for not making proper sentences with spaces but I just cannot find an easy way to get my illustrator made characters into an easy to use font file. Will learn soon :) Also I may leave this font to settle down in my head for a moment, try some other style in the meantime.<br>
      Thanks for looking.</p>
