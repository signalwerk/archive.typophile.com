      <p>Im not sure if this project merits a new thread, so Ill just post it here for the moment. Im working on the letter "a" uniquely. I must have drawn over 200 "a"'s in my sketchbook over the past months. I was wondering if anyone also attempted the experiment among you? Its quite a challenge to come up with an original idea when you hit the the 100's :)<br>
