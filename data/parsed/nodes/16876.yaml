      <p>Good evening everyone.</p>
      <p>I have gone onto learning FontLab Studio. I did a quick typeset ( which took about 3 hours to do) and used it as my no risk try every button study. Its great when you see your very own characters appear as you're typing them for the first time.<br>
      So here is my first try with the software, the font has a huge number of errors, its ugly in most parts and isnt easy to read but I will clean it up over time. It may turn out to be just for titles or something. Is it ok if I use the same thread? It is based on my old 5 letter logo.<br>
      <a>http://typophile.com/node/15799</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/rosti_3458.png"></div><p></p>
      <p>So this evening, I added my agnoti characters in, did some kerning and just gave it a try. Work in progress, but its getting there.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/agnoti5_4282.png"></div><p></p>
      <p>Thanks for your comments.</p>
      <p>Regards,<br>
      David</p>
