    date_raw: 29 Dec 2005 — 1:00am
    votes: null
    html: <p>David, I think that you should think more about the way broad-nibbed pens write on paper, as that is how letters were written in the middle ages (letters were also painted with a brush, or carved into stone, etc. but those were more for decoration than for reading). I'm not saying that you should necessarially copy calligraphic styles, or start writing by hand yourself, but do at least try to think about the tool and its style a bit more. Your "m" is getting there, the top curve on the "a" is a neat idea but needs a better transition, but the "s" is impossible, etc.</p>
    html_clean: <p>David, I think that you should think more about the way broad-nibbed pens write on paper, as that is how letters were written in the middle ages (letters were also painted with a brush, or carved into stone, etc. but those were more for decoration than for reading). I'm not saying that you should necessarially copy calligraphic styles, or start writing by hand yourself, but do at least try to think about the tool and its style a bit more. Your "m" is getting there, the top curve on the "a" is a neat idea but needs a better transition, but the "s" is impossible, etc.</p>
