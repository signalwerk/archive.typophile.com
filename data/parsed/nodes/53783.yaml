  html: |-
    <p>Hi typophiles,<br>
    I’m trying to improve this flyer, if anyone would like offer any comments,<br>
    that would be helpful.<br>
    I’ve only used Avant Garde, because that whats they’ve got in their logo,and trying to keep some consistency.<br>
    I feel a little stuck about what direction to go with it really.<br>
    I want to use a font thats friendly, but suggests credibility as well.<br>
    Should i try and find something with a similar feel to avant garde, to go with the logo, or something to contrast it.<br>
    It would be nice to get a consistent look,with the body copy and display,<br>
    throughout all flyers, poster etc.</p>
    <p>Any thoughts?<br>
    many thanks<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fly2_5016.jpg"></div><p></p>
