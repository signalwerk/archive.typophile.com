    html: |-
      <p>Scala Sans does seem to be a good choice given your intent, although it seems to me to be a bit too plain. Clearly, you don't want, say, Wedding Text, since that would produce the opposite of the effect you are pursuing.</p>
      <p>Murray Hill and Park Avenue aren't right either; but I would be inclined to suggest some sort of light, playful face that still makes a nod to the past by being calligraphic. But I can't find what I'm thinking of, although Tiffany, Bauhaus, or Korinna might (or might not) work for you.</p>
