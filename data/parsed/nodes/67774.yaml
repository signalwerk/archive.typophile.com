  html: |-
    <p>This might be an odd request, but for one of my classes I want to typeset the United Church of Christ's <a class="freelinking external" href="http://www.ucc.org/beliefs/statement-of-faith.html#DOX">Statement of Faith</a> and am having trouble deciding on which font to use. </p>
    <p>I am presently leaning toward Scala Sans Light. To my (amateur) eye it's fresh, non-authoritarian, and has a sense play - all things I would like to convey.</p>
    <p>Does anybody have any other suggestions?</p>
  html_clean: |-
    <p>This might be an odd request, but for one of my classes I want to typeset the United Church of Christ's <a class="freelinking external link-external" href="http://www.ucc.org/beliefs/statement-of-faith.html#DOX">Statement of Faith</a> and am having trouble deciding on which font to use. </p>
    <p>I am presently leaning toward Scala Sans Light. To my (amateur) eye it's fresh, non-authoritarian, and has a sense play - all things I would like to convey.</p>
    <p>Does anybody have any other suggestions?</p>
