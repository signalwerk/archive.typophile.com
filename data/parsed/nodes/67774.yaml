      <p>Now that I'm at home and can look at some specimen books, I see that it was Park Avenue, which is not suitable, that I was thinking of. But now I've found something that may be like what you're looking for... Studio. However, I see that there are now several completely different faces with that name, and the one I'm thinking of is the one from Mecanorama.</p>
      <p><a href="http://www.identifont.com/list?2+Studio+2+6K9+16+CDW+0+DXT+0+47H+0+MU6+0+MU7+0+MU8+0+376+0+8KE+0" title="http://www.identifont.com/list?2+Studio+2+6K9+16+CDW+0+DXT+0+47H+0+MU6+0+MU7+0+MU8+0+376+0+8KE+0">http://www.identifont.com/list?2+Studio+2+6K9+16+CDW+0+DXT+0+47H+0+MU6+0...</a></p>
      <p><a href="http://new.myfonts.com/fonts/itfmecanorma/studio/" title="http://new.myfonts.com/fonts/itfmecanorma/studio/">http://new.myfonts.com/fonts/itfmecanorma/studio/</a></p>
      <p>Adams, from Canada Type, is close as well:</p>
      <p><a href="http://new.myfonts.com/fonts/canadatype/adams/" title="http://new.myfonts.com/fonts/canadatype/adams/">http://new.myfonts.com/fonts/canadatype/adams/</a></p>
      <p>Billed as "a revival of Dolf Overbeck's Studio typeface", I suppose that's not surprising.</p>
      <p>Having the point to start from, I found a different face that might also be what you're looking for, or at least what I thought you were looking for:</p>
      <p><a href="http://new.myfonts.com/fonts/linotype/roundy/" title="http://new.myfonts.com/fonts/linotype/roundy/">http://new.myfonts.com/fonts/linotype/roundy/</a></p>
      <p>Roundy, from Linotype.</p>
      <p>Or Galahad, from Adobe.</p>
      <p><a href="http://new.myfonts.com/fonts/adobe/galahad/" title="http://new.myfonts.com/fonts/adobe/galahad/">http://new.myfonts.com/fonts/adobe/galahad/</a></p>
