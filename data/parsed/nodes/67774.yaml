      <p>Thanks so much for all the suggestions!</p>
      <p>@ quadibloc - Bauhaus felt very close but a bit funky/techy and not as spirited as I was hoping for - good food for thought though.</p>
      <p>@ John Hudson - Socianist Sans would be an apt choice considering the denomination has a strong unitarian strain running through it. What do you think of Pelagian Pro?</p>
      <p>@ cuttlefish - Beorcana is absolutely lovely and, dare I say, near perfect for this project. </p>
      <p>@ Northbay - Caslon No540 is great but I think I'm going to go the sans serif route. </p>
      <p>Thanks again. I will let you all know what I decide.</p>
