    <p>This image was captured yesterday by my nephew's wife at the Stephen Colbert and Jon Stewart's Washington D.C. rallies:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/GodHates_5287.jpg"></div><p></p>
