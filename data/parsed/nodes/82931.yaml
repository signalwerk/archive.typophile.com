      <p>Since we're discussing terminology... Is there a difference between "logo" and "logotype"?</p>
      <p>I have a book by Jack Gernsheimer named "Designing logos" and it makes a clear distinction:</p>
      <p><cite>While there are varying interpretations and uses of these words, within this book, I use the word logo to describe a symbol, mark, or icon. I use the term logotype to refer to a word or words that accompany or replace the logo as an identifier.</cite></p>
      <p>And how about the term "trademark"?</p>
