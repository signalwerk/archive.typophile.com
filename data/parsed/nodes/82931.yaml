    html: |-
      <p><em>One thing is clear - too many opinions and no strict regulation. :)</em></p>
      <p>No: opinions have nothing to do with the matter, but there has been some corruption to the language.</p>
      <p>A typeface is a particular design, with all its attendant weight and width variations, plus alternate renderings, such as swashes and small caps. A font USED to mean ONE PARTICULAR size, weight, width and variant of one particular typeface. A font has COME TO MEAN a computer data file which renders a particular weight, width or variant of a typeface which is infinitely scalable. Generally, the term font HAS BEEN CORRUPTED to mean what typeface USED to mean. However, you are correct about no strict regulation: we have the Thought Police working on that...</p>
