    <p>Hello all!</p>
    <p>I am a Year 1 Graphic Design student and I would like to clear out some terminology issues.</p>
    <p>Is the word "typeface" synonymous to the word "font"?</p>
    <p>I have heard some people arguing about this matter and now I am eager to know the truth.<br>
    Also, some people claim that the word "typeface" is technically incorrect as it is a legacy from the old typesetting times.</p>
    <p>Opinions and knowledge are appreciated.</p>
    <p>Regards.</p>
    <p>P.S. Sorry if this topic has been discussed. I couldn't find it on search.</p>
