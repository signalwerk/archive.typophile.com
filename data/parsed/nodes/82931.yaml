    html: |-
      <p>Jack Gernsheimer may make a distinction between the words logo and logotype, but he makes it clear that the distinction is of HIS making. What's the difference between a photo and a photograph?</p>
      <p>Originally, a LIGATURE was a simple design element which tied two letters together, most commonly ct and st; a single cast piece of metal type containing the tied letters and the ligature--or simply tied letters like ff, fi fl, etc--was called a LOGOTYPE. However, with the passage of time and corruption of the language, what was called a logotype is now called a ligature, and the meaning of logotype has been reassigned.</p>
      <p>Look up "trademark" on Wikipedia; the article is clear and concise.</p>
