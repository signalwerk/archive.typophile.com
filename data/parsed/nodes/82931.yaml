      <p>Quip: "A font is a typeface with its hard hat on."</p>
      <p>Long: On a computer, a font is a file with all the necessary data for a single instantiation of a typeface.</p>
      <p>Foo Sans is a typeface. Foo Sans Semibold Oblique is a font.</p>
