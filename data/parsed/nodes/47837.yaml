    <p>When you aren’t looking for specific typefaces in use it seems you see them everywhere. But, when you are specifically trying to find examples of them in use they disappear. How bizarre. I’m looking for FF Meta, Bauhaus, Cezanne, Bookman, Univers, and Mrs. Eaves. Any leads? Thanks!</p>
