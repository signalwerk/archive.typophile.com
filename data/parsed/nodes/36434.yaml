      <p>Sounds like a plan!</p>
      <p>Just remember, for anyone coming to the SF Bay Area, the Bay Bridge between San Francisco and Oakland will be closed over the entire Labor Day holiday weekend (8 p.m. Friday, August 31, 2007 — 5 a.m. Tuesday, September 4, 2007), so plan travel routes accordingly. <a class="freelinking external" href="http://511.org/promo/baybridge/default.asp" rel="nofollow">Detour Info</a></p>
