    html: |-
      <p>When you have a whole sentence, find a focal point of a word or two and make it stand out bigger, so that if a driver only has the time or proximity to read that part, they've been given an executive summary of the uncomplicated thought the sticker is supposed to express and can guess at the rest without further scrutiny.</p>
      <p>If it is really easy to get, go ahead and borrow so much space from the less important words that they are too small to possibly read while driving, because it is basically saving everyone time. ".. ........ MANX CAT .. ... .... ........... .... .... HONOR STUDENT"</p>
