      <p>BTW, FWIW I've been on Twitter since June, and there are not infrequent cases of an <em>account being taken over</em> –if temporarily– by spammers, which is much worse than a "stand-alone" spammer. But to me worse still is the not infrequent use of foul language; for one thing it prevents me from retweeting an otherwise worthy opinion – often it even prevents me from replying to it, lest I appear to be supporting use of foul language (which I consider to be an expression of weakness in objectivity, self-control and especially communication).</p>
      <p>Also: I'm not religious (although neither am I an atheist) and I'm not blind to certain problems that formal religion can foster, but discriminating against religions is the most offensive belief of all.</p>
      <p>hhp</p>
