      <p>Mon cher M. Clark,</p>
      <p>That's all the French I know, except for french that gets bleeped...</p>
      <p>I don't give a rosy red rat's patootie about having certain profanities, vulgarities, and obscenities (yup, they're different) bleeped. Been known to use them myself. In fact, for years I thought my wife's permanent blush was a matter of my, uh, physical prowess. Nope. Turns out I'm just an average guy who takes the name of  God in vain too often, and that embarrasses her. You're probably suffering from a similar delusion...</p>
      <p>Why not joint the ranks of people who communicate -- communication being a two way street, all parties comfortable. Typophile's not a place for "artistic" expression, vulgar or otherwise. Go create fonts no one wants to use to satisfy such urges.</p>
      <p>As for all spamming: the few sites I visit <strong>all</strong> seem to be losing a battle to spammers. How you can blame the people at Typophile for the spam attacks shows only that you're unaware Typophile is getting to be important as a resource. "important as a resource" is also known as "target."</p>
      <p>Suggest you worry more about any on-line accessible bank accounts you might have, and what you'll do for electrons, water, etc.  when the spammers get just a bit more powerful. It is no longer a matter where site-by-site efforts will succeed.</p>
