    votes: null
    html: |-
      <p>If height control is what you want in caps, consider FF Atma:<br>
      <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_atma_serif_book/" title="http://www.fontshop.com/fonts/downloads/fontfont/ff_atma_serif_book/">http://www.fontshop.com/fonts/downloads/fontfont/ff_atma_serif_book/</a></p>
      <p>Feijoa has a cracking set of small caps:<br>
      <a href="http://www.klim.co.nz/feijoa_charset.php" title="http://www.klim.co.nz/feijoa_charset.php">http://www.klim.co.nz/feijoa_charset.php</a></p>
      <p>Also, if you want the delta to be small, try using small caps for everything and scale up the first letter 10% It will look fine, and not like fake small caps. If it were me I'd set straight small caps with no full caps.</p>
      <p>Lastly, small caps should be generous in width and set loose. The narrow width and tight tracking on the caps in your layout looks like poop. All of this my opinion and not hard-n-fast rules. Good luck!</p>
