    html: |-
      <p>Thanks - those are good suggestions, but not exactly what I'm looking for.  </p>
      <p>For this application the delta between the height of the big caps and small caps needs to be minimized.  Most Serif Small caps seem to have the big caps about 50% taller than the small caps.  I'd like to find a font where the delta is more subtle - like 10-20% or so. </p>
      <p>Not sure if this is clear - to put it another way, the small letters should be closer to the same size as the bigger letters (although still smaller). </p>
      <p>Thus, when I put them on the screen in a menu bar where I am vertically constrained, the small letters can still be legible. </p>
      <p>Any other ideas?</p>
      <p>Seph</p>
