  html: |-
    <p>I'm putting together a website for a clothing company selling high end dress clothes.  We want the feel of the site to be sort of british, european, established, royal, professional, formal, etc.  For the menu items, I want to use a Serif Font in Small Caps.  I will be rendering it fairly small, so it can't be too elaborate.  </p>
    <p>I will be rendering the font in the web page with sIFR. </p>
    <p>A mock up of my design is currently here: <a href="http://archimedescloth.com/wireframe/page16.html" title="http://archimedescloth.com/wireframe/page16.html">http://archimedescloth.com/wireframe/page16.html</a>.  I am pretty happy with the font in the menu items now, it is MS Reference, with a 0.5px stroke, with the 1st letter of each word at font size 19, and the following letters at size 16. I'd prefer to find a font that looked something like this without having to modify the stroke and font size.  </p>
    <p>Any suggestions? I really appreciate any advice. </p>
    <p>Thanks,</p>
    <p>Seph</p>
