    date_raw: null
    votes: null
    html: |-
      <p>Hi hrant. I certainly don’t depreciate character mirroring/flipping. Suburban’s flipped ‘el’ (I adopt your notation of the lc ‘L’) and ‘y’ are a pretty, thought-out design feature and neither prone to be confused with each other nor with any other character of that font.</p>
      <p>Unlike that, the mirrored ‘el’ in the above font is very likely to be read as a ‘j’. (In fact, it will only be recognized as an ‘el’ when its context - the word - rules out a ‘j’. While such ambiguity is common with certain characters such as ‘el’, ‘I’ and ‘1’, there is, IMHO, no need to invent new sources of confusion.) That mirrored ‘l’ is, in my view, an injudicious, pointless modification of the letterform, not adding any sophistication to the font, but definitely impairing its readability. I’d like to see “Jolly Joker” set in the above unknown font.</p>
      <p>jpg</p>
