      <p>I think it might be a mistake to present the curves sorted by "sharpness". The order might influence which one people choose. For instance, people might assume that the "correct" answer should be somewhere towards the middle of the list and so they ignore the top and bottom curves. It probably would have been better to have the curves in random order.</p>
      <p>For your interactive test, you might consider e.g. presenting two curves at a time and ask the test subject to select the smoother one. You could also ask about other properties than smoothness, to hide intention of the study from the subjects. Things like, idunno, hard/soft, organic, natural/artificial, aesthetically pleasing. You could even throw in a few silly things like happy/sad or purple. Then again, asking for other things than smoothness might also make the subject focus less on the smoothness and make the answers less useful. I don't know.</p>
      <p>Oh, and I liked 2.</p>
