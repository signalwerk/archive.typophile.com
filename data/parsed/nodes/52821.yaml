      <p>How about it, Raph? What is this actually for, and how does it relate to typography / type design?</p>
      <p>Frankly, I'm a bit shocked and appalled at your parochialism. Making a mathematical model of how smoothness is perceived is uninteresting if the person doing it is a computer scientist? What of the pursuit of pure knowledge?</p>
      <p>That said, yeah, this is for Spiro, and I've used these curves extensively in my own font designs. 1 represents the Cornu spiral, and 2 and 3 are other shapes that can emerge from the four-parameter curve equation. All of these are instances of the so-called "<a href="http://www.yoshida-lab.net/aesthetic/index-e.html" rel="nofollow">aesthetic curve</a>", which is coming out of Japan. I'm particularly interested in the family because I think going down the line (choosing a higher number) may make the curve solution more stable, less wiggly. Originally, I was thinking that existing models of perception of smoothness (such as MEC energy) would predict that 1 would be the smoothest and other exponents less so, and that I'd be sacrificing smoothness to get better stability, but now it seems like you might get both by choosing an exponent around 1.5 or maybe 2.</p>
      <p>Hope you find that edifying, and I will definitely post a link to the chapter with the results when I get it done.</p>
    html_clean: |-
      <p>How about it, Raph? What is this actually for, and how does it relate to typography / type design?</p>
      <p>Frankly, I'm a bit shocked and appalled at your parochialism. Making a mathematical model of how smoothness is perceived is uninteresting if the person doing it is a computer scientist? What of the pursuit of pure knowledge?</p>
      <p>That said, yeah, this is for Spiro, and I've used these curves extensively in my own font designs. 1 represents the Cornu spiral, and 2 and 3 are other shapes that can emerge from the four-parameter curve equation. All of these are instances of the so-called "<a href="http://www.yoshida-lab.net/aesthetic/index-e.html" rel="nofollow">aesthetic curve</a>", which is coming out of Japan. I'm particularly interested in the family because I think going down the line (choosing a higher number) may make the curve solution more stable, less wiggly. Originally, I was thinking that existing models of perception of smoothness (such as MEC energy) would predict that 1 would be the smoothest and other exponents less so, and that I'd be sacrificing smoothness to get better stability, but now it seems like you might get both by choosing an exponent around 1.5 or maybe 2.</p>
      <p>Hope you find that edifying, and I will definitely post a link to the chapter with the results when I get it done.</p>
