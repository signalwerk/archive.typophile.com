      <p>Why specifically Ed Benguiat?<br>
      There were quite a few designers whose handiwork became part of ITC's Type Library.<br>
      Anyway, much of what Ed did earlier was really part of <a href="/wiki/PLINC" class="freelinking" rel="nofollow">PLINC</a>'s collection, and much of that were variants of older showcard and display designs.</p>
