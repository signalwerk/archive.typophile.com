    <p>Hi there, Newbee here.</p>
    <p>If anyone knows... How many of Ed Benguiat's fonts were 'based' on designs by other people? I know ITC Souvenir was originally Benton's, I'm wondering how many others were? Were a lot of Benguiat's fonts based on Benton's designs? Any help muchly appreciated.</p>
