  - id: 449543
    user: 17101
    date: 2011-01-28T16:30:00
    date_raw: 28 Jan 2011 — 4:30pm
    votes: null
    html: "<p>The N is great, really great! The others not so great. A: The bar needs lowering, and perhaps some more weight. I would also try slimming the left leg. I agree with Letterjay about the apex. H: The stems are too heavy. It could also be slightly wider. L: Heavy stem and spindly right side (terminology?). S: Try examining some other didones (might I suggest Didot Elder with it's unique terminals) to see how they solve it. These are always tricky to get right. The apostrophe: Bigger, more dramatic!</p>"
