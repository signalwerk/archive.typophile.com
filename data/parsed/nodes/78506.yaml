    date: 2011-01-28T14:40:00
    date_raw: 28 Jan 2011 — 2:40pm
    votes: null
    html: <p>The A's look a couple of points smaller than the rest of the style - give them a bit more overhang and make them a bit wider, I'd suggest. Maybe poke down the crossbar a little bit. And maybe kern the second one a bit tighter with the L and the N?</p>
