    html: |-
      <p>Since both signs are fabricated metal, the letter designs don't necessarily have to match any existing typeface. Both could be based on different weights of Futura. The example at the top is close to Demibold, with the stance of the larger Rs widened a bit, and the numbers rendered as oldstyle figures.</p>
      <p>In the example on the bottom (Book weight), the sign fabricator may have decided to use the crossbar of the A as the midline, thereby aligning the bottoms of the bowl for P and R, and the crossbars of the E and F. Note that the crossbar on the G is above the midline, which probably means that it wasn't altered.</p>
      <p>Richard Neutra will have to answer the question of whether or not this is the horse before his cart.</p>
