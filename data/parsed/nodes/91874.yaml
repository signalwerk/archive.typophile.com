      <p>That's so cool!  I've been playing around with this website <a href="http://www.houseind.com/fonts/neutraface" title="http://www.houseind.com/fonts/neutraface">http://www.houseind.com/fonts/neutraface</a> just for fun since reading your reply.  </p>
      <p>I would never have thought that the artist who created both signs might have just taken his or her own artistic license with the typefaces.  Also, I contacted the postmaster of this office, and he's interested in finding the answers too.  Hopefully we can track it down, as I found out we both share an interest in government-sponsored art.</p>
