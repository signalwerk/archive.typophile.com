      <p>Hi Dario, are you following the steps described at <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> ?</p>
      <p>To install the FontLab macros you need to run a command that looks something like this:<br>
      <code>python installFontLabMacros.py /Users/(your_username)/Library/Application Support/FontLab/Studio 5/Macros</code></p>
