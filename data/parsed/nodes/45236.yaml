      <p><strong> Failed to copy file /Applications/tipografia/FDK/Tools/SharedData/FDKScripts/plistlib.py to /Users/daro/Library/Application Support/FontLab/Studio 5/Macros/System/Modules/plistlib.py.<br>
      IOError: [Errno 13] Permission denied: '/Users/daro/Library/Application Support/FontLab/Studio 5/Macros/System/Modules/plistlib.py'</strong> </p>
      <p>The only thing I've changed is in terminal, instead of dragging the FDK folder, I dragged the Fontlab folder (FDK/Tools/Fontlab) because I get an error message if I drag the FDK one.</p>
