    html: <p>Those instructions should work. This is a unix-y error in the shell indicating that bash doesn't know about the "autohint" program. The shell keeps track of directories of programs it will run without specifying the full location. In unix parlance people refer to this as the "path". So one might say that the "autohint" program is not "in your path".</p>
