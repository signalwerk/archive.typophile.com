  html: |-
    <p>I have tried to install the AFDKO --Adobe Font Development Kit Opentype--following the directions in the Typowiki. I am trying to do this in OSX 10.5.2. I dropped the "finish install OSX" file into the terminal window and it seemed to install. But when I try the test--typing "autohint -h"--I don't get information about autohint, but rather an error message, "-bash: autohint: command not found"</p>
    <p>Can someone give me more detailed instructions or tell me what I am doing wrong?</p>
    <p>Thanks!</p>
