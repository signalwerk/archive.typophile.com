    html: <p>No, but it's all pretty bad! Lots of original assembly line fonts, mostly themed, at $1 to $3. They're associated with InspireGraphics/LetteringDelights.  A side note on terminology - to me, a "Bitmap font" is a windows .fon file or some of the Mac fonts.  It it's essentially just images, I call them alphabets.  Not great, but it works for me - I try to avoid the word 'font' if it's NOT an installable  font.   - Herb</p>
