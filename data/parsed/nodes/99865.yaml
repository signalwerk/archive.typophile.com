    html: |-
      <p>Thanks for letting me know. I'll get in touch with dafont asap. </p>
      <p>Renders: I modelled the sword in 3D app then instanced it / arranged into typefaces. The sword is the Knight's sword in our upcoming animation <a href="http://okwad.101craft.com" rel="nofollow">Of Knight, Wizard and Dragon.</a></p>
      <p>Photofont plugin for Photoshop or Indesign will allow you to use fully colored fonts on the same basis as .ttfs are used. There's the editor (which requires a commercial license) and client plugins (everyone can use these in order to use fonts made by license holders). I'm considering purchasing the product but at the moment it seems slightly too costly. Instead you can arrange .pngs found in the archive a slower but more convenient way since you can transform bitmaps too (eg. rotate, scale them).</p>
      <p><a href="http://www.fontspace.com/mch/swordlings" rel="nofollow">Swordlings on Fontspace</a></p>
