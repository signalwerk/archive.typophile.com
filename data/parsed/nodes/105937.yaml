      <p>Insightful article Nick. The conclusion about ageist fine print rings true with me. Sometimes I actually want to read the fine print in an ad and the most efficient way to do so is to scan it and look at the results onscreen!<br>
      This may confabulate the issues of fine and tiny print. But it's a point well taken.<br>
      As for "fine" meaning thin or light print, I find your gallery of thin types to be a good survey of what happens to different type categories -- not just the sans -- when they go on an extreme diet. They loose much of their distinctiveness and all of them end up looking more or less like an emaciated typewriter font. I can see some use for such types at large scale for headings or short text on smooth quality paper, e.g. a Vanity Fair full page advert.<br>
      The samples posted so far have not included light Fraktur. Even this is possible. The lower case usually looks o.k. but the capitals are like a maze. An example, Commercial type's Marian Black:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MarianBlack@CommercialType_6610.jpg"></div><br>
      Don<p></p>
