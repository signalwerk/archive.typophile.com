      <p>The concept of multiple typefaces was common throughout the 19th century. A few years after the period where these ads were typical, it evolved into the style was known as "artistic," which originated in the British Aesthetic Movement. Its distinctive features are idiosyncratic color harmonies, eclectic choice of type adornment, and compartmentalized compositional strategies. A major feature was the quest for the lightest possible line in fonts and ornaments.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LightFontInArtisticPrinting_5525.jpg"></div><br>
      You might enjoy reading _The Handy Book of Artistic Printing_ (2009) by Doug Clouse &amp; Angela Voulangas which explores this style.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/HandyBookOfArtisticPrinting_4410.jpg"></div><br>
      Book at Amazon, URL varies with country of purchase. Google will get the correct one for most countries. Don't know about Russia.<br>
      Good quick overview at <a href="http://woodtyper.com/116" title="http://woodtyper.com/116">http://woodtyper.com/116</a><br>
      The official website is unavailable at the time I am writing this, but try later:<br>
      <a href="http://www.artisticprintingbook.com" title="www.artisticprintingbook.com">www.artisticprintingbook.com</a><br>
      Don<p></p>
