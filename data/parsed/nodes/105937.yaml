      <blockquote><p>what is the first “thin” sans serif? And why does a foundry commission it?</p></blockquote>
      <p>One well-known example of a light sans-serif is <a href="http://typophile.com/files/royal_grotesk_bauer_6208.jpg" rel="nofollow">Royal-Grotesk</a>, issued by Ferd. Theinhardt Schriftgießerei Berlin around 1880. It was later renamed (after the Theinhardt foundry was taken over by H. Berthold AG) <a href="http://typophile.com/files/AG3.jpg" rel="nofollow">Akzidenz-Grotesk mager</a>.</p>
      <blockquote><p>I’d like to know the origin (century, country) and the main purpose in the creation of the “light” weight. Is Light originally used for text or title?</p></blockquote>
      <p>Royal-Grotesk was <a href="http://www.typolexikon.de/t/theinhardt-ferdinand.html" rel="nofollow">allegedly</a> developed “for use in the scholarly publications of the Royal Prussian Academy of Sciences in Berlin”. That does not sound too credible to me.</p>
