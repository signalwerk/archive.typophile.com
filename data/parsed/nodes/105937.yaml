    <p>Hello,</p>
    <p>I'd like to know the origin (century, country) and the main purpose in the creation of the "light" weight.<br>
    Is Light originally used for text or title?<br>
    I wonder what is the first typeface that features light and ultra light weight?<br>
    Thanks in advance for your answers.</p>
