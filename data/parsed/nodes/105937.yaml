      <p>Good points.<br>
      Clouse observed in his book that with the rise of lithography the letterpress  printers were being squeezed out of the advertising business. The heavy "fatface" fonts of the early 19th century looked crude and clumsy compared to lithographic lettering, which could be light in execution. "Artistic" printing which included light line fonts and ornaments was a way for letterpress printers to recover some market share.<br>
      Engraving remained superior to type and lithography for very small formats, like fine script on business cards or  lettering on postage stamps.<br>
      Don</p>
