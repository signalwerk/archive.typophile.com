      <p>Agree Nick that this seems to have wandered from the idea of the same typeface with different weights. There is not much in the way of type families before 1896ca when fonts like Cheltenham by Morris Fuller Benton and Bertram G. Goodhue were introduced. There were a substantial number of fonts called "lightface" in the latter part of the 19th century, but they were not closely matched with heavier weights of the same design.<br>
      I agree with your suggestion of the influence of coated paper.<br>
      Other technological innovation's also made possible the use of lighter fonts. For example electrotyping for font copying and production.<br>
      Don</p>
