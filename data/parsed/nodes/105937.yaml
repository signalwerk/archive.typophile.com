      <p>Fornier said:</p>
      <blockquote><p>Thank you very much. The story of the Royal-Grotesk is a fascinating piece of information. It makes sense because AG is the blueprint for Helvetica</p></blockquote>
      <p>According to extensive research by Schumacher Gebler (published in Schriftgestalten by Tino Graß, Niggli 2008), Akzidenz Grotesk may not be looked upon as the one and only predecessor of Helvetica. He mentions and shows Französische Grotesk by Haas, which is the Haas’sche version of breite halbfette Grotesk by Schelter &amp; Giesecke (with minor changes and a single-storey g).</p>
      <p>Fournier said:</p>
      <blockquote><p>and Univers which offer many thin weights.</p></blockquote>
      <p>Univers rather roots in the alphabets made by Walter Käch, Frutigers teacher than in Akzidenz Grotesk. Kächs work is likely to be influenced by Akzidenz Grotesk, but the rational approach, the clean counters and the consequent horizontally cutting-off the stroke ends of a, c, e g and s in all weights and widths of a sans serif typeface can be found in the work of Käch. Kächs alphabets have been published, but for those who do not want to collect antique type books: some of it can be found in the book s on and by Frutiger, mainly in the publication by Heidrun Osterer.</p>
      <p>Maxim said:</p>
      <blockquote><p>Royal-Grotesk was allegedly developed “for use in the scholarly publications of the Royal Prussian Academy of Sciences in Berlin”. That does not sound too credible to me.</p></blockquote>
      <p>Exactly, although Theinhard made a lot of typefaces for the Royal Prussian Academy, he does not credit himself doing Royal Grotesk, let alone for the Academy, in his memoires as published in 1899. It would be interesting to see Royal Grotesk in one of the publications of the Royal Prussian Academy though.</p>
      <p>Berthold has been mentioning the  Royal Grotesk from the Theinhardt foundry as the source of Akzidenz Grotesk mager since 1955 at least. Papers in the Berthold Type Specimen Library, now in the Technik Museum in Berlin, confirm this. So the idea of Royal Grotesk being the predecessor of Akzidenz Grotesk must be reduced to the light weight. The other weights are likely to have been based on typefaces from other foundries. ‘Halbfette Bücher Grotesk’ from Bauer &amp; Co, Stuttgart, 1896 is officially known to be the predecessor of Akzidenz Grotesk bold condensed from 1955. Where the other weights come from, I wouldn’t know, but according to Wolfgang Homola’s <a class="freelinking external" href="http://www.typefacedesign.org/resources/dissertation/2004/WolfgangHomola_dissertation.pdf" rel="nofollow">Type Design in the age of the machine</a>, it is likely that the ‘Breite Grotesk’ by J. G. Schelter &amp; Giesecke could have been an inspirational source in this case. From this publication one can also read that in those days, the German use of mager rather refers to what we now would call regular than light. Also breit often seems to refer to regular width rather than wide. Maybe this has to do with the fact that many of the Textura and Fraktur faces were rather condensed and heavy.</p>
