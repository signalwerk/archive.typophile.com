      <p>These are light and thin faces, but how are they related to the norm?</p>
      <p>It seems to me that there are three categories of light weight:</p>
      <p>1. Light versions of a stylistically themed family<br>
      2. Light fonts that look like light versions of regular styles, but are not published as part of a specific family.<br>
      3. Light weight standalone fonts</p>
      <p>Morris Benton is often credited with introducing the concept of the type family, during the amalgamation that created ATF, as a means of organizing duplication.</p>
      <p>The Klingspor foundry was a pioneer in named (branded) styles, associated with its hiring of celebrity designers/typographers to design typefaces.</p>
      <p>Clarendon was the first bold type to be stylistically related to the normal/regular, c.1850, although the concept of type family did not then exist. I have theorized that Clarendon was prompted by the introduction of smooth coated paper which made press gain very noticeable. No doubt the introduction of Light occurred at the same time.</p>
