  html: |-
    <p>Looking to ID the "Piedmont" typeface here. It's somewhat geometric (similar to Futura or Gotham) but the "M" has the sloped sides. Bureau Eagle is similar but has the pointed vertices for the "M" and "N."</p>
    <p>As a bonus, also would like to know what "Garage Doors" is set in as well.</p>
    <p>I think we all know the other typeface here. And the likely story behind it ("Can you open this in Word and just add "A Brenner Family..." along the bottom? Yes! Perfect!")</p>
    <p>Any ideas?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image001_5905.png"></div><p></p>
