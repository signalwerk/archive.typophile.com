    html: <p>In 2002, when our host took us offline we had to archive  <br>lots of old threads offline, or be saddled with fat bandwidth  <br>bills. Sadly, Pill Gothic was a casualty of that. We have good  <br>intentions of making those archives available in the future. <br> <br>(The forum software has a built-in 'archive' feature, which <br>simply marks posts past a certain age, but all of these will  <br>still be available online. There is material from 2001,  <br>that I mentioned, that is archived offline.) <br> <br>As an aside, our current sponsors and your membership  <br>money should prevent us from being in that position again. <br> <br>You can see Christian's Origin, Raisin Nut Text and Pill Gothic  <br>in the <a href="http://www.typophile.com/gallery/">Typophile Fifty Gallery</a>. His are some of the first in there.</p>
