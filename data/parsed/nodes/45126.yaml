    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 8.May.2008 1.35pm </div>
      <p>Fontworks Press Release - For immediate release<br>
    8th May 2008<br>
    Houschka Rounded:  the brand new OpenType release from G-Type </p>
    <p>The new rounded version of the classic Houschka font family by Nick Cooke • 4 fonts in 1: standard set &amp; 3 additional stylistic sets, modern, art deco &amp; unicase • discretionary ligatures, contextual alternates, small caps &amp; 4 sets of figures • extensive language coverage including Central European, Turkish and Cyrillic</p>
    <p>Houschka Rounded, Stylistic Set 1 with Contextual Alternates<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/houschka_5690.gif"></div><p></p>
    <p>Houschka Rounded, Stylistic Set 2 with Contextual Alternates<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/houschka-alts_4752.gif"></div><p></p>
    <p>Acclaimed type designer Nick Cooke (Olicana, Chevin, Precious) has completed his long-awaited Houschka Rounded typeface, a softer new companion to the original Houschka family launched in 1999. The new 6 weight family (Thin, Light, Medium, DemiBold, Bold, ExtraBold) retains the same humanist qualities of the original typeface, a design which is elegant, clean, effortlessly legible and yet full of character. Houschka has already branded the likes of Cadbury Schweppes and Tesco; Houschka Rounded’s smooth curves, range of weights, multi-lingual coverage and impressive repertoire of OpenType features will undoubtedly create a whole new buzz.</p>
    <p>The typeface has been thoughtfully designed using OpenType technology to give users a choice of additional styles within the same font; a modern contemporary vibe, decorative art deco feel or a quirky ‘mixed caps’ unicase appearance can be achieved without ever having to switch fonts. The contextual alternates and discretionary ligatures can also be used in conjunction with any of the 4 stylistic sets for maximum versatility.				</p>
    <p>Says Cooke: “After the release of the original Houschka I discovered that many users liked the font, but were ‘uncomfortable’ with the rounded style of the A, W and w; straight versions have been incorporated into Houschka Rounded and are accessed by selecting ‘Contextual Alternates’. I also thought it would be good to offer a little more variety, so there are 3 extra stylistic sets which are easy to use; just scroll over the text and, using the pop-up OpenType menu in the character palette, select stylistic set 1, 2 or 3. It couldn’t be simpler.”</p>
    <p>Houschka Rounded is available from Fontworks UK Ltd and online at <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a><br>
     For more information, samples or to discuss editorial opportunities please contact Joe Graham (<a href="mailto:joe@type.co.uk" title="mailto:joe@type.co.uk">mailto:joe@type.co.uk</a>) at Fontworks. Please refer to the accompanying type specimen sheets for more information on how best to use these magnificent OpenType (.otf / PS flavour) fonts.</p>
    <p>Fontworks UK Ltd<br>
    New North House<br>
    202-208 New North Road<br>
    London&nbsp; N1 7BJ<br>
    <a href="http://www.type.co.uk" title="www.type.co.uk">www.type.co.uk</a><br>
    t: +44 (0)20 7226 4411<br>
    f: +44 (0)20 7226 4422</p>
