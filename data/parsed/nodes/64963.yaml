    html: |-
      <p>For a slightly smaller exercise :-), how about a logo* where you use a font but then tweak the lettershapes to work better in the logo? Might make for a very nice before-and-after. And you could even discuss the process/result right here.</p>
      <p>* I've recently started doing that even in large headlines when there is time – convert to outlines and make ligatures, alternates, flourishes… Who says fonts need to be set the way they come out of the box!</p>
