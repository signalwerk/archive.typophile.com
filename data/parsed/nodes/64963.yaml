  html: <p>It's been quite a while since I've posted an entry but I've been quite busy working on my portfolio and some other things. I had an idea to add a section to my portfolio where I don't show finished work, but rather specific skills. It's just going to be a small section where I can show things like before and after pictures of color correction, illustration, etc. I am not a type designer but would like to show some sort of type treatment as well. Does anyone have an idea of a type exercise that might be good in this context? As always, I appreciate any advice you have to offer.</p>
