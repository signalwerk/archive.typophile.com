      <p>This is <strong>CK Journaling</strong> from Porch Swing Publishing (1999) and I think it's included in this font package from Broderbund:<br>
      <a href="http://www.broderbund.com/p-47-clickart-fonts.aspx" title="http://www.broderbund.com/p-47-clickart-fonts.aspx">http://www.broderbund.com/p-47-clickart-fonts.aspx</a><br>
      Your sample seems a bit artificially emboldened and slanted</p>
      <p>------------------<br>
      I found it using "Find my Font": <a href="http://www.findmyfont.com" title="http://www.findmyfont.com">http://www.findmyfont.com</a></p>
