    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : FF Danubia</strong></p>
    <p><a href="/wiki/Viktor%20Solt-Bittner" class="freelinking" rel="nofollow">Viktor Solt-Bittner</a> for <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>, 2002</p>
    <p>The starting point for FF Danubia were typefaces of the 18th century. Viktor Solt-Bittner was experimenting with the typical elements of classicistic type (like the abrupt change from hairlines to thicker lines) developing them further and redrawing them. At times he departed from these models, for instance in the basic forms of the italic letters.</p>
    <p>The lower case letters s, v, w and x of many <a href="/wiki/didone" class="freelinking" rel="nofollow">didones</a> are actually smaller upper case letters. By the form of their upstrokes and endings Viktor has tried to adjust them to the other lower case letters.</p>
    <p>Since the Renaissance the form of our italic typefaces has been based on the handwriting of the 16th century, and while handwriting has changed considerably in the course of time these italics haven't. Viktor designed FF Danubia Script as an alternative, mainly for display use, based on 18th century typefaces like the other FF Danubia fonts.</p>
    <p>FF Danubia is suitable for both body and display text. Individual details hardly noticeable in small sizes become more evident in larger size, thereby expressing FF Danubia's character.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/PreviewScreenSnapz002_5485.png"></div><p></p>
