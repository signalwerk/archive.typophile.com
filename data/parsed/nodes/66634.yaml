    html: <p>Maybe it's just me, but I wonder if the execution of the «house» drawing isn't too cold. It looks quite precise, almost like a technical drawing, but I wonder if it shouldn't have a bit more «flair» – I would have expected it to feel a little more refined, also a little more inviting, possibly warmer. It's not much – don't go hand-drawing stuff or something – but maybe a subtle variation in stroke weight might do wonders. Or maybe try not showing every single line that's there (like on all 4 sides of all parts of both windows).</p>
