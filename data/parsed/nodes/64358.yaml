    <p>Hi, im currently involved in a graphics project at uni where i have designed a typeface and now have been asked to design a type specimen poster.<br>
    When designing the typeface it was required that we link the it to a theme and I chose the title 'motion'  i explored human body motion and related each letter to the shapes in which the human body makes when in movement.<br>
    Its required that the type specimen poster has some sort of connection to the theme, full set of characters and a supporting typeface.<br>
    I have done a couple of mock ups, and would really appreciate some feedback! Tell me they are good, average or absolutely rubbish, just please say why :)</p>
    <p>thanks</p>
    <p><a href="http://yfrog.com/j3typespecimenj" title="http://yfrog.com/j3typespecimenj">http://yfrog.com/j3typespecimenj</a></p>
    <p><a href="http://img688.imageshack.us/img688/6632/specimenposter3.jpg" title="http://img688.imageshack.us/img688/6632/specimenposter3.jpg">http://img688.imageshack.us/img688/6632/specimenposter3.jpg</a></p>
