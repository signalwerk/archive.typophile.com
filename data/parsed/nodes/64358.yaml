      <p>I liked the typeface. I loved the drawings.<br>
      I like the Layout on the blue specimen because the gestures explain the typeface and communicate the concept nicely. Maybe Penn has a point though! So make the drawings a companion dingbat font :D<br>
      My other concern is that if this is a standalone piece it should really clearly say that it's a font. I don't want you to fake a foundry and pretend it's published but at least try to spell out the fact that it's an experimental typeface.</p>
