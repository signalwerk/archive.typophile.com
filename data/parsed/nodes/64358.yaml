      <p>The type needs to be the focus. Right now it looks like the images of the people could be included in the character set of the font. Are they? </p>
      <p>Show the type at various sizes. It looks like this is a display font, so I'm guessing it's not meant to be scaled down too far. This is your chance to show off how you intend the font to be used.</p>
      <p>You can always look at the specimens for other fonts for inspiration. <a class="freelinking external" href="http://new.myfonts.com/">MyFonts</a> would be a good place to start looking.</p>
      <p>penn</p>
