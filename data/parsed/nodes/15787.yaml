      <p>Why has this thread fallen off the front page? It took me ages to find it again.</p>
      <p>In short, here’s how it works: the <strong>Newest:</strong> category is quite self-explanatory I guess. The threads that go into the <strong>Hanpicked</strong> category are indeed literally handpicked by the moderators. For example I promoted Joe’s birthday thread to the front page for one day only and removed it after that. The <strong>Hottest:</strong> category is somewhat more complicated, so I’ll let Christian do some ’splainin’:</p>
      <p><cite>“The algorithm that picks the hottest simply picks the threads that have the most posts in the last four days. So a thread that got a lot of attention on the first day, but none on the next three will drop off quickly. A thread can’t just rest on its laurels, it’s got to stay hot. We decided to do it this way so that the content would cycle pretty quickly and stay fresh.”</cite></p>
    html_clean: |-
