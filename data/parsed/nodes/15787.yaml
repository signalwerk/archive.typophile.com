    html: |-
      <p>Character <strong>i</strong> (or j) from <a href="http://www.vikburian.net/maiola.html">Maiola Regular</a> designed by <a href="http://www.vikburian.net/">Veronika Burian</a>.<br>
      She designed this typeface in 2003 in partial fulfilment of the requirements for the Master of Arts in Typeface Design, from The University of Reading.<br>
      Maiola was one of the TDC2 2004 winning entries. This typeface was recently added to the FontFont library, and first appeared in its Catalogue 2004-05 Addendum, on page 3. It covers Extended Latin, Greek and Cyrillic.<br>
      I find it amazing the way she handled the curves. It’s a beautiful typeface full of (Czech) character.</p>
