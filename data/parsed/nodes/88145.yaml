    html: |-
      <p>If the font is being embedded in an embroidery application that will be resold and loaded into computerized sewing machines, you could charge a flat license fee, which would eliminate a lot of royalty “paperwork”. But you would need to have some idea of projected sales.</p>
      <p>It’s not much different than licensing a font for use in an app for digital devices that output to a screen, only this outputs to fabric.</p>
