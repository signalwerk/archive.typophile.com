      <p>I am thinking of charging her the base $25 license fee, plus a commission (don't know what, as she hasn't said what she planned on charging) from every sale. If the third party wishes to use the embroidery font for commercial reasons, I'd like there to be contact information so they can pay me the remainder of the license fee.</p>
      <p>Would that be too much? Or should I just forbid commercial use on the third party's part whatsover?</p>
