    <p>Hello,</p>
    <p>I recently released a free for personal use font on dafont.com, and I charge $25 for the commercial license fee.</p>
    <p>I received an email from someone wanting to create an embroidery version of my font and sell it on Etsy. I am not familiar with Etsy, and both the website itself and Google is unusually useless. What, if anything should I charge for commission?</p>
  html_clean: |-
    <p>Hello,</p>
    <p>I recently released a free for personal use font on dafont.com, and I charge $25 for the commercial license fee.</p>
    <p>I received an email from someone wanting to create an embroidery version of my font and sell it on Etsy. I am not familiar with Etsy, and both the website itself and Google is unusually useless. What, if anything should I charge for commission?</p>
