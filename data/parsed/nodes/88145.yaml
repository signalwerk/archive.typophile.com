      <p>Etsy is perhaps the most popular online market place for those producing arts and crafts for sale. Asking what to charge is impossible for us to answer. It depends on way too many variables, not the least of which is your own opinion. </p>
      <p>That said, it's typical for most font licenses to have a clause that if one is primarily selling the typeface as the product, that the standard license doesn't apply. So you'd certainly be in the norm asking for a custom license for this use.</p>
