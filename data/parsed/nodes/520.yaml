    html: <p>| It could have something to do with the way  <br>| FFF expands the outlines slighty to prevent <br>| filled-in counters in Flash.  <br> <br>It is due to expanded outlines. Flash renders characters on the left glyph margin, but Photoshop will include glyph spillover, if any. Most FFF fonts include these optimizations for the Flash renderer. However, they are not part of the Super Pixel technique. The newest Super Pixel font 'Halogen' is trimmed to the margin instead and does not blur in Photoshop or Flash. (it does lighten a little in Dynamic vs. Static mode in Flash, see image below) <br> <br>The second poster was right, the technique adds hand-antialiasing to pixel fonts without all that dangerous mucking about with hinting. <br><img src="http://www.typophile.com/forums/messages/4101/12951.gif" alt="Business &amp; Halogen in Flash &amp; Photoshop"></p>
    html_clean: <p>| It could have something to do with the way  <br>| FFF expands the outlines slighty to prevent <br>| filled-in counters in Flash.  <br> <br>It is due to expanded outlines. Flash renders characters on the left glyph margin, but Photoshop will include glyph spillover, if any. Most FFF fonts include these optimizations for the Flash renderer. However, they are not part of the Super Pixel technique. The newest Super Pixel font 'Halogen' is trimmed to the margin instead and does not blur in Photoshop or Flash. (it does lighten a little in Dynamic vs. Static mode in Flash, see image below) <br> <br>The second poster was right, the technique adds hand-antialiasing to pixel fonts without all that dangerous mucking about with hinting. <br><img src="http://www.typophile.com/forums/messages/4101/12951.gif" alt="Business &amp; Halogen in Flash &amp; Photoshop"></p>
