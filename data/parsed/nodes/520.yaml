    html: <p>Hrant, Garf,  <br> <br>Antialiasing must be turned on, unless you're in Flash with a dynamic text field. In that case, the operating system itself draws the text. So I get the following results. Notice that at low quality, Halogen and Business lose their grey pixels, but Halogen retains them in the dynamic text field. In every example, dynamic is lighter than static, because it's being rendered by Windows 2000 with basic font smoothing (circa 95 plus pack). The black block is a difference filter between Medium and Best quality - no difference. <br> <br><img src="http://www.typophile.com/forums/messages/4101/13105.gif" alt="Super Pixel Fonts in low quality, static and dynamic text"> <br> <br>Business and Halogen were built differently - Walter Apai of FFF designed Business after seeing my prototype super pixel fonts. Walter improved the use of the technique visually, and I improved the technical side. About a month after Business came out, I released Halogen, using a further refined technical approach.  FFF has access to the full "Super Pixel Fonts"</p>
    html_clean: <p>Hrant, Garf,  <br> <br>Antialiasing must be turned on, unless you're in Flash with a dynamic text field. In that case, the operating system itself draws the text. So I get the following results. Notice that at low quality, Halogen and Business lose their grey pixels, but Halogen retains them in the dynamic text field. In every example, dynamic is lighter than static, because it's being rendered by Windows 2000 with basic font smoothing (circa 95 plus pack). The black block is a difference filter between Medium and Best quality - no difference. <br> <br><img src="http://www.typophile.com/forums/messages/4101/13105.gif" alt="Super Pixel Fonts in low quality, static and dynamic text"> <br> <br>Business and Halogen were built differently - Walter Apai of FFF designed Business after seeing my prototype super pixel fonts. Walter improved the use of the technique visually, and I improved the technical side. About a month after Business came out, I released Halogen, using a further refined technical approach.  FFF has access to the full "Super Pixel Fonts"</p>
