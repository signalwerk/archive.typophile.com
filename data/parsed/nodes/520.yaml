    date_raw: 30 Jul 2003 — 8:05pm
    votes: null
    html: <p>Hi Miguel, Hrant,  <br> <br>This is not a rude question and it comes up a lot. The generic name for greyscale pixel font methods is "sub-pixel fonts". <br> <br>"Super Pixel fonts" describes a patent pending technique which provides reliable rendering on all TrueType environments. Your grey dot fonts will probably be great (disclaimer, I love your fonts) but they won't be "Super Pixel fonts" unless you license with us and build them like we do. Hrant is right, it takes more than sub-pixels. <br> <br>In many countries, It is still legal to protect a method even if you are not a rich corporation.  A patent holder is not obligated to extort and coerce, only to assert ownership. We hope to do this right. <br> <br>-chris</p>
