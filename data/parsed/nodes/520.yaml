    html: <p>I like it. <br> <br>There were not a lot of 48 point bitmap fonts available for MacPaint so I made a few by doubling a 24 point font and smoothing it out in ResEdit in much the same way. <br> <br>A similar method was actually applied by the Apple LaserWriter when printing 72 dpi images (from MacPaint) - a mechanical, but competent, interpolation up to 300 dpi. I think some paint software was capable of the trick as well. <br> <br>I do not agree that his scheme's "errors and inaccuracies would likely be insignificant". No scheme is the equal of the eye, reader or typographer. But it's a big step up from nothing. the author of SmoothType should try it out as a rendering option. This would help old designs keep up with antialiased outline fonts. <br> <br>-chris</p>
    html_clean: <p>I like it. <br> <br>There were not a lot of 48 point bitmap fonts available for MacPaint so I made a few by doubling a 24 point font and smoothing it out in ResEdit in much the same way. <br> <br>A similar method was actually applied by the Apple LaserWriter when printing 72 dpi images (from MacPaint) - a mechanical, but competent, interpolation up to 300 dpi. I think some paint software was capable of the trick as well. <br> <br>I do not agree that his scheme's "errors and inaccuracies would likely be insignificant". No scheme is the equal of the eye, reader or typographer. But it's a big step up from nothing. the author of SmoothType should try it out as a rendering option. This would help old designs keep up with antialiased outline fonts. <br> <br>-chris</p>
