    html: <p>Joseph is correct. We chose a partner with big marketing and credibility in pixel fonts. Flash designers feared grey smudging, so only FFF could offer something with grey pixels that could be trusted. TiD is known only in the Pocket PC and Flash arenas, so we are more or less invisible. <br> <br>PixieType's PixelFX appeared a month after Super Pixel Fonts. It looks like they're using our method. I can't speak to PixelFX' compatibility, different subpixel styles yield different results. <br> <br>We use a lot of tools, including some in-house tricks. FOG is great, FontLab's better at the moment.</p>
