    <p><img src="http://i293.photobucket.com/albums/mm57/DoorstopThe3rd/Metro-1.png"></p>
    <p>Ok, so I used to use this font a lot on MS Paint on Windows XP.</p>
    <p>Through upgrading and such, I lost the font, though I remembered it was termed "Metro". Quick searches showed me quite a lot of fonts share the name, so I gave up looking.</p>
    <p>Had some renewed fervour today, and of all things, found it searching google images and coming across it on ufonts.com, where they termed it "Metro Regular". Downloading it, MS Paint continues to identify it as "Metro".</p>
    <p>So, I guess I've already vaguely identified it; I just want to know is there any details behind this font that would help me not lose it, considering "Metro" is a fairly unhelpful search term. Any specification?</p>
