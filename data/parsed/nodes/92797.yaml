      <p>May it's not the right topic, but I found <a class="freelinking external" href="http://www.themicrofoundry.com/other/tG54_e.pdf" rel="nofollow">your article in tipoGrafica magazine</a> very interesting! (and - ironically- not very legible, in this 4-column-PDF format, at least not in my 18.5" screen)</p>
      <p>I suppose I like it so much, because although I had to work from time to time in other areas of computing and IT technology (to make a living) my primary interest in the last 20 years is machine vision &amp; image pattern recognition. Understanding human vision is for me the most valuable source of information to derive new algorithms for machine vision.</p>
      <p>I have a lot of questions.... I doubt this is the most appropriate thread but I can't give up the temptation to ask one or more questions.<br>
      What is the Mas Lucida project?<br>
      is a font:<br>
      <a href="http://www.themicrofoundry.com/other/maslucida.gif" title="http://www.themicrofoundry.com/other/maslucida.gif">http://www.themicrofoundry.com/other/maslucida.gif</a><br>
      or it is something more, like trying to measure the readability of many experimental fonts?</p>
      <p>...and the primary question which popped-up in my mind while reading your article is, how easy is to design a font having as primary goal to improve readability and at the same time to make the font "beautiful", "elegant", etc - you know all these things that are part-subjective but they have also a deep root in archetypes and current aesthetics, and are changing so slowly?<br>
      Is it possible that our eyes could finally convince our  mind that readable is beautiful?</p>
