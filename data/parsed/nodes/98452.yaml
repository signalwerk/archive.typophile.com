  html: |-
    <p>This great little video, <a class="freelinking external" href="http://vimeo.com/54127183" rel="nofollow">The Top Ten Things Everyone Should Know About Fonts</a>, from type designer and lettering artist Jill Bell, has ten tips to help you get to know, love and use fonts better.   </p>
    <p>The video was revised and abridged from a presentation Bell gave at regional AAF Conference. <a class="freelinking external" href="http://www.jillbell.com" rel="nofollow">Bell</a> has designed fonts for ITC, Monotype and Adobe as well as numerous proprietary fonts for companies. She has judged Linotype and the Type Director's Club's font design contests, and spoken worldwide including at many type conferences.</p><div class="imageWrap"><img src="http://typophile.com/files/graphic_3853.png"></div><p></p>
