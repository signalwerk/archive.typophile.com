      <p>Hi Hrant,</p>
      <p>I agree with your comment in reference to switching to something different, although my intension is to first see what else is out there (that I might not be aware of)<br>
      I may or may not make a switch, but I do think it is good to scope out some other options.</p>
      <p>In terms of what the font should convey about my work I'd like something that says "modern, elegant, simple, clean, smart" with a subtle touch of femininity.</p>
      <p>On that same note, if you visit my website you'll see that I have a somewhat feminine logomark, which is the most prominent part of my identity. So, the typeface should mainly accommodate this mark both on my website and the stationery materials that carry it.</p>
      <p>Hope this explains what I'm looking for a bit better..</p>
      <p>Let me know if you have any thoughts/feedback!</p>
      <p>Thanks!</p>
      <p>.A</p>
