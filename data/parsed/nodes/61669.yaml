      <p>Since you're looking for a font for web and print usage I'd suggest either to stick to your current choice or take a closer look at Helvetica, Arial, Lucida Grande and Geneva. By choosing one of these websafe fonts you will definitely be out of deep waters.</p>
      <p>If you'd like to have a serif font I'd suggest Georgia or Times.</p>
