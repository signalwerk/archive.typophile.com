    <p>Hi there,</p>
    <p>I'm currently in the process of giving a "face-lift" to my personal identity as well as my website + portfolio.</p>
    <p>For the past 2 years I've been using Vista Sans (Alternate + Regular) as the typeface for my identity and promotion materials, and although I still quite like it, I would like to see if you guys have any suggestions in terms of similar typefaces to Vista that I could possibly use.</p>
    <p>Please keep in mind: I'm looking for something that's presentable in both print and web mediums.</p>
    <p>Any/all suggestions are welcome.</p>
    <p>Thanks a lot for your help!</p>
    <p>-Ayda</p>
  html_clean: |-
