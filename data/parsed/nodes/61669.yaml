      <p>Unless there's some sort of technical issue that Vista isn't addressing properly, it doesn't seem to make sense to switch to something <em>similar</em>. If you're switching, it's typically better to switch to something completely different. What do you want your font to convey about your firm?</p>
      <p>hhp</p>
