      <p>Ayda, although your logo has some feminine traits (it's "wispy", and<br>
      mysterious) it also has some masculine ones (symmetry, rigidity of line).<br>
      So the first thing that popped into my mind was Kursivschrift:<br>
      <a href="http://www.identifont.com/samples/linotype/KursivschriftStehend.gif" title="http://www.identifont.com/samples/linotype/KursivschriftStehend.gif">http://www.identifont.com/samples/linotype/KursivschriftStehend.gif</a></p>
      <p>I like some of Jonathan's suggestions too (although I couldn't find Effra).</p>
      <p>BTW, concerning what Stefan said, of course for any text on your site that<br>
      is actual text, you should choose a font that matches your identity. But<br>
      using a web font for all parts of your identity is unnecessarily restrictive.</p>
      <p>hhp</p>
