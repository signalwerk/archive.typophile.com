    html: <p>If a font does not include small caps, scaled-down full caps are what InDesign or Illustrator give you without even showing a warning. They expect you to notice yourself—and in 9 out of 10 cases you really should. As a Gotham alternative with small caps, <a href="http://www.fontshop.com/fonts/downloads/mark_simonson_studio/proxima_nova_complete_ot/" rel="nofollow">Proxima Nova</a> might be worth a try.</p>
