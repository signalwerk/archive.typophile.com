    html: |-
      <p>As Hrant says, context is important.<br>
      Small caps are a contrast style, so what are you most likeley to be contrasting with?<br>
      If you intend to use it primarily for, say, acronyms in running U&amp;lc text, then you should consider the options in that context.</p>
      <p>Another alternative to changing weight is to apply a stroke value in InDesign.<br>
      It may also be useful to add a little horizontal scaling and extra tracking.</p>
