    html: <p>As far as I know, neither width of Gotham comes with small caps, so what paultype seems to be trying is to emulate the look of true small caps by using scaled full caps. I think this does not work at all. In all three cases, the artificial small caps look too narrow and I doubt that this can be remedied by stretching them. If it is just one or two words at a fairly small size, go for the third option.</p>
