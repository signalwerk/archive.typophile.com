    html: |-
      <p>I would say they are also a bit too small. If they're fake, you can change the general scaling used in the "typography" (if that's the name) pallet, but I usually set up a character style, and give a different percentage to height and width. So far, nothing you can do about the weight with InDesign -- smallest you can stroke them is .25 points, and that's usually too much.</p>
      <p>You can also get into disagreements (watch the responses here!) about the right size. For acronyms, I like small caps to be just a touch larger than the x-height of the lower case letters. They should stick out without calling attention to themselves. Yeah, that's a long way from giving a cookbook  answer.</p>
      <p>In your case, you're using cap-small cap, and again, I'd set them a little bigger. They don't quite balance, to my eye.</p>
      <p>One problem with using a character style where horizontal-vertical scaled is applied: kerning will be broken where the scaled letters fall next to an unscaled glyph -- if you set "RCA's" and apply scaling to RCA but not the following apostrophe, the automatic kerning with the A and the apostrophe will be lost. Have to do it by hand, with each occurrence. </p>
      <p>I use this trick with true-cut small caps if they're not to my taste as well. You can't go very far before you mess up the weight enough to look bad, though. Maybe a 5% to 7% change is all that won't show -- depends on the font.</p>
      <p>BTW,  I've used Thomas Phinney's Hypatia Sans where others might use Gotham. I know they're a bit different. I usually prefer Hypatia Sans. Which, BTW, has small caps. No condensed, though.</p>
