      <p>James Moseley was kind enough to set me straight on both of these questions this evening. </p>
      <p>He explained that you can see the Van Dijck type by looking in “Type specimen facsimiles” edited by John Dreyfus and published in London in 1963.</p>
      <p>Also, he explained that the small and famous early Elzevir books contain Garamond and Granjon made fonts.</p>
      <p>Thanks James!</p>
