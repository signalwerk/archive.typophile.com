    <p>Hi there</p>
    <p>As i m new in this community please be a bit easy on me.</p>
    <p>I m looking for a specific design/typography style that i came across the other day.</p>
    <p>I m  quite confident that by reading this, most of you will know what i m talking about.</p>
    <p>I believe that a lot of you out there, have come across with this "Blocky/Bold Font design concept". Mostly found on club flyers. Imagine a typography poster with red background and white font (quite blocky font actually). Most people tend to treat the message like a big square.</p>
    <p>The question is: Is there a name for this typographic treatment, or its just called Typography? Also does anyone know of any designers that have used this style successfully?</p>
    <p>I hope i ve managed to make my self understood. </p>
    <p>Thank you<br>
    Marios</p>
