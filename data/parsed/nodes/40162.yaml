      <p>I think the technique you're describing is done something like this:</p>
      <p>1. Establish your measure (the width of your line) and raise the point size of your first line of type until it equals the measure. Do the same with subsequent lines. Note that size of the type will vary from line to line. By manually breaking the copy, you can control the degree to which the sizes vary.</p>
      <p>2. Adjust the leading (or space after) the first line so that the space between the first two lines interacts (colors) evenly with the letter spaces and word spaces of both lines (which will be different as they are a function of the size of the type). Then adjust the space between all subsequent lines to be optically equal to the space between the first two lines.</p>
      <p>The only thing you can't really control with this technique is the overall depth of the column of type.</p>
