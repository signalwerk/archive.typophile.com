  html: |-
    <p>I’m writing a program to convert/promote old MacTurkish encoded fonts to Unicode, and convert newer Unicode/MacRoman only fonts to MacTurkish.  I’ve been working with the cmap tables. Things work fine in TextEdit and Freehand, but Adobe applications seem to ignore the Turkish characters in the Unicode tables, even though ftxdumperfuser says they match the MacTurkish tables.</p>
    <p>I figured something was up with the post table, so I fixed that as well. Nothing’s happening. What else do I need to change?</p>
    <p>I can email some sample input/output files in a few hours if you like.</p>
