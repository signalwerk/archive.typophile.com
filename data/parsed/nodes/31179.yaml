      <p>I’m pretty sure my program encodes the cmap tables correctly, and Fontforge should be doing it right as well. Still doesn’t work in CS2. What’s strange is that with the 6-glyph test fonts I’m using, all the correct characters show up in the font preview dropdown in Photoshop. When I try to use them in a text field, the typeface switches to Myriad Pro.</p>
