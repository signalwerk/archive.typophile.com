    html: |-
      <p>Generally, Adobe apps don’t care about glyph names and the post table for Unicode encoding - that’s a Mac OS X bug, that we hope Apple will fix some day. For Adobe’s apps that share the core Adobe font engine, the cmap encoding is all that matters for this purpose.</p>
      <p>Regards,</p>
      <p>T</p>
