      <p>Here’s a sample. It’s not actually a font that I’d use as input or output normally, but my main problem seems to be getting any kind of Turkish glyphs (Gbreve, gbreve, Idotaccent, dotlessi, Scedilla, scedilla) to appear in Adobe applications. If I can figure out how to make it work in Photoshop, I can just make my code do that.</p>
      <p>The font looks okay with Fontforge and ftxdumperfuser. I haven’t tested it with Freehand (uses MacTurkish 1-byte encoding) but it’s easy to make it work. This is a brand new file in Fontforge, I just copied over the 6 glyphs.</p>
      <p>It is a sample from some version of AcademyEngraved belonging to my company. The file only includes 6 glyphs, I don’t want to get into any trouble for sharing copyrighted fonts!</p>
