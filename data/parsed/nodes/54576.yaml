      <p>I'm at work right, so I can't post a proper response until this evening. It's interesting that none of the philosophers mentioned here so far—Feyerabend, Deleuze, Guattari, Flasch—are taught in my university. Neither is Derrida or anything in that vein. A few years ago a new prof tried teaching a class on Husserl and almost everyone dropped it. Our department is sort of a mix of analytical and historical philosophy. I think maybe it's becoming more analytical, but I'm not sure. I wanted to focus my attention on continental philosophy, particularly Derrida, but it was suggested to me that since I found it so difficult to interpret, that I should further back in the discussion. I am focusing on the thought of Alexandre Kojève, whose interpretation of Hegel was highly influential on later French thought. And his language is clearer to understand than his influences and those he influenced—Heidegger, Hegel, and Marx on the one hand, and Merleau-Ponty, Foucault, and Derrida on the other—although it is not without its difficulties.</p>
      <p>@Terence &amp; Craig: One the things which led me to be interested in this topic is the complete incongruity between how lectures and seminars are conducted and how papers are written. It led me to wonder this: if a paper is the visual expression of philosophical activity, then why do papers not draw on the same resources? For example, in class, discussion and diagrams are significant aspects of the activity, but philosophical papers are without either. It is as if philosophizing were the "preparatory stages" of the final paper, as Wittgenstein would have it. But if the goal of philosophy is to produce a particular kind of product, then why deny this by forbidding philosophizing about the production itself. What could be more philosophical than this? To this end, last year I wrote a paper as a series of dialogues and correspondences, where the correspondences incorporated diagrams. The idea was to structure the writing according to actual philosophical practice. (This was for one of the professors who supports these kinds of ideas.)</p>
      <p>@James: I think this certainly has something to do with it. As Socrates would have it, the philosopher should point his soul toward being, not becoming. Since the visual partakes of becoming, it should be avoided. But of course Socrates didn't write to get promotions, whereas today's academics do.</p>
      <p>@Karsten: I don't think one could make a knock-down argument against the linguistic use of diagrams. As long the diagrams are developed in a systematic fashion such that their use follows objective rules, they should be just as linguistic as using glyph in sentences. E.g., the diagrammatic work of cartoonist <a class="freelinking external" href="http://nowordsnoaction.files.wordpress.com/2007/03/jimmyspread3.jpg" rel="nofollow">Chris Ware</a>.<br>
      I'll have to write you a proper response later, but I think that if you accept certain of Kojève's premises, it is possible to deduce many the claims I wish to make.</p>
      <p>@Nina: that site you referred to me is perfect! I wish I had found this months ago. I'll have to respond in more detail later. Gotta get back to work!</p>
