      <p>Interesting thread!<br>
      I was going to suggest Deleuze &amp; Guattari too.</p>
      <p>From my experience producing educational materials and tools for my local university, and working with scholars and teachers from diverse fields, I got the very strong impression that while the natural sciences are quite comfortable working with visual methods to corroborate their findings (and even use visualization as a heuristic tool), the humanities seem to have an almost surprising fear of the visual. Some more, some less, of course; history, for example, has been working with charts, graphs, and maps for quite a while, especially so in teaching. Philosophy, I would suspect, being a very "verbal" field from the beginning (I'm surmising), probably retains a strong distrust vis-à-vis the visual, and may be somewhat unconsciously striving to produce "naked" text untouched by the transformative powers of the visual world.<br>
      My impression will be culturally biased, however, as the German-speaking countries tend to have a more difficult relationship to visuality than the Anglophone world in various aspects.</p>
      <p>I don't know if this is interesting to you – or if there are other such programs closer to you and your cultural context –, but there's an interdisciplinary, nationally-funded <a href="http://www.eikones.ch/starte.html" rel="nofollow">"iconic criticism" research program</a> going on here that focuses mainly on the role and impact of images, but they do branch out into visual vs. non-visual (i.e. also designed vs. "non-designed") presentation of content as well. I've used their library, which is small but quite interesting. Maybe someone there could give you some pointers as well.</p>
