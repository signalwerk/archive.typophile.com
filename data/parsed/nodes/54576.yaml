      <p>I have attempted to provide a very brief summary of why I think the design of philosophical works is philosophically relevant. However, I have retained the terminology and the diagrams are quite rough, so the meaning may be opaque at times. Any question you can offer will only help me to better clarify what I am presently unskilled at communicating.</p>
      <p>In Kojève’s philosophy, the philosopher is defined in terms of desire, the desire to become wise, that is, to become a sage. Wisdom (<em>Sagesse</em>, en français) is a form of self-consciousness, viz., it is the answer to every question that a self-consciousness can ask of itself about itself:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/argument-002_3797.jpg"></div> <p></p>
      <p>A self-consciousness has two aspects: consciousness for-itself, and consciousness for-another. In other words, the self-consciousness is both subject and object. Thus, the philosopher desires to answer every question that can be asked of himself both as subject (concept) and as object (thing). What I will argue is that by accepting these premises, one can deduce a conception of philosophy with two aspects corresponding to the two aspects of self-consciousness: philosophy as conceptual inquiry and philosophy as poietic (forming/making) activity. The overall scheme, from the perspective of the philosopher as thinker, looks something like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/argument-003_5140.jpg"></div><br>
      This scheme can be understood as an answer to the question: “How does the philosopher become a sage?” <p></p>
      <p>The question from the perspective of the philosopher as maker would be “How do the things I make tell me what and who I am?”, which would (somewhat chaotically) like this:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/argument-001_3568.jpg"></div> <p></p>
      <p>Lastly the philosopher as slave or servant would ask, “How do I dialectically oppose the opposition between mastery and slavery?” The answer overlaps in all cases; Kojève would say the answers are identical, but this is not precise.</p>
      <p>I should note that the schema of presenting this as three questions and three different diagrams or schemas is not to be found in this form in Kojève’s text. But I think that, as I said earlier, one can deduce them given his conception of man as self-consciousness and his basic terminology. This is a pretty scant overview of the thesis I’m working on, but I am halfway through the section so I can’t really provide too many details about the whole thing. The important point for typophiles is that Kojève seems to present a conception of philosophy that demands the philosopher to be as contemplative about the methods by which he incarnates his thought as the thought itself, for they are dialectically related in this argument. Kojève argues that wisdom, ultimately, must appear in the book form, because only a physical incarnation of thought can dialectically overcome the opposition between spirit and nature which parallels the overcoming of the opposition between mastery and slavery and between eternity and time. (Does that ever need unpacking!) As a philosopher who desires wisdom, only by incarnating my full thought concerning self-consciousness in its both aspect can I make progress toward the goal of self-knowledge. </p>
      <p>At this point I should probably suggest I don’t post any more of this stuff in the general discussions. However, as I develop my rough sketches of diagrams, I would greatly appreciate feedback from anyone who cares to examine them. This will take place on my blog.</p>
