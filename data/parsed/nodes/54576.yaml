      <p><strong>Will:</strong> That "Telephone Book" looks like it is pretty far out. I checked and we also don't have that one in our library. Google Books is pretty generous with that one, though. Authors whose works this bring to mind, of those I've encountered, include <a class="freelinking external" href="http://books.google.com/books?id=f-b2RPA8NF8C&amp;printsec=frontcover&amp;rview=1&amp;source=gbs_summary_r&amp;cad=0" rel="nofollow">Maurice Blanchot</a> (on the very fringes of being called a "philosopher"?) and <a class="freelinking external" href="http://en.wikipedia.org/wiki/Mark_Z._Danielewski" rel="nofollow">Mark Danielewski</a> (a Derridean literaturist, perhaps, though not a philosopher). Neither author, it could be easily argued, deviates from the norms to clarify their!</p>
      <p><strong>Nick:</strong> McLuhan is a notable exception to the rule, and I'm surprised I forgot to mention him. I don't think his trains of thoughts would always be accepted by philosophers as good arguments, though. Nobody in my department, at least, would be likely to call him a philosopher.</p>
      <p>I have Drucker's <em>The Visible Word</em> on loan from another library at present. We have no such books in our library, unfortunately. I have just started to read it. But it is interesting to note that it is presented in a conventional visual academic style, despite its subject matter.</p>
      <p><em> where it vanishes up its own ass</em><br>
      This is priceless. I think that it must seem like I'm wanting to follow the deconstuctionist path. But I am among the persons who thinks that much of this work is unintelligible. "Onto-typo-logy, thus inflected, that is, thus 'reversed' and brought back to the 'subjectal' sphere, finally proceeds from a 'modification of transcendence,' that is, from the transformation of transcendence into 'rescendence', wherein transcendence itself founders and disappears..." (<em>Typography</em>, Phillipe Lacoue-Labarthe, 55–56)</p>
      <p><strong>James:</strong> All the Bergson I've seen is continuous blocks of text. Yet another philosopher not taught in my department, so once again my familiarity is not extensive. I think I was told at some point that he's no longer considered important, so not to bother too much with him. But I could be mistaken on that.</p>
      <p><strong>Karsten:</strong> "I don't think one can make a knock-down argument against x" is just an analytic philosophy expression meaning one thinks x is a defensible position. I think I may have picked it up from Davidson ... As for Pierce, I have not encountered any diagrams in his writings, but I have not read him extensively. Are you thinking of symbolic logic, or did you have something else in mind? I forgot to mention symbolic logic as a diagrammatic form of scholarly writing. Oddly, the use of symbolic logic in papers is also discouraged in my department. And I must confess that I had never heard of Spencer-Brown before. I'll have to check out what we have in our library. Google Books only has snippet views.</p>
      <p>I'll respond specifically about Kojeve in awhile. I have a few chores to do before I can work on a proper response.</p>
