      <p>Well, I ended formal studies in philosophy 40 years ago, so I may be a bit out of date. With that caveat, what you might consider is that analytic philosophy, as a scholarly discipline, has abandoned areas of thought over the centuries. These areas, these kinds of truth, are no longer considered "philosophical," and properly so. For example, religious arguments are not applicable, as the basis of religion is revealed truth. Empirical arguments are not applicable; they have a scientific basis. If there are aesthetic *truths*, they are perhaps revealed, but most of us would like to take them as empirical, allowing that the science hasn't gotten quite that far yet.</p>
      <p>By the way, several things Wittgenstein said about philosophy remain current, no matter how much the academic study has changed . . .</p>
