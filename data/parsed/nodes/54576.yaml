      <p>I am a philosophy student as well (and I am a student at the KABK). I believe a further example could be Paul Feyerabend's "Against Method" when it was first designed and published (I will put up some pictures when I get home). It is not current, but sadly the only example I can think of.</p>
      <p>I think there are good reasons to combine design and inquiry (although I think it must be combined as a last step). There was a special typography class by G. Unger at my university and his lectures strengthened the idea to intertwine content and design in academic papers and journals in general and philosophy in particular.</p>
      <p>Terence</p>
