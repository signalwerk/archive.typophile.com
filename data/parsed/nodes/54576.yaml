      <p>Well, I don't know Kojève, but I fear you are getting into a muddle from which there is no exit--and for all I know Kojève is already there. </p>
      <p>If you are going to get anywhere productive, I think you need to look at the problem Kojève was trying to solve. Are there competing theories of what a sage is? What are the conflicts? Why do the folks who advocate becoming a sage think it is a good thing?</p>
      <p>These kinds of questions look at the 'problem situation' (from the German: problemstellung), and can be very helpful in giving you guidance. </p>
      <p>So far as I know, academic philosophers are not generally regarded as sages. More typically folks like the Confucius, Buddha, Epictetus, and Hillel are called sages. And this name is given because they have some insight into ethics and the conduct of life, not just mystical insight. </p>
      <p>You may get into something very interesting with this, but there is a real danger in landing in a bucket of B.S.</p>
