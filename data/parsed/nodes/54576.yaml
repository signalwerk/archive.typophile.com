      <p>I don't think you have yet articulated the problem clearly enough.</p>
      <p>A big part of the reason that philosophical papers are not particularly well designed is money, that the essays are just put through a template and libraries buy the stuff. Another part of the reason is that most philosophers are not design-aware.</p>
      <p>But neither of these problems is a philosophical problem--a problem of understanding or explaining something. They are instead important practical problems: how to you improve the design of journals and books, and how do you improve education and awareness?</p>
      <p>What is the philosophical problem here?</p>
      <p>I am not saying that you don't have one; I am saying that you haven't made it clear. I have taught philosophy and discussed plenty of essays with students. If you were my student, I'd say: a 'topic' or even a thesis ( eg "academics should be design-aware") isn't good enough, you need a problem. Something concerns you, and that is a good start. But what is the problem?  What are you trying to understand? What isn't clear? What are the different points of view in the existing literature on the issue you are concerned with? Try to answer those questions and they will give your inquiry more focus and direction.</p>
