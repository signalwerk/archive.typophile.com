    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Churchward Type</strong></p>
    <p>Wellington, New Zealand.</p>
    <p>Churchward Type started in 1962 as <a href="/wiki/Joseph%20Churchward" class="freelinking" rel="nofollow">Joseph Churchward</a>’s freelance lettering service. Within six months he had generated enough work to move from his job as Senior Artist into setting up Churchward International Typefaces, which became one of the largest typesetting companies in New Zealand.</p>
    <p>In 1969 Joseph was asked to submit alphabet designs to Berthold Fototypes and saw immediate success. He later went on to sign distribution agreements with D.Stempel AG, Dr Böger Photosatz GmbH/Linotype, Mecanorma-Polyvroom B.V and Zipatone. He self-published a handful of original fonts in 1978 becoming the first and only company in New Zealand to publish original photo-lettering.</p>
    <p>Churchward International Typefaces was forced to close in June 1988 but Churchward Type lives on with a fresh set of independent releases. <a href="/wiki/David%20Buck" class="freelinking" rel="nofollow">David Buck</a> has taken on the role of digitisation.</p>
    <p>Joseph continues to draw alphabets and now has a stockpile of over 300 unique alphabets to his name.</p>
