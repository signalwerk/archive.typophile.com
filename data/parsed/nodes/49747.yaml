      <p>Dear Charles,</p>
      <p>Thank You for all the invaluable insight!<br>
      Actually I considered using ‘FF Quadraat’ with ‘Porson’, but rejected it<br>
      because of its overelaborate ‘§’. (There are no less than 168 §§ in the<br>
      grammar.) It would be stimulating though to see the book recommended.</p>
      <p>*   *   *</p>
      <p>By the way I think the numbers and ratios are often much gentler tyrants<br>
      than the pure feelings...</p>
      <p>*   *   *</p>
      <p>Unfortunately the custom fonts are far out of my reach... And the current<br>
      commission is most probably my last opportunity to work with the Greek<br>
      alphabet. (I am afraid that no more than a dozen books containing Greek<br>
      settings have been published in the whole Finnish printing history.)</p>
      <p>*   *   *</p>
      <p>Furthermore, do You happen to know if ‘DTL Albertina Greek’ supports<br>
      polytonic Greek. (It is obvious that DTL does not answer to any inquiries.)<br>
      The ‘DTL Albertina Polytonic’ mentioned here might be, well, customized:</p>
      <p><a href="http://www.microsoft.com/typography/links/news.aspx?NID=2533" title="http://www.microsoft.com/typography/links/news.aspx?NID=2533">http://www.microsoft.com/typography/links/news.aspx?NID=2533</a></p>
      <p>P. L.</p>
