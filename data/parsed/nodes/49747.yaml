      <p>I don’t much like the match of Arno caps &amp; Porson lowercase.</p>
      <p>But you are right, the caps in Porson are too big for comfort in most text settings with the PostScript version. I resized (&amp; therefore had to reweight) our version long ago. But that was a couple of sales of Monotype Corporation ago, &amp; I had permission. I doubt you could get it today.</p>
      <p>The Greek Font Society has an Open Source version of Porson Greek</p>
      <p><a href="http://www.greekfontsociety.gr/pages/en_typefaces19th.html" title="http://www.greekfontsociety.gr/pages/en_typefaces19th.html">http://www.greekfontsociety.gr/pages/en_typefaces19th.html</a></p>
      <p>It isn’t quite as good as the Monotype, but if you’re going to fiddle, it IS open source &amp; there wouldn’t be any license issues.</p>
      <p>GFS has some other nice Greek fonts, look at Olga on the 20th century page.</p>
      <p>And I’ve always liked Wilson Greek, Matthew Carter’s digitization of Alexander Wilson’s fonts. Not sure it is available now, though.</p>
