    <p>Dear Friends,</p>
    <p>It has become clear to me that the great disparity of height<br>
    between the upper and lower case of the Monotype ‘Porson’<br>
    makes it difficult to find an utterly pleasing latin companion<br>
    for this distinct cursive.<br>
    At long last I took a bunch of old books on my desk and<br>
    measured up some ratios between the upper and lower case<br>
    letters used in the course of time by the Oxford University<br>
    Press. And it seems indeed that the upper case glyphs have<br>
    increased as follows:</p>
    <p>1882 (a metal type for hand composition)<br>
    Cap Height = 1,62 units<br>
    x-height = 1,00 units</p>
    <p>1955 (a metal type for machine composition)<br>
    Cap Height = 1,86<br>
    x-height = 1,00</p>
    <p>1978 (a type for photosetting)<br>
    Cap Height = 1,91<br>
    x-height = 1,00</p>
    <p>1993 (a digital type)<br>
    Cap Height = 1,91<br>
    x-height = 1,00</p>
    <p>*   *   *</p>
    <p>I have been examinig thus if the existing uppercase of the<br>
    Monotype ‘Porson’ could be successfully replaced by capitals<br>
    loaned from an entirely another font. The ‘Arno’ for example<br>
    can be seen on the left column (and the ratio 1,62/1 was used):<br>
    </p><div class="imageWrap"><img src="/files/Porson_4993.jpg"></div><br>
    What say You?<p></p>
    <p>P. L.</p>
