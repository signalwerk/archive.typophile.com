    html: |-
      <p>Charles</p>
      <p>Well, ‘DTL Albertina Greek’ might not look as good as it sounds.<br>
      It is just that I have not seen any text settings composed in ‘Albertina<br>
      Greek’—the individual letters certainly bear some resemblance to<br>
      Mr. van Krimpen’s ‘Antigone’, which does seem a virtue to me<br>
      (I am well aware of the criticisms towards ‘Antigone’, but I consider<br>
      it exceptional when composed in 16-points with ‘Lutetia’.)</p>
      <p>John</p>
      <p>I am not very keen on Mr. Slimbach’s Greek types. ‘Arno’ actually<br>
      reminds me of Willy Wiegand’s ‘Homer’ which was used in archaistic<br>
      editions of Sappho (1921) and Homer (1923–1924) by the Bremer<br>
      Presse. It is as if the types aforementioned were too conscious of<br>
      their fine calligraphic ancestry... Having said that, I do notice that<br>
      something similar could be said of the ‘Antigone’.</p>
