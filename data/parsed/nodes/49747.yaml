      <p>Dear Charles,</p>
      <p>It is true of course that ‘Arno’ and ‘Porson’ do not match remarkably well,<br>
      but astonishingly well with such incompatible pedigrees.<br>
      In the ‘Agamemnon’ of Aeschylus, printed by John Clay at the Cambridge<br>
      University Press in 1910 the upright capital letters are used:</p>
      <p></p><div class="imageWrap"><img src="/files/Porson_CUP_1910_3702.jpg"></div><br>
      <div class="imageWrap"><img src="/files/Porson_CUP_1910_2_5602.jpg"></div><p></p>
      <p>Might I ask, how much You decided to diminish the cap-height of the digital<br>
      version? (My very own skills are not sufficient when it comes to altering any<br>
      existing designs and that is the reason for my searching.)<br>
      Mr. Carter granted me his kind permission to use ‘Wilson’ in my recent<br>
      ‘Compositor’s Epilogue’ to a fresh Classical Greek Textbook for Finnish<br>
      readers, it is a masterpiece, but I wonder if it could survive moderate point<br>
      sizes occasionally required in the forthcoming Greek Grammar?<br>
      On the other hand ‘Wilson’ might be a perfect companion to ‘TEFF Lexicon’...</p>
      <p>P. L.</p>
