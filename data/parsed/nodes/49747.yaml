      <p>Second things first:</p>
      <p>I think Wilson Greek works very well with Quadraat, see</p>
      <p><a href="http://books.google.com/books?id=YenwwRfce9YC&amp;dq=%22household+and+city+organization+at+olynthus%22&amp;pg=PP1&amp;ots=8-a7kcE0K3&amp;sig=eH-gO-JlkD9qF37WAruetaTkxU8&amp;hl=en&amp;sa=X&amp;oi=book_result&amp;resnum=4&amp;ct=result" title="http://books.google.com/books?id=YenwwRfce9YC&amp;dq=%22household+and+city+organization+at+olynthus%22&amp;pg=PP1&amp;ots=8-a7kcE0K3&amp;sig=eH-gO-JlkD9qF37WAruetaTkxU8&amp;hl=en&amp;sa=X&amp;oi=book_result&amp;resnum=4&amp;ct=result">http://books.google.com/books?id=YenwwRfce9YC&amp;dq=%22household+and+city+o...</a></p>
      <p>Page 306 shows Wilson run into the text at a note-size setting; page 1 shows a text-size setting.</p>
      <p>Of course, this from an American (European-American if we use the current politically correct practice of appending the continent of our ancestors), who doesn’t see Greek in everyday life. Someone who reads Greek newspapers, magazines, books, etc. on a daily basis may have a different feeling.</p>
      <p>* * *</p>
      <p>My discomfort with the Arno caps &amp; Porson lowercase doesn’t stem from the fact that the caps are upright &amp; lowercase is inclined. As I remember, that was also the case with the old metal Porson. It is more the weight &amp; contrast of the Arno; the heavy strokes are not as heavy, and I believe the fine lines are not quite as fine. Too, the Arno is broader for it’s height; too broad for Porson.</p>
      <p>This isn’t a matter of numbers, but of feel.</p>
      <p>You asked how much I reduced the ratio of the caps in Porson — “about” 1.7 times the x-height. Depends on where you measure. This is the ratio of the top of the cap Epsilon, at 605 units (1,000 unit em) and the flat part of the serif on a lowercase nu, at 349 units. But the rounded part of the nu is 364, the same as a lowercase omicron.</p>
      <p>I didn’t do the scaling by aiming for a particular raito. I scaled them according to what I thought I could get away with. It was also a non-linear scaling, and I re-worked the weighting of the caps (&amp; some of the lowercase letters also, from my notes).</p>
      <p>The GFS Porson has a cap height of 703 (Epsilon, as above), and the nu is 396 and 404 (as above). That works out close to 1.75. The GFS Porson also has upright caps &amp; inclined lowercase.</p>
      <p>If you set a lot of Greek and are wedded to Porson, it may be worth your while to have the font redrawn to your taste. I peeked at your user information; it says “graphic designer.” I make my living mainly setting type, and can justify the cost of custom fonts, either by paying for a redrawing or doing the work myself. When I work over fonts, I get no return, since I do not sell type. So for me and you, custom fonts would just be another business decision. Well, that’s the argument available to us — I suspect it’s really about good type, but our motives are private business.</p>
