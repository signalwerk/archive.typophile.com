    <p>Please help me identify the font used on this decal. Note: this is part of a Johnson boat motor.</p>
    <p>I have been able to find some near matches--like Agency and Bank Gothic--but have not been able to find a match with the horizontal terminal on the G and the correct slope on the 2.</p>
    <p>Thank you for any help you can provide,</p>
    <p>Duncan</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Johnson-logo-typesample-3_6465.jpg"></div><p></p>
