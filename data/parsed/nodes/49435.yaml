    <p>Hello, I’m trying to find out if this logo uses any existing font? It is a french manufacturer of mobile homes. Obviously the ’o’ character couldn’t be part of the font; that is a sub-logo of theirs. But the rest, is it anything you recognize? I’ve tried the WTF checker and and some questions-based guides, but no luck. The image is from their website, <a href="http://www.pilote.fr" title="http://www.pilote.fr">http://www.pilote.fr</a> . They have been around for quite some time, so I doubt it is a recent font.</p>
    <p>Thank you in advance for any hints.<br>
    Martin Persson, Sweden</p>
