    <p>I need to create an icon that can be understood by speakers of many languages. I'm thinking of incorporating an exclamation point, but I'm wondering how universal it is. According to wikipedia:</p>
    <p> "The exclamation mark is common to languages using the Latin alphabet, although usage varies slightly between languages. The exclamation mark is also used in languages with other scripts, such as Greek, Russian, Arabic, Hebrew, Chinese, Korean and Japanese."</p>
    <p>It mentions Arabic, but what about any of the other languages of the Middle East?</p>
    <p>Does anyone know of any languages (not counting languages spoken in undeveloped areas) that don't use the exclamation point (and if they use a substitute, what is it)?</p>
    <p>thanks!</p>
    <p>Jonathan</p>
