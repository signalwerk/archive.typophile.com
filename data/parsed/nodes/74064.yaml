      <p>?</p>
      <p>I don't think there is any symbol that can be recognized by all people on the world. Even something simple like the arrow → is ambiguous -- the "Warning: Laser" icon uses it in a reversed form.</p>
      <p>Latin, Greek, Russian, Arabic, Hebrew, Chinese, Korean and Japanese -- with both first- and second language speakers --, to how many people does that add up? Who are you afraid of missing out on? Cherokee, Amaya, Aussie Aboriginals?</p>
