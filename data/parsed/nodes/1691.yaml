  html: <p>&gt;&gt; having a full-fledged off-topic forum on Typophile is not a good idea.  <br>-- hhp, from the Definition of Terrorism thread. <br> <br>I think it remains to be seen whether the non-typographic <br>thread is useful or not, whether it'll turn out good, bad or <br>ugly. Formalized venting is one way to describe it, but not <br>the only way. <br> <br>It hasn't really been tested. <br> <br>Of course it seems like a useful place to share an off-topic <br>link, a news item, lawyer jokes, Bengal Tiger sightings, etc. <br>This stuff is getting tossed into General Discussions. <br>This is just a more specific place to toss it. <br> <br>Focus, that's your mantra Hrant, if i'm not mistaken. <br> <br>Does organizing a library by subject compartmentalize discourse?... <br> <br>Why not just have one big general thread <br>and call it Stuff about Letters; that'll contribute to <br>making us all rounded people I suppose. <br> <br>The thread also serves as a spillover area when things veer <br>off topic and turn ugly. Who wants Hrant v. William <br>name-calling in their InBox? I know I know, we haven't <br>seen ugly. <br> <br>To say that the existence and usage of a little thread in an  <br>online forum makes us less-rounded people?... autobrainwashing?...c'mon. <br> <br>bj</p>
  html_clean: <p>&gt;&gt; having a full-fledged off-topic forum on Typophile is not a good idea.  <br>-- hhp, from the Definition of Terrorism thread. <br> <br>I think it remains to be seen whether the non-typographic <br>thread is useful or not, whether it'll turn out good, bad or <br>ugly. Formalized venting is one way to describe it, but not <br>the only way. <br> <br>It hasn't really been tested. <br> <br>Of course it seems like a useful place to share an off-topic <br>link, a news item, lawyer jokes, Bengal Tiger sightings, etc. <br>This stuff is getting tossed into General Discussions. <br>This is just a more specific place to toss it. <br> <br>Focus, that's your mantra Hrant, if i'm not mistaken. <br> <br>Does organizing a library by subject compartmentalize discourse?... <br> <br>Why not just have one big general thread <br>and call it Stuff about Letters; that'll contribute to <br>making us all rounded people I suppose. <br> <br>The thread also serves as a spillover area when things veer <br>off topic and turn ugly. Who wants Hrant v. William <br>name-calling in their InBox? I know I know, we haven't <br>seen ugly. <br> <br>To say that the existence and usage of a little thread in an  <br>online forum makes us less-rounded people?... autobrainwashing?...c'mon. <br> <br>bj</p>
