    html: <p>Ok. I've lightend up the diagonal stroke on the "a" and made a straight "j". Also in the diagram below, I've illustrated a possible top-terminal change. Good idea? <br> <br><img src="http://www.typophile.com/forums/messages/29/36570.gif" alt="j-test argos"></p>
