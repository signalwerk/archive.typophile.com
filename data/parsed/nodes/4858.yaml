  html: <p>Hello, here is an alphabet that I'm working on with another student in Offenbach. The design is still in its first stages, so the text that you see is just illustrator vectors, not a working font. <br> <br>A few letters are bothering us in particular; c, f, l, t, and x. As usual any of your comments would be appreciated! <br> <br><img src="http://www.typophile.com/forums/messages/29/36413.gif" alt="Argos Sample 1"></p>
