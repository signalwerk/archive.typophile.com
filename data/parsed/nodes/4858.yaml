    html: <p>Yes, Titus, I do! Do you have a suggestion for the letter "j"? <br> <br>Below is a diagram illustrating some thoughts I have about the letter "a". Would it be good to <i>romanize</i> the form? This would allow the presnt "a" to be more different in the italic. <br> <br><img src="http://www.typophile.com/forums/messages/29/36567.gif" alt="argos a test"></p>
