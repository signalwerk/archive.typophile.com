    <p>Veronika was invited to lead a two-day workshop during the 12th "Tage der Typografie", organised by Tania Huckenbeck and Peter Reichard with the support of Akademie Druck+Medien NRW. The event started with an afternoon of lectures and continued with four different simultaneous truely analog workshops. Most of Veronika's students were beginners with very little experience in type design, but with a lot of enthusiams. They started off with some quick drawing excercises experimenting with three parameters. Those were then combined and developed further to a personal design. </p>
