      <p>GJ</p>
      <p>One of the finest lettering artists and teachers from Manchester was Tony Forster. He also designed, as well as consulted on, type with the likes of Phill Grimshaw (deceased), also from Manchester and Colin Brignall with Letraset. Tony passed away only weeks ago, sadly. Many are indebted to Tony; and, his work is/was Brilliant, and not in the overused sense. You might wish to contact Timothy Donaldson who is also in the area.</p>
      <p>This may not speak to the city’s Victorian ethos but he definitely was a Manchester titan. Thank you for posting this as it has suddenly helped me, as I am struggling with his obituary this week for an international publication... titan is appropriate.</p>
      <p>Michael</p>
