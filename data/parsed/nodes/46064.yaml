      <p>Michael</p>
      <p>What sad timing. Sincere thanks for introducing me to Forster, and for the reminder of Grimshaw - it certainly seems appropriate to reference them in the work we’re doing. Willow is already a very familiar typeface to me as a resident of the city - I shall look for its unforced decorative sopistication particularly fondly in future.</p>
      <p>For me of the great strengths of the city is the way it reconciles its heritage with a very modern attitude, so this kind of work is highly relevant... though I’m still very much hoping to dig up some earlier typographical reference as well.</p>
      <p>One again, many thanks for your kind help</p>
      <p>Guy</p>
