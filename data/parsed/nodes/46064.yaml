      <p>You may want to check out the Washington Calligraphers Guild. I did several editions of Scripsit and highlighted the work of Tony, Phill, Stephen Raw and Peter Horridge, Stayed with Tony a couple of years ago when I taught in the North and then went to Roehampton to lecture/teach. His studio was incredible. Six foot piles of paper and books everywhere and a tiny path to his table.</p>
      <p>He was a wonderful man. After I did the article we became great friends and talked every other Saturday for 12 years. What a wealth of info he was and OH what a prankster!</p>
      <p>Michael</p>
