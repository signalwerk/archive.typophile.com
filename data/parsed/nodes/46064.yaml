    <p>For a current client, I’m trying to research some typography historically appropriate to the city of Manchester (UK). Recent history is easy - Peter Saville etc, but I’ve drawn a blank with anything that might speak to the city’s Victorian and early c20th history - </p>
    <p>Could anyone suggest any typographers, typefaces, etc that might be relevant?</p>
    <p>Many thanks in advance!</p>
