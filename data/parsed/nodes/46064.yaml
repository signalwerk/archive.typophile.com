      <p>Hi I have just registered on this site and the first posting I see is that Tony Forster had passed away back in June. Is this the same Tony Forster who was from the UK, and taught at Bolton College of Art, Bolton, Greater Manchester UK starting back in the 70’s and then for 25 years?</p>
      <p>If yes can someone confirm this for me as it would be greatly appreciated. Tony was my Tutor/Mentor at college between 77 - 81, and then in the early part of my career.</p>
      <p>Is there somewhere where I could send a message of condolence?</p>
      <p>Thanks.</p>
