      <p><strong>Akira</strong> is right, just checked the Parachute site, indeed they are. Great thanks for the help!</p>
      <p>Still, judging by the bad karma of Panos in the <a class="freelinking external" href="http://www.typophile.com/node/39777" rel="nofollow"><strong>Parachute thread</strong></a>, cannot help wondering what design has been the 'inspiration' this time. Even though the case is solved, my curiousity stays. </p>
      <p>At least for the serif there are many similarities to Anselm, but haven't got a chance to compare the outlines. Borrowing there is (as was in Muse, discussed <a class="freelinking external" href="http://www.typophile.com/node/43240" rel="nofollow">here</a>), but... not exactly sure about the source.</p>
