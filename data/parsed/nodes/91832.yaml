    html: |-
      <p>Photoshop, Illustrator and InDesign are each designed for different purposes.  Photoshop is mostly for editing bitmapped images (like photos). Illustrator is for editing vector images (illustrations, logos, etc). InDesign is for doing page layout (creating brochures, posters, etc.).  </p>
      <p>You can certainly create a printed piece entirely in Photoshop or Illustrator, but in most cases (especially if it's a multi-page document) you're better off creating it in InDesign, and then import graphic elements (photos, illustrations) that you've created/edited using Photoshop or Illustrator.</p>
    html_clean: |-
      <p>Photoshop, Illustrator and InDesign are each designed for different purposes.  Photoshop is mostly for editing bitmapped images (like photos). Illustrator is for editing vector images (illustrations, logos, etc). InDesign is for doing page layout (creating brochures, posters, etc.).  </p>
      <p>You can certainly create a printed piece entirely in Photoshop or Illustrator, but in most cases (especially if it's a multi-page document) you're better off creating it in InDesign, and then import graphic elements (photos, illustrations) that you've created/edited using Photoshop or Illustrator.</p>
