    html: |-
      <p>I've used InDesign for some initial web layouts (just to study them onscreen or on a printout), since I can work quickly in InDesign and it has good text tools, but it's not a good choice for actually building web pages.</p>
      <p>In CS 5.5 (and perhaps earlier versions) can export InDesign to html (File &gt; Export &gt; html), although I've never tried it myself.  </p>
      <p>You can copy and paste objects from InDesign to Photoshop, which I think works pretty well for images but text becomes rasterized if you paste the entire text box as an object. But you could create new text boxes in Photoshop and then paste text into them, although you'd probably have to reformat the text.</p>
    html_clean: |-
      <p>I've used InDesign for some initial web layouts (just to study them onscreen or on a printout), since I can work quickly in InDesign and it has good text tools, but it's not a good choice for actually building web pages.</p>
