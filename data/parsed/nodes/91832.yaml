      <p>Fred, I pit you. I did this once too. </p>
      <p>Sometimes I'll mock up a site in inDesign in order to show a client what the text will look like. Otherwise, I would build it all in photoshop and also send along a spec sheet for the typography and a file of the text. I don't bother to put all the actual text into the photoshop file. </p>
      <p>You will find benefit from learning rudimentary html and css in order to mock-up column widths etc so you can see what the sizes and proportions look like in actual browsers and devices.</p>
