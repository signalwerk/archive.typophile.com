    html: |-
      <p>&gt; Ask any oldtimer about these apps and you will notice their eyes misting up…</p>
      <p>I'm one of those old-timers. </p>
      <p>There are many things from the early days that I remember fondly, but not doing pasteup with rubber cement. Never liked the fumes, and a fellow designer was hospitalized for a week after rubber cement vapors were ignited by a candle and set his clothes on fire. Nor do I miss using tweezers to position a single, missing comma into a layout, or reflowing a long paragraph by cutting apart each line and manually reassembling it. </p>
      <p>(Eventually I switched to wax, which was an improvement but still kind of messy.)</p>
      <p>Never used PageMaker, but used Quark for many years, and those days I remember much more fondly. At the time I liked it a lot. It seemed like a miracle to be able to manipulate type live onscreen. I don't think people today appreciate how amazing it seemed at the time.</p>
      <p>I wasn't tempted by version 1 of InDesign, as I really liked Quark and InDesign had some shortcomings, but eventually I made the switch and never looked back.</p>
