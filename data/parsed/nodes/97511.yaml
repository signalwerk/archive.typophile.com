    html: <p>Bitstream has done it. For their fonts numbers served as codes, though. Numbers also indicate the weight of the font like in Jos Buivenga's <a class="freelinking external" href="http://www.myfonts.com/fonts/exljbris/museo-sans/" rel="nofollow">Museo</a>.</p>
