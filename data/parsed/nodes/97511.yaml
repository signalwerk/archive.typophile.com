    date: 2012-10-24T13:01:00
    date_raw: 24 Oct 2012 — 1:01pm
    votes: null
    html: <p>It is something that has long been advised against, but even back in the mid-90s we didn't run into actual problems with '1530 Garamond'. It is possible that there is some piece of software out there that will gag on a number in one of the key font names, but I've not come across it yet.</p>
