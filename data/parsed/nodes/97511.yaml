  - id: 527715
    user: 48268
    date: 2012-10-25T02:39:00
    date_raw: 25 Oct 2012 — 2:39am
    votes: null
    html: <p>I have just run a quick test with a Mac Postscript Type 1 font using a number in all of the naming fields (relevant to that format) and both Word (2011) and InDesign (CS6) picked it up without any problems. I remember encountering some issues with some of the Bitstream fonts many years ago but can no longer remember exactly what version of the Mac OS I was running or what software threw up the problem, though I suspect that it was Quark Passport 4.11 and that using unconventionally named fonts was the least of the issues encountered.</p>
