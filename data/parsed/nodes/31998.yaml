      <p><em>“(I can zoom to 400,000% in CorelDraw)”<br>
      lol</em></p>
      <p>Read it and weep...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/405651_4566.gif"></div><p></p>
      <p>And while we're at it...</p>
      <p><em>Illustrator curves collapse like a pricked balloon when a point is removed. Fontlab curves spring out with firmness. The difference between the two in type design is quite valuable.</em></p>
      <p>CorelDraw will preserve the curve even between control points separated by as much as 220° of arc; and, unlike FontLab, it doesn't (arbitrarily, it seems) convert segments from curve to line when you delete some points...even more valuable (at least to me).</p>
