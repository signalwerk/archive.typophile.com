      <p>Just to weigh in on this discussion . . . The timing couldn't be more appropriate for me since I'm just now making the transition from my old work process to my new one . . .</p>
      <p>I have drawn all my fonts in Illustrator 8.0 and done the import to FOG process for years and I can see moving forward continuing to draw my letters in Illustrator for the primary reason that the tool feels comfortable to me and I can draw very fast and freely. . .</p>
      <p>That said, while I'm working through the conversion of the Filmotype library, my job is not creation but tracing and while I could blow quickly through this in Illustrator, I know the work benefits from being traced at scale on a 1000em grid so since I'm working on that as my primary goal, it makes perfect sense to draw in that manner right from the start.</p>
      <p>I'm not terribly fast but I'm getting faster and will continue to do all my conversion tracings in FLAB Studio 5.</p>
      <p>It remains to be see whether my chops with it will get to the point where it becomes my default drawing app as well. It makes sense that it should but my tastes are split at this point . . .</p>
      <p>One thing I will point out working wih both systems is that I LOVE the way I can clearly see the outline forms when I'm drawing in FLAB, Illustrator has it's own screen rendering engine and sometimes depending on the level of zoom, the forms aren't quite what they should be and even perfectly drawn curves are indeed slighly flat depending on how zoomed in you get and print out differently as well . . .</p>
      <p>Stuart :D</p>
