      <p>I prefer to work in one application.<br>
      I used to use Fontographer, and switched to FontLab a couple of years ago.<br>
      It took me a while to adapt to its drawing tools, as I was really comfortable in Fontographer.<br>
      I've always (almost 20 years!) disliked Illustrator's drawing tools.<br>
      BTW, Fontographer was the first vector-drawing application for the "personal computer", preceding Illustrator by two years.</p>
      <p>I can't imagine drawing in a program other than Fog or Flab, without the metric guidelines, and without being able to instantly inspect characters in word formation in the metrics panel. Say I'm adjusting the ear of the "r" -- it has to work nicely with several other charatcers, so I type "raryrt" etc in the metrics panel, and then maybe do the same thing with an alternate version of the r. Then I fiddle with my ears till I get something that works perfectly.</p>
