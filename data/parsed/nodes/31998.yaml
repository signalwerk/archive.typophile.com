      <p>At Adobe we use FontLab for designing (drawing the outlines), and for some parts of the production process (making the font files).<br>
      Namely, we do basic hinting setup (alignment zones, standard stems), kerning (although we have our own macros to translate that data into the 'kern' feature), and basic naming for generating '.pfa' fonts. These are then processed with the <a href="/wiki/AFDKO" class="freelinking" rel="nofollow">AFDKO</a> tools (Autohint and MakeOTF). For quality assurance we use the AFDKO's CheckOutlines and CompareFamily, among other tools and tests.<br>
      We use the <a href="/wiki/Multiple%20Master" class="freelinking" rel="nofollow">Multiple Masters</a> technology extensively.</p>
