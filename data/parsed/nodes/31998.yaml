  html: |-
    <p>Do the pros making fonts these days for the big foundries really use <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a> (or, I suppose, <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a>)?</p>
    <p>I recently finished work on a font I needed for internal purposes, but for the sake of education, I decided to make the font as "complete", as I could; I implemented a full character set, went through the process of class-based metrics and kerning, etc., even though these features really weren't needed.</p>
    <p>I designed the glyphs in <a href="/wiki/Adobe%20Illustrator" class="freelinking" rel="nofollow">Illustrator</a>, and while that went fine, the process of creating an actual font using FontLab was incredibly tedious. I found the program to be unstable and buggy in numerous aspects, not the least of which was the "dissapearing metrics classes" I posted about last week (which others have apparently encountered as well).</p>
    <p>To be honest, I'd love to make more fonts, but the prospect of having to wade through the FontLab jungle again for such a labor-intensive project is a deal-breaker.</p>
    <p>So, to restate my question, would someone working on a complete typeface project (as in, multiple weights, styles, "Pro" character sets, etc.), like say, Myriad, or Caslon, or whatever, actually use FontLab? I can't imagine getting halfway through a project like that without killing myself. :)</p>
    <p>If there's anything better out there, I'd *love* to know about it.</p>
    <p>Thanks!</p>
