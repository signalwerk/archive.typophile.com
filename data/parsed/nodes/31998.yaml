      <p><em>How many workshops and discussions, including in the corridors, about drawing in Illustrator are there are font conferences? None that I’ve seen or heard. How many about FontLab: lots.</em></p>
      <p>Well, the answer to that is obvious. FontLab's drawing tools require contant non-intuitive workarounds and endless questions from people who have never had the pleasure of working with a real drawing application. Experienced Illustrator users require no such nonsense.</p>
      <p>Really, I'm just kidding. Couldn't resist. All in fun! Insert smiley face here.</p>
      <p>Seriously though, I'm am genuinely curious about the attraction to FontLab's drawing tools. With Illustrator (and to a lesser extent FreeHand and CorelDRAW) being the dominant vector drawing program, I assumed that most type designers would have started out using mainstream, dedicated vector drawing applications before they actually took up type design. Which brings up another question: once again, I assumed (and quite possibly mistakenly so) that most type designers started out as graphic designers and, at some point, moved to type design and took their tools with them. I wonder how many mostly full-time type designers first learned a mainstream drawing tool and then gave it up to draw fonts in favor of FontLab's or Fontographer's drawing tools.</p>
