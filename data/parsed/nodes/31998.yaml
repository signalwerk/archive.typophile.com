      <p>I use FontLab Studio 5 on a Mac. It took a little while to get used to it and set it up in a way that I like but now it seems quite usable. I used to start drawing glyphs in Illy but found that to be a waste of time and needed too much cleanup. Now I just start drawing outlines straight away in FL5. I don't scan anything in, I just use my paper sketches as a notebook reminder if I need to and this is rare.<br>
      I think you have to comit to a work process and set of tools and just work it out by giving time to it. Whether your going through a multistep progression of tools like Nick or just keeping it simply one program, it is up to you. Type design is mostly solitary work so you are not bound by what suits others. Large foundries like Adobe might have more a collaborative process with some more common way of working needed perhaps.</p>
