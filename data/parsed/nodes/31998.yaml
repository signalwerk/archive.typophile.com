      <p>So, in answer to the original question, the consensus seems to be that individuals work in their comfort zones, and there's no single approach which works best for everyone.</p>
      <p>I create my outlines in CorelDraw because I've been using it since v1, and its tools seem second nature to me now. I like the fact that I can use a <strong>single tool</strong> (the Shape Tool) to...</p>
      <ul>
      <li>add or delete nodes;</li>
      <li>make a node sharp, smooth or symmetrical;</li>
      <li>change a line segment from straight to curve, and vice-versa;</li>
      <li>rotate, scale or align nodes; and</li>
      <li>add but not move or delete guidelines (essentially locking them during curve editing; guidelines can be added, moved and deleted with the Pick Tool).</li>
      </ul>
      <p>FontLab's <strong>merge contours</strong> function is OK, but it's trim and intersect functions suck, and the <strong>smooth curve</strong> slider in CorelDraw v9 is, IMHO, unsurpassed by any other drawing program -- which is important, since its <strong>convert stroke to outline</strong> function tends to be a little promiscuous about adding nodes.</p>
      <p>Other tools comes in handy for other tasks, too. When I kern monocase fonts, I only set kerning for the caps. I then export the metrics, open the AFM file in a text editor, copy and save the KPX info to another text file, then open that file in Excel as a space-delimited file (which puts the first and second characters in separate columns), then I copy and paste the kerning info back into the file twice. In the first copy, I run a macro that converts the second character to lowercase, and in the second copy, I convert both the first and second characters to lowercase. I then reverse the process, and end up with an AFM file with identical kerning for caps-caps, caps-lower and lower-lower, then import that into FontLab. This process may not be everyone's cup of tea, but it works for me...</p>
    html_clean: |-
