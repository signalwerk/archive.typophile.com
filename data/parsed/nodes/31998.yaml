      <p>I create outlines in CorelDraw v9 (all subsequent versions have problems, ranging from mildly annoying to really dismal), then I export outlines into Fontographer (because its import function is so much better than FontLab's cut-and-paste via AICB method). I do basic outline clean-up and metrics adjustments in Fontographer, then generate a PS Type 1 font. I then open the PS font in either DTL Fontmaster Light (if I require some serious fine-tuning of outlines, since DTL blows the socks off FontLab in terms of zoomability), or directly into FontLab (if I don't need the zoom). In FontLab, I check the integrity of extrema and tweak the curves, set bounding boxes, do kerning, and generate my final fonts for Opentype, Truetype and PC Postscript. Then, I used Type Tool 2 on Mac OS X to generate the Mac Postscript version (although sometimes TT2 bombs in OS X--for no stated reason--and I have to generate the font in TT2 in Mac Classic mode).</p>
      <p>The DTL Fontmaster Suite has much to recommend it, and I would probably use it exclusively if not for the fact that it's hideously expensive, and the interface is really clunky. I could probably use FotnLab exclusively if (a) they would improve the import function; (b) add more zoom (I can zoom to 400,000% in CorelDraw); and (c) add more default settings (like license info, designer, designer contact info, copyright, etc).</p>
