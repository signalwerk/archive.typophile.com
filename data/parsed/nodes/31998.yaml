      <p>A specialized font creation app, yes, but (in my opinion) a clunky drawing application. Again, it's partly what I'm used to to, but to me Illustrator or FreeHand <em>are</em> the specialized tools that are best suited for drawing and manipulating vector shapes.</p>
      <p>There are font-specific sorts of drawing functions in FontLab that are invaluable, but taking it all into consideration, it would take me at least twice as long and would be twice as hard to draw a font if I were limited only to FontLab's limited and awkward tools.</p>
