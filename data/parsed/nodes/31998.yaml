      <p><cite>Seriously though, I’m am genuinely curious about the attraction to FontLab’s drawing tools.</cite></p>
      <p>I'm not a real font professional, but I also do the whole process in FontLab. If I just want to make a drawing, Illustrator's drawing tools are nicer, but if I want to draw font outlines, I find it easier to use FontLab. Why? Because the outline ultimately has to conform to the constraints of font formats, like a 1000 em-unit grid, and I'd spend as much time cleaning up an imported Illustrator outline in FontLab as I would just drawing it in FontLab to start with. It's not that I think FL's drawing tools are so great for drawing, it's that they fit the constraints of the final result.</p>
