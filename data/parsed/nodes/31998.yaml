      <p>I guess I'm a font "professional," though only in the use of type, not drawing. When I have to draw up a special character, it is a nervous day. But I spend a lot of time working with metrical data and writing OT features. For this, I find FontLab difficult to use, and do much of the work outside FontLab. The Metrics panel is OK to see kern values, though it's resolution is not the best -- I suppose no screen-based panel could be much better.</p>
      <p>I write off the AFM files for pairs, check values for some class-based kerning in the FontLab window, but do all the actual work in a text editor --  V-Edit which is a reasonably sophisticated one &amp; also supports a columnar mode. There are probably better choices for text editors today.</p>
      <p>I write the features in the text editor as well. When done, import into Fontlab &amp; compile.</p>
      <p>One plus is I always have a separate file of the features, so when I need to go back and add or modify one, it is pretty straightforward. Like today, when I'll have to add a kern between any number and any numerator for a font that supports unlimited fractions.</p>
      <p>FWIW</p>
