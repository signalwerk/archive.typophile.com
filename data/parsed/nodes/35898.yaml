    <p>Started drawing my first from-the-ground-up font a few weeks ago, returned to these three characters because I actually liked them (unlike the other 23).</p>
    <p>I'm looking for critique on their design, as well as any ideas on a direction to take with this font... I don't really want to copy any other fonts, but if anyone knows of any fonts similar to these letters I've drawn, I would like to be able to look to them for reference once I get stuck on certain letters (like I certainly will).</p>
    <p>Thanks guys!</p><div class="imageWrap"><img src="http://typophile.com/files/EFG-KW8707_4630.gif"></div><p></p>
