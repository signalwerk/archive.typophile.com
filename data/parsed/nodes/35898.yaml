    html: |-
      <p>The G seems a bit narrow to me compared to the E and F. They all appear to be meant to be fairly compressed, but the round forms always look smaller than their squarish counterparts, which is why they are generally made a little bigger; to compensate for that illusion. The G needs a bit of overshoot, both horizontally and vertically. That should also give you some breathing room to thicken up the serif a bit too.</p>
      <p>I like the design in general, though. It looks like it would go good with ice cream.</p>
