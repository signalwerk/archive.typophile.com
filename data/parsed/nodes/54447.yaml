    <p><a href="http://molcat1.bl.uk/treasures/shakespeare/pagemax.asp?page=0&amp;strCopy=46&amp;vol=&amp;disp=s" title="http://molcat1.bl.uk/treasures/shakespeare/pagemax.asp?page=0&amp;strCopy=46&amp;vol=&amp;disp=s">http://molcat1.bl.uk/treasures/shakespeare/pagemax.asp?page=0&amp;strCopy=46...</a></p>
    <p>I was doing a small poster for a class. What would be appropriate to replicate the feel of the typefaces used here?<br>
    Other advice for typefaces of similar feel is welcome, it's on a sonata by him.</p>
    <p>Like as the waves make towards the pebbled shore,</p>
    <p>So do our minutes hasten to their end,</p>
    <p>Each changing place with that which goes before</p>
    <p>In sequent toil all forwards do contend.</p>
    <p>Nativity, once in the main of light,</p>
    <p>Crawls to maturity, wherewith, being crowned,</p>
    <p>Crooked eclipses 'gainst his glory fight</p>
    <p>And Time that gave, doth now his gift confound.</p>
    <p>Time doth transfix the flourish set on youth,</p>
    <p>And delves the parallels in beauty's brow,</p>
    <p>Feeds on the rarities of natures truth,</p>
    <p>And nothing stands but for his scythe to mow;</p>
    <p>And yet, to times, in hope, my verse shall stand,</p>
    <p>Praising thy worth, despite his cruel hand.</p>
