    <p>A designer used silent hell of cheryl's lowercase font<br>
    found here:<br>
    <a href="http://www.dafont.com/silent-hill.font" title="http://www.dafont.com/silent-hill.font">http://www.dafont.com/silent-hill.font</a></p>
    <p>SLNTHLC.TTF</p>
    <p>to create her logo. She stretched and manipulated it, but I'd like the figure out what this "grundge" font<br>
    is based off of.  The original sans serif version before it had the degraded effect.</p>
    <p>I have attached a sample.</p>
