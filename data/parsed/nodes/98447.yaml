    <p>dear typophiles!</p>
    <p>i am glad to show you my new release, ZionTrain Pro typefamily. I started this font five years ago for city transportation and overall city corporative font as a part of project of second largest Ukrainian city <a class="freelinking external" href="http://3z.com.ua/portfolio/identity/1602/" rel="nofollow">Kharkiv identity</a> by 3z studio. when designing distinctive characters for the font i was wonder how shapes from Ukrainian calligraphy works fine for wayfinding grotesque (look at the tails of Cyrillic -щ- and -ц- for example). unfortunately, this type was not used as planned, but was lived on the street as font of some cultural events, and was used for Kharkiv promotion. </p>
    <p>it was featured in Slanted magazine #18 Signage/Orientation.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ziontrain_layout_pro2_6252.png"></div><p></p>
    <p>now ZionTrain Pro supports all three European scripts and has additional roman stencil family. i welcome you to download <a class="freelinking external" href="http://www.myfonts.com/fonts/andrijtype/zion-train-pro/pro-stencil-demibold/?refby=Cyrillic" rel="nofollow">Stencil Demibold</a> with full encoding (Cyrillic, Greek &amp; Latin, alternates, old style digits, small caps) for free! </p>
    <p>if you used ZionTrain early (not Pro), please ask me for 90% discount. and for first month at MyFonts 30% discount is for all the people.</p>
    <p>i welcome you to take a look (and appreciate) to <a class="freelinking external" href="http://www.behance.net/gallery/ZionTrain-Pro-Cyrillic-Greek-%28free-stencil-weight%29/6039565" rel="nofollow">ZionTrain@behance</a> and thank you for watching!</p>
