      <p>I was thinking of the 'a' whose counter 'tongue' has little support. Couldn't help but try to visualise if it would look better or worse were the 'bridges' moved further left.</p>
      <p>When I was younger, much younger than today, I was occasionally involved in salting herring. They were still using wooden barrels then. I think that was when I got interested in stencil type.</p>
