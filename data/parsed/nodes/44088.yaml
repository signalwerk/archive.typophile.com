  html: |-
    <p>Ive read and understand that Flash doesn’t support Opentype,</p>
    <p>But does this mean that I cant access the Small Caps of my shiny new typeface National in flash at all, because its embedded the opentype features of the face? Has anyone else been peeved by this or found a solution? I take it the SC would need to be their own file?</p>
    <p>Flash needs to get with the program, this is lame.</p>
    <p>On a side note Im looking for a serif companion to National, if you are familiar to the face Im open to suggestions.</p>
    <p>Thanks,<br>
    g</p>
