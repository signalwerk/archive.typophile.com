    html: <p>That stuff usually got melted down and re-used for other fonts, or sold as scrap... and then melted down and used in a tank or something. Patterns were generally made of brass as far as I know; expensive raw material... On the other hand, if some guy can end up with a lost Elvis recording in a suitcase bought at a garage sale, then hey, who knows what typographic treasures are wallowing next to the washer-dryers of suburbia!  :-/ <br> <br>Many gems have been lost this way, but often it's not easy to blame anybody - you can't see what the future holds after all. <br> <br>hhp</p>
