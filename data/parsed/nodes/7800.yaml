  html: <p>So Bruce Rogers creates what is widely acknowledged to be the finest interpretation of Jenson's Roman ever made, and the patterns are lost? I don't even know what a pattern is, but I have this mental image of someone at a yard sale buying something whose worth and use they could never fathom. <br> <br>I mean, sure, some of the matrices are in a museum somewhere, but just imagine the lucky bastard who buys the patterns at some estate auction. Will he save them? Or will he throw them away? Will he even know what they are?</p>
