    html: <p>Interestingly, it doesn't seem to happen with the TrueType version. Very odd, all this. I am making some inquiries. Perhaps we can fix it in the future. <br> <br>That being said, this phenomenon of having unencoded glyphs like this kicking around in a Type 1 font was pretty uncommon until recently. Now that people are making OpenType fonts, they may want to have a single source file from which they are generating multiple font formats. Thus the problem. <br> <br>Cheers, <br> <br>T</p>
