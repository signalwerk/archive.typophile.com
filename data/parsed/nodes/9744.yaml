  html: <p>I'm having a problem in InDesign with automatic substitution of ligatures. The problem is that when I use FF Nexus (PS Type 1) and type out "ct" it will automatically convert into a ligature, no matter what ligature settings you use, i.e. turning off ligatures in character options.  <br> <br>Other combinations such as "ff" will turn off when I turn off ligatures, but "ct" will remain in ligature form. I'm not sure if this is problem with the font itself or with InDesign. I could not find any options to turn off automatic glyph substitution that will prevent "ct" from turning into a ligature. <br> <br>Does anyone have suggestions? Please help! Thanks!</p>
  html_clean: <p>I'm having a problem in InDesign with automatic substitution of ligatures. The problem is that when I use FF Nexus (PS Type 1) and type out "ct" it will automatically convert into a ligature, no matter what ligature settings you use, i.e. turning off ligatures in character options.  <br> <br>Other combinations such as "ff" will turn off when I turn off ligatures, but "ct" will remain in ligature form. I'm not sure if this is problem with the font itself or with InDesign. I could not find any options to turn off automatic glyph substitution that will prevent "ct" from turning into a ligature. <br> <br>Does anyone have suggestions? Please help! Thanks!</p>
