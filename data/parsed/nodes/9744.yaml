    date: null
    date_raw: null
    votes: null
    html: "<p>I have run accross this c_t s_t ligature problem with Type1 fonts as well.  <br> <br>Another problem I run across in InD is as follows: Type1 fonts with a standard character set. The figures in the font are named with standard names; zero, one, two etc. The design of these figures are of an oldstyle form. Also in the font are a set of Tabular Lining figures that are named zero.tab, one.tab, two.tab, etc.  <br> <br>The reason this second set of figures are in the font has  to do with the production process I used several years ago. Anyway now in InDesign, the program ignores the correctly named figure glyphs (oldstyle in design) and substitutes the Lining Tabular figures. (Even though they use a non-standard name). <br> <br>Charming huh.</p>"
    html_clean: "<p>I have run accross this c_t s_t ligature problem with Type1 fonts as well.  <br> <br>Another problem I run across in InD is as follows: Type1 fonts with a standard character set. The figures in the font are named with standard names; zero, one, two etc. The design of these figures are of an oldstyle form. Also in the font are a set of Tabular Lining figures that are named zero.tab, one.tab, two.tab, etc.  <br> <br>The reason this second set of figures are in the font has  to do with the production process I used several years ago. Anyway now in InDesign, the program ignores the correctly named figure glyphs (oldstyle in design) and substitutes the Lining Tabular figures. (Even though they use a non-standard name). <br> <br>Charming huh.</p>"
