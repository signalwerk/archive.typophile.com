    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Books" class="freelinking" rel="nofollow">Books</a> : Indie Fonts</strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IndieCover_5583.jpg"></div><p></p>
    <p><em>Indie Fonts</em> is a series of books which are styled after the classic type specimen books of the early 20th century. These books differ from this model in that they but feature independent firms whose fonts, like their names, are unique. You will discover such foundries as <a href="/wiki/Letterror" class="freelinking" rel="nofollow">Letterror</a>, <a href="/wiki/PSY/OPS" class="freelinking" rel="nofollow">PSY/OPS</a>, and <a href="/wiki/Test%20Pilot%20Collective" class="freelinking" rel="nofollow">Test Pilot Collective</a>, alongside <a href="/wiki/P22%20Type%20Foundry" class="freelinking" rel="nofollow">P22 Type Foundry</a>, <a href="/wiki/Typeco" class="freelinking" rel="nofollow">Typeco</a>, <a href="/wiki/Font%20Diner" class="freelinking" rel="nofollow">Font Diner</a> and <a href="/wiki/Astigmatic%20One%20Eye" class="freelinking" rel="nofollow">Astigmatic One Eye</a> Typographic Institute. The type styles range from the best of <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a>’s classic designs to the latest irreverence of <a href="/wiki/Chank%20Diesel" class="freelinking" rel="nofollow">Chank Diesel</a>. Designers searching for unique typefaces will find what they are looking for, whether historical revivals or futuristic techno faces.</p>
    <p><em>Indie Fonts</em> brings together 18 independent font foundries from around the world creating an invaluable resource of over 2000 fonts for designers, art directors and typographers.</p>
    <p>This book is divided up by foundry so that the user can get a feel for the work produced by each group. This also makes it convenient to order fonts directly from their source. There is a visual font index provided in the front for quick scanning and a fully cross referenced index in the back containing font names, designers, and original designers.</p>
    <p>Contributing foundries include <a href="/wiki/Altered%20Ego" class="freelinking" rel="nofollow">Altered Ego</a>, <a href="/wiki/Astigmatic" class="freelinking" rel="nofollow">Astigmatic</a>, <a href="/wiki/Carter%20%2526%20Cone" class="freelinking" rel="nofollow">Carter &amp; Cone</a>, <a href="/wiki/Chank" class="freelinking" rel="nofollow">Chank</a>, <a href="/wiki/Font%20Diner" class="freelinking" rel="nofollow">Font Diner</a>, <a href="/wiki/fontBoy" class="freelinking" rel="nofollow">fontBoy</a>, <a href="/wiki/Fountain" class="freelinking" rel="nofollow">Fountain</a>, <a href="/wiki/GarageFonts" class="freelinking" rel="nofollow">GarageFonts</a>, <a href="/wiki/IHOF" class="freelinking" rel="nofollow">International House of Fonts</a>, <a href="/wiki/LettError" class="freelinking" rel="nofollow">LettError</a>, <a href="/wiki/P22" class="freelinking" rel="nofollow">P22</a>, <a href="/wiki/Psy/Ops" class="freelinking" rel="nofollow">Psy/Ops</a>, <a href="/wiki/SynFonts" class="freelinking" rel="nofollow">SynFonts</a>, <a href="/wiki/Test%20Pilot%20Collective" class="freelinking" rel="nofollow">Test Pilot Collective</a>, <a href="/wiki/Typebox" class="freelinking" rel="nofollow">Typebox</a>, <a href="/wiki/Typeco" class="freelinking" rel="nofollow">Typeco</a>, <a href="/wiki/Typodermic" class="freelinking" rel="nofollow">Typodermic</a>, and <a href="/wiki/Typotheque" class="freelinking" rel="nofollow">Typotheque</a>.</p>
    <p>Accompanying this book is a Bonus Fonts CD-ROM that contains 33 indie fonts on an unlocked disc located in a sealed package in the back of this book. The fonts are licensed from each contributing foundry for use solely by the owner of this book.</p>
    <p>Websites: <a href="http://www.indie-fonts.com" rel="nofollow">P-Type Publications</a> | <a href="http://www.typeco.com/3Books2.html" rel="nofollow">Typeco</a></p>
