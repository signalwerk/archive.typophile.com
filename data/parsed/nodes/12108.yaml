    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12157" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Books</a>&nbsp;: Indie&nbsp;Fonts</strong></p>
    <p><img src="/sites/default/files/old-images/IndieCover_5583.jpg"></p>
    <p><em>Indie Fonts</em> is a series of books which are styled after the classic type specimen books of the early 20th century. These books differ from this model in that they but feature independent firms whose fonts, like their names, are unique. You will discover such foundries as <a href="/node/14101" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LettError</a>, <a href="/node/add/wiki?edit%5Btitle%5D=PSY/OPS" title="Create node &quot;PSY/OPS&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">PSY</span>/<span class="caps">OPS</span></a>, and <a href="/node/12882" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Test Pilot Collective</a>, alongside <a href="/node/13546" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span> Type Foundry</a>, <a href="/node/12444" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typeco</a>, <a href="/node/12599" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Diner</a> and <a href="/node/13580" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Astigmatic One Eye</a> Typographic Institute. The type styles range from the best of <a href="/node/13520" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Matthew Carter</a>’s classic designs to the latest irreverence of <a href="/node/47314" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Chank Diesel</a>. Designers searching for unique typefaces will find what they are looking for, whether historical revivals or futuristic techno&nbsp;faces.</p>
    <p><em>Indie Fonts</em> brings together 18 independent font foundries from around the world creating an invaluable resource of over 2000 fonts for designers, art directors and&nbsp;typographers.</p>
    <p>This book is divided up by foundry so that the user can get a feel for the work produced by each group. This also makes it convenient to order fonts directly from their source. There is a visual font index provided in the front for quick scanning and a fully cross referenced index in the back containing font names, designers, and original&nbsp;designers.</p>
    <p>Contributing foundries include <a href="/node/add/wiki?edit%5Btitle%5D=Altered%20Ego" title="Create node &quot;Altered Ego&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Altered Ego</a>, <a href="/node/13642" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Astigmatic</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Carter%20%26%20Cone" title="Create node &quot;Carter &amp; Cone&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Carter <span class="amp">&amp;</span> Cone</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Chank" title="Create node &quot;Chank&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Chank</a>, <a href="/node/12599" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Diner</a>, <a href="/node/13620" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fontBoy</a>, <a href="/node/12045" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fountain</a>, <a href="/node/13945" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">GarageFonts</a>, <a href="/node/12335" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">International House of Fonts</a>, <a href="/node/14101" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">LettError</a>, <a href="/node/12106" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">P22</span></a>, <a href="/node/add/wiki?edit%5Btitle%5D=Psy/Ops" title="Create node &quot;Psy/Ops&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Psy/Ops</a>, <a href="/node/14112" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">SynFonts</a>, <a href="/node/12882" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Test Pilot Collective</a>, <a href="/node/14113" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typebox</a>, <a href="/node/12444" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typeco</a>, <a href="/node/13533" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typodermic</a>, and <a href="/node/14084" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typotheque</a>.</p>
    <p>Accompanying this book is a Bonus Fonts <span class="caps">CD</span>-<span class="caps">ROM</span> that contains 33 indie fonts on an unlocked disc located in a sealed package in the back of this book. The fonts are licensed from each contributing foundry for use solely by the owner of this&nbsp;book.</p>
    <p>Websites: <a href="http://www.indie-fonts.com">P-Type Publications</a> | <a href="http://www.typeco.com/3Books2.html">Typeco</a></p>
