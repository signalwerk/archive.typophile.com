  html: <p>I've finished a project which I'd started a couple months ago (<a href="http://www.typophile.com/forums/messages/30/17772.html">old thread</a>) to reconstruct Crouwel's New Alphabet. I wasn't able to find a full sample of all the characters so I extrapolated from what I could find and came up with a complete ASCII set. I put it all together in a free Opentype font. You can find the font and more info at my <a href="http://www.xtypa.com/archives/000041.html">weblog</a>. <br> <br><img src="http://www.typophile.com/forums/messages/30/23174.gif" alt="Sample"></p>
