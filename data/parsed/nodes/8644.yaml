    html: <p>The ONLY times we've ever had to consider a formal  <br>constitution or code of conduct have been after a given  <br>user's 'run-ins' with usually anonymous people. This  <br>latest episode is no different than the ones in the past.  <br>(Except this latest episode is tame by comparison.) <br> <br>The bottom line is, it's okay to disagree. Hey, we  <br>encourage it. It's what makes this place healthy.  <br> <br>Unfortunately, in the past, when we've had to moderate  <br>posts it has created the perception that we agree with  <br>the user that happens to be registered. This has never  <br>been our intent. All users, both registered and anony- <br>mous, are subject to the same rules. We moderate the  <br>post, not the user. <br></p>
