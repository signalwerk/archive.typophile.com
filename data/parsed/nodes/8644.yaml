    html: <p>Again I find myself in the embarassing position of agreeing with Hrant. I must be spending too much time here. <br> <br>Jared and Joe <b>own</b> this thing. It's <b>theirs.</b> Those not satisfied with their policies should look elsewhere. Typophile is not a government. It does not levy taxes backed by the threat of force. Therefore what happened is, by definition, not "censorship." Those who think it is don't know what real censorship is. <br> <br>Even Hrant agrees with the "censorship" he received. <br> <br>Removing the f-word from posts keeps this site accessible to kids in schools, where often there is filtering software that would otherwide make it inaccessible for linking to inappropriate content.  If you still feel unable to express your thoughts without obscenity, you should consider a prescription for Thorazine or Haloperidol. <br> <br>I consider it a privelage to be alllowed to post here, and with privelages come responsibilities. "Rights" don't figure in here, beyond the normal rights to credit card privacy and whatnot.</p>
