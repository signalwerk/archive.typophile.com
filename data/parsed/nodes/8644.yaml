    html: <p>I don't want to impede any such clearly noble efforts, but I for one feel it's misguided. I don't want or need a constitution. I gladly relinquish all decisions concerning matters of state to our two benign kings, Jared Benson and Joseph Pemberton. This, in order to better concentrate on matters of <i>type</i>. If/when kings get overly abusive, they get overthrown - that <i>is</i> the least unfair system - and I will fight furiously for my freedom <i>from</i> choice, reserving only the right to self-determination. <br> <br>hhp <br></p>
