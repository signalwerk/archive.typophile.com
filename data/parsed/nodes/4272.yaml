    html: <p>If you're looking for neutral, plain, American, and RISD, then I might suggest you consider a few weights/widths of <a href="http://www.fontbureau.com/fonts/font_frames.tpl?fontname=BentonSans" target="_blank"> Benton Sans</a> from the Font Bureau. <br> <br>This is based on the quintessentially American industrial sans serifs of Morris Fuller Benton. Designers Tobias Frere-Jones and Cyrus Highsmith both attended RISD (and have returned to teach there periodically, if I'm not mistaken).  <br> <br>Earlier versions of this family are the simple sans that you will still find used throughout <i>Martha Stewart Living</i> (although, in the current design of the magazine, the Benton takes more of a back seat to the new Hoefler slab-serif face). <br> <br>I think Benton Sans would make a fine, versatile, all-purpose typeface for a textile designer. <br> <br>I don't think OS figures are part of the general release, but they may be available. If you call the Font Bureau, Harry or Samantha can tell you if it's possible to get an OS version instead. <br> <br>-- Kent. <br></p>
