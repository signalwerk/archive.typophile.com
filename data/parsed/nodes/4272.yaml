    html: <p>Thanks to all for those comments ... though they have "helped" only by making the decision even harder. <br> <br>Benton and Gotham both look like runners, in their different ways. I don't think OS figures are really an issue for her. I'll let her decide. <br> <br>(It's wonderful, by the way, how when one starts to look for a font for a specific purpose, if one digs around long enough, one finds too many good possibilities, not too few. Now why can't everything be like that?)</p>
