    html: <p>Getting back to the original subject. I used to know Albert Kapr. He was a fine type and book designer, calligrapher and typographer. But his greatest accomplishment, in my opinion, was that he managed to preserve and develop the fine art of type and book design in the Communist Germany. In fact, he was a devout Communist himself, and he managed to convince his fellow Parteigenossen, in both Leipzig and Berlin, that the quality of book design and printing is important for the image (and the economy!) of the Deutsche Demokratische Republik.  <br> <br>Kapr was one of the founding fathers of the prestigeous annual book design competitions (Sch</p>
