  html: "<p>Hiya, you might have seen this post in other type forums, so apologies beforehand. <br> <br>I am trying to search for more information regarding East German typography and typographers. Specifically: <br> <br>1. Albert Kapr  <br>He was a type designer and typographer who was the Art Director of TypoArt (the centralized press owned by the East German goverment). I'm trying to find out what his contribution towards the development of East German typography was and if anyone has samples of his work.  <br> <br>2. Influencial typographers <br>Does anyone know of any influential type designers from East Germany?  <br> <br>3. VEB Typoart Dresden <br>I know that it became the centralized press for the East German govenment. It was an almalgamation of a few foundries, specifically Schelter and Giesecke of Liepzig. I am particularly interested in its output and developement during the GDR years.  <br> <br>Any pointers...? <br> <br>Joyce</p>"
  html_clean: "<p>Hiya, you might have seen this post in other type forums, so apologies beforehand. <br> <br>I am trying to search for more information regarding East German typography and typographers. Specifically: <br> <br>1. Albert Kapr  <br>He was a type designer and typographer who was the Art Director of TypoArt (the centralized press owned by the East German goverment). I'm trying to find out what his contribution towards the development of East German typography was and if anyone has samples of his work.  <br> <br>2. Influencial typographers <br>Does anyone know of any influential type designers from East Germany?  <br> <br>3. VEB Typoart Dresden <br>I know that it became the centralized press for the East German govenment. It was an almalgamation of a few foundries, specifically Schelter and Giesecke of Liepzig. I am particularly interested in its output and developement during the GDR years.  <br> <br>Any pointers...? <br> <br>Joyce</p>"
