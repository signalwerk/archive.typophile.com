      <p>This is 'Amati', originally released by Weber in 1951. It was digitized as 'Amossa' by NovelFonts. You can see it in the Jaspert "Encyclopaedia of Type Faces". I think I have a sample in the Serif Font ID Guide.</p>
      <p>- Mike Yanega</p>
