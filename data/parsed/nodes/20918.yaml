    <p>Erm… I’ve got another tricky question — does anyone know who where members of the jury for the very first Letraset International Typeface Competition in 1973 ? The winning entries were Bombere by Carla Bombere (where is she now ?), Magnificat by Friedrich Peter (how come this incredible design is NOT available as a software font ?) and Stilla by François Boltana.<br>
    Thank you very much</p>
