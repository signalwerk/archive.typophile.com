      <p>Mike, when I went searching for this using the keywords black/extra bold, deco, and minimal, I came across dozens of possibilities that differed only slightly from one to another.  </p>
      <p>Were they all based on the same Art Deco sources, or was too much "borrowing" going on? </p>
      <p>There's a fine line between homage and hijacking...but it's still a line.</p>
