      <p>Thanks Mike for the link to a specimen of Milton Glaser's Baby Teeth. FWIIW there are differences between this specimen and the Baby Teeth [Photo Lettering] shown in the old Letraset catalogs. Your link is also interesting because it shows several of Milton Glaser's other variations of Baby Teeth, and presumably some knock offs of it.<br>
      Similar fonts, in addition to those already mentioned, include P22 Constructivist Block. For more, Google: fonts Pacman.<br>
      Don</p>
