      <p>Decoro (2011), if you customized the E, is the closest commercial font I could find:<br><a href="http://www.myfonts.com/fonts/john-moore/decoro/">http://www.myfonts.com/fonts/john-moore/decoro/</a></p>
      <p>There is a free font called Lot (2009) that is an exact match. The general policy on this forum is not to link to free font sites if a commercial version is available, but Lot appears to predate Decoro:<br><a href="http://www.ffonts.net/Lot.font">http://www.ffonts.net/Lot.font</a></p>
      <p>[And before any other posters jump on me for linking to the free font, I tracked down info on the designer, Svetoslav Simov of Fontfabric, and every listing I could find lists Lot as a free font. Oddly, it is no longer offered as a free font on Fontfabric proper....]</p>
