    html: |-
      <p>Good question. Foundries certainly copied each other's successful faces.</p>
      <p>An early example of this style was the 1929 <a href="http://old.myfonts.com/fonts/nicksfonts/bric-a-braque-nf/" target="_blank">Cubist Bold</a>. I think the all-straight-lines, minimal-white-space idea was more modern day, though (along with lots of present day freebie fonts that <em>do</em> steal to various degrees).</p>
      <p>A similar revival from Dick is <a href="http://luc.devroye.org/fonts-52980.html" target="_blank">DXS Theda Bara</a> (roughly 2/5 down the page.</p>
      <p>Dick - thanks for all the work in making those fonts available digitally  (I just wish they were easier to find ... )</p>
