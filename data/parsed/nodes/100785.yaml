      <p>Thanks guys for your comments and your time to investigate this issue.  </p>
      <p>Tom, I think you are right in that Apple has messed up with this one somehow because Font Book definitely says it is embeddable.  It is very strange that you could create a PDF using TextEdit but InDesign refuses to embed it.  I presume Adobe are more wary of copyright infringement and hence check into the metadata more thoroughly?</p>
      <p>Oobimichael, I have an early 2012 MacBook Air bought in Malaysia, so it does not seem to be an EU specific issue.  'Black' and 'Bold' are an important part of my document, which is why Adobe's Creative Suit version of the font is not suitable for this project.</p>
      <p>In doing some research online, it seems there is an Apple Thai font (Thonburi) that has caused similar problems.</p>
      <p>This thread <a href="http://m10lmac.blogspot.com/2007/11/os-x-105-leopard-fixing-thai.html" title="http://m10lmac.blogspot.com/2007/11/os-x-105-leopard-fixing-thai.html">http://m10lmac.blogspot.com/2007/11/os-x-105-leopard-fixing-thai.html</a> discusses the font and its problems.</p>
      <p>Unfortunately, I am in China and the Government blocks pretty much all blogs, so I cannot read what it says.  :(</p>
      <p>Any ideas on where I might be able to source a similar font that can be embedded?</p>
