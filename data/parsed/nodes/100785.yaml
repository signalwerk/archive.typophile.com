    html: <p>FYI, on a relatively new mac, the version of Kaiti SC (8.0d1e2; 2012-06-20) (8,079 characters) which is part of OS X install is DEFINITELY RESTRICTED. However, when Creative Suite 6 is installed, Adobe installs "5.016;ADBE;AdobeKaitiStd-Regular;ADOBE" (30,610 characters) which IS NOT RESTRICTED. The only downside (I think) of the Adobe Creative Suite version is that Bold and Black weights are not provided (I am not familiar with Chinese characters, so I'm not sure whether this is important or not).</p>
