  html: <p>I am using Kaiti SC in InDesign. When I try to create a PDF or Package the finished product, I receive the error message saying the font could not be embedded due to licensing restrictions. The font is NOT restricted and can be embedded. I am using Mac with InDesign CS6.  Any thoughts on a work around will be greatly appreciated as I have 78 pages of copy using this ttc.  :(</p>
