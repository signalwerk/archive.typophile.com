      <p>35. Dov Isaacs, Nov 16, 2009 12:42 PM   in reply to wvperegrine Report<br>
      Jeff,</p>
      <p>(1)     There was absolutely no change in how InDesign (or any other Adobe application) embeds fonts between CS3 and CS4. In fact, InDesign has been very consistent in terms of what fonts it allows to be embedded in exported PDF files since InDesign 1.0!</p>
      <p>(2)     There is a signficant difference between having a "licensed font" and a font for which the license permits embedding of the font within an output file such as PDF. Furthermore, there are differences between what the physical font file indicates are embedding restrictions and what may actually be provided in writing in the font's EULA (End User License Agreement). Thus, you may be "licensed" for a font, but that doesn't necessarily mean that your license permits embedding of such a font in another file. Note that these are not as you put it Adobe licensing agreements (see 4 below).</p>
      <p>(3)     For TrueType and OpenType fonts, there are embedding privilege flags inside the font. These range from the most liberal embedding (allowing installation of such embedded fonts on a "receiving" system) to moderate restriction (editable - allows you to edit documents that have the embedded font) to further restrictive (preview and print - allows you only to display and print documents using the embedded font) to full restriction (no embedding of the font permitted). Adobe applications do honor those embedding privilege flags. Note that Type 1 fonts (in ancient times referred to as "PostScript fonts") do not have such embedding privilege flags and as such, we have no way of knowing the intent of the font supplier. Thus, such fonts are not restricted by Adobe applications in terms of embedding.</p>
      <p>(4)     Just so that you understand the context of why Adobe abides by the embedding restriction flags inside of TrueType and OpenType fonts, please understand that this wasn't Adobe's effort at protecting Adobe's or anyone else's turf. All fonts that you may license from Adobe have at least "preview and print" embedding privileges; those fonts from Adobe that are of our own design provide the more liberal "editable embedding" privileges. Adobe has been very consistent in urging other font foundries not to put unreasonable barriers to font embedding in PDF files, but we cannot control the business practices of these other foundries. In fact, it was in response to lawsuits against Adobe by some of these other font foundries that we started enforcing embedding restrictions!</p>
      <p>(5)     If all this isn't bad enough, even if a font does physically permit embedding, what really governs a font's legal status is the EULA. An OpenType or TrueType font may not physically indicate that a font may not be embedded, but if the EULA prohibits embedding, as the licensee you are legally bound to not embed such fonts in a PDF or any other type of file. Furthermore, some EULAs allow embedding, but the license provides that you must pay a royalty fee to the font foundry for each copy of the resultant PDF file that you distribute. Read your EULAs very carefully.</p>
      <p>(6)     As I and others indicated earlier in this thread, there are indeed fonts distributed with operating systems and other applications that do have licensing restrictions. Sorry, but Adobe can't do anything about that!</p>
      <p>          - Dov</p>
