      <p>Very close to Courier (e.g. from Linotype) but it better matches to <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Adobe&amp;ffam=HY%20GungSo%20Std%20-%20B%20Bold&amp;fid=9e1e0ba3e1e98ad6bf035e23df164636&amp;fsize=36&amp;text=New%20R%20s%20Packaging%2C%20Inc%20BMC%20layout%20IMPRESSION&amp;wrap=2" rel="nofollow">HY GungSo (Bold)</a></strong> available from Adobe.</p>
      <p>I think the same glyphs are used in the Roman set of <strong>Gungsuh</strong> a Microsoft font supporting many codes pages and designed by HanYang I&amp;C Co.,LTD. [2000]:<br>
      <a href="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1512" title="http://www.microsoft.com/typography/fonts/font.aspx?FMID=1512">http://www.microsoft.com/typography/fonts/font.aspx?FMID=1512</a></p>
    html_clean: |-
