      <p>I was just checking the last PDF, and I like it a lot overall. But when I look at the page and not focus my attention on any particular part, I think there are some minor issues with weight distribution here and there. </p>
      <p>For example, the bowls of 'd p b' seem a bit heavy, in comparison to other letters. It's only small differences, but to me they stand out. The weight in the 'y' is also a bit off, I think. The right stroke should be a wee bit thinner than the left stroke. Also, but I'm not sure, the horizontal bar in the 'k' could be a couple of units thinner? And I agree with Chris about the 'j'. Maybe a terminal similar to that of the 'y' might work.</p>
      <p>Well just a global observation. It's coming together nicely. :)</p>
