      <p>Hi everybody,</p>
      <p>it's great that you're all still interested. It looks like Tramway is going to be released in the near future, if all goes well by a foundry I respect tremendously. Therefore I've been working hard to get rid of minor flaws and, most of all, expand the character set, you can see the preliminary results in the attached picture.</p>
      <p>I'm aware that there are many fonts in the same area, but when I started this about five years ago, I don't think it was quite like it is today. I thought about giving up several times, but people kept asking for Tramway, so I thankfully kept going. I still think there's something unique about it (I don't even like many current squarish sans serifs - maybe that helps :-)).</p>
      <p>Some selected clients are alreday using Tramway, I put together some examples…<br>
