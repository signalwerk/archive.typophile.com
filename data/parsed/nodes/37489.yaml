      <p>Since I somehow can't attach the pdf, I uploaded it <a class="freelinking external" href="http://www.hn2o.de/tramway_new_01.pdf" rel="nofollow">HERE</a>. You'll see, there's still a lot of work ahead. I didn't include all styles in the pdf, but will add them as soon as possible…</p>
      <p>Thanks for your comments. I know, there's a LOT of squarish sans out there. I don't think it was quite like that, when I started drawing this one. It's good to hear that you think it's different enough, that's what I hoped for. I was trying to retain a certain "sturdiness" that, I think, sets it apart from other squarish fonts, which, for my taste, are often too clean and quiet. I think I wanted a small hint of early grotesks, not in style, but in spirit ;-)</p>
      <p>Concerning the lc "y": There will definitely be two versions, one will be "normal" and should be used in text setting. The magazine I mentioned doesn't use the straight "y" at all, but I still like it and want to keep it as an option.<br>
      I'll see what I can do about the "s", it's been bugging me for some time now.</p>
      <p>I hope you'll be able to see the pdf now…</p>
