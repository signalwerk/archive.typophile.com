    <p>Hello everyone,</p>
    <p>I posted some samples of "Tramway" a loooong time ago (at one point I even considered to stop working on it altogether), but now I really need to finish it. Soon.</p>
    <p>It is, although not finished, already being used in a german magazine, but there's (obviously) still a lot to do. So now I'm reworking some stuff, adding some accents, I have totally messed up the spacing (I'll get to that soon), and I started with some new styles (book, black and ultra). I'm also thinking about old style and tabular figures.</p>
    <p>Right now nothing's really finished (well, at least not in detail – the overall design will, of course, stay like it is), but I thought I'd post some samples anyway. Any suggestions are, as always, highly appreciated. </p>
    <p>Thanks a lot,<br>
    Hanno</p>
