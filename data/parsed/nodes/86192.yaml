    <p>_O  ________________  God's Word</p>
    <p>Surely, I fear no sword<br>
    And love God's Word</p>
    <p>He  watches what we patch<br>
    And warns us from others hatch!</p>
    <p>Let us leap not before we look,<br>
    Don't you see  wisdom in His Book?</p>
    <p>Only to Him, I do put the flight<br>
    Only for Him, I must do right + fight</p>
    <p>Your head, do you scratch?<br>
    To Democracy , what a latch!</p>
    <p>_ 1 ________________  Prawns, let us fry! </p>
    <p>Prawns, let us fry!<br>
    Why was I born and will die?<br>
    How should I dive or fly?<br>
    ...<br>
    Winner if I know how and why?!<br>
    Loser If do not know how and why?!<br>
    Exploited if I know how but not why?!<br>
    ...</p>
    <p>Wait! why I was given ear and eye?<br>
    Guided to the how only if I know why<br>
    To make a hole in the dry<br>
    Or a ladder in the sky?! </p>
    <p>_ 2 ________________  Rock and Roll </p>
    <p>Rock and Roll<br>
    Drive and Stroll<br>
    Go shopping Stalls and Mall<br>
    Juggle One+One ball<br>
    Get installed and Install<br>
    Click and Scroll<br>
    ...<br>
    ...<br>
    ...<br>
    As long as there's soul!<br>
    Before going to a windowless hole,<br>
    Does on that rotate our goal and role?<br>
    Let's go to Poll<br>
    And hang it up the pole! </p>
    <p>_ 3 ________________ New World Order </p>
    <p>Played AC+DC<br>
    From Sky+Sea<br>
    Without Mercy!<br>
    ...<br>
    Here is AC<br>
    In need of PC+WC<br>
    But wanted to be DC!<br>
    ...</p>
    <p>There is DC<br>
    In need of PC+WC<br>
    But wanted to be AC!<br>
    ...</p>
    <p>AC or DC?<br>
    Just want to see<br>
    ...</p>
    <p>For those who know ABC<br>
    Where is the fallacy? </p>
    <p>_ 4 ________________ President + VIP</p>
    <p>VIP: In politics, I am not supposed to engage<br>
    Though everything in wreckage+garbage<br>
    Never stop giving you White Image</p>
    <p>President: Have you received the Package?</p>
    <p>VIP: More important now is to whiten my image!</p>
    <p>President: Any Leakage?</p>
    <p>VIP: Have been re-flipping the Same Books page by page<br>
    Mine, I am supposed to suppress to a single usage<br>
    But, thanks to the free time and high wage<br>
    mmmmm, I have been trapped by Underage<br>
    ...<br>
    Next morning, and on every Frontpage<br>
    The Opposition has taken Underage hostage!<br>
    And the people stage a protest of Outrage<br>
    ....<br>
    Day after next, 3 images on every Frontpage<br>
    The hostage in bandage!<br>
    A Deaf and Dumb in cage!<br>
    VIP waving to huge Crowd down the stage! </p>
    <p>_ 5 ________________  Democracy </p>
    <p>Till when we allow Kapi+Soci play their demo game.<br>
    Flipping and Rotating us with parties shame.<br>
    Neither has solutions for our problems as they claim.<br>
    Where, when, how and by who they came?<br>
    Who gave them the right to speak in our name?<br>
    How do they know Man's ins+outs and aim.<br>
    Being tools in either hands, ourselves we have to blame</p>
    <p>_ 6 ________________  Arabic Type </p>
    <p>Type is nothing but to Assemble, Compile and Shuffle<br>
    ... Letters on lines to make people bubble<br>
    Towards that end, PC fonts are handled and tackled<br>
    The inspired by butterfly and Candle is lovable and durable<br>
    But the inspired by beetle's tentacles is terribly horrible<br>
    Plenty are the Samples but few are the Examples<br>
    ...<br>
    In Type, every movement is probable: Scramble and Scribble<br>
    Ligatures and Kerning are the most distinguishing variables<br>
    Ligatures is to bundle: couple, triple and Quadrable<br>
    Kerning is the art of snuggle and nestle<br>
    In these, the Arabic script has no double.<br>
    ...</p>
    <p>Before I make it, I fondle from all sides and angles<br>
    My fingers, I do wriggle and fiddle<br>
    For "o" I go round in circle, like a spindle<br>
    When the "Alif" goes like needle and the REST flexible,<br>
    I wrestle and wrestle to make it wonderfully single<br>
    As Twins are not allowed, unless the new outlook is remarkable<br>
    ...<br>
    Ending my riddle, one thing that will puzzle U and baffle<br>
    I dont even own a bicycle, and my bills I hardly settle<br>
    To the 99% I do belong, and gainst the 1% I still struggle and wrangle<br>
    __________________________________<br>
    With Flowers, hope I have kindled a candle</p>
