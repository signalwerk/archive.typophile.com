      <p>@Kent: really grateful for your explanation. And we take our vision for granted! I shall have a slow new look at this case and in general to caps kerning. Gracias.</p>
      <p>@Nick: we may have to stick to typographic Eurocentrism, alas, since we are in Londinium, publishing in English, within Western academic standards, travelling on the Tube...but seriously now, what would be an alternative? I would think for most people, who are unaware of Trajan's imperial associations, it is simply a beautiful font, or simply the same font on the film posters. They are used to it. What would be a less Eurocentric font using the Latin alphabet? I think I see your point, but I can't think of an alternative... may I have a hint?</p>
