    <p>Fellows,</p>
    <p>I wonder if I am being too much of a zealot here, but I would tend to think that all-caps fonts, like Trajan, are best used without case changes, i.e. sticking to the upper case height. I know the opposite has become common practice, but I would attribute this to a certain lack of information and maybe even a lack of feel for the monumental, sigillary character of these designs (I am really having Trajan in mind, or similar designs). If I get the idea right, these fonts are not meant for prolonged reading, but for a short text that stays stamped on your forehead for ever, sort of... </p>
    <p>On the above grounds, I would go for 2 or 3 in the attached sample (part of a project under way). Please disregard the second line, as my query only relates to the top Trajan line. This text will be at the centre and top of a website, all its subpages etc. </p>
    <p>Comments, suggestions, chidings and admonishments are gratefully welcome.<br>
    Juan</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/TMT%20Trajan.jpg" width="1144" height="849" alt="">
