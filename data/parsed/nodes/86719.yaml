      <p><cite> &gt; Still, wouldn't you think that this font's natural HE pair (for instance) is a bit too open?</cite></p>
      <p>No. Especially not compared to the limitation of TH. </p>
      <p>In your case, the TH pairs you have are always going to be open — that’s the nature of T. So everything else should be balanced against that visual space. </p>
      <p>Also, Trajan has a very open O; there’s nothing you can do about that large counter. So, between the forced spaces of T and O, your HESON ends up looking unnaturally tight (at least to my eyes) and you’ve isolated and exacerbated the spaces under T and inside O.</p>
      <p>Look at your primary word MATHESON — the MATH will always be open because of angular M and A and wide T. Next to these HES is too tight. SO and ON are also too tight for that O.</p>
      <p>I suppose one could try to make an argument for a 1970s-style tight-but-not-touching setting, but that goes completely against the nature of Trajan and against the kind of majesty I think you’re trying to project with this title.</p>
