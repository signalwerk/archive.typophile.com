    html: |-
      <p>The original typeface name is Roberta, designed by Bob Trogman in 1962. </p>
      <p>Two digital versions, both named Roberta, were re-created in 2003, one by Harold Lohner (authorized by Trogman) and one by Ralph Unger. Both of these, unlike Mueller's Legrand, also have lower case letters. There are slight differences among all of them; </p>
      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/profonts/roberta/" rel="nofollow">Roberta by Ralph Unger</a><br>
      <a class="freelinking external" href="http://www.haroldsfonts.com/roberta.html" rel="nofollow">Robert by Harold Lohner</a></p>
      <p>Found in my own font equivalents file after Fivos identified the font as Legrand.  They are also shown in the <a class="freelinking external" href="http://abfonts.freehostia.com/solo/solopedia-r.htm" rel="nofollow">Solopedia</a></p>
      <p> - Herb</p>
