      <p>A nice solution to the boring wedding invitation</p>
      <p>Either "with our families" or "to share their joy and support their love as they exchange"</p>
      <p>I think "CHASE" needs more space, perhaps in letterspacing or leading, or a different font. I may be wanting something more flowing, like the rest of the large text.</p>
      <p>The majority has the aesthetic you're looking for, but the bottom has a more crisp, neutral, modernist, bland, clean feel. I suggest you change that to match the rest.</p>
      <p>Even if you don't change the type on the bottom, you may consider removing the line and/or centering the bottom space instead of the whole line or adjusting the letterspacing to center it. I think it needs to be centered somehow if it's going to be separated like that.</p>
