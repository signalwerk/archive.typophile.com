    <p>Need some help here on this invite I'm working on. I'm trying to mix many typefaces in a complimentary way, and the inspiration is from old signage and packaging. The final invites will be screen printed on cloth and ripped out for a rough edge. I've been looking at it too long and need some help. Any feedback is great. thanks for your time.</p>
