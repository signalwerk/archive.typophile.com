  html: <p>For academic textbooks, is there a "rule of thumb" in regards to the color of the text typography? We have a client that is requesting gray (70% black) text. We see that as being counter-productive and want to go 100% black. Thoughts?</p>
comments:
  - id: 497916
    user_id: 58010
    user_name: JamesM
    user_path: null
    user_image: null
    date_raw: 6 Mar 2012 — 10:08am
    date: 2012-03-06T10:08:00
    votes: null
    html: |-
      <p>Graphic designers sometimes use gray for short lengths of text, but I'd hesitate to use it for text that's lengthy (like a textbook) or text that's in a small point size.</p>
      <p>If you're using gray for text you'll get best results using gray ink, rather than a screen tint of black. Also make sure that it's light enough that it looks like it's deliberately gray, rather than looking like a black that didn't print well.</p>
