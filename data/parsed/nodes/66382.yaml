    html: |-
      <p>I am not a pro, but mixing the two fonts works here, particularly because of the different tones used. "we are" emerges clearly as a phrase, but is the penciled arrow part of the design? If so it is unnecessary. I wonder if "are" can somehow be placed to the extreme right. something like this might read more naturally. </p>
      <p>welcome - redup<br>
      digital media are<br>
      ==============<br>
      ==============</p>
      <p>Also have you considered simply using type converted to a gif or jpeg instead of html text? Then you can use any font you like. With such large text sizes having the image stretch to fill any monitor resolution might work in terms of edge sharpness. Another idea is to forgoe the block concept, floating the top text left and the bottom line right. Have fun.</p>
