    <p>Hi all,</p>
    <p>I have been set the task of coming up with a nice large website header, as you can see Im going down the typography path. The first obstacle I have encountered is that I am limited in terms of typeface choice due to it needing to be web safe. I am a big fan of typography that mixes sans and sans serif and also the quirkiness of playing with the reader in terms of where the eye goes.</p>
    <p>What I would like to ask you pros is despite my limitation regarding choice of typefaces does arial and century work well together? Are there any issues that jump out? Overall whats your opinion?</p>
    <p>This site is a godsend, thanks alot.</p>
    <p>Phil.</p>
