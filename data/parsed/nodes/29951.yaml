    html: <p>The Luxury set was originally released by its designers, Christian Schwartz and Dino Sanchez, without the text variants. That version was priced exhorbitantly; it was something of a prank. The House release is just an expansion and re-release, though House brought their inimitable marketing genius to the project. The original Luxury set is what you're thinking of.</p>
