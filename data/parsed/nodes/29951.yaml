      <p>Now I get it, it was all a ruse.</p>
      <p>Here is explanatory text from Christian Scwartz's site explaining how his tongue-in-cheek got blown out of proportion:<br>
      "Once a conceptual art project that commented on the high price of a certain aesthetic, the Luxury Collection is now available to the general public through House Industries. It has been celebrated as a brilliant joke and maligned as self-indulgence. A friend pointed us to a thread on a type blog where someone with a limited sense of humor (or maybe someone trying to be even more tongue-in-cheek than we were) said, "...they are very full of themselves. I bet they go belly up pretty soon. In these economic times no client will pony-up that kind of money." Wink wink, nudge nudge?"</p>
      <p>ChrisL</p>
