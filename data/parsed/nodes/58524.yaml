      <p>I don’t know for sure, but as a former ad agency type director and former advertising type shop manager, I can say that the discrepancy probably stems from advertising agency guidelines established in the 1960s and ’70s, when film setting displaced Linotypes, Monotypes, and Ludlows (the machines, not the foundries), though it may have happened earlier. During this time period, short column measures were popular, and long em-dashes clashed with the tightly-set typography that was then popular.</p>
      <p>Agency guidelines often stated something similar to this: “en-dashes, with a thin space on either side (note: not a word space) are to be substituted for em-dashes for all composition.” Many ITC faces have short em-dashes, too, though many do not. I believe that foundries often dictated the length of em- and en-dashes, too, and that there has never been a definitive standard. How many Times and Times New Roman versions are out there—again I don’t know; FontBank’s Times Black features an em-dash which is shorter than the en-dash, and Monotype have released at least dozens of versions—but they are all based upon Victor Lardent’s drawings, supervised by Monotype contractor Stanley Morison,  for <em>The Times</em>, a London daily, where the face first appeared on October 3, 1932; you could look at microfilms of that paper or contact Monotype to find which em-dash length is original. </p>
      <p>Jim Craig published Y&amp;R’s typographic guidelines, written by Klaus Schmidt and Roy Zucca, in his book, <em>Typography for the Graphic Designer</em>.</p>
      <p>I hope this helps, but I’ve probably just further muddied the waters.</p>
