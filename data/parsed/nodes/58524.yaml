    <p>Hi!</p>
    <p>I'm just getting to grips with typography, and can't seem to find an answer to a burning question I have on ye olde Google. So I thought I'd ask here.</p>
    <p>Why are some em rules/dashes, as far as I can understand, smaller than an em; Times New Roman versus Times for example. Is this up to the type designer?</p>
    <p>Alek</p>
