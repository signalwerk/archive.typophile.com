      <p>@ Cameron:<br>
      "agency guidelines"!? It's amazing to read that they existed. When I was an ad agency type director in Minneapolis in the late 1980s and early 1990s, no one gave a flying fumble about what dashes looked like except me, the type director. &amp; when I put in 3/4 em dashes on full em width, no one noticed.</p>
      <p>@ Craig:<br>
      In metal type, em dashes shorter than full em width did exist, but were hard to find. Good Monotype shops (such as Mackenzie &amp; Harris in San Francisco) routinely substituted a 3/4-em dash in the matrix case for the full em dash, but cast it on the full em width. That's where I learned the practice. I carried that practice with me to the early days of PostScript fonts, when we had not yet gotten the richness and sophistication we have now. But that meant that I'd most often have to do a search-and-replace to get rid of the full-width em dash and replace it with a 3/4-em dash on full em width.</p>
      <p>My experience with foundry metal was that most faces had full-width em dashes. That seems to contradict Cameron's statement, I know.</p>
      <p>I cannot recall seeing en dashes less than full en width.</p>
      <p>powers</p>
      <p>PS: I just recalled that when I worked at M&amp;H, the owner was a Swiss guy. maybe that accounts for the 3/4-em dashes.</p>
