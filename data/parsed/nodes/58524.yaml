      <p>I remember reading somewhere, that in continental Europe, em-dashes were often cast with hairline gaps on either side, to allow for setting them flush against the type without spacing material. Whereas North American and English foundries had them run across the entire body, so that the sorts could be used to form lines.<br>
      _____________________________________________<br>
      Personal Art and Design Portal of Ivan Gulkov<br><a href="http://www.ivangdesign.com">www.ivangdesign.com</a></p>
