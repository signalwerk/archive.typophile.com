    <div class="info">Submitted by <a href="/user/10234" title="View user profile.">Patrick Marc Sommer</a> : 30.Nov.2008 5.07am </div>
      <p>We admit to be a bit proud of what has accumulated in our archives through the years. Of course, one always thinks a bit melancholically about the past on such occasions, yet our thoughts are more focused on the happily anticipated future.</p>
    <p>Have fun browsing the pages! We hope that this issue sweetens the waiting time until Encore is relaunched. </p>
