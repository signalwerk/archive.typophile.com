    html: "<p>Oops, just noticed that the Font-a-licious link doesn't go directly to the page with the font on it (reason: frames).  <br> <br>To get to it: Starting from the <a href=\"http://www.fontalicious.com/super/fonts.html\" target=\"_blank\">fonts</a> page, click on the icon next to the \"FONTS\" label; this will take you to a yellow page with some font names; click on the \"&gt;&gt;\" below the samples four times to get to the page showing Dimitri Swank; click on the name to get to the page where you can download the font.</p>"
