      <p>The quick and dirty tip is to use “farther” for physical distance and “further” for metaphorical, or figurative, distance. The Oxford English Dictionary, Fowler's Modern English Usage, and a number of other sources say that, in most cases, it's fine to use “further” and “farther” interchangeably, especially when the distinction isn't clear. </p>
      <p><a href="http://grammar.quickanddirtytips.com/further-versus-farther.aspx" title="http://grammar.quickanddirtytips.com/further-versus-farther.aspx">http://grammar.quickanddirtytips.com/further-versus-farther.aspx</a></p>
