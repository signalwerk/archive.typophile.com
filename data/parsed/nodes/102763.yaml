      <p>The plot thickens. It appears the titling for<br>
      'Matisse: 50 years of his graphic art' (Text by William S. Lieberman. Publisher New York : G. Braziller, 1956.)<br>
      was lifted from the limited edition<br>
      'Pasiphaé, Chant de Minos' (1944 and 1981)(text by Henri de Montherlant, Paris: Martin Fabiani, 1944)</p>
      <p>'Never content to merely provide accompanying illustrations for his books, Matisse submitted himself to the discipline of the page and to typographical considerations, invariably taking a hand in designing the jackets, selecting the typeface, deciding the layout and choosing the paper and binding...'<br>
      <a href="http://www.mama.org/exhibits/modernist/painting/matisse/pasiphae.html" title="http://www.mama.org/exhibits/modernist/painting/matisse/pasiphae.html">http://www.mama.org/exhibits/modernist/painting/matisse/pasiphae.html</a></p>
      <p>So it appears it is some fount de français. </p><div class="imageWrap"><img src="http://typophile.com/files/Pasiphae_5801.png"></div><p></p>
