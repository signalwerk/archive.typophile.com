      <p>Over 13 hours since your post and none of the type ID gurus have made a suggestion.</p>
      <p>So here is what little I have to offer.</p>
      <p>Presumably this is from the title page of:<br>
       	Matisse: 50 years of his graphic art. Text by William S. Lieberman.<br>
      Publisher New York : G. Braziller, 1956.</p>
      <p>I did some basic research at Myfonts using MATISSE as a specimen text and failed to find a digital font to match the treatment of S, T &amp; E.</p>
      <p>In 1956 this would probably have been a metal type or photo-type. Or perhaps custom artwork.</p>
      <p>Some similarity to Columbia, designed by a New York designer, Walter McKay, and  released in 1956 by Typefoundry Amsterdam. McGrew's American Metal Type only displays a small size, but it was available in up to 60pt.</p>
      <p>Also some similarity to Suburban French, Monotype.</p>
      <p>So is there a digital match for MATISSE?</p>
      <p>Don</p>
