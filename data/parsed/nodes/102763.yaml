    html: <p>Is there a digital match? I don't know. I expect it is hand lettering too. The title page and text uses Baskerville. The cover design features a dash of Venus Grotesque. I sniffed hints of other Bauer founts in the 'Matisse' lettering. Aspects of the design have a nagging familiarity though. The teeny serifs on the T. The contrasting bowls on the S. Where Have I seen that before? Was it the last time I looked at this book? Or was it something digital? Or is my ('I-like-these') client messing with my head? (The type style of the Venus isn't available digitally either.) But thank you very much for your efforts Don. Looks like redrawing it will be quicker than looking much further. (Or is it farther?)</p>
