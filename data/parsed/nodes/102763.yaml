      <p>I agree that since this does not ring a bell with anyone, redrawing is the way to go. It is really is a pastiche of well known features that I would not expect to find in the same font. Leaving aside the two pre-digital fonts I mentioned, there seems to be nothing very close.</p>
      <p>Don<br>
      p.s. further vs. farther -- like the old tomayto tomahto joke :)</p>
