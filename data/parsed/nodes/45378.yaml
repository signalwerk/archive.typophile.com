    html: |-
      <p>Hi, and thanks for your comment. Readability is important, but since I reckon people will have a good amount of time to interpret the signs, I don't think it should be the main thing. Maintaining continuity with the Danish letterform history is important, but I still think it's important to bring something new, which is what I'm talking about when I say 'modern'. I think an all caps serif is the way to go, like Engelhardt, because it – in my opinion – gives a more historic feel. The historic feel is important for me, as I've chosen central Copenhagen, with its 17/18'th century architecture. I want the typeface to give the viewer a feeling that they're in a historic place, but not in a museum.</p>
      <p>I've taken alot from Engelhardts signs, but I've also tried to take it to a new place, by making it higher, give it less contrast, removing vertical serifs on the G, S, C, make it more egyptienne like, and also by opening the letterforms by making them more square. I still think it needs more of its own life though, and luckily I still have a month more to work on it.</p>
      <p>Peter, could you please explain further why you'd like it for print but not for signs? Thanks alot!</p>
      <p>Daniel</p>
