    <p>Hello fellow typelovers!</p>
    <p>I'm doing a new typeface for the streetsigns in central Copenhagen (Denmark) as a schoolproject. This is a work in progress, but I'd love to hear your opinions.</p>
    <p>Currently we're using a version of Transport, except for a few places where the old signs with varying typefaces remain. I want to replace Transport with something that is modern, but still capsules the architecture and typographical history we have (Engelhardt, Biilmaan, Bindesbøll, Achton Friis etc.).</p>
    <p>I've attached a pdf with examples of streetnames in my font, along with the typeface at its current state. I should mention that I'm very inspired by Engelhardts quirky old signs, example attached here:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Engelhardt_3502.jpg"></div><p></p>
    <p>Your critique would be greatly appreciated.</p>
    <p>Many thanks,<br>
    Daniel</p>
