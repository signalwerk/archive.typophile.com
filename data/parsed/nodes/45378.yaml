      <p>You didn't explain the various criteria for your project. Is readability most important, or is maintaining continuity with Danish letterform history important, or do you interpret "something that is modern" to mean it must be sans serif? What combination?</p>
      <p>If you can answer questions like these, you'll have a direction to go in. The attachments seem like rubbings of the Engelhardt letters, which might be nice for print, but maybe not what you would want for new signs.</p>
