    html: |-
      <p>Alright, I read your critique and after sitting and playing around with the letters I realized that you're probably right about it being too 'olde' for new signs. I think it could be fun to use for a print project though, f.ex a classic inner city restaurant or something..</p>
      <p>Now I've drawn up a sketch for a different direction, building the capitals from Engelhardt's, but with major changes, and also I've drawn a full set of minuscles. I'm still missing a couple of the capitals, and I have alot of doubts concerning the vertical serifs, especially on the s, S, C and G. I think the C and G might be too soft. I've attached the new file on the top post, seems like I can't make an attachment in a comment.</p>
      <p>This is the first full typeface I've drawn, and I must say it's quite a mouthful..especially doing something classic, with referrals to history that still manages to be modern. Maybe that's just too much between two chairs, don't know.</p>
      <p>About the appearance on the street, I'd like them to be flat enamel signs, white on blue. I don't know if that would be possible financially, but it would be great.</p>
