      <p>This is a really interesting project. Overall result is very good, with perfect a, m, b, and d. Lowercase g is outstanding.</p>
      <p>I agree with Hofweber about G-S-E-C and also think that (1) W is very wide; (2) Z could have a steeper central stroke –and thus be a bit wider; (3) e and c would share the same bottom curve.</p>
      <p>Keep the nice work!</p>
