      <p>OK, so this is a modified version of Engelhardt's original. Maybe a sharper break with the past could be better, not sure. Your letters now might work on museum posters, brochures, banners on buildings.</p>
      <p>It could be undistressed. The wavering outlines seem too quaint to me. Like a distressed typeface that says "olde". How much do you/should you repair for the present? What makes it Danish and not an elongated, low-contrast Walbaum?</p>
      <p>I'm thinking of how this might appear on the street, will it be a raised or flat surface? That seems to be another question, with an effect on the design.</p>
      <p>Anyway, good luck.</p>
