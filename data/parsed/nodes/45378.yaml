      <p>Don't know if anyone is following this besides myself, but I've attached the newest version – with alot of changes – in the top post. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/signs-typo_6629.jpg"></div><p></p>
      <p>Most importantly I've opened up the e, aswell as compressing the whole font even more. Also, the capitals have been justified much more. I've also changed the Æ to a more regular one, changed both K's, and removed the vertical serifs on E and F.</p>
      <p>I think the X needs some massage on the widestroke serifs, and the dots on å and Å should be more circular.</p>
      <p>In the pdf I've also attached some photos of Copenhagen architecture for the typeface to work along with, images of the new and old signs, and examples of signs with my typeface.</p>
      <p>Hope you like it,<br>
      Daniel</p>
