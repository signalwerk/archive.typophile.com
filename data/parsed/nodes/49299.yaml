      <p>It could be stronger both in idea and grammar. You don't want to insult your potential customers "only people without an imagination can't find a reason to drink champagne" assumes people are stupid. We might know they are, but they don't need to be told they are. Keep it light-hearted and omit any negatives...</p>
      <p>My suggestion, consider the reasons that people drink Champagne. I'd say the majority do it to celebrate something. </p>
      <p>So, approaching it as: "Any reason is a great reason to celebrate!"</p>
      <p>Then in smaller text, you can say something like, "When you purchase a bottle of Moet &amp; Chandon's from Ruby's, you can keep the celebration alive with a second bottle at a price worthy of your celebration." Expect cheapskates, and don't beg for more money. Omit the part about being generous.</p>
      <p>In summary, most people are stupid and cheap, don't point it out. Approach it as a chance to bring in quality customers who will pay for a second bottle. So, make the idea appear smart and rich and smart, rich people will come.</p>
