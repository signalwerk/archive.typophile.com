    html: <p>Dump the quote. If you’re going to do a simple all-copy ad then you should have one idea that can work as one block of text. If that block needs supporting copy the ad lacks confidence and feels desperate. It’s important to not give that impression because this ad amounts to a restaurant coupon which itself is a sign that the restaurant isn’t good enough to get by on the food and service and is using gimmicks to bring in business.</p>
