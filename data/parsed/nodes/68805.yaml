    <p>Hello everyone,</p>
    <p>I'm an illustration major working on my graduation project which is an illustrated biography of Jean-Francois Champollions (1790 – 1832), the decipherer of the Egyptian hieroglyphs.</p>
    <p>Being an illustrator I'm sadly not very typography savvy so I could really use some help. </p>
    <p>The text I'm working with is a mix of narrative and original letters so I'm looking for two fonts: a handwritten one I can use for the letters and a normal seriph-font for the narrative text, both with a sort of French early 19th century feel.</p>
    <p>Suggestions would be much appreciated. Thank you.</p>
