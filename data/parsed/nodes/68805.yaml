    html: |-
      <p>Honestly, I couldn't think of a digital Didot as a good choice as a body text typeface, given the strong contrast of thick/thin serifs and the inherent weakness of early digital Didot type translations. But a little search gave some interesting results:</p>
      <p><a href="http://www.fontshop.com/fontlist/subclasses/serif_didone/" title="http://www.fontshop.com/fontlist/subclasses/serif_didone/">http://www.fontshop.com/fontlist/subclasses/serif_didone/</a></p>
      <p>For example, Didot LP by Letter Perfect and FF Cellini seem to be very appropriate.</p>
