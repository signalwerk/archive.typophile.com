      <p><cite>What does RoboFog do that Fontlab/RoboFab don't do?</cite></p>
      <p>Robofog was a hack of Fontographer 3.5 which is no longer available and requires more hacks to run on Intel macs. Fontographer 4 is all that we have now; it was a complete rewrite of the program, broke RoboFog, etc. etc.. To make it happen the programmers would have to hack the crap out of Fog 4.x, which doesn’t work well anyway.</p>
      <p>You could always donate money to the development of Glyphs, which is probably more up your alley than FLab: <a href="http://schriftgestaltung.de/glyphs/about.html" title="http://schriftgestaltung.de/glyphs/about.html">http://schriftgestaltung.de/glyphs/about.html</a></p>
