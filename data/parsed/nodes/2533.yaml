  html: |-
    <p>So I've been wondering, when is it OK to use a name for a font that's already in use? Clearly you don't want to mess with that frothing-bastard-foundry in Chicago, but "Leviathan" for example is used just fine both by Hoefler and Agfa-Monotype. I can see practical problems when/if multiple fonts share a name on MyFonts for example, and I understand that the legal aspect can't be totally ignored, but I'm looking for some accounts of real-life experiences. <br> <br>In case you're wondering, specifically I'm debating if I should bother using "Pantagruel", which is being used by Scriptorium (at least). What's another good classical name for a really big guy? <br> <br>hhp <br></p>
    <div class="forum-topic-navigation clear-block"><a href="/node/2531" class="topic-previous" title="Go to previous forum topic">‹ San Francisco: Typographic Tourism</a> <a href="/node/2470" class="topic-next" title="Go to next forum topic">Typophile appreciation thread ›</a></div>
