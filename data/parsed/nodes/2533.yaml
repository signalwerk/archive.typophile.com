    html: <p>&gt; Mangonel <br> <br>Terms for medieval siege engines are often used indiscriminately. In this case by me as well... According to the indispensable "The Crossbow" (Sir Ralph Payne-Gallwey, 1903)* a mangonel is a very large <i>catapult</i>, not a trebuchet. And I'm note sure which tended to <i>weigh</i> more, but the trebuchet certainly was much taller and had a longer range. <br> <br>* BTW, a careful reading of that book seems to indicate that the trebuchet was actually invented by Archimedes for the defense of his home town (which it did admirably), but was then lost to time until the Middle Ages - so it's much older than people say. <br> <br>&gt; too long and difficult <br> <br>But doesn't that make them more "thought-worthy"? When people wonder about how to pronounce a name, are they more turned on or off? Like I've thought of this font name -Recital- which I would "insist" that people pronounce like in French - "gheseetal". Not that I would try to even enforce that or throw a fit when I heard it misprononnced - just that that would generate interest.  :-&gt; <br> <br>hhp <br></p>
