  html: |-
    <p>Is there anyone that know of a font that allows to write in tower orientation, in software that does not allow vertical text ?</p>
    <p>Basically this means:<br>
       * write text horizontally, left-&gt;right<br>
      * rotate media 90 degrees right<br>
      * read text top to down, like in Chinese<br>
      * writing is English and numbers</p>
    <p>So each character should be rotated 90 degrees in it's own cell.</p>
    <p>The style is not really important.</p>
    <p>I have not been able to find such font. Any input ?</p>
