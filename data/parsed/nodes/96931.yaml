    html: |-
      <p>On my system, I have a couple of fonts that use the <a href="http://www.microsoft.com/typography/otspec/features_uz.htm#vert" rel="nofollow">OpenType tag 'vert'</a>, or an additional/ supplemental/ newer(?) implementation, 'vrt2', to implement 'faux-vertical' characters.<br>
      All of them are Adobe's CJK fonts:</p>
      <p>Adobe Fangsong Std<br>
      Adobe Heiti Std<br>
      Adobe Kaiti Std<br>
      Adobe Song Std</p>
      <p>and (most likely) came free with my installation of Adobe InDesign. A few Windows system fonts contain selected symbols only. SimSun, for example, contains rotated brackets, braces, and curly quotes.</p>
      <p>The odd thing, however, is that these characters are rotated <em>clockwise</em>:</p>
      <blockquote><p>... forms suitable for vertical writing (that is, rotated 90 degrees clockwise). </p></blockquote>
      <p>That means that applying the feature to a string "hello" will result in (vertically read) "olleh"! Then again maybe I'm missing some subtlety of vertical writing.</p>
