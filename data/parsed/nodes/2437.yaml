    html: <p>It's an apple (cmd-shift-k on Mac keyboards). I usually leave them out, but sometimes I put one in just for fun. It came out best in the Regular weight. I didn't spend a lot of time on the apple in the bolder versions because, frankly, no one ever uses that character anyway (except the ones that look like the Apple logo).</p>
