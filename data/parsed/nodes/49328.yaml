      <p>So, how does OpenType do it?</p>
      <p>Well, there are features of OpenType, basically speaking. Really, they are called 'features'. Just like in the movies.</p>
      <p>CSUB and CPOS were friends. Te'wrain de'lo'meesh'pa'rin. Two friends that can't be separated.</p>
      <p>The snail and his shell, as they say.</p>
      <p>C stands for character.</p>
      <p>SUB stands for a conditional substitution. And POS stands for posee - round 'em up, rawhide.</p>
      <p>No, no, no, POS stands for accurate positioning.</p>
      <p>So, the most basic aspects of OpenType is the ability to do contextual replacements (CSUB), and carefully position diacritic non-width glyphs upon a base character.</p>
      <p>This means that a sequence of Unicode values can be substituted for a different set of font glyphs - that's CSUB.</p>
      <p>And a number of diacritic glyph markings can be accurately placed or positioned upon a base character - that's CPOS.</p>
      <p>Now, what about seeing and placing multiple diacritic glyph markings, when MS VOLT can only show us and place a single diacritic glyph marking at a time?</p>
      <p>Biblical Hebrew could have a whole array of diacritic glyph markings on a single base character.</p>
      <p>John, what do you say?</p>
      <p>How about Simon, what do you say?</p>
