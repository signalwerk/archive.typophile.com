    <p>In general, a set of typeface editing software programs are used to create a well-crafted professional-quality Biblical Hebrew typeface which fully supports the rich features of diacritic placement in the popular standard Microsoft/Adobe font format.</p>
    <p>One program tool in particular is essential to create an "intelligent" or "smart" OpenType Biblical Hebrew font. That is "Microsoft VOLT". Although the user interface is graphical, and after one learns how to navigate it, is rather easy, it appears to be complex, difficult to understand, and user-unfriendly. Only a team of Microsoft programmers could have made it.</p>
    <p>If Apple engineers would have created "Apple VOLT", every two-bit self-proclaimed type designer would be knocking out hundreds of passable OpenType fonts, ruining it for the rest of us. It's in our best interests that the wizard hides behind the curtain, if you know what I mean.</p>
    <p>Until Apple gets back at Microsoft and Adobe, and creates a new font format, called "SuperType" (like TrueType was Apple and Microsoft's way to screw Adobe and PostScript [did John Warnock really cry, "Now, everything Getchke and I planned for PostScript is ruined!"] - ah, remember when Apple didn't have Steve Jobs?), let us explore why Biblical Hebrew is best suited for OpenType.</p>
    <p>First, it takes the brain work about correct Biblical Hebrew typography out of the hands of page layout professionals, and into the sweaty palms of qualified type designers - yes, those fearless few. Second, it borrows fascinating rules of Hebrew grammar from Hebrew school teachers, and lends it to the masses. Now, those teachers can keep their students awake and actually learn these rules of Hebrew grammar by using fun exciting neato groovy and keen software tools.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/joshua_1_10_4530.jpg"></div><p></p>
    <p>A sample of Biblical Hebrew text from Joshua 1:10-11 in the OpenType Biblical Hebrew font, FrankReuhl GH. Frank and Reuhl were two Germans in the early twentieth century, who created this popular standard Hebrew type design. It was the Hebrew version of Times-Roman, in that it replaced the famous Vilna type design standard of the 19th century. </p>
    <p>Contact FontWorld (<a href="http://www.fontworld.com" title="www.fontworld.com">www.fontworld.com</a>) for more details. </p>
    <p>Note the special Hebrew glyphs for the shva-na, final nuhn with patach, the folded lamed, the unfolded ayin, and the various final chofs. Featured also is John Hudson's automatic furtive patach, highlighted in blue.</p>
