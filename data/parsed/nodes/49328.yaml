  - id: 301475
    user: 1262
    date: 2008-09-15T10:51:00
    date_raw: 15 Sep 2008 — 10:51am
    votes: null
    html: <p>My own view on this topic is that sheva na is properly an encoding issue. It may or may not be possible to automate a glyph-level solution based on the encoding of sheva, but even if possible this does not mean that this is the best or most appropriate way to handle the distinction. As with the qamats qatan / qamats gadol distinction, this is something that belongs at the plain text level so that users can reliably interchange text while maintaining this distinction. The furtive patah is not a good parallel, because that is a standard grammatical rule, while visual display of a distinction between two different pronunciations of sheva, like the distinction between two different pronunciations of qamats, is a user/publisher-specific preference. For users who wish to make the distinction, we can assume that they would like the distinction to be retained when they send text e.g. by email or published over the web; ergo, the distinction needs to be made at the plain text level and not rely on a glyph-level display solution.</p>
  - id: 301542
    user: 18444
    date: 2008-09-15T15:49:00
    date_raw: 15 Sep 2008 — 3:49pm
    votes: null
    html: |-
      <p>John,</p>
      <p>Do you want to have your cake and eat it too?</p>
      <p>If the glyph is in deed based a major grammatical rule, like the kamatz gadol, then it should be data transferable, and hence, deserves a Unicode value.</p>
      <p>The furtive patach then is a minor grammatical rule, then it does not have to be data transferable, and hence, does not need its own Unicode value.</p>
      <p>If so, a hataf kamatz kadol and a shvana (both which we implemented already), should have a Unicode value in the next Unicode standard.</p>
      <p>===</p>
      <p>I agree that for data transfer purposes, the implementation in an OpenType font as an automatic feature like the furtive patach is unnecessary.</p>
      <p>The advantage of implementation in an OpenType font as an automatic feature like the furtive patach is that existing Unicode data of the Hebrew Bible, Jewish prayerbook, poetry, children's primers etc., can have these symbols placed automatically, correctly, without keying in anything.</p>
      <p>[Can a user search and replace it for a Unicode value? or is a "virtual" glyph?]</p>
