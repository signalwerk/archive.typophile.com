      <p>Mr. Rafael Frank wrote a book on Hebrew typography? This is amazing, as I believe that it was the first of its kind.</p>
      <p>Beforehand, Hebrew type design was limited to a very small set of designs.</p>
      <p>I am only aware of five sets of designs.</p>
      <p>First, there was the design family of ancient Sephardic origin, popularized by the famous Romm family Talmud publishers in Vilna, Lithuania. Their huge printing establishments dominated Jewish religious and secular publishing in most of the 19th and early 20th centuries, until the Nazis destroyed their existing inventory and burned their original Hebrew book plates and their two establishments. Later, the premises were entirely conviscated by the Communists, and nothing remained but history and dying memories.</p>
      <p>Like the simple biography of Frank has been lost to a great part, the story of the illustrious Romm family printing establishment is very limited.</p>
      <p>The patriarch of the Romm family traveled to Italy with very old drawings of Hebrew letter forms, according to an account byFrederick Goudy, the great American type designer, in his small book on the evolution of type design. This Romm family patriarch went to the Bodoni school of type design in Italy.</p>
      <p>Interestingly, the resulting Hebrew type designs are similar to some of Bodoni famous works, prompting one to question which came first, the chicken or the egg?</p>
      <p>I believe the answer rests in reproductions of hand-drawn books which feature this very same Hebrew type designs, dating from periods which preceded the invention of the printing press. This clearly indicates that English type designs popularized by Bodoni were inspired by old Sephardic drawings of Hebrew letterforms.</p>
      <p>What is fascinating is that those very popular Bodoni English type designs do not have design origins in other older type designs, and stand out in the crowd, so to speak.</p>
      <p>Another style of Hebrew type design is non-Jewish in origin, from the famous priest Bomberg and [businessman ?] Soncino, based upon their interpretations of drawings of old Sephardic and Ashkenazic letter forms, as seen through European Christian eyes.</p>
      <p>I was told recently that John Hudson's Adobe Hebrew and SBL-Hebrew were inspired by these sources. Is that accurate, John? In we study this design carefully, we see elements of Mr. Henri Friedlaender a"h popular Hadasa typeface (which seems a cross between the first and second designs).</p>
      <p>The third kind of design is Ashkenazic in origin, and similar to the design popularized by the Israeli typographer Mr. Eliyahu Koren a"h.</p>
      <p>The fourth style of design appears in the Dead Sea Scrolls and other archaelogical findings. This ia crude script-like design, that looks like it was formed from the speed of the scribe's hand, and not due to any design issues.</p>
      <p>The fifth design style is found in the Torah Scroll. It is block-like, squarish, ornate, and clearly rich with design significance.</p>
      <p>I agree that with such an important role that the FrankRuehl design has played in modern Hebrew publishing, much too little is written about this very talented designer who revolutionized modern Hebrew type design with his single significant contribution.</p>
