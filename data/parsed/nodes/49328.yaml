      <p>OpenType is really great. Like TrueType before it, it supports Unicode. </p>
      <p>If a text document is encoded with Unicode, then every character and glyph in the world has its unigue Unicode value. This then avoids the confusion when data is transfered from one program to another, or from one platform to another, and different sets of encoding are used or misused. People who remember the nineties will never forget - what a mess!</p>
      <p>OpenType is cross platform, so if the font can be installed on the Macintosh and work, it can also be installed on Windows and work, too. No more file conversions etc.</p>
      <p>But do you know what is the greatest thing about OpenType that never existed before in fine Hebrew typography?</p>
      <p>Accurate placement.</p>
      <p>This no longer is in the field of the operator of the page layout software program or super word-processor - that guy is a good graphic artist at best... it is in the field of the talented type designer. </p>
      <p>Accurate placement is now in the intelligent OpenType typeface.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/joshua_with_wo_6372.jpg"></div><p></p>
      <p>Two examples of the popular FrankReuhl font. One with intelligent OpenType character/diacritic placement, and one without (ah, that font doesn't even have taamim!).</p>
