      <p>The creation of Shvana into a<br>
      furtive patach-like automatic substitution<br>
      ==========================================</p>
      <p>I reviewed in depth the Nusach Ari, the rendition according the Ari zal by Rabbi Shneur Zalman of Liadi, the first Lubavitcher Rebbe, Birkat Hamazon, the booklet of blessings after a meal.</p>
      <p>This booklet is special because it features a graphic symbol for a shvana.</p>
      <p>I looked for a pattern when a shvana appeared, and when an ordinary shva(nach) appeared. I asked myself under what consitions did it always appear, and under what conditions it never appeared.</p>
      <p>I found that there are a few rules. Therefore, an OpenType font can include CSUB contextual replacement for each rule.</p>
      <p>For example, the shvana always appeared over the shva after the first letter of a Hebrew word, if that letter is a shooruk, a vov with a dot on it middle left side. One rule.</p>
      <p>There are other rules as well. Stay tuned for more.</p>
