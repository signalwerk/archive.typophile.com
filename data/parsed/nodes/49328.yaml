      <p>Chajke,</p>
      <p>Thank you for the correction about Mr. Rafael Frank, the co-creator of the popular modern Hebrew type design.</p>
      <p>Do we know biographical information about him? The name of the temple where he was chazzan, for example.</p>
      <p>Regarding the discrepencies in my description of him, is simply due to what little details I heard about him, and the person or firm which cut his designs into metal type. From your account, they weren't details, but inaccuracies.</p>
      <p>About the spelling of his typeface, I used to spell it Fronk-Ruehl, simply in order to make a distiction between my font, and other people's fonts of similar names, and somewhat similar designs.</p>
      <p>===</p>
      <p>I see that this reproduction of this famous design is very similar to my [first] version. Interestingly, Merganthaler/Linotype and Varityper used different designs. There are at least five different designs.</p>
      <p>===</p>
      <p>Germany not only produced the popular standard text font of Mr. Rafael Frank a"h, but also one of the designs popularized by Mr. Tzvi Narkis a"h of Israel.</p>
      <p>When I lived in Rochester, NY, I had the good fortune to visit the Graphic Arts library and type design collection at R.I.T., the Rochester Institute of Technology, which houses one of the finest and largest collections of type designs in the world. </p>
      <p>While there, I happened across a poster about a play that took place in the Warsaw Ghetto or a concentration camp with beautiful hand-drawn Hebrew lettering on it. It was exactly the design later popularized by Mr. Narkis, a sans-serif Hebrew typeface design. I was mesmerized by what I saw.</p>
      <p>There, in German occupied Poland was the birthplace of the first sans-serif Hebrew typeface design. And in the ashes of mankind's murderous holocaust was an expression of wonderful lively creativity!</p>
      <p>Germany also homed the popular display Hebrew typeface design, Chaim, or Haim Hashamen (the 'fat Hayim') [because generations later a narrow version of Chaim was created, known as Haim Tzar (the 'skinny Hayim')].</p>
      <p>===</p>
      <p>Coincidentally, the library's assistant librarian, Mr. Perkow (I think) grew up in Crown Heights, Brooklyn, to where I later moved. Small world, isn't it?</p>
