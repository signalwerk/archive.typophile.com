    html: |-
      <p>A good full-service print shop could show you sample books of various paper stocks that would work, and they could obtain full-size sample sheets for you. I'd suggest testing a sample to make sure that your pen can write on it.</p>
      <p>Heavier-weight papers are less likely to flap around in the breeze. Also be sure the papers are secured in some way (3-ring binder or whatever) so you don't end up chasing after them.</p>
      <p>Lamination is another option if the pages don't need to be written upon.</p>
