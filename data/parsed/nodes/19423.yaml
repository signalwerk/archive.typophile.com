    date: 2006-05-26T06:07:00
    date_raw: 26 May 2006 — 6:07am
    votes: null
    html: "<p>What is/was Basel school? It is a visual, tactile, intellectual and strategic way of developing an understanding and knowhow about creating powerful visual messages. Yes there is/was a Basel style, but people who emphasize that miss the point. The school teaches a complex and unique way of approaching--in my case, graphic design--that will propel students forward into communicators who look at the design business as a way to solve problems in new and different ways. Even more impt than that, solutions that are relevant and appropriate, first, to the organizations for whom they are designing. The words to describe this unusually advanced school are: innovation, change, growth. Personally, my three year experience at the Basel school was intense--both emotionally, intellectually, and visually. Hoffman, Hauert, Weingart, and VonArx opened up an enttirely new world for me.. and propelled me into a deeper, more satisfying visual life that I might not otherwise have had. I don't do much designing any more. I paint full time. But I will tell you, in my painting, I am pulling together all the principles I learned in Basel. My approach is complex--but of course it would be. I learned from some of the most remarkable teachers in the design world at that time. I am grateful beyond words. I would not be where I am today without the intensity and diversity of thsiis forward-pushing, intellectually challenging school with its teachers. I also have my classmates to thank as well. They were and still are awesome in their own right. Bill Schorner, April Greiman, Ken Komai, and Dan Friedman coem immediately to mind. I hope this helps. It is not about the Swiss style. That is not the Basel school. It is much deeper. thanks Jack D.</p>"
