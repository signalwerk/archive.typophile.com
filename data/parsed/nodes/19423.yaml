      <p>I studied with Ken Hiebert while he was teaching at Carnegie Mellon University in the 60s. A classmate of mine then, Dan Friedman, was later a Basel Graduate. He met April Greiman in Basel and they ended up getting married. </p>
      <p>If you look through Ken Hiebert's book, you will find some of my work done in a workshop he and Weingart ran in Pittsburgh in about 1984.</p>
      <p>ChrisL</p>
