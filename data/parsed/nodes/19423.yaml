    <p>Hello,</p>
    <p>I am currently doing a design project where we have to design a chair influenced by an art movement. I was given Basel. I have read many pages on the school, instructors, and students but am having difficulty narrowing down what exactly the Basel movement is. Any insight to this would be greatly appreciated. thanks</p>
