    html: <p>For what it's worth, there's a large contingency of Basel graduates currently teaching in the US. In Philadelphia, at the University of the Arts; Hans Alleman, Chris Zelinsky, Inge Druckrey, Larry Bach, Ken Hiebert, and others. There are other Basel people teaching in the US, but these are the ones I personally know.</p>
