      <p>That's a tricky one, I guess art movements are a little different to design movements?  In the 50's karl Gerstner began to contribute to both art and design in Basel. He still lives there as an artist and from then to the present day has been a prolific creator of 'Concrete' art. This is like constrcuctive art but leaning a little more towards suprematism; the work refers to itself only, does not represent anything in the way abstract work does.</p>
      <p>With research I'm sure you would be able to uncover other artist based in Basel mid-late century who's practice was based around this principal. Interestingly Basel lies at the point where Switzerland, France and Germany meet. This made it a very active area, drawing influence from germany and it's early pioners who were at the front of constructive art.</p>
      <p>With little factual knoledge I guess that during and after the second world war Basel was a slightly more attractive place for those artists and designers not wanting to flee as far away as America. It is more than likely that I'm way off the scent but my reflex reaction is to propose the Basel movement in art did revolve around mathematical, systematic, process based work and took place in the 50's and 60's. I believe Switzerland to be a large inspiration to the Minimalist movement that took place in America in the 60's.</p>
      <p>For me this is quite interesting so people with real knoledge would not only be helping Brice.</p>
