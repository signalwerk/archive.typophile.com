      <p>One of Hofmann's legendary teaching methods included the following trick: </p>
      <p>The students were given a few simple three-dimensional objects - cubes, cuboids - which they had to put together to form a three-dimensional composition. When the students presented their three-dimensional composition, Hofmann would swipe it away and tell the students to rebuild it exactly the way it was before. In most cases the students were not able to rebuild it, but Hofmann of course could.</p>
      <p>In his own work it was always a process which led him to a specific result.</p>
