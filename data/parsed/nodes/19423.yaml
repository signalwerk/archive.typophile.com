      <p>I only know about the typography and graphic design classes<br>
      at the Allgemeine Kunstgewerbeschule  Basel.</p>
      <p>Some important teachers were Emil Ruder, Armin Hofmann,<br>
      Andre Guertler and Wolfgang Weingart. </p>
      <p>Amongst the students were April Greiman, Ken Hiebert,<br>
      Helmut Schmid and Hamish Muir (8vo).</p>
      <p>The school is/was famous for its strong methodological approach.</p>
