      <p>"<em>What I am looking for is a dictionary to check the spelling of as many words as possible</em>." is is very broad question. Do you mean the world's biggest? Most popular? Most languages? Sold most copies? Electronic? Reviewed? Up to date?</p>
      <p>Can you provide a little more background information about yourself and this project? Is it personal, academic, or professional? Who is your audience? What are their goals? Information like this will help people provide you with more meaningful feedback.</p>
      <p><a href="http://en.wikipedia.org/wiki/Dictionary#Major_English_dictionaries" rel="nofollow">Wikipedia's page on "Major English dictionaries"</a> has many options. Be mindful that certain people the same word different ways of spelling the same word (eg, Americans = color, Canadians = colour).</p>
      <p>I am not a linguist so I cannot offer much advice, but I fairly confidant that the people who designed this system double checked their sources. From their page, they appear to be an American company so they probably use an American English dictionary.</p>
      <p>I still fear something is getting lost in translation (pun intended). Are you coming from an <a href="http://en.wikipedia.org/wiki/ESL" rel="nofollow">ESL</a> perspective and looking at issues of <a href="http://en.wikipedia.org/wiki/Spelling_reform" rel="nofollow">spelling reform</a>? Are you interested in the <a href="http://en.wikipedia.org/wiki/Orthography" rel="nofollow">orthography</a> they used?</p>
      <p>You may want to research <a href="http://en.wikipedia.org/wiki/Simplified_Spelling_Society" rel="nofollow">The Simplified Spelling Society</a>. You have most likely read <a href="http://www.eyemagazine.com/feature.php?id=117&amp;fid=524" rel="nofollow">this article that Eye magazine published about the Initial Teaching Alphabet</a><a>. </a></p>
      <p>To rephrase and clarify your question, do you mean:</p>
      <p>"<strong>What is the <a href="http://en.wikipedia.org/wiki/Primary_source" rel="nofollow">primary source</a> that the <a href="http://initialteachingalphabet.org/" rel="nofollow">Initial Teaching Alphabet Foundation</a> used to determine the spelling of the words they selected when they originally developed the <a href="http://en.wikipedia.org/wiki/Initial_Teaching_Alphabet" rel="nofollow">Initial Teaching Alphabet</a><a></a></strong>?"</p>
