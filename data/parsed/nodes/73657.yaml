      <p>@katrin s:<br>
      <cite>My original research question was 'Can I achieve greater correspondence between the spoken and written language by adapting an alphabet or creating a new writing system?', which led me to research alphabets such as the ITA and UNIFON.</cite></p>
      <p>IIRC, the ITA, because it was meant to teach children to read, rather than serve as a phonetic alphabet, was allowed to represent the same sound in more than one way, in order that in some cases there would not be too large a divergence between ITA spellings and conventional English spellings.</p>
      <p>I could be mistaken, but if that is the case, that would reduce its applicability to your question. The answer to that question, though, of course is "Yes" - look at the Shaw Alphabet, or the suggestions of the Simplified Spelling Society - I recall a book by Mont Follick, in which the use of a new alphabet was avoided. The trick was using ' to indicate where two consecutive vowels did not form a dipthong.</p>
