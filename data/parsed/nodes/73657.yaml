      <p>@ Joe: Thanks for clearing the question up. I was way off on my interpretation. I did not understand that "…words set in the ITI…" meant "…words set using the glyphs from the ITI…"</p>
      <p>@ katrin: I believe this is what you are looking for:</p>
      <p>Downing, J. A. (1963). The Augmented Roman Alphabet for Learning to Read. <em>The Reading Teacher, 16(5)</em>, 325–336.</p>
      <p>On pages 326-7 they illustrate 32 glyphs (some characters, some ligatures) and a few words set using them. You may need database access to get this article. If you do not have immediate access, contact me and I can pass it on.</p>
      <p>If you have access to JSTOR the stable link is:</p>
      <p><a href="http://www.jstor.org/stable/20197649" title="http://www.jstor.org/stable/20197649">http://www.jstor.org/stable/20197649</a></p>
