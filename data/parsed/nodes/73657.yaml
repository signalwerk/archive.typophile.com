      <p>Apologies if I have been unclear. What I am looking for is a dictionary where I can look up how to spell, for example, the word 'rules' using the ITA. Looking at the ITA chart that gives examples of how to pronounce each letter, I can see that there is a traditional 's', 'z' and a reversed 'z'. Now, if I am unsure of which letter to use to replace the 's' in the traditionally spelled word 'rules', it would be helpful to look this word up in a dictionary that shows how an American English word would be spelled using the letters and orthography of the ITA. Such a dictionary exists for the UNIFON alphabet and is extremely helpful.</p>
      <p>As for my background, I am a Graphic Designer specializing in typography and book design, currently studying for an MA in Graphic Design. My original research question was 'Can I achieve greater correspondence between the spoken and written language by adapting an alphabet or creating a new writing system?', which led me to research alphabets such as the ITA and UNIFON. I am therefore, interested in both the orthography and the design of the letters.</p>
