    <p>I want to do something like <a class="freelinking-external" href="http://thomas.levine.googlepages.com/ring_on_lawn_postsecret-lowres.jpg">this</a>, except I want to write “2008” on the lawn.</p>
    <p>Does anyone have any recommendations of what font to use?  It should be be a font that is still very readable even if the lines get sloppy in case the grass grows unevenly or the fertilizer isn’t applied perfectly.  Also, I imagine that it’ll be easier to make straight lines than curves.</p>
    <div class="forum-topic-navigation clear-block"><a href="/node/31052" class="topic-previous" title="Go to previous forum topic">‹ Hitchcock font by Matt Terich</a> <a href="/node/36338" class="topic-next" title="Go to next forum topic">wordmark for visual artist ›</a></div>
