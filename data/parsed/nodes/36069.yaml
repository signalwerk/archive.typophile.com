      <p>The dimensions of the lawn are about 160’ by 360’, and I really like Agency because it looks much easier to write than Machine.  Does anyone have any suggestions about which weight to use?</p>
      <p>Depending on the weight, the font size should be around 43200pt to 56766pt, assuming I only use half the school.  Should I change any of the proportions or spacings when I enlarge it?</p>
      <p>I have someone determining what type of fertilizer we should use, and I’ll give him that suggestion about time-released fertilizer.</p>
