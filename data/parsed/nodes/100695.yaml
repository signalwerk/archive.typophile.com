  html: |-
    <p>Howdy folk, we're launching an on-screen design studio.<br>
    The approach was to keep a friendly, approachable spin while having something that could play nicely in more serious/sensible surrounds.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/supernaut_5811.jpg"></div><p></p>
    <p>Appreciate thoughts and feedback on letter shape/weighting.</p>
    <p>Would also love some typeface recommends to sit with it.<br>
    Our current view sees some contrasting pairs used, i.e, VAG and Corona</p>
    <p>Any and all welcome and appreciated.</p>
