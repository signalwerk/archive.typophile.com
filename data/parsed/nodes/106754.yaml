  html: |-
    <p>Hi,<br>
    I was wondering if someone could help me finding good pairing fonts for Dezen Pro regular (<a href="http://www.myfonts.com/fonts/dizajndesign/dezen-pro/regular/" title="http://www.myfonts.com/fonts/dizajndesign/dezen-pro/regular/">http://www.myfonts.com/fonts/dizajndesign/dezen-pro/regular/</a>), mostly based on the same x height.<br>
    I would love to  find the fonts that are different in the cut style but still create a good balance.<br>
    Dezen Pro will be used mainly as a title's font and the pairing font as text.</p>
    <p>Now that there are millions of typefaces to choose from, what would be the best way to choose a good pair, specially based on the x height? Is there an application I could use that would allow me to overlap/compare side-by-side fonts on the fly without rely on  Illustrator or Indesign?</p>
    <p>Many thanks for all your help,<br>
    Nuno</p>
