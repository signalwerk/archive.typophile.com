  html: |-
    <p>Hello<br>
    Can anyone recommend some kind of online encyclopedia of fonts? I ask because every time I start a new project, I want to research fonts of particular periods or locations and I never really know where to look. For example, currently I would like to research fonts evocative of Italy, from all periods, and other than typing 'italy' into a few sites like fonts.com, I don't have a clue where to look.</p>
    <p>Thank you for any suggestions.</p>
