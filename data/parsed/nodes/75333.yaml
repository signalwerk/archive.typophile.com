  html: |-
    <p>Hello,</p>
    <p>I am using VOLT for the first time for a Syriac font. I am building each feature one by one to catch any problems then compiling and proofing.</p>
    <p>I have the script as “Syriac” and the language is “Default.” So far I just have added the Mark to Base (mark) feature. I have set up 2 base glyphs to test each with 3 above marks. It complies fine and the letters show up in the proofing tool but when I hit the complete button the anchors don’t link to the base glyph. I have tried this in one of the test fonts to see that the software works and it does. I am not sure what I am missing. I have double checked in the “look up” window and the marks are in the correct place and locked. The “Process Marks” are set to “ALL” and the “Process Base Glyphs” is checked. I have the language direction set to “RTL.”</p>
    <p>Thanks,</p>
    <p>Frances</p>
