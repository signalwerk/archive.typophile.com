      <p>I do need to finish adding the stencil cuts to most of the letters. I haven't decided yet if I should add them to all the letters that wouldn't actually need them to function as a stencil. It seems to be working with the E, F, L and S. I don't know how yet to handle it with the Y or T.</p>
      <p>The logotype is still subject to change, so the Y and T might end up with cuts. Suggestions on how to handle it? I've looked to <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/fontfont/ff_oxide_stencil_ot_regular/" rel="nofollow">FF Oxide Stencil</a> for some inspiration, but not all the letters feature a pylon since the Stencil version is for actually cutting stencils I'm sure, not just the style of the stencil letter.</p>
