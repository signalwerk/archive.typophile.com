      <p>Nice work, they look a lot more unified now. For the T and Y, I'd cut them in the same way as <a href="http://new.myfonts.com/fonts/urw/glaser-stencil/d/" rel="nofollow">Glaser Stencil</a> cuts the T. You'll see <a href="http://new.myfonts.com/fonts/applyinteractive/arston-stencil/" rel="nofollow">Arston Stencil</a> cuts it differently.</p>
