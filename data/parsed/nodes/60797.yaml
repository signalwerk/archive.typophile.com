      <p>I added quite a few new characters and tried some of your suggestions for cutting the characters. I found that trying to modify the K, E, F, G etc... to fit the low cross bar of the A and Y was just too awkward so I'd rather either just keep the K and A as they are or raise the crossbars. Which looks better? And which cuts do you prefer for the N, M, W?</p>
