    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>: Neville&nbsp;Brody</strong></p>
    <p><strong>Neville Brody</strong> (b. 1957) is a London born graphic designer. Studied at the <a href="/node/13728" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">London College of Printing</a>. Primarily known for his work as Art Director on <em>The Face</em> magazine and for his studio’s work on the late 1990s <a href="/node/44707" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Macromedia</a> identity. In 1990 he and <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> started <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> and <em><a href="/node/14028" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FUSE</span></a></em>. Currently he operates his <a href="/node/add/wiki?edit%5Btitle%5D=London" title="Create node &quot;London&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">London</a> studio, Research&nbsp;Associates.</p>
    <p>Some of his early design work was for British bands. Fetish, Hanibal, 23 Skiddo, and Cabaret Voltaire all have album covers designed by&nbsp;Brody.</p>
    <p>See a collection of his designs for the Dutch postal service <a href="http://www.katranpress.com/stamps_brody_1_1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
