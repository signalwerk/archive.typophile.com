    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a>: <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a>: Neville Brody</strong></p>
    <p><strong>Neville Brody</strong> (b. 1957) is a London born graphic designer. Studied at the <a href="/wiki/London%20College%20of%20Printing" class="freelinking" rel="nofollow">London College of Printing</a>. Primarily known for his work as Art Director on <em>The Face</em> magazine and for his studio's work on the late 1990s <a href="/wiki/Macromedia" class="freelinking" rel="nofollow">Macromedia</a> identity. In 1990 he and <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> started <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> and <em><a href="/wiki/Fuse" class="freelinking" rel="nofollow">Fuse</a></em>. Currently he operates his <a href="/wiki/London" class="freelinking" rel="nofollow">London</a> studio, Research Associates.</p>
    <p>Some of his early design work was for British bands. Fetish, Hanibal, 23 Skiddo, and Cabaret Voltaire all have album covers designed by Brody.</p>
    <p>See a collection of his designs for the Dutch postal service <a class="freelinking external" href="http://www.katranpress.com/stamps_brody_1_1.html" rel="nofollow">here</a>.</p>
