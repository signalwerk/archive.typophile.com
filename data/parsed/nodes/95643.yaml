    <p>On advice of counsel, until I receive a definitive answer to the email cited directly below, all of </p>
    <p>which follows this disclosure shall be deemed to be hypothetical. Consequently, as soon as the sole </p>
    <p>question asked in said email is answered to my satisfaction, I will release all who may read these </p>
    <p>and the following words from their bond of Willing Suspension of Disbelief, at a time and in a </p>
    <p>manner of my choosing. My word is my bond.</p>
    <p>Here begins the formal recitation, copied verbatim and pasted unaltered herein:</p>
    <p>    Logical Inconsistencies in Online Information‏</p>
    <p>[Mark this message as unread] [Delete this message]<br>
    [Keep this message at the top of your inbox]<br>
    8/16/12<br>
    Reply  ▼</p>
    <p> NICHOLAS CURTIS</p>
    <p>    <a href="mailto:kipnick@msn.com">kipnick@msn.com</a></p>
    <p>To <a href="mailto:cvasil@supremecourt.gov">cvasil@supremecourt.gov</a><br>
    Sir,</p>
    <p>As a party to a potential lawsuit involving actual monetary loss and irreparable damage to my </p>
    <p>personal and professional reputation, I leave it to your discretion to advise me of my best course </p>
    <p>of action as outlined here—</p>
    <p>http:/  /www.supremecourt.gov  /ctrules/  tocounsel_07rulesrevisions  .aspx</p>
    <p>Note: two additional single spaces have been placed between otherwise contiguous elements in order </p>
    <p>intentionally to avoid algorithmic misinterpretation of the contents of this message.</p>
    <p>My dilemma: I have a potential lawsuit form monetary damages, which makes me an interested party. </p>
    <p>The potential plaintiff, curiously, controls the most extensive inventory of Supreme-Court-approved </p>
    <p>typefaces. Therefore, there are no disinterested parties to this suit, and therefore the majority </p>
    <p>of the parties involved—defendant, plaintiff, nor the Supreme Court itself—have an enormous </p>
    <p>disincentive to comply with the amicus curiae provisions of this ruling—unless, of course, the </p>
    <p>meaning of the term "certain" is certainly, indisputably and indubitably unambiguous when said </p>
    <p>brief is filed.</p>
    <p>For reasons which should be painfully obvious by now, should the highest court in the land become a </p>
    <p>party to this hypothetical suit, who is duly authorized to disambiguate.</p>
    <p>Yours in confusion,</p>
    <p>Nicholas J. Curtis<br>
    Citizen of the United States of America<br>
    7523 Republic Ct Apt 204<br>
    Alexandria, VA 22306<br>
    703-765-1636</p>
    <p>Communications through the most secure channels highly recommended.</p>
    <p>Here ends the truth, the whole truth and nothing but the truth of the email first referenced above.</p>
    <p>Given by my hand, and entrusted to my soon-to-be-former colleagues and assigns, so that they may </p>
    <p>bear witness to the veracity of all of my forgoing words.</p>
    <p>[Signed] Nicholas J. Curtis<br>
    Citizen of the United States of America</p>
    <p>WARNING; LEGAL NOTICE. ANY INFORMATION NOT PREVIOUSLY AVAILABLE FROM PUBLIC RECORDS IS WILLINGLY </p>
    <p>DIVULGED BY THE SIGNATORY. ANY EFFORT TO PROTECT SAID SIGNATORY FROM UNINTENDED CONSEQUENCES OF </p>
    <p>THESE ACTIONS SHALL BE DEEMED A PRIMA FACIE EFFORT TO DESTROY RELEVANT EVIDENCE. YOUR COMPLIANCE </p>
    <p>IS, OF COURSE, OPTIONAL, BUT YOUR COOPERATION WOULD BE APPRECIATED.</p>
