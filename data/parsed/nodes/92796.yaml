    html: <p><em>The Stage Club</em> looks like Times Bold. The second line might be Garamond Italic, but it's too small to be sure. <em>Murder on the Nile</em> and the 4 lines below it are different versions of Cheltenham. <em>Singapore</em> looks like a member of the Century family.</p>
