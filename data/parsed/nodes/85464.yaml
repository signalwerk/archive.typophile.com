  html: |-
    <p>Hey all,</p>
    <p>I'm starting my dissertation for my third year in Graphic Communication and would be very grateful for some pointers with the question and possible chapters within the dissertation.</p>
    <p>I want to research typography and colour in advertising and how it  can effects consumers to buy a product. Do you think this is enough to go on or do you think I should focus on an area of advertising, gender or product?</p>
    <p>Thanks in advance<br>
    :)</p>
