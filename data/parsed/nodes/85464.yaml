      <p><em>Tested Advertising Methods</em> by John Caples</p>
      <p><em>Ogilvy on Advertising</em> by David Ogilvy</p>
      <p><em>Type &amp; Layout: Are You Communicating or Just Making Pretty Shapes</em> by Colin Wheildon</p>
      <p>These are somewhat print-centric, but the principles, which were empirically derived (especially from direct mail) are still valid.</p>
      <p>Presently, TV ads have a lot of typography, so that the ads can still "talk" to viewers when they hit the Mute button.<br>
      As well as the fact that After Effects is a wonderful tool box for animating type.</p>
