    html: |-
      <p>Thought it was easy as <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/trade-gothic" rel="nofollow">Trade Gothic Condensed Bold</a> for "VANDAL GOTHIC" but I was forgetting this /J. The only I have in stock that could fit these specifications is <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/rama-gothic" rel="nofollow">Rama Gothic Expanded</a> (Semibold or Bold). There are also:<br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/berthold/akzidenz-grotesk-be" rel="nofollow">Akzidenz Grotesk Condensed</a> but it's not enough bold and following weights (Medium and Bold) have totally different /K, /P and /J designs<br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/redrooster/block-gothic-rr" rel="nofollow">Block Gothic</a> but /K is off<br>
      - <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/helvetica" rel="nofollow">Helevetica Condensed Bold</a> close but overall design off</p>
    html_clean: |-
