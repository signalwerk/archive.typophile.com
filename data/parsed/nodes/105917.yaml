      <p>OK, I think I've solved the problem -- in my original post I said I hadn't changed any glyphs, but it turns out that that wasn't entirely true -- I added a glyph (a box to replace the empty .notdef glyph present in the original font), which must have triggered autohinting and caused the alignment zones to be recalculated or something along those lines. It took me awhile to figure this out, though, since I forgot to clear the font caches when doing my subsequent experiments and I think I was getting the same bad hinting because it was using the earlier cached version.</p>
      <p>Thanks for everyone's suggestions.</p>
      <p>André</p>
