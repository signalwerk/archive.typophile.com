    <p>I've got a number of older fonts in Mac type 1 format, and fearing that OS X will eventually drop support for type 1 fonts (or for resource-fork based files), I've started the gradual process of converting these to opentype where the license permits this.</p>
    <p>I'm using FontLab Studio for this. The only actual editing I'm doing involves (i) the name table to ensure that families are grouped properly and to add a vendor/foundry suffix in some cases; and (ii) adding a (usually) fairly minimal set of opentype features. I'm not doing anything to the actual glyphs.</p>
    <p>I've noticed, however, that in many cases the hinting appears to be degraded after generating .otf files. I assumed that if I did not alter glyphs or mess with the alignment zones the hinting would be preserved, but this does not appear to be the case. (many of these fonts are old (no longer available) Berthold BE faces from Adobe, which I assume were properly hinted to begin with).</p>
    <p>Hinting is one area which I am not that familiar with. I'm wondering if there are differences between type 1 and CFF hinting which prevents FLS from preserving hints or hinting paramaters, or whether there is perhaps some arcane preference hiding somewhere in FontLab Studio which I need to change (I have FLS set to autohint unhinted glyphs, but that's the only preference I can find which looks relevant).</p>
    <p>Any suggestions would be appreciated.</p>
    <p>André</p>
