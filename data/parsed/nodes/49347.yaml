      <p>To Ricardo:</p>
      <p>They teach it properly, but as you grow up you tend to distort it(as well as many other letters)and make variations like a small straight line that barely touches the C or even crosses it, almost a dot and so on.</p>
      <p>To Michael:</p>
      <p>I don't even know that Newspaper it's probably a local one... but that doesn't matter, what matter is that, the ones making these changes are probably the typographers that don't use the cedilla. If you check the Dax you just posted, for me its ok, its like a simplified version of the cedilla but not a comma, i would even say that they know what a cedilla is when they designed the typeface (joke). Now... only a small number of people could have this discussion and actually care about it cus in fact... i never ever thought about this "problem" and i really don't care much to say the truth cus no matter how you make a cedilla or a tilde it will always me a cedilla and a tilde... it's like Obama said the other day... a pig with lipstick is still a pig. Being Portuguese, adopted by Catalans and had a Turkish girlfriend ( and have family in France lol) this is pretty clear to me :)</p>
      <p>To Thomas:</p>
      <p>Actually having it detached doesn't change it at all because people recognize it as a "Ç" always and if you check the Turkish alphabet that has a lot of cedillas and under commas... the letters that have a cedilla don't have a under comma and so on... so even if you during handwriting make no difference between the under comma and the cedilla it will always be read correctly. As for Romanian... there's always the context to help reading it properly. Almost all Romanian computer texts still use S-cedilla or even S instead of the under comma S because the character simply didn't existed in unicode.</p>
      <p>here is my opinion :) I think I don't have much more to say or else i will repeat myself :P</p>
      <p>-</p>
      <p><a href="http://www.nunocoelho.com" title="www.nunocoelho.com">www.nunocoelho.com</a></p>
