      <p><em>Not good. It should be default, if it is cedilla.</em></p>
      <p>if you're Portuguese and your preference is for the connected variety, this is not good, but say you are French and prefer the disconnected version, it is very good. This was the crux of my whole post above. It would be a pain in the arse to make different font versions for every language that has a different preference, so these things should be included as stylistic sets. If there is ONE form agreed upon by all members who use a particular language, then this is easily implemented in OpenType so that if you set the language of your document, the correct form is applied automatically. Given, not all applications support OpenType, but it is assumed that those who care enough about these distinctions have more sophisticated software that can cope with these things.</p>
      <p><em>So, alternatives should be the new, default should be the old.</em></p>
      <p>This is tantamount to cultural narcissism.<br>
      New ≠ Bad, and Old ≠ Good. It's not that simple.</p>
