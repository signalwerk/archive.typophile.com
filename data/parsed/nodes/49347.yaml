    html: <p>very interesting. P22 Underground Pro has both, but the comma form as the default. in my research here for my dissertation, i have found that language specific preferences for forms are not always hard and fast. these types of considerations usually come down to the tastes of the user. in my opinion, options like these may be better served as stylistic alternates or sets, especially where there is some debate about what forms are appropriate as in this case, or in the case of 'Bulgarian' forms for cyrillic, or in the case of language specific forms for Hindi, Marathi, and Nepali. another argument for stylistic alternates/sets is that major languages are not confined to one geographical location and are not bound by a single culture. native French and French-speaking Canadians will likely have different customs for how they use different forms, as will native Spanish and Spanish speakers from the americas, &amp;c. so in my opinion, it doesn't really matter which form you use as a default, as long as you are aware that there are other options and that you make these options available to the user. of course this is tricky with the current state of application support... but that onus is upon others and not typeface designers.</p>
