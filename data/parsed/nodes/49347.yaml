      <p>Paul - Sorry again, but it's incorrect the claim that French prefer the disconnected version. The unconnected version is gaining ground because of new fonts having non-conventional (or even bad) cedillas. And as I said before, since French, Catalan or Portuguese DON'T have the undercomma accent, we naturally read it as a cedilla. But a undercomma is never a cedilla. And a Romenian while learning Catalan shouldn't be confused.</p>
      <p>And yes, there is one agreed form for the cedilla, as well as different Unicode entries for both accents.</p>
      <p><cite>Given, not all applications support OpenType, but it is assumed that those who care enough about these distinctions have more sophisticated software that can cope with these things.</cite></p>
      <p>We don't have more sofisticated softwares, we simply have different keyboards. With cedillas. Or undercommas. Or even ogoneks. Or combinations of these glyphs/accents.</p>
      <p><cite>This is tantamount to cultural narcissism.<br>
      New ≠ Bad, and Old ≠ Good. It’s not that simple.</cite></p>
      <p>No one has made assumptions has that one. It's more like a Old = Settled and Less Ambiguous / New = Breakthrough, Forwardthinking and probably Naïve. It's not a black and white thing.</p>
      <p>So, my point is: As swashes are additional features but still need the "default" glyphs,  stylistic accents are additional features and DO demand the default accents.</p>
      <p>Thanks for questioning, hope that this helped.</p>
