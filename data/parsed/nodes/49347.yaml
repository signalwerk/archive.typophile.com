      <p>Fábio Martins --<br>
      <cite>And as I said before, since French, Catalan or Portuguese DON'T have the undercomma accent, we naturally read it as a cedilla. But a undercomma is never a cedilla.</cite><br>
      <cite>And most of the people, even editors, don’t know of undercomma as being different from cedillas.</cite></p>
      <p>Why then insist on designing different ones?</p>
      <p>As long as a language only knows either cedilla or commaaccent but not both, the actual difference or non-difference between them does not matter as long as it is clear -- in contrast to yet <em>other</em> diacritic marks -- that within a text of this language, a certain shape stands for cedilla, or commaaccent.<br>
      Paul Hunt's interpretation of cedilla is particularly interesting in this regard. Think of it as todays zigzag z shape, slightly rotated, rather than the round one which not in use any more (illustration from Mr Cordoba's <a href="http://en.wikipedia.org/wiki/Cedilla" target="_blank" rel="nofollow">Wikipedia link</a>). The only difference between this cedilla and commaaccent is connection vs non-connection. Now imagine the cedilla being unconnected (i.e. the commaaccent) but closer to the letter, and all this printed at 10pt. I bet that while reading you would not notice that they are unconnected except if you were told before.</p>
      <p>Personally I think that internationalization of type design, the need to cover more and more diacritic letter, goes hand in hand with "evening out" of national peculiarities. Cedilla vs commaaccent. Flat vs steep acute/grave.<br>
      Personally I am more and more reluctant to make statements about what French or Portugese or Turks or Germans "want to see". Actually designers can get away with quite uncommon solutions that are not wrong at all, and without anybody noticing as long as it is still clear what a word or text means. In Germany you will find Turkish shops that use a dot instead of cedilla below c/s, or macron/dot instead of breve above yumusak g.<br>
      This does not mean that typographers and type designers should stop caring. It is us who keep up typographic quality. And by choosing one or another letterform we even make a statement about its assumed origin. (E.g. the shape of eszett exhibits whether it was interpreted as longs+s, longs+z or longs+diacritic mark, none of them being "wrong".) Yet we should be pragmatic and not insist on certain rules just to show off that we belongs to those "who know".</p>
      <p>P.S.<br>
      Looks like this was a very good year both for KABK and Reading.</p>
      <p>[A bit repetitive after Paul Hunt's last post which I saw too late ...]</p>
