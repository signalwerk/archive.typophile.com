      <p>As far as I know, the following languages either use a cedilla for ç, ş or both. </p>
      <ul>
      <li>Western &amp; Central Romance: French, Portuguese, Catalan, Occitan, Venetian, Ligurian, etc.</li>
      <li>certain Basque dialects</li>
      <li>Turkic: Turkish, Azerbaijani, Turkmen, etc.</li>
      </ul>
      <p>Languages which use a comma accent are: Romanian (ș ț), Latvian (Ģ ķ ļ ņ), Livonian (ņ ț ḑ ŗ ļ). Even though the Unicode standard labels characters such as Ņ as N WITH CEDILLA, I’m fairly sure that they should look like comma accents, but it would be canonically equivalent to N + COMBINING CEDILLA.</p>
      <p>Therefore,</p>
      <ul>
      <li> Ccedilla, Scedilla, and Tcedilla would be drawn with a cedilla and be equivalent to Character + combining cedilla.</li>
      <li>Scommaaccent and Tcommaaccent would be drawn with a comma accent and be equivalent to Character + combining comma below</li>
      <li>Gcedilla, Kcedilla, Lcedilla, and Ncedilla would be drawn with a comma accent and be equivalent to Character + combining cedilla.</li>
      </ul>
      <p>All this said, pre-Vista Romanian keyboard layouts for Windows incorrectly mapped ș and ț as cedillas, so there are a lot of Romanian documents floating around with cedillas instead of comma accents.</p>
