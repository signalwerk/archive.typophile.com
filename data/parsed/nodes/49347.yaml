    <p>Just been thinking about cedilla options. Microsoft typography says this...</p>
    <dd>
    Under comma and cedilla
    <p>The under comma is the preferred form in the Romanian language for the uppercase characters S and T with under comma accent and lowercase s and t with under comma accent. Four new Unicode values have been defined to accommodate this preference: Scommaaccent U+0218 ; scommaaccent U+0219 ; Tcommaaccent U+021A ; tcommaaccent U+021B</p>
    <p>The connecting cedilla is the preferred form in the Turkish language for the uppercase S with cedilla and lowercase s with cedilla: Scedilla U+015E ; scedilla U+015F</p>
    <p>An under comma is an acceptable alternative to a connecting cedilla for the following characters: Ccedilla U+00c7 ; ccedilla U+00e7 ; Kcedilla U+0136 ; kcedilla U+0137 ; Lcedilla U+013b ; lcedilla U+013c ; Ncedilla U+0145 ; ncedilla U+0146 ; Rcedilla U+0156 ; rcedilla U+0157 ; Tcedilla U+0162 ; tcedilla U+0163</p>
    <p>In the Portuguese and Catalan languages the traditional connecting style of a cedilla is more commonly preferred for the Ccedilla U+00c7 and ccedilla U+00e7.</p>
    <p>It is common in modern designs and French typography to see a cedilla design with a stroke that is not connecting or as in common handwriting, a line that passes through the bottom or beneath the uppercase or lowercase c.<br>
    </p></dd>
    <p>Are Microsoft right, should I do what they say? </p>
    <p>Who is the authority on cedillas?</p>
    <p>Does my cedilla have to be a traditional shape? Would an undercomma-style cedilla on my ccedilla and scedilla offend or upset French/Turkish/Portuguese/anyone else? Should I just knuckle down and design a traditional cedilla that connects with the c and s?</p>
