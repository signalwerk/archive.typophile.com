      <p>Paul - Not really, let me disagree with you. Imagine that you are Portuguese and you use cedillas quite often. You press your "ç" button on your keyboard (yes, we use it that much that we need a specific button) and you get a "c" with a undercomma. Not good. It should be default, if it is cedilla.</p>
      <p>First function, then form, only after stylistic narcissism. So, alternatives should be the new, default should be the old.</p>
