      <p>Well, as Portuguese, I have to reply to this one.</p>
      <p>Cedillas are not undercommas, so they should be distinctive. A undercomma looks like a comma, and cedillas look like a vertically flipped question mark ("?"), without the dot.</p>
      <p>So, the article you have is ALMOST right. Albeit in Portuguese or Catalan we don't use undercommas and would immediately read a "c" with an undercomma as a "ç", I believe that we should use a undercomma as an stylistic option for two reasons:</p>
      <p>- Undercommas and cedillas have different origins, so they should be distinctive (as a cultural mark);<br>
      - With the normalization on a Western alphabet of fonetic transcriptions of non-western-native languages, these two could be used in the same language.</p>
      <p>It saddens me that Soho, which is such a nice font, doesn't have proper cedillas.</p>
      <p>Hope that I've helped.</p>
