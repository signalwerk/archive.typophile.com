      <p>French uses the ccedilla i.e. U+00E7 giving rise to the following lines in the Unicode file <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" rel="nofollow">NamesList.txt</a><br>
      <code><br>
      00E7&nbsp;&nbsp;&nbsp;    LATIN SMALL LETTER C WITH CEDILLA<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: 0063 0327</code></p>
      <p>0327 &nbsp;&nbsp;&nbsp;   COMBINING CEDILLA<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;* French, Turkish, Azerbaijani<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x (cedilla - 00B8)<br>
      </p>
      <p>The only diacritic that goes under any letter in French must be a cedilla and must then be under a c. The logical consequence is that if you see some diacritic under a c in French, that must be a cedilla.</p>
      <p>In order to see how cedillas may actually look like in French, one can search for <a href="http://recherche.fnac.com/search/quick.do?text=fran%E7ais&amp;category=book&amp;bl=HGACrera&amp;submitbtn=Okj" rel="nofollow">books with the word "Français"</a>  (i.e. French) in the FNAC site (a major French book store) so as to see the cover of a few books to learn or teach French in schools. And here are a few (I am not saying they are representative, but those texts  are from major publishers) :</p>
