      <p>Scriptorium's <a class="freelinking external" href="http://www.myfonts.com/fonts/scriptorium/blackthorn/" rel="nofollow">Blackthorn</a> is quite similar, but not identical. David Nalle's description of its influences mentions circus and old west styles, as well as Art Nouveau and Alfonse Mucha, so who knows what other fonts may have had similar inspirations.</p>
      <p>- Mike Yanega</p>
