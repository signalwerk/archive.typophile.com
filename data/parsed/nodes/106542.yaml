  html: |-
    <p>I created <a class="freelinking external" href="http://www.myfonts.com/fonts/lamatas/jaquizaca/" rel="nofollow">Jaquizaca</a> in 2001 to make <a class="freelinking external" href="http://vimeo.com/74241282" rel="nofollow">inter-titles for a TV programme</a>. After twelve years it was revised and updated with ligatures, contextual alternates and other OpenType features. It supports all the European languages using Latin alphabet.<br>
    In 2004 I draw <a class="freelinking external" href="http://origin.myfonts.com/s/aw/original/242/0/124175.pdf" rel="nofollow">a snakes'n'ladders board</a> to illustrate a magazine article on graphic design process. Now, with a little help of my friends, I translated it into <a class="freelinking external" href="http://origin.myfonts.com/s/aw/original/242/0/124178.pdf" rel="nofollow">English</a>, <a class="freelinking external" href="http://origin.myfonts.com/s/aw/original/242/0/124177.pdf" rel="nofollow">Spanish</a> and <a class="freelinking external" href="http://origin.myfonts.com/s/aw/original/242/0/124176.pdf" rel="nofollow">German</a>.</p>
