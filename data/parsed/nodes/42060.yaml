  html: |-
    <p>Has anyone tried Kalliculator <a class="freelinking-external" href="https://web.archive.org/web/20080905211008/http://kalliculator.com/">http://kalliculator.com</a> or LivePen <a class="freelinking-external" href="https://web.archive.org/web/20080905211008/http://01-lab.com/livepen.html">http://01-lab.com/livepen.html</a>? </p>
    <p>I think this is a great idea, though by no means do I think they will be able to generate fully-formed quality typefaces. They do seem like a great tool for generating consistent contrasts and making it possible to test a typeface’s color at dozens of weights before committing to anything. </p>
