    html: |-
      <p>Sorry, but I don't think a phoenix works for bankruptcy lawyers. Their clients are often huge corporations, and they're primarily looking for really smart professionals who display complete trustworthiness. The very last thing they want to encounter is a bird of prey!  </p>
      <p>It doesn't read as a "phoenix" at all, but even if it did it wouldn't suit the client. Have you discussed the concept with your client? In my opinion, a logo for a bankruptcy attorney needs to be: serious, strong, sturdy, trustworthy, and express experience and complex education.</p>
  - id: 454077
    user_id: 39971
    user_name: apankrat
    user_path: null
    user_image: null
    date_raw: 1 Mar 2011 — 10:39pm
    date: 2011-03-01T22:39:00
    votes: null
    html: <p>I think Phoenix is primarily associated with rebirth; viewing it as a bird of prey is a bit of a stretch. I am not entirely sure what bankruptcy attorneys do exactly, but if they help with restructuring and relaunching troubled companies (as opposed to shutting them down or dissolving them) then the concept is spot on.</p>
  - id: 454138
    user_id: 0
    user_name: Alaskan
    user_path: null
    user_image: null
    date_raw: 2 Mar 2011 — 9:05am
    date: 2011-03-02T09:05:00
    votes: null
    html: |-
      <p>Bankruptcy lawyers do both - dissolve companies completely and/or restructure them. Often the restructuring involves breaking the company apart and selling the parts to bigger companies. So, while filing for bankruptcy can give a company a "rebirth," it's just as likely that it's just a death. </p>
      <p>I still think the concept is a stretch. Unless their actual name is Pheonix, it just looks like a bird. If pankot hadn't said it was supposed to be a pheonix, I doubt anyone would have <strong>ever</strong> guessed it. I also think that Greek mythology a bit too "video game"  or fantasy for attorneys and their potential clients. So, if you added flames to make it actually read "pheonix," then it'll be totally inappropriate.</p>
      <p>But that's just my opinion, of course.</p>
