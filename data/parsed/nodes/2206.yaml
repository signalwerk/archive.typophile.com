    html: "<p>Although there is some superficial resemblance between the faces you mention, Hrant, and Key. There is one 'key' difference. While FF Zine, FF Olsen, Azuza, and Foundry Form all attempt to invigorate traditional forms through a contemporary medium and within a digital vernacular (an avenue which I think traces its roots to Swift), Key is just messing around with some shapes: <br> <br>[from the Veer website] <i>A bold, chunky typeface . . . that explores the manufactured or prefabricated aesthetic: construction from a set of graphic shapes. Letters are treated as individual graphic elements within a set grid. This is an aesthetic based purely on the look of the graphic form . . .</i>  <br> <br>The others are admirable, hard-working typefaces; I think Key is in a different class -- not refined enough for text, too blocky, in my opinion, for more than the occasional whatchew-lookin-at?, I'm-so-rebellious, Rolling Stone headline. <br> <br>-- K.</p>"
