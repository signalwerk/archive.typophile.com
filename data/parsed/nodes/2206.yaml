    html: <p> Story? <br>I'm just paying attention to designs that apply a certain rigidity to the conventional humanist structure, especially ones with what I'm calling "Latin slab" serifs. Key is admittedly an extreme case. Better ones are FF Zine, FF Olson, Parkinson's Azuza and The Foundry's Form. Why am I paying attention? I guess because of Patria. I like the "honesty". <br> <br>And it's the next trend in text fonts, baby!  :-) <br> <br>hhp </p>
