    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Sidney Gaunt</strong></p>
    <p>	Gaunt worked as a type designer for <a href="/wiki/Barnhart%20Brothers%20and%20Spindler" class="freelinking" rel="nofollow">Barnhart Brothers &amp; Spindler</a> foundry, in Chicago. Among the typefaces he designed are Authors Oldstyle and Italic, 1902, 1909-1915; Barnhart Lightface, 1906; Old Roman, 1907-9; and Pencraft, 1914.</p>
