  html: |-
    <p>Long story short... the web team began working on a sub-brand with a sales/marketing consultant and suddenly, I see a pretty sophomoric usage of Helvetica Neue (our corp. typeface) and a free script typeface running around the Blog, and a few email blasts.</p>
    <p>I want to present an alternative since it's seems like it's in the early stages. This will include an entirely different concept, but out of respect and play politics... I'm going to also present a version with Helvetica Neue Bold and a scripted typeface.</p>
    <p>My explorations have landed me with this selection:<br>
    <a class="freelinking external" href="http://www.myfonts.com/fonts/sudtipos/calgary-script//" rel="nofollow">Calgary Script</a> by Sudtipos.</p>
    <p>If you happen to have any other suggestions, I'm totally game. The most challenging bit about it all is that these items are being used along side a logo that uses Helvetica Neue Bold with a lock up of Helvetica Neue Medium. I have made something similar in the PDF so I can protect the integrity of the company.</p>
