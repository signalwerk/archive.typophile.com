      <p>Not meaning to be unkind, but this isn't news. Lots of studies have been done controlling other factors, varying the typeface, and finding minimal differences in reading speed between any vaguely reasonable text faces.</p>
      <p>That doesn't mean that there's no such thing as readability, nor does it deny the existence of other important differences in the reading experience. But reading speed for short passages is not much affected by variance within the realm of vaguely readable text faces.</p>
      <p>I'd be curious to see if speed of reading more extended text would be affected more by such differences. How much Arial will somebody read in an hour versus Walbaum versus Minion? Quite possibly this has been done as well, and I just haven't seen it.</p>
      <p>Cheers,</p>
      <p>T</p>
