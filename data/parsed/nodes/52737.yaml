      <p>&lt;&lt;  I wonder how ITC Garamond plays out in this test.  &gt;&gt;</p>
      <p>I just read about 900 pages set in ITC Garamond (in 1992). This was a trade book slightly bigger than 6" x 9". I'm guessing it had 40 lines per page of what looks like maybe 10.5/13 ITC Garamond. The reading was so easy, and the text so compelling, that I was able to ignore the typeface, and I had no interest in delving into the type specs.</p>
      <p>I fancy myself as one of those who "know type" (in Stephen's phrase), so obviously I knew the face as soon as I picked up the book, and my type-ish prejudices came into play. But from page 3 I did not care what the face was. I felt the text read very well. The setting was "normally" tight in letterfit and wordspace, and it appears to have been set by a professional typographer or typesetter. There were false small caps for a.m. and p.m., but they were not obtrusive.</p>
      <p>The book was a revelation, for I do not recall that I had ever read that much massed ITC Garamond. I doubt I will be tempted to set any political biographies in the face, though. The experience was not that compelling.</p>
      <p>FWIW, the book was "Truman," by David McCullough. At times it veered toward hagiography, but it would be hard to write a more moving and uplifting fictional life story than Harry Truman's as written in this book. A perfect read for this political season in the USA. Highly recommended for those who read that sort of thing.</p>
      <p>powers</p>
