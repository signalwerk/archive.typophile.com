      <p>Denis, what text typefaces have you tested so far?</p>
      <p>As others have mentioned, the high stroke contrast Bodoni style types (or related Didot and Scotch Roman) are notoriously considered to be less readable than lower contrast and oldstyle types. Linotype Didot would be a particularly good test case, I think, because the stroke contrast is extreme and the bowl shapes very tenuous.</p>
