      <p>Wow! 33 replies in 24 hours. this is very helpful. thanks. by way of response, i'll begin with three general remarks before responding to some of the particular points raised in your many kind postings. </p>
      <p>GENERAL</p>
      <p>first, we are doing other things, as well, in the paper. we are keenly aware that there is more to readability than just reading speed, and that one might question whether speed is even essential. (i think it is; people who read slowly because of low vision, e.g. 30 word/min, complain bitterly.) still, we were suprised by this result and hoped that typophiles might illuminate it and help us look for counter examples. you have. thank you.</p>
      <p>second, the possibility of a "slow text font" hinges critically on how one defines "text font". the usual definition is "suitable for setting large blocks of text". one might argue that any font that is slow is thus unsuitable and, by definition, cannot be a "text" font.</p>
      <p>third, please do not mistake a two-sentence summary for a paper. the rules of publication are strict. what we submit for publication has to be previously unpublished (and public web sites count as publication), so we can bring up (and answer questions about) some specific points here, but the bulk of our paper has to appear for the first time in the manuscript that we submit for publication.</p>
      <p>SPECIFIC</p>
      <p><strong>James Arboghast: </strong><em>If it exists my guess is it has wide spacing. Emigre’s Mrs. Eaves for example. You can slow down the reading experience of just about every text font around by tracking it out.</em><br>
      i'm a Licko fan, but we haven't yet tested Mrs Eaves. Thanks. we are looking at the effect of tracking (see below).</p>
      <p><em>Zuzana Licko also says Mrs. Eaves is not a text font.</em><br>
      this seems fanciful to me. i've mostly seen it used as a text font, whatever her intention. This is like Tschichold's claim that Palatino is a display font, not a text font  (as reported by Noorzij, link below). At some point, one must question the authorities.<br>
      <a href="http://www.letterror.com/noordzij/interview/index.html" title="http://www.letterror.com/noordzij/interview/index.html">http://www.letterror.com/noordzij/interview/index.html</a></p>
      <p><em>passages from a mystery novel, eh? ... did you try other kinds of literature?</em><br>
      in this particular project, no, but we are about to try another text, chosen to be very difficult (a bit like the mathematical text, Fermat's last theorem, suggested by Jongseong).</p>
      <p><em>"However, we were surprised to find that all the text fonts we tested are fast (more than 200 word/min)."<br>
      That’s the least surprizing thing I’ve heard all week. I would expect a text font to read at least that rapidly.</em><br>
      You've put your finger on a key issue. Suppose we do find a slow text font (perhaps Mrs Eaves), that people read at a tedious 50 word/min. Would you accept our finding? Or would you immediately reclassify the font as a display font and deny our claim? It depends on how you define "text font".</p>
      <p><strong>Jongseong: </strong><em>Any text font reads slowly if you set mathematical content with it. Or anything in a language you’ve just started to learn.</em><br>
      Yes, indeed. See my comments about Fraktur, below.</p>
      <p><strong>Stephen Coles: </strong><em>Did you try a Bodoni?</em><br>
      not yet, we're about to collect more data on a larger group of fonts, including Bodoni. we're asking here now so that typophile suggestions might better inform our choices. thanks.</p>
      <p><strong>Tim Ahrens: </strong><em>I was also thinking of Bodoni. And maybe Helvetica. How about Rotis?</em><br>
      we tested Helvetica Neue, in regular 55, ultralight 25, and black 95 weights. all gave a similar high speed: 300 word/min.</p>
      <p><strong>James Arboghast: </strong><em>Helvetica is not a text font so that doesn’t count.</em><br>
      Really? Wow. I'm shocked to hear this. In my mind, Helvetica more than satifies all the criteria to be a text font. The modern/Swiss movement recommended it for all text. </p>
      <p>Do other typographers agree with James, denying that Helvetica is a text font?</p>
      <p><strong>dberlow: </strong><em>Courier and other monospaced fonts have previously tested slower than proportionally spaced types for text.</em><br>
      My hazy recollection, from past projects, is that Courier is as fast as other fonts. we're including it in our next round of testing.</p>
      <p><em>And I know one could make something on purpose.</em><br>
      Please, please, this is a tease. Tell us how!</p>
      <p><strong>sii: </strong><em>Blackletter?</em><br>
      Oh, yes, that is a VERY interesting case. Fraktur (the German blackletter) was common before WWII in Germany, widely used for all text, and considered a text font (or family of fonts). It was outlawed during the war, and is now uncommon. People who are unfamiliar with it find it hard to read. It is now considered a display font, unsuitable for large blocks of text. This suggests that the definition of "text font" may not allow for the possibility of being slow. we're including a Fraktur in our next round of tests. we're also tring to find a fluent reader of Fraktur, for comparison. (we'd be very grateful to hear from anyone who reads a lot of Fraktur and might like to participate in a reading test. <a href="mailto:denis.pelli@nyu.edu">denis.pelli@nyu.edu</a>)</p>
      <p><strong>William Berkson: </strong><em>First, even with good text fonts you could slow people down, I think, by long measure (line width) and very tight leading (space between the lines).</em><br>
      Yes, that's true. However, I think that you would assume that calling a font "slow" would be based on reading speed under favorable conditions (easy content, reasonable line length and leading, good lighting).</p>
      <p>We have measured effect of tracking, over a wide range. it has little effect on speed unless the letters overlap or are so far apart that the words disintegrate.</p>
      <p>Comprehension is important but hard to measure with sufficient precision to be useful as a dependent measure. We ask our observers to read "as fast as possible while maintaining comprehesion". After each passage, we ask the observers to provide a gist of what they've read, which we score. Knowing that they will have to provide this gist encourages them to maintain comprehension while reading.</p>
      <p><strong>DanGayle: </strong><em>I wonder how ITC Garamond plays out</em><br>
      Garamond (Monotype) is fast: 300 word/min.</p>
      <p><strong>paulstonier: </strong><em>I read in a book from the 60’s called “Physicological Study of Typography” and within this it said that Bodoni was the slowest ...</em></p>
      <p>Oh! I didn't know of this book. I'm ordering a used copy now. Very interesting.</p>
      <p>Burt, C.L. (1959). <em>A psychological study of typography.</em> Cambridge, UK: Cambridge University Press.</p>
      <p>This is the (in)famous Sir Cyril Burt who studied inheritance of intelligence.<br>
      <a href="http://en.wikipedia.org/wiki/Cyril_Burt" title="http://en.wikipedia.org/wiki/Cyril_Burt">http://en.wikipedia.org/wiki/Cyril_Burt</a></p>
      <p>Thanks!</p>
      <p><strong>Stephen Coles: </strong><em>ITC Garamond ... she liked it and how easy it was to read</em><br>
      Nice. </p>
      <p><strong>will powers: </strong><em>I just read about 900 pages set in ITC Garamond (in 1992). This was a trade book slightly bigger than 6” x 9”. I’m guessing it had 40 lines per page of what looks like maybe 10.5/13 ITC Garamond. The reading was so easy, and the text so compelling, that I was able to ignore the typeface, and I had no interest in delving into the type specs.</em><br>
      Wow. That's a compelling testimonial. Thank you.</p>
      <p><strong>John Hudson: </strong><em>Denis, what text typefaces have you tested so far? As others have mentioned, the high stroke contrast Bodoni style types ... are notoriously considered to be less readable ...</em><br>
      So far, we have tested the following text fonts: Garamond (Monotype version 2.35), Helvetica Neue 25, 55, 95, Meta, Proforma, Quadraat, and Times New Roman. We also tested Python Sans, which not everyone would call a text font, and lots of display fonts, e.g. P22 Albers.</p>
      <p><strong>Nick Shinn: </strong><em>it looks like “readability”, as an empirically measurable quality, doesn’t exist. Unless researchers can come up with some measure other than speed.</em><br>
      We're working on it. You're a tough critic, so we'll be very interested to see what you think of our paper when we get it out.</p>
      <p><strong>Thomas Phinney: </strong><em>Not meaning to be unkind, but this isn’t news. Lots of studies have been done controlling other factors, varying the typeface, and finding minimal differences in reading speed between any vaguely reasonable text faces.</em><br>
      Yes, you are correct (and not unkind). As you say, there is a large literature showing little effect of typography on speed (e.g. Tinker, 1963). Still, naive as I am, I was surprised. I thought one or another font would be an exception. Not so.</p>
      <p>Tinker, M. A. (1963). <em>Legibility of print.</em> Ames, Iowa: Iowa State University Press.</p>
      <p><em>I’d be curious to see if speed of reading more extended text would be affected more by such differences. ... Quite possibly this has been done as well, and I just haven’t seen it.</em><br>
      I don't think it's been done, though William Berkson has suggested it here more than once.</p>
      <p><strong>James Arboghast: </strong><em>One of the most valuable things Nick taught me soon after I started making fonts was that any display font can be made to give readable results with a bit of judiciously-applied tracking out. It’s true. It works, ...</em><br>
      Hmm. That's interesting, I didn't know that. But aren't you overstating the case? There are many display fonts whose letters have strange shapes that are hard to decipher, e.g. Psychedelic or Pop-Two. I doubt that generous tracking would overcome the effect of the strange letter shapes.<br>
      <a href="http://www.myfonts.com/fonts/t26/psychedelic/" title="http://www.myfonts.com/fonts/t26/psychedelic/">http://www.myfonts.com/fonts/t26/psychedelic/</a><br>
      <a href="http://www.identifont.com/show?2D3" title="http://www.identifont.com/show?2D3">http://www.identifont.com/show?2D3</a></p>
      <p><strong>dberlow: </strong><em>try read’in this:<br>
      <a href="http://eric.ed.gov:80/ERICDocs/data/ericdocs2sql/content_storage_01/0000019b/80/32/06/cf.pdf" title="http://eric.ed.gov:80/ERICDocs/data/ericdocs2sql/content_storage_01/0000019b/80/32/06/cf.pdf">http://eric.ed.gov:80/ERICDocs/data/ericdocs2sql/content_storage_01/0000...</a><br>
      and let me know how that goes down. :)</em><br>
      yes, that's a great example. it's hideous. it takes a great effort to make oneself read it, yet, extrapolating from other tests we've done in the past, i suspect that reading speed is unimpaired. this nicely illustrates Nick Shinn's point that there is more to readability than just reading speed. thank you.</p>
      <p>thanks to all.</p>
    html_clean: |-
