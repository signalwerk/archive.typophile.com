    html: |-
      <p>Well, fonts commonly used for text all have good rhythm and evenness of color, and also have a narrow range of darkness, so I'm not surprised that they all do well. I would expect some differences, though. </p>
      <p>First, even with good text fonts you could slow people down, I think, by long measure (line width) and very tight leading (space between the lines).</p>
      <p>I mention this because of the issue of Bodoni. Through a lot of the 19th century text was set in this style of type. Toward the latter part of the century people began to recognize that old style fonts--with less high contrast--were more readable, and lower contrast fonts have been used ever since. </p>
      <p>However, if you look at the old text settings of Bodoni--style fonts, you will see that they tend to increase word spacing and line spacing in an effort to make them more readable. </p>
      <p>So if you test a high contrast Bodoni in text with the same layout specifications as old style, I think you will get a slower result. I think it would still be slower with the the kind of setting that was once preferred for these, but the difference would be attenuated.  </p>
      <p>Also, as I have mentioned before here on Typophile, I think that if you test extended text for both speed and comprehension, you will get more differentiation between type facess and settings. My suggestion has been to do eg three hours continuous of reading tests from the SAT, with the testing for comprehension. Because our perceptual and mental apparatus is very robust--can compensate for difficulties--it can overcome difficulties.  </p>
      <p>But if the reader is given more adverse or demanding circumstances, then I think measurable differences will show up. Also I think these differences will correspond to perceived reading comfort.</p>
