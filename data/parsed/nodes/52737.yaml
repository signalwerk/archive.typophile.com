    <p>For an article on legibility, Hannes Famira and I have measured reading speed (200-word passages from a mystery novel) for many fonts. Display-font speeds are all over the place, as one might expect. However, we were surprised to find that all the text fonts we tested are fast (more than 200 word/min). </p>
    <p>Can you think of a font that might be an exception to this rule? Does there exist a slow text font?</p>
  html_clean: |-
    <p>For an article on legibility, Hannes Famira and I have measured reading speed (200-word passages from a mystery novel) for many fonts. Display-font speeds are all over the place, as one might expect. However, we were surprised to find that all the text fonts we tested are fast (more than 200 word/min). </p>
    <p>Can you think of a font that might be an exception to this rule? Does there exist a slow text font?</p>
