      <p>On the difficulty of testing for comprehension. The SAT tests are supposed to be standardized for difficulty of the material. So if you do the SAT test on somebody, and the variation is more than it would normally be for SAT tests, you will see an indication of effect of the typography. </p>
      <p>I really don't think calling something a 'text type' or not for purposes of scientific testing is that useful. It will get into a verbal debate, as it has already to some extent. The issue is really what promotes readability. Now it is reasonable to start with fonts widely used for extended text assuming they represent a high standard, but that's only a starting point. </p>
      <p>I don't think the variables are all that huge for usual text types: you have 1. x-height 2. extender heights 3. stem width 4. contrast 5. width of characters 6. point size 7. presence or absence of serifs 8. weight of serifs. 9. width of round strokes. 10. with of rounds counters 11. rhythmic unity of face--measurable using Fourier transforms. </p>
      <p>You can add more, but if you have two fonts that are all the same on these 11, they're probably going to behave quite a lot alike, when it comes to ideal leading and measure.</p>
      <p>The point is, the list is long, but it doesn't go on forever.</p>
      <p>Nick if you think that your Fontesque and your Goodchild are equally readable, I think you're wrong and probably that Denis's methods, whatever they are, could refute you. Fontesque is charmingly irregular, but I think that makes it less readable than Goodchild, which follows classic proportions.</p>
