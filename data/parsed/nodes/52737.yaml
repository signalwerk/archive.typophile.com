      <p><em>...but not necessarily visa versa.</em></p>
      <p>Many typefaces that originated as display faces have been adapted for text.<br>
      From my own catalog--Brown and Fontesque.<br>
      Basically, they just need to have wider sidebearings, and for serif faces, get beefed up a bit.</p>
      <p>It is not the typeface design per se that determines whether a typeface is a text face, but (a) how the typeface is "scaled" in anticipation of use at particular sizes in particular media, and (b) whether a typographer decides to use it at text size.</p>
      <p><em>I see no insuperable barrier to quantifying the combination of variables.</em></p>
      <p>The sheer number of variables, many of which are difficult to simulate in a laboratory setting, makes it extremely impractical.</p>
      <p>And what of the typographer?<br>
      Are fonts such dull instruments that it doesn't make a blind bit of difference who sets them?<br>
      Is one typographer as good as the next?</p>
