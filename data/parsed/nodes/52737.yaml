      <p>Kevin, your logic is somewhat circular, and as usual not informed by type culture.<br>
      For instance, both Bell Centennial and Freight Micro, which were designed specifically for the most legibility-challenging text usage, have found favor as headline faces.</p>
      <p>It is a premise of the science of categories that strict definitions are not possible.<br>
      i.e. if one attempts to define the category "text type", it will be possible to find text types which have none of the features in one's definition list, and vice versa, types which have all the features, but are not text types.</p>
