      <p>The category 'text type' is indeed somewhat loose, though there is the common place that text types can be used for display, but not necessarily visa versa. For me the terminology is somewhat beside the point, and the interesting question is what qualities in a type design makes it highly readable for extended text at small sizes (roughly 9-12 point printed, similar visual angles on screen). By highly readable I mean can be read with high comfort, speed, and comprehension. </p>
      <p>Different types have different ideals as far as setting: size, leading etc., so this would need to be part of the study. But, contrary to Nick, I see no insuperable barrier to quantifying the combination of variables.</p>
