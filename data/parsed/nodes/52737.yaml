      <p>I read in a book from the 60's called "Physicological Study of Typography" and within this it said that Bodoni was the slowest of the bunch that they tested and people complained about it's illegibility because of the contrast in form. Whereas, Imprint was the fastest. The book also has charts of appropriate point-sizes in correlation to ages. The book also provided results of comprehension for the group of about 15 typefaces. I believe Imprint was again the best of the bunch. However, it wasn't completely a direct correlation of reading speed to comprehension. I'd have to get the book again to recall the rest of the results.</p>
      <p>This study also used Walbaum which, I believe, performed only slightly better than bodoni, but similar issues were brought up.</p>
