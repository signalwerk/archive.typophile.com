      <p>Your comparison with a violin in a way begs the question, because it implies that the question of which typeface to use is purely aesthetic. </p>
      <p>But the issue is whether there is such a thing as greater readability among text designs, which you declare as "nonsense". </p>
      <p>But you do concede that some faces need to be adapted to work better as text. </p>
      <p>I am arguing that some designs are better for readibility. To take your example of the violin. If you have one with a beautiful sound, but too soft to fill a concert hall, then it is not suitable for un-miked concert work, no matter what its aesthetic qualities. </p>
      <p>Fontesque has aesthetic qualities that makes it well suited to conveying the emotion of some messages, and not others. But I just don't think it would work that well for reading small, extended text. Has anyone ever set a novel in 11 pt Fontesque?</p>
      <p>Also your argument about 'typography' being readable, not fonts, begs the question as well. The question is whether the typeface, when well used as far as measure and leading, is readable in text. There is some flexiblity on the rules for what is a reabable text block, given the features of the type. But the flexibility is not infinite, and the rules are well known, and laid out, for example in Mitchell &amp; Wightman's Book Typography. </p>
      <p>Thus the fact that the readability of Fontesque is not an absolute and will vary with the context does not make your case. The point is that that variability is restricted, and even with modifications you have made for text, Fontesque will not be as readable as Goodchild when both are set for maximum readability. </p>
      <p>Denis, you don't address the issue of declining speed + comprehension as a measure (an inverse) of readability. Will pushing readers to read for a long time on difficult material show up differences in readability that the robustness and adaptability of our perceptual apparatus would otherwise mask?</p>
