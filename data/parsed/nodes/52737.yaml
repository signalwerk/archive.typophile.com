      <p><strong>Denis</strong>: how one defines “text font” [is critical]. the usual definition is “suitable for setting large blocks of text”.</p>
      <p>I think that's an unusual definition, but thanks. Normally, text refers to length not size, and to type not text, and to reading not setting. I will continue to think of it as "type composed suitably for reading a text", and I often add where applicable, "which the reader cannot see the end of from the beginning."</p>
      <p><strong>Me</strong>: <em>And I know one could make something on purpose.</em> <br>
      <strong>Denis: </strong> Please, please, this is a tease. Tell us how! </p>
      <p>I've given you a specific suggestion for piecewise non-linear word-shape busting. There is only one face better at slow-down in this class of eye-beater. <em>Someone</em> could even take Courier, and piecewise non-linearly replace the word space, fijlmrt and w, <em>and then </em>you can test Courier against its better self! And if that's too complex, use Letter Gothic, which could be even slower against it's better self.</p>
      <p>Besides that, "how-to" retard reading is a topic with such a vast range of anti-relevance to our work, it's too simple: Reader-ability? Give tiny kids Einstein's theory of relativity; Output? Give 'em Cleartype@96 dpi; Composition? Use Word or Photoshop; Type selection? See the Sung &amp; Schwartz study. Any one of these meta-varibles can be used to effect the results of "reading" studies, and each has hundreds, some say thousands of variables, while yet others have millions and billions of variables.</p>
      <p>Why do you think there are so many fonts to choose from?</p>
      <p>Cheers!</p>
