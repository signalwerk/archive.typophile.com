    * <a href="www.typodermic.com/vinylcurtain/" target="_new" rel="nofollow">The Vinyl Curtain: A Conversation with Jess Latham and James Arboghast</a><br>
    * <a href="http://en.wikipedia.org/wiki/User:James_Arboghast" target="_new" rel="nofollow">Wikipedia user page for James "Arbo" Arboghast</a><br>
    * <a href="http://en.wikipedia.org/wiki/History_of_western_typography" target="_new" rel="nofollow">History of Western Typography at Wikipedia</a></p>
