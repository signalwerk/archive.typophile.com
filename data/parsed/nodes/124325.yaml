    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sleeper_4764.jpg"></div><p></p>
    <p>Hello type experts. I've been a fan of typophile for many years, but recently joined. </p>
    <p>I'm trying to find the typeface used in the poster for Woody Allen's Sleeper. An isolated version is attached, and you can view the original poster here:<br>
    <a href="http://www.impawards.com/1973/sleeper_ver1.html" title="http://www.impawards.com/1973/sleeper_ver1.html">http://www.impawards.com/1973/sleeper_ver1.html</a></p>
    <p>This could be completely custom, or at least I believe the swashes are. Any clues or guesses would be appreciated.</p>
    <p>Thanks for your help!</p>
