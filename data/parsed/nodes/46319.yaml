  html: |-
    <p>I am currently working on a booklet on the decay of the city I live in. More to the point I am trying to catalogue and reference all the commercial spaces that are currently vacant and trying to establish statistics on types of commerces most likely to fail and where they will.</p>
    <p>It's all very unscientific right now but in the upcoming weeks I will be discussing this with various local historians.</p>
    <p>The city in itself has a big industrial past that is now dead. It's the city of Mulhouse in France and if I didn't know any better I'd compare it to a city affected by the rust belt syndrome.</p>
    <p>After this lenghty but necessary introduction, I am now stumbling on a typeface selection. I am utterly clueless about french typography especially anything related to this city in particular ( they used to make textile here ... books aren't a big thing in the history of this city ).</p>
    <p>Any ideas?</p>
    <p>I wanted to use Francesco - Franck Jalleau <a class="freelinking external" href="http://www.culturesfrance.com/adpf-publi/folio/lettres/a034.html" rel="nofollow">http://www.culturesfrance.com/adpf-publi/folio/lettres/a034.html</a><br>
    but it isn't commercially available.</p>
