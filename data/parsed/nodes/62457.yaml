    <p>My friend made this.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/lettres_de_jane-600_4804.JPG"></div><br>
    It says "Bubbles lie" in calligraphy and "Calligraphy lies" in bubbles.<p></p>
    <p>1. What's this type of thing called called?<br>
    2. Where can I find other examples of this?<br>
    3. Are there any resources on technique in creating these?</p>
