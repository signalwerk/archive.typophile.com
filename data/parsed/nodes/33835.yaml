    <p>Hello, This is my first post on the forum.</p>
    <p>Im a graphic design student (Year two), AUT University, Auckland, NZ.</p>
    <p>I have an indentity assignment, "Atlantis" - Aquarium.</p>
    <p>Currently its set in Baskerville.<br>
    I have Mrs Eaves, and was hoping for some possible ligature combinations, there are none.<br>
    I no this probably means that there is no need, But damn, Mrs eaves ligatures are beautiful! </p>
    <p>What are some possible combinations that you can think of? be they decorative or functional?</p>
