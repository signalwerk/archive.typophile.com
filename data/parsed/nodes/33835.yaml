      <p>Half of the fun of being a student is just coming up with some crazy stuff. The good part about it is there are no wrong answers, as long as they make sense. Check out this simple ligature: <a href="http://www.underconsideration.com/brandnew/archives/love_at_first_glancia.php" title="http://www.underconsideration.com/brandnew/archives/love_at_first_glancia.php">http://www.underconsideration.com/brandnew/archives/love_at_first_glanci...</a></p>
      <p>It is beautiful and subtle. I think you could go with either extreme ligatures or subtle but I see combinations between the A+t, t+l, a+n, t+i, and the i+s. So, almost every letter could have a ligature. Don't go overboard, no pun intended, but see which combinations work the best in whatever typeface you end up using. Baskerville is a nice typeface to experiment in so have fun!</p>
