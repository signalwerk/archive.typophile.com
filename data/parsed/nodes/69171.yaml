  html: |-
    <p>Hi all,<br>
    I came accross a Slab Serif, which Q is like the TheSans prior to the open type version.<br>
    The Q of TheSans (old version) used to have the "tail" detached from the rest of the body and it look like an eyebrow at the bottom of the Q, just like this Slab Serif.<br>
    Can somebody help me identify it?</p>
    <p>Thanks so much,</p>
    <p>Patty</p><div class="imageWrap"><img src="http://typophile.com/files/QC_4102.gif"></div><p></p>
