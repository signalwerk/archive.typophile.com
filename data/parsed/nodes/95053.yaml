    html: |-
      <blockquote><p>who on earth did ever WAIT for a PARTICULAR face to come?!!</p></blockquote>
      <p>Well, I believe that to <em>ideally</em> typeset any given job, the font does not exist; what people do is compromise and [hopefully / try to] choose the <em>one</em> font that does exist and does the job better than any other. So to me it makes total sense for somebody to exclaim "Eureka!" when he sees a particular font (and this could be a font that was just released, or even under development).</p>
      <p>And this isn't just hypothetical: when Emily Artinian started looking for Latin and Armenian fonts to set "From Ararat to Angeltown"* she became stuck. When she bought Nour&amp;Patria she said it was the only typeface that could do what she needed.</p>
      <p>* <a href="http://www.vampandtramp.com/finepress/a/emily-artinian-ararat-L.jpg" title="http://www.vampandtramp.com/finepress/a/emily-artinian-ararat-L.jpg">http://www.vampandtramp.com/finepress/a/emily-artinian-ararat-L.jpg</a></p>
      <p>hhp</p>
