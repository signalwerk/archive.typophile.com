      <p>If you want a large x-height, sure, but then make the descenders shorter.</p>
      <p>Concerning originality: I have to agree with Nick, including about wasting time (something I consider our most valuable resource - I tend to even get religious about it). And I would offer the following "antidote" to the Warde-ian "transparency" business: just because a layman can't spontaneously see differences in fonts doesn't make them the same. Or: <em>Nothing</em> is really transparent to the human unconscious.</p>
