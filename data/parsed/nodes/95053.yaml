      <p>The matter of darkness is a worthy concern, surely. But I never actually thought about that with any of my typefaces. I think, one has achieved by time a kind of subconcious sensibility for the proper weight of a text face in 10 points on the printed page of a book.<br>
      However, my thoughts guiding me towards that attempt have been of another sort.<br>
      I would never be so bold to claim that anyone may be waiting for this. (who on earth did ever WAIT for a PARTICULAR face to come?!!)<br>
      No.<br>
      But if there would be something sensible in the design, I’d wonder why this face is not always out there.<br>
      Or is it – ?</p>
      <p>sorry for my ignorance.</p>
