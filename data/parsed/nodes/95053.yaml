    html: "<p>Andreas, it's impossible for me to evaluate a text font without looking at it on paper in a multi-page document. Looking at a snippet, enlarged, on a screen just doesn't do it. But... Holy Hannah, this is one dark font! That's the kind I like. And it reads very well, as far as I can tell from the screen snippet. The ascenders/descenders look fine to me. The \"fi\" in \"figure\" looks good enough for me to say: no ligature needed. I realize it's a work in progress, but to my eye the spacing of \"Pe\" in the first word and \"pp\" in appeals looks a shade too wide. My big picture opinion: This might be one of the dark, twenty-first century book text faces we've been waiting for.</p>"
