      <p>A lot of interesting points, especially about scale.</p>
      <p>However, I disagree that "...We are also seeing a gradual return to typeface design being a team enterprise ... the sheer volume of work required for text typefaces have driven a growth of mid-size foundries."</p>
      <p>It seems to me that the 21st century has seen an explosion of entrepreneurial one-person foundries. A mid-sized foundry is a bit of a misnomer, as all foundries are small. Is the Reading course more geared to production workers than entrepreneurs and original-typeface designers? It would be interesting to know the whereabouts in the type industry of the majority of former students.</p>
      <p>I also don't believe that the origin of a type design is a brief. How about "a crazy idea that just might work"?</p>
      <p>(Sorry for not pursuing this on Ilt, I'm just more comfortable here.)</p>
