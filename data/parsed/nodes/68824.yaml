      <p>Nick: <em>It seems to me that the 21st century has seen an explosion of entrepreneurial one-person foundries.</em></p>
      <p>This is something that began in the last decade of the last century, and it is some of those foundries that have now grown into what I think are fairly called mid-size foundries -- in the relative scale of things --, in which the owners or senior designers collaborate with a number of design and technical employees. Hoefler &amp; Frere-Jones is a good example of such an evolution.</p>
      <p>[At Tiro, we took a somewhat different direction, creating a network of associate designers with whom we collaborate on specific projects.]</p>
