      <p>Reading a script, in my view anyway, is not about reading letters, but reading words, and if a designer doesn't have personal access to that psychological processing of proficient readers, I wonder if a designer isn't at a critical disadvantage. </p>
      <p>For example, I believe all of the most popular typefaces in Israel were designed by Hebrew readers. David H., is this correct? I also was struck by the critical remarks of Satya Rajpurohit on Devanagari designs by students who don't read the script.</p>
      <p>I sure an excellent designer with study of the script can do a good job, but I wonder whether reading proficiency is not a big advantage.</p>
