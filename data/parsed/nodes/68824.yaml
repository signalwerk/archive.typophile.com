      <p>Mark,</p>
      <p>Bringhurst wrote that "A script in itself is not a language" (voices, languages and scritps around the world, Language and Culture).</p>
      <p>I think that the question is not if the designer does not know the language, but mainly what the designer does to overcome this obstacle. So, when Gerry writes that "a typeface arises in response to a brief, which by definition taps into wider design problems" I think that he missed  an important aspect:  a script is not  an OpenType font, nicely done.</p>
      <p>I would expect to read that the first task by the student would be to learn the history and culture of that specific script, or language, explore different historic resources e.g. MSS, old-old books, talk &amp; meet native speakers. So the brief or any design problem related to that script is secondary. </p>
      <p>When we say that a specific non-latin design is  successful, then the question is successful by whom? by native speakers?</p>
      <p> Moreover,  I don't agree with this statement: "the  examples are so numerous it would be difficult to choose." On the contrary let's examine the examples.</p>
    html_clean: |-
