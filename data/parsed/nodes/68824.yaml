    html: <p>What I intuit from my attempts at designing both non-latin scripts and glyph sets in languages that I do not read is that I am more tentative about deviation from what I have seen. I am less tentative about Greek than I am of Cyrillic because I spoke Greek as a child albeit not well. I even feel less confident in pushing the envelope with certain diacritics like cedilla or ogonek. I don't think it is not that I don't READ the language but I have yet arrived at the "Plato's Republic" level of "seeing forms" with those diacritics but now that I have been at it for 6 years, I feel much more confident than I used to at my first  attempt in 2004. Increased confidence in other scripts and languages is mostly thanks to numerous interactions here on Typophile or offline with willing teachers like Maxim, Filip, Miguel, Adam, Gerry, and Klimis.</p>
