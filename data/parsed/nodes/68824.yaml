      <p>Bill: <em>I sure an excellent designer with study of the script can do a good job, but I wonder whether reading proficiency is not a big advantage.</em></p>
      <p>There are a lot of crap typefaces designed by native readers of any writing system -- including plenty of Latin examples --, so I don't think reading proficiency can be counted as a <em>big</em> advantage or, indeed, a critical skill in type design.</p>
      <p>Further, I can't read German or Spanish or Navajo or Wolof or the overwhelming majority of language written in the Latin writing system, but that doesn't prevent me from designing typefaces that are readable in those languages. [Note that this is a different matter from designing typefaces that are culturally appropriate to the typography of those languages in particular places.]</p>
      <p>Since you mention Satya's earlier remarks, it is worth calling to mind that some of the most famous and celebrated Indian typefaces were designed by someone who was illiterate even in his own language.</p>
