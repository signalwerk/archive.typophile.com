      <p>David, I was just throwing in a little extra context for you about Gerry's perspective, not picking nits. After all, that brief article wasn't a detailed explanation of how teaching and research at Reading work — that would be a different and much longer thing — but just an overview of some themes that have emerged over the years.</p>
      <p>Designing type for a script you can't read or write is really, really tricky, and it definitely involves a lot of research and enough modesty to realize how much you rely on the feedback of others with a better feel for it. But it can be done — and done well — by designers who take the time and care to learn how a script works and then add to that the less script-specific understanding of how to get letters to work as type.</p>
