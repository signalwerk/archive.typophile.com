    <p>You may have seen this story featuring a bad font choice... </p>
    <p><a href="https://web.archive.org/web/20081007161715/http://news.bostonherald.com/localRegional/view.bg?articleid=183275" title="http://news.bostonherald.com/localRegional/view.bg?articleid=183275">http://news.bostonherald.com/localRegional/view.bg?articleid=183275</a></p>
    <p><cite>Labbe said the small Freeport, Maine, agency that prepared the ad, Marketing Angel, pitched the concept as a banker from the Wild West. Calls to the agency were not returned.</cite></p>
    <p>...reminds me somewhat of a scene from Blazing Saddles.  </p>
    <p>Perhaps it’s because I’m an outsider, but I find many Credit Union ads racially offensive - maybe because they push the fact that they the “for locals run by locals” - unlike real banks.</p>
    <p>Si</p>
