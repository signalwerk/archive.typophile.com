      <p>"GX would have tied the two companies together inextricably."</p>
      <p>Bill</p>
      <p>Like Apple's development of TrueType for Microsoft tied them together inextricably? I don't think so. As I recall only one third party software application supported Apple's QuickDraw GX (Adobe certainly did not, though I do know they were developing fonts for it, just in case; saw the work during a visit). </p>
      <p>Thus far, OpenType doesn't come near the possibilities of GX, though we have heard about OT's possibilities for some many years now. Beyond expanded character sets and cross-platform capability though, what exactly does OT offer that even comes close to GX? Serious question.</p>
      <p>Gerald</p>
