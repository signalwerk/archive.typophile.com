      <p>Re OT features supported by Quark 8 but not by InDesign, simply literally follow the instructions in the Fontlab manual to create f-ligatures, generate, and the features will work in Quark but not InDesign. </p>
      <p>This is not OT design at a high level, but it is what happens when you RTFM and follow the instructions. This may be one of those elsewhere-documented cases where the feature works in CS2 but not in CS3.</p>
      <p>I guess it didn't really matter when InDesign was the only program that supported OT. Even early on, though, there were complaints about inconsistent OT support between Indy, Illustrator, and Photoshop.</p>
      <p>But now we have three major programs - - InDesign, Quark, Word -- which all support OT completely differently. (Leaving aside for the moment the rest of CS and the fact that IndyCS2 supports OT differently than IndyCS3)</p>
      <p>The answer is common code, consistent across platforms and applications. But how can we try to sell Adobe on that when Adobe has spent six or seven years building CS into a virtually OS-immune fortress with proprietary rasterization solutions -- perhaps wisely, perhaps not? And how can we sell Microsoft on that when Microsoft isn't interested in supporting any of the advanced OT typography features -- yet? Yet, these are the two companies, with their completely different agendas, that co-operated to create OT in the first place.</p>
      <p>Thomas, I am perfectly willing to admit that I could have been wrong, and that we would all be miserable had we let Apple handle advanced typography for both Windows and Mac as almost happened in the mid-90s. Maybe it truly would not have worked out. Maybe it would be much worse than what we have. (Like maybe Apple would have ditched GX in 1998, leaving it on Windows, while going its own completely independent way. No, that doesn't seem likely. GX would have tied the two companies together inextricably.)</p>
      <p>But given OT's current complexity, and the inevitable fact that it will increase in complexity with time, and given Microsoft's intractable opposition -- thus far -- to supporting advanced typography features in OT fonts, I think the only rational way forward is to adopt a common code/common feature model as base theology for OT and evangelize it -- or make it attractive enough that everyone will adopt it for selfish reasons. </p>
      <p>Otherwise, each succeeding release of Quark and InDesign will support OT differently, each doing some things better, some things worse. And users will be confused and alarmed. And other app developers will steer clear.</p>
      <p>The goal for OpenType should be that all OT fonts work all the time, all the same, everywhere. And I'm reasonably sure you share that belief. But how to make it happen?</p>
      <p>And shouldn't this be another thread?</p>
