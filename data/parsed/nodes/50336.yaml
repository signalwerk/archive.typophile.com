      <p>Hey Christian</p>
      <p>Working with DTP since 1992, starting up with pagemaker, onto Quark and now Indesign, I really don't see a choice for you. I know all the buzz about Quark 8 being the "Indesign killer" but the facts are that Indesign was the Quark killer. Besides my own studio I often get pulled in on freelance jobs in the advertising industry in Europe and It's been years since I've even seen people work with Quark. Is it coming back, bigger and better? No doubt, but will Indesign stay on top in this race, no doubt either. People have changed to Indesign now - this took a while - and I don't think they will go back! So if you are looking for the industry standard, I would in a heartbeat choose Indesign. Have you seen the new CS4? It's amazing. Some of the places that Quark is better now is newspaper production, but that is about it. In my opinion anyway!</p>
      <p>If you have some experience with pagemaker, Indesign will be the natural next step. And Don't even get me started on prices and level of service.</p>
      <p>I feel though that you are leaning against a Quark solution and don't let me scare you of. I would choose Indesign, but you might be just as happy with Quark 8.</p>
      <p>Good luck to you Christian</p>
