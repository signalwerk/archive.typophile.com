      <p>Christian, Typophile is not the place to go to if you want objective opinions about Quark v InDesign. Typophile has a preponderance of users who are developing or very interested in using the still-buggy and badly-supported OpenType format. InDesign won these pioneering and long suffering users' hearts by supporting OpenType long before Quark did. (At that time, in the rest of the world, nobody knew or cared what OT was. That is still largely true. But not here on Typophile!) </p>
      <p>Now let's look at a couple of myths:</p>
      <p>&gt;The typography in InDesign is superior</p>
      <p>Tell me Adam, what about InDesign typography is superior? </p>
      <p>Is it the 'optical kerning' that totally destroys every well-constructed font that passes through it by wantonly changing the interletter spacing of every letter combination except OO?</p>
      <p>Is it the cynical 'optical justification' feature that hurls hyphens, dashes and quotation marks out of the margin like orphans into the storm? </p>
      <p>Is it the poorly implemented, uncustomizable paragraph composer which unintelligently impairs lines at the expense of paragraphs? </p>
      <p>Is it the fact that InDesign won't support OT features created by your company's own Fontlab that are fluently supported by Quark 8? </p>
      <p>&gt;the native integration of Adobe’s native file formats (PDF, Photoshop PSD, Illustrator AI, EPS) is also a plus for InDesign.</p>
      <p>Who was first with advanced Photoshop PSD support? Quark, or Adobe? Paradoxically, it was Quark, three years ago.</p>
      <p>Quark 6.5 let you view, show and hide both channels and layers, and blend opacity and transparency modes; and map the psd's alpha and spot channels to inks within the<br>
      QuarkXPress Project (good for special processes such as varnishes or bump plates), enable/disable Adjustment<br>
      Layers or change their effect by editing their opacity,<br>
      or blend mode enable/disable Layer Masks. By contrast,<br>
      InDesign didn't then offer any layer or channel con-<br>
      trol at all. </p>
      <p>In areas that are important to ad-based workflow, Quark's transparency features are vastly more fluent, and its image-editing features now do a substantial proportion of what you would need Photoshop or Illustrator for. </p>
      <p>As for customer support, Quark earned a mind-boggling amount of resentment for its support policies about a decade ago, but in recent years, the weight of the evidence seems to be that Quark's support has consistently been superior to and cheaper than Adobe's. These things ebb and flow. Adobe for years had better tech support; no doubt it will again, when it perceives there is a competitive advantage that would be worth the investment. But that time isn't now. </p>
      <p>What I object to most with InDesign is the assertion of 'fine typography' strengths. These are based on features like optical kerning and optical alignment that on close inspection turned out to be valueless. However, the issues are subtle and it took most users several years to realize that they actually weren't working. That might have been acceptable in a 1.0 or 2.0 product. But at 5.0 or 6.0? It simply shows Adobe's cynicism. Hurl the features out there. Don't worry about what they actually do. </p>
      <p>I'm sure I'll be flamed for making these remarks here, but not by those weary InDesign users who have tried to get optical kerning and optical justification to work.</p>
