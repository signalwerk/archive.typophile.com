      <p>I know type has multiple uses nowadays. Placing pixels on a monitor. Printing out a newsletter on an laser printer. All I can really speak to is printing, where the purpose of setting type is to take an author's words and a designer's layouts to enable the printer to make a plate. What's *best* boils down to "how good is the plate?" Not much else matters.</p>
      <p>Perhaps a couple of stories will show the importance of the Quark versus InDesign question, at least, when the use of a printing press is the end result of setting type.</p>
      <p>1. I made a lot of money in the 1990s and early 2000s because I didn't use Quark or PageMaker. When someone needed to set, say, vowels with macrons, or set a language like Navajo, Kiowa, transliterated Arabic, Chinese, Devanagari, etc. etc. etc., Quark and PageMaker users floundered about. Best they could do was make up fonts with the needed characters mis-named. We used TeX. We could write any encoding vector we wanted. The names of the characters in the typeset file were correct. You could search for them as unique strings. (things were name-based in those days).</p>
      <p>The first and most important job of the typesetter is getting all the words spelled correctly. If you cannot set the needed character, you cannot spell the word correctly. The easier it is to set the right character, the better off you are; the easier you can do searches in revised proof, the better off you are.</p>
      <p>So the biggest and best *feature* of OpenType is that it allowed Unicode to be brought to the PostScript Type 1 font. The rest is just a matter of comfort food.</p>
      <p>2. Quark (or PageMaker &amp; InDesign) didn't &amp; still don't allow the control *for setting type* that TeX did. We use to quip to new comps that with TeX, the good news was you could make up any typesetting routine you wanted; the bad news was you had to. (Color management is a different matter.)</p>
      <p>All the built-in features of a program usually get in the way of other features. You could argue that what killed PageMaker (the first serious DT layout program) was it had been patched so many times with new features that it was buggy, &amp; impossible for a programmer to go back &amp; straighten things out. This will likely happen to both Quark &amp; InDesign down the road.</p>
      <p>"Ease of use" or "built-in features" are usually a two-edged sword.</p>
      <p>* * *</p>
      <p>I was on a panel at a AAUP Production Managers meeting in 1996. A Quark user on the panel said that the most important issue with Quark was it allowed you to archive all your work in that format. I asked what he'd used for an archival format before. "Compugraphic" he said.</p>
      <p>* * *</p>
      <p>As was said earlier in this thread, if you use the applications program that most of the other people in your particular area use, you probably haven't made a mistake. You'll have no advantage over them in setting type, but unless you are seeking an advantage setting type -- as opposed to, say design -- So what?</p>
