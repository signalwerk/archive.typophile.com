      <p>It's funny to hear that people consider Quark "the underdog". Adobe launched InDesign in the time of the absolute dominance of Quark, and it was InDesign that was considered "the underdog" — but InDesign conquered the market quickly. The first versions were too slow because the computers were not powerful enough, but these days the performance is not an issue anymore. The typography in InDesign is superior, the native integration of Adobe's native file formats (PDF, Photoshop PSD, Illustrator AI, EPS) is also a plus for InDesign. </p>
      <p>And if you learned PageMaker before (as I did), you will find InDesign a bit easier to use than Quark, as it's closer in the concept (many people who originally created PageMaker later went to develop InDesign). </p>
      <p>These days, it seems that InDesign is leading the way and Quark tries to follow. </p>
      <p>Adam</p>
