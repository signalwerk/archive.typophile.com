      <p>&gt; Tell me Adam, what about InDesign typography is superior? </p>
      <p>The quality of composition in pretty much any European language other than English delivered by InDesign CS3 greatly beats Quark 8 (English is only my third language so it does not interest me that much). </p>
      <p>Whether it's German, Polish, Czech, Russian or Greek, the results delivered by InDesign's paragraph composer are far superior and more pleasing than those made by Quark, which even in the international Passport version always produced poor hyphenation and justification, especially for languages outside of Western Europe. </p>
      <p>And yes, optical kerning may not be a good idea for the languages for which many Western fonts have been well-fit for (English, German, Dutch, perhaps French) but the vast majority of European languages (say Basque, Portuguese, Slovak, Czech, Swedish, Finnish, Latvian, Estonian, Hungarian etc.) may actually benefit from InDesign's optical kerning even in well-made fonts, because the default kerning in those fonts often only takes into account combinations that occur in a handful Western languages, sometimes only in English. </p>
      <p>It seems to me that Quark's typographic composition engine is strongly specialized on one language out of world's hundreds of mainstream languages (so it's a kind of a one-trick pony), while InDesign's typographic engine is far more universal -- even though the regular "international" edition of InDesign performs well only with European alphabets, and for Japanese, Chinese, Arabic or Hebrew one needs a specialized edition. </p>
      <p>Regards,<br>
      Adam</p>
