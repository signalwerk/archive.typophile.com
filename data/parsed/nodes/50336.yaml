    <p>I've decided to learn DTP. Although I don't absolutely *need* it in my work life at the moment, I'm quite sure that having DTP skills can't hurt in any field. I don't mind the financial outlay, but if I can save some money, all the better. </p>
    <p>We have InDesign CS 3 (or now 4?) to choose from and Quark 8 (which has turned out to be pretty good according to general opinion.)</p>
    <p>Long ago I learned PageMaker, and even before that (as a kid) I actually used GeoPublish on the Commodore64!</p>
    <p>Today I'm the happy owner of quite a few wonderful licensed fonts, and I'm especially happy with Farnham, Dolly (paired with Auto, of course), and Feijoa. These deserve all the respect they can get, so I'm particularly interested in excellent OT font handling. In place of the tragedy that is MS Word (with respect to typography specifically, no offense) I have been using Mellel, which is a breath of fresh air but still not as competent with OT handling as a DTP app would be. </p>
    <p>I understand that InDesign is the more fashionable choice these days, and although I wouldn't mind a copy of Photoshop, I really don't need the rest of the apps that come with the Creative Suite. While Quark seems to be more relevant than in the past few years and has been dubbed the "InDesign killer" recently, I'd like to use something that is and will remain and industry standard. I might as well  make the most of my experience. Perhaps Quark is a real contender again . . . </p>
    <p>I use a Mac running OS X Leopard. RAM and speed is not an issue.  </p>
    <p>I'd appreciate any insight and suggestions.</p>
    <p>Cheers, </p>
    <p>Christian.</p>
