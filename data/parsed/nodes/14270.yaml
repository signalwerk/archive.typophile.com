    html: <p>I’m going to say that it’s “lettering”; that is to say a bit of custom type and not a typeface. Why? Because the “x” is symmetrical, the bar of the “t” is heavier than one might expect, and the crossbar of the small cap “h” is also heavy. It all says “constructed” to me. I’ll be surprised if it’s actually a font.</p>
