      <p>@riccard0 - Thanks so much, that was quite speedy!</p>
      <p>@frode - my intent was to create a highly condensed set of characters that would be very quicky distinguishable when compacted into a block or string; it is used as the basis for coding a digital world that overlays physical reality, a sort of protege to the internet in the world i am creating. In essence it is less related to the linguistic alphabet than it is to binary code.<br>
      The shapes were more an aesthetic choice, however that is an interesting point about the geometric logic; I hadnt run into that theory regarding arabic numerals before.</p>
