  html: |-
    <p>Im looking for someone willing to help me out by creating a font for the alphabet I designed for a work of fiction I am creating. The alphabet, tenatively titled "Deca," is numeral based; meaning that there is one "letter"corresponding to each number 0-9. Attached is the layout.</p>
    <p>I need a font version of this alphabet so that I can insert the characters into the graphic novel I am creating; the font only needs these characters replacing the numerals, no accompanying custom letters necessary. If anyone is interested in helping me do this I'd be grateful. I can provide vector files for the characters.</p>
    <p>Thank you.</p><div class="imageWrap"><img src="http://typophile.com/files/deca_5138.jpg"></div><p></p>
  html_clean: |-
