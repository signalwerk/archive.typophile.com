      <p>According to the type together web site" Spore is a three weight typeface family created exclusively for the Elecronic Arts life simulation hit computer game, Spore.The typeface was based on the Spore logo, a round and playful design, and is being used in all of the Game's communication and brandingmaterial. Veronika collaborated with Pete McCracken, owner of Plazmfonts on this project. The Spore logo and game assets were created by Cinco Design."</p>
      <p>See more here:</p>
      <p><a href="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=2700&amp;id_section=141" title="http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_content=2700&amp;id_section=141">http://www.type-together.com/index.php?action=portal/viewContent&amp;cntId_c...</a></p>
      <p>The font does not seem to be available for license yet.</p>
