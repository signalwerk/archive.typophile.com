      <p>The Navy link <a href="http://www.doncio.navy.mil/ContentView.aspx?id=4462" rel="nofollow">Toner-Efficient Fonts Can Save Millions</a> (March 8, 2013) is still working and according to it those fonts can save up to 30 percent over Arial.  One of the three GSA approved fonts is Century Gothic. And  in the  Wiki article on <a href="http://en.wikipedia.org/wiki/Century_Gothic" rel="nofollow">Century Gothic</a>, it is written that the University of Wisconsin-Green Bay has found that Century Gothic uses about 30% less ink than Arial, but that the font uses more paper so that the savings are offset by increase in paper costs. The reference is a newspaper clip. I could find no serious reference and no quantitative analysis whatsoever.</p>
