    html: |-
      <p>A serious analysis should consider all the relevant parameters. At fixed point size (since that value is to be 11 points), and without condensing the font, there are two obvious parameters left: x-height, and contrast.</p>
      <p>Obviously, a sans with low contrast wastes more ink than a contrasted font where  strokes are thinned here and there. Less obviously for the layman, but probably more significant, is the effect of the x-height. Here are Arial (large x-height, low contrast), Times New Roman (medium x-height, medium contrast) and Mona Lisa Solid ITC (small x height, high contrast) all at the same point size.</p>
      <p><img src="/files/parameters_4796.png" width="100%"></p>
      <p>We are now left with an optimization problem provided we know the right objective function (the thing you want to optimize); that can't just be the amount of ink.</p>
      <p>And I did not even consider an additional parameter: hinting. Is it not possible to make a truetype font that is good to read on screen and that saves ink when printed (especially if all the reports end in drawers anyway).</p>
