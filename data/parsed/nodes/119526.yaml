    <p>The U.S. Government has started a campaign to reduce print costs: PrintWise. Step 7 of their action plan states that ‘one of the three toner-efficient fonts’ should be used. Those fonts are Times New Roman, Garamond and Century Gothic. </p>
    <p>You can read the 'Seven Steps to Lowering Print Costs' here:<br>
    <a href="https://strategicsourcing.gov/sites/default/files/uploads/seven_steps_to_lowering_print_costs_within_90_days_guide_vjune2012_0.pdf" title="https://strategicsourcing.gov/sites/default/files/uploads/seven_steps_to_lowering_print_costs_within_90_days_guide_vjune2012_0.pdf">https://strategicsourcing.gov/sites/default/files/uploads/seven_steps_to...</a></p>
    <p>They even used Garamond and Century Gothic for the campaign logo:<br>
    <a href="https://strategicsourcing.gov/sites/default/files/uploads/printwise_logo_full_color_1200px.jpg" title="https://strategicsourcing.gov/sites/default/files/uploads/printwise_logo_full_color_1200px.jpg">https://strategicsourcing.gov/sites/default/files/uploads/printwise_logo...</a></p>
    <p>Undoubtedly the amount of Word documents set in Garamond and Century Gothic have grown by the thousands or even millions due to this campaign.</p>
    <p>What do you think of this campaign? Are these fonts actually ink saving?</p>
