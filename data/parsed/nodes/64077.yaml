    <p>Fellow members,</p>
    <p>I’m looking for some advice to pick the right type to set a book with. The book is an anthology of articles about activism.</p>
    <p>The idea is to mimic the publications from the Situationist International, which was a primarily French movement from the 1950’s and 1960’s. What would a French typographer from that period typically choose for body text? And no, I will not use Avant Garde ;-).</p>
    <p>The style of the situationist is very lo-fidelity, cut’n’paste and much like an underground newspaper. It’s rather elitist and cares little about optimizing for such things as legibility.</p>
    <p>What would you go for?</p>
    <p><a class="freelinking-external" href="http://en.wikipedia.org/wiki/Situationist_International">Here’s a link for some context on Wikipedia</a></p>
