      <p>That sure is an interesting project!<br>
      The problem is twofold: for one, if all you want is to mimic the typographic choices of a french publication from the early sixties, you risk to end up with something bland (as in the example shown in the page you linked)*.<br>
      The most important side, though, is that in so doing you would betray the very spirit of situationism.<br>
      Situationism is about what works <em>now</em>. It’s about subverting conventions and conventional wisdom. And using them to attain a political goal. Art is the primary political weapon of the situationists.<br>
      A trivial suggestion would be, for example, setting an article about animal rights/anti-fur activism using the poshest didoni** available. </p>
      <p>* Which, to tell the truth, is italian, but you got the point.<br>
      ** <a href="http://typophile.com/search/?keys=fashion%20magazine" title="http://typophile.com/search/?keys=fashion%20magazine">http://typophile.com/search/?keys=fashion%20magazine</a></p>
