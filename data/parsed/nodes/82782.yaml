      <p>A quick addendum: for mac-only fonts the file extension won't be helpful since it isn't required, though anything ending in .suit is almost certainly mac only. Fonts ending in either .ttf (TrueType/TrueType-Flavoured OpenType) or .otf  (CFF/Postscript-Flavoured OpenType) should be cross-platform.</p>
      <p>Your better bet, though, is to use the Finder's 'Get info' command and look at the first line of info (Kind). You'll want something which says either 'Windows TrueType font' or 'OpenType font'. If it says 'Font Suitcase' it won't work on a PC.</p>
      <p>André</p>
