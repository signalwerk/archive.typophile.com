      <p>If you're talking about the version of ITC Bodoni which ships with many Macs as part of either iLife or AppleWorks (on older systems), then it is indeed Mac only since it is a font suitcase. You'll be able to find cross-platform versions (i.e. OpenType) from all the usual sources, for example:</p>
      <p><a href="http://www.linotype.com/618096/itcbodoni-clan.html?q=&amp;subviewmode=PACKAGES&amp;pid=listview&amp;page=0&amp;pagesize=50" title="http://www.linotype.com/618096/itcbodoni-clan.html?q=&amp;subviewmode=PACKAGES&amp;pid=listview&amp;page=0&amp;pagesize=50">http://www.linotype.com/618096/itcbodoni-clan.html?q=&amp;subviewmode=PACKAG...</a></p>
      <p>André</p>
