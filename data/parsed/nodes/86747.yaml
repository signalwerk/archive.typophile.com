      <p>Yeah, my avatar is the bold italic ampersand from my <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a>. I don't know if Caslon was the first one to do this style. Probably not, and he certainly wasn't the last, but is the best known. The larger sizes are higher contrast and more curly. There isn't one single design, even in the originals of Caslon. The curves on mine were kind of inspired also by the old fashioned baby "pram" in England.</p>
      <p>Unfortunately, I can't identify the ones above.</p>
