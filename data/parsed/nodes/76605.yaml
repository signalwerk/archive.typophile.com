      <p>Claire, I suggest you ask your client some questions before you start designing the wine label. Here are some that came to my mind after a couple of glasses of wine:</p>
      <li>Is this an expensive wine being marketed to connoisseurs, or an inexpensive wine aimed at impulse buyers?</li>
      <li>Will the wine be sold mainly in the region where it's made, or is it meant for export?</li>
      <li>Is the region where the wine is made part of the branding strategy? (Think of the kangaroo on the label of Yellow Tail wines from Australia.)</li>
      <li>Is there something unique about the wine that you want to communicate to buyers? (For example, "Our grapes are organically grown" or "Our winery has been in the same family since 1810").</li>
      <p>These questions will tell you who the audience is that you're trying to reach, and what message your client wants to send to them. Once you know those things, picking a font will be much easier.</p>
