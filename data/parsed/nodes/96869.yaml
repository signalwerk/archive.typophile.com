      <p>— Chris<br>
      A valuable source for Adrian Frutiger’s opinions about his own typefaces (in their past and current versions) is this book <a href="http://" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">http://</a> (everything you ever wanted to know about Frutiger’s typographic designs, including the bits you never cared about). But maybe Bert knows about other sources.</p>
      <p>— Nick</p>
      <blockquote><p>Anyway, it doesn’t matter what the designer thinks, our taste and opinions are not the same as those of type users, even when we like the same thing, which can be for quite different reasons.</p></blockquote>
      <p>My point exactly : as a contemporary graphic designer, with a <cite>graphic design</cite> culture<br>
      (<cite>i. e.</cite> made of graphic design artefacts designed with specific versions of specific typefaces), I still think the “old” digital version of Univers has its own merits, on account of the valuable work done with it during the past 25 years by a number of estimable graphic designers (another example ? Pierre Mendell’s unforgettable posters for the Bayerische Staatsoper).</p>
      <p>— Hrant<br>
      Univers was originally designed for the Lumitype phototypesetting system (which Deberny &amp; Peignot had financed), which could easily accomodate the 16° slope. Things got tricky when the rights were sold to other foundries or manufacturers of typesetting equipment with different technical limits : the slope was changed to 12° to make Univers available on Linotype’s Linofilm machine, for instance.</p>
