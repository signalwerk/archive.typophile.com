      <p>— John<br>
      I agree with you that there could indeed be a consensus amongst <cite>type designers</cite> that the “old” digital version of Univers is inferior to the original metal versions (foundry type, Linotype or Monotype hot-metal) ; it doesn’t make it less iconic in <cite>graphic design</cite> culture (<cite>i. e.</cite> end-user culture), on account of the “quite-recent-but-already-classic” works I listed in my previous comments (all these works were indeed done with the “old” digital version).<br>
      Please bear in mind that I <cite>didn’t</cite> mention iconic works (by Armin Hofmann, Emil Ruder, etc.) using the original metal Univers — these works can’t be emulated anyway since the typographical material and technology they used are no longer with us.</p>
