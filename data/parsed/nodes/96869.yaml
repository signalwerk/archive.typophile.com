      <p>@ Karl Stange</p>
      <p>Mmh… It hadn’t struck me that the work done by Willi Kunz for Columbia University School of Architecture with the “old” digital Univers, for instance, had suffered from an “absence of alternatives”.</p>
      <p>I do agree with you, though, that the decision to use this or that version of ANY typeface is down to the users themselves — but I don’t want to underestimate the game of influences and PR played by large digital foundries towards the graphic design community either.</p>
      <p>Finally, although I have the deepest respect for the creative people working at Linotype (the incredible Akira Kobayashi, for instance), Linotype DOES indeed present itself as a single entity (remember “Home of the Originals” ?) when dealing with the buying public. And this single entity has for years positioned itself as a haven of good typographic design while, at the same time, marketing and selling fonts that were simply not up to par.</p>
