      <blockquote><p>But could you call it 'better'? More to the point, would Linotype? It seems they wouldn't go that far. The interview between Frutiger and Friedrich Friedl here... <a href="http://www.linotype.com/1813-15552/podiumdiscussionuniversisaclassicalty" title="http://www.linotype.com/1813-15552/podiumdiscussionuniversisaclassicalty" class="link-external">http://www.linotype.com/1813-15552/podiumdiscussionuniversisaclassicalty</a>... has Friedl calling the 'old' (he means the original, 1957 version) Univers 'perfect'. With Linotype Univers, they "took it further."</p></blockquote>
      <p>You’re right, they’re not going as far as pretending that the “new” digital Univers is better that the original <cite>metal</cite> one. What they’re doing, however, is criticize the original <cite>digital</cite> Univers (the one graphic designers had been using with such success since the beginning of DTP) — which <cite>they</cite> had marketed and sold as a faithful version of Adrian Frutiger’s original design for more than 25 years !</p>
