      <p>I did some work with Selectric typesetting in the 1970s; sure, it was a bit rough compared to real typesetting, but it was incredibly empowering.</p>
      <p>The typesetting of <em><a href="http://www.flickr.com/photos/reinvented/4609340187/lightbox/" rel="nofollow">The Last Whole Earth Catalogue</a></em> (the bible of the Counterculture) was done with Selectrix. A revival of Selectric Univers, in particular, if it captured that slightly off-kilter quality of the original would, to my mind, evoke the optimistic spirit of the technology in that era. </p>
