      <p>Thought this thread had died, only to find it resurrected!</p>
      <p>Otmar, thanks so much for your inside knowledge on Univers. It certainly does help clear up some of the mysteries of the 'old' digital Univers, such as the ampersand. How could anybody complain about Frutiger's lovely 'Et'? It's one of my favourite features of Univers, and a reasons why I regret having purchased a few weights of the old version.</p>
      <p>As an employee of Linotype, I'm not sure you'll feel inclined to answer the following, but I'll ask it in case you do (indeed, if anyone has any insights on this)...</p>
      <p>What was the deal with Berthold Univers' disappearance from the marketplace? I believe it was a favourite of some Univers officianados (such I Willi Kunz, I think). I know there was some kind of legal dispute, but I wondered why Bitstream still sell Univers (albeit by another name - Zurich), yet Berthold has withdrawn it's offering. Anyway, thought I'd put that out there.</p>
