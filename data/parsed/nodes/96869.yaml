      <p>— David<br>
      When a big, ancient, well-respected, reputable, dignified type manufacturer rolls out its marketing steamroller (as Linotype did with the launching of every typeface included in their Platinum Collection), it’s very hard for the average customer to resist the suggestion that he should discard the “old” version of a typeface to adopt the “new and improved” one. Especially when the argument comes loaded with endorsements from the original designer (if still available) and/or various luminaries from the type and graphic design communities.</p>
      <p>Could the fact that you call these <cite>original</cite> versions “Alternative” be interpreted as a symptom of an interesting perceptual shift ? The “new and improved” versions <cite>are</cite> the (sometimes welcome) “alternatives”, not the other way round…</p>
      <p>By the way, the only reason these “old” versions don’t usually disappear from the typefoundries’ catalogues is that they can still contribute to make these very catalogues look thicker and richer (also a marketing ploy, by the way).</p>
