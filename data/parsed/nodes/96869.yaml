      <p>— Hrant<br>
      I’ll try to make myself clear in spite of my struggling English writing — so please be clement.</p>
      <p>Technical constraints are not arbitrary when they’re part of a design brief — from a design point of view (not limited to typeface design — think furniture, architecture, etc.), a solution which meets <cite>all</cite> the requirements of the brief can hardly be bettered (although it can be equaled) <cite>within the same parameters. </cite> If you remove the technical constraints, you also change the brief, and you end up with a completely new design – which I think cannot be compared fairly with the “old” one, because it exists on a whole different plane.</p>
      <p>Now, about Sabon : Tschichold himself didn’t think that Sabon had been <cite>handicapped</cite> by the technical constraints imposed by the Linotype and Monotype typecasting systems — on the contrary, he was proud (and rightly so, in my opinion) of the way he had met these particular requirements of the original design brief. Respecting this singular design solution’s integrity is not “misplaced reverence” — you’re absolutely entitled to design another sixteenth-century-inspired text typeface <cite>within contemporary technical parameters</cite> (and that’s precisely what Jean-François Porchez did with Sabon Next), it will simply not be Sabon anymore.</p>
