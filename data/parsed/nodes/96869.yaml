      <p>We can argue about the meaning of "arbitrary" (and I can point out that "fair" does nothing for me) but it's probably better if I instead say it this way: although there is no design without constraints, some constraints are stupider than others, often resulting in unacceptably inferior results. For example if I ask a right-handed person to write with his left hand the results will be Bad. And it's not the fault of the person writing - just like Sabon's flaws are not Tschichold's fault (in fact he's rightly commended for balancing the compromises beautifully).</p>
      <p>Most of all, and practically speaking, <em>when a constraint is removed</em> sticking to it is very rarely beneficial to the end-result.</p>
      <blockquote><p>it will simply not be Sabon anymore.</p></blockquote>
      <p>Maybe (although I will note that Sabon is not Sabon much more often than that). BUT: it will be Better.</p>
      <p>hhp</p>
