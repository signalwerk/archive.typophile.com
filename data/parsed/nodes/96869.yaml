      <p>-Celeste<br>
      "New and improved" is a wonderful term for the marketeer, because it offers the promise of a better product, without necessarily providing criteria for how the claim may be proved (well, with regard to "improved" anyway). To be fair to Linotype, they did provide such a criteria in their rationale for a new Univers. (Here... <a href="http://www.linotype.com/1813-15545/whyanewunivers.html" title="http://www.linotype.com/1813-15545/whyanewunivers.html">http://www.linotype.com/1813-15545/whyanewunivers.html</a> ) Which, on the face of it, seems to be to provide more weights, with careful attention paid to how the weights relate to each other, and also to redraw all the weights for "...improved legibility and on-screen application." Also implicit in their documentation is to make Linotype Univers follow Frutiger's original designs more closely.</p>
      <p>By these criteria, they seem to have had some success. There certainly are more weights (!), and there are features of Frutiger's original designs which made a comeback, such as the numerals, the ampersand and the increased angle of the oblique.</p>
      <p>But could you call it 'better'? More to the point, would Linotype? It seems they wouldn't go that far. The interview between Frutiger and Friedrich Friedl here... <a href="http://www.linotype.com/1813-15552/podiumdiscussionuniversisaclassicaltypeface.html" title="http://www.linotype.com/1813-15552/podiumdiscussionuniversisaclassicaltypeface.html">http://www.linotype.com/1813-15552/podiumdiscussionuniversisaclassicalty...</a> has Friedl calling the 'old' (he means the original, 1957 version) Univers 'perfect'. With Linotype Univers, they "took it further."</p>
      <p>Yet, it is remarkably easy, when dealing with twentieth century typefaces like Univers or , to ask which is 'better', as I did in my original question. I'm not sure we would measure the various cuts of Garamond against each other in quite the same way. I see that, like dealing with typefaces such as Garamond or Bodoni, it's not quite so simple as that.</p>
    html_clean: |-
