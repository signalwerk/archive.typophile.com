    <p>I am having some trouble discerning the better digitization of these three typefaces.</p>
    <p>There do appear to be some differences in them, not withstanding the face that Linotype Univers and Univers Next offer a far greater number of weights than Univers, as well as the more desirable ampersand; the cut (so to speak) appears different. Both Linotype Univers and Univers Next seem to have more modulation in the strokes, and Linotype Univers 430, which I assumed to be an equivalent to Univers 55, seems, well, heavier!</p>
    <p>Also, any idea which is closer to Frutiger's original design?</p>
    <p>Any help appreciated.<br>
    Iain.</p>
