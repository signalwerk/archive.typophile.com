      <p>Linotype Univers and Univers Next have been marketed by Linotype as “closer to the original design” and endorsed as such by Adrian Frutiger himself — indeed they show some traits which were absent from the previous digital version (the ampersand, the slope of the italics, etc.).</p>
      <p>In my opinion, the real questions are : considering that designers have for decades been using the “old” digital version, hasn’t this one become a classic in its own right ? Who can decide (Linotype ? Adrian Frutiger ?) that the “new” versions should be preferred ? And how can Linotype dare to pretend that they care about typographic quality when they have been selling for decades a version of Univers which presented “obvious flaws” (their words) — which the “new” version supposedly corrected ?</p>
