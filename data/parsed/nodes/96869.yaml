      <p>This question of “different doesn’t equal better” is precisely why I’m always deeply suspicious of recurrent marketing claims about “new and improved” versions of classic 20th-century typefaces — be it Sabon or Univers (the original topic, remember ?).</p>
      <p>Not to mention the fact (that I already stressed) that the “flawed” versions have more often than not become integral parts of the graphic design canon (<cite>i. e.</cite> the culture of the end-users of typographical tools). Which makes the repeated marketing attempts to wipe them out with “new and improved” versions akin to utter contempt towards these very users : “we know better, and you should trust us because you don’t have a clue, and the reason we know  that you don’t have a clue is that for years we’ve been selling you flawed versions and you’ve used them no matter what, you morons !”.</p>
