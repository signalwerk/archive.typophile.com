      <p>Indeed it is because I wouldn’t consider Comic Sans (or Papyrus, for that matter) as “classics” that I took care to narrow my argument to <cite>(professional) graphic design</cite> uses — as a graphic design teacher and critic, I’m particularly interested in how graphic designers (this strange tribe) envision the typographic tools they use, how they choose them, how their perception of them is informed (and by what factors). I’m deeply convinced, for instance, that certain historic, iconic and/or high-profile <cite> professional</cite> uses of certain typefaces have made them classics <cite>within the graphic design canon</cite>.</p>
      <p>The problem I have with the latest digital versions of Univers is that they significantly differ from the one which, by virtue of its use by the likes of Willi Kunz, Angus Hyland (the “Pocket Canons” series) or Werner Jeker (and all the designers who ever worked for the Kieler Woche during the past 25 years), has become a point of reference within the collective culture of graphic design professionals. In this respect, the fact that these “new and improved” versions are supposedly closer to Adrian Frutiger’s original drawings from 1954-1957 seems irrelevant to me and doesn’t make them more vital (desirable, compulsory, etc.) than the “old” digital version.</p>
      <p>Thank you for your support about my written English — I'll try to amend my overuse of all-caps setting, I promise.</p>
