      <p>@hrant:<br>
      It is quite correct that Sabon was subject to technical constraints.</p>
      <p>It was constrained to meet the lowest common denominator of Linotype and Monotype. So the italics were spaced exactly the same as the Roman (as Linotype required) and the letters were all constrained to have widths belonging to the Monotype 18-unit system.</p>
      <p>These constraints set limits to the design, and doubtless they did impair the aesthetic quality of the result - at least <em>slightly</em>.</p>
      <p>But when you ask why a digital revival of Sabon should have the same metrics... then, despite agreeing with you up to this point in principle, I part company.</p>
      <p>Given that Jan Tschichold did a good job of preventing Sabon's aesthetic qualities from being too gravely impaired by these constraints, do you <em>really</em> think that a net improvement is the most likely result of some newbie font designer at Adobe being given a free hand to change the metrics and the design as he sees fit?</p>
      <p>It isn't necessarily reverence for the <em>technical constraints</em> in Sabon that leads people to consider, based on the principle that a good typeface is a beautiful set of letters, and not a set of beautiful letters, that Jan Tschichold's work of making all the letters in the typeface into a harmonious whole ought not to be tossed out the window in hopes that <em>a different type designer</em>, now working under fewer constraints, could produce a better result than he did.</p>
      <p>It isn't the constraints we want to keep: it's Jan Tschichold's artistic touch and vision in the final phase of integrating the typeface we want to keep, and we despair of preserving that while throwing away the constraints.</p>
