      <p>While Adrian Fruitger's original drawings aren't a point of reference for the ultimate readers of books or advertisements, I can indeed see people rejecting, at least in the case of Times Roman, the current digital version, as opposed to the versions by Linotype and Monotype in the hot metal era, as the "standard" that people recognize.</p>
      <p>That the same might be true of Univers, leading to a conclusion that digital type is still in its infancy, and lacks subtle qualities of grace and beauty - or some other characteristic - generally present in the hot metal era does not strike me as wildly improbable.</p>
      <p>The good news is that there's every chance this lack has the potential to become a "recognized quality" - there's no royal road to designing better types, but this could be something any competent type designer could learn not to overlook. (Or it could require cooperation from others, such as adding other types of curve instead of just Bézier curves to the font technology.)</p>
