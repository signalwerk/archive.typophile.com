      <p>Incidentally, the Selectric Composer provides an illustrative example of how a variety of typeface designs fare when subjected to a similar (but more severe) set of constraints than those to which Sabon was  subject.</p>
      <p>1) Type elements contained only 88 characters, and so the same unit system applied to Roman, Italic, and Bold weights of every typeface.</p>
      <p>2) The device employed a 9-unit system. However, this was <em>not</em> twice as coarse as the Monotype 18-unit system; instead, most letters were assigned widths comparable to those used for Times Roman, scaled down from 18 units to the em to 11 units to the em.</p>
      <p>3) Hence, the letters m, M, and W were narrower than they should have been to be in the correct proportion, being 9 units wide rather than 11, in order to fit on the type element (it being desired to support type sizes up to 11 points, and to use the same basic type element as used in normal Selectric typewriters).</p>
      <p>I just thought it would be worth citing this example in this thread, as comparing Press Roman to Times Roman, and so on, might give a benchmark for the potential impact of technical constraints on Sabon, and how well Jan Tschichold did in overcoming them.</p>
      <p>EDIT: Oh, yes - here's the link</p>
      <p><a class="freelinking external" href="http://ibmcomposer.org/joomla/index.php?option=com_content&amp;view=article&amp;id=54&amp;Itemid=56" rel="nofollow">http://ibmcomposer.org/joomla/index.php?option=com_content&amp;view=article&amp;id=54&amp;Itemid=56</a></p>
