      <p>Celeste, it's interesting that you mention that the 'old' digital version of Univers (used well, I think, by Willi Kunz, etc.) has become the point of reference for new graphic design professionals.</p>
      <p>Part of the motivation for asking my original question was an admiration for Otl Aicher's use of Univers in his Munich '72 work (which is on display in the café in London's Design Museum, by the way!), way before any digitized versions were to appear, and in my opinion, much more attractive than the first digital version of Univers.</p>
      <p>Just a side point: I said in my original question that Linotype Univers 430 seems heavier than Univers 55. I meant the opposite. LT Univers 430 seems lighter. Just thought I'd correct myself.</p>
