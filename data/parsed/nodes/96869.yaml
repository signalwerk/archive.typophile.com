      <p>— Bert<br>
      The limitations introduced by duplexed Linotype matrices were indeed integral parts of the <cite>design program</cite> for numerous historically important 20th-century typefaces (all the newspaper faces designed under Chauncey H. Griffith, or Dwiggins’ Electra) — remove these limitations and what you have is <cite>another</cite> typeface (which you’re free to find more beautiful, but not <cite>better</cite> from a design point of view).</p>
      <p>The original digital Sabon followed very closely the version designed by Jan Tschichold to conform to <cite>both</cite> Linotype and Monotype technical limitations — and that was, in my opinion, a perfectly valid choice when it comes to the integrity of this landmark of type design history.</p>
      <p>— Iain<br>
      Don’t try to ask digital typefaces for Christmas or birthday gifts — people will look at you funny. I know it, I’ve tried it once — “What do you mean, you’d like FF Legato as a present for your 35th birthday ?” (yelled my mother in disbelief).</p>
