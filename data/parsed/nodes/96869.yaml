      <p>Celeste: "...it’s very hard for the average customer to resist the suggestion that he should discard the “old” version of a typeface to adopt the “new and improved” one."</p>
      <p>Nevertheless, it's your choice, and few if any ancient or modern false claims, are breaking your arm. If resistance is futile, I suggest it's your opportunity to vote with your pocketbook on design and not Linotype's rapacious greed. </p>
      <p>"...the only reason “old” versions don’t usually disappear from the typefoundries’ catalogues is that they can still contribute to make these very catalogues look thicker and richer (also a marketing ploy, by..."</p>
      <p>While I agree that catalog thickening occurs with more versions of families, digital distribution thins this to a great extent to the thickness of your screen, and I'm not entirely certain the marketing department likes more versions, in print or on screen, as much as they like more families, and versions addressing specific typographic rather than generational uses, not to denigrate the latter in any way. But the bottom line for any sane marketeer, says the average user most likely prefers one version.</p>
      <p>I might also suggest, though I am not at liberty to detail, that there are other more important marketing issues involving the profit margins, that keep multi-versioning going in many foundries, and though I know nothing of Linotype's details, this is an important aspect of some font marketing. </p>
      <p>You, may have the last word, and I thank you for your opinions.</p>
