  html: |-
    <p>Can anyone recommend a good photography forum? </p>
    <p>The ones I’ve found so far (such as photo.net) seem to have a lot emphasis on the technical aspects of photography, to the expense of the “art” side.<br>
    I percieve the readership of this forum to be technically strong, but also with a great sense of design. So I’m looking for a photography forum of a similar veign. </p>
    <p>Any ideas?</p>
