      <p>Blue Vinyl's Print Clearly is a fine freeware school type, but sadly does not have a tail on the "q" or an alt for the "y".</p>
      <p><a href="http://www.fontspace.com/blue-vinyl/print-clearly" title="http://www.fontspace.com/blue-vinyl/print-clearly">http://www.fontspace.com/blue-vinyl/print-clearly</a></p>
      <p>And, for your type-education, the less stylised "a" is termed "single-storey".</p>
      <p>-NJ</p>
