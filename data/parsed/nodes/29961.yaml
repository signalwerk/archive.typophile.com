    html: |-
      <p>Default pairing examples as used in typography lectures:</p>
      <p>Didot/Futura</p>
      <p>Clarendon/Helvetica</p>
      <p>Grotesque/Old Style</p>
      <p>Century/News Gothic</p>
      <p>Script/Typewriter</p>
      <p>Blackletter/Humanist Sanserif</p>
      <p>These are very general purpose and simply used to illustrate the principle; I'm also pretty sure there is a thread on this...</p>
      <p>BTW, Ryan, if you're a design student then you'll know that Ellen Lupton's 'Thinking with Type' uses a combination of</p>
      <p>Thesis/Scala</p>
      <p>while Bringhurst's 'Elements of Typographic Style' uses a combination of</p>
      <p>Scala Sans/Minion</p>
      <p>and of course, has a whole section on this topic at p.93</p>
