    html: <p>Hang on, I don't think I was entirely clear on which width you're trying to manipulate. Do you mean the number of horizontal pixels used to fill the glyph, or the total number of pixels in the advance width of the glyph (including sidebearings)? The latter is more problematic, because ClearType in GDI typically renders glyphs using <a href="http://msdn.microsoft.com/en-us/library/aa480221.aspx#wp_topic6" rel="nofollow">"compatible widths"</a> that match the advance widths of black and white / grayscale rendering. While it's possible to <a href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035734" rel="nofollow">query whether compatible widths or "natural widths" are being used</a> (and alter the hinting program accordingly), it's not possible to change the rendering mode from the within the font. So unless the GDI program has been set to use natural widths, the advance width of a ClearType-rendered glyph will always be the same as Standard smoothing.</p>
    html_clean: <p>Hang on, I don't think I was entirely clear on which width you're trying to manipulate. Do you mean the number of horizontal pixels used to fill the glyph, or the total number of pixels in the advance width of the glyph (including sidebearings)? The latter is more problematic, because ClearType in GDI typically renders glyphs using <a href="http://msdn.microsoft.com/en-us/library/aa480221.aspx#wp_topic6" rel="nofollow">"compatible widths"</a> that match the advance widths of black and white / grayscale rendering. While it's possible to <a href="http://www.microsoft.com/typography/cleartype/truetypecleartype.aspx#Toc227035734" rel="nofollow">query whether compatible widths or "natural widths" are being used</a> (and alter the hinting program accordingly), it's not possible to change the rendering mode from the within the font. So unless the GDI program has been set to use natural widths, the advance width of a ClearType-rendered glyph will always be the same as Standard smoothing.</p>
