    html: |-
      <p>&gt;<em>I think the dependency is on a document's contents first.</em></p>
      <p>I don't follow how the contents of a document would have any effect on compatible/natural widths. It was explained in <a href="http://www.typophile.com/node/62675#comment-373519" rel="nofollow">an older thread</a> that the widths mode is set by the application, not changeable by the font program.</p>
      <p>&gt;<em>Again, I'll say that CT does not use x direction hints, which width altering instructions among the ignored hints.</em></p>
      <p>If that's always the case, then it should be easy enough to hint a glyph in such a way that its advance width is one value with Standard smoothing (which follows x-direction hints), and a different value with ClearType (since it ignores those hints). Problem solved. Except that GDI apps default to using compatible widths, making the advance widths identical between Standard and CT rendering. Thus, if the advance width of the glyph is altered through hinting, that altered width does in fact get carried over to ClearType when rendered using compatible widths.</p>
      <p>In any case, it's possible for a hinting program to query for ClearType rendering, and to query for compatible widths mode, and to limit the application of hints based on such conditions. That <em>may</em> provide enough flexibility to create a font that achieves the original goal, though not as easily as one might have hoped.</p>
