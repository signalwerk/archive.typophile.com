    html: |-
      <p>In the hinting process, the advance width and the em are rounded  before the hints are applied. Then the hints are based on the pre rounded solutions to em ht and set width. The instructions then can reference the rounded width to prevent the hints from smudging the glyph. The hints can also be used to change the widths and if they do, this is stored and may be referenced  in the horizontal device metrics table, per size. I don't know any thing that would change the width after the hinting, but if chaos is desired, as seems the case, it could be unwisely done. </p>
      <p>&gt;For example, you could apply a delta to move a point a certain distance, but only if the current rasterizer was using "black and white" rendering.</p>
      <p>Simon says not on windows, the only place it'd matter.</p>
