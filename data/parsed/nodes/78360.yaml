    <p>Let me ask the question first and explain the context after that.</p>
    <p><em>Is it possible to hint TTF in a way that would make a glyph render 1 pixel wider (at certain pixel size) than its unhinted version?</em></p>
    <p>This is in the context of trying to reliably tell ClearType and Standard anti-aliasing apart in the confines of the HTML/CSS/JavaScript. </p>
    <p>I figured out how to do it in Firefox and Chrome. In the IE I can detect CT in some cases, but not always and this relies on using Flash, which makes it am untidy hack. Here's a <a href="http://typophile.com/node/77635" rel="nofollow">thread</a> where it all started.</p>
    <p>One option that I'd like to explore is making a custom single-glyph TTF font and then hinting for ClearType so that the glyph would render with a different width depending on whether the CT is enabled. This difference can be detected by CSS and so I have my solution. </p>
    <p>I have very rudimentary undertsanding of hinting, and I am looking for a simple "yes, possible" / "no, not possible" guidance. If it <em>is</em> possible, I will look into the hinting subject at detail and figure things out.</p>
    <p>Thanks</p>
