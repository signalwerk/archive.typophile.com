  html: <p>Hi, new here but have just spent about an hour and a half looking through loads of threads, some of the ideas here are amazing! <br>Anyway, I'm in the process of designing a portfolio site for myself to bring some of the work I've done together to try to push for a new job. The site is called optonica (does not mean anything, just like the word!). So far what I've got I'm not really happy with, I just think its a bit boring. I think the word optonica really lends itself to something special, it feels like a very 'designey' word if you know what I mean.  <br>So, below is what I got (the bigger one is just to give you an idea of context and colours), please can I have some thoughts. Thanks in advance ;) <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/20958.gif" alt="logo1"> <br><img src="http://www.typophile.com/forums/messages/29/20959.gif" alt="incontext"></p>
