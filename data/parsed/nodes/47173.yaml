      <p>I have seen some debate on Typophile as to whether a typeface can have any national character. Perhaps if you give a bit more information on the feel you are trying to evoke you might get more targeted suggestions.</p>
      <p>Nevertheless, a standard suggestion would be to use something by an Iberian designer. If I associate something with Spain, it is a certain oldness and Baroque styling, so I might suggest Mario Feliciano's <a href="http://www.felicianotypefoundry.com/main/?page_id=22" rel="nofollow">Rongel</a> (taken from a Spanish model) or <a href="http://www.psyops.com/html/spec_debula.html" rel="nofollow">Caligrafia de Bula</a>. Perhaps also <a href="http://kimeratype.com" rel="nofollow">Lagarto</a>, <a href="http://www.fountain.nu/catalogue/lisboa.asp" rel="nofollow">Lisboa</a> (some <a href="http://vanarchiv.com/lisboa-introduction.html" rel="nofollow">new versions</a> are in the works, so you may want to <a href="http://vanarchiv.com/contact" rel="nofollow">contact Ricardo Santos</a> to see if they are available), <a href="http://www.myfonts.com/fonts/bitstream/fleischman-bt-pro" rel="nofollow">Fleischman BT Pro</a>, or <a href="http://www.myfonts.com/fonts/pampatype/borges" rel="nofollow">Borges</a>.</p>
