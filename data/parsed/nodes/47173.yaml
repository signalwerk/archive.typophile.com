    <p>Hi everybody,</p>
    <p>I will soon be starting a redesign of a logo + website. Please have a look at the <a class="freelinking external" href="http://www.pedros-paella.de" rel="nofollow">old website</a>. It's essentially a one-man catering company that provides Spanish paella dishes and everything that goes with it.</p>
    <p>What I'm looking for is a typeface that has a particularly "Spanish" feel to it. Can anybody recommend such a typeface? I've been looking at some Spanish art books, but couldn't find anything.</p>
    <p>Thanks for any input in this matter!</p>
  html_clean: |-
