      <p>Out of the list of Reed's suggestions, I'd go with, in order of just how old he wants things to look:</p>
      <p>Rongel (newer)<br>
      Fleischman<br>
      Lagarto (older)</p>
      <p>Rongel is a good bit more contemporary but looks a little bit more formal (as Fleischman borders on oldfashioned) so if it's a very formal restaurant I'd go with Rongel.  If a little less pricy of a restaurant I'd go with Fleischman.  Lagarto maybe as headers could work.  I definitely wouldn't use Lisboa, as it's called Lisboa for a reason, it perfectly captures that city but doesn't work for most any Spanish cities that I can think of (In general Portuguese design tends to be a bit lighter and rounder than that of Spain)</p>
      <p>If you want to go handwriting wise for anything in the style of Spaniards, the key things to note:</p>
      <p>dots over the I even when capital, the 1s look more like ^, the 9s look like gs, the 7 and Zz always carry the bar through them, and the tilde looks like a macron over the n.  The A often looks more like a delta (bottom left to top to bottom right and then a line either horizontal or diagonal to make the bar, butall in one stroke), the lowercase r often looks like an r rotunda (or a cursive r without the initial stroke, or a very small nob instead of the full stroke), the cursive f looks like an cursive esh, and the cursive z is like a print z with swoop and no cross (or a french 3).  And they don't use cursive capital letters (as I quickly found out as people couldn't read half the stuff I wrote).</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
