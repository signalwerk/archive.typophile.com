      <p>re-branding is not just about a new logo, it's much, much more. re-branding comes from internal change, not slapping a new logo on the front and hoping for the best.</p>
      <p>the concept is great (though IMO it needs to be more fun (based on the direction you've posted) – creating a sense of adventure and wonder – and more strongly reference retro).</p>
      <p>show the concept more developed (how about airline ticket price cards, packaged promo kits like airline food.)<br>
      or perhaps create several versions of the logo, as though it has changed over time and in different eras. making it tangible, tactile, playful...and you're on the way to a great identity.</p>
      <p>what a fantastic and fun opportunity.</p>
