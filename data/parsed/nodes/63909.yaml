      <p>The more information you can provide in an ID request the better. As a rule of thumb if you post something and don’t hear back within a couple of hours it has people stumped and a red flag should go up that it might very well be custom.</p>
      <p>From my experience handwritten type can be the most difficult and time consuming to pin down.</p>
      <p>eg. While searching tonight I accidently discovered a distinct aspect of a handwritten font that was requested over a week ago with no reply. It was just plain luck.</p>
      <p>————————</p>
      <p>BTW: Here’s an official answer regarding your ID request... right from Jessica Hische herself.</p>
      <p><cite>“Hi Jeff,<br>
      You’re correct, Culinary is indeed custom, based a bit on archer, which was used for the rest of the site. I only use fonts for tiny type or when I’m really short on time, so typically when you see something I’ve done all or most of the type is custom. Case closed! :)</cite></p>
      <p>J”</p>
