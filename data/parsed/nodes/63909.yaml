      <p>@ efthomas: That’s the beauty of this site... you don’t have to be a type expert to participate in the design or general discussion areas. Type ID isn’t easy and doing it before the likes of ’Jan’ and ’Akira’ is near impossible, unless they are sleeping.</p>
      <p>What happened to your previous post regarding this ID request? The one that you bumped every day with comments of shock that no one responded. The fact is I spent 30 minutes trying to help ID your request and it makes my blood boil to find out you chopped up the logo and sent us on a wild goose chase.</p>
      <p>How you could withhold vital information like the name of the company and their website is beyond me. Only when I questioned why information was withhold did the truth come out. And because of it we’re far closer to an answer.</p>
      <p>Just so you know, I found the designer through the ’About Us’ page on the Culinary Culture website and emailed Jessica Hische directly for insight on the typeface. Seeing her portfolio I’m leaning heavily toward this being custom. It looks like she draws type like this in her sleep.</p>
      <p>I will apologize if my tone has been a bit harsh in the eyes of some but look at it from the perspective of someone who devotes a ton of time helping others ID type.</p>
