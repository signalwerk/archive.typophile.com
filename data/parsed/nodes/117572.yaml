    html: |-
      <p>As for the nameplate -- the part that looks similar to Old English -- this was hand-drawn. <a href="http://www.typophile.com/node/19590" title="http://www.typophile.com/node/19590">http://www.typophile.com/node/19590</a> English Towne is a very rough approximation. In 1967 the New York Tunes adopted "Imperial" as the running text font. I don't know what it used before then.<br>
      Don</p>
