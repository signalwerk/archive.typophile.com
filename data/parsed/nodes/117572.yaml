  html: |-
    <p>Hello everybody. I have to recreate the entire front page of The New York Times from 1960 and I'm wondering if anyone here might know what they used to typeset the following:</p>
    <p>– the main headlines<br>
    – the date &amp; price etc in the masthead<br>
    – subheadings<br>
    – main body copy</p>
    <p>Thank you for any advice! </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tmp1A156_3989.jpg"></div><p></p>
