      <p>I have a couple takes on this...</p>
      <p>My first thought is that while the statement on Wikipedia may be true, it may have come about due to the lack of a dot-less "i" on early typesetting machines, thus forcing one or more tone accents to be added to a standard "i."</p>
      <p>My second thought is that Romanization and transliteration systems are designed to preserve the intent of the language in written form, and to make doing so easier, not harder. When using modern fonts, using a dotted "i" with accents falls into the realm of making things harder, not easier. (Romanization is the term I use when the system is the primary method for representing the language in written form, and transliteration is the term I use when it is a method represent the native script of a language using a different script, such as using the Latin script to represent Japanese.)</p>
      <p>Related to my second thought, consider Pinyin. It is the standard method of transliterating Chinese (in China), is sometimes seen with special forms of the "a" and "g" characters, along with a seemingly special form of the acute accent to represent the rising tone in which the bottom-left tip is heavier than the upper-right one. For the "a" and "g" forms, this convention follows the forms typically see in italic faces, although the face is upright. In any case, both of these convention-like characteristics clearly conspire to make Pinyin harder to use, thus violating one of the important attributes of a transliteration system.</p>
      <p>I guess what I am trying to say, in a somewhat round-about way, is that the statement on Wikipedia may be true and false, for the reasons I stated above. I have the TCVN 5712:1993 in my office, which may shed some light on this issue, but I suspect that it uses the dot-less "i" form.</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
