      <p>"The lowercase letter i should retain its dot even when accented" </p>
      <p>i don't known where it come from, but as a vietnamese, it's the first time i heard about it :-) and in Viet Nam, i never see this kind of typeface in any printed media (in fact, i've seen it 2-3 times in some very very old typeface).</p>
      <p>On Vietnamese diacritic design, i think that the type designer should understand how vietnamese words is constructed:<br>
      fisrt at all, there are 29 "basic" characters in alphabets list: </p>
      <p>a	ă	â	b	c	d	đ	e	ê	g	h	i	k	l	m	n	o	ô	ơ	p	q	r	s	t	u	ư	v	x	y</p>
      <p>and may be 9+1 "composite characters":</p>
      <p>CH GH GI KH NG NGH NH PH TH TR</p>
      <p>(in some old dictionary, it's considered as a independent character in alphabets)</p>
      <p>The Vietnamese words is build by composing Consonant (1 or more chars) + Vowel (single or composite vowel) <strong>and a tone mark (accent)</strong>. (this is the logic we learn to read, write Vietnamese!)</p>
      <p>By this logic, there are some notes:</p>
      <p>- There is only one accent. Someone considers Vietnamese as double accent language, but it's view of non-vietnamese speaking people.</p>
      <p>- The accent is for entire word, not for an individual character. This one is importance for legibility: the accent should be easy to be distinguished from another char because it'll be recognized individually: ề is not in alphabets list, normally 2 components of it will be read separately in 2 difference phrases. </p>
      <p>With this is reason, in my view, all of vietnamese-enable Adobe typeface (Minion Pro, Myriad Pro, Arno Pro, Garamond Premier Pro) is bad for Vietnamese (ex: Minion Pro in the image of blokland's post)</p>
