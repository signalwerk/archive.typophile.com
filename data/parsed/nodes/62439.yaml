    html: <p>I don't think I have ever seen Vietnamese text with the dot preserved when a tone mark is added. As Ken notes, there may at one stage have been technical limitations that did not support dotless i, leading to the belief among some users that the dot should be preserved. A parallel case to that would be the French typewriter that lacked uppercase accent, leading many people to the conclusion that accents are properly omitted on uppercase letters, despite the continuous evidence of 500 years of French typography and publishing. In these situations, I recommend looking for examples of older, handset typography, books from reputable publishers, and also good quality vernacular handlettering in signs etc. In the case of Vietnamese, you might also investigate what Alexandre de Rhodes SJ did with <em>i</em> when he invented the system.</p>
    html_clean: <p>I don't think I have ever seen Vietnamese text with the dot preserved when a tone mark is added. As Ken notes, there may at one stage have been technical limitations that did not support dotless i, leading to the belief among some users that the dot should be preserved. A parallel case to that would be the French typewriter that lacked uppercase accent, leading many people to the conclusion that accents are properly omitted on uppercase letters, despite the continuous evidence of 500 years of French typography and publishing. In these situations, I recommend looking for examples of older, handset typography, books from reputable publishers, and also good quality vernacular handlettering in signs etc. In the case of Vietnamese, you might also investigate what Alexandre de Rhodes SJ did with <em>i</em> when he invented the system.</p>
