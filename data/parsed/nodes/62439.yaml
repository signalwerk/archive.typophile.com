      <p>Hoang, let me see if I understand correctly what you're saying.</p>
      <p>Your example /ề/ is made of one letter and one accent. The letter /ecircumflex/ and the /grave/ accent are two components, not three. In the same way /ohorn/ is not just a separate vowel from /o/, but a separate vowel letter — the orthography just happens to look similar. Putting a hook on the vowel letter modifies the tone, and the letter /ohornhook/ is also two components, not three.</p>
      <p>Therefore, keeping the accents separate from the base letters, breves, circumflexes and horns is ideal.</p>
      <p>The examples with the grave to the left of the circumflex is not great because it makes the circumflex look like an accent.</p>
      <p>Is that right??</p>
