      <p>Thanks, Hoang. You cannot separate type design from language, and basic knowledge of how the Vietnamese alphabet works is essential for good design.</p>
      <p>I have some experience of transcribing Vietnamese proper names into the Korean alphabet, so I am familiar with the basic letters used in Vietnamese. Korean doesn't use tones, so we ignore the accents that mark tones altogether, just as tonal marks in Pinyin are usually ignored for transcribing Chinese proper names for the English language. But the transcription table between Vietnamese and Korean treats each of the basic Vietnamese letters separately, even those that look like accented variations of the same Latin letter. For instance, the Vietnamese "o" and "o horn" map onto different vowels in Korean.</p>
      <p>I am interested to hear you opinions on the accents in other designs that support Vietnamese, such as the SIL typefaces that you can see samples of in this thread. Are they acceptable? Could they be improved?</p>
