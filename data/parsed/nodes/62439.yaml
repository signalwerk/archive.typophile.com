      <p>I have some thing intriguing to report.</p>
      <p>I just opened TCVN 5712:1993, which is the Vietnamese standard for the legacy (non-Unicode) encoding for Quoc ngu (the name of the Latin-based Vietnamese script). The code charts for VN1, VN2, and VN3 encoding clearly show the use of a dot-less "i" for the characters that have accents above. But, and quite interestingly, the accompanying text uses a font that includes the dot. It is quite inconsistent. The body text consistently uses the dotted "i" form, but the headings are inconsistent. For example, the title for Section 6 includes the word "ki" with an acute accent, and the "i" is dotted. Then, at the top of page 7, the title for the VN1 code chart includes the same word, and in a similar font, but using the dot-less "i" form.</p>
      <p>Anyone want some scans?</p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br>
      <a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
