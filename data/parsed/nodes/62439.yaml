    <p>I found this on the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Vietnamese_alphabet" rel="nofollow">Vietnamese Alphabet page</a> on Wikipedia:</p>
    <p><cite>The lowercase letter i should retain its dot even when accented. (However, this detail is often lost in computers and on the Internet, due to the obscurity of Vietnamese specialty fonts and limitations of encoding systems.)</cite></p>
    <p>Can anyone confirm or falsify this odd state of affairs?</p>
  html_clean: |-
