      <p>Frank, there is sometimes a discrepancy between a language-specific diacritic form and a generic accent handling model. Much of the time, one knows the target language(s) for a font, but as one moves into larger fonts for widespread use one needs to start thinking about generic mechanisms for languages that one might not be aware of. Sometimes this means deliberately disabling language-specific diacritic forms as default representations, as in the SIL fonts, and relegating those forms to specific OT language systems. [Another approach would be an idea that Adam Twardoch put forward on the OT developer discussion list some time ago: register a generic language system tag, so that 'dflt' behaviour could still represent the majority or most common usage. So, for instance, the Vietnamese forms could be the default rendering, but a more generic mark placement would be accessible via this language system tag.]</p>
      <p>Another instance of this problem is the Czech and Slovak 'caron' diacritics that take an apostrophe-like form. These are the normal default forms for the precomposed Unicode diacritic characters, but what happens when a user wants a more generic representation, i.e. an actual hacek sign above a <em>d l</em> or <em>t.</em> Given SIL's global and minority language mandate, it makes sense that they favour generic accent positioning as a default rendering.</p>
