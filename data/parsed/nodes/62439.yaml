    html: <p>"... just as tonal marks in Pinyin are usually ignored for transcribing Chinese proper names for the English language."  While this may be true today, it is at least in part an artifact of the near-universal absence of the required characters from fonts (with most of the the exceptions being relatively-recent system fonts).  In very many contexts tones are essential for distinguishing pinyin syllables, including the very common surname 王 Wa2ng from another family name 汪 Wa1ng.  Hopefully, the shrinking of the planet and the spread of Unicode will allow us to improve our habits for rendering the languages of other peoples.</p>
