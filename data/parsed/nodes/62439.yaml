      <p>Sorry to go slightly off-topic, but I doubt that the diacritics and special characters used in scholarly transcriptions of languages that don't use the Latin script will catch on in everyday use.</p>
      <p>It's somewhat different for languages that use Latin-based scripts, including Vietnamese—in those cases, there exist unambiguous local spellings like Málaga, Düsseldorf, Chişinău, and Điện Biên Phủ. But there tend to be competing systems of transcriptions for languages that don't use the Latin script, and not everyone can be expected to easily determine which spelling is the most scientific. For everyday use it ultimately boils down to simplicity.</p>
      <p>Everyday use entails simplifying and ignoring important distinctions in the original language. Speakers of English or Korean will not feel the need to distinguish between 王 Wa2ng and 汪 Wa1ng when they are speaking their own language (indeed, the idea of tones distinguishing syllables will be foreign to most), so why go through the trouble of marking them differently, unless we assume a specialized audience?</p>
