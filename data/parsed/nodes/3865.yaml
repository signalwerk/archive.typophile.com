  html: '<p>Este espacio digital tiene como objeto  <br>contribuir al conocimiento de alfabetos a  <br>través de distintas modalidades de  <br>participación.  <br> <br>En Letras Latinas serán exhibidos ejemplos representativos del campo del diseño de  <br>fuentes, desarrollados en América latina. <br> <br>La idea que lo motiva, es establecer un  <br>intercambio entre los autores e interesados  <br>en el tema y estimular la producción  <br>tipográfica de los diseñadores  <br>latinoamericanos. <br> <br>Check out : <br><a href="http://tipografica.com/letraslatinas/" target="_top">http://tipografica.com/letraslatinas/</a></p>'
