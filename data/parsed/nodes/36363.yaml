    <p>Hello Typos.<br>
    We have a project on to design a website / publication for<br>
    a school of architecture.<br>
    BUT I’m quite stuck trying to come up with a nice<br>
    modern sans.<br>
    DIN’s too dry and Helvetica yawn...<br>
    But Univers is near but not quite.</p>
    <p>Any ideas<br>
    neo/modernism is the key word here</p>
    <p>thanks</p>
    <p>Mr Brown</p>
