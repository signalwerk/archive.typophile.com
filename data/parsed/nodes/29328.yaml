    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Fontcaster</strong></p>
    <p>A one person <a href="/wiki/foundry" class="freelinking" rel="nofollow">font foundry</a> which has designed Rattlescript, released by <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a>, the Aptifer Sans and Aptifer Slab, released by <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>, and Skilt Gothic released by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>.</p>
    <p>Fontcaster is run by <a href="/wiki/Marten%20Thavenius" class="freelinking" rel="nofollow">Mårten Thavenius</a>.</p>
    <p>-----<br>
    External links:<br>
    <a href="http://www.fontcaster.com" title="http://www.fontcaster.com">http://www.fontcaster.com</a></p>
