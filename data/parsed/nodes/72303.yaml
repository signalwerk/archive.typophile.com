    <p>We are proud to announce the release of <strong><a href="http://www.sudtipos.com/fonts/138" rel="nofollow">Condiment</a></strong>, the lastest Sudtipos addition to your typographic design recipes.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilecondiment_4917.jpg"></div><p></p>
    <p><strong><a href="http://www.sudtipos.com/fonts/138" rel="nofollow">About Condiment</a></strong>.<br>
    <strong>Condiment</strong> adds flavor to your design. The new font by Koziupa and Paul’s is prepared of powdered soft shapes mixed with brush-drawn letters and tasty alternates conveniently tucked into the OpenType programming (for those programs that support such functionality.) The font includes many alternates and support for Latin-based languages (Including Central European, Baltic, Turkish and Welsh).</p>
    <p>Did you know that we have a more active <strong>Sudtipos page @Facebook</strong>? Check <a href="http://www.facebook.com/sudtipos" rel="nofollow">www.facebook.com/sudtipos</a></p>
    <p>Visit<br>
    <strong><a href="http://www.sudtipos.com/" rel="nofollow">Sudtipos</a></strong></p>
