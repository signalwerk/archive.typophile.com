  html: <p>Has anyone had any problems with missing fonts in iOS Mavericks? I read about issues on an Apple forum. I probably need to upgrade soon. I am using FontExplorer, not FontBook. One forum suggested a converter program like FontXChange that converts fonts to Open Type but I'm really leery of messing with things.</p>
