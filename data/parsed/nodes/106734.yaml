    html: |-
      <p>The plot thickens.<br>
      Carolus is a Roger White font.<br>
      The provenance of his fonts is perhaps doubtful. See <a href="https://web.archive.org/web/20140713220659/http://typophile.com/node/71453" title="http://typophile.com/node/71453">http://typophile.com/node/71453</a>.<br>
      I wonder what the source is for Carolus?<br>
      If you could use substitutes, Testament CT, Solemnis, FF Lukreza, and Simeon AS are somewhat similar.<br>
      Don</p>
