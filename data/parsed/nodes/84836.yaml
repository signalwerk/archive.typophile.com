      <p>This is becoming rather delicious! The numerals are especially nice, and I love the 4. It may need a larger counter (you could thin the stem a little perhaps).</p>
      <p>A few other observations:</p>
      <p>/b/ is floating above the baseline. ('blind' in first para.) Or maybe it just needs more colour bottom left?</p>
      <p>Tail of /j/ is crashing into the baseline serifs ('enjoy' in the third para).</p>
      <p>/i/ and /r/ look dark. </p>
      <p>/s/ is a little too curly for my taste — I'd open out the terminals a bit more and let the counters breathe.</p>
      <p>1 might benefit from a wider head.</p>
      <p>6 looks a little squashed.</p>
      <p>/R/ is causing spacing problems with its outstretched leg, in the third para. I like the shape so perhaps it could just be rotated clockwise to bring its foot in slightly?</p>
      <p>The name suits the design, nice.</p>
