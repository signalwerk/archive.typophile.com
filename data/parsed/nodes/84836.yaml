      <p>I've added new pdf to the first post, showing where I'm at with the italics. At the moment there is no kerning in either Roman or italic and only preliminary spacing in the italic (I think I'm just about happy with the spacing in the Roman)</p>
      <p>I'm still looking closely at Plantin, but I've strayed further from it for the italic than I did for the Roman.  I wanted the weight of the italic to be pretty similar to Roman.  Plantin's italic looks a bit weedy to my eyes.  Uppercase is mainly slanted Roman with some exceptions (K, R, Q) and slight adjustments.</p>
      <p>Overall I'm pretty happy with it, but as always, and critique is greatly appreciated.</p>
      <p>Dave</p>
