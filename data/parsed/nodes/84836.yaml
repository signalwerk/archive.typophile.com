    html: <p>Just to be clear on this, I haven't opened Plantin and changed a few points.  I've made a new font from scratch for which proportions were influenced by Plantin and kerning has been imported from Plantin (for the time being - I will definitely change it because it doesn't fit my design as well as 'homemade' kerning would).  So I'm not trying to 'get away with' creating a new font quickly by modifying an existing one.  I will freely admit that spacing is not my strong point and to this end, I have looked at how other fonts space glyphs as a starting point.  There's obviously a lot more tweaking to be done on this one.  In the end, I dare say it will bear little resemblance to Plantin.  What do you think?  Is it looking derivative?  That is 100% not my intention.  I give credit to designers who make revivals but that's not my thing.  I think back to art lessons in school, where we would paint copies of old masters' works.  The teachers weren't trying to create a bunch of forgers, but to make us identify their techniques and learn from them.  That is what I'm trying to do here, but if appropriating similar spacing from pre-existing fonts is frowned upon, I'll simply keep the outlines and space them myself, for better or for worse.  I hate spacing so much I might even consider iKern.  Has anybody used this service?  What did you think?</p>
