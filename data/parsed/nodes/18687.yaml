    html: |-
      <p>Thanks, Mark, for correcting my “senior moment.”<br>
      Hmmmm… Blippo, Pump, ITC Bauhaus, which came first, that is, <em>after</em> the prototype created by Herbert Bayer of the Dessau Bauhaus in 1925?</p>
      <p>Looks like <a href="http://www.linotype.com/43306/blippo-family.html" target="new">Blippo</a> by Fotostar in 1970 (a “Linotype Original”)<br>
      </p><div class="imageWrap"><img src="system/files?file=blippo1.png"></div><br>
      then <a href="http://www.linotype.com/570/itcbauhaus-family.html" target="new">ITC Bauhaus</a> by Ed Benguiat and Victor Caruso in 1975<br>
      <div class="imageWrap"><img src="system/files?file=Bauhaus2.png"></div><br>
      and almost simutaneously <a href="http://www.linotype.com/90171/pump-family.html" target="new">Pump (ITC)</a> by Phillip Kelly in late ‘75/early ‘76.<br>
      <div class="imageWrap"><img src="system/files?file=Pump2.png"></div><p></p>
      <p>It’s a good thing we weren’t given only the lowercase “a, b” and “d” to ID from :-)</p>
