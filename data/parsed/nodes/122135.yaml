    <p>I spotted this amazing logo in München recently,<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Screen Shot 2014-12-22 at 9_6312.16.00 am.png"></div><p></p>
    <p>Doing some research I saw that their <a class="freelinking external" href="http://www.pi-news.net/wp/uploads/2011/05/M%C3%BCnchner-Merkur.jpg" rel="nofollow">current name plate</a> is not this one, and quite uninspiring</p>
    <p>Digging further back I found examples that are close and look like a condense Galliard, but are definitely not the same as the photo I took:<br>
    <img src="http://www.subsidiumev.de/upload_images/muenchner-merkur.jpg"><br>
    Notice especially the way the r hooks around in a brush-like or talon like manner in the photo.</p>
    <p>Any help is appreciated!</p>
