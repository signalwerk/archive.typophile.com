  html: |-
    <p>Hello,</p>
    <p>Recently I have bought CorelDraw 8 Academic box in a local secondhand bookshop for a few Swiss Franks. It comes with tons of Bitstream fonts. I like especially several and want to use them for correspondence - briefs/writings (up to 5 pages) to local authorities, organizations, etc. </p>
    <p>The fonts I want to use:</p>
    <p>(Caslon Old Face)<br>
    (Charter BT)<br>
    Classical Garamond (Sabon)<br>
    Elegant Garamond (Granjon)<br>
    Galliard BT<br>
    Iowan Old Style<br>
    Original Garamond (Stempel Garamond)</p>
    <p>Gothic720 (MT Grotesque?)<br>
    Humanist 531 (Syntax)<br>
    (Humanist777 (Frutiger) )<br>
    Zurich (Univers)</p>
    <p>Considering the Swiss use almost only sans serif fonts (Arial/Helvetica) for briefs, would it be a good practice</p>
    <p>- to use a serif font as the main font?<br>
    - to use a sans-serif and a serif font in combination?</p>
    <p>If yes, would you please be so kind to recommend a few combinations with the above fonts?</p>
    <p>Thank you in advance!</p>
