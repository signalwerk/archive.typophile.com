    html: |-
      <p>All these are not really suited for correspondence, imo. The least objectionable is Frutiger, followed by Syntax, if you really want a sans. Amongst the serifs Charter might work (a lot of the others are too meagre or light or just plain ugly).</p>
      <p>BTW I answered your question because nobody else did for three days, which may signify a certain disinterest amongst the Typophiles regarding the subject.</p>
      <p>On another note: If you were to design a personal identity, even using some of these typefaces, you could broaden that to include correspondence etc. and it might work because of being part of a larger thing. In the way the smart car uses courier for everything.</p>
