      <p>You may be interested in FontFlasher (<a href="http://www.fontlab.com/fontflasher" title="http://www.fontlab.com/fontflasher">http://www.fontlab.com/fontflasher</a> ). It's a $29.97 application that comes with a Python plugin for FontLab Studio that helps creating pixelfonts. Please check the FontFlasher FAQ (<a href="http://fontlab.com/FontLab-Product-Support/FontLab-FAQs/FAQ-FontFlasher/" title="http://fontlab.com/FontLab-Product-Support/FontLab-FAQs/FAQ-FontFlasher/">http://fontlab.com/FontLab-Product-Support/FontLab-FAQs/FAQ-FontFlasher/</a> ) for installation tips for the plugin in FontLab Studio 5 (there are some manual steps you need to perform). </p>
      <p>A.</p>
