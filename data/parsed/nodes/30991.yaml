  html: |-
    <p>Hi Typophiles,</p>
    <p>I'm looking for old, classic books on printing or on-line resources in that manner. In particular I'm interested in graphic content: sketches, illustrations, photographs. The earlier the better. I plan to visit <a href="http://stbride.org" rel="nofollow">St Bride Library</a> in the near future, but anything else you'd like to add will be much appreciated.</p>
    <p>An <a href="http://www.artlex.com/ArtLex/ij/images/incunabl_printrad.lg.jpg" rel="nofollow">example</a> and an <a href="http://www.fromoldbooks.org/Antisell-HandbookOfTheUsefulArts/pages/0493-Printing-Press/0493-Printing-Press-q75-1039x1167.jpg" rel="nofollow">example</a>.</p>
