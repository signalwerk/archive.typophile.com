    html: <p>A print screen contains exactly the number of pixels that there can be. You do not change the resolution of a screen capture. You just run it as-is. 'Upping' the resolution of a screen capture will do nothing but make it look blurry and not at all like a screen capture. <br> <br>So, simple answer, just leave it as is. </p>
