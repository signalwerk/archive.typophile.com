    html: "<p>If you're going to resize a pixellated image and retain the clarity, you need to resample using the Nearest Neighbour setting in Photoshop (as opposed to any of the different flavours of Bicubic), and you need to stick to values which are factors of both the horizontal and vertical dimensions (ie you can resize a 640 x 480 image to 320 x 240, but not 330 x whatever). <br> <br>The other part of making screen graphics look good is the way you separate them to CMYK. <br> <br>When you convert an image from RGB (or L*a*b, for that matter) to CMYK, a black channel has to be generated. (We need a black channel in the first place because cyan ink reflects a lot of red light, so black generated from only C, M and Y looks muddy-brown.) <br> <br>Basically, the separating algorithm creates black where R, G and B are equal (or nearly equal). It then removes some of the CMY inks from those areas to avoid over-inking. The amount of CMY it removes can be controlled using Photoshop's Black Generation setting in the Custom CMYK set-up. <br> <br>When you separate an image with very definite areas of black -- a screen-grab is an ideal example -- you want to use Maximum Black Generation. This replaces all R=G=B areas with black and removes all CMY from those areas, and it aggressively replaces near-neutral mixes with black also. <br> <br>Result: you get nice clear black lines instead of slightly off-register CMYK mixes, and everything (text particularly) looks crisp and clear. <br> <br>(As an aside, when you separate images with very continuous tone -- like photographs -- you use a much, much lighter black generation. Printers call it 'Skeleton Black'. This preserves subtle tonal shifts and bright colour mixes and is more colour-controllable on press). <br> <br>HTH <br> <br>Rob</p>"
    html_clean: "<p>If you're going to resize a pixellated image and retain the clarity, you need to resample using the Nearest Neighbour setting in Photoshop (as opposed to any of the different flavours of Bicubic), and you need to stick to values which are factors of both the horizontal and vertical dimensions (ie you can resize a 640 x 480 image to 320 x 240, but not 330 x whatever). <br> <br>The other part of making screen graphics look good is the way you separate them to CMYK. <br> <br>When you convert an image from RGB (or L*a*b, for that matter) to CMYK, a black channel has to be generated. (We need a black channel in the first place because cyan ink reflects a lot of red light, so black generated from only C, M and Y looks muddy-brown.) <br> <br>Basically, the separating algorithm creates black where R, G and B are equal (or nearly equal). It then removes some of the CMY inks from those areas to avoid over-inking. The amount of CMY it removes can be controlled using Photoshop's Black Generation setting in the Custom CMYK set-up. <br> <br>When you separate an image with very definite areas of black -- a screen-grab is an ideal example -- you want to use Maximum Black Generation. This replaces all R=G=B areas with black and removes all CMY from those areas, and it aggressively replaces near-neutral mixes with black also. <br> <br>Result: you get nice clear black lines instead of slightly off-register CMYK mixes, and everything (text particularly) looks crisp and clear. <br> <br>(As an aside, when you separate images with very continuous tone -- like photographs -- you use a much, much lighter black generation. Printers call it 'Skeleton Black'. This preserves subtle tonal shifts and bright colour mixes and is more colour-controllable on press). <br> <br>HTH <br> <br>Rob</p>"
