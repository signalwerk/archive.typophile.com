    html: <p>"If you shrink it down to about 2.5 inches it will interpolate up to 300dpi..." <br> <br>It won't interpolate at all. It will just print smaller. <br> <br>If the screen shot is only 640 pixels wide, that's all you have to work with. If you print it at 1", it will technically be 640 PPI. If you print it at  4" in width, it will be 160 PPI. <br> <br>Now, if you tell Photoshop to print it at 4", but at 300 DPI, that's when it WILL interpolate and, most likely, just give you a blurry, muddy image.  <br> <br>I'd prefer crisp, albeit larger pixels when showing screen shots in print.</p>
    html_clean: <p>"If you shrink it down to about 2.5 inches it will interpolate up to 300dpi..." <br> <br>It won't interpolate at all. It will just print smaller. <br> <br>If the screen shot is only 640 pixels wide, that's all you have to work with. If you print it at 1", it will technically be 640 PPI. If you print it at  4" in width, it will be 160 PPI. <br> <br>Now, if you tell Photoshop to print it at 4", but at 300 DPI, that's when it WILL interpolate and, most likely, just give you a blurry, muddy image.  <br> <br>I'd prefer crisp, albeit larger pixels when showing screen shots in print.</p>
