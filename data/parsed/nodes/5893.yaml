  html: <p>What's the best way to include print screens on a magazine/book without a low quality vibe? I guess it depends on the printing specs for the book/magazine.  <br> <br>Take a look at the WEB DESIGN INDEX or any other simmilar book that has a print screen site/ interface (I saw a book yesterday with the photoshop interface on the cover).  <br> <br>What's the best way? Hot to transform a 72dpi print screen on a good looking printed photo?</p>
