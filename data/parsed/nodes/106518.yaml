    html: |-
      <p>Bhaman, in your illustration, it looks very much like the vowel mark is being ordered after the kashida glyph, and this is why the positioning is broken: in fact, the mark is being positioned relative to the kashida, rather than relative to the preceding letter. This implies the glyph order after GSUB is</p>
      <p><code>yeh.init kashida kasra alif.fina hamzabelow</code></p>
      <p>If you restructure the contextual substitution so that it inserts the kashida before the second letter, rather than after the first letter, that should solve the problem. In VOLT syntax, the example you give could be handled like this (presuming NFD decomposed text):</p>
      <p><code>alif.fina -&gt; kashida alif.fina</code></p>
      <p>in context</p>
      <p><code>yeh.init kasra | hamzabelow</code></p>
      <p>and the resulting glyph string should be</p>
      <p><code>yeh.init kasra kashida alif.fina hamzabelow</code></p>
      <p>and your kasra will be positioned on the yeh.init base.</p>
