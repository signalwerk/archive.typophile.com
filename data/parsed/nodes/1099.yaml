    html: "<p>I think Vincent’s stuﬀ is pretty nice, but: <br>1) I think anybody who’s seen enough Stone will ﬁnd the Irish authenticity compromised. <br>2) The dots are cramped by the x-height. <br>3) If he hasn’t gotten permission from Sumner Stone, he might get in trouble. Nothing that would cause lifelong misery, but still. Remember all the bobastic outrage over little Frothy? <br><br>Your stuﬀ is much more brave and smart. <br><br>hhp <br></p>"
