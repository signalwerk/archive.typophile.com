    html: <p>The Romhanach looks nice, but the “gaelic” glyphs in the ﬁrst version just look so out of place.  Plus, is there a reason behind the d, f, and g changing?  And are those two rs and two ts? <br><br>I do like the uppercase in the plain Nuachlo.  I think that and the lowercase from the Romhanach would look nice&nbsp;together.</p>
