    html: |-
      <p>The apparent size and position of the letters at a certain point size (or pixel size), is determined by the size of the letters – for Latin fonts, the lowercase letters in particular – in relation to the units per em (UPM) and the vertical metrics in the font. The apparent size of Latin fonts also vary quite a bit though. Something that looks as big as Georgia, will look to big next to Garamond.</p>
      <p>tl;dr: it depends on how big the letters are relative to the size of the «em».</p>
