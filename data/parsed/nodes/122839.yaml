    html: |-
      <p>Hello<br>
      You have to redesign the Latins, but it is not too difficult. In Fontlab open a full-height Latin glyph like H, go to  Tools/Action/Contour/Scale tool to make a Latin outline smaller until it matches the required height and width you like to match the non-Latin. OK.  Command Z to redo and try another number.  Experiment with various vertical and horizontal percentages until you find a suitable scale.  You can apply the same scaling to all selected Latin glyphs. </p>
      <p>If the resulting Latin outline is too thin, try the Tools/Action/Effects/Bold (and check the "keep glyph dimensions" box) and again experiment with how many points you want the stroke width and height to be increased by, to approximate the non-Latin. (Use negative numbers to make a font outline thinner).<br>
      Good luck.  It will not be a perfect Latin, but at least it will not look too strange next to the non-Latin.  Can you post an example of the two scripts together?</p>
