    <p>I created this font on FontStruct, but I made some changes to the lowercase 'a' in paint.<br>
    While not the first font I've ever worked on, it is the first font I've ever finished.</p>
    <p>Because it was created on FontStruct, I had little to no control over the spacing.</p>
