    html: <p>All I can contribute is that the fish is a codfish (it has three dorsal fins). It looks like something that might have been an old trademark, possibly for something like cod liver oil.</p>
    html_clean: <p>All I can contribute is that the fish is a codfish (it has three dorsal fins). It looks like something that might have been an old trademark, possibly for something like cod liver oil.</p>
  - id: 31680
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Sure enough. I did a Google Image search on Cod liver oil and found <a href="http://images.google.com/imgres?imgurl=americanhistory.si.edu/anatomy/images/global/history/scotscod.jpg&amp;imgrefurl=http://americanhistory.si.edu/anatomy/history/nma03_history_whatis.html&amp;h=258&amp;w=156&amp;sz=12&amp;tbnid=5myXz8Dmq-YJ:&amp;tbnh=105&amp;tbnw=64&amp;prev=/images%3Fq%3DCod%2Bliver%2Boil%26hl%3Den%26lr%3D%26ie%3DUTF-8%26sa%3DG" target="_blank">this page</a> showing a figurine for Scott's Emulsion (cod liver oil) from 1890. This was their trademark since 1886, according to the article there.</p>
    html_clean: <p>Sure enough. I did a Google Image search on Cod liver oil and found <a href="http://images.google.com/imgres?imgurl=americanhistory.si.edu/anatomy/images/global/history/scotscod.jpg&amp;imgrefurl=http://americanhistory.si.edu/anatomy/history/nma03_history_whatis.html&amp;h=258&amp;w=156&amp;sz=12&amp;tbnid=5myXz8Dmq-YJ:&amp;tbnh=105&amp;tbnw=64&amp;prev=/images%3Fq%3DCod%2Bliver%2Boil%26hl%3Den%26lr%3D%26ie%3DUTF-8%26sa%3DG" target="_blank" class="link-external">this page</a> showing a figurine for Scott's Emulsion (cod liver oil) from 1890. This was their trademark since 1886, according to the article there.</p>
