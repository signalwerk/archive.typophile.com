    <p>I used to have this typeface, but when I got a new computer, I must not have copied it over, and I can't find any documentation (I guess I never used it). anyway, it's used on the cover of the Bas Jan Ader book and dvd (seen here: <a class="freelinking external" href="http://www.basjanader.com/img/blog_cover.jpg" rel="nofollow">http://www.basjanader.com/img/blog_cover.jpg</a>) and throughout the website <a class="freelinking external" href="http://www.basjanader.com" rel="nofollow">BasJanAder.com</a></p>
    <p>Anyone have a guess?</p>
