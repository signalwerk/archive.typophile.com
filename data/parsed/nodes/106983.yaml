    <p></p><div class="imageWrap"><img src="http://typophile.com/files/02_opslag_træbord_5489.jpg"></div><p></p>
    <p>For over five years I’ve photographed lettering, signs and tags, and published them on my blog ‘Mads knipser’. Now I’ve designed a book with a lot of the best. Over 100 pages of typographical snapshots, mostly from Copenhagen, but also Amsterdam, Berlin, Cairo, Dubai, Málaga, New York, Paris and Lisbon. Over 160 photographs showing many of the diverse expressions &amp; designs the written word can contain. I wish to publish my book – and to succeed, I need to sell 184 copies.</p>
    <p>The book is 30 x 30 cm, 104 pages.<br>
    Printed on 150 g Garda Matt.<br>
    1,5 kg.</p>
    <p>More pictures of it on my my website: <a href="http://www.madshougaard.dk/mads-knipser-the-book/" title="www.madshougaard.dk/mads-knipser-the-book/">www.madshougaard.dk/mads-knipser-the-book/</a>.<br>
    Feel free to contact me if you have questions.</p>
    <p>Notice: If you order the book, and I don’t reach my goal, you don’t get the book. But you don’t pay anything either.</p>
    <p>Preorder here:<br>
    <a href="http://j.mp/16tDjdU" title="http://j.mp/16tDjdU">http://j.mp/16tDjdU</a></p>
