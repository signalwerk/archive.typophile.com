      <p>A few things. </p>
      <p>1) Under the education heading, lose the high school history. It doesn't pertain to a professional level job. I would also list only your major/emphasis under college history. Axe the college class list as well. If an employer wants to see a transcript, they'll ask for it. </p>
      <p>2) If you have any freelance design experience or an internship, I would list it under work experience. There seems to be a definite lack of real world design experience in this section. </p>
      <p>You may also want to reword your job descriptions as they relate to the design world. Deadlines, customer relations, communication, and general organization are all good things to think about. </p>
      <p>Personal anecdote: When I was a student, I worked in a luggage store of all things. Very far from the design world. My saving grace was that I had a lot of experience embossing leather goods at the store (we had a 100-year-old embossing machine). This impressed my current employer in the sense that it used good typographic and hand skills. That, and the fact that you had very little recourse if you **** up a $2,000 piece of luggage.</p>
      <p>3)  I might lose the recognition portion of the resume (seems fluffy) and replace it with a personal experience section. Are you bilingual by chance? Have you traveled or studied abroad? Things to think about.</p>
      <p>Lastly, proofread your resume. You have a few typos and punctuation mistakes, but I won't tell you where they are.</p>
      <p>Hope this helps.</p>
      <p>DOGG : : :</p>
