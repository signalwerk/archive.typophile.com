    <p>Hi everyone,</p>
    <p>If you would be so kind as to take a quick look at my resume and critique it for me that would be great. I would love some constructive criticism if you have it. </p>
    <p>A little background information: It is build on a 32 point grid, typeface is Georgia 10pt size with 14pt leading.</p>
    <p>Thanks everyone!</p>
    <p>Edit: I've edited it more to specific content and added some more work description. I unfortunately don't have much recognition or related personal experience related to design just yet. Would personal experience be considered volunteer work? The engineers without borders project as a volunteer project for free.</p>
