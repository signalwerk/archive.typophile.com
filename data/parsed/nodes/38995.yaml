      <p>Hi nein,</p>
      <p>Quick suggestion, I've started using <a href="http://www.Razume.com" title="www.Razume.com">www.Razume.com</a> for resume review, you can post your pdf resume anonymously and get community feedback directly on your resume, it's pretty cool.  I got some great advice.</p>
      <p>Otherwise, your resume's pretty good.  I would remove the bottom part about references, it just takes up room.  Recruiters will ask for references if they want them regardless if you have it listed.  Also, try quantifying your resume more.  Use numbers, amount of time, $ amounts to describe your work experience in more detail.</p>
      <p>Best of luck,<br>
      Henry</p>
