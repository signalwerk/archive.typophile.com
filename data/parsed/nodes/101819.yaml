    html: |-
      <p>Found it in an undated Miller &amp; Richards catalog from the University of California collection, digitized by Microsoft. Good luck finding a digital version: the original typeface was named <strong>Trajan</strong> (pp. 317 <em>et seq.</em>). Go figure...</p>
      <p>Note: the specimen book doesn't show an ampersand for the Roman, but it does for the Bold weight, and the design matches the second ampersand shown.</p>
