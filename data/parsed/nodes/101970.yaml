    <p>View eText Fonts: <a href="http://bit.ly/XovVvK" title="http://bit.ly/XovVvK">http://bit.ly/XovVvK</a><br>
    Read Press Release: <a href="http://bit.ly/10wWpry" title="http://bit.ly/10wWpry">http://bit.ly/10wWpry</a><br>
    Read Blog Post: <a href="http://bit.ly/Z8lPcS" title="http://bit.ly/Z8lPcS">http://bit.ly/Z8lPcS</a></p>
    <p>Today, Monotype announced the release of a <a class="freelinking external" href="http://www.fonts.com/search/all-fonts?searchtext=etext " rel="nofollow">collection of typefaces</a> designed for digital reading environments, including e-books, web content, mobile applications, digital publications and online newspapers. Device manufacturers, digital publishers and Web designers can now turn to a selection that includes some of the most popular text faces used in print – designed and tuned for exceptional readability on e-readers, tablets, smartphones and other web-enabled devices.</p>
    <p>Monotype’s initial collection includes multiple weights of nine typeface families, designated for digital publishing:</p>
    <p>Amasis™ eText<br>
    Monotype Baskerville™ eText<br>
    PMN Caecilia® eText<br>
    ITC Galliard® eText<br>
    Malabar™ eText<br>
    Neue Helvetica® eText<br>
    Palatino® eText<br>
    Sabon® eText<br>
    Ysobel™ eText </p>
    <p>Timeless designs such as Monotype Baskerville, ITC Galliard and Sabon were redrawn to improve readability on screen. Monotype typeface designers worked to impart a richer contrast, an even color, and slightly taller lowercase characters, all while ensuring that the typefaces appear as unmistakable cousins of their original print designs. The designs also include small caps and old style figures for professional-quality publishing design.</p>
    <p>All typefaces in the collection have been hand-hinted to display with exceptional clarity cross mobile devices from smartphones to tablets and e-readers. The fonts also take advantage of Monotype’s Edge™ tuning technology, enabling publishers to create and deliver high-quality, readable text across various platforms, formats and devices, including E Ink® screens. The fonts look and perform best with devices that use Monotype’s iType® font engine for rendering text.</p>
    <p>The new typefaces can be integrated in a number of ways:<br>
    -	The fonts may be embedded in consumer devices for use as system fonts that can be custom-tuned for optimal display and performance to meet specific OEM device requirements.<br>
    -	The fonts may be bundled within the source code of an e-book or digital publication title, enabling publishers to preserve intended design, branding and layout requirements. Displays that use either e-paper or LCD technology are supported.<br>
    -	The fonts may be licensed as Web fonts from <a class="freelinking external" href="http://www.fonts.com/web-fonts " rel="nofollow">Fonts.com Web Fonts </a>for HTML-based content, enabling high-quality reading experiences across various Web-enabled devices.</p>
    <p>To view the new collection, visit <a href="http://bit.ly/XovVvK" title="http://bit.ly/XovVvK">http://bit.ly/XovVvK</a> or contact Monotype for more information at <a href="mailto:etext@monotype.com">etext@monotype.com</a>. </p>
    <p>About Monotype<br>
    Monotype is a leading global provider of typefaces, technology and expertise that enable the best user experience and ensure brand integrity. Based in Woburn, Mass., Monotype provides customers worldwide with typeface solutions for a broad range of creative applications and consumer devices. The company’s library and e-commerce sites are home to many of the most widely used typefaces – including the <a class="freelinking external" href="http://new.fonts.com/font/linotype/Helvetica " rel="nofollow">Helvetica</a>®, <a class="freelinking external" href="http://new.fonts.com/font/linotype/Frutiger " rel="nofollow">Frutiger</a>® and <a class="freelinking external" href="http://new.fonts.com/font/linotype/univers " rel="nofollow">Univers</a>® families – as well as the next generation of type designs. Further information is available at <a href="http://www.monotype.com" title="www.monotype.com">www.monotype.com</a>. </p>
    <p>Monotype, iType, Palatino, Sabon, PMN Caecilia, Neue Helvetica, Helvetica, Frutiger and Univers are trademarks of Monotype Imaging Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Edge and Ysobel are trademarks of Monotype Imaging Inc. and may be registered in certain jurisdictions. Galliard is a trademark of Monotype ITC Inc. registered in the U.S. Patent and Trademark Office and may be registered in certain jurisdictions. Malabar is a trademark of Monotype GmbH and may be registered in certain jurisdictions. Monotype Baskerville and Amasis are trademarks of The Monotype Corp. and may be registered in certain jurisdictions. E Ink is a registered trademark of E Ink Corp. All other trademarks are the property of their respective owners. ©2013 Monotype Imaging Holdings Inc. All rights reserved.</p>
