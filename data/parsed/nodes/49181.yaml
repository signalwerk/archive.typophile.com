    <p>I’m working on a complete rebranding and was given the task of coming up with type options for the client. The key words associated with the brand are ’Real’ ’Determined’ ’Down To Earth’ ’Strong’ and it’s a sports affiliated brand. Right now they’re using a rather boring squarish sans. What I’m looking to do is give them suggestions on a Display typeface and a Body copy/legal complimentary sans with multiple weights (regular, light, bold &amp; italic). I’m definitely looking for a fresh/new typeface for the display setting, something that isn’t widely used/overused.</p>
    <p>I’ve not had a whole lot of free time to spend on here recently and as such don’t feel like I have my finger on the pulse of what’s going on typographically/foundry-wise these days. This is where your help comes in! :o)</p>
    <p>Any suggestions of typefaces or where to find info on recent releases that might be relevant would be great!</p>
