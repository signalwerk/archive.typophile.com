  html: |-
    <p>Have managed to persuade a client to reduce their corporate typeface from the awkward Fago range down to just using FagoExBold as a headline, and pairing this with Akkurat. </p>
    <p>This works well to contrast the Character of the Fago headline font with a precise sans. Problem is Akkurat is too condensed for the aging design director as body copy, and does not read as comfortably as a text font. I have tried a -25 kerning and this seems to help. </p>
    <p>But he is adamant the new Founders Grotesk is a better pairing for Fago! To me they seem to both have too much character to be seen together, and the clean nature of the Akkurat is a great contrast.</p>
    <p>Any thoughts on how to make Akkurat work as body copy better? Or on the pairing choice?</p>
    <p>Also, Why is Fago such an unkerned beast. It seems like we have to go through set copy more often thatn most fonts just to get it looking half decent.</p>
