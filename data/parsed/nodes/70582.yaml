      <p>Pairing FF Fago and Akkurat, and using the first for display and the latter for text, doesn’t make much sense to me. If anything, you should do it the other way around. Fago is a humanist with open counters spaced and designed for text while Akkuratshines at large sizes.</p>
      <p>Anyway, the usual approach to pairing is finding fonts that contrasts. Your two choices look so similar that the pair might end up looking more like a mistake than a delibirate decision.</p>
