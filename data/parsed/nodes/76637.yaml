  html: |-
    <p>Hello,<br>
    I'm looking for a font that suggests architecture:<br>
    geometry, possibly visible individual parts/segments like the font Build from YouWorkForThem (pasted below). I especially like the way parts of this seem to fold in on themselves, suggesting dimensionality without a standard dropshadow/extruded effect.<br>
    Does anyone have ideas of other things like this? It can be somewhat idiosyncratic because I'm only using it in large display-size headlines.<br>
    Thanks a lot for any ideas...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BUILD_FONT_3590.jpg"></div><p></p>
