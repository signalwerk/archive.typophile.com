    html: |-
      <p>I think the capital C in Child competes with the capitalization of ONE. In terms of visual rhetoric, one could also argue that all lowercase letters appears more youthful. I do however see why you may wish to capitalize Child as a proper noun. Conversely, with just ONE and ALL in caps, the eye will quickly isolate and compare those two words.</p>
      <p>With just ONE and ALL in capital letters, a singular touch of red, and a lowercase c, you may not even need to use bold to establish hierarchy.</p>
      <p>A round period may elude to the planet earth? Tough call. May conflict with the other <a href="http://en.wikipedia.org/wiki/Tittle" rel="nofollow">tittles</a> (linked just in case someone joins in who doesn’t know that word yet), but seeing as there are two of them — ch<strong>i</strong>ld and <strong>i</strong>s — and only one period, in addition to the proximity of the period to the word earth the reader will most certainly, consciously or  subconsciously, be able to determine that the use of a round period was clearly intended to be a rhetorical graphic device, and not just a poorly designed period.</p>
      <p>Have you thought about including the name of the typeface on the poster? Possibly instead of your own?</p>
      <p>Alignment of small type with the outer stroke of the n in than?</p>
      <p>Hrm. Design without clients. That’s worth meditating on.</p>
