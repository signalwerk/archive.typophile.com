    html: |-
      <p>I guess I see why you mentioned JMB.  He was a very big fan of all lower case as were many of his contemporaries.  A friend of mine, Peter Megert apprenticed under him years ago.  Peter wrote everything in lower case.  I find it to be a bit of a modernist's affectation in the 21st century.  I opted for no descenders to tighten the leading to a painful level.<br>
      While I can see how the lowercase of everything except ONE and ALL can help pose the dichotomy a bit stronger, I don't feel it would be any better a solution.</p>
