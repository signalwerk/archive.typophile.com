    html: |-
      <p>@Christopher:<br>
      My initial concept of this poster included an exclamation point instead of a period with the globe being the dot and the upright being a gun site looking straight at you.  All of these little attempts seemed to trivialize the message and take away from the dichotomy.  I did, however, make one with only the period being round and ocean blue but not oversized.  This looks okay as well since it does not detract and is still typographic.<br>
      As far as capital C goes, it has nothing to do with proper noun, it is there for emphasis and to tie ONE stronger to Child so that it speaks "ONE CHILD" more than "ONE child" with the "child" seeming to be of less importance.  If I were concerned with proper nouns, I would have capped the word "Earth".<br>
      To me, proper punctuation according to a style manual is for editors doing more text than this. In a poster, you ave very few devices to work with and it is more important to have them speak more the intended message than reflect the dictates of Mssrs Strunk&amp;White.<br>
      The small byline text is purposely only aligned at bottom.  To align it at right with the "n" a few lines above would close that space and make the byline too active a participant in the structure.<br>
      @5Star:<br>
      Thanks for the complement. The typeface is called "Dez Headsup".</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/onechildworth2_3706.jpg"></div><p></p>
