      <p>In truth, I believe that there are probably no more than fifty typefaces that are truly suitable for setting books <em>and</em> magazines. Add in a range of diacritics, and suitability to modern printing technologies, and that list gets whittled down to around half that number (William, I believe that your Caslon would definitely be on this shortlist).</p>
      <p>It never ceases to amaze me how few fonts there are that are easy to read (in book settings), possess an elegant and inviting form (which in my eyes means not too bland and not too fancy), have the correct proportions, are endowed with good metrics, include all the necessary feature sets, <em>and</em> look good when printed offset (or even laser). Yet, even though this list is rather small, some book designers still manage to screw things up!</p>
