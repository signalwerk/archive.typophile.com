      <p>Sometimes the Optical spacing can be of help, for example if swashes are not kerned, or with "camel" casing like MicroSoft. (Lower case—uppercase kerning is unusual.) But even there it is better to hand kern if the typesetter has learned to do it. </p>
      <p>But aside from these kinds of exceptional cases, it is a menace, as Kent has shown with examples in other threads, with the capacity to wreck a well kerned font. The worst thing is that the idea has been propagated that this is a "superior" kerning, which is as a rule the opposite of the case. </p>
      <p>It would be best if Adobe would either cut it altogether, or at least explain it properly.</p>
