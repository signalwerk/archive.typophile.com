      <p>- <em>Adam, the Zipf curve describes the herd instinct: some things become very popular, quite apart from any quality of merit, because that's the way culture is.</em></p>
      <p>Nick, I don't mean to be picky but... Zipf curves are <em>not</em> a description of herd instincts per se. They describe a common phenomena that appears in a variety of setting in the natural world—just like its close relative Pareto's Law (the so called 80-20" law). Herd instinct and behaviour on the other hand is an emergent property of the basic rules that govern the behaviour and interaction of individual herd members.</p>
      <p>- <em>some things become very popular, quite apart from any quality of merit, because that's the way culture is.</em></p>
      <p>I agree! A brief review of the popular programs displayed on television networks or the latest (mostly 3D nowadays) movies, certainly proves that point. Another thing that seems to be rather popular today, is bashing and trashing the old classic fonts. It would seem at times, as if the typographic herd instinct collectively frowns upon those refuseniks who still cling to those Caslons, and Bembos, instead of embracing the brave new fonts of our inventive times. </p>
      <p>Just to clarify a point, I do not hate Utopia (I don't even "hate" Comic Sans). I hate that it is used in book settings (and often with tight leading to top!), it is an eye sore, just like the man who attends a white tie affair, dressed in shabby jeans and rock climbing boots. If you ask me who is the worst dressed person <em>in the room</em>, then I would be inclined to say that it is the man with the shabby jeans. That is not to say that I have laid a critique against the use of jeans in general!</p>
    html_clean: |-
      <p>- <em>Adam, the Zipf curve describes the herd instinct: some things become very popular, quite apart from any quality of merit, because that's the way culture is.</em></p>
      <p>Nick, I don't mean to be picky but... Zipf curves are <em>not</em> a description of herd instincts per se. They describe a common phenomena that appears in a variety of setting in the natural world—just like its close relative Pareto's Law (the so called 80-20" law). Herd instinct and behaviour on the other hand is an emergent property of the basic rules that govern the behaviour and interaction of individual herd members.</p>
      <p>- <em>some things become very popular, quite apart from any quality of merit, because that's the way culture is.</em></p>
      <p>I agree! A brief review of the popular programs displayed on television networks or the latest (mostly 3D nowadays) movies, certainly proves that point. Another thing that seems to be rather popular today, is bashing and trashing the old classic fonts. It would seem at times, as if the typographic herd instinct collectively frowns upon those refuseniks who still cling to those Caslons, and Bembos, instead of embracing the brave new fonts of our inventive times. </p>
      <p>Just to clarify a point, I do not hate Utopia (I don't even "hate" Comic Sans). I hate that it is used in book settings (and often with tight leading to top!), it is an eye sore, just like the man who attends a white tie affair, dressed in shabby jeans and rock climbing boots. If you ask me who is the worst dressed person <em>in the room</em>, then I would be inclined to say that it is the man with the shabby jeans. That is not to say that I have laid a critique against the use of jeans in general!</p>
