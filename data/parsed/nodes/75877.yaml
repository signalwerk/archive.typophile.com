      <p>Dina — The bottom line is that Adobe’s Optical metrics ignores the metrics built into a font and completely overrides and subverts the spacing that a type designer has spent time designing. For a well-considered text face, this is not a good idea.</p>
      <p>At best, there is little noticeable difference. At worst, it can completely disrupt the rhythm of a face. I am perhaps a bit touchy about this topic because Whitman happens to be one of those that suffers horribly at the hands of so-called “optical” metrics. I do not proclaim that my fitting of Whitman is flawless or perfect. But what Adobe’s algorithm chooses to do with it is a travesty.</p>
      <p>A more in-depth critique of Adobe’s Optical metrics may be found embedded in this thread:<br>
      <a href="http://typophile.com/node/54310#comment-327297" title="http://typophile.com/node/54310#comment-327297">http://typophile.com/node/54310#comment-327297</a></p>
