      <p>Nick, by invoking Zipf's Law you are in fact proving my point (albeit in a roundabout way). If the distribution of book-faces preferred by typographers follows a Zipf curve, and you end up with typefaces such as Bembo, Caslon, and Garamond occupying the top of the curve, then perhaps there is some uniquely inherent quality (or set of qualities) to these particular typefaces that makes them universally appealing in the context of book reading. </p>
      <p>If you ask these typographers to name their top 20 typefaces for books, you will probably end up with three to five top choices with a myriad of other choices occupying a widening shallow distribution. You seems to look at this as an indication of the variability of preference, and this variability would in turn appear to support the notion that such choices are ultimately highly subjective. Yet, the information could be interpreted the other way round—that there are only a small number of typefaces that possess a universally agreed upon quality. This in effect was the essence of my core argument.</p>
      <p>It stands to reason (and statistics), that if we have some <em>superb</em> all-round book faces, and others that are just ok, then there <em>must</em> be some (Curlz is obviously an extreme example) that are bloody awful. The question that started this thread was simple: Can we name some of the font that are least suited to these types of settings. </p>
      <p>One last thing though; the claim that certain typefaces (e.g. Curlz) could, under certain extremely rare circumstances, be called for in book text, and therefore could not be considered to be <em>inherently</em> bad for such setting (the strong version of the "it all depends on the context" argument), is just a cop out. After all such an argument could be extended to all types of symbolic forms including dingbats.</p>
