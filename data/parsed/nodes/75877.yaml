      <p>Nick, I conceded in that thread that there is ambiguity about the meaning of "text" as it usually involves both small size and extended text, but you can have one without the other. And I maintained, I think correctly, that may fonts, including Univers, are not optimal in extended text at small size. And I would add that some, including Curlz, are just horrible.  </p>
      <p>Mat here contrasted "print for copy" and "titling." "Copy" usually means extended text, but Mat can clarify that for us. </p>
      <p>In your initial post, in response to a question about "copy" you wrote: "a good typographer can make any typeface read well." Given the context of "copy", that meant "read well in copy". Now you back off and say just that a typographer can find some conceivable situation in which it can read well. But that was never at issue, because the question wasn't whether a few letters or words can be made readable, but whether there are faces that are bad for "copy", extended text. </p>
      <p>Changing the meaning of the question to win an argument is known as the "fallacy of equivocation". In fact, by saying "I'm not suggesting that a typographer can turn any type into a workhorse text face," I think you have conceded that Curlz is not good for "copy"—thus agreeing with my point while not admitting it.</p>
