      <p>On reflection, I have to reject the premise that there are no bad typefaces. And by "bad" I don't mean just goofy or ugly or badly drawn. I mean typefaces that are fully considered and skillfully rendered but that just don't do their job well.</p>
      <p>To say that there are no bad typefaces is to imply that type designers cannot fail: no matter how badly they screw up, a page designer can still redeem the work. But type designers, like all designers, are fallible.</p>
      <p>But I also don't believe that one can paint a rainbow with mud.</p>
