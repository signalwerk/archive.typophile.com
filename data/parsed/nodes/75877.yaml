    <p>Fellow T’philes,</p>
    <p>In my quest for the answer to this question I have come across countless rants and fanboy’isms behind the <cite> “best” </cite> typeface, but what are your opinions or solid gold facts about the worst readable faces? I’m thinking <cite> mainly </cite> in print for copy, not so much titling.</p>
    <p><strong>What are the worst offenders?</strong></p>
    <p>Thanks,</p>
    <p>Mat.</p>
