      <p>Anytime someone tries to establish an absolute for things that are somewhat fuzzy in nature, they are asking for an argument.  There are numerous reasons book publishers choose a typeface for book text.  One of them simply being "workflow". They have used a face or faces so many times that page-out is very predictable. Therefore they see no reason to switch since they don't get a dime more profit for their trouble. Yes, Curlz is a lousy book face but their may be occasions when an author is more interested in establishing a character than having what they say be easier for scientists to agree upon for readability of content. This kind of thing is more likely in the case of advertising than setting a typical pulp-fiction novel. If someone wanted to set a scenario where the speaking character was a shallow, ditzy teenage girl and had little of value to say, Curlz might fit the bill perfectly.<br>
      We all know the tenuous history of readability studies and how much disagreement there is about cause and effect--correlation is not always causal. I guess I just don't see much value in beating that horse yet again. No real usable information comes out of the argument.  This thing always surfaces out of "best "worst" "most" "least" "never" "always" kinds of lists.  e. e. cummings only used lowercase and Massimo loves Helvetica and Bodoni.  Yup, so graphic designers, editors, publishers, advertising people, and scrapbookers will continue to pick typefaces either well or badly as they always have and any pronouncement of an absolute will continue to be either ignored or argued about without changing a thing.</p>
