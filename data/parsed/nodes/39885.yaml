    <div class="info">Submitted by <a href="/user/1160" title="View user profile.">Joe Pemberton</a> : 7.Dec.2007 8.38pm </div>
      <p><strong>Typophile Merch Store Closing &amp; Year End Sale </strong></p>
    <p>On Tuesday, December 11th the <a href="http://typophile.bigcartel.com/">Typophile Merch Store</a> will go on a 6 month hiatus. This is your last chance for Typophile merchandise until June 2008!</p>
    <p>The 2007 «Type Specimen» tee is on sale. Get the <strong><a href="http://typophile.bigcartel.com/product/type-specimen-mens">men's</a></strong> or <strong><a href="http://typophile.bigcartel.com/product/type-specimen-womens">women's tee</a></strong> for just $19 US. For the next 4 days you can get a deal on the 2007 tee and have it shipped in time for the Christmas holiday. </p>
    <p><a href="http://typophile.bigcartel.com/product/type-specimen-womens"><img border="0" src="http://typophile.bigcartel.com/account/9067/66554/300.jpg"></a></p>
    <p><font face="helvetica, arial" size="1">DETAILS: The sale applies to orders transacted between Saturday, December 8 and Tuesday December 11 at Noon Pacific. All outstanding orders to date will be shipped at that time. The merchandise store will close at the end of that sale for a 6 month hiatus. Expect the store back in action in June 2008.</font></p><font face="helvetica, arial" size="1">
    </font><p><font face="helvetica, arial" size="1">In the meantime, you may continue to <a href="">make donations</a> at various contribution levels through the store.</font></p>
