    <p>Dear Typophile,</p>
    <p>I have never posted here before and offer this thread to you as a plea for help. I admire the level of expertise visible on this board.</p>
    <p>I am working on a personal logo and, although I have gotten it where I am suitably happy, areas of the script and swashes I have drawn feel clearly off for reasons I do not have the capacity to articulate. It is posted below in the hopes that I can be guided in the general direction to resolve this (as it is totally bugging the hell out of me).</p>
    <p>Below is an image and attached is a PDF, for anyone who cares to look at it. Thanks!</p>
    <p>Any comments on the logo generally are completely welcome, it’s for my own portfolio / business cards etc.</p>
    <p>Yours forever,<br>
    Nelson</p>
