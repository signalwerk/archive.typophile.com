      <p>No one else has mentioned this so perhaps it’s only me, but I think there are kerning problems with the words “ONE MAN”. Specifically, the spacing on both sides of the A is more open than the rest of the line. There are three possible ways to fix (or at least improve on this):</p>
      <p>1) Tighten up the spacing on each side of the A. To make the spacing exactly visually equal it would probably be necessary to let the bottom serifs of MAN touch each other, which you may or may not like depending on your personal preferences.</p>
      <p>2) Open up the spacing of the rest of the line to match the spacing around the A. Again, you may or may not like this option.</p>
      <p>3) The third option would be to fudge between the two previous options: Close up the spaces on each side of the A until the lower serifs are almost, but not quite touching. Then open up the spacing of the rest of the line a little — again not quite enough to exactly match the visual spacing around the A. The result will be a line that, although not exactly spaced equally, is close to equal without resorting to the extremes of the first two options.</p>
    html_clean: |-
