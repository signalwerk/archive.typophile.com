      <p>I am overwhelmed by the explosion of commentary on this. And deeply flattered at the level of positivity associated with it. Thanks for all the feedback and critical comments thus far.</p>
      <p>I owe everyone an update, albeit minor. All the criticism of the letter “E” (either it is leaning to the wrong side, hurting legibility, or looks like an “o”) led me to the realization that it kind of looks like a flat tire. I redrew it as more of an italic than a script.</p>
      <p>Still needs work on integration with the rest of the word. </p>
      <p>It may seem like I am extending this project out to levels of preposterous detail, but I am only doing so because I am learning so much throughout the process.</p>
