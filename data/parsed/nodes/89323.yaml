      <p>Meridien is a bit blah for text though. Sort of light and spiky. I seem to remember Frutiger didn't even advocate it himself, later on. (Disclaimer: Maybe it's just a personal dislike of mine.)<br>
      If you're considering a serif you might look at Frutiger Serif (which in fact is sort of a remodeled Meridien) which is supposed to work extra well with Frutiger. You might do something like having the headlines in Frutiger (or that script maybe) and the text in the serif? I haven't used it myself though, so can't really utter a recommendation.</p>
