    html: |-
      <p>I'm very glad that Frutiger was able to make the version that he really wanted. The other versions, after Roissy, were compromises for various reasons. I find it a little ironic that he took off the sharper terminals, drawn by his then assistant...<br>
      I've liked them, but I can see why he toned them down. They make the final version closer to Myriad...</p>
      <p>Neue Frutiger fixes the widths that were imposed by linotype's earlier system, and improves the weights. He was upset about Frutiger Next, as explains in his book.</p>
