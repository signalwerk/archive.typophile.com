      <p>Good point, Sindre, Apollo should work [better].<br>
      I just went back to that big <a href="http://typophile.com/node/54310" rel="nofollow">Meridien-cum-optical-spacing thread</a> we had a while ago and <a href="http://typophile.com/node/54310?page=1#comment-327595" rel="nofollow">found</a> Bringhurst in fact recommends pairing Frutiger with Apollo (or Meridien, which however he deems less useful for text):</p>
      <p><cite>"Frutiger also mated well with the same designer's Méridien and Apollo, though such a mixture was not apparently part of the original design plan, and the fonts did not match in weight or body size." </cite>(Bringhurst, p. 257)<br>
      <cite>"[In making Apollo] Frutiger used the opportunity to rethink his first text face, Méridien, drawn eight years earlier. Apollo lacks the sharpness of Méridien, but its smaller eye, blunter serifs and reduced modulation can make it a better choice for text […]".</cite> (Bringhurst, p. 215)</p>
