    html: <p>A lot of factors would play into it, paper, print quality, point size, etc. I wouldn't see any reason why Frutiger wouldn't work as long as you take all the variables into consideration. It's always good to set some text, and do some test prints, I rely too much on the screen sometimes.</p>
