  html: |-
    <p>I'm doing a conference booklet for an organization whose logo is done in Frutiger and a script called Inspiration. I'd like to use Inspiration for certain headings and callouts. How does Frutiger work for large amounts of text? If so, what weight...Roman or Light?</p>
    <p>Is the Roman heavier than a traditional Book weight? Am I just imagining that it looks like it is?</p>
