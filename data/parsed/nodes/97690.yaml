    html: |-
      <p>@Karl: Thanks for the information. A bit of advice; to make things easier for other members, instead of writing with ambiguous hyperlinks such as <a class="freelinking external" href="http://www.ampsoft.net/webdesign-l/WindowsMacFonts.html" rel="nofollow">this</a> and <a class="freelinking external" href="http://opentype.info/blog/2012/01/23/outline-font-format-development/" rel="nofollow">here</a> try to use more descriptive language so the reader knows where the link is going to take them <em>before</em> they click on it. Using ambiguous words such as “here” require the reader to read before and after the hyperlinked word in order to know where they are going.</p>
      <p>Instead try writing with links like this:</p>
      <p>“A resource detailing <a href="http://www.ampsoft.net/webdesign-l/WindowsMacFonts.html" rel="nofollow">fonts common to both Windows and Macintosh</a> would be a good place to start.”</p>
      <p>and</p>
      <p>“Ralf Hermann produced <a href="http://opentype.info/blog/2012/01/23/outline-font-format-development/" rel="nofollow">a fantastic infographic on outline font formats</a>.”</p>
      <p>Also notice, I did not hyperlink the punctuation on the second example. Another good practice as it contains no information relevant to the hyperlink.</p>
      <p>The Mac and Window’s hyperlinks are also quite misleading, which is a shame as they are very useful. I would have written:</p>
      <p>See also:<br>
      <a href="http://en.wikipedia.org/wiki/List_of_Microsoft_Windows_fonts" rel="nofollow">Wikipedia’s list of Microsoft Windows fonts</a> and <a href="http://en.wikipedia.org/wiki/List_of_Microsoft_Windows_fonts" rel="nofollow">Wikipedia’s list of typefaces included with Mac OS X</a>.</p>
      <p>Notice I matched the wording of the the hyperlink with the title of the Wikipedia page reinforcing in the readers mind that they have landed in the correct place.</p>
      <p>Takes a bit more work, but I like to think that comments with as much useful content such as yours are certainly worth the extra attention<a href="http://en.wikipedia.org/wiki/Period" rel="nofollow">.</a></p>
