    <p>In April of 96 there was a typographic symposium in Toronto with lots of big names that I very much wanted to meet and hear. The cost was out of my reach (being a type designer will do that) and much to my regret I couldn’t attend. </p>
    <p>The event was on a Friday and Saturday. I consoled myself by going out to a little electronic music shindig on Saturday night, and ended up having a phenomenal time. The next day I went out for lunch on Queen Street with my friend Jean-Michel from France. As we left the restaurant, we hadn’t walked more than two dozen paces, when I passed some men speaking Dutch. I figured they were just tourists and kept on walking. A few paces on however I realized that I recognized one of them. “Wait here” I said to my companion and ran back.</p>
    <p>“Excuse me, but are you Gerard Unger?” I asked in Dutch.<br>
    “Yes I am,” he said with a rather surprised look on his face.<br>
    “Hey, and you’re Just van Rossum and you’re Erik van Blokland.” </p>
    <p>I introduced myself, explained who I was and what I did. We proceeded to stand there and chat for several minutes, I showed them what I did, and we exchanged cards. </p>
    <p>“Yes Paul Sych was telling me about you. If I had known about you before hand I would have snuck you into the conference,” Gerard Unger said, much to my chagrin of course. </p>
    <p>But I have to say I thought it was hilarious to meet the three people at the symposium I most wanted to meet, completely by chance. If I had left the restaurant thirty seconds later, I would have missed them. The other amusing thing is that Just and Erik were both born around the same time as me (Just in 1966 and Erik in 1967) are both as tall as me (2 meters), they’re Dutch and they design type. </p>
    <p>They inquired where a good place to eat would be, and after discussing the many possibilities, I pointed out the direction to a good Indian restaurant. This happened to be in the direction where my neglected friend was. He had waited patiently for me this whole time. I introduced everyone and Gerard Unger, being a very personable man (I think avuncular would be a good term to describe him) asked Jean Michel what he did.<br>
    “I’m a DJ,” he replied.<br>
    “Ah, my son is a DJ in Amsterdam.”<br>
    “I know several DJs from there. I actually played a record last night by two guys from Amsterdam, Remy and Sven from Global Cuts.”<br>
    “Ah yes, Remy is my son and Sven is my nephew.” </p>
    <p>My brain was pretty much reeling at this point! One strange small world incident was followed by another in rapid succession. </p>
    <p>A while later I got a call from Joe Clark, a writer who specializes in design.<br>
    “Hey I hear you accosted Gerard Unger on the street.”<br>
    “Yeah. How did you know?”<br>
    “David Michaelides from FontShop told me.”<br>
    “And how did he know?”<br>
    “They told David because they were utterly flabbergasted that someone in Toronto not only recognized them, but knew who they were, and could speak to them in their native tongue.” </p>
    <p>The next day I was on the phone with Patric from Thirstype.<br>
    “So I hear you bumped into the Dutch boys on the street.”<br>
    “Yeah how did you know?”<br>
    “Just told me. He thought it was hilarious that you knew who they were, and went up to say hello. He said it made him feel like a famous rock star.” </p>
    <p>But it gets even weirder. FontShop published sheets with bios and small portfolios of notable type designers. Gerard Unger was one of them. It made mention how he got his start at a very famous Dutch ad agency Total, run by esteemed typographer Wim Crouwel. I showed this sheet to my mom for her to get a sense of who I had met.<br>
    “Oh I know Wim Crouwel,” my mom says.<br>
    “Huh?! Are you sure?”<br>
    “Yes your dad used to play baseball with him.” (My father was a really good pitcher and played on the Dutch national team in the 50s and early 60s.) “Yes I’m certain of it, Wim Crouwel, he ran an advertising agency. He was a catcher.”<br>
    “So let me get this straight. My dad used to lob baseballs at the head of a luminary in the world of typography. Wow.”</p>
