    html: <p>From the letter's shape it looks like an old dot-matrix printer font and if this is the case you should not expect to find an exact match of a modern outline digital font. I suggest to look for some similar monospace font like e.g. <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=FontShop&amp;ffam=MagdaClean%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=9e5c10122548486d7db924d6256ac2fd&amp;wrap=2&amp;text=101%20MILAN%20COURT%20A3134221" rel="nofollow">Magda Clean</a></strong> by FontFont</p>
