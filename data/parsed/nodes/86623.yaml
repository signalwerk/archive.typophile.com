    <p>dear friends typophiles!</p>
    <p>i am glad to present catalog of free cyrillic fonts <a class="freelinking external" href="http://free.type.org.ua/en/" rel="nofollow">http://free.type.org.ua/en/</a>. </p>
    <p>it is not usual collection of cyrillic fonts because contains no warez but only link to legal free font. it includes about hundred typefaces from different countries and no trash low-quality one.</p>
    <p>so if you want explore cyrillic in its beauty, enjoy <a class="freelinking external" href="http://free.type.org.ua/en/" rel="nofollow">http://free.type.org.ua/en/</a> </p>
    <p><img src="http://free.type.org.ua/wp-content/uploads/freetypeorgua.png" alt="freecyrillic"></p>
