    <p>dear friends typophiles!</p>
    <p>i am glad to present catalog of free cyrillic fonts <a href="http://free.type.org.ua/en/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://free.type.org.ua/en/</a>. </p>
