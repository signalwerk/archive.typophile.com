    html: |-
      <p>here is a technical answer.<br>
      The technique is the same as the ligature,  using the FEATURE.<br>
      Of course you need new "generated glyph" for the subtitution (eg: "f_f_l", "T_h").</p>
      <p>FEATURE<br>
      for ligature is LIGA<br>
      for Discretionary ligature is DLIG<br>
      for Contextual ligature is CALT<br>
      etc.<br>
      Wiki can help: <a href="http://en.wikipedia.org/wiki/OpenType_feature_tag_list" title="http://en.wikipedia.org/wiki/OpenType_feature_tag_list">http://en.wikipedia.org/wiki/OpenType_feature_tag_list</a></p>
      <p>here is some example:<br>
      feature liga {<br>
          sub f f b by f_f_b;<br>
          sub f f h by f_f_h;<br>
          sub f f i by ffi;<br>
      } liga;</p>
      <p>feature dlig {<br>
          sub T H   by T_H;<br>
          sub T T   by T_T;<br>
          sub T h   by T_h;<br>
          sub s p   by s_p;<br>
          sub s t   by s_t;<br>
      } dlig;</p>
      <p>feature calt {<br>
          sub T H E by T_H_E;<br>
      } calt;</p>
