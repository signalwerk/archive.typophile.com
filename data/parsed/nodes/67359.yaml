    html: |-
      <p>&gt; Most font families contain all the ligatures and swash letters as seperate fonts rather than putting it into a single font (OpenType). Is there a reason for doing this?</p>
      <p>Most of those fonts are pre-OpenType. The preferred way to go these days is to put all these alternates into a single font… unless your users are in a software who doesn’t know how to handle OpenType features.</p>
