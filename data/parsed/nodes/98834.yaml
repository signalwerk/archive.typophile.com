      <p>This is a good place to start:<br>
      <a href="http://www.africanlocalisation.net/node/70" title="http://www.africanlocalisation.net/node/70">http://www.africanlocalisation.net/node/70</a></p>
      <p>See also<br>
      <a href="http://www.africanlocalisation.net/node/68" title="http://www.africanlocalisation.net/node/68">http://www.africanlocalisation.net/node/68</a></p>
      <p>and the slides of the presentation I made for Microsoft on the pan-African glyph set for their UI fonts (this is an over-exhaustive set, which includes some possible variant encodings and shapes for unstable orthographies and different nasalisation options):<br>
      <a href="http://www.tiro.com/John/African%20Presentation.pdf" title="http://www.tiro.com/John/African%20Presentation.pdf">http://www.tiro.com/John/African%20Presentation.pdf</a></p>
