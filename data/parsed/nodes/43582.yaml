      <p>Can anyone recommend a better solution than Fairfield light? </p>
      <p>I used Baskerville as body in a dark tan when I established a design that has been applied to a dozen different pieces. At the last minute, the body was changed to black on a layout, and the result made the type too heavy. I scrambled to come up with something suitable for the comp that had to go out in the next half hour. I settled on Fairfield light, but it doesn't have as nice an italic as Baskerville. Is there a prettier cousin someone can recommend? It has to be a close relation so as not to differ too greatly from the other extant pieces.</p>
      <p>Thankyou!</p>
      <p>Martha H.</p>
    html_clean: |-
