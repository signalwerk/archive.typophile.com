    html: |-
      <p>I would second taking a look at Monotype Baskerville. The fine strokes in the letterforms are fine indeed. The heavier strokes may be too heavy for you. But as I remember, I had to increase the weight of it A LOT to get a good printing, direct-to-plate, offset lithography, on Natures Natural (a recycled, uncoated sheet).</p>
      <p>Frequently, a serif font that is thin will have a lot of "sparkle"; that is, dramatic contrast between the light &amp; heavier strokes. Bauer Bodoni immediately comes to mind.</p>
