  html: <p>Anyone know if there was ever an official version of City released with a Stencil variant? I seem to remember seeing a few examples here and there (this is a title card from a BBC tv series from the 1970s), but I've never seen a digital edition of it. Easy enough to hack together in Illustrator, but if an actual typeface exists that'd be better.</p><div class="imageWrap"><img src="http://typophile.com/files/300px-Playfortodaytitles_3439.JPG"></div><p></p>
