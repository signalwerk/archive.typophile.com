    html: |-
      <p>.bmap is not a Windows file, it's a bitmap cache representation of the 'real' font. The AFM file is useless on its own, and so is the .lst file (that is not a part of a standard Type 1 Font distribution and can be <em>anything</em>).</p>
      <p>You cannot use the .bmap font in InDesign because that needs <em>real</em> fonts, not just bitmaps. It might work in other programs, though -- I dunno, always avoided them like the proverbial plague.</p>
      <p>I'm wondering about the untyped file -- OS X doesn't know what it is, so it presumes it's an 'executable', but you can be pretty sure it's not one. Can you open it with, say, Textedit, and see if it contains readable data, or just a jumble of strange characters?</p>
      <p>If it starts with something akin' to</p>
      <p>%PS-AdobeFont 3.0<br>
      %% All rights reserved bladibladibla<br>
      %% Some more stuff...</p>
      <p>it's the one file type I'm missing from your list, and you can try again after adding the proper .PFB extension to it.</p>
