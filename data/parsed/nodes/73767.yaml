    html: |-
      <p>It's possible that you have a Mac PostScript Type 1 font in which the resource fork has been unintentionally stripped out of the .bmap file. Mac screen font files often have that file extension. A Mac Type 1 font can't be used on a Mac if the screen font file is missing or corrupt. </p>
      <p>If you "get info" on the .bmap file, what is the file size? If it's 0k (zero k), then the .bmap file has become corrupted. This can happen when emailing or ftp'ing Mac font files without first compressing them.</p>
