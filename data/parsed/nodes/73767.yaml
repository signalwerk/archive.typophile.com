    votes: 0
    html: <p>Starting with Mac OS 10.3, the Finder includes compression, under the File menu as "Compress (whatever is selected)", or if you right click on a folder or file. This will create a .zip file. If you compress a Mac file with a resource fork (such as an old style Mac screen font file), it will be preserved when the file is decompressed on another Mac. No need for StuffIt unless you or the other party are using a version of the OS older than 10.3.</p>
