      <p>If the screen font file is corrupted (which it appears to be in this case), it will be impossible to install, no matter what folder it's placed into.</p>
      <p>Incidentally, the file with the ".lst" extension is added to font folders by certain Adobe apps (maybe just Acrobat). It is not part of the font. More like preference or cache file used by Adobe.</p>
