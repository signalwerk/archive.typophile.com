      <p>zip compression sometimes strips out Mac resource forks. It depends on the specific program/version; the zip utility included with MacOS X should do fine. </p>
      <p>Stuffit compression (<a href="http://www.stuffit.com/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.stuffit.com/</a>) handles Mac resource forks more reliably.</p>
