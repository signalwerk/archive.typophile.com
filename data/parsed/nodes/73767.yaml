    <p>hi everyone,</p>
    <p>i'm in need of some professional help guys, some time ago our company bought a font (well actually we payed for it when we hired a graphic designer, now we are trying to install the font he used for our brand identity on our mac but with no luck...hope someone here can help.</p>
    <p>these are all kinds of files in the folder:</p>
    <p>- .AFM files<br>
    - a file that has a black icon with in the corner saying "exec"<br>
    - there is also something in there with .lst at the end<br>
    - and a file with a .bmap extension.</p>
    <p>i tried everything, clicking on the exec file then a terminal window goes open saying "process completed"<br>
    I tried dragging all files in the "library - fonts" folder ...start up indesign but the fonts didn't show up...<br>
    when i click on the .bmap file, font explorer opens saying "no fonts imported" no fonts found in selected files or folders.</p>
    <p>could someone plays say what we are doing wrong here, pretty please!! :D</p>
