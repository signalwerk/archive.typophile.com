      <p>I have tried to make an Osmanya font with a calligraphic style many times and have failed. I have tried using extenders and other styles from other scripts. None of the styles I have come up with works. I would like to have a nice free Osmanya font as most are very crude.</p>
      <p>Also, if you know, can you show me how to make a new keyboard layout for Linux? I'm tired of using gnome character map to write Osmanya.</p>
