    <p>I've long been fascinated by exotic scripts, and have spent more than my fair share of time browsing my <a href="http://www.amazon.com/Worlds-Writing-Systems-Peter-Daniels/dp/0195079930" rel="nofollow" class="link-external">Daniels and Bright</a>, and looking through Unicode code charts.</p>
    <p>So now I'm thinking it might be a fun project to do a real font for one. The purpose of this post is to explore whether anyone out there is wishing for a font for an underserved script. What I'd most like to do is something like Jim Rimmer's <a href="www.p22.com/RTF/canadiansyllabics.html" rel="nofollow" class="link-lost">Canadian Syllabics</a>, applying a calligraphic style where previous fonts are much cruder. I was also reminded by the recent thread on <a href="/node/49264/" rel="nofollow" class="link-kept">Georgian fonts</a>, although it looks like there are beautiful fonts available.</p>
    <p>Some of the scripts that look appealing to me include <a href="http://www.omniglot.com/writing/phagspa.htm" rel="nofollow" class="link-external">Phags-pa</a> (for which I have some rare early 20th Century French samples), <a href="http://en.wikipedia.org/wiki/Osmanya_script" rel="nofollow" class="link-external">Osmanya</a>, <a href="http://en.wikipedia.org/wiki/Tifinagh" rel="nofollow" class="link-external">Tifinagh</a>, <a href="http://www.omniglot.com/writing/burmese.htm" rel="nofollow" class="link-external">Burmese script</a>, or maybe one of the Phillipine scripts such as <a href="http://www.omniglot.com/writing/hanunoo.htm" rel="nofollow" class="link-external">Hanunoo</a>.</p>
    <p>Is there anyone out there desperately wishing for such a font? Maybe considering producing a book in it? I'd likely make it available under a free license, so it could be included in Linux distributions among other things.</p>
