    <p>2 Aug 2013 — High-Logic today released an update of FontCreator, introducing new tools for creating scalable multi-color fonts.</p>
    <p>As announced earlier in the General Discussions forum (<a class="freelinking external" href="http://typophile.com/node/104174" rel="nofollow">Windows 8.1 Preview color font support</a>), Windows 8.1 will come with a new multi-color extension to the OpenType font standard. FontCreator is the first font editor which supports this powerful technology.</p>
    <p><a href="http://www.high-logic.com/font-editor/fontcreator.html" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.high-logic.com/font-editor/fontcreator.html" rel="nofollow"><img src="http://typophile.com/files/fontcreatorcolorpreview_6599.png"></a></div><p></p>
    <p>Full details and a <a class="freelinking external" href="http://www.youtube.com/watch?v=J4BSK_ASOlw" rel="nofollow">short video which shows how to create color fonts</a> can be found on the High-Logic website:<br>
    <a href="http://www.high-logic.com/" title="http://www.high-logic.com/">http://www.high-logic.com/</a></p>
