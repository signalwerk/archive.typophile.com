  html: |-
    <p>2 Aug 2013 — High-Logic today released an update of FontCreator, introducing new tools for creating scalable multi-color fonts.</p>
    <p>As announced earlier in the General Discussions forum (<a href="http://typophile.com/node/104174" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Windows 8.1 Preview color font support</a>), Windows 8.1 will come with a new multi-color extension to the OpenType font standard. FontCreator is the first font editor which supports this powerful technology.</p>
    <p><a href="http://www.high-logic.com/font-editor/fontcreator.html"><img src="/sites/default/files/old-images/fontcreatorcolorpreview_6599.png"></a></p>
    <p>Full details and a <a href="http://short video which shows how to create color fonts" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://short video which shows how to create color fonts</a> can be found on the High-Logic website:<br><a href="http://www.high-logic.com/">http://www.high-logic.com/</a></p>
