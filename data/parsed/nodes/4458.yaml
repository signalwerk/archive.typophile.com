    html: <p>Both "Beautiful ES" and "Splendid ES" are rip-offs of Bickham Script, which is protected by US Design Patents 407,108 and 426,570. This definitely infringes our patents. <br> <br>They didn't even change the em square either, so it's easy to see that the outlines seem to be stolen too (modulo conversion to TrueType), which would violate our copyright as well. <br> <br>I've pointed our legal and anti-piracy folks at it. <br> <br>T</p>
