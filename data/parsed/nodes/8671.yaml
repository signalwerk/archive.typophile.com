  - id: 56953
    user: 110
    date: 2003-02-06T12:11:00
    date_raw: 6.Feb.2003 12.11pm
    votes: null
    html: "<p>THX Dave, you make my evening, end of the week, weekend and possibly my month. And I totally agree with you about that sorry excuse for a classification system that [T-26] use on their website. But I still quite like their interface. And a fair share of their faces.    <br>    <br>Actually, I've known [T-26] to surface on the market back when I still worked for FontShop. I clearly remember what a breath of fresh air it seemed compared to the household names that populated the FontBook in those days. There were quite a few rubbish faces amongst them, but at last the grunge generation had their own type library. That's why I studied their catalogue avidly and got to know a few of their faces pretty well. Little piece of trivia: the Troubleman \"logotype\" is set in Escalido, a grunged-up Letter Gothic. Nothing spectacular, but it is what it is and does the job perfectly:    <br>    <br><img src=\"http://www.typophile.com/forums/messages/83/6349.gif\" alt=\"Troublemanlogo#3.gif\"></p>"
