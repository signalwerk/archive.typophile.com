    html: "<p>Well done, Yves! <br> <br>I'm peeved, though: I didn't know the face, but it sure seemed T-26ish to me, so I looked there in what seemed to me to be appropriate classifications. Of course, now that you've shown which font it is, I can see that they classified it as a \"headline\" font. Only...there is no classification \"headline\" under \"search by style.\" Their classification system bites. <br> <br>Still, knowing the face off the top of your head trumps looking it up, so I bow to you, sir. That, not speed, is true Hall of Fame material.</p>"
