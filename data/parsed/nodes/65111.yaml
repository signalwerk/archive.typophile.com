      <p>I’m sorry I misunderstood what you meant. I seem to have to study English more.<br>
      Do you mean you would like to replace latin characters of the Japanese fonts with other latin fonts and you would not like to change the widths of the words very much?<br>
      Indeed the latin part of Futo Go looks narrower than Helvetica, but if you set text in the both fonts, they are not different very much, I think.<br>
      The latin parts of Gothic MB101 and Shin Go are very wide. So you might run into trouble if you replace them with Helvetica.<br>
      Sorry I’m no good at English and cannot help you very much.</p>
