    <p>I got a catalogue typeset in Japan here with a lot of fonts I’ll have to replace.<br>
    It is to be adapted for Europe, so I don’t need to know anything about Japanese language fonts. But there is text set in latin, too. I need to know common fonts with similar metrics to replace:</p>
    <p>A–OTF Gothic BBB Pro Medium<br>
    A–OTF Gothic MB 101 Pro B<br>
    A–OTF ShingoGo Pro (the latin part looks like Eurostile)<br>
    A–OTF Futo Go</p>
    <p>Also there is Helvetica in there:</p>
    <p>Helvetica LT Std<br>
    Helvetica Neue LT Std</p>
    <p>What does the LT stand for or mean?</p>
    <p>Any help much appreciated (by Akira maybe?).</p>
