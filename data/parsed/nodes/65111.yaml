    html: |-
      <p>Hi Jan,</p>
      <p>Gothic BBB Medium and Futo Go are very similar fonts and you may regard them as fonts in the same family. Those are the most formal fonts among them that you listed.<br>
      Gothic MB101 B is more casual than the two.<br>
      Shingo Go, whose counters are very wide, is the most casual and modern.</p>
      <p>So you should replace Shingo Go with a font whose counters are wide, whose x-height is high and which is casual and modern.<br>
      Gothic MB101 B has a modern feel, too. Modern fonts might be good. Of course, Neue Helvetica is O. K., too. In my opinion, Grotesques fit rather than Humanistic Sans Serifs.<br>
      Gothic BBB Medium and Futo Go are more formal. So you could replace them with Neue Helvetica or any other Grotesques and Humanistic Sans Serifs.</p>
      <p>Regards,</p>
      <p>Akira</p>
