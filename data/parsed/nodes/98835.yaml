      <p>Parkinson for pedigree (1470 by way of ATF Jenson "on acid") and cultural associations (Rolling Stone, rock-and-roll). </p>
      <p>Whitman because it is a great face designed (and successful at) body-text -- plus I find it beautiful and well-made. </p>
      <p>I'm looking at other text faces too, to try to get a sense for what makes them work well. I thought it was, in part, the proportion of cap-height to xheight. The attachment in my original post blows that hypothesis away.</p>
      <p>edit: Something else just sunk in. XHeight has been a red herring for me. Alone, it doesn't really tell you anything about the vertical proportions of a typeface. If you don't also know CapHeight, AscHeight, and DescDepth, you don't really know a face. Also: vertical proportions don't really tell you anything about whether a face is a good text face. Contrast Sentinel with Whitman with your favorite cut of Jenson.</p>
      <p>So, what does?</p>
