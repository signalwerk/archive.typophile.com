      <blockquote><p>What I'm left with is that my question has pretty much devolved to: "hey y'all type designers, how much room do you typically leave above your ascender line and below your descender line?" </p></blockquote>
      <p>Amado — FWIW, when I designed Whitman I was under a good deal of historical influence from my study of Mergenthaler Linotype faces. In hot-metal, there were limitations for how close you could get to the top and bottom of the body without risking casting problems. </p>
      <p>Somewhere I have a chart with the production specifications that Linotype used for the various sizes. I think the average head/foot space was around 0.004 inch. But I don’t think I had that in front of me at the time, and I believe I undershot even that spec with Whitman.</p>
      <p>Anyway, by any standard, Whitman is rather small on the body, around 930 (not including f/g over/undershoots). Nowadays I tend to work to around 960–80.</p>
      <p>Of course, there’s no physical limitation with digital type production, and no one sets solid any more anyway. So these things are more about convention and expectations.</p>
      <p>In my opinion, the overall size on the body has less impact on Text vs. Display questions than the rest of your internal relationships — x-height, cap, ascender/descender, stems, set widths, fitting, etc.</p>
