      <blockquote><p>I wish to understand what the hell point size has to do with the actual vertical metrics of typefaces?</p></blockquote>
      <p>It doesn’t really have anything to do with it. The point size defines an imaginary block of vertical space, which the type designer has divided up to suit his whimsy. Within that <em>em</em> you'll get an ascender height, cap height, x height, baseline, and descender height (often even in that order!), but they could be in any proportion to one another and in any proportion to the em. What remains constant as you change the point size are the <em>proportions</em>.</p>
      <p>For example, here are an M from Perpetua, and an M from Calisto, both at the <em>same point size</em>. The squares have height and width equal to that point size.</p>
      <p><img src="http://upload.wikimedia.org/wikipedia/commons/f/f8/M_versus_em.svg"></p>
      <p>The designer might use only a tenth or a hundredth of the vertical space available (although, that would be a painful way to work).</p>
      <p>Why were you interested in Parkinson and Whitman for studying text v. display faces?</p>
