      <p>Traditionally, type design intended to be used at smaller sizes have the contrast between thick and thin reduced, compared to a similar design at larger sizes. This is because at small sizes you seem to be bumping up against some kind of visual threshold problem, and the thins seem to look a lot thinner, compared to the thicks, than when the same design is viewed in a large size. </p>
      <p>This is already true in normal book text sizes, say 9-12 point. Below 9 point, designs generally 'cheat' on visual size by increasing the x-height, and having shorter ascenders and descenders.  This makes the physical size of details of the design big enough that the eye can still recognize them without too much discomfort. For the similar optical reasons, the designs intended for small size also increase the inter-letter spacing. </p>
      <p>There are other more subtle effects, but these three: contrast, x-height and letter spacing are consistently attended to in traditional letter press fonts, and in current digital designs sensitive to optical size. </p>
      <p>Personally, I think the readability of text type benefits from some of these adjustments at larger text sizes (10-12 pt), which is why I made my <a class="freelinking external" href="http://www.fontbureau.com/fonts/WilliamsCaslonText/" rel="nofollow">Williams Caslon Text</a> the way I did.</p>
