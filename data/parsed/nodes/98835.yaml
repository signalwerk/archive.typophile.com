      <p>Mr. Tillman:</p>
      <p>Yes, Merlo will look very dark if set over 10-point and printed on an uncoated sheet. But even 11-pt will look quite good printed on a coated stock. </p>
      <p><cite>And the $64,000 question... How can you judge if a font is going to be okay, lets say printed offset on uncoated paper, by looking at the laser-printed copy.</cite></p>
      <p>Well, experience helps, but there is no substitute for actually making the test. Worth reading is</p>
      <p><a href="http://www.amazon.com/Counterpunch-2nd-Sixteenth-Designing-Typefaces/dp/0907259421" title="http://www.amazon.com/Counterpunch-2nd-Sixteenth-Designing-Typefaces/dp/0907259421">http://www.amazon.com/Counterpunch-2nd-Sixteenth-Designing-Typefaces/dp/...</a></p>
      <p>It may seem out of date, but the process one goes through, looking at how your "punches deliver ink when pressed into paper" has a modern equivalent.</p>
      <p><cite> People with limited or no experience are making these judgments, for paperback books.</cite></p>
      <p>Tell me about it. And they look like $hit.</p>
      <p><cite>Is there any way to judge, particularly for newer fonts? I feel like I'm flailing around here, but someone has to be the first to look at a font and say "yes it'll look okay, let's do it".</cite></p>
      <p>Again, experience is a good guide. But try this: take a magnifying glass and look at the characters as they are printed on paper, using the technology appropriate. Look how the ink spreads. Notice that the contrast (fine strokes to heavy strokes) changes. Or if you own the typeface, make a scan of the printed letters (laser versus offset/uncoated versus offset/coated) and bring all those up on the screen next to each other -- big, so you can see how the ink spread is different on the offset, and character formation &amp; inking different on the laser --  and finally compare the scan images to the glyph that was used in the typeface. Should be an eye-opener.</p>
      <p>You can see the same thing on the screen, sort of, by looking at text rendered at 10-11 point on a new I-pad versus a Kindle Fire. You might get an interesting answer in which is "better." I tried this with Utopia. The I-pad has the most faithful reproduction, but to me, the type looks better with the Kindle Fire. And who knows what Slimback was anticipating when he set the contrast of the glyphs? With this font, maybe the accuracy of the I-pad is a problem.</p>
