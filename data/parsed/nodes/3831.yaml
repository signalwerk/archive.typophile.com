    html: "<p> I did get the idea that they were people (although reading your description probably created a motivating context), but I couldn't see the feeding idea in there. Is it health care for birds?  ;-) <br> <br>Seriously: I think you need to make the \"f\" and \"t\" more like people - and as a result a little less like glyphs - just don't sacrifice legibility too much. <br> <br>Another idea: the name sounds like it's \"elevated\"; if your client wants to amplify that, put some kind of \"elevation\" in there, like making the \"ft\" rise higher; one nice thing about that is that it would convey \"our customers are more important than our company itself\" (never mind that's unlikely to be what they actually think at all). <br> <br>hhp </p>"
    html_clean: "<p> I did get the idea that they were people (although reading your description probably created a motivating context), but I couldn't see the feeding idea in there. Is it health care for birds?  ;-) <br> <br>Seriously: I think you need to make the \"f\" and \"t\" more like people - and as a result a little less like glyphs - just don't sacrifice legibility too much. <br> <br>Another idea: the name sounds like it's \"elevated\"; if your client wants to amplify that, put some kind of \"elevation\" in there, like making the \"ft\" rise higher; one nice thing about that is that it would convey \"our customers are more important than our company itself\" (never mind that's unlikely to be what they actually think at all). <br> <br>hhp </p>"
