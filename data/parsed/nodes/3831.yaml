    html: <p> If the concept of people feeding one another is important, perhaps you pull it out of the type altogether and look at other ways to transform "loftus" into an ownable logotype, whether through ligatures or another treatment.  <br> <br>A final logo system might be flexible, allowing the client to use the logotype or logo by itself, or  combinations of both to accommodate horizontal and vertical applications. <br> <br>jb </p>
