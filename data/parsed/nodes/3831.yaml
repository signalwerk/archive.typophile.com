    html: <p> I think it would look better if the tail you added was shorter...for the moment I prefer the logo without the tail, that makes the spacing tighter. When the "l" does not have the tail, it is close to "o", as close is "s" to "u", which gives a symmetry to the logo and considering the white that "o" and "u" have, the "ft" gets more vivid. <br>I liked the idea of Hrant to elevation "ft", but I am afraid if then the logo would be read "loft us"...which maybe is not bad now I think over. </p>
