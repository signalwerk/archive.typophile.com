    html: |-
      <p>Escrow is used for the headline serif, but I believe the text serif is Exchange from Hoefler &amp; Frere-Jones. See <a class="freelinking external" href="http://www.typography.com/about/clients.php" rel="nofollow">this article</a> about clients.</p>
      <p>- Mike Yanega</p>
