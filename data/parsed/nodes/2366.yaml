    html: "<p>I disagree. Iconic forms that are learned or open to multiple interpretations (for example: I saw a tailfin first) are more likely to be remembered. A good graphic symbol should be as simple as possible without being so abstract that it has no meaning. I think this it still makes sense as is--adding clouds or vapour trails would just muddy it up. <br> <br>To add more of a wing flavour, couldn't you perhaps add flaps or some other distinctive wing features? </p>"
