  html: <p>Hello. <br> <br>I'm creating a Estonian avation information webpage called 'Tallie' (the title might change), which offers information about international civilian and mil aircraft, texts about history, info about local companies and so on. <br> <br>Anyway, at first I was thinking about a logotype with similar motive to Boeing's logotype, but when developing one I got another idea- a logotype that symbolises the middle window of a commercial aircraft, which has a view to the wing. Here is the first version of it. <br> <br>Feedback about comosition, typography and logotype is welcome. <br>I will probably post the more Boeing-like motive later.</p>
  html_clean: <p>Hello. <br> <br>I'm creating a Estonian avation information webpage called 'Tallie' (the title might change), which offers information about international civilian and mil aircraft, texts about history, info about local companies and so on. <br> <br>Anyway, at first I was thinking about a logotype with similar motive to Boeing's logotype, but when developing one I got another idea- a logotype that symbolises the middle window of a commercial aircraft, which has a view to the wing. Here is the first version of it. <br> <br>Feedback about comosition, typography and logotype is welcome. <br>I will probably post the more Boeing-like motive later.</p>
