      <p>Of course the people involved in this would need to be secretive about their suspicions before MyFonts decides "who to free and who to blame".<br>
      But I think some are overplaying the Great Danger here. Note point 2 in Hrant's post (which does sound like he's planning a guerrilla war of sorts, but also shows a good dash of prudence), and that the goal of this is stated as making *recommendations* to MyFonts – not going out on the streets at night and blindly massacre unsuspecting type designers who might be forging stuff.</p>
      <p>That said, I also doubt the idea, while honorable, is actually practicable. For one thing, I wonder about the actual methodology of spotting the culprits. Dan makes a good objection, to start with. I worry that it sounds a bit too good/idealistic to be workable.</p>
