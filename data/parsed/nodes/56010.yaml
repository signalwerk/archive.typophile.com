    <p>Motivated by the honorable commitment on the part of MyFonts to remove fonts in their library that are plagiarized from other designs*, I would like to propose launching a concerted effort to purge MyFonts of such typefaces. I feel that this would be a great cultural service, as well as provide indirect financial support to scrupulous font designers in the long term. As such, foundries registered with MyFonts would be the main participants of this effort, although of course any qualified person should consider it.</p>
    <p>* <a href="http://typophile.com/node/55966" title="http://typophile.com/node/55966">http://typophile.com/node/55966</a></p>
    <p>Needless to say this should absolutely not become a witch-hunt, and we need to remain realistic. MyFonts is the referee, whose final decision cannot be contested; and we cannot use this opportunity to try to remove fonts simply because we think they're not well-made. Our only role would be to amplify the ability of MyFonts do its house-cleaning, to make it even better than it already is.</p>
    <p>The question is, how do we organize such a "committee"?</p>
    <p>My suggestion would be to:<br>
    1) Compile a list of willing volunteers, using this thread.<br>
    2) Implement an intelligent but fair mechanism of excluding saboteurs from volunteering.<br>
    3) Get a list from MyFonts of the alphabetic distribution of font quantities.<br>
    4) Assign the workload alphabetically to the volunteers.<br>
    5) Give the volunteers plenty of time (but still have some sort of deadline).<br>
    6) Require that the volunteers submit work-in-progress to the committee.</p>
    <p>In the end, the committee would hand over a list<br>
    of fonts to MyFonts, and then promptly disband.</p>
    <p>Please let me know what you think, and if you'd like to volunteer.</p>
    <p>hhp</p>
