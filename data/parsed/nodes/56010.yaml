      <p>&gt; how would people get access to the outlines</p>
      <p>That's something MyFonts would do (as Adam says he's done before) as a "stage 2". BTW, I personally don't think plagiarism is limited to swiping outlines; for example if somebody makes an Industria copy from scratch, I would think it should be removed (even though it's not illegal, at least not in the US).</p>
      <p>&gt; really easy to abuse.</p>
      <p>The saving grace is that the decision remains with MyFonts. All we would be doing is bringing things to their attention. And the reason this makes sense is because: there are so many fonts in their library; and many eyes are better than a few. In fact I see this as a continuous process (I mean even with existing fonts, not new ones) with repetitive iterations slowly weeding out problem fonts; a person who did the "P" fonts could take on the "Q" fonts afterwards, and find something the first "Q" screener missed. Waiting in your dentist's lobby? Instead of playing that dumb iPhone game, make yourself useful!  :-)</p>
      <p>&gt; I find Adam’s suggestion (send an email to MyFonts) easier to pursue.</p>
      <p>This is basically a scaled-up, organized version of that.</p>
      <p>&gt; What would the criteria be for “plagiarized”?</p>
      <p>That's a good question. But again, the criteria remain within MyFonts. Guidance from MyFonts would certainly help align our work with their "actionability".</p>
      <p>--</p>
      <p>Basically, it doesn't make sense to say: "It's not fair, because without your help MyFonts would never have caught that font."</p>
      <p>--</p>
      <p>What I'm picturing is neither self-righteous nor highly robust. I see it basically as a way to provide free manpower to MyFonts, our collective culture, and each other.</p>
      <p>hhp</p>
