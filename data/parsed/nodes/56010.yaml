      <p>Hrant (and everyone else),</p>
      <p>It's great to see that so many people are interested in making MyFonts even better! As I stated in the other thread, we encourage people to report anything they see on the site they think is plagiaristic. However, I wouldn't say we're at all worried or think that plagiaristic fonts are currently a problem.</p>
      <p>The specialized "report this font" feature is interesting, but to be honest, email is still probably the most useful for us. It allows people to fully describe their concerns and requires no extra design, development, or implementation time (the cost of which would detract from other things we could be doing to more effectively help our foundries sell their fonts). I would hope that if someone thought a font was plagiaristic, they would take the time to quickly open a new email, drop the URL in and describe their concerns.</p>
      <p>We obviously couldn't stop people if they wanted to make an organized effort to sift through the tens of thousands of fonts on the site looking for rip-offs… but in all honesty I don't think it would turn much up. We've taken our own efforts to eliminate plagiaristic material from the site quite seriously and I'm confident that very little has slipped through the proverbial cracks.</p>
      <p>But, by all means, if anyone thinks I'm totally wrong and that the site is indeed riddled with plagiaristic fonts, please let us know by sending an email with your examples and we will be happy to investigate.</p>
