    html: |-
      <p>My background is moral philosophy, and I'm trying to get my head/heart wrapped around the issue of this thread... there seem to be various 'streams' here, such as:</p>
      <p>1. Long-standing, historical, and institutional manipulations by large foundries (the multiple iterations and plundering of Linotype assets, the non-disguised Softmaker mass-theft, etc.). Perhaps I am unlearned in these matters, but it seems that this historical/institutional manipulation has gone largely unpunished... indeed... it seems to reverberate throughout various generations without a great deal of fanfare...</p>
      <p>1a. To take Avant Garde as an example, I'm still confused why the ITC release contains all the cool alternate characters, whereas the Adobe release of "ITC Avant Garde" does not... is there revenue sharing going on, or not? Why offer differing releases of the same typeface?</p>
      <p>2. The world of typography (even though the internet and other technologies have allowed for significant growth) is still a smallish world, and the politics of the players in this smallish world are human and prone to human frailties... such as recently witnessed in the case where Latinotype voluntarily withdrew a typeface:</p>
      <p>Dear friends of Latinotype,</p>
      <p>We feel it is a duty to inform you that we have removed the last typography published by Latinotype; "Bon Apettite" of Coto Mendoza.</p>
      <p>The reasons for this decision are the similarities of "Bon Appetit" with the font of Sudtipos "Lady Rene", along with respect and admiration we have for the designer Laura Varsky, we assume that "Bon Appetit" has formal and stylistic similarities with Lady René .</p>
      <p>We consider relevant assume our responsibility as foundry in our lack of rigor in the review of proposals with which we work with respect to those in the market; we ask<br>
      apologies to Sudtipos and to Laura. We made this decision the same day he introduced us comment.</p>
      <p>As a proposed solution company we are willing to recognize this fact a great opportunity for growth and improvement in our procedures in working with type designers from Latin America.</p>
      <p>Michael, Daniel and Luciano<br>
      Latinotype Team. </p>
      <p>Now, I am NOT a typographical expert, but most would admit that it is a real challenge to quantify that these two typeface are remotely similar to each other. Thus, it seems that politics, bad blood, or whatever you might call it, is simmering in this soup... and it is this human component that sometimes drives designers to "call foul"... I, for one, would not like to take responsibility to referee these tangled webs !!</p>
      <p>And, finally, 3: There seems to be almost a daily design of a new sans-serif typeface... and although it is laudable that people are creative... at some point, the tragedy of the commons kicks in... (and this is a pet complaint of mine: most of the new typefaces are simple affairs, not easily usable in professional settings which require condensed, compressed, narrow, variations, etc...)... I'm not sure what real benefit it is to go after all these "minor" offerings of a new sans-serif or other cute thing... their impact on typographical history will most likely be short-lived... so why go through all the effort to form committees, etc.?</p>
      <p>Hmmm.. that should be a bit more than 2 cents worth...</p>
