    <p><strong> <a href="/node/add/wiki?edit%5Btitle%5D=Indicies" title="Create node &quot;Indicies&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indicies</a>&nbsp;: <a href="/node/12082" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Publications</a>&nbsp;: <em>Das Schreiben als&nbsp;Kunstfertigkeit</em></strong></p>
    <p>A German book on <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Calligraphy</a>, written by <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a>. The book title could be roughly translated as: <em>Writing as a Technical Skill</em>. The book is subtitled (again, this is a rough translation) <em>A complete introduction to the learning of the writing styles necessary for the profession of calligraphy.</em> The first edition of <em><span class="caps">DS</span>aK</em> was published in 1925. Several editions followed. The following summary is based on the third edition, which was published in 1934 by the Publishinghouse of German Book Designers in Leipzig (<em>Verlag des Deutschen Buchgewerbevereins Leipzig</em>.</p>
    <p>The book block is a bit larger than <span class="caps">A4</span>. It contains 96 pages (including 23 pages of black and white photographs). The entire book is set in blackletter. Body text is in a <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a> that might be Koch’s <a href="/node/add/wiki?edit%5Btitle%5D=Fr%C3%BChling" title="Create node &quot;Frühling&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Frühling</a>. The bolder tiles and subtitles are set in Koch’s <a href="/node/add/wiki?edit%5Btitle%5D=Maximillian" title="Create node &quot;Maximillian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Maximillian</a>, which is not exactly a <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a>, but rather a combination of <a href="/node/13772" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">fraktur</a>, <a href="/node/14506" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Schwabacher</a>, and <a href="/node/add/wiki?edit%5Btitle%5D=Gotisch" title="Create node &quot;Gotisch&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gotisch</a> (<a href="/node/13831" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Textura</a>). There is not color in th book. All of the text and imagery is black, on off-white&nbsp;paper.</p>
    <p>Aside from calligraphic instruction, this book has a chapter on book design and binding, a chapter on the making of diplomas and certificates, and an appendix that details the proper writing and the devleopment of <em>Die Offenbacher Schrift</em> (<em>The Offenbach Hand</em>), a handwriting system for school children that seems to be based on <a href="/node/add/wiki?edit%5Btitle%5D=S%C3%BCtterlin" title="Create node &quot;Sütterlin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sütterlin</a>.</p>
    <p>Anyone who ever wondered how Rudolf Koch formed his letters with a broad-nibbed pen can learn that from this book in about five minutes, so well-formed are the illustrations. How one writes in another style is only covered in this book contextually, not quite through imagery (except the schoolchildren’s script in the appendix; there are also a various number of styles depicted in the 23-pages of photographic reference at the back of the&nbsp;book).</p>
    <p><strong>Critique:</strong><br>
    The German critic <a href="/node/12439" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hans Peter Willberg</a> (1930–2003), wrote in <em><a href="/node/add/wiki?edit%5Btitle%5D=Typolemik" title="Create node &quot;Typolemik&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Typolemik</a></em> that all of Koch’s students were trained to basically just copy his style, not to develop new writing forms. Reading this book, one would get that impression, too. It is important to remember that—especially with calligraphy—there can never be a “one size fits all” approach. The book’s own subtitle states that the book will instruct all manners of necessary hands. Yet real blackletter variation is not covered. Nor is Antiqua or Grotesk, two styles which were well in practice by 1925 in&nbsp;Germany.</p>
    <p><a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> has said that Koch’s interpretation of how the pen should be held is false. Koch implies in this book that the pen should be held so that the nib stays at a 45-degree angle. <a href="/node/12134" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Edward Johnston</a> had written early that the pen should be held so that nib is at a 30-degree angle. Zapf follows the Johnston&nbsp;practice.</p>
    <p><strong>Fazit:</strong><br>
    This is an invaluable book. Even if you cannot read German (or even if you can, but cannot read Fraktur), this book should be respected for the careers it launched: those of <a href="/node/12150" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Hermann Zapf</a> and <a href="/node/12242" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Gudrun Zapf von Hesse</a>, amoung many others. The book seems to sum up Koch’s ideas about writing, and Koch is consitantly held by typographers and calligraphers as one of the greatest masters of western calligraphic tradition. If you want to learn to write like Koch, this is the source. The images are understandable even without German&nbsp;fluency.</p>
    <p>The book is readily available in German antiquaries and used book stores. Try searching them with the website <a href="http://www.zvab.com"><span class="caps">ZVAB</span>.com</a>. The site has full English functionality, and the listed sellers usually ship to anywhere in the&nbsp;world.</p>
