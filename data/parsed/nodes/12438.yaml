    <p><strong> <a href="/wiki/Indicies" class="freelinking" rel="nofollow">Indicies</a> : <a href="/wiki/Publications" class="freelinking" rel="nofollow">Publications</a> : <em>Das Schreiben als Kunstfertigkeit</em></strong></p>
    <p>A German book on <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphy</a>, written by <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>. The book title could be roughly translated as: <em>Writing as a Technical Skill</em>. The book is subtitled (again, this is a rough translation) <em>A complete introduction to the learning of the writing styles necessary for the profession of calligraphy.</em> The first edition of <em>DSaK</em> was published in 1925. Several editions followed. The following summary is based on the third edition, which was published in 1934 by the Publishinghouse of German Book Designers in Leipzig (<em>Verlag des Deutschen Buchgewerbevereins Leipzig</em>.</p>
    <p>The book block is a bit larger than A4. It contains 96 pages (including 23 pages of black and white photographs). The entire book is set in blackletter. Body text is in a <a href="/wiki/Fraktur" class="freelinking" rel="nofollow">Fraktur</a> that might be Koch's <a href="/wiki/Fr%C3%BChling" class="freelinking" rel="nofollow">Frühling</a>. The bolder tiles and subtitles are set in Koch's <a href="/wiki/Maximillian" class="freelinking" rel="nofollow">Maximillian</a>, which is not exactly a <a href="/wiki/Fraktur" class="freelinking" rel="nofollow">Fraktur</a>, but rather a combination of <a href="/wiki/Fraktur" class="freelinking" rel="nofollow">Fraktur</a>, <a href="/wiki/Schwabacher" class="freelinking" rel="nofollow">Schwabacher</a>, and <a href="/wiki/Gotisch" class="freelinking" rel="nofollow">Gotisch</a> (<a href="/wiki/Textura" class="freelinking" rel="nofollow">Textura</a>). There is not color in th book. All of the text and imagery is black, on off-white paper.</p>
    <p>Aside from calligraphic instruction, this book has a chapter on book design and binding, a chapter on the making of diplomas and certificates, and an appendix that details the proper writing and the devleopment of <em>Die Offenbacher Schrift</em> (<em>The Offenbach Hand</em>), a handwriting system for school children that seems to be based on <a href="/wiki/S%C3%BCtterlin" class="freelinking" rel="nofollow">Sütterlin</a>.</p>
    <p>Anyone who ever wondered how Rudolf Koch formed his letters with a broad-nibbed pen can learn that from this book in about five minutes, so well-formed are the illustrations. How one writes in another style is only covered in this book contextually, not quite through imagery (except the schoolchildren's script in the appendix; there are also a various number of styles depicted in the 23-pages of photographic reference at the back of the book).</p>
    <p><strong>Critique:</strong><br>
    The German critic <a href="/wiki/Hans%20Peter%20Willberg" class="freelinking" rel="nofollow">Hans Peter Willberg</a> (1930–2003), wrote in <em><a href="/wiki/Typolemik" class="freelinking" rel="nofollow">Typolemik</a></em> that all of Koch's students were trained to basically just copy his style, not to develop new writing forms. Reading this book, one would get that impression, too. It is important to remember that—especially with calligraphy—there can never be a "one size fits all" approach. The book's own subtitle states that the book will instruct all manners of necessary hands. Yet real blackletter variation is not covered. Nor is Antiqua or Grotesk, two styles which were well in practice by 1925 in Germany.</p>
    <p><a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> has said that Koch's interpretation of how the pen should be held is false. Koch implies in this book that the pen should be held so that the nib stays at a 45-degree angle. <a href="/wiki/Edward%20Johnston" class="freelinking" rel="nofollow">Edward Johnston</a> had written early that the pen should be held so that nib is at a 30-degree angle. Zapf follows the Johnston practice.</p>
    <p><strong>Fazit:</strong><br>
    This is an invaluable book. Even if you cannot read German (or even if you can, but cannot read Fraktur), this book should be respected for the careers it launched: those of <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> and <a href="/wiki/Gudrun%20Zapf%20von%20Hesse" class="freelinking" rel="nofollow">Gudrun Zapf von Hesse</a>, amoung many others. The book seems to sum up Koch's ideas about writing, and Koch is consitantly held by typographers and calligraphers as one of the greatest masters of western calligraphic tradition. If you want to learn to write like Koch, this is the source. The images are understandable even without German fluency.</p>
    <p>The book is readily available in German antiquaries and used book stores. Try searching them with the website <a href="http://www.zvab.com" rel="nofollow">ZVAB.com</a>. The site has full English functionality, and the listed sellers usually ship to anywhere in the world.</p>
