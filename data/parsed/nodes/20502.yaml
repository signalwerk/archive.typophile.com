      <p>I like Copperplate when used properly. Problem is it has been ubiquitous for way too long, going back to hot metal days when it was one of the few widely available (hence all the wedding invites) and then on to the digital era when it was one of the first to be digitized.</p>
      <p>It's hard to be objective about a font that is so overused - are we reacting to it as a font or just the fact that we can't stand the sight of it anymore?</p>
      <p>That said I do still use it on occasion.</p>
