      <p>"Copperplate is not an inherently ugly font, but terribly misused."<br>
      Precisely, James. As it happens with a myriad of typefaces which got over-exposed in recent years.</p>
      <p>Copperplate is meant to be used in very small sizes, with discretion, and in black on white. More or less like the original Microgramma (Eurostile predecessor by A. Butti) was.<br>
      Using typefaces like they do today destroys all their context.<br>
      It is like judging a person's behavior as a whole by a single act.<br>
      Truly aberrant.</p>
      <p>Other possible examples:<br>
      · increasing the "Cap height" of Emigre's Democratica;<br>
      · applying a tridimensional cheap effect to typefaces imitating handwriting or calligraphy;<br>
      · using blackletter faces to represent "evil";<br>
      · using ITC Garamond to typeset a book in 11 pt. size (or less).</p>
