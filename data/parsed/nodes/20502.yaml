      <p>Copperplate was originally designed to mimic letters engraved in copper or brass plate, for wall plaques, monuments, tombstones and the like. These days it gets printed in ink on all kinds of other materials---no wonder it usually looks so incongruous and out of place. Look closely at 19th century buildings and monuments and you'll find copper plaques with Copperplate used the way it was meant (designed) to be, "...with corners sharpened with a flick of the burin." That doesn't preclude printing it with ink, as long as the treatment is very strict and conservative.</p>
      <p>Copperplate is not an inherently ugly font, but terribly misused. Goudy was one of the few type designers of genuine artistic ability. Typographers who say they dislike his fonts haven't acquired the requisite taste for his form of expression. Give it time and you'll eventually get it.</p>
      <p>Besides, associating ugly fonts with Fred Goudy (in the case of Copperplate) is erroneous because Copperplate's letter forms were not Goudy's invention. <a href="http://www.myfonts.com/fonts/wiescherdesign/copperplate-classic-medium/" target="_new" rel="nofollow">This blurb from Gert Wiescher</a> suggests the font we know as Fred Goudy's "Copperplate" is only one interpretation of a widespread 19th century engraver's letter form: <em>"...Among others (for example Deberny &amp; Peignot) F. W. Goudy’s cut for ATF around 1901 is probably the most widely known."</em></p>
      <p>j a m e s</p>
