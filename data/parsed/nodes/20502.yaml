      <p>Scott, I'm not sure what you mean by "true" with regard to that completely opaque alphanumeric naming system.</p>
      <p>The original Copperplate Gothics as provided by ATF are shown on pages 334–349 of the 1923 catalog. Somewhere on Flickr is a photo set of the whole catalog, I believe, so you could start there. (Sorry, I don't have a link. Someone here will.)</p>
      <p>The styles that ATF produced were Heavy Copperplate Gothic, Light Copperplate Gothic, Light Copperplate Gothic Condensed, Heavy Copperplate Gothic Condensed, Light Copperplate Gothic Extended, Heavy Copperplate Gothic Extended, Copperplate Gothic Italic, Copperplate Gothic Bold, and Copperplate Gothic Shaded.</p>
      <p>-- Kent.</p>
