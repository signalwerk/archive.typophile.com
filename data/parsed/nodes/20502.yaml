      <p>Nothing at all wrong with Copperplate per se. It's a very nicely made face, and it can be printed oh so sweetly letterpress from metal on card stock.</p>
      <p>But the arrangement of contemporary versions such as those named 31BC or 33BC leaves them open to mis-use. They are set up as two sizes of capitals, with the same baseline. (I'm not sure whether we should properly call these versions caps/small caps.) </p>
      <p>The problem comes with the figures, which are the same height as the larger caps. When figures are set alongside or amongst the smaller caps (on the lower-case/unshift keys), they are too prominent; they upset the flow of the line. It would be best to avoid such settings, but most people seem not to see this or to care.</p>
      <p>I got a charming business card the other day from a Bulgarian cellist. Charming because the design (with Copperplate) is positively Victorian, yet this fellow is a proponent of Balkan avant-garde music. The charm of the design was slightly lessened by this mis-use of Copperplate with regard to the figures in address, phone number, e-dress, etc.</p>
      <p>powers</p>
