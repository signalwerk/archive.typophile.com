    <p>Hi. This is my first post, so hopefully I'm putting it in the right place. I'm working on some wedding invites for myself and I've come across a design/typography issue that I've never encountered or really even considered. The bulk of the invites are (currently) set in Centaur MT Small Caps &amp; Oldstyle Figures, with accents in Miss Le Gatees. The names are set in the latter (script), and I am the third (legally Donald Studley, III). Obviously I don't want to put "III" in a script face, so does that mean proper typography calls for "iii" when abbreviating numerals in this way? Alternatively, since this is a wedding invite and formality generally rules over brevity (i.e. "at half after six"), am I to spell out "the third"?</p>
    <p>Any insight or feedback would be greatly appreciated. Thanks in advance!</p>
  html_clean: |-
