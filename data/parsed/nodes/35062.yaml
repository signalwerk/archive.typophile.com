    html: <p>I'd do what seems most aesthetically pleasing. Looking at Miss Le Gatees on Veer, you're completely right -- the "III" doesn't look good at all. "iii" is a possibility, although I prefer your idea of spelling out "the Third." Would "Donald Studley, 3rd" be acceptable? You can also see how using Centaur to write "III" looks. Centaur small caps "III" could work, but if you use Centaur and Miss Le Gatees in the same line as I've suggested, make sure that the color stays the same between words to ensure a professional look.</p>
