  html: |-
    <p>I am setting a large list consisting of city names and addresses (for a magazine ad). Some cities have up to 4 addresses, some have just one address. Everything should be centered (! not my “idea”), and when it is - there is just this whole list of addresses and no place for the product at all. Pretty bad, taking into consideration it is a product in a luxury segment of goods.</p>
    <p>So I was thinking, maybe there is a way it can be centered but separated somehow different? A middle dot is the only thing which comes into my mind. What else would you use?</p>
    <p>Cheers,<br>
    Alexey</p>
