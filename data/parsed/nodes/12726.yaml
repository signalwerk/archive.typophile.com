    html: <p>Can you choose any fonts?  I suggest convincing the client to set up the list as one paragraph using a script font like Kuensler two bold for the name of the City and Centaur for the address info.The script font will serve as an obvious indication that a new name&amp;info is beginning. These two fonts look classy when used together. Plus the main focus is the product and not 3/4 of a page used up by space for lines and lines of typed addresses.</p>
