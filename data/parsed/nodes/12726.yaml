    html: |-
      <p>I cannot really choose a font. Arial (kill me, but that’s what the design guideline says - when using a non-latin language) and, as a possibility, Engravers’ Gothic. I could use EG for city names and Arial bold and regular for store names and addresses. The list still eats up a lot of page space. My suggestion was to leave the city names, or - if that is too little - city name and a store name, without all the details… We’ll see if the idea comes through.</p>
      <p>Middle dots and bullets could work fine together.</p>
