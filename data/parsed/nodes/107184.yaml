    html: |-
      <p>Don't think it's a font, rather a custom lettering, a reinterpretation of "Didot".<br>
      Out-of-the-box: <a class="freelinking external" href="http://www.myfonts.com/fonts/phospho/aquus" rel="nofollow">Aquus</a>, <a class="freelinking external" href="http://ontwerp.tv/Neo2-2011" rel="nofollow">Vironica</a> (by Ontwerp, used to be freely available with <a class="freelinking external" href="http://www.neo2.es/blog/category/typography" rel="nofollow">Neo2 Magazine</a>)<br>
      To be tweaked: <a class="freelinking external" href="http://www.typography.com/fonts/didot/overview" rel="nofollow">Didot HTF</a> (best Didot on the market with highly contrasted styles), <a class="freelinking external" href="http://www.myfonts.com/fonts/hubertjocham/narziss" rel="nofollow">Narziss HJT</a> Drops (to get some ball terminals)</p>
