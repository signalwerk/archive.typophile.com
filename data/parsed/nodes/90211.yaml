      <p>So it is true that some people are smarter when they are silent, then when they speak :)</p>
      <p>Thanks Nick, I'm not native English speaker nor I actually speak so often English daily. But I'm trying to use it in writing form.</p>
      <p>It may sound funny cause thoughts are firstly "made" in Serbian and then (in many cases) literary translated to English (not from A to z, but the 90% of it).</p>
      <p>I'm aware what impression that might make to somebody and that in most cases it doesn't sound professional or business oriented or that people may find you not so serious as you're trying to be... </p>
      <p>I'll pay more attention in future on this, it is not so trite thing after all.</p>
      <p>Thanks!</p>
