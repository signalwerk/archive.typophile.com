    <p>Hello everybody,<br>
    I'm trying to make a monospaced version of my recently released font <a href="http://new.myfonts.com/fonts/v-design/orca-pro/" rel="nofollow">Orca Pro</a> and I don't how to correctly set widths and sidebearings.</p>
    <p>Let's say I want to set all glyphs to be 600 units wide, but so that they keep their relative sidebearings from the original font (e.g. the left sidebearing of letter "L" would be quite bigger than the right one).</p>
    <p>There are just few options how to set set width in Fontlab:<br>
    - center glyph<br>
    - align to left or right sidebearing<br>
    - keep as it is</p>
    <p>Unfortunatelly none of these options works for me, unless I make it manually glyph by glyph, which would be horribly tedious work.</p>
    <p>Any help would be really appreciated.</p>
    <p>Many thanks,</p>
    <p>Vit</p>
