      <p>Set all glyphs to 600 (or whatever). </p>
      <p>Example; for similar values of straight and curved sides: Select and centre glyphs H, O.</p>
      <p>Create metrics classes for left straight sides of H: B, D, E, F, I K, L, M, N, P, R</p>
      <p>Right straight sides of H: I, M, N.</p>
      <p>Left curved sides of O: C, G, Q</p>
      <p>Right curved sides of O: D, Q</p>
      <p>Do this for all glyphs with similar values, then you only have to alter the value of the base glyph to apply it to the others, plus some manual adjustment.</p>
