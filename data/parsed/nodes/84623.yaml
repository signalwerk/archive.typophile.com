    html: |-
      <p><cite>I have been wondering whether there could be some macro script or perhaps some trick using action-set or so?</cite></p>
      <p>Yes, you can reset the widths mechanically…</p>
      <pre>from robofab.world import CurrentFont
      font = CurrentFont()
      targetWidth = 600
      for glyph in font:
          widthDelta = targetWidth - glyph.width
          glyph.leftMargin += int(widthDelta/2)
          glyph.width = targetWidth
          glyph.update()
      </pre><p>
      …but what you'll find is that the contours of many glyphs, especially the widest and narrowest ones, will want to be adjusted to fit the width properly.</p>
