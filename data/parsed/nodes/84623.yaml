      <p><em>…which would be horribly tedious work...</em></p>
      <p>The problem is that the optical center is, arguably, more important in monospaced fonts, and it's the spacing element least amenable to automation. So IMO you're stuck with the tedium.</p>
      <p>Also, you may want to consider redrawing some of the glyphs for monospace function ("adjusted" as Matthew says).</p>
      <p>On the bright side, no kerning!</p>
