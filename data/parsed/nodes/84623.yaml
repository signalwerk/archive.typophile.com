      <p><em>What he is asking is if he can keep the hard work he has done for that font, and copy it over to the monospaced version.</em></p>
      <p>The spacing paradigm for proportional and monowidth is not the same.<br>
      Optical centering plays a larger role in monospace.</p>
      <p>In theory, there are (at least) three letter spacing parameters:</p>
      <p>1. Proximity distances, e.g. to avoid extremity collisions<br>
      2. Counter space, i.e. the white space between glyphs<br>
      3. Optical centre</p>
