    html: |-
      <p>The thing is setting proportional shapes into a standard width and making sure they are optically centered isn't going to give a great result. The reason is that to make it work you will end up with a hideously widely spaced font. Instead, you probably want to squash that w and extend that i rather than leaving the i floating in whatever space is wide enough to fit everything.</p>
      <p>I suggest that you begin with your n &amp; o and at slightly wider glyphs like d b p q and find your base width from these. You can probably live with adding a bit of extra space around the o and leave it alone for now. Next begin adjusting shapes so they fill this new space evenly. You may need to expand your s and maybe your a. Compress your m.  And so on. </p>
      <p>This will be fairly intensive design work for certain glyphs - but that's how you make a real monospace.</p>
      <p>Best wishes!</p>
