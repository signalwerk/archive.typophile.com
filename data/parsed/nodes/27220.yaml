  html: "<p>POSITION AVAILABLE <br> <br> <br>Title: FONT PRODUCTION ASSISTANT <br>Location: New York, NY <br>Date: 21 March 2005 <br> <br> <br><a href=\"http://www.typography.com\">Hoefler &amp; Frere-Jones</a> (H&amp;FJ) specializes in the design and production of original typefaces for editorial, institutional, and corporate clients. We are currently looking to hire a full-time developer to assist in the production, testing, and manufacture of digital fonts. <br> <br>Candidates should have an interest in typography, first-hand experience with digital font development tools such as FontLab, and some experience with publishing packages such as InDesign and QuarkXPress. Strong candidates will be familiar with RoboFog or RoboFab, have experience in developing feature-rich OpenType fonts, and be fluent in at least one programming language. <br> <br>Duties will include the production, testing, and manufacture of fonts in industry-standard formats (such as PostScript and TrueType for both Macintosh and Windows), as well as the ongoing investigation of developing font technologies. This person will work with H&amp;FJ's design and sales staffs to propose solutions to both technical and typographic problems, and will be responsible for assisting a range of different kinds of clients with font implementation. <br> <br>Applicants will be expected to exhibit strong analytical skills, good problem-solving abilities (and a predilection for technological solutions), and excellent verbal and written communication skills. Professional experience in the field is encouraged but not necessary. This position is open to applicants of all levels, from recent college graduates to experienced type developers. <br> <br>The position is full-time in our offices in New York City. <br> <br>Required Experience: <br> <br>   - Working knowledge of FontLab <br>   - Proficiency with the Macintosh operating system (OS9/OSX) <br>   - Proficiency with Microsoft Windows XP <br>   - Working knowledge of earlier Windows operating systems <br> <br>Preferred Experience: <br> <br>   - Object-oriented programming experience (ideally Python) <br>   - Familarity with editorial pagination systems <br>   - BS/BA or equivalent <br> <br>Please send r</p>"
