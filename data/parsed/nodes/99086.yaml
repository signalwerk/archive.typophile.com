    html: |-
      <p>Looking at the two scripts, it seems to me that while Thirsty Script and Wisdom Script both belong to the same general category of scripts, the former isn't a copy of the latter; Wisdom Script has the distinctive characteristic of being condensed and more squared-off (less rounded) than a conventional script, which Thirsty Script avoids.</p>
      <p>As for the source for those fonts, wouldn't it be the same source as gave rise to <a class="freelinking external" href="http://www.impallari.com/lobster/" rel="nofollow">Lobster</a>, or <a class="freelinking external" href="http://canadatype.net/fonts/bolero" rel="nofollow">Bolero</a> - although that one is perhaps not a fair comparison, being closer to a more generic script - or whatever was the source of Dieter Steffmann's Marketing Script, especially. That one reminds me of what I had in mind here...</p>
      <p>Or there's Deftone Stylus from Typodermic, as well.</p>
    html_clean: |-
