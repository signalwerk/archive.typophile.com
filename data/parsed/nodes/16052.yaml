      <p>I've had the same frustration since upgrading to OSX 10.8.4.  I copied the symbol from a Wikipedia website and paste it into my documents as needed:  ≈<br>
      From my own keyboard, best substitute I've found is the isomorphism symbol, a single wavy line over an equal sign that can be accomplished in the font 'Symbol" by striking the @ sign (capital 2).  Second option is the equivalent symbol, a single wavy line on the capital key under your esc key upper left on your keyboard.</p>
    html_clean: |-
