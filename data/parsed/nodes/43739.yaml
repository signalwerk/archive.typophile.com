      <p>There is a revealing story about giving the benefit of the doubt in the Talmud. The sages said "Be judging every person in a favorable light." So the question is: What does that mean? So the story goes that a certain famous sage was seen going into a house of prostitution with a sack of money, staying for a half hour, and later emerging with a young woman, and without the money sack. "How do you judge that in a favorable light?" a sage asks his student.  The student answers: this was a time of war, and his sister had been captured and sold into prostitution; he went to pay a ransom to rescue her before anything bad could happen to her. --And that was indeed the case, the story concludes. </p>
      <p>Things are not always what they seem, and our anger is easily aroused, at least if you are anything like me. I try to remember that story and smile--which also helps.</p>
