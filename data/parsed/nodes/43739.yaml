    html: |-
      <p>And by generally I mean, of course, altogether. Name-calling is for school yards and this isn't a school yard. And even there it isn't appropriate. </p>
      <p>We all need to try to read between the lines a little more or ask more questions to discover what is in between the lines. Assuming only causes problems. If you have a sincere question as to why someone posts something then ask the question. Don't make an assumption and post based on that. We, Typophile as a collective, can benefit from each other only if we allow for the collective to exist. Name-calling is one way to destroy that collective. It is human to disagree with someone's POV, but it is inhumane to debase that person only because you disagree and further not allow that person to have their own POV. </p>
      <p>When you participate in online discussions you agree to use common courtesy—which is common sense to do so. We've lost a few people because this doesn't always happen.</p>
