    <p>a recent job solicitation on multiple forums triggered a little debate about forum cross-over, and it occurred to me (as a relative newbie) that the forum guidelines are pretty lax...  i'm ok with that, as i enjoy browsing, but i do notice type ID queries in just about every forum as well as lots of design critiques and software questions outside of their appropriate categories. it seems that many folks simply default to "general discussions" for their posts.</p>
    <p>two questions : </p>
    <p>do we collectively care enough to try and reinforce the categories ?</p>
    <p>and :</p>
    <p>what is the general policy toward job / project offers ?<br>
    ( i don't see many here, and i don't come to typophile to find them - just wondering).</p>
    <p>also : thanks in advance and perpetuity to moderators for their sisyphean efforts.</p>
