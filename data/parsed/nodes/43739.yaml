      <p>There is simply no way to ensure posting will happen in the appropriate areas, not with the number of visitors Typophile sees, but as Tif said, part of what the moderators do is to move threads into other topic areas if necessary and keep everything tidy.</p>
      <p>Though we'd love to have the boards organized as efficiently as possible, there are no set rules that say software discussions must be kept within the Build section, or logo discussions under the umbrella of Critique. In coming months, we will be making some minor tweaks here and there, and part of that will hopefully assist users, especially newbies and first time visitors, in finding and posting to the appropriate sections. Type ID is certainly an area that needs this attention, and much of the issue is simply exposure. A significantly large % of visitors do not land on the "Forum Topics" page so they may not be aware that the option exists until after they have posted.</p>
