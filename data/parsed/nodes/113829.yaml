    html: |-
      <p>Good call, Don, looking into Orator I found Orator 10 (<a href="http://www.myfonts.com/fonts/tilde/orator-10/">http://www.myfonts.com/fonts/tilde/orator-10/</a>), wich appears a bit wider, thus a slightly better match for the letters. Then I checked again the article from which the image is taken (there's a picture of a dashboard with an IBM logo on it... I was looking for a pun ;-) and noticed this:</p>
      <blockquote><p><strong>UPDATE:</strong> Heather, in the comments to this post, has correctly identified this font as Manifold from the <a href="http://munk.org/typecast/2013/11/03/dsg-ibm-selectric-type-element-catalog-type-styles/">DSG IBM Selectric Type Element Catalog</a>.</p></blockquote>
    html_clean: |-
      <p>Good call, Don, looking into Orator I found Orator 10 (<a href="http://www.myfonts.com/fonts/tilde/orator-10/" class="link-external">http://www.myfonts.com/fonts/tilde/orator-10/</a>), wich appears a bit wider, thus a slightly better match for the letters. Then I checked again the article from which the image is taken (there's a picture of a dashboard with an IBM logo on it... I was looking for a pun ;-) and noticed this:</p>
      <blockquote><p><strong>UPDATE:</strong> Heather, in the comments to this post, has correctly identified this font as Manifold from the <a href="http://munk.org/typecast/2013/11/03/dsg-ibm-selectric-type-element-catalog-type-styles/" class="link-external">DSG IBM Selectric Type Element Catalog</a>.</p></blockquote>
  - id: 591215
