    date: 2014-10-22T09:56:00
    date_raw: 22 October 2014 - 9:56am
    votes: null
    html: |-
      <p>I agree Riccardo, Manifold it is.<br>
      Unfortunately we are stuck with having only the Orator digital versions. I suppose the easiest way to mimic Manifold is to expand the width of Orator, perhaps by something over 120% and, if a closer match is desired, modify a few characters, such as _G_, _Q_, _@_, _$_, and _&amp;_. Also some revision of the vertical alignment of the various numbers.<br>
      Don</p>
