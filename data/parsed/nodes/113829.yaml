    html: |-
      <p>Orator, designed in 1962 for IBM,  is fairly close for all numerals, including an open _4_ and banker's flat top _3_. Substitute _I_ for _1_. <a href="https://www.myfonts.com/fonts/linotype/orator/">https://www.myfonts.com/fonts/linotype/orator/</a><br>
      Don</p>
