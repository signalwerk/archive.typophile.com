      <p>Because they are sheared and they haven't had the same widening as other characters, your /L/s now look rather weak. Maybe you should try thickening their horizontals. It might also be the case that your overshoot on the curves is a bit too much top and bottom.</p>
      <p>I'd sure vote for two apostrophes. For correctness, and because with just the one, it looks a bit like "N'LOAD" is one word (like "O'Neill or "D'Arby").</p>
