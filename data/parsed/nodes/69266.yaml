    html: |-
      <p>May your mouth be golden, Tomi, and LNL becomes an international success! But now they are just friends of mine offering their services to local ad agencies and the like. Mostly their logo will be advertised on banners at events and filming locations. I think they'll need their logo displayed clearly for potential clients to make a connection with the verbal name if they hear it afterward, when the LNL sales person gives them a call.</p>
      <p>I know that in the end the logotype is perceived and recognized as a shape rather than as words, but this takes lots of exposure and $.</p>
      <p>On second thought, you may be right. A two-line book face solution may be more readable than my take on this condensed sans, but it's the distinct shape that I'm after so I already made that compromise. Why not unify this shape?</p>
