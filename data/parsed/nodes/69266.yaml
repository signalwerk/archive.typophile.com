      <p>I see what you say about the L. I also feel the O is too wide now. Also, in the very first example, at the top, the narrower counter of the O hides better the baseline overshoot. I will try a compromise - narrowing a little the O and bringing it's height closer to the cap height while decreasing the angle on the L ending and/or thickening the horizontal.</p>
      <p>Apankrat, I've experimented with other n heights or shapes - to get rid of the apostrophes altogether - but a smaller n brings too much complication to the design.</p>
      <p>Useful thoughts, thank you!</p>
