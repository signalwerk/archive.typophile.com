    <p>Hello!</p>
    <p>This is a logotype I drew for a video production company. To soften a little the geometric look, I drew the L with a diagonal ending stroke and the K with the chevron disconnected from the stem. The N is a lowercase.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lnltype_5363.gif"></div><p></p>
