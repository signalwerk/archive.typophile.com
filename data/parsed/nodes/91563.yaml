      <p>Sure, it is not the metal Signal. What I am saying is that there are too many similarities to be <strong>not</strong> related to Signal.</p>
      <blockquote><p>
      Like Elan, Mammut, Flott, Blizzard, Achtung …
      </p></blockquote>
      <p>Yes, I remember. Still, none of these come as close as Signal does.</p>
