      <p>I doubt it’s Signal. The p is so different. Maybe a photo-mock, ja.<br>
      There have been many scripts like this. Remember when we tried to ID Erik’s poster face, Florian? <a href="http://www.flickr.com/photos/kupfers/5927159773/" title="http://www.flickr.com/photos/kupfers/5927159773/">http://www.flickr.com/photos/kupfers/5927159773/</a><br>
      Like Elan, Mammut, Flott, Blizzard, Achtung …</p>
      <p>I uploaded some more Signal.<br>
      Light: <a href="http://www.flickr.com/photos/kupfers/6881334914/" title="http://www.flickr.com/photos/kupfers/6881334914/">http://www.flickr.com/photos/kupfers/6881334914/</a><br>
      Bold: <a href="http://www.flickr.com/photos/kupfers/6001492471/" title="http://www.flickr.com/photos/kupfers/6001492471/">http://www.flickr.com/photos/kupfers/6001492471/</a><br>
      Script: <a href="http://www.flickr.com/photos/kupfers/7027433463" title="http://www.flickr.com/photos/kupfers/7027433463">http://www.flickr.com/photos/kupfers/7027433463</a><br>
      And Deutsch, that one is fun: <a href="http://www.flickr.com/photos/kupfers/7027431257" title="http://www.flickr.com/photos/kupfers/7027431257">http://www.flickr.com/photos/kupfers/7027431257</a></p>
