      <p>Yes, with that e and n, it is clearly some version/descendant of Signal.<br>
      Note that Wege’s original version had three weights (with Script-Signal being lighter, and <a href="http://www.flickr.com/photos/kupfers/6001492471/" rel="nofollow">Block-Signal</a> bolder). It also offered both forms of the lowercase r. It is a pity that the digital version is so limited.</p>
