    html: |-
      <p>I think the Hudson's Bay Company logo and the lettering in the banner are custom lettering. The main logo is a simplified blackletter script, somewhat like <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/cloister-black/" rel="nofollow">Cloister Black</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/letraset/agincourt/" rel="nofollow">Agincourt</a>, but it doesn't match any blackletter font I could find.</p>
      <p>I think the sans serif lettering at the bottom of the sign looks like Helvetica.</p>
      <p> - Mike Yanega</p>
