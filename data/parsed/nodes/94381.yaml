    <p>The July edition of the Metal Type newsletter is now out.</p>
    <p>This month's additional video footage is of the Olympic Torch Relay passing through my home town, the historic city of York, in the UK.</p>
    <p>Click here to take a look at this month's video:<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=17" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=17">http://www.metaltype.co.uk/rail/clicks/click.php?id=17</a></p>
    <p>There were plenty of interesting articles posted onto the forum last month, here's a 6-magazine Italian Linotype machine.<br>
    <a href="http://www.metaltype.co.uk/rail/clicks/click.php?id=12" title="http://www.metaltype.co.uk/rail/clicks/click.php?id=12">http://www.metaltype.co.uk/rail/clicks/click.php?id=12</a></p>
    <p>There's also a superb video about Edinburgh book publishing house R &amp; R Clarke, concentrating, in particuar, on the lives of the workforce,<br>
