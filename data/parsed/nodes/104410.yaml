  html: |-
    <p>Bloomberg Businessweek's international cover for June is, according to the editiors,  "ultra kawaii" [ultra cute] with a pic of Japanese PM Shinzo Abe, bats, crying clouds, teddy bears, bows, life savers etc and a balloon like font identical to the word shown here:<br>
     </p><div class="imageWrap"><img src="http://typophile.com/files/KawaiiFontSM_4176.jpg"></div><br>
    The word is taken from a pic inside the North American edition. I only have a thumbnail of the international cover.<br>
    Kawaii is not my area of expertise so I am seeking help in IDing the font. If not the exact one, then some close ones.<br>
    Thanks<br>
    Don<p></p>
