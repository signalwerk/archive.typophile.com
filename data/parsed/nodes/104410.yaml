      <p>Thanks for the Blambot suggestion. Closest Blambot is Boogers BB:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BoogersBB_3450.jpg"></div><br>
      The S is almost spot on. No lower case for i, a, e. Sniglet is better for the inflated balloon effect, but Boogers is easier to edit than Sniglet.<br>
      Your suggestion of Blambot has prompted me to also check Comicraft.<br>
      Don<p></p>
