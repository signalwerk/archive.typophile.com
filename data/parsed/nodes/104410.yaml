      <p>It's in the kawaii ball park -- the sample image even mentions rainbows &amp; kitties. Haley Fiege's vfb embedding settings say "everything is allowed" so it would seem o.k. to edit it to lighten the weight to approximate the BBW lettering,  to try and capture the creases in letters like the o, and to push letters off a strict vertical axis to get the jumbled together effect.<br>
      Do we have any other candidates?<br>
      Don</p>
