      <p>Fuschia,<br>
      I went through this exercise a few years ago when I redesigned a fashion magazine. The didones have been inextricably linked to fashion for decades and it's hard to get away from them unless you're trying to do something edgy or undergound. I ended up going with Didot Elder for display as it really stands out from the competition and is beautifully drawn (esp. the 's' with ball terminals), but it has a polarizing effect on people and receives raves and criticism in equal measure.</p>
