  html: |-
    <p>I work for a fashion and lifestyle magazine, we are currently using Linotype Didot as the main headline/display font. We are looking at revamping the magazine in the next few months and I would really like to change the font to something that still has the essence of Didot (clean, elegant) but is fresher, more modern, funkier ... more 'now'! and hopefully with a larger family of weights to work with.</p>
    <p>Would appreciate your sage advice ...!</p>
