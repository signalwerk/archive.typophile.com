      <p>2 thoughts:<br>
      - <a href="http://typography.com/fonts/font_overview.php?productLineID=100033" rel="nofollow">Archer</a>. Could maybe be seen as Didot's distant kissing cousin. (Ok. Maybe that's a stretch. It is a cute typeface and I'd kiss it too.)<br>
      - <a href="http://typography.com/fonts/font_overview.php?productLineID=100031" rel="nofollow">Chronicle</a>. Scotch is all the rage. Great range of weights and widths too.</p>
      <p>Another thought. Don't go drastic, just go better. <a href="http://typography.com/fonts/font_overview.php?productLineID=100004" rel="nofollow">HTF Didot</a>. A few other fashion magazine are trying to use them right now. But failing miserably. It deserves to be used in a grand way.</p>
