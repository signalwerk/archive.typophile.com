      <p>&lt;Self Promotion&gt;</p>
      <p><a href="http://www.kentlew.com/Type.html" rel="nofollow">Whitman</a> has some affinity with Moderns. I don't know if it will strike you as a suitable alternative. It's found a happy place in some bridal magazines.</p>
      <p>There is a PDF sample of the Display fonts at <a href="http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf" title="http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf">http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf</a></p>
      <p>The Display fonts aren't available via Font Bureau's Retail library yet, but you can contact them directly if you want to explore these for your publication. Also, I recently created Titling versions with even more contrast for <cite>Fortune</cite> magazine, which might be of value to fashion/lifestyle. The more the contrast, the more Bodoni-esque the design becomes. You can talk to FB about these as well.</p>
      <p>&lt;/Self Promotion&gt;</p>
      <p>-- K.</p>
