      <p>I could write a short book on this; but for now, a short paragraph:<br>
      To me display faces are too superficial, too predictable. Because display faces pander to our conscious -and transient- tastes, making a successful display face involves only moderate skill, and only one notable talent: discerning what will be fashionable in the immediate future. Success in display face design is also largely a matter of luck - which to me is a turn-off. In contrast, making a good text face requires grasping and balancing so many subtleties, and having such a command of spacing and texture, that it takes my breath away. A text face reflects the personalities of billions of people, over centuries.</p>
      <p>hhp</p>
