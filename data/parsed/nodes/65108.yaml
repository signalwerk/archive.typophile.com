      <p>My disappointment with Pentagram's North Carolina Museum logo is perhaps because I was already dismayed by their Museum of Art and Design logo. ([<a href="http://www.madmuseum.org/]">http://www.madmuseum.org/]</a>)</p>
      <p>In presenting the process of the latter at a recent AIGA event, Michael Bierut flippantly and openly admitted that the creation of the letterforms by using a circle and square was less an idea and more about a formal quality that has been exhaustively "explored" for the better part of a hundred years.</p>
      <p>These were early Bauhaus experiments; we should stop calling them fresh. The Weimar designers in the 1920s and 30s moved on, and so should we.</p>
