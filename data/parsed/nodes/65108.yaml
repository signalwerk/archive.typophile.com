    html: <p>Hmm Hrant - "the real thing." Not sure what this is, but I think from the drift of the conversations that "the real thing" is text type as opposed to display lettering or type, whichever you prefer. Is text type hard to design? Yes, very. Is display type hard to design? Well in my opinion, yes. Good design is just that, good design, and bad design is bad design. Display type serves a purpose and if the purpose is served by the new trend in very heavy, at times difficult to read types, so be it. If one could find a generalization about this it is that display type is very much dependent on fashion or the fashion of the moment, while text type rarely falls in line with this. Baskerville, Garamond, Caslon, Bodoni, Fairfield, and others are as much in use today as text type as they ever were. The images presented here by Nick S and Eliason are examples which make my point re display as a statement about the fashion or design trends of the times.</p>
