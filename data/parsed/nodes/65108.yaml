      <p>I don't have any plans to design a type in this genre.</p>
      <p>Type genre has nothing to do with whether something is type or lettering.</p>
      <p>The lines between type and lettering have become blurred by OpenType alternates.<br>
      When it's possible to set a wordmark or headline with a font that has lots of alternate glyphs to chose from, including swashes, and do so either by selecting from a glyph palette, or going with the contextual substitutions built-in to the font, then the process of typographic design is more like that of lettering.</p>
      <p>This isn't really new. The famous Photo-Lettering Inc. was a type house (mid 20th century).<br>
      They'd work from film-strip fonts, and then modify details of a setting by hand, e.g. making ligatures.<br>
      So was that type or lettering?</p>
      <p>Duchamp would have called it an assisted readymade.</p>
      <p>Real display lettering is distinguished by the possibility that you might get your hands dirty--but so is real typesetting.</p>
