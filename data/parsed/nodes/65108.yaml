    <p>What is everyone's stance on the super-heavy, modular, geometric trend that's coming from various design boutiques these days? I'm talking stuff that you'd see featured every now and then on <a href="http://www.behance.net/">Behance</a>, and in the work of  <a href="http://www.non-format.com/showcase/milky-disco-2/1/">Non-Format</a>. </p>
    <p>Usually letters are deconstructed into basic shapes or pure line, then modularly designed, edging the border of legibility. I've seen it referred as type and typography countless times, but in my opinion it's more along the lines of display lettering. I guess that sorta counst as type right? Is this artistic style a welcome departure from traditional typography, or is it in danger of hijacking the definition of what "type" is?</p>
