    html: <p>you should be commended for doing something from scratch. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br>i'd second Scott's suggestion for your curves. You have curve-straight-curve  <br>thing happening + the skewed bowl shape makes the 'l' and 't' stand out as being too upright. <br>Maybe the left side of the 't' crossbar could be reined in a bit. <br> <br>also, in context, the m feels a bit wide. the n + n usually <br>needs to be narrowed. <br> <br>And the bottom of the 't' might need to dip a little lower <br>to rest on a common optical baseline. <br> <br>I'm wondering, however, how this contemporary look <br>fits in with a candle manufacturer. <br> <br>does the company have a website  <br> <br> <br>bj <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/33596.jpg" alt=""> <br> <br>might be easier for others to critique a weebit smaller. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
