    html: "<p>I emailed lineto. <br>Here's what they wrote back: <br> <br> <br>dear karl frankowski, <br> <br>thank you for your recent inquiry at lineto.com, and for your interest in <br>the 'alpha headline' font. <br> <br>'alpha headline' was designed by cornel windlin in 1993, and was first <br>released on the lineto site at its start in 1999, where it has been one of <br>the most popular fonts. it has been taken off our library very recently <br>because it is being developed into a family of four fonts, including a <br>newly-designed full lower case sets, for the exclusive use of one client. <br>the licensing agreement prevents us from selling the fonts for the next 10 <br>years. <br> <br>we will be removing the type specimen from the site at our next site update, <br>when we will present a number of exciting new typefaces from various lineto <br>designers. please let me know if you would like to be notified once the <br>update is online. <br> <br>***** <br> <br>So for the next 10 years, I guess we'll have to use <a href=\"http://www.identifont.com/show?4W1\">carplates</a>. <br> <br></p>"
