    <p>I’ve just released seperate Cyrillic out of the Andron stock.<br>
    You’ll find two versions and all about it <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=315" rel="nofollow">here</a>.</p>
    <p>A third package is available to especially furnish the needs of decent Serbian typesetting.</p>
    <p>For those who want to try out there is a special <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=316" rel="nofollow">Test-Licence-Offering</a> for a limited time.</p>
    <p>Your comments will be considered for a possible future update.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AND_SATZ_1_2_CY_2_SRB_3645.JPG"></div><p></p>
