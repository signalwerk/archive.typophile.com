    html: <p>Kyle, <br> <br>I assume you have <a href="http://www.adobe.com/type/browser/F/STUQ/F_STUQ-10005000.jhtml">Studz</a> from the folio? :-) <br> <br>Seriously, perhaps <a href="http://www.adobe.com/type/browser/P/P_1702.jhtml">Calcite Pro Black</a> if you've got it. It looks like it has the right balance of heft without being ITC Machine :-) <br> <br>You might also consider a slab serif for your text. Lubalin Graph? Serifa? Or even possibly headlines. <br> <br>Randy</p>
