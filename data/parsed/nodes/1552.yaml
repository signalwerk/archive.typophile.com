    date: 2003-10-07T19:00:00
    date_raw: 7 Oct 2003 — 7:00pm
    votes: null
    html: "<p>I've always liked Penumbra, although it's probably the font that's suffered most from Adobe's dumping of MM, since its whole point was to smoothly vary the serif design. Good thing you have the pre-castrated version. <br> <br>For a matching text font, it would help to know how much serifness you'll be using Penumbra with. <br> <br>-- <br> <br>BTW, as much as I don't enjoy recommending Berthold fonts these days, you should look at their new (actually pretty old) Nero as an alternative to Penumbra: <br><a href=\"http://www.bertholdtypes.com/home.html\" target=\"_blank\">http://www.bertholdtypes.com/home.html</a> <br>I know you like/love Mantinia - Nero has some cool ligs too. <br> <br>hhp <br></p>"
    html_clean: "<p>I've always liked Penumbra, although it's probably the font that's suffered most from Adobe's dumping of MM, since its whole point was to smoothly vary the serif design. Good thing you have the pre-castrated version. <br> <br>For a matching text font, it would help to know how much serifness you'll be using Penumbra with. <br> <br>-- <br> <br>BTW, as much as I don't enjoy recommending Berthold fonts these days, you should look at their new (actually pretty old) Nero as an alternative to Penumbra: <br><a href=\"http://www.bertholdtypes.com/home.html\" target=\"_blank\" class=\"link-external\">http://www.bertholdtypes.com/home.html</a> <br>I know you like/love Mantinia - Nero has some cool ligs too. <br> <br>hhp <br></p>"
