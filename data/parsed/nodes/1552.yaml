  html: <p>Im working on a brochure for a Body Building/Fitness program. I'm considering PENUMBRA (the multiple master) for titles. <br> <br>Looking for suggestions on a pair for text. <br>Leaning twards a san serif face, but open to a serif as well. <br> <br>Ideas? <br> <br>hildebrant. <br></p>
