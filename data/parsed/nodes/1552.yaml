    html: "<p>I'm envisioning something a bit wide and squat, and somewhat rigid, without much detailing, and maybe a certain Grot feel. Or maybe just some of those things... <br> <br>What about a wide cut of Kepler? <br>Or a Clarendon. Or Egyptian 505. <br>Do you have Warnock? <br> <br>Or if you want something really close to Penumbra, check out good ol' Albertus. <br> <br>Wait, I got it! Kinesis. Although it's not squat. <br> <br>-- <br> <br>I'm having second thoughts about the \"weathered\" look: it seems anti-fitness. <br> <br>hhp <br></p>"
