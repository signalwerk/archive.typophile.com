    <p>I was wondering if there were any solutions to make an image out of a text file. Like an ASCII image, but with real text and variations in font size and weight. Is there any commercial solutions for this, or any scripts for Scriptographer etc?<br>
    Example by Herb Lubalin:<br><img src="/sites/default/files/old-images/picasso_5129.jpg"></p>
