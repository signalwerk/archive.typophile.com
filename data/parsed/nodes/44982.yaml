      <p>FreeType is a <a class="freelinking external" href="http://www.freetype.org" rel="nofollow">free programmer's library</a> for C programmers, which enables your program to use just about any font file directly.<br>
      I used it for the above samples to get the character metrics (the important part), and to output the raster graphics. But I don't even need it in my Windows version -- that uses your installed fonts in the regular way.</p>
      <p>(I posted a pointer to my Window version under a <a class="freelinking external" href="http://typophile.com/node/45299" rel="nofollow">new topic</a> to prevent cross-pollution. That didn't last long ...)</p>
