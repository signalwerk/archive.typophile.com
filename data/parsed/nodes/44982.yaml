      <p>That was surprisingly difficult to write. Sampling a picture (a recognizable one, at this very low rez) is easy. So is drawing text at arbitrary sizes -- I'm using the FreeType lib for that. The difficulty came in when I tried to emulate the sizing; FreeType allows that, but it took a bit of fiddling to get it right (sort of).</p>
      <p>My program resembles an ASCII art generator, but instead of selecting characters for darkness, it selects one of 5 weights of Myriad, so the 'effective' gray resolution is just 5 levels. I do hope you can recognize the image, though!</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/einstein_6170.png"></div><p></p>
    html_clean: |-
