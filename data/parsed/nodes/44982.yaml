      <p>Most ASCII generators aren't what you're looking for at all. There's this <a href="http://www.typorganism.com/asciiomatic/">http://www.typorganism.com/asciiomatic/</a> one which does generate ASCII images, but can also change the darkness of the letters if you tell it to do it in colour; however it doesn't change the weights or anything. But it's kiiinda close to what you want - perhaps you could put your image through this and then exaggerate parts of it by hand by changing weights and type sizes</p>
      <p>-Rafe</p>
    html_clean: |-
      <p>Most ASCII generators aren't what you're looking for at all. There's this <a href="http://www.typorganism.com/asciiomatic/" class="link-external">http://www.typorganism.com/asciiomatic/</a> one which does generate ASCII images, but can also change the darkness of the letters if you tell it to do it in colour; however it doesn't change the weights or anything. But it's kiiinda close to what you want - perhaps you could put your image through this and then exaggerate parts of it by hand by changing weights and type sizes</p>
