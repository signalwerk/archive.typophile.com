    html: <p>I build my kern tables in MetricsMachine, export a feature file, and compile it into my fonts. Non-Opentype kerning does not exist within my workflow. I guess if big publisher ever wanted a 1,000-seat license with type 1 fonts I would be screwed, but otherwise it saves me from a lot of headaches.</p>
