  html: |-
    <p>I like to mantain only opentype kern feature and not use expanded kerning.<br>
    I know this creates a limitation but I tend to think things are evolving, I don't want to build fonts compatible with Win98 or something.</p>
    <p>In other hand I know some famous software still lacks Opentype kern support, more notably Myfonts site and OS X Font Book (already filled a feedback form here <a href="http://www.apple.com/feedback/macosx.html" title="http://www.apple.com/feedback/macosx.html">http://www.apple.com/feedback/macosx.html</a>) </p>
    <p>What are your thoughts about this subject?</p>
