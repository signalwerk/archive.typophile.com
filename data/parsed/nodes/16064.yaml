      <p>Frankly, I fear this is becoming committee-designed! </p>
      <p>Flip back from the latest sample to the first. The first one has a lot of juice, playfulness, and the weight distribution on the swashes really is fine (This coming from an inveterate calligrapher). In the later versions all the fun is being canceled out and logical-ized. For a logo, it can be very lively and messy; see some of Ed Benguiat's early copperplate confections. The only thing I would change about the original is to find a way to balance the density of the decorative strokes around Lunch in the middle. There could be more ornament to the left of L, less density above and more below. Otherwise I think it is very distinctive. Underware does things like this with hand lettering, and it can be very pleasing, without being undecipherable.</p>
