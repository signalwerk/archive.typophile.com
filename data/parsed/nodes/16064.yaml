    html: |-
      <p>In most calligraphy, if the pen is not changing direction, there will not be a weight difference, because you keep the pen at the same angle throughout. For example, the longest portion of the L changes from very thin to fairly thick, but since you are barely changing direction this wouldn't happen. </p>
      <p>Also the thick/thin parts of the strokes are not occuring in the correct part of the loops. Similar loop formations will look the same - the bottom left loop in the L and the lowest loop in the logo should be nearly identical in that regard.</p>
      <p>It might help to trace your logo with a calligraphy pen to see where the thickest parts should be and how the inner and outer shapes relate.</p>
      <p>The logo as a whole looks very fun. Will this be going on a menu or is it just for practice?</p>
