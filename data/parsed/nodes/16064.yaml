    html: |-
      <p>Pen direction would be "from point a to point b"; pen angle would be what angle you are holding the pen. In general, or I guess in basic calligraphy anyways, you would keep these fairly consistent. From a speedball book on italic:</p>
      <p>"The pen...is usually held between 30º and 40º for the miniscules and 25º for the capitals. The letters slant 5º to 7º to the baseline. Steepen the pen angle on the bold diagonal strokes to achieve a more even weight."</p>
      <p>The letters are definitely brush-based so perhaps experimenting with a brush is a better suggestion.</p>
      <p>Sebsan..just leave it to us to take the fun out of calligraphy. :)</p>
