      <p>Perhaps Egyptienne never became a large family because Frutiger later made <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/linotype/glypha_std_complete_family_value_pack/" rel="nofollow">Glypha</a>. I also feel like I read somewhere that Frutiger didn't actually care for Egyptienne or Glypha. I can't remember which it is, or where I read it...</p>
