    <p>Hi. <a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=242729&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=8307&amp;query=EGYPTIENNE%20F&amp;SCOPE=Fonts" rel="nofollow">Egyptienne F</a> makes me curious because it’s such a limited typeface, especially considering Adrian Frutiger is the patriarch of this family. There’s  55 Roman, 56 Italic, 65 Bold and 75 Black, but why not a 66 Bold Italic and a 76 Black Italic?</p>
    <p>I am designing a brochure and using Egyptienne F in combination with <a class="freelinking external" href="http://www.fonts.com/FindFonts/Detail.htm?pid=421588&amp;/cgi-bin/MsmGo.exe?grab_id=0&amp;page_id=57440&amp;query=UNIVERS&amp;SCOPE=Fonts" rel="nofollow">Univers</a>—a whopping 27 fonts in this family pack. However, the lack of bold-italic in Egyptienne F is a bit troublesome.</p>
    <p>It seems there must be a story behind why the type design screeched to a halt with just four fonts. Anyone here familiar with the history of this typeface?</p>
