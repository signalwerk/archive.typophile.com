    html: |-
      <p>If my understanding is correct, there is a point during boot where the console font is explicitly set by the kernel. If you search for terms like "linux console font" you might find more information. I know that there are fonts stored in /usr/share/consolefonts on my Ubuntu system and that using the "setfont" command from a console screen (the screen you get when you hold down CTRL-ALT-F1, for example) can change the font.  You can type "man setfont" for documentation. Good luck!</p>
      <p>st</p>
      <p>P.S. Usually, holding down ALT-F7 will get you back to the graphical desktop from the console. And a warning: I've had systems where switching to console and back was dicey and tended to put the system's video card into a bad state. But on most it works fine.</p>
