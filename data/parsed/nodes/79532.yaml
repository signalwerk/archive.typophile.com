    html: <p>On my Linux box (based on Linux From Scratch 5.1), it's when running <code>/etc/rc.d/init.d/loadkeys</code>, when it loads the <code>lat1-16</code> bitmap font from <code>/usr/share/kbd/consolefonts</code>.</p>
