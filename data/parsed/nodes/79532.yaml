    <p>When I put some Linux computer operating system Live CD distributions there is on some Verbose Mode viewing instructions.  This allows the user to view the coding style text  and not the Graphics Mode.  I am not a font designer thus the question one here:  Is the Verbose Mode font on the Linux distribution, circa 2011 a bitmap?</p>
    <p>The Verbose Mode de facto gives the 'coder perception'.  I am not a font coder, thus the question two here:  Where is the Verbose Mode font and the coding style text that have font attributes (colour/italics/bold/lower/upper?) installed on the Linux operating system and is it easy to alter it to another font and the coding style text including the font attributes, circa 2011?</p>
