      <p>Tiffany,</p>
      <p>While I agree wholeheartedly with your ethics, the practical concerns boil down to either coming to terms with this perceived violation of your property and chalking such theft or “shrinkage” as a cost of doing business, or inconveniencing your potential paying customers by crippling online previews so that font pirates won’t be able to produce a crappy imitations of your font. Since the pirates aren’t going to pay anyway, aren’t you potentially reducing the number of honest sales by offering less information to would-be buyers?</p>
