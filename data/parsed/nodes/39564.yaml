      <p><em>That sounds like a fact. Is it?</em></p>
      <p>It’s anecdotal, based on noticing which of my fonts I’ve come across on pirate sites.<br>
      It certainly seems logical.<br>
      It might even be naive behaviour, in that someone thinks “hey this is free, must be shareware”; or self-serving myopia, when greed causes one to not notice, or to ignore, inconvenient facts. </p>
      <p><em>Maybe I’m naive...do a huge number of professional designers get fonts from Russian pirate sites?</em></p>
      <p>They’re more likely to get them on CDs from friends, or, as freelancers, download them from their employer’s computer.<br>
      Nonetheless, as it’s a question of morality, the fight for intellectual property rights, focused on pirate sites, is symbolically important as a socially responsible, visible condemnation of bad behaviour—as much as for reducing the number of pirated fonts in the “sharing” subculture.</p>
      <p>Real designers don’t pirate fonts.</p>
