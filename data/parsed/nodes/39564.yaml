      <p>A more tangible example:</p>
      <p>The last font I purchased was about a month ago for a client project. The client wanted a hand drawn typeface. </p>
      <p>I went off to Veer and used the flash tool to set a bunch of examples of handwritten typefaces they had. Showed the client, and then we purchased the one they picked.</p>
      <p>Had there not been that preview, those typefaces wouldn’t have been in contention.</p>
