      <p><em>The question you need to figure out is if letting people listen your music for free will increase or decrease your exposure and sales.</em><br>
      Exposure, of course. Sales, unlikely if they took the first ones for free, the sense of “entitlement” and ease of download  would be the already established pattern. 2/3 of the radiohead “fans” didn’t even pay 1¢. That was an amazing experiment and in the end likely a worthwhile one. The mindset for most is that all digital IP can and should be free. The harsh reality comes back when they want to make a living with their own IP and find all of their peers hold no value for their music, fonts or graphic design.</p>
      <p>If school instructors are teaching piracy as professional practice, there is a serious problem that will take a major shift to overcome. I went through design school during the transition from analog to digital. No one complained (well, everyone complains) about having to buy press-type at the expense of beer money (both were somehow managed) where now buying fonts is seen as a luxury as opposed to the “art supply” that it is (with a shelf life of...their career).</p>
