    <p>This is primarily geared to independent foundries, especially those that use flash for previewing.</p>
    <p>I recently found a pirated archive of my work. I downloaded it to examine it and in the course of my investigation found most of the files had been extracted from my flash previews on my website. The extracted files don’t contain the full character set or kerning.</p>
    <p>[Program used removed]</p>
    <p>I suppose I will have to re-evaluate the way I provide previews.</p>
    <p>[Moderator comment: The Posting of how to pirate fonts is not a function of Typophile]</p>
