    html: |-
      <p>“DRM was not part of this discussion”</p>
      <p>It’s quite related, as the original app likely ’reverse engineered’ the flash file to grab the data. DRM is usually touted as the ’fix’.</p>
      <p>“but the bottom line is “inevitable” is not acceptable.”</p>
      <p>Is anyone disagreeing with that?</p>
      <p>“Most people who offer the loudest criticisms are rarely customers”</p>
      <p>Why is that? ;o)</p>
      <p>“implied first hand experience in using pirated fonts”</p>
      <p>That’s a rather accusatory assumption, ain’t it?</p>
      <p>I think we also abuse the term ’pirated’ WAY too much these days. </p>
      <p>The bottom line, IMHO, is that no, folks should not be taking your work for free if you intend people to purchase it. You can either a) make it hard for everyone, including your paying customer to use your product or b) just focus on your paying customers and not worry about some kid in Russia.</p>
      <p>It’s really up to each foundry, and there’s no ’right’ answer necessarily. </p>
      <p>“It’s like when a fan of a band asks the band to sign a bootleg and burns copies of their music for all of their friends, is it flattering or insulting?”</p>
      <p>It depends on the band. Does a bootleg increase or decrease the bands market exposure and product sales?</p>
      <p>“The mainstreaming of “sharing” culture will make it less and less inviting for anyone to want to go into a “creative” business.”</p>
      <p>“sharing” has been around forever. This is nothing new. And yet, the creative businesses are still chugging along just fine...</p>
      <p>“I don’t have statistical evidence to back this up”</p>
      <p>And that is really the reason these debates still exist. No one does.</p>
      <p>Does sharing an MP3 directly deny the RIAA income? Or does it directly increase it? It’s next to impossible to accurately measure this and in a lot of cases, it’s probably a wash. Just the times-a-changin.</p>
      <p>I’m just speaking for myself, but I’m through with DRMed music. It’s a huge pain. I am more than willing to pay for music and will gladly do so when it’s DRM free (thank goodness for eMusic and Amazon!)</p>
      <p>As for fonts, as a designer, I make a living doing commercial work, so will always pay for fonts...provided I can use them without jumping through hoops (in which case I just won’t use that font and go on to the next foundry). And that’s just my stance...other customers will differ, of course.</p>
