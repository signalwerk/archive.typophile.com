      <p><cite>Sadly I think the scales are tipped in the favor of piracy reducing more sales than little or no pdf/flash specimens would reduce sales.</cite></p>
      <p>I don’t think that piracy via Flash rips is the kind of piracy that foundries need to worry about. If foundries want to make a meaningful dent in piracy, making <em>very</em> low cost fonts easily available to design students and schools is the only way to go. Too many students—at least here in the states—can’t even afford textbooks after they’re done paying tuition and room and board, much less software and fonts. I can tell you firsthand that piracy is taught as a necessary evil in some design programs. And when a young designer gets out of school, tens-of-thousands of dollars in debt, and finds that a good job at a good firm that pays less than he or she could make working in retail management, you can bet those old pirate fonts are going into the freelance jobs that keep the student loan companies happy. </p>
      <p>This is why I keep bringing up ideas about very low-cost font licensing for students. For some of them, the difference between using a free font or using a pirated font is the difference between getting a scholarship or not going back to school next fall. Right now tuition is skyrocking, the value of the dollar is dropping like a rock, easy credit is fading, federal and local student aid is getting slashed, and type vendors need to get proactive. Because if you think font piracy is bad now, just wait until a generation of designers who were taught to pirate fonts is running the design industry.</p>
