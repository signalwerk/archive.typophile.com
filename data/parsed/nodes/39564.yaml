      <p>Great - so Radiohead fans got what they wanted - most for free. Everyone in the music business knows that the money is no longer in CD sales - it’s in appearances and merchandise, etc… Why is that? Because of downloading. The only catalogue that is making money at EMI/Capitol is reissues. So much for new artists.</p>
      <p>I recently had a song released by a major band and I made some decent money. Why? Because the record label is legally required to send me royalties ON THE COPIES THEY SELL. Did I need the extra exposure of downloaded versions of that song? Not at all - the artists who recorded it sell in the millions every time out.</p>
      <p>For all you who are cheering downloading bringing on the demise of the major labels, consider the new business model. Clear Channel has purchased Madonna’s entire career for the next five years. Concerts, merchandise, records, etc…</p>
      <p>Let’s see - they own a plethora of radio stations in America - I wonder what they’re going to play on those stations?</p>
      <p>There are consequences all down the line when artists are devalued.</p>
      <p>pbc</p>
