    html: <p>If it makes anybody feel better, the pirate versions of a lot of fonts going around out there lately are next to worthless. There’s a programmer promoting a new file compression software by distributing complete foundry archives of ripped fonts and batch converting them into Opentype via Fontlab. The catch is that he doesn’t know what he’s doing and the fonts are often unusable for anything but (bad) student work, even then the fonts often require manual fixes before they can be used.</p>
