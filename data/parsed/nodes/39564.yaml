      <p>“2/3 of the radiohead “fans” didn’t even pay 1¢.”</p>
      <p>% figures are pointless.</p>
      <p>The key is how many purchased the songs when they could pick the price vs. how many purchased the songs when the band picked the price vs. how many downloaded the song on their own (and how many of those wouldn’t have paid anyways)?</p>
      <p>Again, a really hard, if not impossible question to answer.</p>
      <p>“The mindset for most is that all digital IP can and should be free.”</p>
      <p>I’d say the success of iTMS, eMusic and Amazon’t MP3 sales severely dampens the ’most’ argument.</p>
      <p>“If school instructors are teaching piracy as professional practice, there is a serious problem”</p>
      <p>Definitely.</p>
      <p>“Did I need the extra exposure of downloaded versions of that song? Not at all - the artists who recorded it sell in the millions every time out.”</p>
      <p>Indeed...the bands that protest the loudest tend to be the ones that benefit most from the current system. Which is understandable. Band like Metallica thrive off of the current music label system.</p>
      <p>But your songs already sells millions. Do you think ’sharing’ of those songs really has hurt those sales? Or perhaps you’ve already hit the saturation mark. As a teen, we’d swap CDs by copying them to tape for each other. This was the norm. Did we cost the bands sales? No. We were broke. I think there’s a belief (or perhaps a wish) that if there was only some way to technically prevent copying (which there isn’t) all of these ’copies’ would immediately translate into sales. Some would. Many wouldn’t. </p>
      <p>“There are consequences all down the line when artists are devalued.”</p>
      <p>I think Madonna and Metallica are overvalued to begin with. BTW, this is not a ’new’ model. This is how the industry has been working since the 50s. Control the market, and feed the masses a select menu of easily marketable consumables. The market hates diversity.  </p>
      <p>“If a foundry does a font promotion, by giving away a font free for a limited time, or by issuing a font on a collection CD (eg with Indie Fonts), then that font is more likely to end up on a pirate site.”</p>
      <p>Is that bad? Good? Neither?</p>
      <p>Maybe I’m naive...do a huge number of professional designers get fonts from Russian pirate sites?</p>
