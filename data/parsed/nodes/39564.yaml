      <p>Fair enough. I appreciate the candor.<br>
       I would think piracy could be overlooked if the balance of extra business outweighed the prominence a font would find throughout various “sharing” sites and the ease of finding a font once it is propagated. Sadly I think the scales are tipped in the favor of piracy reducing more sales than little or no pdf/flash specimens would reduce sales. I don’t have statistical evidence to back this up, but once a font is released, it tends to sell better when it has not been “shared” vs. font sales that have had piracy right after release. Contrary to a common rationalization, the “non consensual trial version” encouraging sales is a rarity. On the upside (with some trepidation) finding pirated fonts used in major ad campaigns can be a windfall if pursued. That brings up litigation as a revenue source for foundries as a big topic that could be discussed. Not online however :^)</p>
