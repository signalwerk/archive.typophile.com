      <p>Photofont WebReady is based on <a href="http://en.wikipedia.org/wiki/Scalable_Inman_Flash_Replacement">sIFR</a> (but there is lots of additional development that went into it). The output is completely searchable, search-engine-friendly text with a custom typeface. It uses a combination of browser-side standard techniques (CSS, JavaScript) with dynamically inserted Flash files (SWF with ActionScript). On modern browsers, you get custom-formatted text rendered using Flash, which remains searchable and copy-pasteable (just like the heading on this very forum, that today, for a change, seems to be using Comic Sans). Google or text browsers that don’t support Flash get the pure unprocessed text. </p>
      <p>Adam</p>
    html_clean: |-
