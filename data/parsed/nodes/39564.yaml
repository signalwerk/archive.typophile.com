      <p>I am extremely happy to announce that Fontlab Ltd. is very close to releasing Photofont WebReady, a product that will allow users to convert outline fonts not only to Flash fonts for use with sIFR and similar solutions (that are employed for Flash testdrive capabilities) — but also into something new, what we call “embedded web photofonts”. Basically, Photofont WebReady will convert an outline font into a bitmap font of a chosen size and then put this bitmap font inside of a Flash file that will include ActionScript that will make this bitmap font work as if it was regular Flash text. </p>
      <p>Next week, we will publish a new version of the photofont.com website that will demostrate the technology in use. We hope that some folks who are afraid that fonts can be extracted from Flash files may consider switching to embedded web photofonts for preview purposes. </p>
      <p>I’d like to add that — unlike some other solutions on the market — Photofont WebReady will respect the embedding bits in OpenType and TrueType fonts, and will not allow a user to convert a font into an outline Flash font if the embedding bits don’t allow that. </p>
      <p>Regards,<br>
      Adam Twardoch<br>
      Fontlab Ltd.</p>
