      <p>DRM was not part of this discussion.</p>
      <p><em>point out that getting ripped off is pretty much inevitable in creative fields</em><br>
      I could think of some rather unpleasant analogies, but the bottom line is “inevitable” is not acceptable.<br>
      If a previewer become a font dispenser, then it is the foundry’s prerogative to turn off the tap. ATF and metal foundries didn’t have online previewers, they had specimen books. We have cultivated good customer relationships where a regular customer can try out fonts upon request. We try to listen to our customers. Most people who offer the loudest criticisms are rarely customers, but people who feel a sense of righteousness about how they think things should be. It’s easy to say “let it go” but if a repeated indignation and crime is perpetrated upon you, you don’t stand there and say “thank you sir may I have another”</p>
      <p>James<br>
      when you say <em>the pirate versions of a lot of fonts going around out there lately</em>, you seem to have a pretty good knowledge of the various levels of piracy and <em>even then the fonts often require manual fixes before they can be used</em> an implied first hand experience in using pirated fonts. I find it disheartening that even on this forum where those who chat daily with the makers of fonts can in the next breath dismiss the value of the craft by posting download links. It’s like when a fan of a band asks the band to sign a bootleg and burns copies of their music for all of their friends, is it flattering or insulting? A little of both no doubt. The mainstreaming of “sharing” culture will make it less and less inviting for anyone to want to go into a “creative” business. In conclusion...whatever.</p>
