    html: <p>I used to have fonts that had somehow accumulated over the years, but have since destroyed them and bought replacements. In the early 90’s not many people I knew considered fonts as something you should buy for yourself, and even pre-press companies gave fonts away to their clients for free. Since then both legislation and public awareness have changed, but there are still a lot of people who are willing to share fonts and/or who are ignorant of the legal issues. Perhaps people should be made more aware of what’s ok and what’s not, but I’m afraid a lot of people just don’t care.</p>
