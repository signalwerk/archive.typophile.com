    html: |-
      <p>Ah, I would bet Press Gothic is the source. For the single story l/c 'a', you could decapitate a l/c 'd' and bob's yer uncle. Same with Compacta. Nice and thank you.</p>
      <p>As an aside, I thought most type designers had un-natural affinities towards lower case 'a' and ampersands. Wouldn't take much effort to incorporate some crazy alternate glyphs in their digital work would it?</p>
