    html: '<p>I wish <a class="freelinking external" href="http://www.myfonts.com/fonts/itfmecanorma/british-inserat" rel="nofollow">Bristish Inserat</a> had a single storey /a... Very <a class="freelinking external" href="http://www.myfonts.com/search/compacta" rel="nofollow">Compacta</a> BTW. An interesting alternative would be <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/press-gothic" rel="nofollow">Press Gothic</a> which has a <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/press-gothic/pro/glyphs.html#glyphs/404671/359" rel="nofollow">single storey /a</a>. Alternative, no single storey /a though: <a class="freelinking external" href="http://www.myfonts.com/fonts/parachute/pf-fusion-sans-pro" rel="nofollow">Fusion Sans</a></p>'
