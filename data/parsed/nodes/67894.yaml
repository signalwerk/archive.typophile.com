  - id: 429461
    user: 8451
    date: 2010-09-13T13:49:00
    date_raw: 13 Sep 2010 — 1:49pm
    votes: null
    html: <p>Thanks! The O was inspired by a pattern I saw on a manhole cover, where the rain had puddled inside raised shapes. It hinted at black letter forms in my eyes, but retained strict geometry created by a grid of smaller shapes. The O could easily be 1 color, filled, but I liked seeing the different pieces make up the final form in an optical illusion of sorts.</p>
