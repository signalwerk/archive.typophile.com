  html: |-
    <p>LetterCult.com is running AlphaBattle 2.0, check it out here: <a href="http://www.lettercult.com/archives/1479#more-1479" title="http://www.lettercult.com/archives/1479#more-1479">http://www.lettercult.com/archives/1479#more-1479</a></p>
    <p>Details are as follows:</p>
    <p>DATES</p>
    <p>February 15 – February 28 – submit the Letter A. On March 1, we will publish all of them.</p>
    <p>March 1 – March 15 – submit the Letter B. On March 16, we will publish all of them.</p>
    <p>And we’ll continue posting the dates as we progress.</p>
    <p>GUIDELINES</p>
    <p>• Submit a 600 pixel wide file (flattened, jpg, tif, gif) to lettercult <a href="/wiki/at" class="freelinking" rel="nofollow">at</a> gmail.com. You can also upload to the Alphabattle Flickr 2.0 group. And while you’re at it, you can upload your letters to Nate’s LetterPlayground.</p>
    <p>• Include a link to your site, if you’d like us to link.</p>
    <p>• One submission per person per letter.</p>
    <p>• You can make your letters however you choose, with one exception: Don’t use a font as a starting point…this is a site about letters you build from scratch. (wink)</p>
    <p>• Keep it safe for work.</p>
    <p>• Try to be original, in some way, shape, or form.</p>
    <p>• Have fun.</p>
    <p>• You can submit a letter after any deadline. We’ll still add it to the group.</p>
