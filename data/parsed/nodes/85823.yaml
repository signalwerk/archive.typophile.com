      <p>&gt;...not being a lawyer</p>
      <p>Neither do I.<br>
      But saying "Israel has no specialty court to decide intellectual property case"  is ???.</p>
      <p>The Court system is comprised of the Supreme Court, the District Courts and the Magistrates’ Courts.<br>
      Magistrates’ Courts -- Criminal matters  + civil claim (IP or whatever is the case/claim; and only if the  amount of the claim does not exceed one million Israeli shekels)<br>
      District Courts -- Criminal matters  + civil claim (when the amount is above one million Israeli shekels).<br>
      That's it. </p>
      <p>&gt;  Are typefaces "designs" in Israeli law?</p>
