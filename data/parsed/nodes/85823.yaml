      <p>Hi Bill! It's good to hear from you. I've been intending to write and tell you how much I enjoyed your article on Caslon in the APHA journal. In our mind's eye, we each have a Caslon--that is, if you've grown up in the Anglo-American tradition.</p>
      <p>I think one would have to read the complaint and a transcript of the trial to get any sense of the points of law in this case. I don't know if those documents are, or will be, made public. Perhaps, after the appeals are over, someone will write something about it. Israeli copyright law looks very strange to American sensibilities, or even European ones. Whereas ours is based on an 18th-century notion of progress--and, more to the point, the avoidance of any impediment of progress--Israel's was born into a helter-skelter world in which many who sought refuge there were themselves the victims of the most ruthless thievery, not only of intellectual property, but of real property and life itself.</p>
      <p>There's a blog I occasionally look at published by an American-born Israeli IP attorney: <a href="http://blog.ipfactor.co.il/" title="http://blog.ipfactor.co.il/">http://blog.ipfactor.co.il/</a>  Maybe he'll write something about the case. What I gather from reading it is that Israel has no specialty court to decide intellectual property cases, so the law is made by judges as they go along. What appears to be better, though, is that little guys have a chance to fight against corporate interests. In the U.S., a little guy can be spent to death in a matter of days by corporations who have staff attorneys. Both systems are double-edged swords. For American designers, who have largely been closed out of copyright protection, we do have the protection of contract law, which is of considerable power.</p>
      <p>If you're as interested in the subject as I am, you might want to check out the blog of William Patry, one of foremost copyright attorneys in the land. In an entry from some years ago, he talked about book design. <a href="http://williampatry.blogspot.com/2006/04/richard-eckersley-and-book-design.html" title="http://williampatry.blogspot.com/2006/04/richard-eckersley-and-book-design.html">http://williampatry.blogspot.com/2006/04/richard-eckersley-and-book-desi...</a><br>
      Unfortunately, Patry became senior copyright attorney for Google, which has professionally placed him in the position of arguing against design copyrights. If designers had any real rights to their work, no matter how minor, the entire system of something like Google Books could come crashing down, or, in the least, would be restricted to very old material.</p>
      <p>Be this all as it may, I wish you and yours a Shanah Tovah! May you be inscribed in all the best books.</p>
      <p>Scott</p>
