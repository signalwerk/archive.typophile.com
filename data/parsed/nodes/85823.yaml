      <p><cite>We in the United States can only be aghast at such an event, as our law provides virtually no protection for the design of letters (or many other sorts of graphic design), though it provides much protection for trademarks, the names and symbols under which things are sold.</cite></p>
      <p>I find this comment strange.</p>
      <p>Why couldn't Americans - particularly those whose business is the design of typefaces - consider that existing U.S. law in these matters (I think it has actually changed recently, and the trademark-only limitation is a think of the past) is inadequate, and, thus, have no reason to be shocked that the more reasonable laws of other jurisdictions are being enforced in practice?</p>
      <p>Of course there are ways in which the laws of other countries can differ from our own that we would legitimately consider shocking, but this hardly seems like an example of that.</p>
