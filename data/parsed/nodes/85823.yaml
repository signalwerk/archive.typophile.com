      <p>David, I stand by my previous remarks—all of them. And I agree with Bill in his perplexity over the language. Michael Factor's description of Narkiss, Rosenberg, Koren Publishers v. Microsoft, in the link you sent, is a perfectly good case in point. Also, the Israeli law's extremely vague language about derivative works, lumping together adaptations and translations, its deferral of the determination of industrial use to a government ministry, and its reference (sec. 46) to "distortion . . . mutilation or other modification," have great potential for confusion, especially in what may be valuable interpretive works. For the plaintiff in the Hadassah case, it was an opportunity to make a sentimental case to a judge, who likely understood very little about the fine points on which such evaluations are made. The granddaughter's remarks recorded in Ha'aretz seemed to me very simplistic, to the point of artlessness. There are honest efforts among type revivals that fail to hit their mark, too. In Bill's article about Caslon revivals, he treats very fairly the case of Founder's Caslon, which is an attempt at literal-mindedness that ends up being little more than an antiquarian curiosity.</p>
      <p>Bill, as to your earlier question about available versions of Hadassah I like, I'm afraid I haven't seen any that capture the forms and movement very well. If Masterfont had been truly successful in capturing Hadassah, I would have had to quote the old line, "A handsome thief is always half-forgiven," but alas that's not the case. It's neither literal nor interpretive. What's interesting to me is how far Hadassah had come from its earliest drawings to the final foundry version. (Does that fact have bearing on this lawsuit?) It reminds a me quite a bit of comparing Hermann Zapf's drawings for Palatino with the Stempel foundry production. The feeling is so different that one might attribute the design as much to August Rosenberger, the punchcutter, as to Zapf. The drawing has some very Germanic features, whereas the final type is classically Italianate.</p>
