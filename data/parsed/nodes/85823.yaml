      <p>Scott, thanks for the appreciative words on the APHA article. It was really fun writing that, because I learned so much from the research that surprised me, specifically about the amazing Theodore Low De Vinne, and about Luckiesh, who seemed to have vanished from history. </p>
      <p>David, thanks, but I not much wiser after starting to read this. I suppose I shouldn't have expected to, not being a lawyer. Here for example:</p>
      <p>"Copyright shall not subsist in "designs" as defined in the Patents and Designs Ordinance unless the design is not used, nor intended for use in industrial manufacture.; The Minister may prescribe conditions for determining when a design is deemed to be used for industrial manufacture."</p>
      <p>Huh? Are typefaces "designs" in Israeli law? And what does that mean about protection?</p>
      <p>Shana Tova U'metukah to all!</p>
