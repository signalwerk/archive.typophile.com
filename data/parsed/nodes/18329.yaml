      <p>It's been an age since I've used QuarkXPress, but... I don't imagine things have changed very much with QXP, but the application never really seemed to be happy making PDFs. I dimly remember having to generate PostScript (PS) files of documents, then RIPping those through Acrobat Distiller, all because the PDFs XPress made directly were totally crazy.</p>
      <p>If you are working in OS X, can you choose "Print" and then select the OS-level "PDF/Save as PDF..." command? Any improvement?</p>
