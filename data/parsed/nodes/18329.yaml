      <p>My experience with Quark is similar to Chester's. One question. Was your all caps wording done using the Caps style or is it typed as all caps? Quarks "Styles" can be, well, quirky. This can be magnified to awful if you adjust tracking.  It can look fine in Quark but somehow in the transition to PDF, things don't marry up well. This is one of my reasons for dumping Quark but that won't help your friend.</p>
      <p>ChrisL</p>
