    <p>Hello every one!</p>
    <p>Does anyone know what could be cause of this problem…</p>
    <p>A book designed in Quark… everything looks fine, but when saved as a PDF something strange happens: the space between some characters (specially all uppercase words) goes crazy, stretching its self…<br>
    The typography that my friend is using is fairly new… so I don’t know if the problem might come from the font itself, or maybe is a PDF thing.</p>
    <p>Any one has an answer?</p>
    <p>(The typeface is Enrico) </p>
    <p>Thanks</p>
