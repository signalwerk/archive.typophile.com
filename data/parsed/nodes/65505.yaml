  html: |-
    <p>A new family has come</p>
    <p>A new pair of serif and sans<br>
    For cold assertions to warm anecdotes </p>
    <p>Designers heed these words<br>
    A well-yoked posture will prevail<br>
    Typographers alike, mind this</p>
    <p>No more Morisonified faces<br>
    Will scourge the surfaces of their pages<br>
    For a Garalde, and a new take on Gill<br>
    In lieu of the committeed crumbs<br>
    A fully-formed featured font</p>
