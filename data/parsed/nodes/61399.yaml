    <p>Below was posted to the AAUP design list:</p>
    <p><cite>It is with deep sorrow that we let you know that Will Powers, MHS Press Design &amp; Production Manager, passed away yesterday (Tuesday) afternoon. He was vacationing at a family cabin in Canada with his wife when he unexpectedly had a massive heart attack.<cite></cite></cite></p>
    <p>Will went by the user name *Powers* on Typophile. Before becoming a designer, he was a printer. Not a monitor-watcher, but an old-fashion printer. I will miss Will and his ironical sense of humor.</p>
