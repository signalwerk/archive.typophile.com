      <p>That's a surprise.<br>
      Last time I was with him Craig Eliason and I were having lunch with him at the restaurant across the road from TypeCon in Buffalo.<br>
      I saw his Ludlow presentation at TypeCon, which was wonderful, and have looked at the pamphlet he printed for his erudite 2003 TypeCon presentation, <em>New Types for New Books</em>, from time to time.<br>
