      <p>I'm stunned and saddened. As kind and generous in the handful of times I got to meet with him in the past few years as he was in posts here.</p>
      <p>Early last October, Will wrote me an email with two items. First was that he had decided the beautiful two-volume Deberny &amp; Peignot 1927 specimen he had dug out of his treasure trove and loaned to me for my Face the Nation exhibition needn't be returned; he was offering it to my university's library as a gift.</p>
      <p>The second item was that somehow he had arranged to commandeer the 6:30 am slot at a small local radio station the following Monday, and he invited me to listen is as he would be playing Ray Charles's early jazz recordings. I listened; it was fantastic.</p>
      <p>Another memory that makes me smile is Kent Lew at Buffalo TypeCon announcing to convention-goers that Will had left but wanted everyone to hear his advice to place the lead Ludlow slugs he'd given out as souvenirs of his workshop/presentation in an easily accessible location within luggage lest they raise the eyebrows of airport security.</p>
      <p>We've lost a knowledgeable resource and a generous friend.</p>
