      <p>John Hudson wrote:</p>
      <p><em>Alas. I can’t remember how long I’ve known Will, but I do remember that in all those years I don’t recall ever having the kind of disagreement that sends me off grumpy. I know I can’t take the credit for that: it’s all down to Will being such a gentleman, so careful in his choice of words, and so knowledgeable about his craft. Vere, requiescat in pace.</em></p>
      <p>Well said. Will's common sense and reasonableness made everything he wrote, here and elsewhere, seem like a refreshing breeze that swept out the nonsense. </p>
      <p>He was one of that small number of practitioners who care intensely about the details of book typography. Like so many of those, he came out of the craft of book production, so his design was grounded in the realities of typesetting, printing -- and reading. I will very much miss his side of this ongoing conversation.</p>
      <p>Will was looking forward to coming to this year's ATypI conference in Mexico City, a favorite place of his. I was looking forward to seeing him again there.</p>
      <p>John</p>
