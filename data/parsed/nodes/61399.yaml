      <p>I saw the write up in the Star Tribune this morning and was shocked. I was lucky enough to have Will as a typography teacher at the College of Visual Arts in St. Paul. He was always amazing me with the depth of his knowledge concerning all things typographic. He used to have us all bring books with interesting typography to class to discuss. I used to love talking about those books with Will. He could tell you more about the typography and production of those books than anyone I've ever known. Will was always kind, cordial and respectful. He was a wonderful teacher and he will be missed. </p>
      <p>– Karl</p>
