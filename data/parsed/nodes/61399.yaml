      <p>I wrote:</p>
      <p>"I first heard of him when he wrote a column about typography for Advertising Techniques magazine back in the early ’80s. At the time he worked at a typesetting house in Minneapolis."</p>
      <p>This is where I first heard of Will, but the rest is highly inaccurate. I forget sometimes how unreliable memory is. (It's probably because it's unreliable that I forget that.)</p>
      <p>I was able to find some of the columns Will wrote in my magazine archive. The column was called "Type Direction" and it appeared in <em>Art Direction</em> magazine in the early-mid 1990s. At the time he was Type Director for Campbell Mithun Esty ad agency in Minneapolis. </p>
      <p>My apologies for not checking before I posted last week.</p>
