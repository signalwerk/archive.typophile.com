      <p>Oh, man. That is very unexpected and tragic. </p>
      <p>I've known Will for about ten years, running into him now an then through various professional and typographic concerns.</p>
      <p>I first heard of him when he wrote a column about typography for Advertising Techniques* magazine back in the early '80s. At the time he worked at a typesetting house in Minneapolis.</p>
      <p>Last time I saw him was at TypeCon in Buffalo. I participated in the Ludlow workshop he gave there. He couldn't make it to Atlanta this year, but was hoping to do more Ludlow workshops in the future.</p>
      <p>Wow. So sad. He will be missed.</p>
      <p>(*Sister publication to Art Direction magazine.)</p>
