    html: |-
      <p>I am shocked and saddened this morning to learn this terrible news! </p>
      <p>Will and I first met in 2003 at TypeCon in Minneapolis. Since then he has become a good friend as well as an esteemed colleague. I remember sitting down to that first beer together and the invigorating, wide-ranging conversation, discovering all our many shared interests. </p>
      <p>In addition to our love of type and typography, the history and the craft, Will and I shared an interest in birds and wildlife. We would periodically send reports to each other of the local changes of season -- Will: the flights of snow geese and pelicans up the central flyway or the first kinglet in April; or me: a fallout of spring warblers or a bittern "singing" from a nearby swamp.</p>
      <p>Last year he invited me to be on the jury to select book interiors for the AAUP's annual competition. We had a wonderful time talking about books and hanging out in NYC, where the judging took place. Later, in July, at the AAUP annual conference in Montreal, I fondly recall skipping out on the Saturday morning sessions together to spend 4 hours tramping around the Parc du Mont Royal instead, investigating the local birds and enjoying the trails.</p>
      <p>I was looking forward to hearing tales of this last month's grand tour around the Rockies and back across the Canadian plains to the cabin in Ontario. Will had confided in me that after his return, he was planning to ease into retirement from the press. He was looking forward to time for personal projects.</p>
      <p>This sudden and permanent retirement is not what any of us had in mind. He will be sorely missed. </p>
      <p>May he rest in peace.</p>
      <p>-- Kent.</p>
