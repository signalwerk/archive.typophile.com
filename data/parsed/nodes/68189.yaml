    <p>Hi,</p>
    <p>I've been asked to create a new logo using this font and hopefully the heart shape too.</p>
    <p>I've looked on myfonts.com and I think I've identified the L - as Biscotti OT, though not sure it's a perfect match? - the attached image isn't great</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/L-and-heart_4580.gif"></div><p></p>
