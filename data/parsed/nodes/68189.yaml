      <p>I don't think <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/biscotti/">Biscotti</a> is the font, unless you found something else by that name. There is no ball terminal on the bottom stroke of that L, and the overall stroke and letter shape is not right. </p>
      <p>I have been looking, but have not found a match yet for the L, and I'm starting to think the whole thing may be hand-drawn. </p>
      <p>- Mike Yanega</p>
