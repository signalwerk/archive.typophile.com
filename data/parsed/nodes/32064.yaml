    <p>I've just complete my first typeface, I began drawing it in 1998. It's based on the aesthetic of nixie vacuum tubes. Nixie tubes you ask? They are the predecessor to LED displays, they were used extensively by NASA during the space race of the 40's, and 50's. The typeface is a matrix style face and the design was in part a study in creating something that allows others to use it and at the same time 'redesign' it.</p>
    <p>I would really like to hear what other typographers think Nixie.</p>
    <p>You can find more examples and download the mac or PC fonts from my website: <a href="http://www.meld.com/ken" title="http://www.meld.com/ken">http://www.meld.com/ken</a></p>
    <p>Thanks,<br>
    Ken</p>
