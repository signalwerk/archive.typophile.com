      <p>Thanks for the comments. Yeah, it's eccentric (bordering on geeky). For me the wonder of typography has always been that a designer might create a typeface but the use of that typeface is well beyond his/her control or vision.<br>
      In part I wanted to take the actual form of the typeface a step farther. The lowercase c I create was a decision based on my vision of the letterforms, but the matrix allows you create a lowercase c in your vision and it might be more effective than mine. The design has then grown beyond my vision and into something I did not imagine, I find this the most compelling idea behind Nixie.</p>
      <p>ken</p>
