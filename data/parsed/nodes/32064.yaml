    html: |-
      <p>Thanks for the feedback, I'll try to elaborate a bit more.</p>
      <p><em>The design has then grown beyond my vision and into something I did not imagine, I find this the most compelling idea behind Nixie.</em></p>
      <p>This idea came about after talking with a few friends that are typographers. One of them had the good fortune designing a typeface that quickly because world famous (in the design industry).  One of the results of that was he saw his typeface used on everything from Hollywood movie posters to the Bible, to German gay porn magazine covers. Initially his (and all of our) reaction was "it should only be use for what it was designed for". But then after thinking about it, I really came to like the idea of others 'misusing' something I made.</p>
      <p>For 100 years graphic/prodcut design has been built on the idea of a benevolent visionary. A person with a vision of the (better) future and they will dispense this through form and color to their audience. From Alexy Brodovitch and Max Braun to Paul Rand and Morphosis their wondrous visions (and they are great, I not knocking these people!) were created and sent down to the common man.</p>
      <p>Typography struck me as different. You design a typeface that fulfills a basic set of requirements; readable, and special feel, some vernacular etc. But then you put it out into the world. From that point on you have no control over it, or what people do with it. And there are many tools out there to do something with type. So even if you intended to  make a highly readable typeface some designer out there will grunge it up and put in on a poster you can't read. If you make a typeface inspired by the soul groups from the 50's, someone will use it for the cover of an annual report. All these uses are well beyond the vision of the original author. I find that one of the strong points of typography, a typeface always becomes more than what it started out as.</p>
      <p>I want to explore going even farther with this idea, not just put a design object out for <em>use</em> but design something that redesign is inherent in. Something that is easy to change into your own.</p>
      <p>Of course you can go into illustrator and change Frutiger outlines. But it's not inherent in the the design, it's not part of Frutigers vision of what the typeface what supposed to do.</p>
      <p>ken</p>
