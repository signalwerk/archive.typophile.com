  date: 2003-07-03T13:27:00
  votes: null
  html: "<p>Please critique my Mattikdesign logotype (image below). I have done publication design, now do mostly Web design, but have little experience with logotypes. This one is for my own design company, in which I want to focus on more sophisticated, subtle (less flashy) Flash design. <br> <br>The logotype uses ITC New Baskerville. I added the \"tti\" ligature, and altered the descender on the \"g.\" And because it has to look good on screen, I flattened the bottoms of the baseline serifs (to avoid blurry little curves). I'm not sure about my kerning, or if my modifications have broken any rules of good typographic design. Any feedback would be truly appreciated. <br> <br>Note: Please be patient if it takes some time for me to reply to your response. Thanks! <br><img src=\"http://www.typophile.com/forums/messages/29/12492.jpg\" alt=\"Mattikdesign Logotype\"></p>"
comments:
  - id: 3664
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 3 Jul 2003 — 1:52pm
    date: 2003-07-03T13:52:00
    votes: null
    html: "<p>Do you really want to convey such a conservative attitude? If you do, I think Baskerville is a great choice. But you might consider livening it up, maybe by doing something with the descender of the \"g\" (noting that it's the only descender). But please no swoosh.  :-) <br> <br>The bar in the \"tti\" ligature looks a bit stiff. Try making it taper, thinner on the left, and (optically) matching the normal head serif shape on the right. <br> <br>The dot(s) on the \"i\"(s) are too high, and maybe slightly too small. <br> <br>I think I like the \"k\", but I'm not sure. <br> <br>Spacing: Looks OK. Tighten up the \"gn\" a bit (maybe while raising the ear), and loosen the \"at\" a hair. <br> <br>hhp <br></p>"
  - id: 3665
    user_id: 1969
    user_name: mattik
    user_path: null
    user_image: null
    date_raw: 5 Jul 2003 — 2:56am
    date: 2003-07-05T02:56:00
    votes: null
    html: "<p>Thanks so much, Hrant, for the thoughtful and useful feedback. I couldn't get the \"tti\" ligature taper to look right, but I did make it thinner. The image below incorporates most of your suggestions...<img src=\"http://www.typophile.com/forums/messages/29/12534.jpg\" alt=\"mattiklogo2\">  <br>The result is very pleasing to me, and I just may go with this as my logotype, for I think it conveys sophistication, and the ability to use traditional elements in contemporary ways. <br> <br>I don't want to appear boring or uncreative, however, so I tried a multitude of approaches to liven it up, including many variations on the descender of the \"g\" (avoiding swashes). Everything looked contrived, and any additional element detracted from the beauty of the letterforms. <br> <br>Finally, I tried merely moving one element: the dot on the 2nd \"i\":  <br><img src=\"http://www.typophile.com/forums/messages/29/12535.jpg\" alt=\"mattiklogo-eye\"> <br>This definitely adds playfulness and interest, but I wonder if it's too cute, or if it too closely resembles another logo. I think it implies an examining eye, which is foundational to good design. It would also lend itself to a Flash treatment, which is appropriate for a designer seeking to specialize in Flash websites. But does it look good? Forgive me if this diverges too much from typography to graphic design and other considerations...  <br> <br>Anyway, I'd be grateful for any additional feedback or suggestions--from you or from any others in the forums--regarding either of the above logotypes, or alternate suggestions for adding interest/distinction to my basic logotype. Thanks so much!  --Jim <br> <br>PS: This was my first new forum, and I think Typophile has created an amazing community resource. May they keep up the good work! <br> <br> </p>"
