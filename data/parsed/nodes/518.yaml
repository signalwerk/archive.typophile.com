    html: "<p>Thank you Yves, Matjaz and Alex. You've convinced me that although my \"eye\" design has problems, working with the dot is the right direction. As my focus is online (and that's where the first marketing contact will often be--without the use of spam, of course), I'm thinking the dot can be an animated character that does different things, to add playfulness and interest. <br> <br>The print version (less important for me), could be the \"plain\" logotype, but ideally would have something that indicates animation (as Matjaz suggested). <br> <br>For print, what does anyone think of the following? (now without color, until the design is finalized): <br><img src=\"http://www.typophile.com/forums/messages/29/12546.jpg\" alt=\"mattiklogo-anidot\"></p>"
