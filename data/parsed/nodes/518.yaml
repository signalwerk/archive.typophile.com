    date: 2003-07-11T01:00:00
    votes: null
    html: "<p>Hrant, <br> <br>Thanks for hanging in there with me on this, and for the encouragement. Here're 3 tweaks of version 9, each with an increasingly larger s (original not shown): <br><img src=\"http://www.typophile.com/forums/messages/29/12798.jpg\" alt=\"mattiklogo-9abc\"> <br>Do any of these seem right on? If not please direct as to larger/smaller. This was my first-ever attempt at reproportioning an entire letter, so I hope I did okay. <br> <br>Once the s is fixed, it should be about done, don't you think? <br> <br>As for the distortion of outlines: Wow, quadratic beziers? I think I missed that math class. To try your suggestion, I downloaded a trial version of Fontlab, but a half hour of tinkering in this unfamiliar interface got me nowhere. Just so I know I'm aiming at the right result, please clarify: Were you suggesting that I cut and paste the complete outlined Illustrator logotype right into a Fontlab character/glyph workspace window, and then export the whole thing as a TrueType font? ...And then in Flash (Fireworks, etc.) when I type the appropriate key  in my new font, the whole logo would appear? This is so new and bizarre to me. (And if I can't do it with the trial version, I'll have to skip it altogether.) I may have to save this for down the road. <br> <br>Well, as soon as I get these final tweaks done, I can move on to deciding on a color. In your opinion, is it appropriate to ask for feedback on color in this forum/thread? <br> <br>Gratefully, <br>Jim M <br> <br>\t</p>"
