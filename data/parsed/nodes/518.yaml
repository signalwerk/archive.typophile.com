    date_raw: 7 Jul 2003 — 2:46am
    date: 2003-07-07T02:46:00
    votes: null
    html: "<p>Tanya--  Sorry, I didn't see your last post before doing mine. The reversed serif idea made a lot of sense; is this what you had in mind?: <br> <img src=\"http://www.typophile.com/forums/messages/29/12594.jpg\" alt=\"mattiklogo -reversed k serif\"> <br>The result wasn't quite what I expected, but what do you think? <br> <br>I'm tempted to raise the tips of the now-facing serifs (so the k's doesn't look \"bent down\"), but I probably shouldn't, because the angle of these chiseled serifs also appears in the m, i and n. (I had earlier tried \"straightening\" all the horizontal serifs, but it killed the character of the face.) Any other suggestions? <br> <br>(And what do the rest of you think of it?) <br> <br>Anyway, I really need to sign off, but I just had to try out your clever idea. Thanks! <br> </p>"
