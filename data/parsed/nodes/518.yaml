    date: 2003-07-05T13:54:00
    votes: null
    html: "<p>I like the \"dot play\", too. But I am afraid that merging of the q's stroke and the dot makes the left part of this character too heavy and therefore destroys the rythm of the whole. Maybe at smaller sizes the dot even won't be visible and just a weird distorted \"g\" will remain. A possible solution could be to move the dot slightly to the right, but I am not sure if there is enough place to do that (the dot in the centre of the counter probably wouldn't work so well). Another solution: Make the dot black. This solution makes some troubles too: what will happpen at B&amp;W reproduction...  <br> <br>A suggestion: maybe the dot could just \"jump\" towards the \"g\" but remain above it. It would of course spoil the eye effect, but may suggest movement &gt; animation &gt; interacitvity &gt; flash... <br> <br></p>"
