    html: "<p>Dmitry and Ly--  Thanks for the input, but it's a bit unclear to me; as version 10 is basically the final version, I was asking above for any final tweaks to this version. <br> <br>Then Dmitry took <i>version 1,</i> which is the least modified from the plain Baskerville, and made two suggestions: linking the serifs on the \"ik\" and widenening the \"s.\" This is confusing to me, because the \"s\" has already been widened since the version used by Dmitry, starting with version 9. (And incidentally, when I previously tried the \"ik\" serif linking, which seemed like a natural, it unfortunately produced some undesirable side effects.) <br> <br>Next, Ly responded to Dmitry's suggested changes to <i>version 1</i> by writing that \"Now it feels like a logo.\" Compared to which version, and why? <br> <br>Any clarification from either of you would be appreciated, especially if it can be applied to the final version. Thanks.   <br> <br>--Jim M</p>"
