    html: <p>Jacques--  I missed <i>your</i> message. (You beat my post by two minutes.) Anyway, I was impressed not only by your effort on my behalf (must have taken some time!), but also by the interesting evolution you fleshed out. It seems like your "s" echoes the rounded tip on the "a," and your other mods further apply this softer touch. It looks to me like the start of a new "soft serif" typeface... <br> <br>And although, as you noticed, I'm really wanting to wrap this one up for now, I can always evolve it further later, and I'll definitely keep your ideas in mind for future reference. <br> <br>Thanks, <br>Jim M <br></p>
