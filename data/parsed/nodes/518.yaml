  - id: 3695
    user_id: 1969
    user_name: mattik
    user_path: null
    user_image: null
    date_raw: 10 Jul 2003 — 7:45am
    date: 2003-07-10T07:45:00
    votes: null
    html: "<p>Getting very close...  Thanks for the further input. At this point I've decided to go with the design of the previously posted version 7, so all I need now is to finish the fine tuning, which I still seem to need help with. (But thanks p.j. and Emir for trying the variations.) <br> <br>Here are versions 8a and 8b, which only differ in the spacing of the \"ti\": <br> <br><img src=\"http://www.typophile.com/forums/messages/29/12752.jpg\" alt=\"mattiklogos 8a &amp; 8b\"> <br>Now I'll address some of your points individually (but others please feel free to comment on what follows): <br> <br>Hrant--  I added that hair of space to the \"ig,\" and then I reduced the foot curls on the \"t\"s (and the bottom curled serif on the \"a\" to match), and added a bit of space between the \"ti.\" 8a shows the increased space, and 8b has just a bit more space there. Which do you think is better, or do I need even more space yet? And did I create any new problems in the process? <br> <br>Alex--  I tried raising the tops of the \"t\"s, but it looked odd no matter how I did it. And I appreciate you pointing out the \"empty space\" above the second i; my clients usually say they want designs with lots of white space, so I think it's good that my logo suggests a sense of empty space. <br> <br>Matjaz--  It's really good that you spotted that fat descender on the g. When I did my initial work before my first post, I made several modifications to reduce the onscreen distortion caused by antialiasing my vector art, which was the worst in Flash. These mods were the things I felt the most insecure about presenting to typographers, and I wondered if anyone would notice. I think you're the first (in 34 posts) to mention any of this! I actually imaged that this topic of modifying type to look good onscreen with antialiasing (not a pixel font) might generate the most discussion in my thread. <br> <br>I mentioned right up front that I had changed the baseline serifs (removing their bottom \"dimples\"). The g (my more open version as well as the Baskerville) was tending to get a flat section on the bottom of the descender, and thickening it seemed to counteract this. But if it's bad typography, I want to change it. I tried to compromise with the g in version 8 (a &amp; b) above. How does that look? <br> <br>I had the same \"flattening\" problem with the top of the \"a,\" and did a similar fattening of the stroke. But after the scrutiny inspired by your observation, I tried to thin that back up in this last version (above), although the letterform is still somewhat different in an attempt to reduce its antialias mess. <br> <br>Here's a comparison of how Flash rendered the outlines of the raw Baskerville \"a\" and my new compromise \"a\": <br><img src=\"http://www.typophile.com/forums/messages/29/12753.jpg\" alt=\"&quot;a&quot;s in Flash\"> <br>But the logo will also appear in print, so I don't want to do anything too weird in compensating for antialias distortion. So, I'm hoping my new \"a\" stands on its own as a halfway decent letterform. Please look at the two \"a\"s enlarged (below), and let me know what you think: <br><img src=\"http://www.typophile.com/forums/messages/29/12754.jpg\" alt=\"enlarged &quot;a&quot;s\"> <br> <br>Well, everyone, thanks again for your help. One question (for the moderator?): Next I'll be trying to decide on color, and would like a variety of respondents. Is this forum appropriate for that? Thanks.  --Jim <br>  <br> <br> </p>"
  - id: 3696
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 10 Jul 2003 — 9:58am
    date: 2003-07-10T09:58:00
    votes: null
    html: "<p>I think 8a is the better one. <br> <br>Can you make the \"s\" wider? (Jeez, I'm sounding like a pesky client...) It seems to be drawing too much attention to itself. (In a text font you want width variance, because that helps readability, but in a logo it sometimes backfires.) <br> <br>About Flash fidelity: <br>1) Don't let it drive you crazy, you can circumvent it completely. <br>2) Using TT format instead of PST1 seems to reduce the strangeness. <br> <br>-- <br> <br>BTW, I also like Emir's \"g\" trick - but I'd dump the \"i\" dots there. <br> <br>hhp <br></p>"
  - id: 3697
    user_id: 1895
    user_name: hawk
    user_path: null
    user_image: null
    date_raw: 10 Jul 2003 — 7:19pm
    date: 2003-07-10T19:19:00
    votes: null
    html: '<p>Jim, <br> <br>Keith is right. Darrel is right. <br> <br>Hrant asked you a question, but i dont see the answer: <br>" do you really want to convey such a conservative attitude....? " <br> <br>try to play with serif + sans serif. <br> <br> <br>David Hamuel</p>'
  - id: 3698
    user_id: 1969
    user_name: mattik
    user_path: null
    user_image: null
    date_raw: 10 Jul 2003 — 8:29pm
    date: 2003-07-10T20:29:00
    votes: null
    html: <p>Hrant--  Thanks so much; your feedback about the s is exactly the kind of thing I need. I had actually thought the same thing, but figured I don't know enough to make that call. I'll work on it and post two degrees of the widening. <br> <br>And I'm not sure why you mention TT format; I'm not building a font (wouldn't even know how). I'm building a logotype in Illustrator. I can rasterize it in Photoshop for certain purposes, but to use it in Flash I want to keep it as vectors. How can I avoid the distorting consequences of antialising?  --Jim</p>
  - id: 3699
    user_id: 1969
    user_name: mattik
    user_path: null
    user_image: null
    date_raw: 10 Jul 2003 — 8:55pm
    date: 2003-07-10T20:55:00
    votes: null
    html: <p>David--  I appreciate your feedback. Glad you agree with Keith and Darrel, as I took that route of not trying to indicate animation, and removing the dots. <br> <br>As for Hrant's question about conservative, in my second post I guess I only implied an answer by saying I didn't want to appear boring or uncreative, so would try various things to liven it up. (This lead to all the variations that finally culminated in the basic design of version 7.) <br> <br>I think if conservative in this context means uncreative, I definitely don't want that. If, however, working creatively with existing elements in a non-radical, subdued/subtle way is considered conservative, then yes, that's something I'd like to realize (in my work and my logo). I really like the beauty of classic serif faces, and I wanted to try to use one in a way that was clean and somewhat contemporary. Since I work mostly with architects who often think sans serifs like Futura or Helvetica are the only way to have clean, "structural" type, it would be nice if my logo implied other creative possibilities for designing for architectural concerns. <br> <br>And to be honest, I'm so in over my head reworking these letterforms, and I've already devoted so much time to it, that at this point I'll settle for something that isn't ugly, avoids clich</p>
  - id: 3700
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 10 Jul 2003 — 9:40pm
    date: 2003-07-10T21:40:00
    votes: null
    html: <p>&gt; I'm building a logotype in Illustrator. <br> <br>OK, but same difference. Flash renders cubic beziers (the kind Postscript uses, in fonts, EPS, etc.) with lower fidelity than it renders quadratic beziers (the kind TrueType uses). So try importing your logo into Fontogapher or FontLab (preferably the latter) and outputting a TT font. Even though it won't be a "native" TT font (something that can only be done manually), from my experience it still renders better. <br> <br>&gt; How can I avoid the distorting consequences of antialising? <br> <br>Just to be clear, anti-aliasing isn't your problem. Anti-aliasing is good for you! :-) The problem is how Flash distorts outlines, especially cubic beziers. <br> <br>&gt; I've already devoted so much time to it, that at this point I'll just settle for something that isn't ugly <br> <br>Heh heh heh. Now try making a whole font.  :-&gt; <br> <br>But really, I think you're doing very well! It's nice to see such nit-picking. <br> <br>hhp <br></p>
