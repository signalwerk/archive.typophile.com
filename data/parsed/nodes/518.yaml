  - id: 3679
    user_id: 1969
    user_name: mattik
    user_path: null
    user_image: null
    date_raw: 7 Jul 2003 — 2:14am
    date: 2003-07-07T02:14:00
    votes: null
    html: "<p>Wow -- A lot of weekend posts! Thanks to all of you for your input. Yes, the very literal representation of animation in my previous version was annoying, but I thought it might lead somewhere better.  <br> <br>And please forgive me for not catching on (lack of sleep?), but I don't think I understood Hrant's suggestion (which Tanya and Matjaz seemed to like) to leave both dots off, or the meaning of \"a secondary animated effect.\" Maybe it's to keep the \"straight\" form for print, and save playing with the dots for online animation? Or was it really to take all the dots off for print, like this?: <br><img src=\"http://www.typophile.com/forums/messages/29/12588.jpg\" alt=\"mattiklogo - no dots\"> <br>Or was something altogether different being suggested? <br> <br>I did try the \"slightly off\" idea of Matjaz, but the results of that irritated me too. (Though maybe in more skilled hands...?) <br> <br>Perhaps I'm being indulgent messing with these dots; my original intent was for a clean, simple, appealing logotype, and now I'm trying to get it to do too much. If I really want to imply animation in print, I should probably design a logo from scratch for that purpose. <br> <br>So, unless there's a good idea I haven't explored, it seems I should just stop messing with the dots for print, and go with the straightforward version. If I can find an appropriate way online to introduce animation (and I now see several possibilities), I can do that later, and can change it more easily than the printed stuff. (But if anyone still wants to give/clarify dot suggestions, I'll of course consider them.) <br> <br>What I'd finally like to ask--and this is actually why I originally started this forum, so pardon the dot sidetracking--is if anyone sees any *typographic* problems remaining with the logotype. Hrant and a few friends have helped me get some of my major problems fixed, so from a purely typographic standpoint, is it good to go? <br> <br>David Hamuel wondered why I did the \"tti\" ligature. Maybe for any of you to evaluate what I've done, it would be good for me to show the \"raw\" type (1, below) so you can compare it with what I've done (2, below). The raw type is ITC New Baskerville, set in Illustrator with reduced tracking, but no hand kerning. Here they are:  <br><img src=\"http://www.typophile.com/forums/messages/29/12589.jpg\" alt=\"mattiklogo -process\"> <br>So, keeping in mind that on-screen appearance takes priority, is there anything else you hard-core type experts see in this thing that needs to be fixed? Be amicably ruthless, please. <br> <br>Again, sincere thanks to previous (and any future) contributors. A deadline may keep me away for a day or so, but I'll be back then to respond to any new offerings.  --Jim <br>   <br>  <br> </p>"
  - id: 3680
    user_id: 1969
