    html: |-
      <p>In a CFF OT font, you should not generate a flat kern table.</p>
      <p>In a TTF, this is possible, although you may run unto difficulties in some applications (not a well-documented area, I'm afraid).</p>
      <p>Note, however, that technically a kern table is only supposed to include kerning for encoded glyphs, i.e. not for unencoded variants such as ligatures or stylistic alternates. This is one of the reasons that the kern table should be superseded by GPOS kerning.</p>
      <p>Note also that there is a practical size limit to the kern table, beyond which pairs will be ignored.</p>
