    <p>Hi there,</p>
    <p>I am generating an Open Type (CFF) font and I don't know if I should check the option in Prefereces &gt; Generating Open Type and TrueType &gt; Kerning: "Export 'kern' table</p>
    <p>Is it OK in an OT font to generate the flat kerning table together with the class-based kerning or only one of them should be chosen?</p>
    <p>Thanks in advance.</p>
    <p>Ramiro.</p>
