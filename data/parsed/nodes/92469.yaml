    <p>Dear all!</p>
    <p>I’m doing a project for my MA in Communication at ESAD (Escola Superior de Artes e Design) in Porto, Portugal. The theme of the project is Italian Graphics during the period between 1930 and 1960. I need your help to try to identify some of the typefaces used in some of the publications (see attachments) that were printed at the time. Many thanks in advance.</p>
    <p>Kind regards,<br>
    Ricardo Calabaça</p>
