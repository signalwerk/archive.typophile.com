      <p>Century was of course commissioned for <cite>Century</cite> magazine. I don't know, but imagine it was a multi-column format, to explain how condensed the original "Century" font was. It was just too condensed for single-column texts such as books, so an expanded version was made quite a bit later ("expanded" only in comparison to the original). This was the "Century" font most often selected for book work. I don't know about the linecaster days, but it did have small caps in the Linotron 202 format. I think it didn't have old-style figures, but I don't really remember.</p>
      <p>But the best "Century" for bookwork was Primer, which did have small caps and old-style figures. P.J. Conkwright selected it for Princeton's Thoreau books. Bitstream has a sort-of revival (Century 751?), but as I remember, it was a typical Type 1 font with no small caps, os figs, etc., and not particularly well done. I tried to make a version of Primer, and while it was OK, it just didn't have the magic of Ruzicka's Primer in metal. But I'm a comp first &amp; text interior designer second. If any true font designer were to make a good Primer, I think it would be welcome.</p>
      <p>As to being dated -- Depends. If you're trying to impress other designers or marketing managers, probably so. I was at a meeting last week, where it came out that for some presses, the marketing manager had final say on book jacket designs. Turns out that for a number of them, a "good jacket" is one which will sell when placed in an airport terminal. That few university press books are sold in airport terminals seems to have escaped them.</p>
      <p>If you're trying to help an author connect with a reader, of course Century isn't dated. On the other hand, Century Expanded was one of those fonts that didn't survive the move from the Linotron 202 to PostScript -- like so many others.</p>
      <p>With the Linotron 202 fonts, Century Schoolbook worked for text with about a 9-point setting. It is aother of those fonts that worked well in one or two sizes &amp; IMSLTH opinion, not others.</p>
