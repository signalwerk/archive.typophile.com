      <p>Bill,</p>
      <p>As to Century Schoolbook &amp; book composition: it may be the width of the letterforms, but I think it is a bit more, particularly their weight. I've specified Schoolbook once or twice, and set a few more books where it was specified by other designers, but it has been quite a while. When you specify a type size, some designers at least are looking at "the color of the page," which includes a number of relationships, character fit, word spacing, line spacing, margins, and of course the type itself. For some reason, Schoolbook seems to "snap" with a nominal 6x9 trim &amp; 24-26 pica measure in around a 9-point setting.</p>
      <p>Of course, that's old school (i.e., dated). Nowadays, any font is OK if you specify it 10/15, unless you can sneak 9/15 by the people who have to sign off on the design.</p>
