      <p>Century Schoolbook is an extremely wide font, so I can see that it might not be suitable for books except at very small size. </p>
      <p>However, when an extremely readable, wide type is suitable, it can work admirably. For example, the Government Accounting Office here puts out reports on letter sized paper (8 1/2 x 11), which is always a problem. Their solution is to use Century Schoolbook with wide margins. This to me is a pretty good solution, and results in extremely readable reports. </p>
      <p>The layout is a bit old-fashioned 'modernist', but still it delivers the goods admirably well. <a href="http://www.cherrycommission.org/docs/Resources/Completion/GAO%20Completion%20report.pdf" rel="nofollow">Here is one example</a>.</p>
