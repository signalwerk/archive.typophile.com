      <p>&gt;color of the page</p>
      <p>I also feel that this is a critical factor--which is why I think optical sizing is so important if the design is to work at different sizes. </p>
      <p>Because Century Schoolbook is so unusual in its width and, as you point out, weight, it may only work well in very special situations. But it may work very well then. </p>
      <p>Personally, this style of design, which I think of as a variety of 'Scotch', is not one I am that fond of aesthetically. I should have written above that I "admire" Century Schoolbook rather than really like it. It is admirably well executed. The only scotch I really like in print is Caledonia, but maybe it crucially departs--I haven't studied it enough to know.</p>
      <p>On the issue of leading, I was very interested to read in Mitchell &amp; Wightman's 'Book Typography' that blacker type usually requires more leading to work. Thus Quadraat calls for a lot of leading. </p>
      <p>I do prefer the older style in which there is less leading and somewhat longer ascenders and descenders. To me the type looks more graceful, and it knits the page together better. But working well with tighter leading depends on the design of the type.</p>
    html_clean: |-
