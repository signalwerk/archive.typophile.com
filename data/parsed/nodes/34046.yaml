      <p>&gt;It can apply just fine in the realm of thought</p>
      <p>No, it doesn't even work in the realm of thought, or theory. As I said, *geometry* dictates that a bolded glyph is either wider on the outside or narrower in the inside, or both. And depending on what you do with the width of the glyph, it will affect what spacing will look best. --As will changing the optical size. So to talk about best spacing you have to also talk about width of counters and optical size, not just boldness. It may be typical nowadays to 'go East or go West'  [as Nick Shinn put it] in bolding a glyph, but there are other options. </p>
      <p>And, as Charles pointed out overall style can also affect spacing. Many of the traditional 'modern' (Bodoni style) serifs style were quite bold, but as he points out, their wide, high contrast shapes didn't take kindly to very tight spacing in text.  </p>
      <p>So your rule is just too simplistic. While often true, it has important exceptions and so is misleading and wrongly restrictive. </p>
      <p>The Mitchell and Wightman issue is different. Quite clearly *here* you are (without looking) denying their view, which is explicitly based on color considerations. And in many discussions you have also denied the traditional view--which I follow--that evenness of color is one primary goal in good text type design.</p>
