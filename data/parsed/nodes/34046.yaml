      <p><cite>Charles: Anybody have more thoughts on Primer (aka Century improved)?</cite></p>
      <p>No way am I going to touch that other tangent, but I'll gladly discuss Primer. </p>
      <p>Primer is another of those classic American book faces whose unavailability in a decent digital form I lament. (Caveat: I have never worked with the Bitstream version, but what I have seen doesn't impress me.)</p>
      <p>Primer is a lot harder to find "in the wild." But, William, here are two samples from my collection. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Primer_HessePage_3998.jpg"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Primer_Woodpeckers2_6116.gif"></div><p></p>
      <p>The first is from the book I mentioned in Eben's <a href="http://typophile.com/node/33915" target="new" rel="nofollow">book-collecting thread</a>: <cite>Beneath the Wheel</cite>, by Hermann Hesse [Farrar, Straus and Giroux, Inc., 1968]. This is set in either 10/14 or 11/14 (see below for why I'm hedging), printed on an ivory antique-finish stock. This particular book is in only fair/good condition and there's quite a bit of foxing, which I didn't bother to try to clean up.</p>
      <p>The second is from <cite>Song and Garden Birds of North America</cite>, edited by Alexander Wetmore [National Geographic Society, 1964]. This was printed on a pretty hard, coated stock. The text setting is 9/12. The head is 24 pt.</p>
      <p>Note: These examples are not to scale with one another.</p>
      <p>Primer was produced in two variations: one with short descenders and one with long descenders. You'll notice that the Nat'l Geo book uses the short descenders, while the Hesse is set with long descenders. Both versions would have been cut on the standard alignment for the nominal point size. The short descenders would fit on the nominal body, but the long descender version would need to be cast on a body at least one size larger. This is why I'm hedging a little in declaring the size of the Hesse setting. But the Hesse text is the same size as the subhead in the bird book (<em>"Family Picidae"</em>).</p>
      <p>Another interesting aspect I've noticed is that the typical optical adjustments between sizes is particularly pronounced in the Primer series. (I thought I had something from Griffith mentioning this, but I can't put my hands on it.)</p>
      <p>From some 1954 MLCo. advertising copy: "In the small sizes, Primer can crowd considerable type into a small space without graying into fuzziness. The even gradation of color through the various sizes from 6- to 12-pt. results directly from Linotype's policy of making separate drawings for each point size, <em> modifying the width</em> of individual characters as needed." [emphasis in the original]</p>
      <p>I'm pretty sure Primer was indeed conceived to replace (i.e. compete with) Century Schoolbook, hence the name. (Again, I can't seem to put my hands on a primary source.)</p>
      <p>Naturally, it was primarily marketed toward textbooks and educational materials. From the same ad copy quoted above: "Primer was designed for us by Rudolph Ruzicka primarily for textbook or schoolbook use. But Ruzicka drew us an alphabet so clear, so free of frills and mannerisms that might interrupt the reader, that we strongly recommend it for all types of work where legibility and dignity are of the essence." (Remember, this is marketing copy.)</p>
      <p>Ruzicka had this to say [from <cite>Rudolph Ruzicka: Speaking Reminiscently</cite>, edited by Edward Connery Lathem, The Grolier Club, 1986.]: "Finally, after Fairfield Medium, I did Primer, which was intended to be a text type; that is to say, one principally meant for text books and that sort of thing. It was to be totally without artificial refinement, without affectations of any kind. Supposedly; but it isn't, really."  </p>
      <p>Charles -- I don't know whether I'd qualify for you as a "true font designer," but I have, on several occasions, toyed with the idea of doing a revival of Primer. The original Linotype working drawings are at the Printing History Museum in North Andover, and I've had a brief look at some of them. Gardner would never let me work from them without permission from Linotype, but now that Lino ownership is back in the States, it might be easier to get some traction with the idea. I could bring it up with Allan Haley. Still, I'm not convinced that there would really be enough broad market appeal to make the venture truly viable.</p>
      <p>-- K.</p>
