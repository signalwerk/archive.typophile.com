      <p>Charles, I checked my late Uncle Ben Lieberman's 1967 book 'Types of Typeface' for Primer. At the end of the book he has a variety of typefaces (metal) all set in the same paragraph at 10/11. This is a useful device for comparison, though of course it has its limits. </p>
      <p>At any rate, the contrast between Century Schoolbook and Primer--he has both--is striking. The most obvious thing is that Primer is much lighter. At this small size with little leading, Primer is much more of a 'text' face, much more readable. </p>
      <p>My guess is that Century Schoolbook was designed for primers and other children's books, and intended to be used at very large size with lots of leading. And it does look very readable and pretty in such useage.</p>
      <p>I suspect that it works well as an alternative to Courier on letter sized paper, or that it works at 9 point in some settings, as you say, is more or less good luck, beyond its original 'brief'.</p>
