      <p>I'm also a taker for Century Schoolbook. And i don't think it looks dated, I'm convinced that no typeface does look dated per se, it all depends how a typeface is used and in what (formal) context. ( I do admit that there are typefaces that are more likely to look dated/old-fashioned than others, but there's no absolute IMO)<br>
      In other words, I wouldn't be put off from using a face because somebody says it looked dated to them, i'd rather understand this as a challenge to use it in a way that doesn't make it appear old-fashioned*. If somebody said the way i use it or my design looked dated, THAT would make me think tho.</p>
      <p>* Unless an old-fashioned look is required, but that's a completely different story.</p>
