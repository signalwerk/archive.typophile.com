      <p>Let me try to explain better: If you have a text face in a light weight and in a dark weight, the dark weight needs to be spaced tighter than the light weight, otherwise it's no longer a text face. This is basic type design stuff.* If we are in fact discussing "normal book text sizes", then if you stray from a quite tight relationship between internal versus external white, you are killing readability. No matter what kind of boots you prefer.  Issues of functionality do not make those of "fashion" moot - in fact the two do need to be balanced, always. But let's not pretend that It Doesn't Matter.</p>
      <p>* William: ask Berlow.</p>
      <p>The way this relates to what William wrote about linespacing is that the<br>
      same type of thing (although certainly to a lesser degree) probably applies.<br>
      And it makes sense: a darker line holds itself better, so you need less leading.<br>
      What happens to look better to whom in what century is beside the point.</p>
      <p>hhp</p>
