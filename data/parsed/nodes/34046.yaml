      <p>&gt;more than one parameter</p>
      <p>That strikes me as the complex heart of the matter. </p>
      <p>The problem with saying 'other things being equal' is that they *can't* be equal when you make a design bolder. You will affect either the width of counters or the character as a whole, or both, and you have a choice on how to do this. And those choices will affect best spacing.  </p>
      <p>Good balance of white and black, or 'notan,' and in particular good letter spacing also depends on optical size.</p>
