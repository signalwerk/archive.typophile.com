      <p>You're just flailing. And what's really funny is that you're hinding behind "even color" now, even though what I'm explaining actually helps that too! What you're advocating ensures even color all right - between the two weights!  :-/</p>
      <p>This really isn't very complicated. Darker weights, when done properly (as in your own "normal book text sizes" - you know, something you'd read a book in) have less white space inside than lighter weights, almost always in absolute measurements, but at the very least in relation to the black bodies.* Heck, otherwise they wouldn't look darker! The fact that the inside whites are relatively smaller means the outside whites have to be smaller too, otherwise either the lighter or the darker weight will have bad notan - like how Helvetica is too tight. I shouldn't have to explain this, and frankly I don't, because you already know it, you simply slipped, possibly in your eagerness to defend Mitch &amp; Whitie against me; or really anybody against me. We all make mistakes; but some of us have great trouble admitting it.</p>
      <p>* Meaning that even if a darker weight has the same absolute inside counter measures (which is very hard to find examples of, not least because it makes the widths too great), the darker stems etc. will make them look relatively smaller. But as a rule the insides do get smaller, because that's the smart way.</p>
      <p>If you have a real-world counter-example, please show it.<br>
      Show me a font where a darker weight is looser. And if you<br>
      find it, go ahead and call it readable with a straight face.</p>
      <p>&gt; So your rule is just too simplistic.</p>
      <p>It's not my rule! Please, ask around. Yes it's basic, but that's the good kind of rule.<br>
      It comes straight from notan (although that's not the usual term used).</p>
      <p>&gt; The Mitchell and Wightman issue is different.</p>
      <p>Yes, but not different enough. Not different enough to be true. If a darker weight needs tighter letterspacing between letters to maintain readability, tighter leading would generally help too. For one thing, think of wordspaces and their role in the determination of optimal leading.</p>
      <p>True, unlike letterspacing it's harder to ruin readability with looser leading, but it's still functionally bad in terms of readability (at the very least by wasting saccades over pages, but probably more significantly).</p>
      <p>&gt; evenness of color is one primary goal in good text type design.</p>
      <p>Now <cite>that's</cite> simplistic.</p>
      <p>hhp</p>
