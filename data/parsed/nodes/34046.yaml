      <p><cite>No, all else being equal</cite></p>
      <p>OK, back to the odd twist.</p>
      <p>Yes, it depends. I've seen some beautiful 19th century French books, where wide word spacing was used -- it was in fashion then. To compensate, the leading was increased, as were the margins. The character fit was not tight, but hardly loose. At first it looks odd to a modern eye, but the overall balance soon takes over &amp; you don't notice it.</p>
      <p>Good balance is more than one parameter, and will to a large extent survive a change in fashion.</p>
