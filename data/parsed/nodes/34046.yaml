      <p>Times New Roman Bold also has wider side bearings on the lower case than does Times New Roman Regular. And I have never heard complaints about the readability of Times Bold.</p>
      <p>It is true that Walter Tracy thinks that the total side bearings of the n should never be greater than the counter of the n, which Times New Roman Bold violates. However, he doesn't criticise the fact that the Times bold has greater sidebearings than the regular. And indeed, he says that proportionally to the counter, the bold H usually requires larger sidebearings than the regular. It would be interesting to see what Tracy did in his own fonts. </p>
      <p>As Tracy notes, the phenomenon of related bold is a 20th century invention. And as we can see from Perpetua, Times New Roman, and Adobe's recent faces, there have been diverse approaches to the companion bold. </p>
      <p>In Adobe's case, the effort has been to use Multiple Master technology to produce a great range of weights for serifed fonts, in the way that such a range was introduced for sans faces--first for Futura, if I'm not mistaken. This has resulted in much more similarity in size to size than in the case of old metal fonts, especially pre-pantographic punch cutter fonts. Current practice of Slimbach more or less follows Tracy, but with considerably tighter spacing than Tracy recommends.  </p>
      <p>As to readability, I don't think companion bolds are particularly readable in extended text, nor are they intended to be. You almost never see extended text in a bold weight. That rarity is, I believe, because excessive darkness hurts readability--as does excessive lightness. The 'good notan' gained by tight spacing of seriffed bolds is a matter of aesthetics, and the purpose of contrast to the companion regular, rather than readability. </p>
      <p>Overall, I am inclined to not to regard the issues of spacing bolder fonts as settled art. I do think it depends partly on style and optical size. For example Times New Roman Bold deliberately has stylistic differences from Times New Roman--harkening back to the pre-pantographic punch cut days. This is not necessarily a bad idea.</p>
    html_clean: |-
