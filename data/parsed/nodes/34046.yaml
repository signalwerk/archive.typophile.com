      <p><cite>CE: By “real” or “true” font designer, I means essentially someone other than me. </cite></p>
      <p>Well, then I guess I would qualify ;-)</p>
      <p>William, you are kind; but one font could just be a fluke. We'll see what future efforts yield, and then time will tell.</p>
      <p><cite> WB: Heh,heh. Don’t tell him who told you, but though he presents a very gruff exterior, I think you can sweet talk him. </cite></p>
      <p>Oh, I know that. I have a great relationship with Gardner. But he explained his position vis-a-vis Heidelberg (owners of Lino at the time) and I respect his position. The work that Matthew did on Monticello was done with the full blessings of Linotype (and they co-own the results, and it's a shame they didn't launch any marketing efforts in conjunction with the Princeton project), and that's why he was allowed to use the drawings.</p>
      <p>Primer is a wide design. In fact, it has pretty unique proportions all around -- rather wide and extremely large x-height, especially for its time. But, you're also probably reacting strongly to the 9-pt above, which is unduly emphasized by the screen enlargement.</p>
      <p>Nevertheless, some of these aspects, which admittedly are part of its charm, also give it some limitations. Which is why it was always better suited to textbooks and was never as popular or broadly useful in general book work as Caledonia or Electra or Fairfield, for instance.</p>
      <p>Hrant, you're right. Although I constantly toy with ideas about reviving faces I admire (and don't think have been done justice), I am possibly more temperamentally inclined to do other work and to just let it be deeply informed by those models. </p>
      <p>-- K.</p>
