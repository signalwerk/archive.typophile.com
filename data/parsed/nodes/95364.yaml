  - id: 518376
    user: 22675
    date: 2012-08-08T04:17:00
    date_raw: 8 Aug 2012 — 4:17am
    votes: null
    html: |-
      <p>Closer looks <a class="freelinking external" href="http://www.myfonts.com/WhatTheFont/forum/case/376568/" rel="nofollow">here</a> and <a class="freelinking external" href="http://shop.cooperhewitt.org/common/images/products/large/AM_MAXBILL_WALLCLOCK.jpg" rel="nofollow">here</a><br>
      Looks custom to me or even designed by Max Bill himself. Makes me thinking (a lot) to some modified (manually rounded, /4 redrawn...) <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/eurostile/t-regular-extended/" rel="nofollow">Eurostile Extended</a>. Another point giving credit to the Eurostile track is it's actually <a class="freelinking external" href="http://www.pagels.de/JunghansLogo_claim_P432.jpg" rel="nofollow">Junghans logotype</a> font (and almost everywhere on <a class="freelinking external" href="http://www.junghans.de" rel="nofollow">their website</a>)<br>
      Some more in the same vein: <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/eurostile-candy/" rel="nofollow">Eurostile Candy</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/naghachian/aban/" rel="nofollow">Alban</a> (another rounded Eurostile), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/reversal/" rel="nofollow">Reversal</a> (another Eurostile clone), <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn/" rel="nofollow">Saturn</a> (one more Eurostile), <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/reaction/" rel="nofollow">Reaction</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/phantom/" rel="nofollow">Phantom</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/stak/" rel="nofollow">Stak</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/light-c/" rel="nofollow">Geometry Soft Pro Light C</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/miedinger/" rel="nofollow">Miedinger</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/phat/" rel="nofollow">Phat</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/JUNGHANS_4457.png"></div><p></p>
