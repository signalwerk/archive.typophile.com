      <p>Closer looks <a href="http://www.myfonts.com/WhatTheFont/forum/case/376568/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a> and <a href="http://shop.cooperhewitt.org/common/images/products/large/AM_MAXBILL_WALLCLOCK.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a><br>
      Looks custom to me or even designed by Max Bill himself. Makes me thinking (a lot) to some modified (manually rounded, /4 redrawn...) <a href="http://www.myfonts.com/fonts/urw/eurostile/t-regular-extended/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eurostile Extended</a>. Another point giving credit to the Eurostile track is it's actually <a href="http://www.pagels.de/JunghansLogo_claim_P432.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Junghans logotype</a> font (and almost everywhere on <a href="http://www.junghans.de" title="Click to visit an external URL." class="freelink freelink-external freelink-external">their website</a>)<br>
      Some more in the same vein: <a href="http://www.myfonts.com/fonts/linotype/eurostile-candy/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Eurostile Candy</a>, <a href="http://www.myfonts.com/fonts/naghachian/aban/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Alban</a> (another rounded Eurostile), <a href="http://www.myfonts.com/fonts/typodermic/reversal/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Reversal</a> (another Eurostile clone), <a href="http://www.myfonts.com/fonts/dsgnhaus/saturn/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Saturn</a> (one more Eurostile), <a href="http://www.myfonts.com/fonts/fw-identikal/reaction/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Reaction</a>, <a href="http://www.myfonts.com/fonts/fw-identikal/phantom/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Phantom</a>, <a href="http://www.myfonts.com/fonts/fw-identikal/stak/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Stak</a>, <a href="http://www.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/light-c/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Geometry Soft Pro Light C</a>, <a href="http://www.myfonts.com/fonts/canadatype/miedinger/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Miedinger</a>, <a href="http://www.myfonts.com/fonts/fw-identikal/phat/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Phat</a></p>
