  html: |-
    <p>Today I was reading the label on a pair of hand-warmers, which included the phrase: "Warning: Improper use may cause bums". This struck me as a rather odd side effect for anything to have. Even more odd was the fact that the kerning in 'warning' (if any) seemed perfectly normal.</p>
    <p>Just thought I'd share.</p>
    <p>André</p>
