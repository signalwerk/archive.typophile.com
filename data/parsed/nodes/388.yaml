    html: <p>I used to work for a man who insisted on me using "SM" (Service Mark) with every appearance of his (I'm sure unregistered) logo, in addition to every time the name of one of his products was referenced. <br> <br>I had assumed that "SM" was only used  when representing a product or service name (almost like the "d.b.a." of the product/service world), but not with a logo device. Of course, being my employer, I did whatever he asked</p>
