    html: "<p>The Lanham Act covers trademark and other -mark law. Here it is: <br> <br><a href=\"http://www.bitlaw.com/source/15usc/index.html\" target=\"_blank\">http://www.bitlaw.com/source/15usc/index.html</a> <br> <br>...and here is its definition of a service mark: <br> <br><a href=\"http://www.bitlaw.com/source/15usc/1127.html\" target=\"_blank\">http://www.bitlaw.com/source/15usc/1127.html</a> <br> <br>...and the registrability of an SM: <br> <br><a href=\"http://www.bitlaw.com/source/15usc/1053.html\" target=\"_blank\">http://www.bitlaw.com/source/15usc/1053.html</a> <br> <br>I don't think a trademark or a service mark are worth much unless registered, despite popular assumption. I do believe that both do offer some protection.</p>"
