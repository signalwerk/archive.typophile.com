    html: <p>John -- <br> <br>The trademark symbol (™) is used to indicate a mark which a company considers to be a unique trademark, whether registered or not. The TM symbol has no legal significance, but only serves to notify the public that the mark owner views the mark as a protectable trademark. The circle-R (®) mark is used when the trademark has been duly registered with the appropriate government office. In the U.S. this is the <a href="http://www.uspto.org" target="_blank"> Patent and Trademark Office</a>. * <br> <br>The circle-R symbol should be used systematically to identify a registered mark when using it to promote a product or service, in order to secure maximum legal protection. I take this to mean primarily advertising and packaging. This does not necessarily apply to running text which makes editorial mention of trademarks. <br> <br>As far as when/how it is used outside of ads and packaging, that is usually a matter of editorial style. The Chicago Manual of Style declares that the symbols are not necessary in running text. Some other house styles that I'm aware of tend to follow your example of using it for the first instance only. <br> <br>The TM had no legal standing, so using it for <i>every</i> occurrence serves no real purpose.  <br> <br>HTH <br> <br>-- Kent. <br> <br>* My information comes from <i>Patent, Copyright, &amp; Trademark</i> by Stephen Elias (Nolo Press).</p>
