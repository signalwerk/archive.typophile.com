    date: 2013-04-09T09:21:00
    date_raw: 9 Apr 2013 — 9:21am
    votes: null
    html: <p>Not only hand-drawn, but poorly at that. Note the steps in some of the straight edges? That logo was done in a vector program and the nodes are offset from each other. When you have it redone have them do it right.</p>
    html_clean: <p>Not only hand-drawn, but poorly at that. Note the steps in some of the straight edges? That logo was done in a vector program and the nodes are offset from each other. When you have it redone have them do it right.</p>
