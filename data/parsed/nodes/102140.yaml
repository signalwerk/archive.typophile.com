    html: |-
      <p>Copperplate is in the ballpark (although its Cs aren't based on circles). Chekc out the light weight:</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/copperplate-gothic/thirty-two-bc/" title="http://www.myfonts.com/fonts/linotype/copperplate-gothic/thirty-two-bc/">http://www.myfonts.com/fonts/linotype/copperplate-gothic/thirty-two-bc/</a></p>
      <p>If you're just looking for a clean version of the logo, it would take less time to redraw in Illustrator than it would to find the font and re-set it.</p>
