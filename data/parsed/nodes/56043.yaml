    html: |-
      <p>I just went to check out the official Public Enemies website hoping to find a press kit with the embedded font, but I did not get lucky. So instead I noticed that the preloader seemed to use the same typeface, so I took a peek inside the swf file and it uses Compacta, which is similar but not identical. Its M touches the baseline, the middle of the S is not straight but diagonal and the height-width relation does not quite match up either. But it's close.</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/letraset/compacta/" rel="nofollow">http://new.myfonts.com/fonts/letraset/compacta/</a></p>
    html_clean: |-
