    <p>Hello to you all, this is brian, pleasure to be in the community.<br>
    This being my first post (although I have been a member for a year)<br>
    I have one pertinent question to designing a typeface; what are some<br>
    essential mathematics a type designer should know when constructing<br>
    a face? I am well aware of the limitless optical concerns but I want<br>
    to really start digging into the details so please, number wonders,<br>
    any advice would be wonderful.</p>
