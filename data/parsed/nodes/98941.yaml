    <dt><em>Elements of Lettering, by Frederic W. Goudy. New York: Mitchell Kennerley, 1922.<em></em></em></dt>
    <dd>This is a companion manual to Goudy's The Alphabet. It was intended to be a general specimen to a handful of lettering styles for craftsmen. Bibliographic record and a digital copy is available at the Open Library. <a class="freelinking external" href="http://openlibrary.org/books/OL6648740M/Elements_of_lettering_(with_XIII_full-page_plates)" rel="nofollow">http://openlibrary.org/books/OL6648740M/Elements_of_lettering_(with_XIII_full-page_plates)</a></dd>
