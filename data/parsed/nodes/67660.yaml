    html: <p>I think the T is too wide. The U is too heavy, try giving it a bit of contrast (making the bottom curve and the right stem thinner. Also, the left diagonal of the A could be lighter, and the A's top serifs a bit heavier instead. Maybe the H bar should go up a bit.</p>
