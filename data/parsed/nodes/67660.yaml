    <p>Here is a logo I've been working on for Utah Wildlife | Outdoor Discovery.  I'm looking for some overall feedback on the design.  I am also including some additional elements I plan on incorporating to help represent the different types of wildlife.  </p>
    <p>To be honest, I think the wildlife text below UTAH needs to be punch up in some way, any thoughts?  </p>
    <p>Thanks for your time and candid feedback.</p>
