      <p>Eben --</p>
      <p>From the context, I think Tim is on the right track. I believe that De Does is coining a term, somewhat tongue-in-cheek, in contrast to <em>incunable</em>  -- or, more commonly, <em>incunabulum</em> (<em>incunabula</em> = plural).</p>
      <p>If "incunabula" refers to books from the very infancy of printing, then De Does is joking that his <cite>Typefoundries</cite> might be called an "excunable" -- a book from the very twilight days of printing -- utilizing, as it did, already outmoded methods of production at such a large scale.</p>
      <p>I don't read Dutch, but a little sleuthing yielded the original passage. You have to go back to p. 84:</p>
      <p>"De <cite>Typefoundries</cite> noemt hijzelf wel schertsend een 'excunabel'. Het was namelijk al in 1976 heel bijzonder zo'n omvangrijke handelsuitgave (477 p.) met de hand te zetten."</p>
      <p>-- K.</p>
