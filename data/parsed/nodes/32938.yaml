      <p>I found several errors and corrected them today. I also changed the added to the text a bit.</p>
      <p>I have finnished the book now and have to say I am very impressed with the book &amp; glad I have it! But I would like to describe what it contents are like a little for folks who are thinking of buying it because it's not a cheap book so it's not an easy thing to decide to buy without enough info. I couldn't find enough info about it before I bought it and wished that I could at the time. I also admit I was hoping for more type centered thinking/detail than I found in the book! Maybe some old style type-culture reticence is at work here. In any even here is my review:</p>
      <p>BdD is not in any way a how-to book, or an academic book or a book about type in any direct way. Therefore it's not a book about Trinté or Lexicon as type ( although they are important secondary subjects ) so much as it is a biography, a character study and sets the real world context for Bram's work. There are some observations made in it that will be helpful for type designers and some observations can be much better made as a result of looking the images &amp; thinking about what's being said but again it is far from being a type design oriented or in any way a didactic book. </p>
      <p>It's form is series of longer &amp; shorter pieces all of which that take an informal tone that ranges from that of a magazine article to that of a letter or perhaps an email. Each of these has been suplemented nicely with images relevant to the story, ideas, or observations in question. Unfortunately &amp; fortunately there is some repetition in topics. Unfortunately because I would have wished for more insight into Bram's choices, process, thinking etc re: type. I wanted more info about his design decisions. But fortunately too because some of the material that is there is further fleshed out and enriched because of the multiple perspectives provided.</p>
      <p>What I came away from the book with was a strong sense that the reason for Trinté &amp; Lexicon's existence had everything to do with the physical and visual result on paper that Bram was seeking. So it was not a Font or Type that BdD had in mind in designing Trinté or Lexicon but a result specific to a printing process, paper, ink and even to some extent down even to the specific company &amp; pressmen. The fonts were mearely a means an end - that end being the ability to produce a book with a complex series of definite qualities.</p>
      <p>This profound context or use centeredness is of course not a new idea, it is actually THE old idea when it came to metal type, and It's what Erik Spiekermann has spoken about as well ( paraphrasing too loosly: type designed without a purpose in mind is a bad idea / type designed to a specific context is a good idea ). But what different here is that in BdD the context of a book, a specific kind of book, is dwelled on at length and the process and evolution of thought that led up to Bram's outlook and then the fonts Trinté &amp; Lexicon is exposed bit by bit over the course of the text. In some ways reading BdD leaves you in the position of an odd kind of detective - one who can only read the stories left by others and who cannot ask questions of your own.</p>
      <p>Ties &amp; Bert: Thank you for the additional specificity!</p>
      <p>BTW - Have either of you read this book? </p>
      <p>If anybody has additional comments about what I wrote or the book itself I would love to hear what you have to say.</p>
