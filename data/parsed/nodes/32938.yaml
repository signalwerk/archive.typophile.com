    <p>BdD - Bram de Does' Monograph</p>
    <p>I have started reading this over the weekend and even though I am not done with it I am already interested in hearing some opinions of the book - and failing that of the typefaces. I am holding mine back for now because of course I am still reading... But I do have some general questions/obsorvations to make </p>
    <p>All the translated dutch texts on type I have come into contact with so far have had an informal/andecdotal style. Is this a general trend in writen dutch or is it a type culture thing? Or am I mistaken? I have invented some possible reasons for this but that's what they are inventions. Can anyone comment on this?</p>
    <p>The book so far has been very much about the physical result of printing - the paper, the ink, the binding, the cloth - in short : the actual physical object. I think that's pretty keen. It makes me interested to hear about materials+type all the more.</p>
