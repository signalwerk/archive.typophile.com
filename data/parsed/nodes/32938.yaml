      <p>De Does' use of 'excunabel' appears to mean: a book printed after 1501, but put together with the same care and amount of work of books printed before 1501. A bit tongue in cheek, but typical of his way of expressing himself.</p>
      <p>BTW In Holland the graphic arts have a long tradition of being formost in the 'elevation of the working class', being unionized very early on. Lectures and self study groups were very common amongst printers, typesetters, etc. in the early 1900's. This aura of 'intellectualism' has stuck.</p>
