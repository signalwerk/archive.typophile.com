      <p>My understanding of incunabula is that it is a term used to define printed books during the period of the latter half of the 15th century, from the beginning of Western printing up to Aldus. Basically meaning, "of the cradle." Neruda's famous take, "out of the cradle, endlessly rocking." </p>
      <p>The standardization that the Aldine work brought to bear essentially ended the rather dramatic transformation and evolution of type during this period. Nothing quite like that has ever occurred again. Incunbular ends with Manutius.</p>
      <p>Gerald</p>
