  html: |-
    <p>Is there a term in English for this kind of setting often seen in historical books? Centered setting with decreasing line lengths to make a roughly triangular shape.<br>
    See attached example of a Dutch book from the middle of the 18th century; I know the Hipnerotomachia Poliphili has beautiful ones too.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/chapterhead_4590.jpg"></div><p></p>
