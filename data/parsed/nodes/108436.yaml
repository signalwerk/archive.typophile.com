    html: '<p>Florian Hardwig <a href="https://twitter.com/hardwig/status/425989840782766080" rel="nofollow">pointed me</a> to <a href="http://books.google.nl/books?id=_Ri63jEKPfgC&amp;lpg=PT47&amp;dq=Haslam+%22Tapered+centring%22&amp;pg=PT48&amp;redir_esc=y#v=onepage&amp;q=Haslam%20%22Tapered%20centring%22&amp;f=false" rel="nofollow">Haslam</a> who calls this “tapered centring”. (German: Spitzkolumne) Thanks!</p>'
  - id: 569888
    user: 45507
    date: 2014-01-23T23:47:00
    date_raw: 23 Jan 2014 — 11:47pm
    votes: null
    html: <p>I see that Hochuli and Kinross in "Designing Books" call it Tapered Setting. p 34. Pretty much the same as Florian pointed out.</p>
  - id: 569909
    user: 1794
    date: 2014-01-24T05:21:00
    date_raw: 24 Jan 2014 — 5:21am
    votes: null
    html: "<p>By the way: “Spitzkolumne” was used for any text block that didn’t fill the page, not just the ones ending in such a triangle.</p>"
