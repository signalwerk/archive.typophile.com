    html: <p>This is just a guess - but the /, and /. look to me like the slashes were meant to be the trailing stroke of the preceding letter. The r. and rs. are simply ligatures, since there would be no other way to have the period under the r's overhang, or to connect an 'r' with a 'standard' 's'.  The o'c is probably a similar ligature commonly used as in five o'clock.</p>
