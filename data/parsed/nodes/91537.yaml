  html: |-
    <p>Hello All,</p>
    <p>I'vee bought a fount of 18pt Parisian Ronde by Stephenson Blake and some of the characters baffle me.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/ParisianRonde-medium_3886.jpg"></div><p></p>
    <p>What was the purpose of the small slash with comma and small slash with period characters? And what about /o'c? I gather these had something to do with invitations and/or calling cards (looking at the /r. and /rs. sorts), but their use eludes me.</p>
    <p>Thank you in advance!</p>
  html_clean: |-
    <p>Hello All,</p>
    <p>I'vee bought a fount of 18pt Parisian Ronde by Stephenson Blake and some of the characters baffle me.<br>
    </p><div class="imageWrap"><img src="/files/parisianronde-medium_3886.jpg"></div><p></p>
    <p>What was the purpose of the small slash with comma and small slash with period characters? And what about /o'c? I gather these had something to do with invitations and/or calling cards (looking at the /r. and /rs. sorts), but their use eludes me.</p>
    <p>Thank you in advance!</p>
