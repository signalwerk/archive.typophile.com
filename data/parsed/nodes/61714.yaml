    <p></p><div class="imageWrap"><img src="/files/secession_3595.jpg"></div><p></p>
    <p>This is from Typology, by Heller &amp; Fili. It’s a French Art Nouveau typeface, listed as ’Secession’, by an unknown designer. Is there a modern facsimile, something that looks reasonably close? The rounded feel is what I find really attractive, and Indentifont was drawing blanks for me...</p>
