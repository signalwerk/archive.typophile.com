      <p>Hi Anna, </p>
      <p>I did some further research. The results are not encouraging.<br>
      _The Inland Printer_ published a specimen of Quaint Open from Dickenson in December 1888 which includes the claim _patent applied for_. The Pettingill catalog of 1901 -- source of the image I posted -- includes the claim _patented_.<br>
      The statement in my post that it was patented in December 1888 is from Loy's book _Nineteenth Century American Type Designers [2009]_.<br>
      I went through the online design patents for December 1888, i.e. D18775 to D18830, but they do not include this patent.<br>
      So the patent date information from Loy is in error.<br>
      Perhaps it was actually patented between 1888 and 1901.<br>
      But perhaps it was not, and the 1901 patented claim is a lie to intimidate competitors, a practice by foundries of the era. </p>
      <p>Don</p>
