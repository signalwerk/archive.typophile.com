    html: |-
      <p>Hi Anna,<br>
      Thanks for the kudos. I appreciate your shared interest in deep digging the facts on fonts where the provenance is lost in the mist of time.<br>
      My notes on the book include:<br>
          Loy's editors, Alastair M. Johnston &amp; Stephen O. Saxe, researched the fonts produced by the designers and engravers profiled by Loy.<br>
      ... and for some reason I too did not write down the name of the actual researcher! Student? We DO tend to ignore the minions!</p>
      <p>Like you I got most of my patent info the hard way by digging at the USPTO. Learned a few quirks about PO examiner behavior in the 19th century. One is that the examiners sometimes let the font design applications pile up then cleared a group within a few days. So if I had a confirmed D-number or issue date I checked all of the D patents in a block of up to 50 before and after. Turned up a fair number not in Loy's book by this method. </p>
      <p>As for who actually designed old fonts, I'll check your reference. I do know that Loy's book is about punch cutters, not designers. Sometimes they are the same, sometimes not. Some foundries allowed the designer or punch cutter to claim the patent &amp; assign it to the foundry owner. Some owners took the credit directly. A few designers got the point where they did not have to assign. Sorting it out is a real forensic exercise!</p>
      <p>And as you note some foundries, like Bruce &amp; MacKellar patented as policy, others did not. Almost nobody included full alphabets in their specimens. So we have to guess about the less frequent letters of unpatented fonts where old type fonts did not survive the modernizing purges by being purchased by Phillips -- his rare 1945 book is a goldmine -- or Solo, or being acquired by a type museum such as StBride or Hamilton.</p>
      <p>Great fun.</p>
      <p>Cheers,<br>
      Don</p>
