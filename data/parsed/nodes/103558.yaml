      <p>Hi again Don,</p>
      <p>Thanks a LOT for your super-quick legwork! I was excited when I read your first post—before officially joining ATF in 1982, Dickinson personnel held only two design patents that I have verified:</p>
      <p>•Norman Italic, Phemister et al. 1881 [USTPO D12235]<br>
      •Aesthetic, Phinney 1882 [USPTO D13328]</p>
      <p>As you so correctly observe, patent notices were often "toothless" warnings like "beware of the dog" when no dog existed. I suspect that the Dickinson, like the Central, TF adopted a legal-fee-beating policy of "Skip the [expensive!] USPTO red tape/attorney fees. Instead, display a 'pending' notice. Our designs are so famous that no one would dare to sell copies of them."<br>
      ____</p>
      <p>BTW Loy did not consult USPTO design patent records. The info you read was researched for Johnston &amp; Saxe by a woman duly acknowledged in their book *illustrating* his Inland Printer series (sorry, I can't find her name at the moment). </p>
      <p>Read his original article on J.F. Cumming [JFC] via the link here:<br>
      <a href="http://typeheritage.com/jfc/jfc-02/" title="http://typeheritage.com/jfc/jfc-02/">http://typeheritage.com/jfc/jfc-02/</a></p>
      <p>This chapter of my featured article on JFC may also interest you:<br>
      http://typeheritage.com/jfc/03-patents/—the nitty-gritty of who REALLY designed faces attributed to him...</p>
      <p>Thanks again for your response, Don—it's truly a treat to find a committed fellow type historian willing to explore beyond the "easy [wrong!] answers" so readily available from the online digital font giants that have acquired trademark ownership of letterpress faces originally designed in c1800–World War I. </p>
      <p>Cheers, Anna</p>
