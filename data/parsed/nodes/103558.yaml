      <p>Designed by John F. Cumming, patented December 1888 and sold by the Dickenson Foundry as Quaint Gothic. Solid and Open versions.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/QuaintOpenMetalType_3768.jpg"></div><br>
      Also sold by  K.K. Hof &amp; K. Brendler Foundry, as Desdemona.<br>
      An open version <a href="http://www.fonts.com/font/font-bureau/desdemona" rel="nofollow">Desdemona</a> designed by David Berlow and published by Font Bureau. A solid version <a href="http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/" rel="nofollow">Quaint Gothic SG</a> published by Spiece Graphics. Solid and outline versions of <a href="http://www.will-harris.com/store-h/desdemona.html" rel="nofollow">Desdemona</a> are published by Beatty Type.<br>
      Don<p></p>
