    <p>I am searching for some information on Chris Ware's book Acme Novelty Library for a dissertation. Those photos came from fake old style newspaper pages.</p>
    <p>I choose serif in the classification, but I am also searching for the sans-serif font, use to highlight some words.<br>
    For the serif I think this is very close to the baskerville font, but some details are different.</p>
    <p>And sorry for the photographies quality, it's an old digital device... :s<br>
    Sorry if my english is too bad.</p>
