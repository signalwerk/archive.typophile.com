    html: <p>You could try <a class="freelinking external" href="http://www.myfonts.com/fonts/fontbureau/benton-sans/bold/" rel="nofollow">Benton Sans Bold</a> for the sans-serif, and for the serif, take a look at <a class="freelinking external" href="http://www.myfonts.com/fonts/mti/monotype-century-schoolbook/" rel="nofollow">Century Schoolbook</a>. The Monotype version (linked) is probably the best match from what I can tell, though other foundries (Adobe, Bitstream, ITC) have renditions also worth checking.</p>
