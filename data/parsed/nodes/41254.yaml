    date_raw: 24 Jan 2008 — 9:06am
    votes: null
    html: |-
      <p>Hi Chris, thanks for the response. It sounds like you think I am indeed pigeon-holing myself. I do enjoy doing work in the kids market - I worked at an animation studio doing children's programming for about a year and a half. But that's not the only type of work I enjoy doing. Maybe next time I do a redesign I will opt for something more neutral. Time will tell if having a site like this scares away a certain type of client.</p>
      <p>I don't know a lot of designers with 3D/animation skills, and I don't know a lot of 3D/animation people with design skills. I guess my goal was to create a site that showed I have that range.</p>
