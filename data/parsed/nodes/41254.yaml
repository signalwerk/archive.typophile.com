    html: <p>Hi Brendan, I took a quick look at your site. First off, what type of work do you enjoy doing, and are there particular fields that you enjoy working with more than others? If you are going for corporate work, then your site will probably not appeal to that group. If you are seeking work in the kids/youth market, then the design makes sense. Many design firms have a very neutral look for their identity. It lets the work speak for itself. Personally I like that approach best because I don't want to pigeonhole myself in a particular market. Hope that helps a bit.</p>
