      <p>99% of sites built with Flash are annoyingly bad.</p>
      <p>Yours falls into that other 1% ;o)</p>
      <p>Nicely done!</p>
      <p>"my site looks more “childish” or “fun” than “professional,” "</p>
      <p>Who did you get that flack from? Boring suit-wearing middle managers at banks? Unless you REALLY want those folks as clients, I wouldn't worry about it. I've worked at both staid 'professional' looking firms and quirky 'this guy is winging it' type places. Both attracted plenty of 'professional' boring clients, but the quirky one also had a nice mix of oddball jobs. </p>
      <p>Only nitpick is that once inside a portfolio, it'd be nice to have navigation for 'next' instead of having to click back each time to get to the next piece. I'd also add a bit of line spacing to your text blocks that describe each piece.</p>
