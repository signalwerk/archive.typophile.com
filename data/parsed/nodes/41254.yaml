    <p>Hi! I've been a reader for some time and have learned a lot from this forum, so first things first: thanks!</p>
    <p>I recently finished a complete overhaul of my portfolio site (I'm a graphic designer and animator), and I wanted to get some opinions.</p>
    <p><a class="freelinking external" href="http://www.brendanmarnell.com" rel="nofollow">http://www.brendanmarnell.com</a></p>
    <p>One of the main questions I've been wrestling with is about the overall style. I've gotten some flak in the past because my site looks more "childish" or "fun" than "professional," and  I risk pigeon-holing myself as a one-trick designer. The flipside is that (imo) the site is unique, quirky, and shows some personality. Have any of you thought about this decision before? Which side did you come down on?</p>
    <p>Brendan</p>
  html_clean: |-
