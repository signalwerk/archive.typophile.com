    <p>hello</p>
    <p>a friend of mine is looking for the following:<br>
    a gentle but not weak - with a certain strength to it - serif typeface without too much stroke-contrast. ligatures are very important (as many as possible), swashes would be good, too. it will get used for display, not for text.</p>
    <p>any ideas?<br>
    thanks!</p>
