      <p>&gt; <em>Why not identify yourself?</em></p>
      <p>Nah, there's no real need for that. I'd rather have a spokesperson for a certain foundry anonymously posting helpful information under the foundry's name than some Billy Sastard annoying the hell out of everyone.</p>
      <p>Hear hear, I think it's safe for me to proclaim that shameless self-promotion is tolerated and even encouraged on Typophile <em>whenever it's appropriate</em>.  In this case everyone was indeed pointing out typefaces of their own with lots of ligatures, which was the actual request by the original poster. Well done.</p>
      <p>BTW I think both Musee and Odille kick some major booty. Especially Odille has had me all giddy with excitement waiting for its release. Fabulous job -- eat this all ye black-clad, goatee-stroking DIN and Helvetica adepts. :^D</p>
      <p>And I still like Mrs Eaves. A lot. It's deliciously awkward and very hard to use well, but when you succeed -- oh boy does it pay off. ;^)</p>
