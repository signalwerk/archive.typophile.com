    <p>Letrizmo Digitipia releases Toisy. In the last days of the seventies, when contempt was the only feeling for everything that smelled disco, there was a strange sense of pride. Toisy, Toisy Alt and Toisy Greek capture the very essence of the glamorous life circa 1981. </p>
    <p>Check it out! and set it real tight... </p>
    <p>One of the three debut fonts from Letrizmo, the new mexican foundry of Victor Yb Delgado</p>
