      <p>Thank you, and I'm assuming switching out both the regular and italic rather than just the italic, is best?</p>
      <p>You know, what the Baskerville to me says, in conjunction with the subject matter, is really a point of interest. The book has recently been republished (in English) by another press in an updated edition, and totally redesigned. I'm more fond of the original Baskerville, somehow. The text itself is a weighty contribution to architectural theory in the area of phenomenology, condensed into a book containing less than 100 pages. A degree of humility is expressed in its brevity, in what is otherwise a heavy philosophical treatise. The Baskerville is elegant and light, and again, this relieves some of the weight, for me. Perhaps Walbaum does the same? It's difficult to register as a non-native German speaker, but this question of  a kind of equivalency in interpretation of styles across cultures, is very interesting.</p>
