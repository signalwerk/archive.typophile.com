    <p>Currently finishing the layout of a work on architectural theory and aesthetics, originally published in English, though now it's the German edition I'm involved with. We've replicated the design in most aspects, however the Baskerville italic used extensively throughout for titles, references,  introductory quotes... it just looks very tight and condensed by default (or perhaps even more so in the German, contrasting with lengthier words).</p>
    <p>Is it a kind of type crime to stretch the font ? I recall hearing it's preferable to use another font altogether if the italics look wrong.</p>
