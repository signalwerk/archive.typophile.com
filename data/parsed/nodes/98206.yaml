    html: |-
      <p>I don't recommend mixing Baskerville roman and Walbaum italic: although they belong to close periods of style, and are both associated with forms of neo-classicism, Baskerville marks the typographical beginning of this style, while Walbaum belongs to the transition to Romanticism. The context here is that English and French typography had distinctively neo-classical typography (Baskerville and Fournier) and then distinctively Romantic typography (mostly using imported types in Britain); while Germany went fairly directly to the Romantic style but not with such extreme forms as the French and Italian. Hence Walbaum, which is classed as Romantic, but which is generally considered easier to work with than Didot or Bodoni.</p>
      <p>All that said, and following Nick's suggestion to use a new typeface by a living designer, I would recommend taking a look at <a href="http://www.typejockeys.com/fonts/Ingeborg">Ingeborg</a>, which is in the Walbaum tradition but even better suited to running text. I think it is one of the best products of the type design MA programme at Reading.</p>
      <p>Romantic types lend themselves to fairly short texts of the kind you describe, that benefit from slow and thoughtful reading. This is why they are often used for poetry and essays.</p>
