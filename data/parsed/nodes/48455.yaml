    <p>Apologies if this is not the site to ask these questions, but I have a user moving working font files from one PC to another - both running XP SP3. She has even tried installing from clean copies with the same results, per below:</p>
    <p>- Open Type Fonts generate a ’file is missing or damaged’ message<br>
    - OTF fonts show up in /fonts/ folder, but are designated as TTF - trying to open these files also generates ’file is missing or damaged’ message<br>
    - The icon associations are all over the map:  .ttf files that call themselves ’True Type’ have a true type icon, .otf files that call themselves Open Type (and don’t work) have an open type icon; and .ttf files that say True Type but say they are an ’Open Type Font with True Type Outlines’ when I open them also have an open type icon.  This may be normal, I don’t know. </p>
    <p>It is unclear to us whether this is a Problem with the font files or with Windows. Any advice/referrals much appreciated.</p>
