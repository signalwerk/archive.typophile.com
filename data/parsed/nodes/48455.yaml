    html: |-
      <p>Try to open and view the OTF files with a program that does not use any of the Windows APIs. If that fails, it’s the files themselves that have been damaged in the transfer.</p>
      <p>If not, your Windows installation might need a refresh ...</p>
      <p>The icon oddities come from the fact that Windows looks at the file extension — otf is OpenType, ttf is TrueType. <em>Then</em> it checks whether the file is digitally signed — “yes” shows an OTF icon, “nope” shows a TTF icon. Go figure.</p>
