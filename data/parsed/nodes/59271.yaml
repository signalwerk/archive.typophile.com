    html: |-
      <p>So this is a film programme from the Walker Art Center? Do you know who has designed it?</p>
      <p>There is a digital version of Stahl by <a href="http://www.romana-hamburg.de/antiqua.htm">Gerhard Helzel (Hamburg)</a>, with 3 weights; ‘Stahl mager 12P.’, ‘Stahl 12P. mager’ and ‘fett’. Don’t ask me how to order from this website. ‘Mit Unterschneidung’ indicates that the fonts have been kerned.</p>
      <p>The ‘Preußisches Bleisatzmagazin’ has a sample of the <a href="http://www.bleisetzer.de/cms/front_content.php?idcat=57&amp;idart=909">original metal Stahl</a>.<br>
      F</p>
