    <p>Hi all,</p>
    <p>Does anyone know of any typefaces which are similar to Gill Sans Extra Condensed Bold font but even more bolder?<br>
    So I would like it to keep the condensed feature(tall) and also the short tails and tops(e.g. d,b,h,g,y,etc) and also the line stroke to be as even as possible but I would like it to be more bolder.</p>
    <p>Thanks.</p>
