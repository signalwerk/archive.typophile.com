      <p>To me it looks more like "121".</p>
      <p>Personally I'm not a big fan of ambigrams as logos, as you often end up with a design that's hard to read or odd-looking, all for the sake of a visual trick which most users won't notice or care about.</p>
      <p>I'm not saying it's never a good idea. If you think it's appropriate in your situation, go for it; maybe you can make it work. But remember that your main goal should be to clearly symbolize the company via the logo in a way that's clear to users.</p>
