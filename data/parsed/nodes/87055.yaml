      <p>Don't dismiss the <a href="http://www.example.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">recycling symbol</a> as inspiration so early on in the project.<br>
      It's long standing within many industries will go far when identifying the sustainable and socially responsible nature of the business to it's potential clients.<br>
      I worked on a similar project for an eco events company a few years ago and found that the inclusion of the symbol massively reinforced the company's point of view.<br>
      I'm not saying it should be the focus of the mark but a gentle nod in its direction will help the project along.</p>
      <p>I like the idea of your current mark but it lacks that crucial cyclical quality. To me it simply states an A to B scenario (start and finish) rather than a reccuring process.<br>
      Try adding a third dimension to the piece and sitting it on a prism/triangle to make the visual link between the end of the last 'U' and the beginning of the first 'R'.</p>
