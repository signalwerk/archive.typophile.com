    <p>hello<br>
    i'm working on creating a mark/logo type for an environmentally conscience t-shirt company in the Northwest. Their focus is simple - create/design environmentally sound (recyclable) tshirts that deliver a 'green, recyclable' message via screen prints of graphics/messaging/color/textures. my proposed mark will hopefully convey the idea of never ending, continuous and recycle. </p>
    <p>after doing research i found that the recycle three triangle arrows have been done to death and not where i want to go. my solution is a 'regenerating' ambigram of an R. the company name is ReUse. please check out the mark and let me know what you think. i have one big concern on it's representation and hopefully it's something i'm over thinking. your critique is greatly appreciated. ps. can an ambigram be just on letter?</p><div class="imageWrap"><img src="http://typophile.com/files/ReUse_4929.jpg"></div><p></p>
  html_clean: |-
