    html: <p>The digbat is really really sweet. I would be very tempted by the font if it came with some more cool dingbats.  I love your numbers! I hope you realease this one!  <br> <br>Now my crit!  <br> <br>I like the top b best - what if the m was rounded like an arch with a support collumn? Maybe the feet could curl in a tiny bit like the bottom of the 'e'. What about pulling the bottom right leg of the k further to the right &amp; giving it more kerned space? I think the 'i' &amp; 'l' need a little more space too. <br> <br>Looking at the original PDF I wonder about swithching the M &amp; m shapes. The cap uses the form I just imagined. The 4 seeps too wide. The cap Y could use some extra width - it looks cramped.</p>
