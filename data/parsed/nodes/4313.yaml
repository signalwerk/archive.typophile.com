    date_raw: 17 Apr 2004 — 2:25am
    votes: null
    html: "<p>I'm having the same \"b\", cyrillic \"&amp;#1074;\" problem with a face that i work with <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">. About this saga: <br> <br>The first is very teoretical, but doesen't work well, looks very big compared to \"a\".  <br>The second is something close to the natural way of writing the character by hand, not so high as \"o\", and not so low as \"a\".  <br>The third is the other extreme, you should try to see how it looks hext to \"o\", \"b\", \"s\", \"e\"... see Neuropol made by Ray Larabie <a href=\"http://larabiefonts.com/\" target=\"_blank\">http://larabiefonts.com/</a> <br> <br>If you decide to go with the last \"m\", balance the position of the middle stem. <br> <br>Gorjan</p>"
    html_clean: "<p>I'm having the same \"b\", cyrillic \"&amp;#1074;\" problem with a face that i work with <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\">. About this saga: <br> <br>The first is very teoretical, but doesen't work well, looks very big compared to \"a\".  <br>The second is something close to the natural way of writing the character by hand, not so high as \"o\", and not so low as \"a\".  <br>The third is the other extreme, you should try to see how it looks hext to \"o\", \"b\", \"s\", \"e\"... see Neuropol made by Ray Larabie <a href=\"http://larabiefonts.com/\" target=\"_blank\" class=\"link-external\">http://larabiefonts.com/</a> <br> <br>If you decide to go with the last \"m\", balance the position of the middle stem. <br> <br>Gorjan</p>"
