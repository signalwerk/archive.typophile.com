    html: <p>Nice work, Ken! <br> <br>I like the <b>b</b> in the first line better than the other two variants. It is a flipped <b>d</b> (right?), which makes it work better with the rest of the lowercase (except, as Gorjan points out, with <b>a</b>... have you tried any single-story variations of <b>a</b>? <br> <br>As for the alternate <b>m</b>, I'm not sure it would work next to all of the lowercase characters, only a few of them. Place an <b>o</b> or a <b>u</b> right after it and you'll see what I mean. <br> <br>Keep it up! <br></p>
    html_clean: <p>Nice work, Ken! <br> <br>I like the <b>b</b> in the first line better than the other two variants. It is a flipped <b>d</b> (right?), which makes it work better with the rest of the lowercase (except, as Gorjan points out, with <b>a</b>... have you tried any single-story variations of <b>a</b>? <br> <br>As for the alternate <b>m</b>, I'm not sure it would work next to all of the lowercase characters, only a few of them. Place an <b>o</b> or a <b>u</b> right after it and you'll see what I mean. <br> <br>Keep it up! <br></p>
