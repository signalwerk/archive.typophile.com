    html: <p>Thanks Thomas.   <br> <br>Well-argued, but at the same time it's the answer I'd hoped I wouldn't get.   Sooo... <br> <br>How does one go about this?  Design the font (glyph by glyph, assigning each one its Unicode) and then what? <br> <br>Any suggestions (online or in print) for understanding keyboard drivers, etc.?  I'd say the Unicode site is packed with information (and it is of course), but it's difficult to understand all of it at once.</p>
