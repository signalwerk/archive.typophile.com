  html: <p>I know so little about Unicode it's embarrassing, but how horrible of a person would I be if I decided to break Unicode classifications and assign a non-alphabetic symbol set (one that IS classified in Unicode) to the alphabetic keys in the MS Windows Symbol codepage?  I just want the user to be able to type "A", or "j" or whatever, and know that they can get the symbol just by changing the font selection. <br> <br>Unicode formatting just seems impractical in this case (to be honest, I disagree with the act of assigning codepoints to certain non-alphabetic sets, especially this one [I Ching Hexagram symbols]).   <br> <br>Is this an acceptable practice at all?</p>
