    html: "<p>If you're going the \"Unicode purity\" route, design the font, assign glyphs their correct Unicode, and generate it as TrueType or OpenType. <br> <br>Luckily, making keyboard drivers for Mac (OS X) and Windows has gotten really dramatically easier in the last couple of years. Both OSes allow you to put something together relatively painlessly with text-based XML sources, and compile keyboards from those. <br> <br>For OS X, see: <br>&lt;<a href=\"http://developer.apple.com/technotes/tn2002/tn2056.html\" target=\"_blank\">http://developer.apple.com/technotes/tn2002/tn2056.html</a>&gt; <br> <br>Also: <br>&lt;<a href=\"http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=ukelele\" target=\"_blank\">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;item_id=ukelele</a>&gt; <br> <br>For Windows 2000 and XP, try this: <br>&lt;<a href=\"http://www.microsoft.com/globaldev/tools/msklc.mspx\" target=\"_blank\">http://www.microsoft.com/globaldev/tools/msklc.mspx</a>&gt; <br> <br>The keyboard stuff can be a lot of fun, really.  <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
