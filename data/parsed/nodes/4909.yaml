    html: <p>I guess the question that needs to go with "Is this an acceptable practice at all" is "to whom?" <br> <br>On the one hand, these symbols have legitimate codepoints, so we should use them. The problem is one of keyboard input. If you think people are doing to use the font enough that they won't have to look up the character mapping every time, then it's probably worth making a custom keyboard driver, which is a relatively painless activity on both Mac and Windows these days. <br> <br>Using the proper Unicodes means that your font will be interchangeable with any other Unicode I Ching font that somebody makes, won't trip up spellcheckers, etc. <br> <br>Personally, I suspect that most people won't use most pi fonts enough to memorize key mappings. In which case, you're not doing them any long-term disservice by using the real Unicodes and letting them use regular access doohickies to get at them (Windows CharMap, Mac Character Palette, Adobe Glyph Palette). <br> <br>The main problem will be that the font won't work at all in non-Unicode applications, and there are still some of those that matter (like QuarkXPress). That's the best argument for making a font with a bogus encoding, and depending on who's going to use the font, it can be a very strong one. <br> <br>Using the Symbol codepage and marking the font appopriately will at least alert Windows-based consumers that it's not "really" an alphabetic font (not sure that it will have that affect on the Mac side, yet; also not sure the codepoints will work the same way on the Mac). I do know that Adobe's conclusion about the Symbol codepage after much thought and investigation was that we should only use it for the font named "Symbol" and nothing else. <br> <br>Adobe's solution, for what it's worth, has been to license both the newer Unicode/OpenType version of a font and the old Type 1 version at the same time. If the user needs direct keyboard access or non-Unicode app usage, they use the Type 1. If not, they are free to use the new stuff. <br> <br>Regards, <br> <br>T</p>
