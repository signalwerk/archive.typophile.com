    html: |-
      <p>Yawn.</p>
      <p>I don't even think of logos using Helvetica as logos. I just see a word set in Helvetica. I find it hard to believe so many large corporations pay a fortune to design companies for them to produce a word set in Helvetica. Is that really the best they can produce? </p>
      <p>Yeah, I really couldn't be bothered thinking of anything or expending any effort whatsoever so I did this. </p>
      <p>Get somebody from marketing to do the usual client bamboozle.</p>
      <p>Not that I'm cynical about this business or anything.</p>
