    <p>Hi,</p>
    <p>it’s my first post here and I’m sure that every body here will help me.</p>
    <p>Here’s the problem:</p>
    <p>I’ve created a symbol font for a contract (it’s a programmation). The purpose of it his to ad scribbles in the text in an efficient way. But, even after thousands of tries, FontLab refuse obstinately to generate a type 1 font with bitmap preview, wich is exactly what I need to use in Quark (There’s still people in the studio who do not know InDesign). The only way I can get out of that is by putting a bitmap size of 36, wich is not helpful.</p>
    <p>I join some screenshots to let you see the details and the result.</p>
    <p>The document will be printed next week, so I began to freak out a bit.</p>
    <p>If any one can help me, it will be very appreciated…</p>
