    <p>ELK GROVE VILLAGE, IL – November 12, 2007 – Ascender Corporation, a leading provider of advanced font products and innovative applications for mobile devices, today announced that it designed and engineered a new set of system User Interface (UI) fonts named "Droid" for the Android platform built by the Open Handset Alliance. The Android platform is a complete mobile phone software stack that will be made available under the Apache open source license. The fonts provided by Ascender ensure that users of handsets developed from the Android platform will enjoy highly legible text resulting in easy to use interfaces.</p>
    <p>   </p><div class="imageWrap"><img src="http://typophile.com/files/droid-image_5417.jpg"></div><p></p>
    <p>Ascender worked closely with the Android team to develop the system fonts for the Android platform. The new Droid font collection provides an extensive set of styles and language support. Droid was designed by Ascender's Steve Matteson to provide optimal quality and comfort on a mobile handset when rendered in application menus, web browsers and for other screen text.</p>
    <p>The Droid family of fonts consists of Droid Sans, Droid Sans Mono and Droid Serif. Each contains extensive character set coverage including Western Europe, Eastern/Central Europe, Baltic, Cyrillic, Greek and Turkish support. The Droid Sans regular font also includes support for Simplified and Traditional Chinese, Japanese and Korean support for the GB2312, Big 5, JIS 0208 and KSC 5601 character sets respectively.</p>
    <p>"Ascender is proud to be providing the font solution to the Android platform built by the Open Handset Alliance. We believe that handset manufacturers, wireless carriers and application developers will be very happy with the fonts provided and we look forward to addressing the future font needs across the platform," said Ira Mirochnick, President of Ascender Corporation. "We are also very excited that the platform supports our Ascender Compact Asian Font solution (ACAF) which will make it easy for manufacturers to implement additional high quality Asian fonts in a small footprint."</p>
    <p>Ascender can offer manufacturers, carriers and developers a variety of type design, font software engineering and font technology solutions. Ascender can modify and customize the Droid fonts, add additional language support, or create custom fonts and provide additional typefaces to complement the Android platform fonts.</p>
    <p>Handset manufacturers and carriers requiring CJK fonts with a reduced memory footprint have the option of licensing the Ascender Compact Asian Fonts (ACAF) solution which has been enabled on the Android platform. ACAF is a proprietary, scalable font system which significantly reduces the file size of Asian fonts while still providing excellent screen legibility and performance.</p>
    <p>More information on Ascender's font and content solutions for handset manufacturers, carriers and developers can be found here: <a href="http://www.ascendercorp.com/oha.html" title="http://www.ascendercorp.com/oha.html">http://www.ascendercorp.com/oha.html</a></p>
    <p>More information on the Open Handset Alliance can be found here: <a href="http://www.openhandsetalliance.com" title="http://www.openhandsetalliance.com">http://www.openhandsetalliance.com</a></p>
    <p><strong>About Ascender:</strong><br>
    Ascender Corporation is a leading provider of advanced font products and innovative applications for mobile devices. Ascender's founders are font industry experts and have been involved in developing many of the most important and influential fonts used in computers and mobile devices. Ascender provides multilingual, custom font development and mobile phone applications for a wide range of customers including creative professionals, enterprises and hardware &amp; software developers. Ascender also provides fonts for download to graphic designers through the <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a> website and to consumers through the <a href="http://www.FontMarketplace.com" title="www.FontMarketplace.com">www.FontMarketplace.com</a> website.</p>
    <p><strong>Contact:</strong><br>
    Bill Davis<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 225, Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730<br>
    Fax: (847) 357 0731<br>
    <a href="http://www.ascendercorp.com" title="http://www.ascendercorp.com">http://www.ascendercorp.com</a></p>
