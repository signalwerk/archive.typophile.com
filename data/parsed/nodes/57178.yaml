  html: |-
    <p>I have a client that wants to use Leslie Cabarga's Magneto Bold for a logo.  </p>
    <p>Am unsure if I'm supposed to kern the letters so there's no gaps in any of the text or if I'm supposed to leave some of them in.  Any suggestions?</p>
