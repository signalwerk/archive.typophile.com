  html: <p>I am laying out a book at the moment, and I need to make a diagram simply showing fraktur (Black Letter) type. I do know some history behind black letter, but I was wondering which would be the best to show the overall characteristics? I am thinking something like Goudy Text. Possibly Fette?</p>
