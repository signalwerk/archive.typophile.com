      <p>So is <a href="http://www.linotype.com/1608/wilhelmklingsporgotisch-family.html" rel="nofollow" class="link-external">Wilhelm-Klingspor-Gotisch</a>, a Textura by <a href="/wiki/Rudolf%20Koch" class="freelinking link-lost" rel="nofollow">Rudolf Koch</a>. That one would be my suggestion: It is one the most beautiful Blackletter typefaces. And, IMHO, it is more representative in some details. Compare the letters ‘d’, ‘h’, ‘z’, ‘A’ etc. You’ll see that Goudy Text is more normalised, less ‘quintessentially Blackletter’.<br>
