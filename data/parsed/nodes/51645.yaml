      <p>Hi Courtney,</p>
      <p>strictly speaking, not every <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> is a <a href="/wiki/Fraktur" class="freelinking" rel="nofollow">Fraktur</a>. According to the DIN <a href="/wiki/Typeface%20Classification%20Schemes" class="freelinking" rel="nofollow">Scheme</a>, those typefaces could be classified into <a href="http://de.wikipedia.org/wiki/DIN_16518#Gruppe_X:_Gebrochene_Schriften" rel="nofollow">five subcategories</a>.</p>
      <p>Goudy Text is, as its name suggests, a <a href="/wiki/Textura" class="freelinking" rel="nofollow">Textura</a>, which is the oldest branch of Blackletter. Then again, this very typeface was designed as recently as in the 1920s.</p>
      <p>So is <a href="http://www.linotype.com/1608/wilhelmklingsporgotisch-family.html" rel="nofollow">Wilhelm-Klingspor-Gotisch</a>, a Textura by <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>. That one would be my suggestion: It is one the most beautiful Blackletter typefaces. And, IMHO, it is more representative in some details. Compare the letters ‘d’, ‘h’, ‘z’, ‘A’ etc. You’ll see that Goudy Text is more normalised, less ‘quintessentially Blackletter’.<br>
      F</p>
