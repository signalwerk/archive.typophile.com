      <p>As they're using <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=24&amp;displayfontid=C.117387.0.0&amp;fontRendererText=Welcome+to+Etisalat" rel="nofollow">Neo Tech Alternate</a> as their corporate typeface and not the logo font, I suspect it probably is custom designed.</p>
      <p><a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;startrow=1&amp;records=20&amp;currpage=1&amp;totalrecords=18&amp;searchby=&amp;searchID=&amp;searchletter=&amp;searchstr=benguiat+gothic&amp;font_categories_checkbox=font_name_search&amp;fontRendererText=etisalat" rel="nofollow">ITC Benguiat Gothic</a> is a very sound advice for an alternative.</p>
