    <p>I am trying to ID the font being used in this logo, <a href="http://img157.imageshack.us/img157/2425/font7ll.jpg" title="http://img157.imageshack.us/img157/2425/font7ll.jpg">http://img157.imageshack.us/img157/2425/font7ll.jpg</a></p>
    <p>It belongs to a telecom operator in the UAE [ <a href="http://www.etisalat.ae" title="www.etisalat.ae">www.etisalat.ae</a> ] </p>
    <p>Its not one of the standard MS Office fonts so am a bit lost. Any suggestions would be appreciated. Thank you in advance.</p>
    <p>PS-after reading all,(most of), the posts in the "Type ID Board" am sure that if any one can help, you guys can.</p>
