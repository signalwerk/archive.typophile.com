  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12443" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Type and Lettering Styles</a>&nbsp;:&nbsp;Garalde</strong></p>
    <p>Late <a href="/node/add/wiki?edit%5Btitle%5D=Old%20Style" title="Create node &quot;Old Style&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Old Style</a> type style of the baroque period. Like the <a href="/node/29233" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Venetian</a> types, this style is based on <a href="/node/13722" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">calligraphic</a> principles, including modulated <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">stroke</a>, oblique axis, <a href="/node/add/wiki?edit%5Btitle%5D=adnate" title="Create node &quot;adnate&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">adnate</a> serifs and modeled terminals, and moderate <a href="/node/13969" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Aperture</a>. The Garalde <a href="/node/12463" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">italics</a> are closely associated with their corresponding <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a> fonts and are designed to be used together with them in a subordinate&nbsp;role.</p>
    <p>See also <a href="/node/add/wiki?edit%5Btitle%5D=Garalde%20Typefaces" title="Create node &quot;Garalde Typefaces&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Garalde Typefaces</a>.</p>
  html_clean: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/12443/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Type and Lettering Styles</a>&nbsp;:&nbsp;Garalde</strong></p>
    <p>Late <a href="/node/add/wiki?edit%5Btitle%5D=Old%20Style" title="Create node &quot;Old Style&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Old Style</a> type style of the baroque period. Like the <a href="/node/29233/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Venetian</a> types, this style is based on <a href="/node/13722/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">calligraphic</a> principles, including modulated <a href="/node/add/wiki?edit%5Btitle%5D=stroke" title="Create node &quot;stroke&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">stroke</a>, oblique axis, <a href="/node/add/wiki?edit%5Btitle%5D=adnate" title="Create node &quot;adnate&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">adnate</a> serifs and modeled terminals, and moderate <a href="/node/13969/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Aperture</a>. The Garalde <a href="/node/12463/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">italics</a> are closely associated with their corresponding <a href="/node/14507/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Roman</a> fonts and are designed to be used together with them in a subordinate&nbsp;role.</p>
    <p>See also <a href="/node/add/wiki?edit%5Btitle%5D=Garalde%20Typefaces" title="Create node &quot;Garalde Typefaces&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Garalde Typefaces</a>.</p>
