  html: |-
    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20and%20Lettering%20Styles" class="freelinking" rel="nofollow">Type and Lettering Styles</a> : Garalde</strong></p>
    <p>Late <a href="/wiki/Old%20Style" class="freelinking" rel="nofollow">Old Style</a> type style of the baroque period. Like the <a href="/wiki/Venetian" class="freelinking" rel="nofollow">Venetian</a> types, this style is based on <a href="/wiki/calligraphy" class="freelinking" rel="nofollow">calligraphic</a> principles, including modulated <a href="/wiki/stroke" class="freelinking" rel="nofollow">stroke</a>, oblique axis, <a href="/wiki/adnate" class="freelinking" rel="nofollow">adnate</a> serifs and modeled terminals, and moderate <a href="/wiki/aperture" class="freelinking" rel="nofollow">aperture</a>. The Garalde <a href="/wiki/italic" class="freelinking" rel="nofollow">italics</a> are closely associated with their corresponding <a href="/wiki/roman" class="freelinking" rel="nofollow">roman</a> fonts and are designed to be used together with them in a subordinate role.</p>
    <p>See also <a href="/wiki/Garalde%20Typefaces" class="freelinking" rel="nofollow">Garalde Typefaces</a>.</p>
