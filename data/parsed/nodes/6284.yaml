  html: <p>The typeface is called Tuscan Ornate  in the Mac McGrew book (p. 344) Other names are Bracelet (in Solotype Catalog), Romantiques no. 5 and Ornate No. 5. <br> <br>Font Mesa has digitized this as 'Main Strike'.</p>
