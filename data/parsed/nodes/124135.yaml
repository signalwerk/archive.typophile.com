    html: |-
      <p>People usually export as EPUB, do some manual cleanup to align it with <a href="http://kindlegen.s3.amazonaws.com/AmazonKindlePublishingGuidelines.pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Amazon Kindle Publishing Guidelines</a> and then upload it to Amazon which will automatically convert it to Kindle format. Having some knowledge of HTML and CSS goes a long way. Here is some <a href="http://epubsecrets.com/indesign-best-practices-epub-exports.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">general</a> <a href="http://epubsecrets.com/indesign-epub-basics-general-settings.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">info</a> on the InDesign side of things, but you should also find an exporting tutorial.</p>
      <p>You'll have to come to peace with the fact that Kindle supports only the most basic formatting (even less than EPUB, which itself is a far cry from print typography) and a few built-in fonts. So your only option is to simplify the layout as much as possible.</p>
      <p>Keep chapters as separate files and they will start on new pages. You won't have page numbers because the text is reflowable; styling chapter headings is fine, though.</p>
      <p>Fixed page layouts are almost always a bad idea, especially for simple, text-based books.</p>
