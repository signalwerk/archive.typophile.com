    <p>Dear Typophiles, </p>
    <p>I am a freelance design and lifestyle writer (charlotterivers.blogspot.com)... I am currently a new book about calligraphy and am looking for submissions from around the world.... Please get in touch if you work in this area and would like to submit your work, or please forward this post on to any friends / colleagues / contacts who you think might... </p>
    <p>For more information or to submit work please contact me direct on <a href="mailto:charlotte.rivers@mac.com">charlotte.rivers@mac.com</a></p>
    <p>Many thanks!</p>
