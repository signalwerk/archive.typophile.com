  html: <p>Didn't know where to post this. I hope it's not too blatantly self promoting. <br> <br>I finally found some time to update the MADType website. If you like, check it out at <a href="http://www.madtype.net" target="_blank">http://www.madtype.net</a> and let me know if you find any bugs or errors. I got rid of the flash showings and added more information about the fonts. <br> <br>Any criticisms or comments will be welcomed with open arms. <br> <br>Matt</p>
