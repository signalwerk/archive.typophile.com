      <p>Proportional oldstyle.</p>
      <p>"But when Microsoft are ships fonts with an operating system, that tends to have a pretty big impact on users’ expectations."<br>
      (J. Hudson)</p>
      <p>This may be this single case where I appreciate the educational effect of Windows defaults! And wouldn't be surprised if, in ten years, every secretary would startle, shudder, and shake her head about such an ignorant or "antique" use of -- tabular lining numerals in text ...</p>
      <p>I simply regard oldstyle numerals as "lowercase", and lining numerals as "uppercase." And all caps setting is kind of an exception itself, addressed by a feature like "case" which also switches to lining numerals.</p>
      <p>Btw tabular numerals -- I can well imagine that an intelligent future Word would select tabular (oldstyle or lining) variants automatically if they precede or follow a tabulator, or that an Excel would, without further notice, use the tabular variants of either oldstyle or lining numerals.<br>
      And as regards oldstyle vs lining numerals in tables, Mr Noordzij's Letterletter nicely shows that oldstyle tabular numerals are quite readable. (Sorry for using this word.)</p>
