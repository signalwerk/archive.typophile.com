      <p>I have published OT fonts with Tabular Lining as the default, which was also "correct" for the design, and those numerals look pretty good in running text. My next release will have Proportional Scotch-style - see "Georgia" - numerals, which are between x- and cap-height, and have half-descenders and full-ascenders. Again, these numerals look right in context. (The typeface in question does contain Proportional and Tabular Oldstyle, Lining, and x-height numerals too, along with numerators, denominators, and scientific inferiors. 10 number sets in total, but I really only had to design half of them, and can re-use the other half.)</p>
      <p>I think that historical precedent can dictate the default as well: Garaldes should have Proportional Oldstyle, and modernist sanses should have Tabular Lining. These just look right, half of which is probably due to their looking "unsurprising".</p>
