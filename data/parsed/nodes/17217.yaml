    <p>Generally, in the bad old days, the only figures were lining tabular. You needed an expert set for anything else. In today's OpenType world you have choices!<br>
    It seems to me that default figures should be the ones most people should use most of the time. Let's assume you have included in your soon-to-be-released Opentype face, Oldstyle, Proportional Lining, and Tabular lining figures. What would be your druthers for default and , most importantly, WHY?<br>
    Let's see a vote here, OK?</p>
    <p>Sorry I can't do the cool form that tallies everything on the fly.  Maybe if I were some cool COWBOY or Bezier Wrangler, I could do it but I am not so I just have to hope unnamed guys like that will take pity and set one of those puppies up here on Typophile instead of my lame straw poll :-) Hint?</p>
    <p>ChrisL</p>
