      <p>In design work, OsF is probably the best "default," but when you are producing and distributing an OpenType font, you absolutely should have the default set to tabular lining figures. A font is a tool for people to use, as many people as possible. Customers* are used to standards. And although I think that OsF would make the best standard, it isn't the standard customers have been living with for 20 years. </p>
      <p>All other type of numbers are features. These days, features are easy enough to come by, at least for designers. Even Quark's getting on board now, since they've just released their public beta of XPress 7.0.</p>
      <p>*This may be controversial, and I don't have any evidence to back it up, but I think that graphic designers are not the majority of font buyers. They certainly aren't the majority of font users! Fonts are for everyone, designers and non-designers alike. We can agree on that, can't we?</p>
