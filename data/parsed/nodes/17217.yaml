      <p>Another thought:</p>
      <p>Does it really matter which numerals are set as standard *in fonts*?<br>
      Adobe applications have default style as an option. Today I saw in OS 10.4 TextEdit that there is a default each for the oldstyle/lining and proportional/tabular too. But if I recall an earlier presentation of XPress 7 correctly, there was no default. And yet it is the question what Word/Vista will offer as options.<br>
      In the end it might turn out that defaults set in *applications* -- and not fonts' defaults -- will define which numeral style (by preselection) will be chosen by most users.</p>
      <p>&gt;&gt; default figures should be the ones<br>
      &gt;&gt; most people should use most of the time.<br>
      &gt;<br>
      &gt; I object to that “should” (which is not to say<br>
      &gt; that I think users don’t need education).</p>
      <p>Some decision *will* be made on some level. And whatever decision it is, it may not please everybody. Poor Microsoft ...</p>
      <p>Karsten</p>
