      <p>The default should be tabular lining.</p>
      <p>Tabular, because proportional figures really screw up a tab setting, while tabular are OK (though not ideal) in a text setting -- and both situations are likely to occur for users who are not aware of the options.</p>
      <p>Lining, for the same reason: old style figures are just too quaint for most tabular settings, especially when leading is tight. </p>
      <p>Tabular settings are not confined to financial or mathematical pages, but occur in many commercial uses, such as price lists and phone numbers in business stationery and contact information.</p>
      <p>***</p>
      <p>Although I agree with chester over what looks "right", and recognize that sophisticated typographers (at a design studio, say) may prefer OSF in a pre-1800 type genre, the problem is that the typographer is often not the end user, as when a type is specified for a corporate identity and third parties such as sales promotion companies, or the client's in-house art department, assume that responsibility. They are less likely to be typographically astute enough to change proportional to lining when required, and may well be using software that doesn't even give them the option.</p>
