      <p>When we came to make this decision for the Microsoft ClearType fonts, we decided to make proportional oldstyle figures the default since the fonts are intended to make on screen <em>reading</em> easier and we figured that what people would be reading most is continuous text. Later we revised this for a couple of the families, because Office wanted to give them a prominent place, meaning that they would be more likely to be used in business documents and places where people would expect tabular figures.</p>
      <p>For a while, I was arguing in favour of tabular oldstyle figures as the default in all the fonts, but the MS ART people decided that we should go whole hog and make them proportional.</p>
      <p>Dan, I hear what you are saying about user expectations and de facto standards based on longstanding convention. But when Microsoft are ships fonts with an operating system, that tends to have a pretty big impact on users' expectations.</p>
    html_clean: |-
