      <p>Sean, that is the exact cause of your issue. If the font designer added correctly drawn superscript digits, it's only a matter of adding the right <em>feature</em> code to the font to add this feature to OpenType-sensitive software.</p>
      <p>Professional software such as DTL FontMaster even allows "templates" of standard font features to be applied to entire fonts, no further action needed (as I understand it from <a href="http://www.typophile.com/node/107315" rel="nofollow">Frank Blokland's regular updates</a>).</p>
      <p>It's possible you have an older version of your font so you might want to inquire at URW (or your regular font supplier). And if they tell you, "no we don't do that" -- point them towards this discussion!</p>
