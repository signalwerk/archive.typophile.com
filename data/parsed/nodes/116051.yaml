      <p>Theunis, yes, you're right. There is more than one way to do footnotes in InDesign, of course...</p>
      <p>For the workflow in our shop, the ID function "Superiors/Superscripts" is rigged, in the font (when allowed), to use an <strong>alternate</strong> number/letter sequence, as defined in the features. As alternate glyphs, there are no Unicode assignments made, and names are something like "one.super" and "a.super." If the file winds up in a PostSctript environment, the period and everything thereafter drops out, so the base characters are left. On the other hand, when we need a superior or inferior number for mathematical or chemical nomenclature, they will be the superiors/inferiors that have a Unicode assignment, and must be entered from the keyboard.</p>
      <p>Not perfect, but at least one more or less viable compromise.</p>
      <p>Then you hit the "what to do" wall again when preparing ePUB files, allowing for superior presentation when the fonts are embedded, but still working acceptably when the reader makes a font change. And bear in mind that in practice these days, both ePUB and XML are often prepared from a pdf. Labor is cheap in India, and inexpensive handwork is usually more cost effective than creating and implementing a programmatic solution...</p>
