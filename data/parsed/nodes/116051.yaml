      <p>Of course they work. If you pull them into the file, via the glyph pallet being one way, ink will eventually flow and all will see. What you mean is their placement is not automated via the routine you usually use.</p>
      <p>I suspect the superscripts you're using are not a stylistic variation of one, two, three, but true superiors, which have a different Unicode number. When you write 6.2 x 10^4, you don't want that changing to 6.2 x 104.</p>
      <p>Which means you could enter them directly via the keyboard. And also means they <cite>may</cite> disappear (into .notdef characters) should someone get a hold of your file and change the font, say for reading the text.</p>
      <p>There are lots of URW Nimbus Sans Novus fonts out there, some for free, some cost, like from Myfonts. <a href="http://www.myfonts.com/fonts/urw/nimbus-sans-novus/" title="http://www.myfonts.com/fonts/urw/nimbus-sans-novus/">http://www.myfonts.com/fonts/urw/nimbus-sans-novus/</a> Without actually having the software (aka "font" in this case) to see, there is no way of examining the specific OpenType features someone wrote. That's where any automation takes place. And since it's a customer's font that can't be changed, you'll want to be real careful what solution you eventually pick. I know Murphys' dictum was shorthand for "mean time before failure," but the conventional, sadly humorous meaning can wind up applying, too.</p>
