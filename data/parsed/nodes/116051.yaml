    <p>I'm working on a template for an InDesign document that will use a lot of footnotes, and I'm having an issue getting the OpenType superscript feature to actually work. I'm using InDesign CS6, and the typeface is Nimbus Sans Novus (the cut from URW). I see that OpenType superscript works fine in Minion Pro in my document, but I have to manually select numbers from the glyphs palette to get it work with Nimbus or Helvetica Neue, so I assume its a problem in the way the OpenType font is programmed. Is there a decent workaround for this? I've requested fixes to OpenType fonts from other foundries but I'm not sure this is even possible for this project, since I'm dealing with a corporate font choice that is part of their enterprise software solution, and the fonts are served up via the Universal Type Server, making it not just an issue on my end.</p>
    <p>The template will eventually be turned over to the production department, so I'd like a simple fix if possible (the big issue here is that the superscript numbers go to greek onscreen because they are so small when viewed at fit to page, on top of being optically ugly due to scaling).</p>
    <p>Thanks!</p>
