    votes: null
    html: <p>Heidi, you asked 'is there a good specimen book?' and the best answer is the Font Book from FontShop International. Mine is so used it's starting to fall apart. I heard a rumor that a new edition will be out soon. I hope it's true. <br> <br>The Phil's Photo book is a good one for older styles, but remember that those are film types, and although many of them may also have digital versions, not all of them do. <br> <br>If you can still get the Precision Type  Font Reference Guide, it's a good value. I also like that it shows the complete fonts in all the weights. The Font Book samples are sometimes incomplete when trying to see the other weights than the main one used for each face. <br> <br>My list of my own font book collection is shown on my <a href="http://bowfinprintworks.com/ListPages/FontBookList.html" target="_blank">Typographic References</a> page.</p>
