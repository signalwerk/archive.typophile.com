  html: "<p>Hello people of type. I am doing research on experimental typography for a class and haven't had luck finding good textbooks or papers if any on this topic. Has any of you come across on this topic in books or essays? Could you share your  sources? I'm particularly looking for material on experimental typography in book design. An example of this is <a class=\"freelinking external\" href=\"http://www.nd.edu/~stomasul/VAS_homepage.html\" rel=\"nofollow\">VAS: An Opera in Flatland</a>. Thank you for your help!!!!!!!!!!!!!!!!!!!!!!!</p>"
