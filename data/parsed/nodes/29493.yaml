      <p>One can adapt almost any font to be a stencil font, I suppose.<br>
      Too many font designers have looked at stencils as a stylistic exercize and fail to take into account the structural requirements. There is more to it than just keeping the counters attached to the outside, though that would be the minimum design criterion.</p>
      <p><a href="http://www.trafficstencils.com/" rel="nofollow">Traffic Stencils, inc.</a> sells some very practical and durable stencils. Hardly are they attractive, but they hold together.</p>
      <p>Stencils are not stupid. They are practical tools for situations when other types of marking are, well, not practical.</p>
