    <p>type designers allways trying to create new particularities in type face design!</p>
    <p>Stencil font design offer great possibilty of creating new approaches. I think we can draw stencil letters without just cutting the letter forms or adapting them to the stencil technology. As stencil cuts add complexity to letterforms, offer new vast drawing possibilities.</p>
    <p>Don't you think?! :)</p>
    <p>I have been working on a stencil font called Forma, in wich the interruptions have a connection with the basic structure of the letters.</p>
