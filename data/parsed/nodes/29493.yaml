      <p>Forma has very thin support bars, and many are positioned such that the counters could easily be torqued out and broken away, most obviously in the A, B, D, P, O, Q, and R. In the lower case, the a, b, d, e, g, o, p, and q have the same problem. The curved support bar of the A is unusual, but not prohibitive depending on the method and material of construction, but most ways I can think of it it only serves to further weaken the bar.</p>
      <p>A stencil made with this font would work, but it could be easily damaged and is therefore not suitable for repeated use. It would depend on the material and size of the stencil and the conditions under which it is used. The counters are attached, but in such a way that they're still floppy, and that is dangerous when designing a sturdy, functional stencil.</p>
      <p>I'll try to put together a little image of some other stencil fonts, like Freeform 721 and Glaser Stencil and whatever else I can find so we can further the discussion. It seems most if not all stencil fonts take some liberties with what I imagine stencil engineering to be.</p>
