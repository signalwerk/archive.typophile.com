    html: |-
      <p>Rui, </p>
      <p>If we do want to distinguish between a design that can be translated into a reusable stencil, and a stylistic exercise, then I think your design is the latter. The locations of the 'interruptions" as you call them are less than optimal if you consider making and using a stencil from it. Some letters might need to be completely redesigned if your real goal is reusable stencils. </p>
      <p>I have made stencils, and some were only intended to be used 2-4 times and then thrown away. In one case I made a house number, and held the small counters to the rest of it by taping long pieces of hair across the whole thing (my sister has very long hair). So you could even make a stencil that doesn't look like one. For that matter, silkscreen printing is essentially a stencil held together by a fine mesh of "hairs", or the thin threads of the screen. </p>
      <p>But what is your goal, and what are your real constraints? If the design isn't meant to ever be translated into physical materials, then why bother? You could make a font with interruptions all over, or one with dents and bumps, or.... If the real constraints of making a functional stencil aren't there, then why are you doing it? If you want to play with that style, I say make it work for real. The big challenge is making it work and look good. </p>
      <p>Finally: To see if your design works as a stencil, print it on heavy card, take a knife and cut it out. Spray paint or sponge paint something with it. Does the card curl up? Do the links dissolve from the moisture in the paint? Are they too delicate to withstand blotting or brushing? Use plastic. Does the paint get under the counters? There are a number of other concerns with designing real stencils that might be more interesting than any of our theories. What about trapping?</p>
