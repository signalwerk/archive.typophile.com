      <p>There's a lot of interesting work being done using stencils. Multi-colored graffiti, signage, tags and other applications that call for inventive letters and images cut from some material. Getting them to work is the fun part, then using them to mark or communicate is the purpose. I've seen elaborate murals made only with stencils, as well as political graffiti. Portable, quick, no need for tape.</p>
      <p>Digital outlines don't have the same constraints at all, so why bother thinking about "stencil" when it's just a stylistic choice? I don't know why there are so many monospaced fonts out there either. </p>
      <p>I'm attaching an idea from a typophile letter design challenge; I think the idea was design a stencil alphabet and use it. I didn't get around to using it, but this is a scan of the actual stencil. </p>
      <p>I can't seem to attach an image today.... </p><div class="imageWrap"><img src="http://typophile.com/files/ccstencilart2_6305.gif"></div><p></p>
