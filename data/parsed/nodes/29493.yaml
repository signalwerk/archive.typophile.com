      <p>The good news about stencil design is indeed that there's still much room for exploration. The bad news is that virtually all of the exploration is done for the sake of style, not function.</p>
      <p>One of my type design students -a graffiti artist, appropriately- did a unicase stencil font. I tried to guide her as much as I could, and I think the results were interesting and useful, but I have to admit to having felt a little bit lost! More thought is needed, all around.</p>
      <p>hhp</p>
