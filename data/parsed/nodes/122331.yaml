    <p>Hello Typophile Forum,</p>
    <p>I finally finished the uppercase part of my new font: Piglence.<br>
    I'd love to hear your comment or feedback for the proportion of a few glyphs, like the O, Q, G and Y.<br>
    Not sure if they're having good balance. </p>
    <p>Thanks in advance,<br>
    Cheers!</p>
    <p>~ A u d e e</p>
