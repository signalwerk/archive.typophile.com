    html: <p>Recently I saw a couple of examples of mid 20th Century Danish maps that used backwards leaning letters for names of bodies of water, like the backwards leaning versions of Kursivschrift and Roemisch. Modern Danish maps that I’ve seen haven’t used this convention. Does it come from Germany? Does anyone know something of its history? Has it ever been in regular use on English language maps?</p>
