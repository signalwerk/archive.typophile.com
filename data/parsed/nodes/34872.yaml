    html: <p>I think Oxtail is the one I was looking for. It’s not a question of not liking. I was looking for a similar feel for a project. I felt that Kursivschrift was a bit too “strong” for the project (which is actually for an all female institution* was looking for something feminine). I’ve seen it used in Blueprint, which was what piqued my interest. Thanks very much for the help though:D</p>
