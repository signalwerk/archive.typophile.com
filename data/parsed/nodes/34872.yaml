    <p>Hi, I’m new here, but I do need help. I’m looking for a font similar to Linotype’s Kursivschrift. It can be seen <a class="freelinking-external" href="http://www.fontshop.com/fonts/downloads/linotype/kursivschrift_virtual/">here</a>.</p>
