    html: |-
      <p>I'm a bibliophile who dabbled in calligraphy and hand lettering for a while, and who subsequently worked in computer graphics for three years in the early eighties. During those years, I spent vast amounts of time editing bitmaps of Helvetica and Clarendon, simulating kerning (for a graphics display system that wasn't anywhere near true kerning), and reveling in the actual typeface choices that my office neighbors in the art department could select at will.</p>
      <p>I left the job when 3M bought out the company (I feared there was no stable future in computer graphics), but the experience of type design, umm, left an imprint on me.</p>
