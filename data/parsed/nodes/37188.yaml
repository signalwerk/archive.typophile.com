    <p>Why do you enjoy working with type?</p>
    <p>I'll answer first:<br>
    I love the craft, the small discoveries, the satisfaction of making a layout work, finding the right typeface for the job, the history, the strict limitations of the 29 characters (I'm å nørwegiæn), wanting to use a typeface for years and then suddely finding the right ocassion. Among other things.</p>
