  html: |-
    <p>Hello,<br>
    excepted for script and italic use, I’m asking myself why not putting something like<br>
    <code>sub f' [b h k thorn] by f.short;</code><br>
    directly into a <em>Liga</em> feature if I want it to be active by default of course.<br>
    Or to put it into <em>Dlig</em> for<br>
    <code>sub f' [ b h k thorn] by f.dlig;</code><br>
    assuming f.dlig has a different letterform than /f/ and /f.short/<br>
    If I should put it into <em>Calt</em> instead, what would be the reason to it?<br>
    Thanks in advance.<br>
    Jan</p>
