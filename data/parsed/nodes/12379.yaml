    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12369" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">“How To” Section</a>&nbsp;: Scripting with&nbsp;Python</strong></p>
    <p>Before you get started making macro programs for <a href="/node/12240" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontLab</a>, you must download and install <a href="/node/13582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Python</a>, the programming language that is used by FontLab to write macros. You can download Python from <a href="http://www.python.org">www.python.org</a>.</p>
    <p>First you should begin by reading the chapter entitled “Macro Programming” in the FontLab Users’ Manual, which can be downloaded from the following locations:<br><strong>Windows:</strong> <a href="http://www.font.to/downloads/manuals/FLS5WinManual.zip"><span class="caps">US</span></a>&nbsp;: <a href="http://www.fontlab.ch/downloads/manuals/FLS5WinManual.zip">Europe</a> (.zip)<br><strong>Mac:</strong> <a href="http://www.font.to/downloads/manuals/FLS5MacManual.zip"><span class="caps">US</span></a>&nbsp;: <a href="http://www.fontlab.ch/downloads/manuals/FLS5MacManual.zip">Europe</a>&nbsp;: <a href="http://www.fontlab.hk/downloads/manuals/FLS5MacManual.zip">Asia</a> (.zip)</p>
    <p>Once you have done that, some great resources to start with:<br><a href="http://dev.fontlab.net/flpydoc/">The Unofficial FontLab/Python <span class="caps">API</span> Reference</a><br><a href="http://mail.letterror.com/pipermail/fontlab-scripting/">The Letterror FontLab Scripting Mailing List&nbsp;Archives</a></p>
    <p><strong>Discussion:</strong></p>
    <p><a href="http://typophile.com/node/17596">Small release of several python scripts<br></a><a href="http://typophile.com/node/49944">Book Recommendations: Python for FontLab</a><br><a href="http://www.typophile.com/node/2560">Can You Program in&nbsp;Python…?</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://www.fontlab.com/python/">FontLab: Python Scripting<br></a><a href="http://en.wikibooks.org/wiki/FontLab/Scripting">WikiBooks: FontLab/Scripting</a><br><a href="/node/13583" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">RoboFab</a></p>
