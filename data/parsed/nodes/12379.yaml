    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/How-To" class="freelinking" rel="nofollow">"How To" Section</a> : Scripting with Python</strong></p>
    <p>Before you get started making macro programs for <a href="/wiki/FontLab" class="freelinking" rel="nofollow">FontLab</a>, you must download and install <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a>, the programming language that is used by FontLab to write macros. You can download Python from <a href="http://www.python.org" title="www.python.org">www.python.org</a>.</p>
    <p>First you should begin by reading the chapter entitled "Macro Programming" in the FontLab Users' Manual, which can be downloaded from the following locations:<br>
    <strong>Windows:</strong> <a href="http://www.font.to/downloads/manuals/FLS5WinManual.zip" rel="nofollow">US</a> : <a href="http://www.fontlab.ch/downloads/manuals/FLS5WinManual.zip" rel="nofollow">Europe</a> (.zip)<br>
    <strong>Mac:</strong> <a href="http://www.font.to/downloads/manuals/FLS5MacManual.zip" rel="nofollow">US</a> : <a href="http://www.fontlab.ch/downloads/manuals/FLS5MacManual.zip" rel="nofollow">Europe</a> : <a href="http://www.fontlab.hk/downloads/manuals/FLS5MacManual.zip" rel="nofollow">Asia</a> (.zip)</p>
    <p>Once you have done that, some great resources to start with:<br>
    <a href="http://dev.fontlab.net/flpydoc/" rel="nofollow">The Unofficial FontLab/Python API Reference</a><br>
    <a href="http://mail.letterror.com/pipermail/fontlab-scripting/" rel="nofollow">The Letterror FontLab Scripting Mailing List Archives</a></p>
    <p><strong>Discussion:</strong></p>
    <p><a href="http://typophile.com/node/17596" rel="nofollow">Small release of several python scripts<br>
    </a><a href="http://typophile.com/node/49944" rel="nofollow">Book Recommendations: Python for FontLab</a><br>
    <a href="http://www.typophile.com/node/2560" rel="nofollow">Can You Program in Python...?</a></p>
    <p><strong>Additional Articles:</strong><br>
    <a href="http://www.fontlab.com/python/" rel="nofollow">FontLab: Python Scripting<br>
    </a><a href="http://en.wikibooks.org/wiki/FontLab/Scripting" rel="nofollow">WikiBooks: FontLab/Scripting</a><br>
    <a href="/wiki/Robofab" class="freelinking" rel="nofollow">Robofab</a></p>
