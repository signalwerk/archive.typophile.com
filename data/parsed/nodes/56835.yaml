      <p>I think elegant doesn't go together with readable at small size, particularly for lower case.</p>
      <p>But they can look good. And if you want to go all cap, as your example indicates, then Engravers Gothic or Copperplate Gothic are among the most readable tiny, because of their wide characters.</p>
