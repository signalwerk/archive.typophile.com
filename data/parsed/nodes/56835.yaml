    html: <p>Going for elegance at small sizes could be tricky, since features that are often associated with elegance such as delicate hairlines don't work at those scales. Anyway, I'll add <a href="http://www.typotheque.com/fonts/fedra_serif_a" rel="nofollow">Fedra Serif A</a> to the list of suggestions.</p>
