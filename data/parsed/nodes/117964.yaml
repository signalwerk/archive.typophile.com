    html: |-
      <p>The Fraktur nameplate looks like custom lettering based on  William H. Bradley's dramatic redesign of blackletter in the 1890s and digitized as  Bradley Pro by Ralph M. Unger<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/BradleyProInUse_6191.jpg"></div><br>
       <a href="http://www.myfonts.com/fonts/profonts/bradley/" title="http://www.myfonts.com/fonts/profonts/bradley/">http://www.myfonts.com/fonts/profonts/bradley/</a><br>
      Of course somebody could have produced this as a font, but I have not seen it.<br>
      Don<p></p>
