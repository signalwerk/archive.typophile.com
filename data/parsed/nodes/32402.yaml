    <p>Hello!</p>
    <p>My first post.</p>
    <p>I’m looking for a suitable font for a rock band logo. The bands name is Rock Fuel. There music is similar to that of The Hellacopters, Backyard Babies and Buck Cherry.</p>
    <p>Right now I’m looking at Wilhelm Klingspor Gotisch but I’m starting to think that it might be a little too much. Does anyone have any other suggestions?</p>
    <p>I’m limited to Adobes open type library.</p>
    <p>Thanks<br>
    Peter</p>
