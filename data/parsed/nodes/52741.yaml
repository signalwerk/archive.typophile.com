      <p>Nick, I'm just glad I'm alive and try to make the most of every day and every situation no matter what the circumstances. That makes me more flexible when it comes to peeple, and more determined to get more of my fonts finished.</p>
      <p>Congrats on Houschka reaching #1 on (what used to be named) the Starlets chart. I knew it would, and I guess it will migrate to the best sellers chart soon. If you can just get the Pro version into that position.</p>
