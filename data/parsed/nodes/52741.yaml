    <p>G-Type have finally updated the best selling Houschka family and released the mighty Houschka Pro which, like its Rounded sister family, comes complete with CE &amp; Cyrillic language support plus a host of alternates and typographic extras making it an extremely versatile family. Houschka Pro is a complete overhaul of the Houschka family, originally from 1999. 7 fonts in one single font x 6 weights! from Thin to Extra Bold.</p>
    <p>In a quirk of fate, this week sees the opening of Jim Carrey’s latest blockbuster, The Yes Man, featuring Houschka very prominently in the  <a href="http://www.impawards.com/2008/yes_man.html" rel="nofollow">promo posters</a> and <a href="http://yesisthenewno.warnerbros.com" rel="nofollow">website</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/houschkapdf_4872_4682.png"></div><p></p>
    <p>The Houschka Pro 5-spread pdf (attached) is a guide to show how characters change with different features, sets etc.</p>
    <p>Houschka Pro is Postscript flavoured OpenType with the following features:<br>
    Regular style set with 3 extra style sets<br>
    Lining numbers<br>
    Old-style numbers (both are tabular and proportional)<br>
    Small Caps<br>
    Ligatures - ffi fi ffj ffl ff fj fl<br>
    Discretionary ligatures - ct fb fh fk ft sp st<br>
    Contextual alternates - A, W, w, also in small caps<br>
    Stylistic alternates - replacement infant a’s.</p>
    <p>All features work with each extra style set.</p>
