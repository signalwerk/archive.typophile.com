  html: |-
    <p>I am having trouble identifying this serif face taken from the Black Sails opening sequence. It has all the characteristics of a Garamond, but the very low chin on the capital G throws me off. The W is not in this sample, but if you check the video you will see it has the typical crossed strokes. The actual Black Sails logo at the end is Goudy Old Style, and the sans serif caps Alternate Gothic (unless it’s Trade Gothic, still need to verify).<br>
    <a href="https://vimeo.com/84162805" title="https://vimeo.com/84162805">https://vimeo.com/84162805</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/jamin_black-sails_type_5947.jpg"></div><p></p>
