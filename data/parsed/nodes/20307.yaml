      <p>Cooper Union is offering summer classes in both type and calligraphy. Also, Parsons, SVA, and Pratt offer classes in their professional/continuing education divisions, taught by working professionals.</p>
      <p>Or head up to scenic Lake Cayuga, where I will be teaching<br>
      "Stems and Beziers: An Introduction to Typeface Design"<br>
      at the Wells Book Arts Summer Institute, July 9-15.<br>
      Learn more: <a href="http://aurora.wells.edu/~wbac/bookarts/educ_summerinst.html" title="http://aurora.wells.edu/~wbac/bookarts/educ_summerinst.html">http://aurora.wells.edu/~wbac/bookarts/educ_summerinst.html</a></p>
