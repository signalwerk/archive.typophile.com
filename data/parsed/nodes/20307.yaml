    <p>Any good classes/courses in NYC? There is never enough typography courses I can take :-)</p>
    <p>I've been to SVA and took a class with Ed Benguiat, great attention to detail, and such a fun class!!<br>
    not much about layout, grid etc. </p>
    <p>Any schools, teachers, classes anyone in NYC know of?</p>
    <p>Thanks for your attention</p>
