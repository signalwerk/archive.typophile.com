    <p>Does anyone know a good script that looks like Andy Warhol's mother's handwriting?</p>
    <p>I found some information about a font called Warhol by Pepe Gimeno, which won a Type Director's award in 2001, but haven't been able to find it online.</p>
    <p>Thanks.</p>
    <p>J</p>
