      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Verlag-Journal_Sans_5727.gif"></div><br>
      <a href="http://paratype.com/pstore/fonts/Journal-Sans.htm" rel="nofollow">Journal Sans</a> is the closest analogue I could find. Using it as a substitute for Verlag could be fine; just don’t use them together, side by side.<p></p>
