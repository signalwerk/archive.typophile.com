    html: <p><img src="/sites/default/files/old-images/Verlag-Journal_Sans_5727.gif"><br><a href="http://paratype.com/pstore/fonts/Journal-Sans.htm">Journal Sans</a> is the closest analogue I could find. Using it as a substitute for Verlag could be fine; just don’t use them together, side by side.</p>
