    <p>I can't ID this one myself. I've asked a few people and tried whatthefont from multiple sources as well. I originally guessed Meta, or Fedra sans.</p>
    <p>I think it's probably easiest to just present a few URLs, they use it for every header:</p>
    <p><a href="http://www.sun.com/software/solaris/get.jsp" title="http://www.sun.com/software/solaris/get.jsp">http://www.sun.com/software/solaris/get.jsp</a>    "It's that easy"<br>
    <a href="http://www.sun.com/products/index.jsp" title="http://www.sun.com/products/index.jsp">http://www.sun.com/products/index.jsp</a>     "Get smart. Save green."<br>
    <a href="http://www.sun.com/servers/index.jsp" title="http://www.sun.com/servers/index.jsp">http://www.sun.com/servers/index.jsp</a>    "Triple your capacity"</p>
    <p>Thanks guys!</p>
