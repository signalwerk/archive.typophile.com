  html: |-
    <p>Supose you have done a typeface in Fontlab, and you generate the SMCP glyphs.<br>
    Now, you need to space them and kern them at the metrics windows...</p>
    <p>How the heck do you do it? I mean, It's difficult to create lines of texts in small caps at the metrics windows...</p>
    <p>Do you use the preview window?  / Do you put each smcp character separately at the metrics window? / Do you use some kind of awesome kerning preview text?</p>
    <p><strong>What I'm really asking is:<br>
    Is there any way to magically substitute lower case letters for small caps at the metrics windows so I can space them without having a headache? </strong></p>
    <p>As always thanks for the help! :)</p>
