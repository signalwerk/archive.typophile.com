    html: |-
      <p>what helps a lot when doing metrics of small caps etc. is to setup a basic string like<br>
      /H.sc/H.sc/H.sc/H.sc/H.sc/A.sc/H.sc/H.sc/H.sc/H.sc/H.sc/</p>
      <p>then click the glyph you want to change, and use CRTL+mousewheel to switch to next glyph. No tedious typing involved.  There are also keyboard shortcuts for it, but they seem to differ in platform, version and language of your keyboard ...</p>
