    html: |-
      <p>One common trick is to type/paste your string into the OpenType Features tab of the Preview panel, activate the feature (in this case SMCP), then copy the slash-coded string from the bottom of the panel into the Metrics window. If it's something you're likely to reuse, you can also add it to the list of preview strings (the Options '...' button in the Metrics window or Preview panel).</p>
      <p>Or, if you happen to be using Windows, the <a class="freelinking external" href="http://www.fontlab.com/front-page/featured-product/introducing-fontlab-studio-5-2-for-windows/" rel="nofollow">FontLab 5.2 Public Preview version</a> supports OpenType features in the Metrics window.</p>
