      <p>Chalet is known as a grotesque sans serif. Here are some similar grots that are available for purchase by individual font* as opposed to a full package:</p>
      <p><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=8&amp;displayfontid=LH.107902.0.0&amp;fontRendererText=Gemini">Basic Commercial</a><br>
      <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=22&amp;displayfontid=FF.11312.0.0&amp;fontRendererText=Gemini">FF Bau</a><br>
      <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;startrow=1&amp;records=&amp;currpage=1&amp;totalrecords=6&amp;displayfontid=M.103091.0.0&amp;fontRendererText=Gemini">Monotype Grotesque</a></p>
      <p>*If you’re using only one font style, you certainly save money this way, but it sounds like you’re designing an identity package for your client. In which case it would serve you well to purchase more than one weight and perhaps italics. The price per font is often much lower when you buy a package.</p>
