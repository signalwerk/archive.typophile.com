    <p>Hello all!</p>
    <p>This is my post here…….yes I am a virgin to the forums so go easy on me</p>
    <p>I am creating a business card for a new hair salon called Gemini and I have come across a font that I really want to use.<br>
    Unfortunatly I can’t fit it into the said budget. I really like the Chalet series from House Industries and was wondering<br>
    if anybody could recommend a similar or cheaper alternative to the one I have posted.</p>
    <p>Cheers</p>
