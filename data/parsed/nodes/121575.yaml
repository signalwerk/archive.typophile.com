    html: |-
      <div class="comment-spam-body"><p>Updated:<br>
      Martina, which dates from the early 1990s, is apparently based on the photo-lettering era Filmotype Hudson. Some letters in Martina like _E_  and perhaps _A_ were alt letters in the Filmotype Hudson filmstrips. The alt _E_ is found in the digital Filmotype Hudson as an alt _E_, but it does not include an alt _A_ like the one in Martina. The Martina _A_ is either an alt _A_ that was in the filmstrips and was missed in the Filmotype digitization, or was created by editing _a_ when the digital Martina was made.<br>
      Don</p>
      </div>
    html_clean: |-
