      <div class="comment-spam-body"><p>Recommendation. If you want to purchase a font with clear legitimacy, get Filmotype Hudson. If you want the rounded _A_ it's fairly simple to make. In any case, the quality is much better than Martina/Hudson.<br>
      Don</p>
