    html: |-
      <div class="comment-spam-body"><p>Updated:<br>
      There is also a font called Hudson which has the same _A_ as Martina, but the links from Identifont don't work. See <a href="http://www.identifont.com/find?font=Hudson&amp;q=Go" title="http://www.identifont.com/find?font=Hudson&amp;q=Go">http://www.identifont.com/find?font=Hudson&amp;q=Go</a><br>
      Don't know if this was pulled from sale because of legitimacy issues.<br>
      Hudson is currently offered for sale as a FontSite Font. Again, I am not clear as to whether there are legitimacy issues.<br>
      Further Update:<br>
      I checked both digital Martina and FontSite digital Hudson. The Digital outlines, node positions etc. are virtually identical so one is a clone of the other. Identifont states a 1992 copyright for Hudson by The Font Company. Internal information on the Hudson font now being sold by FontSite claims a copyright of 1996. Internal information on Martina claims copyright 1990-1993 FontBank, Inc. I have no idea which dates reflect reality and who copied whom.<br>
      Don</p>
      </div>
