      <p>My god that is a general question. Can you give more of an indication of what sorts of fonts interest you? Sans vs serif, classic vs modern? Or show some examples of newspapers you think work particularly well?</p>
      <p>For text probably best to use a classic serif font for readability/flexibility, but even within that category there are so many to choose from.</p>
