      <p>I’ve done several co-ordinated schemes.</p>
      <p>Brown (Sans) and Worldwide (Serif) are both semi-condensed, have a similar finish, with display and text weights.</p>
      <p>Here’s a PDF.<br>
      <a href="http://www.africawoman.net/images/educatinggirlsinafrica.pdf" title="http://www.africawoman.net/images/educatinggirlsinafrica.pdf">http://www.africawoman.net/images/educatinggirlsinafrica.pdf</a></p>
      <p>Walburn is a serif headline face that also matches Brown.</p>
      <p>They are the heads in this PDF, today’s Globe and Mail:<br>
      <a href="http://www.newseum.org/media/dfp/pdf7/CAN_TGAM.pdf" title="http://www.newseum.org/media/dfp/pdf7/CAN_TGAM.pdf">http://www.newseum.org/media/dfp/pdf7/CAN_TGAM.pdf</a></p>
      <p>You can also see them at Myfonts.</p>
      <p>For a Jenson-style combo, Nicholas is a display weight of Goodchild.</p>
