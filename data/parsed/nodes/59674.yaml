    <p>Hello,</p>
    <p>I'm developing an Arabic font.</p>
    <p>I want to achieve a substitution like the one shown in the attached image.</p>
    <p>I want "be" to change to "be.alt" when it is before "noon", then I want to change the "noon" to change to "noon.alt" when it comes after "be.alt".</p>
    <p>I know that this has something to do with Contextual Substitution.</p>
    <p>My question is how to write the lookups, and in which order the lookups should be placed?</p>
    <p>Thanks and regards.</p>
