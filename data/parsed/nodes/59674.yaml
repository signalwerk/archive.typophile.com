  - id: 355283
    user: 1262
    date: 2009-07-06T20:56:00
    date_raw: 6 Jul 2009 — 8:56pm
    votes: null
    html: |-
      <p>You will need two separate lookups for this, and you will need to apply them in sequence. The normal layout feature to use for such lookups with be Contextual Alternates 'calt'.</p>
      <p>Lookup 1, using VOLT syntax, will be like this</p>
      <p>be -&gt; be.alt</p>
      <p>with the context string</p>
      <p>| noon</p>
      <p>Lookup 2 will be like this</p>
      <p>noon -&gt; noon.alt</p>
      <p>with the context string</p>
      <p>be.alt |</p>
      <p>Note that you can foolproof the first lookup by putting both noon forms in the context like this:</p>
      <p>| {noon, noon.alt}</p>
