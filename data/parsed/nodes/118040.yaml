  - id: 583441
    user: 52182
    date: 2014-07-18T23:29:00
    date_raw: 18 Jul 2014 — 11:29pm
    votes: null
    html: |-
      <div class="comment-spam-body"><p>It's a matter of responsibility. I have a reduced capacity (for responsibility) and I need to keep my world small to maintain it. Years ago I did a lot of freelance work and eventually I took on too much responsibility and things went wrong; in 2011 my whole world just collapsed. Since then I haven't been able to handle the responsibility to work for clients. I do a few projects here and there behind the curtains but I'm certainly not publicly available. Mails are hard for me because of the expectations people naturally have of communication. On this forum, I don't feel like a response is expected of me. I enjoy a certain freedom here. deviantArt is a sort of in-between world of a forum like this and Facebook, where people have higher expectations regarding communication. As such I see it as a natural step that I will first make my way back to deviantArt before I dare to take the next step. I need to expand my world slowly and carefully. If it expands too fast, I will likely suffer mentally and my world will collapse again.</p>
      </div>
