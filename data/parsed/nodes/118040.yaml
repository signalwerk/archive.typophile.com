    html: <p>Well, I reason a bit differently. I have autism and social contact is troubling for me. I haven't been on Facebook or chat software in years and I haven't been on deviantArt for a year or so and I only dare to check my mail sporadically. Getting back on Typophile is my first step to being social again. Having a PM system here would mean that I could at least send out personal messages to type designers, because mail is quite a big step for me. I hope this Summer I'm able to get back on deviantArt and from there get back on Facebook and mail again. It's a big challenge though. The fact that everything on the Internet is so connected causes anxiety for me. I like closed systems, where I know what to expect and not much can go wrong.</p>
