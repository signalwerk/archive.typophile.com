    html: <p>Regarding the names of the new typefaces, an MS manager decided that they should all being with a hard 'C'. Not sure if there was some well-thought-out marketing plan behind that, or if it was just how he felt that afternoon. I wasn't invited to that meeting. <br> <br>Constantia went through several different name options, each of which failed the extensive international trademark search at some point. You wouldn't believe how expensive international trademark searches are. When I found out, I told MS to 'call my font Cxghjrnsjl and let me have the money you save on the trademark search'. They could have afforded to commission another new type family for the amount of money they spent on trademark searches for these ones. Just when you think type designers are getting decent pay for their work, you find out how much the lawyers are making. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
