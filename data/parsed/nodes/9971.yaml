    html: <p><i>&gt;  would love to explore the topic of why Apple can't seem to even acknowlage their horrible on screen font rendering?</i> <br> <br>I hear people say this, but I think the text looks great in 10.3 (Panther). Maybe it depends on the monitor. I'm using Apple flat panels and I've set the antialiasing preference to "best for flat panel" which does sub-pixel smoothing. It seems very comfortable to read to me, and I've been using computers for over twenty years. I do sit with my eyes about two feet from the monitor (I can no longer focus closer than about a foot without reading glasses), maybe that's a factor. I do agree that the earlier versions of the Quartz font smoothing were not as good, especially in the initial release of OS X. <br> <br>I also have a Windows box with a flat panel display, but it's using an analog VGA connection so it looks very smeary, even with ClearType enabled. No fault of the software--just a hardware deficiency. I'm sure it would look better with a digital video adapter, although I'm not sure if the monitor supports it.</p>
