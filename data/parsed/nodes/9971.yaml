    html: <p>Funny, the Microsoft monopoly rears its ugly head yet again. Fine, the type is good looking, but many of the people that care and would use it do not use PCs. I'm not going out and buying a PC for six typefaces. Sorry, MS.  <br> <br>I think this will prove to be impetus for more energy in the open source community to develope better and more universal techniques for using any typeface a website owns through the back end. It's been coming along any way, now linux and mac users will be forced to find a better way. This way, if you have a screen face, or a pixel font, or any typeface you want for headlines, you could use it and maintain your visual system, rather than defaulting to whatever MS mandates.  <br> <br>I think it's great that MS puts an emphasis on typeface design in instances like this, but it's clearly meant to exclude non-windows users. It's fine, they put the time and money into it, I'm not saying these faces should be free. I just think we're gonna see a gear shift, that's all.</p>
