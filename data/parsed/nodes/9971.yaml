    html: <p><i>Every type designer, I would imagine, given the opportunity to create for such a universal user group, wants to design the ideal face and heads for the average proportions, so as a whole the variety suffers.</i> <br> <br>There was a conscious decision by the project planners that four of the six faces would have the same x-height so that they could be used together in the same line of text with ease. My Constantia type has a smaller x-height and longer extenders (hence, more 'bookish'), and Luc's Consolas monospaced font has a larger x-height; the others are all the same. Remember that the huge majority of people using these fonts will not be typographers, but MS Word users. So we can't expect them to be sophisticated enough to figure out how to visually harmonise different typefaces through relative scaling, so the goal was to simplify this for them by making fonts that are at least reasonably harmonised. For the same reason, the fonts have coordinated vertical metrics, so that the linespacing remains constant whichever of the fonts you employ. Yes, this is at the expense of variety, but variety was not the goal.</p>
    html_clean: <p><i>Every type designer, I would imagine, given the opportunity to create for such a universal user group, wants to design the ideal face and heads for the average proportions, so as a whole the variety suffers.</i> <br> <br>There was a conscious decision by the project planners that four of the six faces would have the same x-height so that they could be used together in the same line of text with ease. My Constantia type has a smaller x-height and longer extenders (hence, more 'bookish'), and Luc's Consolas monospaced font has a larger x-height; the others are all the same. Remember that the huge majority of people using these fonts will not be typographers, but MS Word users. So we can't expect them to be sophisticated enough to figure out how to visually harmonise different typefaces through relative scaling, so the goal was to simplify this for them by making fonts that are at least reasonably harmonised. For the same reason, the fonts have coordinated vertical metrics, so that the linespacing remains constant whichever of the fonts you employ. Yes, this is at the expense of variety, but variety was not the goal.</p>
