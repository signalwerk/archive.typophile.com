    html: |-
      <p>As I said before, There Be Dragons. This is something<br>
      some people (out of some vague fear?) take too far,<br>
      to the point of precluding good design.</p>
      <p>Think about it this way: if classical Roman caps express<br>
      Europe to a greater extend than they express let's say the<br>
      Near East, there <em>must</em> be a way to express what you want.</p>
      <p>Here's the one concrete suggestion I feel quite safe making:<br>
      Find a typeface with inverted contrast - where the horizontals<br>
      are (gently) thicker than the verticals. This is something that<br>
      remains pretty alien to the West, whereas it's entirely natural<br>
      for Arabs, Jews and Indians. But it doesn't ruin readability.</p>
      <p>Look at the work of Excoffon and Bloemsma, and FontBureau's Trilby.</p>
      <p>hhp</p>
