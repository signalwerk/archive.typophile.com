      <p>I did my research you can actually see previous versions of my font, which is called 'whipple.' <a href="https://web.archive.org/web/20150123211311/http://typophile.com/node/3715" target="_blank" rel="nofollow">This</a> is the first round I posted almost three years ago. Then I revised <a href="https://web.archive.org/web/20150123211311/http://www.typophile.com/forums/messages/29/whipple2-5173.swf" target="_blank" rel="nofollow">whipple</a> a little bit more.</p>
      <p>While the letter forms aren't exact, the similarities are pretty amazing. My letters are much more square, while your letters are slightly more rounded. There are glaring issues in my character design &amp; kerning efforts, however I was working on that font almost two years ago and still haven't finished.</p>
      <p>I'm not saying that you copied my font by any means, but it's darn close.</p>
