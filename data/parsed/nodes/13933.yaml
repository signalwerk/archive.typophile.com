      <p>I'm sorry to disapoint, however; not only is this the first time I've ever seen your font but I also fail to see any similarities between "whipple" and kisbefe2 beyond the fact that they are both sans serif. Whipple has irregular strokes and a handwritten feel (the loop in the "d" or the exit stroke on the "t" are two examples).</p>
      <p>Frankly, were I not convinced that your "I'm not saying that you copied my font by any means" is not an attempt at apophasis so much as a poor choice of words, I would be offended by the implication of your statement and amazed that you would attempt to make such a tenuous connection. The evolution of kisbefe2 can be traced through this forum from its beginnings as a one hour doodle <a href="https://web.archive.org/web/20150123211311/http://www.typophile.com/forums/messages/29/nsans1a-65284.pdf" target="_blank" rel="nofollow">shown here</a> (<a href="https://web.archive.org/web/20150123211311/http://typophile.com/node/9241" target="_blank" rel="nofollow">thread here</a>) to a more mature but still rather poor face called <a href="https://web.archive.org/web/20150123211311/http://typophile.com/node/12522" target="_blank" rel="nofollow">KisbefeSans</a> and later just Kisbefe. The proportions, stress, and style are very different.</p>
