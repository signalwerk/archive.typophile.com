      <p>Forgive me Noah, as I've not read all of your other threads about this face. I'm a novice type designer and still have a lot to learn, but I can offer a little bit of a few things that I feel when looking at your face.</p>
      <p>1) I haven't quite figured out the logic of your rounded corners vs. your squared off corners. I don't see any consistency in that design aspect.</p>
      <p>2) Watch the weight of your strokes and stems, for example your K needs more weight on the strokes because your stem looks much heavier. On your R the bowl needs to be heavier and the weight of your junction strokes need to be consistent with your D and B.</p>
      <p>3) Your X doesn't quite make sense to me, it seems you're going for a sans serif with a high stroke contrast... I think you can play it up more with this character. The rounded corners also don't quite work for me.</p>
      <p>4) The Q has too many features. I would simplify it.</p>
      <p>5) Your "c" has the perception of being too narrow in comparison to your b, d, and e. Your e and c look like they're from different planets.</p>
      <p>6) V and A need a closer relationship.</p>
      <p>7) None of your hooks (J, j, g, y) have a consistent style.</p>
      <p>8) Crossbar of "t" is too heavy.</p>
      <p>I hope that's not too harsh. All in all, I like the ideas, but if this face is to be used at all for body copy you have to limit the number of features. People should read words, not identify individual letters. While your letters are nice to look at, there doesn't seem to be a complete harmony between them yet. I think what you have posted is a definite improvement over before, and I have seen your other type designs posted here as well and I think you have a promising future ahead. I hope this helps, good luck.</p>
