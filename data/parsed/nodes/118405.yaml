    html: |-
      <p>I have spent some time looking for this, but couldn't find the exact font. I think this is a commercial font, because it looks like it has ligatures for the 'tu' and 'ti' combinations. Most amateur freebies don't go to that trouble.</p>
      <p>Unfortunately, hand-drawn fonts are too numerous to have a good chance of locating the identical one, so I suggest finding anything similar. <a class="freelinking external" href="http://www.myfonts.com/fonts/madtype/casino-hand/?refby=bowfin" rel="nofollow">Casino Hand</a> from MADType is a good realistic OTF font that is fairly similar.</p>
      <p>- Mike Yanega</p>
