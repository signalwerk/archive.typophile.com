      <p>Hmm. Not sure if I understand what you are trying to do here. Why are you converting <em>to</em> Word? Can't you just copy-paste the plain text? Can you perhaps show some samples of what goes wrong? </p>
      <p>All these formats are wierd choices for ebooks btw. </p>
      <p>You <em>can</em> embed fonts in Word, and from what I remember Adobe's fonts allow this.</p>
      <p>As for a good libre (or commonly available) text serif for (mostly) reading on screen: Droid Serif, Times New Roman and Georgia.</p>
