    <p>Hi everyone, I have been working on a project for the last year and am hoping for some information regarding the best open/free font to use on my ebooks.</p>
    <p>I have a handful of ebooks I would like to share in a mini library on my website, but would also like to have them available in word and plain text as well as PDF.</p>
    <p>I set up one of the books and layed it out to the best of my ability in Indesign, everything converts well to the PDF with the Minion Pro font I am using.  </p>
    <p>But disaster strikes when I try to convert the file to word in Acrobat X, I have made sure there are no errors and that the fonts are all formatted properly.  I have noticed that this font is a bit funny about the conversion if the size is 12p, much of the other text is ruined also, super wide letters, really skinny lettering, just a bit mess.</p>
    <p>I would like to know if anyone has any good recommendations and experience with a flexible font that can handle the converts, I also tried embedding the fonts to no avail.</p>
    <p>I am just looking for a classic font with a roman flare, that is easy on the eye, and sits well in ebooks that people will spend a while reading, or print off. </p>
    <p>Your help in advance would be great, thanks</p>
