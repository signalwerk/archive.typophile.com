      <p>&gt;the ground-breaking hinting and engineering work that went into it as a screen font</p>
      <p>You'll note that above I said "as a text font for print". It is a completely different animal as a screen font, I think, as the hinting quite changes it for the screen. I still like other MS fonts better for the screen, namely Verdana and Georgia. And I look forward to using the new clear type fonts.  </p>
