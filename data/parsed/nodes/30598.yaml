  date_raw: 14.Jan.2007 7.32pm
  votes: null
  html: <p>Does anyone else get annoyed with certain letter shapes in fonts?  For example, I can't stand the foot of the R in Gill Sans stretching out well beyond its bowl above.  It's as though it's taunting, "Don't even think about auto-kern."  The cockeyed serifs of Garamond's T also niggle me.  I want to nudge them like I would an oil painting hung askew on a wall.  In fact, I don't know if I've ever used Garamond or Gill Sans in any project, probably because I see them as flawed.  Are there others who get vexed by a P or peeved by an X?</p>
  html_clean: <p>Does anyone else get annoyed with certain letter shapes in fonts?  For example, I can't stand the foot of the R in Gill Sans stretching out well beyond its bowl above.  It's as though it's taunting, "Don't even think about auto-kern."  The cockeyed serifs of Garamond's T also niggle me.  I want to nudge them like I would an oil painting hung askew on a wall.  In fact, I don't know if I've ever used Garamond or Gill Sans in any project, probably because I see them as flawed.  Are there others who get vexed by a P or peeved by an X?</p>
