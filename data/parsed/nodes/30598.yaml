      <p>&gt;Yeah, but they can be cheap can’t they? :) </p>
      <p>I think this a reference to a Paul Luna thread on the ATypI list where Paul defends his use of Arial Black in some dictionary project he was involved in. Of course Arial on it's original widths rather than on Helvetica widths is a better design. </p>
      <p>As for use at small sizes - Arial's critics always look at the font at display sizes and all fail to credit the ground-breaking hinting and engineering work that went into it as a screen font. I think the proof here is in the rendering and my guess is that you'll find more Web pages that specify "Arial, Helvetica" than "Helvetica, Arial".</p>
      <p>Cheers, Si</p>
      <p>PS I'm biased ;-)</p>
