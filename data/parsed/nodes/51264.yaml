  html: |-
    <p>I made this display face out of a whim, but the patterns/shapes governing the typeface are very much restricting (such as f.alt + l lig which looks like an A). However, I quite liked the look of some glyphs, even though I couldn't find a solution for some (k, for instance). If this works out, I plan to include as many alternates as I could think of, as well as swashes, discretionary ligs, different weights, etc. I just need to make the base design solid.</p>
    <p>Any comments, suggestions, guys? Feedback is very much appreciated.</p>
    <p>Thanks. :)</p>
