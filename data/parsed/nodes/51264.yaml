    html: <p>Nice type and I agree with you when you said you thought the typeface looked old school. It reminds me of the Art Nouveau period but modernized. I also love how the tails are sharp edged instead of the typical curve. Good work.</p>
  - id: 334638
    user_id: 41407
    user_name: achristophe
    user_path: null
    date_raw: 12 Mar 2009 — 7:56pm
    date: 2009-03-12T19:56:00
    votes: null
    html: <p>Looks great! The only critique that I have is that some glyphs are not consistent with others. Some glyphs are completely sharp edged, while others are sharp edged and curved. I prefer the sharp edged and curved style. I think that if those glyphs are reworked to similarities of the rest, you would have a great typeface on your hands. Good job.</p>
