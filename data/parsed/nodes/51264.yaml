    html: |-
      <p>Uploaded the new PDF file (Untitled-4.pdf) containing all the current glyphs. Right now, it's looking okay, but I fear that I might lose my focus when designing the rest of the uppercase. Take the F/F.alt and H/H.alt for example. I wasn't sure if the H.alt was good enough as the default one, so I made a clean H and then just made an alternate version. In my opinion, that's good, as the user can choose the glyph he/she desires. I'm just an amateur though, so I want to hear some feedback on this. :)</p>
      <p>Any comment, suggestion, or criticism is most appreciated.</p>
      <p>Thanks.</p>
