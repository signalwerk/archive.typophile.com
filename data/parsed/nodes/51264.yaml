    html: |-
      <p>Can you do an alt. version of the G with the leg of the k kicking off the front? </p>
      <p>Also, push the straight leg of the R out further, it's very top heavy and needs better support... more along the lines of the R from Neutraface.</p>
      <p>The S and s are quite different from each other... you might want to pick one style. </p>
      <p>I think the lowercase f could have a descender, similar to Fedra Sans. </p>
      <p>Still loving this, can't wait to see more.</p>
