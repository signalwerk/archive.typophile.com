      <p>You didn't specify a style of font. The following are not necessarily "favorites," but they are all typefaces that include flat-topped 3s:</p>
      <p>Sans Serif:<br>
      Bureau Grot<br>
      DIN Schriften Neuzeit Grotesque Light<br>
      Felbridge<br>
      Formata BQ<br>
      London Underground<br>
      Neuzeit S<br>
      ITC Panache<br>
      ITC Symbol</p>
