  html: |-
    <p>We're pleased to announce the re-release of two breathtaking new fonts from the Filmotype Font Library.</p>
    <p>Initially designed in the early-to-mid 1950s, Filmotype Ginger helped usher in the Mod typographic stylings of the early 1960s visual aesthetic yet it retains a classic and timeless feel. This classic Sans Serif face joins the Filmotype Glenlake font as one of our Gothic revivals.</p>
    <p>Among the very first handwritten script fonts offered by Filmotype in the beginning of the 1950s, Filmotype LaSalle was designed by Ray Baker, a former Lettering Inc employee at the time who named the face after LaSalle street in downtown Chicago.</p>
    <p>Both faces were developed from the original filmstrips and include a full international character compliment, automatic fractionals, ordinals, and a host of alternate characters and ligatures to allow flawless typesetting in dynamic OpenType format. </p>
    <p>We're pleased to share the re-release of these amazing original designs from the 1950s and hope you'll find them to be a perfect compliment to your design toolbox.</p>
    <p>You can purchase, preview and discover more about these faces online exclusivly at Font Bros!</p>
    <p>See 'em here: <a href="http://www.fontbros.com/filmotype.php" title="http://www.fontbros.com/filmotype.php">http://www.fontbros.com/filmotype.php</a></p>
    <p>Warmly,<br>
    Stuart</p>
