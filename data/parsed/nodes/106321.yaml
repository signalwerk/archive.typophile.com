  html: |-
    <p>Hello,</p>
    <p>We have a font generated from FontLab as OTF that is being used in Word 2010. The EM dash in the font isn’t displaying correctly on the screen, though it does PDF correctly.</p>
    <p>It almost appears as if Word is building the display of the EM dash from a bunch of kerned together dashes. This is causing some very problematic display and alignment issues, especially since the zoom at which the page is being displayed effects how it looks as does the justification of the line.</p>
    <p>This does NOT occur when the font is generated as a TTF.</p>
    <p>The below screen shot is an extrme zoom not usually used but the same thing happens at smaller zooms.</p>
    <p>The font was initially a series of Type1 fonts so the UPM is 1000.</p>
    <p>Is this just an inadaquacy of Word being able to display the OTF?</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Ken<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/EM_dash_3863.jpg"></div><p></p>
