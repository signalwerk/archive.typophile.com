  html: |-
    <p>Hello,</p>
    <p>a friend of mine is a seamstress and, when she gave me her busines card, I thought that she needs a logo. The business card is in one of those default styles of an online company that makes business cards. Since I am not an expert and can not afford to hire one, I took a typeface that I like (<a class="freelinking external" href="http://www.myfonts.com/fonts/fenotype/mercury-script/" rel="nofollow">Mercury Script</a>), tweaked a little bit and added a needle. I am not sure about those four dots but they were in the font...</p>
    <p><img src="http://img809.imageshack.us/img809/4462/g7782.png"></p>
