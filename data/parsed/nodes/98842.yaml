    html: |-
      <p>Nice work, I like your concept.</p>
      <p>The guys here are on the right track, with a little refinement it will go from great to amazing.<br>
      The typeface in its current state is a little confusing and can look as if the seamstress doesn't know what she's doing and is knotting the thread. Movement is perfect in this instance but how about reducing the amount of doubling over the 'thread' does. Simplify it a little and maybe run the thread parallel with the bottom of the logo.<br>
      Incorporate Plume's idea of 'stitching' it in with some negative space, four should do it.<br>
      Definitely remove those dots.</p>
      <p>Post up any refinements you make, I'd love to see what you come up with.</p>
