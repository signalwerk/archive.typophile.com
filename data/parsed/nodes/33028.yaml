    html: <p>Don't get too distracted by ink traps. Those were developed to compensate for very real conditions in a specific printing environment. The issues with a screen-optimized face are very different; as Hrant points out, it's larger issues like stem weight, counters, sidebearings, overshoot, etc. to worry about. If you don't have to match a print version, it frees you up to choose optimal proportions and placement of the most important features, and it is really quite different when you have that freedom. For instance, if you have to match a print font, sometimes you end up with very cramped or bent-looking shapes to AKMNVWkvwy. If you start with bitmaps, you can design them from the beginning to look right onscreen. Spacing, character shapes and things like dots and accents will benefit greatly.</p>
    html_clean: <p>Don't get too distracted by ink traps. Those were developed to compensate for very real conditions in a specific printing environment. The issues with a screen-optimized face are very different; as Hrant points out, it's larger issues like stem weight, counters, sidebearings, overshoot, etc. to worry about. If you don't have to match a print version, it frees you up to choose optimal proportions and placement of the most important features, and it is really quite different when you have that freedom. For instance, if you have to match a print font, sometimes you end up with very cramped or bent-looking shapes to AKMNVWkvwy. If you start with bitmaps, you can design them from the beginning to look right onscreen. Spacing, character shapes and things like dots and accents will benefit greatly.</p>
