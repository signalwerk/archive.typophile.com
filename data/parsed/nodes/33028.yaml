    html: |-
      <p>Trapping actually does make sense onscreen, although less on an LCD than a CRT. But even on an LCD it help because a big reason trapping in general is useful is that it fights optical degradation, not just "mechanical". At small sizes funny things happen, as Dwiggins discovered so explicitly.</p>
      <p>Jas, it looks like you're making an outline font that tries to look good onscreen, as opposed to a true pixelfont. Which is one good way to go, especially since that means it will be usable for print. But know that you will end up compromising the screen rendering to a good degree (unless you do mountains and mountains of hinting).</p>
      <p>But in any case looking at your PDF you really have to worry about the more "macro" features looking good on screen first - like the right stem of the "n". Even just that is a challenge - and bitmap trapping is a level (or two) above that...</p>
      <p>hhp</p>
