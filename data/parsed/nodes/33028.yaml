      <p>Yes, if you get sorted with a specfic target PPEM you are off &amp; running. This kind of project will be complicated inevitably by the fact that different PC laptops can have different PPEMs and the fact that Different OS' have different ways of rendering. So in some ways to do something that isn't fairly mad you will be better off accepting that not all computer screens will be optimal for your font. If it's a Mac your talking about ( sounds like it to me! ) then it will be much more predictable - but there are still screen differences to stay aware of.</p>
      <p>Carl is right that trapping could be blind alley for your purposes. In my case I have found that they mostly help to make text look mushy on screen. And Carl &amp; Hrant are right that figuring out what you want in greyscale first might help you to clarify your intent - what the finnished rendering should look like.</p>
      <p>Here are some more links:</p>
