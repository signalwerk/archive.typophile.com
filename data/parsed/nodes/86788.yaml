      <p>Ambigrams are always fun and especially when the concept fits well like it does here. </p>
      <p>From a lettering standpoint, I think what you have is pretty great. From an overall composition, though, I think the rounded dots are distracting and don't fit in to the overall vibe of the letters which are much more blackletter. I'd suggest playing with some more wavy diamond-shaped forms for the dots. </p>
      <p>I'm also not sure a circle is the best form to lock it up with. Again, there's a bit of dissonance between the circle and the letterforms. </p>
      <p>Overall, though...nice work!</p>
