    <p>Hey there fellow Typophiles,</p>
    <p>I've recently been commissioned to design a mark for an abstract strategy board game. The game is called Pivit, which references the game's basic mechanics—upon making a move, the player's piece must be rotated, or pivoted, toward an opposing angle, which dictates the direction of their next move. </p>
    <p>I chose to draw the logotype as an ambigram because it reflects the game's distinguishing play characteristics, ie. the logo can rotate, just like the game pieces. But as I'm sure many of you know, ambigrams require skill and deep knowledge of typographic history to execute well. I feel like the basic shapes of the characters have been established, but I'm well aware that there is a level of finish currently missing in the attached comp. So I'm calling on my fellow type junkies to point out the flaws and opportunities you might recognize in the attached mark.</p>
    <p>This project represents a leap in my knowledge of typography, and has made me realize just what a novice I really am. Your feedback is greatly appreciated. So please don't hold back.</p>
