    <p>This is my first post here and my first attempt at my own web design logo.  I would appreciate suggestions.</p>
    <p>“poco” is a musical term (italian) meaning “little”</p>
    <p>I emphasized this trait because I am small, and also the aspect of the spiritual.  I design a lot of small websites, nonprofit, blogs, and church sites.</p>
    <p></p><div class="imageWrap"><img src="/files/pococreative_3911.png"></div><p></p>
    <p>Many thanks.</p>
