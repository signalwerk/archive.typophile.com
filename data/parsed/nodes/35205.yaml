      <p>Thanks for your thoughts and tips.   I guess I am trying to say a lot, and I don’t necessarily want to emphasize the angel/spiritual, but I thought it was a neat idea.  I had a bird/dove at first with just a ’lady’ (not angel), but it kind of seemed to resemble a towel (ha), and I can’t seem to find the perfect font for ’creative.’  These were mockups along those lines that I made last month but dismissed (just rough screenshots).</p>
      <p></p><div class="imageWrap"><img src="/files/Picture3_5083.jpg"></div><p></p>
      <p>Certainly the david / goliath is what I’m implying with the name and any mark ideas...  Before the ’angel’ idea, here is what was going through my head concerning the little/big concept...</p>
      <p></p><div class="imageWrap"><img src="/files/Picture2_5326.jpg"></div><p></p>
      <p>So you can see I’m still quite in the brainstorming phase.  IMHO I am more gifted at coding than graphic design, but I think surely I can come up with something I am pleased with to represent myself to clients.   I can be patient and work at it, but at the same time I want to get it up on my main site in the near future, so I will have something substantial for my business.</p>
