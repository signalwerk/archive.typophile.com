    <p>I apologize for posting this here, but i’m wondering if anyone can point me towards some worthwhile discussion on the interplay between these bits of software.</p>
    <p>I’ve just recently upgraded to both windows vista and adobe cs3, and have found that suitcase no longer plays nicely with T1 fonts in that environment.  I’m not exactly sure  where the problem is, just that the T1 fonts no longer activate.  It seems that several people have had this problem, but i can only find scraps of information about it or a solution.</p>
    <p>Thanks in advance for any help.</p>
