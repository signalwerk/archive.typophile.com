    <p>It’s that time of year again. October, and time to harvest the kern...um...corn. Wielding the sickle recalls the sage advice given by your father, <a href="https://web.archive.org/web/20080905043305/http://www.myfonts.com/fonts/sentinel/sibyl/">“Trust everyone,” he said, “but cut the corn!”</a> </p>
    <p>If only life were that simple.</p>
    <p></p><div class="imageWrap"><img src="/web/20080905043305im_/http://www.typophile.com/files/childkern_6654.gif"></div><p></p>
    <p>By the time you got back to the farm house the children had taken over the town, exiled all grown-ups and declared, “Enough with corn! From now on we worship the Kern God!”</p>
    <p><a href="https://web.archive.org/web/20080905043305/http://www.myfonts.com/fonts/sentinel/sibyl/">To commemorate the Children of the Kern this Halloween, I’ve slashed Sibyl Schwabacher to half price. <!--
