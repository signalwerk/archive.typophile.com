  html: <p> The following article appeared on April 2, 2002 in The Evening Post, published in Wellington, New Zealand, on the Money &amp; Business page. Special thanks to Ramsey Margolis for bringing it to our attention. <br> <br>OUR MAN OF LETTERS DRINKS FROM FOUNT <br>By Mathew Loh Ho-Sang <br>Business reporter <br> <br>A world-renowned Wellington commercial artist and fount designer is <br>rejoicing after clinching a deal that will see his art released digitally in <br>computers throughout the world. <br> <br>Hataitai resident Joseph Churchward, 69, whose fount design Wellingtonians <br>see every day when looking at The Evening Post masthead, says he is <br>"absolutely honoured" that a highly-regarded American-based design firm, <br>chank.com, has decided to resurrect his work. <br> <br>"I drew my first letters in the sands of my Samoan birthplace way back in <br>the 40s," Mr Churchward said. <br> <br>He went on in the 70s to become one of New Zealand's most successful fount <br>designers, with his work marketed globally by a German company. <br> <br>Now more than 30 years on -- after having had his career stall when he lost <br>his fortune following the 1987 sharemarket crash -- Mr Churchward is back <br>with as much enthusiasm for his art as ever. <br> <br>"In my time I have designed 300 alphabets, which I believe is the most done <br>by any living artist today," he said. <br> <br>"Therefore I am tremendously excited and absolutely honoured that chank.com <br>are treating me so well and have signed a deal with me to digitally release <br>my 300 alphabets in 20 separate volumes with 15 fount designs in each." <br> <br>Chank.com founder and chief executive, Minnesota-based Chank Diesel, said it <br>wasn't easy choosing 15 founts for the first volume "from a collection of <br>exquisite craftsmanship but we believe this initial release is a snapshot of <br>the innovation and diversity found in Mr Churchward's typography work". <br> <br>Mr Churchward is now busy designing new founts, some based on ancient Maori <br>and Samoan designs. <br> <br>"At the moment I'm busy on new designs and therefore by the time my 300 <br>previous designs are released there will be another 100 to add. <br> <br>"My design interests reflect New Zealand and my own rich heritage of <br>Chinese, Samoan, Scottish, English and Tongan ethnicity," Mr Churchward <br>saide. "It is very exciting getting my work back out to the world after so <br>long and I'm totally inspired." </p>
