    <p>Thought I’d upload the Hermann Zapf extra (it’s actually two clips combined, five minutes total). 39 more clips like this on the DVD.</p>
    <p>It’s a quick and dirty Quicktime encode, obviously the DVD version is big and beautiful. Look for the Nadine Chahine cameo as they work on Arabic Palatino.</p>
    <p><a href="https://web.archive.org/web/20080907033154/http://stream.qtv.apple.com/qtv/plexifilm/zapfextra_ref.mov" title="http://stream.qtv.apple.com/qtv/plexifilm/zapfextra_ref.mov">http://stream.qtv.apple.com/qtv/plexifilm/zapfextra_ref.mov</a></p>
    <p>Cheers,</p>
    <p>-Gary</p>
