  html: <p>My studio is designing a number of documents for a client. The client is exhibitng at a major trade show in Europe and would like each document in a number of European languages. They will be providing us with the translations from thier European offices and we will be applying the translated copy to our layouts. <br> <br>We are working with InDesign. Most of the translations will come back from Europe as MS Word docs. <br> <br>Languages involved will include German, French, Spanish, Italian and Irish (Gaelic?) <br> <br>My question(s) is what is the best option with regard to creating an accurate document. Specifically, do we need a copy of each language version of InDesign to successfuly import the word doc and retain the integrity of the copy? Or is there a translation plug in? <br> <br>Obvious issues would be special characters, ligatures ...etc. <br> <br>Thank you in advance for your help. <br> <br> </p>
  html_clean: <p>My studio is designing a number of documents for a client. The client is exhibitng at a major trade show in Europe and would like each document in a number of European languages. They will be providing us with the translations from thier European offices and we will be applying the translated copy to our layouts. <br> <br>We are working with InDesign. Most of the translations will come back from Europe as MS Word docs. <br> <br>Languages involved will include German, French, Spanish, Italian and Irish (Gaelic?) <br> <br>My question(s) is what is the best option with regard to creating an accurate document. Specifically, do we need a copy of each language version of InDesign to successfuly import the word doc and retain the integrity of the copy? Or is there a translation plug in? <br> <br>Obvious issues would be special characters, ligatures ...etc. <br> <br>Thank you in advance for your help. <br> <br> </p>
