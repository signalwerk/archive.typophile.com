    date_raw: 26 Jan 2004 — 9:49pm
    votes: null
    html: <p>ALl of those languages are covered under unicode, though Gaelige coverage is spotty.  Also, I'm pretty sure all of them, except Gaelige have dictionaries included in ID for hyphenation and such. <br> <br>Fonts shouldn't be a problem as long as they have the required accent characters.  Ligatures should sub fine if they're included in the font as well. <br> <br>The only languages I believe the normal version of InDesign has problems with are the Middle Eastern ones that go right to left, otherwise everything should work quite well. <br> <br>Cheers to Adobe for realising that people shouldn't have to pay through the nose for "passport" versions of ID.</p>
