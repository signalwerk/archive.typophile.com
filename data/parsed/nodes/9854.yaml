  html: <p>My assignment was to develop a label to be woven and a printed hangtag for men's faux fur jackets. Color and size are being used to convey a degree of edginess to a somewhat classic design and also to give the item hangar appeal against a ground of dark fur. I been searching for an old english type font that distinguishes the "K" as such and not be misread as an "R"...this is Schwabacher. Keep in mind that there is a need to keep it simple as the label will be woven.  <br>TIA for your critique and suggestions.  <br><img src="http://www.typophile.com/forums/messages/29/67746.jpg" alt="Kingdom"></p>
  html_clean: <p>My assignment was to develop a label to be woven and a printed hangtag for men's faux fur jackets. Color and size are being used to convey a degree of edginess to a somewhat classic design and also to give the item hangar appeal against a ground of dark fur. I been searching for an old english type font that distinguishes the "K" as such and not be misread as an "R"...this is Schwabacher. Keep in mind that there is a need to keep it simple as the label will be woven.  <br>TIA for your critique and suggestions.  <br><img src="http://www.typophile.com/forums/messages/29/67746.jpg" alt="Kingdom"></p>
