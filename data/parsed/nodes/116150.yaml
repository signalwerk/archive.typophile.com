    <p>Hello everybody!<br>
    I am in trouble with a three-typefaces combination.<br>
    I have a logotype set in Gill Sans and I need a Sans Serif (for titles) and Serif (for texts) combination to work well with it.<br>
    The logotype will often cohabit near type creating a trio that should be interesting. It also should be fresh and actual.</p>
    <p>Requirements for these two typefaces are:<br>
    - possibly designed by the same designer (not Eric Gill).<br>
    - in contrast with the Gill Sans logotype (maybe in x-height or other).</p>
    <p>Any suggestion?<br>
    Thank you very much for your help!</p>
