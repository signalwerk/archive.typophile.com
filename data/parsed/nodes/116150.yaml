    html: |-
      <p>The way you describe the logo, it sounds pretty generic.<br>
      You could use anything to go with it.<br>
      The proviso is that they should work together and the overall effect should suit the business.<br>
      You should trust your judgement and ﬁnd faces that you would like to work with, or ones that you have already worked with and are comfortable with.</p>
      <p>Do you have any ideas about the relationship between body and titling faces that you would like to explore? Presumably the body is U&amp;lc, but will the heads be regular or bold, U&amp;lc or all caps? And how much bigger than the body? What about subheads? Are you going for an open leading spec or tight? Narrow or wide columns? Ragged or justiﬁed? Why are separate faces required for heads and body? How will captions &amp;c. be handled?</p>
      <p>How is it possible to choose a typeface without taking these parameters into consideration?</p>
