    html: <p>I’d be most interested in a demonstration of contextual alternates — to show how OpenType can help mitigate the problems of handwritten and distressed types, i.e., the obviousness of repeating letters, as well as delivering unusual ligatures where appropriate. This had seemed to me to be a key aspect of TrueType GX that was never fully delivered. I guess that leads me to ask, is OpenType an evolution of TTGX?</p>
    html_clean: <p>I’d be most interested in a demonstration of contextual alternates — to show how OpenType can help mitigate the problems of handwritten and distressed types, i.e., the obviousness of repeating letters, as well as delivering unusual ligatures where appropriate. This had seemed to me to be a key aspect of TrueType GX that was never fully delivered. I guess that leads me to ask, is OpenType an evolution of TTGX?</p>
  - id: 197225
