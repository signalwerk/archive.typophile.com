  - id: 197235
    user: 1262
    date: 2007-04-16T16:19:00
    date_raw: 16.Apr.2007 4.19pm
    votes: null
    html: |-
      <p><em>I guess that leads me to ask, is OpenType an evolution of TTGX?</em></p>
      <p>More a case of tackling some of the same layout issues from a different perspective. The two models are very different — to the degree that there isn’t always an obvious path to reproduce the layout behaviour of one in terms of the other — but they both address advanced linguistic and typographic layout.</p>
      <p>At Apple, GX evolved into AAT.</p>
      <p>The other significant evolution from GX is SIL’s Grafite, which provides a cross-platform implementation based on the GX approach.</p>
    html_clean: |-
      <p><em>I guess that leads me to ask, is OpenType an evolution of TTGX?</em></p>
