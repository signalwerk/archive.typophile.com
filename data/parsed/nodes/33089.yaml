      <p>&gt;How about an outlined plan of attack for Opentype’s mission to obliterate Truetype and Type 1?</p>
      <p>May be more accurate to say that 18 years ago TrueType left his home in Cupertino, California and ten years ago hooked up with PostScript in Redmond, Washington. OpenType looks more like her father than her mother, but sadly her mother isn’t doing so well. On the bright side the family back in California has finally come to terms with the child, and has decided to fully support her. </p>
      <p>&gt;Anyone with me?</p>
      <p>Well, several years ago, when OpenType was announced, there were two or three theorists who claimed that OpenType was some kind of elaborate scam to force people to re-license their entire existing libraries in OpenType form.</p>
