    date: 2007-04-16T15:07:00
    date_raw: 16.Apr.2007 3.07pm
    votes: null
    html: <p>I’d like to see a simple table explaining what each Opentype feature actually does, and which applications make use of them. This need not extend to features not implemented anywhere. It would also be nice to see someone cover Opentype features that nobody ever notices or uses—assuming such things exist, anyway.</p>
