    <p>The project is a book about a Nepalese hospital. The intended audience is English speaking, 30-40-somethings, tourists or not. I've looked for types that might fit this sort of a project. I want to echo Devanagari and signpainting in the Latin letterforms somehow, but it's important for me to avoide the stereotypes. The books is based around a few short texts accompanied by images, spanning about 100 pages. I'm looking for a text face and a suitable companion for titles.</p>
    <p>My shortlist so far:</p>
    <p>Shabash<br>
    This might be too stereotypical, although I'm sure my client would buy into it. I've kept it on my list because it's such a quality design, and for reference.</p>
    <p>Lisboa Swash<br>
    Not sure if it's available, but the latin influcence is fluid enough to fit and some of the alts, like f.x. the y seems very fitting as sprinkle.</p>
    <p>Quadraat<br>
    The "errors" is what draws me to Quadraat in this case: the dropping R and the top heavy g reminds me of sign lettering. Other features, like B/R, a &amp;c mimicks rotation and pressure changes in a brush. Quadraat also has the qualities to fill both roles, being both decorative and calm.</p>
    <p>Novel<br>
    The rotation of the tool is also what draws me to Novel. This might be to understated for display, but obivously not for extended body copy.</p>
    <p>Meran<br>
    The abrubpt shapes, its angularity and the diagonal cuts echoes the Devangari script, as well as the implied reverse angle of the pen in descenders on g/y.</p>
    <p>Lydian<br>
    Similar to Meran in many ways, but feels more dated. I like the "clumpsyness". Somehow it feels like it was drawn really large. I like that it's not so subtle. The cursive is a plus here.</p>
    <p>I've also looked at ITF's Kohinoor, but the roman is too polished, too western. Devanagari is traditionally written with what we consider a reverse angle of the pen, so I've been looking into left handed type designers like Jim Rimmer, but I haven't found anything I like yet.</p>
    <p>So, do you have any suggestions?</p>
