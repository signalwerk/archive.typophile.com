    html: <p>If you don't want IE7 to use ClearType at all, you need to go to Tools|Internet Options|Advanced and uncheck the "Always use ClearType for HTML" box. Otherwise, IE7 will use ClearType for HTML content (but not the browser UI elements) even if you have ClearType turned off in your display properties.</p>
