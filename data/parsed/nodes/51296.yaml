    html: <p>Hey Ralf, just got to thinking. I know different browsers interpret attributes differently. There is no weight attribute in my stylesheet so I dont see why IE is interpreting it as bold as opposed to firefox as regular. That is why i thought the font was "slaughtered" because it renders in a entirely different weight. I'm not sure if this is appropriate to post in this forum, sorry if it is.</p>
