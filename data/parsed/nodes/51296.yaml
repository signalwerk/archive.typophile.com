    html: |-
      <p>*whimper* Microsoft and their half-hearted attempt at compliance or parity with their competitors leaves me as a designer heartbroken, lonely and sad.</p>
      <p>Microsoft in my opinion doesn't hit a lot of the targets even they set for themselves, which seems like poor-performance, even by their own measures, and using competitive measures they are behind the market, while also being the most costly, and also the most used.</p>
      <p>How does this happen?</p>
      <p>I wish that you could design websites with the same power and flexibility of PDFs (easily embedded fonts, dynamic, portable).  I don't mean using flash either.  I mean an entirely self-contained dynamic document format, and let RIA's use code and live out of the browser like Adobe AIR is trying.</p>
      <p>I think the web and the web applications need to separate ways, to both leave the browser and allow the designer/developer to have the utmost control, and not rely on another person's shoddy implementation of what 'ought to be'</p>
      <p>My only recommendation for you is, if you wish to maintain the highest order of parity between your site out of Internet Explorer and in IE, you need to manually account for the differences using a seperate IE-only CSS file, and only load that upon browser check.</p>
      <p>Thanks a lot Microsoft!</p>
