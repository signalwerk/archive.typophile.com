  - id: 467068
    user: 65389
    date: 2011-06-04T12:24:00
    date_raw: 4 Jun 2011 — 12:24pm
    votes: null
    html: <p>The script is a nice choice, but the font for photo is too stylized and competes with the title - try to find something to compliment and play 2nd fiddle better.  The ring is ok, but it doesn't seem essential, so maybe try doing something more subtle with it or even just let the nice script stand alone.  I think it (the script alone) speaks to the industry enough without the explicit inclusion of the ring.  Or maybe also try including a simplified version of the ring where it is, but not use it as part of the word photo.  I think icons as replacement letters tends to be corny anyway.  Hope that helps.</p>
