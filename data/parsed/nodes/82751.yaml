    html: |-
      <p>It's dated in but in a atomic-age way.</p>
      <p>I like the ring, but it may need some beefing up when rendered at the smaller size. The diamond on the bottom doesn't bother me.</p>
      <p>The tracking of P H O T O does, though. ;) Tighten that up. I realize the H and y might conflict. Perhaps make the H lower case to remove the right portion to leave room for the y's descender. Or...maybe allow the ring 'O' to be larger and then drop PH TO down a bit.</p>
