    <p>I've been asked by a client to add Combining Diacritical Marks, from the following table, to a font I'm designing.</p>
    <p><a href="http://unicode.org/charts/PDF/U0300.pdf" title="http://unicode.org/charts/PDF/U0300.pdf">http://unicode.org/charts/PDF/U0300.pdf</a></p>
    <p>I've never included these glyphs and I'm unsure how to design them.</p>
    <p>What are the Combining Diacritical Marks used for?</p>
    <p>On fonts I've looked at with Combining Diacritical Marks, they have no width and a negative left side bearing.</p>
    <p>Are the Combining Diacritical Marks positioned with Opentype code? - what code is used to position them?</p>
    <p>Any help or links to information to help me understand this would be greatly appreciated.</p>
