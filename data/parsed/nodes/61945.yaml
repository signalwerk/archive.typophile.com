    html: |-
      <p>You might like to read this FAQ from the Unicode Consortium: <a href="http://unicode.org/faq/char_combmark.html" title="http://unicode.org/faq/char_combmark.html">http://unicode.org/faq/char_combmark.html</a> .</p>
      <p>Linguists, depending on their specialization, often need combining diacritics to properly typeset their work.  Theunis de Jong mentioned the International Phonetic Alphabet, and John Hudson mentioned world languages (particularly non-European languages which use the Roman alphabet: think Africa and the Americas).  I personally use combining diacritics on an almost-daily basis, for IPA and to typeset Alaska Native languages.  One of the most frequent letters in Aleut is an x with a circumflex--there is no single Unicode character corresponding to this letter, as the above FAQ goes to great lengths to emphasize.  Iñupiaq has the letter l with stroke and dot below; it's a less-frequent letter, but just as you can't leave out the letter j in English, you can't leave out ł̣ in Iñupiaq; and you can't represent it in Unicode without a combining diacritic mark.</p>
      <p>Some resources:</p>
      <p>Charis SIL is not the world's most beautiful font, but it has excellent support for combining diacritics, including GPOS anchors: <a href="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=CharisSILFont" title="http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=CharisSILFont">http://scripts.sil.org/cms/scripts/page.php?site_id=nrsi&amp;id=CharisSILFont</a></p>
      <p>FontForge (<a href="http://fontforge.sourceforge.net/" title="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a>) has excellent support for adding GPOS anchors to a font.  If you'd like to use FontForge for this task (regardless of what program you used for the rest of the font development), I'd be happy to walk you through the process.</p>
