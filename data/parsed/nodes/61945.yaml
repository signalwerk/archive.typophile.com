    html: <p>Combining diacritic marks can be used to encode and, with appropriate font support, display arbitrary letter+diacritic mark combinations, including stacked diacritic marks on a single letter. There are very many languages in the world whose alphabets include diacritic letters that are not separately encoded in Unicode; for these, combining diacritic marks are essential for both encoding and display of text. How the resulting diacritics are displayed, when encoded in text as base letter + diacritic mark, depends on the font and the layout engine. In an OpenType font, you have a choice of either making precomposed glyphs for anticipated diacritic letter combinations (mapping these in GSUB lookups in the 'ccmp' feature) or using dynamic mark positioning (using GPOS mark-to-base and mark-to-mark anchor attachment lookups in the 'mark' and 'mkmk' features). The approach you take should be guided by your client's needs. If your client has a specific list of language support requirements with known diacritic combinations, and this set of not too large, then you might find the GSUB/ccmp approach easiest. You will be able to do this directly in FontLab. If the requirements are very extensive or open ended, i.e. they need to handle arbitrary combinations, then you'll need to use the GPOS solution. For this you will need to use either the MS VOLT tool or the new Adobe FDK or some other non-FontLab option.</p>
