      <p>An introduction to the subject could be my earlier posts re: using diacretics in InDesign: <a href="http://www.typophile.com/node/61330" title="http://www.typophile.com/node/61330">http://www.typophile.com/node/61330</a></p>
      <p>I never tried, but since the OT feature appears to work just fine in Notepad and Wordpad (the canonical Windows editors), I presume the features <em>would</em> work in other fully OT aware applications.</p>
      <p>Frode's using negative sidebearings is the most simple way of minimal support; of course, this does not work for any character, as the negative bearing is a fixed distance. If your target app has basic OTF support, you can substitute accents on regular characters for an accented composite glyph for at least a basic set.</p>
