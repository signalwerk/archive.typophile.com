    html: <p>With Opentype, these aren't needed, as there is enough room for glyphs. The few times I've used them I just type f.ex. “o” followed by “^” and use kerning to obtain the right position. There's no need for any sidebearings, but negative left sidebearing seems like good idea.</p>
