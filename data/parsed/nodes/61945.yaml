    html: |-
      <p>Almost forgot to answer your question :-D</p>
      <p><cite>Do I use Opentype programming to construct the glyphs in this table from a base glyph and the Combining Diacritical Marks? </cite></p>
      <p>I would normally just create these glyphs without Opentype programming.</p>
      <p>You can do both. If your font has an 'a', a combining acute (´), <em>and</em> an a-acute, the user can insert an 'á' right away if his keyboard allows it, or by using something like Insert Symbol (Word) or Glyph Panel (InDesign). If the user enters 'a' then 'acute', you can have opentype magic automatically replace it with the actual 'á' glyph. For accents on lowercase 'i', you can either have just the 'i' replaced with a dotless one, or immediately with the correct glyph-plus-accent.</p>
      <p>It has the advantage you can tell the user to always type the base character, then the accent. If the font contains a composite glyph, you can have opentype replace it; otherwise, leave it as it is.</p>
