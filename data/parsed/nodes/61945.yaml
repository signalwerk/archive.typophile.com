      <p>You found a font named Roman Unicode, which is made by Paul Alecsandri which does not support IPA Combining Diacritical Marks. You have to contact Paul Alecsandri (a.k.a. D. Paul Alecſandri) to get Combining Diacritical Marks in Roman Unicode.</p>
      <p>To fix Korean appearing as .notdef and change undefined glyph width:</p>
      <p>1) Add 2 glyphs after it.<br>
      2) Format, Post, Include Postscript, Generate Names.<br>
      3) Go to Settings, Ranges.<br>
      4) Check the Code Page ranges.</p>
