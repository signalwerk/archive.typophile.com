    html: |-
      <p>It depends on what your client wants to use the font for :-)</p>
      <p>There are a few lists that describe which accents are used where (it was mentioned recently somewhere in this forum).<br>
      For basic purposes, the basic latin set is enough, covering (from the top of my memory) English (using no diacritics except in a few loanwords), French, German (some dialects have orthographies of their own), Dutch, Italian, Spanish and all (or almost all) Scandinavian languages -- all from Western Europe.<br>
      Add a few carons, the l-stroke, e-underdot, and a few more, and you can add Eastern Europe languages (Polish, Czech) as well. Note that at this point on the map, Cyrillic comes into play.</p>
      <p>Then there are languages such as latinized Azeri (sp.?), which adds lower and upper case schwa, and latin based orthographies of African languages, with lower and upper case eng (as well as even more accents).<br>
      Vietnamese uses the Latin alphabet, but adds a unique accent: the horned 'u' and 'o', and lots and lots of stacked accents as well. That's where it is getting complicated: you can either create each of those characters, or you can rely on OTF aware applications to have the accents placed automatically.</p>
      <p>The practical problem is where to draw the line -- how many composite glyphs can you draw before cracking up? So the obvious advantage of including Combining Diacritical Marks is that your client at least has a shot of placing accents himself.</p>
      <p>My use of accents goes beyond the UC consortium wildest dreams: phonological (IPA) notation of any random vocal utterance requires any of the 100-odd basic diacritical marks above, below, and sometimes through any latin character, in any number of permutations, <em>plus</em> it needs a fair share of additional forms (<a class="freelinking external" href="http://unicode.org/charts/PDF/U0250.pdf)" rel="nofollow">the IPA basic set</a>) -- I wouldn't get very far with composite glyphs.</p>
