    <p>When I was younger, I used to draw typefaces and heavy metal logos in my school books and on my Amiga computer (using DeluxePaint). As an adult, I kept my passion for fonts, but I never took the time to learn to use font editing tools. But when Fontstruct came along, I decided to try to create my first TrueType typeface. </p>
    <p>The typeface is kind of constructivist and kind of eighties heavy metal-ish. I quite like some of the characters (especially the look of the word <em>kjekke</em> in the sample), but would like some advice on how I can improve the typeface and which characters need improvement.</p>
