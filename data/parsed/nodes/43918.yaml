      <p>When you get into the smaller sizes (which I imagine is somewhere around 24pt in the pdf), the A and R get a little difficult to tell apart, as well as the D and O. The rounded edges should perhaps have a larger radius. If you continue into thinner weights, the problem may resolve itself a little bit. Most of the letter without diagonals look sort of like a Bank gothic condensed, but I like the touches added to the ends of the F, J(#1), E, M (#2), and Q. I'm not sure of why on some characters, you decided to use round or sharp edges, like where it's round on the top of the F, bottom of E, but not round in the upper left corner of the P, or the 3. Something about the 2 is off. Maybe you could take a cue from the Z. The Four seems to be the only character with a rounded terminus, which seems out of character. I like the K and X alot.</p>
      <p>You may want to look at the following typefaces for inspiration:<br>
      <a href="http://www.fonts.com/findfonts/detail.htm?pid=205147" rel="nofollow">Woodblock</a><br>
      <a href="http://www.fonts.com/findfonts/detail.htm?pid=4338675&amp;grab_id=0&amp;page_id=4350&amp;query=delux&amp;SCOPE=Fonts7" rel="nofollow">Delux</a></p>
