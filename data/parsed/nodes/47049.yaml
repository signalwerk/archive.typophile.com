    <p>Hello,</p>
    <p>The last web edition of Before &amp; After had a nice layout using Bureau Grot Extra Compressed Black, a font that would work well with a current project. However, the going rate (5 fonts for $175) is a bit beyond my reach, and I can’t pass the cost along because the piece is pro bono. Is there a cheaper alternative for either the specified font or a viable alternative?</p>
    <p>Thanks.</p>
