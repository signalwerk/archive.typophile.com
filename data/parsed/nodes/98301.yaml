      <p>Not offhand.<br>
      I’ve seen it done occasionally.<br>
      By way of an experiment, I combined different optical sizes, and different weights, to see if I could achieve the effect (see below). It would take a lot of experimenting to come up with a satisfactory design for such a face, IMHO.<br>
      Would it be possible to write a script in InDesign which does this?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Thes_4646.png"></div><br>
      <em>Scotch Modern, Helvetica, Bodoni Egyptian.</em><p></p>
