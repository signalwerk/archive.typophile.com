  html: |-
    <p>Hello,<br>
    I'm currently designing a photography magazine geared towards women. I'm trying to finalize the typeface I'll use for the body copy and I'm looking for some advice before I commit to anything. Right now I have the copy set in Cochin 8.5pt. I'm set on using a serif and I love the look of this, but I'm a little concerned with the readability. I'm not averse to spending some money on a quality font that can be used throughout the magazine, I like the look of Mercury and even Sentinel (H&amp;FJ), but wanted to get some opinions before I purchase anything.</p>
    <p>As always, thanks for the help!<br>
    Sarah</p>
