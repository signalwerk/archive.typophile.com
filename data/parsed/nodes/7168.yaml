    html: <p>The logo on your site is the best version you have so far.  <br>I am guessing from your domain name that you are based in Italy. I am not sure what trends are popular in Italy these days (I am mostly familiar with 2 type designers work from there-Fabrizio Schiavi (FSD fonts), and Claudio Piccinini) but  <br>for some reason your work looks more Eastern European. I say this because I worked with a sign company from Romania for a couple of years, and the stretched type is very common there. Your work shown here is dated looking, it appears to be "new wave" 80's / early 90's looking. I do not known if this is intentional (as in "retro") but in my opinon it is not working at all. The type you have currrently on your site, although perhaps not refined, is  <br>superior to the stretched work show here. For critique <br>you have come to the right place, so stick with some of the advice and keep going. Start with concept, then fonts, then legibility, then refine concept, proportion.....</p>
    html_clean: <p>The logo on your site is the best version you have so far.  <br>I am guessing from your domain name that you are based in Italy. I am not sure what trends are popular in Italy these days (I am mostly familiar with 2 type designers work from there-Fabrizio Schiavi (FSD fonts), and Claudio Piccinini) but  <br>for some reason your work looks more Eastern European. I say this because I worked with a sign company from Romania for a couple of years, and the stretched type is very common there. Your work shown here is dated looking, it appears to be "new wave" 80's / early 90's looking. I do not known if this is intentional (as in "retro") but in my opinon it is not working at all. The type you have currrently on your site, although perhaps not refined, is  <br>superior to the stretched work show here. For critique <br>you have come to the right place, so stick with some of the advice and keep going. Start with concept, then fonts, then legibility, then refine concept, proportion.....</p>
