    html: "<p>Take the advice of the <a href=\"http://www.orangeitalic.com/luxury/\">Orange Italic boys</a> and stick closer to fashion convention for your type. Thus far, you're missing the mark. Although, I'm not sure I can recommend dropping $1500 for the Luxury collection specifically. <br> <br>Your versions in post 477 are better by far, but remind me of Crate &amp; Barrel and a 'modern' style that's not as contemporary anymore. Without more information than I have, I'd go with elegant and sophisticated, rather than fun or modernist. <br> <br>PS: Avoid the ampersand, otherwise you might get a call from a certain candy company...</p>"
