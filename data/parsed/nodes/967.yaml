    html: "<p>Tyler, <br>Thanks for the suggestions! I changed the \"a\" and the \"t\" and I'm happy with how they look. <br> <br>As for the \"round\" designation, I'm working on two versions of the face, one called round and the second, pointy. The difference being the shape of the serif-like shape on some of the characters.  <br> <br><!---Attachment: jelly_new.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">jelly_new.swf<br><a href=\"http://www.typophile.com/forums/messages/29/jelly_new.swf\"><b>jelly_new.swf</b></a> (4 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
