    html: <p> looks pretty interesting overall. the tight fit of several glyph combos is nice--"a-n" and "u-n", and the varying thickness of the horizontal stroke (tough to describe that) on the m and w add interest.  <br> <br>i do think that the a is too similar to the o. did you try an older style a--similar to rotating the e 180 degrees?  the crossbar on the t makes for an awkward space to the left of that glyph. perhaps make the short side on the left of the stem, and the longer side to the right. does that make it feel unbalanced?  <br> <br>i don't get the reasoning behind "round"... </p>
