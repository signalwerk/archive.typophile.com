      <p>Thank you for both suggestions. I know Oxide can be licensed, but I want to avoid having to buy it. </p>
      <p>Orbitron and Purista seem to be the best alternatives, but both have minor disadvantages. The regular weight would suit me best, but it's not available for both.</p>
