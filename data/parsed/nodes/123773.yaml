    <p>Hi,</p>
    <p>I'm looking for an alternative to FF Oxide, to use in a similar way as the main menu of <a class="freelinking external" href="http://www.wired.com" rel="nofollow">http://www.wired.com</a>. I have been trying Typekit's alternatives in different sizes, weights and letter-spacing; but I haven't found the right one yet.</p>
    <p>Thank you,<br>
    JL</p>
