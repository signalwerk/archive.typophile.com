    html: |-
      <p>Nothing really specific here, it could have been with any geometric sans with a single storey /a such as <a href="http://www.myfonts.com/search/futura" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Futura</a> (<a href="http://www.myfonts.com/fonts/bitstream/futura" title="Click to visit an external URL." class="freelink freelink-external freelink-external">BT version</a> has a wider /B) simply reworking vertical stems terminals.<br>
      Fot what it's worth, if I have to reproduce, I'd probably start with <a href="http://www.myfonts.com/search/avenir" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Avenira</a> recreating single storey /a from /q bowl, reworking terminals then slanting the whole thing.</p>
