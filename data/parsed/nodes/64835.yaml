      <p>&gt;So suppose I’m using a pen tilted at a 45 degree angle (so that the bottom leg of the K is thick and the top arm is thin)—in that case, A would be to the right of B, and the top of the bottom of the bowl would be to the right of the bottom, correct?</p>
      <p>That's what I think, yes.</p>
      <p>&gt;the pen thing is a bit fishy; the validity and relevance of this model really depends a lot on the philosophy of the font you’re making</p>
      <p>That's why I qualified the statement with 'If your glyphs have stress'. But of course it depends on whether your stress is chirographic (oh no, let's not get into <cite>that</cite>). </p>
      <p>Nina's right: play! Just see how different positioning affects the contours.</p>
      <p>&gt;Interesting that grotesques would have a different alignment than geometrics<br>
      I was speculating there. Geometrics are based on circles and rectangles; grotesques can afford more rhythm. </p>
      <p>I think the key is for straight-curved transitions to be as smooth as possible, which may mean taking the nodes inward toward the straight section, whilst keeping the bcps fixed. Or at least that's my experience.</p>
      <p>&gt;Might the order of the curves affect which alignment to use?<br>
      I don't know, but I doubt it. The order of the curves shouldn't have much to do with the position of nodes, just what happens between them.</p>
