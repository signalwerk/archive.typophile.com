      <p>Hm, the pen thing is a bit fishy; the validity and relevance of this model really depends a lot on the philosophy of the font you're making. And judging from that "P", this doesn't look like a very calligraphically-inspired font… So why imagine an imaginary pen making imaginary strokes and then emulate those with digital tools? ;-)  It should be a lot more interesting and beneficial, like you've already done, to look at more existing fonts and study how they deal with the relative node placement. And of course, play! Make variants, try different solutions, put them side by side.</p>
      <p>And I agree with Ben about using as few points as possible for as long as possible. Adding more points is actually more likely to make your curves *more* bumpy.<br>
      As far as I understand, it's only on rather exotic occurrences that you should consider using intermediate (non-extremum) points – but certainly not in a "normal" sans serif "P".</p>
      <p><cite>"I still have some difficulty with the outline of a stroke transitioning from a straight segment to a curve."</cite><br>
      What editor are you using? Knowing that would make it easier to give practical advice.</p>
