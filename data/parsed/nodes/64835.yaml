    html: <p>It doesn't really matter where and how you align the nodes as far as you are satisfied with relation between the outer and the inner curves. To avoid sudden jerks, sometime you need to add extra nodes, and sometime you need to remove. Since I don't see any diagonal stress in your letter P - I guess the current nodes alignment is fine.</p>
