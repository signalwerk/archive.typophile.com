      <p>The third attachment at top shows a plot of the curvature of the inner contour for the original P.  The plot starts at the top left corner and proceeds counterclockwise around the contour.  The plot shows curvature on the y axis and arc length on the x axis (units are em units).  The straight line segments have curvature zero, and the curves have positive curvature, indicating that they curve to the left.</p>
      <p>The point B is at about arc length 840.  Note that the curvature is continuous here; this occurs because the point B and the two off-curve control points are collinear.</p>
      <p>The curvature is continuous everywhere on the curve with one glaring exception: the rightmost point on the bowl.  I still need to fix that!</p>
