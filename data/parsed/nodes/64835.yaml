      <p>If your glyphs have stress, think about the angle of the pen that creates that stress. That will inform the angle between the inner and outer contours.</p>
      <p>You get different effects by moving the inner nodes in and out in relation to the outer bcp. It's not always very noticeable and the only way really is to try both ways and see how it looks. I think a geometric face would generally have the nodes aligned on a glyph like this, but as yours looks more neo-grotesque (wider), I'd try pulling the outer contour including the A point (and the corresponding one on the base of the bowl) inwards a little, towards the stem a few units.</p>
      <p>On a tangent, how about removing the intermediate points with the diagonal bcps?</p>
