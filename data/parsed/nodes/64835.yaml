      <p>bendy, thanks for your comments!</p>
      <p><cite>If your glyphs have stress, think about the angle of the pen that creates that stress. That will inform the angle between the inner and outer contours.</cite></p>
      <p>So suppose I'm using a pen tilted at a 45 degree angle (so that the bottom leg of the K is thick and the top arm is thin)--in that case, A would be to the right of B, and the top of the bottom of the bowl would be to the right of the bottom, correct?</p>
      <p><cite>as yours looks more neo-grotesque (wider), I’d try pulling the outer contour including the A point inwards a little, towards the stem a few units.</cite></p>
      <p>Interesting that grotesques would have a different alignment than geometrics!  I will try your suggestion and post the results tomorrow.  I looked at Arial (with quadratic curves) and the points are aligned as you suggest.  However, I also looked at URW Nimbus Sans (a Helvetica clone with cubic curves), and the inner points are closer to the stem.  Might the order of the curves affect which alignment to use?</p>
      <p><cite>how about removing the intermediate points with the diagonal bcps?</cite></p>
      <p>The intermediate points are there to ensure continuous curvature, particularly at the join from curved to straight.  I found that I could not get a smooth enough transition otherwise.  I'll try to post a plot of the curvature tomorrow that shows the smoothness.</p>
      <p>The issue of the alignment arose because I was considering how to get smooth transitions from straight to curved.  I think I now understand how to do that with an individual curve, but I still have some difficulty with the outline of a stroke transitioning from a straight segment to a curve.</p>
      <p>Best wishes, Stephen</p>
