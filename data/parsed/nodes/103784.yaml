  html: |-
    <p>I incorporated the typeface from an identity I did for a seminary into a magazine I'm designing. Now, I'm having second thoughts.</p>
    <p>Do you think Mackinac Book is challenging to read as body copy? If so, what are your thoughts on other typefaces that would maintain its feel and pair well with it and Gotham, the sans serif I'm using?</p>
    <p>I dislike mixing type too much, but what if I only replace the body, and keeping the pull quotes (Book Italic) and headers (Medium) in Mackinac? Can it work? Some of the slab serifs with the same high x height, low cap height and very rounded O's and almost work.</p>
    <p>My deepest gratitude to anyone who deigns to answer my query!</p>
    <p>- Martha</p>
