    html: |-
      <p>I just meant something maybe less conservative than Cheltenham. (Mackinac at 8 pt., it is the equivalent of Garamond at 10 pt.)</p>
      <p>I'm looking for a typeface that will be be in keeping, or play well with, the font in a logo—Mackinac Bold. I've used Mackinac Book as body in some ephemera for my client, but it wasn't until I saw it as a full page that I realized it's not great choice for a magazine. If I were reckless, I would have kept it. But surely there are other typefaces that have larger x-heights and would be legible. Clarendon, for instance, isn't bad, right? However, I always wish there were a step between regular and bold. I was just looking at Calluna. I doesn't have any of the softness of Mackinac, but would be an easy read. Or maybe I'm stressing the wrong quality, and the fuller body is more important?</p>
      <p>I've attached the logo for reference. </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/BexSea_logo_OL_FNL_5377.jpg"></div><p></p>
