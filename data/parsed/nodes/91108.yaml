    <p>Brand Perfect Tour is coming to San Francisco-  </p>
    <p>May 8, 2012 is the date for the sixth Brand Perfect Tour Think Tank and Design Master Classes, which brings together brands, agencies and developers in a unique forum to improve brand performance and the user experience in the digital landscape. </p>
    <p>Prior to the main event, on May 7, Brand Perfect speakers as well as high profile brands will meet to discuss implications on brands revealed from research carried out by London-based Contagious Communications. Attendees are then invited to stay for an exclusive screening of Doug Wilson’s “Linotype: The Film.” </p>
    <p>Both events will take place at the inspiring <a class="freelinking external" href="http://creativity.org/" rel="nofollow">Children’s Creativity Museum</a>, in the heart of San Francisco.</p>
    <p>In 2012, The Brand Perfect Tour will travel to key cities in Europe and America, gathering the branding community to examine the challenges of delivering brands in the complex multi-channel environment. The series of events entitled “In Search of… Seamless Brand Experiences,” will address the mobile, retail and publishing sectors, delving deep into the issues that these industries face when creating and developing their brands.</p>
    <p>The first event in San Francisco, “Adventures in Mobile,” sets the stage for communication and discovery that tackles mobile branding to deliver authentic, continuous experiences that delight consumers. Speakers, to be announced, will include technology and brand experts, who will share their successes along with their failures. Attendees will also gain hands-on insights into best practices, as they participate and contribute in the Brand Perfect Design Master Classes.</p>
    <p>Previously, The Brand Perfect Tour visited Berlin, London, Hamburg and New York, where capacity audiences heard from branding experts such as Wolff Olins, Landor, and SomeOne; brands such as NET-A-PORTER, O2 and The Financial Times; and service developers such as Fjord and Future Platforms. All provided real-life examples, while sharing what was learned when facing difficult branding challenges in today’s evolving mobile landscape.</p>
    <p>This year Contagious, a leading global authority on the intersection of marketing communications, consumer culture and emerging technologies, will be partnering with Brand Perfect to provide key depth and insights into branding trends for digital media.</p>
    <p>“Contagious has been called an early warning system for the advertising industry, so we’re delighted to be involved with Brand Perfect, which promotes education around branding innovation in the digital age,” said Ed White, senior writer at Contagious.</p>
    <p>To register, partner or speak, e-mail <a href="mailto:info@brandperfect-tour.com">info@brandperfect-tour.com</a>. Keep an eye out for full program details as they are announced on <a href="http://www.brandperfect-tour.com" title="www.brandperfect-tour.com">www.brandperfect-tour.com</a> or follow the Brand Perfect Tour on Twittter @brandperfect or <a href="/wiki/%20https%3A/%252Fwww.facebook.com/pages/Brand-Perfect-Tour/154873064574711" class="freelinking" rel="nofollow">Facebook</a>. Check out video highlights from Brand Perfect Tour London <a class="freelinking external" href="http://www.youtube.com/watch?v=hzxhHNQChaY&amp;feature=youtu.be&amp;a" rel="nofollow">here:</a>.</p>
