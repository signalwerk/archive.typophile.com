    html: |-
      <p>I actually hope I'm wrong, but:<br>
      We will see a boatload of fonts that follow the "go wild with<br>
      the styles" philosophy of deviating the Italic, Bold etc. from<br>
      the Roman (as seen in Alda and some of Yanone's work).</p>
      <p>I want to be wrong because -although there's some potential<br>
      glimmer of merit to this admittedly interesting idea- I have<br>
      to believe that it's going to be a backfiring gimmick almost<br>
      every time.</p>
      <p>There's a universe of fertile land (already being explored)<br>
      between 100% interpolation versus going full-on 90s again.</p>
      <p>hhp</p>
