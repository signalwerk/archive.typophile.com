    html: |-
      <p>I think that "women" fonts will overwhelm the market. When I said "women", I mean on letter shape - sweet, (half) handwritten, with a lot of extra glyphs, with a lot OT features, for weddings, curly, tatoo, sketch, girly, with swashes, organic (whatever that means), chick, flourish, perfume, party... faces! Also, from our angle - 70-80% buyers of our fonts in 2011 were women even we don't have an font that fits fully into "women" typeface description. Also, plus the trend that new foundries follow is to make an easy-to-do (I mean, easier then sans or serif families) faces.</p>
      <p>(I hope I didn't sounded like some fashion gay expert).</p>
