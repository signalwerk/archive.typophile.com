    <p>Hi guys!<br>
    After a lot of months working on a typeface I tried to export it. There are however some opentype features that doesn't work well in some software. </p>
    <p>Illustrator CS3 and InDesign CS3:<br>
    - Missing kern pairs<br>
    - small caps not working (small caps do work in InDesign CS3)<br>
    - superscript letters (this I don't know if I programed correctly. I've made for instance “a.sups”)</p>
    <p>If anyone could help me that would be great.<br>
    Thanks!</p>
