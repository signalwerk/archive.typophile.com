      <p>Are you using class kerning?  Are all the offending glyphs in their proper class? Is the left or right kerning check set properly?  Have you updated kerning from Kerning Assistance menu?</p>
      <p>From your picture, I can see that kerning n the left side of W and V is not working but it s on the right side.  Check tat check box on the V/W kerning class.</p>
