    html: <p>Mike,  <br> <br>No worries on copyright infringement, I run a design firm and I get it. I'm not looking to create a do-it-yourself Giants jersey. I'm just looking for a jumping off point for a client who likes the look but can't afford to have us hand letter their charity event logotype.  <br> <br>To better phrase the question, I'm looking for a decent script face that recalls some of the idiosyncracies of sports/baseball lettering. I've seen the stuff at Veer and Letterhead Fonts, but they just don't have the quality I'm looking for. <br> <br>Anyway, thanks for your post. </p>
    html_clean: <p>Mike,  <br> <br>No worries on copyright infringement, I run a design firm and I get it. I'm not looking to create a do-it-yourself Giants jersey. I'm just looking for a jumping off point for a client who likes the look but can't afford to have us hand letter their charity event logotype.  <br> <br>To better phrase the question, I'm looking for a decent script face that recalls some of the idiosyncracies of sports/baseball lettering. I've seen the stuff at Veer and Letterhead Fonts, but they just don't have the quality I'm looking for. <br> <br>Anyway, thanks for your post. </p>
