    html: <p>Chris, These sports logo questions come up a lot. We have talked about having an FAQ about them, I think, because these are almost always custom designs. Especially your major professional franchises. The logos are usually designed by the firms hired by the Leagues or the teams, unless they are based on historical team insignias (which were never fonts in the first place). The teams own the rights to these emblems, so duplicating them is almost the riskiest thing to do -- the higher profile your project has, the more likely you will get 'fanmail' from their lawyers. You didn't say why you wanted to know if there was a font like this, but if you love the teams, buy their gear. Play it safe, is my advice.</p>
