      <div class="comment-spam-body"><p>Nicolette Gray, in her book on 19th century ornamented typefaces, surmises that these fishtail serifs originated with the Greeks and that their use became common in Rome during the third century. Some of the best interpretations of this style were accomplished by Italian illuminators and engravers during the sixteenth and seventeenth centuries. Tuscany is a region of Italy.<br>
      Don</p>
      </div>
