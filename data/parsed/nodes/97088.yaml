      <p>For those who are unfamiliar with it, the Hungarian umlaut looks like a double acute accent.</p>
      <p>Not directly, no. Hungarian is a central European language whose particular accented letters are not supported in a "standard" single-byte Type 1 font.</p>
      <p>Ways to do it:</p>
      <p>- the accent is included in your base font, just not the combined letter plus accent. So if you don't have many occurrences of it, and your application supports manual kerning, you could enter the base character and the accent separately and use manual kerning to move the accent over the letter. Word's kerning controls are pretty crude, however, so this may not work very well.</p>
      <p>- see if there is a separate CE-encoded version of the Type 1 font. It would have a name like "Bembo CE" most likely.</p>
      <p>- see if there is an OpenType or TrueType version of the font that supports Hungarian (and likely other CE languages).</p>
      <p>Cheers,</p>
      <p>T</p>
