  html: |-
    <p>I'm using a Type1 Bembo in MS Word 2010 and I need to set the lower case "o" with Hungarian umlauts.  Can this be accomplished?  I have the Expert Set and the SmallCaps set, but neither of those contains the character I need.  </p>
    <p>Any help would be appreciated.</p>
    <p>Many thanks,<br>
    Tom</p>
