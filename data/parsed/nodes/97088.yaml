      <p>I thought I'd check character availability, and I found that in the version of Bembo from Monotype Imaging, at least in the Volume 1 product, those desired characters are indeed absent.</p>
      <p><a class="freelinking external" href="http://www.fonts.com/font/monotype-imaging/bembo/1-volume" rel="nofollow">http://www.fonts.com/font/monotype-imaging/bembo/1-volume</a></p>
      <p>and proceed to the character map, then select the appropriate Unicode range.</p>
      <p>And, I'm sad to say, <a class="freelinking external" href="http://www.myfonts.com/fonts/bitstream/aldine-401/aldine-401/glyphs.html" rel="nofollow">Aldine 401</a> doesn't have them either.</p>
