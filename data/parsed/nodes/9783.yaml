    html: '<p>Univers has two different ampersands, a conventional one and an alternate one that looks like an Et ligature. Not all digitizations of the font have the alternate one. You can see it <a href="http://www.myfonts.com/fonts/linotype/ltunivers/430-basic-reg/charmap.html" target="_blank">here</a>.  <br> <br>Historical footnote: The alternate ampersand was the original. The conventional one was added later.</p>'
    html_clean: '<p>Univers has two different ampersands, a conventional one and an alternate one that looks like an Et ligature. Not all digitizations of the font have the alternate one. You can see it <a href="http://www.myfonts.com/fonts/linotype/ltunivers/430-basic-reg/charmap.html" target="_blank" class="link-external">here</a>.  <br> <br>Historical footnote: The alternate ampersand was the original. The conventional one was added later.</p>'
  - id: 62454
