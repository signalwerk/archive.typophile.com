    date: null
    date_raw: null
    votes: null
    html: <p>Aside from those two Linotype fonts, Bitstream's Univers clone <a href="http://www.myfonts.com/fonts/bitstream/zurich/light/testdrive.html?s=%26&amp;p=48" target="_blank">Zurich</a> seems to be the only version with the original ampersand.  <br> <br>(I don't understand why they still call it Zurich. They made a licensing arrangement with Linotype to use the Linotype names about a year ago.)</p>
