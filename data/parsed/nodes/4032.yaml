  - id: 141868
    user: 1203
    date: 2004-03-31T09:49:00
    date_raw: 31 Mar 2004 — 9:49am
    votes: null
    html: "<p>Using the ae ligature is considered somewhat archaic in U.S. English -- in fact, American usage has dropped the leading a in most instances. (For example: encyclopaedia vs. encyclopedia.) <br> <br>Although British style retains both letters in most instances, I do not know whether they commonly use the ligature or not. I suspect it is not necessarily improper to use it, but it may look quaint/mannered/overly formal.</p>"
  - id: 141869
    user: 1203
    date: 2004-03-31T10:00:00
    date_raw: 31 Mar 2004 — 10:00am
    votes: null
    html: <p>Moreover, I believe the &amp;aelig; ligature is only properly used in English for words derived from Latin that contain the specific ae dipthong in question, not any random occurrence of the a-e letter sequence.</p>
  - id: 141870
    user: 1203
    date: 2004-04-19T18:41:00
    date_raw: 19 Apr 2004 — 6:41pm
    votes: null
    html: "<p>In Norwegian and Danish, &amp;ldquo;&amp;aelig;&amp;rdquo; is not a ligature of &amp;ldquo;a&amp;rdquo; and &amp;ldquo;e&amp;rdquo;, but an independent letter, representing the vowel sound in English &amp;ldquo;hat&amp;rdquo;. Using &amp;ldquo;ae&amp;rdquo; as a substitute for &amp;ldquo;aelig;&amp;rdquo; in Norwegian and Danish would be akin to using &amp;ldquo;vv&amp;rdquo; as a substitute for &amp;ldquo;w&amp;rdquo; in English&amp;mdash;comprehensible, but jarring. <br> <br>Regarding &amp;ldquo;et cetera&amp;rdquo; vs &amp;ldquo;et caetera&amp;rdquo;: either is acceptable, but the former is found more frequently than the latter, at least in English language contexts. <br> <br>I believe that &amp;ldquo;&amp;aelig;&amp;rdquo; and &amp;ldquo;&amp;oelig;&amp;rdquo; usage in (post-Anglo-Saxon) English had been preferred for words ultimately of Greek origin that were spelled with alpha-iota and omicron-iota respectively. As the Latin word &amp;ldquo;c(a)eterus&amp;rdquo; [for which &amp;ldquo;c(a)etera&amp;rdquo; is likely the feminine ablative] is not of Greek origin, it probably shouldn&amp;lsquo;t be spelled with &amp;aelig;.</p>"
