    html: "<p>Thanks for your comments, they came in very handy. <br> <br>The font is based on a piece of music that combines jungle (drum&amp;bass) and ragga mc-ing (dancehall reggae). Ragga represented by the almost tribal form of the beehive double pentagon form, and jungle represented by the electronic clock way of forming letters in it.. <br> <br>I might end up using it one time for a vynil cover or some stickers or something. Somewhere where legibility isn't that much of an issue :-) <br> <br>I worked on some alternates for the glyphs you mentioned: <br> <br>Using the whole pentagon for the A sort of ruins the overall look, but I think the changed R might be enough to distinguish the two. <br> <br><img src=\"https://web.archive.org/web/20141113140336im_/http://www.typophile.com/forums/messages/29/18847.gif\" alt=\"\"></p>"
    html_clean: "<p>Thanks for your comments, they came in very handy. <br> <br>The font is based on a piece of music that combines jungle (drum&amp;bass) and ragga mc-ing (dancehall reggae). Ragga represented by the almost tribal form of the beehive double pentagon form, and jungle represented by the electronic clock way of forming letters in it.. <br> <br>I might end up using it one time for a vynil cover or some stickers or something. Somewhere where legibility isn't that much of an issue :-) <br> <br>I worked on some alternates for the glyphs you mentioned: <br> <br>Using the whole pentagon for the A sort of ruins the overall look, but I think the changed R might be enough to distinguish the two. <br> <br><img src=\"https://web.archive.org/web/20141113140336im_/http://www.typophile.com/forums/messages/29/18847.gif\" alt=\"\"></p>"
