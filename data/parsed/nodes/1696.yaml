    html: <p>Hi Jonathan <br> <br>Your G looks like a 9 and you really have some <br>confusing glyphs like Y/Q. Maybe you should try  <br>using the whole pentagon for the A, like you did <br>in U/W. And I really like your Z. <br> <br>I would cut the stroke in the upper pentagon <br>stroke of your W too. <br> <br>Where are you planning to use this font  <br>anyway? Just curious... <img src="https://web.archive.org/web/20141113140336im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>hC</p>
