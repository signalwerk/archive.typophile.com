    html: <p>Yeah, the whole pentagon A doesn't look nice at  <br>all. The G is getting better. <br> <br>I think the center Y is the best one, but maybe <br>you could try replacing its upper pentagon with <br>the 4th one. That terminal somehow helps <br>me identifying the glyph. <br> <br>I really would like to see this font in use <img src="https://web.archive.org/web/20141113140336im_/http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
