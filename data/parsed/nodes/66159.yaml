      <p>The point is I wouldn't use paths. It's hard to think in other terms (not least because we've been indoctrinated on skeletons since birth - see below) but we really need to think in terms of the border between the black and white, the interaction between not only the blacks in a setting but the whites too. This is what Legato does, and/but -so far- it's the only one.</p>
      <p>Since this topic is [supposed to be] about children, let me give an example of how we're brainwashed into thinking of letters in terms of skeletons from the very beginning. Look at this thing done by my 3-year-old in pre-school:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gorgim_4785.jpg"></div><p></p>
      <p>It's the third letter of the Armenian alphabet. Now, a kid that age isn't good enough to draw a nice letter fluidly (at least not good enough for his parent to want to show it off :-) so look what they've done: they drew a circle and a couple of lines and told the kids to stamp along the skeleton. This isn't really [necessarily] a "moving front" thing, but the very least I can claim is it's reducing the chances that these kids are going to make the kinds of fonts I think we need.  :-)</p>
      <p>hhp</p>
