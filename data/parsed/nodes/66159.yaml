      <p><cite>"We are able to recognize glyphs in vastly different styles to be representing the same character thanks to their shared structure."</cite></p>
      <p>But «shared structure» doesn't have to imply they're all just different coverings on the same basic scaffolding, or skeleton.<br>
      Although I can't claim I understand how we recognize letters when reading, it does seem plausible to doubt the idea that when we read, we somehow, internally, «extract» (or abstract) monolinear «skeletons» from whatever glyphs we're presented with, discarding serifs and contrast, and all that at breakneck speed. Maybe it's more helpful (more flexible) to think not of a shared <em>linear</em> structure, but as a shared distribution/pattern of <em>black and white areas</em> that is necessary to recognize a character?</p>
