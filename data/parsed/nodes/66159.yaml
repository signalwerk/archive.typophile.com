      <p>Craig, that was perhaps a bit presumptuous on my part to make such conclusions on the intentions of whoever introduced stroke contrast. It's just that I think style is more visible than good readability ("Hmm, that looks more stylish" seems more likely than "Hmm, that is easier to read"). But maybe I'm denying our forebearers credit unjustly here. We're certainly not the first generation to question how to serve the reader more.</p>
      <p>William, the reverse contrast (which you also see to some degree in letters like "a" and "e") doesn't bother me as much, maybe because I'm used to the stroke contrast model of the Korean alphabet and Chinese characters. These certainly don't have reverse contrast, but they can have lots of parallel horizontal strokes, and a common solution is to make the outer strokes slightly heavier; it's easier to see that applying this principle to the Latin lower case letters having some crowded horizontal strokes will yield heavy top and bottom strokes.</p>
