      <p>I think the best typefaces for children would be what they're already used to – sounds circular but it's not really. Any faces with unusual treatments of letters, like Ambroise's <strong>g</strong> I'd stay away from. Children's brains are built to understand that different instances of the same thing are the same thing. If the child's parents speak with different dialects, they don't have problems understanding both equally well. But if someone speaking a radically different dialect tries communicating, the kid might get confused because they haven't set up the sound-equivalences in their brains yet. Similarly with type (I would think), they learn very quickly that single-storey <strong>a</strong> and two-storey <strong>a</strong> are the same thing, but might not recognise Galliard Italic's <strong><em>g</em></strong>. Sans vs serif? My guess would be any comprehension differences would be minimal and could be without significance difference.</p>
      <p>I'd say pick something that looks nice with your book and make it fun.</p>
