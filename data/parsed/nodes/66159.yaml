      <p>&gt; the idea is that the brain reduces the words (or any object to be<br>
      &gt; recognized) into simple components whose spatial arrangement<br>
      &gt; is the key to its recognition.</p>
      <p>Sure. But that's not how chirography works - it uses the idea of a "moving front", and the movement goes along a path. THAT is where the problems start, and that's what I want to limit.</p>
      <p>&gt; until most of humanity is ready to give up writing by<br>
      &gt; hand forever, I would be hesitant to sever that link.</p>
      <p>Actually it's not about completely shunning it. It's about limiting it, but far more than what we've seen in type design so far. Most people don't even see there's a problem, so they can't be part of the solution (that being not some utopia, but merely improvement).</p>
      <p>We cannot improve any more along this path - we're stuck in a rut.</p>
      <p>&gt; In cultures where people still produce by hand texts that<br>
      &gt; are meant to be read, I think there is a bit more room for<br>
      &gt; innovation and individual expression.</p>
      <p>When it comes to innovation: I think the opposite. When it comes to expression: I think that's selfish artistry; typefaces can express things in a subtle, controlled way that benefits others. Writing by hand is self-centered.</p>
      <p>hhp</p>
