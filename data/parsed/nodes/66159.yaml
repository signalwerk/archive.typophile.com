      <p>We don't read skeletons; and we read much much more than we write. So I think we need to at the very least instill a fruitful doubt into children concerning the [un]suitability of skeleton-based lettermaking in current, and most certainly future, society.</p>
      <p>This is not to say people shouldn't make things by hand - not at all. I think that's wonderful, and a central part of being human. But only if there's a good reason to, and letters no longer qualify, at least not letters that are meant to be read.</p>
