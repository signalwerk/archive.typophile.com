      <p>Even more, I get a calligraphic feel from Legato (Hrant is going to furiously raise his eyebrows at this). It's certainly not calligraphic in the way the strokes are formed; the strokes emerge from the simultaneous design of the black and the white, not from expansion along a path. Rather, it's because Legato has a gentle but noticeable contrast in the strokes that depends on the angle. You can see that Legato's "O" is thinnest around 5 o' clock and 11 o' clock.</p>
      <p>This sort of stroke modulation owes much to calligraphy, especially with the broad nib. At the risk of broad simplification, I think this enhances readability by adding more visual cues that distinguish differently-angled strokes than just the angles themselves.</p>
      <p>Legato's "O" warrants another look, as it is not the vertically symmetric shape found in many sans designs but is gently inclined, much like a handwritten "O". The curves in Legato generally stay away from the simple and symmetric shapes favoured by rationalists. This is good for readability because it means more cues for distinguishing different letters. If "humanist sans serif" is a term that is set in opposition to the constructed shapes of geometrics and grotesques, then Legato out-humanists the humanist sans designs that are more explicitly based on calligraphy, being constrained by neither simple geometry nor the devotion to shapes that can be produced by hand.</p>
      <p>So Legato's strengths, I would say, are in taking from the good from handwriting without actually being constrained to make something looking like handwriting.</p>
      <p>Of course, these aspects of handwriting that aid in readability developed mostly accidentally and subconsciously. A handwritten "O" is inclined because it is easier to write, due to handedness or whatever, not primarily because it is easier to read. Also, people must have liked the shapes produced by writing utensils that give stroke contrast for reasons of style, not readability (at least not consciously). Indeed, I think extreme contrast may hurt readability, but it is often pursued for stylistic reasons.</p>
      <p>But handwriting is much faster than designing type, and it gives room for great variety and experimentation. Through repeated practice, people can learn how to correct for optical illusions and give even texture while still making easily distinguishable shapes. Also, because they are not constrained to a limited glyph set, they can automatically adjust shapes to prevent clashes.</p>
      <p>So I still think a thorough familiarity with handwriting and making letters by hand is beneficial to type design. As long as you don't think of type as something to reproduce the shapes made by hand but as a medium to free you from those constraints (admittedly quite tricky), your experience and ideas shaped by making letters by hand should be helpful.</p>
