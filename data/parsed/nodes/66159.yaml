      <p>I might be thinking of skeleton in a broader sense than you (Nina, Hrant) understand.</p>
      <p>As Nina implies, reading happens at such a basic level that it's beyond our ability to understand simply by reflection. Object recognition—character recognition included—mostly does not involve higher cognitive processes, but it's certainly a complex process that we have trouble replicating with machines (hence the existence of captchas). It's not clear which features are extracted from the visual inputs, and it seems that several modes may be in operation (a primary mode picks up simple, familiar inputs and a secondary mode distinguishes the details not picked up by the first one). But for me, intuitively, the idea is that the brain reduces the words (or any object to be recognized) into simple components whose spatial arrangement is the key to its recognition. There are multiple levels at work here, of course, and things like serifs and areas of contrast present visual cues that enhance recognition. These cues are of course really important. But I think they work in service to the primary mode of recognition, which is based on the spatial arrangement of the basic shapes (like the idea that the letter "D" consists of a straight vertical line segment and a curved segment attached to its right), which is what I'm really thinking of as the skeleton.</p>
      <p>A skeleton of a "D", absent all other cues, would still be recognizable as a "D". You can have all the components (the serifs, the contrast, etc.) that make a typographically successful "D" but if they are not put together according to the skeleton (the particular configuration of shapes) of a "D", no one will recognize it as one. So the skeleton is an essential part of a letter's identity, and as I think of it, is more abstract than merely the path traced by someone with a marking utensil to produce a letter.</p>
      <p>I have to admit that it's really difficult to verbalize and explain what I'm thinking, and it's hard to see where it is that we actually disagree!</p>
      <p>Hrant, until most of humanity is ready to give up writing by hand forever, I would be hesitant to sever that link. Type design is accessible only to a tiny minority, and the technology is more likely to have a dumbing-down effect and stifle innovation. In cultures where people still produce by hand texts that are meant to be read, I think there is a bit more room for innovation and individual expression. But here, I'm thinking more of scripts like Arabic than Latin.</p>
      <p>(Either Brian and Jongseong is fine. They both are my given names; I just chose Jongseong as my ID because it would be less likely to be a duplicate ID. Perhaps Jongseong will be less confusing for casual readers who don't check the profile pages.)</p>
