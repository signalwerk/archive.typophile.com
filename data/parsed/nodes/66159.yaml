      <p>Michael, first of all: the balanced tone is noted, appreciated and useful.<br>
      And most of all, it helps me stay cool on my end!</p>
      <p>It's highly commendable and fruitful for somebody chirographically inclined to note the importance of the White and take steps to account for it; this is something many people who disagree with my conclusions have cited, and I believe them. I also have to nonetheless believe that the qualitative limitation remains - that as long as you're "painting" the black you cannot really treat the White equally. No matter how you twist and turn while marking the Black, it can't be as ideal as marking their border.</p>
      <p>A fitting parallel I like to draw is the relationship of Thomas Jefferson and Sally Hemings, his slave. No matter how much he loved her, the fact that she remained his slave limited the relationship greatly.</p>
      <p>&gt; As a lettering artist my eyes perceive a clunkiness in the bolder weights.</p>
      <p>I propose that this is an aesthetic preference, formed by many years of attentive chirography. I might go further and say that even a "regular" person who hasn't paid much attention to how he makes his letters will feel that awkwardness. The important thing to remember however is that Legato is a text face (to me at least) which means conscious evaluation of large settings is beside the point, and its breaking of the Black is what gives it a presumed (and I feel probable) superiority in text.</p>
      <p>&gt; This is what was done by Donald Knuth in "Metafonts,"</p>
      <p>Inspired, quite tellingly, by the work of Zapf, a prominent chirographic designer. But no matter how much they tried, they couldn't get "stroke" fonts to look good.</p>
      <p>What I put forth is that the thing that makes Knuth's fonts fail is present to at least some extent in <em>any</em> chirographic typeface.</p>
      <p>hhp</p>
