      <p>Michael, by "skeleton" I mean the paths* that a person making a letter follows* with a marking tool* to make positive shapes on a negative background. The essential problem being that this goes against reading. And the problem still exists -if diluted- even if a designer only thinks of this as a starting point and modifies the results (which is certainly common practice).</p>
      <p>* This could be real or virtual.</p>
      <p>Brian*, simply put, it seems to me that making letters -and thinking about letters- as augmented skeletons is a convenience that is now at the limits of paying for itself. The more time passes, the more harm we'll be doing by engaging in this ideological lethargy. Concerning type design, I really can't see how it's beneficial anymore, and I <em>can</em> see how it's harmful.</p>
      <p>* BTW, do you prefer Jongseong?</p>
      <p>hhp</p>
