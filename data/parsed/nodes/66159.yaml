      <p>Michael, I'm not sure what Hrant means, but I would agree this much: the idea of a center line that you expand around for different weights of a design doesn't work very well. This is what was done by Donald Knuth in "Metafonts," and the verdict seems to be that it didn't work. If I remember rightly, Frutiger makes that case, with illustrations, also in the new big book of his work. </p>
      <p>We do recognize characters by something like topology. Whether a counter is closed or open makes a difference. Whether a line is round or has a corner is sometimes important also, like D vs O. But similar topology (I know I'm not using it in quite the right way mathematically) isn't the same as having a skeleton template in our heads. </p>
