      <p>Hrant, I am to this day confused about your position against skeleton-based lettermaking. As a guideline for type design, it makes ample sense. It's perfectly clear that type designers should be designing the inner and outer outlines, not some imaginary skeleton. But this should be all behind the scenes stuff, in service of the reader. When you talk about the need to instil doubt into children about skeleton-based lettermaking, you lose me. Nor is it clear to me that children are going to develop different opinions about letter-making just because they are brought up reading Legato instead of Helvetica.</p>
      <p>Skeleton-based thinking may be detrimental to good type design, but skeletons play a crucial part in how we perceive forms such as letters. We are able to recognize glyphs in vastly different styles to be representing the same character thanks to their shared structure. So lay people are perfectly justified in thinking of letters in terms of skeletons. They do not have to understand what makes the type they read successful, any more than they have to understand the theory of jet propulsion and lift to enjoy air travel.</p>
      <p>Also, I am not ready to give up writing by hand. I've come to realize that many people hardly ever write with their own hand for anyone else to read, and only ever read type. But I am not convinced that we should forcibly be removing the connection between the forms we make by hand and the forms that we read. And I am certainly not convinced that we should not be writing letters by hand that are meant to be read.</p>
      <p>Indeed, for the moment, access to type technology is limited for certain cultures, and the standards of typography aren't advanced enough for certain writing systems for type to supplant handwriting. I understand Hrant's desire for progress, but be careful with pushing type too fast; limitations of technology have often forced simplifications on writing systems in the past (elimination of ligatures, conjuncts, contextual variations), whether desirable or not. For many writing systems, type is still playing catch-up to handwriting when it comes to beauty and readability.</p>
