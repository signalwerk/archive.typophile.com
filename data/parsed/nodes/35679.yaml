    <p><a href="http://typophile.bigcartel.com" title="Typophile Buttons"><img src="http://farm2.static.flickr.com/1230/956953273_0b4d3c9359.jpg" width="500" height="258" alt="Found type / found ephemera buttons"></a><br></p>
    <p>Typophile is a member supported community. Your contribution, in exchange for the membership item(s) you select, provides financial support to keep Typophile thriving. This allows us to avoid the overhead of subscriptions or membership dues.</p>
    <!-- break --><!-- break --><p>
    We also think the stuff will fit neatly into your typo-centric lifestyle. </p>
    <p>We're pleased to announce a storefront (still in pre-gussied-up CSS, but still very usable) to make the new 2007 "Type Specimen" tee and new found ephemera buttons available. We will also make available the remaining stock of past year's shirts where we have stock available.</p>
    <p>Even if the items aren't your thing, we invite you to contribute in any way you feel appropriate.</p>
    <p><strong><a href="http://typophile.bigcartel.com/">Typophile Merchandise</a></strong></p>
