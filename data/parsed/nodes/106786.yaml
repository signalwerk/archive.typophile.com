  html: |-
    <p>Hola a todos. </p>
    <p>Estoy indagando si conocen de alguna herramienta o plugín o si existe un comando para OpenType que permita hacer variaciones aleatorias de la posición de los glifos sobre su línea de base, algo que se asemeje como si las letras brincaran y que pueda manipularse de manera aleatoria.</p>
    <p>Esto, con el fin de aplicarlo a una fuente de display que estoy desarrollando.</p>
    <p>Agradezco cualquier información o ayuda. Saludos</p>
    <p>JVB</p>
