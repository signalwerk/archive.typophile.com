    </tr></tbody></table><hr noshade="noshade" size="0"><p> Thanks. <br><br>It’s too bad that Jared started this thread. Now, when I hear a name, I think in pangrams. <br><br>They are ﬁtting me for a straightjacket as I speak. <br><br><br>I went to Subway® for lunch and pitchman Jared (diﬀerent Jared) was all over. So I looked at his name and said, Hey, he’s a pangram All-Star. <br><br><span class="caps">JRDFRMSBWY</span> <br><br><br>Typophiles <span class="caps">RXC</span> and <span class="caps">JARED</span> <span class="caps">FROM</span> <span class="caps">SUBWAY</span>® <br><span class="caps">QUIVER</span> in Keg-zone <br><br><br>That one doesn’t make too much sense. In the interest of fun and the wasting of precious time, please submit some Jared from Subway® pangrams. <br><br><img src="../../clipart/happy.gif" alt=":)"><br><br>bj </p></font></td>
