    html: |-
      <p>Both of these are hand-drawn artwork, as far as I can tell. You'd be better drawing this yourself, because it's hard to find fonts with this spontaneous feel. The tagline reminds me of Alan Denney's lettering that Harold Lohner has digitized, especially <a href="http://www.fontbros.com/cgi-bin/commerce.cgi?preadd=action&amp;key=HAFO-DENT" rel="nofollow">Denney Two</a>. You would need to add the smudge effect.</p>
      <p>- Mike Yanega</p>
