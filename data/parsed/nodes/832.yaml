  html: "<p>Disclaimer: This is my first attempt at letter design outside scribbles in my notebooks, and it's my first serious attempt at using beziers. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13794.gif\" alt=\"ch monogram\"> <br> <br>I decided to go with an uncial based on this idea I sketched. The original concept was that it'd look like a heart (<i>Hart</i>nett, get it? I'm clever), but now I think it looks more like an apple or a leaf fleuron. <br> <br>I really want to know how I'm doing on the visual-technical things like stroke widths, stroke consistency, optical symmetry, etc.</p>"
  html_clean: "<p>Disclaimer: This is my first attempt at letter design outside scribbles in my notebooks, and it's my first serious attempt at using beziers. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/13794.gif\" alt=\"ch monogram\"> <br> <br>I decided to go with an uncial based on this idea I sketched. The original concept was that it'd look like a heart (<i>Hart</i>nett, get it? I'm clever), but now I think it looks more like an apple or a leaf fleuron. <br> <br>I really want to know how I'm doing on the visual-technical things like stroke widths, stroke consistency, optical symmetry, etc.</p>"
