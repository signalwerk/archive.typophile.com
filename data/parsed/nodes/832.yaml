    html: <p>Colin, what Chris did was offer you a sketch.  Sure he probably drew it in illustrator and made it look nice, but it's still no different than a rough sketch made on paper. <br> <br>So he didn't just write down a few ideas, big deal, it probably wouldn't've been very easy to explain, so he did the next best thing. <br> <br>The original idea, the one Chris' version is based on is still yours.  For what he did to make you feel like crap is, IMO, a stupid response.  You can still choose to incorporate his ideas or disregard them because all he gave you was a sketch.  A well rendered sketch, but a sketch nonetheless. <br> <br>I can only speak for myself, but I believe the reason that Tiffany and I like it was because it is still taking the spirit of the original design while giving it a new direction, something that hasn't really been done yet.  Every sample so far has looked almost exactly the same with just simple changes, whereas Chris' changes were radical compared to the design as a whole yet still keeping the same spirit. <br> <br>Chris was making his suggestion just like everyone else, only his was visual and not written.  If you don't want suggestions, no matter how they're made or what their content, you should not ask for help. <br> <br>You can still do the design yourself.  What Chris gave you is input on possible ways to execute it.  He only "did it for you" if you decide to use his version lock, stock, and barrel. <br> <br>I'm sorry for the confusion, I thought tiffany had submitted ideas, my error. <br> <br>And for the record, yes, my teachers have said they didn't like my stuff and have given me completely new ideas.  I usually just ignored them and did my own thing anyway.</p>
