    html: <p>And don't forget the best design is a usually a group effort. <br> <br>I understand taking a lot of ownership in something, working hard at it, really coming up with something and then fealing a little defeated in the end with the Art Director tweaks a few things and, when all said and done, *does* improve the final piece. <br> <br>But realize that's what art directors (and design colleagues) do. I think you could take any logo posted in here Colin and honestly and proudly say it is yours. You came up with the concept, you slaved over it, and, as always, a few outside perspectives were able to tweak it a bit and 'take it over the top'. <br> <br>The best design firm I ever worked in was one where EVERYTHING was group design. In the end, it made for easier, faster work, less egos, and ultimately, happier clients and designers. <br> <br>So, I guess I'd say beggers shouldn't be choosers. When you post in a forum for a critique, expect anything and everything. Consider anything posted as voluteered food for thought. Digest what you want, spit out the rest, and don't dwell on it too much. ;o) <br> <br>And, nice monogram! <br> <br></p>
