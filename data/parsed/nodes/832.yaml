    html: <p>Totally different. What would you do if you were in a design crit and your prof. said, "I don't like that. I have an idea. Give it to me and I'll do it for you." It's okay to give verbal descriptions or even sketches to illustrate, but to fully execute the idea kind of crosses the line between teaching and doing. To be honest, it made me feel like •••• when I came in here and saw that, then saw you and Tiff raving over it, I thought, "Well, I didn't do that. It's not mine anymore, it's Christos'." Instead of giving me a spark of an idea to go out and try to make it better, it's made me not want to touch it anymore. I know other people can do it better, but you should be able to tell from my first post that I really wanted to do this myself, and just get input from others to guide me along, not to have other people take my stuff and do it for me. I know a lot of you guys are art school crit hardened, but does this really need to be that hard core? <br> <br>By the way, the image Tiffany posted was an image I created, but wasn't able to post because of technical issues. Click the link in my post above it.</p>
