    html: "<p>I think Christos was merely following what appeared to be <br>Tiffany's lead, and I'm guessing that he did not read Joe's <br>admonition to Let People Do Their Own Work. <br> <br>&gt;&gt;It's often merely a chance to prove your own skills. <br> <br>Because this has happened quite a bit, I think there's an <br>opportunity to come up with an area of Typophile where <br>people can make explorations with logos/design in the <br>spirit of fun and learning. <br> <br> <br>Kind of like a Typophile Playground (TP).  <br>The term <i>playground</i> has actually become quite <br>shopworn recently, so a better name is out there <br>(league of lecherous logophiles). (logo lounge is taken already). <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Here's one way it could work: <br> <br>1) On a weekly basis, a moderator (Tiffany or Joe maybe?) <br>posts a new <i>description.</i> This responsibility could revolve. <br>2) The description gives the logophiles all the information <br>needed to draw a mark. If more information is needed, <br>simpy ask for more information. <br>3) People draw logos/marks and post them. <br>4) It's not a critique section, just a free-posting section. <br>5) No more breaking into another Critique with the <br>I Couldn't Help Myself excuse. <br>6) People who are looking to improve skills in this area <br>and who want feedback or critique could ask <br>for it offline or through the Typophile message system. <br>7) This shouldn't be viewed as spec work because  <br>there is no client. It's more a chance to get better by doing, <br>to try new things, to have fun. <br>8) Colin, it was nice meeting you at TypeCon and I hope <br>that the location of this post (in the middle of your critique) <br>doesn't elicit more red dots. <br>It seemed like a good time to mention this. <br>9) This surely can be refined. Why I'm awake <br>this early, I'm not quite sure. <br> <br>bj <br></p>"
    html_clean: "<p>I think Christos was merely following what appeared to be <br>Tiffany's lead, and I'm guessing that he did not read Joe's <br>admonition to Let People Do Their Own Work. <br> <br>&gt;&gt;It's often merely a chance to prove your own skills. <br> <br>Because this has happened quite a bit, I think there's an <br>opportunity to come up with an area of Typophile where <br>people can make explorations with logos/design in the <br>spirit of fun and learning. <br> <br> <br>Kind of like a Typophile Playground (TP).  <br>The term <i>playground</i> has actually become quite <br>shopworn recently, so a better name is out there <br>(league of lecherous logophiles). (logo lounge is taken already). <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Here's one way it could work: <br> <br>1) On a weekly basis, a moderator (Tiffany or Joe maybe?) <br>posts a new <i>description.</i> This responsibility could revolve. <br>2) The description gives the logophiles all the information <br>needed to draw a mark. If more information is needed, <br>simpy ask for more information. <br>3) People draw logos/marks and post them. <br>4) It's not a critique section, just a free-posting section. <br>5) No more breaking into another Critique with the <br>I Couldn't Help Myself excuse. <br>6) People who are looking to improve skills in this area <br>and who want feedback or critique could ask <br>for it offline or through the Typophile message system. <br>7) This shouldn't be viewed as spec work because  <br>there is no client. It's more a chance to get better by doing, <br>to try new things, to have fun. <br>8) Colin, it was nice meeting you at TypeCon and I hope <br>that the location of this post (in the middle of your critique) <br>doesn't elicit more red dots. <br>It seemed like a good time to mention this. <br>9) This surely can be refined. Why I'm awake <br>this early, I'm not quite sure. <br> <br>bj <br></p>"
