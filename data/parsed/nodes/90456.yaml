  html: |-
    <p>The website below has text in English and Wadiyan - an imaginary faux Arabic language used to promote the movie <em>The Dictator</em>. Click on the top right icon "Wadiyan" to see the script and top left for the English. I will not comment on the movie or website as such, but have some technical questions about the font and how was it implemented. I saw "ManchuRegular used as a font family in the html code. Is this a web font? I understand that Manchu is one of those languages faced with extinction - who made this font? Thanks Tom Milo for this reference.<br>
    <a class="freelinking external" href="http://http://www.republicofwadiya.com/" rel="nofollow">The Republic of Wadiya</a></p>
