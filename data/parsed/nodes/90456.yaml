    date_raw: 26 Feb 2012 — 8:11am
    votes: null
    html: '<p>The actual font name is Manchu Regular. Switching to Manchu is simply a change of font; the English text is left unchanged. "ManchuRegular" is defined in <a href="http://www.republicofwadiya.com/css/stylesheet.css" title="http://www.republicofwadiya.com/css/stylesheet.css">http://www.republicofwadiya.com/css/stylesheet.css</a> with @font-face. The font files manch-webfont.woff, manch-webfont.ttf etc were  generated with the Squirrel <a href="http://www.fontsquirrel.com/fontface/generator" rel="nofollow"><strong>Font-Face Generator</strong></a>. (Note: the font is left to right, one glyph per latin letter).</p>'
    html_clean: '<p>The actual font name is Manchu Regular. Switching to Manchu is simply a change of font; the English text is left unchanged. "ManchuRegular" is defined in <a href="http://www.republicofwadiya.com/css/stylesheet.css" title="http://www.republicofwadiya.com/css/stylesheet.css" class="link-external">http://www.republicofwadiya.com/css/stylesheet.css</a> with @font-face. The font files manch-webfont.woff, manch-webfont.ttf etc were  generated with the Squirrel <a href="http://www.fontsquirrel.com/fontface/generator" rel="nofollow" class="link-external"><strong>Font-Face Generator</strong></a>. (Note: the font is left to right, one glyph per latin letter).</p>'
