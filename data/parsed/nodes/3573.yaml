    html: |-
      <p>Luciano,</p>
      <p>It looks to me like you've got more fonts worked out in this family than you're revealing to us at this time. For example: the large title 'sinaptix 0.1 [regular]' title looks like a 24pt typeface [21px], with 6px wide stems and 3px wide arms.</p>
      <p>Similarly, your 'sinaptix 0.1 [black]' title looks like a 24pt typeface [21px], with a main dimension of six pixels for its horizontal elements, and a dimension of 9 pixels for its vertical elements.</p>
      <p>Why not show us these fonts too, at their 8pt size, instead of their effective 24pt size? </p>
      <p>Further, right now, you are showing us your 'regular' and your 'black at 8pt. Why not show us your 'thin' and your 'bold'? I strongly suspect you have them!</p>
      <p>The reason I bring all this up, is that I see you've used different strategies for your glyph corners, and would like to see more use of the techniques you used in your 24pt titles applied to your 8pt text samples.</p>
      <p>Even if doing so meant you had to widen the entire family of fonts, I think it might be worth it.</p>
      <p>As for the current 'Black' sample text, I'd like to see you create another version where your horizontal elements do not gain a pixel in dimension. Keep all horizontal elements at one pixel high, and instead of widening your characters to maintain their 'interior' dimensions, as they do now, try maintaining their 'exterior' dimensions when widening your stems.</p>
      <p>Overall, I like your Sinaptix a lot in a lot. Again, I think the face would be stronger if you implemented the three-pixel corner technique as shown in your title texts, into your 8pt text designs.</p>
