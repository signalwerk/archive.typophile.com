      <p>Look out! Crit coming through! </p>
      <p>The heavy weight isn't working as well as the base weight for me. The contasts are lively but they overwhelm rather than pleasing my eye in the heavy weight. That B is a problem. In general I think you need to add some distictiveness to the letterforms so they don't resemble each other quite so much. Then the face will become funky. The distictiveness I am loooking for is in your a &amp; your x. The n &amp; v are mssing it.</p>
      <p>Keep going with this. It could get quite good.</p>
