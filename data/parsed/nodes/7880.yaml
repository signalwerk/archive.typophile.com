    date: 2004-12-01T15:04:00
    votes: null
    html: <p>Hmmm, I see your point Hrant. Thanks for the uplifting comment. I guess if i just work on it some more It will hopfully evolve into something more 'original'. What exactly do you mean by adding more stroke contrast? <br> <br>Thanks <br>Ivan M.</p>
