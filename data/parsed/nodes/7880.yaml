  html: <p>This is my second attempt at type design and I would find it beneficial to get it critiqued in it's early stages. I hope the sketch is tight enough to show the direction in which i would like to go. Two things I want to find out; the first is wether this project is even worth pursuing and second, do the letters have a certain harmony to them ( please try to ignore the letter 's' in your examination as i have not spent much time developing it  and consider it 'unfinished').  <br> <br><img src="http://www.typophile.com/forums/messages/29/54539.jpg" alt=" type sketches"></p>
