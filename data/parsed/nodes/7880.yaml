    html: <p>&gt;I am guessing that you have been looking at a lot of fonts you really like&lt; <br> <br>Well I haven't been looking at other fonts to be honest with you. I thought I could 'start from scratch' (if there is such a thing). But I must admit that at a subconscious level I was influenced. I had no idea of the similarities! But I do admit the second 'k' was seen in the Esquire magazine i subcribe too. I just love it. You're right about 'o' it does not fit, sometimes i get carried away. I will take your advice to heart about the tweaks on each glyph. Too much does hinder userbility. what do u think about the 'g' , 'b' and 'd' do they fit? I think they might be off. Thanks fror the critique you guys. <br> <br>Any more suggestions, anyone? <br> <br>IM</p>
