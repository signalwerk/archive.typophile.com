    html: <p>Uau Giovanni.  Very nice, I like it. <br>Thanks for posting the sketch.  Take care of the 's'! <br>Ain't interesting that Egyptians were using the symbol <br>of a sword to represent the 's' sound? <br>I think it worth pursuing, try to fill those letters <br>to have a better understanding of the white around. <br>Then you can take a trip to San Serriffe islands <br>and work on yo' tan upon Gill Sands beaches. <br> <br>Best, <br>AS <br><img src="http://www.typophile.com/forums/messages/29/54563.jpg" alt=""></p>
  - id: 53252
    user_id: 804
    user_name: designalchemy
    user_path: null
    user_image: null
    date_raw: 28 Nov 2004 — 5:48am
    date: 2004-11-28T05:48:00
    votes: null
    html: <p>Some very interesting glyphs you have for a starting point. I may be wrong, but I am guessing that you have been looking at a lot of fonts you really like (including Lux typographics/ Esquire magazines Crank8 font for the second "k". and perhaps work from UK's The Foundry as well. I am NOT suggesting that you should not use these as starting points, nor that the work is "copied" but I do think it it influenced and there is nothing wrong with that. Did you ( like I have done myself in the past) decided if only I could fit all these unusual tweaks into a single font it would be the "ultimate". Seems like a <br>great idea. Well be careful, for it become a very difficult task. Hrant gave me very good advice once, which was "be careful of glyph love". And by the way I really like the glyphs you have here regardless of where the ideas came from .   <br>Is it worth persuing? Yes. Next step is unification. "o" is very cool but will not fit with rest. The more tweaks the less userbility.</p>
