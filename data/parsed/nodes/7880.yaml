    date: 2004-12-01T17:36:00
    votes: null
    html: "<p>No, Yellow and Finnegan are different fonts. The former is a custom design for the UK yellow pages, and the only place I know of to check it out is in the book \"Language, Culture, Type\". And of course the UK yellow pages!  :-) <br> <br>Here's a scan: <br><a href=\"http://www.themicrofoundry.com/other/Yellow_scan.jpg\" target=\"_blank\">http://www.themicrofoundry.com/other/Yellow_scan.jpg</a> <br>And here's a simple hi-fi rendering: <br><a href=\"http://www.themicrofoundry.com/other/Yellow_bn.gif\" target=\"_blank\">http://www.themicrofoundry.com/other/Yellow_bn.gif</a> <br> <br>Really quite a nice job. <br>If it inspires you, please do credit Jurgen, somewhere! <br> <br>hhp</p>"
