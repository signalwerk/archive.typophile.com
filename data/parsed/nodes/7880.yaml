    user_image: /files/pictures/picture-1250.gif
    date_raw: 1 Dec 2004 — 2:49pm
    date: 2004-12-01T14:49:00
    votes: null
    html: "<p>I don't think it looks like Solex at all, but the reason I for one hadn't commented is because it does in fact seem to be a \"me too\" design (even though I'm sure you didn't do that intentionally). This style is in the air, I guess. But what you have so far can still serve as a great starting point I think. Here's an idea: try adding stroke contrast - most such designs are monoline. <br> <br>hhp</p>"
