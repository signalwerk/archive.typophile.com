    date_raw: 2 Dec 2004 — 4:08am
    date: 2004-12-02T04:08:00
    votes: null
    html: '<p>Hello Ivan, <br>If this is any help to you: <br> <br><a href="http://typematters.net/TM_Yellow.html" target="_blank">http://typematters.net/TM_Yellow.html</a> <br> <br>Only web but you can see the letters enlarged. In the original prints you can only see them in 6.5 point. <br>Your sketches remind me of a design i tried after i did Yellow. I did not continue the work, because i wanted to make something new and the new designs reminded me too much of Yellow. But, go ahead. And, please, try that *o* with the contrasting diagonals. If you go from there and apply this principle to the other letters, something totally different will come out of it. Give it a try. <br> <br>Best, <br>Jürgen Weltin</p>'
