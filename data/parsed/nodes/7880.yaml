    date: 2004-12-01T14:41:00
    votes: null
    html: <p>Well, this is a bit discouraging. <br>It's seems that the type i hoped would be somewhat original reminds people of other fonts. I honestly thought that not looking at other sources for inpiration might  help in avoiding this kind of 'confusion' in terms giving my design it's own identity.  <br> <br>Well 'A' , to answer your question I guess they are some similarities to the fon't Solex, but i feel my design might be just different enough to 'stand out'. <br> <br>To be honest with you I feel like I have this all wrong now.  How does one design great typefaces that stand out and not look like everything else? Can such thing be accomplished? I hope there is someone out there with advice that can help me. I really feel like I have the potential for good type design ( I know this because of the love i have for the printed word and typography) and i don't want to give up on this! <br> <br>Any advice <br>Ivan M</p>
  - id: 53257
