    html: <p>Illustrator does not support Arabic layout unless you get the Middle East version from WinSoft. Probably what you will need to do, once you've figured out what Arabic font to use, is to set the Arabic text in e.g. Word (Windows, not Mac), print to PDF, and embed the PDF as a graphic in Illustrator.</p>
