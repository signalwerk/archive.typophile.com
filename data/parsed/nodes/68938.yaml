  html: |-
    <p>Friends,</p>
    <p>I have a small situation and need help.<br>
    I received a label layout in microsoft Excel (?!). I want to re-do it in illustrator.<br>
    Its a simple label only with latin and arabic text.<br>
    When I open the excel file the label presents the fonts correctly, but if I do a copy and paste it in illustrator the characters disappear.<br>
    How do I set Arabic text in illustrator? The font is Calibri.</p>
    <p>António</p>
