    <p>Hello all</p>
    <p>I've just received a brief to pitch for a magazine about a Jazz festival. I have one day to put something together. Initial thoughts are that it needs to have high production value - to be kept as a souvenir, yet portable and practical as it will also act as a guide to the festival and be taken away post concerts - therefore smaller than A4.</p>
    <p>As it coincides with the 21st anniversary they want to highlight past performers as well as the current crop. I'm thinking design-wise it should be very contemporary, and probably on an offset (uncoated stock).</p>
    <p>Typewise I'm inclined to go sans and was notionally thinking of using Gotham Rounded for heads and narrow for text, plus maybe a slab (any suggestions?). My feeling that using a serif might be too traditional. However I'm open to any ideas?</p>
    <p>Can anyone make any traditional arguments for using specific type or suggestions of other faces to try out?</p>
    <p>Any help at this point gratefully received!</p>
    <p>Thanks</p>
