      <p>Hey Dendicott,</p>
      <p>Gotham is a solid base for your magazine, personal I don’t like the rounded version but that’s another story.</p>
      <p> You could pair it with FF More. It’s a little bit slappy but still some kind of traditional. If you want it more slab, try Adelle. A wee bit softer is FF Tisa.</p>
      <p>A very beautiful combination, in my opinion, is Gotham with Mercury. It looks timeless and by far not old fashioned. Why don’t give it a try?</p>
      <p>Regards,<br>
      Florian</p>
