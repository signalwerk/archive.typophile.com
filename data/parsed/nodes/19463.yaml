      <p>Well, I always thought that Univers works beautifully with Bodoni. I usually use the ITC version with three optical sizes 6,12 and 72. I also think <a href="http://www.stormtype.com/typefaces-fonts-shop/index.php" rel="nofollow">Walbaum Text</a> from <a href="http://www.stormtype.com/" rel="nofollow">Storm Type</a> would be a good pairing as well.</p>
      <p>I haven't used Univers enough to provide any further suggestions.</p>
