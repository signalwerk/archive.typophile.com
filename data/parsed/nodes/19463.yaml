    html: |-
      <p>Univers and Glypha work really well together, as they should: both are Frutiger designs. I prefer Glypha to Serifa because it's a bit stronger weight in the strokes. I've used them in both directions: Univers for titling, captions and headlines with Glypha as the body copy font, and vice versa.</p>
      <p>Whichever one I use for titling, I find there are benefits to range tracking to make it look fresher and a bit more contemporary. I use 1 point of condensed tracking for a 24 point font size; 1.5 for 36 points, etc...Then add pair-specific kerning where needed.</p>
      <p>Glypha 75 also works well as the titling font with other Egyptians as the body copy; e.g., I've used it with Canada Type's Clarendon Text to very good effect.</p>
