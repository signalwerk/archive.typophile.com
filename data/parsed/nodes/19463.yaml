    html: <p>Pretty much any serif face will work with Univers, choice depending on whether you want to match Univers' tone (vanilla) or add a bit of flavour. For small sizes of course you want something fairly sturdy. Storm's Baskerville Ten Pro is one of many that would work.</p>
