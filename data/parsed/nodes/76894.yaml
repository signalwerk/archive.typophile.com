    <p>Founded by <a href="/node/76893" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Craig Eliason</a> in 2010, Teeline Fonts is located in Saint Paul, Minnesota, <span class="caps">USA</span>. The foundry’s first releases were <a href="http://www.typophile.com/node/75182" title="Click to visit an external URL." class="freelink freelink-external freelink-internal">Ambicase Modern</a> followed by <a href="http://typophile.com/node/82691" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ambicase Fatface</a>.</p>
