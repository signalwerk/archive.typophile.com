    <p>Founded by <a href="/wiki/Craig%20Eliason" class="freelinking" rel="nofollow">Craig Eliason</a> in 2010, Teeline Fonts is located in Saint Paul, Minnesota, USA. The foundry's first releases were <a class="freelinking external" href="http://www.typophile.com/node/75182" rel="nofollow">Ambicase Modern</a> followed by <a class="freelinking external" href="http://typophile.com/node/82691" rel="nofollow">Ambicase Fatface</a>.</p>
