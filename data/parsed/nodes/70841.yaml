      <p><cite>Michel, you completely lost me after your second post!</cite></p>
      <p>Well, when I look with FontForge, it first tells me that there is a kern table but I also get the message that it will not read it because there is also a kern feature in GPOS.  If I generate the corresponding afm file, I get 34863 kerning pairs (taken from GPOS).</p>
      <p>To force FontForge to read the kern table, I remove the GPOS table from Calibri with "sfntedit -d GPOS Calibri.ttf" and generate again the afm file. This time I get the 14148 kerning pairs of the old style kern table plus a warning that the kern table does not comply with the specs. </p>
      <p>The rest was simply to find more precisely the cheat, or the bug, or at least the reason why ttx would output only 3225 pairs with first glyph from A to Ograve. </p>
      <p>Michel</p>
      <p>EDIT: According to the spec, the subtable should be 19366 bytes long and there is just one. It starts with 14 bytes of info and then there is 6 bytes per kerning pair. (19366 - 14) / 6 = 3225. After that, ttx stops decompiling.</p>
