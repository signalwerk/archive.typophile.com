    votes: null
    html: |-
      <p>The basic issue is that the ancient kern table spec uses a USHORT for the 'length' field (for the length of the entire kern table including all subtables). Why it was specified this way is a complete mystery to me, since the length of the entire *table* is already given by the font's Table Directory (header). It's not even redundant, since the Table Directory length is a ULONG, allowing for a much larger table. But that's how it is.</p>
      <p>So, for tools or other processes that make use of the length field, you can do the math with the table &amp; subtable header lengths, etc. and figure out that the number of pairs in a format 0 subtable is theoretically limited by that field to a maximum of 10920 (which I'm sure the inventors thought would be more than enough at the time, but nowadays, not so much).</p>
      <p>But, many tools and some operating systems ignore or at least don't choke on kern tables where the length field is not correct, and can calculate the actual length of a format 0 subtable by using 'nPairs' field.</p>
