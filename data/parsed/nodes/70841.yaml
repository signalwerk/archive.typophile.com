    date_raw: 29 May 2010 — 8:17pm
    votes: null
    html: |-
      <p>Calibri and the other MS ClearType fonts were originally made with GPOS kerning only. When MS Office decided to adopt some of these fonts as defaults, they requested that kern tables be added, since Office apps did not yet -- and still do not! -- support GPOS kerning for European scripts. The kern tables contain filtered flattened kerning from the GPOS sources, including only encoded glyphs; even so, the size of some of the kern tables is very large, and it is quite possible that apps might fail to support all the kern pairs.</p>
      <p>In general, I'd recommend against including both GPOS and kern table kerning, unless a client specifically requests it and has some pressing technical need.</p>
    html_clean: |-
      <p>Calibri and the other MS ClearType fonts were originally made with GPOS kerning only. When MS Office decided to adopt some of these fonts as defaults, they requested that kern tables be added, since Office apps did not yet -- and still do not! -- support GPOS kerning for European scripts. The kern tables contain filtered flattened kerning from the GPOS sources, including only encoded glyphs; even so, the size of some of the kern tables is very large, and it is quite possible that apps might fail to support all the kern pairs.</p>
