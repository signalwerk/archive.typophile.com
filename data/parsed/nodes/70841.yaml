    html: <p>I just ran a test with FontLab. I removed the GPOS table and opened the resulting font with FontLab. It found 3225 kerning pairs, the same as ttx does. My guess is that the GPOS kern feature has been removed from the font and all the kerning pairs put in an old style kern table. On that table spot crashes, ttx and FontLab do not do their best to circumvent the hack. The only solution I see is to open the font with FontForge, generate anew the ttf, and open the resulting font with FontLab. You should then see all the kerning pairs.</p>
