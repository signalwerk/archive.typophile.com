      <p>I think you linked to the wrong licence, this should be the right one: <a href="http://creativecommons.org/licenses/by-sa/3.0/" title="http://creativecommons.org/licenses/by-sa/3.0/">http://creativecommons.org/licenses/by-sa/3.0/</a></p>
      <p>This kind of licence effectively makes the fonts free to share and modify, which is a bit of a contradiction to the digital signature and personalized serial number stuff, it seems to me.</p>
      <p>One more thing to ponder: Do the "attribution" and "share alike" requirements of the CC licence apply only to the fonts themselves, or also to works created using the fonts?</p>
