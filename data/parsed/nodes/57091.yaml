    html: <p>Just stumbled across this Thread by chance, for those interested I used to work for R&amp;D&amp;Co, it is indeed a custom font called 'Spacey' not 'Spacey-Brand' It was created as part of the re-brand for the Old Vic theatre company. The font comes in widths instead of weights (2 Weights). The font was designed by Rob Andrews of R&amp;D&amp;Co (which has since ceased trading).</p>
