    html: |-
      <p>If that's a pirated/cloned/copied design, I couldn't find any other font, commercial or free, that matched it enough. Neither Durak, as suggested by R., nor any of those suggested by WhatTheFont, Identifont, or WhatFont Is. These included Cotoris, Koala, Vandermar, and Darjeeling. Other than combining heavy strokes and thin strokes, they have little in common. </p>
      <p>What VogueSans really looks like is exactly what its name says: The Vogue Magazine nameplate typeface with the serifs clipped off.</p>
      <p>  - Herb</p>
