      <p>@Noorett - Perla is close, but not the same. Major differences in  C, J, Q, W and others.  Not to mention that Perla is a serif font.</p>
      <p>@Nick - I've found a half-dozen different fonts all named 'Vogue'. Your 1932 sample is probably one of the first. The Vogue in your image (the lower case letters) was matched by WhatTheFont to <a class="freelinking external" href="http://www.myfonts.com/fonts/durotype/simplo/medium/glyphs.html" rel="nofollow">"Simplo Medium"</a> by Durotype. The headline, in "Stellar", is matched by Spiece Graphics' Stellar Classic.</p>
      <p> - Herb</p>
