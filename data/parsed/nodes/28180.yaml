    <p>I’d like to use a commercial font in a logo, but am worrying about licensing. Unless they’re custom made, hand drawn designs, I guess all letter logo’s somehow use at least one font, for which the designer has (or should have) a license. Font licenses, in general, prohibit adaptation of the font files, and of the glyphs and artwork included therein. Furthermore, the user is not allowed to redistribute the font by embedding or packaging it into another format. Now, how could a logo designer use such a licensed font, if he’s supposed no to tweak nor adapt its glyphs so as them to meet the corporate identity with which the logo has to conform? Additionally, even if the glyphs were not to be modified, how could the designer supply his customer with ready-to-use .pdf, .eps, .tiffs, .jpeg files with the font glyphs embedded, or even converted into outlines?</p>
    <p>If the use of the font as described above, would be allowed, should both designer and customer have a license? Suppose the designer wouldn’t use the font, but for that one single assignment, could he have just his customer acquire the license and still use the font for the logo?</p>
    <p>We’re located in Belgium, Europe. I understand font licensing and copyright laws might differ between the member states of the European Community and the United States.</p>
    <p>PS Though I’m a clandestine reader for some time now, I never bothered to subscribe as a posting member. So, because I’m new to this forum, please excuse me for asking about a topic that presumably has been discussed many times before.</p>
    <p>[ EDIT: The first part of the above question was repeated under <a href="http://typophile.com/node/28107#comment-157338" title="http://typophile.com/node/28107#comment-157338">http://typophile.com/node/28107#comment-157338</a>. ]</p>
