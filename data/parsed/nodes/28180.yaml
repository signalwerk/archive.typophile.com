      <p>Some EULAs do state that you cannot embed the font, outlines or otherwise. They even go so far as to put a percentage. </p>
      <p>The foundries that don't allow embedding into PDFs are the same that are worried about people "sucking" the font information out of the PDFs, outlines or not.</p>
      <p>Not being able to embed a font into a PDF, such as one used in an InDesign file, makes it impossible to use the font for many projects. These foundries are limiting their client-base, but they are only doing what they think will protect there fonts from yet another form of font piracy.</p>
      <p>There are loopholes. But, finding loopholes encourages foundries to make stickier EULAs.</p>
