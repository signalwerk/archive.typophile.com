      <p>Generally, you need a license, the customer doesn't. But there are exceptions, so check with the foundry. Especially if your're using a font from an unfamiliar foundry. They can write anything they like in the EULA and who but a lawyer knows if it's legally binding?</p>
      <p>For instance: with P22 fonts, it's OK to use any font to do the logo. *However* if you use a dingbat, that is, a graphical illustration distributed as part of a font (like the font Zapf Dingbats), you need to pay an additional fee. T.26 has a similar rule - specifically allowing text fonts to be used, but not dingbats. Linotype and Adobe's EULAs seem to follow the general rule - go ahead and make a logo.</p>
      <p>Moral: don't be lazy. Don't use a dingbat for the graphical element in you logo, get out that Pen tool and draw it yourself!</p>
