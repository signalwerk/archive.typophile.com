      <p>Ludwig,</p>
      <p>I had the same concerns a few years ago. If you are only using the letters in a logo you are fine. Stefan is right in what he says about dingbat vs. letter.</p>
      <p>The wording is meant to protect the work, but I fear, as you have pointed out, it actually keeps people from using the fonts because they misunderstand the EULA.</p>
      <p>For a logo, you general turn the type to outlines anyway. Once you've done that, turned the type to outlines, in most cases the EULA does allow embedding after that.</p>
