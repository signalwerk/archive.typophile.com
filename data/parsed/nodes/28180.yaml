      <p>That's exactly the case. I contacted the foundry and the answer reads as follows: "There is no problem to send a .eps to the client. The remark in the EULA is more about font embedding in PDF and that kind of stuff." I'm just perplexed by the legal inaccuracy with which these EULAs seem to have been formulated. If you interpret them strictly and literally (as you should, lawyer or not), then the end user's licensed use of the font would almost be restricted to its purchase only.</p>
