      <p>slightly related:</p>
      <p>acrobat 7 pro allows you to convert all type in a document to outlines using the PDF optimizer tool, which sidesteps the embedding issue completely, except as Tiffany notes.</p>
      <p>One thing, though, Tiffany: "...cannot embed the font, outlines or otherwise." - converted to curves, it no longer fits the legal definition of "font," right? so embedding outlines - which technically are not "embedded," as in attached alongside the document inside the PDF wrapper, but part of the document's postscript itself - would be outside the realm of a font's EULA, wouldn't it?</p>
