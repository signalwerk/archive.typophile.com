      <p>Why don't you tighten up your spiral mark and let the line quality guide your sense of the type.</p>
      <p>Politic ABCD used to be Politica. From the description it is used by the Green Party. The C and D versions, in particular, do look like police. Because this type is devised of large blocks you might attempt to render the spiral in a block style—as if the pixels were very large—and match the weight to the type.</p>
