    <p>Hello typophiles,</p>
    <p>I've been pondering on this job for some time now, and thought I'd get some feedback and inspiration.</p>
    <p>I volunteer work for the communication group of a newly started political organisation in Denmark, called "Yngresagen" (literally: "The younger cause", playing on the existence of a large danish organisation: 'Ældresagen', which means "The older cause"). Yngresagen wants to help the young generation(s) get an opinion in the parliament (that's the lobby-part), but also to make it easy for members and volunteers to start up projects of their own (that's the activity-part, which is the most important one). Our target group as far as members goes, are young people between 13 and 35 years old (yes, that's an awful large and diverse group). But we also need to communicate with all sorts of media and of course the politicians. Furthermore, it's going to be a nation wide organisation, possibly the largest for our target group.</p>
    <p>------<br>
    I hope to express some of the following words: young (duh), competent (instead of the empty 'serious'), a pinch of politics, progressiveness &amp; forward-thinking, creativity (more than a lobby org.), dynamic, fun &amp; play,</p>
    <p>I really want to make the logo dynamic and non-static. In fact even plastic or elastic, in the sense that users/members/supporters could "remix" and even adopt the logo for their own purposes, thereby making it their own. My working idea is a green (yngresagens color) spiral, that, when it is drawn, resembles somewhat a fingerprint - with a wee imagination at least. Their initial logo was a real fingerprint. If drawn differently, it could also look like a tube – or even a megaphone (symbolising how the organisation could get the youth heard in public matters). If we want to be really fancy, it could also look like an ear. Nature is full of spirals and that can be exploited. I've included some examples of what I mean. I hope my idea doesn't sound too diffuse.</p>
    <p>For the logo type, I thought having it:<br>
    * Sans and lower-case (maybe the 'Y' as a small capital, thereby only reaching the x-height)<br>
    * A grotesque of some sort, but with a humanistic tendency: cut-off sharp corners to make it less solid, but keep a vacuum-feeling<br>
    * Perhaps: transparency? (symbolising just that: that we want as little as possible to be hidden from the public). Example: <a href="http://www.cphdox.dk/d1/front.lasso" title="http://www.cphdox.dk/d1/front.lasso">http://www.cphdox.dk/d1/front.lasso</a> (by the way, does anyone know this type? Maybe it's a custom design)</p>
    <p>By the way, I have (almost) completely free hands on this project, so deroutes from my original idea are greatly appreaciated as well! I just want to discuss this as much as possible and look forward to hear your suggestions and ideas</p>
    <p>Malte</p>
