      <p>Aside from the uppercase 'G' - I think Pasadena is pretty spot on as long as it would be a more heavy/expanded wieght. Since 'Pasadena' was originally digitized by "The Font Company"   <a href="http://typophile.com/node/69469" title="http://typophile.com/node/69469">http://typophile.com/node/69469</a>  I'm guessing the original was a film type and likely not currently owned or administered by anyone?</p>
      <p>I wonder if the 'G' was an alternate of the original font, but either not digitized or ? Any advise on what the original non-digital font would be?</p>
