    html: <p>&gt; in iceland they use a letter that looks liek <br>&gt; your "d", cant find the website i was reading <br>&gt; this in <br> <br>You're thinking of the lower-case "eth" or "edh" <br>(pronounced like "eth" in "whether"), which is <br>used in Anglo-Saxon, Faroese and Icelandic. <br> <br>The "d" in Andrij's logo does look rather like an <br>"eth", especially with the swooping crossbar <br>cutting through it. I'm not sure that this is really <br>a problem, though, depending on where and <br>how Andreij intends to use the logo.</p>
