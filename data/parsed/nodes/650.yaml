    html: <p>andrij, <br> <br>that logo looks nice and diligently designed. i think the incontinuous loop on the "d" ascender fits right in and the "a" is okay for me, too. <br> <br>but if - if! - your personal logo is mainly thought to tell people what your name is, it might be too hard to read. personally - if i didn't know your name - at first sight, i'd read "andaj", on second i wouldn't know at all how to decipher those letters. <br> <br>like alex i think the top end of the "r" could be a bit thicker, but i think it might need more than that. maybe redesign the "r" in a way that both the "r" itself and the "i" become easier to recognize and easier to distinguish from the "a". the following is a quick'n'dirty bitmap work to illustrate what i mean and is <b>not</b> meant as a final design (see one post below, please). <br> <br>peter</p>
