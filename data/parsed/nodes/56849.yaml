    <p>I'm wondering if there is a way to see more details in the control panel (top bar) of Adobe Illustrator CS4.<br>
    When using the Type Tool, it only displays Font, Font Style, and Font Size.</p>
    <p>I'd like to see leading, kerning and tracking as well without having to click on "character". You used to be able to do this in older versions of Illustrator.</p>
    <p>I attached a pic.</p>
    <p>Any ideas?</p><div class="imageWrap"><img src="http://typophile.com/files/controlpanel_4105.jpg"></div><p></p>
    <p>Thanks</p>
