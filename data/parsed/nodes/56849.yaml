    html: |-
      <p>The only difference I see to CS3 is that the edit boxes for Transform have been removed (and now you mention it, yeah, that sucks too). No leading, tracking, and kerning.</p>
      <p>It's not a biggie for me, I have the Character panel open all the time anyway.</p>
      <p>InDesign, on the other hand, has a fully customizable control panel -- up to each and every single item in the Character panel. A very useful feature that, well worth of copying to other programs in the nominally inappropriately named "suite".</p>
      <p>In cases like this, one can only guess what the underlying thought was to <em>remove</em> features.</p>
