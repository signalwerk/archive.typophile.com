    <p>Good evening!<br>
    I am pleased to announce my new font, called Ataxia. I would like to hear opinions about the project! </p>
    <p>Ataxia was designed to be used in long texts such as books and magazines.<br>
    The font has the weights regular, bold, italic and bold italic as well as ligatures, small caps, oldstyle numbers and support for many languages, with more than 500 glyphs.</p>
    <p><a href="http://new.myfonts.com/fonts/danieljusti/ataxia/" title="http://new.myfonts.com/fonts/danieljusti/ataxia/">http://new.myfonts.com/fonts/danieljusti/ataxia/</a><br>
