    html: |-
      <p>OK - Serious critique - from an amateur.</p>
      <p>Since you didn't mention what your client wants to use it for, I'll guess that it's intended as a display font for headings or titles or posters. But even then, it should satisfy some basic text criteria for readability.</p>
      <p>It doesn't satisfy your client's stated objective:  The individual glyphs convey neither a modern look nor an 'ancient cyrillicl (whatever THAT is)' feel.  It is not a font, but a collection of arbitrary symbols with no unifying concept or shape. There is no typographical or visual consistency. Some letters are triangular, some have random curves, and some are perfectly round. The variations, along with unexpected descenders (like the m and n) cause a disturbing and distracting optical unevenness to lines of type. The strange tails on the f, y, and g look like an attempt to make it look like handwriting. The unbalanced 'a' makes my eye want to complete it. The 'u' looks like someone trying to 'walk like egyptian'. The serif on the small eye, along with the hollow tittle, makes it look like an afterthought.</p>
      <p>I also find the overall color disturbing - the balance of black and white, the size of the glyphs, the closeness of the lines, the letterspacing, all contribute.</p>
      <p>I didn't start out intending to be cruel, but I'm afraid I have been. I just stated what I see. Hopefully, others will see the typeface's more redeeming qualities.</p>
      <p> - Herb</p>
