    html: |-
      <p>I don't think I was <em>that</em> cryptic; you for one clearly understood me. And I'm always willing to elaborate.</p>
      <p>You know what's not helpful for someone learning type design? Brainwashing them into a method that quickly produces highly polished, ooh-aah, predictable, dead-end results. That's not what education is about, and I hope Ryan does not fall into such a trap, because that might cripple him for life.</p>
      <blockquote><p>Were these concepts of any help to you? In the last 10 years your designs have not improved that much.</p></blockquote>
      <p>Even though I think Vem (Ernestine's Armenian) is something to be at least mildly proud of, it's certainly true that I'm too ponderous. On the other hand it takes time to fully wrap one's head around something that virtually nobody has really done yet, and I don't want to simply imitate Bloemsma's genius; I actually had an epiphany of sorts in April, but it will take time to implement. Also, on the way home from Yerevan-Istanbul-Reading I finally figured out how an ideal "Italic" for Armenian could be built (not painted, mind you) and it might also serve to breathe new life into Latin Italics, which to me have historically been, and remain, a joke. That won't take nearly as long to implement - I've been drawing pretty intently for the past 3 weeks.</p>
      <p>Most of all though everybody's different, and to me continuously refining an established model (nevermind that it's a lousy one) would be a waste of my life.</p>
      <p>hhp</p>
