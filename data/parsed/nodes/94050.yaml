    html: |-
      <p>Lol, the text is from Genesis, the first book of the Old Testament.</p>
      <p>This is part of the conversation with the client that this sprung from:</p>
      <p>Client - "Something like ancient Cyrillic, but not based on illegible symbols. The Runes of the Goths meets the Alphabet of the Kabbala. In fact did you know that the David Star can be deconstructed to form every letter in Ancient Hebrew? I've been going down this road for a while with my typeface and saw Prometheus this last weekend and it seems others are doing the same."</p>
      <p>Me - "I just, I dont see those kind of letters form could ever be made to look modern. They are so much a medieval connotation to them. I can't stop seeing pictures of whole rooms lit by candle light, and darkness, and dracula."</p>
      <p>Client - "Yes you are correct, absolutely right... I don't want that look at all but needs its foundation in the principles I speak of. Approach as if Anuthin Wongsunkakon were designing the logo that appeared on the Ark of the Covenant."</p>
      <p>Me - "Hmmm, I'll do some sketching."</p>
      <p>I ended up basing a lot of the glyphs on ancient Sumerian, though no attempt was made to keep the same meaning.</p>
      <p>Here's my source material:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AlexSources_3591.png"></div><p></p>
      <p>You can see I've traced over it in red.</p>
      <p>A lot of these glyphs ended up not being used.</p>
      <p>Here the font is in very early development:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AlexanderSpecimen01_5330.png"></div><p></p>
      <p>This font is far from done, but I've sent it off to the client to ask if they find the letterforms acceptable, and would like to get some opinions of it here as well.  </p>
      <p>My main concern is that it is still far to radical, and perhaps, well, embarrassing to the client, even though this was what I thought they were asking for.  I suppose what I'm really asking here is how to give this font more legitimacy.</p>
