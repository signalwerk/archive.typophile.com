    html: |-
      <p>&gt;Ain't the "white" in type a 'byproduct' to the reader?</p>
      <p>Surprisingly to me, I think perhaps yes. Eye tracking studies seem to show that the important parts of letters for recognition are the black bits. For example that readers differentiate a 'c' from an 'o' by focussing on the black areas (the right side of the 'o' and the terminals of the 'c') rather than paying any attention to the white gap between the terminals of a 'c'. At least that's what Karin von Ompteda's research seemed to suggest at Typo London last October, as the hotspots were only on the strokes, not the whites. When I asked her about that, she wasn't in the least surprised that readers' eyes don't see the white spaces, though I was.</p>
