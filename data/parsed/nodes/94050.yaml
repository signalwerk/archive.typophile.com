    html: |-
      <p>Couple of thoughts (and forgive please my 'Latin American english') : </p>
      <p>It is an experimental font and I won't comment on the letters structures. This sort of radical design try to break with conventions and if this is one of the aims, we should not criticize things like poor legibility, etc.</p>
      <p>What I find problematic are the drawings. I would classify this font as what once (I think) G. Noordzijd described as 'spaghetti letters' pointing to the almost zero apparent contrast. But as such the font fails in being consistent with its own morphologic rules. Also the strokes lack fluency and beauty. </p>
      <p>You can break typographic rules, but if you just ignore them, the results are always doomed. One important rule is that typography is a idealized, conceptualized, abstracted form of writing.<br>
      I order to build an interesting design you must understand the behaviour of the tools that defined our letter forms (or at least to have enough knowledge of type history to be able to create new, interesting alphabets).</p>
      <p>If I were you, I would first experiment with a rounded and thick tip: a speedball nib, for example. Then I would look close to the curves and endings trying to assimilate the generative rules behind the ductus and features.</p>
      <p>Analyzing good typefaces with a similar kind of contrast is also a necessary step to understand optical corrections. They are unavoidable in fonts which attempt to follow geometric principles.</p>
      <p>Good luck.</p>
      <p>R.</p>
