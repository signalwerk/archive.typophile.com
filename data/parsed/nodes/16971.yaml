      <p>This is fun. I just have a few suggestions/ideas: </p>
      <p>- The s needs some work. It is too geometric and the top slopes forward making it look as if it is falling over.<br>
      - Do you need the literal hook? Isn't it enough that the _g_ resembles a hook? What if you extended the tail a bit more? I think if you weren't quite as literal the fish wouldn't be as stylistically opposed to the typeface.<br>
      - Can the fish be a little more assymetrically placed?</p>
