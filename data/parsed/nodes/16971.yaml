    <p>Another day, another logo. This time I'm working on a logo for a friend's software company in Holland called "Fishgrind". They create various types of software packages but to date have been specializing in software that runs audio visual projector and plasma screens in clubs and entertainment venues.</p>
    <p>As you can imagine it's been a little tricky drawing any direct connections between the name and what the company actually does so I have mainly stuck to playing with letterforms and the fish reference.</p>
    <p>After tossing around several potential ideas I have come down to one that seems reasonably solid, although I'm still playing around with certain aspects such as typeface, weight and little fish glyphs.</p>
    <p>Here is just a small progression of how the idea came about, as always all comments/suggestins are welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fishgrind2.gif"></div><p></p>
    <p>-mmilo</p>
