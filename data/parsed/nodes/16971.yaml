    html: |-
      <p>mmilo,</p>
      <p>i like the mood your typography creates, but the fish aren't in the same style, so they jar me out of the logo itself.</p>
      <p>further, while i like the typographic treatment of the fish hook, i don't see how it illustrates a fish 'grinder'. i see it being a fish 'catcher'.</p>
      <p>lastly, since the parallel between fish and catching them, grinding them, or otherwise, really has no value when illustrating what the company actually does (software for audio visual projector systems), i'd suggest you drop the fish hook and the fish.</p>
      <p>instead, put your faith in the power of the fishgrinder moniker. the word itself, as dache pointed out above, carries a lot of illustrative power all by itself. you can still make the logo fun and iconic, by just giving the brand name creative typographic treatment.</p>
      <p>i think your work is strong in its many different aspects, mmilo. i just think that you can fit them together better in this instance to create a more powerful, streamlined image/message.</p>
