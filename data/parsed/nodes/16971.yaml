      <p>Nice. Two suggestions, though: The 'fi' looks a bit too tight for my taste – maybe you could move the f a little bit to the left to achieve the optical feeling that 'fi' is as broad as the terminal 'd'.<br>
      That would also result in the 'g' being more centered, leaving space for optionally adding 'soft' and 'ware' below the actual logo to stress what the company is doing actually.<br>
      Greetings, sk</p>
