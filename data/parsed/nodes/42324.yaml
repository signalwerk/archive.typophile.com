    <p>Hi everyone,</p>
    <p>I'm looking for a font similar to that featured in the "A Diamond is Forever" print ads. (For reference, see here: <a href="http://www.instablogsimages.com/images/2007/08/06/debeers-1_25.jpg">http://www.instablogsimages.com/images/2007/08/06/debeers-1_25.jpg</a>).</p>
    <p>I know it's very "generic," but it has many subtleties. Be specific.</p>
    <p>The Tiffany and Co font would work as a backup.</p>
    <p>Thanks so much!</p>
