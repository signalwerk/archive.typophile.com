    html: <p>It's Adobe's <a href="http://www.adobe.com/type/browser/F/ZEBQ/F_ZEBQ-10005090.jhtml" target="_blank"> Zebrawood Fill</a>. <br> <br>It's funny how the "fill" variants of those layered  <br>Tuscans and other wood types are so wildly popular  <br>without the actual "framework" designs. I've rarely  <br>seen <a href="http://www.adobe.com/type/browser/F/ROSQ/F_ROSQ-10005000.jhtml" target="_blank"> Rosewood</a> in action as it was intended to be,  <br>but <a href="http://www.adobe.com/type/browser/F/ROSQ/F_ROSQ-10005090.jhtml" target="_blank"> Rosewood Fill</a> just keeps popping up everywhere  <br>from CD covers and posters to websites.</p>
    html_clean: <p>It's Adobe's <a href="http://www.adobe.com/type/browser/F/ZEBQ/F_ZEBQ-10005090.jhtml" target="_blank"> Zebrawood Fill</a>. <br> <br>It's funny how the "fill" variants of those layered  <br>Tuscans and other wood types are so wildly popular  <br>without the actual "framework" designs. I've rarely  <br>seen <a href="http://www.adobe.com/type/browser/F/ROSQ/F_ROSQ-10005000.jhtml" target="_blank"> Rosewood</a> in action as it was intended to be,  <br>but <a href="http://www.adobe.com/type/browser/F/ROSQ/F_ROSQ-10005090.jhtml" target="_blank"> Rosewood Fill</a> just keeps popping up everywhere  <br>from CD covers and posters to websites.</p>
