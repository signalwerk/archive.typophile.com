      <p>Word Spacing in H&amp;J is the key. My default setting in Illustrator and InDesign is:<br>
      Minimum: 65%<br>
      Desired: 85%<br>
      Maximum: 100%</p>
      <p>And I adjust it from there, usually lower, sometimes to 50/60/70. Better too close than too far apart. Always hyphenating if I can get away with it. Never adjust letterspacing, unless there is a visible kerning problem. An even rag obviously works better with space-saving fonts like Adobe Garamond or Minion. Tweak out the edge of the textblock a little too, as long as it doesn't make a noticeable difference but fixes the rag. I also switch between the Adobe Single-Line Composer and Every-Line Composer in the CS programs, sometimes one works better than the other.</p>
      <p>Another trick I have used is to set the spaces between sentences in a different character style which has a different horizontal scaling than the rest of the paragraph. Then you can adjust the spaces all at once. This is a real pain to use, so I would recommend it only for situations that call for a paragraph of perfect type in a large size, where the character count is much shorter than normally desired.</p>
