    <p>Rags are something i've been having mixed luck with as I try to master them. Ideally I would like to turn my "luck" into a useable skill.</p>
    <p>Problems i'm having...As i'm sure you already know since some of you are probably veterans. So bare with me, please.</p>
    <p>1. When i try to manually rag, the rythmn is a real mess. I've tried tracking +-20. Is there a visual limit to how far you can track before it becomes really noticeable? Perhaps there's a rule, perhaps it's by individual font.</p>
    <p>2. Are there any other "tricks" that you can share?</p>
    <p>3. Some will say there's a rule, i'm sure, but can you use a hyphen when ragging?</p>
    <p>4. Does anyone have suggestions for things to look for when ragging. I need to gain some ground here in order to be pleased.</p>
    <p>Anxiously awaiting your thoughts!</p>
