      <p>Another good trick in InDesign is the "Nonbreaking Space" (usually command-option-x); it looks like a word space but InDesign will treat the words on either side of it as one word. The nonbreaking space is better than a line break for killing widows, because if your type is ever re-flowed it won't create havoc.</p>
      <p>In terms of bringing up lines, I'd say to kern wordspaces first, even to -80 (indd units, not quark) depending on the characters around them, <em>then</em> apply tracking, usually not more than -5 (again, indd units). It sounds like Patty's method with H&amp;Js is a smarter, more automated way of applying this idea...</p>
