      <p>It also depends on the software you're using for layout. Quark is not as forgiving as InDesign is with the amount of tweaking. Or perhaps it's more accurate to say InDesign uses a different setting for autospacing and kerning. Some magazines have a standard that they will allow type to be kerned to; my experience is, in Quark don't go past -4 in body copy, and InDesign it seems that a -20/25 is the general threshold.</p>
      <p>Some clients don't mind hyphens in their copy, some make you turn hyphenation off. In my old job, we did a lot of government work and we were not allowed to use hyphens especially in bilingual material, each translator wanted to break words at different parts so they put a kibosh on hyphenation. </p>
      <p>You want to make sure you watch out for widows/orphans and it's ok to use line breaks to knock down a word to balance out the rag a bit more.</p>
