    html: |-
      <p>I think that a lot of the rules to do with hyphenation are bunk. I have read my way through many books, and "more than three" hyphens have never bothered me, never hindered my reading or comprehension. It seems to be an easy target for people looking at typesetting to comment on. </p>
      <p>If you have pretty tight copy that is near the final edit, you can do many things. I always try my darndest to honour consistent word &amp; letterspacing. However, to re-jig paragraphs to eliminate widows (another bunk style issue) I will adjust tracking +5 to -5 (InDesign). My word spacing settings differ depending on context, but I try to limit it to about 20% from minimum to maximum. As others have also admitted to, I will also allow minute horizontal scaling, depending on the typeface  (totally un-noticeable if done properly). Another neat little trick is to subtlely adjust the width of your text boxes. This does absolute wonders for errant bits &amp; bobs that need adjusting. This is also un-noticeable if done properly.</p>
      <p>It all seems like a pain in the ass for people demanding justified text, but necessary to keep clients happy. Have fun!</p>
