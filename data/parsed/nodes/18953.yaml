    html: |-
      <p>A trick I use - in Quark at least, I don't know Indy - is to work with H&amp;Js. I have three settings: tight, normal, and loose. Since H&amp;Js work more with word spacing than tracking it is usually less noticeable. Sometimes just changing from normal to tight can either fix a bad rag or pull up a widow. I also have a "no hyphenation" H&amp;J where that's required (some clients do specify that, but it can be problematic at times).</p>
      <p>It is always OK to use a hard return to bring down a pesky word, such as a "to" that is hanging off an edge visually. But you need to be extra careful about those hard returns if the text is edited later on so you don't end up with short lines.</p>
      <p>Also  you want to avoid creating "shapes" in the rag, unsightly bulges or indentations that are too smooth - a good rag will have a visual rhythm that doesn't attract attention to itself.</p>
      <p>Re hyphens: preferably no more than 2 in a row, never more than 3. I try to avoid them in ragged text but sometimes it can't be helped. They should not stick out too far. Also set your H&amp;Js so that there is a minimum of 3 characters either before or after a hyphen.</p>
      <p>For tracking I try not to go to more than -2 or +2 except in more forgiving fonts. But I always try to adjust the H&amp;J before I track.</p>
