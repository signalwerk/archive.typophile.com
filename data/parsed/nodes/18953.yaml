      <p>Sorry about that, Marty... I couldn't help that reaction.</p>
      <p>I don't know what computer program you are using to do your typesetting, but usually tracking is not a good idea for this. Depending on the program you are using, there are other options.</p>
      <p>As for your question about using hyphens, it depends on whether you want a tight or loose rag. Some people are okay with hyphens, some aren't. Even when you do allow hyphenation, there is a limit to how many hyphenated lines in a row look good (i.e., pleasing to the eye).</p>
      <p>I recommend getting a good book on typesetting -- plenty out there, but here's three of them:</p>
      <p>The Elements of Typographic Style, by Robert Bringhurst<br>
      The Thames and Hudson Manual of Typography, by Ruari McLean<br>
      Thinking with Type, by Ellen Lupton</p>
      <p>I hope this helps!</p>
