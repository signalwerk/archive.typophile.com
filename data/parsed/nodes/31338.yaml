      <p><cite>The empty space in the ‘O’ rising, reminds me of Obama himself - no substance.</cite></p>
      <p>Obama has plenty of substance—it just doesn't show because the American media reduces everything to soundbites, a practice entirely unsuitable for Obama's style of politicking. In the 1990s this might have worked in his favor, as he would have been able to travel the nation speaking and actually provide worthwhile answers in the debates. In this election it's a liability, as the numerous early primaries limit his ability to do a lot of speaking, and the crowded field will either limit debate responses to minuscule amounts of time or drag the debates on so long that only journalists will be watching.</p>
      <p><cite>I heard a black woman on the Colbert Report complaining that Obama wasn’t black enough...<cite></cite></cite></p>
      <p>Race, as a topic of conversation, is always at its ugliest in the political arena. It's almost scary how crass, stupid, or downright nutty politicos appear when discussing race. Joe Biden is a perfect example; by bringing up race his run became what will be remembered as the shortest presidential campaign in history.</p>
  - id: 184185
