    html: |-
      <p>&gt;Our visual culture is in too deep now.</p>
      <p>Maybe I wasn't clear. I absolutely think that the materials of candidates should be well designed, and there will be a standard presentation of their name. </p>
      <p>What I think Dan meant, and what I mean, is the graphic that accompanies the name. It is creating a feel good graphic that makes me uneasy. Having the flag or bunting is fine, as what that says in the US is that you are running for public office. The sunrise-through-the-fog-with-a-big-O thingy is taking it to another level. And maybe too slick. I put 'marketing' in quotes because I meant it in a bad sense--where the hype far exceeds the substance.</p>
  - id: 184240
