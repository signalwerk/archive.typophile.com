      <p>I just read Obama's announcement speech on his web site. His site has this version of the logo:</p>
      <p> </p><div class="imageWrap"><img src="http://typophile.com/files/obama08_3689.gif"></div><p></p>
      <p>I think it's quite a bit better than either of the above. Better balance and the meaning of the logo is clear.</p>
      <p>But I think Dan had a very interesting point:</p>
      <p>&gt;I don’t think that Congress people should have logos. I really don’t.</p>
      <p>Maybe that's what makes me uneasy about the way Obama is presenting himself at this outset. This logo stuff is too much 'marketing'--a calculated feel-good message.</p>
      <p>The speech has something very good, and something disquieting about it. The very good thing is that Obama sees that a central problem is that our politics is broken in partisan wrangling instead of solving  problems. </p>
      <p>What is disquieting, to me anyway, is that he seems to be relying on the force of his personality to change this. He says that good policies are not lacking--which I really questiion by the way. But more than that he does not lay out which policies he could make a reality, and why he could do it when others can't. </p>
      <p>Dukakis, Gore and Kerry all had the same problem. As I mentioned above, the two journalist pointed out that neither Clinton nor Bush had that problem. I will be looking with great interest to see whether Obama can pass that test of self-definition in a politically successful way. </p>
      <p>Marketing ain't going to do it. And certainly a logo or lack of one isn't going to do it. But they are revealing signals of what is going on, and not going on. Not as persuaders, but as indicators.</p>
