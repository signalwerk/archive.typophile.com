    html: |-
      <p>As creative people I think many of us would like to think that great design can help win a campaign. I used to think that. The short time I've been here in Washington and been involved in politics...sadly, sometimes it "don't mean sh!t." Its about money, people. No one goes to the voting booth because so-and-so's logo was cool. Who moved you? That's what people vote on. If anything, sometimes overly slick design can shoot you in the foot...people don't think you're real then. Personally, I'd rather eat at the greasy spoon joint where they spend more money on butter, than that tré chic place down the street with the swan folded napkins and the cool logo. And I'm a designer!</p>
      <p>That being said, George W's materials...as Eben pointed out— were brilliant. But they could have been done with Arial and been effective. Its about concept...not the look. You can really focus on design and still lose a campaign, case in point: <a href="http://www.jimesch.org" rel="nofollow">Jim Esch for Congress</a>. </p>
      <p>Lobbying, grassroots efforts, fundraising...there are TONS of other factors in play here. I'm glad Obama's out there, but I think it's way too early for anyone to start dissing ANY candidate out there now. Underestimate no one, including Hilary, Giuliani, McCain and Edwards. We've got nearly 2 years people...a lot can happen.</p>
