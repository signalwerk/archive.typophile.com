    html: |-
      <p>What I meant was that I don't think that Congresspeople, or even candidates for Congress, should have logos. That example that Terry Linked to is horrid. You can put together a noce look congressional campaign without resulting to logos and such a strict CI.</p>
      <p>I think it is perfectly acceptable—and unpreventable—that presidential candidates have logos and real graphic identities. And, even though it sounds a bit crass, Obama is not a "senator" any more. Of course he is still sitting in the US Senate. But now he is a Presidential Candidate. This will consume most of his time and effort for the foreseeable future.</p>
      <p>While presidential campaigns do not hinge on their visual design, in my opinion, I think that it is OK that they have designs. Almost all other politicians should not have this however. I think that it is just too much.</p>
