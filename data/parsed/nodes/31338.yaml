      <p><cite> I don’t think that Congress people should have logos. I really don’t. </cite></p>
      <p>Our visual culture is in too deep now. We cannot go back. Unless you specify a standard ( which is a logo too of sorts ) then you will have logos. How is this avoidable?</p>
      <p><cite> This logo stuff is too much ‘marketing’—a calculated feel-good message. </cite></p>
      <p>If that the way it feels than it's not working for you. But again I think the idea that Obama or any serious candidate can *not* engage in what is effectively marketing is silly. It just is't avoidable. Marketing is just another name for convincing. It's the name of the process rather than the result. Marketing is what we call it when it's a product. Campaigning is what it's called in politics.</p>
