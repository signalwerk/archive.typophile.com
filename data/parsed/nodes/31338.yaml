      <p>&gt;that his logo was weak in the first place may have been just another symptom of his weak campaign! ;-)</p>
      <p>Yeah, Dan, that's what I was thinking. There's a lot of visceral, unconscious reaction to a candidate that has an effect, and their approving a weak looking logo to me was symptomatic. I am still upset with Kerry's miserable performance. </p>
      <p>I saw two reporters interviewed about their very interesting book on Clinton and the current president Bush. Surprisingly, they said the two shared some things that were key to their electoral victories. First, they didn't get rattled when they had a reverse, but continued strongly on their campaigns. Second, they both knew what they wanted to do as President, and could say so coherently and forcefully, in 30 seconds, 3 minutes and 30 minutes. Of course Clinton knew infinitely more about policy, but that is another issue.</p>
      <p>My main concern about Obama is that he may represent a beautiful spirit but not clear policy. Aside from opposing the war, which is of course very important, we don't know what he wants or how he would govern.</p>
