  html: |-
    <p>Remember those 1970s science fiction dramas which had such charming 'futuristic' sets and backdrops?  Remember the intriguing 'future' lettering and signage the set designers would devise-often coupled with interesting 'futuristic' spellings?  Movella, Greater Albion's latest release, is something of a new departure for us and is a family of three typefaces inspired by that design ethos.  The three faces- regular, italic and the 3d solid form - are all capitals faces which combine a feeling of 'retro-futuristic' design with easy legibility.  </p>
    <p>Movella can now be found on Myfonts and Fontspring.  Here'a sample of it in action:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Movella_4796.png"></div><p></p>
