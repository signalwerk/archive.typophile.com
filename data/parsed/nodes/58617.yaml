    html: |-
      <p>As well as having your {locl} feature, You have to have your language declaration in the very bottom window on the feature section of the OT tab:</p>
      <p>languagesystem DFLT dflt;<br>
      languagesystem latn dflt;<br>
      languagesystem latn MOL;<br>
      languagesystem latn ROM;<br>
      languagesystem latn AZE;<br>
      languagesystem latn CRT;<br>
      languagesystem latn TRK;</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/loclfeature_5285.png"></div><p></p>
      <p>ChrisL</p>
