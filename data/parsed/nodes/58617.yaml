    <p>So I have just made my first <em>locl</em> feature (to substitute steeper acutes for Polish) and am very happy this works. However, when I select Polish as a paragraph's language in InDesign, this is also the only OT feature that works. All my existing –language UNspecific– features only work when I select any language <em>but</em> Polish (or Hungarian, which also has a language specific feature). I can't even select a different figure style! I mean I can select it, but it doesn't work. It seems like the language thing obliterates/overrides all other options.</p>
    <p>What's the deal – am I supposed to specify in the "general" features that they are for any language, and not just the DFLT?<br>
    (Apologies – this does feel like it's probably a rather stupid question…)</p>
