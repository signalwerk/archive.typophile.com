    <p>I am completing my shyness book and I'm looking for a typeface to use on the cover. </p>
    <p>I've been thinking of foil stamping on different materials to get an illusion/hidden effect.</p>
    <p>Any recommendations for a 'shy' font or any suggestion on printing techniques that would give an illusion/hidden effect?</p>
    <p>thanks.</p>
    <p>:)</p>
