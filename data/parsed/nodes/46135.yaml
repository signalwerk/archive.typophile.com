      <p>Andrew, glad you like it. For a smaller table you would use a smaller case, which would be harder to find than a California but still not really hard at all. I would recommend a caps-only case. Here's a web page showing a decent (but overpriced) collection:<br><a href="http://www.theoldprintingshop.com/typecase/">http://www.theoldprintingshop.com/typecase/</a></p>
      <p>In terms of pricing, I'd estimate it to be about 2/3-rds of the full-size table, so less than $375 (but don't quote me just yet). But then there's the shipping (which can actually be tamed by shipping it in parts for you to assemble, which is in fact what Mark went for). Let me know if you're interested.</p>
      <p>hhp</p>
