      <p>Seeking Inspiration: creative thinking around the design process<br>
    ================================================================<br>
    Seventh annual St Bride Library conference<br>
    15-16 May 2008<br>
    At St Bride Library, Bride Lane, Fleet St, London EC4Y 8EE</p>
    <p>The full price for tickets is £100 rather than £150; Friends can get<br>
    full-price tickets for £90.</p>
    <p>The full list of speakers is: Paul Antonio, Joel Armstrong, Antonije<br>
    Baturan, Sara De Bondt, Susanna Edwards, Katherine Gillieson, William<br>
    Hall, George Hardie, Rian Hughes, Robin Kinross, Emily Luce, Karel<br>
    Martens, Tyler Moorehead, Lizzie Ridout, Erik Spiekermann, Jeremy<br>
    Tankard, Jake Tilson.</p>
    <p>For more information, and to book online:<br>
    <a href="https://web.archive.org/web/20080907043359/http://seekinginspiration2008.stbride.org/" title="http://seekinginspiration2008.stbride.org/">http://seekinginspiration2008.stbride.org/</a></p>
