    html: |-
      <p>I don't see "languagesystem" anywhere on the page you linked to.  </p>
      <p>Fontlab 5 manual had this to say:</p>
      <blockquote><p>
      Language system<br>
      In practice, most or all of the features in a font will be registered under the<br>
      same set of language systems, and a particular feature's lookups will be<br>
      identical across the language systems that the feature is registered under.<br>
      The "languagesystem" statement takes advantage of this fact. It is the<br>
      simplest way to specify a language system in the feature file. One or more<br>
      such statements may be present in the feature file at global scope (i.e.<br>
      outside of the feature blocks or any other blocks) and before any of the<br>
      feature blocks:<br>
      languagesystem  ;<br>
      When these statements are present, then each feature that does not contain<br>
      an explicit "script" or "language" statement will be registered under every<br>
      language system specified by the "languagesystem" statement(s).<br>
      If no "languagesystem" statement is present, then the implementation will<br>
      behave exactly as though the following statement were present at the<br>
      beginning of the feature file:<br>
      languagesystem latn DFLT;
      </p></blockquote>
      <p>It doesn't really explain why or in which order to use multiple languagesystem tags.</p>
