  html: <p>What is the real purpose of these tags as declared by themselves in the lower right panel of the OpenType window in Fontlab?  I can understand how they are used in individual features to run substitutions for certain glyphs in certain languages, but what is the point of them sitting there in the beginning by themselves? Apparently you have to declare at least one, or you will get build errors now, but should I declare every system that my font supports?  A fixed and certain set of them across all my fonts (as long as the font supports them),  or as few as possible, or what?  Should they be declared in the order their glyphs appear in unicode?  Order of most widely used?  Does the order not matter at all?</p>
