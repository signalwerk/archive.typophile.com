  html: <p>What kind of jobs are out there for typography students and how do you go about getting into them?  On my graphic design course they are always telling us who's who in advertising and branding and what's on offer...but what about those of us who love type?</p>
  html_clean: <p>What kind of jobs are out there for typography students and how do you go about getting into them?  On my graphic design course they are always telling us who's who in advertising and branding and what's on offer...but what about those of us who love type?</p>
