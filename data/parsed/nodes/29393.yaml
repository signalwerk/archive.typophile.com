    html: |-
      <p>I think if you somehow manage to get into publishing, that's the closest thing to a 'typographer' these days. But you still have to do covers and  such. I just got a job at a publishing company, and if the love of what you do *and can prove it* comes across, seemed to work for me. My goal is to one day work at a private 'press' or something...DRG or Hyphen or something like that...</p>
      <p>Good luck</p>
