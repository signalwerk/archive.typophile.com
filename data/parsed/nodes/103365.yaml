    <p>Hi,<br>
    I'm new here, and thinking of copyright issues. I have searched the forum but haven't found satisfying answers to this:</p>
    <p>Can I modify/alter an existing font with a font software and use it in a commercial or non-commercial published work, for example a book or magazine. Probably the answer is usually NO, but what if I would mention the original font in the book/magazine and that I have re-cut it for this particular use? Or do I always need to ask a permission?</p>
    <p>Here's an example I noticed:<br>
    The sculptor Henry Moore's 'Late Large Forms' book published by Rizzoli uses an altered version of Spiekerman's Meta font (please correct me if I remember wrong) both in its headers and body text. As you can see from the cover image of the book, some of the letters are strongly altered, such as the upright corners of the letters e and g.</p>
    <p>I think the book is beautifully designed in every respect, but it does not tell anything about the font nor the designer. If anyone knows, I would like to know more, like does this kind of font use need a permission from the original font designer or the foundry. Obviously in Rizzoli's case the copyright issues and permissions are fine.</p>
