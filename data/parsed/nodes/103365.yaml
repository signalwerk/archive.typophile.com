    html: '<p>Meta? Definitely not. Gill Sans? I am not so shure. Gill Sans Series 362 is Gill Sans light. I think that this typeface here is Uhertype Grotesk by Jan Tschichold. Revived and expanded by Thierry Puyfoulhoux as  <a class="freelinking external" href="http://www.myfonts.com/fonts/presencetypo/tschichold/" rel="nofollow">Tschichold</a> It is very similar to Gill indeed, but when you look at ‘a’ and ‘t’ it becomes obvious that this is not Gill. The g without the bar does not seem to be included in the Tschichold typeface as currently available from Linotype or MyFonts, but Tchichold designed such a g for the first version of Uhertype Grotesk. You will find it in the book Active Literature: Jan Tschichold and New Typography by Christopher Burke. So the g on this book cover is either available in a customized version of the Tschichold typeface by Thierry Puyfoulhoux or this here is a revival of Uhertype Grotesk by another designer which included the g without bar in the font.</p>'
    html_clean: '<p>Meta? Definitely not. Gill Sans? I am not so shure. Gill Sans Series 362 is Gill Sans light. I think that this typeface here is Uhertype Grotesk by Jan Tschichold. Revived and expanded by Thierry Puyfoulhoux as  <a class="freelinking external" href="http://www.myfonts.com/fonts/presencetypo/tschichold/" rel="nofollow">Tschichold</a> It is very similar to Gill indeed, but when you look at ‘a’ and ‘t’ it becomes obvious that this is not Gill. The g without the bar does not seem to be included in the Tschichold typeface as currently available from Linotype or MyFonts, but Tchichold designed such a g for the first version of Uhertype Grotesk. You will find it in the book Active Literature: Jan Tschichold and New Typography by Christopher Burke. So the g on this book cover is either available in a customized version of the Tschichold typeface by Thierry Puyfoulhoux or this here is a revival of Uhertype Grotesk by another designer which included the g without bar in the font.</p>'
