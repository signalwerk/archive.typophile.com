    html: |-
      <p>1) Modify freely. To me no-mod clauses are rarely socially justifiable (and I personally class social justice above profit).<br>
      2) Make dead sure the modified version doesn't leak out. Obviously in a large operation this is 99% inescapable, so don't risk it. Large companies gotta pay up for formal permission.<br>
      3) If it <em>does</em> leak, don't try to weasel out of the consequences.</p>
      <p>Oldschool risk/accountability.</p>
      <p>BTW, has there ever been a case where a font house has confronted somebody based simply on seeing a modified version of one of their fonts used? (I mean as opposed to distributed, like happened with UPS/Meta.)</p>
      <p>hhp</p>
