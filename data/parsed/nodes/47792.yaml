    html: |-
      <p>I think the "corporate" direction is coming through as a result of the font choice. Not that it's necessarily bad, but I think something with a little more drastic style to it — especially since this is for a magazine — will serve your purpose better. Try experimenting with more extreme weight differentials between "ask" and "ungen". Or even extreme weights across the board (by that I mean ultra thin or ultra bold).</p>
      <p>All in all I think this is much better than you had before, but I do agree with Ratbaggy, that it may be too corporate for your intended audience.</p>
      <p>penn</p>
