    <p>Hello again!</p>
    <p>I'm doing logo and layout for my student organizations member magazine.</p>
    <p>It's a swedish magazine and is called "Askungen" wich translates to either cinderella or ash kid (ask ungen). The organizations name is ASK (Arcada Studerandekår). So the name of the magazine is an amusing one.</p>
    <p>I'm pairing Daw Wide, which is their font and can't be changed, with Caecilia. I already made the calender where I used this combination and I think it works quite well (<a href="http://petergranfors.com/clients/ask/kalender_klar.pdf" title="http://petergranfors.com/clients/ask/kalender_klar.pdf">http://petergranfors.com/clients/ask/kalender_klar.pdf</a>).</p>
    <p>Now i have started on a logo set in Dax Wide black. I'm planning on using Dax Wide light for headlines in the magazine and maybe Dax Wide black for larger articles. Caecilia will be used for body text.</p>
    <p>Here's what I got so far. I'd like to soften the Dax Wide and the two second versions are an attempt at that. The small text is Dax Wide bold in one version and Caecilia heavy in the other.</p>
    <p>Castigate away...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/askungen_logo_v1_5470.jpg"></div><p></p>
