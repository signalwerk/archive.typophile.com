      <p>If I remember rightly, Henri Friedlaender designed Hadassa partly under the influence of Jenson. At any rate, I think Adobe Jenson goes pretty well with it. </p>
      <p>As you know, the biggest problem with almost any Hebrew with roman is that the stress is opposite—thick horzontal vs thin vertical, rather than the other way around. Mixing them on the same line, as your text (a list of names) seems to require, is the most difficult thing, and the contrast approach, which otherwise can be very good, may be hard to bring off in that situation. </p>
      <p>So if you are going to use Hadassa, I would experiment with different sizes, weights and optical sizes of Adobe Jenson and see what harmonizes best. There are a whole lot of options with Adobe Jenson Pro Opticals, so you can probably find something that works reasonably well. I suspect you can find a combination that will work better than any of the fonts you’ve tried so far.</p>
