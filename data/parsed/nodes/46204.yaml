    <p>Hey there, </p>
    <p>I’m designing a Hebrew book, and looking for some advice on what would be the best Latin typeface to go together with the Hebrew face Hadassah.<br>
    Most of the English appearances would appear in brackets or parenthesis, in the middle of Hebrew sentences</p>
    <p>Attached is a gif with my final option, from top to bottom -<br>
    LinoLetter, Dederon Serif, Raleigh, Chapparel, Excelsior, Officina Serif</p>
    <p>So, any Typophile opinions?<br>
    which of these works best?</p>
    <p>Much thanks in advance,<br>
    Y.</p>
