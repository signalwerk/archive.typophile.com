      <p>First off... leave it to a Gentile calligrapher to make a typo!  :)</p>
      <p>If I am not mistaken it was one of Ismar David’s faces. Phenomenal artist who made his way to NY via Germany and Israel. His sculpture is above reproach. Time dulls historical memories but google him.</p>
      <p>The writing direction started to shift “back and forth” early on but was solidified in the sixth century B.C. Before that the writing, and, yes you are correct by the Greeks, was written boustrophedonically, as the oxen plows, literally reversing the non symmetric letters to suit the direction. Hence the multidirectional ethos of this piece. Subtle is always a plus in a design. I like the fact that most would not pick up on it.</p>
      <p>As to Hebrew ... just a choice that would make my design point (and a bow to my father who was an Old Testament scholar)... Greek would not have worked. And english, well I grew up with the King James. Last time I looked, English was/is my first language... es la verdad!</p>
      <p>Michael</p>
