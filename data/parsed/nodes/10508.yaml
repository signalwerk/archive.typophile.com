    html: "<p>If you search these forums, you'll find plenty of discussion on the font management alternatives: Font Reserve, Font Agent Pro, Master Juggler, etc. <br> <br>Keep in mind as well: it sounds like Tiger, which is out in a few days, will have new font management features.</p>"
