  html: <p>Hi everyone. <br> <br>The design studio I work for has just upgraded to the new 2.5 G5 systems and Panther10.3.9. we had been using 0s9 on G4's but they gradually started to die.  <br> <br>Basically im looking for advice on font management within our new environment, over the last couple of days I have read much on font management within OSX including PDFS from extensis (as we have suitcase 11) explaining how to remove font from certain areas in osx and leaving other etc. Having followed these guidelines we are still experiencing problems, font conflicts with certain applications, unexplained crashes etc etc. <br> <br>IWe would really appreciate advice or reccomendations on how any of you guys organise fonts on your systems or directions on where i could get some more help. <br> <br>regards  <br> <br>Rob P</p>
