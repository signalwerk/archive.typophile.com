    html: |-
      <p>This is the dumbest way of going about EULA.</p>
      <p>Those who care about following EULAs will search for it before purchasing. Those who don't, will just click through this page and get the fonts. There are also those who are oblivious to the existence of EULA, but showing them a wall of fine print is a sure way to force them to click through without reading. So, essentially, this page is useless, but it clearly rubs some people the wrong way.</p>
      <p>What would've worked better is a summary of EULA in few sentences of human speak + a link or an expandable page section with full EULA document.</p>
    html_clean: |-
