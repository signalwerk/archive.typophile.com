    html: <p>This has nothing to do with inviting someone into your home, or with 'being equals'. This is a company offering to sell you something, and what they are offering to sell you is <em>that license</em> to use their font software. That is what you are considering buying, so asking you to look at it and agree to its terms before you pay for it strikes me not only as sensible but what all software vendors should be doing. Isn't that better than the common model in which you pay for a software license but don't actually see and agree to the license until you go to install the software?</p>
