    html: <p>Presenting the EULA up front seems to me eminently sensible, and I don't see anything in asking people to acknowledge the terms of the license they are purchasing before they purchase it as 'a slap in the face'. This license is what you are choosing to purchase or not, so giving you an explicit choice regarding its terms is sensible, and should have been the norm for software licensing from the beginning.</p>
