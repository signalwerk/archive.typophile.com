    html: <p>Hi Alejandro, we are on the same track...I did a mock up with Sophisto. I did not try Lineto or Alias. I have a few of these fonts but Lineto is a bit sterile for the name " Bravo" . Alias is nice but  <br>not all there. Fontsmiths  "Sophia" was also a consideration. but it is almost too curvacious. I spent about $90 to discover this, (for a single weight).</p>
