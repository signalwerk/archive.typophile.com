  html: |-
    <p>The image is from the Wikipedia article "VU Meter" - I feel that this style of font, with the very low cross on the A and the distinctive K, is often seen on older technical equipment like this but I can't seem to identify anything exactly like it.  If anyone has any ideas that would be great!</p>
    <p><a href="http://en.wikipedia.org/wiki/VU_meter" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://en.wikipedia.org/wiki/VU_meter</a></p>
    <p>Thanks.<img src="/sites/default/files/old-images/peak_5646.png"></p>
    <p>EDIT: Thanks a lot guys; I think idiotcountry got the closest here, cheers!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/peak.png" width="52" height="13" alt="">
