  html: |-
    <p>The image is from the Wikipedia article "VU Meter" - I feel that this style of font, with the very low cross on the A and the distinctive K, is often seen on older technical equipment like this but I can't seem to identify anything exactly like it.  If anyone has any ideas that would be great!</p>
    <p><a class="freelinking external" href="http://en.wikipedia.org/wiki/VU_meter" rel="nofollow">http://en.wikipedia.org/wiki/VU_meter</a></p>
    <p>Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/peak_5646.png"></div><p></p>
    <p>EDIT: Thanks a lot guys; I think idiotcountry got the closest here, cheers!</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
