      <p>With Code2000, the text you pasted in your post, when viewed in this thread (just above)  now looks like this in Firefox<br>
      </p><div class="imageWrap"><img src="/files/typophilegrab_4622.jpg"></div><br>
      The combining acute is not positioned properly (that is something I can’t stand) but the browser at least displays the characters.<p></p>
      <p>By the way, if your font does not display the text when you paste it in TextEdit, then the problem does not come from the browser. If you are certain you tested those characters in the past and they were working properly, then, as I said, there may be a mess in you fonts, i.e. there may be different versions of the font installed in many places and the one that is accessed by your system is not the one you think. I would go in FontBook, select “All Fonts”, uninstall Andron completely, reboot and than install in one place the last tested version. </p>
      <p>Michel</p>
