    <p>Hi everyone. I am looking for a face similar to <a class="freelinking-external" href="https://web.archive.org/web/20080906195841/http://www.typography.com/fonts/font_styles.php?productLineID=100033">Archer</a> Italic. I love the whimsical aesthetic, with the curved serif’s, but I’ve been unable to find anything remotely similar. </p>
    <p>You may ask, why not just use Archer? Good question, the client is unable to dish out $300 for the package. So budget is an obstacle (what else is new, right?).</p>
    <p>Any help would be fantastic. Thanks so much.</p>
