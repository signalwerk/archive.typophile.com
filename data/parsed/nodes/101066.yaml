      <p>Fair points. As I said, I'm undecided. I wouldn't ask MyFonts to change anything; they've been good to me! It was just an idea. I'm not really concerned about cheapening my brand by putting things on offer. If I was overly concerned with my 'brand' I'd have ditched a load of fonts by now. I guess I just feel for newer foundries whose only way of gaining exposure is to underprice. I have a feeling this pricing model may just be a trend that is unsustainable in the long run. I hope so anyway.<br>
      My worry is that customers may stop buying any fonts at full price, knowing that vastly discounted fonts are never far away. Hopefully though, this may cause foundries to make ever more interesting and different fonts, as big discounts cease to be a factor in separating their fonts from others', because virtually all fonts are hugely discounted.<br>
      BTW, I don't wish to come across like I'm saying all fonts with big discounts are bad, or that big discounts are inherently a bad thing. I just wanted to carry on the discussion where participants could use more than 140 characters!</p>
