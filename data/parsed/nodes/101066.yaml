      <p>As Ralf notes, it was the foundries, not MyFonts, that developed the concept of extreme introductory discounts.  Probably the first full family sold at a breath-taking introductory price on MyFonts was HVD’s Pluto in mid-2011; it has remained a seller at full price. But I wouldn’t be surprised if Hannes was inspired by the high-profile introduction of Axel (a Spiekermann production) two years earlier by FontShop Germany at less than €/$ 20 for a four-weight family.<br>
      While typohiles (including some of us at MyFonts) may have mixed feelings about the trend, it does have its positive aspects. Typically, non-pro and semi-pro customers have always bought single weights, even when volume discounts on larger (text) families were substantial. Thanks to the family-at-the-price-of-one-weight craze, average users have become familiar with the idea of buying an entire type family, which  to many always seems to have looked like a rather extravagant and unnecessary kind of purchase. So while some argue that low prices teach people a wrong thing (fonts can be cheap) it might also teach them something  good: fonts don’t necessarily come one at a time.</p>
