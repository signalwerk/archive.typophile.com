      <p>Todd, very well expressed.</p>
      <p>Ralf, the reality is that many customers simply don't think the way you describe. If the price drops a great deal on something bought the day before, many people don't just feel unlucky, they feel betrayed. And quite often that feeling is entirely rational because companies don't decide to lower a price 5 minutes before, they've already decided at the time you bought it for the higher price. And when people feel betrayed by a company, the company pays for it - either by having to give back money or credit, or by losing a future customer (often due to word-of-mouth).</p>
      <p>In many US department stores when you're about to buy something at full price, they will actually tell you to wait until the next day when the item will be discounted! Are they stupid to do that? I think they're very clever. And try using an expired coupon at almost any fast-food place: does it work? Yes. Think about why that's the case.</p>
      <p>Retail businesses don't get rich by being fascist about rules.</p>
      <p>hhp</p>
