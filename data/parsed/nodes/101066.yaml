      <p><cite>the system as it is now is starting to force foundries making decent fonts to discount heavily</cite></p>
      <p>No one is forced to anything. Those are “market penetration” offers. They are supposed to reach an audience which has over 100.000 fonts to choose from and hundreds of new Twitter messages every day. So for a short period of time you make a loud offer people can't resist and by this you spread the word. That's it.<br>
      Those fonts don't sell because they are in the bestseller list, but because of the offer itself, which is such a good deal that people start to spread the news and that creates the snowball effect. So I don't think it's caused by the list or it's calculation. </p>
      <p><cite> If it continues, it won't be long before every new release is 99% off for a month … </cite></p>
      <p>Certainly, that will happen for some fonts. </p>
      <p><cite>…&nbsp;then never sells again after that. </cite></p>
      <p>MyFonts is just a retailer. It's up to the foundry to keep the sales up and there are many different strategies to achieve this. A bestseller list is just that. It shows what sells. It can't weigh anything to support “quality fonts”.<br>
      Maybe they could start an “Editor’s choice” section where quality fonts are suggested, but I don't think we need to blame the calculation of the bestseller list for how foundries set up their pricing.</p>
