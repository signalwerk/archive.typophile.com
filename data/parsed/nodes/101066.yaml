    html: <p>If I were licensing retail fonts through a major distributor like MyFonts, I would be inclined to try a kind of Reverse Dutch Auction release pricing. A Dutch auction involves a gradually reducing price for a limited commodity (classically, flowers). A reverse Dutch auction seems to me a good model for an unlimited, digital product, for which the price gradually increases over time. So begin with a massively deep discount for, say, a week, and then start incrementally increasing it up to the full retail price. The latter could either be a fixed amount comparable to other fonts, or simply at whatever level the particular font continues to sell an average of X licenses per week. Just an idea. I've no idea how well it would work in practice, so don't blame me if you try it and end up unhappy with the results. If you do try it, please let us know how it goes.</p>
