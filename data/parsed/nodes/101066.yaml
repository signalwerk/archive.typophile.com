      <p>I do think that people will be reluctant to buy X at ten times the price X was available at last week.</p>
      <p>On the other hand, with fonts, the only reason someone has to have X, instead of Y or Z, is because it's what everyone else is using, it's what is fashionable. Popular, recognized typefaces get specified by name.</p>
      <p>So low prices work, in that they remain profitable if the ultimate sales volume is high enough. And high prices don't make sense for the thousands of me-too fonts.</p>
      <p>It seems to me that it's <em>very</em> hard to be a financial success from designing new typefaces.</p>
