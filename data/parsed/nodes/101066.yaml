      <p>Oh I think it should be a well-advertised pricing structure. Although the calculations differ, the idea is the same as for a regular Dutch auction, to enable the buyer to make reasoned decisions within a predictable structure. Because Dutch auctions apply to limited commodities, there is an element of gamble involved in waiting for a lower price (someone else might be willing to pay more, and you'll be left with nothing). In my reverse model, with rising price, there is no gamble but there is pressure to buy early, increasing upfront revenue, but without the simple jump from deeply discounted to full price. I see it also as a useful tool for designers dealing with clients: "This is the font we want to use for your job, but the longer you delay decisions/budget/PO the more it is going to cost."</p>
      <p>The other benefit I see in the model is that it provides a trackable progress of sales relative to price -- adjusting for other factors --, which is something sellers generally lack. The process by which the 'market' determines price is generally pretty much guesswork: a seller looks at similar products, and guesses how much he might be able to charge. He typically has no data to tell him whether he might, in fact, make more money selling at a slightly lower price or if he might sell the same volume at a slightly higher price. By gradually increasing the price over time, one can collect information on buying behaviour relative to price.</p>
