      <p>When I started noticing these 90% discounts I thought, "This is an industry on its knees." As a consumer it made me feel very uncertain about my vendors (ie: people I buy fonts from). 90% discounts indicates an uncertainty about product value, as well as a great deal of semantic ambiguity when we try to define price and value to our end clients using product terminology that applies to physical objects, even as an analogy (any discussion about piracy, EULA, licensing fees tends to wander into this word-territory).</p>
      <p>When I go and spend 600 euro on a font I will email the designer and ask if they respect their product enough to not go and have a fire sale next week. And if there is a fire sale, I want a refund on the difference. Granted, this discussion mostly pertains to new releases.</p>
      <p>I like John Hudson's idea. It's rational and it provides motivation for buying. And that's the key: it's rational. The massive discount model (a discount ending when? and why?) has no explicit rational foundation -- by which I mean the buyer or end-user can't determine the reason. Sure, I'm seeing the reason in this thread, but not at the point of purchase.</p>
      <p>And the real end user, the final client, what do I say to them? "Well, this font's not as good but it costs 99 cents at a 95% discount." Most people have never heard of discounts like that except on flawed or blemished goods; goods that don't work properly; children's toys made of lead at a night market.</p>
      <p>Ultimately, I want beautiful work-horse typefaces that I have to pay a fair bit of money for and not everyone can afford. Snobbery? Yes: an arbitrary taste-making distinction. Fortunately, I'm well served by dealing directly with the foundry.</p>
      <p>All of this leads me to think the 90% discounts harm the myfonts brand more than anything else. Mostly because their top-seller charts are unreliable indicators.</p>
