      <p><em>…fear these huge discounts: they might create a market where nothing but extremely cheap or discounted fonts sell well. </em></p>
      <p>That’s not the way the Long Tail works, and MyFonts is very much a Long Tail marketer in a Long Tail product category.</p>
      <p>For instance, Shinntype rarely has fonts in the MyFonts top 50 and doesn’t offer huge introductory discounts or free anything, but this distributor provides us with a steady income from incremental sales of many typefaces, some of which (Beaufort and Handsome) have been there since MyFonts started over 12 years ago.</p>
      <p>Fonts differ from most (consumer) products in that they are not fundamentally subject to rapid obsolesence or the immediate hard sell of a special offer. When someone is looking for a font for a particular project, especially when doing a keyword search, they will consider a variety of typefaces, not just what’s hot at the moment. They might remember something that caught their fancy several years ago, but which they haven’t yet had the opportunity to use.</p>
      <p>Typefaces can become fashion items, but they are also extremely durable, both stylistically and technologically.</p>
      <p>Ultimately, if one applies the Long Tail or Zipf distribution to itself, it becomes apparent that while one end of the curve is subject to fashion, price, and popularity, a large part of the market does not follow these principles.</p>
      <p>For instance, the Scotch Modern is not presently considered a good text type, and the Shinntype version is very expensive, has never been discounted, and has never made a best-seller list. Yet once in a while someone somewhere decides they gotta have it. Niche.</p>
