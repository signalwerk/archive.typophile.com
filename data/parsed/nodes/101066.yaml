      <p>If I may jump in one more time, I think the reality is that because certain fonts are ubiquitous, and it is only a subset of users who are even interested enough to care, the niche for fonts is just that, a niche; if it works better for designer "A" to build extremely high-quality fonts with full character sets and s/he is able to sell that work at a price which is fair to their efforts, great. On the other end, if designer "B" is just messing around and wants to sell some of their hobbyist labours for $5-20 a shot, and they sell a few, great. I know my co-worker at the small office where I work is pretty oblivious to fonts, whereas to me, they mean and signify a great deal.</p>
      <p>So maybe it's like the book market; mass-market low quality Harlequins sell because they fill a niche, and high end literary books sell because they fill a niche. The Harlequin will generally make a greater profit, but there is no question which is the better quality book.</p>
