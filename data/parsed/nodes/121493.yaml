      <div class="comment-spam-body"><p>Wren is the English version of Tiemann Mediaeval designed by Walter Tiemann in 1909. There is a digital version by Gerhard Helzel.</p><div class="imageWrap"><img src="http://typophile.com/files/TiemannMediaeval@Helzel_4742.png"></div><br>
      See page 15 of his specimen book:<br>
      <a href="http://www.romana-hamburg.de/Schriftmappe.pdf" title="http://www.romana-hamburg.de/Schriftmappe.pdf">http://www.romana-hamburg.de/Schriftmappe.pdf</a><br>
