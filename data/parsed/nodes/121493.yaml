    html: |-
      <div class="comment-spam-body"><p>Pre WW I spur serif design. Can't decide if it is lettering or was a font. I did not spot an obvious digital substitute.<br>
      Scale is small but it may include an  arrowhead termination on the goose-neck terminals of _C_, _G_ and _S_.<br>
      The leg on _R_ reminds me of some Goudy fonts from the era, such as Goudy Oldstyle </p><div class="imageWrap"><img src="http://typophile.com/files/GoudyOldstyleAsGreys_5824.gif"></div> <a href="http://www.myfonts.com/fonts/lanston/ltc-goudy-oldstyle/" title="http://www.myfonts.com/fonts/lanston/ltc-goudy-oldstyle/">http://www.myfonts.com/fonts/lanston/ltc-goudy-oldstyle/</a><br>
      Some general similarity Vertrina <div class="imageWrap"><img src="http://typophile.com/files/VertrinaAsGreys_5784.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/gatf/vertrina/" title="http://www.myfonts.com/fonts/gatf/vertrina/">http://www.myfonts.com/fonts/gatf/vertrina/</a><br>
      Possible substitute, which differs in many details, is a Mark Simonson recreation of a 1920s lettering style called Goldenbook<br>
      <div class="imageWrap"><img src="http://typophile.com/files/GoldenbookAsGreys_6338.gif"></div> <a href="http://www.myfonts.com/fonts/marksimonson/goldenbook/" title="http://www.myfonts.com/fonts/marksimonson/goldenbook/">http://www.myfonts.com/fonts/marksimonson/goldenbook/</a><br>
      Don<p></p>
      </div>
