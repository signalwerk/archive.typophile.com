      <div class="comment-spam-body"><p>The Goudy 38 is a closer Goudy -- here is the Book weight</p><div class="imageWrap"><img src="http://typophile.com/files/Goudy38BookAsGreys_5992.gif"></div><br>
      Nevada is also interesting<br>
      <div class="imageWrap"><img src="http://typophile.com/files/NevadaAsGreys_4083.gif"></div><br>
      Looking at the _G_ I note, in addition to the high bar, a small spur on the chin, a feature shown on Vertrina and quite a few fonts of the era.<br>
      Don<p></p>
      </div>
