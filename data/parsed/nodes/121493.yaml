    html: |-
      <p>For overall letter forms, I think it may have been based on something like Goudy Medium (just raise the crossbars on the |H|, |G|, and |E| and rein in the serifs):<br>
      <a href="http://www.myfonts.com/fonts/redrooster/goudy-38-rr/" title="http://www.myfonts.com/fonts/redrooster/goudy-38-rr/">http://www.myfonts.com/fonts/redrooster/goudy-38-rr/</a></p>
      <p>For general look and feel, but still missing some crucial details (such as the |R| and some serifs), these might also work for recreations:<br>
      <a href="http://www.myfonts.com/fonts/linotype/aperto/" title="http://www.myfonts.com/fonts/linotype/aperto/">http://www.myfonts.com/fonts/linotype/aperto/</a><br>
      <a href="http://www.myfonts.com/fonts/fontbureau/grand-central/" title="http://www.myfonts.com/fonts/fontbureau/grand-central/">http://www.myfonts.com/fonts/fontbureau/grand-central/</a><br>
      <a href="http://www.t26.com/search?q=Glosso" title="http://www.t26.com/search?q=Glosso">http://www.t26.com/search?q=Glosso</a></p>
      <p>There’s also a passing resemblance to Korinna, which was designed in 1904 (the serifs are way off, but the overall form isn’t bad):<br>
      <a href="http://www.myfonts.com/fonts/adobe/itc-korinna/" title="http://www.myfonts.com/fonts/adobe/itc-korinna/">http://www.myfonts.com/fonts/adobe/itc-korinna/</a></p>
      <p>Nevada Serial captures some of the details (especially the |E|):<br>
      <a href="http://www.myfonts.com/fonts/ef/nevada/" title="http://www.myfonts.com/fonts/ef/nevada/">http://www.myfonts.com/fonts/ef/nevada/</a></p>
    html_clean: |-
