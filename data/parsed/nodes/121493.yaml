    html: |-
      <div class="comment-spam-body"><p>The engraving or lithography used to make the lid design may have been made by an English craftsman who was familiar with a font sold in England as Wren, which has the sucking lemon _G_ with a tall bar and a small spur on the chin, and various similarities in other letters. </p><div class="imageWrap"><img src="http://typophile.com/files/WrenLight@Klingspor@PrintingTypesP72SM_4803.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/WrenBold@Klingspor@PrintingTypesP72SM_5452.jpg"></div><br>
      Don<p></p>
      </div>
