      <p><em>Sorry Mark, I forgot to add the “sarcasm emoticon”.</em></p>
      <p>That’s a relief. I thought it was hideous and I was starting to feel sorry for you. You’re new here, so I wasn’t quite sure you weren’t serious. People sometimes do think such things are cool.</p>
      <p>It’s difficult to convey a sense of humor online. In person (or even on the phone), people can (usually) tell you’re kidding. I resort to emoticons more often than I’d like. They are useful in a dumb kind of way.</p>
