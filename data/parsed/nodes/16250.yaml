    html: |-
      <p>The lowercase characters are just Monotype Corsiva (a.k.a. the Zapf Chancery stand-in) rotated backwards a few degrees. It looks like the “ng” was rotated as a unit. The ampersand is Times New Roman. The two S’s appear to be Garamond, stretched a bit horizontally. </p>
      <p>This is not what <em>I</em> would call fine typography. An interesting amateur effort, though. (Sorry for the dismissive tone, but that’s my honest opinion.)</p>
