    html: |-
      <p>The task is a tricky one, since the subject matter predates any form of writing.<br>
      My first impulse would be using something archaic looking (<a href="http://www.stonetypefoundry.com/numaoverview.html" title="http://www.stonetypefoundry.com/numaoverview.html">http://www.stonetypefoundry.com/numaoverview.html</a>), but probably it could end up looking very feigned.<br>
      So I think the approach could be either something as neutral as possible, or something very contrasting (I'm thinking techno/sci-fi here, think 2001).<br>
      As for the actual cover, I think I can understand the reasoning behind it. But, in the same vein, I would rather have gone with a graffiti-like look.</p>
