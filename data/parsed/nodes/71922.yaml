  html: |-
    <p>Hi All,</p>
    <p>I'm looking for a typeface to start a personal book cover design project with.</p>
    <p>There is a Phaidon book titled "Cave Art," which is a beautiful book that is currently being sold with an ill thought-out dust jacket.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/caveArt_5367.jpg"></div><p></p>
    <p>I'm hoping to make my own dust jacket for the book – at least it will look better on my shelf – and was hoping to get this community's opinions on an appropriate typeface to begin the redesign project with.</p>
    <p>In Derek Birdsall's "Notes on Book Design," the author talks about a book he produced (also as a personal project) about human technology though history and pre-history. His take on hyphenating the word "technology" in the title seems to modernize the potentially stodginess of the all-caps display serif.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/derekBirdsell_5170.jpg"></div><p></p>
    <p>Thanks in advance for your input.</p>
    <p>Best,<br>
    Roy</p>
