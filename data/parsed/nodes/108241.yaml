    html: <p>Thanks, that's what the designer said he used (Giovanni Book Light), so he may be wrong on the finer details. I am an in-house designer set with the task of developing the rest of the ID templates. I will check out Calluna and Eureka. I like the idea of matching the "e", and will also try to find sans fonts that use the older style "g" and "a" as used by Giovanni.</p>
