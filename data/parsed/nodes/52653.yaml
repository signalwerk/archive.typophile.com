    html: |-
      <p>"...varying grades generally represent a change in weight without a change in width or height."</p>
      <p>That is what we invented the term grade for, changes to weight exclusively, and predominantly to deal with issues at the press, or today, on screens. This was initially accomplished for Playboy in 1990 to account for the difference between offset and gravure printing and then was applied more generally to similar issues in the printing of newspapers by 1995.</p>
      <p>"...you need a smaller size, you choose a heavier grade (&amp; most likely track it more loosely)"<br>
      You can use them this way assuming you do not have a complex typographical hierarchy depending on matching metrics across grades, and you can find suitably graded bold and italics for your use. </p>
      <p>Cheers!</p>
