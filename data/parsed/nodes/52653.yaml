    <p>I have been looking at Mercury in the course of trying to select a typeface for an upcoming book project (my first 'serious' book actually!), and got pretty excited about them offering different <em>grades</em> to offset differences between paper / printing circumstances. </p>
    <p>Now to my uninformed eye, <a href="http://typography.com/fonts/font_features.php?featureID=1&amp;productLineID=100017" rel="nofollow">the difference between the grades</a> looks very similar to the difference between optical sizes in other typefaces, except that the different grades all share common widths / metrics so as to be interchangeable at any time. – Also, on <a href="http://typography.com/ask/recentTopic.php?rtID=89" rel="nofollow">the H&amp;FJ page that helps in choosing a grade</a>, under the <em>Book</em> section it says, <em>"Book designers who use uncoated stock (and can rely on good inking) typically select Grade Two. Those who routinely run very small type, such as footnotes or captions, should consider adding Grade Three."</em></p>
    <p>Now – wouldn't that effectively mean using the heavier grade in the function of a smaller optical size?</p>
    <p>So, can 'grades' indeed be seen as sort of an elegant digital adaptation, or expansion, of the concept of optical sizes – as in, you need a smaller size, you choose a heavier grade (&amp; most likely track it more loosely) – but also, if you need the same size but the print comes out too light, you can choose a heavier grade as well without the layout changing?<br>
    Or am I mixing up apples and oranges?</p>
    <p>(If this sounds confused, it's probably because I am. :) )</p>
