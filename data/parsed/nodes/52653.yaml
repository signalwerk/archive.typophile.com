      <p>I think you had it perfectly right in your first post, no confusion at all ;)</p>
      <p>Re. the changes in contrast and robustness: You can think of grade four in your example as grade one plus "built-in" ink spread. Because ink spread adds a fixed amount of weight to every line (hairlines and stems alike), the consequence is, as you noted, lowered contrast and a sturdier look.</p>
      <p>For example, if your hairlines are 40 units wide and the stems 120 units, you've got a contrast ratio of 1:3. If you add an ink spread of 10 units to each contour, hairlines are then 60 units wide (10 + 40 + 10) and stems are 140 units wide, thus the contrast ratio has been lowered to 1:2.33.</p>
      <p>This change in weight is different from the way you usually change a letter's weight when making a bold weight from a regular one, where you would change the letter's proportions (baseline, cap height and x-height (mostly) stay the same), and change the contrast in the other direction (keep hairline width, make stems wider so the contrast is effectively raised).</p>
