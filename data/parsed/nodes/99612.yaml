    <p>Dear All</p>
    <p>I'm looking for suggestions for fonts that give the feeling of the 'beat generation' please.  In an ideal world they'd be US fonts circa 1948-55 but the date isn't an essential feature~ far more important is the 'beat' feel of the font! </p>
    <p>I'm throwing this one open to you folks- any and all feedback very gratefully received!</p>
    <p> Many thanks</p>
    <p> Steve</p>
  html_clean: |-
