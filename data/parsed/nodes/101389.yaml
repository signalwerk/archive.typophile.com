      <div class="comment-spam-body"><p>For an assortment of cigarette advertisments from the 1950s check <a href="https://www.google.ca/search?q=cigarette+advertisements+players&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=ssLRVP7WN4GwggTF04KIAw&amp;ved=0CC4QsAQ&amp;biw=918&amp;bih=904#tbm=isch&amp;q=cigarette+advertisements+1950s" title="https://www.google.ca/search?q=cigarette+advertisements+players&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=ssLRVP7WN4GwggTF04KIAw&amp;ved=0CC4QsAQ&amp;biw=918&amp;bih=904#tbm=isch&amp;q=cigarette+advertisements+1950s">https://www.google.ca/search?q=cigarette+advertisements+players&amp;tbm=isch...</a><br>
      Unfortunately the Google 1950s filter does not exclude ads from other decades so you have to check them one by one. When you find an ad from the collection that is indeed a 1950s ad you have a good chance of duplicating the fonts in it. Some of the word logos on major cigarettes, such as Marlboro, have been made into fonts. By the 1950s much of the display lettering in ads used fonts rather than being hand lettered as in earlier decades. If you do not recognize the fonts in a particular ad, I suggest you send a request, with the image, to the Font ID forum at <a href="http://typophile.com/typeid" title="http://typophile.com/typeid">http://typophile.com/typeid</a><br>
      Don</p>
      </div>
