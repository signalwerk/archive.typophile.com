    <p>I’m looking for a specific typeface for a logo concept that I have.</p>
    <p>The concept involves letters which are blurred and a plug symbol that represents/stands instead of letter “o”. Typeface I’m looking for should not be like Nevil Brody’s typeface Blur which infact has solid edges but it needs to be really blurred with blurred edges (because it needs to be in contrast with the solid plug symbol and also visible at small logo sizes). I guess there isn’t such typeface so I’m looking for type which is :</p>
    <p>1. propper for blurring (so the letters don’t melt in a way one wouldn’t be able to read it)<br>
    2. target audience is between 23 and 40 years of age, mostly women.<br>
    3. The type should probably match plug symbol in some way(???)<br>
    4. The client we’re designing logo for is a center for active creating of life that the person will love so the keywords connected to the project include: initiative, energetic, human, optimism, creative, life loving. Should represent a center which help people achieving that.</p>
    <p>The photo of our idea is attached. I’m only looking for a different typeface.</p>
