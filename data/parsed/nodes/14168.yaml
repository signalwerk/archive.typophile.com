    <p>I regularly create fonts for scripts encoded outside of Plane 0 of Unicode.  I haven't been able to properly encode these in FontLab (which is all I have), so I have to continue using a legacy encoding which places these characters in the Latin-1 range.</p>
    <p>Specifically, I'm talking about my fonts for the <a href="http://www.omniglot.com/writing/shavian.htm" rel="nofollow">Shavian</a> alphabet, but I use others as well.  After searching the forum history, I've found nothing that looks like a solution to this problem, so I appeal to you for assistance.  I considered simply creating a new codepage (something with which I'm not really very familiar), but FontLab doesn't seem to recognize the correct Unicode code points anyway.  I suppose I could go ahead and try it, but failing that, does anybody have any suggestions?</p>
