      <p>Apple makes available some free tools to edit the tables in TT fonts.  See <a href="http://developer.apple.com/fonts/" title="http://developer.apple.com/fonts/">http://developer.apple.com/fonts/</a> ; they look pretty non-user-friendly (at least to a non-programmer like me) but they would probably do what you need.  For the record, I should say that all my experience has been on Windows, so I can't say for sure that FL on the Mac will behave the same way.</p>
      <p>David</p>
