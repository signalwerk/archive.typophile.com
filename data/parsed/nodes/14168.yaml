      <p>I've had a look at Apple's font tools, but I don't know enough about Unix to use them effectively.  I could learn, I guess.  It'll just take some time.</p>
      <p>Anyway, I tried the workaround just to see what would happen.  The font generated just fine (I only tried name mode), and it was useable without crashing my text editor, though I didn't try Word.  The added Unicode characters, however, were not available as such.</p>
      <p>The first time I tried it (a test to make sure I had the right code points), the font worked, except it behaved as though the extended characters were in the wrong place (probably a cmap problem).  I tried again with more characters, and it did basically the same thing.  However, the second time none of the characters could be inserted from the Character Palette, since every character was labeled as an alternate.</p>
      <p>So the summary of my experience with this workaround for Mac FontLab: Characters in the supported BMP range will be useable, generally, but others probably won't.  Though there wasn't a crash, it's probably just the same cmap problems.  I guess I'll just have to try Studio 5.</p>
