    html: |-
      <p>The current version of FontLab does not support characters outside the BMP directly, but there is a workaround.  Give your character the appropriate uXXXXX name, such as u10500 (depending on its value); leave the Unicode value blank, since FL won't let you enter a five-digit value.  When you generate the font, FL will assign any character with a uXXXXX name to corresponding Unicode value.</p>
      <p>But there is a bug; FL usually creates a faulty cmap table.  Instead of Format 12, you get something like 12.125 (the exact value varies).  You have to manually edit the cmap to fix this; I do it in VOLT (Tools/Options), but I know there are other cmap editors around.  If you don't take this second step, the font will appear to install correctly but your word processor will crash abruptly when you attempt to access one of your supplementary characters.</p>
      <p>This is a bit of a pain, but it works; I have been making fonts with Plane 1 characters this way for some time now.</p>
      <p>David</p>
