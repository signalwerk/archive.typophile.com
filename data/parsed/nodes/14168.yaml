    html: <p>You can also edit cmaps directly using TTX, which is free and available for both Windows and Mac. TTX dumps fonts or individual tables to a human-readable and editable XML document, which can then be fused back into a font. I generally find it best to dump individual tables rather than whole fonts.</p>
