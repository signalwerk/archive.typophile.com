    <p>On Monday, 17th September 2007, "at high noon", watch the final anti-trust 500 million fine "showdown" decision:</p>
    <p>The two opponents in this "shootout" are </p>
    <p>1. <strong>Neelie Kroes</strong>, see photo here:</p>
    <p><a href="http://ec.europa.eu/commission_barroso/kroes/index_en.html" title="http://ec.europa.eu/commission_barroso/kroes/index_en.html">http://ec.europa.eu/commission_barroso/kroes/index_en.html</a></p>
    <p>2. <strong>Steve Ballmer</strong>, see photo here:</p>
    <p><a href="http://www.microsoft.com/Presspass/exec/steve/default.mspx" title="http://www.microsoft.com/Presspass/exec/steve/default.mspx">http://www.microsoft.com/Presspass/exec/steve/default.mspx</a></p>
    <p>Who will shoot faster at high noon on Monday?</p>
    <p>Who will be the first to release the trigger?</p>
    <p>Don't forget to bet at your favorite betting office.</p>
    <p>Have fun :-)</p>
