      <p><em>youre a bunch of uptight pricks i was just looking for some help as a student to an experienced designer, but if you wanna hate then hate.</em></p>
      <p>No one said anything inflammatory. Everyone one typophile usually seems to want to genuinely help. I don't think your reactions are helping your case here.</p>
      <p><em>“licensed fonts”???? i dont know what rich school you went to but but we dont even get free color prints</em></p>
      <p>If your school hasn't purchased any fonts, I bet you've still got a lot to work with bundled with your operating system and software.</p>
      <p>The fact is fonts cost money. I still think taking the time to draw your own type might be the way to go. If you have any idea of what you want it to look like, just go for it.</p>
