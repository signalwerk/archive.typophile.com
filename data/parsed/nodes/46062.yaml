    <p>Spoonflower (<a href="http://www.spoonflower.com" title="http://www.spoonflower.com">http://www.spoonflower.com</a>) will take jpg files and turn them into custom fabrics. Still in beta (you can apply for an invitation) and only printing to lightweight cotton, but they plan to expand their range of fabric offerings.</p>
    <p>Looks pretty interesting, if you want to turn a font into a set of curtains, or a pillow, or....</p>
