    date_raw: 12 Apr 2011 — 5:54am
    votes: null
    html: <p>It might be an issue related to your tracking value. In InDesign ligatures (and other related features) are automatically disabled if your value for tracking is too high (while they do work in Illustrator). Try setting Tracking to 0 for your text. And, I assume that Ligatures are switched on in your existing text :-)</p>
