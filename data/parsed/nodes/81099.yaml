    html: |-
      <p>Both, thanks for the replies.<br>
      And Martin, you were right, it was just that i had the tracking to high, it was at 33 points, and after 30 the ligatures stop working.<br>
      So it is fixed, thank god!</p>
      <p>Thanks again!</p>
