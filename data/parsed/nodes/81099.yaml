    <p>Hi all,</p>
    <p>First of all, hello to all!<br>
    This is the first time i post, although i have been reading<br>
    this forum a lot, with great enthusiasm!</p>
    <p>But let's get down to business.<br>
    I have been working on a sans serif font in fontlab.<br>
    Everything works fine, kerning, ligatures.</p>
    <p>Only......</p>
    <p>When i want to use my font, on a existing text in indesign, the ligatures don't work.<br>
    But, if i create a new text block, end select my font, and start writing, the ligatures do work.</p>
    <p>The problem is, that i want to use the font for a new book i'm designing.<br>
    It has a lot of text, which i can't just rewrite.</p>
    <p>I have tried the trick of copy, pasting (same font, or first changing it into another), also in a new document,<br>
    but same problem keeps on appearing.</p>
    <p>So hopefully anybody can help me any further.</p>
    <p>Cheers,</p>
    <p>Maarten.</p>
