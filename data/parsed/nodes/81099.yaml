    html: <p>So your OT code compiles and the ligatures work in your editor but not in real life? You'd better show us the code.</p>
  - id: 459771
    user_id: 13079
    user_name: martinplus
    user_path: null
    date_raw: 12 Apr 2011 — 5:54am
    date: 2011-04-12T05:54:00
    votes: null
    html: <p>It might be an issue related to your tracking value. In InDesign ligatures (and other related features) are automatically disabled if your value for tracking is too high (while they do work in Illustrator). Try setting Tracking to 0 for your text. And, I assume that Ligatures are switched on in your existing text :-)</p>
  - id: 459781
    user_id: 99340
    user_name: mrtn
    user_path: null
    date_raw: 12 Apr 2011 — 6:55am
    date: 2011-04-12T06:55:00
    votes: null
    html: |-
      <p>Both, thanks for the replies.<br>
      And Martin, you were right, it was just that i had the tracking to high, it was at 33 points, and after 30 the ligatures stop working.<br>
      So it is fixed, thank god!</p>
      <p>Thanks again!</p>
