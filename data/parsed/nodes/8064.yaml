    html: "<p>&gt; If you were to scan in a printed font � using ScanFont, for example,  <br>&gt; then use, say, FontLab to generate a new Type 1 font, and use  <br>&gt; a new name for your font, you will have broken no law.  <br> <br>No U.S. law. However, if you sell your products worldwide, you can be sued in any country, including any of the E.U. countries that offer copyright protection to typeface designs. If you lose, you risk the ban for the sales of your products from the entire European Union.  <br> <br>&gt; And I�ll make a categorical statement: I have NEVER found  <br>&gt; a �foundry release� font where the kerning values were right.  <br> <br>Properly made typefaces include \"optical sizes\", i.e. different masters for small and large type size (at least 2, sometimes 3 or 4 different masters). These masters have not only different kerning values but also different glyph outlines -- the small type sizes have often less stroke contrast, wider proportions etc. Adobe has made such masters for Brioso Pro, Chaparral Pro, Cronos Pro, Jenson Pro, Kepler Std, Minion Pro, Sanvito Pro, Utopia Std, and Warnock Pro. The newly released Scangraphic Digital Type Collection (<a href=\"http://www.myfonts.com/foundry/efscangraphic/\" target=\"_blank\">http://www.myfonts.com/foundry/efscangraphic/</a> ) has two masters for most of their typefaces; sometimes they differ in metrics &amp; kerning, sometimes also in the outlines. There are quite a few other foundries that have done just that. For example, Carter &amp; Cone and The Font Bureau offer optical masters for many of their families.  <br> <br>Filip makes a good point that European copyright (the Czech legislation is similar here to German, Polish, and most likely other continental E.U. laws) explicitly allows modification of software that is made to obtain interoperability with other systems. If applied, this legislation overrules any contractual limitations. However, it is still up to interpretation whether these particular regulations can be applied to the question of font localization. A person who localizes fonts would most likely want to use a liberal interpretation of these regulations, the original font manufacturer prefers to apply a narrow interpretation. This is truly such a \"border case\" that, when a conflict occurs, a court would need to make a specific decision. So far, I know of no cases in the E.U. where this question would be answered.  <br> <br>In the U.S., contracts have a very strong binding, i.e. when an EULA prohibits a certain action, the user is most likely bound with it. In the E.U., legislation often can overrule contracts (this is the case for copyright, for customer protection legislation and many others). In general, U.S. legislation is more pro-vendor while the E.U. legislation is more end-user-friendly, although the copyright protection of typeface designs is very much the other way around.  <br> <br>Still, there are two aspects of the situation: the legal aspect and the ethical aspect. And there are two possible scenarios: modification purely for your own use, and modifications that are being distributed.  <br> <br>Some people may disagree, but I think since type is not really an artistic work intended for final use, but much more a creative resource that is being used to create further works, the \"consumer\" of type is always a creator of other works. This is similar to an actor's performance of a stage play. The text of the stage play is written down by the author, but the stage performance uses it only as a resource, and creates a visual, theatratical performance based on that. In many cases, the theatre company may alter or shorten the original text and do artistic adaptation if necessary.  <br> <br>My own view is that font localizations and modifications done purely for your own use are O.K. You are a consumer of the type, but also are creating a work of your own. There may be situations where the original type does not 100% fit into your concept and you may need to alter it. This starts with trivial changes such as setting the type on different spacing, or stretching the letters, and ends up with redrawing portions of characters or adding other characters.  <br> <br>Font localizations and modifications done for other people -- either under contract, as a 3rd party \"localizer\" who works for a particular client, or completely for distribution -- are much more tricky. My view is that you really need the original vendor's consent to do it. Contractual trickery such as: a client buys a license for a font, transfers the license to you, you make the modifications and transfer the license back to the client -- are just very disputable. I think it is not all-right from the ethical point of view. Because in this case, you make your business as a \"localizer\", meaning, you are in a way competing with the original font creator.  <br> <br>I should add that all above is just my private opinion, not associated anyhow with companies that I do work for.  <br> <br>Best,  <br>Adam</p>"
