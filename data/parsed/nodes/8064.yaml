    html: "<p>Charles, thank you for very interesting contribution. I agree with you. I face very similar problem, let me introduce you to it. <br> <br>Many foreign companies are starting their businesses in the Czech Republic where I live. These companies also have corporate identities defining fonts. And that's the problem � majority of foreign fonts doesn't contain characters necessary for setting type in Czech language.  <br> <br>I offer a localization service for these companies or advertising agencies working for them. They send me files and I create CE fonts for them. I am happy � I have an interesting job. They are satisfied � they have functional fonts with correct Central European characters. According to Czech law, I am allowed to change a piece of software to work seamlessly with other software or to modify the software to work with Czech characters without modifying the functionality of the software. <br> <br>I think there are two problems of the localization: <br> <br>1) Collision with EULA. I had some discussions with lawyers what is more important: Czech law (Author�s Law, Nr. 121) or EULA and the results of their interpretation of the law are not explicit at all <br> <br>2) Original diacritics in the font are often unusable or even totally wrong. In such cases I have to redesign the diacritics. Doing so I alter the original design, but the resulting font is usable for type setting Czech language <br> <br>What is your opinion on font localization?</p>"
    html_clean: "<p>Charles, thank you for very interesting contribution. I agree with you. I face very similar problem, let me introduce you to it. <br> <br>Many foreign companies are starting their businesses in the Czech Republic where I live. These companies also have corporate identities defining fonts. And that's the problem � majority of foreign fonts doesn't contain characters necessary for setting type in Czech language.  <br> <br>I offer a localization service for these companies or advertising agencies working for them. They send me files and I create CE fonts for them. I am happy � I have an interesting job. They are satisfied � they have functional fonts with correct Central European characters. According to Czech law, I am allowed to change a piece of software to work seamlessly with other software or to modify the software to work with Czech characters without modifying the functionality of the software. <br> <br>I think there are two problems of the localization: <br> <br>1) Collision with EULA. I had some discussions with lawyers what is more important: Czech law (Author�s Law, Nr. 121) or EULA and the results of their interpretation of the law are not explicit at all <br> <br>2) Original diacritics in the font are often unusable or even totally wrong. In such cases I have to redesign the diacritics. Doing so I alter the original design, but the resulting font is usable for type setting Czech language <br> <br>What is your opinion on font localization?</p>"
