    html: "<p>Thomas-- <br> <br>I had another look at FSI's EULA. Given Charles's account of the process with FL and your hints about FDK's steep learning curve requirements, I'm inclined to read that EULA very conservatively. Less facetiously, I agree with you: I can't see how combining kerning tables and renaming glyphs doesn't mean you are changing fonts. <br> <br>&lt;sigh&gt; <br> <br>If wisdom consists in knowing that you don't know, then I come away feeling pretty wise. <br> <br>Oh, well--it's not as if I can't just sub in the right ligatures after finishing the rest of the setting for those FS faces, and at least InDesign comes with some pretty sweet fonts that are already OT. --MM.</p>"
