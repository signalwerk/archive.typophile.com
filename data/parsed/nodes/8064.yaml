    html: "<p>All-- <br> <br>This is what happens when you ask a simple question on this site . . . you learn a lot, more even than you thought you would. <br> <br>Since I'm what most on this site would call a hobbyist, with no other reason to contemplate converting/rewrapping T1 fonts than pure convenience, there's no reason for me to stretch the bounds of ethical practice, especially considering all the work that would be involved (think of it as a happy convergence of practicality and integrity). But the discussion (technical and ethical) has been enlightening. <br> <br>FYI: FSI has not (yet) packaged their material in OTF. I suspect that's coming, but considering all the steps involved and the size of their catalog, it will take them a while, I guess.  --MM. <br> <br>P.S.: Charles, Ygraine was Arthur's mom. His wife was Guinevere.</p>"
