    html: "<p>WARNING: Long, and maybe boring. <br> <br>This whole matter of the licensing agreement is pretty charged. My own practical position has just two elements: <br> <br>1. Nothing I do should cost the foundry (or designer or whoever) any money. <br> <br>2. Nothing I do should cause the foundry (designer, whoever) any embarrassment. <br> <br>Everything else in the licensing agreement is lawyer talk. To take an example outside our industry, every time you rent a car, when you sign your name, you not only agree to the conditions of the rental agreement, but certify that you have READ and UNDERSTOOD the rental agreement. Now that agreement is about three or four pages long (8.5 x 11 pages!), set in 6-point type. If you were to read it, everybody in line behind you would be screaming for your head. Moreover, it was written by lawyers (who typically can�t agree among themselves about what something means), so your chances of understanding it is pretty slim, even if you read it. But you need the car, so you sign, and I suppose you�ve just perjured yourself. <br> <br>Now this next bit maybe wrong � I�m not a lawyer � but this is my understanding. In the U.S., you can�t copyright the particular form of letters. That is, what makes Scala different from Joanna can�t be protected by a copyright. What can be protected is a particular piece of software that �draws� the letterforms. To me, this is silly. Martin Majoor should be able to protect his art, not simply a piece of software. I believe the copyright law has lead to some lawsuits, by the way. If you were to scan in a printed font � using ScanFont, for example, then use, say, FontLab to generate a new Type 1 font, and use a new name for your font, you will have broken no law. It is a lot of work, but it can be done. At least one major foundry did just that, was sued, and was found to be perfectly within their rights. While this may be legal in the States, I think it absurd, and breaks my rule number 1. <br> <br>My Rule 2 is obviously a little subjective. But let�s start here: Kerning values are to some extent determined by type size. The right kern between two letter pairs for 10-point type will not be right for 40-point type. Now programmatic kerning (as found in the AFM) doesn�t allow for this. Since I set books, I�m going to adjust the kerning values for a range of 8-12 point type, and use hand-kerning when the same font is used in display. And I�ll make a categorical statement: I have NEVER found a �foundry release� font where the kerning values were right. <br> <br>How about glyphs? One of the designers we work with is a Brit � a brilliant designer, recently selected to the RDI. His background and eye use a word-spaced en-dash when a dash is needed. American editors usually won�t agree to this though, and want an em-dash. We came up with the idea of using a 3/4-em dash on an em set, and this satisfied the aesthetic demands of both the American editors and the designers from the U.K. Now I�m going to put this glyph in the em-dash position, so that it can be used automatically in setting text. <br> <br>Does this break the licensing agreement? When you think about it, the main reason this hadn�t been done is historical. The type case was small, room for only a limited number of characters. In hot-metal or early photocomp, the case was still small (Teletypewriter requirements, for just one example). There wasn�t room for a two-em or three-em dash as separate characters in the �case,� so the em-dash had to set full width in order to make up two- and three-em dashes. Now, the �case� has room for a lot more characters, so we can have a two-em dash and a three-em dash (full width to make up even longer dashes)as well as a stand-along em-dash. <br> <br>Or consider the �Bembo mistake� where the wrong capital �R� was sent from the committee down to the room where the characters were cut. We were stuck with that long-tailed �R� for quite a while. Eventually, Monotype put the regular �R� in the PostScript font as an alternate character. But the regular �R� was what you wanted for running text; the long-tailed �R� was for display. We simply re-named them to make composition easier. Did we break the law? <br> <br>When Martin Majoor cut Scala, most production followed the following path: repro was run out &amp; sent to the printer, who shot negatives, stripped them up on a flat, then burned a printing plate. The type picked up a bit of weight at each stage. The printed books looked quite nice, Scala was a good font. Just a few years later, the compositor sent a PDF file to the printer, who, likely as not, burned the plate directly from the computer file (CTP). Moreover, there was apt to be live art in the PDF, so the printer had to ensure that the dotgain of the art wasn�t increased beyond necessity. All of a sudden, Scala appeared too light, when printed offset at 2,400 dpi using a direct-to-plate process. What we did was to increase the weight of the characters 2/1000 of an em for composition where CTP printing was to be used. All this did was restore the weight of the type to what it originally looked like with the old printing process. I have scans of the type I used in a lecture which show this, but the file is over 1 meg, so I can�t really post it. As far as I�m concerned, all we did was to follow Rule 2 above. <br> <br>Consider too that this morass of Type 1 fonts (Regular, Expert, Small caps, OS figures) came about because QuarkMaker had hard-wired encoding. If everyone could have written their own encoding vectors, the fonts likely would have been made with all glyphs in a font. You would have been limited to 256 characters at run-time for a font, but you cold select the ones to include. <br> <br>Finally, the current licensing agreements (if I understand them) are going to marginalize the small foundries out of existence. Today, when you send a job to the printer, you had better send it in a PDF file. I suppose you can subset the characters, most printers prefer full embedding. Moreover, most academic publishers have contracts with NetLibrary. When they decide to publish a book, they are contractually bound to make the book available to NetLibrary, who requires a PDF file with the fonts fully embedded. But consider the publication process: The book may be sent to a freelance designer, who has a legal copy of the font. Next, it goes to a compositor, who also has a legal copy of the font. They�re going to make a PDF file to send only to the printer, so the book can be printed. The printer returns this PDF file to the publisher, who, as far as I can tell, doesn�t need a legal copy of the font at all. After a bit of work on the images (if any) the PDF file is given to NetLibrary. Who is to police all this? Worse, the first lawsuit that arises is going to have one outcome: Press directors are going to instruct their designers to use only fonts where embedding in a PDF is permitted. Since most of the larger foundries permit embedding the font in a PDF, any protests will fall on deaf ears. <br> <br>I don�t know where all this is going, or what the solutions are. But if you are breaking the law by converting your Type 1 fonts to OpenType, by changing the kerning values, or by tailoring the glyphs to your needs, the law simply won�t be obeyed. Type designers are NOT type users. The few I�ve worked with (Matthew Carter, Sumner Stone) are quite willing to listen to the users of type. What they are NOT about to do is to re-issue a font whenever a small change is needed. <br> <br>Charles Ellertson</p>"
    html_clean: "<p>WARNING: Long, and maybe boring. <br> <br>This whole matter of the licensing agreement is pretty charged. My own practical position has just two elements: <br> <br>1. Nothing I do should cost the foundry (or designer or whoever) any money. <br> <br>2. Nothing I do should cause the foundry (designer, whoever) any embarrassment. <br> <br>Everything else in the licensing agreement is lawyer talk. To take an example outside our industry, every time you rent a car, when you sign your name, you not only agree to the conditions of the rental agreement, but certify that you have READ and UNDERSTOOD the rental agreement. Now that agreement is about three or four pages long (8.5 x 11 pages!), set in 6-point type. If you were to read it, everybody in line behind you would be screaming for your head. Moreover, it was written by lawyers (who typically can�t agree among themselves about what something means), so your chances of understanding it is pretty slim, even if you read it. But you need the car, so you sign, and I suppose you�ve just perjured yourself. <br> <br>Now this next bit maybe wrong � I�m not a lawyer � but this is my understanding. In the U.S., you can�t copyright the particular form of letters. That is, what makes Scala different from Joanna can�t be protected by a copyright. What can be protected is a particular piece of software that �draws� the letterforms. To me, this is silly. Martin Majoor should be able to protect his art, not simply a piece of software. I believe the copyright law has lead to some lawsuits, by the way. If you were to scan in a printed font � using ScanFont, for example, then use, say, FontLab to generate a new Type 1 font, and use a new name for your font, you will have broken no law. It is a lot of work, but it can be done. At least one major foundry did just that, was sued, and was found to be perfectly within their rights. While this may be legal in the States, I think it absurd, and breaks my rule number 1. <br> <b