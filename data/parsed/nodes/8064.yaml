  html: "<p>Hi-- <br> <br>Searching the archives for threads on this topic yielded an embarassment of riches that I couldn't sort out, so apologies in advance if this brings up a topic specifically addressed elsewhere (perhaps people might point me to particularly relevant threads of which they know). <br> <br>Here's my problem: I have recently purchased InDesign CS (Mac OS X) and am in the process of teaching myself typography and page layout. I have licensed a series of Mac Type I fonts (Scala, Seria, Meta) that I would love to be able to set easily in InDesign--but, of course, their not being OpenType makes it harder to access in-line figures and lining figures in the same block of text, or to use the expert sets' ligatures. <br> <br>I can get access to FontLab for the Mac (4.6), which I know can \"wrap\" (a phrase I've heard many times) Type I and TT fonts in OpenType wrappers, and presumably combine the regular, LF, and expert sets. <br> <br>Here are my questions: <br> <br>1. My reading of FSI's EULA suggests there are no ethical problems with this, since I'm not editing the font (changing the metrics, hinting, or kerning); am I right about this, or can someone set me straight? <br> <br>2. Assuming there are no ethical questions, is this the kind of project a novice can complete without great wailing and gnashing of teeth? I'm not entirely ignorant about font software, and I would love to know more, but I have a full-time job as a professor and advisor already. <br> <br>It seems to me, for example, that one would have to know the Unicode glyph naming conventions in order to properly array and label the glyphs in the \"new\" OT font. That can't be an easy thing to learn from scratch. Would FontLab automate or streamline this process? <br> <br>3. If this project is reasonably within a novice's abilities, how can I get good information about the steps involved? FontLab's manual, for example (at least the .pdf version you can find online) is not terrifically helpful--but am I missing something? <br> <br>Also, I noticed that Adobe offers free software that allows a user to wrap Type I/II fonts in OpenType wrappers, but it seems like that software requires a Mac OS X user to be fairly font- and Unix-savvy. Is that impression correct? <br> <br>Any help would be appreciated. --MM.</p>"
  html_clean: "<p>Hi-- <br> <br>Searching the archives for threads on this topic yielded an embarassment of riches that I couldn't sort out, so apologies in advance if this brings up a topic specifically addressed elsewhere (perhaps people might point me to particularly relevant threads of which they know). <br> <br>Here's my problem: I have recently purchased InDesign CS (Mac OS X) and am in the process of teaching myself typography and page layout. I have licensed a series of Mac Type I fonts (Scala, Seria, Meta) that I would love to be able to set easily in InDesign--but, of course, their not being OpenType makes it harder to access in-line figures and lining figures in the same block of text, or to use the expert sets' ligatures. <br> <br>I can get access to FontLab for the Mac (4.6), which I know can \"wrap\" (a phrase I've heard many times) Type I and TT fonts in OpenType wrappers, and presumably combine the regular, LF, and expert sets. <br> <br>Here are my questions: <br> <br>1. My reading of FSI's EULA suggests there are no ethical problems with this, since I'm not editing the font (changing the metrics, hinting, or kerning); am I right about this, or can someone set me straight? <br> <br>2. Assuming there are no ethical questions, is this the kind of project a novice can complete without great wailing and gnashing of teeth? I'm not entirely ignorant about font software, and I would love to know more, but I have a full-time job as a professor and advisor already. <br> <br>It seems to me, for example, that one would have to know the Unicode glyph naming conventions in order to properly array and label the glyphs in the \"new\" OT font. That can't be an easy thing to learn from scratch. Would FontLab automate or streamline this process? <br> <br>3. If this project is reasonably within a novice's abilities, how can I get good information about the steps involved? FontLab's manual, for example (at least the .pdf version you can find online) is not terrifically helpful--but am I missing something? <br> <br>Also, I noticed that Adobe offers free software that allows a user to wrap Type I/II fonts in OpenType wrappers, but it seems like that software requires a Mac OS X user to be fairly font- and Unix-savvy. Is that impression correct? <br> <br>Any help would be appreciated. --MM.</p>"
