    html: "<p>Again about localization. <br> <br>Adam wrote: My view is that you really need the original vendor's consent to do it.  <br> <br>Adam, I agree with you. I usualy ask the client to contact the vendor of the fonts first and ask for the localization. Most of the clients is not satisfied with the answer of the vendor and come back to me. Maybe the reason is I can do the task very quickly and this is the most important thing for them. They don't want to wait weeks or even months. <br> <br>Another problem is correcting diacritics. There are fonts distributed by large companies containing wrong diacritics and the vendor is satisfied with its product. Some clients want to modify the diacritics to respect typographic tradition and use for example correct carons (instead of breves) or commaaccents (instead of cedillas) etc. In such cases, me (and other localizators) offer the only solution.</p>"
