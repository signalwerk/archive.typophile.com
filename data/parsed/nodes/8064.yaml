    html: <p>Rather than endlessly hypothesize and argue about how FSI might feel about this, the best people to ask about this are FSI. You never know, they might be working on their own OT versions and need an existing FSI customer to do QA testing for them. If you can demonstrate to them that you have paid for their product, value their rights and control, and will help them in ways that save more time than waste it, who knows what they might agree to. Try writing them a thoughtful email explaining what you're doing in detail.</p>
