    html: <p>I don�t know if your time is of any value, if so, it is probably cheaper to just buy OpenType fonts, if they are available, and if they have all the glyphs you need. (Likely they won�t have all the glyphs, though. In the rush to put out OpenType fonts, most foundries aren�t including things.) <br> <br>Here�s what I mean. For years now, we have made a database of all our Type 1 fonts. When we bought a set of fonts, using Fontographer, we would make up a font file where all the glyphs were included, small caps, old style numbers, etc. We�d also add whatever glyphs we needed, such as tabular oldstyle figures, tabular lining figures, extra diacritics, and so on. (To USE this font, we�d write an encoding vector selecting the glyphs we wanted, but that�s a different story.) In short, our Type 1 fonts had most of what you�d want to include in an OpenType font. <br> <br>Starting from this database, it takes me several hours to convert the font to the OpenType format. <br> <br>One reason is that I don�t like using the Unicode private use area for small caps, oldstyle figures, etc, &amp; so rename them. See  <br> <br><a href="http://www.typophile.com/forums/messages/4101/25695.html?1076260212" target="_blank">http://www.typophile.com/forums/messages/4101/25695.html?1076260212</a> <br> <br>If the glyphs are *correctly* named (proper AGL name) in the Type 1 font, FontLab will preserve the correct name them &amp; assign the Unicode number automatically. But if you are using the Type 1 fonts as purchased, the numbers and small caps will not be properly named, they will be in a separate font (a small-cap, old-style figure font), with the small cap glyph named �a� �b� etc, instead of �Asmall�, �Bsmall� etc. The os-numbers will be named �one� �two� instead of �oneoldstyle� �twooldstyle� etc. This means you will have to do the renaming yourself. Moreover, you�ll have to open up the original Type 1 font in FontLab and rename there in it in order to have the program rename the kerning &amp; create an AFM file when you generate a Type 1 font. When you then paste the glyphs into your full font (OpenType), you�ll have to type in the names again. You can at least just read in the AFM in an �add only� mode to get the kerning. I�d actually do it differently, creating a dummy AFM file that you�ve gone over first to make sure nothing is in there twice with a different value. We don�t have this problem with our Type 1 database, because all the kerning is in the one AFM. <br> <br>I�m making this sound harder than it is; once you figure it out, it isn�t hard, but it is time consuming. <br> <br>A second amount of time is spent writing the �features� that give you small caps, ligatures, old-style numbers, etc. InDesign only supports a few of the OpenType features, so you don�t have that much to write, but you do have to do it. <br> <br>There is a learning curve � if it takes you all day to do the first font, it will take considerably less after you get the process down. And if you use the same *features* for all your fonts, you can create them once, write them off to a file, and then read that file in for the next set of fonts. <br> <br>One plus to all this is that you can create your own glyphs if/when you need them, augmenting what the foundry supplied. I don�t worry about modifying a foundry font, if the G@%D!%&amp; foundry had given me what was needed the first time, I wouldn�t have to do it myself. <br> <br>A second plus is that by the time you are done, your knowledge of both type and its use in InDesign will have gone way up. But on a strict dollar basis, it is likely cheaper just to re-buy them. <br> <br>Good luck, <br> <br>Charles</p>
