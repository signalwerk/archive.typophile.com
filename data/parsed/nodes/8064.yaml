    html: <p>Maurice, <br> <br>With regards to our own FDK, I recommend its proofing/testing tools but not its building tools. You have to be a real gearhead to get very far with those (no offense to my fellow geeks intended, here). Also, you'd still need something else to combine original fonts and so forth, so you might as well use FontLab for the entire process. <br> <br>Mind you, that assumes that you're going to actually do this. I can't see how this would not constitute modifying/editing the fonts. If the FSI license does not allow such, then I would think you'd be out of luck as far as being able to do this legally. Not that I'm a lawyer, and of course this is a legal question. <br> <br>T</p>
