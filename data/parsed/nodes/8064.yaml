    html: "<p>&gt; since I'm not editing the font  <br>&gt; (changing the metrics, hinting, or kerning) <br> <br>Any conversion between formats implies editing. Converting from Type 1 or OpenType PS to OpenType TT / TrueType involves coversion of outline types and of hinting, hence editing. Converting from Type 1 to OpenType PS (.otf) involves changing the font's encoding and other modifications.  <br> <br>Your steps 1-6 are correct, with a few remarks to be made:  <br> <br>1. Do not use glyph names such as \"oneoldstyle\" or \"Asmall\". They are not Adobe/FontLab-recommended glyph names. Glyph naming recommendations from Fontlab Ltd. and Adobe can be found at:  <br><a href=\"http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065\" target=\"_blank\">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065</a> <br> <br>2. Combining glyph sets of fonts into a single font in FontLab 4.6 can be comfortably done using the \"Append glyphs\" feature in the Fonts panel. In the upcoming FontLab Studio 5, this will be even easier -- we will have a new \"Merge fonts\" feature which will automatically merge kerning as well.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>"
    html_clean: "<p>&gt; since I'm not editing the font  <br>&gt; (changing the metrics, hinting, or kerning) <br> <br>Any conversion between formats implies editing. Converting from Type 1 or OpenType PS to OpenType TT / TrueType involves coversion of outline types and of hinting, hence editing. Converting from Type 1 to OpenType PS (.otf) involves changing the font's encoding and other modifications.  <br> <br>Your steps 1-6 are correct, with a few remarks to be made:  <br> <br>1. Do not use glyph names such as \"oneoldstyle\" or \"Asmall\". They are not Adobe/FontLab-recommended glyph names. Glyph naming recommendations from Fontlab Ltd. and Adobe can be found at:  <br><a href=\"http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065\" target=\"_blank\" class=\"link-external\">http://groups.msn.com/fontlab/tipsandtricks.msnw?action=get_message&amp;mview=0&amp;ID_Message=3065</a> <br> <br>2. Combining glyph sets of fonts into a single font in FontLab 4.6 can be comfortably done using the \"Append glyphs\" feature in the Fonts panel. In the upcoming FontLab Studio 5, this will be even easier -- we will have a new \"Merge fonts\" feature which will automatically merge kerning as well.  <br> <br>Regards,  <br>Adam Twardoch <br>Fontlab Ltd.</p>"
