    html: "<p>Charles-- <br> <br>Good luck indeed! Thanks for your response. Let me see if I can distill your answer in order to make sure I grasp what's going on: <br> <br>First, I would have to open in FontLab all the individual Type I fonts whose glyphs (or some subset thereof) I want to combine under an OTF wrapper--so, for example, Scala LF Regular, Scala Regular, Scala Expert, Scala SC, Scala SC Expert. <br> <br>Second, using the AGL naming conventions, I would need to rename all the glyphs in these five Type I fonts I want to use in the final OTF. <br> <br>Third, I would need to save from these fonts five new Type I fonts in order to generate kerning tables with the right glyph names in new AFM files. <br> <br>Fourth, I would need to open all five of these new Type I fonts and combine all the glyphs from them I want to use into a sixth, new OTF. (Which names, exactly, would I need to \"type in again\"? Doesn't FontLab have drag and drop glyph insertion? My own copy of TypeTool does.) <br> <br>Fifth, I would have to read all the old AFM kerning data for all the glyphs and their combinations into the new OTF (making sure there are no duplicate kerning calls with different values in the file). <br> <br>Sixth, and finally, I would have FontLab generate the new (CFF-flavored) OTF. <br> <br>I see what you mean by things being cheaper when you just buy the OTF versions. Of course, that's not yet possible for FontShop's foundry, and in any case, it would/will be pretty pricey when FSI does start offering OT versions of their fonts to get versions of everything I have licensed (small as my collection is). <br> <br>Not to mention, wouldn't renaming glyphs and combining kerning tables start getting me into trouble with FSI's (or any foundry's) EULA? I know you wrote that you wouldn't worry too much, and your reasoning is on the surface sound, but is that a consensus opinion? My guess is that at least some of this is ethical, else why would Adobe offer software that allows people to do this?--unless, of course, they meant only for people to edit and combine their own work. <br> <br>Lots for a neophyte to chew on. Other thoughts and advice are welcome.</p>"
