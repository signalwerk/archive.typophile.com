      <p>One site claims it was designed by lairdandpartners.com. I took a quick look at their site and saw that they do graphic design work for Gap, but I didn't see any mention of the new logo.</p>
      <p>My first impression is that the new logo is awful, but I'd like to hear the Gap's reasons for the change. My guess is that their previous logo looked a bit old and stuffy to their target audience of younger people, like the logo of a place their parents would shop at. And perhaps Helvetica is viewed differently by younger folks who weren't even born yet when it was at the height of its popularity.</p>
