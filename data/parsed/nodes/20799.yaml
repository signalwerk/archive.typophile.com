    <p>This one of my latest ones; Suomi Slab Serif. A friend of mine started (h)ranting that American Typwriter is too lanky and had everything much too round and overly polished, so I started buggering about with the idea of Egyptienne/Slab Serif version of American Typewriter...</p><div class="imageWrap"><img src="http://typophile.com/files/SuomiSlabSerif_6528.png"></div><p></p>
