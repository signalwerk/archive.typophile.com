    <p>Hello!</p>
    <p>I acquired the "First specimen book of DE ROOS ROMAN &amp; ITALIC" that has been printed by TYPEFOUNDRY"AMSTERDAM" and with layout by D. Dooijes (chief-designer of Typefoundry "Amsterdam").<br>
    The specimen is composed by 20 pages (A4). Here are the introductory words:</p>
    <p>"In this booklet we are happy to introduce the newest typeface of<br>
    Sjoerd H. de Roos, one of the world's most famous and successful<br>
    type designers. This veteran Dutch artist during his fifty year's career<br>
    in the graphic arts has deeply influenced contemporary typography,<br>
    notably in Western Europe. He has created many new printing types<br>
    which are now in use in all parts of the world. To mention a few:<br>
    the slender, graceful Egmont family, the sturdy and yet elegant Dutch<br>
    Medieval. the refined and spiritual Erasmus, the highly original and<br>
    striking Libra and the interesting Simplex, the most experimental<br>
    contemporary design. The experience and the skill acquired in half<br>
    a century of work on the highest creative level has now produced a<br>
    new type family of outstanding qualities: De Roos Roman &amp; Italic.<br>
    Type experts in every country have expressed already their admiration<br>
    for this noble design, which in its quiet, beautifully balanced<br>
    forms shows an exquisite grace and charm.<br>
    We are now able to present the full range of sizes of the Roman,<br>
    the Italic and a series of Inline Initials, to which a Semi-bold will be<br>
    added soon. We do so in the full confidence of making available a<br>
    beautiful and perfectly readable type of lasting merit."</p>
    <p>Some samples below (lowres). If anyone needs something more let me know :)</p>
    <p>António<br>
