    html: |-
      <p>Regina, did you consider using elephants (or rather, images of them) for this task? I always found the predecessor to <a href="http://www.redstonepress.co.uk/abz.html" rel="nofollow">ABZ – More Alphabets and Other Signs</a> which was called 101 Alphabets and Other Signs very useful. But this is a symbolic, not typographic train of thought; further research for signs &amp; symbols <a href="http://www.amazon.co.uk/Dictionaries-of-Signs-and-Symbols/lm/3KJPPE6TOZJQL/ref=cm_lm_dtpa_fvlm_cfa_1/202-2667617-3758266" rel="nofollow">here.</a></p>
      <p>Alternatively you could set +lbs or +kg (depending where you are) in any font and have done with it.</p>
