  html: <p>I'm looking for a symbol that would indicate "extra weight," like a scale. But it needs to be a font and not a graphic. I have searched the Web extensively and haven't found anything. Does anyone know of such a thing? Someone on another site told me to look at the Signs Two font, but I couldn't see anything that fit that description. It seems crazy that with all these dingbats out there, a scale is hard to find (I did find the scales of justice, but that's not what I need.) Any help would be appreciated.</p>
