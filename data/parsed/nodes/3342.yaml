    html: "<p><i>Uhm, I actually do take pictures of the credits.. I guess that makes me look pretty stupid now.</i> <br> <br>Not really. That part wasn't far-fetched at all. There are people who bring video cameras, in fact. Back in college in the mid-seventies I brought a 35mm camera into a showing of 2001: A Space Odyssey and took a dozen or so pictures. I was a little obsessed with that movie at the time. <br> <br>I have to confess, my little story was partly inspired by a chapter in the book \"A Year At The Movies\" by Kevin Murphy. Murphy went to a different public showing of a movie every day for a year, and then wrote a book about it. On Thanksgiving, he managed to smuggle an entire Thanksgiving dinner into a theater under a very large overcoat. Pretty funny stuff.</p>"
