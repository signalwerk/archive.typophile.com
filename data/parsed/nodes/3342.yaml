    date: 2004-02-28T07:31:00
    date_raw: 28 Feb 2004 — 7:31am
    votes: null
    html: <p>So yeah... the Kill Bill titles... there are a few...  <br> <br>Avant Garde for the proverb, a bit of Busorama for the studio titles... pause for the prelude... okay there's some Friz Quadrata (bold), then I'll be damned if that's not Bookman (bold, ITC?) for the film title. Followed by some more Avant Garde and Friz, throwing in a bit of Palatino to mix things up, then more of the AG/FQ combo, then back to Palatino, and finally Avant Garde for the Chapter titles.  <br> <br>Certainly one of the more, er, 'typographically-rich' title sequences in recent memory. <br> <br>So the 'R' could be either Friz Quadrata or Palatino, but the non-closing 'g' could only be Friz, even though I don't recall seeing any lowercase...? <br> <br>Oh, and the end credits are Bookman again.</p>
    html_clean: <p>So yeah... the Kill Bill titles... there are a few...  <br> <br>Avant Garde for the proverb, a bit of Busorama for the studio titles... pause for the prelude... okay there's some Friz Quadrata (bold), then I'll be damned if that's not Bookman (bold, ITC?) for the film title. Followed by some more Avant Garde and Friz, throwing in a bit of Palatino to mix things up, then more of the AG/FQ combo, then back to Palatino, and finally Avant Garde for the Chapter titles.  <br> <br>Certainly one of the more, er, 'typographically-rich' title sequences in recent memory. <br> <br>So the 'R' could be either Friz Quadrata or Palatino, but the non-closing 'g' could only be Friz, even though I don't recall seeing any lowercase...? <br> <br>Oh, and the end credits are Bookman again.</p>
