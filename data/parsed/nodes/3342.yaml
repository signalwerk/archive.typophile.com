    html: <p>What I usually do is to sneak a small digital camera into the theater. I sometimes have to sit through several showings to get good shots of the main titles, not to mention any other type that is used in a film--especially if it is used badly. <br> <br>As you might imagine, this is rather time consuming. Fortunately there are several theaters I know of that are in range of a WiFi hot spot. (It's more common than you might think, but, considering the density of Starbucks, not that surprising.) So, what I do is sneak my TiBook in as well. That way I can keep up with the Type ID Board and not miss out on getting the jump on anyone else here. <br> <br>I can usually ID fonts on sight, but there are many times I wish I had my type specimen books with me. (I used to bring Jaspert, McGrew, FontBook, and a few others, but it was killing my back.) Fortunately, with the WiFi connection, I can at least check the online specimens at MyFonts and the rest. <br> <br>Right now, in fact, I'm sitting through the second showing of The Haunted Mansion. It's really bad, but there is a scene near the beginning of the third act where they are looking at this "old" book and the title is set in Matrix (can you believe it?!). I would have gotten it in the previous showing, but an usher was standing nearby. It would have been too hard to explain. <br> <br>I should cut this short since the scene is coming up pretty soon. What's really annoying is, I bought a box of Milk Duds at the snack counter. I tried to eat too many at once and now I can't seem to get my tongue out of my cheek. <br> <br>Anyway, I haven't seen Kill Bill yet, so I can't help you with that one.</p>
