  html: |-
    <p>This font was used in old (90s, I think) amateur subtitling of animated series. At least for me, it has a nice VHS-era look, but I cannot identify it, since it looks... too normal. I still like it though. This font and Camcorder are the perfect duo for VHS style.</p>
    <p>Any suggestions? ;)</p>
