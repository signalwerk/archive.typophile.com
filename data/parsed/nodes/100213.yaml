    <p>Hey. I'm trying to figure out the typeface that Chupa Chups uses on their website/ads.<br>
    I know the logo itself was custom made by Salvador Dali, but does anyone know the typefaces used here?<br>
    <a href="http://www.chupachups.com/homepage.html" title="http://www.chupachups.com/homepage.html">http://www.chupachups.com/homepage.html</a></p>
    <p>I would like to know both the body type and the type on the bottom of the page used for contact info.</p>
