      <p>&gt;How does iOS differ from OSX in terms of hinting?</p>
      <p>I've seen no evidence of fonts being rendered live <em>and</em> aliased in iOS environs. So no hinting is used, though I do not know if the iOS even carries the code to do so. </p>
      <p>&gt;Has anybody made a font that's superhinted for CT? </p>
      <p>If "superhinted for CT" is a relative term, then the CT collection is such an example, being hinted for nothing else. </p>
      <p>&gt;I mean controlling the exact (or near-exact) subpixel rendering with deltas?</p>
      <p>You missed a lot of discussion on <a href="http://typophile.com/comment/reply/62675" rel="nofollow">this</a>. The short answer is that all horizontal scaling in Windows, including glyphs and glyph widths, is out of hinting's reach when CT is enabled.</p>
      <p>And then I'll continue <a href="http://typophile.com/node/82202" rel="nofollow">here</a>, when time permits. I'm in "Edison mode" until weds :D</p>
