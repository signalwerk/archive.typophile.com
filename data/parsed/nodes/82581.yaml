      <p>&gt; when you run an iPhone HD app on the iPad,<br>
      &gt; does it display at 960x640 with a border, or does<br>
      &gt; it scale up to 1024x768?</p>
      <p>There are 3 kinds of apps —1)  iPhone apps, 2) iPad apps, and 3) Universal apps (designed for both iPhones and iPads)</p>
      <p>1) If you run an iPhone app on an iPad, the image will not fill the screen and will have a large black border around it. Or you can press the 2x button and the image will increase to almost full screen, but will still have a border and will be very pixilated.</p>
      <p>2) If you run an iPad app, it will fill the screen. </p>
      <p>3) If you run a Universal app on an iPad, it will be hi res and fill the screen. I presume that Universal apps require that the developer create 2 sets of screens (iPhone and iPad), since the size &amp; proportions of the screens aren't the same. In fact I believe Apple describes Universal apps as essentially being 2 apps (an iphone app and an iPad app) that are bundled together.</p>
