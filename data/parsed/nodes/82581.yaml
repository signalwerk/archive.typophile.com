      <p>I don't know of any utility that lets you do that on the iPad itself, but you can easily make screen snapshots by pushing the home button and standby button at the same time. The screen snapshot is stored in the camera roll, which you can sync with a folder on your PC (via iTunes), and then open in your favorite image program to get a closer look.</p>
      <p>There are not really a lot of type-centric apps (yet), unfortunately. There is a very simple modular font editor (similar to FontStruct in concept) called Fontula. There's also a simple font editor called iFontMaker. Seems to be best suited to fonts that have a hand-drawn (or -scribbled) look. I haven't tried it.</p>
      <p>I think part of the reason there is a dearth of type- or font-related apps is that there is no way (yet) to install fonts beyond what it comes with. On the other hand, it does support web fonts in the web browser, so you can view other fonts on it if they are being served on the web.</p>
