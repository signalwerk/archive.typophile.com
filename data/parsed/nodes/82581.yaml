      <p>&gt; And I assume an iPhone app that's HD will almost fill the screen without 2x.</p>
      <p>No, all iPhone apps, whether HD or not, are displayed small on an iPad unless you press the 2x button, in which case they are pixel doubled which make them larger but pixilated. Even the HD ones act this way. This may seem illogical, but there's a reason.</p>
      <p>iPhone HD apps must have 2 sets of bitmapped graphics, to accomodate the resolution of both older iPhones and newer iPhones. If you play an iPhone app on an iPad, it uses the smaller version of the graphics. </p>
      <p>Why? Because Apple doesn't want developers to think that an HD iPhone app is "good enough" for iPads too. Apple wants developers to create separate iPad versions, so the screen sizes are correct and all the interface elements are properly designed and sized for an iPad, rather than just being an iPhone app displayed larger than originally intended, which often results in clunky, oversized buttons, etc.</p>
      <p>So Apple makes sure that iPhone apps will play on an iPad, but won't look that great. That prods the developers to create real iPad versions.</p>
    html_clean: |-
