      <p>Apple's has a FAQ (dated April 21, 2011) for their iPad word processor, Pages, which discusses which fonts are available for their word processor:</p>
      <p><a href="http://support.apple.com/kb/HT4065" title="http://support.apple.com/kb/HT4065">http://support.apple.com/kb/HT4065</a></p>
      <p>It says:</p>
      <p>+ + + </p>
      <p>iPad supports over 40 fonts and font families which can be used with iWork for iPad apps. When importing a document that uses a font not available on iPad, iWork attempts to replace an unsupported font with one that is a close match. If a close match is not found, the Helvetica font will be used instead. After the import process, fonts that were replaced are listed for review by the user.</p>
      <p>Fonts available on the iPad include:</p>
      <p>American Typewriter<br>
      AppleGothic<br>
      Arial<br>
      Baskerville<br>
      Bodoni 72<br>
      Bradley Hand<br>
      Chalkduster<br>
      Cochin<br>
      Copperplate<br>
      Courier<br>
      Courier New<br>
      Didot<br>
      Futura<br>
      Geeza Pro<br>
      Georgia<br>
      Gill Sans<br>
      Heiti J<br>
      Helvetica<br>
      Hoefler Text<br>
      Marker Felt<br>
      Optima<br>
      Palatino<br>
      Papyrus<br>
      Party LET<br>
      Snell Roundhand<br>
      Thonburi<br>
      Times New Roman<br>
      Trebuchet MS<br>
      Verdana<br>
      Zapf Dingbats<br>
      Zapfino</p>
      <p>+ + +</p>
      <p>&gt; Currently I imagine it has to do with keeping system<br>
