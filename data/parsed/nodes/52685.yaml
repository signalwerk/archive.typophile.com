    <p>Here's a question I have procrastinated over.</p>
    <p>I am right eye dominant and I perceive that the glyphs I am drawing look balanced with normal vision (obviously), or just my right eye. When I close my (dominant) right eye and look with my left eye my glyphs look skewed.</p>
    <p>Does this mean that a right eye dominant audience perceive the glyphs in the same way as me, but the left eye dominant audience does not?</p>
    <p>I just looked at a few other typefaces this way, I perceived them the same way, right eye balanced, left eye skewed.</p>
    <p>Try it yourself and post your observations/thoughts.</p>
    <p>(I guess this is a theoretical anxiety, after all, there's not much anyone can do to reconcile it!)</p>
