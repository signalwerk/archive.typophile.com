      <p>It’s not the eye that sees, but the brain. Images passed on by both eyes are processed into a representation and that is where it becomes muddy: the brain makes decisions about what we want to see and what not. Eg if you are focused on things being level, your perception gets tuned to that (the famous carpenters’ eye).</p>
      <p>Most important is the fact that most people use two eyes and the brain mixes inputs. When you use just one eye it takes some time for the brain to adapt.</p>
      <p>Example: a few years ago I had my eyes lasered. The right one has perfect vision now, which means it is perfectly suited for seeing far off. My left eye has been corrected to about minus 2.5 and is well suited for distances from 60 cms to about 120 cms (I can use my computer without needing glasses — reading is a different matter). My brain picks what it needs — learning that took just a few weeks.<br>
      Anecdote: My eye doctor told me that elderly people who have their vision restored (removing cataracts and such) sometimes can not adapt and remain virtually blind. Or fall over all the time.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
