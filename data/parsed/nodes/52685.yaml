      <p>You're welcome, 1985! I had to use an eye patch, too. :-) I would alternate between covering the right eye one day and the left eye the next. It's usually used for what they call "lazy eye," or <a href="http://www.preventblindness.org/children/amblyopiaFAQ.html" rel="nofollow">amblyopia</a>. The idea is that you will force the "lazy" eye to work harder on the days you cover the "stronger" eye. Strabismus is when you are cross-eyed, and that can be corrected with surgery. Read more about strabismus and amblyopia <a href="http://www.strabismus.org/amblyopia_lazy_eye.html" rel="nofollow">here</a> (they are not the same thing!).</p>
      <p>Try to go to an eye doctor (that is, an optometrist or an ophthalmologist) rather than an optician. In my experience, at least, an optometrist or ophthalmologist will do a more thorough check-up on your vision. An optician is just going to give you glasses.</p>
      <p>Best of luck!</p>
