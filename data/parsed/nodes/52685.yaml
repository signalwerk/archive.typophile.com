      <p><a href="http://en.wikipedia.org/wiki/Exophoria" title="http://en.wikipedia.org/wiki/Exophoria" class="link-external">http://en.wikipedia.org/wiki/Exophoria</a></p>
      <p>She prescribed a 'prismatic' lens to bring the eye back into line, but I have to wait to see an opthalmologist to confirm the exact prescription. I'm a bit frustrated but nevertheless it is something that seems correctable.</p>
      <p>Thanks again for all your advice!</p>
