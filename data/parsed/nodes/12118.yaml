    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Adrian Frutiger</strong> (born March 24,&nbsp;1928)</p>
    <p>Adrian Frutiger is best known as a type-designer. He has produced some of the most well known and widely used typefaces. He was born in 1928 in Interlaken, Switzerland, and by the age of 16 was working as a printer’s apprentice near his home town. Following this he moved to Zurich where he studied at the Zurich School of Arts and Crafts, under Professor <a href="/node/add/wiki?edit%5Btitle%5D=Walter%20Kach" title="Create node &quot;Walter Kach&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Walter Kach</a>. </p>
    <p>After his education in Zurich, Frutiger moved to Paris where he started to work at the <a href="/node/add/wiki?edit%5Btitle%5D=Deberny%20%26%20Peignot" title="Create node &quot;Deberny &amp; Peignot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Deberny <span class="amp">&amp;</span> Peignot</a> typefoundry. Here he helped the foundry move classic typefaces used with traditional printing methods to newer phototypesetting&nbsp;technologies.</p>
    <p>At the same time Frutiger started to design his own typefaces, a few of which became very significant, and this earned him his status as a great type designer. Throughout his career he has produced a number of books, such&nbsp;as:</p>
    <p>Type, Sign, Symbol (1980)<br>
    Signs and Symbols: Their Design and Meaning (1989)<br>
    The International Type Book (1990)<br>
    Geometry of Feelings (1998)<br>
    The Development of Western Type Carved in Wood Plates (1999)<br>
    Forms and Counterforms (1999)<br>
    Life Cycle (1999)<br>
    The Univers (1999)<br>
    Symbols and Signs: Explorations&nbsp;(1999)</p>
    <p>Today his typefaces are readily available from a number of different foundries. He is still alive (2005) and has worked on revisions with Linotype of a number of his typefaces. Such recent collaborations have resulted in Frutiger Next and Avenir Next, which have included refined forms and true italics. Presently Frutiger lives in Bern, Switzerland and is working with&nbsp;woodcuts.</p>
    <p><strong>The Types of Adrian&nbsp;Frutiger:</strong></p>
    <p>• President&nbsp;(1952)</p>
    <p>Although often disregarded, this was Frutiger’s first commercially released typeface, by the Deberny <span class="amp">&amp;</span> Peignot type foundry. The typeface was crucial in Frutiger’s development as a designer and taught him much about letterforms that he applied to his future&nbsp;designs.</p>
    <p>• Phoebus&nbsp;(1953) </p>
    <p>• Ondine&nbsp;(1954) </p>
    <p>• Méridien&nbsp;(1955) </p>
    <p>Méridien is considered to be Frutiger’s first significant typeface, and inspired by 16th-century&nbsp;Jenson. </p>
    <p>• Egyptienne&nbsp;(1956)</p>
    <p>This is a slab-serif face designed right before he designed Univers, and has many resemblances to the style of&nbsp;Clarendon.</p>
    <p>• <a href="/node/13516" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Univers</a> (1956)</p>
    <p>• Apollo&nbsp;(1962)</p>
    <p>Apollo is an old-style serif typeface designed to have the dual functionality of headline as well as body&nbsp;text.</p>
    <p>• Serifa&nbsp;(1967)</p>
    <p>Serifa is a slab-serif design, based on the forms of Univers. It was designed to be used a large variety of&nbsp;sizes.</p>
    <p>• <span class="caps">OCR</span>-B&nbsp;(1968)</p>
    <p>The typeface used for optical character recognition in America (<span class="caps">OCR</span>-A) was deemed inappropriate for use in Europe. Fruitger was commissioned to design this typeface to be used for European <span class="caps">OCR</span> while remaining aesthetically&nbsp;pleasing. </p>
    <p>• Iridium&nbsp;(1975)</p>
    <p>Iridium is a serif type designed with a relatively strong contrast between the thick and thin&nbsp;strokes.</p>
    <p>• <a href="/node/13517" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Frutiger</a> (1975)</p>
    <p>• Glypha&nbsp;(1979)</p>
    <p>Glypha is another slab-serif based on the forms of Univers, much like Serifa, but with a larger x-height for greater legibility, and more&nbsp;weights.</p>
    <p>• Icone&nbsp;(1980)</p>
    <p>A typeface based on stone inscriptions found in Normandy and&nbsp;Ireland.</p>
    <p>• Breughel&nbsp;(1982)</p>
    <p>A serif type designed for book and use at text sizes; like Meridien it was based on the forms of 16th century&nbsp;Jenson.</p>
    <p>• Versailles&nbsp;(1982)</p>
    <p>A serif typeface suitable for headlines and small amounts of copy that was based on inscriptions from 19th century France, in particular those found on the back of the tombstone of Charles&nbsp;Garnier.</p>
    <p>• <a href="/node/12462" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir</a> (1988)</p>
    <p>Avenir, French for future, is a geometric sans-serif, with many similarities to Futura. It was designed in a number of different weights. The forms of the letters are not completely geometric and this aspect of the face is what gives it its own distinct character that separates it from other geometrics such as Futura and Century Gothic. Avenir is also highly legible, and has recently been revised, like Frutiger Next, by Linotype and Frutiger himself to include true italics and other features. The new family is called <a href="/node/12461" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Avenir&nbsp;Next</a></p>
    <p>• Vectora&nbsp;(1990)</p>
    <p>Vectora is a sans-serif typeface inspired by American-styled typefaces such as Franklin and News&nbsp;Gothic.</p>
    <p><strong>Sources:</strong></p>
    <p>“Adrian Frutiger.” Wikipedia. 06 May 2005 - <a href="http://en.wikipedia.org/wiki/Adrian_Frutiger">http://en.wikipedia.org/wiki/Adrian_Frutiger</a>.</p>
    <p>“Frutiger.” Wikipedia. 06 May 2005 - <a href="http://en.wikipedia.org/wiki/Frutiger">http://en.wikipedia.org/wiki/Frutiger</a>. </p>
    <p>Kunz, Willi. <cite>Typography: Macro + Microaesthetics.</cite> Zurich, Switzerland: Verlag Niggli, 1998.&nbsp;22-23.</p>
    <p>Linotype. 06 May 2005 - <a href="http://www.linotype.com">http://www.linotype.com</a>.</p>
    <p>Müller-Brockmann, Josef. <cite>Grid Systems In Graphic Design.</cite> Zurich, Switzerland: Verlag Niggli, 1996.&nbsp;22. </p>
    <p>“Univers.” Wikipedia. 06 May 2005 <a href="http://en.wikipedia.org/wiki/Univers">http://en.wikipedia.org/wiki/Univers</a>. </p>
    <p><a href="http://www.katranpress.com/stamps_frutiger_1_1.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">A postage stamp designed by Adrian&nbsp;Frutiger</a></p>
