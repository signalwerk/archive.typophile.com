    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Adrian Frutiger</strong> (born March 24, 1928)</p>
    <p>Adrian Frutiger is best known as a type-designer. He has produced some of the most well known and widely used typefaces. He was born in 1928 in Interlaken, Switzerland, and by the age of 16 was working as a printer's apprentice near his home town. Following this he moved to Zurich where he studied at the Zurich School of Arts and Crafts, under Professor <a href="/wiki/Walter%20Kach" class="freelinking" rel="nofollow">Walter Kach</a>. </p>
    <p>After his education in Zurich, Frutiger moved to Paris where he started to work at the <a href="/wiki/Deberny%20%2526%20Peignot" class="freelinking" rel="nofollow">Deberny &amp; Peignot</a> typefoundry. Here he helped the foundry move classic typefaces used with traditional printing methods to newer phototypesetting technologies.</p>
    <p>At the same time Frutiger started to design his own typefaces, a few of which became very significant, and this earned him his status as a great type designer. Throughout his career he has produced a number of books, such as:</p>
    <p>Type, Sign, Symbol (1980)<br>
    Signs and Symbols: Their Design and Meaning (1989)<br>
    The International Type Book (1990)<br>
    Geometry of Feelings (1998)<br>
    The Development of Western Type Carved in Wood Plates (1999)<br>
    Forms and Counterforms (1999)<br>
    Life Cycle (1999)<br>
    The Univers (1999)<br>
    Symbols and Signs: Explorations (1999)</p>
    <p>Today his typefaces are readily available from a number of different foundries. He is still alive (2005) and has worked on revisions with Linotype of a number of his typefaces. Such recent collaborations have resulted in Frutiger Next and Avenir Next, which have included refined forms and true italics. Presently Frutiger lives in Bern, Switzerland and is working with woodcuts.</p>
    <p><strong>The Types of Adrian Frutiger:</strong></p>
    <p>• President (1952)</p>
    <p>Although often disregarded, this was Frutiger’s first commercially released typeface, by the Deberny &amp; Peignot type foundry. The typeface was crucial in Frutiger's development as a designer and taught him much about letterforms that he applied to his future designs.</p>
    <p>• Phoebus (1953) </p>
    <p>• Ondine (1954) </p>
    <p>• Méridien (1955) </p>
    <p>Méridien is considered to be Frutiger’s first significant typeface, and inspired by 16th-century Jenson. </p>
    <p>• Egyptienne (1956)</p>
    <p>This is a slab-serif face designed right before he designed Univers, and has many resemblances to the style of Clarendon.</p>
    <p>• <a href="/wiki/Univers" class="freelinking" rel="nofollow">Univers</a> (1956)</p>
    <p>• Apollo (1962)</p>
    <p>Apollo is an old-style serif typeface designed to have the dual functionality of headline as well as body text.</p>
    <p>• Serifa (1967)</p>
    <p>Serifa is a slab-serif design, based on the forms of Univers. It was designed to be used a large variety of sizes.</p>
    <p>• OCR-B (1968)</p>
    <p>The typeface used for optical character recognition in America (OCR-A) was deemed inappropriate for use in Europe. Fruitger was commissioned to design this typeface to be used for European OCR while remaining aesthetically pleasing. </p>
    <p>• Iridium (1975)</p>
    <p>Iridium is a serif type designed with a relatively strong contrast between the thick and thin strokes.</p>
    <p>• <a href="/wiki/Frutiger" class="freelinking" rel="nofollow">Frutiger</a> (1975)</p>
    <p>• Glypha (1979)</p>
    <p>Glypha is another slab-serif based on the forms of Univers, much like Serifa, but with a larger x-height for greater legibility, and more weights.</p>
    <p>• Icone (1980)</p>
    <p>A typeface based on stone inscriptions found in Normandy and Ireland.</p>
    <p>• Breughel (1982)</p>
    <p>A serif type designed for book and use at text sizes; like Meridien it was based on the forms of 16th century Jenson.</p>
    <p>• Versailles (1982)</p>
    <p>A serif typeface suitable for headlines and small amounts of copy that was based on inscriptions from 19th century France, in particular those found on the back of the tombstone of Charles Garnier.</p>
    <p>• <a href="/wiki/Avenir" class="freelinking" rel="nofollow">Avenir</a> (1988)</p>
    <p>Avenir, French for future, is a geometric sans-serif, with many similarities to Futura. It was designed in a number of different weights. The forms of the letters are not completely geometric and this aspect of the face is what gives it its own distinct character that separates it from other geometrics such as Futura and Century Gothic. Avenir is also highly legible, and has recently been revised, like Frutiger Next, by Linotype and Frutiger himself to include true italics and other features. The new family is called <a href="/wiki/Avenir%20Next" class="freelinking" rel="nofollow">Avenir Next</a></p>
    <p>• Vectora (1990)</p>
    <p>Vectora is a sans-serif typeface inspired by American-styled typefaces such as Franklin and News Gothic.</p>
    <p><strong>Sources:</strong></p>
    <p>"Adrian Frutiger." Wikipedia. 06 May 2005 - <a href="http://en.wikipedia.org/wiki/Adrian_Frutiger" rel="nofollow">http://en.wikipedia.org/wiki/Adrian_Frutiger</a>.</p>
    <p>"Frutiger." Wikipedia. 06 May 2005 - <a href="http://en.wikipedia.org/wiki/Frutiger" rel="nofollow">http://en.wikipedia.org/wiki/Frutiger</a>. </p>
    <p>Kunz, Willi. <cite>Typography: Macro + Microaesthetics.</cite> Zurich, Switzerland: Verlag Niggli, 1998. 22-23.</p>
    <p>Linotype. 06 May 2005 - <a href="http://www.linotype.com" rel="nofollow">http://www.linotype.com</a>.</p>
    <p>Müller-Brockmann, Josef. <cite>Grid Systems In Graphic Design.</cite> Zurich, Switzerland: Verlag Niggli, 1996. 22. </p>
    <p>"Univers." Wikipedia. 06 May 2005 <a href="http://en.wikipedia.org/wiki/Univers" rel="nofollow">http://en.wikipedia.org/wiki/Univers</a>. </p>
