    html: |-
      <p>Dan, yes, I did excuse myself from the non-Latin advisory panel this year, as did Fiona Ross. We wrote to Maxim Zhukov, organiser of the advisory panel, and to Matthew Carter, the chairman, prior to the competition to let them know that neither of us were able to participate because we were submitting a design. We recommended some possible replacements. Maxim later contacted me to see if I could recommend someone qualified to take a look at entries in two scripts for which he did not have advisors (neither script Devanagari), and I gave him some names. He was unable to find anyone to review one of the entries, and asked me some questions about the design, to which I gave what I believe were impartial answers regarding its fitness to the stated purpose of the design (low res devices). I believe, although I have not seen confirmation yet, that the design was the 'OTS Ethiopic' from Monotype Imaging, for which the TDC are apparently awaiting artwork for the website.</p>
      <p>It's unfortunate that the number of people with experience designing for certain scripts is small, but such scripts shouldn't be penalised during the judging due to lack of qualified advice.</p>
