      <p>Thanks for the comment, James. That felt good. I just wanna say that actually it’s not the first time that two Mexican are selected in the same year. It happened in 2006 —Gabriel Martínez Meave (yes, Presidencia’s author) and Alejandro Lo Celso, although Lo Celso is certainly more Argentinian than Mexican—, and in 2005 Leonardo Vázquez won with Bunker, a display face. And Martínez Meave again in 2001. Maybe the difference is that this year we had significant clients: a renowned publishing house and the Presidency of Mexico (no less).</p>
      <p>Of course, I hope this will be repeated.  ;)</p>
