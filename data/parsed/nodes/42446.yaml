      <p>Paul: <cite>although i don’t think I would mind seeing [Anselm] all the time</cite></p>
      <p>Neither would I! Though right now, I haven't seen it in use anywhere, and I'm itching to see examples. I know, it was only released last year, but hey, I'm impatient.</p>
      <p>In my search for Anselm in use, I ran into <a href="http://www.hpmuseum.org/cgi-sys/cgiwrap/hpmuseum/archv017.cgi?read=128086" rel="nofollow">this surreal thread</a> about the font choice for labels in an open calculator project. As far as I can tell, a group of aficionados are collaborating to build a calculator, code name Phoenix. One of them has suggested Anselm (sans, I believe) for the labels, and has even contacted Franta Štorm about extending the character set as needed for a scientific calculator, and got a positive response from him.</p>
      <p>Wow, that's one use I had not thought of.</p>
