      <p>I don't remember Anselm being discussed much here or elsewhere. Has anyone used it? It is certainly an impressive type system in its coverage of sans and serif, multitude of weights, and Cyrillic and Greek scripts. It certainly seems to have aspirations of being a versatile workhorse.</p>
      <p>What do people think of its Baroque spirit and distinctive flavour, though? As much as I admire it, I do worry it might be a bit too flashy for "serious" work. I guess you can never accuse František Štorm of being boring...</p>
