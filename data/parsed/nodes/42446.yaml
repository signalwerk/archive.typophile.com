      <p>Hi, I think it’s my first post here. I’ve seen my name and, you know…</p>
      <p>Unfortunately, Fondo is not for sale. It was a custom font exclusive for Fondo de Cultura Económica. It had pros and cons: as a pre-paid job I had all the tranquility to focus my efforts on this project for a year or so (and I suppose that influenced the forms), but on the other hand it was, from the beginning, only for them.</p>
      <p>Anyway, your comments makes me keep going, since it’s my first really finished work, because the other one, Espinosa —a revival from the Mexican XVIth Century, commented in this forum long time ago— still awaiting and requires a major surgery.</p>
      <p>Best,</p>
      <p>CH</p>
