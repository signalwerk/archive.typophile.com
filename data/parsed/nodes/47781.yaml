      <p>The lines you have there now are looking a bit too 'newspapery' to me. Try taking them out and see how it looks. If it's too boring try manipulating the text itself to make it more unique. </p>
      <p>I do like that you scaled it down in size though. </p>
      <p>Magazines that are cluttered aren't magazines that are read. The same goes for marks and logotypes.</p>
