    <p>Hello, hi</p>
    <p>The magazine's name is "SALDO" which means something like "bank balance" in Swedish (it's for the business students). Basically it containt useful info for students, interviews (sometimes with bigshots like the Swedish finance minister!) and other stuff that's relevant for a business student. </p>
    <p>Current logo is in Arial Black which has an added shadow and wider than usual letters. </p>
    <p>I've drawn some own letters that are meant to look like Arial/Helvetica but much more simple in their form. However I'm having a hard time with the letter 'S'. </p>
    <p>Even though it's starting to not look like complete crap it doesn't seem to fit with the other letters at all. </p>
    <p>I'd be happy with all help I can get. </p>
    <p>The final logo will have the smaller text and line underneath it. Oh, and don't be shy to criticize the other letters and whole design. </p>
    <p>Old (current) logo<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/saldo_logo_old_4511.jpg"></div><p></p>
    <p>New (work in progress) logo<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/saldo_logo_new_01_6064.jpg"></div><p></p>
