      <p>Thirty spokes converge on a hub<br>
      but it's the emptiness<br>
      that makes a wheel work.<br>
      Pots are fashioned from clay<br>
      but it's the hollow<br>
      that makes a pot work.<br>
      Windows and doors are carved for a house<br>
      but it's the spaces<br>
      that make a house work.<br>
      Existence makes something useful<br>
      but nonexistence makes it work.</p>
      <p>    – Tao Te Ching, verse 11</p>
