      <p>Here's a quote by Albert Kapr on one of his designs:<br>
      "The basic concept is to string together narrow white hexagons as counters and inter-letter spaces, defined by vertical stems and triangular serifs. The interior spaces are at least as important as the strokes that make up the characters." (<a class="freelinking external" href="http://www.justanotherfoundry.com/Lapture/index.htm]" rel="nofollow">source</a>)</p>
