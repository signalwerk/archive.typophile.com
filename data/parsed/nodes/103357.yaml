    <p>Greetings,<br>
       I am looking for a script to install on my web site where a customer can type in their printing information &amp; see how it will look to view the different fonts we offer available for them to order.<br>
     as like this showing<br>
    <a href="http://www.typetester.org/" title="http://www.typetester.org/">http://www.typetester.org/</a></p>
    <p> I was wondering if anyone would be able to help me learn or know where to go for such a script to do this on my web site or if you offer this.</p>
    <p> Thank you for your time<br>
     Edward</p>
