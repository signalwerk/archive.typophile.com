      <p>If this is your first font, I suggest you team up with someone with a little more experience. There are plenty of caveeats, and scripting is the least of them.</p>
      <p>A certain degree of randomness is often called far when emulating handwriting, and scripting a (pseudo) random feature using multiple sets of alternates is a fairly easy task. With Type 3 you could even mess with the curves, but this format is by and large defunct by now. I also suggest (as someone once suggested to me) you explore how the writer adapt his/hers writing to context.</p>
