    <p>Hello Typophiles, been a while since I've been on here, hope everyone is well.</p>
    <p>I have recently accepted a design job, nothing too strenuous, and I was thinking about designing a custom handwritten font. This would be the first time I've properly attempted to design one (handwritten or not), and I want to learn more about the misty realm of contextual alternates. </p>
    <p>I was reading an excellent article about them, written by Nick Shinn, someone who I believe roams the forums here, but I still have a couple of questions and I hope you can all help.</p>
    <p>First of, do you need them to properly execute a handwritten font? Attached is a sample of the style of handwriting I'll be emulating (not looking for critiques just yet, and yup I will be increasing legibility) so you can judge it subjectively...</p>
    <p>Second, should I outsource the scripting job to someone with more experience? I have no fear designing the font and the alternates myself, but actually publishing the font and creating the script required might be a little out of my comfort zone.</p>
    <p>Thirdly, if I do decide to take the challenge on, what program should I be using to write the script? And will Fontlab Studio work with it? (I work on a Mac, and craft all of my draft glyphs in Illustrator, if that is relevant).</p>
    <p>Forgive my ignorance, I'm only starting in this business and eager to learn</p>
    <p>Cheers,</p>
    <p>chillyphilli</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_5895.jpg"></div><p></p>
