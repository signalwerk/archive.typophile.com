      <p>Your choices for "programming" contextual alternates are MS Volt (GUI, Windows only), writing <a href="/wiki/www.adobe.com/devnet/opentype/afdko/topic_feature_file_syntax.html" class="freelinking" rel="nofollow">feature files</a> by hand (you can either then "compile" them using Adobe's AFDKO command line tools, or from within FontLab), or FontForge which have both GUI for OpenType code and can import feature files.</p>
      <p>It can be a bit of learning, especially if you want something "clever", in addition to the usual font development stuff, but nothing can't be dealt with given enough time.</p>
