    <p></p><div class="imageWrap"><img src="http://typophile.com/files/286831759_659caed09f_o_4908.gif"></div><br>
    .<br>
    Typies is an original and special blog where their contributors try to deal with typographic and graphic design topics. Their aim is to help graphic designers to forget their fears and start working on types.<br>
    Typies is a very didactic blog, and the topics it deals with, are unusually mentioned on typographic books. You will note that the information in this blog is very useful and easy to understand.<br>
    Ideal for newer typographic designers.<br>
    .<br>
    <a href="http://typies.blogspot.com" title="http://typies.blogspot.com">http://typies.blogspot.com</a><p></p>
