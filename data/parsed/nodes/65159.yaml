    <p></p><div class="imageWrap"><img src="http://typophile.com/files/International_LibraryofTechinology_3509.png"></div><p></p>
    <p>While researching the International Correspondence School recently, I was reminded of the odd-ball J.D. Salinger short story about a young man reduced by sad financial circumstances to take a job as a correspondence art course instructor, "De Daumier-Smith’s Blue Period": <a href="http://www.freeweb.hu/tchl/salinger/blueperiod.html" title="http://www.freeweb.hu/tchl/salinger/blueperiod.html">http://www.freeweb.hu/tchl/salinger/blueperiod.html</a></p>
    <p>I was researching the correspondence school to find out from where this technical text book came: <a href="http://books.google.com/books?id=f6lIAAAAMAAJ&amp;dq=International+Library+of+Technology...Engraving+and+Printing+Methods&amp;printsec=frontcover&amp;source=bl&amp;ots=PAJapulqki&amp;sig=4a-yjKy_RMPTHb7Kjy_awj9MlMY&amp;hl=en&amp;ei=6VwdS9OfF9OWtgeSod3SAw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=1&amp;ved=0CAgQ6AEwAA#v=onepage&amp;q=&amp;f=false" title="http://books.google.com/books?id=f6lIAAAAMAAJ&amp;dq=International+Library+of+Technology...Engraving+and+Printing+Methods&amp;printsec=frontcover&amp;source=bl&amp;ots=PAJapulqki&amp;sig=4a-yjKy_RMPTHb7Kjy_awj9MlMY&amp;hl=en&amp;ei=6VwdS9OfF9OWtgeSod3SAw&amp;sa=X&amp;oi=book_result&amp;ct=result&amp;resnum=1&amp;ved=0CAgQ6AEwAA#v=onepage&amp;q=&amp;f=false">http://books.google.com/books?id=f6lIAAAAMAAJ&amp;dq=International+Library+o...</a></p>
    <p>There’s a great article about correspondence art schools by Steve Heller in the 12.15.09 Design Observer: <a href="http://observatory.designobserver.com/entry.html?entry=7687" title="http://observatory.designobserver.com/entry.html?entry=7687">http://observatory.designobserver.com/entry.html?entry=7687</a></p>
