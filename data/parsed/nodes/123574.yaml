      <p>Adriano, by the now defunct OPTI Castcraft Foundry:</p>
      <p><a href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=OPTI-Castcraft%20%2F%20%28Freemium%29&amp;ffam=AdrianoOpti%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=6ddbba23a793d361e3db203c6a36a614&amp;wrap=2&amp;text=WilliamChristenberry" title="http://www.findmyfont.com/index.php/fonts/font-preview?fset=OPTI-Castcraft%20%2F%20%28Freemium%29&amp;ffam=AdrianoOpti%20-%20Regular&amp;fstyle=&amp;fsize=60&amp;fid=6ddbba23a793d361e3db203c6a36a614&amp;wrap=2&amp;text=WilliamChristenberry">http://www.findmyfont.com/index.php/fonts/font-preview?fset=OPTI-Castcra...</a></p>
      <p>OPTI was famous for “appropriating” their designs from others—does anyone know if this typeface is a clone of another typeface? The OPTI archive site claims that Adriano is based on Aeterna, but that doesn’t seem to be a match....</p>
      <p>EDIT—Aeterna AKA Jost Mediaeval discussed here:<br>
      <a href="http://typophile.com/node/107102" title="http://typophile.com/node/107102">http://typophile.com/node/107102</a></p>
