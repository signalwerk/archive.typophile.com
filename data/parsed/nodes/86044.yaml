  html: <p>What would you call a "Didone" (high thick/thin contrast) sans-serif? There doesn't appear to be a class that I am aware of.</p>
  html_clean: <p>What would you call a "Didone" (high thick/thin contrast) sans-serif? There doesn't appear to be a class that I am aware of.</p>
