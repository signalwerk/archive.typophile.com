    date_raw: 3 Oct 2011 — 4:02pm
    votes: null
    html: |-
      <p>This is because the classification doesn’t consider this element. A sans with high contrast between thin and thick could be a geometric, like my Noir. Or it could be a humanist like Optima. Or a grotesque, like Giorgio. *</p>
      <p>Even in a serif, the contrast isn’t really that big a part of the classification. It’s more about the shift in skeletal form and writing tool, and this again plays out in the rythm and contrast and the details.</p>
      <p>* Of course, very few faces are spot on. Many geometric designs incorporate grotesque or humanist traits, for example.</p>
