    html: <p>Contrast is just one characteristic of a typeface. Didones have high contrast, but by most definitions they also have a specific type of unbracketed serif. So, too, would a sans with high contrast have other traits. It could be "<a href="http://www.fontshop.com/fonts/downloads/linotype/optima_std_complete_pack/?affid=99346" rel="nofollow">high contrast humanist sans</a>" or "<a href="http://new.myfonts.com/fonts/urw/britannic/?refby=typographica" rel="nofollow">high contrast Grotesque</a>". They are also sometimes called "stressed sans".</p>
    html_clean: <p>Contrast is just one characteristic of a typeface. Didones have high contrast, but by most definitions they also have a specific type of unbracketed serif. So, too, would a sans with high contrast have other traits. It could be "<a href="http://www.fontshop.com/fonts/downloads/linotype/optima_std_complete_pack/?affid=99346" rel="nofollow" class="link-external">high contrast humanist sans</a>" or "<a href="http://new.myfonts.com/fonts/urw/britannic/?refby=typographica" rel="nofollow" class="link-external">high contrast Grotesque</a>". They are also sometimes called "stressed sans".</p>
