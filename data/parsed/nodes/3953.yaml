  html: <p> Hi all, <br>Does anyone know where I could find info on what fonts translate best to video? I am really looking for the San Serif of video and info on what to look for in a font for video. Also info like what is the smallest size (point size + DPI and/or pixel height) that should be used for video.  -thanks </p>
