    <p>This is not a release notice. However, in a couple of months, the Fontry will release three fonts with a patriotic theme. They are the brain storm of Mike Adkins. The package consists of font files (regular, bold, italic) which form the components of the stars and stripes over the regular font. This is a how to for using the fonts. Your thoughts and opinions of the document would be appreciated.</p>
    <p>Thanks,<br>
    JLS</p>
