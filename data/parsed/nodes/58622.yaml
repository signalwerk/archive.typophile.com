      <p>@James: I'd imagine the thinking behind the "italic, bold-italic" etc., style naming is so that semi-savvy users can apply the second variety simply by hitting the italics/bold buttons in their applications rather than having to manually go back to the font list dropdown to re-select the next font.<br>
      ________________________________________________<br>
