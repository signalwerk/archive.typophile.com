      <p>Been studying Todd Klein’s work? </p>
      <p>From a design perspective I really appreciate what you’re doing, it reminds me of the packaging of GI Joe toys from the 1980s and is totally appropriate. But I wonder if a simpler set of instructions might be useful for people who might get distracted by the stars and stripes and miss the explanation. There are a lot of designers who can barely cope with their software to begin with, try to take it easy on them.</p>
      <p>Also, do you really need to keep the named of the layer fonts as Italic, Normal-Italic, etc? Or could you name them after their functions?</p>
    html_clean: |-
