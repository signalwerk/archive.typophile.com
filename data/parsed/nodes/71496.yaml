  html: |-
    <p>Hey guys, I just need a bit of advice/opinions really.<br>
    I've been commissioned to build a display font for a client which I've done. They are now requesting cyrillic &amp; greek extensions for other territories to use. Now what I'm wondering is what's the norm for this, ie. do you build the extra glyphs into the same font as extra unicode characters or do separate font files for the European, Cyrillic and Greek versions?<br>
    Thanks in advance, any help is gratefully appreciated!<br>
    Si</p>
