    <p>I would welcome any feedback on the attached logo(type), I am looking for some opinion on letterspacing, ideally I'd like to keep the logo the same length as it is already. Also any suggestions as to supportive typefaces for use in corporate literature and electronic documents (internal email etc). The company, Greencell, supply avocados, kiwi fruits and like to reatil outlet Waitrose amongst others and are very happy with what they have seen so far (the result as attached) so not a lot can change, it's now at the fine tuning stage. All comments  positive and negative will be greatly appreciated.</p>
