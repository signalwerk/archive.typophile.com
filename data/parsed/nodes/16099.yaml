    html: <p>The leaf 'icon' up until recently has been separate to the type however because the g character of the word is to be used standalone as a graphic device, we (the client and myself) had a problem whereupon the g by itself (with the green leaf to the right and up and out somewhat looked too much like the number 9 and because the logo will be used in non-English speaking countries there was the possibility that the green leaf looked like random punctuation. There is also the intention for the icon disappear at smaller sizes to reinforce the g being read as a g. I would post a sample but I am at home. p.s I am Lumo at work, LMcat at home.</p>
