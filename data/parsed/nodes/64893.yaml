  html: |-
    <p>New licensing schemes have been launched for Andron. The idea behind is to stretch costs over time in order to keep the entrance price rather low. </p>
    <p>A special instalment plan is offered for students, who now can get started with Andron at incredible €45. </p>
    <p>Another special license is adressed at publishers who edit scientific journals, and their authors.</p>
    <p>Since this kind of licensing is bound to handle a standing order payment it may be less interesting for those who don’t have a German bank account for the time being (banks tend to extra charge you for cross-border payment orders). Consequently the offerings <a class="freelinking external" href="http://www.signographie.de/contenido/index.php?contenido=3b73786a570fca618bd224903f3141e9" rel="nofollow">are presented here</a> in German by now. But I’m prepared to give any further explanation in English if required.</p>
