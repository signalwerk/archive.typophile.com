    html: |-
      <p>Sorry, I thought that you were asking if you could use OpenType to automatically assign color to parts of the type.</p>
      <p>I think that what ffdingbats does is use the stylistic set to switch to versions that have no width and/or are positioned to the left of the left sidebearing so that they overlap. This makes sense for these dingbats because they aren’t going to see much interaction after being set. But if you do it with letters things could get really ugly when you decide to change the copy or start recoloring stuff (because the text is going to start reflowing and possibly leave its frame), so I think it would be easier on the end-user if you just use multiple fonts.</p>
    html_clean: |-
