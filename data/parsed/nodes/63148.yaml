    html: |-
      <p>In pre-OpenType days when I was still a student at RIT, I made a collection of fonts that could be used to create multi-color borders. The idea was you'd type a "master" character (e.g. top-left corner), then change fonts (and colors, if you like) and type the corresponding overlay piece; repeat for each element. The overlaid pieces all had zero advance widths, with the master controlling escapement across the page. It was a pain in the ass, to be sure, but it worked and there was really no other alternative for nice borders at the time (beyond Quark's lame-o raster-based frames).</p>
      <p>Things aren't really much different at the font level today; you still can't specify colors inside of a font. You can code in substitutions/ligatures, etc. but that doesn't really help, because you need to intercept the substitution to change color on the different parts. So you have the hassle of doing that all manually*, or the hassle of introducing a custom application (as Monotype BorderMaker did back in the early 1990s) and export/import (and probably losing some editability along the way).</p>
      <p>*With the various scripting technologies that are more widely available in apps today, this kind of thing could possibly be made a bit easier on an end-user, but OpenType itself doesn't really bring anything new to the game (other than slightly more convenient packaging). And of course then you have the problem of having to create and maintain the scripts, in addition to the font.</p>
    html_clean: |-
