    <p>Hello type lovers!<br>
    I'm currently designing a typeface with two layers or colors. I think it is more useful to program this kind of things than doing them manually when you set some text. So, my doubt is about opentype programming, how can I make this using an OT feature? I'm pretty sure it is possible to do it, I've been looking up for information about it and so far I haven't find anything.<br>
    Sorry, I could not upload the image to the forum, so I uploaded it to my <a href="http://www.flickr.com/photos/elibaal/4014785159/" rel="nofollow">flickr gallery.</a><br>
    Thanks in advance.</p>
