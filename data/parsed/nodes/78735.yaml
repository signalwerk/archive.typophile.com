  html: |-
    <p>We're offering the last few prints of this one-off broadsheet, just in time for your Wood Type loving Valentine!<br>
    All proceeds support the Dubuque Book Arts Center at SlowPrint Letterpress!</p>
    <p><img src="http://ny-image2.etsy.com/il_570xN.204502962.jpg"><br>
    Please see the <a class="freelinking external" href="http://www.etsy.com/listing/64982647/valentine-love-is-an-endless-mystery" rel="nofollow"> Etsy listing</a> </p>
    <p>"Love is an endless mystery for it has nothing else to explain it."<br>
    quotation from "Fireflies" by Nobel Prize winning Indian Poet Rabindranath Tagore<br>
    (<a href="http://en.wikipedia.org/wiki/Rabindranath_Tagore" title="http://en.wikipedia.org/wiki/Rabindranath_Tagore">http://en.wikipedia.org/wiki/Rabindranath_Tagore</a>)</p>
    <p>11 x 15 inch limited edition of thirty-three; four-color (three inks and blind emboss) on dampened Rives BFK 250gsm paper. Designed and printed using 19th century wood type, hand-set foundry type and photopolymer (for the blind emboss) on our Vandercook 219 press at Slowprint Letterpress Studio in Dubuque, Iowa by Peter Fraterdeus.</p>
    <p>Featured in two books on letterpress: "Impressive!" from Gestalten (Berlin); and "Adventures in Letterpress" coming from Mark Batty Publishers (New York)</p>
    <p>This is a limited edition which will not be reprinted.<br>
    The first forty un-numbered were sent to the U. of Iowa Center for the Book print-exchange. </p>
    <p>Note that there are variations in the color density throughout the edition, some are very subtle others more saturated.</p>
