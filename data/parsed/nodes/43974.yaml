    <p>I'm working on a project that requires some authentic victorian-style typefaces. I have an old solotype catalog which I have been referencing. And while many of the typefaces are common, others aren't and I can't even find them via google.</p>
    <p>For example,</p>
    <p>Grand Wood<br>
    Grandiose<br>
    Lattice<br>
    Madison</p>
    <p>Does anyone know if these are digitized and for sale anywhere?</p>
    <p>Thanks,<br>
    –Nic</p>
