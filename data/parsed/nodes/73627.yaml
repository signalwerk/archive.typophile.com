    date: 2010-08-28T12:19:00
    date_raw: 28 Aug 2010 — 12:19pm
    votes: null
    html: |-
      <p>1.625 is almost exactly the Golden Ratio (1.618).</p>
      <p>But be careful. The O in Futura is not a perfect circle. It's slightly wider than it is tall, at least that's what I see when I convert Futura to outlines in InDesign and then look at the W and H dimensions: </p>
      <p>12 pt Futura by Adobe</p>
      <p>Light<br>
      W = 0p9.383<br>
      H =  0p9.286</p>
      <p>Book<br>
      W = 0p9.43<br>
      H =  0p9.358</p>
      <p>Bold<br>
      W = 0p10.007<br>
      H =  0p9.647</p>
