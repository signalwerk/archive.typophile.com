  html: <p>I was wondering if anyone knew the exact ratio of Futura's perfect circle lowercase "o". In other words how much larger the "outer" circle is than the "inner" to make up the weight of the letterform?</p>
  html_clean: <p>I was wondering if anyone knew the exact ratio of Futura's perfect circle lowercase "o". In other words how much larger the "outer" circle is than the "inner" to make up the weight of the letterform?</p>
