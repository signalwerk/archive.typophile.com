  html: |-
    <p>Hi, </p>
    <p>I'm wondering if anyone can help me identify this typeface from the following article on the Internet: </p>
    <p><a href="http://www.bloodyelbow.com/2011/10/31/2521315/the-forgotten-golden-age-of-mixed-martial-arts-part-iv-ultimate" title="http://www.bloodyelbow.com/2011/10/31/2521315/the-forgotten-golden-age-of-mixed-martial-arts-part-iv-ultimate">http://www.bloodyelbow.com/2011/10/31/2521315/the-forgotten-golden-age-o...</a></p>
    <p>If you scroll down a little you'll see the attached image. </p>
    <p>To me, it looks like it was an image of a subheads from an old newspaper articles and then integrated into the design of the page for a faux aged effect. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/wrestler_v_boxer_3825.png"></div><p></p>
    <p>Thanks!</p>
