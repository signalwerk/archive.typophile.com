    <p>Hi all, I'm looking for a typeface called Futura T. We have it in our office type library and are using it in a project for a client, but need to hand it off now and just cannot find it anywhere. We looked at URW but they don't offer the specific face we need, Futura T Light Re 1? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/futurat_5320.jpg"></div><p></p>
    <p>on the left. The right is Futura T Light Shaded 1, from the same family we have. We've had no luck finding anything on these shaded faces, only regular book ones. Does anyone know anything about them, or if we could purchase them anywhere? Thanks</p>
  html_clean: |-
    <p>Hi all, I'm looking for a typeface called Futura T. We have it in our office type library and are using it in a project for a client, but need to hand it off now and just cannot find it anywhere. We looked at URW but they don't offer the specific face we need, Futura T Light Re 1? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/futurat_5320.jpg"></div><p></p>
    <p>on the left. The right is Futura T Light Shaded 1, from the same family we have. We've had no luck finding anything on these shaded faces, only regular book ones. Does anyone know anything about them, or if we could purchase them anywhere? Thanks</p>
