      <p>Sorry if this isn't much help, but it's an observation.<br>
      Those fonts look like pretty straightforward mechanical modifications.<br>
      Another face in the genre is Gill Sans Shadowed, which is slightly more interesting--note that the shapes have been nuanced on a per-letter basis. All four angles here are different:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Nangle2_3883.jpg"></div><p></p>
