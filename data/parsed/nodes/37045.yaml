      <p>Futura T is a URW face. The T stands for Text (as opposed to D for display). Those shaded fonts you show were part of a URW CD collection called "Design Collection"</p>
      <p>Unfortunately I think a lot of those URW faces are now unavailable. Did you look on FONTS.COM? I remember looking through their library a few months ago, looking in vain for a particular URW font, and noticed that they did have some of them.</p>
      <p>James</p>
