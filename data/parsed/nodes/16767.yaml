      <p>/ / / / / </p>
    <p>For Immediate Release<br>
    Monday, December 12, 2005<br>
    Contact: Ted Harrison<br>
    Fontlab Ltd.<br>
    136 E 8th St., Port Angeles WA 98362, USA<br>
    Tel: +1 (509) 272-3260<br>
    <a href="https://web.archive.org/web/20081011045450/mailto:contact@fontlab.com">contact@fontlab.com</a></p>
    <p>Port Angeles, WA, USA – December 12, 2005.</p>
    <p>Fontlab Ltd. announces the release of <a href="https://web.archive.org/web/20081011045450/http://www.fontlab.com/studio/">FontLab Studio 5</a> for Mac OS X.</p>
    <p>Following the release of FontLab Studio 5 for Windows in September 2005, Fontlab Ltd. now announces the availability of the next-generation professional font editor for Mac OS X. As a major upgrade of its predecessor FontLab 4.6, FontLab Studio 5 is a comprehensive solution for font foundries, professional type designers, typographers and graphic design studios, allowing them to design type, create, manipulate and modify fonts. FontLab Studio 5 supports all major outline font formats, including Type 1, TrueType, Multiple Master and OpenType.</p>
    <p>“The major focus of this release has been put on in-context type design,” said Yuri Yarmola, Vice President R&amp;D at Fontlab Ltd. and the application’s principal engineer. “Our new metrics and kerning editing environment adds a second dimension to the process of letterspacing by allowing the type designer to see the glyphs not only in a horizontal string but on a true two-dimensional page. The new neighbor and shape groups layers add another dimension to the process of glyph design by dynamically previewing related characters right in the glyph editing window.”</p>
    <p>According to Yarmola, practically every aspect of the application has been revised. “It was the users who shaped the development of the application. More than 90% of the changes in FontLab Studio 5 are based directly on customer feedback,” says Yarmola. The highlights of FontLab Studio 5 also include:</p>
    <p>-&gt; new improved proofing and printing,<br>
    -&gt; improved Bézier drawing tools,<br>
    -&gt; integrated autotracing (formerly only available in ScanFont, a separate product),<br>
    -&gt; improved font merging and blending,<br>
    -&gt; better OpenType and Unicode support,<br>
    -&gt; better autohinting,<br>
    -&gt; improved Python scripting support</p>
    <p>As well as hundreds of other improvements. FontLab Studio 5 retails at US$649.00 with attractive upgrade pricing available to users of previous versions as well as of Fontographer and TypeTool, the company’s other font editors. Visit the FontLab Studio 5 page at <a href="https://web.archive.org/web/20081011045450/http://www.fontlab.com/studio/" title="http://www.fontlab.com/studio/">http://www.fontlab.com/studio/</a> for more details.</p>
    <p>About Fontlab Ltd.<br>
    Fontlab Ltd. has stayed at the forefront of digital font management by remaining devoted to developing font editors and typography products. Their full line of products is dedicated to solving the most complex typography issues. These products include: AsiaFont Studio™, BitFonter™, FogLamp™, FontLab™, FontLab™ Studio, Fontographer™, ScanFont™, TypeTool™, TransType™, FontFlasher™, FONmaker™, SigMaker™ and CompoCompiler™. All products from Fontlab Ltd. carry a 60-day satisfaction guarantee. More information on all Fontlab products can be seen at <a href="https://web.archive.org/web/20081011045450/http://www.fonlab.com/">www.fontlab.com</a>.</p>
    <p>/ / / / /</p>
