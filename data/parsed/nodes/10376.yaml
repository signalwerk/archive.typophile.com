      <p>Note there is a big difference in "brevier". I tried to give a translation of some of the names (second row). I don't know if the actual size of type has been different due to the different units in american type. If this would be true an american "nonpareil" would differ in size from a german "nonpareil". But of course an old "Minion" with 7 didot-point was bigger in size than our 7 dtp-point. To get a "Minion"-size we ought to set in 7,44 pt (and of course depending on the actual shape of the glyphs on the body).</p>
