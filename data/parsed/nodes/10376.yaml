    html: "<p>Wow, that's good stuff! And a lot too (36 pages)! <br>Unfortunately it's true: Few new missals are typographically well done. Old ones are better for the most part. <br> <br><i>&gt;it was somewhat hastily completed, because the final text revisions arrived a short while before we needed to go to print</i> <br>That seems to be identical through continents and confessions ;-) On the positive side I would say: It shows, that the Mass is fresh and crisp. On the negative: Everybody always does his part in the last minute. Blame myself too of course. <br> <br>I like the printing in two colours - a good tradition of missal typesetting. <br>Unfortunately in our church there often is not enough money (or not enough care for liturgical capability to spend it) to work like this. <br> <br>The distinction between \"traditional\" and \"old fashioned\": Unfortunately my english is not so good to understand which implications you have - but it also may be in the words themselves: Which do you regard as better? <br>Here in Germany with good traditions lost due to Ultramodernism (I mean thinking that <i>all</i> old things are bad and <i>everything</i> new is entirely better, but that results to a good part from a very difficult relationship to history and the shadow of evil that has fallen on it), and now seeking for traditions that are able to take a weight (especially in parishes), everything is called \"traditional\" that has been done twice. Even if no one carries/trades that \"tradition\". <br> <br>I will post an example of missal booklet from me. <br> <br>I would find it a very interesting thread of its own: <br>\"Missal (booklet) typography\" <br>because there are interesting questions about setting the different types of text and dealing with tradition, readability and even dignity of words and also the influence of social atmosphere. <br>How make a modern, open, visual skilled booklet keeping long time weight of words? How to integrate explanations? And so on. <br> <br>Back to the setting of Latin: <br>I think its evenness is in the rhythm of the language. There is a clear difference in the visual form of latin text in whole sentences (with very very few capitals) and the passages where a lot of Names with capital first letters and a different distribution of consonants/vowels occur. <br> <br>Gesegneten Sonntag! (in english: have a blessed Sunday ?)</p>"
