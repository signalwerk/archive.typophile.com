    html: <p>In the book _Counter punch_ there is a reference to the earliest cutting of very small text size faces. <br> <br>Since book work is determined by conventional parent paper sizes, today and to some extent, always, there is only a certain range of point sizes that are appropriate. Early paper sizes were regulated in regard to size based on previous formats, which were based on the size of animal skins, e.g., goats, calves. An elephant folio sheet was one entire animal. Uterine calf was used for miniatures (both mother and unborn were sacrificed). The monestaries dedicated to scribal work were mass slaughterhouses, but set the standard that we still abide by. <br> <br>14-point is hardly an extremely large size however. The fine printer-publisher William Everson, who worked in larger format, recommended 16-pt as the ideal size for bookwork. Victor Hammer often worked at the larger end of the spectrum as well. There is some validity in this as most faces do seem to show their form best at larger sizes. This may be more a fine press/letterpress thing though. Fairly large text sizes are much more friendlier in regard to presswork. And, then there is the market as well; larger format books tend to have a higher selling price and are more likely to attract collectors.</p>
