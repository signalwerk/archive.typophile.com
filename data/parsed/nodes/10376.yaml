    html: "<p>Erratum: <i>...remembering that it is from the Latin verb traditio, to hand on.</i> <br> <br>The verb is actually <i>tradio</i>. I was very sleepy when I wrote that, having stayed up the night before to watch the live feed of the Pope's innaugural Mass, itself a study in both tradition and innovation. Watching Benedict XVI and the eastern rite patriarchs incense the tomb of Peter before the Mass, it was difficult to believe that this is a new addition to the innauguration of a Pope, which has never been included in the ceremony before: it is an innovation that joins to the tradition without the seams being visible.</p>"
