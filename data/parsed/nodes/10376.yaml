    html: <p>Yes, although this had changed by the time of the Elzevier editions referred to above, and most scribal abbreviations were abandoned. The point about hyphenation and evenness of word spacing is well made, but I think there is also a simple pleasantness in the frequency of certain letters and repetition of combinations in Latin. I recently set a bi-lingual Mass booklet for a friend's ordination, using the Dante types, and the Latin columns look much more magesterial than the English (in part, I admit, because Latin is a more efficient language, so I had to use a smaller point size for the English).</p>
