  html: "<p>I was wondering a couple of days ago if there has been variations in the size of book types trough history. <br> <br>I have the impression that typefaces of the XV and XVI centuries were printed in sizes of about 14 points, and read somewhere that during the XIX century mondern types were frequently printed in sizes of about 7 or 8 points. <br> <br>I know that today nobody would think of setting a normal book page in sizes as extreme as 7 or 14 points, but what about 100 or 400 years ago? <br> <br> <br>BTW, I just found out that the first fully digital typeface was Hermann Zapf's Marconi in 1976 (according to Gerard Unger: <a href=\"http://www.gerardunger.com/allmytypedesigns/allmytypedesigns04.html\" target=\"_blank\">http://www.gerardunger.com/allmytypedesigns/allmytypedesigns04.html</a>)</p>"
