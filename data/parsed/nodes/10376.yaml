    html: "<p>Regarding the distinction between traditional and old fashioned. Especially in the context of religion, I take an etymological stance on tradition: always remembering that it is from the Latin verb <i>traditio,</i> to hand on. Tradition is all about passing on of something of inherent value from one generation to another. Conversely, old-fashioned implies simply doing something superficially in the way it used to be done, without critically considering whether the thing has inherent value. The kind of ultramodernism to which you refer is similarly uncritical, in that it tends to treat all tradition as if it were merely a matter of fashion and taste, and not of inherent value. Some traditionalists, of course, make the opposite mistake, and in their fervour to defend tradition against modernist or post-modernist assault will adopt a reactionary position that clings to anything old-fashioned as a kind of reassurance. It seems to me that the only healthy position in all these options is that of true tradition: which requires a critical consideration of both past and present, but with dutiful acceptance of what is handed to us, maintaining it and handing it on in our turn, <i>and erring on the side of this </i>traditio<i> if we are uncertain about or unable to understand the value of what we have been handed.</i></p>"
