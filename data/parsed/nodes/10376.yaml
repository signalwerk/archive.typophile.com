    html: "<p><i>Do you read Latin fluently?</i> <br> <br>Alas, no; I wish I could, and hope to study more systematically in future: at the moment I'm picking up what I can as I go along. I have a basic understanding of grammar, and can often guess the noun declension and verb tense from the ending. I can follow the ordinary of the Mass very well, of course, and the psalms that we repeat during vespers and compline, but beyond that I'm either making guesses (often wrong) or looking at the English translation.</p>"
