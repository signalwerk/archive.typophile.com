      <p>I wasn't solely responsible for the ordination booklet, and it was somewhat hastily completed, because the final text revisions arrived a short while before we needed to go to print. Fr Joseph had originally been hoping to include the chant setting in the booklet, but in the end this needed to be printed on a separate folded sheet, because we didn't have time to get it typeset before the deadline for the booklet. It isn't perfect by any means: there are a couple of mistakes in the text, and some instances of less than ideal justification, but it made a good impression on the day. Some of the visiting FSSP clergy noted that it was better typeset than their missals. <br> <br>I decided to go for quite a large format, to keep the number of pages down and because we knew there would be a lot of elderly people in the congregation who would appreciate the decent size of the type. <br> <br>Here are a couple of PDFs. The cover is as printer spreads, so you'll have to imagine how it looks folded. <br> <br></p>
