    html: <p><i>...what does one have to do to get those gorgeous textures on the page?</i> <br> <br>Write in Latin. <br> <br>The Latin language looks better in the Latin script than any other tongue. There is an eveness of texture in the Latin language set in renaissance types that nothing else in our script matches. Jan Tschichold makes a similar observation in <i>The form of the book.</i></p>
