    html: <p>Some of the finest printing from small type, in very small pocket books, was done by the Elzeviers in the late 16th and 17th centuries. They also produced books at larger sizes, using larger type, up to folio size, but their small books are justly admired. The body type is usually about equivalent to 7pt or 8pt.</p>
