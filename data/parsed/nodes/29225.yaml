    <p>Interesting article in today's <a href="http://www.desmoinesregister.com/apps/pbcs.dll/article?AID=2006610310390" rel="nofollow">Des Moines Register</a> about a small Iowa school district that must change its athletic logo to avoid a trademark dispute with the University of Wisconsin.</p>
    <p>U. of Wisconsin's logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bilde_3795.jpg"></div><p></p>
    <p>Waukee High's logo:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/bilde-1_6616.jpg"></div><p></p>
    <p>Snip from the article:</p>
    <p><cite>There are only so many ways to reproduce the letter I. You have to be super-creative to come up with something unique. In fact, one might even say there is no such thing as a unique letter I. Almost every variation is merely a matter of typography. The same could be said about the letter W. That's why I hope Wisconsin didn't shell out the big bucks for this unique design.</cite></p>
    <p><cite>Here's how unique it is. See that W to the left? Looks a lot like Wisconsin's, doesn't it? I created this original W on my laptop in eight seconds. It's one of the type fonts in Microsoft Word. The Wisconsin W is three buttons away. Click "font" then "DispatchCond bold" then "control I" for italics. There it is. So which came first? DispatchCond bold italics or the "motion W"? Is it possible to trademark a type style?</cite></p>
    <p>The need to educate the author in the art of logo design notwithstanding (only 8 seconds!!) and trademark and copyright law (sadly, type designs themselves are not protected by either, but their names are), I'm curious as to your thoughts? </p>
    <p>And, anybody up for doing some pro bono design work for Waukee so that their football team has something on their helmets next year?</p>
