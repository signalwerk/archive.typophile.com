      <p>Matt,</p>
      <p>With Glosa I intended to design something with no exact historical reference, I wanted a typeface that seemed to be traveling through the years from the types cutted by Fleischmann to a more contemporary approach. Obviously it's possible to find some references in the details like the perfect ball terminals and sharped serifs. Above all, I wanted the typeface to be extremely readable and rigid, yet modern and fresh.</p>
      <p>Dino</p>
