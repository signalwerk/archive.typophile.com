  html: |-
    <p>Can anyone tell me what the design influences were in the making of Glosa? I can't find this information on dstype.com. Thinking about using it as the supporting typeface for all communications on an ID project I'm doing. I used Mercury for the logo, but the client can't afford to shell out $1,200+ for a typeface (it's for my church, tight budget). They will need to use it in-house, so they'll need to buy everything that we specify.</p>
    <p>I like Glosa because it reminds me a bit of both Scotch Romans and Dutch Fleischmanns. It feels quite appropriate for my (Presbyterian) church. Anyone know the backstory? I see Dino's icon lurking down at the bottom...perhaps he would be so kind as to elucidate for me :)</p>
    <p>Cheers,<br>
    Matt</p>
