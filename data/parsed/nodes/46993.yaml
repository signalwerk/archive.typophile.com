      <p>Matt,</p>
      <p>Where are you getting $1200.00 as a price for Mercury? There are many, many choices of bundles to choose from. Look at the <a class="freelinking external" href="http://www.typography.com/fonts/font_styles.php?productLineID=100017&amp;cpuCount=1&amp;variantTypeID=2" rel="nofollow">product page</a> for Mercury with one workstation. Do you need to license the fonts for several workstations? Do you require every display and every text cut of the design, in all 4 grades? I'm mystified when people express interest in a typeface and then reject it because of price without investigating all the options. There are very few type families out there with a $1200.00 pricetag. Most typefaces are available in single weights or as basic families with 4 styles.</p>
