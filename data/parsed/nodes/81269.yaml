  html: |-
    <p>Australian Type Foundry [ATF] began in 2001 as a commercial outlet for the fonts of designer <a class="freelinking external" href="http://www.atf.com.au/3/about" rel="nofollow">Wayne Thompson</a>. </p>
    <p>Today, Australian Type Foundry retails almost 100 original typefaces through online outlets around the world, and continues to design and market new type designs. ATF is best known for two sans-serif Opentype families, <a class="freelinking external" href="http://www.atf.com.au/1/retail-typefaces/halvorsen" rel="nofollow">Halvorsen</a> and <a class="freelinking external" href="http://www.atf.com.au/1/retail-typefaces/arumsans" rel="nofollow">ArumSans</a>. ATF also produces custom designs and typeface modifications for a large range of advertising clients. </p>
    <p>ATF has twice entered the New York Type Directors Club Type Design competition, winning neither time.</p>
    <p><a href="http://www.atf.com.au" title="www.atf.com.au">www.atf.com.au</a></p>
