    <p>Hi! I'm in search of the typeface used for signage all over Venezia, as the one showed in the picture. In the last Biennale di Architettura, designer John Morgan used it as inspiration for the biennale posters and branding typeface. It sure is much like Didot, but then is worked as stencil, like Charrette (which is mainly associated with Le Corbusier) and which is heavier and thicker than the one used in Venezia... I've done a basic search and found no information on the matter. Could you please help me out?<br>
    Thank you all!</p>
