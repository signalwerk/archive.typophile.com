      <p>Thanks R for the links to the pdf and Eye Magazine's article on John Morgan's creation of a new version of Venice stencil signage. Very interesting project. And I learned a new word -- Nizioletti. As for the degree to which John Morgan drew on an existing font or fonts it should be possible to decide by reference to:<br><img src="/sites/default/files/old-images/VeniceStencil_4559.jpg"><br>
      Don</p>
