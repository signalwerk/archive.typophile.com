    html: <p>Last year I visited Venice and also noticed the stencil signage (of course). I got the impression that there were several styles of templates that changed over the years. Also I have seen these kind of stencil street name signs i other places in northern Italy, so I think that there are many different styles of this lettering. Chopping up Bodoni-like typefaces for stencil-usage may be typical for northern Italy as from the second half of the 18th century, but the way the idea is executed may vary by signpainter and by stencil-supplier, so I don’t think that there is one style of stencil lettering that is typical to Venice …</p>
