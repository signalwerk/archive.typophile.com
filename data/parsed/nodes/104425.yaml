      <p>Don't know this one and can't find its name. Most probably a bespoke typeface exclusively done for the occasion. Better samples:<br>
      - <a href="http://www.flickr.com/photos/ulri_que/8153613946/">http://www.flickr.com/photos/ulri_que/8153613946/</a><br>
      - <a href="http://librarteria.org/wp-content/uploads/2012/09/biennale.jpg">http://librarteria.org/wp-content/uploads/2012/09/biennale.jpg</a><br>
      - <a href="http://quintoelementovisual.files.wordpress.com/2012/09/agosto-2012-firenze-e-biennale-arch-venezia-163.jpg">http://quintoelementovisual.files.wordpress.com/2012/09/agosto-2012-fire...</a><br>
      If I have to recreate it, I'd probably start with some high-contrasted display/headline such as <a href="http://www.identifont.com/show?8LT" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Big Caslon</a>, <a href="http://www.dardenstudio.com/typefaces/freight_big" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Freight Big</a> or <a href="http://www.typography.com/fonts/chronicle-display/overview" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Chronicle Display</a>.<br>
      Some stencil serifs I like now: <a href="http://commercialtype.com/typefaces/dala_floda/dala_floda" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Dala Floda</a>, <a href="http://www.myfonts.com/fonts/typonine/ty-stencil-pro" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Typonine Stencil</a>, <a href="https://www.playtype.com/font/q-stencil" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Q Stencil</a>, <a href="https://ourtype.com/#/try/pro-fonts/bery-roman" title="Click to visit an external secure URL." class="freelink freelink-external_ssl freelink-external">Bery Roman</a></p>
