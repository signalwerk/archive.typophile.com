      <p>Don't know this one and can't find its name. Most probably a bespoke typeface exclusively done for the occasion. Better samples:<br>
      - <a href="http://www.flickr.com/photos/ulri_que/8153613946/" title="http://www.flickr.com/photos/ulri_que/8153613946/">http://www.flickr.com/photos/ulri_que/8153613946/</a><br>
      - <a href="http://librarteria.org/wp-content/uploads/2012/09/biennale.jpg" title="http://librarteria.org/wp-content/uploads/2012/09/biennale.jpg">http://librarteria.org/wp-content/uploads/2012/09/biennale.jpg</a><br>
      - <a href="http://quintoelementovisual.files.wordpress.com/2012/09/agosto-2012-firenze-e-biennale-arch-venezia-163.jpg" title="http://quintoelementovisual.files.wordpress.com/2012/09/agosto-2012-firenze-e-biennale-arch-venezia-163.jpg">http://quintoelementovisual.files.wordpress.com/2012/09/agosto-2012-fire...</a><br>
      If I have to recreate it, I'd probably start with some high-contrasted display/headline such as <a class="freelinking external" href="http://www.identifont.com/show?8LT" rel="nofollow">Big Caslon</a>, <a class="freelinking external" href="http://www.dardenstudio.com/typefaces/freight_big" rel="nofollow">Freight Big</a> or <a class="freelinking external" href="http://www.typography.com/fonts/chronicle-display/overview" rel="nofollow">Chronicle Display</a>.<br>
      Some stencil serifs I like now: <a class="freelinking external" href="http://commercialtype.com/typefaces/dala_floda/dala_floda" rel="nofollow">Dala Floda</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typonine/ty-stencil-pro" rel="nofollow">Typonine Stencil</a>, <a href="/wiki/https%3A/%252Fwww.playtype.com/font/q-stencil" class="freelinking" rel="nofollow">Q Stencil</a>, <a href="/wiki/https%3A/%252Fourtype.com/%2523/try/pro-fonts/bery-roman" class="freelinking" rel="nofollow">Bery Roman</a></p>
