    html: <p>As you can see in <a href="http://www.labiennale.org/doc_files/exhibition-maps.pdf">this PDF</a>, the Biennale font is called JMSNiziolettiBeta7. JMS stands for <a href="http://www.morganstudio.co.uk/">John Morgan Studio</a>. Nizioletti is the Venetian name of these street signs. You can find some more information about all that <a href="http://www.eyemagazine.com/blog/post/common-ground-a-letter-from-venice">here</a>.</p>
