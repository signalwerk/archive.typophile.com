    <p>Hi, I'm working on a multi-lingual project for the first time and have been asked to find out if there are any standardised web fonts for each of the following languages:</p>
    <p>• Hindi<br>
    • Urdi<br>
    • Arabic<br>
    • Mandarin</p>
    <p>Similar to what we have in fonts such as Verdana, Georgia, and...say it quietly....Arial.</p>
    <p>Really appreciate any help from the members of the board who may have experience in this field of typography. Of course, and insights from speakers of those languages would be deeply appreciated, as well. :)</p>
    <p>Many thanks in advance!</p>
