      <p>Your question assumes a level of sophistication in multi-script type design that remains elusive. People have enough trouble making fonts that are both authentic and harmonious in a script like Armenian; having standard fonts in the Arabic, Hindi and Chinese (not Mandarin) scripts that are truly compatible with even hallmark Latin fonts is still a dream.</p>
      <p>So: just be happy there's anything at all in those scripts available by default.  :-/</p>
      <p>hhp</p>
