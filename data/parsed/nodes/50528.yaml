  html: |-
    <p>Usually I can find an solution to my questions without asking but this one has me stumped. </p>
    <p>I'm modifying an Indesign file that was made in Europe (I'm not sure which country but non English speaking) and my spell check isn't working now. Simple words like file, spell, word aren't coming through as spelled correctly even though I have my dictionary as USA English. </p>
    <p>Any idea what's going on?</p>
