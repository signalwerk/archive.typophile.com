      <p>nice start. the o's look a touch heavier than the n and H. also, why is the right foot of the n rounded, but not the H?</p>
      <p>would help to see more characters. maybe you can add the related characters: mhucebdpq. also shouldn't be too hard to throw in an i or an l. that way we can see how the flavor carries over to the other glyphs. It will be interesting to see how the quirks, as you put it, will carry over to different letters, and how the face ends up working as a whole. One thing I've discovered as a beginning type designer is that subtle elements end up making a big difference. On one letter, the quirk may seem subtle, but when the entire alphabet reflects the quirks, it can be overwhelming.</p>
      <p>look forward to seeing more</p>
      <p>eric</p>
