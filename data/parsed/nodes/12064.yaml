    <p>Well,</p>
    <p>first of all</p>
    <p><a href="http://meiaduzia.com.br/gabriel/type/noho.jpg" title="http://meiaduzia.com.br/gabriel/type/noho.jpg">http://meiaduzia.com.br/gabriel/type/noho.jpg</a></p>
    <p>As you can see I'm trying to go for something with a few "quirks" or strange features so it won't be just another bland sans. The "n" was originally drawn by hand, then after many many months converted to curve and tweaked. As for the rest, it was done directly on-screen in a desperate attempt to try and pass the feel of the n to other letters.</p>
    <p>This is my first-ever, [supposedly] serious attempt at designing type. Serious as in "I'd like to finish it", not serious as in "I'd like to sell it". </p>
    <p>Well, enough rambling. Please, opinions, praise, criticism, anything!</p>
