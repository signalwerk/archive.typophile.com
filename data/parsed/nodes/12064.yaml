      <p>Eric, thank you very much for you input.</p>
      <p><em>also, why is the right foot of the n rounded, but not the H?</em></p>
      <p>I actually haven't tried that, because i always thought that it would make the strong "foundation" of the H seem weak, as if had a bad leg and would fall to the right. As I created the n, I thought that I would have to be very careful on carrying that rounded foot to other characters, or the alphabet could end up *too* unusual. I don't want something that looks too strange for more than a line of text.</p>
      <p>Again, thanks for commenting! I'll post some more characters next week, I think.</p>
