  html: <p>So, I finally upgraded from TypeTool to FontLab. And it has all these handy little indicators that are trying to tell me... something. I've worked out that a red name/code bar in the font window means the name is not standard, and that a little blue square in the upper left corner means a glyph is being used at two codepoints. But I don't know what a little red hyphen underneath means, or why certain glyphs appear navy in the metrics window, or why certain kerning values are red, or why there's a little periwinkle rectangle next to certain characters in the kerning table... And it's really hard to find these things mentioned in the manual. It seems at least half of them must indicate something I need to do something about. Is there a key somewhere?</p>
