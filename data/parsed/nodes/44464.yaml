      <p>@olho: I myself haven’t figured out under what circumstance a hinting symbol is displayed under a glyph in the font window. Sometimes they’re green, sometimes red. They only appear if there are overlapping hints, but I haven’t yet figured out the colours.</p>
      <p>Red H means you have overlapping hints. Green H means you have enabled <em>hint replacement</em> to compensate for the overlapping hints. You don't want to have red H's--they should only be green. You can usually fix it by choosing Tools &gt; Hints &amp; Guides &gt; Autoreplacing, but not always.</p>
      <p>Re-reading the hinting section would also be a good idea. :-)</p>
