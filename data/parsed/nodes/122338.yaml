    html: |-
      <p>Yes, the names in both fonts are identical.</p>
      <p>I'm now trying the Paste Special -command, pasting the outlines, SBs and adv. width. The "map glyphs by name" option is on. This way I lose the kerning pairs, but I guess I could copy the old kerning back into the font. Not sure how reliable this process is though. Hopefully I'm not losing anything else on the way.</p>
