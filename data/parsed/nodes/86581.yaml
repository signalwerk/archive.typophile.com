    <p>I've read so many articles saying only use serif. I've seen articles that say both work. In my publications class there is this huge debate whether we use Serif font or San Serif in body copy... </p>
    <p>Give me all the good reasons why Serif is so much better than san serif when it comes to the body copy of the articles.</p>
    <p>If san serif works please say why. </p>
    <p>Please explain thought. No 1 liners like: <em>"Serif is easier to read."</em> - but why is it easier to read?</p>
    <p>samples:<br>
    Some reasons why san-serif suck:<br>
    I vs l </p>
    <p>Why Serif's suck:<br>
    b vs h</p>
