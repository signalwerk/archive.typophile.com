      <p><em>The bold serif with the sans doesn't seem to work I think because the thins of the bold are thinner than the horizontals of the sans.</em></p>
      <p>Whatever the reason, this is the "normal" kind of bold sans, with a relatively high degree of contrast between the dominant stems and the lesser stems and serifs. </p>
      <p>There are certain kinds of relationships that work between serif subheads and sans body.<br>
      For instance, as your thinking indicates, it is possible to match the secondary stem weight of the serif with the stem weight of the sans—for instance, Bodoni Bold against News Gothic. Another combination is to use a slab serif bold.<br>
      But these are special cases, and the majority of serif faces don't work as bold subheadings with sans body.</p>
      <p><em>…sans for both subtitles and extended running text, which as I noted is relatively unusual, particularly with wider columns.</em></p>
      <p>Not so. That combination, which may be considered modernist, is much used in all kinds of publications. There are many other kinds of running text besides literary and academic books.</p>
