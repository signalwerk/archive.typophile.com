      <p>Readability studies tend to focus on a very small part of the document (if the document is even considered), over a very brief period of time. Really, they are decoding studies.</p>
      <p>But as much as one decodes letters or words, one reads documents.<br>
      And that is why page layout and typography are important elements of readability.</p>
      <p>It's not really surprising that people prefer serifed type for the tombstone layout of books.<br>
      Great blocks of justified sans text lack flavor.<br>
      Consider the potential brutality of modernist architecture; the masters of the genre incorporated a human touch (Corbusier's accomodation of antique chairs) or organic material (Mies' use of marble and wood texture) to offset the austerity.</p>
      <p>And in the more complex editorial layout with many layers of hierarchy, as I noted above, serif is preferred for the main text, and sans for ancillary copy. </p>
      <p>To elaborate on this relationship: it is a principle of design that a large area of lighter tone may be balanced against a smaller area of darker tone. This holds for both traditional symmetrical layouts and modernist asymmetry. Now look at these four ways to combine sans and serif in subheading and body. One of them doesn't look right: the third—serif subhead with sans body. The second, sans subhead with serif body, offers the highest degree of counterpoint.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lorem_4099.png"></div><p></p>
      <p>Put these two effects together, and it becomes clear that in documents which have both a hierarchy of text elements, and pages which are predominantly body text, serif type will be preferred for the body text.</p>
