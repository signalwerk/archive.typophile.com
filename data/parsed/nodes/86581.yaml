      <p>Nick, you are just not acknowledging reality if you don't acknowledge the overwhelming dominance of serifs in print text for extended reading. Just go into any library, or look at any newstand. It's just so overwhelming that it's ridiculous to deny. I didn't even see *any* newspaper font pages on the Newseum site where sans was the predominant text font.  </p>
      <p>The modernist movement did try to use sans much more, and still some people try to look "designer" by doing it. But the reality is that it never caught on, as sans for titles did catch on. That's why to me the "conservatism" argument doesn't work. If it were all conservatism—which I acknowledge is an important factor—then sans for titles would have never been accepted </p>
      <p>As to your argument of sans titles with sans text being dull. Is that even with different weights and sizes? It sure didn't stop modernists from doing exactly that. But it's never caught on in print. </p>
      <p>And meanwhile on the screen sans for extended text are much more common. Wouldn't your aesthetic argument go equally for the screen as not having sans headings and text? Yet they are widely used like this. I think that is evidence for reading comfort being a factor. On screen sans and serifs are more nearly equally bad, whereas in print to me serifs have a clear edge for reading comfort at small size for extended text.</p>
