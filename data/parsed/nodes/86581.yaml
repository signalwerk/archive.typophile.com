      <p>Bill, I gave two page-layout reasons for the predominance of serifed body text.</p>
      <p>The first—that a plain page of sans is rather dull—has nothing to do with ease of decoding, or reading comfort as you term it.<br>
      There is a widespread cultural dislike for artefacts which are plain and bland; people are generally uncomfortable with a simple design if it doesn't have a texture. Why else do we have patterns and decoration?</p>
      <p>As for the second, the "complexity of hierarchy" argument, without statistical comparisons I'm not convinced by your personal experience. I'm sure I could walk into a bookstore and find all kinds of examples to support my theory. In my own experience as a typographer—although not quite as long as your experience as a reader—I can say that I have designed a lot of modernist documents with sans serif throughout, as well as many merely modern documents (see the financial newsletter above) with serif body and sans subheads and sidebars; and by so doing I was following well-worn paths.</p>
      <p>The "reader familiarity" theory is dubious, because it is not readers who determine body types. Readers are at several removes: first typographers have to choose type, then their superiors approve it, then the client. That in itself is a strong argument for tradition, in which, despite "complete reader familiarity with sans faces", serifs got there first, and refuse to give ground.</p>
