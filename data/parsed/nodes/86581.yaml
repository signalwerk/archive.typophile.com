      <p>It depends on the publication and article.<br>
      I would typically use a serif font for the main text and a sans for the sidebar.<br>
      In this mid-1990s example (sorry for the poor quality) Perpetua and Gill Sans.<br>
      It would be strange to imagine it the other way around.<br>
      But of course, in a more modernist (single face) layout one could use two weights of the same sans for main body and sidebar—but that wouldn't be such a nice or easy play of counterpoint for such a complex editorial hierarchy. Here I was able to use the same spec for subheadings in both main and sidebar, without it becoming same-y and not adequately differentiating the hierarchy. Had I use Perpetua Bold for the main subheadings, harmony would have been lacking. Counterpoint and harmony—musical terms, but very relevant to design.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/MGS_6679.jpg"></div><p></p>
