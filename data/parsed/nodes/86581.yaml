      <p>The jury has never returned an absolute verdict.  People have sometimes chosen a verdict that fits their own way of thinking or even suits their personal interpretation of research data.  True, there may, in the future, be a more definitive set of studies that can be more usable in making the decision, but so far, I have yet to see "the light".</p>
      <p>Your real question should be a bit more specific to the audience, purpose, and message of the text you want to set.  Clearly, as you can see from the responses you have gotten, there is a difference of opinion on the subject.  That leads me to believe there is also a difference of solution to the problem depending upon the specific situation.</p>
      <p>Serifs don't suck;</p>
      <p>Sans serifs don't suck;</p>
      <p>Badly used instances of either or both can suck.</p>
