      <p><em>This is not an issue of science vs humanities./em&gt;</em></p>
      <p>Perhaps not science in general, but a certain kind of behavioral lab testing, which represents the limited scope of reading science. Ergonomic lab tests cannot explain cultural phenomena. If that were the case, people wouldn't be walking around in high-heel shoes.</p>
      <p><em>The issue is what's true. </em></p>
      <p>You think that the predominance of serifs for body text (if that happens to be the case) could be explained by the fact that serifs might beat sans in a lab test.</p>
      <p>Even if that turns out to be true, it's no proof because, as I have demonstrated, there are cultural explanations.</p>
      <p>How do we weigh one against the other?</p>
      <p><em> I just don't think there's any contest on the prevalence of serifs.</em></p>
      <p>I don't disagree, and I have given cultural—i.e. historical, socio-economic, and aesthetic (predisposition to greater play of harmony and counterpoint in page layouts)—reasons as to why this may be, reasons which IMHO far outweigh the "ease of decoding" theory.</p>
      <p>However, I do disagree with your contention of tremendous domination. It seems to me that the presence of serif or sans in body text is determined by genre, and a significant number of genres employ sans body text.</p>
      <p>For instance, I recently designed a custom typeface for a branding agency, for their client, a bank.<br>
      It's a sans serif (to replace the present sans serif), in the four main styles, and will be used for all customer communications.<br>
      The driving concern in this rebranding was corporate identity, of course.<br>
      The main concern in its typography was not readability, but how the type represented the brand, which was most apparent in display settings. A sans with single-storey "a" was requested. It was understood that the same type would work well right down the hierarchy, to body text and footnotes. A two-storey "a" will be available in a stylistic set, for better text legibility.<br>
      This is my experience of how typography happens in practice, which is at odds with your observations and theories.</p>
