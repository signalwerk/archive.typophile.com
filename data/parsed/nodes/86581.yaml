      <p>Yes, we are cultural creatures. But our physiology also has a lot to do with how we see, and how we read. </p>
      <p>The only way to resolve this question would be by testing and it is testable, to this extent: we can have the same layouts and parameters (x height, weight) and the same layout, and see how much of a difference serifs make. If they do make a difference, I think that would be a strong argument. </p>
      <p>My point is that culture changes, and has changed over past hundred years, when sans have been vigorously pushed by designers for print text. But with uncommon exceptions, they haven't been adopted in print, but have been on screen. That to me argues for a cause that transcends culture, namely human physiology. </p>
      <p>Your "culture" argument also doesn't explain the screen/print divide, so to me it's particularly wanting there. </p>
      <p>Yes, culture is a huge influence, but don't the limits of human physiology influence culture?</p>
