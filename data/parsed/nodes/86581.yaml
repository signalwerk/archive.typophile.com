      <p>This is not an issue of science vs humanities. That seems to be a big issue in your head, but it's not in mine. The issue is what's true. You can do both an analysis of statistics of media, and tests on reading fatigue. It's not one or the other. </p>
      <p>On the issue of statistics, I just don't think there's any contest on the prevalence of serifs. You have to distinguish between display, captions, and also things like tables, the phone book, etc., on one hand, and, on the other hand, where extended reading of continuous text is of primary importance. Where extended reading is the main thing, serifs just dominate tremendously.</p>
