      <p>Nick, I am here following Matthew Luckiesh's concept of readability, which is well defined and which I talked about at TypeCon last summer and here in another thread. Fatigue shows up and is measurable by increase in blink rate, when other factors are held constant. </p>
      <p>The point is, Luckiesh got significant differences varying typefaces, with other layout factors being similar. He didn't look at sans, as these weren't used for text at that time in the US (1938-39). I'm hoping that repetition of his experiments will validate his work, and can be taken further to shed light on several questions about sans. </p>
      <p>Layout factors are important, but my argument is that the decisive thing here is an inherent problem with sans, or at least sans at small sizes for extended text in print. I'm guessing they they create a greater burden of fatigue.</p>
