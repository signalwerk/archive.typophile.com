      <p>Bill, I know where you're coming from.</p>
      <p>And I'm coming from a different place.</p>
      <p>Speaking as a typographer and art director, I'm inclined to lay out a page with a certain preference for main body text not primarily because I want to lessen the reader's fatigue, but because I want to organize all the text into a functional hierarchy (by means of typographic harmony and counterpoint), and create an engaging document. As I have argued above, making the main body serifed facilitates this.</p>
      <p>In comparison, I believe that the putative greater ease for the reader in decoding serifed text at the level of letter and word plays a very small role in the present preponderance of serifed body text in print publications.</p>
      <p>We are cultural creatures who rarely take the straightest line between a and b.</p>
