      <p>&gt;is much used in all kinds of publications. There are many other kinds of running text besides literary and academic books.</p>
      <p>Both of your statements are true, but they don't conflict with the reality that extended print text is overwhelmingly in serif faces. And your reasoning doesn't explain that. </p>
      <p>For example, just randomly clicking on ten newspaper first pages at the Newseum site, both in the US and Mexico, main body text in all of them is in serifs. I happen have from the public library at the moment five popular non-fiction books—not academic or literary—and all have body text in serif faces. </p>
      <p>In fact, sans for main text is unusual, particularly in books. But even in newspapers and magazines, it is usually used for side bars or secondary, usually brief stories.  My experience in as a reader for 60 years is that over 90% of extended text in print is serif, including today. </p>
      <p>Your reply doesn't doesn't answer the question: Why is there an overwhelming preference for serifs for extended text in print, in spite of complete reader familiarity with sans faces? My answer is that there's an edge in reading comfort of serifs at text sizes. Do you have another explanation?</p>
