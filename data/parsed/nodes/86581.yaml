      <p>The answer to 'serif' vs. 'sans' is all about the context. </p>
      <p> - what is the type being displayed on?<br>
       - what size?<br>
       - how much text?<br>
       - what kind of text?<br>
       - how's the leading/line length?<br>
       - color?<br>
       - where is it being read?<br>
       - who's reading it?<br>
       - what is the subject matter?<br>
       - what is the aesthetic objective?</p>
