      <p>There are no definitive tests as of yet to decide this question. However, I think there are good reasons to think that serifs are more readable for extended text, at small (text) sizes. </p>
      <p>Some reasons:</p>
      <p>1. Tests have shown that the extremes of the letters are more crucial in detecting them, and the serif faces are more differentiated. </p>
      <p>2. Generally speaking, there is an agreement that sans of similar weight need more leading to be read comfortably. This seems to indicate that the serifs help the eye in identifying and holding to the line, and moving from line to line. </p>
      <p>3. But the most compelling argument to me is that by now people are very familiar with sans letters being used in text. Yet for material that calls for extended reading, the preference of publishers and it seems readers remains overwhelmingly for serifs. </p>
      <p>Because of the great familiarity with sans, and the fact that extended text is occasionally set in sans, I don't think that the preference for serifs can be put down to conservatism alone. There has been a push for increasing use of sans faces for nearly a hundred years, and they have been generally accepted for other uses, but not for extended text. To me that says there are advantages to serifs for reading comfort. </p>
      <p>Interestingly, this seems to be not so clear a preference when it comes to the screen. With the difficulties of low resolution, it seems that serifs are less of an advantage at small sizes, or no advantage.</p>
