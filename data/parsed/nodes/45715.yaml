    <p></p><div class="imageWrap"><img src="http://typophile.com/files/illinois_5415.gif"></div><p></p>
    <p>Most sans serif typefaces have an uppercase I that is just a vertical bar. Most (all?) serif typefaces have horizontal bars/serifs on the top and bottom of the uppercase I. </p>
    <p>Is there a term for the seemingly rarer case when a sans serif typeface has an uppercase I WITH bars such as in this example?</p>
