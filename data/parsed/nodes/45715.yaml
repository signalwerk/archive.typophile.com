      <p>So, to be clear, I think what we're looking for is a word for "a serif that is thought of as a normal feature of a character even in an otherwise sans-serif context."</p>
      <p>I suggest something like <em>obserif</em>, short for <em>obdurate serif</em> (or <em>obstinate,</em> or even <em>obligatory</em>).</p>
