    user_path: null
    date_raw: 25 May 2008 — 9:17pm
    date: 2008-05-25T21:17:00
    votes: null
    html: <p>I don't think there is a term specifically for this, and perhaps there should be. Many all-caps comic fonts have both kinds, so that the serifed I can be used for the personal pronoun "I" while the plain I is used in other words; I believe Charles Schulz was the first to adhere to this practice consistently in his hand lettering.</p>
