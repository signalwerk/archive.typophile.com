    <p>Hi all</p>
    <p>I was briefly acquainted with Gerald Giampa I believe in 1969 / 1970<br>
    in Lynn Valley in Vancouver, B.C. </p>
    <p>I was reviewing some past reminiscences and wanted to briefly touch<br>
    base with him.  I hear that he is in Scandinavia now ? !</p>
    <p>Could someone contact him who knows his e-mail address and see<br>
    whether he is available for a short dialogue.</p>
    <p>Thanks<br>
    Richard Bidwell</p>
