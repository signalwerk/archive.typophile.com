    <p>Hi Typophiles, this is my first attempt at a serif font and my first attempt to Opentype code, which seems to have been a success…so far.</p>
    <p>I would love to hear your opinions, and have some feedback and to know if it has any value at all. </p>
    <p>Thanks for taking the time to look.</p>
    <p>Andy</p>
