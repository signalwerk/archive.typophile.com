      <p>You should post a pdf for better judgment. </p>
      <p>First thing I would change is "space". It's too wide as are "t" and "r". Lc "o" and Uc "O" are too oval for my taste. Some caps (like "O", "Q", "S", "T", "L" and then some) look too light. Maybe "S" and "s" should have similar shapes.</p>
      <p>Ligatures *are* fun, but target your energy at getting the base OK right now.</p>
