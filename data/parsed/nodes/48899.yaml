    html: |-
      <p>This reminds me a bit of my old Rutager face, though yours is superior to that in every way.</p>
      <p>If I were to pick a flaw, it's that there is a bit too much vertical symmetry, leading B, S, and to a lesser extent D and N, to look topheavy. Your regular ampersand is a bit light on the bottom too, but your alts are lovely, if somewhat large for anything but display use. </p>
      <p>You have a serpentine question mark that actually works!<br>
      That's a fine bunch of ligatures you have there too. This is sure to be a hit amongst fans of things like that.</p>
