  html: |-
    <p>TIPO is proud to announce the the arrival of Palestina, the latest font created by Rubén Fontana.</p>
    <p>Palestina is a sans serif font designed for reading texts and inspired in the condensed Trade Gothic font, which features a strong influence from the time of metal foundry -based typography. The characteristic of its design allows to offer easily recognizable and very stable words and it has been conceived to be used in titles and newspaper and magazine headlines. It is available in five colors: Light, regular, Bold, Black and Ultra.</p>
    <p><a href="http://new.myfonts.com/fonts/tipo/palestina/" title="http://new.myfonts.com/fonts/tipo/palestina/">http://new.myfonts.com/fonts/tipo/palestina/</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/palestina_typophile_5476.png"></div><p></p>
