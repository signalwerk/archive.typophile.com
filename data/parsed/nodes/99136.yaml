    html: |-
      <p>In the second word, you have a kashida (elongation) in an invalid position according to traditional script grammar. You can't insert a kashida before a final jim. The only legitimate place in that word for a kashida is between the medial khah and lam:  الخـــليج</p>
      <p>Personally, I would avoid kashidas altogether in this word mark: they're unnecessary and make the Arabic less harmonious with the Latin. If I were to use one at all, it would be only in the first word, as you have it, after the initial mim.</p>
    html_clean: |-
