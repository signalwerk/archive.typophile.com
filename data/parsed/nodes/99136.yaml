      <p>This isn't something that the designer should decide; your client or their lawyer should tell you which mark(s) to use. </p>
      <p>I'm not a lawyer but my guess is that you can't use the registration mark on the new version because it can only be used after the government registers a mark, not while the application is pending. You'd probably have to use TM or SM instead. (I'm assuming that the new version will require going through the registration process again.)</p>
      <p>The government FAQ page below might be helpful:<br>
      <a href="http://www.uspto.gov/faq/trademarks.jsp#_Toc275426682" title="http://www.uspto.gov/faq/trademarks.jsp#_Toc275426682">http://www.uspto.gov/faq/trademarks.jsp#_Toc275426682</a></p>
