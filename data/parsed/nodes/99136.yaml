    html: |-
      <p>I'm not as knowledgeable as John concerning the traditional rules of kasheeda placement, but even if I were I might actually shoot for -what must be- a superset of those rules: if it looks good, it is good. However, in this case at least it doesn't. :-/  You could make the kasheeda in the first word longer to end up with a nice symmetry, but I would actually agree with John that -at least in this case- no kasheedas at all might be best, especially considering the Latin is so dense.</p>
      <p>Speaking of the Latin, there's something funny about it - it's like a distorted Futura. It's pudgy, and the spacing is very uneven. Also, the Latin is rather conventional while the Arabic is somewhat progressive (especially that 'ayn).</p>
      <p>Then there's the problem of apparent size/importance (marginally related to kasheeda inclusions). By being both smaller and lighter the Arabic seems far less important. On the other hand this logo might need that feature - it's hard to know from the outside.</p>
      <p>Concerning your original question, I'd suggest trying something that many designers would consider gimmicky: try making the dot of the jeem coincide with the dot of the "i", and make that the (R) sign! You might have to make the Arabic longer/bigger, but for one thing that would address the apparent importance issue above.</p>
      <p>Lastly, the dots of the yaa' aren't sitting happy in relation to the "el".</p>
      <p>hhp</p>
