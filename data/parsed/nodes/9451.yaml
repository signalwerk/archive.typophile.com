    html: <p>Yeah, there's a lot of stuff like that around in the case of digital versions of old fonts. The funny thing is FontHaus (a.k.a. DsgnHaus) does not appear to carry the font anymore. I believe it was digitized in the early nineties by a now-defunct foundry and was only distributed by FontHaus. <br> <br>There was also a Linotype (metal) version of this called Vulcan. That may be the version with the lighter weight that I've seen.</p>
