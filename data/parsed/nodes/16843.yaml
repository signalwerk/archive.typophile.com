    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Typeface</strong></p>
    <p>Typeface is a collection of all typographic characters that share the same design characteristics such as weight, width, inclination, optical size, stroke modulation or treatment of serifs. Helvetica Bold is one typeface, Times Roman is another typeface, Times Bold is yet another typeface.</p>
