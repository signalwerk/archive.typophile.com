    html: |-
      <p>The height of "x" to "l" is also at the high end for Lyon and Elena, but apparantly it is for Plantin as well. A rough order based on x/l height:<br>
      Bembo book: 54%<br>
      Sina Nova: 58%<br>
      Garamond PP: 60%<br>
      Mercury: 60%<br>
      Baskerville 10: 61%<br>
      Lyon: 63%<br>
      Elena: 63%<br>
      Plantin: 64%</p>
      <p>However, Plantin looks smaller and is harder to read due to its overall character widths. (which TNR reduced substantially). I think some reduction in character width, so long as it is not too severe, helps with online reading. Newspaper type fonts are reasonably good for online viewing. Since the original poster was not planning to print the newsletter, a larger x height might be good.</p>
