    <p>Hi guys,<br>
    I am design a newsletter. The final outcome is a PDF that people will download and read online, no printing involved here. I am having some second thoughts on deciding between Lyon Text and Plantin. Both are quite beautiful fonts. Which do you think is better for reading on an online PDF?</p>
    <p>Any ideas?</p>
    <p>Best,<br>
    S</p>
