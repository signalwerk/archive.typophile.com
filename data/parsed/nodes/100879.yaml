      <p>Regarding some of your choices: there is  a major difference in x-height between them. Personally, I think a bit bigger x-height works best for on line viewing but is less elegant for printed output. Leaving out descenders and just comparing the height of "x" to "H" as measured in Illustrator, here are some ratios:<br>
      Bembo Book: 64%<br>
      Sabon: 64%<br>
      Storm Baskerville 10: 65%<br>
      Sina Nova: 65%<br>
      Plantin: 66%<br>
      Whitman: 66%<br>
      Adobe Garamond PP: 67%<br>
      Trinite No2: 67%<br>
      Calisto 67%<br>
      Dante: 68%<br>
      Adobe Minion Pro: 68%<br>
      Miller: 68%<br>
      Documenta 69%<br>
      Iowan OS 69%<br>
      Scala: 69%<br>
      Albertina: 69%<br>
      Elena: 70%<br>
      Mercury: 71%<br>
      Lyon: 71%</p>
      <p>It is just one factor to consider, but you can see that Plantin has a lot smaller x-height than the others you've mentioned.</p>
    html_clean: |-
