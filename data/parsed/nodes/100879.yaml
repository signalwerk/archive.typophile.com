    html: |-
      <p>I’m working with Lyon in a biggish project right now (print and web, text and display, various media etc), and it’s been fabulous to work with. I don’t know if this is relevant for your case, but one big asset of Lyon is that it has both a Text and a Display variant – the latter looks great in headlines (especially in the Italics with activated swashes); I’d say while Plantin is a very good design too, Lyon arguably has a greater range. Good range of weights too. I love Plantin, but Lyon is fresher. (And really, it isn’t all that expensive.)</p>
      <p>It’s hard to say more without knowing more about your content and context. Check that both typefaces have all the characters you need, and yes, like Hrant says, check the EULAs.</p>
