    html: <p>The designs of the characters themselves, and the OT/AAT intelligence built into the font to more effectively use those characters and their variants, are two different things. The addition of OT tables fixes the one main issue I have with a design like Zapfino, so I applaud Linotype for their continued pursuit of this project. Perhaps when the correct tools are available, the next Zapfino will include both OT and AAT tables. And who knows, maybe even <a href="http://graphite.sil.org">Graphite</a>.</p>
