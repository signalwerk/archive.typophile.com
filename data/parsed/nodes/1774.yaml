    html: "<p>Kyle, you can convert fonts to outlines in InDesign and  copy those and paste them into Illustrator. <br> <br>You can make a text box and select the box and go cmd+shift+O (Mac) ctrl+shift O (o not zero) and get the type as outlines. You can select the text within a box and do the same command and get the text as outlines with the bounding box intact. <br> <br>You can do some manipulation in InDesign. If you convert the text to outlines then you can use the pen tool and the tools under it just like in Illustrator. <br> <br>I can't think of another way to get the letter into Illustrator.  <br> <br>If you're on Mac OS X: <br>You can try doing a copy or drag and drop from the Mac OS X character palette (not the Key Caps application). Open System Preferences &gt; International &gt; Input Methods Tab &gt; Check Character Palette. Icon will appear in menu bar. <br> <br>Extended character support is supposed to get better with Illustrator CS and its new Unicode text engine. See Thomas Phinney's comments in <a href=\"http://www.typophile.com/forums/messages/30/18164.html?1066333334\" target=\"_blank\">http://www.typophile.com/forums/messages/30/18164.html?1066333334</a> about half way down the page. <br> <br>Hope I haven't misunderstood and I hope this helps. <br> <br>Jon</p>"
