  html: <p>Ok, so this may be a dumb question, but alas, here goes. <br> <br>I designing a logo type, it utilizes extended characters (ones I am accessing through the glyph pallette in Indesign), I want to tweak and customize the logotype vectors (through the use of Illustrator), but when trying to paste these character in Illustrator (version 10) I get the all to lovely "box". It won't let me paste these characters. How do I get around this? (hopefully this is fixed in the new CS version, but I'm not counting on anything.) <br> <br>I do have access to Freehand, will I experience this here as well? <br> <br>How do I work around this? Help! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> <br>hildebrant.</p>
  html_clean: <p>Ok, so this may be a dumb question, but alas, here goes. <br> <br>I designing a logo type, it utilizes extended characters (ones I am accessing through the glyph pallette in Indesign), I want to tweak and customize the logotype vectors (through the use of Illustrator), but when trying to paste these character in Illustrator (version 10) I get the all to lovely "box". It won't let me paste these characters. How do I get around this? (hopefully this is fixed in the new CS version, but I'm not counting on anything.) <br> <br>I do have access to Freehand, will I experience this here as well? <br> <br>How do I work around this? Help! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br> <br>hildebrant.</p>
