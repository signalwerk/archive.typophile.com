    <p>"So perfect. Design et Typo recently posted about the variety and personalities of <a href="http://paris.blog.lemonde.fr/2006/09/21/2006_09_garamond_vs_gar/" rel="nofollow">various versions of the typeface Garamond</a>. [<a href="http://www.google.com/translate?u=http%3A%2F%2Fparis.blog.lemonde.fr%2F2006%2F09%2F21%2F2006_09_garamond_vs_gar%2F&amp;langpair=fr%7Cen&amp;hl=en&amp;ie=UTF8" rel="nofollow">translate</a>] Today, with a lovely metaphor and a sublime demonstration, Peter enhances the point using the cello, <a href="http://paris.blog.lemonde.fr/2007/02/23/viloloncelle-vs-violoncelle-autant-de-differences-quentre-deux-dessins-du-garamond/" rel="nofollow">As Many Differences as Between Two Drawings of Garamond</a>. Me? #2, Yo-Yo Ma."</p>
