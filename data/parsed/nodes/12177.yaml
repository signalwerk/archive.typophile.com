      <p>The Russian sample you are showing at <a href="http://www.totalkrieg.com.br/sample.jpg" title="http://www.totalkrieg.com.br/sample.jpg">http://www.totalkrieg.com.br/sample.jpg</a> is <strong>lettering</strong>, not typography. The typefaces used in Soviet Union during WWII were, almost without exception, old Russian or German makes, developed before 1917 (for manual composition), or the imported (American and English) matrices for Linotype and Monotype machines, designed in early 20th century. National newspapers printed in Moscow and Leningrad (Pravda, Izvestia and others) used A-P-L headline slugcasters manufactured by Mergenthaler Linotype, with matrices that came with those machines from the US (in early and mid- 1930s).</p>
      <p>The very first Soviet type designs were developed—primarily for the domestic linecasters—only after 1936. They were <strong>Excelsior</strong> (a knock-off of one of the Linotype ‘Legibility Group’ typefaces, by Mikhail Shchelkunov and Nikolay Kudryashov, 1936), <strong>Obyknovennaya Novaya</strong> (a version of Bodoni, by Nikolay Kudryashov, Galina Bannikova and Anatoly Shchukin, 1938–41), <strong>Literaturnaya</strong> (a version of Romana, by Anatoly Shchukin, 1939), <strong>Akademicheskaya</strong> (a version of Cheltenham, by Anatoly Shchukin, 1941). However, their use before and during WWII was very, very limited, and they are difficult to spot in Soviet wartime print.</p>
    html_clean: |-
