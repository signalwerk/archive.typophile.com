    html: <p>Gustavo, “Obyknovennaya Novaya [Garnitura]” stands for “New Regular [Type Family]”. As to the list of Cyrillic types that were used in the Soviet print during WWII, it could include those designs that are shown in the prewar specimens of Monotype Corporation and Mergenthaler Linotype, and in the catalogues of the Russian and German foundries of early 20th century (the most prominent ones operating in Russia were Josef Lehmann’s, Hermann Berthold’s, Benjamin Krebs’s and Ferdinand Flinsch’s; some fonts were imported from Germany). I am sorry I cannot offer you a consolidated list of those fonts. If you are interested, you should do such research yourself.</p>
