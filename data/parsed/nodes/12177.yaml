      <p>One addition to the pre-WWII Soviet typeface list. The first version of <strong>Shkolnaya</strong> (a Soviet version of the ATF/Linotype Century Schoolbook) was developed in 1939 by a group of designers directed by Evgeny Chernevsky. However, the design was completed only in 1949–61, by a design group headed by Elena Tsaregorodsteva, the leading member of the 1939 Chernevsky team. There were several other type designs whose development was interrupted by, or suspended during, the war.</p>
      <p>I waguely remember that <strong>Obyknovennaya Novaya</strong>, mentioned above, was developed for the new edition of the collected works of Lenin.</p>
