    <p>Greetings, </p>
    <p>At the moment I’m preparing my master's degree’s thesis in which I’ll try to join my passion about WWII history with my work. </p>
    <p>It’s a research about typography used in publications through all countries during WWII. </p>
    <p>Since it’s quite hard to find out any info in this aspect I would love any help you can provide me. </p>
    <p>I have some newspapers, magazines and posters scans, if someone thinks it would be not much boring I could post then in the Type ID board.</p>
    <p>Anyway, ANY info on this subject would help me a lot.</p>
