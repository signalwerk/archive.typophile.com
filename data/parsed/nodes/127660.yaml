      <p>Hi K. C.</p>
      <p>Thanks for getting back. I no longer work there, so I'm afraid I have no way of finding out who the previous user of the laptop might have been.<br>
      It was an advertising agency, so it could very well be a personal project by some agency designer. It reminds me a bit of the Chanel logo (although the C is not quite the same), so maybe it was an attempt to develop a typeface inspired by it.</p>
      <p>Thanks again for your help.</p>
