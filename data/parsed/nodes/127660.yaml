  html: |-
    <p>This font was installed on my company laptop (which was previously used by someone else). The file is named "agnes.otf", but I haven't been able to find it under that name anywhere, or find out who designed it. It only has uppercase glyphs, and no numerals or special characters.</p>
    <p>I was wondering if "Agnes" is its real name, who might have designed it, and whether there is a more complete character set to be purchased somewhere.</p>
    <p>Thanks a lot in advance.</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/font-id/Captura%20de%20pantalla%202018-05-11%20a%20las%2017.21.16.png" width="1990" height="472" alt="Font labeled &amp;quot;Agnes&amp;quot;, but not quite sure that&amp;#039;s the real name." title="Agnes?">
