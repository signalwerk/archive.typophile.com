    <p>John A. Lane<br>
    Printing Types in the Dutch Golden Age:<br>
    Nicolaes Briot, Christoffel van Dijck &amp; Nicolaus Kis<br>
    ====================================================</p>
    <p>The sixth annual Justin Howes memorial lecture<br>
    ----------------------------------------------</p>
    <p>* Tuesday 22 February 2011 at 7pm<br>
    * In the Bridewell Hall, St Bride Foundation<br>
    * Admission is free but by pre-booked ticket only</p>
    <p>Tickets: <a href="http://printing-types-in-the-dutch-golden-age.eventbrite.com/" title="http://printing-types-in-the-dutch-golden-age.eventbrite.com/">http://printing-types-in-the-dutch-golden-age.eventbrite.com/</a></p>
    <p>Full details: <a href="http://stbride.org/events" title="http://stbride.org/events">http://stbride.org/events</a></p>
    <p>The mainstream in the evolution of printing types, like many cultural developments, shifted from France to the southern Low Countries in the second half of the sixteenth century, Holland in the seventeenth and England &amp; Scotland in the eighteenth. Types from sixteenth-century France and the Low Countries and from most of the eighteenth-century British foundries have been well catalogued, including the work of great punchcutters like Garamont, Granjon, Van den Keere and Caslon. But Nicolaes Briot – possibly the most important figure in the Dutch ‘golden age’ – remains almost unknown, the types of the more famous Christoffel van Dijck are best known from specimens issued by his successors, and those of Nicolaus Kis from recuttings made in the 1920s from a few surviving sets of matrices (issued under the name Janson). Recently discovered specimens issued by seventeenth-century Dutch typefounders help paint a better picture of the seminal work of these and other masters, and research in archives and libraries fills many of the remaining gaps. In an illustrated lecture, John Lane shows types by these Dutch masters and suggests that Briot’s roman types served as the principal models for Van Dijck, Kis and Caslon.</p>
    <p>John A. Lane is a freelance historian of printing types, typefounding and type specimens, also specializing in analytical bibliography, paper &amp; watermarks and archival research. He teaches at Amsterdam University’s summer school and the Plantin Genootschap in Antwerp, has worked for antiquarian book dealers and taught typography at the University of Reading. He received a 2006 Guggenheim Fellowship and awards from the Printing Historical Society, Bibliographical Society of America and American Printing History Association. His many books and articles discuss the history of printing types from the fifteenth to the twenty-first century.</p>
