    <p>Here are the beginnings of a type study I did a few years back. I finally dug it out of the myriad files and folders on my desktop and decided to put it up on here for critique.</p>
    <p>Some notes as I'm looking at this with a fresh (and more learned) perspective:<br>
    1. I'd like to go through and redo some of the weights of certain strokes (the hairline stroke atop the 'a', the bowls on 'a' and 'd')<br>
    2. I think the character widths need some refining.<br>
    3. I'd like to put different tails on the 'a' and 'd' that more closely resemble the serifs on the 'd' and 'l' ascenders.<br>
    4. The serifs to the left of the 'i' and 'l' are indeed longer than those on the right (to mirror the serifs at the top of the ascenders)<br>
    5. I'd like the dot atop the 'i' to be heavier.<br>
    6. I'm pretty fond of the 'm,' though I think it is a bit wide compared to the rest of the characters.</p>
    <p>At any rate, critique away!</p>
