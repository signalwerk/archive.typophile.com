    <p>Please suggest a sans serif typeface family that will work with Platelet as the display text. Your input will be appreciated. </p>
    <p>I have been looking for a situation where I could use Platelet for years! And have finally found it. But I need a good family to use with it for body copy, etc. </p>
    <p>I could use your opinions on this... it should be a sans serif.</p>
