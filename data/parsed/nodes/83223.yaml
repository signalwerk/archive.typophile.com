  html: |-
    <p>Our two new ‘Masthead’  typefaces-especially designed to simplify the production of logos, mastheads and signage with character-have now released on Myfonts.com.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/bettendorff/ " rel="nofollow"> Bettendorff</a> is one of two new ‘Masthead’ typefaces from Greater Albion.  This 1900′s inspired face makes the construction of ribbon or cartouche banners and mastheads the simple work of a few moments.  Bettendorff is also particularly designed to compliment our Spargo and Mexborough families.</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/wolvercote/ " rel="nofollow"> Wolvercote</a> is one of two new ‘Masthead’ typefaces from Greater Albion.  This Victorian inspired face makes the construction of ribbon or cartouche banners and mastheads the simple work of a few moments.  Wolvercote is also particularly designed to compliment our Wolverhampton and Mexborough families.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/two_6151.png"></div><p></p>
