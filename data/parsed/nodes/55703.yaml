    html: |-
      <p><cite>…many folks would agree these two faces are the most difficult to work with…</cite></p>
      <p>Anyone who considers TNR or Arial difficult to work with isn’t worth listening to. TNR is a dead-simple text face, there is no reason it should be any harder to use than Adobe Caslon. Which is probably why it’s still incredibly popular for paperback books. As for Arial, once one gets past the really deformed characters, Arial is a very usable sans available in five weights, three widths, with monospaced and rounded versions. If you have trouble using that one it’s time to head back to Typography 101 and do the damned homework this time around.</p>
      <p>Enough with the Arial/Time bashing. You’re a student, not a bitter old designer; you should be focusing on the better options! Your work will be more interesting and useful to others if you work with the Cleartype fonts that ship with Vista and MS Office (and can be obtained for other Windows for free by installing the latest Powerpoint viewer). Or you could cover good low-cost fonts, such as Museo and Museo Sans, or the $9 versions of Nick Shinn’s paradigm family. Try being creative instead of just digging up the old Times/Arial dirt that everyone has already seen and heard a million times.</p>
