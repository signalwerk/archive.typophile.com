  html: |-
    <p>Hello everyone here on Typophile: I am working on this design assignment that has a strong social-political statement dealing with our difficult economic situation as designers. It's in a time like this, being resourceful and recycling resources is a common trend for designers. I am thinking going "all the way" with this political statement by typesetting this project in default system faces with Times New Roman and Arial. Knowing that this would be a huge challenge, since many folks would agree these two faces are the most difficult to work with (right up there with Comic Sans and Hobo...) </p>
    <p>Can somebody suggest what they think about this? Since the audience for this piece will be for the design industry. Also anybody tried to work with these two faces and come up with very good result? Tips on how to work around their physical limitations will be be also appreciated!</p>
    <p>I am thinking going a bit of an experimental route now... Thanks</p>
