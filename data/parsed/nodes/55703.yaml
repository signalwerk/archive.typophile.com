      <p>Why not show some solidarity with your brother and sister (type) designers, and use new fonts from independent foundries, not ones designed many years ago and owned by corporations (Monotype and Microsoft). </p>
      <p>If you take the idea of re-use to its logical conclusion, you will end up with default system design that puts yourself out of work, as clients will be quite happy to re-use old layouts and concepts, for instance templates that came bundled with their software, set in, uh, Arial and Times....</p>
