    html: <p>Similar to <a href="http://www.lineto.com/" rel="nofollow">Courier Sans</a> by Lineto. In general these über-hip (rounded) mono-ish designes are typical of Lineto and <a href="http://www.gestalten.com/fonts/" rel="nofollow">DGV</a>. <a href="http://www.a2swhk.co.uk/" rel="nofollow">A2SWHK</a> also do a lot of custom stuff that is somewhat in the same genre.</p>
