    html: |-
      <p>Can't find a match. Could a be a custom job. Closest I found is <a class="freelinking external" href="http://www.myfonts.com/fonts/fewell/exhaust" rel="nofollow">Exhaust</a>. Try also having a look to these 2 Sci-fi/tech sections at DaFont, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=303" rel="nofollow">Techno &gt; Sci-fi</a> and <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=304" rel="nofollow">Techno &gt; Various</a> (<a class="freelinking external" href="http://www.dafont.com/boom-box.font" rel="nofollow">Boom Box</a>...).<br>
      To get a ready-to-use /N (diagonal meeting right-hand vertical above foot), I'd probably start with either <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-qtype" rel="nofollow">QType FF</a> or <a class="freelinking external" href="http://www.myfonts.com/fonts/virusfonts/bourgeois" rel="nofollow">Bourgeois VF</a>. <a class="freelinking external" href="http://www.myfonts.com/fonts/4thfebruary/bladi-one-4f" rel="nofollow">Bladi One 4F</a> would work pretty fine as well.</p>
