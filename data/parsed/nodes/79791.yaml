    html: <p>Unless I'm mistaken, the word on the street is that H&amp;FJ are going to be releasing Ideal Sans this week. It's a humanist sans, but it may work very well with what you're building. To get a feel for the flavor, see their <a href="http://www.typography.com/fonts/font_styles.php?productLineID=100025" rel="nofollow">Topaz</a> (the 'background' and 'inline' variations, not the default built-in inline version). Ideal Sans is built from the outlines of Topaz (or maybe it was the other way around, considering Ideal was originally designed some 20+ years ago). Good luck!</p>
