    html: <p>I agree on Avenir and Brandon Grotesque, and would also like to add <a class="freelinking external" href="http://new.myfonts.com/fonts/adobe/neuzeits/" rel="nofollow">Neuzeit S</a> and its progenitor, Christian Schwarz's <a class="freelinking external" href="http://commercialtype.com/typefaces/graphik" rel="nofollow">Graphik</a> — another wonderful option for a versatile, geometric sans.</p>
