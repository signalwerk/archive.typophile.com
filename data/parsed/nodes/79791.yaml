    <p>Hello,</p>
    <p>I'm currently designing a logo/brand identity for a friend's photography business. His business is called Knox Photography. Right now I've decided to use Baskerville as the main font, but am trying to find a good font pair to use with it. I really like Gotham, but am not sure if it's completely appropriate? I'm looking leaning more towards a geometrical sans serif font.</p>
    <p>I've attached an image of a quick throw together of what I'm thinking of. Right now I'm purely focusing more on finding the right fonts than on the logos design. Currently the image is set with Baskerville and Avenir.</p>
    <p>Any suggestions?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Knox%20Photography.jpg" width="424" height="211" alt="">
