      <p><cite>… a geometrical sans serif font.</cite></p>
      <p>Avant Garde is intangible for decent designers.</p>
      <p>Futura and Gotham are fine faces, yet desperately over-used.</p>
      <p>Look for alternatives. You may consider e.g. Brandon, Avenir, Mostra (Nuova), Eagle, Kabel, Le Havre or, if modesty allows,<br><a href="http://new.myfonts.com/fonts/andreas-stotzner/lapidaria/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Lapidaria</a>.<br>
      Good luck!</p>
