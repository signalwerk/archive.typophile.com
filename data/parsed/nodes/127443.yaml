      <p>The redesign of the packaging was done by LAND, an agency know for custom lettering (thought they used Hobo for the product name elsewhere on the label). I'm not finding a match to Stumptown or Coffee Roasters:<br><a href="https://www.underconsideration.com/brandnew/archives/new_packaging_for_stumptown_coffee_roasters_by_land.php">https://www.underconsideration.com/brandnew/archives/new_packaging_for_s...</a><br><a href="http://www.workbyland.com/work/stumptown-coffee-roasters">http://www.workbyland.com/work/stumptown-coffee-roasters</a></p>
      <p>Coffee Roasters resembles an old Speedball Lettering style called Block, which was digitized by Dick Pape:<br><a href="http://luc.devroye.org/pape/Speedball%20Text%20Book%20by%20Ross%20F.%20George/">http://luc.devroye.org/pape/Speedball%20Text%20Book%20by%20Ross%20F.%20G...</a></p>
