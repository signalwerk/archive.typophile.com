    html: <p>I think most of it is based on Harrington (a.k.a Hermosa). It's an old Art Nouveau era design that Microsoft and Richard Beatty (and probably Scriptorium) have digitized. I can probably find a link for one of them. <br> <br>Only the looping 'l' looks really new, and the crescent dot on the i. The 'a' has been truncated to remove the serif, so it didn't clash with the r, and a tail has been added to the e in an attempt to make it connect with the 'r'. </p>
    html_clean: <p>I think most of it is based on Harrington (a.k.a Hermosa). It's an old Art Nouveau era design that Microsoft and Richard Beatty (and probably Scriptorium) have digitized. I can probably find a link for one of them. <br> <br>Only the looping 'l' looks really new, and the crescent dot on the i. The 'a' has been truncated to remove the serif, so it didn't clash with the r, and a tail has been added to the e in an attempt to make it connect with the 'r'. </p>
