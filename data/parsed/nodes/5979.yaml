    html: <p>I found the Scriptorium version. It is called <a href="http://www.myfonts.com/fonts/scriptorium/rossetti/" target="_blank">Rossetti</a>. I also found the Identifont page on <a href="http://www.identifont.com/show?1ND" target="_blank">Harrington</a>. I got my copy of Harrington in a Microsoft TrueType Master Set for Macintosh in 1994.</p>
