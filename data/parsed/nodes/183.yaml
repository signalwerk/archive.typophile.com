    html: "<p>\"I feel the same way, Paul. The poop bucket  <br>disturbs me a little, but I quite like the bloody tub.  <br>Not sure why too.\" <br> <br>\"••••!\" is Ubu's first word (and may as well be his last). This is the strength of Jarry's puerile masterpiece: identifying •••• as the ultimate abiding insult to bourgeois aspiration. In this regard the situation at the start of the 21st century is pretty much equivalent to the end of the 19th. Recent representations of man-in-league-with-•••• hardly compare.  Mr. Hanky (or Kricfalusi's urHanky, \"Knutty the friendly dump\") is a commodified leakage from Ubu's chamber pot. <br> <br>Anyway, love the posters (I like 1 and 3 most). Good work! <br> <br>BTW, I made an \"Ubu centennial\" series of sketchbooks in 1996 playing with the spiral, belly, hood and hat forms of Jarry's original drawings; must do something with those at some point... <br></p>"
    html_clean: "<p>\"I feel the same way, Paul. The poop bucket  <br>disturbs me a little, but I quite like the bloody tub.  <br>Not sure why too.\" <br> <br>\"••••!\" is Ubu's first word (and may as well be his last). This is the strength of Jarry's puerile masterpiece: identifying •••• as the ultimate abiding insult to bourgeois aspiration. In this regard the situation at the start of the 21st century is pretty much equivalent to the end of the 19th. Recent representations of man-in-league-with-•••• hardly compare.  Mr. Hanky (or Kricfalusi's urHanky, \"Knutty the friendly dump\") is a commodified leakage from Ubu's chamber pot. <br> <br>Anyway, love the posters (I like 1 and 3 most). Good work! <br> <br>BTW, I made an \"Ubu centennial\" series of sketchbooks in 1996 playing with the spiral, belly, hood and hat forms of Jarry's original drawings; must do something with those at some point... <br></p>"
