    html: "<p>OK, now I've been spurred to critique, which is not to say that I don't love these posters anymore. <br> <br>I found I didn't like the first as much as the others, though I agree with Eduardo that is is more subtle, and feels more dynamic in layout (and I like the marching lemming soldiers). I think it just stands out as so different from the others. And since the others were pretty clear, and I don't like to think, I felt more comfortable with them. <br> <br>The one thing now that stands out is the vector details (bubbles, blood drop) in the blood tub poster. I'm inclined to like the contrast with the rough illustrations, but since it doesn't happen anywhere else (I think), it seems a little out of place. <br> <br>I do like the Clarendon (I'm assuming it's Clarendon from Eduardo's post, since I'm not a top-notch typeface id-er. I've never seen Clarendon with Greek characters, but I might be showing my ignorance) in #3. It gives the type a nice structure for the more chaotic illustration to play off of (Unlike #2 &amp; 4, where the type kind of blends in). Plus, I've been falling in love with Clarendon again these days. <br> <br>But I still think these posters are swell! Wouldn't mind a set for my wall. Sorry for the selayed crit. I told you, I don't like to think.</p>"
    html_clean: "<p>OK, now I've been spurred to critique, which is not to say that I don't love these posters anymore. <br> <br>I found I didn't like the first as much as the others, though I agree with Eduardo that is is more subtle, and feels more dynamic in layout (and I like the marching lemming soldiers). I think it just stands out as so different from the others. And since the others were pretty clear, and I don't like to think, I felt more comfortable with them. <br> <br>The one thing now that stands out is the vector details (bubbles, blood drop) in the blood tub poster. I'm inclined to like the contrast with the rough illustrations, but since it doesn't happen anywhere else (I think), it seems a little out of place. <br> <br>I do like the Clarendon (I'm assuming it's Clarendon from Eduardo's post, since I'm not a top-notch typeface id-er. I've never seen Clarendon with Greek characters, but I might be showing my ignorance) in #3. It gives the type a nice structure for the more chaotic illustration to play off of (Unlike #2 &amp; 4, where the type kind of blends in). Plus, I've been falling in love with Clarendon again these days. <br> <br>But I still think these posters are swell! Wouldn't mind a set for my wall. Sorry for the selayed crit. I told you, I don't like to think.</p>"
