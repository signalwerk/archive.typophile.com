    <p>I'm a young teacher who is interested in framing a print of William Ernest Henley's poem Invictus in the complicated typeface Zapfino. I am experienced with computers, but not at all with digital typography. Zapfino Extra has many guidelines for usage, and this is probably not a job I can handle myself. Not to mention, I don't own the font family and it's very expensive.</p>
    <p>Do you have any suggestions about how I might be able to have this done? A copy of the poem and a couple links of interest are provided. Thank you!</p>
    <p>-----</p>
    <p><a href="http://en.wikipedia.org/wiki/Zapfino" title="http://en.wikipedia.org/wiki/Zapfino">http://en.wikipedia.org/wiki/Zapfino</a><br>
    <a href="http://www.linotype.com/2762-17899/tipsandrecommendations.html" title="http://www.linotype.com/2762-17899/tipsandrecommendations.html">http://www.linotype.com/2762-17899/tipsandrecommendations.html</a></p>
    <p>-----</p>
    <p>Out of the night that covers me,<br>
    Black as the pit from pole to pole,<br>
    I thank whatever gods may be<br>
    For my unconquerable soul.</p>
    <p>In the fell clutch of circumstance<br>
    I have not winced nor cried aloud.<br>
    Under the bludgeonings of chance<br>
    My head is bloody, but unbowed.</p>
    <p>Beyond this place of wrath and tears<br>
    Looms but the Horror of the shade,<br>
    And yet the menace of the years<br>
    Finds and shall find me unafraid.</p>
    <p>It matters not how strait the gate,<br>
    How charged with punishments the scroll,<br>
    I am the master of my fate:<br>
    I am the captain of my soul.</p>
