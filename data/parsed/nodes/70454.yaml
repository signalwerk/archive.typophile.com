      <p>This must be the best specimen of Zapfino I've seen in a while. I always see Zapfino on garbage bins and in ugly logos.</p>
      <p>I had trouble understanding the poem but readability was fine. I wouldn't worry about how easy it is to read this from a distance. When you're reading from close proximity a major problem is character recognition, you know if a certain letter looked like another or if it doesn't look like any at all. But in the case of Zapfino it's such a well-drawn typeface with a very solid calligraphic background and all the flourishes and the styling do not add any ambiguity.</p>
      <p>I think you've done a great job on the second one, you made it more even in texture. I would be tempted to set WILLIAM ERNEST HENLEY - INVICTUS in serif capitals. Something like  Hoefler All Caps at a height a little larger than the Zapfino x-height in the text. Naaah forget I said that you probably want the name of the author to be prominent.</p>
      <p>Other than that add more margin especially on the sides (if you can I don't know maybe this is the ratio you're working with).</p>
      <p>Oh and if you're interested in Herman Zapf's lettering take a look at <a class="freelinking external" href="http://vimeo.com/5385464" rel="nofollow">this video</a>.</p>
