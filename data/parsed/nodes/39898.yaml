    html: |-
      <p>Hello,</p>
      <p>This may help:</p>
      <p><em>Font Attribute:</em><br>
      <code><br>
      classes[string]</code><br>
        list of glyph classes in Classes panel</p>
      <p><em>Font Methods:</em><br>
      <code><br>
      SetClassFlags(int class_index, bool left, bool right)</code><br>
        allows to set 'left' and 'right' properties of the kerning class<br>
      <code><br>
      SetClassFlags(int class_index, bool lsb, bool rsb, bool width)</code><br>
        allows to set 'lsb', 'rsb' and 'width' properties of the metrics class<br>
      <code><br>
      GetClassLeft(int class_index)</code><br>
        returns the 'left' property of the class<br>
      <code><br>
      GetClassRight(int class_index)</code><br>
        returns the 'right' property of the class<br>
      <code><br>
      GetClassMetricsFlags(int class_index)</code><br>
        returns the tuple containing LSB, RSB and Width flags of the metrics class </p>
      <p>Regards<br>
      Eigi</p>
