    html: |-
      <p>This fancy letter would have been drawn by a monk illuminating a medieval manuscript. The sample image is small but the F seems to include Celtic knots, a common theme in the initial letters used in famous manuscripts such as the Irish <a href="http://en.wikipedia.org/wiki/Book_of_Kells" rel="nofollow">_Book of Kells_</a>.<br>
      Too fancy for a font, but a vector version of this F may be available. A Google search for <a href="https://www.google.ca/search?q=vector+celtic+illuminated+manuscripts&amp;client=firefox-a&amp;rls=org.mozilla:en-US:official&amp;tbm=isch&amp;tbo=u&amp;source=univ&amp;sa=X&amp;ei=rhK_UZKxJMLVqAGcn4C4CQ&amp;ved=0CCoQsAQ&amp;biw=1074&amp;bih=906 " rel="nofollow">vector Celtic illuminated manuscripts</a> will lead you to similar letters, and with some perseverance you might find a vector of the initial F used on the book cover.<br>
      A good assortment of old fancy initial capitals, but not including this particular F, can be found at <a href="http://www.aridi.com/index.php/component/content/article?id=41" rel="nofollow">Aridi initial capitals</a>.<br>
      Don</p>
