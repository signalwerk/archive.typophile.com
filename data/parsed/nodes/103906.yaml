    <p>Hi everyone,</p>
    <p>I'm hoping someone can ID this font for me please;</p>
    <p><a href="http://ecx.images-amazon.com/images/I/51Sx1ZzqysL._BO2,204,203,200_PIsitb-sticker-arrow-click,TopRight,35,-76_SX342_SY445_CR,0,0,342,445_SH20_OU02_.jpg" title="http://ecx.images-amazon.com/images/I/51Sx1ZzqysL._BO2,204,203,200_PIsitb-sticker-arrow-click,TopRight,35,-76_SX342_SY445_CR,0,0,342,445_SH20_OU02_.jpg">http://ecx.images-amazon.com/images/I/51Sx1ZzqysL._BO2,204,203,200_PIsit...</a></p>
    <p>I'm after the font used for the 'F' character. I appreciate this may be difficult (or impossible) with just one letter, but hopefully someone out there will know!</p>
    <p>Any help greatly appreciated.</p>
    <p>Many thanks</p>
    <p>Hennree</p>
