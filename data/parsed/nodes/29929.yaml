      <p>&gt;&gt;type design is one of the most conservative arts</p>
      <p>&gt;It’s not art, it’s design</p>
      <p><em>Its art if you say its art, and design if you say it is design.</em></p>
      <p>Legibility proscribes  type as solely design. Legibility is important, and legible fonts pay a lot of this community's bills. But that is only an assumed constraint, and it is optional.</p>
      <p>Type design is type design, not type artistry, because development as a medium was limited by requisite commercial equipment. Commerce requires readable type. All the design of type has led from calligraphy down to Helvetica and Clearview. It leaves me surprised how some here, with such libertarian viewpoints, balk at radicalism in type.</p>
      <p>Type artistry has always been practiced on the side, but now more so than ever. This is just a baby medium? As the barrier to entry has dropped over the last few decades only, it will take time for this artistic field to blossom. There will be things to blow all our minds, and we'll all probably be too old to like it.</p>
      <p>Originality and innovation are the same thing, more or less. You look at a problem, look around for solutions, and if if you find none, create one. Then, if others like and borrow it, you are considered either, which one depending on the field of discussion.</p>
      <p><em>(No, I do not hate Clearview. Actually it is excellent art, as well as design. It just sets a pretty high bar for the industrial design-side of type, and is no more "fun" than it should be.)</em></p>
