      <p>At grammar school, I was being taught about the renaissancistic way of perceiving art. By then, one considered three stages an artist should walk, which are, in a strict order: translatio (translation) &gt; imitatio (imitation) &gt; aemulatio (improvement).<br>
      That is to say, an artist should first study the work and achievements of ancient artists, then copy it, before he or she could even <cite>try</cite> to make up something better.</p>
      <p>Since the nineteenth century, the focus in art has been laid more and more on the third stage:  originality (innovation, "improvement") has been the main characteristic of "good" art; a good artist is someone who takes the experiment as a central part of his/her work.<br>
      A conservative artist, at the other hand, leaning towards history rather than running into future, is at his best a good craftsman but he won't win prizes for his efforts.</p>
      <p>But does this also hold for type designers? I think type design is one of the most conservative arts, simply because the playground isn't very large; you always have to deal with the strict limitations of the alfabet and the readers's demands for legibility and clearness of shape.</p>
      <p>Is the renaissancistic perception of art still valid within the area of type design? Is it necessary to first study the work of your "creative ancestors", copy their ideas and manners, <cite>before</cite> you could walk your own way, "do it all yourself"?<br>
      Or is it possible to both wipe out history, start with a tabula rasa, and become a good &amp; qualified type designer?</p>
