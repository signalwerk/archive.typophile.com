      <p>matthewcroft, first off let me say that 'originals' pay for what  understanding we have - with our very lives. And sometimes it's a very heavy price.<br>
      I was born to, and raised in, a modern master's studio (painter). And I have met many many other masters, all of them 'gifted'. Only way I know how to say 'it'.</p>
      <p>'it' - is a clear understanding of what 'it' is that you do. And the 'vision' that comes along with 'it', will define you as an original. In other words, you'll have a 'voice'... sooner or later.</p>
      <p>And with that 'voice' you can speak the language of whatever 'it' is that you do, ok? Could be Type, Architecture, Photography, Politics, etc., etc...<br>
      And after a while, you'll look back on your 'work'(if you live that long), and see the discoveries you have found. And 'it' is hallowed ground.</p>
      <p>I don't think 'visionaries' and 'innovators' (like an Edison) are on the same page.</p>
      <p>Visionaries create from an 'understanding', those who innovate are more like explorers who have the ability to put 'a' with 'b' and come up with 'c'. Personally speaking, visionaries don't give a sh*t about 'a', 'b', or 'c'. It's not because we're not part of humanity - "part of the main" - it's more to do with being consumed. Consumed by an all encompasing 'it'/'understanding'/'vision'.</p>
      <p>Hope that helps...</p>
