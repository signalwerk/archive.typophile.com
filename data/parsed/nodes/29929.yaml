      <p>&gt;Plagerism is necessary</p>
      <p>This exaggerates a valid point--to the point  of being wrong.</p>
      <p>Philosopher of art R.G. Collingwood does point out, interestingly, that in some of the most fertile periods in art people took freely from one another's work: the Renaissance, the Elizabethian England of Shakespeare. But I don't think it is ethical, or necessary to copy directly, by plagerism in writing, or taking in another's glyphs and moving around a few points. It is a matter of taking ideas--which are not copyrightable--and applying them in your own work. </p>
      <p>John Lennon said that the Beatles constantly 'knicked' others' melodic ideas, 'but not so you'd know it'--which is the point. George Harrison went too far on one--'My Sweet Lord'--but even there it would have been OK if he would have acknowledged it and paid the originator for his contribution (which he had to eventually).</p>
