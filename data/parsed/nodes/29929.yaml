      <p>&gt;I don’t think both phenomena have anything in common but by coincidence. Technological innovation comes from the wish to make things easier while being original is a matter of personal aesthetics.</p>
      <p>I think this claim is actually quite wrong. Psychologically the processes of creating technical and artistic innovations are very similar: they are both *problem-solving* processes. Innovation in art, and even moreso in design is not simply a matter of having a different personal taste. It is a matter of how the designer or artist understands his or her task, and the ideas he or she brings to carrying it out well, and to the specific challenge of the problem he or she is facing. </p>
      <p>For example, the Impressionists had new information about visual perception that came from the theories of Helmholtz and others, as well as the budding innovation of photography as competition to painting. They wanted to keep painting fresh and relevant, as well as to incorporate the new insights on perception. Within that framework, that problem situation for painting, they came up with new styles. It wasn't a matter of personal taste alone. </p>
      <p>Similarly, some of us trying to do fonts for text get into long--ok endless--discussions of the science of reading because we are stuggling with the problem of how to make text more readable, or at least equally as readable as the best text faces. </p>
      <p>Also, one can see that cheap paper in the 19th century gave rise to the possibility of mass advertising. And this gave rise to different aesthetic demands than the original task of print, which was to reproduce religious texts and the classics of ancient Rome and Greece. Hence there was a proliferation of attention-getting faces, such as fat face, sans, etc.</p>
