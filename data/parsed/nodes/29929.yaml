      <p>Let me clarify the nature of Oblong. It differs from Licko's earlier bitmapped fonts, which were pretty straightforward "technical fixes", compromises, really, for the limitations of extremely low resolution grid fonts, trying to make them as much like "proper" type as possible. And indeed, as you say, Zuzana was preceded in this area by many other designers.<br>
      However, Oblong, along with for instance Max Kisman's Network, were different in that they were using bitmaps in a formally inventive way, to highlight the effect rather than apologize for it -- and art directors would use these fonts in display settings.</p>
      <p>As I mentioned, Wim Crouwel deserves the primary credit for this approach, but I believe that Oblong, in 1988, was the first digital type to take a similar tack, and I recall that it created quite a stir at the time.</p>
