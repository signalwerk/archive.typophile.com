    <p>For my thesis I am looking at innovation and the concept of 'originality'. It appears (to me at least) that innovation within typography is linked to a change in the method of production (eg. the 'new' typography of the 1990's and the advent of the Mac).</p>
    <p>I am interested in the work of Erik van Blokland and Just van Rossum. </p>
    <p>I would like to know who others find to be truly innovative at present?</p>
