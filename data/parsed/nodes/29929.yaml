      <p><em>type design is one of the most conservative arts</em></p>
      <p>It's not art, it's design. However, if you compare it to fine art, or other areas of design, you will find that the type designers beat the artists to modernism by almost a century. After all, the sans serif -- pure function devoid of ornament, and unicase (all caps) to boot -- was a "movement" of the 1830s.</p>
      <p>To say that type design is constrained by the alphabet is axiomatic, for all design has its constraints, it has a job to do. Buildings need roofs, knives must cut, phones must carry a conversation.</p>
