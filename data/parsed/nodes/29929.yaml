      <p>While Just &amp; Erik have exploited digital technology to create a kind of random effect that was not previously possible, I don't believe such direct use of technology was the main impetus to the New Typography of the digital era. Rather, it was caused by the way in which Fontographer made it possible for just about anyone to produce working typefaces inexpensively and with little effort. This opened up a field of design which had been previously restricted to a few specialists working in a conservative subculture.</p>
      <p>I had spent a decade trying to get my type designs published, gave up in 1985, but started over in 1993. When I came up with the Panoptic alphabet (unicase + monowidth), this is a concept that is technology-independent. But I doubt that the set of circumstances that led to its creation would have existed pre-digital, because the probability that a type designer with an interest in concrete poetry, who happened to be teaching a course involving the design of unicase fonts, would consider designing a typeface for a one-off book of monospaced poetry, and put two and two together, is pretty low. The proliferation of type-design in the digital era raised the chances.</p>
      <p>With regards to Zuzana Licko's "Oblong", it was something that could have been produced with any prior technology. But as was said somewhere in the pages of Emigre magazine, why would anyone have bothered? Modular and grid based types had been designed before, e.g. by Wim Crouwel in the 1960s, but the digital pixel has given new meaning to "pixel" fonts, as symbols of modernity, whether or not they are used in true pixel mode.</p>
