      <p>Personally I don’t think “originality” is that artistic, that is why craft is not just what it looks like and feels like but also about how it works.<br>
      Women are creative, would they say this is not original ?<br>
      So, as I wrote in another post, innovation does not require starting from scratch, just because we can’t start from scratch : the universe has been here for awhile. In fact, successful innovation often happens simply because a curious person paid careful attention to how something in the world works.<br>
      And once they really understood how people use that thing, they could see what was both good and bad about its value to those people. With that understanding, a creator can apply their imagination towards new ideas that eliminate the bad and expand on, or leap-frog, the good. Technical brilliance may be the only way to realize that imagination, but it’s the ability to generate or recognize those meaningful ideas that drives the best kinds of innovation.<br>
      Rather than “originality” being essentially concerned with the future, I believe that both “originality” and education, is a process of living and not a preparation for future living.</p>
