      <p>Hmmm, the m and n look like Dax, but the ’a’ sure doesn’t. It’s “Modula Bold” an old film type, shown in the Phil’s Photo book from 1985. The only digital version I know offhand is “Obbsidda” from NovelFonts. We had Modula recently in a question about airport type, as I recall.</p>
      <p>- Mike Yanega</p>
