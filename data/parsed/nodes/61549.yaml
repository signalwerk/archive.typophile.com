    html: |-
      <p>There are panels positions stored in the workplace setings:</p>
      <p>~/Library/Application Support/FontLab/Studio 5/Workspaces/CurrentWorkspace.rc</p>
      <p>Maybe just deleting this file will fix it. If not, some panel and window positions are in:</p>
      <p>~/Library/Preferences/com.fontlab.fontlab5.plist</p>
      <p>Just delete the pref file, and recreate your prefs.</p>
