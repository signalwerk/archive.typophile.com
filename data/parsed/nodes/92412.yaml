    html: |-
      <p>Digitized fonts for embroidery machines aren't always based on extant typefaces, and—in some cases—they are, but modified enough to avoid copyright infringement issues. </p>
      <p>In this instance, the latter may be the case. The unmirrored serif on the bottom of the N is an oddity, the T and the E are somewhat out of place, and the A may well be an rotated U with a crossbar added.</p>
