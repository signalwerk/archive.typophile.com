    <p>Hi,</p>
    <p>currently I only have this short sample: it's a scan of some cloth containing the word RAINDAUGHTER. Afaik some kind of (professional) weaving loom weaved it onto that cloth. I'm trying to get more characters, but for now that's all I have.</p>
    <p>Especially the A with the rounded top seems to be rarely found in fonts (at least those that I found ...).</p>
    <p>Thanks in advance and best regards<br>
    Soeren</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/raindaughter_font3_upload_4879.jpg"></div><p></p>
