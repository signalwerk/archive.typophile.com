    <p>Hopeless Diamond is a contemporary display type inspired by the dimensionality of 19th Century carved lettering and signage. Our initial designs were reminiscent of the radical forms of the B-2 Spirit Stealth Bomber and the F-117 Nighthawk Stealth Strike Aircraft which provided an additional arena for inspiration. The name itself is taken from an earlier model of the F-117 that was called the ‘Hopeless Diamond’ due to its unusual structure and departure from aerodynamic doctrine.</p>
    <p></p><div class="imageWrap"><img src="/files/hopelessdiamond_ty_4820.png"></div><p></p>
    <p>Hopeless Diamond is available in 3 varieties, each composed of 4 styles; Regular, Alternate, and accompanying Italics.<br>
    Available in OpenType, PostScript and TrueType formats from virusfonts.com</p>
    <p>You can explore the design further by visiting<br>
    <a href="http://www.virusfonts.com/fonts/hopeless-diamond" title="http://www.virusfonts.com/fonts/hopeless-diamond">http://www.virusfonts.com/fonts/hopeless-diamond</a></p>
    <p>A pdf can be downloaded from:<br>
    <a href="http://www.virusfonts.com/images/pdf-samples/Hopeless%20Diamond.pdf" title="http://www.virusfonts.com/images/pdf-samples/Hopeless%20Diamond.pdf">http://www.virusfonts.com/images/pdf-samples/Hopeless%20Diamond.pdf</a></p>
    <p>=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=</p>
    <p>Design: Marcus Leis Allion and Jonathan Barnbrook<br>
