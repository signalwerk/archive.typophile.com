    <p>I need to automate the creation of a 16-bit font file. Each glyph is available as a PNG or SVG file.  I can reconvert to PS if needed.</p>
    <p>We have released the 16-bit file based font under the Open Font License: ISWA 2010.  I have 37,811 glyphs with codepoints from 1 to 62,504.<br>
    <a href="http://www.signbank.org/iswa" title="http://www.signbank.org/iswa">http://www.signbank.org/iswa</a><br>
    <a href="http://www.signbank.org/iswa.zip" title="http://www.signbank.org/iswa.zip">http://www.signbank.org/iswa.zip</a></p>
    <p>Each glyph is available as an individual PNG or SVG file.  Each glyph has a unique codepoint.  Not all codepoints are assigned.  The glyphs do not share a common height or width.  The glyphs should always be displayed left then top.  The glyphs do not rotate or morph.</p>
    <p>The character map should be automated from a few simple rules.  There is one formula for a sequence of 3 characters and an algorithm for individual characters.  The characters are proposed for plane 1 of the UCS.<br>
    <a href="http://www.signpuddle.net/plaintext" title="http://www.signpuddle.net/plaintext">http://www.signpuddle.net/plaintext</a><br>
    <a href="http://www.signpuddle.net/plaintext.zip" title="http://www.signpuddle.net/plaintext.zip">http://www.signpuddle.net/plaintext.zip</a></p>
    <p>Is this possible to automate?  Anyone have a suggested process flow with command line tools or custom programs? </p>
    <p>I'd appreciate any advice on an individual, company, or software package that could help me get this done quick.</p>
    <p>I need a version that will work with the proposed Unicode characters and display the correct glyph rather than the empty block characters.</p>
