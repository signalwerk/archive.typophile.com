    html: |-
      <p>Sign <em>writing</em> -- the literate pendant of sign language? I have worked with Hamnosys, and I wasn't duly impressed. Sure, single hand signals translate great to static single images of a hand &amp; fingers in a certain configuration, but to add <em>movement</em> I had to coax various "accents" in place over the images. What a drag.<br>
      (Besides, this also seem to cater for non-manual signs: nose wiggles, eye blinks, smileys. Everything to make a story lively, I guess.)</p>
      <p>It seems you have a set of <em>glyphs</em> and associated <em>Unicode codepoints</em> to store them in. Is your target a Unicode compliant font, where entering the Unicode, through software that supports this, yields the correct character?<br>
      In that case, all that's needed is a (relatively) easy font creating software, where you can import your images into, assign arbitrary codepoints, and save as an OTF or TTF. I <em>do</em> know that you should stick to vector files -- no PNGs. I'm not sure about SVGs -- perhaps these can be imported or copied into the regular software, perhaps not. (With FontLab, I've read here, you can copy/paste from Illustrator.)</p>
      <p>Since it looks like you're not after heavy-duty Opentype features, you could try FontForge (which is free, so it's easily tried; but it has a steep learning curve), or FontLab's beginner's package <a href="http://www.fontlab.com/font-editor/typetool/" rel="nofollow">TypeTool</a>.</p>
      <p>If there is any way of converting your outline data to another format, you could look into <a href="http://sourceforge.net/projects/fonttools/" rel="nofollow">TTF</a> -- this is based around a human-readable XML format, but (downside) it needs the actual outlines to conform to standard font outline formats -- Type 1 or Truetype.</p>
