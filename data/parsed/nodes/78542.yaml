    html: <p>Ps. As long as you construct the glyph names so that for 4-digit Unicodes the glyph names are "uniXXXX" and for 5-digit Unicodes "uXXXXX" where XXXX(X) is the hexadecimal Unicode codepoint written using uppercase hex digits (but "uni" and "u" need to be lowercase), then the tools should automatically build a correct character map for you.</p>
