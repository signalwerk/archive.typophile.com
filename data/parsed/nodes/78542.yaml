      <p>There are two sets of commandline tools that come to mind:<br>
      * FontForge [1]<br>
      * Adobe FDK for OpenType (AFDKO) [2] combined with ufo2fdk [3] and the UFO format [4]</p>
      <p>The easiest path would probably be to construct an SVG Font [5] and then convert it into OpenType (OTF or TTF) using FontForge. Another approach would be to convert the SVG drawings into the UFO format (which is a simple, high-level XML-based format for font data representation), and then use ufo2fdk and AFDKO to build an OpenType (OTF) font. FontForge can also be used to convert UFO into OpenType (OTF or TTF). </p>
      <p>FontForge can be run on Linux, Mac OS X and Windows. AFDKO can be run natively on Mac OS X and Windows, it can also be run on Linux using WINE. </p>
      <p>[1] <a href="http://fontforge.sourceforge.net/" title="http://fontforge.sourceforge.net/">http://fontforge.sourceforge.net/</a><br>
      [2] <a href="http://www.adobe.com/devnet/opentype/afdko.html" title="http://www.adobe.com/devnet/opentype/afdko.html">http://www.adobe.com/devnet/opentype/afdko.html</a><br>
      [3] <a href="http://code.typesupply.com/wiki/ufo2fdk" title="http://code.typesupply.com/wiki/ufo2fdk">http://code.typesupply.com/wiki/ufo2fdk</a><br>
      [4] <a href="http://unifiedfontobject.org/" title="http://unifiedfontobject.org/">http://unifiedfontobject.org/</a><br>
      [5] <a href="http://www.w3.org/TR/SVG11/fonts.html" title="http://www.w3.org/TR/SVG11/fonts.html">http://www.w3.org/TR/SVG11/fonts.html</a></p>
