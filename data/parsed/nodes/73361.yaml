    <p>Boston, MA and Elk Grove Village, IL -- August 19, 2010 -- The Font Bureau, Inc. and Ascender Corporation today announced Webtype.com, a new venture to serve web designers and developers with publication-quality fonts to improve the typography and readability of websites. The service is available now at <a href="http://www.Webtype.com" title="http://www.Webtype.com">http://www.Webtype.com</a> with a variety of custom web font options to accommodate websites of all sizes.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/webtype-logo2_5308.png"></div><p></p>
    <p>In the past, technical issues limited how fonts could be used on websites, but a lot has changed in the last couple years. Web designers have probably heard about new options for using fonts other than the handful of “web-safe” choices like Verdana and Georgia in their web designs.</p>
    <p>As all the major web browsers have adopted support for the @font-face technology for linking fonts to web pages, new web font services have come on the market. While some of the existing services offer viable solutions for some cases, it was decided that the only way to maintain certain essential requirements was to start from scratch and build a new service from the ground up.</p>
    <p>The result of that decision has been realized as Webtype, a collaborative effort between Font Bureau, Ascender Corporation, Roger Black, Petr van Blokland, and DevBridge. Within that group sit some of the most respected leaders in type and technology -- people uniquely suited to take on the issue of web fonts.</p>
    <p>So, what is so different about Webtype? Why bother with a whole new web font service? </p>
    <p>One significant distinction is the licensing model. The Webtype service is modular by design, so you only pay for the fonts you need and for the level of traffic that your site draws. </p>
    <p>Another major feature is that any font on Webtype.com can be tested for free for a month. This way designers and their clients have an opportunity to evaluate any of the fonts in real-world settings without the risk or guesswork sometimes associated with font licensing. Also, building on their history of custom font work for print publications -- services like feature expansions or proprietary typeface development -- Font Bureau and Ascender can provide specialized fonts through Webtype to meet any individual client’s particular needs for their website.</p>
    <p>While a flexible licensing model, free trials, and custom services are important, the most crucial component that sets Webtype apart is the standard of quality for the fonts offered. </p>
    <p>For starters, each Webtype font has been carefully ‘hinted’: instructions are programmed into a font to optimize how it is rendered on screen. While such instructions are often automated, only a human eye can evaluate and tune a font to the optimal level of quality. Therefore, each and every font on Webtype has been  methodically hinted by Tom Rickner and the experts at Ascender Corporation, the people behind many of the web-safe fonts we’ve all relied on in the past. The result is type that renders crisply and cleanly across all browsers and operating systems.</p>
    <p>But hinting isn’t everything. When it comes to the nitty-gritty task of setting paragraphs of small text onscreen, even the best hinting in the world can’t ensure the success of any font. Because the computer screen is a unique format with its own particular properties (and constraints), achieving the most readable text fonts for the screen requires that they be designed from the ground up, with all the technological quirks in mind.</p>
    <p>Font Bureau and Ascender have done just that, investing significant amounts of time to develop the Reading Edge™ (RE) series of fonts. These fonts are styled to correspond to existing print typefaces from the Font Bureau library, but are in fact totally new designs produced specifically for setting highly readable onscreen text. The series, which is only available through Webtype, currently consists of five font families and provides web designers with a flexible palette of hard-working text typefaces. </p>
    <p>“Webtype is the first service that offers web fonts tuned for reading at small sizes while at the same time providing web designers with an interesting choice of typefaces” said noted publication designer Roger Black.</p>
    <p>In addition to the new RE series, users can also expect to see many of the classic Font Bureau typefaces optimized and made available for web use through Webtype, along with select fonts from other distinguished type designers and foundries. Keep an eye on webtype.com for a steady stream of new fonts and functionality over the coming weeks and months.</p>
    <p>About Font Bureau<br>
    The Font Bureau Inc. was founded in 1989 by noted publications designer and consultant Roger Black and type designer David Berlow to serve the emerging needs of computer-based magazine and newspaper publishers seeking unique typographic identities. During the past 21 years, Font Bureau has designed more than 2,000 fonts for more than 300 publications. Many of these fonts have become part of Font Bureau’s Retail library. The company remains small and privately held, with freelance and independent designers providing infusions of creativity. Full-time staff and designers direct the studio operations in Boston, which serves as the company’s headquarters. <a href="http://www.fontbureau.com/" title="http://www.fontbureau.com/">http://www.fontbureau.com/</a> </p>
    <p>About Ascender Corporation<br>
    Ascender’s founders are font industry experts who have been involved in developing many of the most important and influential fonts used in computers, mobile devices, consumer electronics, and software products. Ascender provides multilingual, custom font development for a wide range of customers including creative professionals, enterprises, software developers, and hardware manufacturers. Ascender also provides an extensive collection of TrueType &amp; OpenType fonts for download to graphic designers and consumers through its font websites, including <a href="http://www.AscenderFonts.com" title="www.AscenderFonts.com">www.AscenderFonts.com</a>.</p>
    <p>About Roger Black<br>
    For more than 35 years, working with magazines like Rolling Stone, newspapers like The New York Times, and websites like Bloomberg.com, Roger Black has been developing ways to communicate content more effectively. His teams have redesigned Reader’s Digest, Esquire, MIT News, The Nation (Bangkok), Los Angeles Times, and The Washington Post.  Black is a partner in the Font Bureau and Danilo Black and works from a small office in New York, Roger Black Studio. <a href="http://www.rogerblack.com/" title="http://www.rogerblack.com/">http://www.rogerblack.com/</a> </p>
    <p>About Petr van Blokland<br>
    Petr van Blokland (1956, The Netherlands) graduated Cum Laude from the graphic arts program at the Royal Academy of Fine Arts in The Hague. He has been a freelance designer since 1980. Van Blokland specializes in type, typography, and systematic design -- typically building directories, forms systems, corporate identity programs, etc. He has taught graphic design, typography, and type design for many years at the Academy of Fine Arts, Arnhem, and the Royal Academy of Fine Arts in The Hague. His first typeface was Proforma, and his work brought him ATypI’s coveted Charles Peignot Prize in 1988. Buro Petr van Blokland + Claudia Mens can be found at <a href="http://www.petr.com" title="http://www.petr.com">http://www.petr.com</a></p>
    <p>About DevBridge<br>
    DevBridge specializes in web design, web application development, e-commerce systems, website management and reporting. DevBridge has a diverse client base which represents its strength in creating innovative technology solutions to a variety of business problems. The DevBridge team has helped its clients create loyal customers, improve leads &amp; sales generation, and solve business inefficiencies. DevBridge is based in Chicago, IL. <a href="http://www.devbridge.com" title="http://www.devbridge.com">http://www.devbridge.com</a></p>
