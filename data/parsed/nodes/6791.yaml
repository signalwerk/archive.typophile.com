    html: <p>Isn't Swiss just another version of Helvetica? Martin, the sample is (I assume) a printed piece, and depending on what they printed it on you can have alot of the counters fill in. Plus the sample might be old enough to be a photostat then printed. Once again a loss of type quality.</p>
