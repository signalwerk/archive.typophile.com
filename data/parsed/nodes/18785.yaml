  html: |-
    <p>Hello,</p>
    <p>The name is Viviré which in Spanish translates to “I will live”.  I can go forever on why that is the name, but to make it short..we started using the name to evoke a sense of passion or attitude in business.</p>
    <p>I attached the original logo which was designed by me more than 5 years ago without any reasoning or strategic thinking.</p>
    <p></p><div class="imageWrap"><img src="files/logo_old.gif"></div><p></p>
    <p>We want a logo that make us look like leaders in design and strategy.</p>
    <p>Here are a few rough concepts.  I would like to keep posting reviews on this thread and document the revision process.</p>
    <p></p><div class="imageWrap"><img src="files/logo_vivire.gif"></div><p></p>
    <p>Let me know what you guys think.  Right now we don’t have an established preferance for colors, types, etc.</p>
    <p>Many thanks,</p>
    <p>Edgardo</p>
