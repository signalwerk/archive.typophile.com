    html: <p>Something like Jason Walcott's <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000019">Fenway Park</a> or <a href="http://www.veer.com/products/typedetail.aspx?image=JBT0000047">Scriptorama Tradeshow</a> might fit the bill. Perhaps even faces like the vintage handlettering styles of <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000014">Habano</a>, <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000081">Mr Sheppards</a>, or <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000077">Mr Dafoe</a> from Veer's <a href="http://www.veer.com/umbrella/">Umbrella</a> collection.</p>
