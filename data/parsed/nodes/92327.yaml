      <blockquote><p>I just love the last sentence "They must be handled one level higher". I still don't get what "one lever higher" means :)</p></blockquote>
      <p>Freetype contains routines to draw entire text strings (and thus limited to regular Unicode); but these are wrappers around its Core Business: drawing any arbitrary <em>glyph</em> from any font on any position.</p>
      <p>If you can figure out how to use the Draw Any Glyph function, you can pretty much draw any text, with all ligatures, small caps, accents, and whatever you can find in a font. The big drawback is that you need to follow the Opentype rules: do substitutions in the correct order, handle GPOS custom positioning (which includes, but is by no way limited to, advanced kerning), as well as handle all idiosyncratic inherent behavior of Opentype features (e.g., determine what a "beginning of word" character is and then look up if there is an "init" feature to be applied).</p>
      <p>I've never used it myself, but word on the streets is <strong>Harfbuzz</strong> is an intermediate text engine, sitting between Freetype and your own code to handle most OTF features.</p>
