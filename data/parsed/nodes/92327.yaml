      <p>Until someone comes up with an “offline” OpenType interpreter, you may have to do the heavy lifting yourself.</p>
      <p>Logically, for ligatures that would probably mean doing swaps before you submit the text string to the rendering machine, perhaps something like this:</p>
      <p><code>IF font has character UFB01;</code></p>
      <p><code>AND text string has contiguous characters /fi/;</code></p>
      <p><code>THEN swap UFB01 for /fi/ in text string before rendering;</code></p>
      <p><code>ELSE ignore.</code></p>
      <p>For alternates, until a uniform standard for designation and Unicode assignment is developed, you're on you're own…</p>
