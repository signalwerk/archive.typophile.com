      <p>If you are going to use Pango, I presume you can instruct it to do so ... I don't think it would be necessary to "manually" insert FreeType commands.</p>
      <p>So when using Pango, don't worry about the other libraries. That's the advantage of layered software: everything 'below' the level you are using ought not to concern you (unless, of course, you want to do something that the higher level library doesn't support).</p>
