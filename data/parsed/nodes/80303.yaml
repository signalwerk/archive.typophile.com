    <p>Hi There </p>
    <p>I am working on a logo for the communcations company/agency I am working for and for which I wanted your opinion.</p>
    <p>Keywords: proud but simple, embrace (close) and atmosphere</p>
    <p>My question: which mark do you think works best?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mark01_4039.jpg"></div><br>
    // MARK 1<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mark02_6191.jpg"></div><br>
    // MARK 2<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/concept_6413.jpg"></div><br>
    // Concept<p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/mark_variations_5194.jpg"></div><br>
    // Variations on mark 2<p></p>
    <p>The S is the first letter of the name of the company.<br>
    And the colors were choosen by feeling. Afterwards I noticed these were red, green and blue as in RGB (different order, though).</p>
    <p>Would appreciate your comments.</p>
    <p>Cheers</p>
    <p>Ray</p>
