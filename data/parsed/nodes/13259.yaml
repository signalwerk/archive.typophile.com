      <p>Eric, there was a <a href="http://www.typophile.com/node/7815">thread on typophile during the time of Paul’s job hunt</a>, which was started by a recent graduate from Belgium who was looking for a type internship anywhere in the world. She ended up at FontShop International in Berlin.</p>
      <p>I have been an intern at Linotype for over a year now, and I really love it. That internship came from contacts through school. Specifically, another student had worked there for two years, and wanted to stop. He told our typography professor this, who informed me of the soon-to-be opening. Then the student arranged the interview for me.</p>
      <p>Europe (specifically Germany, Holland, and England) has a lot of type foundries and type designers, many of whom take interns. The biggest problem for Americans is that some European governments will not issue work permits for interns (in some countries, an “intern” is actually one legal, regulated type of job category—and therefore one of the lowest). I am only able to work in Germany because I have a student visa (I’m a graduate student in Offenbach). I’m sure the exact rules vary from country to country. But if you want to work in type, I wouldn’t discount “Old Europe.” There is quite a bit of action going on here, both in terms of small foundries, and bigger ones.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
