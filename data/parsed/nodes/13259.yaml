      <p><em>So, paul, you got an internship in type design? And did you have any experience with it before applying?</em></p>
      <p>no formal education, but a lot of reading (the classics: elemenets, anatomy, letters of credit, etc.) also i had taught myself how to get around in FontLab and I had taught myself OT programming. I hadn’t completed a full typeface before starting work at P22, but I have since finished one of my own personal projects and released it through our subsidiary, <a href="/wiki/IHOF" class="wiki">IHOF</a>. To find out what <a href="/wiki/P22" class="wiki">P22</a> was looking for, i emailed <a href="/wiki/Richard%252BKegler" class="wiki">Rich</a> and then we talked on the phone and agreed it might be a good fit. I was in Buffalo a week later and i’ve been here since.</p>
      <p>It looks like <a href="/wiki/House%252BIndustries" class="wiki">House</a> is looking for “Strong bezier drawing skills, a knowledge of FontLab and willingness to learn proprietary techniques also a must” as well as a team player. Seems pretty basic.</p>
      <p>Actually, at the same time I was talking with Rich, H&amp;FJ actually had an opening and they called me and we had a good chat. They hired someone else, but it was flattering to at least be considered for a position with such a reputable foundry. At that time I had a bit of a website up showcasing some original font projects which i had begun, and i think that was a help, too. You never know what <em>could</em> happen unless you apply—nothing ventured nothing gained.</p>
