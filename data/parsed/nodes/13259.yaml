      <p>I did a year and a half of corporate design work in DC to cover the costs that moving to and living in Germany for the first year (as a cheap student) would ensue. </p>
      <p>This time also gave me time to think through my options, make applications, look in depth at three countries, etc. </p>
      <p>Terry, to evaluate a typeface, text settings are what count. You don’t need to present a full character set in order to get a good critque. Especially if you are on a deadline (which you are ;-) ), work on getting it right in text first (what the word “text” means depends on the fonts’ application). Whether your a circumflex is right (or even in the trials) is less important that overall rhythm, color, shape harmony, etc.</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
