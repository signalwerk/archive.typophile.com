      <p>I don’t know much about the UK, but I have a feeling that the rules there for Americans are a bit less strict than on the continent. However, living costs in London are higher than anywhere in Germany.</p>
      <p>Most German companies (and Dutch, French, Swedish, or Italian companies) run all internal business &amp; discussions in German (or Dutch, French, Swedish, or Italian, respectively). However, it is quite common in Europe for interns from other countries to be hired who do not speak the local language. In fact, I got my internship at Linotype <em>because</em> I was a native English speaker. Before working at Linotype, I worked in other design agencies. Finding internships here has not been difficult at all. However, I do speak German, which greases a lot of wheels. I wouldn’t have been admitted to my graduate program without being able to speak German, and therefore wouldn’t have gotten my visa/work permit.</p>
      <p>English is very, very prevalent in Europe. That does not mean that all Europeans will want to speak it with you, though. Especially when they are upset about something, or need to tell you something important or in a hurry. Beaurocrats get very angry if you do not speak their language perfectly.</p>
      <p>Most interns in Germany do not make enough money to support themselves. Some do, however, including myself. It is different from company to company. Interns do not <em>have</em> to be paid anything, and prestegious internships in non-design fields are often unpaid here.</p>
