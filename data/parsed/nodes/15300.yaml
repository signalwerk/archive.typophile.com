    <p>Hi,</p>
    <p>I am reading James Felici's <em>The Complete Manual of Typography</em> and at one point he talks about the missuse of <em>Times</em>. He goes into comparing the length of different lines of type made up of 26 letters —from A to Z— to show that <em>Times</em> is a very condensed type. What I don't understand is that he says that the average length of a line of type should be around 13 em(s). I though em(s) was (were) a relative mesure.</p>
