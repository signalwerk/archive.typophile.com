      <p>Yes, an em is relative to the point-body, so when a typeface is set at 10 points the em is 10 pts. wide.</p>
      <p><em>Times</em> is (was) essentially a newspaper face, therefore the reference of a suggested average of 13 ems to the line actually refers to newspaper columns and not book setting.</p>
      <p>Consider when <em>Times</em> is set at 12 pts. the width of the line is 13 picas wide (12 points = 1 pica) or approximately 2 3/16 inches wide.</p>
      <p>A more common reference used for optimal reading widths is character count and not ems.</p>
