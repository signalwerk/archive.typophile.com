      <p>Sebastien, I think you have misread Felici. On p. 130 he says "the lower case of a *standard* text face is 13 ems long." He doesn't say it "should be", and doesn't say that narrower or wider faces are "wrong". He cites Times as an example of a narrower face.</p>
      <p>He explains, "Once the alphabet length of a typeface diverges more than 5 percent from the 13-em standard, you will probably have to adjust your point size and measure." (Meaning, adjust from his rule of thumb that the maximum measure in picas is three times the point size.)  He says that "27 characters is the minimum line length, 40 the optimum, and 70 the maximum." </p>
      <p>Bringhust has a somewhat different view, explaining that 45 to 75 characters is satisfactory for a single column of a seriffed face in a text size, with 66 ideal. If you have discontinuous text with extra leading, you can go longer. </p>
      <p>For multiple column Bringhurst recommends 40 to 50 characters. (Bringhurst has a convenient table showing the relationships between alphabet width and measure.)</p>
      <p>In any case, Felici makes clear that there is an interaction between the width of the typeface, a good measure and the leading. These have to be considered together, and a good match found for the page size you are setting on. What is best will be influenced by the width of the typeface, the x-height, whether there are serifs or not, and other factors. So in practice you need to experiment with a particular typeface and page size until you find a good solution. And finding a good solution on size, measure, and leading is, I think, the most important aid to achieving a readable text, in addition to having a decently readable typeface.</p>
