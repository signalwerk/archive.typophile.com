    <p>Dear Typophiles,<br>
    As part of a research — I would like to conduct an interview with current designers or printers experienced in the field before DTP; who would be willing to share their invaluable knowledge. If this interests you contact me through Typophile or send an email at <a class="freelinking external" href="mailto:sevag@typeaffair.com" rel="nofollow">sevag@typeaffair.com</a>. Thank you for your time and kindness.</p>
