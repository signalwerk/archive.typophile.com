      <p>&gt; obsolete wisdom— like storing X-acto knives…</p>
      <p>Hey, I still use an X-acto. Not for cutting rubylith or type galleys anymore, but for trimming out mockups and that sort of thing. </p>
      <p>But I agree that you've got to be careful; those suckers are sharp! In college a friend of mine would carry one around in his shirt pocket (point up with no cap on it), which always seemed dangerous to me.</p>
