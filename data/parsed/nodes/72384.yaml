    <p>Hi </p>
    <p>I am looking for different variations on the <a href="/wiki/aesc" class="freelinking" rel="nofollow">ae ligature</a>. Does anyone have any sugestions for a good serif typeface that contains the ligature? I you know of any uncommon variations of this ligature that would also be greatly appreciated.</p>
