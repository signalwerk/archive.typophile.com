    html: |-
      <p>Robert: <em>This combination is called a dipthong.</em> [sic]</p>
      <p>A diphthong is a phonetic phenomenon: a glide between two vowel sounds within the same syllable. The æ character represents a diphthong in some languages, but in others it represent a pure vowel sound.</p>
    html_clean: |-
