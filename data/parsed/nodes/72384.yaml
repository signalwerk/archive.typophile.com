      <p>Paul: A gridded sample view (to complement the existing "list" and "gallery" views) was on my long list of things to do at MyFonts that I didn't get around to before taking my leave. Suggesting it on their <a href="http://new.myfonts.com/feedback" rel="nofollow">feedback page</a> might help move it up in priority.</p>
      <p>Nick: How far down on the list are you seeing Franklin? If you see a tag applied incorrectly to a font, you can always "disagree" with it on the font's page, which will improve your future searches as well as those of other users. That's part of any folksonomy I suppose… there will always be some stray errors but they're publicly correctable, and the openness allows the overall system to be much more comprehensive.</p>
