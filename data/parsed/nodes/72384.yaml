    html: |-
      <p>æ is a distinct letter in quite a few languages, so the design tends to be quite conservative. You might find it difficult to come up with ‘uncommon variations’.</p>
      <p>Where there is some interesting variation in approach is in italic types, but this is due to the practical difficulty of distinguishing <em>æ</em> from <em>œ</em> in styles with a unicameral <em>a.</em></p>
