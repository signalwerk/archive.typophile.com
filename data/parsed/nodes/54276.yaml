    html: |-
      <p><a href="http://www.haroldsfonts.com/metro.html" rel="nofollow">metro DF</a> by Harold Lohner was inspired by this look: </p>
      <p><em>»METRO-DF was inspired by a trip to Mexico City. The official signage of the Mexico City subway uses a peculiar adaptation of the classic font Eurostile, designed by Aldo Novarese. The capital E was most unusual. The overall feel was of a past vision of the future, with a distinctively Mexican touch. (The squared circle, or rounded square, is very common in both old and new Mexican design.«</em></p>
    html_clean: |-
      <p><a href="http://www.haroldsfonts.com/metro.html" rel="nofollow" class="link-external">metro DF</a> by Harold Lohner was inspired by this look: </p>
      <p><em>»METRO-DF was inspired by a trip to Mexico City. The official signage of the Mexico City subway uses a peculiar adaptation of the classic font Eurostile, designed by Aldo Novarese. The capital E was most unusual. The overall feel was of a past vision of the future, with a distinctively Mexican touch. (The squared circle, or rounded square, is very common in both old and new Mexican design.«</em></p>
