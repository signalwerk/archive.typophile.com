    <p>Hello everyone,</p>
    <p>Does anyone know of this typeface, which is used by the Mexico City Metro line. Which is the 2nd largest subway network behind New York in North America? I've tried many sources and about to exhaust all avenues.</p>
    <p>Thanks everyone,</p>
    <p>Keisuke</p>
