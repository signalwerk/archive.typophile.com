      <p>Michael Boyer -- <cite>and I should have realized right away that the offset is 32 bits, not 16 bits with a lookup type 9 (Extension positioning). In fact, there seems to be no offset that requires 32 bits in that font. Am I missing something?</cite></p>
      <p>That's what the extension lookup type (type 9 in GPOS, type 7 in GSUB) is for, allowing for larger offset values.&nbsp;&nbsp;;-)&nbsp;&nbsp;Such a lookup is not a "real" lookup but only serves as a relay to a "real" lookup (which then contains lookup metadata and refers to subtables defining glyph positioning or substitution). One might call it a nice hack to overcome at least part of a serious limitation.</p>
      <p>So back to Mr Fried's question, the best thing is to try activating the use extension option and see if it helps.</p>
