      <p>Did you activate the option to make use of extension type lookups?</p>
      <p>Not sure if this is the problem but it looks like you need two split some subtables into multiple ones. There is a subtable size limitation of about 65k which is a limitation of the OT layout tables.</p>
      <p>I do not see a reason why not to use AFDKO. Since the problem -- if this is your problem -- is related to OT layout tables rather than VOLT/AFDKO, you'd face it with both of them.</p>
      <p>Karsten</p>
