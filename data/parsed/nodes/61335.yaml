      <p>Since you refer to it, take a PairPosFormat2 subtable as an example:<br>
      Coverage table and ClassDef1/2 table offsets are, as you say, 16 bit integers so the maximum value can be 65536 (meaning bytes, from the beginning of the subtable). This means that there's a little less space than that left for the actual kerning data -- which is Class1Count*Class2Count*ValueRecord(s)[1] -- plus Coverage and ClassDef1 table lengths to make sure that Coverage, ClassDef1 and ClassDef2 tables are in reach.<br>
      It is not too hard to reach this limit.</p>
      <p>[1] For kerning to work, there must be a value only for the first glyph of the pair, i.e. one Record. Yet do not forget the ValueRecordFormat as another factor. Since with right-to-left scripts both positioning and advance width need to be adjusted, this means another *2.</p>
