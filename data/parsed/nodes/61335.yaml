      <p>I now took the time to have a closer look at that offset in AdobeArabic-Regular.otf Version 1.016. What I see in the file given by <code>spot -t GPOS AdobeArabic-Regular.otf</code> is<br>
      <code><br>
      --- Lookup [78] (0ab6)<br>
      LookupType   =0009<br>
      LookupFlag   =0008<br>
      SubTableCount=1<br>
      --- SubTable[index]=offset<br>
      [0]=0008<br>
      --- Subtable [0] (0008)<br>
      --- ExtensionPos<br>
      PosFormat = 1<br>
      LookupType  = 2<br>
      Offset      = 0000f18a<br>
      </code><br>
      and I should have realized right away that the offset is 32 bits, not 16 bits with a <a href="http://www.microsoft.com/typography/otspec/gpos.htm#EP" rel="nofollow">lookup type 9</a> (Extension positioning). In fact, there seems to be no offset that requires 32 bits in that font. Am I missing something?</p>
      <p>Michel</p>
