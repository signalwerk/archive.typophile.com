      <p>This thing has attributes of more than one blackletter style, which to me suggests a custom font, or hand-lettering. The 'a' and 'd' are like Frakturs, but other letters are like Gotisch faces. See <a href="http://www.myfonts.com/fonts/linotype/wittenberger-fraktur/mt-bold/" rel="nofollow">Wittenberger Fraktur</a> and <a href="http://www.myfonts.com/fonts/ef/weiss-rundgotisch/ef-regular/" rel="nofollow">Weiss-Rundgotisch</a> as examples</p>
      <p>- Mike Yanega</p>
