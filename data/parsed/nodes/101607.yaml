    html: |-
      <p>Chris, For a type designer, I would first determine what languages you want to cover. If you want to include some romanized languages, include that in your planning. For example, you can cover most romanized Arabic with just 4 characters in the spacing modifiers, and 10 in Latin Extended Additional. Romanized "Sanskrit" takes more, primarily in Latin Extended Additional. Several African languages need characters in Latin Extended B, as well as a couple combining diacritics.</p>
      <p>Anyway, after deciding which languages you want to fully support, it would be kind to complete the combining diacritics as well. While such a font may not have every character, a typesetter aiming at print can always make things work, if there aren't too many occurrences. This is somewhat regardless of the layout program. Same would apply to ebooks in PDF format. Not quite sure what would happen in EPUB, but then, the reader can change fonts on you anyway.</p>
      <p>When you try to cover everything, you're letting yourself in for a lot of work, and failure anyway. Quick, what's a glottal stop in the native Guatemalan language? How many Native American Languages do you want to cover, esp. since there may not be an agreed orthography?</p>
      <p>For the character sets you will cover, I prefer using {ccmp} &amp; making up the precomposed glyph. That way, you get exactly what you want. Last time I heard (a while ago, to be sure) Ross Mills (John Hudson's partner at Tiro Typeworks) favored this approach as well.</p>
      <p>BTW, blindly centering an accent is not always the way to go. Usually, for the European acute &amp; grave accents, I prefer not to "perfectly center" them, as long as they aren't too shallow. Adam Twardoch has written a nice piece on the use of the ogonek for Polish. Probably, but not necessarily, it's OK to use the same ogonek positioning for the Native American languages that also use it...</p>
      <p>Everybody but the typesetter gets a say. We're doing a book just now where the author insists the "Greek circumflex" be signaled by an inverted breve rather than the tilde. The book designer chose Arno for the book. Slimbach chose to use the tilde. That's 65 glyphs per font I have to change...the book uses 3 fonts, roman, italic, and bold...</p>
      <p>I've seen discussions on Vietnamese diacritics where it seems many representations aren't correct, including Adobe &amp; SIL ...</p>
      <p>In short, there are no completely right answers. It is better, I think, to pick the languages you are going to support, and get informed. For the rest of the languages, just populate the combining diacritics and let the end user take it from there.</p>
