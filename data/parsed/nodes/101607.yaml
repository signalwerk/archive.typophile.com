  html: <p>Regarding combining characters, is it the job of the display engine to position them correctly over the base character, or should the typeface designer use a negative advance width?</p>
  html_clean: <p>Regarding combining characters, is it the job of the display engine to position them correctly over the base character, or should the typeface designer use a negative advance width?</p>
