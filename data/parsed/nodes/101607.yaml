    html: <p>These are OpenType Layout features. The {mark} and {mkmk} features are dynamic glyph positioning features for, respectively, mark-to-base and mark-to-mark attachments. The {ccmp} feature is a glyph substitution feature that can compose combining mark sequences to precomposed ligatures (the same feature can also be used to decompose diacritic characters into combining mark sequences). In order to work, these features must be supported in the individual font and also implemented by the layout engine.</p>
