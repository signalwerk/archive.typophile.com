    html: |-
      <p>Well, kind of complicated. Start here. The combining diacritics should have zero width.</p>
      <p>Some layout programs will "automatically center" them -- except, of course, what's the center? And some layout programs won't. </p>
      <p>One tactic is to center the glyph -- so, for example, a circumflex has equal positive &amp; negative sidebearings, all with a zero width. That helps a layout program with automatic centering. Another tactic is to put the accent glyph all to the left --- negative right &amp; left sidebearings, again, zero width. How far to the left? Probably to balance with an "o", letting the a, e, dotless-i, and u be a little off, assuming a layout program that doesn't center.</p>
      <p>As the type designer, you can take over positioning by using mark and mkmk, or by using ccmp. There are pluses and minuses to each approach.</p>
      <p>As a typesetter, I'd say your first responsibility is to get them in the font, and with zero width. As long as you've done that, populate the spacing modifiers, too. That way, the syntactical integrity of the text file will be preserved. </p>
      <p>Further work on appearance comes through mark/mkmk or ccmp.</p>
