      <p>Yes, it's unfortunate, but since its a long legacy issue, it isn't likely to be changed, especially not now that there is a preferred mechanism (GPOS mark and mkmk positioning).</p>
      <p>BTW, the old Windows Hebrew engine works as you describe, with marks being centred on letter widths (and with some built in cleverness to shift them to the right for certain letters). So when making Hebrew fonts, the default mark position is usually optically centred on the zero-width.</p>
