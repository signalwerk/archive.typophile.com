      <p>Oh, from the design perspective I completely agree with you.</p>
      <blockquote><p>BTW, blindly centering an accent is not always the way to go.</p></blockquote>
      <p>I'm not saying it's great or ideal design, but from a programmer's perspective it's a reasonable first approximation. As a programmer myself, it's the kind of approach I'd take when building the layout engine, and that's kind of the angle I was taking in these posts. If someone on the programming side had done a better job long ago, it would have made a lot of designers' jobs a lot easier.</p>
      <p>Additionally, there's situations like these: ℻⃛ ⚜⃝ ♫⃟ ☣⃠ ⚾⃢. (OT, I just discovered one can't post SMP characters here.) With the even greater variance that is likely with these base characters, it's currently even more difficult to do these properly, but would have been easy with the simplistic approach I mentioned. Granted, these are going to be rare, but the only way to be sure they're reasonable is to use marks.</p>
      <blockquote><p>You're also sabotaging the potential of getting paid to add stuff...</p></blockquote>
