      <p>That's the other thing…many current layout engines <em>don't</em> have a sensible default—the default is to do nothing at all. This forces the designer to compensate.</p>
      <p>A simplistic “sensible default” would be align the center of the combining character with the center of the previous character. Probably would work fairly well in most situations, and I imagine it would be very easy to implement. But if you have to offset leftward for the braindead engines, now the smarter engines have to inspect the glyph outline to find its “center”.  I imagine they do this anyway for rasterization, so no big deal there, and if they care enough about typography to try to do combiners right there's a fair chance they'll implement the mark features.</p>
      <p>So more accurately, at a minimum I should provide zero-width left-offset (or right-, depending on the script) combiners so the layout engine can attempt to do some kind of sensible default, and if I want to take more control and have things look their best then I can utilize mark/mkmk/ccmp features in the font design.</p>
      <p>It's just unfortunate that combined characters are going to look suboptimal because we have to compensate for an unknown base character width, when a workable default could have been built in with little extra effort.</p>
