      <p>Free PPC font creation software: I think your only choice will be FontForge. There are some older versions with 10.4 PPC builds already in existence, which would be easier than building it yourself from source:<br>
      <a class="freelinking external" href="http://mac.softpedia.com/get/Font-Tools/FontForge.shtml" rel="nofollow">http://mac.softpedia.com/get/Font-Tools/FontForge.shtml</a></p>
