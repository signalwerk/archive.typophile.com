      <p>Me gusta esto mucho! Okeydokey...the MNVW letters seem too flat/wide in the joins. In the diagonal letters it is always a balance between making the joints too wide, or making the joints too dark. Wide joins can be part of the style, but here you have a mixed style. The A join is so wide that is has a very big "trap" at the apex. The MNVW, are just wide. Consider adding this trap to the MNVW too, or solving it by making the joins narrower. </p>
      <p>Also, the diagonal of the N is too thin to me. Consider making the diagonal thicker, and if needed, the verticals a little thinner.</p>
      <p>Sorry, no tengo palabras de tipographia en espanol.</p>
      <p>Ahora, tiempo por mimis...<br>
      zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz</p>
