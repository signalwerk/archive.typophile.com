      <p>César, te debo unos comentarios más detallados, pero puedo decir: es una tipografía preciosa, solo noto (en un relevamiento veloz) dos cuestiones referentes a la contraforma:</p>
      <p>1. en la palabra "ahorro" creo que el espaciado entre las dos "r" debería de ser un poquitín mayor... si comparo el espacio "rr" con el espacio "ro" me da como que faltara un poco de blanco en el primero.</p>
      <p>2. algo similar me ocurre con las palabras "transmilenio" y "TRANSMILENIO" referido a las "s" y "S" en ambas me da la sensación de una separación apenitas mayor de la necesaria, como que las veo un poco separadas de la palabra.</p>
      <p>Y 3. que lo veo ahora hay algo de eso en la palabra "caos" como que me queda la "ca" por un lado y el "os" por el otro, es apenas también.</p>
      <p>La seguimos por aquí o por allá! abrazo!</p>
