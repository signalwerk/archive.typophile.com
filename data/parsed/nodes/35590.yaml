  date_raw: 31 Jul 2007 — 12:12pm
  votes: null
  html: "<p>Urbana wants to be a contemporary sans-serif typeface inspired in the traditional lettering seen in one of the most popular, massive transportation mediums available in Bogotá (Colombia): \"busetas\" (small city buses). A mixture of influences reminiscent of modernism, hand lettering, cluttered spaces and improvisation are the source of its characteristic forms. Urbana wants to save space and catch the reader's attention at the same time. All of your comments are very welcome.</p><div class=\"imageWrap\"><img src=\"http://typophile.com/files/muestra urbana 4_4484.gif\"></div><p></p>"
