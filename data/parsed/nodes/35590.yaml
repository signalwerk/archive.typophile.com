      <p>Very nice typeface! Is it up for sale?</p>
      <p>I have to say about English vs other languages: English was the original language here at typophile and all posts should be kept in English. If there is interest for a Spanish Typophile that should be on a different url (www.typophile.(something)). Considering the people that only speak Spanish are not going be able to take part in any English threads and vice versa there will only be a divide. I myself am Norwegian and English is definetly not my first language. I have many gramatical mistakes in my posts but that doesn't stop me. There is not one person in here that's gonna judge you for trying to write in english. People are just happy to have a mix of people in here with different backgrounds. That's what makes Typophile great. Having said that; there are a lot of people in this world who only speak spanish and it would be an idea to make a Spanish site for them (sooner or later it will definetly have to be a Chinese site as well). The Spanish speaking Typophiliacs can then decide whether to post at the english site or the spanish site depending on the relevance of the topic for the different groups. The community would not separate but just be more organized. Posters that speak both fluent Spanish and English would still post and translate anything of importance on both sites.<br>
      Maybe I should start up a Norwegian/Scandinavian Typophile division...? Nahhh We are only about 20 million people up North (Danes Swedes, Norwegians and the few Finnish that still speak Swedish). I'll stick to the .com site;-)</p>
