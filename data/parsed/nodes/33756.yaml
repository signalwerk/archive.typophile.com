    <p>Hello typophiles.</p>
    <p>I was struck by the phrase "marshalling your twenty-six soldiers of lead" in Vincent Steer's <em>Printing Design &amp; Layout</em>. Googling it has mostly thrown back the quotation "With twenty-six soldiers of lead I can conquer the world" variously attributed to Karl Marx, Anonymous, William Caxton and Benjamin Franklin.</p>
    <p>Could anyone here tell me who in fact coined the expression or offer any other details?</p>
    <p>Thanks.</p>
