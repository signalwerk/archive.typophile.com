      <p>In Germany we say:<br>
      "Mehr als das Gold hat das Blei die Welt verändert,<br>
      und mehr als das Blei in der Flinte. das Blei im Setzkasten."</p>
      <p>More than gold, lead changed the world,<br>
      and more than the lead out of a gun the lead of a typestter's case did it.</p>
      <p>(sorry for my poor translation).</p>
      <p>Georg</p>
