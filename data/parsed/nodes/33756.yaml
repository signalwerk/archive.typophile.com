      <p>“That dramatic statement is French in origin, and (as they say) of a certain age –&nbsp;which means, here as always, of an uncertain age. Who said it, and when? Was it a village-bound boaster with a sudden and wonderful revelation of the dramatic spirit? Or was it in very truth a conqueror of men’s minds?<br>
      Let those who know further tell us. Let the birthplace of his aunt, the recollections of his schoolmaster, the intrigues which gave him his start in life, let his habits in face of the bottle (to which he was wont to ascribe so musch of his success or failure), his taste in cigars, or sword-hilts, or politics, or religion – let all be left unknown and ungathered. For whoever he was, however he prospered, he said and he did (I'll be bound) nothing else that could justify the sublime arrogance of that declaration – ‘with twenty-five soldiers of lead I have conquered the world’. Anything more of his were a derogation from that assertion, or a flat denial, or (worst of all) a jest thrown at it –&nbsp;a very profanation of his moment of divinity”</p>
      <p>Francis Meynell, Typography, Pelican Press, 1923</p>
      <p>The number indicates that it is a mid-17th century quote, possibly 1640 (again, according to Meynell). Taken from Typographers on Type edited by Ruari McLean.</p>
      <p>Tim</p>
