  html: |-
    <p>The Apple Macintosh OS 10.x allows one to assign a keyboard shortcut to “start speaking text”,<br>
    but will not it allow one to assign a keyboard shortcut to “stop speaking” (text).</p>
    <p>Just curious if this is true for everybody’s Mac...or if Apple’s got a wormy one just for me. ;)</p>
    <p>Cheers!</p>
