    html: <p> Really nice work! <br>I'd like to see how this would look as a normal face (full size scaleable). It sure looks handsome.  <br> <br>There was mentioned the smallcaps and lowercase 'z' falling out in relation to the rest of the typeface, I have the same feeling towards the smallcaps and lowercase 'x'. When looking at the 'x' it seems too wide. <br> <br>It is by far a richer 8-bit character set i've seen and looks promising. <br> <br>(By the way..im new here and will watch out this space as I'm working on several character sets myself and would like some constructive and qualified critique when I feel the time is right for it.) <br> <br>Good luck!!! <br> <br>Yours, <br>Sbo </p>
