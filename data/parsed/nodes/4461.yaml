  html: <p>Although there seems to be an embarrassment of riches as far as bitmap fonts are concerned, I've decided to have a go at making one. It's called Hawthorn; there is a regular U&amp;LC font and one with small caps instead. Crit? <br> <br><img src="http://www.typophile.com/forums/messages/29/344.gif" alt="Hawthorn sample"></p>
