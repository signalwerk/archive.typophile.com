    html: <p> You've nailed the small caps in relation to the the U&amp;lc. Many fonts out there use a 'unicase' approach for variety (including one of my own), whereas you've created something much richer. <br> <br>I wouldn't be concerned about the "embarrassment of riches" in terms the number of bitmap faces out there. The majority of them could only be called alphabets--with no attempt at serious punctuation, let alone international characters. Kudos for that. <br> <br>//joe </p>
