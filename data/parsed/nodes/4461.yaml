    html: <p> Jack, <br> <br>If this is your first attempt, I'd say you have an excellent specimen. I especially enjoy the small nuances like the lowercase "l" and the "a". The lowercase and smallcap "z", however, seem out of place, probably due to the rounded angles. (I recognize the constraints you face when you get that small.) <br> <br>What can you share about your design process? Did you build it directly in a bitmap editor or did you draw it pixel-for-pixel in Photoshop? <br> <br>jb </p>
    html_clean: <p> Jack, <br> <br>If this is your first attempt, I'd say you have an excellent specimen. I especially enjoy the small nuances like the lowercase "l" and the "a". The lowercase and smallcap "z", however, seem out of place, probably due to the rounded angles. (I recognize the constraints you face when you get that small.) <br> <br>What can you share about your design process? Did you build it directly in a bitmap editor or did you draw it pixel-for-pixel in Photoshop? <br> <br>jb </p>
  - id: 142515
    user: 1203
    date: 2001-09-07T10:36:00
    date_raw: 7 Sep 2001 — 10:36am
    votes: null
    html: <p> Mmm, you know, you're probably right about the Z's... I thought they seemed a little "off" while I was making them but I didn't think of any other way they could look. <br> <br>First step in the design process was Photoshop at 1600% zoom with a one-pixel pencil/eraser, for quick experimentation and such. Then in Fontographer I used the rectangle tool in conjunction with snap-to-grid to recreate the shapes as outlines. <br> <br>Designing this font, I am constantly beset with fear that I'm unwittingly plagiarizing other people's work, but I suppose when one is designing a five-pixel high "E" there are only so many possibilities available. The one character I'm fairly sure is unique is the lowercase Y; but maybe I just haven't done enough reading... <br> <br>And yes, this is the first "draft" of the typeface. </p>
    html_clean: <p> Mmm, you know, you're probably right about the Z's... I thought they seemed a little "off" while I was making them but I didn't think of any other way they could look. <br> <br>First step in the design process was Photoshop at 1600% zoom with a one-pixel pencil/eraser, for quick experimentation and such. Then in Fontographer I used the rectangle tool in conjunction with snap-to-grid to recreate the shapes as outlines. <br> <br>Designing this font, I am constantly beset with fear that I'm unwittingly plagiarizing other people's work, but I suppose when one is designing a five-pixel high "E" there are only so many possibilities available. The one character I'm fairly sure is unique is the lowercase Y; but maybe I just haven't done enough reading... <br> <br>And yes, this is the first "draft" of the typeface. </p>
