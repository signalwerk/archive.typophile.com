    html: |-
      <p>Is it as simple as swapping out the shape in the k/K glyphs' positions in the font for the one you want to use? The way one could use a single- or double-story a or g depending on the typeface's design?</p>
      <p>It'll appear as a k/K in any other font, but looks like the alternate version in the one you'll create. That way with the new font you'd never <em><strong>see</strong></em> a k or K, just the shape you want in its place. No code, it's just part of the font. Also, <em>any</em> text viewed in this new font would always have the k/K replaced as well.</p>
    html_clean: |-
