      <p>I’m not sure if I understand what you want to do. For web applications, you can easily substitute a letter for another letter but the actual Javascript (or server side) code  would never reside in the font file. </p>
      <p>The most common coding language used in font files is called Opentype. It’s the only one with broad application support. With OT you can easily substitute one glyph for another for use in text editors and word processors that support it using for example contextual alternates.</p>
