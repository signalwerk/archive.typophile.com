    html: |-
      <p>A language using only k's?</p>
      <p>Clauses lists all (well, a lot of) typographic and etymologic variants of the Latin letter 'k'. I recognize <a href="http://en.wikipedia.org/wiki/Kra_(letter)" rel="nofollow">Greenlandic 'kra'</a>, K with cedilla, K with hooked top (probably for African orthography), k with caron, Cyrillic K with and without bar and line. Greenlandic 'kra' has a note it's really more a of a 'q' -- how does that fit? Ban 'q' as well?</p>
      <p>In chemistry, the capital letter "K" is used to indicate potassium ("Kalium"). In phonetics, the upside down 'k' is used to indicate a velar click. In physics, the small letter 'k' denotes the Boltzmann Constant. Same problem, same solution?</p>
