  html: |-
    <p>I am a newbie to font development and need some help.  </p>
    <p>I have a need to have a font where part of it needs to be in javascript.  Actually one letter only, is there a possibility to put javascript letter within a font?  Though if technically it is not possible with only 1 letter then a total javascript font.  Thus is a total font in javascript possible?</p>
    <p>This letter क on the posting, is it in javascript, can the k/K on a font be removed and this क javascript be put instead?  This will allow users to type with this javascript on text editors or wordprocessors that allow javascript any internet content that can then be copy/pasted.</p>
  html_clean: |-
    <p>I am a newbie to font development and need some help.  </p>
    <p>I have a need to have a font where part of it needs to be in javascript.  Actually one letter only, is there a possibility to put javascript letter within a font?  Though if technically it is not possible with only 1 letter then a total javascript font.  Thus is a total font in javascript possible?</p>
    <p>This letter क on the posting, is it in javascript, can the k/K on a font be removed and this क javascript be put instead?  This will allow users to type with this javascript on text editors or wordprocessors that allow javascript any internet content that can then be copy/pasted.</p>
