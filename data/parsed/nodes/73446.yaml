    html: <p>This is a job for a browser extension/plugin. It can probably be accomplished be with a Greasemonkey script but you'd probably want to develop a custom extension for ease of deployment. Hire a qualified programmer to create extensions for whatever browsere are popular in your country. That way you can effectively filter most of the K's on the web. Making a custom font is a bad idea because you'd still have to write an extension to replace all fonts with this new font. Plus it wouldn't as well hinted, you'd need a monospaced version etc. An extension that simply swaps on letter would be easy to write, easy to deploy and would work on almost all web sites. Of course, you probably can't block a K in a bitmap or Flash but you can get most of them.</p>
