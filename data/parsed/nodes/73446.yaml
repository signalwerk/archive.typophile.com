      <p>I think this may be one of the dumbest things I've ever read.</p>
      <p>All this site does is say K IS BAD in badly written english (constantly using the word "alphabet" to describe one letter. An alphabet is an ENTIRE character set), and then cites a whole bunch of religious babble.</p>
      <p>On the "basis" page it states "Because the shape of alphabets can give meaning." That is completely incorrect. Letters were designed to be tautological (look it up.) They aren't supposed to reference any outside entity: they are meant to represent themselves (a grapheme). What you are thinking of are pictographs.</p>
    html_clean: |-
