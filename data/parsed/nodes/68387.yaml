    html: |-
      <p>Hi all!</p>
      <p>Thank you all very much for the great comments and ideas!! We need to discuss all this in our group, so I'll give a somewhat more detailed response later on. </p>
      <p>We had discussed using the font Insignia, but it appeared to much oriented towards art, not science. Especially with the "s" in the font of riccard0's example, the appearance is different. Block letters look somewhat too much like engineering, but that also probably depends a lot on the specific font that is being used. </p>
      <p>Sorry for the m-o gap. We knew the logo would need some work once we settle for a specific design, but it's very helpful to know where this work is most urgent.</p>
      <p>"i" is an abbreviation for "Instabilities" (we are not dealing with information in the sense used in computer sciences or with regard to databases).</p>
      <p>I'm looking forward to following, and participating in, the ongoing discussion.</p>
      <p>cschroeppel</p>
