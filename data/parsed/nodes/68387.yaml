    <p>Hi,</p>
    <p>I'm involved in designing a logo for a research group that is going to be established soon. The research is in a field somewhere between natural sciences and their application in engineering. It's about the opposite of an art exhibition or a virtual social network internet site, so there is not much room for eccentric ideas.</p>
    <p>There are now two basic choices, and slight changes to the design are still possible. Can anyone help me to decide between the two variants? Thank you!!</p>
    <p>A)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-block-4c_3647.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-block-sw_3627.png"></div><p></p>
    <p>B)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-right-4c_6191.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-right-sw_5746.png"></div><p></p>
