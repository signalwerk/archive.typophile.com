      <p>I’m afraid that you’re asking for a magic wand; a well-developed typesense is usually the product of years or school, or professional experience, or both.</p>
      <p>Nonetheless, a few handy tips:</p>
      <ol>
      <li>Don’t use Comic Sans.</li>
      <li>Don’t use scripts in ALL CAPS.</li>
      <li>Don’t use Old English-stype fonts in ALL CAPS.</li>
      <li>Match the typeface to the message..</li>
      </ol>
