    <p>I hope this is in the right forum, apologies if it’s not. Anyways:<br>
    I’m in my final year in school and starting work on the school yearbook. I’ve been somewhat involved with various school magazines/newsletters etcetera over the past few years, and one thing which has always seemed lacking is the choice of typeface. Does anyone have any suggestions for what typeface to use, for articles, headlines, captions and so on? I (as you’ve probably all guessed) have little experience in typography beyond picking from the drop-down list in MSWord, so this whole typography community is all a bit intimidating at the moment. How many different fonts should be used in any one publication? Should you use the same font for headings as in an article, or are there guidelines on which fonts work together well? Any suggestions (or links to “beginners guide to typography” or similar) would be much appreciated.</p>
    <p>Thanks,</p>
    <p>muirgheasa</p>
