    html: <p>I don't think Levon can find any working Armenian font as such. OS X doesn't support OpenType. Therefore .OTF fonts do not show in the font list of applications that use OS X text engine (like TextEdit) but they do show in font list of OT savvy applications like InDesign, running on OS X. I'm not sure what's up with MS Word. It might also be the case that the Mac version of MS Word doesn't support OT either. <br>.TTF fonts always show in OS X font list. But if they are enhanced with OT features, those features don't work with OS X text engine like in TextEdit. <br>If the features of a font are not supported in an application, it's a good idea not to have it listed in the font list.</p>
