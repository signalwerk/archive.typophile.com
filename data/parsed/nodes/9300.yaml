    html: <p>The font does not have any OT features. Actually it is only the basic Armenian character set (38 characters *2 + numbers + punctuation). The OT font appears in TextEdit and other programs, but when the "Armenian-Western QWERTY" keyboard layout is selected it makes no difference what font you select, it uses the system default Armenian font. I can understand that if the font has no Armenian in it. The problem is the same with the T1 font. <br> <br>When that same font, with no changes, is exported as TrueType, everything seems to work, although in the begining I had some difficulty. <br> <br>It does seem to be an OS issue. I was told that OS 10.3.5 (which I am using) has some problems. Maybe if I update the problem will be solved.</p>
