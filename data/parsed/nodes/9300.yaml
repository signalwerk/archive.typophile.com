    html: <p>Maybe it is not your case, but there is a bug with OTF files on OS X. The system cannot properly recognize OTF fonts until they have assigned type/creator properties (for example in FileBuddy application <a href="http://www.skytag.com/filebuddy/" target="_blank">http://www.skytag.com/filebuddy/</a>). OT fonts generated on OS X usualy works fine, but fonts copied from PC or downloaded from websites usualy must be corrected. I've found more info at <a href="http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions" target="_blank">http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions</a>. Those OT fonts work, but the OT features are not accessible from Adobe CS application and sometimes the font does not even appear in the font list at all.</p>
    html_clean: <p>Maybe it is not your case, but there is a bug with OTF files on OS X. The system cannot properly recognize OTF fonts until they have assigned type/creator properties (for example in FileBuddy application <a href="http://www.skytag.com/filebuddy/" target="_blank" class="link-external">http://www.skytag.com/filebuddy/</a>). OT fonts generated on OS X usualy works fine, but fonts copied from PC or downloaded from websites usualy must be corrected. I've found more info at <a href="http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions" target="_blank" class="link-external">http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions</a>. Those OT fonts work, but the OT features are not accessible from Adobe CS application and sometimes the font does not even appear in the font list at all.</p>
