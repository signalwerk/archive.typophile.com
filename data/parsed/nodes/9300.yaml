  html: <p>Hi, <br><br>I am having problems with some Armenian fonts that I did. <br><br>I am using FontLab 4.6 on <span class="caps">OS</span> X. <br><br>I would like to create Type 1 fonts, but it seems that <span class="caps">T1</span> does not support unicode. So I tried OpenType, but the <span class="caps">OS</span> does not recognize the font as Armenian. It works ﬁne in InDesign, but <span class="caps">MS</span> Word, TextEdit simply revert to the default Armenian font. <br><br>I created TrueType fonts and it worked, but I do not want <span class="caps">TT</span>, I prefer <span class="caps">T1</span> but <span class="caps">OT</span> is also acceptable. <br><br>Is there any way to make <span class="caps">OS</span> X accept the <span class="caps">T1</span> font as Armenian. <br><br><span class="caps">PS</span>. I also want to convert the font to be used on a <span class="caps">PC</span>.</p>
  html_clean: <p>Hi, <br><br>I am having problems with some Armenian fonts that I did. <br><br>I am using FontLab 4.6 on <span class="caps">OS</span> X. <br><br>I would like to create Type 1 fonts, but it seems that <span class="caps">T1</span> does not support unicode. So I tried OpenType, but the <span class="caps">OS</span> does not recognize the font as Armenian. It works ﬁne in InDesign, but <span class="caps">MS</span> Word, TextEdit simply revert to the default Armenian font. <br><br>I created TrueType fonts and it worked, but I do not want <span class="caps">TT</span>, I prefer <span class="caps">T1</span> but <span class="caps">OT</span> is also acceptable. <br><br>Is there any way to make <span class="caps">OS</span> X accept the <span class="caps">T1</span> font as Armenian. <br><br><span class="caps">PS</span>. I also want to convert the font to be used on a <span class="caps">PC</span>.</p>
