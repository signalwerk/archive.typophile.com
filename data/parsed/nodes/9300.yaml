  - id: 60175
    user: 5890
    date: 2005-02-18T17:24:00
    date_raw: 18 February 2005 - 5:24pm
    votes: 0
    html: <p>I don’t think Levon can ﬁnd any working Armenian font as such. <span class="caps">OS</span> X doesn’t support OpenType. Therefore .<span class="caps">OTF</span> fonts do not show in the font list of applications that use <span class="caps">OS</span> X text engine (like TextEdit) but they do show in font list of <span class="caps">OT</span> savvy applications like InDesign, running on <span class="caps">OS</span> X. I’m not sure what’s up with <span class="caps">MS</span> Word. It might also be the case that the Mac version of <span class="caps">MS</span> Word doesn’t support <span class="caps">OT</span> either. <br>.<span class="caps">TTF</span> fonts always show in <span class="caps">OS</span> X font list. But if they are enhanced with <span class="caps">OT</span> features, those features don’t work with <span class="caps">OS</span> X text engine like in TextEdit. <br>If the features of a font are not supported in an application, it’s a good idea not to have it listed in the font&nbsp;list.</p>
    html_clean: <p>I don’t think Levon can ﬁnd any working Armenian font as such. <span class="caps">OS</span> X doesn’t support OpenType. Therefore .<span class="caps">OTF</span> fonts do not show in the font list of applications that use <span class="caps">OS</span> X text engine (like TextEdit) but they do show in font list of <span class="caps">OT</span> savvy applications like InDesign, running on <span class="caps">OS</span> X. I’m not sure what’s up with <span class="caps">MS</span> Word. It might also be the case that the Mac version of <span class="caps">MS</span> Word doesn’t support <span class="caps">OT</span> either. <br>.<span class="caps">TTF</span> fonts always show in <span class="caps">OS</span> X font list. But if they are enhanced with <span class="caps">OT</span> features, those features don’t work with <span class="caps">OS</span> X text engine like in TextEdit. <br>If the features of a font are not supported in an application, it’s a good idea not to have it listed in the font&nbsp;list.</p>
  - id: 60176
    user: 1049
    date: 2005-02-18T17:57:00
    date_raw: 18 February 2005 - 5:57pm
    votes: 0
    html: <p>Armenian doens’t require any OpenType features so the diﬀerence between the <span class="caps">TTF</span> that works and the <span class="caps">OTF</span> that doesn’t should just be the form of the outlines — <span class="caps">CFF</span> instead of TrueType outlines. If the fonts are otherwise identical *and* work in InDesign I’d blame the <span class="caps">OS</span>.</p>
    html_clean: <p>Armenian doens’t require any OpenType features so the diﬀerence between the <span class="caps">TTF</span> that works and the <span class="caps">OTF</span> that doesn’t should just be the form of the outlines — <span class="caps">CFF</span> instead of TrueType outlines. If the fonts are otherwise identical *and* work in InDesign I’d blame the <span class="caps">OS</span>.</p>
