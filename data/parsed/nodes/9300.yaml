    html: '<p>I’m running 10.3.8 and when I installed an Adobe Pro otf font, it didn’t listed in TextEdit. This is an <span class="caps">OS</span> problem and may be due to overkill sophistication in font <span class="caps">ID</span> recognition… or simply a bug. <br>But try this: set the character set of your otf version to Western for <span class="caps">MS</span> and Roman for Mac Fond <span class="caps">ID</span>. See if your keyboard function properly with a make believe Roman font. I once did this with a PersoArabic font and it did the trick. Not an elegant solution but nontheless a&nbsp;solution.</p>'
    html_clean: '<p>I’m running 10.3.8 and when I installed an Adobe Pro otf font, it didn’t listed in TextEdit. This is an <span class="caps">OS</span> problem and may be due to overkill sophistication in font <span class="caps">ID</span> recognition… or simply a bug. <br>But try this: set the character set of your otf version to Western for <span class="caps">MS</span> and Roman for Mac Fond <span class="caps">ID</span>. See if your keyboard function properly with a make believe Roman font. I once did this with a PersoArabic font and it did the trick. Not an elegant solution but nontheless a&nbsp;solution.</p>'
