    html: <p>The font does not have any <span class="caps">OT</span> features. Actually it is only the basic Armenian character set (38 characters *2 + numbers + punctuation). The <span class="caps">OT</span> font appears in TextEdit and other programs, but when the “Armenian-Western <span class="caps">QWERTY</span>” keyboard layout is selected it makes no diﬀerence what font you select, it uses the system default Armenian font. I can understand that if the font has no Armenian in it. The problem is the same with the <span class="caps">T1</span> font. <br><br>When that same font, with no changes, is exported as TrueType, everything seems to work, although in the begining I had some diﬃculty. <br><br>It does seem to be an <span class="caps">OS</span> issue. I was told that <span class="caps">OS</span> 10.3.5 (which I am using) has some problems. Maybe if I update the problem will be&nbsp;solved.</p>
