    html: <p>Maybe it is not your case, but there is a bug with <span class="caps">OTF</span> ﬁles on <span class="caps">OS</span> X. The system cannot properly recognize <span class="caps">OTF</span> fonts until they have assigned type/creator properties (for example in FileBuddy application <a href="http://www.skytag.com/filebuddy/" target="_blank">http://www.skytag.com/ﬁlebuddy/</a>). <span class="caps">OT</span> fonts generated on <span class="caps">OS</span> X usualy works ﬁne, but fonts copied from <span class="caps">PC</span> or downloaded from websites usualy must be corrected. I’ve found more info at <a href="http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions" target="_blank">http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions</a>. Those <span class="caps">OT</span> fonts work, but the <span class="caps">OT</span> features are not accessible from Adobe <span class="caps">CS</span> application and sometimes the font does not even appear in the font list at&nbsp;all.</p>
    html_clean: <p>Maybe it is not your case, but there is a bug with <span class="caps">OTF</span> ﬁles on <span class="caps">OS</span> X. The system cannot properly recognize <span class="caps">OTF</span> fonts until they have assigned type/creator properties (for example in FileBuddy application <a href="http://www.skytag.com/filebuddy/" target="_blank" class="link-external">http://www.skytag.com/ﬁlebuddy/</a>). <span class="caps">OT</span> fonts generated on <span class="caps">OS</span> X usualy works ﬁne, but fonts copied from <span class="caps">PC</span> or downloaded from websites usualy must be corrected. I’ve found more info at <a href="http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions" target="_blank" class="link-external">http://www.underware.nl/site2/index.php3?id1=support&amp;id2=opentypequestions</a>. Those <span class="caps">OT</span> fonts work, but the <span class="caps">OT</span> features are not accessible from Adobe <span class="caps">CS</span> application and sometimes the font does not even appear in the font list at&nbsp;all.</p>
