    html: <p>The easy, although maybe not entirely legal, way to do this would be to load a working Armenian OpenType <span class="caps">CFF</span> font into FontLab and compare the character mappings, and codepage/Unicode bits with your font.  <br><br>Does seem strange that saving the font as <span class="caps">TTF</span> works but .<span class="caps">OTF</span> doesn’t — problem may be with the <span class="caps">OS</span> rather than the font. <br><br>Si</p>
