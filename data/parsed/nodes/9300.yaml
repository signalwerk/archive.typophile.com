    html: <p>The easy, although maybe not entirely legal, way to do this would be to load a working Armenian OpenType CFF font into FontLab and compare the character mappings, and codepage/Unicode bits with your font.  <br> <br>Does seem strange that saving the font as TTF works but .OTF doesn't - problem may be with the OS rather than the font. <br> <br>Si</p>
