  html: <p>Hi, <br> <br>I am having problems with some Armenian fonts that I did. <br> <br>I am using FontLab 4.6 on OS X. <br> <br>I would like to create Type 1 fonts, but it seems that T1 does not support unicode. So I tried OpenType, but the OS does not recognize the font as Armenian. It works fine in InDesign, but MS Word, TextEdit simply revert to the default Armenian font. <br> <br>I created TrueType fonts and it worked, but I do not want TT, I prefer T1 but OT is also acceptable. <br> <br>Is there any way to make OS X accept the T1 font as Armenian. <br> <br>PS. I also want to convert the font to be used on a PC.</p>
  html_clean: <p>Hi, <br> <br>I am having problems with some Armenian fonts that I did. <br> <br>I am using FontLab 4.6 on OS X. <br> <br>I would like to create Type 1 fonts, but it seems that T1 does not support unicode. So I tried OpenType, but the OS does not recognize the font as Armenian. It works fine in InDesign, but MS Word, TextEdit simply revert to the default Armenian font. <br> <br>I created TrueType fonts and it worked, but I do not want TT, I prefer T1 but OT is also acceptable. <br> <br>Is there any way to make OS X accept the T1 font as Armenian. <br> <br>PS. I also want to convert the font to be used on a PC.</p>
