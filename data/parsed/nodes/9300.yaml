    html: "<p>I was just advised that there are two sets of OTF fonts in system font folder of OS X. One, AquaKana is not listed in font list for TextEdit. The other one, Hiragino is listed and as far as English keyboard's concerned, it works just fine. (but of course there is no OT feature in it) <br>So you are right it's an OS thing. OS X do recognize OTF fonts though, but not all of them. The question remains what should be put into the construction of the font to make this possible. Is it a bug related situation or 'standard' related situation. <br>I'm not at that level, but Levon may be able to study the construction (information) iside these two fonts and draw the conclusion. <br>A hint: FontLab can not open fonts with Japanese name. You have to change the name of the copy of the font to something Roman.</p>"
