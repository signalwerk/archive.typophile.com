  html: |-
    <p>Is there any substantial reason against dropping the right-side serifs in the capital Thorn in bolder weights, rather than making the bowl really flat? How do Icelanders/Faroese feel about this? (Sorry if this has come up before, couldn't find anything.)</p>
    <p>Here's what I mean:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/thorn_5818.gif"></div><p></p>
    <p>This will obviously only be a problem where serifs are thick, contrast low to non existent (or reversed I guess), and target sizes below «huge».</p>
    <p>In the way of examples, I've found that <a href="http://myfonts.us/td-TqH6Mw" rel="nofollow">Dispatch</a> and <a href="http://myfonts.us/td-qzOoMW" rel="nofollow">ITC Officina Serif</a> use the serif-dropping approach, whereas for instance <a href="http://myfonts.us/td-Lhs89u" rel="nofollow">Rockwell</a> opts for thinning the serifs more than normal. I personally think that's rather ugly (and wouldn't work for all faces), but how attached are Thorn-users to their complete serifage?</p>
    <p>Also: I assume all capitals (uppercase, smallcaps, &amp;c.) in a given font/style should be treated the same? (The third weight above would work with the serifs in the cap, but not the smallcap, so I've removed them in the cap too.)</p>
    <p>Cheers!</p>
    <p><em>[Edited vicious typo. Sorry]</em></p>
