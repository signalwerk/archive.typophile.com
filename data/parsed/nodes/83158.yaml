      <p>This is a problem... and a pain... bah! </p>
      <p>In bolder weights it is sometimes not possible to make a reasonable Thorn without stripping off the serifs (as  much as I hate to). And often there is no space to make a bowl without making the whole character look like some kind of a big ink blob but that is what one would always try to first. </p>
      <p>The bowl does not have to be the size of the P bowl and often I rather watch the bowl of the R.</p>
      <p>And yes, please visit us at the ATypI in September.</p>
