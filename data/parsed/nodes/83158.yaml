      <p>People do all kinds of wacky things to letters as they get bolder and bolder.... Still, the best thing is probably to find a group of users of the glyph and to show them some options ins seal setting and see which ones work best for them. </p>
      <p>I suspect that the value of the serifs in making a rapid and correct ID of the letter is limited and that the clarity of the bowl and it's placement at the midpoint is the main thing. I can imagine loosing the serifs starting a a certain size to preserve what might be most essential. </p>
      <p>Nice question and a nice thread!</p>
      <p>I am curious to see if anyone else comes up with a still better solution.</p>
