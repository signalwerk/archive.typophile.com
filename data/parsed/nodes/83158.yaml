      <p>Thanks for the input all!</p>
      <p>Hrant, frankly I think I'm out of major «new» (i.e. not-tried-and-tested-before) ideas with this – for one thing, I don't have the time right now that I'd want/need for testing and asking people for feedback etc. Is there prior evidence of something like letting the Thorn descend working? </p>
      <p>To recap, the problem is that if I leave the serifs in, especially in the Bold Smallcaps (not to speak of Petite Caps) the bowl becomes quite deflated, which looks like it can't be right (and definitely doesn't look too recognizable). And since this is for smallish sizes, the serifs start nastily clogging against the top/bottom of the bowl long before. </p>
      <p>&gt; The bowl does not have to be the size of the P bowl and often I rather watch the bowl of the R.</p>
      <p>Good to know – thanks!<br>
      I'll try again to leave them in in the Demi and only drop'em in the Bold...</p>
      <p>&gt; Sounds like you should go to ATypI-Iceland! :-)</p>
      <p>Very sadly, I won't be able to, unless a number of miracles happen. :-/</p>
      <p>Edit: Nick, that does look good! But trying something like this for a wide face risks becoming a bit of a caricature...</p>
