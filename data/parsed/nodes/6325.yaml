  html: <p>Hello there. <br> <br>Is it somehow possible to activate ligatures in FreeHand MX in the same way as in InDesign CS? <br> <br> <br><img src="http://www.typophile.com/forums/messages/4101/47374.jpg" alt=""> <br> <br>And what about OpenType features in FreeHand MX? <br> <br>DD</p>
