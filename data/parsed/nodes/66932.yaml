      <p>I like the sans serifs from Martin Majoor, but not for my purposes (as a headline typeface for scientific texts). In my opinion they have too much character or better: show too much of it in taller sizes and so call the readers attention to themselves, but not to the message.</p>
      <p>at Weltin: Thank you for your remark. Agilita is a really nice typeface. It comes close to what I’m looking for and suffers—in comparison to Kievit— only the loss of a bit of clarity. It could be an alternative.</p>
