    <p>Hello,</p>
    <p>I’m a typographic layman, nevertheless interested in typography. My favorite serif typefaces are up to now Albertina and FF Scala.<br>
    I’m looking for a sans serif typeface that works well as a headline-font  with Albertina and Scala. The aim is to set scientific texts. But the typeface ought to work well for body text, too.</p>
    <p>My search led me to FF Kievit—a wonderful clear and neutral typeface. Now I’m looking for a typeface that is as clear and neutral as Kievit is, but that has other proportions (when this is the right word for it)—something like DTL Documenta Sans (has unfortunately only one weight), Scala Sans (in my opinion not as clear and neutral as Kievit, but with a wonderful italic like Auto 1 italic (by Underware), or DTL Caspari.</p>
    <p>DTL Caspari fits my image well, but I don’t like some of the details, namely relating to the baseline nonparallel endings of the strokes of some charecters (e.g. »A«, »K«, »V«, »W«, »Y«, »Y«, »k«, »v«, …, »y«). I guess I’m looking for something like Kievit with a smaller x-height respectively taller extender length.</p>
    <p>Thank you for recommendations!</p>
    <p>Kind regards</p>
    <p>Mario</p>
