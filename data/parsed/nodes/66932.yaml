    html: |-
      <p>Most of Martin Majoor's typefaces clearly show his own style, and are sometimes quite similar, but remarkably different in its details and execution. So maybe you can try another one of his typefaces, like <a class="freelinking external" href="http://www.martinmajoor.com/4_nexus.html" rel="nofollow">FF Nexus</a>, that also has a sans companion, for example. </p>
      <p>And I can vouch for FF Kievit. I own a license for it and use it quite extensively, mostly for extended text settings. Actually, I've set whole books with it. The same goes for FF Milo, which is somewhat alike Kievit and works equally well, but it has more quirky features. FF Milo was recently expanded with its own companion serif. A really nice one I might add. :)</p>
