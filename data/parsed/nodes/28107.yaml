      <p>Actually, I don't think that they can give you the font at all, at least under most EULAs. Rather, you need to license the font for yourself, even if you are only going to use it for just a little while! You're still using it, aren't you? A license is required for use.</p>
      <p>This takes us back to budgeting and billing… if a client requests that you use a font for the project, that license has to be paid for somehow. It is the same with the client. If he has 57 computers in his office, or 5700 computers, then he has a license for using the fonts on those computers. Unless he has a special license, that license normally won't allow him to install the font on another computer in an external location… that's what he'd be doing if he "gave" you the font (even for just a little while).</p>
