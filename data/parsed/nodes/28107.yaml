      <p>Good points, Dan.</p>
      <p>I agree that many of us view "building your own freelance type library" as just another business expense and thus we just encourage clients to license any fonts they wish to use on their own.</p>
      <p>I guess as far as "cost of goods sold" there's little difference between CS2, an Aeron chair, a new Mac Pro, and the latest H&amp;FJ release. But I just wondered how people felt about a) padding fees to cover font purchases or b) having the client license fonts, using them as an agent of the client and then deleting them, and then having them be able to use them.</p>
      <p>--M.</p>
