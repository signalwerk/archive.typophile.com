      <p>I suppose the next question (or perhaps the question Michael was getting at) is how common is it to build the price of 2 separate licenses into a contract (assuming, for this example, a single-user licence each for the client and designer)?</p>
      <p>Let's say a given font costs $50 for a single-user license (one location). The <em>designer</em> selects a font for use in a project (that he/she <em>doesn't</em> already have a license for) and the client agrees they like and want to use the font (and will need a copy for future use). Licenses for both the designer <em>and</em> the client now must be purchased. So, how common is it for the cost of <em>both</em> licenses to be built into the project price (either listed or buried)?</p>
      <p>I'm no accountant, but this decision seems to play into income/expenses. If the cost for the designer's license is built into the project fee, then the license can not be written-off as an expense (against taxes). If the license is <em>not</em> built into the fee, then it <em>can</em> be written-off as an expense. Obviously the better "deal" is to get the client to foot the bill, but that's my question really: How common is it to shove this expense to the client?</p>
      <p>[Edit: I just realized aluminum's reply directly addressed my query, but I'm still curious to hear from others...]</p>
      <p>[Edit: I've also just realized that regardless of how the contract is written up, it is still the designer who is paying for his/her own license, it's just a matter of charging more if the designer's license is built into the design project contract. In any case, the designer will need to hand money over for his/her own font license, and depending on whether they did or did not build that cost into the design contract they will be left with more or less of the contract fee at the end of the day. Therefore, it seems my question is totally moot. I can stop talking (typing) now...]</p>
