      <p>I think foundries should consider the same kind of student discount that other software companies offer: a reduced price with proof of enrollment. It's not a giveaway, the student who cares about having quality type can afford it, and the goodwill is in place for the student/new designer to continue purchasing from the foundry. Maybe the discount could continue for 1 year after graduation. I know I still couldn't afford type for a while after I graduated.</p>
