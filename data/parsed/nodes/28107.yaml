      <p>You could transfer your license to your client. But when you purchase the license, you are the one "buying" the font. You purchase the right to use it on your workstations, which you happen to use to creat work for your client.</p>
      <p>When you are done with the work, you could transfer your license to your clients, provided that the font's EULA allows this. Otherwise, your client would have to license the fonts on their own. If you transfer the license to your client, you—of course—loose the license, and must therefore delete your copies of the files.</p>
      <p>It is probably best just to have your client license their own copies of the fonts directly from the distributor; most clients will want to use the fonts onmore than 5 computers. If you bough a single license (i.e., for five computers), transfering that license to your client may confuse them, and they might think that they could do whatever they want with these fonts that they got from you (i.e., simply install it on 50 computers).</p>
      <p>If you build in font purchases into your client fees, that doesn't automatically give the client the rights to those fonts. They pay you a fee, which to two of you agree on. What you do with theat money is not their concern. If you use money a client pays you in fees to upgrade to the Adobe CS 2 suite, should you give the client those programs once the project is finished? </p>
      <p>Every designer must make sure that his fees are high enough to allow him to run his businness. Software licenses are a business expense. And fonts are software.</p>
