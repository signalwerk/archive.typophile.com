      <p>I was once a student and I do empathize with you James. So please don't take this as preaching. But the problem with giving students free fonts is that those same students do become designers and take those fonts they've "collected" at school with them to the agencies where they are hired. (I'm generalizing, but it is mostly true.)</p>
      <p>There are some foundries that do offer student discounts, or have student priced packs. But, very few foundries give fonts for free to students. One thing to keep in mind are the books such as <a href="http://www.p22.com/indiefonts/indieset.html">Indie Fonts</a> which have oodles of fonts in them that you can use. Many of the license with those fonts (if not all, I'd need to check to verify this) even allow commercial use. </p>
      <p>Another foundry, <a href="http://www.underware.nl/site2/index.php3?id1=fonts">Underware</a>, sell specimen books which contain the entire font which is shown in said book, and the license specifically says that students can use them. </p>
      <p>Keep your eye out for foundries that offer free downloads. <a href="http://www.fontshop.com/">FontShop</a>, for instance, offers a free font for download at least once a month.</p>
      <p>Our wiki has an entry dedicated to <a href="http://typophile.com/wiki/FAQ_Free">free fonts</a>.</p>
      <p><a href="http://fontleech.com/">FontLeech</a> has links to valid free fonts.</p>
      <p>The problem with anything free in life is that someone had to pay for it somehow. If a foundry offers a font for free, they still put the time in creating it. But, they also know that students are future business so I wouldn't avoid asking them. You never know, they might have student pricing.</p>
    html_clean: |-
      <p>I was once a student and I do empathize with you James. So please don't take this as preaching. But the problem with giving students free fonts is that those same students do become designers and take those fonts they've "collected" at school with them to the agencies where they are hired. (I'm generalizing, but it is mostly true.)</p>
      <p>There are some foundries that do offer student discounts, or have student priced packs. But, very few foundries give fonts for free to students. One thing to keep in mind are the books such as <a href="http://www.p22.com/indiefonts/indieset.html" class="link-external">Indie Fonts</a> which have oodles of fonts in them that you can use. Many of the license with those fonts (if not all, I'd need to check to verify this) even allow commercial use. </p>
      <p>Another foundry, <a href="http://www.underware.nl/site2/index.php3?id1=fonts" class="link-external">Underware</a>, sell specimen books which contain the entire font which is shown in said book, and the license specifically says that students can use them. </p>
      <p>Keep your eye out for foundries that offer free downloads. <a href="http://www.fontshop.com/" class="link-external">FontShop</a>, for instance, offers a free font for download at least once a month.</p>
      <p>Our wiki has an entry dedicated to <a href="http://typophile.com/wiki/FAQ_Free" class="link-lost">free fonts</a>.</p>
      <p><a href="http://fontleech.com/" class="link-external">FontLeech</a> has links to valid free fonts.</p>
      <p>The problem with anything free in life is that someone had to pay for it somehow. If a foundry offers a font for free, they still put the time in creating it. But, they also know that students are future business so I wouldn't avoid asking them. You never know, they might have student pricing.</p>
