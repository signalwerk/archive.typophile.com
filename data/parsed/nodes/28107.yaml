      <p>If you, as a graphic designer, are fortunate enough to have clients who will install the fonts in your design work on a multi-user network, then you should be able to acquire all the fonts you want, free of charge, on a "test purposes only" licence, from foundries such as my own. </p>
      <p>If the carrot is "my client will install the font family of my corporate design for them, on 500 terminals", I'll bite. Another beautiful feature of this arrangement is that you ask your client to license the fonts directly from the foundry: they appreciate that you aren't marking it up, and the foundry doesn't lose a percentage of the fee to a distributor.</p>
