      <p>Designers bill their overhead into their hourly rate. They also may bill line items purchased for that particular job. When you get a font and pay from your overhead, you are not giving the client your liscence to use it.  The client has purchased a completed job (brochure, book, whatever).  If you are establishing a corporate identity which will involve the client using the fonts directly, then this should be a line item cost for their own font liscence.</p>
      <p>ChrisL</p>
