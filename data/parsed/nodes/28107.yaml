      <p>I've missed the meat of this discussion. Dan answered all the questions as I would have. </p>
      <p>If you license a typeface to use in a project (with a non-transferrable EULA) then you must also instruct your client to license a copy if they have need to use the same fonts on given files, such as templates. This is how I do it. I don't hide the cost and I don't "pad" the project. Also, as Dan mentioned, most foundries do not have licenses which allow for transferring, so if you are going to go the route of licensing type, using it, sending to the client and deleting from your machine, make sure you are aware of this fact.</p>
      <p>When I license any type I see it as putting another tool in my toolbox which I'll more than likely be using again. I don't see it as something the client necessarily has to pay for. </p>
      <p>I do turn all of my font costs over to my accountant every year though.</p>
