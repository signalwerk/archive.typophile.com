      <p>Only a few minutes ago I posted a question which seems to be (partly) addressed in this thread, which got my attention just now. I’m new to Typophile, so excuse me for cross-posting. My question is under <a href="http://typophile.com/node/28180">http://typophile.com/node/28180</a>, probably the wrong forum as well. The second part has already been answered in full. I’d still like to hear your opinion on the first part:</p>
      <p>“Font licenses, in general, prohibit adaptation of the font files, and of the glyphs and artwork included therein. Furthermore, the user is not allowed to redistribute the font by embedding or packaging it into another format. Now, how could a logo designer use such a licensed font, if he’s supposed no to tweak nor adapt its glyphs so as them to meet the corporate identity with which the logo has to conform? Additionally, even if the glyphs were not to be modified, how could the designer supply his customer with ready-to-use .pfd, .eps, .tiffs, .jpeg files with the font glyphs embedded, or even converted into outlines?”</p>
