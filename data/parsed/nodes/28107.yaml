    <p>John Stahle's recent post in my <a href="http://typophile.com/node/28078" target="_blank"><em>"What are your pet peeves about common typefaces?"</em></a> thread got me thinking about the whole "who-ought-to-pay-for-a-freelancer's-type-library" thing...</p>
    <p>On the one hand, in the past I've built purchasing a family of faces into my fees for some of my freelance projects and then kept the fonts myself... That way I can achieve my design objectives, and I get to use the fonts in future freelance projects.<br>
       (Win-win for designer and client, of course.)</p>
    <p>On the other hand, I've also built purchasing a family of faces into my fees for other projects and given the fonts to the client along with the deliverables... that way I can achieve my design objectives, and the client gets to use the fonts in future in-house projects (to maintain some brand consistency). (I obviously can't just use these fonts in a future freelance project straight away.)</p>
    <p>Finally, on the other other hand (we could all use three!), I have plenty of experience where I've neglected to build purchasing a family of faces into my fees for a project, and then I had to eat the cost in order to achieve my design objectives.</p>
    <p>So what makes the most sense for a freelancer, a) economically, b) ethically, and c) creatively? Does a client who will pay your "font-inflated" fee deserve to own the fonts after the project? Or do you?</p>
    <p>Let 'er rip.</p>
    <p>--Michael.</p>
    <p>------------------------------------------------------<br>
    // love what you do or do something else. //<br>
    Michael Ebert -- graphic designer, jazz saxophonist, horror movie devotee<br>
    ------------------------------------------------------</p>
