      <p>A fee is something that a designer sets for himself, based on what he thinks he and his time is worth. Every designer will find some potential clients who find their fees too high. Certain market factors will probably always create an "average" hourly rate. A fee is also in part determined by what customers are willing to pay. But a designer does not have to explain why his fees are what they are. Image a client telling you, "I think that your apartment is too big. How about you move into a smaller place. Then you could cut your fees in half for me, right?"</p>
