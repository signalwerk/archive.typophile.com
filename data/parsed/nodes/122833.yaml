    html: |-
      <p>Answering on '2PACALYPSE' piece (thought like Don it could have been 'FEAR OF A BLACK PLANET' which probably set with <a class="freelinking external" href="http://www.myfonts.com/search/antique+olive" rel="nofollow">Antique Olive</a> BTW). For the rest, at this size, the 2 /A look different to me so I'd say "not-a-font/hand-done". Even if that sounds cliché, I'd probably have a look to some fonts tagged at MyFonts '<a class="freelinking external" href="http://www.myfonts.com/tags/graffiti" rel="nofollow">graffiti</a>', '<a class="freelinking external" href="http://www.myfonts.com/tags/tag" rel="nofollow">tag</a>' or '<a class="freelinking external" href="http://www.myfonts.com/tags/hip+hop" rel="nofollow">hip hop</a>'. DaFont <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=606" rel="nofollow">Graffiti section</a> is also worth a look. This lettering has also a '<a class="freelinking external" href="http://www.myfonts.com/search/comic" rel="nofollow">comic</a>' feeling so maybe having a look to <a class="freelinking external" href="http://www.myfonts.com/foundry/Blambot" rel="nofollow">Blambot</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Comicraft" rel="nofollow">Comicraft</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Canada_Type" rel="nofollow">Canada Type</a> and (My)Fonts tagged '<a class="freelinking external" href="http://www.myfonts.com/search/tag%3Acomic" rel="nofollow">comic</a>' would be useful too. Finally, I would also browse <a class="freelinking external" href="http://www.myfonts.com/foundry/Typodermic" rel="nofollow">Typodermic</a> and <a class="freelinking external" href="http://www.myfonts.com/foundry/PizzaDude.dk" rel="nofollow">Pizzadude</a> collections.<br>
      Following these tracks and without too much effort, I've found <a class="freelinking external" href="http://www.myfonts.com/fonts/pizzadude/show-no-shame" rel="nofollow">Show No Shame</a>, a Pizzadude font which looks not so far with its arced /A "à-la-<a class="freelinking external" href="http://www.myfonts.com/search/hobo" rel="nofollow">Hobo</a>".</p>
    html_clean: |-
