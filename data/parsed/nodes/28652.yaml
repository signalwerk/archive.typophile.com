    html: |-
      <p>The bad part thing about regular Flash testers is that it is very easy to convert the .swf to a .fla – and then you got a copy of all embedded letters. They are a little bit worse in the bezier curves of course, but still – it is rather easy to "steal" them, unfortunately.</p>
      <p>I would feel much better if the font was shown on the webpage using some other technique, like Thomas is mentioning. Some technique that produces gif’s or jpg’s instead.</p>
      <p>If anyone know anything more about this, please drop a few lines :)</p>
