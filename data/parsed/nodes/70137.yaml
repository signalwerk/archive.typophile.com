      <p>This is interesting! Any new progress these past few weeks?</p>
      <p>I can guarantee you that I am more of a noob than you, but I'll offer my comments anyway... just take them with a grain of salt.</p>
      <p>I do like the idea for the terminals, but I do think they could use some minor tweaking. I agree with cerulean's comments, but between the two options mentioned, I kind of prefer the former. I think you've just about nailed it with the terminal on the /r/. In my opinion, the curve appears to be sufficiently thin and at the correct angle as it meets the terminal. The /f/, /c/, etc. appear to be somewhat undecided....</p>
      <p>Do you plan on making a Roman for this, or will it be strictly Italics?</p>
      <p>Keep it up!</p>
