      <p>Let's address first the salient feature of the face, the square ball terminals, or block terminals I guess. I feel they fall between two preferable treatments: Either the stroke should be narrower where it meets the block, the inner curve being about halfway across, or the inner curve should turn all the way to meet the corner.</p>
      <p>The thins are extremely thin, and I would expect them to agree more with the weight of the serifs and crossbars.</p>
