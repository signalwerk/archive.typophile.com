    <p>This is a very quick and rough (very rough) draft of my typeface. I was just looking for feedback and everyones first impressions keep in mind this is my first typeface and I am relatively new to the process.  </p>
    <p>I have currently only done the lowercase just because I'm not 100% sure what direction I should be going in. I was going for an italic serif loosely based off of Bodoni and I tried to go with the Old style/ Transitional style. </p>
    <p>First impression, critique, technical aspects any comment will be helpful thank you. </p>
    <p>I'm really having trouble with c/e/f/y/k/s/ but of course I will take any advice on all or any of the letters.</p>
