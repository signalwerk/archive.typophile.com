    <p>Hello all,</p>
    <p>Please help, I'm looking for the long lost "monotype Corsiva" twin sister :)</p>
    <p>I've attached the original letter, the Corsiva example, and a superimposed one.<br>
    Please note the letters have been stretched, yes, but even stretched, the Corsiva does not match 100% : the leg and foot are different.</p>
    <p>Anyone up for this challenge ?<br>
    Sandra :)</p>
