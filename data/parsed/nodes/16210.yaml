  html: |-
    <p>Hi all,</p>
    <p>I'm doing some modeling in Max, creating some childrens' letter blocks for a scene, and I'm not sure as to what font to use for the "letters".</p>
    <p>Here is an image of the letter blocks I'm referrencing:</p>
    <p><a href="http://www.bbc.co.uk/parenting/images/300/letter_blocks.jpg" title="http://www.bbc.co.uk/parenting/images/300/letter_blocks.jpg">http://www.bbc.co.uk/parenting/images/300/letter_blocks.jpg</a></p>
    <p>Any ideas what font that might be - or a font that would be a close simile?</p>
    <p>Thank you so much for your help</p>
    <p>Dodge</p>
