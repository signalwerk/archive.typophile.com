    <p>Hey, Typophile community, this is my first post here(Oh goody). I've been doodling these glyphs on and off, finally made an alphabet and a digital rendition. These haven't been vectored, or anything near it yet, I'm primarily working on letterforms right now.</p>
    <p>Suggestions and crits? I'm very new to this, I've made one font prior to this and it was somewhat a disaster. So, this is my second font in the works. Cheers to this being better than <a class="freelinking external" href="http://www.fontspace.com/unhinderedreams/vaguely-fatal" rel="nofollow">Vaguely Fatal</a>.</p>
    <p>Uppercase draft(Blue is possible revision.)<br>
    <a href="http://i51.tinypic.com/35ddmxl.jpg" title="http://i51.tinypic.com/35ddmxl.jpg">http://i51.tinypic.com/35ddmxl.jpg</a></p>
    <p>Lowercase draft<br>
    <a href="http://i55.tinypic.com/j7xaur.jpg" title="http://i55.tinypic.com/j7xaur.jpg">http://i55.tinypic.com/j7xaur.jpg</a></p>
    <p>I'm very open to suggestions/critique! :)</p>
