    html: |-
      <p>Litera: Yeah, I can see that about the weights. </p>
      <p>I agree with you about the /g/, I've yet to design what to do with /g/'s tail yet, whether turn it into an eyeglass /g/ or keep it in the same style, but more balanced.</p>
      <p>/l/ is another character that didn't quite turn out how I'd envisioned it. I'll probably straighten out the /l/</p>
      <p>Working at fixing the bowls, I actually know which direction I'm going with the bowls; that is, more rounded bowls.</p>
      <p>Yeah, I see that as well, I thought it might have worked, it seemed an idea worth trying although it doesn't look as good as I'd hoped.</p>
      <p>My intentions for this font are to create a somewhat playful sans-serif, playful but crisp and clean(no weird wobbles). I'd like it to have capabilities to be used at relatively small sizes and still maintain itself, it's kind of held up with the letters as they are, though they're quite...well. As you said, they need work. I'd also like it to be a professionally acceptable font, which it isn't at all at this point.<br>
       The fonts that  partly inspired this are <a class="freelinking external" href="http://www.dafont.com/steiner.font" rel="nofollow">Steiner</a>, <a class="freelinking external" href="http://www.ffonts.net/tag/0/euphemia" rel="nofollow">Euphemia</a>, and the slab-serif font, <a class="freelinking external" href="http://new.myfonts.com/search/Memphis/fonts/" rel="nofollow">Memphis</a>.</p>
      <p>Critically speaking; I like the thought of a "playful sans-serif"(I consider Euphemia slightly playful) and base idea, execution so far isn't all that I'm wanting it to be. I'm unhappy with the wobbles and weight inconsistencies primarily, next to widths of characters being somewhat haywire. I'm aiming at a font that's professionally acceptable(As far fetched as that sounds, it's a goal), and I don't feel I'm making that right now. I believe this has potential, needs polished a lot though.</p>
      <p>Software wise I use FontCreator 5.6 . I'm still new to the program right now, I've used it only a handful of times, cleaning up initial glyphs has taken the most amount of time so far next to playing with kern.</p>
