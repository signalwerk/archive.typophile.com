      <p>Based on the fonts you mentioned (mostly geometric) and even though you mention playfulness I think this is a very rough start and there's a lot of work in front of you. Your glyphs don't look geometric at all. As of yet.</p>
      <p>I suggest you first get acquainted with the software you're using to produce some nice flowing glyphs and only after you know how to properly use your tools start developing a usable font.</p>
