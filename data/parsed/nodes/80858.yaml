      <p>1. Well individual characters have different weights.<br>
      2. /g/ is severely unstable (falling to the right)<br>
      3. /l/ seems left slanted because of the long bottom curve<br>
      4. some bowls are square-ish others round...<br>
      5. I don't think those tall points on /ij/ are working (bit too tall)</p>
      <p>The thing is it's hard to say anything about this design because we don't know your desired intentions with this font. Maybe all the upper observations are desired. Maybe not. Maybe your font should be formal and with great finish detail or maybe wobbly.</p>
      <p>Of all the letters so far I like /a/ the most (even thought it needs lots of work). It's bowl shape is particularly interesting. But unfortunately I can't say the same about any of the other letters. They don't even seem to complement each other.</p>
      <p>This is a rough start.</p>
      <p>What software do you use anyway?<br>
      What do you think of your own font (be critical)?<br>
      What are your intentions with this font?</p>
