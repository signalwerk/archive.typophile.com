    <p>Hello all.</p>
    <p>I'm looking for a display face. Something probably similar to a normal roman text face, but with a bit of quirky personality. Or, something entirely different from a normal text face.</p>
    <p>It is for the title page and cover of a novel. I was using Andreas Stötzner's Reinstaedt for a while, but the author wasn't going for it (this is for a self-publishing client). The title is three short words connected by hyphens, with a questions mark. For the sake of keeping the title off the web for the time being, I'll pretend it is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_title_6539.png"></div><p></p>
    <p>The "novel" is really a collection of short stories about all sorts of different characters in different places discovering what they want their life's mission to be. In every case, though, this mission is something quirky, strange, trivial, or funny.</p>
    <p>The text is set in Garamond Premier Pro. Throughout the book there are pages of simulated magazine cutouts in a smorgasbord of fonts. There is also a recurring "cut edge" motif, as if some pages were roughly cut with scissors, mirroring the "cutouts" from magazines.</p>
    <p>So — any suggestions?</p>
    <p>Thanks!</p>
