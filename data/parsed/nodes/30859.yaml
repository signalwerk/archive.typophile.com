  - id: 180658
    user_id: 569
    user_name: Corey Holms
    user_path: null
    date_raw: 26 Jan 2007 — 8:39pm
    date: 2007-01-26T20:39:00
    votes: null
    html: |-
      <p>[EDIT] - I just posted this as the finished article, I forgot to mention that it was written for Grafik Magazine and I'm sure there are some legal protections that I should disclose, but don't know.</p>
      <p>- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -</p>
      <p>	It’s funny how a typeface that has disappeared from standard usage for so long has re-emerged into popular interest due to several factors including something as simple as a mere mention in the book “8vo: On the Outside.” There is a culture of obsessive designers, such as myself, that feel the need to track down new and forgotten faces as they become known. The search for hard-to-find typefaces has become a topic of interest on many design forums and blogs, with many trying to ascertain where the typefaces are available. Interestingly enough, as I began to delve into the mystery that is Haas Unica, I came across a tale of intrigue that continues to this day.</p>
      <p>	Let’s start at the beginning, as we attempt to recreate the set of circumstances that has led to the shelving of this typeface. Swiss national André Gürtler designed Haas Unica along with a group titled Team’77 (comprised of Erich Gschwind and Christian Mengelt) in 1980. It is a grotesk typeface that follows in the tradition of Helvetica, but with several changes. According to the Team’77 promotional publication titled “From Helvetica to Haas Unica,” the face was created after close examination of Helvetica and similar grotesk typefaces in the attempt to correct optical and rhythmical irregularities. Although the group’s professed interest in the readability of the typeface and their intent to create a face that meshed with current typesetting technology does seem to be genuine, there do seem to be a few other possibilities as to why Haas decided to pursue this re-issue.</p>
      <p>	As I discussed this missing typeface with type historians and aficionados, I found that Helvetica was originally a Haas type foundry project titled Neue Grotesk designed by Max Miedinger. Stempel, the parent company of the foundry decided to change the name to Helvetica to market it to German businesses, re-issuing it through Linotype. All grotesks up to this period had been designed to be used as metal type that took up a specific amount of space when typeset. Because of the technological advances available through the use of photo-typesetting, innovative and experimental type composition and even plain misuse became rampant. This wave of irreverence to the original faces led many traditional typographers and publications to start campaigns against Helvetica, the controversy further increasing the popularity of the face. Some of those I discussed the face with hinted at some slightly less altruistic reasons for the emergence of Haas Unica. Possibilities include Haas attempting to reclaim the mantle of the most popular grotesk typeface, down to the most basic of motives, that of taking advantage of the increase in popularity of this type of face.</p>
      <p>Regardless of the reasons behind the creation of Haas Unica, there is no doubt that it is an improvement over Helvetica, and Team’77’s stated aims seem to have been met.</p>
      <p>	Although at one time, Haas Unica was available as a PostScript font (by two separate type foundries, no less), sadly it is no longer commercially available. At the time of its creation, Germany was a hotbed of innovation in type technology, and typefaces were being scanned and redrawn digitally. Scangraphic Imagesetters possessed an internal drum imaging system whose precision was unrivalled in the industry, and were the first company to make high-resolution phototype scans available to the PostScript market. At the same time URW owned the Ikarus system designed by Peter Karrow which was the first program to convert raster images to outlines, and allowed them to create fonts that were available for computer use. Because there were thousands of typefaces that people wanted to have converted from phototype to PostScript, Scangraphic and URW began a collaboration that created the original conversion of Haas Unica to computer-ready type. This explains why two digital versions of the face were available, one through Scangraphic, and the other through Font Company, whose fonts were manufactured by URW. Although some believe that these two sets were created separately, it seems most likely that they were created from the same Ikarus data, and are therefore identical – especially considering Karrow was able to retain the reselling rights to all typefaces he digitized.</p>
      <p>Scangraphic’s Digital Type Collection (which included Haas Unica) was purchased by Elsner + Flake in 2003, to which they added font-specific Euro and @ symbols in 2004. The revamped typeface was set to be sold by Scangraphic and its distributors, but Linotype is currently preventing the release, citing trademark violations. Although similarities to other typefaces often occur between foundries, it is rare that one finds typefaces that have been shelved indefinitely due to such resemblances. In truth, the real problem lies within a dispute over who owns the name Haas Unica, rather than any resemblance infringment. </p>
      <p>In any case, it is truly a shame that this wonderful typeface has been boxed up with scores of other forgotten phototype into a warehouse, not unlike the Ark of the Covenant at the conclusion of “Raiders of the Lost Ark,” never to be seen again.</p>
