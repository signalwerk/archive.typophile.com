      <p>Your welcome &amp; Thanks too! Wow, that set of examples is great!! But to me this doc doesn't seem like hyper-rationalism any more than any promo document that says this font is a step foreward because of X-factor/s. Then again the text that goes with the comparisons could be telling. </p>
      <p>I think that with the modernist urge alive &amp; well in them &amp; in their buyers they might have thought - perhaps correctly - that all the precise measurements would make it seem like they were the Helvetica masters. </p>
      <p>I do remember ham-handed promotion of all kinds of things; stereos for instance, where the specifications were trotted out with a great deal of fanfare. This much 'wow &amp; flutter' on a tape deck. etc. Know what I mean? It think what your getting at may have been generalizable to the decade/period rather than to these folks' actual approach to making type. </p>
      <p>But perhaps your right. I need more context to know. </p>
      <p>Talking to him I get the sense that his approach is strongly pragmatist like the majority of type makers. It might have been different then too. Hard to know for sure.</p>
