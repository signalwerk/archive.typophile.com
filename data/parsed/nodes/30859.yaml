      <p>There is a class of type designer that doesn't like to see thought go beyond a certain level of detail when it comes to forming glyphs. Unica is an extreme case of "rationalized" design, as detailed so well in the document by Team77. I'm wondering how Gurtler might be inclined to elaborate on that conflict, how he might defend (or possibly recant) the way in which Unica was designed.</p>
      <p>hhp</p>
  - id: 180516
    user_id: 2942
    user_name: ebensorkin
    user_path: null
    date_raw: 26 Jan 2007 — 11:32am
    date: 2007-01-26T11:32:00
    votes: null
    html: |-
      <p>Hrant, talking to him today ( 5 min ago )  I asked him about Hass Unica being 'rationalized' and he said that all the sans serifs from Univers to Helvetica have a certain stylistic tendency towards 'rationality'; so of course Haas Unica fits into that too by virtue of the style in the question, but that where Haas Unica is different is that it is the most fluid and warm of the many kinds of Helveticas and so it is the most agreeable. I am paraphrasing to a certain extent here. But I think that was the gist of it. By rationalized maybe you are refering to what he called unity - having not seen the face properly perhaps this could be a 'regularity' of forms?</p>
      <p>I asked him about Working in Mexico today and he said he felt that the students were more enthusiastic there and he enjoyed that.</p>
      <p>I also asked him about Basilia and the constraits of making type for photo process. I asked this because thinking about the faces that have been made for specific optical sizes Basilia looked to me like it would be optimal at maybe 24-40pt or something. It didn't look to me like it would hold up at 9pt at all. So I asked him if he had in mind a text face, a display face or something inbetween making reference to the constraints of designing for optical systems. He said that it was tricky to design for optical and that the one of hardest parts was getting the spacing between gyphs to be okay at multiple sizes. This makes TONS of sense if you think about it. But he said that he had intended Basilia to be for text unreservedly. And if it could be used for display that was a bonus. Agian some paraphrasing there. Looking at Basilia more I am really struck by how much I like it.</p>
      <p>Nicholas, in this case I think it's better to ask a question relevant to the specific designer's carreer. You can ask general questions here on typophile and get very good answers from many people. </p>
      <p>I will ring him again in a few days so if anybody thinks of something they would like to ask let me know.</p>
