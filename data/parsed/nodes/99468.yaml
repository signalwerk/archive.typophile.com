    Created by veteran Sign Painter, Bruce Bowers and Lettering Artist, Charles Borges de Oliveira. Mocha Script boasts over 243 characters which includes alternates, ligatures and special end characters which allows the Designer to create a magnitude of variations of letters to produce unique hand lettered words. Enjoy!<p></p>
