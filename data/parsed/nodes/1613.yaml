    date: 2003-10-13T11:51:00
    date_raw: 13 Oct 2003 — 11:51am
    votes: null
    html: <p>I'd like to add that I was the person responsible for digitizing Hairpin for the Image Club library back in 1989 from a set of original VGC photo-typositor film reels. I still have numerous older versions of the Letterpress product in the Image Club archives should anyone be interested in obtaining a copy of the older Image Club library. Contact me off-thread.</p>
