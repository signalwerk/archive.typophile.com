    html: <p>Hi Mike. Nice to meet another Image Club customer (and fan?) Here's a bit of historical information about the first Letterpress (and ICG type library) - when it was first released, it consisted of twice the number of fonts that currently existed in the Adobe Type Library at the time. Mind you, they were all type three PostScript format, but.... <br> <br>I know I've only been hanging around the type business for 15 years or so, but I definitely feel like an old-timer.</p>
