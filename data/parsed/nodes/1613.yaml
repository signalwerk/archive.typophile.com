    html: <p>The font was called "Hairpin" and was a Visual Graphics Corporation font that was included in the Image Club old Letterpress 6.0 CD (and earlier). Corel/Bitstream renamed it to a very rough homonym by calling it "Harpoon". (It is no longer in the Image Club collection, as sold now by Agfa at fonts.com).</p>
    html_clean: <p>The font was called "Hairpin" and was a Visual Graphics Corporation font that was included in the Image Club old Letterpress 6.0 CD (and earlier). Corel/Bitstream renamed it to a very rough homonym by calling it "Harpoon". (It is no longer in the Image Club collection, as sold now by Agfa at fonts.com).</p>
