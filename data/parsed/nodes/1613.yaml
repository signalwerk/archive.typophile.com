    date: 2003-10-13T12:38:00
    date_raw: 13 Oct 2003 — 12:38pm
    votes: null
    html: <p>Nice to 'meet' you Grant. I have the Image Club  Letterpress 5.0 and 6.0 Collections, bought before Image Club was acquired by Adobe, then sold to Getty Images/Eyewire, then acquired by Agfa-Monotype.  <br> <br>As for you being a 'newbie' Adriano, this is a field were the old-timers have maybe only been here for 15 years, things change so fast. I got my first Image Club catalog back about then, and bought my first fonts in 1993 starting with one of the earlier Letterpress CD's (3.0, I think). Just like so many other trendy things, 'everything old is new again' with fonts too.  When House Industries gets to digitizing the Photo-Lettering typefaces they recently acquired, we'll all get to see how true that saying is.</p>
