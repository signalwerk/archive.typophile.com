      <p>IMVHO this is a very difficult task as typefaces seem to "age" differently from buildings.<br>
      For Venetian, I would look at an early Renaissance building in Venice - think one generation before Bramante (high Renaissance). At the time Venice was an independent country, not on friendly terms with Rome and Bramante came from Urbino.<br>
      For Garalde, I would look at Chambord.<br>
      For transitional, I would be careful about Versailles: most of the original works of literary people associated with Versailles (Racine, Corneille, Molière, Boileau) was published in Venetian / Garalde faces, (perhaps some in Fournier?) AFAIK. Transitional faces are later than Louis XIV, in any case. You would probably be looking at work by Ange-Jacques Gabriel rather than Hardouin-Mansart: Place de la Concorde (erasing the Madeleine out of the picture); Ecole Militaire (erasing the Eiffel tower from the background)... Or Le Petit Trianon. Having said that, transitional faces are often seen as British, so a better example might come from British architecture (think something in Cambridge at the time of Baskerville. Perhaps the FANTASTIC Senate House by Gibbs? or King's fellows building or sadly the Radcliffe Camera in Oxfart)?</p>
      <p>If by Modern, you mean Didot etc. you are looking at the generation just after Gabriel - that of neo-classicism. Arc de Triomphe of Paris ? (of course, an Italian neo-classical building would make sense too, since Bodoni may have initiated the genre - look at Parma?).</p>
      <p>I am not sure what you mean by experimental?<br>
      Slab Serif is a difficult one. Which typeface do you have in mind? Probably a Victorian building from London would make sense for Clarendon.</p>
      <p>Bauhaus: check ITC Bauhaus etc.</p>
      <p>Geo sans: tough one. Which typeface do you have in mind?</p>
      <p>Fkoors, I may be wrong.</p>
