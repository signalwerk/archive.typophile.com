    <p>What kind of architecture fits these different typefaces for you:<br>
    This for me is harder than I thought.. Some styles like the Slab Serif have been around and are still very famous. So do I look in which time they are created and try to fit a building with that or do I take it to the now. Hmm this wasn't that easy at all!</p>
    <p>Old Style<br>
     - Venetian - Tempietto di San Pietro in Montorio, Rome -<br>
     - Garalde - Caudebec-en-Caux -</p>
    <p> - Transitional - Versailles could fit this one -<br>
     - Modern - Frank Lloyd Wright?<br>
     - Experimental - Made me think of Moshe Safdie -<br>
     - Slab Serif - archetypical slabs -<br>
     - Geo Sans Serif -<br>
     - Monospace - Bauhaus?</p>
    <p>I'm making a booklet for school. Hopefully the pictures can really explain.</p>
    <p>Thanks,</p>
