      <p>For the experimental : you need to contextualise each experimental typeface I am afraid. minuscule would probably be right with something like the Rue des Suisses in Paris by Herzog &amp; DeMeuron, no? I am not keen on Musée du Quai Branly, because it is too large scale although it would be right in terms of location / nationality.</p>
      <p>Re: geometric. Try Futura with Bauhaus as s.o said eloquently. Try Avant-garde with a building from the 1970s which claimed to be modernist/Bauhaus (I know these are two different concepts). You could try Twentieth Century or even Century with an american modernist building?</p>
      <p>Re Modern: Boullée is good. Ledoux might even be better. (Try <a href="http://en.wikipedia.org/wiki/Claude_Nicolas_Ledoux#The_Royal_Saltworks_at_Arc-et-Senans_.281774-1779.29" title="http://en.wikipedia.org/wiki/Claude_Nicolas_Ledoux#The_Royal_Saltworks_at_Arc-et-Senans_.281774-1779.29">http://en.wikipedia.org/wiki/Claude_Nicolas_Ledoux#The_Royal_Saltworks_a...</a>, which rationalises a city into curves and straight) </p>
      <p>Monospace: for me, it evokes an office building and pools of secretaries on typewriting machines!</p>
