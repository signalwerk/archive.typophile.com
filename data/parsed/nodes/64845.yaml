      <p>Slightly tangential, but if you're interested in historical parallels between type and architecture, this book might be worth a look:<br>
      G Knuttel, The letter as a work of art: Observations and confrontations with contemporaneous expressions of art from Roman times to the present day (Amsterdam 1951). [Out of print, but check your library.]<br>
      I admit I haven't actually read it yet, but it consists to a great part of spreads juxtaposing typefaces and art/architecture from the same period or in the same style, &amp; thereby shows how the history of type is connected to that of other visual disciplines. I find that quite insightful.</p>
