  html: |-
    <p>I suspect I crashed Windows 7 rasterizer.  I was investigating how my (silly) font was looking at 8pt/em (in Notepad); now Notepad fonts' selection is quirky when I try to choose this font (it won't show — autogenerated — Italic/Bold on the first time I select the font, only on the second time), and, while the dialogue allows me to choose font size, the Notepad continues to use the same 8pt size.</p>
    <p>The other fonts are unaffected (even in the same Notepad session).</p>
    <p>Is there any way to clear the rasterizer cache and ask it to start from the scratch?  (Short of rebooting…)</p>
