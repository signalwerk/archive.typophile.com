    html: |-
      <p>Finally, I rebooted, and the condition was cleared (one of two fonts would show again).</p>
      <p>Surprisingly, both fonts were <strong>deleted</strong> before the reboot.  Still, one of them “resurrected”, and would show fine (at sizes above the “design” size of 16px); it was picked by FireFox automatically.  (I suspect that the reason for the crash of rasterizer [and corruption of some internal structures] was using sizes closer to 8px.)  I did not try to experiment with the other one of two fonts…</p>
      <p>Is there any way to detect a particular glyph which caused the crash?  (Bisecting a font with 55000 glyphs, with reboots in between, may take some guts. ;-)  (Not mentioning that the full build process takes 6hours!  But I would not need it for just deleting the glyphs — fontforge would take about 20min to Generate() the TTF.)</p>
