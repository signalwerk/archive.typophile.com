    html: |-
      <p>Afraid you have to reboot. The fontcache is held in memory.<br>
      First, DELETE the fontcache - c:\windows\SYSTEM32\fntcache.dat<br>
      then reboot. With luck, the problem will go away. If it doesn't there's something else wrong!<br>
       - Herb</p>
