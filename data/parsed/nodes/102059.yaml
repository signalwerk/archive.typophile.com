    html: |-
      <p>Another ramification (with a different family — from the same super-family of fonts)…  Now, as far I can see, GDI shows the font fine, but DirectWrite treats every character as whitespace :-( ;-).  The font is monospaced, so there is little chance to distinguish one character from another if there is no glyph shown ;-).</p>
      <p>(At least what I can see is that Notepad and Chrome show glyphs, but Firefox and IE do not.)  Does it mean that only DirectWrite's rasterizer crashed, or what?  Deleting/reinstalling a font without a reboot does not help…</p>
      <p>Yet another tidbit: I did not check before whether the font would show in DirectWrite applications; so I do not know whether what I indicate above is time-dependent.  But I <em>did</em> check that the font worked in Windows' console fine (looking at a document which included all the characters in the font).  — Initially.  — Now it does not (without any change to the setup) — it won’t even show in the menu of available console fonts.  Is it an indication of (another) crash?</p>
      <p>If so, crash in which subsystem?  BTW, is console using GDI or DirectWrite?  If latter, there might be a correlation between these two anomalies…</p>
