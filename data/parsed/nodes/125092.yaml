    <p>Hi there,</p>
    <p>I created a small typography project on Kickstarter to create a notepad inspired by the design and typography of the classic Mac OS. </p>
    <p>I would appreciate feedback,<br>
    especially if you got any additional information or resources on the Chicago Typeface by Susan Kare that you think could or should be added - I would be very thankful.</p>
    <p><strong><a href="https://www.kickstarter.com/projects/2108133360/cancel-save-notepad/description">https://www.kickstarter.com/projects/2108133360/cancel-save-notepad/description</a></strong></p>
    <p>Thanks<br>
    Harald</p>
