    html: "<p>OK, now I feel bad for being so flippant earlier. I agree with Stuart and HD's comments. <br> <br>So, to be a bit more constructive with my own opinions: as I noted elsewhere in this forum today, I think the best logos are entirely unique to the companies or individuals they represent. The difficulty you have with a company called \"Jade Design\" is that you have a few readily available directions you can go in, but many, many other people have gone those directions before, to the point where they have become cliches. <br> <br>You have a couple of options: <br> <br>1. Avoid the cliches altogether. Maybe your client (or you, if you're the client) picked the word Jade for an unusual reason. Dig into that inspiration for a compelling image. <br> <br>2. Explode one or more of the cliches, meaning that you knowingly subvert the cliche. I think Abercrombie thought they were doing that, but instead they played right into it. Here's more successful idea that breaks a different cliche: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7219.gif\" alt=\"canada bread\"> <br> <br>Here the Canadian maple leaf, a way-overdone image, is merely referenced in the happy coincidence that the company's initials could be used to sketch it. It also takes on a sort of wheat imagery as well. I'm not crazy about other aspects of this logo, but I think the approach was creative.</p>"
    html_clean: "<p>OK, now I feel bad for being so flippant earlier. I agree with Stuart and HD's comments. <br> <br>So, to be a bit more constructive with my own opinions: as I noted elsewhere in this forum today, I think the best logos are entirely unique to the companies or individuals they represent. The difficulty you have with a company called \"Jade Design\" is that you have a few readily available directions you can go in, but many, many other people have gone those directions before, to the point where they have become cliches. <br> <br>You have a couple of options: <br> <br>1. Avoid the cliches altogether. Maybe your client (or you, if you're the client) picked the word Jade for an unusual reason. Dig into that inspiration for a compelling image. <br> <br>2. Explode one or more of the cliches, meaning that you knowingly subvert the cliche. I think Abercrombie thought they were doing that, but instead they played right into it. Here's more successful idea that breaks a different cliche: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/7219.gif\" alt=\"canada bread\"> <br> <br>Here the Canadian maple leaf, a way-overdone image, is merely referenced in the happy coincidence that the company's initials could be used to sketch it. It also takes on a sort of wheat imagery as well. I'm not crazy about other aspects of this logo, but I think the approach was creative.</p>"
