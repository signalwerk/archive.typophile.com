    html: "<p>I'd like to talk about 3 things in this discussion: <br>1. Cliches: I read once about a designer who said that in working on a logo, he first sat down and did all the cliche ideas to get them out of the way. THEN he started working on his client's logo. I've always found that advice helpful in my own work. It takes a look at where we've been with certain ideas (an historical perspective perhaps?) and allows you to take a fresh look at them and at your client. <br>2. How many options to present: I have presented a client with as many as eight different options in order to get them thinking strategically and answering questions like what is my business strategy? what is my marketing strategy? who am I? what do I do? how do I do it? It's surprising how often clients don't relate those answers to an identity design. <br>3. Logos should work in b&amp;w first: This was a basic rule when I went to art college too. Now (hopefully wiser ;-) I think that it relates not so much to application (variation in size and media) as to perception - it is a valuable way to make sure to get the overall shapes right. These are perceived first by the viewer and we often lose sight of that while working on it. </p>"
    html_clean: "<p>I'd like to talk about 3 things in this discussion: <br>1. Cliches: I read once about a designer who said that in working on a logo, he first sat down and did all the cliche ideas to get them out of the way. THEN he started working on his client's logo. I've always found that advice helpful in my own work. It takes a look at where we've been with certain ideas (an historical perspective perhaps?) and allows you to take a fresh look at them and at your client. <br>2. How many options to present: I have presented a client with as many as eight different options in order to get them thinking strategically and answering questions like what is my business strategy? what is my marketing strategy? who am I? what do I do? how do I do it? It's surprising how often clients don't relate those answers to an identity design. <br>3. Logos should work in b&amp;w first: This was a basic rule when I went to art college too. Now (hopefully wiser ;-) I think that it relates not so much to application (variation in size and media) as to perception - it is a valuable way to make sure to get the overall shapes right. These are perceived first by the viewer and we often lose sight of that while working on it. </p>"
