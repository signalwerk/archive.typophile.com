    html: <p>&gt;&gt;Concerning showing clients options, what do  <br>&gt;&gt;you do when the client comes to you with  <br>&gt;&gt;something specific in mind? That isn't  <br>&gt;&gt;practical (for lack of a better word) or is a  <br>&gt;&gt;bad cliche? <br> <br>I just quit such a job. It was a publisher of crime books and their idea was a pistol/gun. We tried something along those lines (retro 50s and such stuff), but it always felt wrong, as a pistol for a crime book publisher is like an owl or a book for a book shop, or a pair of glasses for an optician, it's just too flat, even if you stylize it... it's just a one-dimensional, all too simple idea. What we came up with is a completely remodelled flammable-sign I once photographed from a NY gas tank. We completely redesigned the flame, and on the stationery and business cards it was to be foil stamped, and we felt that the danger/hot association was still quite close to the topic at hand, worked very well as a stand-alone sign (without the companies name) and it was nice to use a more or less simple everyday iso-sign in a completely different context and make it work instead of working with an obvious clich</p>
