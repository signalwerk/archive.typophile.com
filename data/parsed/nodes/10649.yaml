    html: <p>I think majuscle and minuscle letters are to be played with. For example, we had the stationery done in an all-lc typo in FFInfo for some time and then switched to FFDin in all-UC, just for the heck of it and because the Uppercase adds to the strangely ironic aspect of the oh-so-authorative DIN-Typeface.  <br> <br>I think in a logo you can work without or only with capitals, depending on the actual look of the letters in the logo and on the comapny you work for. If carefully done, it can work pretty well, as a slight break with what we expect to read can make a logo stand out more.  <br> <br>For a logogramm for a company like france telecom, however, this design all in all just tries too hard to look modern and dotcomish. I dunno how old it is, but it already looks a bit old because of it trying to look so modern. Less would have been more, here. </p>
