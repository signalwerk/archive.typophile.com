    html: <p>It's a rule. It doesn't only happen to me. Maybe this is because many clients opt for the most tame, most superficial solution while you as the pro would have preferred the more radical or more pure or more stylized or more neosimplicistic version or whatever, the thing closer to your heart. When I go to a pitch that DEMANDS three designs, I mostly have my heart set on one of those three... mostly the quite different, daring, difficult approach. Many clients prefer the simple tun-of-the-mill ••••, however. So whenever I can I opt to NOT give them a choice. After all, our job is to come up with a solution. Giving the client a choice is just shifting the difficulty of decisionmaking to him. I like to get loads of feedbacjk from the client, my briefing talks and eMails are long and go rather deep. When doing CD I speak to dozens of people from various positions in a company. And in the end I don't wanna see the thought and input of many people that culminates in a specific idea and look&amp;feel go down just because a CEO has a bad day or is suddenly afraid of change. </p>
