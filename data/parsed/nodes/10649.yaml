    html: <p>Immerse yourself in your vision of Jade Design. Even if it's a fake company, create a little creative brief for yourself about the company and determine what you'd want the brand to say.  <br>  <br>Remember that you're not just creating a look for somebody, you're creating a brand that stands for what the company is about. Also, ask yourself if the fonts you've selected and the look you've created really addresses all these things you're tying to accomplish.  <br>  <br>Think about it this way, if you opened up the phone book and saw the Jade Design logo, would you hire them to design anything for you?  <br>  <br>If your answer is no, than you haven't fulfilled the purpose of a logo. In a consumer forum, a logo is to extend the brand visually and connect with the audience who would be inclined to use the product or service you're pitching to them.  <br>  <br>Good Luck and please post updated versions of the logo for us!  <br>  <br>Stuart :D</p>
