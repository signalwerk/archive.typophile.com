    html: "<p>Years ago, I worked for a large regional nonprofit theater, and we were about to premiere a new play by David Henry Hwang. A board member, who was very concerned that the company promote the show in a way that was completely respectful to the Asian-American community (she was Chinese-American herself), helped me procure a piece of art that we used for the poster. <br> <br>But the board member wasn't done yet, since I still had the show logo to design. She took me aside, made sure I was intently listening to her, and then she spoke these immortal words:  <br> <br>\"NO CHOP SUEY LETTERING!\" <br> <br>She didn't mention anything about Skia, however. But just to be on the safe side, I wouldn't use that either. <br> <br>More seriously: obviously, her intent was to make sure that I, as a white person, wouldn't inadvertently do something that was disrespectful. You, as an Asian or Asian-American, may feel differently than she did about such typefaces. For the record, however, I <i>never</i> even considered using one of them. They should only be used in kitschy contexts, and even so, probably not. <a href=\"http://www.blackapolis.com/news/images/abercrombie.jpg\">Abercrombie</a>, anyone?</p>"
