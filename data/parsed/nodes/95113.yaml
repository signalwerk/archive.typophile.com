    html: |-
      <p>I thought the basic idea was to have 2 spaces after a period so that people would know for sure it was a period and not a comma?  Of course having a capital letter after the space helps as well. </p>
      <p>Surely the real reason this is happening is that it's very hard to create more then one space in a row on the web.  You can put a hundred spaces after every sentence but most all browsers will take back out all but one.  You won't be able to spot any double spaces on this web page, for instance, although I gather there is some kind of ascii code you can use for a double space.  Not sure if it's an 'ascii code' but something like that.</p>
      <p>This is the reasoning behind the non indented double spaced paragraph format as well.</p>
      <p>So, instead of making the technology come around to adapt to us, we are adapting to it.</p>
      <p>For myself I would say I only prefer the non indented style because the tab button seems to be set up for absurd indentation in most word processors. Something like ten character widths or something, much too wide.  Of course you can change that, or just type in 4 spaces for your indent, but what a pain.</p>
