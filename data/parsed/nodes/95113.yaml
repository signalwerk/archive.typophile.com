      <p><cite>I am not willing to type SIX characters to do the work of one</cite></p>
      <p>No need. I have a little script (it is dated 2009, I used it by then to format things before the pre tag became available) that may do the job (and other things)</p>
      <pre>#!/bin/sh

      sed 's/&lt;/\&amp;lt;/g
      &nbsp; s/&gt;/\&amp;gt;/g
      &nbsp; s/\[/\&amp;#91;/g
      &nbsp; s/\]/\&amp;#93;/g
      &nbsp; s/ /\&amp;nbsp;/g' $1
      </pre>
