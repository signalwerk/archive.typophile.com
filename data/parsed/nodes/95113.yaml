      <p>What he said: ’Typing two spaces after a period is totally, completely, utterly, and inarguably wrong.”</p>
      <p>What is true: “Typing two spaces after a period is totally, completely, utterly, and inarguably wrong—for anyone, like me (who, after all, is the most important AND authoritaive moron in the world AND on the internet)—who does not have clue one why there is a reason for something that I don't know, is not easily Googlable, or is under retirement age.  So there.”</p>
      <p>Nick, old buddy: you got this one right.  And, if we’re “lucky,” we ought to be able to bring about mass extinction ALL on our own—because two spaces after a period is stupid—when it took a totally accidental giant asteroid to wipe out the dinosaurs. That's call Progress—or hubris—or stupidity…</p>
      <p>Which, unfortunately, leads me to believe that even dinosaurs—like me and a lot of clueless older folks—could find wisdom in allowing a little extra space to clearly disambiguate.  Which, sadly, makes perfect sense in the insane asylum we all live in, the Paradise formerly know as Planet Earth.</p>
      <p>Okay: anyone else want their buzz killed?  AOL did it for me yesterday, when they “improved” my mailbox and—completely inadvertently (I must presume, to adumbrate my paranoia)—made it a WHOLE LOT harder to use.  More Progress…</p>
