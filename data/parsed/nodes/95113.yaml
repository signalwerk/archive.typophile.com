      <p>TeX and LaTeX (still) have a larger default inter-sentence than inter-word spacing; you need to use the command <code>\frenchspacing</code> to disable that behavior. I doubt many users know about that or even noticed the difference. Moreover, the standard LaTeX packages amsart (Americal Mathematical Society) or revtex4-1 (American Physical Society) do not call <code>\frenchspacing</code> (the Springer llncs package however does). Here is a grab of the output with plain TeX (Computer Modern font)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/abcd_5114.png"></div><br>
      on the source<p></p>
      <pre>  a b. c d\par 
        \frenchspacing
        a b. c d
        \bye
      </pre><p>Michel<br>
      Correction: read "document class(es)" where I wrote "package(s)".</p>
