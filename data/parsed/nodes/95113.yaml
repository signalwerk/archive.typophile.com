      <p>Typing classes (on TYPEWRITERS) used to teach typing two spaces. Some of us who took those classes many decades ago find it very difficult to change our fingers' mechanical memory. I've managed to overcome it, but my wife hasn't. It's almost as difficult as changing from a qwerty keyboard to anything else. We had to transition from typing a small letter 'ELL' for a numeral ONE, and not to type an apostrophe followed by a backspace and a period to create an exclamation point. Then there was where things were on the keyboard - shift/numbers were 2-double quote, 6-Underscore, 7-Ampersand, 8-single quote.  There was a comma key and a period key, both of which worked  either  shifted or un-shifted. and an @-¢ key.  Most of us old dogs managed to learn new tricks pretty quickly, but ...</p>
      <p>Not to mention double spacing after a paragraph (as I've just done) instead of setting inter-paragraph spacing - which can't be done here.</p>
