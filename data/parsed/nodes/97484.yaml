      <p>I discuss how the neoclassical didone style was superceded by the Scotch Modern:<br>
      <a href="http://origin.myfonts.com/s/aw/original/175/0/89904.pdf" title="http://origin.myfonts.com/s/aw/original/175/0/89904.pdf">http://origin.myfonts.com/s/aw/original/175/0/89904.pdf</a> (page 5).</p>
      <p>The full text of my Richard Austin quote, courtesy of James Mosley:<br>
      <a href="http://typefoundry.blogspot.ca/2007/02/richard-austins-address-to-printers.html" title="http://typefoundry.blogspot.ca/2007/02/richard-austins-address-to-printers.html">http://typefoundry.blogspot.ca/2007/02/richard-austins-address-to-printe...</a></p>
      <p>Austin referred to “modern type introduced by the French”, presumably Didot et al, but I think Bodoni’s work would fall under the same rubric.</p>
