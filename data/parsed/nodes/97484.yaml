      <p>Thanks guys.</p>
      <p>I'll have a look through the materials. As I have to focus on one 'object' (in my case, I chose a typeface), I may well continue to use Bodoni (perhaps Didot as it seems to carry large significance with the Didone style). A switch to the classification Didone might be sensible, also.</p>
      <p>There is some analysis to be found in there, I just need to have a deeper think about my thesis and have a look for some reliable sources.</p>
      <p>I'm currently thinking one possibility along the lines of how the deliberate use of a Didone style in computer displays fool the viewer into a Neoclassical viewpoint in order to contrast against a barrage of contemporary type.</p>
      <p>Or something. I'm extremely new to this (both research papers, theses and critical type analysis), and learning all the time.</p>
