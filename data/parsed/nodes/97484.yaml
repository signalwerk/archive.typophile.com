      <p>Yes, because the sans emerged as an atavism—from the grotto, according to Mosley:<br>
      <a href="http://www.amazon.ca/Nymph-Grot-Revival-Sanserif-Letter/dp/0953520102" title="http://www.amazon.ca/Nymph-Grot-Revival-Sanserif-Letter/dp/0953520102">http://www.amazon.ca/Nymph-Grot-Revival-Sanserif-Letter/dp/0953520102</a><br>
      (This is the seminal text on the birth of the sans, locating it in the early 19th century rather than as a twentieth century modernist phenomenon, which had been the traditional idea in design culture dominated by the Modernist narrative, ignoring the ﬁrst sans faces as an incidental aberration.)</p>
