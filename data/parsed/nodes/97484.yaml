    <p>Hey all!</p>
    <p>This is my first post, so be gentle. My professor, Pablo Medina, suggested this place to ask for some insight on a research paper I'm doing.</p>
    <p>I'm basically in the formative throws right now, but I'm working towards some sort of thesis. I'm thinking about discussing how Bodoni as a transitional typeface bridges the gap between serif and sans serif fonts, and/or something else to do with its place in history.</p>
    <p>As I said-- formative throws.</p>
    <p>My main point of posting here is to ask if you guys can recommend any good sources, print or otherwise, for me to read up on the history and help myself get as close to a perfect grade as possible!</p>
    <p>Anything would be appreciated, even just insight.</p>
    <p>Regards,<br>
    Nathen.</p>
