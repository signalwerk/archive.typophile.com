      <p>I didn't think to do a stroked brush application, that's a brilliant idea. </p>
      <p>As far as anchor points go, you're probably right to say it was an autotraced image, but in CS2 there isn't a limit on the ammount of anchor points you can have in a continuous segment. I haven't gone thru a rip for printing (just direct network to the printer.) but I don't think there would be a problem anymore. </p>
      <p>I appreciate all the ideas. I knew this collective braintrust would come up with a solution in a little time!</p>
      <p>oh, and <em>Then if I were you I would try Object-Path-Simplify<br>
      </em> doesn't really work well...</p>
