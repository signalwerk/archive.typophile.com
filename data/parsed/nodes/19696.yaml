    html: |-
      <p>There wasn't a limit before on points either, causing endless headaches for prepress folks receiving files that wouldn't RIP, for example people turning selections into paths in Photoshop. A laser printer will print just about anything but then you throw it at a postcript RIP and things get serious.</p>
      <p>Have not tried simplify on two very complex objects sharing a segment. Of course they can't be truly sharing it unless it's a compound path.</p>
      <p>Simplify works really well sometimes, depending on the path…</p>
      <p>c'est la vie</p>
      <p>peace</p>
