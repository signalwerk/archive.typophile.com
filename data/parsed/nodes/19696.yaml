  html: |-
    <p>I'm working with an AI file I downloaded off the Adobe Exchange Server, it's a map of the United States. Very accurate with every state individually outlined, but as I work I'm noticing a few of the states don't have a continuous outline stroke. Because of the intricate nature of the state's shapes there are easily a thousand points used to create this outline stroke. That's a thousand points a state (give or take a few hundred).</p>
    <p>Is there a way that I can automatically highlight the beginning and end of a continuous line segment to make it easy to see where the breaks are in hopes of completing the path?</p>
