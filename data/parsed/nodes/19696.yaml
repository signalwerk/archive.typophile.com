    html: |-
      <p>Do as Miss Tiffany says and put a coloured stroke on the outline, then make sure that the rounded ends option is selected in the stroke panel. If you make the stroke weight thicker it should show up where the gap is (You may need to make it quite thick).</p>
      <p>Hope this works - haven't tested it in practise.</p>
