    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ff-ernestine_6123.gif"></div><br>
    At long last, after three years of work, I am extremely happy to announce the release of my first commercial typeface, FF Ernestine, with FontShop International today!<p></p>
    <p>Microsite with typeface showings and further info:<br>
    <a href="http://ernestinefont.com/" title="http://ernestinefont.com/">http://ernestinefont.com/</a></p>
    <p>Get the fonts here:<br>
    <a href="https://www.fontfont.com/fonts/ernestine" title="https://www.fontfont.com/fonts/ernestine">https://www.fontfont.com/fonts/ernestine</a></p>
    <p>This typeface took its first little stumbling steps at the CAS Type Design program in Zurich, as well as right here on Typophile, where Ernestine's own <a href="http://typophile.com/node/53395" rel="nofollow">critique thread</a>, started in January 2009, has seen it mature quite a bit.<br>
    After I stopped posting updates there, I teamed up with Hrant Papazian, who drew an Armenian companion to my Latin design while I was making the Italic. We've drawn four weights, and every font now encompasses almost 1200 glyphs (in the complete "Pro" version).</p>
    <p>My warmest thanks to my friend and project partner Hrant, to the brilliant folks at FSI who have taken such good care to make Ernestine really ready for market, to friends and teachers from the CAS 2008 class, and last but most certainly not least to Typophile itself, especially Ben, Craig, Sindre, and everyone else who helped this insane journey reach an actual, tangible end. ♥</p>
