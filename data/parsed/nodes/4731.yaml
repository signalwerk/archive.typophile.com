    html: "<p>Thanks Thomas <br>I just read this. <br> <br>\"The permanent injunctions also bar defendants from creating or distributing any font software which copies or extracts the points in an Emigre or Adobe font software program. \" <br>- <a href=\"http://www.emigre.com/eprSSi.php\" target=\"_blank\">http://www.emigre.com/eprSSi.php</a> <br> <br>\"So, in the USA, outlines in digital font software can be protected by copyright but the letterforms they represent cannot. \" <br>- <a href=\"http://cgm.cs.mcgill.ca/~luc/kinch.html\" target=\"_blank\">http://cgm.cs.mcgill.ca/~luc/kinch.html</a> <br> <br>This is all getting confusing. <br> <br>Anyway, personally I experiment with my application with many 'copyrighted' fonts and create some very interesting and unusual shapes. Shapes and form that inspire me to create ideas for other fonts. To me, that's progression and something that (with the right amount of control) I can explore further. <br> <br>If I was asked by a client to design a billboard, would there be a difference in me using straight helvetica or a manipulated helvetica? As I own the licence am I fit to do what I like with it? <br> <br> <br>Here is what I found in the Fontlab 4.5 Manual. <br> <br>\"When you open an existing font, however, please be sure that modifying it does not violate copyright laws: some fonts are copyrighted as software so it is not legal to change them in any font editor.\" - p.52 <br> <br>\"If you have edited an existing font that was not your creation you must not remove the information contained on this page, or you may violate copyright laws.\" - p.169 <br> <br>And another interesting quote.. <br>\"We decided to allow modification of the embedding setting only because we are sure that the users of FontLab are professionals who respect others' rights to intellectual property. We assume that you will change the embedding setting only in your own fonts.\" p.170 <br></p>"
