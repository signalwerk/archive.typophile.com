    html: <p>Paul <br> <br>The following URL brings up another interesting issue. They have created an additional 10 derivative weights of Agfa's Rotis.  <br> <br><a href="http://www.typeguy.com/pages/alts/rotis.html" target="_blank">http://www.typeguy.com/pages/alts/rotis.html</a> <br> <br>They used Adobe's font software so they would need both Adobe's permission as well as Agfa. <br> <br>If, as may be the case, Adobe is not even permitted to create additional weights and so would not be in a position to authorize someone else to, and it is reasonable to assume that Agfa would want control of its own typeface, then why would a third party think that it has the right to do so. <br> <br> <br>Nigel</p>
