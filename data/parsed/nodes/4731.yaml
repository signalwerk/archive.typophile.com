    html: <p>You're kind of treading on thin ice with that one.  In theory, you should be able to create entirely new fonts from existing glyphs because, well, they're entirely new fonts (but even if this is deemed acceptable, and I'M NOT SAYING THAT IT IS, it would always be a good idea to notate the original--not that you weren't going to do that).   <br> <br>One of the bigger problems you'll encounter is that, although typefaces can't yet be copyrighted in the US of A, the files that store and produce them can be.  Of course, a font file contains much more than just the points that comprise a set of glyphs (metrics parameters, for example).  I'd really look into it further before you proceed, you may be able to overcome legal actions, but a loss of honor might hurt tremendously more.</p>
    html_clean: <p>You're kind of treading on thin ice with that one.  In theory, you should be able to create entirely new fonts from existing glyphs because, well, they're entirely new fonts (but even if this is deemed acceptable, and I'M NOT SAYING THAT IT IS, it would always be a good idea to notate the original--not that you weren't going to do that).   <br> <br>One of the bigger problems you'll encounter is that, although typefaces can't yet be copyrighted in the US of A, the files that store and produce them can be.  Of course, a font file contains much more than just the points that comprise a set of glyphs (metrics parameters, for example).  I'd really look into it further before you proceed, you may be able to overcome legal actions, but a loss of honor might hurt tremendously more.</p>
