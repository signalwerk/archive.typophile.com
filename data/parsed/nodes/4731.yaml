    votes: null
    html: "<p>Well, on the face of it a person who has been granted rights by X is entitled to exercise those rights. A third party might come along and stop them if the rights were not X's to grant. But in those circumstances X's customer would expect to have a claim against X for breach of contract: You promised me I could use this font, and I can't. The customer is not obliged to second-guess the EULA (though in some cases, such as embedding, the rights it grants are expressly contingent upon the rights granted by Adobe's supplier in Adobe's EULA). In theory, if the customer's supplier cannot \"make good\" the promise its EULA contains, the customer would look to recover any loss (eg, the cost of adapting the font) from its supplier, in that case Adobe. The limitation of liability provisions in most EULAs might be a problem, but their enforcement would not be a foregone conclusion in many jurisdictions. <br> <br>Of course, I'm not commenting on the specific case you cite. Embarking on such a wholesale modification project pushes at  the boundaries of the Adobe EULA in any event (depending on how it's done), and might raise trademark issues too. I doubt it would be rational to embark upon such an endeavour without squaring the licence issues first explicitly; I expect something similar happened here.</p>"
