    html: "<p>Nigel, the legal issues that would raise are more difficult than you might think, even if a company like Adobe would really want to take action against somebody who had relied in good faith on its own FAQ (which I doubt). <br> <br>I think Thomas's point is that the FAQ presumably reflects the lawyers understanding of their own EULA. A court might well agree. Though I am a lawyer, I'm not a copyright lawyer, much less a US copyright lawyer. But it seems to me that conversion of a font is clearly permitted (subject to certain limitations): see 2.6.4. Modification of the font is also permitted, to the extent permitted in 2.6.4: see clause 3. So it all really comes down to what is meant by \"converting the font into a different format\". That is probably ambiguous. Adobe clearly represents in its FAQ that it includes \"modifications\", and most courts and judges would be reluctant, in the face of such a clear representation, to hold anyone liable so long as they had acted in good faith and consistently with the FAQ. <br> <br>(FWIW, it seems to my nonexpert eye that the FAQ is probably right. It is clear from clause 3 that the contract regards conversion \"into another format\" as capable of encompassing some degree of modification, and as being permitted on the terms of clause 2.6.4. I don't see why conversion \"to another format\" should not be capable of encompassing a variety of modifications; indeed, if one views the \"font\" as software (not as letterforms) any \"conversion\" of format will inevitably involve modification.)</p>"
