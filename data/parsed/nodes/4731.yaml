    html: <p>The Vera fonts, like most fonts from established foundries are in fact licensed - Gnome use the term "copyright license" but it's a license nonetheless. The license is definitely generous, and allows the creation of derivative fonts, but you can't use the name Vera or Bitstream in the derivative font name and you can't *sell* the font on it's own. Details at <a href="http://www.gnome.org/fonts/" target="_blank">http://www.gnome.org/fonts/</a> <br> <br>There are plenty of font manipulation tools out there so it would seem as if you can produce such a tool. However I think you should provide disclaimers and warnings advising users of the tool to consult their font licenses. Most of the fonts your users will have on their systems would have licenses that would prohibit modification.  <br> <br>As for redistributing your customer's derivative fonts, there are very real legal (trademark and copyright) as well as ethical problems with this that would land you in hot water. <br> <br>Cheers, Si <br></p>
    html_clean: <p>The Vera fonts, like most fonts from established foundries are in fact licensed - Gnome use the term "copyright license" but it's a license nonetheless. The license is definitely generous, and allows the creation of derivative fonts, but you can't use the name Vera or Bitstream in the derivative font name and you can't *sell* the font on it's own. Details at <a href="http://www.gnome.org/fonts/" target="_blank" class="link-external">http://www.gnome.org/fonts/</a> <br> <br>There are plenty of font manipulation tools out there so it would seem as if you can produce such a tool. However I think you should provide disclaimers and warnings advising users of the tool to consult their font licenses. Most of the fonts your users will have on their systems would have licenses that would prohibit modification.  <br> <br>As for redistributing your customer's derivative fonts, there are very real legal (trademark and copyright) as well as ethical problems with this that would land you in hot water. <br> <br>Cheers, Si <br></p>
