    html: "<p>Something like Vera is of course a special case. Most font licenses don't allow the user to modify the font at all (though Adobe's license is an exception). Actually selling or even redistributing a modified font to people who are not licensed for it is almost certainly copyright infringement. <br> <br>To understand more about the legal situation in the USA, one could read the summary judgment from the Adobe vs SSI case: &lt;<a href=\"http://web.archive.org/web/20010303011442/http://www.bna.com/e-law/cases/adobe.html\" target=\"_blank\">http://web.archive.org/web/20010303011442/http://www.bna.com/e-law/cases/adobe.html</a>&gt; <br> <br>For a shorter summary of the judgment, including some legal analysis, see: <a href=\"http://www.atypi.org/10_Visitors/60_legal/30_typeface_protection/feinberg_html\" target=\"_blank\">http://www.atypi.org/10_Visitors/60_legal/30_typeface_protection/feinberg_html</a> <br> <br>Regards, <br> <br>T</p>"
