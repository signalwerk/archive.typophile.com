  html: <p>Hey guys. I wonder if you can enlighten me on a few points. <br> <br>If you open a copyrighted font and change it (possibly changing every point), can you then distribute it free or not? I presume not. But can you use it in commercial projects? (e.g. you change a typeface for a logotype and branding) Is that ok with the original designer if you have purchased the face? <br> <br>My main issue is, that I am producing an interactive piece where people can manipulate fonts and save them, for a gallery exhibit they can manipulate Bitstream Vera (Open Source) and walk away with their new font. But this will become a standalone application aswell, and I am thinking that if i supply the program, people can do what they want with it, and I have no responsabilities if they open copyrighted fonts and change them. Is this right? If people send me their changed fonts, can I legally display them on my website, or could I even distribute them? <br> <br>Please let me know your thought on this. Any help would be great</p>
  html_clean: <p>Hey guys. I wonder if you can enlighten me on a few points. <br> <br>If you open a copyrighted font and change it (possibly changing every point), can you then distribute it free or not? I presume not. But can you use it in commercial projects? (e.g. you change a typeface for a logotype and branding) Is that ok with the original designer if you have purchased the face? <br> <br>My main issue is, that I am producing an interactive piece where people can manipulate fonts and save them, for a gallery exhibit they can manipulate Bitstream Vera (Open Source) and walk away with their new font. But this will become a standalone application aswell, and I am thinking that if i supply the program, people can do what they want with it, and I have no responsabilities if they open copyrighted fonts and change them. Is this right? If people send me their changed fonts, can I legally display them on my website, or could I even distribute them? <br> <br>Please let me know your thought on this. Any help would be great</p>
