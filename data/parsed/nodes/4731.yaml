    html: <p>Well, surely at that point they may well hit problems. If they distribute the font they have modified to their client, then they are going outside the EULA, and outside the terms of the FAQ too. They could use the modified font internally for that client's purposes -- but nothing else. <br> <br>I suppose if the client licenses the font, and the advertising agency (on behalf of the client) then modifies it, the letter of the EULA and FAQ have been complied with. So long as the client has sufficient licenses for the original font, I don't see that the fact that the modification was done by a sub-contractor would matter. <br> <br>This doesn't seem unreasonable. So long as everyone licenses the original properly, Adobe doesn't mind it being modified. This seems realistic, perhaps generous. What they cannot have is people "modifying" fonts and then releasing the result into the wild. <br> <br>Of course the client is entitled to know whether they are getting pret-a-porter with alterations or something truly bespoke.</p>
