    <p>I found a 2001 thread written by Justin Howe's about the release of his Caslon Old Face</p>
    <p><a href="http://palimpsest.stanford.edu/byform/mailing-lists/bookarts/2001/08/msg00002.html" title="http://palimpsest.stanford.edu/byform/mailing-lists/bookarts/2001/08/msg00002.html">http://palimpsest.stanford.edu/byform/mailing-lists/bookarts/2001/08/msg...</a></p>
    <p>In it he describes how he created his digital faces to match each metal/wood point he could find, including 8 and 10 point, etc.  ITC's Founder's Caslon, however, only has calson digital fonts based on the original 12 point, 30 point and 42 point metal/wood type.  </p>
    <p>Does anyone know where I can purchase the fonts as desribed in the above thread?</p>
