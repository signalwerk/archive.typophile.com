      <p>Dan, yes, if you print letter press of course when you get ink gain it will look more like the original, especially if you print on rough paper. So that will indeed approximate the old printing a lot more.</p>
      <p>However, there is another problem with authenticity in Founder's Caslon, and this is recut and damaged characters. For example, in the 19th century Caslon's Pica 2 italic evidently was recut with the slopes of the ascenders regularized. (James Mosley first pointed out the existence of recut characters.) Howes uses the 19th or 20th century types, which are not the originals. </p>
      <p>Also there are damaged characters. The ascender of the roman 'h' in the Founders Caslon 12 looks like it has a broken back and broken serif. The same broken-back ascender is found in Linotype Caslon Old Face of 1923, so it probably came from the model of the same hunk of metal--which meanwhile seems to have gotten its serif broken also. In the 1766 specimen book, the ascender does slant forward, but it doesn't look 'broken'; and no broken serif. </p>
      <p>Personally, what I take from all this is that authenticity is an impossible goal, unless you have original type or recast from original, undamaged matrices and then use the same printing methods. </p>
      <p>But then the result is going to look extremely 'antique', and not acceptable for most modern uses. </p>
      <p>So my personal conclusion is that historical 'interpretations,' trying to capture what you find best in an old typeface, are more worth while to put effort into, rather than striving for the probably unreachable goal of 'authenticity'--which may not be the most desirable even if you closely approximately it.</p>
