      <p>Your question about ink spread with photopolymer is interesting--I hadn't thought of it. </p>
      <p>Gerald Lang, 'Bieler,' is a printer using photopolymer and sometimes posts here, so perhaps he will come on and tell us. He has said in the past that there is ink gain, and he takes this into account in choosing typefaces. But I don't know if the gain is the same as with metal. </p>
      <p>A metal piece of type has beveled sides leading down from the face to the body of the type. My assumption has been that ink gets on these sides, and then is picked up by the paper when the metal is pressed into it, and this is a big part of ink spread--not simply the ink squeezing out from under the face. (We are talking about thousandths of an inch, but still quite noticeable on the page.) I don't know if photopolymer has the beveled sides.</p>
