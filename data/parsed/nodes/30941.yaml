      <p>David, Founders Caslon was a wonderful achievement, and many people have used it successfully, and will in the future. I think there will never be a more authentic revival of Caslon. </p>
      <p>However, as I have worked on Caslon, I have become aware that it does have limitations even considered as the 'authentic revival' which, as Justin Howes said in your link, was the goal of his immense labors. </p>
      <p>First, as he says in the link you have given, he printed samples anew from metal with light inking, and then scanned these. The scans, no doubt cleaned up to some extent, became the typeface, along with some added characters he drew. </p>
      <p>This lightly inked look is not the authentic look of either the original 18th century Caslon, nor of the metal revivals well into the 20th century. As I understand it, in the 18th century, the technology did not give a consistent height-to-paper of metal types. To compensate for this, and get all the types to print, the types were heavily inked, and printed into dampened paper. If you look at 18th century examples, or the facsimile version of Caslon's 1766 specimen book, annotated by James Mosley (Journal of the Printing Historical Society 1981/82) you will see that they are far blacker than Founders' Caslon. Furthermore, the way Caslon was used in metal revival is that it was often heavily inked, or was printed on rough paper precisely to get the ink spread. </p>
      <p>In other words, many people felt that the 'ink gain' of the old type was part of the distinctive, attractive look of Caslon. Printing of the revivals generally had less ink gain than the original, but still had substantial gain when printed on rough paper or heavily inked. Whatever inking you prefer, the fact is that Founder's Caslon printed by offset is not going to have the look and feel of either the original 18th century Caslon, or even metal revivals, printed on rough paper. </p>
      <p>There is a second problem I will go into in another post.</p>
