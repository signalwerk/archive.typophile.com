      <p>William</p>
      <p>I haven't been watching the list that much lately but was just now reading through this thread. </p>
      <p>Yes, there is ink gain in letterpress, whether it is metal or engraving or photopolymer. Justin came up with a uniform percentage gain at one point and posted his table of findings on the PPLetterpress list. One of the very early entries. He suggested I start the list for the "investigative printer" and early on, contributed some very significant information. Hrant later looked at the data and, as I recall, concurred. Technical reports from the printing industry indicate 5% in regard to photopolymer (digital-to-analog).</p>
      <p>So, yes, digital fonts should be reduced by that degree or more when using digital-to-analog. Most of the early digital fonts were reproduced from photofilm, not metal patterns, and were thus a bit weightier in the first place. And that has not changed.</p>
      <p>Justin did indicate to me at one point that he was thinking of producing a letterpress version of the Caslon as he thought it looked best printed on handmade paper. The letterpress configured digital font Rialto had just appeared on the scene. Founders Caslon, as it stands, is not useful for letterpress printing as it carries a bit too much residue. While I am fond of faux letterpress digital fonts (for some odd reason) they are extremely difficult to work with using the letterpress process. This is not to demerit the work, it is one of the most valid historical studies we will probably ever bear witness to.</p>
      <p>Basically, the more anemic looking the face, the better it is going to work digital-to-analog. The only alternative is to alter the weight of fonts in FOG or FL and to hell with the EULA nonsense.</p>
      <p>The relief pattern of photopolymer is not the same as it was in metal type and this can be a problem. The closer the surface proximity of imaging the shallower the subsurface relief (that is just the way photopolymer works) and often digital fonts are outfitted with kerning pairs that cause problems in this regard, which can cause "bridging."</p>
      <p>Gerald<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
