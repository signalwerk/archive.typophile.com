      <p>I haven't done all that much letterpress printing, but I have printed with both metal and PP; my experience is that PP usually produces a bit <em>more</em> gain, because the metal type was cut with letterpress in mind, and photopolymer plates are made from digital files - since the vast majority of digital typefaces are optimized for offset rather than letterpress, it seems to me that the effect is often more gain.</p>
      <p>As far as the shape, the way that the plate material washes away from the printing surface on a plate does tend to produce a pretty pronounced beveled effect.</p>
