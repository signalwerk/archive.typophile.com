      <p>Joe posted <a href="http://www.k10k.net/newspost.aspx?id=13740" rel="nofollow">an update on his condition</a> to k10k on Thursday, but I only just stumbled across it today:</p>
      <p><em>“Hi. I just wanted to give everyone an update on my health. Last Wednesday I went to the ER for severe pain to my side and back. I soon found out that I had massive internal bleeding of the left kidney. I was in the hospital for a week and had surgery and 4 blood transfusions. I'm out of the hospital now and on bedrest. I am doing much better but I still have a way to go to get back on my feet. The only really bad thing is that I don't have health insurance...”</em></p>
      <p><em>“And I wanted to say a huge thank you to everyone that sent me get well messages!! It was very nice to hear from all of my good friends, old friends, and soon-to-be new friends that I have never met. Thank you! Thank you! It means alot to me. Feel free to email me at kral (at) testpilotcollective.com.”</em></p>
