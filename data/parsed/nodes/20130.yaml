    <p>Mike Cina <a href="http://www.k10k.net/newspost.aspx?id=13730" rel="nofollow">reports on K10k</a> that fellow type designer Joe Kral (of <a href="http://www.testpilotcollective.com/" rel="nofollow">Test Pilot Collective</a>) is suffering from ill health:</p>
    <p><em>I hate to be the bearer of bad news, but K10k author and friend, Joe Kral is in the hospital from kidney failure. Both of his kidneys are in bad shape. His eyesight is very weak, but I am sure he would love to hear happy thoughts and prayers from you when he feels good enough to read. His email is <a href="mailto:kral%40testpilotcollective.com" rel="nofollow">kral [at] testpilotcollective.com</a>.</em></p>
    <p><em>Also, if you have a printing press and want to donate printing... I know there is talk about maybe putting together a "show" about designers without health insurance (he does not have health insurance) and other subject matter to help raise awareness of situations that happen to artists more often than you would like to know about. So if you don't have insurance, it would be a good time to think about that.</em></p>
    <p><em>Thank you for taking the time to read this. I hope you are well &amp; that Joe gets better ASAP.</em></p>
    <p>Dreadful news! Let's all wish Joe a speedy recovery.</p>
