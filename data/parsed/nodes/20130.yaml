      <p>To help ease Joe Kral's medical expenses, <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a> will be passing along all proceeds from the sales of <a href="http://www.veer.com/search/results.aspx?keyword=joe+kral" rel="nofollow">Test Pilot Collective</a> fonts directly to Joe for the months of June through August. More details will be announced on <a href="http://blog.veer.com/" rel="nofollow">our weblog</a> in the very near future. </p>
      <p>Get well Joe.</p>
