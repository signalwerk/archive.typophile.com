    <p>Hi all,</p>
    <p>I'm looking for any references, information and examples of logotypes that include underlined like-ordinals characters (mostly a and o). I'm quite sure I've seen those on older buildings from the beginning of twentieth century. I am assuming that it has something to do with Art Deco and maybe what had come right next after it. But all I have found was one image of a rich family's tombstone in Prague (attached).</p>
    <p>(I'm sorry, but I can't come up with a better title.) </p>
    <p>Thanks!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/forum-files/odkolek2.jpg" width="800" height="533" alt="">
