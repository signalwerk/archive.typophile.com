    votes: 0
    html: "<p>Interesting topic – I came across the phenomenon a couple of days ago in Vienna, Austria on a building where it said \"ERBAUT ANNº 1912\" (double underline under the ordinal). Meaning: \"built in [the year] 1912\", so your Art Nouveau suggestion would fit. The origins might have something to do with ordinal indicators – Wikipedia has quite an extensive <a href=\"https://en.wikipedia.org/wiki/Ordinal_indicator\">article</a> on the a, o and other superscript forms and their function; my guess would be that in decorative lettering this original function was sometimes retained, sometimes wrongly adapted (as in my example, where Latin \"anno\" would not need any ordinal), and sometimes the form lost the original function and took over another (variation, visual balance, ornamentality)… I'll try to find more examples.</p>"
    html_clean: "<p>Interesting topic – I came across the phenomenon a couple of days ago in Vienna, Austria on a building where it said \"ERBAUT ANNº 1912\" (double underline under the ordinal). Meaning: \"built in [the year] 1912\", so your Art Nouveau suggestion would fit. The origins might have something to do with ordinal indicators – Wikipedia has quite an extensive <a href=\"https://en.wikipedia.org/wiki/Ordinal_indicator\" class=\"link-external\">article</a> on the a, o and other superscript forms and their function; my guess would be that in decorative lettering this original function was sometimes retained, sometimes wrongly adapted (as in my example, where Latin \"anno\" would not need any ordinal), and sometimes the form lost the original function and took over another (variation, visual balance, ornamentality)… I'll try to find more examples.</p>"
