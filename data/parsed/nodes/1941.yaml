  html: <p>I'm looking for a good handwritten font with alternate versions of characters for a project that I'm currently working on.  I've read through the discussion of <a href="http://www.typophile.com/forums/messages/30/14521.html">favorite handwritten fonts</a> from back in August, but I think I'm looking for something a little more specific.   <br> <br>What I'm looking for is something that possibly has the feel of <a href="http://www.myfonts.com/fonts/enrich/ingrid-font/">Ingrid Font</a> but with the functionality and alternates that <a href="http://www.adobe.com/type/browser/P/P_1725.jhtml">Caflisch Script Pro</a> has.  But, most specifically, I'd take any handwritten font as long as it has some good alternate characters. <br> <br>Can anyone help?   Thanks!</p>
  html_clean: <p>I'm looking for a good handwritten font with alternate versions of characters for a project that I'm currently working on.  I've read through the discussion of <a href="http://www.typophile.com/forums/messages/30/14521.html" class="link-lost">favorite handwritten fonts</a> from back in August, but I think I'm looking for something a little more specific.   <br> <br>What I'm looking for is something that possibly has the feel of <a href="http://www.myfonts.com/fonts/enrich/ingrid-font/" class="link-external">Ingrid Font</a> but with the functionality and alternates that <a href="http://www.adobe.com/type/browser/P/P_1725.jhtml" class="link-external">Caflisch Script Pro</a> has.  But, most specifically, I'd take any handwritten font as long as it has some good alternate characters. <br> <br>Can anyone help?   Thanks!</p>
