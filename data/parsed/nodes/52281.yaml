    html: |-
      <p>Nick, this is not true…</p>
      <p>You can determine (on a per document-basis, as well as) systemwide which application will be used with certain file types.<br>
      In your case. Select a PDF in the Finder. Open its info panel (Command-I).<br>
      Change the default program in the “Open with" drop-down. Click “Change All…”.</p>
      <p>Easy peasy.</p>
      <p>OTOH Preview is a far better behaving program when you need to print your PDF. Acrobats dialogs are hidden in a maze of possibilities.</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
