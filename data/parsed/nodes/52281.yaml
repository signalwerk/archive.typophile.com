    html: |-
      <p>I make it a practice to have multiple PDF viewers because, especially when dealing with Linux-using clients you need to see how a PDF will render in multiple programs.  It's almost like browser wars for a while there, some didn't support transparency, some didn't show certain effects.</p>
      <p>I'm typically not a big fan of proprietary solutions that give the creator all of the power and not the user.  Like you called it, it is <em>hijacking</em> and if your first impression of a file is a bad one, that really sets the mood for the whole thing.</p>
      <p>It's like when you go to a horrible flash website and their stupid ambient techno loop clashes with your beautiful Nine Inch Nails playing in iTunes and you end up having to pause your wonderful song because they didn't have the knowledge or foresight to put a <em>mute music</em> button on the site.</p>
      <p>A solution I would consider if I was putting a PDF online or sending to multiple users instead of presenting on my own machine, is to save the PDF as normal and give them advanced warning.  As much as I hate splash pages, it would be far more courteous to have a splash page that said something like, <em>This project is designed to look best when viewed fullscreen.  Press <strong>Control-L</strong> or <strong>Command-L</strong> to enter fullscreen and press <strong>esc</strong> to return to your desktop.  Enjoy!</em></p>
    html_clean: |-
