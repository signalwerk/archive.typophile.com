      <p>This is <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Image-Club-Graphics&amp;ffam=Harry%20Plain%20-%20Regular&amp;fid=327fc8f76b5a3afd2b5c320736749f03&amp;fsize=60&amp;text=pure%20fun&amp;fit=1" rel="nofollow">Harry Plain</a></strong> once upon a time [1992] digitized by Image-Club-Graphics, now also available by RedRooster collection.</p>
      <p>According to myfonts.com:<br>
      <a href="http://www.myfonts.com/fonts/redrooster/harry-pro/" title="http://www.myfonts.com/fonts/redrooster/harry-pro/">http://www.myfonts.com/fonts/redrooster/harry-pro/</a></p>
      <blockquote><p>This revival of Harry is based on the original design by Marty Goldstein (and C.B. Smith).<br>
      Goldstein, born in Chicago in 1939, was the co-founder of the groundbreaking Creative Black Book. He graduated from the Pratt Institute in 1960.<br>
      Harry, first published by VGC in 1966, was named for his father. ITF has added four new weights to the original six.</p></blockquote>
