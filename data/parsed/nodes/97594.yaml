    html: |-
      <p>What kind of kerning are we talking about? GPOS or kern table?</p>
      <p>A full kern table with 10920 pairs (the maximum that any application will use) adds about 65 kB to a font file.</p>
      <p>For GPOS kerning, it’s not that simple to calculate.</p>
