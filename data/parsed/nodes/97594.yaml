    html: |-
      <p>In the latest updates of some of my fonts I have removed the KERN table, and used GPOS kern only. This saves, as Jens said, around 50kb per font.</p>
      <p>For desktop fonts it's not necessary, but for web-fonts it's a great optimization.</p>
      <p>Keep in mind that web developers do everything in their power, and spend considerable effort, to optimize things (images, css, javascript, etc) saving every possible byte.  And not only bytes... they also optimize the number of request that the browser make to the web server (by combining multiple files in just one, for example sprites for images and creating only one JavaScript file containing all the code from multiple files).</p>
      <p>Optimized webfonts are always welcome by web developers, because the size of the files is an important concern in many situations.</p>
      <p>More info about optimizations and performance here: <a href="http://developer.yahoo.com/performance/rules.html" title="http://developer.yahoo.com/performance/rules.html">http://developer.yahoo.com/performance/rules.html</a></p>
