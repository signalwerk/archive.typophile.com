      <p>well, as Trade Gothic is a Linotype face, and their <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a> prohibits modifications, you may have to contact them to arrange for the changes you need.</p>
      <p>ParaType has a cyrillic version, if not they're the best at doing customizations.<br>
      If they're not available, I'd have to recommend considering P22 to do a custom job for you. :^D&gt;</p>
