      <p><cite> You can describe a pronunciation of your choosing, and then, if you wish, leave the explaining to me.</cite></p>
      <p>I pronounce 'Ireland' as [ajɹ̩ln̩d] and for me 'our' is homophonous with 'are', both being pronounced as [aːɹ].</p>
      <p><cite>I was hoping you would recognize that I meant one of the contracted versions by apocope in which "New Orleans" has only two syllables. Perhaps natives, preferably some who have no understanding of our debate, of that place would illuminate us.</cite></p>
      <p>You mean [n(ə)wɔə̯ln̩z]? There's no [j] in that pronunciation.</p>
      <p>As for 'chi', if the pronunciation you have in mind is [xiː] or [χiː], then these represent attempts on the part of English speakers to imitate the Greek pronunciation; they cannot be used as evidence for contrasts in English.</p>
      <p>If you want to describe a phonological system for English, you need to first specify which variety of English you are concerned with, and only examples from that particular variety of English can be used in your argumentation. One major reason why different dialects of English exhibit differences in pronunciation is because they do not share the same phonological system.</p>
      <p><cite>You direct the interested reader to some textbooks, but neglect to specify whether these contain the answers to the questions, such as in terms of date ranges, rather than merely the methods by which they may be obtained. If the answers are not in the books mentioned, you may as well tell me now so as not to waste my time. If the answers are in the books, you could tell us the page numbers.</cite></p>
      <p>Yes, they both contain answers to the questions you ask. Otherwise I would not have referred you to them. I give you a reference rather than an answer because the answers are complex, involving multiple interacting sound changes involving coda simplification and vowel changes, all of which occurred over a period of time of around two centuries or so, and not necessarily the same period of time for all geographical locations in England (some are in fact still ongoing). I cannot give you a specific page numbers because the relevant discussion occupies a major portion of the sections on Late Middle English and Early Modern English phonology. However, a very simple answer would be that these changes were well in progress, but not entirely complete, by the beginning of the Great Vowel Shift (which also occurred over time and not simultaneously in all dialects), and would have been complete by around 1650 or 1700 for London English. The relevant changes occurred well after yogh was no longer in common use, either as a representation of /x/, /j/, or any of the various allophones of /g/.</p>
      <p><cite>Etymology is important for the design of stable systems of writing, so that they will endure to the future by not being as susceptible to further reforms</cite></p>
      <p>Most of the criticisms of English spelling which I've seen from spelling-reform advocates stem from the fact that English spelling <em>does</em> preserve etymological information, so I fail to see how incorporating this will make it resistant to further reforms. Of course, you still haven't explained what you think is wrong with current English spelling despite having been asked.</p>
      <p><cite>My system of writing addresses these concerns by maintaining existing permutations and numbers of letters in words</cite></p>
      <p>In other words, your simpler, 'easier to learn' system requires that people be well versed in standard English spelling before they can even attempt to learn your system. That is definitely a unique feature of proposed spelling reforms.</p>
      <p>André</p>
