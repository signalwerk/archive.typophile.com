    html: <p>The phonetic symbols in the cell of the fourth column and eighth row of the right hand side table should be the same as those in the two cells of the fourth column and fifth and sixth rows. I expect that it should have been possible to guess its approximate correct sound from the patterns assigned to the other vowels in the right and middle tables. The letter when it has this pronunciation may in most cases be considered to be a rhotacized vowel because it most usually occurs before a following letter "r". Nevertheless, this rhotacized vowel would not be considered to be a phoneme in itself separately from all non-rhotacized vowel phonemes, since it does not occur contrastively with respect to them in the absence of a following "r".</p>
