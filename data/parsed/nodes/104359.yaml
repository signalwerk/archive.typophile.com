      <p>I still cannot really figure out what your diagram is supposed to represent. As mentioned in my previous post, you really require some sort of accompanying explanation. Are the rows and columns in your table intended to be meaningful (in which case they should have labels), or is this simply a list arranged in this fashion for considerations of space?</p>
      <p>Trying to figure out your intention on my own is hampered by the fact that it is difficult (at least for me) to try to relate the three tables to one another when I am forced to mentally rotate two of them in order to match up cells in the three tables. It would be considerably easier if you simply presented a single (upright) table in which each cell contained three elements, or better yet a simple list of all of your symbols along with their intended phonetic values.</p>
      <p>Also, you need to provide examples of actual words written in your proposed system.</p>
      <p><cite> Now, the voiced velar fricative /ɣ/ may not be pronounced as such in the English language, but it can occur in words imported from foreign languages, such as the Irish Gaelic language. Consider the word "ogham". If there be no letter to represent it in spelling, then there would be a very high likelihood that the phoneme would lose its original pronunciation.</cite></p>
      <p>This seems like a very strange design consideration for me. The word 'ogham' at one time contained a ɣ in Irish, but it doesn't contain one in modern Irish, and it certainly doesn't contain one in English. Since there is no English phoneme /ɣ/ it *can't* lose it's pronunciation. If you want to indicate how the word is pronounced in the source language from which it was borrowed (or in this case how it was originally pronounced in that language) then you are abandoning any pretext of creating a phonemic system.</p>
      <p>Moreover, if you plan on applying this principle more generally, you're going to need a hell of a lot more symbols in your alphabet. How, for example, is one going to spell a word like 'ocelot' without some symbol to represent the voiceless lateralized alveolar affricate? (the Nahua word from which this is derived is pronounced /ōˈtˢēlōt͜ɬ/.) Words of Indian origin would require the addition of symbols for retroflex and breathy-voiced consonants, we'd need tonal marks for words of chinese origin, etc. etc. etc. Why single out the particular cases of x and ɣ?</p>
      <p>André</p>
