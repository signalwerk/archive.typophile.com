      <p><em>whether this attitude was from a feeling of unpleasantness when compelled to replace a more predictable orthography by a more irregular one, and whether these opinions were measured by an actual delay in competency of literacy</em></p>
      <p>The latter. The success of ITA in getting children reading and writing <em>in that system</em> at an accelerated rate (compared to children starting with standard English spelling) was clearly significant, but eventually the children who were part of the ITA experiment needed to be assimilated into regular classrooms and typical language teaching in the standard orthography. The person whom I know best who went through this experience reported difficulty learning standard spelling. It isn't hard to imagine a better managed transition process, one which took the move from ITA to standard orthography as a separate stage to be properly studied and refined. In the event, ITA kids were simply dumped into regular classrooms, usually under teachers who had neither time nor inclination to give them special help. I reckon the progress of a typical ITA kid could be graphed as a rapid initial acceleration, followed by significant slowing, eventually ending up behind the group in standard orthography literacy.</p>
