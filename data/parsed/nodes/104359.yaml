      <p>As far as I recall, I first read about the Initial Teaching Alphabet from a book about the year 2005 or 2006, where the impression given to me was that it had promoted an encouraging enhanced rate of progress for pupils from the early stages of learning to read compared to traditional spelling. This reported outcome as the interpretation of the experimental evidence suggested to me a glimmer of hope for spelling reform. Clearly there is an opportunity to learn from this experience.</p>
      <p>On the other hand, I value that you inform us of the observations of the participants of these studies, as a contribution of objective evidence whose emphasis may not have been consulted for the academic or scholarly publications (Researchers overlook the fact that their subjects can have better insights into the data). But I find this intriguing for a number of reasons. For the people you have encountered who were involved in this project, could it be clarified when you say "the transition to standard orthography was always problematic" whether this attitude was from a feeling of unpleasantness when compelled to replace a more predictable orthography by a more irregular one, and whether these opinions were measured by an actual delay in competency of literacy, and whether the end result was more or less favourable. You see, sometimes faster development can be induced by more challenging conditions. For example, the Japanese do not seem to allow themselves to be hampered by their very intricate system of writing. Or could it be that it is the flexibility of their minds that is willing to tolerate it, and hence how it has endured? However, I understand that education prolonged for a number of years is required for such complex writing. In turn, I worry that our education is impeded by too much time being spent trying to teach spelling, where more time could be devoted to other subjects such as mathematics instead. May I ask, is it that you have come into contact with people exposed to this trial because of mutually living near a location in which it was conducted, or is it that those who had been taught to read by the Initial Teaching Alphabet had a higher probability of being drawn to typography in later life?</p>
      <p>In any case, extrapolating the final outcome rather than the earlier advances of the Initial Teaching Alphabet to the system that I am proposing is probably not appropriate. According to how I understand it, an aspect of the Initial Teaching Alphabet included alterations to the permutations of letters within words, particularly of the silent vowel letter  as an indicator of long or tense vowels. In contrast, in the system of reform for spelling that I propose, there are no changes to the permutations or order of letters in any words, and moreover, no letter is added or removed, such that all words maintain the same number of letters. If it was the transition to a different arrangement of the letters in spelling that caused problems for moving beyond the Initial Teaching Alphabet, then reasonably these problems are likely to be absent from the system that I propose. All the while, we can expect my system to exhibit the advantage of the original more rapid development in literacy that the Initial Teaching Alphabet was found to impart, because presumably the reason for this enhanced progress was owing to its better correspondence of sign to sound.</p>
      <p>.quadibloc 6 Jul 2013 — 10:01am: "I have my own scheme, [...] instead of using the apostrophe to mark where two letters don't form a dipthong [sic], I use the period"</p>
      <p>Interesting concept. In my system, a centrally placed dot, which can optionally be shaped somewhat like a tiny asterisk, is used as a syllable marker.</p>
      <p>.agisaak 6 Jul 2013 — 10:44am: "it is difficult [...] when I am forced to mentally rotate two of them in order to match up cells in the three tables. "</p>
      <p>Admittedly, I have been realising that it would have been more sensible for me to have not arranged the tables in such a way that they appear to be almost upside-down. The opposing orientation, achieved by rotating the tables by a half turn, would have been more logical. But the same information is conveyed nonetheless. A certain amount of obscurity can be a useful deterrent, without obfuscating that fact that the knowledge is there in plain view.</p>
      <p>"Also, you need to provide examples of actual words written in your proposed system."</p>
      <p>I agree that actions would speak louder than words, and am almost regretful that I have resorted to so much explanation. Something on my wish list would be a really nice compact pangram. In principle, one could be devised with the help of an anagram generator, if it could use a specially-made dictionary of the vocabulary of the English language expressed correctly in the characters of the system of reform for spelling that I am proposing.</p>
      <p>"Since there is no English phoneme /ɣ/ it *can't* lose it's pronunciation."</p>
      <p>English used to contain a sound similar to [ɣ] and had a letter for it called "yogh", but the letter was removed from the Olde English alphabet, and it is difficult to say whether that was due to increased Latinization, or whether the sound had already disappeared, since we have no voice recordings from that time.</p>
      <p>"How, for example, is one going to spell a word like 'ocelot' without some symbol to represent the voiceless lateralized alveolar affricate?"</p>
      <p>I hadn't heard of this word until you mentioned it. It would not be difficult to display the original pronunciation of the voiceless lateralized alveolar fricative, by using the character of the eighth column and tenth row of the middle table in combination with a lateralization diacritic. But the damage has already been done, and it is now pronounced as the unvoiced alveolar sibilant. So, to spell the word using the Anglicized pronunciation, use the symbol of the tenth column and fifth row of the middle table. But I think that you will find that if it is spelt (spelled) according to how it was originally pronounced, then people will start to pronounce it correctly (though maybe not the lateralization bit, being too unfamiliar), thereby proving my argument that the correct pronunciation would not be lost if a means of representing it is available. For such rare words, people obtain their pronunciations from the written spelling rather than from oral communication. So for them, all you need to change their pronunciation is to change their spelling.</p>
      <p>"Words of Indian origin would require the addition of symbols for retroflex and breathy-voiced consonants"</p>
      <p>There is another system of writing that I have that has symbols and procedures for representing such things and others.</p>
      <p>"we'd need tonal marks for words of chinese origin"</p>
      <p>There is nothing in my proposal preventing tonal marks. I do not consider tones to be phonemes. Phonemes are supposed to be proper segments, but tones typically change across a segment. It is from this same reason that diphthongs are not phonemes. Tones have to be considered to be suprasegmental, or occupying another tier of a featural hierarchy. Tones can be indicated by diacritics, just as they are in Pinyin.</p>
      <p>"Why single out the particular cases of x and ɣ"</p>
      <p>The phoneme /x/ is included as one of the sounds of English according to the Chambers dictionary that I access, which in my opinion is a much better English dictionary than others I have seen. If you are arguing against me, you are also arguing against the reputable Chambers dictionary. That leaves only the case of the single phoneme /ɣ/. Are you going to try to undermine the predominantly phonemic basis of the system in the right hand table just because of a dispute about whether this one is a phoneme? At this point I point out that the sound in the fifth column and second row of the right hand table probably should be unvoiced rather than voiced. Its character in the middle table was the last to be assigned.</p>
      <p>"you are abandoning any pretext of creating a phonemic system."</p>
      <p>I never said this was a pretext to the exclusion of other considerations such as etymology and dialectal compatibility. I just wrote, by way of a clarifying explanation:</p>
      <p>5 Jul 2013 — 3:45am: "I emphasize that my spelling reform is phonemic more than phonetic to the degree of allophonic."</p>
      <p>That it is phonemic more than phonetic does not mean that it has to be completely phonemic. Anyway, the middle table, which is the actualization of the spelling reform, is not supposed to be phonemic, and the way I have portrayed the right hand table is not phonemic. I avoided showing any phonemic system that I have for at least these reasons:<br>
      1. If I had used a phonemic system, nobody would have understood it, without it receiving an explanation in itself. It would be silly to explain something by Spanish if the audience only understands English.<br>
      2. The phonemes can be conveyed by aggregations of symbols from the International Phonetic Alphabet that is known to linguists. Therefore, I used the International Phonetic Alphabet.<br>
      3. Some people would attempt to implement the phonemic system instead of the system in the middle table. A case in point:</p>
      <p>.quadibloc 6 Jul 2013 — 10:01am: "avoid the need for new characters. So people can reform their spelling right away"</p>
      <p>However, to do so would be destructive to our heritage of literature. It is necessary for any proposed reform to be backwards and forwards compatible, as mine is. I think this is what was meant by:</p>
      <p>.John Hudson 4 Jul 2013 — 3:55pm: "misguided ways, to 'simplify' English spelling."</p>
      <p>Nevertheless, by means of the right hand table, the system in the middle table can be converted to a phonemic system by a programmable procedure.</p>
      <p>I have prepared a scan of the other single table that I discussed on 5 Jul 2013 — 4:38pm, but have yet to upload it. I have a general question about file format relevant to future posts as well. I am not sure whether Typophile can accept PDF format. It would seem to make sense to me for efficiency of file size to use PDF file format for documents containing a mixture of images and font text, so that the text can be viewed crisply at high resolution magnification, instead of posting the whole as an image, where much memory would be wasted on white space. I am aware of the guidelines at <a href="http://typophile.com/filter/tips" class="link-lost">http://typophile.com/filter/tips</a> and <a href="http://typophile.com/readme" class="link-lost">http://typophile.com/readme</a>.</p>
      <p>The phonetic symbol in the sixth column and [edit] ninth row of the right hand table should be j instead of i, but this does not matter from the phonemic rather than phonetic point of view, because although I recognize them to be phonemically contrastive, in my phonemic system they can be represented by the same phoneme when syllable boundaries are shown.</p>
