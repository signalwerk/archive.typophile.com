      <p>agisaak<br>
      12 Jul 2013 — 8:35am<br>
      "I pronounce 'Ireland' as [ajɹ̩ln̩d] and for me 'our' is homophonous with 'are', both being pronounced as [aːɹ]."</p>
      <p>For me, "our" and "are" are also homophonous, but their vowels are monophthongal and have the same pronunciation as the first part of "Ireland". The pronunciation in this dialect is different from the typical American pronunciation that I have heard. We know that it is a diphthong contracted to a monophthong because of the following "r" because in the semantically related adjective "Irish", the initial letter remains diphthongal, and this is allowed because the word partitions into two syllables as "I.rish". However, the word "Ireland" with that diphthong cannot be partitioned in the same way, because to attempt to do so would create a phonologically impermissible consonant cluster, as in (unattested) *[ajrl.ænd] or *[ajr.lænd] or *[aj.rlænd]. Instead, the result is forced to be more like [ɑr.land] or [ɑrl.and]. But another strategy, as manifested in the American dialect, is to add extra syllabicity, as you have shown for the sonorants.</p>
      <p>"There's no [j] in that pronunciation."<br>
      It is just that I was wondering whether the syllables [nwɔ] and [njɔ] are allowed by the phonotactic rules you advocate.</p>
      <p>"they cannot be used as evidence for contrasts in English."<br>
      If the contrasts are there in English, however they got there, that is enough evidence for me.</p>
      <p>"only examples from that particular variety of English can be used in your argumentation"<br>
      There is an intention in the reform that I propose that many dialects will be accommodated, not just from the present time. You have a here-and-now outlook to phonology, whereas I would prefer to adopt a time-dependent and geographically encompassing theory of the patterns of sound arrangements. The reason for this is to encourage stability and depth for the spelling.</p>
      <p>"I fail to see how incorporating this will make it resistant to further reforms."<br>
      I would suspect that spelling reform advocates criticize etymological information not for its own sake, but rather because it is their way of expressing the difficulty in predicting pronunciation from the spelling. But in my proposal, the pronunciation is shown unambiguously.</p>
      <p>"your simpler, 'easier to learn' system requires that people be well versed in standard English spelling before they can even attempt to learn your system. "<br>
      The system allows pronunciation for reading and the language to be easier to learn, just as vowel pointing allows the reading of Hebrew text to be easier to learn for those who do not know the spoken language sufficiently. Writing, as I already wrote, is a different matter. The reading material for learners is to be provided for them, not by them.</p>
      <p>For convenience, I have prepared paraphrases of my understanding of some points of our arguments from earlier. </p>
      <p>.agisaak:</p>
      <p>1. /ɣ/ is not a phoneme of English [5 Jul 2013 — 11:56am; 6 Jul 2013 — 10:44am; 8 Jul 2013 — 11:06pm].</p>
      <p>2. [ɣ] used to exist in Irish [6 Jul 2013 — 10:44am], and in English, where it was an allophone of the phoneme /g/ or a sound of the letter symbol g, which could be represented by the letter ȝ [8 Jul 2013 — 11:06pm].</p>
      <p>3. The letter ȝ could also represent [w] and palatal [j], both of which are allophones of the phoneme /g/ or sounds of the letter symbol g [8 Jul 2013 — 11:06pm]; and [x] [9 Jul 2013 — 12:04pm].</p>
      <p>4. Phoneme /g/ was never pronounced as [x] (codally) [10 Jul 2013 — 8:48pm].</p>
      <p>5. [x] was an allophone of the phoneme /h, x/ [8 Jul 2013 — 11:06pm] and could be represented by the letter ȝ [9 Jul 2013 — 12:04pm].</p>
      <p>6. The phoneme /x/ [I think you meant as though it were a distinct phoneme from /h/ and /ɣ/] occurs in only a rather small number of dialects [5 Jul 2013 — 11:56am] [I think you meant that [x] of Modern English only occurs in a small number of dialects].</p>
      <p>.dudefellow:</p>
      <p>1. /ɣ/ may not be pronounced as such in English [5 Jul 2013 — 4:38pm].</p>
      <p>2. /ɣ/ occurs in Irish Gaelic [5 Jul 2013 — 4:38pm]; and [ɣ] used to exist in English, where it could be represented by the letter "yogh" (ȝ) [8 Jul 2013 — 2:33pm].</p>
      <p>3. The letter ȝ might also have been used to represent [x] [9 Jul 2013 — 9:48am].</p>
      <p>4. "The issue was not whether /h/ and /g/ remained distinct phonemes" [10 Jul 2013 — 8:18am]. </p>
      <p>5. [x] (and speculatively [ɣ], see also 10 Jul 2013 — 8:18am) is an allophone of the phoneme /x/, which was represented by the letter h in Old English, and possibly by the letter ȝ in Middle English [9 Jul 2013 — 9:48am].</p>
      <p>6. The phoneme /x/ occurs in certain dialects [5 Jul 2013; 8 Jul 2013 — 2:33pm].</p>
