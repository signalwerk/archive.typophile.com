      <p>Old English is Anglo-Saxon, but by Olde English I meant Middle English.</p>
      <p>agisaak 8 Jul 2013 — 11:06pm: "extension to [ɣ] and [w] (other 'non-hard' pronunciations of g) was fairly incidental given that these variants remained predictable. [ɣ] was never phonemic."</p>
      <p>It seems to me that [ɣ] and [x] represent the same phoneme in Middle English. In Old English there is the word "þurh" meaning "through", where the letter "h" represents /x/. This word was spelt "þurȝ" in Middle English.</p>
      <p>"Diphthongs most certainly are phonemic. In English there are four phonemic diphthongs (/aj/, /aw/, /ɔj/, and /ju/) -- these behave as single units"</p>
      <p>I disagree. Phonologically the diphthongs in English do not behave as single units. This is made evident when they become rhotacized, so that the initial part of the diphthong becomes the same phonemically as another unrhotacized monophthong.  /ju/ is a combination of a non-syllabic approximant or glide semi-consonantal onset followed by a monophthongal syllabic nucleus. The other diphthongs are syllabic vowel nuclei followed by non-syllabic semi-consonantal codas. This theory that I devised simplifies the phonological rules for English.</p>
    html_clean: |-
