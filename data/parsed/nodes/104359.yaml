      <p>Yesterday I pointed out the phonetic symbols in the cell of the sixth column and fifth row and the cell of the eighth column and seventh row. In both of these cells, another allophone represented by their different phonemes is the one that is represented in the International Phonetic Alphabet by "double storey a" where it occurs in diphthongs. It might seem strange to some of you if in my phonemic system, the same allophone can be represented by different phonemes; for example the first part of the diphthongs in the words "how" and "high". There are also differences in pronunciation that arise due to dialectal variation, which is a good reason for the benefits of a phonemic orthography. The table of the right hand side is supposed to contain phonemes rather than the more precise phonetic allophones, but I had to represent them by the symbols of the International Phonetic Alphabet, even though this leads to overcrowding in the cells, because there is not a well-known publically disseminated conventional phonemic symbology for English; although even if there were, it would probably be not the same as the system that I use. The acoustic, phonological and articulatory phonetic theory that I developed indigenously for the English language differs from the one that I expect educated phoneticians to be familiar with. I emphasize that my spelling reform is phonemic more than phonetic to the degree of allophonic. To explain the distinction between a phoneme and an allophone by way of a typographical analogy, consider the graphical difference between a letter modified by the context of its surrounding letters in a ligature compared to how it normally appears when not ligatured. We would not say that the "f" in the ligature "ffi" is a different letter of the alphabet than an ordinary "f". Similarly, phonemes are phonetically distorted from their recitation forms to allophones by the context of their adjacent phonemes, such as by articulatory assimilation and anticipation, but we would not in every case say that they become different phonemes by these processes, unless it is something akin to epenthesis or elision, as examples.</p>
      <p>In the cell of the eleventh column and fifth row of the table on the right hand side, the phonetic symbol should be "z" rather than "s".</p>
      <p>quadibloc 4 Jul 2013 — 9:51pm: "how it is proposed to reform English spelling [...] having one symbol for each sound, that usually involves increasing the size of the alphabet to about 45 letters"</p>
      <p>As you can see from the table on the right hand side, the phonemic system that I propose for the English language has far fewer symbols than 45. In fact, I manage quite well with only thirty, two of which are very rare except etymologically and tend to be pronounced correctly only in words imported from foreign languages. The discrepancy in number of symbols to sounds arises for the most part in what other phoneticians call "rhotacized vowels". I do away with such a notion, as I do not consider them to be phonemes. I also divide diphthongs each into two phonemes, which are then treated as merely allophonic variations of monophthongal targets. This gets rid of some more phonetic symbols for vowels.</p>
