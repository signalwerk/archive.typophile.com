      <p>Although I've seen 'digram' used as a synonym for digraph, I've never seen the latter defined as anything other than a pair of letters representing a single phoneme. The term bigram is used in cognitive psychology to refer to arbitrary pairs of letters, but digraph is a standard term in orthographic description for exactly what you describe, along with trigraph etc. all the way up to hexagraph (I know of only one, in an Irish dialect).</p>
      <p>By the way, even if digraph were not the appropriate term for two letters indicating a single sound, diphthong most definitely is not. A diphthong is a gliding vowel: not one sound but two sounds, made by movement of the tongue during pronunciation of a syllable (the Greek word <em>diphthongos</em> actually means 'two sounds'). Crucially, a diphthong is a linguistic phenomenon, not necessarily an orthographic one, i.e. a spelling system may or may not record diphthongs distinctly from single vowels. In English spelling, diphthongs are most often indicated by following consonants: hIGHwAY, cOWbOY.</p>
