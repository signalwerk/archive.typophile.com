      <p><cite> The opposing orientation, achieved by rotating the tables by a half turn, would have been more logical. But the same information is conveyed nonetheless. A certain amount of obscurity can be a useful deterrent, without obfuscating that fact that the knowledge is there in plain view.</cite></p>
      <p>Why rotate them at all? Why not present everything in the same orientation? I don't see how you can view obscurity as something useful when trying to present information.</p>
      <p><cite>Something on my wish list would be a really nice compact pangram. In principle, one could be devised with the help of an anagram generator, if it could use a specially-made dictionary of the vocabulary of the English language expressed correctly in the characters of the system of reform for spelling that I am proposing.</cite></p>
      <p>This really would fail to be informative. If you want to provide illustrative examples of your system, I'd present multiple examples illustrating your system through the use of *short* words, each illustrating a single usage of each letter found in standard English orthography. For example, for orthographic <em>u</em>, I'd present your revised spellings for a list of short words such as 'cut', 'put', 'cute' etc. along with other words which would contain the same symbols in your revised system, such as 'boot', 'book', etc.</p>
      <p><cite>"Since there is no English phoneme /ɣ/ it *can't* lose it's pronunciation."<cite><br><cite>English used to contain a sound similar to [ɣ] and had a letter for it called "yogh", but the letter was removed from the Olde English alphabet, and it is difficult to say whether that was due to increased Latinization, or whether the sound had already disappeared, since we have no voice recordings from that time.</cite></cite></cite></p>
      <p>Middle English (not old English) <em>ȝ</em> was originally simply a graphic (insular) variant of <em>g</em>. It came to be used as a distinct letter primarily to distinguish hard [g] from palatal [j] since the distribution of these two sounds had become largely unpredictable following the merger of the umlauted vowel series with the front vowels. It's extension to [ɣ] and [w] (other 'non-hard' pronunciations of <em>g</em>) was fairly incidental given that these variants remained predictable. [ɣ] was never phonemic. Its loss was triggered by the extension of <em>y</em> to include those instances of [j] which were derived from /g/ as well as those derived from /y/). We don't need recordings to reconstruct a relatively accurate timeline of when these events occurred and any decent introduction to historical English phonology will provide that.</p>
      <p><cite>"How, for example, is one going to spell a word like 'ocelot' without some symbol to represent the voiceless lateralized alveolar affricate?"</cite><br><cite> I hadn't heard of this word until you mentioned it.</cite></p>
      <p>Strange. Its a fairly common word, though perhaps I'm displaying a North American bias here since AFAIK they aren't found in europe (apart from in zoos and as pets of Spanish artists).</p>
      <p><cite>It would not be difficult to display the original pronunciation of the voiceless lateralized alveolar fricative, by using the character of the eighth column and tenth row of the middle table in combination with a lateralization diacritic. But the damage has already been done, and it is now pronounced as the unvoiced alveolar sibilant. </cite></p>
      <p>No damage has been done -- the English pronunciation is and always has been /ɑsəlɑt/. The original aztec pronunciation is really irrelevant to English orthography, just as the Irish pronunciation of 'ogham' or 'lough' is irrelevant to English. That was the point I was actually making.</p>
      <p>Your suggestion that you might have ways of representing retroflexion, breathy voice, tone, etc. makes it very unclear what the actual goals of your system are. You start by claiming you want to make a (largely) phonemic system for English, but then seem to shift to wanting a phonetic system which represents sounds found in the sources of borrowed words, which differentiates between various dialectal pronunciations, etc.</p>
      <p><cite>For such rare words, people obtain their pronunciations from the written spelling rather than from oral communication. So for them, all you need to change their pronunciation is to change their spelling.</cite></p>
      <p>Why would they want to change their English pronunciation? What's wrong with the one they're using now?</p>
      <p><cite>I do not consider tones to be phonemes. Phonemes are supposed to be proper segments, but tones typically change across a segment. It is from this same reason that diphthongs are not phonemes.</cite></p>
      <p>Diphthongs most certainly are phonemic. In English there are four phonemic diphthongs (/aj/, /aw/, /ɔj/, and  /ju/) -- these behave as single units with respect to the phonotactics of English and thus must be treated as such (the treatment of tones is more complex, since tones behave very differently in the various languages which employ them and their representation will be different for (e.g.) Sinitic and African languages).</p>
      <p><cite>The phoneme /x/ is included as one of the sounds of English according to the Chambers dictionary that I access, which in my opinion is a much better English dictionary than others I have seen. If you are arguing against me, you are also arguing against the reputable Chambers dictionary.</cite></p>
      <p>Different dictionaries are based around different sets of principles. Chambers is very much an etymologically-oriented dictionary which attempts to treat both modern and archaic forms, so it is unsurprising that it includes representations for <em> sounds </em> found in earlier versions of English, but that does not mean that they are <em>phonemes</em> in modern English (and /x/ was never a phoneme distinct from /h/ -- whether one chooses to label this as /h/ or /x/ isn't particularly important, but there's no reason to introduce a separate symbol to treat them separately when dealing with English).</p>
      <p><cite>That it is phonemic more than phonetic does not mean that it has to be completely phonemic. Anyway, the middle table, which is the actualization of the spelling reform, is not supposed to be phonemic, and the way I have portrayed the right hand table is not phonemic. I avoided showing any phonemic system that I have for at least these reasons:</cite><br><cite>1. If I had used a phonemic system, nobody would have understood it, without it receiving an explanation in itself. It would be silly to explain something by Spanish if the audience only understands English.<cite></cite></cite></p>
      <p>Unfortunately, your current table is also fairly difficult to understand. It doesn't really matter what type of system you envision; an explanation is still required.</p>
      <p>In an earlier post, I suggested you needed to outline what you thought the problems with modern English spelling are before presenting your own system, to which you responded simply: <cite>Sometimes people want the problem instead of the solution.</cite> Let me clarify that the reason I feel you need to answer this question is that it will help establish exactly what you think the desirable features of a writing system ought to be, and thus what principles your own system is guided by. In your presentation thus far the latter is particular unclear since you seem to vacillate between wanting to represent phonemics, phonetics, etymology, dialect variation and also claim to be motivated by ease of teaching. Without you actually enumerating your goals (and presenting the system itself more clearly) it is difficult to evaluate how well you achieve these goals.</p>
      <p>André</p>
