      <p>agisaak 10 Jul 2013 — 8:48pm: "What exactly am I trying to explain here? What specific pronunciations did you have in mind?"</p>
      <p>You can describe a pronunciation of your choosing, and then, if you wish, leave the explaining to me.</p>
      <p>"Again, I don't know what specific pronunciation you have in mind"<br>
      I was hoping you would recognize that I meant one of the contracted versions by apocope in which "New Orleans" has only two syllables. Perhaps natives, preferably some who have no understanding of our debate, of that place would illuminate us.</p>
      <p>"June 24th, 1509."<br>
      A date range would have been more credible, but if you provide a date, it should be accompanied by the references to least some of its original and published source texts, which at least can be dated, since I would not want anyone to be too gullible. You discuss a time for the disappearance of the letter symbol "yogh", for which the visual evidence of only source texts is adequate, but you fail to provide dates as answers to the questions involving the sounds, although these are the questions for which audio recordings might have been useful. You direct the interested reader to some textbooks, but neglect to specify whether these contain the answers to the questions, such as in terms of date ranges, rather than merely the methods by which they may be obtained. If the answers are not in the books mentioned, you may as well tell me now so as not to waste my time. If the answers are in the books, you could tell us the page numbers.</p>
      <p>"In my dialect, the above words are pronounced [ha:j], [kʰa:j], [kʲʰi:] ~ [cʰi:] (probably intermediate between the two), and [çi:], respectively. Again, I fail to see what requires explanation."</p>
      <p>The initial onset consonant of one of the pronunciations of "Chi" given in the dictionary that I consult (and, having heard it, I think I would have known this pronunciation without the dictionary) differs from that in the pronunciations for the words "key" and "he", while they all have the same vowel. They are different words and the differences are not caused by allophonic variation. Therefore, these consonants are all mutually contrastive phonemes. In Greek, the sound of "chi" was aspirated and differentiated by that property from the unaspirated sound indicated by the letter "kappa". In English, aspiration for plosives is only a predictable allophonic variation (as is indeed the palatalization that you have shown).</p>
      <p>Etymology is important for the design of stable systems of writing, so that they will endure to the future by not being as susceptible to further reforms, and so that they will preserve the past by allowing a greater literature to be accessible for longer periods of history. My system of writing addresses these concerns by maintaining existing permutations and numbers of letters in words, whilst at the same time allowing the phonemic pronunciation to be shown explicitly, so that this could be tracked in time without loss of literacy. This is more than our current system can achieve, without, as you say "using a large number of converging sources of evidence". There is more than one meaning in this that I wrote: </p>
      <p>8 Jul 2013 — 2:21pm: "It is necessary for any proposed reform to be backwards and forwards compatible, as mine is."</p>
