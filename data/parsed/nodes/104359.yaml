      <p>agisaak 12 Jul 2013 — 10:45am:<br>
      "it's the same phoneme involved regardless of notation."<br>
      I expect this to be deemed so because /x, h/ pronounced as [x] is thought to occur only finally in words, while [h] does not occur in that position.</p>
      <p>"those instance of *g which developed into [j] would have merged with that phoneme."<br>
      The situation seems to be similar to "hard" and "soft" g in current English orthography. They have the same grapheme, but their pronunciation can usually be predicted by whether the following vowel is a front vowel, indicated in spelling by the letters i or e, or a back or central vowel, indicated by the letters u, o, or a. The "soft" g or affricate has the same sound as that usual for the letter j.</p>
      <p>"though the handling of /ju/ isn't going to be any different (/aj/, on the other hand...)."<br>
      I would have similar concerns for /aw/, considering other pronunciations of the word "our" again. The notion of at least three of the four diphthongs you list as single units seems to be disputable, and this calls into question the sole remaining one.</p>
