      <p>There is another way of portraying the same information but by means of only a single table, with each letter grapheme of the English Roman alphabet appearing only once on one axis and a list of sounds on the perpendicular axis. Some of the sounds are phonemes, while others are diphones, because sometimes a letter can behave as a diphone in English spelling. Then the cells in the table at the intersections of the columns and rows contain the characters that I propose for the spelling reform. I drew such a table before designing the picture figure with three tables that I have shown above, and perhaps I can scan a version for you soon. The reason that I made the diagram with the three squares is that it suggests how the characters in the middle matrix can be given keyboard encoding shortcuts in such a way that each letter can be typed by a permutation of just two keys selected from only eleven, using the co-ordinates of the columns and rows; and also because I thought it would look better by not having empty cells. </p>
      <p>agisaak 5 Jul 2013 — 11:56am: "Why are there so many duplicate symbols in your lower two charts?"</p>
      <p>There may seem to be "duplicates" in the lower two tables because, firstly, most letters of English spelling are capable of more than one pronunciation. So a letter will appear in the left hand table as many times as the number of possible pronunciations it could have. Secondly, a given sound, or set of sounds*, can be represented in more than one way by different letters, and therefore those sounds appear more than once in the right hand table. For any given cell in the middle table, its corresponding sound occupies the equivalent row and column of the right hand grid, while the letter of English spelling that was used for it before the spelling reform appears in the same row and column of the left hand square.</p>
      <p>*The above paragraph should address the question:<br>
      "you claim to be creating a phonemic system, why do /ts/, /ks/, /gz/ and /ft/ appear in your table at all? These are sequences, not phonemes."<br>
      Such examples are diphones, and often affricates, consisting of two phonemes each, but are represented by single letters in English spelling.<br>
      The right hand table in some cases attempts to show their true diphonic nature as would be required for a proper phonemic system. An algorithm could be used to convert from the spelling system of the middle square table to a perfectly phonemic system that can be placed in the right hand table.</p>
      <p>"(/ɣ/ and /x/ occur [...] despite the fact that the former is not a phoneme of English, and the latter only occurs in a rather small number of dialects. "</p>
      <p>First of all, "number of dialects" and the number of speakers of a dialect are mainly quite irrelevant to optimality of a system of spelling reform, or even invention of new spellings or orthographies or systems of writing for previously unwritten languages. An optimal system of writing for a particular language should be designed in such a way as to be accommodating to all or as many as possible of the spoken dialects. This can be achieved by explicitly including in the spelling letters for sounds that are pronounced by one dialect although they may be silent or absent or pronounced differently in the same word in another dialect of that language. If it is by being pronounced differently in a dialect rather than by being silent or absent that is the cause of the difference between the dialects, and if that different pronunciation or phoneme is not a member of the inventory or set of phonemes in another of the dialects, then the orthography should represent the sound as though it is being pronounced in the dialect to which the sound is unique. Thereby, speakers of dialects for which the phone is not part of their inventory will still be able to read the spelling by simply substituting what would be probably the phonetically nearest sound that corresponds to the letter in their dialect, while the speakers of the dialect in which the sound is a unique variety will not be at a loss to supply the pronunciation that it has for them, and in that manner local regional and minority accents will not be marginalized or oppressed.</p>
      <p>Now, the voiced velar fricative /ɣ/ may not be pronounced as such in the English language, but it can occur in words imported from foreign languages, such as the Irish Gaelic language. Consider the word "ogham". If there be no letter to represent it in spelling, then there would be a very high likelihood that the phoneme would lose its original pronunciation. The unvoiced dorsal fricative /x/ does occur in the Gaelic word "loch", and is maintained as such in certain dialects, so why should it not be given a place in the spelling? After all, people who do not know how to pronounce it correctly are well entitled to use the nearest sound that they can find in their own dialect, and should not encounter any difficulty in reading its specially assigned letter, since they could make their compensatory substitution every time and get used to it.</p>
      <p>Moreover, characters for these phonemes are useful in retaining etymological information, which dictionary makers and influencers of spelling have been keen to preserve. Hence, my proposal does not damage etymological clues in the spelling. I think this is important, although other people might not agree, but what is there to lose by an extra silent letter in a word if it is helpful to the reader in understanding the meaning, the history and origins of the word, and its constituent morphemes?</p>
      <p>agisaak 5 Jul 2013 — 11:56am: "you'll need to point out what you think is wrong with the current system"<br>
      JamesM 5 Jul 2013 — 8:59am: "Or convince the general public to start using the new system, which seems extremely unlikely."</p>
      <p>Sometimes people want the problem instead of the solution. I have more to say about this, but I think this post is long enough for now. Let me say that I would intend it to be used initially for teaching non-native students for second language acquisition, because they do not already know how to pronounce the words, and the old spelling does not help them. The new reformed system is analogous to providing pointing of vowels in Hebrew or Arabic for learners who do not know the language well enough yet as speakers. Similar aids should be almost as necessary for learners of English, so that they would not need to carry a dictionary of pronunciations around with themselves wherever they go in order to read. Writing is a different matter.</p>
