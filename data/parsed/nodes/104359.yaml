      <p><cite>Consider these examples and try to explain them:</cite><br><cite>1. Ireland;</cite><br><cite>2. Our.</cite></p>
      <p>What exactly am I trying to explain here? What specific pronunciations did you have in mind?</p>
      <p><cite>1. Fjord;</cite><br><cite>3. There is a certain informal and casual or slang word that I have not seen written but only heard, and which is a neologistic portmanteau of "yeah" and "no" used to mean an apathetic, disaffected or indifferent combination of their meanings, pronounced like [njɛ]. Perhaps we could spell it as "nyeah".</cite></p>
      <p>The first is a borrowing and the second is an example of expressive vocabulary, neither of which should be used in phonological argumentation since they tend to violate normal English patterns.</p>
      <p><cite>2. "New Orleans" pronounced with the colloquial dialect;</cite></p>
      <p>Again, I don't know what specific pronunciation you have in mind, but I can't offhand think of any which might be problematic. The only place where [j] might occur in this word that I can think of would be in /nju/ which is perfectly consistent with what I wrote in my previous post.</p>
      <p><cite>The issue was not whether /h/ and /g/ remained distinct phonemes, but whether [x] and [ɣ] were allophones of the same phoneme /x/. Are you accepting that different phonemes can have the same sound sometimes?</cite></p>
      <p>Sure, phonemes frequently undergo contextual neutralization, but in this particular case it was simply an instance of the same orthographic symbol being used to represent either coda /h/ (pronounced [x]) or coda /g/ (pronounced in a variety of ways depending on the preceeding sound, but not as [x]).</p>
      <p><cite>Since you know so much about it, perhaps you can tell us then:</cite><br><cite>1. When the letter yogh was lost;</cite></p>
      <p>Yogh became increasingly less frequent (being replaced by gh in all of its secondary (i.e. non-[j]) uses) throughout the middle English period and is normally considered to have died out by the end of the Middle English period, though one still finds the occasional instance in Early Modern English. There's no specific time when it was lost.</p>
      <p><cite>2. When the sound [ɣ] was lost;</cite><br><cite>3. When the sound at the end of the word "cough" became an unvoiced labiodental fricative.<br>
      Some examples of dated evidence, such as rhymes in Middle English verse, illustrating these phenomena would support your argument. Those for whom the entire corpus is not sufficiently well-known and who do not specialize in historical linguistics have to take your word for it.</cite></p>
      <p>June 24th, 1509.</p>
      <p>Seriously, though, the changes involving coda consonants in English involve a large number of interacting processes which occurred through the Middle English period and into Early Modern English, each of which must be justified using a large number of converging sources of evidence (none of which have any bearing on your proposed spelling reform). If you are interested in this topic, a good introduction to the history of English would be Baugh and Cable's <em>A History of the English Language</em> (afaik the most recent edition is the 6th from 2012). Another good introduction would be Celia Milward's <em>Biography of the English Language</em> (my copy is from 1996 but I believe there are more recent editions). The former contains more examples, whereas the latter is somewhat more readable.</p>
      <p><cite>How do you explain the contrasts of these words:</cite><br><cite>High;</cite><br><cite>Chi (the letter of the Greek alphabet, as in Chi-squared distribution);</cite><br><cite>Key;</cite><br><cite>He</cite></p>
      <p>In my dialect, the above words are pronounced [ha:j], [kʰa:j], [kʲʰi:] ~ [cʰi:] (probably intermediate between the two), and [çi:], respectively. Again, I fail to see what requires explanation.</p>
      <p>More importantly, though, variant pronunciations triggered by adjacent vowels aren't the sort of thing which should play any role in orthography, so I don't see how these examples are supposed to clarify anything about your proposed system.</p>
