      <p>@dudefellow:<br><cite>In turn, I worry that our education is impeded by too much time being spent trying to teach spelling, where more time could be devoted to other subjects such as mathematics instead.</cite></p>
      <p>Knowing how to spell correctly and well is only important if one has to write, in addition to reading. And the class time spent on teaching spelling is not enough to do the job; a person has to actually do a lot of reading to assimilate the proper spelling of words as second nature.</p>
      <p>Thus, an irregular spelling system has the benefit that it makes it harder for uneducated people to obtain jobs for which they are not qualified; it makes it harder to pretend you have an education that you don't really have. This is also why China stuck with characters for so long.</p>
