      <p>@Nick: I don't either. I've asked him a few questions about his system but he seems more interested in discussing these points than providing clarifications on what he has proposed.</p>
      <p>@dudefellow:</p>
      <p><cite>It is just that I was wondering whether the syllables [nwɔ] and [njɔ] are allowed by the phonotactic rules you advocate.</cite></p>
      <p>They're not rules which I 'advocate'; they're simply rules which accurately describe standard, north american English (and, to the best of my knowledge, RP English as well). The rules found in Southern US English will be different because those dialects have a different phonological inventory, and different phonotactics, though the handling of /ju/ isn't going to be any different (/aj/, on the other hand...).</p>
      <p><cite>The phoneme /x/ [I think you meant as though it were a distinct phoneme from /h/</cite></p>
      <p>No, no dialect of English (past or present) has distinguished /x/ from /h/. I apologise for my inconsistency above. When discussing Old English, its conventional to refer to that phoneme as /x/, whereas for modern English /h/ is more usual, but it's the same phoneme involved regardless of notation.</p>
      <p><cite>The letter ȝ could also represent [w] and palatal [j], both of which are allophones of the phoneme /g/ or sounds of the letter symbol g</cite></p>
      <p>Not quite. (Old) English *g developed into a number of different sounds including [g], [j], [w], and [ɣ]. However, these represent historical sound changes rather than allophonic variations. [ɣ] and [g] were definitely allophones of /g/, but because /j/ already existed as an independent phoneme in English, those instance of *g which developed into [j] would have merged with that phoneme. There was also a phoneme /w/, but *g developed into [w] only in environments where that phoneme didn't normally occur, so that situation would be open to several different analayses.</p>
