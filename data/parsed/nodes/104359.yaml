      <p>I could mention I have my own scheme, described on <a href="http://www.quadibloc.com/other/phonint.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">this page</a>; basically, it uses an idea proposed by Mont Follick, except that instead of using the apostrophe to mark where two letters don't form a dipthong, I use the period, on the basis that apostrophes already apppear in the middle of words for contractions, but periods don't, so this avoids confusion.</p>
      <p>Dipthongs are used to avoid the need for new characters. So people can reform their spelling right away, without spending money on new fonts, and (well, back in the old days) new typewriters, new matrix-cases, new Selectric golfballs, new phototypesetter negatives. (I'm using "dipthong" in an inexact way, to mean any multiple-letter combination that stands for a sound, so I'm including consonant combinations like th and ng, not just the ones for vowel sounds.)</p>
