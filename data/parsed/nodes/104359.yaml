      <p><cite>It seems to me that [ɣ] and [x] represent the same phoneme in Middle English. In Old English there is the word "þurh" meaning "through", where the letter "h" represents /x/. This word was spelt "þurȝ" in Middle English.</cite></p>
      <p>Yogh was also used to represent [x], but /h/ and /g/ remained distinct phonemes. Orthography does not always reflect phonology.</p>
      <p><cite>I disagree. Phonologically the diphthongs in English do not behave as single units. This is made evident when they become rhotacized, so that the initial part of the diphthong becomes the same phonemically as another unrhotacized monophthong. /ju/ is a combination of a non-syllabic approximant or glide semi-consonantal onset followed by a monophthongal syllabic nucleus. The other diphthongs are syllabic vowel nuclei followed by non-syllabic semi-consonantal codas. This theory that I devised simplifies the phonological rules for English.</cite></p>
      <p>You'd have to give an example of the rhoticization which you have in mind.</p>
      <p>If you treat the diphthongs as sequences rather than units, the phonotactic description of English becomes unnecessarily complicated. For example, English normally bars /j/ from occuring in onsets following plosives. We don't get words like *kyat or *pyot. We do however, get words like /pjur/ 'pure', /kjut/ 'cute', and (for many dialects) /tjun/ 'tune'. Similar issues arise with respect to syllable codas. If we treat diphthongs as vocalic units, we can simply rule out CjV and VjC combinations, whereas if we treat them as sequences the phonotactic restrictions turn into a rather complex mess in which specific pairings must be treated as exceptional (and where the exceptions themselves make little sense in terms of the sonority scales which normally govern phonotactic restrictions).</p>
      <p>/aw/, /aj/ and /oj/ are pretty much universally treated as phonemic diphthongs. There's less consistency with /ju/ since it exhibits some conflicting properties (initial ju behaves as a sequence (it's <em>a eulogy</em> rather than <em>*an euology</em>) whereas medial ju does not).</p>
