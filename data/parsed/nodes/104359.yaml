      <p>Although I can't really determine, from the image, how it is proposed to reform English spelling, while most reforms do aim at simplifying the spelling by making the rules uniform, as that implies having one symbol for each sound, that usually involves increasing the size of the alphabet to about 45 letters, because that's about the number of phonemes in the English language.</p>
      <p>So the fact of a larger alphabet in itself doesn't mean things will be made more complicated.</p>
