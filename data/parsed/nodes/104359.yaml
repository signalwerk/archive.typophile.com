      <p>That’s right. Bigram = 2 arbitrary written units taken together, usually for statistical reasons. This term is used in computational linguistics, psycholinguistics, and related areas of research. Digraph = 2 written units used together to represent a single phoneme. This term is used in the discussion of orthography and writing systems. There’s also the graph vs. grapheme distinction (cf. phone/sound vs. phoneme) which overlaps this. A graph is any unit of writing, a grapheme is a unit of writing that is meaningful in a particular writing system or orthography. So &lt;ch&gt; is made of up two graphs &lt;c&gt; and &lt;h&gt;, each of which is an independent grapheme in English, but together they are also a distinct grapheme that happens to be a digraph. The mapping from grapheme to phoneme is not one-to-one, so that &lt;ch&gt; can be /tʃ/ as in &lt;church&gt; /tʃɝtʃ/, /ʃ/ as in &lt;sachet&gt; /sæʃei̯/, or even /x/ as in &lt;loch&gt; /lɔx/.</p>
      <p>A diphthong most generally is any pair of vowels that occur in a single syllable. So /ai̯/ in ‘bite’ /bai̯t/ is a diphthong, as is /ei̯/ in ‘bait’ /bei̯t/, /ou̯/ in ‘boat’ /bou̯t/, /au̯/ in ‘bout’ /bau̯t/, and so forth. (The inverted breve below means that the vowel is not syllabic.) In ‘sighing’ /sai̯.ɪŋ/ the /ai̯/ is a diphthong but the /ɪ/ is in the second syllable and is a monophthong, a lone vowel. Notice the mismatch here between orthography and phonology, so the &lt;igh&gt; in ‘sigh’ represents the diphthong /ai̯/ even though &lt;gh&gt; looks like it should be a consonant. Likewise in ‘bite’ the &lt;i&gt; represents /ai̯/, but here only with the &lt;e&gt; <em>after</em> the following consonant: &lt;iCe&gt; = /ai̯C/ (where C is any consonant). Without that final &lt;e&gt; you get /ɪ/ instead, as in ‘bit’ /bɪt/.</p>
