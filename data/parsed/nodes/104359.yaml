      <p>Since I can't make heads or tails of your charts, it's rather difficult to comment on this other than by saying that some sort of explanation should be included along with this. Why are there so many duplicate symbols in your lower two charts? (/ɣ/ and /x/ occur at least twice despite the fact that the former is not a phoneme of English, and the latter only occurs in a rather small number of dialects. /f/ and /v/ appear at least four times each for reasons which are a complete mystery, as do many other symbols.) Also, if you claim to be creating a phonemic system, why do /ts/, /ks/, /gz/ and /ft/ appear in your table at all? These are sequences, not phonemes.</p>
      <p>Most importantly, if you want to propose a spelling reform, you'll need to point out what you think is wrong with the current system before trying to explain why people should bother with your new system.</p>
      <p>André</p>
