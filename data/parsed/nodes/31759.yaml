      <p>It's only accessible through the glyph panel and scripting, not a simple UI toggle (and not in styles).</p>
      <p>As for why, because not enough people care. There has been some movement in this area recently, TBD whether it will result in any changes. Of course, if you're still on a five-year-old version of the app, you won't see any changes.</p>
