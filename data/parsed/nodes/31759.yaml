      <p>I am trying to decide the scheme for accessing ligatures in my upcoming faces. Today, I think am going to mostly ignore the eccentricities of application support, and arrange things as I feel suits the specification descriptions.</p>
      <p>Do others feel that OpenType is "young enough" that conventions, compatibilities and methods of access are still in progress? I know there are features I could include that aren't yet supported by any major application.</p>
