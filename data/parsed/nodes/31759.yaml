      <p>Actually, InDesign supports the 'hist' feature. However, it can only by accessed through scripting, not through the UI. The property is called 'otfHistorical'.</p>
      <p>The last page of the <a href="http://www.adobe.com/type/browser/pdfs/OTGuide.pdf" rel="nofollow">OpenType User Guide for Adobe Fonts</a> (PDF file) shows you a list of which features are supported by Adobe's applications.</p>
