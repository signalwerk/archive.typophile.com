      <p>Found an answer here: <a href="http://www.typotheque.com/fonts/opentype_feature_support/" title="http://www.typotheque.com/fonts/opentype_feature_support/">http://www.typotheque.com/fonts/opentype_feature_support/</a></p>
      <p>That, with some Googling of Typophile (since the search here choked) explains it a bit.</p>
      <p>If anyone else is reading this, some Adobe CS programs seems to support -hlig-, but only by binding control to the UI element for -dlig-.</p>
      <p>-hist- on the other hand, is supported by Quark.</p>
      <p>What a bummer, as that leaves the choice of the user a bit bound up.</p>
