    html: |-
      <p>Oh, liga and clig (for standard and contextual standard ligatures) for ligatures, and dlig (for special ligatures), should be your first choices. If an application supports OT features, then these two are most likely supported.<br>
      For additional things, maybe one of the Stylistic Set features might do. But these were not intended for ligatures and are available in InDesign CS2 only. (And in some recent Apple applications, but here, one can only select one Stylistic Set feature at the same time. Which is why I mention it only in parentheses.)</p>
