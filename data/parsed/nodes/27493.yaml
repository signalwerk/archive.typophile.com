      <p>They're the same thing.</p>
      <p><a href="http://www.unicode.org/" rel="nofollow">Unicode</a> defines the following code points:</p>
      <ul>
      <li><cite>PRIME</cite> (U+2032): ′
      </li><li><cite>PRIME, DOUBLE</cite> (U+2033): ″
      </li><li><cite>PRIME, TRIPLE</cite> (U+2034): ‴
      </li><li><cite>PRIME, QUADRUPLE</cite> (U+2057): ⁗</li></ul>
      <p>(In case the above symbols aren't rendered properly on your browser, they're all angled.)</p>
      <p>There are other variants of the prime scattered throughout (reversed, modifier letter, and so on), but there is no separate code point for a <cite>foot</cite> symbol. The closest there is is <cite>FOOT, SQUARE</cite>; it's defined in the <cite>Miscellaneous Technical Range</cite> and it looks like a prime hanging inside an opening at the top of a square box.</p>
      <p>The <a href="http://www.unicode.org/charts/charindex.html" rel="nofollow">Unicode Character Names Index</a> does have entries for <cite>feet</cite> and <cite>inches</cite>, but they are simple cross-references to the entries for <cite>PRIME</cite> and <cite>PRIME, DOUBLE</cite>, respectively.</p>
      <p>The <a href="http://en.wikipedia.org/wiki/Prime_(symbol)" rel="nofollow">Wikipedia article on the prime symbol</a> supports this.</p>
      <p>Perhaps the confusion stems from the fact that on typewriters, feet and inches were represented using the same upright symbols used to represent apostrophes and quotation marks.</p>
