      <p>I think you're right about the confusion...as least mine, anyway! The "dumb" apostrophe and quotation mark are to blame - they are not acceptable substitutes for prime and double-prime.</p>
      <p>Thanks for the clarification.</p>
      <p>--Michael.</p>
