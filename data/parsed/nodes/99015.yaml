      <p>Hrant, this is from Harold Lohner’s website:<br>
      <em>I advertise my computer fonts as "original" because I make all the digital fonts myself by hand. Throughout my website and other materials, I am quite clear about the inspirations for my fonts, which may be the earlier creations of others. To me, this sort of "learned borrowing" is an important aspect of the history and practice of art. It is not my intention to rip-off the work of any individual or company; I put my own stamp on my work and fully acknowledge the artists and designers in whose shadows I stand.</em><br>
      Please don’t discredit other people’s work unless you have proof it’s not original.</p>
