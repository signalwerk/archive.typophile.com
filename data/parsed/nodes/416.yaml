    html: <p>Per, I think the first version is a good basic. Hrant said it right, relax and follow the direction the font takes you in. Keep it simple. <br>I like the pointy-left-under-thingy (what is it called anyway?). Use it also for the "a" and "b". With that you can make a really nice font. It will look like leafs from a tree. <br> <br>Keep it up. I'm looking forward for the numerals. <br> <br>Ren</p>
