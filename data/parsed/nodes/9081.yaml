  html: '<p>P22 and The International House of Fonts announce the release of two new typefaces: Mantra and Bramble.   <br> <br>Mantra, designed by Fontana Type Foundry co-founder Amondo Szegi (Hungary), blends the Roman alphabet with Tibetan calligraphy and Hungarian folk influences to create a true hybrid of world cultures in this striking display font. Also available is "Mantra Xperts" which includes several alternate letters and ligatures along with three dozen ornamental mandalas.  <br> <br><a href="http://www.p22.com/ihof/mantra.html" target="_blank">http://www.p22.com/ihof/mantra.html</a> <br> <br>Bramble, designed by American Greetings lettering team member Steven Rapp, is  a lively organic font that draws reference from Roman characters rather than Italic forms. It is also available as a two font set- Normal and Wild. Use Normal for small point-size settings to retain legibility. Combine both for invigorating display settings. <br> <br><a href="http://www.p22.com/ihof/bramble.html" target="_blank">http://www.p22.com/ihof/bramble.html</a> <br> <br>----------------------------- <br>P22 type foundry, Inc. <br>  International House of Fonts <br>  Lanston-P22 <br>  Sherwood Type <br>PO Box 770 <br>Buffalo, NY 14213 <br><a href="http://www.p22.com" target="_blank">http://www.p22.com</a> <br>Phone: 716-885-4490 <br>Fax: 716-885-4482 <br>-----------------------------</p>'
