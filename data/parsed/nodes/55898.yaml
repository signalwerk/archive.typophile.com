    <p>My all time favorite website is the Gucci website: <a href="http://www.gucci.com/" title="http://www.gucci.com/">http://www.gucci.com/</a><br>
    I can't help it, when I'm bored, I often go to this website and see what I can possibly try to convince my dad to buy me. I love the layout of the website because it's really easy to navigate and find exactly what your looking for.</p>
    <p>I also found this website: <a href="http://www.stumbleupon.com/toolbar/#search=design%2520websites&amp;url=http%2525253A//www.robbianodesign.com/" title="http://www.stumbleupon.com/toolbar/#search=design%2520websites&amp;url=http%2525253A//www.robbianodesign.com/">http://www.stumbleupon.com/toolbar/#search=design%2520websites&amp;url=http%...</a><br>
    I came across this website on stumbleupon, and I thought it was pretty interesting when a bunch of pictures of motorcycles popped up considering I just took motorcycle classes over the weekend. I started looking at the website and I like the simplicity of it. I also like the graphics that it uses.</p>
