      <p>Tim, Chalkboard is an homage to the hugely successful Comic Sans.</p>
      <p>This kind of plagiarism is legal in North America, as there is apparently no "point piracy" involved (but you could do a comparison of physical parameters). Technically it may be illegal in Europe.</p>
      <p>No self-respecting type foundry or designer would put their name to it, but Big Silicon can publish this font without damaging its reputation; Apple has no qualms about doing to Microsoft what Microsoft has done several times to others, most notoriously its copy of Palatino.<br>
      Also, there is no general outrage, because Comic Sans is a much despised face--so again, there is a double standard.<br>
      The fact that this is a free (bundled) font may also effect the optics, further lessening the stigma.</p>
      <p>However, despite Comic Sans and Chalkboard being "infra dig" with professional designers, Chalkboard has never acquired the cachet of Comic Sans, even amongst Mac users. The why of this may be worth pursuing; is it not as good a design, or does being a sequel to a well established face prejudice against it aesthetically?</p>
