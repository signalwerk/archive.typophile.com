    <p>Hello Everybody,</p>
    <p>I'm currently a student studying Graphic Design and I've been given Apple's Chalkboard typeface to research. So far I have come up with not a lot apart that apple commissioned its design and it was launched in 2003 packaged with Mac OS X Panther.</p>
    <p>I have hence turned to the guru's of Type to ask for some pointers. Does anybody know the following:-</p>
    <p>Who actually designed Chalkboard?</p>
    <p>Is there any special reason behind the typeface's name apart from the hand written black board writing?</p>
    <p>What is the taxonomy of this typeface, Sans, transitional or what what? Where can I find info on typeface taxonomy?</p>
    <p>Does anybody have any suggestions of what typefaces would work in harmony with Chalkboard and which ones in your opinion will totally clash?</p>
    <p>Is there any history behind this typeface?</p>
    <p>Thanks for your help,</p>
    <p>Regards,</p>
    <p>Tim</p>
