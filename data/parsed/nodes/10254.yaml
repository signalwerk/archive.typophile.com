    html: <p>&gt;to consider a new direction <br> <br>I didn't mean to imply that you just have to scrap what you have done. It is a good starting point, but there is so much variety in treatment of the current characters - and some are weaker than others - that there is yet a lot of work to do. For example, there is the issue of consistency of weight. The top to bottom arm on the K, for example, is much too heavy compared to the rest, as well as 'wrong' from the pen point of view.   <br> <br>I don't think that you have to follow 'pen' rules to make a good face. But you do have to create your own 'rules' that have internal consistency and visually work for viewers accustomed to reading Roman letters. I agree with Eben that this is a challenging and worthwhle undertaking. Good luck!</p>
