    html: <p>I don't know if I agree with William completely.  <br> <br>Obviously there is a long western writtten tradition &amp; the traditions are there for very good reasons. On the other hand there has been a really limited amount of work done in chinese brush on western letterforms. The Chinese brush is really versatile and has produced many many styles of writing both formal &amp; running hand/grass writing. I can't think that making beautiful western letterforms is something it *cannot* do. And when it does, the forms may not conform to the established 30 degree angle sense of beauty. Then again, maybe they will. My view is that it is too early to have a good idea about it.  <br> <br>Expecting a good result after a small amount of time would be silly. Most of the work I have seen so far has been poor to maybe okay. Nothing great. Just experiments.  <br> <br>I think it's a worth while project to look for ways to make western letters using a chinese technique and hybrid techniques. <br> <br>How are you holding your brush? <br> <br>I would advise you to try it over &amp; over but in a delibertate way until you find what you are looking for. <br> <br>As for the letters you already have I think that the best ones interpret the idea of western forms with tradtional eastern construction/brush technique.  <br> <br>The capital B begins with a vertical Bone &amp; then runs. It has structure &amp; then a flourish. I think it's pretty good. The D,P &amp; R too.The E &amp; F are weak. KLMN too. The B would make a good piece of chinese writing - the E &amp; F would not. Do you see why? Why not make a curving E like the curves in the B but reversed? Do you know what unical forms are? Look at those too &amp; not just roman shapes. The H &amp; J are a good start too. They need more work &amp; it might be good to kook for other ways of doing them but they are a good solid start. <br> <br>You may also want to look at Jill's work just for ideas for the construction of letterforms in brush or to consider a new direction as William suggested. <br> <br>Have you seen this work? <br><a href="http://www.xubing.com/" target="_blank">http://www.xubing.com/</a> <br> <br>I have also seen the work of a Jpanese artist whose writing was in western characters &amp; numbers but who used a vertical running style. I am sad I cannot remember his name because the work was very inventive &amp; would probably be useful! <br> <br>Good luck!</p>
