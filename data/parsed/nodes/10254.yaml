    html: <p>Oh, thank you for your suggestions! I do think there is something wrong with my font after I had constructed them all, but I couldn't tell what's wrong. I'm very thankful to William, because now I know what is my problem. I used brush to write down all the letter first to see which one looked better, and drew the outlines in computer. I think that's why I lose some rules in my font. I'm also appreciated Eben's suggestion! Your details about the differences among my font are really helpful. And you're right, to do such experiment is really not easy! <br>But I do learn something. Anyway, thank you both! <br> <br>Mili</p>
