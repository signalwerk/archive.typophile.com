    html: <p>The problem with brush fonts is that some of the fundamentals of the Roman font come from the broad pen held at a 30 degree angle. Thus it is easy for something done by Chinese brush to look 'wrong'. For example, in your X and Y, the top-left to bottom-right diagonal should be heavy and the top-right to bottom-left should be thin. You have it reversed.  <br> <br>That being said, some brush display lettering looks great. You can see a master of brush Roman and italic lettering in <a href="http://www.art.net/Studios/Visual/Jillbell/Intro.html" target="_blank">Jill Bell's</a> work. <br> <br>The recent movie title for 'Sin City' is also great.  <br> <br>It does seem to work better for lettering than type. Also I don't know how much of this work is  done with a broad brush, which is more like the pen.  <br> <br>I think you have quite a bit of work to go to figure out how to apply the brush well to Roman fonts, but it should be a fun journey!</p>
