      <p>In the Summer 2001, Vol. 10, issue of Eye magazine, there was an article about the introduction of Dave Farey and Richard Dawson's Times Classic (which I think has since been superceded yet again). </p>
      <p>One illustration to the article shows part of a publicity piece that was produced to accompany the 1932 introduction of Times New Roman and which compares TNR with its predecessor. It looks like some fairly non-descript Modern, typical of the period. I'd never heard that it was referred to as Times Old Roman; that strikes me as a questionable assertion. </p>
      <p>-- Kent.</p>
