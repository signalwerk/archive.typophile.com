      <p>I do not think that the term ‘The Times Old Roman Type’, for the paper’s normal text type, was ever intended as anything but a visual joke when it was set for the image that appeared on the cover of the ‘special issue’ of Monotype’s publicity journal, <em>The Monotype Recorder</em>, issued in 1932 to promote the new type. (Lawson’s assumption that it was a term – so capitalized – that was in use before 1932 must indeed one of his blunders.) Most of the text of the journal is written in a gushing style that means it can only be the the work of Monotype’s new publicity manager, Beatrice Warde.</p>
      <p>‘The Times Old Roman Type’ of the image, which is shown below, does indeed seem to be Monotype’s Modern Extended, their Series 7, a revision of Series 1, their first face, which had been derived from a type of the Edinburgh typefounders Miller &amp; Richard. </p>
      <p><img src="/sites/default/files/old-images/The Times New and Old Roman - MR 1932 500_3742.jpg"></p>
      <p>Here are details of the lower case and capitals of the 9-point size, from a specimen page printed by Monotype in 1971.</p>
      <p><img src="/sites/default/files/old-images/Mono Modern Extended 7 - 9 pt - lc det 500_3954.jpg"></p>
      <p><img src="/sites/default/files/old-images/Mono Modern Extended 7 - 9 pt - caps P to T 500_5536.jpg"></p>
      <p>Such fine hairlines and ink traps might have alarmed the printers of mass circulation papers, but <em>The Times</em> was different, being set on Monotype machines rather than Linotypes, and its small print run was printed slowly on superior paper. It was, as the <em>Monotype Recorder</em> cringingly explained to its readers, a paper for ‘people who count’, who were ‘a wealthy group; a group to which the executives and rulers in every walk of life are automatically attracted’.</p>
      <p>But it is worth noting that the note in the <em>Tally of Types</em> concerning the use by <em>The Times</em> of Monotype’s Series 7 was almost certainly never written by Morison. It does not appear in the first edition, which was made to be ‘privately printed’ in 1953 for his friends by Brooke Crutchley, the University Printer at Cambridge, in order to tell the story in Morison’s own words of the making of the types cut by Monotype and used at the University Press. Morison died in 1967, before the ‘trade edition’ of the book was prepared and published in 1973. This edition was reprinted from the original pages by Godine in 1999, with the addition of an excellent new introduction by Mike Parker but omitting Crutchley’s own preface of 1973, which a pity. </p>
      <p>For the 1973 edition Morison’s original introduction was ‘revised and amplified by P. M. Handover’, who was his research assistant based at <em>The Times</em>. She wove his words together with some from Crutchley’s original ‘postscript’ of 1953 (which was omitted), inserting not only many details of her own but some miscellaneous material that had been put together for the new edition, including a contribution of mine. Correspondence at the University Library in Cambridge suggests that some aspects of her editorial performance tried Crutchley’s patience sorely.</p>
    html_clean: |-
