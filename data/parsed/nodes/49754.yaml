      <p><em>According to Google Books, at least three other publications make the same claim... The only one published before Lawson’s book is the Journal of the Royal Society of Arts. So could that be the original source of the statement?</em></p>
      <p>The reference in the RSA Journal of (I think) 1968 appears simply to be a caption to the image on the front of the special issue of the <em>Monotype Recorder</em>, repeating the words that are set in type, and is neither a claim nor a statement.</p>
