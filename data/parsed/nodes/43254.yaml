  html: |-
    <p>I'm on the exec of a small ultimate frisbee league in Barrie, Ontario.  We're looking for a new wordmark and/or logo. I reckon the wordmark is easier, so have been playing around with a few concepts myself. (I'm definitely not a graphic artist or typographer—just a mechanical engineer who volunteered.) </p>
    <p>This wordmark will go on our website, on jerseys, discs, and potentially other promotional stuff. I'd like it to be clear and legible at a distance for both small sizes (e.g., decals) and larger (jerseys). </p>
    <p>I'm also hoping to reflect the sport: it's co-ed and friendly; modern; fast, "flow-y", and fun.</p>
    <p>This is my <a class="freelinking external" href="http://barrieultimate.com/images/barrieultimate.com_familian.gif" rel="nofollow">first try</a>:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/barrieultimate_5838.com_familian.gif"></div><p></p>
    <p>The font is Familian. I like the flow and roundedness of the font, and the aspect ratio of the block.  However, I think this looked better in my mind's eye than when actually in front of me.</p>
    <p>I'm favouring my <a class="freelinking external" href="http://www.barrieultimate.com/images/barrieultimate.com_century_gothic.gif" rel="nofollow">second concept</a>:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/barrieultimate_6439.com_century_gothic.gif"></div><p></p>
    <p>The font is Century Gothic. I like that it's clean, and the very rounded characters remind me of the round shape of a disc.  Not separating the words is an effect that to me suggests modernity.</p>
    <p>For either, it should work in with either black/white or in colours.  I just added the different colours in the second so that the .com was de-emphasized.</p>
    <p>Any feedback on these concepts would be very much appreciated.  Also, any suggestions for a different font (preferably free or not too expensive) would also be great.</p>
