    html: <p>We have to put ’em in journal body copy all the time. No special styling, no brackets. Break after slashes, underscores, question marks etc (but, as Charles says, <em>before</em> a dot or it'll give the impression that the sentence is finished). Suppress hyphenation, and if the actual URL already has a hyphen in it, then try <em>not</em> to break at that (or it'll look like you've hyphenated) – take the hyphen over to the next line if you must break there. If there are no suitable punctuation marks to break at, but the URL contains strung-together-words (like www. thisisasamplewebaddress.com) then split between words (still without inserting a hyphen). Readers should be savvy enough by now to know that URLs don't have word spaces in them. If the surrounding text can be massaged to keep the URL on one line, all the better. Check long URLs that have got a lot of query gubbins on the end of them – you can often trim a lot of that out and still link successfully to the intended page.</p>
