  html: |-
    <p>Hiya</p>
    <p>Here's a good one. What opinions to people have on suitable ways to display web addresses in body copy?</p>
    <p>The first element to this is to do with punctuation and grammar, in that as a web address sits within a sentence, normal punctuation will apply (period at the end of the sentence). Also, it would be desireable for the url to be displayed on one line, but if it is too long to fit on one line in a column, it should be broken at a suitable place (such as after a slash/virgule). Websters encourages this application, whereas Oxford's New Hart's Rules mentions the perhaps somewhat antiquated use of 'http://' as well as placing the address within angle brackets.</p>
    <p>The second part of this is typographic - unless there was a specific requirement for it (such as a directory), undue attention wouldn't ideally want to be granted to the web address, so as not to disrupt the reader's flow. Therefore the automatic formatting often applied through today's word processors, such as colouring on underlining (troublesome when applied to underscores), are unsuitable, and priority should be given to the readability of the text.</p>
    <p>Any opinions on how you prefer to set web addresses amongst body copy?</p>
