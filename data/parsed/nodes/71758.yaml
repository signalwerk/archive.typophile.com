      <p>We substitute angle brackets (U+2329 and U+232A) for the usual "less" and "greater" characters. This for university press book work, no complaints yet. Kerning is needed, both with the angle brackets and the slashes (esp. the two slashes). Of course, most fonts don't have these characters, just one more reason to have a EULA that lets the end user modify the font.</p>
      <p>As for breaking, don't hyphenate (i.e., add a hyphen), and if you break at a period, the period should come down.</p>
