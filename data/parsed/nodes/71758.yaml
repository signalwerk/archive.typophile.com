    html: |-
      <p>I just checked my <em>Associated Press Stylebook</em>. It recommends using the <code>http://</code> at the start, and a period at the end if the URL ends a sentence. And, if an address must be carried on multiple lines, "split it directly after a slash or a dot that is part of the address, without an inserted hyphen." </p>
      <p>AP also advises to use URLs in running text only when the story specifically mentions a website. If the address is being used merely to direct the reader to a source for additional information, the <em>Stylebook</em> advises putting it in a note at the end of the story.</p>
