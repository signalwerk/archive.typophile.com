    html: <p>When an address is followed by a punctuation, I like to add a space before the punctuation to make clear that it's not part of the address. This is especially useful in e-mail and any other online medium where the address might be automatically converted into a link by software. It also makes it easier for the reader to highlight and copy it if they're saddled with "smart" highlighting. But I think it has a place in print media too. If it ends in ".com" you probably don't need the space, but if there is a full path, it's good to assume that some of the readers you're asking to retype the whole address are going to need all the help they can get to do it right.</p>
