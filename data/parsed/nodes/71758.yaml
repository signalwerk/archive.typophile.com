      <p>&gt; but if it is too long to fit on one line in a column...</p>
      <p>I hate putting long URLs in print documents, as they look disruptive and it's difficult for a reader to actually copy and use that URL. So in cases like that, I usually ask the writer if we could try a different approach, such as just using the site's home page URL, or putting the long URL in a footnote, or some other workaround. Sometimes they agree to a change like that, sometimes not.</p>
