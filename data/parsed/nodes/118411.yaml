    <p>Does anyone have any suggestions or solutions as to how I can squeeze more 'alternates' into a font for use in Illustrator.</p>
    <p>I basically have only 1 ligature, but 6 sets of alternates.<br>
    Standard Ligatures<br>
    Stylistic Alternatives 1<br>
    Stylistic Alternatives 2<br>
    Swash 1<br>
    Swash 2<br>
    Titling 1<br>
    Titling 2</p>
    <p>Currently Illustrator has:-<br>
    Standard Ligatures<br>
    Stylistic Alternates<br>
    Contexual Alternates<br>
    Discretionary Ligatures<br>
    Swash<br>
    Titling Alternates<br>
    Fractions<br>
    Ordinals.</p>
    <p>I could only put them in the following places...<br>
    Stylistic Alternates<br>
    Swash<br>
    Titling Alternates<br>
    .....................or could I?</p>
    <p>I would be missing<br>
    Stylistic 2<br>
    Swash 2<br>
    Titling 2<br>
    They would only be accessible through the glyphs panel.</p>
    <p>IS THERE AN ALTERNATIVE OPTION or SOLUTION?</p>
