      <p>No, none of them are 'best described as intersections of two other features'.</p>
      <p>I've opted for a whole new 'ALT' version of the font.<br>
      I can fit all the other alternative characters in Stylistic Alternates, and Swash now, as I've also removed the others that I may have had to put in Titling.<br>
      It was a far simpler solution for global OTFs to work across all Apps.... and another font for people to buy.<br>
      So it's a win-win.</p>
      <p>Thanks</p>
