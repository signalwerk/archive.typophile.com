    html: <p>Are any of them best described as intersections of two other features? For instance, is Titling 2 composed of Titling versions of the alternate forms in Stylistic Set 1? If so, it shouldn't be its own feature; it should be handled by those two features when they are both on. You just have to be mindful of the order of execution. Even if that's not strictly how they correspond, it is probably still reasonable to game it that way.</p>
