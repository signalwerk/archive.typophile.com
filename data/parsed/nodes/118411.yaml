    html: |-
      <p>Do the sets interact much with one another? If you want the plaintext preserved, I think you're probably stuck with making a second font.</p>
      <p>But if this is only for your own use, or for users who you can expect to follow specific instructions, you could pack your alternates into ligatures. Designate a few easily-accessed characters you won't really need (like  `~^) for "ligature codes" then make A.ss02 into grave_grave_A, or such.</p>
