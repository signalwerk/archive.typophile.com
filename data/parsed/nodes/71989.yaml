    html: <p>I find it a bit chilly, but I guess that's OK, as the font is a bit chilly. I dislike the W rather a lot. The hard angle at the lower left of the b is inauthentic. The hard angle at the top left of the F is inauthentic too; follow the f. Same for capital B and L. The ascenders of capital B, H, K, L rise above caps height in many Gaelic fonts.</p>
