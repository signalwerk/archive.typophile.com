    html: <p>Thanks! I had no idea the answer was so involved.  I thought there would just be a set of fonts out there specifically for this.  My answer was very simple though, just go into MS Word, get symbol for the font, copy &amp; paste into Photoshop.  Who woulda thought it was that easy.  Thanks for the tips on extended symbols for fonts!  Jennifer</p>
