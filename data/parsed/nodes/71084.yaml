  html: |-
    <p>I've been trying for over an hour to find a font that has phonetics, like the curve over the "a" to show a "short a", or a line over an "a" to show a "long a".  I thought this would be so easy to find, but I'm now thinking I'm just not describing the right thing when looking in fonts.com for this.  </p>
    <p>Can someone recommend the name of a serif font with the glyphs that make the words look like they're showing pronunciation from a dictionary?</p>
    <p>Thanks!!</p>
