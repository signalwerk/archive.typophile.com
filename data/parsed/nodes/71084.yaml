    html: |-
      <p>If you have a recent dictionary, you could probably ID the type as one way of getting an answer. Just for a trial, I looked at Adobe's <a href="http://www.veer.com/products/typedetail.aspx?image=ADT0000010#characters" rel="nofollow">Arno</a>, a recent font by Robert Slimbach that I believe was designed to support almost any publishing need. Looking at the glyph map, I see the upside-down 'e' that is the schwa (?), the most common sound in English. At least that gives me encouragement that with all the other accented glyphs that font could support dictionary work. I suspect that most of the newer OpenType families, including Typotheque's Fedra, which I know has been used for dictionaries, according to Typotheque's catalog, would probably support dictionary phonetics with their extended character sets.</p>
      <p>- Mike Yanega</p>
