    html: "<p>I think you can be duly proud of having made such a serviceable, polished face so quickly. With some finishing tweaks (and a bunch more extra characters!) this face could be used to set many types of works very nicely. The color is right on for the proportions. <br> <br>I do have palpable reservations however if this is more than an academic exercise: it's too \"80's Adobe\". It has that flow (which of itself is nice), but honestly it's hard to see too many third-parties getting too excited over it. A certain original modulation is too subtle a thing to be appreciated by people outside a certain circle of type designers! :-/ The overall softness in your joins seems somewhat \"nostalgic\", in a way that most people don't seem to appreciate these days. Or it could all be in my head! :-) <br> <br>Assuming the above even bothers you, I'm not sure what I'd recommend. Probably just finish it in the direction it's going (since it's doing it so well), and have a very nice usable font that strongly demonstrates your abilities of making a solid mainstream text face - not as easy task when you're not closely following an existing source! <br> <br>On the other hand, there are certain things in the font that speak to me a lot, like the beak of the lc \"f\" and the tail of the \"q\" - wonderful features, well executed. If you feel like you have the energy to make Wedge really great, consider pushing as many of the glyphs as possible in that direction. If you do that, I'm not sure what you would do with the stately but static caps: maybe just leave them as is - caps actually exist in a somewhat different world than the lc set (annoying but true). <br> <br>Some specific things: <br>UC: I'd make the \"L\" and \"T\" narrower - helps spacing. I think the tail of the \"Q\" should dip lower. <br>lc: make the ascenders a hair taller. Give the \"g\" a stronger ear. Make the \"m\" narrower. Make the \"r\" braver. The \"s\" is way off. Give the \"y\" a much stronger tail. <br>The asterisk is cool - maybe close it up just a bit. <br> <br>Spacing: It seems slightly loose for the point size that it would sing best in. And it's a bit uneven in spots (like \"e\" is especially loose on both sides). <br> <br>Weights: I'd make four. <br> <br>The sans: It creates a very interesting paradox! The softness really explodes here, and it's hard to say if it kills it or if it makes it highly original! :-/ Looking at it some more, I think I'm liking at a lot, actually - it seems to have a singular voice. <br> <br>hhp <br></p>"
    html_clean: "<p>I think you can be duly proud of having made such a serviceable, polished face so quickly. With some finishing tweaks (and a bunch more extra characters!) this face could be used to set many types of works very nicely. The color is right on for the proportions. <br> <br>I do have palpable reservations however if this is more than an academic exercise: it's too \"80's Adobe\". It has that flow (which of itself is nice), but honestly it's hard to see too many third-parties getting too excited over it. A certain original modulation is too subtle a thing to be appreciated by people outside a certain circle of type designers! :-/ The overall softness in your joins seems somewhat \"nostalgic\", in a way that most people don't seem to appreciate these days. Or it could all be in my head! :-) <br> <br>Assuming the above even bothers you, I'm not sure what I'd recommend. Probably just finish it in the direction it's going (since it's doing it so well), and have a very nice usable font that strongly demonstrates your abilities of making a solid mainstream text face - not as easy task when you're not closely following an existing source! <br> <br>On the other hand, there are certain things in the font that speak to me a lot, like the beak of the lc \"f\" and the tail of the \"q\" - wonderful features, well executed. If you feel like you have the energy to make Wedge really great, consider pushing as many of the glyphs as possible in that direction. If you do that, I'm not sure what you would do with the stately but static caps: maybe just leave them as is - caps actually exist in a somewhat different world than the lc set (annoying but true). <br> <br>Some specific things: <br>UC: I'd make the \"L\" and \"T\" narrower - helps spacing. I think the tail of the \"Q\" should dip lower. <br>lc: make the ascenders a hair taller. Give the \"g\" a stronger ear. Make the \"m\" narrower. Make the \"r\" braver. The \"s\" is way off. Give the \"y\" a much stronger tail. <br>The asterisk is cool - maybe close it up just a bit. <br> <br>Spacing: It seems slightly loose for the point size that it would sing best in. And it's a bit uneven in spots (like \"e\" is especially loose on both sides). <br> <br>Weights: I'd make four. <br> <br>The sans: It creates a very interesting paradox! The softness really explodes here, and it's hard to say if it kills it or if it makes it highly original! :-/ Looking at it some more, I think I'm liking at a lot, actually - it seems to have a singular voice. <br> <br>hhp <br></p>"
