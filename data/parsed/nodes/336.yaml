    html: <p>&gt; the top of the capitals should align with the bottom of the serifs of the ascenders. <br> <br>Or set the word "The" and work from there. <br> <br>BTW, I think your old caps are very nice - but I agree they're less functional in the mainstream. Since they're so much more original than the current set, it would be nice to have them as an alternate. <br> <br>&gt; the sidebearings on my rounds may be too loose. <br> <br>That's actually a direct side-effect of spacing using control strings - assuming that's how you did your spacing... :-/ In real setting the rounds have to be tighter than that, and you can add positive kerns for round-rounds for optimal setting. All this is because round-rounds are linguistically rare. <br> <br>hhp <br></p>
