    html: "<p>this could become very good.  <br> <br>I like the serif a lot. Its very subtle. Text looks good, although i'd tighten the spacing more. <br> <br>Maybe you could try flatening both endings of the lc 's', like you did on the lc 'c'. Or make more look like the uc 'S'. <br> <br>I'd expect a downwards going tail on the ampersand ('&amp;'). <br> <br>I think you should try lowering the contrast in sansserif. To me its looks too much like being the serif version with the serifs cut away. <br>Giving the sans a incised character (e.g. angie sans by JFP) could work here. Although I wouldn't  make its character too strong, but more subtle and detailed like your serif version. <br> <br>Some quick remarks.  <br> <br>--Jacques <br> <br>PS: dont make too much wheights. Your not Lucas de Groot and you should question the need for a lot of wheigths</p>"
