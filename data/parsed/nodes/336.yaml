 of the counters of the hmnu shouldn't vary too much, to maintain a consistent rhythm in text. I'd prefer to make them all the same size but I'm too accustomed to having the m and u be narrowed, as I imagine we all are, so I've narrowed these to align with expectations. <br> <br>&gt; Spacing: [...] it's a bit uneven in spots <br> <br>I'm not sure where my problem lies but I think that the sidebearings on my rounds may be too loose. I'd left them this way to avoid bunching on round-round pairs. Perhaps the solution is to kern round-round pairs? I was hoping to achieve great spacing without kerning, since few people can be bothered to use a program that uses Opentype kerns, but I may have to bite the bullet.</p>"
