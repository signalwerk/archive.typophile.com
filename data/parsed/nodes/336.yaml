  html: <p>Wedge has been my primary project for a couple months now. I was inspired at first by the headlines of the SF Chronicle, set in titling Electra. I was also intrigued by the wedge serifs of Underware's Dolly, providing the design's temporary name. <br> <br>Two goals for the project are, first, exploring new ways of modulating strokes, second, establishing an interesting rhythm in continuous text. I'm not sure yet how well I'm succeeding on either count. I think my modulation in the bowls of bdpq is unique. This same modulation seems to combine with the similar shape in hnmu to provide a nice rhythm at the top and bottom edges of a line of text. <br> <br>In the attached PDF I included a recently hacked up sans version of font. It is truly a sans since I preserved the modulation of the serifed version and just whacked off the serifs. It's mostly an experiment though and I'd prefer critique of the serif design. <br> <br>I'm very anxious to get feedback on this design. I have a whole summer ahead of me to work on this so I'd like to know if I'm going in the right direction. <br> <br><img src="http://www.typophile.com/forums/messages/29/11644.gif" alt="Wedge Sample"> <br> <br><a href="http://www.xtypa.com/ext/typophile/wedgespec1.pdf">Download PDF</a></p>
  html_clean: <p>Wedge has been my primary project for a couple months now. I was inspired at first by the headlines of the SF Chronicle, set in titling Electra. I was also intrigued by the wedge serifs of Underware's Dolly, providing the design's temporary name. <br> <br>Two goals for the project are, first, exploring new ways of modulating strokes, second, establishing an interesting rhythm in continuous text. I'm not sure yet how well I'm succeeding on either count. I think my modulation in the bowls of bdpq is unique. This same modulation seems to combine with the similar shape in hnmu to provide a nice rhythm at the top and bottom edges of a line of text. <br> <br>In the attached PDF I included a recently hacked up sans version of font. It is truly a sans since I preserved the modulation of the serifed version and just whacked off the serifs. It's mostly an experiment though and I'd prefer critique of the serif design. <br> <br>I'm very anxious to get feedback on this design. I have a whole summer ahead of me to work on this so I'd like to know if I'm going in the right direction. <br> <br><img src="http://www.typophile.com/forums/messages/29/11644.gif" alt="Wedge Sample"> <br> <br><a href="http://www.xtypa.com/ext/typophile/wedgespec1.pdf" class="link-external">Download PDF</a></p>
