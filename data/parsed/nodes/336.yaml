    html: "<p>Your design also looks to me like something between Minion and Adobe Caslon. But I like it better than either: less fussy than Minion, but more lively than ACaslon, which is dull. It has the sturdiness of Caslon without the somewhat awkward shapes. I think it could be a very useful text face.  <br> <br>On the spacing, I like that it isn't too tight - which I think Minion is. I suspect it is a bit uneven, but I don't have the knowledge to tell you how or where. The round vs straight letters might be something to check.  <br> <br>To my eye the round part of the C, D and G look very slightly too fat in relation to the rest of the caps. They would be more elegant if corrected also. The O and Q don't bother me the same way, I don't know why. This all may have to do with the degree of old style slant and what this dictates about the relation between the slightly diagonal and the vertical 'stroke of the pen'. <br> <br>The sans doesn't work for me - it doesn't have the virtues of the serif as it stands.  <br> <br>I am an amateur, but the fact that I like your face as a good text face - something rare - moved me to comment.    </p>"
    html_clean: "<p>Your design also looks to me like something between Minion and Adobe Caslon. But I like it better than either: less fussy than Minion, but more lively than ACaslon, which is dull. It has the sturdiness of Caslon without the somewhat awkward shapes. I think it could be a very useful text face.  <br> <br>On the spacing, I like that it isn't too tight - which I think Minion is. I suspect it is a bit uneven, but I don't have the knowledge to tell you how or where. The round vs straight letters might be something to check.  <br> <br>To my eye the round part of the C, D and G look very slightly too fat in relation to the rest of the caps. They would be more elegant if corrected also. The O and Q don't bother me the same way, I don't know why. This all may have to do with the degree of old style slant and what this dictates about the relation between the slightly diagonal and the vertical 'stroke of the pen'. <br> <br>The sans doesn't work for me - it doesn't have the virtues of the serif as it stands.  <br> <br>I am an amateur, but the fact that I like your face as a good text face - something rare - moved me to comment.    </p>"
