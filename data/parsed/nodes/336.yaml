    html: "<p>&gt; I do have palpable reservations however if this is more than an academic exercise: it's too \"80's Adobe\" <br> <br>They say fashion travels in 20 year waves, and though I'm too young to confirm this firsthand, it might be the right time to revisit the style of the golden Adobe 80s. Just two more years lie between us and the 20 year anniversary of the Laserwriter. Or maybe I'm being too optimistic. <br> <br>&gt; The overall softness in your joins seems somewhat \"nostalgic\" [...] Or it could all be in my head! <br> <br>It is nostalgic. I'm trying to recapture the heavy softness of older print. Because of this, I'm actually starting to prefer books printed from xerographic copies of the old print than those re-typeset. The text is more relaxed on the page. It doesn't march and shimmer like, say, a page of Minion. <br> <br>&gt; I'm not sure what you would do with the stately but static caps <br> <br>Here's what I <a href=\"http://www.xtypa.com/ext/typophile/wedgecapitals1.pdf\">have done</a> in the weeks prior to posting here. (<a href=\"http://www.xtypa.com/ext/typophile/wedgecapitals1.pdf\">Download PDF</a>). My previous capitals are stylistically closer to my lowercase but I wasn't satisfied with text in all-caps, and depending on my mood, they galled me within continuous text. The newer set pleases me more in both cases. <br> <br>&gt; I'd make the \"L\" and \"T\" narrower - helps spacing. <br> <br>When they were narrower (once upon a distant time) they bothered by at small sizes where they seemed too weak, but I'll give them another look. <br> <br>&gt; make the ascenders a hair taller <br> <br>Good point. I read recently (I forget where) that the top of the capitals should align with the bottom of the serifs of the ascenders. It seems like good advice and Wedge is just shy of that measure. <br> <br>&gt; Make the \"m\" narrower. <br> <br>My working theory at this point dictates that the width of the counters of the hmnu shouldn't vary too much, to maintain a consistent rhythm in text. I'd prefer to make them all the same size but I'm too accustomed to having the m and u be narrowed, as I imagine we all are, so I've narrowed these to align with expectations. <br> <br>&gt; Spacing: [...] it's a bit uneven in spots <br> <br>I'm not sure where my problem lies but I think that the sidebearings on my rounds may be too loose. I'd left them this way to avoid bunching on round-round pairs. Perhaps the solution is to kern round-round pairs? I was hoping to achieve great spacing without kerning, since few people can be bothered to use a program that uses Opentype kerns, but I may have to bite the bullet.</p>"
