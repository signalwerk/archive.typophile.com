    html: "<p>&gt; Text looks good, although i'd tighten the spacing more.  <br> <br>There are two reasons that the spacing may seem loose. First, i've tried to emulate the looser spacing of older type. Second, I've targeted sizes 9 through 11 which makes the spacing too loose at larger sizes. <br> <br>&gt; Maybe you could try flatening both endings of the lc 's' <br>&gt; Or make more look like the uc 'S'.  <br> <br>The lowercase s has consistently bothered me. It may be good to give more flare to the ends of the s, like that found in the lowercase c. I've made a concerted effort in my uppercase to make all the characters structurally different than their corresponding miniscule, to make the two sets belong to one another because of their style instead of just a difference in scale. <br> <br>&gt; I think you should try lowering the contrast in sansserif. To me its looks too much like being the serif version with the serifs cut away.  <br> <br>The sans is precisely 'the serif version with the serifs cut away'. I hacked it together in a couple hours just to see what it might look like. If I lowered the contrast in the sans, it might become more useable but I'm certain it would lose it's unique character, it's handwritten feel. Like you suggest, it would be curious, if I find the time, to sharpen the corners of the sans and see what that feels like. <br> <br>&gt; Why did you decide to make soft endings, serifs and forms? You said you were inspired by the electra, which is harder and sharper. <br> <br>I suppose because I was also inspired the Electra of the ratty sci-fi paperbacks I've read so many of. Cheap paper and printing gave the pages a mottled texture and denied Electra its sharpness. On the other hand, my laser printer is woefully capable of reproducing the sharpest corner so I prefer to manually warm and soften the joints of my glyphs. <br> <br>I began work from Electra in the proportions of the lowercase and by the structure of some of the letters: c, f, j, n, p, t. But over time, my initial shapes changed quite a lot. <br> <br>&gt; Maybe the q's descender (on serif version) is too heavy. <br>&gt; The descender of p is shorter than q's (is that intentional?) <br> <br>Maybe the descender on the p is too light? The serifs at the ends of all my ascenders/descenders are heavy compared to the baseline serifs. I stuck a baseline serif on the p, but I think it could use some additional heft to make it fit in. The descender on p is shorter than q, though not by much. I think the effect is exacerbated by the comparative lightness of the serif. <br> <br>&gt; Lowercase r is too \"shy\"/narrow. <br> <br>Good catch! I guess I really had my designer blinders on here.</p>"
    html_clean: "<p>&gt; Text looks good, although i'd tighten the spacing more.  <br> <br>There are two reasons that the spacing may seem loose. First, i've tried to emulate the looser spacing of older type. Second, I've targeted sizes 9 through 11 which makes the spacing too loose at larger sizes. <br> <br>&gt; Maybe you could try flatening both endings of the lc 's' <br>&gt; Or make more look like the uc 'S'.  <br> <br>The lowercase s has consistently bothered me. It may be good to give more flare to the ends of the s, like that found in the lowercase c. I've made a concerted effort in my uppercase to make all the characters structurally different than their corresponding miniscule, to make the two sets belong to one another because of their style instead of just a difference in scale. <br> <br>&gt; I think you should try lowering the contrast in sansserif. To me its looks too much like being the serif version with the serifs cut away.  <br> <br>The sans is precisely 'the serif version with the serifs cut away'. I hacked it together in a couple hours just to see what it might look like. If I lowered the contrast in the sans, it might become more useable but I'm certain it would lose it's unique character, it's handwritten feel. Like you suggest, it would be curious, if I find the time, to sharpen the corners of the sans and see what that feels like. <br> <br>&gt; Why did you decide to make soft endings, serifs and forms? You said you were inspired by the electra, which is harder and sharper. <br> <br>I suppose because I was also inspired the Electra of the ratty sci-fi paperbacks I've read so many of. Cheap paper and printing gave the pages a mottled texture and denied Electra its sharpness. On the other hand, my laser printer is woefully capable of reproducing the sharpest corner so I prefer to manually warm and soften the joints of my glyphs. <br> <br>I began work from Electra in the proportions of the lowercase and by the structure of some of the letters: c, f, j, n, p, t. But over time, my initial shapes changed quite a lot. <br> <br>&gt; Maybe the q's descender (on serif version) is too heavy. <br>&gt; The descender of p is shorter than q's (is that intentional?) <br> <br>Maybe the descender on the p is too light? The serifs at the ends of all my ascenders/descenders are heavy compared to the baseline serifs. I stuck a baseline serif on the p, but I think it could use some additional heft to make it fit in. The descender on p is shorter than q, though not by much. I think the effect is exacerbated by the comparative lightness of the serif. <br> <br>&gt; Lowercase r is too \"shy\"/narrow. <br> <br>Good catch! I guess I really had my designer blinders on here.</p>"
  - id: 1959
