    html: <p>&gt; ACaslon, which is dull <br> <br>No! Don't say that. Adobe Caslon is lovely, though I agree that Minion is fussy. <br> <br>&gt; I suspect [the spacing] is a bit uneven, but I don't have the knowledge to tell you how or where <br> <br>I don't have this elusive knowledge either. As time passes, I'm beginning to suspect that such knowledge is impossible for us typographic mortals. Only the gods (Carter, Zaph, &amp;c) can suffer spacing mastery. <br> <br>&gt; To my eye the round part of the C, D and G look very slightly too fat in relation to the rest of the caps <br> <br>I'm glad you pointed that out because I was beginning to suspect the same thing. I think there is too much diagonal modulation left over from the previous uppercase design in the thick part of the curved stroke. In particular, the curve of the counter needs to be shifted to lessen the stroke. <br> <br>&gt; I am an amateur, but the fact that I like your face as a good text face - something rare - moved me to comment. <br> <br>Well I am an amateur as well, and I'm glad my face isn't so bland to escape all interest.</p>
    html_clean: <p>&gt; ACaslon, which is dull <br> <br>No! Don't say that. Adobe Caslon is lovely, though I agree that Minion is fussy. <br> <br>&gt; I suspect [the spacing] is a bit uneven, but I don't have the knowledge to tell you how or where <br> <br>I don't have this elusive knowledge either. As time passes, I'm beginning to suspect that such knowledge is impossible for us typographic mortals. Only the gods (Carter, Zaph, &amp;c) can suffer spacing mastery. <br> <br>&gt; To my eye the round part of the C, D and G look very slightly too fat in relation to the rest of the caps <br> <br>I'm glad you pointed that out because I was beginning to suspect the same thing. I think there is too much diagonal modulation left over from the previous uppercase design in the thick part of the curved stroke. In particular, the curve of the counter needs to be shifted to lessen the stroke. <br> <br>&gt; I am an amateur, but the fact that I like your face as a good text face - something rare - moved me to comment. <br> <br>Well I am an amateur as well, and I'm glad my face isn't so bland to escape all interest.</p>
