    html: <p>holy freaking gorgeousness. <br> <br>This is a very nicely readable font. It's difficult to put one's thumb on what's new about it; it's only evident when zoomed in or looking at large caps. <br> <br>It would be sweet if there were ligatures to handle "fi" "fl", etc, given your overhangs. Also, combos like "nc" seem to mush together when zoomed out a lot. But on the whole an amazingly strong design; incredibly professional.</p>
