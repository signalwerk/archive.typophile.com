    html: |-
      <p>No lowercase for A6, but someone on another forum suggested Franklin Gothic. <a href="http://www.myfonts.com/fonts/ortizlopez/olfranklin/wide-regular/?s=abcdefghijklm&amp;case=upper" target="_blank" rel="nofollow">This extended digital version</a> is pretty darn close, but there's no extended style in my copy of the ATF "Big Red" of 1912.</p>
      <p>Suggestion for B7: ATF New Caslon Italic, but the "C" isn't right.</p>
      <p>C4 is definitely a "Skeleton," but I can't find the "Modern" variety that David mentioned (only "Skeleton Antique," which isn't quite it).</p>
      <p>BB has been identified as Dietz Text (which I've finally finished cleaning and sorting).</p>
