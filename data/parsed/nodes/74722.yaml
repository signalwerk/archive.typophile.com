    html: |-
      <p>Sorry to burst your bubble, Kenny, but this doesn't involve either Trajan or Mason, save for the ampersand, which could concievably have been customised from Trajan's. The hard serifs (and the top-left serif on the "N") tell me it's not Trajan, but probably a modification of a standard issue transitional serif. The flat cusp on the "A" is throwing me; several of the other characters are reminiscent of Times.</p>
      <p>-NJ</p>
