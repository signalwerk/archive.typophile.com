    <p>Hi there. I'm looking for a script typeface similar to this one: </p>
    <p><a href="http://new.myfonts.com/fonts/wiescherdesign/purissima/" title="http://new.myfonts.com/fonts/wiescherdesign/purissima/">http://new.myfonts.com/fonts/wiescherdesign/purissima/</a></p>
    <p>to use on the internal pages of a book I am designing. The decorative CAPS are to be used as DROP CAPs in the lead paragraphs on various pages. </p>
    <p>I do like the embellishments of Purissima B&amp;C (D is getting too decorative...), but I'm hoping there may be even better (!!) options that are similar.<br>
    Not too embellished.<br>
    Modern.<br>
    And ideally with an italic typeface option as well.</p>
    <p>Any thoughts???</p>
