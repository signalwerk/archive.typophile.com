  html: |-
    <p>Generating an Arabic font is really complicated process, i was thinking is it possible - or legal - to make it easier using Adobe Arabic font and its sample VOLT code??</p>
    <p>* I mean changing all the glyph shapes in Fontlap.<br>
    * generating a .ttf file.<br>
    * opening it withe VOLT and import sample VOLT code provided by Thomas Phinney. then just making edits to it.</p>
    <p>It's sound simple, but i don't know if this -so easy- method is bug-free or even legal!? what do guys think?</p>
