      <p>From my extensive experience criticizing people in public I would offer the following advice:</p>
      <p>There is an Art-Design axis, and every individual falls somewhere on the axis, and probably never changes (at least not much, and certainly almost not at all after a certain age). The closer an individual is to the Art end of the axis, the more sensitive he will be to criticism, and the more likely to hold a grudge against you as a result of a single, even mild, case of criticism. I'm not saying you should play along too much with such a destructive attitude, but if you can figure out about where each individual on your team falls on the axis, it will help you manage the team.</p>
      <p>hhp</p>
