    <p>Hi,<br>
    I am new here and have been motivated to join to ask for  advice about managing designers. I have just began to be 'lead designer' in charge of critiquing other designers work in our studio. It has made me realize that although I have 'an eye for typography' being able identify and verbalize what needs 'fixing' is a whole new ball game.<br>
    I find myself holding back and not wanting to offend or seem like a nag by seeking perfection. I am at the point where I feel a simple list of 'rules' would be good to pin on the wall - to allow designers to do a little self assessment.<br>
    Most of the 'fixing up' that needs doing usually revolves around layout, proximity, white space (lack of), and type sizing.<br>
    Any suggestions?</p>
