    html: <p>Having an 'eye' is great. But if you can't articulate what is wrong with a design, that is an issue. While design is subjective, there are rules about composition, balance, etc. that you should know how to defend and explain. If you offer criticism make sure it's to the point and based on solid advice, not opinion. Also, be sure to offer positive feedback along with the negative. A good creative director always makes the project better because of their input.</p>
