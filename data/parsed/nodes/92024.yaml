    html: <p>I am not a lead designer nor have I experience with public criticism, so take my words with a few grains of salt. I think that one needs to be able to be honest, even brutally honest. It's best to remember that the worst thing that can happen is that the designer will be offended. I don't think that's something to be worried about. Sometimes a little offending is just what is needed. No one should be afraid to say what isn't working, or fear praising what is working.</p>
