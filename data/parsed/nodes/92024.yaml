      <p>If you're the leader, you need to be able to critique people's work honestly. No one likes to be criticized, but there are ways to do it which will minimize hard feelings. </p>
      <p>• Maintain a positive attitude (remember that the leader usually sets the mood of the group). Show courtesy and respect to your staff (things like saying "please" and "thank you", for example).</p>
      <p>• Let everyone know up front what your expectations are. </p>
      <p>• When critiquing work, frame your comments as ways to make things better instead of being personal attacks (for example, instead of saying "this layout is terrible" say "this layout might be better if you..."). </p>
      <p>• Remember that it can be embarassing to be criticized in front of others, so be tactful in group meetings, and if you're really unhappy with someone, discuss it with them in private.</p>
