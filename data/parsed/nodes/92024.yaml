      <p>&gt; While design is subjective, there are rules </p>
      <p>That's an excellent point. While there is always a subjective element to design, you're on more solid ground if you can explain your reasoning on the basis of design principles. </p>
      <p>And an unrelated thought — as the lead designer, you are responsible for the work that comes out of your department and should be willing to stand behind your staff's work. I remember a manager I had once who would tell staff designers that he liked and approved their work, but then if management questioned a design he would tell management "you're right, I don't like it either". The staff lost respect for him pretty quickly.</p>
