      <p>Your role as a lead designer is to help your colleagues envision creative and effective solutions while capitalizing on their strenghts. It is always important to help the designer understand the design problem, to start with very clear expectations and specifications and to suggest possible paths for solution.</p>
      <p>First encourage exploration with little regard for quality, then focus on the improvement of a selected path.</p>
      <p>Critique is very important but you must not direct it to the person but to the work in an objective way. Say things like "The bullets distract attention from the titles" instead fo things like "YOUR bullets..." or "YOU placed very colorful bullets".</p>
      <p>Start by talking about the virtues of what you are being shown and then talk about what goals is the design failing to meet or the problems you find. It is equally important to offer feedback on the opportunities of the design which may not be evident to the designer.</p>
      <p>Take some time to critique, you need to really think what you are going to say in order for it to be constructive and help the designer to get in the right path. Good cirtique is not so much about poiting out what is wrong but about helping to get it right.</p>
      <p>Also, as pointed out, there are some things that are simply wrong: widows, missalignments, defective masking, bad color balance in photos, etc... You don't need to make a big deal abou them, just point them out briefly and focus on the overall conceptual quality and graphic achievement.</p>
      <p>Compliment a lot.</p>
