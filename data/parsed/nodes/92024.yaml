      <p>Based on my personal experience, I found that being the oldest of eight children was ideal training for being an Art Director and/or Lead Designer. You can make your job easier by remembering a couple of important strategies.</p>
      <p>First, look for each of your charge's individual strengths and be sure to praise them at every available opportunity. Nobody excels at everything—not even you—which makes an occasional critique more like constructive criticism than blanket "dissing".</p>
      <p>Second, as a middle manager, you run interference between your charges and top management. Practically speaking, you have to keep all parties happy. So, sometimes—if you're dealing with a particularly sensitive soul—you may have to make your boss the bad guy. Middle Management 101, but it works.</p>
