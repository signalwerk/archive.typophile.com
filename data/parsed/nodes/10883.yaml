    html: <p>Matha <br> <br>You've only really left me with Type 8, which I only have a lowercase specimen of. It matches this but the key to fraktur is its uppercase. Type 5's lowercase does not match and Type 7 seems to have been little used for bookwork. Nor do its caps match.  <br> <br>At any rate, I only have reference to Type 8 being in Tretyse of Love and Ars Moriendi.</p>
