    html: <p>Matha <br> <br>Well, Barker would certainly know. He was part of the team for UCLA's The Aldine Press project and also helped us work out some uncertainties with our Gutenberg book, Black-letter. Amazing depth of knowledge. <br> <br>Updike's tome has a showing of Type 8 intermingled with Type 6 in Tretyse of Love, 1493. Caxton was one funky typographer. <br> <br>I guess I'm up then. Think I'll stay way, way, away from historical stuff for a while!!! <br> <br>All best</p>
