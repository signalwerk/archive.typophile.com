    html: "<p>Gerald, <br> <br>It <b>is</b> type 8.  <br>I hope this didn't take up too much of your morning. I chose a sample without too many examples of uppercase letters, so maybe it was a little difficult. Well done, anyway. <br> <br>I don't have any refernce to <i>Tretyse of Love</i> in my source (Nicholas Barker's 'Caxton's Typography' in the <i>Journal of the Printing Historical Society</i> no. 11) <br> <br>Of the four books he says were printed using this typeface, only 2 survive : <br><i>Ars moriendi</i> <br>and a reprint of Mirk's <i>Liber festivalis,</i> <br>both partially set in type 8. <br> <br><i>Sarum Hours</i> V and VI, entirely set in type 8, have disappeared. <br> <br>Barker suggests four possible suppliers of type 8: Anthoine V</p>"
