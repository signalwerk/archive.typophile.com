  html: <p>Sorry, not the type 3. (By the way Chaucer's translation of Boethius <i>De consolatione philosophiae,</i> printed by Caxton in 1478, contained a lot of type 3.) <br> <br>The typeface shown above was used for <i>Sarum Hours</i> V and VI, one octavo and one quarto. <br> <br>So, you have the typeface and 2 books to find.</p>
