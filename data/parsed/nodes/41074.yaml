      <p>Many people start their fonts from old specimens they find and make changes and or add more characters.</p>
      <p>What you can’t and shouldn’t do is start by using someone else’s font and make your own. Ethically speaking, whether you start from the actually font file or if you  print it out, either way, you are on shaky ground. </p>
      <p>Just because a font is too expensive is not a good reason to do it. Consider the time you will spend to create the font. How much is your time worth? Add to that any legal woes you might have should you step on someone’s toes. Now is it less expensive to actually license the font?</p>
