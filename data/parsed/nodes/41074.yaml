    <p>Hello all. I’m new to this site and I’ve read through lots of posts and couldn’t find anything specific to my question, so here it is.</p>
    <p>I want to create a new font that is very similar to and existing font. I can base it off of a font that I do own a lisence to or start from scratch. When I’m finished it will closely resemble a font that is just too expensive to purchase. And I don’t really want to change fonts. So basically I want to copy a font, make some minor changes so it’s not exact, then use this new font in the old one’s place. Please refrain from belting me with rotten tomatoes and cabbage, I’m really just looking for the legalities involved with this type of thing. Like for instance, can one build a font that looks almost exactly like trade gothic, maybe not even using the original, then call it their own? </p>
    <p>Or, say I create a new font from scratch and it’s exactly like garamond, but i’ve never seen garamond, are their legal issues?</p>
    <p>Thanks for all your help, you all seem like a very intelligent and resourceful group.</p>
    <p>Mario</p>
