    html: |-
      <p>Use a font that contains monospaced numerals. InDesign hasn't anything to do with it, it uses them as they come.</p>
      <p>(There are fonts where the digits are designed to be monospaced but where custom kerning is used to move them together. If you suspect that's the case, set the kerning of your numbers to zero instead of "Metrics" or "Optical".)</p>
