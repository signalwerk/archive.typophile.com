    html: |-
      <p>Sure, Charles, but now you have to teach how one would know whether a font has both proportional and tabular numbers (*). In any case, my experience -- so far -- is that if a font has both, usually the "normal" (tabular) numbers are enabled by default.</p>
      <p>Chung's image shows two different fonts, one with proportional digits and one with tabulars, and it's a fair bet those are not Opentype/Pro fonts (there aren't really that many "Pro" fonts; and, as you say, there's just a few that do come with multiple digit sets).</p>
      <p>(*) The easy answer is "try it". If you can select a different style of digits, the font contains them. If not, the font doesn't.</p>
