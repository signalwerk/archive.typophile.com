    html: |-
      <p>If you are using an Opentype font with multiple numeral styles, see here:</p>
      <p><a href="http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751001ea8cb3f-6e1ea.html" title="http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751001ea8cb3f-6e1ea.html">http://help.adobe.com/en_US/indesign/cs/using/WSa285fff53dea4f8617383751...</a></p>
      <p>(Tabular Lining is probably what you want; the "Character panel menu" is opened by clicking on the little icon in the upper-right-hand corner of the Character palette).</p>
      <p>If your font is not opentype or doesn't have multiple numeral styles, then make sure you choose a font whose default/only figure style is lining - not Georgia, not Impact, not Candara. </p>
      <p>Your best bet is to try setting numbers in a few columns, and if they don't line up, see if you can access the opentype Tabular Lining feature, and if not, try another font.</p>
