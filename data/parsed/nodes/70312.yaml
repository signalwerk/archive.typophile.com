      <p><cite>The current idea is to keep the master (most currently corrected) versions of each text as plain text files, which can then also be used by people unable or unwilling to use LaTeX.<cite></cite></cite></p>
      <p>Makes perfect sense. And of the current standards, the one you can expect to last the longest and be covered by the most software, is Unicode. The decision to use a particular font, just like the decision to use a particular layout program, is something for the individual people in your group to resolve.</p>
      <p>While I don't know LaTeX, I do know plain TeX. What you want to do is pretty simple with TeX, with a "let" and a definition. AFAIK, it is not do-able with InDesign. With ID, you need the correct characters &amp; glyphs, and the OT features that will let it all work.</p>
      <p>BTW, The dot-below, and macron-below for the Latin transliteration of most Indic Scripts do exist as precomposed Unicode characters, in Latin Extended Additional. Of course, most fonts don't have these either. And as sure as the Great Ground of Being made little green apples, you are going to run into something that requires you to make up some character or glyph. Now you need permission from the foundry.</p>
      <p>Modifying Adobe fonts is one obvious solution. Do note that if you pay strict accordance to the license, the number of copies of the font you are allowed is another issue.</p>
      <p>Remember too that you can't work on Arno in Fontlab, at least, until FL6 comes out, or you're willing to redo all the kerning, and change any *mark* and *mkmk* features to a *ccmp* feature. Other font editing programs may not have this limitation.</p>
      <p>Since you are going to have to do some font work in any case, why not consider Gentium, and do the necessary work? Kerning, small caps, etc.</p>
