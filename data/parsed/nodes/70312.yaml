      <p><cite>Great. That's what we had originally assumed, though doubts crept in (reading a post on this forum somewhere by charles_e). I'll try to confirm this anyway with Monotype.</cite></p>
      <p>If you write a TeX macro to position one character with respect to another, there is of course no need to modify the font itself. But there may be syntactical issues if any use of the files is to be made later. While it is no problem (with TeX) to position a period beneath a letter -- m, n, r, etc., the character you have placed is probably the period, U+002E. It will look fine. But the correct character is probably U+0323 (COMBINING DOT BELOW). So anybody who tries to extract your text for further use will have some cleaning up to do.</p>
      <p>Same with the macrons -- you'll likely wind up having to use U+00AF for both the macron above and the macron below, instead of the more syntactically correct U+0304 (above) and U+0331 (below).</p>
      <p>I'd doubt the Monotype font has any of the combining diacriticals, 0300-036F.</p>
