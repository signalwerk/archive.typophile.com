    <p>Greetings,</p>
    <p>I've been browsing these forums now and then for some time, though this is my first post.</p>
    <p>I wonder if anyone can answer some questions about licensing in regard to creating diacritics while using various fonts. And any other advice that might be relevant to my situation.</p>
    <p>I'm part of a small, amateur volunteer team publishing Buddhist books for free distribution, and we're in the process of choosing a typeface with which to reset a relatively large library of previously-published books (about 30 titles, if it works out in the end). We need a serif typeface which is robust and versatile, as well as beautiful in an unassuming way. And we need to be able to use Pali diacritics, which include glyphs such as dots above and/or underneath letters such as m, n, l, t, etc. We have pretty much ruled out Gentium, for its lack of typographic features such as OSF and small caps as well as in-built kerning etc.</p>
    <p>We had chosen Arno Pro, which has some of the needed diacriticals already, and as far as I understand it Adobe's EULA allows us to create the ones we don't yet have, even by inserting new characters into the relevant unicode places.</p>
    <p>But for various reasons we'd now like to go with Monotype's Albertina or Albertina Pro (OpenType). However, I can't easily see from the  EULA (which I'm having trouble interpreting) whether they allow us to create diacriticals either through inserting characters into the unicode slots – as far as I can tell this is not allowed – or by programming a special kerning script to create the diacritics that way (without modifying any of Monotype's font software). We're using LaTeX to do this, and it's worked well with Arno Pro.</p>
    <p>Does anyone know if Monotype allows us to do this with Albertina?</p>
    <p>Thanks very much,<br>
    JB</p>
