      <p><em>Great. That's what we had originally assumed, though doubts crept in (reading a post on this forum somewhere by charles_e).</em></p>
      <p>Which post would that be?</p>
      <p><em>The current idea is to keep the master... versions of each text as plain text files</em></p>
      <p>I would advise storing your master files in a structural markup language like Docbook, which you can transform via a stylesheet to your intended output (LaTeX, HTML, ePUB, etc.). Cf. <code>xsltproc</code>.</p>
      <p><em>the TeX code he creates to form diacrtics on the fly will do so whatever font is used</em></p>
      <p>A higher level macro should be able to accomplish that. The technique I described of creating a virtual font would be specific to that font.</p>
      <p><em>creating unicode characters within the font could be more useful in the long run than by coding on the fly in LaTeX.</em></p>
      <p>In which case you will have to seek permission and pay for the right.</p>
      <p>If your compositor does not feel comfortable writing TeX macros or using <code>fontinst</code>, the most straightforward solution would be to modify the fonts (with permission), keep your .tex files in Unicode, use the <code>fontspec</code> package and process everything with XeLaTeX.</p>
