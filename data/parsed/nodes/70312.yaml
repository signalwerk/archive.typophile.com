      <p>j_b wrote: <em>programming a special kerning script to create the diacritics...(without modifying any of Monotype's font software).</em></p>
      <p>There is no conceivable scenario in which what you are suggesting here (using an encoding vector and writing a custom metrics file for TeX) would be disallowed by the font license.</p>
      <p>It is stated explicitly in <a class="freelinking external" href="http://www.fonts.com/Legal/MI-EULA.htm" rel="nofollow">Monotype's EULA</a> that "You may not alter Font Software." Nevertheless, even if you did obtain permission to do so, it is still a cleaner solution to use a metrics file to place the diacritics, as this will ensure your TeX code remains portable, since it won't rely on customized fonts.</p>
