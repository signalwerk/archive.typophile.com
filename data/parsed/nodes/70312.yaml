      <p><cite>But there may be syntactical issues if any use of the files is to be made later. ... So anybody who tries to extract your text for further use will have some cleaning up to do.</cite></p>
      <p>I'm interested in knowing more about any limitations involved in going down this route, that is using LaTeX macros (I guess that's what our guy's doing) to position diacritics on a font which lacks them. I'm not up on the technical mechanics of how TeX works and how fonts are handled in various applications, but I had reservations when I first heard the plan, based on the knowledge that we will want to use the texts involved in future, and not always using TeX applications to do so.</p>
      <p>We will also want to export the texts to various formats intended for various purposes: in addition to print-ready PDFs we can use for offset or digital (print-on-demand) print runs (which we're hoping to produce from LaTeX), we will make versions available to people to download as (ideally searchable) PDFs, ebook formats, even possibly html. The current idea is to keep the master (most currently corrected) versions of each text as plain text files, which can then also be used by people unable or unwilling to use LaTeX.</p>
      <p>I realize of course that non-TeX applications will not recognize the macros and so lack the diacritics. Therefore our man plans, as I understand it, to create another TeX macro to replace the diacritics-creating macro (if that makes sense) which instead places the proper unicode characters into the plain text for the master files. I'm not sure I got that right, but it's something like that.</p>
      <p>Searchability seems to be another misty swamp regarding diacritics in digital text.</p>
      <p>Thanks for your input.</p>
