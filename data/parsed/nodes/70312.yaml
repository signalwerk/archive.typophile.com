      <p><cite>Since you are going to have to do some font work in any case, why not consider Gentium, and do the necessary work? Kerning, small caps, etc.</cite></p>
      <p>Well, we don't have anyone who actually knows how to do font work(!) I have presumed that creating the characters we need that are missing from the font (relatively few in Arno Pro, basically adding the dot below a few consonents) will be possible to do for us amateurs – somehow. But doing a whole lot more for Gentium ... I guess it seemed that Gentium is unfinished at the moment, and when they've got it more complete it will be a better solution for us.</p>
      <p>Maybe Albertina will work well enough using LaTeX and we'll need another font for the purposes which don't use it. I wonder.</p>
      <p><cite>Which post would that be?</cite></p>
      <p>I don't know that I can find it, it was one in the middle of a thread I read while searching the site. I think he was explaining how he wouldn't want to use any font with a EULA which didn't allow modification, and it was clear from the post he was also using TeX to solve missing glyph issues. I must have mistakenly got the idea that this too would run into problems with restrictive EULAs.</p>
      <p><cite>I would advise storing your master files in a structural markup language like Docbook, which you can transform via a stylesheet to your intended output (LaTeX, HTML, ePUB, etc.). Cf. xsltproc.</cite></p>
      <p>Thanks, and thanks for the other advice, I'll ask our man about it all.</p>
      <p>Do either of you know about how diacritical glyphs are made more easily searchable, on the Web and/or in PDFs? Or where the standards seem to be going regarding ebooks as well other digital formats? It's a big question for us about how to enable search for the words with diacritics. I'm assuming there is a movement to adopt Unicode recognition among all platforms as time goes on, but that's just a guess.</p>
    html_clean: |-
      <p><cite>Since you are going to have to do some font work in any case, why not consider Gentium, and do the necessary work? Kerning, small caps, etc.</cite></p>
      <p>Well, we don't have anyone who actually knows how to do font work(!) I have presumed that creating the characters we need that are missing from the font (relatively few in Arno Pro, basically adding the dot below a few consonents) will be possible to do for us amateurs – somehow. But doing a whole lot more for Gentium ... I guess it seemed that Gentium is unfinished at the moment, and when they've got it more complete it will be a better solution for us.</p>
      <p>Maybe Albertina will work well enough using LaTeX and we'll need another font for the purposes which don't use it. I wonder.</p>
      <p><cite>Which post would that be?</cite></p>
      <p>I don't know that I can find it, it was one in the middle of a thread I read while searching the site. I think he was explaining how he wouldn't want to use any font with a EULA which didn't allow modification, and it was clear from the post he was also using TeX to solve missing glyph issues. I must have mistakenly got the idea that this too would run into problems with restrictive EULAs.</p>
      <p><cite>I would advise storing your master files in a structural markup language like Docbook, which you can transform via a stylesheet to your intended output (LaTeX, HTML, ePUB, etc.). Cf. xsltproc.</cite></p>
      <p>Thanks, and thanks for the other advice, I'll ask our man about it all.</p>
