    html: <p>Using kerning to position diacritics marks is a really messy method, because kerning affects all subsequent glyphs. You not only shift the mark over a preceding letter, but then need to shift the following letter away from the mark in order to restore the original spacing, and in order to do that correctly you need to factor in whatever kerning might exist between the two letters. [This is why OpenType GPOS mark attachments exist, and why GPOS kerning treats marks as transparent.]</p>
