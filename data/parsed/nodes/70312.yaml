    html: <p>Let me add a <em>caveat compositor:</em> There are many TeX configurations that require Type 1 Postscript fonts. In the case of MT Albertina, converting from OpenType to Type 1 would be strictly <em>contra EULA</em>. Furthermore, the prohibition against embedding restricts the use of Albertina to print, in which case the point regarding search engines is moot.</p>
