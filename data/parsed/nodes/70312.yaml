      <p><a href="http://www.fonts.com/Legal/MI-EULA.htm" title="http://www.fonts.com/Legal/MI-EULA.htm">http://www.fonts.com/Legal/MI-EULA.htm</a> says: </p>
      <p>"13.  You may not alter Font Software for the purpose of adding any functionality which such Font Software did not have when delivered to you by MI..."</p>
      <p>Unless MI is willing to give you some sort of exception, the Adobe license is superior. You might try Dante, which does have small caps and osf. </p>
      <p>I would recommend creating individual slots for the diacritical characters, e.g. ṣ (s dotunder) at 1E63. Constructing them with layout software or with the combining diacritics method just creates more variables that succumb to technical or human error.  Also, your final text is almost guaranteed to have an electronic life requiring searching and indexing. And it is a lot of work to change from one method to the other.    </p>
      <p>For letters with Sanksrit diacritics, they generally have to be entered correctly for search to find them in Acrobat etc.</p>
