      <p>John Hudson wrote: <em>Using kerning to position diacritics marks is a really messy method</em></p>
      <p>True, but this is not the technique being discussed here. Rather, the idea is to create virtual font and metric files that compose the needed glyphs on the fly. Additional kerning, ligature rules and glyph positioning are all achievable in TeX through this method. The term "kerning script" may have been a misleading way to describe this.</p>
