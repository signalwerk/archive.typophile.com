    html: <p>Absolutely one of my favorite sans serifs.  It occupies this wonderful area between a neo-grotesk and a geometric 'face, and I'm always a sucker for round tittles.  It has just enough personality to distinguish itself, and can be a really nice touch when you're wary of using Akzidenz, Helvetica or Futura.  It's got quite a nice set of numerals, to boot.</p>
