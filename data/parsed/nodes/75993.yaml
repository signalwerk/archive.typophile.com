  html: |-
    <p>I really love Neuzeit S, ive found it really useful (even though it only has 2 weights) and i like its quirks, was just wondering what everyone else thinks really...i don't see it used around that much so was just thinking maybe its just me....<br>
    is there any knowledgeable typophiles out there who have any views on it?</p>
    <p>this is what wikipedia says:<br>
    Neuzeit S is a sans-serif typeface designed by C.W. Pischiner in 1928 for the Stempel type foundry. The German name translates to English as "new time." The face combines characteristics of both geometric and realist (neo-grotesque) sans-serif classifications. In 1959 additional weights were added by the Linotype foundry's version. A related but different face, DIN Neuzeit, is rounder and more purely a geometric sans-serif.<br>
    Neuzeit S is distinct for its contrast of wide circular characters o, O, p, q, and Q with the more compact characters h, n, u, and t.</p>
    <p>view/buy it here:<br>
    <a href="http://new.myfonts.com/fonts/agfa/neuzeit-s/" title="http://new.myfonts.com/fonts/agfa/neuzeit-s/">http://new.myfonts.com/fonts/agfa/neuzeit-s/</a></p>
