      <p>I think that the FDK documentation refers to an older version of terminal. At the command lines, type “echo $SHELL” and it will tell you what shell you’re using. I’m pretty sure the default on 10.4+ is Bash, although if you have carried settings over from older accounts it might be Csh. </p>
      <p>If you want to work with the command line more as you get used to the FDK, I recommend that you pick up the books ”Teach Yourself UNIX in 24 Hours” and “UNIX in a Nutshell.” My copies are pretty old but there are probably books just about using the BSD UNIX system that Mac OS runs on.</p>
