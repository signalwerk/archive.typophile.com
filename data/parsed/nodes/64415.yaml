      <p><cite>My font contains glyphnames not in this file but how do i get those unicode values?</cite></p>
      <p>Unicode.org. Unless it’s a font with no unicode value.</p>
      <p><cite>…does it matter if there are unicode values in the file of glyphs that are not in my font?</cite></p>
      <p>I’m not sure. You might want to post that in the AFDKO thread over at forum.Fontlab.com.</p>
      <p><cite>what is the function of: PS1=’\W $ ’</cite></p>
      <p>It changes your shell prompt to the current working directory. I have no clue why the FDK installer demands this other than as a suggestion to make life easier on the nubs.  </p>
      <p><cite>how do i get a .pfa format?</cite><br>
      Export your font as type 1 postscript. </p>
      <p>You might want to watch Miguel Sousa’s AFDKO 2.5 intro podcast, it’s part of the Robothon podcasts and you can get it on iTunes.</p>
