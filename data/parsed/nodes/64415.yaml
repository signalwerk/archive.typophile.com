    <p>I'm trying to work with FDK or AFDKO whatever you call it.<br>
    I also tried this a few weeks ago but dropped cause it's verry user unfriendly but i'm starting to believe it's worth the frustration.</p>
    <p>Anyway, i searched a lot, or my search terms are that bad or i'm the only one having trouble.</p>
    <p>Installing it was no problem but now i'm reading<br>
    CommandLineHowTo.pdf</p>
    <p>I think everything i had to do failed cause it was not in my terminal but nothing serious i guess. Mostly small things like never seeing the option:</p>
    <p>“Use Settings as Defaults”</p>
    <p>I gues the terminal has changed over the years.<br>
    anyway now i'm here:</p>
    <p>+++<br>
    To change the prompt, you need to edit an obscure file that sets parameters for the Terminal pro- gram when it starts up. Unfortunately, the way the Terminal program works depends on which Unix command line program it is setup to use. There are several, and each one uses a different name for its startup file, and requires a different line of text added to change the prompt. To see which one you have, under the Terminal menu option, choose “Preferences...”, and note the line of text in the top text field.</p>
    <p>Program name       Startup file name        Line to add<br>
    csh                .cshrc                   set prompt="%c$ "<br>
    tcsh               .cshrc                   set prompt="%c$ "<br>
    sh                 .profile                 PS1='\W $ '<br>
    zsh                .profile                 PS1='\W $ '<br>
    bash               .bash_profile            PS1='\W $ '</p>
    <p>+++</p>
    <p>Only there is no text in the topfield? what do i need to do now?<br>
    I got terminal 'version 2.1(272)'</p>
