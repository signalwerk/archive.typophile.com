      <p>I suspect that you would do better with FontLab than the FDK. The FDK was written by a programmer (me) for type designers who are already well-versed in the Unix command-line. Its strengths are that it is scriptable and you can share or copy the meta-data files, like the GlyphOrderAndAliasDB and feature files, between similar faces and families. This is very important if you are managing a large library, and the overall time-savings then are well worth the price of the highly non-obvious tools and options and lack of documentation. Relative to FontLab, getting a new family started takes a lot more up-front work and planning, but making a change and rebuilding is much faster. Last month I had to add a name ID 8 entry to the name table of several thousand fonts. With Bbedit, Python, and the FDK, this took me three hours, including verifying that nothing else changed in the fonts. However, if you are working with a simple four face family, then you will get done a lot faster with FontLab. Also, the FDK tools are very Type2/CFF cnetric, and can't do a lot with TrueType fonts. That said, now for your questions:</p>
      <p>"how do i get those unicode values?"</p>
      <p>What James Puckett said, unicode.org. One of the easiest files to browse is:<br>
      <a href="http://www.unicode.org/Public/UNIDATA/NamesList.txt" title="http://www.unicode.org/Public/UNIDATA/NamesList.txt">http://www.unicode.org/Public/UNIDATA/NamesList.txt</a></p>
      <p>"…does it matter if there are unicode values in the file of glyphs that are not in my font?"</p>
      <p>No. Be aware, however, that the makeotf will add Unicode values for any glyphs with  known glyph names, using a hard-coded list of glyph name to Unicode values.</p>
      <p>"what is the function of:<br>
      PS1=’\W $ "</p>
      <p>Setting this is not at all required. However, the default setting is to show the entire absolute path of the current working directory before the prompt. Since I often work in deep directory trees with absolute paths of a hundred letters or more, the default setting leaves me with very little space on the command-line to actually enter a command. The setting I recommend gives you the current directory name, which is at least a clue about where you are in the directory tree, without making too long a prompt.</p>
      <p>"how do i get a .pfa format?"</p>
      <p>If your goal is to make an OpenType font with TrueType glyph outlines, then you don't need to - just specify your *.ttf file as the source font file for makeotf. This will result in an output OpenType font with the original TrueType glyph outlines from your source. When doing this, however, you need to be aware of  three issues. The biggest issue is  that the currently posted version of the FDK does not make valid TTF fonts - if you want to do this, contact me at <a href="mailto:rroberts@adobe.com">rroberts@adobe.com</a>, and I will send you the fix. The second is that the makeotf tool can't change the glyph order of TTF fonts. This means that you can use the GlyphOrderAndAliasDb file to change glyph names and assign Unicode values, but not to re-order glyphs.<br>
      The last is that the autohint tool won't work on TTF font files, and the checkOutlines tools will report issues, but can't fix them. The FDK is pretty Type1/Type2 centric.</p>
      <p>If you do want to convert your TTF to a Type 1  font file so as to work more easily with the FDK tools, the program to use is 'tx". The command-line is<br>
       "tx -t1   "<br>
      e.g.<br>
       "tx -t1  myfont.ttf   myfont.pfa"</p>
