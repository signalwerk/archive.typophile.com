    <p>I just recently got myself a new mobile phone. It is an LG enV Touch. I was going through the settings and noticed that there are 5 different menu fonts to choose from, VZW Font, LG Serif, LG Edge, LG Joy, and LG Script. I'm sure this isn't the first phone to have this but I have to admit, I was impressed. Even though I'm sticking with VZW font which is a clean sans serif and the default on the phone, it's nice to have options.</p>
    <p>I did a little bit of searching and from what I can tell it isn't possible to upload your own fonts but I could certainly see that in the future. It's an interesting possibility to say the least.</p>
