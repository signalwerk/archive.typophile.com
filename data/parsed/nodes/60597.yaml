    html: |-
      <p>I think it will be a long time until phone manufacturers are going to allow users to upload their own fonts (this has to do with processor speeds, memory and other issues), but you technically could do it currently with a couple of different devices - but only if you know how to hack into them. With iPhone for instance, this is possible with a Jailbreak.</p>
      <p>Allowing users to customize their own font choices on a mobile phone is scary territory and it can make a UI fall apart completely, as well as leave the text unreadable. It could be like MySpace x10.</p>
      <p>Most new phones have a couple of different font choices, sometimes they are just different styles or if you are lucky, entirely different designs. I'd say 9 times out of ten, they are all horrible and poorly considered for the mobile context.</p>
