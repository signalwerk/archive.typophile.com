    <p>Hello all,</p>
    <p>recently made the switch to 10.7 and noticed that the default File Info window (apple + i) in the Finder doesn't display the same amount of information for font files. Before (meaning pre 10.7)  you could quickly check copyright info, version number etc. </p>
    <p>Anything I am missing?</p>
    <p>TIA.</p>
    <p>Seb</p>
