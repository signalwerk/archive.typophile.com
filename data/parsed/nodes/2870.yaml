    html: <p>The thing that confuses me is your phrase "ATF phototype originals." As far as I know, ATF only did metal foundry type for hand setting. Nearly all of their fonts were done later as phototype and still later as digital type, but not by them (if you don't count the few that Kingsley issued in PostScript around 1990--I don't). You do mean ATF as in American Type Founders, right?</p>
