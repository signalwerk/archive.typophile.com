    html: <p>Yes, there was still phototype in the eighties. But digital was rapidly making inroads in the very early eighties. A publisher I was working for got a Linotron 202 system about 1981. It was CRT-based, but digital nonetheless. My recollection is that the systems for setting headline type--mainly the VGC Typositor--were being undermined by ever-higher-quality automatic typesetting systems, especially digital ones. I'd have to look at my back-issues of U&amp;lc, but I think outfits like VGC were also losing touch with designers' sensibilities and releasing increasingly irrelevant faces. <br> <br>Anyway, I'm rambling here. I would love to know more about the source of EF's Caslon. Caslon, in all its various incarnations, is a longtime favorite of mine. Theirs is one of the more unusual ones I've seen.</p>
