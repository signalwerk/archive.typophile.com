  html: <p>Hello all, <br> <br>My first post on this board dealt with a font I've been hunting for a long, long time. It was a serif italic with characteristic swooping serifs used in the televison and print ads for the De Beers company's "Shadows" campaign starting in 1996. Since then I've been trying to find out what it was. I even tried contacting the Ad agency that produced the ads, J. Walter Thompson in London, but ended up where I began. Read my original post here <a href="http://www.typophile.com/forums/messages/83/10604.html" target="_blank">here</a> <br> <br><b>A quick summary of the story until now:</b> <br><i>It may be a Caslon!</i> <br>My searched seemed futile until I came across Elsner and Flake's <a href="http://www.myfonts.com/fonts/ef/caslon-rough/hef-regular-italic/testdrive.html?s=How%2Belse%2Bcould%2Btwo%2Bmonths%2Bsalary%2Blast%2Bforever&amp;p=48>" target="_blank">Caslon Rough</a> which bears an unequivocal resemblance to my mystery font. If it weren't for the roughened appearance it would be almost perfect (The 'v' is different but that's inconsequential to me). It turns out that Elsner and Flake's Caslon Rough was based on a phototype Caslon from the 1980s of ATF origin, according to Ms. Elsner.   <br> <br>Since we have some phototype experts here, I was hoping we could shed some new light on this mystery. Any help would be very greatly appreciated.  <br> <br>See  <a href="http://www.sugarbuzz.net/diamond.jpg" target="_blank">here</a>  for a larger sample, a slightly smaller version of which is also attached to the bottom of this message.  <br><img src="http://www.typophile.com/forums/messages/83/25072.jpg" alt="Mystery Comparison"> <br><img src="http://www.typophile.com/forums/messages/83/25073.jpg" alt="Enlargement of the 'd' showing the graceful swoop at the serif"> <br></p>
