    html: "<p>I hope this doesn't duplicate something already being worked on by someone else, but I did a number of hunts. First, I looked the McGrew's 'American Metal Typefaces' for Caslons. There is only one that has a v even vaguely like the original DeBeers type and that is a Monotype version that no longer seems to exist. Caslon 540 seems the most like the sample. I used the MyFonts test drive and a couple of fonts I have on hand to build the follwoing sample sheet for comparison to the posted sample: <br><img src=\"http://www.typophile.com/forums/messages/83/25079.gif\" alt=\"Caslon Italic Samples\"> <br>It seems that none of these has the rounded serif you emphasized, and this suggests to me that the work was a customized version of Caslon 540. Someone with more skill than I have could even do something as crude as convert the font to outlines and round out the corners (I thought about trying it, but I have other things to do -- sorry).  Probaly a heavier weight than the ones I used might also look closer to the original.  <br> <br>My question is a pragmatic one (heretical though it may be in this group) -- how much does the serif on the d matter to you? Do you think even one person out of 100 would notice if you reproduced the phrase with an existing Caslon Italic of the right weight and spacing? Without them being side-by-side, I doubt if I would notice the difference. (Can I keep coming here, even after uttering such an outrage?) <br> <br>BTW, I did look in my Photo-Lettering book and there are a raft of Caslon italics, but no complete enough samples to say that any of them might have been used. Most did not look very close. I think De Beers could afford to have a customized typeface designed for their ads. </p>"
