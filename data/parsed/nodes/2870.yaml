    html: <p>Not only that Mark, but ATF was out of business by 1933 (see <a href="http://www.columbia.edu/cu/lweb/data/indiv/rare/type-exhibit/atf.htm" target="_blank">this Columbia University site</a> for history). <br> <br>This would make more sense if the ATF origin was the 1890's, although I'm a bit surprised that you say there wasn't much photo type being developed in the 80's. I just bought a book from 1980 by the esteemed Allan Haley (now of Agfa-Monotype) called "Phototypography" in which there is no clue that the digital font era was anywhere in sight. I realize that  might have quickly changed, but I would still expect something to have been going on at least into the mid 80's. That's around the time when Phil's Photo and Solotype were reaching their peaks, isn't it?  <br> <br></p>
