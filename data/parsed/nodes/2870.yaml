    html: <p>Thanks for your help guys! <br> <br>I heartily agree that the y was modified in the De Beers font, but this is likely the <b>only</b> modification that was made to the font. In my opinion it is definetly <b>not</b> a modification of Caslon 540 but rather it's own version of Caslon (see images below). The evidence is that Caslon Rough is 99% the De Beers font. They couldn't both be coincidently modified Caslon 540s and look that much alike.  <br> <br>If I find the source of Caslon Rough, I've found my diamond font. I dont' care about he curly 'v'. If J. Walter Thompson got hold of it and modified it, and Elsner and Flake got hold of it separately, and roughened it, it has to be around somewhere.   <br> <br>And yes, Mike, this font is my white whale. I must have the swooping rounded serifs. It's become more than a font but rather a journey <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> I hope you will help me on it! <br> <br><img src="http://www.typophile.com/forums/messages/83/25130.jpg" alt=""></p>
