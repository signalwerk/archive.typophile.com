    html: <p>It's very odd. I went to the EF site and examined Caslon Rough more closely. I'm unable to find any version of Caslon--metal, photo, digital, whatever--that resembles it. I also find it odd that they would have said it was based on a "phototype Caslon from the 1980s of ATF origin." As far as I know very few phototype fonts were created in the 1980s--everything was going digital by then. ATFs Caslons are easy to find, but none that I looked at are even close to EF's. And I don't think ATF would be doing new designs in the 1980s (if that's what was meant).</p>
