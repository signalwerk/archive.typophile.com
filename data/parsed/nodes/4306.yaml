    html: "<p>Letraset used to have a sheet of rub-down graphics from the Declaration of Independence. They issued it in 1976 for the Bicentennial. I don't know when it was discontinued, but it's not in the most recent catalog I have (1998).  <br> <br>It included characters similar to the text in the Constitution, but only enough to compose a few words. Here's what it looked like from an older catalog: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/33631.gif\" alt=\"1776\"></p>"
