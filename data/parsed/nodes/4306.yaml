    votes: null
    html: <p>There have been several re-creations of the writing on American historic documents, although perhaps not this identical handscript. Part 10 (Antique Handwriting) of the <a href="http://bowfinprintworks.com/Script10Pg1.html" target="_blank">Script Font ID Guide</a> shows fonts called Article 10,  Old Glory, Jeffersonian and American Scribe to name some of the more deliberate recreations. If you look through the type samples you may see others that fit the feel as well. Not all the fonts are truly modeled on antique writing, but I included them there if I thought they might look like they were (so Zapfino is there too, for example).  <br> <br>These do at least look more like something handwritten, rather than engraved. <br> <br>However, I do not know of anything that looks like the 'blackletter' (We the People) style.</p>
    html_clean: <p>There have been several re-creations of the writing on American historic documents, although perhaps not this identical handscript. Part 10 (Antique Handwriting) of the <a href="http://bowfinprintworks.com/Script10Pg1.html" target="_blank" class="link-external">Script Font ID Guide</a> shows fonts called Article 10,  Old Glory, Jeffersonian and American Scribe to name some of the more deliberate recreations. If you look through the type samples you may see others that fit the feel as well. Not all the fonts are truly modeled on antique writing, but I included them there if I thought they might look like they were (so Zapfino is there too, for example).  <br> <br>These do at least look more like something handwritten, rather than engraved. <br> <br>However, I do not know of anything that looks like the 'blackletter' (We the People) style.</p>
