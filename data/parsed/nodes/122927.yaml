    <p></p><div class="imageWrap"><img src="http://typophile.com/files/grotesk-sample_4708.jpg"></div><p></p>
    <p>This is from a book titled "Is Paris Burning?" and published by Simon and Schuster, Inc. in 1965.</p>
    <p>This font is only used on the inside front and back flap as a title for the maps on both. I thought it was Akzidenz-Grotesk Bold but now I'm not so sure (it's not Helvetica either). The boxed orange letters shown with the type image are Akzidenz-Grotesk Bold from <a>Berthold</a>.</p>
    <p>Any thoughts appreciated.</p>
    <p>Thanks!<br>
    -David</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        AG Old Face Bold        </div>
