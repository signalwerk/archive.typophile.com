    html: |-
      <div class="comment-spam-body"><p>Akzidenz-Grotesk was released by Berthold in 1896 as a metal type -- digital came in the 1980s. Also available as metal type from Linotype and Intertype. Your book is definitely pre-digital so ignore the digital release dates.<br>
      Digital versions are not necessarily a perfect match to the metal type.<br>
      Don</p>
      </div>
