      <p>hi,</p>
      <p>just check sites like<br>
      <a href="http://www.kayskreations.net/fonts/fonttb.html" title="http://www.kayskreations.net/fonts/fonttb.html">http://www.kayskreations.net/fonts/fonttb.html</a><br>
      or even MS's own typo site at<br>
      <a href="http://www.microsoft.com/typography/fonts/default.aspx" title="http://www.microsoft.com/typography/fonts/default.aspx">http://www.microsoft.com/typography/fonts/default.aspx</a><br>
      to get lists of standard fonts installed with specific applications.<br>
      I guess you will be able to figure out which of these are fixed width<br>
      ones?</p>
      <p>If you are looking for a good fixed width / programming font, just<br>
      check <a href="http://www.lowing.org/fonts" title="www.lowing.org/fonts">www.lowing.org/fonts</a> or keithdevens.com/wiki/ProgrammerFonts</p>
      <p>Jean</p>
