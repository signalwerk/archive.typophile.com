      <p>Yes, you are absolutely right. I just haven't found a lowercase set yet that was *pop* enough for me.</p>
      <p>Maybe what I ought to do is double back and begin my search again just focusing on the lc version of the word.</p>
      <p>The closest I've come to finding a lc set that felt right was Omnes Black Italic at the Village. I l-o-v-e that family of faces, and while the word looks great to me, and looks *popish* as well, it has a bit too much motion in it, me thinks.</p>
