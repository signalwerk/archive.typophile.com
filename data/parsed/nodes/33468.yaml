      <p>Yes, I've looked at this face before. It's an interesting combination of sophistication and funky, no?</p>
      <p>I really like it on its own merit, but don't think it's right for my project. In fact, I haven't seen any face that suits me when set in upper/lower case.</p>
      <p>So I've focused my efforts on an all-caps solution.</p>
      <p>*</p>
      <p>Regardless, I really appreciate your help Stephen!</p>
