      <p>Lex, thank you for your tip! I'm looking into Chalet now. London 1970 might work, but I have to figure out how to get a typeset sample.</p>
      <p>Stephen, you are on the money, as always. I really like Popgod for its funkiness, but for my word, Poptwin, the letterforms clash.</p>
      <p>So, yes, I am looking for a replacement for the entire logo. I'm starting to think that a custom design is the only real solution here.</p>
      <p>*</p>
      <p>Poptwin is media-driven online meetingplace, and represents one of the new projects I'm putting together now for my new venture, Plastic Trophy.</p>
      <p>Target ages: 16-35 with runoff into 45; which is what makes the branding tricky; I want it to be a little cliche, but not without sophistication. Something for the clubbers and the boosters as well.</p>
      <p>I'm thinking something like Bomb magazine, but with the edge toned down.</p>
