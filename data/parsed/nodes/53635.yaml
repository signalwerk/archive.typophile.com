      <p>&gt; Guttman’s Teamim are not lighter than the Nikud, thay are both same weight.</p>
      <p>In the famous Romm family typefaces of Vilna, Lithuania, popularly known as Vilna, the taam symbols were created lighter than the nikkud, unlike most other Hebrew fonts.</p>
      <p>Did Yoel Ginsburg do this like the original? My guess is not.</p>
      <p>If we look at all the incarnations of Vilna, this feature is dumped, like even many of the letterform designs.</p>
      <p>Frederick Goudy reports in his little book that the father Romm traveled to Italy with old drawings of the correct Vilna typefaces, and his original metal type masters were created based upon these drawings by the students of the famous Bodoni school of Type Design.</p>
      <p>My Romm/Vilna seeks to be a faithful re-creation of these typefaces.</p>
