      <p>&gt; later, computer programs were developed.</p>
      <p>Well, first there was Quark XPress, using the English or demestic operating system of either MS Windows or Apple Macintosh. It was the early or mid ninties.</p>
      <p>This was the "backwards" font solution.</p>
      <p>Since Quark could "flip the text box", take left-to-right text, and flip it over, the text appeared from right-to-left. Furthermore, text entered in such a flipped text box, could be entered and edited from right-to-left.</p>
      <p>I was working at FontWorld, see <a href="http://www.fontworld.com" title="www.fontworld.com">www.fontworld.com</a>, then. I and a few of our customers, used it for a while, before other competitors offerred less expensive solutions.</p>
      <p>It was a simple solution for Hebrew typesetting in a Western computing enviroment.</p>
