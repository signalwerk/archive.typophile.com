      <p>&gt; there were no underlaying rules<br>
      I disagree. Perhaps, you do not see any patterns in manually set typography. I think that they are there. Rather, one may determine that there is no pattern, because of the repeated inconcistancies  or exceptions. Either this was due to the limitations of the equipment, or the "creativeness" of the typesetter. </p>
