    <p>Here is a hebrew font I am working on these days.<br>
    the font was developed as OT using MS-VOLT<br>
    the font know to place the nikud+taam as one under the letter, which means that the nikud is brought back acourding to the width of the spesific taam so both the Nikus &amp; Taam are placed optimaly under the letter.</p>
    <p>there are still acouple of 'Dibukim' I yet to check but they are being worked on</p>
    <p>here is a sample file of Megilat Ester With Nikud And Taamey Mikra.</p>
    <p>Would to here your proffessional opinion.</p>
    <p>Eli Fried</p>
