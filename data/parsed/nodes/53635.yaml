      <p>As Raphael Freeman explained based upon Mr. Eliyahu Koren's approach to correct Biblical Hebrew typography, itself rooted in ancient Hebrew manuscripts, multiple Hebrew diacritics are not centered under vertical aspects of Hebrew letters.</p>
      <p>Rather, the nikkud is centered, and the meteg or taam on the nikkud's left is positioned off-centered. </p>
      <p>Usually, the combination of nikkud with meteg and/or taam, is treated as one unit. Then, the whole unit is centered.</p>
      <p>This is incorrect.</p>
      <p>Under a reish, for example, this incorrect approach often will lead to "bumping", where the nikkud/tam/meteg combination under the previous letter will "bump" into the combo under the reish.</p>
      <p>This is a basic rule. There are many exceptions, as we will explain. I will post visual samples to demonstrate them.</p>
