      <p>In those days, the only Hebrew typesetting program was on the Apple Macintosh, called "Ready Set Go for Hebrew". It was made for Arabic by the London based Diwan, see <a href="http://www.diwan.com" title="www.diwan.com">www.diwan.com</a>, through the wizardry of Adir Allawi, the brilliant son of Diwan's owner.</p>
      <p>There also was the Israeli Rav Ktav, but it had a very poor feature set. There was nothing on MS Windows.</p>
      <p>&gt; Tag used... Palron fonts<br>
      Is this Meir Palron? He must be a very old man today. </p>
      <p>Meir represented Varityper then, a line of dedicated Hebrew typesetting mini-computers. I had a Sinclair QL personal computer, around the time the IBM PC was becoming popular in Israel. I edited a book of Rambam (Maimonides) on it. I convinced my customer that instead of retyping all the data, I would "dump" it to the Varityper. The customer called Meir for some technical help. In those days, a cusstomer simply called a vender, "Hey, Meir, come over, I need some help." I think Meir wanted to see if my $400 personal computer could really do what the mini he sold for $8,000 could also do.</p>
      <p>Meir looked on in disbelief when after a few glitchs, it succeeded in 10 minutes.</p>
