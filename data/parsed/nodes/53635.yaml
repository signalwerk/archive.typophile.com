      <p>My font development work is based on InDesign ME CS/x, any MS Windows or Apple Macintosh System X (3 and higher). That's why I have an interest in sophisticated OpenType, which is needed for correct Biblical Diacritic Placement, and other fascinating things, like (automatic) shva-na, komatz katan, and meteg placement.</p>
