      <p>&gt; a well known dedicated program for Holi literature is called TAG By Daniel Weissman.</p>
      <p>A few years ago, most holy books were created in Tag. This was mainly because Tag infiltrated in Jewish world.</p>
      <p>Tag is code-based and not WSIWYG. It handled fonts in a non-standard way. Tag was rejected by most book producers.</p>
      <p>Today, Adobe InDesign CSx ME is the accepted standard. It is becoming more and more powerful, particularly with well-made OpenType fonts.</p>
      <p>I am creating well-made OpenType fonts for classic Hebrew typography, such as Biblical Hebrew, Hebrew Poetry, and Hebrew Primers. Each year, my Hebrew OpenType fonts are becoming more sophisticated.</p>
