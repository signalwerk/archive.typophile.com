      <p>The positioning of the nikkud and taam, and the combination of nikkud and taam, should fine-tuned.</p>
      <p>There are rules on positioning single diacritics which the sample doesn't adhere.</p>
      <p>It's not very bad. The average eye would admit that it's ok.</p>
      <p>However, it's not exact. You see this clear in many examples of double diacritics.</p>
      <p>In MS Volt, this is no big deal to correct, if the projects was created correctly.</p>
      <p>If the type designer knows MS Volt well, and is not just a type technician, but a very precise designer, this all can be corrected in a relatively short time.</p>
