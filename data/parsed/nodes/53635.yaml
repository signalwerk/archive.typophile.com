      <p>Typograph,</p>
      <p>You raised many valid points and interesting ideas.</p>
      <p>As a graphic artist, I lean strongly to the visual. I prefer to let the funtional be secondary, particularly in light of the fact that the reader rests his or her eyes upon the small configuration of letter+nikkud(+taam+meteg). If functional appearance would take precedence, then to that reader's eye, the configuration would look odd.</p>
      <p>I don't see how it is possible to easily support two different positioning systems with MS Volt. To my limited knowledge OpenType and InDesign ME support only one positioning system.</p>
      <p>Changing the weight in the font between the letter, which is darker, the nikkud which is lighter that the letter, and the taam, which is lighter than both the letter and the taam, is a very good technigue - as the visual approach can be maintained. In fact, the actual design of the letters, nikkud, and taam, seem to aim at this approach.</p>
      <p>Raphael Freeman told me that Mr. Eliyahu Koren also employed a heirichal system, where the nikkud was positioned closer to the letters, and the taam were lower, farther from the letters. Personally, I do not subscribe to this approach. I have noticed Hebrew publishers intentionally position the meteg lower than the nikkud; this is logical, as the roleof the meteg is special, different than the sounds associated with the nikkud.</p>
      <p>The tav has an interesting form, in which the center zone is smaller and more to the right, that the entire width of letter. Hence, visual centering is really off-center. Similarly, the tzaddi's horizontal base is further to the left in many designs, making its visul center really off-center.</p>
