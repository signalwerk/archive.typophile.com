      there were no underlaying rules, every word got its own treatment for nikud and taam as they went along. but mainly they placed the taam ofcentered.</p>
      <p>----------------------------------------------</p>
      <p>&gt; Many approaches<br>
      According to Raphael, multiple appraches existed because of the limitations of the equipment. This was confirmed to me by Scott Kesofsky of Philidor Company, see <a href="http://www.philidor.com" title="www.philidor.com" class="link-external">www.philidor.com</a>, an excellent master typographer who worked as a youth using previous generation typesetting equipment.</p>
      <p>&gt; there were no underlaying rules<br>
      I disagree. Perhaps, you do not see any patterns in manually set typography. I think that they are there. Rather, one may determine that there is no pattern, because of the repeated inconcistancies  or exceptions. Either this was due to the limitations of the equipment, or the "creativeness" of the typesetter. </p>
      <p>Many non-religious and even some semi-religious find it difficult to be disciplined and express their creativity in different ways.</p>
      <p>I am not being condescending or self-righteous at all. I am just calling a spade a spade, as they say.</p>
      <p>Wait a second, Eli. Let me get off my high horse, and hide behind thee barrel to dodge the rotten tomatoes.</p>
