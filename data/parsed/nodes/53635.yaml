      <p>Hi GoHebrew:<br>
       Their are two approaches to this issue.</p>
      <p>1. Visualy<br>
      2. Functionly</p>
      <p>Let me explain.</p>
      <p>Visualy, Having the Nikud+Taam As one unit is better, in the exeption Of Dalet,Vav,Yod,Resh where indeed the taam comes of centered to the nikud.</p>
      <p>But, Function wise, we devide Letter, Nikud, Taam.<br>
      Where the letter is the most important<br>
      next In Line comes the Nikud, and at last TAAMIM.<br>
      Thetefor<br>
      Nikud sould be lighter than letter, and taam lighter than nikud, approaching this arrgument' you are correct, taam comes of centered the nikud.</p>
      <p>so, My fonts support the two methods<br>
      normaly, in MARK proceedure, the Taam comes of centerd the Nikud.<br>
      But activating a style allows moving back the Nikud accourding to width of taam, and relink taam to nikud wich was demonstrated in the example that i uploeded.</p>
      <p>however, I would love to hear what you have to say about this issue.</p>
