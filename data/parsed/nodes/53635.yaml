    html: |-
      <p>GoHebrew:<br>
      Hi, From earlier threads in the forum i see you have great interest in hebrew typography, biblical diacritics issues and opentype development.</p>
      <p>first let me introduce my self.<br>
      my name is Eli Fried.<br>
      Lives in Israel.<br>
      Hebrew type designer.<br>
      (designed over 100 typefaces where over 50 faces are sold through MasterFont).</p>
      <p>over the years i have studied and learned hebrew typography to depth and discovered much wich i am going to make an attempt to share with you.</p>
      <p>as an israeli, my point of view of hebrew typography might differ from Raphael Freeman's point of view.</p>
      <p>now, lets divide this post into 2 parts<br>
      1. Nikud and Teamim: the way they were applied troughout the years.<br>
      2. tech issues regarding volt and opentype.</p>
      <p>1] biblical literature had meny approaches as technology had developed. so lets examine some of them.</p>
      <p>the first Chumashim, Tikuney Koreem were manualy set.<br>
      there were no underlaying rules, every word got its own treatment for nikud and taam as they went along. but mainly they placed the taam ofcentered.</p>
      <p>later, computer programs were developed.<br>
      a well known dedicated program for Holi literature is called TAG By Daniel Weissman.</p>
      <p>Tags font used Guttman And Palron fonts.<br>
      the way TAG preferes to deal with Teamim is by bringing the Nikud Back and placing both Nikud &amp; Taam As one unit.<br>
      Taam does not come of centered of the nikud as in the<br>
      manual settings.</p>
      <p>this is the way daniel weissman programs his kern tables.<br>
      users if tag might kern the table differently.</p>
      <p>Guttman's Teamim are not lighter than the Nikud, thay are both same weight.<br>
      in this approach taam and nikud act as one in are only hints and nothing main. so we do not approach the taam with less importance than the nikud.</p>
      <p>next to open type fonts were developed.<br>
      1. Sil Ezra<br>
      2. Guttman Vilna by yoel ganzburg</p>
      <p>both tried bringing back nikud when there is a taam.<br>
      both used Mark and/or  MarktoMark Positioning but could not utilize the pair abjusments  because indesign CS did not Support this fuction in right to left.</p>
      <p>trying to do so, indesign would shift the nikud forwards rather than backwards this bug was only fixed in CS2<br>
      (Office 2003 allready did support this)</p>
      <p>instead, both projects use 3 minus spaces glyphs in order to shift back the nikud. this resulted unaccurat positioning because glyphs were treated as THIN SPACE, MIDSPACE and WIDE SPACE.</p>
      <p>today, hebrew fonts can use Pair abjusments in order to move back the nikud rather than minus spaces, this results much more accurate positioning.</p>
      <p>Now, in my fonts Normal  does not include The Pair abjusment feature. with a Stylistic Set you may use a pair abjustment and then replacing taam to nikud.</p>
      <p>this featur must come after  feature.</p>
      <p>TRY IT OUT.</p>
