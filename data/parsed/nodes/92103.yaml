  html: |-
    <p>I'm always on the lookout for "fabulous" scripts, ones with a bit of fifties, sixties or seventies sophistication that you might expect in a classic department store window or on a Las Vegas sign. Some examples are, of course, House Industries' Las Vegas Fabulous:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/temp_3617.png"></div><p></p>
    <p>Stuart Sandler's Cocktail Shaker from Sideshow:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/325c73739004859fda0ba2b6920b5c[1]_5022.gif"></div><p></p>
    <p>And Alejandro Paul's Storefront Pro from Sudtipos, with all its <a class="freelinking external" href="http://origin.myfonts.com/s/aw/original/146/0/74883.jpg" rel="nofollow">alternate swashes</a>:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/9eaa6ecbac0f0a217794801f5a601a[1]_5743.gif"></div><p></p>
    <p>Know of any others?</p>
