    <p>Okay well, I might be a lil late to share this but never mind. Another spooky Halloween is here and you must be geared up for all the trick-or-treating, mischief-making and carving jack o’ lanterns. Being a designer, you know that every year in the Halloween season you get to work on projects related to Halloween parties and event. So, get ready to get in order to design those haunting and unnerving posters, party invites, cards, and decorations etc. Here are 13 freebie fonts that you can use in Halloween projects and also in other logo design schemes.<br>
