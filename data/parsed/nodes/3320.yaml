    <p>Hi! <br>Long time since this: <br><a href="http://www.typophile.com/forums/messages/29/10709.html?1055775049" target="_blank">http://www.typophile.com/forums/messages/29/10709.html?1055775049</a> <br> <br>Since my first font i have build lots of "pseudo" typefaces, read and saw lots of typohile threads. <br> <br>This is a new font i'm building, that I want to use for a new brand. (Custom type). I've just spend  a few hours in Freehand and Fontlab, so this is a "work in progress". I wish to create a light version, and a bold. (i'm affraid of the italic). <br> <br>I'm sad because i've printed some 9/12pt samples, and this isn't readable. Help me! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I would like to hear your comments. Thanks a lot.<img src="http://www.typophile.com/forums/messages/29/27283.gif" alt="aura im 01"><img src="http://www.typophile.com/forums/messages/29/27284.gif" alt="aura im 2"></p>
