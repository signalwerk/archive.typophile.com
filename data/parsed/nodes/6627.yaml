    html: '<p>Myfonts.com <br>Robert E. Smith: American lettering designer associated with ATF from 1933 to 1942. <br> <br>Adobe.com <br>Brush Script was designed in 1942 by Robert E. Smith for American Type Founders. It has a spontaneous, brush-written look, and the lowercase letters are connected as in handwriting. Brush Script is ideal for casual display work where an informal, handwritten style might be advantageous, such as posters and signage.  <br> <br>Fonts designed by Robert E. Smith: <br>Brush Script <br>Park Avenue <br> <br><a href="http://home.bsu.edu/prn/credits.html" target="_top">http://home.bsu.edu/prn/credits.html</a> <br>Brush Script was designed by Robert E. Smith for American Type Founders. It looks spontaneous and lively with the lowercase letters connected as <br>      in handwriting. Brush Script is ideal for casual display work where an informal, handwritten style might be advantageous. Brush Script MT is available in Type 1 or True Type <br>      from Monotype, Adobe, et al. and is bundled with Microsoft Office.</p>'
