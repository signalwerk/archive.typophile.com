    html: <p>Out of the many different type sizes of the original hot metal version they chose one size (probably for phototype setting) that is by reproduction not the same as the originally printed in text size on coated paper. Plus the recreation of old faces for phototype usually was a bit sloppy, due to enormous time limits.</p>
