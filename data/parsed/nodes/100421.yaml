    <p>Hello everyone.</p>
    <p>I'd like to buy whatever digitization of Italian Old Style most closely resembles that in the attached jpeg.</p>
    <p>However, the Monotype Italian Old Style available digitally looks nothing like it. Lanston's does, but it lacks small caps and old style figures.</p>
    <p>Thanks in advance for the guidance.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ital_4056.jpg"></div><p></p>
