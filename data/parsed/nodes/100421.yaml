    html: |-
      <p>Actually there are Small Caps and oldstyle figures available digitally: They are contained in Richard Beatty’s digitization called «Goudy Italian Old Style»:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/beatty-goudy-italian-old-style_5434.png"></div><p></p>
      <p>It’s available at <a href="http://www.fontshop.com/fonts/downloads/richard_beatty/goudy_italian_ot/" rel="nofollow">FontShop</a>.</p>
      <p>There are some notable diffences to the scan from the Monotype metal version though, e.g. the width of the W, which probably had to be narrowed to fit the Monotype unit system.</p>
