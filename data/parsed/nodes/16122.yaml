    html: |-
      <p>The lowercase 'e's in the bow feel a bit disturbing to me now, not so much the right-reading one (I like that one a lot), but the reversed one. Also, I'm not so sure your type should have so much letterspace. If you want to make the overall impression lighter, go with a lighter face or an italic. Letterspaced lowercase disrupts the word shape and the relationship of the letters, hurting the viewer's ability to get a quick read.</p>
      <p>You probably don't have to make the fact that the bow is made lowercase 'e's so direct. I recommend separating the two and just setting some good easy-to-read type and allowing for the 'Ah ha!' moment with the flower mark. Or, you could add the reversed pink 'e' to the brown initial 'e' in both expressive and in events...might work.</p>
      <p>Have you tried italic type?</p>
