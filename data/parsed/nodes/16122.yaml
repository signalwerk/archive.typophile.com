    html: |-
      <p>Cio,</p>
      <p>You've found a clever way to use the two e(s) as a bow. I prefer the original as it seems a little  less "worked over". I wonder if you really need it in the name also. If you simply chose a nice typeface and then used the mark alongside or elsewhere I think it would be stronger.</p>
      <p>I also don't think you need the pink underscore, especially at that weight. What if you make it thinner and hand-drawn to tie-in with the hand quality of the mark?</p>
