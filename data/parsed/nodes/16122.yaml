    html: |-
      <p>Thank you all for your comments so far...I have found them very insightful.</p>
      <p>Chris, I had tried italic type (in the very early stages of the design), I found that including the symbol along with the italic type didnt work as well. The client and I had agreed that the symbol should be able to be part of the logo itself but be easily separated from the logotype in order to be used as an icon or watermark on some materials. That is part of the criteria that I must work the design around, but if you have any other suggestions I would be happy to hear them.</p>
      <p>Miss Tiffany, I will try a version with the pink underscore at a lighter weight and one that is more hand-drawn as well. Thank you for the suggestion.</p>
