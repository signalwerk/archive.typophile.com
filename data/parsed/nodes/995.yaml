  - id: 137241
    user: 103
    date: 2003-08-21T12:27:00
    date_raw: 21 Aug 2003 — 12:27pm
    votes: null
    html: "<p>If you're looking for something that emulates hand printing <br>your choices are slim. Most are too formal (Petrarch), too <br>cute (Comic Sans), or too mechanical to pass for handwriting. <br> <br>Here are a few that emulate real, legible hand scripts:  <br> <br><a href=\"http://www.myfonts.com/fonts/agfa/fineprint/?refby=typographica\" target=\"_blank\">Fineprint</a>, <a href=\"http://www.myfonts.com/fonts/linotype/zemke-hand-itc/?refby=typographica\" target=\"_blank\">Zemke Hand</a>, <a href=\"http://www.myfonts.com/fonts/agfa/longhand/?refby=typographica\" target=\"_blank\">Longhand</a>, <a href=\"http://www.myfonts.com/fonts/agfa/erazure/?refby=typographica\" target=\"_blank\">Erazure</a>, <a href=\"http://www.plazm.com/fonts/catalog/catalog.asp\" target=\"_blank\">Petescript</a>, <br> <a href=\"http://www.myfonts.com/fonts/redrooster/grove-script-rr/?refby=typographica\" target=\"_blank\">Grove Script</a>, <a href=\"http://www.fonthaus.com/products/fonts/view.cfm?CFID=100108&amp;CFTOKEN=34681066&amp;SKU=BS10100\" target=\"_blank\">Felt Tip Roman</a> (Mark Simonson's best-seller),  <br>and the hugely popular <a href=\"http://www.typequarry.com/type.html?sku=016&amp;cart=10614938411026231\" target=\"_blank\">Marydale</a> from the <a href=\"http://www.typequarry.com/fams.html?cart=10614938411026231\" target=\"_blank\">Type Quarry</a> which  <br>sells a few other good scripts, including some nice <br>historical reconstructions.</p>"
    html_clean: "<p>If you're looking for something that emulates hand printing <br>your choices are slim. Most are too formal (Petrarch), too <br>cute (Comic Sans), or too mechanical to pass for handwriting. <br> <br>Here are a few that emulate real, legible hand scripts:  <br> <br><a href=\"http://www.myfonts.com/fonts/agfa/fineprint/?refby=typographica\" target=\"_blank\" class=\"link-external\">Fineprint</a>, <a href=\"http://www.myfonts.com/fonts/linotype/zemke-hand-itc/?refby=typographica\" target=\"_blank\" class=\"link-external\">Zemke Hand</a>, <a href=\"http://www.myfonts.com/fonts/agfa/longhand/?refby=typographica\" target=\"_blank\" class=\"link-external\">Longhand</a>, <a href=\"http://www.myfonts.com/fonts/agfa/erazure/?refby=typographica\" target=\"_blank\" class=\"link-external\">Erazure</a>, <a href=\"http://www.plazm.com/fonts/catalog/catalog.asp\" target=\"_blank\" class=\"link-external\">Petescript</a>, <br> <a href=\"http://www.myfonts.com/fonts/redrooster/grove-script-rr/?refby=typographica\" target=\"_blank\" class=\"link-external\">Grove Script</a>, <a href=\"http://www.fonthaus.com/products/fonts/view.cfm?CFID=100108&amp;CFTOKEN=34681066&amp;SKU=BS10100\" target=\"_blank\" class=\"link-external\">Felt Tip Roman</a> (Mark Simonson's best-seller),  <br>and the hugely popular <a href=\"http://www.typequarry.com/type.html?sku=016&amp;cart=10614938411026231\" target=\"_blank\" class=\"link-external\">Marydale</a> from the <a href=\"http://www.typequarry.com/fams.html?cart=10614938411026231\" target=\"_blank\" class=\"link-external\">Type Quarry</a> which  <br>sells a few other good scripts, including some nice <br>historical reconstructions.</p>"
