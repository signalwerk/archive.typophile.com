    html: "<p>Joshua wrote, <br> <br>&gt; What are some favorite handwritten fonts... <br>&gt;specifically, hand printing(...) <br> <br> <br>One of my favorites for about ten years now is my good friend Gary Eckstein's 'TF Gary' design: <br> <br><img src=\"http://www.typophile.com/forums/messages/30/14658.jpg\" alt=\"TFGaryBold\"> <br>To my amazement, his handwriting actually looks like this. After a lot of nudging, I was finally able to cajol him into turning it into a font. <br> <br>It's available in three weights - Light, Medium and Bold - and has been well used by some major print and online marketers. <br> <br>Joe <br> <br></p>"
