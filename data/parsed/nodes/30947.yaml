      <p>For kerning I would suggest printing it out and squinting at it from the top of the page (the characters are upside down, so you are not concentrating on the characters in a familiar setting, squinting reduces the amount of light that your eyes register so it should appear almost as a grey blur), the squinting should reveal any particularly dark or light patches, the aim is to reduce these areas.<br>
      However, a small logo should have looser kerning than a big one (letterhead compared to side of a van) so you need to do this at approximately the correct size.<br>
      As a start get the RI correct (I think that is going to be the crucial pair) and then work the other characters until the squint technique shows that there aren’t any significantly lighter or darker areas. Ultimately you don’t want to reduce the readability, especially important with an unfamiliar word, so you might have to sacrifice some kerning.<br>
      Tim</p>
