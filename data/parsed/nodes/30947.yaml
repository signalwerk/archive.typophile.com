      <p>I think #1 or #2 are better than #3.  That one is too spaced out.  I've always found the best way to kern a logotype is to take it in 3 letter groupings at a time.  Get the TRI worked out, then do RIC, then ICI, CIF, IFI and finally FIC.  That helps ensure an evenness.  Then you can go back and optically tweak everything to perfection.</p>
      <p>For clarification, Tricific isn't a consumer brand, is it?  If so, the whole thing seems a bit cold.  If it's just a manufacturer and supplier (i.e. B2B), then you're fine.</p>
