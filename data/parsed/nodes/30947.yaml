    <p>hi there.</p>
    <p>i'm working a new logo for Tricific, a linen manufacturer and wholesaler. the company has been around for about 40 years and they wanted a new identity to show their history and success.</p>
    <p>i've come up with a simple logo that resembles a corner of a piece of fabric. the company sells a wide range of table cloths, napkins, bedsheets, and aprons, among other products, and i wanted to hint at the textile/linen nature of all these items without going into the details of stitching, threads, etc.</p>
    <p>for the wordmark i've used minion bold and i'm trying to finalize the character spacing and logo size and position right now. any comments will be much appreciated. thanks a lot. </p>
    <p>[edit]</p>
    <p>ok i've tried kerning the logo, but i'm not very good at it. could someone please give some pointers? please refer to logo3.jpg. thanks.</p>
