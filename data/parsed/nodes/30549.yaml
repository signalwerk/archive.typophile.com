    <p>I'm currently designing a logo for a solar car racing team. The mark is pretty much solidified at this point, but I'm looking for type to complement it. Attached is the b/w version (since the colours aren't finalized yet).</p>
    <p>I suggested Proxima Nova for the type, but the client said it was "too blocky". Their old logo used Eras Bold, and they want something "like that". So the requirements are:</p>
    <p>-Italic<br>
    -Shapes that complement the sun's rays from the image<br>
    -Not "too blocky"<br>
    -Budget-conscious</p>
    <p>Thanks a bunch in advance,</p>
    <p> - Lex</p>
    <p><cite>EDIT: I removed the images because I'm paranoid about people stealing my ideas :P<cite></cite></cite></p>
