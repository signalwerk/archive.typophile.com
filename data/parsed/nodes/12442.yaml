    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Nick&nbsp;Shinn</strong></p>
    <p>Nick Shinn was born in <a href="/node/add/wiki?edit%5Btitle%5D=London" title="Create node &quot;London&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">London</a>, <a href="/node/add/wiki?edit%5Btitle%5D=England" title="Create node &quot;England&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">England</a>, in 1952. He attended school at Leeds Polytechnic where he earned a Dip. <span class="caps">AD</span> in Fine&nbsp;Art.</p>
    <p>In 1976 he moved to <a href="/node/add/wiki?edit%5Btitle%5D=Toronto" title="Create node &quot;Toronto&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Toronto</a>, <a href="/node/19573" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Canada</a>, where he worked as an art director and creative director at a number of Toronto advertising agencies from the 1970s into the 1980s. In 1989 he started ShinnDesign, his own digital studio, specializing in publication design. Nick has designed everything from books and magazines to web&nbsp;sites. </p>
    <p>Since 1980 he has designed over 20 typeface families, some for respected publishers, including Walburn and Brown for the Canadian daily “The Globe and Mail.” Many of Nick’s early type designs were published by various <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">foundries</a>, most notably the <a href="/node/13594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont</a> library. In 1999 he launched <a href="/node/12744" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">ShinnType</a>, which now publishes and markets his fonts worldwide. Nick is a prolific writer and often contributes to “Graphic Exchange” magazine, as well as many other publications. He has also had speaking engagements at conferences such as <a href="/node/13403" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AT</span>ypI</a> and <a href="/node/12014" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">TypeCon</a> and was a member of the board for <a href="/node/12153" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">The Society of Typographic Afficionados</a>.</p>
    <p>Of his typeface designs, Shinn says, “Beautiful letters aren’t enough to make a successful typeface; I also want to create faces that are design&nbsp;solutions.”</p>
    <p>links:<br><a href="http://www.shinntype.com">ShinnType</a><br><a href="http://typographi.com/000814.php">Say Hello to Nick&nbsp;Shinn</a></p>
