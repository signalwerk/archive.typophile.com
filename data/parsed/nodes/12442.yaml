    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Nick Shinn</strong></p>
    <p>Nick Shinn was born in <a href="/wiki/London" class="freelinking" rel="nofollow">London</a>, <a href="/wiki/England" class="freelinking" rel="nofollow">England</a>, in 1952. He attended school at Leeds Polytechnic where he earned a Dip. AD in Fine Art.</p>
    <p>In 1976 he moved to <a href="/wiki/Toronto" class="freelinking" rel="nofollow">Toronto</a>, <a href="/wiki/Canada" class="freelinking" rel="nofollow">Canada</a>, where he worked as an art director and creative director at a number of Toronto advertising agencies from the 1970s into the 1980s. In 1989 he started ShinnDesign, his own digital studio, specializing in publication design. Nick has designed everything from books and magazines to web sites. </p>
    <p>Since 1980 he has designed over 20 typeface families, some for respected publishers, including Walburn and Brown for the Canadian daily "The Globe and Mail." Many of Nick's early type designs were published by various <a href="/wiki/Foundries" class="freelinking" rel="nofollow">foundries</a>, most notably the <a href="/wiki/FontFont" class="freelinking" rel="nofollow">FontFont</a> library. In 1999 he launched <a href="/wiki/ShinnType" class="freelinking" rel="nofollow">ShinnType</a>, which now publishes and markets his fonts worldwide. Nick is a prolific writer and often contributes to "Graphic Exchange" magazine, as well as many other publications. He has also had speaking engagements at conferences such as <a href="/wiki/ATypI" class="freelinking" rel="nofollow">ATypI</a> and <a href="/wiki/TypeCon" class="freelinking" rel="nofollow">TypeCon</a> and was a member of the board for <a href="/wiki/SoTa" class="freelinking" rel="nofollow">The Society of Typographic Afficionados</a>.</p>
    <p>Of his typeface designs, Shinn says, “Beautiful letters aren’t enough to make a successful typeface; I also want to create faces that are design solutions.”</p>
