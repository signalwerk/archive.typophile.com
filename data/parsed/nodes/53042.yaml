  html: |-
    <p>Over my Christmas slow-down, I stumbled across this, which is the closest I've found to my typeface so far. There are a number of differences, and in the main they are down to me aiming for this to be a contemporary typeface, rather than a 70s throw-back.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/london1970_5025.jpg"></div><p></p>
    <p>It is actually only the lower-case that are really similar, I aim for my upper-case set to be much more angular. USeful for reference though!</p>
