  html: |-
    <p>What font would you use to express the words "Tribal Goddess"? I want something expressing feminine strength, power and beauty. Not too smooth, refined or delicate, but not heavy-metal hard-edged either. I thought of maybe a bold Art Nouveau with organic shapes, but can't find what I want. </p>
    <p>If you need inspiration, here are two of the dancer/models:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/maureen607-7inch_5348.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sharon-album-pic-5inch_3851.jpg"></div><p></p>
    <p>I'm laying out my own book on costume design, one of a series. The first 20 pages showcases sub-genres of Tribal bellydance costume. Each genre has a header in a that suits it, for instance: "Goth" "Steampunk" "Industrial".</p>
