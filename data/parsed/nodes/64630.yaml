    html: |-
      <p>Probably most Tribal bellydancers have one or more tattoos, so it is considered by some to be part of their stage image and identity, yes. </p>
      <p>Sharon Kihara does indeed have extensive permanent tattoos. The peacocks on her abdomen are photo-realistic. I'm not into the tattoo scene; when I see hers, I'm  fascinated yet slightly horrified that young impressionable girls try to copy this. So the other two dancers pictured on the spread have none. </p>
      <p>If you want to see the tattoos in color, here is her website:<br>
