    html: |-
      <p>It depends on where you are sending your resume. Many larger companies use an electronic file system that relies on OCR scans of received documents. Keep optical character recognition in mind and you should do fine.</p>
      <p>If you know for sure that your resume will actually be seen and read by humans, make it as pretty as you can.</p>
