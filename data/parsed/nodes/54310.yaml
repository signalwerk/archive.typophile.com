    html: |-
      <p>Of color, proportions and spacing the last can indeed be tweaked during typesetting, but I do say tweaked because there are "boundary conditions" to worry about, and if you go too far problems will start raining on you. Think about the right side of "r" for instance: the right sidebearing will typically be very close to flush against the glyph, so if you track the font tighter, things -like the left serif of the "v"- will start colliding with the beak; and if you track the font looser you don't actually want the right sidebearing to increase, because the type designer was fighting the whitespace to begin with. One thing that tends to help though is InDesign's optical spacing.</p>
      <p>For a properly spaced font, tracking is poison.</p>
      <p>hhp</p>
