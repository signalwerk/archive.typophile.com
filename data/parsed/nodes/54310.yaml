      <p>I have never liked Meridien. For a start, it always looked unpleasantly spikey to me, as it does to Nina. Looking at the interesting link to Linotype, I think it was also the width. Even the new Frutiger Serif, while distinctly better, for me still doesn't work. There is still something off about the rhythm of it. </p>
      <p>As to the x-height, I also think it is too big for a book face, but for other uses, such as tightly packed narrow columns, it might work.</p>
      <p>It is interesting to compare this with Rocky, which is also a very spikey face, but works beautifully, in my eyes. I think it is because Carter varies the weights of the spikes well.  </p>
      <p>IIRC John Hudson has written that he's an admirer of Meridien, so perhaps he'll come on this thread and tell us of its virtues.</p>
