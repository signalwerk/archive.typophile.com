      <p>Hah. Alright, thanks for the -dlb- examples.</p>
      <p>Back to Meridien: Looking more closely at the full scan you linked to (and spending time I really shouldn't be ;-), I have come to the conclusion that there is something definitely funky going on with the fitting of this setting.</p>
      <p>Since the sorts of weirdness I'm seeing are what I would consider amateurish inconsistencies (especially in terms of straights vs. rounds), and since Frutiger and Linotype are not amateurs, I'm going to go out on a limb and suggest that this book was set with Adobe InDesign's Optical metrics applied.</p>
      <p>Nina, is this a recent enough publication where this could be a possibility?</p>
      <p>Without testing with Meridien itself to replicate the exact same idiosyncrasies and confirm (I don't have Meridien), I can't be absolutely certain, of course. But I have seen Adobe's Optical metrics do this sort of destruction before -- things like pushing out straight-straights and arch-straights, pulling in arch-rounds; it will even exacerbate the "llb" irregularity. </p>
      <p>(I've seen Whitman used with Optical metrics, and at first I was suddenly plagued with self-doubt and thought I was going crazy.)</p>
      <p>The more I think about this, the more convinced I am about this theory.</p>
      <p>Parents: Please, don't let your kids use Optical metrics! Please!</p>
      <p>-- Kent.</p>
