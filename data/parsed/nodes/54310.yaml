      <p>I can't tell how your example was printed, but when I think of too-light fonts from that era my suspicions go to a design intended for letterpress printed otherwise. I read that Frutiger developed Meridien for Lumitype but also had a metal version cut at the same time. Maybe the design is accordingly a compromise? </p>
      <p>In those eras of overlapping printing technology, when fonts were released simultaneously in multiple formats, were they adapted accordingly or more often executed from the same drawings blindly?</p>
