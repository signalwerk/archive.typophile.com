      <p><cite> &gt; Doesn’t that kind of depend on the font used (&amp; how well it was originally spaced), though? </cite></p>
      <p><cite> &gt; But Kent, many fonts are so poorly spaced that it can help.</cite></p>
      <p>I will admit I am not at all a fan of Optical metrics (in Adobe's implementation), except for perhaps a very few, limited circumstances. In my opinion, it should never be used for text settings (certainly not books). Maybe it can improve poor spacing to become mediocre. I've never seen it produce decent spacing overall; and I've never seen it improve spacing to the point where it is acceptable for book text. </p>
      <p>But maybe that's because I would never consider trying to use something for the sort of work I do that was poorly spaced to begin with.</p>
      <p><cite> &gt; Optical spacing is just another tool that can be used well or poorly.</cite></p>
      <p>Mostly poorly. It's a reckless tool. No controls. Which is why I generally advise against it. If you don't have the discernment to evaluate the results, don't use it. (If you do have the discernment, then what are you doing working with a poorly spaced font in the first place.)</p>
      <p>Sorry, is my cranky side showing? ;-)</p>
      <p><cite> &gt; Wouldn’t that make the whole thing much tighter?</cite></p>
      <p>In my explorations, it doesn't necessarily tighten text settings. Display, yes. But not text size. Mostly it just shifts space around. Seems like it puts in as many positive kerns as it does negative ones. (Like straight-straights on the order of 15–35 units).</p>
      <p>-- K.</p>
