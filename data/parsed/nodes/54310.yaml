      <p><cite> &gt; (like that “llbl” sequence in “Hüllblättern” – the second “l” looks a hair too close to the “b” to me, </cite></p>
      <p>While I also think there might be something a little off about the fitting of Meridien (or perhaps its just this particular setting), I have to say that this discrepancy you point out in "Hüllblättern" is actually something that I suspect you'll find in most fonts (although, perhaps to a lesser degree).</p>
      <p>In a typical serif font, the left sidebearing of a <em>b</em> will be less than that of <em>h k l</em> to account for the lack of foot serif -- I would say 80–85% would not be uncommon. In most combinations, this difference is necessary to get good fitting. The only circumstance where you're likely to notice the discrepancy in ascender intervals is in the sequences "llb" or "dlb." I don't know how common "llb" is in German; I would imagine "dlb" doesn't exist in the wild.</p>
      <p>Including a "lb" positive kern pair in a font is probably a pretty rare thing.</p>
      <p>Just thought I'd point that out.</p>
      <p>-- K.</p>
