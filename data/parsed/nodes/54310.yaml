      <p>Yes, Gaussian.</p>
      <p>Talus is not a common term; but there are no common terms for the empty space above the ascenders and below the descenders, even though it's a very important part of a font. "Internal leading" is clunky and potentially confusing. Sometimes you need a fresh term to make a clean break, and talus (which I didn't make up myself) fits the bill for me. And it doesn't hurt that it sounds classy.  :-)</p>
      <p>hhp</p>
