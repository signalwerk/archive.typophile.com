      <p>William, I don't remember exactly - I think he admired its atmosphere and letterwise craft. I'm pretty sure it was in "Types Best Remembered / Types Best Forgotten" by R Norton that I read it - a must-have book for the true blue typophile.</p>
      <p>Nina, in that setting the x-heights are indeed the same, but thanks to a much smaller talus* Frutiger Serif in fact has a smaller relative x-height. However, it needs more leading, so people might end up setting it smaller (a good thing here) so the two become closer in a way. What's very useful though is that they seem to have equalized the apparent sizes of the two fonts (at the same point size). Maybe this is something Adrian Frutiger did originally? It's difficult to give Kobayashi too much credit however.</p>
      <p>* Also called internal leading.</p>
      <p>BTW, I'm glad you liked that page of mine. Just to be crystal: the blurring I show there isn't of course exactly the sort of thing the eye sees, it's a... dramatization if you will. Nonetheless, I believe it's a useful parallel to how vision works.</p>
      <p>hhp</p>
