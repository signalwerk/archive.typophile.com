    html: |-
      <p>You include some talus in a font to avoid lines touching, especially when you factor in cap accents. And you leave the right amount at top and bottom* simply by ending your ascenders and descenders "early". Of course you plan all your vertical proportions in advance, because you don't want to scale stuff as a result of changing your mind (and deviating from a 1000 unit Em can cause problems, like on older systems).</p>
      <p>* I do around 3/4 at top and 1/4 at bottom.</p>
      <p>hhp</p>
