  html: |-
    <p>Editor, <a href="/wiki/typographer" class="freelinking" rel="nofollow">typographer</a>, writer and critic. Founder of the publishing imprint <a href="/wiki/Hyphen%20Press" class="freelinking" rel="nofollow">Hyphen Press</a> in 1980. Kinross has contributed much to magazines, including Eye, Blueprint, Information Design Journal, and the Journal of Design History. </p>
    <p>Hyphen Press now publishes a range of titles on typography and design, recent Hyphen Press publications include the second edition of Modern Typography (2004), The Stroke (2005), and Gerrit Noordzij's theory of writing.</p>
    <p><a href="http://www.hyphenpress.co.uk/journal/2000/08/21/kinross_interview" rel="nofollow">An Interview with Robin Kinross</a><br>
    <a href="http://www.typotheque.com/site/author.php?id=54" rel="nofollow">Robin Kinross at Typotheque</a></p>
