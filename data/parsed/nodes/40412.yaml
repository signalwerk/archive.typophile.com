  html: |-
    <p>Editor, <a href="/node/12023" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typographer</a>, writer and critic. Founder of the publishing imprint <a href="/node/add/wiki?edit%5Btitle%5D=Hyphen%20Press" title="Create node &quot;Hyphen Press&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hyphen Press</a> in 1980. Kinross has contributed much to magazines, including Eye, Blueprint, Information Design Journal, and the Journal of Design&nbsp;History. </p>
    <p>Hyphen Press now publishes a range of titles on typography and design, recent Hyphen Press publications include the second edition of Modern Typography (2004), The Stroke (2005), and Gerrit Noordzij’s theory of&nbsp;writing.</p>
    <p><a href="http://www.hyphenpress.co.uk/journal/2000/08/21/kinross_interview">An Interview with Robin Kinross</a><br><a href="http://www.typotheque.com/site/author.php?id=54">Robin Kinross at&nbsp;Typotheque</a></p>
