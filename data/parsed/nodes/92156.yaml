    <p>Hello people of typophile! </p>
    <p>First of all, english is not my native language, so i hope not to make too much mistakes in my communication! I've been a reader of the forum for years, and by now I thought that my first post would have been for the release of a typeface, but nope.. not yet...</p>
    <p>I'm designing a display typeface and I want to include a small set of ornaments, many of them to build frames, borders, divisions and patterns. So for example, let's say i have 4 glyphs that make for the corners of a frame (top left, top right, bottom left, bottom right) and the glyphs for the borders between the corners; then, is there any common disposition of them in the keyboard? I couldn't find info for this. Tried to find user's guide from the foundries explaining to the final user how to build the borders using fonts like that. I don't own any font of the kind.</p>
    <p>Maybe there is some common used encoding for these symbols. Besides frames and borders, I have tiles for making background patterns and decorative elements for the begining and end of a text line.</p>
    <p>I hope someone could point me in the right direction, and hope i wasn't confusing so you can understand me!</p>
    <p>Greetings and thanks for reading.</p>
    <p>Gabriel</p>
