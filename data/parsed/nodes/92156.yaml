      <p>Thank you both for your replies! I feel like a dork for using the word 'coding'. I edited the post, changed it to 'encoding'. Thanks Theunis.</p>
      <p>Interesting Nick, I guess it's up to the designer then to choose the "logical" way to arrange the elements in play, so it makes some sense for the user.</p>
      <p>Somehow I thought that every alternate had to be be placed in the PUA, those kind of things you learn once and repeat forever.<br>
      Reading Theunis reply makes me realize it's taken for granted that these ornaments should be included in the one and only final OTF file. But, I wonder: is it anachronistic to deliver the borders and ornaments in a separate file? Is it a "don't" by today standards? Otherwise I feel those treats would be kinda buried in the font, which will probably have its own set of alphabetic alternates as well.</p>
      <p>Thanks again.</p>
      <p>Gabriel</p>
