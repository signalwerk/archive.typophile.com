      <p>Gabriel,</p>
      <p>The nice thing about having them in the same font is that it would be one less font to worry about. Not to mention the fact that most of the separate fonts use code points assigned to other symbols (i.e. a = left upper corner), if the font is changed, than the characters are changed. Also, if the characters aren't converted to outlines, I assume, the final output (if it were a PDF), would have the borders be searchable characters in the document.</p>
      <p>Also, if it's in the same font, you can use the CALT or one of the SS features to transform something like "&lt;---~~--&gt;" into an ornament.</p>
      <p>I'm working on this issue myself as I'm making my first typeface which includes borders. I'm planning on keeping the ornaments in the same font and use the CALT method. I'm not sure if I'll be using the PUA or not, once I've done some more testing I'll make that decision.</p>
