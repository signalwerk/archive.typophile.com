  html: |-
    <p>Hello,</p>
    <p>I'm puzzling over what the problem is, with using @font-face. I was wondering if someone can tell me if this is an issue in setting up the embedding, a problem with the creation of the font itself, a browser issue, or something else entirely.</p>
    <p>Here's the problem.</p>
    <p>Occasionally, when embedding a font using @font-face, the tails or extenders somehow get rendered clipped. Also, sometimes the baseline or topline (did I make that up word?) get rendered all wobbly and wonky.</p>
    <p>Now, due to licensing issues, font embedding legalities and such, I'm pretty limited to what typefaces I can use. I recognize it's possible it's just a poorly constructed font. Any help would be appreciated. See my image attached, for an example.</p>
    <p>The specific font I'm puzzling over now is Linux Libertine, but I've seen this issue elsewhere, as well.</p>
    <p>Thanks!</p>
