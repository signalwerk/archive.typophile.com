    html: |-
      <p>@ Richard</p>
      <p>A CSS line-height setting is not required. Fortunately, because I assume, that there is still a problem with Firefox! (Firefox spreads out the line height differently in case of units like em and pt, because they have to be converted to pixel. The values have to be rounded, but Firefox rounds up <strong>and</strong> down in the same text block with the result, that some lines are 1 px higher than others. I see this at once and I hate this behavior of Firefox. I am not sure, if it is meanwhile fixed.)</p>
      <p>I assume there is something wrong with the dimensions of the font. Some values are wrong chosen. (Not all programs make use of the same values! On Windows there is nothing clipped in the font preview.)</p>
