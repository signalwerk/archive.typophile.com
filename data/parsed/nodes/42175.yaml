      <p>There's also Keith Bates' <a href="http://www.k-type.com/fontrick.html" target="_blank" rel="nofollow">Rick Griffin</a>, named after the guy who did a lot of that 60's psychadelic poster lettering. Bates offers a package of three fonts - a background, a thinner overlay and the two combined as Rick Griffin Contour. The latter yields this:</p>
