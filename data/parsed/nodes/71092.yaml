    html: <p>The simplest way to do this would be to open your JPG in Photoshop, crop the extra white space around the grid from the image, then resize the image--de-selecting "Constrain Proportions"--to 1000px wide × 1168px high. Then, place the image in InDesign, resize it--proportionally this time--to fit your page, then use it as a template to create your guidelines. Delete the JPG, make this page a master, and you're all set.</p>
