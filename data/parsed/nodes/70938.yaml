    html: |-
      <p>If we knew what year that book was printed (clearly NOT 1904) it might eliminate typefaces designed after the publication. It's very hard to see the details well enough but I would guess some Goudy faces, such as Kennerley, or Goudy 38, both of which seemed to have flared T's, and similar G and R shapes.  Other ideas were Centaur and Bembo Titling.</p>
      <p>- Mike Yanega</p>
