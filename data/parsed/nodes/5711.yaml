    html: "<p>A mechanical oblique is deficient in two ways: <br>1) Its stroke contrast distribution is warped: the relationship between the horizontal and vertical parts of the letters is unnatural (or at least unconventional). <br>2) Its structures are not sufficiently cursive, for example in the \"a\" and \"g\". Some people think this is critical, others think it's not but it's still nice to have structural differences between the roman and italic, to help their differentiation when the latter is used for emphasis in a body of the former. <br> <br>The more you shear, the more #1 (and maybe #2) becomes an issue. I've made a font with a ~3.58 degree shear, and it required minimal correction. Your 6 degrees is probably borderline. <br> <br>But the less you shear, the more #2 become important (for differentiation). <br> <br>I guess saving money by making your own fake italics can make sense, but know that it's a compromise, not just in terms of craft quality but also function: a Helvetica slanted by only 6 degrees will not function well in a body of the original upright font (unless you also use a different weight, or less likely a [slightly] different size). <br> <br>Here's another idea: don't use italics. Let saving money be the trigger, but make ideology your justification, and use gentle weight gradations for emphasis instead - it's purer. Check out Typo magazine to see how that's done: <br><a href=\"http://www.magtypo.cz/\" target=\"_blank\">http://www.magtypo.cz/</a> <br> <br>BTW, please say hi to Barcelona for me. <br> <br>hhp <br></p>"
    html_clean: "<p>A mechanical oblique is deficient in two ways: <br>1) Its stroke contrast distribution is warped: the relationship between the horizontal and vertical parts of the letters is unnatural (or at least unconventional). <br>2) Its structures are not sufficiently cursive, for example in the \"a\" and \"g\". Some people think this is critical, others think it's not but it's still nice to have structural differences between the roman and italic, to help their differentiation when the latter is used for emphasis in a body of the former. <br> <br>The more you shear, the more #1 (and maybe #2) becomes an issue. I've made a font with a ~3.58 degree shear, and it required minimal correction. Your 6 degrees is probably borderline. <br> <br>But the less you shear, the more #2 become important (for differentiation). <br> <br>I guess saving money by making your own fake italics can make sense, but know that it's a compromise, not just in terms of craft quality but also function: a Helvetica slanted by only 6 degrees will not function well in a body of the original upright font (unless you also use a different weight, or less likely a [slightly] different size). <br> <br>Here's another idea: don't use italics. Let saving money be the trigger, but make ideology your justification, and use gentle weight gradations for emphasis instead - it's purer. Check out Typo magazine to see how that's done: <br><a href=\"http://www.magtypo.cz/\" target=\"_blank\" class=\"link-external\">http://www.magtypo.cz/</a> <br> <br>BTW, please say hi to Barcelona for me. <br> <br>hhp <br></p>"
