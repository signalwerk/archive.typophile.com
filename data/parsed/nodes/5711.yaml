    html: <p>Generally I agree with Hrant that mechanical obliques are deficient. However, in the case of Helvetica it should be noted that the usual Type 1 Helvetica package actually uses the slant function of Type 1 to make the italics, so you are actually paying for the same upright font twice, once with the slant set to the italic angle and once with it not.</p>
