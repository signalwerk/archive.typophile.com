  html: <p>Is it possible to create your own oblique font using the 'shear' tool in illustrator? I am buying some helveticas for my PC from fonts.com and wonder if I need to buy the normal set as well as the oblique set in order to have an italic version to compliment the regular set.  <br> <br>If I buy the upright helvetica then apply a 6 degree shear using the transform tool in illustrator, will I end up with exactly the same font as helvetica oblique?  <br> <br>When they create an oblique version of a font is there some kind of compression or extension added as well as an angular tilt? <br> <br>Let me know if being cheap will comeback to haunt me later on..</p>
