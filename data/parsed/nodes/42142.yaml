      <p>Eluard -- I'm afraid it's too early to say with any precision. I certainly don't have enough experience with this to predict an endpoint. Since the project is aimed at expanding features and weights, there's a fair bit to be done. We're definitely talking in terms of months, not weeks. But my personal hope is that DJR can have this all finished up by TypeCon this summer.</p>
      <p>-- K.</p>
