    html: |-
      <p>adnix --</p>
      <p>The Whitman Display fonts that I completed last summer are actually available for license now. They just haven't been "officially" released -- i.e., integrated into the Retail site for purchase and download. You have to contact Font Bureau directly.</p>
      <p>The Display fonts were set to be launched back in October last year. But then <cite>Fortune</cite> magazine commissioned Display Italics for the normal width (among other styles). So, now FB has decided they want to wait until I add Display Condensed &amp; Compressed Italics in all seven weights before launching. </p>
      <p>I'm hoping to turn my attention to those after I finish working with David Jonathan Ross to establish the framework for his expansion of the Whitman Text family to full-featured OpenType fonts.</p>
      <p>In the meantime, I've put a PDF sample of the Whitman Display fonts on my site: <a href="http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf" title="http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf">http://www.kentlew.com/Type/WhitmanDisplay_Sample.pdf</a><br>
      [<em>In case anyone is reading this months or years later: This sample probably won't be up after the fonts are released.</em>]</p>
      <p>But if you're interested in licensing the Whitman Display fonts now (or the text Bold Italic or Semibolds for that matter), you can contact the folks at Font Bureau by e-mail or phone.</p>
      <p>-- Kent.</p>
