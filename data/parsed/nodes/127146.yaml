      <p>Designers in the 60s actually revived a number of much older typefaces, and this is an example.</p>
      <p>The original source was a 19th century woodtype face; for something similar in a digital typeface (and likely based on the same source), try WTC Banger:<br><a href="https://www.myfonts.com/fonts/borutta/wood-type-collection/banger/">https://www.myfonts.com/fonts/borutta/wood-type-collection/banger/</a></p>
