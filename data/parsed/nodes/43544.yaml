    <p>I was thinking, after noticing the 500th post titled "WHAT IS THIS?!" with a link to imageshack, that there must be a better way to do type ids.</p>
    <p>Of all the forums, I think the Type ID board gets the most workout during the day. I've seen an influx of fresh faces all asking the same question... "This is awesome, what is it? By the way I need to know immediately."</p>
    <p>I'm not trying to dispel the bad habits of people that didn't know other wise. I just think the forum could use a little more organization. Could save a few members some headaches.</p>
    <p>Perhaps the "open" approach towards the Type ID forum should be corralled. A form with instructions could be a more benefiting approach.</p>
    <p>1. Title - please be specific, refrain from using "What is this font" or any variations. (think of poor Yves)<br>
    2. Image upload link - please don't post links to outside websites or image hosting, that may be blocked on some member's computers.<br>
    3. comments/information - What do you know about this font, where did you find it, is there specific thing you'd really like to know.<br>
    4. tags</p>
    <p>This is just a suggestion of course. I think it would help clear up some confusion, help speed up type IDs and help people search for IDs already made. </p>
    <p>I know that Typophile is a labor of love for some of the Punchcut crew and other Typophile members. I don't expect these changes to be made. Though it would be cool to see my suggestions implemented.</p>
