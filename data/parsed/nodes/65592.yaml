    html: <p>Thanks for your input. After I posted, I looked at it some more and have made some more changes (isn't this always the way). I have to disagree about the techy lettering comment though. I think racing bikes are marvels of technology and engineering, and I feel the branding should reflect this commitment to always make things more high-tech, lighter, more aerodynamic and above all else–faster. Look at the wordmarks of LOOK, Giant, TIME, TREK, BMC and Cervelo - they are all definitely on the techy side of things, while brands like Colnago, MOOTS, Orbea and Wilier are more classical and timeless. I think this look really reflects who these companies are and what they produce. A company like Ridley though, I feel belongs in the techy camp. They're constantly pushing the boundaries of engineering, introducing new technologies and processes and strives to be the best possible bikes available. I do appreciate your comments regarding the first and last letters... I have taken them into consideration.</p>
