      <p>Re: J Weltin - I think you're missing the point a bit here. The goal here (set by me) was only to refine their existing wordmark, not a complete overhaul or a new design completely. In doing so, I must retain the 'feel' of the existing wordmark. Whatever that may be to you is completely subjective.</p>
      <p>Re: penn.and.ink - Thanks for your compliments and recommendations. I've made a second version (attached) taking into account some feedback I've received here as well as from some fellow designers and cyclists on twitter.</p>
      <p>Some notable changes to this version:</p>
      <p>• Reduced the shear angle by about 10 degrees<br>
      • Made each of the letterforms a bit thinner<br>
      • Reduced the amount of horizontal scale<br>
      • Revised the initial stroke of the R and the last stroke of the Y to be parallel figures<br>
      • Broke apart the L and E<br>
      • Made more of a visual break between the E and the Y<br>
      • Rounded the other top corner of the L</p>
      <p>Overall, I think this one sits better. Thoughts?</p><div class="imageWrap"><img src="http://typophile.com/files/ridley2_4535.jpg"></div><p></p>
