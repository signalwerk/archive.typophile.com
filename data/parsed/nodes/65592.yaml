      <p>Thanks for all the feedback. This is proving to be much more difficult than I had originally planned. The more I look at the original E in the Ridley wordmark, the less I hate it. I think it's still rather odd-looking, but as I strive to come up with a better solution, I'm beginning to think that their E isn't as terrible as I had thought.</p>
      <p>In regards to the inconsistent rounding of the corners, I think that they work in this instance if you look at the space between the letters rather than the letters themselves. Maybe. If I were designing a typeface, I would probably keep things consistent, but I'm designing a 5-letter wordmark, and as such, I'm designing these 5 glyphs to work best in their current setting.</p>
      <p>I do think that the middle horizontal stroke in the R and the E could be beefed up. Good eye, thanks!</p>
      <p>In regards to the rigidity... yeah, I hear you. Any suggestions on how to make it a little more lively??</p>
