    <p>Ridley is a high-end Belgian bicycle manufacturer with a very amateur-ish wordmark. You can see it on one of their bikes here: <a href="http://www.maraton.si/images/ridley9/Orionframesetbllue.jpg" title="http://www.maraton.si/images/ridley9/Orionframesetbllue.jpg">http://www.maraton.si/images/ridley9/Orionframesetbllue.jpg</a></p>
    <p>This is NOT AN OFFICIAL PROJECT! I took this upon myself to see if I could refine the wordmark to better reflect the quality and prestige of their bicycle frames.</p>
    <p>The first 4 letters (RIDL) I think just need some minor refinements to make them more consistent and typographically sound, but the last two letters (EY) really make me squirm. I know they could be regarded as "whimsical" or somehow "endearing", but to me they seem highly out of place and almost comically poor in their design.</p>
    <p>Please feel free to critique my refined version, as it is still a work in progress. I appreciate the professional opinions of my fellow designers. Have a great day (and a Merry Christmas too!) everyone!</p>
    <p>Brian</p>
