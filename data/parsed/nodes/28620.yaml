      <p>I think the o in son needs to move to the right slightly, in the context of the other two letters I think the curve of the n at the top right comes too far down, I also think you can use a less vertical swash, angled from top left to bottom right, mirroring some of the s. The kerning in public relations is not helped by Illustrator, you could also try (if you don’t want to go down the pr route) upping the weight a touch.<br>
      Tim</p>
