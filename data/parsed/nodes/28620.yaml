    <p>Here is a logotype I have come up with for my wife’s public relations business. She caters towards fashion clients, but also works with other industries. She wanted to avoid the look a lot of fashion pr firms have (a lot of Bodoni/Didot, or Futura, or on the other end, distressed fonts for edgier clients). She likes clean lines, likes Art Deco, wanted something gender neutral—not too girly. No sharp lines, as she read in a Feng Shui book that those are bad.</p>
    <p>The name is “son public relations.” SON stands for “Something Out of Nothing” because our last name is Nix, which in Dutch (along with a few other languages, but my family is from Holland, so it’s Dutch in this case) means “nothing.” So her clients are literally getting something out of nothing.</p>
    <p>By the way, I already pointed out to her that Something Out Of Nothing should be SOON, not SON. But she liked SON. Since I want to remain happily married, I let it go.</p>
    <p>After a couple of tries, we settled on Estilo Script. Clean, Deco-inspired, curvy without being too feminine, and no sharp lines—rounded terminals even!</p><div class="imageWrap"><img src="files/son_3654.jpg"></div> This is a rough sketch with Illustrator optical kerning and me Frankensteining a swash from a capital N onto the lowercase n.<p></p>
    <p>Any comments? She expressly did not want a logo, just a logotype. Also, any suggestions for a companion serif face? I was thinking a modern, but didn’t want something with so much contrast.</p>
    <p>UPDATE 10-18-2006<br>
    </p><div class="imageWrap"><img src="files/son2_6032.jpg"></div><br>
    Here are some further concepts taking into account some of your concepts. I have layed them out on a 3.5x2 business card format to get a better perspective. I’m still not feeling the swash, and as much as I feel like I’m copping out of designing the logo, I like the way it looks “straight out of the box” on the bottom 2 samples.<p></p>
