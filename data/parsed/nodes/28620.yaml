      <p>Nice unique font I think it could work well, </p>
      <p>For what it’s worth, I think the text set all in a line like that is too much, with the diff. weights + frankenswash… it reads as a bit of a jumble.</p>
      <p>I think ‘son’ could cope really well on its own set in an olympic size swimming pool amount of white space (a small lonely word set like that might work with the somethiing from nothing theme) with a much smaller ‘public relations’ on the next line taking up a similar amount of horiz. space. </p>
      <p>Don’t love the swash but I like the idea of introducing a bit of personality to the letterforms, perhaps a bit of irregularity/humanity could be nice.</p>
      <p>i know nothing about nothing,  but could public relations possibly be shortened to ‘pr’ and sprinkled somewhere around the dominant son? (sounds freudian).</p>
      <p>for what it’s worth,</p>
      <p>—N</p>
