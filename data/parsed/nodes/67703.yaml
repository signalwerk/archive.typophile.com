    <p>Pardon me if this has been asked about, search is useless. This is FL 4.6...</p>
    <p>I've got a completed font that I'd like to generate. Both names and unicode numbers are right. But, when I view the font in index mode, the glyphs are all in the wrong position, and this shows when viewing the font in the glyphs window in Adobe Illustrator. </p>
    <p>How do I get the index corrected?</p>
