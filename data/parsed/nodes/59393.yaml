      <p>The "g" might be mistaken for a "q" at first glance, the "f" without a crossbar is interesting but may prove too distracting (notice the big gap that's apparent). The general feel is good although it seems like too many of the letters "rest" on a flat "bottom" which adds a noticeable mechanical/rule-bound force that detracts from the general dynamics of the whole. Or basically work a bit more  on the bottoms of your letter-shapes in keeping with the general feeling of the design - right now a few of the shapes are too "flat" down there.</p>
      <p>Hope this helps.</p>
