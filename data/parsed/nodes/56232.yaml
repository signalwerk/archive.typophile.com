    html: |-
      <p>Goran,<br>
      perhaps it's worth having a second look. Flash does not use the original spacing, not for Ludwig, nor any other typeface on that site. </p>
      <p>So, what qualifies it as an early 1st of April joke? The fact that this design that is less generic? or its obvious 'historical' perfume? If I look at all designs Fred ever did [part of them in <a class="freelinking external" href="http://www.hyphenpress.co.uk/books/978-0-907259-24-4" rel="nofollow">Type Now</a>, there is a great variety in styles and challenges. Like it or not, he never did much of the same over and over again, on the contrary - he defied the fear for uncharted waters. So, in this line of thought, I wouldn't dismiss Ludwig just for the simple fact that I [or you] did not expect something in that direction [= a design that is out of someone's comfort zone]...</p>
      <p><a class="freelinking external" href="http://www.hyphenpress.co.uk/music/morton_feldman_jazz_tributes" rel="nofollow">Hyphen Press Music</a> adopted Ludwig [together with Arnhem] for their identity; I bet EMI or SONY records would never do that. A recent Elmgreen &amp; Dragset catalogue <a class="freelinking external" href="http://www.hatjecantz.de/controller.php?cmd=detail&amp;titzif=00002050" rel="nofollow">by Hatje Cantz</a> features Ludwig quite nicely, too. So maybe it's not for everyone, and everything... But then, besides Helvetica, what is?</p>
