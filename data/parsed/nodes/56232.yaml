    html: <p>It seems almost like the stems were spaced as if they were seriffed. Given the stated objective of the design, this might not be far off. In his Quadraat, for example, the vertical stems are spaced with a distance nearly equal to the counter widths. A similar approach seems to have been taken with Ludwig, even though it is a sans.</p>
