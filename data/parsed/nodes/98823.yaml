  html: |-
    <p>All,</p>
    <p>Client is using a bad typeface and I want to suggest a replacement. Do you know of a GOOD face that looks like a cross between Franklin/News Gothic and Helvetica Condensed, with an x-height that pushes the limit on "too high"? Available in a range of weights and with an italic or oblique? That works in small sizes for short blocks of text?</p>
    <p>Pairing it with Sentinel, which is gorgeous for the client's purposes.</p>
    <p>Thanks.</p>
