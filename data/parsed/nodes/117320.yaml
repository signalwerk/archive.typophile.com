      <p>I may be the only one, but when I read PDF versions of books on the iPad, I sometimes find the "print oriented" type quite challenging to read.  The typefaces may be Sabon or Baskerville, but the letters are very sharp and fine, almost attention-seeking-ly sharp... Perhaps they would look better when printed with ink on paper, so that the text spreads and evens out just a little? </p>
      <p>I do feel churlish for wanting less sharp, less detailed text on screen though... :)</p>
