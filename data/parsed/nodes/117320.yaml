  html: |-
    <p>I was reading the PDF copy of Kandinsky’s  ‘On Spiritual  in Art’. It is also available in ePub format. So after a while, I switched to the iBooks version (which I generally read in Iowan). </p>
    <p>I suddenly realized the typeface used in publishing the book is about a 1000 times more readable than ANY of the iBooks fonts. In face all the iBooks typefaces now look ugly to me. </p>
    <p>I am stunned. What is this beautiful typeface? Why is this typeface SO MUCH better for reading than any the ones provided in an app specifically meant for reading? Each word is so clear that it almost leaves an imprint on my brain. In this day and age of retina high resolution screens, why do we not have appropriate typefaces for reading on electronic devices? Or just anything that matches the beautiful printed one in readability?</p>
    <p>I am almost depressed because I can clearly tell I love the printed book typeface but am unable to say why exactly. I can understand the effect but am not yet able to discern the cause. Where/how can I learn about how to tell what makes a good typeface good? Any good books?</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/image_159.jpg" width="1536" height="2048" alt="">
