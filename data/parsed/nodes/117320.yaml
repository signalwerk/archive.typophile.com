    html: |-
      <p>There are a vast number of sans-serif fonts, but in my opinion most are not suitable for reading extended text. My criteria include: a fairly high x-height, not compressed width, generous space between letters, fairly light, letters that are not too unconventional -- this can be distracting from the objective of scanning for content --, and letters that are not ambiguous, e.g. _l_, _I_, and _1_. Others  ambiguous letters include  _O_ and _0_. Intertype Vogue does not get top marks for all of these criteria, but it's fairly good.<br>
      Typeface design for extended reading is a struggle between the designer's wish to make a distinctive typeface and the reader's wish for a comfortable reading experience that enables effective comprehension of the content without delay. In my opinion the best type designers are able to reconcile these objectives.<br>
      Don</p>
