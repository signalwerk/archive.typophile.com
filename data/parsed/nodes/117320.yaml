      <p>The font in your printed book looks like <strong>Vogue</strong> a typeface from 1930.<br>
      There is also <strong>Am Sans</strong> by Volker Busse [2005] a digitized version of Vogue.<br>
      You can read more on Vogue here:<br><a href="http://typophile.com/node/72745">http://typophile.com/node/72745</a><br><a href="http://typophile.com/node/730">http://typophile.com/node/730</a></p>
