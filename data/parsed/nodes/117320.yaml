      <p>In response to your comment about why you find that type easier to read, "The Elements of Typographic Style" by Robert Bringhurst might be a good place to start. Interestingly, you picked a sans serif style, which supposedly is not as easy on the eyes for extended reading. Your reaction might have more to do with the spacing between lines and the simplicity of the letterforms. Some of the fonts available for iBooks are not really designed for the screen. I think Georgia, which was designed by Matthew Carter for screen use, could be easier for reading, if not as stylish (whatever that means to each of us). In my experience, fonts with larger x-heights tend to be easier to read at a variety of sizes. One I use a lot is Pratt by Nick Shinn, but I think Fedra Serif, by Peter Bilak is also very easy to read. </p>
      <p>- Mike Yanega</p>
