      <p>Mike, thanks for the book and font suggestions. Amazon Primed the  Bringhurst book :-)</p>
      <p>I have ready several books on typography but I still don't have a clear language to assimilate/understand  type faces and typography in general. Using Matthew Butterick's ‘Practical Typography’ and ‘Non-Designers Type Book’, I have learned some rules. But those are just rules. I still lack an innate grounding when it comes type.</p>
      <p>You may be right about the fact that I liked the printed book type better because of factors like spacing and so on. So many things other than just letterform face structure come into play to make something readable.</p>
      <p>I have also noticed I gravitate towards geometric sans serifs. If I am restricted to using the default fonts available in MS Word, I always prefer to use Century Gothic.  To me it looks like the font allows the content to 'breathe' . Most other default Word fonts look all scrunched up, like they are poor little calves squeezed and crushed together in a cattle car. Of course Verdanaand Georgia are always nice, but dull to me.</p>
