      <p>Cheers Eben. Cheers Chris, you have a succinct way of describing these things. Turning a negative into a positive is very much part of what I set out to do with Pyke's Peak.</p>
      <p>@Chris: <em>No, figuratively, as in turning a handicap into an advantage, celebrating what appears to be a negative by making it into a positive.</em></p>
      <p>"Figurative" is the key word. Type is sculpture. It's all about carving up whitespace with figures and the task of on-going <em>figuration</em>. "It helps that" turning some letters around permits combinations heretofor-inconcievable.</p>
      <p>The mirror ligs concept is a <em>trouble maker</em>—a device that multiplies possibilities. A backwards R is still an R and still functions as an R, with new semantic range. </p>
      <p>j a m e s</p>
