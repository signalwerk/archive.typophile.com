      <p>You know what I wish now? Wish I'd made the capital I with serifs. Wish I had 3 heads too.</p>
      <p>You've got some choices going there Chris, which I would have qualms about using. The EL - ED combination in TRAVELLED could have had more grace, and the opposing F's in DIFFERENCE redefine "awkward". That's typical, I give you the keys to a Pyke's Peak racer with a 1000 Horsepower motor in it and you go tearing up the mountain and leave behind a big mess (;^) There's an art to driving this machine, and a zen to it as well.</p>
      <p>Thanks Linda and Russell and Ray for beta testing old Pykie. Its "casual wierdness" works in a good way for <em>How to Make a Peacock Fly</em> – a strange kind of erm, object in a box!. There are two kinds of comments I would dearly appreciate hearing about:</p>
      <p>1) How useful is the zero cost license, does that and the PP Zero font help address the looming spectre of web fugly?</p>
      <p>2) What would you use Pyke's Peak for (both the full retail version and PP Zero)?</p>
      <p>And the third thing*, how many web designers are you going to pass a copy of PP Zero on to? I will send a prize, a pair of uber-cool mirror aviator sunglasses like the unit being modeled here by Plush Jimi, to the person who gets PP Zero into the hands of three big-time kick-arse web designers.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/plushjimi_6208.jpg"></div><p></p>
      <p>* I know I said two things, I lied</p>
      <p>j a m e s</p>
