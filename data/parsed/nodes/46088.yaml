    html: |-
      <p>James has done something special here with this type design. Instead of filling a well-known and well populated type market sector with yet another version of a known quantity, he has opened a road to a place yet reached. That is why I chose Frost's verse as a sample to show his work. Someone has to take those first bold steps into the unknown and mark a path yet traveled. Here is a place where it can be celebrated to be dyslexic, not as a handicap but as a venue to read again in a new way. James has married the softness and warmth of   written hand with  crisp, defined anatomy of constructed type and in a playful way. Users can be children at heart with a naive smile and a tickle from a feather. It is fun again to put away the seriousness we all deal with daily and have a good therapeutic play session!<br>
      I am not saying Pyke's Peak is a finishing stroke and a completed journey. It is one small step taken in a new direction without fear and without a guided tour. Thanks, James! for giving us a peek at your yet to be defined path!</p>
      <p>ChrisL</p>
