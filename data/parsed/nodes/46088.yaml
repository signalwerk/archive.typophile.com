    <p>Finally, <a href="http://www.myfonts.com/fonts/sentinel/pykes-peak/" target="_new" rel="nofollow">Pyke's Peak is out.</a> It only costs $30 for a premium decorative display font loaded with OpenType features and a supporting cast of 590 extras. Or you can have the "cut-down" version—Pyke's Peak Zero—for zero cash outlay. On the Myfonts font family page, click on "purchase options", then download Pyke's Peak Zero for $0.</p>
    <p>For an idea of what full kit and kanoodle can do, grab all the <a href="http://www.myfonts.com/fonts/sentinel/pykes-peak/gallery.html" target="_new" rel="nofollow">samples of old Pykie</a> and salivate at the extras sheet.</p>
    <p><strong>Q.</strong> What's the deal with "zero cost"?<br>
    <strong>A.</strong> With the recent controversy over web font embedding using the CSS @font-face property, the associated problem of unauthorized distribution of fonts only licensed for private use, and the "looming spectre" of the great web "fugly", I decided to do as much as I could to help the situation with a single font release. </p>
    <p>PP Zero is licensed for:<br>
    * personal (non-profit) <em>and</em> commercial use<br>
    * yes you read that right<br>
    * unlimited copying &amp; distribution on font archive sites<br>
    * "embedding" on webpages using CSS @font-face property<br>
    * unlimited distribution on web servers<br>
    * no logo fee</p>
    <p>PP Zero plays with a full deck.<br>
    * ultra-complete Latin 1 &amp; Latin 2 character set<br>
    * full outline quality of PP regular (outlines are not degraded in any way)<br>
    * OpenType with standard ligatures (LIGA) and fractions (FRAC)</p>
    <p>What you don't get with PP Zero<a href="http://www.flickr.com/photos/arboghast/2511483112/in/set-72157605345678800/" rel="nofollow">&gt;———the extra 590 ligatures (DLIG), contextual alternates (CALT), lining numerals (LNUM) and stylistic alternate (SALT) bells and whistles of PP Regular———</a></p>
    <p>j a m e s</p>
