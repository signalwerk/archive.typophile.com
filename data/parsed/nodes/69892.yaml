  html: |-
    <p>Were you/are you stranded abroad on account of the Icelandic volcanic eruptions?</p>
    <p>I'm involved with a collaborative not for profit magazine project to be created by people who were stuck in a foreign land with too much time on their hands.</p>
    <p>There will be photography and illustration but I post here in case anyone might be interested in submitting typographic material or accepting typographic assignments to help with features?</p>
    <p>If you're interested, please send me a message letting me know where you were stuck, where you were trying to get to and what you're free to do. A link to some of your work would also be appreciated. We'll consider pretty much any styles.</p>
    <p>Many thanks for taking the time to read this. </p>
    <p>Matt</p>
