    html: |-
      <p>If I list only the *Sangam* fonts I have on OS X 10.7, I get</p>
      <pre>Bangla Sangam MN.ttf
      Devanagari Sangam MN.ttc
      Gujarati Sangam MN.ttf
      Kannada Sangam MN.ttf
      Malayalam Sangam MN.ttf
      Oriya Sangam MN.ttf
      Sinhala Sangam MN.ttf
      Tamil Sangam MN.ttf
      Telugu Sangam MN.ttf

      Khmer Sangam MN.ttf
      Lao Sangam MN.ttf
      Myanmar Sangam MN.ttf
      </pre><p>The last three correspond to Southeast Asian Scripts, the first group to South Asian Scripts, as you can see on the <a href="http://www.unicode.org/charts/" rel="nofollow">Unicode Character Code Charts</a>.</p>
      <p>Bangla corresponds to Bengali. Inai Mathi is Tamil if I rely on the unicode range it covers.</p>
