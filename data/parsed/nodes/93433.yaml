  html: |-
    <p>I just got an iMac and wondered, why all the Indian-name typefaces? I assume they include Indian character glyphs, but why so many? Why are they seemingly the same? For example, the following look (nearly) identical (and these probably aren't even comprehensive because I stopped at "M"):</p>
    <p>Set 1: </p>
    <p>Malayalam<br>
    Bangla<br>
    Lao<br>
    Gurmukhi<br>
    Kannada<br>
    Myanmar</p>
    <p>Set 2:</p>
    <p>Bangala Sangram<br>
    Devanagari MT<br>
    Gjuarati Sangram<br>
    Inai Mathi<br>
    Lao Sangram<br>
    Myanmar Sangram<br>
    Malayalam Sangram</p>
    <p>Just curious.</p>
