  html: |-
    <p>Dynatype, just released on MyFonts is on sale for a limited time at a 20% discount. Concurrent with this Introductory Sale, Alphabet Soup is also pleased to offer Dynatype's first 75 purchasers a special limited edition print: </p><div class="imageWrap"><img src="http://typophile.com/files/Tomorrow_4972.png"></div><p></p>
    <p>This 8½" x 11" signed and numbered edition will be letterpress printed by Terrence Chouinard of Ithacatype in Athens, Alabama. Mr. Chouinard keeps a low profile, but you can read his CV <a class="freelinking external" href="http://www.widgetsandstone.com/_webapp_4000246/A_Letterpress_Intensive" rel="nofollow">HERE</a>. (Scroll down to bottom of page.)</p>
    <p>For 20% off list price you'll receive Alphabet Soup’s latest font release, plus a numbered, limited edition, finely-crafted letterpress print—printed on exquisite <a class="freelinking external" href="http://www.danielsmith.com/ImagePopUp.aspx?i=466%20030%20003" rel="nofollow">Hahnemuhle Copperplate</a> stock—and signed by Michael Doret.</p>
    <p>If you are among the first 75 to take advantage of this offer, you will receive an email asking for a mailing address to send your print to. Rest assured—your info will NOT be shared with anyone.</p>
    <p>Email <a class="freelinking external" href="mailto:AlphabetSoup@MichaelDoret.com" rel="nofollow">Alphabet Soup</a> with any inquiries.<br>
    Dynatype on <a class="freelinking external" href="http://www.myfonts.com/fonts/alphabetsoup/dynatype/" rel="nofollow">MyFonts</a>.</p>
