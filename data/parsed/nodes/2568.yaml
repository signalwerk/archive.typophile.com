    html: <p>Yes,  <br> <br>I have been a little soft on defining the question. Recently I have concluded, almost, a series of improvements to Lanston. We are about to release all our old fonts with the EU currency sign. I know we are late but we have had our <i>nasty acts of god</i> that slowed us down for several years.  <br> <br>The next begging phase is to complete our new type faces. Which we have several waiting. Then the task of developing a project plan for digitizing new releases. However with my energies going to that sector of the business, marketing is doomed to suffer. You can appreciate the problem.  <br> <br>Finland is unusual in that their government officials forcefully advise against hiring. The obvious solution is to find a healthier business environment, or sell Lanston. I might add, also, Finland is the most expensive place to live in Europe because of their social programs. <i>(Translate taxes.)</i> <br> <br>I am therefore looking into both options. This is why I could use input from the forum. It may be of interest to others also in evaluating their own assets. I am a qualified expert in assessment for brick and mortar type foundries. In fact I have worked in serious litigation in Boston doing that very thing. I was an <i>expert witness.</i> As you all know, I purchased Lanston, <a href="http://www.lanstontype.com/RoadToLanston.html" target="_blank">http://www.lanstontype.com/RoadToLanston.html</a> also I made a bid for ATF but they were unable to provide a secure lease. I raised 40 million dollars to put towards purchasing English Monotype.  <br> <br><i>Digitized intellectual property has no fixed value,</i> unlike ingots of lead, which do. But surely there is a business formulae that can determine such value. A simple rule of thumb, the <i>font company business is worth ( x ) years gross income?</i> would be a good starter. Brick and mortar companies, such as printing companies, the value is often calculated as say, <i>one years gross plus fixed assets, inventory, good will, lease and contract considerations.</i> However, intellectual properties should have a higher evaluation for cash flow derived from font sales. A printing company doing one hundred thousand dollars work per year requires skilled staff, serious rents, major capital expenditures, material cost etc. The owner will only make a small income for himself. A single owner operated font company could, with some work, achieve a gross income of half that and live very comfortably. Not rich but comfortable.  <br> <br>When selling a digital font company pretty much all of its value will be <i>taxable.</i> That would not be the case in a modern printing company. Or, in days gone by, brick and mortar type foundries. In other words, you will be getting perhaps only half of what the buyer is paying you. Computers depreciate to zero before they are paid for. So expect nothing or next to it for those considerations. In fact best to leave them on your desk.  <br> <br>Font delivery <i>(downloads)</i> to customers is almost zero and usually absorbed by the marketing cost. The work is in <i>creating the asset</i> itself, plus, a modern consideration, the <i>web site development asset.</i> Some other considerations have already been mentioned, or asked. It should be easier to determine a font companies value now the market is mature.  <br> <br>I think it may be a good exercise for some font developers to consider there may be a day they may need to evaluate their own works. Some day, hopefully, there will become <i>such a need</i> for at least one of you, or your heirs. If fonts have <i>no value</i> I recommend another creative occupation should be pursued.  <br> <br>So one may ask someone with a respectable font, <i>how much they would sell all rights to that type face?</i> Perhaps that is the right question to ask. Naturally some fonts outsell others. So maybe a calculated average of all the type faces in a foundries stable would provide reasonable conclusion. Also some fonts will remain dormant until they are the <i>fad of the moment.</i> Plus, consideration for existing performing contracts. And Web Site evaluation. One thing Lanston has that many others do not, is <i>brand name.</i> That supports good will, I know some will scoff but I care to differ on that particular matter. Good will, is worth something because it eases the pain of the purchaser to making their decision. Some of those customers may be large corporations. <br> <br>I am also, as an alternative, looking into moving Lanston to St. Petersburg, Russia. Other options are possible I suppose. A joint venture or, partnership.  <br> <br>Our income <i>is not huge</i> but steadily growing. Our digitized work is substantial and the <i>name brand font recognition value is substantial.</i>   <br> <br>Perhaps for a start the question would be <i>"business" is worth (X) years "gross income".</i> <br> <br>The next step is, what is it worth to manufacturer a font to commercial standards? This answer will be of great interest to many.  <br> <br>To solve the initial question of <i>business is worth (X) years gross income.</i> What value would a type developer in the Forum sell one good font with all rights not royalties? <br> <br>I realize some people will hope I do not get offers, or that I do not get much for the business. But if that is the case it will set some precedence for font business evaluation. So it would be best to wish me good luck! <br> <br>Maybe someone would like to buy Lanston?  Don't  be afraid to make an offer. At the moment I have a particular opportunity that I  am interested in pursuing so this would be a good time. Also depending on the arrangements, I may finance most of the purchase. Perhaps one of you, or a small group should put some heads together and make a proposal. One of my key issues, which means I  will consider less, is that I do not wish to getted  bogged down with months of accounting and legal issues. That I am looking for a simple, clean deal. Further I do not wish to work <i>on site</i>, but would consider continuing in some aspect through the transitional phase.</p>
