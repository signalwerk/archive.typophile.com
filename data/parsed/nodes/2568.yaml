    html: "<p>In the early days of digital typeface making, I sort of resented people who had never even seen (an assumption on my part) the operation of a casting machine or the cutting of a punch or matrix, using the designation \"foundry\" in their company name. <br> <br>When you get right down to it, as Gerald Giampa has noted, type of today uses many of the terms that have survived from metal type through phototype, up to current technologies. One that irritates the hell out of me is the misuse of the word \"kern\".   <br> <br>It seems to me that perhaps there is only a harmless affectation in the use of the name \"foundry\". <br> <br>In naming my own small digital typeface company, I have used the name Rimmer Type Foundry. Since at the moment I am nursing an annoying metal burn on two knuckles of my left hand, incurred while changing the choker valve on my Thompson Caster, I defend my use of the word.  <br> <br>I've never done so much work in my life over the past five years as I have in designing and completing my own book of digital faces. In spite of all that effort, I still make more money from the casters, panotgraphs and printing presses. This is not a whiney complaint; merely an observation that surprised me when I added everything up. <br> <br>Only partly in jest: perhaps anyone using the designation should be obliged to spend a week in a working foundry  getting  dirty and scorched. <br> <br>In this regard: I am waiting to hear from a couple of people who have voiced interest in spending two free days with me in type cutting and casting. <br> <br>What IS a good replacement name for \"foundry\"? <br> <br>Jim</p>"
