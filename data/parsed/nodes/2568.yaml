    html: "<p>I agree with Simon that the question is a bit open-ended. There are so many aspects of a digital type company (or any company, for that matter) to evaluate, that you really need to define what your goals are. A few areas and questions that I would start to consider would be: <br> <br>1. aesthetic quality of product <br> <br>2. technical quality of product <br> <br>3. marketplace presence and penetration <br> <br>4. ability to market and promote products successfully <br> <br>5. consumer and customer satisfaction with the product <br> <br>6. quality of customer service <br> <br>7. quality of technical support <br> <br>8. do they 'get' the web? (is their site a brochure or an extension of the total customer experience) <br> <br>9. do they add value to the products they develop or resell?</p>"
    html_clean: "<p>I agree with Simon that the question is a bit open-ended. There are so many aspects of a digital type company (or any company, for that matter) to evaluate, that you really need to define what your goals are. A few areas and questions that I would start to consider would be: <br> <br>1. aesthetic quality of product <br> <br>2. technical quality of product <br> <br>3. marketplace presence and penetration <br> <br>4. ability to market and promote products successfully <br> <br>5. consumer and customer satisfaction with the product <br> <br>6. quality of customer service <br> <br>7. quality of technical support <br> <br>8. do they 'get' the web? (is their site a brochure or an extension of the total customer experience) <br> <br>9. do they add value to the products they develop or resell?</p>"
