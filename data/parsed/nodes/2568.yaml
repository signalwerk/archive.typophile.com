    html: <p>I do see a problem when "foundry" is used indiscrimately, not because I think people should experience the feel of molten metal on their forearms, but simply because <i>literal</i> foundries still exist, and that intrudes on them. But when you put "digital" as a qualifier (or you tack on something like "micro", like I've done, in allusion to microcomputers, the brewing of beer, and also smallness of scale) that's not as bad because you're expressing the honesty and romanticism of molten metal without pretending to have been burnt by it and stuff. <br> <br>hhp <br></p>
