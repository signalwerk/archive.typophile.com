    html: <p>Stuart Sandler  <br> <br><i>Lately the rule of thumb I've been aware of is that a companys buyable value is worth 3X its total gross income of its most recent fiscal year end. So, a foundry that grosses $100k per year could be purchased for $300k outright.</i>  <br>----------------------- <br> <br><i>And in the end, regardless if you are able to purchase the foundry, chances are you're better off simply creating a new one for free and save all that money to reinvest in your own business.</i>  <br>------------- <br>I think you may have to work several years to develop a $100k gross per year font company. For most of those years one might expect to be eating out of trash cans. I am speaking of consumer fonts, not custom. In other words I predict it would take more hours to come up with completely fresh products with market awareness for $300k worth of work which is what you anticipate to sell the company for. Most importantly, starving through it. Probably it would be best to buy with the other persons money which would take only three years making the fourth and following years free. <br> <br>You see what I am getting at. <br> <br>But this part certainly is a key. <br> <br><i>So, a foundry that grosses $100k per year could be purchased for $300k outright.</i>  <br> <br>This interests me very much. I am wondering how you came up with this figure? And certainly I must agree, it is impossible to evaluate a  lead type foundry the same way as a digital foundry. Admittedly there are some similarities.  <br> <br>Or maybe Lanston should not be compared evenly to other font companies. Such as there are many idle assets waiting. Some can make money without any work except by having to eat in a fancy restaurant, travel to an exotic location for free and sign a piece of paper. <br> <br>One example is that we have a contract that is worth $75,000 however the term of payment is only $700.00 per year of which about 5 are now exhausted. They paid $5000 up front. The nice aspect of this contract is that Lanston did the work in the twenties. Nothing digital. So all the money is strictly a license for "intellectual property, not data". All the same $700.US comes in mighty handy. Not so handy when I have departed. For someone else it will however. I can tell you the $5000.US came in very handy. I lived in Canada and our dollar was down, down, down. <br> <br>Intellectual property has proven to be a  long term payer. In the EU new regulations protect for 70 years after death. I may have mentioned this before, a taxi cab driver that listens to the radio when he or she is driving a customer has to pay a "song royalty?" <br> <br>Let us examine Times for example, most of the money was made long after the designer was dead. The company still does well with it. <br> <br>Some how there has to be, or should  be a factoring of this sort of consideration. In other words I believe this to be unlike an ordinary software company in that very few software companies <i>"make money for old rope".</i> <br> <br>Software has a very short shelf life, font design has a proven history of hundreds of years. So the shelf live of type design is long I suggest an extension of the amortization figure. I refer to the <br> <br> <i>3X its total gross</i> <br> <br>This is the question that  <i>3X its total gross</i> invites, would any type designer sell their font for three years gross royalties? We speak of consumer fonts. <br> <br>What do you figure the cost of making a new font would be? How much does  Adobe, or Agfa value their fonts in annual reports? Are they flat rate averaged. Production based figures. Or are they sales based, or blending of the two? <br> <br>Small note. I have always felt it to be a mistake for type designers and font companies to think of themselves as "software companies". I prefer the wisdom of Sol Hess at the Lanston Punchcutting Department. He insisted Lanston was in the <i>art business.</i> <br> <br>Certainly there are unmistakable parallels to the music industry. <br> <br></p>
