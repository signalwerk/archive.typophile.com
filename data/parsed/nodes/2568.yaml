    html: <p>James, <br> <br>Lanston was a <i>digital typefoundry".</i> We produced digital data to generate patterns. Patterns were used as masters for the Benton Pantograph. This process was used cutting Sumner Stone's type face. So you are going to have to forgive me for been somewhat accurate.  <br> <br><a href="http://www.lanstontype.com/StoneGrinders.html" target="_blank">http://www.lanstontype.com/StoneGrinders.html</a> <br>Here is the pattern outline. <br><a href="http://www.lanstontype.com/StonePattern.html" target="_blank">http://www.lanstontype.com/StonePattern.html</a> <br> <br>Lanston produced digital data with additional data allowing for hot metal fit using the 18 units hot metal Monotype keyboard system. This additional data provide WYSIWYG which was unlike the older system. For this you needed nothing other than a Macintosh. (In those days) But it was intended for an even deeper digital development in hot metal founding. You will see, as you read onwards. <br> <br>This is the old system which was setting blind. <br><a href="http://www.lanstontype.com/MonotypeKeyboardHands.html" target="_blank">http://www.lanstontype.com/MonotypeKeyboardHands.html</a> <i>right hand column</i> <br> <br>Lanston also wrote a digital keyboard program with a slave computer driven Monotype Caster. Marketing these developments was abandoned by the <i>go mod board of directors.</i> As you can see, we were going to provide digital typesetting hot metal solutions. English Monotype did the same thing. They also had a computer hot metal Monotype keyboard. <br> <br><a href="http://www.lanstontype.com/MonotypeComputer1.html" target="_blank">http://www.lanstontype.com/MonotypeComputer1.html</a> <br><a href="http://www.lanstontype.com/ComputerController.html" target="_blank">http://www.lanstontype.com/ComputerController.html</a> <br> <br>The advantage of our system over theirs, is ours eliminated Monotype controller paper entirely. That alone saved $3000.00US per year, per keyboard. <br> <br>Theirs did not. <br> <br>This page has a list of some modern Lanston developments. <br> <br><a href="http://www.lanstontype.com/OrphanAnnie.html" target="_blank">http://www.lanstontype.com/OrphanAnnie.html</a> <br> <br>Previously we developed a hand setting program on a TRS 80. <br><a href="http://www.lanstontype.com/TRS80.html" target="_blank">http://www.lanstontype.com/TRS80.html</a> <br> <br>In any event, old habits die hard. I have seen many, strictly digital developers, borrow the same phrase. That is  where one could start drawing lines. <br> <br>As you well know, other hot metal terminology has survived past honesty. Some rather misleading. Points and picas for instance, are now�inches. <br> <br>May I ask what you call typographical inches? <br> <br> <br> <br></p>
