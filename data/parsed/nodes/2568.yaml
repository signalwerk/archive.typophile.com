    html: <p>Hi Gerald, <br> <br>Your question to me seems more obvious that you may suspect. <br> <br>Lately the rule of thumb I've been aware of is that a companys buyable value is worth 3X its total gross income of its most recent fiscal year end. So, a foundry that grosses $100k per year could be purchased for $300k outright. <br> <br>Costs related to "prior" software development efforts are essentially mute in regards to the eventual purchase price of the foundry. It's time and money invested during the course of the business and essentially a final sale. . . <br> <br>Beyond that, while digital foundries have very few material assets that can be estimated as an approximate value compared to a metal foundry, it is very important to distinguish they cannot be considered in this manner. <br> <br>A digital foundry should be considered a software company, much like Adobe, Quark, Pryus, you name it. We make software, not metal slugs . . .  Our only assets for sale are the hours taken to develop the software as well as the source code of the software. <br> <br>What is that worth? As little as the seller is willing to take for it. . . <br> <br>And in the end, regardless if you are able to purchase the foundry, chances are you're better off simply creating a new one for free and save all that money to reinvest in your own business. <br> <br>Stuart :D</p>
    html_clean: <p>Hi Gerald, <br> <br>Your question to me seems more obvious that you may suspect. <br> <br>Lately the rule of thumb I've been aware of is that a companys buyable value is worth 3X its total gross income of its most recent fiscal year end. So, a foundry that grosses $100k per year could be purchased for $300k outright. <br> <br>Costs related to "prior" software development efforts are essentially mute in regards to the eventual purchase price of the foundry. It's time and money invested during the course of the business and essentially a final sale. . . <br> <br>Beyond that, while digital foundries have very few material assets that can be estimated as an approximate value compared to a metal foundry, it is very important to distinguish they cannot be considered in this manner. <br> <br>A digital foundry should be considered a software company, much like Adobe, Quark, Pryus, you name it. We make software, not metal slugs . . .  Our only assets for sale are the hours taken to develop the software as well as the source code of the software. <br> <br>What is that worth? As little as the seller is willing to take for it. . . <br> <br>And in the end, regardless if you are able to purchase the foundry, chances are you're better off simply creating a new one for free and save all that money to reinvest in your own business. <br> <br>Stuart :D</p>
