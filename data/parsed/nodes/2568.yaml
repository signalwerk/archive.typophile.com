    html: <p>I don't mind the term 'foundry' in reference to digital type makers. I do object to the occasional loose use of the term, when it is applied to companies that merely resell fonts. One of the nice things about the term foundry is that it emphasises a manufacturing process. In these days, when anyone with a piece of font editing software can play at making type, it is perhaps good to be reminded of the tradition of technical quality and innovation that the foundries of the past established. </p>
