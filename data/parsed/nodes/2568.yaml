    html: <p>Well, the only recent experience we had in Italy with a "foundry" dates back to Nebiolo, which "closed" in the 1970s. <br>When I talk with friends, in Italian, and I cannot use the term foundry, I refer to digital typeface producers as "Etichette" ("Labels"). <br>I know this is vague, especially in English, but after all we have Record Labels, Fashion Labels and Label sounds pretty personal. I like it, more than foundry, which is pretty anachronistic. I can't see a real problem using "foundry" as well, anyway. <br>Not for resellers, individuals selling on MyFonts. or mere distributors, of course. <br>For the MyFonts system "label" seems quite appropriate to me.</p>
