    html: <p>Tiffany, <br> <br>There are hundreds of typefaces that could convey a sense of well-made chocolate, but this client specifically asked for something "edgy", that brought together, mischeiviously, the concepts of good &amp; evil. <br> <br>I like bouncing ideas around.  This was a quick throw together, and really doesn't do your suggestion justice, but wouldn't you agree the general feel, on first glance, is not "edgy"? <br> <br><img src="http://www.typophile.com/forums/messages/29/64163.gif" alt="Comparison"> <br> <br>That was an important design criteria. <br> <br>While well crafted, I don't find any of Underware's type to be edgy, so I wouldn't consider it a good choice for this job.</p>
