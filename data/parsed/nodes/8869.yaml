    votes: null
    html: <p>Tiffany, <br> <br>Margo Chase's clients have budgets in the thousands (if not tens of thousands) of dollars.  My guess is, they can afford whatever they want. <br> <br>In this case, we weren't hired to create a marketing campaign, or educate our client about the impact of a logo design on sales.  They had a trade show.  We had a week to work, and a few hundred dollars to spend.  That precluded going through numerous incarnations. <br> <br>There are many directions you can go in when creating a design.  In this case, we showed our client three ideas.  The halo/devil tail turned out to be their favorite.  It was an easy solution, given the limited budget.  I was happy, they were happy.  I hate defering artistic spirit to job constraints, but the reality is, it happens more then it doesn't.  Will it win a Clio?  No.  Did it solve their problem?  Yes.  Such is the world of production artwork. <br> <br>I sincerely appreciate your feedback though.  Thanks.</p>
