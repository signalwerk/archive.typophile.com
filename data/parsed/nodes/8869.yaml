    html: <p>Bert, <br> <br>Gotta disagree with you there.  Those fonts you suggested look like they belong on the front of a kids little league shirt (haha) <br> <br>They don't convey any "edginess" and there is little potential for intertwining them, or adding the little devil tail.  These were specific requirements from the client, which we had to keep in mind when selecting a font. <br> <br>I don't see any problem with using common typefaces in logo design, as long as they are personalized to the job at hand.  Many well known logos use popular typefaces which are just modified.  Look at the letters in logos like Pepsi, Jurassic Park, The Crocodlie Hunter, Honda, or Playboy magazine, just to name a few.   <br> <br>From a psychological marketing viewpoint, I think there are advantages to using familiar letterforms, particularly in logo design, as the public sees something different, yet familiar.  Going for the obscure or radical isn't always best.</p>
