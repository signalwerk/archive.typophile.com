      <p><cite>It is known that Dutch people are not really proud of their country.</cite></p>
      <p>I'm surprised to know that. In South America your country has a very reputable image. Nederland is known as an organized, liberal and highly developed country, with an outstanding living quality and education. Your long tradition in graphic design is also widely referred – a Dutch landmark besides tulipes, bicycles, art and the dikes. Not to mention WIC and the magic '74 soccer team.</p>
      <p>For many Brazilians, the Dutch defeat in Pernambuco, in 1654, was a pitty. They claim that to be a Dutch colony would have resulted in a much better Brazil. Although this is just a historic speculation, there is no doubt Nassau's administration was a golden age in colonial Pernambuco, with many valuable heritge. BTW, the first type tools in South America were brought by the Dutchmen circa 1637.</p>
      <p>Well, after this off-topic comment, let me add there is a number of recent releases named with words from the designer mother tongue (Tisa, Alegria and Despeinada are samples). So, except if you adopt something dificult like verantwoordelijk, a Dutch name would work. Anyway, Sensato is also good. Due to its Latin origin, it's easily recognizable as something related to sense in many languages.</p>
