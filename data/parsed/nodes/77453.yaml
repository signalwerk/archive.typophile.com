      <p>Yes I agree the /g/ ear is better.<br>
      Nick's eye is excellent so take his generous advice to heart!</p>
      <p>To me, the glyph in need of most work now is definitely /B/. Look at some other /B/s and maybe consider a fresh start. And after that some other curved caps: /D/G/R/. And I guess /S/ falls rightward and /C/ may be too thick at its thickest, so maybe its "all curved caps"!</p>
      <p>As for the chamfering, it adds a bit of refinement at display sizes but doesn't help -- maybe in fact hurts -- at text sizes, I think.</p>
