    user: 8008
    date: 2010-12-24T13:04:00
    date_raw: 24 Dec 2010 — 1:04pm
    votes: null
    html: |-
      <p>Jasper, this has a great deal of potential but then I suppose Garamond is reliably good model.</p>
      <p>&gt;&gt;&gt;The slightly slanted version doesn't add that much, IMO.</p>
      <p>I am also not sure if the difference between the two fonts Sensa and Senso is different enough to warrant pursuing two fonts in the end, although it may be an interesting exercise in production. I would decide and concentrate on just one version and get it right - others may disagree.</p>
      <p>Here's some feedback on the glyphs themselves:</p>
      <p>A lot of talk about period and comma. I would construct a colon and a semicolon and stick all four punctuation marks alongside each other. The point on the top of the comma will help you get the right size for the period and more especially the comma. You probably cannot design the comma and period in isolation from the semicolon and colon. I like the size of the tittle on the i and j. I'm not sure if those who say it should be different distance from the top of the stem of i and j aren't a little deluded. </p>
      <p>The comma is normally cut at the top from 8 o'clock to 2 o'clock. This reflects the angle of the pen, though you might want to contradict the pen convention, although from the look of the /O/ for example, I would doubt it.</p>
      <p>General comment: I think the diagonal arms taper outwards a little too much on /A/, /K/, /R/, /V/, /W/, /X/, /Y/ and this also applies to many of the lower case counterparts.</p>
      <p>Upper case:</p>
      <p>/A/ looks shorter than the rest, maybe because it's next to /B/ which overshoots too much in my world.<br>
      /B/ a bit too bouncy, curved on top and bottom?<br>
      /D/ looks taller top and bottom than /C/<br>
      /E/, /F/ lovely, though some may want /F/ crossbar even lower still.<br>
      /G/ I would be thickening the right hand vertical a little and maybe even a touch taller, could it be misread at speed as a /C/?<br>
      /L/ needs to be narrower than bottom of /E/. It may already be narrower but still looks wide. You're trying to avoid a massive white gap in words like 'Liverpool' which kerning will not address.<br>
      /M/ is quite wide but you may not have a lot of choice if apex is coming right down to baseline.<br>
      /N/ may need a thicker diagonal, especially telling next to /O/.<br>
      /Q/ I would make the angle of the angle of cut across the tail more horizontal, certainly the horizontal side of 45 degrees.<br>
      /R/ leg looks a little light.<br>
      /S/ top looks heavier than bottom.<br>
      /T/ and /U/ marginally narrow? /T/ crossbar too heavy (also applies to crossbars of /Z/).<br>
      /X/ slightly light.<br>
      /Z/ too tall, I realise this applies to /T/ too.</p>
      <p>The tops of those caps look a little bit like a roller coaster. Part of achieving more evenness may be to flatten some of the /B/, /D/, /P/ and /R/ tops and bottoms.</p>
      <p>Lower case:</p>
      <p>/a/ bowl goes down too low compared with the tail.<br>
      /d/ looks wide next to /e/.<br>
      /g/ tail is pointy on right.<br>
      /i/ and /j/ need to share the same x-height?<br>
      /p/ would make a nice /d/ if you rotated it. The stem is a little too narrow (applies also to /b/ and /q/).<br>
      /s/ looks bottom-heavy (reverse of /S/).<br>
      /z/ crossbars too thick.</p>
      <p>Hope this helps, the length of feedback is proportional to the promise of the typeface. I would forget about Expletus and throw yourself into this! It's reading very nicely and that is a good starting place, you can keep refining glyph shapes later, it's much harder to get it to read well.</p>
      <p>Merry Christmas,<br>
      Nick.</p>
