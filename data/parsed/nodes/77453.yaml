      <p>Your four grades are looking nice.</p>
      <p>I would be wary of marketing them as different grades when the time comes. The top one (I'm guessing the grade for very small sizes) works equally well at large sizes. The last thing you want to do is limit sales by putting an unhelpful cue that the top one should only be used at small sizes, which for me is nonsense as it's the nicest one in my book.</p>
      <p>Not sure if you need four grades or whether three or even two are enough (as in simply text v display).</p>
      <p>Still don't understand your terminal (a,c,f,r,s) or stem (d,m,n,p,r) treatment!</p>
      <p>Are you aware of the National Trust font family? That has display variants. <a href="http://brandcentre.nationaltrust.org.uk/login/default.aspx?ReturnUrl=/Default.aspx" rel="nofollow">This website</a> has a registration especially for students/journalists. </p>
      <p>N</p>
