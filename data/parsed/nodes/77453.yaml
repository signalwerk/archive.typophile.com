    <p>Hello everybody,</p>
    <p>Sensato Serif can be viewed here: <a href="http://www.typophile.com/node/78292" title="http://www.typophile.com/node/78292">http://www.typophile.com/node/78292</a></p>
    <p>This is Sensato. Derived from 'Sensational'. It's purpose is to create a highly legible sans-serif with a diagonal stress and work just as well for display purposes. Although this is not included in the pdf yet, the jpg picture below shows the different grades I designed for optical adaption to different sizes. As soon as the Caps are also done in both grades (the two extremes) the pdf will be updated. All comments are much appreciated. </p>
    <p>Cheers,<br>
    Jasper de Waard</p>
    <p>update 2.0: 4 Different grades. Only lowercase for now.<br>
    update Sensato A: Lower contrast, more organic features, better stem treatment, smaller terminals, new sample text.</p>
    <p>Enjoy!</p>
