      <p>The tittles look fine to you, because I have already changed them. What you have been looking at was an update with changed tittles. The fact that it looks right to you probably shows that I scaled them down to the right size. =D At a second look they appear to flat, so I'll make them a little more round.</p>
      <p>I have already redesigned the comma and other punctuation which I will include in my next update (perhaps tomorow already). I made the angle on the top of the a a bit more flat than you suggested. Those are some helpful tips you got there!</p>
      <p>Uppercase:</p>
      <p>The diagonal arms taper out more than is usual, but IMO this is the only way of making them look like they belong with the other strokes in the typeface. I will try to prove myself wrong by changing a few diagonals, but I doubt it.</p>
      <p>I can't say anything sensible about your opinion on the individual glyphs, before having tried some changes. Unlike you might think, my minds capability to picture shapes is not so good, but I don't believe this has much influence on my designs.</p>
      <p>The top of the caps from Myriad Pro (In my opinion the best designed/best balanced typeface I know of) also look a bit like a roller coaster (I wouldn't call it that way, but I get the idea) and it doesn't bother me, Nor does it bother me in Sensa. However, I will try to see if it looks better with more flat tops and bottoms.</p>
      <p>Lowercase:</p>
      <p>Same thing as with the caps. I can't say anything sensible about most of the things you say. Just some remarks: the d is a turned around p (the reverse actually), so it probably shouldn't be. i and j share the same x height (optical illusion perhaps. I'm unable to see it though.)</p>
      <p>At display size, many stems look to thin indeed, but (perhaps it's technical problem) at text size they appear fine. They used to appear too thick at text size (also on high quality prints) so I changed them. <strong>Do they appear to thin also at text size to any of you guys?</strong> If not I have already failed one of my goals, which was to create a typeface equally useful for text and display use. I might have to make different optical weights now, which improves excellence, but is not so practical. <strong>Any opinions?</strong></p>
      <p>Thanks for a long, helpful and positive comment! This is of great help. Expletus will soon be released and I still have to do the Italics, so I can't intirely forget about it, but I won't make a pro version like I intended to do earlier.</p>
      <p>One thing I don't understand. "you can keep refining glyph shapes later, it's much harder to get it to read well." Shouldn't I refine glyphs in order to make it read better?</p>
      <p>A very happy Christmas to everyone and thanks again,</p>
      <p>Jasper</p>
