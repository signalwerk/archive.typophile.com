      <p>Jasper is a really young guy… Believe me (as a Dutchman three times his age) that the average Dutchman and –woman are quite proud of their country!</p>
      <p>The Brazilian link Freiberger mentions is one example of the extensive influence of the Low Countries during the period that was our ‘Golden Age’, a period when the Dutch ruled the world of commerce, applied science, seafaring and warfaring (Prince Maurits reintroduced classic concepts of drilling and coordinated movements on the battlefield). </p>
      <p>And on a somewhat more type-related stance: in the same period the Dutch were the publishers of the free-thinking world: a place where the most advanced thinkers of that time could evade the all-pervading censorship in countries like France, Great-Britain etcetera by having their works published in Leiden, Amsterdam, Antwerp, Utrecht. </p>
      <p>Required reading matter: Simon Schama's ‘The Embarrassment of Riches: An Interpretation of Dutch Culture in the Golden Age’ (1987) and Jonathan Israel’s ‘The Dutch Republic: Its Rise, Greatness and Fall, 1477-1806’ (1995).</p>
