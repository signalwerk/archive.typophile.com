      <p>&gt;&gt;&gt;Extrapolating doesn't always work the way it should</p>
      <p>You're absolutely right, it doesn't, but if you start with your regular and bold (the most used weights, I'm guessing), you'll have to extrapolate to get a rough light and heavy.</p>
      <p>Assuming you're making 5 weights, you are currently working on Wt2 (regular), and soon to be working on Wt4 (bold). You're going to have to extrapolate to get at least basis for Wt1 (light) and Wt5 (Heavy). I'm not pretending Wt1 and Wt5 are going to look right from extrapolating but how else are you going to establish Wt1 and Wt5? Once you have got Wt1 and Wt5 looking right, then you need to work out if your Wt2 and Wt4 (and of course Wt3 (medium, if you're having medium, that is) also look right (and are faithful to the original concept).</p>
      <p>I'm now working on my second viable font and this time I haven't started with a regular but a hairline and an extrablack. Some may call me naive but I quite like the way it's going.</p>
