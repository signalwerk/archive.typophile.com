      <p>I made some testprints from a copyshop today. The quality still wasn't what I'm really looking for, but better than my inkjet. These prints showed that the f and t looked thicker than the rest so I made them a tad thinner (1 unit) compared to last time. I've found a copyshop with a printer that's probaly good enough for my needs, but they haven't responded to my email yet. I think I'll start working on the numerals and leave the stems for what they are untill I have some real quality testprints.</p>
      <p>Cheers</p>
