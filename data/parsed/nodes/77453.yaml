      <p>Thanks Nick. The tittles look quite round to me and the tittle on i and j really are on the same height, I'm afraid. Seems like hinting doesn't fix everything. Although I want to avoid getting into the technical things to early, It's good to know how much Windows xp influences the way the type looks. Could you show me some more screenshots of what it looks like on your pc, also on smaller sizes? That would be really helpful.</p>
      <p>Some other weird things you noticed must be the effect of the poor rendering on Windows xp. The b and d are actually the same width, so it seems like the poor rendering still occurs at larger sizes (Are you working with Adobe Reader? If not, maybe you should try it). If your working on xp, you actually need Truetype hinted fonts, which I won't make during the design process. The t does lean to the right a little on the top, which is visible on my screen, but I think Windows Xp sticks to the hinting, which makes it appear straight. I like the t as it is, so I'll stick to it.</p>
      <p>Your definitely right about the C c G E F W R T y and the quotes.</p>
      <p>The q is different from the b for a reason. The same thing can be seen in Nick Shinn's 'Sense'. The q has to be flatter at the top because otherwise the u will look as if it's too high in words like quality. The q is very often followed by a u so that's quite an important pair. If you look at Plantin for example, you'll see they added a small piece to the q to make it work when followed by u. In some typefaces they use the q (with a 'flat' top) to make the b. I've tried this with Sensa, but it just doesn't look right that way.</p>
      <p>Although your comments are still very welcome and useful I don't see why you don't make a print of the pdf. I understand it would be a waste of paper and ink to do this with every new update, but it should help you see how your screen influences what you see. I have just finished a version with slightly thicker stems, so if you plan on making a print perhaps you should wait for the next update.</p>
      <p>I've had a look at your website and although I'm not so much of a logo expert at least the typography in all of them looks really nice. Especially Matterhorn Capital, which looks like a custom job, right. You obviously have an eye for typedesign but I can't find any fonts of you on the internet. Why not?</p>
      <p>A cheeky question, just out of curiousity. Do you think Sensa has the potential of being accepted by one of the better foundries? (e.g. FontFont, Font Bureau, Monotype, etc.)</p>
      <p>Thanks again for some great feedback Nick!</p>
