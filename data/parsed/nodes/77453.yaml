      <p>Jasper, Sorry but I wonder now if I preferred the slightly curved /B/,/D/, etc. I just think it was too curved in the earlier versions.</p>
      <p>However, still looking good in text even having made changes.</p>
      <p>I definitely preferred the flatter periods. The heavier you get the flatter they will need to be. I also much prefer the new comma. Questionmark /?/ looks a little Hebraic and doesn't fit with rest of typeface to my mind.</p>
      <p>/f/ and /t/ verticals look thin.</p>
      <p>/t/ angle at the top troubles me. I probably want it to be horizontal but I can't say why.</p>
      <p>/C/ and /c/ may need more advance width on right (set 'chin/chick' next to 'thin/thick') (/B/ may need less advance width.)</p>
      <p>/W/ looks a little thick at central apex, the two middle strokes may need to be a little less tapered.<br>
      /Y/ Vertical stem lookslight compared with left arm. It's a vertical so shouldn't it logically be optically as thick as /T/ stem.<br>
      /Z/I find it interesting that you have given /Z/ and ink-trap but have not given /W/ when the angle in the /W/ is even tighter. Same applies to /M/ vs /N/ (if /N/ ink-trapped, why not /M/?)<br>
