      <p>Wow Nick. You reall keep going on this one :-)</p>
      <p>On the B, D tec it's probably gonna be the golden midway. Same for the tittles (I guess you meant tittles when you said periods? the period remains unchanged.)<br>
      Many changes are made to give it a more even colour in text, so in fact it should look better in text. The question mark is not usual no, but like it's shape. It's comparable to Calluna's question mark. I think the Haebraic thing will get less if I make the top a little thinner.</p>
      <p>f and t verticals are thin, bit yet again, they look fine to me. What I really need is a good laser printer. To judge a typeface at text size, inkjet just won't work. I have already asked a printer whom I have good relationship with if he has a not-too-expensive solution. </p>
      <p>Your definitely right about the top of t, I'll change that.</p>
      <p>With 'advance width' I assume you mean spacing. All the spacing so far is inDesign's optical function. Works quite well doesn't it?</p>
      <p>Yes. I had the same thought about W, but somehow didn't get to it yet. Your right on spot with Y too.</p>
      <p>The lack of inktraps on some spots is just sloppyness. I'll include inktraps everywhere they're needed in next update.</p>
      <p>I'm not applying any hinting. I'll apply autohinting in next update. That might solve the problem. But the thing is: a screen is made out of pixels.</p>
      <p>I remove old versions becasue I have seen people commenting regarding old pdf files in other topics in the critique section. Furthermore: When I've made a change and it looks right to me, I might choose something between the original and new version in the end, but I don't want to get stuck in older versions. If something looks 'wrong', I should be able to see this without knowing hwo it used to look.</p>
      <p>Thanks again for some great feedback!</p>
      <p>Cheers, Jasper</p>
