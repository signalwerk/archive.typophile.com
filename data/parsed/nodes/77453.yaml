      <p>Thanks Nick. I'm working on a grade with even lower contrast. I plan to just call the Sensato A, Sensato B, Sensato C, etc. I totally agree that it would be wrong to call them grades or optical sizes, but for now grades will do.</p>
      <p>The difference between the four grades is indeed quite small. I'll have to review this after I've finished the new grade.</p>
      <p>In the first grade the terminals on a c f r s do look slightly to large to me now, be the high contrast one really needs big terminals. The small chamfered part in the terminals has to stay. When I compare it with/without that part the choice is quite obvious to me. Might be a personal thing, but it's just the way it is.</p>
      <p>Does the stem treatment in d m n p r look far off to you? I think I'll try to just keep it straight, comparable to Nota.</p>
