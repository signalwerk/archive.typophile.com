      <p>Jasper, I love the fact that you are prepared to stand by your guns on some of this stuff; good for you! Your gut instincts may serve you well.</p>
      <p>However I would consider that some of the curviness of Myriad (top and bottom of some caps) was merely to move it away from Frutiger and serves no useful purpose except to give it a softer appearance.</p>
      <p>I had a look at Nota and think you've got your work cut out. That is fine work indeed fine work as you commented in your previous thread 'Garamond Sans'. </p>
      <p>I think that some of the tricks that typographers use to give optical correction are massively overplayed (e.g. amount of overshoot on curved forms, the flaring of slanted arms, the tipping forward of the top of a /t/ etc.) But the point is that you shouldn't be noticing these effects, they are there to make stuff look right, otherwise the effect has failed. If you can pull off an optical correction without it being noticed, that is success.</p>
      <p>Now, I'm looking again at the /i/ and /j/ and the x-height is markedly different on the pdf. What's going on with that? Brilliant on the rotated /p/ and /d/! :) However the /p/ and the /d/ are definitely not the same on the pdf that I'm looking at. I would love to be able to do a capture of what I'm seeing but I'm not on my normal machine.</p>
      <p>&gt;&gt;&gt;One thing I don't understand. "you can keep refining glyph shapes later, it's much harder to get it to read well." Shouldn't I refine glyphs in order to make it read better?</p>
      <p>Yes and no. Now you've got it to read so well, it doesn't need major work, merely cosmetic refinements to make the individual glyphs look nicer...however, there is no use in getting beautiful individual glyphs which just don't work together or are poorly spaced but you're a million miles from that here and that is very commendable.</p>
      <p>I wouldn't busy yourself with optical weights yet, it will make your head hurt and you should be enjoying life, not living with a headache. Not unless you think this is the font which you're going to be remembered for. Think about a pro font having 1,000+ glyphs and how much work that is already going to involve.</p>
      <p>Wonder what Mr Shinn makes of your new name Sensa/Senso in view of his recent releases :)?</p>
