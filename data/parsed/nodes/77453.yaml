      <p>Hey, wait a minute. I've saved it and opened it in Acrobat and it's looking a lot better...I really hope I haven't wasted too much of your time! I'm guessing Chrome has its own pdf viewer built in because it now looks a lot better (imagine, I thought it looked great anyway, now it looks even better!) BTW Will someone please explain that whole Google Chrome pdf thing to me!?</p>
      <p>&gt;&gt;&gt;...I can't find any fonts of you on the internet. Why not?</p>
      <p>Because type design appears to take a lot longer than I thought it would. Not long now though, I hope.</p>
      <p>&gt;&gt;&gt;A cheeky question, just out of curiousity. Do you think Sensa has the potential of being accepted by one of the better foundries? (e.g. FontFont, Font Bureau, Monotype, etc.)</p>
      <p>Viability depends on a range of weights, plus italics. When you've got the regular sorted out, it'll be time to start on the bold. When you've got the bold sorted out, it'll be time to make a multiple master and extrapolate to light and heavy. Once you've engineered the light and heavy, you'll need to make another multiple master to revisit the regular and bold, to make sure you're still happy. (So the regular you are currently slaving over is unlikely to be the one you end up going with in the end! Frustrating, huh?) When you have got a multiple master with a weight axis that you're happy with, that's probably the time to start thinking about different optical sizes, if that's still on your radar. (I haven't even mentioned the italics yet!)</p>
      <p>Now some designers use more than one multiple master to establish all their weights, since at the heavy end, you may have to make serious adjustments for it still to work, depending on the design itself.</p>
      <p>I guess, above all, what a foundry is looking for more than anything is a robust concept because they want great-looking typefaces that are going to make some cash. So if you're asking whether a foundry would be interested, keep going!!</p>
