    html: <p>Hi, Jasper. Don't over-engineer this. I'm not a fan of the micro-curves (corner softening) that you have introduced into the lower case. I think your shapes may have peaked already before the addition of these tiny curves. You may feel the characters are not interesting enough without this softening but I feel you may have gone a bit gimmicky for no good reason. If, on the other hand, you are resorting to micro detailing to give differentiation from other fonts, your basic concept may be at fault. However, I happen to believe the concept is strong, as you know. I'd love to see some more characters; diacritics, lining numerals, that kind of thing. Cheers.</p>
