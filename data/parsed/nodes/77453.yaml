      <p>Hi Jasper, this version is looking very nice indeed. I'm still on Windows XP but looks fine.</p>
      <p>I'd prefer the tittles to be rounder, I guess what you're going for should be a smaller version of the period for consistency? As far as the positioning of the tittles over the /i/ and /j/ is concerned, won't your Dutch /ij/ look weird if the tittles are at noticeably different heights? I've had a look at a whole lot of sans serifs (e.g. Gill, Stone) to see what they do and they all seem to put the tittle at exactly the same heights for both /i/ and /j/. I wonder if the change of height thing in Garamond is to do with counterbalancing serifs?</p>
      <p>After everything else I said, I wonder if the /B/, /D/, /P/ and /R/ could withstand a touch more curvature top AND bottom. I think the angle at the bottom of inner stroke on bowls of /B/ and /D/ either needs softening or you curve them in as per original. I'm sorry, I feel like I sent you on a wild goose chase with the flat stroke approach.</p>
      <p>/C/ looks like it is tipping backwards, less so on /c/ but still a bit notceable to me in text. Same could be said for /G/, although that's a fine letter you've drawn.</p>
      <p>/E/ angle of terminal on middle bar looks different from top and bottom to me, same with /F/?</p>
      <p>/K/ angle too far away from stem. Since width of the whole character looks good, maybe make the arms less inclined so apex is nearer the stem? Apex could also go down a bit so the optical centre is closer to crossbar of /H/, same for /k/ but you may disagree.</p>
      <p>/L/ you may even get away with a touch more off the foot.</p>
      <p>/M/ is very nice indeed, you're looking for similar central strokes in /W/ (i.e. less tapered still). /M/ could maybe go a fraction narrower, as could /W/ maybe?</p>
      <p>/R/ still light on leg/foot and at the junction. Look at same stroke in /X/ - much thicker.</p>
      <p>/T/ optical thing - does the whole crossbar need to move slightly to the right? (BTW, /T/ and /Z/ horizontals looking much better and correct height too!</p>
      <p>/quotesingle/ and /quotedbl/ really like the angel you have cut those off at, can it be the same for /comma/ and all quotes?</p>
      <p>/t/ could withstand slight leaning to right at top. You could also extend the arm out a little further. Or else, for consistency, you could make it more like the /f/ and cut it at an angle higher up as shown below:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jasper2_4081.png"></div><p></p>
      <p>/y/ I preferred a gentler curve on the tail as per earlier versions? Looks like it's got a kink in it to me.</p>
      <p>/b/, /d/, /p/ and /q/ There is still some inconsistency with the widths of these. In previous posts you've said the /p/ and /d/ are the same glyph but rotated. I assume you would do the same thing with /b/ and /q/. Have a look at the capture below:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jasper_3534.png"></div><p></p>
      <p>My feeling is that the /d/ and /q/ are a good deal wider than they need to be (even if you are following the Garamond model). Those red rectangles are all identical. To my mind, the /b/ and /p/ are the right width but the /d/ and /q/ are just too wide. Remember, I'm sure you do, the white counters play just as imporant a role as the black strokes. You don't want big white holes which I think you are getting a little with /d/ in text.</p>
      <p>Well done on the ink-traps! </p>
      <p>Keep going.</p>
