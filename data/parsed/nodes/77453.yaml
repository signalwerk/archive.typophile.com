    html: |-
      <p>Hi Jasper, part of the charm of the original Sensato was the pointiness. The chamfered terminals seem to work against that. I just think the terminals were a little bulky. I don't think the cuts you have made are working. Worth trying though.</p>
      <p>Thought I'd get a bit more detailed on feedback again, hope you don't mind.</p>
      <p>/a/ wonder if the overhang top left is too much. Lower junction with stem is light next to upper junction of /b/.</p>
      <p>/b/ lower junction of /b/ is very black. Upper junction is good.</p>
      <p>/c/ if you take the upper extremum of the inside curve out towards the next point up from the one it currently goes to the inside curve will be a whole lot nicer even if the terminal is a lot lighter.</p>
      <p>/d/ see /b/ for blackness at junction. I think making the angle on the stems more vertical and the angle of the base of the stem more horizontal may help (and give it slightly more thickness which I think it may need.</p>
      <p>/e/ leans forward whereas /c/ leans back a little. I may be imagining that!</p>
      <p>/f/ love the angles involved in the crossbar.</p>
      <p>/g/ ear much improved, agreed Craig? Could still go a touck deeper.</p>
      <p>/h/ was always strong.</p>
      <p>/i/ tittle very slightly heavy.</p>
      <p>/j/ see /i/ for tittle comment. Would the tail coming less far to the left help with a slightly gentler curve?</p>
      <p>/k/ overflaring.</p>
      <p>/m/ see /d/ stem comment applies.</p>
      <p>/n/ strong like /h/ but /d/ stem comment applies. </p>
      <p>/o/ good.</p>
      <p>/p/ see /d/. /q/ see /b/</p>
      <p>/r/ see /d/ re stems. Ear/arm beautiful.</p>
      <p>/s/ see /c/ for comment about terminals (and initial paragraph of this post).</p>
      <p>/t/ top leans forward a touch too much.</p>
      <p>/u/ see /n/</p>
      <p>/v/ width better now. very slight overflaring (I know you want some flare).</p>
      <p>/w/ strokes 1 and 3 could be darker/thicker.</p>
      <p>/x/ and /y/ good.</p>
      <p>/z/ top horizontal touch thin (maybe bottom horizontal too thin too). You want optically equal, right?</p>
      <p>/A/ overflaring (am I boring you?)</p>
      <p>/B/ interesting curves. Bottom left corner too thick on horizontal stroke. Looks heavier to me than /A/</p>
      <p>/C/ see /c/</p>
      <p>/D/ see /B/ for bottom left comment.</p>
      <p>/E/ arms thin (like /z/) especially compared to horizontals of /B/ and /D/. I thin the problem is the /D/ and /B/, not the /E/.</p>
      <p>/F/ see /E/ on arms. Lower arm could stand going south a touch.</p>
      <p>/G/ would make the final upward stroke cut off horizontally rather than angular which doesn't appear elsewhere in the upper case.</p>
      <p>/H/, /I/ fine.</p>
      <p>/J/ see /j/ re sweep of the curve.</p>
      <p>/K/ see /k/</p>
      <p>/L/ fine.</p>
      <p>/M/ great, any reason why the central apex doesn't quite reach the floor (that comment may apply to the /w/ and /W/ too.</p>
      <p>/N/ right foot causing me trouble (as /G/)</p>
      <p>/O/ fine.</p>
      <p>/P/ not quite getting it but can't put my finger on it.</p>
      <p>/Q/ fine.</p>
      <p>/R/ does the central portion need to echo /B/ more or vice versa?</p>
      <p>/S/ see /s/</p>
      <p>/T/ good.</p>
      <p>/U/ could be a touch wider?</p>
      <p>/V/ see /v/</p>
      <p>/W/ see /w/ but only on stroke 3.</p>
      <p>/X/ and /Y/ fine.</p>
      <p>/Z/ leaning backwards compared to /z/.</p>
      <p>Cheers!</p>
