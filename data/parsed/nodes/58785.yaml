    html: |-
      <p>Try restarting Fontlab. If that doesn’t work, see if you can compile the OT code in Free Font Pro, if not, your Fontlab install might be corrupt.</p>
      <p>And just in case you aren’t just using it as a test, AE is a letter, not a ligature, and shouldn’t have ligature code.</p>
