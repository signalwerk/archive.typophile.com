  html: |-
    <p>Hi!</p>
    <p>I just wrote my first Open Type feature, but it doesn't work! I was trying to acheive a simple glyph substitution:</p>
    <p>feature liga {<br>
      sub A E by AE;<br>
    } liga;</p>
    <p>As I hit the »Compile« Button, the following Message appeared:</p>
    <p>[FATAL]  aborting because of errors:<br>
    syntax error at "feature"<br>
    [/Users/jurgen/Library/Application Support/FontLab/Studio 5/Features/fontlab.fea 6]</p>
    <p>Why? What can I do?</p>
    <p>Thanks in advance,<br>
    Juergen</p>
