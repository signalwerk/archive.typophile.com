      <p>"Nice. What you’re getting at?"</p>
      <p>Well, I know you created thousands of free fonts for some time before throwing your hat in the pay-font ring, and have set a robust pace when producing those. That said, regardless of what anyone's opinion is on their appeal - and more on that in a second - I doubt there are many people who've either had their hands on or looked at up close the thousands upon thousands of fonts you have. That's why I was surprised to read what you wrote about the level of originality in Muse. I kinda got the impression you didn't believe they were all that similar. I get scared when I hear things like that coming from people like you because my immediate reflex/impulse is to immediately second-guess myself and pray like mad I'm not some unfortunate version of the emperor in his new clothes here.</p>
      <p>That would be under ordinary circumstances. In this case, however, the similarities have been well-quantified, identified, and crucified.</p>
      <p>As for allowing two designers to work out things like this in their own little corner of the courtyard - or believing it to be the most diplomatic dove approach, all that does is lay the benefit right back in the lap of those perhaps least deserving of it. Perhaps the coals could have been turned down a bit, agreed - still, I can't imagine feeling all that guilty about forgetting to bake the Parachute entity a cake. I strongly believe people are overlooking two crucial points here - first, this thread has not been 100-percent ground-breaking the entire time, so doing anything but engaging in such dialogue would amount to nothing more than complicity. And second, much has been said about Paragraph's failure to recognize the problem before releasing the font, which many here seem all-too-willing to forgive for the sake of peace.</p>
      <p>As would I - if not for the fact that some Paragraph personnel have on this very site defended the originality of their work  if not take outright offense when anyone even hints at suggesting otherwise. And in rather eloquent text that was anything but self-effacing. I therefore strongly disagree - I believe the energy and consideration the subject matter generates has in my mind been healthy. As long as this issue awaits an ethical, everybody's happy conclusion, it should continue. </p>
      <p>However, I do agree it has run its course and as I've said earlier, probably a good candidate for total deletion. When it was unresolved and still being hotly debated, ending it would've been the worst thing to do since it would relieved those responsible of any sense of urgency to correct it. I believe it has been, and from THIS point forward any damage Parachute might incur would be arguably underserved. Still there's a little voice in me that keeps echoing a basic philosophy ... we all end up being held accountable for what we do and produce, which isn't abusive to us or even something we can piss and moan about before trying to outrun it. </p>
      <p>To suggest a single person here might be in any way to blame for clouds that form over Parachute because of this would be a misguided attribution.</p>
