      <p><cite>Following them around the net and offering the original, all for a price that’s hard to argue with. Could make some serious waves, and hurt some one’s credibility.</cite></p>
      <p>Hurting the credibility of Parachute has already been done and I'm satisfied with that. It would have been just if they had asked me to use Delicous as a base for their muse face. </p>
