      <p>" I am wondering how you would react if the font in question was yours? Because you’re curious?"</p>
      <p>Nope. Just the curious type. </p>
      <p>Actually Nick Mr., I was humbled by your outward response in this thread (to a certain degree, anyway, though I felt it was a bit lenient) and wondered if the right-brainer in you would have a more emotional opinion. In strictly analogical terms, to me this is almost like how one would feel watching someone else's wife getting slapped vs. watching your own. The former vision could be rationalized by saying "a lot of people beat on women - yes it's tragic. But you can't just single out one loser when handing around criticism." In a typographic sense I am wondering if you'd apply the same theory. Or would you, like me, look for the guy and limit the remainder of his life's menu to jello through a tube?</p>
      <p>Along these same lines, I have been just as humbled by Jos' response to all this. Although I also was warmed by the fact that yesterday he was on the verge of calling the Parachute guys silly nincompoops.</p>
      <p>As for "Vank," first let me say I admire very much the guts it took to step up like he did - even if he what he said left much to be desired. It must have been extremely difficult to read the content of this thread. Still, after a night of sleep and newfound commitment to the idea of live and let live, I can't help but question the intent. This wasn't a journeyman designer driven by influence who submitted a font that was lackadaisacalamandabody released for sale at almost $400 for the family. Obviously Vank knew of Delicious's existence, and there are - or should be - more than just a few tees to cross and eyes to dot before a studio puts a font on the shelf for purchase. Clearly, decisions had to be made, perhaps a few last-minute alterations, etc. I cannot help but believe that SOMEWHERE along the way during this process, more people than just Vank had to have some clue what's going on.</p>
      <p>I compare it to baseball, football, or perhaps even that strange game where the men run all around the field trying to kick(!?) the ball into a net bigger than my apartment. The best leaders of organizations in these arenas not only know their players, they know everyone else's, and who is on their way to the big time. Granted, they may not know EVERY standout in their, or should I say on their field, but in comparative terms, they almost should at least be aware not only of "Delicious," but of Jos himself. I think Jos is blue-chip all the way, and I'd find it difficult to believe most on this site haven't either become aware of him, or at least his work.</p>
