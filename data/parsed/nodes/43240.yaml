      <p><cite> &gt;It’s one thing that they “borrowed” the design and “modified” it, but it’s another to try and profit from it.</cite></p>
      <p><cite>Isn’t that essentially how open source works? Many people out there believe that’s how everything should work.</cite></p>
      <p>That stinks, implying that those of us who find good cause for some open source fonts also think copying someone else work without credit, and reselling it, is OK.</p>
      <p>Below a portion of SIL's Open Font License, also followed, I believe by the Greek Font Society.</p>
      <p><cite>The OFL allows the licensed fonts to be used, studied, modified and redistributed freely as long as they are not sold by themselves. The fonts, including any derivative works, can be bundled, embedded, redistributed and/or sold with any software provided that any reserved names are not used by derivative works. The fonts and derivatives, however, cannot be released under any other type of license. The requirement for fonts to remain under this license does not apply to any document created using the fonts or their derivatives</cite></p>
      <p>Pretty clear about prohibiting reselling or relicensing the font, modified or not.</p>
      <p>If font developers in the commercial sector wish to so restrict their fonts that they are of little to no use for some applications that is their business; the marketplace will sort it out. But to insinuate that those of us who support OFL also support what amounts to piracy, strictly legal or not, does a disservice.</p>
      <p>Without fonts like Charis, Gentium, and the offerings from GFS, a number of authors would not be able to prepare manuscripts so that typesetters could use the author's files economically; without permitting limited font modifications as allowed by Adobe's EULA, some scholarly books could not be published.</p>
      <p>Believing in that is a far cry from supporting the shenanigans apparently going on as reported here.</p>
