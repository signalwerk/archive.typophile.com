      <p>Those of you who have been to the 1st ICTVC may remember Panos Vasileiou (founder of the Parachute design system) presentation. It was the story of who stole from whom in the typographic universe; a sort of an apology for incestuous similarities in typefaces. Interestingly, there's the rumour that a few major type houses have been trying for some years to take Parachute to the courts, but the Greek judicial system seems unable to fathom the intricacies of type design. Even more interestingly, whenever there is a discussion about Parachute fonts, Greek type designers do not fail to notice that even though the Latin seems to be well designed, the Greek leaves a lot to be desired. Couple that to the fact that differences between PF types and suspected originals appear mainly in widths and not in heights and you end up uncomfortably numb.</p>
      <p>Circumstantial evidence, I know. It may walk like a duck, it may look like a duck, but it's still an elephant.</p>
