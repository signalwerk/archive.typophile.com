      <p>Mr. Shinn I've agreed with you on more things than you'll ever know because I read quite a bit of what you write here and elsewhere. Unfortunately, this isn't one of those times.</p>
      <p>I believe the one major difference between what you've opined and the real tragedy here is in fact a two-parter: a.) Delicious was and is a free font and among the best at that; and b.) I sadly must admit I've got underwear older than Delicious. Delicious hasn't even reached its peak notoriety yet, much less be anywhere near eligible to be "revived."</p>
      <p>Additionally, the Parachute people are charging big bones, so to speak, for their version of someone else's font; not their version, interpretation, tribute, of the font, but a virtual exact copy. Certainly there are arguments for everything you wrote; however, perhaps another a$$-chapper here is that most legitimate "revivals" are interpretations, created in part as a quasi-honor, and most certainly not a point-for-point ripoff by someone who didn't really try all that hard to disguise his actions.</p>
      <p>Without question, typography is a lot like music or the motion-picture industry. In this case, however, someone has taken the exact bars and notes from a Zeppelin song, changed "day" to "afternoon" in the lyrics here and there, named the song "Foggy Hill Trot" and are selling it for big bucks ... all while brazenly sitting among true professional musicians and saying "really, we wrote that. It's nothing like ... what's that song you mentioned? Misty Mountain Hop? I've never even heard of that."</p>
      <p>And finally, at least from a personal perspective, the Parachute people are especially shameless when considering at least one of them seemed to be offended by the suspicion of any "borrowing" going on, and another trumpeted the foundry's value while cramming in between it all what amounted to, "everyone else is doing it, so why can't we?" Let's pray none of us in-denial plagiarists decide to jump off a bridge.</p>
      <p>The bright side here is the Parachute version of this font seems aptly named with "Muse." I'd say Delicious provided the perfect "Muse."</p>
      <p>In support of your point, however, certainly Southern Software and its ilk do this kind of thing on a massive scale. However, even in that case, SSI offered cheaper versions of more expensive fonts; here, someone's taken a very good free font, copied it, renamed it, and now is selling the Muse family for more than a downpayment on a JetSki. </p>
      <p>Frutiger vs. Myriad is a fight, even if a one-sided fight. This was unmitigated larceny by people who - despite having their faces on hi-def video surveillance and carrying a sign saying "PARACHUTE" - still come here and have the nerve to claim, "that's not us." I'd swear one of them has to be Martin Short.</p>
