      <p>Hi all!<br>
      My name is Charis Tsevis and I am a designer who collaborates with Parachute Fonts too.<br>
      I ve been informed about this thread and I am writing what I think and feel.</p>
      <p>1. Vagelis aka vank was obviously wrong.<br>
      What I understood is that he wanted to create a sans serif font (like Meta or Syntax) and he is based on Delicious, which was freeware.<br>
      He thought it was open source because he had one of the first versions, those without a EULA.<br>
      He made his new font wich was a 600 characters typeface with 10 versions.<br>
      OK. He was wrong. He had to give credits and communicate with Jos in the first place.</p>
      <p>BUT...<br>
      2. He directly accepted his fault and he is willing to correct it.<br>
      As anyone here is not knowing him personally, it's better not to guess what happened and what he is going to do.<br>
      You better wait and see.</p>
      <p>2. Some of you, fellas, are going too far away.<br>
      It's really sad to read about ...beaten women, cheated wives, companies with questionable credibility.<br>
      And all these without knowing facts, persons, companies etc.<br>
      OK, this is the internet, where everyone of us is usually expressing him self very fast. But, wait a minute. Ask yourself if you really know what you re saying.</p>
      <p>After quite an hour of reading this thread (Sorry for my bad english) I am really feeling sad.<br>
      Vangelis is being treated like a thief and you ask to boycot Parachute Fonts, which is a group of 13 designers.</p>
      <p>I only hope this wont open another battle.<br>
      Thanks for listening.<br>
      Best</p>
      <p>Charis</p>
