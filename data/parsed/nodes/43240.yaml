      <p>It's not the first time there's been a plagiarism dogpile on this site. Point piracy is one thing. Designers know whether of not they've drawn points or copied them. Before you publicly accuse someone of plagiarism, contact them first becuase there may be a rational explanation.</p>
      <p>About 10 years ago, a client(pro-bono) sent me scans of lettering in a 1960s high-school yearbook drawn by an anonymous illustrator. A few years later, I received an irate email from someone who designed a similar font in the mid 1990s. When I saw the font in question it was obvious that my client had tricked me. I underestimated how low people can sink to save $50. I apologized to the designer, removed the font from my site and asked about 50 of the most popular freeware sites to remove it. I am thankful that they contacted me first rather than raking me across the Typophile coals.</p>
      <p>In 2001, a client commissioned me to create a font (based on Zero Hour) which I ended up calling Xirod. The client had very specific requirements and even required me to sign a contract to ensure that it would be released as freeware. I thought it was a strange request but the idea seemed original to me. After I released it, I noticed a similar free font called Battlefield. Luckily I didn't go with all of the clients recommendations so it didn't turn out exactly the same . . . but it easily could have.</p>
      <p>When fonts are commissioned by a client, they often have very specific requests. On two other occasions, partway through a project, I caught on to the ruse and convinced the client to take the project in a different direction.</p>
      <p>Sometimes designers are inspired by the same "classic" fonts that I am and accuse me of stealing their ideas. I won't embarrass anyone by citing examples here. Many font designers have the same old metal type specimen books in their bookcase that I have.</p>
      <p>Yeah, I publicly pointed out Intellecta's point theft of one of my discontinued freeware fonts, but what we're looking at here isn't clearly point theft. Before you going to publicly accuse, make absolutely sure you're right.</p>
