      <p>"I’m not sure the connection there. What does misconceiving it as open source have to do with reselling a derivative of it?"</p>
      <p>Not certain, but I do know open source material is in effect like one big giant universal collaboration on various programs, fonts, etc., and exists in a world where the concept of copyrights causes nasty, painful skin and brain irritations to those involved. As for making profit from material derived from an open source project ... I can't really quantify the morality of that without more thorough knowledge of all the factors involved. I imagine if you can take a program born under the open source idea, make dramatic improvements to it and sell a finished project that hardly resembles the original software, you'd make it as far as engaging in questionable conduct. In my eyes only mind you. Now we really are talking about some grey area. </p>
      <p>The kicker here was that not only did Muse's designer not make absolutely certain the font originated as open source, he didn't even bother to contact the original designer - whose identity must have been known to him - to find out.</p>
      <p>That has been one of my points all along - this is nightmarish on all kinds of levels and not just a debate on an isolated oversight.</p>
      <p>Wait ... doggone it. Sorry about that Andrew. Just when I think I'm out, they pull me back in.</p>
