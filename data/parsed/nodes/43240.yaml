      <p>"but what we’re looking at here isn’t clearly point theft. Before you going (sic) to publicly accuse, make absolutely sure you’re right."</p>
      <p>Wow, I'm particularly surprised by this statement, considering the author. Unlike the designer/studio, neither of which made sure they were right about Delicious being an open-source font, I am going to second Jos' sentiment here and state I don't need to see the points before being able to identify them as copied.</p>
      <p>However, if some feel that observation doesn't carry enough substance to vocalize an all-out accusation ... or if some feel - as you seem to - that Muse and Delicious do not share enough similarities to constitute "piracy" or whatever, all I can say is this:</p>
      <p>1.) Eventually the designer of Muse himself came on here and admitted being "influenced" by Delicious, which verifies the connection at the very least.</p>
      <p>2.) Jos, the designer of Delicious, saw his font in "Muse" almost instantly ... kind of like a father or mother could pick their child's voice out of a party crowd or verify it sight unseen.</p>
      <p>3.) I know there were a few visual examples posted above, which are quite compelling - but in my opinion not even the best representations of what's taken place here. Off the top of my head I can think of virtually exact duplicates also existing in the lower-case b, c, d, f, p, q, s, v, w, x, y and z. The numbers are nearly indistinguishable. Even the upper case "P" isn't "land-locked" to borrow from one of my own terms to describe the unclosed-look.</p>
      <p>And finally, I think one of Delicious's most impressive features is it isn't what I'd call cookie-cutter, despite being a clean, solid sans. There are subtle, unique features all over that font unlike any other sans I've seen. I'm not comparing Jos's achievement to the parting of the Red Sea by any means ... all I'm saying is, the uniqueness of Delicious - in addition to being evident upon closer look - also made these similarities that much easier to identify. A sans serif font almost inherently restrains a designer from the start, but with Delicious, Jos still managed to give the font its own distinctive appearance (i.e., the lower-case e, f, v, w, etc.) and made what the outlines dictate should look like a pure square-sans into something artistic and in primitive terms, curvy. </p>
      <p>Every now and then when I quickly glance at Delicious it reminds me of Quadraat Headliner, but only for a moment. I don't think I spent a single moment looking at Muse without immediately tying it to Delicious.</p>
