    html: |-
      <p>People, alas, leave Parachute aside; that's absolutely my responsibility. Indeed the first version of Muse has been based on Meta, Syntax and on some of their 'descendants' or influenced fonts - if you'd rather call it so - Delicious. Contrary to what my impression was, the  font was just freeware and not open-source. Hence I should have never used Delicious and the previously mentioned fonts as a base in order to create a different font with additional value, more weights, variety and so on.</p>
      <p>I should be contacting very soon the designer of Delicious and resolve this matter in the best possible way. Furthermore, I have asked Parachute to withdraw the font until a satisfactory solution is  reached. Myself I've dealt before with designing greek characters for international open-source font projects and - after contacting the original designers and crediting them - I have also designed greek characters for non-open source, freeware fonts that were distributed over the internet (some of which were exposed here on typophile as well). Hence I APPRECIATE the effort of people producing software to be distributed freely and BY NO MEANS would i ever intentionally cause any harm on such efforts. Now, while this discussion serves well as a lesson for us young designers and while I understand Jos Buivenga's reaction, I find completely unjustified the effort to harm Parachute's credibility. Moreover, if I had been contacted directly, this matter would have been resolved in the best possible and civilized way. This has been indeed a valuable lesson.</p>
