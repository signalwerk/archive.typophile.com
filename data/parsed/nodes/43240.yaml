      <p><cite>Influences? Yes a lot. But don’t you see this in all new faces? As Goudy once said “the old guys stole our best ideas”. If originality was questioned, in this harsh and inappropriate way, anytime each one of us spotted some sort of ‘inspiration’ from another source, then all existing new faces would have been knockoffs to different people for different reasons. I myself, and assume many of you, every time I look at typefaces I find similarities to other ones. This does not necessarily mean one is a knockoff of the other.<br>
