      <p>I am not certain I understand how open source generates profit for anyone, but I claim ignorance because there could be an "Open Source" department store around the corner from me and I probably wouldn't know it.</p>
      <p>As for the references to the other string regarding Parachute, I find this one much more provocative and specific. Furthermore, I believe there are a few posts from Parachute people in that string, which certainly now make for interesting reading. In fact I believe one comment was something to the effect of "Stealing? Us? Are you kidding?"</p>
      <p>And for those who've followed this thread and still have yet to view both fonts up close, let me just reiterate here that this is not someone reflecting an obvious influence in three or four characters ... we're talking about virtually every character being identical, point for point. There aren't enough zeros in the Milky Way to quantify the odds of something like that taking place by accident.</p>
