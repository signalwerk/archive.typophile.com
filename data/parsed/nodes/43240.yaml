    html: <p>That I believe I'll leave to the person comparing. Let's just say there are what one would call "similar" glyph shapes, and then there are identical glyph shapes with one being scaled horizontally perhaps 101 percent, or merely had a small serif slapped on it. As mentioned, download the pdf for Muse, find and download Delicious, and just do a cursory comparison. If it's within your moral structure, strip the Muse pdf, and open both fonts in any font creation program. It would be downright comical if it wasn't so nauseating. Somehow this doesn't strike me as being similar to copying helvetica and re-naming it helstetica.</p>
