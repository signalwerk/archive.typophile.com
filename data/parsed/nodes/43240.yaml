      <p>I have been trying to bite my tongue until both sides had aired ther views on this including Parrachute. While it is fair to say that the derivitive work may not have had a proper EULA or perhaps freeware vs opensource issues caused some confusion and muddled the legal issues, the ethical issues are another matter. Even if there were absolutely no way for a person to sued for the "youthful indescretion", how could they live with themselves as a human being? It should not be an issue of, will I get caught--it should be an issue of ethical human behavior. If you claim to do original work, then see that it is original. If you derive a work from someone else's sweat and toil, be a man and give them credit at the very least. Type designers are a small brother/sisterhood of people who work countless hours. Most give freely of their experience to others in guidence and cheer eachothers success and releases as if they were family. Vangelis, you are Jos brother in this craft, honor him and his work like a brother--don't become a thief in the night and betray his trust.<br>
      Vangelis was my fathers name and you have dishonored your own family. I am sure your parents raised you better than this deed betrays.</p>
      <p> ChrisL</p>
