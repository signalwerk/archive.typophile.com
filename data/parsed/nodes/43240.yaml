    <p>The proprietor of the site parachute.gr has in a different forum complained about TTF versions of his fonts being hacked and said to one member that he'd appreciate it if that member would buy his fonts instead of obtaining them in some unethical way.</p>
    <p>However, perhaps someone can visit this page: </p>
    <p><a href="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=53&amp;CharacterSetID=73" title="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=53&amp;CharacterSetID=73">http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=53...</a></p>
    <p>and tell me how the font "Muse" could not be so blatantly ripped off from Jos Buivenga's "Delicious." Which can clearly be seen in the lower case f, g, c, and s, and certainly seen in the remainder of the lower case letters. For that matter, with the exception of a few minor tweaks and added "serifs," the outlines are virtually identical.</p>
    <p>Shameful.</p>
