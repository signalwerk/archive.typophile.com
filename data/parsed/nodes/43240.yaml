      <p>It's one thing that they "borrowed" the design and "modified" it, but it's another to try and profit from it. Honestly, artist to artist, a collaborative effort should have been forged, and Jos should see part of whatever profit they make.</p>
      <p>If Jos goes on a reclamation crusade, he could hurt the Parachute guys were it counts... in the pockets. Following them around the net and offering the original, all for a price that's hard to argue with. Could make some serious waves, and hurt some one's credibility. </p>
      <p>But it's possible the Parachute boys just had a moment of ethical and moral lapse, and bringing it to their attention might be enough to set things right. Jos, you're a giving, talented artist and imitation is the best form of flattery, but you shouldn't be taken advantage of.</p>
