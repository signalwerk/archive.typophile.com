      <p>"since point-by-point the fonts are simply not the same"</p>
      <p>And my aunt's an uncle.</p>
      <p>Nudging one or two points every other character just to be able to claim a difference in the font is almost more offensive than simply leaving the entire font intact. So in the places where the fonts ARE different - other than the upper-case "R" and other such obvious alterations - are you saying that Jos' Delicious was "just off by an em unit or two" here and there? You must since you've identified the font as an "influence" and thus, obviously would rather improve on - than diminish - the appeal of the font. Jos, I guess you need to tighten up a little there, buddy.</p>
      <p>Also, help me understand something here, Vank. You wrote:</p>
      <p>"... I myself have participated in open source font-project in the near past [yet] this freeware font was misconceived as an open-source font."</p>
      <p>Open source, if I'm not mistaken, is a collaborative effort that, for lack of a better description, involves tons of creators and designers who all still pretty much know the two or three places everyone congregates online to exchange and interact. Also to the best of my knowledge, a large percentage of open source material can be freely downloaded or perused on two or three main sites (not counting ftp sites from which one can download the downloads). </p>
      <p>I am making no accusations here. However, as you yourself participated in the open source font project, I would think you far better than most would be among those less-likely to be prone to such "misconceptions."</p>
      <p>Vank, part of the point here too is cut and dry as the rest: there is little room for "misconception" under these circumstances. If indeed that was a consideration of yours, you don't hope, assume, or even rely on your certainty. You find out. Then you double find out. And you do what you have to do until the possibility of misconception no longer exists. These are not strict guidlines, or my rules, etc. For one thing, it's known in its most primitive form as "respect." However, this approach exists in many forms on many levels beyond mere respect. </p>
      <p>Vank, whether you realize it or not you essentially decided early on it would be better to seek forgiveness than permission. Yes, you are correct - they aren't EXACTLY the same fonts, and Delicious is a free font notwithstanding the copyright spider web. Perhaps now you could explain how either of those facts mitigates any of the damage resulting from this, if any? Are you really going to stand behind a claim such as "I've tried to be apologetic and express remorse, but you know, it WAS a free font so tough sh**?"</p>
      <p>I admire your guts to appear here, believe me - however, you still seem a bit recalcitrant. I would imagine you hope it ends here. Unfortunately I think your voting privileges might have been placed on hold.</p>
