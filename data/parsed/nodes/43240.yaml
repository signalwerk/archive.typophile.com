      <p>Hold on just a minute there, Charis. I think you just burned my butter.</p>
      <p>"And all these without knowing facts, persons, companies etc."</p>
      <p>Let me be extremely clear about this, so there are no misunderstandings. In this situation, I know the only two facts anyone needs to know.</p>
      <p>First, Muse is not "influenced" by Delicious, it IS Delicious. I don't believe I'm alone here in identifying Muse as a virtual point-for-point recreation. There is a tremendous difference between "influenced" and "copied," be it professional, ethical or otherwise. Please do not continue to insult my intelligence by claiming anything else. George Thorogood was "influenced" by Jimi Hendrix - he didn't pillage through all of Hendrix's unreleased material and release an expensive album with songs he claimed were only "influenced" by Hendrix. I find it nothing short of disgusting you would even make such a suggestion.</p>
      <p>And second, the real shame here is I had to be the one to tell Jos (indirectly) about this theft, when HE should've been proudly telling all of US about the new release on which he collaborated with the Parachute studio. Charis, say what you like. I will never believe that among the designer, the studio and whoever else came and went in between, the designer and an insignificant weenie like me in Lakeland, Florida were the only ones who had any clue about the story behind this font.</p>
      <p>Beyond those facts, nothing else really matters. We're not talking about events taking place in a compact, three-day stretch, that involved an honest mistake and how you interpret the meaning of "influence." There is very little black and white here. Black and white exists when a few numbers and key lower-case letters like a or g share some striking visual similarities. Not when virtually every single letter is an exact duplicate.</p>
      <p>People seem to like quotes here, so let me throw mine in the ring, which I believe has some applicability:</p>
      <p>"Almost all our faults are more pardonable than the methods we employ to hide them" - Francois de La Rochefoucauld</p>
