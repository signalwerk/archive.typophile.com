      <p>Not only fessing up, but I'd like to believe in some cases that yes, homage. Perhaps my idealism is misguided ... I prefer to identify what you call "fessing up" as - at the absolute least - "acknowledgement." And again, perhaps my ignorance is once again dancing on my forehead, but these "revivals" often are of typefaces not originally drawn on a computer and thus, unable to be duplicated hammer-stroke by hammer-stroke OR point by point. </p>
      <p>Visually they may be identical, but it still required some typographer to replace pounding iron with drawing his or her own points. Between that and yes, the confession/acknowledgement, I simply cannot see how the two directions could be compared. Believe me, I fully agree - originality is rare in typography, music, any form of art. But this wasn't a cover song, a conversion from metal or plate to digital, or even a parody like Mad Magazine. This was Brett Buster and Violet O'Mara starring in the four-hour southern epic Swept by the Storm and getting offended by comparisons to Gone With the Wind. They're playing a shell game here, except they're trying to use three balls and one shell.</p>
      <p>If anything, just the flagrant nature of would seem to offend everyone, not just Jos, because it seems you're defending what in essence is Parachute's belief that we're all idiots. That's probably the difference between us - though not my font, I take this kinda personally; it seems you take a more pragmatic, liberal approach. Which is why I'll be dead at 50 and you'll probably live to something divisible by 50. Still, I can't shake the things said in the other thread by these people.</p>
      <p>"Content creators deserve a limited-time monopoly to benefit from their work (during their lives)"</p>
      <p>Agreed. I think Jos just posted something, however, so unless he died of carpal tunnel in the last half-hour, his limited time is still ticking.</p>
      <p>Now please, Mr. Shinn, would you just die already? Not actually die die, just for like an hour or so. OH my - never mind ... I lost my head there for a second pondering the idea of your work being part of public domain. My apologies sir.</p>
