      <p>Sorry, Vangelis, but explanations proffered so far are unpalatable and tough as old boots. I have no stake in this squabble, save this: honesty. That being said, it may be time to don your fire-retardant underwear...</p>
      <p>Vank: <em>"Contrary to what my impression was, the font </em>[Delicious] <em>was just freeware and not open-source. Hence I should have never used Delicious and the previously mentioned fonts </em>[Meta, Syntax, and admitted but unspecified others] <em>as a base in order to create a different font with additional value, more weights, variety and so on."</em></p>
      <p>Notice of copyright wasn't ample clue that you ought not tinker with someone's work, let alone lift it indiscriminately as the core for what you presented to the world as "original" work? Additionally, Meta and Syntax are neither freeware nor open-source, but such rude facts generated zero compunction?</p>
      <p>Vank: <em>"I should be contacting very soon the designer of Delicious and resolve this matter in the best possible way."</em></p>
      <p>Better late than never, eh? Will you similarly make amends forthwith about fiddling with the innards of Syntax and Meta? Confession may be good for the soul and all that, but restitution might speak volumes — certainly more so than feigned contrition.</p>
      <p>Vank: <em>"I have asked Parachute to withdraw the font until a satisfactory solution is reached."</em></p>
      <p>Permanent withdrawal would probably be better still, inasmuch as this concocted product seems far too tainted.</p>
      <p>Vank: <em>"I APPRECIATE the effort of people producing software to be distributed freely and BY NO MEANS would I ever intentionally cause any harm on such efforts."</em> </p>
      <p>Funny stuff, that, if it didn't ring so false. In the case of Delicious, can anyone seriously believe you simply overlooked a clear copyright notice? Moreover, this "software ... distributed freely" bit doesn't touch on your admitted use of Meta and Syntax (and others) — i.e., "pay-ware" is somehow "fair game" by your lights? Is the process to toss 'em in a blender and spin well until an "original" congeals?</p>
      <p>Vank: <em>"I find completely unjustified the effort to harm Parachute's credibility"</em></p>
      <p>That's too much like the pot calling the kettle black. Marketing a sham "original" did the company no great service. Judging by the comments of Angelos Bakas (a.k.a. "acrobat"), above, Parachute's supposed "credibility" is already dubious at best. I see no concerted anti-Parachute "effort" afoot here ... though maybe there ought to be one. D'ya think?</p>
      <p>Vank: <em>"... if I had been contacted directly, this matter would have been resolved in the best possible and civilized way."</em></p>
      <p>Whoa! Wait a minute now. It's somehow become the responsibility of the guy you decide to rip off to contact you and say, "Please cease and desist," instead of it being your obligation to not pinch his goods in the first place? That doesn't track well at all.</p>
      <p>Vank: <em>"... a lesson for us young designers ..."</em></p>
      <p>Yeah, right. That's akin to saying, "C'mon, folks. Let's just chalk it up to a youthful indiscretion, shall we?" No excuse, sir. Not on a bet.</p>
      <p>Vank: <em>"This has been indeed a valuable lesson."</em></p>
      <p>Yes, indeed. Phrased bluntly: "Thou shalt not steal."</p>
      <p>I, for one, certainly hope you move with all due speed to rectify this matter. Jos seems a first-rate individual, so perhaps he can forgive. It's been quite tawdry, all in all, and I fear the mar will remain. More's the pity.</p>
