      <p>Oh and about the appeal of Typodermic fonts: regardless of what anyone thinks of Mr. Larabie's production pace one way or the other, he's certainly accomplished one thing: I probably like as many fonts appearing on his site as I do any other single site on the web, short of our current handful of massive empires. For my taste, the first thought that enters my head when looking at Gnoulane is Bureau Grotesque 31. But there also are fonts all over his site that I appreciate for a number of reasons.</p>
      <p>I really do find interesting the approach to typography taken by both Mr. Larabie and Jos Buivenga; Jos offers wonderful fonts for free, but since so many people rain down on his site on a regular basis, he either does or logically could generate revenue that way. Mr. Larabie on the other hand has literally created something for just about everyone regardless of his or her taste and I know recently was among the top sellers of new fonts at my fonts.com. I see absolutely nothing wrong with either approach, or the one in which a typographer all but identifies him or herself by one or two iconic mega-families. I even have my own personal little approach to the strategy of font production, a bit different from those above.</p>
      <p>My approach is to try and retain as much sanity as possible while the cerebral contractions of having just one type baby reduce my core to runny fried eggs. And when ready, try to minimize the number of times I keep trying to cram that baby right back in where it came from until its perfectly incubated. It has its own sort of efficiency in a way, and still needs a little work.</p>
