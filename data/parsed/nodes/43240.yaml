      <p>Thank you, Nick, I will avoid Mr. Shinn from now on.</p>
      <p>In response to a few of the more intriguing comments:</p>
      <p>"It does concern me that when 'everyone else is doing it,' only some offenders get called to task. This is probably something for the concerned parties to sort out."</p>
      <p>I'm not sure I like Nick anymore because it sounds disrespectful to me - especially when I feel compelled to point out the claim "everyone else is doing it," uses the word "it" in a vastly different context than its ordinary application. I find it difficult to believe "everyone," is engaging in this level of rip-offensy, a word making its debut appearance in the English language in this very sentence. Everyone else may be tweaking metrics, auto-setting kerning and/or making a sans serif out of Clarendon without disclosing the intent ... and then distributing the result for sale. This to me was much different.</p>
      <p>My point: I think in this context, we're not talking about "offenders" all existing on a certain moral plane. We're talking about what to the best of my knowledge is a completely different level of "offenders," and as such, almost demand to be taken to task. I see your point - why attack Parachute when Foundry X has been releasing virtual mock-ups of various fonts for years. I just don't consider this to be on par with what might call "routine" piracy.</p>
      <p>"Parachute may have crossed the dividing line into point piracy, but I suspect they don’t think that’s any worse than a legitimately-drawn Frutiger clone which didn’t even bother tacking on a few serifs."</p>
      <p>And that's frightening because it introduces an entire different dimension of thinking and approach to the field. I can see 65 fonts that are visually identical to Frutiger but of those, perhaps 20 of them spent their entire creation process as a unique entity ... before the designer finishes and says, crap, I've just designed Frutiger. Of the remaining 45, I couldn't even speculate how many of them have similarities right down to the exact point location - all over the font. In an odd way, I admire the whole Myriad "entity" because at least in a visual sense it comes out and admits it's a Pepsi to Frutiger's Coke. This font looks like it's wearing a nose-and-glasses.</p>
      <p>"i wonder how exactly “originality” works in font design, specifically in the arena of updates and revivals of relatively conservative styles?"</p>
      <p>The accompanying visual was powerful and definitely echoes the infinite fine lines between fonts and styles. The difference: the examples you provide display fonts extremely similar in appearance. Parachute's "Muse" just bypassed even bothering to make a font that looked extremely close to Delicious, they just TOOK Delicious itself and curled its hair. This is not a question of how "original" the font "Muse" is. That would be an appropriate question/comment only if Muse was created in a cave and when emerging just happened to match point-for-point with another font. </p>
      <p>"“Never attribute to maliciousness that which can adequately be explained by stupidity!” Mark Twain"</p>
      <p>Never let stupidity prevent you from recognizing what is obviously malicious. - Curioustype.</p>
