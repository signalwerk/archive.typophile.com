  html: |-
    <p>I been using modular scales in my layouts and typesetting recently and have built a calculator to help produce double stranded scales. </p>
    <p>I have also added in the calculations for ems and base 16 ems as I often need them when building websites.</p>
    <p>Figures can be entered as straight numerals or in picas and points, as in 10p6 for 10 picas and 6 points.</p>
    <p>Anyway I thought I'd share it here incase someone else may find it useful.</p>
    <p><a class="freelinking external" href="http://modular-scale.com" rel="nofollow">http://modular-scale.com</a></p>
    <p>I would also appreciate any feedback or suggestions.</p>
