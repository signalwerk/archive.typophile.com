      <p>Howdy, isn't this a simple matter of feathering the edge of an object(s) Effect &gt; Stylize &gt; Feather? </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Illygradientfeather_3980.jpg"></div><p></p>
      <p>You also used a Gradient Mesh here's a tute for that...<br>
      <a href="http://layersmagazine.com/adobe-illustrator-gradient-mesh-tool.html" title="http://layersmagazine.com/adobe-illustrator-gradient-mesh-tool.html">http://layersmagazine.com/adobe-illustrator-gradient-mesh-tool.html</a></p>
      <p>And, you could also try using an Opacity Mask...<br>
      <a href="http://creativetechs.com/tipsblog/transparent-gradients-in-illustrator/" title="http://creativetechs.com/tipsblog/transparent-gradients-in-illustrator/">http://creativetechs.com/tipsblog/transparent-gradients-in-illustrator/</a></p>
      <p>Edge feathering mini tute...<br>
      <a href="http://help.adobe.com/en_US/Illustrator/14.0/WS714a382cdf7d304e7e07d0100196cbc5f-61d2a.html" title="http://help.adobe.com/en_US/Illustrator/14.0/WS714a382cdf7d304e7e07d0100196cbc5f-61d2a.html">http://help.adobe.com/en_US/Illustrator/14.0/WS714a382cdf7d304e7e07d0100...</a></p>
      <p>Good luck, hope that helps.</p>
