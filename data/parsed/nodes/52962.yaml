    html: |-
      <p>Try the <a href="http://www.dafont.com/perfect-dos-vga-437.font" rel="nofollow">Perfect DOS VGA 437</a> font.</p>
      <p>It's actually a more faithful rendition of the VGA/MCGA hardware text-mode font used in the original Windows BSODs than the virtualized replica that you posted. But the two are similar enough that most people probably wouldn't notice the difference.</p>
