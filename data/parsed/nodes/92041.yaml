  html: |-
    <p>A predecessor created Word documents using several non-system fonts that were apparently installed on his computer, but nowhere else. I have identified and installed all but one of the "rogue" fonts, but cannot figure out what this font, which is used on the title page of several documents from the early 2000s, is:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/US Sample 1_5839.png"></div><p></p>
    <p>In some documents, it shows up fine, but in others it shows up like this:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/US Sample 2_6511.png"></div><p></p>
    <p>In other documents, the same text will be readable or boxes depending on whether other Word documents are open when it is opened. Readable letters include the following:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/US Sample 3_3591.png"></div><p></p>
    <p>The Word documents identify the font as "US." I apologize in advance if there is such a font that I have just been unable to locate. Thanks.</p>
