  - id: 343854
    user: 12009
    date: 2009-04-27T14:14:00
    date_raw: 27.Apr.2009 2.14pm
    votes: null
    html: |-
      <p>I would go further and suggest that drawing the letters by hand to match the rest of the design is probably the only way to go. Of course, you can base the letters on existing type, but I’d say that having the proper hand-lettered look is even more important than the form of the letters.</p>
      <p>If you aren’t confident about lettering, I’d say pick a typeface and draw it on the banners by hand the way you drew the rest of the design. Don’t fret if you can’t duplicate the type perfectly, since you are going for the home-made feel anyway.</p>
