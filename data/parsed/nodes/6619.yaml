  html: <p>We've achieved a similar thing on our site where you can type in a line and see it in the font you've picked, it is scrollable and scaleable. <br> <br>I think this was achieved with swift generator which produces a swf file from the font selected. It might be worth going to the swift site and asking the question there. <br> <br>Hope this helps. <br> <br>Mark  <br><a href="http://www.fontsurfer.com" target="_blank">www.fontsurfer.com</a></p>
