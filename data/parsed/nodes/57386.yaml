    <p>hey all, a friend of mine from university asked me these questions:</p>
    <p><cite> Hey, if you buy a font online, do you get it straight away? And can you only use it on one computer, or could you email it to yourself and use it on your new computer that you haven’t got yet, when you get it?</cite></p>
    <p>so i briefly explained about EULA’s, but in looking for some info about them in the wiki i couldn’t see anything. is there already info in there, or can some of you please answer the above questions?</p>
    <p>thanks!</p>
