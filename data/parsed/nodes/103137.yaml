  html: |-
    <p><img src="/sites/default/files/old-images/CPS_Logo_590w_6728.jpg"></p>
    <p>The image shows the text displayed on the shoulder of the City Protective Services (CPS) suit from the TV show 'Continuum' (Showcase in Canada; SyFy in USA).</p>
    <p>I discovered the 'Zebulon' font, but although it is very similar, it is not quite right. Notably, the letters are not thick enough; the actual font has less spacing on the inner parts of the letter (hopefully you know what i mean).</p>
