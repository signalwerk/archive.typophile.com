    <p>1. Click the ellipse button at the drawing toolbar.<br>
    2. Select the circle.<br>
    3. Cut contours with the knife tool.<br>
    4. Click Get union of contours.<br>
    5. Remove off-curve extremes and reductant points using the "Validation toolbar."<br>
    6. Cut off contours.</p>
    <p>That helped!</p>
