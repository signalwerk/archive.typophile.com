    <p>Inspired by <a class="freelinking-external" href="http://www.typophile.com/user/2969">David</a>’s <a class="freelinking-external" href="http://www.typophile.com/node/42354">button</a>, I made some advertisements for my school’s Help Animals Club. There was obviously a note about meeting times at the bottom, but I’ve removed it.</p>
    <p></p><div class="imageWrap"><img src="/files/Help_Animals_Club_1_by_tlevine_3997.resized.png"></div><p></p>
    <p>These ran in my school’s humor newspaper (which actually isn’t that funny) because it happens to be hated by the Help Animals Club.</p>
    <p></p><div class="imageWrap"><img src="/files/Help_Animals_Club_2_by_tlevine_3812.resized.png"></div><p></p>
    <p>Everyone loves the idea, but I hate the typography. The dingbats don’t match the main font, and I don’t like the font that I used (Goudy Old Style). I’m planning on making T-shirts out of these, so I ask for advice regarding the font.</p>
    <p>I’m thinking it should be something like a pink shirt with white text in a girly handwriting font whose lowercase “i” is dotted with a ♡. It would also need matching ♤♡♧♢. (And they should be open like that.) Can someone recommend such a font? It’s fine if the i isn’t dotted with a ♡ as that should be easy to make if the font has a separate ♡.</p>
    <p>If I can’t find that font, I’m thinking some other friendly font with matching ♤♡♧♢ so I don’t have to adjust free ones to match the font. You’re welcome to recommend other fonts if you don’t have any ideas for the girly handwriting font.</p>
    <p>I plan on removing the ♥♥ from the first one because the font will have hearts on the “i”s. Also, I plan on replacing “animals” with animals of the purchaser’s choice.</p>
