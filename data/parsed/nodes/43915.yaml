      <p>It turns out that one of my friends also likes type, particularly handwriting, and recommended <a class="freelinking-external" href="http://www.1001freefonts.com/catholicschoolgirls.htm">Catholic School Girls</a>. It’s close to what I want, but doesn’t feel quite right to me; I think I want something that looks neater. I tried it anyway. (I know the spacing’s all wrong.)<br>
      </p><div class="imageWrap"><img src="/files/20080413_6585.png"></div><br>
      I think I want script that isn’t slanted (last row of the image). Can someone recommend a font like this?<p></p>
      <p>It comes out pretty nicely when I do this with a pen, but it’s hard for me to do it so nicely with a graphics tablet, and I’d like to see what fonts like this are available. If I can’t find an existing font I like, I’ll do it by hand and scan it.</p>
