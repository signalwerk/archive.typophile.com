    html: '<p>I posted because: I am building a bonus font for Fountain, and the type is tall and strict, sans serif, all caps, quite rigid. And: I wanted to totally break it oﬀ with a swooschy out-of-place ampersand… The problem is that most nice-looking et-signs are very wide, and I want it to be very tall, but still decorative and classic, calligraphic. Thank you for all the links. Thanks Greg, here it is for others to see: <br><img src="http://www.typophile.com/forums/messages/30/2926.jpg" alt="Filt"></p>'
