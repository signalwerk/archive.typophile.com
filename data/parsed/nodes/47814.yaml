      <p>Not in the FLS Python API. But Erik van Blokland has added such a function to RoboFab, as a new marginPen object:<br>
      <a href="http://code.robofab.com/browser/trunk/Lib/robofab/pens/marginPen.py" title="http://code.robofab.com/browser/trunk/Lib/robofab/pens/marginPen.py">http://code.robofab.com/browser/trunk/Lib/robofab/pens/marginPen.py</a><br>
      and even an angledMarginPen:<br>
      <a href="http://code.robofab.com/browser/trunk/Lib/robofab/pens/angledMarginPen.py" title="http://code.robofab.com/browser/trunk/Lib/robofab/pens/angledMarginPen.py">http://code.robofab.com/browser/trunk/Lib/robofab/pens/angledMarginPen.py</a></p>
      <p>Karsten</p>
