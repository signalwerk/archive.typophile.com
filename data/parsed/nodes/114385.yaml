      <p>If you want a hand-drawn font, how about <a class="freelinking external" href="http://www.myfonts.com/fonts/fontforecast/chameleon/?refby=bowfin" rel="nofollow">Chameleon Basic</a>? In looking at script styles that was one of the most similar to your shape, I thought. Most J's with a loop on the left also have a lower loop, or a more curved tail, and I didn't see any that were completely straight below.</p>
      <p>I'm still not sure which style of font you are trying to find. A formal script? A casual handwriting font?  If you can be more specific about the style it might narrow the search.</p>
      <p>- Mike Yanega</p>
