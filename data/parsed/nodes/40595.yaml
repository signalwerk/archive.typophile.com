      <p>&gt;Is there any type of consensus </p>
      <p>The answer to that would be no--on almost every topic, including type. However, judging by revivals, the variations on Garamond seem to be the most numerous. Other names that have become classics or standards that are still used widely: Jenson, Griffo (Bembo), Caslon, Baskerville, Didot, Bodoni.</p>
