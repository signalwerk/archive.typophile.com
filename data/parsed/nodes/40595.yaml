    html: |-
      <p>If ‘luxury’ is something ostentatious, opulent and lavish; a disproportionate expense that is made just for fun &amp; pomp – then I don’t agree that TEFF &amp; DTL are luxurious. Well, their pricing is quite high and thus their fonts sometimes seem to be unattainable; but ‘expensive’ is not the same as ‘luxurious’, is it?</p>
      <p>Go to a Dutch bookstore and sift through a couple of books (or news papers!) … do you really think all of them that are set in Lexicon or Haarlemmer convey a touch of luxury?</p>
      <p>If you meant purchasing the TEFF library and then not using it (“only to look at”), then I have to agree; that would be very luxurious!</p>
