    html: <p>You can’t blame Adobe for using Illustrator in such a strange way. Illustrator isn’t based on pixels, so how should the pixel fonts be rendered in a good quality? You need an app that is based on a pixel grid and you need to set the view to 100% (1 pixel on the screens equals 1 pixel of your design).</p>
