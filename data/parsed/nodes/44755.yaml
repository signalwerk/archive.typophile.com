    html: "<p>You can save a little time by saving the effect as a graphic style, which is very simple to do: Select one of your already-rasterized text boxes and drag it to the graphic styles palette. This will create a blank white icon in the graphic styles palette. When you select a text box and click on the icon, the same rasterize effect settings will be applied. Since a blank white icon is not very identifiable, it helps to give it a name (double click on it) and set the graphic styles palette to one of the list views.</p>"
