    <p>Hello!</p>
    <p>Pixel fonts are blurry in all of the CS versions of Illustrator, even if placed at full x/y values. Seems like the only Illustrator versions that shows pixel fonts the crispy way are Illustrator 10 and below. (I wrote to Adobe about it last year [2007, or even 2006], and I still didn’t get an answer [surprise!].)</p>
    <p>Does anyone know the trick for crispy looking pixel fonts in any of the CS versions? I’d like to design my Websites in Illustrator CS... I’m done with 10!</p>
    <p>Thanks.</p>
