    <p>Hi all. After lurking for a while, I've decided to post an in-progress font for review and criticism. My intent for it is to be usable at body sizes, and I'd love to get the hints done well enough for it to be usable on-screen. It will be OpenType with TrueType contours.</p>
    <p>There are more glyphs created than I'm showing here, but this ought to be enough of a sample to get some feedback on. Please let me know if you need anything else from me.</p>
    <p>Thanks! I appreciate your help.</p>
    <p>Derek</p>
    <p><a href="http://www.fileden.com/files/2010/9/19/2973670/melodio_sample2.pdf" title="melodio_sample2.pdf" rel="nofollow"><br>
    	melodio_sample2.pdf<br>
    </a></p>
