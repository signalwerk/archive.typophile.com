    html: |-
      <p>Great design!</p>
      <p>P and smallcap P have a heavy spot at the bottom of the bowl, where it's more curved on the outside and more straight on the inside. Pick one.</p>
      <p>4 is light. S is a little light on top. Lowercase s is light all over and needs a lot of curve work.</p>
      <p>There is just a bit of a lump on the outer lower left of the bowl of g and q. There is also something wobbly about the parentheses that I can't quite put my finger on.</p>
      <p>By whatever accident, the right square bracket is heavier than the left one. Obvious when you look at it, but I know how easy it is to never look at your brackets again.</p>
      <p>Since you intend this for body use, your asterisk should default to a superscript form. But hold onto the big one as an alternate; some people will want it for something.</p>
    html_clean: |-
      <p>Great design!</p>
      <p>P and smallcap P have a heavy spot at the bottom of the bowl, where it's more curved on the outside and more straight on the inside. Pick one.</p>
      <p>4 is light. S is a little light on top. Lowercase s is light all over and needs a lot of curve work.</p>
      <p>There is just a bit of a lump on the outer lower left of the bowl of g and q. There is also something wobbly about the parentheses that I can't quite put my finger on.</p>
      <p>By whatever accident, the right square bracket is heavier than the left one. Obvious when you look at it, but I know how easy it is to never look at your brackets again.</p>
      <p>Since you intend this for body use, your asterisk should default to a superscript form. But hold onto the big one as an alternate; some people will want it for something.</p>
