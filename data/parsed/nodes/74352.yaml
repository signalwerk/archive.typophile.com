      <p>@cerulean: Thanks for the feedback! I see what you're talking about in each case. I'll get to those corrections. The large asterisk results from the years I've spent looking at fonts in Visual Studio -- I like a large asterisk. But I think your suggestion about making the superscript version the norm makes good sense. If I ever do a monospaced version for use in text editors, I'll make the full-height one the norm then.</p>
      <p>Derek</p>
