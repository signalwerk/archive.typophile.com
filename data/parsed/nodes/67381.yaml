    html: <p>Oh! I forgot to mention the 's.' I saw wut u did thar—with the slant on the outside of the serifs. I think it's a good link to the rest of the face (on a character that's generally hard to make unique in slab-serif fonts), but I think you should emphasize it a bit more.</p>
