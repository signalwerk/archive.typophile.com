    <p>Continuing from <a href="/node/14818/" class="link-kept">this discussion</a>, I am currently in the process of preparing <a href="/wiki/Jim%252BRimmer" class="wiki link-lost">Jim</a>’s <a href="/wiki/Cree%252BSyllabics" class="wiki-create link-lost">Cree Syllabics</a> font for release, but I am a bit unsure where to start. I believe that having a unicode standard opentype font is the way to go, but what else do i need to provide for someone to be able to actually access the Cree characters? a keyboard? some fancy scripts? In the small bit of research i’ve done thus far, it seems that several fonts for Cree follow a keyboard layout designed to work with <a href="http://www.creeculture.ca/e/language/creekeys_pro.html" class="link-external">CreeKeys</a>. Would it just be best to adapt the fonts to this model? Anyhow, if anyone can point me in the right direction on this one, I’d appreciate it. Thnx.</p>
