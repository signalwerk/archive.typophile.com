      <p>Paul, you can download standard Cree keyboard drivers for Windows and Mac here: <a href="http://www.carleton.ca/ecree/en/resources.html" title="http://www.carleton.ca/ecree/en/resources.html">http://www.carleton.ca/ecree/en/resources.html</a>. These packages come with BJCree UNI, a font containing a subset of Cree Unicode syllabics that I designed for Naskapi, East Cree and Swampy Cree. If you encode your font using standard unicode, users can type Cree using those keyboard drivers.</p>
      <p>I read Cree (Naskapi) syllabics. I will be interested in seeing your font in text.</p>
      <p>Also look at the LanguageGeek website, Chris Harvey has produced several other Unicode input methods (that is, keyboard layouts) that can also access syllabics that are encoded as Unicode.</p>
