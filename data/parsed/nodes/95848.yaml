    html: |-
      <p>The general style of the L can also be seen in <a class="freelinking external" href="http://www.identifont.com/samples/archive/SchoolText.gif" rel="nofollow">Archive School Text</a>,  <a class="freelinking external" href="http://www.identifont.com/samples/bitstream/Blackletter686.gif" rel="nofollow">Blackletter 686BT</a>, and some others. It hasn't been straightened. The general form of the i, n,  r, and v are quite common (but far from identical). Although the spur on the i's tittle (dot) is quite unusual. Also, the flourish on the n clearly exists only because it's the last letter in the word - it would be out of place elsewhere.  What can't be seen (at least by me) in any other blackletter font is the central dip in the top strokes of the a, s, and o. </p>
      <p> - Herb</p>
