    html: |-
      <p>Most likely a custom-made title for the magazine. It doesn't match any common blackletter font. It has some stylistic similarities to Letterhead Font's LHF Old Blackletter. The one PDF on the website includes the title only as outlines, while other text is in embedded fonts.  I'd bet that whoever designed it also created other alphabetic numbers for himself or herself!</p>
      <p>- Herb</p>
