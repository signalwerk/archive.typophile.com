    <p>laid off so I am doing a web site for a non profit Rape Crisis Center.</p>
    <p>I am trying to either morph the R into a graphic<br>
    use some type of creativity, I just feel a bit stuck now.</p>
    <p>I am looking for good resources on the web also..</p>
    <p>One of the problems is that this graphic has to be non gender<br>
    and a bit subdued too I would think...</p>
    <p>So far I have thought of rainbows, stairs, (hands may be not good so<br>
    I thought links, chain, rope, as if someone is not touching but holding<br>
    on )</p>
    <p>So the logo or graphic does not discriminate because this center<br>
    even sees kids.</p>
    <p>I am trying to come up w/ something non threatening.</p>
