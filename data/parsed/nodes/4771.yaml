    html: <p><i>The trouble I've got is that I the people who are going to appreciate the logo perhaps arent exactly type or design orientated</i> <br> <br>But these are the people you must reach! They may not be type oriented, but they are certainly Triumph oriented, yes? The trouble (opportunity) with the competion is that as far as I can tell their look does not connect with Triumph in any way. Before thinking about typeface, think about how you can make your product the *authentic* spirit of the original, not the flashy tripple gradient Rimmer Bros. <br> <br>Make the connection your goal. For example, I bet if you included a very (i mean very) subtle leaf cluster motif, a true enthusiast would instantly recognize it. That's probably not the answer, but seek out that swap-meet junkie appeal. Flip though old brochures, catalogues, ads, car club newsletters, racing ephemera etc. <br> <br>As for font, don't let this drive your concept. It may be a type-only solution in the end, but is it based on the chrome lettering from the 1956.... blah blah. <br> <br>Randy</p>
    html_clean: <p><i>The trouble I've got is that I the people who are going to appreciate the logo perhaps arent exactly type or design orientated</i> <br> <br>But these are the people you must reach! They may not be type oriented, but they are certainly Triumph oriented, yes? The trouble (opportunity) with the competion is that as far as I can tell their look does not connect with Triumph in any way. Before thinking about typeface, think about how you can make your product the *authentic* spirit of the original, not the flashy tripple gradient Rimmer Bros. <br> <br>Make the connection your goal. For example, I bet if you included a very (i mean very) subtle leaf cluster motif, a true enthusiast would instantly recognize it. That's probably not the answer, but seek out that swap-meet junkie appeal. Flip though old brochures, catalogues, ads, car club newsletters, racing ephemera etc. <br> <br>As for font, don't let this drive your concept. It may be a type-only solution in the end, but is it based on the chrome lettering from the 1956.... blah blah. <br> <br>Randy</p>
