  html: "<p>I need some help, I'm lost... <br> <br>I'm doing a new logo for a classic car spare parts company - Canley (or Canley Classics - yet to be decided) - also does servicing and work on cars too. They're alot more than just that though - they invest a lot of money in my favourite marque of car (Triumph) - developing various products and making new parts. There is a really big feel good factor about buying from them - they are one of the few good guys - everywhere seems rather money grabbing. Passionate is the word. <br> <br> <br>A few of their competitors logos: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/35905.gif\" alt=\"Rimmer Bros\"> <br><img src=\"http://www.typophile.com/forums/messages/4100/35906.gif\" alt=\"Moss\"> <br><img src=\"http://www.typophile.com/forums/messages/4100/35907.jpg\" alt=\"JP\"> <br> <br> <br>The trouble I've got is that I the people who are going to appreciate the logo perhaps arent exactly type or design orientated - which I know is normal for most jobs - but Im having a real problem trying to \"place\" the logo and being happy with it. <br> <br>I almost need to walk away from this job and come back - but I don't have time. I need some fresh thinking. <br> <br>I've been looking at typefaces - and with lots I think \"that would look really nice and would give the right feel\" - but I then get paranoid thinking that the type isnt going to be suitable - but whats suitable anyway? There are no set rules with what Im working with - and I don't have much to compare with in their market place - as most of them either arent really \"designed\" or are just really after thoughts... <br> <br>Ramble over... confused... <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> <br> <br>I thought this would be fun - working with something I love - but perhaps Im just too close to it... strange... <br> <br>How do you guys cope with this? Any advice? <br> <br> <br> <br>James <br></p>"
  html_clean: "<p>I need some help, I'm lost... <br> <br>I'm doing a new logo for a classic car spare parts company - Canley (or Canley Classics - yet to be decided) - also does servicing and work on cars too. They're alot more than just that though - they invest a lot of money in my favourite marque of car (Triumph) - developing various products and making new parts. There is a really big feel good factor about buying from them - they are one of the few good guys - everywhere seems rather money grabbing. Passionate is the word. <br> <br> <br>A few of their competitors logos: <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/35905.gif\" alt=\"Rimmer Bros\"> <br><img src=\"http://www.typophile.com/forums/messages/4100/35906.gif\" alt=\"Moss\"> <br><img src=\"http://www.typophile.com/forums/messages/4100/35907.jpg\" alt=\"JP\"> <br> <br> <br>The trouble I've got is that I the people who are going to appreciate the logo perhaps arent exactly type or design orientated - which I know is normal for most jobs - but Im having a real problem trying to \"place\" the logo and being happy with it. <br> <br>I almost need to walk away from this job and come back - but I don't have time. I need some fresh thinking. <br> <br>I've been looking at typefaces - and with lots I think \"that would look really nice and would give the right feel\" - but I then get paranoid thinking that the type isnt going to be suitable - but whats suitable anyway? There are no set rules with what Im working with - and I don't have much to compare with in their market place - as most of them either arent really \"designed\" or are just really after thoughts... <br> <br>Ramble over... confused... <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\"> <br> <br>I thought this would be fun - working with something I love - but perhaps Im just too close to it... strange... <br> <br>How do you guys cope with this? Any advice? <br> <br> <br> <br>James <br></p>"
