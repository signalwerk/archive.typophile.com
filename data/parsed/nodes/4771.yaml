    html: "<p>Thanks for the advice Randy. Feel a bit silly now... the trouble is the people Im trying to reach I know too well (does that make sense?) and I'm one of them... so what seems easy is actually a bit difficult... am I making sense? <br> <br>Im trying to get it as authentic - and thats what I've been looking at - mainly 60s/70s typefaces - old logos of that period. <br> <br>I have two things to do: a logo for them - which I think will be mainly type based - and also a \"competition logo\" which will be for their \"go-faster\" race products they do - and will be cast on to products - and also be on the racing cars they sponsor... <br> <br><img src=\"http://www.typophile.com/forums/messages/4100/35910.jpg\" alt=\"canleygogo\"> <br> <br>(a very rough!) <br> <br>Currently working around the original Triumph logo - and making it look a bit more up to date and motorsport-alike... <br> <br>The original design: <br> <br><a href=\"http://web.brandsoftheworld.com/?id=112&amp;query_id=5479176&amp;page=1&amp;brand_id=3449\" target=\"_blank\">http://web.brandsoftheworld.com/?id=112&amp;query_id=5479176&amp;page=1&amp;brand_id=3449</a> <br> <br>...is actually based on a pair of wings... so thats what Im working on... <br> <br> <br> <br>James <br></p>"
