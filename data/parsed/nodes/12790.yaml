      <p>Using fonts in graphics or in Flash files on the web gives you a lot of typographic control. For regular searchable and selectable text you’ll want to make a stylesheet rule that specifies fonts that may be on the users computer. Because you can’t know this in advance then you need to guess so if you want some nice sans-serif you go:</p>
      <p>font-family: Verdana, Tahoma, sans-serif; </p>
      <p>Essentially the rule of thumb is to familiarize yourself with Microsoft’s core web fonts (Favourites seem to be Verdana and Georgia.) which are installed on Windows and any Mac with Internet Explorer and also other popular fonts on other platforms with something like <a href="http://www.codestyle.org/css/font-family/index.shtml">this</a>.</p>
      <p>In this respect you need to be flexible. Make your font selection list a set of choices from most preferred to least. Users don’t all have the same fonts as you. My <a href="http://homepage.mac.com/jon_whipple/">website</a> specifies <a href="http://www.processtypefoundry.com/typefaces/locator/inuse.html">Locator</a> (by fellow Typophile Eric Olson), which there is a good chance in the grand scheme of things that you don’t own. So just in case I also specified Verdana, and Trebuchet and if those aren’t available use whatever sans-serif the browser knows about. It’s in my stylesheet <a href="http://homepage.mac.com/jon_whipple/xen.css">here</a>. </p>
      <p>Also in addition to font suggestions that Hrant and Dan suggested, experiment with the anti-alias settings for text in your image editing program. In many cases the default isn’t the best choice for clarity and there is a better choice, and chances are the auto anti aliasing can’t match the human touch in the custom greyscale bitmap fonts.</p>
      <p>I hope any of this is useful...</p>
      <p>Jon</p>
