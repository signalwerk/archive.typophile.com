      <p>The Ultrafonts stuff works in Photoshop too (with the same advantages*). As for a free trial, Unibody is great, but it’s not grayscale; I think Ultrafonts still offers a freebie (although I think it might not be as “pushy” of the technology as something like Mana).</p>
      <p>* Including one I just realized recently: in a composition that has both small and large text (i.e. most compositions), the latter is almost guaranteed to be anti-aliased, and when the former is also anti-aliased you get a more harmonious page; next to large anti-aliased text, 1-bit text seems <strong>too</strong> crisp to me (I mean aesthetically, ignoring its additional functional drawback).</p>
      <p>hhp</p>
