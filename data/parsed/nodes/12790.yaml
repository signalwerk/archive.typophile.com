      <p>Johanna, Frutiger 55 is just fine when creating .jpg, .gif, and .png graphics in Photoshop/Fireworks/etc. for “text-as-image” use on websites. Years ago, when I was doing more web design, I used a lot of Frutiger (although I tended more toward Frutiger 65 Bold, all caps, lots of space…).</p>
      <p>If you are building a website in Flash, you may be better off using the sort of fonts that Hrant is talking about for your text. If you haven’t used any pixel fonts before, you can try out Unibody first (free download from Underware). If you don’t like it, or want something more exclusive, take a look at Hrant’s work (mentioned above).</p>
      <p>__<br>
      <a href="http://www.typeoff.de" title="www.typeoff.de">www.typeoff.de</a></p>
