      <p>Are your friends the target audience? If so, you may need to give their opinion some weight.</p>
      <p>Otherwise, use your best judgment and taste. I happen to think Aspect is beautiful in its simplicity. I wouldn't use it for a punk zine -- or maybe that would be a really cool, unexpected approach!</p>
