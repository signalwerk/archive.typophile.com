    <p>Anyone know what the Chinese equivalent of Times New Roman or Arial would be?</p>
    <p>Normally when I design, I copy and paste content from my client's ms word doc that they typed on their PC into my design projects on my mac. Or, I flow it in. This works perfect.</p>
    <p>Now, I need to copy content that is traditional Chinese typed on PCs  and paste it into my projects (inDesign or ms word) on my mac. I do not speak or read Chinese.</p>
    <p>I have lots of adobe and other fonts, but I believe I need the Chinese equivalent of Times New Roman or Arial that would be come standard on PCs sold to Chinese people.</p>
