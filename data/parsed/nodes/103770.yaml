    votes: null
    html: |-
      <p>Here is what I found in the mac fallback file DefaultFontFallbacks.plist (comments from 10.6 and 10.7; the 10.8 file is a binary):</p>
      <p>sans-serif:  "for Traditional Chinese, use STHeiti TC"<br>
      serif:       "for Traditional Chinese, use LiSong Pro"<br>
      cursive:     "for Traditional Chinese, use BiauKai"</p>
      <p>Those appear to be the default choices when Traditional Chinese is put before Korean, Japanese and Simplified Chinese in the System Preferences, Language &amp; Text (I checked in Safari and TextEdit)</p>
      <p>There is also another file, NSFontFallbacks.plist, with the following entries (PostScript names) for Traditional Chinese:</p>
      <p>sans-serif:  LiHeiPro<br>
      serif:       LiSongPro</p>
