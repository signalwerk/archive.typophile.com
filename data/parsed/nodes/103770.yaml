    html: |-
      <p>The OS comes with fonts;  the problem is to choose. For the fonts on the Mac, here is a list on Yales' site <a href="http://www.yale.edu/chinesemac/pages/osx7.html#fonts" title="http://www.yale.edu/chinesemac/pages/osx7.html#fonts">http://www.yale.edu/chinesemac/pages/osx7.html#fonts</a></p>
      <p>The extesions TC means traditional Chinese and so I guess that Heiti TC would be suitable (I am no expert). I also understand from the list of characters sets <a href="http://www.yale.edu/chinesemac/pages/character_sets.html" title="http://www.yale.edu/chinesemac/pages/character_sets.html">http://www.yale.edu/chinesemac/pages/character_sets.html</a> that Big-5 corresponds to Traditional Chineses and thus LiHei 儷黑 Pro and LiSong 儷宋 Pro as well as Apple LiGothic, Apple LiSung, and BiauKai should fit the bill but I would double check.</p>
