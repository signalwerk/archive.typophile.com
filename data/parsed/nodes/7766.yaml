  html: <p>i am currently doing an identity system for a school project, and I am looking for a nice text face that works with a technology company. This will be used to write the letter on the letterhead. I also need a typeface to be paired with this that will be used for the secondary info on the letterhead (and business cards/envelopes) that will be used for the address etc. The company specialized in digital imaging, with an emphasis on scanning.  <br> <br>I am open to both serif and sans serif faces. I have a few in mind, but would like some ideas to explore some faces I may not know about.  <br> <br>Thanks so much.</p>
