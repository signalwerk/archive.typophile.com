    html: <p>oh and by the way, of the type i currently have, i am looking at scala sans, dax, and faceflate sans as the type to set the business cards and address etc on the letterhead/envelope. As the logo uses a handdrawn sans serif, I am thinking the body of the the actual letter on the letterhead should be a serif face for contrast, although my teacher said a sans serif would be more "technology." What do you all think?</p>
