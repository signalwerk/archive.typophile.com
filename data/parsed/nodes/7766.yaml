    html: "<p>Make the idenity of the letter and collateral technology looking. Leave the body of the letter to  convey information.  <br> <br>As an example: Think of Technology ID as Chocolate Ice Cream, now if you just add more Chocolate Ice Cream (the body of the letter) you wouldn't have any contrast or flavor. Make the body of the letter a Vanilla Cookie and now you have contrast in color, texture and flavor.</p>"
