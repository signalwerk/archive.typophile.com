    <p>Hello Everybody.<br>
    My name is Javier Rosa, I am from Barcelona. I am both a graphic design professional and student. Currently I am working on my final degree project.<br>
    A week ago I've sent emails asking some information for that project to relevant people in the script typography field. One of this relevant persons, Bas Jacobs, suggested me to post a message in this board, and I thought it was a good idea, so here am I asking for your help.<br>
    This project is a theoretical one, developed in basis of a hypothesis. I personally have decided to focus the paper on script typography. The starting point of the work is the hypothesis below:<br><em>Studying the process used in designing text typefaces and the knowledge in legibility it is possible to develop a new design process for script typefaces that, if applied, would originate better script typefaces for large text use.</em><br>
    The main subjects in the body of my paper are script typeface history, legibility / readability, and the differences in design processes between sans serif/serif and script typefaces.<br>
    I have found a few sources that reflect the basic process of designing typefaces, but I have not  found many resources related to script typefaces. So, here are the issues I need to deepen:</p>
    <p><strong>Sketching:</strong><br>
    Given that the simulation of calligraphy and handwriting is the main treat for considering a typeface as script, I would like to know:<br>
    -How important is the use of specific writing tools such as pen nibs, pencils or brushes?</p>
    <p><strong>Tracing glyphs:</strong><br>
    -Should we draw the entire character set in paper before digitalizing it? Or, it is possible to work with modules, sketching just the few that contain the main treats at first, tracing them, and then developing the rest of the characters in the set with pieces and strokes of the firsts?</p>
    <p><strong>Optical corrections:</strong><br>
    I know that there are some issues in diagonal crossing paths that look unaligned, which makes necessary to correct these intersections by using the eye as the main tool.<br>
    - Is there any other specific optical adjustment in script typefaces?</p>
    <p><strong>Letter spacing &amp; letter connections:</strong><br>
    This is a key point. Laura Worthington has made a webinar (some kind of workshop via videoconference) in collaboration with the FontLab web. There, Laura explains a method for making seamless connections between letters. In short, in this method she traces a master character, which is a copperplate "r", whose entrance and exit strokes coincide seamlessly when placed consecutively.<br>
    In the next step she attaches the entrance and the exit of the master letter to the rest of the characters of the set that need it.<br>
    I think that this method does not take into account the rhythm needed for legibility, because of the fact that the letter spacing is determined just by the entrance and exit strokes previously created for the letter "r".<br>
    - Is there any other method that takes into account the rhythm in connected scripts?</p>
    <p><strong>A selection of high legibility scripts:</strong><br>
    Besides the process behind the designing of script typefaces I've got another question related to the same research. In the next step of my paper I'm going to analyze a number of different script typefaces, chosen by its good legibility, comparing its properties with legibility facts such as glyph differentiation, consistence in the forms of the typographic set, contrast, inclination, letter spacing, opening of the counters and so on.<br>
    It would be very useful if you suggest me script typefaces that stands out by its legibility.<br>
    I've pre-selected a few which include Bickham Script by Richard Lipton, Supernova by Martina Flor, and Savoye by Alan Meeks.<br>
    But anyway, my opinion is not too relevant in this field, it is by far more rigorous if some professional specialized in script typography provide me some better examples in order to reference it on my project.</p>
    <p>I will be very grateful if you could answer my questions. Otherwise, if you cannot answer them, I would like you to provide me with names of professionals who could help me  with this task.</p>
    <p>Thanks for giving me a portion of your time.<br>
    Javier Rosa</p>
