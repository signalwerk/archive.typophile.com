      <p>Hello Les ONeill, I agreed. This is how my project starts.<br>
      Based on the opinions of diverse typographers and the Vox-ATypI definition, I conclude that the main treat of the script typefaces is its cursive or italic structure. Besides that, there are a number of aspects that can reinforce its handwritten appearance, such as connecting letters, inclination, variations on the letterforms and texture. This optional features, as said, reinforce its handmade look, but often goes in detriment of legibility.</p>
