      <p>Hi Nick<br>
      Handsome looks very readable, it is a very good example to start comparing.</p>
      <p>Sanvito, although it is very readable, poses a new problem. This is a script typeface? I mean, is based on the Carolingian calligraphy and therefore, by definition, it is a script. However, in my opinion, the fact that does not resemble traditional cursive handwriting may cause to not look like it is handcrafted to most mortals.<br>
      It seems that it is a dillema between polised - readable and organic-handmade look, so if we want a very readable script typeface it will end up in most of the cases in a not-so-handmade-look typeface. I'm I right?</p>
