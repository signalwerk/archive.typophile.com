      <p>I conceived of <a href="http://shinntype.com/typefaces/handsome/">Handsome</a> with text font functionality.<br>
      For this reason, it has a large x-height and relatively short capitals and descenders for a handwriting typeface, enabling close leading.<br>
      It also has a variety of weights and styles, better enabling typographic layouts.</p>
      <p>When I produced the Pro version, I used the Contextual Alternates feature to:<br>
      • employ the traditional “joining rules” of connected, cursive writing<br>
      • avoid duplicate double-letters, for organic comfort<br>
      • remove entry and exit strokes at the beginning and end of words, to create more discrete word spaces, which, in my opinion, produce smoother reading.</p>
      <p>It is not as polished a face as, say, Sanvito (the original OpenType script typeface), as I wanted to give it a lively and casual quality, and “wrote” it in Fontographer using a Wacom tablet and stylus, which lacks the feel and control of writing with pen on paper. But I don’t think that has much bearing on legibility.</p>
