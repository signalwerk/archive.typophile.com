    html: <p>I'd start by moving the 'C' and 'O' a little nearer the M, as you've got round meeting flat on the left of the 'M' and flat meeting flat on it's right. This means the 'O' has to cosy up nearer than the 'L' in order to look right. Then, based on that, you'll be able to see whether your 'C' and 'O' need adjustment.</p>
