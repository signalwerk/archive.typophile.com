      <p>There is a very well-put review of Ari Rafaeli's book by Robin Kinross for Eye magazine at<br>
      <a href="http://www.eyemagazine.com/review.php?id=126&amp;rid=606" title="http://www.eyemagazine.com/review.php?id=126&amp;rid=606">http://www.eyemagazine.com/review.php?id=126&amp;rid=606</a></p>
      <p>Last year at some point I borrowed a copy from my University library and read it; of the other titles you mention I know only 'Designing Books' by Jost Hochuli, but I suspect that they all might provide a bigger, and perhaps more balanced picture than 'Book Typography'.</p>
