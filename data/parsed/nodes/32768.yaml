    <p>Hello typophiles,</p>
    <p>I came across these two books the other day: <a href="http://www.amazon.com/Design-abrams-studio-Andrew-Haslam/dp/0810992205/ref=sr_11_1/002-3174691-4066419?ie=UTF8&amp;qid=1175554855&amp;sr=11-1" rel="nofollow">Book Design</a> by Andrew Haslam and <a href="http://www.oakknoll.com/detail.php?d_booknr=79445" rel="nofollow">Book Typography</a> by Ari Rafaeli.</p>
    <p>I was wondering if any of you have read them and, if you did, what do you think of them?</p>
    <p>I already own Book Design by Hendel, Designing Books by Hochuli and Notes on Book Design by Birdsall, do these two books bring any new information worth the purchase?</p>
