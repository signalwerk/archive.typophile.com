    date: 2008-03-07T18:28:00
    votes: null
    html: |-
      <p>I think your teacher is a bit in the weeds with their web reference. The CSS Specification does include a "<a href="http://www.w3.org/TR/REC-CSS2/fonts.html#generic-font-families" rel="nofollow">font-family</a>" property with generic values of serif, sans-serif, cursive, fantasy and monospace. But font-family and type family (aka. typeface family or font family) are not nearly the same and has little to do with typography.</p>
      <p>And I've never seen anyone use the cursive or fantasy values.</p>
