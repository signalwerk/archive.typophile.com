    html: |-
      <p>In her response to your e-mail, she throws in classification, which doesn't have much to do with what constitutes a family. Apples and oranges. And as you suspect, she's not really answering your question.</p>
      <p>Even her first sentence, in which she does try to address your question (<em>A type family doesn’t just include the typeface (ie Times) but also includes the type style within that typeface (ie Times italics, Times bold etc)</em>) is worded in a confusing way.</p>
      <p>The thing about the test question is that it's a little tricky -- if you answer "False" to the second part of the question, you are also saying that the first part is false! But you aren't allowed to explain that difference in your answer...</p>
