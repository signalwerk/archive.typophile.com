      <p>I emailed her again to ask for further clarification, and she sent me the following in an email reply:  </p>
      <p>"Font family is the different styles within one font (ie. Times italics, Times bold etc). Type family really depends on how you want to group the type. For example, I want to have a group (or family) of san serif type, so that can be Georgia, Verdana and Arial. Type family has a larger definition."</p>
      <p>I also researched this before writing to her, and every publication I came across says the correct answer is false.  It sucks because I lose ten points now, on my quiz as a result of this question...but I don't want her to feel as if I'm somehow being pushy (even though I should be, as this is not the grade that I deserve).  </p>
      <p>I'll just make a mental note of what the correct answer really is.  Although, I'm pretty sure I'll never forget this one...  Thanks everyone.  :0(</p>
