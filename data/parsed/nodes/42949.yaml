    <p>Hi everyone,</p>
    <p>I have a question regarding a typography quiz that I recently took for my class:  </p>
    <p>5) A type family is the complete range of variations of a typeface design, including roman, italic and bold. A type family is also used to describe the 5 basic font families (sans serif, serif, cursive, monospace, and fantasy) that are used to define fonts on the Web.</p>
    <p>I answered this as false, but the professor says it's actually true.  Can someone please explain this to me?  I'm a bit confused with this one...</p>
    <p>Many thanks in advance,<br>
    PG</p>
