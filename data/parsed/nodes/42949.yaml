    votes: null
    html: "<p>Though relatively uncommon, type families occasionally include complementing sans and serif faces. Sounds to me like your teacher was hoping to throw everyone off by including words such as cursive and fantasy. The trouble is the wording: <cite>A type family is also used to describe...</cite> It's not commonly used to describe collections of cohesive yet widely varying typefaces, much less groupings of serif faces such as Times and Georgia.</p>"
