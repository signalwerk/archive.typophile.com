    html: |-
      <p>This is the response that she wrote to me in her email reply, when I asked her why she believed the answer to the question was true:  </p>
      <p>"A type family doesn't just include the typeface (ie Times) but also includes the type style within that typeface (ie Times italics, Times bold etc). A type family can also be classified as a san serif type family (ie. Arial, Verdana etc) or a serif type family (ie. Times, Georgia etc). They are groupings of some commonality, depending on its criteria." </p>
      <p>I don't understand how her email reply proves that the answer to the question is "true".  :0/</p>
      <p>HELP!  :0(</p>
