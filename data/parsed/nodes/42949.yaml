      <p>Ken has it exactly. The second sentence of your prof's question is regarding web fonts, and is an accurate definition of the CSS property "font-family" which is NOT the same as type family.</p>
      <p>So your response, "false," is correct.</p>
      <p>(And I could reasonably be cited as an expert on font terminology in general and web fonts in particular.)</p>
