    html: |-
      <p>Carter&amp;Cone has been "working on our website" for like ten or more years. What better way to advertise the awesomeness of a brand than to have a website which more or less says "we're too good for a website".</p>
      <p>Back on topic, I liscenced BT Fleischman this year and really like it for larger sizes. It is one of the most pleasant-to-read faces I have used and its details are pleasantly outrageous. It is also a very good value. That being said, its long descenders and light colour make it ill-suited for use at small point sizes. As such couldn't really be considered an alternative to Mercury, despite their common roots.</p>
