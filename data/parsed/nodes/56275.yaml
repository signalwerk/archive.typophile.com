    html: |-
      <p><cite> &gt; As far as I know (and searched) it isn’t available at the time.</cite></p>
      <p>Not for retail license and online download. One would have to contact Cherie Cone directly and see what the availability is. I believe that Font Bureau is able to offer Fenway through their Studio Library, which is geared toward publications and requires a minimum number of licenses. Perhaps not practical for the original poster.</p>
      <p>Plus, Fenway has only hybrid numerals, which may or may not fit the OP's criteria. They're not strictly lining, but they're not oldstyle either, and some people find them too unusual as a result. (That was the case with the Georgia hybrid numerals, anyway, which is why later versions opted for more traditional oldstyle proportions.)</p>
