  html: |-
    <p>Hey guys, making an old logo vector. Was just hoping for a little verification on weights and possibly even fonts if I'm off. </p>
    <p>Trinity Community appears to be Adobe Garamond Pro with small caps. I'm not positive on the weight though. Nothing seems to be right on and I'm assuming that's just because I haven't begun the squashing process as it looks like both fonts have been squashed flat.</p>
    <p>I believe Ministries is just Futura extra bold with the same squashing as Trinity which is why letters may be a bit off. </p>
    <p>Any other ideas out there?</p>
