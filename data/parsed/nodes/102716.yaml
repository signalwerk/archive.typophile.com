  html: |-
    <p>Hi guys,<br>
    I am doing a Literary Magazine, most probably with Lyon Text Font.<br>
    <a href="http://commercialtype.com/typefaces/lyon/lyon_text" title="http://commercialtype.com/typefaces/lyon/lyon_text">http://commercialtype.com/typefaces/lyon/lyon_text</a></p>
    <p>Lyon will be used for Body Text.<br>
    Can you suggest which font can be used with? for headlines, subheads, notes, etc.</p>
    <p>Thanks and Best,<br>
    S</p>
