    date_raw: 2 May 2013 — 4:51pm
    votes: null
    html: <p>Lyon text has a high x height and short descenders and is a modern interpretation of a French oldstyle font. I would think either Whitney or Caspari would work well with this. Of the two, Caspari looks like a better match. The lower case "g" in Lyon text is hard to match.</p>
