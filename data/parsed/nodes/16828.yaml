      <p>I too would like some additional glyphs to see - but I can say that the heavy weight needs to be adjusted to maintain legibility. Take a look at Univers in diffeent weights - see how the counters don't disappear? And take a looks at :</p>
      <p><a href="http://www.typofonderie.com/alphabets/view/CostaPTF" title="http://www.typofonderie.com/alphabets/view/CostaPTF">http://www.typofonderie.com/alphabets/view/CostaPTF</a></p>
      <p>He does it slightlty differnetly but the idea is the same.</p>
      <p>Both examples maintain legibility in heavy weights a way that your face won't right now. See why?</p>
