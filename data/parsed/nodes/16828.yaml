    <p>Hello, this is my first post here, and my first attempt at a full typeface I can use for my own 'image'.  I started by taking Myriad Pro, and using FontLab tranformations to round the corners.  I soon realised this wasnt enough for the look I needed, so taking some basic inspiration, I began drawing some characters and playing around to get the look right.  </p>
    <p>Unfortunatly I am not very experienced with font design, I have a few books, and I have looked at many custom made fonts, to get a feel for characters and proportions.  Anyway, I thought I would register and post some samples.  I would ideally like to find a font professional who could take my glyphs and make it all work, but I have little cash, and would ideally like to learn it for myself.</p>
    <p>This may upset some people, but I design my glyphs to a grid in Corel Draw, the shapes just seem more solid to me rather than FontLab itself or of course Illustrator.  I have trouble getting the glyphs I perfect in Corel to import perfect in FontLab or FontLab Studio, but for now, I would like some advice, criticism, or even some harsh words said to me, about my designs so far.</p>
    <p>Attached is a PDF of the letter shapes I have drawn to demonstrate the look I want, as well as a gif for those who dislike PDF, I have also posted an example of the first version, the Edited Myriad I used for my personal logotype...</p>
