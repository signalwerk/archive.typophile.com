      <p>You say "my own image" but you don't say what that is. I think you have to define the target before you can see how good your aim is.  Also, if this is your own image, why start with an existing typeface particularly one that is so often used that you will not give yourself an identity other than a "just one of the crowd" kind? The point of a custom identity font is that it be unique enough to the entity it represents to establish identity. It is kind of like choosing the name "Store" as a brand name, it says nothing about you and is so common it will be ignored.<br>
      Instead of looking for a model to start with like Myriad.  Start from scratch and make it you.  I know, it is a lot more work--but so is making a good apple pie from scratch more work than getting one out of a vending machine.</p>
      <p>ChrisL</p>
