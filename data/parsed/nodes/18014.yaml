  html: |-
    <p>BAK&nbsp;is open to&nbsp;every&nbsp;artists or artist nominees. (Just to remind; we're reviewing&nbsp;the&nbsp;submissions before publishing. We received over 300 works this&nbsp;month and had to eliminate more than half of it.)<br>
    &nbsp;<br>
    You've asked what our philosophy is.</p>
    <p>Yes, we're considering a theme&nbsp;for each issue and announcing it on&nbsp;our web site. While people are&nbsp;sending their submissions about<br>
    the&nbsp;theme, I'm contacting respected&nbsp;artists and working on the interviews&nbsp;till the submission deadline.&nbsp;&nbsp;If I think needed, I write some articles about the subject, then&nbsp;compile&nbsp;them all and publish.&nbsp; This is the process.</p>
    <p>Ozan Karakoç<br>
    <a href="http://www.bakdergisi.com" title="www.bakdergisi.com">www.bakdergisi.com</a><br>
    www.bakmagazine.com&nbsp;</p>
