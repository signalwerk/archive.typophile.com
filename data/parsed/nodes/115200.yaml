      <p>All /E bars have different length...<br>
      It looks like an <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=ITC&amp;ffam=Blair%20ITC%20Medium%20-%20Regular&amp;fid=fbf9ba458f381e818b658265153ba5a3&amp;fsize=60&amp;text=VERVE&amp;fit=1" rel="nofollow">ITC Blair Medium</a></strong> with a modified /V (to make it pointy and that's probably why it extends bellow baseline)</p>
      <p>PS: I see Ryuk also agrees on Blair</p>
