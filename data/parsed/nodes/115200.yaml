    html: <p>As I don't know any font with /V point "so far below baseline", I'd probably start with one among <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/" rel="nofollow">Sackers Gothic</a> (and may be more <strong>Blair</strong> for this one) and customize /V.</p>
    html_clean: <p>As I don't know any font with /V point "so far below baseline", I'd probably start with one among <a class="freelinking external" href="http://www.myfonts.com/search/engravers+gothic/" rel="nofollow">Engravers Gothic</a>/<a class="freelinking external" href="http://www.myfonts.com/search/blair/" rel="nofollow">Blair</a>/<a class="freelinking external" href="http://www.myfonts.com/search/sackers+gothic/" rel="nofollow">Sackers Gothic</a> (and may be more <strong>Blair</strong> for this one) and customize /V.</p>
