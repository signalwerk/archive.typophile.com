      <p>the british library is a lovely place. as is the british museum, which contains some fascinating typographic relics in the form of hieroglyphics and various other type related artifacts (coins, etc...)</p>
      <p>also the type museum in stockwell but i'm not sure if thats reopened yet.</p>
