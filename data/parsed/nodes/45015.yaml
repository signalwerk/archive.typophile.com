      <p>First off, I'm not a type designer, so take what you will from my comments.</p>
      <p>That said, I find the pointy M and N don't match the flat A, V, and W. They look like they are from different typefaces.</p>
      <p>It's weird, but as I read left to right, it seems like the letters have different influences from other typefaces. I see a little Gotham next to some Avant Garde, then some DIN.</p>
      <p>The "g" looks like it has an underbite.</p>
      <p>David</p>
