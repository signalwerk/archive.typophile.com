    <p>I recently finished both upper and lowercase letter forms for a new geometric sans-serif I'm working on. Similar to Gotham &amp; Futura.</p>
    <p>I've included two alternate character ideas on the third line. I kind of like that Univers inspired Q, wasn't as fond of the R (it was just the first one I made), I think I might just delete it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/handgloves_3958.jpg"></div><p></p>
    <p>I intend to complete punctuation marks, some common ligatures where they may be needed, then different weights</p>
    <p>Looking for tweaks to be made, specifically on some of the lowercase letterforms.</p>
    <p><a href="http://i29.tinypic.com/21j4qvp.jpg" rel="nofollow">view full size</a></p>
