  html: <p>Fancy yourself a type designer? Great we would love to see your stuff.  <br> <br>Eleven year old typefoundry Lunchbox studios announces the NEW Lunchbox Fonts foundry seeks to promote both the newest in typeface design as well as the designers who create them. Lunchbox Fonts V.2.0  represents the unique opportunity for up and coming typeface designers to be one of a small group of designers rather than being buried in a larger distributors and at the same time gain instant worldwide recognition through an 11 year old distribution base and long established brand.  <br>___________________________________________ <br> <br>Visit Lunchbox fonts at <a href="http://www.lunchboxfonts.com" target="_top">http://www.lunchboxfonts.com</a></p>
