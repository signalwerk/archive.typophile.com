    <p><a href="http://processtypefoundry.com/fonts/capucine/" rel="nofollow"><img src="http://processtypefoundry.com/images/press-news/2010/11/capucine.png" title="Capucine Font Family" width="585" height="307"></a></p>
    <p>More than four years in the making, the <a href="http://processtypefoundry.com/" rel="nofollow">Process Type Foundry</a> is proud to finally announce the release of <a href="http://processtypefoundry.com/fonts/capucine/" rel="nofollow">Capucine</a>, a new family of types designed by <a href="http://processtypefoundry.com/about/biographies#aliceSavoie" rel="nofollow">Alice Savoie</a>. With influences ranging from calligraphy to Art Nouveau to brush scripts, this five-weight family offers – to put it in a single phrase – <em>joie de vivre</em>.  <a href="http://processtypefoundry.com/fonts/capucine/" rel="nofollow">See more of Capucine</a> and learn all the details about our latest release.</p>
