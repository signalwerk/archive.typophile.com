    html: <p>I know Dan X. Solo personally. He ran a typographic studio in Berkeley for over 30 years. He had a large collection of film fonts, including some of my own. He created thousands of fonts and is now retired and is an  avocational prestigitator. Copyrights have run out on most of his fonts. He also protected himself by creating pseudonyms on the questionable font names.</p>
