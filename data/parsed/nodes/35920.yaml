    html: |-
      <p>Hi Russ,</p>
      <p>It was by the request of a client that led me to contact Dan Solo as to the origins of a particular font he featured in one of his Dover books called Kingston Script which he revealed to me it was in fact an original design of the Filmotype company.</p>
      <p>After learning of this, I spent many years researching the company, its legal status, and any living heirs to the collection to determing if there was a proper manner to acquire rights and redigitize this library of amazing fonts. I was successful in my endeavor and have been busy working on a digital revival of the library.</p>
      <p>Most of the 'gems' of his collection IMHO are in fact Filmotype fonts and I intend to get a larger showing of them available to share with the group for ID purposes.</p>
      <p>Best,<br>
      Stuart :D</p>
