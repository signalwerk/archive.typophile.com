      <p>I've been searching for this topic... I have questions about Dan Solo's copyrights as well. I guess I am a tad late to the game.</p>
      <p>I found a font in one of his books that I want to use, but there isn't a digital equivalent available. Knowing that he "found" the fonts from various sources throughout the world*, I wonder about the copyright issues with the typefaces in his books - can I recreate a font from these books? Most of the fonts have no know provenance nor does Dan Solo give any credit to any of the fonts. I know some of the fonts are in fact reproductions of other differently named fonts but there are a few that I cannot find information on anywhere.</p>
      <p>What are the legal issues involved with recreating/reviving fonts in the Dan Solo Dover books? I plan on digitizing a font and tweaking/adding other missing characters once I can figure out the copyright issues.</p>
      <p>Thanks!<br>
      Dalton</p>
      <p>*not discounting his hard work at creating a library of fonts, but his books seem to come across as a inspiration for making fonts and the whole copyright issue seem hazy if he didn't create these fonts.</p>
