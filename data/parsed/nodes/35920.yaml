    <p>Over the years I've spent many hours reviewing the contents of <a href="/web/20150123050241/http://typophile.com/wiki/Dan%20X.%20Solo" class="freelinking" rel="nofollow">Dan Solo</a>'s font catalog, as well as some of the alphabet books he published through Dover. As I've surfed the net to find out more about his fabulous collection of typefaces, it seems that people sometimes refer to the typefaces as "his". This has spawned some questions in my mind about what rights, if any, has he acquired along with his collection of 4000+ typefaces.</p>
    <p>The Dover books contain several typefaces I'd like to use. Some of them are available as fonts, but some are not. Perhaps I just don't know how to find them. Anyway, according to the back covers of the alphabet books, the alphabets are copyright-free. What is the accepted practice when it comes to digitizing the alphabets in those books, using them as fonts, and perhaps selling them?</p>
  html_clean: |-
    <p>Over the years I've spent many hours reviewing the contents of <a href="/web/20150123050241/http://typophile.com/wiki/Dan%20X.%20Solo" class="freelinking link-lost" rel="nofollow">Dan Solo</a>'s font catalog, as well as some of the alphabet books he published through Dover. As I've surfed the net to find out more about his fabulous collection of typefaces, it seems that people sometimes refer to the typefaces as "his". This has spawned some questions in my mind about what rights, if any, has he acquired along with his collection of 4000+ typefaces.</p>
    <p>The Dover books contain several typefaces I'd like to use. Some of them are available as fonts, but some are not. Perhaps I just don't know how to find them. Anyway, according to the back covers of the alphabet books, the alphabets are copyright-free. What is the accepted practice when it comes to digitizing the alphabets in those books, using them as fonts, and perhaps selling them?</p>
