      <p>The stroke ends on the W, R, X, Y are similar but the decision to angle the ends seems arbitrary. I'm not saying that you need to give all strokes the same angle but the rule is inconsistent. Sometimes that's cute but in this case it's not.</p>
      <p>S is tough. It looks kind of congested on the top and it's overall heavier than most other letters. I recommend printing it out and tracing over it in pencil. You can fix it by poking beziers around but it's easy to end up with something that looks generic. Expect to spend lots of time on the S.</p>
      <p>X is tough. Split it into three pieces. A solid piece like this: / and the other half \ split at the waist. So you've got one / and two short \ \. Move the shirt \\ into position until they look right. Test with other letter and X words. Don't measure, just move them until they look good to you. Remove overlaps. select points and arrow key tap* them until you have a perfect X. Get frustrated and start all over again.</p>
      <p>K is tough. It seems that you want to contain K in its own "square". That's fine but it creates limitation on the structure. Right now the foot tapers.</p>
      <p>V is not tough. Arrow key tap the crotch point down a bit. arrow key tap the top to make the strokes slightly wider. Compare with other letters.</p>
      <p>* select a point and play bongos on the arrow keys</p>
