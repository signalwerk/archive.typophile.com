      <p>This font has a nice warm feel :)</p>
      <p>I'm no expert at all (and excuse my lack of fluency in the language of type design), I'll build on the suggestions made by typodermic.<br>
      From here I can see that your 'H' is too squished and too light. Make it wider and increase the stroke widths a little. Compare it to the 'W' which is really heavy – too heavy.<br>
      Your 'G' looks a little odd, the round is light and the top terminal has an odd shape and angle. Also the foot (?) of the 'G' feels a little big and possibly too high. I think the curve 'J' needs some condensing.<br>
      It feels like the 'C' overshoots the baseline and cap-height a bit much – it's really noticeable against the 'D'.<br>
      I like the tail of the 'Q' and perhaps there's something there that can help you with the 'K'.<br>
      I like the 'R' but it feels a tiny bit top-heavy so the leg needs to come out a little more perhaps, and address the heavy mass that's happening where the leg joins.</p>
