    <p>Hey everyone, this is my first post on the site ... seems like an awesome community. I'm looking to get some feedback on a font I'm working on ... right now I only have the caps.  </p>
    <p>The font is nameless as of yet, but inspired by the quote 'my favorite part was everything.' Some little kid on TV was talking about how Shaq came to visit his elementary school or something like that.</p>
