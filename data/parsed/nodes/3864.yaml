    date: 2002-11-23T19:03:00
    date_raw: 23.Nov.2002 7.03pm
    votes: null
    html: <p> Those numbers are not any given typeface. They are from a mechanical auto-incrementing numbering device used on letterpress equipment. The name "Crash Numbering" comes from the process called "crash printing" which involves imprinting a number (or other information) on a multipage form after all the pages of the form are assembled. </p>
