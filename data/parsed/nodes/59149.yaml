      <p>Hi Billdavis,</p>
      <p>Thanks for the reply - yes seems strange as I didn't have this problem with CS3 Indesign ME. It worked as long as you had the font installed on your system. I will look at the Acrobat settings. We may not use this font after all so that will be better than exporting the pages as jpegs and then importing back into Indesign to make the PDFs.</p>
