    <p>Hi,</p>
    <p>I have tried to search the forums for anything on this subject but could not find anything. I am designing a book in Adobe Indesign ME CS4 on mac and we are using Microsoft's Traditional Arabic font in Regular and bold. I am not able to export a PDF as I get a message saying the font cannot be embedded due to licensing restrictions. Does anybody know who designed this font and is it possible to buy a unrestricted version? I have tried calling Microsoft Corporation but with no success. I am able to print the file as Postscript and then open it in Preview which converts it to a PDF. I can then save as a PDF from here but this seems to only work with A4 page size. My book is square and I cannot get this method to work for my size.</p>
    <p>Thanks in advance.</p>
