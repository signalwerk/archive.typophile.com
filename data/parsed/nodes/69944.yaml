      <p>If you place the letterhead art -- the logo, etc -- into the Word file itself, you'll get inferior results because they'll be printed on office printers that have nowhere near the quality that you'd get if they were professionally printed letterheads. </p>
      <p>The logo will shift color depending on which printer is being used, and if toner levels are low the logo might print in the wrong color entirely.</p>
      <p>Much better from a quality standpoint to design the letterheads in InDesign, have them professionally printed, and then create a Word template for typing the letter's content.</p>
