      <ul>
      <li><em>What is the best way to do this... I’m guessing an InDesign template is out of the questions so the most popular text editor for the office guys is still “Word”. Does this mean that I would need to create the entire layout in Word... margins... etc or is there another way to do this? To be honest I’ve never actually did a layout in Word really</em> :/.</li></ul>

      <p>Dear Evie/Carolina,</p>
      <p>What would be wrong with creating the template in Word? It’s not rocket science. I’ve been doing that for many years. MS Word has all design tools you need. You only have to recognize, and to use it as yet another <em>design tool</em>. In many ways it is less complex and sophisticated than QuarkXPress or InDesign, but it is one very reliable program that allows you to fine-tune your typography to an appropriate degree: paragraph and character styles, font sizes to 0.5 pt., leading to 0.05 pt., tracking to 0.05 pt., horizontal scale to 1%… just don’t forget to enable kerning (it’s not automatic in Word). To a certain extent using Word after InDesign feels like driving a stick-shift car after an automatic. Yes, it’s not for the sissies…</p>
      <p>One tip: in <em>Document</em>… &gt; <em>Layout</em> set up the <em>Headers and Footers</em> as ‘Different first page’. That would let you use your company’s head-piece on the first page, and the continuation page headers and automatic folios on the subsequent pages.</p>
