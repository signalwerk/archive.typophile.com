      <p>Evie,</p>
      <p>Most of my clients are small or non-profit so I usually end up making them a letterhead in inDesign first, for proofing and because inDesign doesn't suck, and then I transfer all the graphics into a word document.</p>
      <p>Even if you do a print letterhead you will have to specify margins, as MS Word default margins are too small. In which case you may like to create a word template with the margins set so the client's writing doesn't print right over the art.</p>
      <p>You can get even more fancy by setting up header styles and body copy styles in word -- which your client will promptly ignore.</p>
      <p>This link has an accurate and easy to understand tutorial on the subject:</p>
      <p><a href="http://www.creativepro.com/article/hergeekness-says-convert-custom-letterhead-microsoft-word-templates" title="http://www.creativepro.com/article/hergeekness-says-convert-custom-letterhead-microsoft-word-templates">http://www.creativepro.com/article/hergeekness-says-convert-custom-lette...</a></p>
      <p>One drawback is when you place the art in word it automatically greys out when the client is using it to write. This is because the art must be stuck in the footer, regardless of where on the page it sits, so that it is not accidentally moved around.</p>
      <p>Then the client asks, "Please make it not grey."</p>
      <p>And it goes on from there.</p>
