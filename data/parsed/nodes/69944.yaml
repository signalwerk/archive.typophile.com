    <p>hi everyone,</p>
    <p>again i'm having some questions :D<br>
    i'm trying to school myself a bit so i would like to try out something ive never did before</p>
    <p>Here's the thing, for the first time i'm trying to make a business letter template that every employee (at my imaginary company) should use with the logo on top, adres, subject of the letter...etc.</p>
    <p>What is the best way to do this...i'm guessing an Indesign template is out of the questions so the most popular text editor for the office guys is still "Word". does this mean that i would need to create the entire layout in Word... margins..etc or is there another way to do this? to be honest Ive never actually did a layout in word really :/.</p>
    <p>Or is the most usual way of going about this to design the A4 paper in indesign, place logo, adres..etc in Indesign and just work with pre-printed sheets?</p>
    <p>How do you guys actually go about doing a job like this</p>
