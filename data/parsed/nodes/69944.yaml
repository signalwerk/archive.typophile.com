      <p>renkceurb,</p>
      <p>Hi. I don't have a solution for not making it grey. Well I guess I have a solution, which is to explain to the client/user that it will appear grey and there's no way around it.</p>
      <p>If they are sending out the letterheads over the internet I explain the process of print to PDF (then the art is full colour, or fully black rather than tinted back).</p>
      <p>They should allow header view in MS Word, because this does come up a lot. </p>
      <p>And very few of my clients will ever print stationery. In fact, it seems they are all swinging as far away from print as they can -- but I bet they will correct their behavior over the next year or two (ie: a balance of communication methods).</p>
