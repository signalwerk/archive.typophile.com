      <p>Well there's several ways of doing this:</p>
      <p>1) Design in design program of your choice then send to a printer. Then in your traditional word processor, set-up margins to correctly use the pre-printed letterhead. Put the pre-printed letterhead into your printer and print.<br>
      Pros: Can get full bleed (edge to edge printing) look which will set it apart from most business printed documents.<br>
      Cons: Costs more to do, requires some user intervention (add the correct paper to printer before printing)</p>
      <p>2) Create a design (using whatever design application) and then create a template in your word processor, and place your designed artwork as a background in your word processor template. Be aware of your printer margins and design for them (the white margins where the printer can't print).<br>
      Pros: Cheaper and it's easier for less technically proficient staff to use<br>
      Cons: Hassle of setting up your Word processor template and getting the artwork in and looking right, no full-bleed, can look generic without the full bleed.</p>
