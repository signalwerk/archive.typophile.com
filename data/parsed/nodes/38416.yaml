      <p>Hi Christian:</p>
      <p>Thank you for the correction. I'm so glad that I'm not correct about the character set.</p>
      <p>I see Neutraface as a well honed and stylish take on the geometric sans, a field occupied by Relay, Verlag, FB Nobel, DTL Nobel, Erbar, Drescher Grotesk, FF Super Grotesk, and Futura. These are either stylish or austere. But with Neutraface 2.0 I get the bauhaus geometry for serious text work and the those stylish details that make it work it for display applications. I get it all.</p>
      <p>On Typographica there was a comparison to Gotham (which I personally don't get) but the closest sans would be the exclusive VF Sans from Terminal Design for Vanity Fair. All of the things that bugged me about Neutaface (and stopped me from buying it) are gone! Your "neutral" Neutraface has more versatility and I appreciate that :-) </p>
      <p>Just as a side question: In House &amp; Garden magazine they started using a slanted version of Neutraface Drafting- is that something they came up with or is there Drafting Oblique made special for them?</p>
      <p>Best Wishes and keep cranking them out!</p>
      <p>Mike Diaz :-)</p>
      <p>PS... I love the lower case a and g.</p>
