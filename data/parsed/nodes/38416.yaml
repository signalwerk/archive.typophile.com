    <p>Alright, I searched via the Typophile search function and via Google and found no thread, so if this a duplicate, sorry.</p>
    <p>Got the email yesterday as an owner of Neutraface that House has released <a class="freelinking external" href="http://www.houseind.com/index.php?page=showfont&amp;id=612&amp;subpage=viewfontspecimens" rel="nofollow">Neutraface No. 2</a>, a companion. A quick first impression is that the caps are more Futura inspired and less Art Deco looking.</p>
    <p>A nice caps Inline titling weight has been added too.</p>
    <p>With the geometric and alternate humanistic lowercase letters, looks like House Industries is going for world domination.</p>
    <p>I like the special discount for current owners of Neutraface to upgrade to No.2.</p>
    <p>So, did Christian work on this or did the House team just expand on his work?</p>
