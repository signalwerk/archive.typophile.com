      <p>Christian Schwartz updated his orangeitalic site to reflect on the changes in Neutraface 2.0. I especially like the improved kerning in the text. The only beef one could have with the new design is that the lowercase alternates don't get the same attention as they did in the 1.0 version. Notice there are no two-story lower case g's with diacritics. Not that I care... I will only set in the english language  probably for the rest of my life.</p>
      <p>Mikey :-)</p>
