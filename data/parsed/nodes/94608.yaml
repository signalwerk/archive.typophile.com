  - id: 515667
    user_id: 18888
    user_name: litera
    user_path: null
    user_image: /files/pictures/picture-18888.jpg
    date_raw: 14 Jul 2012 — 12:42pm
    date: 2012-07-14T12:42:00
    votes: null
    html: |-
      <p>Ok. @thegirlinmidair needs some guidance here. Apparently. This may seem like a good start but hrant made a good suggestion related to type. If you're going for the "midair" logo, this doesn't really look like mid air. It looks very firmly on the ground because of the very prominent bottom line. That gets more and more thick as you move to the right. To me this looks like a locomotive because it feels very heavy and has smoke coming from the front and getting backwards.</p>
      <p>If you want to create something "midair" I'd suggest for a more playful touch on letters where they're disjoint, and feel more like bubbles in the air. Different sizes (but try not to variate too much so you can keep uniform weight) and different sqew, rotation etc.</p>
      <p>And if you want to make the feel of being "midair" you will have to present some roundness below as well, so it will feel like in the air. And make sure you adjust cloud stroke style with your lettering. I guess that's one of the things that @hrant wanted to say by saying "much polish needed".</p>
      <p>Keep on the good work, try to keep wide minded about our suggestions and don't jump too hastily to rejected ideas. Try to work on them and not just replace type and see if it works. Every change usually brings more work than just changing a single element.</p>
