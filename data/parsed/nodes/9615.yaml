    html: <p>Zero, the idea of having a stable of faces precludes approaching each design project with a truly open-minded "custom" attitude, because you will be limiting your creative process into riding one of the fonts you already have. <br> <br>It would be better to acquire your fonts piecemeal, according to the unique demands of individual publications. That would be more like custom design. <br> <br>Better still, develop relationships with type designers, where you get "beta" copies of their latest models.  <br> <br>To max out the customization, don't use off-the-shelf typefaces at all, but commission a new typeface for a new magazine design.  <br> <br>*** <br> <br>Bert, try the London Review of Books for major Quadraat implementation.</p>
    html_clean: <p>Zero, the idea of having a stable of faces precludes approaching each design project with a truly open-minded "custom" attitude, because you will be limiting your creative process into riding one of the fonts you already have. <br> <br>It would be better to acquire your fonts piecemeal, according to the unique demands of individual publications. That would be more like custom design. <br> <br>Better still, develop relationships with type designers, where you get "beta" copies of their latest models.  <br> <br>To max out the customization, don't use off-the-shelf typefaces at all, but commission a new typeface for a new magazine design.  <br> <br>*** <br> <br>Bert, try the London Review of Books for major Quadraat implementation.</p>
