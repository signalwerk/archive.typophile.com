    html: <p>I have seen similar type design before, although this one is certainly unique. I wonder why you created it. Was it project specific, a partial alphabet design from a branding/identity job,  <br>a consumer face or just experimental. As you may have anticipated the critique would be with regards to consistancy. <br>Some character need a bit more work. The numerals are great, why not add old style numerals. I will try to think of where I have seen this type of design before.</p>
