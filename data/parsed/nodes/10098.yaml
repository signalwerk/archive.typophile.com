    html: <p>Hi there. I guess my last post didn't make it. My laptop ran out of juice during my upload. Well moving along. I think this is a very innovative design, I have seen this direction in type design before and I have been racking by brain trying to figure out where I saw similar type of work. Regardless this type of work is very interesting as an artistic expression. I am wondering if there is any (for lack of a better term) sacred geometry applied. I see repetition of circles and angular strokes. Kris could you please elaborate on your general concept. Was a few of the forms from a logo you created and then decided to expand on the design and build a full face?</p>
