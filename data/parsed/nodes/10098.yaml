    date_raw: 10 Apr 2005 — 8:10pm
    votes: null
    html: <p>Thank you for the comments and critiques. This display typeface was actually conceived for a graduate class in Typography. The general idea came out of looking at Wolfgang Weingart's My Way to Typography, a book on Frank Lloyd Wright, and various other sources like Metropolis magazine. In addition I was looking at research by Nikola Tesla and his theories on acoustic resonance--hence the name.   <br> <br>All of these sources seem to "resonate" something to me and came together through my sketches. I wanted to create an original typeface that reflected my interests in several areas of contemporary design. And even though my background is not in architecture, I often draw from other media and disciplines for inspiration.  <br> <br>Also, I can perhaps see the resemblance to Ott &amp; Stein's work, but this was not a source I looked at when researching. <br> <br>Keeping a consistent look and feel for each letter and number is difficult and I will continue to develop my designs. Again, I appreciate any and all comments/crits.</p>
    html_clean: <p>Thank you for the comments and critiques. This display typeface was actually conceived for a graduate class in Typography. The general idea came out of looking at Wolfgang Weingart's My Way to Typography, a book on Frank Lloyd Wright, and various other sources like Metropolis magazine. In addition I was looking at research by Nikola Tesla and his theories on acoustic resonance--hence the name.   <br> <br>All of these sources seem to "resonate" something to me and came together through my sketches. I wanted to create an original typeface that reflected my interests in several areas of contemporary design. And even though my background is not in architecture, I often draw from other media and disciplines for inspiration.  <br> <br>Also, I can perhaps see the resemblance to Ott &amp; Stein's work, but this was not a source I looked at when researching. <br> <br>Keeping a consistent look and feel for each letter and number is difficult and I will continue to develop my designs. Again, I appreciate any and all comments/crits.</p>
