    html: <p>I'm sorry to see no one has commented yet. I think this is remarkable. <br>I love the drafting/architectural feel. It's like techno-deco. <br>There is room to create useful alternates like an A that leans the  <br>other direction (a la Avant Garde Alts) for fitting with upright  <br>letters to its right.</p>
