    <p>It’s hard to find trustworthy information on the web and nowadays it’s seems impossible to actually go some place and test and see for youself. So I’d really appreciate your suggestions and hear about your experiences. The thing should offer everything a graphic designer would expect (color calibration ...) of course. Flatscreen is probably the way to go.<br>
    Thanx.</p>
