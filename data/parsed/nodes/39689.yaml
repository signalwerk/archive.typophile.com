      <p>Swissmiss asked this question a little while ago and got a ton of replies, though a good few blindly shouted “Apple!” even though their displays are, quite frankly, weak: the display in my brand new Santa Rosa MacBook is awful – it’s a Samsung panel LTN133W1, made in the 1st quarter of 2006, and exhibits the “dithering” that so many people have complained about – and the Cinema Displays really, really need updating. I reckon Apple will announce new models in January, along with new Mac Pros and the mythical thin MBP. Anyway, here’s the post:<br>
      <a href="https://web.archive.org/web/20080905043632/http://swissmiss.typepad.com/weblog/2007/11/advice-from-my-.html" title="http://swissmiss.typepad.com/weblog/2007/11/advice-from-my-.html">http://swissmiss.typepad.com/weblog/2007/11/advice-from-my-.html</a></p>
      <p>Personally, I’d hit “cheap but big with decent performance” option and go for the Dell 2707WFP (single-DVI connection) when it’s on discount, along with a third-party calibrator, as I said in the link above. I’m still a little amazed that I’m the only one that mentioned hardware calibration in that thread, all displays tend to be mediocre without profiling. I’m willing to live with the trade-off of poorer performance of LCDs vs. CRTs in exchange for the larger display size, and the extra desk space is quite welcome, too. SED does sound promising, though If you need something now there aren’t any displays available using that technology.</p>
      <p>By far the most thorough review of the Dell I’ve found online has been at Anandtech; it’s a real shame they don’t review displays more often:<br>
      <a href="https://web.archive.org/web/20080905043632/http://www.anandtech.com/printarticle.aspx?i=2961" title="http://www.anandtech.com/printarticle.aspx?i=2961">http://www.anandtech.com/printarticle.aspx?i=2961</a></p>
      <p>That review should give an idea of the competition, too, though it&amp;<!--
