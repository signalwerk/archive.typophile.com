    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : hamburgefontsiv</strong></p>
    <p><a href="http://typophile.com/node/787" rel="nofollow">Hamburgevons?</a></p>
    <p><a href="http://typophile.com/node/34493" rel="nofollow">Hamburgefonstiv, &amp;c.</a></p>
    <p><a href="http://typophile.com/node/1273" rel="nofollow"><em>Hamburgevons</em>; Where Did It Come From?</a></p>
    <p><a href="http://typophile.com/node/1273" rel="nofollow">Typeface Design Question</a></p>
    <p>Hamburgefontsiv, OHamburgefontsiv, Hamburgefons, or even just Hamburg is a common test string for judging a typeface's design or a design's progress.</p>
    <p>Several foundries have used this word to help assess submissions from independent designers, including <a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a> during (at least) the 1980s.</p>
    <p>The stringmay have first been created at the <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> foundry sometime before the Second World War. Its "author" there would have been <a href="/wiki/Dr.%20Rudolf%20Wolf" class="freelinking" rel="nofollow">Dr. Rudolf Wolf</a>, who among other things was the designer of the <a href="/wiki/Memphis" class="freelinking" rel="nofollow">Memphis</a> type family. <a href="/wiki/August%20Rosenberger" class="freelinking" rel="nofollow">August Rosenberger</a> may have been involved. He cut several of Memphis' weights, and would later cut designs of <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a>'s, including <a href="/wiki/Palatino" class="freelinking" rel="nofollow">Palatino</a>.</p>
    <p>Before the digital-era, this was by no means a universal string. Several American foundries began typeface design testing with the letters <strong>Hono</strong>.</p>
