      <p>I wanted to add: in the end it is not such a big deal. Both designs (1 &amp; 2) are still readable, are they not?</p>
      <p>Nick, I have not done any research in this, but I think it WAS originally an apostrophe used for a different purpose. Then there is a question of what sort of revival it is, if it “revives” (contemporarizes, makes more usable for current typography) or if it is  “digitalisation”. You can also consider something in between, some kind of drop. There are many faces which do not try to deal with the distinction between apostrophe and vertical caron and they are being used commonly.</p>
