    html: |-
      <p>Hey Adam, your posts are overwhelming!</p>
      <p>Just a little note, you posted the other comment while I was writing my comment to your first post, so I was not actually responding to that.</p>
      <p>Regarding the naming: I know I used it myself, but perhaps v-shape is also no good. Best would be to avoid any shape comparison, but that is what actually makes the names more useful. What about caron above and (next-to-)ascender caron? But hey, I am fine with anything as long as there is no word suggesting it relates to punctuation.</p>
      <p>Regarding the -v- and caron. I have the feeling that designers do not always realize that caron is not a small -v-. For two reasons: a) the contrast can be quite different b) there are no terminals (namely serifs) in diacritics. Similar case -ring- and -o-.</p>
      <p>I like your example of minimal pairs. Well, I do like bringing linguistic models to type design, but it is also useful to put it this way. btw. you get even more fun when designing for academic linguistic texts with an extensive use of diacritics to describe pronunciation in etymology (surprisingly IPA is not as adopted as one might think). Basically any kind of combination can appear there.</p>
      <p>Your last paragraph made me laugh loud. :) I guess it is better to say more than less (which is generally my preference in writing).</p>
      <p>Regarding the kerning: I feel your pain, sorry! Few years ago I asked few Czech and Slovak designers what is their approach to this. Generally there are two approaches:<br>
      1. space -ľ- similarly to -l- (i.e. the caron is overlapping the right sidebearing) and use positive kerning to solve collisions with following ascenders (b,k,h, …), accented letters (á, é, …) and punctuation (brackets, quotes, question mark, … [remember that Czech and Slovak use 66 quotes at the end]) as clashing is very NOT nice. This produces less kerning and it is quite manageable, but if there is no kerning, there will be clashes.<br>
      2. space -ľ- so there is enough space on the right side of the caron and it does not overlap with following ascenders and use negative kerning to shift letters closer if possible. The amount is at maximum the space you added because of the caron, however see the note below. You also need to shift a word space a little! More confusing, but less vurnerable – works even without kerning.</p>
      <p>Note that the bolder the caron is and the higher the x-height is the more you need to consider the caron shape when spacing. So for example when it comes to approach [1] and typeface with a medium x-height, the -ľ- and -l- spacing in the black weight will be quite different on the right side while in the regular it can be practically the same.</p>
      <p>It may be a problem to find all the critical pairs you need to check. If you are unsure, simply check Slovak and Czech alphabets.</p>
      <p>When picking the approach, you need to consider your customers and software you are designing for. I guess most of the  independent foundries designing for graphic designers using Adobe software can make their life easier and go with [1].</p>
      <p>Recently, I wonder if the gaps which necessarily appear in a not-kerned typeface which used [2] are not as annoying as the clashes.</p>
      <p>If any of this needs some clarification, let me know and I will prepare a picture.</p>
      <p>Cheers,<br>
      David</p>
      <p>p.s. Heh, my comment is not much shorter. :)</p>
      <p>--<br><a href="http://rosettatype.com">http://rosettatype.com</a></p>
