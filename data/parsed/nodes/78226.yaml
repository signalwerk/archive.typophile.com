      <p>David,<br>
      I use the: "1. space -ľ- similarly to -l- (i.e. the caron is overlapping the right sidebearing) and use positive kerning to solve collisions" method since it involves far fewer kernings.  I just have a class that includes all ascenders on the left and then I only need deal with butting diacritics from neighboring glyphs.  I also adjust the lcaron to space kern to compensate for the open feeling the hole makes.</p>
      <p>Thanks for all of your insights, Adam and David!</p>
