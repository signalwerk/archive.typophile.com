      <p>David, is disambiguation between vertical caron and apostrophe really so important?<br>
      After all, the vertical caron characters appear extremely frequently in Slovak text, and the problematic rozhoď/rozhod’ very rarely.<br>
      Surely it is better to aim for good, even colour in text -- with the two critical areas being:<br>
      1. the space between vertical stem and caron<br>
      2. the space between vertical stem and following character</p>
      <p>It seems to me that the thin vertical slash treatment that many typefaces now employ creates a nasty narrow "bottleneck" between accent and stem.<br>
      What should the space between dcaron and lcaron, and the following character look like, as a percentage of the word space?—<br>
      1. 0%<br>
      2. 10-20%<br>
      3. 33%<br>
      4. 50%<br>
      5. 67-100%</p>
