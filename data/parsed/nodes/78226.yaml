      <p>Preferably (1). You want to maintain clean ascender line (as one would do it similarly with the x-height). The second case (2) could happen in handwriting, though. You might also need to do it in small cap /lcaron since there may not be enough space in bold. I also do it with Lcaron so all "vertical carons" in the font are at the same vertical position.</p>
      <p>I do not understand how the second example aligns with acute (acute for lowercase letters or uppercase?). The reasoning behind this kind of caron is not to put the accent above the letter since there used to be limited vertical space in metal typography. At least such is the common understanding. So the accent should not be above or diagonally to the right top, but to the right from the character.</p>
      <p>All of this very much depends on the x-height which I cannot see. If the x-height is tall it will force you to push the caron up, esp. in black designs. Regarding the apostrophe: it well may be and perhaps that is actually quite common that apostrophe turns out to reach above the ascender line (?).</p>
      <p>IMHO the distinction between apostrophe and vertical caron needs to be doneby changing the size and shape of the marks. The contemporary solution is to make the caron wedge-shaped or more shallow than the apostrophe which typically takes comma-like shape. It seems more secure than relying solely on the positioning. You can read more on the topic here: <a href="http://ilovetypography.com/2009/01/24/on-diacritics/">http://ilovetypography.com/2009/01/24/on-diacritics/</a></p>
      <p>Cheaper models :) to look at are Brousil's (Suitcase) typefaces or TypeTogether's (Maiola or my Skolar of course :). Just use the font testers or PDFs and it should give you enough idea.</p>
      <p>Hope this will be of some help.</p>
      <p>--<br><a href="http://rosettatype.com">http://rosettatype.com</a></p>
