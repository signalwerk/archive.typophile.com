    html: |-
      <p>And in just general spirit: in the evolution of the letterforms, minimal-pair differences always played an important role. Whenever any two forms were considered confusingly similar, some details became more and more pronounced over time to differentiate them. This is very clearly visible in the uppercase Roman alphabet: the additions that had no predecessors (J, U, W) as well as the later adoptions from the Greek (Y, Z) were chosen or invented in a way that made them distinct from the other letters, and those distinctions grew over time. This is evident in the "quest for distinction" of the letter J, where different solutions have been tried over time: curving the tail more, elongating it below the baseline, placing a bar on top of the letter etc. Similarly, the case can be made that "ſ" was dropped because it was too similar to "f" in the end, so the more distinct form "s" prevailed. </p>
      <p>In the diacritic design, the task is quite similar: choose forms that are in harmony with others, yet sufficiently different so that they are not confused with others. </p>
      <p>Since different kinds of diacritics are used in various languages, but it's not like all diacritics are used at once, the largest importance is to pay attention to potential differences within one natural language. </p>
      <p>A few examples: </p>
      <ul><li>É and È need to be sufficiently different because they both appear in French (both for upper- and lowercase).</li>
      <li>Ľ and Ĺ must be sufficiently different because they both appear in Slovak (both for upper- and lowercase).</li>
      <li>Ö and Ő must be sufficiently different because they both appear in Hungarian (both for upper- and lowercase).</li>
      <li>Ż and Ź need to be sufficiently different because they both appear in Polish (both for upper- and lowercase). An interesting case here: in some display typography, the Polish uppercase Ż is depicted as Ƶ to make it very different from Ź, but this has never become a universal norm.</li>
      <li>The lowercase ł needs to be sufficiently different from l and t, because all three appear in Polish.</li>
      </ul><p>So when designing a typeface for small-size pan-European use, designers should first identify the key minimal-pair differences, then get them right, and then apply the design solutions consistently to the rest of the diacritics that are in no conflict to others. </p>
      <p>Adam</p>
