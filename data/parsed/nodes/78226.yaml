      <p><em>In most cases, line spacing does not represent the same problem nowadays.</em></p>
      <p>Actually, it still does. You cannot extend line spacing as you wish if only for economical and aesthetical reasons. The letters still need to stick to some kind of average (naxinun) height. Czech is typeset with larger line-spacing (ca. 1 point more) than English with the same font, simply because there is so many diacritics. And now consider newspapers with the new "improvement". That could a big deal.</p>
