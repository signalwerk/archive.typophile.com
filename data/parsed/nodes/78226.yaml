      <p>The ascending lowercase letters with caron (ď, ľ, ť) have adopted a different form of caron clearly for technical* reasons: having a tall letter with a mark *on top* of it was considered unpractical, since it enlarged the vertical height of the line. Especially if the ascenders were long. So a mechanism of "vertical compression" was employed, and the mark was squeezed into the "body" of the lowercase, i.e. was simplified and put next to the letters. </p>
      <p>* I mean "technical" not necessarily because it was implied by the printing technology, but also when it came to the "technological effectiveness" of handwriting. Maybe the word should be replaced by "practical". </p>
      <p>My observation is that for those lowercase letters, the main point is that the "apostrophic caron" should be designed in such a way that when typeset (e.g. loďka), there should be no visible word gap where the diacritic occurs. So the space should be as sparse as possible, yet the caron must be distinctly visible as well. </p>
      <p>This can be explained in an opposition to the English usage of apostrophe: words such as don’t, it’s or let’s have no problem with the apostrophe appearing in place of a word gap. This is largely to the fact that the apostrophe does, in many cases, indicate a contraction of two words (don’t = do not, it’s = it is, let’s = let us). Leaving the Saxon genitive aside (though very down in its roots, it also is a contraction), the reader of English has no problem accepting that don’t is something semantically between one and two words. So the somewhat larger gap that the apostrophe creates is fine. </p>
      <p>With Czech and Slovak, it is very different. The words that use the apostrophic caron should not be "disrupted" visually in the middle. So typically, the apostrophic form of caron undergoes a formal reduction: it does not need a fully-qualified comma/apostrophe shape (with a ball and all), but instead, it works well with a reduced form that resembles a nearly-upright acute. The apostrophic caron can be very straight (only slightly tilted to the right), or very very slightly curved (not as curved and round as comma). </p>
      <p>The question of the uppercase Ľ is funny: because of its shape, there is lots of space there so the letter does not actually need this sparse, or compressed form of a diacritic. In theory, it could well do with a classic caron placed on top (L with ˇ on top). After all, all the other capital letters use the classic form (I'm mixing Czech and Slovak here, so apologies: Č, Ě, Ň etc. but also those that in the lowercase form take the apostrophic form: Ď, Ť). </p>
      <p>However, since Slovak uses both the letter L with a caron and with an acute, for lowercase, the PLACEMENT (not the form) of the marks between ľ and ĺ was apparently a sufficient indication of difference. For uppercase, the same differentiation between Ľ and Ĺ has been made. </p>
      <p>This fact CLEARLY shows that the apostrophic caron in Ľ should not be raised too much above the top of the uppercase L. Perhaps its top can be even aligned with the top of the L. Also, in the same spirit, the acute over Ĺ should be placed quite to the left, i.e. its "start" (bottom) should be horizontally aligned with the stem of L. Also, for that reason, the uppercase acutes for Czech and Slovak should be quite flat, while the apostrophic caron needs to be fairly upright. </p>
      <p>For some reason, inserting images into Typophile does not work for me :( I wanted to illustrate this with examples. Since this did not work, please visit these links to see the difference in two of Peter Bilak’s typefaces, Greta and Fedra Sans: </p>
      <ul><li><a href="http://www.typotheque.com/fonts/greta_text/regular/sample/english/waterfall?text=HE%C4%BD%C4%B9O%20lo%C4%8Fka">Greta Text</a></li>
      <li><a href="http://www.typotheque.com/fonts/fedra_sans/book/sample/english/waterfall?text=HE%C4%BD%C4%B9O%20lo%C4%8Fka">Fedra Sans</a></li>
      </ul><p>To sum it up: an important point when designing diacritics is not to view them in isolation, but always to design them in context, especially in comparison with other diacritics that occur in the same natural language. To be very explicit: the minimal-pair difference between Ľ and Ĺ should ideally be as clear to the reader as the difference between E and F. </p>
      <p>Best,<br>
      Adam</p>
