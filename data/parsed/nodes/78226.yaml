      <p>Nick: that is question I am asking myself all the time this thread is active. I do not know. But note, Czech (and Slovak is similar in this) is very phonetic in the writing, so if I confuse the marks I have no idea how to pronounce it right away. Context helps, but it actually happened to me several times that I had to read the sentence again to figure out. rozhoď/rozhod’ is a Czech example. Not sure how frequent it is in Slovak. Sorry, should have pointed it out. I am unifying the two languages quite a lot when it comes to this diacritical mark.</p>
      <p>The distance: I would make the gap visually around the thickness of the stem (geometrically thinner).</p>
      <p>Bendy:<br>
      The answer is no. :)</p>
      <p>Freiberger:<br><em>Don't you think it's interesting to include alternate |d|l|+caron glyphs in a font, using the traditional caron above?</em></p>
      <p>Same answer. It is considered incorrect in typographic letters. I do not think there is any movement to simplify diacritics in Czechia or Slovakia, but I might have missed something. Also, I would be careful to call one kind of caron traditional and the other one not. Perhaps that is my mistake when I called the v-like one "classic". I am not very well informed as of how the accents changed during the history to be able to say which form is older. It may not be simple.</p>
      <p>--<br><a href="http://rosettatype.com">http://rosettatype.com</a></p>
