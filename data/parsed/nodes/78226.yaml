      <p>Thanks Adam for the additional comments, however much of what you just said was said before or in referenced articles (ILT &amp; Diacritics).</p>
      <p>Few remarks:<br>
      - handwritten caron next to -d,t- is often written as -v- shape. I think the standard adopted the vertical form (e.g. Comenia script is using it), but it was not always like that.<br>
      - I have seen remarks about typefaces and theit loosely spaced apostrophe in English. Therefore, I would not go as far as “has no problem accepting”. There are certainly people who consider the gap as something distracting. Besides that you are giving a nice interpretation to “apostrophe is punctuation and as such it deals with words where caron is a diacritical mark and belongs to the lettershape in order to represent a sound” (mentioned in the article referenced). Indeed, two quite different roles.<br>
      -note that -É- (Eacute) and -Ě- (Ecaron) are aso used together and no one is considering that the caron in the second letter should be any different or positioned differently. The accents are quite distinctive. Hence using “vertical caron” * in -Ľ- (Lcaron) can be considered a matter of convention. The letter -L- simply allowed the same treatment as the lowercase -l- which is not the case in -D- or -T-.</p>
      <p>*) I intentionally avoid to call it apostrophe-like, because then people might think it should look like an apostrophe.</p>
