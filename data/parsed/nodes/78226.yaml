    <p>Hi there,</p>
    <p>I would like to know what is the correct vertical alignment for the diacritic mark in 'lcaron' and 'dcaron'.</p>
    <p>I've always made it like in the example on the left (1) but after an exchange with a colleague who thinks it is an accents and should align with 'acute', etc (example 2), I am in doubt.</p>
    <p>Can someone with an slovakian background to clarify this? Thanks!</p>
    <p><img src="/sites/default/files/old-images/screenshop-lcaron_4258.jpg"></p>
