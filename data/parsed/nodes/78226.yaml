      <p>Nick: Bodoni Egyptian is nice, but to me the bottom left is the most optimal when it comes to distinction between caron and apostrophe. Of course you cannot always go for the most optimal, e.g. for the sake of aesthetics, stylistic consistency. Note you need to be able to distinguish the mark when it is set alone. The mark does not need to be only recognized, but also distinguished (unique). I guess it is clear, but still I felt it needs to be articulated. So testing with two words, e.g. «rozhoď» vs. «rozhod’», is quite useful.</p>
