    html: |-
      <p>David, </p>
      <p>you’re right, the phrase “apostrophic caron” is misleading. I’ll adopt phrases such as “v-shaped caron” and “upright caron”. Does that sound good? </p>
      <p><em>&gt; -note that -É- (Eacute) and -Ě- (Ecaron) are aso used together and no one is<br>
      &gt; considering that the caron in the second letter should be any different or<br>
      &gt; positioned differently. The accents are quite distinctive. </em></p>
      <p>I completely agree. Acute and the v-shaped caron are distinct enough in their shapes. So they consistute a less-than-minimal pair by themselves. There is no need to pay attention to the details of their placement to make them appear more distinct. </p>
      <p>The minimal-pair examples I’ve cited were more tough: the dieresis and the double-acute (“hungarumlaut”) in Hungarian can be misleadingly similar if badly designed, the upright caron next to “L” may be misleadingly similar to the acute which also appears with “L”, the dot and the acute over “z” in Polish can also be too similar, and if the acute and grave are designed very upright, they may be confused in French when placed over “e”. So these are good examples of minimal pairs. </p>
      <p>In other words: the acute and the upright caron are a classical example of minimal pairs: they’re VERY similar in isolation, and this is why in their case, their placement, when used with “L”, is of extreme importance. In case of the Slovak “L”, it’s not the shape of the mark itself that makes a distinction between Ľ and Ĺ: especially in small sizes, it’s both the shape and the placement. </p>
      <p>I don’t think I’ve seen the aspect of minimal pairs raised in the discussions about diacritics (but maybe I’ve overlooked something). The concept of minimal pairs is a widespread concept in linguistics (<a href="http://en.wikipedia.org/wiki/Minimal_pair">http://en.wikipedia.org/wiki/Minimal_pair</a> ). They’re widely used in phonology, but I think the same concept can be well applied to graphology, or typography. </p>
      <p>Please note that my point is not that the caron over “Ě” should be any different from the carons over other letters. I’ve said: </p>
      <p><em>So when designing a typeface for small-size pan-European use, designers should first identify the key minimal-pair differences, then get them right, and then apply the design solutions consistently to the rest of the diacritics that are in no conflict to others. </em></p>
      <p>In other words: if there are minimal pairs in any natural language, look at them first when designing diacritics (or characters, in general), and make sure they are not too similar. In other words, when designing acute, the v-shaped caron, the upright caron, grave, dieresis, hungarumlaut, dotaccent etc., make sure that you look at test phrases such as <code>ÉÈĚĽĹÖŐŻŹ</code>, which consist of letters that occur as minimal pairs in natural languages, and make sure that this “looks right”. It’s not a great discovery I’m making here, it’s quite an obvious observation and many people work that way — but I thought it’s still worth emphasizing. </p>
      <p>Finally: of course the apostrophe (for the use in English, for example) is sometimes done as too loose. Then it is too loose :) Yet, as you say, it is a punctuation sign to due to its nature, it does need a little bit of space that gives the sign “some space of its own”. But of course it should still be spaced carefully, and, again, “look right”. </p>
      <p><em>&gt; much of what you just said was said before</em></p>
      <p>Believe me, in my experience, stating the obvious once is often not enough. On many occasions I’ve found myself needing to state the obvious again and again. :) Plus, I do have a short memory. I’ve recently been searching for online reviews of a Polish film that was released some 13 years ago. I did find one extensive review, started reading it, and though “Oh, I quite like this one, a good review”. Imagine my amazement when I read it to the end and found my name at the bottom. I wrote it in 1998, and completely forgot about it :D </p>
      <p>Cheers,<br>
      Adam</p>
