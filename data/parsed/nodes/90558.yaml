    html: <p>Richard (rememberbooks), your argument that it is totally unlike Melior based on details doesn't make sense. It was because of the initial impression and overall feel that one makes the connection with Melior. My font Neuton is similar to Times New Roman, but the details are totally different. Yet it still gives an initial impression of Times. Honestly there are reasons one would use Ledger over Melior, or vice-versa.</p>
