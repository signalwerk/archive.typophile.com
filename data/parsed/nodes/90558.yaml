      <p><img src="http://f.cl.ly/items/0f413S0J3l1g050J310j/Melior.png"></p>
      <p>If the similarity is a coincidence, that’s hardly less excusable than derivation, as Melior is an important type designed by Hermann Zapf, which a type designer should be aware of, and dissociate from, if only to avoid giving the impression that the new type is superficial.</p>
      <p>There’s nothing wrong with a clever serif treatment, but its relationship with the underlying architecture of the face is important.</p>
