      <p>See how many text fonts you can find where the caps<br>
      are the height of the ascenders... The very few you<br>
      will find will have caps that are either unusually<br>
      narrow or unusually light (strokes of thickness not<br>
      much more than the lc, unlike in your design). Does<br>
      Ledger have smallcaps? If not, try setting some text<br>
      with acronyms (like "NASA") and see how they totally<br>
      ruin the texture by jumping out...</p>
      <p>BTW, I just noticed another big problem related<br>
      to vertical proportions: your descenders seem to<br>
      be longer than the ascenders; they're supposed<br>
      to be shorter - and this isn't dogma, there's a<br>
      very practical reason: descenders are far less<br>
      frequent than ascenders in actual text; giving<br>
      them more (or even equal) room basically wastes<br>
      vertical space.</p>
      <p>In fact the claim that Ledger has a large x-height<br>
      does not seem to be true. That's not necessarily bad<br>
      news, since when it's too large readability suffers.</p>
      <p>So here's the shortest path I can think of to fix the<br>
      two vertical proportion issues: make the ascenders<br>
      taller. If that makes the x-height too small for you,<br>
      then you have much more work on your hands...</p>
      <p>Concerning Richard's onscreen angle: it's certainly<br>
      true that the lower fidelity of the screen can hide<br>
      a number of flaws... but fixing them won't make your<br>
      screen rendering worse! It will simply give better<br>
      results when somebody prints with your font. And if<br>
      anybody sets Ledger at a larger size onscreen* then<br>
      it benefits there too.</p>
      <p>* Which could still be for text, like on the<br>
      hi-res display of the amazing new HTC One X.</p>
      <p>BTW, what about your Cyrillic?</p>
      <p>hhp</p>
