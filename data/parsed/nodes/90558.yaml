      <p><em>All antiqua from one class can be called "derivatives"</em></p>
      <p>However, Melior is not a class, it is a fairly recent typeface (in the 500-year time span of still-used serif styles) with a strong and individual personality.</p>
      <p>Here we enter the realm of taste and discretion.<br>
      It’s OK for type designers to “tweak” established genres, but not typefaces.<br>
      Who are the snobs who have established this convention?<br>
      I’m just saying.</p>
      <p>I repeat the observation that the serifs of Ledger are a veneer: compare with Melior, in which the serif structure relates to the letter structure; but in Ledger the “powerful brutal” serifs are applied to a “softened” form. This is a poor premise—detail should play the same tune as structure.</p>
