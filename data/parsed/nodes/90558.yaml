    date: 2012-03-19T12:01:00
    votes: null
    html: <p>Perhaps this might be a work-alike substitute for Melior or an "inspired by," but there are numerous distinctive features which make it very hard to argue it's derivative.  There is no resemblance whatever between the two fonts' UC Q.  The tail of the LC e in Melior is a rounded widening; Ledger has a hook-like terminus, almost a serif.  The bowl of Melior's LC a shoots straight back; Ledger's droops.  The spur on the LC p and b is pointed; the equivalent part of Melior's letters stick straight back.  The 3s don't match at all, Legdger's 6 has a different width, the angle of the 7 downstrokes don't match.  The crossbar on Ledger's UC A is much lower.  (I hadn't run out of differences when I got tired of comparing.)  They're both the Latin alphabet, yes; but they're no more similar than hundreds of other distinct faces in any big vendor's catalog.  Looks to me like Ledger is shaping up as a fine-looking face.  I don't have suggestions for improvements, but it seems there are obvious reasons to challenge the charge of derivative work.</p>
