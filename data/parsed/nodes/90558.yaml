      <p>Denis, first of all, this typeface does show a lot of finish and I can see you put a great deal of work into it. Now to evaluate: the proportions of your ascenders and descenders really <em>are</em> way out of wack, you have to see it for what it is. How much consideration did you put into those proportions? I had made a similar mistake with my proportions for Neuton, which I have attempted to correct in later versions.</p>
      <p>The ascenders are much too short. Being at cap height, unless done extremely well, makes the illusion that the ascenders are actually <em>lower</em> than the capitals. It can work, but only rarely. I recommend you raise the ascenders at least as much as the height of the serifs.</p>
      <p>The descenders are also too low, especially in comparison with the ascenders. I would consider moving the descenders up enough to achieve more unity in form. The top stroke of the loop of the /g/ probably wants to rest on the baseline.</p>
      <p>I hope what I've said helps you. Also note that it's really not too late to make a correction such as this, considering the nature of Google fonts: 1) The approach tends to lead toward progressive development, so little improvements are welcomed and encouraged. 2) People already using the font will get all of those little improvements automatically. You should be able to adjust the ascenders and descenders relatively easily. As long as you make sure not to change the body size of the font (which should already be bigger than the height of ascenders &amp; descenders to account for accent marks), there will be no reflow of text. :)</p>
      <p>One final note, you should reconsider your /r/ a bit—there's a large gap on the bottom right. I would recommend shortening the length of the arm and making the bottom right stem serif a little longer. :)</p>
      <p>Hope this helps!</p>
