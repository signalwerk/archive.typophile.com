    html: |-
      <p>We are really much closer to saying many of the same things than your reply suggests.  First, I thought I had pretty clearly indicated in my earlier and shorter post (1) that many different Latin fonts resemble (my "catalog" remark), and (2) that as a possible "work-alike" or "inspired by" face, Ledger certainly does give an overall page impression more comparable to Melior, certainly less than to Century Schoolbook, ITC Garamond, Storm Lido, or any Didone.   So, I never said or tried to imply that Ledger was totally unlike Melior, quite the opposite.   Are you with me so far?  We both agree the two faces resemble.   Same opinion.  You say my reasons for stating they don't resemble "don't make sense," but I was not suggesting they don't resemble.  I was making a different point entirely ...</p>
      <p>Second, my main point is that overall page impression does not in any way support calling it a derivative work.  Nick's original post did not use that term, but his follow-up 29 Feb 2012 — 12:55pm did.   Correct me if I'm wrong, but doesn't "derivative" mean the designer basically started with one design, made changes, and ended with the other?  (To clarify, I'm not talking about illegally copying code, only working from an image or impression of a pre-existing design.  The details I cited strongly suggest to me that this designer started from scratch, not that he began with some Melior-like drawings and adapted that alphabet.  We may agree on that, too.)</p>
      <p>Now, the overall impact of his glyphs may have ended up resembling Melior, and that is entirely fine.  That doesn't make them derivative.  Their not being derivative is  my whole point, my only point.  That the details support.  I wouldn't have commented but for the use of that word, and the fact that he said such derivative work "calls for opprobirum."  Had he only said "similar to " or "evocative of" or "kind of like," there'd have been no issue.  You even seem to say something similar with your statement, "Honestly there are reasons one would use Ledger over Melior, or vice-versa," too.   So, again, it appears we agree rather than differ.  I hope you don't think it's right to condemn a designer or a typeface because it somewhat resembles another.</p>
      <p>Finally, having hopefully clarified those things on which we seem to have agreed, I believe my points in support of what I said do make sense.  If your own font, which you say "gives an initial impression of Times," is not a "derivative" face which "calls for opprobrium," then it seems you would now also agree my reasons for not calling Ledger derivative make sense, too.    I would expect you to rightfully object if someone said your face Neutron was an adaptation of Times, or a derivative of Times, simply because the two alphabets resemble.  I'm certain you don't believe you or your font should be condemned because it resembles Times in some ways.</p>
      <p>I've got no dog in this hunt.   I love staring at good type; but I definitely don't have the skills to design a font.  I probably don't even have the skills to digitize one which had been beautifully drawn by a competent artist and handed to me on a platter.  I don't mean to make my remarks personal, only to clearly call for clarity.   I thought I made a worthwhile, on-topic point, reasonably.   I still do.  But if that didn't happen, I'll let it drop.  There's bound to be something more valuable to do.</p>
