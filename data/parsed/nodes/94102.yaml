    html: |-
      <p>I am honestly not very familiar with VOLT, but I suspect that tool is probably more flexible and powerful. This little editor tool is intended to speed up the development of OpenType features in a workflow where another tool handles other aspects of font development. For example, I use FontLab Studio or a combination of Illustrator and FL to create the glyphs and make the font. I wanted a quick and easy way to automatically generate OpenType features from all those small cap, oldstyle, alternate, ligature glyphs I already created.</p>
      <p>Thanks for any feedback you can offer. I'm looking for reports of problems as well as suggestions for improvement.</p>
