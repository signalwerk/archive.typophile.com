    <p>The OpenType Features Editor, available for free download from <a class="freelinking external" href="http://www.timrolands.com/More/Downloads.aspx" rel="nofollow">http://www.timrolands.com/More/Downloads.aspx</a>, has now been downloaded more than 200 times. I am eager for any feedback on this tool.</p>
    <p>How is the UI? Could the generated feature code be better? Are there features that are not generated correctly? Any bugs? Any suggestions for improvement?</p>
    <p>Please let me know what you think. Thanks!</p>
