  html: |-
    <p>Can anyone point me in the direction of some good examples of Church Newsletters, or similar that are also well designed. I am looking to do some work on a monthly newsletter for a local church and I am looking for inspiration.</p>
    <p>Specifically, I am looking to develop a very informal/handwritten approach that feels 'friendly' and maybe a little 'haphazard' rather than one which is 'clean' and 'well presented'. I want the newsletter to convey a 'small community' feel that is 'developing' and 'learning' together, so I want the newsletter to 'look and feel' a bit quirky.</p>
    <p>Anyone have any suggestions for a handwritten/script font that is versatile enough to cope with a newsletter approach?</p>
    <p>As you have probably all guessed by now, I am new to all this, but love the art of words, that so many of you here make look so easy and yet I know is the product of so much learning.</p>
    <p>I'm just wanting to get started, and looking for ideas.</p>
    <p>Thanks,</p>
    <p>Chris</p>
