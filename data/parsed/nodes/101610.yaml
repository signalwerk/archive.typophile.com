      <p>Thanks for the feedback everybody.</p>
      <p>It looks like the general consensus is to typically leave them indented; <em>tmac</em>, your comments echo my logical assumptions, which is reassuring. I've been fairly convinced of this for a while now—I'm usually one to follow technical rules over aesthetic options—but it came up in conversation the other day and I figured there no better place to put the matter to rest than here.</p>
