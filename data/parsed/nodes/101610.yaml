    date_raw: 25 Mar 2013 — 1:42am
    votes: null
    html: <p>With the indented paragraph style you're using, a non-indented paragraph isn't just stylistic -- it represents a section break. For example, the first paragraph of each chapter would not have an indent because they represent the beginning of a new section (even if there are other indicators, such as a title or a lowered text box). Mid-chapter section breaks would probably have a paragraph space followed by a non-indented paragraph (and sometimes a little bauble in the white space). Therefore, you should use the indent. At least that's how I was taught.</p>
