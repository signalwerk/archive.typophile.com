    html: <p>There is a risk that the final line of the previous para will run at almost full measure, causing confusion whether the text below the image is part of the para or the start of a new one. To be on the safe side, ALWAYS indent new para’s after the first one (even though the aesthetics bother me, I have to admit — I prefer the look of the design on the left).</p>
