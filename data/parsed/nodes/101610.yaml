    <p>Hello Typophiles,</p>
    <p>A few colleagues and I were discussing book design and the interaction of text with images/figures that flow within the surrounding text. Specifically, we were debating whether or not the paragraph that follows an image (and its caption, if present) should be indented.</p>
    <p>Aesthetically, I prefer that the paragraph after the image <em>not</em> be indented, as do my colleagues. However, looking at it from the point of view of the logical progression of the text itself, I argued that perhaps it makes more sense that the paragraph be indented; this way, if all the imagery was removed, the text would still read—and be styled—in a logical manner.</p>
    <p>Below I've included a quick mock-up of what I'm describing above (see yellow highlights for the specific spot in question), should what I wrote not make any sense.</p>
    <p>As always, the group's expertise is greatly appreciated.</p>
    <p>Warmly,</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Indent-vs-NoIndent_4073.jpg"></div><p></p>
