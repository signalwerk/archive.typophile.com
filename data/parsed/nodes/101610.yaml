    html: |-
      <p>This question assumes that the first line after an image does, in fact, begin a new paragraph structurally. It's totally possible to have an image in the middle of a paragraph — or even a sentence, but that's a whole different type of situation that what you're talking about. Often, an image will simply be dropped in a layout at the most convenient place, not in a place that logically situates it within the flow of text. But even assuming that the images are conceived of as flowing in the same stream as the main text, I don't see why you couldn't have one in the middle of a paragraph. So the question is, I think, does it have to be consistent? I say no.</p>
      <p>I run into this with block quotes. Sometimes they end a paragraph and sometimes they don't. So sometimes the paragraph afterwards is indented and sometimes it's not. It's an editorial decision, not a typographic one. (In this case, you can ask yourself, If the quote was just run in with the text like a short quote, would it end the paragraph or not?) The textual logic may be more important than visual consistency.</p>
      <p>(And yes, when I'm the author, I always try to include quotes within a paragraph so as to avoid the unsightly indent …)</p>
      <p>But unless you're the author, ask your author or editor what they think.</p>
