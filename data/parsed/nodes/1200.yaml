    html: "<p>Alright...taking your helpful comments into consideration, I've made some adjustments and changes to the 14. I'm posting some of the variations I came up with and I already have a favorite, but I would still like to hear what everyone thinks. <br> <br>This process has definitely helped me move in the direction I wanted to go. I really liked my original logo, but something didn't feel quite right about it. I think now I'm getting to the stage where I feel it's complete and I won't have the compulsion to keep making changes...I think I'm my own worst client.  <br> <br>Thanks for the feedback...keep it coming! <br> <br><!---Attachment: logo-rev1.swf-!--></p><center><table border=\"1\"><tbody><tr><td><img src=\"http://www.typophile.com/forums/icons/mime_gif.gif\" align=\"LEFT\" alt=\"application/x-shockwave-flash\">logo-rev1.swf<br><a href=\"http://www.typophile.com/forums/messages/29/logo-rev1.swf\"><b>logo-rev1.swf</b></a> (4 k)</td></tr></tbody></table></center><!---/Attachment-!--><!--!-/attachment-!--><!--!-attachment:--><p></p>"
