    html: <p> first. but the figures seem soooo square in comparison to <br> the nice round courners of the letters. the space in  <br>between the '1' and the '4' is a little too much in  <br>comparison to the space on the outside, ergo i would  <br>make the black box a little bigger and the figs a bit  <br>smaller (or maybe just the box bigger). in fact, i might  <br>take them out of the black box, it seems to go again the  <br>letters in the word 'flow'. or the black box the same  <br>height as the 'flow' and shrink the figs. also, maybe  <br>another issue is the fact the 'flow' is in an extended  <br>typeface, but the figs are not? they seem too dissimiliar to  <br>work? all questions and comments and ideas. one thing i  <br>would not change is 'flow'. </p>
