  html: |-
    <p>Hi all!</p>
    <p>In my leisure-time I am working on a Typeface inspired by an old lettering from a Portuguese Pharma company.<br>
    After some search (posts here in Typophile) I found some similarities with Hubert Jocham’s Milk. But even so I decided to go on.</p>
    <p>I would be thankful if you could take a look at it.</p>
    <p>There are certainly some problems with some glyphs at the moment (for example I dont like the S, T, Y) The V, W, X, Y and Z also need more work...</p>
    <p>Just need some feedback before I can go further with it...<br>
    Thanks a lot for your help</p>
    <p>António</p><div class="imageWrap"><img src="http://typophile.com/files/amarantino_6434.jpg"></div><p></p>
