      <p>Well, neither Times New Roman nor Centaur have any discretionary ligatures as far as I know. Linux Libertine does have both ct and st, but you won’t get to use it with MS Office. </p>
      <p>This is the type fad in all it’s glory: more ligatures, for less money.</p>
