  html: |-
    <p>Medium and Regular are not common surnames, but Black is.<br>
    I must say I’m disappointed that foundries publishing “first name” typefaces haven’t seized on this opportunity to personalize fonts.<br>
    There is no Conrad Black or Jack Black.<br>
    What other fonts create incidental meanings?<br>
    It’s tempting to name a type Psychic…</p>
