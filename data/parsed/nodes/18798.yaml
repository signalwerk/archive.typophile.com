      <p>Thomas, that's what I need. I knew someone did this before, but couldn't find it again or remember who it was.<br>
      Hrant, sure it works for a specific PPEM size, but that's fine. I think most fonts on screen are used between 10 and 13 pixels (correct me if I'm wrong). Pixel fonts can go smaller.</p>
      <p>Is there more info out there? Just experiences from people who did this procedure before. I don't want to step into any (to me) unknown pitfalls. </p>
      <p>Thanx!<br>
      ®</p>
