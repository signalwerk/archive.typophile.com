    <p>Hi guys,</p>
    <p>Think Verdana. I want to start designing a new font and I want to use an underlaying screen grid to get the geometry of the glyphs just right. I don't want to make a grid-font, but want to use the screen grid as a starting point for the porportions. The font should be something like Verdana, Helvetica, DIN, or so. </p>
    <p>Is there anyone that has ever worked this way? Perhaps you have some information on the topic or just anything to get me started the right way.</p>
    <p>I hope that this way the font better works onscreen (in the right pixel size) and might therefor needs less hinting. On the other hand it should work best in print. Therefor the underlaying grid is just a starting point.</p>
    <p>Thanx,<br>
    ®ené</p>
