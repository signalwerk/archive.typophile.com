    html: <p>There are about 300 handlettering fonts that were originally part of a ClickArts Handwritten Fonts set. I have samples of them all shown in the Script Font ID Guide. Most are in Part 11 starting at <a href="http://bowfinprintworks.com/Script11Pg1.html" target="_blank">http://bowfinprintworks.com/Script11Pg1.html</a>. Since that CD is out of print, it's handy to know that good ol' WSI copied and renamed all these fonts and sold them to third party vendors. I built an Alias List that equates all of these to their original ClickArt names, which are the names used in the Script Guide. The Alias List is at <a href="http://bowfinprintworks.com/ListPages/HWFontAliases.html" target="_blank">http://bowfinprintworks.com/ListPages/HWFontAliases.html</a>. Then (last step) you go to this site (<a href="http://iquebec.ifrance.com/jeannine/6fontpolice.htm" target="_blank">http://iquebec.ifrance.com/jeannine/6fontpolice.htm</a>) and download the font for free.</p>
