      <p>It's especially helpful to hear from someone who's been there personally. I've been to 'museums' which turned out to be little more than an enthusiast's personal collection. Not diminishing those types of collections in any way, but it's helpful to know what to expect.</p>
      <p>Ha. I wish I could call this a type excursion, but it's really a holiday with my wife &amp; friends. Just trying to put together as much information as possible so I can prioritize. Thanks for the tips!</p>
      <p>Just found out about Bosu-dong Book Street in Busan. Looks interesting.</p>
