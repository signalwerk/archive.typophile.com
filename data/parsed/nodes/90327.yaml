      <p>Oooh. A type excursion to Korea huh?</p>
      <p>I was in Seoul last year doing research for my dissertation and visited a number of typographic locations you might be interested in going to. I have to say, I didn't go to any of the places you mentioned—please let me know if they're worth going to sometime. </p>
      <p>In any case, depending on what you're interested there's some great spots:</p>
      <p><a class="freelinking external" href="http://english.visitkorea.or.kr/enu/SI/SI_EN_3_1_1_1.jsp?cid=797950" rel="nofollow">Cheongju Early Printing Museum</a>: Not in Seoul, but Cheongju. Has a deep collection of early printed matter and documents techniques used for early printing. I really liked it. </p>
      <p><a class="freelinking external" href="http://www.hangeultium.co.kr" rel="nofollow">Tium Hangeul Museum</a>: Located in Heyri Art village (an hour bus from Seoul). Great little museum all about hangeul and various means of typesetting it. Owned and run by the CEO of Sandoll. While there, visit the Rural Life museum (which had a marvellous collection of old textbooks &amp; ephemera) and the Chocolate house (which had one of the most delicious hot chocolates ever).&nbsp;</p>
      <p>Paju Book City: On the same bus route to Heyri. Though this city is the home of many publishers in Korea, it wasn't at all clear how to explore the collections nor the library supposedly on site. Of particular note, though, is a letterpress studio with full CJK character set and all the matrices needed to produce more metal type. You have to see this place to believe it. But they don't speak any English at all (made asking questions fun). Michael Green showed some pictures of it in <a class="freelinking external" href="http://www.gtfoundry.com/?p=125" rel="nofollow">this post</a> (toward the bottom).</p>
      <p>Sejong Statue: Out in front of the imperial palace there's a monument to <a class="freelinking external" href="http://www.exploringkorea.com/king-sejong-statue/" rel="nofollow">King Sejong</a>. Go around back and down the stairs into the special Sejong exhibit underground. Has original documents of some of the really important Hangeul documents from the 1400s and various highlights of Sejong's career. The Singijeon (rocket arrows) was pretty cool, but in general there wasn't much of interest to me besides the old books (I knew all of Hangeul's History already).&nbsp;</p>
      <p><a class="freelinking external" href="http://www.ssmop.org/index_e.htm" rel="nofollow">Samseong Museum of Publishing</a>: Small little place, not a ton of interesting documents, but it has rotating exhibits.</p>
      <p><a class="freelinking external" href="http://english.seoul.go.kr/gtk/news/reports_view.php?idx=1242&amp;" rel="nofollow">Modern Design Museum</a>: Smallish, but pretty cool little museum. Some lovely old documents including one of the first Hangeul newspapers. No photos allowed tho, sadly, and no museum exhibit book. Boo.</p>
      <p>Other than these, just wander around the neighbourhoods and you'll find all sorts of exciting lettering on signage and such. I look forward to going back!</p>
      <p>Hope that is useful to you. Let me know if I can help more!</p>
