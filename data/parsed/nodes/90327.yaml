    <p>I'll be visiting South Korea (current plans include Seoul &amp; Busan, maybe Jeju Island) for about 10 days in Mar/Apr 2012, would appreciate recommendations on sights a typophile might enjoy. Thanks in advance!</p>
    <p>---------------------------</p>
    <p>Currently on my radar:</p>
    <p>1. Seoul Arts Centre<br>
    - Hangaram Art Museum<br>
    - Hangaram Design Museum<br>
    - Seoul Calligraphy Art Museum</p>
    <p>2. National Museum of Korea</p>
    <p>3. aA Design Museum</p>
    <p>---------------------------</p>
    <p>The Typography Seoul website only displays the <a href="http://www.typographyseoul.com/calendar" rel="nofollow">exhibition calendar</a> from Jan/Feb 2012.</p>
    <p>The <a href="http://design.seoul.go.kr/designseoultour_e/main.php" rel="nofollow">Design Seoul Tour site/handbook</a> has some interesting recommendations:</p>
    <p>Cheonggyecheon Design market<br>
    - Euljiro materials market<br>
    - Kwangjang Market<br>
    - Bangsan Market<br>
    - Dongdaemun Market<br>
    - Cheonggyecheon</p>
    <p>Design Idea Street<br>
    - Sinsadong Garosugil<br>
    - Hongik Univ.<br>
    - Hyoja-ro</p>
