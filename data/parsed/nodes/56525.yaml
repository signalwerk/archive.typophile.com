    html: |-
      <p>Nice, I like it. It looks quite similar to the light weight I'm designing for my typeface <a class="freelinking external" href="http://typophile.com/node/37075" rel="nofollow">Furet</a> (sorry, that thread isn't really up to date at the moment).</p>
      <p>I'm not really digging your a, h, m, n, r, s, u. Going into that:</p>
      <p>a -- I think the sudden angle of the shoulder (top right) is a bit too angular for the typeface.<br>
      h -- I miss the notch.<br>
      m -- Sticking on the second arch to an n doesn't work.<br>
      n -- Also misses the notch.<br>
      r -- I think the ear should start a bit lower.<br>
      s -- Interesting place to put the notches, but not very consistent when compared to the other characters.<br>
      u -- Missing the notches as well.</p>
    html_clean: |-
