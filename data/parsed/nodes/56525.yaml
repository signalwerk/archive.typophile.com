    <p>Hello,</p>
    <p>I draw this font last year. As I design it all alone, I need some new looks on it . So load your guns and start firing your critiques on it. I already think that I have some problems with the thick and thin in the lighter weights… I really used to like the way the connections are joining, at first. But now I have some doubts about it… Does it look legible and aesthetic to you ? Any remarks are welcome, thanks in advance ;)</p>
