    html: |-
      <p>Congratulations, Mamoun.</p>
      <p>The idea of multiple non-Latin companion designs for the same Latin typeface is something that has interested me ever since I designed new Greek and Cyrillic companions for Helvetica. It seems to me that each companion design harmonises with different aspects of the Latin, and this is possible because only within a single script is it possible to harmonise all aspects.</p>
