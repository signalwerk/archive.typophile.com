      <p>Thanks John.</p>
      <p>You are right, different Arabic companions to Latin typefaces focus on certain aspects of compatibility and thus may be useful in certain settings or for different applications. </p>
      <p>The same is true about multiple Latin companions to Arabic typefaces. I have used Shilia successfully with Univers, Helvetica, and in the case of Burj Khalifa with Foundry Sans.</p>
