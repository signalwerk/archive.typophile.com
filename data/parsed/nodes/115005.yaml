      <p>In my view a font should evoke the style of a period, but I have no problem with the use of appropriate fonts that were designed after the time period. For example, I'm using a TV series rather than a movie here, but it's the first thing that comes to mind. In Downton Abby, the classy lettering is Bernhard Modern. Designed more than 20 years after the the series time period begins, it's an expression of the sophisticated tastes of Upstairs at Downton Abby in a way that speaks more clearly to modern viewers than alternative typefaces from the immediate pre Great War period, which might be distracting because they are generally unknown or seem quaint to the modern eye.<br>
      BTW Trajan is the Comic Sans of contemporary movies with a historical theme. Some imagination needed here!<br>
      Don</p>
    html_clean: |-
