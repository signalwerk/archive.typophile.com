      <p><a href="http://www.vudu.com/movies/#!overview/130843/Becoming-Jane" rel="nofollow">Becoming Jane</a> is a typical example, set in late 18th century England (watch the Preview).</p>
      <p>Baskerville, Bodoni or Bell would have been correct. Even Caslon. But Adobe Garamond? That is so 16th century. Or 1990. And letterspaced?</p>
      <p>This is the same practice as book designers, who will use old-styles for 19th century subject matter, not the more appropriate Scotch.</p>
      <p>(However, the handwriting in that <em>Becoming Jane</em> title is nicely done.)</p>
