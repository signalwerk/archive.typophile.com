      <p><cite>This is the same practice as book designers, who will use old-styles for 19th century subject matter, not the more appropriate Scotch.</cite></p>
      <p>Is that such a mistake though? Aren't typefaces like Caslon used because they read well, rather than being contextually correct to the subject matter? I don't think your analogy necessarily applies.</p>
      <p><cite>I don't think that I have such a problem with using typefaces for their aesthetic appeal over historical perfection. It looks really lovely when it's done well.</cite></p>
      <p>Definitely. I don't think there is anything necessarily wrong with it as long as it's a conscious choice and it's well done. In most cases things go wrong due to ignorance though. I think every movie should have a knowledgeable typographer in their team to make sure the typographic details make sense.</p>
      <p><cite>But costumes, hairstyles, language, and many other things often aren't historically accurate in movies.</cite><br>
      It seems you're using this argument to justify the contextual deviations. I know that costume designers and historians will get just as annoyed and passionate about that as we do about typography. The reason we usually don't notice other inaccuracies is because we're either ignorant on the subject or we're just not passionate about it. Only Neil deGrasse Tyson would have complained about the sky in Titanic being incorrect because he has the knowledge and the passion. Only we would point out all the typographic inaccuracies because we have the knowledge and the passion.</p>
      <p><cite>The director is just trying to evoke a time in history, not necessarily be accurate in every detail.</cite></p>
      <p>That's a generalization. I think it's often the director's objective to do make it as accurate as possible. When someone in Lord of the Rings is wearing a watch, that's an overlooked mistake and it can't be justified by saying the director was just setting a mood so not all details need to be accurate. They do need to be.</p>
