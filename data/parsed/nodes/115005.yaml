      <p>Ironically... It seems that people's teeth back past about 300 years were a lot better than we instinctively think... The prevalence of cheap sugar in the colonial period started the rot... so to speak... </p>
      <p>In my opinion the topic of type in films is similar to the role of music and real history in 'historic' in films. It should be correct enough that it doesn't jar the average non-specialist movie goer. But film makers are telling stories so a level of suspended belief should be expected and probably encouraged. </p>
      <p>The opening battle scene in Gladiator was heavily criticised by historians because the Romans never threw their pilla as they advanced, and lost cohesion in the melee... but 98.5% of viewers neither knew or cared and probably weren't interested in being educated. In the same way, it probably wouldn't matter if they used Times New Roman for the title rather than Trajan or a custom imitation of some Roman text off a ruin. On the other hand it would probably jar an audience to see 'Gladiator' written in the Star Wars font. </p>
