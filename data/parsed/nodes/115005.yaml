      <p>When Trajan is used on a poster I think you can almost guarantee it's contextually wrong. As I said in an other thread, don't put a glyphic roman typeface on a movie about Egyptian mummies (The Mummy) or on a movie about a 1912 British ship (Titanic).</p>
      <p>I don't really agree with Mark Simonson when he says the title on a movie poster doesn't have to be contextual. Indeed the rules are not as strict as on in-movie typography, but selecting a glyphic roman typeface to represent everything surrounding the RMS Titanic is just ignorant. Other than that, I greatly enjoyed the blog posts.</p>
