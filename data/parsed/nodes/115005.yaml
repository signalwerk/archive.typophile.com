      <p>@Martin Silvertant:<br>
      <cite>You seem to be insinuating this is objectively true.</cite></p>
      <p>Yes. I <em>was</em>.</p>
      <p>When one is watching a movie, the ideal is that it should be as if one were viewing <em>the actual events depicted</em>, somehow recorded as they were happening in real life.</p>
      <p>So an anachronistic typeface is a continuity failure. And, unlike expecting Hollywood actors to even have their heads shaved, let alone their teeth damaged (hey, but maybe someday we'll be able to do this with CGI), it seems an easily remedied one. I mean, they still will print fake newspapers on laser printers or whatever - setting up stereotype plates with resuscitated Linotype machines and Ludlow machines (doing Bodoni much of the time) is a <em>little</em> too much to expect.</p>
      <p>Titles, credits, and even subtitles are the packaging on the box the movie proper came in. When you see a title, you know you're watching a movie - documentaries have titles too, but the title, credits, and subtitles of a documentary <em>aren't part of what's being documented</em>.</p>
      <p>So while I'm entirely OK with saying that those typefaces ought to "belong", if they're anachronistic, we're not seeing something that's in any sense logically impossible. A bad choice of typeface is simply an aesthetic failure, not a failure of the movie to present to the eyes what it pretends to present to the eyes.</p>
      <p>However, there is another half to your argument that <em>is</em> valid that I simply skipped over for reasons of space and simplicity in my original post.</p>
      <p>People watch <em>stage plays</em> for enjoyment. Even when they're performed by <em>high school students</em>. Thus, while it is an ideal to present to the eyes the actual events a film depicts, it is not a logical requirement of a well-made film that production values be infinite so as to achieve absolute perfection.</p>
      <p>Thus, while some fanatical Star Trek fans may disagree with me, one couldn't really expect them to have cloned William Shatner, Leonard Nimoy, DeForest Kelley, Nichelle Nichols, James Doohan, George Takei, Walter Koenig, Majel Barrett, Grace Lee Whitney, and any other actors who would have been required, some 20 years or so before making the current series of Star Trek prequels.</p>
      <p>So I will agree that historically correct typefaces are not an absolute logical necessity for a successful film, if that was your point.</p>
