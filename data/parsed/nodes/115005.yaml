      <p>I think Mark Simonson is right. Text on a movie poster, and on the opening titles and closing credits of a movie, should be appropriate aesthetically, emotionally, and evocatively to the content of the movie. But there is no question of anachronism involved, unlike the case of typography on props within the movie.</p>
      <p>It isn't a question of the same rule applying, only less strictly. The rule against anachronism does not apply <em>at all</em>, but an entirely different rule applies, although that rule <em>may</em> be best satisfied by a typeface which was available during the period of the events in the movie, since by being associated with the time, it might also be evocative and suggestive of the movie content.</p>
    html_clean: |-
