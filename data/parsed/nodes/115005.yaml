      <p>^ That's an interesting point. In The Artist, for example, it's clear that the typeface used for the opening credits, I think, are supposed to be evocative of the era, but not a perfect representation of that time period.</p>
      <p>However, after reading Simonson's article and some of his list, I was struck by how much other glaring anachronistic and misused type was present in The Artist! For such a high profile, critically acclaimed film, I honestly expected more. I don't think the surprised expression has left my brow yet.</p>
      <p>I simply do not understand why one would not enlist the help of a professional typographer to make things accurate. Even without, google is more than helpful when it comes to choosing a proper typeface. Just as they research costumes and the like, so, too, should they research typefaces.</p>
      <p>But I guess google searches (like dystopias and accurate science) are too hard for some movie-makers to accomplish. Too harsh?</p>
