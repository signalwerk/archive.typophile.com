      <p>Armenia is very close to the Black Sea, and one theory about the great flood (published in academic journals) is that the Black Sea was created in a catastrophic event around 5600 BC when waters from the Mediterranean Sea breached a barrier and rushed in to create the sea. </p>
      <p>Since thousands of square miles were flooded, and communication methods were primitive, someone living in that area might indeed feel that whole world (from their perspective) was flooded.</p>
      <p>So maybe Noah was sort-of Armenian! ;)</p>
      <p>(I don't believe the Bible story is literally true, but it might have been loosely based on some actual events.)</p>
