      <p><cite>It isn't a question of the same rule applying, only less strictly. The rule against anachronism does not apply at all, but an entirely different rule applies, although that rule may be best satisfied by a typeface which was available during the period of the events in the movie, since by being associated with the time, it might also be evocative and suggestive of the movie content.</cite></p>
      <p>You seem to be insinuating this is objectively true. I can't completely agree with that. For some reason we became accustomed to the idea that in-movie typography needs to be contextual while the typography on the movie only needs to be aesthetically pleasing, but that's very different from arguing that this should be the case objectively. There is logic in placing the typography in the movie in the correct time and setting of the movie, but there is also logic in the design of movie posters. A movie poster is a visualization of a mood of the movie and needs to be rationally crafted to communicate exactly that. Arguably the Titanic poster does that, but it's not the most coherent in its message and this could easily be improved with better typography. The typography doesn't necessarily need to be contextually correct in regard to the movie, but it does need to be contextually correct in regard to the mood of the poster, which in turn has a strong relation with the movie. Because, if only aesthetics matter, why not use a magenta background for the poster? Because if magenta is not a prominent color in the movie, the poster doesn't have a clear relationship with the movie. Why would you expect such consistency in color, composition and theme, but not in typography?</p>
      <p>John, I think in a roundabout way I said just about the same thing as you. I agree with your distinction, but in practice it will always bother me if it doesn't adhere to my logic. This is why I'm not convinced it's an entirely objective matter.</p>
