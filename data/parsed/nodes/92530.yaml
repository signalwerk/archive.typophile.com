  html: "<p>Hi everyone,</p>

    <p>I'm looking for some critiques for this project I'm working on at the moment. This is my first type design project so far.</p>

    <p>\"Interborough is inspired from the signage system of IRT, (Interborough Rapid Transit, hence the name) New York subway system in the 1900s – 1940s. Interborough collects the inconsistent characteristics of thosesigns and combines with a personal touch to create a new, unique design itself. The sans-serif typeface explores the American compact modular style and try to balance the solid, geometric form with the subtle curviness in its minor eccentric details. Interborough employs a con\x1fdent and optimistic look that is found in visual designs of early 20th century. In short, Interborough is unique but familiar, structured but versatile, nostalgic but up-to-date.\"</p>

    <p>I want this typeface to not only function well for signage, display purposes (I will have Display variations with king caps) but also usable as a text typeface (for relatively short body of text).</p>

    <p>I have attached in this the PDF file with glyph table, waterfall and sample body text. At the moment I've just pretty much design the glyphs, so I know the kerning at the moment is quite terrible, sorry.</p>

    <p>Hope you can take a look and give me some feedbacks!</p>

    <p>Cheers,</p>

    <p>G</p>

