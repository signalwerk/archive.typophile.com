    html: |-
      <p>While I like the twist to the |Q|, I believe it will look like a fault to the readers eye; the alternative is nice, but looses some of the originality, something inbetween maybe? </p>
      <p>LexLuengas already mentioned the distrubing look of the touching |%|, I totally second that.</p>
      <p>The very curvy shoulders on |n|m|h| make them look extra squeezed next to, say, the |g| or |e| - |b|d|q|p| have less parallel strokes in them, so with those I think it looks good, even though the connection to the stem seems very sharp to me (the |d| and |q| more so than the |b| and |p|). I think this also makes those letters' shoulders visually jump out above the x height in the text samples.</p>
      <p>Just my novice comments, really like the feel of the font :)</p>
