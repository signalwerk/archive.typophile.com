    html: |-
      <p>-I agree with the comment above about the R, perhaps use the alternate at the bottom of the page.  </p>
      <p>- The lowercase double bowled "g" is nice, however I do not think that it is cohesive with the rest of the typeface.  Again use the alternate in the mix to see how it works the second time around.<br>
            -if you really want to use the double-bowl, I would suggest that you make the negative spaces a little larger<br>
             so that you can maintain the same look throughout the typeface, which has turned out really nicely.  </p>
      <p>-It seems that a few letters are "cut-off" as LexLuengas has pointed out.  Perhaps just make these sections a little longer so that it seems like they are finished.  </p>
      <p>I appreciate the use of hipster lorem.  Definite +1.  Kerning would be a great next step.  I know this process isn't easy, and the typeface looks great!</p>
