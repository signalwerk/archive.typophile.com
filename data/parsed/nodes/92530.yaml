    html: |-
      <p>- I'm not sure if that /R/ works.<br>
      - /w/ and /m/ have different width, and therefore also different color.<br>
      - Why that colliding /%/?<br>
      - /k/ is malformed and too wide.<br>
      - /r/ is also too wide.<br>
      - The turn of the stem of /a/ at the lower right looks cut.<br>
      - I'd make /c/ and /s/ align with their terminals when written together (/cs/).</p>
      <p>Remember to be sceptic about my comments :-) Good work so far. I think you can start with the kerning.</p>
