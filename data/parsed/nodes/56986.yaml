    <p>So I’m currently looking to create a personal mark for placement on resume, website and possibly a business card. As much as I need this, I’m also looking to make this a good learning experience so please feel free to be blunt and honest. </p>
    <p>I’ve decided to show a variety of samples just to see if anyone sees any potential in a particular direction. The focus thus far is on my name and my initials ’KM’ as I don’t particularly want to brand myself as a company, just as an individual. (Is there a danger in doing something as common as your initials?)</p>
    <p>Any and all feedback and comments are appreciated. Thank you in advance.</p>
    <p></p><div class="imageWrap"><img src="/files/kmlogos_3676.gif"></div><p></p>
