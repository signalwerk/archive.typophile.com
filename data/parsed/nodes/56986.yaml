      <p>@melo: Very nice. FWIW the mark has grown on me. It is simplistic, beautiful and it is memorable. A couple of things though that stick out in my opinion. One, the angle of mark doesn’t match the angle of the italics. Two, second line is overpowering the top one. I think smaller type in the second line might work quite a bit better. I’d also consider setting both lines in italic or dropping the italics altogether.</p>
      <p>@bemerx25: <a class="freelinking-external" href="http://www.hyperic.com/images/customers/mosso-logo.png">This one</a> ? Even if they were not deprecating its use, it is pretty far from Kevin’s version. As in “impossible to mistake one for another”. Three vertical strokes at a slight angle is a very generic pattern, so it all comes down to the styling and decoration. And these are different between these two logos.</p>
