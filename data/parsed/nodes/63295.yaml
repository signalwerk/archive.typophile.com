  html: |-
    <p>So <a href="http://www.markboulton.co.uk/journal/comments/web-directions-typographic-structure/" title="Typographic structure">says Mark Boulton</a>:</p>
    <p><strong>When I was in uni­ver­sity, I sent off for every type spe­ci­men sheet I could get my hands on…. Receiv­ing the can­vas bags stuffed with font sup­ple­ments from T26 was cer­tainly a high­light of my first year. Why? Well, firstly, type sup­ple­ments are nor­mally <em>beau­ti­ful things</em>. They didn’t neces­sar­ily make me look at type any dif­fer­ently, but they made me want to <em>col­lect</em> type…. [I]t’s a mind­set that leads to a shal­low under­stand­ing of the broader craft. You get dis­trac­ted by the next beau­ti­ful typeface. You’re con­stantly on the search for the typeface that is <em>just right</em>. Font choice is not the most import­ant decision you make when design­ing with type.</strong></p>
