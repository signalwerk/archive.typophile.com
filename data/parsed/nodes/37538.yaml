    <p>I spent some time with my in-laws in England this Summer. As usual, I was on the lookout for interesting signs and type</p>
    <p>These gems were found in the pantry<br>
    </p><div class="imageWrap"><img src="/web/20080905141141im_/http://www.typophile.com/files/bread_3645.gif"></div><p></p>
    <p>This bread bin is at least 50 years old. I think the type treatment is quite modern, or is it?</p>
    <p></p><div class="imageWrap"><img src="/web/20080905141141im_/http://www.typophile.com/files/glycerine_4224.gif"></div><p></p>
    <p>I believe this little bottle is about half a century old, too</p>
    <p>The old street signs are interesting, too</p>
    <p></p><div class="imageWrap"><img src="/web/20080905141141im_/http://www.typophile.com/files/greenhead_6492.gif"></div><p></p>
    <p></p><div class="imageWrap"><img src="/web/20080905141141im_/http://www.typophile.com/files/highfold_lane_3653.gif"></div><p></p>
    <p>Note the pointing hand!</p>
    <p></p><div class="imageWrap"><img src="/web/20080905141141im_/http://www.typophile.com/files/view_st_4188.gif"></div><p></p>
    <p>a close up</p>
