      <p>Thomas: <em>In the Netherlands I expect you could register copyright on the design</em></p>
      <p>In the Netherlands the copyrights on the type design and the digital data are covered by the ‘auteursrecht’, i.e., the right of the author, which is automatically assigned to the author and does not require any special registration (but it makes sense to document everything well, of course).</p>
      <p>The ‘auteursrecht’ can be transferred via a document signed by the parties involved. However, recently I read that there are ideas at governmental level to make the transfer of the ‘auteursrecht’ impossible by definition. In that case only the ‘gebruiksrecht’, i.e., the user right, could be transferred.</p>
      <p>FEB</p>
