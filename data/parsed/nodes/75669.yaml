      <p>I am quite willing to believe that this can happen, but I've also witnessed some people seeing “based on” in an independently developed design. If your perceptions are accurate, then that sucks, and I'm sorry. Without a lot more details it's really hard to give any useful advice....</p>
      <p>As for protecting your work up front, your #1 move should be to consult a lawyer who knows this area. My NON legal thoughts are that if you were based in the USA you could register your copyright prior to submitting it to anyone. That would seem to be a useful protection, but only on the font software, not on the abstract design (for which you'd need a design patent, which is more expensive and more time-limited). In the Netherlands I expect you could register copyright on the design, which would be even better, but people more familiar with Dutch law could comment more.</p>
      <p>Cheers,</p>
      <p>T</p>
