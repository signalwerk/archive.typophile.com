    votes: null
    html: |-
      <p>I also believe this can happen.  My own experience ;<br>
      Top image is my own Mako typeface, started whilst on Reading Uni type design MA. Bottom image is a custom font for Lurpak butter, aka 'Lurpak Sans'. Similarities?<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/mako_4662.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/lurpak_5410.jpg"></div><br>
      You may say conicidence or synchronicity, but bear in mind that the people that created 'Lurpak Sans' had my Mako files for some months whilst they decided whether to publish my typeface or not. To my eyes, and others, it looks like they may have finished Mako themselves ;) The foundry denies any similarity to my designs or use of my files.<p></p>
      <p>How to protect your designs. I have spoken to a number of other type designers on this protection issue. Interestingly many of us do similar things. Kind of an open secret. Whilst you can not practically stop theft, you can leave 'traces' within files themselves, to aid identification of authorship at a later date if necessary. These traces can be embedded in glyphs or within font tables, in the source files and the font files. The chances are that someone too lazy to do all their own design work may also be too lazy to scour the files for all your hidden breadcrumbs ;)</p>
