      <p>AFAIK Dutch law says that there is an aspect of copyright (auteursrecht) that is nontransferable and bound to the author/creator — called ‘persoonlijkheidsrecht’ (roughly: personality right), that covers the absolute protection of the product against mutilation and other actions that change the product in a more or less negative way. </p>
      <p>It has been used in procedures by architects (or their heirs) in cases where buildings were to be altered or even torn down. (A lot of these claims have been thrown out by judges, mostly because of a lack of expertise…)</p>
      <p>In the case of graphic design (and typographic design, I guess) this could mean that an original design may never be changed without the consent of the creator, even if all rights of use (license) have been transferred.</p>
      <p>Example: I have done an Identity Programme for a council and licensed the use of the logo I created (and the design for an unlimited amount of designs in the sphere of a CI) to them for a period of 10 years. In principle the client can do whatever they want with it, but I have a legal recourse in case of usage that would be adverse to my rights as the creator. Although this is largely hypothetical, I could imagine cases where an intervention could be necessary, eg the combination of my logo with fascist symbols and such. Or adding ugly pay-offs to the logo…</p>
