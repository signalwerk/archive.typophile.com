      <p>This is an interesting thread. </p>
      <p>I actual WON a legal battle with a company that had stolen my work.</p>
      <p>Font piracy is one issue that I have had problems with.  I've lost thousands of dollars in potential sales because of font piracy. One website alone had distributed what would have been over $750,000.00 in sales had they been sold instead of shared. I make nowhere near that on my designs. I contacted the website and offered to them to either settle the matter by paying me 10% (about $75,000) or they could immediately remove my fonts from their site. They removed them in less than three hours. </p>
      <p>But stealing font designs is another matter.</p>
      <p>Just last month, I settled a legal dispute with a company (more a scrap booking company than a Type Foundry) that had taken one of my font designs and literally used the font software to create their own font that they then began selling. I first saw their design a couple of years ago on MyFonts. They had taken my work and created a font of "word art" glyphs instead of individual characters of my font. Not really knowing how to handle it at the time, I let it go and  did nothing about it until this past summer. In July, I decided I would contact MyFonts and inquire as to whether they believed this was ethical, appropriate or a legitimate violation of my license agreement. MyFonts agreed that it appeared they had used my work as a base, but since it wasn't an actual "duplication" of my font design and since sales on the design this company was offering were low, it probably wouldn't be worth pursuing on a legal level.</p>
      <p>Less than a week later, the same company released on MyFonts another version of the font with the individual characters. Each character had been slightly altered, but it was obvious they had used my work to create theirs. The font I had designed was selling for $24.95 and their unauthourized version was selling for about $3.00. Now, I was annoyed to say the least. In preparing for the legal battle that I assumed would be coming, I purchased their version of the font at MyFonts and began doing some comparisons and research. </p>
      <p>Sure enough... After doing some research, I found the date that they had purchased MY font from MyFONTS. The creation date of the font I purchased was just three days later. I then took their font, and superimposed it onto mine. With a few minor manipulations (like skewing, and scaling) specific vector points matched perfectly. In addition, some of their metrics and kerning were identical to my original. There was absolutely no question that they had used my software to manipulate and create their font.</p>
      <p>I contacted MyFonts again, and in detail described how my digital font work had been manipulated and released under a new name by another vendor without my permission. At the same time, I contacted a copyright attorney. MyFonts responded quickly by removing BOTH fonts that had used my design. Meanwhile, my attorney drafted a letter to the company that had violated my intellectual property. Now the negotiations would begin.</p>
      <p>After just a few short months we came to a settlement. They agreed to pay me damages for using my intellectual property and we both avoided a court battle—which frankly, would have been very expensive (probably in the tens of thousands of dollars). Believe me, the font isn't that popular and certainly hasn't generated that kind of income. The victory was one of principal and not one of monetary gain.</p>
      <p>In our settlement negotiations, the company explained that they do their best to insure that their font developers (freelance artists) are not using other people's work to create fonts they submit. I took them at their word, and they apologized for this embarrassing situation.</p>
      <p>So, there is legal recourse that can be taken and can be resolved amicably, but one must be absolutely sure to have their ducks in a row before going down the path of legal action. </p>
      <p>My personal opinion... a legitimate foundry won't steal your work. There is too much at stake. Mainly, their reputation. If your work is quality, don't bother with smaller or unknown foundries. If someone steals your work... get an attorney immediately.</p>
    html_clean: |-
