    html: <p>There have been cases where I have shown work to a foundry and they have politely said that they would not accept my font because they had one similar enough to it in the works that they would compete with each other. They were upfront about it and I take them at their word. I don't know what happened in your case. But what has been said is correct. In this business, everyone knows eachother and this sort of thing is quite rare. Pirates and font thieves are not legitimate foundries. Foundries are more often the victims.  If you do have such a case, you should first confront the foundry in question and hear their side. If this is not satisfactory, stating your case here in an honest and fair manner without assumption of guilt would allow an airing of both sides of the story.  If there is such a beast out there in this business, the world has a right to know the situation and the foundry has the right to have its say on the matter.</p>
