    <p>You know that feeling? Your submission has been rejected by the font foundry then some months later the same foundry release a font based on your designs...</p>
    <p>What is the very best way to protect against this type of piracy? Are there standard ways to prevent it? What is the best approach to archiving/protecting/etc digital font files and/or printed type specimens?</p>
