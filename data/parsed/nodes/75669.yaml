      <p>The best way to protect your property, and new font design, is to document everything carefully.</p>
      <p>If you still have your email (or registered snail mail) to the 'foundry' in question, then, I believe you have legal grounds to stand on.</p>
      <p>Hire yourself a lawyer and go after them for damages.</p>
      <p>However, that being said, the courts in the U.S. are not sympathetic or understanding of font development and type design work in general.</p>
      <p>It would be a costly and difficult battle. But, if you feel that strongly and you have the proof in hand, go for it.</p>
      <p>In the future, unless you have an established relationship with that person, I would recommend not sending samples of your new type design to any foundry directly. Instead, post your ideas and solicit help from this 'Type Forum' to document your work and get help. if needed, to complete the overall design process. Once completed, sign a contract with a reputable font distribution site, like 'myfonts.com', upload your design, test and go live. This is probably the best way to proceed.</p>
      <p>It may be that the 'foundry' in question, was working on a similar idea as yours. But, they should of said that in the correspondence. If not, they may have stolen your design idea.</p>
      <p>In any case, I sympathize with your predicament. I'm sorry this has happened to you.</p>
      <p>If you give this 'Type Forum' more specific information, we may be able to help you resolve the matter further.</p>
      <p>All in all, good luck going forward. Remember, be careful and take the necessary steps to safeguard your work.</p>
      <p>That's all any of us can do.</p>
