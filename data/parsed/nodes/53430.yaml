  html: |-
    <p>I have a complete vfb file from which I'm generating Post Script flavored Opentype (otf) fonts. Can I use this vfb file to generate a True Type flavored Opentype font (ttf).</p>
    <p>Is there anything I need to change in the vfb to generate a proper ttf font.</p>
    <p>Do I need to change the direction of the paths or change the hinting ?</p>
