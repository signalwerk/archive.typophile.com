    html: |-
      <p>You will need to change quite a bit, however there is an Action Set that will do a lot of the work for you.<br>
      You will need to check the TT hinting, to see if FL has screwed anything up. Also check the gray scale settings and the additional blank glyphs required for TT flavor.</p>
