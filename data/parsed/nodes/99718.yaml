  html: |-
    <p>Today I’m happy to announce our <a href="http://grillitype.com" rel="nofollow">new website</a> (including an all-new shop system) as well as our newest release, <a href="http://grillitype.com/typefaces/pressura" rel="nofollow">GT Pressura</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gt-pressura-font-6_4112.png"></div><p></p>
    <p><a href="http://www.grillitype.com/typefaces/pressura" rel="nofollow">GT Pressura</a><br>
    Designed by <a href="http://www.moire.ch" rel="nofollow">Moiré</a></p>
    <p>Inspired by type stamped on shipping boxes, GT Pressura uses the visual effect of ink spreading under pressure as a stylistic device. The condensed sans serif alludes to a scientific background but with its rounded corners shows a soft and friendly side in larger sizes. With proportional and monospaced variants it is able to hit a wide range of notes whenever needed.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/gt-pressura-font-6_5650.png"></div><p></p>
