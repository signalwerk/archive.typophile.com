    <p>I had been looking around for Hebrew fonts on the Web, now that my understanding of which font is which has improved.</p>
    <p>I found that I was navigating the Calmus site wrongly, and they do have versions of their fonts available that work on Windows, not just for Linux.</p>
    <p>However, I also found some puzzling things.</p>
    <p>One is that the free Hebrew font from Bible Study Tools appears to be a demo font, because two of the final forms - for Kaph and Mem - are reduced in size slightly, so they don't come up to the normal top line of the other characters.</p>
    <p>This could be intentional to prevent it from being used commercially for publishing instead of just viewing texts, but I didn't see anything about that on their site.</p>
    <p>Another is that I couldn't find a font corresponding to the type style labelled as "Rabbinic" in old type catalogues, such as that of ATF. This style is better known as "Rashi", and is the style used for some of the Gemara in traditional editions of the Talmud, to distinguish them from the Mishnah. (There is a closely related style, "Vaybertaytsh", used for Yiddish typesetting. I haven't found any fonts for that style either.)</p>
    <p>Except, that is, until I found one site which had a mix of freeware and shareware fonts; it didn't identify which was which. They mentioned a Rashi font. It turned out it was part of a package of six fonts, and those fonts actually belonged to an application program for typing Hebrew on your computer. Under Windows 3.1, and they were non-Unicode. The package was shareware, though.</p>
    <p>I looked to see if I could find the present site of whoever made the program. I didn't find that, but I did find the Rashi font by itself, billed as a free font, on a font search site. That, though, isn't necessarily evidence that it's really a free font now, as many designers here know all too well. What I couldn't find was a current site either for the font's designer, Aaron Schmiedel, or for the company that made the shareware program, KESHERworks.</p>
