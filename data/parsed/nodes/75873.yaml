      <p>This is a set of fonts that Shmuel Gutman created for a now-defunct company called Accent-Kivun. Microsoft bought these typefaces and bundled at least some of them (including Koren/Keren) in Office.</p>
      <p>I can of course only comment on the Koren font. This was not produced by Mr Gutman z"l with permission of Koren and is now the subject of a court case between Koren and Microsoft!</p>
      <p>I don't think they were designed for IBM though. Kivun was a company creating a multilingual wordprocessor which allowed different keyboards and language support the idea being that european companies might find this useful. Half of my friends worked there at the time (it was a company employing all the frum anglos in Jerusalem!</p>
      <p>I told them that the concept was irrelevant since the next version of Windows allowed this functionality built-in. The response was, er, really? The company went bankrupt shortly thereafter!</p>
