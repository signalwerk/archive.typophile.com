      <p>Well, I found another allegedly free Rashi font floating around the Web. This one is a Unicode font, and it belongs to a collection called the "Kivun Core Fonts".</p>
      <p>A web search turned up a claim that they were designed for IBM at one time long ago, and it gave a list of the styles in the package.</p>
      <p>The one I found, though, contains at least one font that tells me that this can't <em>possibly</em> be a set of free fonts. One of them is called Koren!</p>
