    <p>This is one of my first times posting, but I’ve read tons of the threads in this forum. I love what you guys do here, so I’m coming to you with my dilemma. I’m having a bit of difficulty with a logo I am creating. It is a personal project of mine, and I am having trouble with font weights.</p>
    <p>I am a college student, and I am starting my own personal online portfolio. I do a bit of freelance work, and I would like to get my name out there. These are the first drafts of my logo, and this was one direction I was considering going in.</p>
    <p></p><div class="imageWrap"><img src="/files/wonderpixel_3453.png"></div><p></p>
    <p>I’m a bit fond of the squares, but for some reason they look awkward to me. However, I am in love with the font (Gotham).</p>
    <p>I also played with the idea of using a ’super-hero’ looking logo with a shield and a big bold ’W’ with the url of my website-to-be underneath as a tagline. I don’t see this done very often, and it might be a fun idea to play around with.</p>
    <p>Suggestions?</p>
