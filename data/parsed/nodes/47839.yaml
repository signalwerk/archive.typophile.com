      <p>“wonderpixel” is a great name: super fun and interesting.</p>
      <p>Right now, I think that the mark is too small and does not balance well with your type.  Also, your kerning is all over the place, although maybe you just quickly posted these mock-ups to give up some idea of your direction.</p>
      <p>I think overall it’s a bit static, and doesn’t evoke enough of a sense of “wonder” or “pixel.”  The colors are nice, though.</p>
      <p>A few questions:</p>
      <p>What does it look like in black and white?<br>
      Did you start with pencil and paper?</p>
      <p>—<br>
      Nick Hladek</p>
