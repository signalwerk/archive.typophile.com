    html: <p>I guess my use of the word "new" is pretty ambiguous here.  I mean a calligrapher creates a new physical object, not arranging old pieces to make a new object.  Even though I guess you could say that the calligraphers style doesn't have to be new.  Hmmm, this is actually harder to explain than I thought it was.  Somebody help me out here?</p>
