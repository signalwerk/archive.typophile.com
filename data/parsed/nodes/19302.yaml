    <p>The thread about the stressless zero got me thinking of the wee little zero on the (American) Lincoln cent. Then when I checked the reverse of this coin (pre-1959, aka “wheat” cent), I noticed the arts-and-crafts style of “United States of America.” Which leads me to ask if people could suggest some good resources specifically on typography and coins. I’m particularly interested in machine-age and forward, but anything could be interesting. Thanks!</p>
    <p></p><div class="imageWrap"><img src="files/98_1_b.jpg"></div><div class="imageWrap"><img src="files/26_1.jpg"></div><p></p>
