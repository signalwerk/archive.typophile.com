      <p>Dan</p>
      <p>Gutenberg was associated with the guild but he was never a member. The assumption that he worked in this capacity is tenuous. That punching was established is clear. The trick though was not merely punching but to set up a system that would allow for a mechanical method of setting that would yield a printed page as good as or better than the written page produced by a scribe or copyist. I suspect Gutenberg worked out the mechanics of it but more likely Schoffer, a trained copyist, worked out the typography.</p>
      <p>But by the way…. Gutenberg never sold the books. The contract for producing “the work of the books” (the Bible) was annulled (the Helmasperger Instrument). Fust sold and reaped the profits. Gutenberg got paid for supplies and equipment furnished and asked for nothing further.</p>
