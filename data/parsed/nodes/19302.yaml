    html: <p>Gutenberg’s father was a member of the currency-production operation in Mainz. Gutenberg’s father was a noble, but he was not, so I don’t think he could have ever risen to whatever position his father might have had. But some scholars believe that young Gutenberg may have worked producing Mainz’s coinage before leaving the city for Strasbourg. The lettering on coins were struck with punches, just like the punches Gutenberg would later develop in order to produce the matrices he would later need to found metal type! They speculate that had Gutenberg not had this knowledge, he never would have invented his printing method. Of course, there is a large dose of speculation here, because none of Gutenberg’s punches or matrices or even type have survived, just the finished products he sold… the books.</p>
