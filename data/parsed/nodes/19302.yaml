    html: <p>As far as I can tell the relationship between print typography and stamping (coins, medallions) has never been adequately explored. Though it would likely reveal a great deal. Especially, pre-Machine Age. Or specifically, the initial development of Western typography. It may have been a social/cultural thing, but repeatible images were practiced for stamping in ancient times; it just never seemed to have successfully caught on for print media until the mid 15th century.</p>
