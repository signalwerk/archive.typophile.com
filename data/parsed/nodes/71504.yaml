      <p>Igor, </p>
      <p>there are at least three Cyrillic extensions of Charter:<br>
      * the official ITC Charter Cyrillic, published by ParaType, designed by Vladimir Yefimov<br>
      * Charis SIL, designed and published by SIL International, based on an opensource version of Bitstream Charter<br>
      * Khartiya, designed by Andrey Panov, based on the same opensource version of Charter BT</p>
      <p>I strongly prefer Vladimir Yefimov's version. Charis SIL is quite poor, Panov's version is adequate but not as good as Yefimov's, which is just great. I believe Yefimov's Charter Cyrillic is one of the best Cyrillic text faces available. In fact, the Russian edition of Bringhurst's "The Elements of Typographic Style" is set in it, while the original version is set in Minion. Matthew Carter also once told me that he is quite fond of Yefimov's Cyrillic for Charter.</p>
