      <p>For overall style of Greek, to go with a contemporary serif design like your Latin, you might look at Minion and Constantia as helpful examples of good design for the basic characters, but you should also look at Parachute's fonts for what contemporary Greek designers are doing. By contrast, Garamond Premier has a very nice design, but it's very traditional - like Garamond in general - so not as suited to your Latin. The most important choice is what balance you make between respecting the distinctive qualities of Greek script versus harmonizing the style with your Latin.</p>
      <p>Small caps (and thus also petite caps) in Greek work the same way as in Latin, except that you have to do more complex OpenType coding to get the diacritics to behave correctly, especially in polytonic Greek. In particular, diacritics are mostly not used on text set in all caps or all small caps, but they are used on uppercase letters in mixed upper/lowercase setting. Also, watch out for the difference between iota subscript (ypogegrammeni) and iota adscript (prosgegrammeni).</p>
