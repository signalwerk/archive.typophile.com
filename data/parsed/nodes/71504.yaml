    <p>I'm planning to add Greek and Cyrillic support to the <a class="freelinking external" href="http://www.typophile.com/node/67787" rel="nofollow">font</a> I'm developing. My question is: which glyphs must I add? Unicode tables have archaic letters and additional signs I suppose are not necessary (at least, not all of them).</p>
    <p>What I think to add:</p>
    <p><strong>Greek</strong><br>
    0374<br>
    0375<br>
    037A–03CE<br>
    1F00–1FFF</p>
    <p><strong>Cyrillic</strong><br>
    0400–045F<br>
    048A–04F9</p>
    <p>This is enough? Am I missing something?</p>
    <p>Besides this, I'd like to know about serif fonts with good design for Greek and Ciryllic alphabets. I believe Minion is one of these, but it would be great to have others to analyse and research their typographical solutions for non-Latin glyphs.</p>
