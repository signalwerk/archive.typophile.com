    html: <p>In regard to Greek, for basic minimal support of monotonic Greek you need all the characters highlighted <em>except</em> 037A through 037D and 03CF. However, in addition to these you may also need 03DB, 03DF, and 03E1, which are used for old-fashioned numbering (much like Roman numerals in Latin script). And, if you have OT code for case-switching, you will need the uppercase equivalents of those also.</p>
