      <p>For Cyrillic, I did a bunch o' research on the different languages needing different characters, for Adobe. Results are posted here:<br>
      <a href="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html" title="http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html">http://blogs.adobe.com/typblography/2006/08/defining_an_ext.html</a></p>
      <p>See also my and Miguel's work on extended Latin character sets:<br>
      <a href="http://blogs.adobe.com/typblography/2008/08/extended_latin.html" title="http://blogs.adobe.com/typblography/2008/08/extended_latin.html">http://blogs.adobe.com/typblography/2008/08/extended_latin.html</a></p>
      <p>For Greek, the #1 decision you need to make is whether to support polytonic Greek or only monotonic. Polytonic is used for classical Greek, but was also used for Greek in general prior to 1982. I gather reproducing or reprinting work from 1982 or earlier can require it.</p>
      <p>Cheers,</p>
      <p>T</p>
