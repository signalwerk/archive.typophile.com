      <p>Thanks Paul.</p>
      <p>Re. the Palochka: My theory is that in this kind of scripty italic, a roman "el" represents the "uncased" version of "I" stylistically, i.e. a tall baseline-to-cap-height stroke. </p>
      <p>However, I could use the upper case italic "I" form, with four serifs, but make its stroke width much narrower, as I've done in the roman. In the italic, that wouldn't fit well with other characters, though. I wonder how the Palochka appears in text. Perhaps it's not an issue if it never appears in the middle of words. What language is it used in?</p>
