    <p>This is for a font that will support Paratype's <a href="/wiki/Cyrillic" class="freelinking">Cyrillic</a> Asian codepage.<br>
    I've had a look at the Unicode examples, but they're in roman only.<br>
    I've had a look at some of the italic fonts at Paratype (eg Octava) which support the encoding, but there are still a few things I'd like to hear some opinion on. Would anybody like to comment?<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/CyrExt_5383.jpg"></div><p></p>
