      <p>On further investigation:</p>
      <p>Unicode Standard, version 5: <em>Palochka. U+04C0 “I” cyrillic letter palochka is used in Cyrillic orthographies for a number of Caucasian languages, such as Adyghe, Avar, Chechen, and Kabardian. The name palochka itself is based on the Russian word for “stick,” referring to the shape of the letter. The glyph for palochka is usually indistinguishable from an uppercase Latin “I” or U+0406 “I” cyrillic capital letter byelorussian-ukrainian i; however, in some serifed fonts it may be displayed without serifs to make it more visually distinct. In use, palochka typically modifies the reading of a preceding letter, indicating that it is an ejective. The palochka is generally caseless and should retain its form even in lowercased Cyrillic text. However, there is some evidence of distinctive lowercase forms; for those instances, U+04CF cyrillic small letter palochka may be used. </em></p>
      <p>Here is how the Palochka appears when the font has a standard Cyrillic character set, and the typographer improvises:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pal1_6169.jpg"></div><p></p>
      <p>Here it is with my first attempt at proper unicode characters. The roman is acceptable, as per the Unicode chart specimen, but the italic is suspect:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pal2_4601.jpg"></div><p></p>
      <p>From a typographic perspective, one should look for correspondences in the alphabet.<br>
      Here is the Adyghe orthography:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Adyghe_5546.jpg"></div><p></p>
      <p>There are two other characters with vertical strokes (other than those which incorporate the palotchka). The ef is not a good model in the italic, but the yeru is promising, and there is a pattern here, which the palotchka could fit into:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pal3_6597.jpg"></div><p></p>
      <p>The practice referred to in the Unicode Standard, of a serifless stroke, should be discounted. Typographically, it is not enough like a letter, more like an accent or vertical bar. The "exit serif" in the italic serves to space the following character, and is not really something that can be dispensed with in this genre.</p>
      <p>Therefore, for consistency within Adyghe typography, the following lower case forms seem appropriate for this kind of serifed face:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Pal4_4388.jpg"></div><p></p>
      <p>This design answers the question--if there are two characters in the alphabet with ascenders, why would they be given different serif treatments? (Which is what the Unicode chart specimen does, by following the ad hoc practice of using capital I.) And why should there not be consistency between the vertical strokes in ef, yeru, and palotchka?</p>
      <p>However, as the roman ef shown above is an alternate, and the default in my font is this more exotic, symmetrical form, the Unicode configuration of palotchka roman is OK:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pal5_5887.jpg"></div><p></p>
      <p>But this is tempting:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Pal6_5895.jpg"></div><p></p>
    html_clean: |-
