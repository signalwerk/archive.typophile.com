      <p>Thanks for your comments Andrijko.</p>
      <p>Yes, the upper left serif of "small ghe with upturn" is unusual, but I think it is OK in the context of this 19th century style of Scotch Modern. I had observed that historically in Adolf Darre's specimen (Harkov, 1888) this character, and "small em", had a horizontal left serif, not a "pot hook" like the rest of the italic lower case. While I generally stuck closely to Darre's letterforms, for some reason I felt I would rather change this detail. It's vanity I suppose, that no matter how good the original, there is always something a redesigner thinks he can improve upon.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/nmnrn_5353.jpg"></div><p></p>
      <p>I will post samples of my Cyrillic Swash alternates soon, in a new thread</p>
