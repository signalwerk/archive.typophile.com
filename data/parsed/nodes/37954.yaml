    html: <p>to me the ы looks as if it is missing the top right serif on the second element. this probably depends on what models you've been looking at, but i'd suspect that <em>most</em> Cyrillic typefaces would include the serif in this spot and if you follow this logic for a "lowercase" palochka, you would <em>essentially</em> arrive at a form similar to the uppercase I for the roman. adapting an italic version of this does seem that it would be a bit of a challenge. i think using an l-shaped palochka is a decent solution, but of course, i am no expert.</p>
