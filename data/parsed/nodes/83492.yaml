    <p>Hi, I'm designing an A5 booklet which has a big map legend that needs to fit on one page. What would be a narrow (i.e. condensed) font that works at 6pt or even 5pt? </p>
    <p>I have been using Gotham headers and Mercury bodytext throughout. Gotham takes up a bit too much space and I don't like its condensed varieties at small sizes.</p>
