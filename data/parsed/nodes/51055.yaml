    <p>Hello,</p>
    <p>Long time reader, first time poster.</p>
    <p>I am trying to match a typeface and I am pretty sure it is a custom type.<br>
    <a href="http://www.flickr.com/photos/31916775@N06/2983570281/" title="http://www.flickr.com/photos/31916775@N06/2983570281/">http://www.flickr.com/photos/31916775@N06/2983570281/</a></p>
    <p>It is a Providence College hockey jersey. I want to write something in the same type but with different letters. I will in know way be reflecting anything poorly upon the school or taking money by knocking off trademarks. </p>
    <p>If anyone can suggest what type it is, similar to, or a good way to replicate it I would be so thankful.</p>
    <p>Thanks<br>
    Chris</p>
