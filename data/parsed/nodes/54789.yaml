    <div class="info">Submitted by <a href="/user/10234" title="View user profile.">patrick.s</a> : 14.Feb.2009 5.25am </div>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/slanted_8_call_6311.jpg"></div><p></p>
    <p>Beiträge gesucht – in Slanted Magazin #8 mit dem Thema »2d3d« wird sich alles um die Dimensionssteigerung von Linearität in den Raum und dem, was dazwischen liegt, drehen.</p>
    <p>Im Wesentlichen interessiert uns Typo &amp; Raum in 2 verschiedenen Formen:</p>
    <p>– Einerseits das Vortäuschen einer dritten Dimension, obwohl alles immer noch im 2-dimensionalen, im flachen Raum stattfindet.</p>
    <p>– Andererseits Typografie und Grafik in der Welt um uns herum als Installation, Applikation, Architektur, Skulptur usw.</p>
    <p>Wir suchen Arbeiten von Studierenden und Professionellen, die selbst etwas eigenes/interessantes zur Thematik vorschlagen möchten, etwas kennen, über etwas schreiben möchten usw. Diese können auch aus nicht-typografischen Bereichen stammen – wir sind stets daran interessiert, auch andere Bereiche der Gestaltung einzubeziehen.</p>
    <p>Zusätzlich stellen wir in der Rubrik Studienarbeiten/Typostories interessante Studienprojekte und Diplomarbeiten vor, die nicht notwendigerweise zum Thema passen müssen – Einreichungen willkommen!</p>
    <p>Bitte sendet eure Vorschläge in Form von visuellem Material (bitte als Ansichts-pdf) und einer kurzen Beschreibung bis einschließlich Sonntag, 05. April 2009 an magazine(at)slanted.de. Nach Einsendeschluss wird das Material von uns gesichtet – ihr werdet dann auch von uns per Email benachrichtigt.</p>
    <p>Wir freuen uns auf eure Einsendungen!</p>
    <p>PS: Auch die Themen für #9 und #10 stehen bereits fest:<br>
    #9 / das Prinzip Stencil<br>
    #10 / Fraktur- bzw. gebrochene Schriften.<br>
    Aufruf folgt ...</p>
    <p>--</p>
    <p>Call for entries – Slanted magazine #8 with the topic "2d3d" will center on a step-up of dimensions – from linearity to space and everything intermediate.</p>
    <p>Basically we are interested in type &amp; space in two different forms:</p>
    <p>- On the one hand simulating a third dimension although everything still happens in the 2-dimensional, plain space.</p>
    <p>- On the other hand typography and graphics in the world around us in form of installations, applications, architecture, sculptures and so on.</p>
    <p>We are looking for projects from students and professionals who want to suggest something interesting matching to our topic, like to write something about it and so on. The projects needn't to be necessarily (typo-)graphic – we are always interested in other parts of design.</p>
    <p>Additionally we present student- and diploma-projects in our section Studienarbeiten/Typostories which needn't essentially suit to the topic of the issue – contributions welcome!</p>
    <p>Please send your suggestions in form of visual material (please prepare screen-pdf) and a short describtion to magazine(at)slanted.de up to and including Sunday, 5th of April 2009. After that date we will spot the received material – then you will be informed per e-mail.</p>
    <p>We are looking forward to your contributions!</p>
    <p>PS: The topics for slanted magazine #9 &amp; #10 are fixed already:<br>
    #9 / principle stencil<br>
    #10 / black letter!<br>
    Call for entries follows ...</p><div class="imageWrap"><img src="http://typophile.com/files/slanted_8_call_3537.jpg"></div><p></p>
