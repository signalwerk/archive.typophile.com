    <p>Hi all,</p>
    <p>My first post so here goes...</p>
    <p>What typefaces would you suggest for a sports club magazine where the audience is age 35 to 75?</p>
    <p>Looking for body copy, captions for photos and headlines with subheadings.<br>
    Also includes 1 table of stats (numbers) in one article.</p>
    <p>Currently using Helvetica Neue (body copy) and Universe as the boss recommended.<br>
    Looking for something more updated.</p>
    <p>Appreciate any suggestions.</p>
    <p>Raymond</p>
