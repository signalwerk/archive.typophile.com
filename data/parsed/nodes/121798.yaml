  - id: 594962
    user: 23584
    date: 2014-12-05T02:32:00
    date_raw: 5 Dec 2014 — 2:32am
    votes: null
    html: <p>I like it - it has a clean gentle Beatrix Potter feel. The extremely small x-height does not hinder legibility . The |f| is incongruous with its prominent capital-F-like stroke.  The irregularity of the shapes is pleasing and gives a hand-made effect .. it reminded me somewhat of the new font being promoted for easy reading by dyslexics who cannot recognise symmetrical shape like q,p,b,d, so the glyphs are made irregular.  The gaps are OK and might well serve another purpose - someone on typophile was recently looking for a font without closed counters for laser cutting. Good luck.</p>
