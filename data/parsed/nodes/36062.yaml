      <p><em>I thought that’s what Mark Simonson was trying to do with Proxima Nova, but i could be misinformed.... Mark?</em></p>
      <p>from Mark’s site: “Proxima Nova straddles the gap between typefaces like Futura and Akzidenz Grotesk. The result is a hybrid combining humanistic proportions with a somewhat geometric appearance.”</p>
      <p>My use of the term "humanistic proportions" is probably a bit dated. It comes from the book "Type" by David Gates wherein he describes two different approaches to determining the proportions of a typeface: Humanistic, based on a tall oval/rectangle, in which the letters have the appearance of having similar widths; and Old Style, based on the circle and square, in which the letters may have very different widths, depending on whether they are constructed from two small circles/squares stacked vertically or one large circle/square. Akzidenz Grotesk and Futura are good sans serif examples of each of these two approaches respectively.</p>
      <p>With Proxima Sans (and Nova), I tried to use "humanist" proportions as much as possible, except for the really round letters, such as the O, C, o, e, etc., and even these are slightly narrowed.</p>
      <p>Nowadays, the term "humanist" is usually used a bit differently than the way Gates used it and carries more baggage than just proportion. "Modern" might have been a better choice of a word, though that also has other connotations.</p>
