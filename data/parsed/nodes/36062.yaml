      <p>Monotype once made a few sorts for Gill that mimicked the more geometric forms of Futura. When the 3-5 lc letters and 2-4 caps were substituted (precursor to stylistic sets!), it did give a much more geometric feel. A lot of that, in Gill, is the caps. O, G, C, etc. aren't that different from Futura. The design is pretty geometric and monoline for a humanist sans.</p>
      <p>One other way to see this is that the proportions of Futura do actually follow the Renaissance model; long ascenders, small x-height, generous and proportional caps. In that sense, Futura is the most humanistic "geometric" sans. </p>
      <p>Metro straddles that line even more; it has some flexion and taper, sheared terminals etc. but a lot of that low-contrast roundness. It can also be disguised with a couple alternates as "geometric," and I think it was.</p>
