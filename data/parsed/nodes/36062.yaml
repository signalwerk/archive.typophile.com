    html: |-
      <p>Century Gothic has an interesting history. Originally, there was Futura (1927). Then there was Twentieth Century (1937-47), which was Lanston Monotype's knockoff of Futura.</p>
      <p>Fast-forward to the early 1990s, and Monotype was trying to provide widths-identical and design-similar versions of the PostScript "base 35 fonts" including Avant Garde. So they refit and redesigned Twentieth Century to more closely match the Avant Garde widths and general look, and got Century Gothic.</p>
      <p>So you've got a clone of one thing turned into an imitation of something else. Now *that's* derivative!</p>
      <p>Cheers,</p>
      <p>T</p>
