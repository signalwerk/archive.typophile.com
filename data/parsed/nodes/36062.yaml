      <p>Regarding Underground…</p>
      <p>it, Gill Sans, and even Metro are often grouped into the humanist sans serif category. For me, they stradle the humanist and geometric divide, although at that time there was no such divide. Humanist sans serifs really come about much later, in the post-war period… maybe really only in the 1970s. I think that Underground, Gill Sans, and Metro can easily be classified as geometric. Sure, they aren't Futura, but it really depends which letters you use for comparison. As Paul noted, the caps are very geometric, or at least similar to Futura. And then remember that Gill Sans lowercase g!</p>
      <p>What these sans serif type have in common is they are not grotesks (or grotesques, or gothics, or whatever name you prefer).</p>
    html_clean: |-
