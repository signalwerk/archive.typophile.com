      <p>Dan: Nope, that was written and on our web site long before I started at Adobe in 1997. I think E.M. Ginger did those original font blurbs, if I remember what David Lemon has said correctly.</p>
      <p>Mark S: "My use of the term “humanistic proportions” is probably a bit dated. It comes from the book “Type” by David Gates wherein he describes two different approaches to determining the proportions of a typeface: Humanistic, based on a tall oval/rectangle, in which the letters have the appearance of having similar widths; and Old Style, based on the circle and square, in which the letters may have very different widths, depending on whether they are constructed from two small circles/squares stacked vertically or one large circle/square."</p>
      <p>Really? That's weird to me - Gates considers oldstyle to *not* be humanist, and thinks Helvetica *is* humanist? To me "humanist" proportions are a synonym for what Gates calls "oldstyle."  Other sources I've seen dealing with proportion such as the PANOSE system call the proportions based on a tall oval/rectangle "modern" rather than "humanist," and that is the lingo I've adopted as well.</p>
      <p>Cheers,</p>
      <p>T</p>
