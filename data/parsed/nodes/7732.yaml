    html: <p>Thanks, but that's way too swashy. <br> <br>For reference, I'd say that the "Y" in Palatino Italic* is borderline, although if one arm were straight the other could be more swashy and it would be OK. If that helps. <br> <br>* <a href="http://www.myfonts.com/fonts/linotype/palatino/medium-italic/win-t1/113811/character/0059/CP2/1/" target="_blank">http://www.myfonts.com/fonts/linotype/palatino/medium-italic/win-t1/113811/character/0059/CP2/1/</a> <br> <br>hhp</p>
