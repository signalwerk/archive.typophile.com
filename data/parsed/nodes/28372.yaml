    <p>hello</p>
    <p>i am searching for a name for my future Arabic type design website.<br>
    after several names i liked '29Letters'.</p>
    <p>29 not 26 because the arabic alphabet consists of 29 letters and not only 26 like the latin.</p>
    <p>so the domain will be:</p>
    <p><a href="http://www.29letters.com" title="www.29letters.com">www.29letters.com</a></p>
    <p>how does it sound?</p>
    <p>cheers</p>
    <p>pascal</p>
