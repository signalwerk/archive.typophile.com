    <p>Hello all,</p>
    <p>I am looking for a typeface for a church logo/re-brand.</p>
    <p>The church is called "New Life" and I am looking for a typeface that is rounded and looks good as lower case. I have had a look through various font sites without much success, and I refuse to resort to something like Comic Sans.</p>
    <p>I basically need a modern, san serif, rounded typeface that does not look like it is drawn.</p>
    <p>Attached is the general feel of the logo so far.</p>
    <p>Any ideas would be greatly appreciated!</p>
    <p>Thanks.</p><div class="imageWrap"><img src="http://typophile.com/files/NewLifeLogo_6111.jpg"></div><p></p>
