    <p>Hi all,</p>
    <p>Long time, no typophile!  It's good to be back.</p>
    <p>Anyways, here's a photo of some lettering on a plaque -- I believe the date is around 1904, certainly no later than 1910.  I'm hoping to find a font that's somewhat similar so that I don't have to spend a bunch of time tracing letters on a crappy photograph.  The ones suggested by TypeNavigator and IdentiFont aren't really fitting the bill:</p>
    <p>Alinea Incise -- to variable in letter weight, and the O isn't perfectly round<br>
    Linotype Aroma™ Regular -- The M is missing that lovely point, and the O isn't perfectly round<br>
    Avant Garde Demi -- has the right O, but not much else</p>
    <p>The closest one I found is Futura medium or demi -- I could probably work with these and modify the width of some of the letters, as well as change around the E.  However, I do love those gently opened Us.  </p>
    <p>Anyways, if anyone has any other ideas, I'd love to hear them!</p>
    <p>Thanks,<br>
    Beth</p>
