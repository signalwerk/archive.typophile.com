      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/primetype/superla/" rel="nofollow">Superla</a> from Primetype looks quite similar in shape, except that the crotch of the M is not pointed. It's unfortunate that your sample shows so few helpful letters from an ID point of view. For example, C, G, J and R would be a big help, in addition to the M and S in your sample. </p>
      <p>I have to agree that Futura Demi seems a very good match for the letters you have shown.</p>
      <p>- Mike Yanega</p>
