    html: |-
      <p>Heh, interesting. Yes, the Monotype digital will be impossibly high-contrast (hairline serifs way too thin) at normal text sizes. However, you may not be entirely out of luck. There's a <a href="http://new.myfonts.com/fonts/urw/modern-extended/">second digitization</a> that's quite a bit more robust. You could use this for text and the Monotype for larger settings, and get fake scaling. However, if you have lots of subscripts or other small type mixed in with the main text, I'd personally find the lack of scaling to be disappointing. I expect it from Times, but not from this font.</p>
      <p>Best of luck!</p>
