      <p>It's <a href="http://new.myfonts.com/fonts/linotype/monotype-modern/">Monotype Modern</a>, the favored font for math and math-heavy books at the time. It's been largely supplanted by <a href="http://new.myfonts.com/fonts/linotype/monotype-modern/">Computer Modern</a>, the TeX adaptation of the font. Note that the official Monotype digitization is not optically scaled, but the Computer Modern version is.</p>
      <p>This <a href="http://books.google.com/books?id=6wSVuWH1PrsC">book</a> is about calculus of variations, which I reference extensively in my <a href="http://levien.com/phd/phd.html">thesis</a> on interpolating splines. I looked at a bunch of references and decided on <a href="http://www.amazon.com/Differential-Equations-Calculus-Variations-Elsgolts/dp/1410210677">Elsgolts </a> instead, largely because his presentation of the Euler-Poisson equation was much more direct than most. Note also that this is a republication of the original 1952 edition, and Dover, as is typical, reproduced page images rather than retypesetting the text.</p>
      <p>@bowfinpw: And yes, the "CONTENTS" is a different font, possibly Baskerville. Also note that the boldface is a not-quite matching font, I think it's one of the numbered "Monotype Old Style" ones, but I'm not 100% sure.</p>
    html_clean: |-
      <p>It's <a href="http://new.myfonts.com/fonts/linotype/monotype-modern/" class="link-external">Monotype Modern</a>, the favored font for math and math-heavy books at the time. It's been largely supplanted by <a href="http://new.myfonts.com/fonts/linotype/monotype-modern/" class="link-external">Computer Modern</a>, the TeX adaptation of the font. Note that the official Monotype digitization is not optically scaled, but the Computer Modern version is.</p>
      <p>This <a href="http://books.google.com/books?id=6wSVuWH1PrsC" class="link-external">book</a> is about calculus of variations, which I reference extensively in my <a href="http://levien.com/phd/phd.html" class="link-external">thesis</a> on interpolating splines. I looked at a bunch of references and decided on <a href="http://www.amazon.com/Differential-Equations-Calculus-Variations-Elsgolts/dp/1410210677" class="link-external">Elsgolts </a> instead, largely because his presentation of the Euler-Poisson equation was much more direct than most. Note also that this is a republication of the original 1952 edition, and Dover, as is typical, reproduced page images rather than retypesetting the text.</p>
