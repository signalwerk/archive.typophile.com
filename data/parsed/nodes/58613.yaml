      <p>In your sample the word CONTENTS at the top is a different font (the C has 2 serifs). The main text does look like one of the Century's (there are many if you use Bitstream's naming).  I cannot see the details clearly enough to use the <a href="http://www.bowfinprintworks.com/SerifGuide/serifsearch.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Serif Font ID Guide</a>, but with the original maybe you can try it and see what comes up.</p>
