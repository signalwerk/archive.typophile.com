  html: |-
    <p>Does anybody know the name of the serif font used by Dover Publications (not the font used on their front covers, the one for the main text of the book).  It looks like something from the 1960's, and has nice old style numerals and small caps.  I've tried Identifont et al. and they suggest faces that are close, but not quite correct (Bodoni Condensed, Century Oldstyle etc.)</p>
    <p>I've attached a small excerpt from one of their books (sorry for the quality, it's a scan).</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/Screenshot-2.png" width="717" height="482" alt="">
