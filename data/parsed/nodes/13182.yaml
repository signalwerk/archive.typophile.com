  html: |-
    <p>I am struggling to refine the logo for my website design business. I’ve lived with my ‘zen biplane’ for 1-1/2 years and feel the design needs some serious refinement. It does not translate well in black/white, looks like a flying insect when it’s very small, and just seems overall weak to me. (Odd thing - people have offered positive comments when they see my business card.)</p>
    <p>Although I’ve developed some pretty good logos for clients, I’m struggling with my own design. Too close to it perhaps? I recognize that I’m a far better web designer than I am a graphic artist!</p>
    <p>I’d like to depict the biplane (thus the ‘Barnstormer’) without appearing cartoon-like. I’m also working with a sky/clouds theme for my website. I’m not locked into the red/black necessarily.</p>
    <p>Here’s a link to my current logo and business card:<br>
    {link removed}</p>
    <p>I look forward to your expert advice and critique!</p>
    <p>deborah</p>
