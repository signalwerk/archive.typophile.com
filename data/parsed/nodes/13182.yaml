      <p>Thanks to everyone here who provided me with such helpful advice.</p>
      <p>Despite my attachment to what the biplane symbolizes for me, I found it too difficult (for me) to incorporate the romanticism of flight into the design. For awhile, I was trying to work with the propeller idea because I too like the curved lines. Ultimately, I feel a professionally illustrated logo would be the way to go. I am not an illustrator, therefore…</p>
      <p>I went a new direction and have completely redesigned the logo without a plane. I think the new logo looks more professional and more representative of a web design business.</p>
