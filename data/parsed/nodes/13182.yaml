      <p>If you want some examples I can dig some up. I was mostly thinking that the less litteral approach might be richer &amp; more romantic/evocative. The thing about the old biplanes - or monoplanes was that they had an ink on paper letters &amp; aviator’s silk scarf side - soft &amp; expressive, as well as a block letter &amp; grease side - tough &amp; pragmatic, all held together with purpose &amp; wire. </p>
      <p>If you were the son or daughter of one of these pilots, you might have something from him that would evoke the whole experience for you - even if it was a pen ( not a great example but let that go). And that suggestion or abstract element might be more reasonant than the literal aircraft.</p>
      <p>I wonder if a card could be made in the shape of a propeller - maybe it folds. Then you could have info on one side &amp; have a propeller image on the other. Maybe not too. But thats the kind of more abstract kind of thing I was thinking of.</p>
