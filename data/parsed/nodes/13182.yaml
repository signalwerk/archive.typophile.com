      <p>I like the idea of removing the obvious object, the craft, and focusing on the action.<br>
      (Perhaps use a photo of a sky with some ground, then add a zoom effect - as if you were in the plane, diving.) Then the relation image to name becomes more evocative, dynamic.<br>
