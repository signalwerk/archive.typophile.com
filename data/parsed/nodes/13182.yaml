      <p>Dan, Thank you very much for your comments.</p>
      <p>I’ve considered the stock photo route, however I’ve not been able to find an appropriate biplane photo.</p>
      <p>I agree that the font is not right. I’ve struggled to find something appropriate and am open to suggestions from forum members.</p>
      <p>The contact info at 100% is 9pt Times. (The web sample is shown slightly reduced.) Perhaps 10pt would be better?</p>
      <p>Another approach I considered was to remove the plane and use a modified type logo for the name against a full color blue sky/wht cloud photo background. For blk/wht reproduction, I’d supply just the name, but on my web and business card, include the clouds.</p>
      <p>The business name works well for me. In my marketing materials and when meeting with a prospect for the first time, I explain the connection between barnstorming and my design philosophy. My prospects and clients seem to like the story behind this connection and easily remember the “barnstormer” portion of the name.</p>
      <p>I feel like I’m back to square one…. but sometimes it’s easier to start over than to fix the unfixable. Thanks again.</p>
