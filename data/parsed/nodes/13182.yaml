      <p>What image are you trying to portray in your redesign? I like the Barnstormer idea in general, but I’m not sure what the ‘zen biplane’ isn’t giving you that you’d like to get from the new logo. Personally, I’d push for an engraved or silkscreened feel for the graphics, not knowing any specifics. Also, the biplane coming at someone head-on is a very strong implied statement, but may not read as well as a 3/4 view (something like <a href="http://www.ohtm.org/stearman.html">this</a>). Have you considered creating a small vignetted image (something like <a href="http://www.realflight.com/gallery/ultimate-2.jpg">this</a>, but framed in an oval), since a barnstormer flies daringly close to the earth?</p>
