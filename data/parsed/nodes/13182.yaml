      <p>Hey there Deborah!</p>
      <p>Some thoughts on the type to go with the imagery. If you decide to make the ‘painted’ plane the main focus, I think you should choose a less ornamented, more neutral sans serif typeface. Visually the painted plane is quite dominant, and with this ornamental serifed face the name competes with the image.</p>
      <p>If, on the other hand, you think the name of the company is the main focus, I’d play down on the symbol. Use a less intense color combination, or just use a subtler style.</p>
      <p>In general I think the business cards desperately need some air. Try not to fill every space, in stead play around with a subtle composition using lots of whitespace. If you use a plane as an image, i think it is better to give it some room to fly. :-)</p>
      <p>——————————————————————————<br>
      My work is a game. A very serious game [M.C. Escher]</p>
