      <p>I think your new logo design sacrifices personality and uniqueness for obviousness. That’s a trade-off you need to weigh in resepect to your own goals/needs (will that prevent you from getting a client?), but I think the barnstormer/biplane idea is still better. There are a million and one web design companies out there, many of which use the exact same concept of the mouse arrow. Don’t let yours lose its personality. Looking at your new/old image above, I’d still choose the original over the new one.</p>
      <p>The answer might just be sharpening and simplifying the old brush stroked logo to give it a more modern, clean look. Maybe just <a href="http://images.google.com/images?q=propeller&amp;btnG=Search&amp;svnum=10&amp;hl=en&amp;lr=&amp;safe=off&amp;client=safari&amp;rls=en">GIS “propeller”</a>, pick one, and draw over it in Illustrator and add some <a href="plane wings">plane wings</a>? Perhaps a literal plane is too restrictive. Planes are fast, dynamic, sleek pieces of engineering and design. Maybe a propeller shape with the echelon shape of a full wing-span above them is enough to meet both goals: show the plane part, and imply something about the company?</p>
      <p>But, again, it’s a matter of what you want and need from the logo for your business, not what I think is most interesting, so take this with a grain of salt.</p>
