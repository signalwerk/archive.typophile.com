      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Fullscreen capture 11282009 102619 PM_5082.jpg"></div><p></p>
      <p>I actually have the whole alphabet. I drew this as a companion for Futura.<br>
      I just needed some direction on the lowercase. So I was wondering if it looks similar to something that's out there. I definitely had Luc De Groot's Antiqua in the back of my head as I was drawing this but I'm not sure if it even shows.</p>
      <p>I was being sneaky in posting this here. It definitely belongs to the Design or the Critique forums. Oh, thanks for the feedback on the Q. It put a smile on my face and some ideas in my brains.</p>
      <p>But yeah, anything close or similar you guys can think of?</p>
