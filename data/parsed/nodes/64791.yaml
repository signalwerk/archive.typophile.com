    html: |-
      <p>I used my <a class="freelinking external" href="http://bowfinprintworks.com/SerifGuide/serifsearch.php" rel="nofollow">Serif Font ID Guide</a> to look for the upper case key letters (EJKUMRW) and based on those your font is not a match for anything else in almost 1800 catalogued families. If you start dropping our less distinctive letters you begin to get some choices. One that was interesting was Artifex, by Gabriel Maeve, at Kimera Type.</p>
      <p>- Mike Yanega</p>
