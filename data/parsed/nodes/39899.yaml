      <p>Thanks for the info guys. I actually realized that the info I need, at least most of it, comes from Adobe’s AGLFN. The best part is that I’ve also got the unicode indices in each character as well. I’ve now got about 200+ diacritical pairs formatted for use in my script. I think this is everything I need to build sufficiently broad character sets with my glyphs.</p>
      <p>Thanks guys!</p>
