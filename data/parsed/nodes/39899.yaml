    <p>Ever since seeing this screenshot of Meta Serif in FontLab:</p>
    <p><a href="http://www.fontshop.be/upload/OEBGT33X.jpg" title="http://www.fontshop.be/upload/OEBGT33X.jpg">http://www.fontshop.be/upload/OEBGT33X.jpg</a></p>
    <p>I’ve been inspired to go above and beyond the usual combination of WinANSI/MacOS Roman characters, which means adding quite a few additional diacritical alternates.</p>
    <p>I’m working on a script to generate it and would like to find the most comprehensive possible list of these characters to feed into it. I was thinking about using RoboFab, but I’d really prefer to write the script myself in this case, and their list apparently claims to be non-comprehensive and not guranteed to be accurate.</p>
    <p>Any idea where I can find a comprehensive, accurate list?</p>
