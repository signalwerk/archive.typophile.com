      <p>You can go through the <a class="freelinking-external" href="http://www.unicode.org/charts/">code charts at Unicode.org</a>, but even analyzing all those PDFs for the Latin characters alone can be overwhelming.</p>
      <p>The <a class="freelinking-external" href="http://diacritics.typo.cz/">Diacritics project</a> explains the usage of many accents in several languages. It is very informative, but it still has some holes to be filled.</p>
