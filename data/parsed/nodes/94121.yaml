      <p>How many glyphs (characters, numerals &amp; etc) have you got?<br>
      For Less that $100, Fontlab's Typetool will do the job if you don't plan to include OpenType features. Based on my own experience, it will be much faster to draw/trace your glyphs by hand with the pen tool in a font design application than auto-tracing. Auto-tracing entails a lot of time consuming clean up to get decent vectors.<br>
      Your font contains a lot of repeated shapes, so with a bit of 'cut and paste' it won't be as bad as it might seem at first glance.</p>
      <p>The fun thing about making fonts it that drawing the characters isn't even half the battle. :o)</p>
