    <p>Hi everyone!</p>
    <p>Here is my burning question...</p>
    <p>Is there any way (program or otherwise) in which I can convert PNG files into TTF files?  I've been trying to offer a font of mine to several font companies and they all want either TTF or OTFs.  They have no interest in my PNGs so I'm dead in the water until I can convert them. </p>
    <p>Thanks for your help!!!</p><div class="imageWrap"><img src="http://typophile.com/files/Shine font regular character map_4616.png"></div><p></p>
