      <p>No, I didn't use a vector program.  In retrospect I wish I had.  But, alas, I didn't have access to a vector or FontLab-style program.</p>
      <p>So I decided to do it the old, OLD-fashion way.</p>
      <p>I drew up each glyph on a 8 1/2 x 11 sheet of white paper.  With pencil, pen and marker.  My numerals were about 8" tall and letters 5" or so.  Using the geometric parameters I could visually extract from the movie versions.  Then I scanned them and turned them into PNGs.  After some painstaking pixel-by-pixel touch-ups on each glyph they are actually of high quality and precision.  Yet, as I have found out, they remain useless as raster images.</p>
