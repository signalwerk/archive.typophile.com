      <p>Bear, what software do you have? The only free one I know of is FontForge, and it's not for the faint of heart.</p>
      <p>I made a quick go at it, used Illustrator CS6 to auto-trace your PNG, and with a bit of parameter tinkering I got a very close match. Then I copied the outlines into InDesign and used a tool of my own to convert it into a Type 1 flavored OpenType font. All in all about an hour or so of work.</p>
      <p>It needed a bit of fiddling to get reasonable left and right side bearings, and you also might want to know that curved bottoms and tops should actually stick out a bit of the 'regular box' -- above and below the straight lines in your 'z'.</p>
      <p>An interesting project because of your <em>fantastic</em> swash-like extensions on the 'b', 'k', and 'q' -- I'm not sure I got those right. Perhaps these need OpenType features and swashless alternates for these characters, or maybe some ligatures.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/shine_6537.png"></div><p></p>
