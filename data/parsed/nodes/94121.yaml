      <p>There is no program that will do this for you automatically. TTF and OTF are font formats, not image formats, and creating a font takes considerable time, effort, and skill. Some type design programs may have "auto-trace" type features that can automate the conversion somewhat, but you will still have to put in a great deal of work.</p>
      <p>You need a type design program, such as those sold by FontLab. They have several to choose from; TypeTool is the cheapest and simplest for creating very basic fonts.</p>
      <p>By the way, how did you make your font originally? It looks very similar to a logo that I can't put my finger on at the moment.</p>
