      <p>Type designs are not copyrightable in the U.S. I think it is very unlikely you could be successfully sued for designing a font that's inspired by another font. Indeed, designers — both amateur and professional — do this all the time.</p>
      <p>If a studio really wanted to "sic their lawyers on you," they could probably find some clever way of doing it, and I wouldn't entirely put it past them, but it's hard to imagine they would go to the trouble, or even discover your font in the first place. The fact remains that — so far as I know — there is nothing whatsoever illegal about this, and you should proceed with the assurance that the law is on your side.</p>
      <p><a href="http://en.wikipedia.org/wiki/Intellectual_property_protection_of_typefaces" title="http://en.wikipedia.org/wiki/Intellectual_property_protection_of_typefaces">http://en.wikipedia.org/wiki/Intellectual_property_protection_of_typefaces</a></p>
      <p>Has anyone <em>ever</em> successfully sued a type designer over copyright infringement based on the appearance (as opposed to the programming) of a font?</p>
