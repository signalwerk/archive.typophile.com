    html: |-
      <p>PNG, like JPG or BMP or a photograph, is a raster image. If you have letters in such a format, they may be considered as a graphic alphabet, but just because the pictures happen to be in the shape of letters, it isn't a font.</p>
      <p>There are programs such as Scanfont (from the makers of FontLab) and FontCreator that can trace the bitmaps and place the resulting vector outlines into a font. There are also programs, such as Adobe Illustrator and Corel Draw, that will do the autotrace, which you can then copy into a font creation program such as FontLab.</p>
      <p>But that's only a quick and dirty way to create a usable font. It will probably not even have smooth outlines; it would need to be tweaked and babied for quite a while before getting anything acceptable.</p>
      <p>It would be better to use your existing images as  guides, then use the built-in design capabilities of a font creation program to re-draw the outlines properly.</p>
      <p>Incidentally, the design looks much like this one (only better):<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/bold-c/" rel="nofollow">http://www.myfonts.com/fonts/cheapprofonts/geometry-soft-pro/bold-c/</a></p>
    html_clean: |-
