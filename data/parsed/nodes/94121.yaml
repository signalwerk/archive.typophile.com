      <p>Yes, the possibility of being visited by attorneys.  I had pondered that dilemma.  Reluctantly.</p>
      <p>All I can say in my defense (which is little) is the typeface was shown only briefly and for only two phrases at different points in the movie.  I designed more than half of the alphabet glyphs myself as well as all of the numerals and punctuation.  The typeface seen was only loosely rendered without a lot of care taken for precision.  This "font" I have drawn up is, I suppose, my interpretation of what they had shown in the film.</p>
      <p>There was a film from 1980 called Xanadu in which the title used a very unusual and striking typeface.  Only five unique glyphs were used X,A,N,D and U.  A woman artist whos name I can't recall at the moment used these five glyphs as the basis of an entire TrueType font.  Offering a complete alphabet including numerals, punctuation. etc.  You can view the font by Googling  "xanadu font."  It's quite attractive with a 1920s/1930s art deco look.</p>
      <p>Still, Fox/Blue Sky could very well scream copyright infringement at me.  Loudly.  </p>
      <p>But how did the "Xanadu font" artist pull it off without angering Universal Pictures?</p>
