    html: "<p>Thank you all for your thoughts. Jon, the navigation metaphor will indeed behave like Revelare's model. I actually had Mean Tangerine completely built about eight months ago, and was ready to integrate the back end and ecommerce when I came across Revelare. If you're interested in seeing what that version looked like, there are some screenshots on <a href=\"http://www.tyleryoungcreative.com\" target=\"_blank\">www.tyleryoungcreative.com</a>. <br> <br>The metaphor of zooming in on what look like large pixels, revealing layer after layer of greater detail, combined with the psychological effect of being surrounded by the products/options themselves, made me realize that this navigation system was the best I'd ever seen for a pixel font foundry. There are some slight differences in how the zooming affects the coloration of the site, but overall, are not worth going into right now. <br> <br>On the topic of tiny pixel type and readability: it is a bit of irony that the logo work has thus far utilized a few of my small, light fonts. Mean Tangerine's trademark style will actually ride on its larger decorative/titling fonts, built in sizes that are traditionally reserved for postscript fonts. <br> <br>My main reason for going small in this instance is a weariness of the text weight/color overwhelming the logo itself. Right now, I think it erres on the side of safety. I'll try and strike a better balance and post something new today. <br> <br>I'd never even thought of the MM logo, but that was an excellent call! It definately plays upon the same geometric relationships, even if the aesthetics are handled differently. <br> <br>Here is an excerpt from an email I sent out last night to some colleagues. It illustrates in greater detail why I like this particular design, and in this case , describes (I think) how it differentiates itself from the MM symbol: <br> <br>... as it parallels the site with its focus on the pixel metaphor. It also plays with positive and negative space, and even throws in a little theater of the absurd, as it looks neither mean, nor like a tangerine. Thus, the words themselves speak a little louder than they did on the old logo... <br> <br>Thanks again for your help so far. I'll keep working on it.</p>"
