  html: "<p>Here is the leading logo candidate for my upcoming pixel font destination. I've enclosed a shot of the site as well, as it has direct bearing on why I like this particular design. <br> <br>I believe the logo and site design each focus on the pixel itself, suggesting this site is in the business of offering the building blocks of digital media. <br> <br>Anyway, that's the idea. The logo isn't going to win any prizes for originality, but that's not a goal of mine. I simply want it to communicate my products. <br> <br>My concern is that the logo is so geometrically simple, it must be derivative of other logos. So here's my request: can anyone give me examples of pre-existing designs? <br> <br>Any other feedback about the design is of course, welcome. <br> <br>For example, the lines of the logo actually clash with the lines of the site. I'm not thrilled about that, but on the other hand, it does draw attention to the brand. <br> <br>I'm just not sure its the kind of attention I want the brand to recieve... <br> <br><img src=\"http://www.typophile.com/forums/messages/29/20110.gif\" alt=\"Logos and Home Page\"> <br> <br><img src=\"http://www.typophile.com/forums/messages/29/20111.gif\" alt=\"Drill One Section Down\">&lt;/font&gt;&lt;/font&gt;</p>"
