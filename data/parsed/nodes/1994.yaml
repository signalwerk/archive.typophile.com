lso plays with positive and negative space, and even throws in a little theater of the absurd, as it looks neither mean, nor like a tangerine. Thus, the words themselves speak a little louder than they did on the old logo... <br> <br>Thanks again for your help so far. I'll keep working on it.</p>"
