    html: <p>Darrel, I must have missed the font product offerings from Revelare. Can you point me to the page where Revelare offers pixel fonts for sale? Or postscript fonts? <br> <br>I value everyone's input, and am fortunate to have everyone's willingness to participate at Typophle as a resource. I will continue to look at the navigation system. <br> <br>There are some important differences in the coloration of MT that are not apparent in the stills. This is why I said earlier that the coloration is my own. It's not much, I suppose, but as you drill down, MT actually fades to white. Full opacity is only displayed at the root level. <br> <br>This might not seem like much at first, but considering that most of the navigation happens after the root level, and that the screen is simply filled with color, MT ends up with a decidedly pastel, soft feel. That combined with the white backdrop, makes it "feel" very different from the dark oversaturated mood of Revelare. <br> <br>I know that no matter what design I published, it would not appeal to everyone. Nor would my products. However, as my target market is Flash developers, presenting the products in a Flash environment, complete with motion, is a very concious decision. <br></p>
