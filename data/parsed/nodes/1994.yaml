    html: <p>It is a little known fact that the inventor of the wheel actually tried to use it as a doorstop. It wasn't until someone else, who had inadvertently built the world's first combustion engine some years earlier, saw this fellow fiddling at his front door, that the best use of the wheel came to be known, and eventually, used by all. <br> <br>I have given the navigation metaphor much thought. I can't see how a navigation system can be considered a trademark commercial design. We're talking about zooming squares here. How many sites use drop down menus? Tabbed folder metaphors? How about folder branches? Bread crumbs? Hyperlinked calendars? Weblogs, for that matter? <br> <br>Still, I'm not unwilling to look at the subject with even more consideration--although the dialog may be better suited to another topic forum on typophile. <br> <br>Why is it that many here feel so strongly about Revelare's ownership of something as simple as click and zoom? Is it the squares they own? Is it the primary colors they own? I can't believe that anyone really would think so. <br> <br>I think it must be that Revelare's site is in fact, primarily their navigation metaphor. Why can they pull this off when virtually every other web destination uses nav systems as a means to an end? <br> <br>Because the click and zoom is entertaining, I think. Intuitive as well. But that does not mean that the idea of squares that zoom to fill the footprint of the square above it is a proprietary graphic design. <br> <br>So what if there aren't a lot of other's using this metaphor? It's a brilliant navigation system. Not for use in every situation, but perfectly suited for mine. In fact, the nav metaphor reaches new heights of relevance (hah) with my application of it. <br> <br>As far as the look and feel goes, MT has a completely different layout save the colored squares. I find it odd to have to point this out, but, Revelare uses its nav system as a display panel, while the main information about the displayed products is shown in a completely different portion of the site. <br> <br>Some may think I'm splitting hairs here, but if we're talking about legalities, we're talking about splitting hairs. My layout, look, and feel, right down to coloration is my own. Unless we're talking about the zooming grid again. <br> <br>I'm no web scholar, but, I've seen any number of designers base their designs on color grids and primary colors. <br> <br>As for those who are concerned about Revelare and their products, they actually offer it for sale online. <br> <br>In fact, I gave them several calls in an attempt to become a paying customer. I received no replies. I sent email. No response. <br> <br>So maybe they aren't very serious about selling the software they've written. But it does give one the indication that the company isn't hung up on someone else using their metaphor. <br> <br>I think they've come up with the most elegant system I've ever seen. It seems a shame to think that they'll be the only ones ever to use it when so many other great ideas, from navigation metaphors to vectorizing video, are spread throughout the web and design culture as a whole. <br> <br>Now, I'm not saying I've taken their metaphor to new heights. I'm simply saying that my application forms a more pertinant, entertaining experience, and doesn not diminish in any way what Revelare has accomplished, nor does it compete with Revelare in its markets. <br> <br>My goal with MT is to make the most efficient, entertaining, and communicative shopping experience possible. I have many original pixel fonts, and many that are similar to others already on the market. But no matter what,  I believe that MT as a whole makes a more compelling experience than each of its parts.</p>
