    html: <p>I don't think I would say that the lines of the logo "clash" with the lines of the site at all. I'd say the contrasting angle simply separates it from the other site elements, which keeps it from getting lost or ignored. This is a good thing. <br> <br>I guess the thing that I'm not so sure about is the type selection on the lower buttons (i.e. show cart, etc.). It doesn't seem to share the same pixelized personality as the other type on the site, which, combined with being knocked out of black (maybe try a gray background or keep the black and use gray type), draws too much attention to what are probably the least important reads on the page. <br> <br>I like the direction of the site. It'll look great when you're finished.</p>
