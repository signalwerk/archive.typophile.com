    html: "<p>&gt; but we have just a single word in italian <br>&gt; to translate both readability and legibility <br> <br>Then make one up - a good one - and start using it, and explaining it. If the wind blows your way, in a few years it might become a standard (at least an informal one). BTW: <br>1) I recommend the root \"lectur\" for building the word. <br>2) Jorge de Buen (and others) had the same problem with Spanish. I had suggested \"lecturabilidad\" but they thought it was too cumbersome, and they were gravitating towards \"lectabilidad\", I think. <br> <br>One last thing: in English \"legibility\" is pretty standardized, but \"readability\" is highly variable, and context-sensitive. With a totally new word it's much easier to control the meaning. <br> <br>hhp <br></p>"
