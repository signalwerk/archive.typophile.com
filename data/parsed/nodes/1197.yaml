    html: '<p>Nice progress! <br> <br>In the Roman, the darker it gets the more "wobbly" the outlines. And overall there is some wobble too. <br> <br>I think your Light should be a hair darker (and you could add an even lighter weights below it). <br> <br>The "M" and "r" need work. <br> <br>Try a narrower "4" with a bowing diagonal. <br> <br>Spacing: I would tighten it up a hair (but make the blank space very slightly wider). <br> <br>Italics: looks fine to me so far. <br> <br>hhp <br></p>'
