    html: <p>I'm also working on a light version of a type therefor I'm now very much into 'weight-watchers'. <br> <br>Great that you totally created the type from scratch. For that it looks very professional and balanced. The longer you look for it the more you will find, so keep looking. Weight-control is very important, if you ask me, because then the type will present a very even image in a textblock. Black spots in the text are disturbing when you are reading the text. Especially with a light version. <br> <br>Regards, <br>Ren</p>
