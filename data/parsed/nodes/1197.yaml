    html: <p>Well, besides the fact that I reserve the right to think that no sans can ever be a real text face, this one is too light and too constructed/mannered to "hold" a lot of text. But it's very cute, with great detailing, and there's no reason many people wouldn't love to use it for titling. So I recommend taking it in that direction - I think it has promise there. <br> <br>Overall the glyphs seems solid, and some of them have great character, like the "i" and the "Q". <br> <br>As for the text block, I'd say your overall letterspacing a bit tight. <br> <br>BTW, did you get the stuff on p4 from... that Swiss guy's book - what was his name? <br> <br>hhp <br></p>
