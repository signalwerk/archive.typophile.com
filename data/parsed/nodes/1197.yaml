    html: <p>Hi Fabio, <br> <br>Not bad at all. It feels very friendly. I think the bold version will be very nice.  <br>Still I think you'll have to make a decision. I see that the UC 'Z' and 'W' have rounded corners. Most of the other characters don't have that. Perhaps you have to choose what you want; with of without rounded corners. Perhaps that will make it more homogenious. <br> <br>Furthermore I think you will have to tweak the thickness of some of the characters a little. Some feel to heavy / fat in the text. I'm refering to the lc 't', 'l', 'i', 'j'. And the UC 'S' and 'E'. There's propably more, but these stood out when I had a quick overview. <br> <br>Keep on going the way you're going. I like it. <br> <br>PS  Can it be you used an existing typeface as a basic? Somehow it feels familiar to me but I can't put my finger on it. But maybe that's good. <br> <br>Regards, <br>Ren</p>
