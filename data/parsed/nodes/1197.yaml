    <p>Hello Everyone! <br> <br>I'd like you to take a lot at this project, and give me some suggestions. This will be a four weight typeface, the attachment is the light version. <br>My idea is to develop a modern sans-serif, with a rounded feeling. <br>I've never finished any text typeface, with full range of weights, but this one I want to get there. <br> <br>Anyway, what do you think? <br> <br>Have a nice day! <br>Fabio Luiz Haag <br></p>
