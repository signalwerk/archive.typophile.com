    html: "<p>Ok, some analphabetic critique: <br> <br>The circle around the @ looks like it could stand to go another 90 degrees around.  I think you've already departed from the traditional form enough.  Having less of a circle just seems to detract from legibility without adding stylistically. <br> <br>Also, the Registered sign (a circled R) should contrast with the copyright symbol (a circled c): They are usually only as high as a miniscule (lc x-height), with the copyright sitting on the baseline, and the registered raised so its top is even with cap or ascender height.  I think I read this all in Bringhurst, but my books are mostly in boxes right now, so I'm not sure. <br> <br>The florin probably should have at least a bit of an arm on both sides of the body. <br> <br>The last 0 on the per mille (0/00) sign seems to be a bit disconnected.  In handwriting, the two 0s on the bottom are usually connected by a line at the top, much like the top 0 of a percent (%) is usually connected to the slash in handwriting.  Your two 0s seem to just be together by accident, and could use some bringing together. <br> <br>If anyone is from France, please comment on the guillemettes.  Should they vertically center the middle of caps, miniscules, or some compromise? <br> <br>The cent sign (</p>"
