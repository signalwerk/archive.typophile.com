    html: "<p>I must agree with Hrant about it not being a text typeface. Not only because of its lightness, but also because of tiny curvy details, and because of the structure of some characters (like agft, for example). <br>That said, it looks nice. It has a strong \"corporative\" look. <br>I'd just like to point out that: <br>- your caps are too narrow; <br>- n and h are slightly wide. <br>IMHO. :-) <br></p>"
