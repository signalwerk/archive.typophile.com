    html: <p>Hey, great progress! This is becoming a highly usable design, I think. <br> <br>The Bold is a little too close to the Regular. <br>The "K", "k", "x" and "y" could use some curling at their bottoms. <br>I'd make the "s" more curvy. <br>Try making the "G" more open. <br>The middle of the "M" is too light. <br>The comma, "S" and "U" are malformed. <br>The diagonals of the "AE" and the "4" are too thick. <br>I think you can get more wild with the ampersand. <br>The "@" is out of character. <br>The square brackets are too dark. <br> <br>The spacing needs work, and is slightly loose overall. <br> <br>Keep it up! <br> <br>hhp <br> <br></p>
    html_clean: <p>Hey, great progress! This is becoming a highly usable design, I think. <br> <br>The Bold is a little too close to the Regular. <br>The "K", "k", "x" and "y" could use some curling at their bottoms. <br>I'd make the "s" more curvy. <br>Try making the "G" more open. <br>The middle of the "M" is too light. <br>The comma, "S" and "U" are malformed. <br>The diagonals of the "AE" and the "4" are too thick. <br>I think you can get more wild with the ampersand. <br>The "@" is out of character. <br>The square brackets are too dark. <br> <br>The spacing needs work, and is slightly loose overall. <br> <br>Keep it up! <br> <br>hhp <br> <br></p>
