    html: "<p>I agree with Eduardo: it does not seem to be suitable for book textsetting, because of its details form. <br>I don't know if it's a subjective feeling, but there are some ways in treating terminals which seriously hinder readability (is that readability, right, Hrant? Sorry, but we have just a single word in italian to translate both readability and legibility). I find this problem with Metroline, for example, or with other faces I currently do not recall. <br>Besides I insist saying calling Futura a text face is wrong. It's just that Futura has been so widely used we have no big problems reading full text in it. But a book set in Futura is really not functional.</p>"
