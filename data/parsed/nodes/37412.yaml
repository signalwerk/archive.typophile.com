      <p>With permission from Luke Holland, I have pasted his recent email correspondence to me regarding this thread.</p>
      <p><em><br>
      Dear Typophiles,</em></p><em>
      <p>I read your thread regarding Eric Gill, prompted I believe by my BBC documentary ’Looking for Mr Gill’, with much interest. It was clear that most of the contributors to the debate, though passionate in their views, had not seen my film. This is simply to report that while the documentary has yet to get a TV airing in the States or Canada, the film is now available on DVD at:</p>
      <p><a href="http://www.sussex-southdowns-guide.com/Looking-for-Mr-Gill.html" title="http://www.sussex-southdowns-guide.com/Looking-for-Mr-Gill.html">http://www.sussex-southdowns-guide.com/Looking-for-Mr-Gill.html</a></p>
      <p>I would be happy to hear from any of your contributors who wish to know more about the background to the film and my home village (not a town) of Ditchling, East Sussex.</p>
      <p>With thanks,</p>
      </em><p><em>Luke<br>
      </em></p>
      <p>It’s also worth noting that the film was screened at last years ATYPI in Brighton and will be screened again at the upcoming BerlinTypo in May.</p>
