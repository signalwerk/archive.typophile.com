    <p>Press Release<br>
    March 25, 2012</p>
    <p>The upcoming ISType 2012 will be held between June 15–18 under the theme of “Transmit” in a fantastic dual venue in the heart of Istanbul: SALT Galata for the conferences, and Sabancı University Karaköy Communication Center (Karaköy İletişim Merkezi) for the workshops.</p>
    <p>ISType (Istanbul Type Seminars), conceived by Onur Yazıcıgil (Sabancı University) and Alessandro Segalini (Izmir University of Economics), is a lecture and workshop series devoted to encouraging typographic literacy in Turkey.</p>
    <p>The quintessential trait of any life on earth is to inevitably transmit, spread, disseminate a part of their very own existence. This applies not only to living beings but also to certain substances as well. Here, we stand behind this very natural happening by inviting experienced speakers from all over the world to be part of this act of carrying traditional and new thoughts on typography and to freely transmit them.</p>
    <p>The first and well-received event was held in September 2011 with a focus on lectures and practical workshops meant to set structured approaches to typographic education and theory by embracing history, calligraphy, technology, math, programming, and drawing and art.</p>
    <p>A number of professional sponsors in the font industry aligned themselves with the 2012 “Transmit” event – Adobe, MyFonts, FontShop, Font Bureau, Linotype, and FontLab. ISType 2012 is also organized within the framework of the celebrations of 400 years of diplomatic relations between the Netherlands and Turkey.</p>
    <p>This year’s keynote speakers are awarded type designer Professor Gerard Unger; prolific writer and designer Ellen Lupton, Senior Curator of Contemporary Design at Cooper-Hewitt, National Design Museum in New York City; and David Lemon, Type Development Sr. Manager at Adobe Systems, Inc.</p>
    <p>With the simultaneous Turkish and English translation at ISType 2012 we are aiming to provide our attendees uninterrupted communication.</p>
    <p>Our goal is to provide students, professionals and enthusiasts with an international gathering where ideas and inspiration can be shared and thrived. Moreover, ISType aims to contribute to the development of a typographic heritage in Turkey in which future generations can explore and create further contributions to typographic design and practice.</p>
    <p>In an ever-changing world, people inherently continue to alter their voices in order to adapt to the prevailing needs and tastes of the time. Typography is also not unaffected. Now is a crucial moment to enhance typographic literacy. By valuing an international exchange of ideas and practices, we act to explore typography’s origins and to better understand the direction it is heading.</p>
    <p>Come and enjoy the city and the conference!</p>
    <p>For more info: <a href="http://www.istype.com" title="www.istype.com">www.istype.com</a><br>
    Early Bird Registrations until May 1st.<br>
    Tweet about #istype!</p>
