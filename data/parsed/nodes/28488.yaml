      <p>Schlock in schlock out. To me the galling thing is that people who ought to know better, look the other way, this is not just in books, but in a lot of printed material. The fact that more people buy and use type than any other time does not mean any more are doing it better than earlier periods. To me there will always be a highend market that will use type amazingly well, but then there is now a separation where there used to be a middle ground of designers who used type well enough, if not  a little dull. It used to be easy, they looked at the galley of type and then they either politely called or screamed for changes to their liking. When the responsibilty changed to them doing the grunt work, well the common thinking seems to be "good enough from my house." This is where we are at and why book covers like this look like, well, schlock.</p>
      <p>The Truth shall set you free</p>
