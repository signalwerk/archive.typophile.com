      <p>Chris:  Put enough alcohol into me and I could not only do book design that poorly but forget how to punctuate too.  :-P</p>
      <p>Rodrigue:  You make a good point, and one that I'm sure many of us have raised with our clients (and in some cases, former clients!).  </p>
      <p>For example, our local transit authority has an on-going campaign about what is kewl on the system (i.e., don't crowd doorways, use earphones for your iPod, etc.) -- one of the posters deals with "Appropriate Behavior."  However, they have used the word "behaviour" three times in it -- once spelled with the "u", the other two without.</p>
      <p>Now given that the City standard is British spelling (we are in Canada, after all), and the illustration has "City Center" in it (and the signage on the train platforms is "City Centre"), one has to wonder who designed this project and who approved it up the line. </p>
      <p>I emailed them a note about this just before Christmas last year, and while I notice there are a few new ones up with proper (and consistent) spellings, you still see a lot of the "wrong" ones around.</p>
      <p>Every time I see one, I want to have a "Billy Jack" moment.....</p>
      <p>Linda</p>
