    html: |-
      <p>No donation needed:</p>
      <p>Generally: </p>
      <p>The first thing I would say is: Think about the white spaces just as much as the black. This means in common combinations in between the letters and in terms of the white spaces made by the insides of the b vs d vs h vs s and so on. to my eye they are not harmonized. This will take time to be able to see and think about. But it's good to start early.</p>
      <p>This font is very "constructed", meaning it appears to be made of common parts. There is nothing wrong with this per se but it can lead you to simply put the font together with the parts you have rather than inventing new ones when you need them. Also superficially similar parts often need to be tweaked to work well and so are not really the same. </p>
      <p>Specifically:</p>
      <p>Your a looks too much likean o - it won't identify as a quickly enough. The inside bowl of your b is too small. It doesn't fit with the other letters. The p,g &amp; q are awkward in their joins. Look at your u. It is working better. Your arm of your r is too tentative. Maybe extend the serif of the botto right of the r a bit. The t is weak - let it expand.The top of your o needs to overshoot further. The crossbar on the f is too small so the f doesn't reaf as an f quickly enough. The x and w are too heavy. Lighten those strokes so they fit with the other letters. The descenders on the p &amp; q are not the same. Why? The design of the s isn't working with the feeling of the rest of the design. Cutting the ends of some letters of at an abngle doesn't seem to fit either. Maybe go flat or pick a different angle.</p>
      <p> Keep in mind that each letter needs to be a memeber of the family and not stand out too much.</p>
      <p>This is a lot I know. This fellow may be able to help:</p>
      <p>Maybe check this site out: <a href="http://briem.ismennt.is/index.htm" title="http://briem.ismennt.is/index.htm">http://briem.ismennt.is/index.htm</a></p>
      <p>Good luck with this, and keep going!</p>
