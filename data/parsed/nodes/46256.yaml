      <p>Hi Jonathan</p>
      <p>This face has got some very nice modern forms the Lowercase d and p in particular. I would reign in the both of the Ss, they have two much character. The f would benefit from a higher wider crossbar and the t's crossbar should also be wider. I also agree with whoever said that the r is timid looking.<br>
      Have a look at a face called Flama its a nicely drawn sans but with a hint of DIN in the square shapes. </p>
      <p>And bear in mind that this is all coming from a someone who's been designing type for at least 20 years but has yet to finish one. I therefore have a lot of respect for the people – including yourself – who post their designs here.</p>
