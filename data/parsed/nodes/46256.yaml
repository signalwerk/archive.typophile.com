    <p>Here's my first attempt at a complete font in a long time. It's a modern-looking slightly condensed slab serif. I was wondering if you wouldn't mind taking a look and suggesting areas for improvement. I know the uppercase S needs work, and there are a few other things that seem like they might be odd, but I've looked at it so much that I need some outside input.</p>
    <p>(It's not going to be called Slabbo, thankfully -- that's all I could come up with for now)</p>
    <p>thanks!</p>
    <p>Jonathan</p>
