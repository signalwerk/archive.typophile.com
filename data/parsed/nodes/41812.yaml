    <p>I'm doing a logo for a community association, the focus groups said the residents most identify with the parks and river in the area so I tried using a leaf to represent the nature. It's a mixed residential type ares, with quite a bit of over development in high rise apartments in the 80's. </p>
    <p>This is a quick sketch of the idea I was going for. </p>
    <p>Comments appreciated.</p>
