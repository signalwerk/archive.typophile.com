    html: |-
      <p>If there no trees to speak of in this area...  By all means don't put one in the logo.  It will ring as a falsehood, and compromise the brand.  But since you say that "the residents most identify with the parks and river in the area so I tried using a leaf to represent the nature", then leave the computer and go take a walk.  Collect leaves.  Post pencil/pen/watercolor sketches, and then return to the computer when you've refined your idea.   If the logo is inspired by the community, then it will ring far truer.</p>
      <p>Good luck!</p>
