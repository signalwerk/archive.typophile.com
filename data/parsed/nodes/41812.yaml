    html: |-
      <p>The first issue is definitely complication.  There's no real center or focus to the logo with the buildings, leaf and water.  That doesn't mean there can't be a focus, but right now they are three separate elements that aren't working together.</p>
      <p>The second issue, and more important to me, is that none of the sketches are unique enough to serve as an identifier for your community.  Any leafy suburb with a creek could use those logos.  Maybe you should try combining those pieces with something typographic, like the K or a KL monogram that would be more unique to your town.</p>
    html_clean: |-
