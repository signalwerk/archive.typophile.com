      <p>I'm not sure what you mean by "reverse primes." The only primes I know of that are used in astronomy are those for angular measurement, such as <strong>32°18′26.5″</strong>.</p>
      <p>You are correct, my error. Sun is U+2609.</p>
      <p>As we are discussing this, I keep realizing new things I never thought of before. Such as, the zodiac signs in astrology are also constellations in astronomy. So where an astrologer would indicate Pisces by ♓, an astronomer would write <strong>Psc</strong>. Now, astrology doesn't care anything about individual stars, but I suppose if it did, you could mix the two systems so the second star in Aquarius, for example, would be <strong>β♒</strong>. (Now that's just getting silly!)</p>
