      <p>OK, if you are making a monospace font, you have to remember that certain glyphs, such as for Sun (☉) and Earth (⊕) for example, need to be as circular as possible, so they may be taller than x-height, but not quite as tall as cap height. You can probably sit them on the baseline, but you might want to experiment and see if floating them somewhere between the baseline and the top of the caps works better.</p>
      <p>Also, if you're going to do this right, you need the proper symbols for degrees, minutes and seconds of angles, called <em><a class="freelinking external" href="http://en.wikipedia.org/wiki/Prime_%28symbol%29" rel="nofollow">prime symbols</a></em>. (In non-technical material, some people try to get away with using either straight or smart quotes. It works, but it isn't quite accurate.)</p>
      <p>Proper symbols are: <strong>° ′ ″</strong></p>
      <p>Using straight quotes would look like this: <strong>° ' "</strong> -- not totally unacceptable, but not perfect, either.</p>
      <p>Using regular quotes would be like this: <strong>° ’ ”</strong> -- I think this just looks bad.</p>
