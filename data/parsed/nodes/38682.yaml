    html: |-
      <p>Something else I just thought of:</p>
      <p>Be careful to make your symbol glyphs distinctive enough from your alphanumerics, both Latin and Greek, because typesetters who use these will likely be mixing them together. For example, be sure the Jupiter symbol <strong>♃</strong> can't be confused with a <strong>4</strong>. Or Gemini <strong>♊</strong> with either two Latin capital <em>I</em>'s -- used as Roman numeral <strong>II</strong> -- or Greek capital pi <strong>Π</strong>.</p>
