      <p>Wikipedia has some fairly good explanations of what these and other symbols mean at the articles on <a class="freelinking external" href="http://en.wikipedia.org/wiki/Astronomical_symbols" rel="nofollow">astronomical symbols</a>, <a class="freelinking external" href="http://en.wikipedia.org/wiki/List_of_common_astronomy_symbols" rel="nofollow">more astrological symbols</a>, and<a class="freelinking external" href="http://en.wikipedia.org/wiki/Astrological_symbols" rel="nofollow">astrological symbols</a>.</p>
      <p>Some of these symbols are also in the extended Unicode set for some fonts. There may be others that I couldn't find.</p>
      <p><em>Planets</em><br>
      Mercury ☿ U+263F<br>
      Venus ♀ U+2640<br>
      Earth ⊕ U+2295, ♁ U+2641<br>
      Mars ♂ U+2642<br>
      Jupiter ♃ U+2643<br>
      Saturn ♄ U+2644<br>
      Uranus ♅ U+2645<br>
      Neptune ♆ U+2646<br>
      Pluto ♇ U+2647</p>
      <p><em>Other celestial bodies</em><br>
      Sun ☉ U+2299, ⊙ 2606<br>
      Moon ☽ U+263D, ☾ U+263E<br>
      Comet ☄ U+2604</p>
      <p><em>Zodiac signs</em><br>
      Aries ♈ U+2648<br>
      Taurus ♉ U+2649<br>
      Gemini ♊ U+264A<br>
      Cancer ♋ U+264B<br>
      Leo ♌ U+264C<br>
      Virgo ♍ U+264D<br>
      Libra ♎ U+264E<br>
      Scorpius ♏ U+264F<br>
      Sagitarrius ♐ U+2650<br>
      Capricorn ♑ U+2651<br>
      Aquarius ♒ U+2652<br>
      Pisces ♓ U+2653</p>
      <p><em>Other symbols</em><br>
      Ascending node ☊ U+260A<br>
      Descending node ☋ U+260B<br>
      Conjunction ☌ U+260C<br>
      Opposition ☍ U+260D</p>
      <p>(Modern astronomers usually use Roman letters for the planets, but substitute <em>H</em> for Mercury, after its Greek counterpart Hermes, to avoid confusion with Mars.)</p>
      <p>Don't forget, you'll also need Greek letters for <a class="freelinking external" href="http://en.wikipedia.org/wiki/Bayer_designation" rel="nofollow">star designations</a> (<em>e.g.</em>, α Cen, δ Ori)</p>
      <p>[In case you can't tell, I'm an astronomy buff in addition to being a typophile.]</p>
