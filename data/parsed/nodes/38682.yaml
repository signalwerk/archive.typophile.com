      <p>The symbols are more used in tables than anything else, simply to save space. Astrological and astronomical tables are called <strong>ephemerides</strong> (singular, <strong>ephemeris</strong>). There are some examples <a class="freelinking external" href="http://www.khaldea.com/kldaephem/2000/jan2007gmt.shtml" rel="nofollow">here</a> and <a class="freelinking external" href="http://www.astro.com/swisseph/ae/2000/d5ge1_2007.pdf" rel="nofollow">here</a>.</p>
      <p>They can also be used to describe planetary and orbital elements in equations and comparisons. For example, the eccentricity of Saturn's orbit could be symbolized thus: </p><div class="imageWrap"><img src="http://typophile.com/files/eccsaturn_5078.gif"></div><p></p>
      <p>Satellites of planets (moons) are designated by Roman numeral subscripts of the planetary symbols, typically (but not always) in order of discovery. Therefore, Jupiter's moon Thebes, the 14th discovered, would be:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/thebes_6557.gif"></div><p></p>
      <p>I guess then the following would be accurate, but I've never seen it quite expressed like this:</p><div class="imageWrap"><img src="http://typophile.com/files/moonearth_6237.gif"></div><p></p>
      <p>Stars are usually listed in tables by what is known as their <a class="freelinking external" href="http://en.wikipedia.org/wiki/Bayer_designation" rel="nofollow">Bayer designation</a>. That includes a Greek letter (usually in order of magnitude or brightness, but there are exceptions) followed by the three-letter symbol for the constellation. So the second-brightest star in Orion (also called Rigel) is listed as <strong>β Ori</strong>.</p>
      <p>Those are just some examples. There are lots of uses for them, mostly in tabular matter and scientific listings.</p>
      <p>(If you end up with a good font that has symbols like these, I'd like to get a copy somehow, thank you.)</p>
