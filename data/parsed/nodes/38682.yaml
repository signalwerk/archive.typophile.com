      <p>mr:</p>
      <p><strong>Astrological symbols</strong> are the signs of the zodiac, and all the functions that go with them. <strong>Astronomical symbols</strong> include the planets, sub-planets (or whatever they're calling Pluto <em>et al</em> these days), comets, etc., and the symbols for their motions. There is some overlap, because planets are used in both, but there are also alternate glyphs for certain celestial objects that are preferred by practitioners of one or the other.</p>
