      <p>An important thing that I learned about this is, when you get to the zodiac symbols, whiskers, falling water and nipples e.g. don't scale as well as letters. So if you are trying to address a wide range of sizes, it helps to have a large and small design for these or you get blobs of none-to-attractive ink at small sizes, or in the larger sizes, you get uninteresting signs. </p>
      <p>Cheers!</p>
