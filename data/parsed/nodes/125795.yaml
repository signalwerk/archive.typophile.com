      <p>Design-wise related, although the font and software are developed independently: <a href="https://www.mushafmuscat.om/" class="link-external">https://www.mushafmuscat.om/</a> by Thomas Milo and Mirjam Somers from DecoType. A fully customized job, from the design of the font all the way up to displaying it in a compatible way in browsers. A few quotes (my transl.):</p>
      <blockquote><p>There is nothing special about a web Koran: various sites offer a digital version, such as those of the Ministries of Religion of Kuwait, Qatar, and Saudi Arabia. But this design is 'radically different', says Milo (67), because of the technique. "This does full justice to the original Arabic writing style on a computer screen."</p></blockquote>
      <p>...</p>
      <blockquote><p>"We taught the computer scribal grammar, that means: how will letters be connected, and how should they adjust to the next letter. Together with my brother, I wrote an algorithm to do this."</p></blockquote>
