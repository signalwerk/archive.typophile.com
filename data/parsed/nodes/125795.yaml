      <p>Thank you for sharing. You will have no doubt seen the samples of  Maryamsoft's Mir Emad at the following page:<br><a href="http://maryamsoft.com/MirEmad/">http://maryamsoft.com/MirEmad/</a></p>
      <p>Also, the Maryamsoft typefaces in general:<br><a href="http://maryamsoft.com/FontShop/">http://maryamsoft.com/FontShop/</a></p>
      <p>Also, the discussion -- with flowers -- about its development and how it compares to Tasmeem (also with samples):<br><a href="http://www.typophile.com/node/48495">http://www.typophile.com/node/48495</a></p>
      <p>What I understand from your list is that different people are developing different engines especially to use their own fonts -- either for calligraphy or for running text. Presumably, one can't use the nastaliq font from Maryamsoft and use it with Adoos, or vice versa. Maryamsoft, therefore, has an advantage in that they have a choice of 32 typefaces (some in different weights) whereas Adoos only have 4. However, Adoos has a demo and Maryamsoft does not have any demos for Qalam Bartar and Mir Emad, as far as I can see.</p>
