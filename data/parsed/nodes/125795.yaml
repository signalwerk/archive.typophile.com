    <p>A list of  Arabic / Persian (Farsi) / Urdu, or any other Languages that use Arabic Script, Writing and Calligraphy programs.<br>
    if you know more programs please mention them, and I will add them.<br>
    Also some good Arabic fonts are added, if you know good arabic fonts please mention and I will added them.</p>
    <p>1- WinSoft, store.winsoft-international.com:<br>
    a- eMashq (online calligraphy tool) : <a href="http://www.emashq.com">www.emashq.com</a>, a web application, subscription based.<br>
    b- ScribeDOOR (Adobe InDesign and illustrator plug-in): multilingual documents editing tool for documents and posters containing more than one language.<br>
    c- Tasmeem (Adobe InDesign plug-in): professional Arabic typography and design page layout program, with many professional fonts for books publishing, new versions are subscription based.</p>
    <p>2- Sinasoft, sinasoft.com:<br>
    a- Zarnegar (old software to be updated soon): Arabic / Persian (Farsi) / Urdu very powerful word processor.<br>
    b- Kelk: professional Arabic calligraphy software with many fonts and easy to use.<br>
    c- Garcé: MS word 2003 powered by some Kelk fonts and features.</p>
    <p>3- maryamsoft, maryamsoft.com:<br>
    a- Miremad: classic Arabic typography tool for MS office, contain 9 calligraphic fonts.<br>
    b- QalamBartar: professional Arabic typography tool for MS office and Adobe InDesign, and can be enforced with many continuously added fonts.<br>
    c- Maryam: Persian (Farsi) word processor plug-in for non-Persian programs.</p>
    <p>4- Inpage Urdu, inpage.com: professional Urdu Writing and publishing software.</p>
    <p>5- Golansoft Arabic Calligrapher, golansoft.com or hemlocksoft.com: 2d vector software, with special tool for Arabic calligraphic fonts.</p>
    <p>6- Maathir Group sobek (not released yet): Arabic calligraphy software which got its fonts from Otman Taha.</p>
    <p>7- Chalipa Software, Chalipa 2 (old software, last version 2005): Nastaliq writing tool.</p>
    <p>8- diwan, al-Nashir al-Sahafi Yaqout: professional arabic publishing software.</p>
    <p>9- adoos.ir:<br>
    a- Adoos: shekasteh writing tool.<br>
    b- Nstgar: Nastaliq writing tool.</p>
    <p>10- summitsoft.co.uk<br>
    a- Arabic Editor Prem: Arabic word processor.<br>
    b- Urdu Editor Pro: Urdu word processor.</p>
    <p>11- unitype:<br>
    a- Global Office (old software): multilingual add-on for MS office.<br>
    b- Global Writer (old software): multilingual word processor.</p>
    <p>12- International Systems Consultancy, ParsNegar II (old software, last version 2007): Arabic / Persian (Farsi) / Urdu word processor.</p>
    <p>13- layoutltd.com<br>
    a- Al-Rassam Al-Arabi (old software): Arabic writer plug-in for non-arabic programs.<br>
    b- ArabicXT (QuarkXPress plug-in): Arabic publishing software.</p>
    <p>14- bmsoftware.com, UNIVERSAL WORD 2000 (old software): multilingual word processor.</p>
    <p>15- UNIVERSITY OF PENNSYLVANIA - AFRICAN STUDIES CENTER, AlKaatib Arabic Wordprocessor (old software): Arabic word processor.</p>
    <p>16- jaspell.co.uk, Jaspell Jaldi Multilingual Word Processing Software (old software): multilingual word processor.</p>
    <p>17- devalipi.com, Arabic Genie: Arabic writer for non-arabic programs in apple MAC.</p>
    <p>18- payvand.com:<br>
    a- NamehNegar 3 (old software): Arabic / Persian (Farsi) / Urdu word processor.<br>
    b- Alef (old software): Persian (Farsi) Word Processor.</p>
    <p>19- C-DAC GIST, TAHREER: Urdu writting plug in.</p>
    <p>20- nonosoft.jifisa.net, Khot 3: Arabic/Urdu word processor.</p>
    <p>21- hykaz.com, Urdu Wordpad: Urdu word processor.</p>
    <p>22- mubeenid.com, Mubeen: Adobe InDesign Urdu writing plug-in.</p>
    <p>23- HamoonSoft, ParWin 2013: Persian (Farsi) word processor plug-in for non-Persian programs.</p>
    <p>24- naseem.amjad.ajsoftpk.com, Urdu Nigar Unicode: simple and free urdu word processor.</p>
    <p>25- individual unique fonts:<br>
    a- Zuhair Albazi Naskh Font.<br>
    b-Muhammad Musa Albazi Naskh Font.<br>
    c- Khaled Hosny Amiri Font.<br>
    d- Abdoullah Aref Ruqaa Font.<br>
    e- Sultan Fonts :<br>
    1- SF Nizar.<br>
    2- SF Ruq'ah (4 weights).<br>
    3- SF Ausan.<br>
    4- SF Mada.<br>
    5- SF Naskh.<br>
    f- Abdo Mushaf Masr Font.</p>
    <p>26- <a href="http://luc.devroye.org/arab.html">http://luc.devroye.org/arab.html</a>, a page that contains many links to Arabic fonts news. very rich source of information.</p>
