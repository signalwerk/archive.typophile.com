      <p>The Arabic on the flag is "Ya Allah, Ya Kabeer" which means "Oh God, oh great one."</p>
      <p>I saw your poster and immediately knew it was for Iraq. When Canada sent soldiers to Afganistan, I saw these amazing postcards. It was the Canadian flag, except there was spattered blood instead of a maple leaf.</p>
      <p>I think the stars are necessary to differentiate the flag from the Palestinian. I think the poster works for both countries in terms of land being occupied or controlled by expatriates.</p>
      <p>I think "We are the animals who are out of our habitat" works best on the poster. Rather then green text on black, try white. This makes the middle the only part with green... just like the Iraqi flag. For more emphasis, stars should also only appear at the middle of the flag.</p>
      <p>Hope that helps,<br>
      Ahmed</p>
