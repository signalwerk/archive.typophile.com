      <p>Hey Chris, it took me a while to see the entire images, because I only see one part at a time (top or bottom two-thirds), but now that I have, here's my 2 cents'...</p>
      <p>The fact that you have just one star makes it subtle. Was there a reason you moved the star from the white field to the red, besides making room for the text?</p>
      <p>I don't know if the green I see on my monitor is the one that will be used in print, but what I see now does not contrast well with the red background... The green should be darker, perhaps.</p>
      <p>The typeface (is it yours? it looks like the one from your recent t-shirt!) looks a bit too friendly for an anti-war message. I would use something that looks rougher, and that way avoid having to use bullet holes.</p>
  - id: 219426
