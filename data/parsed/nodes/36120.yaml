      <p>Chn,<br>
      Thanks for your comments. The point of the top star in "gotta" is to be out of place and the 2 stars only in the 2nd line shows something missing or un-whole. The eye/mind desperately wants to correct this by taking the green star away and putting it back where it belongs, with the other two stars. This is the effect I am after--take something out (foreign military forces) and give back the whole to the native Iraqis. It is meant to feel uncomfortable and foreign.</p>
      <p>Regarding changing the last line to white--I tried that before and got a very wrong semantic from the word groupings. "Get out of this place" needs to be the same color to read properly.</p>
      <p>ChrisL</p>
