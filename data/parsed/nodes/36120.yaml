      <p>Ricardo,<br>
      The star was purposely moved out of place to show an ambiguity or foreignness of not belonging there. Both the American flag and the Iraqi flag have stars so I wanted to show the duality. Iraqi star becomes American star in a bait and switch (and a bit Texas lone-star).<br>
      Regarding the green on red--this is a juxtaposition of complimentary colors which is purposely bothersome. It is readable enough but not comfortable to see (like the war).<br>
      Yes, the typefaces are mine. The wider one is "Fat Squeeze"; the one with the bullet holes is "Squeeze Trigger"; the taller one at bottom is "Tight Squeeze"; and the light small caps are "Now Sans Light."<br>
      I didn't want to be too grungy with the type. I wanted it to be more clinical. More like a bunch of fat-cat oil and defense mega-corporations silently profiting (getting fat) from the war.<br>
      It is meant to be subtle and require some thought. Getting into and out of war requires some thought.</p>
      <p>ChrisL</p>
