      <p><em>I don’t know about that Hiro. Too many concepts in my opinion. In the case of posters you’re looking for a cohesive whole (not the sum of its parts). A lot of hidden meanings in a poster is not always a good idea.</em></p>
      <p>I'm sure you're aware Lore that visual references as an integral part of the overall composition, add interest. Intended or unintended. The trap most designers fall into is to be too clever/obvious or too linear as in having only one dimension. Good design should work on several levels - hit over the head and seduce at the same time [personal opinion]. An interesting read on the subject is, Symbolist Art Theories <em>A critical Anthology</em> by Henri Dorra.</p>
