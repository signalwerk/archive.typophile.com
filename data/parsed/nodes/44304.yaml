    <p>Hello, again.</p>
    <p>I’ve got two seemingly simple ones here. The first, seen here as the white episode description text - should be really simple. I was told it was Futura, but I checked and it doesn’t seem to be as the “s” and capital “G” are different at least. Please can someone set me straight with this easy one?</p>
    <p>Also, the blue episode titles: I’ve seen that font before. For the life of me however, I cannot find any fonts on my computer with that type of capital “E”. I’m sure someone knows what it is though.</p>
    <p>Thanks in advance for your help, gurus. :)</p>
