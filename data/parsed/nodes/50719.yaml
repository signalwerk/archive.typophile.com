  html: "<p>For those interested in issues involving the Adobe FDK and/or .fea file syntax, <strong>UAFDKOML</strong> (<strong>U</strong>nofficial <strong>A</strong>dobe <strong>F</strong>ont <strong>D</strong>evelopment <strong>K</strong>it for <strong>O</strong>penType <strong>M</strong>ailing <strong>L</strong>ist) is for you. Signup is here: <a href=\"http://groups.google.com/group/uafdkoml/\" rel=\"nofollow\">http://groups.google.com/group/uafdkoml/</a>. You'll need to request an invitation (done not to exclude people, but to exclude spam), but that's the only hurdle to joining.</p>"
