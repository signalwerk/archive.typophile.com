    <p>I am looking for quotes about the definition of typography to use in a book.</p>
    <p>I am pretty sure someone coined the phrase, "words we see" but can not find the citation or author. Any and all such quotes about what is typography would be appreciated. And, I will credit both the original author and who has helped me by posting it!</p>
