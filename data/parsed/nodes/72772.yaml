      <p>"It’s better to be slightly illegible than completely irrelevant."<br>
      — Nick Shinn in "Hip 2B Square: If the fonts you're using aren't Post-humanist, they're out of date" from Graphic Exchange, Sept. 2000. To read the article, go to <a href="http://www.shinntype.com/" title="http://www.shinntype.com/">http://www.shinntype.com/</a> and click on the "writing" tab. The article in question is at the bottom of the list.</p>
