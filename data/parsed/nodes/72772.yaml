      <p>Great,</p>
      <p>Thank you both.</p>
      <p>Here's one from a book, I think it is pretty obscure, maybe not:</p>
      <p>"P's and Q's, A Book on the Art of Letter Arrangement" by Sallie B. Tannahill, (Garden City, New York, Doubleday, Doran &amp; Company, Inc., 1944) in the introduction:</p>
      <p>"Well-selected letters, drawn with force and quality, arranged in good proportion, tone, and colour, and grouped in a sign, a poster, a card, or a letterhead, may be as fine and as complete a design as is a costume, a textile, a plate, a chair, or a building. The symbols of out alphabet are fixed; an A must always be an A, a P can never be a Q, but the power to use these letters, to vary them, and to arrange them is unlimited. The problem of the designer is to know how to do this in a fine way."</p>
    html_clean: |-
