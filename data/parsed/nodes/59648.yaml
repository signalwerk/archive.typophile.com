      <p>Andy</p>
      <p>I think, that I have solved the problem: The small d is the key glyph. I have added a horizontal line, which is an open contour, to all characters d of my test font family except from the d, that is the highest one in my test font family. The line, that I have added is in the same height as the highest d in the family. When you generate the Font, FontLab grumbles. Ignore it. Maybe there is a cleaner solution. I am not sure, if this has any negative side-effects.</p>
      <p>May it be, that the d of your solid style is a b, mirrored at the vertical line? I ask, because otherwise the layer 1 d would probably also have the same height as the solid d.</p>
      <p>Note, that not your font is the problem (in my theory). All fonts, in which the small d has another height as the other styles in the font family (measured from the baseline to the top), show the same problem in Photoshop and Illustrator.</p>
      <p>Edited:</p>
      <p>Just save the following code as eps file and drag the eps file to the d-character. FontLab will not grumble, when you generate the font, because now I have taken three nodes, from which two overlay.</p>
      <p><code><br>
      %!PS-Adobe-3.0 EPSF-3.0<br>
      %%Creator: FontLab<br>
      %%Title:<br>
      %%CreationDate: Mon Jul 06 16:28:37 2009<br>
      %%BoundingBox: 0.00 788.00 10.00 788.00<br>
      %%EndComments<br>
      %%BeginProlog<br>
      /FontLab 24 dict def FontLab begin<br>
      /Version 0 def<br>
      /bd {bind def} def<br>
      /n {newpath} bd<br>
      /c {curveto} bd<br>
      /C {curveto} bd<br>
      /L {lineto} bd<br>
      /l {lineto} bd<br>
      /m {moveto} bd<br>
      /f {closepath} bd<br>
      /S {} bd<br>
      /*u { } bd<br>
      /*U { fill} bd<br>
      /A {pop} bd<br>
      /O {pop} bd<br>
      /D {pop} bd<br>
      /g {setgray} bd<br>
      end<br>
      %%EndProlog<br>
      %%BeginSetup<br>
      FontLab begin<br>
      n<br>
      %%EndSetup<br>
      0 A  *u 0 O 0 g<br>
      0 D<br>
      0.00 788.00 m<br>
      10.00 788.00 l<br>
      0.00 788.00 l<br>
      f<br>
      *U<br>
      %%PageTrailer<br>
      showpage<br>
      %%Trailer<br>
      end<br>
      %%EOF</code></p>
      <p>And I doubt, that this has negative side effects.</p>
      <p><cite>Nice b!</cite><br>
      Yes. It’s nice.</p>
