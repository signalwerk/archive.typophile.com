      <p>My idea with a second aligner on the same position as the first one does not work likewise.</p>
      <p>I don’t know, if it is a bug or a relict from times, in which it was useful; a feature from former times. Whatever it is, today it is a vermin, because the ecosystem has mutated, while the insect is still the same.</p>
      <p>Andy, if you use the 10-units-aligner, the minimum size, at which it is visible, is round about 110 Pixel. Try 300 pixel. And remember, that it aligns with the text frame. So hit the enter key, when you are ready with writing the d.</p>
      <p>You could build an OpenType feature, that substitutes a fake d with the real d. But remember all the non OpenType savy apps.</p>
