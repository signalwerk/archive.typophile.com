    html: |-
      <p>Haven't read the entire discussion, so please handle with care ...</p>
      <p>Do you add extra points/outlines only to force FLS5 to calculate specific bounding box values?<br>
      Rather than adding points/outlines, you could dump all fonts with TTX to .ttx files, open them in a text editor, find the largest <em>head</em> table yMin and yMax values and <em>CFF</em> table FontBBox values from all fonts, and then change all fonts' values to these largest values:</p>
      <p>&nbsp;&nbsp;&nbsp;{head}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[...]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{xMin value="-215"/}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{yMin value="-270"/}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{xMax value="1113"/}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{yMax value="900"/}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[...]<br>
      &nbsp;&nbsp;&nbsp;{/head}</p>
      <p>&nbsp;&nbsp;&nbsp;{CFF}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[...]<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{FontBBox value="-215 -270 1113 900"/}<br>
      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[...]<br>
      &nbsp;&nbsp;&nbsp;{/CFF}</p>
      <p>Then run .ttx files through TTX again, this time with the -b option so TTX won't recalculate box values, to get .otfs again.<br>
      I am not sure if it would hurt application if these values are larger than perhaps necessary, might be worth a try.<br>
      Perhaps it isn't even the worst idea to so with all fonts of any family, to make sure that all styles align identically in apps which rely on bounding box values for the distance from the top of the box.<br>
      (I am tired and may have missed other occurrences of bounding box values in the font. Haven't tested on which of the box values apps actually rely. And braces of course should be larger/smaller signs.)</p>
      <p>Karsten</p>
