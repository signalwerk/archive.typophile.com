      <p>Arno: thank you for your response. You're correct—perhaps 'slightly' is a bit of an understatement. I will look into setting the WinAscent/Ascender and WinDescent/Descender values so that their sum are equal to or less than 1224.</p>
      <p>Here is how the three font files were created: 1) I made an <em>unmerged</em> font for production that contained all triangles (both those of layer 1 and 2) as separate contours; 2) I merged all contours into individual characters, creating the solid font, adjusted metrics, kerning, and hinting; 3) imported the metrics from the solid file into the original unmerged production file and deleted triangles in each character to form the layer 1 and 2 font files. Which is to say, I did <em>not</em> create one of the layer files, then use a transformation or contour substraction to yield the other layer file. I'm not sure if that makes sense.</p>
      <p>Any suggestions for what to start with in terms of a basic character set for doing a diagnostic?</p>
