      <p>Karsten</p>
      <p><cite>Do you add extra points/outlines only to force FLS5 to calculate specific bounding box values?</cite></p>
      <p>No. Photoshop aligns the first line in a text frame with the help of the height of the character d. So the heighest point of the d is always in the same height as the text frame. (And it seems to compute the height for the actual text size, which can result in a one pixel rounding error.) It simply does not use any of the values stored in the font for aligning the first line. So I doubt, that the manipulation of the bbox values will help here. But it is nevertheless a useful tip, which might solve other problems with alignment and leading.</p>
      <p>Off topic: Have a look at <a href="http://forum.fontlab.com/fontlab-studio-tips-and-tricks/font-family-naming-in-fontlab-studio-5-t313.0.html;msg23929#msg23929" rel="nofollow">my addition to Adam Twardoch’s naming tutorial</a>, please. I have read a few of your tutorials (thanks for them!) and my comment might help to complete your naming tutorial.</p>
      <p>Andy</p>
      <p>Photoshop CS3 renders the aligner, but I assume, that Photoshop CS2 also does it. It probably is dependent from the text size, in which you test. Imagine, that the aligner has no content. At least I thought, that a line with a height of zero does not have content. So it may help to double the aligner and change the path direction of the aligner, which is on the top. I want to test that. But even if it works, now I cannot exclude anymore, that there are negative side effects. The way, in which Photoshop aligns the first line, is the problem, not your fonts.</p>
