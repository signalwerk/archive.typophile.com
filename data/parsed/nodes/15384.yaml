      <p>If you like Zapfino, you should try Zapfino Extra LT Pro, an expanded version of Zapfino:<br>
      <a href="http://www.linotypefont.com/8-36-8-17885/zapfinoextra.html" title="http://www.linotypefont.com/8-36-8-17885/zapfinoextra.html">http://www.linotypefont.com/8-36-8-17885/zapfinoextra.html</a></p>
      <p>It includes a load of OpemType contextual features that produce a lively script impression by automatically switching between different alternates in an intelligent manner. If you type the same word twice, you will get two different renderings! This works in all applications that support OpenType contextual features, e.g. Adobe InDesign, Adobe Photoshop CS/CS2, Adobe Illustrator CS/CS2. </p>
      <p>Regards,<br>
      Adam</p>
