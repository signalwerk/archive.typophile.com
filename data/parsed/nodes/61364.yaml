    <p>I thought some of you might enjoy this test I’ve created. It’s not exactly typography-based besides the fact that each question has an answer that is one single character (letter, number, punctuation). Though some typographic knowledge <em>would</em> help.</p>
    <p>If you take it, please post how far you get, I’d like to know if any of the questions are impossibly unfair.</p>
    <p>Take the <a href="http://www.philatype.com">The Tough Characters Test</a>.</p>
