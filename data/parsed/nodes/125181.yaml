    html: |-
      <p>Hi André,</p>
      <p>Thanks for the comments. I spent a few hours experimenting with the things you suggested and I am attaching the result.</p>
      <p>- I haven't yet fixed the curve of "b" bold. I will concentrate on the regular version first. I actually did the bold version just so the specimen isn't too poor.</p>
      <p>- I made the top of "t" a bit bigger (higher and also wider). It looks a lot better.</p>
      <p>- I also made its bottom of "t" a bit smaller (by "closing" the stroke a bit). This change is also reflected in "c", "j" "e" and other characters. I like it because it enhances the cursive nature of the typeface, which is already prominent in "p", "b", "q" etc.</p>
      <p>- Regarding the dot of "i" - I actually wanted it to be exaggerated. The fact that you don't see it as such makes me consider exaggerating it even more. What do you think?</p>
      <p>- I am a bit hesitant to change "a" and "u". If I do that, Mell sans won't be a cursive typeface anymore. I will try this idea out tomorrow.</p>
      <p>- I fixed "e" and it looks better.</p>
      <p>Thanks again for the feedback.</p>
