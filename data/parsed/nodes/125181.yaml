    html: <p>For me it's seems to have some potential in this design. I will only give you some technical comments. There is some touch up to do on curve. See the bump on the left side of the top of the “b” bold, same on “g, m, n, h”. The “t” could be a bit higher and its bottom is a bit to wide, the dot of the “i” a bit too big. I will change the connection of the “a,u” to their stems to looks more like the bottom of the “b”. The roundness of the “e” should be more like the “o”. Keep going.</p>
