    <p>Hello to everyone!</p>
    <p>I am happy to reopen the critique section of the new typophille forum with a new take of an older typeface that I developed with the help of some people from the old forum (if you are interested, the thread is this one <a href="http://www.typophile.com/node/120647">http://www.typophile.com/node/120647</a>).</p>
    <p>Mell Sans is my first serious font design project (though I made a couple of display faces a couple of years ago).<br>
    It is based on some well-known typefaces, like DIN and Futura, but has some characteristics of its own:<br>
    - The subtle cursive shape of "b", "d", "q" and "g".<br>
    - The thicker horizontal strokes at the end of the curves of "e", "c", "a" etc.<br>
    - The old-style "t". </p>
    <p>Where it stands out for me is:<br>
    -  Compressed letters, which save space.<br>
    - It is very legible in small sizes<br>
    - It has character (I hate generic designs).</p>
    <p>What you see are the bold and semibold weights. I plan to expand the family<br>
     with more styles and possibly a monospaced version.</p>
    <p>Any feedback is very welcome.</p>
    <p>Update: Added a new version. Check mell_sans_2.pdf</p>
