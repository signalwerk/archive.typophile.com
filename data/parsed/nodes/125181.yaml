      <p>Hello again, </p>
      <p>The new version of my typeface features:<br>
      - A two-story "g"<br>
      - A wider "s"<br>
      - A "t" with a bigger top (as per André's advice)<br>
      - Redesigned "b","d","m","n" etc. (as per André and Thomas (may still be wrong))<br>
      - I also removed some of the cuts, of "v", "k" etc. following the advice of Jens.</p>
      <p>I haven't yet decided about the size of the dots.</p>
