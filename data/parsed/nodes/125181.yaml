    html: |-
      <p>For many of your curves that sprout from a stem, the apex of the outer contour is too close to the stem, creating a lumpy, asymmetrical look; you need to move that point further out. This is most noticeable on the top of n and p, and the bottom of d.</p>
      <p>Your i and j dots seem overly large.</p>
      <p>There are a lot of optical issues that are best worked out with a much smaller character set, before expanding things to a full font.</p>
