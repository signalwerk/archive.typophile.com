  html: "<p>{Commercial Announcement} <br> <br>After much delay I've put up my collection of Baseline magazine back issues up for auction: <br> <br><a href=\"http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;rd=1&amp;item=4505740160\" target=\"_blank\">http://cgi.ebay.com/ws/eBayISAPI.dll?ViewItem&amp;rd=1&amp;item=4505740160</a> <br> <br>I let me subscription lapse, and I can't justify buying all the issues since #37 to make my collection complete again*, so I hope these content-rich and really well-crafted magazines find a good home. <br> <br>* Issues before #10 being essentially impossible to find. Even #10 is extremely rare. <br> <br>If you bid, good luck. <br>If you don't bid, please pass this along to other graphics/typography lists (like Typo-L where I'm no longer a subscriber) - I'd appreciate that. <br> <br>hhp</p>"
