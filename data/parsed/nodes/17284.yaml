  html: |-
    <p>Im making some works for my application for studying design. One of the works that im doing for it is designing a displayfont. The idea which I have is too combine some different styles together. The forms are based a bit on russian constructivism, 1920 bauhaus and din. Also my idea was only to use uppercase letters, uppercase ligatures and enclaves and some alternates like the trajan.</p>
    <p>First I constructed the letters clearly but later i decided to give the letters a bit more character and gave them a dirty outline, try to let them look like worse printed overfilled letters.</p>
    <p>At the moment I just finished the normal alphabet and numerals. Before I continue my work I would like to know what you think about the idea and if my letters are correct!?</p>
    <p>Thanx: Steven</p>
