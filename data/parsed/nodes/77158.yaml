      <p><cite>The two font solution would be fine, if not for the fact directionality would be completely lost for those using a different Egyptian font (say Aegyptus). </cite></p>
      <p>It sounds to me that what you're asking for is a layout feature, not a type feature. The old "command rollover" feature we've lacked for so long. That is the only way I know for someone using an existing font, glyphs all facing one way, to achieve what you want.</p>
      <p>BTW, for new fonts, you can put all the glyphs in one font, with one facing direction in a stylistic set. Again, you're dependent on a layout program that can access the stylistic set.</p>
