    html: <p>In principle, I think the correct way to do it would be to create a font with a double set of glyphs, naming the RTL glyphs as alternates of the corresponding LTR glyphs (e.g., u13000.rtlm), and using the rtlm and rtla OpenType features to do the substitutions. However, I have no idea whether any layout application currently supports these OTL features.</p>
