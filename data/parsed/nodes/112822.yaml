    <p>Dear All,</p>
    <p>(Firstly, apologies if this request appeared in other forums where it shouldn't have, I got myself mixed up)</p>
    <p>Looking for some guidance on fonts looking similar to the attached sample. (The raised appearance and the option of using two colours (in this case the raised gold border and enamel) are of particular interest).</p>
    <p>Realize the sample photo itself is a hand carved 'one off' but any suggestions for commercially available fonts in a similar vein please?</p>
    <p>thanks as always for the input and best wishes</p>
    <p>Steve</p>
