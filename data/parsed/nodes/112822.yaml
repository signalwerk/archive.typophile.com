    html: |-
      <p>There are thick and thin sans that you could edit to get this result, but nothing off the shelf. One problem is that your image has the thick stroke of the A on the lhs rather than the rhs where it is conventionally placed.<br>
      So take a thick and thin A, mirror it and you have the first A. For the second A rotate an I 90 degrees, clip to length and you have it. For the i change the dot to a square, if your base font does not already have this.<br>
      Some candidates -- with varying contrast -- are: Britannic Bold, Castle Ultra, Globe Gothic, Imperial Ultra Bold, koala, Linex Sans Bold [this one has the square dot], PC Gothic, Scotsdale, XenoisSemiHeavy, Oil Can....<br>
      Don</p>
