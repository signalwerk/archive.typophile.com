    <p>Hi all,</p>
    <p>I would like to announce Hiatus, my latest font release on Veer.</p>
    <p>Hiatus is a connecting script with a low x-height and generous letter spacing. It is semi-formal in appearance and is loaded with alternates and OT features.</p>
    <p><a href="http://marketplace.veer.com/fonts/UMT0001084_Hiatus#" title="http://marketplace.veer.com/fonts/UMT0001084_Hiatus#">http://marketplace.veer.com/fonts/UMT0001084_Hiatus#</a></p>
    <p>Thanks,<br>
    Stephen Rapp<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Hiatus_6571.gif"></div><p></p>
