      <p>I actually love what the »occasional disconnects« do to the text! It does look more natural and livelier – a lot of script fonts with more »homogeneous«/»logical« connections tend to generate a certain monotony in longer texts.<br>
      Its liveliness enhances readability, it feels very good to the eye.</p>
