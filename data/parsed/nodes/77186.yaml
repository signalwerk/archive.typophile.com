  - id: 443594
    user: 14650
    date: 2010-12-14T13:48:00
    date_raw: 14 Dec 2010 — 1:48pm
    votes: null
    html: |-
      <p>Thanks.<br>
      @Nick: In most of my script fonts I will include some endings that just taper off. It's sort of a remnant of calligraphy. It seems more natural to leave an occasional disconnect. Just like you would lift a brush or pen to cross a "t" or dot an "i". I do this between letters in places that would seem natural to my own writing.</p>
