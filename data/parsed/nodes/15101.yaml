      <p>Yes, I agree with you... to the typographer, minutia is critical to the overall affect. To the average reader it is (or should be) invisible.</p>
      <p>That's why we wrestle over not only WHAT face to use, but WHICH vendor's cut suits the purpose best. You know, the micro-infinitesimal differences that typophiles argue over.</p>
