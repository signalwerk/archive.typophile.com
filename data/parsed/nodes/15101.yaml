      <p>&gt; <em> the ultimate typographic painting would be of a serif</em></p>
      <p>Actually, Hrant, that would be more of an ultimate <em>type design</em> painting because it focuses on a particular aspect of a character --  a detail.</p>
      <p>For me, a <a href="http://www.nga.gov/feature/pollock/painting1.shtm" target="new" rel="nofollow">typographic painting</a> would encompass contrast, balance, juxtaposition of minute repetitive elements within the confines of the canvas or page size. IMHO you need not recognize minutia since it is the overall affect that is critical.</p>
