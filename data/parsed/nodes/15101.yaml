      <p>&gt; try Indian Ink (Black)</p>
      <p>....without shellac.</p>
      <p>India Inks are composed of carbon black particels for rich, dark color, water and latex or shellac for a binder. </p>
      <p>Shellac can ruin your nib/brush — if you don't wash it right away with warm water. But really wash!</p>
