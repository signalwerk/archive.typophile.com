    html: |-
      <p>Hi Jason. It's hard to tell exactly what's going on with the surface of your painting, but you might try the following:</p>
      <p>Actually paint the white. It looks like a white canvas with a black fleuron. In painting, it's important to spend as much time on the background as the foreground. The edge of the fleuron should be made by an actual edge between the figure and ground, where black paint meets white. Not by black paint on top of white. Franz Klein was great at this sort of thing. This might speak to Hrant's concept of 'notan' even. Or, perhaps, Noordzij's 'front'. </p>
      <p>From the photo, it looks like the typography (the <em>what</em>) is winning our over the painting (the <em>how</em>). Seems like there should be more of a balance between the two. This could be due in part to the spray paint, which is rather dead and doesn't make for a very painterly surface.</p>
      <p>You might try to mix your black instead of using black out of the tube. Pthalo blue and Alizarin crimson make a nice 'black'. Really it's a deep transparent purple, but you can layer it into a very rich black. Also, Payne's Grey mixed with similarly deep hues can make a decent black. Same goes for white. Don't use Titanium white from the tube -- throw some Ochre into it (just a bit) or it'll always be chalky and cold.</p>
      <p>Make it bigger if possible. The gesture of the fleuron will probably be enormously helped by a larger scale.</p>
      <p>I hate to tell people to look at this and that painter, but you might be interested in the work of Christopher Wool.</p>
      <p>Cheers.</p>
