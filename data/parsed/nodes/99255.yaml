    <p>Hey all I was just doing some research on the Lexus logo and notice that in the wiki and other references on the web that Toyota states that the Lexus L symbol was rendered using a precise mathematical formula.</p>
    <p>Can any experts out their give some insight into what they are talking about here regarding "mathematical formula". Does thay mean they used math to position the L where it ended up, or to decide the thickness and form of the lines or its geometry or? </p>
    <p>Thinking about that is there a kind of automation software that can give you / spit out various versions of relationships of vectors based on formula or something?</p>
    <p>Any help would be great</p>
