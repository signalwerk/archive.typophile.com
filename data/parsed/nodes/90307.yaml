    html: |-
      <p><cite>"Haas" is German for "hare"</cite></p>
      <p>That's surely the etymological root of the name, yes. For the sake of correctness, let me add that the proper German word for "hare" is "Hase" (from Middle High German "hase", Old High German "haso"); in Swiss German it's "Has", with a long "a" – so "Haas" (only spelled this way as a proper name) would be pronounced the same way (and surely, shares the same root).</p>
