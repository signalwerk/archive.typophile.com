    html: <p>Thank you guys for your kind words and great points. I agree that the relationship between the letter and the circle has to be resolved (I think I should push it a little more) The typeface is Engravers Gothic and I chose it because of it’s extended character (so that I could accomodate the “F”, “R” with the intersecting circle. I’d however prefer typeface with thinner strokes in its thin cut for “F” and combine it with medium or bold cut for the “R” (I welcome suggestions). The mark is meant for the website for now with a possibility of stationery application later. I’ll exploree the relationship between the mark and type more. Thanks again. Jan</p>
