    <p>Hi guys,<br>
    attached is a logo for an internet base research agency that I’m working on. The client asked for a “clean, fresh, open minded feel”, but it should also feel somehow “technical.” More importantly I have a question if there already is such logo (since it seems like pretty obvious, but appealing idea.) I appreciate any leads or comments. Thanks. Jan</p><div class="imageWrap"><img src="/files/Fresh Research.jpg"></div><p></p>
