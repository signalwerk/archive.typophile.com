      <p>Sorry for not replying to the questions. </p>
      <p><em>This is all my opinion of course.</em></p>
      <p>If you compare what has now been posted you’ll see the latest gray (cool/neutral) doesn’t clash as much with the pumpkin (warm). I tend to gravitate towards color combinations that have a neutralizing base color to use as accent or vice versa. Of course there are instances where I go against this. </p>
      <p>Scott’s version of the logo had a cool gray with the warm pumpkin, but because it had too much cyan/blue in it it grayed out the pumpkin color. Jan’s version with the warm gray version also detracted from the pumpkin because I see too much magenta/red in the color. The last version above has a gray that is basically a neutral and I think acts as a counterpoint to the warmer color. </p>
      <p>I miss my color theory books. :^/</p>
