    html: <p>Lighter of two blues is quite light and may not project well through LCD projectors etc. I never like to put two colours together without some white in between as this throws in problems when it comes to mono version or photocopied version etc. I think if you are going to go for two weights of type then you won’t necessarily need the lighter of the blues anyway. Then you may want to change the colour of the magnifying device (again making it a single colour). I’m sure that some will say that will take the charm away from it. Agree with comments on the S. Also I would try not to get bogged down with the double occurence of the letters RES in both words. It might work it might not. Trying to force it maybe constraining you with the layout of the type.</p>
