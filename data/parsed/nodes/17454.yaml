      <p>I second Celeste about exploring another face; the weights don’t feel up to the task of a logo just now. I think it starts mostly from the size &amp; stroke relationship of the circle itself—perhaps get that looking right first, and then choose an appropriate type.</p>
      <p>Just to throw an idea out there: what about a solid circle and a negative R? With a careful application of a “glass highlight” you might have something better. I say “careful” because a cutely “illustrated” treatment is right out.</p>
      <p>The concept, here, is <em>very</em> smart and completely appropriate. Good job.</p>
