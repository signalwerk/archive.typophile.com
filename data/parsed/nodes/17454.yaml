      <p>Jan:</p>
      <p>Since you clarified that this is a sociological research company I am looking for more of an emotional appeal and I’m not getting it, except for the striking red blood bubble. I have liked this logo concept since the original post, but I’m still not feelin’ it.</p>
      <p>Somebody suggested exploring alternative typefaces earlier. I think your Avenir selection is a good alternative to your original choice, but have you considered any options that change the overall feel? Right now, it does have a technical feel, but from your client’s request to use warm colors (not necessarily a hot red) I wonder if a warmer, more human feel to the logo would be appropriate.</p>
      <p>A couple of suggestions might be to use a softer typeface (not necessarily Meta, but something like it) and warm colors vs. hot (I believe in sociology, “red” indicates heat, violence, power, etc.).</p>
      <p></p><div class="imageWrap"><img src="/files/FreshIdea.jpg"></div><p></p>
      <p>I didn’t attempt to recreate your logo, as you’ve done a great job with your concept, but maybe this could spark some ideas.</p>
      <p>In regard to the lens glare, I wonder if decreasing the curve/arc would help flatten it out. Right now, it looks like a sphere to me.</p>
      <p>Aloha!</p>
