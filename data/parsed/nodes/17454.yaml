      <p>I’m rather new here; is it inappropriate to post a visual revision in response to a critique?</p>
      <p>It’d be easier to show it, but I’d suggest trying two things. Right now the type and mark are competing quite a bit, because they are so simliar.</p>
      <p>One strategy: try a heavier weight for “FRESH RESEARCH”, taking the point size down to about half of what you have now, and letterspacing it to lighten it up again. If you flush it left and rag the E of “FRESH” on the left sidebearing of your mark, it should lock up pretty nicely with the shape; I expect the line of the R’s leg would lead to the end of “RESEARCH”, which is almost happening now.</p>
      <p>Tim is right that you are losing the metaphor slightly, in exchange for a stronger form. Try putting a gentle crescent knock-out on the circle and see how that strikes you?</p>
