      <p>Jan, looking excellent. I still love the powder blue you used at the outset. You could probably afford to go slightly thicker on the eyeglass/crescent. You might want to artificially ’finish’ the ends/points of the crescent to avoid disappearance at smaller sizes and also to avoid a problem with vinyls if ever used. Sharp points and self adhesive (eg on signage) are not good bedfellows. I really liked your initial use of Engravers Gothic for the legend but agree that the S’s left a lot to be desired. I prefer the type in one line too. Something like this...?<br>
      </p><div class="imageWrap"><img src="/files/FR.gif"></div><p></p>
      <p>You could of course do your type in a different colour or do the device as a tint of the colour used for the type.<br>
      </p><div class="imageWrap"><img src="/files/FR2.gif"></div><p></p>
      <p>I did this one smaller so you can start to think of some of the practicalities of the mark when it is reproduced at small sizes. Some things start to suffer a little, particularly the crescent. You may even want to thicken the F up a little optically.</p>
      <p>Keep going.</p>
