      <p>Yep Rockwell definitley an influence, but it's more cursive than mine. The slabs on mine are pure regtangles whereas Rockwells are adjusted optically. Mine isn't for text setting so I don't need to do that. </p>
      <p>Check out the differences here:</p>
      <p><a href="http://www.detail.ie/King_vs_Rockwell.gif" title="http://www.detail.ie/King_vs_Rockwell.gif">http://www.detail.ie/King_vs_Rockwell.gif</a></p>
      <p>Plus I hope to develop alternates for the characters. </p>
      <p>Cheers.</p>
