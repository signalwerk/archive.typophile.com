  html: |-
    <p>FontFont was created by <a href="/node/14015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Neville Brody</a> and <a href="/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> in 1990 to produce cutting-edge typefaces by designers for designers. Today, the FontFont library represents hundreds of the world’s most innovative type&nbsp;designers.</p>
    <p>The <a href="/node/13610" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontFont TypeBoard</a> meets every six months at <a href="/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop International</a> in Berlin to review and select new designs for the&nbsp;library.</p>
    <p><strong><span class="caps">URL</span>:</strong> <a href="http://www.fontfont.com">http://www.fontfont.com</a> or at <a href="http://www.fontshop.com/fonts/foundry/fontfont/">FontShop.com</a></p>
