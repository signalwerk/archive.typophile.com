    <p>FontFont was created by <a href="/wiki/Neville%20Brody" class="freelinking" rel="nofollow">Neville Brody</a> and <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> in 1990 to produce cutting-edge typefaces by designers for designers. Today, the FontFont library represents hundreds of the world's most innovative type designers.</p>
    <p>The <a href="/wiki/FontFont%20TypeBoard" class="freelinking" rel="nofollow">FontFont TypeBoard</a> meets every six months at <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop International</a> in Berlin to review and select new designs for the library.</p>
    <p><strong>URL:</strong> <a href="http://www.fontfont.com" title="http://www.fontfont.com">http://www.fontfont.com</a> or at <a href="http://www.fontshop.com/fonts/foundry/fontfont/" rel="nofollow">FontShop.com</a></p>
