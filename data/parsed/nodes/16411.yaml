    <p>Via Coudal Partners</p>
    <p>Alvin Lustig was a renaissance man. A designer that didn't shy away from any media and seemingly mastered any in which he worked. Students today -- that is, anyone that enjoys learning from those who have gone before -- should spend time and study his work.</p>
    <p><a href="http://www.alvinlustig.org/" title="http://www.alvinlustig.org/">http://www.alvinlustig.org/</a></p>
