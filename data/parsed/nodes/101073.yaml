      <p>ISPO MUNICH: <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/good-times" rel="nofollow">Good Times</a> with ISPO manually rounded<br>
      poc: very "<a class="freelinking external" href="http://www.myfonts.com/search/eurostile" rel="nofollow">Eurostile</a>". Looks "most probably custom" to me (possibly no optical correction on /p descender), everything redrawn starting from /o (/c = /o - cut ; /p = /o + vertical stroke). 2 solutions, the quick way <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn" rel="nofollow">Saturn</a> (but outlines don't perfectly match) and the (not so) long way <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/reversal" rel="nofollow">Reversal</a> (needing customization as described above but /o outlines looks to match)</p>
