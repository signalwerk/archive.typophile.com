      <p>Thank you for your time and sharing your thoughts, which I really appreciate. I like your viewpoint in that these fonts are cheesy but appealing and that we can rapidly tire of them as opposed to those that are timeless. I agree with you regarding Biome and the Pro Semi Bold looks fantastic. </p>
      <p>The project I'm working on entails a logo for a hiking tour/guide who currently has a standard logo. The one I'm looking to design is one for a weekend hike taking place, which will not be used for long-term. Some shirts, brochures, water bottles, and keepsakes will be made for the special occasion. </p>
      <p>It will read "higher" (upper case/lower case to be determined) and I was looking for inspiration.<br>
      I came across this backpack at <a class="freelinking external" href="http://s7d2.scene7.com/is/image/EddieBauer/EB12IA_0231792_300C1?qlt=90,0&amp;op_sharpen=1&amp;resMode=bicub&amp;maskUse=norm&amp;rgn=0,0,0,0&amp;align=0,-1" rel="nofollow">Eddie Bauer</a> as the color caught my eye. The logo seems clean and to the point. My guess is they're using Helvetica, possibly? </p>
      <p>The logo at the top of the pack and the name at the bottom of the pack as well, are the ones I'm looking at. I'm interested in possibly using a type similar to this. I'm going to look at the glyphs on the fonts you've linked to and see how the letters may look. </p>
      <p>Thanks!</p>
