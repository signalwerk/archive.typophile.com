    html: |-
      <p>I'd say "techy geometric sans". First one is very "Sci-Fi lettering" (I can easily imagine it on spacecraft door). Second is simply "very Eurostile" to me.<br>
      You can have a look to <a class="freelinking external" href="http://www.myfonts.com/foundry/Typodermic" rel="nofollow">Ray Larabie Typodermic</a> fonts, <a class="freelinking external" href="http://www.myfonts.com/foundry/Fontfabric" rel="nofollow">FontFabric Fonts</a> (some more including freebies <a class="freelinking external" href="http://fontfabric.com/category/all-fonts" rel="nofollow">here</a>), <a class="freelinking external" href="http://www.myfonts.com/foundry/Test_Pilot_Collective" rel="nofollow">Test Pilot Collective</a> and <a class="freelinking external" href="http://www.myfonts.com/foundry/Identikal_Collection" rel="nofollow">Identikal</a>. My favorite at this moment is <a class="freelinking external" href="http://www.myfonts.com/search/Biome" rel="nofollow">Carl Crossgrove Biome</a>.<br>
      My 2 cent now. Using this kind of fonts is visually risky. They're surely cheesy and appealing, love them at first sight but they're far from being timeless, you can get tired of them very quickly.</p>
