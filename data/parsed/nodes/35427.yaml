    <p>I was going to save this news for !Exclamachine's web relaunch next week, but thought it might make a more interesting conversation starter here.</p>
    <p>Heading out to eat with my friends, I got call telling me one of my faces was in a real, printed magazine. On the cover, no less! I grabbed everyone who happened to be with me and we made a trip to the nearest craft store. I just stopped and stared at the issues, my wife told the employees, "My husband did that font."</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/343_357_popup_4994.jpg"></div><br>
    &nbsp;<br>
    At dinner, with the magazine on the table between us, I spent 15 minutes explaining the differences between fonts and typefaces, glyphs and letters. People were actually fascinated by the detail. Between dangerously hot wings, I demonstrated ligatures with a napkin and a sharpie. We discussed how people can recognize the same letters in different styles. It was too fun.<br>
    &nbsp;<p></p>
    <p>So, does anyone else have interesting stories of the first time they found their type design(s) unplanned in print or illustration, or on a sign or wall, or otherwise where you hadn't arranged for it to be?</p>
