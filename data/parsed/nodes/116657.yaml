    html: |-
      <p>Looks like a version of the circa 1900 DeVinne design. Not to be confused with current digital fonts sold under the name DeVinne, which are a different design. The DeVinne font was very popular and many widths and weights were produced.<br>
      For a digital variation of condensed De Vinne  see Hawthorne:<br>
      <a href="http://www.identifont.com/similar?6EF" title="http://www.identifont.com/similar?6EF">http://www.identifont.com/similar?6EF</a><br>
      A regular width version of DeVinne was recently digitized by Jeff Levine as Publication: <a href="http://www.myfonts.com/fonts/jnlevine/publication/" title="http://www.myfonts.com/fonts/jnlevine/publication/">http://www.myfonts.com/fonts/jnlevine/publication/</a><br>
      Also De Vinne from wooden type fonts:<br>
      <a href="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/" title="http://www.myfonts.com/fonts/woodentypefonts/de-vinne/">http://www.myfonts.com/fonts/woodentypefonts/de-vinne/</a><br>
      The De Vinne typeface has been discussed many times before at typophile, including:<br>
      <a href="http://typophile.com/node/104584" title="http://typophile.com/node/104584">http://typophile.com/node/104584</a><br>
      Don</p>
