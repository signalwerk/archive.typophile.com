  html: <p>I have been seeing MacSans/Bodega being used on everything! From the Oscars to food packaging to Wal-mart. Does anyone have any insight to it's over-use (or abuse) as of late?!? I literally cannot go a day without seing it on packages from the snack machine or used in tv ads. Please let me know if I am the only one who sees this or has some thoughts about why it has spread everywhere like a virus?</p>
