      <p>Consolas I have, and it's certainly a possibility (and monospace is OK), though there are some things I don't like about it.  Programming fonts have indeed been used by libraries for call number labeling.  When I make simple things in Word, however, the Consolas alternate OS figures don't appear in the character map; why is that?  Does XP not fully utilize the Vista fonts?</p>
      <p>OCR fonts tend to look a little bizarre, and are probably trumped by other options.  Lowercase is almost irrelevant to my purpose, so Tisa is still a good choice.  Thanks for Axel, which is new to me.</p>
