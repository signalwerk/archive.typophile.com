    <p>Greetings.  I am on the hunt for the perfect typeface for LC library call numbers.  I want a font which distinguishes very clearly between the most easily-confused characters (zero &amp; O, 5 &amp; S, 1 &amp; I &amp; J); is either a sans-serif or a serif of low stroke contrast; is simple and looks good in Bold; and -- ideally -- has oldstyle figures available.  A call number uses only capitals and numerals (e.g. JQ843.I17 S56 2009) which implies lining, but I think oldstyle numerals help to make the letter/number distinction most obvious, especially the O/zero.</p>
    <p>Requiring bars on the I, and a sizeable angled tail on the 1, knocks out most sans-serif contenders.  Serif oldstyle 1's need a nice tail too (not bars).  Starting with basic Windows fonts, the best are Verdana/Tahoma and Bookman Old Style, but they have lining figures.  Monospaced fonts offer a barred I, but generally have lining figures.  Constantia and Georgia are too high-contrast in boldface for my taste.</p>
    <p>My favorite finds thus far are Quadraat Small Caps (offering uniformly short numerals, which are even better for this purpose than oldstyle), though stroke contrast is a bit high and the J isn't great; Droid Sans Pro (a great sans-serif, designed for legibility on mobile phones); and maybe Cooper, of all things (in Med or Bold), because of its unusual near-oldstyle numerals.  Do any fonts combine all the desired features?  Numerals like those of Cooper or Quadraat SC might be best.  I suppose a zero that's both short and slashed is too much to hope for!</p>
