      <p><cite>When I make simple things in Word, however, the Consolas alternate OS figures don’t appear in the character map; why is that?</cite></p>
      <p>I think that would be because the OS figures are included as OpenType features and not as separate characters. You would need a OpenType-savvy program for this. Choosing OS figures is possible in MS Word 2010 Beta (which you can try out free for now), but I don't think older versions of Word include these or many other typographically useful OpenType features.</p>
