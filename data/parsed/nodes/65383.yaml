      <p>Nina, Apex's alphabetics kill it for this task. The lc "el" in Tisa is too much like a numeral one. Parango has bigger problems... Unit is good - and the zero could be modified. Or you could use the o-slash. :-)  Axel looks like a winner as-is.</p>
      <p>Here's an idea: programming fonts! They're not the prettiest* but their glyphs are always highly differentiated. And there's a very handy one out there: Consolas! If you're on a Mac (or WinXP), Ascender sells it.</p>
      <p>* And would the fact that they're fixed-width be an issue here?</p>
      <p>hhp</p>
