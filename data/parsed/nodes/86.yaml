    html: <p>I think you've stumbled upon something quite original. I really like the feeling of this face and will look forward to seeing the lowercase and eventual text weights of it. <br> <br>Looking at it now, the M, H, and T seem too wide to me but like the shape of them. Also, on the C, it seems to be the only glyph you've used the round end on the bottom and could be inconsistant with the rest of the face. Either try integrating it more into the face or ditch it entirely but it may be too inconsistant on its own. <br> <br>Regarding the N, it seems that without some sort of wider ending serifs it looks like its from another weight of this family. I'd try to keep the feel you've got going and integrate wider tapers and serifs in it. <br> <br>Overall for your first digitization of an original  typeface, it looks very nice. I'll be looking forward to seeing more of the family. <br> <br>I'm not certain what direction the lowercase could go in from here? Feel free to chime in if you have suggestions gang . . . <br> <br>Keep it up, looking nice! <br> <br>Stuart :D</p>
