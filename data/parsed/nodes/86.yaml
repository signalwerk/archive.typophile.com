    html: <p>Michael - agreeing with the comments above. Nice work <br>so far. <br> <br>I'd look at the X and the Z, too. <br> <br>The Z seems a little bit too angled/laid back. <br> <br>The X - maybe the stilts or teacup-serif-thingies <br>could be splayed instead of upright.  <br> <br>I see this working well for book titles. <br> <br>good luck <br> <br>brian</p>
