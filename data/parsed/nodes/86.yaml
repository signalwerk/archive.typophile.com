    html: "<p>Hi Michael, <br> <br>Some thoughts: <br>- I think the N and M are ok for width. <br>- The X and Y are indeed narrow. <br>- Weighting issues: I think your main weighting problem is with your thin strokes. They are inconsistant, even within characters. For example. The top, bottom and crossbar of the E, all three different. The | and / on the M etc. Unless you are really going for a three weight font, I'd suggest optically adjusting everything to two weights. <br>- Check your U. It should be consistant with your diagonal stress. <br>- Also your J. The bottom is heavy/awkward. <br>- The S: The s is a thing of symmetry. The first thing I do is drop in guides to help me. All the bezier curves that make up the spine should run parallel to these guides. The diagram in the lower right is a sabon bold outline. Start with these points. Notice how symmetrical the handles look. Yours may look a little different, but should still be symmentrical. After you have the spine working the way you want it. Add in the blue points (keep a version without them for making changes). Oops, I just noticed my topmost and bottom most points... they should be slightly staggered like the sabon example because of the diagonal stress.  <br> <br>Things I notice about your S: <br>- It's rocking backwards. Extend the bottom to the left. The final letter should fit inside a trapazoid (you've got a parallagram). <br>- Your stress is different on top and bottom. This gets really obvious when you put the guides in!  <br> <br>I spent the time because I think you've got something nice happening here. Hope it was helpful. Good work. <br> <br>Randy <br> <br> <img src=\"http://www.typophile.com/forums/messages/29/11532.gif\" alt=\"The Dreaded S\"></p>"
    html_clean: "<p>Hi Michael, <br> <br>Some thoughts: <br>- I think the N and M are ok for width. <br>- The X and Y are indeed narrow. <br>- Weighting issues: I think your main weighting problem is with your thin strokes. They are inconsistant, even within characters. For example. The top, bottom and crossbar of the E, all three different. The | and / on the M etc. Unless you are really going for a three weight font, I'd suggest optically adjusting everything to two weights. <br>- Check your U. It should be consistant with your diagonal stress. <br>- Also your J. The bottom is heavy/awkward. <br>- The S: The s is a thing of symmetry. The first thing I do is drop in guides to help me. All the bezier curves that make up the spine should run parallel to these guides. The diagram in the lower right is a sabon bold outline. Start with these points. Notice how symmetrical the handles look. Yours may look a little different, but should still be symmentrical. After you have the spine working the way you want it. Add in the blue points (keep a version without them for making changes). Oops, I just noticed my topmost and bottom most points... they should be slightly staggered like the sabon example because of the diagonal stress.  <br> <br>Things I notice about your S: <br>- It's rocking backwards. Extend the bottom to the left. The final letter should fit inside a trapazoid (you've got a parallagram). <br>- Your stress is different on top and bottom. This gets really obvious when you put the guides in!  <br> <br>I spent the time because I think you've got something nice happening here. Hope it was helpful. Good work. <br> <br>Randy <br> <br> <img src=\"http://www.typophile.com/forums/messages/29/11532.gif\" alt=\"The Dreaded S\"></p>"
