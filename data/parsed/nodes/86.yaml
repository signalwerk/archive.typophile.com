    html: <p><img src="http://www.typophile.com/forums/messages/29/11525.jpg" alt="Corvine Preview"> <br> <br>I finally found some time to do the rest of the uppercase and make some changes. This is turning out to be slower going than I thought it would be. <br> <br>Also, I'm considering changing the name to Corvine. Although, that may reserved for a family name, and have complimentary faces within the family named Rook, Raven and Crow. Just something I'm tossing around for now. <br> <br>S gave me a massive headache and I could use some suggestions on how to make bezier curves behave; it seems like everything I try makes it really lumpy. I'm also aware there are minor weight issues throughout and I think X, Y, M and N might be too narrow, but feel free to let me know what you think.</p>
    html_clean: <p><img src="http://www.typophile.com/forums/messages/29/11525.jpg" alt="Corvine Preview"> <br> <br>I finally found some time to do the rest of the uppercase and make some changes. This is turning out to be slower going than I thought it would be. <br> <br>Also, I'm considering changing the name to Corvine. Although, that may reserved for a family name, and have complimentary faces within the family named Rook, Raven and Crow. Just something I'm tossing around for now. <br> <br>S gave me a massive headache and I could use some suggestions on how to make bezier curves behave; it seems like everything I try makes it really lumpy. I'm also aware there are minor weight issues throughout and I think X, Y, M and N might be too narrow, but feel free to let me know what you think.</p>
