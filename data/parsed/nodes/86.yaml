  html: <p><img src="http://www.typophile.com/forums/messages/29/10603.gif" alt="Rook Preview"> <br> <br>As is the case with many others on this site, this is the first typeface I have attempted to immortalize in binary code. I feel it is quite different from anything I have seen. Taking a page from architecture, the wine glass, and Tuscans (type, not people) has led me to here. As you can see there is a distinct lack of lower case; that is soon to come. <br> <br>Right now, I would consider this a Titling face, but I do have intentions of developing a full featured family including, of course, text. Specifically, I would entertain suggestions as to how this could be accopmlished; some of the details seem too fine and eccentric to carry across to a face intended for small sizes and I am unsure how to rectify this. <br> <br>Of the letters shown here, M and N are giving me trouble. <br> <br>Your feedback would be much appreciated. Thanks.</p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/29/10603.gif" alt="Rook Preview"> <br> <br>As is the case with many others on this site, this is the first typeface I have attempted to immortalize in binary code. I feel it is quite different from anything I have seen. Taking a page from architecture, the wine glass, and Tuscans (type, not people) has led me to here. As you can see there is a distinct lack of lower case; that is soon to come. <br> <br>Right now, I would consider this a Titling face, but I do have intentions of developing a full featured family including, of course, text. Specifically, I would entertain suggestions as to how this could be accopmlished; some of the details seem too fine and eccentric to carry across to a face intended for small sizes and I am unsure how to rectify this. <br> <br>Of the letters shown here, M and N are giving me trouble. <br> <br>Your feedback would be much appreciated. Thanks.</p>
