    <p>Hello,<br>
    I have recently experienced a new level of frustration at my job.<br>
    I work with a bunch of different designers who all have different ways of doing things.<br>
    No big surprise here. Everyone's approach to everything is completely different.<br>
    I have been asked to work with the other designers files to recreate proposal layouts, templates etc. However there is one designer that I swear could design a 100 page magazine in his sleep. He is very talented and has a lot of expereince but none of his files use paragraph styles and he adjustes the alignment of paragraphs using the leading of the first line. As well nothing he does is built on a grid using guides. Normally I would approach this with space before and space after a block of text. I would also aply a paragraph style to the body body headers and quotes etc. I would also set up a master page with guides for a grid system. My boss has asked me to pick up some of this designers work to keep me busy. I cannot seem to replicate his work to create consistence in the designing of items that act as a unit. I feel it is because I have nothing to reference for a set style sheet or a set grid system. His work however is awesome and I want to be able to do this but I am struggling. I've spent many hours trying to accomplish the same results and it is killing me.<br>
    Any advice on how I could approach this whole mess?</p>
