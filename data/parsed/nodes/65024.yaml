    html: <p>Build grids and styles into his documents and reformat EVERYTHING so that it just starts falling apart if he doesn’t start working with the grids and styles. When he complains about it blame him for not knowing the first thing about standard design practices or how to work with other designers. It’s worked for me in the past, although you’ll have to be a complete shit about it to make it work.</p>
