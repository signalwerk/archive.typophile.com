      <p>Michael, my understanding of the German Linotype in the hot-metal era was was that it was a relatively small organization, at least in in terms of their own creation of new typefaces and the cutting of matrices. European foundries entered into agreements with them to adapt existing designs to the Linotype machine, and produce matrices in general (including Stempel and Haas). Stempel didn't absorb Linotype AG … rather, in 1985, it was more the other way around. That's certainly how the former Stempel employees have relate the situation to me.</p>
      <p>I think that Tetterode cut matrices for the Linotype and the Intertype machines, too, but it would be nice to get some confirmation for this. Jan Middendorp touches on Tetterode's relationship with Intertype in "Letters from Amsterdam," <em>Linotype Matrix.</em> Volume 4, number 3 (winter 2008). Pages 40–53. The article, incidentally, is set in Garamond 3, although the design is not mentioned in the text or in his <em>Dutch Type</em> book.</p>
      <p>Also, the ATF Garamond (and Garamond 3, naturally) look more like they were based on Jean Jannon's seventeenth century types (just like Monotype Garamond) than earlier type from Garamond his contemporary sixteenth century French punchcutters (as is more the case with Stempel Garamond, Linotype's Granjon, Sabon, etc.)</p>
