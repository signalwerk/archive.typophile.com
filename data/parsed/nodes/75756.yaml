      <p>James — I’m pretty sure the “No. 3” designation was introduced by Mergenthaler Linotype. </p>
      <p>I would imagine the numerical designations were used to distinguish different versions of other foundries’ Garamonds that Linotype might have been called upon to produce for various markets.</p>
      <p>I get the impression from McGrew’s account that Mergenthaler attempted their own version first (which presumably would have been No. 1), which did not meet with any commercial success.</p>
      <p>According to McGrew, the “No. 2” designation was used for some other fonts of a Garamond design produced by German Linotype. (Maybe this is the version Dan is referring to?)</p>
      <p>No. 3, then, was assigned to the version they adapted from the popular Benton revival in conjunction with ATF, which has been the most enduring.</p>
