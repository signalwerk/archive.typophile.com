      <p><cite>Also, the ATF Garamond (and Garamond 3, naturally) look more like they were based on Jean Jannon's seventeenth century types…</cite></p>
      <p>The ATF cut is definitely based on Jannon’s work, although it would not be hard to adapt it into Garamond’s stiffer design. The Jannon design Benton and Cleland sourced adheres closely to Garamond’s roman with a little extra calligraphic liveliness. I started this thread because I was getting confused by the various Garamond/Jannon revival apocrypha that often refers to ATF Garamond as Garamond 3. And of course some of it mentions Monotype because of Warde’s connections there (and because of Monotype’s own Garamonds), which can make for a big headache if one reads too much of it in the same week!</p>
