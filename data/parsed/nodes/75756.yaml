      <p>Hi James</p>
      <p>I went through what you're going through while researching to provide the design history commentary at <a href="http://www.100types.com/100types.com.23garamond.html" title="http://www.100types.com/100types.com.23garamond.html">http://www.100types.com/100types.com.23garamond.html</a></p>
      <p>The answer to your original question is that Garamond 3 as a designation originates with Mergenthaler Linotype and their agents. As Dan and others have pointed out, this was done to distinguish it from ATF Garamond (Benton and Cleland's original work), because the design was tweaked to make it fit the spec for Linotype machine matrices.</p>
      <p>Bert is not mistaken; Tetterode/Amsterdam Type Foundry released their own cut named as Garamont, and I believe that Goudy/Monotype and D&amp;P simply followed this trend for the name.</p>
