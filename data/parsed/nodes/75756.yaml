  html: <p>I’m doing a lot of Garamond research and it’s getting confusing. Did the name Garamond 3 come from ATF or Linotype? I have seen multiple sources claim Garamond 3 to be a name originating at ATF. But ATF uses Garamond in my ATF specimen, and Garamond 3 is used in my Linotype specimen. Was Garamond 3 just the name Linotype used to market a design licensed from ATF?</p>
