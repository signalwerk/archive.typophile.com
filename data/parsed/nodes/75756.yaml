      <p>All,</p>
      <p>Linotype Garamond No. 3 was the cut licensed from American Type Founders (ATF) which was a refined redrawing of Garamond.</p>
      <p>I'm not sure where Tetterode/Amsterdam would factor is, except there may be some confusion imparted by TFA / ATF confluence.</p>
      <p>That is, Type Foundry Amsterdam or Amsterdam Type Foundry as it was sometimes referred in the States.</p>
      <p>As far as I'm aware, Tetterode/Amsterdam didn't engage in matrix manufacture. Megenthaler in Brooklyn produced mats for the US market, and Linotype AG, (well before being absorbed by Stempel) produced matrices for the European market.</p>
      <p>And yes, Stempel has it's own cut of Garamond for foundry type, as well as historic other designs, such as their take on Baskerville which differed from the "Fry's" Baskerville ATF issued (but not called the Fry's cut), and further, the Baskerville Mergenthaler released for Linotype in the US.</p>
      <p>Stempel Garamond <a href="http://www.flickr.com/photos/interrobang918/sets/72157617003701447/" target="blank" rel="nofollow">specimen</a> </p>
      <p>All rather confusing isn't it. Blame the marketing departments.</p>
      <p>mjb / interrobang letterpress</p>
