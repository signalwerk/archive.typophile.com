      <p>I'd be interested in finding out more about the Tetterode/Amsterdam mat manufacturing presumption. I was not aware they were in the business, and if they were, they may have been manufacturing for Intertype rather than Linotype.</p>
      <p>I just checked my (late) 1960 Amsterdam specimen and they don't show anyone's version of Gara(x).</p>
      <p>To reiterate, "Garamond No. 3" was the design licensed from American Type Founders. The two cuts are one and the same. I have foundry Garamond in cases, as well as the full series of Linotype mats for efficiently setting straight matter when needed.</p>
      <p>Yes, due to the exigencies of duplexed matrix manufacturing in which the normally more narrow italic must be made to function on a roman width, the italic was refitted. That said, it was possible, if one were to make the investment in the several sets of refinements that would run as single characters and logotypes, to achieve italic settings that were more in keeping with the foundry fit.</p>
      <p>These were the "Italic Lower Case, Special No. 5" which was the a-z and punctuation,and the "Italic Logotypes, Special No. 5" which were all the ƒ combinations. Additionally, there were other sets. I have <a href="http://www.flickr.com/photos/interrobang918/322754441/in/set-72157594410115899/" target="_blank" rel="nofollow">a small number of these in 11pt</a>.</p>
      <p>mjb / interrobang letterpress / linotypesetting.com</p>
