      <p>As regards the link to "Illuminating Letters". Aside from the terrible design... I'd take the scholarship with a grain of salt.</p>
      <p>That is, they refer to "... one produced by the Monotype foundry,...". Monotype was not a foundry, and further, there were two Monotypes. Lanston Monotype in the US, and Monotype and Machinery Limited in Britain.</p>
      <p>Lanston worked with Goudy (as did ATF) and produced their take, the "Garamont (Goudy) 248". They also issued an "American Garamond 648" which, in comparing with a proof of ATF foundry Garamond laid in a case, appear to be the same cut. (Looking specifically at the g, b, and d. The bowl on the b in both is larger that the bowl on the d which is more diminutive, and the g is identical.)</p>
      <p>English Monotype released a series No. 156 in roman and italic, as well as a refined Italic No. 174.</p>
      <p>Pulling a late Deberny &amp; Peignot specimen book, their "Garamont" bears relation to Lanston's "Garamont (Goudy) 248".</p>
      <p>mjb</p>
