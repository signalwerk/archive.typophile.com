      <p>First of all, thanks for the crit. You have to explain me what you mean with the 'cue of the B and R.<br>
      The 'i' is a bit problematic, but it's an intergral part of the logo. Though this font is not meant to be used small, I see that the 'i' tends to look too small. This i makes the font kinda like a monocase.<br>
      If the font does need to be used small I use the UC characters. There is a normal 'I' on caps hight (see the little text 'Siventi Logo Wide Italic').</p>
