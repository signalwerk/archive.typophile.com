      <p>&gt; 3/4 numerals are lining but smaller than caps and bigger than x-height?</p>
      <p>Yup. Just watch how you use "lining"... :-/ Damn number thingies.</p>
      <p>&gt; And hybrid numerals have ascenders and descenders that overshoot only a little bit,<br>
      &gt; not as much as the ascenders and descenders of the lowercase characters?</p>
      <p>Sounds good. And they're [normally] shorter than the UC and/or ascenders overall.<br>
      Another way is to say they're oldstyle numerals with "bodies" larger than the lc x-height.</p>
      <p>Now let me tell you about poodlemix numerals... Or maybe some other day.</p>
      <p>hhp</p>
