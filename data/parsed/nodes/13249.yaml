      <p><em>(...) thanks for the quoting.</em></p>
      <p>Hey, like I'm going to pretend I discovered those Fleischmann references myself? ;-) Credit where credit's due.</p>
      <p><em>Two small things:<br>
      - A typo: “overfly” instead of “overly”. Were you on a plane? :-)<br>
      - You write “3/4 or hybrid numerals”, but they’re not the same thing.</em></p>
      <p>Fixed, and fixed. Type terminology regarding numerals <a href="http://typophile.com/node/13163" target="new" rel="nofollow">(or is it figures?)</a> is <a href="http://66.102.9.104/search?q=cache:umkAtexIfy0J:www.typophile.com/cgibin/discus.pl%3Fpg%3Dprev%26topic%3D30%26page%3D23763+site:typophile.com+lining+hanging+figures&amp;hl=en" target="new" rel="nofollow">prone to confusion</a>, and I got caught in it myself. Just to be sure: 3/4 numerals are lining but smaller than caps and bigger than x-height? And hybrid numerals have ascenders and descenders that overshoot only a little bit, not as much as the ascenders and descenders of the lowercase characters? (Or is it small letters?) ;-)</p>
      <p><em>Oh, and:<br>
      “But when you’re living with your song for too long, constantly developing and refining it, you risk losing some of the freshness. The cost of being able to play it flawlessly is the loss of its initial spontaneity.” Wow. I want a poster of that.</em></p>
      <p>Thanks. Never thought playing in a rock band would open my mind to philosophical... errr... stuff. ;-)</p>
