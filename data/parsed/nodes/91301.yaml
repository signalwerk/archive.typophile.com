    html: |-
      <p>CG stands for Compugraphic, which made photo-typesetting equipment in the last half of the 20th century. They were bought by Agfa, which later merged with Monotype.</p>
      <p>I have the light and demibold versions of Futura Maxi from way back. If Monotype doesn't have them, I don't know who would.</p>
