  html: <p>I am using CG Futura Maxi of various weights for a client and they need to purchase a legit copy for official use. While researching where this font can be purchased all I am coming across is free font sites... could this really be the source? Does anyone know the ACTUAL source of this font? And further what does CG mean? Crappy hack of a great typeface? Thanks gang!</p>
