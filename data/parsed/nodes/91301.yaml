    html: |-
      <p><em>…what does CG mean?</em></p>
      <p>Compugraphic.<br>
      But it wasn’t the first to produce large x-height versions of old faces.<br>
      The phototypositor companies had been doing it for years.<br>
      (Photo-Lettering, Techni-Process, Headliners.)<br>
      Now there’s a treasure-trove for hacks of hacks.</p>
