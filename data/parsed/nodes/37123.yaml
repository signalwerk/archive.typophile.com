      <p>SWEET!</p>
      <p>Two nitpicks:</p>
      <p>1. The bottom swash needs some bezier work to smooth it out ont he top where it passes the D (gets too fat to fast). I know the style is hand done, but it looks off.</p>
      <p>2. The left side of the u looks a little weak. Especially at the top. Try giving it a similar weight as the right side.</p>
      <p>With these suggestions don't kill the hand crafted look. It's working!</p>
      <p>Also, the dots on the u are a ü? Just making sure.</p>
      <p>Randy</p>
