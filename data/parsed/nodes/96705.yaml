    <p>I am watch a show on PBS about the death toll of the American Civil War.</p>
    <p>Rather Ken Burnsian to say the least, which by my book s is not a recommendation.</p>
    <p>They show 'reenactments' of a sort, reading letters as if we, the audience, are present at the time they are written, but the letters look old. They were new when the were written for Christ sake. It pisses me off. </p>
    <p>Thank you for you patience.</p>
    <p>R</p>
