    html: |-
      <p>These are the alternative letters for the font - the rest would be as standard in Gill Sans Infant (Schoolbook). The idea of alternative letters was that the type setter could make a choice - some digital fonts have alternative sets - as far as I know these for Gill Sans never made it to digital versions.</p>
      <p>What differences you may see in the b and d alternatives are possiblly from printing pressure etc. The W alternative was not used in your sample - the regular Gill Sans Infant W was.</p>
    html_clean: |-
