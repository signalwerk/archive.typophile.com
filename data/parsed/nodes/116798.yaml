    date: 2014-05-26T08:38:00
    date_raw: 26 May 2014 — 8:38am
    votes: null
    html: <p>Confirmed, there is such an illustration in ‘Letters of Credit’. Gill Sans Continental is also mentioned and shown in ‘Buchdruckschriften im 20. Jahrhundert’ by Philipp Bertheau and others, Technische Hochschule Darmstadt 1995. Funny enough, the ‘a’ of Gill Continental as shown in ‘Buchdruckschriften’ looks like the infant character (with a tail right below), whereas the sample in ‘Letters of Credit’ shows a sample of Gill Continental with a clean ‘Futura a’. Monotype users could exchange matrices (within the same unit range), so it may very well be that not all typesetters replaced all matrices and/or mixed up infant and ‘Futura-like’ variations.</p>
    html_clean: <p>Confirmed, there is such an illustration in ‘Letters of Credit’. Gill Sans Continental is also mentioned and shown in ‘Buchdruckschriften im 20. Jahrhundert’ by Philipp Bertheau and others, Technische Hochschule Darmstadt 1995. Funny enough, the ‘a’ of Gill Continental as shown in ‘Buchdruckschriften’ looks like the infant character (with a tail right below), whereas the sample in ‘Letters of Credit’ shows a sample of Gill Continental with a clean ‘Futura a’. Monotype users could exchange matrices (within the same unit range), so it may very well be that not all typesetters replaced all matrices and/or mixed up infant and ‘Futura-like’ variations.</p>
