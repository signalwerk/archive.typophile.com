    <p>I keep seeing this one in old East German books and cannot find any information on it. Similar fonts used in East Germany include "Fundamental Grotesk", "Super Grotesk", and of course "Futura" but this one is not like any of those. If a digital version can't be found - which is likely - I'd like to at least know its name. Any ideas?</p>
    <p>Lastly, if you don't know, how would you suggest researching an old type like this? Traveling to the printing shop, hoping to get some information? Finding experts on old type (does that even exist)? What is a good way to track down a forgotten type?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alexanderplatz_6182.jpg"></div><p></p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
