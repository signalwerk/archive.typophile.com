      <p>I see. Thanks for clarifying.</p>
      <p>Actually, after some googling, I came across this thread:</p>
      <p><a class="freelinking external" href="http://typophile.com/node/44358" rel="nofollow">http://typophile.com/node/44358</a></p>
      <p>It shows another German example in use, along with some commentary:</p>
      <blockquote><p>Nick, I am sure you know that what you show here is the custom version of Gill Sans created for the continental/international market. It is an imitation of Futura commented on by Walter Tracy in his Letters of Credit (p. 95). Its alternates — AJMNQRWW and abdgpqstuw (roman), and JMQ and aaefgptu (italic) — are set in a separate line in the ‘Monotype’ Book of Information. The figures look especially unauthentic...</p></blockquote>
      <p>I don't have these books (unfortunately - I guess "Letters of Credit" I should have) so I don't have more information than this.</p>
