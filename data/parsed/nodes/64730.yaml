    <p>Hi,<br>
    I have the dreaded "GPOS feature 'kern' causes overflow of offset to a subtable (0x10b20)"</p>
    <p>I'm learning and trying to understand from past posts here what (a) I've done and (b) what can be done, but I'd just like to ask another question.</p>
    <p>What does the Red Numerical Value in the Kerning Pairs list represent? (trouble I'm guessing)</p>
    <p>And if that is a red flag for trouble, what's the best way to fix. The kerning seems right, but it's red?<br>
    I've looked through Manuals and looked around here.</p>
    <p>Any wisdom in layman terms would be greatly appreciated.</p>
    <p>Cheers</p>
    <p>DJ</p>
