      <p><a href="http://www.ichotelsgroup.com/redirect?path=rates&amp;checkInDate=27&amp;checkInMonthYear=062007&amp;checkOutDate=09&amp;checkOutMonthYear=072007&amp;brandCode=cp&amp;hotelCode=seadt&amp;GPC=AAD&amp;_IATAno=99801505">BOOK YOUR ROOM AT THE CROWNE PLAZA NOW!</a></p>
    <p><em>TypeCon2007 Attendee Rate: $169/night (plus tax)</em></p>
    <p>The TypeCon2007 conference hotel and headquarters is the Crowne Plaza in downtown Seattle. The center of activity for TypeCon2007, the Crowne Plaza is a sweet hotel in a fantastic location. The fabulous Pike Place Market, Pioneer Square, wondrous public library designed by Rem Koolhaas, Space Needle, Experience Music Project, tons of bars and restaurants, and other attractions are close at hand.</p>
    <p>The Crowne Plaza offers wireless or wired high-speed internet access, a spacious but intimate lounge area and restaurant, our own gorgeous outdoor patio, and many other amenities.</p>
    <p>The Crowne Plaza is offering TypeCon2007 attendees a super rate on rooms - just $169 (plus tax) per night. This is an incredible deal in Seattle during the height of summer, so don’t hesitate to book your room ASAP.</p>
    <p>To book online with your credit card, please visit <a href="http://www.ichotelsgroup.com/redirect?path=rates&amp;checkInDate=27&amp;checkInMonthYear=062007&amp;checkOutDate=09&amp;checkOutMonthYear=072007&amp;brandCode=cp&amp;hotelCode=seadt&amp;GPC=AAD&amp;_IATAno=99801505">this dedicated TypeCon2007 link</a>. You can adjust travel dates, preferred room type, and other details on the booking site, as well as find out more info about the hotel.</p>
    <p>To book by phone, call 1-206-464-1980 and mention SOTA/Society of Typographic Aficionados and TypeCon. This is the direct reservations line for the Seattle Crowne Plaza, and we recommend calling this number instead of the national toll-free reservations line to ensure your booking goes smoothly.</p>
    <p><a href="http://www.ichotelsgroup.com/redirect?path=rates&amp;checkInDate=27&amp;checkInMonthYear=062007&amp;checkOutDate=09&amp;checkOutMonthYear=072007&amp;brandCode=cp&amp;hotelCode=seadt&amp;GPC=AAD&amp;_IATAno=99801505">Crowne Plaza Hotel</a><br>
    1113 Sixth Avenue<br>
    Seattle, WA 98101<br>
    Tel: 1-206-464-1980<br>
    Fax: 1-206-340-1617</p>
