    html: |-
      <p>I like this a lot. It seems very original.<br>
      Favorite glyphs: K/k/Q/V<br>
      Widths, especially of the lowercase, seem a bit indecisive: letters like bdhnpq look narrow but a and s look wide.<br>
      The top serif of /G/ jumps out to my eye as unfitting.<br>
      Is there a reason that /j/'s tittle doesn't match /i/'s?<br>
      I'd beef up the serifs on the crossbars of E and F.<br>
      Stay with this, I think it's really promising.</p>
