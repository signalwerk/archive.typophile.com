  html: |-
    <p>This started off as a logotype consisting of two letters; 'ei'. It actually began as a sans (which I'm still working on) but ended up finishing the serif version first.</p>
    <p>This is the first time I have ever finished upper and lowercase Latin alphabet and since I have never really studied typography I am in dire need of some constructive feedback.</p>
    <p>Also, have a guess where I got the name from..</p>
    <p>Cheers in advance</p>
    <p>12/8/2010 - Update - Ive added a few bits and addressed some of the issues raised here. Please give more feedback if possible. Also, do type designers do all the hinting etc themselves these days, or do most get them mastered by pros? Not sure if I have the patience to do 7000 kerned pairs..</p>
