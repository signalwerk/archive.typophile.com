      <p>hi Caleb,<br>
      how's the designing going? I recently got engaged and am also looking at having the wedding in Sonoma area. I in in Toronto and my family is coming from all over, so California is a good middle ground for us. Trying to find stylish, graphic designer-friendly locations that will make gorgeous photos as well as have little details that we can pick up in the design of our stationery, tables, colors, etc. I started collecting some links to wedding invitations that other people have done. There's so many letterpress people in San Fran, so I imagine any of those firm's online portfolios would be good inspiration. Also designSponge  editor Grace got married earlier this year so she did a lot of coverage on wedding design materials. Here's a start:</p>
