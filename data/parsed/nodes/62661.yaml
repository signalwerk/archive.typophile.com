    <p>I would appreciate the inspiration. I recently proposed to my girlfriend. She agreed to become my fiance. Now, I am into wedding design. Any recommendations? Please? Things to think about? Best way to get things printed, pressed, embossed, whatever reasonably and economically? The wedding is for 50 so we can visit with the people we love. The wedding is in Sonoma, CA. We have agreed to have it at Landmark Vineyard: <a href="http://www.landmarkwine.com/" title="http://www.landmarkwine.com/">http://www.landmarkwine.com/</a></p>
    <p>I would appreciate some expert advice. </p>
    <p>I am going to break out the broad nib pen and do some handlettering. I love doing that. Alternatively, I am also looking for some great typefaces for a really contemporary, sophisticated, classy wedding look. Our wedding colors are like red and orange dahlia.</p>
