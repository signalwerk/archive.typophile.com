    html: |-
      <p>The copyright fields are key but also the <em>Names and Copyright/Designer Information</em>,  <em>Names and Copyright/License Information</em> (particularly if you can add a copy of your EULA) and you could add it to the <em>Version and Identification/Identification settings</em> "TrueType Unique ID record:" (having filled in the others try auto-filling this one) and "TrueType vendor code" for which you should be able to add a four letter (all lower case) code.</p>
      <p>After doing that I would update the <em>Names and Copyright/Additional OpenType names</em> field, updating the autofill and then double checking everything.</p>
    html_clean: |-
