      <p>Hello Jean Paul,</p>
      <p>Behind the weight (SemiLight) is the value of that weight missing. All weights need a value which has to be different in every weight. SemiLight has the smallest and Medium the highest number. Normally fontLab fills in the numbers automatically when you choose the weight.</p>
      <p>Best,<br>
      Pieter</p>
