      <p>Thanks Jean, are you exporting TrueType OT or Postscript OT?</p>
      <p>Can you list the complete range of weights? I can already see some components that could be responsible, such as having no weight number specified and the use of numerals in some naming fields (which should probably be okay but <em>may</em> have caused problems in the past).</p>
      <p>Also, have you looked at either of the font naming guidelines below?</p>
      <p><a class="freelinking external" href="http://www.kltf.de/kltf_otproduction.htm" rel="nofollow">Karsten Luecke's guide to font naming</a>.</p>
