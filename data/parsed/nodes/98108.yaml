    <p>My font is ready. It consists of 7 weights. When generating the fonts as usual (FL) all goes well. When importing the fonts in FontAgent, all goes well too. But, when I activate the fonts, the sequence is all mixed up in software like Illustrator. I'd like it to be UltraLight on top and Medium at the bottom. Now it's all jumbled, it's not even alphabetical! Can anybody help?</p>
    <p>Also, when I import the fonts in a Windows environment, it only shows one weight, sometimes four, the orther weights are not there (allthough installed off course). Again, can anybody help? What am I doing wrong?</p>
    <p>Perhaps these questions have been anwsered here before, if so, please redirect me.</p>
    <p>Thanks!</p>
