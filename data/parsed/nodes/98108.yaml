      <p>It would be worth plotting the various components of the naming scheme before outputting. <a class="freelinking external" href="http://typophile.com/node/97784#comment-529418" rel="nofollow">I recently suggested a naming convention based on multiple weights that might be a good basis for comparison</a>.</p>
      <p><a href="/wiki/https%3A/%252Fwww.fontfont.com/fonts/meta" class="freelinking" rel="nofollow">FF Meta</a> is a good example of an existing commercial font family that uses a similar weight structure to the one you are trying to implement.</p>
      <p>As per Pieter's suggestion, you could use a weight/number combination such as this:</p>
      <p>UltraLight	[150]<br>
      Thin			[200]<br>
      Light		[250]<br>
      SemiLight	[300]<br>
      Book		[350]<br>
      Regular		[400]<br>
      Medium		[500]</p>
