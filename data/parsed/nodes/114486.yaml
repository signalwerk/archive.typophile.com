    html: |-
      <p>All three shapes are beautiful and correct.<br>
      The larger medial black and white image should have a small straight line over the diacritic mark as in the other two images though it is not necessary but it will make the word shaping perfect and you will observe the same shaping in almost all Arabic fonts. Yes, in the same medial image, the second diacritic like shape is not necessary as it is also not present in the other images. It is not a mark, but the isolated shape of the same last letter of the word, above which it is made. You may use it or remove it according to the need of design.</p>
    html_clean: |-
