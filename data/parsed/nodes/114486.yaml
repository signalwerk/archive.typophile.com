      <p>I have changed the number 2 since that initial idea because of that.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Round 2-5 evolution Small_5962.jpg"></div><br>
      The 16-segment alphanumeric display, like that shown on wikipedia's gif is exactly why I wanted to change to a more stylized design. In real life the 16-segment display makes some letters look ugly because it's physically difficult to make the segments touch completely in points where many are touching, like the center of the star. So letters like X, W, V, etc., look confusing.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Letter X_6648.jpg"></div><br>
      So, following the likes of Nixie tubes, I thought of the numerals you see keeping the 16-segment count but with a nicer appearance. After the project I couldn't help thinking an entire font could be made with this style and I started StarCo Round.<br>
      Yes, I've seen the dots are overlapping and I will adjust to avoid it. I'd like to understand how much space should exist between letters in arabic and although I've spaced the Alif and Lam-Alif ligature to make it more readable, I haven't found how much space give between other letters. But I keep reading about it :)<p></p>
