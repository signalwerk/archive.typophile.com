      <p>"Apologies to Aristarco for monopolising his page for a private conversation!"<br>
      What!? No! I'm learning a lot, A LOT from this conversation. And I'm avid of learning as I've always been. I've always loved typography but, as an engineer, I had paid little attention to the process of creation and origins. When I started working on an electronic display, I wanted to make something beyond the common 7-segment or 16-segment display and didn't want to go the dot-matrix way. I imagined a more "designed display" to show numbers with more quality, yet keeping the 16-segment approach, and so StarCo Round started to form in my mind. When I started the font I wanted to learn more about typography and here I am, trying to absorb every detail and all the data I can. So interesting and fascinating! And reading your posts helps me in that search for knowledge. So, no apologies needed! Au contraire, thank you for sharing your thoughts!</p>
