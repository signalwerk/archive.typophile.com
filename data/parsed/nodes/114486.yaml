      <p>@Bahman Eslami - I live in Japan so only see those x-rated Arabic fonts only through images.  However I notice the damage seems to be limited to display fonts, advertising and so forth. For body text it seems the norm is the good old naskh-type fonts variations.  That is lucky for me because soon I will be releasing my AlQuds OT families that look 'modern' while retaining the essential generic shapes gleaned from many styles of calligraphy, children's writing and my own design sense hopefully a font to be read rather than flout its own fancy features.</p>
      <p>@hrant - your "tooth height x-height envy" literally saved my fonts from being long in the tooth! Over the years I started increasing the tooth height without realizing it. After reading your phrase I spent the day doing dental work on those dot-supporting 'teeth' to shorten the verticals - so thanks.</p>
      <p>@AzizMostafa  cultures definitely do interbreed - and the strong ones learn from others while retaining their own personality. That Mei Hei font is one of so many other fonts trying to mimick scripts of other languages - for example a Latin alphabet made up of Arabic letter forms is ridiculous at worst and too exotic at best.<br>
