      <p>Aristarco &gt; I'd like to understand how much space should exist between letters in arabic</p>
      <p>As explained here: <a href="http://typophile.com/node/46166#comment-284067" title="http://typophile.com/node/46166#comment-284067">http://typophile.com/node/46166#comment-284067</a><br>
      1. Kill the spaces to the right of all.<br>
      2. Kill the spaces to the left of R and its dotted twin (Z).<br>
      3. Left Space the rest of the  letters (Lam-Alif ligature, D @  its dotted twin) to the narrowest between )(.</p>
