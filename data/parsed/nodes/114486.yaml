      <p>"Marking the black" is my way of referring to rendering the bodies of the letters as opposed to the rendering the black/white border (although sometimes the former poses as the latter). To me the white cannot fully take part in the act of reading when marking the black, no matter how sensitively it's done.</p>
      <p>Yes, I do need to change, instead of wait.</p>
      <p>hhp</p>
