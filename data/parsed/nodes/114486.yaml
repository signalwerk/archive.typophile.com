      <p>My experience in Arabic is limited to having what I call "nativity" in it (I grew up –mostly– in Lebanon) and having made a couple of entirely unremarkable revivals. But my ideas of typographic progress –in any script– have been maturing for almost twenty years, and I'm now very sure that marking the black pulls towards form and away from function; calligraphy creates beautiful men and women that you shouldn't marry.</p>
      <p>Sadly I'm notoriously prone to favoring ideas over production, so I can't actually show anything.... yet. It seems I'm waiting for something to change in my life. I hope that doesn't mean all my kids leaving home, because that's at least 14 years away!  :-/</p>
      <p>hhp</p>
