      The new dots do not look too big to me at all - look at my logo where the dot on the Dad is a bit too big.  As you know in classical calligraphy the dot is a square drawn with the slant of  the nib.  Here is my study of how a 45 degree nib would produce a square dot, and how circling the square (!) would result in a choice of circles. I chose the largest whose diameter is double the line width. Legibility would demand an even bigger circle than that. And if the slant is more than 45 degrees the circumscribed circle would be larger still compared to the verticals, but nearer the horizontal width.<br>
