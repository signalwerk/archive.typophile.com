      <p>Thanks I lived in Beirut in the 60's and 'modern' typography was non-existant then, and I had definite ideas where it should be heading - a sans-serif sort of generic font to start with (hence my AlQuds lettering and now fonts).  The sans-serification of scripts all over the world is a real phenomena and a good one and it happened to Japanese, Thai, etc. Since then a whole generation of typographers were educated also in Beirut, (cutting and pasting Latin letters as I heard to create Arabic letters as a design excercise).  So a sort of Latinized Arabic with little regard for what I consider the traditional essence of the letter shapes is now fashionable. The result are now elegant professional fonts where the letter shapes are too much alike the medial ha same as the dal for example.</p>
      <p>Anyway what is "marking the black" ?  Congratulations on a home full of young kids - that is the best!  And as my daughter keeps telling me "be responsible for your actions" so it is up to to you to change enough to apply your ideas. Good luck!</p>
