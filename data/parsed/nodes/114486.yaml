      <p>An inflated "tooth" area (which I call "x-height envy" :-) and reduction of shape variations are two big symptoms of the disease of Latinized Arabic, but there are others... The good news is that when Arabic is Latinized it's usually very obvious, hence easy to combat; Armenian is much closer to Latin in many ways, so the damage is less but it's also harder to fight... The two big symptoms are an inflated "x-height" and too many serifs.</p>
      <p>Concerning the invention of Armenian, the only formal account we have comes from Mesrop Mashdots's star student, Goryune (which BTW is the name my wife and I gave our middle son :-) but he's relatively clear: Mashdots was commissioned by King Vramshabouh (oh, our youngest son's name is Vram :-) to invent the alphabet in order to combat cultural assimilation. This is why Mashdots did not base the Armenian alphabet on existing scripts. However the scribes who ended up writing in the new script were used to Greek, so they made it more like Greek. But, a caveat: I wasn't there.</p>
      <p>--</p>
      <p>The reason marking the black cannot yield an optimal black/white relationship is that it forces a relationship between the two edges of the black; so no matter how much you want to respect the white, you cannot do so optimally. The parallel I like to draw is with Jefferson and Sally Hemmings: he loved her, but she was still a slave.</p>
      <p>hhp</p>
