  html: |-
    <p>Hey</p>
    <p>Im creating a FLEX interface with fonts sizes 18-22, currently using gotham narrow medium, bold and light.</p>
    <p>I will need to replace gotham with a Unicode font to support:<br>
    - English<br>
    - French<br>
    - Japanese<br>
    - Chinese<br>
    - Korean<br>
    - Spanish<br>
    - Italian<br>
    - German<br>
    - Portuguese</p>
    <p>No foreseeable need for Hebrew or Arabic.</p>
    <p>Any suggestions on fonts I can use, preferably with different weights?</p>
    <p>Thanks, have a sweet day!</p>
