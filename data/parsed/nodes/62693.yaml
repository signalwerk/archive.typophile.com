    <p>I've found a few threads on this topic, but none from the recent past; I'm hoping things might have changed since then (perhaps in CS4, which I'm less familiar with)…</p>
    <p>In InDesign, is there any smart (i.e. truly automatic) way to indent the first line in all but the first paragraph? To date, I've simply been making a separate child paragraph style named "First paragraph" or something like that, but it'd be so much easier if there were some way that wouldn't require me to change each instance by hand.</p>
    <p>I've looked through the InDesign help files, and I'm aware of the "Next Style" feature, but — unless you use InDesign as your word processor, which I don't — it still requires selecting text and applying the changes by hand.</p>
    <p>Basically I'm looking for the InDesign equivalent of CSS <a href="http://webtypography.net/Rhythm_and_Proportion/Blocks_and_Paragraphs/2.3.2/" rel="nofollow">adjacent sibling selectors</a>.</p>
    <p>The fact that the "Next Style" function exists (which is close but no cigar) makes me guess that there isn't anything better, but please correct me if I'm wrong.</p>
