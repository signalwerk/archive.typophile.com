    html: <p>Next Styles isn't really automatic in the same way adjacent sibling selectors are… it still requires you to apply the changes by hand. Given, it can do a large number of changes in one fell swoop, but it does require some kind of preceding paragraph style. It's essentially a glorified find/replace.</p>
