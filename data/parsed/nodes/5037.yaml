    html: <p>I'm interested to know what criteria FL uses for including <br>the encodings when using the auto function. I've developed  <br>an extended latin charcter set covering CE languages. When I hit <br>auto in the Supported Codepages I get a few strange ones. <br>For instance, 857 IBM Turkish and 1258 Vietnamese. <br> <br>Curiosly, fonts like Myriad Pro do not show up in this lower <br>portion of the menu while mine does. (They have nearly the <br>same glyphs, minus the Cyrillic)  <br> <br>What supported codepages relegate the fonts to the lower menu?</p>
