    html: "<p><i> When I hit auto in the Supported Codepages I get a few strange ones. For instance, 857 IBM Turkish and 1258 Vietnamese.</i> <br> <br>Yes, it doesn't work <img src=\"http://www.typophile.com/forums/clipart/sad.gif\" alt=\":-(\" border=\"0\">  Don't trust the auto codepage selection: it almost always adds Vietnamese and other non-supported pages. Codepage support is meant to be very specific: you are not supposed to claim support for a codepage unless you support all of the characters it includes. So the best idea is to manually select codepages that you know your font supports. <br> <br>The InDesign menu has changed recently, I believe. I have not taken a close look at what InDesign CS does.</p>"
