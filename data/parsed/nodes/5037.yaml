    date: 2004-06-02T15:28:00
    votes: null
    html: <p>This was my hunch, but it's nice to be sure. Especially in <br>regards to the need to inlcude all characters for a defined codepage. I didn't know this. <br> <br>As for InDesign CS, the fonts with multi script support still <br>rest at the bottom of the menu.</p>
