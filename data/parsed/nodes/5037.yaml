  html: <p>Hey so maybe I shoulda asked Tom directly, but i figured maybe some of you might know about this as well... I have a couple fonts that show up in the InDesign font menu list in at the bottom of the list in their own separate category (House Industries' Latino Rhumba and Samba for example, but the illustration font shows up in the regular listing) Needless to say, this bugs me. What I want to know is how can I avoid  this problem when building my own fonts? Any insight would be appreciated. Thnx.</p>
