    <p>hi, i’ve been looking all over, and haven’t found anything...</p>
    <p>i’m creating masters for a magazine, using paragraph and character styles...<br>
    my client will not be using InDesign</p>
    <p>several years ago, i used a plugin that copy each paragraph and character style<br>
    to a document of word or pages..</p>
    <p>does anyone know where can i find something similar, that allows me to copy<br>
    the style settings into a document?</p>
    <p>i’ll place an image to give a clear idea of what i need...</p>
    <p>i hope someone can help me!<br>
    thanks a lot</p>
