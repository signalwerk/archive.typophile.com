    <p>Hello,</p>
    <p>I have posted previously a thread about my amateur attempts to make screen font display more crisp on LCD screens, while still preserving font shape. I would like to get some expert advice/opinion about the potential of the method described bellow to display screen fonts.</p>
    <p>My goal is to have a method applicable to any font. The SubLCD approach (invented by Kim Oyhus, see <a href="http://www.oyhus.no/SubLCD.html" title="http://www.oyhus.no/SubLCD.html">http://www.oyhus.no/SubLCD.html</a>) is claimed to allow a 2x compression on the horizontal axis essentially without loss of information through subpixel rendering.</p>
    <p>The obvious thing I tried to do was to generate output text/font (as bitmap, DIB) at 2X higher horizontal resolution than requested, then resize it to the final dimension.</p>
    <p>I used Ghostscript (GS) to obtain the bitmap of a pdf page (antialiased fonts) (Image 1) then resized it (result: Image 2). Compare with Image 4) - GS output without any modification. The method produces some color artifacts that on some LCDs can be annoying.</p>
    <p>To me, it seems that font shape is more consistently preserved by SubLCD (Img 2) vs Adobe rendering (img 3) and fonts are still readable at small sizes, but the color artifacts make this method still not very useable. </p>
    <p>Please let me know what do you think about the potential of this method based on the the results shown bellow:</p>
    <p>  1. Ghostscript image: Original bitmap used to render the text: 2X size (180% zoom)<br>
      2. Ghostscript image: Final text obtained by resizing 1) to 1X (90% zoom).<br>
      3. Adobe image: The same text as in 2) rendered in Adobe Acrobat reader 94.<br>
      4. Ghostscript image: Text at 1X (90% zoom) without modifications.</p>
    <p>Thanks in advance for any comments<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/T3_All2_5663.PNG"></div><p></p>
