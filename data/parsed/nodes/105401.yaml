      <p>A Linotype typeface designed in 1990 by Peter Matthias Noordzij (PMN), and named for his wife, Caecilia. Available from Linotype as <a href="http://www.myfonts.com/fonts/linotype/pmn-caecilia/" rel="nofollow">PMN Caecilia</a> and from Adobe also as <a href="http://www.myfonts.com/fonts/adobe/pmn-caecilia/" rel="nofollow">PMN Caecilia</a>.<br>
      Don</p>
