      <p>&gt;EDIT: Not that I myself would want the books I design to be set by someone else</p>
      <p>That, depending on in the company you work at is something that might happen, as Chris notes before the onset of computers on every desktop that is the way a typographer worked he would do a specification and mark-up to send to a typesetter and then to proof the galleys in conjunction with author and editor. There are fewer typesetting firms although they still exist and the trend seems, in the UK, to be for in-house operations and often for the designer to be typesetter, image creator and manipulator, client and photographer and illustrator contact and jack-of-all-trades although others will have a separation between concept and artwork. There is also a separation between cover design and interior design although this can also be unified, it really depends on the working practices of the company.<br>
      Tim</p>
