    <p>In a world where titles are freely given to others and, in most part, to ourselves. I thought it necessary to clarify a few thing as far as titles in typography are concerned. Now I’m starting to market myself as a <a href="wiki/graphic designer" class="wiki-create">graphic designer</a> who emphasizes in typography. But I have not gone as far as calling myself a <a href="wiki/typographer" class="wiki">typographer</a> for 2 reasons; 1) don’t really know the exact definition of a typographer and 2) Mathew Carter I consider a typographer and I’m nowhere near his level. But, isn’t a typographer someone who practices good typography in all sense not just type design? I don’t consider myself a <a href="wiki/type designer" class="wiki">type designer</a>, I’ve never designed a typeface. But I have, however, done custom lettering. So what does that make me? A <a href="wiki/lettering artist" class="wiki-create">lettering artist</a>? I only ask because I’m designing a self-promotion mailer and I want to be clear on the meaning of the services I offer. Plus I’m hoping this topic might help clarify things a bit. I grow weary of meeting those who call themselves typographers or type designers just because they attended one type course in college.<br>
    What are your thoughts?</p>
    <p>Ivan</p>
