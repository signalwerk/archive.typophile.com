      <p>I recently received a copy of a small pamphlet from Robert Bringhurst entitled <em>The typographic mind,</em> published by Gaspereau Press as one of their occasional series ‘The Devil’s Whim’. It is a good little essay, with something to say about the distinction between graphic designer and typographer, or, at least, something useful to say about how a distinction could be made.</p>
      <p>In purely practical terms, a typographer is someone who uses type, and this may involve using type in the context of graphic design and, as endlessly and tediously demonstrated in so-called typography annuals, it can involve using type as a graphic element, i.e. type as something other than a conveyance for text.</p>
      <p>But I’m inclined to agree with Robert that typography, properly understood, has to be related to text, to language, and that this provides the distinction between typography and graphic design:</p>
      <p><em>‘Graphic design deals with things that only exist in visual form. Typography deals with things that are only incidentally visible. Language is spoken before it is written. It is written in order to be read, but it is read only in order to be tasted and digested in the mind. There is nothing to see at either end of the process—nothing, that is, except the real, which is why language is worthwhile.’</em></p>
      <p>In 2003, I gave the title ‘Between text and reader’ to the theme of the ATypI conference held in Vancouver that year, and I invited Robert to be the keynote speaker. I don’t know if the term typographer can be exclusively applied — i.e. rejecting the generic usage of ‘someone who uses type’ — but certainly the most interesting typographers I know are people who share a commitment to text and to language. They are, to use Dean Allen’s memorable moniker, Textists.</p>
