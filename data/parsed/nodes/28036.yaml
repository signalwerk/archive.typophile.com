      <p>So sayeth Google:</p>
      <p>A typographer is…</p>
      <ul>
      <li>a specialist in the design of printed matter, and in particular the art of typography, the art and technique of selecting and arranging type styles, point sizes, line lengths, line leading, character spacing, and word spacing for typeset applications.</li>
      <li>A person with knowledge of letter design, punch cutting, type-founding and printing processes, who designs printed material from moveable type.</li>
      </ul>
      <p>Except for those few lovable Luddites who still practice the art of letterpress printing, the second definition is laughably quaint. As for the first definition, who is to say that one is a specialist? In the absence of formal accreditation, calling one’s self a typographer isn’t much different from calling one’s self a fashion plate, a oenophile or a guru: saying it’s so doesn’t make it so…unless someone else buys it.</p>
