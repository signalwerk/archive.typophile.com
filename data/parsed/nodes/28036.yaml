      <p>Interesting discussion indeed, Ken!</p>
      <p>Mister M: this discussion reminds me of a quote from Hideo Sasaki, a well-known architect in Boston. He says “Contribution is the only value.”</p>
      <p>Hybrid fields of practice now exist in nearly every industry and boundaries are being blurred on a daily basis (and yes, sometimes gratuitously). We must try to let go of rigid distinctions between professional domains if we want to realize the potential of truly collaborative practice, where knowledge is allowed to compound interest throughout a group of creatives.</p>
      <p>I’m an architect by training, and believe me - I understand your pain with the interior designer story! Architects, being licensed, have very rigid ideas about professional boundaries, usually tied to some level of insurability against liability. But I have also found that professions without the barrier to entry of licensure tend to be touchier about protecting their domains…they feel they have to be since there is no legal protection.</p>
      <p>I’m going back to get a Masters in Graphic Design starting this Fall because I want to work in the environmental graphics arena but feel my formal graphic training needs to be bolstered to practice credibly. To me, it’s not about the degree or title or position, but rather about the knowledge. If you don’t feel you have it, get it, whatever it takes.</p>
      <p>In the end, there is no way to <strong>demand</strong> respect. You can only <strong>command</strong> respect! The way you do that is by focusing on the work and bringing wisdom and insight to the table. Say things at those meetings and design things that are so well considered and smart that their truth seems self-evident. Make solutions that seem inevitable. That will simply trump ignorance and professional pride to the people that matter. Let the rest sort itself out…it will anyways with or without your input and worry and effort.</p>
      <p>It’s amazing to me how much time people in corporate environments spend on learning how to “play the game” instead of focusing on the work and becoming the best they can at what they do. That’s where value is built. The better, smarter, more talented, and more experienced you are at something, the more you are needed…and the jobs will come to you.</p>
      <p>There is also an interesting phenomenon in the professional world where you are never an “expert” at anything until you SAY you are! Nobody told Matthew Carter he was an “expert typographer”. He didn’t wake up one morning and realize, “oh, I’m an expert at typography now.” He just stayed focused on the work for so long and got so good at it, that his status became obvious over time: it worked itself out. If you really want to be a “typographer” and that’s where your passion is, then just say it dammit: call yourself a typographer. But then recognize that you have the terrifying task of dedicating your life to the pursuit of typographic knowledge and living up to it.</p>
      <p>Either have some fun with your title, or just make it so generic it’s meaningless (since it is anyway, really…) Like Miss Tiffany: NICE! So, the business card is “Type Fetishist”?…Love it!</p>
      <p>How about just using “Designer”? Yes, it’s so broad as to be worthless, but maybe that’s exactly what you need to avoid being boxed in. There will inevitably be a follow-up question: “Well, what do you design?”, and that’s when you have the opportunity to list your interests and show the portfolio. It’s unrealistic to expect a reasonably short and printable phrase on a business card to convey all that.</p>
      <p>Cheers All!</p>
