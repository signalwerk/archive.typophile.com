      <p>I like to use the term typographer in Carl Crossgrove’s and John Hudson’s sense. And I also feel that a good typographer knows how to make adjustments to fonts (Bringhurst, in chap. 10 of Elements, speaks of “tuning” the fonts).</p>
      <p>My problem is that I’m trying to find a job as a book typographer (book designer?), but at least here in Finland, where editions are small, publishing houses seem to expect you to be an all-around graphic designer (whose primary job is cover/jacket design).</p>
      <p>There was a thread on the Graphic Designer vs Typographer issue about a year ago (<a href="http://typophile.com/node/15197?from=50&amp;comments_per_page=50">http://typophile.com/node/15197?from=50&amp;comments_per_page=50</a>), where Miss Tiffany said that “someone, usually, cannot only be a typographer”. But maybe I could be a typographer, book designer and typesetter? (Thanks to my education as a linguist, albeit primarily a phonetician, I could perhaps be a little bit of editor as well.) Is this still too narrow?</p>
      <p>In other words, is it viable to concentrate on the design and typesetting of the book block (and perhaps hope to have a say on the choice of format and on the case design)—to do everything except cover/jacket design and image scanning/manipulation/color correction and illustration?</p>
      <p>Unless I’m considered too nosy to ask about this, I’d be interested in knowing what combination of things you guys actually do—or plan to do—for a living (if it’s type-related).</p>
      <p>Pardon the long post (and my inability to do HTML)!</p>
      <p>Olli</p>
