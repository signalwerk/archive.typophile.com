      <p>I wish I had a good or clever answer for this.<br>
      Frankly, I think “typographer” has become an archaic term referring to one who is much more than just a practioner of typography. </p>
      <p>Once, being a “typographer” was an actual profession, though one <em>without accreditation or degree</em>, such as architects or chefs are.</p>
      <p>Today, it’s much the same way someone might consider themself a “photographer” as it has become somewhat <em>easier</em> to produce photographic imagery consistently with greater fidelity using relatively inexpensive photographic equipment. Technology has helped to achieve the “craft” aspects that otherwise would have required training and experience on the operators part.</p>
