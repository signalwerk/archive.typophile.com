      <p>To me typesetting is formatting and fitting text to specifications from the client.  Typography is more qualitative.  It takes typesetting beyond the level of being a stockboy in a supermarket who sees to it that all the Peas and Quinces are kept stocked into their proper place. The typographer is also concerned with the quality of the experience of the perceiver and the effortless flow of communication—the art and the craft of it.</p>
      <p>ChrisL</p>
