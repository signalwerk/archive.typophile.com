      <p>Once upon a time a typographer was more akin to a type setter but elevated to more of a quality craftsman who had very good visual sensitivity as well. The type setter as profession is now gone in this postscript world and the typographer may need some more graphic design skills to find enough work in some places (perhaps Finland?).  I started work as a graphic designer in the 1960s but also worked briefly as a type setter. I also studied caligraphy in design school. I always had a great interest in typography and used quite a bit of type in my graphc design work over the last 45 years. In the past 2 years I have begun to design typefaces. I don’t know what my “title” is anymore and I don’t know how much that matters. I think you need to get a portfolio together of your work and show it to potential employers.  They will hire you or not based on what they see, not on what title you assign to yourself.</p>
      <p>ChrisL</p>
