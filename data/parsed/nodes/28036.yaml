      <p>Wow, what a great response to the post.</p>
      <p><em>would not refer to myself as a typographer because I don’t want to pigeonhole myself</em>.</p>
      <p>My thoughts exactly pattyfab. Especially because I believe no one will just hire a typographer in adittion to a graphic designer. But it helps me in describing the services I offer. For example, If I where marketing myself to a publisher I would describe myself as a graphic designer who emphazises in typography. But if I where marketing myself  to a signage manufacturer or a full service architectual firm, then I would belive it would be beneficial to describe myself as a typographer as I feel that typography and the way information is displayed is more important, in my opinion, than the design.</p>
      <p>One example, I recently met this woman who heads up the wayfinding committee in a hospital. Her job is not to design the signage, but to insure consistancy is maintained. The design is being handled by an interior designer who , in my opinion, knows very little about typography. Her typesetting is too tight, signs are filled with superflous info and she seems to be under the impression that if people can’t navigate to where they want to go it’s because their aren’t enough signs, so she adds more. I swear some of these hallways are starting to look like some of the streets in Beijing:) On top of that, she’s not a very nice person. Anyway, I’ve been  giving feedback and I feel that because I have described myself as a typographer that feedback has had more credibility than someone who is perhaps ‘moonlighting’ as a signage designer.</p>
