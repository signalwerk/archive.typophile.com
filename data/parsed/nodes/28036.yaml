      <p>Interesting discussion.</p>
      <p>I think ‘typographer’ can be used much the same way that ‘photographer’ is used. The degree of skill any person has in either field is not implied, and can be qualified by modifying words. Thus, a person can be described as being a ‘great photographer’, a ‘good photographer’, or a ‘crappy photographer’. Therefore, I think one can rightly say, <em>“I am a typographer, though not in the league of Mathew Carter”.</em> And then genuflect. :-)</p>
      <p>Like Chris, I also started my career in the heady days of hot wax and traditional paste-up. That included a goodly number of years working as a typesetter. I would say a ‘typesetter’ was only responsible for keyboarding (and for operating the machine). Once the galleys of type were processed and could be viewed, the art of the thing commenced: proofreading, kerning, H&amp;Js, etc., as Patty suggests. These operations were considered separate from typesetting. Until the advent of the desktop computer, we didn’t have WYSIWIG monitors.</p>
      <p>Now, with the machine on everyone’s desk, the lines of delineation are blurred. I can be a typesetter and a typographer and a designer. (I can even be a photographer!)</p>
