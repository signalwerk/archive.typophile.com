      <p>&gt;But, isn’t a typographer someone who practices good typography in all sense not just type design?</p>
      <p>I think you nailed it there, type design is a separate but overlapping discipline, Aziz’ checklist would give an information designer a tricky problem. Computers have blurred the distinctions so much that it is almost possible to tick or cross every box, for me though, being a typographer means being able to appreciate at least some of the nuances of type design, while being more conversant with graphic design (which itself covers a wide spectrum of disciplines). Deeds not words – ultimately the proof of one’s title is in one’s work.</p>
      <p>Tim</p>
