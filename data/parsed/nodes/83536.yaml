    html: |-
      <p>The exclamation mark indicates a "sticky" thread -- meaning one that always appears at the top of a forum list (usually this is a Read Me type of thread). </p>
      <p>If you have posted in a thread, then it will appear in the Track tab of your user account page. (Many people will post a dummy comment in order to make a thread appear there.)</p>
      <p>Alternately, you can bookmark a thread by clicking on the faint "bookmark" icon in the upper right of the initial post in a thread. When you do, the icon will turn solid and red. </p>
      <p>To access the list of your marked threads, click on "My marks" under your account name in the upper right sidebar.</p>
