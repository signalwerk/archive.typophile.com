    html: |-
      <p>In order to successfully insert images, you will need to remove any spaces from the file name.</p>
      <p>The blue icon with the lock means that the thread is closed to new comments.<br>
      The red circle means there is a new unread reply.<br>
      The red flame means there are lots of new unread replies.<br>
      The exclamation mark, I don’t know/remember. Maybe that it’s a new thread.</p>
      <p>Here’s the best place where starting your searches:<br>
      <a href="http://typophile.com/search/google" title="http://typophile.com/search/google">http://typophile.com/search/google</a></p>
