    <p>i am new to typophile and I am not fully aware of the different icons, navigations here. I would like to know what the icons (attached image) stand for? when I search for anything (in particular) I guess, i end up getting mixed search results. So is there a particular way I can track few discussions say like anything regarding kerning or about type classification... etc?</p>
