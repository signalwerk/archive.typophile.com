    votes: null
    html: <p>Broadly, each typeface was shown on a screen at a very small, illegible size, using a common English word. The word was then made progressively bigger, quite quickly. The sitter had to press a button when the type became legible. The sitter was asked what the word was, to make sure they had read it correctly. The different reaction times were then compiled and compared against one another. Using this method, Frutiger bold came out as most legible, followed by BAA Bembo, followed by Vialog. I can't remember how many people were tested.</p>
