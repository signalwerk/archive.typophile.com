    html: <p>The signage typeface used at the moment is called BAA Bembo, and was drawn by Shelley Winter. I believe Freda Sack worked on it too. I Recently went to a Sign Design Society talk by Rob Waller, who has done some legibilty testing on it. His testing showed it to be surprisingly legible compared to Frutiger and Vialog.</p>
