      <p>So is the screen the environment that the typeface will exist in, and have to be legible in? Or is it going to be used on physical signs? If it is the latter, I'm afraid that the "Legibility Study" you refer to is meaningless.</p>
      <p>Unfortunately this is quite common, designers make decisions about how a typeface is suppose to function based on a screen environment. The only way to test legibilty of signage typefaces is to but them in the real environment, made out of the real materials that they will eventually have to perform on. Anything less is smoke and mirrors.</p>
