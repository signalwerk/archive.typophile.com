      <p>I’m guessing you don’t need exact matches and given the era of the film I think these will all have been hand-painted anyway. </p>
      <p>Good news is that there are many western-themed fonts similar in spirit to the words in caps so here are a few you might pick from:<br>
      <a class="freelinking external" href="http://www.linotype.com/514716/cowboywesternregular-font.html" rel="nofollow">Cowboy Western</a><br>
      <a class="freelinking external" href="http://www.fonts.com/font/monotype-imaging/pl-davison/americana" rel="nofollow">PL Davison Americana</a><br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/kimmy/addison/circus/" rel="nofollow">Addison Circus Drop</a></p>
