      <p>I doubt Accidental Presidency is sampled or remixed from another source. There are too many hallmarks of amateur work in it.</p>
      <p>Note for example that the lowercase rounds are shorter than the x-height instead of taller, or the mess in the counter of the lowercase “g”, or the wildly inconsistent sidebearings. Should a lowercase straight get a sidebearing of 34 or of 8? This might be a “design feature” if you were to think of this as a grunge font, I suppose.</p>
      <p>Of course there are a number of free fonts that are of truly professional quality, and a number of commercial fonts that are of pretty dubious quality. But if one were to graph the frequency of various quality levels across the two groups, there would be two big normal curves which would only overlap in their tails.</p>
      <p>On the other hand, if you buy a commercial font, you may be overpaying for the value of what you get, and there’s never any danger of that with a free font.</p>
      <p>I don’t hate free fonts, and I don’t find them particularly threatening, because they are so far removed from what I do on a day-to-day basis. I do sometimes find it frustrating that it’s a lot of work to explain to people how far removed the average free font is from the kind of work we do.</p>
      <p>Cheers,</p>
      <p>T</p>
