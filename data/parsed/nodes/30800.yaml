      <p>I think the awesome thing about free fonts is that they enable someone, say a student designer, to learn without cost. I’m a student. I’m poor. So what did I do? I went free font hunting. But after downloading everything in existence, looking and examining them to see their letterforms and character sets, and printing out a sample I came to a scary conclusion:</p>
      <p>There are two reasons that people can charge for fonts. Those reasons are called knowledge and skill. (Aside from time and overhead, etc.) The skill in gently crafting the bowl of a lowercase b. The knowledge of exactly where the lines of perfect geometry need to be broken to make a letterform <cite>appear</cite> perfectly geometric. Etc., etc.</p>
      <p>But that doesn’t change one pertinent fact: What a type designer chooses to charge for his/her work is none of my damn business.</p>
      <p>And if someone like Nick here wants to give/sell cheaply his work and it fits the criteria of the design I’m doing, why would I complain?</p>
