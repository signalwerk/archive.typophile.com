      <p>All stinkers. . . you get for what you pay for. . . you will rarely come across some alright free fonts which is fine. If there is an EULA, read it. When I first started GD school I didnt even know the scope of fonts, but very quickly I came to learn that the free ones arnt really worth it. You may find something that works for display text, but I would be hesitant to set body of text with what Ive found for free out there. </p>
      <p>Make sure its not a rip off of someone else’s hard work. Type in “free fonts” in the typophile seach box, youll find plenty of threads/nodes regarding this subject.</p>
      <p>What are you using the fonts for? What is your desire for the font?</p>
      <p>BEst advice, take a look at some of the top typeface design sites and see what you think of those faces vs. the free ones you have come across.</p>
      <p>Off the top of my head:</p>
      <p>myfonts.com (affordable for the most part)<br>
      typography.com<br>
      linotype.com<br>
      veer.com<br>
      fontfont.com<br>
      fontshop.com</p>
      <p>There are lots of very respectable good type houses out there.</p>
      <p>I hope im on the right track on this answer, any more seasoned typophilers please correct me if im wrong. </p>
      <p>Cheers</p>
      <p>James</p>
