      <p>That work can be done quickly does not imply that it must be done poorly. </p>
      <p>I worked for a while at a rather low-end sign shop. We’d bill $60 an hour for design work beyond very basic typesetting (which in the case of signs is typically anything beyond a business name and tagline plus address and phone number). With clients that often balked at paying over $200 for a pair of truck magnets (and few who would spring for more than a half hour of design fees), some shortcuts had to be taken. Even under those conditions I strove to do work I could take pride in.</p>
      <p>I’m not denying there are a lot of bad fonts out there, and though there ought to be some measure of quality control, some of those do get out through commercial channels, just as there are a handful of masterful works that their designers choose to distribute for free.</p>
