      <p><em>All stinkers… you get for what you pay for…</em></p>
      <p>Disinclined as I am to making categorical statements—if, for no other reason than they are a primary source of many of the world’s miseries—I am nonetheless fascinated by the conviction with which they are often uttered.</p>
      <p>More to the point, if one gets what one pays for, what is the threshold of worth in a font? Is ten dollars too little to pay, and thus the font is crap? Is a forty-dollar font twice as good as a twenty-dollar font, and an eighty-dollar font twice as good as the forty dollar one and four times better than the twenty-dollar font? Curious minds want to know...</p>
