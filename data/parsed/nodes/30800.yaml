      <p>Muzzer-<br>
      “!=” is geek shorthand for “not equal”. I was responding to Chris’s assumption that a free font was automatically a poor font, if it was appropriate for quick/slapped on use. I couldn’t find the html code for a slashed equals sign, so I used the ascii equivalent. It comes from some programming language, where “!=” defines one variable as NOT being another.</p>
      <p>As someone who has released more free fonts than commissioned and commercial faces, I will admit that the quality is erratic. Even though I release free display types specifically to fight the stereotype of small character sets, rip-offs, and other lameness, They don’t get all the love the $ fonts do. For revivals, I try to be very caring however, since I’m not otherwise honoring the original’s design. That’s why I have only one so far.</p>
      <p>Cuttlefish-<br>
      Yes, I think so. maybe I can mock something up like what I mean. I’m not too good with interactive db-driven sites, but I might be able to cobble some sort of example where people could moderate fonts on build quality.</p>
      <p>Ryan-<br>
      I think the consensus was nailed in your own OP.</p>
      <p>Everyone-<br>
      I don’t think this is simply a board of free-font haters. I find the knee-jerk venomous reactions amusing. Appreciating free fonts is truly a conflict of interest for some people. Others just happen to hate corny decorative faces, which are often free. And some folks are more into the function than form, too.</p>
      <p>Thylacine-<br>
      I agree with you on every point. As for your question of why, here’s a long answer (italicized for those who want to skip it):</p>
      <p><em>When I was younger I was crazy for Nick’s and Ray’s fonts. Even though I then had no idea who they wer, or that they were even alive. ;) The idea that you could do what they made possible was exciting and in the end, inspiring.  I feel the world looks better, literally, for their input. (In fact, finding out that many of the most important people in type design are alive now is astoundingly cool.)</em></p><em>
      <p>Free is an easy way to get them out there. And seeing one’s faces used is titillating. I would never have used one of my decorative faces for setting long poems on a web page, but someone has.  I don’t know if anyone but the author and I see it as she envisioned it, but it was ...interesting. And probably still better than using the same old, “workhorses”.</p>
      <p>There is also something amazing that in this industry, I didn’t need to be a “font merchant” to receive sincere recognition. I haven’t won mass awards, but then I haven’t paid to enter the comps, either. The indirect encouragement of Ray Larabie, Fontplayer, Luc Devroye and others has affected me profoundly. I feel I am a far more cogent artist these days.</p>
      <p>Last, I do things that are pointedly experimental, and that I consider more art than design; to me, giving them away sometimes simply feels right. There are quality free text fonts out there as well (documented above), I imagine the reasoning is as varied as as the designers, and as complicated as my own.</p>
      </em><p><em>Although I release free fonts under very liberal licenses for use, and sometimes modification, it has still actually led to some paid licensing. Had they been commercial only, they might never have had the exposure to create that demand. The free fonts have also led to very fun commissions.</em></p>
      <p><a href="http://www.chozcunningham.com">Choz Cunningham</a><br>
      <a href="http://www.exclamachine.com">!Exclamachine Type Foundry</a><br>
      <a href="http://www.exclamachine.com/snark">The Snark</a></p>
