      <p>The “you get what you pay for” saying may not apply litterally in this case. You have to compare apples to apples. A $50 opentype Pro font from a text family with very full Character and feature set may be actually worth more than 5 times that of a $10 type 1 display face with only a basic character set. A face by a top notch designer may be worth much more than a comparable one by a barely skilled one.<br>
      The statement may better be said “sometimes you get what you paid for, but sometimes you get screwed and sometimes you get a bargain.” The educated consumer has a better chance at coming out ahead or at least even.</p>
      <p>ChrisL</p>
