      <p><em>These (with the possible exception of PBS) are exactly the people that should be using licensed fonts!</em></p>
      <p>I beg to differ; I submit that a designer is doing his or her job properly if the choice of font, regardless of its cost, is appropriate to the assignment. In the case of <em>Smallville</em>, the assignment was to produce a banner that one would expect to see at a high school dance. Would a high school student head to Veer and drop 80 bucks for a font, or would he or she scope out the free stuff? I think the designer understood—and executed—the assignment perfectly.</p>
      <p>In the case of <em>Blue Collar TV</em> and <em>Tank McNamara</em>, the font of choice was Team Spirit, a “jock” font, the particular style of which—until I released an improved commercial version named Boola Boola last year—wasn’t available anywhere else, at any price. Again, the use was entirely appropriate to the purpose at hand.</p>
      <p>Naturally, I would prefer that, all things being equal, designers would purchase my commercial fonts rather than use my free fonts. But all things are not always equal, and sometimes the free font is the better choice. If the shoe fits, wear it; if the font works, use it.</p>
    html_clean: |-
      <p><em>These (with the possible exception of PBS) are exactly the people that should be using licensed fonts!</em></p>
      <p>I beg to differ; I submit that a designer is doing his or her job properly if the choice of font, regardless of its cost, is appropriate to the assignment. In the case of <em>Smallville</em>, the assignment was to produce a banner that one would expect to see at a high school dance. Would a high school student head to Veer and drop 80 bucks for a font, or would he or she scope out the free stuff? I think the designer understood—and executed—the assignment perfectly.</p>
      <p>In the case of <em>Blue Collar TV</em> and <em>Tank McNamara</em>, the font of choice was Team Spirit, a “jock” font, the particular style of which—until I released an improved commercial version named Boola Boola last year—wasn’t available anywhere else, at any price. Again, the use was entirely appropriate to the purpose at hand.</p>
      <p>Naturally, I would prefer that, all things being equal, designers would purchase my commercial fonts rather than use my free fonts. But all things are not always equal, and sometimes the free font is the better choice. If the shoe fits, wear it; if the font works, use it.</p>
