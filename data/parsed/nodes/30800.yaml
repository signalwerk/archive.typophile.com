    <p>Hello, </p>
    <p>I’m green to this site, and it seems like alot of you are very knowledgeable in the typographic arts. </p>
    <p>My question is this:</p>
    <p>What is the general consensus about the free fonts available online through sites such as 1001freefonts.com? I’ve used a few for effect here and there, and I’m wondering if anyone else has done the same. There are quite a few stinkers out there, but a couple of them are quite nice.</p>
    <p>Thoughts?</p>
