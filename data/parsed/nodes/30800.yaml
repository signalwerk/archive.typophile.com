      <p>While the arbiters of taste here, and the oh-so-clever folks in <a href="http://typophile.com/node/30804">this</a> thread are bashing free fonts, there might be a few salient points you might want to consider...</p>
      <p>First off, for many of the people who make these fonts, it’s a learning experience; as such, beginner’s mistakes are to be expected and, unless you played the Minute Waltz flawlessly in 57 seconds the first few times you attempted it, the mistakes should be tolerated as well. Some fontmakers improve their skills with time, some don’t. <strong>Some</strong> is not <strong>all</strong>—even <strong>most </strong>is not <strong>all</strong>; so, please, can the categorical statements.</p>
      <p>Secondly, just because a particular font may not suit <strong>your</strong> purposes doesn’t mean that it doesn’t suit someone’s purpose. I cannot begin to tell you how many emails I have received from underfunded nonprofits, churches, youth groups and the like, thanking me—sometimes blessing me—for providing them with free fonts to dress up their projects. And it’s not only organizations with limited means who have used them: Turner Classic Movies (print ads), Warner Brothers Television (props in <em>Blue Collar TV</em> and <em>Smallville</em>), the Tank McNamara comic strip—even PBS (program titles for a Soul Stars of the 70s special)—have all found appropriate uses for some of my freeware fonts. I also cannot begin to tell you how many people have “appropriated” my free fonts and packaged and sold them for profit, without asking and without sharing those profits.</p>
      <p>So, maybe it’s time to lighten up on the freeware folks. Respect, I realize, is out of the question, but the common courtesy of consideration on a case-by-case basis, rather than wholesale dismissal, is not, I believe, too much to ask.</p>
