      <p>I’m simply pointing out that if they are using freeware fonts, they are still using them within the terms of a license. So, no foul there.</p>
      <p>If you find exactly what you need for free, legally and honestly, there is very little point in paying the designer. But the number of free type designers is shrinking, I hear. And a very small # of people pay anyway, presumably for the same reason the designers give the type away.</p>
      <p>That big businesses should have to pay, but that PBS or “the little guy” shouldn’t is a political view that I happen to mostly agree with, but it is just a viewpoint, and what some other designer does with his own work isn’t subject to my paradigm. There is no Font Recording Artist Association to buy us laws, fix prices, create racketeering schemes, sue grandmothers and force manditory payment systems. If there were, we wouldn’t even have this conversation, as the free fonts would be buried in a avalanche of hype for the pay ones.</p>
      <p>I personally prefer what we have now, I think. It looks like it is the leftover copyrightless mess from when the obsolete metal-based foundries of the past assumed that media-industry like protection would have only hindered them.</p>
