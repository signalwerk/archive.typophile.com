      <p>I don’t understand why there is so much hate here for free fonts.<br>
      Sure, most of them are not particularly useful to professional designers, and many are poorly constructed, but that does not mean that all free fonts are wholly without merit. A quirky display font can be quite handy for a quick logotype or for slapping a slogan on a soda cup. Not every font has to work in columns of dense text, but even then there are some free fonts that can do the job.</p>
