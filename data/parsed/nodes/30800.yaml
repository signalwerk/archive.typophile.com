      <p>There’s nothing inherently wrong with free fonts, but neither is their anything wrong with free food or a free haircut. The problem is that free just doesn’t get you much most of the time. Yes, there might be a few higher-quality fonts available, but this still doesn’t alter the fact that most are near junk.
      </p><ul>
      <li>Most free fonts were slapped together by amateurs.</li>
      <li>Many free fonts are simply scanned and and sloppily converted.</li>
      <li>Most free fonts lack attention to detail and precision.</li>
      <li>Most free fonts lack a decent set of kerning pairs.</li>
      <li>Most free fonts do not come in various weights or italics.</li>
      <li>Most free fonts do not contain a reasonably complete character set.</li>
      <li>Many free fonts are rip-offs of other people’s work.</li>
      <li>Most free fonts lack good (if any) hinting.</li>
      <li>Many free fonts have far too many control points (usually as a result of converted scans).</li>
      <li>And most are just, umm, ugly.</li>
      </ul>
      <p>A couple of my older commercial Type 1 fonts regularly show up on free font sites after others have opened them and simply resaved them in another format (with or without minor tweaks) and uploaded them to the Internet. I’ve opened some of these stolen fonts and most even have my copyright informations still embedded in them.</p>
      <p>I’ve sometimes used a free font for display work, but I could count on one hand the times when I’ve really been impressed by what I’ve found. It takes weeks or months to design and built a decent, high-quality font — there might be a few talented hobbyists out there willing to give away that kind of work, but I’m stumped as to why. On the other hand, if you want a grungy or special look of some kind for a word here and there, sure, by all means use a free font if you can find one that works. Just try be careful about it really being freeware and not a simply mislabeled piece of stolen software.</p>
