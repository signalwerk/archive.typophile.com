    html: |-
      <p>There is a font matching your sample called <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=FontShop&amp;ffam=ArgosGeorge%20-%20Regular&amp;fid=fc0916ed3a17d0280c6ac27ca0249c83&amp;fsize=60&amp;text=Its%20better%20to%20have%20loved%20and%20lost%20a%20Psycho&amp;wrap=2" rel="nofollow">Argos George</a></strong> (FontShop, 1999) but I cant find it anymore in FontShop's fonts.<br>
      The copyright says "Copyright (c) FontShop, 1999. All rights reserved. Designed by G. Lemmen in the beginning of the century"</p>
      <p>Luc Devroye's info on Georges Lemmen:<br>
      <a href="http://luc.devroye.org/belgiumfonts.html" title="http://luc.devroye.org/belgiumfonts.html">http://luc.devroye.org/belgiumfonts.html</a></p>
      <blockquote><p>Belgian who worked with Henry Van de Velde. He was born in 1865 in Schaerbeek, and worked as a painter and designer. He died in 1916 in Ukkel. Creator of Argos (1908, W. Drugulin, an art nouveau alphabet).</p>
      <p>For a free digital version, see <a class="freelinking external" href="http://www.moorstation.org/typoasis/designers/mueller/a_f.htm" rel="nofollow">Rick Mueller's Argos</a>. For a commercial digital version, see David Nalle's <a class="freelinking external" href="http://luc.devroye.org/DavidNalle-Bucephalus-1993.gif" rel="nofollow">Bucephalus</a> (1993). Dan Solo calls it Argos George. Berthold AG's phototype collection has it as Georges Lemon. However, the original name, according to Klingspor, is George-Lemmen-Schrift. </p></blockquote>
