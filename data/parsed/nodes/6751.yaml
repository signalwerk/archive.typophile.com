    html: "<p>Thanks for all your advice everyone. I recieved the finished cards from the printer today, just in time for a conference I'll be at over the weekend. <br> <br>The transparency and metallic ink look fantastic in person. The dark grey band actually looks like a more transparent strip of paper against the translucent white. Readability is great, and I'm quite surprised by how stiff they turned out. <br> <br>Here are some shots: <br> <br>The final card design as sent to the printhouse <br><img src=\"http://www.typophile.com/forums/messages/29/51238.jpg\" alt=\"\"> <br> <br>A bad shot of the card against white paper. You can see the metallic ink in this shot <br><img src=\"http://www.typophile.com/forums/messages/29/51239.jpg\" alt=\"\"> <br> <br>The card against my page-a-day calendar. This shows the transparency of the card. <br><img src=\"http://www.typophile.com/forums/messages/29/51240.jpg\" alt=\"\"> <br> <br>Specs: <br>   3.5 x 2 <br>   2/0 (Metallic 8183 and black) <br>   Chartham Clear 48# Translucents (Reich Paper) <br> <br> <br>Once again, a sincere thank you to everyone who helped out on this project (and those who followed it but didn't speak up) <br> <br>-Mike</p>"
