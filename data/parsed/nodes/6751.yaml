    html: "<p>It's too busy and the information hierarchy is not clear. It is obvious that the logo is the first read, and the name is a clear second, but the rest of the information seems a little confusing. Suggestions: <br> <br>1 Decrease the size of \"Communications Consultant\" unless the title is more important than the actual contact information. <br> <br>2 Either lose the gray band or find a way to create more space between the enclosed type and the edges of the gray band</p>"
