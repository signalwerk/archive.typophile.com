    html: "<p>Hello again, everyone! <br> <br>I briefly considered swapping the parenthesis with square brackets, but taking the punctuation marks out altogether might work too. Here's how it would look: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/49657.jpg\" alt=\"\"> <br> <br>I think I personally prefer the version without the brackets, but please let me know what you think. <br> <br>I like your idea about printing the bar on the back of the card. The paper is quite translucent, but a really dark bar on the back might look good. I'm going to raise this with my printer and get their opinion on this. <br> <br>As for the paper with the lines, I decided to dump it late last night. Even though these lines were evenly spaced and looked nice on their own, I have a feeling they would only conflict with the simplicity of the card and add unnecessary clutter. <br> <br>Thanks again for your comments on these drafts! <br> <br>-Mike</p>"
