  html: <p>Hi everyone, <br> <br>I've been looking around the web for information about transparent business cards, so I figured I'd ask here. <br> <br>Here is my proposed design for the business card. I think I want it on transparent acetate or similar. The areas in white will be clear. <br> <br>I'd appreciate any comments on the card design, and tips/warnings from anyone who has printed on clear or semi-transparent media before. <br> <br>Many thanks for any assistance rendered! <br> <br>-Mike <br> <br><img src="http://www.typophile.com/forums/messages/29/49294.jpg" alt=""></p>
  html_clean: <p>Hi everyone, <br> <br>I've been looking around the web for information about transparent business cards, so I figured I'd ask here. <br> <br>Here is my proposed design for the business card. I think I want it on transparent acetate or similar. The areas in white will be clear. <br> <br>I'd appreciate any comments on the card design, and tips/warnings from anyone who has printed on clear or semi-transparent media before. <br> <br>Many thanks for any assistance rendered! <br> <br>-Mike <br> <br><img src="http://www.typophile.com/forums/messages/29/49294.jpg" alt=""></p>
