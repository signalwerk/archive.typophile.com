    html: "<p>Mike, <br> <br>I like the design in general. <br> <br>I agree with Scott's (as always) well made points. I also would like to suggest a couple of things: <br> <br>1. The cross-alignment of your name, title, and email on the left with the other contact info on the right needs a little attention. You might try aligning the top of your phone number with the top of your name and the bottom line (your web address) with the bottom of your email and then split the remainder with the lines in between. Losing the quote is good advice and would help you give breathing space. <br> <br>2. If contact info is on the right then shouldn't email be grouped there too? Did you try that? <br> <br>3. The parentheses around the area code of your phone number make the line appear indented, you might want to nudge it to the left. Trust your eyes after your grid is defined. <br> <br>4. Any reason for the dotless 'i's? I only ask because I noticed it not because I have any crit of it. <br> <br>5. You might try reducing the size of your logo and separate it with more white space. This will set it off more and reducing the size of your title will help too. Further to this (and further to my point 2.) I would reduce the size of all the contact info and put the email on the right. If you want to make it primary put it first. You could try bolding it too. You'd have to see. <br> <br>Roughly then the card becaomes four quadrants (though not necessarily strictly delineated): <br>Upper left: logo <br>Upper right: whitespace <br>Lower-left: name and title <br>lower right: contact and location <br> <br>I'd better stop now. I haven't been around for a bit and I'm going to overfunction. Hang in there! Keep us posted. <br> <br>Jon</p>"
