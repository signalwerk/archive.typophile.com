    html: <p>Looks like offset on GillClear or Glamma - not a real difficult print job - ask your printer to use hard dry ink and it will dry much faster. Cindy - did you mean Yupo? I have done menus on Yupo that didn't have any problem - although like with Gill Clear or Glamma you should request hard dry (sometimes called fast dry) inks. Also make sure they are using an oil based ink with enough drying agent. I asked a press op what he does to keep synthetic stock from smearing and he said not to run it too heavy, and to use the right ink - not just what your printer has on the shelf.</p>
