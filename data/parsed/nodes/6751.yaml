    html: "<p>Hello again, <br> <br>Scott and Jon: thank you very much for your critiques. I really appreciate the assistance you both provided! <br> <br>I've drafted up a new proof of the business card. The top graphic shows how the grid is laid out, and the second graphic is the card without the guides. <br> <br><img src=\"http://www.typophile.com/forums/messages/29/49550.jpg\" alt=\"\"> <br> <br>I've tweaked font spacing, layout, and sizes. I think I'm much happier with how the card looks now. <br> <br>Jon, regarding the email address: when I put it in the column with the other contact info, the card became so off-balanced that it didn't look right. As well, my email address is how I do the majority of communications, so I like how it's \"front-and-centre\" compared to the other address elements. As per your suggestion I also scaled down the logo size, and I prefer how this looks. <br> <br>Scott, I left the grey bar in (but I increased the total size of it) since it really looks empty and unfocused without it. <br> <br>Thanks for your tips on the printing type. I am going to use Pantone Metallic 8183 C on the logo, and will be printing it on one of these stocks: (still waiting to hear back from my printer) <br> <br>CTI Paper USA - Glama Natural Clear 48 lb. <br>Reich Paper - Clear #48 <br>Gilbert - Gilclear Fineline Heavy (this one has very faint lines watermarked into the paper. I'm still debating if I'll use it, or if I'll go with the plain translucents above) <br> <br>I am really excited about how this is shaping up, though more comments on this new draft are greatly appreciated! <br> <br>-Mike</p>"
