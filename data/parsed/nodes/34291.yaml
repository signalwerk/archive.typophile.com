    <p>Although Ottawa Senators may have been anointed as “Canada’s Team,” it is true that the Anaheim Ducks (formerly The Mighty Ducks of Anaheim) have more Canadian players than the Sens.</p>
    <p>But more important than that, the Ducks have Teemu Selanne, the pride of Helsinki, drafted by my Winnipeg Jets fifteen years ago, who finally gets to have his name engraved on Lord Stanley’s mighty cup.</p>
    <p>As a proud Winnipegger, I am very pleased to acknowledge the superiority of the Ducks and Teemu over the Sens.  Our dog, Spot, the miniature English Bull Terrier and serious Montreal Canadiens fan who has a sophomore card of Saku Koivu, also woofs her approval for all Suomi hockey players.  </p>
    <p>Only three months until training camp.  ;-)</p>
    <p>(Let us now all stand and hum the <a href="http://www.hockeytheme.com/FrameRHistory.htm"><em>Hockey Night in Canada</em></a> theme.)</p>
