    html: <p>It will take a bit of work to make any bold script font look like that. Have a look at the scripts here at <a href="http://www.letterheadfonts.com/fonts/styles/script.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Letterhead Fonts</a> which are aimed at traditional signmakers, and have a look through their gallery &amp; tutorials to see how they get this sort of effect.</p>
