  html: <p>Ok, I hate fake italics as much as the next person, but I need some help...  <br> <br>How come some typefaces (that don't come with an italic) can be obliqued in Quark and they print fine, while others strip out the obliquing and  print as roman?  <br> <br>Is there a quick fix that can be done to a font to get it to accept Quark's fake italicizing?</p>
  html_clean: <p>Ok, I hate fake italics as much as the next person, but I need some help...  <br> <br>How come some typefaces (that don't come with an italic) can be obliqued in Quark and they print fine, while others strip out the obliquing and  print as roman?  <br> <br>Is there a quick fix that can be done to a font to get it to accept Quark's fake italicizing?</p>
