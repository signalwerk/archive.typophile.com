    html: "<p>That’s what I meant by ‘custom’: They took letters from Neo Sans and Neo Tech, left some (almost) unchanged (such as ‘h’ or the ‘fi’ ligature) and modified others (such as ‘a’ or ‘u’). Of these latter, some parts (the ‘a’ bowl, for example) still overlap perfectly with the glyphs from Neo Sans.</p>"
