    html: <p>The logo is a special blend of Neo Sans and Soho Gothic (both by Sebastian Lester). This is because we wanted a clean wordmark. I hope we did his work justice in creating the mix. As suggested before by riccard0 we used Soho Gothic as Saunalahti's typeface elsawhere.</p>
