      <p><a href="http://www.lineto.com/The+Fonts/Latest+Releases/BEANS/" rel="nofollow">Lineto releases Beans</a> or – so to speak – their interpretation of it. </p>
      <p>Designer: Charles Grant / Date: 2008 (1973) / Category: Graphic Fonts</p>
      <p>Originally designed by German designer Dieter Zembsch in 1973, «LL BEANS» is a Letragraphica classic that never lost its curious charm and which, in our opinion, has been begging for adaptation into the digital realm.<br>
      Charles Grant, an emerging graphic designer based in Manchester, collaborated with Dieter Zembsch and Lineto on a digital recreation of the original rub-down classic. Taking advantage of OpenType technology, Grant added many special characters and alternative glyphs, thus boosting the potential of the «Beans» font by virtually re-inventing its character set, and offering both the original set and many new options to the discerning user.<br>
      The original Zembsch set is accessed with «caps lock» activated, whilst new characters &amp; alternates are mapped to the lower case and to OpenType Stylistic Sets respectively</p>
      <p>EDIT: Oops, that is what Mr. Grant probably wanted to say in the post above, which I didn’t realize, while posting. Sorry for the double information.</p>
