      <p>Dan Solo showed it in the Solotype Catalog as 'Porky' (p. 49), but it is shown in his 'Art Deco Fonts' Dover book as 'Beans'. (The Solotype catalog sample lettering is the phrase 'PORK AND BEANS')</p>
