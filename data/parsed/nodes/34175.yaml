      <p>It was designed by Dieter Zembsch and was one of the winners of Letraset's 1973 "International Typeface Competition." </p>
      <p>Other notable winners that year were <a href="http://www.myfonts.com/fonts/linotype/shatter/" rel="nofollow">Shatter</a> (designed by Vic Carless), <a href="http://typophile.com/node/10276" rel="nofollow">Magnificat</a> (2nd prize winner, designed by Friedrich Peter), and <a href="http://www.myfonts.com/fonts/linotype/le-griffe-2/" rel="nofollow">Le Griffe</a> (designed by Andre Michel Lubac.</p>
