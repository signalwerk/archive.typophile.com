    html: <p>Sorry for the confusion. <br> <br>The image presented is somewhat correct. In this case I was refering to trade fiction. When you spec a composition for a type compositor to set, you can request the use of bouncing folios. A folio bounces when a page is being adjusted for bad paragraph breaks. Usually bad breaks are adjusted by making a page one line longer or one line shorter. With bouncing folios on a short page the folio moves up with the bottom line of text, and vise versa on a long page. When flipping through the book you will notice the page numbers fluttering up and down with the last line of text on each page. I think this seems strange but my boss feels that this is the correct way to design a text page. She thinks that page numbers should stay the same distance away from the last line of type on all pages. I think the page numbers are there for a functional-navigational purpose so they should stay fixed in place. I think it's distracting to see a page number fluttering up and down when you are trying to  find a specific page. When you are only dealing with a minimum amount of elements it is to me a necessity to harmonize those elements.Bouncing folios are strange, simple as that.</p>
