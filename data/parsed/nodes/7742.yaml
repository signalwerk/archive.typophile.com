    html: <p>From the GLOSSARY OF TYPESETTING TERMS (Chicago, the University of Chicago Press) <br> <br>�*Bouncing folio.* A page number that changes its position at the bottom of the page when the page is *short* or *long*, since its placement is in relation to the last line of text (except on pages that fall well short, as a chapter ending may). Some designers hold that folios should bounce on long pages only, retaining their standard alignment on short pages . . .�  <br> <br>Bouncing folios are always foot folios -- that is, folios that go at the bottom of the page.  <br> <br>Suppose you specify a page having 39 lines of type with a 13-point linefeed (leading). Suppose you specify the dropped folio or foot folio to be 26 points base-to-base below the 39th text line. Now suppose you have to run a page long to avoid a widow, the beginning or ending of an extract, a subhead etc. -- any of the slings &amp; arrows that outrage page makeup. <br> <br>If you don't bounce the folio, you can only run short, or the folio will appear just one line below the last text line (no extra space). <br> <br>If you don't have a reasonable foot margin, bouncing folios can stick out like a sore thumb. There really is no perfect solution. For a text with a folio-running head block at the top of a text page, where the folio is dropped only on a chapter opening page, bouncing the folios seems to do little damage. <br> <br>BTW, foot folios tend to work better with same-page footnotes, since there is the space above the note to play with, &amp; often the folio won't have to be "bounced." <br> <br>FWIW, <br> <br>Charles Ellertson</p>
