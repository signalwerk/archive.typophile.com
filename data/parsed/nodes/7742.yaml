    html: <p>If the amount of bounce is never more than a line, then I think there is a better case to be made for bouncing folios. The 'flutter' of the numbers up and down while you flip through the book may look a little odd, but it does not significantly impede their function. You can, as Hrant suggests, avoid the problem by putting the folios at the top of the page.</p>
