    html: "<p>Here's an idea: <br>When you have to adjust the bottom of the page, omit the page number entirely. <br>Except maybe when both pages in the spread are like that, then hopefully they're going in the same direction (both one up or one down) and you can put both page numbers in. For spreads that have one short page and one long page, decide if you want it to be slightly ugly or microscopically* dysfunctional. <br> <br>* Because chances are quite low that the reader will choose to open up to that spread to regain his bearings, and is then forced to go one spread back or forth. In comparison, all readers <i>will</i> traverse that spread at one time, so maybe aesthetics becomes more important. <br> <br>hhp</p>"
