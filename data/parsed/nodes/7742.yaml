    html: <p>You mean folios that move up and down in relationship to the length of the text above, yes? So the folio is in a fixed relationship to the text block, rather than to the page. <br> <br>This can <i>look</i> nice, and avoids having the odd folio off by itself, but it is functionally, well, moronic. I would classify this practice as the tyranny of aesthetics over functionality, because although it looks nice it largely defeats the practical purpose of having folios in the first place. Let's say you have looked up a chapter or section heading in the table of contents, or have looked up a entry in the index, you then need to be able to find the relevant page. So you flip through the book to find the appropriate folio. Obviously this is very much easier if the folios are always in a fixed position relative to the page.</p>
