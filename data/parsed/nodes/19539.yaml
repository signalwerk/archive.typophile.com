      <p>The New York is custom lettering that has been tweaked and refined over the years by, among others, Milton Glaser and Ed Benguiat.</p>
      <p>Here's a discussion between Roger Black and former NY mag AD Luke Hayman that mentions the evolution of the logo:</p>
      <p><a href="http://www.rogerblack.com/blog/conversation_with_hayman" title="http://www.rogerblack.com/blog/conversation_with_hayman">http://www.rogerblack.com/blog/conversation_with_hayman</a></p>
      <p>The condensed sans serif is the now-retired Elderkin from Process Type Foundry:</p>
      <p><a href="http://www.processtypefoundry.com/help/updates.html" title="http://www.processtypefoundry.com/help/updates.html">http://www.processtypefoundry.com/help/updates.html</a></p>
      <p>You can see a picture here, although the download link is dead:</p>
      <p><a href="http://www.fontfinder.ws/12204/Elderkin-Medium.html" title="http://www.fontfinder.ws/12204/Elderkin-Medium.html">http://www.fontfinder.ws/12204/Elderkin-Medium.html</a></p>
