      <p>Theunis' response is very insightful - I believe I understand what's going on from your explanation!</p>
      <blockquote><p>That indeed sounds as if you inadvertently applied an outline as well. But one must ask: at what font size and what viewing size? The difference becomes progressively larger with small font sizes (or at lesser zoom levels).</p></blockquote>
      <p>Thankfully, I didn't miss this! There's no outline stroke set, it's simply type converted to paths. Like you said, it's much more obvious at smaller sizes - at an 8pt - 12pt height, for example. When outputted at a larger size, it's quite unnoticeable. </p>
      <p>Perhaps my best option would be to create size-optimized versions, where I negatively offset the path a small amount for smaller output.</p>
