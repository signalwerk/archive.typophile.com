    html: <p>Adobe Illustrator CS6 thickens type when I do Type &gt; Create Outlines as soon as I do it. Even when keeping type as type (not converting to outlines) in Illustrator, saving for web as a gif or png results in a thickening in all 4 up-to-date browsers I have. I assume it's because Illustrator converts type to outlines when saving for web. It's not very drastic, but it caused me to have to do a redesign when I had a Medium font next to a Bold font of the same font type. The Medium font appeared very close to being the same thickness as the Bold font. I had to change the Medium font to a Regular font before saving for web to get it to match my print version.</p>
