    <p>I haven't had much luck locating any information on this online, as most information related to "outline" ends up pointing me towards tutorials and the like.</p>
    <p>I've noticed for some time now that outlining a typeface through convert to outlines in Illustrator (wordmarks, for example) results in a slightly thicker, heavier letterform. In most cases, it's not a big deal, but I'm finding that my current project is actually having difficulty, as the gain is almost a full weight heavier.</p>
    <p>Through many print and screen tests, it's very clear that the outlined letterforms are noticeably heavier than the unconverted ones. </p>
    <p>What exactly's causing this gain? Is there any way to prevent it or correct it? I've long been told that vector logos and icons must be outlined (which I've never questioned - it seems perfectly logical), so I'm not sure if there's actually any alternative.</p>
