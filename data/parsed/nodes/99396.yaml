      <p>&gt; But, the big issue is that it happens when converting a file for the web (gif and png) -- even when you don't convert the text to outlines.</p>
      <p>What app are you using in which this happens during conversion? What app are you viewing the text in, in which it seems thinner?</p>
      <p>For most pro graphics apps such as Photoshop, you will see zero difference, at the same zoom level, between the initial representation on screen and the generated GIF or PNG graphic file. It will be pixel-for-pixel identical.</p>
