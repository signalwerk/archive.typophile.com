    html: <p>I am having the same issue. It may not be a big deal for stuff printed professionally because you can send the fonts to the print shop. This "thickening" appears when printed on my home (600dpi) laser printer (contrary to what some say) when I convert text to outlines. But again, it's no big deal because I don't need to convert text to outlines for my home printer. But, the big issue is that it happens when converting a file for the web (gif and png) -- even when you don't convert the text to outlines.</p>
