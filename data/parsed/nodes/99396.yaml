      <blockquote><p>Through many print and screen tests, it's very clear that the outlined letterforms are noticeably heavier than the unconverted ones.</p></blockquote>
      <p>Drawing text is <em>extremely</em> optimized, both on screen and on laserprinters. The optimizations may be built into the font -- exact pixel alignment for certain sizes, and on-screen hints for antialiasing -- or may come from the font rendering system (typically, your OS and printer firmware). But as soon as you convert a font to outlines, all these optimizations are no longer used, and you get the default rendering of what comes down to a set of straight and curved lines.</p>
      <p>If your final output is going to be on professional, high end, high resolution hardware, there is quite little to worry about. At a typical resolution of 3,000 dpi or higher, the differences between pixel-optimized font drawing and aformentioned straight/curved lines is virtually undetectable. After all, all deviations are going to be on single pixel level (1/3000th of an inch).</p>
      <p>If you are going to output on lower resolutions, well, why do you think you have to outline your fonts? Maybe all it needs is to review your workflow; perhaps you can deliver your output without converting to outlines.<br>
      Another solution could be to <em>always</em> outline <em>all</em> of your text. At least then there is not going to be a difference between different text.</p>
      <blockquote><p>... the gain is almost a full weight heavier.</p></blockquote>
      <p>That indeed sounds as if you inadvertently applied an outline as well. But one must ask: at what font size and what viewing size? The difference becomes progressively larger with small font sizes (or at lesser zoom levels).</p>
