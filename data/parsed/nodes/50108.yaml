    html: |-
      <p>You are absolutely going into a right direction. Just don't care whether there are similar designs exists or not, don't even look for them. If it's 100% your work, it has to be unique. </p>
      <p>Looking at your work, am assuming that you are working on Illustrator at the moment. You should start learning FontLab from now onwards cause that will give you more command over the decisions you are making. And you will save a lot of your time too.</p>
      <p>All the best.</p>
