    <p>Hello, I was trying my skills in type design, and started working on a font, but when i tried to submit it here to receive some advise, I saw about 35 very very similar fonts designed by others. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/font_5351.png"></div><p></p>
    <p>Is this the case ? I mean is every beginner designing the same font :) ?</p>
comments:
  - id: 304468
    user: 14133
    date: 2008-10-02T18:26:00
    date_raw: 2 Oct 2008 — 6:26pm
    votes: null
    html: <p>Ruler &amp; compass font ideas ran out in the mid 1970s. No matter what you do with a ball &amp; stick, it can't help but resemble everyone else's ball &amp; stick. That doesn't mean you can't make one too. Just make it better or different or more useful or hit a smaller niche.</p>
  - id: 304497
    user: 36449
    date: 2008-10-02T21:31:00
    date_raw: 2 Oct 2008 — 9:31pm
    votes: null
    html: |-
      <p>i think its looking good so dont give up...</p>
      <p>There are so many sans serif typefaces but even if its something that bares similarities to others the main thing i would look for is versatility which will make it more usable - the relationship between the weights, and also how does it work together at sizes like caption, body, leader, headline etc?</p>
  - id: 304498
