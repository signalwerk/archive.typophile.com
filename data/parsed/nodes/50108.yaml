    date: 2008-10-02T21:33:00
    date_raw: 2 Oct 2008 — 9:33pm
    votes: null
    html: <p>Thanks for reply, I'm also trying another one, a serif font, can you guys tell me if it is worth continuing? or have you seen a similar font? </p><div class="imageWrap"><img src="http://typophile.com/files/bb_4681.png"></div><p></p>
  - id: 304501
    user: 14722
    date: 2008-10-02T22:31:00
    date_raw: 2 Oct 2008 — 10:31pm
    votes: null
    html: |-
      <p>If these are your first fonts, don’t worry about being original, worry about getting them done. By the time you have these fonts working well and kerned you’ll have realized that you need to get a lot more experience before releasing anything. I’m about to release a font for the first time, and it’s the third I’ve done. My first and second fonts weren’t remotely original and will probably never be released. But they were certainly worthwhile learning experiences. </p>
      <p>I do like where your serif design is going. You’ve got some great ideas there—run with the design while you use the geometric design to learn about spacing and kerning.</p>
