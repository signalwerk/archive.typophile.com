    html: '<p>Display faces with text counterparts: <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.484.0.8&amp;attributes.sampleSize=96&amp;sampleText=Beauty+&amp;sampleSize=110" target="_blank">Minion Display</a> <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.111363.0.1&amp;attributes.sampleSize=100&amp;sampleText=Runway+&amp;sampleSize=100" target="_blank">FB Garamond Display</a> <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.111358.0.1&amp;attributes.sampleSize=96&amp;sampleText=Q%26A+&amp;sampleSize=130" target="_blank">Miller Display</a> <br> <br>Less Expected: <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=TO.112532.0.0&amp;attributes.sampleSize=144&amp;sampleText=couture+&amp;sampleSize=96" target="_blank">Tschicholina</a> <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FF.11397.1.4&amp;attributes.sampleSize=48&amp;sampleText=Milan&amp;sampleSize=160" target="_blank">FF Meta Hairline</a> <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=FB.10064.0.1&amp;attributes.sampleSize=144&amp;sampleText=Paris&amp;sampleSize=130" target="_blank">Agency Thin</a> <br> <br>To use sparingly for ooze and ahhs:  <br><a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=E.6803.0.0&amp;attributes.sampleSize=144&amp;sampleText=Paris&amp;sampleSize=145" target="_blank">Missionary</a></p>'
