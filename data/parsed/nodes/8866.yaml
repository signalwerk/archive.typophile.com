    html: <p>&gt; Fair enough. <br> <br>What about Font Bureau's Eldorado or Prensa? <a href="http://fontbureau.com/fonts/Eldorado" target="_blank">http://fontbureau.com/fonts/Eldorado</a> <a href="http://fontbureau.com/fonts/Prensa" target="_blank">http://fontbureau.com/fonts/Prensa</a> <br> <br>or Storm's Jannon or Serapion or Tyfa <a href="http://www.stormtype.com/jannon.html" target="_blank">http://www.stormtype.com/jannon.html</a> <a href="http://www.stormtype.com/serap.html" target="_blank">http://www.stormtype.com/serap.html</a> <a href="http://www.stormtype.com/tyfa.html" target="_blank">http://www.stormtype.com/tyfa.html</a> <br> <br>FontShop has Absara (gorgeous angularity) <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11455.0.0" target="_blank">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11455.0.0</a> <br> <br>Have you already settled on a sans? Sebastian <a href="http://www.stormtype.com/sebastian.html" target="_blank">http://www.stormtype.com/sebastian.html</a> Dyna Grotesk <a href="http://www.stormtype.com/dynag.html" target="_blank">http://www.stormtype.com/dynag.html</a> <br> <br>If you do use Agenda, ask for an alternate lowercase a with your license, you will find that curly a gets distracting sometimes.</p>
    html_clean: <p>&gt; Fair enough. <br> <br>What about Font Bureau's Eldorado or Prensa? <a href="http://fontbureau.com/fonts/Eldorado" target="_blank">http://fontbureau.com/fonts/Eldorado</a> <a href="http://fontbureau.com/fonts/Prensa" target="_blank">http://fontbureau.com/fonts/Prensa</a> <br> <br>or Storm's Jannon or Serapion or Tyfa <a href="http://www.stormtype.com/jannon.html" target="_blank">http://www.stormtype.com/jannon.html</a> <a href="http://www.stormtype.com/serap.html" target="_blank">http://www.stormtype.com/serap.html</a> <a href="http://www.stormtype.com/tyfa.html" target="_blank">http://www.stormtype.com/tyfa.html</a> <br> <br>FontShop has Absara (gorgeous angularity) <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11455.0.0" target="_blank">http://www.fontshop.com/index.cfm?fuseaction=catalog.fontpackage&amp;displayfontid=FF.11455.0.0</a> <br> <br>Have you already settled on a sans? Sebastian <a href="http://www.stormtype.com/sebastian.html" target="_blank">http://www.stormtype.com/sebastian.html</a> Dyna Grotesk <a href="http://www.stormtype.com/dynag.html" target="_blank">http://www.stormtype.com/dynag.html</a> <br> <br>If you do use Agenda, ask for an alternate lowercase a with your license, you will find that curly a gets distracting sometimes.</p>
