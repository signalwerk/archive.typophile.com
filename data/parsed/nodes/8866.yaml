    html: "<p>Cally I would suggest H&amp;FJ's Requiem if Town &amp; Country weren't already using it. Fabian Baron did some amazing work with Didot for Italian Vogue and Harper's Bazaar. What about Porchez Typofonderie's Ambroise? <br> <br>Requiem: <a href=\"http://www.typography.com/catalog/requiem/index.html\" target=\"_blank\">http://www.typography.com/catalog/requiem/index.html</a> <br>Didot: <a href=\"http://www.typography.com/catalog/didot/index.html\" target=\"_blank\">http://www.typography.com/catalog/didot/index.html</a> <br>Ambroise: <a href=\"http://www.typofonderie.com/alphabets/view/Ambroise\" target=\"_blank\">http://www.typofonderie.com/alphabets/view/Ambroise</a></p>"
