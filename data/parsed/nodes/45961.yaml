  html: |-
    <p>After a long time sketching, testing, searching and starting from scratch repeatedly I have settled on what I feel to be a suitable logo for myself when doing freelance work (as a client I am a pain in the ass). The only problem is that I can’t seem to turn my lower-case “p” into a question mark without losing the awesome sci-fi retro curves of Magistral Extra Bold OT. The standard ? that is part of the character set is no help as it in turn looks nothing like a “p”.</p>
    <p></p><div class="imageWrap"><img src="/web/20081013111129im_/http://www.typophile.com/files/knownspace_6199.png"></div><p></p>
    <p>Terrible attempts at conversion (and the original ?)<br>
    </p><div class="imageWrap"><img src="/web/20081013111129im_/http://www.typophile.com/files/knownspace2_6333.png"></div><p></p>
    <p>Any ideas? About anything I mean, I’m at the point now where I feel I might have “settled” for Magistral when something better is out there waiting!</p>
