  html: <p>I'm just completing a brand using FF Unit, and I've advised my client to purchase the font for their own use on letters and other inhouse documentation. <br> <br>the problem is I'm not 100% sure whether to purchase the fonts as PostScript or TrueType. <br> <br>So just a couple of questions; <br> <br></p>
