  - id: 40217
    user: 869
    date: 2004-07-16T03:24:00
    date_raw: 16 Jul 2004 — 3:24am
    votes: null
    html: <p>Thomas, I think Si has a point and that it would indeed be relevant and helpful (though not, strictly speaking, <i>necessary</i>) for an organisation that is not design-centric to have a single font format that they use. <br> <br>The IT departments of many companies run at any one time a wide range of different operating systems, wether PC, Mac or Linux. With that, as you know, there are inherent problems to do with compatibility and licensing.  <br> <br>For example, let us suppose that a department has 23 PCs and 2 Macs. Assuming a font purchase is valid for 5 seats, a IT department that decides on Postscript fonts would need to buy 6 sets of licenses to cover 25 seats. But if the Macs were running MacOS X, which, of course, has the ability to use PC format TT fonts, they'd only need 5 sets of licenses, as there would be no "lost" licenses being paid for. <br> <br>And thats just one example, before we start talking about compatibility issues between different versions of the same operating systems, AKA earlier versions of Windows and PS fonts. <br> <br>Is that not one of the driving forces behind OT as a technology? Its not just fancypants typesetting for us type nerds, its compatibility and easier deployment for the rest of the world too. <br> <br>At this moment in time, in non-design environments, TT is a good choice for font deployment. But dont worry, we can but hope that OT will take over that mantle in time, and then every day will be the first day of spring, and every bird will have a new song to sing, etc etc <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br></p>
