  - id: 40218
    user: 909
    date: 2004-07-16T09:25:00
    date_raw: 16 Jul 2004 — 9:25am
    votes: null
    html: "<p>David, <br> <br>As long as they're running the correct operating systems, I still think it's not a big deal at all. However, it's true that Type 1 fonts are more complicated from a user perspective, thanks to the multiple files-per-font involved. <br> <br>For a long-term investment today, Type 1 is probably not the best idea, as it is starting to get a little elderly. Either TrueType or OpenType (of either flavor) is a better bet. <br> <br>On the side, the question was not asked about a mixed-platform environment, but just about PCs. Here, your example is flawed in a couple of ways. First, it assumes the licenses are platform-specific. I'm sure many are, but Adobe's for one are not, so there would never be lost licenses regardless. Second, the Mac users would still be mixing font formats: Windows TrueType fonts (or OpenType fonts) are not the same format as Mac TrueType fonts. <br> <br>If you want to use the same font files on both platforms, and you're using OS X on the Mac, and *only* with native OS X apps, then Windows TrueType or TrueType flavored OpenType is a fine option. <br> <br>If you want to use the same font files on both platforms, and you need them to work in Classic or Mac OS 8/9, then you need PostScript flavored OpenType fonts. If you're running an older Windows OS (NT 4, ME or earlier), then this will also mean you need ATM on Windows as well as on the Mac. <br> <br>Sigh. It does all get rather convoluted. <br> <br>Cheers, <br> <br>T</p>"
    html_clean: "<p>David, <br> <br>As long as they're running the correct operating systems, I still think it's not a big deal at all. However, it's true that Type 1 fonts are more complicated from a user perspective, thanks to the multiple files-per-font involved. <br> <br>For a long-term investment today, Type 1 is probably not the best idea, as it is starting to get a little elderly. Either TrueType or OpenType (of either flavor) is a better bet. <br> <br>On the side, the question was not asked about a mixed-platform environment, but just about PCs. Here, your example is flawed in a couple of ways. First, it assumes the licenses are platform-specific. I'm sure many are, but Adobe's for one are not, so there would never be lost licenses regardless. Second, the Mac users would still be mixing font formats: Windows TrueType fonts (or OpenType fonts) are not the same format as Mac TrueType fonts. <br> <br>If you want to use the same font files on both platforms, and you're using OS X on the Mac, and *only* with native OS X apps, then Windows TrueType or TrueType flavored OpenType is a fine option. <br> <br>If you want to use the same font files on both platforms, and you need them to work in Classic or Mac OS 8/9, then you need PostScript flavored OpenType fonts. If you're running an older Windows OS (NT 4, ME or earlier), then this will also mean you need ATM on Windows as well as on the Mac. <br> <br>Sigh. It does all get rather convoluted. <br> <br>Cheers, <br> <br>T</p>"
