    html: <p>Hi Tom, <br> <br>&gt; Si, why would it be necessary, relevant or even helpful to "be consistent" with the format their other fonts are in?  <br> <br>For this type of user consistency would avoid questions like... <br> <br>How do I install these Type 1 fonts? <br>Why do they render differently in my apps? <br>Why won't they embed in my PowerPoint deck? <br>Why don't they work in Visio? <br>How can I use them on my Win 9x machine at home? <br> <br>These questions are pretty simple to answer, but by sticking with TTF they can be avoided - especially in a mid-size company where 'tech support' and iota him/herself will have to deal with the inquiries. <br> <br>Cheers, Si  <br> <br> <br> <br></p>
