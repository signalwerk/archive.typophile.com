    html: <p>If they have up to date hardware and OS's (Mac OS or Windows) then either format should be fine for letters and in-house docs - although I'd suggest TrueType to remain consitent with the other fonts the users will be using. If they're running old versions of Windows then they'll be better off with TrueType -  avoiding the need for Adobe Type Manager. <br> <br>Cheers, Si</p>
