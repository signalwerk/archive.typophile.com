    <p></p><div class="imageWrap"><img src="http://typophile.com/files/DeLuxeGothic_Typophile_3871.png"></div><br>
    Alphabet Soup has changed the name of its “Bank Gothic AS” to “DeLuxe Gothic“ due to threatened legal action. Having great respect for the original designer of Bank Gothic, Mr. Morris Fuller Benton, they chose the name DeLuxe Gothic because it was the name that The Intertype Corporation used for their version of this classic font during the early years of the 20th Century.<p></p>
    <p>Unlike the traditional Bank Gothic fonts, DeLuxe Gothic contains a complete set of lowercase letters. Coincidental to the release of this renamed font, there's a Special Promotion running on <a href="http://new.myfonts.com/fonts/alphabetsoup/deluxe-gothic/buy.html" rel="nofollow">MyFonts:</a> 50% off this font for one time only—and for a limited time.</p>
