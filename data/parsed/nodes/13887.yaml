      <p>Certainly Jim Rimmer is the first one I would approach. Adobe and Lanston refit Stone for hotmetal in the early nineties. Fitting the face took substantial planning.</p>
      <p>Digital to film works for burning polymer plates sized for patterns. Polymer plates are also a method of going from digital text to letterpress.</p>
      <p>We have also gone from digital to wood using a signage compaines Cad/Cam router. The first time we use that method was for Bill Ried’s indian prints. This method, cut on lead instead of wood could be used for making lead patterns for a pantograph.</p>
      <p>I just noticed a comment by grod.</p>
      <p>We worked with the Canada Research Council in the late eighties in this regard. Yes you could go from film to matrices or punches using Cad/Cam technology. In otherwords, a digital pantograph.</p>
      <p>Also you could have a digital engine to run a polymer plate maker.</p>
      <p>We, at Lanston fit our faces identical to hotmetal. Our faces were exact duplicates. One of our mechanical projects were to build fonts along with a computer controlled Monotype Caster. This would enable a digital laser output to either be used as final copy, or to have the type output directly from the same file on the caster.</p>
      <p>I am sorry if this note is not detailed enough, I am just passing through.</p>
      <p>Giampa</p>
