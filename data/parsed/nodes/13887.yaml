    html: |-
      <p>Si</p>
      <p>I have recently been cutting in metal some designs of mine that I had previously done in digital format. One was cut from the digital version called Lancelot Light Titling, into metal as Duensing Titling in five sizes. One I just sompletd the cutting of is Alexander Quill cut in 14 point and named simply Quill in its metal clothing.</p>
      <p>I have cast about a 100 pounds of type from the matrices and will very likely have to cast another 100 or so pounds for the little book I am doing on my Press and Foundry.</p>
      <p>Last year I cut a 14 point metal version of Carl Dair’s cartier. I was an absolute slave to Dair’s original drawings in the various steps in cutting metal, so I think it’s a good match.</p>
      <p>There are few individuals out there cutting metal type in both direct matrix, and punch form. I can’t speak for their accuracy in translating a design from digital to lead, if indeed any of them have done that, but I feel that I have gained sufficient skill and knowledge from my own experimentation to do so as far as accuracy of form and weight is concerned. You should keep in mind that even if a tyope is cut spot-on to the original digital font it will look different when printed letterpress as opposed to being litho’d.</p>
      <p>Unfortunately it would be costly because of the great many hours of labour involved in the process, but I found your question an interesting one.</p>
      <p>Incidentally, there is a young man her in the Vancouver BC area attending ECIAD who is hand-cutting a font of wood type. He came out to my workshop to show it to me a couple of months ago. His skill is outstanding. I have heard that he is continuing to add to the font.</p>
      <p>Jim</p>
