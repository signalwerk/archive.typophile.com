      <p>I’ve made a lot of magnesium cuts from digitally-set type and art. I once had planned on making a full font of digitally-altered Mrs. Eaves; I had straightened the italic and was using it for a project, but eventually I only had a portion of the font made and never used it as the metal was damaged.</p>
      <p>If you don’t mind wood backing - I know this isn’t exactly what you had in mind - Valley Graphic Arts Engravers in Sacramento are inexpensive and do a great job.</p>
      <p>Of course, this isn’t casting, but rather engraving - a very different situation. I bet you could do this relatively easily with photopolymer with magnetic backing. Talk to Gerald Lange, I bet he’s experimented with this.</p>
    html_clean: |-
