    <p>I thought amateurs and fans alike might be interested in a contest going on by <a href="http://www.designspongeonline.com" rel="nofollow">Design*Sponge</a> and <a href="http://www.veer.com" rel="nofollow">Veer</a>. Readers have the opportunity to design their own line of typefaces for a $500 or $150 credit to Veer. Submissions won't actually be turned into working fonts, but it's a fun contest nonetheless.</p>
    <p>More details <a href="http://www.designspongeonline.com/2010/10/design-your-own-alphabet-contest-500-prize.html" rel="nofollow">here</a>.</p>
