    <p>The University of Iowa recently redesigned Kinnick Stadium's field. The new endzones feature a bold italic slab serif, all caps.</p>
    <p>The 'K' is pretty unique, hopefully it will help the ID.<br>
    _<br>
    My apologies, but these are the best images I could find. Apparently most (myself included) are more interested in the on the field action, not what's ON the field.</p>
    <p>Thanks for your time!</p>
