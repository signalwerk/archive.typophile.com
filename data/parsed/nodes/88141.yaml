    <p>We are a packaging design firm.  One of our clients is looking to extend their brand across Europe, including russian, czech and hungarian.  We are looking for a typography consultant to help recommend fonts for this client.<br>
    This would obviously be a paid gig.  If you can help, or know someone who can help, please email <a href="mailto:help@ddw.com">help@ddw.com</a>, and include your resume/credentials showing you are qualified.</p>
    <p>Thanks-<br>
    -DDW IT Dept</p>
