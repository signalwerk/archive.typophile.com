      <p>Two reasons:<br>
      - to ensure consistency of presentation when a text string with such characters in another font is switched to this monospaced font<br>
      - to allow editors, proofreaders, and other professionals who may need / prefer to work in monospaced fonts to do so</p>
      <p>Gerry</p>
