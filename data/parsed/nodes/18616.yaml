    html: |-
      <p>I have never seen the Japanese yen symbol written with just one bar. But I happen to know that the Latinized symbol for the Chinese renminbi, which is theoretically identical to the Japanese yen symbol (it shares the same Unicode code point), is more frequently written as a Y with a single crossbar. So you want to watch the context.</p>
      <p>A similar letter apparently appears in <a href="http://en.wikipedia.org/wiki/%D2%B0" rel="nofollow">Kazakh Cyrillic</a>.</p>
      <p>As for the Euro symbol, I doubt it would be recognizable with just one bar--it would look too much like the Ukrainian Ye to me in any event.</p>
