      <p>The new euro symbol was officially presented as “an epsilon harking back to the cradle of European civilisation and the first letter of Europe, crossed by two parallel lines to indicate the stability of the euro.” But according to Mr Eisenmenger, the symbol was drawn “without much consideration” for some temporary purpose, and was not at all intended as a currency symbol.</p>
      <p>Quote from Hrant's link, the eye is dotted and the euro crossed (twice).<br>
      Tim</p>
