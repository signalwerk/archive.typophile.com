      <p>I used to double bar the $ in handwriting all the time! Probably influenced by the Korean and Japanese practice of using a Chinese character that looks like a flipped double-bar $ as the dollar sign...</p>
      <p>And to clarify, I certainly have seen single-bar Ys, but I don't remember ever seeing one that was meant to be the symbol for the Japanese Yen as opposed to the Chinese Renminbi.</p>
