  date: 2006-03-16T16:07:00
  votes: null
  html: <p>Is it OK for a <a href="/wiki/yen" class="freelinking" rel="nofollow">yen</a> symbol just to have one bar? What about a <a href="/wiki/Euro" class="freelinking" rel="nofollow">Euro</a>?</p>
comments:
