  html: <p>Is it OK for a <a href="/node/19364" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">yen</a> symbol just to have one bar? What about a <a href="/node/20695" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Euro</a>?</p>
