    html: <p>I've seen plenty of fonts with a single-bar yen. I don't know the formal rule however. I'm doing a font right now with one. The euro is certainly a little odd with only one however, and I'm sure I've seen certain rules issued in the early days of its existence with regards to the angular chops off the end -- though this of course is open to experiment and evolution like any other character. A double bar yen would therefore seem to fit visually with this and the rest of the currency (double bar $ anyone?)</p>
