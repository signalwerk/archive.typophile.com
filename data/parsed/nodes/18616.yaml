      <p>The Euro was first build in 1974 to become a logo for the European Parlament. They didn't want the proposal and archived it. When the idea came up to produce a pan-European currency they remind of the proposal by Arthur Eisenmenger, took the logo and used it as the character for the Euro.</p>
      <p>Guide for a correct Euro-Sign:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/guter_euro.gif"></div><p></p>
      <p>1. affinity with the other currency signs<br>
      2. a little bit smaller and thinner than capitals<br>
      3. resemble more a lowercase c than an uppercase C<br>
      4. demands the same room as the numerics<br>
      5. crosses have sufficient distance<br>
      6. contrast, greytone, serifs… like in the main font</p>
      <p>more about it: <a href="http://www.hitext.de/euro/euro.html" title="http://www.hitext.de/euro/euro.html">http://www.hitext.de/euro/euro.html</a> (german)</p>
      <p>Greetings: Steven</p>
