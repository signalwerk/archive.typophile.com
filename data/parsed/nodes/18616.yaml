  html: <p>Is it OK for a <a href="/wiki/yen" class="freelinking" rel="nofollow">yen</a> symbol just to have one bar? What about a <a href="/wiki/Euro" class="freelinking" rel="nofollow">Euro</a>?</p>
  html_clean: <p>Is it OK for a <a href="/wiki/yen" class="freelinking link-lost" rel="nofollow">yen</a> symbol just to have one bar? What about a <a href="/wiki/Euro" class="freelinking link-lost" rel="nofollow">Euro</a>?</p>
