    html: |-
      <p>Hi Theo, here are some chunky handwriting substitutes:<br>
      Stentor by Veronika Elsner, Günther Flake based on the design of Stentor Heinz Schumann<br>
      <a href="http://www.myfonts.com/fonts/ef/stentor/" title="http://www.myfonts.com/fonts/ef/stentor/">http://www.myfonts.com/fonts/ef/stentor/</a><br>
      <a href="http://www.myfonts.com/fonts/urw/stentor/" title="http://www.myfonts.com/fonts/urw/stentor/">http://www.myfonts.com/fonts/urw/stentor/</a><br>
      Rosalia by Ingo Preuss based on Stentor<br>
      <a href="http://www.myfonts.com/fonts/preusstype/rosalia/" title="http://www.myfonts.com/fonts/preusstype/rosalia/">http://www.myfonts.com/fonts/preusstype/rosalia/</a><br>
      Fox by Ralph M. Unger based on a design by W. Rebhuhn for Genzsch &amp; Heyse<br>
      <a href="http://www.myfonts.com/fonts/urw/fox/" title="http://www.myfonts.com/fonts/urw/fox/">http://www.myfonts.com/fonts/urw/fox/</a><br>
      Blizzard based on Bison by Julius Kirn for Weber<br>
      <a href="http://www.myfonts.com/fonts/urw/blizzard/" title="http://www.myfonts.com/fonts/urw/blizzard/">http://www.myfonts.com/fonts/urw/blizzard/</a><br>
      Brody based on a design by Harold Brodersen<br>
      At Linotype, EF, URW etc.<br>
      Also Filmotype Hemlock, Horizon, Havana.<br>
      Dont neglect the comic book fonts, such as<br>
      Danger Girl<br>
      <a href="http://www.myfonts.com/fonts/comicraft/danger-girl/" title="http://www.myfonts.com/fonts/comicraft/danger-girl/">http://www.myfonts.com/fonts/comicraft/danger-girl/</a><br>
      Zoinks<br>
      <a href="http://www.myfonts.com/fonts/comicraft/zoinks/" title="http://www.myfonts.com/fonts/comicraft/zoinks/">http://www.myfonts.com/fonts/comicraft/zoinks/</a><br>
      Hookey<br>
      <a href="http://www.myfonts.com/fonts/comicraft/hooky/" title="http://www.myfonts.com/fonts/comicraft/hooky/">http://www.myfonts.com/fonts/comicraft/hooky/</a><br>
      None are as close as Signal BQ, but at least they give you some options.<br>
      Don</p>
