      <p>What, print-room Ralph muttering "Arial, schmarial..." and making a sneaky substitution? Could be. They could have bypassed the whole issue by using Akzidenz Grotesk.</p>
      <p>Though I've just made myself chuckle some more by looking at the imprint page to see who the typesetters were... and finding it's the same people I have to deal with every day setting our journals. Should've known!</p>
