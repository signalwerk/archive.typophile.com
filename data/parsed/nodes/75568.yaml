    <p>As a bit of a cryptic crossword fan, I need to own the Chambers Dictionary. In September, I upgraded from an old edition to the latest (the 11th), and just today I noticed a little typographical feature they’ve introduced in this edition.</p>
    <p>Each of the 26 large headings that introduce each letter is set in a font whose name begins with that letter; then the entire lowercase for that font is shown, and a brief note about that font. So, for example, at the start of the “X” pages, we have:</p>
    <p><strong>Xx</strong><br>
    a b c d e f g h i j k l m n o p q r s t u v w x y z<br>
    <strong>Xtasy Sans</strong> Designed by Steve Jackaman in 1997. UK.</p>
    <p>When I spotted this, I was near the back of the dictionary, so naturally I flicked backwards through it, looking at each letter heading in turn. After a moment, I started covering up the description before I could read it, to see if I could recognise the font. Some were easy: “U” was Univers, “S” was Sabon, and so on. Others I wasn’t familiar with: Quorum, Isbell.</p>
    <p>As I got back past Courier and Baskerville, I naturally thought, <em>I wonder what “A” is going to be? Surely not</em> Arial<em>?</em></p>
    <p>Turning the page, I found that it did indeed say:</p>
    <p><strong>Aa</strong><br>
    a b c d e f g h i j k l m n o p q r s t u v w x y z<br>
    <strong>Arial</strong> Designed by Robin Nicholas and Patricia Saunders in 1982. UK.</p>
    <p>But, and this is the reason I bring up the whole dreary story, this heading was <em>not</em> set in Arial. It was set in ... Helvetica! I probably wouldn’t have noticed if they’d done it the other way round and set the “Hh” of Helvetica in Arial, but the difference between the two fonts’ <em>a</em>s is so eye-jabbingly obvious that it made me laugh all the way to my laptop, to tell someone...<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/dictionary_3606.png"></div><p></p>
    <p>Added irony comes from the fact that the actual body text of the definitions themselves uses Optima <strong><em>and Arial!</em></strong></p>
