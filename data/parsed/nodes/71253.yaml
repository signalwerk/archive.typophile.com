    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lpd_tph_5_4743.jpg"></div><br>
    .<br>
    Actually, I never intended to do a sans at all.<br>
    .<br>
    The story was this: Some years ago I teached lettering at HGB Leipzig academy. For writing exercises I needed a specimen of the classical Roman Capitalis. Since I didn’t ﬁnd exactly what I was looking for in any book I compiled something myself in Illustrator: 1-inch-height skeleton glyphs on the background of a 4-by-4-square grid. It looked nice. And the <cite>Kontur-Nachzeichnen</cite>-command is one little step only – to get an outline glyph …  So ‘why not do this as a font’ became a tempting thought. But it was capitals only and I was not in any mood of doing lowercase.<br>
    Than, it might be four years ago, it happened that a gimmick set of simple demo fonts were to file in order to promote the big Eszett newbee a little bit. I recalled my Roman skeleton exercise and found it a nice match to utilize an unused capitals-only stock for this <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=248" rel="nofollow">capital-promo issue</a>. It became a font named Linea which is still available for free (but not very useful). <p></p>
    <p>However, since then someone invisible persistently whispered “mache die Schrift!” in my ears. But I still hesitated for a long while since I was uncertain about what should decently accompany the capitals on the lc positions. When I ﬁnally started the actual work the idea was to place a kind of uncial glyphs there, to try something new. But my energy to spend on it didn’t last very long …<br>
    After more than a year I reconsidered the project, now thinking about doing small capitals. It was still a quite ‘capitalish’ matter in my eyes. But then I looked aside on the <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idcat=145" rel="nofollow">Andron project</a>. As one of many aspects of that typeface I developed what I call the “tricameral alphabet model” some years ago. This is a typographic system consisting of “three houses”: uppercase, lowercase and <strong>middlecase</strong> letters. And I thought: yes, the <cite>three</cite> of it – that’s it!</p>
    <p>By the way, I don’t see any ‘Lapidaria Italic’ up to now. For me this is not really belonging to the nature of that kind of typeface. But anyway, it ought to become a proper family. The modest set of three weights realized is what may be the most useful, I think.<br>
    Until outstanding sales ;-) force me to do so I’ll never add a fattish Bold because I don’t like fat type very much. But possibly an additional Medium (between Regular and Semibold) and also a Thin (below the Light) may be an option some day.<br>
    However, another option does appeal to me much more: making <cite>ornated</cite> versions. Because the face is soo ornamentish … ;-)<br>
    Why not. A swashy variant has already been recently dicussed <a class="freelinking external" href="http://typophile.com/node/69691" rel="nofollow">in this thread</a>. Could be funny! The other idea is to make ornated initials, in a rather smart and crisp fashion, perhaps. Sketches already exist …</p>
    <p><a class="freelinking external" href="http://new.myfonts.com/fonts/andreas-stotzner/lapidaria/" rel="nofollow">–&gt; Lapidaria</a><br>
    .</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Lpd_Orn_3424.skizze_1b.JPG"></div><p></p>
