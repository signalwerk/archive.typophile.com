      <p>Jaz,</p>
      <p>For the sans, I would say <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/linotype/avenir_std_85_heavy/?sample_text=CLASS%20IDEALIZATION" rel="nofollow">Avenir 85 Heavy</a></p>
      <p>I think it's Sabon, Tschichold's son of Garamond. (Compare the u/c R)</p>
      <p><a class="freelinking external" href="http://www.fontshop.com/fonts/singles/linotype/sabon_std_bold/?sample_text=KRISSY%20BISHOP" rel="nofollow">Sabon bold</a> for KRISSY BISHOP, and <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/linotype/sabon_std_roman/" rel="nofollow">Sabon regular</a> for the text.</p>
