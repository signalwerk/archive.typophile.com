    html: |-
      <p>I really like it — there are some very creative glyphs happening too, I just *love* the ‘@’, which in it's ‘round’ form I find just plain ugly in print. The oblique version is very eye-catching, and as a whole, I really like the font. I think there's a lot of use for it. However, there are some curves that just feel a bit stressed to me.</p>
      <p>The 'ct' discretionary seems to be a bit heavy on the top curve that runs from the top of the lc 'c' to the 't'. In the attached jpg, it's also a bit pixely. Perhaps it's just an akward anti-alias by the program you used to set it in, but it seems a bit off. I expirience the same with 'st'. Perhaps the curve should be a bit more straight. Also, the '@' in the oblique version could use some edge on the leftmost curve, like you can see on the left side of the capital 'A'. It's unusually slanted when compared to the rest of the letterforms. And as a side note, once again, it could be me, but your lc 'x' feels like it is leaning a bit to the left.</p>
  - id: 177849
