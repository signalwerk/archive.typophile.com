      <p>I think it's looking crisp. Only thing coming to mind right now is, that it looks like the right side strokes on the italic 'k' is a bit thin, when compared to the other strokes. But it seems that you might have done that on purpose. :)<br>
      I agree with Sebastiaan on the 'x', although the leaning might also be caused by the serifs of the 'x' and the 'w' almost touching in your specimen. But it isn't really that bad, imo.</p>
