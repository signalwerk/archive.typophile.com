      <p>Parabéns pelo lançamento, Ricardo!</p>
      <p>It's always interesting to see Brazilian type designers releasing quality fonts. Alegria has a nice, freshy feel. And the name is as insightful as the fill compostion.</p>
      <p>There is any reason to your glyphs be shown in an unusual order at MyFonts? Not a problem, of course, but I became curious. Little suggestion: you may explain what the word Alegria means to non-Portuguese speakers.</p>
