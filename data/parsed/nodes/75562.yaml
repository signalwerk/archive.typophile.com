    <p>Hello type community,</p>
    <p>I'm here to anounce a new release from my independent foundry. That's <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/outras/alegria/" rel="nofollow">Alegria</a></strong>, a display type family designed for joyful communication. It is composed by Alegria Roman (with upper/lowercase and oldstyle figures), Alegria Caps (with uppercase, small caps and lining figures), Alegria Bright (am open face small caps version) and Alegria Fill (that can be used as a second layer with Bright or Caps faces to create multiple colors on the text).</p>
    <p><strong><a class="freelinking external" href="http://new.myfonts.com/fonts/outras/alegria/" rel="nofollow">Alegria family</a></strong>is already available to purchase at <strong><a class="freelinking external" href="http://new.myfonts.com/fonts/outras/alegria/" rel="nofollow">MyFonts</a></strong>. I hope you enjoy it! :-)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alegria-poster1a_3805.png"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/alegria-poster2_5206.png"></div><p></p>
