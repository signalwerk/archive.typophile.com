    html: |-
      <p>Regarding web usage:</p>
      <p>Sometimes if I'm forced to use an identity face for web work that has fine serifs, it can be just enough weight to help if a thin black stroke is added to the type before exporting for the web. That's usually TERRIBLE advice for print work because it destroys the delicate stroke variation built into seriffed letterforms! But to withstand the pressures of low-resolution display, it can often be just enough weight to distribute across available pixels to make a difference....and definitely check the antialiasing and color level settings of your exports. Tinker until something works...</p>
