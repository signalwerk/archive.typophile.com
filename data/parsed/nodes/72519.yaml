      <p>Hi Tom,</p>
      <p>All the ligatures should be there in each of the italics, but feel free to drop us a line (<a href="mailto:info@typography.com">info@typography.com</a>) if you're having any trouble.</p>
      <p>Also, when the serifs on the Fine break up, try the more durable optical sizes: Display first, and then, finally, Text. More, here:<br>
      <a href="http://www.typography.com/fonts/font_features.php?featureID=42&amp;productLineID=100020" title="http://www.typography.com/fonts/font_features.php?featureID=42&amp;productLineID=100020">http://www.typography.com/fonts/font_features.php?featureID=42&amp;productLi...</a></p>
