      <p>Merci Monsieur Hoefler! My sample above uses the Display weight at 48pt. I hadn't thought to try the Text weight. Definitely an improvement, as you can see in my new sample.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/requiem-web2_5646.jpg"></div><p></p>
      <p>I tried adding the thin black stroke as mentioned by DISH but I couldn't use a stroke small enough to accommodate the point size I was using. I'll have to try that trick again if the need arises in the future with another typeface. Fortunately, the use of the Text weight solves the problem nicely!</p>
