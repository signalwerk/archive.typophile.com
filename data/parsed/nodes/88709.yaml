  html: |-
    <p>Sometime ago I was haunted by the Lords of Graphite. They possessed me to create a pencil project - characters created of pencil segments...</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pencilproject_sentinel_1_6636.jpg"></div><p></p>
    <p>Two headed Sentinel.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pencilproject_underlord_4276.jpg"></div><p></p>
    <p>One of the Underlords.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pencilproject_underlord_m2_6031.jpg"></div><p></p>
    <p>Underlord with two Minions - side view.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/pencilproject_underlord_m1_6586.jpg"></div><p></p>
    <p>Underlord with two Minions - front view.</p>
    <p>...I feel a little relieved now that I've let loose these few ones ...whew. The vision that haunts me still is a landscape of dark brooding mystic air - raw rough lines drawn forcefully throughout by the Lords of Graphite.</p>
    <p>More to come...</p>
