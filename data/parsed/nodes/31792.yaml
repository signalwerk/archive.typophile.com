    <p>Outras Fontes releases Maryam, a script typeface designed by Ricardo Gomes.</p>
    <p><a href="http://www.outrasfontes.com" title="http://www.outrasfontes.com">http://www.outrasfontes.com</a></p>
    <p>There are two fonts in the family: Maryam Regular and Maryam Alternate. Each font has more than 70 ligatures, providing a lot of letterform variations. Avaliable to buy at MyFonts. Take a look.</p>
    <p><a href="http://www.outrasfontes.com" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.outrasfontes.com" rel="nofollow"><img src="http://typophile.com/files/hellotypophille_6327.gif"></a></div><p></p>
