    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fontsample_5847.png"></div><p></p>
    <p>Just about every online type identifier has failed to identify this font. </p>
    <p>I tried to suggest choosing a more refined font, and came up with some alternatives. </p>
    <p>Naturally, my workplace wants to use this font for their taglines; however, someone long ago converted all the existing text into outlines. Also, of course, none ever created a style guide or anything that names the font that survived the migration to the new servers... and almost everyone who was here at that time is now gone.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
                <div class="field-item odd">
                        Mcgannahan        </div>
            </div>
    </div>
