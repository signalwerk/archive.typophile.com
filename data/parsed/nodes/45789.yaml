      <p>Hmm, depends on HOW MUCH extra she’s willing to pay. Unless she’s going to double or triple the original bid, I don’t really think it’s worth it (unless you’re really strapped for cash). </p>
      <p>Now I’m always a fan of sucking every last penny from a client, but I think this will end up hurting you down the road. It would be better to just call it good at $250, but make it clear to her that this was more or less a freebie with a small stipend. If she gives you $50 extra, she’ll think that she paid you what you’re worth (or whatever arbitrary number she comes up with). And then she’ll expect those same rates down the road.</p>
      <p>Probably your best bet is to walk away, unless you think it would be a really great portfolio piece.</p>
