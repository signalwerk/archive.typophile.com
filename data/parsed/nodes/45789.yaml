      <p>If the client doubled or tripled the money, great, take the money. But if she thinks paying extra means $20 and a Starbucks card, then I would turn that extra amount down. Accepting a small extra amount sends a completely wrong message to the client: you can arbitrarily decide what my work is worth, and feel generous and fair in your actions. I would want to send the message that $250 was a student rate, and was a one time only deal.</p>
