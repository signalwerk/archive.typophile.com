    <p>I just wrapped up a logo design for a small business that I did for about ten times less than I should have. I offered to do the job for $250 because I thought it would be a quick wordmark for a yoga teacher, it turned out to be a three-part logo with a brandmark, wordmark, and an add-on workmark for a sub-brand. I was really busy and not sleeping much when I agreed to do the work without raising the price (end of semester stuff) and have a contract with the client for $250.</p>
    <p>Now the client is happy with the logo and wants to pay extra. The question is: do I tell her not to worry about it knowing that she’s planning to do more business with me, or do I accept the extra cash even though we have a contract?</p>
