      <p>I can’t really offer an opinion on this one, but I have a couple of practices that have served me &amp; my company well for almost 30 years.</p>
      <p>1. We have two prices: full price and free. Even friends can understand this one. It should go without saying that if it is a free job, we work just as hard as if we were getting full price.</p>
      <p>2. 95 % of the time, for our work — even creative work — we have a price agreed on in advance. Sometime we make a little extra, sometimes we don’t; it averages out in the long run. For that other 5% of the time when I come back &amp; ask for more because of some unforeseen complexities, customers almost always agree. I think this is due in part to that 95% consistency; and in part because they too see that the extra work was needed.</p>
      <p>And a final thing: very occasionally I quote too high, yet the price is agreed to. In that case, similar to when I have to go back &amp; ask for more, we bill less than the agreed amount. I don’t view this as a change in price so much as a mistake in assessing the complexities of a job, just like the situation where we ask for more.</p>
      <p>FWIW</p>
