      <p>Look at it this way: You low-balled your quote, and the client realized that, so they’re offering to make up some of the difference. They know you’re a fresh-faced designer that’s up and coming. The extra money could be considered a tip for exceptional services rendered, or an investment in future services rendered. When you’re more established and have a better idea of how and what to quote, this will happen less and less, but by then you’ll be more solid in your quoting and contracting that you’ll be earning what you’re worth.</p>
      <p>Take it and remember to give them as good or better service next time they come around. Also, don’t forget to charge them accordingly next time as well.</p>
