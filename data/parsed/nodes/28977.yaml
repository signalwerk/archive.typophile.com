    <p>Hi All</p>
    <p>Everyone helped me out so quickly when I needed a typeface identified before so thought I'd try again!</p>
    <p>I need to know what typeface is used on <a href="http://www.artifice-design.co.uk/changeyourlife.jpg" rel="nofollow">this book</a>.</p>
    <p>My client is a literaray-agent and they want me to mock-up a special one-off version of this book cover as a leaving present for someone! So, I need to retitle it and obviously want to use the original font if possible.</p>
    <p>Any help is much appreciated as always,</p>
    <p>Artifice</p>
