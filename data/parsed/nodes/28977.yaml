      <p><em>“INCLUDES” and “MIND-PROGRAMMING”</em></p>
      <p>... are actually Adobe Sans, which means the intended font wasn't embedded properly. The Helvetica Bold Condensed suggests that the other lines were supposed to be the same face in a lighter weight.</p>
      <p>My collection of Adobe Sans grows every day.</p>
