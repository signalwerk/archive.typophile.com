      <p>You're right, Erik. It's strange that the cover designer would embed all the fonts except that one.</p>
      <p>I suppose the original poster should set the text in a lighter weight of Helvetica condensed but not embed it to replicate the cover exactly.</p>
      <p> - Lex</p>
