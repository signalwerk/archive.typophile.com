    html: |-
      <p>I work in book publishing and it's a matter of house style. Some publishers italicize punctuation directly following itals, some don't. There's no across-the-board consensus. It's very frustrating actually to try to keep track.</p>
      <p>In general, I'd follow the style of the manuscript and query the editor if you're not sure.</p>
      <p>Personally, I'm with Brendan, I prefer to italicize it. I don't like the look of italic text bumping into roman without a space. It's even worse with parens or quote marks.</p>
    html_clean: |-
