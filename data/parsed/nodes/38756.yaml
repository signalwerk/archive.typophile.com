  html: |-
    <p>here it is.<br>
    a paragraph set in roman. within that paragraph is a word set in italics followed by a comma. Does the comma become italic OR does the comma remain roman.</p>
    <p>fellow typographers, i am in a debate with my coworkers. I feel the comma goes italic. </p>
    <p>thoughts?</p>
