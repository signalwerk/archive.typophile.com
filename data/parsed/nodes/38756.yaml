    html: |-
      <p>Brendan: <em>So maybe the question should be, should typographers unite vs the edit staff and push for a style over grammatical?</em></p>
      <p>It's not a question of grammar. Grammar only determines that there should be punctuation present, not how the punctuation should be styled. As Patty says, this is a matter of 'house style'.</p>
      <p>Personally, I italicise punctuation that immediately follows italic except when the punctuation is the closure of enclosing punctuation that opened with roman punctuation. In that case, I use roman punctuation for such marks (e.g. parentheses*, quote marks). This, of course, gives rise to situations like this, in which careful kerning between the italic comma and the roman closing quotes may be necessary:</p>
      <p>“A quote opens in roman, <em>but ends in italics,</em>” she said.</p>
      <p>* Actually, I almost never use italicised parentheses or other brackets; well-spaced roman brackets look much better.</p>
    html_clean: |-
      <p>Brendan: <em>So maybe the question should be, should typographers unite vs the edit staff and push for a style over grammatical?</em></p>
