      <p>Arno -- every time you've updated this thread lately, the new AntiSpam module keeps flagging it as spam. It's happened three times so far today. </p>
      <p>Each time it gets flagged as spam, the node gets unpublished and held for moderation. That's why it disappears from your tracking list and you get a server error. </p>
      <p>I keep submitting it as a false positive, and hopefully the algorithm will someday learn to stop flagging it.</p>
      <p>Until then, you'll just have to be patient. Florian, me, and the others can't keep tabs on things 24/7.</p>
