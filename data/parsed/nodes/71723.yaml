      <p>Arno — </p>
      <p>You might refrain from constantly updating the main post in your Attachment and Bookmark Container blog node. Each time you do, it keeps winding up unpublished and back in the moderation queue. </p>
      <p>There’s nothing I can do to stop that from happening right now. And I can’t spend all Sunday watching the queue in order to keep putting your blog back online.</p>
      <p>Instead, you should consider adding any updates as comments in that blog thread instead, since those will now slip by unfiltered and not take the whole thread offline each time.</p>
