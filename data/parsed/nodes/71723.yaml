      <p>Yes, the AntiSpam is still not acting perfectly. I’m in conversation with Jared about trying to find ways to improve it’s behavior without having to ditch it altogether. </p>
      <p>Ironically, Jared just turned off the AntiSpam for general forum contents, but left it on for Blog posts — at my request, since that’s where we get the most spam. And that’s right when you decided to move your container to your blog (which is what I was going to suggest anyway), so it got caught again.</p>
      <p>It should be live now. The AntiSpam thinks that the kind of updates you keep adding are suspicious. </p>
      <p>We’re looking into a plug-in that would allow white-listing, so we can get past false positives for long-standing members. Please be patient.</p>
      <p><cite> &gt; By the way the link “View recent blog entries” should be moved next to “View | Edit | Track” in my opinion.</cite></p>
      <p>I don’t manage the site structure or features, I only act as a volunteer janitor. Perhaps someone at Punchcut will see this comment. Or you might submit the suggestion via the Bug Reports and Feature Requests forum.</p>
      <p><cite> &gt; Except from that I have edited my account a few times yesterday (the additional information). Whenever I have done this, I had to fill in all fields again, because all fields were empty.</cite></p>
      <p>I’ve asked for this bug to be fixed several times, because everytime I have to clean up SEO links in spammer accounts, I face this problem. So believe me, it’s 100x worse for us admins than it is for users.</p>
