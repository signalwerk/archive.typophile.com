    <p>it's far from finished:</p>
    <p><a href="http://farm6.static.flickr.com/5228/5672017735_5946b18074_o.png"></a></p>
    <p>the weight between characters is still a little uneven, and some letters i'm not sure about. i was thinking of scrapping the g and starting on a two-story g  (along the lines of johnston, akkurat etc.)</p>
    <p>i started by wanting to create a grotesque striped down to its simplest form by removing unnecessary terminals. </p>
    <p><a href="http://farm6.static.flickr.com/5183/5672017799_748b9ce77f_o.png"></a></p>
    <p>i kind of gave up on that concept, as the results were not as legible and appeared unbalanced. but i'm not sure whether i should abandon the idea completely? maybe have two versions of the face - limbs and amputee grotesque? :)</p>
    <p>i would love some feedback or thoughts on the typeface!</p>
    <p>thanks,</p>
    <p>hank</p>
