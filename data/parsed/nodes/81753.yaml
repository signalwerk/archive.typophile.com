      <p>I think you can make the "g" a <em>little</em> more tame, but go too far and the font will become a me-too lost in the shuffle... Mostly I think this is a spacing issue. So, I would try:<br>
      - Making the ear stronger and/or more horizontal/low.<br>
      - Having an alternate form to avoid collisions, like with the "j".</p>
      <p>Get "gy" to sit well, and you're halfway there.</p>
