    html: |-
      <p>hi james -</p>
      <p>when up-righting the bottom of the 'g', i didn't want to loose the balance of negative space (inside the circles) between upper and lower circles. so the bottom circle maintained dominance (this is a feature about the <a href="http://new.myfonts.com/fonts/p22/underground/p22-underground/">johnston double-story g that i find very pleasing</a>). i feel most double-story 'g's sans-serif faces to be miss balanced (<a href="http://cg.scs.carleton.ca/~luc/GillSans-g-designprocess-1933.jpg">gills sans</a> etc.). akkurat would probably be the closest comparison i can think of to what i'm attempting, but i find the 'g' just a little too small. by increasing the size of the 'g' and the negative space within the circles (with a dominance to the lower.) - i hope to make it fit in better with the grotesk face and make it more readable.</p>
      <p>so yeah, the bottom of the g is out of proportion from most other sans double-storys, but i'm quite sold on it (and to my eye i find it quite comfortable).</p>
      <p>thank you for questioning it!<br>
      i might consider revising it if it doesn't trial well.</p>
      <p>h</p>
