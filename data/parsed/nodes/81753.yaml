      <p>You might actually make such a variance part of the character of the font! Although that would admittedly be very idiosyncratic in anything but a highly expressive script face... If you go that route you should do the same in the ascenders - probably make the "f" rise higher than the rest.</p>
      <p>BTW, if you do decide the make the "y" go lower and it has trouble avoiding the "g" you might try the Fleischmann form (where the descender comes out of the <em>left</em> arm and curls clockwise).</p>
      <p>hhp</p>
