    html: |-
      <p>hey guys, thanks so much for your feedback!</p>
      <p>-trevor</p>
      <p>originality is something i find many people get hung up on. i personally do not see it as necessary as most. i feel - if something can be improved upon by doing it differently it should be done, but doing something differently for the sake of it being different is of no worth. experimentation however is a very valid means of looking for improvement through the act of trial and error. and this is my interest in type; i wish to experiment with type in the hope that i can contribute something valid.</p>
      <p>    "Don’t try to be original, just try to be good."</p>
      <p>       —Paul Rand paraphrasing Ludwig Mies van der Rohe’s quote:</p>
      <p>    “I don’t want to be interesting. I want to be good.”</p>
      <p>thanks for introducing me to marquette, i was unaware of it previously.</p>
      <p>-james</p>
      <p>i'm planing on continuing both variants of the typeface, you're right about the 'a' it just doesn't balance. </p>
      <p>-garry</p>
      <p>wow, mercator! what a nice face. i really like the top and tail of the lowercase 'a' and i love the number '2' <a href="http://typophile.com/files/Mercator_Tetterode_specimen_p77_6390.jpg">http://typophile.com/files/Mercator_Tetterode_specimen_p77_6390.jpg</a></p>
      <p>you're right about thinning the junctions. i wanted to have a reasonably consistent thickness of line throughout. johnston sans seems to get away with by connecting junctions against the angle of the stem - where as grotesques tend to join the stem in sympathy to it's angle (as though the pen continues to draw the stem in one fluid line).<br>
      this is seen clearly in the lowercase 'n' - <a href="http://www.ltmcollection.org/images/webmax/r1/i00006r1.jpg">http://www.ltmcollection.org/images/webmax/r1/i00006r1.jpg</a></p>
      <p>i shall bring the junctions in and look into the x-height.</p>
      <p>i'll post my amendments when i have made some progress.</p>
      <p>thanks again!</p>
      <p>hank</p>
