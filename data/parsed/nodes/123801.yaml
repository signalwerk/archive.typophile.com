    <p>The HapticScript family is a connected brush script with a warm, personal and soft character. The typeface family has five styles from Light through Black. It was designed as a companion and extension to the Haptic sans-serif family.</p>
    <p>HapticScript has up to 14 variations for each glyph. The almost 2,000 characters per font including 40+ ligatures enable designers to give each word an individual look. Many swash characters for initials and word endings make words looks as if they were hand lettered.</p>
    <p>Five Styles: Light, Regular, Semibold, Bold and Black</p>
    <p>OpenType features: Ligatures, Contextual Alternates, Stylistic Sets, Old Style figures, Tabular figures</p>
    <p><a href="https://web.archive.org/web/20150329054215/http://www.henningskibbe.com/hapticscript/" title="http://www.henningskibbe.com/hapticscript/">http://www.henningskibbe.com/hapticscript/</a><br>
