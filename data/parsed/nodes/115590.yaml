      <p>You have to feel for the guy.</p>
      <p>We all have work from early on in our careers that we'd rather forget. Imagine if that work was was still being paraded around the world twenty years later?</p>
      <p>I have absolutely no ill will toward Vincent. The response to comicneue.com has been almost all positive, although it has caused some ill-willed @ replies towards him on Twitter, which is a shame.</p>
      <p>Perhaps I'm a little over-ambitious, but I would like to see Comic Neue become a redeemed version of Comic Sans. It needs a little more work, but the world (the online one at least) has shown overwhelmingly over the last two days that the interest is there. I just need a professional typographer to help turn it into a viable option for libraries and foundries like Typekit to take onboard.</p>
      <p>Who is going to help me? It's paid work!</p>
