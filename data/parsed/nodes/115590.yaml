    <p>Hello</p>
    <p>Yesterday I released <a href="http://www.comicneue.com" rel="nofollow">www.comicneue.com</a>. Last night it was trending worldwide on Twitter, was featured on the front page of Mashable, Reddit, Hacker News, The Verge, everything! It has been downloaded well over 10,000 times in the last 24 hours, and there are an average rate of 800  people viewing the site at any one time.</p>
    <p>I created the font in TypeTool, the cut down version of Font Lab. It was a two year side-project and I put a hell of a lot of work into it, but it needs a final polish from someone far more experienced than I am.</p>
    <p>My name is Craig Rozynski. I've been working as a graphic designer for 15 years. 7 of those as a freelancer. I know how to run a project and you'll be in good hands. I am looking for someone to:</p>
    <p>1) Improve the kerning overall, and<br>
    2) Optimise the appearance of the font on Windows.<br>
    3) Perform an overall quality check.</p>
    <p>If you're interested in collaborating on this now world-famous (!) font with me. Please send me an email at craig at craigrozynski.com with a cost (or request for  more information if you're unsure), a turn around time, and any other relevant details.</p>
    <p>Thanks!<br>
    Craig Rozynski</p>
