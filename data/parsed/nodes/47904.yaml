  html: |-
    <p>I need to submit a quote for developing<br>
    a new Armenian font that renders well<br>
    under ClearType, and I was wondering:<br>
    how hard is it to get close to the quality<br>
    of something like Corbel? Assuming the<br>
    tools to get close are even public...</p>
    <p>If however the tools are not public, how would a<br>
    designer accommodate what CT likes to render?<br>
    Would it only really work for one point size?<br>
    Does “regular” hinting help or hinder?</p>
    <p>hhp</p>
