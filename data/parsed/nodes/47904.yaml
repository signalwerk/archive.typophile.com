    votes: null
    html: <p>It would be somewhat difficult to achieve that level of hinting using anything other than VTT (ie would be hard using FontLab) and VTT has a steep learning curve. You might be best off sub-contracting the hinting out so someone with VTT experience. If they have an autohinter that gets them part-way there, then the cost may not be prohibitive, compared to the hrs you might have to spend.</p>
