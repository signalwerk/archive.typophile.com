    html: |-
      <p>@ Jesse: You're right, that |Q| ain't exactly a beaut'. It strikes me as too futuristic compared to the other round capitals. Klingspor Gotisch has a rather tiny tail attached to an otherwise unmodified |O|, but if I try that here, the tail basically falls off. I'll try out a different architecture, with a larger tail under rather than next to the body of the |Q|.  That happens to be my favorite solution for |Q| in general.</p>
      <p>I rather like my |S| so far — maybe a bit on the wide side. Luckily Textura isn't meant to be used in all-caps... I'll push it together a bit and see if it looks more harmonious that way, though. I don't want to make the double piping vertical because it might look too much like a dollar sign.</p>
      <p>@ Craig: I know exactly what you mean. I tried several other designs for that junction, though, and they all looked crumbly and disjointed. Maybe now that I've increased the ascender height, I can find a better solution again...?</p>
