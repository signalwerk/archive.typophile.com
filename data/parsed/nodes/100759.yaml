    html: <p>Those changes look good. On the six, maybe I'm seeing things. Or maybe the four is too low or something. Generally I think those figures are not nearly as polished as the letters, but I know from experience that getting Arabic numbers to mesh with blackletter style is stuffing square pegs into round holes. On the /G/, I think it's the nearly complete monoline circle in the original glyph that makes it look less old fashioned - by that I mean not that it looks like a familiar structure, but just that it has more of the modernist flavor. Any of those other /G/s work I think, but I kinda think that tail structure is a bit of a signature characteristic for this typeface from its appearance in the descending lowercase letters, so maybe the second is best. On the /s/, I would do some sketches from scratch, maybe building around a thick spine that goes this way \ instead of the hairline that goes /.</p>
    html_clean: <p>Those changes look good. On the six, maybe I'm seeing things. Or maybe the four is too low or something. Generally I think those figures are not nearly as polished as the letters, but I know from experience that getting Arabic numbers to mesh with blackletter style is stuffing square pegs into round holes. On the /G/, I think it's the nearly complete monoline circle in the original glyph that makes it look less old fashioned - by that I mean not that it looks like a familiar structure, but just that it has more of the modernist flavor. Any of those other /G/s work I think, but I kinda think that tail structure is a bit of a signature characteristic for this typeface from its appearance in the descending lowercase letters, so maybe the second is best. On the /s/, I would do some sketches from scratch, maybe building around a thick spine that goes this way \ instead of the hairline that goes /.</p>
