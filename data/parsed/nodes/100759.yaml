    user: 188621
    date: 2013-03-08T16:28:00
    date_raw: 8 Mar 2013 — 4:28pm
    votes: null
    html: |-
      <p>@ Craig: Thanks for the feedback!  Let's see:</p>
      <p>I've raised the bowl of the |d| a bit more, as you suggested...  it has to be the most-edited glyph in the font.  :P<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ddd_3682.png"></div><p></p>
      <p>Narrowed the |x|:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/xx_4199.png"></div><p></p>
      <p>I'm not sure what you mean about the |6|, it looks aligned with the |1|s, for example...  Most of Gryffensee's characters have pointy feet, so that "hovering" sensation is not unusual.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/6_5420.png"></div><p></p>
      <p>You're right about the unhandsome alternate |K|. The new one looks significantly better while still keeping a bit of the gruff blackletter attitude.  ;o)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/KK_5535.png"></div><p></p>
      <p>The alternate |G| is a bit more difficult. I disagree that the previous version looked more old-fashioned than the default |G| — the tailed shape is still common in contemporary script and calligraphy fonts, whereas the default Fraktur |G| is positively alien. Personally, I find it the least recognizable letter in Klingspor Gotisch. </p>
      <p>In any case, I've made some experimental variations of the alternate |G|. I like the diagonal connection in the interior — it gives the |G| a crossbar, though it also evokes a lightning-bolt shape in the glyph that may through the reader's eye off track. The right-most version works pretty well; I'm considering that as the new alternate. However, I happen to have a particular soft spot for tailed |G|s, so I might still go for the second or third version instead...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/GGGGG_5790.png"></div><p></p>
      <p>As for the |s|...  I actually quite like it that way. It's in a way the most "futuristic" glyph of the font, and that's an intentional connotation of the font concept. However, I'm open to suggestions. Do you have any ideas on how to improve it...? (Otherwise, you can always use the long |ſ|! ;o)</p>
      <p>Thanks again for the insights!</p>
