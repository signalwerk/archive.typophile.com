      <p>Hi Marcin,</p>
      <p>thanks for your insight. I've made the |Ѣ| taller, and I like it that way. I tried cutting the crossbar against the pen slant, but it felt all wrong. I hope it's still legible that way?</p>
      <p>I also fixed the long-standing problem that the |Б| was too narrow to feel like a proper capital. Finally, I made a new Ы that looks a bit more "capital" than the old one, thanks to an exaggerated |I|-like serif on the second stem that ties the two parts together into a square box. However, I don't know whether that has a negative impact on legibility. What do you think?</p>
