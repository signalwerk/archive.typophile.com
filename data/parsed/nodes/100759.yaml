    html: |-
      <p>OK, I'm getting very mixed responses about those |s|es, here and on TypeDrawers, and I also find my allegiances fluctuating a lot. I've always liked the slim |s|, though — it has a certain understated elegance and embodies the font's geometric, reductionist philosophy very well. I am certainly going to keep it, perhaps even for both cuts of the font.</p>
      <p>The Klingspor |s| is pretty, but as Johan remarks, it feels highly non-geometric (although it technically adheres to the rules I've set up); in fact, I find it even somehow manages to undermine the geometric feel of entire words it appears in, yielding the impression of a traditional fraktur font. That can be desirable, of course, but I don't think it should be the main aim of the font. </p>
      <p>Conversely, though, my original |s| looks very geometric indeed, almost a bit too freaky. It has no relation whatsoever to established blackletter shapes... and it's too heavy, too.</p>
      <p>Alright, then. How about I release the font in three versions? One with the traditional caps and Klingspor |s|, one with the legible caps and the slim |s|, and a third one with the geometric |s| (and possibly the traditional caps?).</p>
      <p>I also intend to make one of the three the master font and add all variations in as stylistic alternates, so professionals can mix and match the styles freely. Which of the three do you think should be the default...? </p>
      <p>By the way, I've made spine of the slim |s| a bit heavier, I think it meshes better with the other letters now:</p>
      <p><img src="/sites/default/files/old-images/sweight_5791.png"></p>
