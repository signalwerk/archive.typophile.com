      <p>@ Pablo: Thanks for pointing that out! I wasn't aware there was already a font out with those shapes. Luckily, I think my approach takes the concept into a different direction than Bastard, so there's no reason not to pursue the project further.</p>
      <p>@ Craig: I'd rather not name my work after another artist, unless my work is actually derived from theirs (as it is in the case of Eau de Garamond).</p>
      <p>It seems to be difficult to find a catchy name somewhat related to Futura. Maybe I should try to highlight the clean and geometric cuts instead. <strong>Skalpell</strong>, maybe? Too morbid? <strong>Feinmechanik</strong>? Oh, wait, how about <strong>Uhrwerk</strong>? That's clean, geometric <em>and</em> time-related.</p>
