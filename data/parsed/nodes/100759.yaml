      <p>I have just registered to Typophile to express my admiration to your blackletter. My comments about your Cyrillic are layman's -- I have only designed two letterforms in my life: a capital and lowercase |yogh| to get along with Alcuin. Moreover, I am a Pole but I have read my share of Russian books and own Шрифты, a Soviet book with specimens of hundreds of typefaces. The bottom line: I offer you my comments in good faith without aspiring for the prize.</p>
      <p>The minuscule looks good. I think |з| usually has no descender, and never has it |я|. Also, the left bar of |ъ| should protrude.</p>
      <p>The |Д| should have two distinct vertical serifs at the bottom. Now I might mistake it for |А|. I would suggest that you go with a roman |Т| (you already have a non-cursive |Д|). This would also allow you to make |М| more typical. Also, you might think of a way to connect the two parts of |Ч| more visibly. Finally, the |Э| is very unusual -- you might try to base it on a circle.</p>
      <p>I have also minor comments to:<br>
      |В|: I know it's taken from the Latin version, but it looks a bit like cursive |Д|.<br>
      |Ж|: Although I find it legible, you might experiment with moving the top left and bottom right slanted strokes closer towards the mean line.<br>
      |Л|: The angle between the left and the top strokes is usually straight or even obtuse.<br>
      |У|: You might experiment with making the descender open to distinguish it better from |Ц|.</p>
      <p>Feel free to ignore any part of my grumbling, especially when real natives speak up. Do you plan to design also non-Russian Cyrillic letterforms?</p>
