      <p>Three version of |f|:<br><img src="/sites/default/files/old-images/a_4910.png"><br><img src="/sites/default/files/old-images/b_4531.png"><br><img src="/sites/default/files/old-images/c_4429.png"></p>
      <p>Frankly, I still prefer the solid solution (bottom). The top one falls apart, whereas the middle one insists on too massive a spur to the left. The solid |f| also harmonizes best with the |t|, which requires a heavy crossbar to be recognizable as such, especially in absence of other identifying features such as a curved bottom or a unique top terminal. By the way, I widened that |P|; it had it coming.</p>
