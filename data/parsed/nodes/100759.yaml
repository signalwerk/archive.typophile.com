    <p>I recently stumbled upon some hand-painted blackletter capitals by Sasha Prood (in orange, towards the end of the sequence):</p>
    <p><a href="http://www.sashaprood.com/art/Scroll_Portfolio_02.jpg" title="http://www.sashaprood.com/art/Scroll_Portfolio_02.jpg">http://www.sashaprood.com/art/Scroll_Portfolio_02.jpg</a></p>
    <p>They inspired me to start experimenting with a very geometric approach to a textura font myself. In particular, I'd like to stick to (quasi-)circular arcs and straight lines with either horizontal, vertical, or 45° diagonal stroke cuts. Here's what I have so far:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/zukunft_5914.png"></div><p></p>
    <p>It feels strangely complementary to my previous work on Octant, where I applied blackletter features to a humanist serif chassis, whereas here I'm applying features from geometric sans to a blackletter chassis.</p>
    <p>Whaddya think?</p>
    <p>I was toying with the name "Zukunft", in the line of Futura and Avenir, but that seems to be taken already.  :\</p>
  html_clean: |-
