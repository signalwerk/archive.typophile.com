    html: |-
      <p>@ Craig: Thanks for the feedback!  Let's see:</p>
      <p>I've raised the bowl of the |d| a bit more, as you suggested...  it has to be the most-edited glyph in the font.  :P<br><img src="/sites/default/files/old-images/ddd_3682.png"></p>
      <p>Narrowed the |x|:<br><img src="/sites/default/files/old-images/xx_4199.png"></p>
      <p>I'm not sure what you mean about the |6|, it looks aligned with the |1|s, for example...  Most of Gryffensee's characters have pointy feet, so that "hovering" sensation is not unusual.<br><img src="/sites/default/files/old-images/6_5420.png"></p>
      <p>You're right about the unhandsome alternate |K|. The new one looks significantly better while still keeping a bit of the gruff blackletter attitude.  ;o)<br><img src="/sites/default/files/old-images/KK_5535.png"></p>
      <p>The alternate |G| is a bit more difficult. I disagree that the previous version looked more old-fashioned than the default |G| — the tailed shape is still common in contemporary script and calligraphy fonts, whereas the default Fraktur |G| is positively alien. Personally, I find it the least recognizable letter in Klingspor Gotisch. </p>
      <p>In any case, I've made some experimental variations of the alternate |G|. I like the diagonal connection in the interior — it gives the |G| a crossbar, though it also evokes a lightning-bolt shape in the glyph that may through the reader's eye off track. The right-most version works pretty well; I'm considering that as the new alternate. However, I happen to have a particular soft spot for tailed |G|s, so I might still go for the second or third version instead...<br><img src="/sites/default/files/old-images/GGGGG_5790.png"></p>
      <p>As for the |s|...  I actually quite like it that way. It's in a way the most "futuristic" glyph of the font, and that's an intentional connotation of the font concept. However, I'm open to suggestions. Do you have any ideas on how to improve it...? (Otherwise, you can always use the long |ſ|! ;o)</p>
      <p>Thanks again for the insights!</p>
