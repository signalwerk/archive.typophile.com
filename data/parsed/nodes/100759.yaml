      <p>Thank you for the warm welcome, Christian!</p>
      <p>FWIW, pre-1708 Cyrillic (полуустав) solved the bar problem in |ъ| by inclining the vertical stroke to the right (<a href="http://irmologion.ru/fonts.html">http://irmologion.ru/fonts.html</a>). I do know it is rather unacceptable in blackletter.</p>
      <p>I understand your aversion to serifs but those in |Д| are special. Even sans-serif fonts usually have them.</p>
      <p>IMHO, your Latin |М| would do fine -- Cyrillic cursive |T| has a solid bar on its top. I see no problems with your |И|. Maybe you could overcome the |E| vs |Є| problem by making |Є| more similar to |ᗕ (Canadian syllabics carrier wa)|, minus the ugliness, of course.</p>
