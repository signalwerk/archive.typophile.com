    date: 2013-04-15T06:26:00
    date_raw: 15 Apr 2013 — 6:26am
    votes: null
    html: "<p>During the lunch, I did a field test on my Belorussian friend, a native speaker of Russian. The |Ѣ| is good. He found the entire minuscule legible, although he thinks that the thin crossbar that closes the |у| is an unnecessary hindrance. With respect to the capitals, he would mistake |М| for |Т| in isolation, so he suggests that you revert to the first |М|. To his eye untrained to blackletter, the arc in |Т| makes it too similar to |С|. Also, he prefers the old |Ы| that follows the way it's handwritten. As to the text, he pointed me to a Russian pangram: \"Съешь ещё этих мягких французских булок, да выпей же чаю.\" but he says it's a bit cliché. I can ask him for some Russian poetry -- would you prefer a folk song, some classic like Pushkin or Lermontov, or some more modern poet?</p>"
