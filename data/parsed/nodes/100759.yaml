      <p>Three version of |f|:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/a_4910.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/b_4531.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/c_4429.png"></div><p></p>
      <p>Frankly, I still prefer the solid solution (bottom). The top one falls apart, whereas the middle one insists on too massive a spur to the left. The solid |f| also harmonizes best with the |t|, which requires a heavy crossbar to be recognizable as such, especially in absence of other identifying features such as a curved bottom or a unique top terminal. By the way, I widened that |P|; it had it coming.</p>
      <p>I do like the new |Q| and |S|:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Q_4336.png"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/S_4826.png"></div><br>
      You can also see the newest |w| in there, which makes the curved counter slightly larger than it was before to bring it in line with the standard |n| counter.<p></p>
