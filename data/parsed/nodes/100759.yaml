      <p>I wrapped Gryffensee up and sent it to MyFonts. Expect to see it up for purchase soon!</p>
      <p>Meanwhile, I find myself daydreaming about expanding Gryffensee into the cyrillic parameter space. There seem to be almost no cyrillic blackletters available, which could mean it's really hard to pull off, but also that it could be a big untapped market.</p>
      <p>Unfortunately, I have no practical experience with cyrillic apart from knowing what the basic letters sound like in Russian. I'd probably need some coaching in legibility matters from native readers.</p>
      <p>Whaddya think? Worth the effort?</p>
