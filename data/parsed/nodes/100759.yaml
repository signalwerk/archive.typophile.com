      <p>Hi Marcin, welcome to the forum and thanks for your comments!</p>
      <p>Minuscule: Latin blackletter often has some descenders where antiqua usually doesn't, such as in |h|, |z|, |x|, |f|, |ß|, and some capitals. As a result, I feel entitled to do the same thing to Cyrillic... but if it just comes across as weird or illegible, I'll try to work around it. My main problem is that my x-height is awfully cramped, what with my wide stroke and geometric constraints. Cyrillic exacerbates the problem by stuffing a lot of pen-unfriendly forms and tiny distinctions into the x-height. I'm taking every chance I have to break free from that space (I even used to have a descender on |в| but found that too weird in the end).</p>
      <p>As for the |ъ|, I know it's supposed to protrude to the left, but that will create a gaping hole of white space in a word. Maybe Cyrillic expects this sort of white space for legibility, but in a blackletter that relies on blackness for texture, it sticks out like a sore thumb... anyway, I'll try to come up with something. Maybe if I had it protrude diagonally to the upper left...?</p>
      <p>I see what you mean about the |Д| — it's annoying to have to rely on serifs when I'm trying to avoid serifs in general. I'll try an alternate structure based on the Roman |L|; hopefully that will also work for |Л|. I'm fine with using the Roman |T|. Do you think my Roman |M| will be recognizable as such, or will it look too much like a cursive |T|?</p>
      <p>I also see what you mean for |Ч|. Do you think the problem is less pronounced in |И|, which shares the same connective tissue? If I can find a good shape for |Ч|, maybe that will also solve the |У| problem that you mention.</p>
      <p>I did try a circular form of |Э| first, but found it looked out of character with the blackletter. I might just go back to that.</p>
      <p>Non-Russian characters: Yes, I've been looking to fill in the "Adobe Extended" range as provided in the Glyphs application. I noticed I'll have to make the |E| angular so as to distinguish it from |Є| — that's rather annoying...</p>
