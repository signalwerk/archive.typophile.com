      <p>Hi Christian. Hope you don't mind yet another comment of mine, this time on the capital |Ѣ (Yat)|. Given the archaic feel of blackletter, I would guess this letter will be used more often than in everyday writing (that is: more often than not at all).<br>
      IMHO, the current version would work better as the ultra-special |Ҍ (Semisoft sign)| that you understandably haven't done. Its generally small size puts it in the same league as |Ь| and |Ъ| that don't represent any sounds. But |Ѣ| is a full, majestic letter that represents |Е|. Try to typeset Dostoevsky's БѢСЫ (now БЕСЫ). My suggestion is to base |Ѣ| on |Ъ| with its bar prolonged to the right (IMHO cutting its right edge like this: /====\ rather than /====/ would be preferable) and an extra long ascender, like in |Ф|. The call is yours.</p>
