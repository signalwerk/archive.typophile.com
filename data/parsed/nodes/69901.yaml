      <p>My, now this is some constructive criticism! Where do you live? I will send you a pig for Christmas.</p>
      <p>The basic spacing is almost done now. I've put more space between letters, as they are quite open. Yes, I'm having difficulties with the curved strokes (which basically are the font). I think I fiddle with them with just my bad eye. I should make some control shapes to help make the curves and diagonals more uniform. You are so right about the diagonals. I've improved them according to your suggestions:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/uc,lc,numbers_5572.jpg"></div><p></p>
      <p>In the first post I've attached another pdf with the current spacing. Still no kerning. Set at 9/11, I think it is not the most unreadable design when printed.</p>
      <p>Right now I'm having trouble with the diacritical marks.</p>
      <p>Another question comes to my mind: should I make the round curves more square, or the squarish ones more round?</p>
      <p>I will take time tomorrow to take an in-depth look at your remarks.</p>
      <p>Thank you so much!</p>
