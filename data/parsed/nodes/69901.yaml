    html: |-
      <p>Well, as has been said before, I'm just a beginner so take what I say with a grain of salt.</p>
      <p>This is looking pretty good (nice numerals), though on some of the bowls, arches, and  round corners, the strokes don't appear to be the same thickness. Some letters, like the uppercase U, look slightly lopsided to me. (Again, thickness of bowls and arches.) Some letters are very round, and some are more square, try to equalize it.</p>
      <p>Diagonal uppercase letters AMNWV... Try making the thin and thicks (as subtly different as they are) like so:<br>
      - A: <code>/<strong>\</strong></code><br>
      - V: <code><strong>\</strong>/</code> (opposite of A)<br>
      - M: <code>|<strong>\</strong>/<strong>|</strong></code> (not with the inner strokes thinner)<br>
       N: <code>|<strong>\</strong>|</code><br>
       W: <code><strong>\</strong>/<strong>\</strong>/</code></p>
      <p>Also:<br>
      - G should have a serif on it's stem<br>
      - bottom stroke of the C should extend slightly past the top stroke<br>
      - the horizontals  in your uppercase should be slightly thinner than the verticals<br>
      - lowercase g is great! Though you could try making the ear sheared off diagonally<br>
      - Maybe try connecting the bowl on the R to the stem, and making the angle of the leg slightly less.</p>
      <p>Your uppercase might be slightly too bold compared to the lowercase, but I would print a test out on paper to make sure. Also, the spacing is much too tight for text, although it works for titling, if you plan on having it used at all for text, you might want to loosen the spacing a bit. (Graphic designers tend to close up the spacing in large sizes if they feel it's needed.)</p>
      <p>Sorry if this is a lot of critiques, and most of my previous critiques may still apply, but I hope it helps (remember the grain of salt!). Anyway, I've been waiting for the uppercase. This font is great! (Hope you release it!)</p>
