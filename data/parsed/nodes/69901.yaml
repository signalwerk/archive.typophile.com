    html: |-
      <p>I quite like this.</p>
      <p>Here are some comments, take them with a grain of salt:<br>
      - /t/ is top-heavy.<br>
      - The ear on /r/ should be a tad heavier.<br>
      - The transition/arch on the letters /m/n/h/u/ should be slightly darker. Also the top-right on /a/ and /p/.<br>
      - /x/ is probably too wide at the bottom.<br>
      - /k/ seems a bit odd with the upper diagonal thicker than the bottom.</p>
      <p>In any case, the joins on your letters are lovely. I especially like your serifs - my attempt at similar ones didn't work too well. Also, as far as the /t/ goes, the lowercase t is the worst letter to design in my opinion. Normally you form it using the left part of the /u/, and figure the crossbar weight from the eye of the /e/.</p>
      <p>I am guessing you can find most of the problems yourself. Printing a page in your font at a small size should help you find any major problems, as this will be used in small sizes.</p>
      <p>Hope that helps! If you have time, you could take a look at <a href="http://typophile.com/node/68311" rel="nofollow">my font</a>. C:</p>
