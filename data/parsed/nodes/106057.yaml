      <p>STATE: should be <a class="freelinking external" href="http://www.dafont.com/usa.font" rel="nofollow">USA</a> by Iconian Fonts, may be scaled<br>
      GRANITE: thought I could find a match but came to nothing perfect. Still pretty convinced it's a techy freebie or a cutomization based on (various?) techy freebie. Try having a look to these 2 sections at DaFont, may be you'll be luckier than me: <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=303" rel="nofollow">Techno &gt; Sci-fi</a>, <a class="freelinking external" href="http://www.dafont.com/theme.php?cat=304" rel="nofollow">Techno &gt; Various</a> (<a class="freelinking external" href="http://www.dafont.com/tr909.font" rel="nofollow">TR-909</a>, <a class="freelinking external" href="http://www.dafont.com/terminator.font" rel="nofollow">Terminator</a>, <a class="freelinking external" href="http://www.dafont.com/boom-box.font" rel="nofollow">Boom Box</a>...)<br>
      Posting reworked sample too, could be helpful for some other identifiers...<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-2_5090.png"></div><p></p>
      <p>EDIT: finally, got it! That was <a class="freelinking external" href="http://www.dafont.com/boom-box.font" rel="nofollow">Boom Box</a> but <a class="freelinking external" href="http://www.dafont.com/boom-box.font?text=granite" rel="nofollow">full lowercase</a> and not uppercase...</p>
