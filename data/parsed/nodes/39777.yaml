      <p>I'd say the short answer is because not all designers have unlimited budgets for font licenses--at some point, choices need to be made. I'd love to have the resources to license every quality font out there, the "just-in-case" design scenario--but realistically, I tend to shy away from designs that are just "five percent" moves from fonts I already have licensed. </p>
