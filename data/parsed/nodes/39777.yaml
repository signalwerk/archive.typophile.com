      <p>Agora has been renamed PF Centro Pro, probably due to the existence of another typeface called Agora as Mike Yanega mentioned.</p>
      <p>Raa, don't be too hard on yourself, and don't let this stop you from posting in the forums. It's just that we should be more careful to rush to judgements based on the lack of Google presence (especially if that is due to being active mostly in a non-Western market separated by a different writing system as well as language).</p>
      <p>By the way, I would like to hear what people think of PF Centro Pro, including the Greek and Cyrillic designs. The Greek has some obvious details, like some serifs in the lowercase, that many of the Greek experts here would consider inauthentic but are in keeping with many of the contemporary designs produced in Greece.</p>
