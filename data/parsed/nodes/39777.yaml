      <p>I think a more subtle but appropriate design question would be....other than the apparently excellent foreign language support, what is there about HIghway Sans for example that would motivate a graphic designer to license it, if he/she already had FB Interstate? Or PF DIN if one already had FF DIN?</p>
      <p>I do think the Agora family looks nice and interesting though, I like well-thought-out designs that cover the serif, sans, and slab angles as a coherent whole. NIcely done.</p>
  - id: 247193
    user_id: 1062
    user_name: marcox
    user_path: null
    date_raw: 17 Dec 2007 — 1:49pm
    date: 2007-12-17T13:49:00
    votes: null
    html: |-
      <p>To me, Parachute's take on DIN and highway signage is not as strictly beholden to its sources of inspiration -- less geometric and more typographic, most obviously in the italics, but even in the joins and shapes of the roman.</p>
      <p>Whether that would be enough to entice someone who already owned FF or FB versions to license the PF version, I don't know. (PF's DIN Display is an entirely different animal that could happily coexist with FF Din as body copy.)</p>
      <p>But that's not really the point -- why can't we have multiple DINs along with our dozens of Garamonds?</p>
