    <p>I'm looking at this foundry called Parachute Fonts and it's sort of obvious that their designs were 'inspired' by well known typefaces. Anyway, there's one typeface I really like and I'd very much like to know what is the original:</p>
    <p><a href="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=7&amp;CharacterSetID=12" title="http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=7&amp;CharacterSetID=12">http://www.parachute.gr/fonts.aspx?Sample=1&amp;FontStyleID=&amp;FontFamilyID=7&amp;...</a></p>
    <p>If I'm wrong (meaning if Parachute are not ripping anyone off) I apologize in advance!</p>
