      <p>I'll go out on a limb and say these *are* original designs, albeit ones that draw on influences or sources also seen in other faces.</p>
      <p>I rather like their take on German and American highway signage (DIN and Highway Sans), and see some features I like better than similar offerings from Fontshop (FF Din) and Font Bureau (Interstate).</p>
      <p>Parachute seems to enjoy introducing a bit of funkiness into their heavier weights, which I also enjoy.</p>
      <p>As for Agora, its three iterations (sans/serif/slab) would make a nice corporate identity package.</p>
