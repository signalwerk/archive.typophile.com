    date: 2007-12-17T10:50:00
    votes: null
    html: |-
      <p>As a new member (this is my second time around) and not having made any friends yet in this forum, I feel being in an awkward position to defend several years of work as a type designer and the 7+ years of Parachute’s existence.  Parachute may be new to you (our site just went up a few months ago), but we are well established in the local market.<br>
      If we were to believe member ‘raa’s’ unacceptable title, then corporations such as Ikea, Vodafone, Nestle, Unilever, BBDO, McCann Erickson, JWT, Saatchi &amp; Saatchi, DDB, Leo Burnett, TBWA, Ogilvy &amp; Mather, National Geographic, Playboy, Elle, Harper’s Bazaar, PC Magazine, Votre Beaute, National Bank of Greece, and so many others must be doing something wrong being our clients.<br>
      Well known design agencies in Germany, England and the United States must have been out of their minds when they purchased PF Agora Sans Pro.<br>
      Schools and conference  organizers must be doing something wrong when they invite us as guest speakers.<br>
      The awards we received over the last few years should not have been given to us.</p>
      <p>Let me invite you all to visit our site [[http://www.parachute.gr]] and spend some time reading all about Parachute before you make any rush judgments. Read about each and every typeface, read how they were made, when they were made, how they differ, what more they have to offer, download the 30+ page pdfs and see for yourself.  We do not claim some high degree of originality here, but *only to the same level as other companies do*.</p>
      <p>Influences? Yes a lot. But don’t you see this in all new faces? As Goudy once said “the old guys stole our best ideas”. If originality was questioned, in this harsh and inappropriate way, anytime each one of us spotted some sort of ‘inspiration’ from another source, then all existing new faces would have been knockoffs to different people for different reasons. I myself, and assume many of you, every time I look at typefaces I find similarities to other ones. This does not necessarily mean one is a knockoff of the other.<br>
      A knockoff is a cheap almost-identical or simply identical version of an existing original typeface and definitely not something you have created from scratch and of course not something that is based on public domain material.<br>
      Parachute fonts, as member ‘aluminum’ mentioned, are expensive. Imagine that. A knockoff that expensive!!  Who are you kidding ‘raa’?  Parachute fonts are original as much as others can be, very well crafted and designed to offer more than other competitive typefaces, simultaneously supporting Latin, Greek and Cyrillic.</p>
      <p>If we were to be blamed for designing some highly competitive typefaces like the Din Text Pro Series, Highway Sans Pro etc, which were created using original public domain sources in the most ethical way (old manuscripts, manuals for major standards, historic catalogs), then we are guilty as charged. Nothing to hide, just read the credits. I’m glad that members like ‘marcox’ have already picked their favorite.<br>
      But if we were to be judged based on one member’s misconception then that makes me really mad.</p>
      <p>By the way 'raa', to save up some time to you looking for demons, PF Agora Sans Pro was based on PF Agora Serif Pro as well as some older incomplete commisioned work. Period. </p>
      <p>I thought that Typophile is a forum that deals with typography issues to the extend that would not allow its members damage a company’s reputation with such vague comments.<br>
      Otherwise thanks but no thanks ‘Miss Tiffany’ for rephrasing the title. I don’t think you believe that made things much less harsh.</p>
      <p>I would like to see some of you out there question the “legit typefaces” that big  companies offer using the same unacceptable comments as member ‘raa’ so light-heartedly used and then you’ll see how fast and hard they will come down on you. Myself, I’ll stick to this honest answer and hopefully it is appreciated.</p>
      <p>-I feel that your title is inappropriate, offensive and should be altered.<br>
      -Dirt may be washed off but bad stain stays there forever.<br>
      -If only, a small company like Parachute would have expected your support.</p>
      <p>-Panos Vassiliou</p>
