      <p>You need to study the relationship between inner space and the space between glyphs. And rhythm. Glyphs knit together in words and words into sentences need a certain flow... Your /m/ is like a stop sign. And your /s/ like a splotch of liquid soap.</p>
      <p>Also, try to avoid too much copy/paste — it impedes character.</p>
