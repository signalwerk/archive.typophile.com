      <p>Yes, there's quite a bit of "that" copypaste, so <em>my /d/ looks like an /o/ with a stick instead of like a letter by itself?</em>. If that's what you and Bert Vanderveen are trying to make me realise, I think I have a huge load of work to do.</p>
      <p>Regarding the /S/-/s/, there was no scaling (in fact, I did all the lower case first), but the analogy was perfect to have an idea of what my /s/ looks like. This raises another question: does that mean you found my /S/ to be "the good one" (or at least, more consistent)? Every time I look at it I wish there was less difference between the two curves.</p>
      <p>I'm quite surprised nobody told anything about the verticals of the /M/ and the horizontal of the /A/. I find them less and less in harmony with the rest of the glyphs. But maybe that's just a pet peeve preventing me to see the real problems.</p>
