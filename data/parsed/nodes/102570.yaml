    html: |-
      <p>Hello guillem.<br>
      I think we get to know each other. I am sorry for assuming, that the lowercase «s» is a scaled uppercase and yes i think the uppercase «S» is a good start. Sure there is a lot of work, but don’t worry, making a font is always a huge load of work and the process is what matters, because the results always keep getting better and better while you optimise your workflow.</p>
      <p>When you referring to the verticals of the «A», now i see, that they are a tad on the thick side (But i make that mistake all the time so who am i to tell) and more important i would lower the horizontal bar, so you have more space inside it (per haps you thought to make it on the same height as the lowercase «f» middle bar, but if you have a look at this: «Af» i think you get the picture). Also stroke widths should be continuous like: the verticals are the widest, the diagonals are a little less wide and the horizontals are the most narrow ones. The round strokes can be mostly fit into the widths of the other strokes, except for the uppercase round strokes, you will want to make them a tad wider when you simply look at strokes with the exact same width. Also if you want to make it a little more pleasing to the eye you could make the ascending diagonal strokes a little thinner than the descending ones (but that depends on the taste and the area of usage).</p>
      <p>i hope that helps you.</p>
      <p>and again best regards</p>
