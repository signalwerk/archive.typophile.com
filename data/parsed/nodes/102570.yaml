    votes: null
    html: |-
      <p>I do like the concept of rounded endings of the strokes. The most important input i would like to give you is, to make the stroke width a bit more continuous, by having same stroke widths for all the horizontal, vertical and round (of course differing between vertical- and horizontal-round) strokes. When i see the uppercase «S» and the lowercase «s» i start to think, that you might have drawn the uppercase «S» first and then tried to scale it down to a lowercase «s». Of course only if that’s the case, i would recommend you first to draw letters like «n» and «o», then test them and look for a rhythm with the white space between that fits your purpose and suits your taste. if you have those two letters you can derive a lot of forms. Not to be derived are organic forms like the «s», the «g» and the «a». They are unique and you would do well to draw them as such.</p>
      <p>I hope i could help you. Here is a link to a picture, that shows you pretty much what «flow» means. Those letters look totally constructed, but if you have a look at the «S» you may realize, that there is no way to easily construct organic forms.<br>
      <a href="http://maxboam.files.wordpress.com/2011/08/thomasewingfrench-essentialsoflettering-1912-02.jpg" title="http://maxboam.files.wordpress.com/2011/08/thomasewingfrench-essentialsoflettering-1912-02.jpg">http://maxboam.files.wordpress.com/2011/08/thomasewingfrench-essentialso...</a></p>
      <p>I think what Bert tried to say with «try to avoid copy paste» is: The round shape of a lowercase «d» and the round shape of the «o» should be treated a bit separately. I don’t see too much copy paste in your font myself, so i can not give you any specifics.</p>
      <p>best regards</p>
