    html: "<p>Which is to be expected: <a href=\"http://www.fontfont.com/shop/view_singles_main.ep?id=611\" target=\"_blank\"> FF Dax</a> was designed in the mid-nineties by Hans Reichel who created <a href=\"http://www.bertholdtypes.com/bq_library/90042.html\" target=\"_blank\"> Barmeno</a> for Berthold in 1983. And you can't but notice the similarities with his <a href=\"http://www.fontfont.com/shop/view_singles_main.ep?id=719\" target=\"_blank\"> FF Schmalhans</a> too. <br> <br>\"Hans Reichel (born 1949) is a musician/inventor/composer as well as being a type designer. For 20 years he's made a name for himself as an accomplished acoustic and electric guitar player. He's also the inventor of the Daxophon (sic), an instrument where thin strips of wood are played with a bow to mimic animal sounds and human voices.\" <br> <br>More information on his musical endeavors can be found <a href=\"http://www.shef.ac.uk/misc/rec/ps/efi/\" target=\"_blank\"> here</a>. <br> <br>FF Dax was his first release under the FontFont banner. Reichel also redesigned and expanded his popular Barmeno family for FontFont, but had to change the name to <a href=\"http://www.fontfont.com/shop/view_singles_main.ep?id=2665\" target=\"_blank\"> FF Sari</a> to avoid being sued by the new owners of the Berthold Type library. <br> <br>Which in short means he doesn't own his creation anymore. Go figure.</p>"
    html_clean: "<p>Which is to be expected: <a href=\"http://www.fontfont.com/shop/view_singles_main.ep?id=611\" target=\"_blank\" class=\"link-external\"> FF Dax</a> was designed in the mid-nineties by Hans Reichel who created <a href=\"http://www.bertholdtypes.com/bq_library/90042.html\" target=\"_blank\" class=\"link-external\"> Barmeno</a> for Berthold in 1983. And you can't but notice the similarities with his <a href=\"http://www.fontfont.com/shop/view_singles_main.ep?id=719\" target=\"_blank\" class=\"link-external\"> FF Schmalhans</a> too. <br> <br>\"Hans Reichel (born 1949) is a musician/inventor/composer as well as being a type designer. For 20 years he's made a name for himself as an accomplished acoustic and electric guitar player. He's also the inventor of the Daxophon (sic), an instrument where thin strips of wood are played with a bow to mimic animal sounds and human voices.\" <br> <br>More information on his musical endeavors can be found <a href=\"http://www.shef.ac.uk/misc/rec/ps/efi/\" target=\"_blank\" class=\"link-external\"> here</a>. <br> <br>FF Dax was his first release under the FontFont banner. Reichel also redesigned and expanded his popular Barmeno family for FontFont, but had to change the name to <a href=\"http://www.fontfont.com/shop/view_singles_main.ep?id=2665\" target=\"_blank\" class=\"link-external\"> FF Sari</a> to avoid being sued by the new owners of the Berthold Type library. <br> <br>Which in short means he doesn't own his creation anymore. Go figure.</p>"
