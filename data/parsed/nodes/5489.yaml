    html: |-
      <p>And now we have two "interpretations", one worse than the other, from Durotype and Canada Type.<br>
      Don’t know who was the "someone reputable" mentioned by Stephen, but I have been working very sporadically on a "philological" digital version for a few years, and I admit I am pretty disturbed by these bad quality "hacks", made without a care.</p>
      <p>If you have to reinterpret and use something as a basis, Kris Sowersby’s Karbon is a serious effort, not these.</p>
      <p>While I am at it, I just received FontShop's newsletter<br>
      In this statement:<br>
      «Aldo Novarese’s work for the Nebiolo Foundry in the 1930s led to several types that were rigid and modernist, but always designed the Italian way, with the hand and human proportion in mind. One such was Neon, the model from which Canada Type’s Patrick Griffin developed the Gala family.»<br>
      there are more errors than words. Very professional. :)</p>
