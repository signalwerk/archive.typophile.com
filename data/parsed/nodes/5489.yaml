    date: 2004-07-06T07:50:00
    date_raw: 6 Jul 2004 — 7:50am
    votes: null
    html: <p>I don't think it's based on any particular face such as Futura. <br>You can see bits of Erbar, Bernhard Gothic, Kabel, etc., in it, plus some unique features. <br>No Gill. <br>There were a lot of "mash-ups" in that era, as different type designers from different foundries from different countries did their own version of the look du jour, the geometric sans. <br> <br>It would be like saying that all present day sans serif faces that are slightly squarish, semi-condensed and open-fitted, with a 4-letter name, are versions of Meta, forgetting other sources like Quay Sans, and the general lettering aesthetic of the day. <br> <br></p>
    html_clean: <p>I don't think it's based on any particular face such as Futura. <br>You can see bits of Erbar, Bernhard Gothic, Kabel, etc., in it, plus some unique features. <br>No Gill. <br>There were a lot of "mash-ups" in that era, as different type designers from different foundries from different countries did their own version of the look du jour, the geometric sans. <br> <br>It would be like saying that all present day sans serif faces that are slightly squarish, semi-condensed and open-fitted, with a 4-letter name, are versions of Meta, forgetting other sources like Quay Sans, and the general lettering aesthetic of the day. <br> <br></p>
