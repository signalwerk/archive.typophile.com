    html: |-
      <p>Antonio has already made the corrections.<br>
      I add that Novarese never designed typefaces "rigid and modernist", and neither Butti, for what matters. The first efforts by Butti, dating from the 1920s, show a fascination with the sinuous forms of late-19th century letters, and he never designed anything "rigid".</p>
      <p>The first works by Novarese should be the Etruria series, from 1939 onwards, if I recall correctly. Ah, Stephen, I hope if someone chooses the Canada Type "reinterpretation" of Semplicità, he will dig deep. I would not do it.</p>
