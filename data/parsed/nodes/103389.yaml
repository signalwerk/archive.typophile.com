    html: |-
      <p>I've long thought that Italian's stroke contrast is too literally inverted - it's like a contrarian, irrational teenager. There must be room for designs with more judicious, purposeful stroke inversion - a mature, collected iconoclast. Ugly doesn't have to be stupid; and smart ugly often ends up redefining beauty.</p>
      <p>hhp</p>
