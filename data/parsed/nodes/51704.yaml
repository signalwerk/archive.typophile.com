  html: |-
    <p>Announcing the release of a set of 5 limited edition 'type art' screenprints.<br>
    I've used some of the best printers, paper and inks available.<br>
    Please visit <a href="http://www.seblester.co.uk" title="www.seblester.co.uk">www.seblester.co.uk</a> for full details.<br>
    In summary:</p>
    <p>'Mightier' - A2 signed limited edition of 75 only.<br>
    Metallic gold ink on black Plike, 160gsm.</p>
    <p>'Believe' - A2 signed limited edition of 50 only.<br>
    Red, black and a subtle bronze gold on Bright White Colorplan, 270gsm.</p>
    <p>'Mmm' - A2 signed limited edition of 50 only.<br>
    Red and black ink of Fabriano 5 Smooth, 300gsm.</p>
    <p>'Indelicate' - A2 signed limited edition of 50 only.<br>
    Gunmetal metallic silver ink on black Plike, 160 gsm.</p>
    <p>'Simple' - A2 signed limited edition of 200.<br>
    Black ink on Azure Blue Colorplan Smooth, 270 gsm.</p>
    <p>I've also updated my website with new illustration,<br>
    lettering and 'found type' photos.</p>
    <p>Thanks for reading,</p>
    <p>Seb Lester<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/SexyType_PR_4908.jpg"></div><p></p>
