    html: |-
      <p>CONNER seems close to Bank Gothic, but I do not know of a unicase version, as this seems to be.</p>
      <p>The blue script has three letters that needed to be found together: non-looping h, closed p, and this style 'r'. The font I found that was closest was <a href="http://new.myfonts.com/fonts/ef/ballantines-script/" rel="nofollow">Ballantines Script</a>, but it needs connectors.</p>
      <p>- Mike Yanega</p>
