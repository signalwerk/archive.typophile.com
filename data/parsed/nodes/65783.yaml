  html: |-
    <p>I'm currently building my portfolio up to apply at some art and design schools so I decided to create an identity for a fictional museum of art based in Mexico. I am now debating on the logo and have created several versions:<br>
    1. <a href="http://droplr.com/43FfS+" title="http://droplr.com/43FfS+">http://droplr.com/43FfS+</a><br>
    2. <a href="http://droplr.com/4yB6u+" title="http://droplr.com/4yB6u+">http://droplr.com/4yB6u+</a></p>
    <p>And I have now pretty much started over and come up with this (also attached):<br>
    3. <a href="http://droplr.com/8nkb4+" title="http://droplr.com/8nkb4+">http://droplr.com/8nkb4+</a><br>
    4. <a href="http://droplr.com/8nZ4Q+" title="http://droplr.com/8nZ4Q+">http://droplr.com/8nZ4Q+</a><br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Centro-de-Arte-4_4939.png"></div><p></p>
    <p>The "brief" for this project is to create an identity that would be a re-birth of a dying organization. It fails to attract the younger, sophisticated visitors it needs to remain open and fund services for the public. It needs to change its damaged image (no existing or marketed identity) and represent itself as something clean, modern and luxurious without losing its historical significance.</p>
    <p>I would greatly appreciate any honest critique. Thank you!</p>
