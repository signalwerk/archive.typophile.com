      <p>Sounds like <em>The Elements of Typographic Style</em> is the masterwork it was acknowledged to be, <strong>but</strong> one that has to be taken with a grain of salt. It is a rich mine of information, but it does not set the bounds for all that can be done in typography.</p>
      <p>A lot of classic reference works are like that, because time marches on.</p>
      <p>So, instead of criticizing the book itself, I would criticize its misuse, I would criticize professors who teach from it presenting it as dogma.</p>
