      <p>Hrant Papazian has commented here that the calligraphic tradition has too strong a hold on type design, so he may have some sympathies with the viewpoint.</p>
      <p>My view is that we should not dismiss alternate ways of designing type out of hand, but we also should not disparage the living tradition from Jenson onwards, as it is a fruitful source of type designs that are effective and appealing.</p>
      <p>Also, it is demonstrably false that the exploration of the non-calligraphic in type design has not yet begun. Bifur, Neuland, Peignot, Eurostile... it is true that the design of <em>text</em> typefaces is very conservative, but that is to be expected. And even there, we have Optima as one example of a design that is non-calligraphic in its strokes, even if its proportions are modelled on classic letterforms.</p>
