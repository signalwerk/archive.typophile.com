      <p>Although not qualified to comment on anything but the simplest level on this controversy, I finally looked at Sam Potts' piece.</p>
      <p>The fact that the first edition of Bringhurst's book came out in 1992 (as opposed to, say, 1950) already makes me less indulgent towards its focus on classic book typography - if it didn't inform the reader that it was specialized. A book written when advertising typography was not yet taken seriously might be expected to have such a focus without the author thinking of it as specialized.</p>
      <p>The example of "cycling = Italian" sounded funny indeed, but things may not be as bad as all that - if all contemporary Italian type designs, even oldstyle and transitional ones, were somehow influenced by Bodoni, then they might be lean in some sense. No, that's still pretty bad.</p>
      <p>But then Sam Potts provides an example of his own to refute Bringhurst.</p>
      <p>But here I found his logic flawed. People picking up an English translation of <em>Madame Bovary</em> do so to connect with Flaubert, despite their lack of facility with the French language; they are not trying to connect with the translator, however famous Lydia Davis may be.</p>
      <p>(Two books I am familiar with - <em>On the Sensations of Tone</em>, and <em>Intelligent Life in the Universe</em> do add something in their English translations - the first because the translator put in lengthy and very informative footnotes, the second because it combines a translation of Shklovskii's book with entertaining text by Carl Sagan. But this is the exception, not the rule.)</p>
      <p>The central point of the essay seems to be that the historical context of typefaces ought to be unlearned - we should see typefaces afresh when seeking to employ them, rather than having their previous historical context as a straitjacket - and Bringhurst advocates the opposite, to a ridiculous degree.</p>
      <p>That sounds sensible enough. Most readers do not know or care who Aldus Manutilus was - if a typographer only uses Bembo where the historical associations are right, he is doing so to impress his fellow typographers with his ability to avoid solecisms, rather than serving his clients.</p>
      <p>An introductory book about typefaces, of course, though, will teach its readers about all this historical baggage, with photos of pages from the <em>Hypnerotomachia Poliphilli</em> and Caslon's specimen sheet, and they'll tell us about the historical contexts of Futura and Helvetica as well. The mercantile era that gave rise to Century Expanded and Franklin Gothic, though, may get relatively short shrift, even if, hopefully, Goudy will get a positive mention. So Bringhurst fell victim to the temptation to tell the students that all this information they've been taught, because the teachers could think of nothing else to fill their textbooks with, is actually useful!</p>
      <p>At least, that's one way to look at it.</p>
      <p>The fact that the book is currently in its fourth edition didn't impress me favorably either. What does he think it is: <em>Computer Architecture: a Quantitative Approach</em>? But I suppose writers of textbooks for Arts subjects have to eat too, so they have to keep the students away from the used book market - and while science and technology march on, fashions change quickly as well, even if typefaces are more conservative than hemlines.</p>
      <p>But in his post, Sam Potts says that his original critique was that Bringhurst's book specifically fails at fulfilling its (stated?) purpose.</p>
      <p>If, indeed, it's as bad as he says it is - offering no substantive advice for choosing a typeface other than hoary clichés and stereotypes - then it would be hard for me to disagree. I will have to take a look at Bringhurst's book to see how true that is; I suspect that if it <strong>were</strong> <em>that</em> bad, it would never have acquired the reputation and even mystique that it (apparently) now enjoys.</p>
      <p>Where I disagree with the critique, though, is that while one may attempt to view a typeface with fresh eyes, one may <em>fail</em> in that attempt. One may not, upon one's first look, see everything about the typeface that will determine its effect on even the typographically naïve reader. And so what other people with typographical expertise have, through their experience with a given typeface, and their knowledge of its nuances, <em>and of the intent of the typeface's designer and the historical context in which it arose</em>, come to know of the totality of a typeface's mood and impact... is <em>not</em> without value.</p>
      <p>So, if Bringhurst's book <em>misused</em> the historicist view of type as claimed, the critique is valid - but to some extent, the critique also appears to claim that the historicist view of type valueless. Even at this point, I can say that this is going too far.</p>
    html_clean: |-
