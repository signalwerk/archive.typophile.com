      <p>I’ll take up Potts’s points in order.</p>
      <p>Bringhurst serves as author, editor, and designer, and the work suffers from lack of oversight from a real editor as well as a copyeditor. Potts does not mention this, but the book is full of typos. Things that spell-check would catch. Bringhurst apparently compiles his own index, and in some cases has failed to update it to reflect changes to the text in the newest version. (The index tells you you'll find W.B. Yeats on 189, which is no longer true.) And of course the editorial structure of the book is, and always has been, a little strange. I do agree that a trained nonfiction editor could do wonders for the structure and general clarify of the book.</p>
      <p>I also agree that Bringhurst wrongly puts authorial and editorial decisions in the typographer's hands. Certainly no book designer in the real world (as opposed to Bringhurst's pleasantly self-sufficient one-man operation) ever got away with changing all the dialogue markers from quotes to em dashes. If he is going to argue for a specific editorial style, he might at least point out that he is discussing editorial, not strictly typographic, matters.</p>
      <p>I would also like to note that Potts’s discussion of the complexity of choosing type is largely spot-on. Of course this journey depends on more than static historical and cultural associations. And of course designers can redefine the connotation of a face by using it in a new way. But this idea is not foreign to Bringhurst. “Books that leap historical boundaries and mix historical subjects can pose complex and exciting typographic problems” (6.3.2, p 99).</p>
      <p>Now to where I diverge with Potts, which frankly is on most of his very well written essay. I’ll address a few points in Potts’s order:</p>
      <p>I don't know where Potts gets the idea that ETS is a book that "everyone owns but few have read." Prove it! I have read the book straight through, including all the appendixes and the daunting chapter on page proportions, many times, in at least three editions. It's hard to imagine that the many typographers who love this book and continually recommend it are not, in fact, extremely familiar with its contents. I have several bookshelves full of works on typography, recent and not so recent. I return to none of them as often as I do ETS, simply because as far as I know there is no other book that is up to Bringhurst’s standards of scholarship, discernment, and sophistication.</p>
      <p>Potts asks if ETS is meant to be “a proper style guide somewhere on the Elements of Style – Chicago Manual spectrum.” The Elements of Style is not a style guide at all in the sense that CMS is. Strunk &amp; White is a book of guidelines for writers — journalists, actually. CMS is a true editorial style guide, and better compared with the New York Times or Oxford style guides. CMS, however, certainly has its moments of typographic stupidity and ignorance. The editors of CMS know a lot less about typography than Bringhurst does.</p>
      <p>I do not disagree with Potts’s categorization of Bringhursts’s editorial advice as non-standard and ill-advised. Actually I found it amusingly accurate. However, Potts says, “ETS promotes nonstandard, antiquated, and otherwise ill-advised techniques that are out of place […] in mainstream American book and magazine publishing.” Bringhurst isn’t American. It’s not at all clear to me that he even intends to be writing for a primarily American audience. Much of his advice that seems bizarre to us — spaced en dashes; dashes for dialogue; etc — is the standard style in Canada, Britain, and elsewhere in Europe and beyond. The long em dashes are an American thing (a Chicago thing, actually). We’re the odd ones out, and since the book isn’t for us specifically, accusing Bringhurst of being ignorant of American style kind of misses the point.</p>
      <p>One more note: no typographer would use “Find &amp; Replace” to implement Bringhurst’s advice about borrowing characters from other fonts. The standard way in InDesign would be with GREP styles, or by copying the characters into the actual font file.</p>
      <p>And now, the “purple prose.” Let’s get one thing straight: Bringhurst is first and foremost a poet. His poetry has received many awards and honors. Check his Wikipedia page and see the list of previous publications at the front of ETS. He is a tremendously skilled writer, a wonderful counterexample (sadly, one of very few) to the stereotype that designers can’t write. Does he overdo it sometimes? Yes. However, there are sections of ETS that beg to be reread simply for the subtle beauty with which Bringhurst expresses an uncommon idea. E.g.:</p>
      <p>“Some observers are dismayed and some excited by the complexity of the equipment most typographers now use. Some are excited and others unnerved by the power of that equipment and its evident ease of operation. Yet inside of that complexity, typography persist as what it is: the making of meaningful, durable, abstract, visible signs. When the system crashes, the craft, its purposes, its values and all its possibilities remain” (9.6.2, p 197). This passage is made all the more poignant by its placement at the close of a chapter about technology. What he leaves us with is a reminder that it’s not about the technology.</p>
      <p>(As a side note, the discussion of font formats in ETS 4.0 got decidedly more muddled compared to previous editions. Bringhurst seems to be making an attempt to be more pedantically precise, at the expense of conceptual clarity.)</p>
      <p>“Typography doesn’t need this kind of dressing up,” says Potts, referring to Bringhurst’s prose style. “Typography is already an inherently noble pursuit.” Um, sure, but Bringhurst’s readers, for whom this may be their first introduction to typography, will not know that yet. If he is aiming to teach (and I do believe he is; I find the book to be very generous and warm, not in the least a “polemic”), then why shouldn’t he point out what is already obvious to the experts? His readers are not experts yet.</p>
      <p>“I certainly recognize that Robert Bringhurst may assert whatever taste he prefers” says Potts. And he is in good company. The original Elements of Style was largely a collection of William Strunk’s personal bugbears and highly questionable advice — much of which he ignores himself. As discussed above, neither book is meant to be a “style guide” the way that CMS is. Which is to say, neither book was ever meant to be neutral. If the author had no point of view, what would the book be contributing to the field? (And Bringhurst’s sometimes questionable outbreaks of opinion are nothing compared to those in, say, anything by Gerrit Noordzij. They remind us that we’re learning from a real human being.)</p>
      <p>At this point I’d like to ask Sam Potts what book he would recommend as an introduction to typography.</p>
      <p>Because there are topics that Bringhurst covers that no other contemporary introductory typography text even touches on:</p>
      <p>1. Bringhurst’s brilliant argument for the importance of diacritics as a gesture of cross-cultural acceptance and diversity (5.5.1). And the corresponding index of characters — a tremendously useful reference unlike anything in any other typography book (short of The Unicode Standard, which is obviously [a] not an introductory text and [b] devoid of any useful information on the characters contained therein).</p>
      <p>2. The exhaustively researched second half of the book, including the type specimens and appendixes of type designers and foundries.</p>
      <p>3. Chapter 8. Isn’t it amazing the number of typography textbooks that don’t even mention this most important aspect of laying out any work of typography? (And if, as Bringhurst acknowledges, budget often prevents designers from being able to choose arbitrary page sizes, so what? Isn’t it nice to be reminded of what we could be striving for, rather than having the less-than-satisfactory limits on our creativity enforced by a style book?)</p>
      <p>4. The many discussions of multilingual typography. Again, find me another basic typography text that addresses concerns associated with mixing alphabets on the same line. Chicago in particular does nothing to help, mixing completely incompatible typefaces in its samples of multilingual typography.</p>
      <p>5. Bringhurst’s type classifications by art movements is the only system for understanding typographic history that makes any sense to me, and is at all compatible with broader understandings of art and craft history. I cannot take any book seriously that calls Jenson “old style” and stops there. Old compared to what? It’s not old compared to Trajan. The oft-used taxonomy is too coarse, and the names too arbitrary, to be useful. Bringhurst manages to shed some much-needed light here.</p>
      <p>Lastly, Mr. Potts objects to Bringhurst presenting typography as a moral concern. Go Bringhurst. If you don’t care about your craft, if you don’t think that you’re making the world a little better, a little more beautiful, by doing what you do, then why are you doing it? Wouldn't we all like to be so confident in the morality of our craft.</p>
      <p>(A note on a note: Bringhurst would not object to the abbreviation ETS. He uses it himself, on the spine of the paperback edition.)</p>
