      <blockquote><p>Typography is necessarily an evolving medium — just as painting and language are.  ...</p></blockquote>
      <p>I disagree.</p>
      <p>As in other fields, there are standards and conventions for generally accepted "good" typography, evolving or not. Web typography, for example, should be 'evolved' out of book design; yet, it is still (2014) decidedly sub-standard.</p>
      <p>Also, as in other fields, there are accepted ways to "break the rules" <em>as well as</em> a plethora of reasons <em>not</em> to. Sticking religiously to Bringhurst's rules will not make you a bad typographer; subverting or inverting as many as you can <em>will</em> -- unless you are an exceptionally gifted artist.</p>
