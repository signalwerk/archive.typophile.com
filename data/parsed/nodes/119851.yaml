      <p>Oh my, I see above that very accomplished Mr. Montalbano thinks I will defend <em>Elements of Typographic Style</em> as the whole Bible or at least the five books of Moses. Not actually. As I wrote long ago in a review on Typophile.com—I think that feature has been dropped—I think the book is an excellent discussion of classic book typography. (I haven't looked at it since the second edition, so I can't comment on later ones.) However, a lot of typography is not book typography, including magazines and advertising and posters and on line typography etc., signage, etc., and these have different demands and call for different approaches. </p>
      <p>Books have distinctive demands. For a start, they stay around for a long time, and stuff that looks fresh and delightful this month may look bad in five years. If it's a magazine, doing something wild and crazy might be very good, depending on its audience. But in a book such fun and games would look forced and tiresome. Also books generally are very text-heavy, with less illustration and display, and that generally calls for a quieter style. Because of these factors—text heavy and long lasting on library and home shelves—book typography tends toward the classic and conservative in style of interior design. My main beef with Elements is that it doesn't make clear that classic book typography is often out of place in other contexts. Also Bringhurst admittedly does take himself too seriously. But he is brilliant, insightful and sensitive. And the elements of making a readable text block and page do transfer to a lot of other contexts. So I suspect it's still a very valuable book—but holy writ, no. </p>
      <p>I wrote that review long ago, and have since read <em>Book Typography: A Designer's Manual</em> by Mitchell and Wightman (2005), which I think is even better as a guide to classic book typography. It has the advantage of a clear focus, and goes into issues on books in particular that Bringhurst didn't, at least in earlier editions.  </p>
      <p>I haven't looked at other recent competing books, such as Lupton's and Mittendorf's and Highsmith's, so I can't comment on those. For an example of something with a completely different approach, I am now reading another classic, <em>Thoughts on Design</em> by Paul Rand. Its emphasis is advertising and corporate identity, and is brilliant, but has almost nothing in common with Elements. But to me they don't contradict as they are about typography with every different purposes.  I think Sam Potts' review is marred by not "getting" that Bringhurst is talking about a kind of typography that does have its place, even though its classic taste and approach is misplaced elsewhere.</p>
