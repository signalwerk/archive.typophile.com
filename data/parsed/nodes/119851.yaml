      <p>With thanks to Craig for mentioning my review, I'll admit my views have shifted closer to Potts's since I wrote it. That's not to say I wouldn't still recommend reading ETS, just that I'm seeing more parallels between Bringhurst's book and, to pick a notable example, Jan Tschichold's views on typography than I did in the past. It's not so much that ETS is a polemic, but rather that, on further reflection, I think Bringhurst doesn't distinguish between recognizing the moral/ethical significance of good design, on the one hand, and moralizing, on the other. Noordzij, whatever else you want to say about him, doesn't demand to be believed, only taken seriously (as he said in the first issue of <em>Letterletter</em>, the Hartley &amp; Marks anthology of which is coincidentally introduced by none other than Bringhurst). Bringhurst, like Tschichold, is less generous a critic. And the arguments you can have with him are less illuminating than the ones you can have with Noordzij. Wouldn't you rather argue over when the word was invented than over whether you should insert hair spaces around an em dash or not?</p>
      <p>On the other hand, I do rather like Bringhurst's metaphor of starving horses milling in a field. And more substantively, it was exciting to read his book when I was getting started as a designer, because it was great to see someone taking something that I loved seriously. But I'm not sure it helped me as much as reading, say, Erik Spiekermann or Jan Middendorp or Hans Peter Willberg &amp; Friedrich Forsmann would have done at the time, and I'm glad I did encounter them after. And I will never assign Bringhurst to my students in an intro type class; better to give them Middendorp's <em>Shaping Text</em>, Spiekermann's <em>Stop Stealing Sheep</em>, Cyrus Highsmith's book on microtypography, and maybe Felici. If I'm ever fortunate enough to teach in a program that offers a typography seminar &amp; practicum--probably for grad students--I'd assign Bringhurst along with Tschichold, Aicher, Schmid, Ruder, Noordzij, and Gerstner. And I'd recommend people read Bringhurst's essays on writing, like <em>The Solid Form of Language</em>, <em>The Tree of Meaning</em>, and <em>Everywhere Being is Dancing</em>.</p>
      <p>On the other hand, maybe I'm just mad that four editions in, Bringhurst still doesn't think Arnhem merits inclusion in his favorites list. :)</p>
