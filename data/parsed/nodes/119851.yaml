      <p>I don’t think Potts’ comparison with old Hollywood is apt.</p>
      <p>Thing is, if you want to understand why typography is “hard-wired” the way it is—and by that I mean the way that state-of-the-art high-tech font glyphs are designed for OpenType features that are standardized and implemented in the relationship between fonts and layout applications—then you have to understand classic typography, as explained by Bringhurst.</p>
      <p>If this old stuff weren’t still relevant, new fonts wouldn’t have all the OpenType bells and whistles they do.<br>
      Or are we just providing stuff almost nobody needs?</p>
