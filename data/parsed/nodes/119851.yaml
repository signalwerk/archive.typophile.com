      <p>TEoTS is a flawed book that comments on a very small piece of the typographic universe and believes it extrapolates its commentary to the entire field. I have never seen any advice on advertising or editorial typography in this tome. I've heard the author speak several times, and remain unimpressed. His lectures contain lots of complaining about this and that and as someone once described him, "My, he seems to be impressed with the sound of his own voice."</p>
      <p>Once the the holidays are passed I'm sure Bill Berkson will come to the author's defense. He always does. Is typographic bible the correct term Bill? Or perhaps the typographic Torah.</p>
