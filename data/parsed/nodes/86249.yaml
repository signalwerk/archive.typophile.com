    <p>Hey gang! Like last year, I'm again on the coordinating committee for this and thought some of you would be interested:</p>
    <p><em>This October 15-23, 2011 marks the second annual Design Week / LA, an annual celebration of design that inspires and brings together Los Angeles' abundant and vital design communities. Showcasing more than two dozen distinct events, Design Week / LA promotes a wider awareness of design through initiatives and programming that highlight the richness and diversity of design activities happening throughout Los Angeles.</em></p>
    <p><em>The annual celebration features programming by a wide variety of Los Angeles design organizations and institutions with a focus on design workshops, exhibitions, historic and modern architectural home tours, lectures and more. Design enthusiasts and design professionals will have an unprecedented opportunity to share in the broad achievements of Los Angeles' varied design communities throughout the week. By fostering this increased dialogue and engagement across professions and disciplines, Design Week / LA seeks to enhance design advocacy within both the profession and the broader community.  </em></p>
    <p><em>The Design Week / LA presenting partners are the Los Angeles chapters of the American Institute of Architects (AIA); AIGA, the professional association for design; the Industrial Designers Society of America (IDSA); the Interaction Design Association (IXDA); and The Society of Environmental Graphic Designers (SEGD). Supporting partners include the A+D Museum; Center for the Study of Political Graphics (CSPG); de LaB; KERNSPIRACY; Pasadena Museum of California Art (PMCA); SAGA; and CSUN's Center for Visual Communication (VISCOM). Design Week / LA has been organized by Spencer Cross, Jimmy Moss, Chris Becker, Truck Torrance, and Zelda Harrison, with logo design by Jane R. Lee Design and additional web development by Jenn de la Fuente, Rosebud Designs.</em></p>
    <p><em>For more information or to submit an event of your own, visit the Design Week / LA website, <a href="http://www.designweekla.org" title="www.designweekla.org">www.designweekla.org</a>, or follow Design Week / LA on <a class="freelinking external" href="http://www.facebook.com/designweekla" rel="nofollow">Facebook</a> and <a class="freelinking external" href="http://twitter.com/#!/designweekla" rel="nofollow">Twitter</a> for complete up-to-the-minute information.</em></p>
