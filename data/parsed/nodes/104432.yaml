    html: |-
      <div class="comment-spam-body"><p>The letters above are single instances of the entire company's name and sub-title. Many of the letters above are repeated multiple times (c, o, i, r).</p>
      <p>My best guess at this point is that it's actually Arial Narrow Bold, scrunched down to roughly the natural x-height (to essentially make a "wide" version of the type), and then poorly retraced from a low-resolution jpg version of the logo, likely taken straight from the corporate web site. I'm not dealing with a client who has a history of valuing properly-handled or executed artwork. They have several different "versions" of the logo in active use, using completely different typefaces, and they don't seem to see any differences between them. The type samples above come from what they have declared to us was "the official logo."</p>
      <p>The crossbar of the H and the bottom bowl of the R and P were what tipped me off to it being a scrunched manipulation of a narrow case. The curvy leg of the R seems to be a custom element. Whether intentionally drawn that way, or just a clumsy evolution from multiple re-tracings I can't really say at this point.</p>
      <p>What do you guys think? And thanks again for the responses. Much appreciated.</p>
      </div>
