    <p>Hello Typophile community! Long-time listener, first-time caller, yada yada.</p>
    <p>I could really use some help identifying this....well, ugly typeface. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typespecimen_4346.jpg"></div><br>
    It's the logotype of a client of mine (words scrambled to protect their identity). I'm doing a marginal "refresh" on the company's brand. However, not only are they refusing to let my company select a new typeface for them, they can't even tell us which typeface we can't change. Since they have no idea.<p></p>
    <p>I've been racking my brain and going through the usual online channels (identifont, etc.), but no luck. I was really hoping someone here might be able to help.</p>
    <p>For clarification - the specimens you see before you are all the characters I have to work with. No lower case, no punctuation. </p>
    <p>Thank you sincerely in advance for any clues.</p>
