    html: "<p>I can't live without my spiky curls! Very nice direction. <br> <br>The one tricky thing in this situation is something I encountered when making Domination Available: when you try to adapt a \"normal\", rigid design into something much more organic, it's difficult to decide what changes and what stays. The feeling I got was that to do the task properly you really have to redraw the new forms from scratch (even if you want to maintain some rigidity), otherwise you end up with a mish-mash - which is however fine if that's the effect you want! <br> <br>hhp <br></p>"
