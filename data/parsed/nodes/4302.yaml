    html: "<p>Ole, <br> <br>Just a couple of things I noticed, from a non type designer perspective: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/33634.gif\" alt=\"\"> <br> <br>1.  This hairline is inconsistent with the rest of your design's weight. <br>2.  Also too slim, but this whole feature seeems out of character.  The \"J\" is nothing but smooth curves, apart from the spiky features, and this is not smooth. <br>3.  This looks like a distressed bezier, which it is.  Once again, out of character.  You might try matching the curve of the b's crossbar instead. <br>4.  The way this fleureon connects seems inconsistent with the other ones. <br> <br>I hope this helps.</p>"
    html_clean: "<p>Ole, <br> <br>Just a couple of things I noticed, from a non type designer perspective: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/33634.gif\" alt=\"\"> <br> <br>1.  This hairline is inconsistent with the rest of your design's weight. <br>2.  Also too slim, but this whole feature seeems out of character.  The \"J\" is nothing but smooth curves, apart from the spiky features, and this is not smooth. <br>3.  This looks like a distressed bezier, which it is.  Once again, out of character.  You might try matching the curve of the b's crossbar instead. <br>4.  The way this fleureon connects seems inconsistent with the other ones. <br> <br>I hope this helps.</p>"
