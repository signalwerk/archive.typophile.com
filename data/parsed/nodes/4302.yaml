  html: <p>I wanted to use one of my all time favorite fonts Fedra for a new catalog job for Buddha Jewelry. B.J. is an importer/designer/distributor of organic (bone, wood, shell, etc) tribal jewelry mostly mfg. in Bali.  <br>So I decided to design a Caps version based on Fedra.  <br>Here are some of the first glyphs. <br> <br><img src="http://www.typophile.com/forums/messages/29/33557.jpg" alt="tribal"></p>
