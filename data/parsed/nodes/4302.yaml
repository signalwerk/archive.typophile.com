    html: <p>Good points. the hardest part of this design is time. I basically have less than a week to do the whole thing as client needs it for tradeshow may 1st. in a offset printed in a catalog that is underways. to make things a bit more complicated client is in Bali until we go to print April 23.  <br> <br>The concepts that I am working with are hard to explain. <br>Let my try anyway, Tribal jewelry is often used in rites of passage and is often applied through ritual with a shamen, it is often very painful to the point of ecstacy, example genital piercings. Somer shapes that were later scrapped are actual based erotic carvings from bali and indonesia. <br>I stated to think about how this could be translated into type?  <br>Historically speaking, I thought the most extreme times in history (with reference to sex) would be Roman and Victorian times (Victorian being all forbidden). Jump forward to 2004. <br>Why do people get piercing and wear this type of jewelry? <br>To be interesting so they can get laid, for a spiritual type of mission, and for plain adornment. Again how can this be transformed into type. Example above tkaes it there, Exuberant  <br>decoration with flourishes, spiky representing the tribal piercing aspect, and the shapes are similar to actual products being sold.  <br>Forgive my gibberish but I have been up too many hours this week. <br> <br> <br>  <br> <br>On spefic suggestions from Daniel <br>too thin? I agree a bit weight would make it more consistant. <br>fleuron on bottom was supposed to look like a curled extention of the thinner bar on the outside of the J. this worked much better in single colr. With color this seems to not work as well especially since it s two colors of high contrast. </p>
    html_clean: <p>Good points. the hardest part of this design is time. I basically have less than a week to do the whole thing as client needs it for tradeshow may 1st. in a offset printed in a catalog that is underways. to make things a bit more complicated client is in Bali until we go to print April 23.  <br> <br>The concepts that I am working with are hard to explain. <br>Let my try anyway, Tribal jewelry is often used in rites of passage and is often applied through ritual with a shamen, it is often very painful to the point of ecstacy, example genital piercings. Somer shapes that were later scrapped are actual based erotic carvings from bali and indonesia. <br>I stated to think about how this could be translated into type?  <br>Historically speaking, I thought the most extreme times in history (with reference to sex) would be Roman and Victorian times (Victorian being all forbidden). Jump forward to 2004. <br>Why do people get piercing and wear this type of jewelry? <br>To be interesting so they can get laid, for a spiritual type of mission, and for plain adornment. Again how can this be transformed into type. Example above tkaes it there, Exuberant  <br>decoration with flourishes, spiky representing the tribal piercing aspect, and the shapes are similar to actual products being sold.  <br>Forgive my gibberish but I have been up too many hours this week. <br> <br> <br>  <br> <br>On spefic suggestions from Daniel <br>too thin? I agree a bit weight would make it more consistant. <br>fleuron on bottom was supposed to look like a curled extention of the thinner bar on the outside of the J. this worked much better in single colr. With color this seems to not work as well especially since it s two colors of high contrast. </p>
