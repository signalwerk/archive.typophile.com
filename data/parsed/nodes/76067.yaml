    <p>Just for fun, I was trying to set a downloaded free book with Gentium Plus. If I print it at all, it would be on A4.</p>
    <p>I probably didn't notice a ton of issues, so any comments are welcome. One thing I did notice though: The second and third paragraphs on the RHS start while we're still at the drop cap. The way I did it now, there's actually no paragraph indent, but an extra indent there seems silly as well. How is this usually solved?</p>
    <p>Henk</p>
