  html: |-
    <p>Hi guys,<br>
    i'm about to work on some visual stuff for a company selling car equipment. I want to design a logotype based on some kind of racing typography but because this is something unusual for me (i'm more into DIN-style typo) i didn't find enough fonts which would match my idea because it should be something motoristic (racing style - see attachment) on one hand but also modern (designed like eg. <a href="http://subtype.org/">http://subtype.org/</a> and these modern looking fonts) as well... </p>
    <p>I would be more than grateful for your suggestions. </p>
    <p>Thanks a lot,<br>
    gonee</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/racer.png" width="400" height="300" alt="">
