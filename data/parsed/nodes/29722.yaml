      <p>the <a href="/wiki/Double%20crown%20club" class="freelinking" rel="nofollow">Double crown club</a> was a club formed around 1932 by <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a>, alongside <a href="/wiki/oliver%20simon" class="freelinking" rel="nofollow">oliver simon</a>(<a href="/wiki/curwen%20press" class="freelinking" rel="nofollow">curwen press</a>) <a href="/wiki/Bernard%20Newdigate" class="freelinking" rel="nofollow">Bernard Newdigate</a> (<a href="/wiki/shakespear%20head%20press" class="freelinking" rel="nofollow">shakespear head press</a>) , <a href="/wiki/gerard%20Maynell" class="freelinking" rel="nofollow">gerard Maynell</a> (<a href="/wiki/westminister%20press" class="freelinking" rel="nofollow">westminister press</a>) <a href="/wiki/Francis%20Maynell" class="freelinking" rel="nofollow">Francis Maynell</a> (<a href="/wiki/nonesuch%20press" class="freelinking" rel="nofollow">nonesuch press</a>) , <a href="/wiki/Wren%20Howard" class="freelinking" rel="nofollow">Wren Howard</a>, <a href="/wiki/Jonathan%20cape" class="freelinking" rel="nofollow">Jonathan cape</a>, and more. came accross this info in the Thames and hudson typography manual, havent found much more info about the group<br>
       lou</p>
