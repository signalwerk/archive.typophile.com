    html: |-
      <p><cite>they are both descenders and ascenders, which creates a leading problem.</cite></p>
      <p>A long descender that reaches into the next line is of course a problem. But a letter that both descends and ascends? Lowercase "j" does that in English all the time, and no one seems to have noticed any problem...</p>
      <p>Ah. Since we're dealing with Hebrew, ascenders of <em>any</em> kind are a problem, with or without accompanying descenders, because one is referring to ascenders above cap height, not ascenders above x-height, of which there isn't any.</p>
