  html: |-
    <p>I've stumbled upon this hebrew type called "Ktav", which is now marketed via Palron &amp; Fontype. it's not impressive untill you understand it's qualities - a good cursive hebrew font with interesting and unique ending letters, rounded structure, and a general graphic language of an ink-written hebrew cursive letters, probably inspired by an actual hebrew cursive sample. </p>
    <p>i searched for some info on the designer and found nothing. but i did found an early type sample from palestine (nowadays israel),1922, which featured this font in small sizes for letterpress. so this type was probably designed before 1922.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Untitled-1_3424.jpg"></div><p></p>
