    <p>I am wondering what font this is<br>
    It’s a close up of Patrick Bateman’s business card in American Psycho,<br>
    In the book/movie, they call it Cillian Rail.<br>
    The numbers look close to Georgia, but there is a serif at the bottom of the 2 that is not there in Georgia.<br>
    <a class="freelinking-external" href="http://img.photobucket.com/albums/v188/edimusprime/PatrickBatemanBC.jpg">http://img.photobucket.com/albums/v188/edimusprime/PatrickBatemanBC.jpg</a></p>
    <p>Thanks</p>
