    <p>Hi</p>
    <p>I've searched everywhere for some good answers on why so many fonts are "badly" named. But found no good answers, so I hope the experts here can put some light on this issue :D</p>
    <p>When using a font manager a lot of fonts do not group into families. This has been very annoying for me over the years. Thanks through this forum I found some help on how to change the names so the fonts show up in a more convenient way. I used TTX and the book O´Reilly - Fonts and Encodings as reference. It was tedious work, so I only changed some favorites. Yes DTL OTMaster would probably be a much faster way but it was to expensive.</p>
    <p>I found out that many fonts are named [Name] [Weight] and some are even named [Name] [Weight] [Style] in every name ID filed. That results in very long lists (almost no grouping) in any font manager and a lot of clicking when using the fonts in for example InDesign. Instead of using the drop down for the font you are using you also have to jump between different sets of the same family.</p>
    <p>I wonder why are so many fonts named in this way?<br>
    Tradition?<br>
    A result of automated converting?<br>
    Why not just name them [Name] and then style, weight, etc under the designated<br>
    ID field?<br>
    For backward compatibility?</p>
    <p>This is very annoying to me, non logic, cluttering, not following technical design standards and resulting in more work when using them.</p>
