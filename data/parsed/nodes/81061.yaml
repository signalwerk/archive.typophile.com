    html: <p>Contemporary fonts contain several different name sets that are compatible with different versions of various software. The Windows 4-style family is only one of those name sets, it just happens to have been around longer than most of the other name sets, but really there's no reason to think of it as the basic naming any more than any one of the other name sets, and I can imagine future font tools relegating this to a legacy, backwards-compatibility set. FontLab already goes part way to doing this by enabling one to view the Fonts panel contents by either 4-style or OT name set. Once the 4-style family ceases to be the default naming set in the Font Info panel too, it will be easier to think about names in fresh ways. Note that even Microsoft have moved on from the 4-style family in DWrite, although the 4-style family is obviously going to remain an important support issue for some time to come.</p>
