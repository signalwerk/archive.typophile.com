      <p><em>Amazing that Microsoft has messed up even this.</em></p>
      <p>Says who? Microsoft began--and remains primarily--an business-oriented operating system. As such, pigeonholing font choices to those most likely to be used in business applications--regular, italic, bold and bold italic--makes perfect sense, and needs not apologize. With the advent of Windows 2000/NT4--with native support for PostScript fonts--Windows encroached on the Macintosh's traditional territory (graphic design) so effectively that Apple rather quickly abandoned its dead-end "classic" OS. And, just recently, Apple abandoned its "superior" Motorola architecture, switching to Intel processors. An old Mac Addict bumper sticker slogan proclaimed, "Intel inside, idiot outside." Oops. Hell, even Adobe finally gave up on its disinformation campaign against TrueType (developed jointly by Apple and Microsoft, a fact which amazed many hardcore Mac fans) and surrendered to the inevitable. CFF fonts have PostScript Type 1 outlines, but they're package inside a TrueType wrapper.</p>
      <p>The point is, things change. Anyone want to buy a Jetson-style OS 9.3 iMac?</p>
