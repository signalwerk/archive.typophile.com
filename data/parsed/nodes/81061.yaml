      <p>The reason for including the style in the font name field is to ensure consistency of name, and correct appearance of the font, between different applications. Otherwise, there are too many different interpretations of the many font name fields.</p>
      <p>This problem is fundamental to digital fonts, enshrined in Microsoft's original sin of defining a typeface family as four styles only.</p>
