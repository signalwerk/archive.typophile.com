    <p>I'm regularly stumbling upon websties which are using webfonts from which I certainly know that they are not available for web-licensing yet. Or in other cases I see poorly rendered versions of iconic typefaces and the CSS tells me that this must be FontSquirrel outputs.<br>
    How should I address this problem? Playing police and reporting this to my type-design colleges?<br>
    (I might do that, if they are my direct friends or employers, but for the rest I don't like to be this guy.)</p>
    <p>Shouldn't there be a kind of blacklist where such websites can be submitted?<br>
    If interested in hunting violation, foundries could browse through it themselves.<br>
    This might also create some awareness under web-developers who mostly are not interested in such "boring" details but rather discuss workarounds:<br>
    <a href="http://stackoverflow.com/questions/4905932/font-face-blacklisted-font" title="http://stackoverflow.com/questions/4905932/font-face-blacklisted-font">http://stackoverflow.com/questions/4905932/font-face-blacklisted-font</a></p>
