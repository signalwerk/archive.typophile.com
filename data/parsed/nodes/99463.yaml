      <p>@ewalthert:<br>
      <cite>(I might do that, if they are my direct friends or employers, but for the rest I don't like to be this guy.)</cite></p>
      <p>I am puzzled by this sentence, and I attribute the issue to English not being your first language.</p>
      <p>You appear to be saying that if a friend of yours was using a font on his web site without proper licensing, you would not have too much of a problem with reporting the fact to the font owner, but if you saw an infringing face on a stranger's site, you would not wish to get involved.</p>
      <p>I would think that if a friend of yours was using an infringing face, instead you would contact him directly, inform him of what might be an honest mistake on his part, and help him to cease infringing - whereas I know I wouldn't hesitate to report an infringement to the victim if I saw it on, say, a commercial site that should know better.</p>
      <p>As for Font Squirrel, their web page claims that they "scour the Internet" - with human involvement, not just in a purely automated fashion - to search for fonts which are legally free of charge, licensed for commercial use without payment. If this isn't true, the unfortunate people who believed that claim are not the really culpable infringers.</p>
