      <p>Yes, but in this particular instance, Titillium is a free font. To continue your awful car analogy, if someone gives you a car for free, are you going to make him or her pay for the service when something goes wrong? I agree that if you buy a font with a commercial license that does not allow modification, then it should work out of the box. I also agree that this does not always happen, and I agree that type designers, if they want to maintain reputations as producers of quality work, should be obliged to fix whatever problems there are. Most do fix these problems when asked. However, you should not expect the same out of the designer of a free font with a license that allows modification.</p>
      <p>This is how the free market works. What does this person who gave you their fonts for free stand to gain from fixing a bug, or lose from not fixing it?</p>
