      <p><em>As with most free fonts, you simply get what you pay for. Complaining seems pretty pointless to me.</em></p>
      <p><strong>Au contraire.</strong> Sometimes with free fonts you get more than you pay for, and sometimes with paid-for fonts you get less than you paid for. I don't care if it's a paid-for or a free font. If it does not work is should be fixed or removed. Of the more than half-dozen paid-for fonts that would not work as downloaded, generally the vendor corrected the problem; some slowly, some begrudgingly, and some gladly. At least one I had to fix myself.</p>
      <p>I recently downloaded the free font <strong><a class="freelinking external" href="http://www.woodardworks.com/type27.html" rel="nofollow">Veggieburger</a></strong> and had a problem with it. The designer acknowledged the problem and said he was unaware of it; within hours, he fixed it and emailed me the corrected font. Better service than I've ever gotten from a designer or vendor for a paid font with a problem. A class act.</p>
      <p>When I wrote to Jos Buivenga about Fontin, he was kind enough to reply, and he agreed with me, but said he didn't have the time to fix it. Fair enough.</p>
      <p>Let me try to be clear about my position. I'm not "negative" on free fonts. I'm not "negative" on paid-for fonts. I love fonts that work. I hate fonts that don't work. I love people that accept responsibility for their work. Do I expect tons of "free" service from makers of free fonts? No! Do I expect type designers who charge for their fonts to give me a font that works out of the box? Absolutely! Does that always happen? Absolutely not.</p>
      <p>I'm getting sick and tired of type designers and typophiles who piss and moan about people who want free fonts, and then, usually in the same breath, defend type designers who charge for their fonts when they don't work by saying "Sh*t happens." If I'm paying good money for what I expect to be good fonts, sh*t shouldn't happen. That should be the difference between professionals and amateurs. The high and mighty who think they can charge for fonts and deliver fonts that don't work should get off their high horse. Some free font designers put you to shame.</p>
