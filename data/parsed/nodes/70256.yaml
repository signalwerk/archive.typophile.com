      <p>Maybe this should be a different post.</p>
      <p>I think complaining about a gift is not very nice. </p>
      <p>I will not mention names here, but in the last six month a clients of mine licensed some font from two different smaller foundries. One foundry also had the naming set the “Titillium” way, so in Word only the Black Italic was functioning. It took a lot of time and effort to get good fonts, since they first claimed the fonts were okay in Adobe CS.</p>
      <p>The other foundry delivered fonts that didn’t work well with Universal Type Server. They knew about this problem, but blamed UTS. The designers wanted to use the font, but couldn't. The EULA states no modification etc. etc. etc, and the foundry claims that the fonts are 100% okay.<br>
      So my moral question would be; to fix or not to fix the fonts in this case??</p>
