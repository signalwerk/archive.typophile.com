    html: <p>1.	Select a text frame, or click anywhere in the story.  <br>2.	Choose Type &gt; Story. <br>3.	Select Optical Margin Alignment. <br>4.	Select a font size to set the appropriate amount of overhang for the size of type in your story. For optimal results, use the same size as the text.</p>
