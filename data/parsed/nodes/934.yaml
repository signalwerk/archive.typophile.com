  html: <p>These two fonts are called Reporter Light &amp; Bold on the CD. Note the midlevel crossbar on the f &amp; t. <br> <br>The bold variant has ink traps in the M,N,V &amp; W. In the M, especially, these traps are really deep and yield the ugliness seen in the image. Happens in (inkjet) print as well. I assume the typeface hails from pre-digital days then, correct? I'm not sure why the bold g looks distorted. It's not like that really. I'll have to open it up in my font editor and check it out. <br> <br>Look familiar to anybody? <br><img src="http://www.typophile.com/forums/messages/83/14171.gif" alt=""> <br>Oh, and Mike ... I received my "Modern Encyclopedia of Typefaces 1960-90" today! Nice reference book. Thanks for recommending it. It's doubly useful because now I have Berthold specimen images that are actually useful (unlike the Berthold Web site/PDF images). <br><br> <br><br></p>
  html_clean: <p>These two fonts are called Reporter Light &amp; Bold on the CD. Note the midlevel crossbar on the f &amp; t. <br> <br>The bold variant has ink traps in the M,N,V &amp; W. In the M, especially, these traps are really deep and yield the ugliness seen in the image. Happens in (inkjet) print as well. I assume the typeface hails from pre-digital days then, correct? I'm not sure why the bold g looks distorted. It's not like that really. I'll have to open it up in my font editor and check it out. <br> <br>Look familiar to anybody? <br><img src="http://www.typophile.com/forums/messages/83/14171.gif" alt=""> <br>Oh, and Mike ... I received my "Modern Encyclopedia of Typefaces 1960-90" today! Nice reference book. Thanks for recommending it. It's doubly useful because now I have Berthold specimen images that are actually useful (unlike the Berthold Web site/PDF images). <br><br> <br><br></p>
