    html: <p>Establishing truth or falsehood involving discussions of the physical sciences is a totally different matter. Getting universal agreement among the majority of humans on what type is good or not is not only far more complicated but it is a moving target with opinions changing with time.  Perhaps you are looking for an Uncertainty Principle that can be applied to the ever-shifting opinion patterns of people on typography?  ;-)</p>
