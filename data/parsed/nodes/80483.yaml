      <p><cite>Anyone's praises or damnation do not make any typeface in to a fine type.</cite></p>
      <p>I completely agree, Chris. The quality of the type is inherent to its design, and public opinion, even of type lovers, cannot make a bad font into a good one (or vice versa).</p>
      <p>I like Lewis's theory because it does not attempt to define what makes good art good. Rather, it tries to make rejecting art more difficult. I said that Dwiggins' praise was enough to establish Chelt as fine type, because he is someone who clearly loves typography and design, and he also loves Chelt. It would have been enough that Kent or you love Chelt. </p>
      <p>Establishing the fact that a type has value is easy; establishing the opposite is and should be hard. Lewis uses the analogy of a spider - you can show that there is a spider in the room simply by pointing to one. To show that there isn't, you need to take the room apart.</p>
