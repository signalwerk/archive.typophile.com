  html: |-
    <p>Hi all,</p>
    <p>I'm working on a futuristic game where they've chosen Eurostile for the main font. They're using it in upper case only and need a second font for lower case characters at smaller sizes that supports cyrillic characters.</p>
    <p>URW++ seem to do a lot of cyrillic character fonts including Eurostile. I've written to them for licensing details. Does anyone have any recommendations for the second font that would complement it? It most probably needs to be sans serif.</p>
    <p>Quite a tall order I think. If its from the URW++ library then all the better as we only need to negotiate the font license with one foundry.</p>
    <p>Very grateful for any suggestions.</p>
