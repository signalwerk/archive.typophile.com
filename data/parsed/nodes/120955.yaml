      <p>Sorry, I based my assumption on MyFonts’ offering, should have known better.<br>
      Depending on the size and context, I would say any sans with sufficiently large x-height and open counters will do.<br>
      Something like Bureau (<a href="http://www.urwpp.de/bri/show_font_details.php?sprache=english&amp;fontnummer=b0b8006t" title="http://www.urwpp.de/bri/show_font_details.php?sprache=english&amp;fontnummer=b0b8006t">http://www.urwpp.de/bri/show_font_details.php?sprache=english&amp;fontnummer...</a>) would keep the futuristic feel, but could be a bit too dark even in the regular weight.</p>
