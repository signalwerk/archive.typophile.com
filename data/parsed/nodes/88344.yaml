      <p>A good tool to look at the effect of features is the FontForge metrics window. You can paste directly your Greek polytonic text (that you can get from <a href="http://www.perseus.tufts.edu/hopper/collection?collection=Perseus%3Acorpus%3Aperseus%2CGreek%20Texts" rel="nofollow">Perseus</a>)  in the small window at the top and activate at will the features to see not only the resulting glyphs but also their name. If the name does not fit below the display, you can hover the cursor on top of the letter in the display to get the full information on it. Here is something interesting from John Hudson's <a href="http://www.sbl-site.org/educational/BiblicalFonts_SBLGreek.aspx" rel="nofollow">SBL Greek</a>:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/kerningwindow_4826.png"></div><p></p>
      <p>Here calt, smcp, ss03 and a few other features were on and I kept the cursor on top of the iotadierisis to get its full name.</p>
