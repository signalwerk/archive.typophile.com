      <p>Ooh, thanks for pointing me to SBL Greek. Nice font. That's a pretty cool alternate Iotadieresis.</p>
      <p>I've been doing something similar with FontLab, which also lets you see resulting glyphs' names. But I can't figure out what combination of features gets me to the single-glyph ΩΙ and ΑΙ combinations that Arno gives when I press the TT button (question 1a). </p>
      <p>I note that SBL Greek uses the capital-shaped small iotas in its small caps, so I'll probably use those (question 2a).</p>
