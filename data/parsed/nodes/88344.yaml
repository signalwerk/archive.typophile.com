      <p>I figured out how to get the single-glyph ΩΙ and ΑΙ combinations in the OpenType window! It's hidden in <code>calt</code>. Type the single-glyph Ωι combination, and then type any capital Greek letter. Ωι changes into ΩΙ!</p>
      <p>I still wonder about question 1a, though (what does InDesign do when you press the [TT] button?). Do I need to tell InDesign to do anything special for all-capping Greek, or can I just trust it to know the right characters to switch to? And why does the "UPPERCASE" command work differently from the [TT] button?</p>
      <p>I also still need to know question 2b (Can I make my font so that the default <code>smcp</code> forms in Greek have accents on them?). I suppose it makes sense to base my default behavior around modern monotonic Greek. So: if you had a text in modern Greek, and you clicked the small-caps button, would you find it bizarre to see the small-caps letters keep their tonoi? (I had to look up the plural of tonos.)</p>
