    html: <p>I don't know how InDesign proceeds. With Arno Pro, in the particular case of ρωμέικα put in small caps, the pdf produced by TextEdit uses <code>iota.c</code> for the iota (dieresis) smallcap, which is what I see in FontForge. However, the pdf produced by InDesign (CS 3) uses <code>u03CA.a</code> instead. Where InDesign got that, I don't know. I could find no combination of features giving <code>u03CA.a</code> in the FontForge metrics window.</p>
