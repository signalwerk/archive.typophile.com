      <p>What do you mean with "printed letters"?<br>
      There are just the Es that are repeating, and even these don't seem identical.<br>
      Why they "can't be calligraphy"?</p>
      <p>That said, there's plenty of calligraphic fonts, and it could be that some monolinear script contains a "of" ligature (or catchword).</p>
      <p>Maybe someone more expert in the field than me (which isn't difficult) could chime in and suggest some similar alternatives.</p>
