    html: |-
      <p>I think Riccardo is right about the main calligraphy, although it is similar to <a class="freelinking external" href="http://new.myfonts.com/fonts/grouptype/ovidius/" rel="nofollow">Ovidius</a>. I thought 'of' might have been from Plumero Script, but it's not in the glyph map. I'd guess it's hand-drawn too.</p>
      <p>Finally, the "GREAT CHEFS" lettering is similar to <a class="freelinking external" href="http://new.myfonts.com/fonts/agfa/poetica/" rel="nofollow">Poetica Chancery II</a>, but I think it is also hand-drawn, because the two E's seem not to be identical, just as Riccardo noted.</p>
      <p>Looks like I agree completely with Riccardo.</p>
      <p>- Mike Yanega</p>
