      <p>I really like the mark. Nice, simple, and conceptually strong. I'd vote for the one sans-box as I don't see the box really adding anything.</p>
      <p>The type is nice too. Is that Helvetica Rounded? It's trendy, but I have a soft spot for it.</p>
      <p>What I don't like is the balance between the mark and the type.</p>
      <p>In your first set, the mark is too large in relation to the type. In your second set, it's too small in relation to the type. I think you need to aim for something in the middle. Also, perhaps give the mark a bit more space in relation to the type. Give it some breathing room.</p>
