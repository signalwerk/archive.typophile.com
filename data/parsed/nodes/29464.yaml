    html: |-
      <p>Are you locked up with the typeface? When looking at your small jpg's seemed good at first glance. But after I saw it was helvetica rounded it just felt a little too playful for a serious company. Every time I see helvetica rounded I think of "playschool" or toys in general.<br>
      If you are locked up on the typeface I might try to match the roundness of your icon corners, meaning make the icon rounder. If you are not locked up you can try another typeface that matches that shape, a bit more squared but round. Or you could even bring regular sans  typeface and then play with making it's corners rounder. Could be interesting and I would try a wide typeface to match the width of the "F" on the icon or again try to match the icon to your typeface.<br>
      Overall looks interesting, play more with the type, stack it, try "TitleCase" since it looks like you have an Upercase "F' in your icon instead of lowercase etc.<br>
      When you place the icon next to the icon horizontally it reads "Fanalisisfactory" be careful with that, perhaps stacked on the side but align the bottom to the "x" height of your type.</p>
      <p>Good work, hope this helps.</p>
      <p>Kco</p>
