    <p>Hi Typophilian mates!</p>
    <p>Well I love try to design some fontface cuz I'm just a begginer on this discipline, in fact, my start is this year and my previuos experience is on Calligrhy.<br>
    I come to tell to all of you that this is my first full character set designed and I would like take your opinion and critiques about this work and so you can help me to improve it, please.</p>
    <p><strong><em>"Farola"</em></strong></p>
    <p>The uppercases Farola are very decorative then its lowercases are most regular for keep a little of equilibrium.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/farola-typophile1_6004.png"></div><p></p>
    <p>This is a Display font is done to be used on big sizes, titles or logos.<br>
    here an example:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/farola-typophile2_5344.png"></div><p></p>
    <p>Respects and Regards<br>
    Pedro [<strong>PeGGO</strong>]</p>
