    html: <p>This is a real delight, Pedro. It gives me a '60s-'70s latin resort feeling and has a definite hand rendered charm. I adore the caps, but I recommend a simpler set as alternatives. I know it's meant for larger settings, but it can work for short text too if you improve the spacing, especially to the right of the 'a' and around the 'i' and 'o'. This will sacrifice your connections a bit, but it's worth it.</p>
