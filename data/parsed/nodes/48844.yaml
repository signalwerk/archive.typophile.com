    html: |-
      <p>Beautiful work.</p>
      <p>Your ch and ck ligatures are a little too crowded. Open them up so that the c has as much room as the unligated one we see in "Acholias".</p>
      <p>You may find it wise to create Ni And Mi ligatures.</p>
      <p>The decorated tails of R and K force a very large gap in all settings with lowercase. Perhaps they should descend?</p>
    html_clean: |-
