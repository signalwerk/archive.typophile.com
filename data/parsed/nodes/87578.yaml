  html: |-
    <p>I'm looking for some suggestions for condensed and/or compressed grotesques for use in an contemporary art festival. At this stage it feels right for the project, with the creative in it's infancy. I'm well aware of the Champion and Knockout families but am looking for something perhaps less common. Liking the idea of having a cold, machine quality without becoming tech.<br>
     At the moment I've played with Compacta, Compacta Light, Univers condensed Plak and a few others. There's a degree of the off-beat nature of plak that also seems in line with the contemporary art work. A couple of refs:</p>
    <p>Quite liking the look of <a class="freelinking external" href="http://commercialtype.com/news/updates/druk_for_ibloomberg_businessweeki" rel="nofollow">Druk</a></p>
    <p>Also love the identity of NYC Opera by 2x4 <a class="freelinking external" href="http://2x4.org/work/7/New+York+City+Opera/" rel="nofollow">here</a></p>
    <p>And sort of <a class="freelinking external" href="http://new.myfonts.com/fonts/redrooster/railroad-gothic-rr/" rel="nofollow">rail road gothic</a></p>
    <p>Look forward to hearing some words of wisdom from the experienced to the inexperienced!</p>
