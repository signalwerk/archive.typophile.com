    html: <p>Note also Kent’s “innovation” of kerning em-dash pairs negatively so they connect, allowing for the easy building of rules — and I’ve started doing that myself. <span class="caps">BTW</span>, I suspect that em-dashes without sidebearings were intended for that very purpose in the metal days — but of course with easy negative kerning in digital setting that’s moot — which is why it makes sense to put spaces around em-dashed now (just like with the other dashes). <br><br><span class="caps">BTW</span>, in fonts with monowidth ﬁgures it might be useful to have the en-dash set at the ﬁgure width. <br><br>hhp</p>
