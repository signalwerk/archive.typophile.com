  html: <p>What’s the secret behind en and em dash widths? I saw that they vary from font to font. Is there anything to do with the n and m glyphs? <br><br>Thanks!</p>
  html_clean: <p>What’s the secret behind en and em dash widths? I saw that they vary from font to font. Is there anything to do with the n and m glyphs? <br><br>Thanks!</p>
