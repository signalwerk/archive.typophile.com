    html: <p>If I remember rightly, Kent Lew said that Matthew Carter has started using an em dash of 750, with space before and after as part of the glyph. Kent has also done this in his Whitman typeface.  <br><br>This provides a solution between the English and American practices. The American practice, which Bringhurst criticises as a Victorian innovation that puts holes in the page, is to set phrases oﬀ with em dashes. The British is to use en dashes with word spaces on either side, which Bringhust prefers. I was recommended to use a thin space on either side of the en dash by Nathan Matteson — which I think is an improvement. I’ve tried a hair space, which I like even better. But the Carter solution may be the best. I do agree with Bringhurst that using two em dashes to set oﬀ phrases looks bad. Bringhurst likes the use of em dashes to introduce lines of dialogue, instead of&nbsp;quotes.</p>
    html_clean: <p>If I remember rightly, Kent Lew said that Matthew Carter has started using an em dash of 750, with space before and after as part of the glyph. Kent has also done this in his Whitman typeface.  <br><br>This provides a solution between the English and American practices. The American practice, which Bringhurst criticises as a Victorian innovation that puts holes in the page, is to set phrases oﬀ with em dashes. The British is to use en dashes with word spaces on either side, which Bringhust prefers. I was recommended to use a thin space on either side of the en dash by Nathan Matteson — which I think is an improvement. I’ve tried a hair space, which I like even better. But the Carter solution may be the best. I do agree with Bringhurst that using two em dashes to set oﬀ phrases looks bad. Bringhurst likes the use of em dashes to introduce lines of dialogue, instead of&nbsp;quotes.</p>
