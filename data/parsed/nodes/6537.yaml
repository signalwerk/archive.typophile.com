    html: <p>The width of the em-dash is usually equal to the measure of the font’s em-square. The en-dash should be half the width of the em-dash. <br>With digital fonts, the em-square usually measures 1000 units, so the em-dash should be 1000 units wide, and the en-dash 500 units. <br>Of course, this is just a&nbsp;‘rule-of-thumb’.</p>
