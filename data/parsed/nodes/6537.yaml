    html: <p>InDesign doesn’t use the <span class="caps">OS</span>/2 or hhea table values to calculate linespacing. In InDesign, linespacing is handled the same way as point size, by scaling the font em. So for a typical <span class="caps">PS</span> font with an em of 1000, that provides the scaling factor to produce e.g. 12pts regardless of whether that is 12pts of type size or 12pts of linespacing. <br><br>Typically, applications that use the font metrics values to calculate default linespacing (correctly or incorrectly) are those that either do not oﬀer users a way to adjust linespacing or which do not expect users to do this often or competently, e.g. <span class="caps">MS</span>&nbsp;Word.</p>
