    html: <p>William, the FontLab ‘FontInfo/TrueType-speciﬁc metrics’ panel contains the <span class="caps">OS</span>/2 and hhea table values. <br><br>I’ve been discussing this with people at <span class="caps">MS</span> and Adobe over the past few days, because the diﬀerence between the font spec, what applications do and what common font development practice has become is serious and causes a number of problems. Really, the fault is with the application developers, many of whom are incorrectly calculating default interline spacing* using the <span class="caps">OS</span>/2 WinAscent and WinDescent values. This has prompted many font developers to use these values to control line height, when these values were originally intended to deﬁne the clipping height, i.e. the height and depth beyond which ‘ink’ may be clipped when the glyphs are painted. Linespacing should be calculated based on the <span class="caps">OS</span>/2 ‘Typo’ values. I’m working with some people to clarify this issue and to come up with a set of recommendations for both font and application developers. <br><br><br>* Note that this applies only to applications that rely on font metrics to set linespacing. Obviously professional page layout apps like InDesign use precise point metrics, expressed in absolute terms, e.g. 12pt type on 12pt leading for ‘solid set’ text. Applications like members of the Oﬃce suite, text editors, web browsers, etc. use font metrics, which typically include some amount of leading internal to the&nbsp;metrics.</p>
