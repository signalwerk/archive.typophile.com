    html: <p>In the <span class="caps">OS</span>/2 table, the typoAscender + typeDescender values (taken as positive values) should equal the em-square height. The sum of the typoAscender + typoDescender + typoLineGap should equal the sum of the WinAscent + WinDescent. The latter two values determine the default linespacing and clipping zones in applications that use font vertical metrics. <br><br>For cross-platform compatible linespacing, the Ascender and Descender values in the hhea table should be set equal to the WinAscent and WinDescent values of the <span class="caps">OS</span>/2 table, and the hhea LineGap value should be set to 0 (zero). Note that this is contrary to the original TrueType speciﬁcation, which said the hhea metrics should equal the <span class="caps">OS</span>/2 typo values. The reality is that systems and applications use the WinAscent and WinDescent values, for most everything, and the typo values are largely ignored (the Microsoft Font Validator actually reports an error if you follow the spec instead of matching the hhea values to the WinAscent and WinDescent). Unfortunately, the Adobe <span class="caps">FDK</span> code in FontLab follows the spec in this regard, so <span class="caps">CFF</span> OpenType fonts may not have cross-platform compatible metrics unless one edits the hhea&nbsp;table.</p>
    html_clean: <p>In the <span class="caps">OS</span>/2 table, the typoAscender + typeDescender values (taken as positive values) should equal the em-square height. The sum of the typoAscender + typoDescender + typoLineGap should equal the sum of the WinAscent + WinDescent. The latter two values determine the default linespacing and clipping zones in applications that use font vertical metrics. <br><br>For cross-platform compatible linespacing, the Ascender and Descender values in the hhea table should be set equal to the WinAscent and WinDescent values of the <span class="caps">OS</span>/2 table, and the hhea LineGap value should be set to 0 (zero). Note that this is contrary to the original TrueType speciﬁcation, which said the hhea metrics should equal the <span class="caps">OS</span>/2 typo values. The reality is that systems and applications use the WinAscent and WinDescent values, for most everything, and the typo values are largely ignored (the Microsoft Font Validator actually reports an error if you follow the spec instead of matching the hhea values to the WinAscent and WinDescent). Unfortunately, the Adobe <span class="caps">FDK</span> code in FontLab follows the spec in this regard, so <span class="caps">CFF</span> OpenType fonts may not have cross-platform compatible metrics unless one edits the hhea&nbsp;table.</p>
