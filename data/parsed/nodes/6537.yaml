    html: <p>Further to what I wrote above, I think I should clarify that I’m talking about how to actually get cross-platform compatible linespacing in the majority of current apps. The fact remains that the majority of apps that use font metrics to calculate default linespacing are doing it incorrectly, since WinAscent and WinDescent were not intended to be used for this purpose. But the error is so entrenched and widespread, the only way to reasonably achieve cross-platform metrics is to deliberatly make what is, in terms of the spec, a buggy font. <img src="http://www.typophile.com/forums/clipart/sad.gif" alt=":-(" border="0"></p>
