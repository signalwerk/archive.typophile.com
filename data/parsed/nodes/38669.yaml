    date_raw: 1.Nov.2007 3.39pm
    votes: null
    html: <p>I think the concept is good. Nice simple clean design. But you kinda gotta think of the purpose of a business card &amp; the market your targeting. It’s a contact card that represents a business as well as an individual. A phone number is still an essential element in contact information. Even though it seems highly unlikely there are still many people to this day who do not have a computer nor the internet. Another suggestion when presenting a concept to your boss you may want to present more than one idea because although your the designer they are the boss and it will always be that way! If he has design skills or not. He has a vision of what he wants. So try giving him more then one option to choose from. It always seemed to work for me with my boss. Hopefully I gave you some useful information!</p>
