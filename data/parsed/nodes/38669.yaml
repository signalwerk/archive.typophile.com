    html: <p>I reiterate that I don’t think it’s a question of “graphic design dogma”, and I’m not sure why you’re going at it that way. It’s a content/branding issue and waving the graphic design stick at your boss seems misdirected. If you want to convince him to keep it that simple, you should be talking about the image of the company, not graphic design. As a designer your job is to come up with an innovative solution either way.</p>
