    html: <p>It’s a gorgeous design, but I do think that the retro design might work better if you kept it traditional and put a name line on the card. But a phone number is really a must on a business card (unless people at the company just don’t have phones)—if you leave the phone number off for the sake of the design, the design has broken the function of the piece, and thus it is a bad design.</p>
