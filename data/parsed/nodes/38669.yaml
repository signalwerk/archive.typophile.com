    <p>Hi! This is my first posting on typophile and though my question isn’t specifically typography realated, I do need educated opinions on a debate that I’m having with my (non-designer) boss.</p>
    <p>Our company has recently been rebranded and I am tasked with redesigning everything. First off business cards. Now rather than go the entirely traditional route (name, title, address, numbers, email, webpage etc) I wanted to ditch the name line, and just do email. Everyone’s email in the company is <a href="mailto:first.last@ourcompany.com">first.last@ourcompany.com</a> Similar to this:</p>
    <p><a href="http://i167.photobucket.com/albums/u123/lynzee34/businesscardexample.jpg" title="http://i167.photobucket.com/albums/u123/lynzee34/businesscardexample.jpg">http://i167.photobucket.com/albums/u123/lynzee34/businesscardexample.jpg</a></p>
    <p>I have seen it done on just a handful of cards and I love it. I think it’s sleek and very modern. My boss of course hates it, but I want to know what other trained eyes think. Am I pushing foward our medium or am I going against graphic design dogma? Should I keep fighting the good fight or am a wasting my time with a battle that shouldn’t even be considered?</p>
