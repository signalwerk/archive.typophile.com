      <p><cite>Am I pushing foward our medium or am I going against graphic design dogma?</cite></p>
      <p>Rereading this, I really don’t think it’s a graphic design issue at all. That’s not the way to think about it. It’s really more of a branding issue - and the card’s functionality. You can make it look great either way. I think you’re wasting your time if you try to convince your boss on terms of design. And you run the risk of making him think designers don’t know what they’re talking about, which could come to bite you in the ass down the road.</p>
