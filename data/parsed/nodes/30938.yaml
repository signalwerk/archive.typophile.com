      <p>You get what you pay for; the spacing and the overall cut of Monotype Van Dijck comes in for a hammering in Bringhurst's opinion too.</p>
      <p>I like to tell myself I can't afford TEFF typefaces either, but you might like to look at the very reasonably priced work of the <a href="http://www.stormtype.com/index.php" rel="nofollow">Storm Type Foundry</a> or <a href="http://www.fontbureau.com/" rel="nofollow">Font Bureau</a> instead, both of whom do beautiful work (Regent, Farnham) inspired by Dutch baroque typefaces.</p>
