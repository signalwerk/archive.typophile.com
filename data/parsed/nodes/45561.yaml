      <p>Well, if this is custom, and it seems likely that it is, it would not be too hard to put this together from pieces of letters, and/or letters with lines drawn through them. Do they use this 'font' for more than the masthead and 'STUDIO NUMBER ONE'? If not, these may be the only letters that exist. (Notice there are two different N's, between the two logos).</p>
      <p> - Mike Yanega</p>
