      <p>CORRECTION (edited above):<br>
      I'm not looking for shears that are non-perpendicular (implicitly to<br>
      the "stroke"), I'm looking for shears that are non-horizontal/vertical.<br>
      So perpendicular is even OK - although not required. (You might have<br>
      figured all this out already...)</p>
      <p>Jürgen, Finnegan is a valid suggestion (with no need to apologize).<br>
      Supergrotesk: nope, the shears are generally horizontal/vertical.</p>
      <p>A good example of what I'm looking for is H&amp;FJ Whitney.</p>
      <p>hhp</p>
