    html: |-
      <p>I'm with Patty on much of what she's suggested. "Relevant" is a dead giveaway that you're feeling awkward about your experience, and even if you <em>are</em> feeling awkward, that's the last thing you want to convey. Same goes for "personal" skills or anything along those lines. When I discuss résumé writing &amp; formatting in class my foundation rule is to avoid, at all costs, claims of any kind. "I'm good with Photoshop." "6 years experience with InDesign." "If given the oportunity I will..." Crap, crap, crap. Like Patty pointed towards, <em>prove it</em> by listing <em>what you've actually done</em>. That said, don't let your résumé turn into a data file, it needs just a touch of personality (both in the design and the copy writing), but good writing and design are subtle (this isn't adverting, even if it is).</p>
      <p>As for one page, I don't know about that. Mine's 9 pages long, and depending on the position/contract I'm going for I tend to edit it down to just the "relevant" stuff, which is still usually 5+ pages. While that first page has to do a lot of the work (almost all of it), one page always feels light to me. That said, if you've got a client list like Patty's, you don't need much else.</p>
      <p>[Patty, you're stuff is too good to be represented by squooshed and pixelated graphics on your site. Kick your developer (or yourself) in the behind and reformat those graphics so that they display at their real size.]</p>
    html_clean: |-
