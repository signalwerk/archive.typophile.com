      <p>"i’m sorry, aluminum, but i disagree."</p>
      <p>This isn't an opinion issue. It's just how it is. ;o)</p>
      <p>DPI is simply a setting that some desktop publishing products use to figure out default output if not otherwise specified. </p>
      <p>For instance, if you set your DPI in photoshop, it will change the PRINT size if you print directly from photoshop. It doesn't change the number of pixels.</p>
      <p>Save that image as a  GIF or JPG to put it online, and the DPI info is gone and not needed, as the web doesn't have any use for it. </p>
      <p>"dpi is part of the image data whether “the web” cares or not, and because the web is always 72dpi"</p>
      <p>The web isn't any DPI. If anything it's measured in PPI (pixels per inch) and that varies from monitor to monitor and computer to computer.</p>
      <p>Browsers may default to 72 or 92 DPI for printing a page, but, again, that's a browser setting and isn't anything related to your images. Browsers will also use default DPI settings to interpret type sizes, but it's not a direct correlation to a real inch in any shape or form (so only adds to the confusion).</p>
      <p>"quality control dictates defining size at 72dpi for originals destined for the web at non-original sizes."</p>
      <p>Try it. Save a 300x300 JPG and 1000dpi and at 50 dpi. Put them both on yoru web page. What do you see? </p>
      <p>"But I come from print so I’m used to thinking/talking in terms of dpi not in pixels."</p>
      <p>Right. DPI is a print concept. Toss it out the window when doing your web stuff. As you can see, it only confuses folks. ;o)</p>
