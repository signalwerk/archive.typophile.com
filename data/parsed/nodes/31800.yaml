      <p>i'm sorry, aluminum, but i disagree. its relevant because dpi is part of the image data whether "the web" cares or not, and because the web is always 72dpi, whether HTML knows it or not. dpi is part of rasterized imaging, regardless of platform, whether defined or not. 72dpi is the default for most familiar onscreen environemts.</p>
      <p>patty's web problem is the proof.</p>
      <p>her images were forced down to 300 pixels by HTML. the actual images are some other size when viewed at 72dpi, before involving HTML. The only way to make an HTML encoded graphic look lossless at 300 pixels is to supply it to the HTML at 300 pixels @ 72dpi. 1 to 1. no upsizing or downsizing, and defining 72dpi is part of that data, before it gets to HTML. any other dpi will result in interpolation of some kind, up or down.</p>
      <p>believe me, i've been through this by trial and error. quality control dictates defining size at 72dpi for originals destined for the web at non-original sizes.</p>
