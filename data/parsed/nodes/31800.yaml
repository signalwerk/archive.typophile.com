      <p>Yes, OK, good clarification. But not everyone knows how to resample a graphic properly so that it displays at the desired pixel dimensions.</p>
      <p>You can take a 300dpi (let's say 1780x1780px) graphic and downsample it to 72dpi, and it might still be 1780x1780px. If you squoosh that graphic into your HTML with specs of 300x300px, you end up with the right display size, but the file size is larger than necessary and (as in Patty's case) the image looks crappy. I'm not saying this is the right thing to do (it's the <em>wrong</em> thing to do), but many make this mistake.</p>
      <p>On the other hand, you can resample that same 300dpi (1780x1780px) graphic down to 300x300px and leave it at 300dpi and you'll be good to go. No squooshing, file size is reduced, all good. Just don't try to use that one in print cause it'll only be one square inch.</p>
      <p>The problem, in my experience, is that many folks do the former, or screw up the latter, and end up with graphics that are not the correct dimensions and/or resolution for their website, and the result is often similar to what Patty has run into.</p>
