      <p>One more note on Patty's site (in case it might be useful to others). The bug is that the images in your site are squished to fit in your HTML code; that is, the code is specifying dimensions that are not correct. Thus, when the image displays in a browser it's getting squooshed (that's the technical term) and thus ends up looking pixelated.</p>
      <p>For instance, here's one of your graphics cropped in half but at its real size (approx. 400x400 pixels):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Bali_real_5751.jpg"></div><br>
      &nbsp;<p></p>
      <p>And here's what what it looks like on your site in my browser (your HTML code specifies the squooshed dimensions of 300x300 pixels):<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Bali_squooshed_3572.jpg"></div><br>
      &nbsp; <p></p>
      <p>It simply looks like your developer cut the corner of actually reformatting the images to the required size and instead just packed and crammed them into position in the HTML.</p>
      <p>Part of the reason why the pages are so slow to download is that the image files are considerably larger (dimensions) than they need to be. If they were reformated to the correct dimensions, their files size would shrink quite a bit.</p>
      <p>And while Stephen is right about the JPG artifacts, if you balance the optimization settings they're easily avoidable.</p>
      <p>ps. Thanks a lot for bringing this up Eddie, now I've gone in to pare down my CV and I'd forgotten how painful it is to put these things together.</p>
