      <p>Craig, that's a good link.</p>
      <p>I never reacted well to "Objective" or "Summary of qualifications" or overly descriptive text in a resume. Nothing that smacks too much of self-promotion or filler. I want a concise job history with relevant (but not the word) responsibilities listed - ideally in bullet points. Education history, skills (software, foreign languages), awards are important too.</p>
      <p>Re keeping it to one page - yeah, just edit the older stuff down to a line or two. </p>
      <p>You can see the web version of mine at <a href="http://www.pattyfab.com" title="http://www.pattyfab.com">http://www.pattyfab.com</a> if you want (click on Contact in the navigation) or download the pdf version if it would be helpful.</p>
