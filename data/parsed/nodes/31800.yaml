      <p>"I have a short resume I’m about to send out thats roughly a page and a half."</p>
      <p>I'd recommend that you keep it to a page.</p>
      <p>Where are you sending it too? A person? An HR department? </p>
      <p>The typical advice is to keep it simple, don't 'over design' it, make it readable, and make it one page.</p>
      <p>That said, in certain cases (namely large corporate HR departments), you may need to toss in a bunch of keywords to get by the resume filtering software.</p>
