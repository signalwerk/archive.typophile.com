      <p>The problem with both video and web is that there is no absolute like an inch to go by.  It is like units in type. A typical font is drawn at either 1000 or 2048 units. The same number of units exist no matter what the type size is. The output device determines how much of this information it can output but it can't change the number of units. A pixel is like a unit which can be bigger or smaller depending on the device it is viewed on. I can take my single monitor and change its resolution to several pixel depths. This will enlarge or shrink the pixel as well as cut off or add more image in the viewable area. What you like to call an inch is actually a variable that follows pixel resolution of the viewing device.</p>
      <p>ChrisL</p>
    html_clean: |-
