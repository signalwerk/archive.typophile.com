      <p>"NTSC video is the equivalent of 72dpi"</p>
      <p>yea, that's technically incorrect. NTSC is simply a pixel dimention. It's not equivalent to any DPI.</p>
      <p>What might be confusing is that a lot of DTP software defaults to assuming 72dpi = 100% on screen. This was only technically true when the first Macs came out (when monitors were roughly only 72ppi). It hasn't been true since, but software still uses it.</p>
      <p>For instance, if you set an image to 72dpi in Photoshop and then tell photoshop to display it on screen at 100% you'll get actual size in pixels. Changing the DPI in photoshop won't affect the pixel dimensions of the software, but will change the 100% view in photoshop. Perhaps video editing software adopted that long ago and never let go.</p>
    html_clean: |-
