      <p>"my understanding is that NTSC broadcast monitors are the functional equivalent of 72dpi."</p>
      <p>NTCS = 484 vertical lines. I know not all of those lines are availble on screen, but for this, we'll assume they are.</p>
      <p>For the screen to truly be 72dpi, it'd have to be 484/72 = 6.72" high. Any screen larger than that would be less than 72dpi and any screen smaller than that would be more than 72dpi. Same pixels. Just less or more per inch.</p>
      <p>"and 300 ppi is way more information than 72 ppi"</p>
      <p>Not at all. It's just a different setting in the images meta information. What matters is the number of pixels. A 1000dpi 300x300 image and a 72dpi 300x300 image both have exactly the same amount of image data: 90,000 pixels.</p>
      <p>EDIT: I can see the confusion. Your above statement is correct, 300ppi is more information than 72ppi. What you are confused about, though, is that the image on the screen doesn't have any ppi settings. It's simply a bumch of pixels. PPI is a measurment of screen pixel density...not a measurment of anything displayed on it. DPI is a measurement of print dot density...not a measurement of the electronic files that are being printed.</p>
