      <p><em>I know its nit-picky.</em></p>
      <p>Nit-picky is the name of the game.  :-)</p>
      <p>Jason, I agree with most of what you say; likewise with you, Patty. The resume is supposed to sell what you do best, etc. That said, my resume is 2 pages long (gasp!), and on the second page I do list which software programs I know and how long I've been using them. First and foremost is what I've done, though -- work experience and studies. I don't list references or bother to have a line that says they are available upon request. People know that stuff.</p>
      <p>As for the "glimpse and a hook" article, that's the first time I've ever heard someone say they don't want a cover letter! Cover letters are supposed to show taht you, um, like, know how to communicate and stuff.  ;-D</p>
