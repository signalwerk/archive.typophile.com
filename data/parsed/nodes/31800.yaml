      <p>&gt;&gt;Is this a setting in your video editing software?</p>
      <p>no, it only exists in photoshop. i create graphics and import them into aftereffects.<br>
      almost always it's desirable to work at very high rez (600 dpi or higher) so that aftereffects can pan &amp; scan or reduce as necessary. occasionally i have to work at a lower rez to avoid artifacts created in the video document such as unintentional moire patterns or banding in hi-rez gradations viewd in low-rez media. i always have to preview work on an NTSC monitor to see what it really looks like. the engineers i worked with back in the 90's consistently refered to NTSC as the functional eqivalent of 72dpi. perhaps they were just being kind and sparing me the more complex explanation.</p>
      <p>sometimes i have to take frame grabs from video back into photoshop for a promotional publication. they always come in at 72 dpi at the video pixel dimensions.<br>
      screen snapshots on my mac also import into photoshop at 72 dpi with dimensions maintained.</p>
      <p>when i was prepping stills for my website, my web builders requested that i supply the images at the correct pixel dimensions at 72dpi (photoshop) to avoid any forced interpolation by resizing. i tested a few and saw noticable differences online, similar to the artifacts on patty's site that started this diversion, hence my advice that she follow the same guidelines.</p>
