    html: |-
      <p>Great to see this is still kicking!</p>
      <p>I think:<br>
      1) The "a" is not entirely happy. Don't know why.<br>
      2) There's some clotting at the stem-bowl joins of "b", etc.<br>
      3) The "g" needs more zing. Maybe a more aggressive bottom and/or a spiky (Goudy-style? You like Goudy) ear.<br>
      4) The tail of the "j" is moping.<br>
      5) The "k" I actually find admirable.<br>
      6) I might do something about the serifs of the "m".<br>
      7) "r": stronger beak. But no wider.<br>
      8) "s": maybe more zing too.<br>
      9) "t": higher head.<br>
      10) Maybe give a twist to the middle part of the "w".<br>
      11) The "z" is totally out of character. It's not even leaning!</p>
      <p>An upright for emphasis: this is not a bad idea, and I've actually seen it applied (although at the typesetting level, not the font level). The most accessible example is the English inserts of tipoGrafica. But a word of caution: in a body of italic, upright settings actually look slightly backslanted - very disconcerting. So your upright should actually have a slight slant, maybe 1 degree. Oh, and I'd keep the semi serifs!</p>
      <p>hhp</p>
