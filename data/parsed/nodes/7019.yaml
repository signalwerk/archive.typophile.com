    html: <p>&gt;there's a range where the slant is neither here nor there  <br> <br>I don't really agree with this. Syntax has a 1/2 degree slant and you can still 'feel' it even though you don't identify the source of the dynamism. The eye is extremely sensitive to verticals, and the slightest variation, I think.   <br> <br>I suspect that if this is too slanted it will never be used much for text, only display. The slant now is a bit dizzying, but this might have other causes, I don't know.  <br> <br>Note that Jenson is slanted on one side (bottom left, top right), so that some slant can work well for text. The assymetrical serifs of Jenson could work for an upright version. Check out also <a href="http://www.teff.nl/fonts/trinite/trinite.html" target="_blank">Trinite</a>, a fabulous piece of work with some slant and assymetrical serifs.</p>
