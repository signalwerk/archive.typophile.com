    html: "<p>Thanks William. Anybody who wants to buy a pre-release version of Harrier can contact me; that's actually how Paul himself got a hold of Patria for his newspaper. <br> <br>An upright version of Interloc would indeed be interesting - the problem is the serifs: putting half-serifs on totally upright strokes makes the font lean backwards. You can see this problem clearly in some of H E Meier's work. In Avance Bloemsma solves it by putting flares on the opposite sides -which however gives a certain feminine/calligraphic skew- although that might actually work great (better than Avance, and certainly better than Harrier would) in Interloc. The other obvious avenue is leaving a very slight slant (maybe 1 degree) in there - but that causes problems in lo-res rendering. <br> <br>hhp</p>"
    html_clean: "<p>Thanks William. Anybody who wants to buy a pre-release version of Harrier can contact me; that's actually how Paul himself got a hold of Patria for his newspaper. <br> <br>An upright version of Interloc would indeed be interesting - the problem is the serifs: putting half-serifs on totally upright strokes makes the font lean backwards. You can see this problem clearly in some of H E Meier's work. In Avance Bloemsma solves it by putting flares on the opposite sides -which however gives a certain feminine/calligraphic skew- although that might actually work great (better than Avance, and certainly better than Harrier would) in Interloc. The other obvious avenue is leaving a very slight slant (maybe 1 degree) in there - but that causes problems in lo-res rendering. <br> <br>hhp</p>"
