    html: "<p>Now this is interesting. Bravo, Paul. <br> <br>Although some of the mechanics of reading you're assuming aren't based on any actual findings (as you readily admit), much of what you've arrived at speaks very dearly to my heart, and mind. If you search for \"Harrier\" in my Daidala interview* you might see some interesting parallels. Your stuff is a lot less rigid, and has some traditional overtones - makes me think of the first half of the 20th century, like Gill. <br> <br>* <a href=\"http://www.daidala.com/25apr2004.html\" target=\"_blank\">http://www.daidala.com/25apr2004.html</a> <br> <br>Basically, this is <i>exactly</i> the type of work I very much hope catches on in the world of type design - it makes me happy to see you go in this direction. <br> <br>Some specifics: <br>- If this is a book face, I'd make it slightly darker, and I'd pull in the descenders a bit. <br>- Tighten the spacing significantly - apply the concept in the name!* <br>- The bottom of the \"t\" is malformed. <br>- The \"c\" is nothing short of charming. <br>- The ear of the \"q\" looks spliced in. <br>- To me the \"a\" is too self-conscious. <br>- The \"w\" is very nice. <br>- I'm surprises that I like the \"f\". But do make it wider. <br>- The \"d\" seems somewhat constructed. But I think you should keep it. <br>- The \"y\" needs more size, and a stronger tail. <br>- I think the \"r\" is very good. Maybe a stronger beak. <br>- The \"s\" is indeed leaning too much, but its narrowness is superb. BTW, try making the \"e\" narrower. <br>- I'm unsure about the tail of the \"j\". <br>- The \"g\" is amazingly good! I'd make the ear stronger, and expand the bottom bowl more to the right. <br> <br>* BTW, \"Interloc\" (\"Interlocq\"?) is interesting - I'm assuming it derives from the semi-serifs interlocking. <br> <br>Paul, please take this all the way. But be prepared for many people to not understand. <br> <br>I dare say I think you've got what it takes to make a mark - which means you should plan some contingencies for a life of poverty and obscurity.  ;-) <br> <br>hhp</p>"
