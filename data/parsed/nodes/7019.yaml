    <p>okay so i'm kinda excited to post this one, hopefully it won't flop too hard. anyhow, this is my first sincere attempt to develop one of my own original ideas for a face. this one was actually inspired, in part, by a thread here on typophile (<a href="http://www.typophile.com/forums/messages/30/43155.html" target="_blank">Display vs. Text</a>). <br>it got me thinking about reading speed and what my own thoughts were on the ideal font for reading quickly. i based the design on my own hare-brained thoughts on the subject, no research of any kind was performed, so thankfully no literate people were injured in the creation of this font. anyhow for me the ideal for speed would be an italic, as the slant supposedly keeps the eye moving forward. however the decorative nature of the italic hampers speed in reading, or so they say. i hate the sloped roman breed with a passion, so i tried to come up with something inbetween a sloped roman and a true italic. i'll let you judge on whether or not i succeeded. <br>besides the slant, i thought that a serif structure that moved from top to bottom and left to right would also keep the eye moving forward. and i dreamt up this serif structure so that the letters in a word would interlock (hence the working name). <br>anyhow, that's probably more than you really wanted to know, so i'll spare you the rest and let you go ahead and look at it. i'm rather happy with the results thus far, but i'm sure i have plenty to improve upon. help me find those areas. thnx for looking! <br> <br><img src="http://www.typophile.com/forums/messages/29/50588.gif" alt="gif sample"> <br> <br></p>
