    html: "<p>William, that's sort of what I meant. Half a degree is well below the zone I'm talking about, so it's \"seen\" (by virtually everybody) in the heart and not the mind. Above a certain degree (maybe around 2) it's the other way around. It's the range between those where the slant might flip-flop between visible and subvisible (even within one individual, certainly between different people), and I think that might be disconcerting, or at least unpredictable. <br> <br>Also note that the visibility of slant (just like anything else) is greatly determined by scale: the larger the size the more \"conscious\" it gets. <br> <br>hhp</p>"
