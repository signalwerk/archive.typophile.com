    <p>Diego Mier y Terán is a mexican type and graphic designer graduated from the Universidad Iberoamericana. Studied editorial design, type, animation and painting in the Minneapolis School of Art and Design, and studied type design in the Royal Art and Design School of the Hague in Neatherlands with Erik van Blokland, Fred Smeijers and Frank Blokland.</p>
    <p>His most important type design Tuhun, a typeface designed to solve the typographic problems of Sahin Sau (the mixtec language) and which works with remarkable succes, but is still in development.</p>
    <p>You can read more about this project and Diego's other works on this website: <a href="http://just.letterror.com/ltrwiki/DiegoMieryTeran" title="http://just.letterror.com/ltrwiki/DiegoMieryTeran">http://just.letterror.com/ltrwiki/DiegoMieryTeran</a></p>
