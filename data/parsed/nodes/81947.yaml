    html: |-
      <p>I've designed an fi ligature, at least if FontStruct.com fonts count...<br>
      As for ligature spacing, it depends on the spacing in a non-ligature letter pair. If the two letters do not touch, then that ligature is probably only good for artistic purposes (not necessarily a bad thing) and not for legibility.<br>
      One idea about ligatures I had (although I have never seen it anywhere) is an fi ligature where the dot of the i is on the outside of the f's hook instead of on the inside. Then there could be more spacing without widening the f too much, but I don't know how well it would work in practice.<br>
      Finally, you should keep in mind that if writers and typesetters are concerned about spacing, they will probably avoid ligatures altogether. So small increases in spacing are probably not a big problem.</p>
