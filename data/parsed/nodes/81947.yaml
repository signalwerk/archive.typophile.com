      <p>An <a href="http://en.wikipedia.org/wiki/Rapid_Serial_Visual_Presentation" rel="nofollow">RSVP</a> task at ~72 points using words with and without ligatures would be a fun study. I’d wager handsomely there would be no signiﬁcant difference. I’ve actually had colleagues look at 72 point Times next to 72 point Helvetica and not notice a difference. As typographers we have an ridiculous response bias that we often take for granted. Similarly, if no one even noticed the presence of ligatures in a reading task, it raises the question “why bother fussing around setting them, let alone designing them?”</p>
      <p>(How long did it take you to notice? Show this to a to a stranger at the pub and give them as much time as you like. They’ll never <strong>ﬁ</strong>nd it ;)</p>
