    html: <p>It is my understanding that Bouma is about familiar word shape. Diverging from the familiar works against this theory. Yes, in your previous example the two words would be easier to differentiate, but in a singular instance, an st ligature would harm the bouma due to a lack of familiarity (I’m sure we can all agree that more often than not, people don’t use st ligatures). The only way your example would hold true in a bouma context would be if in <em>all</em> instances, one of the two words was traditionally set with a ligature, and the other was not. I do not mean in a single book, I mean in all books, for hundreds of years.</p>
