  html: |-
    <p>[Blather on]</p>
    <p>At what point should the amateur designer, that is, me, start to display his work for critique? I’ve got very rudimentary outlines going and a usable, if not pretty, font started.</p>
    <p>How much self-woodshedding should I undertake before allowing my precious creation into the realm of critique?</p>
    <p>(Or am I just overanalyzing this and should get over it already and post the blasted thing...)</p>
    <p>[Blather off]</p>
