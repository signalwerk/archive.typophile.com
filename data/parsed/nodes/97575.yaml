    html: |-
      <p>To assist documentation:</p>
      <p>"R/I/B/BI" – Regular, Italic, Bold and Bold Italic. O for Oblique may replace the I.</p>
      <p>"SIL Open Font License" – An open-source (recognised as such by the Open Source Initiative) font licence developed by SIL (Summer Institute of Linguistics) for their own use and adopted by others.</p>
      <p>"GPL with font exception" – The General Public License with an exception that specifically exempts (PDF) documents embedding the font(s) from the GPL.</p>
      <p>Free – The problem with 'free' is that there are two kinds of it in English: Free beer (<em>gratis</em>, for free) and free speech (<em>libre</em>, freedom).</p>
      <p>- - - - -</p>
      <p>@Renaissance Man – There is still a lot of un- and badly-documented slang and jargon out there. Also, your infosheet was badly organised, with many assumptions. Using tags would have been more helpful, say:</p>
      <p>Typeface: Andada<br>
      Foundry: Huerta Tipografica<br>
      License: OFL 1.1<br>
      Designer: Carolina Giovagnoli<br>
      Description: ...<br>
      Webfont URI: ...</p>
      <p>Good tagging makes searches easier, too.</p>
