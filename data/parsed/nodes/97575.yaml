      <p>@Karl Stang</p>
      <blockquote><p>The OFL was conceived of to try and address the needs of designers, developers and users that wanted an open model which prevented restrictions, removed some of the ambiguity inherent in applying established licensing models (to something for which they were not intended) and promoted the underlying philosophy, without worrying about commercial considerations.</p>
      <p>Perhaps this could lead to another custom license, following the Apache model but focusing on type/fonts? The Typophile Apache Licence (TAL), anyone? : )</p></blockquote>
      <p>I wonder if the OFL is a little too slightly a product of it's specific origins. It's need was to promote the spread of freely useable fonts. That need was tied to SIL's work to promote the spread of freely available [religious] texts. There was naturally less of a need to protect the designs themselves. I would like to see an OFL (or OFL like license) that is stronger in it's protection of free fonts from the potential dangers of other designers or foundries taking free fonts (or parts of them) and privatising them.</p>
