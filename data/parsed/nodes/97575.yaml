      <p>Chris Dean, I support, in general, your various posts regarding clear communication. And to everyone, don't assume you know the background or qualifications of everyone here. All are interested in type, but from different angles. They may be type designers, or students, or graphic designers or technical writers. They may be native English speakers or English may be the second or third language. So take the time to be clear, even if it means putting an explanatory phrase into your post if it is needed.</p>
