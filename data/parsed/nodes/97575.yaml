      <p>re: PFB+AFM<br>
      Fonts distributed that way used to include an .INF file containing the menu names and style linking. Such distributions could be converted to PFM+PFB with the now absent Adobe Type Manager (ATM). </p>
      <p>I know of no utility or simple method under current operating systems for the average consumer to do this? (I.e., someone without FontLab and technical knowledge of how to copy the .inf info into the font manually. </p>
      <p>Hmm. I seem to remember a similar conversation with Tom 3-4 years ago in the Adobe typography forum … which is now effectively defunct.</p>
      <p>- Herb</p>
