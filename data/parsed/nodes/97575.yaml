    html: |-
      <p>I doubt that anyone is looking to this thread for a definition of what open source is and is not in the larger world (apologies if you are). At best this serves as a useful discussion of the limiting factors of applying a philosophical model that was never conceived of to address the needs of type designers and font users. The OFL was conceived of to try and address the needs of designers, developers and users that wanted an open model which prevented restrictions, removed some of the ambiguity inherent in applying established licensing models (to something for which they were not intended) and promoted the underlying philosophy, without worrying about commercial considerations.</p>
      <p>Perhaps this could lead to another custom license, following the Apache model but focusing on type/fonts? The Typophile Apache Licence (TAL), anyone? : )</p>
    html_clean: |-
