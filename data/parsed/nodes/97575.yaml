      <p>HVB – The Open Source stuff is still copyrighted, which is why a licence is needed.</p>
      <p>altsan – There's nothing 'seems to' about it. Old Standard and the Theano Classical Fonts are, in the author's own words, "released under the SIL Open Font License ...".</p>
      <p><a class="freelinking external" href="http://googlefontdirectory.googlecode.com/hg/" rel="nofollow">http://googlefontdirectory.googlecode.com/hg/</a> is the path to the Google Webfont Directory's Mercurial repository. The link 'ofl' takes you to the fonts/faces licensed under the SIL OFL. Usually, there are VFB and/or SFD files with the TTF/OTF files.</p>
