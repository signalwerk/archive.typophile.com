  - id: 532229
    user: 192788
    date: 2012-11-29T08:27:00
    date_raw: 29 Nov 2012 — 8:27am
    votes: null
    html: |-
      <blockquote><p>"NimbusRomanNo4", "NimbusRomanNo9", and "NimbusRomNo9L" (three apparent Times New Roman clones. In fact, there are subtle differences between the three, but does anyone know what the justification for each one is?) </p></blockquote>
      <p>Sorry to reply to myself, but on further inspection, I should amend this.  All three Nimbus Roman types appear to be based on Linotype Times Roman.  Some interesting differences between the three, however: </p>
      <ul>
      <li>No9 L is almost imperceptibly lighter than the other two but in different ways: No9 seems to have fractionally darker vertical strokes, whereas No4 has fractionally darker horizontals.
      </li><li>No9 has italicized Greek characters, whereas both No9L and No4 have regular ones.  (No9L also supports only those Greek characters appearing in the Latin-1 charset, whereas the other two have more.)
      </li><li>I believe No4 has a very (<em>very</em>) slightly lower caps height than the other two.
      <ul>
      <p>As far as "A030" and "Nimbus Sans L", the latter supports Cyrillic while the former does not.  They otherwise seem largely identical, although I haven't done a rigorous inspection.</p>
      <p>I apologize if all this seems pedantic but I haven't been able to find much other information on the lineage of these various faces (esp. Nimbus Roman).  Wikipedia isn't very informative, and Google mostly seems to have download links rather than background.</p>
      </ul></li></ul>
