    date_raw: 18 Jan 2013 — 2:36pm
    votes: null
    html: |-
      <blockquote><p>For some weird reason though that seems to happen almost exclusively with free fonts...</p></blockquote>
      <p>I usually find myself wanting to <em>add</em> a "few" characters that I'd really, really like to use but are not provided. (I make use of unusual punctuation marks, and fractions, and long S, and computing/astronomy symbols, and smiles/dingbats/emoji, etc.) I've had occasions when I had to change my plans because a font didn't have the repertoire I needed.</p>
      <p>My only two released fonts are under Open Font License. I've contributed a few glyphs to EB Garamond, another open source typeface.</p>
