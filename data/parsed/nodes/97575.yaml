    html: |-
      <p>Open Source and Public Domain are legal intellectual property right concepts. Whether it's type or not is somewhat irrelevant. </p>
      <p>My (limited) understanding of Public Domain is that it can get messy due to how it's defined from jurisdiction to jurisdiction. </p>
      <p>Open Source has one advantage over Public Domain in that (ideally) there is a clear license attached.</p>
      <p>So, an OS product's use is dictated by its included license. A PD product's use is dictated by the laws in the jurisdiction the product belongs to. </p>
      <p>At least in the US, if a property is public domain, you can take it and do whatever you want with it...give it away, resell it, redesign it, whatever.</p>
      <p>Most open source licenses, however, (in the context of software) have a clause that any derivative software you make with it will need to retain the same open source license (either as a whole, meaning your entire product also needs to be open source, or as a noted credit for portion for your product, even if your bigger product uses a different license).</p>
      <p>So, with type, I think one distinction could be that with a public domain typeface, I could take it, modify it, and sell it. With an open source typeface, I could take it, modify it, but would need to redistribute it with the same license as the original.  </p>
      <p>(Though the details all come down to the wording of the actual license, of course)</p>
