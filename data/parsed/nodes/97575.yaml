      <p>Next revision of the key:</p>
      <pre>Version: 1.7

      Legend:

        Fonts:
          S        Short form of the adjective Semi- (or Demi-)
          U        Short form of the adjective Ultra-
          X        Short form of the adjective Extra-

          Hr       Hair-thin weight
          UL       Ultra-light weight
          XL       Extra-light weight
          Lt       Light weight       (L with adjective)
          Th       Thin weight        (T with adjective)
          Rg       Regular weight
          Bk       Book weight
          Md       Medium weight
          SB       Semi-bold (demi-bold) weight
          Bd       Bold weight        (B with adjective)
          XB       Extra-bold weight
          UB       Ultra-bold weight
          Hv       Heavy weight
          Bl       Black weight

          I        Italic style
          O        Oblique style

          Comp     Compressed width
          Cond     Condensed width
          SCond    Semi-Condensed width
          Narr     Narrow width
          Norm     Normal width
          SExpd    Semi-Expanded width
          Expd     Expanded width

        Format:
          ADF      Apple Distortable Font (TTF with some multi-master features)
          EOT      Embedded OpenType (Microsoft's web font format)
          FON      Windows bitmap font
          MF       D. Knuth's Metafont
          T1       PostScript Type 1 (ATM font), seen in Mac, Unix and Windows flavours
          T1MM     PostScript Type 1 Multi-Master font
          OTF      CFF-flavoured OpenType
          SVG      Scalable Vector Graphics (useable as a font format as well)
          TTC      TrueType Collection (a TTF library format)
          TTF      TrueType or TT-flavoured OpenType
          WOFF     Web Open Font Format (web-only font format)
          IK       Work file format used by Ikarus and DTL
          SFD      Work file format used by FontForge
          SFDir    Work directory format used by FontForge
          UFO      Work directory format used by RoboFont and others
          VFB      Work file format used by Fontlab

        Licensing:
          AFPL     The Aladdin Free Public License (Aladdin GhostScript)
          Apache   The Apache License
          BSDL     The BSD License, any version
          CCPL     The Creative Commons Public License
          DSL      The Free Software Foundation's Design Science License
          GPL      The Free Software Foundation's General Public License
          GPL2+    Ditto, version 2 or later
          GPLfx    Ditto, with 'font exception' that excludes licence inheritance via embedding
          GUST     The Polish TeX Users Group licence; Polish LPPL
          LPPL     The LaTeX Project Public License
          MITL     The MIT License
          OFL      SIL's Open Font License
          UFL      The Ubuntu Fint Licence
          Utopia   Adobe's and TUG's collective Utopia licensing
          Vera     Bitstream's licence for the typeface Bitstream Vera

      Codings:
          Wiegel: P. Wiegel's old code for German special glyphs
          UNZ1: Subset of MUFI, details PUA codes for German special glyphs

      Version:
        The font/face version given is that of the Regular weight or closest equivalent.

      Peculiarities:
        1. In ADF faces, AE, Ae, ae, OE, Oe and oe are ligated globally via 'rlig'.
        2. IM Fell OTF and TTF may both be installed at the same time due to slight naming differences.
        3. Displayed licensing does not always match between OTF and TTF versions of GFS faces.
        4. Many GFS faces lack Latin characters.</pre><p>
