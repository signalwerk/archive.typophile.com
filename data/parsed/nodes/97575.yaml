      <blockquote><p>I'm not sure what else you mean by 'privatising' free fonts. What is your concern?</p></blockquote>
      <p>My concern is that 'free' licenses are generally seen as being about 'giving stuff away' and less about 'protecting the freedom' of the designer's output. I accept that (like with proprietary fonts) you can never reduce unlicensed use to 0%, but i think free software can too easilly have it's licensing terms disregarded, either by accident or design. Free software can be seen as a soft target for unlicensed use. The preamble of the OFL, for example, could make it a little clearer imo. No harm in that i would think; maybe more people would understand what they can and cannot do.</p>
      <blockquote><p>I'm guessing Vernon would like a license that prohibits commercial bundling.</p></blockquote>
      <p>No, i love the commercial bundling of free fonts :)</p>
