    html: |-
      <p>As a relative newcomer I can't say I see anything hrant has said here (or in any other thread) to qualify as "ranting and raving"; indeed, his comments generally seem quite fair, if blunt.</p>
      <p>I've put out a couple of open source fonts, or attempts at fonts, in my time, and I'd be the first to say that they're not up to standard.  (I haven't listed them in this thread for good reason!)  They were initially designed for my own purposes, at a time when I was totally blundering about blind in terms of design know-how (especially Workplace) - and boy, does it show.  I didn't even know what a counter was, let alone understand the first thing about proportion and colour.  I've been slowly trying to improve them through constant revision, but looking back at earlier versions makes me want to bang my head against the wall.</p>
      <p>Suzuran, which has a modest thread going in the serif Critique forum, is my first serious attempt to design a font that I wouldn't be embarrassed to let real designers see.  I have no idea if I could ever get it to a stage where it would be worth a commercial release, but profit isn't my motivation at the moment anyway. </p>
      <p>I guess my point is that a commercial (i.e. cost-money) font is automatically more likely to be competently designed, because if it wasn't it wouldn't be able to sustain itself as a product.  Hobbyists designing for fun and education, as I've been, will by default tend to release their work for free if at all.</p>
