      <p>This is a slight divergence but still I think on-topic (and since I can't start new threads this is the best I can do)...</p>
      <p>I've recently downloaded and am trying to classify the <a href="ftp://ftp.dante.de/tex-archive/support/ghostscript/AFPL/GhostPCL/urwfonts-8.71.tar.bz2" rel="nofollow">GhostPCL fonts</a> which URW++ donated to Artifex software under the free Aladdin license.  They don't seem to be as widely known or disseminated as the 35 "core GhostScript" fonts similar donated by URW++, but they provide open source implementations of some very nice faces.  Mostly they seem designed to fill in some of the gaps in the PostScript v3 core set when taken together with the GhostScript fonts. </p>
      <p>However, I'm having trouble clearly identifying one or two... and I'm not entirely clear on the distinction between some of them.  </p>
      <p>The name in "quotes" is the family name stored in the font file.</p>
      <ul>
      <li>"A028" (this looks a lot like Albertus but I think it's slightly different... does anyone know for sure?)
      </li><li>"A030" and "NimbusSanL" both appear to be Helvetica clones, which seems oddly redundant.  Is there a distinction that I'm missing?
      </li><li>"AntiqueOlive" (Antique Olive, obviously)
      </li><li>"ArtLinePrinter" (actually, this seems to be an original Aladdin Software creation, not URW's work at all)
      </li><li>"CenturySchL" (Century Schoolbook implementation)
      </li><li>"ClarendonURW" (Clarendon, only Bold Condensed weight included)
      </li><li>"Coronet" (Coronet)
      </li><li>"Dingbats" (Wingdings clone)
      </li><li>"GaramondNo8" (this is a rather nice Garamond, but I'm not sure if it's an original URW interpretation or not.  At least, I can't perfectly match it up to one of the well-known Garamond designs that I've looked at.)
      </li><li>"LetterGothic" (Letter Gothic)
      </li><li>"Mauritius" (Mauritius)
      </li><li>"NimbusMonL" and "NimbusMono" are both included (both Courier clones).  Again, what's the distinction?
      </li><li>"NimbusRomanNo4", "NimbusRomanNo9", and "NimbusRomNo9L" (three apparent Times New Roman clones.  In fact, there are subtle differences between the three, but does anyone know what the justification for each one is?)
      </li><li>"NimbusSanLCond" (clone Helvetica Condensed or Helvetica Narrow... not totally certain which)
      </li><li>"StandardSymL" (Symbol)
      </li><li>"U001" (seems to be a Univers clone)
      </li><li>"U001Con" (similarly, a Univers Condensed clone)
      </li><li>"URWBookmanL" (Bookman)
      </li><li>"URWChanceryL" (Zapf Chancery)
      </li><li>"URWClassico" (Optima)
      </li><li>"URWGothicL" (Avant Garde Gothic)
      </li><li>"URWPalladioL" (Palatino)
      </li></ul>
    html_clean: |-
