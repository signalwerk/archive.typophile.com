      <p>The only gray area in my own mind is whether to restrict the term "open-source" to fonts that could have been entirely produced with free* software. From what I can tell this is why some people don't feel Source Sans is open-source. The alternative is to call a font open-source as long as you don't need permission to distribute a modification. So maybe we need a different term for the former: opener-source.  :-)</p>
