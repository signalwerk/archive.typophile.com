      <p>Renaissance Man:<br>
      We have used GPOS based kerning, instead of the old Kerning table.<br>
      So the 'kern' table is no longer present.<br>
      All the kerning pairs are contained only into the 'kern' OT feature.<br>
      This method is better for web-fonts since you get a smaller file size, and the font will load faster on the web.</p>
      <p>I've updated the description now, to make it clear and avoid confusions.</p>
