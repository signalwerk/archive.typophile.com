      <p>@Chris Dean:<br>
      <cite>1. What is “R/I/B/BI”?</cite></p>
      <p>Context indicates: Roman, Italic, Bold, Bold Italic.</p>
      <p>Terseness, rather than verbosity, marks, for example, a classified ad for an apartment to rent; and so in the description of a particular font, this was followed - to conserve bandwidth, and serve the primary audience.</p>
      <p>If everything that the non-typographical reader could not immediately understand had to be spelled out in every post, that would make it cumbersome to post and so on...</p>
      <p><cite>Please tell me thats suposed to be ironic and hilarious. Translation?</cite></p>
      <p>Even if you are a technical expert, yes, you should try to be clear and understandable at all times - and to have the capacity to make yourself understandable to laypersons when appropriate.</p>
      <p>However, pretending to be 'just plain folks' and adopting the speech of another social class <em>is</em> disrespectful, and can be interpreted as mockery. That could have been what he was referring to.</p>
