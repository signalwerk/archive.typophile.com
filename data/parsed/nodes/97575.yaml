      <p>Volkorn by Friedrich Althausen is a nice family of four fonts which was <a class="freelinking external" href="http://friedrichalthausen.de/?p=43" rel="nofollow">originally released under a Creative Commons license</a> but has subsequently been <a class="freelinking external" href="http://friedrichalthausen.de/?page_id=411" rel="nofollow">updated and released under the SIL OFL</a>.</p>
      <p>This is a good example of how important it is to try and trace the source of a given font to the original designer and check the application of a particular license as there are significant differences between the freedoms afforded by these two different licenses.</p>
      <p>The <a class="freelinking external" href="http://openfontlibrary.org/en/guidebook" rel="nofollow">Guidebook section of the Open Font Library site</a> has a good <a class="freelinking external" href="http://openfontlibrary.org/guidebook/supported_licenses" rel="nofollow">overview of and links to information about various open source and free software licenses</a>.</p>
