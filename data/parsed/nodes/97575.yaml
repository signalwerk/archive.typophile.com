      Codings:
          Wiegel: P. Wiegel's old 8-bit code for German special glyphs
          UNZ1:   Subset of MUFI, details Unicode PUA codes for German special glyphs

      Version:
          The font/face version given is that of the Regular weight or closest equivalent.

      Peculiarities:
       1. In many ADF faces, AE, Ae, ae, OE, Oe and oe are ligated globally via 'rlig'.
       2. IM Fell OTF and TTF may both be installed at the same time due to slight naming differences.
