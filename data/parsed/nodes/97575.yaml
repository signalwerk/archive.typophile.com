  - id: 540513
    user: 2438
    date: 2013-01-27T20:02:00
    date_raw: 27 Jan 2013 — 8:02pm
    votes: null
    html: |-
      <p>Regarding Aller as a webfont, Dalton Maag considers 1 desktop user to be the equivalent of 1,000 unique website visitors per day, with some wiggle room for traffic spikes.<br>
      <a href="http://www.daltonmaag.com/about/web_embedding_faq.html" title="http://www.daltonmaag.com/about/web_embedding_faq.html">http://www.daltonmaag.com/about/web_embedding_faq.html</a></p>
      <p>But, more to the point of this thread, Aller is not an open source font; it's covered by <a class="freelinking external" href="http://www.daltonmaag.com/eula" rel="nofollow">Dalton Maag's standard EULA</a> (supplemented with the <a class="freelinking external" href="http://www.daltonmaag.com/about/aller.html" rel="nofollow">Aller Free License</a>), which does not allow modification. The Ubuntu font is covered by <a class="freelinking external" href="http://font.ubuntu.com/ufl/" rel="nofollow">its own open source license</a> which is based on the SIL OFL.</p>
    html_clean: |-
      <p>Regarding Aller as a webfont, Dalton Maag considers 1 desktop user to be the equivalent of 1,000 unique website visitors per day, with some wiggle room for traffic spikes.<br>
      <a href="http://www.daltonmaag.com/about/web_embedding_faq.html" title="http://www.daltonmaag.com/about/web_embedding_faq.html" class="link-external">http://www.daltonmaag.com/about/web_embedding_faq.html</a></p>
      <p>But, more to the point of this thread, Aller is not an open source font; it's covered by <a class="freelinking external link-external" href="http://www.daltonmaag.com/eula" rel="nofollow">Dalton Maag's standard EULA</a> (supplemented with the <a class="freelinking external link-external" href="http://www.daltonmaag.com/about/aller.html" rel="nofollow">Aller Free License</a>), which does not allow modification. The Ubuntu font is covered by <a class="freelinking external link-external" href="http://font.ubuntu.com/ufl/" rel="nofollow">its own open source license</a> which is based on the SIL OFL.</p>
