      <p>You can easily list the GPOS/GSUB features contained in a font with the line command <a href="http://www.lcdf.org/type/otfinfo.1.html" rel="nofollow"><code>otfinfo</code></a><code> -f</code> (<code>otfinfo</code> comes with <a href="http://www.tug.org/mactex/" rel="nofollow">MacTeX</a> and, I presume, with texlive for the PC); here are just three options for <code>otfinfo</code> (there are many more):</p>
      <pre>Usage: otfinfo [-sfzpg | OPTIONS] [OTFFILES...]
      Query options:
        -s, --scripts                Report font’s supported scripts.
        -f, --features               Report font’s GSUB/GPOS features.
        -z, --optical-size           Report font’s optical size information.
      </pre><p>and here is the relevant trace:</p>
      <pre>517 % otfinfo -f LibreBaskerville-Regular.ttf
      dlig	Discretionary Ligatures
      frac	Fractions
      kern	Kerning
      liga	Standard Ligatures
      ordn	Ordinals
      sinf	Scientific Inferiors
      sups	Superscript
      518 % 
      </pre><p>Michel Boyer</p>
    html_clean: |-
      <p>You can easily list the GPOS/GSUB features contained in a font with the line command <a href="http://www.lcdf.org/type/otfinfo.1.html" rel="nofollow" class="link-external"><code>otfinfo</code></a><code> -f</code> (<code>otfinfo</code> comes with <a href="http://www.tug.org/mactex/" rel="nofollow" class="link-external">MacTeX</a> and, I presume, with texlive for the PC); here are just three options for <code>otfinfo</code> (there are many more):</p>
      <pre>Usage: otfinfo [-sfzpg | OPTIONS] [OTFFILES...]
      Query options:
        -s, --scripts                Report font’s supported scripts.
        -f, --features               Report font’s GSUB/GPOS features.
        -z, --optical-size           Report font’s optical size information.
      </pre><p>and here is the relevant trace:</p>
      <pre>517 % otfinfo -f LibreBaskerville-Regular.ttf
      dlig	Discretionary Ligatures
      frac	Fractions
      kern	Kerning
      liga	Standard Ligatures
      ordn	Ordinals
      sinf	Scientific Inferiors
      sups	Superscript
      518 % 
      </pre><p>Michel Boyer</p>
