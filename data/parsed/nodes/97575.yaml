      <p>Guess that's right, though confusing to me. From <a href="http://www.fontsquirrel.com/license/Aller" title="http://www.fontsquirrel.com/license/Aller">http://www.fontsquirrel.com/license/Aller</a> (Emphasis added)</p>
      <p><cite>1 You, the Licensee, are granted the right by Dalton Maag to Use the Aller Font Family, Standard Edition under the terms set out in the EULA. This free licence has a Licensed Unit size of 25 Users.</cite></p>
      <p><cite>2 Use by more than 25 Users, <strong>or equivalent Website Visitors,</strong> is a breach of this Free Licence Agreement, and instead requires a commercial licence.</cite></p>
      <p><cite>Fontsquirrel Note: 1000 website visitors is the equivalent of 1 user - http://www.daltonmaag.com/about/web_embedding_faq.html</cite></p>
