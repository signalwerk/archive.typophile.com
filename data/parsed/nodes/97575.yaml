      <p>Hrant</p>
      <blockquote><p>somebody can make an Armenian extension to Roboto Slab and give it away, while I can make one and sell it</p></blockquote>
      <p>This is where a license can protects a font's freedom;<br>
      Under the terms of the OFL, you specifically cannot sell an OFL'd font (or a component of it) or sell a font derived from an OFL'd font.<br>
      I don't think the Apache license (as i understand it, so i could be wrong!) specifically prohibits selling an Apache'd font , but in practise it would probably be a non starter (if i am correct) because ;<br>
      If you were to make an Armenian extension of Roboto Slab, you would have to distribute it under the same Apache license as Roboto Slab (i.e make it 'free'), otherwise you would be breaching the font's license, naughty. So, the world would have Hrant's Roboto Slab... complete with the Apache license. So... whilst you may find a few people who will pay you to use your version of Roboto Slab, most will probably simply use it for free, under the terms of it's Apache license.<br>
      Also, of course, under the terms of Roboto Slab's license, your Armenian extenstion would possibly got folded back into the main Roboto Slab branch.</p>
      <p>Are you saying that preventing other designers from 'privatising' derivatives of free fonts is reducing social justice?  I would 100% agree with you, under certain circumstances, aka, if anyone could privatise a free font, and if anyone could free a proprietary font :) Cuts both way surely? The intellectual property contained in a free font is not of an inferior kind compared to the intellectual property contained in a proprietary font. Or do you think it is?</p>
