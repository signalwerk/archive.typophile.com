      <p>1. One risks discrepancies when working off-line with other folks' data, especially when one should be sleeping.</p>
      <p>2. FontForge defaults to Unix conventions for T1 fonts: AFM/PFA or AFM/PFB. AFM-to-PFM conversion utilities exist.</p>
