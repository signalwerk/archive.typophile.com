    html: |-
      <p>Since there now are virtually no barriers (well, besides talent and time :-) to creating good free fonts, I believe blocking people from making money from fonts actually reduces social justice.</p>
      <p>For example somebody can make an Armenian extension to Roboto Slab and give it away, while I can make one and sell it, and people can freely choose the free one or the good one. :-)  No hard feelings, and everybody is happy. If I weren't allowed to make money from it, Armenian culture just lost a good font.</p>
      <p>Virtually nobody capable of contributing something of quality to society says: "I'd like to be compensated doing this, but I'm not allowed... but let me just do it anyway." They either would do it for no compensation to begin with (so the option of making money doing it is no impediment) or would spend the time doing something else!</p>
      <p>hhp</p>
    html_clean: |-
      <p>Since there now are virtually no barriers (well, besides talent and time :-) to creating good free fonts, I believe blocking people from making money from fonts actually reduces social justice.</p>
      <p>For example somebody can make an Armenian extension to Roboto Slab and give it away, while I can make one and sell it, and people can freely choose the free one or the good one. :-)  No hard feelings, and everybody is happy. If I weren't allowed to make money from it, Armenian culture just lost a good font.</p>
      <p>Virtually nobody capable of contributing something of quality to society says: "I'd like to be compensated doing this, but I'm not allowed... but let me just do it anyway." They either would do it for no compensation to begin with (so the option of making money doing it is no impediment) or would spend the time doing something else!</p>
      <p>hhp</p>
