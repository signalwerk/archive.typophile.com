      <p>Vernon: <em>I would like to see an OFL (or OFL like license) that is stronger in it's protection of free fonts from the potential dangers of other designers or foundries taking free fonts (or parts of them) and privatising them.</em></p>
      <p>The first of the Permissions and Conditions terms of the OFL license is this:</p>
      <blockquote><p>1) Neither the Font Software nor any of its individual components, in Original or Modified Versions, may be sold by itself.</p></blockquote>
      <p>An OFL font may be bundled with a commercial product, but cannot be sold as a product in itself. I'm not sure what else you mean by 'privatising' free fonts. What is your concern?</p>
      <p>[When Ralph Hancock and I decided to make our Biblical Hebrew layout model open source, we deliberately avoided the OFL because it prevents utilisation in commercial fonts. We opted for the more liberal MIT license instead.]</p>
