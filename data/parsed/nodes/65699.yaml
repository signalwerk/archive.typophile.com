      <p>Kent, yes, it looks like I was wrong: the Romein No.1 in the <em>Proef van letteren</em> is the later ‘Long Primer Roman’, which Carter identifies as being cut in 1736 for Wetstein and records as No.56 in the Enschedé inventory. The caps in particular are very similar to No.48, and it was these I was looking at when determining that the ‘Groote Garmont Romein’ in PvL was not the same as No.48 but that the Romein No.1 might be.</p>
      <p>I think No.48 is more interesting that No.56. It seems larger on the body, and gives the appearance of being a bit narrower. Here it is, as shown in the Carter/Enschedé book in a resetting of part of the Uytwerf specimen (scroll right for the — less interesting — italic):</p>
      <p></p><div class="imageWrap"><img src="/files/FleischmannGGR48_4645.jpg"></div><p></p>
