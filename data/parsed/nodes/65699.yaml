    <p>Over in the interesting <a href="http://typophile.com/node/65631">Scotch Roman</a> thread, I mentioned Johann Michael Fleischmann’s Long Primer Roman No.48 as my favourite example of the narrow proportioned type that Fournier probably had in mind when he spoke of types <em>dans le goût Hollandois.</em> Kent Lew queried the identity of this design, looking for it in the lovely facsimile edition of the Enschedé <em>Proef van letteren</em> of 1768.</p>
    <p>I’ve now had a chance to compare the settings in that volume with those in the Harry Carter English edition of Charles Enschedé’s <em>Typefoundries in The Netherlands,</em> and hope in the next couple of days to also post some scans.</p>
    <p>The same design is differently identified in the two books. On page 195 of the Enschedé/Carter book, it is labelled ‘Groote Garmont Romein’ and identified as ‘Fig.159 Long Primer Roman No.48, cut by Fleischmann c. 1731. Resetting of part of the type-specimen of H. Uytwerf, 1733.’</p>
    <p>In the <em>Proef van letteren,</em> this design appears as ‘Garmond Romein No.1’ (with the English name given, again, as ‘Long Primer Roman’) below a setting of a different typeface labelled ‘Groote Garmond Romein’. The <em>Proef van letteren</em> also gives a different date for the design, 1736, but if this type did indeed appear in Uytwerf’s 1733 specimen, this later date must be incorrect.</p>
    <p>I am more inclined to trust the information in the Enschedé/Carter book. The ‘No.48’ is the Enschedé inventory number. The type was acquired by Enschedé in 1799, along with other early Fleischmann types, from Ploos van Amstel.</p>
