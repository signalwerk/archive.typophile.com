      <p>John — That Garmond Romein No. 1 is certainly a fine example of Fleischman’s art. Are you sure this is the same as your Long Primer Roman No. 48? John A. Lane’s notes to the 1768 specimen list this Garmond Romein No. 1 as Enschedé matrix inventory no. 56.</p>
      <p>Also, I’m not sure that particular face is the best example of what Fournier was thinking of when labeling his “dans le goût Hollandois” cuts. I think that what Fournier perceived as the Dutch penchant for narrow economy is better exemplified in Fleischman’s second and third Descendiaan Romans, for instance:</p>
      <p></p><div class="imageWrap"><img src="/files/Fleischman_Desc_6383.png"></div><p></p>
      <p>&nbsp;<br>
      &nbsp;<br>
      Hrant — In support of my contention that Fournier’s <em>goût Hollandois</em> was focused on narrowness, I offer these examples from 1995 facsimile of the 1766 <em>Manuel Typographique</em>:</p>
      <p></p><div class="imageWrap"><img src="/files/Fournier_PhilGoutHoll_4839.png"></div><p></p>
      <p>&nbsp;<br>
      (The French Philosophie is approximately the same size as the Dutch Descendiaan.)</p>
      <p></p><div class="imageWrap"><img src="/files/Fournier_CiceroGoutHoll_5289.png"></div><p></p>
      <p>&nbsp;<br>
      In this example (Cicéro is the next size larger), you can see that Fournier uses <em>gros œil</em> (large eye) to designate the larger x-height, adding <em>dans le goût Hollandois</em> for the narrower variation. Fournier also offers a variety of <em>petit œil</em> and <em>œil moyen</em> cuts in different sizes.</p>
      <p>I do think Fournier exaggerates that so-called “Dutch” quality.</p>
