      <p>I know a couple of people here in Calgary who are, but I’ve never felt the need.</p>
      <p>Interesting that you’re asking that question now: GDC’s Southern Alberta chapter, Alberta College of Art and Design alumni, and local members of Alberta Craft Council are currently being polled as part of a survey (presumably paid for by ACAD, since that was the focus of the questions) to look at educational and employment opportunities for people involved in “art, craft, and/or design” — given the scope and type of queries, they didn’t seem terribly applicable to folks who are strictly GDs....</p>
