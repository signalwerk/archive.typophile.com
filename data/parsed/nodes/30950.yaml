    html: |-
      <p>I too have toyed with the idea of becoming part of the GDC chapter here in British Columbia on several occaisons, but have been unimpressed with what they have to offer for their inflated fee. </p>
      <p>I truly believe our industry has a great deal to offer, but lacks the vision (in some circles) to effect change, make a difference and put standards in place to influence and educate the business industry. I have been to several guest series lectures, as well as other events, and while these were helpful, did not leave me more inspired.</p>
      <p>Any experienced designer in this industry will know that it can be a daily challenge to inform, educate, convince and foster good design for our clients, and our professional networking group should really focus on the weaknesses at hand, as well as promote the exciting and new artists within our field.</p>
      <p>Too often these events are not as open as they need to be, due to the competitive nature of our industry, or the environment to where we practise (too small or too large)....</p>
      <p>So, I would say NO, these chapters are not overly helpful. As one who knows former GDC presidents personally, etc. and have seen the new 2010 Olympic logo being awarded to a designer like the country fair, we have a great deal more work to accomplish.</p>
