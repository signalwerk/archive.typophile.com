    <p>This is mostly for my fellow Canadians – are any of you part of the GDC? Is the cost worth the benefits? Thoughts and opinions on it in general?</p>
    <p>When I was working in New Brunswick nobody really cared about it. My boss and 2 of my colleagues were members but no one talked about it and outside of the plaques there wasn’t much sign they even belonged to it. Where I’m at now, several people are members including the art directors. They’re trying to convince me to join but I really don’t know what the draw would be to it.</p>
    <p>Help shine some light on this if you please.</p>
