    html: <p>Nonon. No ponytails. The fact that this typeface has curves and edges in all the right places is plenty feminine. If anything I suppose the Cap R in Racers could flip down or curve under but only if it followed form of the rest of the typeface. If it is subtle enough you could do it in all three Rs ... but if it starts to look like decoration I wouldn't do it. Perhaps you could use a fiery hot pink with nice bold black outlines and shadows or something, no pony tails .... unless it looks like a swash first and a ponytail last. <br> <br>I agree with Stephen's comment about spaces/gaps. <br> <br>-- <br> <br>hrant ... i hit 115 the other day (not that fast I guess, compared to official race car driving). some punk thought he could out race me. i think he was flirting, but my mind was elsewhere so i was little mean (i suppose). felt good and then i realized how stupid it might have been. i think i need to find a local race track.</p>
