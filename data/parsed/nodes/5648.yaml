    html: "<p>Hrant suggested aiming for a pun! I agree. Considering the topic: the unusual mix of women and racing cars ... and considering this is a school project (where you should try be as radical in your solutions as you can) ... I don't think you should be satisfied with 'just' a namemark with type that merely hints racing. <br> <br>Go for the visual pun. Well, it could be a pony-tail (in itself a very good choise, connotating swiftness, youth, 'rebellion') replacing a part of the typography ... or something similar. <br> <br>I can see a solution here with a very humorous pun ... something like Luballin or Pentagram ... <br> <br>-- <br>Soren O</p>"
