    html: "<p>Tiffany -- whether I should be swash first and ponytail last or the other way round, I'm sure the pun solution could be done successfully. <br> <br>And of course it can be done 'your' way, with the typography merely hinting the feminine. Only, I think these hints are so subtle that you could say: the typography says racing but it doesn't say girls ... on the other hand, it doesn't say anything irrelevant. <br> <br>Whether or not it should be the pun or the subtle solution, would depend on the media and the target audience. <br> <br>-- <br>Soren O</p>"
