    <p>I'm working on a wordmark for a documentary tv series about women race car drivers. I'm aiming for something that references old-style race car graphics that doesn't alienate current fans of racing. This is part of an internship/student summer job, so keep in mind it's student level work! <br> <br>I would love any feedback, comments, suggestions for really making this come alive, it'll be used for print, web and merch. Thanks!</p>
