    html: "<p>This seems to be an emerging topic all of a sudden. LA Weekly did a feature story about racer chicks recently, and Speedvision is plastered with this stuff now. Anyway. <br> <br>Calliope, I don't think this is racy enough. You need more chaos... or dare I say, fury. <br> <br>And here's an idea to promote the \"genderness\": turn the top-left serif of the big \"R\" into a pony tail, maybe one that turns into flames at the tip(s). Too cheesy? <br> <br>-- <br> <br>And Tiffany, what's \"fast\"? <br> <br>&gt; They sit in the inside lane and basically <br>&gt; expect you to pass them on the right. <br> <br>That's when you pass them on the left anyway. <br>It's easier at night though: get yourself some 100W Hellas with the left one pointed to the left mirror and the other to the rear view, move slghtly to the left, then roast corneas as needed. You'd be surprised at the quick and easy results. Except for the ones who raise <i>both</i> hands to cover their eyes - those you should just go around quickly. After all the only safe car is the one behind you. <br> <br>hhp <br></p>"
