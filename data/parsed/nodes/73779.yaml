    html: |-
      <p>Definitely not a font. It's quite lovely, though.</p>
      <p>There don't seem to be a great deal of script fonts around that approximate this "texture" of handwriting, if you like. Blambot's After Dark BB (<a href="http://new.myfonts.com/fonts/blambot/after-dark-bb/">http://new.myfonts.com/fonts/blambot/after-dark-bb/</a>) has big caps and a small, delicate lowercase, but is quite scrappy and not as elegant as your example. There's always something like Johann Sparkling (<a href="http://new.myfonts.com/fonts/itc/johann-sparkling/">http://new.myfonts.com/fonts/itc/johann-sparkling/</a>), which is quite open but more oblique and swooshy than After Dark.</p>
      <p>Here are a few more suggestions:</p>
      <p><a href="http://new.myfonts.com/fonts/ef/petras-script/">http://new.myfonts.com/fonts/ef/petras-script/</a><br><a href="http://new.myfonts.com/fonts/scholtz/arabesque/">http://new.myfonts.com/fonts/scholtz/arabesque/</a><br><a href="http://new.myfonts.com/fonts/sudtipos/sudestada-basic/">http://new.myfonts.com/fonts/sudtipos/sudestada-basic/</a></p>
      <p>Alternatively, get a pen and start writing!</p>
      <p>-NJ</p>
