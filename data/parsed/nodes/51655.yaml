    <p>Hi all,</p>
    <p>As things are really slowing down with my freelance work, I am pondering on offering portfolio photography services as a side gig. My question to you is what would you expect the service to cost? I am thinking a flat fee for photography, clean-up, and resizing 12 pieces with color correction and isolation as extras. What do you think? </p>
    <p>Below are some samples that I shot for my own portfolio. </p>
    <p>Any input is much appreciated, thanks!</p>
    <p>Ace</p>
