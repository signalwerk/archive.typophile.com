      <p><cite> why did Latin languages leave the tradition of connected scripts and adopt separate letters in printing? </cite></p>
      <p>I don't want to go off-topic, but I think this talk brings us to a good point by where a balanced understanding of what we look as "culturally respectful" may be jointly developed, and to see how the evolution of alphabetic scripts should be considered when each one is related to the others.</p>
      <p>For Latin, actually, it was a gradual progression. Karsten points out one of the important reasons, that moveable types were perfectioned by Gutemberg while in Germany the leading style to compose pages in calligraphy was Textura, which, for its peculiarities, proved to be very good for this. It should be reminded, however, that Gutemberg's 42-line bible had a devastating number of ligatures. Modular as it may look, an early Gutemberg page had a complexity similar to the one of certain Arabic calligraphy. Vocalization may be more important in some languages (like Hebrew, where you have mostly consonants), but it shouldn't be forgotten that – as long as conventions take place – it becomes automatic for a native reader to distinguish words in context without the need of expliciting the accents.</p>
      <p>To see how the evolution happened it might be enough to look at the books progressively printed by Schweinhem and Pannartz at Subiaco. I have a good iconographic documentation on those, in an Italian book of the 1940s about the history of printing.</p>
      <p>For Arabic moveable type, I think it would be great to have a basic history written by some authoritative native designer, but in the meanwhile a question occurring to me is: did you have some kind of exposed writing which eventually led to calligraphic styles in order to write quicker and on different supports (a thing similar to what happened to Capitalis Romana down to Capitalis "Cursiva" (skeletal) and the Rustica)? Does Arabic have a paleography lineage linking exposed writing styles to early notes and manuscripts that could be followed? I am sure of that…</p>
      <p>Sorry for bringing too many points to the discussion… We should develop just one of them.</p>
