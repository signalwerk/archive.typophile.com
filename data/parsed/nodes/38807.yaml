      <p>Vladimir,  Indeed, we are not disagreeing at all.  I just pointed out these issues so that your statement is not misunderstood.  Yes legibility is very necessary for certain applications, but not as necessary in others. </p>
      <p>&gt;&gt;Some fonts in online newspapers have letter-dots that are virtually invisible- yet there is no public outcry against that - surely that is a case of a “bad” type in the sense that it is not fit for the use it was designed for.</p>
      <p>Yes. This is true. Similarly, I think modern Arabic typography sacrificed plenty of the glory of Arabic calligraphy without real typographic gain. They abandoned calligraphy but still vigorously hold on its old unnecessarily restricting rules. Honestly, I do not think many of the modern Arabic fonts are necessarily more legible just because they follow the attached four glyphs per letter model. </p>
      <p>-Saad</p>
