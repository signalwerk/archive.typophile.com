      <p>Try finding it via <a href="http://blogs.adobe.com/typblography/" title="http://blogs.adobe.com/typblography/">http://blogs.adobe.com/typblography/</a> </p>
      <p>I don't think you can avoid ugliness and illegibility on screen at small sizes. 8pt on screen gives you 11 pixels of vertical space, and the most common marks as well as the tallest ascenders and descenders need to fit in that space. You either simplify the writing system (uglification to most readers) or stick with traditional forms (which render illegibly at that size). Arabic, like many writing systems needs more pixels than the software engineers give it. </p>
      <p>It would be wonderful to be proven wrong here, and you could do that by first pushing pixels within the 11 pixel limit, before moving to outlines that work for those shapes - kind of like what Matthew Carter and Tom Rickner did for Verdana.</p>
