      <p>Dear Saad - Thank you for the most interesting glimpse of developments of the thanab or tail concept for common endings of Arabic glyphs. Since he tried his utmost to minimize the number of master shapes Saggar could have used one size for the hamza.  Apart from the convenience it must have given metal type setters, it may also have helped standardize glyph design within a given font.  However these days with the convenience of computerized font design, automated ligatures in word processing these considerations are perhaps obsolete. Saggar's website has excellent examples of calligraphic artworks but only a few words written with his fonts.</p>
      <p> It is obvious that there were quite a few people active in Arabic typography in the last fifty years - I wonder it Huda's book covers their work in detail. By now there are so many new and old fonts I feel it is necessary that there be a serious attempt at critical analysis and discussion about what makes a good Arabic font.  A designer should feel that the public appreciate good design and that one's fellow designers give honest and useful feedback. Incidentally Basra seems to be a place for creative people now I know of two typographers from there!</p>
