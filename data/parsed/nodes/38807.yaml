      <p>sii, Does localization refer to how local readers reacted to the font?  Analyzing the three fonts you mentioned was educational for me - each has good and bad points. </p>
      <p>The Microsoft Sans Serif Arabic has clean letter-forms, but is too condensed, and its diacritical marks (harakat) are messily places in between the letters.</p>
      <p>The Tahoma Arabic has an uncluttered airy appearance that make it legible at small sizes, but the letters are limp and characterless - a bit like comic sans. The isolated nun floats incongruously above the horizontal midline, and its harakatb clash between lines. The bold is bloated but the accompanying dots are tiny.</p>
      <p>Segoe Arabic with its large shapes has a certain elegance and originality. The variable-thickness lines read poorly at very small sizes, and some letter-combinations (the initial 'ain and middle noon) are much too close together.</p>
      <p>All three fonts suffer from two fundamental problems: 1- The dots on the letters are tiny. This is inexcusable, since 15 out of the 26 Arabic letters rely on dots to distinguish them from their dotless twins, and on a monitor dots almost disappear at small sizes. 2- Within the same font some letters (like the lams) are purely equal-width, and some (like the kaf in all three) combine thick and thin strokes. The reader, used to the way naskh or thuluth script changes thickness naturally as it curves, or according to the stroke angle, would feel uneasy with these inconsistencies.</p>
