      <p>Hello Vladimir</p>
      <p>&gt;&gt;3. The letters should be connected because this gives a unique word-form or pattern for different words.</p>
      <p>Not unnecessarily required. Isolated, well-designed, letters can do same.</p>
      <p>&gt;&gt;But remember that modern Arabic has to written and not just read.</p>
      <p>Yes, written would make more sense connected, of course. But I think we should not hold progress in Arabic typography and Arabic script learning for the sake of handwriting alone. One can learn shapes isolated first and even write them that way, and learn cursive later. The point is that we need to eliminate restrictions.</p>
      <p>-Saad</p>
