      <p>Karsten -<br>
      What you are saying makes sense: movable-type printing became possible because blackletter consisted of separable letters, a natural and logical metamorphosis. Arabic's experience with type was uneasy at first: the scripts were too complex to chop into units connected horizontally. But then eventually this lead to the new Arabic typography where the letters became simplified in the extreme to suit the technical limitations of printing methods using consecutive glyphs. Meanwhile font designers for Arabic continue working in different directions - On the one hand type imitating calligraphy whether by designing thousands of ligatures, or by magical computerized methods of juggling a couple of hundred shapes as Tasmeem does. Next to these two groups are the majority of Arabic font designers, creating all sorts of designs in a bewildering variety of styles, just like font designers are doing in many other languages. Human ingenuity always finds a way!</p>
