      <p>Vladimir wrote:</p>
      <p>&gt;&gt;By now there are so many new and old fonts I feel it is necessary that there be a serious attempt at critical analysis and discussion about what makes a good Arabic font.</p>
      <p>Great point, but it is very risky to put it in term of "good" and "bad". We do not need to create rules. Of course, one can evaluate technical quality of font design, but this should not be based on the so called "script rules". What is needed in Arabic typography, in my opinion, is "open-mindedness" and return to our ancestors' tradition of renewal and creativity. We must open the doors wide to options to ensure a decent pool of fonts and let users and market decide. Attrissi, a Lebenese type designer, once wrote that the main problem with Arabic type is availability. I strongly agree. In Latin you have millions of fonts to choose from, while in Arabic we still live in the mentality of "this is allowed and that is not". One can only see how different Diwani calligraphy style is from Kufi to appreciate what openess and renewal did to Arabic a thousand years ago.</p>
      <p>Today, we need to get rid of the "mentality of censorship." Believe it or not, most of those in effective positions in Arabic typography today do not only actively censor their colleagues' work, like mine (which is "understandable") but they even censor traditional Arabic calligraphic fonts like Aziz's! I think it is crucial to think that a font liked and used by 1% of users is as important and justified as that liked and used by 90%. Especially in the age of digital typography, fonts are not only about printing.</p>
      <p>&gt;&gt;Incidentally Basra seems to be a place for creative people now I know of two typographers from there!</p>
      <p>Any great poets, artists, writers!</p>
      <p>-Saad</p>
