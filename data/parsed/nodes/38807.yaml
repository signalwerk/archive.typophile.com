      <p><cite> Similarly, I think modern Arabic typography sacrificed plenty of the glory of Arabic calligraphy without real typographic gain. They abandoned calligraphy but still vigorously hold on its old unnecessarily restricting rules. Honestly, I do not think many of the modern Arabic fonts are necessarily more legible just because they follow the attached four glyphs per letter model. </cite><br>
      This is very interesting Saad, could you explain better what you mean? I believe Latin should not be strictly identified with a "stranger" culture by Arabic users not using it.<br>
      On a side note: I'm eager to have a look to what you are doing with numerals. I just bought one of your faces on MyFonts to have a look…</p>
      <p>In another thread, Vladimir wrote:<br>
      <cite> I guess I am one of those people who feel that the tradition of writing connected words is too important to get rid of, and that connected words create a ’word shape’ that aids legibility. </cite></p>
      <p>Talking of Arabic related to calligraphy, I think it should not be forgotten that the Carolingian minuscule (as many so-called National Writings preceeding the renaissance) was almost a connected script. Then, we should remind the Cancelleresca cursive was often as complex as the example of Arabic calligraphy you so rightfuilly cherish.</p>
      <p>If we look at what happened in typographic evolution, we can see how Latin evolved its  fisionomy through writing in long centuries. I just think such a thing can't be "forced" on Arabic, but I inversely think experimentation by non-Arabic people could be less "compromising" than what it might be felt (in history, any culture has always been enriched by a communion with others).</p>
