      <p>Vladimir -- <cite>why did Latin languages leave the tradition of connected scripts and adopt separate letters in printing?</cite></p>
      <p>Pure speculation:<br>
      Maybe this is the wrong question. I doubt that "separate letters" were "adopted" for printing ("adopted" meaning that someone had a choice and made a decision). At the same time it may not be an accident that printing with separate letters (but don't forget the many "ligatures" in Gutenberg's case) was introduced at a moment when blackletter ruled in representative texts. Blackletter was "connected" too in a way, producing a tight web or texture, and it required special markers so one could tell apart an i from an n. But blackletter was "connected" in such a way that it <em>could</em> be broken up into segments which, when put together again, again produced an image of "connectedness". It could have been a combination of (a) Gutenberg seeing a market for multiple copies of representative texts produced in a quicker way than writing or cutting a block per page, and (b) the fact that representative texts were written in blackletter, which <em>allowed</em> him to make his invention in the first place. (I.e. the dominance of blackletter in these texts, which he wanted to produce, made him <em>realize</em> that letters could be separated. Rather than inventing a technology from scratch and then find a matching writing style.) Since printing with separate letters had proven to be the way to go, when moving South, letterforms had to be adjusted so to look more familiar to South Europeans' eyes. As far as I know, there was no sudden jump from using blackletter to using round, light roman type, but rather blackletter shapes were "romanised" in small steps.</p>
