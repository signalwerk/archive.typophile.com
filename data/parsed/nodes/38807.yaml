      I meant the Segoe UI font found on Word 2007 and Vista applications.</p>
      <p>&gt;Since 1961? I wonder what does it look like!<br>
      Well as a student I became interested in the Bauhaus and lettering and at that time I felt Arabic type needed to develop in that direction. I have only recently resumed my interest in font design.  Here is a description of my typography work (excerpted from an article "Influences and Motivations..." on my website) , written around 1985</p>
      <p>A MODERN ARABIC TYPEFACE</p>
      <p>One of my first projects was a study of Arabic typography. Although Arabic calligraphy is famed for its glorious perfection as an ancient art form, its transformation into printing type caused several technical and aesthetic problems, since type makers simply tried to imitate the calligraphic style without making the necessary adjustments. For example, dots, the carriers of important information in Arabic script, became almost invisible. Inspired by the writings of the English typographer Eric Gill, who advocated a simple, clean, sans-serif type design, and by firsthand studies at the British Museum of' an early Koran written in Kufic script, I designed and patented a general-purpose, simplified Arabic typeface that I named after Jerusalem, Al-Quds [1,2] , shown in Fig. 2. Although such 'modern' Arabic lettering without distracting ornamentation was popular for shop signs and product names, a suitable typeface for printing using simplifications of this sort (such as Al-Quds) had not been designed. Eventually, modern typefaces became popular for magazine headlines, but unfortunately Al-Quds is not yet available as an Arabic printing type.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/alquds sample_4412.jpg"></div><p></p>
      <p>Fig. 2. Sample of Al-Quds Arabic printing font (c. 1972). Only 56 characters are needed to set an Arabic text with this type-face.<br>
      _________________________________________________<br>
      The patent referred to is:<br>
      <a href="http://www.ne.jp/asahi/tamari/vladimir/arabictyppatent.pdf" title="http://www.ne.jp/asahi/tamari/vladimir/arabictyppatent.pdf">http://www.ne.jp/asahi/tamari/vladimir/arabictyppatent.pdf</a></p>
