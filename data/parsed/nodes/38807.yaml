      <p>&gt;&gt;“open-mindedness” and return to our ancestors’ tradition of renewal and creativity. We must open the doors wide to options to ensure a decent pool of fonts and let users and market decide.</p>
      <p>Saad - Amen to that. Creativity is important and one should not use obsolete rules to judge fonts.  We are living in an era where almost anything goes and people are enjoying unprecedented freedom to make all sorts of fonts. Fine I do not wish to spoil the fun, and as you say the mentality of "this is allowed" or not is stifling. What makes us say a thuluth hand is fantastic, while another gives you an uneasy feeling of imperfection and unease?  It is that sense of the "educated eye" that has to be transferred to those who design fonts, use them or read them.  Some fonts in online newspapers have letter-dots that are virtually invisible- yet there is no public outcry against that - surely that is a case of a "bad" type in the sense that it is not fit for the use it was designed for. You point out the creativity of the old scripts, but they developed over centuries! Now everything is happening too fast, and I was expressing my worries about the situation in general.  How fonts are used is another important aspect. For both text and display surely legibility is a necessary minimum standard?  I see that we are not disagreeing on most things Saad, and you know more about the market and current usage.</p>
