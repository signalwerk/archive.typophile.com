      <p>Thank you for sharing the information about your UK patent of 1963 regarding al-Quds font. In my upcoming article for "Visible Language", titled "Anatomy of an Arabetic Type Design", I mentioned briefly a similar Patent in 1971 by the prominent Iraqi type designer from Basrah living in Paris:  Muhammad Said al-Saggar <a href="http://saggar.com" title="http://saggar.com">http://saggar.com</a>  He called it "Saggar's Alphabet" or الابجدية العربية المركزة. A font was developed for it and it was used in the seventies by a major Iraqi newspaper called "al-Thawrah".  Thomas Milo, a well-known Arabic and Islamic type designer uses same method as yours and Saggar to create most sophisticatedly calligraphic fonts. His latest product is Tasmeem.  Here is a gif of Saggar's alphabet: (Notice: the sample text is set with the his alphabet)</p>
