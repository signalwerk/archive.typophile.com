      <p>Saad- I missed seeing your last comment until now.<br>
      &gt;&gt;legibility is very necessary for certain applications, but not as necessary in others.<br>
      Very true. Neither is consistency- in one of your fonts the aleph and lam have totally different shapes I thought that was original and fun because it was clearly a font meant to be used in a decorative way. </p>
      <p>&gt;&gt;I think modern Arabic typography sacrificed plenty of the glory of Arabic calligraphy without real typographic gain. They abandoned calligraphy but still vigorously hold on its old unnecessarily restricting rules.</p>
      <p>In general I cannot agree with you more, but as they say the devil is in the details. Perhaps one good rule is having good taste in the design, and again that is not at all easy to define. One example of what you call "typographic gain" might be text legibility. </p>
      <p>Three suggested 'rules' for legibility may be<br>
      1-Continuity in the traditional letter shapes - ie nothing too eccentric compared to traditional letters. Not only will readers feel comfortable with forms they know, but also there is a wisdom in following the 'design logic' of a script honed by generations of writers and readers over centuries.<br>
      2-Each letter form should be as different from the others in the same font as possible.<br>
      3- The letters should be connected because this gives a unique word-form or pattern for different words.</p>
      <p>&gt;&gt;I do not think many of the modern Arabic fonts are necessarily more legible just because they follow the attached four glyphs per letter model.<br>
      Not at all - minimizing the number of glyphs for a given letter is the modern trend.  But remember that modern Arabic has to written and not just read. For example fonts used to teach Arabic in schools should be easily 'copied' as handwriting. This is one thing I tried to do in my AlQuds font. The initial ain becomes a medial ain and a final in one continuous line. Some modern experimental fonts use the initial ain as a medial one and that makes it awkward and even ugly as handwriting.</p>
