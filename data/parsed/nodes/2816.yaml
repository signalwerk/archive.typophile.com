    html: <p>Having spent an afternoon visiting Jim’s studio last fall (during <span class="caps">AT</span>ypI in Vancouver), I can say that this would be a great opportunity for any serious student. <br><br>I only wish that I’d had the chance to stay on a little longer and do something like this with Jim — get my hand’s dirty, so to speak. But even just watching was a welcome education.  <br><br>Jim, if you weren’t all the way over on the other side of the continent, I’d be there in a heartbeat. If I can ever justify the trip again, I’ll let you know. <br><br>— Kent. <br></p>
