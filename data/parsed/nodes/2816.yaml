    html: "<p><i>But it can be duplicated much better by hand than by pantograph.</i> <br> <br>Depending on the nature of the design, the best result might be achieved by a combination of pantograph and manual cutting. The pantograph is extremely good at duplicating proportion and weight, while the graver is better at cutting fine details. One could probably cut most of a punch on the pantograph, and then take a graver to it to get the sharp corners. <br> <br><i>Anyway, John, I'm wondering: is there any \"before &amp; after\" stuff to compare?</i> <br> <br>If you wanted to compare immediate before and after material, rather than comparing something like the 1924 specimen to the 18th-century sheets, you would need to locate some material printed in the mid-19th century by one of those 'few select clients' to whom James Mosley refers. This would give you an idea of the state of the matrices just prior to the recutting. Then you would need to locate material printed in the last decade of that century, from newly cast type, in order to compare the recutting. I'm sure appropriate stuff exists. <br> <br>Something to take into consideration, though, is the changing fashion in typography that occured at the very end of the 19th-century. Morris and his imitators introduced a fashion for dark, heavy types, and this resulted in some printers deliberately overinking traditional types such as Caslon. The editions of the Chiswick Press from the beginning of the 20th century, which kickstarted a major Caslon revival in Britain, are a good example of such overinking combined with deep rag paper, giving a really heavy appearance. So locating material printed after the recutting that matches the print conditions typical before the recutting might be difficult.</p>"
    html_clean: "<p><i>But it can be duplicated much better by hand than by pantograph.</i> <br> <br>Depending on the nature of the design, the best result might be achieved by a combination of pantograph and manual cutting. The pantograph is extremely good at duplicating proportion and weight, while the graver is better at cutting fine details. One could probably cut most of a punch on the pantograph, and then take a graver to it to get the sharp corners. <br> <br><i>Anyway, John, I'm wondering: is there any \"before &amp; after\" stuff to compare?</i> <br> <br>If you wanted to compare immediate before and after material, rather than comparing something like the 1924 specimen to the 18th-century sheets, you would need to locate some material printed in the mid-19th century by one of those 'few select clients' to whom James Mosley refers. This would give you an idea of the state of the matrices just prior to the recutting. Then you would need to locate material printed in the last decade of that century, from newly cast type, in order to compare the recutting. I'm sure appropriate stuff exists. <br> <br>Something to take into consideration, though, is the changing fashion in typography that occured at the very end of the 19th-century. Morris and his imitators introduced a fashion for dark, heavy types, and this resulted in some printers deliberately overinking traditional types such as Caslon. The editions of the Chiswick Press from the beginning of the 20th century, which kickstarted a major Caslon revival in Britain, are a good example of such overinking combined with deep rag paper, giving a really heavy appearance. So locating material printed after the recutting that matches the print conditions typical before the recutting might be difficult.</p>"
