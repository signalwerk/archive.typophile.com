    html: '<p>Hrant and anyone else who is interested in the idea: <br><br>Somehow I have to get some people to come here to work with me at my studio/foundry for a few days. My intention is not to prove any point of mine, because I don’t need to have everyone share my beliefs, but rather to give any interested typographer the opportunity to  make a piece of type by: hand cutting a punch, pantographing a punch or pantographing a directly-cut matrix. And as a part of the pantographing process, to additionally make a pattern. The ﬁnal steps: to cast the character and print it. After all this the diﬀerence in the three approaches to cutting type would be clearly obvious to the participant. <br><br>The workshop would require a minimum of four or ﬁve days, (there are a couple of <span class="caps">B&amp;B</span> spots in the neighbourhood) so it would cost a person a bit for accommodation and travel. <br><br>If this snowballs into anything meaningful, I would like to approach Dan Carr to see if he would like to travel here on a cheap ﬂight and teach the hand punchcutting part. <br><br>I think if Dan will participate, I have enough equipment and tools to take ﬁve people. <br><br>For myself, I would do it free of charge, but Dan would need to be paid something for his time and travel. <br><br>If there is any interest in this idea, my email is: <a href="mailto:rimmertype@shaw.ca">rimmertype@shaw.ca</a> <br><br>Comments? <br><br>Jim Rimmer <br><br></p>'
    html_clean: '<p>Hrant and anyone else who is interested in the idea: <br><br>Somehow I have to get some people to come here to work with me at my studio/foundry for a few days. My intention is not to prove any point of mine, because I don’t need to have everyone share my beliefs, but rather to give any interested typographer the opportunity to  make a piece of type by: hand cutting a punch, pantographing a punch or pantographing a directly-cut matrix. And as a part of the pantographing process, to additionally make a pattern. The ﬁnal steps: to cast the character and print it. After all this the diﬀerence in the three approaches to cutting type would be clearly obvious to the participant. <br><br>The workshop would require a minimum of four or ﬁve days, (there are a couple of <span class="caps">B&amp;B</span> spots in the neighbourhood) so it would cost a person a bit for accommodation and travel. <br><br>If this snowballs into anything meaningful, I would like to approach Dan Carr to see if he would like to travel here on a cheap ﬂight and teach the hand punchcutting part. <br><br>I think if Dan will participate, I have enough equipment and tools to take ﬁve people. <br><br>For myself, I would do it free of charge, but Dan would need to be paid something for his time and travel. <br><br>If there is any interest in this idea, my email is: <a href="mailto:rimmertype@shaw.ca">rimmertype@shaw.ca</a> <br><br>Comments? <br><br>Jim Rimmer <br><br></p>'
