    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HistorismBorder2D_720x360_00_4805.png"></div><p></p>
    <p>Historism Border 2D is a collection of ornaments organized into four font files. The ornaments can be divided into two groups: Friezes (borders) and Rapports (patterns).</p>
    <p>All the ornaments attribute to the period of Historicism, which prevailed in the art in the middle of 19th century. The ornaments are based on elements of architectural decorations of Lviv buildings in Ukraine. The author personally collected the material and embodied it in the font. This makes the font exclusive and unique among other digital collections of ornaments.</p>
    <p>These patterns perfectly suit to be used in the design of invitations, diplomas, certificates or other printed materials in classic style design.</p>
    <p>More samples in the <a class="freelinking external" href="http://issuu.com/2d-studio/docs/historismborder2d?mode=window&amp;backgroundColor=%23222222" rel="nofollow">PDF</a>file</p>
    <p>on <a class="freelinking external" href="http://new.myfonts.com/fonts/2d-typo/historism-border-2d/" rel="nofollow">MyFonts</a></p>
