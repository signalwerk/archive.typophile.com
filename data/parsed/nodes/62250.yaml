      <p>Matthew Butterick does recommend Minion, so maybe Minion Web is something for you to look at. </p>
      <p>If the only reason you decided to use Flash was font supporty you should also consider @font-face or a sIFR-like technology. More info in: <a href="http://typophile.com/node/57934" rel="nofollow">this</a> thread. Most foundries allow “secure” web embedding technologies like sIFR.</p>
