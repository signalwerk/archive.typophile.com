    html: |-
      <p>"Rembember that you need good interaction with search engines"</p>
      <p>More important, you need good interaction with end-users/potential customers. Flash isn't always (often USUALLY) the best option for that. </p>
      <p>Whatever you do, though, err on the side of the type being large as it's not necessarily easy for end-users to resize flash rendered type. Given that, if you're perhaps going 14px or so, you might find that a lot of the faces will meet your needs.</p>
