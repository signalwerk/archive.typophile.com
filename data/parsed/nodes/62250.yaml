    html: "<p>@frode frank: The use of Flash was just something I was given in the brief, not a decision on my end. I'm just handing my .psds off to a developer. I've seen many workarounds for SEO in Flash, like if you keep all your txt and html files that get fed into your .swf file(s) in one clear folder, when the google crawlers come knocking, they don't have too much trouble going through these files. Of course, you are right that Flash is not the best when it comes to SEO, but since this firm is more the kind people specifically seek out, and less the kind on billboards and bus stop benches that will get you a cash settlement today, I don't know that they need to come up on google's first page when you search for legal advice.</p>"
