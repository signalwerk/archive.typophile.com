  html: <p>I'm working on a site for a law firm. This is not something that's my usual forte -- both web design and conservative, traditional design, that is. This site is being built in Flash, so I can use whatever font(s) work, but a lot of the obvious traditional serifed faces seem really hard on the eyes when displayed on screen, and a lot of the sans faces that look crisp on screen feel too modern, tech, or casual. Any suggestions?</p>
