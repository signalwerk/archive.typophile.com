      <p>Oh, Chris, two more things!</p>
      <p>1. Change the name. Remember that old DTP rule, "never use a typeface named after a city"? I wouldn't want your design to fall victim to such retrograde silliness. Also, Weimar as a city (and even as a government) has such a varied, rich history. It simply cannot be distilled into a specific style. And Weimar was not fond of the Bauhaus when it was there. The Bauhäusler stomped over the city's rich art historical teaching tradition (said the bureaucrats at the time). After four years, the city council (or was it the state of Thuringia?) cut all their funding. That's why Gropius moved the school to Dessau, where he got a sweetheart deal with the city's Mayor. How about a name like "Weimar School" or "Weimar Poster"? That last one would be a double whammy with internet searches. And keyword the font with "Bauhaus"… then money will pour in.</p>
      <p>2. Put this font on MyFonts.com ASAP. You'll probably want to do some minor tweaks to its design, but really, this isn't such a time consuming face. But I bet you that it will sell on a platform like MyFonts, as long as you keyword it right and give it a nice font flag (something with that Bauhaus head…).</p>
      <p>OK, I really shouldn't be giving you this much free advice.</p>
