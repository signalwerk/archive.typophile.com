      <p>I don't have enough practical experience to tell you what will happen with names in font menus. I see this face as a sort of supreme marketing venture… why not through even more words at its name… "Weimar Plakat 1923"? When you expand it to a wicked cool OpenType version, it will naturally have to be called "Weimar Plakat 1923 Pro", at the <em>very</em> least.</p>
      <p>The lowercase is ok, but it is not as "wow!" as the UC and SC. The UC/SC forms have something "new" to them, even though they aren't really new, per se. They feel powerful somehow. The lc is like dozens of lc's out there in digital font land. There may be little to do about that, though. The Roman alphabet's lc forms are more complicated than its uppercase, and the strokes have to fit into a smaller space. Therefore, its no surprise that lots of people come to similar conclusions when faced with a brief as tight as the one you've set for yourself.</p>
    html_clean: |-
      <p>I don't have enough practical experience to tell you what will happen with names in font menus. I see this face as a sort of supreme marketing venture… why not through even more words at its name… "Weimar Plakat 1923"? When you expand it to a wicked cool OpenType version, it will naturally have to be called "Weimar Plakat 1923 Pro", at the <em>very</em> least.</p>
