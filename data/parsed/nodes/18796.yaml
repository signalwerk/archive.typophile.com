      <p>The P22 De Stijl font is an excellent one and I highly recommend it. I Purchased it among several others when I first started trying to reproduce the poster. It didn't match well enough so I started my own. De Stijl is similar (but caps only) and it also is another constructivist face which harkens to that era. It doesn't do what I wanted exactly so I am doing my own OTF face including lower case, small caps, and a full set of diacritics with CE (adding Cyrillic later).  Most people probably would not find the same need for a difference admittedly. The Bauhaus school in Germany and the De Stijl movement in Holland had many parallels as well as the Russian Constructivists. The very limited palette of tools in the rectilinear only character system used by all of them makes for much overlap. Differences come in ratios m ore than style. I found the ratios in the original 1923 poster that I used as a model to be particularly appealing.</p>
      <p>ChrisL</p>
