      <p>hi chris,<br>
      nice work IMO. What caught my eye on first sight is that esp. the punctuation marks and currency symbols (esp. the top left part of the UKP symbol)don't feel exactly bauhaus to me, they seem more like they've come from a screen font, meaning to say that, at least for my taste, you took the constructivist approach a little too literal/too far here. Just a thought tho. And the fact that the caps have no round parts at all, again in my humble opinion, does not necessarily mean that there shouldn't be any round parts at all, for example the copyright symbol, @ etc. just feel too technical/somewhat computer-related to me when strictly based on square and 90 degree angles.<br>
      On a different note: great to see you took the effort to design a german dbls, but that character/lyph does ONLY exist in lower case (although you can see it crammed within caps over here in germany every day, but that's WRONG!). German dbls is to be replaced by two capital S when you're setting/writing caps only, and that goes for small caps too, of course. But that inevitably leads to the question if you're planning to add lower case? I for one would love to see that, and it might be an interesting task to design lower case glyphs within such a formally restricted system...</p>
      <p>best,<br>
      franz</p>
