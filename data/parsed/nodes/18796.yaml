    <p>Miss Tiffany's post on Constructivist type got me interested in looking at more constructivist faces. </p>
    <p><a href="http://typophile.com/node/18503">http://typophile.com/node/18503</a></p>
    <p>I ended up buying several. I was looking for one that would match a JPEG of a poster I saw online at the Bauhaus Museum.  I wanted to make a reproduction of the poster. Nothing worked out so I spent half a day making my own Bauhaus type which I call "Weimar" in honor of the poster. Today I added Latin 1 extension glyphs.  I am attaching a PDF of the typeface sample which includes the little JPEG of the 1923 poster that got me started and the reproduction I ended up making (using my new font).</p>
    <p>I just added Greek and Cyrillic.</p>
    <p>ChrisL<br><img src="/sites/default/files/old-images/dezcom-Weimar.png"></p>
    <span class="file"><img class="file-icon" alt="PDF icon" title="application/pdf" src="/modules/file/icons/application-pdf.png"> <a href="http://www.typophile.com/sites/default/files/old-images/Weimar%20Cyr_Greek.pdf" type="application/pdf; length=86596">Weimar Cyr_Greek.pdf</a></span>
