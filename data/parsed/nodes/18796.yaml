      <p>Ich stimme Franz zu.</p>
      <p>Chris, I recently made a similar typeface, based on 1902 Offenbach geometric forms rather than the later strict constructivist stuff. In the art nouveau era, designers seemed to be less rigid, and were willing to break their own rules. I think that some of you non-alphabetic symbols would benefit from diagonals. Then they would feel old and German instead of new and internet-techy. If you keep the glyphs with the diagonals fat and zero-contrasty, I'm sure that they'll fit right in.</p>
      <p>I also heartily applaud Franz's German dbls comment make that two s's instead. If you really want a ß in your face, you'll have to design a complete, real lowercase to go along with it. Which would be super, really, although the triad combination of Uc, SC, and lc is somehow so NOT Bauhaus…</p>
