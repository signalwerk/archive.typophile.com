      <p>yes, great piece of work chris. when do you eat and sleep by the way? :-)<br>
      for the Zero/O-Difference, yes, the diagonals do look a bit odd, possibly it's enough to just have the O wider than the zero, and if there's a danger of confusion, context should make things clear. I think it's very unlikely a face like this to be used for complex information design application with complex tables and the like, where danger of confusion is certainly higher. Even more so, in applications like posters and the like, even identical zero and O forms might work. To cut it short, i'd drop the diagonals on your zero.<br>
