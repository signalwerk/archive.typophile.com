      <p>@Hrant: If we relied on your definition of lower case g and the difference between it and the number 9 the world would stop turning. Wonderful Hrant, I don't know what I would have done if I had remained on those hot coals burning my pretty flesh."In some cases I can see the monocular /g and the /9 being distinguished only by the former having a sharp top-right and the latter a soft one." If that's all you can offer as an example it makes me wonder how small your brain is. What about the curving tail of a 9 contrasted with the straight back stem of a single story g? A competent type designer would have mentioned that. Low res bitmap fonts and futurist abstract fonts don't count for diddley poo. How often do they get used?</p>
      <p>@Ryan: the number 9 is typically drawn with a huge great oculus or bowl, whereas lower case g is drawn with a smaller bowl and larger stem and tail in proportion. The biggest giveaway is context. Who puts a number nine in the middle of words in place of lower case g's? Only a moron would do that. The 2 glyphs are distinguished by context, okay honey? The letters to the left and the right define them as g's. Let's look at an example. "Aggravated assault" Lookee yar, Ryan Maelhorn wonders if the 2 glyphs after "A" are g's or number 9's. Ryan, when you type the word "aggravated", do you put nines in there instead of g's? You know the answers to all of these questions already, and you are only here asking typophile to get attention. If you're going to be a typographer I would expect you to see these basic truths as self-evident, with no need to ask what the difference is. But you allow your silly ego to get in the way of common sense. Happy happy, joy joy.</p>
