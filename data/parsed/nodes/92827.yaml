      <p>I think the differences so far mentioned here are valid ones, even if they don't apply to all typefaces:</p>
      <p>- the right side of the 9 is usually a single curve, while that of the g is usually a straight line which is has curved parts at top and bottom;</p>
      <p>- the straight line at the right of the g is attached to a circle, and so extends upwards past the point of contact, while the 9 is basically a single line with a spiral-like shape;</p>
      <p>- the bottom of the 9 continues pointing downwards until the end, while that of the g forms a bowl that turns back up;</p>
      <p>- the 9 stands on the baseline in the more common ranging numbers, while the g always has a descender.</p>
