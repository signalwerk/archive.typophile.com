      <p>David, any question can be considered on various levels. This particular question does make sense on a certain level. Think for example of a low-res bitmap font, or an abstract futuristic design. In some cases I can see the monocular /g and the /9 being distinguished only by the former having a sharp top-right and the latter a soft one.</p>
      <p>BTW, I handwrite my /9 with a top-right stub, and many people misread it as a "g".</p>
      <p>hhp</p>
