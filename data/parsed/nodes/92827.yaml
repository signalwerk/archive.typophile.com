      <p>Does not compute.</p>
      <p>Here's how I roll: a (mono) /g is a blob with something coming down the right half, shifting leftward (so it's not a /q). A /9 is a blob with something coming down, preferably not left of center (even center is fine). If you're going to mix alphabetics and numerics (like in a username, password or TinyURL, so not crazy) then you want a singularity on the blob of the /g, preferably towards the top-right. BTW, [mis]alignment does not qualitatively disambiguate.</p>
      <p>Alfred Kallir, where are you when we need you?</p>
      <p>hhp</p>
