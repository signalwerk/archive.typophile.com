  votes: null
  html: |-
    <p>Very happy to announce that Hipster Script is finally published. Hipster got a TDC 20120award and was selected by the Bienal Tipos Latinos. </p>
    <p><a href="http://typophile.com/files/typophilehipster.png" title="http://typophile.com/files/typophilehipster.png">http://typophile.com/files/typophilehipster.png</a></p>
    <p>Featuring more than 1800 glyphs containing ligatures, endings, etc. Hipster is available here:<br>
    <a href="http://www.myfonts.com/fonts/sudtipos/hipster-script-pro/" rel="nofollow">www.myfonts.com/fonts/sudtipos/hipster-script-pro/</a></p>
    <p>Check the specimen pdf released with the awesome German Paley's photography collaboration. <a href="http://www.sudtipos.com/downloads/Hipster-Script.pdf" rel="nofollow">www.sudtipos.com/downloads/Hipster-Script.pdf</a></p>
    <p>---</p>
    <p>Muy feliz de anunciar el lanzamiento de Hipster Script. Esta tipografía recibió en 2012 un premio del Type Directors de NY y fue seleccionada en la Bienal Tipos Latinos.</p>
    <p>El especimen fue diseñado con la colaboración fotográfica de German Paley!</p>
    <p>---</p>
    <p><a href="http://www.sudtipos.com" title="www.sudtipos.com">www.sudtipos.com</a></p>
