  html: '<p>Greetings, <br><br>This is my ﬁrst post here.  <br>Please excuse my english. This is not my native language. <br><br>I would just wish to know if anyone ever noticed a problem in FreeHand <span class="caps">MX</span> and 10 (<span class="caps">OS</span> X)… or is it me? <br><br>In FreeHand <span class="caps">MX</span> and 10 (<span class="caps">OS</span> X): <br>Type an “O” and then use the menu “Text&nbsp;: Convert to Paths”. I see a whole bunch of segments. Way too much. <br><br>Do the same in Illustrator 10 and below: <br>No problems. <br><br>Thank you for your input&nbsp;:-) <br><br>Yves&nbsp;Malouin</p>'
