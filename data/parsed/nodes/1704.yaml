  html: '<p>Greetings, <br> <br>This is my first post here.  <br>Please excuse my english. This is not my native language. <br> <br>I would just wish to know if anyone ever noticed a problem in FreeHand MX and 10 (OS X)... or is it me? <br> <br>In FreeHand MX and 10 (OS X): <br>Type an "O" and then use the menu "Text : Convert to Paths". I see a whole bunch of segments. Way too much. <br> <br>Do the same in Illustrator 10 and below: <br>No problems. <br> <br>Thank you for your input :-) <br> <br>Yves Malouin</p>'
