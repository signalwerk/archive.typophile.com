      <p>The faces I used then have not generally proven to be era-specific.<br>
      For instance, News Gothic, Univers, Futura and Helvetica all span many decades in popularity.</p>
      <p>Avant Garde and Eras would be more time-trapped.<br>
      But be sure to set Eras so tight it's practically illegible!</p>
      <p>However, the real trick to conjuring an era, or addressing its typographic personality, is not just selection of a typeface, but considering its implementation in layout.</p>
      <p>Here's a book layout by Paul Rand, from 1985, using Univers Bold:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Rand_4907.png"></div><p></p>
      <p>Note how Nevile Brody used Univers in the most influential style magazine of the era, <em>Face</em>, with Times as main body:<br>
      <a href="http://80scasualsblog.blogspot.com/2010/07/face-magazine-aug-1983.html" title="http://80scasualsblog.blogspot.com/2010/07/face-magazine-aug-1983.html">http://80scasualsblog.blogspot.com/2010/07/face-magazine-aug-1983.html</a></p>
      <p><a href="http://thefacearchive.tumblr.com/" title="http://thefacearchive.tumblr.com/">http://thefacearchive.tumblr.com/</a></p>
    html_clean: |-
