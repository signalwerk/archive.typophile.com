    html: |-
      <p>Designers in the 70s and 80s sometimes used Optima as a book face. They felt the mix of thin and thick strokes made Optima easier to read than standard sans serifs with their uniform stroke weight.</p>
      <p>Designers may have also liked Optima because it was designed by Hermann Zapf, whose Palatino was incredibly popular as a book face in the 70s and 80s.</p>
    html_clean: |-
