    <p>If I am braking the rules, I sincerely apologize. Please remove this topic in that case.</p>
    <p>Hi all.</p>
    <p>My name is Ted Damion and I'm a member of a local club. During our meetings we talk most of the time about advertising and design. We are going to get a bit bigger (4 persons right now) and I came up with the suggestion to make us a logotype. </p>
    <p>The one who started the club is a new member of this community. He tried ones to design the logotype and ask members here for help. But it didn't went very well.</p>
    <p>As we're all students in the club we don't have much money, and none of the other members are willing to spend money to get this done. So I smashed my piggy bank and found 20 dollars which I'm using to this task.</p>
    <p>I don't have a credit card so I'll give the money to our chairman who will transfer the money via PayPal or something similar.</p>
    <p>If you're interested, please post your email address here or email me at: <a href="mailto:illogical_squirrel@yahoo.se">illogical_squirrel@yahoo.se</a></p>
    <p>I will give you all the facts about the club via email, if that's okay. </p>
    <p>Thanks a lot.</p>
    <p>Ted Damion</p>
