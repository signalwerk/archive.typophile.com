    <p>Heyo,</p>
    <p>Kinda new here but I was curious if maybe we aught to up the security of the onboarding process?<br>
    It seems someone wrote a nice script for our forum and bots are having no trouble adding two numbers together to get in.</p>
    <p>Who's the Admin? Can we put a better captcha in there?<br>
    Been a part of a lot of forums and botrot is real and will fuck up a community slowly over time.</p>
    <p>I'd hate to see this forum go down again after missing it for so long.</p>
