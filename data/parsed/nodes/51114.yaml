      <p>I just found this on the USPTO:</p>
      <p>Is registration of my mark required?</p>
      <p>No. You can establish rights in a mark based on legitimate use of the mark. However, owning a federal trademark registration on the Principal Register provides several advantages, e.g.,</p>
      <p>* constructive notice to the public of the registrant's claim of ownership of the mark;<br>
      * a legal presumption of the registrant's ownership of the mark and the registrant's exclusive right to use the mark nationwide on or in connection with the goods and/or services listed in the registration; </p>
      <p>*******<br>
      So that means the mark is only exclusive when used in connection with the goods/services LISTED in the registration.</p>
      <p>So I guess since he does not sell cruises I'm OK</p>
