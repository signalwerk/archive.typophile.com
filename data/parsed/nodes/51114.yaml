      <p>Since they are both <em>boating related</em> companies, it could be argued that the nature of the business is sufficiently similar and this is enough to establish intent to deceptively connect the two companies by use of the same or similar trademark. </p>
      <p>At least a tagline is more easily changed than a primary corporate identity. If the kayak company is served with a cease-and-desist letter, it would be easier to cave in and change rather than going through the expense of challenging.</p>
      <p>IANAL-TINTBCALA</p>
