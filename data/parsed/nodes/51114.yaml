    html: |-
      <p>The old example is Delta Faucets and Delta Airlines. Easy to tell they are in completely different markets and coexist just fine.</p>
      <p>A more recent blurring of this is the example of Apple Computers and Apple Records. Traditionally, though they battled, it was decided they, indeed were in different markets and could coexist.</p>
      <p>Alas, once Jobs opened the iTunes store, things began to blur and, ultimately, it was decided they were both in the music industry.</p>
      <p>So, yea, Kayaks aren't cruises. But Kayaks and Cruise Ships are both boats.</p>
      <p>If your client is hoping to sell Kayaks throughout a huge region/marketplace, then maybe it makes sense to invest in some IP research and protection up front. But if it's just a local market, then it probably makes sense to just continue on and then if/when the big lawyers ever come knocking, rename the business then.</p>
      <p>But, as always, IANAL.</p>
