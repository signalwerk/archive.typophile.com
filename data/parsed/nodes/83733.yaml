    html: |-
      <p>Refer to the following thread for Korean:</p>
      <p><a class="freelinking external" href="http://typophile.com/node/70367" rel="nofollow">http://typophile.com/node/70367</a></p>
      <p>I must warn you that the best candidate for a Korean Futura, 윤체 (Yoon-che), is currently available only as part of a multi-font package worth almost a thousand US dollars.</p>
      <p>I think you should first decide what to do about Vietnamese. It looks like Futura might never have been extended for Vietnamese, at least from a cursory web search, so that poses a problem.</p>
      <p>In the end, it might be easiest and cheapest to settle for neutral sans-serif designs for the required scripts instead of trying too hard to emulate Futura's harsh geometry.</p>
