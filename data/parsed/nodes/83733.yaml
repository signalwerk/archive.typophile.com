    <p>I'm currently working on a packaging project for an international brand using Futura font. Our client is planning to sell the products in Asia, so I'm trying to find alternate fonts to use in Japanese, Korean, Chinese, and Vietnamese that match the look of Futura. It would be really helpful if anyone can help me with some advice or suggestion of where to go to.<br>
    Thanks a lot.<br>
    Tran</p>
