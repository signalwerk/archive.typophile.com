      <p>A decent, usable ‘<a href="http://paratype.com/help/enc/default.asp?id=20" rel="nofollow">Multilingual</a>’ version of Bitstream <em><a href="http://paratype.com/pstore/fonts/News-Gothic.htm" rel="nofollow">News Gothic</a></em> is offered by ParaType in a good range of styles. It does support Russian and all above-listed languages.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/News_Gothic_Cyr_5828.png"></div><p></p>
