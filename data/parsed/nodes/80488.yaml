  html: |-
    <p>A friend of mine needs to find a version of Trade Gothic that would support all the languages listed below. Apparently she had a version that covered all they needed until Czech was added to the mix, and the company they bought that font from doesn't exist anymore. I can only find fonts with all the other languages but Russian. Is there a version of Trade Gothic that would cover all these languages?</p>
    <p>English (EN)<br>
    German (DE)<br>
    French (FR)<br>
    Swedish (SE)<br>
    Finnish (FI)<br>
    Danish (DA)<br>
    Norwegian (NO)<br>
    Estonian (EE)<br>
    Latvian (LV)<br>
    Lithuanian (LT)<br>
    Polish (PL)<br>
    Russian (RU)<br>
    Czech (CZ)<br>
    Slovakian (SLO)<br>
    Portugese (PO)<br>
    Spanish (ES)</p>
