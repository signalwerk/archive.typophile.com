    <p>Hi all</p>
    <p>The UK version of Men's Health magazine has had a recent redesign (so has the US and IMO much more successful see here:<br>
    <a href="http://www.spd.org/2013/05/inside-the-mens-health-redesig.php#&amp;panel1-16" title="http://www.spd.org/2013/05/inside-the-mens-health-redesig.php#&amp;panel1-16">http://www.spd.org/2013/05/inside-the-mens-health-redesig.php#&amp;panel1-16</a></p>
    <p>In any case I'm interested in some of the (rounded) headline fonts used in the UK edition - think it could be Stag Rounded can anyone confirm? and indeed suggest what the other fonts are?</p>
    <p><a href="http://www.menshealth.co.uk/latest-issue-mens-health" title="http://www.menshealth.co.uk/latest-issue-mens-health">http://www.menshealth.co.uk/latest-issue-mens-health</a></p>
