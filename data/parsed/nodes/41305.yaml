    html: |-
      <p>To be honest, I think that the digital format typefaces you mentioned have little or nothing to do – culturally speaking, with the styles of lettering samples in the photo posted by pcarew.<br>
      These are of course, example of custom-made lettering, and they are quintessentially italian. In such cases, if someone wants something similar, he might consider doing a research and design the letters he needs by himself.</p>
      <p>I particularly think neither Metroscript nor Kinescope have anything to share with the style of the "Riparazioni" lettering line.</p>
