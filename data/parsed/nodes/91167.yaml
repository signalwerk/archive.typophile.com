      <p>When people refer to PostScript fonts, they are almost always referring to Type 1 fonts.</p>
      <p>If you really want to have fun, I suggest that you reference the <a class="freelinking external" href="http://partners.adobe.com/public/developer/en/font/T1_SPEC.PDF" rel="nofollow">Adobe Type 1 Font Format</a>, then use the <a class="freelinking external" href="http://www.adobe.com/devnet/opentype/afdko.html" rel="nofollow">AFDKO</a> <em>type1</em> and <em>detype1</em> tools to compile and decompile Type 1 fonts. You can start by using the AFDKO <em>tx</em> tool to convert one of your existing fonts ("font.cff" in the command line below) into a Type 1 font:</p>
      <p><code>% tx -t1 font.cff font.pfa</code></p>
      <p>Then, use the <em>detype1</em> tool to decompile the Type 1 font into human-readable/editable form:</p>
      <p><code> % detype1 font.pfa font.txt</code></p>
