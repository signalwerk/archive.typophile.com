      <p>So, yes, using the full power of PostScript means using Type 3 fonts, which can only print to a PostScript device, and won't be WYSIWYG on screen, and at best will work in only some apps, and only on the Mac. Not really a good idea in this day and age, unless it's just for fun and you know it will work in the specific operating environment you want to use.</p>
      <p>Edit: of course you can also use Type 3 fonts and even get WYSIWYG if you have a NeXT computer.  :)</p>
