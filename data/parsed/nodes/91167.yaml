    <p>Thanks to TTX and this forum post: <a class="freelinking external" href="http://typophile.com/node/67406" rel="nofollow">http://typophile.com/node/67406</a> I've been playing around with / trying to learn PostScript.  Through some reverse-engineering I've been able to create TTF fonts (Quadratic Bezier Curves... blargh), and even OTF fonts with the Compact Font Format, by editing the CharString entries in the CFFFont table.  A little tedious to do by hand, but I like it.  All fine so far.</p>
    <p>What i'd really like to do is use full PostScript to define characters in the font... for example, using strokes and line widths, which isn't possible with CFF.  All the fonts I find seem to be PostScript Level 2 - which I believe means they use CFF.  </p>
    <p>Is there a font format that uses full PostScript, as opposed to CFF?  Can somebody point me to an example file?</p>
    <p>I'm learning as I go here, so there is the possibility that my question doesn't make sense.  But at any rate, commentary from more knowledgeable individuals would be greatly appreciated.</p>
    <p>Thanks!</p>
    <p>::Matt</p>
