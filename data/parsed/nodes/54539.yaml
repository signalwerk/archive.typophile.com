      <p>I keep thinking of Dante.</p>
      <p>But it would help to define the intended tone of your typography more deeply.<br>
      Are you trying to design something that "accommodates" death and presents it in a "digestible" way – much like you'd probably do if you were designing an identity for an undertaker –, or something that retains, and reflects, some of the primal, mortal fear?</p>
