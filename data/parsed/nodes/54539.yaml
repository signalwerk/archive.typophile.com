  html: |-
    <p>I'm helping with the design of a small art and literature publication on campus, where students submit their work to be published to all students and faculty. </p>
    <p>Our editor has already chosen a theme, 'death and the passing of time', which the work we've received (photos, prints, paintings, etc.) is centered around. The body is all student work, no articles or ads; it is set in a theme each year based what we receive, which is 'death and the passing of time'.</p>
    <p>The dilemma I'm having is choosing a typeface to incorporate that 'theme'. I know of typefaces for books, but I'm also having trouble selecting one.</p>
    <p>My request may sound odd, but if you know of any typefaces that can incorporate that theme (e.g. carvings in headstones, memorials, plaques, or in the rustic/medieval/classical realm) or are great for books, I'd appreciate any suggestions.</p>
    <p>Thank you.</p>
    <p>~ corey</p>
