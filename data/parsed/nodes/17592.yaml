      <p>An interesting historic question that never occured to me... the first typeface <em>adapted</em> for the earliest Linotype typesetter. Not even the <a href="http://www.linotype.com/10-10-10-14022/1886.html?PHPSESSID=4fca5554419fd1628ef927a089d5f962" target="new" rel="nofollow">Linotype History</a> page on their site has a reference on it (that I could find).</p>
      <p>Some simple clues will probably lead us there:
      </p><ul>
      <li>Whitelaw Reid of the New York Tribune was one of the key financial backers of Ottmar Mergenthaler.</li>
      <li>At an exhibition in Washington, D.C. in 1885, Mergenthaler was offered $300,000 for the rights to his prototype machine. For this sum, a group of publishers headed by Whiteclaw Reid bought controlling interest in the National Typographic Company which later was renamed the Mergenthaler Linotype Company. </li>
      <li>A more or less usable model was presented to the New York Tribune on July 3, 1886.</li>
      </ul>
      <p></p><p>A type detective would need to do the following:<br>
      - Find out what metal fonts were used by the New York Tribune/Times just prior to July 1886.<br>
      - Find out the actually date of publication of the first commercial use of Mergenthaler's <em>Blower</em> which it was called just prior to being called a <em>Linotype machine</em>. (The assumption is that the New York Tribune/Times was the first use, but that needs more research.)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/NYTimes1881.png"></div><br>
      <em>On a quick search, </em>The New York Times,<em> July 1881, was the closet paper I found prior to July 1886.</em><p></p>
      <p>Key questions -- what would you consider the FIRST LINOTYPE typeface?<br>
      - The earliest attempts while developing the prototype of the <em>Blower</em>?<br>
      - The first typeface that could be set when the name <em>Linotype</em> was first used?<br>
      - The first commercially available type matrice for the Linotype?</p>
      <p>CLUE -- It was Colonel Mustard, with the candlestick, in the Pantry.</p>
