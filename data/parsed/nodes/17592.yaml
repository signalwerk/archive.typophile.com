      <p>There is one very nice Linotype book that I am aware of: the hard-bound brown civer one done in the 20's (I think). This is a lovely piece of work, showing the faces in classical layour and colors, printing on a good weight bookstock. I had a cop once which I lent to someone, and that's the last I ever saw of it. This is really something worth having for the Linotype enthusiast, at least the person I lent mine to thought so.</p>
      <p>Jim </p>
