      <p>Do you think that they just released them one at a time? I might guess that they released sets so that they could market a range to printers. Marketing was slower and more expensive then (in relative currency) so I would imagine producing a specimen book and other sales materials with enough faces to make the typesetter customer feel justified in purchasing the system and machinery.</p>
      <p>ChrisL</p>
