    <p>I recently designed a logo for my brand, using hand lettering as oppose to some kind of typeface. Here's what I've got (feel free to point out any rough spots you think might need refining):</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/qanda_3696.png"></div><br>
    I'm trying to settle on a good font combination; a title font that's in similar spirit to the lettering, and a fairly neutral font for the copy.<p></p>
    <p>So far, I'm thinking of using <a href="http://www.smeltery.net/fonts/megalopolis-extra" rel="nofollow">MEgalopolis Extra</a>, since that's one of the inspiration sources, and <a href="http://www.fontslive.com/font/candara-family.aspx" rel="nofollow">Candara Bold</a> (with regular there's an awkward weight contrast between the two).</p>
    <p>My main problem is I want to use this on the web, but I can't quite spare the money to buy web usage of Candara. Is there a free/open-source/embeddable font that's similar or goes better with MEgalopolis? Actually, does anyone have suggestions for a better font combination?</p>
    <p>Thanks.</p>
