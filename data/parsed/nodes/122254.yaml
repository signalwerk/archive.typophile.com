      <p>MS <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a> (Extra/Condensed Alternate) and FF <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/tisa" rel="nofollow">Tisa</a></p>
      <p>EDIT<br>
      Hint: as usual when it happens to be an online piece of text, always link to the original <a class="freelinking external" href="http://www.houseandgarden.co.uk/food/breakfast-club/liberty-london-girl-cookbook-sasha-wilkins-recipes" rel="nofollow">web page</a> and if you like to get an immediate answer, quoting R. from this <a class="freelinking external" href="http://typophile.com/node/117175#comment-580410" rel="nofollow">post</a></p>
      <blockquote><p>Here’s one handy thing to know: If you want to identify a webfont, you can select the text that uses it, right-click on your selection and then select ‘Inspect Element’ from the context menu (in Firefox and Chrome). The font name will be shown on the right-hand side in the panel at the bottom of the screen. You might want to click on the tab ‘Fonts’ in Firefox or ‘Computed’ in Chrome for a neater overview.</p></blockquote>
      <p>Other handy options: Chrome <a class="freelinking external" href="http://chengyinliu.com/whatfont.html" rel="nofollow">WhatFont</a> app by Chengyin Liu and <a class="freelinking external" href="http://fontface.ninja" rel="nofollow">Fontface Ninja</a></p>
