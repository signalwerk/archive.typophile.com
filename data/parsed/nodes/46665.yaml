      <p>&gt; <em>Are you creating additional characters for those unicode points or merely double coding the existing accents?</em></p>
      <p>You mean, use the same glyph for <code>U+00B4 ACUTE ACCENT</code> and <code>U+0301 COMBINING ACUTE ACCENT</code> ? AFAIK that shouldn't be done because combining diacritics are supposed to have 0 (zero) advanced width, whereas the standalone diacritics should have some advanced width.</p>
      <p>&gt; <em>And what sorts of problems, if any, are you finding with implementing the mark feature, besides combining accents not being placed correctly?</em></p>
      <p>If the combining accents are not being placed correctly, it suggests that either a) the anchors aren't placed correctly, b) the 'mark' feature is not well implemented, or c) both. How are you putting the 'mark' feature into your fonts?</p>
      <p>It's not possible to do the 'mark' feature with the current public AFDKO, but I'm using an internal version that does it, and I'm getting the expected results when the font is used in InDesign CS3.</p>
