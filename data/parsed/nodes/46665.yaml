      <p>&gt; <em>So I’m wondering if it’s a matter of compromise as to position or if I’m missing something obvious in setting the anchors.</em></p>
      <p>You don't have to necessarily compromise. You can always add one more anchor to the base glyph, if that's required. But your problem might be related with the position of the anchor in the combining accent.</p>
      <p>&gt; <em>And if the zero width is necessary why do some fonts not do it, eg. Arno Pro?</em></p>
      <p>That particular one is a known bug. But Arno has no 'mark' feature. Those combining mark characters are only there for the 'ccmp' feature.</p>
