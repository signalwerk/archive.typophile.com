      <p><em>If the combining accents are not being placed correctly, it suggests that either a) the anchors aren’t placed correctly, b) the ’mark’ feature is not well implemented, or c) both. How are you putting the ’mark’ feature into your fonts?</em></p>
      <p>It's been mainly a problem that a particular anchor doesn't quite work for all accents. Some come out looking fine, some are a little off. For example the anchor point one one glyph works well for several accents, but not all, and moving the anchor for those accents creates problems with another glyph. So I'm wondering if it's a matter of compromise as to position or if I'm missing something obvious in setting the anchors. </p>
      <p><em>AFAIK that shouldn’t be done because combining diacritics are supposed to have 0 (zero) advanced width, whereas the standalone diacritics should have some advanced width.</em></p>
      <p>I guess my question is if I'm pre-building accented characters according to unicode how necessary is it to have the zero width combining accents in addition to the standalone if I'm setting anchors for placement? And if the zero width is necessary why do some fonts not do it, eg. Arno Pro?</p>
      <p>George<br>
      I felt bad because I had no shoes, until I met a man who had no Bodoni</p>
