      <p>&gt; <em>You are? I had a nasty surprise using Legendum — in CS3, the mark function ceased to work properly whenever there was a font change at the next character.</em></p>
      <p>I didn't know about that problem. It's nasty indeed. Everything works as expected if no other font is used, though.</p>
      <p>&gt; <em>ID ME user Harbs said he didn’t have any problems using that same Legendum; then again, the ME version has far better OTF support...</em></p>
      <p>It's true that the ME version supports more languages and OT features, but it's not immune to bugs. And I've seen a really nasty one too, where upon applying 'smcp' or 'c2sc' to a font containing proper small caps (e.g. Garamond Premier Pro), the Latin small caps would come out correct, but the Greek and Cyrillic small caps would simply be scaled down caps.</p>
