    <p>Combining accents</p>
    <p>I'm wondering how many people are adding the combining accents to their fonts and how they're being added. Are you creating additional characters for those unicode points or merely double coding the existing accents?</p>
    <p>And what sorts of problems, if any, are you finding with implementing the mark feature, besides combining accents not being placed correctly?</p>
    <p>George</p>
    <p><a href="http://nobodoni.com" title="http://nobodoni.com">http://nobodoni.com</a></p>
