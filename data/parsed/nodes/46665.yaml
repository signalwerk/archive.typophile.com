      <p><cite>So I’m wondering if it’s a matter of compromise as to position or if I’m missing something obvious in setting the anchors.</cite></p>
      <p>As Miguel said.</p>
      <p>My impression is that if the positioning in a particular base/mark combination is wrong, then anchors may not be placed ideally in either base or mark glyph or both. It's like with spacing letters -- the better the sidebearing are, the less kerning is required. (And mark positioning <em>is</em> a form of spacing, not only in x-direction but in x/y-direction. Think of an anchor's position as defining a "sidebearing". Also, an anchor defines not a mere x/y but a Dx/Dy, relative to the glyph's outlines.)</p>
