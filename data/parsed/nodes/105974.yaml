      <p>Yes.<br>
      The web page answers your question.<br>
      Check your browser's developer tools -- details vary by browser -- and it should tell you that the body text is "GTF Web Beta Two Three Neuzeit Regular" used as "GTF Neuzeit S Book."<br>
      See <a href="http://www.myfonts.com/fonts/linotype/neuzeit-s/">GTF Neuzeit S Book</a> at Myfonts.<br>
      Don</p>
