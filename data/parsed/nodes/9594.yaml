    html: "<p>Well, I hate Times New Roman as much as the next high-brow snotty-snobby graphic designer, but it does look gorgeous as used on <a href=\"http://www.mercuryrev.com/\" target=\"_blank\"> Mercury Rev</a>'s <a href=\"http://images.amazon.com/images/P/B00000BKI4.01.LZZZZZZZ.jpg\" target=\"_blank\"> Deserter's Songs</a> (even with the bum apostrophe). And the music is to die for too. <br> <br>Colin, that's exactly my feeling, perfectly translated by the great Wolfgang Weingart quote: \"A good designer can make a beautiful design with an ugly typeface\". Not that any typeface is inherently \"ugly\". Although, Comic Sans... <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"></p>"
