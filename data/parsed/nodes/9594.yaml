    html: <p>Yves... Here I am putting Times up for indentification which is embarrassing enough. The same Times which I always thought I hated and associated with University paper's I'm now claiming to like. The problem is I never looked at it close enough to make a proper judgement in the first place and being prejudice of anything, even type, is close-minded. <br> <br>By the way, the cd in which I like the use of Times is Biosphere's Substrata | Man With A Movie Camera, designed by Jon Wozencrof.</p>
