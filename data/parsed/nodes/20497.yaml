    html: |-
      <p>Stephen,<br>
      Thanks a lot!<br>
      Just the few things I could find out using the little memories I have of heraldry. The half crest on the top is an early Plantagenets and the half near the "M" is a late for the same bloodline, probably taken from the Tudor coat of arms. Just below the "M" there's what looks like the city of York's crest, but the color of the cross should be red not black, so it could be something completely different.<br>
      The only thing that makes me link again the place with that county is the Yorkshire White Rose below the Lion-Heart and the (maybe)York crests.<br>
      I couldn't figure out the three at the bottom.<br>
      I had some serious geek-fun with this :)</p>
