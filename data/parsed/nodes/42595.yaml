      <p>Kentlew is correct. These are lead letters I'm talking about, not the "re-digitized" versions or any other. Thanks for the book recommendation, I'll scour those pages for details. </p>
      <p>I want to know how different they are, and perhaps I should just print my own samples, scan them and digitally compare them. Because, depending on the foundry, there are PLENTY of variations in typefaces like <em>Caslon</em> and <em>Garamond</em>, and it is up to us to determine which ones are most faithful and useful. Nevertheless, we're still able to call them by there common names. I'm suggesting that the names <em>Spartan</em>, and <em>Twentieth Century</em> are more corporate safeguards than honorable names for the type, so I'd like to keep it real in my pressroom.</p>
