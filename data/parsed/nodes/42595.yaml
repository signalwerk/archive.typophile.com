    html: |-
      <p>McGrew describes the differences. They are not many. He does not consider them significant. You might have to decide for yourself.</p>
      <p>If you compared the same sizes of all three, you might notice the differences. But mixing one size of Spartan on a page with a different size of Twentieth Century, for example, would probably not show up any appreciable variances. Especially if you consider that there are sometimes subtle differences between different sizes of the same nominal typeface in metal anyway.</p>
      <p>Nevertheless, if it was me, I'd probably keep the different drawers labeled according to the different fonts to retain the info about the original provenance, but perhaps arrange the drawers in the same cabinet acknowledging that the different sizes can essentially stand in for each other.</p>
      <p>-- K.</p>
