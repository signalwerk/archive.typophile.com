    <p>I run a fine-press studio, and we have several typefaces based on Paul Renner's <em>Futura</em>. Both <em>Twentieth Century</em> and <em>Spartan</em>—where can I find studies on the histories of these faces? Just HOW much of them is directly related to <em>Futura</em> and how much is mere well-intentioned emulation? </p>
    <p>All this to say, I'm considering completely RE-NAMING the faces <em>Futura</em>? We have some sizes of <em>Futura</em>, some of <em>Spartan</em>, and some <em>Twentieth Century</em>. It would be nice to homogenize them, but I only want to do that if the others truly are imitations of Renner's design. Just how different are they?</p>
  html_clean: |-
    <p>I run a fine-press studio, and we have several typefaces based on Paul Renner's <em>Futura</em>. Both <em>Twentieth Century</em> and <em>Spartan</em>—where can I find studies on the histories of these faces? Just HOW much of them is directly related to <em>Futura</em> and how much is mere well-intentioned emulation? </p>
    <p>All this to say, I'm considering completely RE-NAMING the faces <em>Futura</em>? We have some sizes of <em>Futura</em>, some of <em>Spartan</em>, and some <em>Twentieth Century</em>. It would be nice to homogenize them, but I only want to do that if the others truly are imitations of Renner's design. Just how different are they?</p>
