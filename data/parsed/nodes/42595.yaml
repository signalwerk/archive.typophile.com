    html: |-
      <p>In the case of Spartan (Linotype version), the main differences are the lowercase 'a', which had both a one-story and two-story design; the left quote marks were available either rotated 180° or mirrored from the right hand variety, and the question mark is of a more usual design, instead of the backward 'S' design in the original.</p>
      <p>The ATF version of Spartan is the same, except it has only the one-story 'a' and only mirrored quote marks.</p>
