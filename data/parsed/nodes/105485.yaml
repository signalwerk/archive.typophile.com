    <p>This is from an ID card that we make but our computer crashed and we had to rebuild.  We are using Gimp to build these cards and didn't realize it was a custom font.</p>
    <p>The unique items are all Capital even lower case letters are caps but smaller.<br>
    Most unique letters are A, N and numbers of 0, 7</p>
