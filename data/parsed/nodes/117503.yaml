    <p>Welcome to our Team Website</p>
    <p>The Woo Group is a team of trained and proven investment professionals who are dedicated to providing customized wealth management solutions to our clients.  Our team works with high net worth individuals, families, foundations, small businesses and corporations to help them achieve their financial goals. </p>
    <p>Our wealth management process begins with understanding each client’s unique needs and developing an appropriate risk profile. The profile is used to create a basic asset allocation and to select an appropriate investment strategy. Once a client has embraced a sound asset management strategy, the focus moves to creating a comprehensive wealth management plan including retirement planning, tax analysis, insurance needs and estate planning. </p>
    <p>While prudent asset management is vital and planning plays an important role in wealth management, these activities have to be integrated to align financial resources with life’s goals. The Woo Group has relationships with leading estate planning attorneys, insurance brokers and accountants for coordination and seamless delivery of world-class expertise as part of its wealth management process.</p>
