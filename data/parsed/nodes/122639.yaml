    html: |-
      <p>"Would FL autohinting treat PS outlines differently than those converted to TT?"</p>
      <p>Yes, radically differently. There is no choice. PS hinting and TT hinting are quite different things. PS and TT rendering are done by different rasterizers, as well.</p>
    html_clean: |-
