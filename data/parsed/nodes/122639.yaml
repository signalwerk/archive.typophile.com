      <p>Thanks Thomas<br>
      wish I had extensive experience in hinting / unhinting to justify my preference for unhinted Arabic. An experienced Arabic type designer and another well-versed in under-the hood programming advised against it. The latter did not like how it ironed out quirky details in his Latin font. For myself I experimented for a while with Fontlab's autohinting, looked at the hinting waterfall effect and saw drastic distortions as size diminishes. The dots, essential information carriers in half the Arabic  letters in particular suffer the most.<br>
      Something related I often wondered about - are there hybrid fonts whereby an outline font functions normall but then a pixel font kicks in and displays below a given small size?</p>
