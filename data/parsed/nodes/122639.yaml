      <p>Hi Thomas<br>
      Too bad about hybrid fonts - it would seem an ideal solution for tiny texts.<br>
      I apologise for the misleading topic headline. Perhaps I have waded in too deep and above my head into these technicalities!</p>
      <p> I guessed perhaps wrongly  that FL's autohinter is fine-tuned to Latin script with its well-defined Asc and Desc and x heights. Arabic outlines go all over the place. In Arabic my main concern was the dots - which are the only way to distinguish various letters in half the alphabet! A dots should reduce to a single well-defined pixels at minimum size. The autohinter however turned two dots, for example into two lines at an angle, or made three dots stick together into one square as in the example below.</p>
      <p>I like OT because it preserves the PS outlines with which I designed my fonts in the belief - again perhaps mistaken - that that will better preserve them on display. </p>
      <p>The two images are of the same letter - a direct photo of the screen of the unhinted glyph displayed in  Text Edit at 10 points is more or less recognisable. The Fontlab screenshot of the TT hinting of the same letter the three dots  and three 'teeth' become unrecognisable. It would be wonderful if this can be improved. Thanks.</p>
      <p>Vladimir</p>
