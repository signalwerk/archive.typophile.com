    html: |-
      <p>Currently, just about all rendering environments ignore the bitmaps in such hybrid fonts. So, functionally, no.</p>
      <p>I'd like it if you could send me an example of an autohinted font that's performing badly. I'd like to look at the hints. But broadly speaking, FontLab's autohinter for PostScript outlines is pretty darn good. It's only a tiny bit behind the Adobe PS autohinter, which is the gold standard.</p>
      <p>Also, as an aside (and not meant to sidestep the issue): why are you creating OTF from TTF for webfonts? Is it because you can get smaller sizes out of them?</p>
    html_clean: |-
