  html: <p>Hi - I bought TransType 4 and am very happy with its functions. It lists the fonts nicely, converts ttf into otf and lets you overlap the fonts over each other in colored transparencies for checking, etc. With the click of a button it creates all the files woff, eot, etc. needed for webfonts.  It also autohints the webfonts without being asked! I did not check the quality of the autohinting in the Latin characters, but I definitely do not want it in the Arabic glyphs. Is there a way to delete this function? Or to remove hinting from relevant file(s) in the finished webfont folder? Thanks.</p>
  html_clean: <p>Hi - I bought TransType 4 and am very happy with its functions. It lists the fonts nicely, converts ttf into otf and lets you overlap the fonts over each other in colored transparencies for checking, etc. With the click of a button it creates all the files woff, eot, etc. needed for webfonts.  It also autohints the webfonts without being asked! I did not check the quality of the autohinting in the Latin characters, but I definitely do not want it in the Arabic glyphs. Is there a way to delete this function? Or to remove hinting from relevant file(s) in the finished webfont folder? Thanks.</p>
