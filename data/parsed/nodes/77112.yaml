      <p>The C in CFF does not stand for compressed. Never has. CFF = Compact Font Format, and the compactness is provided by the type 2 charstring, i.e. it is an optimisation in the PS code not a form of compression.</p>
      <p>Compact Font Format documentation:<br>
      <a href="http://partners.adobe.com/public/developer/en/font/5176.CFF.pdf" title="http://partners.adobe.com/public/developer/en/font/5176.CFF.pdf">http://partners.adobe.com/public/developer/en/font/5176.CFF.pdf</a></p>
      <p>Type 2 Charstring documentation:<br>
      <a href="http://partners.adobe.com/public/developer/en/font/5177.Type2.pdf" title="http://partners.adobe.com/public/developer/en/font/5177.Type2.pdf">http://partners.adobe.com/public/developer/en/font/5177.Type2.pdf</a></p>
      <p>Yes, a WOFF'd CFF font will be compressed, but relatively less so than TTF.</p>
