      <p>Adam, I'm well aware that Adobe’s web fonts being served at TypeKit are TrueType. Their release was soon followed by a blog praising the virtues of CFF over TT.</p>
      <p>Adam, I'm also aware that the next DirectWrite rasterizer will render correctly hinted PostScript-flavored fonts in a similar way as correctly hinted TT fonts, which is what I think you mean to say above?</p>
      <p>The issue is, that&nbsp;MS and Adobe are finally reacting to the supposed weakness of TT hinting instead of reacting to the superiority of a rasterizer needing no hints at all, like Quartz.</p>
      <p>Mr. Hudson yonder, and others like him, are fond of touting the competition in rasterizers and how much more important that is that any sort of output compliance one can imagine.</p>
      <p>But really, what advantage is gained unless confusion is the goal? I mean, presumably after this improved rasterizer is released, then what? Release all the Adobe fonts again in CFF?!</p>
      <p>As a font developer, am I going to go back and rerelease my fonts in CFF? Doubtful. Am I going to release new fonts in two formats? Not likely because it'll be years before a font stack requires CFF, or brings any advantage to the user, if ever...</p>
      <p>I mean hints is hints. The same few hints are required for both TT and CFF. I can't tell you how important it is to get them right once, put the font into the market, and be done, in ttf.</p>
      <p>I have, in 20 years of making both formats, never gotten the feeling I could be assured of getting past the voodoo of type1 hints for any and all designs at any and all sizes. So, Ttf is the only sure path.</p>
      <p>And this despite the fact that (ahem) tool makers have ignored good technical practice, not to mention my repeated advice and all but forced unknowing font developers to work backwards, with lossy conversion from T1 to TT both hints and contours.</p>
      <p>This year, the web font sh!t hit the w3c fan, and what's been done? A wrapper, a parallel quality rasterizer, enough font freedom to ignore 90% of what is offered for the web, and negative education, like 50% of the blogs I read.</p>
      <p>Apparently though, no amount of confusion is enough to slow down web fonts done the right way.</p>
