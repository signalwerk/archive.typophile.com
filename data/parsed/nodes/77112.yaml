    html: |-
      <p>Also, I recall that the font renderer of older versions Mac OS X used to draw and antialias each path or component separately. Therefore, if they overlap, you could see a "ghost" white outline around the overlaps. This no longer happens these days with Mac OS X, but there may be other rasterizers that behave that way. </p>
      <p>The subroutine mechanism in the "CFF " table also contributes to its compactness. In fact, the subroutine mechanism *is* a compression mechanism, so the difference between an unsubroutinized and a subroutinized CFF-based font is that the latter is compressed. </p>
      <p>The composite glyph mechanism in the "glyf" table also is a form of compression. However, the principal difference between the composites in "glyf" and the subroutines in "CFF " is that the CFF subroutines can be just parts of a path, not necessarily entire closed paths. </p>
      <p>Due to this fact, in the CFF rasterization process, the glyph outline is first assembled from the subroutines and then rasterized.</p>
