      <p>But this is an intermediate point in time. The browsers are growing from being "just one application among so many" on a desktop towards being "a really really important application". But Chrome OS shows that the browser may become "the desktop" (Microsoft tried that years ago with Active Desktop, but that was too early). </p>
      <p>Applications that run in the browser already give the user more control over the UI than desktop apps. For example when working on something like Google Docs, you can ZOOM in an out the entire UI (not just the edited text but also all the controls) — which you cannot do in Word. With things like popup or ad blockers you can modify your user experience in a web app by YOUR decision as a user (desktop apps only allow you to customize the user experience if the app developer decided that you can do it). Etc. </p>
      <p>In my view (but of course I may be wrong, we're predicting future here), browsers will give more control to the user rather than less. I mean, it's already possible. I can inject my own client-side JavaScript and CSS to any app. This website <a href="http://userscripts.org/tags/flickr" title="http://userscripts.org/tags/flickr">http://userscripts.org/tags/flickr</a> shows you how HUNDREDS of user-side tweaks exist that modify the user experience of Flickr. Those tweaks can add new buttons in place that Flickr doesn't offer, change the behavior of Flickr's UI elements etc. Same applies for Facebook: <a href="http://userscripts.org/tags/facebook" title="http://userscripts.org/tags/facebook">http://userscripts.org/tags/facebook</a> . There are TONS of alternative user experience packages for Wikipedia, including some that "convert" Wikipedia pages on the fly into multicolumn full-justified "newspaper" with automatic hyphenation. </p>
      <p>Or have a look at <a href="http://fontfonter.com/" title="http://fontfonter.com/">http://fontfonter.com/</a> — I want the NY Times website set in FF Meta and and FF Meta Serif? There you go. What's non-competitive about that? </p>
      <p>Of course the general public doesn't bother with it now, but they can. Or intermediate providers can. (So they can compete with the original makers for "creating the best user experience" for Facebook, Flickr, Wikipedia, NY Times etc. etc.)</p>
      <p>This is all possible because the web is driven on open protocols. </p>
      <p>&gt; because you can have 5 browser choices?</p>
      <p>No, the choice of browsers is actually open-ended. I can fork, patch and build my own version of WebKit or Firefox if I so choose, that will do whatever I want. (Agreed, not EVERYBODY can do it, but intermediate providers can.)</p>
      <p>I'm not saying everything is "much better" than it used to be, but I definitely don't agree with you that it's supposedly "worse". It _is_ better. </p>
      <p>Again: if I want some feature in Google Docs or Facebook or whatever, at least to a large extent I can ADD IT MYSELF. Rather than waiting for the vendor of the site to do it. (Userscripts on Flickr prove how powerful this is). </p>
      <p>This does not yet obviously apply to font rendering, but we'll get there.</p>
