      <p><em>As a font developer, am I going to go back and rerelease my fonts in CFF? Doubtful. Am I going to release new fonts in two formats? Not likely</em>...</p>
      <p>IMHO, both of those decisions are bad ones. I have been conducting some impromptu market research in advance of packaging my entire library as a whole and in thematic/historical parts, and I have found that there is a lot of lingering mistrust of TrueType due to the serious badmouthing it received (primarily from whom will not be mentioned) after the format was introduced. A number of Mac users were even amazed--and changed their tunes--after learning that the TTF format was developed jointly by Apple and Microsoft.</p>
      <p>CFF and TTF are here to stay--for the foreseeable future--and not offering your customers both only leaves money on the table that you might otherwise claim. Over the course of the last several months, I have reworked my entire library--over 560 fonts--and generated them as CFF and TTF. The exercise has afforded me the opportunity of correcting some unintended errors and misguided choices, and generally to tune up the whole kit and kaboodle. It's worth the effort...</p>
