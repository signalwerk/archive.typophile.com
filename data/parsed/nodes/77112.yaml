      <p>[Personal rant]</p>
      <p>1. I don't think I've ever been an invited expert to anything. Maybe one time in 2001, but that's really ancient history. I was almost still a student then, and had, well, lots of spare time on my hands. </p>
      <p>2. Come on, David. As far as I remember our discussion about EPAR in Dublin: you've been trying hard to make me surrender to your narrative, and I don't think I was *that* an easy "opponent". You should know me well enough to know that I'm not an ideological drone. (Neither is John.) </p>
      <p>3. I fondly remember your lecture at Typo Berlin, was it two or three years ago, when you came up with a great sentence "The only difference between a Microsoft readability study and a bucket of shit is the bucket". While I did enjoy it a lot, I also realized that this certainly is a very straightforward way (for you) *not* to become an "invited expert" on anything. </p>
      <p>You know that I admire your work, and I truly enjoy your ground-shaking perspective. I'm not afraid to be proven wrong *because* I'm not ideological (or at least I like to think that I am not). </p>
      <p>You, me, John — I don't think our goals are so dissimilar. Yet each of us has a difference in style. You're an expert of telling other people what they don't want to hear. Some can take it, others cannot. I like to think of myself of trying to become an expert of *pretending* to tell other people what they *want* to hear, while in reality, I'm telling them what *I* want them to hear. I'm trying to walk a tightrope between becoming Molière's "Misanthrope" and, well, *getting results*. </p>
      <p>I would never come close of accusing you of any ill will — on the contrary, I think what you're doing is driven by lots of good will and idealism. So I don't mind a healthy punch from your side. But I'm an idealist as well. </p>
      <p>I'm different than you. But I'm on your side. I'm an ally. Keep that in mind :) </p>
      <p>[End of personal rant]</p>
