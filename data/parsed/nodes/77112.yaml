      <p>&gt; if non-competitive solutions are enforced in users BROWSERs</p>
      <p>That's simply not true. Right now, on one and the same machine, using Windows 7, I can have Chrome running pure black-and-white, Opera running GDI ClearType, Firefox 4 and IE 9 running DirectWrite ClearType, Safari running Mac OS X-style rendering, a forked WebKit using FreeType and an Adobe-AIR-based browser running Flash-style rendering. </p>
      <p>All on one and the same desktop, simultaneously. </p>
      <p>WebKit, Chromium and Mozilla are all opensource. FreeType is opensource. Get some developers to your island, brainwash them, make them fork the projects, add Berlowesque mode to FreeType, and there you go. Seriously. It's actually not that expensive. Making Firefox compile with FreeType as the font renderer on Windows or Mac is actually flipping one switch. </p>
      <p>*Unlike* in the desktop days, *now* is the time when a user (or a developer) can build their own browser, which will be 100% compatible with all the standards, but will render fonts *exactly* as *you* want it to render. What's bloody non-competitive about that!? </p>
      <p>In the old times, the Apple &amp; Microsoft "pure" TT and Adobe's closed-source Type 1 rasterization -- *that* was non-competitive. </p>
      <p>But maybe you have a different opinion on that because, ahem, back then you *used to be* the "invited expert", huh? (Sorry.)</p>
      <p>The people behind font renderers are not some evil mafia. They just happen to be where they are, and do what they do, probably as well as they can. Pretty much all of Firefox's text rendering is de facto in hands of four people: Werner Lemberg (the maintainer of FreeType), Behdad Esfabod (the maintainer of HarfBuzz), Jonathan Kew &amp; John Daggett (who are at Mozilla). </p>
      <p>They'll probably all meet this year at the LGM in May in Montreal:<br>
      <a href="http://libregraphicsmeeting.org/2011/" title="http://libregraphicsmeeting.org/2011/">http://libregraphicsmeeting.org/2011/</a></p>
      <p>Go there, and show them how this should be done. And perhaps they'll do it. Chances are they will. The Berlowesque code will be there, and it'll be only a matter of flipping a switch. </p>
      <p>Cheers,<br>
      Adam</p>
