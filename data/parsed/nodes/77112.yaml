      <p>I also do think the competition is a good thing, in particular because of the rapid development of display technologies. CRT, e-paper, all kinds of flat panels — they all produce different results, and the varying ppi densities contribute to it as well. I think it makes perfect sense that device manufacturers such as Apple fine-tune their rasterization filtering depending on the device, and the device generation. </p>
      <p>For example, a "slavish" following of the original TrueType rasterization model on something like iPhone 4 would be ridiculous. This does not mean that those vendors always get it right: in my opinion, Verdana or Arial were rendered better on iPhone 3G than it is being done on iPhone 4, because on the new "retina" display, the type is rendered too thin. I'd like the ability to add some weight (or virtual ink spread) to type on my iPhone 4. In fact, as a user, *I* do want the ability to customize the rendering of type on my machine, or portable devices. On Windows, I used to make customized versions of systems fonts for my own use, where I fiddled with the "gasp" table or even rehinted the whole thing, but it was a laborious process. The ClearType tuner on Windows was a step in the right direction. Safari on Windows has a wonderful font appearance tuner which toggles between Windows default rendering (which can be ClearType or plain-aa, depending on your system setting), and Mac-like rendering in five or so different modes. </p>
      <p>I'd actually even like this type of control to be added to CSS so authors can add or remove a bit of weight when rendering a certain font — depending on which color the foreground and background has, the basic font sizes etc. </p>
      <p>A.</p>
