    html: |-
      <p>Type 2 charstrings do not need to be 'decompacted'. They are more compact expression of the same data that used to be expressed using type 1 charstrings, and are directly interpreted by PS rasterisers. It isn't a compression mechanism; it's a code optimisation.</p>
      <p>Subroutinisation -- great word -- is optional in CFF, and represents a secondary method of reducing CFF table size. This is more like compression, and as Adam notes, the glyph outline is assembled from the subroutines, if present, and then rasterised.</p>
