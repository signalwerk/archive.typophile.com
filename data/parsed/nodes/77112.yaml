    html: |-
      <p>David, </p>
      <p>Subroutines are indeed always curve parts between two on-curve points. It has no relation to overlaps. You draw a "flat" outline, and the rasterizer gets a "flat" outline. What happens in between is compression and decompression, and the compressed form has no relation to overlaps. If you have overlaps in the "flat" outline before compression, then the rasterizer will get overlaps in the decompressed ("flat") outline. How the rasterizers (Adobe’s, FreeType etc.) will interpret the overlaps is their thing. </p>
      <p>Incidentally, Adobe’s webfonts that are being served at TypeKit are TrueType-based. The reasons for this are two:<br>
      1. Microsoft Internet Explorer 8 and lower only accept webfonts as EOT, and only with TrueType outlines<br>
      2. The Microsoft Windows GDI rasterizer (used by Opera, Chrome, Firefox except 4.0 on Windows 7) renders PostScript-flavored OpenType fonts (be it in plain OTF or in WOFF wrapper) in a rather unfavorable way (with very strong grayscale antialiasing which makes them look extremely pale)</p>
      <p>It’s only the DirectWrite rasterizer (used in Firefox 4 and IE 9 on Windows Vista and 7) which will render PostScript-flavored fonts in a similar way as the DirectWrite ClearType rendering of TrueType-flavored fonts. But please note that AFAIK, Microsoft has no plans to deploy DirectWrite to Windows XP, so on Windows XP, users will always be stuck with the "old" rendering of PostScript-flavored outlines, which, well, doesn't look very good.  </p>
      <p>For that reason, Adobe decided to convert all their fonts to TrueType outlines, and autohint them (with some manual hinting) when they published their webfonts on TypeKit. </p>
      <p>Adam</p>
