      <p>I've always understood two reasons for avoiding overlapping contours, both of which are to a certain extent historical, i.e. they used to be more critical than they are now.</p>
      <p>1. Some renderers and RIPs get confused and paint overlapping segments the wrong colour. This issue seems mostly (completely?) to have been resolved.</p>
      <p>2. Software does not remove overlaps when converting text to curves or when applying an outline stroke, as in BeauW's illustration. This depends on the sophistication of the software.</p>
