    <p>What do you guys think? First the logo itself, then the slogan.</p>
    <p>Do you see a problem with the slogan "Live like you mean it"? I know its been used time and time again by many institutions, but I don't think its a big deal. I think the logotype is very interesting...don't know if I necessarily like it, but interesting. What do you think?</p>
    <p>Jon E.</p>
