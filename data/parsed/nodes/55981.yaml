      <p>I have to agree that the message conveyed by the mark is mixed. The colors are...static to say the least, but the typeface, it's treatment, and cartwheeling guy convey motion. The placement of the tagline seems arbitrary and the content ('live like you mean it') doesn't seem to mesh with most people's idea of Wisconsin - even if it hadn't been used before by others. </p>
      <p>That being said - the colors aren't bad for a mark regarding Wisconsin, just for use in THIS mark regarding Wisconsin. </p>
      <p>This whole thing looks rather rushed to me.</p>
