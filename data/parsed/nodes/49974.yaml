    <p>Sorry for the poor quality scan. This is from a classic British children's book celebrating its 40th anniversary this year. I'm not sure if it has always been set in this typeface.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TigerID_4835.jpg"></div><p></p>
    <p>whatthefont seems to ignore the lower case g and a, and says it is Garamond Light. Indentifont says <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/monotype/plantin_schoolbook/" rel="nofollow">Plantin Schoolbook</a> or Plantin Infant, but that is ignoring the serifs on the T and W.</p>
