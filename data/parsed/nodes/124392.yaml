    html: |-
      <p>Ugh. In case someone else ever runs into this: the SVG image can't be copied verbatim; something needs to be added to it. The glyph ID, as used in the GlyphOrder table ttx generates, needs to be added to the SVG. For example</p>
      <p>&lt;GlyphID id="4" name="exclam"/&gt;</p>
      <p>would need</p>
      <p>&lt;svg id="glyph4" ... &gt;</p>
      <p>And I didn't notice the IDs didn't match. Duh.</p>
