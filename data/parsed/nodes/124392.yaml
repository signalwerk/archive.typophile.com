    <p>I'm trying to create an SVG-in-OpenType font by adding an 'SVG '-table to an existing font, but the SVG glyph will not render in the final font.</p>
    <p>This is my process:</p>
    <p>1. I take an existing font and decompile it with ttx (Behdad's version)</p>
    <p>2. I add an SVG table with a single svgDoc entry holding an SVG image.</p>
    <p>3. I recompile the ttx (without errors) and test the font in Firefox (which supports SVG-in-OpenType).</p>
    <p>Although ttx doesn't throw any errors, the SVG glyph doesn't show up — the original glyph is being shown.</p>
    <p>My addition to the font looks like this:</p>
    <p><code>&lt;svg&gt;<br>
    &lt;svgDoc endGlyphID="4" startGlyphID="4"&gt;<br>
        &lt;![CDATA[<br>
        &lt;!-- svg data --&gt;<br>
        ]]&gt;<br>
    &lt;/svgDoc&gt;<br>
    &lt;colorPalettes&gt;<br>
    &lt;/svg&gt;</code></p>
    <p>I've tried the following:</p>
    <p>* Using different TTF fonts to transplant my SVGs into<br>
    * Using all kinds of different SVGs, including one I took from an existing ttx'ed SVG-in-OpenType font<br>
    * Matching other tables to those of existing SVG-in-OpenType (e.g. adding a cmap_format_6 table)<br>
    * Decompiling the generated font to see if nothing was being dropped by ttx</p>
    <p>I don't know why this doesn't work. It looks so simple, and according to various sources* adding the SVG table should be all there's to it. Inspecting proper SVG-in-OpenType fonts seems to confirm this.</p>
    <p>Anybody have an idea what I'm doing wrong?</p>
    <p>* <a href="https://hacks.mozilla.org/2014/10/svg-colors-in-opentype-fonts/">https://hacks.mozilla.org/2014/10/svg-colors-in-opentype-fonts/</a> and <a href="http://www.microsoft.com/typography/otspec/svg.htm">http://www.microsoft.com/typography/otspec/svg.htm</a></p>
