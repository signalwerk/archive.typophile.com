    <p>I have been a longtime PC user who has used Adobe Font Manager, but I have moved to MAC and unfortunately it seems that the one drawback is that I will loose the years of organizing I did in ATM Pro. I am looking for the best program to buy and if there is any way of converting my font sets from ATM (which I am sure is not possible.</p>
