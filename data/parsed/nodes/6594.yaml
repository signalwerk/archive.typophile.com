    html: <p>Ah, where would a marketing department be without someone to copy? Marketing research has fallen to the level of the TV network executives who look at other peoples "numbers" and assume copying their stuff is also going to copy their market share numbers. The falacy of statistics lies in the quick jump to a conclusion and making leaps beyond what the numbers really show.  Wallmart is making money because they moved the mountain to Mohamad.  They brought big city volume discounts to small town America.  Their logo did virtually nothing to ESTABLISH the brand, it only CARRIES the brand. <br>Sears did a similar thing years ago with catalogue sales but sat on their laurels and ignored customer service. <br> <br>ChrisL</p>
