    html: <p>Armin, that's what I meant by "producing a parody of the original logo's logic". They ape the style without the structural finesse (or thought) of the original. <br> <br>Target certainly differentiates, but I think it's only doing that because it needs to have a competition point with Walmart and is trying to strike at the people (like many of us) who point up their noses concerning Walmart, which is essentially eating middle-America alive. My parents used to live in a town that was/is utterly commercially dominated by the Walmart. Go to a rural town that's slightly flagging economically, and you'll probably find a Walmart nearby. <br> <br>Kmart is, from what I gather, just winding itself down in preparation to become <a href="http://www.messenger-inquirer.com/features/business/7420234.htm">an investment company</a>, which benefits the stockholders, who are calling the shots. <br> <br>So, the image schizophrenia is probably partially a fast series of marketing gymnastics to drive the stock up as hard as they can before shifting over. Also, they probably don't have much in the way of a driving brand concept since they're on the way out anyway. Apparently, the Chairman of Kmart (Ed Lampert) is also spending time in the Sears offices as well...</p>
