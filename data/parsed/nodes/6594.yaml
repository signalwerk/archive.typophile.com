    html: <p>"New Sears Logo Fresher and Friendlier" <br> <br>The Sears logo gets freshened up. Starting today you will notice a difference in the Sears logo. The logo takes on a fresher and friendlier appearance with brighter blue, lower case letters and a red arc that adds a colorful dimension. This look evokes a more modern stylish feel. As a focused retail and related services company, poised for profitable growth, the logo gives our retail landscape a more inviting look while still capturing the trust and reliability for which Sears is known.  <br> <br>Marketing research (involving feedback from 600 customers in ten markets) revealed that the existing Sears logo was consistently perceived as trustworthy and reliable. Because of this feedback, the decision was made not to deviate too far from our current logo.  <br> <br>This logo is available for internal use from the marketing intranet site. When using the Sears logo refer to the guidelines on this site. Internally the direction is to change the logo only on new orders and otherwise to use up existing products or paper.  <br> <br>The new Sears logo is only the fourth in the company's 118-year history, succeeding the Sears script name in a rectangle introduced in 1963 and used for more than 20 years and the circular design from the 1950s.</p>
