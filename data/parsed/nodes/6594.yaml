    html: <p>"None <br>of these brands are helped by more sameness. " <br> <br>And that's clearly how/why Target took the move it did. Instead of competing with Wal-Mart (which, in many ways, is actually selling 'cheap' above anything else), Target decided to differentiate itself (by selling 'design' above anything else). <br> <br>The problem with Kmart is that it got stuck in the middle and didn't know what to do. They brought in Martha, but left the rest of the store looking like an outdated Wal-Mart. They went with the incredibly cheasy 'big k' look for a while, and now their latest print ads are mirroring target again. They're just running in circles.</p>
