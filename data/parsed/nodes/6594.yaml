    html: <p>I'm surprised no one here has gotten uppity about the typographic work � if you can even call it that. This new logo is absolutely terrible in its execution, the elements that once worked in the uppercase version are totally lost in the more complicated lowercase letters. The white line that splits each letter is extremely off balance in this new version, and what the •••• is wrong with the "r"?  <br> <br>The little charm that the Sears logo had is completely gone, replaced by an amateur execution. The red swash� whatever, it's silly and unnecessary and odd. <br> <br>Regarding the market� yes, Target has set the tone in terms of excellent design and advertising and all these companies trying to reach their level will always fall short if they insist on imitating Target. Just the fact that half of Minneapolis' design community works for Target is an indication on how hard the rest of these retailers have to work to measure up.</p>
