    <p>Hello.</p>
    <p>This time I am looking for the font used on a logojet of the airline hlx.com. It's advertising for the 'South of Sardegna'. I wasn't able to find a similar logo on the web.</p>
    <p>I doubt it's a custom title, but who knows. I could imagine this is a regular font. I do hope that the image helps.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/south_of_sardegna_6401.jpg"></div><p></p>
    <p>Thanks!</p>
    <p>Christian</p>
