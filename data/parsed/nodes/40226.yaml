    html: <p>Your first typeface was originally known a Truffles. See <em><a href="http://www.myfonts.com/WhatTheFont/forum/viewthread.php?threadid=97422" target="_blank" rel="nofollow">here</a></em>. I know of no other digital version than the Duffy that Philippe mentions in that MyFonts forum post. If you manage to find a copy, though, it has all of the characters that are in your image plus several of the original alternates.</p>
