    <p>I have two fonts I can't quite identify, and both have several that come close but aren't it. For instance, the one attached isn't Scythe or Chesterfield or Trifles Regular (I think). I would appreciate if someone could tell me which one it really is, just for curiosity's sake.</p>
    <p>And then there's an Art Deco-like font that looks a bit like most Art Deco typefaces but isn't any of them that I've checked: the header font at the top <a href="http://tealight-rookie.livejournal.com/" rel="nofollow">here</a>.</p>
    <p>Thanks for any help! :)</p>
