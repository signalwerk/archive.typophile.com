      <p>elfee,</p>
      <p>My name is Judy Pearsall and I designed the typeface you're asking about.  It is definitely Truffles.  I designed it in college, in 1984, and it was bought by Chartpak, the dry transfer-lettering people.  Where did you get the copy you posted?  To my knowledge, it is not a computer font.  If it is, I like to know about it.</p>
      <p>Can anyone tell me where I can get the computer version?</p>
      <p>Thanks,</p>
      <p>Judy</p>
