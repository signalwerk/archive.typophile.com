  html: |-
    <p>I’m designing a newsletter for a children’s charity that uses Helvetica Rounded Bold in their logo. I’m looking for another face to use for headlines, and a serif for the body copy.</p>
    <p>Any suggestions?</p>
    <p>Also, is there a lightweight version of Helvetica Rounded, or another face in a lightweight I could use with it?</p>
    <p>Thanks</p>
