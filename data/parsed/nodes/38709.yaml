      <p>For body copy, it might be nice to recall the traditional “schoolbook” type of vintage children’s books:</p>
      <p><a href="http://www.fontshop.com/fonts/downloads/monotype/plantin_schoolbook/">Plantin Schoolbook</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/paratype/schoolbook_ot/">ParaType Schoolbook</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/bitstream/century_schoolbook_ot/">Century Schoolbook</a><br>
      <a href="http://www.fontshop.com/fonts/downloads/monotype/bembo_schoolbook/">Bembo Schoolbook</a> - a bit more formal</p>
