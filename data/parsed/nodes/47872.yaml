      <p>Given the volume of work your doing, you should probably try not to think too much about price in your choice: fonts would be a fairly insignificant cost compared to all the printing costs!</p>
      <p>There are, of course, lots of possibilities: the Miller family is tried and true for body and headlines. Font Bureau has a number of other fonts you should consider, and has lots of expertise. You should probably contact them.</p>
      <p>Have a look Adobe’s Utopia, and, a more “outside” choice, Adobe’s Chaparral. If you own Adobe software, you may already have some of these. (Also, Adobe offers some of their fonts in special collections for education, see more info <a href="http://blogs.adobe.com/typblography/2008/03/ffee.html#more">here.)</a></p>
      <p>A very nice face you may not have consider is OurType’s Arnhem. Arnhem Fine is “modern and forward thinking but vaguely elegant/classic.” Go to <a href="http://www.ourtype.be/home.htm" title="http://www.ourtype.be/home.htm">http://www.ourtype.be/home.htm</a>, wait for the Flash to load, and navigate from there.</p>
      <p>Also look at Kris Sowersby’s <a href="http://vllg.com/KLIM/Newzald/Example+About/">Newzald</a> at Village.</p>
      <p>And  <a href="http://www.felicianotypefoundry.com/main/?page_id=88">Eudald News.</a></p>
      <p>Finally, be sure to read the EULAs for any fonts you’re considering: many foundries allow 5 seats at one location as part of their standard license, for others it’s one. Some allow embedding in PDFs (which may or may not be important to you), others do not, or charge extra.</p>
