    <p>Hi all,</p>
    <p>We’re a daily university paper working on a redesign this summer and struggling with fonts. We have a history of neglecting and harassing our readers with shoddy fonts, so we’re looking for any help we can get. Everything is open for us —— body, headline,  nameplate. </p>
    <p>First, some specs:<br>
    We run five days a week and our audience is primarily 18-22 year old students. We take our news seriously, but we happily print columns about sex and drugs, and we run words like “****” in the opinion section.</p>
    <p>We’re on a 11’x17’ tabloid (59p x 95) on newsprint and we’re irregularly in color (cnyk). We print 11,000 a day. We are six columns wide, and run with body font size @ 10.5. Headlines run at 42, 36 and 30. Subheads are at 18. </p>
    <p>Finally, we’re low on money.</p>
    <p>God knows why, but for the past few years we’ve been using Bodoni Book for body text. Right now, we’re looking at Trump Medieval.</p>
    <p>For headlines, we’d like one serif and one sans serif. Right now we like Miller Headline, but we’re not made of money and any cheaper suggestions would be wonderful. (I believe Rotation is on the shortlist.) Sans serif is up in the air. </p>
    <p>Our hunt for a perfect nameplate font is beginning to feel quixotic: we’d like to find one that is modern and forward thinking but vaguely elegant/classic —— all the while keeping in mind that we’re a bunch of idiot 22 year old students. (I suppose a nameplate is a very personal thing, but I just thought I’d ask.)</p>
    <p>Sorry that ran so long, we really appreciate the help.</p>
    <p>David &amp; Sabrina</p>
