    html: "<p>Following up on Jelmar’s advice: think about the kind of firm that you want to work for. When I was in design school my portfolio was in constant flux as I shifted it around to try and impress different firms based on advice from my professors, and most of the time my portfolio really looked like crap, both online and in print. It really only got better when I realized that the reason I could never come up with a great idea for a really wild portfolio with special leave-behind items was because I don’t really want to work for the firms that appreciate that stuff. I ditched all my expensive portfolio books and boxes and the custom web site for a $5 Muji portfolio and an Indexhibit web site that I actually like and the whole thing works about a million times better.</p>"
    html_clean: "<p>Following up on Jelmar’s advice: think about the kind of firm that you want to work for. When I was in design school my portfolio was in constant flux as I shifted it around to try and impress different firms based on advice from my professors, and most of the time my portfolio really looked like crap, both online and in print. It really only got better when I realized that the reason I could never come up with a great idea for a really wild portfolio with special leave-behind items was because I don’t really want to work for the firms that appreciate that stuff. I ditched all my expensive portfolio books and boxes and the custom web site for a $5 Muji portfolio and an Indexhibit web site that I actually like and the whole thing works about a million times better.</p>"
