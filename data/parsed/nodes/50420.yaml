      <p>James &amp; James - Now I am laughing out loud.</p>
      <p>I think that if you are new to the biz and you don’t know how you want to be seen, or how to make people see you that way via your ID it is inevitable that you can’t turn lamb into mutton, if you see what I mean.  Attempts to do so will be seen through in 90% of cases.</p>
      <p>James M is also right to suggest that you can’t control how people see you. And in fact people will see you many different ways and all too often ignore you. And this is inevitable &amp; in the end okay. </p>
      <p>I think the advice given is essentially sound. If you feel like a deer caught in headlights - go to the safety of the modern. It’s boring but okay. </p>
      <p>When you feel you have a good grasp on how to do more, let go and “swim away from the edge of the pool”.</p>
