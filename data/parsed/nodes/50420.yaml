    <p>I am in the process of creating my first visual identity as a designer and am feeling a bit overwhelmed by the spectrum of possibilities. The visual identity will be used as a starting point for the portfolio, resume, and used for billing an occasional freelance project. </p>
    <p>To get an idea of what employers are looking for in a junior’s visual identity, I interviewed a few firms (which ironically focus on branding) that I am interested in working for upon graduation. The general consensus seems to be “keep it simple”, but make sure it “stands out”.Hmmmm. I assume that taking a typographic approach would probably be best, however I am having difficulty selecting the “right” typeface. I want the typeface to read “creative” “fresh” and as requested “simple”. The face that I am gravitating towards is Insigna because the “J” “M” “A” seem to add some interest to my long and awkward looking name. The big problem with this is it looks a bit too much like a “frat house” identity.</p>
    <p>-<br>
    </p><div class="imageWrap"><img src="/files/workmark_6497.jpg"></div><br>
    -<p></p>
    <p>Anyway... In light of being overwhelmed I thought I would throw a few questions to those with a bit more experience. </p>
    <p>1. What is the most important thing you want your clients to read from your identity? And what typeface did you select fulfill that goal? </p>
    <p>2. How did you go about selecting the right typeface. What was your process?</p>
    <p>3. If anyone has any suggestions for typefaces that read “creative, fresh and simple”, I am all ears.</p>
