      <p>Jay Mac, it’s a big thing to dive into, branding yourself. Lots of good suggestions in here already that I’d like to echo: Create something you like. Use a typeface that’s timeless (univers, helvetica, etc).</p>
      <p>Being overwhelmed isn’t a bad thing. At this point, I’d suggest hunkering down with a notebook and sketching the word mark. When you feel exhausted like you can’t sketch anymore, quit for the night. Rest. Review the results.</p>
      <p>Regarding your questions:</p>
      <p>1. Most important thing is that you’re consistent. People value consistency in an identity over anything else (there’s been plenty of research to back this). I choose Helvetica Neue for my identity because of it’s reliable consistency.</p>
      <p>Why Helvetica? I was looking for something neutral and honest. It works for me, I like it, and I feel it left me plenty of room to be creative. Have a look: <a href="http://www.jasonrobb.com" title="http://www.jasonrobb.com">http://www.jasonrobb.com</a> I’ve also kept consistent in my portfolio: <a href="http://jasonrobb.com/i/jasonrobb-resume-portfolio.pdf" title="http://jasonrobb.com/i/jasonrobb-resume-portfolio.pdf">http://jasonrobb.com/i/jasonrobb-resume-portfolio.pdf</a> I use the same header info on invoices as well.</p>
      <p>2. My process for choosing Helvetica was simple. I didn’t know much about typefaces at the time, so I picked something that was familiar and that I wouldn’t get sick of too quickly. It’s held up for a few years now, and I haven’t grown out of it yet.</p>
      <p>3. Creative, fresh and simple typefaces: I’m a big fan of Jos Buivenga’s work - <a href="http://www.josbuivenga.demon.nl/" title="http://www.josbuivenga.demon.nl/">http://www.josbuivenga.demon.nl/</a> Museo and Museo Sans. Joshua Darden’s Freight Sans <a href="http://www.dardenstudio.com/typefaces/freight_sans" title="http://www.dardenstudio.com/typefaces/freight_sans">http://www.dardenstudio.com/typefaces/freight_sans</a> , TypeTrust’s Aaux Next <a href="http://www.typetrust.com/fonts/font.php?id=Njc5" title="http://www.typetrust.com/fonts/font.php?id=Njc5">http://www.typetrust.com/fonts/font.php?id=Njc5</a>  ... are three of my favorites that come to mind at the moment.</p>
