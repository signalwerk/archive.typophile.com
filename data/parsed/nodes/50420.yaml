      <p>When you choose the typeface for your portfolio choose something like Univers that will go completely unnoticed. The identity of your portfolio should allow people to focus on your  work, not the identity. If you want your portfolio to stand out, the entire piece needs to have a really great concept driving it, and a typeface isn’t going to do that.</p>
      <p>Using a novelty face is a bad idea, and using a Neville Brody face from 1986 is akin to putting in a title page that says “I went to to a school that did not teach design history, I haven’t studied it on my own, and I’m out of touch with contemporary graphic design”.</p>
