      <p>If you are creating a personal identity, I would create something <em>you like</em>, instead of what ’they’ like. I would try to show what you are about, and the only way to do that is to make something that comes from yourself.</p>
      <p>In other words, I would not worry too much about what other people tell you it should look like. Just take a sketchbook, Illustrator or whatever suits you for making sketches, and start brainstorming. :)</p>
      <p>You’ll end up with alot of different approaches. Pick one or two of them, and go from there.</p>
