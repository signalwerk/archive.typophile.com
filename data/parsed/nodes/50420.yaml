      <p>Go to the biggest mall in town. Take your camera and a sketchbook. Look at everything in sight, identify the marks that work and differentiate them from the ones that don’t. Take lots of notes and pictures. Go home and do some sketches. Then go to bed, wake up the next day, and think about it all. </p>
      <p>Doing some reading will probably help, too. Take a look at Willi Kunz’s books, he has some ideas that will be dead on for this project.</p>
