      <p><cite>Concerning the Gill angle, the obvious problem is that the intent and planning of good notan is very hard to convey from one person to another,</cite></p>
      <p>Notan? What on earth is that! I would say the Monotype chaps did a good job, I love metal Gill at text sizes, it has a lovely feel. Not too keen about the digital, though.</p>
      <p><cite>if you’re making a “conventional” Latin text face, are the norms of what instances of letterspacing “simply work” perhaps reliable enough not to require any discussion beyond things like “I think it should be looser”?</cite></p>
      <p>I read this in Updike: "The eye is the sovereign ruler of taste". It is as simple and complicated as that! </p>
      <p><cite>I would have to say that from where I stand, perhaps yes, but then “conventional” becomes quite distant from “ideal”; and when Kris says “it gets the job done”, that raises a red flag for me..</cite></p>
      <p>Your ideal may be different from mine or Christian's, but we can all tell when it is wrong, it's just a matter of making it as right as we can. What is wrong with "getting the job done"? It is a job to me, it is part of what I do when I work. And I was brought up with the working value of "if you are going to do something, you might as well do it properly". So when I say get the job done, I mean it in the fullest sense of the word.</p>
      <p><cite>Although it can be sometimes, like if a person [thinks he] is not good at spacing (re: Gill) and passes the job along to others; but like I said, this can be dangerous to “total” quality.</cite></p>
      <p>The total quality? What if you picked your favourite 5 typefaces and investigated the production method? It might be revealing…</p>
      <p><cite>But there still has to be a practical dimension.</cite></p>
      <p>There is: two heads (four eyes) are better than one! Don't be so empirical ;-) This is type design, done with the hand, heart &amp; head to be ultimately judged by the eye. </p>
      <p>—K</p>
