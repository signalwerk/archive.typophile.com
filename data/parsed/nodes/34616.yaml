      <p>I usually do everything myself these days, but I have had some help recently mastering files prior to release, and worked with Alexey Lisovsky on a Cyrillic version of Handsome. Well, he did all the work actually, I art directed and provided some technical help. Of course, a little bit of art direction can go a long way, as the proverbial sketch on the table napkin demonstrates.</p>
      <p>My retail fonts have no outside input, which is fine by me, that's the main reason I started the foundry. But it's also very valuable to get direction in commissioned work, whether it's from a client who is a designer/art director, or "just" a client. For instance, many times I've prepared alternate directions for a project, and the client has picked what at the time I considered the least promising option. And then it was a struggle to develop it into something that pleased the client <em>and</em> myself. But often, despite the headaches, that produces the most interesting results.</p>
