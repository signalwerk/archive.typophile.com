    html: |-
      <p><cite>Kris, I've always been fascinated (and frankly generally a bit sceptical)<br>
      about collaborative type design. Could you shed some light on how you<br>
      guys are making the Meta-Serif mechanics actually work out?</cite></p>
      <p>How can you be sceptical? I am not too sure what you mean by mechanics, but I'll try to explain. Christian proposed the idea of working together on Meta Serif, and I agreed. He had Erik's blessing to go ahead. I think Christian did the first sketches (in Fontlab) and gave the file to me, it was passed back and forth until we were both happy with it. Then, based on the Roman, I proceeded to flesh out the italic &amp; blacks, with Christian marking the proof .pdf's and sometimes tweaking the .vfb's if the changes were minute. All the way along Erik is asked to check to make sure he is happy with how it is looking, and also makes suggestions.</p>
      <p>So, as you can see, it is a truly collaborative approach. I have to admit it is much easier than trying to make a typeface solo, as certain decisions are made more much quickly! </p>
      <p>Is that what you mean by mechanics?</p>
      <p>—K</p>
