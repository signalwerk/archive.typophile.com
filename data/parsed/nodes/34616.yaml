      <p>I like it because two minds are much better than one! Decisions are easier to make, mistakes are picked up by the other, the revolving set of fresh eyes is hugely beneficial. It is a hard, tedious slog making a larger family with multiple weights and smallcaps etc. A problem shared is a problem halved.</p>
      <p><cite>Like why do you think Christian called on you?</cite></p>
      <p>You'd have to ask him, I think.</p>
      <p><cite>Basically I think it's two very talented and hard working guys with open, generous personalities, personalities which enable them to collaborate well.</cite></p>
      <p>That helps! We get along very well, which makes things easy. We also have larger similar aesthetic taste.</p>
      <p><cite> But really even in this case: do you think Christian was incapable of making a good Meta-Serif on his own?</cite></p>
      <p>Woah! Easy on man. He is more than capable of doing it all himself, let me assure you. Remember that he mostly drew the first round, establishing the style &amp; shapes. I am just translating all of this through the weights &amp; into the italics!</p>
      <p>—K</p>
