      <p>Where is this idea coming from that type design is done by a solitary genius? Paul and Christian work like this all the time. Erik and Christian have been collaborating for years. Slimbach &amp; Twombly designed Minion together. Frutiger &amp; André Guertler have done piles of work the same way, just not with computers. And what about Edward Hoffmann, who basically designed Helvetica through Max Miedenger's hands? I would say that most major releases are via collaboration, one way or another. </p>
      <p>—K</p>
