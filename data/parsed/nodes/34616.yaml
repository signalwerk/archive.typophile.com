      <p>Concerning the Gill angle, the obvious problem is that the intent and planning of good notan is very hard to convey from one person to another, and I have to think Gill and the Monotype boys attempted no such thing; and I hope we agree that the White is Important. The interesting, and quite broad and deep, question here is: if you're making a "conventional" Latin text face, are the norms of what instances of letterspacing "simply work" perhaps reliable enough not to require any discussion beyond things like "I think it should be looser"? I would have to say that from where I stand, perhaps yes, but then "conventional" becomes quite distant from "ideal"; and when Kris says "it gets the job done", that raises a red flag for me.</p>
      <p>&gt; the revolving set of fresh eyes is hugely beneficial.</p>
      <p>I agree fully. When you're too close to something it's hard to see it clearly (like how one typically sees many things to fix in one's own design after a while of not looking at it). The danger of course is the potential occasional truth of the maxim: "If it takes one person one day to finish a job, it takes two people two days." :-&gt;</p>
      <p>&gt; Woah! Easy on man.</p>
      <p>Easy on man right back at ya! It was a rhetorical question.  :-)</p>
      <p>My point was that incapability could not have been the reason for Christian to have initiated this collaboration. Although it can be sometimes, like if a person [thinks he] is not good at spacing (re: Gill) and passes the job along to others; but like I said, this can be dangerous to "total" quality.</p>
      <p>But there still has to be a practical dimension. Although possibly I need to see things like "I wanted to work with this guy" as in fact having a "practical" core... in an "I, Robot" sort of way.  :-&gt;</p>
      <p>&gt; When Paul and I work together, the division of labor is really unclear.</p>
      <p>Would you say this slows things down but results in something better?<br>
      (BTW, since Paul is a member now, maybe get him to chime in too.)</p>
      <p>hhp</p>
