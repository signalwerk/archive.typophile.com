    html: |-
      <p>&gt; Do you think that re-spacing it might make it more palatable for them?</p>
      <p>The nature of Legato is such that respacing it can only make it worse.<br>
      This is because the inside white is "virtually ligated" with the outside<br>
      white; the inside white is what makes the font strange (if only to geeks<br>
      like us) and hence unappealing to some.</p>
      <p>What would be interesting though is to make a "conventional" sister to<br>
      Legato and try to gauge any difference in how the two affect readers.</p>
      <p>hhp</p>
