      <p><cite>Woah! Easy on man. He is more than capable of doing it all himself, let me assure you. Remember that he mostly drew the first round, establishing the style &amp; shapes. I am just translating all of this through the weights &amp; into the italics!</cite></p>
      <p>Kris is being overly modest here, but I'll go back to the beginning first. The idea of Meta Serif has been floating around since 2002 or so, and after a several false starts, Erik and I finally figured out the basic look for the Roman at ATypI last fall. I forget how Kris and I first got in touch with each other, but we had worked together on a few small things and gotten to know each other when I asked him to draw Meta Serif with me. I don't remember the specific circumstances, I just had a gut feeling that it would work out. I thought there was a good chance the typeface would turn out better and be finished faster if we drew it together. He thought I was joking at first, but the rest will be history soon enough.</p>
      <p>I probably could have drawn the family myself (even that would have been a collaboration between me and Erik), but Kris brings his own sensibility to the mix, and he's doing a lot more than translating the basic design into a full family - he's really helped to shape the design. To be honest, the trickiest part is managing the files and knowing what the most current version is at any given moment, not working together. In the end, it won't be what he or I or Erik would have done on our own.</p>
      <p>It was a similar scenario with Guardian Egyptian, Guardian Sans, Publico, and the other projects Paul Barnes and I have worked on together - I don't think he or I would have come up with any of these typefaces on our own, but together the work (sometimes quickly, sometimes eventually) came pretty naturally. When Paul and I work together, the division of labor is really unclear. One or both of us draws some characters, then we pass files back and forth until we're both happy with what we've got. Then one of us does the kerning, and I generally do the Superpolating. Not a very exciting story, I'm afraid.</p>
      <p>A shared design sensiblity is important for collaboration, but I think the rest is just chemistry. Sometimes it works and sometimes it doesn't. I've been pretty lucky in finding people to work with, and have various projects in the works with Kris, Erik, Paul, and others right now, plus a few things of my own. I think it keeps my work fresh, and each of my collaborators knows things that I don't, which keeps things interesting.</p>
