  - id: 136099
    user: 1160
    date: 2002-01-08T14:25:00
    date_raw: 8 Jan 2002 — 2:25pm
    votes: null
    html: "<p> You stole my thunder... heh.  <br> <br>At first glance, it's a typical American corporate logo. <br> <br>On further scrutinization, you'll see that it's Benton Gothic (based on Benton's Trade and News Gothic faces. From FontBureau?) an otherwise great typeface but used here it's stretched 150%. Note how the cap S is unnaturally wide in the curves. Finally, the cut strokes are an attempt to customize this beauty one step further. <br> <br>The Lesson: next time you want to use an extended face get one for the job. But don't force an otherwise beautiful face to contort its way into something 'original.' <br> <br>//joe </p>"
    html_clean: "<p> You stole my thunder... heh.  <br> <br>At first glance, it's a typical American corporate logo. <br> <br>On further scrutinization, you'll see that it's Benton Gothic (based on Benton's Trade and News Gothic faces. From FontBureau?) an otherwise great typeface but used here it's stretched 150%. Note how the cap S is unnaturally wide in the curves. Finally, the cut strokes are an attempt to customize this beauty one step further. <br> <br>The Lesson: next time you want to use an extended face get one for the job. But don't force an otherwise beautiful face to contort its way into something 'original.' <br> <br>//joe </p>"
