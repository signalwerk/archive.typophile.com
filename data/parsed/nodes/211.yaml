    html: <p>Joe and I had the opportunity to design this client's site, which has evolved a little since we released it.  <br> <br>The corporate style guide placed a strong emphasis on the proper use of Benton Gothic, so we were intrigued by the corporate logotype, which uses a manually-squashed version of Benton Gothic Black.  <br> <br>Someone should approach Siebel with a small contract to clean this logotype up.  <br> <br><img src="http://www.typophile.com/forums/messages/4100/639.gif" alt="siebel"></p>
