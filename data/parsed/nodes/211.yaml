  votes: null
  html: "<p>Background: <br>Quirky typographic oddities often live under the false <br>protection of a corporate identity. These aren't limited to  <br>mom and pop shops, some of these logotypes identify  <br>well-established, global companies. Some of them  <br>have been around a surprisingly long time. Too long. <br> <br>We want to see them here. <br> <br>Rules: <br>1_ Show us the odd, the strange and the poorly  <br>designed logotypes or word marks of the corporate  <br>world. <br> <br>2_ Submit marks from companies that a lot of  <br>us would recognize. <br> <br>3_ Provide some background if you know any. <br> <br>4_ Post a graphic please. <br> <br>5_ Show us stuff we can learn from. (Even if  <br>it's learning from other people's mistakes.)</p>"
  html_clean: "<p>Background: <br>Quirky typographic oddities often live under the false <br>protection of a corporate identity. These aren't limited to  <br>mom and pop shops, some of these logotypes identify  <br>well-established, global companies. Some of them  <br>have been around a surprisingly long time. Too long. <br> <br>We want to see them here. <br> <br>Rules: <br>1_ Show us the odd, the strange and the poorly  <br>designed logotypes or word marks of the corporate  <br>world. <br> <br>2_ Submit marks from companies that a lot of  <br>us would recognize. <br> <br>3_ Provide some background if you know any. <br> <br>4_ Post a graphic please. <br> <br>5_ Show us stuff we can learn from. (Even if  <br>it's learning from other people's mistakes.)</p>"
