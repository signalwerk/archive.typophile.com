    html: <p> Benton Gothic is a custom job done by FB. I think it's kind of a summing-up of all the MFB related gothics (Franklin, News, Alternate, errr.. Lightline?). It's in the FB 3rd edition specimen book. FYI, Trade Gothic was done by Jackson Burke (at Mergenthaler), not MFB. </p>
