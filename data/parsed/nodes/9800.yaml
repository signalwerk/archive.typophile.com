  html: "<p>Hi everyone - unfortunately I don\"t have a visual, but here it goes: Letraset used to have this fairly bold non-joining monoline script in their dry transfer program, that looks round and simple and kind of non-descript in terms of a specific era. It's not Kaufman, and not quite as black as Varga. It was not designed for Letraset. I guess that's why it's not in their Fontek program. <br>Light bulb blinking, anyone? <br>Thanks!</p>"
