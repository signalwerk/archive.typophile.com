    html: <p>Wait, you said it's NOT in the Fontek collection? That probably leaves out both of the preceding choices. <br> <br>The only two fonts I can think of that were Letraset scripts that are not in the Fontek collection (I'm sure Mark Simonson will know more) are <a href="http://www.fonts.com/findfonts/detail.htm?pid=405832" target="_blank">Eclat</a> and <a href="http://www.myfonts.com/search?search%5Btext%5D=Einhorn" target="_blank">Einhorn</a>, and neither of those would be considered monoline or non-connecting. <br> <br>This may be very hard without seeing a sample.</p>
