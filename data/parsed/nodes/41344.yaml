    <p>Part of: <strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Rounded&nbsp;Typefaces</strong></p>
    <p>Current <span class="caps">URL</span>:<br><a href="http://www.myfonts.com/fonts/spiecegraphics/concerto-rounded-sg/">http://www.myfonts.com/fonts/spiecegraphics/concerto-rounded-sg/</a></p>
    <p>Designed by <a href="/node/12920" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Lucian Bernhard</a> 1927 and <a href="/node/add/wiki?edit%5Btitle%5D=Jim%20Spiece" title="Create node &quot;Jim Spiece&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jim Spiece</a> 2000 Published by <a href="/node/add/wiki?edit%5Btitle%5D=Spiece%20Graphics" title="Create node &quot;Spiece Graphics&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Spiece&nbsp;Graphics</a></p>
    <p>Concerto Rounded is based on a 1920s concert program lettered by Lucian Bernhard. In many respects Concerto is a toned-down version of the exceptionally light Bernhard Fashion. Concerto makes use of extensive crossbars and rounded terminals. It has two sets of lowercase letters, the alternate letters being slightly higher and wider than the ones in the first set. Cap alternates are consistent in approach with the work of this talented poster artist. His characteristically flamboyant display style is now available where legibility and readability are big issues. Concerto is equipped with lining and non-lining&nbsp;figures.</p>
    <p>Concerto Rounded and Concerto Rounded Alts are also available in the OpenType Std format. Some new characters have been added to these OpenType versions. Advanced features currently work in Adobe Creative Suite InDesign, Creative Suite Illustrator, and Quark <span class="caps">XP</span>ress 7. Check for OpenType advanced feature support in other applications as it gradually becomes available with&nbsp;upgrades.</p>
