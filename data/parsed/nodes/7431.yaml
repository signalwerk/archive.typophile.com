    html: <p>Thanks Yves, I feel the same about you (blush). <br> <br>This is the sort of font the Script Font ID Guide is for, I just picked the section that I thought it should be in (Distressed Scripts) and kept looking until I saw it. It was on page 20 of 21, so it was a fairly recent addition. I was getting all ready to give my speech about hand-drawn fonts being so cheap and easy to make, when I saw it.</p>
