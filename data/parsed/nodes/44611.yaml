      <p>That appears to be a Latin, in which the serifs are pretty much triangles. Try <a href="http://www.myfonts.com/fonts/parkinson/modesto" rel="nofollow">Modesto</a>, and if you want something spikier, maybe <a href="http://typography.com/fonts/font_overview.php?productLineID=100022" rel="nofollow">Saracen</a> will fit the bill.</p>
      <p>EDIT: And also, slightly off-topic, but thanks for being so descriptive of what you're looking for in your thread's title and first post.</p>
