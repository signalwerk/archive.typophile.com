  html: |-
    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/wiki/foundries" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Foundries</a>&nbsp;:&nbsp;Scangraphic</strong></p>
    <p>Founded in 1980. Mannesmann <span class="caps">AG</span>, one of the largest organizations in Germany, acquired Scangraphic in 1989 from the Dr. Böger Group, which was owned primarily by Knut Smeidel and Bernd Holthusen. <a href="/node/add/wiki?edit%5Btitle%5D=elsnerflake" title="Create node &quot;elsnerflake&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Elsner and Flake</a> acquired the Scangraphic font collection in 2004 and relaunched the fonts in digital formats, with newly designed Euro and @&nbsp;symbols.</p>
    <p><strong><span class="caps">SB</span> vs. <span class="caps">SH</span></strong><br>
    Scangraphic offers fonts in two formats called “Bodytext” and&nbsp;“Headline”.</p>
    <p><em>Scangraphic Bodytext (“<span class="caps">SB</span>”)</em> faces are ideal for text in small point sizes. The hairlines and serifs of the Bodytext faces are thicker than normal hairlines and serifs to make them more legible in fine print. In addition to this, they have a special ink-traps incorporated in the font design to prevent blurring and loss of print&nbsp;quality.</p>
    <p><em>Scangraphic Headline (“<span class="caps">SH</span>”)</em> faces are made for text in large point sizes. Scangraphic optimized the Headline fonts specifically for this purpose, for example, by narrowing the spacing of the fonts and re-designing the umlauts in order to make them work better aesthetically with the overall&nbsp;design.</p>
    <p>Scangraphic recommends 4.5 mm capital height (18 pt) as the largest size at which Bodytypes should be used, this should also be the smallest size for&nbsp;Supertype.</p>
    <p><strong>Links</strong><br><a href="http://www.scangraphic-fonts.com/">Scangraphic Fonts</a> (official site)<br><a href="http://www.fontshop.com/showfont.cfm?mid=22">Scangraphic at FontShop</a><br><a href="http://www.myfonts.com/foundry/scangraphic/">Scangraphic at&nbsp;MyFonts</a></p>
