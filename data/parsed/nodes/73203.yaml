    <p>hey everybody,</p>
    <p>I'm designing a logo for 'perron 20'. This is dutch for platform 20. They advise addicts about financial and social things by people who have been addicts themselves. 'Wij leven met je mee' means something like 'We feel empathy for you'. Keywords: professional, positive, open and warm. I used Livory by HVD fonts because it seems to radiate warmth and comfort. I like the look of it, but I think it needs an icon to symbolize what they do. Any commends are welcome! I've thought about something with a train or platform for an icon, but that's not what I'm looking for.</p>
    <p>Thanks for your help,</p>
    <p>Jasper de Waard</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/perron20-3_3643.jpg"></div><p></p>
