    html: |-
      <p><cite>"Livory is a handsome oldstyle face. But the invitation it sends to me is one from authority, rather than from a peer."</cite><br>
      Yes, I agree. I've been looking at this a few times and while it does look nice, the «tone» seems slightly off for the audience and situation you're communicating in. Consider that communication doesn't only involve <em>what</em> is being said and <em>how</em> the tone/voice feels to yourself, but there's also the question of <em>who</em> is speaking to <em>whom</em> (and how those people are made to feel). In the situation you describe, I'd also expect something that communicates more from peer to peer. Livory is beautiful, but it does evoke the old age of book wisdom, a printed æsthetic, where knowledge – and help – was a much more hierarchical and authoritarian affair. This tone of «authority» is one you would exactly want to avoid, I guess – it might feel ever so slightly patronizing (I'm assuming your target audience might be very sensitive to how their situation is presented or referred to). You need something that communicates at eye level; something that's fresher and straighter without being cold, something honest and strong, not this artistic/«bookish» and soft. Warmth is good, but not condescending warmth – warmth at eye level.</p>
      <p>On a more «surface» level, one thing that makes me find Livory a wrong choice in this context is that if you look at the actual shapes of the characters, it seems sad rather than strong. There are a lot of «frowning» shapes. The top-left instrokes of the "p", "n", and "r" all droop down. The opening of the "p" also makes it look sad to me. The overall softness (which looks eroded, like something was washed away) says everything <em>but</em> freshness, strength, youth, and being able to rebound from something that's as hard to overcome as addiction.</p>
      <p>In case I sound harsh: I like the font too, but I'm trying to look past my own taste and think into what it needs to communicate in this case, and I think it's miscast, like a good actor in the wrong role. </p>
      <p>BTW, what's with the railway metaphor? Is that important to the client, should it be played off? (You don't need to draw a train icon, but maybe use a font that could be used in railway signage or something?)</p>
