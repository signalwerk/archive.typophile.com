      <p>I'd argue that most people in Holland aren't your audience. Recovering addicts in Holland are your audience, and they are also your clients. I don't know anything about addiction treatment in Holland, but in Germany there's even a song by an artist called Blossom (Blümchen), "Pink Cloud" ("Rosa Wolke," a bad little techno number, but the lyrics seem pretty clearly about the addiction recovery denial phenomenon to me, in either tongue).</p>
      <p>You seem to know what you want, and I applaud that, but I'd still tell you the same. Livory is a handsome oldstyle face. But the invitation it sends to me is one from authority, rather than from a peer. Just things to consider. There are messages in our fonts...!</p>
      <p>Good luck with the client!</p>
