      <p>Don't be afraid to go back to the drawing board. It's quite a complicated organisation to sum up in a logo. For this reason I think your interpretation of warmth and approachability is appropriate. Now you must choose how to communicate these ideas. Beyond emotive choices it is a graphic exercise, weight, proportion, relationship, essentially creating a kind of neatness or harmony.</p>
      <p>Consider the regular demands of a logo; must work at different scales, possibly in black only.</p>
