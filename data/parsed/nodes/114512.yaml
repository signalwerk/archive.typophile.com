    <p>1. I'd like to know if all the typefaces of Herb Lubalin are available on digital format?<br>
    2. How many typefaces did he fashion with or without Tom Carnase?</p>
    <p>Find a rough list of his work : <em>Avant Garde Gothic, Lubalin Graph, Serif Gothic, Ronda, Didi</em>.<br>
    Are there anymore typefaces?</p>
    <p>3. How do you define the style of Herb Lubalin and what's his artistical leaning?</p>
    <p>Thanks in advance.</p>
