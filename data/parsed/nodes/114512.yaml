      <p>On the digital market, only four fonts are available with the original names:<br>
      <em>Avant Garde Gothic, Lubalin Graph, Serif Gothic, Ronda</em>.<br>
      <em>Avant Garde Gothic</em> was available in its complete form with stylistic sets in the previous decade only.</p>
      <p>I read that Lubalin produced <em>ITC Fat Face Black</em>. Nick Curtis reproduced it under the name of <em><strong>Pudgy Puss NF</strong></em>.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/pudgy-puss-nf/" rel="nofollow">http://www.myfonts.com/fonts/nicksfonts/pudgy-puss-nf/</a></p>
      <p>I discovered the modern face <em>ITC Didi</em> by chance at <a class="freelinking external" href="http://fontsinuse.com" rel="nofollow">Fonts in Use</a>.<br>
      <a class="freelinking external" href="http://fontsinuse.com/uses/6071/george-lois-website" rel="nofollow">http://fontsinuse.com/uses/6071/george-lois-website</a></p>
      <p>The font is not available on digital format with that name but designer Jason Anthony Walcott reproduced it under the name <em><strong>Domani CP</strong></em>.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/counterpoint/domani-cp/" rel="nofollow">http://www.myfonts.com/fonts/counterpoint/domani-cp/</a></p>
      <p>I wonder if there are other fonts from Lubalin's output with alternate identities.</p>
