    html: <p>&gt;Fabula would be infinitely less daunting when trying to copy letters as compared to trying to emulate a highly detailed typeface <br> <br>Alternatively, if one tried to copy the nuances exactly, it would be harder than to approximate what one perceives as an ideal, abstract form, such as a perfectly round "o". <br> <br>So the question is, does the "mental writing" that occurs in reading trace the exact forms, or is it a generalization of a generalization. If the ability to generalize can be equated with the process of learning to read fluently, it follows that the dyslexic has difficulty generalizing. <br> <br>In which case, is it easier to generalize from a precise form, confusing in its repetition, than from a more unique form, which suffers from distractingly complex idiosyncracy? This must be the dilemma that makes reading so hard for some. <br> <br>Oz Cooper's approach to type design, to "balance harmony with diversity", points the way.</p>
