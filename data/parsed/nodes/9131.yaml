    html: <p>&gt; There doesn't seem to be an appropriate <br>&gt; typeface to aid those with dyslexia. <br> <br>Yup. So get to it!  :-) <br> <br>BTW, I feel the reason for this lack is the infatuation with regular forms (coming from Modernism). Designers tend to be too concerned with superficial form, so they make their shapes formally harmonious, but this ignores the deeper, subconscious harmonies of reading - and I mean general reading, not even for special cases like dyslexics. A font that would work well for dyslexics (or work exceptionally well for the general readership) will look unacceptable to the "artistes"... Unfortunately, they're the majority with the technical training - analytical thinkers rarely make it into design. <br> <br>BTW, from your quotes it's interesting that dyslexics actually seem to be using a strategy that proficient adult readers use! Picking off large structures inctead of individual letters. Not all the time, just as much as possible. <br><a href="http://www.themicrofoundry.com/ss_read1.html" target="_blank">http://www.themicrofoundry.com/ss_read1.html</a> <br> <br>-- <br> <br>&gt; if it looks like you can make the <br>&gt; letters, you can recognize them. <br> <br>Being able to write something certainly helps, but it's not a <i>requirement</i>. Partly because -as you hint with "ideal, abstract form"- the essence of a shape is only circumstancially related to how the arm/hand/marker prefers to make it. <br> <br>hhp</p>
