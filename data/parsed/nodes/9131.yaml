    html: <p>There doesn't seem to be an appropriate typeface to aid those with dyslexia. For every typeface that seems to have some useful feature that would assist a reader with this specific learning disability, it always has an accompanying drawback.  <br>As mentioned it is "the repetition of forms that causes dyslexia" i.e. arial, comic sans <br> <br>Serifs vs Sans <br>Comic Sans, Arial and other typefaces noted for aiding dyslexics are all too similiar in stroke weight and style adding no variance between letters such as o,e,c etc. <br>The problem with serifs, then, is that they aid in the speed of reading, making it easier to pass over a word. This would deter phoenitic spelling. <br> <br>"Phonology is a skill underlying the analysis of both spoken and written language, breaking words into their parts, so that 'cat' can be broken into 'c-a-t' ... These skills need to develop at around the age of 5 years if children are to learn to read successfully. If this does not develop, they are reliant on learning to read whole words that they have to recognise visually (orthography)." <br>    -DR Lindsay Peer CBE  <br> <br> <br>"Dyslexic children need longer to read a word that is familiar to them (van der Leij and van Daal, 1999). This may lead to a strategy of trying to process large chunks of letters in reading, rather than breaking the word down phonologically in order to read unfamiliar words.  <br>This approach makes heavy demands on working memory and limits the number of new words that can be tackled." <br>   -Wolf and Bowers (1999) <br> <br>CAPS, on the other hand, will slow down the reader and force them too read each letter. <br>Typefaces faces such as Electra uppercase have serifs that point down at a 45 degree angle which would naturally add letterspace (a necessary factor to aid in reading in children and dyslexics). This would also break apart a flush line atop of the letters. <br> <br>Another problem with serifs is that they can have too much contrast (particularly didots) causing eye strain resulting in reading fatigue; as well as confusion between letters due to extra details (the opposite of Comic Sans) <br> <br>It is interesting to see that the designer of Comic Sans also designed Fabula, a font designed specifically for children. Depending on what you read, this may be a help or a hinderance. It may prolong, or help with the discovery of any children with learning disabilities. <br><a href="http://www.kidstype.org/Other%20projects/fabula.html" target="_blank">www.kidstype.org/Other%20projects/fabula.html</a> <br> <br>It doesn't seem like there is any clear answer to choosing an appropriate typeface to aid in the reading of those with dyslexia. Something in the middle of the board may do the trick.  <br>Optima? But, that's a whole other discussion of type prejudices. <br> <br>My apologies if this got confusing anywhere along  the way, but it's a bit confusing writing in such a confined space ad hoc.</p>
