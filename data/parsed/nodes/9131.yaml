    html: <p>Contemporary university research is about money, and money depends on scale. <br>You were wondering about tests that go against that. <br> <br>Information comes from contrast, and irregularity (of which CS has a lot more than something like Arial) is a brute form of contrast (especially during deliberative reading). But the highest levels of contrast are achieved via planning, not accident, and this is counter to chirography. <br> <br>hhp</p>
