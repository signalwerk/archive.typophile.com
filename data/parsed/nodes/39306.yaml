    <p>Hello Everyone,<br>
    I’m taking a trip to London in January. Would love to meet some of the international Typophile contingent, as well as take a look at some design firms. </p>
    <p>So two questions:<br>
    1. any London typophile members?<br>
    2. any London design companies that are worth looking at, maybe stopping by for a tour of the office?</p>
    <p>Thank you!</p>
