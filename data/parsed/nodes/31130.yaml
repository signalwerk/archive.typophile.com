    votes: null
    html: |-
      <p>Hmmm </p>
      <p>I don’t know. Do you mean the text or the shading? One way to suss out what happeing in a micro pixel thing you like is to zoom in close &amp; check out what happening on a pixel by pixel basis. The gradient on some is just a gradient but made quite faint or subtle. The edge is just a sigle pixel line on the top &amp; left 100% white dialed back to 45% or so and the bottom is 100% black dialed back to 20% or so. #6 has a trick hard pixel shadow. It’s on a dark red so it doesn’t read as what it is which is just hard black pixels. The last 3 are just 2 color... Having a pixel friendly logo helps as well of course. And you gave me a head start with those letters. I think if I was doing it for cash I might have done some subvisible pixel shading for the Y.</p>
      <p>There used to be really intense pixel centered tools available in the game industry. They were insanely cool. Photoshop is great but it’s not pixel centered. Sometimes when I see the best pixel art I think ” I bet they have an old mac running studio 8 or studio 32...”.</p>
      <p>BTW You are right to work in steps of 50% exactly to maintain as much sharpness as possble. It will still suck - but less... </p>
      <p>Sometimes you just have to start editing over the mush you make. Having a way to see what you are doing up close &amp; at 100% very fast or at once is a huge help as well.  Having vector art to scale can help too. The macromdia fireworks was allways more pixel aware than the Adobe tools were. Not sure why.</p>
      <p>What don’t you like about your thundrbird badge anyway?</p>
      <p>It does seem like you don’t want to have both logos is such as small space perhaps. It makes it too hard I think. Or maybe have the logos side by side on the left &amp; then let the words be unbroken on the right? Or is that two badges? </p>
      <p>If so, the issue might just be that thunderbird’s logo doesn’t shrink well which is hardly your fault. Perhaps just keep the head, and then you can let the text be on one line? Then the head is bigger.</p>
      <p>Actually I just went to your blog &amp; I think your thunderbird bage looks quite good there! I am tempted to takle it all back!</p>
    html_clean: |-
