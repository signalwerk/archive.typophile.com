      <p>Those updated ones look great! I still like the red box on grey version, but they all look stellar. Thanks!</p>
      <p>I gotta ask, how do you get that sleek almost 3d feeling with stuff so small? In fact, since you said you worked with pixels before, is there some kind of rules or guidelines for working with stuff so small?</p>
      <p>Since Thunderbird doesn’t have an official badge, but Firefox does, I tried to make to match it. It’s hard! Trying to get the logo to condense was the worst. At first I just shrank it down, but it looked like crap. Then I progressively shrank it in increments of 50% with bicubic sharper. That helped a lot. But how to get the <em>feel</em> of the original, or of yours, is beyond me.</p>
      <p>Any suggestions?<br>
