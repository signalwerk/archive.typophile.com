    <p>I’m assembling a few badges to put on my blog, and I wanted a Typophile badge. Couldn’t find one, so I made one. </p>
    <p>This uses the silkscreen typeface available at <a>Kottke.org</a>, a widely used typeface for this use. I had to recreate the logo for 15 pixels because the favicon is 16 pixels and looks like poop when squooshed.</p>
    <p>Anyone else have a badge variation? Also, feel free to use this one if you want to represent.</p>
    <p></p><div class="imageWrap"><img src="/files/typophilebadge_6112.png"></div><p></p>
