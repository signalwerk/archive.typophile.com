  html: |-
    <p>Hello,<br>
    I have a client who is looking to redesign their collateral. Currently they use Gill Sans as a text face and a modified version of <a class="freelinking external" href="http://www.emigre.com/fontpage.php?POttBk.html" rel="nofollow">Ottomat</a> (set at a loose tracking of 50+). The current design is sparce and polite, safe and conservative. </p>
    <p>Recently, my client realised that they need to appeal to a younger market, and so have requested a redesign. Trouble is, the organisation is a part of a larger state government body, which has just gone through a design process and allocated Palatino LT as body copy (very office-like). </p>
    <p>So with Palatino LT as a starting point, I need to develop a typography that achieves the following:<br>
    1. Allows the expression of emotions - tourism is motivational<br>
    2. Is attention grabbing and has an interesting cut<br>
    3. Is slightly feminine (but not girly)<br>
    4. Is sophisticated to reflect a sense of style<br>
    5. Is legible<br>
    6. Has the ability to work in complex tables and cartography<br>
    7. Works as a display face to introduce sections</p>
    <p>The typography can be made up of a series of typefaces with a similar theme, not just a large single family (ala Clan).</p>
    <p>Fonts I have been looking at to date include:<br>
    Priva, Parry &amp; Parry Grotesque, Dolly, Stag, Fling.</p>
    <p>I am going blind, racking up a great font library and not really getting any closer to a solution. I'd love to get something designed, but budget and time don't allow it.</p>
    <p>Any suggestions???<br>
    Thanks in advance.<br>
    Jason.</p>
