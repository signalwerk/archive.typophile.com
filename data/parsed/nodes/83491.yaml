      <p>Seeing it as it is, it did not make sense as an ampersand, so I thought it would have to be turned upside down.</p>
      <p>But when I actually look at it upside down, it looks like an 8 or an S, even though it would not be consistent with the typeface as an alternate form of either, and not at all like an ampersand.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AC_both_5104.jpg"></div><p></p>
      <p>So at this point, I'm very unsure that there is an answer. Perhaps it's merely a decorative flourish, and not a symbol at all.</p>
