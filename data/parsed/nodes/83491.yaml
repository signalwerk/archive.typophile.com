  - id: 470801
    user: 1262
    date: 2011-07-13T10:12:00
    date_raw: 13 Jul 2011 — 10:12am
    votes: null
    html: |-
      <p>This is a variant ampersand. I've seen this form before, and if you look at the construction you'll see that it follows the most common &amp; form, only with the leg curled back to re-join the abbreviated lower left loop: this is a quickly written form, made with a single movement starting in the lower middle and moving up to the right.</p>
      <p>Coincidentally, during the type crit session at TypeCon on Sunday, Matthew Carter advised against a kind of swash numeral 8 that a designer had made on the grounds that it could easily be confused with this form of ampersand.</p>
