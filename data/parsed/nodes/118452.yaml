    html: |-
      <p>So far so good. A few comments:</p>
      <ul><li>The /S/ could be more contrasting in its transitions. I would prolong the hairline thickness closer to the spine.</li>
      <li>The junction to the upper serif in /S/ is a bit too low/steep.</li>
      <li>The /!/ lacks of contrast. Try tapering the lower end of the drop.</li>
      <li>The terminal of /R/ is too thin.</li>
      </ul><p>Keep it up!</p>
