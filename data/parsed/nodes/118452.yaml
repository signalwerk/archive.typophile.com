    <p><img src="/sites/default/files/old-images/hello_5079.png"><br>
    Hello, Typophile! Looking on feedback on a new typeface I’m working on; it’s based on my current logotype.</p>
    <p>It’s a wide-set display didone. My design uses hairline serifs, and then flared shapes that flow from the hairline to construct letterforms that usually are defined by serifs, where a hairline serif would be too ill-defined.</p>
    <p>Here is my newly modified logotype that I am expanding into a typeface, I added a curl to the /R/ leg, as well as tracked out my first name.<br><img src="/sites/default/files/old-images/logo_4061.png"></p>
    <p>Looking for ideas, because I’ve been told that having both hairline and bracket serif styles makes the design seem disconnected, but I feel that the curved forms of the flaring connects with design of the curved letters, and just hairline serifs would affect legibility a lot, especially since the weight of the face is very heavy. The more I can have it match my logo, without “forcing it”, the better.</p>
    <p>The usage I have in mind is large display usage and very short headlines.</p>
