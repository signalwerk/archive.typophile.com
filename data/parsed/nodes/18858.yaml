      <p>Do you have any idea which one was created first? Not that it really matters, as both faces are clearly different — just being curious.</p>
      <p>Personally, I prefer Chevin as it looks more sophisticated, with much better balanced characters and a more pronounced character/identity. Also, I have the impression that there’s quite a bit of <a href="http://www.fonts.com/FindFonts/detail.htm?query=officina+sans&amp;pid=204974&amp;page_id=9270&amp;grab_id=0&amp;SCOPE=Fonts">ITC Officina Sans</a> in <a href="http://www.fonts.com/FindFonts/detail.htm?pid=405975">Saturday Sans</a>.</p>
      <p>Hmmm, actually, it’s more than quite a bit, and far too much for my taste. Anybody know who designed this?</p>
