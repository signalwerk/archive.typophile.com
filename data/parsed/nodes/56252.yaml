    <p>Hello Fellow Typophiles,</p>
    <p>I am desperately trying to find the name of the typographer who designed Penny Farthing, a Letraset font which appeared regularly in their catalogs in the seventies.</p>
    <p><img src="/sites/default/files/old-images/penny-farthing_4057.jpg"></p>
    <p>Anyone?</p>
    <p>Thanks in advance.<br>
    dr</p>
