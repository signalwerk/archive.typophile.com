      <p>Hi Spark, </p>
      <p>I'm not an expert on this, but I think that, a lot of viewer, sometimes user friendly font like Arial/ Helvetica or Times, etc... become invisible, people don't really pay much attention to it, even though they look at it everyday. For designer, they might notice it, and we all agree that those fonts are easy to read. Why?</p>
      <p>There are million (i'm not sure with the number :) logos, logotypes, brandmarks, business card, letter head using the same typefaces, or similar typeface, but does any one notice it ? and most of it was designed based on aesthetic/ memorable of color/ weight/ style/ to attract the viewers. I still don't know why?</p>
      <p>For Type Design, I think each designer has their own design process, some might leaning more toward trendy user-friendly/ invisible typeface, other lean toward experimental, hard to read typeface and such ... Sometimes I wished we all use pictograph instead of using boring roman letter.</p>
      <p>Lastly, if I work for a client, my choices will be depend on the most popular trend/ style that is out there because my intuitive tells me, that font is boring.</p>
      <p>:D</p>
