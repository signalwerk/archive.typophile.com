  html: |-
    <p>Hi all. I am trying to identify this font which shares traits with Trajan. Uppercase letters such as the /N/ are obviously very similar, but this is a bit sharper. Lowercase letters have some distinct differences from other fonts typically paired with Trajan. Most notably the /a/ and /f/.</p>
    <p>Any ideas here? All help is greatly appreciated.</p>
    <p>Cheers.</p>
