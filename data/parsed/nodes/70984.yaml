    html: |-
      <p>I designed <a href="http://new.myfonts.com/fonts/typodermic/byington/">Byington</a> as Trajan column lettering with a lowercase.  It was commissioned by Roxio Inc. for use in DVD menus. It doesn't have the subtlety of other Trajans as it was fine tuned for use on TV; sharp points and thin lines avoided to prevent interlace flicker.</p>
      <p>I've seen an ad for Victoria's secret that paired a nice lowercase with Trajan caps. It was a promotion for a TV runway show or something around 2004.</p>
    html_clean: |-
