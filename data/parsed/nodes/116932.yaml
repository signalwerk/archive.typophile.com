    html: |-
      <p>Looking it up, it apparently was based partly on Garamond and (to a lesser extent) partly on Caslon; it was a custom typeface created for the Canadian publication <em>Maclean's</em> magazine. (Maclean's is Canada's major weekly news magazine, competing against TIME and Newsweek.)</p>
      <p>Looking at the specimen on MyFonts, it didn't seem to have the distinctive "Garamond" feel I associate with the Jannon-based "fake" Garamonds, however, I wouldn't say that this necessarily brings it closer to the "real" Garamonds; it could, but I don't feel qualified to judge that.</p>
