      <p>Looks like a <em>faux Garamond</em> too. At least at first sight. May be nice for display, unusable for text because it is far too thin. Elegant Garamond (Bistream. now Monotype) seems to be cloned from Ludlow Garamond.</p>
      <p><strong>Let’s also do a list of <em>True</em> Garamonds:</strong></p>
      <p>Stempel Garamond (Stempel, 1925)<br>
      <em>clones of Stempel Garamond:</em><br>
      Original Garamond (Bitstream)<br>
      CG Garamond (Compugraphic, Agfa Compugraphic, now Monotype)</p>
      <p>Sabon (Jan Tschichold, Stempel/Linotype/Monotype 1967)<br>
      <em>clones of Sabon:</em><br>
      Sabon (Ascender, now Monotype)<br>
      Classical Garamond (Bitstream, now Monotype)</p>
      <p>Berthold Garamond (Günter Gerhard Lange, Berthold 1972)<br>
      <em>clones of Berthold Garamond:</em><br>
      URW Garamond (URW)</p>
      <p>Adobe Garamond (Robert Slimbach, Adobe, 1989)</p>
      <p>Sabon Next (Jean François Porchez, Linotype, 2002)</p>
      <p>Garamond Premier (Robert Slimbach, Adobe, 2005)</p>
      <p>what else?</p>
