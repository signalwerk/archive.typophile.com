    <p>¶ Among the series of fake <em>Garamond</em> based on Jean Jannon roman (aka <em>Caractère de l'université</em>, designated by the Cardinal de Richelieu), which one do you consider the best?</p>
    <p>• <em>Garamond 3</em> (1917) by Morris Fuller Benton<br>
    • <em>Lanston Garamont</em> (1921) by Frederic Goudy<br>
    • <em>Monotype Garamond</em> (1922)*<br>
    • <em>Peignot Garamond</em> (1926) by Georges Peignot<br>
    • <em>Simoncini Garamond</em> (1961) by Francesco Simoncini<br>
    • <em>ITC Garamond</em> (1976) by Tony Stan</p>
    <p><strong>Footnotes</strong><br>
    Back in the previous century, the French publishing house <a href="http://en.wikipedia.org/wiki/Gallimard" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;strong&gt;Gallimard&lt;/strong&gt;</a> bought a license of <em>Monotype Garamond</em> and rename it <em>Garamond du Roi</em> for a particular collection of book called <a href="http://en.wikipedia.org/wiki/Bibliothèque_de_la_Pléiade" title="Click to visit an external URL." class="freelink freelink-external freelink-external">&lt;strong&gt;La Bibliothèque de la Pléiade&lt;strong&gt;</a>.</p>
