      <p>¶ The Ludlow version displays too much contrast so it can't be French Renaissance.</p>
      <p>¶ Read the description of the updated Ludlow Garamond:</p>
      <blockquote><p>Condé Nast commissioned the FB version of this popular oldstyle for Traveler magazine. Douglas Crawford McMurtrie, type historian, and type designer Robert Hunter Middleton collaborated at Ludlow in 1929 to design a light oldstyle roman and italic, then released them light-heartedly under the name of “Garamond”. Jill Pichotta revised and digitized them both, adding additional weights with italics to the series; FB 1992–2000.</p></blockquote>
