    html: "<p> Disclaimer: color is not my strong point. In fact, I don't even like half-tones. I like line art, engraving, and type. So I'm really only considering the qualities outside of color. Except  for green and purple, which I like. <br> <br>In decreasing order of preference: <br> <br>43.002 <br> <br>Linotype Sangue in a goth-looking design. This is my favorite by far! Sangue is a great secret weapon. <br> <br>44.001 <br> <br>Green on green. Bickham script (or is it Sloop?) Knockout on the sleeve. VERY nice. <br> <br>11.001 <br> <br>What can I say, I have a pathological craving for ornament. <br> <br>38.021 <br> <br>More ornament. There is something wrong with me. I want to wear a chandelier on my torso. <br> <br>45.002 <br> <br>Flamin' awesome. And if that's hand-lettering, that's what hand-lettering should do. And if it's not hand-lettering, it's certainly on the same level.  <br> <br>And one more for curiosity's sake: 15.001 <br> <br>OK I get the orange part now. It's an inside joke. I'll assume the creator wants to deliver the punchline personally, so I'll withhold. VERY subtle and VERY clever. Likely outside the scope of the contest, though. </p>"
