    html: "<p> 1. Are you guys planning another poll (probably after all the entries are up)? <br>2. I know that there's judges, and they're the ones who are going to pick the winner(s), but since the main point is in fact to sell as many shirts as possible, shouldn't there be a somewhat formal voting procedure, so at least the judges know which shirts might be the most profitable before they decide? I know judges don't like such \"infrigements\", but if the motivation is to help Typophile... <br> <br>BTW, more likely than not my own entry/entries might *suffer* if you do #2, so I'm not trying to skew the results or anything. I guess I just want Typophile to survive, and from what I understand shirt sales mught turn the tide? Or maybe I'm worrying too much. <br> <br>hhp </p>"
