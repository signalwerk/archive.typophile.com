    html: <p> 15.004 actually looks like a t-shirt design. and the picture is fun. besides Cooper does need some respect. In turn I think it would spark alot of conversations...people would ask about cooper, you could have a real conversation without sounding dotcommy and have your opportunity to plug the site. <br> <br>38.021 I've never seen anything before that combines futuristics, scripts, displays and blackletters, sans serifs all together into a pleasing design that means something. I think the designer was trying to cover all bases. and then there's the whole look and feel and concept thing. <br> <br>28.001 yay dingbats, I've tried for a few years now to convince companies that dingbatting their name could be excellent for branding. no ones taken to it, and here's my opportunity! I'll wear it to meetings...symbols rule. and whats a letterform but a symbol anyway? Dingbats being so recognizable now I think they should be given the same uses...like braille for seeing people or soemthing. <br> <br>29.008 I like the relationship between font choice and the word. and then the justaposition or it all together too. its very clean. not much of an advertisement for typophile but is that needed anyway? is a t-shirt going to drive visitors..no. <br> <br>43.016 but with that black screen on. Its nice to fit words into squares, dosen't say much about what typophile is or does...but sticks to the point somewhat without being altruistic, or illustrative.  <br> <br>I would not wear flaming anything...in this city there's too many flaming identities, and I think its on its way to be the next trend, y'no right after orbits and "e"-wotevers die off. </p>
