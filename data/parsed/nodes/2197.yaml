    date_raw: 29 Aug 2002 — 8:59pm
    votes: null
    html: "<p> You do have something of a \"captive audience,\" or more to the point \"captive consumer space\" in the forums. You can easily poll to get a rough sense of how many shirts you should print, at the very least. <br> <br>Also it would be interesting to see what popular favorites are, even if it doesn't change what \"wins\" or gets printed. <br> <br>This poll space has been so empty since its inception: probably because at that point there were not even five strong candidates, but the quality seems to have gotten much better in the last week, with presumably more goodies to come. [apologies to those I may have just slighted with this remark.] <br> <br>And hey, as judgement day looms, I'm wondering how the judging is going to work. Is it ID Design Annual style, where there is some sort of dialogue from which we are treated to salient gems? Do they rate the shirts, make a list of five, narrow to a \"semifinalists\" stage, or is it all too arcane for us to know? </p>"
