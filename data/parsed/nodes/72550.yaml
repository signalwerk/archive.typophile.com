      <p>- personal<br>
      - approachable<br>
      - authoritative<br>
      - passionate<br>
      - happy</p>
      <p>Ah yes, the world's most interesting man.<br>
      And what is the worlds' most interesting typeface?<br>
      Helvetica.<br>
      So there must be something wrong with this procedure.</p>
      <p>All those words, except for authoritative, mean just one thing: not too stiff and formal.<br>
      So how do you resolve casual and authoritative?<br>
      Could it perhaps be one of those compromise faces -- a "clean" sans serif with the corners slightly smoothed?</p>
      <p><a href="http://new.myfonts.com/fonts/hvdfonts/brevia/" rel="nofollow">Brevia</a>, perhaps, with fashionable large x-height and short capitals?</p>
