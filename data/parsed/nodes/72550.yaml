      <p><cite>It’s all advertisement gibberish and have no actual meaning to me. That said, why don’t you tell us more about what sort of food this is.</cite></p>
      <p>thank you for getting right to the point! yes, it's ad-man speak for sure. but these actually relate to this brand in very believable ways. </p>
      <p>it's mid to high end goods. mostly gift-focused, but a lot of 'special treat for yourself' products too. definitely appeals to a sophisticated crowd, but it's not for cooks really.</p>
      <p>I'm actually leaning toward OurType's Parry right now. it has the wide, comfy, casual look the client likes. there's a good range of weights. it's not so styled they'll be tired of it 6 weeks from now. bonus: the Grotesque pairing might come in handy.</p>
      <p>Nick, I tried to throw Bodoni Egyptian in the mix, but it wasn't quite what the client wanted (we've had a little back and forth already this morning).</p>
      <p>I've gotten an extension through Monday morning. hopefully, I can do a little more research between now and then ... without dropping my other projects ;)</p>
