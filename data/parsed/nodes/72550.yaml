  html: |-
    <p>I'm on a hot search for headline type. I don't usually do this so fast, but we're under the gun to fix a broken situation. so here's the deal: I have until this afternoon to preset a headline (and companion text) face to meet these qualities.</p>
    <p>- personal<br>
    - approachable<br>
    - authoritative<br>
    - passionate<br>
    - happy</p>
    <p>it's going in print (catalogs, mailers, signage, etc) and online. right now, print is the first order of business. it's going to sit with food. and it will be mostly for mood, not necessarily promotion (I think that's where a good companion face will come in handy).</p>
    <p>I'm working from the type specimens I have on hand, but I know there's a lot more out there. what do you guys think?</p>
