    html: <p>What’s the problem with simply using Mac for macs and <span class="caps">PC</span>s for <span class="caps">IBM</span> <span class="caps">PC</span> systems or clones thereof? Let’s not forget that while “Personal Computer” was a widely used term that deﬁned all sorts of computing devices back in the 70s, <span class="caps">IBM</span> was the company that took the <span class="caps">PC</span> abbreviation and trademarked it. <br>Referring to Macintoshes as <span class="caps">PC</span>s might not be completely incorrect, but when 99% of the world have agreed on a convention, why should we create a new one exclusively for this board? It seems somewhat pedantic to me. <br><br>Sorry for the derailment. Let’s get back to talking about&nbsp;type…</p>
