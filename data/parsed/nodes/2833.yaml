    html: <p>My theory is that people with little experience with type tend to ﬁnd such fonts easier to distinguish from “normal” fonts. When they want something to have a “special” look, they tend toward fonts that are obviously “special” in some way. No room for subtlety or reﬁnement at that level of awareness. It’s sort of like the diﬀerence between picking “red” and picking “Pantone&nbsp;214.”</p>
