    html: '<p>The pre-<span class="caps">ITC</span> Bookman Swash is one of <a href="https://web.archive.org/web/20190929060712/http://jawarts.com/TypeInfo.htm">Jason Walcott’s favorite typefaces</a>. I emailed him about it a couple years back. He told me that there is a digital version sold by <a href="https://web.archive.org/web/20190929060712/http://www.castcraft-software.com/">Castcraft</a>, called <span class="caps">OPTI</span> Bookman. It’s actually two fonts: <span class="caps">OPTI</span> Bookman Bold Italic and <span class="caps">OPTI</span> Bookman Bold Italic Swash Supplement. Their online catalogs seem to be broken, so email or telephone to see if it’s still&nbsp;available.</p>'
