    html: '<p>Back to Bookman. <br><br>I think Mark makes astute observations on the awareness level of the uninitiated, and gravitating to something that looks *special* <br><br>But I think there is a larger trend in design: <i>the retro swash revival</i>. It may not be as widespread as <i>the humanist sans outbreak</i> of the 90’s, but one need only look at a Veer catalogue to see the incredible number of retro brush scripts and swashy *new* designs. Perhaps it has something to do with the general cultural trend toward bootcut jeans made to look 2 years old right oﬀ the shelf. Keep your eye out for knickers, suspenders, and headlines set in Hobo Next. <br><br>Ha! Randy <br><br><span class="caps">FWIW</span>, I quite like swashes. Even overdone&nbsp;ones. </p>'
    html_clean: '<p>Back to Bookman. <br><br>I think Mark makes astute observations on the awareness level of the uninitiated, and gravitating to something that looks *special* <br><br>But I think there is a larger trend in design: <i>the retro swash revival</i>. It may not be as widespread as <i>the humanist sans outbreak</i> of the 90’s, but one need only look at a Veer catalogue to see the incredible number of retro brush scripts and swashy *new* designs. Perhaps it has something to do with the general cultural trend toward bootcut jeans made to look 2 years old right oﬀ the shelf. Keep your eye out for knickers, suspenders, and headlines set in Hobo Next. <br><br>Ha! Randy <br><br><span class="caps">FWIW</span>, I quite like swashes. Even overdone&nbsp;ones. </p>'
