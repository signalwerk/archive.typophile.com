    html: <p>Let me explain why I'm sensitive to this matter.  <br>When I started out at FontShop I made the same  <br>"mistake" by referring to personal computers in  <br>general by using "PCs" in the announcement of the  <br>first Belgian FontShop Award. You wouldn't believe  <br>the grief I got over that from the Macintosh community!  <br>I thought it was totally overblown, but since then I try  <br>to be careful in my phrasing. <br> <br>For what it's worth I personally don't really care  <br>what you use as long as it's not in a negative way. <br>It was the unfortunate "amateurs with PCs" I was a  <br>bit weary of. <br> <br>Case closed?</p>
    html_clean: <p>Let me explain why I'm sensitive to this matter.  <br>When I started out at FontShop I made the same  <br>"mistake" by referring to personal computers in  <br>general by using "PCs" in the announcement of the  <br>first Belgian FontShop Award. You wouldn't believe  <br>the grief I got over that from the Macintosh community!  <br>I thought it was totally overblown, but since then I try  <br>to be careful in my phrasing. <br> <br>For what it's worth I personally don't really care  <br>what you use as long as it's not in a negative way. <br>It was the unfortunate "amateurs with PCs" I was a  <br>bit weary of. <br> <br>Case closed?</p>
