    html: <p>They were very big around 1970 or so. Bookman set the example, even though it's from much earlier. By the mid-seventies, they were adding Bookman-style swashes to everything. They were usually called Whateverthefontwascalled <i>Flair</i>. <br> <br>I have a specimen book which contains a section titled "A Flair for all Reasons" which includes Torino Flair, Goudy (Heavy) Flair, Cooper (Black) Flair, Franklin Gothic Extra Condensed Flair, Bodoni Flair, Baskerville Flair, Allegro Flare, Neon Melior Flair, Stymie Black Italic Flair (as seen last week here), and--believe it or not--Univers Flair. I have also seen Helvetica Flair. <br> <br>Designers quickly got sick of this trend and moved on to other gimmicks. <br> <br>If you're right about a swash revival, that's okay with me. They might not be tasteful, but they are fun to draw.</p>
