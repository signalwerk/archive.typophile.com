    html: <p><i>I will refer specifically to my computer in futher posts as  <br>an iMac G4 800mh 512mg Ram operating OS 10.3.2.  <br>I'm sure that will make communications speed up dramaticily.</i> <br>Errr... You've got a point there, Dan. <img src="http://www.typophile.com/forums/clipart/bigsmile.gif" border="0"> <br> <br>Though you're both technically correct, there still is  <br>that thing called "perception". As I'm in the language  <br>business I know how easily people misunderstand, and  <br>I'd rather avoid needlessly irking the PC community which  <br>would be a shame. I suggest we use "computer" as a  <br>generic term and both "Mac" and "PC" to denote specific  <br>machines/operating systems. Just a thought from your  <br>friendly neighbourhood community warden*. <br> <br>* I'm supposed to preserve the peace around here so  <br>don't make this harder than it's supposed to be, guys'n'gals!</p>
