    date_raw: 26 Jan 2004 — 12:00pm
    votes: null
    html: <p>My theory is that people with little experience with type tend to find such fonts easier to distinguish from "normal" fonts. When they want something to have a "special" look, they tend toward fonts that are obviously "special" in some way. No room for subtlety or refinement at that level of awareness. It's sort of like the difference between picking "red" and picking "Pantone 214."</p>
