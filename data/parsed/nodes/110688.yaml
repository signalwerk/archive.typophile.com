      <p>I saw that question coming but didn't have a good answer so I just waited for someone to pose it.<br>
      And there it is.</p>
      <p>Latin script extensions would definitely be included.  After all, if the glyph set was expanded to include glyphs from Adobe Latin 3, which is a kind of "next step" I suppose, then that's a good part of what we'd encounter, correct?<br>
      However, then, from what I've seen, the next big step in enlarging a latin based font for other language communities is usually adding Cyrillic chars.  Do you agree?<br>
      If so, let's include Cyrillic.<br>
      On the flip side of the globe, let's NOT include Asian glyphs.<br>
      (And as an aside - I know Hebrew well enough to know that it would fit in within the upper and lower limits of a font with an existing Latin 3 set. Would that also be the case with a similar language like Arabic?  Huge language community, Arabic. It would be nice to know it could be added without recalculating the verticals.)</p>
      <p> Still thinking out loud - where would Vietnamese with its stacked diacritics fit in to this question?</p>
      <p>What I'm looking to avoid most of all, is this:<br>
      An encoding like Win 1252 for a particular font has glyphs which call for a relatively narrow range above and below the descender and the caps height. And so you set your vertical metrics based on that.<br>
      A week later, you get a call to expand to Latin 3 and to cover Vietnamese while you're at it and who knows what other language and there go your original vertical metrics right out the window.<br>
      Better to calculate enough space to accommodate these additional glyphs should they be added.<br>
      Charles Kettering famously said, "A problem well-stated is a problem half-solved" so here's my problem statement:</p>
      <p>** I'm looking for a formula for calculating vertical metrics sufficient to accommodate other glyph sets that are most likely to be added later to the font file and/or requested in the data stream - whether a part of the same font file or not - to be delivered to the web page along with the core glyphs. **<br>
      That's what I'm after.</p>
      <p>(Here's an actual real-life example of the problem:<br>
        if somebody runs a font through the Font Squirrel Generator and asks for a small subset, the Generator will calculate the vertical metrics based on the glyphs in that subset. However, if you ask it for a larger subset, it's quite likely the font will come back with vertical metrics expanded because taller glyphs are a part of the larger subset. I've seen this happen and, needless to say, it can screw up the line-height consistency within a font family pretty nicely if you don't catch it. All of a sudden descenders start getting clipped which never happened before.<br>
       )</p>
      <p>Now, since it's you who's answered this phone when it rang and your knowledge is vast, you got a recommendation for me?<br>
      As YOU begin a font with the basic ASCII charset, do YOU have a formula that leaves enough room vertically for them long and tall glyphs coming down the road?</p>
      <p>Eager to hear your thoughts.</p>
      <p>rich</p>
