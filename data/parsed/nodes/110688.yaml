    html: |-
      <p>This whole issue is why I've been campaigning for script- and language-specific vertical metrics in fonts for many years.</p>
      <p>Vietnamese is the commonest case for stacked Latin diacritic marks. The Danish Ǻ is usually taller, but is <em>very</em> rare in actual use, being mostly limited to use in grammars, dictionaries, and discussions like this one. There's not a lot of use of subscript diacritics in Latin orthographies, and when they do occur they tend not to sit lower than the descenders. This is also true for Cyrillic and Greek.</p>
      <p>When you get beyond European scripts, however, you'll find a lot of use of descender space. To be properly proportioned, Arabic needs deeper descender space than Latin, plus extra if text is going to be vocalised. Many Indian and Southeast Asian scripts vertically stack conjuncts downward, and can require massive descender space. Here, for example, is Javanese, which is an extreme case.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/msjav_5290.png"></div><p></p>
      <p>Trouble is, if you start setting font metrics to anticipate non-Latin extensions, then your default linespacing is going to be too large for English and other European language text; whereas if you set metrics for European languages it will be disasterously too tight for many others. Script- and language-specific metrics settings are the only sensible way forward, but I've yet to get any software makers to commit to it.</p>
