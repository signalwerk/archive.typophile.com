    html: |-
      <p>Thank you.</p>
      <p>I get the picture now.</p>
      <p>Language specific vertical metrics do, indeed, seem sensible.  (I can also see why it's a tough sell.)</p>
      <p>That said - Cascading Style Sheets gives web authors the ability to manipulate line-height. Further, the characters requiring the extra height can always be spun off into a separate font which can either be applied to sections that require it or as a 'fallback' font which the browser uses when it does not find the characters it needs in the font or fonts listed previously in the "font stack". </p>
      <p>As remedies go, that seems to be the sum total of what can be done. (Although I'm wondering if browsers will override the CSS settings. A good question I should test out.)</p>
      <p>For now, all my work is with Latin-based and/or European languages.<br>
      As a precaution, I'm just going to include a glyph with no Unicode point - maybe just a solid vertical bar or something, to mark the upper limit in cases where, for example, an ASCII subset of the font slices away anything taller than, say, a capital H.<br>
      And see how it tests out and if it's worth the trouble.<br>
      It seems unnecessary to mark a lower boundary.</p>
      <p>Thanks again.</p>
      <p>rich</p>
