      <p>Perusing Windows system fonts using MainType and reading up on the Windows Glyph List - as far as its supposed Pan-European language coverage - Capital Letter A With Ring Above And Acute from the Latin Extended-B set is the tallest glyph I see.<br>
      Below the baseline - it seems like the lc 'j' or 'g' dips as far down as anything else.</p>
