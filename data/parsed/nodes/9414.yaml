    html: <p>A couple more suggestions. An <i>extremely</i> nice font with a similar style is <a href="http://www.myfonts.com/fonts/linotype/avenir/">Avenir</a> (also by Adrian Frutiger). See also <a href="http://www.myfonts.com/fonts/ef/granby/">Granby</a>, <a href="http://www.myfonts.com/fonts/redrooster/shinn-rr/">Shinn RR</a>, and <a href="http://www.myfonts.com/fonts/redrooster/extension-rr/">Extension RR</a>, each of which has a slightly different flavor.</p>
