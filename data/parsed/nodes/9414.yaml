    html: <p>It looks to me like someone mutilated <a href="http://www.myfonts.com/fonts/linotype/frutiger/">Frutiger</a> to make it look like <a href="http://www.myfonts.com/fonts/typodermic/blue-highway-deluxe/">Blue Highway</a>. If so, I'm sure you'll find the latter both more authentic and better constructed.</p>
    html_clean: <p>It looks to me like someone mutilated <a href="http://www.myfonts.com/fonts/linotype/frutiger/" class="link-external">Frutiger</a> to make it look like <a href="http://www.myfonts.com/fonts/typodermic/blue-highway-deluxe/" class="link-external">Blue Highway</a>. If so, I'm sure you'll find the latter both more authentic and better constructed.</p>
