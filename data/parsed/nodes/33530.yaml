      <p>I find it exceedingly boring, except for the mistakes. The mistakes are not interesting; they are more of the "ouch" variety.  Now "boring" can be taken as an emotional response; all I can add is that there is a difference between "boring" and "unobtrusive." Unobtrusive is good for long academics texts, boring is not.</p>
      <p>As to the weight (lightness) -- it is hard to tell on the screen, at the size shown. Here is a trick: Gentium is also a free font, and because of the extended character set, quite useful for texts where only the word processor is used (laser printout). In my experience, Gentium prints well enough on a laser printer, but is too thin to print well on an offset press, where the plates are made from the computer files (direct to plate offset printing). If that is your intended use, download Gentium &amp; compare it. If they have generally the same weight, it is too light for offset.</p>
