    <p>This isn't my own font, so I didn't submit it to the critique section. </p>
    <p>I have found Linux Libertine and been running it through some laser prints. I'm thinking in terms of a font for long academic texts (humanities). I would also pay for a font, but there is something modern yet Caslonesque about this font that I like. At the same time, there is a lightness that I'm worried won't hold up. </p>
    <p>Just curious, what is your reaction to the font? </p>
    <p>Eric</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/linlib.gif" width="586" height="143" alt="">
