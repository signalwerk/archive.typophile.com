      <p>wizz -- just to get a bit back on topic, (for Typical), The situation with free fonts and academics can still be confusing. I'm at home &amp; away from everything but a computer hooked to the net &amp; almost no other software. But as I remember, Gentium's EULA forbids modification. Less sure about Junicode.</p>
      <p>And the problem, at least in the states, is deeper than finding one good font. Academicians, if they teach in the States, want tenure. To get tenure, you usually need a couple journal publications and a book. Now a journal, if it is printed, will have a set of fonts which are always used. And a book will be designed by either an in-house or freelance designer at a university press. Will they have time (a cynic would say have the interest) to see if the font they choose for the text has the needed diacriticals or special characters? Perhaps, but don't place a heavy bet. The number of fonts suitable for a book interior containing the characters needed for transliterated Arabic or IAST is real small. I can't think of any offhand. Some of the work we get is due to this very situation.</p>
      <p>My point is, how a manuscript appears is is valuable only for the manuscript, not for typesetting. But you are quite right -- for the author's files to be useful, Unicode should be used.</p>
      <p>I wonder if Adobe would be interested in making up, say Minion, with the needed glyphs. Now Minion may be viewed by the designers-whose-primary-aim-is-to-impress-other-designers as "boring," but it is more than serviceable for book interiors. I have over 1,000 fonts at work, but when I design, I specify Minion reasonably often, because it fits the author's work and my understanding of the intended audience.</p>
      <p>Things may be different along the Pacific Rim, but in much of the world, there is usually a difference between a <cite>manuscript</cite> and a finished product -- not that this is necessarily a good thing.</p>
      <p>FWIW</p>
