      <p>Well, Miss Tiffany, I at least sort of do. But I'll confess it helps a lot when the foundry offers something other than legalese -- Like Adobe's FAQ's on licenses.</p>
      <p>There was a Harvard (Yale?) law professor who was, shall we say, down on Credit Cards. In one of her senior law classes, a student came in &amp; showed her an offering where you got money back. As an exercise, she had the class try to determine under just what conditions they'd get money back. At the end, after hours of work, they could not reach common agreement.</p>
      <p>Now, not all Harvard (Yale?) law students are dumb. And these were seniors, about to head out into the world. So what chance do you think  you or I would have?</p>
      <p>In a way, I prefer the EULA's which say, right in the font on the copyright page in FontLab "You can't do a damn thing with this font." At least I'm sure about what they're saying.</p>
      <p>One of the interesting things about Adobe's license is it seems to forbid modifying the font, but when you read the FAQ, it's clear that modifying under certain conditions is permitted. The interesting thing is, according to Thomas Phinney, that the same lawyers wrote both the EULA and the FAQ. Go figure; what kind of a contract is that?</p>
      <p>. . . or is this a case of the choir preaching to the minister?</p>
