      <p>One of the reasons I don't mind people adapting my fonts is that I've done it myself on others' fonts.</p>
      <p>The scenario is this: a client I've worked with before wants some modifications to a font, not mine. So, do they contact the foundry to do the changes? Possibly, but there are three issues: delivery, price and quality. The original designer may not be available right now, the price may be too much, and the quality is in some respects unknown, as they haven't worked with that designer before -- quality being a result of process. Of course, none of that may be problematic, but the tendency is to contact someone you have a working relationship with.</p>
