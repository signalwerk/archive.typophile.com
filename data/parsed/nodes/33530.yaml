      <p>I would definitely agree with Miss Tiffany here, although my heart sometimes bleeds, and temptations crawls through my arteries - when I get a license for a software, it is generally prohibited to modify the  software without the constent of the person who made it. When I get a design, it is usually not allowed to modify it without the consent of the designer. Period. Unless the programmer or designer explicitly says otherwise. I know it. You all know it. I don't really care about laws here. It is common sense, it's good behaviour. We all hate other people messing with our work. Okay, I think we do. I, at least, hate it.</p>
      <p>I sometimes pay good money for software that I my hands are just itching to re-write it. I sometimes buy fonts where I simply yearn to get in there and correct the characters, because a few of them are just BAD, spoiling the whole damn typeface.</p>
      <p>But that's just the way it is. When people do not like something I did, I also like to tell them that they are wrong, that they have no sense for art, and that they can go to... well. I hate to find out that these people then simply "steal" the software and modify it without my consent. I hate to see them change my designs although I told them not to. It is rude. I don't want it. So I respect other people who do not want it either. Although it.... really... tempts me sometimes :-) But I resist. Go away, Darth :-)</p>
