      <p>I've spent the last 25 years setting long academic texts (usually in the humanities), and have a couple of observations that may apply.</p>
      <p>The first is, if you are setting material that will be printed offset, you need to see how the font prints that way, not on a laser printer. Generally, the font will appear rather lighter when printed offset.</p>
      <p>The second is to avoid any fonts with a EULA that prohibits modifying them for your own use, as do all the NEW Monotype &amp; Linotype OT fonts.  The reason is you will inevitably come across a diacritic or character not in the font. Now from 1980 to 1995 (when we started using PostScript fonts), we also couldn't get inside the font to make up special sorts (glyphs). For diacriticals, you can work around this, but it helps greatly to use what is now called a "layout engine" that lets you program things, like TeX. Imagine setting 400 "emacrons" with a font that didn't have this character, where you couldn't program it.</p>
      <p>Then there are special characters, which you sometimes just can't properly render from existing characters. The "eng" comes to mind. So you either borrow one from another font, or pay the foundry to make one up. The foundry's special sorts will be both expensive &amp; slow to come.</p>
      <p>I, for one, rejoiced at PostScript Type 1 fonts. Yes, they printed too thin, esp. with direct-to-plate offset lithography, but you could fix them. That was the beauty of them, with a weeks worth of work, you could make something that printed well, and you could add characters as you needed them. Nothing much has changed with OT, except those licenses (EULAs) which with one stroke take away the advantage of truly "Open" type.</p>
      <p>There are enough foundries out there who permit modifying a font for your own use, that permit embedding, etc. that you should pick one of those. After 25 years, I don't have a "favorite" font, I like 10-12 for text, but part of that appreciation is how they work for the text, and part of "working for the text" is the ability to make up special sorts.</p>
      <p>FWIW</p>
