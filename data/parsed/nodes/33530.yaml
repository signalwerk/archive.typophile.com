      <p>I once got into a heated long drawn out email debate with CSA after purchasing a CD of their stock art. After opening 8 layers of superb packaging, we pop the CD in only to realize the stock art is nothing but scanned in BMP files, which we found useless, so asked for our money back if we returned it. I then got to see the absurd wrath of Chuck explaining that as a powerful graphic design firm, us opening the packaging forever bound us to their EULA which prohibits returns.</p>
