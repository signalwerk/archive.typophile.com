      <p><cite>When I get a design, it is usually not allowed to modify it without the consent of the designer.</cite></p>
      <p>As an occasional designer -- and somebody who knows many graphic designers -- I'd say that doesn't fit. The customer/art director/senior editor etc. will make some changes. I don't know how to say it in German, but the English word "Art" has several uses. It is sort of like art for it's own sake is art, and can be accepted or rejected (bought or not). On the other hand, something that has an aesthetic element, but where the intended purpose is something other than art, doesn't have the "don't change it" aspect of fine art.</p>
      <p>It is that "other purpose" at issue here. So, if you don't like a typeface, don't buy it -- unless a customer insists on its use,  in which case you can decline the commission, or accept it &amp; hold your nose. But if a typeface is generally what is wanted by all, but in some small detail fails to perform its intended purpose (it is incomplete, had one really bad character, etc.), I would view that as different.</p>
      <p>Gentium, proposed above as a solution for certain kinds of academic texts, has no ligatures, no old-style numbers, no small caps, and no kerning. That it lack a bold doesn't bother me, but would bother some. Now these aren't "small details," they move the font from once category to another. Additionally, the overall aesthetic of Gentium is less than ideal for some texts, good for others, as with any single typeface. So, Gentium solves one kind of problem for academic authors, generating a manuscript which anyone can follow. That was its purpose. It does not solve another problem, namely publishing. Having the freedom to "modify" other fonts solves this problem.</p>
      <p>This is just one example,there are many, since it would be absurd to insist the font designer anticipates all the uses of his/her product. It doesn't even make sense to say the painter "didn't foresee the uses of their painting" -- unless you get political, where nothing make sense.</p>
