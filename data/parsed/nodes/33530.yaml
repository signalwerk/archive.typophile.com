      <p>Charles_e, thanks for your comments. I find that there is an underlying issue here which I have not expressed. </p>
      <p>In a production environment where there are several layers of service, everything has to be kosher, no modification means no modification (one could be sued, or worse, moralized at). Eulas allowing for modification make for much more efficient workflow, bringing us closer to typographical nirvāṇa. Also with digital texts increasingly being associated with the printed text, it is important to have proper unicode encoding rather than manually combining diacritical marks with letters in TeX/InDesign.   </p>
      <p>Interestingly, it is the free fonts which are working hardest to provide full diacritical complements: Gentium, Linux Libertine, Junicode, Cardo, DejaVu Sans, and others. These fonts are appearing because there is genuine frustration among scholars, which includes graduate students, who need to use diacritical characters not found in the standard fonts. For example, I know of a Buddhist Studies mailing list for scholars only, with several hundred members, and I guarantee that each one of them has some sort of non-commercial solution for writing the "n-dot-under" (in the word nirvana, above) and the other Sanskrit and Pali diacritics. This is because there are no commercial fonts available that include a full complement of diacritics. (Gentium would be a good reference point for what to include.) Scholars are not software pirates; they are generally willing to purchase things that meet their research needs. Scholars are also vain, and so there is a certain pride when the laser-printed manuscript or conference paper is printed in a nice font with all of the proper diacritics. Publishers with are increasingly asking for manuscripts in unicode. There is a definite market for reasonably priced fonts with extended diacritics.</p>
      <p>Many software companies have academic licenses. Why not for fonts? The stipulation for educational and not commercial use would justify the necessarily low price while preventing its use by publishers and presses. A commercially licensed version could include small caps, figures, superior numbers (for footnotes, of course), etc. and be sold for a normal price. </p>
      <p>A single good quality serif font, with the diacritics of gentium, in the standard 4 faces would be enough. It doesn't have to be the latest Sabon, but it should be a serious text font. A matched sans would be a nice option too. A tt/ot font is preferable because ms word 97, 2000, and xp have problems accessing extended character ranges in ps/ot fonts.</p>
