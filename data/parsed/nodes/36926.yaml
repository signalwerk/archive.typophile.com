    <p>I'm putting together a website for a small research lab at Texas A&amp;M. A rough cut of the logo I'm working on is attached. I'm trying to put together something minimal and classic. (Although I don't know exactly what I mean by "classic".)</p>
    <p>The lines depict the streamlines of a Taylor vortex. Since the streamlines are nothing special (to the audience who will see the logo), I'd like to add something that makes the logo more distinctive so that it can stand separate from the word mark.</p>
    <p>This first one is my favorite.</p><div class="imageWrap"><img src="http://typophile.com/files/tvl_logo_3819.png"></div><p></p>
    <p>I also considered this arrangement.</p><div class="imageWrap"><img src="http://typophile.com/files/option1_3978.png"></div><p></p>
    <p>And this was the logo when I was at Arizona State University.</p><div class="imageWrap"><img src="http://typophile.com/files/asu_tvl_logo_4353.png"></div><p></p>
    <p>Any thoughts?</p>
