      <p>I think the small "laboratory" gives some necessary emphasis to "Taylor-Vortex" over "laboratory". I agree don't that the 4 arrows aren't doing much.</p>
      <p>One arrow communicates the idea, which is that the flow circulates within a vortex cell. This is also the reason for having two cells in different colors: they're formed in pairs that counter-rotate. The arrows shown here depict the jet between them. There is of course meaning in other places: 1) competition and symmetries (and symmetry breaking) are important themes in the problem; 2) the vortices are enclosed between two concentric cylinders; 3) our apparatus is horizontal as opposed to the more common vertical apparatus.</p>
      <p>Here's a new cut that I think incorporates some of the suggestions. It's an improvement and I like Frutiger over the previous Avenir, although it still needs some work. I'm not sure I like the placement of "Texas A&amp;M" in particular.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/option4_6128.png"></div><p></p>
    html_clean: |-
