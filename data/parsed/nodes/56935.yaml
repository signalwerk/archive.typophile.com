      <p>mr said: "I’ve read (mostly on Typophile) that in Spanish typography the tilde should point upwards, with the middle segment almost horizontal. So I designed a tilde like that". (...)</p>
      <p>As far as I know, there's no rule on how to design the tilde sign. Even if you think on a typeface for —let's say— spanish language purposes. Only tradition could fit in order to reach to a conclusion. And common sense, of course!<br>
      My opinion is that a pointed upwards tilde is not very suitable and quite odd.<br>
      Anyway, we could find a pointed upwards tilde sample (for lowercase n) in the punches cut by Geronimo Gil, around mid XVIII century in Spain. I believe, it is because of calligraphic influences on his type work.<br>
      Furthermore, there shouldn't be any difference between spanish and portuguese "tilde" sign. Although it is better to design different versions for upper and lower cases (in order to fit better with the width and weight of the characters ‘n’ and ‘N’).<br>
      Best,  andreu</p>
