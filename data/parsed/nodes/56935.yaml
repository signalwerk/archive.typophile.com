      <p>Damnit I had just typed up a long response and IE at work deleted the whole thing.  I need to update my blog posting as I've collected more examples to show in the past few months and also to simply clarify my position.  But it's important to note it's primarily about the tilde in Spanish.  Other languages, as I noted, probably (surely) have different traditions.</p>
      <p>Both of your tildes are fine to me though I'd move the one on the n a little more to the right.  Probably best though to go for something in between the two but that depends on what your tilde and acute are based on. The thing to avoid is one which appears to be heavily slanted the other way (even though the curves are properly placed).</p>
      <p>As to do a language based swap, I know of handwriting fonts that do that for a number of differention langauge's diacritics, including making the ñ a macron, or in German making the umlaut a macron (or was it more like a tilde?  I forget).  </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
