    html: <p>Just remembered the link to the Biblioteca Nacional Digital which Miguel had posted a while ago. One of the pages presents digitized books <a href="http://purl.pt/index/livro/date/PT/index.html" target="_blank" rel="nofollow">in chronological order</a>. Clicking through some of the books, my impression is that the "flying tilde" was the norm (e.g. in books from <a href="http://purl.pt/14441/1/P13.html" target="_blank" rel="nofollow">1573</a>, <a href="http://purl.pt/13832/2/P8.html" target="_blank" rel="nofollow">1728</a>, <a href="http://purl.pt/14440/1/P34.html" target="_blank" rel="nofollow">1757</a>) and only shortly before 1900, in books typeset in classicistic type, the shape got more 'symmetrical' as is obviously expected today (e.g. <a href="http://purl.pt/1341/1/P11.html" target="_blank" rel="nofollow">1838</a>).</p>
