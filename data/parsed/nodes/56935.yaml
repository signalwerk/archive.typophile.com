      <p>I can answer only a couple of your questions, because I speak for Spanish, only. </p>
      <p>1. Does Spanish use a tilde on any other characters? No. Just the N. I am fairly certain that Portuguese uses a tilde on either the a or the o, but you'll have to consult a Portuguese speaker on that one. </p>
      <p>2. I'd be curious to read more about the idea that the tilde should "point up." The example you show of a tilde over the n seems to be "flying away." It doesn't look right to me. The tilde example you show over the a looks more like what I would expect to see over an ñ in Spanish. </p>
      <p>Hope that helps get the conversation rolling.</p>
