      <p>Ab, you are correct (at least for Spanish).  According to the Diccionario Panhispánico de Dudas:</p>
      <p><cite>El castellano medieval escogió el dígrafo nn, que se solía representar abreviadamente mediante una sola n con una rayita más o menos ondulada encima; así surgió la ñ, adoptada también por el gallego. Esa rayita ondulada se llama «tilde», nombre dado también al acento gráfico</cite><br>
      <strong>Translation: </strong><cite>Medieval Spanish chose the digraph nn, which was normally abbreviated to a single n with a more or less undulated small line written above; whence the ñ came, also adopted for Galician.  This small undulated line is called “tilde”, the same name given to the graphic accent.</cite></p>
      <p>Yesterday I saw the first handwritten (well painted) example of an inverted breve for a tilde.  I've seen it occasionally in books, especially with large print but nothing made in the past hundred+ year.  I'm so mad I didn't have the camera with me.  If anyone lives in A Coruña and wants to drive the road from Oleiros to Santa Cruz with their camera for me....</p>
