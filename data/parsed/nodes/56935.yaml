      <p>I try to make tildes look flat, on the principle that grave and acute are the angled accents.<br>
      AFAIK, only (polytonic) Greek has both tildes and macron, although strictly speaking the Greek "tilde" is a</p>
      <p>I've noticed that the apparent angle of the tilde varies with optical size in faces with stroke contrast.<br>
      This is because the tails are less significant at small sizes, causing the glyph to apparently rotate clockwise slightly.</p>
