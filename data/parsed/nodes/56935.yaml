      <p>"I’ve read (mostly on Typophile) that in Spanish typography the tilde should point upwards, with the middle segment almost horizontal."</p>
      <p>I have not read that on Typophile, but this I can tell you — 15 or so years ago, when the Spanish-speaking market was embracing the new technologies for news, magazine and book publishing, (and Font Bureau was embracing back), I had a note passed onto me from a famous Spanish-speaking artist who had been using some of our fonts to compose a book. He was pleased our tildes did not look like "the _________ ones from Adobe which seem to be 'flying away'".</p>
      <p>With no Spanish-speaking clients complaining against a 'running' tilde since then, I came to the conclusion that the flying tilde may be proper for calligraphic or historic designs, but perhaps not for typographic designs. With the addition of the low-resolution/poor-print-quality appearance of a running tilde proving unique-r amongst the accents than the flying tilde, our die was/is cast. </p>
      <p>But as always, if a 'special' is needed by anyone, in any of our fonts, for any language, we're happy to oblige whatever local designs apply.</p>
      <p>Cheers!</p>
