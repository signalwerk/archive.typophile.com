    <p>I've read (mostly on Typophile) that in Spanish typography the tilde should point upwards, with the middle segment almost horizontal. So I designed a tilde like that. Of course, a spacing tilde should have the more common angle (for use in URLs, mathematics, etc.).</p>
    <p>But I have two worries. The first is that the tilde on my "n" doesn't match the others. Does Spanish use a tilde on other characters? What about Spanish words in other-language texts? Will it look awkward?</p>
    <p>My other worry is other languages that use the ntilde. Are there any? Is the Spanish-style acceptable/correct in these languages?</p>
    <p>I know OpenType allows one to specify language-specific substitutions. Should I use them? What software actually implements this?</p>
    <p>Lastly, have I got the shapes right?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/tilde_4199.png"></div><p></p>
