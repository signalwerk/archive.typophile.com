    <p>Hello, this is my third post about chinese fonts, sorry about that, but I've just worked on a project in mandarin and, although the project is finished, am still looking into it.</p>
    <p>I had some problems embedding Mac OSX fonts into PDF so I looked around a lot and found several complaints concerning the Heiti fonts (SC and TC) that are now standard in OS 10.6. This link is the best example <a href="http://fixhei.monoceroi.com" title="http://fixhei.monoceroi.com">http://fixhei.monoceroi.com</a>.</p>
    <p>Does anyone have an opinion on this? I can't read a word (or ideogram) in chinese so I really don't see the flaws. I am concerned that the font may be flawed and am trying to find out if it is safe to use it in text meant for chinese readers.</p>
    <p>Your input will be greatly appreciated.</p>
    <p>Thanks,<br>
    Gabriel Attuy</p>
