      <p>What is being discussed are what can be best described as Pan-Chinese fonts that were introduced in Mac OS X 10.6. They are Pan-Chinese because they are TTC (TrueType Collection) fonts that advertise two font instances, one for Simplified Chinese, and a second for Traditional Chinese. The same fonts, though with Japanese and Korean fonts instances, are included with the iPhone, and those are Pan-CJK fonts.</p>
      <p>These two STHeiti fonts, Light and Medium, stem from two similarly-named Simplified Chinese fonts. The glyphs for the Simplified Chinese font instances follow GB 18030, which is effectively the URO and Extension A in terms of the ideographs. There are also 6,000 or so glyphs for Extension B code points, mainly for Hong Kong SCS coverage.</p>
      <p>I know the source of the glyphs, and I also know many of the issues surrounding the design and development of Pan-CJK fonts. One design issue that affects any Pan-CJK (or Pan-Chinese) font implementation is how to handle the locale-specific glyphs code points that do not have a source for that locale, meaning that the ideograph is not used. There are two choices. One is to simply not design a glyph for that locale, meaning that if used, the design may be inappropriate for that locale. The other choice is to design a glyph for that locale, and depending on whether there is an adequate source or reference for that ideograph for that locale, the designer may need to extrapolate.</p>
      <p>In any case, I consider the ST Heiti typeface design to be first and foremost a Simplified Chinese one. The Traditional Chinese glyphs needed to be designed. Of the 30K or so CJK Unified Ideograph code points that are covered, approximately one-third have forms that are specific to Traditional Chinese.</p>
      <p>I could go on and on...</p>
