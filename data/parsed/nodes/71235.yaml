      <p>lol, "black body!"</p>
      <p>Anyway, there are some very noticeable differences in the example you posted. But first, let me clarify that I am NOT a native Chinese speaker. Nor am I anywhere near fluent.</p>
      <p>In the second link you posted:</p>
      <p>- The stroke width consistency seems improved (look at the bottom of "zhe," 這 the third character from the left).<br>
      - Also, the top stroke of the speech radical 言 now stands upright (left hand side of the first character, also seen in the third character).<br>
      - The bottom radical of zero 零 (I forget what this radical is called) also has a more modern form.<br>
      - The radical 示 now takes on a different form when inside a character (see the left hand side of the second character).<br>
      - The silk radical 糸 is now also different when positioned in the left of a character (see the seventh character).<br>
      - The food radical 食 is also different (see the sixth character).<br>
      - If you look at the feather radical 羽, it is more modern.</p>
      <p>There other differences as well. I'm fairly certain that any person fluent in Chinese will be able to read either version, but if they're picky the second version is probably better. I find it more aesthetically pleasing, in any case.</p>
      <p>I think the most offensive problem is that there seem to be inconsistent radicals. Chinese characters are made up of "Radicals," which are smaller components. Some radicals have different ways of being written, and some of them change when they become part of another character, as opposed to standing alone. Some radicals have changed shape in the past few decades.</p>
      <p> If you look at 請, 情, 清, 啨, and 晴, the right half of these should all be the same. If you look at the lower-right hand side, its different from character to character in the previous version. The first link you provided highlights this (and other problems) nicely. </p>
      <p>Also, note that a lot of these are only for traditional characters; I'm not sure what changes would have been made to the simplified character set. Many of the problems wouldn't apply (for example, the bottom three strokes of the silk radical become a single line: 纟)</p>
