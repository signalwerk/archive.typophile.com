      <p>From van Krimpens <em>On Designing and Devising Type</em>: </p>
      <p>Both Thibaudeau and I are, of course, thinking of the real vintage, the Garamont shown on Conrad Berner’s Frankfort specimen sheet, and not of the Jean Jannon which, from the Imprimerie Nationale in Paris through many typfoundries and matrices for composing machines, is circulating the typographical world fortunately, because it is not the genuine stuff, under the, as a rule, mis-spelt name of Garamont (with d instead of the correct t).</p>
      <p>The book is full of these gems.</p>
      <p>But if you're looking for something more intentional there's always the <em>Molly Bloom's Soliloquy</em>; the final chapter in Joyce's Ulysses with Molly Bloom's thoughts written as a stream of consciousness. It's not without punctuation, but they are few.</p>
