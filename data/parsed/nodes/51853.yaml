      <p>I think in these cases, it's time to pull out the original use of punctuation: marking places to catch your breath. Grammar aside, those sentences make my writer sense flash because anyone trying to speak them aloud would have two choices: either to insert a vocal period, or to collapse from asphyxiation.</p>
      <p>Yes, I did just pun on "spider sense." </p>
      <p>Peace,<br>
      JT</p>
