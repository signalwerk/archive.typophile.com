    <p>I received this email from a very unfortunate chap, it has possible the longest sentence I have ever received.<br>
    "Hi, How are you today? I just want to introduce you to a job if you don't mind, I am mullins, a Certified Payroll Specialist (CPS), I am a disable man from New Jersey and I use to encounter a lot of stress when going about my daily payroll activities because I work as a chartered payroll specialist for many companies, and I have to work hard to make my money because nobody want to help me or employ a disable man in a wheel chair like me so that is why I set up my own payroll business and I want to employ anybody as my data entry typist from home, you could be a receptionist, data entry typist, a clerk, a stay at home mom, a student or anybody who has a computer experience with a computer connected with internet at home who want to work on a part time basis and earn extra income, I required a person who will be honest, trustworthy and able to work from home, and who will also handle the printing of letters, notes and checks with the data information of people on payroll list of each company I work for and I will handle the UPS, Fedex or DHL account label which will be made for you to dispatch the letters, notes and checks to various destinations, I will like to know if you will be trustworthy enough to entrust mine and my clients company's vital informations and signatory with you, please I want you to be sure that I will be paying you $1,500 monthly salary for a start, if you performed very well, I will increase your salary to $2200 and to $2,500 as time goes on, please get back to me today to know your interest and if you don't have the materials, I can send you money to purchase all the materials including a computer with internet connection, so if you are ready, then you will need the following materials to start the job"</p>
