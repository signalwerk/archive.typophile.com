    html: <p>Simon and George, he's meaning like what Kevin posted.  For example, in English you might have an A made out of an Apple, and B out of a bat, C out of a car, etc. and in Spanish you'd have the A made out of a tree (árbol), B out of a bicycle (bicicleta) and C out of a house (casa), and so on for each other language.</p>
