    <p>I am trying to locate "analog" alphabets in various languages.<br>
    By "analog", I mean that the shape of the letter looks like something, and that something has a name which starts by the same sound.<br>
    For example S and a snake.  b and bat and balls. M and Mountains.<br>
    The idea is to speed up the teaching of the alphabet by triggering some mnemotechnic association in a child's mind.<br>
    I have found a couple of examples in english such as a "Curious George" book and a Rudyard Kipling short story.<br>
    I was wondering if some forum members remember running across other examples and can give a reference.</p>
    <p>Paul Gouin<br>
    <a href="mailto:gouinpaul@gmail.com">gouinpaul@gmail.com</a></p>
