      <p>Theunis, I imagine that in designing an appropriate alphabet for <em>every</em> language, selecting designs for the glyphs that can be used in more than one language might add as much work as it took away.</p>
      <p>I wonder about our fixation on the beginnings of words (which has given us so much trouble with X), and whether it is universal. If Germans do this, how do they deal with the fact that nothing starts with ß? I know different cultures have differing ideas of what constitutes a rhyme, for example. There are tribes who describe the future as "back" and the past as "forward" based on the compelling logic of which one they can see. Might there be written languages somewhere that would best organize a list by final sound, or whose idea of a monogram would be the stressed vowel in each name?</p>
