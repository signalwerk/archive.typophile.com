    <p>I'm sure at least some of you have heard the story about the two Japanese guys being stopped at the Italian border on their way into Switzerland carrying $134 billion in supposed US bearer bonds in their suitcases.</p>
    <p>Wingnut radio host Hal Turner (of the Art Bell persuasion) has some of the close-up images on his site:</p>
    <p><a class="freelinking external" href="http://turnerradionetwork.com/index.php?option=com_content&amp;view=article&amp;id=59:employees-of-japan-finance-ministry-arrested-in-italy-trying-tosmuggle-134-billion-in-us-treasuries-in-suitcases&amp;catid=1:latest-news&amp;Itemid=50#June20Update" rel="nofollow">Click here...</a></p>
    <p>It looks like they took the 1934 series Grover Cleveland thousand dollar Federal Reserve notes and changed them to billion dollar notes. Dig the vertical scaling in the lower corners--priceless. And Latin Wide for the denomination at the bottom. Finally, dig the coupons, which look straight out of CorelDRAW.</p>
    <p>There's a <a class="freelinking external" href="http://www.youtube.com/watch?v=eMU7zeZcFUg" rel="nofollow">YouTube video</a> as well showing some uniformed guy pulling the rather strangely A4-sized "bearer bonds" out of a tattered brown man-purse.</p>
    <p>This story actually made it onto Bloomberg.</p>
