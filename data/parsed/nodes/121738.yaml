    <p>I was wondering if you all can help me identify the typeface used for the book "The Narrow Road to the Deep North" by Richard Flanagan. It's got Colophon's "Value Sans" type of feel, but its definitely a different typeface.</p>
    <p>Here's an image:<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/NarrowRoad_5936.jpg"></div><p></p>
    <p>Thanks in advance!</p>
