  html: |-
    <p>I am making a print book and the brand font is Gill Sans, but I 'd like to give it a very modern look, if possible. Has anyone discovered any really new/modern fonts that share the structure of, yet different enough to combine with Gill Sans?</p>
    <p>I have a list of typefaces to combine with Gill Sans already, but I'm not getting the modern look offered by so many of today's fonts. They are: Scalla, Joanna, Swift, perpetua, Whitman, Goudy, Albertina, Aldus, Bembo, Berling, PMN Caecilia, Chaparral, Dante, Garamond, Golden Cockerel, Minion, Palatino, Plantin, Poppl-Pontifex, Caslon.</p>
    <p>TIA</p>
