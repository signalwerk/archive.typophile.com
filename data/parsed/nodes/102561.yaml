      <p>Hi Fernando, as so many stories from the past this is a myth — due to the nationalistic movements of the 19th century, with the intention of claiming historical breakthroughs for their purposes.</p>
      <p>There IS a statue of Coster (note the spelling with a /c/) in Haarlem, but there is no serious historian nowadays who will support the notion of Coster having invented printing instead of Gutenberg.</p>
      <p>Now, on a different tack, the invention of telephony is e completely different story… A G Bell stole that, of course… : )</p>
