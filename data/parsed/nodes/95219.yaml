    <p>Fonts.com is proud to announce two new releases – the JMC Engraver &amp; Feldman Engraver typeface families – by Monotype Imaging designer Terrance Weinzierl. Commissioned as companions to Nancy Sharon Collins’ new book The Complete Engraver: A Guide to Monograms, Crests, Ciphers, Seals, and the Etiquette and History of Social Stationery, these fonts are FREE for download from Fonts.com. Simply add to your cart and enjoy. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 3_4223.jpg"></div><p></p>
    <p>With 224 pages, and 180 illustrations, The Complete Engraver is both an archive, as well as celebration, of the art of engraving, from its origin to contemporary practice. A designer &amp; authority on engraving, Collins also provides insight on the evolving role of social stationery in today's age of electronic correspondence. The JMC Engraver &amp; Feldman Engraver typefaces, featured below, are a testament to bridging this analog and digital divide.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 2_5384.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 4_4520.jpg"></div><p></p>
    <p>Of the fonts’ development, Weinzierl explains: “The designs Nancy proposed were a selection from ‘masterplates’, or lettering templates used for manual engraving machines. The design process started with scanning prints made with engravings. I redrew the shapes with singular, vector lines — an approach similar to the line drawn by the engraver. These designs have a Victorian soul with a typographic body.”</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 5_5482.jpg"></div><p></p>
    <p>Indeed, the aesthetics of both the JMC Engraver &amp; Feldman Engraver typefaces appear to not simply be inspired by—but, rather, channeled through—the visual ethos of the engraver. The pair of typefaces remain true to the proportion, rhythm and grace of antique engraved letterforms. develop the structure of the letterforms further, Weinzierl adds: “We added a precise stroke weight to that line; to put it simply, we dug the dirt away, rebuilt the skeleton, and put the muscle back on. As a designer, the revival projects I’ve done have not only helped me understand typographic history better, but helped me draw better curves and build better fonts.”</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 6_3881.jpg"></div><p></p>
    <p>Stylistic alternate characters, as seen above, enhance the versatility as well as visibility of the fonts – in addition to both designs providing distinct airs of engraving’s elegance, the typefaces possess an unmistakable kinetic energy. As Weinzierl notes: “JMC Engraver &amp; Feldman Engraver have that handmade feel, and they flaunt it with exuberant curves and curls. I don't think it’s a coincidence that we indulge in these organic designs when we get a chance, as it's very different from our daily challenges requiring pixel perfection.”</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 7_6738.jpg"></div><p></p>
    <p>The Complete Engraver is available for pre-order here and will be released in stores in September. To learn more about the The Complete Engraver, please visit author Nancy Sharon Collins’ website Engraving for Nerds.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 8_4392.jpg"></div><p></p>
    <p>Want to know about typography and process of engraving? On Friday, August 3, Nancy Sharon Collins will present Engraving and Type, A Beautiful but Somewhat Dysfunctional Relationship at TypeCon2012: MKE SHIFT. To learn more about the program, visit the TypeCon2012 website.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/image 9_4843.jpg"></div><p></p>
    <p>For more information on Nancy’s book, whose full title is “The Complete Engraver: A Guide to Monograms, Crests, Ciphers, Seals, and the Etiquette and History of Social Stationery,” visit <a href="http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674" title="http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674">http://www.papress.com/html/book.details.page.tpl?isbn=9781616890674</a></p>
