      <p>There are four kinds of typeface:</p>
      <p>1. A commercial product which is a collection of fonts.<br>
      2. A commercial product where there is only one font in the typeface.<br>
      3. A design which may be considered independently of particular commercial products, i.e. one which has been implemented by more than one foundry and/or in more than one medium, e.g. Hobo.<br>
      4. A design which has been reinterpreted in many ways, often quite different, to the extent that it is a communal archetype—typographers "know" what its general characteristics are, independent of any particular implementation. Bodoni, Garamond, Caslon, Jenson, Century, &amp;c.</p>
