      <p>This is what I occasion to say on the subject on the ATypI discussion list last month:</p>
      <p>I think there is a fairly direct parallel between a metal font as a set of sorts, a hotmetal font as a set of matrices, a photo font as a disc or strip of negative or positive images, a dry transfer font as a sheet of rubdown images, and a digital font as a collection of outline or bitmap glyphs. The principle difference is scaleability: a font of metal type, a set of hotmetal matrices or a dry transfer sheet are size-specific, whereas photo and digital fonts are scaleable. In all cases, the design that we think of as the <em>typeface</em> can be extracted from the particular implementation as a font, most obviously by being implemented in a different technology. Ergo, regardless of the technology there is a need to be able to distinguish, in thinking or speaking about some aspects of type, the typeface design from the font implementation.</p>
