      <p>@all</p>
      <p>Remember well:<br>
      The word <em>typeface</em> is impossible to translated into French, Italian, Portuguese and Spanish. It doesn't exist in these neo-Latin languages. To replace the word <em>typeface</em> in French, Italian, Portuguese and Spanish is the word <em>font</em>. </p>
      <p>Font in Portuguese is <em>fonte</em>, which means literally <em>source</em>. Font in Spanish is <em>fuente</em>, which means literally <em>fountain</em> and <em>source</em>.</p>
