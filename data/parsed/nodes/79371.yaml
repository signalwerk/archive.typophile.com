    <p>Hi all, I'm a long time lurker of the site. </p>
    <p>A few nights ago I got into a discussion about whether the words 'font' and 'typeface' are entirely interchangeable or whether there is a difference between the two. </p>
    <p>Online dictionaries suggest that they have exactly the same meaning along the lines of: a complete set of letters and numbers in one size and style, used for printing or for computer documents</p>
    <p>but I wondered whether that was the end of the story?</p>
    <p>Many thanks in advance,</p>
    <p>Ravs</p>
