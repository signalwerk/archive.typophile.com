      <p>@John Hudson:<br>
      I agree that the distinction you refer to as existing between a "typeface" and a "typeface family" is real, and needs to be preserved in order to have accurate terminology.</p>
      <p>The only way in which I disagree with you is that I believe that existing usage gives the word "typeface" the meaning which you express by "typeface family".</p>
      <p>The meaning which you assign to "typeface", on the other hand, makes both weights and optically-adjusted versions into distinct typefaces, so it is indeed clear and unambiguous. I don't think there is an existing term in typography with that meaning.</p>
      <p>And I suppose that using "typeface family" and "typeface" is superior to inventing a new term, and, say, using "typeface" and "shape-collection" as the terms for the two things. But if the existing usage of typeface is not possible to change, I fear that might be what has to be done. (I suppose "shape-collection" might sound better if we borrowed the German-language version of it, or a similar term.)</p>
