      <p>Judging from many of the type i.d. requests on Typophile, it seems that the word "font" in the minds of many in the general public includes not only typefaces, but lettering, handwriting, calligraphy, stone carved letters--in short, any kind of letter no matter how it was made. </p>
      <p>My own theory is that it's the fault of the ubiquitous "Font" menu. The average person, with no knowledge of typography, sees this menu called "Font", looks at its contents, sees different styles of letters, and concludes that "font" must mean "letter style". Thus, when they see some style of letter (with no idea how it was made), they come here and ask what "font" it is.</p>
