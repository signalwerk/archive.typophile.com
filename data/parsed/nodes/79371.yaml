      <p>Myriad MM is a font. Myriad MM italic is another font. There were two fonts in the MM implementation of the Myriad typeface. There are 40 in the OpenType implementation.</p>
      <p>Those of us who still use MM technology in typeface design are able to have fewer upstream fonts (in MM form) to make it easier to create more downstream fonts from instances of the MM font.</p>
      <p>This is a great example of why, when dealing with this stuff on a professional level, it is really useful to have clear definitions.</p>
      <p>Of course, with the MM technology, the really interesting question is how many masters did you have to create, and how that compared to the number of output fonts in the end, rather than how many MM font files those masters were stored in. So for example, Hypatia Sans had two masters for six fonts (plus a large handful of alternates for the black master, to make the black weight work for both interpolation and on its own). Then double that all for the italics.</p>
      <p>Cheers,</p>
      <p>T</p>
