      <p><em>…it's taken for granted that all fonts are computer files…</em></p>
      <p>But they aren't.<br>
      Letterpress is not extinct.</p>
      <p>That's not the point, however.<br>
      A typeface may be considered as a family of fonts, sharing the same stylistic genes.<br>
      For instance, Helvetica is a typeface, comprising fonts such as Helvetica Bold and Helvetica 67.<br>
      A font cannot be comprised of fonts, that doesn't make sense.</p>
