      <p>One point that has come up in this discussion implies the need to be careful about the distinction involving a <em>third</em> term.</p>
      <p>Bodoni is a <em>typeface</em>.</p>
      <p>It is available in several <em>weights</em>, the roman, italic, and bold.</p>
      <p>You can obtain a <em>font</em> of one of those weights in various forms. While I think that Kelsey has closed up shop, one type of font would consist of, for example, 4 pounds of a lead-antimony alloy, with perhaps 26 "a"s, 36 "e"s, and so on and so forth. Another might be a Type 1, TrueType, or OpenType file to enable a computer to print in a given weight of a given typeface.</p>
      <p>I'm not quite sure, though, that  a set of matrices to be placed in a Monotype matrix-case, or a disk with images of the characters upon it to be placed in a phototypesetter, was ever called a font, and so the general meaning of "means of delivery" depends on the recent usage in connection with font files.</p>
      <p>And, of course, there is a question of whether Bodoni Book should be considered another typeface or a weight of Bodoni.</p>
