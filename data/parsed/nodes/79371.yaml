      <p>Since it is generally accepted that Times Roman Italic, and Times Roman Bold belong to the Times Roman typeface, I think that it's necessary to include <strong>weight</strong> along with <strong>typeface</strong> and <strong>font</strong> as technical terms with specific meanings that should be used carefully.</p>
      <p>What about optically-adjusted versions of a typeface?</p>
      <p>Adobe sells Times Ten as a completely separate typeface from its regular Times Roman.</p>
      <p>Some fonts use multiple master technology to automatically choose between different masters depending on the size of type you use. This is analogous to the situation with metal type, where, when you ordered a font of Century Expanded from ATF, you got the optical adjustments appropriate to the size you ordered. (Since type was generally used for letterpress printing, instead of creating lithography masters, this was appropriate; it wasn't likely to be optically reduced or enlarged.)</p>
      <p>And some typefaces are sold with different optically-adjusted versions in a common package, but in separate font files. So they're packaged like different weights - and, depending on how those font files are internally labelled, that may also be also how they will show up in a word processor menu.</p>
      <p>Are optically-adjusted versions of a typeface... different typefaces, different weights of a typeface, or intrinsic parts of a single weight of a typeface? The answer, of course, is that they're none of those: they're <em>optically-adjusted versions of a typeface</em>. Because they're not <em>really</em> any of those other three alternatives, it may be most appropriate or convenient to package them in any of the three ways typically used.</p>
      <p>I would also say that small capitals are a case, while titling is a weight.</p>
