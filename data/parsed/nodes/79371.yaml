      <p>I just want to collect the definitions in one place again:</p>
      <p><strong> A font <strong> is a collection of letters and/or symbols of a particular typeface created, stored and intended to be used together.</strong></strong></p>
      <p><strong> A font family <strong> is a collection of fonts of varying styles based on the same typeface.</strong></strong></p>
      <p><strong> A typeface <strong> is a set of visual rules from which fonts are created.</strong></strong></p>
      <p>Examples:</p>
      <p>- I like that typeface!<br>
      (I like the visual rules applied to create that font). You would not say, 'I like that font'. </p>
      <p>- x and y are fonts which are all variants of the same typeface.</p>
      <p>- I would download a Helvetica font.</p>
      <p>- I would prefer a Helvetica typeface over a Comic Sans typeface.</p>
      <p>- If I stole your font, I might have downloaded it without your permission.</p>
      <p>- If I stole your typeface, I might have created a font in a very similar style (because I used the same rules to create the font)</p>
