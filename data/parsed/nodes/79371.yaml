      <p>The 500 or so type professionals in the world, and let's say another 1000 typographic enthusiasts, are the only ones who are keeping the font / typeface terminology distinction alive. </p>
      <p>The original Macintosh called it the "Font" menu, not the "Typeface" menu, and accelerated the merging of the terms. In the bitmap-font era, I guess one could've argued in favor of either term, but Font was shorter, and that mattered when you only had 512 pixels across. The arrival of outline fonts diluted the distinction further. (If a "font" is a specific style and size of a "typeface," what does it mean when all the sizes and styles are derived from one master file?)</p>
      <p>For nonprofessionals, "font" is the prevalent term and embraces both meanings. "What font does the New York Times use?" "Imperial." "What font should I use for my report —&nbsp;11 point Bembo, or 10 point Adobe Caslon?" And so on. Lexicographer Bryan Garner agrees, saying that "Technology has changed the meaning of this term …&nbsp;font most often denotes a whole family of styles that can be printed at almost any size." (Garner's Modern American Usage, 3rd Ed. at 364). </p>
      <p>Indeed, I have always found that attempts to teach nonprofessionals the term "typeface" usually results in the response "oh, you mean a font?" If folks get the conceptual distinction, that's what counts. It doesn't really matter if they want to use the same word. Let's also note that typography pros muddy the waters by sometimes using the terms interchangeably —&nbsp;I mean, why is it the Font Bureau, not the Typeface Bureau? Why is it FontShop not TypefaceShop?</p>
      <p>Under this common usage, YES, a font (meaning 1) can be made of fonts (meaning 2). If you dislike the idea that "font" can mean more than one thing, consider the term "type." When I worked in a lettepress shop, "type" was stuff made of metal and stored in cases. But we also say "type designer," using "type" to mean "typeface." And then we have companies like Storm Type Foundry, which makes and sells fonts, so I guess "type" means "font" in that context. So "type" can mean at least three different things.</p>
      <p>I predict that "typeface" is on its way to becoming merely an important-sounding synonym for the popular term "font," like "physician" for "doctor."</p>
