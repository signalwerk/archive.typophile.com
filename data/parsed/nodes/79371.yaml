      <p>Thank you everyone for continuing to humour my geekish fascination with the subject.</p>
      <p><strong> "A font cannot be comprised of fonts, that doesn't make sense." <strong></strong></strong></p>
      <p>But don't people call a collection of fonts of the same typeface in different styles 'Font Families'?</p>
      <p>Nick and Thomas, your distinction between typefaces and fonts makes much more sense to me than those suggested by the font-feed article posted by eliason (3rd post in this thread).  I must speak to my professor friend again, because I have sneaking suspicion that your definition is probably the same as that used by US IP statute(s). Sadly I don't know which ones they are as I don't have access to the material - but he did say that fonts were treated as a subspecies of typefaces. </p>
      <p>Saying that a font represents the delivery mechanism and using the CD / Song analogy, while accurate, to my mind almost makes the word 'font' redundant, because the collection type to which it once referred is now nearly redundant. I take the point about letterpress being in existence, but it's use is not significant when compared to fonts stored as computer files. A font is wider than a descriptor of the delivery system, whether it be computer files or metal type, it is also a descriptor of the typeface (that's what threw me).</p>
      <p>I find it quite subtle, because the definition is not entirely Cartesian but what I have learned is that:</p>
      <p>A font is a collection of letters and/or symbols of a particular typeface created, stored and intended to be used together.</p>
      <p>A font family is a collection of fonts of varying styles based on the same typeface.</p>
      <p>A typeface is a descriptor applied to distinguish the appearance of font (or font family), usually by name (e.g. Helvetica).</p>
      <p>Putting this hypothesis to the test, I might say:</p>
      <p>Helvetica is a typeface. (Here I am referring to the style of letter-form which makes Helvetica what it is).</p>
      <p>Helvetica is a font. (Here I am referring to a collection of letters and symbols which comprise Helvetica).</p>
      <p>Helvetica Regular bold and Helvetica Regular Italic are all part of the Helvetica font family. (Self explanatory).</p>
      <p>So:</p>
      <p>I would download a Helvetica font.<br>
      I would prefer a Helvetica typeface over a Comic Sans typeface.<br>
      If I stole your font, I might have downloaded it without your permission.<br>
      If I stole your typeface, I might have created a font in a very similar style.</p>
      <p>Am I getting there?</p>
