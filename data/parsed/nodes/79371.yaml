      <p>As the articles point out, the words have different meanings. However in common usage by the general public, the words are often used interchangeably. </p>
      <p>A few years ago I heard a dictionary editor discuss this subject and his observation was that "font" was gradually replacing "typeface" in common usage because when 2 words have a similar meaning the public tends to use the shorter word.</p>
