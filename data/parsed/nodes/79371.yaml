      <p><cite>Sure, because they are the people for whom the distinction is meaningful. Many professions employ specialised vocabulary usage that is irrelevant to the needs of lay people.</cite></p>
      <p>The conceptual distinction is meaningful and relevant to lay people. They just use the same word for both ideas. Compare <em>book,</em> a term that embraces a similar pair of meanings: "my brother wrote a book" and "my brother bought a book." In the first usage, <em>book</em> means a text, which might be stored in a word-processing file. In the second usage, <em>book</em> means a specific instantiation of that text for a reader. (And "I bought my brother's book" is an ambiguous sentence without further context.) </p>
      <p>The professional-necessity argument for having two terms would be more persuasive if type professionals a) agreed on the specific distinction between the terms (as this thread shows, they don't) and b) used the terms consistently (they don't). </p>
      <p>So to go back to the OP's question, I'd say that <em>font</em> and <em>typeface</em> mean the same thing, unless you're talking to type professionals, who reserve the right to use <em>typeface</em> to mean something narrower than <em>font</em>.</p>
      <p>Because I frequently discuss typography with nonprofessionals, I've mostly purged <em>typeface</em> from my vocabulary, without negative side effects.</p>
