      <p>Then again, I wonder if there's any real purpose in having a distinction between the two words. Printing presses have gone the way of the dinosaur (except for a tiny number of specialist printers), so there is only one significant font (in the sense of 'a physical embodiment of a collection of letters', or 'a delivery mechanism')which is the medium of computer files; for the life of me, I can't think of any other significant media in which collections of letters and symbols are stored, can anyone think of any?</p>
      <p>If that's right, and it's taken for granted that all fonts are computer files, I suppose you might say, 'That's a lovely typeface, could you email me the computer file font [as opposed to the lead type font]?', but wouldn't it be easier to say, 'That's a lovely font, could you email it to me?'?</p>
      <p>lol, never thought I'd get into these waters when I asked the question.</p>
