      <p>Quadibloc: <em>Since it is generally accepted that Times Roman Italic, and Times Roman Bold belong to the Times Roman typeface...</em></p>
      <p>No, they belong to the same <em>typeface family.</em></p>
      <p>A typeface is an individual format-independent design. Ergo, all variant styles, weights and size-specific <em>designs</em> are distinct typefaces. They are grouped into families of related typefaces. They are implemented in fonts, which are sets of glyphs in particular formats or technologies.</p>
      <p>I have spent a lot of time thinking about this nomenclature, and it is the only one in which each term means one specific thing and not anything else, and hence the only one that is useful for analytical discussion. Everyday conversation of the 'Hey, pass me that hittie-thing, I need to bang a nail' variety does not require such precise usage.</p>
