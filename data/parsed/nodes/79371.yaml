      <p>Thanks very much for the link eliason.</p>
      <p>James, from my reading of the links posted, they are presently interchangeable, but there are (sensible) moves afoot in the industry to create a distinction: font = vehicle of delivery and typeface = look/feel. It will be interesting to see if that distinction becomes the accepted norm.</p>
      <p>As things stand though, if one were to say, "what a lovely font!" Most people would understand that to refer to the look and feel rather than than the vehicle of delivery.</p>
      <p>A friend of mine who is a law professor in the US mentioned in passing that under US IP law, a font is defined as a sub-species of a typeface, so it seems that there yet other distinctions out there although those would probably only be ever used for the purpose of statutory interpretation.</p>
      <p>Interesting observation by the dictionary editor, thanks!</p>
