    html: <p>Thanks Matthew, I feel the same way about the x. I'll take your advice on the v, weight modulation and curves. <br> <br>I'm also thinking of adding some extra strokes to the letters, so as to make it feel more like chinese. <br> <br>Thanks again! (in mandarin thats Sie-sie ni) =) <br></p>
