  html: <p>Hi All, I just discovereed this forum recently, I love it!  <br> <br>I started this font a while back, later discovered it was  too thin/weak for screen use. Looks acceptable printed out but no smaller than 24pts. <br> <br>I want to improve it, thinking of making it bolder for starters and making upppercase and numbers. Its based on the chinese Sung-Ti typeface (last 4 characters in attachment) <br> <br>I'd love some advice and critique.  <br> <br> <br> <br>Thanks!</p>
