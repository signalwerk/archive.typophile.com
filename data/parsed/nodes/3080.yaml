    html: <p>It's a very nice start. The letters that stand out to me as far as needing improvement are the "x" and "v". The x is too fussy and the v is not strong enough in form (too "u" like). <br> <br>Also, overall, you may want to incorporate more of the original lettering's weight modulation and curves.  <br> <br>Otherwise, looks cool. It's a lot more elegant than some imitation chinese/japanese fonts that try too hard to look like their ancestors. <br></p>
