      <p>I already mentioned Graphik. It has a lot of similarities, although it is based on the European Neo Grotesque genre — whereas HM Ampersand is based on its American counterpart: the Gothic.</p>
      <p>Graphik also have a wide selection of weights, and <a href="http://www.fontshop.com/fontlist/genres/extra_light_grotesquegothic_sans_serifs/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here’s a list of extra light Gothics/Grotesques</a>.</p>
      <p>I do not know of any News Gothic/Trade Gothic variants with round tittles and punctuation.</p>
