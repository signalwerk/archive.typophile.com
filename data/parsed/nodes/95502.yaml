    html: <p>This is not Helvetica Neue. It is a custom drawn typeface for H&amp;M called HM Ampersand.</p>
    html_clean: <p>This is not Helvetica Neue. It is a custom drawn typeface for H&amp;M called HM Ampersand.</p>
