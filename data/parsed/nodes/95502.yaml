    <p>I feel as if this font must be helvetica neue but then is there alternative glyphs that give round circles as the dots in the lowercase "i" or punctuation marks? The lowercase "a" seems like it is different. The bold version looks like a different font. I took the picture from the H&amp;M store ads because I felt it looked like helvetica neue thin/ultralight but I didn't know they had round alternatives or is it just editing via something such as illustrator? Or is this a real font?</p>
