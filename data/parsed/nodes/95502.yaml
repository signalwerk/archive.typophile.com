    html: |-
      <p>It looks like it is based on News Gothic/Trade Gothic, but more geometric. <a href="http://www.fontbureau.com/fonts/bentonsans/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Benton Sans</a> is a contemporary take on the genre.</p>
      <p>Another face with traces of both geometrics and grotesques is <a href="http://typographica.org/typeface-reviews/graphik/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Graphik</a>.</p>
