      <p>Corrected post:<br>
      Good find Mike. I was curious about what the "GT" refers to. It seems to be for Gemini Fonts<br>
      Another foundry that uses prefix _GT_ for its fonts is Grilli Type but they seem to have no relation to Gemini Fonts. BTW I have seen a version labeled GT-Stettler. Poor quality digitization, and as Mike said, caps only.<br>
      Don</p>
