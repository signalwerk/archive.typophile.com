      <p>If you are looking for substitutes you could use Identifont for Optima <a href="http://www.identifont.com/find?font=optima&amp;q=Go" title="http://www.identifont.com/find?font=optima&amp;q=Go">http://www.identifont.com/find?font=optima&amp;q=Go</a> and go through the similar fonts.<br>
      Intersting ones include Cyrus Highsmith's Amira, Thierry Puyfoulhoux's Alinea Incise,  José Mendoza y Almeida's Pascal, Gábor Kóthay's Minerva Modern, and Hermann Zapf's Optima aka Classico or Zapf Humanist 601.<br>
      Don</p>
