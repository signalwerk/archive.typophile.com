  html: |-
    <p>I've been using Gill Sans ultra bold lately.<br>
    I admire its peculiar aspect, founding it very legible in spite of its extraordinary weight. I am pretty sure Eric Gill took great fun in drawing some letters… do you agree?<br>
    I noticed a curious thing: the exclamation mark is made of a single form, the stem actually touching the dot.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gill-Sans-Std-Ultra-Bold_5231.gif"></div><p></p>
    <p>Has anyone in mind other fonts in which the exclamation mark is made of a single shape? I'm very curious about this.</p>
