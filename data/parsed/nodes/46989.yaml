    <p>For type fans looking for something to read, I give you:</p>
    <p>—————-&gt; <a href="https://web.archive.org/web/20080907161821/http://www.typodermic.com/postscript_always_renders_twice/harold_lohner.html">a conversation with harold lohner</a> &lt;-—————</p>
    <p>This is the kerned &amp; animated version of the title piece. Top—Pharmacy, below—Roselyn script. I’ll get Ray to update the static online version at Typodermic with this animated one.</p>
    <p></p><div class="imageWrap"><img src="/web/20080907161821im_/http://www.typophile.com/files/postscript_anim2_4536.gif"></div><p></p>
    <p>Pharmacy was an early unicase type, an adaptation of a pharmacy sign Harold found <em>“at a local (Albany, NY) drugstore. Waiting at the red light, I’d often stared at the sign, admiring its jolly and curious mix of upper and lowercase, and of course the peculiar asymmetrical capital A.”</em></p>
    <p>Pharmacy goes rather nicely with Roselyn : ^ )</p>
    <p>With much gratitude and thanks to Harold, who turned 50 yesterday. Thanks to Ray Larabie for hosting.</p>
