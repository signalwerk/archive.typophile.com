  html: |-
    <p>I'd like to know if the three historical French scripts have been translated<br>
    into digital typefaces?<br>
    As a reminder, here's the list of these XVI/XVII th century scripts:<br><em>Ronde, Bâtarde, Coulée</em>.<br>
    Do the designers of the typefaces change their names for commercial purpose?</p>
    <p>All I can find is <em>ATFrenchScript</em> which is a <em>Ronde</em>.<br>
    It originated from <strong>Stephenson Blake</strong> back in 1905.</p>
