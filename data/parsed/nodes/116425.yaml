      <div class="comment-spam-body"><p>I can make a pretty good guess as to the scripts you mention, but it would help a lot if you could post an image of your example of each script. Believe it or not, variation exists.<br>
      As for name changes, I assure you that makers of digital versions of old typefaces often change the names because somebody else owns a the name, or because they believe a different name works for them for any of a multitude of reasons.<br>
      Don</p>
      </div>
