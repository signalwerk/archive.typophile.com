    html: "<p>The font Gee Whiz, made falsely italic and with kerning left as is, yields this: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/50295.gif\" alt=\"\"> <br> <br>Gee Whiz hails from Dinc Type who I don't believe ever offered an actual clone <br>of a commercial font, but many of their offerings over the years were clearly <br>manipulations of existing commercial fonts � often with lowercase only and <br>poorly done. <br> <br>In any case, the font used appears to have been Gee Whiz and who knows what <br>it started out its life as (my vote would be for Dom Casual Italic, modified and <br>using the N to make the M). <br><br></p>"
    html_clean: "<p>The font Gee Whiz, made falsely italic and with kerning left as is, yields this: <br> <br><img src=\"http://www.typophile.com/forums/messages/83/50295.gif\" alt=\"\"> <br> <br>Gee Whiz hails from Dinc Type who I don't believe ever offered an actual clone <br>of a commercial font, but many of their offerings over the years were clearly <br>manipulations of existing commercial fonts � often with lowercase only and <br>poorly done. <br> <br>In any case, the font used appears to have been Gee Whiz and who knows what <br>it started out its life as (my vote would be for Dom Casual Italic, modified and <br>using the N to make the M). <br><br></p>"
