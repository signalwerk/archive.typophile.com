    html: |-
      <p>Don't assume that all of us are adults ... even if we are old enough to be. :)</p>
      <p>I suspect that you will be blown away when you look at the price of InDesign. However, you can get 30 day trials of the software free, and if you put in a lot of time with it, you will learn a lot. As well as InDesign, Adobe also has Photoshop and Illustrator as other types of programs that have typographic components. You could move onto those after your InDesign trial runs out.</p>
      <p>There are a lot of good tutorials for all these programs on the web in general, and Adobe's site in particular. </p>
      <p>Finally, there is a free program called GIMP that works like Photoshop, and one called Serif that works (a bit) like InDesign. You can go to these if you can't con your parents into buying the Adobe software.</p>
