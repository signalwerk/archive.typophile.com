  html: "<p>Well.. I don't know if I'm in the right place.. And I'm sure I'm dealing with a bunch of adults who probably will doubt what I can do, but I don't care I'm trying it anyway (: I'm looking for a program that is SIMPLE to use, as far as typography goes.. What goes into typography? Do you type a word then move it to how you want it moved? I don't think it'd be that simple, just someone please try to explain basic steps to typography and how to start.. Thanks (: (Btw I'm 14)</p>"
