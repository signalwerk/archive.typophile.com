    votes: 0
    html: |-
      <p>Hello,</p>
      <p>To help answer your questions, I think Ellen Lupton's <a href="http://www.thinkingwithtype.com" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Thinking With Type</a> is a good starting point. The book is well worth checking out, and I'm sure the website will give you plenty to absorb. I also suggest looking at the books listed at <a href="http://dunwichtype.com/typelibrary/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Type Library</a>, especially those under general typography.</p>
      <p>Most professionals use <a href="http://www.adobe.com/products/indesign.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Adobe InDesign</a> to create layouts that are typographically good, for print at least (It costs a lot, but Adobe does offer student discounts. Check to see if your school has it installed in any of their labs. There is also a free 30-day trial you can download.) Good typography is more a result of decisions made by a designer, and less about the specific tools used. You can make something nice in Microsoft Word, it just takes more effort.</p>
      <p>I hope that helps. Good luck.</p>
      <p>(It seems that you know that typography is not the same as type design, but just to make sure: the drawing of letters/making of fonts is type design, the arrangement/layout/spacing/etc. of text is typography.)</p>
