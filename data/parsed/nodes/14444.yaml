  html: <p>When creating a webpage, I specify an OpenType font that contains lining, ranging, and tabular numerals.  How could I most easily take advantage of the extra numerals?  Is there an HTML/CSS command to toggle numerals, or would i have to carefully translate individual numerals into Unicode (either by hand or with a webauthoring tool)?</p>
