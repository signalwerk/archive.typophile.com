    html: |-
      <p>Yes the easiest solution would be to have two fonts, embedded or installed on the client machine. One font could just contain the osf's (mapped to the regular fig code points) the other the complete font with the standard figs. Then use CSS to switch font when you need to use the OSF's. I think this is acceptable (providing the EULA lets you do this) and standards-compliant.</p>
      <p>Cheers, Si</p>
