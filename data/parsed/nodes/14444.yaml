      <p>Unless...</p>
      <ul>
      <li>The Opentype font is installed on the user's local system; or</li>
      <li>The Opentype font is available to the local system as a sIFR font, Embedded Opentype, Portable Font Resource or other similar embodiment...</li>
      </ul>
      <p>...it really doesn't matter whether or not CSS will support it. I'm fairly certain CSS2 doesn't support the option of such toggling; CSS3 may...</p>
