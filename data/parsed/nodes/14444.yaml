    html: |-
      <p>Assumptions: let us assume the visitor of the page has the font installed, or, the page has the font SRC set to a working URI, or the font is embedded, etc.  In my particular case, everyone's using Longhorn beta 1.</p>
      <p>Unicode: this would get messy.  Seems there are designated Unicode ranges for monospace numerals, but no Unicode ranges for ranging versus lining numerals.  Looking at a variety of fonts that happen to contain both ranging and lining numerals, there is no methodology for organizing these numerals - all fonts seems to be organized differently.  So, to use any extra numerals, one would have to manually write out glyph codes depending on the particular font.  This is sorta crazy.  Would be nice if the Unicode people created Unicode ranges for ranging/lining numerals.</p>
      <p>CSS:  I can't find anything in CSS3 spec regarding numerals.  It's too bad {text-transform: uppercase | lowercase} doesn't make numerals uppercase or lowercase.  Would be elegant if it did, but that would require coordination among the Unicode people, CSS people, and the browser people.</p>
      <p>Mathematical characters: It might work to use MathML and &lt;math&gt; tags, at least to turn off ranging numerals.  Haven't tested it with the fonts I like to use.</p>
      <p>Solution: Simplest workaround seems to be to duplicate and rearrange and rename the fontfiles, swapping numerals as desired.  Is there a better way?  Am i missing something?  I would think changing numerals would be a very basic thing.</p>
