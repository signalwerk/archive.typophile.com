    html: |-
      <p>Are you authoring for the internet (rather than say corporate intranet)? You can't assume your reader will have that font installed, or indeed any font with those extended characters defined. If it's just an experiment, I'm pretty sure that referring to numeral styles is outside the current capabilities of CSS.</p>
      <p>I suspect that you could copy extended characters from say InDesign to Dreamweaver. It's a long time since I've used DW but I recall that it would automatically use Unicode encodings where it needed to.</p>
