      <p><cite>I'm a bachelor in graphic design and I'm having trouble finding the right fonts to design a book about squatting. I'm looking for a good font for my body text &amp; headers.</cite></p>
      <p>This may sound churlish of me, but I'm trying to be brief. First of all, book designers don't use the term "headers." There is a reason for that. Secondly, a book interior is not generally considered a "graphic design" project. (Yes, I know there are a exceptions. Especially for those books whose role is to rest on a coffee table and not be read.) There is a reason for that, too. Maybe a first step would be to read a book or two about book design. If you just need familiarization, Rich Hendel's <cite>On Book Design</cite> could be helpful. If you need a how-to manual, you'll need a different book. (I don't know of any successful how-to design manuals.)</p>
