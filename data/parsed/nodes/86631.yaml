      <p>Great topic! I have experience with house-squatting longer than I have with fonts. </p>
      <p>I’d suggest a kind of <a href="http://myfonts.us/td-ygJ6aj/?refby=i" rel="nofollow">“industrial”, idiosyncratic sans</a>, like Trade Gothic, Bureau Grot, Bau, Hermes, Venus, Folio, Rhode, Franklin or Benton Sans, Dagny, Titling Gothic, Scout etc.<br>
      Most of them have wide as well as condensed styles which should give you enough possibilities for a varied layout, headlines and text, also on photos. (If it was about East Germany, Neuzeit, Super or a similar geometric sans-serif would fit too)<br>
      Grey cardboard, black and white photos, recycling paper, maybe some red …</p>
    html_clean: |-
