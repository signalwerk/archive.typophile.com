      <p>Usually I would say sure, allude to the subject matter in one's design and typography.<br>
      But here it seems false; radical chic.<br>
      Try to find a way to embody the politics of squatting in your production design.<br>
      For instance, print your text in the white space of pages taken from coffee table books, palimpsest-style.<br>
      Then the choice of font would be one that contrasts with the original typeface.</p>
