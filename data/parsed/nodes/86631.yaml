    <p>Hi,</p>
    <p>I'm a bachelor in graphic design and I'm having trouble finding the right fonts to design a book about squatting. I'm looking for a good font for my body text &amp; headers. I want my font to be correct in a iconographical way, and I have troubles searching for the right type because of the lack on background knowledge on typography. </p>
