      <p>This shows more promise than I would have expected (since I'm not a fan of this style). But what I would do is make it more display, and more interesting, by: dumping the current lc; making the current UC the lc; and making caps -maybe that only reach the x-height- with mostly traditional structures. I think then the results might even be nicely saleable.</p>
      <p>hhp</p>
