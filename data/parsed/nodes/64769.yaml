    <p>Hullo hullo,</p>
    <p>Here is an attempt I made at a typeface, inspired by the Niemeyer buildings in Brasilia. It takes modernism | bauhaus in a new direction.<br>
    I know some things are not right yet, I somehow think I know which but I certainly don't know how to fix that. Help! Please! The following link is to a large image<br><a href="http://farm3.static.flickr.com/2494/4137562760_8cc073a3b9_o.jpg" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://farm3.static.flickr.com/2494/4137562760_8cc073a3b9_o.jpg</a><img src="/sites/default/files/old-images/brasilialphabet_4439.jpg"></p>
