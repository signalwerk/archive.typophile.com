      <ul><li><cite>Brasilia is the name of the font, I probably should have explained.</cite></li>
      </ul><p><img src="/sites/default/files/old-images/brasilia_1_4448.png"><br>
      …And that name is taken. A typeface called <a href="http://www.typogabor.com/hollenstein/pages/25-hollenstein.html">Brasilia</a> was designed by Albert Hollenstein and Albert Boton in 1960. It is now available from a number of distributors—as part of the Monotype’s <em>Creative Alliance</em> font library—under the name of <a href="http://www.fontshop.com/fonts/downloads/creative_alliance/pl_brazilia_vp/">Brazilia</a>. Apparently, the design of Brasilia/Brazilia was inspired by the architecture of the new capital city of Brazil, which was the hottest thing going, in 1960.</p>
