    <p>Hullo hullo,</p>
    <p>Here is an attempt I made at a typeface, inspired by the Niemeyer buildings in Brasilia. It takes modernism | bauhaus in a new direction.<br>
    I know some things are not right yet, I somehow think I know which but I certainly don't know how to fix that. Help! Please! The following link is to a large image<br>
    <a class="freelinking external" href="http://farm3.static.flickr.com/2494/4137562760_8cc073a3b9_o.jpg" rel="nofollow">http://farm3.static.flickr.com/2494/4137562760_8cc073a3b9_o.jpg</a></p><div class="imageWrap"><img src="http://typophile.com/files/brasilialphabet_4439.jpg"></div><p></p>
