      <p>I like your "bug" theory, Joel!</p>
      <p>***</p>
      <p>Clarendon was not the first bold, as we understand the concept.<br>
      Updike, in <em>Printing Types</em> (plate 310, 2nd edition, 1937) reproduces three samples of Bodoni's Ducale size of type, three different weights, as shown in Bodoni's <em>Manuale</em> of 1818.</p>
      <p>It's hard to assess the influence of Bodoni's work, as his types were not used commercially, but I suspect that other European type founders would have been familiar with it.</p>
    html_clean: |-
