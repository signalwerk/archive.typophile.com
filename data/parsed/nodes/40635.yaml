      <p>So i'll translate the theoretic work i've made to be an auxiliary for my presentation for this work, even not being request, as i said, i learned to love Clarendon ehehe.</p>
      <p>Egyptians came with, from the word of historians like James Mosely, the hands of the " tablets ads" (i don't know the english word, it is the place that is supposed to be the name of the bar, place, store...) painters, very used for pubs and inns, that's why the egyptians were very amused in United Kingdom. The typefaces from that time, like Bodoni or Didot, wouldn't have enough visibility for the purpose. So, the real objective of the so called egyptian typefaces was to offer excelent visibility e that could be easily scaled to big dimensions (like an add, it is pratically impossible to do this on the natural materials (i think it was steel, i think that's the english word please help me on these words) because of the weight that each character would have).</p>
      <p>Registered in 1845, still on the name of the Thorowgood &amp; Co ( the "Co" was Robert Besley), it appeared the Clarendon. The first typeface being registered, the future of the type designers was being written here may i say. The enterprise bought the Fann Street Foundry (Fann Street Foundry was founded by Robert Thorne in 1794, especialized in making typefaces with strong serifs, mechanical forms. Typefaces named egyptians.) and 4 years later Thorowgood as retired and so it changed the name to Besley &amp; Co (the "Co" now, was Benjamin Fox) and that's why we most of the times say as being a Besley's typeface but from what i searched and saw, the real clarendon designer was Thorowgood.<br>
      Just for curiosity, later, Robert Besley as became Lord Mayor of London.</p>
      <p>So... how did someone remembered to do the Clarendon typeface?<br>
      The Clarendon was developed from a bug! On the print, some times it didn't print so well and so the final work would have some blurs and too much tint ( please the word for this :D) some kind of "bolding" but it wasnt purposed on this time. The concept idea of Bold comes with this "bug" when someone remembered to do a typeface from this "bug" so it could be an auxiliary item of the design. The born of Clarendon. Its "boldish" design and the still beautiful typeface design could help the designer to make hierarchies on the text, doing the diference between the so Clarendon and the roman types.<br>
      The letters of Clarendon are pretty close to a perfect square, something i've seen when i drew by hand the typeface (later i can post some photos if you want) and at the same time it was a squared and mechanical, Clarendon typeface still a beautiful typeface, even for the time.</p>
      <p>Now we can see Revivals of clarendon like Candida from Jakob Erbar and the digital editions from Linotype or Monotype (done in 1935).</p>
      <p>The Clarendon was used on the United States traffic signs, later replaced by Rawlinson Roadway.</p>
      <p>The original Clarendon can be found at the "Type Museum of London".</p>
      <p>About photos, i can send them later if someone is interested.</p>
      <p>Please, don't let "Clarendon" die and help me knowing more about this type and so, keep on sending stuff.<br>
      Nick Shinn has done a wonderful job on the node he told me. See it too.</p>
      <p>Joel Santos // youremin<br>
      sound &amp; visual</p>
