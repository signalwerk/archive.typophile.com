    html: |-
      <p>This thread is most likely dead, but I'll vouch for the f and r serifs. I think it makes the font more readable. With a terminal font, consistency is less important, and anyway, the letters you should be looking at as ones that stand out are the unserifed d and b. But these are good choices too because they are more legible because of it (their extra width is something I really like about this font).</p>
      <p>To me, the vertical spacing seems comfortable, but like you said, that's just personal preference.</p>
      <p>As for the colon and semicolon, I think being in the middle of the x-height is not a big deal. You could claim that it helped distinguish them, but I'm not sure it would be much of an advantage. I would be more concerned about the weight, because the colon seems pretty easy to overlook. I will say that I love the disparity between the two though. Because of that thick comma, it's very easy to tell them apart.</p>
      <p>Anyway, sorry, Brian, for contradicting almost everything you said, but that's how I feel about this font.</p>
