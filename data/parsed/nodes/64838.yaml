      <p><em>Now, suppose I want to publish this online as a free font. Where’s the best place to do that?</em></p>
      <p>What format is the font in now?</p>
      <p>If you want to make a TTF of it, you could rebuild it with <a href="http://fontstruct.fontshop.com/" rel="nofollow">Fontstruct</a> and share it there.</p>
      <p><a href="http://www.theleagueofmoveabletype.com/" rel="nofollow">The League Of Movable Type</a> is another option.</p>
      <p>(Of course you could just put it up on your own website if you have one, but the places I mentioned are more likely to generate some interest for your font.)</p>
