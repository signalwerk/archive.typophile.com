    html: |-
      <p>Perhaps this is too late, but I have a few comments.</p>
      <p>First, this is pretty good, I think. It does remind me a lot of Terminus (the font I use in my Linux Terminal). Other characters remind me of the terminal font it switches to on boot (no idea what that's called). If I can I'd like to get a copy of this (in a bitfont format) for use in my terminal.</p>
      <p>I have a few suggestions:</p>
      <p>* The Curly brackets are not exactly alike, I think the leftward one needs work.<br>
      * Colon and semicolon should be raised to x-height<br>
      * The a, c, s, and other characters appear to be trying to use less pixels, however the r and f are complicated with serifs in a way no other characters are.<br>
      * For a font intended to be used in terminals, it has some pretty lofty ascenders and descenders. They look good, but that's not the goal in a terminal font.<br>
      * Your lines are also a little farther apart than they should be. You've minimized space very well horizontally, but vertically not so well.</p>
      <p>Anyway, the height of ascenders and descenders may or may not be a problem. It probably depends on preferences. I would like to see a bitfont file though (like .bdf), that would be useful to me.</p>
