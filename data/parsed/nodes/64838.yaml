      <p>Speaking as a professional software developer and a type enthusiast: I like it.</p>
      <p>Unfortunately, there just isn't much demand for hand-crafted pixel fonts anymore these days. Furthermore, given the wide range of physical DPI resolution of the displays in use, it's likely that any given pixel font would be either too large or too small for any given user. (In my case, your pixel font is significantly too small to be practical for workhorse use.)</p>
      <p>Nice job, though.</p>
