      <p>Thank you both for your opinions!</p>
      <p>Apankrat, to address your comments,</p>
      <p>(a) I suppose that means it's a decent design. :)</p>
      <p>(b) I took out the serifs on those fonts to see the difference, and I don't think I like the change. Maybe I'm just used to the serifs being there by now, and you're used to them being absent (in Dina, for example). To me, it feels like if the i, j, l, and (almost) t have serifs, then the f should have one too. Here's a picture for comparison.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/cn serif noserif_3834.PNG"></div><p></p>
      <p>(c) It was in fact after being frustrated with Dina that I decided to make this font. It's been so long since I designed the font (I just realized it's been about three years since I made it, not one as I stated above) that I can't remember exactly what the issues were. I have a feeling, though, that Dina felt too wide (it's 7 pixels wide whereas this is 6): my lines were disappearing off the screen and I saw there was wasted space between the letters.</p>
      <p>Now, suppose I want to publish this online as a free font. Where's the best place to do that?</p>
