      <p>I think it's a tragedy that people don't feel like they can tinker with fonts, and worse that type designers don't allow it. Type designers enable designers; they don't produce a finished product. I see it like a composer/performer relationship. I never felt bad altering pieces to my liking when I played piano. It drove my teacher nuts, but I was the one playing. It's like trying to shame Glen Gould for the Gouldberg variations. It's not just preposterous, it's sad.</p>
      <p>That being said, it's definitely uncool for people to modify and sell someone else's fonts, or to alter them to avoid paying the original designer. It's also silly to expect a foundry to support hacked up versions of their fonts. The type design industry needs to get away from the software model of selling fonts anyway, but that's a whole other thread.</p>
    html_clean: |-
