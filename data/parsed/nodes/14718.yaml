      <p>Tiffany and Jason:<br>
      The type of modifications I undertake are usually of this sort:<br>
      rearranging glyphs for ease of use;<br>
      combining smallcaps and ff ligatures with roman into a convenient opentype version;<br>
      adding unusual kerning pairs if I find a need;<br>
      and, very occasionally, adding ff ligatures where none exist.<br>
      Oh, I think I've also prebuilt a fraction or two.</p>
      <p>As you can see, my modifications don't change the nature of the face...with the exception of the ff ligs they're invisible.</p>
      <p>I'd be happy if these mods were generally allowed. Would I pay a premium for this? Well, yes, but as it happens, many of the foundries that forbid mods are already premium priced. Go figure!</p>
