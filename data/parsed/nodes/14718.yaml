      <p>"With PostScript Type 1 fonts, renaming isn’t so bad."</p>
      <p>I actually find it to be quite a headache. I can't tell you how many hours I've spent trying to figure out what name was wrong. For example if I have two fonts in the same suitcase that are both Condensed it will freak out unless I change each to: Cond, Cnd, Condensed or any other letters that look like the word "condensed".</p>
      <p>What has driven me up the wall is that I have actually been able to name all as "condensed" for example without an issue. Most commonly what happens when I've tried to render PS Type 1 suitcases is I only get two weights that pop out of a 4 weight or higher family.</p>
      <p>After taking Adam's workshop, I think I'm more likely to go with the OpenType naming process for any type I render. For example:</p>
      <p>BiddleSchrift Condensed Bold or BiddleSchrift Light (FOND name)<br>
      regular<br>
      italic<br>
      small caps (other weights)</p>
      <p>Lucas' Thesis Family probably has the best naming system in these regards. But alas, this is a whole 'nother thread....</p>
