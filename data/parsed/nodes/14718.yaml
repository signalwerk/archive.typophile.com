      <p>I just try to remember what Bringhurst has to say on this subject:</p>
      <p>"What doesn't need tuning or fixing shouldn't be touched. If you want to revise the font just for the sake of revising it, you might do better to design your own instead. And if you hack up someone else's font for practice, like a biology student cutting up a frog, you might cremate or bury the results."</p>
      <p>I've made a royal mess of many an attempt to understand how things work, and while I haven't cremated all of these experiments, I do bury them away in a "practice" folder, along with notes, so that I can return to relearn certain lessons when necessary.</p>
      <p>My point is that, like John, slicing &amp; slashing away at a perfectly good font is indeed a great way to learn about it, I'm just very hesitant about presuming to fix or improve an organism I know relatively little about. But I'm still going to continue with ever more delicate and specialized tools until I'm confident enough to perform surgery on a frog (ahem, font) I think will survive my attempts to improve its kidney, lungs, heart, etc.</p>
