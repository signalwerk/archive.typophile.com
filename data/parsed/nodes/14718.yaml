      <p>Hrant, both of your suggestions/comments are exactly what gall me about most EULAs. I'm not quite sure where the ethical line is to be drawn between re-writing AFM files (yawn), time-consuming and awkward hacks in the setting application (InDesign/Quark), or simply tweaking a good font at the source. I mean, of course I understand the time and effort and experience and dedication that goes into designing and engineering a well-made font, and it is exactly that understanding that makes me hesitant and respectful when it comes to such tweaking.</p>
      <p>I'll admit that in the past I -- like many, I'm sure -- simply crept in and made the adjustments I thought necessary to the fonts I was working with. This was both due to a lack experience and an arrogance in thinking I knew what was best for the project at hand. Yet underneath both of these excuses is also an honest goal: well-set text without ridiculous arm-twisting.</p>
      <p>For example, I use Minion a lot for book work and I have to admit that if I could figure out how to work with VOLT I'd be in there in a second fixing a variety of small quirks that I've mentioned in the <a href="http://typophile.com/node/12883">thread</a> around my little <a href="http://www.greenboathouse.com/dewinetz/pdf/typographers-checklist.pdf">Typographer's Checklist</a>. FontLab won't recompile this font and VOLT gives me a migraine, so as far as my trusty work-horse goes, I'm stuck with awkward hacks and numerous character-styles to get the font to do what I want it to do.</p>
      <p>This, it seems to me, is the issue. I'm a designer/typographer (not, per se, a type designer) trying to set type well. And too often very, very well-made fonts won't let me do so. Maybe it's an "ff" lig with oddly long arms (<em>ahem,</em> Fedra Serif), or tight kerning on 37 and 47, or a thousand other tiny bugs. The point is that a good font is an instrument with which to make good music: a viola or a piano. And, as Bringhurst says, both violas &amp; pianos need to be tuned.</p>
      <p>The tricky part is, who's to do the tuning? The inexperienced thug I was a few years ago, or the somewhat educated novice I am today? I'd like to think that the last 4 or 5 years of modestly dedicated application &amp; study have taught me something, but, really, each day I'm just made aware of how much more I have to learn.</p>
      <p>John, I do have Chaparral holstered in the background, ready to pull out if I need to, and I agree Robert made it look beautiful in <em>Solid Form</em>, but it still isn't quite what I have my heart &amp; keyboard set on, and what good are any of us if we're not discerning &amp; insanely picky?</p>
      <p>What is incredibly frustrating is that the understandably trepidatious position of foundries to refuse designers the permission to "modify" fonts is based on a fear not so much that they might do a disservice to the design (it seems to me that if you're able to both recognize &amp; correct something like a metrics problem, you're probably good to do so), but that there is a fear of improving the design to make a profit at it. I'm sure there are many out there striving to do just that. Yet I don't know anyone that would do so. I don't want to be paid for filling a pot-hole, I want to design a highway using a concrete that will guide my plans and the driver's tires where they're meant to go.</p>
      <p>Nobody gets into typography for fun. It's just where some of us end up. I want to practice it well. And I want fonts that will let me do so.</p>
