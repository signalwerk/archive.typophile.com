      <p>I have seen problems that I don't understand when using numbers in a font name, so I tend to avoid them.  And, I agree that, for some reason, giving families members names like Nolan Fancy, Nolan Swishy and Nolan Boring sometimes presents problems, and I often can't figure out why, but I can't recall any cases where adding a simple suffix has messed me up. What problems have you seen? </p>
      <p>I didn't mean to suggest a complex name change. I was just attempting to allay concerns that the font might be mistaken for the original. If one wanted to keep track of versions and the like, I think one would do that within the version or notice and description fields. Come to think  of it, if people felt that renaming was too risky, perhaps an alteration to the notice or description field would do.</p>
