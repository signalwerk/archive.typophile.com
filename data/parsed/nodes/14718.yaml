      <p>I'm not a font designer, though, and I have no idea how much time is taken up supporting fonts. Naively, I thought that most correctly built fonts would require little "tech" support, and that allowing user modifications would, in fact, lighten the load on the font designer. Unusual kerning and the like could be dealt with by the user, without a lot of fuss.</p>
