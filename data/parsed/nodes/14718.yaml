      <p>Thanks for the input Adam, Simon &amp; Hrant,</p>
      <p>You're right in that I haven't contacted Peter at Typoteque. I'm a pretty small-time freelancer and thus costs are always a major factor, and as I've never contacted a foundry directly to inquire about this sort of thing, doing so simply didn't occur to me as a viable route to pursue. By that I mean that I had and do assume that procuring such permissions would double/triple (?) the price and, at my budget, the base cost for a decent bundle of the Fedra family is already a bit daunting (like I said, small-time).</p>
      <p>Don't get me wrong, my whole point here is that I'm willing to spend the money for a font I know I'll use a lot and which I'm very fond of; the trick seems to be finding such a font with what I think should be "given" rights with purchase (modification, conversion, embedding, etc.).</p>
      <p>I will, however, contact Peter and simply inquire what the cost might be to gain these permissions. You've been very encouraging in your kind words about Peter and thus I'll venture a note and see what develops.</p>
      <p>Hrant, what you've suggested is simple enough, yet, as you said, inelegant. Perhaps I'm just expecting/wanting too much all at once: a well-drawn and constructed font with a decently comprehensive glyph palette in a convenient format and at a price that doesn't make an embarrassment of my bank balance. Strange that such a description seems quite reasonable, yet also hopelessly naive.</p>
      <p>While at first I felt a bit foolish on reading your posts -- that is, for not taking the small step to contact the foundry before giving up on Fedra -- those same posts have now pushed me to do so. So, thanks.</p>
