      <p>John Nolan writes "FOND IDs are obsolete" and then includes a reference to Adobe's documentation on Type 1 Unique ID numbers. It's like I would say "Nobody needs phone numbers" and would point to an article talking about ZIP codes being abandoned. FOND ID numbers have nothing to do with Type 1 Unique ID numbers. </p>
      <p>FOND ID numbers are devised by Apple, placed in the "FOND" resource of the Mac Type 1 suitcase, and are used on Mac OS only. They are not obsolete, they are used to enumerate fonts on the system and to classify the fonts by their primary codepage. Each FOND ID should be unique. In FontLab, you set the FOND ID numbers in Font Info / Encoding and Unicode. </p>
      <p>Type 1 Unique ID numbers used to be devised by Adobe, placed in the "LWFN" files (the "printer font file") on Mac OS or in ".pfb" files in Windows. They are obsolete these days. In FontLab, you set the Type 1 Unique ID numbers in Font Info / Version and Identification / Key identification settings. </p>
      <p>Neither ID number is used in TrueType or OpenType fonts (although OpenType PS fonts may contain Type 1 Unique ID numbers). </p>
      <p>Regards,<br>
      Adam</p>
