      <p>John, I humbly disagree: Apex Serif is no alternate for Fedra Serif; Peter's design is much better realised than mine.</p>
      <p>Jason, I would add my voice to the chorus urging you to contact Peter directly. If you have paid for appropriate licensing for what you are doing with Fedra, he may smile upon your requests for modification. And I would imagine he would insist that the embedding stipulated in his EULA be followed.</p>
      <p>(Speaking personally, I am grateful for the insight which other designers can bring to my work; if my ligatures are awkward, I want to know so that I can do better next time. Adam Twardoch has graciously tweaked my ogoneks in the past, so I now know how to make them myself. A customer in Iceland has helped me with my eths and thorns, and a Norwegian designer has helped me reimagine how I make æscs, etc. etc.)</p>
      <p>I trust that you have done this kind of OpenType font collation before; it's not difficult, but it's not easy either.</p>
      <p>Hrant, AFM files are superfluous in a Macintosh DTP environment, and altering them doesn't affect the kerning of the font: All of the spacing and kerning info is built into the PostScript Type 1 printer and screen fonts. Windows is a different kettle of wax altogether.</p>
      <p>And you wrote, "people who bother to even notice that EULAs exist shouldn’t be the ones who are punished." Hallelujah! I couldn't agree with you more. I'm overwhelmed with bright joy when a customer buys more than one license, acknowledging that they are licensing a font for more than 4 computers. I would estimate that the ratio of properly to improperly licensed fonts is something in the neighbourhood of 1:10. Amongst professional designers, I'm guessing.</p>
