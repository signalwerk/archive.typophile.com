      <p>In this specific case (the topic of this thread) things have turned out quite well. My exchange with Peter at Typoteque continues to be encouraging, so I'm very glad I wrote that first post way up there, and grateful to those who encouraged me to ask more questions and to do more research.</p>
      <p>As to John's last post (no threat of personal injury in font modification), that is more or less my position as well, except that it doesn't address a very, very important point: who's to judge an improvement from a mutilation?</p>
      <p>If we're talking about correcting the metrics &amp; kerning a bit, I simply can't/don't see anything wrong with that (if I can do it in my typesetting application, why not in the font file...), but as soon as I take a step further, I'm uncomfortable. For instance, I'm really not fond of unattached tails on cap Q, but modifying the font file to attach that tail seems to me to be crossing a very important line.</p>
      <p>Yet that line, like most, is a thin one. My point is that I try to force myself to honestly consider whether I'm making a small modification, or changing the "nature" of the face and its glyphs. Not always an easy determination to make.</p>
      <p>All I can say at this point, based on recent and current experience, is that asking others for input, contacting the designer/foundry, and taking things one step at a time has worked out very well. I was more or less ready to write Fedra off for a number of reasons, but after this thread and contact with Peter, almost all of my concerns have been addressed.</p>
      <p>Now, granted, these are rare and unexpected circumstances, as Peter's work on the soon-to-be-released OpenType Pro version of Fedra Serif miraculously addresses almost everything I had to complain about, but what I've learned and gained from this experience has been well worth the effort.</p>
