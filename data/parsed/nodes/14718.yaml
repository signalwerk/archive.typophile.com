      <p>Thanks for inviting me here to clarify those questions.</p>
      <p>For the last two years or so, we've been working on the OpenType version of Fedra Serif. Rather than just wrapping the PostScript fonts into OpenType, we've tried taking advantage of the format. That's why it takes a bit longer than expected. </p>
      <p>Kyle has mentioned that Fedra Sans is now available in OpenType, in two different versions:</p>
      <p><a href="http://www.typotheque.com/OpenType_Pro">http://www.typotheque.com/OpenType_Pro</a><br><a href="http://www.typotheque.com/OpenType_Std">http://www.typotheque.com/OpenType_Std</a></p>
      <p>Fedra Serif Pro will follow shortly, and will offer even larger character set than the Sans, supporting all European languages including Greek and Cyrillic, scientific and math glyphs, and more.</p>
      <p>This has given a possibility to revisit also the Latin set, and many modification have been made. I agree with Jason that the 'f' ligatures in Serif B Book have been too wide, and not really usable. The ligatures, and many more fixes were addressed in this update. Fedra Serif Pro will become available this autumn, and Typotheque clients will receive free update in the format they have licensed, and a possibility to upgrade to OpenType for a small fee.</p>
      <p>Now to the EULA: it has been written in 1999, and it might be a subject to some modifications as things have changed. However, it will still disallow reverse engineering and modifications. Typotheque is a small foundry and as such we have been always trying to come forward to meet the needs of diverse projects. This is not a money-making scheme, in fact most of these small modifications were made as part of a standard (free) service. However, knowing which versions of fonts are being used by the clients is the only way to guarantee functionality of the fonts. The issue will become even more complex with inclusion of digital signatures in fonts, as this will have consequences on how the fonts will be displayed in the OS.</p>
      <p>Our standard EULA allows sending PDF files to your printer, proof-reader, client, however for publishing PDFs online, or distributing it third parties you will need to get an embedding addendum.<br>
      Peter Bilak / Typotheque</p>
