      <p>I've been thinking about this ("tagging" modified fonts) and it seems too quickly to spiral out of control even within the confines of my own head. There are various ways one might "tag" a font to indicate that it has been modified, what the modifications are, when they were made, etc., but what would be the point considering that we're talking about personal modifications that would not be distributed in any way? I mean, of course we're shipping files to service bureaus, but from what I know, printers don't have the time or energy to actually "keep" submitted fonts, let alone organize a thousand slightly different versions. The folks I know who work at print-shops can't delete font files quickly enough to avoid any problems with them. This is a fairly slippery slope, it seems, so I do understand foundries' reluctance to venture that'a'way.</p>
      <p>As to Peter's question around what sort of modifications I had in mind, in this specific case I really feel/felt the "f" ligs needed some work, but I'm curious now to see how they've been cleaned up in the new version Peter mentioned. This, to me, is an extreme case of modification; normally I'd avoid any font that had characters I was so uncomfortable with that I'd want to edit the glyphs directly. In this case, however, I'm fond enough of the font as a whole that I really did feel (perhaps arrogantly) that I could tidy up a couple of glyphs to the benefit of the font as a whole (and, thereby, the text being set).</p>
      <p>Beyond this all I really have in mind are slight customizations in metrics &amp; kerning (and, perhaps, some baseline shifting, etc.) that every font seems to require. For instance, I prefer a bit more space inside left &amp; right parens than most fonts build in; certain number combinations seem always to be poorly kerned; etc., etc. Again, it seems to me that regardless of how much work goes into a well-made font (and I know that a LOT of work goes in there) there will always be small issues both general and specific-to-taste that could benefit from tweaking.</p>
      <p>However, what I'm confronted by whenever I think about this is the simple question: am I up to the task? Can I, honestly, improve the font? Or am I just mucking things up to be clever? I know that my experience in this field, guided by a few very kind folks more experienced than I, brings with it a large sense of respect &amp; restraint, but it also brings some understanding both of faults and possible solutions.</p>
      <p>I'm very encouraged by this thread and by Peter's participation. There is, it seems, an uncommon level of open-mindedness and curiosity in this community that I wish existed in other areas of both my professional and personal life.</p>
      <p>I think what I'll do in this situation is wait for the OpenType version and go for it. Then, if I discover any small issues, I'll contact Peter directly to seek his advice/recommendation/etc. For the moment, Peter, thank you again for joining this thread. I look forward to corresponding with you soon.</p>
