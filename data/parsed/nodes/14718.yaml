      <p>The new FF license _is_ very nice in many ways, and they certainly have some very nice fonts. </p>
      <p>They don't allow modifications, though. As long as the formats offered are what you want, and you're reasonably sure you won't want to tweak anything (don't forget that altering kerning pairs is a modification of the font file!), they may be attractive to you.</p>
      <p>I have a couple of other suggestions for you Jason:<br>
      Chaparral and PMN Caecilia Std. Both are available from Adobe in Opentype with favourable EULAs. </p>
      <p>Chaparral is, I think, under appreciated, has optical variations, and, I believe, even allows editable embedding. (Check that EULA yourself though!)</p>
      <p>You can see it used to good advantage in Bringhurst's <em>The Solid Form of Language.</em></p>
