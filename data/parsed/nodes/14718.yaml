    <p>I'm in a bit of a dilemma here. I've recently had an opportunity to work with Typoteque's <a href="http://www.typotheque.com/site/fonts.php?id=6" target="_blank">Fedra Serif B</a> family and I've become quite fond of it. However, I have a few concerns:</p>
    <p>1 The "f" ligatures are awful and I'd want to clean them up.<br>
    2 The EULA doesn't allow for modification.<br>
    3 I'd want to combine the PS fonts into an OpenType family.<br>
    4 The EULA doesn't allow for modification.<br>
    5 The EULA is too restrictive regarding PDF embedding.<br>
    6 The EULA is ruining my day.</p>
    <p>That said, I really like the proportions and personality of the face, it has a decent glyph palette (with the Expert set), the small caps and oldstyle figures are there and good, there is a solid range of ligatures including a "Th" lig that I like to have, and there are some great alternate characters as well (multiple ampersands in the roman and italic, a couple of long-tailed Qs, etc.)</p>
    <p>It kills me that the only thing I DON'T like about this font are the "f" ligs, which would be easy to clean up, if it weren't for that pesky EULA. At the end of the day, regardless of how much I like the face, I don't want to support a foundry that is so restrictive with its EULA.</p>
    <p>To make matters worse, the fonts I've found that have the same feel to them have the same bloody restrictions in their EULA (UnderWare's <a href="http://www.underware.nl/site2/index.php3?id1=dolly&amp;id2=overview" target="_blank">Dolly</a>, Enschede's <a href="http://www.teff.nl/fonts/collis/collis.html" target="_blank">Collis</a>).</p>
    <p>I'm wondering if anyone can suggest a good alternative to Fedra/Dolly/Collis that is distributed by a foundry more open-minded in terms of usage.</p>
    <p>Thanks in advance...</p>
