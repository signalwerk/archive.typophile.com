      <p>Peter, thanks so much for responding to this thread. I had planned to contact you directly (and likely will still do so) but I'm glad you responded here so others can reap the benefits of this exchange.</p>
      <p>I'm very pleased to hear that Fedra Serif is forthcoming in OpenType, and as I'm budgeting to purchase a few fonts later this fall it appears the timing may be perfect. You referred to the updated font as Fedra Serif Pro (without the A or B suffix); will the two be combined in some way? I ask because I'm partial to the taller of the two.</p>
      <p>One of the things I'm still a bit unclear about, though, is the embedding addendum. Up until very recently I had posted samples of various projects on-line and have shipped such samples to prospective clients, completely ignorant that there was anything poetentionally problematic with such an exchange. In this day and age PDF has simply become second-nature, and, in the quest for work, posting samples on-line seemed all but necessary. I suppose it's fairly simple to extract a non-subsetted font from a PDF, it had just not occured to me that anyone would bother to do so, and thus I went ahead and posted away.</p>
      <p>What I'm uncertain of at the moment is whether such an exchange is permitted in the standard EULA; that is, while posting on-line seems to be a no-no, what about providing samples of previous projects to prospective clients? Would this qualify as sending a PDF to a client, even thought they're not a client yet? Logically, clearly not, but this sort of exchange seems commonplace and all but vital.</p>
      <p>As a side-comment, directed to the community at large, I'm curious about one of the comments Peter made:</p>
      <p>"[K]nowing which versions of fonts are being used by the clients is the only way to guarantee functionality of the fonts."</p>
      <p>I suppose that makes sense, but couldn't there simply be a stipulation that modifying a font nullifies any such guarantee? The warranty on my car, for example, states quite clearly that not keeping up with basic maintenance can result in the termination of said warranty. I'm thinking here that if a modification I make results in the font no longer functioning properly, it seems to me that breakdown is my own fault and thus the consequences are my problem, not the foundry's. But, I assume this brings us into the ugly world of avoiding responsibility, as I'm sure there are many out there who do just this and then complain about faulty product. On the other hand, as is often the case, perhaps I simply don't know what I'm talking about.</p>
      <p>I'm constantly learning when I visit Typophile, and am thus consistently grateful that such an opportunity exists to exchange ideas, information and contact with those who clearly have a lot to offer those of us who clearly have a lot to learn.</p>
