      <p>With PostScript Type 1 fonts, renaming isn't so bad. Think that just three things have to change (note: I've never produced final fonts for a professional environment myself).</p>
      <p>1. The font name (although, one has to be careful about PS family groupings, which can only have four fonts in them).</p>
      <p>2. The unique PostScript ID.</p>
      <p>3. the FOND ID.</p>
      <p>(If these are incorrect, please fell free to correct me!!!)</p>
      <p>Not changing all three values will lead to the new font replacing the old one, instead of living side by side with it. OpenType fonts seem to have a lot more naming information in them, and I can't contribute any knowledge here.</p>
