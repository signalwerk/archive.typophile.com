      <p><cite>You referred to the updated font as Fedra Serif Pro (without the A or B suffix); will the two be combined in some way? I ask because I’m partial to the taller of the two.</cite></p>
      <p>Both packages will come in OpenType Std, and OpenType Pro, and you can license what you like.</p>
      <p><cite>What I’m uncertain of at the moment is whether such an exchange is permitted in the standard EULA; that is, while posting on-line seems to be a no-no, what about providing samples of previous projects to prospective clients? Would this qualify as sending a PDF to a client, even thought they’re not a client yet? Logically, clearly not, but this sort of exchange seems commonplace and all but vital.</cite></p>
      <p>Typotheque licensing basically recognizes two different kinds of PDF embedding: <em>distribution</em> and <em>non- distribution</em>, while the former requires a special addendum for putting PDF online, on a network of computers, or embedding into products; the latter allows, for example, you as a licensed font user sending a PDF file to an unlicensed third party, being it your client, client-to-be, or your wife if you abide certain conditions.</p>
      <p><cite>I suppose that makes sense, but couldn’t there simply be a stipulation that modifying a font nullifies any such guarantee?</cite></p>
      <p>Your suggestion of a license with disclaimer is interesting, but I would like to hear the reasons for modifications first. For example, now I would save you probably making your own OpenType fonts. Again, I would gladly discuss possible reasons for changes - we do publish updates of fonts, so if there is really a need for a change, perhaps it would be beneficial for the complete font.</p>
