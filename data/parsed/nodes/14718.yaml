      <p>Jason:<br>
      Have you looked at OurType's Fresco?</p>
      <p>Adam:<br>
      Thanks for clearing this up for me. Stating that they are obsolete was an obvious error, as both you and Peter have pointed out. Clearly, I should have been more careful.</p>
      <p>The main point I was trying to make in this thread isn't that altering fonts is easy, or that I know very much about how to do it. I was suggesting that users who wished to try, and who were prepared to put up with any problems they created, might be allowed to lie in a bed of their own making. </p>
      <p>I'm surprised by the tone these posts are taking: they seem to suggest that an average joe such as myself shouldn't even attempt to use FontLab to effect minor tweaks to a font without risking...what? Mortal danger? Having to try again? Having to read the manual?</p>
      <p>There _is_ a passage in the referenced doc which refers to FOND IDs, despite the doc's title. I expected interested parties would find it, but I've quoted it here to save people the trouble:</p>
      <p>"Macintosh FOND ID (NFNT, or screen font) numbers<br>
      Font developers often ask about FOND ID numbers, which are numbers that were once assigned by Apple for use with Macintosh screen fonts. Once famous for causing font ID conflicts in a Macintosh system, they are rarely a problem now that both System 7 and most applications handle fonts by name, rather than by number.</p>
      <p>Apple no longer allocates these numbers as they were limited to 32,768 numbers, all of which have long since been assigned. As this number is still a required part of a Macintosh screen font, font vendors can just pick any range or random numbers from the appropriate range. Use any number between 1024 and 16,384 for Roman fonts, and from 16,385 to 32,768 for non-Latin fonts. If you develop non-Latin fonts, please try to find out about the appropriate range for your fonts, as it may make a difference in some applications."</p>
      <p>So, yes of course, they are not "obsolete". Still, to the uninitiated like myself, this passage seems to imply that one needn't be too concerned with them. I read it to mean that they weren't a big problem. Has FontLab been taking care of these problems for me?</p>
