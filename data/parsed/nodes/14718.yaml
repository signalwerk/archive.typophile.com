      <p>Jem, thanks for the suggestion. While the general shape of Enigma does seem along the same lines, there are a few aspects of the font that aren't quite fitting with what I'm seeking. One of the things I like about Fedra Serif B is the proportion of x-height/ascender. Both Fedra's have a substantial x-height, but I'm fond of the longer ascenders. Enigma seems to have a similar structure, but the cap-height and ascenders are considerably shorter (closer to Fedra Serif A). There are also a few personality traits a bit too close to Mrs Eaves for my taste: the hooks off r, m, n, p, the open loop of g, the sharp cut on the bowl of the a. All of these are great quirks, adding personality to the face, but for book work I think they'd be a bit too distracting. That said, for certain circumstances I would definitely turn to Enigma before Mrs Eaves, so I appreciate your mentioning it. It does have a nice palette, it's OpenType, the price seems comparable to other full-family bundles. Definitely a face I'll keep in mind.</p>
      <p>I glanced at Jeremy's EULA and it rules out decompilation, which I'm assuming means no modification. I'll have to give it a closer read, but if I've learned anything from this thread it's to contact the foundry directly to get specific info on whether fine-tuning would be permitted.</p>
