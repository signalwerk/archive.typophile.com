    <p>Hi typophiles, I could use some help decided on a great typeface combination.</p>
    <p>I am a junior designer and am working on a book related to Dutch design. I am currently looking at different options for the typefaces I will use. I would really like to use Aperçu for the headlines, title, chapter openers etc, but need still need to decide on what to use for the body text. I thought it would be nice to use a dutch designed typeface, as it relates to the content, and so far I have been looking at Swift, DTL Documenta and Arnhem. Do you guys think these could fit with Aperçu at all? If not, do you have any other suggestions, it could be sans serif as well, although I was leaning more towards using a serif. (it doesn't have to be a dutch typeface, but it would be nice)</p>
    <p>Hope you guys can give me some advice and maybe get a little discussion going :)</p>
