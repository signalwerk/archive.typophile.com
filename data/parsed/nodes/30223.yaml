      <p><em>at what point can an artist be influenced by himself, by his other works?</em></p>
      <p>i think it's inevitable to rework your own stuff. i often find that i want to do at least 2 versions of of typeface and often more. sometimes the changes you want to make are enough to make the typeface into something entirely new. sometimes you want to go back to a typeface you've worked on in the past and apply accumulated experience to redoing a new version, and it turns out to be something significantly different, ala Proxima Nova, Maple or Apex New.</p>
