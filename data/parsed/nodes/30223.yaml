      <p>It was something we were experimenting with in pre-release versions, but it did not make it into the final fonts.</p>
      <p>Although the new naming convention worked well for most typographers among our testers, to whom its usage was obvious, overall it caused increased confusion. Less typographically savvy users were particularly uncertain about how to deal with it.</p>
      <p>For Adobe, it also introduced a legacy issue: what would we do with the existing fonts with the older optical-size naming convention? Either we change their style names - a major break in compatibility - or we live with two different standards.</p>
      <p>In the end, we decided that simply keeping with the existing scheme was the best of the alternatives. For Arno, we minted a new size name of "small text" in between "caption" and "regular," for the 10 pt optical size. Although we might come up with new names, simply prefixing "small" or "large" in front of the existing labels would give us enough optical sizes to play with for pretty much any purpose.</p>
      <p>Cheers,</p>
      <p>T</p>
