      <p>What a beautiful font! You guys know too much; x-heights and the Venetian influence are a distraction to identifying this font. In the dimension that is pure Slimbach, without historical precedent, I see "Arno" as a contraction of "Warnock", interpolating between that font and Minion.</p>
      <p>I must confess to having downloaded the CS3 beta just to get a first look at Arno Pro. I use TeX and LaTeX for mathematical typesetting, so the digital equivalent of struggling to get the cellophane off the next Beatles LP is a half hour of shell scripting and writing font description files. My conclusion: I need to wait for the remaining light opticals, if they're coming. ArnoPro-Light36pt can't be intended for 11pt body text.</p>
      <p>To my naive eye, light fonts seem to be in identity crisis now. Are they supposed to "look" light on the page, or offer a reasonable alternative to regular? One sees good examples of each view. I'm writing a textbook to either be viewed on screen or laser printed. After many experiments I've concluded that most regular fonts are too heavy, reflecting a historical traditon that predates high resolution screens and printing. The only font that I can stay with for more than an hour of writing is Warnock Pro Light.</p>
      <p>So I'm dying of curiousity to see the rest of the ArnoPro light series. The regular has such an authority on the page, with its weight perfectly balancing the glyph shapes, that I fear the light series will opt to "look" light, and not vie for the same authority on the page.</p>
