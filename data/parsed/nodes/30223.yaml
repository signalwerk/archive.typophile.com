      <p>&gt;from the last quarter-century</p>
      <p>So far as I have learned, in general creative work is strongly informed by the work of the previous generation in the field, both by direct influence and reaction. Once creative thinkers and workers are beyond their formative stages--in which they are indeed decisively influenced--they often are driven more by their own creative program for themselves, and the  needs of the broader culture, rather than their peers. Hence Thomas's observation about Slimbach is plausible to me. </p>
      <p>Still, people usually have an awareness of their peers and sometimes a competitiveness, though this varies with the person. And I think it is quite difficult even for a person himself or herself to be fully aware of influences, past or peers. As David noted, such influences may be unconscious, but none the less real. </p>
      <p>&gt;lowercase italics are so similar to Palatino’s</p>
