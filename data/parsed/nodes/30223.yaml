      <p>Arno is what you might call a modernized Venetian oldstyle. I think of it as having the same relationship to Adobe Jenson that Minion has to Garamond Premier. It's an upcoming design from Robert Slimbach with the level of language support and typographic features you might expect from a new Adobe Original typeface these days.</p>
      <p>Note: I don't think the version bundled with the Photoshop CS3 public beta was final. For now, consider it beta, like the application itself.</p>
      <p>Regards,</p>
      <p>T</p>
