      <p>&gt;not doing something that someone else already did. That seems to be the only way other people’s work influence his</p>
      <p>I don't think that is true of any artist or designer, ever. I am a big admirer of Slimbach's work, but everyone is influenced by what they see.  For example, above Thomas Phinney sees some relation of Garamond and Minion. I do too. I may be wrong about Trinité being an influence--it might be something else--but everybody is influenced. </p>
      <p>This is not to deny that Arno is a new design. It's just that everyone is influenced by past ideas.</p>
