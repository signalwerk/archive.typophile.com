    html: |-
      <p>Welcome to Typophile! An interesting thing about Arno Pro, as attested by Thomas Phinney, is that the version we see is only a beta version.</p>
      <p>When I showed him a piece of work that I did with it, it took him a second to figure it out because the current version's lower case e is now totally different! Who would have thought that there could be more to work on that would totally change the appearance of a typeface, especially on a typeface that for anyone other than Slimbach would've been complete a long time ago...</p>
