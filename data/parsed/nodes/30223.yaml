    html: |-
      <p>Thanks all! While I think Arno Pro is an amazing font, I'll stay with Warnock Pro light for math typesetting, which harmonizes well with Hermann Zapf's Euler math fonts.</p>
      <p>Even Warnock Pro light falls apart a bit on a 600 dpi laser printer. It looks great at 1200 dpi. Maybe in another decade fonts will be generally be a bit lighter, to match future displays and printers.</p>
