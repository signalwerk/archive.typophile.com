      <p>I don't think that Stephen Coles was implying any influence of Hoefler on Slimbach, just that they were striving for the same kind of aesthetic quality--a highly elegant look, with a touch of calligraphic influence, or some such. And indeed I find it far-fetched that Hoefler has had any influence on Slimbach. </p>
      <p>I do think Slimbach has had more recent influences than Garamond and Jenson, though. I find it hard to imagine that Myriad could have be created as it is without Frutiger's prior and ground-breaking creation of his self-named typeface. Though Myriad is a significantly different design, I think almost all type designers--probably including Slimbach and Frutiger--would agree that Frutiger's design had a significant influence on Myriad, and not just by reaction.</p>
      <p>I don't think that acknowledging such influences takes away anything at all from Slimbach's greatness as a type designer. For me he is one of the handful of greatest at work today.</p>
