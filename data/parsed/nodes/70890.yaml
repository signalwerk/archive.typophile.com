      <p>I think Mikey's <a href="http://www.houseind.com/fonts/neutrano2" rel="nofollow">Neutraface No. 2</a> answer is the right one. I think the W was edited to remove the center crossing part (at first I thought maybe they flipped the splayed M). The other letters all seem within the scope of the alternates within the font. I have not examined every sample, but what I saw could be done with that font, I think.</p>
      <p>- Mike Yanega</p>
