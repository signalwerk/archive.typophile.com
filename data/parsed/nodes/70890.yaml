    html: |-
      <p>Hmm, you're right Florian. My eyes aren't calibrated like yours. When I see structural forms that seem about right I am not always aware if certain proportions are off. Of course, since I am already saying that they could have customized the font, some of these other differences could also be made as tweaks. Yet in reality I don't suppose a design firm would do what I suggested. My bias on this forum is to suggest how I think it would be possible to re-create custom work without having to duplicate the design process. Shortcuts, if you will; what someone with my level of design skill (not much) would do to reproduce it.</p>
      <p>- Mike Yanega</p>
