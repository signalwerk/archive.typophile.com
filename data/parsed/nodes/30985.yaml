      <p>Troy,</p>
      <p>Half the fun of school is experimenting with things you couldn't usually do in a professional environment. The only possible setback is a grade, but don't worry about that. What really matters in school is how you explore things. </p>
      <p>Your sketches look very limiting. If you try doing what Alaskan mentioned, you will start expanding your linear thought process. Keep pushing that further. You'll develop a lot more styles, more sketches that are different, and ultimately find something unexpected you might not have been able to predict. I can see this mark go off into a number of ways beyond this style. What might be lacking is how you're going to place your name within the mark. Make sure each sketch is a full sketch and has everything in it that you need (ie: main mark, secondary mark, maybe even a third mark, colors, shapes, etc. etc.)</p>
      <p>If you keep yourself limited to this thought of "more balanced than more readable" you're only going to hurt yourself in the end.</p>
      <p>Best of luck,<br>
      John</p>
