      <p>I really like #7.  Why do anything more to it? </p>
      <p>I agree with Alaskan that you should look at it in black and white first, though.  I'm not a fan of the rounded/sharp corner shape your using.  It only creates a less memorable overall outline of the symbol.  Your line weights are heavy enough, and the two forms are balanced enough, that they shouldn't need it.</p>
