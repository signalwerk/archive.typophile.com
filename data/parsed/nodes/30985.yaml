    <p>I'm making a personal identity system, with stationery, my name is Troy Ruprecht. It's for a class, and it's due tomorrow. I've been developing this monogram for my initials TR, and I've sketched and sketched my ideas for that, and I've come up with these variations so far.</p>
    <p>I wanted to have a geometric sort of design, and balanced, and I've done that with these, but the readability is still really bad. I used a lower-case t and an upper case R to create a sort of mirrored image, square in shape, and with 4 sections inside to give it even more balance. I like the way #7 balances both sides exactly, but the t is always the tough part to get it to be easier to read without making it unbalanced.</p>
    <p>Right now I'm thinking I'll have to add the left part of the cross on the t, even though it would take away from the balance, but I can't think of any other way to get this thing easier to read without doing something like that.</p>
    <p>Does anyone have any ideas on how to get it to read easier, and be relatively balanced on each side?</p>
    <p>By the way, I'd rather go more balanced than more readable, since I would always include my name next to the logo, but I think it needs a lot of help with reading it still.</p>
    <p>-Thanks</p>
    <p>-Troy Ruprecht</p>
