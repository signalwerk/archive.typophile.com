  html: <p>does anybody know how to take a scanned image of handwritten alphabet and turn it into a font? i've tried an online service, fontifier, which doesn't produce very high-res fonts (the font needs to be very crisp and must be able to be blown up to a large size). i've tried fontlab, which doesn't seem to be the best way to go for this. any other suggestions?</p>
