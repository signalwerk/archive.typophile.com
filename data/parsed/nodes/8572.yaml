    html: <p>Having seen the initial results, we helped to unskew them a bit but were otherwise uninvolved until they published, which happened ironically enough at the Poynter Institute. <br> <br>This was, in my opinion, and among other things, a brilliant, quick and easy way of getting a survey of what newspapers who post on newseum, use.  <br> <br>We did however notice a number of users who failed to install fonts beyond the alphatypes, and also found a few un~~~~~~~~ed users.  <br> <br>It also points out that there is a lot work in this seemingly tiny slice of market, partly because there are a lot of new papers world wide, but also because display type churn is a great slow constant...someone, somewhere, is always looking for good newsworthy display faces.</p>
