    html: <p>The study is clearly titled as being US papers only. <br>(So it's not like the World Series.) <br> <br>Any paper, anywhere, can post their front page PDF to Newseum.org, which Ascender Corp. used for their study data. <br> <br>Yes, the study is skewed, but Ascender's work is self-sponsored, and they had to draw the line somewhere. it is not a massive study such as the Poynter Institute might undertake (which would still probably focus on the US, but would no doubt include papers who don't post on Newseum, and weeklies). SND would be more inclined to do an international survey. <br> <br>It is quite ingenious of Ascender Corp. to use Newseum and PDF font-info to come up with this information, no matter the skew.</p>
