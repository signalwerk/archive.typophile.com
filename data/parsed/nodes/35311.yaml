      <p>Constantly recurring discussion. Why don't we all just pronounce these exotic names in such a way that at least our compatriots understand what’s meant?<br>
      I don't pretend to know how Bejing sounds in Mandarin, so I don’t even try to do that.</p>
      <p>(But Futura is pronounced with shorter vowels than the ones in most of the suggestions above… ; ). Foot-tour-ah, with oo and ou compressed and the h halfswallowed. — Hey, German is my second language, having two german greatgrandparents.)</p>
      <p>___<br>
      Bert Vanderveen BNO</p>
