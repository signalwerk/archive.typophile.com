      <p>The exact pronunciation in unequivocal IPA symbols is show here:</p>
      <p><a href="http://www.sanskritweb.net/temporary/futura.gif">http://www.sanskritweb.net/temporary/futura.gif</a></p>
      <p>The font name "Futura" is not of German origin, but is derived from the female-gender form "futura" of the Latin adjective "futurus, futura, futurum". This is because all Latin font names have female gender, i.e. "futura" is short for Latin "littera futura" or "litera futura" denoting "the future letter, the coming type(face)".</p>
