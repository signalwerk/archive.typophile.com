    html: |-
      <p>My take: To pronounce it correctly in German you not only have to do as Thomas indicates, but also do a guttural or rolled 'r'. Doing the full German pronunciation when speaking English I think will sound forced, unless you are from a German speaking country. </p>
      <p>So I think pronouncing it either a more English way, as evilfansanfan has it, or halfway German with both 'u's having an 'oo' sound, is fine.</p>
    html_clean: |-
