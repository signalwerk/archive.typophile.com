      <p>Some suggest that you pronounce a typeface's name according to the orthography of the Designer's prefered language (I think that's what's going on with <a href="http://typophile.com/node/28051?">all these</a>.) Renner was German, so by those rules it's probably more like your second interpretation. Beware that some people might think you a pedant for speaking like this. FYOO-tyur-uh or fyoo-TYUR-uh are perhaps more 'Merkan alternatives.</p>
      <p>Also, Kabel: Cobble or Cable?</p>
