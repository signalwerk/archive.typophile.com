      <p>Prior to Ed's revival, the original Souvenir had been used in the 1960s, for instance in the title of an article in Playboy (yes, I have a large collection--a marvelous repository of specimens of Madison Avenue's "Creative Revolution", not to mention airbrushing technique:-)</p>
      <p>Was that original early 20th century Souvenir ever rendered as phototype before the ITC version?</p>
