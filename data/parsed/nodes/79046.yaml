    <p>Hello,</p>
    <p>I am doing research about the souvenir typeface. But suprisenly there's not much ads on the<br>
    internet form the '60, '70 maybe '80 using this typeface. Does anyone knows a good site or book were I can find it? Any info about the Souvenir typeface is welcome too.</p>
    <p>Thank a lot and greetings</p>
