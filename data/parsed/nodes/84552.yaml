      <p>Some ideas:</p>
      <p>Which version of ID ME are you using? Cursive attachment positioning support was only added in CS4.</p>
      <p>Do you have any custom kerning defined in the InDesign version? I've found that applying kerning between non-connecting Arabic letters will break nearby OpenType cursive attachment.</p>
      <p>Is justification turned on? What happens if you alter justification settings?</p>
    html_clean: |-
