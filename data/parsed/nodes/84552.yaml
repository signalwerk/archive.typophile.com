    html: <p>The Microsoft Arabic shaping engine has the OpenType Layout kern feature on by default, so you will always get kerning for Arabic script in any application using either Uniscribe or DWrite for layout. OpenType kerning can include contextual lookups, which is useful for this kind of Arabic, although the lookups can get very numerous if you want to really refine the spacing between lettergroups of different shapes.</p>
