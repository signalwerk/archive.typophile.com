    html: |-
      <p>I fully support open architecture solutions. The arabic font sector is highly deficient. However, the Arabic market dynamics don't really encourage developing 'open' type. I wonder what your marketing plans are.</p>
      <p>Your design is quite nice, and I am personally very interested in the Ruq'a style. I think it is the ultimate in cursive handwriting. This arises from the exceptional economy in the letter forms and the exquisite balance between catenation and separation that is inherent in the Arabic script in general.</p>
      <p>Ruq'a is also a strong and dynamic style that was useful in writing newspaper headlines. In my article <a class="freelinking external" href="http://arabictype.wordpress.com/2010/05/17/fonts-harf-jadid" rel="nofollow">here</a>, I showed how print technology and the development of the Al-Harf Al-Jadeed font for the Linotype swept away Ruq'a from the headlines. Solutions like yours might lead the way for a Ruq'a comeback.</p>
      <p>Please do proceed with the development of your font, and I hope you will find a solutoin for the InDesign compatibility soon.</p>
      <p>Khalid</p>
