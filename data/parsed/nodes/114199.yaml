    <p></p><div class="imageWrap"><img src="http://typophile.com/files/a_willnot_6739.jpg"></div><p></p>
    <p>I thought this might some cut of Helvetica but the bowl of the e is flatter and the sweep of the t stem is gentler and so too where the ear of the r meets the stem. Then I though it might be Grotesk SS B Book, but I'm wrong again ...grr.</p>
    <p>Thanks in advance.</p>
