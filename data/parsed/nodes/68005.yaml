    html: "<p>I agree, Adam, that Microsoft's approach is generally better, although I wish glyph runs were not split by direction changes, although perhaps this is unavoidable. There are situations in Arabic bi-di layout when it would be really nice to be able to run context lookups across direction changes. For example: following the sequence of year sign (RTL) and number (LTR) one wants to be able to substitute a variant form of isolated mim (RTL), but there is no way to trigger this substitition because the glyphs of different direction belong to separate runs.</p>"
