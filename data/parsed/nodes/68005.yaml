    html: |-
      <p>Indeed. Up until version CS3, Adobe InDesign only applied OpenType Layout features registered in the "latn" script to all text. In InDesign CS3, they switched to a method where the OpenType script used to apply features is determined by the spelling language assigned to that piece of text. This means that if you define a piece of text as "Russian", then OpenType features registered in the "cyrl" script will be applied to all that text, even to letters that are set in Latin script. </p>
      <p>Adobe's approach here is rather different from Microsoft's who always split the text into text runs of a given script and directionality, and then automatically apply features for the determined script. I think Microsoft's method is certainly better. </p>
      <p>The repercussions of Adobe's approach are not so visible in Adobe's own European multilingual OTF fonts because in those fonts, the feature contents that covers glyphs belonging to all scripts is duplicated across all the relevant script tags. This means that in Minion Pro, the "smcp" feature contents of the "latn", "cyrl" and "grek" scripts always covers all Latin, Cyrillic and Greek glyphs. In fonts made using the Microsoft method, Latin small caps would only be registered in "latn", Cyrillic small caps in "cyrl" and Greek small caps in "grek". </p>
      <p>Adobe's method is more "catch-all safe", Microsoft's method more precise.</p>
