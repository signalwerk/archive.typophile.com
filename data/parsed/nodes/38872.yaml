      <p>The SIFR approach is an interesting one - and something I tried to convince the GoLive team to go for, years ago, before Adobe acquired Macromedia.</p>
      <p>But the matter at hand is that the W3C is likely to go with original fonts on Web servers, and might be convinced to go with EOT as well, and that the opinions of type foundries and users might be able to influence if (in the case of EOT) and how (for both approaches) these things go down.</p>
      <p>Unless the Flash SWF format were to become an open format, I don't think SIFR would be considered. Plus there are technical considerations as well.</p>
      <p>BTW, what is this "life" thing you keep talking about, Nick? Seems like I've heard this word before somewhere.</p>
      <p>Cheers,</p>
      <p>T</p>
