    html: |-
      <p>@Nick: On the contrary, nerds have richer lives than the rest of the world. That’s why we’re the cool ones now.</p>
      <p><cite>Unless the Flash SWF format were to become an open format, I don’t think SIFR would be considered.</cite></p>
      <p>I don’t think that what the W3C wants really matters much anymore. The people behind Flash/Flex have their heads screwed on a lot tighter, and may be more likely to produce internet standards that designers and consumers want to work with in the long run. It’s been six years since XHTML 1.1, and I don’t see the W3C moving things forward. What Macromedia/Adobe have done in the same timespan is pretty impressive.</p>
      <p><cite>What I find sad is that now that Adobe has Flash, they’re not compelled to push for SVG support like they used to.</cite></p>
      <p>I don’t blame them. SVG seemed to run into the same problem a lot of commercial open-source projects do: when the open-source crowd finally gets commercial support, they don’t really contribute enough to make it worthwhile for the businesses involved. It makes more sense for Adobe to just stick with Flash and avoid the extra headaches.</p>
