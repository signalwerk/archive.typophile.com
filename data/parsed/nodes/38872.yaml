      <p>I'd like to see an anonymized result from the font vendor survey, as well. It seems that there would be a few font vendors, and several publishers, that were highly interested in allowing some sort of interdomain access to fonts. While this could lead to hotlinking, that is manageable. More interestingly, it could create an opportunity for "font services" to be provided by the font vendors to a client with a lower up front cost. As a person I prefer to buy, but to businesses, leases have advantages.</p>
      <p><em>(p.s. No problems with Win/Firefox 2.0.0.9 here.)</em></p>
