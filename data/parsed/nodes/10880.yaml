  - id: 68758
    user: 596
    date: 2003-04-07T19:55:00
    date_raw: 7 Apr 2003 — 7:55pm
    votes: null
    html: <p><b>[ I just sneezed and accidentally deleted <br>my  message. I'll try writing it again.] </b> <br> <br><i>...since I basically cut and pasted all the  <br>characters from a few parts...</i> <br> <br>This could be your issue. <br> <br>I would suggest taking what you currently  <br>have, printing it out on paper and tracing over  <br>the letters - to see what kind of solutions you  <br>come up with regarding what you see and  <br>know as problem areas.  <br> <br>The "R" is really good. This character is  <br>unique among the others. Perhaps this idea  <br>could be used on the "N", "H", "A". <br> <br>The "T" and to a lesser extent the "i" are also  <br>unique in that they seem to be the only glyphs  <br>to have what could be conventional serifs.  <br>Maybe these characters should change or  <br>perhaps their characteristics should be  <br>exploited elsewhere. <br> <br>The more I look at it the more I like it however,  <br>keep working on it. <br> <br>-smc</p>
