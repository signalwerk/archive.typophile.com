    html: <p>Sean, i agree that some letters look similar...have any ideas for my U or V?  I know they seem alike, but since I basically cut and pasted all the characters from a few parts, I was wondering if I should take a new stand on them.  I had a lot of troubles with the B and the D, trying to incorporate the same stem weight and bottom look-a-like serif with the break in it. Any ideas?  thanks for the feedback. <br>I enjoy my numbers too! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
