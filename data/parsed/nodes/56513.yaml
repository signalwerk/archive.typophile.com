    html: |-
      <p>Century Gothic is a bit closer than Avant Garde, in my opinion.</p>
      <p>More broadly, though, I'd think twice about using any font that looks like Futura for email, since I don't think any of them will be properly hinted for small sizes on screen.</p>
      <p>P J L</p>
