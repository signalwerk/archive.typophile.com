  html: |-
    <p>I am using MS Outlook and MS Word on a PC. I love the look of Futura, but it is not installed on my machine. What font can I use that would be closest to Futura? Options I'm considering include Century Gothic (Bold), Calibri, or Tahoma.</p>
    <p>Thanks for helping a newbie out!</p>
