      <p>There’s a lot of documentation about hinting scattered around Microsoft.com; most of it is about VTT, Microsoft’s (Windows-only) hinting tool. If you have lots and lots of free time you could probably teach yourself to hint fonts and get good at it, but that also goes for things like being a professional pianist.</p>
      <p><cite>If you don't understand me, remember of Verdana that has excellent antialiasing, hinting and rasterization.</cite></p>
      <p>Keep in mind that Verdana is a killer engineering product created by masters of the craft to look great on screen.</p>
