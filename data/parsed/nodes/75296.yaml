    <p>Hello people</p>
    <p>In that time I told you I had a problem with the font family Titillium, that had still aliasing and pixellation, because of hinting and rasterization absence, did you remember?</p>
    <p>Then I was building the fonts at FontForge 2.0 from Ubuntu 10.10. When I finished one font. I installed it on Windows 7 and Ubuntu fonts folders. I opened the font for viewing it, but I got surprised and disappointed with that... because my font is still aliasing and pixelatted. I didn't find how I better and optimize the antialiasing, hinting and rasterization of the fonts at FontForge and, other fonts editores... I couldn't try to correct the deffects of the letters and better the high quality. </p>
    <p>If you don't understand me, remember of Verdana that has excellent antialiasing, hinting and rasterization. </p>
    <p>Bit I don't know how, how will I make for bettering the fony? Do you know some tutorial which can help me?</p>
    <p>"Optimize"  means improve and enhace.</p>
    <p>Maybe Frode Frank know it, because Frode Frank explained very well about ClearType, hinting and antialiasing. </p>
    <p>Thank you!</p>
    <p>Kevin</p>
