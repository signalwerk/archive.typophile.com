      <p>I'm not making any suggestions (my emphasis). I have not finished making all the mistakes that are required to become an expert. However, I would like to state my thoughts in the hope that they get shot down by forum gurus, who will then teach me more neat tricks :)</p>
      <p>Consequently:</p>
      <p>To make Cheltenham Light appear younger and modernised without compromising the other qualities, I might plump for <a class="freelinking external" href="http://www.linotype.com/49242/rotissemiserif-family.html">Rotis Semi Serif</a>.</p>
