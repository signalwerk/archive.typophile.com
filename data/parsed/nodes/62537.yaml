  html: <p>I'm working on redesigning a publication that currently goes out to an older demographic (40-60). The overall style of the publication is sophisticated, clean and classy. A cross between "Real Simple" and "Esquire". The current body copy is Cheltenham Light set at 9.3 over 12. Given our demographic (older professional women) and attempt to attract a slightly younger demo I would like to come up with something new that is easier to read, a bit more modern and hopefully won't cut down our word count. Any ideas?</p>
  html_clean: <p>I'm working on redesigning a publication that currently goes out to an older demographic (40-60). The overall style of the publication is sophisticated, clean and classy. A cross between "Real Simple" and "Esquire". The current body copy is Cheltenham Light set at 9.3 over 12. Given our demographic (older professional women) and attempt to attract a slightly younger demo I would like to come up with something new that is easier to read, a bit more modern and hopefully won't cut down our word count. Any ideas?</p>
