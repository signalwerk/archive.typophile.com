  html: "<p>I'm a graphic designer in New York City and I'm looking on the web for some information, I found this site so I thought I'd ask: <br> <br>I've been asked to design a font for a company to be used by them exclusively and I have no idea what to charge. I'm sure it depends on the company's size and income, it's a broadcast company with its own cable network so it's fairly sizable. I've been designing for over 15 years, logos, lettering etc. but haven't come across this yet...so I'm looking for some input <br> <br>I would also be hiring someone to finalize the art in Fontographer, so I suppose my question concerns what my design fee should be, and what production on Fontographer would cost <br> <br>any info ASAP would be most appreciated... <br> <br>thanks for your time, <br>Edwin <br></p>"
