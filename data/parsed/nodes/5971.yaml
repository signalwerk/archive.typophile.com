    html: <p>I agree, generally, with Paul, with the inevitable caveat that the Pricing Guidelines book is always so broad.  <br> <br>I'd estimate betwen $4k-$7k per font, per weight. That means the Roman would be one font, the bold a second, and the italic a third.  This range, of course, can fluctuate based on the client's industry and size. <br> <br>Oft times clients don't have a concept of what custom type creation costs, and can be scared away once they see cost. That's where you have a sales opportunity - Design the Roman, and then do the Italic later down the road when more revenue frees up. <br> <br></p>
