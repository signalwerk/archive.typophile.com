    html: "<p>If we're talking generally, pricing a font is determined by the following variables: <br> <br>1. Completeness of font character set <br>2. Term of exclusivity <br>3. Breadth of family weights <br> <br>From this information you can determine how to dial the price up or down. Let's say you decide to charge $2,500 for one weight of a font. Then you find out they want every character slot filled, add $1,000. Then they tell you that they want exclusive rights for 2 years, add $2,000. They want two weights of the font, so another $1,000 to $2,000 for each weight depending on the amount of work invovled. <br> <br>There is a level of techincal completeness that is expected, like kerning, but beyond that realm are things like delta hinting if they want that stuff have your FOG buddy quote that stuff. <br> <br>When a font is commissioned, it always remains the property of its creator and the company who purchases it essentially owns the right to use the font for a period of time exclusively then it's assumed you may offer the font for sale publicly at the end of the terms of the agreement. <br> <br>The only other exception to the rule is if they want the font for buyout which means you double the price. <br> <br>In every case, make sure you attach SOME legal documentation with your completed font that states the terms of use as well as the proper license for your font. Check out a few license agreements from foundries to get the jist of it. <br> <br>If you don't include that document, you basically lose protection of the face and allow them to do whatever they want to with it including selling copies of it without your permission. <br> <br>If you have a client that will renew a license annually, great! otherwise, it's much easier to define the project at the beginning including terms of extending your agreement with them. <br> <br>Hope this helps! <br>Stuart :D</p>"
    html_clean: "<p>If we're talking generally, pricing a font is determined by the following variables: <br> <br>1. Completeness of font character set <br>2. Term of exclusivity <br>3. Breadth of family weights <br> <br>From this information you can determine how to dial the price up or down. Let's say you decide to charge $2,500 for one weight of a font. Then you find out they want every character slot filled, add $1,000. Then they tell you that they want exclusive rights for 2 years, add $2,000. They want two weights of the font, so another $1,000 to $2,000 for each weight depending on the amount of work invovled. <br> <br>There is a level of techincal completeness that is expected, like kerning, but beyond that realm are things like delta hinting if they want that stuff have your FOG buddy quote that stuff. <br> <br>When a font is commissioned, it always remains the property of its creator and the company who purchases it essentially owns the right to use the font for a period of time exclusively then it's assumed you may offer the font for sale publicly at the end of the terms of the agreement. <br> <br>The only other exception to the rule is if they want the font for buyout which means you double the price. <br> <br>In every case, make sure you attach SOME legal documentation with your completed font that states the terms of use as well as the proper license for your font. Check out a few license agreements from foundries to get the jist of it. <br> <br>If you don't include that document, you basically lose protection of the face and allow them to do whatever they want to with it including selling copies of it without your permission. <br> <br>If you have a client that will renew a license annually, great! otherwise, it's much easier to define the project at the beginning including terms of extending your agreement with them. <br> <br>Hope this helps! <br>Stuart :D</p>"
