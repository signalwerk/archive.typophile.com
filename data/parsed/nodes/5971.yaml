    html: "<p>Edwin, <br> <br>A quality custom typeface is obviously worth a lot more than just the time spent making it.  A good source of pricing information is the Graphic Artists Guild Handbook.  I have the 9th (1997) edition.   <br> <br>It suggests that typeface design (with exclusivity of use) is usually priced within the following ranges: <br> <br>If client is a \"manufacturer\": <br>one style &amp; weight: $2500 - $10000 <br>2 styles, 4 weights: $3750 - $15000 <br> <br>If client is a \"magazine\": <br>one style &amp; weight: $1250 - $5000 <br>2 styles, 4 weights: $1900 - $7500 <br> <br>These are just guidelines, and it doesn't expound on exactly what it means by \"manufacturer\" and \"magazine\".  Perhaps the former refers to companies that will get more secondary use out of the font. <br> <br>Paul</p>"
