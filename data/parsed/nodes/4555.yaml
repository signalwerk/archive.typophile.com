    html: "<p>DTD Hefeweizen &amp; Hefeweizen Alternate: <br><img src=\"http://www.typophile.com/forums/messages/29/823.jpg\" alt=\"hefeweizen.jpg\"> <br><img src=\"http://www.typophile.com/forums/messages/29/824.jpg\" alt=\"hefeweizenalternate.jpg\"> <br> <br>Here are the alterations so far. I've incorporated most, if not all of the suggestions so far into either the main font or the alternate set. <br> <br>After I generated the JPEGs, I noticed that the ligatures and dipthongs are still from the olf font; those will be changed to fit with the other newer glyphs, of course. <br> <br>Thanks to all for your suggestions so far. Further suggestions, of course, as always, are most appreciated. <br> <br>David</p>"
