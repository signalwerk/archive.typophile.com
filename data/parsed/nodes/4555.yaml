  html: <p><img src="http://www.typophile.com/forums/messages/29/350.jpg" alt="hefeweizen.jpg"> <br> <br>Hefeweizen is a sans serif font built entirely with straight lines and angles based on 60-degree increments. Many of the characters follow blackletter form, but not strictly.  <br> <br>It also works suprisingly well at smaller sizes, and can be used for short blocks of text.  <br> <br>It was (very) loosely inspired by Frere-Jones' "Pilsner", but quickly developed its own direction.  <br> <br>The character set is not yet complete, but this sample gives a good feel for where it's going.  <br> <br>As always, critique is most welcome.  <br> <br>David Thometz</p>
