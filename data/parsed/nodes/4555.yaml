    date_raw: 6 Nov 2001 — 10:54pm
    votes: null
    html: <p> The caps are great. I'm with Stephen on the J,j and Y,y. I have a hard time with the g too. It needs a more open bottom bowl and an ear consistent with it's other angles. Also, I'd pull the numbers way back; they are kind of bumpy. The text has a very strong vertical emphasis that is lost on the numerals. Almost every letter has one very bold vertical stroke going from top to bottom, giving it a very boxy feel. (just like the original textura quadrada). I think you could give the numbers this same feel. For ex. the 2 could have a longer vertical stroke on it's back, the five could loose the angle on it's back, the seven could have a strong, vertical leg attached by a hairline consistent with other angles in the face and the 1 and 4 could loose their base serifs.  <br> <br>I know that you have avoided horizontals exepting on the bases of vertical strokes, but I think one would be appropriate on the crossbar of the 4. <br> <br>Wow. I hope that's not too much. I really do like the feel of the face. The E and the R are about the coolest things I've seen in a while. I'm interested to see the rest of the character set (how do you do it? your faces are always to complete). <br> <br>Christian R. </p>
