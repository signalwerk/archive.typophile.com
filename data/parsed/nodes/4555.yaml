    html: <p> Sorry for my apparent silence -- between client work and work on this face, I haven't had anything to post as yet. I have been reading all your comments, however, and I have indeed been making some progress on the face. It's developing a rather full alternates set, which will incorporate most (if not all) of your suggestions. <br> <br>Thanks for the encouragement! I'll post an update soon. <br> <br>And special thanks to Wadim for the German beer links! (I wonder what Germans would think of "Happy Valley Hefeweizen" or "Polygamy Porter"? :D ) <br> <br>David </p>
