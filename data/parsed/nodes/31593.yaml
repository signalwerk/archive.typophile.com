      <p><em>Are you limited to your current font collection or looking for something new?</em></p>
      <p>I’ll be purchasing Freight Sans soon and can only afford to buy one font family at a time(I thought buying Freight sans first would give me more mileage as far as use, ranging from print to signage buying the text first might limit me in terms of stylistic use). I will be purchasing Freight text later on. Also I don’t wan’t to limit myself to just using Freight text with sans.  I want to to expand my possibilities and I’m not really good with font combos (also Minion is available).</p>
      <p><em>Tell us more about your subject matter and audience.</em></p>
      <p>I’m designing a new logo for a property manager and I think that Freight Sans has the right personality and seriousness that the logo needs to convey. The name is Burns Glover Property Management. I also chose Freight Sans in anticipation of other applications such as signage of various sizes and newspaper ads.</p>
