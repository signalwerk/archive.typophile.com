    html: |-
      <p>Yes, in 1984 some books were typed on an IBM Selectric typewriter, or a similar good quality typewriter from another source and the results were photographed for printing. Note the handwritten Greek phrase.<br>
      We can check the design against some of the popular typefaces used on IBM "elements" -- the thing that looks like a golfball -- and see if it is digitized. They had names like _courier_, _prestige_, _elite_ etc.<br>
      Here is a selection of these typefaces compiled by Luc Devroye <a href="http://luc.devroye.org/fonts-44934.html" title="http://luc.devroye.org/fonts-44934.html">http://luc.devroye.org/fonts-44934.html</a> If you can find some of the distinctive letters in the book, like _Q_, _R_, _g_ and _3_ it makes it easier to decide on a match.<br>
      Don</p>
