      <p>Here is a list of reasonably well engineered monospace typewriter fonts at Myfonts, that could perhaps be substituted. None is a proper match for Delegate.</p>
      <p>First, several fonts based on IBM'S Prestige for the Selectric<br>
      Prestige Elite, several sellers including<br>
      <a href="http://www.myfonts.com/fonts/linotype/prestige-elite/" title="http://www.myfonts.com/fonts/linotype/prestige-elite/">http://www.myfonts.com/fonts/linotype/prestige-elite/</a><br>
      Alix FB<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/alix-fb/" title="http://www.myfonts.com/fonts/fontbureau/alix-fb/">http://www.myfonts.com/fonts/fontbureau/alix-fb/</a><br>
      Prestige 12 Pitch, also based on IBM'S Prestige for the Selectric<br>
      <a href="http://www.myfonts.com/fonts/bitstream/prestige-12-pitch/" title="http://www.myfonts.com/fonts/bitstream/prestige-12-pitch/">http://www.myfonts.com/fonts/bitstream/prestige-12-pitch/</a></p>
      <p>Also-rans, in alphabetical order:<br>
      Bulletin Typewriter<br>
      <a href="http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/" title="http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/">http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/</a><br>
      EF Techno Script, apparently based on a Royal typewriter<br>
      <a href="http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/" title="http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/">http://www.myfonts.com/fonts/itfmecanorma/bulletin-typewriter/</a><br>
      ITC American Typewriter, century old design<br>
      <a href="http://www.myfonts.com/fonts/adobe/itc-american-typewriter/" title="http://www.myfonts.com/fonts/adobe/itc-american-typewriter/">http://www.myfonts.com/fonts/adobe/itc-american-typewriter/</a><br>
      Italian Typewriter, Ollivetti circa 1940, more stylish than most<br>
      <a href="http://www.myfonts.com/fonts/flanker/italian-typewriter/" title="http://www.myfonts.com/fonts/flanker/italian-typewriter/">http://www.myfonts.com/fonts/flanker/italian-typewriter/</a><br>
      Remington Elite Typewriter<br>
      <a href="http://www.myfonts.com/fonts/intellecta/remington-elite-typewriter/" title="http://www.myfonts.com/fonts/intellecta/remington-elite-typewriter/">http://www.myfonts.com/fonts/intellecta/remington-elite-typewriter/</a><br>
      Remington Typewriter, with well designed Italic by Frederic Goudy<br>
      <a href="http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/" title="http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/">http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/</a><br>
      Smith Premier, an old ATF design, as Smith Premier NF<br>
      <a href="http://www.myfonts.com/fonts/nicksfonts/smith-premier-nf/" title="http://www.myfonts.com/fonts/nicksfonts/smith-premier-nf/">http://www.myfonts.com/fonts/nicksfonts/smith-premier-nf/</a><br>
      Tired of Courier<br>
      <a href="http://www.myfonts.com/fonts/ingrimayne/tiredofcourier/" title="http://www.myfonts.com/fonts/ingrimayne/tiredofcourier/">http://www.myfonts.com/fonts/ingrimayne/tiredofcourier/</a><br>
      Typewriter by Monotype, source unknown<br>
      <a href="https://www.myfonts.com/fonts/mti/typewriter-mt/" title="https://www.myfonts.com/fonts/mti/typewriter-mt/">https://www.myfonts.com/fonts/mti/typewriter-mt/</a><br>
      Plus, perhaps of lesser quality, Intellecta Typewriter, old design<br>
      <a href="http://www.myfonts.com/fonts/intellecta/intellecta-typewriter/" title="http://www.myfonts.com/fonts/intellecta/intellecta-typewriter/">http://www.myfonts.com/fonts/intellecta/intellecta-typewriter/</a><br>
      Don</p>
