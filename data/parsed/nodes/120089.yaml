    html: "<p>Hi Don, thanks for your reply and for the link. A friend of mine found the font ! Like you say it comes from a IBM Selectric typewriter : it's called Delegate (look at the K, it matches : <a href=\"https://dl.dropboxusercontent.com/u/2425128/Screenshot%202014-10-02%20%C3%A0%2011.27.50.jpg\" title=\"https://dl.dropboxusercontent.com/u/2425128/Screenshot%202014-10-02%20%C3%A0%2011.27.50.jpg\">https://dl.dropboxusercontent.com/u/2425128/Screenshot%202014-10-02%20%C...</a> !). My friend says there is not clean digitized version of this font -- just this dirty free one : <a href=\"http://www.azfonts.net/load_font/delegate.html\" title=\"http://www.azfonts.net/load_font/delegate.html\">http://www.azfonts.net/load_font/delegate.html</a> ! But some specimen exist, so we think about digitizing it in the future ;-)</p>"
