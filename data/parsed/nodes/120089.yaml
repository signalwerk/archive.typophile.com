    html: |-
      <div class="comment-spam-body"><p>Thanks Guillaume for the link to the Delegate specimen.<br>
      I have fond memories of Delegate. It produced a presentation quality document with a subtle variation in stroke weight that made it much more attractive for publication than most typewriter typefaces.<br>
      BTW Triplicate is well made, but it's rather different than the Delegate typeface for the Selectric.<br>
      Don</p>
      </div>
