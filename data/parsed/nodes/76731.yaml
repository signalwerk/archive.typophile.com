  html: |-
    <p>I was recently contacted by an art director working for "Promotion and Branding" at TOYA, in Poland.</p>
    <p>They bought the entire family of "<a class="freelinking external" href="http://new.myfonts.com/fonts/typeinnovations/contax-pro/" rel="nofollow">Contax Pro</a> and needed certain Polish glyphs for a TOYA brochure they were creating.</p>
    <p>In order to accommodate them, I got busy creating all the accented characters they required and then just decided to do them all.</p>
    <p>It took a while, but I have just now updated all 18 "<a class="freelinking external" href="http://new.myfonts.com/fonts/typeinnovations/contax-pro/" rel="nofollow">Contax Pro</a> weights and styles with a full compliment of "Eastern European" character sets.</p>
    <p>Ewa Kowalczyk was kind enough to sent me a PDF of the final brochure they created using "<a class="freelinking external" href="http://new.myfonts.com/fonts/typeinnovations/contax-pro/" rel="nofollow">Contax Pro</a>, which I am happy to share with everyone here at the "Type Forum".</p>
    <p>It is indeed rewarding to see your fonts being used.</p>
    <p>Ewa said everyone involved with the project was delighted with the new look and feel of the brochure, which has a fresh, clean and modern look to it.</p>
    <p>I agree. Thank you Ewa.</p>
