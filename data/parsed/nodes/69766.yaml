      <p>If you aren't afraid of (or familiar with) Python, take a look at <a href="http://nodebox.net/code/index.php/Gallery" rel="nofollow">NodeBox</a>. It's open source and, AFAIK, currently available for OS X and Linux (though the new <a href="http://beta.nodebox.net/" rel="nofollow">Beta</a> seems to have a Windows port too).</p>
      <p>It takes some time to get familiar with, but there's already a huge host of NodeBox visualization libraries around.</p>
      <p><em>Edit: Sorry, didn't see you don't like programming :) … I'm afraid for maximal control (read: good results) you'll want some coding skills though. It's not hard to learn, and there are great tutorials for both Processing and NodeBox. Worth your time. Promise.</em></p>
