    date: 2013-07-02T08:20:00
    date_raw: 2 Jul 2013 — 8:20am
    votes: null
    html: |-
      <p>Don't take this the wrong way but you should let the designer do his/her job and come up with the best solution that they can. It is nice to have a client give examples of what they like but giving specific fonts and such isn't going to give a very good or original result. If the designer is ANY good they will do research on their own and present variations based on that. You should have a good sit-down discussion with your designer and present your data, the target audience, any graphic styles you make like, etc... and the designer will take this into account to create something you love and something that works well to position your brand in the marketplace.</p>
      <p>If they don't do any research (basically what you are trying to do now) then they aren't very good in the first place and I'd recommend finding someone a bit more competent.</p>
