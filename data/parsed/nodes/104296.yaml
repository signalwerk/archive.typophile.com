    <p>Aesthetically appeased individuals,</p>
    <p>Seeking some suggestions and input for a typeface to be used in a logo for a fragrances/perfume brand.  Not being a designer, thought it would be beneficial to provide, as best as I can articulate/sketch, a good design brief to the graphic designer who will create the final product.  This includes deciding on the typeface before the designer is engaged.</p>
    <p>Hoping to hear your suggestions for a good looking set of letters that would best represent my logo.  Think:  black and capitalized, such as used by many a fashion magazine, fashion label, etc.  Don't have a lot of money to pay to a sophisticated type foundry so a compromise is necessary, suppose.  Obviously the typeface will be for commercial purposes, appropriate licensing at the least cost is desirable.</p>
    <p>Serif / Sans-Serif ...  I was originally drawn to a Sans-Serif font such as used in the 'Vanity Fair' logo.  Two fonts that I came across were dafont.com/fiesta.font and dafont.com/mouse-deco.font</p>
    <p>....Then the 'Barneys New York' logo, feat. serif lettering caught my attention and now I'm torn between either a bold/sans-serif font or an elegant/subtle serif font.  Something in between perhaps?  <strong>What do you think?</strong></p>
