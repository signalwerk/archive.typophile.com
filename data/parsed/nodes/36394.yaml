      <p>well the "e"s and "a"s are too light for me. "x" probably too but it's not within a text block.</p>
      <p>The ones that seem to heavy are: D and 5.</p>
      <p>I normally don't like the back slant, but I guess it goes well with this font. Someone else may judge it from this point because my judgement isn't the right one here.</p>
      <p>What about letter-spacing? Does it seem to tight to me or is there anyone else that can confirm this?</p>
