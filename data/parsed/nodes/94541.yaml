  html: |-
    <p>Trying to find out as much as I can on the original design of this great typeface.  The original version from 1896, not any of the following versions.  About all I can seem to find is that it may have been derived from Didot or Walbaum, that it was based on typical German 'jobbing' alphabets of the time, and of course that it was released by Berthold in 1896.</p>
    <p>I would love to read a whole book about how this face came about and what went into it's design.  Perhaps there simply isn't any detailed info available?</p>
