    html: <p>There is a lot of info on AG on typophile already e.g. here <a href="http://typophile.com/node/17643" title="http://typophile.com/node/17643">http://typophile.com/node/17643</a> and its history is not as easy and linear as it seems. Complex enough to write a whole book about it. I wouldn’t say that it is derived from Didot or Walbaum – it shares the same proportions and form model, yes, but so do most of the antecedent sans-serifs.</p>
