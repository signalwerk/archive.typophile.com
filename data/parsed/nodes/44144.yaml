    html: <p>I mentioned taking the standard bold, italic, and underline buttons off the Formatting toolbar in the very specific context of Conor's problem. Taking the buttons off the Formatting toolbar would prevent his client from creating "faux" Metaserif bold, italic, or bold italic and ensure that they have to use the buttons on the created-for-the-purpose "Font" toolbar. For the general 99.999999999% of Word users who aren't concerned about faux Metaserif bold or italic, of course there's no reason to take the buttons off the standard Formatting toolbar.</p>
