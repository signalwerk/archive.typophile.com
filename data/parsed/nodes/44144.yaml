    html: |-
      <p>In Word, you can add buttons to the Formatting toolbar (or any other toolbar) for any installed font. Right click anywhere in any toolbar and select <strong>Customize</strong>. Select the <strong>Command</strong> tab. In the <strong>Categories</strong> pane, scroll down to and select <strong>Fonts</strong>. In the <strong>Commands</strong> pane, you should see all your fonts. Click and hold the left mouse button on a font name, drag it to wherever you want it on the toolbar, and release the mouse button. </p>
      <p>While you're in the <strong>Customize</strong> dialog, you can also remove the Bold, Italic, and Underline buttons from the Formatting toolbar. Just click, hold, and drag the appropriate button well away from the toolbar area.</p>
      <p>When you close Word, you'll probably be prompted to save changes to the normal.dot template.</p>
