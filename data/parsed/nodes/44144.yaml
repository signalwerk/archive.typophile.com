      <p>I don't disagree with you, but as I said, I only <em>mentioned</em> it, not <em>recommended</em> it. Information is good, right?</p>
      <p>Two other considerations:</p>
      <p>1. The buttons on the Format toolbar (or any toolbar) are only shortcuts. You can always format text using Ctrl-b, Ctrl-i, or Ctrl-u, or by going to Format &gt; Font.</p>
      <p>2. Perhaps Meta is only used for a few specific kinds of documents, not everything. You can create a special template (e.g., "meta.dot") and store the customized toolbars in that. Normal.dot would have an untouched Format toolbar and no custom "Font" toolbar.</p>
