    <p>Hi all.</p>
    <p>We bought MetaOT and MetaSerifOT on behalf of a client from the good folks at FontShop. Our client uses PCs and executes their daily tasks using Microsoft Office applications such as Word. We followed the installation instructions on FontShop’s website, so I’m pretty sure both are installed correctly.</p>
    <p>The issue we have is that our client has to go to the font menu each time they need to apply <em>italics</em>, <strong>bold</strong> and <strong><em>bold italics</em></strong>. They are not the type of client that would easily grasp the importance of this and, without doubt, will be hitting those italic/bold buttons to emphasise their text, resulting in faux italics/bold.</p>
    <p>My question is this: is their a way that they can hit the italic/bold buttons and get the true MetaOT-Bold, MetaOT-Italic and MetaOT-BoldItalic?</p>
    <p>Any help would be greatly appreciated.</p>
    <p>Ta.<br>
    Conor</p>
