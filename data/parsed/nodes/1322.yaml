    html: <p>The font is "Seagull" by Adrian Williams. It's been sized variously to serve in logo fashion, but that's the font. See Bitstream &amp; URW versions at MyFonts.com at <a href="http://www.myfonts.com/Search?searchtype=adv_fonts&amp;go=1&amp;searchtext=Seagull&amp;boolean=and&amp;minprice=%240.00&amp;maxprice=%241000.00&amp;characterset%5B%5D=ALL&amp;foundry%5B%5D=0" target="_blank">http://www.myfonts.com/Search?searchtype=adv_fonts&amp;go=1&amp;searchtext=Seagull&amp;boolean=and&amp;minprice=%240.00&amp;maxprice=%241000.00&amp;characterset%5B%5D=ALL&amp;foundry%5B%5D=0</a></p>
