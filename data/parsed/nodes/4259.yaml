  html: |-
    <p>In the movie "13 Ghosts" there is a "Latin" handwritten style font used through out the set on the glass. (It's the only redeeming quality of this movie.) <br> <br><img src="http://www.typophile.com/forums/messages/83/33326.jpg" alt="13 Ghosts script font"> <br> <br>I'd love to find something as close to it as possible. The production notes about the set only gave me the following clues: "The Latin “etchings” were actually rendered on a plastic overlay and adhered to the glass walls to achieve Hargreaves’ “Arcanum” design motif. " <br> <br> <br>Thanks for your time.  <br> <br>Dar</p>
