  html: <p><img src="http://www.typophile.com/forums/messages/4100/24449.jpg" alt="alphabet"> <br>Woo eee, my first post here. Here's an alphabet I put together from hand painted signage in and around my stomping grounds of Green Bay, WI. Thought you type nerds (like me) would enjoy this. <br> <br>Inspired by both a collection of lettering in Vegas I saw in Veer, and a trip down Route 66, I took last summer. <br> <br>I've got some more pix of the signs themselves over at <a href="http://www.bradknapp.com/blog">my photoblog</a>. <br></p>
  html_clean: <p><img src="http://www.typophile.com/forums/messages/4100/24449.jpg" alt="alphabet"> <br>Woo eee, my first post here. Here's an alphabet I put together from hand painted signage in and around my stomping grounds of Green Bay, WI. Thought you type nerds (like me) would enjoy this. <br> <br>Inspired by both a collection of lettering in Vegas I saw in Veer, and a trip down Route 66, I took last summer. <br> <br>I've got some more pix of the signs themselves over at <a href="http://www.bradknapp.com/blog" class="link-external">my photoblog</a>. <br></p>
