      <p>Yes, "leading" in layout programs means something different than leading in metal type.</p>
      <p>Té — I had to hunt around the program to get a screenshot with the fields labeled. In the normal menu bar, it just stacks the two of them with no labels, but you are literally typing one number "on" (top of) another.</p>
      <p>mars0i — It's still very much in use (or so I'd like to believe), but you're right that it's only by small specialty presses. It now belongs, along with the letterpress printing processes, more to the realm of fine art than the world of mass production. The shop I was at, though, did get some big projects, like the official new edition of the Book of Mormon, which had to be typeset EXACTLY like the first edition, including the following word division on the title page:</p>
      <p>THE BOOK OF MOR-<br>
      MON</p>
      <p>Try to get away with that today.</p>
