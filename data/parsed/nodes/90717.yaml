    html: |-
      <p>Hrant — Sorry, you know I have a knee-jerk reaction to your jargon sometimes. I do remember now that you appropriated it from someone else. And DeVinne sort of rings a bell. So I’ll blame him for the failed neologism. ;-)</p>
      <p>My point remains: anyone who attempts to use it in conversation with professional type designers will most likely find himself faced with blank stares.</p>
      <p>I don’t dispute the value of the overall concept within a consideration of general parameters. I’ve just always engaged it from the other way around, such that there’s little point to referring to that space directly.</p>
      <p>The concept that I’ve always used to approach this aspect of vertical metrics, and the one which corresponds to my historical meanderings, is “size on the body.” That’s how I’ve encountered it referred to historically. That’s how I think of it.</p>
      <p>So, my approach to a new design idea is to think about the interrelationship of x-height, cap-height, ascender-height, descender-height, and overall size on the body (i.e., the sum of the ascender + descender and it’s relation to the em).</p>
      <p>It seems really simple and straightforward to me — how do I want to fit my design in the em? How much clearance do I want between ascenders &amp; descenders when set solid? Which is usually also a function of what I consider to be the target size of my design.</p>
      <p>Since I usually also consider how I want to split this between the head space and the foot space (also terms I’ve seen used occasionally, btw), a single new term derived from Latin for ‘ankle’ just seems silly to me.</p>
