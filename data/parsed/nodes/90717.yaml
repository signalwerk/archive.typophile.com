      <p>&gt; Is the point size = distance from lowest<br>
      &gt; descender to highest ascender + talus?</p>
      <p>Yes.<br>
      Where the talus is usually partly at the top and<br>
      partly at the bottom (usually more at the top).</p>
      <p>BTW, few people use "talus". Some<br>
      people use the term "internal leading".</p>
      <p>&gt; is there a standard amount of space that appears in<br>
      &gt; addition to the distance from the lowest descender<br>
      &gt; to tallest ascender?</p>
      <p>There's no standard, but most type designers do seem<br>
      to try to play within the same talus ballpark, which is<br>
      on the order of 5% of the Em. But some designers do<br>
      overshoot the em!</p>
      <p>One thing to keep in mind is that the talus<br>
      should be proportional to the x-height.</p>
      <p>hhp</p>
