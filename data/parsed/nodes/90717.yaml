      <p>1) I didn't make it up. I wish I remembered where I got it, but I'm<br>
      pretty sure it was from a "professional type designer" :-/ sort of book.<br>
      It might have been DeVinne.</p>
      <p>2) I use it because it's needed.* I've heard others use "internal<br>
      leading" but to me that's lame. I haven't heard of anything else.<br>
      Why is it needed? Well, it's a relevant design parameter, since it<br>
      affects apparent size and line-to-line not-crashing. When I make<br>
      a typeface, very early on I need to figure out the vertical metrics,<br>
      and the talus is part of that. How do others do it?</p>
      <p>* Not to grasp the idea, but to communicate it.</p>
      <p>As always, I'm open to a better term.<br>
      But I don't understand the resistance to <em>having</em> a term.</p>
      <p>hhp</p>
