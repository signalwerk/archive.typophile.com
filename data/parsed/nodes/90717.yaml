      <p>OK, so my understanding, then, is that without extra leading, the distance from baseline to baseline will be Em-height + talus, for a total of roughly 1.05% of Em-height, but probably more for a tall x-height, or less for a small x-height.  </p>
      <p>And then, suppose, for example, I look at a serif typeface in which horizontal serifs have flat outer edges--not cupped, for example--and supposing that the top joins of the M is finished with these serifs, rather than being pointed, for example.  Then if an M appears over another on the next line, the distance between the upper edge of the top serifs on the lower M, and the bottom of the lower serifs on the upper M--that's the talus.  However, ascenders might extend into the space defined by these two M's, and bottoms of curved letters might extend down into the space, as might the points on the V and M, for example, the bottom of the J, etc.  And maybe if the typeface has very high ascenders and very low descenders, the designer would make the talus larger, I suppose.</p>
      <p>Sorry for putting things in this awkward way.  I'm trying to get a precise understanding, but I'm trying to work around the possibility that terms are defined in ways that I didn't expect for a given typeface.  My understanding is that there's some play in the terminology.  I've learned enough recently to be unsure about everything, but not enough to be sure about anything, I guess.</p>
      <p>Do I have it right?</p>
      <p>Thanks!</p>
