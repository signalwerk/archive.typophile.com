      <p>No, "linespacing" is either the leading added between<br>
      the lines (so totally absent from those illustrations) or<br>
      the leading plus the height of the line of type* (so still<br>
      essentially absent from those illustrations). In any<br>
      case it pertains to a setting, not the font itself.</p>
      <p>* So #8.</p>
      <p>We don't use "line-to-back" any more. :-)  If I had to talk<br>
      about that, I'd call it "ascender height plus upper talus"<br>
      or "em height above baseline"...</p>
      <p>That illustration you included (in your first post of the 5th)<br>
      is indeed confusing because I don't think any font has [had]<br>
      caps that touch the top; even if the ascenders aren't longer<br>
      than the caps you almost always see some talus, especially at<br>
      the top (since descenders are rare sometimes they're allowed<br>
      to even hang off the bottom, to save vertical space).</p>
      <p>hhp</p>
