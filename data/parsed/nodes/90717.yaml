    html: |-
      <p>Hrant sort of acknowledged this, but I feel compelled to point it out again: the term “talus” is a complete Hrant neologism.</p>
      <p>Don’t get too hung up on it. No professional type designer that I know uses the term. Most won’t even have heard of it (and of those who may have encountered it on this forum, I can’t think of any who have chosen to adopt it). I don’t even know anyone who bothers to refer to “internal leading.”</p>
      <p>In metal, the measure of the body of a piece of type was it’s point size (and vice versa). When set without any intervening leading — or, as it was called, set “solid” — the distance between baselines was the same as the point size.</p>
      <p>[This is assuming, for the sake of keeping things simple, that this is a setting of the same font on all lines.]</p>
      <p>For practical reasons, metal type faces did not usually have extenders that reached to the very top or bottom edges of the piece of metal. So there would usually be a little extra space, such that descenders on one line and ascenders on the line below didn’t crash. (Hrant has chosen to coin a special term for this extra space.)</p>
      <p>For the Linotype machine, this extra space had a prescribed minimum. I don’t know if foundries or Monotype had their own standards for this.</p>
      <p>In digital type, there is a virtual corollary to the body, but there is no physical constraint or requirement to keep parts within the bounds of the body. Different type designers take different approaches.</p>
      <p>Also, since we're no longer stacking little metal blocks upon one another, the virtual body has come to have less and less technical significance. In Postscript Type 1 fonts, it was still pretty explicit (in the Ascent and Descent values). But with TrueType and OpenType, there are multiple values describing various vertical metrics, all used by different platforms and applications to determine vertical relationships.</p>
      <p>So, these days, setting text without any explicit linespacing measurement is not necessarily the same thing as setting metal type solid and you may or may not get a value equivalent to the point size, depending upon the platform, software, and preference settings.</p>
      <p>Of course, if you explicitly specify 11 pt linespacing (or leading — however the app chooses to call it), then your application should definitely set it with a baseline-to-baseline measure of 11 points.</p>
