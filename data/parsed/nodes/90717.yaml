      <p>All this is complicated further if one sticks one's head inside the OS/2 table and notes that the term linespacing is there used for what is in effect built-in leading.</p>
      <p>InDesign's use of 'leading' is specifically a baseline-to-baseline measure; that is, from the baseline of the current line of text to the baseline above.</p>
