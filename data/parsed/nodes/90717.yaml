      <p>Although in metal type, a lot of things that are now the designer's decision, like the size of the word space, the amount of "talus," where the character sits in the em square, etc., were determined by the person casting the type or by the machines, not by the designer. </p>
      <p>I do remember that the Monotype shop could cast, or get from somewhere, 1.5 pt leads, which they colored purple to differentiate them. Probably the reason for not using brass leads is that if everything's made from type metal, you can just dump the whole mess in the cauldron when you're done printing — no sorting required.</p>
    html_clean: |-
