    votes: null
    html: <p>Oh, so does this also mean that anyone can release such a revival under the original name?</p>
    html_clean: <p>Oh, so does this also mean that anyone can release such a revival under the original name?</p>
  - id: 467272
    user: 6470
    date: 2011-06-06T11:55:00
    date_raw: 6 Jun 2011 — 11:55am
    votes: null
    html: |-
      <p><em>does this also mean that anyone can release such a revival under the original name?</em></p>
      <p>Not necessarily: typefaces names, often, are trademarks and can be registered for copyright protection. In the present instance, the fact that Elsner and Flake claim trademark on the name EF Feder Fraktur should give you pause to use Erbar's original name for the typeface...</p>
