    date: 2011-06-04T12:41:00
    date_raw: 4 Jun 2011 — 12:41pm
    votes: null
    html: <p>Feder Grotesk was registered with the Kartei des Vereins der Schriftgießereien on 15 May 1911, over a hundred years ago. Any copyright protection it may have enjoyed has long since expired.</p>
    html_clean: <p>Feder Grotesk was registered with the Kartei des Vereins der Schriftgießereien on 15 May 1911, over a hundred years ago. Any copyright protection it may have enjoyed has long since expired.</p>
