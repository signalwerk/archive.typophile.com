    <p>Dear typophiles,</p>
    <p>A friend of mine is about to design a typeface(revival) inspired by Feder Grotesk (1909)<br>
    Are there any copyright issues he should take in account?</p>
    <p>Here is the link to the sample:<br>
    <a href="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Erbar/JErbar.pdf" title="http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Erbar/JErbar.pdf">http://www.klingspor-museum.de/KlingsporKuenstler/Schriftdesigner/Erbar/...</a></p>
