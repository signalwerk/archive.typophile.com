    html: <p>Oh, OK. <br> <br>I suspected that, but there are so many web pages in comic sans, I thought that it must be the content that was the subject of the post. Then Alessandro's post, with the comic sans reference, really threw me. I wans't sure if the content of the site was being held up for ridicule. <br>===== <br>Despite innapropriate typeface selection, scantips is a great website. Its been around for years, and is the place I point people to when they get a scanner for the first time. <br>As someone who is often surrounded by computers, I'm regularly asked by friends, relatives etc to choose/buy/configure/mend a computer for them. Whenever this involves a scanner, I point them to scantips.com and save myself lots of explaining about resolution vs dpi etc. <br> <br></p>
