    html: <p>Yeah yeah, it's in comic sans. <br>;) <br>Other than that, I never knew you could display an image at 7 dpi and have it still show up correctly. I did some tests though and it doesn't save file size, so I guess it doesn't matter much. Except that a lot of people have told me my web images have to be 72 dpi. <br>That's all the post is about. Nothing fancy! <br> <br>-b-</p>
