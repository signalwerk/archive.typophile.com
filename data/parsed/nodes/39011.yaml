    html: |-
      <p>Given the variable amount of glyphs that can be put into an OpenType font--both in language support and typographic features--it becomes necessary for foundries to settle on standards for their own product line.<br>
      Of course, it's going to differ from foundry to foundry.<br>
      I'm not publishing WGL4 fonts for the Corel crowd.<br>
      So some foundries heavy up on the features, others on the language support.<br>
      Some combine many encodings in a single font, others offer the different language encodings separately.</p>
      <p>Adobe's Pro fonts group Latin, Cyrillic and Greek in one font at one price, but FontFont let you buy them separately at different prices. Some foundries/distributors only sell fonts in family packages, others sell them individually.</p>
      <p>The upshot is that there's no use complaining about a lack of standardization -- these days, it pays to be an informed purchaser, and for the producer/seller, the variety of formats on the market expands the market, by offering purchase opportunities at many points on the demand curve.</p>
