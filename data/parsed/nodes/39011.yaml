    html: <p>Linotype's OpenType COM fonts are only available in TTF flavour OpenType with some of them hinted to their XSF standard. The end user is quite possibly baffled now with the range of options under the OpenType banner and the lack of industry standardisation; it's now possible to buy OpenType Std, Pro, Com, Com XSF, Pro Plus, Premier Pro....It's also quite possible that a Std font from one source will contain just as many layouts, glyphs, features etc as a Pro font from another source. Or that a content rich font will not have any defining suffix at all and may suffer saleswise because of this.</p>
