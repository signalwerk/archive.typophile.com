      <p>Well, there is some logic to it: If you do business reports, internal communication etc. for an international company, a font with wide language support comes in handy – and you possibly don’t have an urgent need for sophisticated typographic features like old-style figures.<br>
      On the other hand, if you’re doing aesthetic book design or so, you don’t wanna pay for all those Lithuanian and Swahili diacritics (that is, if you’re not in Southeast African or the Baltic region, of course).</p>
      <p><cite>Of course it is a choice of the manufacturerers</cite><br>
      In the end, it’s just marketing.</p>
