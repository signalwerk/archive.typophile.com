      <p>Letterhead has created awareness of stealing fonts and that some are encrypted. Posting his name and company all good, shame on you for sharing your fonts. </p>
      <p>The sharing the loss of income is a bit stink.</p>
      <p>If I did a conceptual design for a client, got paid for the conceptual design from the client with a signed agreement: I own the rights to the conceptual design, until it is fully designed and produced.<br>
      However if the client then takes the conceptual design to another design company, they reproduced designed based on my conceptual.... I STILL CANNOT CHARGE MY OTHER CLIENTS 33% to make up for the loss... damn I wish I could.</p>
      <p>or if a client goes into receivership as I had and nothing is in the tin or the office has tumbleweed, am I allowed to charge MY OTHER CLIENTS 33% to make up for the loss... no. I am sure there are many out there who too have had a client owe them a significant amount of money, for the client to then go under.. 'belly up'.. gone. Now that really hurts... takes about x3 that amount to get it back.</p>
      <p>Though if you want the typeface you will pay for it. What is worse? paying $40 for a $30 font? or seeing it on Myfonts 3 days later for 80% discount? doh!  (I am not suggesting Letterhead here) though 'some' of those discounted fonts on MyFonts are not discounted enough for me ever to want to purchase, no thanks.</p>
