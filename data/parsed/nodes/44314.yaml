    html: |-
      <p>Re: account data</p>
      <p>With various types of shareware, after your purchase, the vendor gives you an encrypted 'key,' comprised of several lines of of unreadable characters, which serves to both unlock the software for use but also embeds your name and email into the software. </p>
      <p>This is good at deterring the original purchaser from sharing his/her key. </p>
      <p>A similar thing can be done with opentype fonts, but there is a major difference: the purchaser does not know that his name/email are encrypted into the font, or at least it's not visible when you click on font properties. Thus the psychological effect is weaker.</p>
