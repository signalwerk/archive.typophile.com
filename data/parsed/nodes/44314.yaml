      <p>Is it possible that Chuck is just using this one soul - to set an example. To let his purchasers realize that they are responsible for the security of their purchase and not let it "get around the net."</p>
      <p>It turns my own stomach when I see libraries of font manufacturers tossed up on a site like the one Chuck pointed out. I can remember struggling as a typographer in New York - always having to buy the latest, newest font for my Alphatype shop. I remember the huge financial burden I took upon myself in 1989-1991 in buying digitized fonts for MAC for the shop. </p>
      <p>No one could ever tell me just how many brands of Garamond I needed to please the old typesetting customers who 1) thanked me when they could do it themselves and 2) to this day still call trying to figure out what font they used way back when....</p>
      <p>For those of us that have spent our money on fonts we have an understanding. I have said this before, and it still baffles me - the kid at home with a computer - can pluck more fonts from more manufacturers for their computer without paying for it - and imagine- today have a larger (and yes, better) collection of fonts then Photolettering did back in its heyday!</p>
      <p>Chuck is doing something unorthodox. Something we are not use to and we have not seen before. Yes, there may be reasons, as business persons, we don't believe in it. Many of us are not bible-thumpers -- but in this country weren't we taught to respect all religions - regardless?</p>
      <p>I feel like I'm up on a soapbox here -- viva la FREEDOM OF SPEECH -- the right to bear arms -- and of course free business enterprise. </p>
      <p>While I'm at it - take a moment to thank a military person these days...</p>
