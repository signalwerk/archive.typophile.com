      <p>At <a href="http://letterheadfonts.com/piracy/thousanddollarfont.php" title="http://letterheadfonts.com/piracy/thousanddollarfont.php">http://letterheadfonts.com/piracy/thousanddollarfont.php</a> we read:</p>
      <p><cite>"In order to reduce the cases of piracy, Letterhead Fonts began encrypting account data into the font files in early 2007. The information embedded into the font file allows us to track the font back to it's original purchaser."</cite></p>
      <p>While the "account data" are usually "embedded" into the invoice to the commodity, it is unusual to "embed" these "acount data" into the commodiy itself. The interesting legal question is whether a seller of commodities is permitted at all by American laws to "embed" such "account data" into the commodities he is selling. Here two examples:</p>
      <p>Example 1: A father buys a wedding ring for his daughter, and the jeweller "embeds" (= engraves) the father's "account data" into this ring. Is this permitted by American laws? </p>
      <p>Example 2: You need a heart valve, and the surgeon "embeds" your "account data" into this valve, before he implants it. Is this permitted by American laws?</p>
