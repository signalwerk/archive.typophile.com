    html: |-
      <p>to nick: </p>
      <p>&gt;&gt;Sure, people here will sympathisize if you’re pirated,<br>
      &gt;&gt;but if you don’t adopt the victim role, who is going to support you?</p>
      <p>seriously ? if you assume you're a victim you most likely will remain  a victim,<br>
      and waste a lot of resources playing that game.</p>
      <p>&gt;&gt;There is a lack of support from Typophiles, otherwise critical of piracy,<br>
      &gt;&gt;who seem to resent that Letterhead would disrupt their workflow—<br>
      &gt;&gt;even if they’re not a customer.</p>
      <p>justified resentment, afaikt. this is a bone-headed move which will only push them faster into obscolescence.</p>
      <p>&gt;&gt;Then there are the information-wants-to-be-free folk, who think everybody is<br>
      &gt;&gt;guilty to some extent (well, all their peers are doing it), therefore it’s OK to sin,<br>
      &gt;&gt;and anyone who thinks otherwise is a fuddy-duddy.</p>
      <p>it's not that simple. this is a rather silly and misinformed characterization of many people with many different ideas about what property and reproduction mean in the digital age. the most cogent arguments i've heard have nothing to do with "everybody's doing it". </p>
      <p>i'm in the middle here, btw - NOT one of your "informationwantstobefree" folk.<br>
      i buy my fonts and i don't give them away, but i will not be shopping at letterhead anymore, in protest to what i see as a completely regressive and counter-productive move on this playing field.</p>
      <p>&gt;&gt;In general, people who rock the boat do alienate some</p>
      <p>this is rocking the boat ? not really, just shooting a bigger hole in their own.</p>
      <p>&gt;&gt;but they also garner respect from others,<br>
      &gt;&gt;so it’s not necessarily bad business to step out of line. </p>
      <p>time will tell. not sure how raising prices and sending ridiculous and indefensible invoices garners respect.</p>
      <p>&gt;&gt;The digital marketplace is big enough.</p>
      <p>exactly why this is a bone-headed move !<br>
      improve business by raising prices and punishing legit customers ?<br>
      marketing genius ! come on back for more !</p>
