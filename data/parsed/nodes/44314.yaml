      <p>I didn't find Chuck's religious comment the least bit offensive. It's not like he's threatening the bullies with eternal damnation.<br>
      It was a few brief words at the end of a long and thoughtful essay which systematically addressed the issues.</p>
      <p>Secure yourself to heaven, indeed, because you won't get much moral support any other way.<br>
      Sure, people here will sympathisize if you're pirated, but if you don't adopt the victim role, who is going to support you?<br>
      Not the state, as this kind of digital shoplifting is a petty crime that's never prosecuted.<br>
      There is a lack of support from Typophiles, otherwise critical of piracy, who seem to resent that Letterhead would disrupt their workflow--even if they're not a customer.<br>
      Then there are the information-wants-to-be-free folk, who think that everybody is guilty to some extent (well, all their peers are doing it), therefore it's OK to sin, and anyone who thinks otherwise is a fuddy-duddy.</p>
      <p>In general, people who rock the boat do alienate some (especially the status quo), but they also garner respect from others, so it's not necessarily bad business to step out of line. The digital marketplace is big enough.</p>
