  date_raw: 2 Nov 2003 — 1:31pm
  votes: null
  html: "<p>There is an article in Sunday's <a href=\"http://www.nytimes.com/2003/11/02/arts/design/02KINO.html\" target=\"_blank\">New York Times</a> about virtual book kiosks placed online by the British Library and the Museum of Modern Art.  <br> <br>One of the British Library books now online is the <a href=\"http://www.bl.uk/collections/treasures/digitisation.html\" target=\"_blank\">Lindisfarne Gospels</a>, written and decorated in the VIII century, while MoMA-Queens has a few books from their 2002 exhibition, <a href=\"http://www.moma.org/exhibitions/2002/russian/index.html\" target=\"_blank\">The Russian Avant Garde Book: 1910-1934</a>.</p>"
  html_clean: "<p>There is an article in Sunday's <a href=\"http://www.nytimes.com/2003/11/02/arts/design/02KINO.html\" target=\"_blank\">New York Times</a> about virtual book kiosks placed online by the British Library and the Museum of Modern Art.  <br> <br>One of the British Library books now online is the <a href=\"http://www.bl.uk/collections/treasures/digitisation.html\" target=\"_blank\">Lindisfarne Gospels</a>, written and decorated in the VIII century, while MoMA-Queens has a few books from their 2002 exhibition, <a href=\"http://www.moma.org/exhibitions/2002/russian/index.html\" target=\"_blank\">The Russian Avant Garde Book: 1910-1934</a>.</p>"
