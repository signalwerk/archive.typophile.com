    html: <p>See also the first two Caxton editions of <a href="http://www.bl.uk/treasures/caxton/homepage.html"><i>The Canterbury Tales</i></a> at the British Library site. Very nicely done, showing the type very well and even, remarkably, giving a good sense of the qualities of the printing.</p>
