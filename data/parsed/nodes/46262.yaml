    html: |-
      <p>Given that it's for being on the academic market, I think it's fine -- and that the Æ adds a lot, it doesn't distract me at all (but then again, I use it too).</p>
      <p>aszszelp, remember this is a CV, not a résumé, by definition it's supposed to include everything.  Plus, I'm assuming he's going for a tenure-track position so they're going to want to know everything before they invite him for an interview.</p>
      <p>The only thing that bothers me is that since a lot of times degrees are placed in small caps, I initially thought you had your universities out of order, since your bachelors was done in Massachusets, and I saw in order: DPhil, BPhil, MA.  I saw Bachelor of Arts right under it but still, just thought I'd point that out.  The only real solution of course would be writing out the names which if you're going for the US market would be akward, but if it's int'l I'd go ahead and write it out fully.</p>
      <p>Given that most CVs are done in Word and full of typographic horrors thanks to autocorrect (even though you'd think folks applying for teaching positions would know better), this one will stand out for sure.  (this is probably all preaching to the choir but just in case not)</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
