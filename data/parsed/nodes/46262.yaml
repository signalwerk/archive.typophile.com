      <p>Thanks for the comments, Matthew. When you say I should write out the names, I assume you mean the geographical abbreviations (e.g., MA and UK). Is that correct? There is plenty of room for "Michigan" and "Massachusetts," but "United Kingdom" would cause the Oxford entry to spill over onto the next line. I suppose I could use "England" instead.</p>
