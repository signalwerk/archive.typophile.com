      <p>I thought about choosing <a class="freelinking external" href="http://www.fontbureau.com/media/pdf/PoynterOSText.pdf" rel="nofollow">Poynter</a> for a book project lately. It is elegant (cap P, G, Q etc), yet relatively generic in style. Though having it's roots in low-country Renaissance it could fit Baroque and later texts too. Plus you can get different optically scaled variants for different sizes and <a class="freelinking external" href="http://www.webtype.com/font/poynterserifre-family/" rel="nofollow">a well hinted version for the web</a> via webtype. Or maybe you find some others over there. <a href="http://www.webtype.com/catalog/style/?ts=692" title="http://www.webtype.com/catalog/style/?ts=692">http://www.webtype.com/catalog/style/?ts=692</a></p>
      <p>But Clifford is a good pick, too, the FF-fonts usually work well on screen.<br>
      I'd go for some late moderate Renaissance or Baroque face, something that sits a bit in between the historic periods and doesn't resemble one particular style so much.</p>
