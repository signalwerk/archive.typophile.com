      <p>Rather than choose a single text typeface for the entire series, I'd suggest working out a more flexible but easily recognizable visual identity, which could accommodate different typefaces for different books -- especially books about different historical periods. (Not that the typeface has to be from the same period, just that it has to feel compatible.) That would also give you the flexibility to use a different typeface online than on paper, if need be.</p>
      <p>That said, as you asked about "antique map fonts," I'd suggest taking a look at Mark van Bronkhorst's MVB Sirenne family, which was based on the engraved lettering used for captions and other map-like information in an 18th-century book from a map publisher in Amsterdam. </p>
      <p><a href="http://mvbfonts.com/mvb_sirenne/" title="http://mvbfonts.com/mvb_sirenne/">http://mvbfonts.com/mvb_sirenne/</a></p>
      <p>John</p>
