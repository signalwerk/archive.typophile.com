    <p>Hi guys. I was recently approached by a publisher of historical novels to help develope their identity and wanted to ask for your advice on the type choice. The books aren’t confined to any specific period which makes it a little harder. The identity wil have to work online, so I’m particulary interested in well hinted @font-face licensed fonts.</p>
    <p>FF Clifford is the first thing that came to mind, as it is relatively silent all the while it’s ruggedness really fits my bill, and the optical sizes and hinting is spot on. I’ve also looked into antique map fonts, like for example Tierra Nueva, and consider trying a modern/didone of some kind. (Whatever I end up using should be relatively consistent in a historical context, so I probably won’t mix Clifford with any didones … Just saying.) Nick Shinn’s Figgins Sans is also on my list.</p>
    <p>They use Trajan (the obivious choice) in their logo, but I hope to be able to tweak that one ever so slightly without abandoning the feel of it.</p>
    <p>I’m not only looking for web ready text fonts, but also just plain display stuff. Any ideas and/or inspiration when it comes to graphic style or type treatment are also welcome. </p>
    <p>I’m basically trying to create something generic ancient, while hopefully managing to avoid the clichés.</p>
    <p>Thanks.</p>
