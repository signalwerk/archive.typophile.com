      <p>Sorry for the late response. These are excellent suggestions! Thank you. I really like Poynter. Both it and Clifford are my best bets for now, for text use. I’m particulary drawn to Clifford for the optical sizes. That’s one helluva overlooked aspect of web design.</p>
      <p>As for different typefaces for different books, John, the books already have their own set of fonts that does not necessarily adhere to their historical period. </p>
      <p>I’ll have to ask Nick about the rendering quality of Figgins.</p>
      <p>Sirenne is also an excellent idea. I’m up for more suggestions, btw.</p>
      <p>For Christmas, mum bought me a dictionary of symbols which should get me started on that front.</p>
