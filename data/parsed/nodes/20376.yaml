      <p>Hi. Sorry to be dredging up an old thread, but I am new to the forums, so I am catching up.</p>
      <p>I did my MFA thesis on type in motion with a slight bent towards time-based typography in cinema and broadcasting (although it did cover some cases of good web/flash based type in motion). You are right though, there are not many good books on the subject. Here is all I was able to find during my research...</p>
      <ul>
      <li> Type in Motion, Jeff Belantoni &amp; Matt Wollman
      </li><li> Type in Motion 2, Matt Woolman
      </li><li> Moving Type - Designing for Time and Space, Matt Wollman &amp; Jeff Bellantoni
      </li><li> Motion Design, Matt Wollman
      </li><li> Type &amp; Typography, Phil Baines &amp; Andrew Haslam (only one chapter near the back)
      </li></ul>
      <p>Also, there is this book which is likely much more along the lines that you talk about, but it has been listed as “coming soon” on Amazon since I started working on my thesis back in late 2004. So, who knows when/if it will be released.<br>
      <a href="http://www.amazon.com/gp/product/0321316258/qid=1106005547/sr=8-1/ref=sr_8_xs_ap_bn1_xgl14/002-8900632-4354409?n=507846&amp;s=books&amp;v=glance" target="_blank">Typography for Film and Video (Absolute Beginner’s Guide)</a> </p>
      <p>You mentioned the first book in the list above and the second isn’t that much more substantial (I didn’t think the first one was good enough to warrant a second quite frankly). The third and fourth books are practically the same content just slightly rewritten. These are the two gems of the list and actually have decent substance.</p>
      <p>Also, if you are really bored and want a good chuckle, my thesis is online here:<br>
      <a href="http://www.art.uiuc.edu/grads/handbook/theses/TypeInMotionOPT.pdf" target="_blank">Type In Motion</a>. You have to ignore the first section on history. It is somewhat inacurate and full of holes—it was a last minute addition I didn’t research adequately and should have left out. About the only potentially useful bit in the whole thing is the morphology (a methodological device first introduced by Kenneth Hiebert for those who know that name) toward the end. I have found it to be a useful methodological tool for critiquing, discussing, and designing moving type. Take it or leave it though....</p>
      <p>Anyhow, this post is already long in the tooth. However, I will be going to TypeCon in Boston and am really looking forward to the Type Film Fest.  Anyone else going who is interested in chatting about Type in Motion / Kinetic type drop me a line and lets grab a brew or few while we are there!</p>
