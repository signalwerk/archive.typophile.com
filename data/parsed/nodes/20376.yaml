    <p>Hello,<br>
    are there any recommendations for type in motion apart from softwaretutorials and picture-books like the “Type in Motion” publication. Maybe more a theoretical and historical work about the relations and correlations of different disciplines like typography, film, animation and programming. Not just the viewpoint of filmmakers, animators, post-productioners - more a typographic insight. Things like timebased typography, but not ust animated letters also code as typography and typography as code. I am thinking about the Intro from the Film “The Matrix”, the Alex Copher Video “The Child”, the font “Beowolf”, the work of “Saul Bass” etc. Thanks a lot, Michael</p>
