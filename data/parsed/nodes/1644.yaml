    html: "<p>How could there be an \"unbeatable\" record in athletics? For one thing, mutation still happens. <br> <br>Readability: It's a dynamic thing (even if you took some \"average\" of all readers), and familiarity does play a role. In my Alphabet Reform work I arrived at the conclusion that the degree to which an alphabet (nevermind a font, which is an instance of an alphabet) is optimal depends on the current state of the reader. What I mean for example is that an \"e\" with a flat bottom might improve readability optimally at this time (by pushing the boundary just the right amount), but once people are totally comfortable with that structure the next step in optimization might be to give the \"e\" a descender. <br> <br>This is hard to explain. <br> <br>hhp <br></p>"
    html_clean: "<p>How could there be an \"unbeatable\" record in athletics? For one thing, mutation still happens. <br> <br>Readability: It's a dynamic thing (even if you took some \"average\" of all readers), and familiarity does play a role. In my Alphabet Reform work I arrived at the conclusion that the degree to which an alphabet (nevermind a font, which is an instance of an alphabet) is optimal depends on the current state of the reader. What I mean for example is that an \"e\" with a flat bottom might improve readability optimally at this time (by pushing the boundary just the right amount), but once people are totally comfortable with that structure the next step in optimization might be to give the \"e\" a descender. <br> <br>This is hard to explain. <br> <br>hhp <br></p>"
