  html: <p>I was talking about athletics with a friend recently and how one day there would have to be an unbeatable world record - no furter improvement possible. <br> <br>In terms of readability in typography, is a similar limit conceivable? What would happen if we reached that limit? Would we even know?  <br> <br>Matha.</p>
