    <p>I just posted a new typeface I've designing online. I started with the idea of creating the ideal typeface for use on spaceship exteriors in sci-fi movies (kind of a joke idea but I ended up really making it). You can download 3 weights for uppercase, numbers, and some alternate characters.<br><img src="/sites/default/files/old-images/orbtiron_test_6164.jpg"></p>
    <p>I've created a <a href="http://pixelspread.com/orbitron" title="Click to visit an external URL." class="freelink freelink-external freelink-external">minisite</a> for the font and posted the <a href="http://pixelspread.com/file_download/9" title="Click to visit an external URL." class="freelink freelink-external freelink-external">three weights for download</a>. I thought I'd post the font files so I could get some feedback.</p>
