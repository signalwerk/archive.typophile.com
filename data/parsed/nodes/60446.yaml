      <p>I'm happy with it. I started out with the intention to create a very specific kind of typeface and I think I've succeeded in doing so. I'm really interested now in working out the kinks like keeping characteristics of the face from the medium to black weight and getting the font metrics right.</p>
      <p>As for why square-ish bevel typefaces are considered futuristic, I think it has a lot to do with modern architects' use of similar geometry. When Mies and Corbusier started introducing entirely new 'futuristic' structures like glass and steel boxes and skyscrapers, I think it introduced the visual vocabulary of what the future will look like. Eurostile seems to have taken that idea and run with it, and we're kind of left this this vestigial idea of the future will be that remains in sci-fi movies. Whether the future will be square and beveled or not, who knows...</p>
      <p>———————————————————-<br>
      <a class="freelinking external" href="http://rbtl.us" rel="nofollow">Read Between the Leading podcast</a></p>
