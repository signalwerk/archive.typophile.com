    <p>I just posted a new typeface I've designing online. I started with the idea of creating the ideal typeface for use on spaceship exteriors in sci-fi movies (kind of a joke idea but I ended up really making it). You can download 3 weights for uppercase, numbers, and some alternate characters.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/orbtiron_test_6164.jpg"></div><p></p>
    <p>I've created a <a class="freelinking external" href="http://pixelspread.com/orbitron" rel="nofollow">minisite</a> for the font and posted the <a class="freelinking external" href="http://pixelspread.com/file_download/9" rel="nofollow">three weights for download</a>. I thought I'd post the font files so I could get some feedback.</p>
