  html: |-
    <p>hi all,</p>
    <p>i’m working on a font that contains a ballot box (uni2610) and a ballot box with checkmark (uni2611). to access these i’m using the dlig feature where the string ‘[]’ is replaced by uni2610 and ‘[x]’ by 2611. like so:</p>
    <p>sub [ x ] by uni2611<br>
    sub [ ] by uni2610</p>
    <p>the problem: brackets are part of the feature language syntax and therefore mean something else when used in feature definitions. is there a way to still be able to use them as i want to use them?</p>
    <p>thanks,<br>
    alex</p>
