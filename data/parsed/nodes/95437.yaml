      <p>Thanks, Pablo—</p>
      <p>I appreciate your sentiment and your efforts to assist where most others would not dare.</p>
      <p>I also have ten or twelve boxes of type specimen books, sign-painter's manuals and related bibliophilia which I had hoped to offer to the Library of Congress (many are not in the collection, and the only copy of BB&amp;S catalog #25 is in the Rare Book Room, which makes access limited and tedious. For obvious reasons, the name of the donor will now read "Anonymous."</p>
      <p>Even my plans to donate the remainder of those books not accepted to colleges and universities in doubtful, except as noted. Good thing I don't qaulify for tax deductions anyway.</p>
      <p>However, I am reasonably confident that the three million+ people who downloaded my free fonts will continue to download them, ask for free tech support and/or figure out a way to make a buck on a free gift of love…but not contribute a dime in appreciation. Wow.</p>
      <p>Even better: all evidence of malfeasance have been removed from Craigslist PhiFo. Blank pages indicate massive eradication of content. Except where I saved the pages offline. Maybe a bit of paranoia is in order, Or not.</p>
