    <p>As I am well aware, my behavior of late has been inexcusable. My descent into madness began a little after this blatant, unpunishable and unstoppable character assassination of my brand was posted on the Craigslist Philosophy Forum. Combined with a downward trajectory in font sales, an inability to launch a separate, totally error-free adjunct revenue stream, a gamble that I wouldn’t need health insurance until I reach 65 next year, and having nothing of value to support my wife, should she outlive me, I went a little nuts. In fact, nuts enough to make my wife feel compelled to by institutionalized, rather than live with me.</p>
    <p>Finally, yesterday, a blood test revealed an unexpected anomaly in my liver function put the figurative last nail in the coffin. I hereby surrender: the big money rules. Make me an offer for my complete collection (over 1,000 finished fonts and almost 200 abandoned in various stages of production) in a manner that will insulate my soon-to-be ex-wife of any tinge of guilt by association for my insufferable crime of disagreeing with the reigning sociopath in an online forum.</p>
    <p>Your money, my life’s work: name a price, and the two lunatics will consider—once she is released.</p>
    <p>P.S. Mods—be sure to delete the evidence, especially if it is for MY protection. Wink-wink, nudge-nudge.</p>
