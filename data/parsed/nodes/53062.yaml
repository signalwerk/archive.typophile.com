      <p>I find that Vectora works very well in small print, as well as Meta, both sans serif. Minion is a good serif in small print.</p>
      <p>You say that you want a friendly look in combination with high-tech. Do you mean the type or the overall design? I would advise you to keep the type clear and legible because it is so small. If you really want to have a high-tech feel about it, I'd advise you to get that from the rest of the design and lay-out. Make any sense?</p>
      <p>Kind regards,<br>
      Jean Paul</p>
