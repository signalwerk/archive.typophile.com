    <p>This might be of interest for the Slovene type community: a review of the typographic rules book <em>›Mikrotipografija‹</em> by Klementina Možina.<br>
    There is no direct link available to this Slovene newspaper, that is why the review is cited here.<br>
    An advertising link can be found <a href="http://www.graficar.si/index.php?option=com_content&amp;task=view&amp;id=195&amp;Itemid=122" rel="nofollow">here</a>. </p>
    <p><strong> Veda o oblikovanju črk, pisav in besedila<br>
    Še eno temeljno delo</strong></p>
    <p><em>Klementina Možina: Mikrotipografija. Naravoslovnotehniška fakulteta, Oddelek za tekstilstvo, Ljubljana 2009, 275 str., 12,50 evra.</em></p>
    <p> Proizvodnja knjig (revij in različnih drugih tiskovin) se je v Sloveniji po razmahu računalništva oziroma na njem temelječega namiznega založništva tako zelo povečala, kot je v splošnem padla njihova jezikovna, pravopisna in likovno-grafična kakovost. Ko so v tiskarnah uporabljali še svinčene črke, je bilo drugače. »Ker imamo poleg dobrih avtorjev tudi slabe, je naloga stavca, da besedilo postavi pravilno, četudi ga je avtor napisal napačno. Stavec mora poznati pravila zapisa posameznih besed, vedeti, katere besede se piše z veliko začetnico, katere v kurzivni različici ipd.,« je rečeno v prvem tehnično-obrtnem in tiskarskem priročniku v angleščini Mechanick Exercises J. Moxona iz leta 1678.</p>
    <p>Razvoj je šel seveda naprej tudi na Slovenskem in čez 325 let je izšla Knjižna tipografija (2003) prva slovenska strokovna knjiga, ki je pri nas na tem področju pomenila, in še vedno pomeni, pravo prelomnico. Napisala jo je dr. Klementina Možina, docentka (takrat še asistentka) na Naravoslovnotehniški fakulteti oz. tamkajšnji Katedri za informacijsko in grafično tehnologijo, lani pa je izpod njenega peresa na 275 straneh izšlo neke vrste nadaljevanje tega temeljnega dela z naslovom Mikrotipografija (Naravoslovnotehniška fakulteta, Oddelek za tekstilstvo, 2009).</p>
    <p>Tipografija je oblikovanje črk, pisav, besedila itd. in hkrati veda o tem področju. Pri mikrotipografiji gre za obliko in stavo ločil, matematičnih in kemijskih znakov, številk, drugih nečrkovnih in neštevilčnih znakov in za korekturo oziroma za korekturna znamenja, tako slovenska kot tudi tista, ki so določena s standardom ISO. V knjigi poleg tega najdemo še znamenja te vrste za angleščino in nemščino, napotke za stavljenje bibliografij, kazal in navajanje poklicev, dalje poravnavo besedila (izogibanje t. i. pankrtu in vdovi), odstavčno naštevanje, začetke odstavkov in poglavij, potem estetiko, to je uporabo razpiranja, kurzive, kapitelk, ligatur in različic pisave za ločila, za povrh pa še Tipografski terminološki slovar (ki je bil sicer že tudi v Knjižni tipografij, le da gre tokrat za njegovo popravljeno in dopolnjeno verzijo).</p>
    <p>Kljub računalnikom, zaradi katerih je tiskarska tehnologija »v zadnjih treh desetletjih napredovala bolj kot prej v pol tisočletja«, je v stroki od t. i. svinčenih časov marsikaj ostalo enako, le da smo danes »stavci« vsi, ki pri tipkanju uporabljamo to sijajno napravo. Enako ali še bolj moramo poznati, denimo, »pravila zapisa posameznih besed«. Tipograf mora znati še kaj več, to je ločiti posamezne pisave med seboj, označiti in razložiti značilnosti posameznih delov črk teh pisav ter poznati zakonitosti posameznih različic pisave in vpliv umetnostnih slogov, sodobne tehnike in medijev na oblikovne značilnosti posameznih pisav. In vse to skupaj mora brez težav »uporabiti tudi pri lastnem oblikovanju pisave«.</p>
    <p>Toda vrnimo se h knjigi. Nedvomno gre za temeljito strokovno delo. Vsaka trditev in sleherno priporočilo je izčrpno podprto s sklicevanjem na relevantne vire, navedene v tekočih opombah. Upajmo, da jo bodo poleg sestavljavcev novega pravopisa s pridom uporabljali tudi oblikovalci spletnih portalov, javnih napisov, lepakov in še zlasti naši vrli televizijci. Dogaja se namreč marsikaj: pri pisanju datumov se pod vplivom angleščine opušča presledek med števili za dan, mesec in leto, pri urah in minutah se pika napačno nadomešča z dvopičjem (čeprav poleg ur in minut ni tudi sekund, kot je to npr. pri navajanju športnih rezultatov), pred enomestno številko ure, dneva, meseca ... se napačno piše ničla. Itd.</p>
    <p>V knjigi se tu in tam sicer najde kakšna vsebinska ali slogovna nerodnost. Denimo, celzijev in fahrenheitov ni, so samo stopinje Celzija oz. Fahrenheita, prav tako ni »stopinj temperature v kelvinih«, temveč so samo kelvini. V tipografskem slovarčku pri geslu tipografija pravilno piše, da gre za vedo »o oblikovanju črk, pisav, besedila«, pri geslu tipografska tonska vrednost pa, da je to »barvna podoba tipografije«. Pri tem seveda ne gre za barvo vede, temveč za izmerjeno pokritost tiskane površine s tipografskimi elementi, to je z vrsto pisave določene velikosti, razmika, dolžine vrstice itd., in za iz tega izhajajočo »jakost« ali izrazitost (tj. temnost oz. svetlost) natisnjenega besedila.</p>
    <p>Čisto brez polemike seveda ne gre. Za rimske številke, piše avtorica, »v zadnjem obdobju za paginiranje strani uporabljamo tudi minuskule (so manj moteče), kar smo prevzeli z anglosaškega področja«. Kakor za koga. Za podpisanega so rimske številke, v nasprotju s pravopisom suženjsko povzete po (anglo)ameriškem zgledu v obliki malih črk, veliko bolj moteče kot tradicionalne slovenske z verzalkami. Res pa so za ta namen še nekoliko boljše kapitelke (kapitelka je pomanjšana velika črka, visoka kot male črke a, c, e, o, x).</p>
    <p>V ta okvir sodi še terminološka pripomba. Če smem karikirati: bralec niti zdaj, po izidu Mikrotipografije, ne ve, da baročna pomeni isto kot predklasicistična pisava (angl. transitional), kar je zveza, ki je bila pred omenjeno letnico pri nas povsem ustaljena in, s tem pomenom, najbrž sploh edina. Namreč tisti bralec, ki pozna slovensko strokovno literaturo, objavljeno pred letom 2003, saj avtorica v obeh knjigah izključno in dosledno uporablja zvezo baročna pisava, brez omembe izraza predklasicistična.</p>
    <p>Likovno-grafična oprema knjige je skladno s pričakovanji odlična in celo na straneh, na katerih je poleg opomb komaj pet ali šest vrstic glavnega besedila, s preglednostjo ni nobenih težav. Tudi s čitljivostjo jih ni, ker je uporabljena družina pisav, imenovana mantika, enako dobro oblikovana. Zanimive so še tipografske vinjete, ki se začnejo že na naslovnici.</p>
    <p>Čeprav se Mikrotipografija komu morda ne bo zdela tako atraktivna kot njena (obsežnejša) predhodnica, jezikovno pa bi se jo ponekod dalo še izboljšati, gre nedvomno za velik delovni dosežek Klementine Možina, povsem primerljiv s tistim iz leta 2003. Knjiga bo prispevala k skladni uporabi mikrotipografije, »kakršno poznajo številni evropski narodi in široko anglosaško področje«, na Slovenskem.</p>
    <p><em>Tomaž Švagelj</em></p>
