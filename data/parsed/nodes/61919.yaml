      <p>It's still not abundantly clear what you're asking. Are you asking someone to translate/transliterate this, or are you trying to find software that will recognize the characters to do it automatically?</p>
      <p>Anyway, here is my own stab at the titles on the left side: </p>
      <p>死神図鑑 = The Title: "Bleach"<br>
      演出 = Director<br>
      作監 = Shortened form of 作画監督 = Animation Director<br>
      原画 = Original Creator<br>
      色指定 = Color</p>
      <p>As to transliterating the names associated with these four titles, I can tell you that Japanese ones are a whole lot of fun, especially given names.</p>
      <p>I also looked for information about the 3rd Bleach movie, and the names don't match up to the titles. See: <a href="http://en.wikipedia.org/wiki/Bleach:_Fade_to_Black,_I_Call_Your_Name">http://en.wikipedia.org/wiki/Bleach:_Fade_to_Black,_I_Call_Your_Name</a> and <a href="http://www.tv-tokyo.co.jp/bleach/">http://www.tv-tokyo.co.jp/bleach/</a></p>
      <p>Dr. Ken Lunde<br>
      Senior Computer Scientist, CJKV Type Development<br>
      Adobe Systems Incorporated<br><a href="mailto:lunde@adobe.com">lunde@adobe.com</a></p>
