      <p>As you know, it’s very difficult to read Japanese names because each of Chinese characters in Japanese have several readings. That’s why I cannot read several names, such as 水野悦明 and 橋本知枝. You could not know what you should read their names, unless you ask them.</p>
      <p>Upper one:</p>
      <p>効果 effect (I don’t know the precise animation film term.)<br>
      長谷川卓也 Takuya Hasegawa<br>
      （サウンドボックス） (Soundbox)</p>
      <p>調整 adjustment<br>
      野口あきら Akira Noguchi</p>
      <p>ＭＡスタジオ MA Studio<br>
      スタジオごんぐ Sudio Gong</p>
      <p>音響プロデューサー Audio Producer<br>
      塚田政宏 Masahiro Tsukada</p>
      <p>音響制作 Audio Production<br>
      楽音舎 Rakuonsha</p>
      <p>Bottom one:</p>
      <p>原画 Original drawing or Key Animators<br>
      井上敦子(Atsuko Inoue) 宇佐見皓一(Koichi Usami)<br>
      水野悦明(Etsuaki Mizuno or Yoshiaki Mizuno?) 松坂定俊(Sadatoshi Matsuzaka)<br>
      折井一雅(Kazumasa Orii) 宮川治雄(Haruo Miyagawa)<br>
      桂木杏(An Suzuki) 津熊健徳(Takenori Tsukuma?)<br>
      さのえり(Eri Sano) 山本祐子(Yuko Yamamoto)<br>
      飯村真一(Shin-ichi Iimura) 北村友幸(Tomoyuki Kitamura)<br>
      木村文代(Fumiyo Kitamura) 橋本知枝(Tomoe Hashimoto or Chie Hashimoto?)<br>
      中西理絵(Rie Nakanishi) 山内明(Akira Yamauchi)</p>
