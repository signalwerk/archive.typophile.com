    <p>Hi guys, I wondered if anyone might be able to help me with this thats been bugging me:</p>
    <p>I want to use this quotation from Paul Standard in my dissertation, but can't find any kind of source or citation for it anywhere.</p>
    <p>‘Geometry can produce legible letter but art alone makes them beautiful. Art begins where geometry ends, and imparts to letters a character transcending mere measurement’.</p>
    <p>Anyone know where or when he originally said this? Or even any publications that cite this quote? Any help gretaly appreciated, thanks.</p>
