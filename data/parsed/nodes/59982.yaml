    <p>Every two months, we offer a font discovery pack at a very affordable price compared to regular prices when purchased with the rest of a family. From € 98. You save approximately 30%.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/4fonts_a_july2009_5846.png"></div><p></p>
    <p>This new Font Discoveries pack is a good way to discover our fonts at an affordable price. <a class="freelinking external" href="http://www.typofonderie.com/alphabets/fontdiscoveries/fonts_july2009 " rel="nofollow">Jump on the July-September 2009 Font Discoveries</a> for more info about the 4 fonts included: Le Monde Sans PTF Light, Ambroise Std Firmin Demi, Anisette Std Black, Angie Sans Std Bold Italic. <a class="freelinking external" href="http://www.typofonderie.com/icono/alphabets/pdf/FontDiscoveriesJuly2009.pdf" rel="nofollow">The available pdf present the 4 fonts(July 2009 Font Discoveries pdf specimen</a> in various contexts, samples in use, glyph sets and and so on.</p>
