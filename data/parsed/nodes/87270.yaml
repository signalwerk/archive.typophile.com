    html: |-
      <p>Up until now there were really big price differences for what I like to call the old workhouse fonts between webshops (40% in some cases). My guess is that the investors in this deal want to have some return soon and that the price differentiation will be a thing of the past within a few months. </p>
      <p>Internet shopping being what it is there is no international or national authority that will intervene… The worldwide font market is something in the region of 100 million USD or such, I belief, and as such the tiniest of businesses that might ever come under the scrutiny of governments or euro commissioners.</p>
      <p>Anyway, I did prefer shopping for my fonts at the boutiques that don’t shift their wares through MT, LT and/or MyFonts … And will do so ever so fervently in future.</p>
