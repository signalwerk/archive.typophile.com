    html: |-
      <p>Another existing font, very similar, is <a href="http://www.myfonts.com/fonts/bluevinyl/roller-baby-bv/" target="_new" rel="nofollow">Jess Latham's Roller Baby</a></p>
      <p><em>The xheight-restricted h is indistinguishable from an n [...] Maybe try something like this for the B?</em></p>
      <p>Yep. Jason with a stroke this fat the most practical structural solutions point to a unicase scheme. Capital H form is the obvious and easiest solution for "h". Suggest making both "i" and "I" capital form with serif/bar top &amp; bottom. "d" and "b" have legibility problems, and make "D" and "B" more attractive, practical forms.</p>
      <p>Guessing: the counterless glyphs, you left the counters out to maintain consistent stroke width? A lot of successful ultra-bold fonts break that rule, the best example springing to mind is Gill Sans ultra bold. Check out the "a", "g" and "e" in that font. Those letters violate the font's stroke width rule, but nobody complains, and it's one of the most popular ultra-bolds around.</p>
      <p>In short---it's okay to cheat. In fact cheating is neccessary, practically all successful type designers cheat, and a lot of well-known fonts would not be possible without cheats in their construction. The E in Mark Simmonson's Mostra, and just about every ultra bold font. Think of cheating as a form of exaggeration.</p>
      <p>This has potential. I recommend steering it further from Roller Baby, as it's rather close.</p>
      <p>j a m e s</p>
