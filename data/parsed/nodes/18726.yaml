      <p>Hi Guys,<br>
      Thanks for your feedback. I quite like the lower case letters, and want to steer away from a bar on the top/bottom of the "I". I like how the face shows just enough to make out letters (and words), its what gives the typeface it's feel. I have revised the face a little and included alternative letters. Any comments would be appreciated. There are obviously similarities between others similar faces - because the style of the stroke only allows certain ways for the letters to be constructed.<br>
      Cheers Jason.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ Bubble_CharSetA.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/ Bubble_CharSet_AI.jpg"></div><div class="imageWrap"><img src="http://typophile.com/files/ Bubble_CharSet_A0.jpg"></div><p></p>
