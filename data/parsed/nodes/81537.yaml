    <p>Hi I'd really like to know what this font is.</p>
    <p>It's very helvetica-esque except that it has smaller 'spurs' (?) on the lower case p and g and n. It's all a bit tighter too. It also has quotation marks that end in a point rather than more solid like helvetica does.</p>
    <p>I've tried the identifont '20 questions' thing and it didn't find anything quite right. Also looked through many many many pages of 'similar to Helvetica' with no results.</p>
    <p>If someone with a magic eye can identify it that'd be awesome!<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/adam_5896.and.joe.go.tokyo.0101.jpg"></div><p></p>
