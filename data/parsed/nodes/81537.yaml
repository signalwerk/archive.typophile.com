    html: |-
      <p>I think it might actually be <a href="http://new.myfonts.com/fonts/adobe/helvetica/roman/" rel="nofollow">Helvetica Roman</a> with added stroke to make it look like Bold weight. That would close down the openings like this and shorten the stems, like your sample, I think.</p>
      <p>One of the keys here, I think, is that the terminals of the G, C and e are horizontal as they are in Helvetica.</p>
      <p>- Mike Yanega</p>
