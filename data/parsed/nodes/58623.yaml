    html: |-
      <p>I'm fairly sure - sorry Geoff - that it isn't Adobe Garamond. Although it's a close match to the printed piece, Adobe Garamond's upward-tilting top-stroke of the <strong>5</strong>, and the unclosed bowls of the <strong>6</strong> and the <strong>9</strong> rule it out.</p>
      <p>It is, I think, Peter Baker's Garamond-esque freeware font for medievalists, <a class="freelinking external" href="http://junicode.sourceforge.net/" rel="nofollow">Junicode</a>, or its predecessor JuniusModern, from the <a class="freelinking external" href="http://www.faculty.virginia.edu/OldEnglish/index.html" rel="nofollow">Old English Font Pack</a> (which had the old-style numerals in default position, rather than as an opentype option, as in Junicode).</p>
      <p><a class="freelinking external" href="http://img197.imageshack.us/img197/8528/picture2a.png" rel="nofollow">See this image of the relevant Junicode characters</a>.</p>
