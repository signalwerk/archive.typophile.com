  html: "<p>As people who know me here know, I'm not easily stumped, but this one has been bugging me for some time. So I'm throwing this out to the <i>other</i> expert spotters here. (First time for everything.) <br> <br>These were grabbed from the movie <i>Ed Wood</i> (1994). This is the best I can do until the DVD is released (delayed multiple times already--I guess they're holding out for Martin Landau to do a comment track or something): <br> <br><img src=\"http://www.typophile.com/forums/messages/83/55474.jpg\" alt=\"edwood\"> <br> <br>The script is easy--Dom Diagonal slanted a bit more, but the condensed sans serif is what's driving me nuts. When Binderstyle came up this last week I thought that might be it, but no. There's one in the Solotype catalog that looks close called Glenlake Gothic, but it doesn't quite seem to match the lowercase you can see in Wood's sad bio at the bottom. <br> <br>Any ideas?</p>"
  html_clean: "<p>As people who know me here know, I'm not easily stumped, but this one has been bugging me for some time. So I'm throwing this out to the <i>other</i> expert spotters here. (First time for everything.) <br> <br>These were grabbed from the movie <i>Ed Wood</i> (1994). This is the best I can do until the DVD is released (delayed multiple times already--I guess they're holding out for Martin Landau to do a comment track or something): <br> <br><img src=\"http://www.typophile.com/forums/messages/83/55474.jpg\" alt=\"edwood\"> <br> <br>The script is easy--Dom Diagonal slanted a bit more, but the condensed sans serif is what's driving me nuts. When Binderstyle came up this last week I thought that might be it, but no. There's one in the Solotype catalog that looks close called Glenlake Gothic, but it doesn't quite seem to match the lowercase you can see in Wood's sad bio at the bottom. <br> <br>Any ideas?</p>"
