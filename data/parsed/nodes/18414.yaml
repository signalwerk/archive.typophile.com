      <p>Oddly enough, about a year ago, I was doing some informal researching into "Pirate" looking typefaces and scripts for a children's poster mock-up.  David Nalle's site does have several candidates besides Captain Kidd (he has a <a href="http://www.fontcraft.com/scriptorium/kidd/index.html" target="new">great web page</a> on the inspiration and development of the face).</p>
      <p>You can also find many "historic" styled faces available at  <a href="http://www.waldenfont.com" target="new">The Walden Font Co.</a>. By mixing a titling face and "handwritten" lines here and there, you can emulate an "old treasure map" look. Look at their "Divers Handes" collection for scripts.</p>
      <p>FYI- you might contact them direct since they seem to be working on a new "Nautical Themes" collection. Maybe you can be one of the first users and be truly unique with your project.</p>
      <p>Did you see Type Oasis <a href="http://www.moorstation.org/typoasis/pirates/index.htm" target="new">Pirate &amp; Fonts</a> yet?</p>
