      <p>"Terranova — seen in the Critique section — a work in progress but pretty far along, and the designer might let you to take it for a spin."</p>
      <p>:) I was just thinking "could Terra Nova be a pirate font?", and i came to the conclusion: it could. I just don't know yet whether it's applicable already in professional use, but I'll put an update there the next minutes, so you can have a look at it.<br>
      Possible problems: No bold, no italic, maybe too filigree, and never been used in productive systems yet.<br>
      Possible pros: made from a map of america from 1561 (spaniard), has titling capitals, lots of special characters (astrological, astronomical, roman numbers, ligatures, etc.).<br>
      If you want to use it, I could produce a version with merged contours and send it to you for a try.</p>
      <p>Sebilar</p>
      <p>Btw: Has MVB Sirenne been proposed already?<br>
