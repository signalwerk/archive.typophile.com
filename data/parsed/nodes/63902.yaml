      <p>FWIW, in some newspapers it's actually the practice to have jumps occur in the middle of a sentence to show the break more clearly. I remember being disgusted with the idea at first, but from reading text like this I have found that it's actually not that bad. Counter-intuitively, it's almost useful for not disrupting the reading flow, as jumping between pages at the end of a sentence can sometimes make it a bit hard to recall what the preceding sentence was about (while that first bit of a sentence hanging in your mind seems to persevere).</p>
      <p>Also, getting slightly further afield, I have found the single most helpful typographic device for jumps to be a combination of a keyword in the beginning of the jump, e.g. "See <strong>Religion</strong> on page 3," and a large, bold intro in the jumped article's headline, e.g. "<strong>RELIGION:</strong> A crisis of faith." This makes it far easier for the reader to pick up the article after turning the page.</p>
