      <p>My impression was that, in Shakespears plays, it meant that the next line was spoken right after the previous (almost interrupting the previous player). I agree, it is an interesting concept.</p>
      <p>I like the use of a (coloured) triangle to imply the text continues and a block to imply the text stops. You could even start the continuation with the same triangle if you fear it might not be clear where the text starts again.</p>
