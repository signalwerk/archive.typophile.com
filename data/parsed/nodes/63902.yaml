  html: |-
    <p>Hi<br>
    I write a newsletter and I'm sometimes battling with copy exceeding page length. I need a nice way to direct the reader to where they can find the end of the article and which column to jump to. I'm wondering if there's a standard dingbat and whether the words, such as 'continued on page 2 left column', should be in the same font but a point size smaller, or in italics, or if there's any convention here. Though not technically appropriate, double guillemets might be nice? Like this:<br>
    <cite> Continued on p.3, right column »</cite><br>
    or with an arrow:<br>
    <cite> Cont'd on p.3, right column →</cite><br>
    <cite> Cont'd on p.3, right column ⇒</cite></p>
    <p>Any ideas?</p>
  html_clean: |-
