  html: |-
    <p>Hi all</p>
    <p>I have a client whose logotype is set in Helvetica Neue, the publication I'm designing for them is mainly text based but illustrated with a lot of infographics. I have to use Helvetica,  so want a contemporary serif which will contrast. The publication needs to be elegant, sophisticated, and intelligent but not so severe that it's dull - so maybe something a bit quirky?</p>
    <p>Any thoughts or suggestions?</p>
    <p>p.s. also colour has to be mainly orange/black to reflect their ID</p>
