    html: |-
      <p>Use a character from a font with serifed I, such as Verdana. If the weight and height aren't quite right, adjust them with horizontal and vertical scaling.</p>
      <p>Alternatively, choose a sans font which has some contrast between I and l, either with caps that clearly have a greater stem width, or one where ascenders are taller than cap height.</p>
