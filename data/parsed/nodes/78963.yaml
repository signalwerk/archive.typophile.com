    html: <p>I would try simply raising the ascender line by just outlining the type and using the Direct Selection Tool to raise the two l's, i, t and h playing with different variations. It shouldn't be too difficult to arrive at a solution that differentiates the double l problem, although it will inherently be more subtle than that of a serif. Just look at some other sans that have more extreme ascender heights for comparison.</p>
