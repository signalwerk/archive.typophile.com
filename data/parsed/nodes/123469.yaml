    html: |-
      <p>You really don't want to use the same font that you used in the logo for any of the other materials. It will weaken the logo and the overall branding. If you do, make sure that the treatment is divergent enough that it does not conflict.</p>
      <p>Assuming it's a traditional symphony, and there may be text heavy communications, I would go with a serif face. What you use for headline text is up to you and a function of the overall look and feel of the brand and it's collateral.</p>
