    <p>hey there!</p>
    <p>i'm new here but i really need your help with a few questions. i'm currently designing an corporate identity for a music studio and am a little stuck with the typography.</p>
    <p>i designed the logo with the univers condensed bold in all caps. (unfortunately i can't show it to you, but it's pretty simple and i'm actually happy with it. so i think it doesn't really matter for my questions)</p>
    <p>anyway, i'm now stuck on the further communication media. i should design a letter and a website. but i don't really know which font i should take for the large text portions. i would like to stick with the univers condensed for titles, special information, etc.</p>
    <p>so can i use the condensed font for the large text or is it a typographical no-go because of the readability? if so which font would be better? another font face of univers? a serif font? i think a serif font would also be good for a good contrast but i don't know which one would be a good pair.</p>
    <p>if you have any advice or font suggestions i would be really glad to hear them soon. i'm a typo-rookie and really helpless at the moment.</p>
