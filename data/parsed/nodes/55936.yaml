  html: |-
    <p>Greeting Comrades!<br>
    I often see blogs about a font face<br>
    people dislike with a zeal.<br>
    However, I never hear anything about<br>
    Copperplate and it's everywhere.<br>
    I once was told by a former Professor<br>
    that it's a respected font even though it's<br>
    overused. Don't get me wrong I like<br>
    Copperplate. </p><div class="imageWrap"><img src="http://typophile.com/files/Copperplate_3838.gif"></div><p></p>
