    html: <p>The lack of a true lowercase limits the usefulness of Copperplate, but for certain applications it has exactly the right balance of strength and grace. Also, it seems to work better than most fonts when set on a curved baseline, as on the perimeter of a circle (think Presidential seal).</p>
