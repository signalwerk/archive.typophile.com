    <p>I’m looking for a production technique that uses traditional offset printing with inks that can change color with varying temperatures. Specifically, I’d like to find an ink or process that can be applied invisibly and will appear when heat is applied. Such as a warm breath or touch of a hand.</p>
    <p>I’ve talk to a couple of local printers and they haven’t been able to find anything that meets specifically what I’m looking for. There are inks that will go down opaque and have a color and disappear when heat is applied, but that’s the opposite of what I’m looking for.</p>
    <p>Does anyone know of such a process or where to begin my search?</p>
    <p>Thanks,</p>
    <p>Jenkin</p>
