      <p>This is getting into very specialized territory. One place to start might be to talk to Brady-Palmer, Inc. They are a book jacket &amp; cover printer near New York City. They do amazing things.</p>
      <p><a href="http://www.bradypalmer.com/" title="http://www.bradypalmer.com/">http://www.bradypalmer.com/</a></p>
      <p>Also talk to a major ink manufacturer. Find out what their inks can do and then ask them to recommend printers who use those inks. Ask your regular printer who their best ink supplier is.</p>
      <p>You will also need to find out if this work needs a special stock.</p>
      <p>Keep us posted here.</p>
      <p>powers</p>
