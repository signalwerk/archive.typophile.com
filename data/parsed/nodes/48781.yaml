    html: |-
      <p>Nick,</p>
      <p>Thanks for the critique. It seems that it's been pretty light in this area. Or maybe it's just what I post. lol.</p>
      <p>I don't think the hooks on the b, h and k affect too much of the readability at small sizes and they add a little more character when at larger sizes. (I did try it though, but the overall effect seemed more flat)</p>
      <p>I adjusted the C, c and G, G.sc just the slightest bit and it did help the overall width feel better. Nice catch.</p>
      <p>I'm not sure if I follow what you mean by egg-shaped. They are intentionally not circular, but more ovular.</p>
      <p>And another good catch on the 4 and the Q.sc. Both have been adjusted accordingly.</p>
      <p>I'm hoping to have the complete character set ready within the next couple days.</p>
