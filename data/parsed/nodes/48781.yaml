      <p>Names and dates on page 2 and 3!</p>
      <p>AEacute, aeacute, aeacute.sc missing? Oslashacute, oslashacute, oslashacute.sc missing?</p>
      <p>For completeness, f_b, f_f_b, f_h, f_f_h, f_thorn, f_f_thorn ligatures? Maybe not necessary but some include those.</p>
      <p>Would like to see a lowercase j with same structure as f but rotated, roughly speaking. </p>
      <p>Also, don't think the long J (as used in I_J) fits that well with the rest of set. It's the one character which loojks like it has come from a different font in my mind.</p>
      <p>Quite like the staggered double quotes, however, isn't the implication that the single quotes need to stagger too for the sake of rotational logic? Second thoughts, you've probably got it right; just making sure you've thought it through.</p>
      <p>Good work, Arlo. Looks lovely set in copy.</p>
