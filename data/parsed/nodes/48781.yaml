      <p>Hi Arlo</p>
      <p>Probably wouldn't hook the b, h and k - not sure you need to and the l and d would fit better. Maybe that's just me.</p>
      <p>C and c (and G and G.sc) bottom strokes come out too far in my head.</p>
      <p>Should your y look more similar to the v (and w and x)?</p>
      <p>All O's (and Q's) look egg-shaped to me... is that deliberate?</p>
      <p>Struggling with the vertical alignment of the 4's: I know why the lining 4 sticks up above caps line but it ought not to. Maybe lower the cross bar on the old style (or raise the vertical stroke on the lining 4) and the problem might go away.</p>
      <p>Fir info, Q.sc has dropped down slightly.</p>
      <p>Fine work. I particularly love the punctuation marks.</p>
