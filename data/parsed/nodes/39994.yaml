    html: |-
      <p><em>Is she mocking and being ironic? Is that not obvious?</em></p>
      <p>The phrase "I shop therefore I am" is not a mockery of consumerism, but a recognition of it as a cultural imperative. Her important early work, after all, comes soon after the development of cultural studies as an academic discipline. The idea of "popular culture" was an oxymoron until around 1970.<br>
      The graphic style she used was not an imitation of commercial media. It had something in common, certainly, in the image+text combination, and Futura and color bars were popular at the time. But that was her style (she had worked in publishing), and also had resonance with, of course, John Heartfield's work--another artist who worked as a commercial graphic designer.<br>
      It was her medium, her way of expressing herself, not a parody.</p>
