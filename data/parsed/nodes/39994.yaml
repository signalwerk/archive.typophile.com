      <p>Kruger had an exhibition in Glasgow in 2005, commissioned by GoMA, specifically related to violence against women, in her classic agitprop text+image technique:<br>
      <a href="http://www.studio-international.co.uk/reports/kruger.asp" title="http://www.studio-international.co.uk/reports/kruger.asp">http://www.studio-international.co.uk/reports/kruger.asp</a></p>
      <p>If you're looking to discuss sexual politics in her work, why not choose that, where she directly addresses the issue?<br>
      I wouldn't say she particularly addresses consumerism in her work, although her use of commercial media may give that impression.</p>
      <p>Barabara Kruger is one of that generation of "second wave" feminists, and there's no denying that sexual politics is an important element in her work, but I would echo Ricardo in saying that there's more to it than that, and ironically by focusing on it and pigeonholing her as a consumerism/shopping/women's issues artist, you'd be missing the point. </p>
      <p>I like what she has to say, and the way she puts words and images together.</p>
      <p>At the same time and place as the GoMA exhibit, she showed a more recent direction, an installation (four walls of an enormous room in an old transport terminal) involving four simultaneously screened movies of "talking heads" she had written and directed, with text captions.</p>
