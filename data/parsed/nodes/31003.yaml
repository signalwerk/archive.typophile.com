    html: |-
      <p>If you go to</p>
      <p><a href="http://en.wikipedia.org/wiki/Optical_character_recognition" title="http://en.wikipedia.org/wiki/Optical_character_recognition">http://en.wikipedia.org/wiki/Optical_character_recognition</a></p>
      <p>and scroll down to near the bottom to "proprietary software," there are a number of packages that claim to OCR handwriting and non-Latin fonts (for example, Arabic, Hebrew, and Asian). One of these might work on script fonts. Also, IIRC, software like OmniPage can be "trained" to recognize specific symbols, so you might be able to train it on your script fonts, although that would be mighty tedious.</p>
      <p>BTW, if you scan in black and white or grey scale instead of full color, color won't matter too much unless something drops out.</p>
