      <p>I haven't recently used OCR*, but when I did it was, at best, hit and miss on anything but the most basic text. Scripts, I would guess, are the least likely to successfully translate. For the time spent scanning, cleaning up etc. and then proof-reading and correcting it would probably be better to employ a copy typist to retype the items.</p>
      <p>Tim</p>
      <p>* things might have (must have) improved.</p>
