    html: |-
      <p>As someone with a lot of experience with OCR (it used to be my job to scan and OCR full books) I would recommend typing the text out manually, depending on the number of cards you have.</p>
      <p>OCR generally only works on 1-bit images (some OCR programs can accept other formats, but they're converted to 1-bit internally). For best results, you'd have to photoshop each card to make sure the text comes through properly in a 1-bit setting. If you're doing a book, you can just run a batch on the pages since they will all be quite similar, but it sounds as if your cards each have a different design with different colours.</p>
      <p>Also, script fonts are generally harder to OCR, depending on a number of factors including how connected they are, etc. A good OCR program should be able to recognize script fonts, but that can get expensive.</p>
      <p>Finally, OCR will always produce typos. Sometimes it's just an extra period or semicolon if there is dust on the page, sometimes 1 becomes l, but I have yet to see a perfect OCR, especially from a colour image. If accuracy is important to you, you'll have to proofread all of your text.</p>
      <p>So, if you still want to go with OCR, go for it, but I'd recommend a fast typist instead.</p>
      <p> - Lex</p>
