    <p>I think I already know the answer to this, but here it goes ...</p>
    <p>I understand the basic technology behind OCR and it's limitations. What I'm trying to do is somewhat out of the ordinary ... I need to capture text off of printed pieces of stationery. Fonts, colors and background colors vary across the board. Ie. There could be a scripty, blue font on a green background.</p>
    <p>Does anyone know of ANY OCR software out there that would serve my purposes? </p>
    <p>Any help is much appreciated ...</p>
