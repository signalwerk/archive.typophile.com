    <p>Hello, I have just bought Linotype Didot and I was wondering if anyone had used it before and could give me their impression about how it works in terms of leading etc. I'd love to see examples of it in use too. I have not bought the ornaments yet because I have no idea how to use them!</p>
    <p>THanks in advance for your help</p>
    <p>PS. Anyone has the same problem as me with the font? The ligatures fl et fi are in the font but I cannot use them (all the letters seem wrongly labelled when I open it with Fontcreator - is that the reason?). In any case I don't think I should like to use them.</p>
