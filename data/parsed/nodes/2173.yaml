    html: <p>&gt;Hrant, there is some advice that’s appropriate here,  <br>&gt;such as to be wary of using mega-families that have  <br>&gt;both sans and serif fonts (a convenience for the  <br>&gt;foundry, but a recipe for blandness). <br><br>Nick, I respect what you’re saying, but surely you can’t think that all designers who tackle creating a matching set of fonts have designed in blandness? <br><br>The reason that I turned to the folks here is that the knowlege of what exists and is available is enormous. People have favorites (I know I’m quite fond of using 20th Century from Monotype), but I was hoping (and recieved) for a few new faces to search out and try. <br><br>So, after a bit of trial and error, I decided to go with Scala and Scala Sans, using the Shire Types for article titles and folios, and Dispatch and Stainless for subheads. The magazine is split between Lord of the Rings type articles and general news, so I wanted the humanist but slick design of Scala Sans for the general news, but the humanist serif of Scala for the LotR style stuﬀ. <br><br>But, this brings up another point, what is your favorite “strange” mix of fonts? Mine was using Rotis Semi-Serif and Agency. It worked quite well, I even used Rotis Serif Italic for all the italic (Semi-Serif doesn’t have proper&nbsp;italic).</p>
    html_clean: <p>&gt;Hrant, there is some advice that’s appropriate here,  <br>&gt;such as to be wary of using mega-families that have  <br>&gt;both sans and serif fonts (a convenience for the  <br>&gt;foundry, but a recipe for blandness). <br><br>Nick, I respect what you’re saying, but surely you can’t think that all designers who tackle creating a matching set of fonts have designed in blandness? <br><br>The reason that I turned to the folks here is that the knowlege of what exists and is available is enormous. People have favorites (I know I’m quite fond of using 20th Century from Monotype), but I was hoping (and recieved) for a few new faces to search out and try. <br><br>So, after a bit of trial and error, I decided to go with Scala and Scala Sans, using the Shire Types for article titles and folios, and Dispatch and Stainless for subheads. The magazine is split between Lord of the Rings type articles and general news, so I wanted the humanist but slick design of Scala Sans for the general news, but the humanist serif of Scala for the LotR style stuﬀ. <br><br>But, this brings up another point, what is your favorite “strange” mix of fonts? Mine was using Rotis Semi-Serif and Agency. It worked quite well, I even used Rotis Serif Italic for all the italic (Semi-Serif doesn’t have proper&nbsp;italic).</p>
