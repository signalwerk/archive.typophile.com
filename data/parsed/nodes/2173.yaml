    html: "<p>Tiﬀ — <br><br>There’s a something to that eﬀect in <i>Twentieth Century Type Designers</i>. Page 78: “He even made drawings and annotated trial proofs of some of the more outlandish variants of the Sans family, including the Kayo, or Ultra Bold, which he nicknamed Gill Sans Double-Elefans. He was a professional; and he also had a way of constructing elaborate arguments in favour of an expedient solution. Thus he convinced himself that if the trade demanded types for such ugly purposes as advertising, it ought to have ugly types.” <br><br>I’ve also heard the sentiment phrased exactly as Hrant put it, but I can’t put my ﬁnger on it in print. <br><br>Hope you feel better soon. (My wife has come down with a sudden, nasty virus and I’m hoping not to catch it; at least not until after I’ve met my deadlines.) <br><br>— K. <br></p>"
