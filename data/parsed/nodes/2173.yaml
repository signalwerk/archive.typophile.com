    html: <p>So the opinions of others don’t matter? Or is it that only “club members” have valid opinions… <br><br>Nick, making one’s own decisions is crucially important, but so is taking advice. Certainly there aren’t many Art Directors among us, so Sean should be especially cautious of taking things we say at face value, but people who spend a lot of time with fonts can certainly give decent insights. Nobody is born omniscient (in fact nobody ever becomes it either), it’s a matter of constant education, of <i>listening</i> with an open mind. <br><br>Choosing fonts is a lot more than just personal expression — there are cultural messages involved, not to mention readability. <br><br>hhp <br></p>
