  html: <p>So, I’m in the process of redesigning the magazine I work on, which used to be two magazines, but is now just one. Both magazines use a combination of sans serif and serif, mostly used to set sidebars and other info from the running text. So far, these are the faces I’ve looked at because of their huge set of weights. <br><br><span class="caps">FF</span> Scala <span class="amp">&amp;</span> Scala Sans (nice, but…) <br><span class="caps">FF</span> Zine Sans <span class="amp">&amp;</span> Serif (a little wonky) <br><span class="caps">FF</span> Page Sans <span class="amp">&amp;</span> Serif (very nice, but some weird weight shifting in the design) <br><br>Previously, one magazine used <span class="caps">FF</span> TheSans <span class="amp">&amp;</span> TheSerif while the other used Adobe’s Celestia Antiqua <span class="amp">&amp;</span> Scala Sans. I ﬁnd <span class="caps">FF</span> Thesis a pain in the butt to work with because of the way the weights are set up, bold jumps to small caps, and the way the fonts show up in menus makes it a pain for the editor to work with the text. My editors do most of the text formatting (and there’s a lot of it to be done), so <span class="caps">FF</span> Thesis is no longer really an option. <br><br>I’m looking for suggestions for humanist sans serifs with a matching serif. I need full families with small caps, etc. since I use all that stuﬀ fairly regularly. <br><br>Any&nbsp;thoughts?</p>
  html_clean: <p>So, I’m in the process of redesigning the magazine I work on, which used to be two magazines, but is now just one. Both magazines use a combination of sans serif and serif, mostly used to set sidebars and other info from the running text. So far, these are the faces I’ve looked at because of their huge set of weights. <br><br><span class="caps">FF</span> Scala <span class="amp">&amp;</span> Scala Sans (nice, but…) <br><span class="caps">FF</span> Zine Sans <span class="amp">&amp;</span> Serif (a little wonky) <br><span class="caps">FF</span> Page Sans <span class="amp">&amp;</span> Serif (very nice, but some weird weight shifting in the design) <br><br>Previously, one magazine used <span class="caps">FF</span> TheSans <span class="amp">&amp;</span> TheSerif while the other used Adobe’s Celestia Antiqua <span class="amp">&amp;</span> Scala Sans. I ﬁnd <span class="caps">FF</span> Thesis a pain in the butt to work with because of the way the weights are set up, bold jumps to small caps, and the way the fonts show up in menus makes it a pain for the editor to work with the text. My editors do most of the text formatting (and there’s a lot of it to be done), so <span class="caps">FF</span> Thesis is no longer really an option. <br><br>I’m looking for suggestions for humanist sans serifs with a matching serif. I need full families with small caps, etc. since I use all that stuﬀ fairly regularly. <br><br>Any&nbsp;thoughts?</p>
