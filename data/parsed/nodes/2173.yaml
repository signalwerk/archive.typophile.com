    html: <p>Sean, I wouldn’t take suggestions for matching your sans and serif faces. As an art director with any sense of style, that’s probably the key creative decision you will make, as the relationship deﬁnes the personality of the magazine. You should determine it yourself, based on the way you will use the faces together. And the more unusual and personal a pairing you can make, the more distinctive the personality of your&nbsp;magazine.</p>
