  html: |-
    <p>So, I'm in the process of redesigning the magazine I work on, which used to be two magazines, but is now just one. Both magazines use a combination of sans serif and serif, mostly used to set sidebars and other info from the running text. So far, these are the faces I've looked at because of their huge set of weights. <br> <br>FF Scala &amp; Scala Sans (nice, but...) <br>FF Zine Sans &amp; Serif (a little wonky) <br>FF Page Sans &amp; Serif (very nice, but some weird weight shifting in the design) <br> <br>Previously, one magazine used FF TheSans &amp; TheSerif while the other used Adobe's Celestia Antiqua &amp; Scala Sans. I find FF Thesis a pain in the butt to work with because of the way the weights are set up, bold jumps to small caps, and the way the fonts show up in menus makes it a pain for the editor to work with the text. My editors do most of the text formatting (and there's a lot of it to be done), so FF Thesis is no longer really an option. <br> <br>I'm looking for suggestions for humanist sans serifs with a matching serif. I need full families with small caps, etc. since I use all that stuff fairly regularly. <br> <br>Any thoughts?</p>
