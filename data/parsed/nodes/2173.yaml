      <p>Years later, but for the record, another voice on the question of Gill's involvement in Gill Sans Ultra Bold: Albert Sperisen defended Gill from the criticism in Robert Harling's <em>Letter Forms and Type Designs of Eric Gill</em> like this:</p>
      <p><cite>… Again, without proper checking, Harling gets a bit rough when he speaks of Gill’s “peccadilloes” in his “horrendous and blackguardly… display exploitations” of Gill Sans, the fat version known as Gill Sans Ultra Bold. The less said about this unfortunate version the better, but the fact remains that this “adaptation” was made by an apprentice under Gill’s supervision, a practice for all things made in the Gill workshop. (The source for this latter statement is a recent interview with one of Gill’s apprentices.) Gill accepted this commission from the Monotype works under duress. He put off doing anything about it for too long, until repeated demands produced what Gill labeled </cite>Sans-Elefans<cite>, a tongue-in-cheek title for a publicity letter in which Gill had no interest. This crass commercialism on the part of Monotype was no different from that of other type foundries when they “created” from overly popular typefaces, and almost all of those variations were the product of foundry “art departments.” Too, if the criticism of Gill is valid, it must be remembered that Stanley Morison was in charge at Monotype!<br></cite></p>
