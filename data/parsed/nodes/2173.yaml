    html: '<p>&gt;but surely you can’t think that all designers who tackle creating a matching set of fonts have designed in blandness? <br><br>No, some make a point of constructing the sans and serif quite diﬀerently, eg Fedra. However, there are also quite a few where the serif is just the sans with serifs pasted on. Also, if the point of having sans and serif is to provide contrast in a layout, using a mega family that provides both reduces that eﬀect. <br><br>Having said that, I once designed a publication using Gill Sans and Gill Serif (aka Perpetua), and it worked out nicely: Perpetua Titling and the condensed Sans were very useful, and the over-the-top Gill Sans Ultra Bold, surrounded by total Gillosity, wasn’t too bizarre at all. <br><br><span class="caps">BTW</span>, who did design Gill Sans Ultra Bold, surely not Eric…? <br><br>&gt;what is your favorite “strange” mix of fonts? <br><br>I used Meta for Heads and sidebars, and Paradigm for main text, when I redesigned Cycle Canada in 1996. It’s a motorcycle mag, so to accomodate the vibe of both hyper modern Japanese rocket bikes and retro-styled <span class="caps">US</span> hogs, I ﬁgured that would be <span class="caps">OK</span>. </p>'
