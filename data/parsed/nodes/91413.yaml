  html: |-
    <p>Anyone know how the vertical metrics in a font work in a SVG file? I am reworking a couple of fonts. They gave me SVG files for testing them The font in question is a script and its descenders and ascenders were protruding the text box too far. I changed the extremes in the font, rescaled it, and also changed the vertical metrics from default settings to something that better matched the parameters of the new version of the font. Everything still adds up to 1000 units, but the descender/ascender lines are lowered.</p>
    <p>When I loaded the new version the scale was fine, but the baseline reflected standard proportions as before so the whole font appears lower than it should. It has occurred to me that the text box is still clinging to the setting the SVG was composed of. If that's the case it may not be an issue. But if all SVG files have that same baseline ratio I may have to shift all the glyphs up.</p>
