    <p>Hi everyone:</p>
    <p><a class="freelinking-external" href="https://web.archive.org/web/20081012141147/http://farm3.static.flickr.com/2136/2265525214_e72eaf7640_o.jpg">Three logo concepts</a></p>
    <p>I’m working on logo concepts for a financial institution. The logo is for a forum /program  hosted by this bank<br>
    that is focused on financial wealth management for 20-30 year olds. These are high net worth individuals,</p>
    <p>The client requested that the logo look “current” and “cutting edge” and that it have some appeal to this age bracket. That said, this is a very conservative banking institution . such a request has to be taken in context.</p>
    <p>Concept A is about taking MICR characters out of context. These are transit and routing symbols found on checks. I thought it might be interesting to take these symbols— which are very old school banking, and give them a new spin.</p>
    <p>Concept B is supposed to be a visual metaphor for next generation, i.e., the budding of young from parent.</p>
    <p>Concept C is supposed to be pretty abstract, and refers somewhat  obliquely to  building  blocks, at the same time the pattern of blocks connect  an “N”, or an “X”, or a right-pointing arrowhead</p>
    <p>Any feedback would be greatly appreciated. This, as all projects seems to have a deadline of yesterday.</p>
