    html: <p>I’m not wild for the checkerboard. It reminds me of the Purina logo, not building blocks. I preferred the lower version of A. The rectangles looked like computer keys to me rather than MICR characters (especially with the * in one) Which works for that generation especially in the glowing Mac blue. If you do decide to stick with the checkerboard play more with the type, even try angeling the baseline to parallel the base of the squares. Right now the negative space wedge is uninspired. Good suggestion by James not to break next generation, that was really distracting on your original post.</p>
