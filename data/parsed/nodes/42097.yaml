      <p>I don’t get the MICR feeling from A at all, and it looks too web 2.0. You could make it work by using MICR type and losing the lighting gimmick—which makes little sense when working with a concept rooted in two-dimensions—but the generation you want does not use checks often enough—if ever—to get it.</p>
      <p>B is too abstract, and the text treatment is too complicated and distracting to work as a logo.</p>
      <p>C could work, but the mark needs tweaking. Dropping the rightmost block will make the wall  concept more obvious, and the perspective needs to be toned down, right now it appears to be curving the mark.</p>
      <p>I also think that you should not be breaking up “Next Generation” typographically. It makes little sense from a grammatic perspective, and visually it looks overwrought.</p>
