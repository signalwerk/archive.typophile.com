      <p>Hrant(re. resolution): <em>[132dpi is] at the very low end. Is Apple supposed to be low-end? Many HTC phones are 250 dpi. Same with the Sony P mini-netbook. When it comes to browsing and reading (anything besides looking at purdy pitcherz) that makes all the difference.</em></p>
      <p>Hrant, don't forget to factor in screen size when talking comparatively about resolution. Higher resolution screens have increased incidence of manufacturing faults (dead pixels), and hence attrition in terms of the number of screens rejected in quality assurance. This attrition rate is acceptable in the manufacture of screens for small devices such as phones, but as screen size increases not only are the per unit manufacturing costs higher but the number of potentially dead pixels also increases. The attrition rate becomes unacceptable. For its size, the iPad 132dpi screen resolution cab be considered relatively high.</p>
