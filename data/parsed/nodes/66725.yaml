    html: |-
      <p>EPUB can contain embedded fonts, basically using the @font-face rule in the CSS and packing them up in the assets. But most e-reader software that I’ve looked at ignores any embedded fonts. </p>
      <p>I haven’t done exhaustive research, but Adobe’s Digital Editions is the only one I’ve encountered that supports @font-face and utilizes the embedded fonts. But I don’t think it’s available on any mobile or e-reader platforms.</p>
      <p>Setting aside the licensing etc. issues of @font-face, my question is whether the Apple iPad e-book software will support @font-face embedded fonts, or is only selectable among system-installed fonts. I suspect the latter, unfortunately. And it will probably be a closed system typographically, like the iPhone and iPod.</p>
      <p>If by some chance it does support @font-face, then the next question will be whether it supports WOFF. Again, I suspect it doesn’t.</p>
