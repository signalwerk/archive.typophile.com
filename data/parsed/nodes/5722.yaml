    html: <p>Thank you to all of you. <br>I do enjoy Typophile. <br>I leave you a text I like. <br>Sincerely, <br>AS <br> <br> <br>Seeing yourself <br> <br>'When you look at your companions, try to see yourself' <br>said the Japanese teacher Okakura Kakuso. <br> <br>'But isn't that an awfully selfish attitude?' asked a disciple. <br>'If we are always concerned about ourselves, <br>we will never see the good things that others have to offer.' <br> <br>'If only we did always see the good things in others,' <br>replied Kakuso. 'But the truth is that when we look at <br>another person, we are only looking for defects. <br>We try to discover his wicked side because we want him <br>to be worse than us. We never forgive him when he hurts <br>us because we do not believe that we would ever be <br>forgiven. We manage to wound him with harsh words, <br>declaring that we are telling the truth, when all we are <br>doing is trying to hide it from ourselves. <br>We pretend that we are important so that no one else <br>will see how fragile we are. That is why whenever you <br>judge your brother, be aware that you are the one <br>who is on trial.' <br> <br></p>
