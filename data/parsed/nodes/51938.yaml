      <p>This is a beautiful book &amp; a welcome addition to the typo reference sector. What I would like to see is a sister edition set in a readable blackletter such as Final Fraktur. Typographers like Dan Reynolds and myself do what we can to promote a revival of blackletters as an alternative to the dictatorship of the Western roman alphabet.</p>
      <p>j a m e s</p>
