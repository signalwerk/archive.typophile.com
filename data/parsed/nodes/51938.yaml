      <p>@David Hamuel: <em>Why “at Frankfurt” and not “in Frankfurt”? — don’t we use “in” for the names of states, counties, towns, continents, countries; and “at” for specific place e.g. “at Frankfurt Airport”</em></p>
      <p>American English uses "in Frankfurt". Classical and contemporary British English speakers like myself use "at Frankfurt" in a bid to keep the culture of classical antiquity alive.</p>
      <p>j a m e s</p>
