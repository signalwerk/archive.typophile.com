    <p>My book "The Typographic Desk Reference" is nearing completion and should be available within the next few months. Typophile helped me in my research along the way and a few of you are mentioned in the book's acknowledgements.</p>
    <p>Here's the promotional website:</p>
    <p><a href="http://typedeskref.com" title="http://typedeskref.com">http://typedeskref.com</a></p>
    <p>Thanks for being here Typophiles,</p>
    <p>Theo</p>
