    html: |-
      <p>Indeed, hand comps were inserting wide spacing after periods long before typewriters came into general use. At least that was the practice in the USA, and I think in Britain. I'm not sure what the overall history of the practice is. I looked at three books this morning from different times &amp; places.</p>
      <p>A small volume of Horace printed by Ambroise Firmin Didot in Paris in 1855 shows no extra space after the periods. (It does show space added fore and aft of some punctuation, which has been discussed in a different thread here.)</p>
      <p>"Sylvie," by Nerval, printed by William Bird Mosher in Portland, Maine in 1896 has spaces after periods into which one could park a Hummer. &amp; generally crappy typesetting.</p>
      <p>"ABCs of Book Collecting," London, 1952 has spaces less wide than the Nerval, but greater than the justifying spaces in its lines.</p>
      <p>**************<br>
      Seeing the revival of Law Italic was a pleasant surprise; thanks, Hrant. This does make me believe Everything That Has Been Shall Be Again. I am constantly surprised, for instance, by the re-issue of obscure jazz LPs originally on small labels from 45 or so years ago. Thus it appears to be with typefaces also.</p>
      <p>powers</p>
