      <p>To my eye, what you see as "kerning idiosyncracies" in Monotype Scotch Roman is really just lousy letterfitting. &amp; the "weighty uppercase" just throws spots of discordant color into your line. This was true in the metal face and only got worse in subsequent versions.</p>
      <p>You are on the right track to think of Scotch, and I'll let you get away with MT Scotch for this quasi-broadside, but if you do a book-length project and want to use Scotch, for heaven's sake, use a decent version of it. Miller is the only choice whenever I need to use Scotch Roman. Check that out. But use that alternate R.</p>
      <p>powers</p>
