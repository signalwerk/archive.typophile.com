    html: <p>All the nineteenth-century archaeology books (either original or facsmile reprint) that I have are set in moderns of one sort or another, the Anglophone ones being generally more or less Scotch in appearance and the Italian ones more Bodoni-ish. In the late nineteenth century US, in the heyday of cultural evolutionism, you get faces that look very much like Monotype Modern Extended (some sort of Linotype equivalent, I suppose?), and then around the turn of the century some Century-ish faces also.</p>
