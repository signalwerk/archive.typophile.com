    html: <p>The apocryphal story goes that slab serifs are called Egyptian/Egyptienne because dispatches from Napoleon's expeditions into Egypt were set using them (the dates don't quite align right?), or else some sort of book published later on the subject used them. If anyone less hazy on the subject than me can substantiate this, it would be an interesting connection to explore. Things don't get much more colonial than Napoleon in Egypt, and it was also when the Rosetta stone was found, if I'm not mistaken.</p>
