    html: <p>Thanks for all of the different (and intriguing) perspectives, there's much to consider. At the moment, MTScotchRoman seems to suit the content of the project perfectly (a rejoinder to anthropological discourse, almost a broadside, rather than an academic monograph or formal treatise on the subject). I'm drawn to Modern Extended (and Condensed as well!) but simply adore the weighty uppercase and kerning idiosyncracies of MTScotchRoman. The alternative approach would be to use a thoroughly contemporary font (it's an essay on postcolonialism, after all), but I'll work with ScotchRoman for now, see what comes to fruition. Thanks everybody for your respective two cents' worth - which has already proven invaluable!</p>
    html_clean: <p>Thanks for all of the different (and intriguing) perspectives, there's much to consider. At the moment, MTScotchRoman seems to suit the content of the project perfectly (a rejoinder to anthropological discourse, almost a broadside, rather than an academic monograph or formal treatise on the subject). I'm drawn to Modern Extended (and Condensed as well!) but simply adore the weighty uppercase and kerning idiosyncracies of MTScotchRoman. The alternative approach would be to use a thoroughly contemporary font (it's an essay on postcolonialism, after all), but I'll work with ScotchRoman for now, see what comes to fruition. Thanks everybody for your respective two cents' worth - which has already proven invaluable!</p>
