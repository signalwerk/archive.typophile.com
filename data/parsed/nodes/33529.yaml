    <p>Thinking about the colonial past - specifically, the scientific discourse of the nineteenth century, especially evolutionary anthropology, archaeology and the like - would anyone care to recommend a typeface that would simulate (or indeed, parody) the objectivist discourse of the period? </p>
    <p>My thoughts turned immediately to Didot, Bodoni, etc. (given the modernism-cum-romanticism of many anthropologists) but I then wondered if there was a more distinctively 'scientific' (authoritative, objective) face in use throughout the 19th century? </p>
    <p>Any suggestions would be appreciated. Thanks.</p>
