    html: |-
      <p>Thanks for everyone's advice. Seriously needed and helpful.</p>
      <p>I think I will go ahead and keep the accented small caps for this font family since the upright ones are done anyway. I spent about a week writing/altering various scripts to make them so finishing the italic won't be that much more work. </p>
      <p>Since getting rich and famous from type design is never going to be an option I'm not concerned about the market. This may be the only font I do this for though. I'm spending a lot of time updating my existing fonts to otf (almost all production work). Feels like I'm living in the past and I'm dying to design some new things.</p>
      <p>The biggest problem I have now is writing the feature code and in looking at other faces (most notably Hypatia Sans) not having accented small caps doesn't seem to make that much easier. In any case I will be back with more questions as this matures.</p>
