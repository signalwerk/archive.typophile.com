    html: <p>Keep them. They're a valid option, especially for anyone dealing with Byzantine uncial text transcription. With regard to the adscript iota, there is precedence in <a href="http://tiro.com/John/apollonius.gif" rel="nofollow">renaissance typography</a> for a form slightly shorter than the smallcap height (in the image, see the second word of the uncial text).</p>
