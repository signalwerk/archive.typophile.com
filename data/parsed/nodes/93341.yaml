      <p>Thanks for your input Nick.<br>
      I guess I passed "overboard" a while back since the accented small caps are already designed in the various weights for 'smcp' and 'c2sc', though not yet the italic. It wasn't that hard to create them and I did decide to do accented small caps after looking at Arno Pro. My biggest concern is writing the feature code correctly. I will have to think about taking them out since I'm so far along. I admit I do tend to overdo projects and then go for the easier solution. Hate to toss them out though.</p>
