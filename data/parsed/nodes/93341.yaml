      <p>IMO, accented Greek small caps are “overboard”.<br>
      And it follows from that, that the “cap with small cap” (titlecase) version of these characters would also be unnecessary.<br>
      Save yourself a lot of work, omit accented small caps!<br>
      AFAIK, only Slimbach has created such.<br>
      But perhaps John Hudson has had a go at it.<br>
      This was discussed at Typophile, but at the moment it’s impossible to ﬁnd the thread, due to search engine problems.</p>
