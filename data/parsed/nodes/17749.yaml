    html: <p>That’s <a href="http://www.t26.com/fonts/browsebydesigner2.php?u_id=622">Stephen Farrell</a>’s <a href="http://www.t26.com/fonts/display.php?f_id=713">Missive</a>, one of the original hybrid faces that made everyone notice <a href="wiki/Carlos Segura" class="wiki-create">Carlos Segura</a>’s <a href="http://www.t26.com/fonts.php">T-26</a> when it emerged on the type market in the early nineties, the heydays of <a href="wiki/grunge" class="wiki-create">grunge</a> typography.</p>
    html_clean: <p>That’s <a href="http://www.t26.com/fonts/browsebydesigner2.php?u_id=622">Stephen Farrell</a>’s <a href="http://www.t26.com/fonts/display.php?f_id=713">Missive</a>, one of the original hybrid faces that made everyone notice <a href="wiki/Carlos Segura" class="wiki-create">Carlos Segura</a>’s <a href="http://www.t26.com/fonts.php">T-26</a> when it emerged on the type market in the early nineties, the heydays of <a href="wiki/grunge" class="wiki-create">grunge</a> typography.</p>
  - id: 107505
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>It’s funny how Stephen made Missive — a mash-up of what looks like Sabon and News Gothic — evolve into <a href="http://www.t26.com/fonts/display.php?f_id=710">Entropy</a> by welding the Missive caps with Stymie, and then eventually end up with <a href="http://www.t26.com/fonts/display.php?f_id=714">Osprey</a> by smashing it all into Park Avenue.</p>
