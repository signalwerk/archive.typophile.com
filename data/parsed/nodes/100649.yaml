      <p>I think you're discouraging Rodrigo from ever posting again. For one thing thinking that he was asking for a design critique doesn't cast Typophile in a great light... Neither does making it sound too officious; call me crazy but I don't think most members are really seeing this place as some sort of job fair...</p>
      <p>Concerning the effect of using a real name as a screen name (or really, even just in the profile) I would bet real money that a statistical analysis would only reveal a statistically insignificant effect. I'm talking specifically about the ID section, mind you. You could also ask Ryuk, Dick and the other ID experts if they mind the lack of real names. If they don't say anything here/now, it's probably simply because it has nothing to do with IDing a particular font. Not everybody likes discourse, which is totally OK, as long as they don't mind others doing it:<br>
      <a href="http://typophile.com/node/99822#comment-543380" title="http://typophile.com/node/99822#comment-543380">http://typophile.com/node/99822#comment-543380</a></p>
      <p>The reason I don't remember people pressuring you to use your real name in your screen name is probably because it was pointless of them. And the people who disagreed with them probably just stayed quiet. BTW, I'm guessing that incident was not in the ID section... I hope you realize how different the ID section is compared to the rest of Typophile (which is normal).</p>
      <p>Also, compactness is not at all moot, when you consider that people type each other's screen names when addressing them. BTW a signature can also be useful in that respect, because it's more visible than the screen name (especially at the end of reading a post) and is often shorter (like "hhp").</p>
      <p>BTW, I assume you're going to send a message to gio181? Or is the plan to only go after people who are already not having any luck here?</p>
      <blockquote><p>my initial response was motivated to protect Rodrigo from your wrath.</p></blockquote>
      <p>That's an offensive -and confused- thing to say.</p>
      <p>I have never minded people asking for an ID - it's an entirely acceptable thing to do; and bumping a thread is totally OK as well - I don't think it's helpful to get on Rodrigo's case for that. In fact I (along with people like Stephen and Yves, who have now withdrawn 99% - ask yourself why) used to help ID fonts in the past, in fact much faster* and without acting as a proxy human robot to some canned IDing software. I've even said Typophile <em>should</em> have an ID board (to avoid IDs being posted in incorrect areas). The thing I mind -and I am not alone, I simply haven't given up on you yet- is the anti-designer attitude among a tiny minority of people who provide IDs (and I've even stopped confronting them). Fix <em>that</em> instead of fussing over cosmetic tweaks and you'll be helping Typophile for real.</p>
      <p>* <a href="http://www.typophile.com/node/14480" title="http://www.typophile.com/node/14480">http://www.typophile.com/node/14480</a><br>
      <a href="http://www.typophile.com/node/10588" title="http://www.typophile.com/node/10588">http://www.typophile.com/node/10588</a></p>
      <p>There is a disturbing lack of observation skills here.</p>
      <p>hhp</p>
