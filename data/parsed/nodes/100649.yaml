      <p>Hi Rodrigo, Welcome to Typophile. It has been my experience that you get more feedback if you use your real name as your screen name. It used to be somewhat of a convention.</p>
      <p>Also, good design is based upon informed decisions. Not shooting from the hip. Just think of the phrase "to do something by design, as opposed to by accident.” To help the group, can you tell us a bit about the context? Goals? Audience &amp;c? Without this, people will only be able to provide you with subjective aesthetic feedback.</p>
      <p>(and you might want to avoid bumping posts in the future)</p>
