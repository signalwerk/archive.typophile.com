      <p>@hrant: I speak from experience. A real name as a screen name did make a significant difference. I was asked to do so by older members, and say the same conversation on numerous occasions. From moderators. You were there, I’m surprised you don’t remember. The logic — to my understanding — behind using a real name as a screen name was essentially to make you look a little more professional, grown-up, less goofy, pick a word. Imagine walking into a room full of strangers and introducing yourself by your nickname “Skippy” when your real name is Thomas. A first impression thing.</p>
      <p>As far as compact goes, that’s moot. It does not appear in the body of the thread.</p>
      <p>For “more pressing ways to raise standards around here” please do email your suggestions to the appropriate persons. I’d be more than happy to put them on my list. We’re always looking for feedback on how to make Typophile a better place. From new and old members alike.</p>
      <p>And we all know how you feel about the ID board. I shudder to think how you’d react if the majority of people started bumping posts that didn’t get responses. If anything, my initial response was motivated to protect Rodrigo from your wrath. I stand (ironically) corrected!</p>
      <p>Long/short, just some advice. I meant no ill will. Carry on.</p>
