      <p>Chris, the guy is just looking for an ID. And do you really think the people who ID fonts here are avoiding him because he only shows his real name in his profile and not his screen name (which BTW was never a convention as far as I've seen)? Some people don't even use their real/full name anywhere and they get plenty of help:<br>
      <a href="http://typophile.com/node/100691" title="http://typophile.com/node/100691">http://typophile.com/node/100691</a><br>
      <a href="http://typophile.com/node/100685" title="http://typophile.com/node/100685">http://typophile.com/node/100685</a><br>
      <a href="http://typophile.com/node/100663" title="http://typophile.com/node/100663">http://typophile.com/node/100663</a> ("gio181", "john smith", really?!)</p>
      <p>Using a real name in the full profile is a great idea, but to me -and I think most people- the screen name is supposed to be more compact, and an opportunity for personal expression. I think there are more pressing ways to raise standards around here.</p>
      <p>Rodrigo, you're not doing anything wrong, don't worry. When people don't know what font it is (and this actually doesn't even look like it might be a font) they don't say "I don't know". Sometimes nothing comes up - don't be too discouraged.</p>
      <p>hhp</p>
