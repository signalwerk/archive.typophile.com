      <p>I don’t see an enormous benefit in metrically compatible designs with different names. For starters, why did Frutiger give them different names, if the one is a small version of another? I also don’t see the benefit of identical metrics and kerning between display fonts and text fonts. I’m sure Uli has an ideologically pure rationale for this, but the fact is that display spacing and kerning is not at all appropriate for small sizes. Unless thre are major differences between Serifa and Glypha shapes and spacing (and I don’t see that), I would hardly expect perfection in small text setting, even from Frutiger. In other words, it’s an interesting trick given the technology of the time, but currently less beneficial to readers than size-specific designs. </p>
      <p>Metric compatibility is overrated. It has specific uses, but for very specific uses, we have specialized typefaces like the agates H+F-J did for the Wall Street Journal.</p>
      <p>Mike, if you are in the market for a larger family of type, then there’s no reason to fixate on Serifa (or Glypha). See the thread:</p>
      <p><a href="http://www.typophile.com/node/40004" title="http://www.typophile.com/node/40004">http://www.typophile.com/node/40004</a></p>
