      <p>&gt; I don’t see an enormous benefit in metrically compatible designs </p>
      <p>I think the decisive question here is quite another question:</p>
      <p>Given that Adrian Frutiger himself designed Glypha as a metrically identical companion to Serifa, is Adobe allowed to mutilate the original metrics of Glypha?</p>
      <p>There is no doubt that Adobe’s Glypha digitizations GlyphaLTStd.otf, GlyphaLTStd-Black.otf etc. are mutilated reproductions of Frutiger’s original Glypha fonts.</p>
      <p>If you check the metrics of Adobe’s digitization of Glypha, you will find numerous wrong metrics (as compared with the original Glypha).</p>
      <p>What is more, you will discover that Adobe also “forgot” to defined the side bearings of several glyphs.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/glypha3.gif" title="http://www.sanskritweb.net/temporary/glypha3.gif">http://www.sanskritweb.net/temporary/glypha3.gif</a></p>
      <p>So, the decisive question here is not whether there is “an enormous benefit” by Frutiger’s metrically companion to Serifa, but the crucial question is whether Adobe was allowed to mutilate the metrics of Frutiger’s Glypha.</p>
      <p>By the way, Adobe also did shoddy hinting here. For example, if you start Adobe’s FDK autohint on GlyphaLTStd.otf, you will get this message:</p>
      <p>’Error: font has neither StemSnapH nor StdHW!’</p>
      <p>Adobe “forgot” to define these values required for proper hinting.</p>
