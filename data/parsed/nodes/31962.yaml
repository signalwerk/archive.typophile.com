      <p>Just for testing purposes, I back-converted the wrong metrics of Adobe’s Glypha to the original values with the consequence that texts typeset in Serifa and Glypha are again entirely interchangeable. As originally intended by Adrian Frutiger, this is a great advantage especially in very small print, and if Adobe were interested in originality, they would convert Glypha’s metrics back to its original values.</p>
      <p>For comparison see <a href="http://www.sanskritweb.net/temporary/glypha2.pdf" title="http://www.sanskritweb.net/temporary/glypha2.pdf">http://www.sanskritweb.net/temporary/glypha2.pdf</a></p>
