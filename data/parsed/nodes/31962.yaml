      <p>LOOOOVE this topic :-) I am a huge Serifa and Glypha fan. They are both by Frutiger and both match up with Univers. Glypha has a larger x-height and sets better for extended text passages (IMO).</p>
      <p>Glypha and Serifa Blacks, with manual kerning and tighter tracking, makes for an EXCELLENT titling font. Scangraphics has a “headline” (SH) version of Serifa that accomplishes the same purpose. I have no problem using either Glypha or Serifa (in various weights) as the EXCLUSIVE typeface for a project, with the caveat that documents usually benefit from more leading, and white space in general, than your typical sans/serif typeface combo.</p>
      <p>I will admit to being a Clarendon man, and I get giddy over FB Giza for display purposes. But good-old Glypha and Serifa are the everyday slab champs, they are part of my core design fonts.</p>
      <p>I cringe when someone chooses Rockwell over these two. Seriously, it gives me the creeps.</p>
