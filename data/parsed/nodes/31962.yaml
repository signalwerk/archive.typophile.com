    <p>Hey Everyone,</p>
    <p>I have a new project I’m starting (school related) and it’s to be set in Serifa.</p>
    <p>Does anyone have some image and/or links to some project that were done in Serifa - I’m looking for everything really new or old.</p>
    <p>Of course any great links/information related to Serifa would be greatly appreciated, along with the correct pronunciation of it... :)</p>
    <p>Thanks,<br>
    Mike</p>
    <p><strong>*** EDIT ***</strong></p>
    <p>I should add that I have already looked over the Wiki information on Adrian Frutiger, and printed out the Glyph Charts from Adobe (as of right now I only have Serifa Std from Adobe).  Does anyone know of a better version of Serifa (maybe with more weights &amp; glyphs) than what Adobe offers?</p>
    <p>Thanks again,<br>
    Mike</p>
