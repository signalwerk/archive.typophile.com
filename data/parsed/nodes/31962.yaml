      <p>Rumour has it that every graphic designer craves for a new bedmate on every Friday evening and craves for a new typeface on every Monday morning.</p>
      <p>I am different: I am the one-type-per-life type.</p>
      <p>Although I have studied more than 50,000 fonts, I usually only use one font, namely Serifa, which is (in my view) the best slab serif typeface ever made.</p>
      <p>Most PDF documents at my website (<a href="http://www.sanskritweb.net" title="http://www.sanskritweb.net">http://www.sanskritweb.net</a>) are typeset in Serifa, and e.g. my printed textbook of the Sanskrit language is also typeset in Serifa (as far as the Latin script text is concerned):</p>
      <p>see <a href="http://www.sanskritweb.net/deutsch/leseprobe.pdf" title="http://www.sanskritweb.net/deutsch/leseprobe.pdf">http://www.sanskritweb.net/deutsch/leseprobe.pdf</a></p>
      <p>I have examined various Serifa font versions by Berthold, Compugraphic, URW etc. etc., but I always use the first PostScript version made by Adobe in the late 1980s, and here I only use two cuts, namely Serifa 55 (Serifa normal) and Serifa 75 (Serifa black). I never use the other cuts (Serifa Italic etc.).</p>
      <p>The Adobe Serifa PS font features the original set-width system of the original photocomposition Serifa based on the original Monotype set-width system:</p>
      <p>see <a href="http://www.sanskritweb.net/fontdocs/dickten.pdf" title="http://www.sanskritweb.net/fontdocs/dickten.pdf">http://www.sanskritweb.net/fontdocs/dickten.pdf</a></p>
      <p>(This is an instructive tutorial on set-widths for schools)</p>
      <p>As stated by Frutiger in his book “Buch der Schriften”, Wiesbaden 2005, page 218-222, all cuts of Serifa were planned and designed entirely simultaneously. That is why Serifa is a perfect slab serif font. The principles of design applied to Serifa are described on page 219 in Frutiger’s book just mentioned.</p>
      <p>PS: In the Adobe OpenType Serifa, the left outward curve of the Euro sign between the two cross bars is faulty. I guess, Frutiger never saw and never approved of the Euro sign of the Adobe OT font version.</p>
