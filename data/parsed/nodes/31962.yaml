      <p>Now before you go off and start attacking Adobe for something like “mutilating” someone’s typeface, you might want to find out who exactly did the original outlines. Was it an Adobe digitization of the original photofilm outlines, or did someone else do it? Adobe only licenses the typeface, so shouldn’t the real owners be held responsible for making sure the metrics add up properly?</p>
      <p>I can see that Uli might have a point about the metrics not fitting up as an answer to Crossgrove’s point. Because they DON’T fit now, we’ll never really get a chance to see the benefit, dubious it may be, of a matching Serifa/Glypha set.</p>
