      <p>Adrian Frutiger designed Glypha as a metrically identical companion to Serifa so that you could switch from Serifa to Glypha in small point sizes (5, 6, 7, 8 point etc.) <strong>without reflow</strong> of the typeset text. However someone at Adobe tampered with the Glypha metrics with the consequence that Glypha is now only 98%, but no longer 100% identical with Serifa as regards metrics. In short paragraphs of text, reflow may not take place,</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/glypha.pdf" title="http://www.sanskritweb.net/temporary/glypha.pdf">http://www.sanskritweb.net/temporary/glypha.pdf</a>, page 1</p>
      <p>but in longer text passages, reflow is unavoidable due to stupid metrics tampering done at Adobe. For example, the Glypha-i is now <strong>wider</strong> than the Glypha-j (296 vs. 278 units), while in Frutiger’s original fonts, both Serifa-i/j and Glypha-i/j had been metrically identical.</p>
      <p>see <a href="http://www.sanskritweb.net/temporary/glypha.pdf" title="http://www.sanskritweb.net/temporary/glypha.pdf">http://www.sanskritweb.net/temporary/glypha.pdf</a>, page 2</p>
      <p>Tampering is particularly conspicuous concerning punctuation marks (e.g. =, &gt;, &lt;, \, ~, |, etc.)</p>
    html_clean: |-
