      <p>The problem is, even if you think you’ve seen it before (I think I’ve seen it), there are soooo many hand-fonts from soooo many sources on the internet now, that it is daunting to even think about looking for it.</p>
      <p>Here’s a bunch:<br>
      <a href="http://www.fontgarden.com/gallery/a.html" title="http://www.fontgarden.com/gallery/a.html">http://www.fontgarden.com/gallery/a.html</a></p>
      <p>Here’s some more:<br>
      <a href="http://www.kevinandamanda.com/scrapbook/fonts/fontsforpeas/" title="http://www.kevinandamanda.com/scrapbook/fonts/fontsforpeas/">http://www.kevinandamanda.com/scrapbook/fonts/fontsforpeas/</a></p>
      <p>And that doesn’t even scratch the surface. It is almost a national pastime to have your handwriting made into a font. I even did it once at a <strong><a class="freelinking-external" href="http://www.fontifier.com/">website that does it automatically</a></strong>:</p>
      <p></p><div class="imageWrap"><img src="/files/fphand_3579.jpg"></div><p></p>
