    <p>Hi,</p>
    <p>Has anyone seen this commercial. They are using an handwritten typeface in this commercial that is kinda similar to the emtype logo which was made by Eduardo Manso himself and is not a typeface and which is again kinda similar to the Bello Pro by Underware, but definitely different) =)</p>
    <p>I'd like to know the name of that typeface and where to get it. Nobody at Côte D'Or could tell me. =)</p>
    <p>Thank you very much!!</p>
    <p>regards,<br>
    dav.</p>
