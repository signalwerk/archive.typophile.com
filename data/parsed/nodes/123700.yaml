      <p>Metric kerning relies on a typeface’s internal metric data, as determined by the typeface designer, to space letters. Optical kerning adjusts spacing based on general letter shapes. Here’s a good discussion of the two with examples, plus links to references:<br>
      <a href="http://type-ed.com/2013/12/08/metrics-vs-optical/" title="http://type-ed.com/2013/12/08/metrics-vs-optical/">http://type-ed.com/2013/12/08/metrics-vs-optical/</a></p>
      <p>Also, I found Jan Tschichold’s <cite>Treasury of Alphabets and Lettering</cite> (1932) to be a useful resource for  understanding how kerning should work; his examples of uppercase and lowercase kerning are fairly straightforward. The basic principles still apply to digital type.</p>
