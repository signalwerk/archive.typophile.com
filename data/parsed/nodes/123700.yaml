    <p>Hello friends, I hope you can help me with this issue I this dizzy ...</p>
    <p>Topic: "KERNING"<br>
    Clarification: I do not mean to large text or entire paragraphs, I mean words of 3 to 10 characters maximum (eg logo)</p>
    <p>I try to find a professional technique or a good technique to help me put a good KERNING.</p>
    <p>I know there is KERNING button on Ps and Ai, but for what I need I think it would be more correct and professional do otherwise.</p>
    <p>I know pages as Myfonts and FontShop among many others, and I realized that in these pages is has a default KERNING system that apparently is very well placed on purpose.</p>
    <p>For example when writing the word YELLOW in Ai and place the button OPTIC KERNING the result is very different from writing the word YELLOW at MyFonts, the KERNING is very different this much better placed in Myfonts.</p>
    <p>The problem is that not all sources are in Myfonts or those familiar pages.</p>
    <p>Can anyone help me with a technique or method to place an excellent KERNING? (read second paragraph please)</p>
    <p>I would appreciate infinitely.</p>
