    <p>Hello Everyone,</p>
    <p>I'm posting this with the kind permission of one of the mods (Thank again Dan!)</p>
    <p>I'm an avid ambigram designer, and have been the content editor &amp; writer for Ambigram.com for approximately 4 years now. Recently I've started working on a book called Ambigrams Revealed, which has been accepted by PeachPit Press &amp; will be published in March 2013. The book will be an international collection of ambigrams, case studies, tutorials and other content, along with a phenomenal judging panel which consists of three well known ambigram artists/critics and three well known graphic designers. </p>
    <p>The website for the book is <a class="freelinking external" href="http://www.ambigramsrevealed.com/" rel="nofollow">Ambigrams Revealed</a> . It explains what the book is, details who is on the judging panel, and explains what type of submissions we are looking for. </p>
    <p>Currently, we're accepting submissions until July 31st. After that, the participants will be chosen within a week and those accepted into the book will be sent a confirmation email. </p>
    <p>Feel free to post questions regarding the book/submissions here or feel free to email me with any questions: <a href="mailto:nikita@ambigram.com">nikita@ambigram.com</a>. </p>
    <p>Looking forward to seeing some fantastic submissions, and thanks in advance to everyone!</p>
    <p>Nikita</p>
