    html: |-
      <p>German name, perhaps a German font from the era.<br>
      Basalt, designed by W. Ege for Gensch &amp; Hayse 1927.  It was redesigned in 1934. I suspect the redesigned Basalt  is the match.<br>
      See Jaspert's  _Type Enclopaedia (1970) which shows the 1927 version of Basalt, with only the word "ENMITGLIED,"  which matches the Dan X. Solo "Harmony."</p>
