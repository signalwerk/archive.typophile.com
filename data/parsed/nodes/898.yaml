  html: '<p>Hi Typophiles, <br> <br>Here is a new typeface I am working on. It was inspired by the tutorials of Computer Arts Specials (Issue 39, pp. 25 and 80). As a neophyte in Typeshire and I was lucky enough to find this place to get some expert ideas and opinions. Entropy intends to be a  nice blend between art deco and contemporary techno style. It has similar X height as Helvetica and a deliberate minimalist design. When completed it will comprise at least five different weights both in normal and italic, and five versions with different horizontal width (from narrow to super extended). The number 03 refers to the narrow version, 07 to the somewhat extended one. I also have created Russian/Cyrillic characters, because it is a good challenge. And a semi-serif version is also under way...  <br>For start I would like to put the Entropy 03 Regular version on the balance. Please, give your opinion especially on the following points:   <br> <br>1)  Originality - I have started my work from scratch, er... sketch, but I am deeply concerned that someone else have come up with a quite similar idea before. This is the main reason I publish my half-finished work here to claim priority or, as the case may be, to abandon the whole project. It is a simple design and nowadays I see more and more similar glyphs around.  Is there a way to check that this is an original design, or how much should it differ from the similar ones to merit its own existence? If you know a nearly identical font, please raise your hand! <br>2)  Oldstyle figures - to keep or to drop them? <br>3)  Any missing important glyphs necessary for regular use. Language accents are still in the lab. <br>4)  The name - is there any other font with the same name? Better name, anyone? <br>5)  Cyrillic characters - are they correct if you consider the design logic? <br> <br>All comments (even beyond the four points above) are welcomed and seriously considered. Thanks,  <br> <br> <br>Tybor <br> <br><img src="http://www.typophile.com/forums/messages/29/14072.gif" alt="Entropy 03 Regular"></p>'
  html_clean: '<p>Hi Typophiles, <br> <br>Here is a new typeface I am working on. It was inspired by the tutorials of Computer Arts Specials (Issue 39, pp. 25 and 80). As a neophyte in Typeshire and I was lucky enough to find this place to get some expert ideas and opinions. Entropy intends to be a  nice blend between art deco and contemporary techno style. It has similar X height as Helvetica and a deliberate minimalist design. When completed it will comprise at least five different weights both in normal and italic, and five versions with different horizontal width (from narrow to super extended). The number 03 refers to the narrow version, 07 to the somewhat extended one. I also have created Russian/Cyrillic characters, because it is a good challenge. And a semi-serif version is also under way...  <br>For start I would like to put the Entropy 03 Regular version on the balance. Please, give your opinion especially on the following points:   <br> <br>1)  Originality - I have started my work from scratch, er... sketch, but I am deeply concerned that someone else have come up with a quite similar idea before. This is the main reason I publish my half-finished work here to claim priority or, as the case may be, to abandon the whole project. It is a simple design and nowadays I see more and more similar glyphs around.  Is there a way to check that this is an original design, or how much should it differ from the similar ones to merit its own existence? If you know a nearly identical font, please raise your hand! <br>2)  Oldstyle figures - to keep or to drop them? <br>3)  Any missing important glyphs necessary for regular use. Language accents are still in the lab. <br>4)  The name - is there any other font with the same name? Better name, anyone? <br>5)  Cyrillic characters - are they correct if you consider the design logic? <br> <br>All comments (even beyond the four points above) are welcomed and seriously considered. Thanks,  <br> <br> <br>Tybor <br> <br><img src="http://www.typophile.com/forums/messages/29/14072.gif" alt="Entropy 03 Regular"></p>'
