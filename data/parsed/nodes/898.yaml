    html: "<p>Very nice!!! Reserve me a copy! <br> <br>A few nitpicky things: it would be nice to see a little more divergence between Latin and Cyrillic letters (the Ks, Es, Ms, etc). I'm no expert, but I do love the inclusion of Cyrillic here. <br> <br>I'd also be curious to see blocks of Latin and Cyrillic text side-by-side; your Cyrillic lowercase letters might look smaller than the Latin and need optical adjustment (enlargement). <br> <br>Your percent and per-thousand might look better with circles or forward-o's. The euro sign might look better a bit wider. <br> <br>Paul</p>"
