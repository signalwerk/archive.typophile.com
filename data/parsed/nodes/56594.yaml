      <p>It is sort of a different issue for a user -- at least, an InDesign user.</p>
      <p>First of all, consider this: if you need a character which is encoded in Unicode, you can enter it directly from the keyboard. Usually faster, and usually better. Sometimes when you enter a character from the glyph pallet, certain OT features seem to get blocked. </p>
      <p>If you need a character that isn't encoded, two possibilities:</p>
      <p>Case 1: If it is a small cap, you have probably used one of the small cap features in InDesign, so again, you can enter the appropriate Unicode cap (or l.c.) &amp; be done with it.</p>
      <p>Aside: Sometimes a character has a Unicode index, but you don't know it, and figure it will be easier to find it in the glyph pallet. Well, it happens. In that case, you usually want all the characters of a certain kind together. Problem is, there are different "kinds". </p>
      <p>An alphabetic sort order makes the most sense when you are trying to find a diacritical variant, at least, using the Latin Script. I don't know the other scripts well enough to comment.</p>
      <p>If you don't know the Unicode index for an oddball character (the circled infinity used for "archival paper" for example), you just hope you'll spot it quickly. (But you won't, usually, because it is left out of most fonts.) </p>
      <p>Case 2: The other situation occurs with a font like Bingham Script. Now just which of those variants did the designer want? Hard to see all the subtle differences in the glyph pallet. This is one case where I'd personally like to see the variant characters have a Private Use encoding. That way, the "just which one" can be passed along the production chain. Failing this, having them all together helps, a little.</p>
      <p>FWIW</p>
