      <p>Users (including but not only type designers) complained that GID order was a bit odd.</p>
      <p>I agreed with them. After all, hardly anything else in the universe cares or displays GID order, so it seemed odd that InDesign would make it so prominent. I suggested that Unicode order would probably make more sense.</p>
      <p>Now that both options have been out there, it would be reasonable to ask users which they prefer as the default. I suppose since I have just wrapped up a survey, I could start another one! This one is much simpler, though.</p>
      <p>Are there any other orders people might like? You can already filter by Unicode block so as to see just Cyrillic or just Latin-Extended-B or whatever.</p>
      <p>Regards,</p>
      <p>T</p>
