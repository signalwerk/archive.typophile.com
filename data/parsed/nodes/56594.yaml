    html: <p>You can make your own order, and the Glyph palette will display that when in CID/GID mode. Just switch FontLab's Font Window to "Index mode" and move the glyphs around. Or make your own encoding file and then, while in "Names mode", do Glyph -&gt; Sort Glyphs -&gt; By Encoding.</p>
