    html_clean: |-
      <p>Yes, Karsten, I think we should put the onus on type designers to make a usable, sensible order for users. Right now, I just began using an order that makes font development easier for me. I would also be happy to output final fonts in an order most usable by typical users, those who do not know the innards of type technicalities (or care). Perhaps Thomas's questionnaire will enlighten  us on what that might be. Thanks, Thomas!</p>
      <p>I would hope his questionnaire would find its way to a broader audience than we typical typography freaks so that we get a broader perspective from normal users like graphic designers, editors, compositors, and publishers.</p>
      <p>ChrisL</p>
