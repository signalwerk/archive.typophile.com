    html: "<p>GID = Glyph Identifier. This is a decimal number starting at 0 recording the order of glyphs in a font. GIDs are the backbone of OT fonts: the cmap table maps GIDs to character codepoints, GSUB lookups map GIDs to GIDs, etc. Generally, since font editing tools tend to work around glyph names for convenience, must people are sheltered from working directly with GIDs.</p>"
