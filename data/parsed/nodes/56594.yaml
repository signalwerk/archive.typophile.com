    html: |-
      <p>GID is the glyph index in the font, which is visible in the Font Window's Index mode in FontLab Studio. </p>
      <p>CID is the character identifier in so-called CID-keyed fonts, i.e. Asian PostScript and OpenType PS fonts. It is kind of like Adobe's own encoding scheme for Asian characters, alternative to Unicode. </p>
      <p>I agree that the term "by CID/GID" is not very obvious to the user</p>
      <p>It reminds me of the term "OpenType CFF". This is why I have been proposing "OpenType PS" as in "PostScript-flavored OpenType", but it seems that Adobe was concerned about the use of their PostScript trademark in this context. I think that Adobe was primarily worried that "PostScript-flavored OpenType" suggested that "the other" flavor, i.e. "TrueType-flavored OpenType" aka "OpenType TT" is not compatible with PostScript, somehow. But "CFF" just like "sfnt" is an obscure technical term which I think is an additional burden to the user to learn. Same for "CID/GID". </p>
      <p>I agree with John that "Font order" would be a sensible label in this context. </p>
      <p>I have just <a href="http://www.adobe.com/cfusion/mmform/index.cfm?name=wishform">submitted a feature request</a> to Adobe, proposing the terminology <em>Sort glyphs by</em> / <em>Font order</em> and <em>Unicode order</em>. I encourage everyone to submit a similar request — the more people submit, the more likely it will be that this feature request is noticed. </p>
      <p>Cheers,<br>
      Adam</p>
    html_clean: |-
