      <p>The Sort By option appeared only in CS3 (I recall); before that, the font definition order was used -- the one Adobe calls "GID/CID". I always had a hard time hunting down the character I needed, and was glad to see the Sort menu added, as I know sort-of in what Unicode range I have to look for most special chars.</p>
      <p>But what's with the Character Name showing up if you hover over one? I'm looking for, say, an 'e with a dot above'. I type this into Google and find the unicode: U+0117. Then I sort the font by Unicode. When I <em>finally</em> locate it, the friendly popup says "e with a dot above". I know that! It would've be useful if they added a plain search field to the Glyphs panel.</p>
