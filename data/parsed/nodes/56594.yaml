    <p>The Adobe Glyph palette does not seem to present glyphs in a logical way for users. Is there a way the font designer or even user can make a more sensible ordering?</p>
    <p>ChrisL</p>
  html_clean: |-
    <p>The Adobe Glyph palette does not seem to present glyphs in a logical way for users. Is there a way the font designer or even user can make a more sensible ordering?</p>
    <p>ChrisL</p>
