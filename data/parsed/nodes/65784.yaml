      <p>The question regarded ‘tracing a font for an identity project (commercial or personal)’. If the project were personal, I'd be willing to let it go, but <em>any</em> commercial identity project should have a budget big enough to comfortably include a font license and there is no excuse for not paying for one. A typeface may contribute massively to an identity project and, if it forms the main constituent of the identity I'd say that a standard per-user license fee would be incredibly cheap for the value gained from that typeface. [This is why Restraint is licensed under a different model for use in identity work: a recognition that typefaces have different value depending on their use.]</p>
