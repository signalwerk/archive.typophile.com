      <p>This discussion touches on something that has been bothering me for a while now. My case is different from the scenario described above, as there was no font file produced at all – I simply drew and "kerned" the glyphs required to build four words using images of an existing font as a starting point. </p>
      <p>While looking at some sketches for a masthead for <a class="freelinking external" href="http://www.danpetter.net/" rel="nofollow">my website</a>, I registered a substancial inspiration by an existing font, the wonderful <a class="freelinking external" href="http://www.fontshop.com/fonts/singles/ars_type/ars_maquette_black/" rel="nofollow">Maquette Black</a>. Even so, I didn't want to plainly set it in Maquette for a number of reasons: some of its proportions and glyph shapes were not right for my purposes, and felt I had to add/exaggerate some contrast here and there; also, a license would set me back almost €200, as Maquette is available as a 5-font-package only. Still, I figured I could save some time <em>and</em> produce a much better result if I used Maquette Black as a starting point. So I set the four words online, traced the resulting screenshots and developed my own design from there.</p>
      <p>I've dealt with an amorphous feeling of remorse ever since, blaming myself for harvesting the fruit of another designers legwork. The tenor of this thread offers some relief from those worries.</p>
