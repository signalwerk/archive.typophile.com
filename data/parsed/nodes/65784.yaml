      <p>In the sign industry, profit margins are very slim. There are times when we get art from clients, either printed or digital, without their <em>special</em> font. If the font does break my almost non existant software budget, and if I can use it on future projects, I'll buy it. Sometimes (rarely) if a client intends to use a font in a lot of signage I'll negotiate it into the price of the job. But, if the single weight or smallest package is cost prohibitive, I'll trace that sucker in a heartbeat. And, I'm fast. By the time you figure the time it takes to find the font and the purchase price, they add up very quickly. If there are only a few letters, tracing is cheaper assuming that the sample is good enough. Competition in the sign industry is such that the difference of $30 bucks can cost you the job. </p>
      <p>However, in the case suggested by firbrewd, I'd just bite the bullet and buy the damn thing or use what is available. I hate copying other people's stuff.</p>
