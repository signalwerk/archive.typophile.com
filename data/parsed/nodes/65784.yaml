      <p>Interesting points of view, everyone.</p>
      <p>I don't know how well known it is, but in developing countries, identity design, for example, isn't considered as something that should be paid considerably, with a budget that could include the purchase of a whole type family — just design as usual, with low pay as usual. I've had this debate many times, if tracing some letterforms to make a logo would be ethical or not, because in the first place, you aren't copying the 'font' itself, and second, you'd be tracing a few letters (let's say the logotype is Pepsi). Would it be fair to pay full price for five letterforms?</p>
      <p>Of course, I'm not degrading the work of the typographer at all, and in fact, I think it's one of the most important pieces of a design project, but sometimes, the price of a font should be considered. Wouldn't it be fair to pay less for a font on a project of a five letters logo, than on one involving heavy use of the font, as in a magazine? It should be also considered that you could manually set the type of the logo (thus ignoring the 'font' or programming aspect of the type), just using the vectors, but in a magazine, you need advanced options that a good font will provide, like kerning pairs, ligatures, extended latin characters, and so on.</p>
      <p>Also, we could make some exceptions here. Sometimes a font is so heavily used (like Helvetica or Arial) that "it feels light air — it's just there", that one wonders if it could apply for a more open licence of some sort, or use a way lower price than regular fonts. Could be used for another debate.</p>
