      <p>Typefaces represent added value in a design project. If they didn't, then one could just use Courier for everything. Designers select particular typefaces because they add value to the overall design in some way. So, it makes sense to consider the value and hence the appropriate cost of a typeface in terms of the added value, rather than in terms of either number of users of a font or quantity of text set in the font. This is why it makes no sense to me to suggest that using a typeface in a logotype that uses only five letters should cost less than using the same typeface to set the text of a magazine, because it is entirely likely that the added value in the logotype project is much higher than in the magazine.</p>
      <p>Hrant, I think your two criteria under which tracing is unacceptable miss what seems to me the real problem: that someone other than the designer or licensed vendor/user of those letters is <em>profiting</em> -- either directly or in added value -- from the use of those letters. Simply put, it is exploitation of another's work and creativity to create wealth or value without compensating that person. I put it in the same category as failing to pay wages for work done.</p>
      <p>Regarding the case of developing countries, why ape the design of the industrialised nations by copying fonts? Why not encourage domestic creativity and the work of local lettering artists, sign painters, etc., which may in turn develop into a domestic type design business.</p>
