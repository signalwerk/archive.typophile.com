    html: |-
      <p>I'm very surprised that Linotype doesn't still offer Century Small Caps. During the 90's they had the Linotype GX Core Set which had Century Schoolbook Small Caps. Have you tried contacting Linotype via email and asking about it? You may find that they do in fact have it, but you need to be able to buy it as a standalone font for use in Word.</p>
      <p>Linotype does sell Red Rooster's TC Century New Style Expert which has Small Caps but I haven't compared it to mainstream Century's.</p>
      <p><a href="http://www.linotype.com/317346/TCCenturyNewStyle-family.html" title="http://www.linotype.com/317346/TCCenturyNewStyle-family.html">http://www.linotype.com/317346/TCCenturyNewStyle-family.html</a></p>
      <p>HTH</p>
      <p>George</p>
