    date: 2012-12-12T12:32:00
    date_raw: 12 Dec 2012 — 12:32pm
    votes: null
    html: |-
      <p>Theunis: That's a helpful list of faces, but that page was last updated in July 1997. A Google search for “New Century Schoolbook Caps and Small Caps” produces one result: the page you linked to. And I don’t see a link to download any of those font files.</p>
      <p>That set looks like it would more than meet my needs. New Century Schoolbook would also work, but it’s less desirable because it doesn’t come installed in Word for Windows. I’d like to avoid compatibility issues. Searching for “New Century Schoolbook SC” brings up several sites to download some free fonts. I’m a little nervous about doing that, but it’s the best option I’ve seen so far.</p>
      <p>For the curious, the law firm adopted Century/Century Schoolbook because it’s/they’re already installed on our computers and acceptable in almost any court we practice before. The U.S. Supreme Court requires a font in the Century family, which is also acceptable in any of our local federal courts, and Indiana appellate courts, which just have a list of acceptable fonts rather than a chosen family, require one of the following fonts:<br>
      Arial, Baskerville, Book Antigua, Bookman, Bookman Old Style, Century, Century Schoolbook, Courier, Courier New, CG Times, Garamond, Georgia, New Baskerville, New Century Schoolbook, Palatino or Times New Roman <a class="freelinking external" href="http://www.in.gov/judiciary/rules/appellate/index.html#_Toc313022210" rel="nofollow">http://www.in.gov/judiciary/rules/appellate/index.html#_Toc313022210</a>.</p>
      <p>The only overlap between the U.S. Supreme Court and Indiana appellate courts is with Century, Century Schoolbook, or New Century Schoolbook. Only the first two are included in the firm’s software.</p>
      <p>Thanks to all. This forum has been a real help.</p>
