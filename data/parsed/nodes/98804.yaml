  html: <p>My employer (a law firm) has adopted Century or Century Schoolbook for most documents I produce. (This is a result of a combination of style and very restrictive court rules.) I'd like to use a true small caps in those documents, but I can't find anywhere to buy a set with small caps in either font. Any tips? Thanks.</p>
