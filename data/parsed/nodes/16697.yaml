      <p>»Did you start with any font’s outlines, or was everything drawn “from scratch”?«</p>
      <p>initially i wanted to merely find a good type for the corporate design, and started playing around with the verdana shapes to get some idea of what i was looking for. i knew i wanted a less generic character but a similar feel with body type. </p>
      <p>i also had a good look at nuri and faceplate, but neither qualified as corporate font. and of course thesis sans is always good to use. so overall i can't really say i worked from scratch, and i did no drawing on paper at all.</p>
      <p>cheers,<br>
      curtze</p>
