    <p>hey everybody,</p>
    <p>we've developed a new corporate font for a german firm called HERMA. it's already out and being used, and seems to work fine. (so there aren't any changes to be made, really.)</p>
    <p>still we'd love for whoever is interested to give an open an honest critique. don't hold back, feel free to mention anything on your mind. cheers,</p>
    <p>curtze</p>
