    html: |-
      <p>There are some problems with terminal angles which are especially pronounced in the heavier weights. Also, some glyphs have balance issues; the "8" looks like it's about to fall over to the left.</p>
      <p>Looking very closely, there are some weight problems in the curves in all weights of "S", "s", and "ß". Also, the "perfection of construction" of the "V-Y" and  "v-y" isn't helping those letters; the interior angles should be a little be greater to visually equalise the stroke weights. The X and x seem to be horizontally and vertically flipped, so the letters appear top heavy.</p>
      <p>On the last page, check out the big "can" in the second line. Besides the right side of the "c" needing some fine-tuning, it also needs a little less sidebearing.</p>
      <p>Hope I don't sound too harsh. This is pretty nice work, but there are some issues which stand between Herma and greatness.</p>
