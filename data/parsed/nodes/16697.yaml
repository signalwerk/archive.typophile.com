    date: 2005-12-08T12:44:00
    votes: null
    html: |-
      <p>thanks for your input. overall, without making any excuses, we had little time and even less experience, when we churned the thing out. i wonder whether the client would be open for a revised version after a year or so...</p>
      <p>regarding the verdana: yes, there was some inspiration there. i feel the verdana is actually a very nice font at small sizes, the larger it gets the more it looses its beauty. and the task for HERMA was to create a single font that works both large size and large amounts of copy.</p>
      <p>i had noticed the balance issue on the 8, but had found no elegant way to correct that. some of the other details you mentioned i honestly hadn't noticed as being grave. for me the type was part of the overall corporate design package, and i was worried about the overall feel. now that it's out, i wish i had spent a little more time "tweaking".</p>
      <p>go ahead - keep criticising!</p>
