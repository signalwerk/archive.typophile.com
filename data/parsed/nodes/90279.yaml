    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ruffcut_news_3678.gif"></div><br>
    P22 Ruffcut is the newest addition to the Sherwood Collection of historical and period-based fonts by Ted Staunton. It is an antique wood type style that evokes the look and feel of type used in the design of poster-sized advertisements for circus, fairground and like events in the late 19th century. It is inspired by the memories of printing letterpress posters on an old cast-iron flatbed press where the oversized posters were usually composed directly on the bed of the press using mostly wood type as large as two feet high. The Ruffcut Set contains 2 styles, Plain and Woody for that more authentic look, in basic OpenType format. Ruffcut is optimal for a wide array of decorative uses including signage and posters.<p></p>
    <p>For more information about <a href="http://www.p22.com/sherwoodtype/ruffcut.html" rel="nofollow">P22 Ruffcut</a></p>
