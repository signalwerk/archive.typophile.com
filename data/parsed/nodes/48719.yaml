    <p>Hi,</p>
    <p>A friend of mine asked me to design a new logo for his business. The business is essentially a job agency and the name is derived from the English word “time” and its German equivalent “zeit”. </p>
    <p>Please have a look at the attached file and let me know what needs further improvement. Thanks a lot for any input!</p>
