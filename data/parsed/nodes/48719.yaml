      <p>Honestly, I don’t really like it.</p>
      <p>It took me a while to see what it was supposed to be. Why does the guy at the top left not have his arm behind the guy at the top right?</p>
      <p>I’m also not sure that the combination of 4-fold rotational symmetry and a German name is a good idea - the negative space <cite>sort of</cite> looks like a swastika.</p>
      <p> - Lex</p>
