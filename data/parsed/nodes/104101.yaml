      <p>You could try your distortions on <a href="http://www.myfonts.com/fonts/typodermic/zingende/" rel="nofollow">Zingende</a> by Ray Larabie. Closer than Anna. Lots of letters follow the R model. You could adapt an O to the A. Not quite as cornered as your sample but it might do as a rough match. Or you could do some blending with Compacta.<br>
      Don</p>
