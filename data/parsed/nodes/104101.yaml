      <p>OldNick ...I swear you've got too much going on!!!</p>
      <p>That font is one of yours ...I thought it was ...smelt retro.</p>
      <p>Greasy Spoon NF </p>
      <p><a href="http://www.fontspace.com/nicks-fonts/greasy-spoon-nf" title="http://www.fontspace.com/nicks-fonts/greasy-spoon-nf">http://www.fontspace.com/nicks-fonts/greasy-spoon-nf</a></p>
      <p>And for what it's worth I was wrong about the effect. Once I got the font into Illy it was plain to see that that effect can be achieved via a mesh ...after it was mangled in Illy it was stroked in Ps and then hit with a grunge effect.</p>
      <p>No wonder you didn't recognize one of your own ...LOL!</p>
