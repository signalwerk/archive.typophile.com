    html: <p>I don’t think that there is an exact match for the masthead of »Frankfurter Allgemeine Zeitung« (FAZ). You might browse Dieter Steffmann’s <a class="freelinking external" href="http://moorstation.org/typoasis/designers/steffmann/index.htm" rel="nofollow">collection</a> for a start. For the headlines within the paper, FAZ employed a special version of Fette Gotisch called »FAZ Fraktur« made by <a class="freelinking external" href="http://www.urwpp.de/deutsch/home.html" rel="nofollow">URW</a>, which unfortunately is not used anymore since about two years.</p>
