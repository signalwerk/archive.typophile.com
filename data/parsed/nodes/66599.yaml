    html: <p>I don’t think that there is an exact match for the masthead of »Frankfurter Allgemeine Zeitung« (FAZ). You might browse Dieter Steffmann’s <a href="http://moorstation.org/typoasis/designers/steffmann/index.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">collection</a> for a start. For the headlines within the paper, FAZ employed a special version of Fette Gotisch called »FAZ Fraktur« made by <a href="http://www.urwpp.de/deutsch/home.html" title="Click to visit an external URL." class="freelink freelink-external freelink-external">URW</a>, which unfortunately is not used anymore since about two years.</p>
