    <p>Greetings type enthusiasts. On a recent trip to Europe I was browsing the newsstands and came across these two lovely typefaces. I thought they were great. I'd like to buy them/download them if possible for my own uses and I was hoping someone out there could help me identify them. Much thanks in advance.</p>
