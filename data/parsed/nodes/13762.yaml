    <p>Capital letters, also called <a href="/node/14188" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Majuscule</a> or <a href="/node/14510" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uppercase</a> are derived from inscriptional forms of the alphabet which the Romans adopted from the Etruscans. One distinguishing featue of capital letters is that they are of uniform height; the absence of ascenders or descenders (generally) is another feature of the upper case. These inscriptional forms of the alphabet were also the basis for several writing hands that followed, including <a href="/node/add/wiki?edit%5Btitle%5D=square%20capitals" title="Create node &quot;square capitals&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">square capitals</a> and <a href="/node/13703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Uncial</a> lettering.</p>
    <p>Capital letters are a feature of the <a href="/node/14789" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Greek</a>, <a href="/node/14507" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Roman</a>, <a href="/node/add/wiki?edit%5Btitle%5D=Armenian" title="Create node &quot;Armenian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Armenian</a> and <a href="/node/14164" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrillic</a> <a href="/node/12248" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Alphabets</a>. These alphabets are classified as <a href="/node/13918" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Bicameral</a> because they do contain two distinct&nbsp;cases.</p>
    <p>Wikipedia article: <a href="http://en.wikipedia.org/wiki/Capital_letters">http://en.wikipedia.org/wiki/Capital_letters</a></p>
