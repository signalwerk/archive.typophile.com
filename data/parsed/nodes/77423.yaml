      <p>All individual glyphs look really nice but some pairs look just look wrong to my eyes. You might want to reconsider:<br>
      /e/t/c/ followed by a letter with a bottom serif like. In the picture this occurs in thousand (th), still (ti), character (ch + er)</p>
      <p>I'm no pro though, so take it with a grain of salt.</p>
