      <p>Thanks, Adam. I've done some 1 700 kerning pairs now, with some upper-lower case pairs still missing. I've gone very eighties-mode; I do the kerning TNT (that's Tight, Not Touching), very popular in that time. After that I'll make an extreme hairline version.<br>
      Let's see how it turns out.</p>
