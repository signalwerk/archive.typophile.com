  html: <p>hellooo everybody! a friend told me that today we will all die so i want to ask a quick question before all the smart people are gone. lately i have been going to many exhibitions and design events and one thing which has caught my attention is that i see a trend among independent hipster publications and designers who mostly use fonts such as sabon, courier and custom made ugly future like sans serif fonts in their magazines and works. so i want to know why is this. have this people been reincarnated from the last century . thank you and happy christams!!!!!!</p>
