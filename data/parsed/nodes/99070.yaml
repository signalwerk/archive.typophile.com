      <p>McSweeney's would perhaps no longer be considered hip but I did watch an intriguing talk on YouTube by founder Dave Eggers and was particularly amused by his comments with regards to fonts, or perhaps I should say "font" as initially he could or would only use one, Garamond 3. This was by his admission the result of not being able to fully grasp the font management software on his computer, which, as he was using Quark 4.1 in Mac OS 9 is hardly surprising : )</p>
      <p>The video is a recording of The Art of the Book: Behind the Covers with Dave Eggers, Chip Kidd, Milton Glaser and moderator Michael Bierut at the 92nd Street Y in New York, December 4, 2006 and can be found here:</p>
      <p><a href="http://www.youtube.com/watch?v=HpVQRKyD_yM" title="http://www.youtube.com/watch?v=HpVQRKyD_yM">http://www.youtube.com/watch?v=HpVQRKyD_yM</a></p>
      <p>Merry Christmas/Apocalypse or whatever greeting works for your preferred religious iconography or fatalistic belief structure.</p>
