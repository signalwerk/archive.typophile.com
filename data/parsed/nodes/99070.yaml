      <p>Depends by what standards you measure it, or from where. Hideous it certainly was in many many ways. But, for example, artistically, in Europe, it was a hundred times superior to the grim rationality of the preceding century. Socially it was, for pretty much anywhere in the world undiscovered by the nightmare white man, better than the century which followed. It even produced one or two decent fonts, if I’m not mistaken.</p>
      <p>EDIT! Ooops. My mistake. ‘Last century’ means Twentieth these days dunnit? Keep forgetting. Well, my first sentence still holds true. Much marvellousness came from the Century of Horror too, as from any darkness.</p>
