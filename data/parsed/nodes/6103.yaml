    html: <p>I personally don't know if there are any fonts, per se, that are "illegal to own". There <br>has been a reluctance here, though, to provide info to anyone who might possibly be <br>trying to duplicate currency or credit/debit cards � for obvious reasons. <br> <br>I emphasize the word <i>possibly</i>, because that doesn't appear to be your agenda at <br>all � but ya never know ... <br> <br>I'm surprised that nobody else has suggested fonts that might meet your objective. <br>Check out some of the <a href="http://www.myfonts.com/browse/foundry/testpilot/?idtype=foundry&amp;itemsperpage=55&amp;resultcount=55&amp;page=1" target="_blank"> Test Pilot Collective</a> offerings for an OCR clinical look. <br><br></p>
