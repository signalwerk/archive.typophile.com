      <p>I intentionally cropped out the newspaper name out of pity for the designer. I figure the wrath of the clients and bosses, plus mockery of millions of newspaper subscribers, is punishment enough. It's from a HUGE New England newspaper (I'm visiting relatives.)</p>
      <p>Anyway, this is definitely the designer's fault, although I doubt it was done by a designer. My guess is that these ads were both done by the newspaper's advertising sales department and tossed into the layout at the last minute. </p>
      <p>I used to work at a fairly large newspaper, and there's no way this would've gotten past layout. It was a constant battle between the sales team and the graphic designers (layout); sales would keep trying to sell spaces that layout had used filler ads for.  Layout would put a page to bed, go home for the day, then the sales team would persuade the printer to swap out a filler ad for a paid ad. </p>
      <p>I clipped it out to use as a cautionary tale. THIS is one of the many reasons it's worth it to pay a professional designer!</p>
