    html: <p>That’s ugly <a href="http://www.dafont.com/harabara.font?text=acdeim" rel="nofollow">Harabara</a>, basically a modified Helvetica. If you like to use a better typeface with stemless glyphs try FF Dax/FFDaxline, FF Schmalhans, Flux, FF Sari/Barmeno, Generis Simple, Corisande, Phoenica, Mic 32, Suredog, Subinter, Variable, DTL Prokyon and many more.</p>
