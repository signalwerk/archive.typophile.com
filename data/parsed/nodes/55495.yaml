    html: |-
      <p>1) Contact P22</p>
      <p>2) P22 Underground and New Johnston share a common heritage, that is all.</p>
      <p>3) P22 Underground is an attempt to revive the original type by Johnston retaining imperfections such as super-low contrast, the long tail on the l, &amp;c. My rationale was that it is these 'imperfections' that give the face charm. New Johnston is a less-strict revival, but still retains many of the qualities of the original but has taken some liberties to improve the face for its purposes.</p>
      <p>4) Persons listed in the credits on the PDF beta-tested the fonts, gave feedback, critiques or lent images for the PDF.</p>
      <p>5) Not that I know of. The original type was a wood type, the nicked corners were incorporated to give a sense of softening of edges that might have been associated with the types having been made from wood. Otherwise, I included these as a design feature partially due to my own aversion of sharp corners.</p>
      <p>If you have any other questions, you can post them here or email me:<br>
      paul (@t) p22 (d.t) com.</p>
