    <p>Calling Paul D Hunt (and anyone else who cares to comment)...</p>
    <p>I have some questions on the subject of P22 Underground Pro, the answers to which might interest others too:</p>
    <p>(1) When it says that Underground is licensed to P22, does that mean that P22 Underground Pro sticks rigidly to the original which I assume still belongs to the London Transport Museum? Or did you redraw it entirely, and if so, why does it still belong to the LTM (if it does, that is) or is it now a P22 font? I realise the nuts and bolts of the arrangement with LTM may be sensitive information.</p>
    <p>(2) Where does P22 Underground Pro fit in with the New Johnston family which is what Transport for London now use? Is there a connection at all (other than having a common ancestor)?</p>
    <p>(3) In what ways does P22 Underground Pro differ stylistically/in appearance from New Johnston (is it just more faithful to the original?/is it the original and best?) or ITC Johnston which is different again and can presumably be classed as a revival of sorts? Do you see P22 Underground Pro as a revival?</p>
    <p>(4) How were the other guys who are credited on the pdf involved with the design?</p>
    <p>(5) Did the original Underground font really have the corners snicked off microscopically? What's the thinking behind that, if any?</p>
    <p>Love it, by the way, especially the pdf which has already been complimented in <a href="http://typophile.com/node/39734" rel="nofollow">this thread</a>.</p>
    <p>Finally, is there a place on Typophile where this kind of information about individual  typefaces can be found? It occurs to me that between us, there must be a lot of info about fonts that will disappear just as quickly as we do unless it is documented somewhere. Or are we just relying on what Wikipedia says? (This discussion may or may not warrant a thread in its own right.)</p>
    <p>For example, I have some (albeit fairly trivial) information on one or two typefaces that I don't suppose anyone else knows. So where do I leave this info for posterity's sake? Wikipedia? Surely not.</p>
    <p>Interested in your thoughts.</p>
    <p>N</p>
