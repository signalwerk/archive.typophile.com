    html: |-
      <p>(1)<br>
      Licensing and design are two separate issues. The London Transport Museum granted P22 a license to use their intellectual property to recreate the original Johnston design for LT. LT has a very strong identity and IP protection. Even though the font was redrawn from "scratch", having the official licensing makes it an authorized "product". There are many reason this was the only way to go for this project.</p>
      <p>(2)<br>
      New Johnston is the official face of LT as designed for them by Banks &amp; Miles. It varies from the original Johnston in several ways.<br>
      P22 Johnston Underground was the basic font done in 1998. It is a very close facsimile of the original Johnston and doe snot follow New Johnston.<br>
      P22 Underground Pro is Paul Hunt's refined and expanded version of P22 Johnston Underground. It is less like the original Johnston than the first P22 version but more than New Johnston.</p>
      <p>(3)<br>
      Overlaps with above answer. Sure call it a revival.</p>
      <p>(4)<br>
      Paul did pretty much all of the Pro set on his own. I smoked Cuban cigars and stood over his shoulder saying: "Hunt...isn't that damned thing done yet!"</p>
      <p>(5)<br>
      The corner bumping was something I decided to do for P22 Johnston Underground since we were working from woodtype specimens and I didn't want sharp corners at large sizes. It was an experiment to see if it would soften (and therefore make less digital) the overall feel of the font.</p>
