    <p><a href="/wiki/Index" class="freelinking" rel="nofollow">Index</a></p>
    <p>Christopher Simmons is a San Francisco based graphic designer. He is an emeritus President of the San Francisco chapter of the <a href="/wiki/AIGA" class="freelinking" rel="nofollow">AIGA</a> and served on it's board in previous terms. In 2004 he left Alterpop to form the studio, MINE. He is the author of <a href="http://www.amazon.com/exec/obidos/ASIN/1581805497/mine0b-20" rel="nofollow">Logo Lab</a>, and judged <a href="http://www.amazon.com/exec/obidos/redirect?tag=mine0b-20&amp;creative=9325&amp;camp=1789&amp;link_code=ur2&amp;path=tg/detail/-/1592531822/qid=1115067304/sr=1-1/ref=sr_1_1?v=glance%26s=books" rel="nofollow">Letterhead and Logo Design 9</a>, also authoring and designing the annual of the same name.</p>
    <p>Christopher designed the <a href="http://typophile.bigcartel.com" rel="nofollow">2005 "Gas, Food, Type" Typophile tee</a>.</p>
    <p>URL: <a href="http://www.minesf.com" title="http://www.minesf.com">http://www.minesf.com</a></p>
