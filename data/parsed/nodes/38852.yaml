  html: |-
    <p>Hi folks,</p>
    <p>I need a source(s) to help me find 16 different reading assessment tests. The restrictions are:</p>
    <p>1. They need to be in english<br>
    2. They need to be for people who speak english as a first language<br>
    3. It must be for people at the university level (though I have come across several references to "adult reading" as being grade 8)<br>
    4. They must be approximately 700 words in length each<br>
    5. The hard part, they need to come from the same source.</p>
    <p>So far, SAT prep tests and the Nelson-Denny are the best sources I have come across.</p>
    <p>Can anyone recommend others please?</p>
    <p>Thank you</p>
    <p>PS, I am new here. How do I go back and check old posts I have made in the past?</p>
