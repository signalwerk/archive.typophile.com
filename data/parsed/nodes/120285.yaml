  html: <p>I need a font to paint on a wall. It needs to look like Persian, but be subtle and readable -- with a bit of study -- in English.  I will try to pass it off as a Tolkien, rune, or elven script. I would appreciate any suggestions or even break-through right-on insights.</p>
