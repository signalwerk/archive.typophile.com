      <p>Re the EULA, basically states that for the fountains and/or sources of Latinotype (sorry, I hate it when Spanish-speakers call fonts "fuentes" which actually means either fountain or source :)  )</p>
      <p>1. You may install it on one printer or other print/reproduction device as well as one computer.<br>
      2. For use on more than one machine or other device where the font is copied into a storage device you must by subsequent licenses.<br>
      3. You may not make any copies except for one backup copy, and you may not transfer or sell the license to anyone else.<br>
      4. No returns unless it's defective, and only then with receipt and within 1 week of purchase.<br>
      5. Any works using Latinotype fonts must be used under the respective licenses, therefore vector products must travel with a license.  Embedding is not allowed, if necessary the user must request an embedding license.<br>
      6. Users must give credit to LatinoType™ as a registered trademark and the holder of copyright for the font.<br>
      7. Any violation terminates the license and you must return the font as well as a letter in writing that no other copy exists.<br>
      8. LatinoType takes no responsibility for damages resulting from the use of the software.<br>
      The contract is under international and Chilean intellectual property laws and by either installing or downloading the fonts you agree that you have read understand and agree to the clauses in the contract.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
