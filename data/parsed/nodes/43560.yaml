      <p>Thanks for the tip, Haley. When I first discovered Typophile, Miguel was here very often, and amazed everyone with creations like <a href="http://www.typophile.com/node/6215" rel="nofollow">Garadot</a>. Go, Miguel! Nice to see you around here again. :-)</p>
      <p><em>sorry, I hate it when Spanish-speakers call fonts “fuentes” which actually means either fountain or source</em></p>
      <p>guifa, I studied graphic design in Argentina and typefaces were called "tipografías" or "fuentes tipográficas" by our professors... And this was in the 80s, mind you, before everyone had a personal computer over there! Here's a Spanish Wikipedia page that talks about the use of both terms:</p>
      <p><a href="http://es.wikipedia.org/wiki/Fuente_tipográfica" rel="nofollow">Tipo de letra</a></p>
      <p>You're correct as far as the Real Academia Española not listing the terms <a href="http://buscon.rae.es/draeI/SrvltConsulta?TIPO_BUS=3&amp;LEMA=fuente" rel="nofollow">fuente</a> or <a href="http://buscon.rae.es/draeI/SrvltConsulta?TIPO_BUS=3&amp;LEMA=tipograf%EDa" rel="nofollow">tipografía</a> as equivalents of the English "typeface"... which I have to admit really bugs me! But language is a living thing, and changes faster than dictionary editors can keep up, I'm afraid. :-)</p>
      <p><em>Latinotype. The latin alphabet, on latino hands.</em></p>
      <p>Miguel, some friendly advice from a bilingual admirer: Your slogan would sound much better to an English speaker if it was "The latin alphabet, <strong>in</strong> latino hands."</p>
      <p>Cheers,<br>
      Ricardo</p>
