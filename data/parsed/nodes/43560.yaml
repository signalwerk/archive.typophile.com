      <p>Yeah, it wasn't meant to be a full translation, just a quick point-by-point you can do this or can't do that.  Although I think the intent of #6 is to say when crediting, please credit it like exactly as shown with the TM symbol as opposed to crediting the individual designer (like Janus indicated), it's not the most clear thing.  (Aside for Janus: «sus referentes» in this case means more or less references, or perhaps "points/places of reference".  I would take this to mean the web-design credits, for instance)</p>
      <p>Kegler makes a good point about having EULAs in multiple languages, but in this case it really needs to be rewritten for both English and Spanish users' sakes.</p>
      <p>The problem is that the "y" (and) is not really well defined as to what it's joining, it could be creating a second object of the verb «give credits» or it could be adding a second object under the preposition «como» (as) or it could be a second obligation creating a sentence fragment.  Unfortunately all three areas sound odd given that the second «como» (<em>as</em> the only distributor) doesn't really seem to be well attached. Janus assumed an additional «y» (and) with his comma placement but it's not there or something else to indicate it's position in the hierarchy.  And in any case, it sounds weird to need to identify Latinotype the only distributor of the <em>names</em> of the fonts...  It seems to me like a lot of words and phrases got mixed up.</p>
      <p>For anyone who is interested, <a class="freelinking external" href="http://www.elahorcado.net/random/eula.html/index.html" rel="nofollow">I broke down #6</a> with side-by-side English translations.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
