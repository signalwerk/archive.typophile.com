    html: |-
      <p>great work Miguel.</p>
      <p>&gt; Users must give credit to Latinotype™ as a registered trademark and the holder of copyright for the font</p>
      <p>EULA point No. 6 can be read in two ways:</p>
      <p>1. (the strict interpretation): In every use, let's say on a business card, you must credit Latinotype™ (printing the foundry name on the card) and indicate Latinotype™ as the copyright holder. Obviously this as impractical as it is illogical. I'd be genuinely surprised if this is the correct interpretation of the EULA. Nobody is going to put a foundry name on a poster, packaging, or title sequences. :|</p>
      <p>2. (the logical interpretation) When Latinotype is mentioned in print, in a colophon, in some liner notes, please indicate the ™ and © whenever appropriate.</p>
      <p>Latinotype™  does not appear to have been registered with the US Patent and Trademark Office, but maybe it has been registered with the Chilean PTO maybe? </p>
      <p>In the U.S., ™ can be used at any time, even without federal registration, to put others on notice that you are claiming rights in the mark.<br>
      ® is used when a Trademark has been officially registered after going through the required steps with the USPTO.</p>
