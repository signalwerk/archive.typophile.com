    html: |-
      <p>I think guifa’s shortening of point 6 in the EULA made it more ambiguous than the original:</p>
      <p><cite>6.- El usuario de este software de fuentes Latinotype™ se comprometa a dar créditos a Latinotype™ como marca registrada y dueños del copyright de Latinotype™ como único distribuidor de las fuentes y sus nombres, sin importar los créditos de sus referentes, diseñadores y/o creadores que se muestren en el sitio.</cite></p>
      <p>I read this as, “The user of this Latinotype™ font software is obliged to give credit to Latinotype™, as a registered trademark and owners of the copyright Latinotype™, as the sole distributor of the fonts and their names, regardless of credits to references, designers, and/or creators as given on the site”.</p>
      <p>Meaning that, regardless of who the web site has as the designer or creator of a font, users are required to credit Latinotype™ as the distributor and copyright holder of the font, rather than the individual designer; <em>not</em> that you are obliged to always credit the foundry, every time you use the font.</p>
      <p>[I’m not sure what exactly they mean by <em>sus referentes</em>, though—guifa?]</p>
      <p>Would the more learned Spanish-speakers agree with such an interpretation?</p>
