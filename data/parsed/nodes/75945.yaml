      <p>When picking a typeface for a text, it is often wise to stop a minute and look at your motives. Are you picking this typeface because it is the best way to present the text? Or are other motives involved "See, I can do it," or "No one has ever done this before." Sometimes motives are more pedestrian, as with "I'm so tired of the typeface that would be best for this text."</p>
      <p>Most of us with any spirit fall prey to this from time to time. I've heard any number of designers give elaborate theoretical arguments why their choice was perfect for the piece. Except in rare instances, they've been wrong. (And truth to tell, I've done this too.)</p>
      <p>So the question comes up, are you posting here to get a bit of validation? That would seem to indicate you've got some doubts.</p>
      <p>I'd turn the question around. Can Futura be made to work? Probably. Could another typeface be chosen that would work as well with less effort by both the typesetter (letterfit, kerning, spacing) and the reader? If so, at least you know your motives. Would another typeface work better? Now that makes it hard -- your motives are in conflict with the best interests of project. </p>
      <p>If either of the last two are true, the typeface that is chosen is the result of who has final say, rather than the text and the reader. Happens all the time.</p>
