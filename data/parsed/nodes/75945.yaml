      <p>You have made a thoughtful if theoretical argument. I suspect that most people are not used to reading Futura. And that lack of familiarity will make it harder for them not take in what is being written or reduce their speed in a meaningful way - their ability to make use of it will be probably be less.</p>
      <p><a href="http://www.apa.org/monitor/2010/11/read-onscreen.aspx" title="http://www.apa.org/monitor/2010/11/read-onscreen.aspx">http://www.apa.org/monitor/2010/11/read-onscreen.aspx</a></p>
      <p>Still, it might be worth posting the kind of layout you intend. I can imagine this sort of thing up to a point but seeing it is likely to encourage a more substantial and more detailed response.</p>
      <p>But leaving all of this aside the thing that strikes me about your task is that you need an unusual amount of visual distinction to be do this well. I would describe this as a need for semantic or role distinction within the text. I get this idea from the paragraph below.</p>
      <p>" Within the simple structure of short frames, the text is difficult to set. It contains a mix of regular text, acronyms, titles of works, titles that include acronyms, code to look at, code to type, code quoted within the text itself (including alpha-numeric variable names), the names of keys off a keyboard (including escape and control sequences), formal terms from the system model, answers to be covered up until the questions have been solved, answers that include code, and so on."</p>
      <p>Given that this is the case the question seems to me - what combination of layout and font style options will give you sufficient support for all these distinctions? If that is the primary question I don't think Futura is a defendable option. I don't think It will give you enough distinctive styles.</p>
