      <p>I agree that Futura <em>is</em> problematic for body text. But that doesn't mean that one should exaggerate the extent of the problem. I would rate it as only slightly worse than, say, Helvetica. (Univers is significantly better, although still only by a small amount, but a small but <em>definite</em> amount, than Helvetica for body text, although to my eyes it is a less attractive face.)</p>
      <p>Even an inferior typeface based on Futura for use with crude proportional-spacing typewriters, Mid-Century, was used for many manuals for Xerox and Digitial Equipment Corporation computers (instead of a more conventional serif Roman like Documentary).</p>
      <p>If you want the highest possible readability, therefore, I would not recommend Futura. But the degree to which readability is compromised is so slight in practice that if Futura suits the look or the mood you wish to create, I see no reason not to go for it. I would even say the same about Kabel.</p>
