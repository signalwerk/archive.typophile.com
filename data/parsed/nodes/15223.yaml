    html: |-
      <p>Thanks lorp, I remember you mentioning this diagram. Is this unusual practise for this field, or would we expect, say GoogleEarth to have a similar diagram?</p>
      <p>I know that the company I word for (e-learning for galleries, museums, libraries and archives) has a nightmare tracking licence dependencies.</p>
      <p>If there was a standard interface for EULA properties, independant of what the object the license covers, that would be neat :) Then the property files could just be throw into a folder together and we could let a program map the relationships for us.</p>
