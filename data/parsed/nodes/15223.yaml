      <p>Laurence, that is very scary. I assume that given time those that must can read that map without too much difficulty. However, the key is the getting of the time. Anyone new to that system must hate it. </p>
      <p>Are you keen to make a sample image for EULAs? Do you think something this complicated is really necessary? I'd really like to see what you are thinking, or maybe how you think this type of chart would translate over to keeping track of IP.</p>
