      <p>The idea is not to have one of these diagrams per EULA. The diagram shows how the UKEA kept track of IP in one web project. Each box represents a license agreement. The arrows show how the restrictions cascade down to the final systems:<br>
      * the red Flood Map box (that's the main web project)<br>
      * the yellow NaFRA 2004 Foodline Database box<br>
      * the yellow NaFRA 2004 Postcode Database box<br>
      * the yellow Flood Watch Areas box.</p>
      <p>I'll see if I can make an example diagram for a real-sounding design project, which will make more sense and perhaps be less scary!</p>
