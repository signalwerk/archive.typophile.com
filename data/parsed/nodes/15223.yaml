  html: |-
    <p>During Tiffany Wardle's talk on font EULAs (ATypI TypeTech, Sep 15) I mentioned a diagram I'd come across showing how one organization deals with the intellectual property they used in a single project. It's not about font licenses, but shows how tricky it can be to keep track of what you're allowed to do with the stuff you license. I've now received permission to show the diagram to others:</p>
    <p><a href="http://www.lorp.org/font-eula/uk_flood_map_ip_hierarchy.png" title="http://www.lorp.org/font-eula/uk_flood_map_ip_hierarchy.png">http://www.lorp.org/font-eula/uk_flood_map_ip_hierarchy.png</a></p>
    <p>Steve Coupe, the presenter of the talk during which this slide was shown, commented how keeping track of the IP was too complex just to "keep in your head". I'd be interested to hear people's comments on how this may relate to organizations and individual graphic designers licensing type.</p>
    <p>The project the diagram refers to is the UK Flood Map, an interactive map on the website of the UK Environment Agency:</p>
    <p><a href="http://www.environment-agency.gov.uk/subjects/flood/826674/829803/?version=1&amp;lang=_e" title="http://www.environment-agency.gov.uk/subjects/flood/826674/829803/?version=1&amp;lang=_e">http://www.environment-agency.gov.uk/subjects/flood/826674/829803/?versi...</a></p>
    <p>Click on Flood Map to see if you're at risk!</p>
    <p>-- Laurence</p>
