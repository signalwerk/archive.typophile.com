    votes: null
    html: <p>I just took a look at Bitstream's digitization of Plantin, <a href="http://www.myfonts.com/fonts/bitstream/aldine-721/aldine-721/testdrive.html?s=1234567890&amp;p=48">Aldine 721</a>, and it looks like the numerals are the same style in all weights there (including the regular). This was probably digitized separately from MT's. The question is, where did Plantin MT's lining numerals come from, and when were they designed?</p>
    html_clean: <p>I just took a look at Bitstream's digitization of Plantin, <a href="http://www.myfonts.com/fonts/bitstream/aldine-721/aldine-721/testdrive.html?s=1234567890&amp;p=48" class="link-external">Aldine 721</a>, and it looks like the numerals are the same style in all weights there (including the regular). This was probably digitized separately from MT's. The question is, where did Plantin MT's lining numerals come from, and when were they designed?</p>
