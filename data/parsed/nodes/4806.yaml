    html: <p>This is very interesting. I tried to find an older sample of Plantin lining numerals, but they don't seem to have existed. All of the metal versions of Plantin I found only show old style numberals. I wonder if somebody at Monotype took a short cut when they did the lining numerals for Regular?</p>
