    <p>Hi guys,</p>
    <p>Looking for some suggestions for design for a logo for an indian clothing store.<br>
    The store sells traditional indian fabrics, both stiched and unstitched, many prints, clothing with extensive hand embroidery, and bead work,fancy bridal pieces that are custom stitched, custom crystal jewelery (fused between western and traditional indian designs). The store it self is currently under construction and will boast a boutique look, with wood floors, custom fixtures etc. The owners would like to use bits and pieces of color from the logo to compliment the interior.</p>
    <p>target: Indian decent women (18-40) who have minimal desire to travel abroad to shop for special events/ weddings. </p>
    <p>The logo will be used in full color, and needs to read well from the signage. approx 6x 12 feet.</p>
    <p>any creative direction would help. type, color, logo ideas etc.... </p>
    <p>Thanks in advance guys!</p>
    <p>Zed.</p>
