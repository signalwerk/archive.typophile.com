    <div class="info">Submitted by <a href="/web/20080828171010/http://typophile.com/user/11526" title="View user profile.">Goran Soderstrom</a> : 14.Jun.2008 3.28am </div>
      <p>Dear Typophile,</p>
    <p>You may or may not know that I’ve been working on a typeface family called Exemplar for the past years but today I’m happy to tell you that this typeface family is released and available via the website of PSY/OPS in San Fransisco. Totally eight weights with a lot of OT-features.</p>
    <p></p><div class="imageWrap"><img src="/web/20080828171010im_/http://typophile.com/files/exemplarpro_5810.jpg"></div><p></p>
    <p>This project has been very dear to me and it feels like giving up a child or something now when it’s finally released.</p>
    <p>I’ve prepared a PDF specimen that shows the family and its OpenType features together with some other information.</p>
    <p>Exemplar Pro, english version:<br>
