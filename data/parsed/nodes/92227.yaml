    votes: 0
    html: |-
      <p><cite>Is there a way to attach another "digit" so it can count even higher?</cite><br>
      of cource: example: insert next code for the calt to go to 15: just complement the numbers to go to the count you wish. You also need to make more versions of each character if you do this…</p>
      <p>feature calt { # contextual Alternates<br>
      sub n n' by n.alt2;<br>
      sub n.alt2 n' by n.alt3;<br>
      sub n.alt3 n' by n.alt4;<br>
      sub n.alt4 n' by n.alt5;<br>
      sub n.alt5 n' by n.alt6;<br>
      sub n.alt6 n' by n.alt7;<br>
      sub n.alt7 n' by n.alt8;<br>
      sub n.alt8 n' by n.alt9;<br>
      sub n.alt9 n' by n.alt10;<br>
      sub n.alt10 n' by n.alt11;<br>
      sub n.alt11 n' by n.alt12;<br>
      sub n.alt12 n' by n.alt13;<br>
      sub n.alt13 n' by n.alt14;<br>
      sub n.alt14 n' by n.alt15;<br>
      sub n.alt15 n' by n;<br>
      } calt;</p>
      <p><cite>Could this be (ab)used for printing sequentially-numbered tickets, etc.?</cite><br>
      Can you give an example? I don't know exactly what you have in mind…</p>
