      <p>@ JamesM: A flipper font is a font with every character multiple times, with in every version of that character (little) differences. This is done so there is more variation in the text.<br>
      The program is detecting that a character is used, and then uses the next version, and then the version thereafter till they are all used. Then it starts again.</p>
      <p>@ Nick Shinn: thanks for the reply.<br>
      However, flipper fonts are not freeware (I didn't find one). Otherwise I had done it that way.<br>
