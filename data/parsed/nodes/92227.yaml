      <p>Maarten — Did you do what Oldnick suggested in your first post on this topic?: <a href="http://typophile.com/node/92072#comment-505839">http://typophile.com/node/92072#comment-505839</a></p>
      <p>Also, you need to put this in {calt} not {salt}. So the first line of the code should be<br><code>feature calt {</code><br>
      (and the closing would match, of course)</p>
      <p>James — The term “flipper font” was first coined by the Letterror boys (Erik van Blokland &amp; Just van Rossum) for their <a href="http://www.letterror.com/foundry/kosmik/index.html">Kosmik</a> font, which originally did this in Postscript format, with some <a href="http://www.letterror.com/foundry/kosmik/technote.html">clever programming</a>, before OpenType layout features.</p>
