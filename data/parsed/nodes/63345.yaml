    <p>My new side project.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Mode-pic_4193.gif"></div><p></p>
    <p>This was the result of another type experiment. I wondered how it would look if I took the underlying architecture of <a class="freelinking external" href="http://www.typophile.com/node/55891" rel="nofollow">Mint</a> and made a rounded, extended version. The forms are boxy and the junctures follow the same rules as Mint.</p>
    <p>I wanted to reconcile 'flared' with 'monoline', so most of the stroke contrast from Mint has gone, leaving the quite interesting blobbiness in the counters and on the terminals. </p>
    <p>I haven't yet really thought about spacing or kerning so I haven't put a sample of running text. And of course with my lack of skill at numerals, those haven't appeared yet.</p>
    <p>I think this might work mainly for titling and/or small bits of text like addresses. I plan to try a bolder weight which may be more suitable for words in sentences.</p>
