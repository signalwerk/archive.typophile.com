      <p>Hum, yeah, I guess I do take a fractal approach to things, life is like that for me. One thing branches off another, everything has a cause and effect...this side project could quite easily spawn a whole lot of new avenues for me. It could be hard coming up with four-letter M-names though ;)</p>
      <p>I think turning all the angles into curves would make this really predictable. The interest for me is in following the rules I had for Mint, but adding in the rules about contrast, width and terminal shape. The capital K was the inspiration for this, it came to me when waking up one morning before getting out of bed (funny first thought I know!) and I think it works beautifully. The sharpness on its juncture stops it clogging too much, allowing three interesting counterspaces. But who knows, there could be another branch of this family where there are no sharp counters anywhere.</p>
      <p>At some point one needs to stop branching sideways and start finishing endings.</p>
