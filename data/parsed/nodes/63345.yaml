      <p>Glad you like it :)</p>
      <p>Erm, not sure whether this will turn into a font. I like the clean sharp tone but I'm not sure whether it reminds me of something else (Whitney? Bliss? Interstate?). I'm enjoying these little experiments so I'll keep going for at least enough letters to make sentences.</p>
      <p>Yes, some of the letters need a bit more thought. I only had the concept on the bus yesterday and so the forms are still not quite there. The g and y especially aren't quite working and e is too wide. I'm not sure about the widths. To me it looks like u, o and n are quite wide but then perhaps the other glyphs need widening instead. Not sure yet.</p>
      <p>The b and d are intentionally different and p and q will follow the same pattern. As with the original font, Mint, I wanted to create tension between the spurred and spurless forms, and I rather think here they look good mixed like that. d might need a bit more thinning where the bowl meets the stem.</p>
    html_clean: |-
