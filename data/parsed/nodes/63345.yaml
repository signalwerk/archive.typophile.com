      <p>Yes, it seems to be the balance to be struck here is being blobby enough to be interesting but avoiding distracting spottiness; I imagine the solutions will come from visual judgements about specific letterforms rather than consistent rule application. </p>
      <p>Of course the acute angles will be tough, and your M and N do come off as spotty. Is there something you can do to pull apart those vertices (a kind of IVI treatment)? - but then how do you round the top, right? (That treatment of the top of M is something I'm still perplexed by for my Emi.)</p>
      <p>Love the J, O, D, K, r. That D hits it just right. The X intersection isn't lining up for me.</p>
      <p>I think the armature of a wide monoline sans (like an extended light Univers) is a *great* one to hang this treatment on. The effect is a bit like hand-drawn type (where the blobbiness at the stroke ends come from a pen starting or stopping). Very appealing.</p>
