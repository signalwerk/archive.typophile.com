      <p>Type aside, there's some general geometry/scale things you can do to improve things.</p>
      <p>I'd move '11th Annual' and '2013' to the interiors of the arched type, and then enlarge the arched type as you move it out to the edge. Also match the curve of the type with the can (you'll likely need some judicious letterspacing). </p>
      <p>As a logo, it's nice idea. I don't know if the pull-tab is relevant anymore, but that likely depends on the age demographics of your audience. ;) </p>
      <p>I'd maybe beef up the lines a bit, though (and likely go without the outlined type) for pragmatic reasons (easier to print on a T-shirt, for example)</p>
