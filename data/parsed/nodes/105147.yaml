      <p>I like the concept, but as aluminum mentioned there are some scale problems. If "beer open" is the title of the event, it should be the biggest element, right now it's fighting "seven bridges" for attention. And I'd avoid outline type. And I'd curve the "2013" baseline if all the other type is curved. </p>
      <p>Not sure if I agree with moving "11th annual"; while it has advantages from a layout standpoint, it might seem like you're saying "beer opening 11th annual" which is awkward phrasing. Maybe it would be okay, I'm not sure.</p>
