    <p>Hi everyone,</p>
    <p>it’s been a while I’ve been on this site, but I need your help.</p>
    <p>The following is my logo for a High-end Spa - (french for the word ’calm’). I’m using a handwritten font from the Sudtipos Mister/Mrs pack. I basically added a stroke and adjusted the kerning between the L and the M.</p>
    <p>The target market is women from old money, who don’t work and can get facial treatments during the day.</p>
    <p>The interior of the spa has many patterns with low contrast. Almost everything has pattern, so the applications I will be using (menu, business card, etc) will mostly have patterns.</p>
    <p>I need to keep the font in the same general direction since I’ve presented and the client approved. I cannot scrap the direction, but I just feel something is missing right now....</p>
    <p>———————-</p>
    <p>I wanted to know:</p>
    <p>1- Do you enjoy the logo overall?<br>
    2- Is there a font you may suggest other than the one used? Something similar.<br>
    3- Any other suggestions?</p>
    <p>Thanks, it’s much appeciated!</p>
    <p>———————</p>
    <p>*Note: I tried a couple of more samples with some Caps throughout the logo. I like the top-right sample, but I can’t justify using a capital L.</p>
