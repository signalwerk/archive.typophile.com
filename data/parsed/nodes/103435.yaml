      <p>Hand drawn but a good rendition. Columbus was designed by Herman Ihlenburg, patented by him in 1892, and sold by MacKellar/American Type Founders.<br>
      For persons not familiar with the Solopedia, it is currently updated monthy by "Character" -- see usenet newsgroup alt.binaries.fonts and is also on the web at the location noted by fvilanakis .<br>
      For anyone interested in the patent it's D22021 which is online at Google Patents and the US Patent Office. Here is the character set shown in the patent:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/D22021_1892Ihlenburg@MacKellar_Columbus_5429.jpg"></div><br>
      Don<p></p>
