    html: |-
      <p>It looks like <strong>Columbus</strong> font of Solopedia catalog.<br>
      As you can find here:<br>
      <a href="http://abfonts.freehostia.com/solopedia/solopedia-c.htm" title="http://abfonts.freehostia.com/solopedia/solopedia-c.htm">http://abfonts.freehostia.com/solopedia/solopedia-c.htm</a><br>
      there are many other digital versions of this font:<br>
      <strong>Columbus</strong> (Sam Wang, Brendel/B&amp;PGraphics),<br>
      <strong>Wedgewood</strong> (Brendel),<br>
      <strong>Deneane</strong> (FontBank),<br>
      <strong>Cowan</strong> (Opti),<br>
      <strong>C790 Deco</strong> (Softmaker),<br>
      <strong>Tringle</strong> (WSI),<br>
      <strong>Jazzy 50</strong> (Fantazia),<br>
      <strong>Beaumarchais</strong> (Scriptorium)</p>
      <p>...and an interesting note:</p>
      <blockquote><p>Tom Phinney is developing a high-quality version named Cristoforo.<br>
      Original design is by Ihlenberg, 1892.</p></blockquote>
      <p>Is Tom Phinney actually completed his <strong><a class="freelinking external" href="http://www.thomasphinney.com/2012/05/cristoforo-lives-kickstarter-ntern/" rel="nofollow">Cristoforo</a></strong> font?<br>
      I really don't know...</p>
