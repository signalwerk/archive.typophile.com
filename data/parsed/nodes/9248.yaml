    date: 2005-02-16T08:48:00
    date_raw: 16 Feb 2005 — 8:48am
    votes: null
    html: "<p>Ok, I believe this is a face called <i>Alfa Sans</i>,   or <i>Alpha Sans</i>, depending on who you ask, and it was <br> designed by <a href=\"http://www.brandnewschool.com/faculty.php?&amp;fID=18\">Jens Gehlhaar</a> of <a href=\"http://www.brandnewschool.com\">brandnewschool.com</a>. (Bonus trivia: Who studied at the same  <br>obscure German design school I'm currently at.) <br> <br>Lead #1: I dug around and found <a href=\"http://www.typophile.com/forums/messages/83/782.html?1018479939\">this</a> ancient thread. I believe the sample posted is a black cut of our <br> mystery typeface. <br> <br>Lead #2: The very same <a href=\"http://www.adamsmorioka.com/\">team of designers</a> who designed the book our sample was taken from  <br>submitted <a href=\"http://www.aiga.org/content.cfm?contentalias=365_infodes_detail_2003&amp;csi=429\">a different publication</a> to the AIGA in 2003. The typeface used for that publication, <br> according to the AIGA website, is <i>Alpha Sans Beta</i>.  <br> <br>Coincidence? <i>I think not!</i> (Cue X-Files theme)</p>"
    html_clean: "<p>Ok, I believe this is a face called <i>Alfa Sans</i>,   or <i>Alpha Sans</i>, depending on who you ask, and it was <br> designed by <a href=\"http://www.brandnewschool.com/faculty.php?&amp;fID=18\" class=\"link-external\">Jens Gehlhaar</a> of <a href=\"http://www.brandnewschool.com\" class=\"link-external\">brandnewschool.com</a>. (Bonus trivia: Who studied at the same  <br>obscure German design school I'm currently at.) <br> <br>Lead #1: I dug around and found <a href=\"http://www.typophile.com/forums/messages/83/782.html?1018479939\" class=\"link-lost\">this</a> ancient thread. I believe the sample posted is a black cut of our <br> mystery typeface. <br> <br>Lead #2: The very same <a href=\"http://www.adamsmorioka.com/\" class=\"link-external\">team of designers</a> who designed the book our sample was taken from  <br>submitted <a href=\"http://www.aiga.org/content.cfm?contentalias=365_infodes_detail_2003&amp;csi=429\" class=\"link-external\">a different publication</a> to the AIGA in 2003. The typeface used for that publication, <br> according to the AIGA website, is <i>Alpha Sans Beta</i>.  <br> <br>Coincidence? <i>I think not!</i> (Cue X-Files theme)</p>"
