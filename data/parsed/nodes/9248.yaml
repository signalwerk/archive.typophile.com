    html: <p>Mike, I'm with you -- I've been looking through books and websites for several hours straight now, it's driving me mad! <br>Not to mention that I should be working instead.. <img src="http://www.typophile.com/forums/clipart/uhoh.gif" border="0"> <br> <br>I still feel like I've seen this before though, and I really hope someone recognizes it.</p>
  - id: 59937
    user_id: 2181
    user_name: franz
    user_path: null
    user_image: null
    date_raw: 16 Feb 2005 — 8:48am
    date: 2005-02-16T08:48:00
    votes: null
    html: "<p>Ok, I believe this is a face called <i>Alfa Sans</i>,   or <i>Alpha Sans</i>, depending on who you ask, and it was <br> designed by <a href=\"http://www.brandnewschool.com/faculty.php?&amp;fID=18\">Jens Gehlhaar</a> of <a href=\"http://www.brandnewschool.com\">brandnewschool.com</a>. (Bonus trivia: Who studied at the same  <br>obscure German design school I'm currently at.) <br> <br>Lead #1: I dug around and found <a href=\"http://www.typophile.com/forums/messages/83/782.html?1018479939\">this</a> ancient thread. I believe the sample posted is a black cut of our <br> mystery typeface. <br> <br>Lead #2: The very same <a href=\"http://www.adamsmorioka.com/\">team of designers</a> who designed the book our sample was taken from  <br>submitted <a href=\"http://www.aiga.org/content.cfm?contentalias=365_infodes_detail_2003&amp;csi=429\">a different publication</a> to the AIGA in 2003. The typeface used for that publication, <br> according to the AIGA website, is <i>Alpha Sans Beta</i>.  <br> <br>Coincidence? <i>I think not!</i> (Cue X-Files theme)</p>"
