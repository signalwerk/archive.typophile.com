    date: 2005-02-18T20:35:00
    votes: null
    html: <p>Apparently Jens Gelhaar has a lot of output that is not getting into circulation, but I did find one of his fonts that is a bit similar in some features to this one. It is called <a href="http://www.identifont.com/show?BNW" target="_blank">Cornwall</a>. I followed the link to the Apply site, but they don't help you find Gelhaar's works. I cycled through most of their offerings and thought Cornwall was the most like Alfa (Alpha?) Sans.</p>
