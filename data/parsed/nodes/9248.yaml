    html: <p>Did you hunt around in the book credits for any mention of typefaces used? In graphics books this is more likely than in normal 'Trade' books, it seems to me. <br> <br>I have been searching Sans Serif fonts since you posted this, and I have not been able to find it. I'm starting to wonder if this could be a freeware font, created by selective 'mutilation' of something like Meta, or Officina, as Tiff suggested.</p>
