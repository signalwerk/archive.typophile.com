  - id: 59935
    user: 2088
    date: 2005-02-15T14:18:00
    date_raw: 15 Feb 2005 — 2:18pm
    votes: null
    html: <p>I'll tell you how bad this is getting to me - I'm starting to see pieces of it in different places. The 'y' looks like Conduit. The 'g' look like News Gothic. And most of the rest of the letters look like they could be made from <a href="http://www.myfonts.com/fonts/urw/transport/d-medium/testdrive.html?s=unteraly+saged+fiber&amp;p=48" target="_blank">URW Transport</a> by adding some square-cornered terminals, and some straight line segments in places (like the 'a'), and then removing the stems on a few letters, like the b &amp; d (or get them from FF Dax). The 'e' (most common letter) would be the one with the most 'mutilation', but it seems like it would be easy. <br> <br>I think this was a customized font. The 'e' and 'a' look too clumsy for something that seems so nicely weighted and kerned. Tranport has many of the right letterforms, and it sure has a very similar 'feel' to the sample type. <br> <br>I think I need to go think about something else, this is making me paranoid, or something!</p>
