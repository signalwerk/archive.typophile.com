    <p>I have designed some computer wallpapers and would really like some feedback on them! I am also thinking about putting these into print and start selling them to a niche market on the internet. So, I need to know if what I'm designing is complete crap that won't sell. Any feedback would be greatly appreciated. There are four of them live right now. <a href="http://bryanthomas.me/wallpaper/" rel="nofollow">Check them out here!</a></p>
    <p>Thanks!</p>
