  html: |-
    <p>I've been seeing a few variations of serif display faces that bump the thick/thin contrast to the point where the thin strokes disappear. Dala Floda is such an example. <a href="http://commercialtype.com/typefaces/dala_floda" title="http://commercialtype.com/typefaces/dala_floda">http://commercialtype.com/typefaces/dala_floda</a></p>
    <p>While Dala Floda fits the bill, I've seen some more sinewy and sexy examples. Any suggestions?</p>
