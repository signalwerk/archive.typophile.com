    <p>—</p>
    <p>NUMBERS: Fifteen new fonts from H&amp;FJ<br>
                  <a href="http://www.typography.com/">http://www.typography.com/</a></p>
    <p>     The world is filled with recognizable and unique numbers that<br>
         have never been available as typefaces — until now. Created<br>
         for the 2006 Pentagram Calendar, NUMBERS is a set of fifteen<br>
         fonts adapted from familiar digits, from playing cards to<br>
         brownstones to the U. S. dollar.</p>
    <p>     Each set of numbers comes with a supporting cast of characters<br>
         both appropriate to its origins and indispensable to designers,<br>
         perfect for magazine covers, annual reports, stationery<br>
         systems, charts and checklists, street signs, calendars and<br>
         timetables, and more…</p>
    <p>     <a href="http://www.typography.com/catalog/numbers/">http://www.typography.com/catalog/numbers/</a></p>
    <p>—</p>
