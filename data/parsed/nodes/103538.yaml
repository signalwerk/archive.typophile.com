      <p>I'm not a vegetarian so my reaction probably isn't what you intended, but here are a few suggestions.</p>
      <p>The lighting is too flat. Normally food photography is done with a much softer light, and is angled to create highlights and shadows for a 3D look. Perhaps you feel a harsher look is more appropriate, but I would experiment to see if the lighting can be improved. Also the lighting doesn't seem totally consistent from letter to letter.</p>
      <p>Also consider adding a slight shadow on the page to make them look more like 3D objects rather than cutouts. Some blood might help; maybe photograph it on a slight angle so the blood is running down the page. And maybe add a bloody knife.</p>
    html_clean: |-
