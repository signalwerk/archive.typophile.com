    html: <p>I think it is an old typeface called Pastel, which was used often in silent movies. Ray Larabie did two fonts based on it called <a href="http://www.myfonts.com/fonts/typodermic/silentina/" rel="nofollow">Silentina Film and Silentina Movie</a>. The "Movie" version is the closer match of the two.</p>
