    html: |-
      <p>Info on the author of Oak Wood as of 2008 from <a href="http://www.fontage.com/foundry/jpearson.html" title="http://www.fontage.com/foundry/jpearson.html">http://www.fontage.com/foundry/jpearson.html</a><br>
      "I am the original author and creator of these fonts. From 1991 to around 1994, I made these typefaces as a labor of love... a little money here and there from the (then, before the internet made a big splash on the world) shareware world."<br>
      "Today, I've updated these typefaces to show my web and email addresses. I've not changed anything about the designs - errors and foibles still present :-). My typefaces are interesting, unique, and original... perhaps not Foundry material (doesn't bother me)... just good clean font fun for the family!"<br>
      Link to his website now redirects to a singer.<br>
      Don</p>
