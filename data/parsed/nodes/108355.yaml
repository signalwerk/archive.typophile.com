    html: |-
      <p>Oak Wood has an earlier internal font date and its numbers are in same style as its alphabet. Pompeii Caps has a different style alphabet and, when adjusted to same scale as Oak Wood [i.e. reduced 91.892%], its numbers and other non alphabet characters are a point for point match with Oak Wood. I suggest Oak Wood is probably an original work -- I have not seen it elsewhere -- and Pompeii Caps is a copy, except for the uppercase letters A to Z.<br>
      Don</p>
