      <p>I believe I have found the origin of the letters, numbers etc. in Jim Pearson's OakWood. Check out the lettering for "round hand" in pages 43 to 78 of<br>
      _The Calligraphy Workbook: How to Master Broad Pen Script_<br>
      by George Thomson, Sterling Publishing Co., Inc. New York 1985 ISBN 0-8069-7262-9. First published in 1985 in the U.K. by Thorsons Publishing; ISBN-10: 0722511868<br>
      ISBN-13: 978-0722511862<br>
      Purchase, in U.S.A., url for other countries will vary: <a href="http://www.amazon.com/The-Calligraphy-Workbook-Master-Script/dp/0722511868" title="http://www.amazon.com/The-Calligraphy-Workbook-Master-Script/dp/0722511868">http://www.amazon.com/The-Calligraphy-Workbook-Master-Script/dp/0722511868</a> or e-Bay. Library LOC Z43.T478 1985 Dewey 745.6' 1977--dc20.</p>
