    <p>Time to put this one on the chopping block...Last time I did this it was my old “Custom” type logo. This time it’s a personal logo that I’ve been working on for a long time. I * think * it’s finished. Do you?</p>
    <p>Context: This is a logo for me as a person, and as an artist. I wanted to create a simple, one color mark (for now...I’m ol’ school that way) which incorporated my initials (d + m), and also spoke to an abstract idea of my belief that I’m both physical (the shape of the M) and yet directly linked to a spirit (the curving shape of the ’d’, which, yes, does resemble a flame...I love a good flame job on anything, and fire has a spiritual connection, too).</p>
    <p>Technically, (for what it’s worth) I’ve built a little ink trap into the middle of the ’m.’</p>
    <p>Fire away, comrades. Tossing this into the wonderful fray of the Typophile community signifies a final group review on this thing before I implement it (tattoo, business cards, etc.)</p>
    <p>Thanks in advance for your raw feedback.</p>
    <p>Dylan</p>
