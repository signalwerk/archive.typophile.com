      <p>Dylan,<br>
      Nice mark. I like the concept, but feel it’s a bit unbalanced. The D has much more visual weight than the M. I think lengthening the 3D M and sharpening the baseline angles might add some weight and balance. </p>
      <p>I like the play on the physical/spiritual in the mark, but a part of me still wants to see the M take on a more organic shape. The D is so striking, that the M pales in comparison.<br>
      My two cents.</p>
      <p>— tomás</p>
