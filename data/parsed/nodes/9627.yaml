    html: <p>Mariano, you have been patient. I have looked through samples from T-26 (the first place I look for Techno fonts), but this could be newer than my sample sheets.  Have you checked the Techno fonts at <a href="http://www.dafont.com" target="_blank">DaFont</a> for the freeware fonts? (one of the best freeware sites, and one of the very few that sorts fonts by style categories). <br> <br>I also checked the two Indie Font books, but no luck there.  <br> <br>Maybe this post will re-awaken this thread. I think it looks familiar, but that is (for me) the problem with Techno fonts -- too many of them look like one another. <br> <br>I guess that's what Tech fans would say about Text fonts <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
