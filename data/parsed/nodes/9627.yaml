    html: <p>I think it is a matter of personal taste Mariano. Personally, since the R seems to be consistent with the design 'theme' of this font, I think it fits, and is as good (or bad) as the rest of the font that we can see. <br> <br>If you like this style, do not let us convince you not to like it.  How you use it can be more open to criticism than how the letters look, as long as they seem true to the design for the typeface. (In my opinion)</p>
