    <p><a href="//www.outrasfontes.com/gaia.htm" rel="nofollow"></a></p><div class="imageWrap"><a href="//www.outrasfontes.com/gaia.htm" rel="nofollow"><img src="http://typophile.com/files/gaia-apres_3465.gif"></a></div><p></p>
    <p>Hi there. </p>
    <p><a href="//www.outrasfontes.com/gaia.htm" rel="nofollow">Gaia</a> is the first dingbat series made by Ricardo Esteves Gomes,<br>
    from <a href="//www.outrasfontes.com" rel="nofollow">Outras Fontes</a>.</p>
    <p>Each glyph in this font was designed to be used as single forms or as graphic pattens. When repeated several times, they create some interesting optical effects. Their organic shapes gives a nice feeling of nature that I hope it can be useful for your artworks.</p>
    <p>:)</p>
