    <p>Hi all,</p>
    <p>I'm looking for a typeface to set a corporate logo (and general text, though this could be a complimentary font) for the financial sector, and the company name contains an ampersand.</p>
    <p>Wondered if anybody had any particular favourites up their sleeve with a great ampersand?</p>
