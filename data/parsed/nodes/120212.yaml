    html: |-
      <p>Looks like old time poster lettering.<br>
      The letter-forms are similar to Quaint Gothic from the Dickinson Type Foundry in Boston USA circa 1900. Also known as Desdemona by the K.K. Hof &amp; K. Brendler Foundry.<br>
      Digital Quaint Gothic SG <a href="http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/" title="http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/">http://www.myfonts.com/fonts/spiecegraphics/quaint-gothic-sg/</a><br>
      Also Desdemona Black <a href="http://www.will-harris.com/store-h/desdemona.html" title="http://www.will-harris.com/store-h/desdemona.html">http://www.will-harris.com/store-h/desdemona.html</a><br>
      Don</p>
