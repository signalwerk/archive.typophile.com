    html: |-
      <p>Even if I have to agree with Nick Cooke, I guess it would possible to find a decent alternative for this one, may be simply customizing /G (removing horizontal bar and adding a flare serif by slightly curving bottom right part).<br>
      Some suggestions <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova/" rel="nofollow">Proxima Nova Black</a> (mixing Regular, Condensed or Extra Condensed), <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/ff-profile/" rel="nofollow">Profile</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/gibson/" rel="nofollow">Gibson Bold</a>, <a class="freelinking external" href="http://www.typography.com/fonts/font_overview.php?productLineID=100008" rel="nofollow">Gotham</a> (also mixing styles Regular, Narrow, Extra Narrow...), <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/polarband/" rel="nofollow">Polarband</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ef-typeshop/montreal/" rel="nofollow">TS Montreal</a> or even a manipulated <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/futura/" rel="nofollow">Futura Extra Bold</a> (but you'd have to entirely redraw /G or to borrow it from one of the previous')</p>
