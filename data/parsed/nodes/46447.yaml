    <p>Greetings all!</p>
    <p>Below are some sketches for a new serif font that for the moment is called Ibis. It is inspired by ancient Egyptian art and architecture, though it's not based on any specific model. I did not start on it with any particular function in mind, though I guess it might find use as a display font.</p>
    <p>This is my first serif typeface, and my motivation for it is partly to learn, so any and all feedback is welcome.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ibis_draft_4680.gif"></div><p></p>
