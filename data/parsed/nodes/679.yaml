  html: "<p>As you may know, Typophile HQ is in San Francisco. You  <br>can bet we'll get involved as much as we are able. <br> <br>It will be great to see what locals show up. <br> <br>Here's an incomplete list of type designers / foundries in the Bay Area: <br> <br>Jim Parkinson <br>Mark van Bronkhorst <br>FontShop / Erik Spiekermann <br>Delve Withrington <br>Typebox <br>Psy/Ops <br>Test Pilot Collective <br> <br>Who else?</p>"
