  html: |-
    <p>Greetings,</p>
    <p>I am creating a website about printer / typographer John Fass, who was from my hometown of Lititz, PA.</p>
    <p>I am trying to identify the names of some 1960s Typophiles who appear in some photos taken by A. Burton Carnes and others.</p>
    <p>I temporarily loaded images here:<br>
    <a href="http://www.yourantiques.com/TypophileFotos.html" title="http://www.yourantiques.com/TypophileFotos.html">http://www.yourantiques.com/TypophileFotos.html</a></p>
    <p>If anyone can identify any of these Typophiles, I would certainly appreciate it.  (One of these guys seems to be Paul Bennett.)</p>
    <p>Thanks,</p>
    <p>Lee Stoltzfus<br>
    Lititz, PA</p>
    <p>My printing history website:<br>
    <a href="http://www.lancasterlyrics.com" title="http://www.lancasterlyrics.com">http://www.lancasterlyrics.com</a></p>
