      <p>If you’re certain that Paul Bennett is among these, then I’m pretty sure he would be #9.</p>
      <p>It’s a little hard to tell from a profile. The best image I have is head-on (from his “Pi Channel” column in <em>Publisher’s Weekly</em>). I have another where PAB is identified in profile, but that image is not as good. Still, I’m pretty sure that this is the same person as your #9.</p>
      <p>HTH.</p>
