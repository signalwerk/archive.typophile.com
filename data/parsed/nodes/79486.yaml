    html: |-
      <p>English, like Hebrew, is read top to bottom.<br>
      But first, we read English from left to right,<br>
      and read Hebrew from right to left.</p>
      <p>So, the order for English is first<br>
      left to right,  and then<br>
      top to bottom, or the next line under it,  and then<br>
      to the very left of the line to the extreme right,  and so on.</p>
      <p>So, the order for Hebrew is first<br>
      right to left,  and then<br>
      top to bottom, or the next line under it,  and then<br>
      to the very right of the line to the extreme left,  and so on.</p>
      <p>I believe Japanese is as you describe,<br>
      first top to bottom, to the very bottom of the line,  and then<br>
      right to left,  to the next line on the top,  and then<br>
      top to bottom, to the very bottom of the line,  and then<br>
      right to left,  to the next line on the top, and so on.</p>
      <p>The order of the letters of your name is spelled correctly.<br>
      But Hebrew names are usually spelled from right to left.</p>
      <p>For design or 'coolness', a name can be spelled in a curve.</p>
