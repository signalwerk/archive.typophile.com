      <p>Some software can position the letters around the top part of a curve or semi-circle. Then, you make a PDF file or a .JPG file, and a tatoo is made from that.</p>
      <p>Here is an example, using Adobe InDesign.</p>
      <p>The text can wrap around an invisible object, or around a visible object, like a soccer ball, or violin, on the left, or the right etc.</p>
