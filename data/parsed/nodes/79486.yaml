      <p>This design is like Vilna-Poster. It was first popilarized by LetraSet, as peel-down lettering, and later made into a font by FontWorld (<a href="http://www.FontWorld.com" title="www.FontWorld.com">www.FontWorld.com</a>) and others.</p>
      <p>As a font for tatoo on skin, the thin strokes might not appear clear, or rub away partially over time.</p>
      <p>I created this as the thinner strokes are more distinguished, and somewhat more thicker.</p>
