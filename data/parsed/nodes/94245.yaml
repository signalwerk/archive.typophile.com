      <p>John Hudson and Theunis de Jong,</p>
      <p>First let me thank both of you for your replies.</p>
      <p>@John Hudson</p>
      <p>&gt;&gt; No, this isn't a bug. My understanding is that the font would only require an encodingID 10 name table if one or more name entries required use of supplementary plane Unicode characters and hence a format 12 subtable. The different encoding options for the name table cover the encoding needs of the name table entries, which are independent of the cmap subtables that cover the encoding needs of text set in the font. &lt;&lt;</p>
      <p>I have to disagree with you on this John. Take for example the fonts "MT Extra" and "Symbol". These are symbol fonts as you probably know, and so, none of their "characters" will ever be present in the <cite>name</cite> table. Nevertheless, the encodingID = 0 is the only one present in this table for both fonts, for all platforms. Also, if you consider the fonts that have Unicode points above 0xFFFF, all of them, as far as I know, have encodingID = 10 present in their <cite>name</cite> tables for the Windows platform, with the exception of the "Cambria Math" font. My feeling is that this a bug, although a minor one, as you really don't need this information in the <cite>name</cite> table.</p>
      <p>&gt;&gt; PS. What tool are you using to examine the table entries? Are you able to look within a TTC, or are you breaking the Cambria TTC apart somehow? &lt;&lt;</p>
      <p>I have developed a small C++ program to parse this <cite>name</cite> table for any font specified by the user.</p>
      <p>@Theunis de Jong</p>
      <p>&gt;&gt; John, does that mean that the Encoding 10 name entry in MS Mincho actually contains these supplementary characters? &lt;&lt;</p>
      <p>If you look at the names for the MS Mincho font on the screen shot above, you'll notice that there are characters that were printed as invalid. I presume those characters correspond to this encoding in the MS Mincho font. But there is one thing here I didn't understand : I used the font Arial to print the reports shown on those windows. As far as I can understand, the function TextOut() that I used to print those lines, should print the correct japanese characters, by just using the font fallback mechanism present in the Windows API. But apparently, that didn't happen ! Why ?</p>
