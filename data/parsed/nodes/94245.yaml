      <p><em>But then, how do you justify the encodingID = 0 for the MT Extra and Symbol fonts ?</em></p>
      <p>I don't justify anything that was ever done in a symbol font made by anyone. It looks, based on your description of these and other fonts, as if either Monotype or Microsoft may at one time have had a policy to include a name table encodingID to match cmap coverage, regardless of whether this was actually needed in the name table entries.</p>
