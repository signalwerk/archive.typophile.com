      <p>You may be right. After thinking a little bit more about what you said ("My understanding is that the font would only require an encodingID 10 name table if one or more name entries required use of supplementary plane Unicode characters and hence a format 12 subtable"), I have to agree that this is more reasonable. But then, how do you justify the encodingID = 0 for the MT Extra and Symbol fonts ?</p>
      <p>There is one other thing that surprised me in relation to the  "msmincho.ttc", the TTC font file for the MS Mincho font. The TTC header present in this file is as follows :</p>
      <p>TTC Tag               ttcf<br>
      version                 0001 0000<br>
      numFonts            0002<br>
      OffsetTables[0]    0000 0020 [1]     0000 018C<br>
      ulDsigTag            DSIG<br>
      ulDsigLength      0000 1B98<br>
      ulDsigOffset        0099 59FC</p>
      <p>From this <a class="freelinking external" href="http://www.microsoft.com/typography/otspec/otff.htm" rel="nofollow">Open Type spec</a> you'll find this assertion : "There are two versions of the TTC Header: Version 1.0 has been used for TTC files without digital signatures. Version 2.0 can be used for TTC files with or without digital signatures -- if there's no signature, then the last three fields of the version 2.0 header are left null."</p>
      <p>Shouldn't then the version number for this font collection be 0002 0000, instead of 0001 0000 ?</p>
