    <p>In the figure below, you'll see a screen shot of two windows showing the Open Type "name" tables for the "MS Mincho" and the "Cambria Math" MS fonts.</p>
    <p>If you consider the platformID = 3 (Windows fonts) on both results, you'll see that the "MS Mincho" font shows correctly, names for the encodingID = 1 (Unicode BMP UCS-2) and 10 (Unicode UCS-4). But the "Cambria Math" font only shows encodingID = 1. It doesn't show the encodingID = 10 names. I know for sure the "Cambria Math" font has both encodings. Is this a bug ?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nameCambria Math_5137.png"></div><p></p>
