      <p><em>Also, if you consider the fonts that have Unicode points above 0xFFFF, all of them, as far as I know, have encodingID = 10 present in their name tables for the Windows platform, with the exception of the "Cambria Math" font. My feeling is that this a bug, although a minor one, as you really don't need this information in the name table.</em></p>
      <p>I classify bugs as things that are contrary to the spec and/or produce unwanted behaviour. To my knowledge, neither is the case here. If it is so that other fonts containing supplementary plane coverage in their cmap tables also provide encodingID 10 name table encoding, I'm much more inclined to see this as unnecessary bytes in those fonts than as bug in Cambria Math.</p>
