    html: |-
      <p>No, this isn't a bug. My understanding is that the font would only require an encodingID 10 name table if one or more name entries required use of supplementary plane Unicode characters and hence a format 12 subtable. The different encoding options for the name table cover the encoding needs of the name table entries, which are independent of the cmap subtables that cover the encoding needs of text set in the font. So in the case of a font like Cambria Math, the character set of the font includes supplementary plane characters (hence, cmap format 12 subtable (it also has a format 14 subtable, the first I've had to make)) but the name table entries do not make use of any of these characters.</p>
      <p>Or am I misunderstanding your question?</p>
      <p>PS. What tool are you using to examine the table entries? Are you able to look within a TTC, or are you breaking the Cambria TTC apart somehow?</p>
