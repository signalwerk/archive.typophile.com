      <p>How do you know "for sure" Cambria Math has Encoding 10 names? I can't see those in the version I have.</p>
      <p>Perhaps it's not necessary for a font to contain enc.10 names even if it <em>does</em> contain an encoding 10 in the cmap. Of that, the specs say</p>
      <blockquote><p>... If the font is meant to support supplementary Unicode characters, it will additionally need a Format 12 subtable with a platform encoding ID 10. ...</p></blockquote>
      <p>... and these supplementary characters are typical for a CJK font but not for a math font. Hold on, I'm going to check what cmap encodings are in Cambria Math.</p>
      <p>(Edit) Okay, Cambria Math also contains a 3/10 encoding, so that's not the reason.</p>
      <p>Well, I cannot recall from the specs that says every cmap encoding needs to have a corresponding name entry.</p>
