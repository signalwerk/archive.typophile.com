    <p>NULL &amp; .null in the same font.: if this happens, will something bad occur?</p>
    <p>First of all, I know NULL is the proper null, not .null or any other kind of null.</p>
    <p>Of course, some people will want to chime in and tell me that they think bad things may occur and how it's not to spec but what I want to know is if anyone knows something specifically bad which may occur. Even better, reports of problems which have occurred in fonts with multiple nulls.</p>
    <p>Also: what about the NUL which appear as the first glyph in the MacOS Roman table? What's its function? Can it exist alongside NULL? What's the point of NUL.</p>
