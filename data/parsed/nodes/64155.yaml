      <p>[Slaps forehead.] I actually looked at the FontLab manual where it talks about that option before I wrote the above. Somehow I only saw "NULL" and looked right past ".null". Thomas is correct. Also, it looks like ".null" and "NULL" are the same thing.</p>
      <p>This raises an interesting question, though. The FontLab manual states that only ".notdef" and "space" are required in Windows TrueType fonts, but that "CR" and "NULL" are also required in Mac TrueType fonts. Presumably, this means Mac TrueType resource-based fonts that are generated in suitcase files, a format that is effectively becoming extinct with the advent of Mac OS X, which can use Windows TrueType fonts (and OpenType fonts by extension).</p>
      <p>So, unless you are generating TrueType fonts as a Mac suitcase file, you probably don't need ".null" (or "CR" for that matter), since they are not required by Windows TrueType fonts, which work perfectly well on Mac OS X. And, according to Adobe's <a href="http://partners.adobe.com/public/developer/opentype/afdko/topic_feature_file_syntax.html#4.e">OT Feature File Syntax spec</a>, which is the thing I mentioned above, ".notdef" is the only glyph name allowed to start with a period. So definitely don't put ".null" in an OT font.</p>
