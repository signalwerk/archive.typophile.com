      <p>So that's a good question, Mark. What is .null? Where did it come from? Why is there an option in Fontlab to add .null? Does anyone know what that's doing there? I don't use it but seeing that option back around 2000 made me think that there must be something good about having .null and some of my earlier fonts still have them.</p>
      <p>So yeah, .null is bad, just do NULL, got it. But still, has anyone heard of a specific problem related to a .null glyph? This typical pattern in a thread like this is</p>
      <p>Q: X is bad but does anyone know of anything specific that will occur if I do X.<br>
      A: The spec says X is bad. You shouldn't do X<br>
      Q: Yeah, but do you know anything specific that will occur if I do X.<br>
      A: X is bad.<br>
      end of thread</p>
