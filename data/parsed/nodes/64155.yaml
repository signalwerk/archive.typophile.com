      <p>I believe ".null" is the glyph name of the required second glyph in the Apple TrueType spec (after .notdef, before CR and space).</p>
      <p>FontLab has an option to automatically add ".null" "CR" and "space" glyphs when generating TrueType fonts.</p>
      <p>Cheers,</p>
      <p>T</p>
