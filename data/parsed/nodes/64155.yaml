    html: |-
      <p>NUL is part of the old ASCII character set, (code point 00 in 8 bit hex). It's used in empty strings in programming languages. It basically means "no data". NULL is the name for the the equivalent code point in Unicode (0000 in hex).</p>
      <p>Not sure where .null comes from. Seems like an aberration. I was just reading something recently (in the OpenType spec, I think) that the only glyph name that is allowed to start with a period is .notdef. I would avoid .null.</p>
