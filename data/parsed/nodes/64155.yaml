      <p>Okay, so I've inspected a few .ttf fonts that Apple ship on modern Macs, Mac TrueType suitcase fonts that Microsoft includes with Office, and .otf fonts that Adobe bundles with CS apps. All except Adobe's .otf fonts include either "NULL" or ".null", but not both. Adobe .otf fonts I looked at did not contain ".null", "NULL", or "CR". I also check my own .otf fonts and none of them included those either.</p>
      <p>I would conclude from this that you probably should include "NULL" or ".null" in your TrueType fonts, but probably not both since they appear to be the same thing. Definitely not "NUL", though. I would just leave the option checked in FontLab and assume it does the right thing for the kind of font you are generating. Presumably, if the font already has a glyph named "NULL", it will not add ".null".</p>
