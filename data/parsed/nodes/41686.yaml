    <p>Hello,</p>
    <p>I spotted this on a recent trip to Washington at Reagan airport and was intrigued by the extended "Northwest" type. The flat ends of the S threw me off because initially I thought this was as Aksidenz with the straight leg of the R. Any ideas? </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/reagan-gate-small_5317.jpg"></div><p></p>
