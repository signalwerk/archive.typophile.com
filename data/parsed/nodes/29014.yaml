    html: |-
      <p>Hi Eroc,</p>
      <p>My senior designer is a real tosser sometimes. I do like Poetica but find it overwhelming. Aren’t there 200 ampersands in that one? I’d trade them all for the perfect N! I believe the saying with Bickham is that ‘less is more’ and I’ve gotten in the habit of using the smaller flourish on the end of every other line and the big flourish only when it’s really important like at the end of the bride’s name, because you can’t beat Bickham for a wedding invitation! I’ve never had a chance to use the big loopy ones because they never quite seem to fit in but aren’t they gorgeous?</p>
