  html: |-
    <p>Hi All —<br>
    I have recently been experimenting with making patterns using the extra ornaments found in Bickam Script. Having not been able to produce anything more than mediocre designs so far, I began wondering if there were any rules pertaining to the usage of this type of ornament. Are there specific no-no’s that I should avoid? Are there any general guidelines that I could use as a starting point? (specifically overlapping/spacing issues and how to choose which curly-cues to pair with one another) Or should I just keep practicing and stop wasting everyone’s time? </p>
    <p>Thanks,<br>
    Eric</p>
