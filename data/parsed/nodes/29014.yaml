    html: <p>Just don’t use Bickham Script in all caps and you’ll be fine! I should know because I almost got fired for trying to use it in all caps once. It’s my favourite font and I think the caps are just lovely but i got right bollocked by my senior designer! Come to think of it it was a bit hard to read but worth it i thought.</p>
