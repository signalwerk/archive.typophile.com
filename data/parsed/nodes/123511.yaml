      <p>Definitely based on Stratum 1 (this /W and those numerals can't lie) and massively used on their <a class="freelinking external" href="http://realalebrewing.com" rel="nofollow">website</a> with <a class="freelinking external" href="http://www.fontbureau.com/fonts/Vonness" rel="nofollow">Vonness</a> Condensed. I also don't know any "Stratum-like with flare serifs" like they did. You may like some fonts by Mattox Shuller of <a class="freelinking external" href="http://www.myfonts.com/foundry/Fort_Foundry" rel="nofollow">Fort Foundry</a> like Industry, Industry Inc. and Gin (some sort of "condensed Stratum-like with latin serifs") that looks pretty appropriated for such branding identity.<br>
      Some more but far less close: <a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/boucherie" rel="nofollow">Boucherie</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/laura-worthington/charcuterie" rel="nofollow">Charcuterie</a> Block, <a class="freelinking external" href="http://creativemarket.com/KimmyDesign/153940-Burford" rel="nofollow">Burford</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/brothers-ot" rel="nofollow">Brothers</a>, <a href="/wiki/https%3A/%252Fcreativemarket.com/Gumpita/49869-Dealers" class="freelinking" rel="nofollow">Dealers</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/chank/braingelt" rel="nofollow">Braingelt</a>, LHF's <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/roebuck.php" rel="nofollow">Roebuck</a>, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/antiquehalfblock.php" rel="nofollow">Antique Half Block</a> and <a class="freelinking external" href="http://letterheadfonts.com/fonts/oldstock.php" rel="nofollow">Old Stock</a>, <a class="freelinking external" href="http://creativemarket.com/swistblnk/75323-Reidfork" rel="nofollow">Reidfork</a>, <a class="freelinking external" href="http://creativemarket.com/sirmon/155210-Wooderson" rel="nofollow">Wooderson</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/nicksfonts/page-ephesian-nf" rel="nofollow">Page Ephesian</a>, <a href="/wiki/https%3A/%252Fcreativemarket.com/Gumpita/9482-Companion-League" class="freelinking" rel="nofollow">Companion League</a></p>
