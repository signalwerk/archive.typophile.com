    html: <p>Peter, asking a web design business to grow business might be a little of an over promise, unless you are tied into marketing people and writers. I think the best you can do is offer website design as a tool to help grow a business. Even then you’d need statistics showing growth and percentages vs other kinds of sales promotion and marketing. I think I’d approach your web design business differently, something along the lines of “personal touch” or “one on one” design. Imply your designs aren’t cookie cutters but solve a businesses particular problem. Just some thoughts</p>
