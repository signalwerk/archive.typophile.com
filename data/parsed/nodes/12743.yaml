    date_raw: 3.Jun.2005 10.24am
    votes: null
    html: |-
      <p>I think that you may be treating the logo a little to litteral a manner here. You probably shouldn’t be creating some frankenstein hybrid of a kind of platonic ideas/icons of ’business’ &amp; of ’growth’. Like a tendril making a dollar sign... god forbid. That might be okay for a spot illustration in some ham handed business journal- but not a logo. </p>
      <p>The purpose of your logo aught to be to: </p>
      <p>1. <strong>Be Different</strong> I know I sound like an advert but it’s true all the same. I1f your doesn’t do this - especially as a designer - a basic tentpole is missing. Who are you competing with? Look at them &amp; be different. Being yourself may well be enough.</p>
      <p>2. <strong>Be memorable.</strong> This is different than being Different. Really. This is the graphic equivalent of a catchy song hook. You want something that you look at &amp; you find yourself looking again. It’s not a trick - it’s a behaivior of the eye you want &amp; then of the brain. </p>
      <p>3. <strong>Be yourself.</strong> This is tricky &amp; very subjective. You want to have a logo that you don’t feel is false, a fake or feels like a sham. For instance, if you were a small neiborhood florist you might not want a chilly multinational corprate style logo. You would want something warmer, friendlier, and maybe more classic classy or fun. </p>
      <p>4. <strong>Be fast.</strong> A logo that takes too long to communicate or be understood is a deadly logo.  This is one of the reasons that a hybrid is out. It takes too long to understand &amp; an impatient eye moves on. If the logo doesn’t do it’s basic job in the short time it takes to glance at it- it’s not that great. I’m not saying it should be a pleasure too look at for longer - just that it needs communicate it’s basic message <strong>very</strong> quickly.</p>
      <p>It isn’t key that an idea as such is imbeded in a logo. Especially for a service industry. Look at the most successful logos - Mercedes, Apple, DKNY - pick your own. You won’t find an idea in almost any really successful logo. You will find they evoke a feeling in you. That feeling is enough. And a treatment of Type is often enough to create that feeling.</p>
      <p>In terms of process I would make a list of words or phrases that describe the kind of assumptions that you want your logo to create in a viewer. Take stock of your target.<br>
      Make sure it’s the target you really want.</p>
