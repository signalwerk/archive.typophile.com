    html: <p>Dan, that is a good point and I was thinking myself that to say my web designs can grow a business is a bit too ambitious. Although, I do offer eBay template design which really can contribute directly to more sales. That service is one I want to feature much more prominently with my new design. In any case, I really do want to set myself apart from other web design businesses by being personable. Being a one man show gives me some advantages over the competition, particularly that I can give more attention to my clients. That’s something I do want to highlight on my new site and even in my logo. Perhaps it would be best to go for a wordmark rather than using some kind of symbol. What do you guys think?</p>
