    <p>You guys were so helpful with the last logo I worked on that I knew I had to get your input for this one as well. This time it’s a logo for myself. I’m starting a small web design business to earn extra money for school.</p>
    <p>The logo will accompany a new design for <a href="http://www.gurrydesign.com" title="Gurry Design">my website</a> which I want to have a gardening theme. The idea is that I can help people “grow” their business with a well-designed website (sounds korny, I know, but it should be good when it all comes together).</p>
    <p>So here are my two variations of the logo. Your thoughts and comments are much appreciated.</p>
