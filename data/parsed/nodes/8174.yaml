  html: '<p>None of these are exact matches: <br> <br>Pearl Jam looks a bit like <a href="http://www.myfonts.com/fonts/solotype/dime-museum/dime-museum/testdrive.html?s=PEARL+JAM&amp;p=72" target="_blank"> Dime Museum</a>, but heavier. <br> <br>For the "With Sleater Kinney" you could try something like <a href="http://www.myfonts.com/fonts/ef/old-towne-no-536/ef-regular/testdrive.html?s=WITH+SLEATER+KINNEY&amp;p=48" target="_blank"> Old Towne No 536</a> <br> <br><a href="http://www.myfonts.com/fonts/fontfont/ff-zapata/light/testdrive.html?s=MARCLAY&amp;p=48" target="_blank">FF Zapata light</a> is similiar to the two bottom ones. </p>'
  html_clean: '<p>None of these are exact matches: <br> <br>Pearl Jam looks a bit like <a href="http://www.myfonts.com/fonts/solotype/dime-museum/dime-museum/testdrive.html?s=PEARL+JAM&amp;p=72" target="_blank" class="link-external"> Dime Museum</a>, but heavier. <br> <br>For the "With Sleater Kinney" you could try something like <a href="http://www.myfonts.com/fonts/ef/old-towne-no-536/ef-regular/testdrive.html?s=WITH+SLEATER+KINNEY&amp;p=48" target="_blank" class="link-external"> Old Towne No 536</a> <br> <br><a href="http://www.myfonts.com/fonts/fontfont/ff-zapata/light/testdrive.html?s=MARCLAY&amp;p=48" target="_blank" class="link-external">FF Zapata light</a> is similiar to the two bottom ones. </p>'
