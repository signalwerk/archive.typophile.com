    html: |-
      <p>There's another digital font based on Hellenic Wide called Biggen, which is readily (though I suspect illegally) downloadable from the web. I don't know of a legit source for it. <br> <br>One (very dodgy looking) site that has it for download includes the following copyright notice, presumably extracted from the font file: <br> <br><br>
      </p><blockquote><hr size="0"><!---quote-!--><b>quote:</b><p>The IMSI MasterFonts Collection, tm 1995, 1996 IMSI (International Microcomputer Software Inc.) Digital typeface data Copyright (c)1993,1996 Weatherly Systems, Inc. All Rights Reserved. Redistribution strictly prohibited.<!---/quote-!--></p><hr size="0"></blockquote>
       <br>Does anyone know if this collection is still commercially available?<p></p>
