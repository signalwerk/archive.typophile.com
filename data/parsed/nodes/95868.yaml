    html: <p>Well, since you asked, yes, I liked the old branding much better. The typography seems much more sophisticated, and I really like the fact that they went to the trouble of producing a "woodcut" version of the portrait for B&amp;W uses. However, without seeing the standards manual for the new branding, it's not really a fair comparison. What does the "digital" portrait look like in B&amp;W? What supplemental typefaces are meant to go with the new logo? The new campaign seems to involve mixing blocky sans serif caps with a classical italic (Hoefler?) for emphasis, which is an interesting nod to the classical typography of the pervious branding. Maybe, if the quote in the article about how "each department had its own identity" is true, all they needed to do was actually read the existing standards guide.</p>
