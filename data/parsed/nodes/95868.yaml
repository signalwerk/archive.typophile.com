    <p>My alma mater (George Washington University) recently hired two very expensive firms to redesign its logo and "visual identity." The new design features sans-serif font and a digital portrait of George Washington. A vast majority of students and alums (like myself) dislike it, while the school's administration loves it. What are your thoughts on the redesign (and use of sans-serif), everyone?</p>
    <p>Links to new look:<br>
    <a class="freelinking external" href="http://gwtoday.gwu.edu/george-washington-university-unveils-new-visual-identity" rel="nofollow">http://gwtoday.gwu.edu/george-washington-university-unveils-new-visual-identity</a><br>
    <a class="freelinking external" href="http://gwu.edu" rel="nofollow">http://gwu.edu</a></p>
    <p>Here's the old look:<br>
    <a class="freelinking external" href="http://graphics.gwu.edu/standards.pdf" rel="nofollow">http://graphics.gwu.edu/standards.pdf</a></p>
