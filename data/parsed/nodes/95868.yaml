    html: |-
      <p>&gt; A vast majority of students and alums (like myself) dislike it...</p>
      <p>I used to do design work for a large university. Students and alumni develop a nostalgic fondness for the university's logo and changes can create a strong negative reaction. I respect your opinion and can see why you like the old logo, but an initial negative reaction is common and doesn't necessarily mean that the change is bad in the long run.</p>
      <p>No matter what the administration says, the new logo wasn't designed for the alumni or current students anyway. It's designed for the kids in high school who are considering attending your university. When they went to your website on their iPads and saw the old logo, it created an impression (fairly or unfairly) of a behind-the-times university. There is fierce competition for students and the administration believed the old logo was hurting more than helping.</p>
      <p>&gt; very expensive firms </p>
      <p>I'm sure they were, but people often don't realize the vast amount of work that goes into redesigning a university's identity system. They think you just make a few sketches and you're done. Actually you've got endless meetings with university committees that can't agree on anything, tons of research, redesign after redesign, plus you're not just designing a logo, you're also redesigning their publications, website, signage, vehicle graphics, etc. It's a HUGE amount of work.</p>
      <p>As for the logo itself, I can't say that I love it, and I understand your fondness for the old one, but if their goal was to create a more contemporary logo they succeeded.</p>
    html_clean: |-
