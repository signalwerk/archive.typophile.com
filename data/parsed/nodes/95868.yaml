      <p>&gt; you can't ignore the people who are already on the inside</p>
      <p>I agree, and ideally you want students to love the new logo.</p>
      <p>But if they don't, they may grumble but they are unlikely to leave because of it. But high school students may indeed decide not to attend if the university's old logo -- along with the look of the publications and website -- creates the wrong image. </p>
      <p>&gt;  shouldn't ignore alumni since a lot of money<br>
      &gt; and connections come from there</p>
      <p>Totally agree. Alumni are extremely important.</p>
      <p>But you can't run a university without displeasing alumni sometimes. Tear down a cherished (but outdated) building and there will be howls of protests from alumni. Fire the coach and some alumni will never donate another penny. Heck, I even saw an alumni go ballistic because an old tree that he loved was cut down. You can't please everyone. Sometimes alumni offices have to smooth ruffled feathers.</p>
