    html: |-
      <p>this probably isn't "kosher" but you could probably build your spacing into your smcp feature. for example sometimes i've used used numerators for superior numbers thus:</p>
      <p>feature sups {<br>
      lookup sups1{<br>
      	pos @SUPS "lessthan"0 150 0 0"greaterthan";<br>
      }sups1;<br>
      lookup sups2{<br>
      sub @NUMS by @SUPS;<br>
      }sups2;<br>
      } sups;</p>
      <p>i don't see why you couldn't (maybe you SHOULDN'T) do something similar with the smcp feature. But... why not just space your small caps appropriately in the first place? do you want them to set tighter by default???</p>
