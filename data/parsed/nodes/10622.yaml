  html: "<p>I'm trying to figure out how the values in the cpsp feature work. Tried a google search, no luck. <br> <br>Typically, the values are somthing like:    <br> <br>pos @class0 {less}5 0 10 0{greater}; <br> <br>[Sorry, if I use the greater/less characters, the expression values won't display properly] <br> <br>How do you read this (aside form the class)? <br> <br>Can you have two \"arguments\" -- say, one class for samll caps, one for full caps? The values in the argument shown work about right for small caps, but I'd usually want a little more for full caps.  <br> <br>TIA, Charles</p>"
  html_clean: "<p>I'm trying to figure out how the values in the cpsp feature work. Tried a google search, no luck. <br> <br>Typically, the values are somthing like:    <br> <br>pos @class0 {less}5 0 10 0{greater}; <br> <br>[Sorry, if I use the greater/less characters, the expression values won't display properly] <br> <br>How do you read this (aside form the class)? <br> <br>Can you have two \"arguments\" -- say, one class for samll caps, one for full caps? The values in the argument shown work about right for small caps, but I'd usually want a little more for full caps.  <br> <br>TIA, Charles</p>"
