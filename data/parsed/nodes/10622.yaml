    html: |-
      <p>I don't put this feature in my fonts, as I think that when it says zero tracking in the character palette, that's what you should get.</p>
      <p>However, there are a couple of extras that I often put in the c2sc ("all caps") feature. One is "all-cap" figures, with height, weight and proportions to match an all-cap setting. </p>
      <p>And the other is an alternate, wider space glyph (which I name space.c2sc), because I find that the normal space width suitable for U&amp;lc and (especially) all small cap setting isn't wide enough for all caps.</p>
