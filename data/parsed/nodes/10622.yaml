    html: |-
      <p>A capital set against a lowercase letter is a whole different story than a capital set against another capital letter. </p>
      <p>A capital 'as is' in a font has side bearings which make it look good beside lowercase for 'sentence case' setting.<br>
      The 'All Caps' OT feature can correct this when setting just Capitals.</p>
      <p>I think the 200 units that my former self put in the code [above] is perhaps over generous and therefore a stylistic use of the feature. It looks like I was treating this as an automatic way to set small [top of page] headlines. (I am being Policed on this attitude elsewhere but will justify my actions on a case by case basis). [Wit]<br>
      Thanks for highlighting this.</p>
      <p>I will look at this again and correct it. </p>
      <p>So I agree with both @Arno and @Nick but maintain the Cpsp feature as totally valid in setting Capitals only at their optimum spacing.</p>
