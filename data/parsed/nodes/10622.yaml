    html: |-
      <p>I was always a bit confused by the meaning of the values. So I have written my own comments:</p>
      <p>feature cpsp {# Glyph Position Tag<br>
      	#&lt;[xPlacement: Add to LSB and (!) Subtract from RSB] [yPlacement: Add to TSB and (!) Subtract from BSB] [xAdvance: Add to RSB changed in xPlacement] [yAdvance: Add to BSB changed in yPlacement]&gt;<br>
      	pos @upper_case &lt;7 0 14 0&gt;;<br>
      	pos @lower_case_sc &lt;7 0 14 0&gt;;<br>
      	#same as: pos [@upper_case @lower_case_sc] &lt;7 0 14 0&gt;;<br>
      	#Means additional letterspacing of 14 units<br>
      	#between upper cases<br>
      	#between upper cases and lower cases sc<br>
      	#between lower cases sc and lower cases sc<br>
      	#And it means additional letterspacing of 7 units<br>
      	#between upper cases and all other characters except from lower cases sc<br>
      	#between lower cases sc and all other characters except from upper cases<br>
      } cpsp;<br>
      #---Capital Spacing</p>
      <p>@ Michael Hernan</p>
      <p>I don’t think, that the cpsp feature is intended to be a typographical mark like bold or italic. I think, it is just the other way around. Without additional spacing text that is set in capital letters drags more attention. The cpsp feature just shall make the text that is set in capitals or small capitals more legible. If the user wants to drag attention with the help of more letterspacing like 200 units, he should do that manually. And it is harder to correct the kerning between letters, if a feature that you cannot turn of enlarges the capital letter spacing by 200 units.</p>
      <p>--------</p>
      <p>Please correct me, if I am wrong!</p>
