    html: |-
      <p>Here is my basic code for generous space between Caps. ( Paul, I am going to start using classes soon =)     )</p>
      <p>Spacing is activated by the "All Caps" selection in the Character Palette as mentioned above.</p>
      <p>I notice the All Caps overrides Small Caps (by turning the sc lowercase to real Uppercase)</p>
      <p>My small caps have generous spacing anyhow.</p>
      <p>I see this as a feature beyond having a set of Titling Glyphs Where titling will be a mixture of upper and lower case and is tighter than bodytext.</p>
      <p>I here leave the Small caps code in so you know what Im talking about.</p>
      <p>feature cpsp {</p>
      <p> # sub by ;<br>
           pos [A-Z]  &lt;0 0 200 0&gt;;<br>
           pos [A.sc-Z.sc]  &lt;0 0 200 0&gt;;<br>
           pos [A.titl-Z.titl]  &lt;0 0 200 0&gt;;</p>
      <p>     pos zero  &lt;0 0 200 0&gt;;  </p>
      <p>  # 'cpsp' Capital Spacing</p>
      <p>} cpsp;</p>
