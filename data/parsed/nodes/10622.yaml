    html: <p>If you're using the Adobe FDK for OpenType, or FontLab, I generally suggest checking the Adobe FDK documentation. The document "OT Feature File Syntax.html" has this sort of info. This particular item is under 6a (GPOS lookup type 1). <br> <br>The first number is the adjustment to the glyph's position in x, and the third is the adjustment to the glyph's advance width in x. So in the example, the glyph is moved to the right by 5 units, and the advance width is increased by 10. The net effect is thus to increase both sidebearings by 5 units. <br> <br>I don't know that anybody's done it, but I see no technical reason at the font-building level why you couldn't have multiple "arguments" to have one for small caps as well. But.... <br> <br>Adobe applications supporting 'cpsp' do so automatically when "all caps" formatting is applied, and don't offer any other way to apply it AFAIK. So I doubt that 'cpsp' on the small caps would ever get accessed. <br> <br>Regards, <br> <br>T</p>
    html_clean: <p>If you're using the Adobe FDK for OpenType, or FontLab, I generally suggest checking the Adobe FDK documentation. The document "OT Feature File Syntax.html" has this sort of info. This particular item is under 6a (GPOS lookup type 1). <br> <br>The first number is the adjustment to the glyph's position in x, and the third is the adjustment to the glyph's advance width in x. So in the example, the glyph is moved to the right by 5 units, and the advance width is increased by 10. The net effect is thus to increase both sidebearings by 5 units. <br> <br>I don't know that anybody's done it, but I see no technical reason at the font-building level why you couldn't have multiple "arguments" to have one for small caps as well. But.... <br> <br>Adobe applications supporting 'cpsp' do so automatically when "all caps" formatting is applied, and don't offer any other way to apply it AFAIK. So I doubt that 'cpsp' on the small caps would ever get accessed. <br> <br>Regards, <br> <br>T</p>
