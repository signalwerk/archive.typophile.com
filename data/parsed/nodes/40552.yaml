    html: |-
      <p>A single value?</p>
      <p>Open the kerning list in the Kerning Panel (second buttom from the right in the panel's toolbar).<br>
      Navigate to the exception pair. Alternatively, type the pair into the preview part of the panel and click on the right glyph of the pair; this will highlight the pair in the kerning list.<br>
      Click on this kerning pair's line in the kerning list; do this even if it is highlighted already!<br>
      In OSX, hit the 'back' key. In Windows it might be the 'delete' key, I don't know.</p>
