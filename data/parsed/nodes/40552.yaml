    html: |-
      <p>It's <a href="http://www.kltf.de/downloads/KLTF-KerningTools.zip">here</a>, "Remove Exception Kerning". It is important that you open the script in a text editor first and assign your own identifier tags which identify your classes as leftside, rightside (and exception). Else the script won't work. Also see the notes in the text file. Not tested much, so better try with a copy of the font first.&nbsp;&nbsp;:)</p>
      <p>Kerning pairs of which one glyph is not covered in any class at all are <em>not</em> considered exception kerning pairs!</p>
    html_clean: |-
