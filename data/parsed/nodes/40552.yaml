  html: |-
    <p>Is there a way to restore a kerning exception so it again follows the key glyph in the class in FontLab? Can't find it... and I need it bad. I can only Reset the kerning.</p>
    <p>Thanks in advance.</p>
    <p>Cheers!</p>
