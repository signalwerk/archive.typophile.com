      <p>If I understand you correctly then yes.</p>
      <p>As far as substitutions are concerned there are many characters that are composites which can be designed 'carefully' as you say. For instance, if the text file contains a shin followed by a shindot then substitute the single character shinwithshindot. This also applies to all the characters that take a dagesh and to final characters such as kafsofitwithsheva can be displayed with the nikkud up higher.<br>
      That would be a good start.</p>
      <p>You may want to make the advance larger for narrow characters such as yod and vav when the nikkud take a lot of space, for instance hatafs and qubuts. Do these cases actually occur? I don't concern myself with the correctness of the Hebrew text (grammatically) - I display or print whatever the 'user' gives me.  Note however that others on this site disagree with this approach.</p>
      <p>You may want to divide the letters into groups depending on width and then position the nikkud in the center of the letter depending on width.</p>
      <p>If you decide now you are aiming at the secular market, you will save yourself a lot of effort.</p>
      <p>Mike</p>
