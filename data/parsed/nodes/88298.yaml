  html: <p>I've heard a little about VOLT (OT?) programming of Hebrew fonts, and am wonder what the specifics are of this. Is it character substitution for nikkud and regular glyphs to use specially designed glyphs with nikkud applied carefully rather than arbitrarily?</p>
