    <p>I became curious with this very neutral grotesque<br>
    looking at the sourcecode of the following site <a href="http://www.escola-aberta-rio.com/pt/#" title="http://www.escola-aberta-rio.com/pt/#">http://www.escola-aberta-rio.com/pt/#</a><br>
    i discovered that the font is called Mercator LB Regular, but i couldn' t find any font simillar to it in google, only a serifed from linotype that has nothing to do with it...<br>
    Radim Pesko is one of the teachers of the course of the site so maybe it is a guess...<br>
    Anyone have any idea where do i buy this font? Which Typefoundrie?<br>
    Thanks in advance...</p>
