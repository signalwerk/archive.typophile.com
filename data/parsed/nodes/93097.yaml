  html: |-
    <p>I’m in the process of rebuilding my Flash-based website via Ajax/HTML5/CSS3. I’m using bits and pieces from here and there, and I have a slide show (in an iFrame), an audio player and some fancy MouseOver moves, all of which call for the latest release of jQuery. The navigation buttons will swap out the iFrame contents, most of which will also have jQuery scripts.</p>
    <p>Will one call for the jQuery file on the main(index) page cut it, or do I have to include additional calls on each of the iFrame HTML pages?</p>
