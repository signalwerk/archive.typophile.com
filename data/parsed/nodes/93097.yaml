    html: |-
      <p>Darrel,</p>
      <p>Thanks for reminding me about SSI: I haven't used it in about ten years, but—yes—it does help keep files tidier. The problem is, the site will have a main staging area that will swap out content, depending on the menu link clicked, and most of the content has a lot of overhead, in terms of images, text blocks, additional styles and scripts. The only real candidates for SSI would be the header and footer, which take up less than twenty lines of code.</p>
      <p>What I want to end up with is an editable file similar to the XML file used to change images and text in my old site: I didn't have to wade through yards of code, and all the data categories had logical names. iFrame seems the most sensible solution.</p>
      <p>And, FWIW, some people like the music (they write me and tell me so0, but I will put a kill button for the audio on the next version.</p>
      <p>Dušan: The site is all hand-coded—all those years of using SGML (HTML’s grandaddy) marking up copy for dedicated phototypesetting came in handy. CMS and eCommerce will probably figure in to the next version.</p>
