    html: |-
      <p>Since I did our website recently (a couple of months ago), I'd like to share you my experience since I think you'll put a lot efforts in HTML website and in maybe a year, you'll decide to swap into CMS.</p>
      <p>When we started, we had an HTML/CSS/JS based website that, at first, seemed easy to maintain. After each new font, I had to edit around 50% of existing pages to make possible for new font to conceptually follow the other fonts in website. It takes time, you'll always something forgot to do and you'll notice that after days/weeks/months and in one point you'll end up probably disappointed or just sick of it. And you'll always lack for something. Simple, it's not it, it's not good solution for longer run.</p>
      <p>My advice is to go straight to CMS.<br>
      Make template, define all the pages/sections, prepare content, hire developer who will do it for you, pay what it costs and be happy for next a couple of years. If you use some stable CMS, that develops all the time, there's a good chance you might be able, for some next website layout change, to just do new template and keep same CMS, database....</p>
      <p>It costs more, but it's more effective, more easier, more functional and more practical solution then HTML.</p>
      <p>Cheers.</p>
