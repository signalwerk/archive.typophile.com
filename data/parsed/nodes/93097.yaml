    html: |-
      <p>If you're doing the right thing by killing the flash part, do the right thing and kill the iFrame and music.</p>
      <p>"I chose to go with an iFrame because it will allow me to edit a smaller file when I update."</p>
      <p>You could use AJAX calls for that if you wanted to.</p>
      <p>A better option would be to use server-side includes to have every page include the repetitive elements. </p>
      <p>If you want to stick with the iFrame, if the iFrame, itself, needs jQuery then, yes, that page within the iFrame needs to reference the same jQuery files as the other page.</p>
