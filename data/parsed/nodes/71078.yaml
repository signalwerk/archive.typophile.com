  html: |-
    <p><code>set "p=path to directory with fonts with spaces in path"<br>
    for %%f in ("%p%\*.*") do tx -pdf -dd "%p%" -a "%%f"</code></p>
    <p>I wonder, why this did not work:</p>
    <p><code>for %%f in ("path to directory with fonts with spaces in path\*.*") do tx -pdf -dd "%%~dpf" -a "%%f"</code></p>
    <p>The dd-option does not seem to like a backslash in the end of a path. You may also have a view in the thread <strong><a href="http://typophile.com/node/70992" rel="nofollow">Easy way to generate a Glyph/Character</a>.</strong></p>
