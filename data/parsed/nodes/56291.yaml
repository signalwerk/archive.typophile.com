    html: |-
      <p>Hi Jimmy,</p>
      <p>most likely, these are not fonts, but hand-rendered letters.<br>
      For a digital font similar to ‘INVEST’, check out <a href="http://new.myfonts.com/fonts/blhd/prenton-rp/ultra-cond-bold/">Prenton Ultracondensed Bold</a> by <a href="/cms/wiki/Roy%252BPreston" class="wiki-create">Roy Preston</a> – it has that open ‘S’ with vertical terminals. Also: <a href="http://www.fontshop.com/fonts/singles/monotype/gill_sans_adobe_std_bold_condensed/&amp;sample_text=INVEST">Gill Sans Bold Condensed</a>.<br>
      F</p>
