    <p>I have been working on my typeface Froggy for a few years now and lately I have revisited all my metrics yet again, mostly class kerning. After finishing setting up my classes and kerning the font, I noticed the next day that the kerning classes had vanished. In my frustration, I used the “automatic” feature to rebuild the kerning classes. The result was less than satisfactory so I restarted the job of setting up kerning classes a third time manually. I had finished the Cyrillic glyphs of the job and decided to test the progress before doing the Latin. Upon updating the kern feature and recompiling the OpenType window, I was greeted with a message that “glyph class not defined (text was “@lcall”)”. I checked my opentype classes and to my horror found that ALL of them had vanished (kern classes were still there). The only thing that seemed to be a correlation in both cases was that I had selected only certain class(kern or opentype)  to view while I was working (in the little pop-up menu at the bottom of the list of classes). Needless to say, I am not a happy camper. I don’t know if this is a bug or just my incompetence but the frustration level is out of the solar system. There was no warning or dire caution of any kind.</p>
    <p>ChrisL</p>
