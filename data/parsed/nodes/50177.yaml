      <p><a href="/node/17341" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nick Curtis</a> is your man. He has made quite a number of fonts in that genre. I don’t know if you can find this very one (good luck searching, this guy is prolific) – but a quick look brought up these: <a href="http://www.myfonts.com/fonts/nicksfonts/dusty-rose-nf/">Dusty Rose</a>, <a href="http://www.myfonts.com/fonts/nicksfonts/rassetta-nf/">Rassetta</a>, <a href="http://www.1001freefonts.com/fashionvictim.php">Fashion Victim</a>, <a href="http://www.acidfonts.com/freefonts/anchor_steam.htm">Anchor Steam</a>.</p>
