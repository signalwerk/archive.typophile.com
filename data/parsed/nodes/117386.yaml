      <p>Apache license offers only one thing over and above the OFL license: You can take a free-for-the-world product that has thousands of hours of donated time put in by someone else, add a few hours our your own time, and create a product you can sell. Of course you *could* also donate of your time and skills, but you do have the option of selling.</p>
      <p>Fine as long as eventual buyers are not misled about (1) what they are getting and (2) their other options.</p>
      <p>Two things: </p>
      <p>1. Read <cite>Mountains beyond Mountains</cite> (authored by Tracy Kidder, about the early life of the doctor Paul Farmer). This to counter your knee-jerk notion that only money adds value. But if you want to press on,</p>
      <p>2. It would seem you can also do something equivalent with (at least some) of the fonts from the X-consortium. See <a href="http://en.wikipedia.org/wiki/Bitstream_Charter" title="http://en.wikipedia.org/wiki/Bitstream_Charter">http://en.wikipedia.org/wiki/Bitstream_Charter</a></p>
      <p>On that page, go to External Links and download </p>
      <p>Bitstream Charter con­vert­ed into OTF, TTF and webfonts</p>
      <p>Now, open, say, the roman and look at the copyright. You find</p>
      <blockquote><p>(c) Copyright 1989-1992, Bitstream Inc., Cambridge, MA. You are hereby granted permission under all Bitstream propriety rights to use, copy, modify, sublicense, <strong>sell,</strong> and redistribute the 4 Bitstream Charter (r) Type 1 outline fonts and the 4 Courier Type 1 outline fonts for any purpose and without restriction; provided, that this notice is left intact on all copies of such fonts and that Bitstream's trademark is acknowledged as shown below on all unmodified copies of the 4 Charter Type 1 fonts: "BITSTREAM CHARTER is a registered trademark of Bitstream Inc."</p></blockquote>
      <p>emphasis (in bold) added.</p>
      <p>I would, were I you, check on what seems to be the legal permission in the above copyright. Maybe "modification to OpenType" would somehow exceed the permission, though I can't see how, in part because there was no OpenType in 1992. </p>
      <p>Be advised that I plan to offer an expanded version of Charter (not Charis) as well, for <strong>free</strong>, after checking that above clause. For moral reasons, I also checked with Matthew. Mine is planned as a very extended version, but Latin alphabet only, no non-Latin, such as Armenian.</p>
