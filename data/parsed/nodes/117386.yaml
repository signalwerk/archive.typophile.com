    <p><cite>I don't think anyone has done a post on version 2.0 of this family. Apologies if someone has. But I just went and looked (and downloaded) the new version. I didn't check every weight, but WOW.</cite></p>
    <p><cite>Which lead to my posting the following to the AAUP design list:</cite></p>
    <p>A few years ago, I posted about Lato, a SIL OFL (Open Font License) font. Sans serif, created by professionals, interesting story behind it. Not going to repeat it, it's too long. A number of people used it at that time, but it lacked small caps, old-style figures, and many of the the niceties.</p>
    <p>Now, it seems version 2.0 is out.</p>
    <p><a href="http://www.latofonts.com/" title="http://www.latofonts.com/">http://www.latofonts.com/</a></p>
    <p>I only checked the medium weight, but...</p>
    <p>Old style figures.<br>
    Polytonic Greek.<br>
    Cyrillic.<br>
    All the combining diacritics. Some of the combining diacritics supplements.<br>
    Full IPA phonetics, and some supplements.<br>
    All of Latin Extended A (European languages, including Central and Eastern Europe)<br>
    All of Latin Extended B (many African languages).<br>
    All of Latin Extended Additional (romanized Indic scripts, romanized Arabic, Vietnamese).<br>
    Much of Latin Extended C (never needed it, but it's there...)<br>
    Etc.</p>
    <p>And not only in roman, but (at least medium) italic as well.</p>
    <p>No small caps, outside those used in phonetics, but almost everything else one could wish for, all free, and free to use in print, digital, or web  publications.</p>
