    html: |-
      <p>What I was thinking is based on using TTX as storage format since it's text. Text allows easy use of diff/patch and change control, common as sand on Linux/Unix systems.</p>
      <p>1. Dump a virgin font to TTX. (fresh.ttx)<br>
      2. Make some changes, save the new font and dump it to TTX. (modded.ttx)<br>
      3. diff -u fresh.ttx modded.ttx &gt;changes.diff (changes.diff shows every difference between the two TTX files.)<br>
      4. patch -Np0 -i changes.diff (By now fresh.ttx and modded.ttx should be identical.)</p>
      <p>In theory, a process built on this should allow you to build a library or collection of modifications. In practice... there're always some differences between theory and practice.</p>
