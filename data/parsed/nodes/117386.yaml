      <p>I know that people get paid to modify OFL fonts, and that's certainly encouraging, but it remains that the client does not own the results, and that's often a deal-breaker (or it causes the fee to drop like a rock). Also, the retail world is entirely excluded.</p>
      <p>As for the "formulaic" approach you mention concerning the derivation of non-Latin fonts (assuming I understood that correctly) I wouldn't know how to do that while yielding high-quality results (and I've never seen that done either). From my experience in making multi-script fonts I know that both the macro and micro decisions seem nearly impossible to automate.</p>
      <p>hhp</p>
