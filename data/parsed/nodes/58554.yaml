    html: |-
      <p>FontWerk is experienced in TT hinting for more than 8 years.</p>
      <p>I recommend to look not only on the price for TT hinting.</p>
      <p>(1) Look as well at the data formats you get after TT hinting.<br>
      All the hinting stuff made by FontWerk is based on FontLab. You get not only a hinted ttf file, but also the FontLab-internal vfb-file for further work (additional characters in the future).</p>
      <p>(2) Look as well at the hinting level you really need.<br>
      Good hinting options in the font file may produce sufficient screen quality by autohinting a Sans Serif typeface.<br>
      A good screen quality you may get with a manually basic TT hinting with no deltas. So the price for basic hinting does not depend on the point sizes but on the number of glyphs in the font.<br>
      Only if you need excellent screen quality delta hints are necessary. Delta hinting takes a lot of time because it is manually work on each glyph in each point size.<br>
      So, depending on the quality level it takes me between 2 hours and 2 weeks working time to optimize screen quality for TTFs with full Latin character set.<br>
      (3) Look at price-performance ratio.</p>
      <p>If you send sample font to <a href="mailto:Monibart@fontwerk.de">Monibart@fontwerk.de</a> you will get a detailed TT hinting offer asap. Please be sure, that after finishing the hinting job all your font related data will be deleted from all FontWerk disks.</p>
      <p>Regards,</p>
      <p>DH</p>
