  html: |-
    <p>I don't have the time right now to TrueType hint my typeface, so I was thinking of a hinting service that can do this for me. I have found a few companies that offer TT hinting, but I have no idea what the normal fee for such a job is. So that's why I'd like to know which companies do you recommend and what do they normaly charge for let's say: a sans serif typeface that need TT hints from 9-24 points?</p>
    <p>I also like to know if they want the right to sell your font as it was their own after they did the hinting for me, cause I want to keep the right to whom I sell the font to.</p>
    <p>Thanks in advance!</p>
