      <p>I expect price also depends partly on what level of hinting you want, and whether for ClearType, GDI greyscale, or both. Character set (number of glyphs) is also a factor.</p>
      <p>It sounds like you're talking about delta hints specifically when you mention 9-24 points. BTW, "points" are not the relevant unit as they are relative: pixels per em is the unit in question. 9 pt on Windows = 12 pt on Mac = 12 ppem.</p>
      <p>Paying somebody to do hinting for you is quite separate from them getting rights to sell your font(s). However, you might get a discount or even free hinting in exchange for non-exclusive resale rights or something....</p>
      <p>Cheers,</p>
      <p>T</p>
