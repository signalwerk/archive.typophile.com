      <p>I do not generally do this work, the quote I received was from one of my colleagues. You can inquire at Monotype, and Ascender, they are two developers who do this sort of thing. There are many independent designers who do this as well, but I don't think many take on much outside work due to the fact that few want to pay for the service. The free Microsoft web fonts did a great deal of harm when it comes to pricing this sort of work.</p>
      <p>To put it another way; TT hinting makes type design appear to be the most non-tedious work on the planet!</p>
