    html: |-
      <p>Morten,</p>
      <p>In your example, you need to uncheck the right-side checkbox of the _kernA class. Then copy the contents of _kernA, paste them in the _A2 class, and add the AE glyph name to it. This will take care of half of the warning messages. To get rid of the other half you need to edit the classes _kernE and _E2 in a similar (though inverse) way.</p>
      <p>To check for kerning classes' overlaps, you may want to use Karsten's <a href="http://www.kltf.de/kltf_otproduction.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">KLTF Check Kern Classes</a> macro, or try the button with a yin-yang sign in the Kerning Assistance dialogue.</p>
      <p><img src="/sites/default/files/old-images/kerning_assistance_5593.png"></p>
