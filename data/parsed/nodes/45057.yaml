    html: |-
      <p>You can't put the same glyph in two (or more) different kerning classes that are intended for the same kern pair position (i.e., left, right or both, as indicated with the check marks). </p>
      <p>It seems like it would be much more helpful if FontLab gave you an alert immediately when you do this, rather than waiting until you have done it perhaps dozens of times and try to generate a font. My strategy is to be very deliberate and organized in the way I set up my kerning classes, which has other benefits as well.</p>
