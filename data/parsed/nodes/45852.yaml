    <p>Hi all</p>
    <p>I'd like to hear your comments on this typeface. I know it needs work, but I'm not exactly sure which quirks are "features" and which are "bugs".</p>
    <p>It's opentype with a few ligatures (mostly ones needed to get this particular text looking OK) and a couple contextual alternates. It's my first attempt at OT.</p>
    <p>BTW, I just noticed the second attachment was marked 2 June 2007, which is impossible, so I fixed that.</p>
