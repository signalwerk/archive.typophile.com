    date_raw: 29 May 2008 — 6:10am
    votes: null
    html: <p>To me, it almost seems as though the lowercase and uppercase are from two entirely different families. I really like the caps. They sort of have a feeling close to Filosofia Grand (albeit italic), looking classic and refined, while the lowwercase have this quirky, playful characteristic about them. I think the curved terminals and ball serifs are making the rest of the letterforms seem a little more whimsical, which is not necessarily a bad thing. The kerning on the lowercases seems a little tight in most cases too. Is the "gg" a ligature? It seems as though the overlap isn't quite right. The width of the bottom loop may require it to be ligated. The bottom of the bottom loop also looks a little dark to me, along with the first vertical stroke on the lowercase w. The tittles and punctuation seem a little heavy to me as well.</p>
    html_clean: <p>To me, it almost seems as though the lowercase and uppercase are from two entirely different families. I really like the caps. They sort of have a feeling close to Filosofia Grand (albeit italic), looking classic and refined, while the lowwercase have this quirky, playful characteristic about them. I think the curved terminals and ball serifs are making the rest of the letterforms seem a little more whimsical, which is not necessarily a bad thing. The kerning on the lowercases seems a little tight in most cases too. Is the "gg" a ligature? It seems as though the overlap isn't quite right. The width of the bottom loop may require it to be ligated. The bottom of the bottom loop also looks a little dark to me, along with the first vertical stroke on the lowercase w. The tittles and punctuation seem a little heavy to me as well.</p>
