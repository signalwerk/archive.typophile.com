    html: |-
      <p>All those tight curls are kind of too fiddly to my eye - I find it more attractive at small sizes where that detail drops out - but that's really a personal preference, not an objective flaw.</p>
      <p>Shape of 'w' is improved, but its same-but-different top serifs make me do a double-take.</p>
      <p>Spacing is much improved.</p>
      <p>Is 'r' too wide? Should its arm branch out lower on the stem?</p>
      <p>'4' looks less like a four and more like Prince's next name! ;-)</p>
      <p>Should '6' and '9' have some kind of terminal on their loose ends?</p>
      <p>Beginning and end of '8''s stroke don't relate happily to each other in position.</p>
      <p>I think your ligatures are fantastic!</p>
