    html: |-
      <p>Thanks for the comments, Craig. I've changed the middle serif of the 'w' to match the left one (I think I was trying to compromise between the left and the right, but perhaps that was a bad idea). Thanks for the 'r' suggestion: I think that's a big improvement.</p>
      <p><em>Beginning and end of 8's stroke don’t relate happily to each other in position.</em></p>
      <p>Personally, the '8' is my favourite of the numerals; I agree that's "fiddly", but that's part of the look. Do you have any concrete suggestions on how the ends might meet more happily?</p>
      <p>Once again, thanks for the comments.</p>
      <p>I now have Windows-1252 coverage, as well as Latin-3 (because I'm an Esperanto speaker)</p>
