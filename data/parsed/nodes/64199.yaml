    <p>Hello,</p>
    <p>This sample is from an old ad, and is almost certainly hand-lettered. I know there are typefaces out there with a similar look, I just can't find any right now. I'm specifically interested in something with that "lazy" leaning S, and the low crossbar on the A. Any suggestions are welcome, thanks in advance.</p>
