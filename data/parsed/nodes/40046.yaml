      <p><cite>Erik Spiekermann explained it in a little more detail a while back.</cite></p>
      <p>Do you refer to this?</p>
      <p><cite>Text is usually set too tightly and with too big a wordspace. One of the legacies of Quark Xpress. Always set the optimum wordspace (under H&amp;J) to 80% or less in unjustified setting. And increase tracking by at least 2 units (that’ll be 10 in InDesign) for sizes under 12 pt. If that makes the copy run too long, simply decrease the size by 0.1 or 0.2 pt. That actually increases space between lines (aka leading) and by giving the type a little more room to breathe, makes<br>
      a more legible even though it’s a little smaller.<br>
      Don’t open tracking for my new typeface, FF Unit, as i have designed it to be generous at small sizes.</cite></p>
      <p>To me, the last sentence is the most important one.<br>
      Use good fonts, and you don’t have to fiddle around (a lot). This totally depends on the font, the size, the medium and the application (ES doesn’t explicitly name those applications just for the fun of it).<br>
      And no, FF Unit is not the only font that has been made with caution.</p>
      <p>Keep in mind that this has been written in 2004 – some things have changed since then, fortunately – a lot of superb text fonts (i.e. fonts, not typefaces) are quite young (yes, we are spoiled OpenType kiddies, aren’t we?).</p>
      <p>Have a look at this sample:<br>
      Two <a href="/wiki/optical%252Bsize" class="wiki">optical sizes</a> of Garamond Premier Pro, by <a href="/wiki/Robert%252BSlimbach" class="wiki">Robert Slimbach</a>/Adobe:<br>
      </p><div class="imageWrap"><img src="/files/gpp_4554.png"></div><br>
      Same nominal value, different size and spacing.<br>
      True, smaller sizes tend to need more space. But you don’t necessarily have to manually assign that in your application, it could already be in your font(s), too.<br>
      There are no absolute rules that fit for <em>all </em> situations. Use your eyes. ;°)<p></p>
