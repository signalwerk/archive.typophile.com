      <p><cite>Normally you will use tracking at 0 for text.</cite></p>
      <p>I have to disagree with you there. At text sizes Indesign sets type a little uncomfortable much of the time, and serif faces usually need five to ten units of tracking to get some nice color, whereas serifs need similar amounts of negative tracking. If you get really lucky a designer will even suggest tracking values in the specimens/manuals for fonts, as Sumner Stone does. Erik Spiekermann <a href="http://www.spiekermann.com/mten/2004/03/">explained it in a little more detail a while back</a>.</p>
    html_clean: |-
