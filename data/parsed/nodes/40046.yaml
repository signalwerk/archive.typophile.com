      <p>¡Hola Ignacio!</p>
      <p><cite>Should i just print the text and see</cite></p>
      <p>That sounds like a <em>very</em> good idea to me. Look (and <em>read </em>!), and you’ll see.</p>
      <p><cite>the space between the letter</cite><br>
      Do you mean between the words? They should be even, not too tight and not too wide (most often, the latter is the problem).</p>
      <p>Or are you talking about the spaces between the letters? When working with a good font (that is in this case, a font with well-done spacing and kerning), there usually is no need to mess around with that.</p>
      <p><cite>I’m using Garamond</cite></p>
      <p>Which one? There are <a href="http://www.myfonts.com/search?search%5Btext%5D=garamond">thousands</a>!</p>
      <p>F</p>
