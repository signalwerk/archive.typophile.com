    <p>hi, i´m a novel designer from Spain (that´s because i cannot express myself good enough in english...sorry) and i´m making a book with another friend.<br>
    I have some questions about the “tracking” and i was trying to get some information about it but i couldn´t find a good answer.<br>
    I´m using Garamond to compose the main text (wit InDesign) and i´m not sure about how “long” should be the space between the letter in a line.<br>
    I know, it depends of the type (Garamond in this case) and the size that i´m using but i cannot find any kind of table with the standard meassures and i´m don´t know, how i should do it. Should i just print the text and see if i have too much space in each line between the words (as i do) or there is some special rules for that, or for the Garamond type?.</p>
    <p>Thanks a lot and excuse me if the question is stupid; it is difficult to find help in spain about it.</p>
