    html: |-
      <p>I have had a chance to experiment with this now and as you will see from the screen grab, it can work as long as you manipulate the right metadata fields. By way of example, below is the metadata for the <em>Gomez Lurch</em> weight/style:</p>
      <p><strong><em>Addams Family (Gomez Lurch)</em></strong></p>
      <dl><strong>Names and Copyright</strong><br>
      Family Name: Addams Family<br>
      Weight: Gomez<br>
      Width: Normal<br>
      Number: 600<br>
      [<em>Font is italic</em> ticked]<br>
      Style Name: Italic<br>
      PS Font Name: AddamsFamily-GomezLurch<br>
      Full Name: AddamsFamily-GomezLurch<br>
      Menu Name: Addams Family<br>
      FOND Name: AddamsFamily GomezLurch
      <p><strong>OpenType-specific names</strong><br>
      OT Family Name: Addams Family<br>
      OT Style Name: Gomez Lurch<br>
      Mac Name: AddamsFamily-GomezLurch</p></dl>
      <p>This was done with FontLab (no TTX work needed) and the the shot is from InDesign CS6. It also worked in Word 2011 but not as well.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/AddamsFamily_4396.jpg"></div><p></p>
