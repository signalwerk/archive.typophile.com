      <p>If you use a guide such as <a class="freelinking external" href="http://forum.fontlab.com/index.php?topic=313.0" rel="nofollow">Adam Twardoch's overview of font naming in FontLab</a> and carefully map each field to test your results you should be able to get something working consistently.</p>
      <p>However, even optimised fonts with sensible naming schemes can fall foul of the peculiarities of a given platform or application; the revised handling of font name metadata in Office 2010 (Windows) and Office 2011 (Mac) being a particularly tricky example and the primary reason for Adam's latest revision of the naming guide.</p>
      <p>You would probably find using TTX to check naming fields and update that information a useful way of quickly updating the fonts as you test them. For more complex family groups I use Excel to keep track of the different fields.</p>
