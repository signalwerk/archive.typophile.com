    html: |-
      <p>The professional layout apps rationalize their faux-ing capabilities on the grounds that not all typefaces have the true features that users demand.</p>
      <p>To this day, Adobe’s InDesign does not tell users which styles of Adobe Caslon, for instance, are being rendered in true small caps, and which in faux. (The only way to tell is to check whether “All Small Caps” is avaiable in the OT menu.)</p>
      <p>Thankfully, InD and Quark no longer offer users faux italic and bold buttons.</p>
      <p>I would say, if you respect the user, don’t give them faux if the real thing is not available, let them know—don’t pull the wool over their eyes and give them second best because they don’t know any better. Is that any way to treat your customers? Furthermore, faux-ing provides a disservice to the fonts being fauxed with, because it presents them in a less than ideal light. Is that any way to treat a third party’s products? And ﬁnally, fauxing is a ball and chain which hampers the progress of typography.</p>
