    html: |-
      <p>@mjkerpan – To amplify a bit on Pablo's comment: Browsers will all too often fake small caps even if there are real ones in the font. Having a separate small-caps font helps getting around that. You could have a class <code>.smcp { font-variant: small-caps; }</code> and later change it to <code>.smcp { font-family: "Alegreya SC"; }</code>.</p>
      <p>If y'all think it's crazy, take a look at Almendra. Almendra SC is both Swash Caps and Small Caps. Stir Crazy?</p>
