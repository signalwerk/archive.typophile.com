    <p>Hi all,</p>
    <p>I'm currently in the process of designing a book cover. I'm intending to use Alegreya and Alegreya SC as the title and blurb faces. </p>
    <p>Being cautious of free downloads off Google Web Fonts or Font Squirrel, I always try to go an obtain my copies of 'free' fonts from the foundries themselves (to confirm they actually are free and haven't been been pirated on the free sites).</p>
    <p>I've found that Alegreya and Alegreya SC can't actually be downloaded from <a href="http://www.huertatipografica.com.ar/tipografias/alegreya/ejemplos.html" title="http://www.huertatipografica.com.ar/tipografias/alegreya/ejemplos.html">http://www.huertatipografica.com.ar/tipografias/alegreya/ejemplos.html</a>.</p>
    <p>Has anyone else had experience with these fonts, and can confirm that the licence does permit commercial use without any payments?</p>
    <p>Many thanks.</p>
