    <p>To my US pals:</p>
    <p>If you make less than 54,000 you can file your federal taxes for free (TurboTax is 30,000 or less).<br>
    <a href="https://web.archive.org/web/20081015172355/http://www.irs.gov/efile/article/0,,id=118986,00.html" title="http://www.irs.gov/efile/article/0,,id=118986,00.html">http://www.irs.gov/efile/article/0,,id=118986,00.html</a></p>
    <p>and if you live in California and you made less than 155,416 you can file your state taxes for free.<br>
    <a href="https://web.archive.org/web/20081015172355/http://www.ftb.ca.gov/online/calfile/qualifications.shtml" title="http://www.ftb.ca.gov/online/calfile/qualifications.shtml">http://www.ftb.ca.gov/online/calfile/qualifications.shtml</a></p>
    <p>Of course you still have to pay the government but at least you don’t have to pay to file.</p>
    <p>Heck, Buy some fonts with the you’ve money saved by filing yourself.</p>
    <p>Hope this helps some of guys and gals out there,</p>
    <p>Mikey :-)</p>
