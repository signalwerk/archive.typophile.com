    html: |-
      <p>It's funny, my first reading of the name was as a play on 'dynamic'.</p>
      <p>I agree about the 'm' feeling cramped. Also, the radiating curves are pretty dead. As Tim said, they don't feel explosive or dynamic. Even the grooves in a record change width and rhythm. A good DJ can read them and find bass lines and breaks, so that might be something to play with. Anything to enliven the rhythm.</p>
      <p>Building on the shapes in the terminals, I suggest that you modify them to give the whole word a more directional feel, particularly since there are curves 'blasting' and 'radiating' outward from the right side. Some of the terminals are oriented inward in relation to each other, like on the 'n' and 'm'. Try customizing the characters to work in that specific word, rather than as an alphabet for any word.</p>
      <p>You've got a good starting concept that you should punch up and really push in new visual directions.</p>
    html_clean: |-
