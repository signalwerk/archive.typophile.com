      <p>Hi Zekeman,</p>
      <p>this is a school handwriting typeface, American ‘Print’ style.<br>
      You can get this one from <a href="http://www.schoolhousefonts.com/Schoolhouse/characterset.htm">schoolhousefonts.com</a>. Choose ‘Schoolhouse Set A (Zaner-Bloser style)’.</p>
      <p>There are several free fonts of similar style: <a href="http://www.bvfonts.com/fonts/details.php?id=45">Print Clearly</a> from BlueVinyl, or <a href="http://new.myfonts.com/fonts/larabie/primer-print/">Primer Print</a> from <a href="/wiki/Ray%252BLarabie" class="wiki">Ray Larabie</a>.</p>
      <p>[Don’t use this at school!]</p>
      <p>F</p>
