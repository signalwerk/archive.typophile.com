  html: |-
    <p>Europe is in a crisis! Countries are in doubt. How much power do we lend to the European Union? What is the value of the Euro? Do we have to suffer for other countries problems? What if we step out of the EU, and just fend for ourselfs?!</p>
    <p>It's a crisis indeed, in which there are alot of short term visions and 'solutions'. Surely you can just drop out, but what about the future? Europe must remember that we are not the only economy around. You can fend for yourself for a while but in the end you must compete with future big economic powers like China, India and South America.</p>
    <p>What Europe needs to survive on a long term is a solid platform. A strong network with clear guidelines that stimulates trading, but with the countries remaining their own seperate identity.</p>
    <p>To symbolize this in a medium I made a display typeface named EUnity. It's a very complete typeface, that allow all European countries to make proper use of this font. With EUnity, the user is able to connect by choice with the use of uppercast writing or undercast.</p>
    <p>I would it if you would take a look at this font, get a feel for it, comment me if there are crucial things wrong with it, or just let me know what you think.</p>
    <p><a href="http://www.filefactory.com/file/re5lkq471wt/n/EUnity_zip" title="http://www.filefactory.com/file/re5lkq471wt/n/EUnity_zip">http://www.filefactory.com/file/re5lkq471wt/n/EUnity_zip</a></p>
    <p>Thanks in advance,</p>
    <p>- RJ</p>
