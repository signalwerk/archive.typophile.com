  html: |-
    <p>Hello,</p>
    <p>I've spent many hours trying to find an appropriate font style for a logo / brand name that will go on an olive oil bottle. The intended brand was going to be "pithari" and when I found "piangfaa thin" I was so happy to see how well it worked and how nicely it conveyed culture, hand-craft, ancient times AND minimalism. </p>
    <p>Then the brand changed into "olaa" and because of the repetitive "a" it doesn't work as well, it looks a little too industrial. I haven't been able to find anything that works as well since then. I think I need something that is a bit rougher on the edges, but still clean and minimalist. </p>
    <p>If you know of something that might work in this case, I would appreciate any input. Thank you very much!</p>
    <p>Aris</p>
