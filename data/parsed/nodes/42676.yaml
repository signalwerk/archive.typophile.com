      <p>I am pretty sure it is not required yet, but I remember long ago that the idea was tossed around of eventually requiring a DSIG. As far as I know, the only difference today (even under Vista) between signed fonts versus unsigned is the font file icon (and extra information in Properties). But it's not hard to imagine it becoming more restrictive and invasive, much in the way applications have become.</p>
      <p>Andreas, thanks for the link...looks like TUCOWS (reselling Comodo) is pretty much the cheapest way to go.</p>
