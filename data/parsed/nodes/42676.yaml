  html: <p>Where can I buy, in a reasonable price, digital signature certificate to sign OpenType fonts. Is there any free tool to sign fonts?</p>
  html_clean: <p>Where can I buy, in a reasonable price, digital signature certificate to sign OpenType fonts. Is there any free tool to sign fonts?</p>
comments:
  - id: 262869
    user: 19560
    date: 2008-02-29T18:18:00
    date_raw: 29 Feb 2008 — 6:18pm
    votes: null
    html: |-
      <p>The <em>tool</em> for signing fonts is free (provided by Microsoft; see <a href="http://www.microsoft.com/typography/developers/dsig/default.aspx" title="http://www.microsoft.com/typography/developers/dsig/default.aspx">http://www.microsoft.com/typography/developers/dsig/default.aspx</a> for more information). But I don't know of any free Certificates, and that is the critical bit required for applying a digital signature to fonts.</p>
      <p>Do a search for Authenticode Class III Code Signing Certificate; that is the specific variety required for signing fonts (this type of Certificate is not limited to use on fonts, but other types will not work). There are several vendors (known as Certificate Authorities), including Thawte and Verisign.</p>
      <p>I'm not sure what you consider "reasonable"; my experience with this tells me to be prepared to spend around $100/year or so, maybe more, maybe less depending upon the specific vendor. Generally Certificate Authorities will offer discounts for multi-year purchases so if you're in it for the long haul it may be worth doing that. Again, be sure you are getting a Class III Code Signing Certificate and not an SSL Cert or some other type.</p>
      <p>It is possible to create a self-signed Certificate for free; the tool set provided by Microsoft allows you to do this and there are instructions in the DSIG toolkit for doing this. A self-signed certificate behaves more or less the same as a regular Certificate, but since it is not issued by a Certificate Authority, it will not be considered "trusted", even if it is valid. But it is a good way to learn about the process of signing fonts, do dry runs, etc.</p>
      <p>Josh</p>
