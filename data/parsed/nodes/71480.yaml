    html: |-
      <p>Ah, yes, That font shows up in the Expresiv Font Brush Script collection sold by Tiger Direct in the mid-90's. I have notes that say this was based on a Photo-Lettering typeface called Pennington Popcorn. I have to say that that particular font collection was really inferior work, and not up to the standard of the other Expresiv collections done by 'World Art'. The letterforms were poorly shaped copies of the originals and were not kerned well. Letter sizes didn't even match properly.</p>
      <p>- Mike Yanega</p>
