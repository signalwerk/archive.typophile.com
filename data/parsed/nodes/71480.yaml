    html: |-
      <p>I hunted through my books with bold scripts, Solotype Catalogs, and good old Script Guide, but didn't see a match for this 'beauty'. I actually think this may have been one of the few original fonts done by this vendor. You know, the kind of font that anyone can make if they draw within a template box? This is like other hand-drawn styles. </p>
      <p>Stephen's suggestion of Geetype would be a major style upgrade from this one. Another suggestion for a roughly similar feel could be Bison, which used to be available from Berthold, but which I can no longer find anywhere.</p>
      <p>- Mike Yanega</p>
