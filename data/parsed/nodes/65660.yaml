    <p>Hello all! As we all know, type design can be a very lonely venture. Typophile is an awesome cure for that. I’ve been posting to the much-appreciated Critique forum every now and then and got a good amount of help. But, I think I’ve reached a point of self-learning<br>
    saturation, and where message board help isn’t enough. I feel like I’d benefit from personal guidance. And still, I’d like to use the internet to my advantage. </p>
    <p>So, with the holiday spirit in the air, I’d like to ask if any wise vets out there would be willing to coach a motivated novice. All I’m asking for is to be able to send a few e-mails back and forth each month to discuss detailed improvements to my type design. I’m particulary interested in developing a better eye for the nuances that crate good text faces. I’ve been doing display fonts for a while and would like to eventually transition into making text type.</p>
    <p>If I had the resources to pursue a professional degree in type design, I would. But it’s not possible for me right now. If anyone is interested in helping me out, please send a private message. Hopefully, I’m not overstepping any bounds by asking. Thanks!</p>
