      <p>&gt; The person giving the critique is placing their aesthetic judgement on<br>
      &gt; your work, and can, conscientiously or not, try to force your work into<br>
      &gt; their narrow view of what is correct.</p>
      <p>This is a very good point. And usually it’s done quite consciously! I remember when I showed an early version of Harrier to a Famous Type Designer, he wanted to wipe out everything that I had tried to make special in it. So it’s important to judiciously filter out certain things and keep what you really need (a tricky business for sure). Also, the best critic tries to get inside the subject’s head and help <em>him</em> get to where he wants to go.</p>
      <p>The conference idea is solid. For one thing<br>
      you can get quick crits from experts there.<br>
      <a href="http://www.flickr.com/photos/48413419@N00/4070517923" title="http://www.flickr.com/photos/48413419@N00/4070517923">http://www.flickr.com/photos/48413419@N00/4070517923</a><br>
      And TypeCon LA is going to rule.</p>
      <p>hhp</p>
