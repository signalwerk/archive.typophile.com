      <p>I think someone could make a killing offering an _affordable_ , but fairly intensive type design course. All the options I know of involve a lengthy time commitment and/or are very expensive. Going to Reading would require most people to leave their job and take out a loan. Typecamp seems to range from $2000 to $2400, plus travel costs. Typecon offers affordable instructional sessions, but the longest ones are just day long. I’m not doubting the value of these things, but for a lot of people, they’re just not an option. </p>
      <p>I’m sure there are a lot of people (like me) who wold love to go to Reading, but don’t want to quit their jobs, and would love to spend a week learning some of the finer points of designing type without having to take out a loan.</p>
