      <p>I’ve got a bit of experience in this area ... I create online courses for a living as an instructional designer at an Ontario community college.</p>
      <p>There are three software tools we use (all have competitors). One is Elluminate, which allows real-time conferencing. The beauty of this is that it allows up to 24 students and a teacher (more with a higher licence) to meet and discuss things. As mentioned, the instructor can share software on his computer, or allow a student to share his software. This means the student can _do_ the thing that s/he is having trouble with, and the instructor can see what the problem is, usually instantly if it is a rookie mistake.</p>
      <p>Theoretically all classes could be done with this software, but in fact I only recommend it for an initial meeting, and for remedial help. The reason is that the biggest benefit of online instruction is the ability to work to your own schedule, and having a fixed meeting time elliminates this. (The software does allow a session to be recorded, which means those who can’t make the session can watch the replay, and also this means that if a student is having trouble with a point that last year’s class also had trouble with, the teacher has them watch the tape of last years remedial, and  only has another one if they still have trouble.)</p>
      <p>The second key piece of software we use is something called Captivate. This allows you to build tutorials where your computer screen is recorded, along with your voice (and any annotations you want to add to the screen later). This software, or something similar, is what they use to do the Lynda.com tutorials, if you are familiar with those.</p>
      <p>Finally, you need a learning management system. We use Angel, although WebCT, Blackboard, and Desire2Learn are commercial competitors, and Moodle and Sakai are the open source alternatives. These are course management tools and handle internal email, testing and marks, and holding the files. If you are working with a college or university, they should have one of these and will give you a course shell. If not, and you have strong software skills (can set up a server, for instance) then Moodle will work for you.</p>
      <p>(Thanks to hrant for pointing this thread out to me ... I’ve been off this week ... it is rough working in education ... and not following the threads).</p>
