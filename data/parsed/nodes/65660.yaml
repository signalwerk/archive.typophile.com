      <p>On the one hand, I agree with James, Nina, and Jos. In my own Hypatia Sans there are a number of elements that reflect the distinctive influence of Robert Slimbach, most notably the lowercase “y.”</p>
      <p>That being said, it was hard for me in the early days of being a journeyman type designer to figure out  when an input from Rob reflected that there was something truly “wrong” with a letterform, or if it just meant that he would do it differently. Most often there would definitely be something wrong, but of course Rob’s suggestion would reflect how *he* would tackle it.</p>
      <p>Mind you, in my case, the main thing I was learning was more harmonious curves and other optical subtleties, which really do have something of the absolute about them. IMO, anyway.</p>
      <p>Cheers,</p>
      <p>T</p>
