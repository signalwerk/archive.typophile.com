      <p>My 2 cents: Don’t let not having a dedicated mentor/teacher —no doubt, a pretty awesome concept— discourage you.<br>
      FWIW, I’ve had a bit of formal education in type design (a part-time postgrad class) but during that same time I actually learned more here +  through books + at a couple of type conferences maybe. There’s so much material out there, so much to learn; so much type to study. Libraries to dig through. Even just reading through the archives here reveals a ton of concepts to explore, and things to learn about. Sink the teeth of your curiosity into every bit you can get! It’s hard, and requires more initiative, but it sure can work.</p>
