      <p>Kosal — Another suggestion to help your development: Consider attending one of the annual type conferences. Many provide workshops, which can give a shot in the arm. More importantly, these are good places to meet and establish professional relationships with other type folks, which could lead to the kind of one-on-one critiques you seek. </p>
      <p>In the U.S., <a class="freelinking-external" href="http://www.typecon.com">TypeCon</a> may be the easiest to get to (in Los Angeles next August). But there’s also <a class="freelinking-external" href="http://www.typoberlin.de/2010/index.php/1/2">TypoBerlin</a> (in Berlin next May) and <a class="freelinking-external" href="http://www.atypi.org/">ATypI</a> (in Dublin next September).</p>
