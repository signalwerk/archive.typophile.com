      <p>I took a look at your pdf, (and first: nice work). You should fatten your dot for i. Using that with ’i macron’, you get in trouble.</p>
      <p>Your overshoot of (I guess two or three units) does not work. With such wide design, you should keep all glyphs in x-height.</p>
      <p>With ink trapping, have you considered putting two control points instead of one when it gets really tight?</p>
      <p>Your ’A’ looks too narrow, and ’S’ too wide.</p>
