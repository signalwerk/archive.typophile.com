  html: |-
    <p>Hi there,</p>
    <p>I am currently working on a project that uses "Alright Sans" as the primary typeface. I am looking for a versatile, serif as a complimentary typeface, and for large blocks of text. Not much of a brief on this one, but needs to feel modern, serious, legible, and suggest longevity, history – a bit of a confusing brief you will agree!</p>
    <p>Freight (and Freight Micro) are currently leading the way, hoping for some more suggestions though!</p>
    <p>Thanks,<br>
    Steve</p>
