  html: <p>The Public Radio International program "To the Best of Our Knowledge" just did an hour on fonts. There were interviews with Jonathan Hoefler and Tobias Frere-Jones and with Matthew Carter. The program is online for a week at <a class="freelinking external" href="http://wpr.org/book/">http://wpr.org/book/</a>.</p>
