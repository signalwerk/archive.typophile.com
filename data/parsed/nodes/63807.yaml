    html: <p>Sure 75% is good if you look at it that way, but why not make it 100%? Font coverage is hard enough to get, and rare enough; they wouldn't have to twist it all around in the end and conclude that really, handwriting is just so *natural* and *personal* and let's all write letters by hand now. It seems to give the preceding font talk sort of a weird aftertaste. But maybe that's just me.</p>
