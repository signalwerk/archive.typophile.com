    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blogs" class="freelinking" rel="nofollow">Blogs</a> : Daidala.com</strong></p>
    <p>To call it a blog would be uncouth. Daidala features the highly entertaining writings of <a href="/wiki/Jon%20Coltz" class="freelinking" rel="nofollow">Jon Coltz</a> and centers around the world of letters. Features interviews of <a href="/wiki/Hrant%20Papazian" class="freelinking" rel="nofollow">Hrant Papazian</a>, <a href="/wiki/Siegfried%20R%C3%BCckel" class="freelinking" rel="nofollow">Siegfried Rückel</a>, <a href="/wiki/Aimee%20Bender" class="freelinking" rel="nofollow">Aimee Bender</a>, <a href="/wiki/Dyana%20Weissman" class="freelinking" rel="nofollow">Dyana Weissman</a>, <a href="/wiki/Mike%20Abbink" class="freelinking" rel="nofollow">Mike Abbink</a>, <a href="/wiki/Jonathan%20Hoefler" class="freelinking" rel="nofollow">Jonathan Hoefler</a>, <a href="/wiki/Sebastian%20Lester" class="freelinking" rel="nofollow">Sebastian Lester</a>, <a href="/wiki/Jessica%20Helfand" class="freelinking" rel="nofollow">Jessica Helfand</a>, <a href="/wiki/Evert%20Bloemsma" class="freelinking" rel="nofollow">Evert Bloemsma</a>, and <a href="/wiki/Eric%20Olson" class="freelinking" rel="nofollow">Eric Olson</a>.</p>
