      <p>Q1 I don't agree, the alignment should be the same<br>
      Q2 Align on the logo wording<br>
      Q3 It is quite acceptable to have a serif or sans as long as they don't come to close to mimicking the logo<br>
      Q4 Elegance is subjective but I would definitely lean toward Georgia in this case because the high contrast and the smaller x-height of a Bodoni are too much for the small size required for business cards</p>
      <p>It looks to me that you have used a faux italic in some cases, please don't. Although both Verdana and Georgia were primarily developed for screen use they can work well for print. Out of the choices you provided I think that the Verdana upper right works best I would enlarge the logo from the top left to align the type with the text block and move the name vertically closer to the address block. Something to consider is that if you have a longer email address you will run over the edge of the card so look at moving the whole block to the left to allow plenty of space.</p>
      <p>Hope this is of some help, to save the headache though you might be better approaching a professional designer.<br>
      Tim</p>
