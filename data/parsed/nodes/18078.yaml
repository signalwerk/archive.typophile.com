      <p>Tim </p>
      <p>thanks for the feedback. We will at some point certainly get a professional review of all collateral but at this stage our best effort will have to do... </p>
      <p>Verdana was actually also my preferred font. In regards to Q2 I am still struggling with the alignment because the rather "slim" graphical element in the logo seems somewhat out of place to me when positioned left of the text block. However, I will work on the size as you have suggested and see how that will impact it. </p>
      <p>Thanks again, Thomas</p>
