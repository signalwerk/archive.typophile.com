    <p>Dear typophiles community</p>
    <p>not being a professional designer (rather a number crunshing finance guy) I have tortured my brain over the layout of a business card for a newly established company in the finance sector and would like to get your views on some questions plus any helpful criticism. </p>
    <p>The logo consisting of a [graphical element] + "Syntaxis capital" [serpentine] is set. The card should be easy on the eye and convey a professional look and feel. </p>
    <p>Q1: I have not been able to find examples for bcard where the logo (containing wording) is rotated against the information block. I believe this makes the logo appear more graphical and should also improve recognition without diminishing seriousness (see Verdana upper right vs left side)</p>
    <p>Q2: if I keep the logo in the upper right corner should the information block align with the left of the logo wording or with the graphical element (actually the lower left corner of the graphical element) (see franklin gothic logo ailgnment)</p>
    <p>Q3: does it matter to mix serif for the name/title/info block with sans-serif for the logo wording (see serif vs. sans-serif)</p>
    <p>Q4: is it my personal impression that for serif types Bodoni is more elegant in the bcard context than Georgia? (see serif types Bodoni vs Georgia)</p>
    <p>Thank you for your comments and ideas</p>
    <p>Thomas</p>
