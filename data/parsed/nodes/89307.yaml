    html: <p>If you're comparing it to examples on House's site, they would be using the version of the "r" that's meant to be used in the middle of a word, which flows seamlessly from the previous letter. The "r" in the settings above is the default, but that's because the other one would look weird alone or at the beginning of a word. The substitution should happen automatically in OpenType-savvy apps. The original version was pre-OpenType and actually came with a special program that would do the substitutions for you.</p>
