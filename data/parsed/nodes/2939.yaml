    html: "<p><img src=\"http://www.typophile.com/forums/messages/83/25466.gif\" alt=\"\"> <br> <br>Yes, I would agree with Mr. Mike Yanega, the baseline bounce must not result from the font design, taking the fact that same letters don't come in the same position, (same situation with the sample above), so I suppose the positioning of each letter is indeed random, and not resulting from the font design in itself. <br> <br>Also, in my tries to identify this one, I too have come to an other AOE's font: Lord Rat ( <a href=\"http://www.myfonts.com/fonts/astigmatic/lord-rat-aoe/\" target=\"_blank\">http://www.myfonts.com/fonts/astigmatic/lord-rat-aoe/</a> ) Not quite it, either, though... <br></p>"
