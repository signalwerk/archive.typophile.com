    user_path: null
    date_raw: 12 Apr 2004 — 10:38am
    date: 2004-04-12T10:38:00
    votes: null
    html: <p>I must withdraw my earlier suggestions, neither is closer than House Rhumba which I think is the base weight of this font. <br> <br>Other than the alternate cap P and r, which may or may not be part of perhaps an OT version of this font, it looks really darn close to me. The glyph forms are just too close to it for this not to be Rhumba with some alts and might I add really bad tracking/kerning as it is set on the site.. <br> <br>Stuart :D</p>
