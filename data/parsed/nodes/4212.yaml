    html: <p>Well, I have to agree that Sawdust Marionette isn't the same, now that I looked at the original and it together. It had enough similar features that I stopped looking, as we were getting ready to leave for the weekend. Another near miss is ITC Juice. Can you show us the two you mentioned Stuart? Here are my two (below), with the original. You know if you used Fontographer and merged these two  it might be close... <br><img src="http://www.typophile.com/forums/messages/83/33202.gif" alt="P&amp;P Simulations"></p>
