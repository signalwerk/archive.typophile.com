  - id: 31347
    user_id: 2088
    user_name: bowfinpw
    user_path: null
    date_raw: 10 Apr 2004 — 7:30am
    date: 2004-04-10T07:30:00
    votes: null
    html: <p>Luc Devroye's site says the designer was 'Bonefish Sam'. Further Googling reveals that this is the same Bonefish Sam as 'Bonefish Sam &amp; His Power Orchestra' (an Idaho band?) who also does writing, graphics and web design for Bosch's Occasional Journal  <a href="http://www.boschs.org/stuh/authors.shtml" target="_blank">(it says here)</a>. It's a <i>very strange</i> journal, like something Beavis &amp; Butthead would have done, so this font-man is out there!The Journal is definitely 'occasional' too, because the newest article is from 2002. <br> <br>There was apparently a famous fishing guide in the Bahamas with this nickname too, whose real name was Sam Taylor.  (Ain't Google a marvel?) <br> <br>I guess I really don't have enough to do. Sorry for the diversion.</p>
