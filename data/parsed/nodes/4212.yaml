    html: <p>This one is driving me crazy, too. I just noticed this evening that the same exact font is used on the Rocky &amp; Bullwinkle Season 1 DVD Collection packaging. Out of curiosity, I managed to download and open one of the Flash SWF files on the Pride and Prejudice site. Of course, the font itself was not accessible, but there was a reference to it. It is listed as "DesigersBold" (whatever that is). A search on the web yielded no font with that name. (I also tried spelling it "DesignersBold".)</p>
