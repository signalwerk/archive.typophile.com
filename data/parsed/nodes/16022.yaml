    <p>All around the forums I continue to hear rumblings about <strong>font explorer x</strong>. I've started to download it a few times only to realize that I have changed font management tools so many times that, if anything, I'm only about to cause myself more heartache. </p>
    <p>People keep saying how fast it is. so, how fast is it? how stable is it. has anyone been using font agent pro and switched and laughed out loud at the improvement?</p>
    <p>I grew up on ATM. I've used Suitcase, Masterjuggler, Font Reserve and even tried to work with Font Book. </p>
    <p>Yes, I still miss ATM. Kinda sad really. I don't miss the UI.</p>
    <p>Typographica has a thread. I know that already. I just want to hear from users of FE/X and there likes and dislikes. </p>
    <p>I'm using my blog because I am also sick to death of threads asking about font management. </p>
    <p>=^&gt;</p>
    <p>[update: as of last Friday I am quite happily using FontExplorer X. You can <em>slowly</em> train the applications to not ask for the fonts.]</p>
