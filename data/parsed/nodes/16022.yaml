    html: |-
      <p>Smart Sets are dynamic font sets.</p>
      <p>In a font, you have a wealth of information. Aside from the font name itself, you have a copyright and trademark string embedded. Many OpenType fonts have designer names embedded, foundry name embedded, distributor embedded, even a font description embedded, production year, etc.</p>
      <p>So, to create a Smart Set, click on "New Smart Set" first. Lets name this first set "Adobe Fonts." Using the pull down menus, tell the set to include any font whose copyright string contains the word Adobe. All Adobe fonts will now also be displayed in a Smart Set folder. Every time a new Adobe font is installed, it will appear in this folder as well.</p>
      <p>Anything could go into a Smart set, really. All Italics. Or all Expert fonts. Or all fonts designed by Robert Slimbach.</p>
      <p>Since every font in FontExplorer X has its own comment field, you can also make smart sets based on your own comments. Lets say that one of your comments is "single storey a." Then you could have a Single Storey A smart set, too.</p>
      <p>Also, you can give fonts a rating, just like you can rate songs in iTunes. Ratings can be a Smart Set criterion as well.</p>
