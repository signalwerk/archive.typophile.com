      <p>JamesM, thanks for your comments.  I should have explained a bit more that 30 feet is very roughly the minimum viewing distance as one drives by, rather than the span of road from which the sign is visible.  I would estimate that the sign is visible for more than 200-300 feet as you drive toward it, and from looking at charts, getting clearly readable to most people at 150-100 feet.  That would give a viewing time of 4-6 seconds, and a reading time of 2-3 seconds, which is actually quite a long while for such few words in my opinion.  Let's say perfectly adequate for communicating the main message of wayfinding and awareness, don't you agree?<br>
      I was reluctant to post the screen shot because I am not really looking for ways to toss out whitespace in favor of larger text as you handily achieved, but rather to understand the underlying principles and gain a better understanding of how to approach that balance.  Unfortunately, you didn't give me enough insight into your thinking behind the changes you made, so I wasn't able to appreciate your motivation and goals.  To be clear, I am not looking for ways to make the text larger** - the scale tool is easy enough to operate.  Rather I was looking for insight and others' perspective on the relative importance of factors other than text size, and also whether to interpret the charts as x-height or cap height.   Yes, fairly abstract and theoretical, but I pegged you lot as a heady group, and hoped to learn something.  Looking at Ralf's blog and Clearview gothic has been very interesting!  Thanks for those links.  The idea of a mockup is spot on, I will try it out.  I did some tests on screen standing across the room, but printouts would definitely help make it more realistic.  </p>
      <p>**My comments about "the desire to maximize letter size" were admittedly a bit misleading.  Those were not my desires, but rather other folks involved in the project, who do have some experience in signage.</p>
      <p>-edit-<br>
      Russel, I posted only to see your previous post.  Additional signs are out of the question I think.  Putting one there would mean that it is in a front yard of a home, since it is all residential in the area.<br>
      This sign will not be on the corner, so I hope that people will understand to turn-as-soon-as-you-can at the end of this block.  Is that really confusing?  I often see billboards on the highway that say "next exit".  Even if they successfully make that right, they will not see the building unless they take the right onto reed st.  It really is just around the block, but without 2 turns you would miss it.  I tried to add a bit of an arrow feel to the green background shape, but I can see how it's a bit more subtle on this background than on an actual sign.</p>
