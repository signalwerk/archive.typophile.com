      <p>&gt;  What specific goals are you addressing<br>
      &gt; by suggesting making things larger?</p>
      <p>You said the sign will be viewed at 30 feet by someone traveling 35 mph. A car traveling at 35 mph travels 51 feet per second. So the sign will be visible for less than **one second**.</p>
      <p>Even if we assume they're traveling slower, or can see if from a greater distance, we're still only talking about enough time for a very quick glance. So readability is a high priority, and it looked like the type &amp; logo could be made considerably larger without making it look crowded.</p>
      <p>Here's a quickie example. I made the type bigger, eliminated the phone, and centered the type on the right (since the type on the left is centered).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sign_4764.jpg"></div><p></p>
      <p>&gt; the phone number was requested </p>
      <p>If this sign will only be readable for a second or two while someone is driving by, you need to convince them that a phone number is a bad idea, and even potentially dangerous if someone tries to copy it down while driving.</p>
