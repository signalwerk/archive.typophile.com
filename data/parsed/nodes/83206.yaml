      <p>OK, that certainly sounds better. </p>
      <p>&gt; Unfortunately, you didn't give me enough insight into<br>
      &gt; your thinking behind the changes you made</p>
      <p>I wasn't trying to do anything profound. I just made the type easier to read from a moving car by reducing the number of words and making the type bigger. :)   </p>
      <p>The centering wasn't for readability, though, it was just a judgement call that if your logo uses centered type then it's more consistent to use centered type on the right side, too, rather than having mixed alignments.</p>
      <p>But the only way to really find out the best size for the type is to make a mockup, put it in the actual location, and have some friends view it from a moving car. Perhaps your current type size will be fine. But my gut instinct is that making the type larger (like in my mockup) will make it easier to read. And if a sign can't be read, it can't communicate the intended message.</p>
