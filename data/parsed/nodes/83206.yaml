      <p>I have limited experience with road signs, but one tip is to make a mockup to test. Of course this may be impractical if the sign is huge, but for a smaller sign it's often possible, or you can at least mockup a few words from the sign in actual size. Then hang it up and drive by in your car and see how readable it really is.</p>
      <p>At a design firm I worked for we needed to create a sign to place in front of a client's office. We projected an image of our layout onto a big piece of white cardboard and drew it using markers, then hung the cardboard where the sign would go and drove by. We discovered the type was way too small. Saved us a lot of money and embarassment to find out before the final sign was fabricated.</p>
