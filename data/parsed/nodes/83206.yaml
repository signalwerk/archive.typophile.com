      <p>30 feet at 35mph does not offer very much time to react. I would think you'd want to give the driver a bit more time than that to be able to make a decision.</p>
      <p>I would suggest you make a full size mockup of the sign as close as possible to the final materials that you will use and set it up outside.</p>
      <p>Letterpace is important, as is robust glyph shape, this is no place for delicate display lettering. Also important is space surrounding the legend. Do not crowd the primary legend. The more surrounding "noise" there is, rules, borders, secondary legends, the more the primary legends performance will deteriorate. Mixed case should be used.</p>
