      <p>Whitespace around the text/lines: very important in this context!<br>
      Letter spacing: depends on the viewing distance. It’s the same principle as making the tracking in small print sizes larger. You want to make the space between the letters so, that at the largest possible viewing distance, letters can still be easily differentiated.  </p>
      <p>Case: What do you mean by »title case«?<br>
      In general you would want to use mixed case and uppercase/small caps only for VERY short pieces of information. </p>
      <p>Hierarchy: Would depend on your design. Do you have some screenshots?<br>
      My personal experience with road signs: Hierarchies are best displayed thru position/spacing and color inlays. All those different font styles and sizes we use in print create too much distraction on a road sign. </p>
      <p>You might want to check out my blog:<br>
      <a href="http://opentype.info/blog/tag/legibility-series/" title="http://opentype.info/blog/tag/legibility-series/">http://opentype.info/blog/tag/legibility-series/</a><br>
      <a href="http://opentype.info/blog/category/traffic-typefaces/" title="http://opentype.info/blog/category/traffic-typefaces/">http://opentype.info/blog/category/traffic-typefaces/</a></p>
