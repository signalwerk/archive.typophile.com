    html: <p>The advert contains much more "noise" on the sign, than a simple guide sign would contain. All of that extra noise will have a negative effect on the legibility of the main legends, but in this case I doubt it matters, if the driver can't read the sign in time he/she will simple miss the turn for the church. I wouldn't want to see this approach to designing warning signs.</p>
