      <p>Great resource jabez!  Answered my questions:</p>
      <p>"Negative space ideally should not be less than <strong>60 percent</strong> of<br>
      the sign or background area."</p>
      <p>"The USSC Standard Legibility Index is a numerical value representing the distance in feet for every inch of <strong>capital letter height</strong> at which a sign may be read. The table also reflects the <strong>15 percent increase in letter height required when all upper case letters (all caps) are used</strong> instead of upper and lower case letters with initial caps, a difference in recognition distance documented in earlier studies by the researchers at the Pennsylvania Transportation Institute."</p>
      <p>Emphasis added by me.</p>
