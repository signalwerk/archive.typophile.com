      <p>Thanks.  I should have mentioned that the phone number was requested so that if people are not able to find the location they can call.  I don't think it is an option at this point to eliminate it.  I was thinking that making everything a lot larger will do anything but clutter and eliminate whitespace.  What specific goals are you addressing by suggesting making things larger?  Maybe if you could describe the problem you see so that I can come to my own conclusions about the solution?</p>
      <p>In general these are the questions I have:</p>
      <p>- In these height charts, is the text size measured by cap height or x-height?  Given that lower case letters are shorter, does that mean that text set in all caps will be more readable from a distance than lowercase of the same point size?  (I assumed the opposite)</p>
      <p>- What strategies do you use in balancing text size, tracking and whitespace to preserve readability while maintaining asthetic quality?</p>
      <p>- Since it is easy to use these charts to be rigid about measured letter height minimums, how do you navigate and communicate the wholistic approach of incorporating ideas about whitespace, tracking, font selection, etc. instead of focusing solely on measured size of the smallest letters?</p>
