    html: |-
      <p>In designing signs like the one above, I imagine that one would also have to take into account the environment that the sign will be placed in? For example, are there competing signs, billboards, etc? </p>
      <p>I might define [raising awareness] and [wayfinding] as two separate objectives.<br>
      Raising awareness: Letting people know that the organization exists in the neighborhood<br>
      Wayfinding: Helping people to get to the organization</p>
      <p>&gt;That would give a viewing time of 4-6 seconds, and a reading time of 2-3 seconds, which is actually quite a long while for such few words in my opinion.</p>
      <p>That seems somewhat optimistic to me. It might not be long at all*, especially if you consider all the things one must pay attention to while driving – other road users, traffic conditions, lights, the phone, radio, kids, etc. Unless the road is extremely clear, I often can't afford to take more than one or two quick split-second glances at a sign. </p>
      <p>I'd imagine I might experience it somewhat like this:<br>
      First glance: Spot the logo<br>
      Second glance: Try to decipher the words</p>
      <p>*Speaking from my limited experience as a driver (7 years)</p>
      <p>This looks like it might be a helpful read: <a href="http://www.usscfoundation.org/USSCGuidelineStandards.pdf" title="www.usscfoundation.org/USSCGuidelineStandards.pdf">www.usscfoundation.org/USSCGuidelineStandards.pdf</a></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/test_4796.png"></div><p></p>
      <p>I've never enjoyed math (equations always gave me a headache) so I'll leave it to the experts to decide whether those equations in USSC's "research-based" approach are useful.</p>
      <p><cite><br>
      DETERMINING SIGN SIZE – Calculation Methodology<br>
      The size of a sign is determined by the size and length of the message and the<br>
      time required to read and understand it. It can be calculated once the numerical<br>
      values of the five size determinants –Viewer Reaction Time, Viewer Reaction<br>
      Distance, Letter Height, Copy Area, and Negative Space – have been<br>
      established. </cite></p>
      <p>The step-by-step process to determine sign size, which is explained below, is<br>
      useful not only as a calculation method, but also as a means of understanding<br>
      the elements involved in the calculation.  </p>
      <p>Area of Sign / Computation Process:<br>
      1. Determine speed of travel (MPH) in feet per second (FPS): (MPH x 1.47).<br>
      2. Determine Viewer Reaction Time (VRT).<br>
      3. Determine Viewer Reaction Distance (VRT x FPS).<br>
      4. Determine Letter Height in inches by reference to the Legibility Index (LI):<br>
      (VRD/LI).<br>
      5. Determine Single Letter Area in square inches (square the letter height to<br>
      obtain area occupied by single letter and its adjoining letterspace).<br>
      6. Determine Single Letter Area in square feet: Single Letter Area in square<br>
      inches/144.<br>
      7. Determine Copy Area (Single Letter Area in square feet x total number of<br>
      letters plus area of any symbols in square feet).<br>
      8. Determine Negative Space Area at 60% of Sign Area (Copy Area x 1.5).<br>
      9. Add Copy Area to Negative Space Area.<br>
      10. Result is Area of Sign in square feet.<br>
      </p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sign-01_5830.png"></div><p></p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sing-02_4344.png"></div><p></p>
