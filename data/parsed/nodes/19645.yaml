    html: <p>I'd say as other Typophile member. Look nice and inspiring to me. I saw you've redraw some letter in adding more detail. The bottom of the U and the join of the Y should be more like the C, the D or the bowl of the B, R. The I would be nice, to my point of view, if he looks like the stem of the R. You still have to work mor on the Z and the L.</p>
