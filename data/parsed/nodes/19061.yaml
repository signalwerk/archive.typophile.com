      <p>Regarding languages: if you only need a few basic weights, the best language-supporting version of Helvetica is Helvetica World (on the Linotype website, you can find all three versions of Helvetica, in all available font formats).</p>
      <p>It is a bit more expense, but Helvetica World is an OT font family whose fonts have enormous character sets. Inside are glyphs covering all Western, Central, and Eastern European languages that use the Roman alphabet (including Turkish and the Baltic languages). Vietnamese, with its stacked accents, is also supported, as are Greek, Cyrillic, Hebrew, and Arabic. There are also some border-building ornaments in the character set.</p>
    html_clean: |-
