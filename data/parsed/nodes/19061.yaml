      <p>Kevin, to answer your question, there is no short-term need for you to license the OT version of Helvetica instead of the TT version.</p>
      <p>OT's benefits are often long-term, esepecially for customers in the US who primarially only design in English (or occassionally Spanish). Some OT fonts are packed with features, including extra ligatures, small caps, old style figures, etc. But Helvetica is not one of those. Helvetica's OT strong suit is language support.</p>
      <p>Fonts are with us for years. Who knows what clients a designer will have five years down the line. Can you rule out that you'll never have to set a block of text in Hungarian, Polish, or Czech?</p>
    html_clean: |-
