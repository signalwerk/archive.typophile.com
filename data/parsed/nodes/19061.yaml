    html: |-
      <p>I don't think there is any visible difference between OT, PS, and TT outlines in print. Very old film makers might have problems, but that is unlikely. I think that the whole PS vs. TT thing has become more of an urban legend among designers. I seem to recall Adobe and Microsoft staff repeating in online forums again and again that the whole "PS = Print and TT = Screen" thing is a myth (although TT fonts can have better onscreen hinting).</p>
      <p>If you buy the TT fonts, and you use a Mac, I'd recommend buying Mac TT and not PC TT. I know that you can install PC TT fonts on Mac OS X, but it isn't recommended, and I don't think that anyone offers you tech support on that; it is a work-around, not a solution. OT fonts, on the other hand, are really cross-platform.</p>
    html_clean: |-
