    <p>Please excuse my ignorance and the urgency (need to make comps with helvetica and don't own the appropriate weights to please the client), but...</p>
    <p>what exactly are the benefits of having Helvetica in OpenType against TT, when (1) I design in English and (2) Mac OSX supports TT.  </p>
    <p><strong>Is there some other reason to purchase specifically Helvetica in OpenType format?</strong></p>
