    <p><em>Berlin, April 4, 2011 — FSI FontShop International launched a new FontFont.com, the online home for the largest library of contemporary type designs.</em></p>
    <p>The new <a href="http://www.fontfont.com" rel="nofollow">FontFont.com</a> is a complete reconstruction of the digital foundry’s website. Everything is new and enhanced, from the visual design and navigation to the search functionality and shopping experience. But the most radical improvement is in the presentation of the fonts themselves. </p>
    <p><a href="http://www.fontfont.com" rel="nofollow"></a></p><div class="imageWrap"><a href="http://www.fontfont.com" rel="nofollow"><img src="http://typophile.com/files/new_fontfontdotcom_4323.png"></a></div><br>
    <em>Extra large typeface samples appear in FontFont.com’s new Browse section</em><p></p>
    <p>Ivo Gabrowitsch, Project Lead and FSI Marketing Director, said, “At the start of the project we wrote down three goals: easy-to-use, clean, and fast. After ten months of intensive work, this is exactly what the new FontFont.com is about. That and big, gorgeous typefaces, of course.”</p>
    <p>Indeed, the typefaces are now the clear focus of the website. Product information, formats, and other secondary details don’t appear until they are useful in the user’s selection process. Extra large typeface samples appear without superfluous information and distractions. At the family level, FontFonts are illustrated by hundreds of large, full-color sample images and real-world examples of the fonts in use. </p>
    <p>Despite the power and flexibility of the site, simplicity is key. It was built to benefit font users of any skill, responding to the needs of beginners and professionals alike. Browsing, searching, and licensing FontFonts is an effortless and enjoyable experience. </p>
    <p>The new FontFont.com was developed by <a href="http://www.fontshop.com/" rel="nofollow">FontShop</a> co-founder and world-renowned typographer <a href="https://www.fontfont.com/designers/erik-spiekermann" rel="nofollow">Erik Spiekermann</a>, along with his team at <a href="http://www.edenspiekermann.com/" rel="nofollow">Edenspiekermann</a>. As the father of the FontFont library, Spiekermann was eager to rebuild its home that hadn’t seen significant changes in more than a decade. His goal was to refocus on the core principles by which the contemporary library is known.</p>
    <p>“This is more than a new site. We’re putting the brand back on its feet. See as many fonts as immediately as possible. Colour only when necessary. No ornaments, no dross, no dribble.” said Spiekermann.</p>
    <p><strong>Visit FontFont at: <a href="http://www.fontfont.com" rel="nofollow">http://fontfont.com</a></strong></p>
