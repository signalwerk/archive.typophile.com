      <p>For metal type, the position of the baseline was standardized at the end of the 19th century, although there was more than one standard ("art line" allowed for longer descenders than usual). Of course, this position is dependent also on the point size.</p>
      <p>The amount of depth is referred to as "type high." I read that the value is 23.3 mm, or 0.9186". I think there may have been a competing standard for this in Europe, however.</p>
      <p>Cheers,</p>
      <p>T</p>
