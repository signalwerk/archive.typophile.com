    html: |-
      <p>Jason, </p>
      <p>in digital fonts, the body of the letter (the block) is intangible. It is only a scaling measure. </p>
      <p>The linespacing is determined by the ascender and the descender. In many text fonts, however, the sum of ascender and descender equals the body size (i.e. the UPM size, i.e. the point size). In other words, such fonts produce 10 pt type on a 10 pt leading when set solid (with no extra leading). So you could use the ascender and descender lines to determine the vertical size of the block. However, keep in mind that diacritics or tall elements of a face may hang over the vertical boundaries of the body, just like the kern of the italic f typically hangs over the horizontal boundaries of the body. </p>
      <p>A.</p>
