    <p>As part of a research project for school I'm going to be designing and then producing woodtype using a laser engraver. I'm wondering how best to approximate the traditional size of the wood block surrounding each letter.</p>
    <p>I know that the 1000 UPM is essentially defining the vertical dimensions of the letter block, but, how do I determine where to place the letter vertically? That is, how do I determine how far above the cap-height, or ascender height, the edge of the type block is? Also, I am wondering if the left and right sidebearing measurements equate to the left and right sides of the block. At first guess, that would appear to be where those measurements come from, but I could be wrong and would prefer to know for sure.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Picture14_5636.png"></div><p></p>
