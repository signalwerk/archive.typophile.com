      <p>Typecasting (in metal) was rather flexible in this — eg if a customer needed say 10 pt type and wanted to have 14 pt leading, one could order a certain amount of 10pt type on a 14 pt body (incorporating the leading, thus eliminating the need for ‘real’ leading).</p>
      <p>Just do what feels right (and take in account that wood has a different way of behaving — having some latitude is handy: you can always shave off some material).</p>
      <p>If all of the material you are going to print is your woodtype, depth is not an issue. Clamp it together, ink and make an impression…</p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
