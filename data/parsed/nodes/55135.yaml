      <p>Are you planning on using it on a letterpress? If so you need to keep in mind that the type height (the thickness of the block, so from the bottom of the block to the top surface of the letter) has to be a certain value, otherwise it won't print.</p>
      <p>I don't know exactly how high though (since this is sometimes different in other countries). Overhere it's usually measured in augustijn (= 1 cicero = 12 <em>didot</em> points). If I'm not mistaken (it has been a long time since I did letterpress printing) the type height is also measured in these units. I believe the UK/US used Pica, which is 12 points.</p>
      <p>In any case, I would just get some woodtype, and start measuring some things, like what the type height must be. Look how they aswered the questions you have in your post, too, like the vertical placement of the letters on the block.</p>
