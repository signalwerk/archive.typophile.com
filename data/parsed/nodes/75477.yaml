    date_raw: 21.Oct.2010 1.24pm
    votes: null
    html: <p>Thanks for your help, guys! Burbank looks similar, and nice, but a little more groovy and hand-lettered than I'm looking for. It's a shame Sans Serif Medium Condensed was never digitized (I'm assuming it wasn't; with a name like that it seems like it'd be virtually impossible to search for it online).</p>
