    date: 2010-10-20T17:41:00
    date_raw: 20.Oct.2010 5.41pm
    votes: null
    html: <p>Pretty sure this is an old metal face by Monotype called Sans Serif Medium Condensed. It was very similar to Kabel, but had alternate characters so it could also mimic popular faces like Futura (hence the "g").</p>
    html_clean: <p>Pretty sure this is an old metal face by Monotype called Sans Serif Medium Condensed. It was very similar to Kabel, but had alternate characters so it could also mimic popular faces like Futura (hence the "g").</p>
  - id: 435633
