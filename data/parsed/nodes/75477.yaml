    html: <p><a href="http://new.myfonts.com/fonts/dtptypes/kabel-dtcondensed/?testdrive=src%3Dcustom%26text%3DBegin%2520in%2520%25E2%2580%259978%26size%3D81%26fg%3D000000%26bg%3DFFFFFF%26w%3D720%26goodies%3Dot.liga%26dock%3Dfalse%26seed%3D34" rel="nofollow">Kabel DT Condensed</a> is fairly close, although it doesn't have the alternate "g" and the stroke endings are horizontal. And the apostrophe is different. And the weight. Okay, not that close, but Kabel was what Sans Serif was more or less copied from.</p>
