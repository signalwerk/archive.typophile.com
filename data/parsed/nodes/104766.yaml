    <p>I am putting together an identity for a project that deals with establishing network connections between Internet nodes and it is tentatively called <em>The Peering Project</em>. The following is a symbol I am currently iterating over - </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ikebana-3_5775.png"></div><p></p>
    <p>and the black and white version -</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ikebana-2_4510.png"></div><p></p>
    <p>I am my own client, so life is hard and I need external opinions. </p>
    <ul>
    <li>For one, if it resembles anything existing (I can't think of anything).
    </li><li>For two, if it's too generic or, preferably, unique enough to be memorable.
    </li><li>For three, what's your first impression of it?
    </li></ul>
    <p>Thanks</p>
