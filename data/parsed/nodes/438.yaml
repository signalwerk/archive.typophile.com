    html: |-
      <p>Hrant's paraphrase above comes from Dwiggins's <i>Layout in Advertising</i> [Harper and Brothers, New York, 1928]. In the section on Type, he begins <br> <br><br>
      </p><blockquote>"What type does the architect of advertising elect to use, and why? That question is the acolyte's invariable first prayer for enlightenment -- phrased always in one of the various voices of despair -- what type shall I use? The gods refuse an answer. They refuse (sacrilege though it be to say it) because they do not know. <br> <br>"The gods of advertising turn their backs. Can we -- left to our own resources -- get any hints from the specimen-books? -- from the treatises on type? -- from schools that teach printing? -- from the lectures of experts? We cannot. <br> <br>"We have left, then, only one course to pursue -- to learn from the advertisements themselves."<p></p></blockquote>
      <p> <br> <br>-- Kent. <br> <br></p>
    html_clean: |-
