  html: |-
    <p>I am certain this one is pretty commonplace, and I’m usually pretty good at spotting them myself.<br>
    I’m afraid there isn’t a lot to go on, but the lower case t is probably the most significant with an asymmetrical cross bar and an oddly radiused bowl.</p>
    <p>If you can even come up with something similar it would be a great help.<br>
    Rob</p><div class="imageWrap"><img src="http://typophile.com/files/ttum_6089.jpg"></div><p></p>
