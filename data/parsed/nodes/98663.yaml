  html: |-
    <p>It’s with great pleasure I’m <em>finally</em> able to make this announcement: Today (at noon, CET) we are launching our type foundry, Monokrom, and with it, the five typefaces Faunus, Satyr, Vinter (née Noir), Telefon and Aften Screen.</p>
    <p>The full press release (mostly news material, but also a free Telefon sampler) is available at <a href="https://monokrom.no/press/index_en.php" rel="nofollow">https://monokrom.no/press/index_en.php</a></p>
    <p>Our website is here: <a href="http://www.monokrom.no" rel="nofollow">www.monokrom.no</a></p>
    <p>– Sindre, Hans Ivar and yours truly.</p>
