    html: <p>But the increase of weight (and the proportional system that widely dictates the process of weighting type families) uses the middle of strokes as a central axis for widening, ie glyphs are not technically widened, they are thickened and therefore widen as a result. This doesn't explain a change in angle... That would only occur with stretching, with a falsely emboldened character (MS Word etc) or an expanded version - surely it's an adjustment made outside/beyond/after the proportional system due to optical issues?</p>
