  html: |-
    <p>Is there any research covering the deliberate lessening of the angle of some diagonals as the weights of characters increase in typeface families? Oblique and upright - throughout weights and styles?</p>
    <p>It appears that diagonal angles, for example of the 4 and the flag of 1, in upright character sets, become more gradual (less steep) in pitch as they increase in weight. I understand that these design decisions are often required to avoid the massing of weight as stroke thickness increases... but has anyone discussed this (in published works) and is there a precedent set?</p>
    <p>My observations are mostly based on Geometric sans serifs but also sans in general!</p>
