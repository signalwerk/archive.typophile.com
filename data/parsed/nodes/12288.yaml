    <p><a href="/node/12288" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontsmith</a> is a leading London based type design studio founded in 1999. The studio consists of a skilled team of creatives, lead by <a href="/node/add/wiki?edit%5Btitle%5D=Jason%20Smith" title="Create node &quot;Jason Smith&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jason Smith</a> and <a href="/node/12287" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phil Garnham</a>. Fontsmith is dedicated to designing and developing high quality typefaces for both independent release as well as bespoke fonts for international&nbsp;clients.</p>
    <p>Fontsmith:<br><a href="/node/add/wiki?edit%5Btitle%5D=Jason%20Smith" title="Create node &quot;Jason Smith&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jason Smith</a> - Founder<br><a href="/node/12287" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Phil Garnham</a> - Type Design Director<br>
