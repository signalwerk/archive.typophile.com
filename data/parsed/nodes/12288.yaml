    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Type%20Foundries" class="freelinking" rel="nofollow">Type Foundries</a> : Fontsmith</strong></p>
    <p><a href="/wiki/Fontsmith" class="freelinking" rel="nofollow">Fontsmith</a> is a leading London based type design studio founded in 1999. The studio consists of a skilled team of creatives, lead by <a href="/wiki/Jason%20Smith" class="freelinking" rel="nofollow">Jason Smith</a> and <a href="/wiki/Phil%20Garnham" class="freelinking" rel="nofollow">Phil Garnham</a>. Fontsmith is dedicated to designing and developing high quality typefaces for both independent release as well as bespoke fonts for international clients.</p>
    <p>Fontsmith:<br>
    <a href="/wiki/Jason%20Smith" class="freelinking" rel="nofollow">Jason Smith</a> - Founder<br>
    <a href="/wiki/Phil%20Garnham" class="freelinking" rel="nofollow">Phil Garnham</a> - Type Design Director<br>
    Fernando Mello - Type Designer<br>
    Emanuela Conidi - Type Designer</p>
    <p>Fontsmith Ltd<br>
    Unit 17 Bickels Yard<br>
    151–153 Bermondsey Street<br>
    London SE1 3HA</p>
    <p>tel +44 (0)20 7407 8800</p>
