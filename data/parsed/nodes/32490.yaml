      <p>Armenian food - one place for me - Caroussel in Glendale.</p>
      <p>Every time I go it surprises me again with it's excellence. I have tried to find better and couldn't.</p>
      <p>Corner of Brand Boulevard and California.</p>
      <p>Close to there is Brand Books<br>
      <a href="http://www.abebooks.com/servlet/StoreFrontDisplay?cid=66145" title="http://www.abebooks.com/servlet/StoreFrontDisplay?cid=66145">http://www.abebooks.com/servlet/StoreFrontDisplay?cid=66145</a><br>
      Honestly I can't tell you if there's lots of typographic resources - haven't been there in a while but it is one of the last standing used book stores. I like it a lot.</p>
      <p>Best fast food in LA is also Armenian - Zankou Chicken. There's one of those in Glendale on Colorado near the 2 freeway. It is REALLY good!</p>
      <p>OK - real Mexican food with a wide array of not commonly seen sauces:<br>
      La Cabañita in Monrovia (actually your could just say Glendale) - lots of different kinds of mole and other sauces you won't find just anywhere - it's excellent.</p>
      <p>Guelaguetza - A Oaxacan restaurant in the middle of Koreatown - they specialize in mole (which the Oaxacans are known for) - try the mole negro if you've never had it - it is fantastic. You could also try some edible bugs while you're there if you are really adventurous.</p>
      <p>There is now an area in the middle of Koreatown that is known as Little Oaxaca. </p>
      <p>So that's my input for LA.</p>
      <p>peace</p>
