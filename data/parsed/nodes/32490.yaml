      <p>&gt; <a href="http://www.humnet.ucla.edu/humnet/clarklib/" title="http://www.humnet.ucla.edu/humnet/clarklib/">http://www.humnet.ucla.edu/humnet/clarklib/</a></p>
      <p>They STILL haven't finished the work?! :-(  Well, you can go to<br>
      UCLA instead - they have gobs of goodies, like Aldine originals.</p>
      <p>&gt; suggestions?</p>
      <p>I once had her email, but she never replied, so you're on your own dude.</p>
      <p>Paul, you know Carousel! It's very nice, although a bit pricey. Zankou: that's actually where I took Norbert during his visit last hear. It's definitely delectable, especially if you like garlic. BTW, really traditional Armenian food tends to be hard to cook and sort of anachronistic, so virtually any "Armenian" restaurant will mostly have dishes of general Near-Eastern origin (mostly either Lebanese or Persian, depending on the owner). But that's not bad news at all!</p>
      <p>And you know La Cabañita too! (You probably meant Montrose, not Monrovia, right?) It's actually 2 minutes from my house. It's a small place (recently expanded actually) that's as authentic as you can get in these neck of the woods. The last time I went they still didn't have a liquor license, so they were making their margaritas with wine, but the food is super super. Guelaguetza, I'll have to try. Then there's King Taco in East LA: the best/worst time to go is late late.</p>
      <p>hhp</p>
