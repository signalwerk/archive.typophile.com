      <p>You are right that LA is about 1.5hrs away from San Diego (with light traffic). Umm as for type tourism... hmmm. There are typographically interesting places all over LA county. But if you focus on the downtown area of LA or San Diego you find a richer experience (typographic or otherwise)...</p>
      <p>What kind of things do you want to see? Old signs/buildings, graphic design schools, people, museums?</p>
      <p>Mikey Diaz</p>
      <p>PS... If you come out here you must try Mexican food! Avoid places that have lots white clientele as this is a big indicator that the food has been watered down for the American palette. Or upscale mexican restaurants. If you want the real deal you have to go were the all the brown people are. The holes in the wall are the best- they have lots of customers. All our restaurants have health ratings on the front of the establishments- eat at places with a big A on the front!</p>
      <p>Hrant is from LA too maybe he can chime in on this one. I've always wanted to try Armenian food but every time I'm in the Glendale area I never stay long enough to explore.</p>
