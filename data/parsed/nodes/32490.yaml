      <p>Yeah Montrose - but I'm always confused because they also say they are in Glendale.</p>
      <p>One Friday night I was eating at Guelaguetza and got out of there about 8pm. I guess they also have a club because there were a group of people that seemed to be waiting to get in. What were they doing while waiting? Listening to Oaxacan music on a boombox and performing group folk dances in the parking lot. Really cool.</p>
      <p>Corner of Normandie and Olympic. There's another one on 8th Street but it's full of TVs and when soccer is on - it's on and poppin' if you like that sort of thing. Not really for me.</p>
      <p>King Taco is the real deal - carne asada tacos to die for. Lengua too if you're into it - I like it a lot.</p>
      <p>peace</p>
