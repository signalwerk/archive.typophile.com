    <p><strong><a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000254" rel="nofollow">Candy Script</a></strong><br>
    Download the <a href="http://www.veer.com/download/pdf/candyscript.pdf" rel="nofollow">Candy Script PDF User Guide</a> to have a complete preview of use of images, fun and words.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/candytypophi_3775.jpg"></div><p></p>
    <p>Candy is a polaroid of where I live and love. I hope you like it.</p>
    <p>Inspired by Argentina and its culture, Alejandro Paul’s Candy Script captures the country’s spirit. It comes from the tradition of window sign painting, but its thick hand-brushed characters - with alternates for almost every upper and lowercase letter - have a personality all their own. Tons of OpenType alternates included, over 600 characters in all. <a href="http://www.veer.com/download/pdf/candyscript.pdf" rel="nofollow">Read more about Candy...</a></p>
    <p>Best, <a href="http://www.sudtipos.com" rel="nofollow">Sudtipos</a></p>
