    html: |-
      <p>It appears to be a freemium typeface called Big Top, which itself is derived from Dan X. Solo’s Circustime (only appears to have been available on the CD that accompanied the Dover Circus book):<br>
      <a href="http://abfonts.freehostia.com/solopedia/solopedia-c.htm" title="http://abfonts.freehostia.com/solopedia/solopedia-c.htm">http://abfonts.freehostia.com/solopedia/solopedia-c.htm</a></p>
      <p>Fontmesa’s Buckhorn comes close:<br>
      <a href="http://www.myfonts.com/fonts/fontmesa/buckhorn/" title="http://www.myfonts.com/fonts/fontmesa/buckhorn/">http://www.myfonts.com/fonts/fontmesa/buckhorn/</a></p>
