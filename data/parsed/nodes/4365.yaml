    date_raw: 20 Apr 2004 — 10:25am
    votes: null
    html: "<p>Although auto-kerning could be useful for doing a quick sloppy job, I agree with James: it will reduce your own understanding; and it will produce inferior results. I've never used it. The only auto stuff I use is things like weight change and slanting, but even for those a lot of tweaking is required. <br> <br>hhp <br></p>"
