    html: <p>I never use auto kern nor auto metrics. Spacing a font usually takes as much time, sometimes more, as drawing one.</p>
    html_clean: <p>I never use auto kern nor auto metrics. Spacing a font usually takes as much time, sometimes more, as drawing one.</p>
