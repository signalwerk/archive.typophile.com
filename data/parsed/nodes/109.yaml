    html: <p>So fast as usual! My answers go to various points made by all of you. Thanks a lot, the students will appreciate, that the job they done is appreciated elsewhere than in their classroom! <br> <br>Use this link for the pdf of the gif posted here. Don't look to close to the forms, they are done from various methods, softwares, various students! <br> <br><a href="http://perso.ensad.fr/~ensadtypo/imagesbertrand/Bertrandtest090503.pdf" target="_blank">http://perso.ensad.fr/~ensadtypo/imagesbertrand/Bertrandtest090503.pdf</a> <br> <br>Ok, lets kept the serifs. Not sure to understand what Hrant say in its last sentence? <br> <br>Yes, the proportions of the caps are odd, but they are like that in such late century typefaces, very large mono width caps, such we found on earliers Sans too. The S was not on our sample (I think), and indeed, we've done it too narrow! <br> <br>But, your comments convince me that the B, P, R are really to large for today eyes. We will make them more narrow a bit enough to kept this strange feature, without to be disturbing too much. <br> <br>Yes, Hrant, the k need to be corrected, i don't asked them to correct it yet!! Some others glyphs need to be corrected too. The ampersand is a pure invention from the student who have done the figures... <br> <br>Normally, the figures follow an intermediate weight between caps and lc (its what i say during teaching). But, its possible that some are to heavy. <br> <br>Yes I like quite a lot the numerals! the five in particularly. You right David, we make it little more wider. <br> <br>thanks again!  <br> <br></p>
    html_clean: <p>So fast as usual! My answers go to various points made by all of you. Thanks a lot, the students will appreciate, that the job they done is appreciated elsewhere than in their classroom! <br> <br>Use this link for the pdf of the gif posted here. Don't look to close to the forms, they are done from various methods, softwares, various students! <br> <br><a href="http://perso.ensad.fr/~ensadtypo/imagesbertrand/Bertrandtest090503.pdf" target="_blank" class="link-external">http://perso.ensad.fr/~ensadtypo/imagesbertrand/Bertrandtest090503.pdf</a> <br> <br>Ok, lets kept the serifs. Not sure to understand what Hrant say in its last sentence? <br> <br>Yes, the proportions of the caps are odd, but they are like that in such late century typefaces, very large mono width caps, such we found on earliers Sans too. The S was not on our sample (I think), and indeed, we've done it too narrow! <br> <br>But, your comments convince me that the B, P, R are really to large for today eyes. We will make them more narrow a bit enough to kept this strange feature, without to be disturbing too much. <br> <br>Yes, Hrant, the k need to be corrected, i don't asked them to correct it yet!! Some others glyphs need to be corrected too. The ampersand is a pure invention from the student who have done the figures... <br> <br>Normally, the figures follow an intermediate weight between caps and lc (its what i say during teaching). But, its possible that some are to heavy. <br> <br>Yes I like quite a lot the numerals! the five in particularly. You right David, we make it little more wider. <br> <br>thanks again!  <br> <br></p>
