  html: <p><a href="http://perso.ensad.fr/~ensadtypo/bertrand.html" target="_blank">http://perso.ensad.fr/~ensadtypo/bertrand.html</a> <br><br>This page, and image posted here after show a current group project of my type design students, Ensad, Paris (3 hours by week course). As usual, the end of the year, the students have so much to ﬁnish, they don’t seems serious as it need to ﬁnish it! Anyway, its where they are. And its seems interesting to see what the world (Typophile <span class="caps">IS</span> the world!) say about it? <br><br>Its a revival of a late 19th century french typeface, from a foundry called Fonderie Bertrand, who probably be purchased by Peignot later. Some of the caps proportions are strange, like the B or M. <br><br>My question is do we need to stick to this strange proportions, or need to correct them?  <br><br>The serif structure came from a friendly confrontation between three groups of students (after a close observation of some results of cutting technics). It seems to work for lc, less in some caps, I think about C, G, S, E at vertical position? What do you think? <br><br>Any others comments welcome, despite, we don’t know what can be done to correct after your comments. Only next friday of work and the typeface need to be achieved. <br><br><img src="http://www.typophile.com/forums/messages/29/10688.gif" alt="Bertrand 3"></p>
  html_clean: <p><a href="http://perso.ensad.fr/~ensadtypo/bertrand.html" target="_blank" class="link-external">http://perso.ensad.fr/~ensadtypo/bertrand.html</a> <br><br>This page, and image posted here after show a current group project of my type design students, Ensad, Paris (3 hours by week course). As usual, the end of the year, the students have so much to ﬁnish, they don’t seems serious as it need to ﬁnish it! Anyway, its where they are. And its seems interesting to see what the world (Typophile <span class="caps">IS</span> the world!) say about it? <br><br>Its a revival of a late 19th century french typeface, from a foundry called Fonderie Bertrand, who probably be purchased by Peignot later. Some of the caps proportions are strange, like the B or M. <br><br>My question is do we need to stick to this strange proportions, or need to correct them?  <br><br>The serif structure came from a friendly confrontation between three groups of students (after a close observation of some results of cutting technics). It seems to work for lc, less in some caps, I think about C, G, S, E at vertical position? What do you think? <br><br>Any others comments welcome, despite, we don’t know what can be done to correct after your comments. Only next friday of work and the typeface need to be achieved. <br><br><img src="http://www.typophile.com/forums/messages/29/10688.gif" alt="Bertrand 3"></p>
