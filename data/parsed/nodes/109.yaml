    html: <p>The irregularity of the serifs and the angles aren't so disparate that they need to be made the same. The only thing that catches my eye from my printout is the odd character widths. And really, they aren't so odd. For the question mark, I don't think it is too soft, but what if the front (top) end was trimmed flat and the back (bottom) end was left soft? Maybe this would make it match the somewhat irregular serifs?? I also like the color when it is printed. Maybe a little light for book work at the smallest point-size, I can see that, but maybe only just.  <br> <br>I printed this out on a 600dpi laserprinter.</p>
