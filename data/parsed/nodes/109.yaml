    date_raw: 12 May 2003 — 8:10am
    votes: null
    html: "<p>I think you should keep the strange stuff (we have enough \"normal\" typefaces), but you might correct optical things: color issues (like in the UC \"V\"), the lc \"k\" join, etc. <br> <br>One thing I wonder about is the descender depths: maybe it's nice to have them different? But if they're made the same, the \"y\" is the best one to match. <br> <br>The serif structure on the other hand seems to clash too much with the overall style. <br> <br>hhp <br></p>"
    html_clean: "<p>I think you should keep the strange stuff (we have enough \"normal\" typefaces), but you might correct optical things: color issues (like in the UC \"V\"), the lc \"k\" join, etc. <br> <br>One thing I wonder about is the descender depths: maybe it's nice to have them different? But if they're made the same, the \"y\" is the best one to match. <br> <br>The serif structure on the other hand seems to clash too much with the overall style. <br> <br>hhp <br></p>"
