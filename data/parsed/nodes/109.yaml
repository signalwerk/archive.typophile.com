    html: '<p>The year is over, and the students have been very happy to receive all the very fast comments from you all! Thanks on the behalf of all of them! <br><br>On same page as usual, you can download the ﬁnal nice pdf specimen they created last friday. Follow the images at the end of the page, to understand how to built it! <br><a href="http://perso.ensad.fr/~ensadtypo/bertrand.html#pliage" target="_blank">http://perso.ensad.fr/~ensadtypo/bertrand.html#pliage</a> <br><br>direct link: <a href="http://perso.ensad.fr/~ensadtypo/imagesbertrand/BertrandSpecimenA3.pdf" target="_blank">http://perso.ensad.fr/~ensadtypo/imagesbertrand/BertrandSpecimenA3.pdf</a> <br><br>Finally, for those who read French, or have fun with Babelﬁsh, you can also read a small contribution on same subject! <br><br><a href="http://www.typographe.com/article/91/" target="_blank">http://www.typographe.com/article/91/</a> <br><br></p>'
