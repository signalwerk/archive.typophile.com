    <p>Hello</p>
    <p>This is a fairly common font used in SMPTE colour bar test cards (<a href="http://www.apsattv.com/history/january2001.html" title="http://www.apsattv.com/history/january2001.html">http://www.apsattv.com/history/january2001.html</a>) and the like - just wondering if anyone had a clue where I can find this? Been trailing through the usual flash / pixel font sources without any joy...</p>
    <p>thanks for your help!</p>
