      <p>Thanks for the help people - I did try fonstruct, and you are right - really fast way to knock up this kind of modular font... my 1/2 hour attempt below resulted in a caps only face, perfectly usable (although it doesnt like being installed in suitcase)<br>
       This face needs to be stretched horizontally  a little - as it is broadcast the pixels are not (I think) actuallly square - they have a different aspect ratio...</p>
      <p>best</p>
      <p>Matt<img src="/sites/default/files/old-images/fonstructed_str_3533.jpg"></p>
