  html: |-
    <p>After many years of development, I am proud to announce here on Typophile that Espinosa Nova is finally <a class="freelinking external" href="http://new.myfonts.com/search/espinosa/fonts/" rel="nofollow">available via MyFonts.</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/EspinosaNova720x360_3456.gif"></div><p></p>
    <p>Espinosa Nova is a revival based on the types used by Antonio de Espinosa, the most important Mexican printer of the sixteenth century and very probably the first punchcutter anywhere in the American continent (1551). In 2010, its main fonts were awarded two certificates of excellence: one by TDC2 (Type Directors Club Typeface Design Competition), one by Tipos Latinos (Biennial of Latin American Typography).</p>
    <p>According to Robert Bringhurst, it is “an unusually intelligent family of type, reaching back to one of the most exciting moments in typographic history and reaching forward to the typographic future”. </p>
    <p>A comprehensive PDF can be downloaded <a class="freelinking external" href="http://estudio-ch.com/images/especimen/EspinosaNova-Specimen.pdf" rel="nofollow">here.</a></p>
    <p>And now the best part: THE LICENSE FOR THE REGULAR IS FREE! No credit card required: just select, read the EULA, download. Easy!</p>
    <p>Questions &amp; feedback: cristobal[at]estudio-ch.com.</p>
