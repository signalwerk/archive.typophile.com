    html: |-
      <p>Could be one of several typefaces (sample is pretty small). My best guess is number three (see note).</p>
      <p>1. Knockout 48 Featherweight, by Hoefler &amp; Co. (use the alternate |R|:<br>
      <a href="http://www.typography.com/fonts/knockout/overview/" title="http://www.typography.com/fonts/knockout/overview/">http://www.typography.com/fonts/knockout/overview/</a></p>
      <p>2. Giorgio Sans:<br>
      <a href="https://commercialtype.com/typefaces/giorgio/sans" title="https://commercialtype.com/typefaces/giorgio/sans">https://commercialtype.com/typefaces/giorgio/sans</a></p>
      <p>3. Alternate Gothic No. 2 (which they use as live web type on their site):<br>
      <a href="http://www.myfonts.com/fonts/urw/alternate-gothic/" title="http://www.myfonts.com/fonts/urw/alternate-gothic/">http://www.myfonts.com/fonts/urw/alternate-gothic/</a></p>
