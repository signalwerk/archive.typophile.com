    <p>Hello,<br>
    I'm making a little color book for an exhibition. It will be a little 'grounge', with halftoned background images, and so on. and I chose Gill Bold for titles, Gill regular uppercase for subtitles. Now, what do you suggest for the text?  I'd like Mrs Eaves, but if anyone turns up with other alternatives...</p>
    <p>thank you very much<br>
    max</p>
