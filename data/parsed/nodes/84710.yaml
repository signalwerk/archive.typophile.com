    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Crete10b_5345.gif"></div><br>
    Crete Round started as a tailored version of <a class="freelinking external" href="http://www.type-together.com/Crete" rel="nofollow">Crete</a>, created specially to serve as corporate typeface for the upcoming type design competition Letter.2. It has been added later and is more independent from the original styles with changed terminals and serifs to create two new fonts that deliver a more contemporary and functional appearance. Furthermore, the new styles proved to be surprisingly efficient for web use. <p></p>
    <p>The accompanying Italics have several different lettershapes and therefore have, in some cases, their own widths. However, they sit comfortably next to the uprights. The names refer to the change in serif weight instead of increasing vertical stem widths. </p>
    <p>After being available only as webfont, Crete Round is now obtainable in our webshop.<br>
    <strong>For a limited time, we offer a 25% discount on the Crete Round bundle (USE CODE 99d11132 DURING CHECKOUT).</strong></p>
    <p>more information: <a class="freelinking external" href="http://www.type-together.com/Crete" rel="nofollow">http://www.type-together.com/Crete</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/crete2b_3892.gif"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/crete9b_4149.gif"></div><p></p>
