    html: <p>Sorry, Mark. We were all a bit frivolous. You, the designer, should not have to worry about that.  As with any packaging die-form, it's up to the production people to decide and supply you with, because the costs involved vary (glue, no glue, locks, etc.). Please find out who is going to do the printing and ask them.</p>
