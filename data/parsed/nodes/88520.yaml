      <p>Hi Mario,</p>
      <p>I just run your student's creations through a database of around 200.000 fonts,<br>
      and the results are:</p>
      <p><strong>any.jpg:</strong> nothing close</p>
      <p><strong>marisu.jpg:</strong><br>
      Looks a bit similar to <strong><a class="freelinking external" href="http://www.dafont.com/arista-2-0.font?text=Piclot" rel="nofollow">Arista 2.0 Alternate full</a></strong><br>
      but I think it's more "similar in concept" than a copy</p>
      <p><strong>OSCAR2.jpg:</strong> nothing close</p>
      <p><strong>crimi.jpg:</strong> nothing close</p>
      <p><strong>sheila.jpg:</strong><br>
      Sorry to reveal, but this is a cheat:<br>
      It matches exactly <strong><a class="freelinking external" href="http://www.dafont.com/mias-scribblings.font?text=PQRST" rel="nofollow">Mia's Scribblings</a></strong></p>
      <p>...therefore, I have to say you must be proud -in overall- for your students,<br>
      because if they cheated, they did it in a smart way by choosing uncommon fonts<br>
      which are difficult to spot :) </p>
      <p>Cheers<br>
      Fivos</p>
