      <p>Im in advertising, but I teach typography to design students in my spare time. So I guess it is a good compromise. </p>
      <p>Advertising and typography, unfortunately, have very little to do with each other these days. The focus seems to have moved from crafted, thought through pieces of communication to cookie cutter ideas that come a dime a dozen. </p>
      <p>Either way. Typography is a skill and an art form. The people that create these beautifully crafted shapes should be respected more in the creative industry.</p>
      <p>Gustav</p>
