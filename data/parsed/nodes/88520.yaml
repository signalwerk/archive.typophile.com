      <p>Helvetica has lost its soul, and is poorly spaced.<br>
      Only the very lightest weights are worth anything,<br>
      and only when set extremely large.</p>
      <p>Type design is a lot less Art than artists want to believe.<br>
      Just because one can't make enough money painting doesn't<br>
      mean one can really grasp and leverage what Design implies.</p>
      <p>hhp</p>
