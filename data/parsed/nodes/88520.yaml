      <p>Thanks for posting that sentence Christopher :)<br>
      I love that!!!!</p>
      <p>However I think he's exaggerating...<br>
      Science involves thinking, experimentation, hypothesis testing, etc..<br>
      perhaps he was trying to say that a real typographer needs more than just manual skill,<br>
      almost anyone can make letters, but requires much more to make a typography.</p>
      <p>Internet is full of "hand made fonts" but nothing such as good as "Helvetica" for example<br>
      but of course those "hand made fonts" are not "perfect typography" </p>
      <p>I'm sure you're gonna like this.<br>
      Try these links, it shows how great Helvetica is, and how much it changes a simple sign on the streets by using it</p>
