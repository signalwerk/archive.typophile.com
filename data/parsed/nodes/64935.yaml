  html: |-
    <p>I found this face in a little town on the French/Spanish border called Luz Saint Sauveur. It appears on the metal plaques used for street names etc, I cant find anything exactly like it anywhere, it looks very similar to some of the DIN typefaces, but has several subtle differences.</p>
