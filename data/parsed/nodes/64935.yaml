    html: <p>Alphabets used for metal plate stamping are usually specially designed for this technology. They have no equivalent in digital type, unless someone digitises them afterwards, like Verena Gerlach and Ole Schäfer did with <a href="http://www.fontshop.com/fonts/downloads/fontfont/ff_city_street_type/" rel="nofollow">FF City Type</a> for example.</p>
