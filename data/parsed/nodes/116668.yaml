    html: "<p>As I said before, I can’t see any differences between the letters used on the poster and the weights I mentioned above (and one additional weight):<br>

      – Wide Regular or Medium for ‘FBI PROUDLY PRESENTS’<br>

      – Skyline Bold for ‘ANDERS FJELSTED etc.’/‘COMEDY ZOO’/‘JUNI 2014’<br>

      – Compressed Bold for ‘VOKSEN’<br>

      – Compressed Medium for ‘FJELLE SOLO PÅ’/‘10. + 12. + 13. + 14.’</p>

      <p>The spacing has been tightened for all texts, but an overlay of the letters on the poster with the ones from the FontShop preview shows that they perfectly coincide.</p>"
