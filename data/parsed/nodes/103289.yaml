    html: |-
      <p>The idea of the lowercase <strong>r</strong> replacing the middle bar of the <strong>E</strong> works, but a few details don't look right to me. </p>
      <p>First, the top of the <strong>r</strong> sits a little below where the middle stroke of the <strong>E</strong> would normally be. I'd move it up very slightly.</p>
      <p>Second, the slight concavity of the terminal at the top of the <strong>r</strong> is dissonant (to my eye) with the flat outer edges of the serifs on the right-hand side of the <strong>E</strong>. I'd make the terminal at the top of the <strong>r</strong> (and its flipped image) just a bit less concave.</p>
      <p>Finally, the flipped image isn't just a flipped image. The rotated terminal above the <strong>r</strong> is visibly wider than the one on the <strong>r</strong> itself. I would make them match.</p>
    html_clean: |-
