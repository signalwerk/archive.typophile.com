    <p>Type designer in Malayalam having designed more than 25 typefaces in the language used by publishers including Malayala Manorama, Mathrubhumi, Deepika, Mangalam, Thejas and D C Books. Designed Indulekha, Ravivarma, Ambili and a symbol font Chihnangal for C-DAC Gist while working there in 1993-94. Linotype Indus is the only Roman typeface designed by him to date, ispired by Indus Valley inscriptions dating back 5000 years. </p>
    <p>Presently running a successful information design consultancy in Cochin, Kerala, India.<br>
