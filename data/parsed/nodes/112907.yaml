    html: <p>I would like to see Vogue and Tempo revived. A <a href="http://www.myfonts.com/fonts/adobe/tempo-heavy-condensed/" rel="nofollow">few</a> <a href="http://www.myfonts.com/fonts/redrooster/tempo-rr/" rel="nofollow">weights</a> of Tempo have been digitized, but only a few. The closest thing to Vogue is James Montalbano's <a href="http://www.terminaldesign.com/fonts/vf-sans-complete-family/" rel="nofollow">VF Sans</a>, but it's not really the same thing. These aren't exactly "rare" as metal faces go, but it's surprising to me that they have not made it to the digital world.</p>
