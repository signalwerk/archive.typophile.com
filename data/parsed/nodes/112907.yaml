    html: |-
      <p>My primary answer to this question is still <strong>Mercator</strong> (1959) by Dick Dooijes.  At least a few Dutch designers have made revivals (some discussion is <a class="freelinking external" href="http://typophile.com/node/53257" rel="nofollow">here</a>) but I don't believe they have been offered for sale.  Other fonts today which have been loosely inspired by Mercator are not quite satisfying to me in key respects (nor are Neue Haas, etc.).  Mercator's C and S have briefer curves to the terminals than most grotesques, giving them a very open look which I find attractive; and that elegant Q is my all-time favorite (I'm surprised no later sans copied it).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/sample_4258.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/QRS_6416.JPG"></div><p></p>
