      <p>1. A proper revival of Warren Chappell's <strong>Lydian</strong> featuring the Gothic capital A and the old style figures.<br>
      2. The digital release of Rudolf Koch's <strong>Offenbach</strong>.<br>
      3. The digital release of <strong>Monotype Barbou</strong>, the second version of Fournier Roman, supervised by Stanley Morison.<br>
      4. The complete work of Cassandre in digital form.</p>
