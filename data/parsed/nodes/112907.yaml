      <p>@Mark Simonson:<br>
      <cite>John, ugly doesn't prevent a font from being usable. Pretty isn't everything.</cite></p>
      <p>While this is undeniably true, in general a typeface needs to be aesthetically appealing to commend itself to those who use and purchase fonts. I wouldn't set a high bar for this, but I found Vogue to be distinctly unattractive, and its former use creates negative associations.</p>
      <p>And this makes it unlikely to appeal to advertisers, the number one source of demand for typefaces. Also, as a text face, it's not particularly effective; it isn't, say, Ionic No. 5 - acceptable in appearance, and highly legible.</p>
      <p>Incidentally, another killer for a typeface, I believe, is looking "dated". Revivals can have subtle changes that fix that, of course. This, for example, is why we don't see much Cheltenham these days, although it's readily available. Even one of my favorites, Cloister Oldstyle, seems to have this flaw to a degree.</p>
