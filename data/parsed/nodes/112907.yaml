      <p>Lydian was designed by Warren Chappell for American Type Founders in 1938. The original ATF foundry font  included an alternate capital A with a cross bar. This would seem to be the only difference in the Lydian shown in the TV image [Bionic Woman?] and the digital Lydian. The crossbar A is not included in the original design patent image. Reference US design patent D116,996 issued on October 3,  1939.<br>
      Don</p>
