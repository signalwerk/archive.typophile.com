    html: |-
      <p>Mike Parker would be best to tell that whole story. "He was there!"  ;)</p>
      <p>Basically, what Haas released as Neue Grotesk actually got cleaned up even more for the "Helvetica" re-release, and the sizes that originally came from that release were all text sizes, for Linotype, whose equipment, remember, all duplexed roman and Italic. So widths and some details changed in the final release. I would very much like for Mike to fill in the blanks here. Anyone in Boston want to go have lunch with him? He made it sound like it was worth seeing the original. Does anyone have a specimen of Neue Haas Grotesk?</p>
