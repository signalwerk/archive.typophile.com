      <p>The conversation got really interesting. The gist is that Linotype only had the text weight of Helvetica because, the Linotype machine did not ever set the display size. Essentially then, there is a lost display version of Helvetica. Now I'll let Carl and Mark tell the rest because they'll tell it better. </p>
      <p>(And thanks for the correction. The other typo is my fault for texting in my blog posts.)</p>
