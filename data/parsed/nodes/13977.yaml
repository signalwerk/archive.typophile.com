      <p>Perhaps the problem is that the traditional monogram style is such a longstanding tradition in Enlish speaking countries that the odds of seeing such similarities is not far fetched. Using the monogram for TDC makes sense because it speaks to a typographic tradition.  The "Desert Troon" however makes much less connection and does not seem to be a good fit.  I have no idea if the similarity is intentional, I only say that to me it suits TDC far, far better and that "DTC" would be far better served using something different.</p>
      <p>ChrisL</p>
