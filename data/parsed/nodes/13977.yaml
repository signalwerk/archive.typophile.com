      <p>Here's some more info on the LogoWorks issue:</p>
      <p>Just wanted to pass on some information about the "logo design" company LogoWorks. The firm has been getting a lot of major glowing press lately:</p>
      <p>Wall Street Journal<br><a href="http://tinyurl.com/9o4w5">http://tinyurl.com/9o4w5</a></p>
      <p>Entrepreneur Magazine<br><a href="http://www.entrepreneur.com/logocontest/0,7353,,00.html">http://www.entrepreneur.com/logocontest/0,7353,,00.html</a></p>
      <p>Over the past few days more and more people have discovered that numerous LogoWorks designs have actually been blatantly ripped off from other designers.  You may want to take a look at some of the discussion and evidence at some of these links:</p>
      <p>The Origins of Brands Blog - written in praise of LogoWorks.<br>
      The comments offer a great deal of info:<br><a href="http://tinyurl.com/bs8gb">http://tinyurl.com/bs8gb</a></p>
      <p>BadDesignKills<br><a href="http://www.baddesignkills.com/logoworks/index.htm">http://www.baddesignkills.com/logoworks/index.htm</a></p>
      <p>ThePreparedMind<br><a href="http://tinyurl.com/bbv9c">http://tinyurl.com/bbv9c</a></p>
      <p>Morea's Photos<br><a href="http://tinyurl.com/dmhrr">http://tinyurl.com/dmhrr</a></p>
      <p>HOW Design Forum Discussion<br><a href="http://tinyurl.com/bej4q">http://tinyurl.com/bej4q</a></p>
      <p>A HOW Forum "discussion" with a LW designer<br><a href="http://tinyurl.com/a9rry">http://tinyurl.com/a9rry</a></p>
      <p>I'm sure this will get more interesting as the week continues. Personally, I feel such "logo mills" do a huge disservice to the graphic design industry.  The outright stealing of the work of other designers is another issue and its blatancy is incredible to me - and should outrage all designers and the clients being taken for what initially may be an inexpensive ride to get a new logo.  How many stolen designs have been repackaged and sold to unexpecting clients by LogoWorks? </p>
      <p>- J.</p>
      <p>Jeff Fisher :: Engineer of Creative Identity<br><a href="http://tinyurl.com/5y8bm">Jeff Fisher LogoMotives</a></p>
      <p>Author: <a href="http://tinyurl.com/5o7ud">Savvy Designer's Guide to Success</a> from HOW Design Books</p>
