      <p>Plagiarism is not copying exactly it involves taking somebody else's work or idea and passing it off as one's own.<br>
      And if you look at the DTC logo it does have differences from the TDC logo background pattern, slightly less well drawn serifs, broader stroke – obviously taken from the TDC logo but because it has been redrawn badly it is different. The pair that I linked to are currently the subjects of an <a href="http://www.brugesgroup.com/mediacentre/releases.live?article=9075">argument</a> between the two groups , of course it doesn't help that the two are linked to the opposite sides of the UK political spectrum.<br>
      Does Coca-Cola make their product from polar bears? Perhaps they farm them in remote locations, do they employ herders and what are their dogs like? They could market an organic version. The wages for milking polar bears would have to be pretty good.<br>
      Tim</p>
