    <p>First off, I really despise these type of posting with people pointing and saying "hey, look at the 'rip', thats so lame," but here I am -- doing just that.</p>
    <p>This is way too unethical.</p>
    <p>Type Directors Club<br><a href="http://tdc.org/">http://tdc.org/</a></p>
    <p>Desert Troon Companies<br><a href="http://www.desert-troon.com/">http://www.desert-troon.com/</a></p>
    <p>They claim a USPTO registration, but I can't find an entry for the mark.</p>
    <p><a href="http://www.i-ology.com">http://www.i-ology.com</a> did the website, not sure if the were the 'designers' of the mark or not.</p>
