    html: |-
      <p>Maybe it's a font including OT ligatures and alternates:</p>
      <p>The "n": In "everyone" the o_n is a ligature, but in "ends sunday" the 2 n are the same.</p>
      <p>The "e": Are the same in the first and last in "everyone"; In "loves" and in "end", but are different in "s_e" and "c_r_e" in secret, and in "e_r" in "everyone".</p>
      <p>The "s": In "secret" is a "s_e" ligature; but the in "ends", "sunday" and "ends" are the same.</p>
      <p>I don't look handwritten to me, since the connections don't look good in:<br>
      "ev" in everyone<br>
      "yo" in everyone<br>
      "ne" in everyone<br>
      "es" in loves<br>
      "ds" in ends</p>
