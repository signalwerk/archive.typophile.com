    html: <p>Hmm, I think the category 'Neo-Grotesque' is taken, and is reserved for the post-WWII 'new and improved' grotesques, like Univers, Helvetica, Folio, Unica, Video, etc. I also think that the condensed versions of many grotesques have straight-sided ovals (e.g., Akzidenz-Grotesk), and that cannot put them in a different classification category from the regular versions of the same typefaces. In my opinion, DIN and Conduit could be pretty safely classified as Grotesques... The same applies to the <em>Spiekersans's</em>, despite their being, well, slightly humanized.</p>
