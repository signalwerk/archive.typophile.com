      <p>&gt; <cite>So Meta and friends wouldn’t be considered humanist? I can’t see how they could be grotesque.</cite></p>
      <p>In my opinion, <em>proportions</em>, which are the primary classifiable features, of 'Meta &amp; Friends' place them firmly in the Grotesque Sans category. Those are the 'Modern' (Didone) proportions: slightly narrowed (round shapes based on oval, not on circle), more uniform glyph widths. However, the <em>open counters</em> for shapes like C, G, S, a, c, e, and s are definitely 'Old-Style', and that—secondary classifyiable—feature relegates them to the Humanist Sans category (which also includes Gill Sans, Frutiger, Eras, Flora, Verdana, etc.). That is why I think that the <em>Spiekersans’s</em> are actually Grotesques, albeit slightly humanized.</p>
