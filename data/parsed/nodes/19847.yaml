      <p>There's another sans genre that deserves its own name as well, the <em>Spiekersans</em>. These are structurally humanist, but simplified and regularized so that they are somewhere between humanist and grotesque or straight-sided. I think of Spiekermann's <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=FF%20Meta" rel="nofollow">FF Meta</a> as the genesis of this category with his <a href="http://www.fontshop.com/index.cfm?fuseaction=verity.search&amp;searchstr=Unit" rel="nofollow">FF Unit</a> and Schwartz's <a href="http://fontbureau.com/fonts/Amplitude" rel="nofollow">Amplitude</a> as followers. Many of <a href="http://www.fontshop.com/showfont.cfm?did=768" rel="nofollow">Ole Schäfer</a>'s faces (FF Fago, FF Info, FF Zine) also apply.</p>
      <p>Sorry to stray from your original question a bit.</p>
