    html: |-
      <p>It is an interesting question, Frode. I think the difference between the European and U.S. copyright laws points up the obvious on the question of allowing designers to modify fonts on behalf of their clients as well. In the States, you can copyright software, but not designs. So to be legal, you copy the font into the background layer of FontLab, then delete all the points on the front layer -- all you have is a gray mass that sort of represents the character(s). Then you autotrace. The result is legal, but also terrible. You will spend considerable time fixing the autotrace to get anything useful. Then make your modifications for the client. Being able to modify the font itself should cost less than your time is worth to do the the work of recreating the font. That way, everybody wins.</p>
      <p>In Europe, I believe the copyright laws are different. But all that really means is you have to add a person who can draw, while looking at the characters. Then, all the etc. BTW, I believe some parts of the European copyright law are more reasonable than in the States -- It is a confusing situation.</p>
      <p>Aside from the law, the point remains: if starting with the original font saves you time, then the font publisher is due some compensation for that savings.</p>
