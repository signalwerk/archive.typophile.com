    html: |-
      <p>As a user of type, I would pay a modest sum for the right to modify. If the modification was to add more characters, improve the letterfit, etc, I would charge the extra modification fee back to my customers. I would of course first recommend to my customers that they not use such a font, but people get caught up in fashion.</p>
      <p>To be clear: I wouldn't (usually) charge my customers for the needed work, only for having to pay the publisher more for the right to fix their font. If you find that too brutal, sorry. It would be different if the modifications anticipated were for, say, one-off logo use. But if the work is to fix the spacing, add extra characters, etc., it seems odd to have to pay for the right.</p>
      <p>An interesting option would be that the right to do this kind of work was free, but the additions would have to be made available to the font publisher at no charge, so they could, if they chose, include them in future releases. That would make the end user think hard about the whole issue. I view my modified fonts as giving us a competitive advantage over other typesetters. To then give the font publisher the right to add my work to their fonts would (in my mind) lessen that advantage. It would make us end-users think about the issue with the shoe on the other foot.</p>
