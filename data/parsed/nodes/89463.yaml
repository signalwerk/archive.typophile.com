    date: 2012-01-27T07:12:00
    date_raw: 27 Jan 2012 — 7:12am
    votes: null
    html: <p>Having been on the other side of the table (as a type user), I know the frustration of having the skills but not the permission to fix issues. Modifications for personal use should, IMO, be a given. Apart from the financial side, what is the arguments against allowing designers to modify on behalf of their clients as well?</p>
    html_clean: <p>Having been on the other side of the table (as a type user), I know the frustration of having the skills but not the permission to fix issues. Modifications for personal use should, IMO, be a given. Apart from the financial side, what is the arguments against allowing designers to modify on behalf of their clients as well?</p>
  - id: 492926
