  - id: 492812
    user: 13487
    date: 2012-01-26T13:11:00
    date_raw: 26 Jan 2012 — 1:11pm
    votes: null
    html: <p>Like I said on Twitter, I think it's an interesting idea. You'd have sort of a consumer / extended license split. I'd ideally like the modification-friendliness to be an add-on that can be bought after purchase as well (since when one licenses a font one wouldn't necessarily already know if mods might be needed). This might make «normal» customers feel good for not paying for rights they don't need, and make «extended» clients happy too because paying an additional fee and modding oneself (provided one is capable of doing so) might seem more interesting than commissioning changes directly from the foundry (so the latter would of course lose some of the revenue from commissioned modifications, which would likely be much more expensive...).</p>
