    html: |-
      <p>Which Agaw dialect and which orthography?</p>
      <p>The Unicode Ethiopic block is pretty exhaustive and covers the orthographies of more than 80 languages and dialects, including, as of Unicode 6.0 some characters found only in single publications. If something is missing it is because it hasn't been documented and proposed yet.</p>
