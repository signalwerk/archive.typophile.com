    html: <p>I checked yesterday about my IE question - the answer is yes - IE on the mac let’s you set the text at 96 dpi ( simulated ) or 72dpi. When you set your font in prefs as one of the defaults types of text you can get an idea of what it will look like at both rez types and pretty fast - it’s not a perfect test - but good for a quick check.</p>
