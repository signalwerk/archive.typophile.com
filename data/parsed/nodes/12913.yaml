    <p>I am developing fonts on a Mac Poweerbook 15 inch and I want to test them on a PC to see how they render to screen - it occured to me that I could do this ( maybe ) with Virtual PC or some other PC emulator - I haven’t researched the software in detail yet. I think MS is the only one who offers this now... Anyway. </p>
    <p>I was wondering if anybody has gone this route or if maybe it’s really stupid idea because: </p>
    <p>a. - The rendering hardware/software is still Mac/Quartz so it isn’t a good test.<br>
    b. - The screen on my laptop cannot show me 96 dpi anyway.<br>
    c. - Virtual PC is just too slow on a mac laptop to ever be a viable/humane way of working</p>
    <p>or </p>
    <p>d. - some other reason If haven’t come up with.</p>
    <p>Also, in the meantime, is there some non-OS oriented way of quickly testing a font at 96 dpi emulated? It seems like the microsoft browser did some kind of font size switching on mac that let you see web sites as they would render on a PC &amp; Mac both. Amybody used that or some other technique?</p>
    <p>Thanks!</p>
