    html: |-
      <p>If you’re wanting to test the robustness of your fonts, your best bet is to use an actual Windows machine. But if you just want to see what they’re going to look like, all you really need* is a way to bump up the gamma on your Mac display; and the dpi issue is moot, since it’s nominal anyway - just do the math (multiply the point size by 4/3 and use that), or even create a document in Photoshop and set it to 96dpi.</p>
      <p>* Unless you’re using heavy TT hinting...</p>
      <p>One thing though: if you’re making grayscale pixelfonts and want to see what they look like in “native” Windows (like Word, as opposed to Photoshop), then that’s a problem, since there’s a pronounced lightening that goes on in that situation, to the point of requiring different cuts of your fonts.</p>
      <p>hhp</p>
