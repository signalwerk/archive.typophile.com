      <p>Most well-known artists are representative of their eras.<br>
      And vice versa.<br>
      That's the way that Great Man history works.</p>
      <p>Bass was a modernist, working in the "mid-century modern" era.<br>
      The hand lettering he favored, contrasted against gridular layouts, can be compared to the texture of natural materials such as marble and wood in the architecture of Mies and Gropius.<br>
      His cartesian affair is clearly evident in the title sequence of NXNW.<br>
      Film is a grid, imposed on time, formalized like comic-book panels in story-boards.</p>
      <p>I'm not sure how representative of their time type designers are, especially if their careers are long.</p>
