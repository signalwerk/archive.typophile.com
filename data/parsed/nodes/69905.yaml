    html: "<p>In art and industrial design, the Modern Age essentially celebrated the triumph of Industrial Capitalism; however, this triumph meant that the working man had become subservient to the machine, and not the reverse, as one would expect from a \"mechanical bride.\"  The rise of Trade Unionism during the 1930s was a direct response to this reversal of master-and-servant roles. Postmodernism got its name from the poet Charles Olson in 1949, but its genesis was in Hiroshima and Nagasaki: Everyman's very existence became suddenly very contingent upon terrible outside forces over which he exercised any real control (enter Camus, <em>et al.</em>). Thus, the postmodern outlook is, in a very real sense, atomized and post-apocalyptic. Saul Bass's work can be fairly characterized, stylistically, as post-apocalyptic graffiti; in other words, as utterly postmodern.</p>"
    html_clean: "<p>In art and industrial design, the Modern Age essentially celebrated the triumph of Industrial Capitalism; however, this triumph meant that the working man had become subservient to the machine, and not the reverse, as one would expect from a \"mechanical bride.\"  The rise of Trade Unionism during the 1930s was a direct response to this reversal of master-and-servant roles. Postmodernism got its name from the poet Charles Olson in 1949, but its genesis was in Hiroshima and Nagasaki: Everyman's very existence became suddenly very contingent upon terrible outside forces over which he exercised any real control (enter Camus, <em>et al.</em>). Thus, the postmodern outlook is, in a very real sense, atomized and post-apocalyptic. Saul Bass's work can be fairly characterized, stylistically, as post-apocalyptic graffiti; in other words, as utterly postmodern.</p>"
