      <p>This is a great discussion and I have to say I was swayed a little by oldnick's argument for Bass as a postmodernist. My understanding has always been that he is classified as a modernist from the New York School. But I was always very aware of how different American mid-century modernist graphic designed looked from its European counterpart. Compare Josef Müller-Brockmann and Siegfried Odermatt's work to Alvin Lustig and Saul Bass's. Very different; still modern, just more American— a little more pragmatic, informal, and spontaneous. </p>
      <p>After seeing all the examples posted, I would say that Saul Bass's work looks much more like it embodies the end of american modernism rather than defining the start of postmodernism. Which I would say doesn't begin until the 1960's with Glaser, Chwast, Ruffins, and Sorel.</p>
      <p>But I suppose that could continue the debate...</p>
