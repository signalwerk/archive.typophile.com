    html: <p>Through an odd set of coincidences, I took my degree in English Language and Literature, so my perspective on postmodernism tends to deal with the <em>weltanschauung</em> of the period, rather than with specific design trends, whose categorization I will leave to the graphic design majors. IMHO, certain—but not all—of Bass's graphic works reflect that <em>weltanschauung</em> accurately.</p>
