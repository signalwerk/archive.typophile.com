    html: <p>Me too, but there are many organization using the solar or calendar year. Even my internet provider use this system and often it's annoying. Anyway, my internet provider actually charges you the months you use, and you only need to renew the contract in January. <br>After my TDC subscription I gave up to any association, anyway. Being in Italy is not so close to important typographic events. <br>And this year, with the AtypI in Rome, I wasn't so well... What a luck!</p>
