    html: <p>Hi, David. I'll clarify. SOTA membership is based on the calendar year, Jan. 1-Dec. 31. Since you went to TypeCon last year, in July, and SOTA membership was included with your registration, your membership was valid through Dec. 31, 2002. It wasn't crystal clear on the conference registration form, and I apologize for that. <br> <br>We try to make the benefits so good, and the dues low enough, that if you join in the middle of the year, you will still get plenty out of your membership. If you join before TypeCon happens in the summer, a major perk is the 20% discount off conference registration fees for SOTA members... <br> <br>And being as you're outside North America, you're entitled to the Global Professional rate, which is a pretty great deal. <br> <br>I hope this makes more sense. Sorry for any confusion. <br> <br>You're welcome for the link <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><a href="http://www.typesociety.org" target="_blank">http://www.typesociety.org</a> <br> <br></p>
    html_clean: <p>Hi, David. I'll clarify. SOTA membership is based on the calendar year, Jan. 1-Dec. 31. Since you went to TypeCon last year, in July, and SOTA membership was included with your registration, your membership was valid through Dec. 31, 2002. It wasn't crystal clear on the conference registration form, and I apologize for that. <br> <br>We try to make the benefits so good, and the dues low enough, that if you join in the middle of the year, you will still get plenty out of your membership. If you join before TypeCon happens in the summer, a major perk is the 20% discount off conference registration fees for SOTA members... <br> <br>And being as you're outside North America, you're entitled to the Global Professional rate, which is a pretty great deal. <br> <br>I hope this makes more sense. Sorry for any confusion. <br> <br>You're welcome for the link <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><a href="http://www.typesociety.org" target="_blank" class="link-external">http://www.typesociety.org</a> <br> <br></p>
