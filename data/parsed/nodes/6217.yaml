    html: "<p>We're working on the SOTA site right now, and it will be up next week with secure registration and more information. For now, I can tell you the fee structure: <br> <br>Full-time Student $25 <br>Professional $60 <br>Professional Plus $90 <br>Sustaining $300+ <br> <br>Full breakdown of benefits will be listed on the site, and include a significant discount on TypeCon2003 admission, discounts on font purchases from participating foundries, no fees for TypeGallery submissions, membership in the SOTA discussion list, special invitations to events that SOTA co-sponsors, etc. <br> <br>We will be adding more benefits throughout the year. Since SOTA is a non-profit organization, a portion of the membership dues are tax-deductible for US citizens. Membership dues go toward SOTA's efforts to present more affordable educational programming, and our continued support of the type design community, developing publications, sponsoring other relevant events, and more. <br> <br>Come visit the site next Tuesday - you'll see much more. <a href=\"http://www.typesociety.org\" target=\"_blank\">www.typesociety.org</a></p>"
