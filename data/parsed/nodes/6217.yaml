    html: <p>Hrant and Claudio, your opinions are certainly valid. Please understand  that everyone involved with keeping SOTA going worked together to determine the best method. <br> <br>To help keep costs low and run the organization as efficiently as we can, the calendar year method works best for SOTA and its members over the long term. Another key factor in this decision is that TypeCon will not necessarily be held at the same time each year, so we cannot base the membership year on the "right-before-a-conference" method.</p>
