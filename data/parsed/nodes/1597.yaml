    html: <p>I've tried them all and to me MasterJuggler comes closest to the ATM DeLux feel. No auto-activation (like DeLuxe) but with full UniCode support. (unlike DeLuxe). <br> <br>Also like DeLuxe, MJ does not have to be running to keep fonts activated. <br> <br>So having found MJ I have stopped looking for a font management utility. <br> <br>I used to be a fan of FAP, but with lots of fonts installed it did strange things like refusing to activate the roman weight of a font family. FAP is also a bear in the startup, and the shutdown taking minutes to completely boot or quit.</p>
