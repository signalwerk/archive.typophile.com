    html: "<p>&gt; <i>And get rid of OS 9, its so poor compared to OS 10</i> <br> <br>More stable? Yes. Better memory management? Yes. Faster? Most application processes - yes. Finder actions, file management, application launching - decidedly no. <br> <br>Although Panther has improved many of the Finder and file management-related issues I had with Jaguar, I miss using 9pt Geneva in my list views, among other aesthetic bits. <br> <br>And you'll have to pry my Classic-running Claris Emailer from my cold dead hands... <br> <br>Oh, and for those who have yet to switch to FontLab from Fontographer - the point is mootish. <br> <br>Back to the subject of this thread: even with Font Book and the recent revisions to SuitCase and the other font management utilities, there is no way in heck that OS X even comes close to OS 9 for handling large libraries of typefaces. Font/DA Mover feels more advanced at times.</p>"
    html_clean: "<p>&gt; <i>And get rid of OS 9, its so poor compared to OS 10</i> <br> <br>More stable? Yes. Better memory management? Yes. Faster? Most application processes - yes. Finder actions, file management, application launching - decidedly no. <br> <br>Although Panther has improved many of the Finder and file management-related issues I had with Jaguar, I miss using 9pt Geneva in my list views, among other aesthetic bits. <br> <br>And you'll have to pry my Classic-running Claris Emailer from my cold dead hands... <br> <br>Oh, and for those who have yet to switch to FontLab from Fontographer - the point is mootish. <br> <br>Back to the subject of this thread: even with Font Book and the recent revisions to SuitCase and the other font management utilities, there is no way in heck that OS X even comes close to OS 9 for handling large libraries of typefaces. Font/DA Mover feels more advanced at times.</p>"
