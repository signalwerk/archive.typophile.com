    <p>Hello, <br>Im hoping someone could help me. <br>I have an ibook with system 9 &amp; 10. <br>I have upgraded alot of programs and now my ATM does not seem to be compatible because whilst it opens on system 9 my new programs such as indesign open on system 10. Is there anyway I can fix this so what fonts i turn on or off will work with the programs that open in system 10 or do i have to get ATM deluxe for system 10? <br> <br>Thanks in advance, <br>David.</p>
