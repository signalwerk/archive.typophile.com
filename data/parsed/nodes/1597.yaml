    html: <p>No trouble specific to Photoshop, just general sporadic FAP crashing while browsing faces or freezing when adding voluminous amounts of new fonts. Again, it's one of those software stability issues I have with OS X. Sure, it doesn't being the whole system down a la OS 9, but why are these programs crashing in the first place? Keep in mind that we are juggling 13 medium to large type libraries at Veer, with a total font count of well over 5,000. That does not include system fonts. Quiet frankly, I don't think any of the OS X-based solutions are ever tested with that many resources.</p>
