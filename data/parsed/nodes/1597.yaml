    html: <p>ATM Deluxe is simply not available for OS X. If you are needing a font management utility for use under OS X, you will have to have to purchase Extensis SuitCase, MasterJuggler, or FontAgent Pro from Insider Software. Or else wait under later this month and upgrade to OS X 10.3 (Panther) and use Apple's own Font Book.</p>
