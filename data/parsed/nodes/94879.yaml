    <p>Hi all,</p>
    <p>I'm developing a suite of icons for use by an organisation. The majority are generic symbols from public domain or developed by me, while others are TM logos or symbols such as word, powerpoint, PDF logo, Facebook etc. It's these kinds of proprietary symbols that have me scratching my head. </p>
    <p>Any advice from someone who has been through a similar situation? I would normally seek permission from the company, but I'm unsure about even the language or terms I should use or whether I would run into a brick wall etc. I'm tempted to develop a suite of generic symbols which try and represent these icons without reproducing them but that seems a little counter-intuative or something.</p>
    <p>Any help would be well appreciated. Thanks for reading.</p>
