      <p>In my limited experience, reproducing exact corporate logos and trademarked symbols in your own font or vector art could be problematic if the material you are creating is distributed externally, particularly if the logo is used or associated with material that could be perceived negatively and reflect negatively on that logo. They are likely to be protected by intellectual property laws and if you are in doubt at this point it is definitely worth contacting the relevant corporate entities to seek permission.</p>
      <p>In the past I have created a font using a version of a company logo but this was done in conjunction with the relevant company and has resulted in a unique dual copyright (specifically for that font, not the logo itself) and a series of agreements around permissions for using that font.</p>
