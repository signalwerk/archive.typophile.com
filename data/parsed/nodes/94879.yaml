      <p>Why not conduct a focus group and see what users prefer?</p>
      <p>After having spent many years trying to learn Adobe’s previous CS icons, I must say that I ﬁnd the present coloured squares with letters much easier—but that might not be the case if all the other icons in my Dock followed the same format!</p>
      <p>If you do use proprietary images, the proprietors will no doubt immediately change them, rendering your artwork out of date, if not obsolete. But that wouldn’t be so bad, it would be like how folks round here will give you directions like “turn left where the Price Chopper store used to be,” a real team-builder once you ﬁgure it out.</p>
