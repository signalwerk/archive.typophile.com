      <p>First, please be clear on this distinction:</p>
      <p>There is "Fair Use," and then there is "abuse."</p>
      <p>If you are simply helping folks clarify where they are going when they click, AND there is no malice in your heart, then you a doing BOTH your font users AND the target sites a favor.</p>
      <p>If, on the other hand, there is bad intent to deceive—the legal definition of fraud—then, you are opening yourself up to a HEAP of trouble.</p>
      <p>To what tune you MIGHT be held accountable for the bad actions of others can end up being based on how badly your helpful tool has been abused. However, since such was not YOUR intent, then you OUGHT TO BE cool.</p>
      <p>You know you have a problem when some lawyer wins a suit against a handgun manufacturer because the manufacturer was at fault for selling a gun to someone who uses one of their products with bad intent.</p>
      <p>In other words, when hell freezes over. <em>Capisce?</em></p>
