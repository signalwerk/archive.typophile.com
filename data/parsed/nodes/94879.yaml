      <p>I assume you're talking about uses such as putting social media logos (Facebook, Twitter, etc) at the bottom of the page with an invitation to visit your pages there, or placing a PowerPoint logo and saying "download this info as a PowerPoint file", and that kind of thing. Is that right? </p>
      <p>Normally you wouldn't put trademarked logos in the middle of a sentence, so I don't see why you'd need to incorporate them in a font. Just provide a collection of pre-existing logos to the users to place as graphic files. For the users' convenience, size them consistently, and give the files names that are easy to understand and which group all them together when viewed alphabetically (like "icon_facebook_small.jpg", "icon_powerpoint_small.jpg").</p>
