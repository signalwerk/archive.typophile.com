    votes: null
    html: |-
      <p>Technically, it shouldn’t be defined as a “pirated version” (no more than H&amp;FJ‘s Forza, for example).<br>
      Yes, the letters are probably modelled after Eurostile’s ones. But it lacks the signature superellipse curves of Novarese’s typeface, making it more akin to the countless geometric “futuristic” fonts out there, albeit a particularly bad one.<br>
      All that said, this Acena is a really fugly font. And it should be avoided whenever possible.</p>
