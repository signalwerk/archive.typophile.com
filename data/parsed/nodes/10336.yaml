      <p>Gerald and Héctor, thanks for the comments.</p>
      <p>Gerald, I have only seen letterpress Raffia once. Kay Amert, Director of the Typography Laboratory at the University of Iowa, brought the electrotype sample <a href="http://www.enneson.com/public_downloads/pe/typophile/galvano_op_loden_voet.pdf" rel="nofollow">here</a> to ATypI Vancouver, where I got it scanned and had Jim Rimmer make a letterpress impression on a piece of cardboard stiffener. Presumably the set was bought by Harry Duncan, the first Director, who according to Robert Bringhurst, also admired the initials.</p>
      <p>Let me know what you find.</p><div class="imageWrap"><img src="http://typophile.com/files/][img:"></div><p></p>
