  html: <p>As ATypI members among you might know, I have a decades-long interest in the work of the Dutch 1950s graphic designer &amp; artist Henk Krijger. Two years ago I made an ATypI presentation on his Raffia Initials and showed about half a dozen uses of the typeface, mostly on books he designed. I'm interested in finding additional sightings of the initials, especially in letterpress. Anyone? <br> <br><img src="http://www.typophile.com/forums/messages/30/69849.jpg" alt="raffia_G"></p>
