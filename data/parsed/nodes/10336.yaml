      <p>Hi </p>
      <p>You mentioned the Raffia Initialen in regard to letterpress. I bought a case(s) of the metal Raffia way back in the early 1980s and never received them. Sort of a bait and switch deal. Even switched out a press on me. Nice guy, just weird about material things. It just so happens that a couple of days ago I discovered that much of the material involved may have recently ended up with a very good friend of mine. I'll check and see if the Raffia was included. If so, maybe I can plead a case. A very remarkable typeface.</p>
      <p>Very very nice presentation by the way. Thank you.</p>
      <p>Gerald<br>
      The Bieler Press<br>
      <a href="http://BielerPress.blogspot.com" title="http://BielerPress.blogspot.com">http://BielerPress.blogspot.com</a></p>
