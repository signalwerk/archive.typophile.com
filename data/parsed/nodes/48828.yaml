    <p>Hello,<br>
    I had a bad day as my PC burned (really!!!)<br>
    Had to reinstall from scratch with my backups.</p>
    <p>Hopefully, I had a copy of my C:\PSFONTS folder.<br>
    I thought copying that folder to my fresh C:\ and reinstalling ATM after, will just do find and ATM will have updated automatically the font list but it doesn't work. ATM just show up default font list from its install but it doesn't list my OT and PS fonts from the copied PSFONTS folder.<br>
    Am I missing some configuration file or database file somewhere ?<br>
    I have a image copy of my C:\ that burned so I can go look after some files if needed.<br>
    I tried to find some config file in Application Data folders but without success, any clue ? Anyone already done that ?<br>
    Thanks a lot.<br>
    I really don't want go trhought the process of reinstalling manually all my fonts as it was already setup find.</p>
