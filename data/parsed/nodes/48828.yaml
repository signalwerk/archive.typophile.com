    html: <p>The downfall of all font management programs is the database. Bulletproof databases seem still embarrassingly difficult to build. ATM Deluxe on both Mac and Windows has always had the most robust database structure of comparable products. That said, I dimly recall there was some way you could manage to lose it. Let's hope someone from Adobe will be able to help. One problem is that nobody likes to have a database structure in simple ASCII (for space and time reasons), yet that is the best way to keep it clean and the only way it can be manually rebuilt if necessary.</p>
