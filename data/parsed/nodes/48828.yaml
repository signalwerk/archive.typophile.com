    html: |-
      <p>Absynthe, I finally remembered to look into the issue today and I was wrong. You have the right file (ATMREG.ATM). That is indeed the database file.</p>
      <p>You didn't mention what version of Windows you are using or which version of ATM you are using. What I suggest doing is to do a search for ATMREG.ATM and determine its location, then replace it with a backup copy.</p>
      <p>I've been responding under the assumption that you have ATM Deluxe so my answers are aimed in that direction. In general, if you have to reinstall ATM Deluxe and you have a backup copy of the ATMREG.ATM file, then just replace the newly installed file with your backup copy, restart, and ATM Deluxe will list all your fonts as before.</p>
      <p>If you don't have a backup copy of the database file, all your missing fonts probably will have to be added to ATM Deluxe manually. If you are using ATM Deluxe version 4.1, be absolutely sure that your font set names don't exceed 31 characters. If any set foldername does, all font sets after that point will disappear from view. While they will still be in the ATMREG.ATM database, ATM cannot manage them so you cannot use them.</p>
      <p>Once you get back on track, make a copy of your database file and store it somewhere safe. Update it whenever you've added more fonts.</p>
