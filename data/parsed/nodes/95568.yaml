  html: |-
    <p>I'd like to know the name of the typeface used to spell out the face values (e.g. <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/3/3e/Zimbabwe_%24100_trillion_2009_Obverse.jpg" rel="nofollow">ONE HUNDRED TRILLION DOLLARS</a>) on the 2007 and 2008 Zimbabwean banknote series. According to <a class="freelinking external" href="http://en.wikipedia.org/wiki/Banknotes_of_Zimbabwe#Paper_money_of_the_third_dollar_.28ZWR.29" rel="nofollow">Wikipedia</a>, the earliest of these notes were printed in October 2006.</p>
    <p>It's a sans-serif outline typeface, and the most distinctive thing about it is that some of the letters (A, <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/en/a/a2/Zimbabwe_%241000000_2008_Obverse.jpg" rel="nofollow">M</a>, N and <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/b/bf/Zimbabwe_%2420_2007_Obverse.jpg" rel="nofollow">W</a>) have exaggerated overshoots (with the last three also extending below the baseline). I haven't had any luck with WhatTheFont or Identifont.</p>
    <p>Some other examples for the different letterforms:<br>
    <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/7/70/1_Zimbabwe_Dollar_2008.jpg" rel="nofollow">ONE DOLLAR</a><br>
    <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/7/7c/Zimbabwe_%2410_2007_Obverse.jpg" rel="nofollow">TEN DOLLARS</a><br>
    <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/commons/d/d1/Zimbabwe_%24500_2007_Obverse.jpg" rel="nofollow">FIVE HUNDRED DOLLARS</a><br>
    <a class="freelinking external" href="http://upload.wikimedia.org/wikipedia/en/2/20/Zimbabwe_%2450_billion_2008_Obverse.jpg" rel="nofollow">FIFTY BILLION DOLLARS</a></p>
