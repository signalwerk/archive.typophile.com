    <p>Tauba Auerbach is a San Francisco based artist who uses letterforms in many of her works, with intriguing results. Check out this link, and scroll down about 6 rows, there's some interesting pen and ink work.</p>
    <p><a class="freelinking external" href="http://www.taubaauerbach.com/works.html" rel="nofollow">http://www.taubaauerbach.com/works.html</a></p>
    <p>Unfortunately, she's also done some design with fields: optical patterns that border on painful in some cases, so portions of her web site might be objectionable to some.</p>
    <p>Jason C</p>
