      <p>As I recall, they are usually termed 'banner ads'. I have read of 'banner' being a full-width headline in a newspaper, which may be where the 'banner' in 'banner ad' comes from.</p>
      <p>As for 'a company's banner', I think that is more akin to a medieval king's banner (flag or standard with his heraldic device on), where the banner is used as a symbol for the company. A part makes whole, or something like that.</p>
