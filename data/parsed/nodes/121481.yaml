  html: <p>W\hat is the difference between "Banner" and "Logo"?</p>
  html_clean: <p>W\hat is the difference between "Banner" and "Logo"?</p>
comments:
  - id: 594051
    user: 41133
    date: 2014-11-21T11:50:00
    date_raw: 21 Nov 2014 — 11:50am
    votes: null
    html: |-
      <p>A logo is similar to a trademark. It's a visual symbol for the brand, and may appear anywhere the company wants to identify itself: On a website, product packaging, business cards and letterhead, advertising (digital, print, or TV), vehicles, promotional items, etc. A logo may be composed of type, custom lettering, or images (abstract like the Nike swoosh or pictorial like the Starbucks mermaid), or some combination of the above. A logo has strict specifications that must be followed regarding color, aspect ratio, orientation, etc.</p>
      <p>A banner, as I understand it, is a header for a web page, or an advertisement embedded in a web page. A banner may include a logo, but it may also contain other words or images, and unlike a logo, its design may vary depending on its specific purpose.</p>
