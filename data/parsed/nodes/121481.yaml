      <p>Why is someone who works for a web design company asking about these basic terms? My first thought was that it was a spammer.</p>
      <p>But since we're answering the question, in addition to the definitions already given "banner" can also refer to a decorative device highlighting a small amount of text. It can hold a logo, but usually not. </p>
      <p>In my experience (mostly printed materials) this is the usual definition of "banner", but maybe it's different in web design.</p>
