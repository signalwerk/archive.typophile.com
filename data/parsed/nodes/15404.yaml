    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12015" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Software</a>&nbsp;: <a href="/node/20719" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Design Applications</a>&nbsp;: Adobe&nbsp;Illustrator</strong></p>
    <p>Adobe Illustrator was first produced in 1987 and currently it’s latest incarnation is <span class="caps">CS4</span> (v14). It’s main function is for producing vector based graphics/designs. It’s native file format is .ai but also can output .eps and pdfs. Newer versions can export most mainstream bitmap file formats. The key benefit of vector drawings is that they can be scaled from a fraction of an inch in size up to a few feet across with no loss of&nbsp;quality. </p>
    <p>for further information see <a href="http://www.adobe.com/products/illustrator/main.html">http://www.adobe.com/products/illustrator/main.html</a></p>
