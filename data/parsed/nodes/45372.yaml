      <p>Hi... sorry for the extremely late reply.<br>
      I haven't had time to work on it for a long time. So no updates for now. I thought I'd receive emails when people would reply, so I haven't checked this post anymore since I didn't get any updates in my mail.<br>
      But it's nice to see that some people did reply to the post.</p>
      <p>Very much appreciated.<br>
      Bendy I was just randomly drawing while sitting in the train to work and this letter was what I ended up with when I reached the last station. I didn't have any idea what to use it for (still don't)... I just thought that if I'd start drawing and making my own alphabet it would be a good learning curve to type design.</p>
      <p>Thanks Flösser! Perhaps someday I will finish it and you never know... Maybe someday it might be used on something (although the company would have to be a "good" company... with good people and friendly animals and all that... I like those sorts of companies) =)</p>
      <p>anyway... sorry for the late reply.. and tnx for taking the time to write something about my e =)</p>
      <p>bye! </p>
      <p>dav2.</p>
