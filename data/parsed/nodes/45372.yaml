    <p>Hello,</p>
    <p>I was just wondering... perhaps a bit early... what you think about my new letter e (my first self made letter e that is). A few months ago I worked quite a lot with the cooper, tyke and sauna typefaces and found myself drawing this e last week in the train.</p>
    <p>I used the little serif of the e to make the serifs of the other letters quickly in illustrator, but I was just wondering what you think of this e. =)))</p>
    <p>Hmz.. knowing what other people post here I know this is not much... but I was just wondering if this would make a happy little alphabet that is worth pursuing further...</p>
    <p>Thanks (as always) for your feedback! =)</p>
    <p>Ave a nice day!</p>
