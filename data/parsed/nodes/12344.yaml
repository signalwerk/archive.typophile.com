      <p>I've created a handy dandy little Favelet that you can add as a bookmark in your browser toolbar that gives you one-click access to a Google-powered Typophile search. I would post it here, but the Punchcut Brotherhood™ have eliminated the ability to post any JavaScript snippets to the forums. (Smart move, maliciousware-wise actually.)</p>
      <p>The Favelet can be nabbed from my weblog <a href="http://www.splorp.com/blog/archive/2005_05_01_archive.html#111578113043418502" target="_blank" title="Googophiling." rel="nofollow">here</a>.</p>
      <p>It currently works in Safari and Firefox and should be fine for users of Internet Explorer as well.</p>
