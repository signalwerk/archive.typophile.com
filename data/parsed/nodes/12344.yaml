  votes: null
  html: |-
    <p>During the beta phase you can search Typophile content via Google. </p>
    <p>As we ported over the forum discussions from the previous system we created a static (non-database driven, non-editable) version of the forums. Google's efficient bots have catalogued the forums and you can search them. </p>
    <p>When the new search is implemented (it's in testing now) all of the forums, wiki, blogs, news and content will be searchable.</p>
    <p>To search with Google, type <em>site:Typophile.com your keyword</em> into the search field.</p>
