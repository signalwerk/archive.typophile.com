    <p>I enjoy to try to challenge myself to do custom type every once in a while for logo projects.</p>
    <p>My friend approached me about a startup she is starting called Lady Babka where she'll be selling her  delicious babkas at local delis. </p>
    <p>The logo is still in process, but I'm a little in a rut of working on it so I thought I would bring it here to see what feedback you guys have to offer. </p>
    <p>Thanks in advance.</p>
