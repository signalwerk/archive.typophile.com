  html: |-
    <p>A poster I have designed focus' on the dichotomy of being <strong>dependent</strong> on the existing power grid and being <strong>independent</strong> of the grid using renewable energy. As I explored various solutions I came upon an observation; "in dependence" appears to say that one is dependent upon something. For example, "Adam is in dependence of a wifi connection."</p>
    <p>However, I realize the previous statement is structured wrong, in that the words "in dependence" can not be used in such a way(please forgive my elementary understanding of sentence structure... I believe it's being used as a prepositional phrase).</p>
    <p>Is the previous statement technically correct? If not, then what does the "in" component of the word represent? Would it not be more appropriate to use "monodependent" or "unidependent"?</p>
