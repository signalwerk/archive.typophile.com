    html: '<p>In English, we sometimes say that someone is "in denial"; what we are actually saying is that the person in in (a state of) denial. Adam, similarly, may be in (a state of) dependence on his wireless connection. But, (what is) more important, the sentence as it is now structured fails the most basic requirement for written communication: it muddles, rather than clarifies, your message.</p>'
