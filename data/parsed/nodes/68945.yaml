    html: |-
      <p>While it is an unusual usage, you can say someone is ‘in dependence’, but this suggests that he is in a psychological state of dependancy, not that he is dependant on something like e.g. a wifi connection.</p>
      <p>‘in-’ in the word ‘independence’ is a prefix indicating ‘without’. If one has independence, it means one is <em>not</em> dependant.</p>
