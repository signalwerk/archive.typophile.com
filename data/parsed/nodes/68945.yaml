    html: |-
      <p><em>All right then, what about "flammable" and "inflammable"?</em></p>
      <p>They both mean the same thing: that something is burnable. American usage is ‘flammable’ and British usage is ‘inflammable’. In this case the prefix ‘in-’ means into or towards. </p>
      <p>Yes, the prefix ‘in-’ has two different meanings.</p>
