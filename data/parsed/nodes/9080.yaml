  html: '<p>============================================================ <br>LinoLetter 02/05 - What a Bargain! Five Outstanding Stencil Fonts <br>============================================================ <br>An online version, illustrated with images of this month�s  <br>featured typefaces, is available on the Linotype website via  <br>the following link: <br>- <a href="http://www.linotype.com/8-38-8-18097/issue2005-02.html" target="_blank">http://www.linotype.com/8-38-8-18097/issue2005-02.html</a> <br> <br>! Welcome to the February issue of LinoLetter ! <br> <br>INTRODUCTION: <br>We have four special offers in store for our readers this  <br>month: first, Linotype�s design experts have pulled together  <br>five of their most interesting stencil fonts into the new  <br>Stencil Value Pack, on sale now at an unbeatable price! Also  <br>this month, we are pleased to present the unconventional  <br>Varius fonts, as well as a recap of the many revivals of the <br>Renaissance Garamond typefaces available in our Webshop,  <br>and notice of a recently released DVD documentary film about  <br>the life of the virtuoso contemporary type designer Adrian  <br>Frutiger. <br> <br>For all lovers, February 14th is the highlight of the year.  <br>Our Valentine�s Day font collection will help put you in the  <br>right mood to celebrate this extraordinary day. <br> <br>Have fonts of fun! <br> <br> <br>------------------------------------------------------------ <br> <br>IN THIS ISSUE:  <br> <br>1.  Stencil Value Pack: Download five fantastic stencil  <br>    fonts at once <br> <br>2.  Varius Font Family: A noble text design in six styles <br>  <br>3.  Garamond: A peek behind the classic name <br> <br>4.  The Man of Black and White: An Adrian Frutiger  <br>    documentary on DVD <br> <br> <br> <br>____________________________________________________________ <br> <br>1.  Stencil Value Pack: Download five fantastic stencil  <br>    fonts at once <br>____________________________________________________________  <br> <br>If you have been on the lookout for a round up of some of  <br>the best-loved modern stencil fonts, then look no further:  <br>Linotype has collected its five favorite examples in one  <br>low-cost value pack. These fonts provide the perfect touch  <br>to documents requiring tactile headlines or display  <br>elements. Let them inspire your next project! <br> <br>Special sale for the month of February only: get the  <br>complete Stencil Value Pack for just USD/EUR 29,50!  <br>Download now: <br>- <a href="http://www.linotype.com/6-2381-6/stencilvaluepack.html" target="_blank">http://www.linotype.com/6-2381-6/stencilvaluepack.html</a> <br> <br> <br>____________________________________________________________ <br> <br>2.  Varius Font Family: A noble text design in six styles  <br>____________________________________________________________ <br> <br>The shapes of the f-holes on a violin reminded German  <br>designer Andr� Maa�en of an italic letter "f". Maa�en used  <br>these captivating contours as the basis unit for his type  <br>family, Varius, an elegant and creative family of text fonts  <br>that deserves special attention for its excellent use of  <br>OpenType alternate glyphs and ligatures. The Varius family  <br>also includes a font of musical symbols and notations, as  <br>well as an elegant ornaments font that can be used in  <br>conjunction with the text fonts or on its own to create  <br>beautiful borders and individual decorative elements. <br> <br>Varius is well-suited for use in many applications,  <br>including body text, headlines, posters, book design, screen  <br>design, and even corporate identity design. Setting Varius  <br>in different sizes allows all of the facets of its design to  <br>come forward: the effects are as versatile as the  <br>possibilities! <br> <br>Check out the Varius family here: <br>- <a href="http://www.linotype.com/7-2389-7/varius.html" target="_blank">http://www.linotype.com/7-2389-7/varius.html</a> <br> <br> <br>____________________________________________________________ <br> <br>3.  Garamond: A peek behind the classic name <br>____________________________________________________________ <br> <br>Punch cutter and publisher Claude Garamond (ca. 1480-1561)  <br>created typefaces and books that profoundly influenced the  <br>future development of typography. The Linotype Library has  <br>several digital fonts inspired by Garamond�s old style  <br>typefaces; though they vary in design and exact model of  <br>origin, each is considered a distinct representation of  <br>French Renaissance style, easily recognizable by its  <br>elegance and readability. Garamond�s work went on to  <br>influence future generations of type designers, many of  <br>whose designs have been revived by the Linotype Library  <br>over time as well. Typefaces falling under the  <br>Garamond-pedigree include Stempel Garamond, Adobe Garamond,  <br>ITC Garamond, Simoncini Garamond, Garamond #3,  <br>Garamond No 5, ITC Garamond Handtooled, and Garamond  <br>Classico. <br> <br>Dive into the world of Garamond, and pick out the fonts that  <br>are best for you:  <br>- <a href="http://www.linotype.com/13305/garamond-doc.html" target="_blank">http://www.linotype.com/13305/garamond-doc.html</a> <br> <br> <br>____________________________________________________________ <br> <br>4.  The Man of Black and White: An Adrian Frutiger  <br>    documentary DVD <br>____________________________________________________________ <br> <br>Adrian Frutiger is one of the most important type designers  <br>of the modern age. He has created more than thirty  <br>typefaces, including the world-renowned Meridien, Univers,  <br>and Frutiger families. This straightforward yet sensitive  <br>film is a visual portrait of the brilliant designer and his  <br>work. It presents Adrian Frutiger�s extraordinary  <br>achievements in a new way, giving prominence to him as well  <br>as to his relationship with nature and the great influence  <br>it played on his entire life. <br> <br>�The Man of Black and White,� from award-winning documentary  <br>filmmaker Christoph Frutiger, is now available on DVD  <br>exclusively from the Linotype Webshop. Order your copy now: <br>- <a href="http://www.linotype.com/6-26-6/merchandise.html" target="_blank">http://www.linotype.com/6-26-6/merchandise.html</a> <br> <br> <br> <br>------------------------------------------------------------ <br> <br>Don�t Forget! <br> <br>Linotype.com offers a wide variety of possibilities that may  <br>help you find the right typeface or font package, as well as  <br>the chance to try the fonts out and make a purchase. This  <br>month, check out our Valentine Value Pack, and get up to  <br>speed on OpenType, the new and flexible cross-platform font  <br>format. <br> <br>Valentine Value Pack <br>February 14th is the romantic highlight of the year, and  <br>Linotype has just the thing for you this Valentine�s Day.  <br>Our Valentine Value Pack includes affectionate calligraphic  <br>scripts, handwriting, and symbol fonts that should appeal  <br>both to young lovers and lovers of the young at heart.  <br>Download them now for your sweetheart, or for any personal  <br>Valentine�s Day designs, before time runs out! <br>- <a href="http://www.linotype.com/6-1964-6/valentinevaluepack.html" target="_blank">http://www.linotype.com/6-1964-6/valentinevaluepack.html</a> <br> <br> <br>OpenType Fonts <br>OpenType is a new cross-platform font format, collaboratively  <br>developed by Adobe and Microsoft. OpenType fonts offer many  <br>advanced typographic features to their users, including the  <br>capability to switch between alternate glyphs, and to set  <br>multiple languages and writing systems. To date, Linotype  <br>offers over 1,600 fonts in the OpenType format. Learn more: <br>- <a href="http://www.linotype.com/7-1475-7/liste.html" target="_blank">http://www.linotype.com/7-1475-7/liste.html</a> <br> <br> <br>************************************************************ <br> <br>We hope you found this issue of LinoLetter informative and  <br>useful. We would highly appreciate your feedback at  <br><a href="mailto:info@linotype.com">info@linotype.com</a> <br> <br>The next issue of this newsletter will be published and  <br>dropped in your mailbox at the beginning of March. <br> <br>Your Linotype Library Online Team <br> <br> <br>------------------------------------------------------------ <br>Publisher: <br>Linotype Library GmbH <br>Du-Pont-Stra�e 1 <br>61352 Bad Homburg / Germany <br> <br>Website: <a href="http://www.linotype.com" target="_blank">www.linotype.com</a> <br>Contact: <a href="mailto:info@linotype.com">info@linotype.com</a> <br>Phone +49 6172 484-418 <br>Fax   +49 6172 484-429   <br>------------------------------------------------------------ <br> <br>(c) 2005  Linotype Library GmbH</p>'
