      <p>Re. the Didot Greek. Nick, the angle of the ductus in the Didot Greek is consistent with the heritage of the Byzantine minuscule, and with preceding Greek types in the Adline-Garamond lineage. Didot regularised the angle -- one sees more variation in e.g. the Garamond Grec du Roi --, but this kind of ductus had been characteristic of most Greek writing for more than five hundred years. It isn't a 'left-handed stress': it simply implies that Byzantine scribes, the majority of whom we can assume to have been right-handed, wrote in a manner similar to Sanskrit scribers, with the wrist bent in and/or with the page rotated 30-45 degrees.</p>
      <p>Here is an image from my ATypI Prague presentation on the influence of tools and writing styles on the normative shape of letters in different scripts, showing the variety of angles found in a typical Byzantine minuscule (the darker the line, the more prevalent the angle). In the Didot Greek style, the angle is more consistent, but it is close to the dominant angle in the earlier styles of writing and type.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/GreekDuctus_6249.gif"></div><p></p>
