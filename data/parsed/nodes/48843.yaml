      <p>BTW, I managed to dig up that "Left-Handed Calligraphy" book (Vance Studley*, a 1991 Dover facsimile of the 1979 edition) and the inconsistencies I see here are reflected there as well. By turns you read things like "With a little effort, you can learn to letter with the broad-edged pen as well as the right-hander", followed not far afterwards by things like "the left-handed person is kept at a disadvantage" and "It is an altogether different way of tackling the problem and must be seen from this other point of view". Every passage contains a "sure, no problem" followed by a "it's really different". Very unnerving, and it leaves the impression that the nasty truth is being obscured.</p>
