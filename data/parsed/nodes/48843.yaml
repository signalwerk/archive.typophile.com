      <p><em>In Arabic and Hebrew especially, left-handers<br>
      should be placed on a pedestal, not retrained.</em></p>
      <p>Again, one shouldn't confuse direction of reading with direction of writing, and what needs to be analysed is how letters are constructed, not just the direction in which the arm moves between letters. Yes, left-handed writers might avoid issues of potential ink-smear in writing right-to-left scripts, but they face just as many challenges in terms of letter construction and ductus as they do for most Latin styles. Hebrew letters are basically written following the same construction as Latin letters, starting in the top left of the letter with the characteristic entry stroke. In almost all Hebrew strokes, as with Latin, the pen is pulled. In Arabic, the pen is more likely to be pushed sometimes, hence the importance of the flexible reed and the incredibly smooth paper used by Islamic calligraphers, but the ductus pattern is very similar to that of Hebrew (steeper than Latin, but in the same quadrant).</p>
      <p>I suspect the implications of broad nib ductus patterns present the biggest challenges for left-handed writers <em>regardless of script direction.</em> These are always going to mean that a left-hander is at a disadvantage if trying to reproduce writing styles developed by right-handed scribes, and that is as true for Hebrew and Arabic as it is for Latin. Either the arm must be hooked or the page must be rotated; this is unavoidable. Again, this is presuming that the lefty is trying to write a broad nib style developed by and for right-handed scribes. </p>
      <p>Things change when the flexible pointed nib and the expansion stroke pattern are introduced, and there are styles of strongly slanted English roundhand at which lefties should excel, because the normal contrast pattern of these letters corresponds to the natural angle of a left-handed writer and special canted pens are made for right-handers to master these styles.</p>
