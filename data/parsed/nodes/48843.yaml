      <p>Nick, my theory is shot. This is a very interesting line of discussion. Let's hope an expert in Greek will chime in. In the meantime, let's ask the calligraphy experts here: are those Greeks in fact left-handed?</p>
      <p>&gt; It seems probable that the only “natural”<br>
      &gt; writing-to-type Greek style was the Porson</p>
      <p>Natural to 85% of writers, and specifically with the broad-nib pen.<br>
      But in terms of what matters (reading), not necessarily natural at all.</p>
      <p>&gt; Now, what does this imply?</p>
      <p>To me "What is normal to a left hander is not<br>
      normal to right-handers" supports my overall thrust.</p>
      <p>&gt; she can draw better than many</p>
      <p>That still doesn't mean she couldn't have done better with hands. Now, sometimes people get motivated by a deficiency. For example, I don't think Lance Armstrong would have been so successful if not for his cancer. But that still doesn't mean she changed her brain structure to become AS GOOD as a right-hander would.</p>
      <p>That said, I would love to see some foot calligraphy as well. In fact, as I've said before many years ago, I think mouth calligraphy would be the most fascinating.</p>
      <p>&gt; he can just try and do</p>
      <p>But surely there are limits. For example, we cannot digest tree bark. Also, just because we can do something doesn't mean it's a good idea.</p>
      <p>&gt; a lot of things I know in my illustration/calligraphy<br>
      &gt; part have been known by life experince</p>
      <p>Which is critically important. I'm that way too. Often people ask me for Proof, and I tell them just because I don't have any doesn't mean I'm wrong. There are entire dark worlds out there that have not been documented, and to some extent can never be.</p>
      <p>&gt; most Egyptians have been taught English<br>
      &gt; writing since they were kids in schools.</p>
      <p>And Armenians from Lebanon are taught three writing systems...  :-)<br>
      What does it imply? I'm not sure, but if it's anything like learning multiple languages at a young age, it's very good.</p>
      <p>hhp</p>
