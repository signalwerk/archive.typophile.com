      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Plain_4559.jpg"></div><br>
      The most commonly used text type for books in Greece, during the 20th century, was Monotype Greek 90, the "Plain" or "Simple" style, as it was known. It was originally designed in the early 19th century by Ambroise Firmin Didot.<p></p>
      <p>Why did he produce such a baroque (to use Bringhurst's descriptor of stress) creature and not a "Didone" face?<br>
      And why is the angle of stress "left-handed"?</p>
      <p>I suspect he envisioned a type which would have to satisfy the demands of being part of a triumvirate with Latin Roman and Italic in academic French texts, with a quite different look from either. But what effect did this apparent celebration of minority handedness have on the Greek book-reading populace?</p>
