      <p><em>precedent</em></p>
      <p>That prompted me to look through some reference material.<br>
      Wilson (1756) and Baskerville (1763) both have a "left-handed" stress to their Greeks.<br>
      So does Fry (1828) (based on the Wilson).<br>
      Fry also has another, "right-handed" Greek, a clone of the <em>Porson</em> cut by Richard Austin in 1806, based on the handwriting of Greek Scholar Richard Porson.<br>
      The Haralambous 18th century German revival <em>Bekkeriana</em> is also a lefty.<br>
      It seems probable that the only "natural" writing-to-type Greek style was the Porson, and that there was a tradition in the West of "left-handed" Greek types for several centuries.<br>
      With earlier Greek types of the 16th and 17th century, the printing is so bad they all look monoline, at least in the few examples I've seen. Of course, I'm no scholar, just a designer with a few type books.</p>
