      <p>"Surely it would be different than what the right-hander would." </p>
      <p>Absolutely Hrant. </p>
      <p>"If so, what would people think of those results?"</p>
      <p>Sorry for the humor... but it would probably be hard to read.</p>
      <p>I thought the percentage was about ten. When I teach Hrant,  I always ask before class starts if there are any hookers in the room. There are usually snickers but invariably a knowing smile on a face appears and a hand is raised. Then everybody gets it.</p>
      <p>How they have adjusted has long since passed. Suffice it to say they have adjusted tool (canted edge), stance (of the pen), grip, perspective (orientation of both body and paper) in order to allow them to physically represent the letter du jour. For no known reason I use a similar face to paper as a left hander (only I look from the left), I view from the side as opposed to straight on. Tried to break the habit but I could not give up the pacifier : )</p>
      <p>All this to say each of us compensates, and going backwards would be a tough one unless it is caught early on. But, and here is my point, it is in order to accurately make the historical forms that have been passed down through the centuries. Even Zapf, after a few years of practice, reoriented his grip. Not an easy thing to do.</p>
      <p>"it seems hard to get left-handers to flaunt that fascinating divergence they’re born with"</p>
      <p>Not when you give them a tool that is "point neutral," such as a pointed pen (Michael Sull) or a ruling pen. Then you really see the smiles.</p>
      <p>Michael</p>
