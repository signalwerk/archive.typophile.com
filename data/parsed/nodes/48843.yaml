      <p>Nick, that "serif" on the T is simply the result of lifting the nib on one side at the end of a stroke. This makes the stroke get very thin towards the end.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/visigoth/" rel="nofollow">Arthur Baker</a> was a master at this, in some of his works you can find hardly any stroke that is written without lifting the nib. Also, some broken scripts show features based on this principle.</p>
