      <p>Actually Tim, Arthur does less lifting than you think. He has employs extreme manipulation sometimes rotating the tool a full 360 degrees. This piece was done in two passes, I believe (I will check with him), and you can see his facility for rotating the tool, in this case a sponge brush with gouache on a coated stock. It boggles the mind doesn't it?</p>
