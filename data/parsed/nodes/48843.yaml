      <p>In the crossbar of the A the pen angle is flattened as it is moving horizontally. That's more difficult than doing it vertically which is probably why the top side of that stroke is not as steady looking as the bottom. It is one of the more awkward and inconsistent parts of the design. Most pen strokes are either vertical or horizontal, but the A crossbar, Cap T and rt horizontals deviate from this.</p>
      <p> I'm still a bit puzzled here expecting that there would be some kind of real mystery revealed. It seems to be just minor oddities in a piece of lettering that was manipulated in whatever means the artist had available at the time.</p>
