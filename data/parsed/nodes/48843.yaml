      <p>&gt; Doesn’t look like type to me!</p>
      <p>It's indirect, certainly. But I'm essentially interested in type, not calligraphy, so you can be sure there's a connection, and it's a connection I already alluded to: if the dominance of right-handedness in calligraphy is spurious (and I admit that does remain a big IF) then the calligraphic basis at the heart of the bulk of type design so far should be tamed, possibly even discarded. To put it another way: 15% of the population cannot be "unnatural", cannot be seen as needing to "compensate"; it's much more logical (and gracious) to think that calligraphy (at least uni-directional calligraphy) is unnatural to type.</p>
      <p>Calligraphic "handedness" is only one piece of the puzzle however. There are other, and much more forceful, arguments that lead to the desire to demote calligraphy in type design. This issue is quite a minor one. But we do deal in details around here!</p>
      <p>As very many fellow type people know too well, this is a sentiment I've harbored for a long time, and I admit it would take a lot to dislodge me from it, considering all I've seen and all I've thought. However I am not jaded enough to stop looking for both validation and doubt.</p>
      <p>&gt; corresponding cordially via e-mail</p>
      <p>What makes you think I would be cordial?<br>
      I'm much more a believer in candor.</p>
      <p>I would correspond with you privately only if there's something important you'd like to contribute only in private.</p>
      <p>hhp</p>
