      <p>Tripe, pure tripe. I should have said 20/20 hindsight.</p>
      <p>I talked with Bob Boyajian today and Larry took his class on left handed calligraphy in the 70's. Bob laughed at your speculation! "You cannot tell." Those "backward finishes" were basically made famous by James Hayes, Arthur Davies, Arthur Baker and Byron MacDonald -  ALL RIGHTIES as far as I know. </p>
      <p>Manipulation, whether you want to disqualify it or not, is pretty standard. Not to mention almost natural! </p>
      <p>The contortions in Sull's videos are also pretty standard. I turn the paper, turn the pen, add pressure to expand the stroke. You are delving into a field you have no clue about. Stick to your pencils.</p>
      <p>As to the two who guessed leftie, pure grasping at straws. </p>
      <p>Michael</p>
