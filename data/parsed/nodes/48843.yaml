      <p>Michael, that Arthur Baker example is amazing.</p>
      <p>&gt; There are not enough visual clues in this<br>
      &gt; piece to indicate it was done by a southpaw!</p>
      <p>Here are the top three opinions in this thread that make me doubt that:<br>
      -"You’d have to rotate your pen anti-clockwise for the ’A’ swirl with quite<br>
      a difficult manoevre, and even more so for the clockwise one on the ’h’<br>
      (unless your wrist joints are disjointed)."<br>
      -"it might have been originally written at an angle and then skewed upright."<br>
      -"the pen angle is all wrong from the start and is not correct at any point."<br>
      There are a few more, although less focused.</p>
      <p>Not to mention that Timo figured it out, and apparently Jonathan (jselig) as well. Unless you think that their being left-handed (Timo too?) makes them jump to conclusions (not impossible I admit). I would be interested to hear specifically what made Timo -and especially Jonathan, since he says he had the idea immediately- think it was made by a left-hander.</p>
      <p>Another useful avenue might be to look at the Mike Sull video that David linked to, and (while pondering the relevance of that crabby nib...) see if a right-hander could produce the same results <em>with equal effort</em> - contortions are grounds for disqualification!</p>
      <p>&gt; So you read it was written by a southpaw and backseat drove from there?</p>
      <p>Hey, I've been driving this jalopy for years!</p>
      <p>Basically I have ideas concerning the fact that ~15% of the population has to go to a "worker retraining facility" so to speak to do calligraphy "correctly". And this ties in to type very poignantly: if there's something Righteously Right about basing fonts on right-handed calligraphy, doesn't that mean there's something Wrong about left-handers? Furthermore, it is a fact that some people have been forced (sometimes by their teachers) to drop calligraphy because they are left-handed. What I have to ask is: what are we missing out on as a result?</p>
      <p>This thread was an attempt to extract people's insights in<br>
      spite of themselves, and I'm pretty happy with the results.</p>
      <p>&gt; Was it done by Larry Brady?</p>
      <p>You're good! The example is from Nemoy's book. He has a whole chapter about how southpaws should do calligraphy - as do many other calligraphy books. I even own a 64-page book titled "Left-Handed Calligraphy". And let's not go into how Noordzij suggests they should write...</p>
      <p>&gt; How do you get left handed?</p>
      <p>It has to do with the orientation of certain body parts during conception.</p>
      <p>hhp</p>
