      <p>&gt; You will need a lot more tangible evidence</p>
      <p>I have to agree (even if I think there are glimmers of light in this thread). Maybe the Arabic (or Hebrew) angle might be more fruitful, since that seems to favor left-handers (in terms of not smearing at least).</p>
      <p>&gt; Just because a text is read from right to left doesn’t<br>
      &gt; mean that it was written from right to left.</p>
      <p>True.<br>
      On the other hand, it's possible for a right-hander to perform Arabic calligraphy without re-orienting the paper; during a workshop on Arabic calligraphy that I participated in during a type conference in Beirut, we were not told to tilt the paper.</p>
      <p>&gt; Rotating the page avoids the ink smear problem.</p>
      <p>It also "avoids" the scribe being able to comfortably read what he's writing. :-/<br>
      I think the deciding factor might be the length of the text: if it's a short/artistic piece there's more freedom with the paper orientation.</p>
      <p>&gt; You forget that I design type (TDC awards two years running)</p>
      <p>Congratulations. I can assure you that I fully believe that most of the craft of type design is on your side. Most type is essentially calligraphic. I don't claim to be in the majority. I do however claim to see where type is heading, even if it won't happen in my lifetime. For a glimpse, please see -no, research, and contemplate- the font Legato by Evert Bloemsma.</p>
      <p>&gt; Are you saying that details can only be achieved by bezier control points?</p>
      <p>No actually, one of the <em>main things</em> about type (ideal reading) can only be arrived at through the delineation of the border between black and white, as opposed to the marking of the black. I'm not going to elaborate more in this thread, because I've done so too often in the past here and elsewhere.</p>
      <p>&gt; if you are not interested in calligraphy, according<br>
      &gt; to your last post, why did you start this thread.</p>
      <p>I am interested in calligraphy to the extent of learning its limitations and learning how to ween people (including myself) off of it in the realm of type.</p>
      <p>&gt; This continued clutching at straws will lead to nothing but<br>
      &gt; resentment from those who may be able to offer insight.</p>
      <p>I don't expect to get insight from people who's art I have insulted (if only in the sphere of type - calligraphy of itself I find very beautiful and enriching). I don't think most people are strong enough to remain objective when their entire life's work is doubted; artists especially are more liable to rely on their egos and throw humility out the window, to be honest. And that's why I had to resort to a ruse of sorts - simply to circumvent human nature. But that doesn't mean the outcome was predetermined. I really am looking for lights on the path, and this thread has been useful to me: now I know I need better examples, more evidence.</p>
      <p>That said, I don't think I'm the only one who sees inconsistencies in the various opinions and claims made by you and Michael in this thread. These inconsistencies give me hope that there's more to this than meets the hand.</p>
      <p>If you were expecting this thread to be a cheerleading festival for your art, I'm honestly sorry it turned out into something quite different. I do want people to celebrate, but sometimes there's serious ideological work to be trudged through. In any case, discussions with people I disagree with are my best hope of honing my methods and ideas, so thank you.</p>
      <p>hhp</p>
