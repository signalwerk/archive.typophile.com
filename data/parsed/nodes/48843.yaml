      <p>This piece is from a series he did in the 70's and early 80's. His whole body of work is a reflection of the eschewed manipulation techniques used in the manusripts. His type is very idiosyncratic and most of it employs these techniques.  To this day it is highly divisive in the calligraphic community and has been here also in some threads. But it is very obvious to most who have picked up a pen and "gone to the dark side" : )</p>
      <p>Michael</p>
