    user_name: Nick Job
    user_path: null
    date_raw: 28 Aug 2008 — 5:08am
    date: 2008-08-28T05:08:00
    votes: null
    html: <p>Not knowing much about hand lettering - I've almost forgotten how to write myself, let alone make it look nice when I do - is it the weird 'serif' on the T? Assuming you hold the nib generally at a given angle the whole time, somewhere between horizontal and 45 degrees (clearly there will be minor variation during writing). How did that serif get put on the bottom left hand end of the crossbar without something weird occurring? surely it should have stuck out at an angle between 7 and 9 o'clock, but not 6. Looks unusual to me.</p>
  - id: 298226
    user_id: 4763
    user_name: Tim Ahrens
    user_path: null
    date_raw: 28 Aug 2008 — 6:13am
    date: 2008-08-28T06:13:00
    votes: null
    html: |-
      <p>Nick, that "serif" on the T is simply the result of lifting the nib on one side at the end of a stroke. This makes the stroke get very thin towards the end.<br>
      <a class="freelinking external" href="http://www.myfonts.com/fonts/adobe/visigoth/" rel="nofollow">Arthur Baker</a> was a master at this, in some of his works you can find hardly any stroke that is written without lifting the nib. Also, some broken scripts show features based on this principle.</p>
