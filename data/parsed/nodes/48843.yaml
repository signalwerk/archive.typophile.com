    votes: null
    html: |-
      <p>Thanks for that example, Michael (typerror). Looks really stunning. Where is it from?</p>
      <p>I tried reproducing some of Baker's works myself using a broad nib pen and found it much easier when I lifted the nib. I also tried rotating the pen but soon gave up since it wouldn't create that look nearly as easily. So I was convinced Baker must also have primarily lifted the nib but - as your example proves - obviously was wrong. Maybe I used too small a nib.</p>
