    html: <p>I don't think it has been skewed. This does show the common pen manipulation that was the flavour at the time and this could be what you can see. It is an obvious cut &amp; paste job and the different sizes are just reduced stats pasted in. But this was/is not an unusual practice for calligraphers. I still can't see anything really strange in this.</p>
