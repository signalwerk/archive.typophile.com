      <p>Assuming they follow the right-handed model, I agree. But not smearing is an advantage, while in left-to-right scripts it's an <em>extra</em> impediment; it might even be a big reason why left-handers are compelled (although maybe mostly by right-handers who are teaching them...) to write "funny".</p>
      <p>Also, I think many of the cultures that switched from right-to-left (or boustrophedon) to left-to-write did so because of the smearing issue.</p>
      <p>&gt; In almost all Hebrew strokes, as with Latin, the pen is pulled.<br>
      &gt; In Arabic, the pen is more likely to be pushed sometimes</p>
      <p>From the Studley book:<br>
      "the right-handed writer makes the majority of strokes in movements directed primarily away from the body. The left-handed writer makes the majority of strokes in a predominantly pushing movement towards the body. The right-hander pulls the pen across the page from left to right with the writing hand well in advance of the damp ink. To achieve the same results, the left-hander pushes the pen in a way that will not smear the freshly written ink. This is best accomplished by holding the pen below or in extreme cases, above the line of writing."<br>
      This seems to reinforce the view that Arabic and Hebrew are more friendly to left-handers.</p>
      <p>&gt; Either the arm must be hooked or the page must be rotated</p>
      <p>I'm not so sure. I think with a "special" nib and enough facilitation of pushing, it might be possible. But I'm not in a position to test that theory; I'm right-handed.  :-)</p>
      <p>But if you're right, the opposite should be true for right-to-left scripts, no?</p>
      <p>Anyway, I'm not very interested in left-handers emulating right-handers; to me that's old news, and it's unnatural. I'm interested in exploring the missing links. I'd like to see a left-handed calligraphic typeface, and gauge how people -readers- react to it.</p>
      <p>--</p>
      <p>Nick, maybe Ambroise Firmin Didot was left-handed, and lacking a precedent that he would feel forced to emulate, he did the "natural" thing? I'm just speculating.</p>
      <p>hhp</p>
