      <p>&gt;&gt; There are not enough visual clues in this<br>
      &gt;&gt; piece to indicate it was done by a southpaw!</p>
      <p>&gt;Here are the top three opinions in this thread that make me doubt that:<br>
      &gt;-“You’d have to rotate your pen anti-clockwise for the ’A’ swirl with quite<br>
      &gt;a difficult manoevre, and even more so for the clockwise one on the ’h’<br>
      &gt;(unless your wrist joints are disjointed).”<br>
      &gt;-“it might have been originally written at an angle and then skewed upright.”<br>
      &gt;-“the pen angle is all wrong from the start and is not correct at any point.”<br>
      &gt;There are a few more, although less focused.</p>
      <p>You do not have to rotate your pen anti-clockwise for the A swirl. The 'swirl' in question is a simple and basic pen manipulation technique that is an anti clockwise 'movement', however the rotation is actually to the right - a clockwise rotation. In this case the pen starts at a natural angle of about 60 degrees and in a downward- anti-clockwise movement the right hand edge of the pen is rotated to the right to finish at another natural pen angle of about 20 degrees. This a natural and simple pen manipulation for both right and left handers. It is, in fact easier for the left hander in this particular pen stroke. This standard manipulation is one of the easiest to do and the first one a calligrapher would learn when starting pen manipulation study. </p>
      <p>As for "...and even more so for the clockwise one on the ’h’ (unless your wrist joints are disjointed).” "<br>
      This is not a pen manipulated stroke in any form!  Are we looking at the same piece of lettering? Do you have any idea about pen made letters? From the comments being made in this thread I can only say - and with respect - that there is a lot of ignorance and ill informed opinion on calligraphy standards and practice as well as on how letters are constructed using the tools of the craft.<br>
      Nothing special here in pen manipulation and nothing to indicate a left hander. Even given the very steep starting pen angle - this is not always a sign of being left handed although it is more common in left handed beginners trying to write with a right hand nib and coming to grips with the pen hold (pun intended). It is also seen in right handed calligraphy, so its not exclusive to left handedness but is more due to a lack of looking, lack of familiarity with the tool and little understanding of correct letter form. </p>
      <p>There is no skewing at all in this work. There is nothing 'peculiar' either. It's a standard example form the time. There is nothing special and nothing to define left handedness. My reference to the pen angle being wrong from the start can not be taken as a sign of left handedness - for this 'fault' is a common one for both left &amp; right handed calligraphers. In this case the pen angles are too steep all round. Again this can not be seen as a sign of left V right. </p>
      <p>Perhaps you may find more weight for your research into the direction you wish to take it by studying the effects and influence of religion on left/ right handedness and writing from left to right and from top to bottom and of turning the page from right to left.</p>
