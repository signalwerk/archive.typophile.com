      <p>&gt;Graham, you’re saying this is ugly? Because I actually<br>
      &gt;don’t think so. But I would very much like to hear why<br>
      &gt;you think it is - it might help solve this riddle.</p>
      <p>My reference to ugly was directed elsewhere-another riddle to solve :)<br>
      This piece is very much of its day and it would have been well received within the general calligraphic community of the time.<br>
      By today's standards it is poor. Its not really fair to pick on the work of a fellow scribe who can't defend him/herself. But it is not what I would have done in 1975, and it certainly is nothing like what I would do today.</p>
      <p>I am not sure what you have in mind nor what point you are trying to make with this. There is nothing overtly strange to it that I can see. My take of the "The Art of the Scribe" is that the pen angle is all wrong from the start and is not correct at any point. It's too small to tell and I would need a much closer look, but if the entire poster is calligraphy as you say, then it does not look to be written entirely by the same hand-can't be sure of this from the jpg.</p>
