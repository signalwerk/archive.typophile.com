    html: |-
      <p>It's great to see some clever, create strategies! The question of how creative to get probably depends on the intended usage. Display type benefits from greater creative freedom, which can be a distraction in text type.</p>
      <p>There's a cultural dimension to this, too. For example, German foundries in the mid-20th C got very creative with their umlauts:</p>
      <p><img src="/sites/default/files/old-images/Umlauts_5317.png"></p>
      <p>Zapf even did this with Melior and Optima:</p>
      <p><img src="/sites/default/files/old-images/Zapf_6456.png"></p>
      <p>Note that the E-umlaut in Melior shows that there was not technical requirement that the umlauts be lower. It was just a style choice.</p>
      <p>Those were fine for the German market, but when the types were issues outside of Germany they universally adopted the more common (and boring) style.</p>
      <p>Menhart and some other Czech designers (even current ones) have tried a very uniquely Czech design for the U-ring:</p>
      <p><img src="/sites/default/files/old-images/Menhart_4730.png"></p>
      <p>Some say this is old-fashioned, but I think it's a classic example of cultural character in design, and works great for a limited audience and purpose.</p>
