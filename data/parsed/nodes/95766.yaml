      <p>If it could itself be condensed, the character would be called A-oval and not A-ring, so no, it has to be round. Like anything else, different designs might have other alternatives. </p>
      <p> I hope that your question wasn't because you wanted to create a condensed font by just squeezing an existing font. You can't mechanically squeeze a font to get a condensed version. That destroys more than the shapes of glyphs, but their proportions and stroke widths, as well.</p>
