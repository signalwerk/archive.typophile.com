    html: "<p>I think a disconnected ring is the way to go here. As it stands the connected ring makes the A look taller compared to other A's, and the ring looks too low. You also need to check the optical alignments (both vertically and horizontally) of other accents. For example, in the light, the breve looks much lower than the circumflex, and in both weights the accents often look shifted to the left. One last thing: the ogonek like that opens up too much white space in the bottom counter of A. I'd make it bigger and more serif like on the inside. We'd need to see a lowercase descender to gauge how big it needs to be. It should descend the same amount, ie usually bigger than a cedilla.</p>"
    html_clean: "<p>I think a disconnected ring is the way to go here. As it stands the connected ring makes the A look taller compared to other A's, and the ring looks too low. You also need to check the optical alignments (both vertically and horizontally) of other accents. For example, in the light, the breve looks much lower than the circumflex, and in both weights the accents often look shifted to the left. One last thing: the ogonek like that opens up too much white space in the bottom counter of A. I'd make it bigger and more serif like on the inside. We'd need to see a lowercase descender to gauge how big it needs to be. It should descend the same amount, ie usually bigger than a cedilla.</p>"
