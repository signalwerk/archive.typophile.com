      <p>I disagree with some here. I think the 'ring' is conceptually connected with the A in the A-ring combo. That can be seen by the numerous examples where the ring is shown as attached to the A, not a separate floating piece. I once looked through about 100 of the most commonly used fonts out there (a very unscientific guess on my part) and found that around <em>half</em> had the ring connected.</p>
      <p>So I see no reason to consider the ring as something that has to be perfectly circular, any more than the dot on the i has to be perfectly circular. Yes, both are commonly so, but more importantly should visually harmonize with the rest of the face. That goes whether the ring is connected or not.</p>
      <p>And as for accents/diacritics in general, I think they should always follow the visual language established in the 'normal' letters, with similar contrast, terminals, weighting and alignment.</p>
    html_clean: |-
      <p>I disagree with some here. I think the 'ring' is conceptually connected with the A in the A-ring combo. That can be seen by the numerous examples where the ring is shown as attached to the A, not a separate floating piece. I once looked through about 100 of the most commonly used fonts out there (a very unscientific guess on my part) and found that around <em>half</em> had the ring connected.</p>
      <p>So I see no reason to consider the ring as something that has to be perfectly circular, any more than the dot on the i has to be perfectly circular. Yes, both are commonly so, but more importantly should visually harmonize with the rest of the face. That goes whether the ring is connected or not.</p>
      <p>And as for accents/diacritics in general, I think they should always follow the visual language established in the 'normal' letters, with similar contrast, terminals, weighting and alignment.</p>
