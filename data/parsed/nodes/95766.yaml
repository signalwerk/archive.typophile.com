      <blockquote><p>If it could itself be condensed, the character would be called A-oval and not A-ring</p></blockquote>
      <p>The name “A-ring” is misleading, as it’s not in a language that actually use |Å|.<br>
      The “ring” it’s not a diacritic, it developed from |o| and, for example, can/should retain the same stroke modulation of the rest of letters. And there are plenty of examples of oval looking ”rings”, although they’re most often horizontally wide in order to save vertical space.</p>
