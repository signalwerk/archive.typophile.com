      <p>I think you're doing the right thing by disconnecting them; Nordic type designers here on Typophile have mentioned before that it's only really acceptable to join the ring when vertical space is a problem, as in newspaper headlines. (I'm not convinced that looking at commonly used fonts is the most ideal way to determine best practice for diacritics; with more and more talented Nordic type designers on the scene now, including Frode, I'd rather check what they prefer.)</p>
      <p>At any rate, I'd check the horizontal placement of your rings: to me they look too far left on the light and too far right on the bold. But I'm not a native user of these letters ;)</p>
      <p>Looks like a very nice typeface, looking forward to seeing more!</p>
