    <p>I have got this theme: <a href="http://wordpress.site5.net/designpile/" title="http://wordpress.site5.net/designpile/">http://wordpress.site5.net/designpile/</a> for a wordpress blog, and i´m working really hard to customize the theme but i need the name of fonts, so i can modify the fonts to another language (portuguese).</p>
