      <p>That sounds like a great resource. On the color side, I was just trying to find something like that. When I couldn't find anything exactly like what I was looking for I started kicking around the idea of making a reference document, or website that would have RGB/CMYK/Pantone conversions as well as names that are associated with certain colors. That seems like it could really help with client communication because a designer could both use names the Client is more familiar with and look up color names that a client mentions.</p>
      <p>Sorry if that's a little off topic,</p>
      <p>Duncan</p>
