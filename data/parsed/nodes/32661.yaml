      <p>You need to get your hands on </p>
      <p>1. The Bitstream Font Analogue (1992?) – which listed Bitstream fontnames against the respective standard industry names. This info may be on their website, but I've never found it. They tend to rely on the 'family tree' view on myfonts.com to provide names of equivalent faces from other foundries.</p>
      <p>2. A Manual of Comparative Typography by Benjamin Bauermeister, 1988, Van Nostrand Reinhold, N.Y. lists many alternative names from other photosetting suppliers for quite a few of the standards.</p>
      <p>(Shameless plug!) some of the above information made it into the 'see also' sections of the individual font pages at <a href="http://www.100types.com/100types.com.list.html" rel="nofollow">my site about the so-called top 100</a>. So for example, if you look for Akzidenz Grotesk there you'll see <em>'See also;<br>
      Amsterdam Mercator, Bauer Venus, Stempel Reform Grotesk, Haas Normal Grotesk, Bauer Folio, Linotype Basic Commercial, BT Gothic 725.</em><br>
      ...and so on. In this particular listing I can say that only the last two are AG under other names from different foundries. Generally, I leave it to the viewer to decide which typefaces are simply close in design and which are rip-off.</p>
      <p>I think Daniel Will Harris has something on this at his site too; try starting at <a href="http://www.will-harris.com/esperfonto/" title="http://www.will-harris.com/esperfonto/">http://www.will-harris.com/esperfonto/</a></p>
