    <p>Hi guys,</p>
    <p>I'm currently preparing myself for building my own website (which still might take a while, mind you) &amp; I was thinking about putting useful information on it for graphic designers in general. One thing I wanted to do, is put a RGB/CMYK/Pantone (&amp; possibly RAL) conversion table on it &amp; also a list of fonts which are known under several names. I'm thinking of retro fonts that have now been digitilized (eg. Jackson that is now available from Linotype as Laughin) &amp; also fonts that are cloned and widely spread over the internet. I've often experienced (even at work) that we had font clones without even knowing it (eg. we had Arnold Bocklin, but also Horizon which -some kerning aside maybe- is basically the same). I had a few sites that mentioned font clones in my favourites list, but they no longer exist.<br>
    So if anyone knows of any fonts with several names, please let me know, I'll be sure to acknowledge you if I ever manage to get my site online ;-)</p>
