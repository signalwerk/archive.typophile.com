    html: <p>No, that's exactly my idea. To make the life of everyone in the graphic industry a lot easier. I used to have a few of those colour conversion sites amongst my favourites as well, but none of them were complete. And I've also often found myself knowing the name of a "real" font, knowing that we hàd it at work, but not being able to find the name under which we had it. I just thought to combine all these things in one user friendly site. The only problem is that the internet is my only source &amp; that I will have to gather all the information myself, so if anyone here has links for fontclones, colour conversions or other ideas, please don't hesitate to post 'em here.</p>
