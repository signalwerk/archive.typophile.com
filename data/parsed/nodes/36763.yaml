    html: <p>I like the start of the idea. Your tagline really says it all without the meat cleaver. You might be able to incorporate the "clean-cut" idea in the company name like Scott mentioned and maybe it's not a a tear, but a clean cut through the words horizontally starting small and increasing as it goes through the whole word. I would also agree in not combining the 'g' and the 'n' unless you have a reason for it. I like your color choice.</p>
