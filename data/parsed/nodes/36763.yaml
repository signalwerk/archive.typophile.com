    html: <p>I agree that the cleaver/knife is awfully prominent... you could try to show the logo "cloven," perhaps between the "Cleave" and "Design" words, with a cut/tear between the words. If you like the knife, how about showing less of it (more the handle sticking out from the cut "page" with the blade beneath)?</p>
