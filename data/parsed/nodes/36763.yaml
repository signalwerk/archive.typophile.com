    <p>I'm working on a logo for my design company, Cleave Design. You can see the old logo (not really a logo at all) <a href="http://www.cleavedesign.com" rel="nofollow">here</a>.</p>
    <p>Thought about playing off of the word "Cleave" and went with an image of a cleaver.</p>
    <p>Is it too cheesy? Does it work? Does the tagline help? Thoughts?</p><div class="imageWrap"><img src="http://typophile.com/files/Cleaver-Design_5325.jpg"></div><p></p>
