    <p>Of course, the problem with the <a href="http://typophile.com/node/29942" rel="nofollow">term "clan"</a> now is that FontFont just released the large FF Clan family by my good friend Łukasz Dziedzic. It's the first Polish type design released through FontFont, and hopefully not Łukasz's last. </p>
    <p>Overview of the FontShop release 39:<br>
    <a href="http://www.fontshop.de/news/NewFontFonts/Overview%20FF39.pdf" title="http://www.fontshop.de/news/NewFontFonts/Overview%20FF39.pdf">http://www.fontshop.de/news/NewFontFonts/Overview%20FF39.pdf</a></p>
    <p>FF Clan sample:<br>
    <a href="http://www.rzeczy.net/data_img/2006-10-11/FFClan.pdf" title="http://www.rzeczy.net/data_img/2006-10-11/FFClan.pdf">http://www.rzeczy.net/data_img/2006-10-11/FFClan.pdf</a></p>
    <p>Łukasz Dziedzic's website featuring some of his other typefaces:<br>
    <a href="http://www.alfabety.pl/portfolio/" title="http://www.alfabety.pl/portfolio/">http://www.alfabety.pl/portfolio/</a></p>
    <p>An interview with Łukasz (in English) on rzeczy.net:<br>
    <a href="http://rzeczy.net/en_czytaj_167.php" title="http://rzeczy.net/en_czytaj_167.php">http://rzeczy.net/en_czytaj_167.php</a></p>
    <p>Opinions on FF Clan? </p>
    <p>A.</p>
