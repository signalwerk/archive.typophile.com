    html: <p>If the derivative font contains the trademarked name of the original, in this case Helvetica, you can be pretty confident that it's licensed, especially when someone like IBM is involved. Check the (c) and TM strings in the font for confirmation. Another similar examples would be Apple Myriad, used under license from Adobe. However in some cases lack of the original TM name may not mean it's a knock off - for example FF Transit is derived from Frutiger under license.</p>
