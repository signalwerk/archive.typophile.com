      <p>Well, I'm no expert, but my assumption is that they had to talk to Linotype (whom I believe owns the rights to Helvetica Neue) to get permission to customize and modify the typeface. Most standard <a href="/wiki/EULA" class="freelinking" rel="nofollow">EULA</a>s have a clause prohibiting modifying, renaming, etc., unless express permission is given, so they probably had to work out some deal (which I'm sure wasn't a big deal money-wise for a company like IBM).</p>
      <p>Unfortunately, though, renaming/modifying type without permission is not as uncommon as you'd like to think, even for big companies. I've seen a few such cases here on Typophile if memory serves, with the most famous recent case being the one <a href="http://www.typophile.com/node/17362" rel="nofollow">here</a> and <a href="http://www.typophile.com/node/14517" rel="nofollow">here</a>.</p>
