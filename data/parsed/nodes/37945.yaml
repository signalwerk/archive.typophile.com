    <p>I'm working on a thing for IBM right now, and I just started thinking about their fonts. They have customized Helvetica Neue fonts, like "IBM Helvetica Neue Black". How does that work license-wise? I doubt they just made a rip-off and renamed it, to avoid licensing fees. </p>
    <p>Do any of you experts here know anything about this kind of stuff? I'm interested because I myself might someday like to do somehing similar.</p>
