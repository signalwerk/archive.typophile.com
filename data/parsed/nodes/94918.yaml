    html: |-
      <p>I am of two minds on this subject—which for me, is mighty economical.  Look: deep down inside, you KNOW why Monotype Grotesque Expanded sings to you. Something about it makes you FEEL good.</p>
      <p>Check out a lot of serif fonts; if one makes you FEEL the same way, then that's your OTHER baby. You really DON’T need other people to rationalize your behavior. OTOH, if a suggestion works and you FEEL that it's the right thing to do, do it.</p>
      <p>This concludes today’s Daily Sermonette on Doing the Right Thing. Dammit.</p>
