  html: |-
    <p>Hello,</p>
    <p>I am hoping someone here might be able to hep me identify my font.  I’ve already used several online font identification sites, but I cannot seem to find the match.  I used a font found on a free site to create the graphics on my blog, at <a href="https://web.archive.org/web/20080705162353/http://www.styleitonline.com/" title="http://www.styleitonline.com">http://www.styleitonline.com</a>.  Since that time (a year and a half ago) I have lost the font files and the original graphics, so I am unable to create more graphics with the same font. </p>
    <p>Does anyone know which font I used to create the Style IT portion of my banner? I’m very grateful for your help!</p>
    <p>Best,</p>
    <p>Sarah</p>
