      <p>1) Behance page for that project is no more available. I will do more research, but might be that his font is uploaded on i.e. Mediafire, Rapidshare... kind of services. But it's not available from Behance any more. I found those images on Pinterest and few other blogs.</p>
      <p>2) I couldn't find his direct contact informations, so I had to create account on Behance and to write him message using their contact form. I don't believe he'll answer on that and I have small hopes that I will find his contact (phone, email, address...). I'm still under impression of everything, probably not thinking reasonable at the moment. What could I do at this situation? (I write in first person even designer of "Oblik" is my father, but I try to keep all communications).</p>
      <p>3) I know about <a href="http://typesnitch.com/" title="http://typesnitch.com/">http://typesnitch.com/</a>, we will have to consider it seriously now, cause honestly this is something I would never expect to happened to us. We are very small and not so specially popular nor on market nor in typographic community, but I guess it can happened to anyone.</p>
      <p>I just can't get it, what does it takes for somebody to do such thing?</p>
      <p>BTW, who is behind TypeSnitch service?</p>
