    <p>We found an rip-off of our "Oblik" in Bold weight.</p>
    <p>At first it was disturbing to find out something like this, but then I'm now feeling a little empathy for this guy, for the reason he is young (judging by his photo and by his profile description). But this is not the way to build your design career or to go in public without having any responsibility for your acts.</p>
    <p>To not duplicate what we wrote, feel free to check it directly on our website:</p>
    <p><a class="freelinking external" href="http://www.tourdefonts.com/rip-off-of-oblik-bold/" rel="nofollow">http://www.tourdefonts.com/rip-off-of-oblik-bold/</a></p>
    <p>Let this be an lesson, in educational purpose, to all designers who might have doubts to do such things to any existing, available, on the market or off the market, with ownership design of any kind!</p>
    <p>Cheers,<br>
    Dusan</p>
