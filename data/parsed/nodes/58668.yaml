    html: <p>Defenitly a customised copperplate script, (not copperplate from F.W. Goudy). You could check scripts like — Edwardian Script, Shelly Script, English Script. Linotype.com &gt; Scriptfonts. The s is way of compared to regular copperplate script, so I think you won't find it as a typeface unless someone has made one from it.</p>
