      <p>The way I read the OFL is that one can not sell the font on its own as a separate product (the UFL (Ubuntu Font License) allows this, IIRC), but one can certainly toss it into a bundle (say, an OS or app distro) and sell that. So, you could combine or even integrate GIMP, Fontforge, Inkscape and Scribus, shovel on a bunch of OFL fonts and sell the resulting package.</p>
