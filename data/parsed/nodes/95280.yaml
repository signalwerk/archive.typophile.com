    <p>Source Sans Pro: Adobe’s first open source type family</p>
    <p><a href="http://imgur.com/2m44s" rel="nofollow"><img src="http://i.imgur.com/2m44s.png" alt="" title="Hosted by imgur.com"></a></p>
    <blockquote><p>In adding to this legacy, I am proud to announce that today marks another milestone as Adobe makes yet another type resource freely available by releasing the Source Sans Pro family as our first-ever open source type family.</p>
    <p>The brief &amp; development<br>
    The primary need for type in Adobe’s open source applications has thus far been for usage within user interfaces. A second environment of perennial interest to Adobe is the realm of text typography. Thus the immediate constraints on the design were to create a set of fonts that would be both legible in short UI labels, as well as being comfortable to read in longer passages of text on screen and in print. In thinking of typeface models that accomplish these tasks well, I was drawn to the forms of the American Type Founders’ gothics designed by Morris Fuller Benton. In particular, I have always been impressed by the forms of his News Gothic and Franklin Gothic, which have been staples for typographers since their introduction in the early twentieth century. While keeping these models in mind, I never sought to copy specific features from these types. Instead, I sought to achieve a similar visual simplicity by paring each glyph to it’s most essential form.</p></blockquote>
    <p><a href="http://blogs.adobe.com/typblography/2012/08/source-sans-pro.html" title="http://blogs.adobe.com/typblography/2012/08/source-sans-pro.html">http://blogs.adobe.com/typblography/2012/08/source-sans-pro.html</a></p>
