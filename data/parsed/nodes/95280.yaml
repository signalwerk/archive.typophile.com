      <p>@hrant. Ahhh i see. I remember your talk in Istanbul, and what you say now is the same as what i remember :) I have to agree with you, the local and the vernacular can so easilly get swept aside by the 'International Corporate'. This is why grass roots cultural diversity is so often a good thing, it usually breeds better alternatives to the 'a few models fit all' approach. It's tricky though, for example, the face in your example, i don't see as particularly 'faceless', even though i guess it's maybe meant to be.</p>
      <p>Re - the terminology of 'libre', 'gratis', 'free' etc. The key to all this is licensing, it is not about how much money is paid/not paid.<br>
      'Libre' is a term used more and more because it helpfully underlines the 'freedom' of 'free software', that unfortunately 'FREE' in English fails to do :)  because 'free software' sounds only about not paying for it. Other languages usually don't have this confusion, trust the English language to equate 'freedom' with 'not paying'.</p>
      <p>So... one major point of Libre / Free software is that it's licensing ensures that it is non-proprietary, it can never be sole property, it can 'belong' to anyone who uses it, and anyone who uses it also has the freedom to alter it, add to it, share it, etc. Of course in order to be fully free to be altered, added to, shared etc the software must also be freely available in it's source form. So with fonts - a compiled truetype font, with machine level hinting code, quadratic curves and OpenType tables etc etc etc does not enable the user the full freedom to alter the original design and function of the font. To give full freedom to the user, the user also needs the original source files that the truetype font was compiled from.</p>
      <p>'Open Source' is a technical approach to this scenario, literally meaning that the source code of software should be open. However, there's a philosophical difference here, as there are other reasons for opening up source code. Some people open their source code because they believe that software should be totally free (as in Libre) and that only free software allows people control over software (instead of giving software corporations control over people), but others do it for far more 'technical' and less 'ideological' reasons.</p>
      <p>I'm guessing Adobe is in the latter camp, and that their reasons for releasing Source Sans under a free software license is technical rather than ideological.</p>
