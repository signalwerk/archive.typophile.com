      <p>I addressed this issue some time ago, with regards to the practice of bundling, but it’s a horse I don’t beat any more. </p>
      <p>Chris Anderson’s thinking on the nature of “Free” in the digital realm (<em>Wired</em>, 2008) was very useful in helping me get my head around it. </p>
      <p>As far as this new Adobe face goes, I don’t see it as competition to the kind of design work I do.<br>
      Paul Hunt has designed some interesting faces in the past, but here he has put that on hold while working for the Man. Actually, no man at all, compared to Richard Kegler, which might have something to do with it.</p>
      <p>My philosophy, which ironically used to be Adobe’s, is that the best product development strategy is to out-innovate the competition.</p>
      <p>Therefore, while “Free” may be able to outprice the competition, there is more to marketing than price alone. The holy trinity has always been Price, Quality and Delivery; and design is a quality that will continue to command a premium of some kind, over what is free, even in the digital era. Anderson has gone somewhat <em>volte face</em> on this:<br>
      <a href="http://nymag.com/daily/intel/2010/08/chris_anderson_contradicts_him.html" title="http://nymag.com/daily/intel/2010/08/chris_anderson_contradicts_him.html">http://nymag.com/daily/intel/2010/08/chris_anderson_contradicts_him.html</a></p>
