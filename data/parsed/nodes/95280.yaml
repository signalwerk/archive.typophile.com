      <p>If this is an open source font, as the name suggests, where are the source files to be able to modify the fonts, add elements missing at the moment (like smallcaps, or other alphabets). Of course OTF files can be opened and edited in fontlab, but as I understood it, this can sometimes have adverse effects on things like hinting. Have I misunderstood something here?</p>
      <p>It is interesting that both Google (Open Sans) and Adobe (Source Sans) have both decided to develop a multi-lingual generic sans, with some very simular features, like seperate styles for /a/, /g/ and /l/.<br>
      Surely the type world is small enough to know what the other is doing at moment, so why no collaboration?</p>
      <p>By the way, the use of stylistic sets for several characters, like the /a/ seems to be a bit of strange tactic; of course designers want all their bases covered (you want single story /g/? we got it!), but are these are design decisions, IMHO, and these should be made by the type designer. My idea is that a type designer has an idea about where to take the typeface, including individual character shapes. </p>
      <p>but maybe I am being romantic...?</p>
