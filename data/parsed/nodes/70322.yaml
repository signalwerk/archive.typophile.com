    <p>Hi, </p>
    <p>I know absolutely nothing about typography, so please excuse this question if it sounds very naive. </p>
    <p>I work for a large international charity, with offices and projects in about 80 countries. </p>
    <p>Although our name and brand is well known, and we have an agreed colour and font for our logo, we have never given much thought to having a coherent style for publications beyond the logo. Consequently, the publications we produce in different countries look very different in terms of colours, lay-out and font. </p>
    <p>In order to save money and create coherence, we want to start looking into whether it's possible to create a global style guide that could be used everywhere we work. But there have been many questions already about whether it is possible to find fonts that are appropriate for use around the world. Some feel that fonts are so culturally specific that it would be impossible for us to find something that appeals everywhere. </p>
    <p>There must already be reams of research into this, since it must be a problem faced by every organisation working across borders. If anyone could direct me to useful information on this question, I would be most grateful. </p>
    <p>Lucy</p>
