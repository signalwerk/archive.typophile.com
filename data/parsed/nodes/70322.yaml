      <p>I work internationally with many charities and my job is communications, so I've been interested to look through the branding guidelines of a couple of the major INGOs, and several  international companies too. Without exception they specify that for consistency certain fonts must be licensed, what Pantone colours are required and what page layouts are acceptable.</p>
      <p>In my experience it's generally the head office that licences the fonts and makes an effort to keep everything consistent. People on the ground have different concerns than sticking to brand guidelines and I've seen some true crap even from the well-known organisations. So by all means go ahead with consistency but you'll end up having to produce most of everything at head office to be sure.</p>
      <p>I would say fonts are not totally culture-specific...a humanist sans is always friendlier than a realist monoline. However, there are fonts that are very much fashionable in one place rather than another. If you can separate a font's inherent appeal from the cultural associations you may have, I think it's possible to find one that speaks to everyone (presuming it supports the languages you need!)</p>
