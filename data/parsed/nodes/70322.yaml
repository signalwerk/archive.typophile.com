      <p>I would say you have two choices, other than the present ad hoc anarcho-collectivism, which is not really tenable, if for no other reason than the fact that people travel, and it weakens your brand to be all over the place, all over the place.</p>
      <p>Firstly, pick a "free" corporate typeface that has a lot of international language support, such as Gentium, and standardize on that.</p>
      <p>Secondly, implement a corporate standard that specifies type genre, rather than dictating specific typefaces. That can still be quite specific about typographic style, eg. font weight, size, x-height and leading, and whether the typeface is humanist sans, geometric sans, oldstyle serif or modern serif.</p>
