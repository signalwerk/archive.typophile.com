      <p>I was guessing 3 or 4 fonts at $25 to $35 each for a five user license. Of course they may need more fonts, or less, supplementing system fonts and free stuff. It's hard to know for sure, but perhaps understanding the costs and setting a per country font budget might be a good start.  </p>
      <p>But it sounds as if this is less about money and more about coherence. On that front the answer is probably "it depends" mostly on the trade-off between in-country perception, and the need/desire to have a global brand.</p>
