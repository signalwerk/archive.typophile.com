      <p>The other thing is to do with how you'd like to produce consistent comms. If the country offices are using MS Word you'll have an uphill battle even just trying to keep to one font because when people cut and paste, the formatting <cite>always</cite> goes awry, especially when tables, page breaks, headers or bullets are involved.</p>
      <p>If on the other hand your comms are designed by in-country comms teams or design agencies, they'll be using something like InDesign and you can specify everything down to hyphenation and justification.</p>
