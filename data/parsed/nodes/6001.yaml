    html: <p>&gt;But I still don't understand what you mean by "chirographic"&lt; <br> <br>Chirographic is like Caligraphic (more flat pen than pointed pen though).  Broad nibbed pens were held at a constant angle (usually 30 or 45 degrees depending on the style). When a stroke was made--the "O" is the best example--the narrowest part of the stroke was off center of the vertical (to the left on the top and to the right on the bottom) causing a slight appearance of axis rotation (see Palatino).  Garamond has the off vertical axis but it looks more "Typographic" than Palatino, which looks more "Chirographic". Zapf had a very strong calligraphy background.  When he lectured to my sophomore year typography class, he would write quite beautiful Roman letters on a blackboard using the side of a piece of chalk held at an angle like a flat-pen. <br>What used to be called "Modern" type faces, like Bodoni, had the axis of the thinest part of the stroke at the vertical.  Today the term "Modern" can be confusing.  The term "Modernism" refered to by Hrant is certainly different.  Ask him, but I think he is refering to the 1950-60s era and to fonts like Helvetica. <br> <br>Another difference is in proportions. The classic Roman proportions were prominant in older letterforms where the "Modern" proportions try to give the illusion of most letters (not M, W, l, or i) being visually equal in width.  The terms "appear" and "visually equal" are quite important since almost no glyphs from even "Modern" fonts are actually equal in width. <br> <br>ChrisL</p>
    html_clean: <p>&gt;But I still don't understand what you mean by "chirographic"&lt; <br> <br>Chirographic is like Caligraphic (more flat pen than pointed pen though).  Broad nibbed pens were held at a constant angle (usually 30 or 45 degrees depending on the style). When a stroke was made--the "O" is the best example--the narrowest part of the stroke was off center of the vertical (to the left on the top and to the right on the bottom) causing a slight appearance of axis rotation (see Palatino).  Garamond has the off vertical axis but it looks more "Typographic" than Palatino, which looks more "Chirographic". Zapf had a very strong calligraphy background.  When he lectured to my sophomore year typography class, he would write quite beautiful Roman letters on a blackboard using the side of a piece of chalk held at an angle like a flat-pen. <br>What used to be called "Modern" type faces, like Bodoni, had the axis of the thinest part of the stroke at the vertical.  Today the term "Modern" can be confusing.  The term "Modernism" refered to by Hrant is certainly different.  Ask him, but I think he is refering to the 1950-60s era and to fonts like Helvetica. <br> <br>Another difference is in proportions. The classic Roman proportions were prominant in older letterforms where the "Modern" proportions try to give the illusion of most letters (not M, W, l, or i) being visually equal in width.  The terms "appear" and "visually equal" are quite important since almost no glyphs from even "Modern" fonts are actually equal in width. <br> <br>ChrisL</p>
  - id: 42468
