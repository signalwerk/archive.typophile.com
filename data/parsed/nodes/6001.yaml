    html: '<p>an English Translation.. <br> <br>Often you have wondered why a type that has the resistance of a text typography and its sober structure does not work well? <br>A variable exists that is not seen, but that it is very, but very important:  the counterform.  <br> <br>The "fish effect" happens when the counterform commits of the round types is excessively greater compared to external (space between characters).  This happens in the types that respond to geometric proportions of the type rather that to the optical proportions. <br> <br>The "fish effect" is a disagreeable effect that causes that the words are longer (space) that what the brain would have to catch, translating this in sensations of early satiety of reading and precocious boredom.  Perhaps, when we see the typography in great we did not notice the great differences between the counterforms, but when we began to drain these, the perceptual difference begins to grow radically, and the points more and more begin to be heavy that the lines. <br> <br>In typeworkshops of underware they are explained some passages like avoiding the fish effect, occupying technical of optimization of the proportion.  <br> <br>They have felt that passes something similar when they read futura?  Any doubt or commentary, the debate begins:</p>'
