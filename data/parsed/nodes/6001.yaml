    html: "<p>I think anybody would agree that the White (better than \"counterform\", for a number of reasons) is important. Balancing the weights of the white and black in a bouma is critical to reading - but there's also something else: the whites can be too modular. In fact, when they follow the black perfectly, <i>and</i> the black is too modular, then you get a huge loss of differentiation, and readability falls through the floor (since information comes from contrast). Set the word \"tobacco\" in Avant Garde and see what I mean. <br> <br>But this is not limited to highly constructed fonts, like AG or Futura. In more covert way, chirographic fonts suffer from the same problem: because the two edges of the black are made harmonious, the white effectively follows the black. <br> <br>That's why Legato is such a hugely important development: it breaks the anti-readability codependence. <br> <br>hhp <br></p>"
    html_clean: "<p>I think anybody would agree that the White (better than \"counterform\", for a number of reasons) is important. Balancing the weights of the white and black in a bouma is critical to reading - but there's also something else: the whites can be too modular. In fact, when they follow the black perfectly, <i>and</i> the black is too modular, then you get a huge loss of differentiation, and readability falls through the floor (since information comes from contrast). Set the word \"tobacco\" in Avant Garde and see what I mean. <br> <br>But this is not limited to highly constructed fonts, like AG or Futura. In more covert way, chirographic fonts suffer from the same problem: because the two edges of the black are made harmonious, the white effectively follows the black. <br> <br>That's why Legato is such a hugely important development: it breaks the anti-readability codependence. <br> <br>hhp <br></p>"
