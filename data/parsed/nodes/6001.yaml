    html: "<p>I'm not the doyen of the term or anything (for one thing, I got it directly from John Hudson), but to me \"chirographic\" isn't necessarily related to the broad nib pen - it can be based on the ballpoint pen just as well - the important thing is the organic/physical_tool participation. And the reasons to differentiate it from \"calligraphy\" are that: the idea of \"beauty\" is not a requirement; and the term \"calligraphy\" has too much baggage, like the stuff people see on dipomas, etc. As an example, many of Zapf's fonts are calligraphic, while Gerrit Noordzij's are not, but they're still strongly chirographic. That's why GN bags on Zapf for producing artsy stuff only fit for hanging on a wall, while I think they're both just playing at different ends of the same sandbox. And Licko and Crouwel are playing on the other end of the same playground (Modernism). The real world is outside. <br> <br>As for \"Modernism\", I have a pretty unorthodox meaning for it. For one thing, I see the Ancient Romans as having planted the seed, and the Enlightenment as having made it acceptable, and the 20th century is merely when it entered the mainstream in a formal manner. I don't feel too guilty using a somewhat \"custom\" meaning since -as you imply- the term is heavily overloaded anyway. <br> <br>hhp <br></p>"
