    html: "<p>Claudio, although no design exists in a vacuum, I think you're seeing things maybe you <i>want</i> to see. Legato is based on a pretty progressive theory more than anything else - it's a constructed font* that aims to create bonding between glyphs, essentially by breaking the dominance of the Black. <br> <br>* This is in fact it's only -but important- weakness. Bloemsma needs to break free of Modernism to get to the pinnacle. In this respect Bilak is on a better track. <br> <br>Chirography: I don't know about giving examples (since almost all fonts have both chirography and typography in them), but I guess the best way to define it is that it exhibits the effects of wrtiting by hand, especially using a broad-nib pen. Jan Middendorp apparently sees chirography in Legato, but as far as I'm concerned it's an illusion: using stroke contrast as a feature is one thing, deriving it from the way a broad nib pen makes marks is another. <br> <br>hhp <br></p>"
    html_clean: "<p>Claudio, although no design exists in a vacuum, I think you're seeing things maybe you <i>want</i> to see. Legato is based on a pretty progressive theory more than anything else - it's a constructed font* that aims to create bonding between glyphs, essentially by breaking the dominance of the Black. <br> <br>* This is in fact it's only -but important- weakness. Bloemsma needs to break free of Modernism to get to the pinnacle. In this respect Bilak is on a better track. <br> <br>Chirography: I don't know about giving examples (since almost all fonts have both chirography and typography in them), but I guess the best way to define it is that it exhibits the effects of wrtiting by hand, especially using a broad-nib pen. Jan Middendorp apparently sees chirography in Legato, but as far as I'm concerned it's an illusion: using stroke contrast as a feature is one thing, deriving it from the way a broad nib pen makes marks is another. <br> <br>hhp <br></p>"
