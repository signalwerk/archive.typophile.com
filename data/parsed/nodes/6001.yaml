    html: <p>Part of the problem is when you have fonts with nearly circular "o" glyphs like your example.  The circle is very hard to escape; it has a bullseye effect.  This stops the reading rythym abruptly.  When you put it next to a bunch of tightly spaced verticals, you get a dark spot, particularly if there are lots of acenders (like "illi".  Even if you letterspace a lot, the "o"s still grab your attention.</p>
