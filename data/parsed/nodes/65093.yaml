    <p>I have fonts in WNF and VEF format which came with cutting program.  Now I have a new cutter and want to use these fonts, but they need to be in TTF format.  Seems to be many websites with software to do this, but I'd like your expert opinion on what is safe to download.  I've had experience with downloading software which, in the end, installed viruses on my computer.<br>
    Goldie</p>
