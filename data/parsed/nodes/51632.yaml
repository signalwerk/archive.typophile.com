    html: |-
      <p>What software?</p>
      <p>Some alternate forms can not be 'typed' in, and can only be accessed by software that uses OpenType (ligatures, either common or discretionary; old style figures), and then sometimes only with a manual override -- the ornaments hidden under bullets in some fonts, for example.</p>
      <p>Adobe InDesign and Illustrator have no problems with these features.</p>
