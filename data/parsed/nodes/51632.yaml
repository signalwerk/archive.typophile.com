    <p>Hey guys!</p>
    <p>I'm playing around with Geronto Bis <a class="freelinking external" href="http://www.smeltery.net/fonts/geronto-bis" rel="nofollow">http://www.smeltery.net/fonts/geronto-bis</a> and I was wondering if anyone knew how to access the ornaments? I can't seem to find them with any key combination; although they appear when I preview the whole repertoire in Fontbook.</p>
    <p>Thanks!</p>
  html_clean: |-
