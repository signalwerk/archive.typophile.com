      <p>hhp -- I keep forgetting you don't seem to use type. </p>
      <p>Let's see. First thing to note is that all the OT features just remove handwork in a layout program, so we can skip all them. Now, I can condense, expand, embolden, and change the fit of type in a Layout program. The unit of measurement in InDesign is essentially the same magnitude as for FontLab.</p>
      <p>As long as we're not talking about changing parts of a letter, or creating a new letter that is treated as a *character* rather than an *image*, what can you do with a Font editor (someone) can't do with a layout program?</p>
      <p>* * *</p>
      <p>By the way, Fontographer's embolding routines have some problems, too. Consider the KLTF Gylph tweaker as another useful tool.</p>
