      <p>I'm a little confused. I'd take "font implementation" to be, essentially, concerned with using type rather than creating font software. That means a layout program, and these days,  except for modifying parts of letters, layout programs can do most of the things font editors can do. It's all software.</p>
      <p>But if you are ever so gradually going to start working on the type itself -- even if, like me, your only interest is in using type, I can offer one thought: Where ever you start, you're going to change your mind. Accept you'll waste some time and money. The freeing part of that thought is that whatever decisions you make won't be bad mistakes.</p>
      <p>As for specifics, more details would help. What platform are you using? What kinds of things are you interested in? Drawing suggests letter creation. So, you want to move from the computer-equivalent of "hand lettering" to "font creation" -- For your own use in a particular area, or to make fonts that can be used on a lot of different platforms, with lots of different programs, for lots of different purposes?</p>
      <p>Anything that would help cut down that rather large universe would get better answers.</p>
