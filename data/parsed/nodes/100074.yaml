      <p>John, I'll defer to you on this, though part of your explanation is a bit problematic for me. In my mind, the real advantage working with modern documents -- with, say, OpenType and a layout engine such as InDesign -- is that the object-attribute structure pretty much lets you preserve the text stream while you do other work.</p>
      <p>I think of it like a multi-track tape recorder, where the "attribute tracks" need not be a part of the objects, i.e., the basic text. </p>
      <p>Trivially, for setting text, one kind of attribute applied to a text does not block another. You can manually apply a baseline shift without blocking programmatic kerning. In the old days, even with a complex layout program like TeX, changing the character position required entering the instruction in the file, and the presence of that command blocked anything but an explicit kern also entered in the file.</p>
      <p>Off the top of my head, I can't think of how entering a command in InDesign breaks the text stream, save in the (perhaps) trivial sense that it might later have to be ignored, as with a character style who's only purpose was to work around the defect in a font.</p>
      <p>Still, given today's presentation of documents, we're not really where we need to be yet. A non-essential instruction can also help by signalling that further work may be needed -- for example, if you want real small caps in an EPUB ebook, you need a separate font where the encoding reminds one of the ticks used with the old PostScript Type 1. (And then stops working as intended when the reader changes fonts.)</p>
      <p>As for the document itself, things do happen. If you rely on XML encoding,  the programming capabilities of XLST make many different uses possible. But another kind of document, the PDF, is still often used for further products of typeset files, and that does bring in a host of issues.</p>
      <p>Such things really do lie outside my area of expertise, so again, I'll defer to you on this.</p>
