      <p>Charles, I was specifically responding to your comment about OpenType Layout features, so not including a great manner of operations in a program like InDesign, such as you describe, that do not require glyph substitution or reordering operations. The way you put it was 'all the OT features just remove handwork in a layout program', and my point is that they do rather more than this, because handwork options to achieve the same typographic results will tend to involve messing with the text. Consider the old Type 1 'expert set' approach to ligatures and smallcaps. And while something like the InDesign glyph pallette enables you to input glyph variants other than via OTL features, it remains dependent on those features to know how to map those glyphs back to correct underlying character codes in the text string; in the absence of a path via the OTL features, InDesign will insert a raw glyph ID, with no character mapping, and hence you will have messed up the text.</p>
      <p><em>Still, given today's presentation of documents, we're not really where we need to be yet.</em></p>
      <p>Very true.</p>
