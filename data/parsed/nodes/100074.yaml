    <p>I'm fairly new to font implementation and I was wondering what Font Editors others use? I've tried High Logic Font Creator and Fontographer.</p>
    <p>If anyone would like to share tips regarding their pipelines I'd much appreciate.</p>
    <p>I normally start in vector graphics package (draw shapes). Recently the fantastic iFontMaker came to my attention but I couldn't get it on Android and it made me sad, even though from an experienced typographer's view it may seem like a layman's tool.</p>
