      <p>Charles: <em>First thing to note is that all the OT features just remove handwork in a layout program, so we can skip all them.</em></p>
      <p>This is a probematic statement, which is not to say that there is not a sense in which it is true. In a sufficiently advanced page layout program such as InDesign, it is possible to achieve the same visual results via 'handwork' as with OpenType Layout features. This is true even of layout for complex scripts -- employing, in essence, a metal type composition paradigm --, although the handwork involved will involve breaking the text in various ways. And this is one of the ways in which the statement is problematic, because visual results are not the only criteria by which digital text layout needs to be evaluated. Even if the principal target is print, the same text may be subjected to live editing, platform interchange, electronic publishing, digital archiving, and other workflows in which <em>content</em>, rather than display, is of primary importance. The real benefit of OpenType Layout isn't that it removes the need for handwork, but that it enables glyph-level display handling independent of character encoding, and handwork models have mostly degraded that independence, usually to the cost of clean character encoding.</p>
    html_clean: |-
