      <p>OK, I see it now. BTW (really hijacking the thread), I'd forgotten this because all through the Type 1 Postscript days, we set type using TeX, and ligaturing was a property of the AFM. The text stream was undisturbed. In some fonts, I had gg, gy, ggy, etc. ligatures, all hooked up through the AFM. Being able to write whatever encoding vector you needed got around a lot of lies in the underlying text, just let the font do the work. Even the Greek characters had the correct name, you just had to write a custom encoding vector. </p>
      <p>We left CJK alone until Unicode; my business partner wrote a complicated routine that let us map everything, even with the 8-bit fonts of the time. The character names were the Unicode number, so again, the text stream was correct.</p>
      <p>Oddly enough, one of the worst problems was the wordspace, which is not a character in TeX.</p>
      <p>* * *</p>
      <p>To the Original Poster, sorry for the side trip, the offer of advice still stands, particularly if you could tell us more... </p>
      <p>Absent that, the program FontLab will work &amp; in some ways is simpler (one program bundles most everything you need), but it is expensive. There are open source programs which obviously are cheaper -- and for some things better -- but usually there is also more to learn.</p>
