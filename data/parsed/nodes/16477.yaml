    html: |-
      <p>FL supports the development of OpenType fonts (without using an external compiler) and Fog does not. FL is the 777 to Fog’s Sopwith Camel. You can’t fly a 777 through a barn, but you can’t carry 500 passengers in a Camel.</p>
      <p>Yes, the drawing environments are different, in much the same way that Illustrator and FreeHand’s drawing environments are different. Which one’s better? The depends upon which one you like use best. </p>
      <p>Personally, I was delighted to make the wholesale switch to FontLab in 2002, and I haven’t looked back since. I have had the chance to poke around with FogX, and was amused by the anachronism: made me want to thrown on some neon legwarmers and fire up the Flashdance soundtrack.</p>
      <p>All of which to say: If you’re a devoted FogHat, you’ll be delighted to have the application ported and tweaked for use on OS X. If you’ve made the switch to FontLab and are happy with it, you probably won’t find a reason to switch back to Fontographer.</p>
