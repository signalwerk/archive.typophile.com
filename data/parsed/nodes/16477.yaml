    <p>Give it up for those crazy kids at Fontlab. Yes, believe it or don’t - Fontographer 4.7 for Mac OS X is now available. Here’s a short list of the fixes and features of this release:</p>
    <p>* Native support for Mac OS X,<br>
    * Support for the Euro character<br>
    * Updated encodings<br>
    * Copy-paste compatibility with new Illustrator and Freehand versions<br>
    * Numerous bug fixes</p>
    <p>Huzzah.</p>
    <p><a href="https://web.archive.org/web/20080719172654/http://www.fontlab.com/Font-tools/Fontographer/" title="http://www.fontlab.com/Font-tools/Fontographer/">http://www.fontlab.com/Font-tools/Fontographer/</a></p>
