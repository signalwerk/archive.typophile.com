      <p><a href="https://web.archive.org/web/20080719172654/http://www.fontlab.com/Font-tools/Product-Comparison-Chart/" title="http://www.fontlab.com/Font-tools/Product-Comparison-Chart/">http://www.fontlab.com/Font-tools/Product-Comparison-Chart/</a></p>
      <p>;) this is interesting: “Undo” is N/A in Fog now. </p>
      <p>I’ve only used FL since spring (after 16 yrs or Fog), drawing 30 or so fonts in that time. Here is a top list of things Fog Does Better in the LETTER DRAWING phase of type design:</p>
      <p>1. End points connect like they know they are supposed to in Fog. In FL, they need to be no farther apart than the thickness of a flea’s pubic hair in order to get the points (connected).<br>
      2. FL bolding adds, sometimes dozens of, unwanted points. Fog = 0.<br>
      3. FL interpolation is practically useless for the same reason as #2, i.e. it does not understand matching points, the cleanup is more work that manual<br>
      Interpolation.<br>
      4. Fog is smart enough to know that when you have the pen tool, and you click on a contour, it should add a point to the contour, (you can draw all day long with Fogs pen without EVER changing tools). FL = special tool for the same simple function, change tool, change tool, change tool.<br>
      5. Fog’s metrics window knew that the baseline was not ness., in fact it’s a distraction to good spacing. FL Lets you know exactly where the baseline is in the metrics window whether you like it or not.<br>
      6. type an unoccupied character in Fog, it shows up blank. FL crashes 50% of the time, and otherwise misbehaves when you type the as yet defined.<br>
      7. Fog = Correct path direction. FL = Reverse all contours. The former just works, the latter, I don’t even know why they bother unless you’re supposed to delete every contour that is correct, “Reverse all contours” to correct the contour(s) that are wrong.<br>
      8. 15% of all zooms in FL’s glyph window fly to a minuscule and uneditable 12 point. Fog = 0% of all zooms are correct.<br>
      9. FL is seriously deranged about the differences between “copy”, “delete”, and “merge”. Fog’s got it 100% right. (In FL, I still have not figured out how to select more than one point and merge the contour around it...)<br>
      10. Fog has a tiny number of icons for all the tools you need, and every single one is useful every day. FL is Totally Nuts about tools and icons. </p>
      <p>Things on the other side of the ledger:<br>
      1. FL is pretty. Fog is not.<br>
      2. FL goes on, Fog does not.<br>
      :-)</p>
