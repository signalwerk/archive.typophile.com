  html: "<p> after going through the Lopez link bj just provided I hoped onto some search engines, in search of his name associated to Caslon anywhere else, didn't see it, but.   <br> <br>I find it hilarious how many people claim to have designed 'Caslon', not mentioning its a variation: <br> <br>Adobe/Afga Caslon yet normally referred to as Adobe Caslon (so that's ok) <br>Bitstream's Caslon <br>Lopez and his Calson <br>Paratype's Calson <br>EFF Caslon <br>Omnibus Typografi's Calson <br>of course William Caslon's Caslon <br> <br>I'm sure the list goes on <br> <br>of course this isin't to mention the weights, and alternates each has within their own families <br> <br>Perhaps there should be a category for the classics now in classification, listed by designer and year they were altered. I now have absolutely no idea who did Caslon 540, thought I thought it was an Adobe. <br> <br>anyone have another example of this happening to other classics? </p>"
