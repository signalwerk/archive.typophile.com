    html: "<p>Actually, Tanya, a surname is generally not entitled to trademark status unless it acquires \"secondary meaning\" [specific legal term] through long and widespread use. One could argue that Caslon and Garamond have, in fact, acquired secondary meaning by now. In which case the right to the trademark would go to the party who could show first use.  <br> <br>William and Claude, of course, never called their types Caslon and Garamond. They simply made them. And others would refer to them by maker and size as Caslon's <i>long primer</i> or Garamond's <i>gros romain</i>. I think that the practice of naming specific designs began in the mid- to late-1800s with the American foundries, about the same time as point-based sizes were instituted. I believe that in both cases (Caslon and Garamond), the first use would probably be ATF (or one of the foundries that they absorbed).  <br> <br>Since ATF is now defunct and its assets completely dispersed, I believe that any claim to trademark in the simple names \"Caslon\" or \"Garamond\" could be declared \"abandoned\" -- which would be the trademark equivalent of public domain. However, a unique derivation like \"Adobe Caslon\" or \"ITC Garamond\" is considered a trademarkable name (although I confess I'm not totally clear on the intricacies of why), and so you'll find that the appropriate foundries have registered these. <br> <br>I'm not familiar with the Democratika incident you refer to, but that sounds like a whole different matter, since Democratika is a distinctive mark and perfectly trademarkable. <br> <br>Incidentally, if William Caslon were alive today and sufficiently famous and someone else used his name for a font, he could conceivably sue to get them to change it -- not because he would own any trademark in the name, but because the use of his name might establish a fraudulent association and this would fall under §1125. (§43) of the Lanham Act. <br> <br>[Standard Disclaimer: I'm not an IP attorney; I just like to talk like one sometimes.] <br> <br>-- K.</p>"
