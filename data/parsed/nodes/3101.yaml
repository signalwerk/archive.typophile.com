    html: <p>Hrant, most of these same things can be said almost equally of Caslon. <br> <br>1. During the "Caslon revival" of the late 1800s, a few direct copies of Wm. Caslon's types were released in America without his name attached (cf. Laurence Johnson's <i>Old Style</i>, ca. 1860s). 2. <i>Caslon Antique</i> has nothing whatsoever to do with the original Caslons. 3. <i>Not Caslon</i> might be considered the epitome of one strain of the "grunge" style.* 4. Okay, so ITC didn't do an original caricature of Caslon; Benguiat just drew from earlier caricatures of Caslon (<i>ITC Caslon 224</i>). <br> <br>*[BTW, John Downer wrote an interesting overview of latterday Caslons in a piece for Emigre in conjunction with the release of <i>Not Caslon</i>.] <br> <br>One thing further complicating the identificaton of Caslon types is that, unlike with Claude Garamond, there was an entire "dynasty" of Caslons -- several of them even all named William. The foundry produced a wider variety of type over a greater period of time than Garamond, and so there is a broader range of designs that may lay claim to the name. <br> <br>The desire to attach an established and influential name to a new work -- whether in homage or to "borrow" credibility -- is nothing new. Bodoni and Jenson are a few others who, alongside Caslon and Garamond, lend their names to a number of designs -- some more-or-less authentic, some not at all so. <br> <br>BTW, Caslon No. 540 was first cut and released by the American Type Founders, circa 1890s. The Adobe type reference that I have even plainly acknowledges the ATF origins. <br> <br>-- K.</p>
