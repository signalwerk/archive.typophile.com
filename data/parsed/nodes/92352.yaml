    html: <p>They should be named according to what base character they represent. So in the most common situation where the small cap glyph is being substituted for "a", you should call it "a.smcp".</p>
  - id: 506619
    user_id: 5094
    user_name: charles ellertson
    user_path: null
    user_image: null
    date_raw: 22 Apr 2012 — 5:51am
    date: 2012-04-22T05:51:00
    votes: null
    html: |-
      <p>Here's the deal: For the document you're preparing, the use of small cps is a mater of style. It doesn't mater what you call them. But the *file* you're preparing may have other uses. And the possible PDF you're preparing may have the text extracted for other use. With a PDF, anything after the period can be lost. In that case, should the letter be upper or lower case? By having both A.sc and a.sc, everything is resolved.</p>
      <p>In spite of that, I tend to use A.sc only. I work in a fairly limited environment: books only. In that kind of work, when a style uses small capitals, replacement by a full cap is almost always  acceptable, though may not be preferable. Replacement by a lower case letter can be just wrong.</p>
      <p>It is not too much extra work to have both. Having both does use up some of the allowable 65,000 kerns possible...</p>
      <p>&amp; BTW, since there is a limit to the number of characters you can have as names for glyphs in a font, if you're planning a large number of glyphs, using "sc" instead of "smcp" saves a few...</p>
