    html: |-
      <p>Tim, that's exactly what we do if a client insists that text be searchable and extractable from PDFs that have been distilled from print streams (and hence rely on Acrobat parsing of glyph names to reconstruct text). </p>
      <p>We have other clients who don't care about this, and are happy to have only one set of smallcap glyphs, in which case I tend to call them something like /A.sc/ or in some older fonts /A.small/.</p>
      <p>And then we have one client who actively doesn't want to make fonts compatible with Acrobat in this way, like their TTFs to have format 3 post tables, which contain no glyph names.</p>
