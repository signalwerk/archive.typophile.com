    html: |-
      <p>My recommendation is the following: </p>
      <p>1. If you decide to duplicate the small caps glyphs, i.e. to have separate sets of identical small caps glyphs, one to work with the "smcp" feature and one to work with the "c2sc" feature, then I recommend naming the glyphs intended for "smcp" using lowercase names, i.e. "a.smcp", and the glyphs intended for "c2sc" using uppercase names i.e. "A.c2sc". This gives you a very clean distinction. </p>
      <p>2. If you decide to include just one set of small caps glyphs, the I think using uppercase names is better because those glyphs will resolve to all-uppercase text strings, and those are better than all-lowercase text strings (i.e. "I had an IBM machine an an OLIVETTI machine" is better than "I had an ibm machine and an olivetti machine"). In this case, I'd name the glyphs either "A.smcp" or "A.c2sc". In fact, these days I'm leaning towards "A.c2sc" as the generic name for small caps, because that makes standardizing glyph names easier. </p>
      <p>In other words, your basic set of small cap glyphs could be named "A.c2sc" etc., and, should you choose to include a duplicate set, that set could be named "a.smcp". </p>
      <p>I think this is the "cleanest" and most systematic solution.</p>
