      <p>Thanks for the useful responses so far!</p>
      <p>I would agree that any human practice embodies some sort of "theory," if by that we mean a network of values and assumptions about how that practice out to be done. I guess the argument (not mine, just whatever it was that I'd picked up) was framed more in terms of the "isms" and how they play out specific typeface designs-- most specifically, the developments of stroke-width variations and geometrical relationships under "rationalism" and the sort of counter-intuitive (in light of where we seem to be now) view of fraktur under "romanticism" (e.g, that the little nooks and crannies reflect something like organic growth and naturalism, rather than anything dark and "scary"). Nick's last post is especially eloquent and substantive as usual (not to knock the others, which are all helpful).</p>
      <p>Anyway, I knew this was the place for a reality check. Any more thoughts are more than welcome! Thanks.</p>
