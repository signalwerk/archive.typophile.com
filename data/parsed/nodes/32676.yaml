      <p>The mistake has been to confuse the Modern movement, a discete historical phenomenon of the 20th Century, with Modernism as a general occurrence. In Post-modern theory, Modernism is paradoxical, because it supposes a break with an organic, pre-modern past; the paradox is that whatever point in time one chooses, the break has already occurred, so the concept is infinitely expandable.</p>
      <p>Perhaps the most "rational" of visual theories is that of mathematical, linear perspective, attributed to Brunelleschi in the early 15th century, <em>before</em> the invention of moveable type.</p>
      <p>Nonehteless, the technology of moveable type was strongly deterministic, in many ways. For instance, empirically: it may be argued that the ability of type to represent words with greater clarity produced a more profound understanding of a page of text. Economically: the printer's reduction of alternate sorts and standardization of editorial proofing, served to create a more logical orthography. Metaphorically, the mechanical systematization of typography is extremely suggestive. And of course, the proliferation of books made possible societies which are almost completely literate, totalizing intellectual synergy.</p>
