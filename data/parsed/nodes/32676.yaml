      <p>Elizabeth Eisenstein and Adrian Johns might be of interest to you. They are a pair of book historian who spar academically over the whether the printing press was as a causal, revolutionary force in history (making possible, as you mentioned, critical type theory) or simply  part of a natural evolution. That's putting it crudely. Eisenstein's most popular book is called "The Printing Press as an Agent of Change."---I think she'd be making the argument to which you refer.</p>
      <p>It's an interesting argument. I would say that manuscript-era "theories" existed but in more nuanced, non "ism" form. Certainly visual ideals existed, as plainly as pleasure did---why else illuminate? Why use the golden ratio? I could hardly think that it was because of any official demand.</p>
