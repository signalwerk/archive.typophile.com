      <p>G. Noordzij in 'The Stroke' argues that changes in writing drove changes in type styles, at least through the early 19th century. And a number of people have pointed out that a lot of new types of the 19th century, including slab serifs and sans were developed first by sign painters. So I doubt that you will win type historians to your point of view as far as letter styles go. </p>
      <p>I'm sure that punch cutting instead of writing, and designing a fixed shape alphabet in metal also had big effect on actual execution, and was responsible for key innovations. But as far as it being the dominant driving force in changes in style, I don't think that will fly.</p>
