    <p>Hi experts,</p>
    <p>I am not one, so I'd like to ask your advice on a logo that I have been designing for a company named Media &amp; Software Studio</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gen-3-Brand-1-4_03_5496.png"></div><p></p>
    <p>Please let me know what you think with particular regard to the following:<br>
    1. Have I chosen a good base font to play with?<br>
    2. Are the two s's legible????<br>
    3. What can I do to make them more like s's without losing the simple elegance of the design?<br>
    4. Have I treated the shapes correctly? I mean I see that the horizontal strokes are a tiny bit narrower than the verticals? Have I kept this consistent enough in the two s's?<br>
    5. Is the second s joined appropriately? or is there a better way to make it flow/read correctly?</p>
    <p>I know I've asked a lot, but I'm a real novice and would appreciate any tips that come my way. </p>
    <p>Thanks very much</p>
