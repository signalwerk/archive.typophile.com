      <p>I don't think you need the &amp;.  Try some variations without it.  </p>
      <p>Your second version has the right idea, but needs some clean up.  Try the upward stroke on the left of the s as a straight diagonal line as opposed to the bit of curvature it has now.  Then, I'd have the right, downward stroke curve outward right away, instead of the little hook.</p>
      <p>Also, try an 'm' without the top left vertical section, just a straight curve.  It might match the sensibility of the 's's better.</p>
      <p>And not that we're focused on the other parts of the logo yet, but you should play around with other typefaces for the formal name, as well as lockups.  The two styles aren't meshing well.</p>
    html_clean: |-
