      <p>I once had a designer use a glyph, capital D, from one of my fonts, as a corporate logo.<br>
      I was fine with that, but pointed out that the client wouldn’t be able to copyright or trademark their own logo. The same holds true for ornaments/dinbats, I would imagine.</p>
