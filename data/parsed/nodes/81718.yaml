    html: |-
      <p>How dry transfer lettering is manufactured (serigraphy) is not the printing medium.<br>
      The typography was done by rubbing onto paper.<br>
      Sure, it was then photographed for film assembly, but that wasn't typography either, and type imaged by any medium (e.g. letterpress) was also photographed for film assembly.</p>
      <p>Similarly, it could be argued that a slightly earlier method (1930s) of typesetting is also a unique category—I refer to the assembly of letters pre-printed on transparent adhesive film. This product was still available in the 1980s, but I forget its name. One used a scalpel blade to cut a single "b" (for instance) from a group of b's on their backing sheet, peel it off, and position it on the knock-out blue baseline one had drawn on the artboard.</p>
