      <p>It obviously gets somehow confused with Zapf Dingbats. </p>
      <p>You could try a different text encoding method, that might help. Also, would it be possible to turn off or temporarely remove Dingbats to see if it makes any difference?</p>
      <p>I had problems with Arial sometimes with Suitcase, and turning fonts on and off and testing to see which combination works helped.</p>
