    html: <p>The way I learned Beziers, was to set myself a small project...that's just cause I just never seem to sit on my desk with a book and follow instructions. Instead I downloaded a cartoon still--Stimpy--off the wed and drew over it in Illustrator. Btw. cartoons work best bec. they temd to have a lot of flat colour.  <br> <br>It only took about an hour and it really helped me to figure illustrator out for myself. Plus Stimpy freaking ROCKS.</p>
