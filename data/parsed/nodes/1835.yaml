    html: <p>I was having a hard time getting the hang of the bezier--especially the click and drag. Then, I came upon a section in my Sam's 24-hour book on Illustrator that dealt with this with a couple of exercises. By golly, I had an aha! moment! I can do beziers!--and with more practice, I'll be able to do them well. <br> <br>Theresa</p>
