    html: <p>Bob, thank you for the suggestions. My regular pro photography dealer (right in Southie, I'm sure you can imagine which place I mean) recommended that I download the Realviz app as the most easy and intuitive, which I did a couple of days ago for $120. Now that I've gone for a sniff at the Arcsoft site, PanoramaMaker looks to have a far simpler interface and it only costs $40! So much for easy and intuitive . . . Unfortunately, no tryout version of PanoramaMaker for Mac. I have p*ssed away so much time already struggling with Realviz, I may just buy the Arcsoft on faith, or jump into the CS3 beta (i'm on CS2 at the moment). First I have to go and reshoot my panorama (I'm doing all this for a single image, of one room interior, to put as a quicktime vr on a client's web site) with a more accurately-placed nodal point and with more image overlap. Should be pretty simple to do, though. Thanks again for the tip.</p>
