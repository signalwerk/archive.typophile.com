      <p>@#$%^&amp;*@#$%^&amp;*!!!!!!</p>
      <p>I went to the Adobe Lab site, and was poised to press the "download all 685 megabytes" button when I saw sys 10.4.8. Oh, bother. Never wanting to be on the bleeding edge of technology, I don't upgrade everything very often* and at the moment am still on 10.3.9. So no go on that scheme, I guess.</p>
      <p>Bruce</p>
      <p>*Here's an example: Apart from easy generation of PDFs in Quark 6.5, for the book work I need to do I'd still be plenty happy with 3.32r5. The disruption of an upgrade and having to learn to navigate around all the new "features" that I don't need always causes me no end of trouble, plus the domino effect that once you upgrade one thing, then it forces you to do a bunch more in related utilities and applications. (Grrr, I must have taken an extra curmudgeon pill with supper.)</p>
