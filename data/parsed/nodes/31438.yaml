      <p>I got ArcSoft's PhotoStudio when I bought my Canon last year and was definitely not impressed with it -- having used some of their clip art collections in the past, I wouldn't call their interfaces "easy and intuitive" either, despite what it looks like on their website....</p>
      <p>But when I got my camera, it came with a built-in stitcher that works just great -- I've only done one large panorama with it, but the only problem with it was the creature clicking the shutter.  :-)</p>
