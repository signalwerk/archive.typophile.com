    <p>This is off one of a series of industrial information posters from the communist era in Hungary that I bought in Budapest a few years ago. (The other posters have different typefaces, ranging from Gill Sans to Helvetica and a few more more-or-less interesting ones I can't identify, might post them later if there's interest.) The text reads: "do not touch the oxygen flasks with oily greasy hands". Design in Hungary was good but tended to change less with the times, therefore the very wide time range.</p>
    <p>I've photographed, cropped, cleaned up and tried to straighten this as best I could, though it's still a bit warped. Whatthefont turns up nothing. Any ideas? Some of the letterforms are slightly awkward (especially the g) but overall I like it a lot.</p>
