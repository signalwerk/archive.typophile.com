      <p>In principle, justification without hyphenation shouldn't be allowed ;-)<br>
      In the specific case, the setting and the content don't seem to create especially jarring gaps between words, and the general boxiness and symmetry of the design probably work best with justified blocks.<br>
      So, keep it on.</p>
