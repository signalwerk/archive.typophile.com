    html: |-
      <p>It depends on browser support of automatic hyphenation. But it’s good to have it turn on because CSS standards are always evolving (albeit slowly) and there will be definitely a day when major browsers all support it.</p>
      <p>Safest option now is not to use hyphenation because you’re unsure whether there will be people who view your website on Safari 6/7 (deprecated support for most CSS3 OT features), early versions of Firefox without silent updates, or worse, Opera.<br>
      Current stables of Chrome and Firefox have been avidly following CSS3 OT features for a long time. Surprisingly IE10 has been supporting more OT features than Chrome and Firefox (good job Microsoft).</p>
      <p>On the other hand Safari 8 on Yosemite won’t even display discretionary ligatures. No point for you, Apple!</p>
