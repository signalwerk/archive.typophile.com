    html: |-
      <p>Loading JS is sometimes viewed by web designers/developers as the inferior method, because one always strives to reduce page load. The more extra JS you load, the more manipulation to DOM, and the more time it takes to present the page. That’s why web typographers are so frantic about new CSS standards, which, once established and supported, would enable the same hyphenation function without JS.</p>
      <p>Automatic hyphenation support (the <em>hyphens</em> selector) is still in the very early stages in CSS (it’s not even in CSS3 but only a Working Draft). Consequently a few major browsers still don’t support this selector (Opera being the worst and IE10 being the best supporter right now).</p>
      <p>You can read more about this in Mozilla’s network: <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/hyphens" title="https://developer.mozilla.org/en-US/docs/Web/CSS/hyphens">https://developer.mozilla.org/en-US/docs/Web/CSS/hyphens</a> and also about when to hyphenate: <a href="http://css-tricks.com/almanac/properties/h/hyphenate/" title="http://css-tricks.com/almanac/properties/h/hyphenate/">http://css-tricks.com/almanac/properties/h/hyphenate/</a></p>
      <p>CSS-supported hyphenation is achieved through manipulating browsers’ text rendering engine. Letting the text engine do the work has nothing to do with the font file (I don’t know how it would handle ligatures though – I think it would just break it up if necessary). This is in a sense more “authentic” (native) than Javascript, which calculates block width and inserts hyphens in separate tiny divs.</p>
      <p>Lettering.js (<a href="http://letteringjs.com" title="http://letteringjs.com">http://letteringjs.com</a>) mainly uses JS to achieve typographic exercises on web without browser native support. This is rather clumsy, but the best workaround you can get.</p>
