      <div class="comment-spam-body"><blockquote><p>Loading JS is sometimes viewed by web designers/developers as the inferior method, because one always strives to reduce page load. The more extra JS you load, the more manipulation to DOM, and the more time it takes to present the page.</p></blockquote>
      <p>I realize this has been a concern and I've had to work with that, but is it still a concern today? Bandwidth is so fast and computers are getting so good, it should become less and less of a problem. Obviously you would still want to keep JS implementation to a minimum though. A lot can be done more elegantly with CSS these days. I still use Javascript for hyphenation and sometimes for sliders when needed.</p>
      <blockquote><p>That’s why web typographers are so frantic about new CSS standards, which, once established and supported, would enable the same hyphenation function without JS.</p></blockquote>
      <p>That's an exciting development indeed, but I'm going to wait until there is better support before I start using it.</p>
      </div>
