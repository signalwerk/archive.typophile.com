    <p>Hi there!</p>
    <p>First of all: I know nothing whatsoever about Internet programming. I just want to give a hint to a guy who do me a favour with an internet project.</p>
    <p>OK. I want the text on my webpage to appear NOT antialiased, but sharp just with black pixels for example.<br>
    Is that possible with Monaco, Andale Mono etc. Or do I have to use something special?<br>
    Is there a certain adjustment in the stylesheet?</p>
    <p>just like here:</p>
    <p><a href="https://web.archive.org/web/20080706173850/http://www.blanka.co.uk/" title="http://www.blanka.co.uk/">http://www.blanka.co.uk/</a></p>
    <p>or here:</p>
    <p><a href="https://web.archive.org/web/20080706173850/http://www.plusminus.ca/" title="http://www.plusminus.ca/">http://www.plusminus.ca/</a></p>
    <p>Can anybody please give me a hint how to achieve that?</p>
    <p>Thanks!</p>
    <p>Juergen</p>
