  html: |-
    <p>Hello! I’d like to know what you think would be an appropriate classy or classic font for a brochure I’m designing. The topic is: High End Condos $450,000 - $950,000 / 55 and older active adult community / lots of pictures / descriptions of amenities, floor plans and area attractions.</p>
    <p>Any thoughts would be greatly appreciated. I’m just starting the process. My instinct says serif, anyway.</p>
    <p>I’ve enclosed some elements of the brochure.</p>
    <p>THANK YOU,<br>
    Kate</p>
