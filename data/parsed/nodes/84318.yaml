    <p>Hi everyone,</p>
    <p>Not so much an I.D query but in need of suggestions.</p>
    <p>Am looking for a font in this kind of vein - <a href="http://www.hypefortype.com/browse-fonts/font-categories/exclusive/sawdust-newmodern.html" title="http://www.hypefortype.com/browse-fonts/font-categories/exclusive/sawdust-newmodern.html">http://www.hypefortype.com/browse-fonts/font-categories/exclusive/sawdus...</a></p>
    <p>I don't feel this works with the headline I am using, 'young blood' very well. I'm after something that is super elegant, unique and suitable for a high fashion context. I want something a little understated and delicate but with a bit of a twist and am currently a bit stuck. </p>
    <p>Open to any suggestions at all, would be much appreciated, :) thanks.</p>
