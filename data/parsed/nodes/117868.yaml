    html: |-
      <p>Yes, that's my consideration. I like DIN a lot as a typeface, but I'm getting really tired of seeing it. For some reason it's the default art academy typeface, where 80% of the students will use it for their presentations. That can't be good. I personally feel it doesn't speak of being a good designer if you consistently use the same typeface. For every new project different considerations should be made regarding the choice of typeface and so it's more than just unlikely that DIN will be the ideal typeface every time. A design philosophy like Massimo Vignelli's I consider to be very bad.</p>
      <p>Nevertheless, DIN is beautiful and can offer nice branding possibilities, but considering its overuse I would recommend looking further if possible. You want your brand to look unique/original after all.</p>
    html_clean: |-
