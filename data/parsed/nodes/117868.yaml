    html: |-
      <p>Personally, I think how you're using the typeface is a lot more important than the typeface itself. Using a grotesk that gets less exposure is still using a grotesk, and unless there's something really funky about it your brand isn't going to look unique or original. There are a few cases where a custom typeface has really helped shape a brand's voice — like GE Inspira, for example — but most of the time an out-of-the-box typeface isn't going to do that for you, and someone could just as easily come along a few months later, use the same typeface, and dilute your brand.</p>
      <p>Brooklyn Academy of Music uses News Gothic, arguably the most boring typeface out there, but it does interesting things with it which makes the brand distinctive. Would they have been better served using, I don't know, Founders Grotesk or something? I don't think so.</p>
      <p>I'm not saying typefaces don't matter – they really do — I'm saying the vast majority of the time a typeface isn't capable of doing the heavy lifting for you.</p>
