    html: |-
      <blockquote><p>Personally, I think how you're using the typeface is a lot more important than the typeface itself.</p></blockquote>
      <p>That might be, but I feel this is a different issue. Why not first select a functional, beautiful and original typeface and THEN see how best to use it? It doesn't matter if you use Helvetica in the best way possible, I will still be annoyed with its choice.</p>
      <blockquote><p>Using a grotesk that gets less exposure is still using a grotesk, and unless there's something really funky about it your brand isn't going to look unique or original.</p></blockquote>
      <p>Probably not, but using a highly prolific typeface is probably going to add insult to injury. Reading your statement one could almost draw the conclusion that it doesn't really matter whether you use Arial or Nimbus Sans. I submit that it does matter — a lot.</p>
      <blockquote><p>There are a few cases where a custom typeface has really helped shape a brand's voice</p></blockquote>
      <p>The impact it has may be very subtle, but even the subtle effects should be considered. Let's say there is a brand which uses a typeface which is neutral to everyone and has no impact one way or the other but our small type community is very annoyed with some of the details in that typeface. Wouldn't it then be a better practice to choose a typeface which is at least neutral to everyone? Even if it impacts few people, I think it still matters. Whether making such small extra impact is cost-effective should obviously be considered as well, but that's a different matter.</p>
      <blockquote><p>Would they have been better served using, I don't know, Founders Grotesk or something? I don't think so.</p></blockquote>
      <p>I have my doubts but I wouldn't completely dismiss the possibility either. To be clear though, I don't necessarily want every brand to use an "exciting" typeface. I agree it's vital how a typeface is used, and often a "boring" typeface can equally impress, sometimes more so.</p>
      <blockquote><p>I'm not saying typefaces don't matter – they really do — I'm saying the vast majority of the time a typeface isn't capable of doing the heavy lifting for you.</p></blockquote>
      <p>I tend to agree with that, but to dismiss the subtle impact a certain typeface will have is taking things too far.</p>
      <p>To get back to the DIN consideration, I still think that if everyone is using DIN, it's wise to look for alternatives. Why would you only differentiate in the use of the typeface if you can also differentiate with the choice of the typeface? It doesn't have to be vastly different, but caring immensely about the details and subtleties is what deserves respect and what will strengthen the brand. Using Helvetica in the best way possible doesn't have that effect on me. In fact, almost by definition when I see Helvetica being used, I feel the company/designer is either ignorant or doesn't care enough about the details and subtleties and what they want to represent.</p>
