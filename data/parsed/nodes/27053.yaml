  html: "<p>80's Audio manufacturer Nackamichi also used a font on a couple of their product models which looked like this: <br><img src=\"http://www.typophile.com/forums/messages/83/43012.jpg\" alt=\"Nakamichi's Dragon-CT logo\"> <br> <br>Ignoring the fact that there's an outline variety present too; the \"A\" is obviously very distinctive as is the overall character squareness. The curved upwards-tapers on the the end strokes of the \"G\" and \"T\" are also noteworthy. <br> <br>Anyone reconise this one? or do you think that it might be a custom-face?? <br> <br>cheers, and thank you for reading.</p>"
