      <p>Hi Emily,</p>
      <p>newspaper nameplates are almost always custom designed.<br>
      If you’re looking for similar typefaces, check out<br>
      <a href="http://www.fontshop.com/fonts/downloads/parkinson_type_design/avebury/?&amp;sample_text=Daily%20Mail&amp;sample_size=60" rel="nofollow">Avebury</a><br>
