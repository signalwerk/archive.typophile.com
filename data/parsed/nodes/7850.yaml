  html: <p>Hi,  <br>I would like to have some suggestions for a typeface for photographer that is going to start a business  in children's portraits. Her style is relaxed and spontaneus and is all done outdoor on location using only available light (no flash). I've looked around on the web and most photographers that do this kind of natural light portrait photography use scripts. <br>Any ideas for a font? <br> <br>Thanks, <br>Barbara P.</p>
