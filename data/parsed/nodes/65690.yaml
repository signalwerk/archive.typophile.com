      <p>Yelp! That is nuts. Looks like the designer was tripping or something.</p>
      <p>Tomi, the headline stays the same, it just <em>looks</em> like more bits are added from the text. The motion paths are pretty funky – when the size is decreased, it looks like the bits that reflow to the first line come from wayyy below. Seems pretty confusing to me, but then I'm so not the target audience for this sort of thing.</p>
