    <p>I know I'm going to seem late to the party, but:</p>
    <p>Have you guys seen the way the Nintendo Wii reflows text?! It's the freakiest thing I've seen in a long time. I searched Typophile for a while and found nothing. Maybe because there's nothing we can do about it... But it's still freaky enough to be interesting.</p>
    <p>--</p>
    <p>On the Wii you can read live news stories. Super. You can zoom the text in and out. Super. When you change the zoom level the words fly to their new positions - each word separately! Super freaky. Should I put up a video of it on Flickr, or has everybody already seen it?</p>
    <p>And does this mean the Wii text renderer (who made it BTW?) makes a "sprite" out of each word and then moves them all around, resizing them along the way?! The thing is, why go to the trouble? I guess it just makes it more game-like. Wow.</p>
    <p>hhp</p>
