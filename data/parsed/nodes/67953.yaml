    <p>We are proud to present the latest typeface project of Ingo Preuß, the Arventa system.</p>
    <p>The Arventa typeface system is available in two families, that complete each other in a pleasant way, the Sans and the Slab family. Arventa Sans was the basis for the system, but the Slab is not just a Sans with sticking Serifs. Arventa Slab is delicately crafted form the outlines of the Sans. The Arventa design is a mixture of geometric and humanistic forms and elements to serve the demands of higher legibility. When it comes to classic, constantly, high legible forms, both Arventa designs are a perfect match.</p>
    <p>Every Arventa family offers seven weights (Thin, Light, Regular, Medium, Bold, Black &amp; UltraBlack) including the Italics. Every single font spans a glyph range of over 1000 letters, reliable developed after the GTF-UNI-Standard. Every font supports extended Latin, Cyrillic and Greek alphabets, small caps, various numerals (tabular and proportional), scientific numerals, fractions – all accessible by common OpenType features.</p>
    <p>The Arventa typeface system provides all you need to do great typography.</p>
    <p><a href="http://www.germantype.com/arventa" title="http://www.germantype.com/arventa">http://www.germantype.com/arventa</a><br>
    <a href="http://issuu.com/preusstype/docs/gtf_arventa_02" title="http://issuu.com/preusstype/docs/gtf_arventa_02">http://issuu.com/preusstype/docs/gtf_arventa_02</a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/arventa_gtf_news5_5109.gif"></div><p></p>
