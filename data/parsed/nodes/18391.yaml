    html: |-
      <p>Eric Gill’s work; he started as a stone cutter. Most of his typefaces derive from the alphabets he learned from stonecarving teachers. </p>
      <p>Perpetua, Joanna, Aries, Golden Cockerel</p>
      <p>Michael Harvey also has done a lot of carved lettering, as well as a bunch of very nice lapidary typefaces. One of Michael’s other major influences is his prolific work as a letterer for book covers, so his typefaces reflect this as much as they reflect his stonecarving work. </p>
      <p>Strayhorn, Mezz, Ellington, Andreas</p>
    html_clean: |-
