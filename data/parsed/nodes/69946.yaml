    <p>I picked up an old grammer book (1868) the other day and found these strange glyphs in the section on making plural forms:</p>
    <p><img src="/sites/default/files/old-images/UnknownGlyphs354_5492.jpg"></p>
    <p>Does anyone know what the last two glyphs being pluralized are? I am curious.</p>
    <p>As a bonus, did anyone know that the plural of beef is beeves?</p>
    <p><img src="/sites/default/files/old-images/Beeves_5763.jpg"></p>
