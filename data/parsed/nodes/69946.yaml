    html: '<p>By the way: All these glyphs are included in Unicode, i. e. ounce&nbsp;(℥), scruple&nbsp;(℈), minim&nbsp;(♏) and dram&nbsp;(ℨ). However, they cannot be found in most typefaces: Even <a href="http://en.wikipedia.org/wiki/Cambria_%28typeface%29">Cambria Math</a>, <a href="http://en.wikipedia.org/wiki/Junicode">Junicode</a> and <a href="http://en.wikipedia.org/wiki/Lucida">Lucida Sans Unicode</a> are, for whatever reason, lacking ‘♏’; this latter is in <a href="http://en.wikipedia.org/wiki/Linux_Libertine">Linux Libertine</a> from which all the other symbols are absent again. <a href="http://en.wikipedia.org/wiki/Arial_Unicode_MS">Arial Unicode</a> and <a href="http://en.wikipedia.org/wiki/Code2000">Code2000</a> are complete in this respect — as probably some more are.</p>'
