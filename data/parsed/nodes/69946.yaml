    html: '<p>By the way: All these glyphs are included in Unicode, i. e. ounce&nbsp;(℥), scruple&nbsp;(℈), minim&nbsp;(♏) and dram&nbsp;(ℨ). However, they cannot be found in most typefaces: Even <a href="http://en.wikipedia.org/wiki/Cambria_%28typeface%29" rel="nofollow">Cambria Math</a>, <a href="http://en.wikipedia.org/wiki/Junicode" rel="nofollow">Junicode</a> and <a href="http://en.wikipedia.org/wiki/Lucida" rel="nofollow">Lucida Sans Unicode</a> are, for whatever reason, lacking ‘♏’; this latter is in <a href="http://en.wikipedia.org/wiki/Linux_Libertine" rel="nofollow">Linux Libertine</a> from which all the other symbols are absent again. <a href="http://en.wikipedia.org/wiki/Arial_Unicode_MS" rel="nofollow">Arial Unicode</a> and <a href="http://en.wikipedia.org/wiki/Code2000" rel="nofollow">Code2000</a> are complete in this respect — as probably some more are.</p>'
