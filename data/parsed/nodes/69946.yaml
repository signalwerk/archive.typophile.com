    html: |-
      <p><em>I found that confusing, looking up the unicode values. The Scorpio sign is NOT the Minum sign. They are different glyphs. Kind of close, but not quite. But we are supposed to pretend?</em></p>
      <p>♏ U+264F is annotated ‘= minim, drop’, indicating that this character is intended to be used for both scorpius and minim.</p>
      <p>Somewhat confusingly, ♍ U+264D (virgo) is annotated as ‘= minim (alternate glyph)’.</p>
      <p>If you wanted to make the case for disunifying the minim sign from U+264F, you would need to be able to document a consistent glyph distinction in pre-Unicode usage.</p>
