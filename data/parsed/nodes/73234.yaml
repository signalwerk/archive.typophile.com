    html: |-
      <p>The name table version string should always be updated whenever you <em>release</em> a new version of a font, no matter how small the changes. The only time I do not increase the version string number is if I am working on internal, pre-release builds (in which case I use a private build number in the version string, e.g. 'Version 1.01 Build 012').</p>
      <p>The head table version string should be kept in synch with the name table version string.</p>
      <p>The head table revision string isn't something I generally assign any significance. I certainly would rely on it to distinguish different release builds of a font.</p>
