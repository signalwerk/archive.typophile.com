      <p>The current trend on releasing the same old font with extended char-set and some other minor tweaks is to call them "xxxxxxxxx Pro" and sell it for a few more bucks.<br>
      Or add "XXXXX Next Pro" if you prefer the more flamboyant Linotype Way.</p>
