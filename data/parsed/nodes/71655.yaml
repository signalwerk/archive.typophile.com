    html: |-
      <p>@forrest</p>
      <p>Double spacing and Times New Roman are examples of many of the anachronisms inherent to the world of academia. It makes little sense for most printed (not for publishing) academic work, and makes even less sense if it is handed in PDF format to be read (more often than not, one assumes) on-screen.</p>
      <p>Anachronisms aside, if the requirement is to hand the work in using as a PDF document, you should ideally be looking for a typeface which is designed to have extremely good screen legibility (a really well hinted font). I personally find that Bitstream's Iowan Pro and Charter Pro fit the bill, while remaining affordable (remember, you probably need only 2~3 weights for average academic work). Of these two Iowan would probably be easier on the eyes for extended text.</p>
      <p>You may also want to consider <a class="freelinking external" href="http://www.linotype.com/137452/trumpmediaevaloffice-family.html?PHPSESSID=27b8480e3ecf6291aea7780bb0295b82" rel="nofollow">Trump Mediaeval Office</a>, which was re-designed for office communication and to be a TNR replacement. It is also a superbly well hinted font, specifically designed for on-screen reading.</p>
