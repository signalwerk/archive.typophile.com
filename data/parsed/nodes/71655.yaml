      <p>Thanks, but rather than asking for typeface recommendations, I'm interested if there will be any problems with faces designed for "cramped" use like the two I mentioned being used in situations with huge amounts of space between lines.  The samples from the vendor are set with tight leading and look good, but that's not how I'll be using them.</p>
      <p>Any thoughts on that, or is it a non-issue?</p>
