    <p>I'm in school (not design-related - in a social science) and sometimes need to hand in papers that are "double-spaced, in Times New Roman or similiar font, at about 12 point."</p>
    <p>I've been using Plantin 11/28 which looks about right. Usually we hand in a PDF of papers - I'm not sure all our professors print them out or read on screen. Probably usually printed out, though they might read shorter assignments on screen.</p>
    <p>For various reasons I am looking to use something different.  I've seen two typefaces I like a lot that are not too expensive -- Publico and Guardian Egyptian. But I wonder if there is anything I should be concerned about in how these, which were designed for newspapers, might look on paper with a lot of space between lines?</p>
