      <p>Times was originally designed for a newspaper, and has somewhat cramped proportions, compared to classic book faces such Bembo, Garamond, and Caslon.</p>
      <p>Nonetheless, it works just about anywhere.</p>
      <p>I suggest you download a few of the free faces mentioned here and try them out.</p>
      <p>If they seem OK, then go with one of those, or invest in a commercial font of similar effect.</p>
