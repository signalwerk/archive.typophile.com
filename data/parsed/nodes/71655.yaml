    html: |-
      <p>You can go for Palatino, Georgia, Century (Schoolbook), these are on most Systems, although on windows you might need to look for the Palatino clone Book Antiqua. If you are on a mac the Hoefler Text is related to the Garamond tradition and a nice font, although it has Old Style Numbers. </p>
      <p>If you use MS office you can go with Constantia.</p>
      <p>Free fonts consider Gentium, Liberation, Libertine, Bergamo, Deja Vu Serif you can find on <a class="freelinking external" href="http://www.fontsquirrel.com/fonts/list/style/Serif" rel="nofollow">fontsquirrel.com</a>.<br>
      Have a look at the progress of <a class="freelinking external" href="http://aldusleaf.org/" rel="nofollow">Crimson Text</a>.</p>
      <p>Utopia and Minion in an older version are free for LaTeX, I am not sure about the licence here, but at least they can be found in some latex font directory, google will help you here. </p>
      <p>I would not recommend to go for something to warm or to progressive. Academics certainly benefits from a departure of TNR, but it should not be a noticeable font so to speak. </p>
      <p>Classical text faces include Janson Text, Sabon, (Adobe) Garamond, (Adobe or Williams) Caslon, Baskerville (Original), Minion among others. It does not need to be this conservative, they are just options. Guardian is a fine one too.</p>
