      <p>Without meaning to offend you: It will sure end up "kitschy" that way, but it is supposed to be that way. A typical way to do signage would be to use a soldering iron on wood, which gives technical constraints that even high-class alps resorts somehow appreciate.<br>
      Good luck from Austria!</p>
