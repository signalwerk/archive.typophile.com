    <p>Hello All!<br>
    I'm looking for some suggestions for typefaces for a hotel project I'm working on. It is an Austrian inspired "Chalet" style hotel in Jackson Hole, Wyoming.<br>
    I was looking for quality blackletter fonts, that were friendly as opposed to "black" -- Something like the lettering used for the Disneyland logo.<br>
    I'm also trying to avoid a kitschy feel and want it to be classic and refined. A body text I was eyeballing was Warnock Pro by Adobe.</p>
    <p>I would love any insight into typographic inspiration for the "chalet style" --- i.e. "Swiss Miss," Cuckoo Clocks, Sound of Music, Etc... without being, as I mentioned, Kitschy...</p>
    <p>Thanks for any advice!</p>
