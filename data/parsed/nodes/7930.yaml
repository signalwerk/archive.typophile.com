    html: <p>If it's an old theater, that may not be a digital font per se but there are a lot of deco fonts (all of them free) on <a href="http://www.moorstation.org/typoasis/designers/curtis/pages/a.htm" target="_blank">Nick Curtis's site</a>. You might not find an exact match but something close.</p>
