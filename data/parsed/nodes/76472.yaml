      <p>Here is the final cover, if approved:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/cover3_4887.jpg"></div><p></p>
      <p>I think the cover needed spicing up and added some Japanese text. Also I got a random camel image off Google to use for the cover. This is perfectly legal. (Unless it is considered camel pornography....)</p>
      <blockquote><p>Well, the book could be sold in a ricepaper wrapper. After you eat the wrapper, you can use the waterproof book inside to go fishing. Or, alternatively, you immerse the book in water to make the wrapper dissolve so you can open the book. I would definitely like to see this manufactured!</p></blockquote>
      <p>I like ricepaper idea. People could also use the ricepaper wrapper to write on if they happened to run out of paper. Also, this would match with the Japanese style open-spine binding....</p>
      <p>In regards to the fishhook to use, I'd recommend a #11 fishhook. These are probably the most versatile for catching fish in general.</p>
