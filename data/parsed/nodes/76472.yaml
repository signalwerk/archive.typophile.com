      <p>The solution to the URL ambiguity is obvious – you simply need to add clip art of a computer next to it, so that it shows that the URL is meant to be put into a computer. Maybe also prefix it with "URL:" to make sure people know it is a uniform resource locator, though. Maybe also an inviting line like "Find us on the web..." Yes, that'll definitely help this.</p>
      <p>Oh, and I know I'm chiming in a bit late, but for my 2 cents on the text design: make sure to use historical ligatures, because the little curve joining "st" and "ct" really, really helps readability for modern eyes. And all numbers should be done with lc, italic roman numerals for that added air of class. When used with the full caps for the headings (we're using full caps for the headings, right?), the font size of the numerals should be doubled to make the lowercase letters rise to the cap height.</p>
