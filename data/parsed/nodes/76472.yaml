    <p>I'm working on a project about design by committee / consensus and I really need some help with it. Essentially the idea is to make a book with all the decisions about its design made within this forum. The aesthetics of the book - it's size, format, layout, typeface etc will all decided by the consensus in here.</p>
    <p>Firstly, what do people think about the size of the book should be? And in terms of the title, I have two starting points - 'A Camel is a Horse Designed by Committee' and 'Too Many Cooks'.</p>
    <p>I'd really appreciate any comments and suggestions on this project.</p>
    <p>Thanks</p>
