      <p>Josh's edit to the spreads look fantastic. Although, the captions need to be in Adobe Chaparral Pro Light Display 6 set solid. This is very important for the look of the book and for legibility. Also, someone still needs to try making the page numbers in a different font. Curlz MT was suggested earlier, but I think that font may be much too childish. We need to try something by Ale Paul.</p>
      <p>I think the cover as we currently have it has nothing of interest. Perhaps the cover should have all of the committee's user icons, either arranged in a grid fashion, or haphazardly. Thoughts?</p>
      <p>The color also needs work. Yellow works for fontshop, but we're trying to make a classy book here. I think we'll all agree that blue with green and white text will work best. Also I think that Caslon works great for the text, but the cover needs something else. Alrt Text anyone?</p>
      <p>The binding and paper choices. tmac suggested it be waterproof. Typophiles are notorious for doing things near water. The paper should be waterproof, and if the text doesn't run too long, hand-stitched fishing line binding. It should come wrapped in mylar.</p>
