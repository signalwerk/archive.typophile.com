      <p>I would like this book to be the B-size (130x198), yet it should also maintain the size of a broadsheet. It should be a tiny book that fits within a locket. </p>
      <p>It should be waterproof.</p>
      <p>The type should be large and dark and light and very small. Maybe a little of each.</p>
      <p>Lets use a great many photographs except that photographs are too specifiying in their nature, so the photographs, the great many of them, should be illustrated and vague. The illustrator should be drawing out-of-focus. The lines should be sharp and crisp.</p>
      <p>If we have a photograph of a woman, perhaps that will exclude the men. So lets make the photograph of a woman a drawing of a gender-neutral stick figure. Give the gender-neutral stick some curves and a purse and long dangling tresses. Let it practice weight-lifting in an all-male gym.</p>
      <p>It should be a lavish book featuring die-cuts and varnishes and foil stamps, and it should be affordable and nearly without cost to produce. Take Marian's "I Wonder," and the 7th Day Adventist's watchtower as influences. </p>
      <p>The tone should be a light comedic thunderous proclamation. </p>
      <p>The title should have the word "Cooks" in it, but without any reference to what happens in a kitchen.</p>
      <p>(Thank you for letting me vent a little.)</p>
