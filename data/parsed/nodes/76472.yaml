      <p>We'll never reach consensus until a committee chairperson with absolute executive power is elected. I nominate myself. My platform for election consists of the following policies:</p>
      <p>--The title shall be "Mugford Designs a Camel; or How We Cooked a Camel [NOT A COOKBOOK]"</p>
      <p>--Titles will be in Adobe Chaparral Pro Caption 24/28, and captions shall be in Adobe Chaparral Pro Light Display 6 set solid.</p>
      <p>--Text will be set in ______ [to be determined later, but let's not fool ourselves, it'll probably be Caslon]</p>
      <p>--Page numbers shall be in 7-pt. Curlz Bold Italic.</p>
      <p>--The book will be printed letterpress, with an extra-deep impression on both sides because that is what is fashionable these days.</p>
      <p>--Paper shall be 8.5"x11", cut out of brown paper shopping bags with pinking shears for that jagged look that will be so popular with groupspeak researchers five years from now, then bound using the Japanese stab technique. A "recycled" icon shall be embossed on every page.</p>
      <p>--Since Curlz and Chaparral are for some reason not available in lead type, you will need to start punchcutting lessons ASAP. I have cornered the market on antimony so you will need to start fundraising too.</p>
      <p>--No photo-polymer plates can be used - that's "cheating".</p>
      <p>--The book will contain no photos, except of members of this committee. These photos will actually be woodcuts.</p>
      <p>--To appeal to an international audience, every third page should be printed with text running right-to-left.</p>
      <p>--I like the idea of the book fitting inside a locket. A subcommittee shall be formed to investigate the practial upper limits of locket size. Perhaps the book can be placed inside a gigantic clock hung around the neck like Flavor Flav - a "clocket," as it were. Discuss.</p>
      <p>--If we are unable to source a large enough drop-shadow-back-cover, then the last page of every chapter should be a slightly larger drop shadow page, cut with slightly larger-toothed pinking shears from a slightly darker color of paper bag.</p>
      <p>--No ligatures may be used, with the exception of the "Th" ligature. Also, Phaeton catchwords shall be used for all instances of "the," "and," and "of," unless "The" is at the beginning of a sentence, in which case the Caslon "Th" ligature shall be followed by a Phaeton "e".</p>
      <p>--Swashes everywhere!</p>
      <p>Please support my campaign for chairperson.</p>
