      <p>Well, Adobe Caslon is an excellent typeface, and since I know nothing of the content, that typeface is safe pick. And Adobe Caslon works really well in large sizes, so why not.</p>
      <p>With a relatively small book, you should look at margins: you need to have room for fingers holding the book, so you could go with page numbering on top, and some 20 mm on top and outsides. Binding determines the inside margin: pocket book-style glue bind needs more than traditional binding, which opens more.</p>
      <p>Or you could go with traditional Golden Section. All time classic.</p>
