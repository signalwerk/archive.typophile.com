    html: "<p>Tiffany writes: <i>What we are discussing here, this membership to an organization, is basically a luxury for anyone.</i> <br> <br>Not everything that isn't a necessity is a luxury: there are lots of categories in between. Belonging to a professional association is often a legal requirement (especially for doctors, lawyers, etc.); obviously this is not the case with ATypI, but I would still not classify membership as a luxury. Being able to spend my money on truffles while my colleagues in other countries are struggling to feed their families is a luxury. Being able to financially support and take an active role in an association such as ATypI is something closer to a privilege, especially if one can, through that association, do anything at all to help one's less fortunate colleagues.</p>"
