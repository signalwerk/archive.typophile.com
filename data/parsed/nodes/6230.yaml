    html: <p>I agree with most of John Hudson say, as usual in fact, and others too. Its good also that this kind of discussion can happen inside ATypI, and outside ATypI. The main problem for us is that ATypI is somewhat democratic organisation, and its not because one board member or simple member have a good idea, suggestion -- that this idea, view, suggestion can be accepted by all the association and used. <br> <br>With the experience of how the association worked over the year, everything take time, and strong dedication. I will say that the association is clearly very open, not as AGI for example (I hope to don't do mistake on this comparison in similar area?) <br> <br>Just take as example that I am member from 10 years now, ok, far..., but 10 years ago, I know nobody at all on Type scene, and less than 4 years after, they trusted enough me to propose to organise an annual conference, pffuf, and  then I was elected to the board. What I mean, its like that for many people on the board and member these days. <br> <br>I truly remember Jason Smith (<a href="http://www.fontsmith.com" target="_blank">www.fontsmith.com</a>) in 1998, looklike another new young guy on the scene when I meet him in 1998. This year, he wanted to participate more, and he was elected on the board too. <br> <br>ATypI seems to work like United Nation in some way (Maxime Zhukov surely know better than me UN), without the money (I don't say that UN is rich as MS). More in a sens that anybody is accepted to some limit, the limit who let ATypI survive (yes, its our main question behind all my comments these days). Any idea take long long time to be achieved. Example, the new website... <br> <br>This new website story started in Copenhagen (2001) after several years where website was discussed with not real effect. Some of us came to the idea to try to make it more open and democratic, less centralised. So, the website seems a good idea to give more power to the members, a tool who help people to share information, to post news and so on, as Typophile, typographi.ca who do it perfectly from a while now. Etc. So, rather than just an exchange of ideas during board meeting, at Copenhagen, then 1 year more for more discussion -- I proposed to set up a group of people to discuss with concrete proposal for it and comeback to the 2nd board at the end of Copenhagen conference. The idea was accepted, great, and the board decided that the new web site will became a major issue to which we need to spend some money. Ok, good. <br> <br>Months and months after, nothing really happened, all are in various places on the world, so... difficult -- but in last May, I offered my small place in Malakoff, for a board meeting in Paris (ok, surbubs of it), and Mark Barrat came with some proposals, tools, plan to run it, etc. Then, the money became problematic at ATypI, at the same time, so the early idea to paid some people for this huge huge, work disappeared suddenly. :-( <br> <br>But Mark Barrat was a a good guy, and he take over the complete job rather than to follow an outside guy paid by ATypI under his direction. No more money, ok, Mark Barrat done it himself. He was so great. Always positive. And now, we have a new tool, a great free tool done a dedicate member. <br> <br>What I try to explain is how ATypI work, as any associations, I pretty sure Sota, a great new local US association, have some difficulties too, but they are at who seems a more small level, and they bring news ideas, less cost, etc. They achieved something who is already an institution now I think. <br> <br>So, perhaps, in the future, ATypI membership will be tailored country by country, guy by guy? Who know? The guyd who want this solution, need to work harder to make it reality, came to ATypI, be board member, discuss, came with plans, reliable plans, that anybody need to accept because its seems very good, and then, the democracy will do it as he suggested couple of years, couple of months before. <br> <br>Any action, in association, particularly Worldwide one need time, dedication. You can</p>
