    html: "<p>Hrant its easy: <br> <br>ATypI has a Board does it not? Either way. They (or they form a Evaluation board) grade the tests. The tests are sent to realiable diplomatic co-ordinators a.k.a...a University in the area, community center, police/ gov. station ect. to be completed in the company of said reliable person then returned to ATypI offices for grading. <br> <br>My suggestion also works to prove how valuable ATypI is as an organization. The goal of the Org should be to keep profits down to 0. Otherwise, ATypI isin't providing much of a resource is it? <br> <br>I.E. ATypI produces a typography dictionary. How valuable is that to a beginner = very$. How valuable is that to Hrant = $0. So they pay membership according to how valuable ATypI is to them and vice-versa. ATypI benefits and keeps its resources top-notch because it has top-notch participating members (who wouldn't produce a typography dictionary) again because it was cheap to get them because they are experts and ATypI recognizes that. If ATypI is making a profit its because they only have...umm... stupid members perpetuating stupid resources that they aren't studying very well. If ATypI works on a 0 budget, its priceless. Perpetuating priceless information to stimulate priceless people. <br> <br>With a Board, also comes the Annual Report of which has that budget and revenue line. ATypI becomes accountable to its members. If they see profits are too high maybe they'd cancel that membership <br> <br>In the end either way ATypI GETS Elitist and should aim to BE Elitist. Elitist isin't a bad thing. If they need extra cash for any reason then they should solicit the socialites, beginners and wotnot in order to re-fuel the bank AND its membership porfolio (considering it should need to enrich the laymen and turn them into experts at some point) o.k. that's enough, back to my beer. <br> <br> <br></p>"
