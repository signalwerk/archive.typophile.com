    html: <p>Perhaps the anglo-centric attitude of AtypI is another indication of cultural elitism (as opposed to professional elitism, which can be a good thing).  If it's going to be "international", perhaps it should be more accessible to other languages, cultures, and income brackets.  If not, just call it the Anglo-Elite Typographic Association. <br> <br>From what I've seen on the Internet, Latin Americans could be making great contributions to typography.  It's too bad they don't have a professional organization like AtypI (that works). <br> <br>All my humble opinions. <br> <br>Paul</p>
