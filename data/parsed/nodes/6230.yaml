    html: "<p>Yves asks: <i>what is the current demographic of ATypI?</i> <br> <br>I have asked the ATypI secretariat to provide this information, since I want to run some numbers. I have a sampling of GNI per capita information for a number of countries in which I know ATypI has members (see below), but would like to extend my analysis to an accurate picture of the association. <br> <br>GNI per capita is not a perfect unadjusted indicator for this purpose, but it is probably the best we have. There are, of course, obvious problems, especially when looking at countries with very large populations of mainly poor people (e.g. India); anyone who is likely to be a member of ATypI is obviously making very much more money than most of the population, so the GNI per capita figure is too low an indicator. There's not much one can do about this; the indicator could be adjusted by the country's poverty rate, but too many nations do not publish statistics on the latter. <br> <br>I believe the greatest concentrations of ATypI members are in Western Europe and the USA, which is also where its activities have tradtitionally taken place. This is mainly due to the historical circumstances of the industry that originally gave birth to the association. Since that industry no longer exists, it is time for the association to find ways to extend its activities into other parts of the world. I believe that the membership needs to drive this; that is, we need to foster membership internationally <i>before</i> we can extend activity beyond Europe and North America. It would be great to see an ATypI conference take place in South America, or in Asia, but we need to develop the membership in these places first. Since there are people in countries like Argentina that desperately want to belong to the association, it would be foolish indeed for ATypI not to consider how this might be facilitated. <br> <br> <br>Sampling of GNI per capita (WB Atlas method) for some countries in which ATypI has members or in which individuals have expressed interest in membership: <br> <br>Argentina 6,960 <br>Canada 21,340 <br>Czech Republic 5,270 <br>France 22,690 <br>Germany 23,700 <br>India 460 <br>Israel 16,710 (for 2000) <br>Italy 19,470 <br>Japan 35,990 <br>Lebanon 4,010 <br>Netherlands 24,040 <br>Poland 4,240 <br>Russia 1,750 <br>Spain 14,860 <br>USA 34,870 <br>United Kingdom 24,230 <br> <br>[All figures 2001 unless noted. Source: World Bank.]</p>"
