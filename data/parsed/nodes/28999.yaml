    <p>Dear all,</p>
    <p>We all know that it is nice to have pictures aligned with the x-height of text in stead of the baseline, I am sure that we all do it intuitively, but <em>does Indesign CS2 support this in the ‘Grid‘-options?</em> Or are there plug-ins available?</p>
    <p>Cheers, –RTFRT–</p>
