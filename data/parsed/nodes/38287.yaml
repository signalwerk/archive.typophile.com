      <p>I am curious: what are you reading? </p>
      <p>However - the simple answer is yes.  The Counters are part of the Bouma.</p>
      <p>It is worth noting though that depending on who you talk to Bouma will likely to mean slightly different things. There is an effort to make these terms more precise but it should probably be seen as an evolving term.</p>
      <p>Still, if you like I will have short stab at it in layman-ish language &amp; then give you some links. </p>
      <p>It is a little hard to talk about Bouma without giving some context I think. So... For the sake of argument let’s say that on a Neurological/Perceptual level there is a ’sensory impression’. When we start to investigate what that is and how it’s sensed by the body we will notice that the sensory impression has two areas of interest for us - the part is in focus on ( the Foveal ) &amp; the part outside of focus but which is also in fact ’seen’ in the sense that it is part of seeing ( the Parafoveal ). These are anatomical and also Neurological distinctions. The Fovea has a greater density of light receptors.</p>
      <p>So then back to the Bouma. Hrant once wrote “According to my lectures in cognitive science, the combined outer *and* inner outlines (but in blurry, para-foveal form) of a word is what we rely on the most; and that’s in fact the bouma.” This emphasizes the Parafoveal use of the Bouma. This emphasis is why I bring up the Foveal &amp; Parafoveal. </p>
      <p>My understanding is that in some sense the Bouma exits in both but will be differently available to be perceived and differently emphasized by the brain.</p>
      <p>The term ’Bouma’ is a way of describing the stimulus provided to vision by the counters, all the black parts ( assuming a ’black’ text on ’white’ ), and the white around glyphs. I am deliberately avoiding the term word here because it seems to be agreed that the Bouma is not limited by words. Instead it is the Bouma that helps to identify what is a ’word’.</p>
      <p>It might be useful to look at the term Notan as well.</p>
      <p>I encourage the Bouma oriented here at Typophile to correct any mis-assertions I may have made.</p>
      <p>I hope this helps.</p>
      <p>Links:</p>
      <p><a href="http://www.typophile.com/node/15432" title="http://www.typophile.com/node/15432">http://www.typophile.com/node/15432</a><br>
      and<br>
      <a href="http://typophile.com/node/13763" title="http://typophile.com/node/13763">http://typophile.com/node/13763</a></p>
      <p>This might help too:</p>
      <p><a href="http://www.google.com/search?q=site:typophile.com%20Bouma" title="http://www.google.com/search?q=site:typophile.com%20Bouma">http://www.google.com/search?q=site:typophile.com%20Bouma</a></p>
      <p>and this</p>
      <p><a href="http://en.wikipedia.org/wiki/Fovea" title="http://en.wikipedia.org/wiki/Fovea">http://en.wikipedia.org/wiki/Fovea</a></p>
      <p>And for Notan</p>
      <p><a href="http://typophile.com/node/14819" title="http://typophile.com/node/14819">http://typophile.com/node/14819</a></p>
