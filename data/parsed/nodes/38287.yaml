    html: <p>I am glad it was helpful. BTW it is even possible I suppose that Kevin’s notion of the bouma does not include counters... the best thing is to read &amp; ask. The people who are really concerned with this theory stuff are not numerous - and ideas about the ways in which it might be applied to type design vary a great deal too.</p>
