    <p>Do the counters within a word make up part of its bouma, or is the bouma the shape formed by the upper strokes of the letters? I am a little confused about this—in part because typography texts tend to explain the phenomenon with simplified diagrams of boxy shapes of words and/or the negative spaces above them.</p>
