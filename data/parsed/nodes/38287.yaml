      <p>Thanks for the great response, Eben. As for what I’m reading, well, that’s a long list. There’s the usual roster of design textbooks—<em>Thinking With Type</em>, <em>Stop Stealing Sheep</em>, <em>Typographic Design: Form and Communication</em>, <em>A Type Primer</em>, I’ll stop there—along with all the various articles written for laymen and designers that I have come across, and now I am getting into Unger’s <em>While You’re Reading</em>. For me the confusion comes from most of this stuff just glossing over the concept and never bringing up the details, aside from mentioning that big counters are better, and I don’t know that I’ve yet spotted the term bouma outside the Typophile forums.</p>
      <p>But I am doing my senior thesis work, and it involves highly legible typefaces designed for use in a variety of media, so the more I know about this stuff the better.</p>
