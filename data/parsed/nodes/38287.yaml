      <p>I’ve never seen the counters included in the bouma — it’s always that ascending and descending box around the words. In <a href="http://www.microsoft.com/typography/ctfonts/WordRecognition.aspx">Kevin Larson’s paper on reading</a>, he defines bouma as the word shape/outline.</p>
      <p>EDIT: ... and then goes on to say that it’s not how reading psychologists believe reading occurs.</p>
