    <p>Well gang, I've searched high and low and I cannot seem to find any definitive ID for the lettering used on many US Post Office buildings . . . It is too simple to be Bernhard Gothic and Gotham doesn't have the angular tilting at the end of the strokes like the Cap E shows . . . I've seen this face on many post offices throughout the US but have no idea what it started its life as . . .</p>
    <p>But I'm certain it's not Neutra, Gotham or Bernhard Modern . . . Any ID or history is appreciated!</p>
    <p><img src="/sites/default/files/old-images/po_3692.jpg"></p>
    <p>Best,<br>
    Stuart :D</p>
