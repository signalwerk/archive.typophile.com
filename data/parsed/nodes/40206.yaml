    html: <p>When I went on one of Paul Shaw's TDC New York type walks, Paul explained that a lot of inscriptions on buildings and buildings signs were based on books of alphabets for architects. These were an independent source for lettering, and the reason for a similarity in some old signs around New York, signs which were the basis or inspiration for Gotham. It may be that some of the same factors are involved in the letters you show.</p>
