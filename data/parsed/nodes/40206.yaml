      <p>Those same letters are on the post office near me and many others I have seen over the years. Knowing how the government works, my guess would be that some point perhaps in the 1950s, a bid request went out for signage letters and the low bidder got the job. Although the low crossbar on the H signifies a Neutraface model, my guess would be that "Mr Lowbidder" had a mixed model of Futura, Neutraface, and Kable when he built his moulds to create the signs. There were also some movie marquee letters similar to that and maybe someone in that field had the metalurgical skills to put together a cheap way to make sign letters for the U.S. Govt. Plenty of other government offices including USDA have used the same letters. Probably after the initial contract, the post office sent the completed letters out for bid to match the originals with the bid and continued doing that over the years. The letters could have evolved slightly with each new contractor who succeeded "Mr Lowbidder" from then on. Your answer probably lies at the bottom of an old filing cabinet in the office of a government procurement specialist long since dead.</p>
      <p>ChrisL</p>
