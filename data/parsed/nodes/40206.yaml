      <p>Thanks to all for the input! I would think there has to be a single source because no matter where I've gone in the country, I've seen the same lettering on the outside of 60s looking post offices.</p>
      <p>I was able to find the Handbook but it only featured guidelines on in office display boards and vinyl on windows and only referred to the type as block lettering.</p>
      <p>This is indeed becoming a mystery that I hope to find answers to . . . It would seem that having a clear path to highway and national park signage that perhaps the most documented national institution would also have information about the lettering on the outside of their facilities.</p>
      <p>Stuart :D</p>
