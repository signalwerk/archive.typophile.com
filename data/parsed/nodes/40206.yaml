      <p>&gt;Your answer probably lies at the bottom of an old filing cabinet in the office of a government procurement specialist long since dead.</p>
      <p>The USPS building standard is Handbook AS-503, available as a <a href="http://www.apwu.org/dept/ind-rel/USPS_hbks/AS-Series/AS-503%20Standard%20Design%20Criteria%2012-05%20(5.74%20MB).pdf" title="Click to visit an external URL." class="freelink freelink-external freelink-external">PDF</a>, but the section on exterior signage (p. 495) doesn't mention fonts. It does refer to the "Standard Detail Library for illustrations and dimensional information regarding each sign component." I can't find a free copy of the SDL on the web; it looks like it has to be purchased on <a href="http://uspscd.com/index.htm" title="Click to visit an external URL." class="freelink freelink-external freelink-external">CD</a> for US$25, which is a little beyond my casual interest level.</p>
