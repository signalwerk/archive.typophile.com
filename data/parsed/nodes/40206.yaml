      <p>Well, I just pounded the Flicker US Post Offices photo pool and found some interesting things . . .</p>
      <p>There is a thin, a regular, and a heavy weight of this type and at some point I can only assume in the late 70s or early 80s that it was replaced with Helvetica so any books about this lettering on modern day post offices wouldn't be helpful.</p>
      <p>Additionally, there seems to have been a condensed weight that was used on federal and public works buildings . . .</p>
      <p>Stuart :D</p>
