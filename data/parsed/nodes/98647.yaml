    <p>After more than a year of hard work my new sans serif typeface Marat Sans is completed. It is a clean and lively sans serif typeface. The entire family contains of 27 styles &amp; weights and includes many OpenType features: various numerals, alternate glyphs, fractions, superiors and inferiors, language features, arrows, case sensitive forms and many more. Marat Sans is the perfect companion for Marat, a soft and elegant serif typeface.</p>
    <p>I'm offering a temporary discount on the font family to celebrate this release! Purchase the entire Marat Sans family on <a class="freelinking external" href="http://www.myfonts.com/fonts/ludwiguebele/marat-sans " rel="nofollow"> MyFonts</a> for incredible $149 (instead of $799).</p>
