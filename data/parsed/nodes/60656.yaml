  - id: 488044
    user: 46724
    date: 2011-12-20T07:26:00
    date_raw: 20 Dec 2011 — 7:26am
    votes: null
    html: <p>I somehow thought you'd be back Nick, and thanks. I am not of course a typographer, or a designer, I operate by moonlight, and try to absorb advice wherever I can, having no budget for professional involvement, plus of course I enjoy the execution &amp; learning. The original material in the "Holmes" book dates from the 1880s to the mid-1930s, and that which was not in facsimile I set in Miller which seemed appropriate given the description of that face as derived from news and magazine workhorses of the 19th century (it originally appeared in a club journal). The text set in Jenson was new, written in 2008, but Centaur originating in the middle of the period described, I thought I might get away with it, and I needed to differentiate it from the original matter in the book. My use of Jenson in the little 1892 yarn by Lewis I knew to be slightly suspect but time and budget were short. The fact that none of my readers are bothered by any of this does not absolve me from a certain responsibility, of course. I hope and believe I'm a careful setter of continuous text, I 'buy' most of what Bringhurst says (not glyph scaling!). Display setting is something I am not yet confident with. There's a lot more in the works, and it should get better. Your comment re Scotch Modern is not at all invalidated by the existence of your own example, which I find lovely and will undoubtedly be using sometime.</p>
    html_clean: <p>I somehow thought you'd be back Nick, and thanks. I am not of course a typographer, or a designer, I operate by moonlight, and try to absorb advice wherever I can, having no budget for professional involvement, plus of course I enjoy the execution &amp; learning. The original material in the "Holmes" book dates from the 1880s to the mid-1930s, and that which was not in facsimile I set in Miller which seemed appropriate given the description of that face as derived from news and magazine workhorses of the 19th century (it originally appeared in a club journal). The text set in Jenson was new, written in 2008, but Centaur originating in the middle of the period described, I thought I might get away with it, and I needed to differentiate it from the original matter in the book. My use of Jenson in the little 1892 yarn by Lewis I knew to be slightly suspect but time and budget were short. The fact that none of my readers are bothered by any of this does not absolve me from a certain responsibility, of course. I hope and believe I'm a careful setter of continuous text, I 'buy' most of what Bringhurst says (not glyph scaling!). Display setting is something I am not yet confident with. There's a lot more in the works, and it should get better. Your comment re Scotch Modern is not at all invalidated by the existence of your own example, which I find lovely and will undoubtedly be using sometime.</p>
