      <p>I’m impressed by your careful traditional typography, which is appropriate to the era of the books’ subject matter. However, I must say that I find the choice of typeface disturbingly anachronistic. The revival of Incunabula styles, and Jenson in particular, only began with Morris, and wasn’t at all authentic until Benton’s Cloister, c.1914 (and Adobe Jenson is nothing if not authentic). You should have used a Scotch Modern, to fully capture the flavour of the times, and that is what I would have recommended, had you mentioned the dates of the works/subject matter.</p>
      <p><cite>Making an “allusive” format for a book—that is, casting it in the style of the period of the original text—is in a small way something like planning the stage setting of a play. An up-to-date style for an ancient text would compare with staging </cite>Hamlet<cite> in modern dress. However novel and effective in its own way, you feel it to be strange, and this sense of strangeness is an annoying distraction; you are forced to think of the setting and the designer, rather than the text. </cite>—Bruce Rogers in <em>Paragraphs on Printing</em>, William E. Rudge’s Sons, New York, 1943.</p>
