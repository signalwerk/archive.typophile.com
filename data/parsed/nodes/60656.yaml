  html: <p>I bought the digital Monotype Centaur before finding that even on 300dpi laser output and at 14pt it looks (as I could have discovered at less cost with a little research) a bit skinny and undifferentiated compared to my distant memory of a Rogers example from metal. The intended book will be digitally printed, at higher resolution of course, so I don't think this will improve in the 'press'. Any thoughts on a better digital font in the same idiom?</p>
