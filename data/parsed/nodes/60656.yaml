      <p><em>...it would gain from something slightly Arts &amp; Crafts in feel...</em></p>
      <p>I doubt the boats were Arts &amp; Crafts or historical revivals, which is what Centaur was.</p>
      <p>IMO Cheltenham is the most representative Arts &amp; Crafts type of the Progressive era.<br>
      Kennerley was another popular type at the time, a new design in an historical genre, with a more old-tech vibe than Cheltenham.<br>
      Moderns were still predominantly in use for text, if a refined finish would be appropriate.</p>
