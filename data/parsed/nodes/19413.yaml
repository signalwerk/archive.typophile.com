    <p>hi, i'm starting a blog about ignorance, not just here in the UK but to open it up to the world in general and i want to use a really ignorant font for the titles and the banner across the top. does anyone know if that FontPlayer guy has designed any fonts, because his posts here are SO TOTALLY ignorant that i think it would be perfect to use his work. also, what colour is ignorance? thanks again for your help.</p>
    <p>PS the judy invites were a huge hit!!!</p>
