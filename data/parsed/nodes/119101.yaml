    html: <p>Can't find a perfect match. To me, it looks to mixe influences from <a class="freelinking external" href="http://www.myfonts.com/search/din" rel="nofollow">DIN</a> (<a class="freelinking external" href="http://www.myfonts.com/search/din+condensed" rel="nofollow">Condensed</a>/<a class="freelinking external" href="http://www.myfonts.com/fonts/urw/engschrift" rel="nofollow">Engschrift</a>) and <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/conduit" rel="nofollow">Conduit ITC</a>. I like also some URW++ like <a class="freelinking external" href="http://www.youworkforthem.com/font/T1052/signal" rel="nofollow">Signal</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/snv" rel="nofollow">SNV</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/urw/saa" rel="nofollow">Saa</a>.</p>
