    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Class-GMAM-small_6171.jpg"></div><p></p>
    <p>This is a number badge/plate for a old GMAM Garratt steam train from South Africa. I need to replace the numbers on the badge with another Garratt's number. Any ideas what the font might be - just for the numbers really.</p>
    <p>Thanks in advance!</p>
    <div class="field field-type-text field-field-solved">
