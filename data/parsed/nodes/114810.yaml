      <p>You could embolden/modify the following:<br>
      For "NIKE", <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Google-Web-Fonts&amp;ffam=Orbitron%20-%20Black&amp;fid=c8466cc6c97309a36fa80933fd0b9b37&amp;fstyle=b&amp;fsize=60&amp;text=NIKE&amp;fit=1" rel="nofollow">Orbitron (Black)</a></strong> by FontLab Studio [2009] now part of Google Web Fonts</p>
      <p>For "GOLF", <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=Typodermic&amp;ffam=Injekuta%20-%20Regular&amp;fid=dbfab0d9393d9bc4b246f5523a7c631e&amp;fsize=60&amp;text=GOLF&amp;fit=1" rel="nofollow">Injekuta</a></strong> by Ray Larabie [Typodermic, 2007]</p>
