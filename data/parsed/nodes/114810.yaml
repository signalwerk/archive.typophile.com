      <p>Good selection by Fivos as usual. For the record, this one is definitely based off Eurostile, the 'NIKE' part is blatantly it. The only things to do is to start with Eurostile Extended, even up /E crossbars and redraw /G cutting top right part and making terminal oblique. I guess it'd be pretty easy to do. So for your job, why not starting with it and customize it to make it unique. Eurostile is a catchy font and if you avoid or customize some of its earmarks (/S, /R leg...), it could work quite well.<br>
      You could also have a look simply searching for <a class="freelinking external" href="http://www.myfonts.com/search/Eurostile" rel="nofollow">'Eurostile' at MyFonts</a>.<br>
      For some 'Eurostile-like' with a twist of techy vibe: many <a class="freelinking external" href="http://www.myfonts.com/foundry/Typodermic" rel="nofollow">Typodermic Ray Larabie</a>, <a class="freelinking external" href="http://www.losttype.com/font/?name=venera" rel="nofollow">Venera</a>, <a class="freelinking external" href="http://www.myfonts.com/search/Biome" rel="nofollow">Biome</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/eurostile-candy" rel="nofollow">Eursostile Candy</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/flat-it/clonoid" rel="nofollow">Clonoid</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/paratype/magistral" rel="nofollow">Magistral</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fontfont/cube" rel="nofollow">Cube</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/typodermic/reversal/" rel="nofollow">Reversal</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/dsgnhaus/saturn/" rel="nofollow">Saturn</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/reaction/" rel="nofollow">Reaction</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/phantom/" rel="nofollow">Phantom</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/stak/" rel="nofollow">Stak</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/cheapprofonts/geometry-soft-pro" rel="nofollow">Geometry Soft Pro</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/canadatype/miedinger/" rel="nofollow">Miedinger</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/fw-identikal/phat/" rel="nofollow">Phat</a></p>
