      <p>Dear Miss Tiffany,</p>
      <p>Thanks so much for sending this sample along. I appreciate your help. Now, concerning your comment: "Darn you Morison!" do I take it that you hold a grudge against this esteemed man of letters? If so, you may be interested in my parody of Stanley Morison: "Stanley Morison's Egg-Sandwich Exegesis" which I published in April in a limited edition of 100 copies. I expected only a handful of people on the planet might be interested in this (respectful) parody of the Master's prose style, and given your interests, you may one of the select few for whom this piece was written. Please see <a href="http://infernopress.blogspot.com" title="http://infernopress.blogspot.com">http://infernopress.blogspot.com</a> for details. I still have a few copies left.</p>
      <p>In any event, thanks for your help.</p>
      <p>Paul</p>
