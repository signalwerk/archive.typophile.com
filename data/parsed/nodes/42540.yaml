      <p>To add to that, Eluard, I have a MacBook with XP running on it. It's one computer, but why do I have to buy two licenses for my software if I want to run it inside of XP and OSX? </p>
      <p>More arguments for software companies to consider the 'per user' license concept instead. Alas, that means they have to give up concepts like DRM which they may or may not go for.</p>
      <p>I've always thought a 'dongle' approach would work. Maybe a bluetooth device that stores all of your licenses on it. No matter what computer you are on, as long as you have the license on the device, the computer will recognize it and launch the software for you. This gives the vendor the DRM-want, and the customer the flexibility of not being tied to a physical box.</p>
