      <p>yes, kris, the article is only indirectly related. but it is related, as is chris anderson's concept of the long tail and what happens when the cost of reproduction of media approaches zero. again, i don't want to be the mediator (or presenter of one side to the other). </p>
      <p>i can say, however, that i find the per-computer license model frustrating and by its very definition bound to be violated. not from mean spirited scoff-law piracy but rather from inconvenience, ignorance, and economics. per-computer licensing is clearly a flawed business model. i'm wondering if there is a better one.</p>
      <p>some of you may find this appalling, but as a young designer i used nothing but copied fonts without even knowing i was violating any laws or agreements. and i'm willing to bet that this is normal. i don't say this proudly, and you can rest assured that now i  purchase (oops... license!) legitimate copies of anything i need. i pass the expense to my client when possible, or i designate the annual costs as a normal business expense.</p>
      <p>( i was amused to recently see a request on typophile for barry deck's fontoid.<br>
      i worked on the project at nickelodeon for which he created this. he had us all sign a document vowing never to copy, distribute, or use this font for anything other than the nickelodeon project. ever. that was my very first exposure to the issue of proprietary fonts and usage restriction. )</p>
      <p>as i matured and began to work more seriously with fonts and fontographers, and as i bought fonts i couldn't find, i began to more fully understand and respect the work that goes into all design and i began to actually read the EULAs and frankly, even while doing my best to respect the spirit of the agreements and restrict my usage to a legal context, i find the arrangement cumbersome and at times absurd. </p>
      <p>there have been other threads on this list regarding the all too common practice<br>
      ( now waning due to technological advances) of sending fonts to printers or freelancers bringing fonts to work sites, etc. </p>
      <p>students and young hungry designers are the most likely to think "i can't afford it" or "we already bought it so why shouldn't we share it". it's hard for them to justify spending money again and again on files that are so easily and rampantly duplicated. as i explained, i myself had to gain a certain career momentum before i fully cooperated with the licensing system as it stands. these days, even if i find a font i want to use in my vast collection from years gone by, i'll find a way to buy it for a job. it's not difficult but it took a few years for the rationale to kick in.</p>
      <p>we loan books, we share music, we invite friends over to watch movies, we make people dinner. we share things of value. this is a normal impulse and for a lot of people it is counter-intuitive to prohibit. and i think the font situation is aggravated by the very language of the license agreements. on most font sites every aspect of the transaction is called a buy - you "buy the font" - but in fact you are not buying, you're not even renting. you are licensing with restrictions. perhaps that should be made more explicit at the top of the agreement.</p>
      <p>i play by the rules, folks, but i wonder if there's another approach to this problem other than lectures on ethics ?</p>
