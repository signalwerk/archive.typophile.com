    html: <p>One problem of making a license per computer is that it is not clear what a computer is. For example I have a Powermac G5 and it has two internal drive bays (more recent ones have four). One hard drive has OS X 10.4.11 on it and the other has 10.5.2. For almost everyone this counts as one computer, not two.  Now am I entitled to put a font onto both drives and have that count as one computer? In this case I suspect no one would cavil — after all, I cannot use both drives and both operating systems simultaneously. But this a real problem for me with CS2, which I have a license for. It is currently on the 10.4.11 drive but I genuinely have no idea whether I am entitled to put it on the Leopard drive as well. And yet it is licensed for one computer, and, as I say, most people would consider the whole thing just one computer. (If the license is really for one hard drive then it should really say so.)</p>
