      <p><cite>My biggest gripe, in general, about software licensing right now is the fact that much of it is licensed PER MACHINE, rather than PER USER.</cite></p>
      <p>I couldn't agree more and I have argued this point on other threads in vain. As a single user with three computers and two printers, I resent having to pay individually for each workstation. Most EULAs cover a number of devices, say 1-5, which works just fine for me, but H&amp;FJ among others does charge per computer. The argument was made that it is easier for the font police to monitor the number of workstations than the number of users and then the thread got ugly.</p>
      <p>I think that overly restrictive EULAs do nobody a service - designers will either not buy the font or will violate the EULA (knowingly or unknowingly). I really appreciate the foundries that make an effort to work with individual designers and not just major corporate clients or custom jobs. I am respectful of the hard work of the typographers, but only ask that they respect my needs as a user of their fonts.</p>
