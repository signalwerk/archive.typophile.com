      <p>Expect to see more differential pricing, based on either the amount of content in the font, or who's using it.</p>
      <p>For instance, there are already two price points for legacy and OpenType versions of the same typeface.</p>
      <p>Check out Canada Type's CULA and PULA--different prices for commercial and personal use.</p>
      <p>The font market will continue to expand, driven by factors such as better marketing by distributors, and more aggressive pricing by competing foundries from around the world. $5 fonts, $25 fonts, $50 fonts, $75 fonts -- more tranches, bigger overall sales volume.</p>
      <p><em>there are free fonts and cc fonts out there, but is this really the best we can do ?</em></p>
      <p>I'm afraid so, because these comprise the lowest tranche, and act as a gateway for users to then move up to commercial products.<br>
      Look at what happened in the early 19th century when book publishers on the European continent went after the controlled UK market, offering a cheaper product and not paying authors. Before this was closed down by international agreements, it (among other things) had stimulated the book and reading market in the UK hugely, and brought prices down--as well as popularizing Byron and Scott throughout Europe.</p>
      <p>The US ignored European copyright at that time, published European authors cheaply, with affordability boosting the reading rate in the US, again stimulating the commercial market, and allowing writing to emerge as a profession.</p>
