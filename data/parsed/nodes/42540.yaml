    <p>i belong to another chat group comprised mainly of computer geeks and code cowboys who almost universally oppose the current definition of intellectual property and advocate open source code, creative commons licensing, file sharing, and drm-free documents. you know, the whole boing-boing crowd.</p>
    <p>i've noticed on typophile a strong and understandable trend towards conforming<br>
    to EULAs and strict adherance to license regulation.</p>
    <p>i don't know where i stand, as i understand both arguments but feel unable<br>
    to consistently advocate or practice either.</p>
    <p>i'm curious if any of you hardcore typophiles have any thoughts on the future of<br>
    font licensing or possible alternative models. i know there are free fonts<br>
    and cc fonts out there, but is this really the best we can do ?</p>
    <p>(should this thread be in this forum or "general" ?)</p>
    <p><a href="http://www.boingboing.net/2008/02/24/knowledge-isnt-prope.html" title="http://www.boingboing.net/2008/02/24/knowledge-isnt-prope.html">http://www.boingboing.net/2008/02/24/knowledge-isnt-prope.html</a></p>
