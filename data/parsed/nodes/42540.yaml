      <p>Negotiating with a foundry can work. But one of the functions of the law is to save transaction costs by offering a default set of contractual rights and obligations that may be more efficient overall. So, if regulators find so called "agreements" overly restrictive, they can give consumers additional rights notwithstanding the EULA. It may not be in the interest of type designers, but it may be in the public interest.</p>
