      <p>Much of Typophile consists of professional type designers who make a living on type, so it's understandable that the trend would be to lean towards their interests.</p>
      <p>The question is, in general, does strict technology based and legal based copyright restrictions actually favor the copyright holder as much as they think it does? It's obviously a complicated question with no straight answer. It also is likely heavily dependent on the particular niche industry we happen to be talking about.</p>
      <p>"How many of these geeks and code cowboys create software? How do they propose making a living from said software?"</p>
      <p>A lot of people make a living creating and supporting Open Source Software. The concept of open source does not negate a project from making a profit. That tends to be one of the myths of the open source movement. Does it apply to type design? Probably not as easily.</p>
      <p>IMHO, I think most software licensing is overly strict, and that most open source licenses probably aren't ideal for most of the industry, leaving the answer somewhere in the middle.</p>
      <p>My biggest gripe, in general, about software licensing right now is the fact that much of it is licensed PER MACHINE, rather than PER USER.</p>
      <p>*I* am the one paying for the license. *I* should get to use it where I want. My computer is not paying for the license. It has no right to my software. </p>
      <p>I think Apple kind of gets this, even though they don't overtly state it.</p>
