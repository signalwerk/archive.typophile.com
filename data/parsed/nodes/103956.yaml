      <p>You've definitely achieved "Helvetica-like" and "professional."</p>
      <p>The middle version, with the italicized "international," has the most contrast (big-small, Roman-italic). Make sure that "international" is still legible when you use the logo at your desired size (and that no strokes break up on the printer).</p>
      <p>Overlapping the As, but then butting the R and S up so close *without* overlapping seems like it's not quite resolved. Have you tried overlapping the As further? Overlapping the R and S?</p>
      <p>The A combination, by the way, reminds me of American Airlines — even though it's not the same treatment at all. Something to think about, play up, or play down?</p>
