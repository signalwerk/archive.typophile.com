      <p>Dear Pica Pusher,<br>
      Thank you for your extensive and detailed reply.</p>
      <p>I think you definitely touched upon some very interesting points, and have to agree with you. I am now on my way to create a new version with the R and S overlapping with the As and see how it will end up, hopefully it will end up being even more unified.<br>
      However, I think I will opt for the non italic version of the font for the "international" text as I just tried to print it at small size and it seems to be more readable compared to the more contrasty italic version.</p>
      <p>I will keep you updated with some new concepts soon.</p>
