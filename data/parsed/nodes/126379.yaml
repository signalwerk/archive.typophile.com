    html: <p>Compatil … take a closer look at spacing and proportions! I do not think that typefaces of fundamentally different kinds of stroke contrast like Compatil Exquisit (formerly Guardi, an OldStyle/Garalde) and Compatil Text (formerly Centennial, a Modern/Didone) should be made fit to the same widths. Apparently that was not enough, they also stuck with the practice of the Lino-typical duplex matrices for which italic were made fit to the widths of the roman. Look at the o in all italics. Instead of being too wide like in Linotype Sabon, the spacing is too wide. Designing letterforms and playing the accordeon is not really the same thing …</p>
