      <p>Nick,</p>
      <p>I think you might be reading my comments and the comments of some of the other posters as one and the same comments, thinking that they and I are saying the exact same thing.</p>
      <p>The purpose of my post was not to incite a riot, but to start a conversation.  And like any conversation, some grievances and frustrations will be expressed by certain members of this forum.  And we all need to listen to those.</p>
      <p>I admire Village a lot, but that doesn't mean I hate and disrespect and am ready to demonize all the the other foundries.  That way of thinking has proven to be a dead-end in all walks of life and all areas of human thought.</p>
      <p>What I am asking is for everyone to "think about" alternative ways to price their product so that we can all "help" each other in these difficult economic times.</p>
      <p>It's really important that we try to "talk with" each other, rather than "talk at" each other, so that some degree of mutual understanding might have a chance to take place.</p>
      <p>Having said that, I understand the retail principle well enough.  The question I'm posing is: if the Village offer makes "a lot of sense" to you, then surely some part of you understands that the retail principle cannot be the one-ring-to-rule-them-all approach to selling your product.</p>
      <p>Let's keep the conversation going, without getting personal, defensive, and, yes, mean-spirited.</p>
      <p>Rahim</p>
