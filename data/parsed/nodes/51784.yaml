      <p>Font vendors like to keep things simple (if not totally "just") by selling either single fonts or packages, considering each purchase a "new" purchase. There are two good reasons for doing this: money and logistics. There are also good reasons to do it differently, if you take into account that a customer's goodwill has a certain value -- and if you have the programming skills to conceive a system that provides the logistics.<br>
      Luc(as) de Groot is one who has followed Rahin's logic, reckoning that a customer who is welcomed back by a company that remembers and rewards his or her earlier purchases comes back more happily. At LucasFonts, anyone who buys a font or several fonts from a family from which he/she has already bought fonts using the same login name, is eligible to receive a "font family rebate" even if months or years have gone by. It took LucasFonts' software developer Niels Poppe many hours to figure it out, but it works. It makes people like Rahin very happy.<br>
      BTW, LucasFonts.com has a new website.</p>
