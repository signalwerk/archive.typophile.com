      <p>Hi.</p>
      <p>The Taste Test has been Village policy since Day One. In fact, it was always our policy at Thirstype in Chicago too. It shows our clients the respect they show us by licensing our types. Similarly, all of our licensing is cumulative, so that clients can add to the number of computers they have covered without any unnecessary extra outlay.</p>
      <p>Most of our policies were created to balance our needs with the needs of our clients. We run on the Golden Rule. Which is why we have our licensing tables clearly accessible from every typeface page, offer Supersets and smaller Essential/Basic sets, and don't make people create accounts to use our site. (V2 of the site will allow for clients to create accounts if they wish which will make it much easier for them (and us) to manage Taste Tests, upgrades, etc.)</p>
      <p>It's really painless to manage Taste Test orders; it takes around 90 seconds to get into our e-commerce system, make the necessary adjustments, and send files to clients.</p>
      <p>Nick, we have not copyrighted the idea at all, although we wouldn't be too thrilled to see another foundry with a "Taste Test". Any other name is fair game. Another company with a similar scheme is Apple, where you can "Complete My Album" at the iTunes Store.</p>
      <p>Thanks to Rahim for the original post. It is interesting to read the discussion it has sparked.</p>
      <p>Chester Jenkins<br>
      Village</p>
