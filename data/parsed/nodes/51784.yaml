    <p><strong>The Problem</strong><br>
    Many of us have wanted to license a complete font family but cannot afford to do so at the present time.  So we purchase only one or two weights that we really need.</p>
    <p>But later when we are able to afford the whole family, we are told that we have to either purchase the whole family at the full price (essentially paying for the single weights we purchased earlier all over again) or we can get a nominal discount.</p>
    <p>Fontshop, for example, allows you to pay the difference if you buy the single weights and then you buy the whole family later inside the same month.  The issue with this is that if you can't afford to purchase the whole family right now, that situation is unlikely to change inside a month.  It may take you many months or even a year or two to be able to do it.</p>
    <p>Though I am sure this makes a lot of business sense from the point of view of the business, it is not as friendly &amp; helpful as it could be from the point of view of the consumer.</p>
    <p><strong>One Happy Solution</strong><br>
    In the economic climate we all now live in, I want to point out <a class="freelinking external" href="http://www.vllg.com/tastetest.php" rel="nofollow">Vllg.com's "taste test" policy</a> as one example of what a truly upgrade-friendly consumer-oriented purchasing policy looks like.  Their policy states:</p>
    <p><strong>If you purchase a single weight (or more) of any typeface we offer, then return later to buy a family set, we will credit you the amount of the original sale.</strong></p>
    <p>How the program works</p>
    <p>We know that you might want to try out one or two weights of a typeface to decide if it's right for a project you're working on. While the MudTyper and PDFs are very useful, there is nothing quite like trying out a typeface yourself.</p>
    <p>So, you visit vllg.com and license your "trial" font (or fonts) and work with it for a while. A couple of hours, a couple of months, or a couple of years.</p>
    <p>If you decide you want to get a family set, just come back to vllg.com and purchase a license online. Send us a note on the checkout page or via email and we will deduct the original cost of your "trial" fonts from your family order. </p>
    <p>A policy like this encourages us to purchase more fonts from them to try out, knowing full well that they will allow us to pay the difference if we want to come back and get the whole family, even if it is years later.</p>
    <p>What do you think of this "taste test" policy?  Do you know of other upgrade-friendly type foundries that are willing to do what they can to help the customer not pay twice for the same fonts?</p>
    <p>Rahim</p>
