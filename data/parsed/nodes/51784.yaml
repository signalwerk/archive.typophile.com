      <p>"You are the one who started a thread named “Paying Twice For The Same Fonts”, which is a provocative distortion."</p>
      <p>Oh, please. Enough with the histrionics. Just because it doesn't fit your business model doesn't mean he's making a "provocative distortion." Rahim's original post was thoughtful, and not in any way an insult to the standard way of doing things for most businesses (type foundries, butchers, etc.). He was posing a question, plain and simple, and speaking from the consumer's point of view (you know, the people who keep you in business). </p>
      <p>And no matter how you want to phrase it, you are indeed paying for the same font twice from many foundries if you buy one, and then come back and pay full price for the whole family. Yes, we understand that that's how it's generally done with fonts, and all sorts of other things. Yes, we understand that there are volume discounts when buying the whole family at once (which we all appreciate). And yes, we understand that the current system works quite well for many foundries and that doesn't make them evil. But Village's system is very attractive, and certainly in my case would encourage me to buy from them. </p>
      <p>I would not expect to go to the hardware store, buy a quart of paint for $10, and then come back the next day and have them sell me 3/4 of a gallon at a discounted price (i.e. the price of a full gallon minus the $10 I paid for the quart).</p>
      <p>But if they offered that, it would certainly be appealing to a lot of people who want to try out paint colors. I doubt anyone thinks that Home Depot is ripping them off because they don't offer that. And if I sent an e-mail to Home Depot suggesting they do that, I really doubt they'd use the phrase "greedy heart" in their response to me.</p>
      <p>"And you’re making out like I’m ripping people off?!<br>
      Do the math, get a life, make some money, and if you’re offered a deal, don’t go dissing whoever made it because they’re not as “upgrade friendly” as your greedy heart desires."</p>
      <p>I think it's safe to say that _that_ was mean-spirited.</p>
