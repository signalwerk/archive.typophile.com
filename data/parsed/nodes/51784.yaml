      <p>We appreciate all of the feedback on our sales policies. </p>
      <p>Village's Taste Test program is indeed enticing from a customer perspective, and I wouldn't begrudge anybody who chooses to shop there because of it. But one thing to consider is that FontShop currently carries fonts from 66 foundries and growing, while Vllg carries 10; formulating a new sales policy with collaboration and unanimity amongst so many parties is quite a task. This is most likely why the standard among font resellers is a simpler model than Village's exception. And as has been mentioned, we feel that we do give back to our customers, and the community as a whole, in the form of such offerings as Font Magazine, FontBooklet, FontStruct.com, FontFeed, newsletters, etc. </p>
      <p>That said, we certainly take customer opinion seriously, and we'll continue to have internal discussions regarding this particular point of sales policy. We'll keep the community posted if any changes are made down the road.</p>
      <p>Ivan</p>
      <p>FontShop Sales &amp; Support</p>
