      <p>Some observations:</p>
      <p>* I started this post to highlight what one foundry is doing that is appealing to those who of us that have limited budgets.  I invite you to re-read my own words from the beginning.</p>
      <p>* In my second post, I explicitly said that even though I admire Village for their "taste test" policy, it does not mean that I diss other foundries for not having a similar policy.</p>
      <p>* I respect how FontShop, Veer, ShinnType, OurType, Type-Together, and so many others conduct their business.  If they don't have a similar policy, it's not as helpful to me as Village's policy, but so be it.  I still love their work and the amazing talent of the designers.  I will still purchase fonts from them.  Some other posters on this thread will not.  Can you identify the difference between my approach and theirs?</p>
      <p>* I did not use the "times are tough, lower your prices" argument.  What I said was, in these difficult economic times, a policy like Village's Taste Test upgrade policy was appealing and friendly.  </p>
      <p>I'm not *telling* other foundries how to price their fonts.  The whole thread started as a conversation about what type of purchasing and upgarding policy might be helpful to the limited-budget consumer.  At no point have I wanted Village to "lower" its prices because I think their prices are too high.  It's about the upgrading policy, not the prices. It's a subtle distinction but I hope it can be discerned.</p>
      <p>* There's this idea that if you don't like my business policy, spend your money elsewhere.  But don't try to have a conversation with me about it.  Any such conversation can only be "a malignant effort to manipulate public opinion."</p>
      <p>Well, no one is lining up outside your office with pitch forks and torches.  This is a forum.  This is a place to have conversations.  It's not just about markets and money, it's also about ideas and conversations and exchanges and partnerships and the acknowledgment that we are all living in a mutually interdependent ecosystem.   </p>
      <p>Every new idea was once considered "a malignant effort to manipulate public opinion" and those who spearheaded these kinds of efforts were quickly given a hemlock latte with extra whip.</p>
      <p>It is simply not helpful to tell us to "stop whining, get a life, get a job, etc": essentially, drink your hemlock and shut up.</p>
      <p>No one is threatening you and your business and your right to earn a living.  Please proceed as usual, and much success to you.  Live and let live.</p>
      <p>My original intent/suggestion was actually very simple:</p>
      <p>Village's Taste Test policy, wonderful idea, wonder if other foundries already do something similar, wonder if it helps us make more purchases and helps them make more money and support their business efforts.</p>
      <p>Wonder if we could create more win-win situations in the typeface purchasing world through ideas *like* this, not necessarily identical to this?</p>
      <p>I sincerely hope I have been clear about my position.</p>
      <p>Rahim</p>
