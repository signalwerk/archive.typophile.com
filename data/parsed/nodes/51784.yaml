      <p>Something else I'd like somebody to please explain to me; I'll give an example: </p>
      <p>Let's say I first license Sansa Light. Turns out I need additional weights, so I purchase a license for the Sansa 1 volume. And demand a partial refund. But then I need even more weights, and I purchase a license for the Sansa Family. And demand a partial refund. My client branches out in Central Europe, so I need to purchase a license for Sansa Professional. And demand a partial refund. But then I want to diversify the design a bit, and I purchase a license for Sansa Soft. And demand a partial refund. At some point I need a serif face to match all of those, and I purchase a license for Sansa Slab. And demand a partial refund.</p>
      <p>How the flying firetruck do you expect anyone to keep track of this unholy mess? It's fairly simple if you are a boutique type shop like Village and it's great that they offer this, but for a large font vendor this is a card-carrying logistic nightmare.</p>
