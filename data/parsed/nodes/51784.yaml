      <p>Rahim, your artfully capitalized thread title is provocative, but you don't seem to understand the simple retail principle at work here, Volume Discount.</p>
      <p>The benefit for the seller is to make a larger, immediate sale.<br>
      The benefit for the purchaser is a reduced per-unit cost.</p>
      <p>The fact that the "full set" contains what may be licensed separately is immaterial.<br>
      Where is the incentive if there is no disincentive?</p>
      <p>The way it work is like this (and I use my most recent release, Beaufort Pro):</p>
      <p>Single font: $59<br>
      Package of ten: $299 (unit price 29.90)<br>
      Buy two now, package later: $417 (unit price 41.70)</p>
      <p>Isn't that still a deal?<br>
      And you're making out like I'm ripping people off?!<br>
      Do the math, get a life, make some money, and if you're offered a deal, don't go dissing whoever made it because they're not as "upgrade friendly" as your greedy heart desires.</p>
      <p>**</p>
      <p>Having said that, I can't deny that the Village offer makes a lot of sense.<br>
      Canada Type also has an interesting idea, with differential licence options for the same product.<br>
      And of course there are "get this font free, pay for the other family members later" offers, such as those from exljbris.<br>
      But the good old "family discount" is still a great deal for purchasers.</p>
