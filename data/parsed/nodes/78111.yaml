  html: |-
    <p>An old friend of mine from Brooklyn, NY, Michelle Herman, professor of creative writing/comparative lit at Ohio State University posted using an emoticon as an ending paren.<br>
    As in her quip:<br>
    <em>"OK, I hereby declare myself in charge of deciding how to punctuate using a parenthetical emoticon: said emoticon WILL do double-duty as a close-parenthesis. (And that is the last word on that subject :)"</em></p>
    <p>Hmmmm... Whaddaya think? It <strong>is</strong> economical. (This is certainly a case for the Typophiles :-)</p>
