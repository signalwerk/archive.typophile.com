      <p>Some of the characters seem smaller. It seems your overshoot isn't very consistent. Consider adding overshoot to:<br>
      - bowl of the <strong>a</strong><br>
      - bottom of the bowl of the <strong>b</strong><br>
      - bottom of the <strong>c</strong><br>
      - bottom of the bowl of the <strong>d</strong><br>
      - top of the <strong>g</strong><br>
      - top of the <strong>m</strong> (compare to <strong>n</strong>)<br>
      - bowl of the <strong>p</strong><br>
      - bottom of the <strong>u</strong></p>
      <p>Lower the crossbar of the <strong>f</strong>, it's above the x-hight. I would lower the waist of the <strong>k</strong> slightly, as well. The <strong>s</strong> is falling to the left. The <strong>y</strong> is fine, but you could try what happens if you let the two strokes of the <strong>y</strong> meet on the baseline.</p>
      <p>I agree with Thomas about the caps. They are ok on themselves, but compared to the lowercase, they do seem to be somewhat narrow. Also the dots on the <strong>i</strong>, the period and the comma are very large.</p>
