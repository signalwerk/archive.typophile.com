      <p>I don't usually venture into the "critique" section, but I was just browsing the new posts and thought "Antarctica? Who's posting about typography in Antarctica? I have to see this...."</p>
      <p>General: You're heading towards a usable modern sans, pretty monoline. Nothing wrong with that. I'm a little surprised by the proportions in that the caps feel a significantly more condensed than the lowercase: I compare the lowercase oh to the cap Oh for instance. That could simply be one of the hallmarks of the typeface, as long as you're aware of it and doing it on purpose.</p>
      <p>Details that need work:</p>
      <p>Your i and j dots look a bit heavy.</p>
      <p>The top arch of the "r" seems heavier than other horizontal round strokes (there are times when this can work, but it's usually when that arch is very curved and the join is quite incised, rather than such a long flat stroke).</p>
      <p>The left side of the "j" doesn't need such a honking big sidebearing given that the curve is below the baseline - just kern it away if it follows g or q.</p>
      <p>The tilde is too light. There's some good writing about accent weight and design (a.k.a. diacritics) online, which you should dig into at some point.</p>
      <p>The small "s" feels a bit too much like two nice curvy bits that got glued together - need to work on the spine in the middle. The bottom curve of the cap S needs work, feels very lumpy, and also has a bit of the join problem but in a different spot (slightly further down to the right).</p>
      <p>The lowercase "a" feels a bit wide compared to the e and o.</p>
      <p>The shape of the "R" bowl where the leg joins it feels a little smushed in (towards the bowl). Normally I'd expect the R and P bowls to be similar in shape, although the P bowl can be slightly larger/lower if you wish.</p>
      <p>Certain places where a round shape becomes straight the join looks awkward and could be slightly more gradual. For example, the bottom part of the P bowl (whereas the top is better).</p>
      <p>There is some odd lumpiness in just a few of the curves that makes me suspect you're using more control points than needed, or perhaps it's just the placement that needs work. I see this when zooming in on the lowercase "c" for instance. Maybe I'm tired or imagining it, I dunno.</p>
      <p>Cheers,</p>
      <p>T</p>
