    html: |-
      <p>If you can get narrow and happy, more power to you. I think it's a good idea. As of now, to me it looks too much like an artificially narrowed or 'squooshed' face. It has a 'reversed contrast' look even though it may not be geometrically if you measure it. To look equal the verticals have to be thicker than the horizontals, and the vertical rounds have to be thicker than the vertical stems. </p>
      <p>If you *want* to go for a reversed contrast look, compare Antique Olive or the typefaces of <a class="freelinking external" href="http://www.fontshop.com/fonts/designer/evert_bloemsma/" rel="nofollow">Evert Bloesma</a>, especially FF Balance and Legato. A narrow face that works very well for readability is Gerard Unger's <a class="freelinking external" href="http://www.gerardunger.com/fontstore/store-vesta.html" rel="nofollow">Vesta</a>, though it is very neutral, and not what you are going for. </p>
      <p>Also, your straight-to-round curves are often lumpy. At this point getting the weights and shapes good is probably more important, but down the road these should be worked on as this sleek style calls for a high polish. </p>
      <p>I know you can do 'happy' wonderfully well from your fat and happy typeface. This has promise, and is worth working on, but does have a way to go to get what you are aiming at.</p>
