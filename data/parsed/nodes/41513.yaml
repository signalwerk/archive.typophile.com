      <p>I think that the lowercase c and a are the strongest characters i see. There's something about the curves on the top that I feel should be mirrored in the ear of the lowercase r, h, et cetera. The lowercase t is really tall. Most faces have the t actually lower than the tittle on the lowercase i, and the h, k, l and f higher. On a lot of faces, the lc l is higher than the uppercase I.</p>
      <p>It seems that the caps almost look like you're trying to make them monospaced, especially the M. Try to rely more on optics than precise measurements. This is something i'm trying to get out of as well.</p>
      <p>The letterspacing that you have for your main image (where it just says Antarctica) works much better than on your pdf for test 2.</p>
      <p>I think it's a very interesting typeface, i think it's somewhere between Verdana and Univers. I will look forward to what becomes of it!</p>
