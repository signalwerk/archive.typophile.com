    <p>Hi again. :)</p>
    <p>Also, and while I’m here, I wonder if I might take the chance to request for another type id?…</p>
    <p>I’ve been trying but having a hard time identifying this font family (have, also for this one, asked about in other forums, yet so far no luck), and I’d very much appreciate it if someone might please help…</p>
    <p>For bigger display of the logos I attached to this thread, please see: <a href="http://www.rtp.pt/web/rtp_nova_imagem/holding/logotipo/rtp_holding/h/RTP%20RGB%20positivo%20horizontal.jpg">RTP-logo1</a> and <a href="http://www.rtp.pt/web/rtp_nova_imagem/rtp/logotipos/rtp/h/RTP%20RGB%20positivo%20horizontal.jpg">RTP-logo2</a></p>
    <p>(In the samples I provide, I know there is more than a single weight of this font, yet don’t mind about identifying each specific weight, no need for all such trouble, I only wish and very much will be happy to find out the name of just the font family for this typeface. Also, if additional samples would be required, I can provide. Or alternatively, you can browse through the site of <a href="http://www.rtp.pt">RTP</a>, where you’ll find more samples of this font.)</p>
    <p>Thank you greatly, once again, for any help. :)</p>
    <p></p><div class="imageWrap"><img src="files/rtp.jpg"></div><p></p>
