    html: <p>Note that most basic Arabic script shaping does not involve ligatures per se, but applies the 'init' 'medi' and 'fina' features as appropriate based on analysis of the character string. The 'rlig' feature should be used for the obligatory لا and any other ligature that you want to be on by default. On Windows, most applications rely on the MS Uniscribe script engine for Arabic shaping; I'm afraid I don't know what Flash does or how it provides cross-platform capability. The Uniscribe engine will automatically apply both the 'rlig' and 'liga' features for Arabic text.</p>
