      <p>I'm no expert here, but I don't believe you have any control over which glyphs or OpenType features an application can/will display. For example, InDesign CS2 is the ONLY application I know of that will recognize and implement stylistic sets; all other applications simply don't recognize this feature. Similarly, accessing non-default numbers, small caps, alternate glyphs, etc., in an OpenType font is all but impossible except in the most recent &amp; specialized applications. This is simply a matter of the application catching up to OpenType/Unicode.</p>
      <p>My guess is that MM simply didn't think Flash users were big on advanced typography, so didn't bother to build in the necessary glyph palette (hell, even some Adobe CS2 applications keep you from accessing many glyphs &amp; features). So, it seems your only option is to nag MM/Adobe to improve this in the next version of Flash (or whatever it might be called now that Adobe has it).</p>
