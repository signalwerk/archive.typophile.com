    <p>I just spent the last week learning how to create a font so that I can create a fully functional arabic font with ligatures and diacratic marks and an Open Type library etc....<br>
    Well, I just tried to enter arabic text from the "Times New Roman" font into a static text box in macromedia flash, and the characters would not merge(i.e. the glyph's did not automatically change to the correct contextual ones).<br>
    After hours of searching, I'm assuming its hopeless, but as a last ditch effort, I'd like to know if there is something I can possibly do when building my font to make the ligatures and diacratic marks appear as I want them to in Macromedia Flash (rather than as separate letters, I'd like them to join together, much like this:<br>
     با = ا + ب</p>
    <p>well, if anyone knows of anything that I can do when creating my font, I would appreciate it.<br>
    thnx</p>
