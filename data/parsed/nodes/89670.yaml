    <p>First thing, I have both severe dyslexia and severe spatial dysgraphia so communicating by typing is super difficult for me. If you want me to reply to something please give me a call.<br>
    1.786.234.9582<br>
    If you do not need a reply you can post on this site or at</p>
    <p><a href="http://www.kickstarter.com/projects/2112689177/man-greater-than-money?ref=email" title="http://www.kickstarter.com/projects/2112689177/man-greater-than-money?ref=email">http://www.kickstarter.com/projects/2112689177/man-greater-than-money?re...</a></p>
    <p>Some of you will love this font and some of you will hate it.</p>
    <p>The Man Greater Than Money Font blatantly ignores traditional notions of typography to achieve harmonious word shapes without awkward negative spaces or strokes. The letters are not really letters but instead highly legible geometric forms so that these shapes can function as visual elements within the layout.</p>
    <p>I commenced working on this font 17 years ago and created it to be used exclusively in secondary display settings; especially for magazine layouts because I do so many. </p>
    <p>Due to space limitations, the full “Man Greater Than Money” font can’t be shown.  The Man Greater Than Money Font contains: Basics, Alternates, Display figure (not shown to conserve space), Universal Accents, Tabular figures (not shown to conserve space), Diacritics, Flips, Cyrillics (not shown to conserve space), Diphthongs (not shown to conserve space) and  Akhand Ligatures (not shown to conserve space). Yes, that's tens of thousands of Alternate glyphs in a single font that does not even have any minuscules.</p>
    <p>You can see the font here<br>
    <a href="http://www.kickstarter.com/projects/2112689177/man-greater-than-money?ref=email" title="http://www.kickstarter.com/projects/2112689177/man-greater-than-money?ref=email">http://www.kickstarter.com/projects/2112689177/man-greater-than-money?re...</a></p>
    <p>Please help me get the word out on this font.</p>
    <p>Thank you,<br>
    Alfonso<br>
    Man Greater Than Money</p>
