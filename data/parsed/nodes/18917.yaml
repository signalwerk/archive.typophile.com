    <p>Hello all. </p>
    <p>I’m currently working on an identity for an annual gala, for a sports organization that will be held in (southern) Sweden. The brief was to develop a typographical solution only (no symbols) and it had to be bold. I was also required to use the green that you see in the attachment (not really accurate when ’saved for web’. It will be more vibrant. Also, the mark would have to suitable for broadcasting on TV.</p>
    <p>Just to break it down, ’Malmö’ is a city in southern Sweden, and ’Galan’ is - you guessed it! - swedish for gala. In english ’The Malmo Gala’. Not very original maybe, but I think it gets the message accross. Besides, I don’t have any say in the actual wording. </p>
    <p>Out of the four, which works best?  Most of the type is custom, apart from Harlow and certain elements of Bauhaus 93. Personally I feel that the bottom alternative has most character and would be most suitable. </p>
    <p>Greatful for any response.</p>
    <p>S.</p><div class="imageWrap"><img src="/files/concepts.gif"></div><p></p>
