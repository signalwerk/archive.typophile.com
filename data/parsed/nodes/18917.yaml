      <p>I don’t understand why the cap height of the two words should be different. I’m afraid you need to look further at the kerning, if you take MO as a base then MA, AL and AN need more space. You could put in some work on the bar of the G and the LM and LA could do with a bit more separation to distinguish it from IM, IA. As a thought you could look at making MALMÖ in to a triline, which might give it a running track feel and will lighten the grey, which is still dominating GALAN.<br>
      Tim</p>
