    date: 2014-08-01T10:38:00
    votes: null
    html: <p>Why would you use this for text though? It seems weird to use a Western/Eastern hybrid in such a context. I wouldn't consider it appropriate. I would probably use it as a display type if my talk involved Western typography. Using it because it "evokes the non-Latin world" (which, to me it doesn't to the extent I think you're implying) seems silly. Isn't your choice in selecting this typeface a matter of personal indulgement rather than practical, appropriate use?</p>
  - id: 584993
    user_id: 1250
    user_name: hrant
    user_path: null
    date_raw: 5 Aug 2014 — 4:20pm
    date: 2014-08-05T16:20:00
    votes: null
    html: |-
      <p>Actually I ended up using Trilby for most of the text (which wasn't that much anyway though) and I used Mønster for the titles.</p>
      <p>But I feel they both do evoke the non-Latin world (in fact David seems to ascribe his attraction to "reverse-contrast" to his Jewish background) which is appropriate because my talk was about how Latin libre fonts should be made more open to non-Latin extensions (by adopting an Apache license instead of OFL).</p>
      <p>hhp</p>
