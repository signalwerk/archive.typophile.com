    <p></p><div class="imageWrap"><img src="http://typophile.com/files/monster-underskog_4819.jpg"></div><p></p>
    <p>Whereas most reverse contrast slab serifs bear the dusty smell of Wild West, <em>Mønster</em> by Sindre Bremnes stands out with a scent of the orient. More eastern than western in its design, this clash of cultures is tightly spaced for creating striking headlines. Named after the Norwegian word for “pattern”, Mønster’s odd letter forms and exaggerated shapes combine into powerful, vigorous patterns, making a bold statement of any title. <a href="https://monokrom.no/fonts/monster/design" rel="nofollow">Read more about the design.</a><a></a></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/monster-plakat1_6074.jpg"></div><p></p>
    <p>On occasion of the Norwegian Constitution Day – the 17th of May – we’re offering a 17% discount with the coupon code “sekkeløp”. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/seventeen_4407.png"></div><p></p>
