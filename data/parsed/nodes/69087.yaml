      I thought Tatweel Insertion, is a specific algorithm designed by unicode, like as bi-directional algorithm. isn't?<br>
      so, if Microsoft office Word 2007 don't implement a correct algorithm, do you know another typesetting system do? i don't know anything about TeX based Arabic systems, but i'm pretty sure that XePersian justifies text by adding more space between words.<br>
      Another way: is OpenType Turing-Complete or Turing-Consistent?<br>
