    html: |-
      <p>I met with some MS Office and shaping engine developers this week. There's general acknowledgement that kashida insertion is very buggy and needs to be improved. I'm working on this with them now, but my guess is that it will be a long time before improvements are coded, tested and rolled into shipping software.</p>
      <p>Unfortunately, using ligatures doesn't really help much, because in some situations the kashida insertion loging will try to put a kashida between two letters that are ligated, but Word loses track of the relationship of glyphs to characters and the kashida is displayed after the ligature:<br><img src="/sites/default/files/old-images/morekashidaproblems_4523.gif"></p>
      <p>For now, my advice to users is simply not to use kashida justification at all.</p>
