    For a long time I follow posts of this site, and learn a lot about <a href="/node/38857" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Arabic</a> typography. this is my first post in this interest group.<br>
    I'm designing <a href="/node/57832" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Nastaliq</a> and badr fonts. i have some problems with <a href="/node/add/wiki?edit%5Btitle%5D=kashida" title="Create node &quot;kashida&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">kashida</a> (tatweel) appeared automatically when justifying; especially with MS Word some other famous fonts have same problem (font of image is Scheherazade):<br><img src="/sites/default/files/old-images/tatweel_5071.JPG"><br>
    How can i prevent? should i use cswh?</p>
