      <p>In Portuguese the word and is represented by the letter "e" so the &amp; is rarely used as an alternative. Even so i use it as much as possible, mainly when i write &amp;c.<br>
      I also must say that, personally, i don't see any problem when the et ligature is really obvious... but then again Portuguese words will always have a close connection to their Latin predecessors. Et works perfectly on French as well, so i can see why some designers are making this ligature more obvious. I do understand that in English reading "et" may come out confusing but then again, in my opinion, the &amp; has it's own reading!</p>
      <p>Sorry, if this post got confusing... is getting late here and I'm just too sleepy!</p>
