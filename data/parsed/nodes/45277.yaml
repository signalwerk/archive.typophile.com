      <p>"Why can't people educate themselves about glyphs?"</p>
      <p>First of all, if you are talking about the ct-ligature in general, and the ampersand in general, they are not "glyphs" but "characters." If you are talking about, say, the Garamond Premier Pro ct-ligature and ampersand, those are glyphs.</p>
