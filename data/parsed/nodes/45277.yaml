      <p>I think that the ampersand is one of those characters that has so many half-accepted forms that it has a wider spectrum of acceptable variations (with regard to basic legibility) than most characters. Maybe I'm off the mark, but I feel as if nearly any funky, pretzelish symbol interposed between two words will be  read as "and."</p>
