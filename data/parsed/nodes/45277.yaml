      <p>&gt;Isn’t this rather undermined by your choice of profile image...?</p>
      <p>I don't think so. The E in the Caslon italic ampersand (in this case my version) is readable, but that swashy curly stuff on the right doesn't "read" as a "t".  I think only if you know that the ampersand is derived from "et", which most people don't, would you puzzle out that the right part evolved from a "t".</p>
  - id: 278942
    user: 3254
    date: 2008-05-16T09:23:00
    date_raw: 16 May 2008 — 9:23am
    votes: null
    html: <p>You don't think it's a mistake to make it look too much like a swash E, then?</p>
  - id: 278951
    user: 1551
    date: 2008-05-16T09:45:00
    date_raw: 16 May 2008 — 9:45am
    votes: null
    html: <p>Honestly, it's a matter of what people are accustomed to seeing. So I don't think people have a problem with the evident E in the Caslon (and some other old style) italics. The symbol as a whole doesn't read as any word, and that I think is helpful. By the way, it was interesting to me that when I worked on my swash italic E, I couldn't take it from the ampersand. I tried it and it wouldn't work. I did use a curly E but had to change the form pretty completely. (Caslon himself never did a swash E. All those are Victorian and later.)</p>
