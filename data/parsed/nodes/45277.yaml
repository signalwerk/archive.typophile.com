  - id: 278181
    user: 1551
    date: 2008-05-13T10:42:00
    date_raw: 13 May 2008 — 10:42am
    votes: null
    html: <p>Personally, I think it's a mistake to make the ampersand look too much like "Et," the latin word for "and," from which it derives. Recently a number of fonts have done it, but to me it's distracting. The most of the old ampersands are notable in not 'reading' as "et," even though you can figure how they "got here from there" when you inspect them.</p>
  - id: 278198
    user: 9913
    date: 2008-05-13T12:14:00
    date_raw: 13 May 2008 — 12:14pm
    votes: null
    html: <p>Good point. You don't want people saying "et" when they read an ampersand. This may be a bit off topic, but does anyone know of an ampersand that uses shapes from a, n, and d? I guess that would be sort-of English only, and probably something lots of people would find distracting.</p>
