    html: |-
      <p>Thanks. After some research, it's a bespoke (as almost all big tunas on this market) called '<a class="freelinking external" href="http://www.researchstudios.com/2010/07/29/research-the-times" rel="nofollow">Times Modern</a>' by Research Studios under the Art Direction of its founder Neville Brody.<br>
      2 nice alternatives and commercially available would be <a class="freelinking external" href="http://www.myfonts.com/search/acta" rel="nofollow">Acta</a> family by Dino dos Santos and <a href="/wiki/https%3A/%252Fcommercialtype.com/typefaces/publico" class="freelinking" rel="nofollow">Publico</a> by Christian Schwartz and Kai Bernau for Commercial Type (originally created for the Lisbon newspaper 'Público').</p>
