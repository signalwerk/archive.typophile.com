    <p>Hi!</p>
    <p>I'm looking to find out what are the headline and text faces currently in use in the printed version of The Times newspaper in the UK.</p>
    <p>I know I probably should've already heard of this and I did read an article about the redesign not too long ago but now I can't seem to find out what they are, and to top it off searching for it elsewhere proved a fruitless effort as the only thing that would ever come up is Times New Roman. I know it's a stupid question but help me out here?</p>
    <p>thank you :-)</p>
