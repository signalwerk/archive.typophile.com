      <p>I ended up asking the staff designer that did these posters about the typeface.</p>
      <p>It turns out that it's taken from a book called <a class="freelinking external" href="http://www.redstonepress.co.uk/abz.htm" rel="nofollow">ABZ: Alphabets and Other Signs</a> that displays mostly oddball typography.</p>
      <p>The designer said that there is no existing vector or digital version of the font.</p>
      <p>Below is from what I'm assuming the above typeface is based on, it's from page 148 of ABZ.</p>
      <p>Looking further and now knowing that this italic is soviet Czech, I think that it and <a class="freelinking external" href="http://www.myfonts.com/fonts/dizajndesign/komu/a/" rel="nofollow">Komu A</a> have a similar design origin.</p>
      <p>EDIT:</p>
      <p>I found this on page 103 of ABZ, the table of contents identifies it as being from a signwriter's handbook called <a class="freelinking external" href="http://cargocollective.com/Central_Station/Pismo-a-Jeho-Konstrukce-1950s-Czech-Typography" rel="nofollow">Písmo a Jeho Konstrukce</a> (transl. 'The Font and Its Construction'), by Richard Pípal, 1956.</p>
