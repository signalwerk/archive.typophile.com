    <p>Ken Bessie, Lex Kominek, and I had the second Calgary Typophile meet-up last night at a conveniently located pub, where we were faced with the sign below.  </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Beer-ad-serif_6433.jpg"></div><p></p>
    <p>Much to the amusement of the other people with whom we were sharing a table, we tried, unsuccessfully, to identify this face: heck, it even stumped Lex!  (No, we hadn't had that many beers either.)</p>
    <p>Apart from the fact that the kerning leaves a fair bit to be desired (and what's with those periods?), would someone else like to take a stab at this one?</p>
    <p>(And if you're in Calgary and want to come along to the next event, ask one of us for details.)</p>
