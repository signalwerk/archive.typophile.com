      <p>Hi there:</p>
      <p>A great deal of Adidas campaigns (and other shoemakers) use custom proprietary type designs that are not available for license for you and me. I’m not sure if your sample graphic falls into this category but here are some fonts that I think that look close to it:</p>
      <p>This looks like a rounded version of FB Stainless.<br>
      <a href="http://www.fontbureau.com/fonts/Stainless" title="http://www.fontbureau.com/fonts/Stainless">http://www.fontbureau.com/fonts/Stainless</a></p>
      <p>But you can also have a look at Neo San and Neo Tech.<br>
      <a href="http://www.fonts.com/findfonts/detail.htm?pid=415092&amp;grab_id=0&amp;page_id=3336&amp;query=neo%20sans&amp;SCOPE=Fonts" title="http://www.fonts.com/findfonts/detail.htm?pid=415092&amp;grab_id=0&amp;page_id=3336&amp;query=neo%20sans&amp;SCOPE=Fonts">http://www.fonts.com/findfonts/detail.htm?pid=415092&amp;grab_id=0&amp;page_id=3...</a></p>
      <p>Mike Diaz</p>
