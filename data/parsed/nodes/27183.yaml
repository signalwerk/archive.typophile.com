  html: <p>Punchcut is seeking a mid-level interface designer for a full- <br>time, contract to hire position (temp to perm). You will design  <br>and produce interface elements, web sites and Flash media  <br>assets under the direction of a creative director and in  <br>collaboration with Flash developers as needed. <br> <br><b>The ideal candidate:</b> <br>- Has a BFA or equivalent in graphic design <br>- Is seasoned with 3 to 5 years of real-world interface design experience <br>- Is passionate about design and wants to grow with us <br>- Approaches interface design conceptually and systematically <br>- Is highly organized and detail oriented <br>- Is proficient in Photoshop, Illustrator and InDesign (in that order) <br>- Has a basic knowledge of Flash (knows how to prepare art for Flash) <br>- Loves pixels and understands the pros and cons of various web image formats <br>- Can prepare and organize perfect files in his/her sleep <br>- Has agency experience (though this is not a requirement) <br> <br>Interested candidates should send a cover letter, resume, and  <br>online work samples to work-at-punchcut.com.  Please do not  <br>reply to this post with your links/resumes/contact info. (No  <br>employment related phone calls please.) <br> <br>For information about Punchcut, please refer to  <br><a href="http://www.punchcut.com" target="_blank">http://www.punchcut.com</a></p>
