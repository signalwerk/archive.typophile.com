    html: "<p>I've applied my own rigorous 72 hour rule for this <br>reply. If you read any of this at all, please read the <br>whole thing so I'm not misunderstood. <br> <br>I hope I can say this once and get it off my chest <br>forever. More than that I hope Hrant doesn't respond. <br>I've written drafts of this letter many times over the <br>span of my involvement here; some for Hrant in private, <br>some for the public. Most sat forever, unposted. One or <br>two got sent to him privately as formal censures, but <br>wait; Jared got to write those. <br> <br>I've never commented publicly, mainly because I didn't <br>think Hrant would take it as helpful criticism and also <br>because I thought posting it online would be <br>inappropriate. <br> <br>In some ways I'm posting this in hopes we can move on. <br>In other ways, I'm really hoping Hrant is listening for <br>his sake and ours (so he can help us move on). I'm also <br>tempted to link to two-year old posts so some of you <br>new folks can see what all the fuss is about, and that <br>Hrant has come a long way, but the archives have saved <br>me the effort and spared us all the past. A past that <br>hopefully we can all laugh about later. <br> <br>Lastly, I won't speak as a moderator/partner here. It's <br>just me. Hrant hasn't asked for this thread, nor does <br>he deserve more air time (or scolding for that matter), <br>but in so many ways he has been asking for it for a <br>very long time and rightfully deserves a lengthy public <br>scolding in the form of a roast from someone who likes <br>to think he cares. <br> <br>I could just second most of what Jon Coltz and all of <br>what John Hudson wrote and sit down. I could just agree <br>with anonymous, that Hrant is a tedious, insufferable <br>bigot. I do think I have a different perspective to <br>offer and hopefully it can be taken constructively by <br>Hrant and his detractors. (Besides, John's British <br>roots betrayed him; he was way too polite for Hrant to <br>actually see the critique. =) <br> <br>I'll be as blunt as Hrant seems to prefer and I'm going <br>to try to be candid and also fair. Hrant needs to <br>change, frankly in ways I'm skeptical are possible. The <br>Type community, including myself, needs to change: to <br>consider Hrant for what he is now, and move on. The <br>only caveat is, I've never met him. I don't read every <br>single post here (or elsewhere) so I don't consider <br>myself privy to everything he says or did in his past <br>life. <br> <br>On to the letter. <br> <br>_________________________ <br> <br>Jon, <br> <br>In some ways I agree. In other ways Hrant angers me <br>beyond words. Thanks for giving me a platform for my <br>vent and call to action. <br> <br>I've heard too many people, whom I respect and whose <br>experience I would love to hear from more, say he's the <br>reason they don't post more. That's a shame. <br> <br>But I believe he's becoming sufficiently *ignorable for <br>those who find him insufferable. (I'll elaborate <br>later.) <br> <br>Like Yves, I too believe Hrant's not a bad guy, I know <br>he's had a legal run-in with a major foundry in the <br>past which, to my 3rd-hand knowledge is resolved and <br>forgiven by all parties (if I'm wrong someone will <br>correct me within the hour) and is deeper than being <br>removed from any online discussion, but not so deep <br>that the type community should hang him out to dry. I <br>don't fully know the details, nor should we care, <br>unless they are pertinent or threatening or affect us <br>personally. I even believe, if one are sincere and <br>Hrant sensed that sincerity, he'd probably tell about <br>it. Finally, from what I can tell, Hrant never holds a <br>grudge. Okay, so I shouldn't say never, but at least <br>when he holds a grudge you'll know about it. For these <br>reasons I no longer question his motives, only his <br>approach. <br> <br><b>That's the past baggage,</b> that'</p>"
