    html: <p>I agree that in the online medium we should be extra  <br>cautious about when we choose to be offended (yes, I think  <br>it is a choice). <br> <br>But the onus should always be on the one speaking to seek  <br>to be understood, not always counting on the listener to  <br>understand.</p>
