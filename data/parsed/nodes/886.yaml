    html: <p>Hrant, <br> <br>Our posts overlapped. Playwright Tennessee Williams said,  <br> <br>"All cruel people describe themselves as paragons of frankness." <br> <br>I don't mean to label you with this quote, but do I use it to make clear that candor is not the only virtue. In any case, it is perfectly possible to be candid about typography etc without being candid about what a knave or fool you think the other person is. What positive purpose is served by name calling? <br> <br></p>
