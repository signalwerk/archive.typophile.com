    html: <p>Hrant, who would have known you would have been getting free therapy here? Progress, progress, progress. <br> <br>I'll admit, I have not been around here forever. But I do regularly read, if I do not participate, in many of the posts around here however. I do not read every one I admit. It would take to much time and I must make a living. <br> <br>I do however, perhaps more than anyone else's, follow  Hrant's posts. I find the discussions he participates in to be, more often than not, learning experiences. For that I am grateful. And for the most part (I've been around about a year now I think)  I have not seen Hrant attack anyone who did not deserve it.  <br> <br>In fact, many times, it seems as if a few have logged on for the purpose of attacking him. <br> <br>I feel that if anyone has been inappropriate around here, in proportion to the total number of times they have posted, it would be •••••• ••••••.  <br> <br>Well, Hrant, I would think that enough of the people around here would indeed know you well enough ( even on a forum ) not to be so offended by some of the things you say. It seems, according to your accusers, that you say these things often enough that they would carry little weight by now. But obviously you are respected. Not matter how many times you post <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>I for one, think it is wonderful, that you put with all of this, and still you are willing to share what you know about type. <br> <br>Thanks. <br> <br>Sean  <br> <br> <br> <br></p>
