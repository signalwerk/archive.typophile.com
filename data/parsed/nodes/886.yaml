    html: "<p>When I'm cruel, and I sometimes am, that's my failing, and I generally try to correct myself (assuming I even realize it). Usually when I \"offend\" it's simply because the other party doesn't like hearing the truth, even if it can only ever be a truth for a few other people. That's <i>their</i> failing. <br> <br>Candor is indeed not the only virtue, but I feel it's more important than tact, or even token respect. <br> <br>If you care about something, you'll be candid about it. If you have an acquaintance with a nose the size of an elephant's trunk, and you notice that it's preventing the person from getting a date, you'd be helping everybody by suggesting he consider getting a nose job. If the person is too insecure to handle a mere suggestion, that's not your fault - you did the right thing. <br> <br>&gt; What positive purpose is served by name calling? <br> <br>If you mean what I'm thinking, almost nothing. Calling somebody a \"jackass\" for example has no constructive value (except hopefully to trigger a fruitful opposing reaction - sometimes things have to hit bottom to bounce back), less because it's name-calling and more because it simply can't physically be true! But that sort of thing is pretty rare here. <br> <br>But when (on another list) I say something like \"Mr X is so blinded by calligraphy that he has trouble avoiding psychological lethargy in type design\", and a certain person thinks this is grounds for expelling me from the list (even though Mr X is not even a listmember!), then that person is an <i>intolerant</i>, and will never be at harmony in a multicultural milieu, unless he/she changes <i>inside</i>, as opposed to changing other people's superficial behavior. <br> <br>This is what we're really dealing with: <br>Insecurities turning into livid reactions, not merely feeling insulted at name-calling. <br> <br>hhp <br></p>"
