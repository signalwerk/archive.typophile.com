    <p>Hrant,  <br> <br>To further clarify what is 'bait': I mean a personal attack that diverts from the topic discussion. An attack on the other person's character, motives, professional competence, etc. is 'bait'even if the attack is based on truth.  <br> <br>Disagreements about typography, design etc would not be 'bait'.</p>
