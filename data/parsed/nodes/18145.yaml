      <p>—<br>
    <strong>TDC FontTech Weekend April 21-23, 2006</strong></p>
    <p>—<br>
    Expand your type designing and font production skillset at the TDC FontTech seminar. Learn the new advances in type design tools and their use.</p>
    <p>Join us for an intensive, two-day professional seminar and workshop presenting the most up-to-date information and advanced techniques in digital font production.</p>
    <p>Philosophy of Unicode, glyph and font naming, Python scripting, and font quality assurance and testing will be among the topics covered. An in-depth examination and demonstration of the latest versions of current font-making tools, including FontLab Studio 5 and Microsoft VTT &amp; VOLT, will also be presented to get you up to speed on advanced OpenType feature development and font making.</p>
    <p>—<br>
    <strong>Schedule</strong></p>
    <p>Friday night, April 21st — 6-8 p.m. — <em>Cocktail reception</em><br>
    Saturday and Sunday, April 22-23, 2006  9 a.m. to 5:30 p.m. — <em>Lunch<br>
    included</em></p>
    <p><strong>Speakers</strong></p>
    <p><em>John Hudson</em> is a type designer specializing in fonts for internationalization and multilingual computing. He is co-founder of Tiro Typeworks, and current vice-president of the Association Typographique Internationale (ATypI).</p>
    <p><em>Adam Twardoch</em> is Scripting Products and Marketing Manager at Fontlab Ltd. He also develops fonts and font tools for Linotype, MyFonts and other clients worldwide. Adam is the ATypI country delegate for Poland and he helps type designers to get their ogoneks right.</p>
    <p><em>Thomas Phinney</em> has long been intimately involved in the development and implementation of OpenType. He is Program Manager for Fonts and SING Technologies at Adobe Systems, where he has worked since 1997.</p>
