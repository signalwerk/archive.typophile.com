    html: |-
      <p>In my opinion the fonts shown in the image are not old fonts, but rather are modern designs, which may or may not be digital fonts. No problem with the sans-serif for BOURBON as mentioned in my earlier posts.<br>
      But "barrel STOUT" is a real Frankenstein.<br>
      Notice the differences between these letters and classic italics like Garamond <a href="http://www.myfonts.com/fonts/paratype/original-garamond-bt/" title="http://www.myfonts.com/fonts/paratype/original-garamond-bt/">http://www.myfonts.com/fonts/paratype/original-garamond-bt/</a> and Fleischman  <a href="http://www.myfonts.com/fonts/bitstream/fleischman-bt-pro/" title="http://www.myfonts.com/fonts/bitstream/fleischman-bt-pro/">http://www.myfonts.com/fonts/bitstream/fleischman-bt-pro/</a>.<br>
      The truncated ascenders, the almost vertical slope, the strange tail at the top of b, etc. What's this with a ball serif capital S? And how did square serifs from Egyptian end up on the T and U? This is not to say that someone has not packaged this mish mash as a font.<br>
      So if the Frankenfont does not turn up you could make reasonable facsimile of "barrel" by editing Fleishman. Other candidates for editing include Verdigris MVB Pro Text <a href="http://www.myfonts.com/fonts/mvbfonts/mbv-verdigris-pro/" title="http://www.myfonts.com/fonts/mvbfonts/mbv-verdigris-pro/">http://www.myfonts.com/fonts/mvbfonts/mbv-verdigris-pro/</a> ITC Cushing  <a href="http://www.myfonts.com/fonts/itc/cushing/" title="http://www.myfonts.com/fonts/itc/cushing/">http://www.myfonts.com/fonts/itc/cushing/</a> and Kis <a href="http://www.myfonts.com/fonts/bitstream/kis/" title="http://www.myfonts.com/fonts/bitstream/kis/">http://www.myfonts.com/fonts/bitstream/kis/</a><br>
      Don</p>
