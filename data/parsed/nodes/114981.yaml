    html: "<p>Can't agree more with Don's last comment. That doesn't look like old fonts at all to me. And actually, they are not: 'BOURBON' is most probably <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/linotype/trade-gothic\" rel=\"nofollow\">Trade Gothic</a> Bold #2 and 'barrel STOUT' is <a class=\"freelinking external\" href=\"http://www.myfonts.com/fonts/emigre/matrix-ii-ot\" rel=\"nofollow\">Matrix II</a> Italic. Never been a great fan of Suzana Licko's design BTW.</p>"
