    <p>Hi, I’ve not used Illlustrator too much. I’ve just made a logo by breaking apart outlines of text and repositioning the frangments. </p>
    <p>It would be great if there was a way to join these little shapes, as I now have the larger shapes completed, but the fragments still appear when I select them with the pointer. Also I’d like to keep this file as vector art. </p>
    <p>Any advice would be much appreciated. I’ve included a small example...This is the N in my logo, I’d like only to keep the outline of the letter. </p>
    <p>Thank you, </p>
    <p>Jesse</p>
