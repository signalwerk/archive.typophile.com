    html: |-
      <p>Open the Pathfinder Pallet. Use the Select Tool (V) and select all the overlapping objects. In the Pathfinder Pallet use Compound Shape to make it one shape. If you like that then hit commit button.</p>
      <p>I have a cool tip on Pallet Management if you are interested.</p>
