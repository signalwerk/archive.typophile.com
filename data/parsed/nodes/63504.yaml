    <p>Hi</p>
    <p>We have seen in many fonts of ours that the ff ligature looses kerning information in Adobe InDesign CS3 and CS4.</p>
    <p>We put the ff ligature inside the same class as the lowercase f, but usually only the f will show kerning. This is only for the GPOS kern feature.</p>
    <p>Has anyone else come across this and found a solution?</p>
    <p>thanks</p>
