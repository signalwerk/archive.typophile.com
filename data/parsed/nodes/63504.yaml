      <p>jackson: <cite>You know when indesign transforms eszett to SS ...</cite></p>
      <p>Which btw is correct behavior, regardless of uppercase eszett having its own Unicode codepoint. Also see <a href="http://www.unicode.org/versions/Unicode5.1.0/#Tailored_Casing_Operations" target="_blank">the Unicode site</a> which says:<br><cite>In contrast, standard German orthography uses the string "SS" as uppercase mapping for small sharp s. Thus, with the default Unicode casing operations, capital sharp s will lowercase to small sharp s, but not the reverse: small sharp s uppercases to "SS".</cite></p>
