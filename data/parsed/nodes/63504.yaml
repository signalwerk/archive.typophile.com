    html: |-
      <p>@Jackson:</p>
      <p>No -- you haven't been doing it wrong. I've run into the same problem. My less-than-ideal solution was to duplicate my case/small caps features as stylistic sets.</p>
      <p>I doubt that this is restricted to InDesign since most fonts lack uppercase ß, and since until recently there wasn't even a unicode value assigned to this character, apps wouldn't have had a way to even check for its presence in a font.</p>
      <p>Note also that the 'case' feature as described by adobe/microsoft doesn't actually change lowercase letters into uppercase -- it affects punctuation and figures. While I can't see any harm in also converting letters, applications can't rely on this feature to do so, so they must implement their own all-caps routine.</p>
      <p>André</p>
