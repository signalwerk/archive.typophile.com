    html: |-
      <p>Just to clarify, I wasn't so much trying to make a specific point as I was thinking out loud.</p>
      <p>When I say that ß is a problematic character, I should perhaps have been clearer: it is problematic in the sense that, unlike most other alphabetic characters, ToLower(ToUpper(X)) is not an identity function with respect to ß, which occasionally means that it needs to be treated as a special case in code (application or OpenType) which deals with case-relations.</p>
      <p>Just to do some more thinking out loud, the distinction between characters and glyphs is somewhat less than clear-cut, and an argument could be made that the distinction between upper and lowercase letters is somewhat intermediate between the two. There are cases where the two clearly function as different characters (e.g. in mathematical notions, or when used to identify (proper) names), but when all-caps is applied for stylistic purposes there is certainly a sense in which this is closer to a glyph-level operation than it is to a character-level one (which is why 'sub a by A' makes considerably more sense as a GSUB rule than, say 'sub a by b' does).</p>
      <p>And the contexts in which one applies all-caps are almost invariably those contexts in which caps serve a more stylistic than semantic function -- while I could see myself typing my name in and applying all-caps to it, I couldn't see myself setting it in lowercase and then applying all-caps to the first character.</p>
      <p>For this reason, it doesn't seem entirely clear to me that all caps shouldn't be implemented as a glyph-level operation within a font.</p>
      <p>As for the 'correct' uppercase of ß, I agree that SS is correct, but I disagree that this implies that for a font to use an uppercase form of ß (when such a form is part of the design) would be incorrect (which you do not say, but which you seem to be hinting at).</p>
      <p>André</p>
