    html: |-
      <p>If by 'correct behaviour', you mean 'correct behaviour for an application' I agree with you fully -- even if a capital eszett is present, the application should treat SS as the default uppercase form.</p>
      <p>On the other hand, if by 'correct behaviour', you mean 'correct behaviour for a font', I think this really would depend on the font. If one were to include a capital eszett in a text face, I'd think it would be wise to treat the uppercase form as a discretionary variant; in a display face, though, I'd think the designer could for some faces decide that the uppercase form is integral to the face and should be used as the default form.</p>
      <p>Of course, this is currently moot since there isn't any facility in place to allow a font to provide its own all-caps mapping, but I've wondered on various occasions why the 'case' feature wasn't defined in a way which allowed for this functionality (where an application would call the case feature to create all-caps if it was present and then use its own mechanism as a fall-back for fonts which didn't implement this feature).</p>
      <p>I've run into a few applications which handle all-caps correctly for common bicameral scripts (latin, greek, cyrillic), but which don't handle it at all for less common bicameral scripts (e.g. Armenian). If a way were provided for all-caps functionality to be provided by the font, this would provide a way for a font designer of less-common scripts to ensure that lowercase-to-uppercase mappings were performed correctly (here of course I'm envisioning a future in which all applications are OT-savvy) as well as a way for designers to devise their own solutions to 'problematic' characters like eszett.</p>
      <p>André</p>
