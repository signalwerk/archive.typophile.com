      <p>The quote from the Unicode site should make it clear that the application's casing is correct according to German orthography.</p>
      <p>In your argument, InDesign's eszett casing which is <em>correct</em> according to German orthography and some applications' casing of other scripts which is <em>incorrect</em> according to the respective orthographies are treated as the same, which seems an odd way to make a point. Even more so since you suggest font-level (= <em>glyph-level</em>) fixes for what is an application-level (= <em>character-level</em>) operation: casing.<br>
      Consequently if there were an option for eszett casing, this would be an application-level option too.</p>
      <p>Eszett is not a problematic character and I wonder what makes you think it is. Referring to the Unicode link again: Correct casing is from eszett to two uppercase S. If a user wants to use the uppercase eszett, he needs to enter the according uppercase eszett <em>character</em> rather than perform a mere <em>glyph</em> substitution via OTL feature.</p>
