    html: |-
      <p>“Gothic” was the North American term for sans serif.<br>
      Hence Franklin Gothic, News Gothic, Trade Gothic, Century Gothic and more recently my Brown Gothic … and Gotham.</p>
      <p>However, perhaps due to the international nature of the present day font market, we now mostly refer to “sans serif” types, if not those that are speciﬁcally “grotesque”.</p>
