    html: |-
      <p>Gothic is an older term for sans-serif that is still commonly used in East Asian typography. More information can be found on the Wikipedia pages:</p>
      <p><a href="http://en.wikipedia.org/wiki/Sans-serif" title="http://en.wikipedia.org/wiki/Sans-serif">http://en.wikipedia.org/wiki/Sans-serif</a></p>
      <p><a href="http://en.wikipedia.org/wiki/East_Asian_gothic_typeface" title="http://en.wikipedia.org/wiki/East_Asian_gothic_typeface">http://en.wikipedia.org/wiki/East_Asian_gothic_typeface</a></p>
      <p>Apparently, <cite>"In English, Gothic is an outmoded typographic term for sans-serif. It was so named because the type color of early sans serif typefaces was thought to be similar to that of the blackletter or “gothic” script. The term “gothic” is now rare in English, having been largely replaced by "sans-serif" except in the names of some typefaces such as "Century Gothic"."</cite></p>
