  html: <p>I come across typefaces such as Trade Gothic yet it is a sans-serif. There's obviously a difference between that and blackletter so what am I misunderstanding?</p>
  html_clean: <p>I come across typefaces such as Trade Gothic yet it is a sans-serif. There's obviously a difference between that and blackletter so what am I misunderstanding?</p>
