      <p>I wasn’t just picking on Nele for language, that just happened to be one of several deﬁciences in the original post.</p>
      <p>You know, I read that post, and tried to ﬁgure it out, but I couldn’t, so I thought, why should I have to work so hard to help someone else, when they are a design communicator and do such a poor job of engaging me visually and helping me to understand their problem?</p>
      <p>The language wasn’t really an impediment (very minor errors), but rather an issue of a lack of typographic care, which I thought I’d mention, because the thoroughness of communication is insidious—if your attitude is, “oh this aspect isn’t important, I’ll just rough it,” that will come back to bite you.</p>
