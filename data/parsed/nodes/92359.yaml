    html: |-
      <p>I have done a fair bit of substitution coding, but I cannot understand what you are trying to do.<br>
      So how do you expect anyone to help you?<br>
      Well, I could understand if I tried really hard, but why should the reader bother if the writer doesn’t?</p>
      <p>As a piece of design communication, your post gets an F.<br>
      The principle here is more important than the project: never let your guard down—as a designer everything you do must be a professional-quality communication. (Until you become as successful as David Berlow.)</p>
      <p>Show an image of what you are trying to do (we are designers ﬁrst, not programmers!)<br>
      Post a link to your font.<br>
      And although English is not your ﬁrst language, so what? If you are posting in English, make your grammar and spelling perfect—which will help everyone reading, whether or not English is their first language.</p>
