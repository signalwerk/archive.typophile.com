    html: <p>There's no monospaced Lubalin Graph, but there is a <a href="http://www.fontshop.com/fonts/downloads/elsnerflake/itc_avant_garde_monospaced_ot/" rel="nofollow">monospaced ITC Avant Garde Gothic</a> which is Lubalin Graph's sans brother. I think that will be your best match.</p>
