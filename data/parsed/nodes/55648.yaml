      <p>Most American metal type foundries as well as Monotype, Linotype, and Ludlow, made faces along the lines of "Old English." If I recall right [my source books are buried at home], Monotype Old English was available in a range of sizes.</p>
      <p>ATF made numerous faces in this style. Among them are Typo Text, Waldorf Text, Engravers Text, Wedding Text, Shaw Text, Engravers Old English, American Text, and Cloister Black.</p>
      <p>Mostly in the USA these were used for "society" printing: wedding invitations, calling cards.</p>
      <p>I'm not sure I'd say many of these are actually very close to true Frakturs. European foundries made in metal some faces closer to true Frakturs, and I think some American foundries did also.</p>
      <p>As for your desire to "date these sorts", perhaps you can proof them or photograph them and put up something for us to look at.</p>
      <p>powers</p>
