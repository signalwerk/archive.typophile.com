    <p>Hey,</p>
    <p>today I went to a flea market here in Germany and found some nice Fraktur sorts. I bought some of them and searched for a computer typeface which looks similar.<br>
    "Old English Text MT" looks almost identical so my question is:</p>
    <p>Does anybody know if and when this typeface or a similar one were used for letterpress printing? I would really like to date these sorts so I would be glad if anyone could help me!</p>
    <p>Thanks a lot and with kindest regards,<br>
     RoyBasch</p>
