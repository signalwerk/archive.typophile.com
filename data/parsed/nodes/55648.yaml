      <p>English Monotype’s ‘Old English Text’, series 456 in their metal types, was an adaptation, to use a polite word, of the ‘Cloister Black’ or ‘Cloister Text’ of American Type Founders, which appears in their specimen book of 1906.</p>
      <p><img src="/sites/default/files/old-images/ATF Cloister Black 1 - 500_6257.jpg"></p>
      <p>This was the ATF version, with which Morris Fuller Benton was associated, of some genuine textura gothic types, like Priory Text, that were cast at that time in US and British typefoundries, mostly originating in the 18th century but based on types used in old English printing. </p>
      <p>Making the new type meant ‘modernizing and removing the irregularities of’ the historic faces, as Mac McGrew rightly says. It’s well done, but some people might think that all the life of the original type has been eliminated along with the irregularities. I do. But there doesn't currently seem to be much choice, either among digital types or metal ones.</p>
      <p>Fraktur is a different kind of gothic.</p>
