  html: |-
    <p>Hello Gals et Guys:</p>
    <p>I have a friend that seriously depends on Filemaker. He was using Georgia for form entry. I recommended he change the font to a sans to improve onscreen appearance on his iPad. Neue Helvetica is being used now which is magnitudes more legible. Remote or guest users also have the ability to make entries to the database.</p>
    <p>So here are some issues:</p>
    <p>I recommended to my friend that he use Neue Helvetica for the database because this font is present on all his idevices: iPad, iPhone, and mac. But when remote users make entries or changes, the database does not automatically convert the formatting to the font he specified.</p>
    <p>Is there a way to have Filemaker reformat remote or guest entries to the database default?</p>
    <p>Is it possible to upload other fonts onto the iPad or iPhone for database entry.</p>
    <p>While Neue Helvetica is okay. I am thinking that Corpid Semi Condensed is perfect for the job.</p>
    <p>I’m not sure if hinting is really an issue... some fonts that have hinting butcher the on-screen appearance.</p>
    <p>From what I understand, Filemaker does not accept opentype fonts on Windows.</p>
    <p>Please recommend space efficient sanserif types.</p>
    <p>I thought of Myriad, Frutiger, Corpid, and even Tahoma. Anything else I need to know.</p>
    <p>Thank you for your assistance,</p>
    <p>Mike Diaz :-)</p>
