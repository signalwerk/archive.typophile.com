      <p>Thanks for your reply, Eliason, you're absolutely right. The odd angles are all gone now. In fact, every single glyph is revised, and I've updated the preview image and the pdf. I've also started working on a boldface, but I'm resisting the temptation of starting work on the italic. (Gee, this is really ruining my social life.) </p>
      <p>Please, tell me what you think!</p>
