    html: <p>The fi-lig + accent is an interesting idea, but it might be distracting. Have you considered an alternate f, that doesn't stretch so far out to the right?</p>
  - id: 336752
    user_id: 39515
    user_name: Sindre
    user_path: null
    date_raw: 21 Mar 2009 — 5:47am
    date: 2009-03-21T05:47:00
    votes: null
    html: |-
      <p>Yes, as a matter of fact, I've made such a ligature for <a class="freelinking external" href="http://typophile.com/node/56025" rel="nofollow">Schola</a>, the typeface I'm working on at the moment. It's not shown in the specimen, though, but I will upload some text setting examples showing it later today, after a bit of spacing and kerning. </p>
      <p>Fí is a very frequent letter combination in Old Norse and Icelandic, as you probably know. </p>
      <p>I've abandoned work on Austeria, it was my very first attempt at drawing a typeface, and I think it needs major redrawing. Perhaps I'll start anew when Schola is finished; I still like the idea of mixing Fleischmann's quirkiness with Bodoni's austerity. I think Jorge Luis Borges would have liked such a typeface.</p>
