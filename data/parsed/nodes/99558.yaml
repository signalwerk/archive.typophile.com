    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SkyFonts-choose_screen_5905.jpg"></div><p></p>
    <p>Sign Up for Free: <a class="freelinking external" href="http://www.skyfonts.com " rel="nofollow">here</a>.<br>
    View Video: <a href="http://bit.ly/XnLxf6" title="http://bit.ly/XnLxf6">http://bit.ly/XnLxf6</a><br>
    Read Blog: <a href="http://blog.fonts.com/tag/skyfonts/" title="http://blog.fonts.com/tag/skyfonts/">http://blog.fonts.com/tag/skyfonts/</a></p>
    <p>Monotype has announced the commercial release of its <a class="freelinking external" href="http://www.skyfonts.com " rel="nofollow">SkyFonts™</a> service, a revolutionary system that enables typographic experimentation by allowing users to try or rent fully functional fonts. SkyFonts debuts with an inventory of more than 8,000 fonts.</p>
    <p>Users can try fonts for free for up to five minutes within any desktop application or spend credits to rent fonts for as long as they’re needed. When the trial or rental period expires or if the fonts are not renewed, they’re removed automatically from the user’s system.</p>
    <p>SkyFonts exits beta and launches commercially with several new enhancements:</p>
    <p>•	Credit model: Customers can now purchase credits that can be used to rent fonts. Use one credit to rent a font for one day or three credits to rent a font for one month (30 days). Credits are available in packs of 15 or more at $3.00 per credit, or less if purchased in quantity. Credits can be used for one year before expiring.</p>
    <p>•	Thousands More Fonts from Top Sources: Since the service’s debut in beta, more than 5,500 fonts have been added to the SkyFonts inventory. SkyFonts now offers more than 8,000 fonts from the Monotype® Libraries which include the Monotype, Linotype®, ITC®, Ascender® and Bitstream® collections. In addition, fonts are available from popular foundry partners including Mark Simonson Studio, TypeTogether, Typodermic, Emboss Fonts, Bean and Morris, Type Associates, Mint Type, Laura Worthington, the Chank Company and Yellow Design Studio.</p>
    <p>•	Revamped Site Design: The SkyFonts.com website has been refreshed to make the service more fun to use. Customers may sign up for a free account on <a class="freelinking external" href="http://www.skyfonts.com " rel="nofollow">SkyFonts.com</a>. For a limited time, all new accounts will include 10 free credits. Customers can use the same SkyFonts account on up to five workstations. Based on patent-pending technology relating to time-restricted use of fonts, the system software runs in the background of Macintosh® or Windows® platforms to activate and deactivate OpenType® fonts downloaded from the SkyFonts portal.<br>
    For more information, click: <a class="freelinking external" href="http://www.skyfonts.com " rel="nofollow">here</a>.</p>
    <p>About Monotype</p>
    <p>Monotype is a leading global provider of typefaces, technology and expertise that enable the best user experience and ensure brand integrity. Based in Woburn, Mass., Monotype provides customers worldwide with typeface solutions for a broad range of creative applications and consumer devices. The company’s library and e-commerce sites are home to many of the most widely used typefaces – including the Helvetica®, Frutiger® and Univers® families – as well as the next generation of type designs. Further information is available at <a href="http://www.monotype.com" title="www.monotype.com">www.monotype.com</a>.</p>
