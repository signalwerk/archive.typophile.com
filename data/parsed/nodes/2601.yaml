  html: <p>Tuscan, the latest typeface from Baseline Fonts, is a resurrected font from hand-lettered samples dating back to the turn of the century. <br> <br>Perfect for grunge broadsides or anything where one might consider utilizing a font like Thunderbird, <a href="http://www.myfonts.com/fonts/baselinefonts/tuscan/" target="_blank">http://www.myfonts.com/fonts/baselinefonts/tuscan/</a> Tuscan will make for a unique substitute. <br> <br>Articles are rumored to be appearing on the Baseline Fonts website (http:<a href="http://www.BASELINEFONTS.com" target="_blank">www.BASELINEFONTS.com</a>) in the next few days.</p>
