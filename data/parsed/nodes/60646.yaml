    <p>I don't have much experience with typography, so please help.</p>
    <p>I have trouble picking out the font for my secondary heading. Right now, font is Georgia and increased font size. Please take a look (I can't insert the image for some reason, keep getting errors, so I attached it.)</p>
    <p>As you can see. It's annoying.</p>
    <p>You probably know this but I remind you that there is a limited number of fonts available for websites. So please suggest cross platform fonts. </p>
    <p>Also doesn't have to be just fonts, any recommendations about kerning, line spacing, word-spacing, letter-spacing, drop caps...?</p>
    <p>Really, any constructive critic is important to me. I hope to learn more from you all.</p>
    <p>Sorry for the clumsy sentences. i'm tired. </p>
    <p>Thank you.</p>
