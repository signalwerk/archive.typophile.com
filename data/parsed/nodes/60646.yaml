    html: |-
      <p>Headers should always be appropriate for the content of the text.<br>
      If you don't want this header to be visible as the first thing in the text, you should try using the same typeface, size, kerning and line-spacing as in the main text + two blank verses (1 above and 1 below the headline). The white space created by blank verses will do just fine:) Using small caps is also a good choice, but it's difficult to make it in a webdesign...<br>
      But if it's really important for users of this page to notice this headline at once, making it a little bigger than the text (2-6pt) should be enough for w web page. You could also use some color (just keep it warm and it will be visible - red (but not #ff0000 :D) is perfect!<br>
      Hope I helped a bit:)<br>
      - Filip Łysyszyn</p>
