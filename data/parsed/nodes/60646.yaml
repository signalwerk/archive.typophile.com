    html: |-
      <p>&gt;Headers should always be appropriate for the content of the text.</p>
      <p>I learn something new every day, or at least how better to explain it. ;) </p>
      <p>I think the <em>text</em> of the header should be appropriate to the content of the text it headlines, clearly. But the <em>style</em> of the headers is usually selected to be appropriate to the design of an entire document, first, and then, if a designer wants to change the header for every part of the text, say story by story, it may then be appropriate to choose that style based on the content of that text.</p>
      <p>On the web, little of this is particularly possible along with kerning (none), line spacing(okay), word-spacing(none), letter-spacing (bad), drop caps (hassle).</p>
      <p>Have a nice day. </p>
      <p>Cheers!</p>
