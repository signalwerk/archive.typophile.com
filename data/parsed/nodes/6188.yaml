    html: <p>I like it (I DO love long-tailed Qs). <br>This spacing issue is pretty personal. Many people approach it in different ways. <br>I can just tell you that I experienced the same with a typeface I'm working on since 1996. <br>I did the spacing too loose because I wanted to give "air" but in the end I realized that if you needed a tighter textsetting you ended up with irregular results. <br>So I discarded the whole kerning table and I began the spacing anew, from scratch, starting with the O and the |, the vertical bar (In the beginning I don't use the I or the H in serif designs for the reason mentioned by Hrant). <br>In such way I realized that doing the face with a tighter spacing I was able to control kerning very well. And I realized also that the user could increase the space as he/she wishes in a tighter design with good metrics, while he/she cannot do the opposite in a looser design with bad metrics. <br>A starting point could be an automatic reduction of sidebearings. Then you'll correct the flaws.</p>
    html_clean: <p>I like it (I DO love long-tailed Qs). <br>This spacing issue is pretty personal. Many people approach it in different ways. <br>I can just tell you that I experienced the same with a typeface I'm working on since 1996. <br>I did the spacing too loose because I wanted to give "air" but in the end I realized that if you needed a tighter textsetting you ended up with irregular results. <br>So I discarded the whole kerning table and I began the spacing anew, from scratch, starting with the O and the |, the vertical bar (In the beginning I don't use the I or the H in serif designs for the reason mentioned by Hrant). <br>In such way I realized that doing the face with a tighter spacing I was able to control kerning very well. And I realized also that the user could increase the space as he/she wishes in a tighter design with good metrics, while he/she cannot do the opposite in a looser design with bad metrics. <br>A starting point could be an automatic reduction of sidebearings. Then you'll correct the flaws.</p>
  - id: 43478
