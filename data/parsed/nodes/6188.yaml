    html: <p>About spacing, from your sample, it looks as if the spacing is uniformly wide. Maybe you could set a block in Illustrator (or your favorite layout tool) and decrease the letterspacing until you find something that feels right. Then you have a good sample to improve on. <br> <br>I've found it useful to browse around my font collection in FontLab and see how others have solved the spacing problem. Finding a font with similar proportions could be a good source of ideas for spacing. I haven't tried to tackle kerning yet myself (still learning) but I'm not looking forward to it. <br> <br>When you say you're going to change the caps, do you mean you're going to give them the same slanted axis as the lowercase? I like how the strokes of the upper case <b>K</b>, <b>P</b>, and <b>R</b> don't close all the way. Try not to lose that idea when you fix the upper case. <br> <br>This looks great so far. I'm interested to see what the rest of the upper case looks like.</p>
