    html: <p>Always start spacing with lowercase letters. Uppercase letters need to be more widely spaced relative to each other than lowercase letters do, so they're a bad place to start spacing a text face. For a text face, the best way to proceed is to start with a row of lowercase nnnnnnn's. Fiddle with the sidebearings (with a little less space on the right than on the left, to account for the curve) until you have something close to an optical balance between the internal white space of the n and the amount of white space between the letters. That will give you a standard against which to judge the rest of the spacing. <br> <br>In a text face, uppercase letters need to be spaced to precede lowercase letters without requiring too much kerning. This is where Walter Tracy ceases to be helpful; his explanation of spacing uppercase letters only works for cap-only display faces. <br> <br>Years ago, before spacing became ingrained in my brain, I spent a long time measuring the relationship of sidebearings to internal white space in my favourite typefaces. I recommend this, since it is the best way to understand the principles.</p>
