    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 26.Apr.2006 8.32am </div>
      <p>=============================================<br>
    <em>Swiss typography: more than a style?</em><br>
    An exhibition and lecture at St Bride Library<br>
    =============================================</p>
    <p>Exhibition preview and opening lecture by Richard Hollis: Thursday 4 May<br>
    (details below)</p>
    <p>Exhibition runs from Friday 5 May to Thursday 15 June</p>
    <p>——————————————————————————-</p>
    <p>Swiss typography has been much reproduced and imitated around the world.<br>
    The exhibition is a chance to see original examples of work from the New<br>
    Typography of Jan Tschichold in the 1930s, via Karl Gerstner’s Integral<br>
    Typography of the 1960s, to Wolfgang Weingart’s revision of the “Swiss<br>
    style” in the 1970s. On show will be books, brochures and catalogues<br>
    designed by other Swiss masters, among them Max Bill, Richard Paul<br>
    Lohse, Fridolin Müller and Siegfried Odermatt.</p>
    <p>Exhibition preview &amp; opening lecture: Thursday 4 May<br>
    ——————————————————————————<br>
    We begin in the Exhibition Room with a preview of the exhibition from<br>
    5.30pm before moving upstairs to the Bridewell Hall for the opening<br>
    lecture at 7.00pm.</p>
    <p>Our speaker Richard Hollis is a writer and former designer and teacher.<br>
    His book “Swiss Graphic Design: The Origins and Growth of an<br>
    International Style 1920-1965” is now published and will be on sale at a<br>
    special exhibition price.</p>
    <p>Paul Barnes is a typographer and co-designer of the new Egyptian<br>
    typeface for the Guardian. Much of the work on show comes from his<br>
    collection of Swiss typography.</p>
    <p>Entry to the lecture, £5 or £3 concessions, on the door.</p>
    <p>Exhibition: Friday 5 May to Thursday 15 June<br>
    ——————————————————————<br>
    Exhibition Room<br>
    St Bride Library Bride Lane, Fleet Street London EC4Y 8EE</p>
    <p>Telephone: 020 7353 4660<br>
    Hours of opening: Tuesday to Thursday, 12.30-5pm (9pm on Wednesday)</p>
    <p>We would recommend that you do call beforehand to check accessibility to<br>
    the exhibitions, especially if making a long trip.</p>
    <p>Entry to the exhibition is free.</p>
    <p>For further information, see <a href="http://www.stbride.org" title="www.stbride.org">www.stbride.org</a></p>
