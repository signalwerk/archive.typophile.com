      <p>The Universal Samaritan?<br>
    Emery Walker and his house in Hammersmith<br>
    =========================================</p>
    <p>An illustrated talk at St Bride Library, 30 April 2008 at 7pm</p>
    <p>Admission £5/£3 concessions</p>
    <p>Emery Walker (1851—1933), the co-founder of the Doves Press, is well<br>
    known in printing circles as a key figure in the private press movement,<br>
    and as the commercially successful pioneer of cutting-edge techniques of<br>
    photo-reproduction. He was an the intimate friend of William Morris,<br>
    Philip Webb and Bernard Shaw, and a significant figure in the wider Arts<br>
    and Crafts and socialist movements. These aspects of his life are still<br>
    evident at 7 Hammersmith Terrace, his home for the last 30 years of his<br>
    life. The talk offers an introduction to Walker’s life and a look at his<br>
