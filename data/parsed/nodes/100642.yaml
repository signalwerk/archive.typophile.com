    html: |-
      <p>When building a family, I usually prefer to finish (almost) the mother font first, before turning to build the other weights. That includes kerning tables, definitely. If you have to kern V-a T-o and so on in Regular, you’ll have to do it as well most likely in Bold or Light. Of course you may choose to ex-/import kerning tables from one file to another; I prefer to settle this in one file first and then just to change glyphs to create another weight. – This may be a matter of personal preference.<br>
      But when completing a mother file this always includes the exact definition of the actual character set. Once this has been worked out, my 1st file serves as a template for all the others to come. If you finalize your encoding at a later stage you ’d have to check several files against each other, this may be laborious and error-prone.</p>
