  html: |-
    <p>Hi everybody,</p>
    <p>Today I finished filling all the glyph slots for the MacOS Roman codepage, I have other glyphs as well for Central European languages, mostly compound ones, but that is irrelevant to the nature of my post. </p>
    <p>I'm a little lost of what to do next and I need some advice. I have read somewhere that once you are finished with a basic codepage set of characters in a particular weight you should move to developing another weight (for example black) disregarding kerning at his moment. I have also read that you should begin developing alternate characters like small caps, inferiors, superiors and so on. I have also read you should begin kerning and make the font ready to use asap.</p>
    <p>So, i don't really know what of those three options I should follow. Of course I'd like to kern and make my type usable fast, but if that means that I'm gonna waste time at a later stage, better do something else.</p>
    <p>If you guys don't mind telling, what is the usual developing process you usually follow? A little insight into the design methodologies/stages that other typographers use could help me a lot. A little words explaining why you prefer to kern instead of designing the black version, for example, would be useful too.</p>
    <p>Thanks!</p>
