    html: |-
      <p>Also, there are quite a few fonts around now inspired by hand lettering from back then. A lot of what you'll find, following Mike's advice, will be fonts like that.</p>
      <p>One other possibility is that AC hired a company like Photo-Lettering Inc. to set type on a curve using their photo-lettering machines. P-L did have some styles like this (I think--I don't have one of their catalogs handy), which were based on lettering styles. Not many of these have been digitized, though. (House Industries owns the rights to the P-L library.)</p>
