    html: |-
      <p>You can search at MyFonts using '1930s' or '1940s' as the keyword. Remember, lots of pre-digital era typefaces didn't make it into digital form, but there have been plenty of them that have, and there have been revivals of some of the display types from that period, usually by new names.</p>
      <p>- Mike Yanega</p>
