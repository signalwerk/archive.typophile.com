    html: |-
      <p>I'm pretty familiar with what fonts were around in the '30s or '40s and I can't think of any that would match this. However, it was a very common <em>lettering</em> style, and lettering artists were a dime a dozen back then. </p>
      <p>This is a typical example of the kind of thing that would have been lettered (drawn by hand) rather than set with type. Type (fonts) were not well suited for stuff like this. The lettering style would not usually match any particular font. </p>
      <p>As I mentioned above, Magnesium is similar. There may be others, but that was the first one to come to mind.</p>
