      <p>There were a million+ of these made.  AC Spark plug used this font from the late 30's till early 50's on oil filters, air cleaners etc, and were screen printed on water slip decals.</p>
      <p>I though it was simply Arial but the M and N have vertical legs, and the S E and B are different.  </p>
      <p>Are you saying that this might have been a font they drew up 'in house'?</p>
      <p>Are there any sources for 30's and 40's era fonts?</p>
