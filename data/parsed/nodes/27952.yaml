    <p>Hi</p>
    <p>I have a  brand new imac intel running indesign cs2.</p>
    <p>The problem occurs when I want to print a document from indesign.<br>
    Any document containing text or vector graphics will be printed as bitmap and therefore any printout through indesign or illustrator is wothless. However if I export the document as a pdf and print throught pictureviewer the output is fine. Strange indeed. Adobe reader also printed out in nice quality but it took forever.<br>
    I am wondering if this could be a ram issue or if it could be related to the fact that cs2 currently is not prepared for the Intel macs.</p>
    <p>My setup is iMac Intel 512 mb ram.<br>
    The printer is a Brother HL-2070N laserprinter.</p>
    <p>How to solve this...</p>
    <p>MKSG</p>
