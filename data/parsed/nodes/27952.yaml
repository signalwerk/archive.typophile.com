    html: |-
      <p>This won't help with your problem, but just a general observation here about Brother, and in general to beware/be careful with their Mac print drivers. I'm on the Mac and have had a Brother printer or two, and as far as I can discern, they seem to be one of those companies who deal with the Windows market first and foremost, with their Mac drivers tacked on as an afterthought to pick up some extra change. Their stuff can be terribly buggy.</p>
      <p>I currently have a Brother P-touch labelmaker which can be used either manually (typing directly on its keyboard) or driven directly from the computer. Even having had it for a couple of years now, through two versions of the Mac OS, and with a few different revs to the labelmaker's print driver by Brother, they cannot seem to get the Mac OSX drivers sufficiently debugged. Only recourse for me is to use the OS9/Classic drivers for the labelmaker and print via the Classic application for it they also supply. Which is quite crude-looking in that it displays fonts as jagged bitmaps, but at least the line endings are displayed correctly, and it prints fine.</p>
      <p>The first couple of OSX drivers for the Brother unit worked, barely, with seriously crippled functionality. Recently, after trying to install the latest one they came out with--the third one I have tried--and trying to install it two different times with the same results), I had to give up and go back to the Classic version yet again. It had somehow hosed something in my system so badly (couldn't load fonts, couldn't print from any app, many apps would quit on launch) that after an hour or so of unsuccessfuI troubleshooting, I decided to stop wasting my time and simply restore the entire hard drive from a cloned backup (I back up every night) to get my system functioning properly again.</p>
