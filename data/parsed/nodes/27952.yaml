      <p>It sounds like it's the driver not handling postscript. PDFs printing correctly would indicate it's the driver. </p>
      <p>PictureViewer is a Classic application. If you're running OS9 then your driver isn't loaded... it's in Tiger's system folder... are you positive you've loaded the OSX driver? I don't know why you would have Classic running at all, or why you would transfer your CS app output to print into Classic... ?  Go to System Preferences and keep Classic turned off.</p>
      <p>If you've already confirmed by the Printer Setup Utility that the driver is configured, here are a few threads from the Apple support forum on your printer. You may find some good info here. </p>
      <p><a href="http://discussions.apple.com/thread.jspa?messageID=1882798&amp;#1882798" title="http://discussions.apple.com/thread.jspa?messageID=1882798&amp;#1882798">http://discussions.apple.com/thread.jspa?messageID=1882798&amp;#1882798</a></p>
