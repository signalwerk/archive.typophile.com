    <p>Hi Typophile community!</p>
    <p>Here I present a type design project - very first impressions. Small case and italic designed, some italics are being drawn roughly, some other are (for now) only oblique - that will change however, caps and numerals still to come. </p>
    <p>Would be great to have some c&amp;c on it - thank you in advance.</p><div class="imageWrap"><img src="http://typophile.com/files/specimen_062_600_5731.jpg"></div><p></p>
