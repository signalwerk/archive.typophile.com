    html: |-
      <p>I think this is a quirky-looking but potentially promising project. The s is a bit bothersome; the lower terminal looks a little weak and the letter is falling backwards.</p>
      <p>I think that the straight parts in a, e, d, b—which are working well—could be applied to p, g, q.</p>
      <p>I'm not a fan of the i, j curls; I don't think they disrupt the flow of the glyphs.</p>
      <p>-Eric MacLeod</p>
