    <p>So I'm trying to recreate intertitles in the style of the classic films and was wondering if anyone has some tips on fonts that would be good to use, that look the part.</p>
    <p>I realize that these cards would have been hand-drawn but I'm sure there must be some typefaces that look similar to what would have been used.</p>
    <p>Any suggestions would be greatly appreciated!</p>
