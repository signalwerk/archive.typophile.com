      <p>Do you want<br>
      a) learn type   or<br>
      b) become known as a type designer?</p>
      <p>I cannot honestly recommend aiming at both the same time.</p>
      <p>Coming out with a “geometric” face as a newbie is very likely to become your safe ticket into failure.</p>
