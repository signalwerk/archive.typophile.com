      <p>I'm on a Basecamp group right now. I think it's excellent, but all I'm doing with it is uploading some files and checking images others post, but I seems like a pretty complete project management package. From what I've seen of it, I'd recommend it.</p>
      <p>I also use Google groups, which has everything I would normally need to collaborate with others on line.</p>
      <p>-=®=-</p>
