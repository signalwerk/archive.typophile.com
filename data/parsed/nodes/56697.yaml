    <p>Hello Everyone,</p>
    <p>I am looking for an online project management solution for web design/project management that can handle multiple users on a team.</p>
    <p>I've heard about Basecamp, and I was wondering if anyone in design/web development has used this application before. </p>
    <p>Are there any other project management solutions that have group login such as Basecamp out there that would better solve my problem?</p>
    <p>Basecamp: <a href="http://www.basecamphq.com/" title="http://www.basecamphq.com/">http://www.basecamphq.com/</a></p>
    <p>Thank you for any suggestions you might have,</p>
    <p>Adam Dolch</p>
