    html: |-
      <p>I used basecamp for a couple of years, but now I've switched to a self-hosted option.</p>
      <p>--&gt; The one I use is <strong>Collabtive</strong>, which is open source: <a class="freelinking external" href="http://collabtive.o-dyn.de/?lang=en" rel="nofollow">http://collabtive.o-dyn.de/?lang=en</a></p>
      <p>--&gt; Previously I tried <strong>ProjectPier</strong>, which is also open source and quite good, but doesn't seem to be under active development: <a class="freelinking external" href="http://projectpier.org/" rel="nofollow">http://projectpier.org/</a></p>
      <p>--&gt;And a third one, commercial, but probably the most complete of the three so far, is <strong>activeCollab</strong>: <a class="freelinking external" href="http://www.activecollab.com/" rel="nofollow">http://www.activecollab.com/</a></p>
