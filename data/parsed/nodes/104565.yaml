    html: |-
      <p>You need to read the EULA of the digital typefaces — some allow modification(s), some not. </p>
      <p>For a simple mod (eg a logo or such) converting to outline in Adobe Illustrator is the easiest starting point. For more extensive reworking you would need pro software like Glyphs or FontLab. There are open source apps out there, like FontForge I guess, but I have no experience with that.</p>
