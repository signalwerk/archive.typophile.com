  html: |-
    <p>Looking for a font I've seen before. A venetian slightly slabbed in it's serifs. Very much like Emigre's Vendetta, but not as calligraphic. Of course when I Google "classic slab serif" I get everything from Clarendon to Lubalin Graph. This has a very classic look.</p>
    <p>Attached is a crude sketch, but shows the slab, somewhere between a classic serif and a slab.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/IMG_3512_4202.JPG"></div><p></p>
