  html: |-
    <p>Hi there! There is an article at cracked.com, <a class="freelinking external" href="http://www.cracked.com/blog/the-10-most-insane-acts-violence-in-kickboxing-history/" rel="nofollow">the 10 most insane acts of violence in kickboxing history</a>, that contains liberal use of a comic book style font in its accompanying images.</p>
    <p>example:<br>
    <img src="http://i.crackedcdn.com/phpimages/article/6/3/2/39632.jpg?v=1"></p>
    <p>I've also seen this font in use in various Street Fighter-related media, including by Capcom themselves in the instruction manual for Street Fighter IV and for the box art for the home versions of Super Street Fighter II. I once knew what this font was, but am completely at a loss right now.</p>
    <p>What is this font???</p>
    <p><em>(solved - "Monster Mash" by Comicraft)</em></p>
