      <p>I think you're approaching this a bit too conventionally. The "twisted" serif on the "L" is a nice Art Nouveau element (and the bar of the "F" actually has it too). The old-school bottom of the "V" and the Elzevir "M" are also things I would keep.</p>
      <p>Then there's the spacing...</p>
      <p>hhp</p>
