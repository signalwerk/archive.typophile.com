    html: |-
      <p>R has serifs on both sides of the tail. D, O and R curves look in the photo like "superellipse" or gradual curves, not straights with round corners. R is too round, D and O are too straight. </p>
      <p>I agree; there are some fun, irregular things about this carving. Observe them and decide which to keep and repeat, especially if you plan to finish the alphabet. Some features might change (F middle bar too short). I agree with Hrant that it should not be made more conventional or regular.</p>
