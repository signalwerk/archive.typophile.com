    date: 2006-09-27T08:05:00
    votes: null
    html: "<p>The bent-in spike on the L was probably to help space the L tighter, and put less of a hole in the middle of the word. Adding to Brad's suggestions: some of your serifs are less bracked than in the original. These should be consistent, as in the original, for a nice look.</p>"
