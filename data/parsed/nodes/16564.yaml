  html: |-
    <p>I’m thinking of organizing some occasional typographic social activities of some sort here in Seattle. I’m wanting to figure out if there are Seattle Typophiles I don’t already know. Or for that matter that I know, but didn’t realize lived in the Seattle area. Of course there’s me, and Si. But I’m sure there must be more of you out there....</p>
    <p>Note: I would also welcome contact info for type geeks not on the list.<br>
    Other typographic folks I know in the area include the rest of the Microsoft Typography team, a few typographic folks from Adobe Seattle, the gentlemen from Linguist’s Software (international fonts), John D Berry (writer and typographer), Mamoun Sakkal (Arabic type designer), and Ole Sorenson (local designer and Meetup organizer). </p>
    <p>Cheers,</p>
    <p>T</p>
