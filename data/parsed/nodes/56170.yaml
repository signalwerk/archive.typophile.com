    html: |-
      <p>Hi Michele,<br>
      this uses RoboFab and calls a "Merge Contour" command to <em>clean</em> the glyph.<br>
      Optionally the script can color the glyph instead of calling the Merge Contour so you can edit the contour by yourself.<br>
      <code><br>
      #FLM: Sanitize BCP<br>
      # scriptype - Paolo Mazzetti - 2009<br>
      from robofab.world import CurrentGlyph<br>
      from FL import *</code></p>
      <p>g = CurrentGlyph()<br>
      for contour in g:<br>
      	try:<br>
      		for p in contour.bPoints:<br>
      			if p.bcpIn == p.bcpOut and p.bcpIn == (0,0):<br>
      				fl.CallCommand(fl_cmd.ActionRemoveOverlap)<br>
      				#g.mark = 1<br>
      	except:<br>
      		pass<br>
      g.update()<br>
      </p>
      <p>(Indentation won't probably make it)<br>
      Cheers!</p>
