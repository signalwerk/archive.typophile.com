  html: |-
    <p>Hi,<br>
    I'm reviewing a font with a lot of styles and I have to remove In Point BCPs. I don't want to apply the Remove Overlap action to the entire font because I don't know what FontLab could do (I really want to be sure of every single action working with FL). Anybody know a script that recognizes glyphs with such problems so that I could work on them directly? Or something that solves the problem only where it is necessary?</p>
    <p>Best,</p>
    <p>Michele</p>
