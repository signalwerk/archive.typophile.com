  html: |-
    <p>Looking for suggestions for Eurostile-inspired contemporary typefaces that would work in a magazine or even a newspaper setting. Any suggestions would be appreciated. </p>
    <p>For example, I like Breuer Text a lot but it is rather limited especially for display headlines.</p>
    <p>I also like Karbon but it seems like it might have too much character, especially for a newspaper. Not sure how extensive the family is.</p>
    <p>Thanks again in advance.</p>
