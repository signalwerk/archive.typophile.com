  html: |-
    <p>I am designing a page from a faux 19th century newspaper - to be printed on newsprint as a flyer for an Edinburgh Festival comedy show - and have been using the font News 701 at point sizes ranging from 7.5-8 (not usually good design practice I realise, but mimicking letterpress of yesteryear allows for some irregularity)</p>
    <p>My concern is whether this point size will be too small to read printed at 150dpi on newsprint? The font is great (bix x-height, perfect for the occasion) but it is set very tight. </p>
    <p>What is the recommended smallest point size for legibility n newsprint, i suppose is my question.</p>
