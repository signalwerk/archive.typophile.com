    html: "<p>Silentmail 1998. An experiment by CalArts Teacher Jens Gelhaar and an old class where he taught type design. I've selected it for my \"Letters\" book (as I said, probably out before the end of the world). Here's a picture from Roger Walton's \"Alphabook\": <br><img src=\"http://www.typophile.com/forums/messages/29/4733.gif\" alt=\"SilentMail1998\"></p>"
