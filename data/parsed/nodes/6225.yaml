    html: <p>Thank you, Tor. <br> <br>I don't know Elliman so much, but here's Bits, from FUSE issue 15. I recalled it worse. <br>Actually it's very good as Pumpernickel. It rocks, too. Besides, it's been one of the first (if not the first) face designed with found objects. <br>It has a pretty complete character set, which is unusual for a FUSE face. <br> <br>Silentmail inspires me a lot. I would like to attempt a cooperative text face, using better starting rules. <br> <br><img src="http://www.typophile.com/forums/messages/29/4999.gif" alt="Bits image"></p>
