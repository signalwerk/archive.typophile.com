    date: 2003-01-24T13:54:00
    date_raw: 24 Jan 2003 — 1:54pm
    votes: null
    html: <p>Sorry for the big gif but I wished to show you how odd this can became with a text face. <br>Note the uncial f. <br>By the way, I love Pumpernickel. I started some ten years ago something very similar, scanning household items and found objects, but I dropped it. Pumpernickel is really prettier than Paul Elliman's Bits, for example (in an issue of FUSE). <br>I would love to work on a collaborative face like Silentmail. I would just try to keep more control (in Silentmail each following student was allowed to look only at the previous six characters and not at the whole).</p>
