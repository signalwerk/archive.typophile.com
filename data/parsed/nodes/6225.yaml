    date: 2003-01-30T09:30:00
    date_raw: 30 Jan 2003 — 9:30am
    votes: null
    html: "<p>Hrant first (like Women and Child ;) <br>I have not explained myself well. I meant Fontesque does not work if we consider it in what I called faces for book usage. <br>As far as we are in my second and generic category (experiments for someone who might dare to use in text) many faces work at different degrees depending on how much you dare and on the complessive length of the text. <br>An example is the use of Outwest as a textface in Emigre 28. I find it fantastic but it could turn your stomach upside down. And it's not for book usage. So I just meant that, if you're very daring Merlin could even be used in a book but Fontesque probably not. <br>It all depends on the context to me. <br> <br>For Tor: thank you! <br>I should have to see if objects I found for my old Gerümpel are still there. Then we may extablish proportions and start digitizing and make selections for the lowercases (I always start from the more problematic lowercases). <br>As for the sound project: do you know Voxel by Joshua Distler at Shift?: it's not what you are proposing but it's an experiment linking sound to graphic forms. I have it, Joshua is a friend of mine. You may see Voxel here: <br><a href=\"http://www.shiftype.com/\" target=\"_blank\">http://www.shiftype.com/</a> <br> <br>About your idea: short sounds but... any kind of sound? I like the idea but I find the found objects one more fun! <br>Send me a private mail from my profile page. <br> <br>Cheers! <br></p>"
    html_clean: "<p>Hrant first (like Women and Child ;) <br>I have not explained myself well. I meant Fontesque does not work if we consider it in what I called faces for book usage. <br>As far as we are in my second and generic category (experiments for someone who might dare to use in text) many faces work at different degrees depending on how much you dare and on the complessive length of the text. <br>An example is the use of Outwest as a textface in Emigre 28. I find it fantastic but it could turn your stomach upside down. And it's not for book usage. So I just meant that, if you're very daring Merlin could even be used in a book but Fontesque probably not. <br>It all depends on the context to me. <br> <br>For Tor: thank you! <br>I should have to see if objects I found for my old Gerümpel are still there. Then we may extablish proportions and start digitizing and make selections for the lowercases (I always start from the more problematic lowercases). <br>As for the sound project: do you know Voxel by Joshua Distler at Shift?: it's not what you are proposing but it's an experiment linking sound to graphic forms. I have it, Joshua is a friend of mine. You may see Voxel here: <br><a href=\"http://www.shiftype.com/\" target=\"_blank\" class=\"link-external\">http://www.shiftype.com/</a> <br> <br>About your idea: short sounds but... any kind of sound? I like the idea but I find the found objects one more fun! <br>Send me a private mail from my profile page. <br> <br>Cheers! <br></p>"
