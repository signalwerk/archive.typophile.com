    html: <p>While it's not type design, I had to gasp when a  <br>friend passed me a link to <a href="http://oxona.com" target="_top">Oxona.com</a>.   <br>To my horror and amusement I found a pixel for  <br>pixel rip-off of the design for <a href="http://www.3com.com/solutions/en_US/index.jsp?solutiontype=1000005" target="_top">3Com</a>  that I <br>completed earlier this year. It's totally  <br>blatant--everything from the grid to  <br>the photography style is a copy. It's  <br>as if they got their hands on the original  <br>templates. <br> <br>So, I'm sitting here, torn between feeling  <br>flattered that they love my work, enraged by  <br>their thievery and amused by their ignorant  <br>stupidity. <br> <br>Has anybody else had this happen? <br> <br>//joe</p>
