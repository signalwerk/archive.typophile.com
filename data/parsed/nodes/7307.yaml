    html: "<p> Something interesting from the most <br>recent edition of Icograda's eNews: <br> <br>\" <br>We wanted to know what your reaction would be if you saw your work being plagiarised by one of your colleagues.  <br> <br>It seems that over a third of you would simply ignore the issue. That indeed is a striking result. About a third would try to resolve the problem by approaching the copycat directly and dealing with them personally. Just 28 percent would actually seek legal advice. It would be interesting to know if it is because you think it is no big deal or you have so little faith in the legal system. We might just look into that in one of our future polls.  <br> <br>Should you come across your idea and/or concept being plagiarised, how would you react to that? <br>Approach that designer and deal with it personally 33% <br>Seek legal advice 28% <br>Ignore it 37% <br>\" <br> <br>I'll note that Icograda is an international entity (and in practice, not just in name); I'm sure that suing people is much more common in the US for example than in China, and not necessarily because the legal system works \"better\"... BTW, I personally go for \"approach that designer personally\". <br> <br>hhp </p>"
