    html: <p> Just to get back to the original subject of copying/pirating of type designs. This isn't just a current trend, but has been a problem for hundreds of years. There are many examples, from the copying of the Romain du Roi, to electrotyping in the 1800s, to all the American knock-offs of European faces in the first half of the 20th century. <br> <br>Stephen originally used the phrase "devaluation of type design." I guess this is one way to look at it, but then again, did type design ever have much (perceived) value to 99.99% of people to begin with?  <br> <br>While it would be nice if everyone who uses fonts on the computer became "educated" about type - so that they would then use it properly and pay for it properly - this seems pretty unlikely. I think on the whole most people wouldn't be interested enough or care enough to be "educated." And I'm not lamenting this fact because it makes perfect sense at this point in time.  <br> <br>Maybe the big thing is to really start to try to go after designers/art directors who steal type and use it to make money by designing things with it (and who all know very well that they should be paying for their type &amp; don't need to be "educated").  <br> <br>One last thing about valuing or devaluing type. I think it has a lot to do with the type in question. To be honest, I don't think I could get too worked up about the piracy of most T-26 faces. I would say that the amount of time and effort that goes into the average T-26 face is much less than a high quality font done by more 'traditional' designers. Just because T-26 released something (and overcharges for it) doesn't mean that it necessarily carries a certain amount a value (intrinsically). All fonts are not created equal. The T-26 library is heavy on the ephemeral and slapdash. While there are of course exceptions, it seems like they do very well in adhering to a "quantity of quality" model. <br> <br>That said, obviously I realize that the (copyright) law is the copyright law. </p>
