    html: <p> I recentl was pointed to this site from a colleague and would like to comment on the kid who ripped off 'Joe's' website. Joe, people are talking about this at my 'shop' and I don't have anything to do with font design per se. It's quite interesting. You and your partner, Jared, are certainly top-echelon programmers and the exposure, I'd bet, is helping rather than hurting. It points out to 3COM how lucky they are to have someone of your magnitude. Now for this Wes kid. He's 17 at Georgia Tech? Does someone have a contact for him. I'd bet tthere are some trade journals that would love to explore the issues surrounding Wes and other 'hackers' like him who are trying to legitimize themselves with corporate jobs. Looking foward to continued updates. And what a wonderful job on this site. <br> <br>holiday wishes, <br> <br>David Beeler <br>web programmer </p>
