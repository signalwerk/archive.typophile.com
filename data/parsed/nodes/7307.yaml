    html: "<p> To Anonymous' point: <br> <br>Yes, but it is not the ONLY value of design, and specifically not the only value of TYPE DESIGN. <br> <br>Your opinion, taken alone and as stated, ignores the rights of the artist to receive compensation and to determine who can and who cannot use her/his work. In my business, I design typefaces as well as offering other graphic design services and creating watercolor paintings. If I create, for example, a multiple-use piece for a client, I expect to be justly compensated for it. If someone else comes along afterward and uses that same piece again (my work) without my permission, I should have legal recourse to receive compensation for that use of my piece (as well as punitive recourse for the unauthorized use of my work). This goes for my fonts as well as my design and watercolor work. <br> <br>Remember, before metal type, there was only hand-lettering (inscriptional, illuminated, calligraphic, etc.), and the artist earned and deserved her/his just compensation. In a nutshell, the invention of metal type simply made the lettering profession more prolific and convenient. The invention of digital type had the same effect, only exponentially more so. However, none of these advancements should negate the obligation of compensation to the originator of the work, nor the obligation to seek permission for use. The ways of achieving this have developed over the years into licensing and other contractual agreements, but the obligation is there nonetheless. It is sadly true that the law has much catching up to do in protecting the full rights of artists and designers, but the obligation to do so remains. <br> <br>The notion of \"perceived value\" is more or less irrelevent as well. If a person doesn't perceive a value of a work, then she/he certainly has no obligation to utilize it. This is true whether the work is artistic (museum or otherwise), illustrative, photographic, literary, sculptural, typographic, or any other creative endeavor. Specifically in the case of type fonts, there are more than enough bundled fonts (which is actually a contracted form of compensation, pre-arranged by the designer) and fonts that are distributed freely by their designers out there to satisfy those who perceive no value to type design. Let those who do value the craft reap the benefits of new innovations, and let them give just compensation for it. <br> <br>I didn't get into design to simply communicate, or to simply share my creations with the world, and I make no apologies for that.  I also have the real-world concerns of putting food on the table and paying my rent, among many others. <br> <br>The moment the world tells me others have an open right to my work without just compensation and without seeking my permission, and that I have no legal recourse to enforce anything otherwise, that is the moment I find a new profession. It would simply no longer be worth my effort. </p>"
