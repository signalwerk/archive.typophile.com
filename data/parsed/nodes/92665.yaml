    html: <p>I apologize for the size of the imgt. The shapes are spot on to your suggestion, however, knowing the text in the picture is vinyl, I know the letters are solid. Know of one like that, but without the grunge?</p>
  - id: 508355
    user_id: 176276
    user_name: fvilanakis
    user_path: null
