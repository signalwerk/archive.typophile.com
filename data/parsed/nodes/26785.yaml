  html: "<p>News from the Hoefler Type Foundry <br> <br>Eight new typefaces! GOTHAM 2 <br> <br>     Designer Tobias Frere-Jones expands his award-winning Gotham  <br>     series into new territory with Gotham 2, a collection of eight  <br>     new styles. From the gossamer Thin and Extra Light to the hardy  <br>     Black and Ultra -- each in roman and italic -- these new styles  <br>     add a note of expressiveness to Gotham's rugged versatility.  <br> <br>            <a href=\"http://www.typography.com/catalog/gotham\" target=\"_blank\">http://www.typography.com/catalog/gotham</a> <br> <br> <br> <br>Special Offer -- save up to $100 on Gotham <br> <br>     Now when you order Gotham, Gotham Condensed, or the new Gotham 2,  <br>     you'll save $69 when ordering any two packages, or $100 when  <br>     ordering all three! <br> <br>            <a href=\"http://www.typography.com/catalog/gotham\" target=\"_blank\">http://www.typography.com/catalog/gotham</a> <br>            <a href=\"http://www.typography.com/catalog/gothamcondensed\" target=\"_blank\">http://www.typography.com/catalog/gothamcondensed</a> <br> <br> <br> <br>Back by popular demand: Hoefler Text &amp; Titling <br> <br>     Once again, you'll save $100 when ordering Hoefler Text and  <br>     Hoefler Titling together:  <br> <br> <br>             <a href=\"http://www.typography.com/catalog/hoeflertext\" target=\"_blank\">http://www.typography.com/catalog/hoeflertext</a> <br>             <a href=\"http://www.typography.com/catalog/hoeflertitling\" target=\"_blank\">http://www.typography.com/catalog/hoeflertitling</a> <br> <br> <br> <br>New for News: Retina Agate <br> <br>     Our space-saving Retina Agate typeface, originally designed for  <br>     the stock listings in The Wall Street Journal, is now available  <br>     for your newspaper: <br> <br>             <a href=\"http://www.typography.com/retina\" target=\"_blank\">http://www.typography.com/retina</a></p>"
