    <p>We're trying to change one of the items in the menu bar on this website, only the website was outsourced and created by another company 12-13 years ago. When I go to change the font, the text defaults back to something generic meaning I don't have the type face on my computer. If someone could identify the type face for me so that we can re-buy it, that would be great! The website is: <a href="http://www.teenfreeway.com" title="www.teenfreeway.com">www.teenfreeway.com</a>, and it is the left menu bar. What the font was of no help.</p>
    <p>Thanks,</p>
    <p>Jendalen</p>
