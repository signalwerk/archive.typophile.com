    <p></p><div class="imageWrap"><img src="http://typophile.com/files/SkyFonts-Trial_4483.png"></div><p></p>
    <p>Fonts.com is offering free trials of desktop fonts using Monotype’s <a class="freelinking external" href="http://skyfonts.com/ " rel="nofollow"> SkyFonts</a>™ client, which allows you to temporarily install and trial fonts within documents for up to five minutes.</p>
    <p>You can read more on the Fonts.com blog: <a href="http://bit.ly/1d15Rtm" title="http://bit.ly/1d15Rtm">http://bit.ly/1d15Rtm</a></p>
    <p>And learn more about SkyFonts here: <a href="http://bit.ly/IKgHej" title="http://bit.ly/IKgHej">http://bit.ly/IKgHej</a></p>
