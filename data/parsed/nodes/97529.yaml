      <p>Very "<a class="freelinking external" href="http://www.myfonts.com/fonts/itc/victorian/" rel="nofollow">Victorian</a>" BTW. You may find interesting to have a look to some tags and search at MyFonts (<a class="freelinking external" href="http://www.myfonts.com/search/victorian/fonts/" rel="nofollow">Victorian</a>,<a class="freelinking external" href="http://www.myfonts.com/search/tag%3AVictorian" rel="nofollow">Victorian</a>, <a class="freelinking external" href="http://www.myfonts.com/search/tag%3Aornamental" rel="nofollow">ornamental</a>, <a class="freelinking external" href="http://www.myfonts.com/search/art+nouveau" rel="nofollow">Art Nouveau</a>, <a class="freelinking external" rel="nofollow">Art Deco</a>...),  their "More Like..." suggestions (middle right, "<a class="freelinking external" href="http://www.myfonts.com/morelike/35012/" rel="nofollow">More Like Victorian</a>"), <a class="freelinking external" href="http://www.myfonts.com/foundry/Jeff_Levine/" rel="nofollow">Jeff Levine's</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Nicks_Fonts/" rel="nofollow">Nick's Fonts</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Scriptorium/" rel="nofollow">Scriptorium's</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Solotype/" rel="nofollow">Solotype's</a>, <a class="freelinking external" href="http://www.myfonts.com/foundry/Greater_Albion_Typefounders/" rel="nofollow">Greater Albion Typefounders</a> and <a class="freelinking external" href="http://www.letterheadfonts.com" rel="nofollow">Letterhead Fonts</a><br>
      Using these tags and references, I quickly found <a class="freelinking external" href="http://www.myfonts.com/fonts/itc/victorian/" rel="nofollow">Victorian</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/scriptorium/rochambeau/" rel="nofollow">Rochambeau</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/fontmesa/livery-stable/" rel="nofollow">Livery Stable</a>. Obviously not matching but not so far.</p>
