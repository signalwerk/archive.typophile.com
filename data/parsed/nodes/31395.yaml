    <p>G’day</p>
    <p>I’m a little bit worried, we have a deadline to get this book finished this week but indesign has just started crashing everytime I attempt to mve from the current page. It also does it on other copies of indesign on other computers so it must be the file itself. I have kept the display performance at typical, I have thrown out all styles copied over from word, I have trashed the preferences file. Does anybody know anything else to try, kind of desperate. </p>
    <p>I work by copying text out of word and pasting it into pages, I select all the italics and change it to an italic style and then I force the body text style over the top. Up until now, I’ve had no problems with this method.<br>
    cheers</p>
    <p>Nick</p>
