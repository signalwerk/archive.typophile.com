      <p>In class my analogy for “Save As” is the blackboard: as you write on it during class you’re constantly erasing and applying fresh chalk, and by the end of the class the board is covered in multiple layers of half-erased chalk dust, with bits and pieces of earlier notes still partially visible. When you hit “Save” you’re saving all of that chalk. “Save As” is like doing a thorough cleaning of the boards and then writing only the final set of  notes onto a clean background.</p>
      <p>As for the transfer from Word to InDesign, like Nicholas I tend to simply “Select All” and copy the content from the Word manuscript and paste the entire thing into the first text frame of my InDesign file, then create new P &amp; C styles and work through the book from start to finish to apply the sytles. Occasionally the styles don’t take and I have to manually apply/strip certain attributes, but this allows me to keep the manuscript’s formating (italics, etc.) even though I’m changing fonts &amp; sizes, etc. This is the way I’ve always brought Word docs into InDesign and I’ve never had a problem.</p>
      <p>That said, I work on a PC, so I don’t have the frustrating OS problems that Mac users are always pretending they don’t have.</p>
    html_clean: |-
