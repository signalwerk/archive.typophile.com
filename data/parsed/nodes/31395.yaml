      <p>Another HUGE piece of advice is to break down your book into chapters or at least manageable chunks. That way if there’s a bit of text or an image that’s corrupt you don’t lose the whole file. Quark files in particular can get really huge if you’re using high res scans. I rarely if ever make one file for a whole book.</p>
      <p>Jason - I was having the same problem with the styles not “taking” but if you hold down shift+command (on a mac) when you apply the style, it overrides whatever else is in there. Also, select all and hit “No Paragraph Style” before you start.</p>
      <p>But here’s a question, if you apply the character styles FIRST then you don’t have the override problem when you apply the paragraph style? That’s helpful to know.</p>
