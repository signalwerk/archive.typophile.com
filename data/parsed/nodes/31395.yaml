      <p>My issue with using the “Clear Overrides” is that this will, indeed, strip out original document’s italic formating, etc. Occassionally I’ll apply my “body - indent” style and for whatever reason the font doesn’t take, or the size, so I quickly highlight that paragraph and manually set the font or size or whatever it is that didn’t take. This normally fixes the bug. I only use “Clear Overrides” as a last resort.</p>
      <p>For a while I played with setting up my styles first using placeholder text, then clear the document of content and bring in the Word copy, using InDesign’s replace-Word-styles-with-InDesign-styles dialogue, but this never seemed to transfer smoothly, so I’ve gone back to bringing in the Word file and manually applying the InDesign styles I’ve created. Then I trash all of the Word styles and continue to tweak the content both through my style definitions and manually, where necessary. These are often 400 page books with more than a dozen master pages and dozens of graphics and I’ve yet to have a major issue.</p>
      <p>All of this, of course, depends on how well copy-edited the manuscript is. I have one client who sends me the most meticulously formated manuscripts you can imagine, with good, clean stylesheets used throughout and the text fully colour-coded (blue italics, red acronyms, green parens/brackets, orange URLs, etc.), but the majority of the source documents are chaotic disasters. Thus, manually applying my custom styles one paragraph at a time is my own method of damage control in that it forces me to format the project piece by piece, thus gaining some real connection to the content, which is always a good thing.</p>
