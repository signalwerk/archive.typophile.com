      <p><em>I work by copying text out of word and pasting it into pages....</em></p>
      <p>Given a choice between c&amp;p or Place, I’d pick Place if using Word.  That being said, I’d convert the Word doc into a txt file and place that — there’s just too many strange things (macros, etc.) that can happen with Word documents — and format from there.</p>
      <p>I’m assuming you’ve got this thing set up as a book?  The long-way round would be to export the text as .txt in the offending chapter, and build a new one from the ground up, then replace the chapter.  Sometimes you need to start from scratch....</p>
      <p>Good luck!</p>
