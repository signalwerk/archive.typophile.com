      <p>I’ve heard people say it’s best to save as RTF out of Word, but this gives me more problems than the native format. one catch (at least in the past) is that you have to disable “fast save” in Word for a clean import. with a little scripting, I can usually get very long texts into InD with perfectly intact styles. Word is not an elegant machine, but InD has done a pretty good job of bending it to it’s will.</p>
