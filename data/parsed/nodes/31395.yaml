      <p>Here’s a painful memory from the old days: did any of you Quarkies ever get the message <em>This document was built with another system’s fonts. It will be rebuilt with this system’s fonts.</em>??</p>
      <p>In 1993 I did a very complicated scholarly book, 256 pages, 8.5 x 11 with text in 2 cols, with huge numbers of illustrations and detailed notes at the end of each chapter. As mentioned above by someone I saved it in chapter chunks rather than in one large file (thank goodness!). I was probably using XPress 3.32, can’t remember now. Anyhow, I started this job on my Mac IIcx and it never left my machine. Ever. In general I adored this project: great editors, great content, nice design, just fun all around. So most of the time I cruised along, thoroughly enjoying myself.</p>
      <p>But then, after toiling away to get the textual reference to a picture to be on the same spread as the picture, or to accomplish any number of things that we all like to do with fine typesetting, sometimes going back 3 or 4 or 5 pages to gain or lose a line, out of the blue I’d get this sudden message. It was as bad as getting “the bomb.” It drove me crazy because there was no pattern to it. Despite hours of consultation, Apple and Quark were never able to find out what was wrong. </p>
      <p>And of course when you are experimenting with something like these moves, you don’t want to save the file every 5 minutes because you may not like where you end up! Once the dreaded message appeared, all the text for the entire chapter would reflow, ruining all my careful tracking moves, soft returns, and so forth. I would either revert if I was lucky, or sometimes I’d have to do a “thumbnail drag” (for those of you not familiar with XPress, think of it as an “extreme save as”) to generate a new file.</p>
      <p>Anyway, just curious if any of you ever ran into this. I was astonished, since no other external system was ever involved, and my own computer remained constant in terms of what system I was running at that time.</p>
    html_clean: |-
