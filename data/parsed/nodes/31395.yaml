    html: <p>As Patty mentioned, it is a very healthy habit to use “save as...” at least occasionally as you work on files. “Save” simply saves the information in the order you’ve been using it in. Whereas “Save as” reorders the information. I liken it to defragmenting a hard drive. This is why “save” can corrupt a file. (Although I’m hardly technical so someone else could clarify.)</p>
