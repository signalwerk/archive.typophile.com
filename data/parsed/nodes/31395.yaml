      <p>I hate when the editor formats the text in word. Quark had an imperfect system called Xpress Tags and when it worked it WORKED - the tags formatted themselves. But it didn’t always work. Two of my clients still tag the text this way. Yes, you have to manually remove the tags as you go along, but it is extremely clear what you’re supposed to do with the text re itals, different levels of heads, etc.</p>
      <p>I always eliminate any styling in word before I flow the text into either InD or Quark. If I don’t have a hard copy to refer to then I save a copy with the formatting intact and leave that doc open to refer to (as mentioned above) while I work.</p>
      <p>It used to be that if you converted the italics to underline in the word doc for some reason Quark would preserve that, and then you could do a find/change in Quark back to italics after you’d applied your paragraph style, but Q6 doesn’t do that anymore.</p>
