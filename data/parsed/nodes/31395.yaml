      <p>It did happen to me a couple of time that an InDesign document got corrupted. Since I’m working on a lot of books, and that it involves lots of work on a long amount of time, the best way to reduce the damage is to create a new document each day with the date include in the name (book-A_021207.indd). If your document gets corrupted, you can get the document of the previous day, at least, you only loose one day work.</p>
      <p>I do also think that it’s better to place the text from word and then work with find/change, to be sure there is no fake italics in your document.</p>
