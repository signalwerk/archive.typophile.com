      <p>This may not help, but we save Word documents in RTF format. We have a set of routines that we run on the RTF files that change the RTF formatting strings into InDesign tags — we call such files .ITT (InDesign Tagged Text). These are then imported into InDesign. All this on a PC, but it should work for a Mac.</p>
      <p>The hard (well, laborious) part is writing the initial conversion program going from .RTF to “.ITT” — but once that is done, you’re in business. BTW, don’t try importing an RFT file — InDesign will mess up some of the characters.</p>
      <p>FWIW</p>
    html_clean: |-
