    html: <p><i>Franz, how do you id type so fast?</i> <br> <br>Joseph, that wasn't fast by Typophile standards.. I was just lucky that Yves, Karl and the other guys were not around. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><i>Do you have certain type books that you use as a resource or are you just so familiar with type that you can simply recall what it is?</i> <br> <br>I did read a couple of books, but I don't own any type specimen books. And I haven't been doing this for very long either.. In fact I discovered typography only about a year ago when I started to prepare for design school. I fell in love with type, and I've been learning and researching since then.. This place is great for learning, considering how you get to watch the Godfathers of Type ID (Mike, Mark et al) work their magic. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>(Oh, and the not-drinking/smoking-thing might help too, although I'm not exactly sure how that factors in <img src="http://www.typophile.com/forums/clipart/wink.gif" border="0">. ) <br> <br>By the way, I first thought the sample David posted was <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/theserif/serif-.html">TheSerif</a>, I looked that up and it didn't match, so I tried the other famous "humanist slab", and bingo! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
    html_clean: <p><i>Franz, how do you id type so fast?</i> <br> <br>Joseph, that wasn't fast by Typophile standards.. I was just lucky that Yves, Karl and the other guys were not around. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br><i>Do you have certain type books that you use as a resource or are you just so familiar with type that you can simply recall what it is?</i> <br> <br>I did read a couple of books, but I don't own any type specimen books. And I haven't been doing this for very long either.. In fact I discovered typography only about a year ago when I started to prepare for design school. I fell in love with type, and I've been learning and researching since then.. This place is great for learning, considering how you get to watch the Godfathers of Type ID (Mike, Mark et al) work their magic. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0">  <br> <br>(Oh, and the not-drinking/smoking-thing might help too, although I'm not exactly sure how that factors in <img src="http://www.typophile.com/forums/clipart/wink.gif" border="0">. ) <br> <br>By the way, I first thought the sample David posted was <a href="http://www.lucasfonts.com/cgi-bin/loadframe/lucasfnt/theserif/serif-.html" class="link-external">TheSerif</a>, I looked that up and it didn't match, so I tried the other famous "humanist slab", and bingo! <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"></p>
