    html: <p>Franz, how do you id type so fast? Really... I would like to know. It would be wonderful if I could do this as well. <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":-)" border="0"> <br> <br>Do you have certain type books that you use as a resource or are you just so familiar with type that you can simply recall what it is? <br> <br>I have learned some of the more common types by lurking here in 'Typophile land' for a while. But these more obscure types, at least to me, like PMC Caecilia are something that I have trouble id'ing.</p>
