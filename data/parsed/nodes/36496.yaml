    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Carter &amp; Cone Type, Inc.</strong></p>
    <p>Carter &amp; Cone Type Inc., formed in 1991, combines the talents of <a href="/wiki/Matthew%20Carter" class="freelinking" rel="nofollow">Matthew Carter</a> and <a href="/wiki/Cherie%20Cone" class="freelinking" rel="nofollow">Cherie Cone</a> to produce and market the designs of Matthew Carter. They license his typefaces to end users, and do custom work for corporations, newspapers, magazines, and university presses. </p>
    <p>Carter &amp; Cone have produced types on commission for Apple, Microsoft (the screen fonts <a href="/wiki/Verdana" class="freelinking" rel="nofollow">Verdana</a> and <a href="/wiki/Georgia" class="freelinking" rel="nofollow">Georgia</a>), Time, Newsweek, Wired, U.S. News &amp; World Report, Sports Illustrated, The Washington Post, and the Walker Art Center.</p>
    <p><a href="http://www.carterandcone.com" title="www.carterandcone.com">www.carterandcone.com</a></p>
