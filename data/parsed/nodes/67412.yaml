    html: |-
      <p>I'm a big fan of Everett Fox's Translation <a class="freelinking external" href="http://www.amazon.com/Five-Books-Moses-Leviticus-Deuteronomy/dp/0805211195" rel="nofollow">The Schocken Bible: the Five Books of Moses.</a></p>
      <p>Fox also discusses translation in depth, and has a separate book on it. He modestly says there's no such thing as the perfect or timeless translation.</p>
      <p>I now and then have issues with some things in Fox, but its combination of accuracy to the Hebrew and poetry is very impressive.  </p>
      <p>I don't agree with Copulsky's critique of Fox--on the Google link. I don't find the English awkward, but powerful, in a way more similar to the Hebrew than is the King James. </p>
      <p>And while Alter's translation and especially notes to the Five Books are valuable, I dislike his translation of the Psalms, which form me loses its devotional power--the main point of the Psalms.</p>
