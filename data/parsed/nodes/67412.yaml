      <p>True. There's no  such thing as the perfect, timeless translation.</p>
      <p>Let's take one example. Do you think that 'Sabbath-Ceasing' is the right translation? </p>
      <p>Exodus 31:15</p>
      <p>ששת ימים יעשה מלאכה וביום השביעי שבת שבתון קדש ליהוה  </p>
      <p>Hoffman: Everett Fox's 1995 translation The five books of Moses gives us<br>
      "Sabbath, Sabbath-Ceasing," as though the English translation for shabaton must include the English translation for shabat.</p>
      <p>JPS -1999:  Six days may work be done, but on the seventh day there shall be a sabbath of complete rest, holy to the Lord;</p>
      <p>JPS- 1916: Six days shall work be done; but on the seventh day is a sabbath of solemn rest, holy to the Lord;</p>
      <p>Jewish Family Bible, London, 1881:  Six days may  work be done; but in the seventh is the sabbath of rest, holy to the Lord;</p>
      <p>Koren - 2000:  Six days may work be done; but on the seventh is the sabbath of rest,  holy to the Lord;</p>
