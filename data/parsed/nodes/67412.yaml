    html: |-
      <p>I think you need to look at this example in the context of what Fox is doing generally, which is to try to have the English reflect same roots and rhythm as the Hebrew. Here the repetition of "sabbath" reflects the Hebrew "Shabbat Shabbaton". Fox also does that for the Biblical special construction with doubled verbs, which is common in the Bible, so it resonates with a lot of other stuff in the translation, including in this sentence. </p>
      <p>So here is the whole of 31:15 in Fox: "For six days is work to be made, but on the seventh day [is] Sabbath, Sabbath-Ceasing, holiness for YHVH, whoever makes work on the Sabbath day is to be put-to-death, yes death!" </p>
      <p>If you look at the whole of the passage on the Sabbath--from 31:12-17 you get a quite different and I think more forceful and more accurate feeling out of Fox, compared to JPS. You are the native speaker, but to me with my limited Hebrew, even the bit I've quoted much better catches the sound and force of the Hebrew. If you look at the more traditional translations, they are much more sedate, and soften the ringing, celebratory, and stinging tone of the Hebrew. In the original you get the urgency and excitement of beginning this new idea of Shabbat, and the desperation to get it to function in the society.     </p>
      <p>So you have to look at "Sabbath-Ceasing" in the context of the rest--kind of like looking at a glyph not on its own, but in the context of words :) The fair comparison is the whole of 31:12-17, one translation with another. </p>
      <p>There is the other problem of adding stuff that isn't in the Hebrew, which is a particular problem because people tend to take very seriously the English wording because it is the Bible. For example I don't like the "*may* work be done", because there is no "may" implied in the Hebrew. Furthermore, the Sages (which ones I'd have to check) take "Six days shall you work" as a commandment as much as resting on the seventh day. So "may" gives a twist that exclude this interpretation. Similarly "*solemn* rest" isn't there. It's more "Rest! Rest or I'll whack you!"    </p>
      <p>The thing about the Fox translation is that you have to *listen* to its sound. And there you get more of the Hebrew than any other. </p>
      <p>By the way, this passage is not the most clear example of success in what he is undertaking. The critic has taken one of the sentences where Fox had to really work to bring off his idea. I think it does succeed, but there are a lot of other places where he just knocks it out of the park IMHO.</p>
      <p>Ps. Full disclosure: I know Everett, as he's married to a relative of mine.</p>
