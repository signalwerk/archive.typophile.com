  html: |-
    <p>espn always has nice fonts. this font looks somewhat familiar but the chopped tops of the S’s and G’s as well as the slanted bar in the H make it distinguished. The “R” is also slanted some. i’m interested in seeing if there are varying weights to this font.</p>
    <p>this is from the previous issue which was about college basketball. i tried getting a link to the digital version but its been updated to the most recent.</p>
    <p>any help much appreciated! i tried providing as much information as possible. thanks.</p>
    <p></p><div class="imageWrap"><img src="/files/espnBballFont_4676.gif"></div><p></p>
