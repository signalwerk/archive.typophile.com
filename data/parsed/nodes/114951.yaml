    html: |-
      <p>May I suggest my own Proza? It was initially intended as a sans-serif companion to Garamond, and still shares its humanist skeleton. You can read all about it here: <a href="http://ilovetypography.com/2013/11/01/making-fonts-proza-typeface/" title="http://ilovetypography.com/2013/11/01/making-fonts-proza-typeface/">http://ilovetypography.com/2013/11/01/making-fonts-proza-typeface/</a></p>
      <p>For similar proportions you might try this: <a href="http://www.myfonts.com/fonts/storm/jannon-sans/" title="http://www.myfonts.com/fonts/storm/jannon-sans/">http://www.myfonts.com/fonts/storm/jannon-sans/</a><br>
      It's based on Jannon, rather than Garamond, but it's probably the closest of a match you'll find.</p>
      <p>Good luck!</p>
