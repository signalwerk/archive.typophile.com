  html: |-
    <p>Hello all,</p>
    <p>I apologize if this has been asked and answered before but I searched for a while without coming up with any answers.</p>
    <p>I'm wondering if someone could help me find a good, readable sans-serif font that would flow nicely when inserted into body text that is composed of Adobe Garamond. Something with the same proportions so as not to cause any weird leading issues.</p>
    <p>Any help is greatly appreciated.</p>
    <p>Best regards,<br>
    Chris</p>
