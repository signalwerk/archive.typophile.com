  html: |-
    <p>We recently designed our iPhone app to use Source Sans Pro as its interface / body text typeface, and we've been attempting to redesign our website to match, but we're finding that while Source Sans works brilliantly on a Retina Display, it's much less appealing at the DPI of a typical computer screen - feels very muddy and cluttered.</p>
    <p>So: can anybody recommend a webfont (paid is fine, just has to be available as a webfont) with a similar feel to Source Sans that performs better for website body text? Thanks.</p>
