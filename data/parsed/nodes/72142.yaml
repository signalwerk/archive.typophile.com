  html: |-
    <p>Just started working on something new and wanted to save it here, so it reminds me not to quit or forget about it.</p>
    <p>Only lower case letters are done so far and not all (/s/, /k/, /v/, /w/, /x/, /y/, /z/, /j/... are missing) and they are still rough, didn't do fine tunings of those existing letters (e.g. some parts are still not consistent, proportions in some letters are not good, should letters /n/, /u/, /u/, /p/, /q/ have same upper part of left stem as on /p/ or /n/ ...). Pretty a lot of things to define and to think about.</p>
    <p>But, I think this looks like a promising beginning and could be interesting to complete it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adhez_preview1_3952.jpg"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/adhez_preview2_4174.jpg"></div><p></p>
