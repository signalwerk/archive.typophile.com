    votes: null
    html: |-
      <p>There are a couple words that stand out in the PDF. In the "so" combination in "association", the /s/ seems to dip farther below the baseline than the /o/. It might help if you fatten the /o/ to match the square shape of the other rounded letters. The /s/ looks a little bottom heavy too. Also, the "db" in "standby" seems out of balance. I am torn on this one because the b/d and p/q asymmetry add a lot of character to the typeface.</p>
      <p>I notice in this 1.5 version you changed your strokes to have a uniform weight. The result is a quite nice, utilitarian look, but you lose some of the warmth of the original. It would be nice to see both variations developed, possibly in a true-italic instead of an oblique style.</p>
    html_clean: |-
