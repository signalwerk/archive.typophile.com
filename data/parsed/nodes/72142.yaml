    html: |-
      <p>I like the look of this so far (and the idea of an online diary of the font is a good one!) The letters seem to go well together on the whole and the words you've displayed look good already. </p>
      <p>I like the /a/ a lot, it has a very cool shape. The /e/ is also much better now. I have no problem with the /Q/ on first glance, although I'm not a fan of the /K/ and /k/. On the uppercase one, the horizontal crossbar seems a little too high and on the lowercase, it seems very thin compared to the quite thick top stroke and leg. The /A/ also seems quite heavy to me compared to the /O/, /Q/ and a lot of the other uppercase (maybe make the crossbar thinner?).</p>
      <p>Overall nice job so far and look forward to seeing this develop!</p>
      <p>- Claire</p>
    html_clean: |-
