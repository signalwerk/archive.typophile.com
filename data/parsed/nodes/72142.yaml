      <p>I like this face--very much. </p>
      <p>There is one niggling thing that bothers me-- when the /a/ is preceded by the /d/, the /a/ seems diminished. I can't put my finger on it. It doesn't show in /ga/ for instance -- but it does /da/. (I haven't tried /pa/ or /ba/.) I'm not sure if what I see is caused by the counter size in the /a/ or by the apparent x-height of the /a/ in the /da/ pairing.</p>
      <p>This is a very small thing, but I thought I'd pass it on.</p>
      <p>Clair</p>
