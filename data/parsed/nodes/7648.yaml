    html: <p><a href="http://www.identifont.com/show?4W1" target="_blank"> ACME Carplates</a> is what you're looking for, as the other option -  <br><a href="http://www.lineto.com/" target="_blank"> Lineto</a>'s Alpha Headline - is currently unavailable to the general  <br>public. Mitsubishi Motors Europe acquired exclusive license for  <br>the Alpha Headline fonts for the duration of ten years, expiring  <br>at the end of 2012.</p>
