    date_raw: 11 Jun 2008 — 9:36am
    votes: null
    html: <p>I probably won't be pursuing it any further myself as I have piles of lettering jobs to get done. At a large corporation like American Greetings, fonts often go waltzing out the door through freelance workers and other channels. Once they get out there, its hard to control what happens with them. I design type here as well, but we don't officially have a type department. Our records on type development are therefore pretty scattered at best.</p>
