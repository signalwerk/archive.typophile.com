    <p>I'm not sure if this is the correct forum for this, but it seemed related.</p>
    <p>I was asked about a font by our licensing department today by the name of CAC Pinafore. I looked all over our fon servers and found nothing. I looked it up on the web and several free font sites had it listed and by American Greetings (my employer). We don't give out our fonts. I enquired in-house a little further and found a list of licensed use only fonts with the CAC prefix. These are versions made especially for use with a particular client. Apparantly someone got copies of these fonts and just downloaded them to Free Sites. </p>
    <p>None of the free sites seemed to offer links to the originators and the zip file only contained the font and no read me file. I don't really have time to keep chasing this down as its not really part of my job, but I am curious if any of these free sites keep records of who uploaded the fonts to begin with. Has anyone else pursued this type of thing before.</p>
