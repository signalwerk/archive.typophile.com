  html: |-
    <p>Is there a font out there that could be described as <a class="freelinking external" href="http://www.identifont.com/find?font=rockwell" rel="nofollow">Rockwell</a> with rounded serifs? We're looking for something like this for a charity project, like Rockwell, but would want to have it a bit softer, and if the serifs had round endings, that would do it. We've tried it by rounding the corners on a few characters, but are wondering what's the closest existing font would be.</p>
    <p>Many thanks.</p>
    <p>Edit: Ah yes, and it shouldn't be any typewriter font.</p>
  html_clean: |-
    <p>Is there a font out there that could be described as <a class="freelinking external link-external" href="http://www.identifont.com/find?font=rockwell" rel="nofollow">Rockwell</a> with rounded serifs? We're looking for something like this for a charity project, like Rockwell, but would want to have it a bit softer, and if the serifs had round endings, that would do it. We've tried it by rounding the corners on a few characters, but are wondering what's the closest existing font would be.</p>
    <p>Many thanks.</p>
    <p>Edit: Ah yes, and it shouldn't be any typewriter font.</p>
