    <p>Hi all,<br>
    I've recently taken on a web job for a client but they wanted a quick modification of their existing logo, which is the stacked letter emblem.  Originally it was used rotated -90 degrees with the stem of the R functioning as a page break (yikes) for whatever it was used on.  The client wants to keep this emblem, but make it a bit more professional and iconic.  I added the additional text.  Let me know what you think: kerning, the whole square thing, etc.  I'm not introducing color just yet, just want to get it looking good in black for now, and trying to be fast and effective on this one.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/BRMC-concepts_6682.gif"></div><p></p>
    <p>Cheers!<br>
    -David</p>
