      <p>I'm never a big fan of letterspacing to get the sentences equal in length. I think I would change the size to make it equal, or just let it flush.</p>
      <p>Also, at the moment it's not really equal optically, if you wanted that. The 'McCullough' stands out. Let the period after Bridgette align more or less with the right stem of the 'H', and the middle stem of the 'Y' in 'advisory' more or less as well. This would make it look more aligned, in my opinion. :)</p>
