    html: |-
      <p>I have been asked to hand over files to various clients, and I have done different things in different situations:</p>
      <p>- Hate the client, but I know they have money: put a ridiculous price on the files.</p>
      <p>- Hate the client, but they don’t have money, and I don’t want to do annoying changes for them: Just hand over the files, and wipe my hands. Or if really hate them, don’t hand over anything.</p>
      <p>- Love the client, and I know they have money: Depending on how much work they send you, either just hand over the files or put a small fee on the files, so they know your files have a value.</p>
      <p>- Love the client, but I know they don’t have money: Just hand them over.</p>
