      <p>Best is to prevent this all in the first place.</p>
      <p>You made a deal with your client. Not with your client clients.</p>
      <p>But what are things worth to you?<br>
      Do you want to put a good relationship on the line? I guess not.</p>
      <p>Next time you probably take this into account.</p>
      <p>For now it is a personal question I guess.</p>
      <p>Off course, they do have to pay for it since you were paid for making the designs. Not for giving them the files as well. </p>
      <p>Just thinking of something: I’m not certain about the laws in your country (I live in The Netherlands), but it could be you are NOT the author of your designs at all! By taking the job it could be that your immediate client has become the author (with all the rights) of your work.<br>
      In that case you stand empty handed, my friend. </p>
      <p>Hope this helps.</p>
