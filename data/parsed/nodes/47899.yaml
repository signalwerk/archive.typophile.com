      <p>Happens all the time with advertising agencies, where a client will move to a different agency and ask for all their design files. Design files are technically owned by the client, who has bought and paid for them.</p>
      <p>In your case, your client has another client who has asked for the files. And your client has agreed to release them. Be courteous. Be helpful. Let your client know you are being courteous and helpful.</p>
      <p>Don’t release fonts or software apps used to build the files: they aren’t licenced to your client’s client.</p>
