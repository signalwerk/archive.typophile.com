    <p>I have a client who hired me to do a direct mail piece for one of their new client.  My client sends me a lot of work and I gave her a great rate.  But now the end client is requesting the complete layout design in its original format so that “we can make changes to the file as needed”.  </p>
    <p>Is anyone else releasing the layout design as part of the job?  Please advise.</p>
