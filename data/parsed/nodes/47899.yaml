      <p>Providing source files is fine, it’s what you would call a template file, though you need to be clear on what the purpose of the template it to be used for and factor that into the cost or supplying the client with the files.</p>
      <p>You can more or lease state exactly what is meant by template file and its usages as well.</p>
      <p>Ideally to be clear on handing over files form the start is to have a contract of some type stating that the work they are receiving is the end product, a pdf file for print etc and if they want the working files then an arrangement needs to sorted.</p>
