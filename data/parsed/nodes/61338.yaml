    html: |-
      <p>Don't cry -- it's not half bad or something!<br>
      Display type comes close to appreciating art -- people tend to like it or they don't. I, for one, liked it at first sight -- even though I didn't immediately recognize it as a letter 'B' :-D</p>
      <p>I do get the distinct feeling it may look better with slightly (or extremely) thinner connecting curves on the top and bottom, making that massive centerpiece more afloat in free space ("connected only with a few tendrils"; poetry like that). Perhaps it's an optical illusion that the rounded ends stick out above and below -- you might want to experiment with that.</p>
