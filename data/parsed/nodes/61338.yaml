      <p>Thanks Jimmy</p>
      <p>That's kind of how I saw it. Just something to live by itself, proclaiming I AM "B."</p>
      <p>Is it worth cleaning up? Certainly need to alter the left and middle counterspaces to match their end points to that of the stroke. </p>
      <p>Should I attempt a more traditional counter on the right side of the letter?</p>
      <p>The problem I was seeing was this:</p>
      <p>I like the two rectangular pieces on the right side, since they match the giant rectangle on the left of the letter.</p>
      <p>Maybe a very subtle curve on the right side of the counters wouldn't eat into that rectangle too much, and possible fix the problem of the bottom counterform currently looking like it was just thrown in there.</p>
      <p>Thoughts? Suggestions? Since it's display I know you can't be telling me to start changing the whole thing, that maybe whatever I do it will still be correct (since it's more art than anything)--but i do want this puppy to look good.</p>
