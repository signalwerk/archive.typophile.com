    html: |-
      <p>Print it out and look at it. </p>
      <p>It seems to me that that it is too much text on the back, not only from a graphic design standpoint, but from a more general communications standpoint. It's basically five taglines, while it's normal to present one, or at most two, taglines.  This gives the feeling that the company is just throwing out slogans w/o focus.</p>
      <p>Don't use underlining to emphasize text - it interferes with the letters. </p>
      <p>In terms of the front, having that dark bar in the middle splits the card up too much.  if you really want the dark bar, have it behind just the uppermost info (the company name) so it's at the edge of the card. But I don't think it helps at all.</p>
      <p>Also, on the front the darker text stands out more, so I think you should use darker text for the important content (such as the email address) and lighter colored text for the generic phrases such as "Email."</p>
