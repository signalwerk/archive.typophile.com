    html: <p>I agree with @hola. All your text seems to be tracked very tight... And if you want to make it interesting, maybe you should play with the shape of the bar, since your logo symbol has organic shapes. Take the bottom line of your logo symbol and enlarge it to a bar and enclose text into it. That will work much better than static horizontal bar.</p>
