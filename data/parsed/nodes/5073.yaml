  html: <p>Greetings <br>This is for a conference focusing on women's political issues scheduled for Boston to coincide with the Democratic nominating convention.  <br>The information I received from the client was basically asking for something professional but not super traditional -- a tiny bit edgy is okay with them. The magenta is a color they asked for (the other color they like is a really lemon-y yellow, close to process yellow, which makes me think of a bedspread my sister had in 1977). <br>These are a couple of ideas I put together to get started. Fonts used are Akzidenz and Hitchcock (clumsily modified). <br> <br>Does anyone have advice or suggestions on the design? Thanks in advance, I value your opinions.<img src="http://www.typophile.com/forums/messages/29/37478.jpg" alt="logo 1"><img src="http://www.typophile.com/forums/messages/29/37479.jpg" alt="logo 2"></p>
