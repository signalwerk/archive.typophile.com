    html: <p>The left seems more credible as a potential political logotype. The right isn't as powerful to me, and doesn't uplift my spirit as much as the left. The left shows direction. The fist seems to cliche. The lowercase e seems awkward and whimpy. Take a look at other Grotesque faces(maybe Helvetica) I like Scott's suggestion about the point of the star making the A, seems like a good idea.  <br> <br>A good political logo in my mind would be one that tries to appeal to the swing voters not the already established far left or far right. <br> <br>If the pink is a necessity, then you meed some strength to contrast the femininity.</p>
