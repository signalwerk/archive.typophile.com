    html: <p>I like your designs. One thing though, the hand in the second design looks quite masculine. It also has a Black Panthers feel to it. Which might be just fine depending upon how "revolutionary" the women are and what political issues they are representing. <br> <br>Not knowing the applications for the logo it's hard to say for sure, however I think your choice of magenta (over yellow) is a safe one. If the logo is being printed small, on a brochure for example, the yellow could get lost.</p>
