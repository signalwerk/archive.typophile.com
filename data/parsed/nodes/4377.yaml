    date: 2004-04-22T18:45:00
    votes: null
    html: <p>Thanks everybody! <br> <br>Meir, I appreciate the encouragement, and suggestions. <br> <br>Hrant, thanks for making such a detailed analysis. <br> <br>Addison, this is a 'challenging side project' rooted in percieved need. Of course I hope that this can find <i>real</i> use for <i>real</i> need. The definition of the problem, the whys and the rules helps me get out of my own way and concentrate on the <i>doing</i>. I don't just want to say <i>I want to make a geometric sans</i> because it doesn't supply me enough traction. <br> <br>I am definitely going to re-visit 'Q' , UC 'I' ,'k' and 's'. The idea of a more circular whole for the 's' is useful idea and I want to explore that. I see the tipping 'z' now, funny how that kind of thing can disappear on you. <br> <br>The 'a'... well I don't know if I'd say <b>dorky</b>, but I also don't think I am totally happy with it. I want to keep it two-stories though, that's for sure. I have a couple ideas I will explore. <br> <br>Hrant, if my numerals are too mannered do I fix it by encouraging them to be ill-mannered? :-) Kidding aside, I suspect this is because when I was a draftsman I prided myself on my numerals. I'm not sure I have an idea or reference point about where to go with them. Any suggestions? <br> <br><i>Can't wait to see a text sample</i> <br> <br>Me too.</p>
