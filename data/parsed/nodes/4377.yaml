    user_image: /files/pictures/picture-2332.gif
    date_raw: 21 Dec 2004 — 9:56pm
    date: 2004-12-21T21:56:00
    votes: null
    html: "<p>Thanks Hrant. I still need to get some solid hours to get my head back into this and look at everything. <br> <br>Descenders...Thinking about balancing technical or performance demands with something that is attractive... <br> <br>Things that make short descenders sensible are: <br>presumably limited vertical space in labelling situations, concern with collision of parts of an illustration or diagram <br> <br>Things that make long descenders useful or okay are: <br>no long text or immersive reading requirement (not a text face), distinction from other letters(?), attractiveness and distinctiveness as letters and as Kompass (say compared to other geo-sans). <br> <br>Studying the existing descenders though they look pretty good, and I'm going to try to make some studies soon.</p>"
  - id: 32366
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 21 Dec 2004 — 10:26pm
    date: 2004-12-21T22:26:00
    votes: null
    html: "<p>There are indeed pros to long descenders, and in some cases it makes great sense. But the \"limited vertical space\" con you mention is sort of an extreme manifestation of a much broader functional requirement leading to the need to make descenders notably shorter than ascenders in any \"real\" text face: <br> <br>Since economy is <i>always</i> a factor (to some extent), and you need the apparent leading to be <i>just right</i> to ease \"linefeeds\" but without waste, optimal usage of the vertical space has a direct bearing on functional merit; it's not really that you want to avoid lines touching (which can only happen with very narrow measure), it's simply that the space you give to the descender zone might be better used elsewhere. <br> <br>As you say though it's a matter of balance, as always. It seems to me that the pivotal character is the \"g\"; generally it must look <i>slightly</i> cramped for the balance of Cartesian usage versus overall aesthetic integrity to be good for text. <br> <br>hhp</p>"
  - id: 32367
    user_id: 3346
    user_name: john_todoroff
    user_path: null
    user_image: null
    date_raw: 23 Dec 2004 — 7:43pm
    date: 2004-12-23T19:43:00
    votes: null
    html: <p>Jon,  I tried to imagine what the typeface would look like in the context of a map or library label. All-caps settings tend to be used often (for headings, tables, etc.) and I think the uneven width of your capital letters would look somewhat awkward. Shrinking the W and M would help; make the narrow glyphs (B, P, R, U, V) a little wider so they'll sit nicer next to the wide round letters; but don't compress the round glyphs or you'll kill the geometric quality. The R needs work -- it looks like a B with the bottom chopped off, and a straight leg would suit your intent better. <br> <br>The number 1 should have a wider "beak," (and maybe a "foot") for the same reasons. <br> <br>I like Avenir but it's been getting overused, so I'm interested to see where you take this. I think there is a niche for a font that has the "flavor" of Avenir but is tailored for a certain function. (Hmm, I wonder, what's the flavor of Avenir... does it taste like Cool Mint Listerine, chewable vitamin C tablets, a raspberry Stoli &amp; soda?) <br> <br>//john</p>
