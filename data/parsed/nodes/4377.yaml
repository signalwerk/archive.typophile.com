      <p>Well, now it's redundant. The original two-storey 'a' and 's' gave this face an identity and a reason to exist, and I don't think there was anything wrong with them.</p>
      <p>The 'R' looks awkward, but I don't think the leg must be straightened necessarily. I think it just needs to join a little further to the left.</p>
      <p>The 'A' and 'V' should match; you can see the problem in 'ARRIVALS.' A compromise between the two angles you have now would probably be best for this face.</p>
