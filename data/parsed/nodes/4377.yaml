    html: <p>John, Thanks for your input. Perfectly timed as I revisit the many aspects of this project. It is very true that all caps is common in labelling on maps and in libraries, and your advice makes a great deal of sense in this respect. <br> <br>When I drew the glyphs it was of great concern to me that I not end up with another Futura. I like Avenir a lot, and was making decisions on some of the glyphs like 'f' and 'R' to intenionally diverge from the path. <br> <br>Your suggestions strike a chord with me and I will give them serious thought. <br> <br>To my thinking Avenir = Cool Mint Listerine (minty with a little hint of medicine).  <br> <br>Jon</p>
