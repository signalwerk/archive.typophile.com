    html: |-
      <p>Well I finally carved out some time to return to this.</p>
      <p>I have redrawn many of the letters, incorporating many of the suggestions here (an improvement for sure). Here's the deal:<br>
      - Narrowed the 'W' and 'M'<br>
      - redrew the 's' which is more geometric now, but I'm afraid is too narrow<br>
      - Just noticed that the uc 'S' needs to be redrawn too, especially its tail.<br>
      - terminated the hook in the 'J' and 'j' earlier and they look nicer now.<br>
      - K as noted in an earlier post<br>
      - uc 'i' has bars on it but I got scared and they look knobby. Same with 'J'.<br>
      - lc 'a' is now a single storey (sigh) which works better.<br>
      - 'Q' has a new tail.<br>
      - lc 'L' stroke too thick and 'X' strokes too thin.<br>
      - also redrew the lc 'y' and shortened its extender.</p>
      <p>I took the drawings into TypeTool and generated this font. The sample was made with the newly generated font in Illustrator and converted to outlines for the PDF so I didn't run into any weirdness. I did some ignorant kerning and spacing but I have never used a font editor before so this is obviously crude. No punctuation or numerals have been revised since the earlier drawings and are not in the font at this time.</p>
      <p>Are W and M narrow enough now? Should I straighten the leg of the R? Please comment on anything as you see fit.</p>
      <p>Download the <a href="http://homepage.mac.com/jon_whipple/pdfs/20060105_KompassSample.pdf" rel="nofollow">20060105_KompassSample.pdf</a>.</p>
      <p>A small gif to give you a clue:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/20060105_KompassSample.gif"></div><p></p>
