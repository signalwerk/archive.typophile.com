    html: "<p>&gt; do I fix it by encouraging them to be ill-mannered? <br> <br>:-&gt; <br>Well, they're only mannered in the context of the alphabetics. <br>And maybe \"mannered\" wasn't even the right term (except for the \"3\"). <br>Looking at them more carefully: <br>- The zero is a bit eggy but I think that's in character. <br>- The one and 2 are great. <br>- The 3 needs to decide what number it is. <br>- Try a bowed diagonal on the 4. <br>- I guess the 5 is kinda mannered too - that point is too strong. At the least make the bar longer. <br>- The 6 and 9 seem too big in the bowl. <br>- Like the 5, the 7's point is too much. Plus I might pull in (and maybe flatten) the main stroke. <br>- The 8 is squooshed. I know you don't want to make it too small though. <br> <br>hhp <br></p>"
