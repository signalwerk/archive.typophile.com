    votes: null
    html: <p>Awe, Hrant -- I like the "a". <br> <br>Maybe the "s" is leaning back a little, or maybe it does need to be more circular. What about hybrid numerals? <br> <br>Jon, are you creating this out of a real need for this type of font, or is it more of a challenging side-project? Just curious. Can't wait to see a text sample... <br> <br>-Addison</p>
