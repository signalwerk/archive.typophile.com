    html: <p>Very well done! I'm a big fan of geometric faces. <br> <br>Q's tail's a bit too small I think. Also your lowercase "k"'s arms are a bit ill-proportioned. The upper curve on the figure "3" is a bit dissonant. <br> <br>Good luck on this one, it's beautiful.</p>
  - id: 32356
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 22 Apr 2004 — 10:09am
    date: 2004-04-22T10:09:00
    votes: null
    html: "<p>I think this can become a pretty solid font - the idiosyncracies (like the \"f\") keep it from being too generic. One thing I'd worry about though is the vertical proportions: for diagram work you might like a bigger x-height, although that will make it less elegant. The caps are somewhat large, but that might actually be a good thing for display work. <br> <br>In the UC, the only problem I see is the \"Q\": I agree with it being non-descending, but then you should try having an internal part to the tail. Actually, I'd change the \"I\" as well: for technical labeling serifs would help legibility. <br> <br>In the lc: <br>- The \"a\" looks... dorky. Not sure how to fix it. <br>- I'd raise the dots on \"i\" and \"j\" (except if you'll be pulling in the extenders). <br>- The \"k\" isn't working. <br>- The beak of the \"r\" is big, but if you keep the spacing loose (since it's a light face) it might work. <br>- The \"s\" can have a small head, but I'd make the whole more circular - like in Futura. <br>- The \"y\" is too small. <br>- The \"z\" is leaning right. <br> <br>Numerals: to me they seem too mannered. <br> <br>-- <br> <br>Darker weights: you'll have to do a lot of modulation at the joins. <br>Italics: a sensitive slanted-Roman seems in order, maybe with some shears at the terminals <br> <br>Keep at it! <br> <br>hhp <br></p>"
