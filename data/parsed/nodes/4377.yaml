    html: <p>You are correct, and I actually think it's more of a utility thing! When I saw your initial post, I thought to myself, "Excellent, someone has <em>fixed</em> the <em>legibility problem</em> common to many geometric sans." <em>Especially</em> for labelling. Whether at small screen sizes, small print with ink gain, lacking one's reading glasses, or just from glancing at it too fast, there is a huge potential for 'a'/'o' confusion. If the tiny words in your gif were out of context, on a map, for instance, I honestly wouldn't know if I were looking at 'Rambas Tocos' or what.</p>
