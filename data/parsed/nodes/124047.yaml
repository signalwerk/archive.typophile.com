    <p>Hi, new to Typophile</p>
    <p>Just uploading some work I've been doing, hoping for some criticism. I'm still working on kerning and special glyphs as well as different weights. I'm hoping to maybe get this to market in a few years (wishful thinking, I know). It's called Bhambu. It's made for body text and I think it's pretty easy on the eyes even at smaller sizes (9-11pt). Let me know what you guys think. </p>
    <p>Thanks, </p>
    <p>Jamie</p>
