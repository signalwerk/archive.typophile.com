    html: |-
      <p>We heavily researched numerous possibilities for the best way to render out type samples, and begrudgingly, went with Flash. I'm the last person who wants to use Flash for Typedia, but it's simply the best option for the sake of fidelity, even at the expense of some people not being able to contribute. </p>
      <p>Other options (like images) suffer from a few big faults. 1) being locked into a specific size and character set. 2) different programs AND different operating systems introduce a myriad of different rendering options (most of which will introduce uncomfortable and inconsistent irregularities in character display). 3) the human factor. People will futz with size, color, and content of any templates we provide, which can harm any consistency Typedia might strive for. 4) content. We've already adjusted the content of the type samples from our holder swf since launch, and plan to change it again soon. Originally it was ABC... abc..., we changed it to AaBbCc..., and now we've been talking about displaying a word or pangram along with that to get a better sense of the way type looks. 5) flexibility. We use the same swf to generate the small samples seen in the site's sidebar, the medium samples seen on the listing pages, and the big detail samples that popup from the listing pages. It's considerably (though not entirely) future-proof, by comparison to images.</p>
      <p>All of these things make image file alone a much weaker option.</p>
      <p>I see this is a possible nice inroads to mixing type folks with type enthusiasts too. Type folks can help with listings and the people who buy fonts can help with samples. I know it's not ideal, but it's the best of what we have right now. I will jump at the chance to improve this in the future.</p>
