      <p>&gt; I suspect this site will be partial to popular faces, and to foundries that commit to uploading their faces, describing them in glowing terms, and leveraging “similar to” links and search ranking.</p>
      <p>But not unlike Wikipedia, it's kept in check by it's community. If someone starts swaying things in a marketing direction, there will be backlash.</p>
      <p>&gt; I was amused to see that Archer (“Sweet but not saccharine, earnest but not grave, Archer is designed to hit just the right notes of forthrightness, credibility...”) is listed as a Scotch Modern (“medium to high stroke contrast”)</p>
      <p>That's kind of the point, if you see something inaccurate, you have the power to correct it.</p>
      <p>&gt; BTW, whether it originates from foundry (which I doubt in this case) or fans, the effect is still highly promotional.</p>
      <p>This is the same information that you can collect by searching for a typeface in Google. We made it easy to post information about how a foundry describes one of their typefaces (and credit a source, namely the foundry site), but there is just as much of an opportunity for anyone to change that to something more impartial.</p>
      <p>&gt; I have to agree with Nick about impartiality. If Typedia wants to be an impartial source, people who paste in their marketing copy need to have their user accounts and IP blocks permanently banned in the same way that the IP blocks associated with the US congressional offices have been banned from Wikipedia.</p>
