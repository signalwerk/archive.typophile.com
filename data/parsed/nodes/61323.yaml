    html: |-
      <p><strong>Conversations and expertise</strong></p>
      <p>I have admired Typophile since I found out about it a few years ago, and not only because it's full of knowledgeable folks who love type and are happy to share what they know.</p>
      <p>Typophile maintains <strong>the best forum that I have seen anywhere</strong>. Nick mentioned the challenge that uploading images presents; whether issues like this fall on experience design or are just a matter of user familiarity, they'll happen in every system. I haven't run into this problem at Typophile, but I have on other sites. Regardless, Typophile's forum is top-notch, and I won't stop <a class="freelinking external" href="http://nicewebtype.com/notes/2009/05/27/criticism-for-web-typography/" rel="nofollow">telling folks</a> to visit, participate, and appreciate it. New readers: <a class="freelinking external" href="http://typophile.com/user/register" rel="nofollow">signup is free</a>.</p>
      <p>Not only does Typophile sport the finest forum I've found, but there's a wiki seamlessly integrated. Zara, thank you for the reminder about Typophile's <a class="freelinking external" href="http://www.typophile.com/wiki" rel="nofollow">Typo Wiki</a>. It is an excellent resource, and I find myself there all the time without even realizing. Terms linked from forum posts lead me there.</p>
      <p>The promise of tools that interoperate like this is nothing short of phenomenal; although wikis, in my experience, only occasionally deliver on their part of such a promise. Most of the time they're incomplete or inaccurate.</p>
      <p>The Typo Wiki, by luck or by consistent care, is an exception; it usually provides me something of value, and often something I hadn't already known. Sometimes the superscript "w" links I follow lead to empty entries, but that's to be expected in every wiki. The information I do find in the Typo Wiki feels <strong>reliable, accurate, and thorough</strong>, and I have every reason to believe that it is those things because there is every indication of watchful guidance and wisdom from folks who know what they're talking about.</p>
      <p>This is my experience of Typophile. Type experts, always eager to talk and offer thoughts or tips, as well as occasional, rich wiki references that support conversations in the forum. <a class="freelinking external" href="http://typedia.com/" rel="nofollow">Typedia</a> is a new way in to this experience.</p>
      <p><strong>Structure and ease of use</strong></p>
      <p>Typedia is a wiki inasmuch as it affords community editing, but the reason it works so well is that it breaks away from wiki convention. It is very structured and easily navigable in ways that are often neglected by not only other wikis but other reference materials in general; these qualities, and the strength of the interface design that reveals them, makes Typedia feel <strong>forgiving, easy, and fun.</strong></p>
      <p>Take for instance the <a class="freelinking external" href="http://typedia.com/good-deeds/" rel="nofollow">Good Deeds</a> feature. If there are entries missing pieces, this feature encourages visitors to fill in the gaps. Consider what predicates such a feature:</p>
      <ul>
      <li>Having structure enough for the concept of gaps</li>
      <li>Allowing for partial entries, and</li>
      <li>Crafting copy that turns small chores into gold stars</li>
      </ul>
      <p>No other reference material anywhere enables this kind of behavior in small doses so concise and so effortless as found in Typedia.</p>
      <p>Knowing that such a feature exists also makes contributing a lightweight task. If you want to help, all you need to know is the name of a typeface, type designer, or foundry. Leave the rest. Not only does this make for a fuller 'pedia, it makes for satisfied, engaged participants.</p>
      <p>Of course, the capacity of a tool built by a handful of careful, thoughtful folks and a horde of folks with more enthusiasm than availability/knowledge is questionable. That's why Typedia needs <em>you</em>.</p>
      <p><strong>Typedia for the basics, Typophile for the truth</strong></p>
      <p>Perhaps this heading is misleading; Typedia won't be "false," although misinformation is a constant concern, and Typophile offers plenty of basics if you know where to look. But Typedia's natural aptitude is for quick facts and nimble browsing, and Typophile's strongest faculty is its final word.</p>
      <p>The presence of masterful thinkers and craftspeople at Typophile, despite the friendliest of exchanges I've witnessed, is a barrier for some folks because it is overwhelming. Typedia removes this barrier at the cost of being, in the short term, empty and only somewhat relevant. But <strong>these things will change</strong> in time thanks to the coexistence of these two resources.</p>
      <p>Typophile needs a note taker, and Typedia needs things to write down. These resources will prosper and be intertwined. Let's encourage folks to use both (cross-linking of various kinds is a great idea and has much potential), and play our participation to the strengths of each.</p>
    html_clean: |-
      <p><strong>Conversations and expertise</strong></p>
      <p>I have admired Typophile since I found out about it a few years ago, and not only because it's full of knowledgeable folks who love type and are happy to share what they know.</p>
      <p>Typophile maintains <strong>the best forum that I have seen anywhere</strong>. Nick mentioned the challenge that uploading images presents; whether issues like this fall on experience design or are just a matter of user familiarity, they'll happen in every system. I haven't run into this problem at Typophile, but I have on other sites. Regardless, Typophile's forum is top-notch, and I won't stop <a class="freelinking external link-external" href="http://nicewebtype.com/notes/2009/05/27/criticism-for-web-typography/" rel="nofollow">telling folks</a> to visit, participate, and appreciate it. New readers: <a class="freelinking external link-lost" href="http://typophile.com/user/register" rel="nofollow">signup is free</a>.</p>
      <p>Not only does Typophile sport the finest forum I've found, but there's a wiki seamlessly integrated. Zara, thank you for the reminder about Typophile's <a class="freelinking external link-lost" href="http://www.typophile.com/wiki" rel="nofollow">Typo Wiki</a>. It is an excellent resource, and I find myself there all the time without even realizing. Terms linked from forum posts lead me there.</p>
      <p>The promise of tools that interoperate like this is nothing short of phenomenal; although wikis, in my experience, only occasionally deliver on their part of such a promise. Most of the time they're incomplete or inaccurate.</p>
      <p>The Typo Wiki, by luck or by consistent care, is an exception; it usually provides me something of value, and often something I hadn't already known. Sometimes the superscript "w" links I follow lead to empty entries, but that's to be expected in every wiki. The information I do find in the Typo Wiki feels <strong>reliable, accurate, and thorough</strong>, and I have every reason to believe that it is those things because there is every indication of watchful guidance and wisdom from folks who know what they're talking about.</p>
      <p>This is my experience of Typophile. Type experts, always eager to talk and offer thoughts or tips, as well as occasional, rich wiki references that support conversations in the forum. <a class="freelinking external link-external" href="http://typedia.com/" rel="nofollow">Typedia</a> is a new way in to this experience.</p>
      <p><strong>Structure and ease of use</strong></p>
      <p>Typedia is a wiki inasmuch as it affords community editing, but the reason it works so well is that it breaks away from wiki convention. It is very structured and easily navigable in ways that are often neglected by not only other wikis but other reference materials in general; these qualities, and the strength of the interface design that reveals them, makes Typedia feel <strong>forgiving, easy, and fun.</strong></p>
      <p>Take for instance the <a class="freelinking external link-external" href="http://typedia.com/good-deeds/" rel="nofollow">Good Deeds</a> feature. If there are entries missing pieces, this feature encourages visitors to fill in the gaps. Consider what predicates such a feature:</p>
      <ul>
      <li>Having structure enough for the concept of gaps</li>
      <li>Allowing for partial entries, and</li>
      <li>Crafting copy that turns small chores into gold stars</li>
      </ul>
      <p>No other reference material anywhere enables this kind of behavior in small doses so concise and so effortless as found in Typedia.</p>
      <p>Knowing that such a feature exists also makes contributing a lightweight task. If you want to help, all you need to know is the name of a typeface, type designer, or foundry. Leave the rest. Not only does this make for a fuller 'pedia, it makes for satisfied, engaged participants.</p>
      <p>Of course, the capacity of a tool built by a handful of careful, thoughtful folks and a horde of folks with more enthusiasm than availability/knowledge is questionable. That's why Typedia needs <em>you</em>.</p>
      <p><strong>Typedia for the basics, Typophile for the truth</strong></p>
      <p>Perhaps this heading is misleading; Typedia won't be "false," although misinformation is a constant concern, and Typophile offers plenty of basics if you know where to look. But Typedia's natural aptitude is for quick facts and nimble browsing, and Typophile's strongest faculty is its final word.</p>
      <p>The presence of masterful thinkers and craftspeople at Typophile, despite the friendliest of exchanges I've witnessed, is a barrier for some folks because it is overwhelming. Typedia removes this barrier at the cost of being, in the short term, empty and only somewhat relevant. But <strong>these things will change</strong> in time thanks to the coexistence of these two resources.</p>
      <p>Typophile needs a note taker, and Typedia needs things to write down. These resources will prosper and be intertwined. Let's encourage folks to use both (cross-linking of various kinds is a great idea and has much potential), and play our participation to the strengths of each.</p>
