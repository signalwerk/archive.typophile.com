    <p>As you may know, we have a brand new seedling to nourish: <a class="freelinking external" href="http://typedia.com/" rel="nofollow">Typedia</a>. Besides poking around the site, I recommend the following reading:</p>
    <p>* Jason Santa Maria: <a class="freelinking external" href="http://jasonsantamaria.com/articles/introducing-typedia/" rel="nofollow">Introducing Typedia</a><br>
    * Yours truly: <a class="freelinking external" href="http://nicewebtype.com/notes/2009/08/24/why-typedia-matters/" rel="nofollow">Why Typedia matters</a></p>
    <p>I hope you like Typedia as much as I do. As with any similar resource that's open to mass editing, there are bound to be opportunities for people to scoff and snarl at inaccuracies and naiveté. But if I know Typophiles the way I think I do, our positive, helpful camaraderie will only exponentially improve tangential projects and resources like this one.</p>
    <p>How do <em>you</em> feel about this new resource? Do you have any questions or concerns?</p>
