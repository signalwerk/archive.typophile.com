      <p>How useful will this be as a comprehensive or balanced resource, if a critical mass of foundries decide not to upload their font info?</p>
      <p>You state, "There is no corporate influence unless a particular distributor decides to flood the library with their own type," but isn't the site predicated on corporate involvement to provide content?</p>
      <p>I have enough trouble supporting my distributors with new product and metadata, let alone servicing third parties.<br>
      For instance, MyFonts' graphic files ("posters") are "crowdsourced" from its suppliers--I would be more inclined to work on those, than for Typedia.</p>
      <p>The content will be provided by some foundries, and some fans, but there will be large gaps.<br>
      IMO, naming it "-pedia" implies a scope that may not emerge.</p>
      <p>I hope this isn't too much of a damper on an innovative idea, but I believe these are legitimate criticisms of your business model.</p>
