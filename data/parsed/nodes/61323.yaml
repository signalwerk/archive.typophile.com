      <p>For my part, I've so far only posted one of my families (Coquette), and that was during the private beta period. The others have been posted by others. I took the liberty of adding samples to those since they were incomplete or missing.</p>
      <p>A foundry doesn't necessarily have to post their library, unless perhaps they feel that it's being overlooked by Typedia's users. Ideally most of the entries would be contributed by users of typefaces.</p>
      <p>I'm interested in adding older pre-digital typefaces that haven't been digitized (or may never be). The one problem I see with the way samples are done is that there is no way to add faces that are not available in digital outline format.</p>
      <p>Another thing I'd like to see people add is information (and samples if possible) about custom or proprietary faces. This is something one would not likely find on a site selling fonts.</p>
