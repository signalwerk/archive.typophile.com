    html: "<p>During the day, at the office: copious amounts of Hinckley Springs water and equal amounts of some wretched institutional coffee or other.  <br> <br>At night, at home (or with the laptop out and about) it's generally booze, punctuated by periodic intakes of water. Scotch rocks is the perennial favorite. Arbeg, Laphroaig, or Lagavulin (in order of preference) are the favorites. Usually it ends up being something like Dewar's or Ballantine's however. Unlike the esteemed Mr. Hudson, I prefer the 10 year Laphroaig to the 15. <br> <br>Beer comes in a close second. Old Style (the mainstay of Chicago) tops the list. Singha takes silver, with anything Polish (Tyskie, Dojlidy, Okocim) going home with bronze. <br> <br>And since I hear it's better for the ticker, I'll throw an odd bottle of wine in here and there. Typically Chileans (Gato Negro or Concha y Toro). I finally gave up my grad school obsession with 3-liter screw-top jugs of Livingston Cellars ;-)</p>"
