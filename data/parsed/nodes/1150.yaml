    html: "<p>Years ago, at my first ATypI conference, Dave Farey explained to me the correlation between the italic slant angle and the number of glasses of wine consumed by the designer. <br> <br>During the day, I usually have a glass of water handy (next to the bag of double salt licorice -- they sort of cancel each other out in the system), but in the evening a glass of wine is not uncommon (usually a shiraz or shiraz blend, usually Australian), and if I'm still working at a later hour I have a scotch (usually Lagavulin, always single malt, never less than 12 years old - because some snobbery is good snobbery). I tend not to drink coffee while I'm actually working: if I need to stay up all night to meet a deadline, I find chocolate covered espresso beans to be more effective. But coffee is <i>very</i> important in other ways, so once or twice a day I leave my desk and walk to <a href=\"http://www.caffeartigiano.com/\">this place</a>.</p>"
