    html: <p>I have a source for the real thing, although I've only tried it once. It really isn't a strong hallucinogen, as many people believe, unless you were to drink a lot of it (I had about two fingers, straight, and didn't see anything unusual except a man sitting next to me playing a ukelele, but he turned out to be real). The impressive thing about absinthe is the apparently perfect balance of the depressives in the alcohol with the stimulants in the wormwood. <br> <br>You can make your own laudanum very easily if you have the poppies. A lot of perfectly respectable people in Victorian England made their own. <br> <br>I should point out that I'm not a drug user, and never drink with the intention of getting drunk. Just in case anyone was wondering.</p>
