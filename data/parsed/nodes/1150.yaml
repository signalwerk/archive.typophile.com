  html: <p>well, it says "anything goes" and since people do seem to enjoy one or the other non-quite-type-related-thread on this board, i was wondering, what liquid goes best with designing typefaces. it's a personal choice, of course, which might make this thread as interesting as "What's your desk, studio etc look like?". at least i hope so. <br>for me it's basically fresh ground italian coffee (Saquella) and natural french mineral water (Vittel) during the day. but if i'm still in front of the screen after the sun has left the building, i tend to grab something "more enlightening". in my case that would be either beer from eastern europe (Budweiser or Pilsner Urquell) or red wine from spain or preferably from northern italy, depending on the weather and mood. btw, i'm german and live and work in hamburg, so my poison is not as sophisticated as it might look to people on "the other side of the pond".</p>
