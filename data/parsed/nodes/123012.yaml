    <p>hello all!</p>
    <p>this somewhat modernist blackletter font is from columbia sax 2259 but was used on most of gieseking's series of beethoven sonatas (the remaining being 33cx mono).</p>
    <p>i could'nt produce any close results with wtf but then again blackletter is a vast country…</p>
    <p>looking forward to your input!</p>
    <p>thanks<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/fraktur_3975.jpg"></div><p></p>
