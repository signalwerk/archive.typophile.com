    votes: null
    html: |-
      <div class="comment-spam-body"><p>Solved more of the puzzle.<br>
      The original name of the font seems to be Kloster-Gotisch and it is German rather than French. I believe that Scriptorium called it "Rousseau" because this name appears in the type specimen, as published by Ludwig Petzendorfer </p><div class="imageWrap"><img src="http://typophile.com/files/KlosterGotisch2SM_6124.jpg"></div> The specimen is for the "magere" or lighter weight.<br>
      I believe that your lettering is from the "fette" or bold weight of Kloster-Gotisch or from an extremely similar font.<br>
      Don<p></p>
      </div>
