    html: |-
      <div class="comment-spam-body"><p>Found a match to your font.<br>
      Fontcraft/Scriptorium sells a version as "Rousseau" in its Nouveau Gothic Package </p><div class="imageWrap"><img src="http://typophile.com/files/NouveauGothicPkgScriptorium_4641.gif"></div><br>
      <a href="http://www.fontcraft.com/scriptorium/masterfonts/" title="http://www.fontcraft.com/scriptorium/masterfonts/">http://www.fontcraft.com/scriptorium/masterfonts/</a><br>
      ---start quote---<br>
      Our first Master Fonts package features three type styles based on late 19th century designs which were influenced by Gothic calligraphy filtered through the Arts and Crafts and Art Nouveau movements. Kelmscott is based on William Morris' classic Troy type design. Joyeuse is based on an English font of the same period which was clearly influenced by Morris. Rousseau is derived from a slightly later French design which shows many of the same influences.<br>
      ---end quote---<br>
      Rousseau is probably not the original name of the font, a heavier version of which would seem to be the original source of the lettering on your Columbia record titling.<br>
      Note that Rousseau is a lighter version of the letters than the ones in the Columbia record titling.<br>
      Don<p></p>
      </div>
