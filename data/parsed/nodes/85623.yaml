  html: |-
    <p>Hello smart typography folks!</p>
    <p>I am trying to use the ヒラギノ丸ゴ Pro W4 typeface (Hiragino Maru Gothic Pro W4) but am finding that certain glyphs are missing (please see top part of attached image). Are these glyphs just not available in this typeface or is there some kind of workaround?</p>
    <p>I'm having trouble finding the glyph set to determine which characters should be available. I understand that this may be a standard OS X typeface so that may be part of the issue.</p>
    <p>Do you have any chinese round sans serif typeface recommendations like this one but in a complete set?</p>
    <p>Thanks for any assistance that you can provide.</p>
    <p>Josh</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/w4_4015.png"></div><p></p>
