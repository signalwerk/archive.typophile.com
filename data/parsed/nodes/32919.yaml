    <p>There are two main forms of the letter ’a’ in common usage.</p>
    <p>The first appears to be more common in print, and the other in handwritten text (we learn it at school), but some fonts use the latter form.  Some fonts even use one form in regular style, but the other form in italic.</p>
    <p>My question is simply, do these two different forms of the letter have names?  I’m sure they must, and I need to know for a report I’m writing, but Googling for anything where one of the key words is a single letter is nearly impossible.</p>
