      <p>American Greeting Script - a typeface from long before digital fonts. Thanks to Mike Yanega, you can see a showing of one of the digital versions (Altast Greeting) <a href="http://bowfinprintworks.com/Script01Pg1.html" target="_blank">here</a> and the names of various digital versions <a href="http://bowfinprintworks.com/ListPages/ScriptListAB.html" target="_blank">here</a>.</p>
      <p>Unfortunately, all of the font companies are long gone. Web search is your friend ...</p>
