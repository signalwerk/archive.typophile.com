      <p>I think what Mike F was trying to say, if I may try to rephrase it, is that many fonts we have are digital re-creations (revivals) of old pre-digital typefaces. "Altast Greeting" is such a re-creation, and was re-named to avoid possible copyright issues with the typeface name.</p>
      <p>- Mike Yanega</p>
