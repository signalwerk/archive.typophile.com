    <p>Hello all!<br>
    I just wanted to introduce myself and say how much i’ve enjoyed reading and learning  from this forum over the last year.<br>
    I’ve  been fascinated with typography my entire life... I just never realized  it until a few years back when my advertising friend, looking around my apartment, commented: ’Wow, i didn’t know you were such a typography fanatic!’</p>
    <p>“Typoga...what?”</p>
    <p>He was referring to my ’art’: an old eye exam chart i found in the trash and proudly displayed over the TV, the barber shop signs in my bathroom, the cursive primers stacked on the coffee table, the technical manuals, the theatre marquee letters, the chunk of  chinese billboard, the endless photographs i had taken of road signs, hotel signs, neon words and on and on on....</p>
    <p>Looking around at my endless collection of signage it occured to me - for the first time - there was a common THEME here.</p>
    <p>“Oh...you mean i like letters?  Well.  Yeah. I guess i do like the um, typo..geograph... yes i’m a fan.” </p>
    <p>You know the expression about the pink elephant in the room but no one dares mention it?  Well, I had a big ol’ boldfaced typo elephant sitting in my LIFE and hadn’t even NOTICED it.  But thinking on it I began to realize had ALWAYS been in love with letters, with handwriting, with printed materials, with signage and alphabets.  Always had this intense, unexplainable fascination... it ’spoke’ to me somehow.  But I had simply never though about it till that moment.  </p>
    <p>(’boldface’ elephant, get it? It’s a joke!  It’s not funny. i know)  </p>
    <p>But wait!  How can letters be speaking to me?<br>
    Suddenly I became confused by this paradox: </p>
    <p>Letters are JUST a utility to words for communication, right?  Words have meaning, so words can move you.  But i wasn’t interested in words.  I was interested in the characters themselves.  But that makes no sense!  How could the shape of a letter move me?  Excite me?  Bring me more aesthetic satisfaction than a heartfelt painting?  A letter is just a letter.  Meaningless and cold when out of the context of a word.<br>
    So how the heck is it they seem to speak to me so strongly?</p>
    <p>I decided to get to the bottom of this disturbing discovery that i was inappropriately attached to letters....<br>
    starting with a check into the whole typograwhatever thing.  Being a ’fan’ and all, I thought it might be appropriate to know what the word meant.  Now, i knew what a FONT was.  I actually even considered myself quite a little font snob, boy howdy, because i liked to change from Times to Ariel when i typed out a Word document. How bout that for discriminating taste?  And when i was really feeling wild i might throw in some Impact cause I found it to be rather....um, well... impacting.  Yessir.  That’s what this font snob had to offer.</p>
    <p>I googled ’typography’ and got the jist of it.<br>
    I googled ’serif’ and received some pretty upsetting insider information —- ’serif’ was not synonymous with ’italic’ after all.<br>
    I noodled around the internet for a couple of weeks.  Discovering answers to silly questions i had and picking up little tid-bits of Type101 kindov stuff.  I was hooked. I decided to dig a little deeper in my quest for knowledge.<br>
    So I went to typophile.com<br>
    And I  freaked.  Major overload for my little green brain.<br>
    I mean, when  the only decorative/display font you know is ’DemBones’, for example,  typophile forums are a heavy read.<br>
    Like, impossible heavy. Black hole weight heavy.   I might have well been reading a newspaper from another planet.  one with a black hole nearby.<br>
    I desperately scanned the posts for context clues.  Maybe I’d find a familiar key word like ’serif’.  Anyone?  Serif? Let’s talk serifs! It’s not the same as an Italic, you know. Uh.... Anyone else discovered the impact of Impact? Hum?  No?  Any  DemBones fans?  ’Cause i’m thinking those knobby bones make it a legitimate serif.  What do ya’ll experts think? </p>
    <p>I wanted to understand why  typography spoke to me... I just needed a translator!  But the tech was so over my head, and i couldn’t get to the heart of what i was looking for.<br>
    So.<br>
    I convinced myself  that i like letters simply because they DON’T speak to me.  at all.  I figured i’m just a minimalist, and a painting of the letter ’A’ is easier on the eyes than a Rembrant.<br>
    So i forgot about it.  Switched hobbies.  Learned how to bake bread instead. </p>
    <p>————-</p>
    <p>Skip ahead a year.  I’m showing my mom photos from my trip to Prague.  </p>
    <p>“Look mom... this #34 was painted on the street.  And this ampersand was taken with my zoom lens from a circus billboard.  And this is graphitti on the famous clock building.  Oh! and this ’B’ is in a church stained glass window.  Isn’t it cool? </p>
    <p>’BUT, honey, there’s not ONE photo of YOU!?’ </p>
    <p>“Well i didn’t want to waste my film.  WAIT! I think there’s one photo of me holding a marionette.  You can have it”</p>
    <p>Point Being: The type obsession had crept back in apparently.</p>
    <p>This time i was incredibly fascinated by this Czech typographic look - not a specific typeface or anything - just a feel that permeated everything i saw in print on my trip.  Reluctantly i hit up google for “czech type”, leading me to Storm Type Foundry.<br>
    I was amazed there were such things as type foundries.  And type designers!  That just design type... like, that’s their job!?<br>
    I started reading Frantisek Storm’s ’Typomonolog’... Of course I had no idea what he was going on about.<br>
    But i continued reading.<br>
    I didn’t get any of the technical jargon, but something clicked with me in the way he described typefaces - not as typefaces, but as interpretations of everyday things I could grasp.   His eccentric analogies and descriptions - comparing characters to snakes, bent ironwork in the prague park, dogs with fat bodies and stubby legs - were thrilling to me!  I didn’t get what an x-height was, but i knew my basic animals!<br>
    I could look at his specimen,  read his description, look BACK up at the specimen and see.... yep, it’s a snake alright!  </p>
    <p>A light clicked on in my head.  I looked around at all my weird collections of alphabet art and understood.<br>
    i knew why it spoke to me.  What typography was all about...at least for me. </p>
    <p>The way I look at it, an alphabet it purely utilitarian.  It’s only there to serve a function and meet certain practical needs.<br>
    But underneath this armored shell of practicality,  in every typeface - in every individual character - there is a hidden, private and living space that belongs to the designer. They fill it as they please.  And with what they please.<br>
    Some stuff it full of ornamentry till it’s busting at the seam.<br>
    Some fill it with bits and pieces of other typefaces.<br>
    Some sneak in a  private  joke and keep it light and whimsical.<br>
    Some throw in scratch paper with their handwriting on it - and become confused - when it gets spit right back out.<br>
    And others simply reach in empty handed and leave nothing more than a subtle fingerprint.  </p>
    <p>...Snap the lid closed, tighten it up, solder the seams back to it’s original armored shell to avoid any confrontations with the function police.  And away the typeface goes to service the world of language.  </p>
    <p>But the question still remains: How can a single character speak to me if it’s not forming a word?<br>
    I guess I had the answer right in the first place:<br>
    A letter can’t speak.  Not at all.<br>
    It occurs to me it was never the letters that mesmerized me.  It was the designer’s voice in the background all along. </p>
    <p>Then again, if it’s a Storm typeface it’s probably a snake or a short-legged dog i’m hearing.</p>
    <p>————</p>
    <p>Now.  Whether that’s a weird way of looking at a typeface or a trite Typo Appreciation 101 way of looking at it i don’t know.<br>
    But I certainly look at typography in a different way than I did before. Now I’m working my way outward from the heart of it and trying to grasp the rest of the body.<br>
    Good News: Last year i revisited this site and could actually understand some of the discussions!<br>
    I’ve posted once or twice but i always get intimidated i’m saying something ridiculous.  So i thought “well, i should introduce myself.  That way they’ll know i’m a beginner and forgive me when i say something ridiculous.”</p>
    <p>However.<br>
    NOW i’m concerned i won’t be forgiven for posting THIS rambling post.<br>
    gee i was gonna write like 3 lines. i swear. i get so carried away.<br>
    OK.  Forget everything i just said.<br>
    This is what i meant to write: </p>
    <p>HI!  I’M LAUREN.  I’M NEW-ISH TO THE SITE.  REALLY LOVE YOUR FORUMS!  LOOKING FORWARD TO LEARNING MORE. THANKS!</p>
