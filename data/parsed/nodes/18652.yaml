      <p>Welcome. I want you to know I loved reading this, so your time was not wasted. We’re not really different from you; all the jargon you see in typography is stuff we’ve had to make up (whether a century ago or a week ago) so that we can talk about it without waving our arms too much. Our words for things don’t all match up, and even with a complete vocabulary, we all still have to say things like “The K doesn’t look as happy as the G. I think (insert technical stuff here) would cheer it up.” It all comes down to analogy eventually.</p>
      <p>I would dare to guess that what you are really fascinated with is not the letter itself or the voice of the designer, but the fact that one can go into the other. It’s what fascinates the designer too. No matter how much we learn, typography is a very alchemical thing. Everyone must feel around in the dark some to create something new.</p>
