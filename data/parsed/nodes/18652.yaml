      <p>As a self taught designer, I had a slightly similar kind of experience, initially spending hours and hours in libraries, reading old, or even very old books. When I got my first design “job” I discovered the exisitence of the yellow covered “Fontbook” with total amazement. I couldn’t believe so many type designs actually existed. It was a revelation to me. I rapidly bought myself a copy, and for maybe 18 months, I took it with me on the metro each morning whilst travelling to the studio, just reading and re-reading and re-re-reading. Absorbing fonts. And making lists of typefaces which spoke to me… and then I would re-make the lists, and I would go back to the type book and start again. That was when I discovered that I was crazy about typography…</p>
      <p>I was also very happy to discover typophile !!</p>
      <p>best wishes,</p>
      <p>pete</p>
