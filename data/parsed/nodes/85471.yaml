    html: |-
      <p>Yes, yes, it's true... CG Symphony = Syntax. I was there during the big "CG" development phase. It was during the "we won't license to Compugraphic" days by the majority of European foundries. You can generally find the original equivalent typeface of a "CG" font by the first one to four letters:<br>
      CG Palacio = Palatino<br>
      CG Omega = Optima<br>
      etc. (with the exception of CG Triumvirate = Helvetica)</p>
      <p>Just a bit of useless type development history.</p>
