      <p>Isn’t that just Compugraphic’s *<em>ahem</em>* version of Hans Eduard Meier’s <a href="http://new.myfonts.com/fonts/agfa/syntax/alternate_cuts.html" rel="nofollow">Syntax</a>?</p>
      <p>Seems like Paratype’s fonts of Bitstream’s “version,” called <a href="http://new.myfonts.com/fonts/paratype/humanist531-bt/humanist-531/characters.html" rel="nofollow">Humanist 531</a>, will probably offer the best language coverage beyond Latin.</p>
