  html: |-
    <p>Currently, we are using CG Symphony for all the marketing (print; screen – big text saved as images). Aesthetically, the CG Symphony is just fine. We need to expand language support (tricky ones are Russian, Latvian and Lithuanian) but CG Symphony’s character range is quite small.</p>
    <p>What could be the worthy (and similar!) alternative to CG Symphony? Properly hinted webfont version would be a great bonus. At least: normal, italic, bold and bold italic.</p>
    <p>Thank you.</p>
