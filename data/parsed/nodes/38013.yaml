    html: <p>The ruler on the tool bar, next to the knife, becomes active when you open a glyph window.  Also Alt + 4 turns it on. On my PC control + alt + shift changes the arrow to the measuring tool while you hold it down. The only problem with that is that it will sometimes switch the keyboard to another language, as alt + shift changes the keyboard to another language on a PC. As you are on a Mac it's probably a bit different.</p>
