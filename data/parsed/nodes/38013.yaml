    html: |-
      <p>Nick,</p>
      <p>The measurement line sometimes goes far away to the space on both platforms.<br>
      To make it visible again use the Python script below. Open your font, open the Edit Macro panel, put this small program there and click on the Run Macro button.</p>
      <p>fl.font.measurement = 400<br>
      fl.UpdateFont()</p>
      <p>These two strings will set the Measurement line for the current font to 400 units.</p>
      <p>Regards,<br>
      Johnych</p>
