    <p>Im entering my last year of Design School and wanted to start working on typeface design and move it beyond just sketches and vector illustrations. </p>
    <p>Ive purchased Fontlab Studio and am begining to learn the workings of the program. The advice I seek is an approach to designing whole alphabets … tips on consistency tips on everything. This may be a topic elsewhere, if so I will hopefully find it. Again any first timer tricks or tips would be greatly appreciated.</p>
    <p>Cheers</p>
