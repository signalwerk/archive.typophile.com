      <p>My advice? Play around.</p>
      <p>You’re not going to make an amazing font on your first try, but the more you play around with your tools (not just computer tools, but pencil, paper, etc. too) the more you will learn how they work. Since you say you’re in last year, you’ve probably done this a lot.</p>
      <p>You should check out the <a href="wiki/how-to" class="wiki">how-to</a> wiki.</p>
      <p> - Lex</p>
