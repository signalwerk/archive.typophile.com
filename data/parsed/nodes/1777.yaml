    html: <p>You might also have a look at the script font samples shown in the <a href="http://bowfinprintworks.com/Script13Pg1.html" target="_blank">Script Font ID Guide, Part 13 (Ornate Script fonts)</a>. <a href="(http://bowfinprintworks.com/Script10Pg1.html)" target="_blank">Part 10</a> has Antique Handwriting, which also includes some rather fancy styles. The Script Font Reference List (linked from each Guide page) shows the sources and designer information for any you are interested in.</p>
