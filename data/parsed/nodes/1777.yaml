  html: "<p>I'm after a really elegant script typeface with lots of huge beautiful flowing flourishes, \"popplesque\". <br> <br>ie. <br> <br>Sloop: <br><a href=\"http://www.fontbureau.com/fonts/font_frames.tpl?cart=10668940328805171&amp;fontname=Sloop\" target=\"_blank\">http://www.fontbureau.com/fonts/font_frames.tpl?cart=10668940328805171&amp;fontname=Sloop</a> <br> <br>Platthand: <br><a href=\"http://www.myfonts.com/fonts/scriptorium/platthand/\" target=\"_blank\">http://www.myfonts.com/fonts/scriptorium/platthand/</a> <br> <br>More like \"Sloop\" in terms of style, but with huge intricate flourishes like \"Platthand\". <br> <br>Any suggestions? <br> <br>Thanks <br>iota.</p>"
