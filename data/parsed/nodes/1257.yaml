    html: <p>The type at the bottom is too thin. Wouldn't it be more interesting to use something which contrasts with your top type? Very nice colors though. I think the combo on the far left or far right is best. The Red and Yellow seem to be the same tone at least closer than are the blue and yellow.</p>
