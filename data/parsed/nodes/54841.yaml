      <p>The best thing on spacing is still Tracy's Letters of Credit. <a class="freelinking external" href="http://briem.ismennt.is/" rel="nofollow">Briem's web site</a> has a good summary--but don't take the 'equal area' thing too seriously. </p>
      <p>You need to space and kern with many letters present--to avoid over kerning--and it is easiest to judge in words.</p>
      <p>My experience has been that it took me quite some (painful) time to learn to judge this properly and quickly, and still there are often questions of compromise between competing considerations. But it is critically important. As I think David Berlow said on Typophile, aside from your drawing of the characters, it is the main contributor to the look of your typeface. </p>
      <p>A good test for even color, mentioned in Printer's Type in the 20th Century, is to do a test file with </p>
      <p>abacadaeafagahaiajakalamanaoapaqarasatauavawaxaxaz<br>
      babbbbcb....</p>
      <p>And so on with all lc, uc, numbers. etc. and then print it out small--12 pt or less. The dark spots will then jump out more to the eye. You can also look at spacing this way, but this test is more critical for seeing if some strokes are too heavy or light. And you can print out a file with one of the classic text fonts that you most admire, and compare its evenness to yours.</p>
