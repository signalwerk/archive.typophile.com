  - id: 329970
    user: 32203
    date: 2009-02-18T06:13:00
    date_raw: 18 Feb 2009 — 6:13am
    votes: null
    html: |-
      <p>Ben,<br>
      your font is very nice, charming and comfortably legible. </p>
      <p>Texts are easy to read and vibrant, so one experiments the delight of reading by –paradoxically– ignoring that the type face contributes or, even better, produces that feeling.</p>
      <p>I agree with Craig about the crossbar of the uc A (and probably the same for the ∆), and the optical disalignment in the uc/lc x –glyphs which however  I loved, the same as delicious D, R, U, V, W, Y, Z, n, v, w, z and old style numerals–; I think the thin stroke gap (very noticeable at a large size) should not exceed one quarter of its width.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/X_5508.png"></div><p></p>
      <p>I also believe like Hrant, that your Q could be more quirky; I enjoy the correction made to the t: now it absolutely fits the elegance of its sisters.</p>
      <p>Nevertheless, your work is really amazing for both brain hemispheres.</p>
      <p>Let us know when it's for sale.</p>
      <p><em>[Just a minor thing, beyond the design: the æ/Æ and Œ/œ are not exactly ligatures in the original meaning of the word, but distinct letters; by the other hand, the German ß is a real one –long s over round s–, with the notable fact that the ſ (long s) does not exist anymore in German.]</em></p>
      <p><strong>MarS</strong></p>
      <p>PS: Next time, merge outlines, please; it's a shame not to enjoy so wonderful creation because of bad PDF rendering. BTW, at some scales, Acrobat seems strangely to miss some characters, as António told before.</p>
