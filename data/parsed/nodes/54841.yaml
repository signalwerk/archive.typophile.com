      <p>Ben, I think what works best as far as letter spacing is also affected by how thick the stems are, and how wide the font is overall, as well as the serifs--and the intended size of use. </p>
      <p>One way to proceed is to print it out at intended size, and then try tracking it out and in, and see what works best. Because the different factors interact in ways that nobody fully understands, you just need to try variations and use your eyes any your own personal judgment. This is the approach Briem recommends on his web site, and I think it's right. </p>
      <p>I would also recommend comparing thickness of stem, normalized for x height, with other faces you admire, and also play with this in your own font, with a limited set of letters, and in print-out look also at the affect on letter spacing.  </p>
      <p>How wide your n and o are, the weight of their strokes, and their spacing is a lot of the 'DNA' of your font, so I agree with Tracy that it is worth taking time over to make sure you are happy with it.</p>
    html_clean: |-
