      <p>Interesting. I did a little experiment measuring glyphs in pdfs...</p>
      <p>I've compared the letterspacing with the counterspacing for a handful of fonts as William noted above.</p>
      <p>The tightest spacing is in Fedra Serif Display, where the space between two n's is just 63% of the space between the n's legs. Palatino comes in next at 72%.</p>
      <p>The loosest spacing is in Enschedé Collis, which is 102%.<br>
      Melior LT comes in at 100%</p>
      <p>A modern display font (Guardian Egyptian Display) turned out at 77% and fonts with condensed proportions seemed to have wider spacing: Newlyn's Verona and Joanna MT had 91 and 93%</p>
      <p>Fonts like Type Together's Karmina, Underware's Dolly, ITC Stone Serif, and Guardian Egyptian Text had ratios of 85-87%.</p>
      <p>The median was 89%. Fedra Serif text, FF Olsen and Utopia have this ratio.</p>
      <p><strong>Conclusion:</strong><br>
      For a text size, I think I'll aim for a 90% ratio of spacing to counterspace,  or another 20 units on each side of my n, and see how that looks as a starting point. Putting in the extra space means the serifs look stumpy and will need lengthening. </p>
      <p>I'll keep developing the existing font as a display cut and come to the text size afterwards (if I don't grow tired of beziers!)</p>
