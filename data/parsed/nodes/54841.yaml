      <p>Hi Marcelo, thanks for your positive comments! I'm glad you like my font!<br>
      I did wonder about the crossbar on A, but initial comments when I posted the start of this font were positive about the disconnected stroke, so I left it. Perhaps it needs to evolve again.<br>
      It's interesting you like the D as that was one that didn't really seem to work for me. What do you like about it in particular?</p>
