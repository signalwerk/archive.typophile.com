    html: |-
      <p>Hi Stefan, I think no it's not a law, there don't seem to be laws in type design.</p>
      <p>The thin stroke here is disjointed only to make it optically unbroken. You can see what I mean on page six of <a class="freelinking external" href="http://www.typeculture.com/academic_resource/articles_essays/pdfs/tc_article_6.pdf" rel="nofollow">this document</a>. You'll see also that the example x there has the thin left stroke ending below the start of the thin right stroke, so it depends on the weight of the glyph and the angle of the arms to some extent too.</p>
      <p>:)</p>
