      <p>There's some interesting ideas here, thank you.</p>
      <p>When I suggested bringing the y more in line with the j, I was thinking that the black blob on its tail was too distracting. I don't intend to make the shapes the same and not even necessarily the weight the same, as I think there can be a good tension between contrasting elements. For me at the moment the y's tail makes the y a bit bottom-heavy on its own and distracting among other letters as the blob is below the baseline.</p>
      <p>Hrant said &gt;Totally even color isn’t an ideal, it’s a disease. Evidence? You don’t set a book in a monoline.</p>
      <p>I think overall colour of text can (should?) look even, even in a font where the individual shapes are contrasty. I don't want to see books set in patchy text either. The best way it seems to me is a nice balance between where the contrast between and within shapes creates visual melody but the unity of the font assures readability (or do I mean legibility?) That goes back to Nina's point about the soft/hard elements of the particular shapes I'm using. I want distinctive but not distracting.</p>
      <p>&gt;Yes, you do have to control the “patchiness”. But to me even color is a byproduct and not something to directly strive for, because it doesn’t give you anything except prettiness, which is largely moot in text setting.</p>
      <p>I agree, and I wasn't striving for the y and j to match, just look like they can talk to each other :)</p>
      <p>Rocky seems to achieve even colour, although the weights of serifs are different. Hopefully I can achieve something like that in my (text and possibly display) font if I'm clever!</p>
