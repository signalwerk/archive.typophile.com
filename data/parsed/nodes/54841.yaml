    <p>Hi</p>
    <p>I thought fellow typophiles might like to see the attached pdf for the most recent iteration of my Eternal font.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/ideal_3876.jpg"></div><p></p>
    <p>I think I'm finally beginning to crack the numerals: gosh they've been a struggle!</p>
    <p>Please feel free to crit! </p>
    <p>Specifically I'm not sure if the small caps are dark enough.</p>
    <p>Also, I'm wondering about certain shapes: M, B, Q, T, Z, a, f, x, y, Ae and Th.</p>
    <p>I realise some of the shapes are not merged where contours cross. Not sure what happened to the threequarters fraction. Also some of the accented characters need to be recomposed with the current base characters.</p>
    <p>Is Uhorn allowed to have its serif missing like that? Does the contextual alternate r work?</p>
    <p>Does the spacing work? What about the smallcap spacing?</p>
    <p>Thanks a lot :)</p>
