    html: |-
      <p>Display faces -like Rocky- don't need to be readable; although they do need to be <em>legible</em>, that's a trivial challenge. What they really need to be is aesthetically attractive - which usually means pretty. And superficial formal harmony (things like descenders that are equally weighty) is a long-standing benchmark of prettiness. But that can change (which means it will). Anyway, such harmony becomes a necessary evil of sorts when it comes to readability; it delivers nothing useful, functionally.</p>
      <p>The lower you go under the radar of reader consciousness (immersive reading) the more you can drift away from this shallow modernist harmony, and move towards a much deeper, fruitful harmony. Ergo: a text font should have tittles that are a bit too big, descenders of different shape/weight, etc.</p>
      <p>&gt; evenness of color needs to be one pole of the design problem</p>
      <p>What I was trying to say is that evenness of color is not really a pole at all in the readability realm. I believe it's an absence of divergence; it is divergence that needs to be controlled, and evenness is a byproduct of pulling back divergence by a certain amount.</p>
      <p>hhp</p>
