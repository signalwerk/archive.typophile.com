    html: |-
      <p>I suppose it'd also be helpful to address your questions!</p>
      <p><em>Specifically I’m not sure if the small caps are dark enough.</em></p>
      <p>They do look very slightly light in color, but they also seem large to me, so adding weight might make them too loud. It's kind of a tricky question with this font, because your lowercase is (I think) more condensed than your uppercase: should the small caps likewise squeeze together like their short brethren or should they retain more typical width like their cap antecedents?</p>
      <p><em>Also, I’m wondering about certain shapes: M, B, Q, T, Z, a, f, x, y, Ae and Th.</em></p>
      <p>B, a, and f look great to me. Those other caps aren't easy to find in your text setting so they're harder to judge.<br>
      More space between the T-part and the h-part of 'Th' might be helpful.</p>
      <p><em>Does the spacing work? What about the smallcap spacing?</em></p>
      <p>Letterspacing looks too tight all around to me (maybe smallcaps especially). Difficult to read, though, because I think the wordspacing is too large. This in turn is difficult to judge because you have fully justified the paragraphs, so maybe that excess space is in part due to the layout stretching the lines. But even in the most crammed line, I think the letters looked too bunched and the space between words relatively too large. What's a rag-right paragraph look like?</p>
