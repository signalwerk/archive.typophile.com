      <p>This has charm and some nice drawing. I think it has some craft problems, though, that need to be resolved to make it work in text. </p>
      <p>The verticals are, I suspect a little too light. And for sure the spacing is too tight for text sizes. When I zoom in on the 'in' combo, for example, I see that the space between letters is only 80% of the width of the n counter. In Minion, which is a tightly spaced text font, the space between two n's (stem-to-stem) is 95% of the width of the counter--actually the amount that Walter Tracy recommends in his great "Letters of Credit".   </p>
      <p>Handling the widths of your mnh is tricky with the hooked right foot. I wonder if the h or n are a trifle wide. The m to me is definitely cramped. It is hard to judge these things, though, with the letter spacing so tight. </p>
      <p>The light verticals go with the tight spacing to make this very good large--though even there it could be a little looser. But the tightness really hurts at text size. </p>
      <p>9-12 point is really a different animal than big, and what it looks like best on the screen will deceive you about what is best small.</p>
