      <p>Well, Hrant and I have had this debate before, and I don't want to belabor it. </p>
      <p>I learned about the importance of even color particularly from Doyald Young's book Fonts &amp; Logos. And I came to the conclusion that uneven color is 'noise' that distracts from detection of letter features, so it is important to readability. Thus it should be one of they key guidelines in type design. All the most widely used text types have very even color--and, I believe, in every script.  </p>
      <p>Rocky is a headline and titling face and as such readability is important. For other uses readability may be lesser priority for display type, but I think for this usage it is important.</p>
