      <p><em>"Craig, do you mean the shape of the accents is too sharp and needs rounding somehow?"</em></p>
      <p>"Nina, the accents are still a bit arbitrary; I don’t know an awful lot about placement though I did find an interesting diacritics pdf that I should perhaps read more thoroughly. It seems the acute and grave should have only 30% of their weight across the optical centre of the base glyph."</p>
      <p>Rounding the top corners of accents may be a handy solution (that resembles the caligraphic shape), though for my long term Spanish reading habits it would be more suitable changing the angles to reinforce the stress, I mean:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/accents_4303.png"></div><br>
      About the placing of the center, I think that image is useful also.<p></p>
      <p><em>"Did you try rounding the thick ends? Or maybe even just changing one or more of the angles so that it’s not so nearly symmetrical down its axis. They just seem very mechanical to me. You might also consider making the size and/or angle of the acute/grave accents that go on caps different than those on the lowercase."</em></p>
      <p>Accents in UC admit several solutions (actually, it was a rule, until not much time ago, that because of unavailability of space and types, UC weren't accented in non optical compositions):</p>
      <ul>
      <li>The easy way is to rise the accent uppon the character (as shown), but the lack of space implies it need to be closer.</li>
      <li>An alternate way is to use UC accents, specifically designed for this.</li>
      <li>Eventually, one can replace the UC components with small caps.</li>
      <li>Otherwise, one can use common accents for lc and UC, but design shorter custom UC components that fit better.</li>
      </ul>
      <p><strong>MarS</strong></p>
