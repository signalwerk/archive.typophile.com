    html: |-
      <p>This is coming along really nicely. Great to see this in text – I really enjoy reading it. </p>
      <p>For the "j" and the "y", the new forms are most likely an improvement. While I like the old glyphs seen in isolation, their terminals might be too stiff/determined in the overall context of your font; the new ones flow more nicely. Except the old ones matched the "f" very nicely, which might now feel a little lonely? Dunno.<br>
      That said, I'm not sure the new "j" terminal couldn't benefit from a little more strength/definition; it seems a bit weak (and/or light), especially compared to the "y", which seems to work quite nicely.<br>
      The whole "j" might also be leaning left a bit? But maybe it's just the tittle.</p>
      <p>Regarding the "a", I'd prefer the top version. The bottom one looks a hair narrow to me, and I think the top one has more character – it's a likeable and beautiful glyph.</p>
      <p>Btw, a couple of other things that struck me:<br>
      The "x" confuses me a bit (didn't notice this before) – the top-right seems strangely bent. That also makes it look vaguely Hebrew to me (which I don't read, so here's lots of salt).<br>
      The "z" looks like its bottom is sloping upwards. Might that serif need more definition?<br>
      And, I love the way your "ft" combination clicks together!</p>
      <p>Spacing-wise, one thing that jumped out at me in the "new" version is that "ll" seems quite tight. (Although – either I'm having printer or eye issues, or – is that a ligature / contextual alternate? In the bottom part, wherever there's a double "l", the first one looks… shorter.)</p>
