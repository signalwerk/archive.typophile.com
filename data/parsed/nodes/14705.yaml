    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Times New Roman</strong></p>
    <p>THE ubiquitous typeface of the second half of the 20th century. Developed by for The Times of London in <a href="/wiki/1931" class="freelinking" rel="nofollow">1931</a> (first used in October <a href="/wiki/1932" class="freelinking" rel="nofollow">1932</a>) and generally attributed to <a href="/wiki/Stanley%20Morison" class="freelinking" rel="nofollow">Stanley Morison</a> (not least by himself, in <em><a href="/wiki/A%20Tally%20of%20Types" class="freelinking" rel="nofollow">A Tally of Types</a></em>). There is some debate about its origin. In <em>A Tally of Types</em> Morison himself said that he had 'pencilled the original drawings' and handed them to <a href="/wiki/Victor%20Lardent" class="freelinking" rel="nofollow">Victor Lardent</a>, a draftsman in the Times' publicity department, who had produced finished drawings, which had then been worked on by the Monotype drawing office. When <em>A Tally of Types</em> was revised in <a href="/wiki/1973" class="freelinking" rel="nofollow">1973</a> a sceptical note was added, suggesting that it was likely that Lardent had carried out the actual design work based on some samples of <a href="/wiki/Plantin" class="freelinking" rel="nofollow">Plantin</a> that Morison had supplied. More recently, some have claimed it is the work of one <a href="/wiki/Starling%20Burgess" class="freelinking" rel="nofollow">Starling Burgess</a>.</p>
    <p>With the advent of the personal computer, Times New Roman and similar fonts based on the same model have become a standard default typeface in many applications.</p>
    <p>For more info about the disputed origin listen to the interview with <a href="/wiki/Mike%20Parker" class="freelinking" rel="nofollow">Mike Parker</a> on <a href="/wiki/typeradio" class="freelinking" rel="nofollow">typeradio.org</a>. <a href="http://www.typeradio.org/loudblog/" title="www.typeradio.org/loudblog/">www.typeradio.org/loudblog/</a></p>
