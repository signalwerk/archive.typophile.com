    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12270" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Typefaces</a>&nbsp;: Times New&nbsp;Roman</strong></p>
    <p><span class="caps">THE</span> ubiquitous typeface of the second half of the 20th century. Developed by for The Times of London in <a href="/node/add/wiki?edit%5Btitle%5D=1931" title="Create node &quot;1931&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1931</a> (first used in October <a href="/node/add/wiki?edit%5Btitle%5D=1932" title="Create node &quot;1932&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1932</a>) and generally attributed to <a href="/node/12136" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Stanley Morison</a> (not least by himself, in <em><a href="/node/14742" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">A Tally of Types</a></em>). There is some debate about its origin. In <em>A Tally of Types</em> Morison himself said that he had ‘pencilled the original drawings’ and handed them to <a href="/node/14746" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Victor Lardent</a>, a draftsman in the Times’ publicity department, who had produced finished drawings, which had then been worked on by the Monotype drawing office. When <em>A Tally of Types</em> was revised in <a href="/node/add/wiki?edit%5Btitle%5D=1973" title="Create node &quot;1973&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">1973</a> a sceptical note was added, suggesting that it was likely that Lardent had carried out the actual design work based on some samples of <a href="/node/add/wiki?edit%5Btitle%5D=Plantin" title="Create node &quot;Plantin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Plantin</a> that Morison had supplied. More recently, some have claimed it is the work of one <a href="/node/add/wiki?edit%5Btitle%5D=Starling%20Burgess" title="Create node &quot;Starling Burgess&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Starling Burgess</a>.</p>
    <p>With the advent of the personal computer, Times New Roman and similar fonts based on the same model have become a standard default typeface in many&nbsp;applications.</p>
    <p>For more info about the disputed origin listen to the interview with <a href="/node/57619" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Mike Parker</a> on <a href="/node/15245" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">typeradio.org</a>. <a href="http://www.typeradio.org/loudblog/">www.typeradio.org/loudblog/</a></p>
    <p><strong>Discussion:</strong><br><a href="http://typophile.com/node/32792">Display Font with Times New Roman</a><br><a href="http://typophile.com/node/39087">Times New Roman’s Many Versions!</a><br><a href="http://typophile.com/node/54614">Alternative to Times New&nbsp;Roman</a></p>
    <p><strong>Additional Articles:</strong><br><a href="http://en.wikipedia.org/wiki/Times_New_Roman">Wikipedia: Times New Roman</a><br><a href="http://www.ft.com/cms/s/2/a2fa033e-7ca1-11de-a7bf-00144feabdc0.html">The history of the Times New Roman&nbsp;typeface</a></p>
