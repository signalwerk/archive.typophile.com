      <p>I think that Herculanum is a font whose design obviously and immediately calls the Roman Empire to mind. The intent for the movie Avatar would be to have a font that is "exotic", and yet which does not link to any specific nation or culture on Earth. Since the movie is about aliens who are in harmony with nature, fonts associated with little green men in flying saucers are also out.</p>
      <p>Papyrus is a choice that fills the bill here - not perfectly, but reasonably well. Mistral, Calypso, or Hobo wouldn't do.</p>
      <p>Ereshkigal (from Scriptorium) would work, but that seems very similar to Papyrus. Searching through different fonts "similar" to Papyrus otherwise didn't suggest much in the way of alternatives.</p>
      <p>Looking harder, I've found a few.</p>
      <p>Fidelma, from Patricia Lillie, is a possibility. So is Fable, from Scholtz Fonts. Even Serena, from Canada Type, although it looks a bit too much like a conventional script.</p>
      <p>Blandford Woodland NF from Nick's Fonts is different enough from Albertus that it, too, might be considered as a way to get away from Papyrus. Then there's Galahad from Adobe.</p>
