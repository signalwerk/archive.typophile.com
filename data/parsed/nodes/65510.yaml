      <p>I found the discussion at that URL interesting.</p>
      <p>As far as Papyrus goes, I realize that not using "overused" fonts would create more work for type designers. But once upon a time, when type designers were real men, and cut punches, what you had was roman, italic, blackletter, and maybe an outline slab serif for display. There wasn't much time for more, after all, it was also necessary to cut Greek, Hebrew, Syriac and Coptic fonts for religious reference works.</p>
      <p>So if Papyrus is the one font for "generic New Age" or "generic non-Western" uses... well, maybe there are other more important purposes for which new faces are needed than giving more choices to your neighborhood yoga studio.</p>
      <p>But the debate on that web site: instead of just two choices, PDF documents that behave just like paper books, with a fixed layout on the page, and complete control over appearance, on the one hand, or generic HTML that flows into whatever display size the viewer chooses, but with very limited formatting - why can't we have the best of both worlds? Cited as an indication of how this can be achieved is a reader application provided by the New York Times.</p>
      <p>Combining flexibiity in design with flexibility for the viewer as well - because screen sizes vary - is a good thing, even if it seemed hard to achieve at first.</p>
