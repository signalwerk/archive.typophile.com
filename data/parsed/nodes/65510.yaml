      <p>The first time I saw Avatar's logoform, I just thought it was another in a line of low-budget sci-fi flicks, like Serenity. It always bothered me that the only sci-fi movie that could have possibly had any justification whatsoever to consider using a typeface meant to recall ancient Egypt, didn't. (What ever happened to James Spader, anyway?)</p>
      <p>If there's such thing as a default typeface of the self-actuated, individualized masses, Papyrus is probably it. And what other face communicates so clearly and succinctly, "I'm a unique and beautiful snowflake" in a way that is so exactly like everyone else.</p>
      <p>Local small business spas / office party memos / yoga centers / psychedelic bumper-stickers / asian mall restaurants / 99c inspirational calendars / garden shops / bric-a-braks / therapeutic candles / organic food packaging / halloween junk / pseudo-archeology bible books / scrapbooking supplies / aspiring wedding photographer websites / etc...</p>
      <p>...I see Papyrus, and I can't help but think, "another doomed, ill-conceived small business, a 'for lease' sign will be hanging here inside of two years."</p>
      <p>I wonder if this small business will last two weeks or twenty years? </p>
      <p><a class="freelinking external" href="http://www.papyruswatch.com/2009/10/hand-jobcmon.html" rel="nofollow">Hand Job SPA</a></p>
