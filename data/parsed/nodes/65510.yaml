      <p>3. The film's visual creativity is bold and captivating —(I'm not fanboy and happen to think the story plucks a typical refrain; "White guy gets accepted by closed society of natives and becomes their most awesomest member") —but the damn Papyrus typeface really reeks even more than usual when overlaid on such gorgeous and unique visuals. </p>
      <p>4...or maybe it's like when you put a really frumpy woman next to a drop-dead gorgeous one—the frumpy one seems even less attractive, yes (like papyrus)  —but maybe, at the same time, the already gorgeous one is improved even more by the comparison. (Hmmm...maybe the visuals weren't all that stunning after all...?)</p>
