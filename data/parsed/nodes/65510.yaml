      <p>Chris,</p>
      <p>There is no doubt about the important role of good typography &amp; type. And there's no doubt about the influence  of the movie industry -- see how many requests are made to ID a font when there's a new release. But  sometimes we need to remember the importance of hierarchy... :) </p>
      <p>I think that was the article/blog in the New York Times about mistakes in typography that quoted Matthew Carter saying that it's hard for him to see in a period movie the wrong font, while the costumes or architecture is right. I think he's wrong, or not 100% right.<br>
      Let's assume that I want to have a period movie, and the year is 1960.<br>
       I'm using the font Standard. Now, I have a problem, no? The font was issued by Intertype in 1960, and by Berthold in 1896; additional styles were added in the 1970s.<br>
      So, my choice is wrong? right? </p>
      <p>The same thing with the font Normande -- issued in 1875 &amp; 1931. But what if I want to pick Roman Extra Bold (Bauer 1850) --  my choice is wrong? right? </p>
      <p>Why not apply that to books? If I read a book by Paul Auster -- Moon Palace, and the main character, Marco Fogg, in the first page goes back to the 1960's --- why not  set that part in a font that was designed in the 1960s, to help us set the mood of the 1960s?<br>
      The novel was published in 1989 -- so does the book designer need to pick a font  that was designed in 1989?</p>
      <p>p.s.<br>
      And there is no doubt about the important role of.... fun  :)</p>
