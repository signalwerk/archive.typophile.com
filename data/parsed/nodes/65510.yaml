      <p>Apparently, from another thread linked here, they did spend money to have someone do custom modifications to Papyrus. Which, I would think, compounds the sin of bad taste.</p>
      <p>But it confirms something I've noted in another thread. Papyrus, unlike many a simulation font, gently suggests a "non-Western" culture without doing so in a blatant way that could be interpreted as patronizing or offensive or derogatory. Thus, we should forgive those who overuse it, for they live in terror of the Political Correctness Police.</p>
      <p>Given the plot, and hence the "message", of the film Avatar, the font Papyrus is <strong>all too appropriate</strong> for the film's subtitles.</p>
