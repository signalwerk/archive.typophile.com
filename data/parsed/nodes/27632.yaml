    <p>I'm trying to work out what typeface is being used everywhere in the movie "V for Vendetta". Examples can be found at <a href="http://www.posterwire.com/wp-content/images/v_for_vendetta.jpg" title="http://www.posterwire.com/wp-content/images/v_for_vendetta.jpg">http://www.posterwire.com/wp-content/images/v_for_vendetta.jpg</a> and <a href="http://i4.photobucket.com/albums/y136/pooka_fn0rd/vforvendettaset2.jpg" title="http://i4.photobucket.com/albums/y136/pooka_fn0rd/vforvendettaset2.jpg">http://i4.photobucket.com/albums/y136/pooka_fn0rd/vforvendettaset2.jpg</a></p>
    <p>Does anyone here have any ideas?</p>
