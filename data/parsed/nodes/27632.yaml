    html: <p>It isn't just the DVD cover.  Futura is pervasive throughout the film (i believe intentionally so).  Everything from the ending credits to the propaganda posters displayed on London's streets, from the curfew notices to the headlines and body copy of newspapers--every bit of type in the film is Futura.</p>
