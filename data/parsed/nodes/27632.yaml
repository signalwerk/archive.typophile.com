      <p>The cover of single-DVD release of the movie also uses Futura.</p>
      <p>But strangely, the cover of the Two-Disc Special Edition DVD uses a completely different typeface: <a href="http://www.myfonts.com/fonts/t26/konvexist/alternate-oblique/" rel="nofollow">Konvexist-Alternate Oblique</a>.</p>
      <p>(See them both <a href="http://www.superherohype.com/news/vforvendettanews.php?id=4237" rel="nofollow">here</a>).</p>
      <p>Strange.</p>
