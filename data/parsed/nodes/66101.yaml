    <p>So as much as we all love identifying type I was hoping someone would be able to help me out and tell me about the paper stock used here: <a href="http://img158.yfrog.com/img158/1065/6gkv.jpg" title="http://img158.yfrog.com/img158/1065/6gkv.jpg">http://img158.yfrog.com/img158/1065/6gkv.jpg</a>.</p>
    <p>Really any information would help. Who makes it or something like it....even if you just know what that kind of paper is called so I can figure out what to search for.</p>
    <p>Thanks!</p>
