      <p>I prefer this in a single colour with tints, the solid colour rings cancel each other out rather and give almost a spirograph impression, wheras the lighter colours in the other version are obscured and also draw comparisons with the Olympics as has been noted. I would, for most uses, include the full name, however that needs to work with the text in the circles, by which I mean that it should align to some aspect of the type. The bottom two on the left of your latest post especially would benefit from this, it will also make the circles more dynamic by emphasising the eccentric position of meg. You could also try ranged right text under the circles ranging on the right of meg.<br>
      Tim</p>
