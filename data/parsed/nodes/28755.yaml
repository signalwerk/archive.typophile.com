      <p>Treat the mark and the logotype as two separate elements. Especially in this instance, as I think the logotype greatly detracts from the mark.</p>
      <p>Yes, in school I was taught the same thing. If the logo/mark doesn't work in black and white only it can't be a very good logo. But, when you have the budget to control something, as the Olympics does, they never have to worry about there logo being in black and white. (ehe. Maybe they regret that sometimes.) The fact that you are going to great lengths to make sure your mark works in different ways is good. I think the single line weight as opposed to several is probably a safer bet. You might consider the line weight at different sizes. Are there fewer lines when it gets smaller?</p>
