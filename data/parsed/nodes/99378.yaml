      <p>Since I cannot seem to edit it, I will correct it here, my website is: "www.colunga-hernandez.com".<br>
      I apologize, age and trying to find glasses that work with my monitor have a way of messing with my writing in an onscreen setting.<br>
      P.S.  I do have some examples of my typographical endeavors that I hope to post at some time soon for your input.  I used 'ScanaHand' by the folks that make FontMaker software.  Allows you to write in handscript and convert it, save it as a .ttf.  I am now using a Linux-based OS so I am going to have to change my main font design studio.  The fonts include; a hand-done Samaritan font, and a numerical three digit rendering for each of the Hebrew letters, and a proto-Semetic face.  Some of my others are a font I use for notes and poetry that I named - Studio2a, and various hand done sketch works of faces I hope to digitize.<br>
      -Manuel</p>
