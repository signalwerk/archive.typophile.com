  html: |-
    <p>Just Another Foundry proudly presents:<br>
    Brian Jaramillo's fabulous new display font, <a class="freelinking external" href="http://justanotherfoundry.com/peacock" rel="nofollow">JAF Peacock</a>.</p>
    <p>Peacock is a collaboration between <a class="freelinking external" href="http://agency26.com/" rel="nofollow">Brian Jaramillo</a> and <a class="freelinking external" href="http://justanotherfoundry.com/" rel="nofollow">Tim Ahrens</a>. Jaramillo completed most of the glyphs in 2007, and contacted Ahrens to help with the OpenType. Ahrens helped refine the typeface, and set-up the OpenType features. After a period of inactivity, the duo decided during the summer of 2010 to give Peacock a final push to retail.</p>
    <p>The typeface features 1239 glyphs.</p>
    <p>Contextual and stylistic alternates are accessible via the OpenType pop-up menu on the Character palette in InDesign. In addition, any alternate glyphs can be selected manually via the Glyph palette.</p>
