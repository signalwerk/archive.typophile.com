    html: "<p>Thanks everyone for lending your eyes!  This forum is ever so helpful. <br> <br>I'm trying to come up with something Crown-like, but with some added significance to it.  My hometown of Regina (named in honour of Queen Victoria) recently adopted a <a href=\"http://www.regina.ca\">new logo</a> I don't think does the City justice, so here I am trying to come up with something more fitting - something that recalls the royal ties, and at the same time more colourful, lively and friendly than just using a crown on its own (which was the old logo). <br> <br>Here's another one I came up with: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/40273.gif\" alt=\"Crown 2\"> <br> <br>A crown for our historical Queen City-ness and to symbolise civic authority; people linked both in celebration and in support, the community reaching forward; purple for our Royal past, green for the City's growing and prosperous present, red for our warm and passionate outlook to the future, all firmly planted on the golden Prairie.  <br> <br>Any thoughts on how to approach rendering a crown?  Other Crown-like logos that might lead me somewhere?  Thanks again!</p>"
    html_clean: "<p>Thanks everyone for lending your eyes!  This forum is ever so helpful. <br> <br>I'm trying to come up with something Crown-like, but with some added significance to it.  My hometown of Regina (named in honour of Queen Victoria) recently adopted a <a href=\"http://www.regina.ca\" class=\"link-external\">new logo</a> I don't think does the City justice, so here I am trying to come up with something more fitting - something that recalls the royal ties, and at the same time more colourful, lively and friendly than just using a crown on its own (which was the old logo). <br> <br>Here's another one I came up with: <br> <br><img src=\"http://www.typophile.com/forums/messages/29/40273.gif\" alt=\"Crown 2\"> <br> <br>A crown for our historical Queen City-ness and to symbolise civic authority; people linked both in celebration and in support, the community reaching forward; purple for our Royal past, green for the City's growing and prosperous present, red for our warm and passionate outlook to the future, all firmly planted on the golden Prairie.  <br> <br>Any thoughts on how to approach rendering a crown?  Other Crown-like logos that might lead me somewhere?  Thanks again!</p>"
