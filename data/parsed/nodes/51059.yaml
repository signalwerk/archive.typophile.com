    <p>Hi, </p>
    <p>Has anyone ever used the Myriad font to develop a corporate logo? I would like to use this font for the textual part of a corporate logo however I do not know if its license allow me to do that! I know (from Wikipedia) that some big companies such as Wal-Mart. I tried to contact Adobe but after three weeks I still did not even have a reply!! Do not know where else to ask.</p>
    <p>Thanks and Regards,<br>
    Sim085</p>
