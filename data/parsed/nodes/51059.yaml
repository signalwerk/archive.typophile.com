      <p>I'm not an expert, but I believe it's the norm rather than the exception to allow you to create corporate logos from most any font.</p>
      <p>In otherwords, unless the license specifically prohibits it, you should be fine.</p>
      <p>Someone please correct me if I am wrong.</p>
