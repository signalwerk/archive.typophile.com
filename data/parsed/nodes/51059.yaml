    html: |-
      <p>Hi again,</p>
      <p>First of all thank you for the replies. I personally read the 'Adobe Standard License Agreement‏' and I did not find anything that prohibits me from using the font for a corporate logo. However there are some legal terms which I could not understand and I do not wish to develop the logo and then later on find out that I cannot use it.</p>
      <p>The logo will be mostly text based with some minor modifications on two letters. The modifications would not be done on the font files I purchase (which is obviously illegal) but by using the font in a graphical application such as Adobe Illustrator and then do the modifications in a graphical way.</p>
      <p>First of all I tried to contact Adobe through their Customer Support Portal. Usually I get a reply after a week. In the last reply they suggested me to send the query to their legal team. I therefore sent an email to <a href="mailto:permissions@adobe.com">permissions@adobe.com</a> but these did not send me back (more then 2 weeks have passed). I therefore reopened the Customer Support Ticket I had and informed them about this. However I still did not received any reply back! More then a month has passed from when I started my query!</p>
      <p>Thanks again,<br>
      Sim085</p>
