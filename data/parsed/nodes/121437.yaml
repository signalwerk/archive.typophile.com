  html: |-
    <p>Can anyone identity the font used for "BAKERY" and "RESTAURANT" in this sign? If not a font/typeface, would you please recommend something similar? </p>
    <p>It would also be great to know what script (or a similar one) is used for Ahrens. Thanks very much. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/AHRENS-BAKERY-SIGN_5233.png"></div><p></p>
