      <div class="comment-spam-body"><p>BAKERY is interesting. Some letters are almost a perfect match for Abril Titling Bold but the bowls on _B_ and _R_ are squared in a style developed by Imre Reiner as Corvinus in 1929-34. So what changes to Abril would produce an alphabet that was consistent with BAKERY?<br>
      Consider Abril Titling Bold BRSPDCG </p><div class="imageWrap"><img src="http://typophile.com/files/AbrilTitlingBoldAsBAKERY_4110.gif"></div><br>
      Compared to Corvinius BRSPDCG Skyline<div class="imageWrap"><img src="http://typophile.com/files/CorviniusSkylineAsBAKERY_6588.gif"></div><br>
      Don<p></p>
      </div>
