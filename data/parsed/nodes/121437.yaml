      <p>Had no luck finding something that completely matched Bakery. These two typefaces get most of it right, save for the squared-off |B| and |R|, and the fully flat-topped |A|:<br>
      <a href="http://www.myfonts.com/fonts/type-together/abril-titling/" title="http://www.myfonts.com/fonts/type-together/abril-titling/">http://www.myfonts.com/fonts/type-together/abril-titling/</a><br>
      <a href="http://www.myfonts.com/fonts/storm/trivia-serif-10/" title="http://www.myfonts.com/fonts/storm/trivia-serif-10/">http://www.myfonts.com/fonts/storm/trivia-serif-10/</a></p>
      <p>I found a similar |B| in a typeface that used to be offered by Linotype, Myfonts, and Fontshop, but now I can only find dubious sources for it:<br>
      <a href="http://fontsgeek.com/fonts/Napoleon-Light-Bold" title="http://fontsgeek.com/fonts/Napoleon-Light-Bold">http://fontsgeek.com/fonts/Napoleon-Light-Bold</a></p>
      <p>Ibis, by Font Bureau, might be helpful for the |B| and |A| as well:<br>
      <a href="http://www.myfonts.com/fonts/fontbureau/ibis-display/" title="http://www.myfonts.com/fonts/fontbureau/ibis-display/">http://www.myfonts.com/fonts/fontbureau/ibis-display/</a> </p>
      <p>Thorowgood also gets the flat-topped |A|, slab serifs, and the curly-footed |R| right, and would only require some artificial widening and some squaring off of the |B| and |R|:<br>
      <a href="http://www.fonts.com/font/wooden-type-foundry/thorowgood/regular" title="http://www.fonts.com/font/wooden-type-foundry/thorowgood/regular">http://www.fonts.com/font/wooden-type-foundry/thorowgood/regular</a></p>
      <p>These might work for Restaurant:<br>
      <a href="http://www.myfonts.com/search/Alcalde/fonts/" title="http://www.myfonts.com/search/Alcalde/fonts/">http://www.myfonts.com/search/Alcalde/fonts/</a><br>
      <a href="http://www.myfonts.com/fonts/linotype/westside/" title="http://www.myfonts.com/fonts/linotype/westside/">http://www.myfonts.com/fonts/linotype/westside/</a><br>
      <a href="http://www.myfonts.com/fonts/intellecta/french-clarendon-n2/" title="http://www.myfonts.com/fonts/intellecta/french-clarendon-n2/">http://www.myfonts.com/fonts/intellecta/french-clarendon-n2/</a></p>
      <p>Ahrens is most definitely hand-lettered, but these script faces capture the same general feel:<br>
      <a href="http://www.chank.net/freefont_detail.php?sku=1080" title="http://www.chank.net/freefont_detail.php?sku=1080">http://www.chank.net/freefont_detail.php?sku=1080</a><br>
      <a href="http://artandsignstudio.com/signwriter.html" title="http://artandsignstudio.com/signwriter.html">http://artandsignstudio.com/signwriter.html</a><br>
      <a href="http://www.myfonts.com/search/az+cupcakes/fonts/" title="http://www.myfonts.com/search/az+cupcakes/fonts/">http://www.myfonts.com/search/az+cupcakes/fonts/</a><br>
      <a href="http://www.myfonts.com/fonts/fenotype/no.-seven/" title="http://www.myfonts.com/fonts/fenotype/no.-seven/">http://www.myfonts.com/fonts/fenotype/no.-seven/</a><br>
      <a href="http://www.myfonts.com/fonts/canadatype/wonder-brush/" title="http://www.myfonts.com/fonts/canadatype/wonder-brush/">http://www.myfonts.com/fonts/canadatype/wonder-brush/</a><br>
      <a href="http://www.myfonts.com/fonts/typesetit/praise/" title="http://www.myfonts.com/fonts/typesetit/praise/">http://www.myfonts.com/fonts/typesetit/praise/</a> [Swash]</p>
