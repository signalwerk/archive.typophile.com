      <div class="comment-spam-body"><p>BAKERY. Another squared bowls font, designed by by Wolff Olins in 1978 for Renault automobiles. The matching weight is somewhere between Renault Medium </p><div class="imageWrap"><img src="http://typophile.com/files/RenaultMedAsBAKE_5097.gif"></div> abd Renault Bold <div class="imageWrap"><img src="http://typophile.com/files/RenaultBoldAsBAKE_4379.gif"></div> Various foundries including <a href="https://www.myfonts.com/fonts/urw/renault/" title="https://www.myfonts.com/fonts/urw/renault/">https://www.myfonts.com/fonts/urw/renault/</a><br>
      Don<p></p>
      </div>
