      <p>Hi Jan</p>
      <p>The typeface you have used is called Parlament. </p>
      <p>Parlament is a very interesting typeface, including the S and s which you have replaced. Why not simply digitize it as faithfully as you can, and call it a revival? Rather than starting with Parlament and then moving "as far from it as possible", either acknowledge the design's strengths, finish the design as a revival, or don't start with an existing typeface at all. Digitizing an existing typeface that has not been available for years (and I think Parlament was made exclusively for the Czech government) is a good thing, made all the better when you acknowledge your source material and do what you can to make the results useful. Is there an Italic? Even if you are a skilled calligrapher, it would be nearly impossible to devise an italic to match all the quirks and character of the Roman. Menhart's work is always very personal, unique and calligraphic.</p>
      <p>Maybe you could do a display version based closely on the original, and a text version with the roughness and lowered contrast of this one. The text version could have a more conventional s shape, looser spacing, better proportions (g, a, R) and lining numerals. </p>
      <p>At the very least, I suggest returning to the original s shapes and trying to edit them to be more conventional and less extreme. Your replacement s and S do not match the calligraphic style of the rest of the font, and the lowercase s is very wide. If your original specimen shows the cap S, then use that as a guide for both uppercase and lowercase. Your sample also omits the slope of the original.</p>
