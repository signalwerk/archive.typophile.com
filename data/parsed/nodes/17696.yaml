      <p>Thanks, crossgrove. Many good points... but I have point out more strongly that this is no "serious" project, it will propably be forgotten in my desk drawer. So issues about the original design isn't that important at this moment. I just want to see where this goes to and credit Parlament (oh, that's the name) at least as "inspiration".</p>
      <p>I would also really like to see someone do a good revival of Parlament. I myself can't do it; I'm not skilled enough and I don't even have a decent sample, I interpreted these characters from a small jpeg. </p>
      <p>For text, I found the 'a' and 's' to be the greatest weaknesses. I can see the problem with the 's', but don't want to back to the original shape that I found problematic in text. The s clearly needs a decent redraw so I'll work on it.</p>
      <p>At the moment I'm adding some quirkiness to many of the letters. I'm curious to see where that leads.</p>
      <p>I'm also interested in creating an italic, I have already tried to create some characters but they seem a bit problematic, but there are some promise.</p>
