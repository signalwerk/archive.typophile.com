    html: |-
      <p>Sure,</p>
      <p>When you type this: iåiäiö with Galliard (and other “older” fonts) – you clearly see that the diacritics are very much jumping up and down. </p>
      <p>In the swedish language we use these letters alot in a different combinations and it doesnt look good if the diacritics are not adjusted (as they mostly are today in “newer” or recently updated fonts)</p>
      <p>Type iåiäiö here:<br>
      <a href="http://www.myfonts.com/search?search%5Btext%5D=galliard" title="http://www.myfonts.com/search?search%5Btext%5D=galliard">http://www.myfonts.com/search?search%5Btext%5D=galliard</a></p>
      <p>And also compare Adobes garamond with other Garamonds here, on these letters.</p>
      <p><a href="http://www.myfonts.com/search?search%5Btext%5D=garamond" title="http://www.myfonts.com/search?search%5Btext%5D=garamond">http://www.myfonts.com/search?search%5Btext%5D=garamond</a></p>
      <p>So Matthew Carter did a special Scandinavian edition of his Galliard which is called Galliard Scandinavian. There is a nice story behind it aswell, as told by my collegue Gary Newman, but he is going to tell it so much better than me so I wont even dare to try :)</p>
