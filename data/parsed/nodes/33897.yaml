    html: |-
      <p>The letterforms aren’t identical, but you might be able to find a way to separate the dots from the background in <a href="http://www.myfonts.com/fonts/larabie/budmo/">Budmo</a>, by Ray Larabie. It might be as simple as nulling part of the letter in your graphics application.</p>
      <p>I am guessing that the letters might have been from a film type (photolettering), that has not been digitized.</p>
      <p>- Mike Yanega</p>
