  html: "<p>I'm involved with a nonprofit organization that's working to establish a <a href=\"http://www.chichess.org\" rel=\"nofollow\">chess center</a> in Chicago. We've adopted Neutraface No. 2 as our \"signature\" typeface, in our logo and elsewhere: unlike other chess centers, which generally go the \"O we are so highbrow and elegant\" route, we're projecting a more muscular, no-frills image, while also honoring the essentially geometric nature of the game. I'm looking for a good companion serif face for use in marketing materials and in-house publications (one of the benefits we plan to offer members is a yearbook featuring analyzed chess games). At first I used Minion, but while it works well in some applications, it clashes in running text. Then I was drawn to Electra, which isn't bad, but the more I look at it, the more I feel that the high contrast in stroke widths makes it a weak partner. Bodonis and Didots are just too eccentric; Garamonds and even Hoefler Text, too old-fashioned. Suggestions?</p>"
