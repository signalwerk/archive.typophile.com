    html: |-
      <p>Telefon is pretty (and a strong alternative to Metro No. 2, which we were using before), but I'm looking for a serif face to go with Neutraface No. 2, not a different geometric sans serif to go with Minion. I know Neutraface No. 2 is popping up all over the place at the moment, but we're committed to it. Among other things, I need the condensed widths to make a squarer alternative logo for avatars and whatnot. Metro and Telefon both lack that.</p>
      <p>What makes Minion clash? Minion's narrowness is part of it, and maybe the subtle slope on the crossbar of the <em>e</em>, but I think it's mainly that Minion looks too '90s to me. I need something that's either less era-specific or equally "now" -- or maybe something reflective of the '20s/'30s era, when Neutraface's predecessors (such as Metro) were getting off the ground.</p>
