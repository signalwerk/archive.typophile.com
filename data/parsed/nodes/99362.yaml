      <p>I don’t believe that chess is inherently geometric: if that were so, the Staunton pattern would have been replaced by the Man Ray pattern. But that’s not the issue here.</p>
      <p><a href="http://www.myfonts.com/fonts/linotype/excelsior/excelsior/" rel="nofollow">Excelsior</a> is a good match.<br>
      As a mid-century modern, it ﬁts the Neutraface style era.<br>
      It has good width and a smallish x-height, so will not look too big or narrow when used with Neutraface.<br>
      And it has a sturdy somewhat slabby look, which could be considered contemporary with now.</p>
      <p>BTW, I hope you will use the multiply character in notation, rather than the letter x.</p>
