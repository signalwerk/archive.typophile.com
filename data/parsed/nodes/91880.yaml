    html: <p>I was bummed that there were multiple tracks. I chose to stick to the main track in the big hall and catch the talks from the smaller hall on video (though they don't seem to be available yet). I enjoyed nearly all the talks I saw (I'd rather not mention the exception, except to say that one was not as interesting as I'd hoped). I liked that it had a broader focus than just type and fonts. But my favorite thing about conferences like this is seeing and talking to old friends and meeting new people. As always, there were some people I wanted to meet but missed the opportunity. There's always the next one.</p>
