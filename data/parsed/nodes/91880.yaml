    html: |-
      <p>One thing that really bothered me: I had looked forward very much to Koi Vinh's talk, after being a fan of his work for some time. But I don't like paying money - a pretty good amount of money - just to sit through a product pitch. After Spiekermann's great introduction (which was, unfortunately, the high point of that session), we got one long commercial for a toy product Vinh has created, which apparently - like so many other toys - promises to help us be creative, or something; I'm not really sure.</p>
      <p>I was and still am pretty offended by the fact that the organizers allowed him to blatantly pitch something that had nothing whatsoever to do with typography or much else for 45 minutes to people who really should have been paid for sitting through the commercial. It was completely and utterly out of place and the opposite of what conferences like this should be about.</p>
      <p>Vinh could have talked about so much more - his time at NYT, his pioneering work with CMSes and grid-based css layouts, his thoughts on the future of online news, readability ... but instead of telling people about what anyone who is familiar with him would have wanted to hear, he tried to sell us on a toy that really has no bearing whatsoever on our businesses, careers, trades and/or (for most of us, I'll bet) our interests or hobbies.</p>
