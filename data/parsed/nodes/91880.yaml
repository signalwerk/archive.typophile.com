      <p>I was unhappy that I missed pretty much half the talks I had paid to see simply because the rooms were too small.</p>
      <p>I enjoyed everything I saw and heard, and was very gratified that Typo/FSI staff promised that everything would be up on video, although I'm still waiting for that to happen.</p>
      <p>The BBC presentation was interesting, Bierut was as always, and Jim Parkinson was amusing. Good to see lots of old friendly acquaintances like Nick and Mark and the San Francisco crew.</p>
      <p>Yours</p>
      <p>Joshua</p>
