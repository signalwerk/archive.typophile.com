    html: |-
      <p>Two separate fonts. Note sharp join of the serif on the lhs, found in relatively few fonts, vs. the smooth join on rhs which is found on many. The thick lhs stroke for M may help to narrow the selection, assuming it was not added by the logo designer. However, without some more letters a single matching font is problematic. The white space effect in the lhs is sometimes called "handtooled" or "open face." It may have been in the original font or added by the logo designer. You could try to Google "fonts  handtooled" and "fonts open face"  and see if you like any of the matches. Also check the collection at the <a href="//www.fontscape.com/explore?7RK" rel="nofollow">Fontscape typeface directory of openface serif typefaces</a>. None match but it does give an idea of the possible effects for other letters.<br>
      Perhaps someone else recognizes lhs M as from a font?<br>
      Don</p>
