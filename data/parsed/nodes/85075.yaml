      <p>I tried again with Safari 5.0.5 on OS X 10.6.8;  this time I called explicitly Gardiner in the html source of <a class="freelinking external" href="http://www.iro.umontreal.ca/~boyer/typophile/hieroglyph-table.html" rel="nofollow">this thread</a>, which is just a copy of the wikipedia table whose link is above, to which I added</p>
      <pre>&lt;font face="Gardiner"&gt;
      </pre><p>before the table and</p>
      <pre>&lt;/font&gt;
      </pre><p> after. Then the hieroglyphs display  fine. So, Gardiner displays correctly in Safari; the "problem" seems to be that  it is not used as a fall back font for Egyptian hieroglyphs (I simply installed Gardiner313.ttf in /Library/Fonts)</p>
