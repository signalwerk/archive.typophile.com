    <p>Hello, I have I little problem with some fonts on snow leopard/lion.</p>
    <p>I am trying to use the egyptian hieroglyphs (unicode slot: U+13000 - U+1342F), but it seems they don't work on leopard.</p>
    <p>I have installed the font "gardiner" (you can find it in this website: <a href="http://users.teilar.gr/~g1951d/" title="http://users.teilar.gr/~g1951d/">http://users.teilar.gr/~g1951d/</a> and directly download it from here: <a href="http://users.teilar.gr/~g1951d/Gardiner313.zip" title="http://users.teilar.gr/~g1951d/Gardiner313.zip">http://users.teilar.gr/~g1951d/Gardiner313.zip</a> ) and in fact I can see the characters in the character palette, but when I open a file, or I run an application using this set of characters, my computer does not recognize them, and it shows only the classical series of black squares.<br>
    As for instance, I cannot see any hieroglyph in this test page <a href="http://www.alanwood.net/unicode/egyptian-hieroglyphs.html" title="http://www.alanwood.net/unicode/egyptian-hieroglyphs.html">http://www.alanwood.net/unicode/egyptian-hieroglyphs.html</a> , or in this page of wiki <a href="http://en.wikipedia.org/wiki/Egyptian_hieroglyphs#Unicode" title="http://en.wikipedia.org/wiki/Egyptian_hieroglyphs#Unicode">http://en.wikipedia.org/wiki/Egyptian_hieroglyphs#Unicode</a> , even though my font is correctly installed.</p>
    <p>I tried it on lion, and it didn't work too. Curiously, it worked well on tiger.</p>
    <p>What is the problem? It is a problem with the font? Or for some reason apple is not able to deal correctly with this unicode slot?</p>
    <p>thanks in advance</p>
