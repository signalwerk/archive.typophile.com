      <p>"So, Gardiner displays correctly in Safari; the "problem" seems to be that it is not used as a fall back font for Egyptian hieroglyphs (I simply installed Gardiner313.ttf in /Library/Fonts)"</p>
      <p>that is interesting. I tried with other fonts I created using the same unicode slots, and they have the same problem, it seems that not only Safari, but the mac OS system in general (I tried also in other applications, e.g. with a specific Input Method) does not have a fall back font for Egyptian Hieroglyph (Possibly, Mozilla uses some different approach to identify the font). The char palette works because it display all the fonts using those slots.</p>
      <p>Does anyone know if there is a way to solve the problem? If there is a way to force the system to recognise a specific font as fall back font for these unicode slots?</p>
