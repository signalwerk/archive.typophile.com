    html: |-
      <p>For single pairs in the kern feature: save the feature code to a text file and edit it to look like an .afm file, then import into FontLab Studio from there.</p>
      <p>For class pairs: hm, that might be somehow more difficult. Is there any class-based kerning in your kern feature?</p>
