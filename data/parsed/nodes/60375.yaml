  html: |-
    <p>Somehow all of my kerning pairs vanished from one my FontLab files. The classes are still intact and I have a backup of the Kern feature. I would like to dump the data from the kern feature back into the font table as a means of recovering all my hours of kerning work. Is this possible or even advisable?</p>
    <p>ChrisL</p>
