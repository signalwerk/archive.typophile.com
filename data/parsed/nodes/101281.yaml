      <p>Well, I wouldn’t call that brilliant research. All I did was make a telephone call. The only reason I did so was to bring to their attention — one professional to another — that their email may not be functioning, and ask for their permission to post it here. A task anyone could have performed. Just remember to be polite. I always begin such conversations with “Hello, my name is… I am calling from… Regarding… Am I catching you at a bad time? Do you have a few minutes to talk?” And end with “Thank you very much for your time _say their name_ you have been very helpful.”</p>
      <p>If they are too busy to talk, ask if there is another time that is more convenient for them.</p>
      <p>Have questions prepared in advance.</p>
      <p>Make an effort to keep your conversation &lt;15 minutes.</p>
