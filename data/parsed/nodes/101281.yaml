      <p>Hey Neil, I only remember Doug and the Slugs vaguely.<br>
      He left Toronto before I arrived in 76.<br>
      The Toronto bands I recall from the Crash N Burn days were the Diodes, Drastic Measures, Rough Trade, the Dishes, the Poles, Teenage Head (from Hamilton, but close enough) and of course the Viletones.<br>
      **<br>
      Given that there has been so much promiscuity between the design and music scene, the only reason Freddie Mercury is “intriguing” in that respect is because he became so famous—I also thought the Queen crest would make a good visual for the compendium, although it’s not really an anecdote.</p>
