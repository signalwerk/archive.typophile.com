      <p>The correspondence between Baskerville and Benjamin Franklin, including the "Caslon anecdote" (Franklin tricking an acquaintance into pointing out perceived flaws in Caslon, under the misapprehension that it was Baskerville). This one should be pretty easy to track down.</p>
      <p>Michael &amp; Winifred Bixler told me a fascinating story about the origin of the typeface Sachsenwald. They are also a fantastic source of stories, specifically related to Monotype and letterpress.</p>
      <p>Read the Book <em>Type: The Secret History of Letters.</em> Essentially a compendium of interesting and quirky stories about typography. And of course <em>Just My Type</em> contains a bunch of random type anecdotes, though with a questionable standard of accuracy — check it against another source. Oh, and watch the <em>Linotype</em> film.</p>
      <p>I'll be very interested to see your finished project. I really like to use anecdotes in beginning typography workshops to start getting across the idea that typefaces are made by people, and there are stories behind them.</p>
