    <p>Hello all,</p>
    <p>We are currently gathering research for a compendium of graphic design miscellany. We would greatly appreciate any anecdotes you may know of. The publication will be targeted at designers of all ages as an kind of amusing factual compilation of tales and facts.</p>
    <p>Examples include:-  John Baskerville insisting on being buried standing upright. In 1820, his body was dug up and used as a sort of local peepshow. The curious could view it for the sum of 6 pence.</p>
    <p>We would be extremely grateful for any contributions, the more entertaining the better!</p>
