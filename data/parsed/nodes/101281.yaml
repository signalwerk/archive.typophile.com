    html: |-
      <p>Be certain to properly cite Typophile in the references section of your paper. A failure to do so would constitute academic plagiarism. APA 6.0 format:</p>
      <p>Dean, C. (2013, March 11). Re: Intriguing design anecdotes [Online forum comment]. Retrieved from <a href="http://typophile.com/node/101281" title="http://typophile.com/node/101281">http://typophile.com/node/101281</a></p>
      <p>You will need to do this for <strong>every</strong> comment you reference. Better yet, it would be best to use these comments to help direct you to a primary source (book, journal, something published &amp;c) so you can research it more thoroughly and double check the authenticity of the comment(s). It is highly likely that comments are simply inaccurate. If you track down a primary source, you don’t <em>have</em> to cite Typophile. However, on principle, I would make a statement to the effect of “special thanks to the members of Typophile for assisting in our research.”</p>
      <p>People can point you in the right direction and save you some Google/library time, but they can’t always be relied upon to provide you with accurate, verifiable information. This is especially relevant to an important final project such as yours. Knowing how to conduct a literature review is a significant portion of being capable to conduct quality research. It is also a significant amount of work. If I had to review a paper, and the bulk of the references were forum comments, I probably wouldn’t  mark it as it would be extremely to difficult and time consuming to double check them all. I’d simply pass it back and ask them to provide me with proper references. It’s kind of like passing the buck to other researchers and your professor.</p>
      <p>Is this undergraduate or graduate research?</p>
