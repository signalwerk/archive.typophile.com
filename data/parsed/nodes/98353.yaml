    html: |-
      <p>OpenType doesn't support many-to-many substitutions. So you need to do this as two steps:</p>
      <p>A -&gt; A.2<br>
      when followed by B</p>
      <p>then</p>
      <p>B -&gt; B.2<br>
      when preceded by A.2</p>
