      <blockquote><p> OpenType doesn't support many-to-many substitutions.</p></blockquote>
      <p>Actually it seems to me that OpenType *does* permit m2m substitutions (using GSUB type 5 or 6 lookups) but none of the common tools (VOLT and AFDKO) provide a way to express these such rules.</p>
      <p>So I've often wondered if rendering engines actually support m2m lookups or not?</p>
