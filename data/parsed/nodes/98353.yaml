    html: |-
      <p><cite>For glyph names, underscores are customarily used to indicate ligatures between two characters</cite></p>
      <p>More than custom. IIRC, when generating a PDF, that's what the Adobe engine will assume &amp; make happen. So, if you have a glyph named A_B in your font, that glyph will become the two characters A &amp; B in a PDF text stream. (Or, I may not RC...)</p>
      <p>A period is what you want; everything after the period is dropped. So, "A.(anything)" remains "A".</p>
    html_clean: |-
