    <p>hello...</p>
    <p>I'm attempting to make a font with some OpenType features for the first time, using Fontlab, and, guess what - it's slightly confusing...</p>
    <p>what I'd like OpenType to do is:<br>
    for lots of specific character pairs, substitute pairs of alternate characters</p>
    <p>so, for example, if someone types 'AB' I'd like OpenType to substitute glyph A_2 followed by glyph B_2...</p>
    <p>I was kind of thinking I could do this with a contextual alternate feature like</p>
    <p><code>sub A' B' by A_2 B_2;</code></p>
    <p>but that doesn't seem to compile</p>
    <p><code>sub A B' by B_2;</code></p>
    <p>compiles OK, but doesn't really do what I want...</p>
    <p>does what I'm trying to do make any sense? is it possible?</p>
    <p>would a better way be to make all my desired glyph combinations as ligature glyphs? (and also make all the individual alternate glyphs separately available)</p>
    <p>any help would be great</p>
