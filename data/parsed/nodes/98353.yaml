    html: |-
      <p>In the AFDKO/FontLab syntax, that would translate to:</p>
      <pre>sub A' B by A.2;
      sub A.2 B' by B.2;</pre><p>
      For glyph names, underscores are customarily used to indicate ligatures between two characters, and periods to precede suffixes. Suffixes might also be more descriptive if you have different kinds of alternates– i.e. <code>.alt[x]</code> for general alternates, <code>.swsh[x]</code> for swashes, (where <code>[x]</code> is a numeric index), <code>.smcp</code> for small caps, etc.</p>
