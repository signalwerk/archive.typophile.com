    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Lettering</strong></p>
    <p>The craft of drawing or otherwise creating letterforms by hand for one specific use, e.g. for signs, illustration, logos, etc. Related to <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a> but a separate discipline; a good letterer does not necessarily make a good designer of type, and vice versa.</p>
