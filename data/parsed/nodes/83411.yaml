    <p></p><div class="imageWrap"><img src="http://typophile.com/files/TDC2-2012_Logo_2-curves_3496.gif"></div><br>
    The Type Directors Club has just posted <a href="http://tdc.org/tdc/competitions" rel="nofollow">the first announcement</a> of its annual type design competition, TDC² 2012. The jury, chaired by Maxim Zhukov, includes Roger Black, Matthew Carter, Paul Shaw, and Erik Spiekermann. The deadline for submission is Friday, 16 December 2011.<p></p>
