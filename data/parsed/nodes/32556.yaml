  html: |-
    <p>i want look at Robert Massin's work  La Cantatrice Chauve (The Bald Soprano), or Delire a Deux (A Frenzy for Two or More) for a major project/research assignment but am having trouble finding books and information, apart from a few articles that have tiny images of a few spreads</p>
    <p>"type as voice" massin distorted type to distinguish soft and loud conversation. most of his work was done in the 60's so it might pay for me to find something a bit more modern anyway, (am also looking at Tomatos Skyscraper which was done in 1994) so was just wondering if anyone knows of any work or designers that have done work similar to Massin?</p>
