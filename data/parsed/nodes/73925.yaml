    <p>Hi guys,<br>
    I recently got linked to a trailer for Sofia Coppola's new film. It looks pretty good on its own (and the music is really great) but what really got me hooked was the great type used for the titles.<br>
    I feel like I have seen it before, but it may just be similar to another face.</p>
    <p>I tried searching WhatTheFont.com, but that didn't come up with anything. Here are the snippets I used. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capture_4118.JPG"></div><p></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Capture2_6285.JPG"></div><p></p>
    <p>And the trailer can be found here:</p>
    <p><a href="http://www.youtube.com/watch?v=C9n9hP_LtL8&amp;feature=related" title="http://www.youtube.com/watch?v=C9n9hP_LtL8&amp;feature=related">http://www.youtube.com/watch?v=C9n9hP_LtL8&amp;feature=related</a></p>
    <p>Can anybody tell me what the typeface is? I'd really like to add it to my collection.</p>
    <p>Thanks,<br>
    Juan</p>
