    html: <p>It's not a book, just an article from Eye magazine no. 40, 2001. <br> <br>The article is entitled "Digital Type Decade", written by Emily King. <br> <br>I found it very interesting when writing a short thesis on recent years typography last month. <br> <br>Good luck!</p>
