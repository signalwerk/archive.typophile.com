    date_raw: 21 Feb 2003 — 5:17am
    votes: null
    html: <p>Go to RNIB's website (<a href="http://www.RNIB.co.uk" target="_blank">www.RNIB.co.uk</a>) and have a scooby around. You can buy a pack off them that details designing for the visually impaired for various media including the web. It not only outlines suitable font styles and minimum (and maximum - some people with visual impairments can't read text if it is to big believe it or not) sizes but also points out colour combinations required to assist people with various types of colour blindness and visual impairities. If you want visual clarity you can't find a better test group than the visually impaired - if they can see it people with 20/20 vision should have a much easier time of it to.  <br> <br></p>
    html_clean: <p>Go to RNIB's website (<a href="http://www.RNIB.co.uk" target="_blank" class="link-external">www.RNIB.co.uk</a>) and have a scooby around. You can buy a pack off them that details designing for the visually impaired for various media including the web. It not only outlines suitable font styles and minimum (and maximum - some people with visual impairments can't read text if it is to big believe it or not) sizes but also points out colour combinations required to assist people with various types of colour blindness and visual impairities. If you want visual clarity you can't find a better test group than the visually impaired - if they can see it people with 20/20 vision should have a much easier time of it to.  <br> <br></p>
