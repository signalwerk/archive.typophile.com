  html: <p>Hi, <br>I'm writing my thesis about web typography and how one could make texts more readable on the internet. Is there anybody who could recommend some books on this topic? <br></p>
  html_clean: <p>Hi, <br>I'm writing my thesis about web typography and how one could make texts more readable on the internet. Is there anybody who could recommend some books on this topic? <br></p>
