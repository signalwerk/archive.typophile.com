    <p>Since I wish to leave Saad's early Kufi thread as is, while I wish to get acquainted with Arabic writing history, I open this thread to gather resources about this topic.</p>
    <p>As a first step, I'd like to ask Saad which kind of writing is <a class="freelinking external" href="http://www.flickr.com/photos/ebensorkin/3039222737/" rel="nofollow">this one</a>, photographed by Eben Sorkin while doing the Arabic class at Reading with Fiona Ross.</p>
