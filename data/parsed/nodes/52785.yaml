      <p>Like with Europeans, it was the trend centuries ago to adapt a specific calligraphic style of the Latin script as a "national" or imperial style.  Smartly, the west had realized the advantages of getting rid of this antiquated practice. Script unity with open style diversity had served the Latin script and the West well. </p>
      <p>Despite my fascination with the beauty of Nastaleeq (Urdu and Persian), I am happy that the pre-Tasmeem machinery had at least served a good cause by practically "forcing" all users of the Arabic script to learn one common default style: Naskh. The Muslim east can also benefit from similar unity and diversity.</p>
      <p>-Saad</p>
