    html: <p>Now that Titus Nemeth's <a class="freelinking external" href="http://www.tntypography.com/aisha.html" rel="nofollow">Aisha</a>, a revival of Marcellin Legrand's mid-nineteenth-century <em>Arabe maghrébin</em>, has won a TDC² 2010 Award, I wanted to revisit this thread to ask how this maghribi typeface would be received by modern users in areas where the maghribi style was traditionally used. Would it be successful as a book face in Morocco? Or would it feel antiquated or quaint, like a German book set in fraktur, because users are so used to naskh being used exclusively for book typography? In short, what is a maghribi typeface's place in the world today?</p>
