      <p>piccic:<br>
      &gt;&gt;Are you a native Arabic or an Arabic user of adoption? I ask because I think we will always be more familiar with our own native scripts…</p>
      <p>I'm a native Persian. I use the script for my language but I don't speak Arabic. I can read -badly- an Arabic text and I vaguely understand few words of it because Arabic language -along Qur'an- had a great presence in our language. But I am a native Arabic *script* user not native Arabic. If by 'adoption' you mean in the historic sense, yes Persian language uses Arabic script by adoption. But I personally didn't adopt it. I grew with it and lived with it.<br>
      But this is an interesting point because the impact of new technology will be more pronounced in non Arabic languages of Arabic script. I don't know how far the change of 'established look' of published material in Arabic language can go from what it is now. Because the handwriting of Arabs is not essentially very far from it. This is not the case with handwriting of Persians, Pakistanis (who have never adopted Naskh for their mass consumption) and basically most areas to the east of Iraq.<br>
      I'm not knowledgable in traditionally established calligraphic styles but I can easily see that mix and match of different styles can happen. The new abilities will essentially move the 'established look' toward what is actually practiced in handwriting, which is mostly derived from Nasta'liq on the east of Iraq.</p>
