      <p>&gt;&gt;..one can go so far as to say that typography played a role in national identity, rather than the other way around.</p>
      <p>It is clearly a two way relation, but my point was that throughout history rules and even religious leaders had selected specific calligraphic styles to differentiate themselves from others.  The Persians had even used specific script styles to differentiate between society classes. Under Islam the Arabs quickly established the Early Kufi style to emphasize their new identity. Emphasizing national or religious identity was the main factor behind selecting a newly derived calligraphic style.</p>
      <p>-Saad</p>
