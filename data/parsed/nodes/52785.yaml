      <p>Yes, despite deliberate appropriations, the richness of each cultural heritage remains a shared thing. The individual and the local enrich the universal, which gives them its shared higher value in return.</p>
      <p>Colors, for example, were not used in protestantism, and black was adopted as the main color. But nonetheless, later on, black became also the default dressing color for the catholic clergy.<br>
      Also, most things pertaining to German culture became involved in Nazism, but continued to exist after the war (the interest in occultism and the <a class="freelinking external" href="http://en.wikipedia.org/wiki/Ahnenerbe" rel="nofollow">Ahnenerbe</a>, for example). It's also interesting to note how Edith Stein reflects upon Nazism: German hebrews were very fond of their heritage as German people, up to Hitler's prosecution.</p>
      <p>Associations are unavoidable, but we should be able to keep them as an exterior element, and seek the unity. Saad, you can't imagine how often it's difficult to discorporate islamic terrorism from the public perception of Arabic culture and Islam. Here it's often of no use to point out there are immigrants which are better persons, serious and hard working, than many Italians.<br>
      Providentially, it's also the other way around: we have a new generation of children growing up together, and the few friendships which blossom also between adults are a precious thing.</p>
      <p>I will pick it up on the history of Arabic alphabet hopefully in a near future, otherwise I will never work on my stuff… :=)</p>
