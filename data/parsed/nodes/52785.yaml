      <p>Thanks for the explanation. Of course, by "native" in terms of script I meant that Arabic is the alphabet you grew with. I'm sorry if sometimes I can't explain myself well, but my English is not so good as it seems, and often – for a term which is perfectly clear for me in Italian –, I can't figure which is the best word to translate the concept into English.<br>
      "Script" actually is one of those terms. In English it may mean the alphabet, a page, or a specific style of a typeface related to calligraphic models (connected or unconnected).<br>
      So, when I wish to translate what in Italian we call "scrittura", which means the alphabet with all its richness, history and life implications, I thought using "script" was a fine choice, but it's probably ambiguous. Of course, in Italian "scrittura/e" means also "handwriting", and the books of the Bible, and other things, but by context you can't equivocate so much, since Italian is a very sharp and precise language, quite the opposite of English.</p>
      <p>So, basically, what I meant is that what we grow with and learn as children is very deeply assimilated.</p>
