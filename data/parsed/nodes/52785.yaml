    html: <p>I suspect one can still find scribes proficient in the maghribi style in Morocco and perhaps into Algeria. The further east you go, the less likely you will be to find this style, and now it is most likely to be found deliberately evoking Andalusian or Moroccan history. In Morocco, I think it is admired and treasured as something particular to the region, but typographically one will presumably find naskh used.</p>
