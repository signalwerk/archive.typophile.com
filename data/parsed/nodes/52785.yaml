      <p>piccic:<br>
      &gt;&gt;I meant it not graphically, but in its impact on the average reader.</p>
      <p>I think we are all (the Arabic script users) in a transitional period. For generations, publishing technology has left us with simplified Naskh as the most visually adapted style for mass production and mass consumption. We don't 'see' anymore anything outside of that established style as 'standard' for publication. If we go outside of its boundaries, we are venturing in graphics and not the functionality of the text.<br>
      This is partly for the merits of simplified Naskh, and partly because, for generations, the technology limitations didn't leave use much other choice.<br>
      Now the technology is gradually giving us back what it has taken away from us for generations and although the outcome of this new capabilities is unknown to me, but I think it will certainly have a major impact -not quickly- in what we'd perceive as 'standard look' of a published text.<br>
      The graphic side also can fly from here on. But I wouldn't put both emerging changes in the same basket.</p>
