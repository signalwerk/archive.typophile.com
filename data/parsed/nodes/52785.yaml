      <p>Hi Benham, thank you!<br>
      Oh, I'm sure you can't make any substantial change to happen. What strucks me with Naskh is how it is both so deeply associated with the religious essence in the sacred text, and the average typographic form for everyday use. That's why I asked about Saad's simplified and often simmetrical experimental forms, and at the same time about a possible intermixed use of Naskh and black Kufic letters.<br>
      I see the beauty of Qur'an pages is often obtained by harmony of tone, while I tend to predilige harmony of contrast, and since in Latin we have always had different script forms mixed since the early middle ages (carolingian minuscule, capitals, and many later cursives), I wondered how this variedty could apply with Arabic letters and page layouts.</p>
      <p>Are you a native Arabic or an Arabic user of adoption? I ask because I think we will always be more familiar with our own native scripts…</p>
