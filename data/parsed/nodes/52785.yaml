      <p><cite> Like with Europeans, it was the trend centuries ago to adapt a specific calligraphic style of the Latin script as a “national” or imperial style. </cite></p>
      <p>I do not think it happened univocally this way. As printing with movable types was invented, Gutemberg adopted the textura because it was widely used as a calligraphic style, and he was setting a Bible in germany, at that precise time.<br>
      In fact, Italy remained mostly (entirely?) extraneous to the Blackletter use in typography.<br>
      In fact, what happened at Subiaco shows this mutual influence of cultural heritages: Schweinheim and Pannartz (which were German monks) turned the Blackletter back into less elaborate letter-forms setting the basis for what subsequently become our essential typographic letter forms.</p>
      <p>I try to translate what Piero Trevisan says in his 1953 book "Storia della Stampa" ("A History of Printing"):<br>
      <cite> Coming from the dioceses of Magonza and Colonia, they (Schweinhem and Pannartz) came as the first books had already reached a degree of perfection and, given their origin, they should have cut purely gothic typefacses. But finding themselves among such a treasure of codes transcribed in native styles, especially in humanistic and carolingian calligraphy, they felt their benefical influence, and like all proto-typographers they mixed proud and necessity to create something personal. </cite></p>
      <p>Similar to what could happen if Latin designers would approach Arabic letters and challenge themself to design with more thoroughness. In this sense, the "typographic matchmaking" project may not be such a disappointing effort, if it has contributed to the awareness of the Latin-based designers which partecipated in it… Who knows?</p>
