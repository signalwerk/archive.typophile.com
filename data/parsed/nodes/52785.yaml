      <p>piccic:<br>
      &gt;&gt;What did Persians and Pakistans have adopted as the most used model of typeface instead of Naskh?</p>
      <p>English is not my mother tongue either! I use the term 'script' as it is used by Unicode in defining a writing system covering a number of languages. By this definition, Italian is part of 'Roman script' as English is, and Persian, Urdu and Arabic are part of 'Arabic script'.</p>
      <p>Persians adopted Naskh exclusively. Because up until now -and even now- Nasta'liq could not be produced by machinery. When it comes to poetry, the hand work of calligraphers in Nasta'liq was occasionally used in school books and literary publications. There is now some speciality graphic applications that do Nasta'liq.<br>
      Pakistanis were more persistent in using the hand work in their publications (for Urdu Nasta'liq) and even now, have put more effort in producing fonts of Nasta'liq for mass consumption. But they also use Naskh in less exclusive manner.<br>
      The emerging advances in font technology and text rendering has just started and has not yet reached a widespread use and technical support in applications to have an immediate impact in the state of the affairs.</p>
