      <p>Yes, this is maghribi, 'from the maghreb' i.e. Northwest Africa. To my knowledge, there is only one font available in the maghribi style, Hakim Ghazali's eponymous typeface available from Linotype:<br>
      <a href="http://www.linotype.com/184180/hakimghazali-family.html" title="http://www.linotype.com/184180/hakimghazali-family.html">http://www.linotype.com/184180/hakimghazali-family.html</a></p>
      <p>The choice of a Latin companion design for this font presents an interesting case. Linotype opted to select a type with similar stroke characteristics, but of course the result in Latin is something very informal and rough, while the Arabic is a relatively traditional maghribi book hand.</p>
