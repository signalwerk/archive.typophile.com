      <p>Sorry to be taking over this thread.<br>
      John, I'm glad you like it. And surprised about your assessment of the Italic! When you speak of «conventional Italic» letter shapes I assume you must be looking at things like the a and g? Which even in slanted-Roman italics are sometimes «switched over» to alternate structures, simply because the Roman ones tend not to work very well slanted (and, I guess, as an alternate means of differentiation). But if you look at the whole thing in terms of construction, they're interrupted (? not continuous) strokes, the curves are quite rigid, and rather than pen-reminiscent instrokes and outstrokes this one has flat serifs (ok, half ones) in the placement typical of a Roman; all characteristics that to me make it more of a slanted-Roman than a classic cursive-infused Italic. I'm curious to learn about alternate perspectives on this, also since I'm very much still learning to sort out concepts and terminology.</p>
      <p>FWIW, this thread might be a better place to continue the discussion; on p.2 there are some investigations into what makes italic lettershapes more or less cursive: <a href="http://typophile.com/node/60506" title="http://typophile.com/node/60506">http://typophile.com/node/60506</a></p>
