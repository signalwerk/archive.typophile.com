      <p>The typical Italic is closer to calligraphic forms than its associated Roman.<br>
      Most people think this is a good thing, but to me it's just a legacy hold-over<br>
      from less sophisticated times and makes no sense because an Italic is supposed<br>
      to assist the Roman convey the text, not raise its voice in song!  :-)</p>
      <p>So there's something called a slanted-Roman, which means an Italic that's<br>
      quite close to the Roman in character, but slanted (although not mechanically).<br>
      Around the turn of the century (the previous one :-) some French and German<br>
      foundries made amazing slanted-Roman fonts, but the world wars bombed them<br>
      into history. It's high time to bring them back. I try to do this in my own work,<br>
      and some others have done this sort of thing too.<br>
      <a href="http://typophile.com/node/59269" title="http://typophile.com/node/59269">http://typophile.com/node/59269</a></p>
      <p>Typophile is infested with my opinions on this :-) so you might take the time<br>
      to do a search (just prefix your search with "site:typophile.com" on Google,<br>
      don't bother with the Typophile search box). Also, I gave a talk about this<br>
      at TypeCon-LA in 2010, but I don't have it in a distributable form (yet).</p>
      <p>hhp</p>
