      <p>The best way to get started is create some eye catching logos that work for the specified client.  It doesn't matter how big the client is; what's important is how hard your work hits the nail on the head.  Then create a PDF portfolio of your logo work.  Circulate it online by targeting small companies that have amateurish logos--business types frequently don't know how to approach the issue.  A good hook is a temporary special offer; flat fee for logo, business card, letterhead and envelope.  Remember, though, your logo develops equity with time, so don't sell yourself short.  You will only get to bill for it once, so make sure you are fair to yourself.  More about this on my website under articles; "Entrepreneur's First Choices . . ." this article provides some selling tips you may be able to use.  Don't limit yourself by region; the world is your marketplace now.<br>
      Good luck.<br>
