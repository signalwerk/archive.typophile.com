  html: <p>Any advice on the best way to start a logo design business?  I'm not shooting for anything big (right now), just looking to target smaller local businesses--so that I can build a portfolio in order to work with larger ventures. <br> <br>Thanks.</p>
  html_clean: <p>Any advice on the best way to start a logo design business?  I'm not shooting for anything big (right now), just looking to target smaller local businesses--so that I can build a portfolio in order to work with larger ventures. <br> <br>Thanks.</p>
