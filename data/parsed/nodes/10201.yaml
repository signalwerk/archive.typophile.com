    html: <p>Even with small companies/clients you will still need a portfolio to show what you can do. <br>I would suggest doing work in your neighborhood. As folks may not be able to trust your skills (as you can not show them a lot of past work), they will know you as a neighbor with certain personal qualities, trustworthiness and perhaps even a recommendation from a mutual associates. At this stage pro-bono work doesn't hurt. Get that portfolio filled up. Also it is a good idea to document your work. <br>Keep a journal and write down all the issues at hand with a job, the clients's budget, the time frames, challenges, intended audience. Keep sketches and all files related to the process. You can use this later to do "case" studies. These days a client may become just as confident in your skills by seeing why you created 10 jobs a certain way (wioth documentation) vs. the final result of 50 jobs without any reasons given. Also never underestimate the value of a nice portfolio case. Consider Pina Zangora, Lost Luggage, Shrapnel or Prat or a sweet case.</p>
