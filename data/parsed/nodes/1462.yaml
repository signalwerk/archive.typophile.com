  html: <p>Hello Typophiles, <br> <br>My agreement with Matthew is non-exclusive, here is an extract.. <br> <br>1. GRANT OF LICENSE. In accordance with this Agreement, the Publisher <br>grants Atomic Media a non-exclusive license to sell and deliver the submitted <br>Product, bitmap fonts, via the web site known as <a href="http://www.atomicmedia.net" target="_blank">www.atomicmedia.net</a> for two <br>(2) years after the Agreement is signed. The Publisher retains title and <br>ownership of the Product. ATOMIC MEDIA reserves the right to refuse to <br>include the Product in the Atomic Media Site if for any reason ATOMIC MEDIA <br>deems the Product to be unsuitable. <br> <br> <br>This means that i can keep selling hrough Atomic Media, but also offer my fonts in other places? <br> <br>Truth in Design and Fonts for Flash are working with super pixel fonts and i want to know if is legal to offer my new works to this guys, keeping my agreement with Atomic. <br> <br>mh.</p>
  html_clean: <p>Hello Typophiles, <br> <br>My agreement with Matthew is non-exclusive, here is an extract.. <br> <br>1. GRANT OF LICENSE. In accordance with this Agreement, the Publisher <br>grants Atomic Media a non-exclusive license to sell and deliver the submitted <br>Product, bitmap fonts, via the web site known as <a href="http://www.atomicmedia.net" target="_blank" class="link-external">www.atomicmedia.net</a> for two <br>(2) years after the Agreement is signed. The Publisher retains title and <br>ownership of the Product. ATOMIC MEDIA reserves the right to refuse to <br>include the Product in the Atomic Media Site if for any reason ATOMIC MEDIA <br>deems the Product to be unsuitable. <br> <br> <br>This means that i can keep selling hrough Atomic Media, but also offer my fonts in other places? <br> <br>Truth in Design and Fonts for Flash are working with super pixel fonts and i want to know if is legal to offer my new works to this guys, keeping my agreement with Atomic. <br> <br>mh.</p>
