    html: <p>Hi, Miguel. Based on the wording of this clause alone, you should be able to distribute your fonts anywhere you choose. But double-check the rest of the verbiage to ensure there aren't limitations as to who else can distribute your fonts (i.e., you are allowed to sell the fonts on your own site, but a third party can't.). <br></p>
