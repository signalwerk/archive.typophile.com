    votes: null
    html: <p>Yup. Though the site says it's a public domain version, to me, it looks suspiciously professional, so I wanted to know if I'm using illegally uploaded commercial fonts. Do you suspect this to be the case?</p>
  - id: 429227
    user: 17243
    date: 2010-09-11T16:10:00
    date_raw: 11 Sep 2010 — 4:10pm
    votes: null
    html: |-
      <p>Basically the design of DIN is public domain whereas specific digitizations may not be. Judging from the sample image this could be a custom digitization. The Engschrift doesn’t look all that good.<br>
      I don’t think this is a commercial version. I could be wrong.</p>
