    <p>I followed a link from Wikipedia's article on DIN 1451 to <a class="freelinking external" href="http://automatsvet.cz/traffic/" rel="nofollow">this</a> very broken-looking site containing downloads of public domain traffic signage fonts. They all appear to be so, except one download that I'm not sure about, <a class="freelinking external" href="http://automatsvet.cz/traffic/de.zip" rel="nofollow">this German one</a>, which contains DIN 1451. Here's a <a class="freelinking external" href="http://imgur.com/Qfbs3.png" rel="nofollow">sample image</a>, metrically kerned. So, is this a commercial version of DIN 1451? Thanks!</p>
    <p>(I didn't know if I should plop this here, in Release, or in General. Sorry if this isn't the right one.)</p>
