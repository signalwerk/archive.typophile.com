  html: |-
    <p>Hi there,<br>
    not sure if I added this to the right section but here we go:</p>
    <p>One of my clients branding guidelines states to use OCR-A for headings, subheadings and intro text. And to adjust the spacing so it doesn't look like a monospaced font. Well, of course this works if you use the right software and know what you are doing.<br>
    To make my client's job easier I was looking for a substitute and found one which using the OCR-A letter shapes but with the spacing adjusted. But guess what, I can't seem to find the font any longer.</p>
    <p>So my question is, has anyone come across a font using the OCR-A letter shapes but is non-monospaced?</p>
    <p>Hope this makes sense<br>
    Joerg</p>
