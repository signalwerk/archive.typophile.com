    <p>So I was looking through my font list and I found that I have 3 separate versions of Garamond. I have <a href="/wiki/Garamond" class="freelinking" rel="nofollow">Garamond</a>, Garamond Premier Pro, and Adobe Garamond Pro.</p>
    <p>Being rather new to the world of typography I was wondering what the difference(s) between them was. So I put the three styles next to each other and I noticed some differences in stroke weight, stress, density and so on but I figured I would see if there was anyone on here that could explain to me what is so different about the three.<br>
    Perhaps its a stupid question.</p>
