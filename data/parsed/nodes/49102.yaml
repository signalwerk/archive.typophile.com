      <p><cite>Funny thing, it seems like everyone is talking about Garamond lately. </cite></p>
      <p>I've dubbed that phenomena a sipeservation. It's the same concept like when you start looking for a new car and then ultimately buy one, almost immediately after the purchase you see your "new" car everywhere. It's almost like everyone owns it. Really, it's the moment you become aware of something you weren't really aware of until you started focusing on it. I didn't know what that was called, so I came up with my own word for it.</p>
