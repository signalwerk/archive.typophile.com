      <p>I made this using CG Fiedler Gothic, with a bunch of Squooshing and slanting.I don't say I think this is what they used, but it might be close enough without too much font hunting. The 'cutout' is from an obliqued rounded white rectangle behind MG, but in front of the 6.</p>
