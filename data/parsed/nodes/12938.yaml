    <p>In this thread: <a href="http://typophile.com/node/12902" title="http://typophile.com/node/12902">http://typophile.com/node/12902</a></p>
    <p>Chris Keegan says: </p>
    <p>&gt;Sorry, but I always chuckle when I see someone make a comment like “…so expensive”<br>
    &gt;There should be a list “Top Ten Things Not To Say On Typofile”</p>
    <p>So here's a few more:</p>
    <p>"Can anyone send me free the Adobe Type Library?"</p>
    <p>"With Helvetica and Times New Roman being so great,<br>
    who really needs new fonts?"</p>
    <p>"Those Armenians are so damn aggressive and bellicose,<br>
    why can't they be nice like the Israelis?"</p>
    <p>"Comic Sans is my favorite typeface. I just love it."</p>
    <p>"We all need to thank the American capitalism for<br>
    creating computer type design. God bless George Bush."</p>
