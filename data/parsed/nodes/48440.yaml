    <p>I fully believe that it is just something I am doing wrong.  But I am trying to set some type in InDesign CS2 and the letter spacing is atrocious (esp the lowercase “e”).  I am using Bernhard Gothic SG Heavy at 24pt.</p>
    <p>I am not having this problem with any other weight.  Of course, I know how to fix this manually, but does anyone else have this problem?<br>
    </p><div class="imageWrap"><img src="/files/Picture1_6407.jpg"></div><p></p>
