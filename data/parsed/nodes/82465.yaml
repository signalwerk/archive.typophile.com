    <p>There is a thread on the Adobe Photoshop community about the wish to add the Glyph palette to Photoshop:<br>
    <a href="http://feedback.photoshop.com/photoshop_family/topics/glyphs_panel_for_the_love_of_god" title="http://feedback.photoshop.com/photoshop_family/topics/glyphs_panel_for_the_love_of_god">http://feedback.photoshop.com/photoshop_family/topics/glyphs_panel_for_t...</a></p>
    <p>It would be a good idea to go through the registration process (for those of you who don't have an account yet) and "like" that idea there, as well as leaving some comments. The more people support this, the higher it'll be prioritized in the development process. So please spread the word as well. </p>
    <p>I've already given my vote and comment there. </p>
    <p>Best,<br>
    Adam</p>
