    <p>This sample was sent to me for an ID. I think the bowl shapes remind me of Zapf (like Meilor or Palatino), but I can't place the face. The 'S' seems like it would be a good clue, but no 'slab' serifs matched it where I looked. <br> <br>Anyone recognize it? Thanks.<img src="http://www.typophile.com/forums/messages/83/23948.gif" alt="RolandKirk sample"></p>
