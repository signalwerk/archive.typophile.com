      <p>Props to Computer Arts Projects for doing such a comprehensive typography special issue.</p>
      <p>I have to agree that the Type of Our Times was a bit wack, but it wasn't the Helvetica details that bothered me, but the Modernist perspective. The history of type culture is not Bauhaus, Dada, Constructivists, etc. But this fault is widespread in design history, exemplified in Phillip Meggs <em>History.</em></p>
      <p>For an English perspective, it's like you're travelling through vast pre-war suburban estates of mock-Tudor semi-detached homes, to get to a 1930s international style mansion at the end of a lane.</p>
