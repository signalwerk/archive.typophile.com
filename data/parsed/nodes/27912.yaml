      <p>One persistent problem is the stigma that formal publications seem to feel in consulting informal groupings of aficionados (mingled with experts like Erik) such as Typophile. Instead of tapping into the lightning-fast public expertise <cite>before</cite> the stuff hits the fan, they tend to pretend such resources don't exist, sometimes even seeing them as an enemy.</p>
      <p>hhp</p>
