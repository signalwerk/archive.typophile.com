      <p><em>How is this Meggs fault? I’m curious.</em></p>
      <p>His was the first comprehensive history of graphic design.<br>
      In focusing on the modernist thread, he reflected a general consensus, and also set the tone.</p>
      <p>Lewis Blackwell's 20th Century Type is similar, but it's like two separate histories in one. On the one hand it shows a history of avant garde examples of modernist typography, but on the other, it dutifully shows the major type designs, many of which are historicist, as alphabetic specimens -- but few are shown in use.</p>
