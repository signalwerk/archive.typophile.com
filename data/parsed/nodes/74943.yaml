  html: |-
    <p>A client has supplied a bespoke typeface which i need to upload into an online system. The system doesn't support leading so apparently i need to adjust the leading on the typeface before uploading. I have the typeface in OTF, Type 1 and True type formats.</p>
    <p>I'm a bit lost, can anyone let me know what is the best software or method for doing this?</p>
    <p>Thanks</p>
