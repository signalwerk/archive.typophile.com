      <p>The <strong>west elm</strong> identity looks like <a href="http://www.myfonts.com/fonts/fontbureau/interstate/light/" rel="nofollow"><strong>Interstate</strong> Light</a> on their website – what you have above is different though (<em>or</em> perhaps I’m looking at the wrong <a href="http://www.westelm.com" rel="nofollow">west elm</a> website).</p>
      <p>I’d agree with Patty that <strong>WILLIAMS-SONOMA</strong> does look like <a href="http://www.myfonts.com/fonts/linotype/new-century-schoolbook/" rel="nofollow"><strong>New Century Schoolbook</strong></a>, but it’s weight has me looking at <a href="http://www.myfonts.com/fonts/berthold/augustea-bq" rel="nofollow"><strong>Augustea</strong></a>, much of a muchness really.</p>
