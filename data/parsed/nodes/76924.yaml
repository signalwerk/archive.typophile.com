      <p>This is a custom typeface (‘DI Sans’), created for the <a href="http://di.dk/Pages/Forsiden.aspx" rel="nofollow">Confederation of Danish Industry</a>. There is also a nice serif (‘DI Serif’) that you can see on their website.</p>
      <p>You might like <a href="http://www.emtype.net/relato_sans_01.php" rel="nofollow">Relato Sans</a> or <a href="http://www.dardenstudio.com/typefaces/freight_sans" rel="nofollow">Freight Sans</a> as available alternatives.</p>
