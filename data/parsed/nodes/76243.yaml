    html: <p>I think "catch words" or "catchwords" is a term, and Jeff levine does <a class="freelinking external" href="http://new.myfonts.com/fonts/jnlevine/catch-words/" rel="nofollow">Catch Words JNL</a>, whilst FontFont do <a class="freelinking external" href="http://new.myfonts.com/fonts/fontfont/catch-words/" rel="nofollow">FF Catch Words</a>. There's also the <a class="freelinking external" href="http://new.myfonts.com/fonts/emigre/brothers/word-logos/" rel="nofollow">Brothers Word Logos</a>.</p>
