  html: |-
    <p>I'm trying to locate a good source for the little embellished 'and' 'the' 'Co.' etc. that are often found on very old labels and ads around 1900?</p>
    <p>Do these have a particular name? If they're just an added bonus with some typefaces, can someone recommend a few to look at?</p>
    <p>I found this: <a href="http://www.letterheadfonts.com/fonts/noelsthesands.php" title="http://www.letterheadfonts.com/fonts/noelsthesands.php">http://www.letterheadfonts.com/fonts/noelsthesands.php</a> but would like some more options. </p>
    <p>Thanks so much!</p>
