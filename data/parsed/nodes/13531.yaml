  html: |-
    <p>SparkyType is the type design outlet of <a href="/wiki/David%20Buck" class="freelinking" rel="nofollow">David Buck</a> of New Zealand.</p>
    <p>SparkyType creates quality typefaces that are often inspired by hand-made and quirky alphabets and also offers technical and experimental faces. With experience in custom font creation and customisation, SparkyType is a full-service foundry and is also responisble for the digitisation of the library of <a href="/wiki/Joseph%20Churchward" class="freelinking" rel="nofollow">Joseph Churchward</a>.</p>
    <p><a href="http://www.sparkytype.com/" title="http://www.sparkytype.com/">http://www.sparkytype.com/</a></p>
