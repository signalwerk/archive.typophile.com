      <p>السلام عليكم<br>
      To use OpenType features for setting the marks (tashkeel) positions the only way I know is to use Microsoft's free VOLT software.<br>
      Here is an excellent booklet freely downloadable from khtt.org  explaining how to use it for Arabic.<br><a href="http://www.google.co.jp/url?sa=t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=4&amp;ved=0CDkQFjAD&amp;url=http%3A%2F%2Fkhtt.net%2Fattachment%2F31760&amp;ei=Yus-VbuCMMStmAWmpIH4AQ&amp;usg=AFQjCNFXisf60n0iIGhjnDxwJcrN9F8qSA&amp;sig2=eqgs69NLvdV29kuktA2aXA&amp;bvm=bv.91665533,d.dGY">http://www.google.co.jp/url?sa=t&amp;rct=j&amp;q=&amp;esrc=s&amp;source=web&amp;cd=4&amp;ved=0CD...</a><br>
      It is not easy to learn at first, but if you ask questions you get answers. Are you using Fontlab?  </p>
      <p>In your red example you changed the locations of the marks. In Volt that is done in the Marks feature. However in the case of the dammatan you also changed the mark shape. For that you need to crete a substitution feature. and then to specify in the Mark on Mark  mkmk feature.</p>
      <p>Good luck.</p>
