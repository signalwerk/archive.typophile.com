      <p>&gt; Paul - it was a lot of fun. I’m not so glad it’s over. I don’t miss cut and paste but I miss the attitude.</p>
      <p>Who says the attitude is over? I was talkiing about the lifestyle, which was over for a lot of people very quickly.</p>
      <p>I perceive it as a lot of outsiders (for many different reasons) that gathered together for that reason - we didn't fit in anywhere else. That lead to a lot of self-destructive behavior and a lot of dead people - at least in LA, NY, and SF - locations I am most familiar with.</p>
      <p>Being an outsider is really hard Patty, it's a strength and a tremendous burden. You have to be a supreme egotist for it not to hurt. I'm still an outsider but have learned how to deal, unlike a lot of my friends who aren't here anymore…</p>
