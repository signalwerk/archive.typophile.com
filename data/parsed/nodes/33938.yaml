      <p>Don't get me wrong Patty - I loved it and am very glad I was a part of it. But I also saw a bunch of folks drop and that wasn't cool. My belief in that grows stronger as time goes by…</p>
      <p>Punks were idealistic, the province of youth. It may have been idealism flipped on its head, but idealism it was.</p>
      <p>I think there are young idealists out there, but if they create something real it is co-opted so fast by the media that the life is sucked out instantly. Part of the reason punk worked is that it got to stay separate from "reality" for awhile - there was absolutely no chance to make it (unless you were a poseur like Patty Smith, Talking Heads, Blondie or The GoGos - probably get slaughtered for this statement).</p>
      <p>It was crazy noise made by crazy people. Love it. But there is one thing that absolutely drives me crazy and that is reflecting on that time period like it was better than now. That's just not punk.</p>
      <p>peace</p>
