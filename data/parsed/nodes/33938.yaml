      <p>Paul,</p>
      <p>I recognize that much of the punk aesthetic was not sustainable, but as a friend of mine who was there for the duration (actually even further back, he was part of the factory scene) said, where's the underground today? Two republican mayoral administrations have driven it so far down you can't really find it anymore.</p>
      <p>I guess that's what I miss - and I was around for the NY part of the punk scene - the ability to experiment and live an alternative lifestyle. Very difficult in today's economy. Not to mention the collaboration, cross-pollination btw the different arts.</p>
      <p>You really didn't include in your roundup the NY side of things, or the anarchist school. I designed a great book called The  Downtown Book that has a lot of graphics from '74 to '84.</p>
