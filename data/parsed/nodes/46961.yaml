  html: |-
    <p>I have seen this font before but all that I can figure is that it is a knockoff</p>
    <p>It looks exactly like eras but without the slant and all versions of eras I've seen have slightly pinched letterforms. The I for instance is a rectangle with straight sides, yet on Eras the sides are curved in a bit. </p>
    <p>Has anyone seen this before?</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/bbbb_5060.jpg"></div><p></p>
