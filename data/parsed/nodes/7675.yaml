    html: <p><a href="http://www.typography.com/catalog/requiem/index.html" target="_blank">HTF Requiem</a> and <a href="http://www.myfonts.com/fonts/linotype/centaur/" target="_blank">Centaur</a> have nice R legs too but I was thinking same - why not take a font that you like for all your purposes and then just modify the R for the logo? It's more original to customize a font for a logo than just using it as is.</p>
