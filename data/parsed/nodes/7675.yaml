  html: "<p>This is a tuff one... and, after four hours of in-depth search, I am stymied (but not in the slab serifed sort of way). <br> <br>I am developing a wordmark for a holding company with a name comprised of three sets of initials of the owners (what's worse, is that there is a backslash after the first three). <br> <br>The saving gRace (or the solution) may be in the use of a capital \"R,\" which appears after the backslash. <br> <br>After searching through Rockledge, Font Bureau's spec book (3rd edition), and hundreds of Fonts on our sponsor, Font Shop, I am missing something: the capital \"R\" with a long flowing extender that will add grace, elegance, and dignity to the wordmark. Fortunately, after the cap R, two lowercase letters w/out descenders follow. <br> <br>As of yet, I am not sure with this is going to be all-caps (not preferred), initials w/small caps, or U/L.... <br> <br>A titling font would be okay, but the face has to work on a business card and its vertical stressors, IMHO, shouldn't be too heavy in contrast for it to work on da web. <br> <br>The cap \"R\" in BEMBO is nice, but, to me, even with proper kerning, it looks off... (Oh, the \"R\" is followed by an \"i.\" ) <br> <br>Any suggestions?  A gold dubloon or sort of compensation/contribution may be in order, even if its to \"typophile.com.\" <br> <br>Thanking you in advance for your help and careful consideration. Geo.</p>"
  html_clean: "<p>This is a tuff one... and, after four hours of in-depth search, I am stymied (but not in the slab serifed sort of way). <br> <br>I am developing a wordmark for a holding company with a name comprised of three sets of initials of the owners (what's worse, is that there is a backslash after the first three). <br> <br>The saving gRace (or the solution) may be in the use of a capital \"R,\" which appears after the backslash. <br> <br>After searching through Rockledge, Font Bureau's spec book (3rd edition), and hundreds of Fonts on our sponsor, Font Shop, I am missing something: the capital \"R\" with a long flowing extender that will add grace, elegance, and dignity to the wordmark. Fortunately, after the cap R, two lowercase letters w/out descenders follow. <br> <br>As of yet, I am not sure with this is going to be all-caps (not preferred), initials w/small caps, or U/L.... <br> <br>A titling font would be okay, but the face has to work on a business card and its vertical stressors, IMHO, shouldn't be too heavy in contrast for it to work on da web. <br> <br>The cap \"R\" in BEMBO is nice, but, to me, even with proper kerning, it looks off... (Oh, the \"R\" is followed by an \"i.\" ) <br> <br>Any suggestions?  A gold dubloon or sort of compensation/contribution may be in order, even if its to \"typophile.com.\" <br> <br>Thanking you in advance for your help and careful consideration. Geo.</p>"
