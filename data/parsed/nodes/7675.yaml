    html: "<p>Indeed, Patricia &amp; Patrick, great suggestion re: the leg graft, however, I lack the chops in Illustrator and/or a fontographer type program to pull this off. (I had thought of it, but... it only brings to mind \"yeah, I should learn how to makeover fonts.... I'm a copywriter by trade. A creative director by experience. And, a \"designer\" by default.  However, I am a very type sensitive guy.  Work on phototypositors in a prior incarnation...) <br> <br>Anyway, yeah, Centaur is one my all time faves, but, no go on this project; too delicate for small size logotreatement on web. Requiem may be worth a shot.  Mantinia was on the list.... <br> <br>Yeah, I was looking for some sort of ornamental font like the Caslon Swash family w/out being so, er, roccoco (or liberace).  <br> <br>Sorry to trouble y'all.... Thanx for the help....</p>"
