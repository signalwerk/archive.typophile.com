    html: <p>Ach ... what a dufuss I can be! <br> <br>I was perusing MyFonts' new fonts � which included both new Solotype fonts and the addition of <a href="http://www.woodentypefonts.com/" target="_blank"> Wooden Type Fonts</a>. Thanks for clearing that up, Justin. I'm happy to see that Jordan Davies' fonts are now available to a wider public and in a Windows format � albeit Type 1. Hopefully, he will add more of his many digitized wood type fonts to the MyFonts offerings.</p>
