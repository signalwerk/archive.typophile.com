    date: null
    date_raw: null
    votes: null
    html: <p>Well I'm guessing Disney based their theme park signage on some version of Rubens. <a href="http://mickeyavenue.com/fonts/ravenscroft.shtml">Ravenscroft</a> was the attempt of a couple of Haunted Mansion fans to mimmick it. (I was one of them.) <br> <br>The <a href="http://www.myfonts.com/fonts/woodentypefonts/rubens/">Rubens</a> that Mike linked to appears to be by Jordan Davies rather than Dan Solo. Solo had a digitization of Rubens on the Dover Victorian Fonts CD &amp; Book, but I don't think he's yet revamped it for his MyFonts collection. Though, as bj noticed in the previous thread, <a href="http://www.myfonts.com/fonts/solotype/excelsis/">Excelsis</a> is pretty close.</p>
    html_clean: <p>Well I'm guessing Disney based their theme park signage on some version of Rubens. <a href="http://mickeyavenue.com/fonts/ravenscroft.shtml" class="link-external">Ravenscroft</a> was the attempt of a couple of Haunted Mansion fans to mimmick it. (I was one of them.) <br> <br>The <a href="http://www.myfonts.com/fonts/woodentypefonts/rubens/" class="link-external">Rubens</a> that Mike linked to appears to be by Jordan Davies rather than Dan Solo. Solo had a digitization of Rubens on the Dover Victorian Fonts CD &amp; Book, but I don't think he's yet revamped it for his MyFonts collection. Though, as bj noticed in the previous thread, <a href="http://www.myfonts.com/fonts/solotype/excelsis/" class="link-external">Excelsis</a> is pretty close.</p>
