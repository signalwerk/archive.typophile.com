    <p>Good, bad, or ugly, here's a few books I've stumbled across at a discount price and I'm wondering whether to buy any of them. I figured the exalted company of Typophile would know way more than I do:</p>
    <p>1) Designing with Type: A Basic Course in Typography (Bevington/Craig). ISBN: 0823013472</p>
    <p>2) Type Design (Teal Triggs). ISBN: 0060567597</p>
    <p>3) Rookledge's International Typefinder. ISBN: 1856694062</p>
    <p>4) The Complete Guide to Digital Type (Andy Ellison). ISBN: 0060727926</p>
    <p>Thanks in advance!<br>
    Alex</p>
