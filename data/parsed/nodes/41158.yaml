    date_raw: 1 Feb 2008 — 11:17am
    votes: null
    html: <p>The 2004 edition is just a reprint of the 1990 edition (which certainly is an update on the original, adding about 15 typefaces to the book and with a forward by Frutiger), and, as such, is missing many of the major recent faces; there's no Jenson or Myriad or Minion or Scala or ... the list goes on. It's not as useful as it could be for that reason. The edition I have doesn't look 'rescanned'. But I suppose, not having an original to compare from, I wouldn't know any better.</p>
