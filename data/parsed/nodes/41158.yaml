    html: |-
      <p>WELL: a new edition of Rookledge? I was unaware of this. My copy is 25 years old, 1st USA edition, 1st printing. I reviewed it for "Fine Print" in 1983. I do indeed use some of its principles of looking at types when I'm at work and when I'm in the classroom.</p>
      <p>So, seeing Alex's original post here, I became very interested in getting a new edition, as a help to IDing faces, and to see how well it had integrated new faces into the old format. Then I went to Amazon and read a customer review [I should say I rarely read book reviews of any kind, and I do not necessarily trust "crowd wisdom" to help guide my reading habits]:</p>
      <p>The reader/customer wrote: "While there is slightly more content, I think that the poor quality sample typography scans (assumedly from the original book) cause me to wonder if I should just keep using my original edition. It appears that even the linework and sample names have been rescanned."</p>
      <p>SO . . . just how much new content is there in this 2004 Rookledge edition? Are this new edition's problems as bad as the reviewer suggested? Has anyone here got both books and made a comparison? I'm not sure I'll find this in bookstores around here, but I shall look.</p>
      <p>I hope someone can help me. Thanks.</p>
      <p>powers</p>
