  html: |-
    <p>Hello,</p>
    <p>I am giving the (hopefully) finishing touches to a careful and comprehensive revival of Rudolf Koch's classic Wilhelm Klingspor Schrift.<br><img src="/sites/default/files/old-images/WKSchrift_4029.png"><br>
    The font adds a lot of features to existing revivals (notably Adobe/Linotype Wilhelm Klingspor Gotisch), including the full sets of basic characters, narrow capitals, alternates, ligatures and ornaments originally designed by Rudolf Koch.</p>
    <p>I would be extremely grateful to hear your invaluable opinions before releasing the font. You can download a high-res specimen sheet <a href="http://www.alterlittera.com/al_image/Spec1.gif" title="Click to visit an external URL." class="freelink freelink-external freelink-external">here</a>.</p>
    <p>Thanks in advance for your help.</p>
    <p><img src="/sites/default/files/old-images/al_logo_4715.png"></p>
