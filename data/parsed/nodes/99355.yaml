  html: |-
    <p>Hello,</p>
    <p>I am giving the (hopefully) finishing touches to a careful and comprehensive revival of Rudolf Koch's classic Wilhelm Klingspor Schrift.<br>
     </p><div class="imageWrap"><img src="http://typophile.com/files/WKSchrift_4029.png"></div><br>
    The font adds a lot of features to existing revivals (notably Adobe/Linotype Wilhelm Klingspor Gotisch), including the full sets of basic characters, narrow capitals, alternates, ligatures and ornaments originally designed by Rudolf Koch.<p></p>
    <p>I would be extremely grateful to hear your invaluable opinions before releasing the font. You can download a high-res specimen sheet <a class="freelinking external" href="http://www.alterlittera.com/al_image/Spec1.gif" rel="nofollow">here</a>.</p>
    <p>Thanks in advance for your help.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/al_logo_4715.png"></div><p></p>
