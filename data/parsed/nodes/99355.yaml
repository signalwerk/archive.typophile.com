    html: |-
      <p>Jürgen,</p>
      <p>Thanks for reading and commenting. I wanted the hairlines to be really thin, so they provide a hard contrast at display sizes while, at the same time, are almost unnoticeable at text sizes. I didn't want to make just another standard revival in several respects, so I expected the thin hairlines would contribute to set this revival apart from those of, say, Adobe and Linotype. Anyway, the topic doesn't seem to have generated too much enthusiasm ... Nonetheless, I have updated the specimen sheet linked to on the first post. Incidentally, the gif file now seems to be properly loadable within IE.</p>
      <p>Thanks again.</p>
