      <p>Almost done! Lots of additions and refinements since the previous post, including a careful revision of each and every glyph. The font is finally an (almost) exact reproduction of the Klingspor original (with many convenient additions for modern OpenType use), providing vast improvements over the current Adobe/Linotype and other not-so-popular renditions.<br>
      Updated information and samples available at <a class="freelinking external" href="http://www.alterlittera.com/al_htm/oldtype/wklingspor_schrift.htm" rel="nofollow">alterlittera.com</a>.<br>
      Thanks in advance.</p>
