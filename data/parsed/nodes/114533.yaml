    <p>Hi there.</p>
    <p>I wouldn't mind a bit of critique on this, my first (more or less) digital typeface. It was intended as Schelter-Giesicke Grotesk meeting Helvetica with a dash of Bauhaus (Herbert Bayers "Universal", really), but so far it looks more like random Grotesk meeting Futura, but I like it anyway.</p>
    <p>I have added a pdf-file with the glyphs, I've imported in fontforge so far. This is a spare time project, so I am not working on it every day - or even every week. Some glyphs drawn have yet to be imported (either as SVG or high-resolution PNG). The glyphs have been drawn in originally in AutoCAD R14 (old, reliant beast), and later recreated in Inkscape, with the exception of the more complex straight-line glyphs (A, V, W, Z). Inkscape does not give me the control I need here, so Autocad it is. Anything with curves is done largely in Inkscape due to the many ready-to-go structures. 'D' was exported to PNG and traced in fontforge, because the SVG got messed up in fontforge somehow. I may do the same to 'B', 'G' (which needs a heavy overhauling), 'J' and 't'.</p>
