      <p>That would be the weight of the right-hand curve in 9 (lefthand in 6). Yes, they are shapewise identical, but 9 rotated 180 degrees.</p>
      <p>The weight of the curvature is too light and too even. There is next to no weight variation. Apart from that it kinda looks okay.</p>
