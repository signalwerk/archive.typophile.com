    html: <p>Actually I have no right to speak of weight variation - my current font is strictly mono-spaced (if that is the word?) equal width lines measured with a unit circle in Fontlab !  The matching Latins have some thickness variation, though. Now I see the Arabic 5 (egg-shaped oval) needs major work but the dot has been lowered. </p><div class="imageWrap"><img src="http://typophile.com/files/AlQuds sample jones_4408.jpg"></div><p></p>
