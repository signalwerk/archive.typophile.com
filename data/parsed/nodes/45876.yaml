    <p>Hi everyone,</p>
    <p>As refered <a class="freelinking external" href="http://typophile.com/node/42228" rel="nofollow">here</a> I started a new Sans inpired in those letters...special the "a". After some work, please find enclosed a PDF for comments...</p>
    <p>I made it without any contrast in lines and started to wonder if a little of it won't help the final result. I made a "abc" in both cases just to give you an ideia here this may go.<br>
    Please feel free to ad comments!</p>
    <p>Thanks in advanced.<br>
    António Fonseca</p>
