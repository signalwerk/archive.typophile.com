      <p>Design thoughts: Choose the S that goes with the caps, so all-cap setting don't look weird. We're used to seeing this split personality in mixed-case settings, so it's not that important to match features like this with lowercase. Another option is also to use the more straight or firm serifs on the lowercase. Remember, one single feature does not define the character of the design, especially a design this lively. Be willing to discard something small in order to get better harmony among all the parts. Otherwise it's lettering, not type. Consider also the sort of arabesque serif from the a, applied to the s. Could be the top or bottom one, probably not both. Try it!</p>
      <p>Is the Sal5Prime PDF the latest? I still think the internal proportions need work. The Bold looks so narrow compared to the breezy, wide Roman and Light. The eocdbqp look so pinched, whereas E and A look wide. And the spacing of the Bold is also too loose. Put a line of text up with mnuhilt together; see how stems within a letter are close, and stems between letters are far apart. This effect is greater in the Bold Italic. An easy way to deal with both issues is to move stems apart, losing sidebearing width and gaining internal space.</p>
