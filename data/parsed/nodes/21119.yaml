      <p>Yes, Sal5prime is the latest--I replaced Sal5 with it, but it was only a minor update, so I didn't change any of the text. I've sent an e-mail to Grant, and gotten one back saying that he thinks some of your comments ought to be applied. Unfortunately, I didn't see your latest comment here until after I sent him back an e-mail with the font files. (I thought he was talking about your older comments.) I'll probably implement some of your ideas, now that I've seen them. However, I think an upward serif on the s would make it look distractingly like a 5. (And on the bottom, it turns out looking like something from a blackletter or a Poe book.) By the way, until I have money to commit to a less temperamental font program, I can't do anything with any codepages other than basic Latin (I'm with TypeTool 2 right now, and it has certain foibles, one of which is that it only lets you generate a font with one codepage at a time, so Twardoch has told me). I've finished that codepage for all eight weights. The Greek you see up there is actually mapped to Latin letter spots.  </p>
