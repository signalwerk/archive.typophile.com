    html: |-
      <p>Hi Nathanael,</p>
      <p>How's everything?  I finally got this newer PDF out and had a look. I think it's good. There are uneven bits, mostly in proportions and weights, which probably jump out at you in a larger text setting. There's lots of personality, and I think the soft finish is pleasing in that context. This design especially looks like a good starting point to adapt for both extended text and display. Things like the upward spur on a, z, 2, 3, and 7 could be carefully modulated in the text variant to be quiet enough not to disrupt, and enhanced with all the other vivacious traits in the display cut. The Italic has a skeleton and a rhythm that could easily be adapted to text sizes. Intriguing.</p>
      <p>I'd say, decide if you want to enhance the hand-drawn feel of it, or polish it more and make it more "typographic". See also Sirenne from MvB fonts, and Olduvai (Veer.com), which Randy Jones developed and shared here on Typophile. </p>
      <p>I also have to point out; depending on what sizes it will be intended for, x-height to cap-height to ascender height is an important relationship. At this point, I know I'm not alone in feeling I can only take a typeface so seriously if it has a voluminous x-height. "Classy" is shorthand for small x-height. Salamander's x-height isn't monstrous, but it is large for a text face. With a design this informal and lively, it might be useful to have this height relationship established, and then adapt the liveliness and proportions to that. Even so, you can do versions for text and display. Goudy's designs are interesting to look at with that in mind.</p>
      <p>The double-dagger from your PDF is very fun (among other things).</p>
