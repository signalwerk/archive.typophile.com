      <p>This is interesting, Nathanael. I'd like to look at it more closely before suggesting anything. I'll print your PDF and have a look. From first glance I agree with Chris; it has a nice freedom. </p>
      <p>Zapf actually was not given a choice in naming Optima. The foundry chose that name and apparently it was their prerogative to override Zapf's choice, which (I think) was Neue Antiqua. I tend to agree, from a marketing standpoint, Neue Antiqua is not evocative and even a little dry and vague. </p>
      <p>Back then, there weren't 40,000 typefaces available anywhere, much less from one website, so it was a lot easier to choose a name. I got Mundo Sans because I asked Archie Provan at RIT to register it with the name registry in 1993, and then later (1998) when I finally released Mundo Sans (the first time) it was still available. Once, I saw something in a FontShop catalog named Mundo, but it was renamed or pulled, I assume since they discovered I had registered the name. </p>
      <p>However, I do not advocate hoarding unused names in the registry; that's as bad as hoarding web domains.</p>
