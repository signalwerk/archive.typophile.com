      <p>Hello, or haldo, as the case may be!<br>
      I've made a couple new weights for this. I still have yet to make italics for the new weights. I also worked on the roman. Significantly, I think I've figured out the way to make the "a" work in text. I made the point less pointy, more blunt. The "z" followed. And I ironed out a few kinks and things of that nature. One thing I didn't get to, apparently, was fixing the right bearing on the light "!". And, somehow, I ended up with naked letters in some of the diacritic letter spots in the italic.<br>
