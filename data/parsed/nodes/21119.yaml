    html: |-
      <p>Hi Nathanael,</p>
      <p>Quickly: </p>
      <p>Bold looks narrow; add weight to outside of letters, not just inside. With counters so small, it now wants tighter sidebearings. See aegsn in all weights to compare these proportions.</p>
      <p>Light and Light Italic look like typewriter versions of the regular and Italic. Also long serifs look highly exaggerated in the Light Italic. Serif length can be varied from one weight to another, independently of serif thickness, stroke contrast and everything else. Can you make a trial of some Light versions with more contrast and less flappy, emphatic serifs? In Light Italic especially, long serifs give noisy effect. Consider that at this weight, nobody can use the Light for small text anyway, so smaller serifs and more delicate details are appropriate. For an example of this, see the different weights of the Luxury Text faces by House Industries. Because the Regular is so finely detailed, the Bold works better at smaller sizes than the Regular. In the case of Newt, the Demi looks to me like the basic Text weight and the Regular looks like a Light text weight. That makes your Light into a display version. </p>
      <p>Unless you want these all to be for display. In which case, blow them up and take note of which features don't fit at large sizes. </p>
      <p>Roman designs: The Dutch trend toward soft terminals on s notwithstanding, Newt has such emphatic, classic serifs, I would suggest using them on s and especially S as well.</p>
