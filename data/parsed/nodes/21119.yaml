      <p>I too like it a lot, and I agree with most things Grot Esqué and Steven said. </p>
      <p>On the other hand the lc 'a' is kinda sweet. It gives the font more character, which IMHO is a good thing. The horizontal part of the 'a', with the little curl on, should be thinner. That way it is not that present in the font what could work out positively on the annoyance factor. </p>
      <p>Your baseline overshoot could be bigger, if there is one at all. This brings a bit more optical balance in the font. </p>
      <p>I agree that the lc romans could be a bit narrower. The italics seem to be very narrow compared to the romans. </p>
      <p>I do like the italics, but you could give the UC a bit more personality. The V, W, Y, Z could be a good starting point.<br>
      Personally I would put the italic 'f' a bit more upright. It seems now to have a steeper angle than the rest of the characters. It would give it a bit more classical note if it was less italic than the rest.<br>
      The only character that feels out of tune is the lc 'x'. I can't really say why, but to me it just doesn't seem fit to the italic character of the font. </p>
      <p>Other than that I would not change that much. Some little things that I see and would propably change myself:</p>
      <p>ITALIC<br>
      - The italic UC should be narrower.<br>
      - The middle stem of the lc 'w' a bit lower. It seems to stick out a bit too much.</p>
      <p>ROMAN<br>
      - The lc 'b' needs more balance. It wants to be an italic, but is held back by the ascender. Perhaps the upper bowl/stem connection is too open.<br>
      - The 'r' could be a bit wider. You could than also make the right side serif a bit longer for balance.<br>
      - The '6' seems to be too small next the the '5'. Try making the ascender higher. The '9' would follow the '6'. Don't make the bowls smaller.<br>
      - UC 'T' could be less high. The horizontal part seems to stick out.<br>
      - Lc 'u' a bit narrower.<br>
      - Balance the UC 'S' a bit. It seems now like a cobra about to attack. The upper inner form seems much smaller than the lower. Maybe opening the upper part by bringing the serif out would do it.<br>
      - Maybe a little 'leg' on the 'G' would work here. It's now completely round in the bottom. You could than make the inner serif a bit smaller, what would open the 'G' more.</p>
      <p>BOTH<br>
      - the dot on the 'i' bigger. It seems much smaller than the comma. The same goes for the ; : </p>
      <p>This font should be balanced disharmony so don't loose too much of the irregularities. </p>
      <p>®</p>
