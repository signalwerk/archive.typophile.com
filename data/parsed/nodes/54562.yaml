      <p>My personal experience is that if you use anything other than Times New Roman or Palatino, university professors will give you a lower mark and make comments about your style choices. They are suspicious that the different aesthetic of other fonts is the student trying to cover up a lack of quality research. And since they none of them actually have enough time to read your paper from beginning to end, they have <em> no choice</em> but to assume that there is something wrong with your paper. I'm dead serious about this.</p>
      <p>If you <em>really</em> want an alternative font that your professors won't get suspicious about, try using Monotype Baskerville. That's about as far as you should go.</p>
    html_clean: |-
