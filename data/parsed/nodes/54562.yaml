      <p>Why do you assume I got these comments after I told them it was my font? I'm talking about (a) getting written comments on papers from profs who don't know this, and (b) differences on the marks of papers of similar quality with different fonts. Anyway, I don't mean to derail the conversation, here. I was just trying to give some advice based on my experience. I've also received similar comments when using one of the new cleartype fonts; I think it was Constantia. When a prof says "use 12pt Times or equivalent" they mean use a standard windows text font. This might well be different in a design program, or at other universities.</p>
