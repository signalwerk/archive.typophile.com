      <p>Here are a few of the many differences between the two cuts. One of the biggest is that the "F" is substantially narrower in TNR. TNR has sharper serifs in general. TNR has vertical serifs on the S, TR's are angled. TNR has a K in which the arm and the leg join the stem in a V, while TR's K leg sprouts off the arm. Ascender serifs are at a flatter angle in TR, and cut off vertically instead of at an angle as they are in TNR. The "t" has a bunch of features cut off at right angles in TNR, which are angled in TR.</p>
      <p>Cheers,</p>
      <p>T</p>
