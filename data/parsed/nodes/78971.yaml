      <p>Ah, so I was wrong about that part of it.</p>
      <p>In that case, setting screen resolution to be an effective 96 ppi on the computer running Photoshop should solve the problem, if the problem was what I thought it was.</p>
      <p>Of course, in that case, a browser obeying the CSS specs is no longer screen resolution independent, so it could now be in violation of the interface specifications of the manufacturer of the operating system. Since Mozilla Firefox is something you download for free, I'm not sure if the people at Mozilla <em>care</em> about the right to put the "Designed for Windows 7" logo on their nonexistent boxes... but this must cause feelings of angst among someone involved with Internet Explorer.</p>
