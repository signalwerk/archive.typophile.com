      <p>Short incorrect awsers, that i can understand. Long-wined ones, are such a marvelous mystery. </p>
      <p>Windows defaults to 96 pixels per something and most users never change that. Mac is 72 per something. This supposedly due to windows users sitting farther from the screen than mac users, (really!)  Besides that, fonts are sized to be larger or smaller on the em for a variety of reasons. Assuming the size specified in CSS is the same, both in value and in the units used to describe size for two fonts, Photoshop should give an accurate preview of what proportions two fonts have to each other on or off the web. </p>
      <p>Don't blame your web designer though. This issue is so problematic, along side line spacing, letterspacing and other variations windows browsers add to the stew, that most web design with live type is doomed to loose specification, and thus loose design if it can be made to work at all. This is why publications who depend on tight consistent design the user cannot undo, only really appear on the iPad.</p>
