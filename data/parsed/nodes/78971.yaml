      <p>Never use 'font size="-1"' in the HTML tags, define this in the CSS:</p>
      <p><code>p {<br>
        font-family: Tahoma, sans-serif;<br>
        font-size: 14px;<br>
      }</code></p>
      <p>This will style all the p tags in your HTML with 14px Tahoma, and where Tahoma is not present (for example on the iPad or on Android systems) it will use the standard sans-serif in those systems instead (and most are not as narrow as Tahoma, and might not share it’s x-height — 14px might look bigger or smaller in a fallback font). The font size can be specified in px’s (pixels), em’s or percents, the former being the most static as it only relates to the ppi of the screen. Depending on rendering engine in the end users OS and web browser and the design and hinting of the font, letters may appear with slight differences in width and height.</p>
      <p>Mocking up in Photoshop is well and good, but a serious web designer <em>should</em> have some understanding of how the web works.</p>
