    <p>I have had the developer tell me that there is a difference in pixel sizes for fonts.</p>
    <p>I used DIN as primary font and then secondary to use Tahoma.</p>
    <p>However on Tahoma, the font sizes are huge compared to DIN.<br>
    They looked fine when I mocked them up on Photoshop, its not the case on the web.</p>
    <p>Is this true? I find it hard to believe and also for future projects how do I test this properly before showing to the client? I have had so many problems with the size difference. I also think the developer may be trying to worm his way out of his past mistakes but I need some confirmation first from other developers on this board if any.</p>
    <p>Basically the Tahoma font looks like 20pt size compared to a 14pt size for DIN. If anyone can answer me as to why I can learn something important for today :D</p>
    <p>Thanks in advance!!!</p>
