  html: <p><a href="http://www.edp.pt" target="_blank"> EDP</a> is the portuguese electricity company that presented today it's new Identity where joins Natural Gaz + Electricity and gets a brand new band designed by MY BRAND. <br> <br>According to the company after a series of clients survey, they considered the old identity as "distant" &amp; "Abusive" (BLUE LOGO BELOW).  <br> <br>The new Identity is described as "A smile looking for CLOSENESS". <br> <br><img src="http://www.typophile.com/forums/messages/4100/41045.gif" alt=""> <br> <br>What do the typophiles think? The change of a turbine for a smile is a radical shift, but on my oppinion the "smile on a house light switch" with the VAG Rounded Bold fails on giving the strong and secure group this group has. This brand and this type could be on a candy bar... </p>
  html_clean: <p><a href="http://www.edp.pt" target="_blank" class="link-external"> EDP</a> is the portuguese electricity company that presented today it's new Identity where joins Natural Gaz + Electricity and gets a brand new band designed by MY BRAND. <br> <br>According to the company after a series of clients survey, they considered the old identity as "distant" &amp; "Abusive" (BLUE LOGO BELOW).  <br> <br>The new Identity is described as "A smile looking for CLOSENESS". <br> <br><img src="http://www.typophile.com/forums/messages/4100/41045.gif" alt=""> <br> <br>What do the typophiles think? The change of a turbine for a smile is a radical shift, but on my oppinion the "smile on a house light switch" with the VAG Rounded Bold fails on giving the strong and secure group this group has. This brand and this type could be on a candy bar... </p>
