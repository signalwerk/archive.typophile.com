    html: |-
      <p>Mystery solved, Mike, and thanks. 'Flanders' is indeed 'Flange' (or a version thereof), and also, I believe, the font used for The Godfather (I) English subtitles. One of its notable characteristics is the open, informal, lower-case 'g' - most of the similar glyphic fonts have the closed-loop 'g'. Flanders, lower-case open 'g' and all, was one of the many fonts included on the FontSite CD, which I got years ago because it was then the sole source for 'Legende' (their redaction being called 'Legend'). I bought the excellent Bitstream Cambridge Collection similarly to acquire one typeface, 'Venetian 301', which I consider a better-looking digitalization of 'Centaur'  than Monotype's. Anyway, I was curious about 'Flanders', and spent several sessions and some time searching for likely fonts with similar-sounding names (Fontsite's naming practice being roughly homophonic), but never turned up 'Flange', and never saw it in use until I happened to watched ' The Godfather'.</p>
      <p>The Fontsite CD had one great virtue, an introduction to Hans Eduard Meier's splendid but strangely obscure 'Barbedor', which I subsequently acquired elsewhere.</p>
