  html: <p>I watched The Godfather (part I) last night. I'd like to identify the typeface used on screen to supply English translations for the dialogue in Sicilian (not the familiar title font, as also seen on 'The Godfather' book covers). Unfortunately, I don't have a screen grab. The typeface I'm looking for somewhat resembles Baker Signet or Albertus, more closely resembles what I suspect is a copycat font called 'Flanders'. I couldn't turn anything up on Google except the the title font, not what I'm looking for. Does anybody know what I'm talking about?</p>
