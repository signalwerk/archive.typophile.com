      <p>Hi umily</p>
      <p>It is nice to see that i am not the only one who is strugling to find info on univers (see other posts in the design forum).</p>
      <p>Here are some of the quotes that i have come accross;</p>
      <p>“Univers expressed a ... cool elegance” - Freidrich Fridel<br>
      “The seperate fonts [of univers] were like modules of a whole” - Freidrich Fridel<br>
      “Univers is an epochal pevelopment” - Emil Ruder<br>
      “Univers was the typeface of the 50’s” - A.Frutiger<br>
      “Univers is absolutley perfect” - Friedrich Fridel<br>
      “Helvetica: Frankly i never liked it that much... Univers and Akzidenz Grotesk both have more charecter” - Fritz Gottschallk</p>
      <p>Wil</p>
