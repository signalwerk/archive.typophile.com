    <p>Hi everyone, I too am looking for information on Univers... I’m looking for quotes from well known designers about Univers, both positive and negative and comparing it to other fonts. I would particularly love info about specific letters. For instance in the 1957 version the ampersand is pretty hideous but in the later linotype version it has been changed into the more traditional &amp; style...<br>
    Can anyone help? Thank you so much!</p>
