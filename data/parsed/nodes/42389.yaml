      <p>I use Bitstream’s Zurich, aka Univers, to get that old ampersand. It’s been replaced in the versions sold to Americans ever since the original releases. It seems to have a better feel all around, warmer in the way a tube amplifier compares to a transistor amplifier. </p>
      <p>Anyway, as for getting quotes, dig through Swiss design books starting with the early 1960s. Univers was not all available in 1957, it took a few years for Deberny &amp; Peignot and Monotype to get all the weights drawn, printers to buy it, and people to start using it.</p>
