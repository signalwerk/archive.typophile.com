  html: "<p>I was really happy with the identification of the Escape from NY font, so I thought I'd request an ID on another movie title font that's been bugging me. <br> <br>This is the font for the movie now (wouldn't mind having this IDed as well if possible, thanks): <br><img src=\"http://www.typophile.com/forums/messages/83/65965.jpg\" alt=\"Current Font\"> <br> <br>But, this one is the original font used on teaser posters and the like. It was not used in the final promotion of the release. I think it was something to do with the font being too middle-eastern looking, and the film being released shortly after 9/11. This is the font that's been bugging me and I will be absolutely stoked if anyone can ID it. (*stoked* being an Australian slang term - in other words, I'll be pretty pleased). <br><img src=\"http://www.typophile.com/forums/messages/83/65966.jpg\" alt=\"Original Font\"> <br> <br>Any help in identifying these fonts would be greatly appreciated. Thank you!</p>"
