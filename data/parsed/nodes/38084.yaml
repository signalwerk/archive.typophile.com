    <p>The Languages at a glance project took a step forward today. You can now download the compiled and regularized lists of test words in:</p>
    <p>- Basque<br>
    - Latin<br>
    - Danish<br>
    - Dutch<br>
    - English<br>
    - Finnish<br>
    - French<br>
    - German<br>
    - Hungarian<br>
    - Icelandic<br>
    - Italian<br>
    - Lingala<br>
    - Norwegian<br>
    - Polish<br>
    - Portuguese<br>
    - Slovenian<br>
    - Spanish<br>
    - Swahili<br>
    - Swedish<br>
    - Turkish</p>
    <p>It’s free. Try it and let me know what you think.</p>
    <p><a href="http://typophile.com/node/31399" title="http://typophile.com/node/31399">http://typophile.com/node/31399</a></p>
