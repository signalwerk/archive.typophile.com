      <p>I think this means changing cornerpoints to smoothpoints all around. There might be scripts for Illustrator that do this. Surf to Adobe Exchange:</p>
      <p><a href="http://www.adobe.com/cfusion/exchange/index.cfm?event=productHome&amp;exc=17&amp;loc=en_us" title="http://www.adobe.com/cfusion/exchange/index.cfm?event=productHome&amp;exc=17&amp;loc=en_us">http://www.adobe.com/cfusion/exchange/index.cfm?event=productHome&amp;exc=17...</a></p>
      <p>Edit: This looks promising: SuperEllipse script —<br>
      <a href="http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&amp;loc=en_us&amp;extid=1045363" title="http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&amp;loc=en_us&amp;extid=1045363">http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&amp;lo...</a></p>
      <p>And then there’s this plug-in PointControl, that has a feature “Make Points Curves or Corners - Converts selected points on any number of paths to corner or curve points but does not change current handle position.”:<br>
      <a href="http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&amp;loc=en_us&amp;extid=1045874" title="http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&amp;loc=en_us&amp;extid=1045874">http://www.adobe.com/cfusion/exchange/index.cfm?event=extensionDetail&amp;lo...</a></p>
      <p>. . .<br>
      Bert Vanderveen BNO</p>
