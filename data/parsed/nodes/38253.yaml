    html: <p>What did you do so far, convert corner points to curve points? Now you probably just need to pull the handles out farther from each node until you achieve the desired shape. I’m just starting to learn the ropes of this program (lot of ropes!). Seasoned users may have some better techniques. Sounds like what you’re after is a wonky circle.</p>
