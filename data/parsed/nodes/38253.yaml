    date_raw: 23.Oct.2007 6.28am
    votes: null
    html: |-
      <p>If you want the TV shape I would suggest smooth points at the sides and top/bottom, and corner points in the corners. If the latter are too sharp, change to smooth points with the control points very close to the point.</p>
      <p>I doubt you will find a filter for this, but you should be able to do a decent job with a lot of guides to align your control points correctly.</p>
