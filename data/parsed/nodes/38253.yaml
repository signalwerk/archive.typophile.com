    html: |-
      <p>imagine a stretched 8-gon, 12-gon, or 16-gon or any n-gon. now try to round that polygon in illustrator to create a perfectly rounded “O”, similar to a condensed font “O”. the resulting “O” won’t look like a stretched circle (ellipse), it will look like a rectangled circle -  that vintage TV screen shape. I couldn’t find a way to do this neither in Illustrator nor in FontLab.</p>
      <p>I could pull the handles but the resulting rounded shape has to be regular (symetrical). that means we need some kind of automated function to create a rounded shape out of a an angled one, or at least appropriate grid snapping. </p>
      <p>After rounding, the corner points should remain at their original coordinates, as well.</p>
