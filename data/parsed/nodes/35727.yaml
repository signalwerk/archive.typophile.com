      <p>Arjen, I don't think it's that complicated.</p>
      <p>On the one hand, it's required that family members should share one or more interpolable dimensions (vertical metrics, stroke contrast, and stem width are most obvious). Horizontal proportion can't be measured quite so accurately, but "eyeballing" the similarity works fine.<br>
      On the other hand, if the requirement of a shared interpolable dimension is met, then if the foundry says it's a family, it is.</p>
      <p>The oeuvre of certain type designers, such as Gerard Unger or Eric Gill, contains many physical congruencies that satisfy the first stipulation for widespread family grouping, but ultimately unless the fonts are <em>published</em> as a family, they aren't.</p>
      <p>The "genetic" metaphor is off, because unlike the biological world, in type different generations of the same typeface are not considered to be part of the same family. </p>
      <p>A social metaphor for family may be be more correct; sharing the same household.</p>
