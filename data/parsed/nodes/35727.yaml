      <p>I never said he did.</p>
      <p><em>Size-opt doesn’t sell, therefore, it’s ultimately of little interest to manufacturers</em></p>
      <p>Actually, "size-opt" is of great interest to manufacturers, especially if their font development model involves serifed types for newspapers and magazines. Think H&amp;FJ, FB, Peter Bilak's Greta, or Josh Darden's Freight. And then there's Robert Slimbach's neo-renaissance types for Adobe -- Garamond, Garamond, Minion, Jenson, and Arno.</p>
      <p>In my experience as a manufacturer, "size-opt" is a good product, (a) because it sells, and (b) because it doesn't take a huge amount of work to extend optical weights (Bold Italic is far more trouble). I've made optical variants of a variety of types -- usually one size sells better than another, but it's hard to predict which it will be.</p>
