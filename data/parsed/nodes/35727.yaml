      <p><em>Your motives are transparently self-serving: self advertisement. A blog is not the best place to do that kind of thing so blatantly, because you are bound to get slagged.</em></p>
      <p>Bill, you can misrepresent me and threaten me with further abuse, but I'll continue to discuss the topic of this or any other thread with reference to my own work.  </p>
      <p>**</p>
      <p>The term "cultural axis" is a serious answer to Peter's question about the Splendid family -- as well as sharing common physical qualities such as x-height, sharpness, and high contrast, they are joined by a "cultural axis": a place, a time. Another cultural axis is that they are being marketed as a package -- present day technological and economic considerations are involved in that (sorry, bit of a circular argument). Implicit too is the understanding that these kinds of faces are often used together, again, a cultural understanding of genre. But was the Splendid concept successful? Have art directors produced layouts with three or four of these fonts together on the same page?</p>
      <p>The issue here: although non-interpolatable styles may be part of the same family, is it more a conceptual or taxonomic kinship than a functional one? To what extent do typographers create layouts using both the sans and serif versions of a typeface? How much contrast is enough? As an art director, the only time I've used sans/serif contrast within a family, sort of, was combining with Perpetua and Gill Sans.</p>
      <p>In her talk on Morris Benton at TypeCon, Juliet Shen noted that his Clearface types -- the serif and the sans  -- were closely related physically, and placed a few pages apart in the same section of the 1923 ATF catalog. So the relationship ATF presented was a bit vague and unrealized, in terms of physical kinship, marketability, and usability (they were not shown in the same faux layout).</p>
