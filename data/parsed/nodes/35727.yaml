      <p>OK, but what is the original idea?</p>
      <p>&gt;Why are typefaces related?<br>
      Maybe because the designer says so!&lt;</p>
      <p>I agree with this, because it implies that relationship does not have to be measurable or obvious. </p>
      <p>When you say, what is the relationship between the humanist miniscule and the humanist italic, I take that what you're saying is, there isn't any. Indeed there isn't. After a lifetime of designing chancery italics to fit his romans, van Krimpen admitted it was a mistake. </p>
      <p>In Scala, the relationships between sans and serif and weights are obvious, but where it falls apart completely is in the relationship between roman and italic, which is poor. Although it is one of the most attractive typefaces of the 1990s, one must admit that the italic is slanted too much and is neither particularly readable nor particularly harmonious with the roman. Indeed it almost seems arbitrary. I have always thought the chancery-ish italic of a contemporary typeface, Minion, was inept.</p>
      <p>Yet, as we know, highly related italics (i.e. slanted romans) don't work. So the talk of relationship is rather bogus.</p>
      <p>So we come back to:</p>
      <p>&gt;Why are typefaces related?<br>
      Maybe because the designer says so!&lt;</p>
      <p>And all the rest is just hot air.</p>
      <p>But was this what you meant?</p>
