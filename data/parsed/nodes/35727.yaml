      <p><em>formal parameters</em></p>
      <p>These may be considered "design axes", an idea introduced to explain Multiple Masters.<br>
      This kind of interpolation derives, conceptually, from the Knuth metafont, and is "codified" in the Univers numbering system.<br>
      Carl Crossgrove's Relic, with its sober/inebriated axis, is an unusually conceived formal dimension, but really there is so much scope for imagination -- you can morph between all kinds of formal qualities with software like Superpolator: x-height, extender length, etc.</p>
      <p>"Slant" is a paradoxical design axis, because in modern fonts it can indeed be varied incremementally in a purely formal slider-bar way, but in old styles it exists as an abrupt binary switch between quite topologically disparate roman/italic forms, or perhaps a three-parter (Auto, etc.)<br>
      I have termed these Cultural Axes, as the perception of a meaningfgul relationship between the poles/instances depends on a cultural awareness or knowledge.<br>
      Both formal and cultural design axes can be the basis of extended families, although in large OpenType fonts such as Hypatia, these may be subsumed within a single font as Stylistic Alternates.</p>
      <p>The Globe and Mail fonts I recently designed leverage a cultural axis. GM News and GM Sans share x-height, extender length, stroke widths, some cheirographically informed joints, and general horizontal proportions, but the two alternates are conceived as the poles of a Humanist/Modernist axis. GM News is "some serifs" and old-style, whereas GM Sans is plain and modern. In the newspaper, the two variants are used in a variety of ways, e.g.<br>
      - For text emphasis, highlighting a word in a headline;<br>
      - For immediate layout contrast, as when a GM Sans overhead sits above a GM News headline; the most interesting of these is the contrast between a GM News italic (6 degree slant, classic old-style letter shapes) and GM Sans (10 degrees, a slanted version of the Roman);<br>
      - At the document level: GM News is the headline face in the news sections, GM Sans in the feature sections.</p>
