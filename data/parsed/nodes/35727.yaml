      <p>Peter, when you write of Storm's trivial Splendida family </p>
      <p>&gt;I thought of something like Storm’s Splendid, but there I cannot trace what is it that links these four separate fonts into one family.&lt;</p>
      <p>aren't you in essence saying that you have discovered you might be asking the wrong question?</p>
      <p>There is no relationship there; it is a frivolous, poorly-conceived gimmick == that I hope for Storm's sake sells well. In fact, let's for once be brutally honest. There is a relationship: it's called type fatigue. He's done too much.</p>
      <p>What would be more interesting to explore is the question whether formal relation (between for example sans and serif) is desirable or not. This is far from established. There is a lot of hype based on the aesthetically unproven assumption that a formally related sans and serif are desirable. [Really? Contrast does not exist as a beneficial force in art since cave drawings?] Clearly, a lot of this is hype and simply not to be taken seriously in a serious study. It is as bad as the assumption (which I have never found to be the case) that there exists, anywhere, a designer who is equally good at designing serif and sans serif type. I am speaking of course only about the very highest level of endeavour.</p>
      <p>Every effort to form an italic from roman models has proved disastrous in the end. The best illustration is the very first integrated type family, Romulus. The ideal italic is not formally related to a roman; it is above all a contrasting element. Why should this not be true also of the sans serif that might be used in contiguous composition? That leaves the bold - - - the late 19th century bolds were not slavish replicas of romans but simply darker types that happened to work acceptably and agreeably with romans. I see no reason why this should not work today. I would even go so far as to say that it is more important to have a well-designed, well-implemented bold than to have a bold that is closely, literally formally related to the roman.</p>
      <p>There is an impulse in these kinds of discussion that I deeply distrust. That impulse is the one that seeks to find a basis for type in some art or graphic theory. For me, it must always start at the functional level of the reader and the act of reading.</p>
      <p>As everyone who has ever made a sans from a roman knows, you can't stick to the formal recipe blindly. That's because, as you see at once,</p>
      <p>_a Sans Serif has a vernacular of its own_</p>
      <p>and that is different from the vernacular of a serif typeface</p>
      <p>just as the vernacular of italic is different from the vernacular of roman</p>
      <p>Trying to impose unity on a family of types is to deny and disrespect that each constituent of a type family may have a vernacular and vernacular associations which should be honoured.</p>
      <p>At any rate, that's a possible argument.</p>
