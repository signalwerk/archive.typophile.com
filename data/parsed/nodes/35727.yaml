      <p>Peter,<br>
      Other than the bold and regular didone pair, neither do I see the link. I am quite intrigued by the concept you stated though. Typically, families are weight, slant, and width variants with common features. The italic is less family like out of the need to be distinguished in text. That is all simple stuff and done many times. Even making a serif and sans family fulfills some corporate need for commonality of brand. Again, there are plenty of these in recent years. The intriguing thing to me is your hint of purpose in mood or tone set by the family variants. I have not seen this exactly yet. The closest thing might be Thomas's recent Hypatia but this is stylistic sets within a single font weight rather than different fonts in a family.<br>
