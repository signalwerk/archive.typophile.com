  html: |-
    <p>I am writing an article on <a href="/wiki/family" class="freelinking" rel="nofollow">type families</a>; and for this purpose I am looking for type families which are related not simply by one or more varying formal parameters (width, weight, optical scale) but by some other attributes. </p>
    <p>I thought of something like Storm's Splendid, but there I cannot trace what is it that links these four separate fonts into one family.<br>
    <a href="http://www.stormtype.com/typefaces-fonts-shop/families-45-splendid" title="http://www.stormtype.com/typefaces-fonts-shop/families-45-splendid">http://www.stormtype.com/typefaces-fonts-shop/families-45-splendid</a></p>
    <p>I know of many students' projects which play with an idea of 'character' or 'humour' of typefaces as a parameter that connects separate typefaces into one, but I haven't seen any published typefaces doing this in an intelligent way. Do you happen to know any published examples? </p>
    <p>A separate question: Do you know when the term type family was coined, and first instance when it was used?</p>
    <p>Yours, Peter Bilak</p>
