      <p>&gt;I searched for the feature I read about and I found it. Strangely enough, Peter Bilak interviewed Martin Majoor (feb. 2003) and you can read it here: <a href="http://www.typotheque.com/articles/interview_martin_majoor.html" title="http://www.typotheque.com/articles/interview_martin_majoor.html">http://www.typotheque.com/articles/interview_martin_majoor.html</a>. The part I’m reffering to is: Small capitals come from an old tradition, but designing something like Scala Sans Italic Caps was not done before.&lt;</p>
      <p>This transparently self-serving article by Majoor is factually incorrect. But let's take just the points you apparently took from it. First of all you wrote that italic small caps did not exist before the 1990s. This is completely untrue. They have a long history. </p>
      <p>Then you wrote that sans serif small caps were not available before Scala. This is equally untrue. The first sans serif superfamily, explicitly containing every possible feature, was Today, as Majoor perfectly well knows. The other thing to keep in mind of course is that in metal you don't need an explicit small caps weight because you can usually use the caps of a couple of sizes smaller, and because of the optical reproportioning, they will have the correct appearance.</p>
      <p>Speaking of optical reproportioning, Today has two optical sizes, Scala has only one, so it is still behind the curve. </p>
      <p>Now, further to test some of Majoor's claims about Scala, do yourself a favour. Set some paragraphs in Scala, and make sure you have plenty of instances of words set between the right and left single quotation marks. Things like 'this', etc. -- the kind of thing you often find in the kind of museum catalogues that Scala is often used for, in fact. Find out what is wrong with these sentences, and find out why it is wrong, which will require a little detective work. Hmmmm. A lot of thought went into making that mistake -- which I think may be unique in type history.</p>
      <p>'It is my conviction that you cannot be a good type designer if you are not a book typographer. I am not talking here about display types but about text types. A type designer must know how type works in a piece of text, he must know what happens with the type on different sorts of paper, he must know how a typeface behaves with different printing techniques.'</p>
      <p>You can say that again, Martin!</p>
