      <p>I'm presently planning on setting a version of a close friend's dissertation (she's getting her PhD on Saturday yay!), and then getting one of the book arts MFA students at my undergrad alma mater to bind it once printed.  Unfortunately, until I'm done with my thesis I can't put in a lot of hardcore work on the font, and only get a character or two done every here and there as of late.  But, the sample layouts I've done so far have the serif version for the body text, and of course italic as necessary.  For captions and footnotes, the sans version is being used.  This isn't too unlike a lot of journal style guidelines, where all figures and their captions must use sans-serif fonts.  I doubt I'll use the fraktur variant for the book though.</p>
      <p>One practical use for a font like hrant's (He normally posts rabidly on here, but on another thread someone said he's on vacation or something like that) would be for setting Faulkner's The Sound and the Fury.  If you've read it, you'll rememmber that flashbacks/forwards were designated only by italicising the text.  This was not the original way that Faulkner intended, rather, he wanted the different time switches to be represented by type setting that entire passage in a different colour.  But, with many pages needing then three+ colours, for novel, it was considered too pricey at the time.  (The only novel I can think of off the top of my head with a multi-colour printing in that style is House of Leaves, where the most commonly available edition prints the word "house" in blue, all certain passages in red.  The "full version" also has parts in purple and (!) braille.)  However, one could design a series of faces in the vein of Daam and have a different way of signally the transitions betwixt times, basing them off of the different feelings the narrators had on them.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
