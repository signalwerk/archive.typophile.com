      <p><em>Yesterday I removed some of my posts, because it lead to "off-topic" discussions about the quality of some typefaces.</em><br>
      I have tried to turn Peters' question around and asked myself: What determines that types are NOT "family"? If typefaces, which don't have the same name, can they still be related? Is there another way of looking at "family-relations"?</p>
      <p>If you look at several different typefaces from the same typedesigner, you can see some similarity. One can recognise types drawn by Luc[as] de Groot (compare Corpid and Thesis) . The designers' role is important, I think.</p>
      <p>Another thing about family-relations has to do with 'derivation'. (I used an online translator for this word) Many designers talk about influences, inspiration or "based upon...". Every typeface is based upon its predecessors or certain elements from an ancient face are re-used in modern types. It's allmost like there is some family-tree which passes on "type-genes" onto the next generation.</p>
      <p>Example: Different versions of Garamond are based upon the same "genetic code" which lies in the orginal Garamond (15th century). Still they look pretty different (they have mutated?)</p>
      <p>Other example: In FF Legato Evert Bloemsma used characteristics from traditional faces (like Bembo, Garamond and Lexicon) and reused the diagonal contrast in a sans-serif to improve readability.<br>
      <cite>On the micro level of typography a typedesigner can be challenged by the idea to (re)connect, at least optically and to some extend, the single units of our script into ‘whole’ words**. Most typedesigners are aware of this but at the same time there has always been a strong tendency to build rhythms of thick vertical stems. Not only since Bodoni was drawn in the eighteenth century but even already in the Middle Ages when books were handwritten ( below). This might be a consequent expression of the concept of our alphabet and culture (splitting things up into units and building uniform patterns and sequences) but too much stress here isn’t nice (to read).<br>
      <em>(Originally from evertbloemsma.nl, but the website is offline)</em><br>
      </cite></p>
      <p>Is it possible to detemine the "genetic markers" in typedesign? </p>
      <p><em>P.S. English is not my native language and therefore some phrases might look weird. </em></p>
