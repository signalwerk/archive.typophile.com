      <p>So what are the better and worse sloped romans? </p>
      <p>What is the ideal italic and for what purpose? </p>
      <p>Let's not consider the case of the beautiful italic in which long passages, usually of poetry, are set, but rather the case of the italic used for the very occasional word of emphasis.</p>
      <p>I take as a test an Iris Murdoch novel. She rather overuses her italics, but they occur at moments of great stress in high pitch reasonably contemporary situations. Baskerville is not the kind of thing you want here; neither is Garamond or Scotch. They're all too florid. Instead of seeming intense, the emphasized word seems silly -- in Murdoch. (of all the most conventional choices, pre-Porchez Sabon is the best)</p>
      <p>The kind of inconspicuous not too cursive, not too humanist, not too anything italic that Carter designed for Charter seems to me a good model here. </p>
      <p>I also must say that if italic is only being used very occasionally, I can't really object to sloped romans in sans serifs, but I have never been comfortable with the sloped serif italics that I know. Stone Cycles is another case where it just works for me. If it's a case of setting a book, then I'm likely going to go for a Stone or Matthew Carter face, regardless of other considerations, because I know the fonts will actually work..</p>
