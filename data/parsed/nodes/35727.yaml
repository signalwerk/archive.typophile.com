      <p>Yes Bill, my post does inadvertently give the impression that the Metafont came before Univers, but do you really think I didn't know the right sequence, or do you just like to put people down so that you can show off how smart you are?</p>
      <p><em>'...without suggesting pictorial depth, which is what happens with stroke contrast’ (somehow Bodoni’s pages are ’pictorially deep’ whilst Calson’s are not?)</em></p>
      <p>Caslon's types are not without stroke contrast. The distinction I'm making is between serifed faces with stroke contrast, and sans serif faces that are nominally monolinear. Modernist page layouts are typically the Swiss or International Style of layout, not something involving Didone faces.<br>
      The challenge in the Globe was to handle a multi-element hierarchy in a modernist layout; usually in newspapers, that complexity is organized around contrasting sans types with serif types, but serif types undermine the flat graphic quality of the modernist layout. The solution was to use all sans display type, with contrast between stylistic variants of the same sans face -- "some serifs" (humanist) and plain (geometric).<br>
      As you say, "it must always start at the functional level of the reader", and that provided the impetus and the context for those stylistic variants.</p>
      <p><em>I find a little too light.</em></p>
      <p>If not a "cultural" design axis, how then would you describe, with suitable gravitas, non-interpolatable relationships between typeface family members? After all, that is the theme of this thread -- Peter wants to know about "some other attributes". It's a little too easy to dismiss them and say that roman-italic and regular-bold contrasts are enough.<br>
      Chalet, for instance, with its New York-Paris-Tokyo styles.<br>
      Auto, with its "unexplored palette" of three different italics.<br>
      Eunoia, with its Deco/Op Art/Techno era-related versions of a condensed, high-contrast sans.<br>
      Lisboa, with its plain and neo-humanist variants.</p>
      <p>How are these different than the "Serial" families mentioned in Alejandro Lo Celso's Type Culture essay, such as Thesis?</p>
