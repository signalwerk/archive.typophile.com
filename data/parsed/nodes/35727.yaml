      <p>Eben,<br>
      <em>This is a very fast and general summary:</em><br>
      Traditional faces, like Bembo have diagonal contrast. In sense this connects the individual letters and creates "better" word-images (NL:woordbeelden) which improve readabiltiy and/or legibillity.<br>
      This has (for as far as I know) not been seriously used in sanserifs. Evert mentions some typefaces which have such feature, but they are "overdone". </p>
      <p>The point I wanted to make, but Nick corrected me allready and I believe he's right: Different sources of inspiration could been seen as "fathers" and "mothers" of a new typeface. The carry the genes of their predesesscors (?). Because the influence of the designer is so big, this aspect of being a family is not suitable for type.</p>
      <p>I'm not sure if I said it correctly...</p>
