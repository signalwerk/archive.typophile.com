      <p>&gt;Yes Bill, my post does inadvertently give the impression that the Metafont came before Univers, but do you really think I didn’t know that, or do you just like to put people down so that you can show off how smart you are?&lt;</p>
      <p>Nick, I don't think I am smart, but I do have a reasonable grasp of basic typographical facts, and I do think before I write. </p>
      <p>Of course I thought you 'didn't know that'. It's the only conclusion one can come to from what you have written. If you don't want people to think you are an idiot, think before you write! You're taking up precious minutes in the day of every one of the hundreds who read your posts. Don't you think it's perhaps worth a few minutes of reflection to make sure you don't write the opposite of what you mean? That what you _do_ write is actually worth reading? </p>
      <p>&gt;how then would you describe, with suitable gravitas, non-interpolatable relationships between typeface family members?&lt;</p>
      <p>I wouldn't. None of your exemplars merit gravitas-containing bandwidth, which is always in short supply. All you are doing here is devaluing the meaning of gravitas itself. You are using it like an ad-man. Your motives are transparently self-serving: self advertisement. A blog is not the best place to do that kind of thing so blatantly, because you are bound to get slagged. Save it for your client presentations.</p>
      <p>The only way you can get away with this kind of thing on a blog is to say, 'Folks, here's a script I'm going to try on a really naive client. How do you think it'll run? What can I do to improve it?'</p>
      <p>You don't have to worry about the client seeing the post. The client who buys that kind of hype probably doesn't read type blogs.</p>
      <p>In the meantime has anyone got anything serious to say about Peter's original question? It seems he is not going to have an easy time writing this article. It looks like the one historically important designer who tried to conceptualize a wide-ranging type family was van Krimpen, and further, that it was most notably a failure in several respects. Of the two italics, one couldn't be set, and the other couldn't be stood. The sans experiments weren't successful either. It strikes me as significant that this is a subject very little discussed by the older generation of type designers -- those who really know how to design type -- such as Stone, Carter, Unger, Zapf, Frutiger, etc. It's also significant that there is no attempt in Font Bureau's ambitious Poynter family to embrace this kind of light aesthetospeak. I am almost ready to dismiss the talk of relationships as pure salesmanship. </p>
      <p>Oh, for a milligram of gravitas!</p>
