      <p><em>What’s wrong with the previously-used word, style?</em></p>
      <p>There's not much wrong with it, and it is used in OpenType -- Stylistic Sets.<br>
      But "style" has a lot of meanings, and is thus vague.<br>
      The advantage of using the term "design axis" is that its focus serves to distinguish interpolable relationships from non-interpolable, which is the whole point of this exercise.<br>
      As you have noted with Today, weight is a design axis that may often be non-interpolable. In this respect, Times Roman is similar, and many Didone Italics have median serifs that are hooked in the regular weight, but flat in the bold weight.</p>
      <p>Working on the modern/oldstyle versions of the Globe sans types, I found that what I was doing, for the purpose of adequate differentiation, was trying to drive the styles as far apart as possible, to the poles of their relationship, as it were -- so this too suggested that the relationship was axial.<br>
      And within this major modern/oldstyle axis, I found there were sub-axes; for instance horizontal proportion -- varied in the oldstyle, more equal in the modern; terminal treatment -- angled and slightly bent in the oldstyle, straight and perpendicualr in the modern; joint style -- pronounced in the oldstyle, neat in the modern. In each of these "parts of speech" of the design grammar, I had the option of varying the amount of difference between the two polarities.</p>
      <p>Here's something from 1938, "The following Alternate Characters are put up in separate fonts at quoted prices and when used with Series No. 140, shown on preceding page, gives a very pleasing effect."<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Tourist_3546.jpg"></div><p></p>
