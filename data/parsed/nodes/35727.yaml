      <p>Nick, the illustration is really interesting, can you tell us more about it, the foundry, the seller, the book? Is this an old Sol Hess design? I hate to say it, but I see here a possible genesis for the alternate characters in what is surely one of the most original of all typefaces, Renner's Steile Futura. How could <em>anything</em> in Steile come from such an undistinguished source? Yet it seems inferentially to be the case. Oh, this is awful! Similarly, some of the most admirable of Zapf's and Frutiger's ideas can be found in Goudy, in pre-war German types, etc. etc.</p>
      <p>Nevertheless, I wouldn't call them an axis or a design axis. What I resent about broadening the term is that it was invented by Adobe (if it really was invented by Adobe -- I would want to check this) to mean a very specific thing. I think we should respect that specific thing, and come up with a different term if style is inadequate. I can see why you are unhappy with style, or with some variant thereof, such as 'integrated style'; I can see the need for an extension of the terminology -- not, necessarily, as far as the type world goes, but as far as the type to management world goes. Isn't there some better way of talking about this? </p>
      <p>That said, what is interpolable? The very first Adobe MM with an intermediate master was ITC Garamond MM, which had one character which was not interpolable across the 'design axis' (is that a correct usage according to my admittedly inept but well-meant plea?) which required the intermediate master. </p>
      <p>A definition of a font axis which meant only an 'Adobe MM interpolable axis' would therefore still not be completely simple. It wouldn't be linear -- although non-linear interpolation may not have been considered practical at the time these terms were being dreamed up. But, as we know, the Adobe model is incredibly simplistic; we have gone far beyond that conceptually. So what are axes? </p>
      <p>I would vote that an axis should be something that is either literally linear or very near linear. Some other term is necessary. Is 'design space' the term we use for the totality of the design? The sum of the axes? </p>
      <p>Here's where style should not be extended, obviously as I had naively originally proposed. For example, we can speak of the design space, the axes, of Minion Roman. The design space, the axes, of Minion Italic are something quite different.</p>
      <p>So, for elements within a design space that are not axes -- what are they? That's supposing that you are going to limit 'design space' to the classic Adobespeak.</p>
