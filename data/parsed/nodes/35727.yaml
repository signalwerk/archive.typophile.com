      <p>&gt;I think sloped romans may ’grow’ in the same way.</p>
      <p>Most important point. Taste and perception are never stationary; everyone changes over time. What seemed impossibly crude 20 yrs ago might seem merely functional today. When I first talked to Lino in 1995 about reviving Pilgrim, Bruno didn't want the rather nice modified slanted roman, but a completely new, cursive italic, as was the hot fashion of the minute. By 2005, when I was beginning to get serious about it again, the modified slanted roman looked  really cool to Bruno and anything else would be ridiculous.</p>
      <p>One man, evolution of taste over a short period. But there are lots of subtle things we can do to make slanted romans better. I have got to the point of calling cursive italics politically correct italics. </p>
      <p>The Good Apprentice? But I am having trouble rereading it.</p>
      <p>Viva Tourist! Re the variant forms, has anyone ever seen anything like these before? Was it really Hess who conceptualized them first? However, even if Renner did get the idea of the variants from Hess, there is no further comparison to be made. The two weights of Steile and its italic are executed on a supersubtle plane never, I would argue, achieved before or since. The weight relationships between the medium and bold alone are a miracle of non-interpolable brilliance.</p>
