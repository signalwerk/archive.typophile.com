      <p>While we're setting things straight, Martin Majoor made some factual errors on Peter's blog some time ago that have never been corrected. Scala sans does not make so many firsts as Martin claims, and surely he knows about the celebrated Today Sans?</p>
      <p>The first sans serif superfamily was Volker Küster's Today Sans Serif, 1987. Two optical axes, extra light to extra bold, lining and osf figures, small caps, all f-ligs, true italic, ad infinitum, ad gloriam. An astonishing achievement for its day, and, still, today.</p>
      <p>Actually it is wrong to speak of axes here, and earlier in Nick's post. Axis should only be used where interpolability is possible, for obvious reasons (i.e, the word only exists in type to describe practical, interpolable extremes; style is probably usually the best word to describe something that is related but not interpolable). Some use was made of interpolation in Today, but for example the extra bold weights could not be designed to be interpolable, and the optical axes are not practically interpolable either.</p>
      <p>Drawings exist, in some stage of completion, for condensed and expanded versions of Today, but Küster seems to have lost interest in typeface design. It is one of the great tragedies. Why? Why? Why?</p>
