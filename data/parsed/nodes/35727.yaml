      <p>Nick, you say axis is a connecting line, that's all.</p>
      <p>But that's not what it means in type. It has a special technical meaning, specifically given to it probably by Adobe, or if not Adobe, one of the early workers in interpolation, such as Karow or Harper. It would be interesting to discover exactly when the term was first used, how it was defined -- it probably was defined, etc.</p>
      <p>Since axis has always been used thus in type -- why add to semantic confusion and change it now? </p>
      <p>Also, is axis really flexible enough for what you want to talk about? Why confine yourself to a line? I really think there must be a better word. What is it that you want to describe? It seems to me that you want to describe the relationship between two typefaces that do not necessarily have a linear or even predictable relationship. So why use a word steeped (or mired) in linearity? </p>
      <p>Why make a word that means line not be a word that means line? (For as long as there's a line, interpolability is implied, is it not?)</p>
      <p>You're not talking linearity here, but something more like spousal, neighbour, orbital (?) (rather than axial!) -- I can't think but there must be something better.</p>
