      <p>&gt;So now it looks like there is a choice of italics for Optima, somewhat like Fairfield.</p>
      <p>Nick, just for the record, Ruzicka didn't design the 'caption' italic variants of Fairfield. These generic simple italics were designed by various people at Lino (amongst them Kaczun) originally at the behest of National Geographic, if I have the story right. They're not very elegant or characterful, they're not in the least authentic, artistic, aesthetic, or anything like that. But they are awfully functional -- and isn't that what type is supposed to be? PS anyone whose only acquaintance with Fairfield is the digital should go out and find some metal settings -- it really is a good type.</p>
      <p>I can't say I have a real problem with Optima slanted. For me the focus on these problems is trite. What Optima needs is not a cursive italic. What it needs is size-optimized weights. Hype, hype, hype! Size-opt doesn't sell, therefore, it's ultimately of little interest to manufacturers</p>
      <p>&gt;I have tried to turn Peters’ question around and asked myself: What determines that types are NOT “family" ...</p>
      <p>Brilliant thinking, because if you can't say what something is not, you can't say what it is. It makes mincemeat of the original question. If you consider all the metal sizes and weights of Times New Roman, you would be hard pressed to say they were related ... obviously they are, but not very closely and in some cases scarcely at all. The relationship is more a matter of intention than of organic fact. Another way of saying what you have already said. So in Times metal, there's a lot of apparent conceptual conflict, but functionally, it all seems to have worked out.</p>
