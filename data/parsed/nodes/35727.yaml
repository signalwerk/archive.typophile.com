    <p>I know of many students' projects which play with an idea of 'character' or 'humour' of typefaces as a parameter that connects separate typefaces into one, but I haven't seen any published typefaces doing this in an intelligent way. Do you happen to know any published examples? </p>
    <p>A separate question: Do you know when the term type family was coined, and first instance when it was used?</p>
    <p>Yours, Peter Bilak</p>
