      <p>Note that all the versions of Splendid have a similar x-height, and that between the script and antiqua versions, the thick and thin strokes are of the same weight (roughly). The idea is that if you need something done in a script font, you have one that was designed to match perfectly (e.g., you can get rid of the fora where people ask "What sans font goes well with [insert serif font]?").  The changes might be small or large.  In my font, I have a 5 faces so far, and as you can see they all share certain qualities.  The same x-, ascender, and descender heights, same colour (at least that's the goal), etc.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/coruna_serial_example_5128.png"></div><br>
      The sans versions are tests I made a long time ago and haven't returned to them, hence the atrocious letter-spacing.  The basic idea for me of a serial is that you have a multitude of fonts that, whilst potentially very different in appearance, can be used together with a guarantee that they will "match".  <p></p>
      <p>A (far better) example might be the Daam "Entity" by hrant, each of the faces DominationAvailable, Cristaal, and Brutaal, each go perfectly together yet have serve very different purposes.  <a href="http://themicrofoundry.com/s_latin.html" title="http://themicrofoundry.com/s_latin.html">http://themicrofoundry.com/s_latin.html</a></p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
