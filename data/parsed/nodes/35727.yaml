      <p>Underware's <a href="http://www.underware.nl/site2/index.php3?id1=auto&amp;id2=threeitalics" rel="nofollow">Auto</a> and its three italics could be an example of a "character" or "funkiness" axis. They even advocate their being used within one design.</p>
      <p>Although it's a bit more conventional in being related by weight, Porchez's <a href="http://www.typofonderie.com/alphabets/view/Anisette/?SID=a101fdfe60881e8472c0fab1735467d8" rel="nofollow">Anisette</a> and <a href="http://www.typofonderie.com/alphabets/view/AnisettePetite" rel="nofollow">Anisette Petite</a> could be a slightly unconventional example, what with one set being all caps of different widths and the other being single width caps and lowercase. But maybe they should be seen as simply a fragmented type family.</p>
      <p>Oh, also take a look at H&amp;FJ's <a href="http://www.typography.com/catalog/proteus/index.html" rel="nofollow">The Proteus Project</a> and Jeremy Tankard's <a href="http://www.typography.net/type/shires.htm" rel="nofollow">The Shire Types</a>. Both families are designed so their members are easily mixable.</p>
