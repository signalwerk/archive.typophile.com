    <p>See the latest PDF here (latest updates at bottom of post):</p>
    <p><a href="http://www.alexvaranese.com/work/amv-Shadowcliffe-Regular_Rough_Cut_5.pdf" title="http://www.alexvaranese.com/work/amv-Shadowcliffe-Regular_Rough_Cut_5.pdf">http://www.alexvaranese.com/work/amv-Shadowcliffe-Regular_Rough_Cut_5.pdf</a></p>
    <p>Thanks to Antonio for the great feedback. In response to what you said:</p>
    <p>- The proportions are definitely not accurate. Shadowcliffe is only partially based on Trajan, as opposed to being a direct replica/revival. So I'm still taking plenty of artistic liberties.</p>
    <p>- The S is indeed wider by design; as much as I love the original Trajan S, I wanted Shadowcliffe to be a little more versatile, and as a result things like the ultra-narrow S have been adjusted for greater consistancy.</p>
    <p>- The J, K and R terminals did in fact "swell" too much. I was trying to give some of the standard glyphs a slightly more swash-like character, but as much as I like the idea I was going for, the execution never quite worked out. So I've reverted them to a more standard design.</p>
    <p>- The X was unintentionally top-heavy and should be fixed now.</p>
