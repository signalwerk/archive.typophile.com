      <p>Thanks for the comments. Funny how subjective this stuff can be: The missing serifs on the M and N are among my favorite aspects of the Trajan characters, and one of the reasons I chose it as an inspiration. :)</p>
      <p>You're also right about the weight issues-- I noticed the S vs. N problem shortly after uploading the PDF, and have since fixed it. I also always knew there was something up with the C/G vs. D thing, but you've prompted me to take a more formal look at it and actually do something about it.</p>
