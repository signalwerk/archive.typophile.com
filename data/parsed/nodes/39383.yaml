      <p>I like it, well produced and balanced (probably <em>because</em> of things like the 'S' being wider than it is in Trajan and such).</p>
      <p>Only thing I don't like -- which I also don't like in Trajan (amongst other things) -- are the serifless tops of the 'M' and 'N'. I understand that the historical precedents have this as well, but I think it makes them look as if they don't belong in the set.</p>
      <p>I like the 'R', the fact that it doesn't connect to the stem, and the leg as well.<br>
      The weight distribution could use some attention, but only here and there. For example compare the diagonal of the 'N' with the spine of the 'S'. But also the bowl of the 'D' compared to those of the 'C'/'G'. It's only minor, but nevertheless. :)</p>
