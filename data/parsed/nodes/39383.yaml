    html: |-
      <p>Phew! Turns out the last character set was anything but finished. :) I just did another complete overhaul, doing a lot of very brutal testing, viewing test strings from a distance, from weird angles, etc:</p>
      <p>NOW, I think I might finally be ready to wrap up the character set. I did a lot of work across all of the weights/strokes/stresses, and made a rather bold change in the size of the bowls on the R, P and Thorn-- they're considerably larger now, giving the face quite a bit more character than it had originally. They're so big they almost remind me of Goudy Old Style or something. But this is a titling font, and I think it makes sense. As part of my move away from the strangely narrow characters found in the Roman Trajan capitals, such as R, P and S, I think this to some degree inescapable.</p>
      <p>I should be able to knock out the rest of this weight within a few days, assuming I don't once again decide to redo the damn capitals. :) Here's what I plan on:</p>
      <p>- Union of WinANSI + MacOS Roman characters<br>
      - Small caps for lowercase<br>
      - Both lining and old-style figures (lining will be default, as this is a title font)<br>
      - Complete set of numerators/denominators for OpenType fractions<br>
      - Select swash capitals<br>
      - Flourish ornaments</p>
      <p>Once that's done, I'll at the very least be adding a considerably heavier bold weight, and possibly a light weight on top of that.</p>
