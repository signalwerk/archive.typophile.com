      <p>Isn’t diagonality relative? Think about italics: they weren’t invented to be used alongside romans to create a hierarchy. </p>
      <p>When I think about diagonals I often think back to a professor who would often catch lazy students using diagonals to try and whip up a dynamic composition. When confronted with the question “Why do the diagonals make this composition dynamic?” the students never had an answer.</p>
      <p>But at the same time I guess one can always find diagonals from a strictly mathematical perspective: in a shape with an odd number of sides all sides are at diagonals to all others, none are parallel (At least I think it works that way, I’d have to write a program to test it). So within the mathematical structure of reality there are always some kinds of diagonals.</p>
