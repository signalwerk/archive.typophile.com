      <p>I’m not exactly sure what you mean with this question.</p>
      <p>I think I may be trying to answer a different one here, but as I understand it, the brain distinguishes a diagonal line faster than a vertical or horizontal one. The theory, as I recall being that something that is on a diagonal is either moving or unstable and therefore a possible threat, or perhaps dinner.</p>
      <p>In designing signage, it’s something that’s very consciously used to grab attention... as in, “this is a concrete wall. Don’t drive into it.”</p>
      <p>-=®=-</p>
