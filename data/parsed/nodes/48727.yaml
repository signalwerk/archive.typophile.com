    <p>This is an abstract question, one I’m<br>
    not sure I really understand myself:</p>
    <p>What things are fundamentally diagonal?<br>
    OR<br>
    What fundamental things are diagonal?</p>
    <p>—</p>
    <p>Please help me explain this in the process of discovering answers.</p>
    <p>hhp</p>
