  - id: 490929
    user: 172742
    date: 2012-01-10T16:07:00
    date_raw: 10 Jan 2012 — 4:07pm
    votes: null
    html: |-
      <p>When people read, they actually only read the top half of words. So in order for your logotype to be as legible as possible you should have a nice rhythm (optical spacing) between the top half of your letters.</p>
      <p>It's a trick I learnt from watching Doyald Young's documentary, and it has worked pretty good for me.</p>
      <p>Every type lover should see this documentary and therefore I have posted it on my blog: <a href="http://brandsandtypography.blogspot.com/2011/12/tweede-bericht.html" title="http://brandsandtypography.blogspot.com/2011/12/tweede-bericht.html">http://brandsandtypography.blogspot.com/2011/12/tweede-bericht.html</a></p>
      <p>Great inspiration!</p>
    html_clean: |-
