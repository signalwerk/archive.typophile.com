    date: 2012-01-10T08:46:00
    date_raw: 10 Jan 2012 — 8:46am
    votes: null
    html: <p>Hey Tim, I think you might be right, but could you say a bit more about the strategy of kerning WRT the top half?  I think I understand what you are saying in this case, but I am not sure I get how the overall balance relies more heavily on the top half.  Part of what I was struggling with in this design is that it first seemed like a tighter spacing was possible, but going looser overall really has helped overcome some of the particularly difficult areas.  Still tweaking by tiny bits!  Thanks for the help!</p>
