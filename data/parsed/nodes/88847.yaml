    html: <p>Yea I am happy with the looser spacing.  I have seen the documentary, and I do know about the tops of the letters being critical to reading.  I always assumed that reading the tops was mostly a lowercase thing.  But I think you are right about rhythm.  I probably was focusing too much on trying to achieve even color and equal volume between letters.  Anyhow, thanks for the help, I do feel this has improved greatly thanks to all your feedback!  Thank you!</p>
