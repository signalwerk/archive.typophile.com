    <p>Hello all,</p>
    <p>I have been trying to track down this font. I have seen it on many racecars which leads me to believe it is a font.</p>
    <p>I have noticed throughout my search that some people modify the font by either cutting the top serifs? off or making the bottom rounded.</p>
    <p>Sorry that is about all the info I have. Thank you for your ahead of time for your hard work and effort.</p>
    <p>-Justin</p>
