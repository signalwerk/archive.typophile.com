      <p>The top of the '1' is oddly squared off. As I replied to your e-mail, this may not be from a font, but may be from a set of numerals designed for racing car decals. My feeling is that you may do best by just approximating this look starting with a very heavy weight serif and then tweaking it to resemble this numbering.</p>
      <p>- Mike Yanega</p>
