      <p>I have FontExplorer installed on my Mac, but I mostly just use it for previewing uninstalled fonts and cleaning the font caches. I don't use it for activating/deactivating fonts very often. (If I were doing "normal" design work instead of making fonts, the situation might be different.)</p>
      <p>I have all my fonts organized into folders for each family on a separate volume. To install a font, I simply copy a folder of fonts into the ~/Library/Fonts. To uninstall, just delete the folder.</p>
      <p>A lot of people don't realize it, but you can put fonts into folders and sub-folders in the /Fonts folder. You can organize it however you like. No need to leave everything dumped out loose at the top level.</p>
      <p>Font managers do have some benefits, but a lot of people have forgotten why Suitcase was such a success when it was first released on Mac System 6 back in the Eighties: It enabled you to install more than 256 fonts at one time. Each bitmap size of each font style counted as a font, so this was a big problem, and Suitcase solved it. The other reason was that you normally had to restart when you installed new fonts. Suitcase fixed this as well. Most of the other features were simply ways for Suitcase and its competitors to differentiate themselves in the market.</p>
      <p>But we don't have the 256 font limit or the restart problems anymore that Suitcase and similar utilities were originally designed to solve. Things like auto-activation can be very useful, but these utilities are not nearly as essential as they once were.</p>
