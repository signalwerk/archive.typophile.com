    <p>Hi all,</p>
    <p>When spacing uppercase in allcaps setting, the results are different from spacing uppercase next to lowercase. So, which option should one use?</p>
    <p>Secondly, should one use kerning in allcaps setting, to compensate for the slightly off spacing (when spacing is based on uppercase next to lowercase)?</p>
    <p>Cheers! jasper</p>
