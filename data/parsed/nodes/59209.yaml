    html: |-
      <p>I agree the article author is blissfully unaware about software licensing. </p>
      <p>“why the talk of downloading fonts from the Web and USB sticks then? Surely Linux can read the Windows partition?”</p>
      <p>GNU/Linux can read and write VFAT and NTFS, yes, but WINE isn’t designed to search the filesystem for Windows’ own files, it is designed to run without the presence of Windows at all. Thus the need to copy Windows fonts (other I think sometimes other files, like some hardware drivers) into places where WINE can make use of them.</p>
      <p>“And to be clear you think the advice provided in the article is completely kosher from an open source perspective?”</p>
      <p>I’m not an advocate for open source, I’m an advocate for software freedom, so I find the whole WINE project to be an own-goal - it promotes proprietary software. I’d rather than articles like this weren’t written and instead articles were written explaining what the free alternatives to proprietary applications are, or proposing the initiation of projects to develop them. </p>
      <p>So I’ll join you in criticising the article for popping off into the web to find unlicensed copies of proprietary fonts, although I guess we part ways when I say that I’d rather the article said “we don’t have libre fonts that can replace Windows’ fonts, so please consider starting a project to develop them” :-)</p>
      <p>Developing a roman and an italic is the course requirement, but that isn’t a family IMO.</p>
