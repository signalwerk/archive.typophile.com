      <p>Joe, if you interpret the article as someone transferring fonts from a licensed machine <strong>they own</strong> onto a unlicensed machine <strong>they own</strong>, then I see your point. It’s kind of like a studio licensing one copy of Photoshop and installing it on 20 Macs - at least they licensed one copy. Adobe got paid.    </p>
      <p>However, the article doesn’t talk about this. It is advice for someone who is running Linux, and who has not paid for Windows or Mac OS (both OS’s include these fonts). People who legitimately licensed these OS’s have paid for the fonts.</p>
      <p>The author could have suggested using fonts from an unused copy of Windows, ebay, or given the sourceforge URL. But he didn’t. </p>
      <p>Does that make sense?  </p>
      <p>And back to the point of my post. All I said was that it’s “sad” that the chap didn’t have a better grasp on font licensing, and that his ideas were published in a mainstream newspaper. Ethics discussions aside, I just can’t see how that it’s good for the font community.   </p>
      <p>EK&gt; Simon, if you’re going to quote someone, quote fairly.</p>
      <p>Well don’t make inflamatory stuff up then. Saying that people who use Open Source OS’s are less likely to pirate applications software is like saying the Pope wears a funny hat. Most Linux apps are Open Source making piracy impossible.</p>
