    <p>Some advice for Linux users from <a href="http://www.washingtonpost.com/wp-dyn/content/article/2009/06/19/AR2009061902549.html">PC World/Washington Post</a>...</p>
    <p>“If you want to import directly from a Windows installation, you’ll find the fonts in the C:\windows\fonts directory. Copy all the .ttf files to a USB stick, create a new folder in your/home directory called .fonts (note the period before the word fonts!), and place them there. And that’s it. The fonts will now be available in all your applications.” </p>
    <p>It’s sad to see such ignorance around font licensing. If this chap had suggested skipping the middle man and downloading a pirate copy of Windows and the applications I’m sure the article would never have been published.</p>
  html_clean: |-
    <p>Some advice for Linux users from <a href="http://www.washingtonpost.com/wp-dyn/content/article/2009/06/19/AR2009061902549.html" class="link-external">PC World/Washington Post</a>...</p>
    <p>“If you want to import directly from a Windows installation, you’ll find the fonts in the C:\windows\fonts directory. Copy all the .ttf files to a USB stick, create a new folder in your/home directory called .fonts (note the period before the word fonts!), and place them there. And that’s it. The fonts will now be available in all your applications.” </p>
    <p>It’s sad to see such ignorance around font licensing. If this chap had suggested skipping the middle man and downloading a pirate copy of Windows and the applications I’m sure the article would never have been published.</p>
