      <p>Hold on, hold on. First, Sii, when you say “the article was about running Windows apps on Linux - which would imply a different box,” you seem to not quite understand what WINE does; WINE is precisely about running Windows apps that are sat on a local hard disk of a computer that booted GNU/Linux. WINE stands for “Wine Is Not an Emulator,” and so it does indeed require moving the fonts, because it allows running Windows apps without Windows. </p>
      <p>Moreover, the article also says “Fonts that are not supplied as part of [the core fonts] package, but which some applications might need, include Tahoma and MS Sans. You can find these around the web if you search.” </p>
      <p>(And, it does include the sourceforge URL, btw.)</p>
