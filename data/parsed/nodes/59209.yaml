      <p>You are again quoting unfairly. What you are citing is not my first response, and it’s not even the relevant part of the argument.</p>
      <p>The gist of it, again, is that the article might fairly be interpreted not to encourage willy-nilly copying of fonts, but as a way to run fully licensed applications (including the fonts they require) from an open source platform. I think it’s a fair interpretation (a more reasonable one in context) since few users who are pirates flock to open source: they stay with their illegal copies of windows and windows applications. Open source users tend to be people who want to be legit, but can’t or don’t want to pay for software, or strongly prefer free software. If a user is reluctant to switch to Linux because there’s a Windows application that they must run, the article tells them how to do it.</p>
      <p>I may be wrong about any of these matters, but it’s certainly no reason for you to get upset.</p>
