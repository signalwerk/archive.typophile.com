      <p>You can split hairs with EULAs, and be technically correct, but if we’re talking about ethics, I don’t get it. I see little rationale in getting upset about this. </p>
      <p>I feel no guilt whatsoever in downloading a given album (let’s say the Clash’s London Calling) that I’ve bought on so many formats over the years (vinyl, CD, cassette). I would have to try really hard to feel guilt over using a Windows licensed fonts on a Linux install when there was zero effort on the creator/designers’ part in making that possible. (Assuming there are no added support costs, etc.)</p>
      <p>So, I know I’m letting ethics trump the law in my choice to re-download music that I justify by feeling that I’m entitled. But, maybe you can help me see it from your perspective.</p>
      <p>Assuming someone has properly licensed the original fonts, what do font designers lose from this behavior in the article? What does Microsoft lose?</p>
      <p>(And Simon, this is a genuine question. I respect you too much to bait you with troll tactics.)</p>
