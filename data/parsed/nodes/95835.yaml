    <p>Hello all--<br>
    I've got an in-progress here that needs your eyes. It's based on a hastily designed logo for a paper sculpture artist that I thought had some potential as a full set of letters. It's a bit of a mash-up of different elements but here's the main points I want: display face, high contrast, flared serifs and abrupt wedge serifs, large x-height, and some other thin, swashy elements and unconventional forms are ok with me since I envision it being used at large sizes. I'd also like to make light and ultra weights too.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/Papreo_01_4213.png"></div><p></p>
