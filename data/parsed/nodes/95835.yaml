    html: |-
      <p>I don't think these new thin joints would cause any substantial conflict. The letter shapes are well defined and distinct. But I would trust my own eye, esse est percipi ;-)</p>
      <p>Ditto, I like the new /k/. The top has more stress than before, it became almost a bit squarish. I suppose you wanted the squarishness of the capitals to recur. </p>
      <p>The bottom left of /s/ seems too thin.</p>
      <p>I would have liked an /O/ more in keeping with /C/ and /B/. Generally, I notice two different curve styles in your capital alphabet (and both work as seen in the mixed-case setting). Right now I like more the vibe of the lowercase than the uppercase, I don't know why, but it may be because of the two divergent styles. I like how /c/ and /C/ relate to each other. In short, my question is if the all-caps setting works as well as the mixed-case.</p>
      <p>The triangle serif of /K/ looks too big.</p>
      <p>I like what you did with the /q/.</p>
      <p>Keep up the enjoyable work!</p>
