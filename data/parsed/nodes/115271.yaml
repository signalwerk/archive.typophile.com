    date_raw: 26 Mar 2014 — 7:17pm
    votes: null
    html: |-
      <p>Luc Devroye's Edward Penfield Page <a href="http://luc.devroye.org/fonts-67392.html" title="http://luc.devroye.org/fonts-67392.html">http://luc.devroye.org/fonts-67392.html</a><br>
      Includes good quality images of his hand lettered Modern American Capitals and Modern American Lowercase. This is as close as I have seen to a standardized alphabet of Penfield's concept of an alphabet.<br>
      Seems to be the source of Penfield Deco by bosil unique fonts <a href="http://www.fontspace.com/bosil-unique-fonts/bu-penfield-deco" title="http://www.fontspace.com/bosil-unique-fonts/bu-penfield-deco">http://www.fontspace.com/bosil-unique-fonts/bu-penfield-deco</a> Decide for yourself how well the digital version catches Penfield's letters.<br>
      Don</p>
    html_clean: |-
