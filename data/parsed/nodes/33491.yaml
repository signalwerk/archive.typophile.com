  html: |-
    <p>Web typography is surely not as sophisticated as it's printed cousin (or should it be mother?), but nevertheless, <a href="http://webtypography.net/" title="The Elements of Typographic Style Applied to the Web" rel="nofollow">some</a> <a href="http://www.markboulton.co.uk/journal/comments/five_simple_steps_to_better_typography/" title="Five Simple Steps to Better Typography" rel="nofollow">web</a> <a href="http://24ways.org/2006/compose-to-a-vertical-rhythm" title="Compose to a Vertical Rhythm" rel="nofollow">designers</a> have worked hard to do the best they can with what they have. So I'm curious what websites the type community thinks make the best use of type on the web. I'll start.</p>
    <p><a href="http://alistapart.com/" title="Visit the site and see for yourself" rel="nofollow">A List Apart</a> takes full advantage of the best of the web typefaces. Sure they're just Georgia and Verdana, but when used well as they are here, they add real sophistication to a design.</p>
    <p><a href="http://www.subtraction.com/<a" title="See for yourself" rel="nofollow">Khoi Vinh’s Subtraction</a> proves that type can look great on the web if used properly. Here a single font (Arial) is leveraged to its full potential with the aid of a strong underlying grid layout.</p>
    <p>What sites inspire you to use type better on the web?</p>
