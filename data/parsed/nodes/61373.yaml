    html: |-
      <p>For starters remove most of the content under the column “Personal”.<br>
      Put something that describes how you well you work and think- efficient, team worker, organized etc.</p>
      <p>Merge the Technical and Creative to just “Technical” or “Technical &amp; Creative”</p>
      <p>Remove “Typography” because you do not make fonts.</p>
      <p>A hierarchy would help too</p>
      <p>GRAPHIC DESIGN:<br>
      - Illustration<br>
      - Page Layout<br>
      - Photo Manipulation / Retouching</p>
      <p>There are several other problems too. </p>
      <p>The top half of your resume places too much emphasis on your Adobe skills when your photography is your bread and butter.</p>
      <p>I don’t like how your using Archer. It add a whimpy, crafty and perhaps even girly feel to the resume. You need to come across more powerful. The size of the text is too large and the text area is too wide. I would just use the Freight Sans or Text—it’s strong but still friendly.</p>
      <p>Remove the Caslon ampersands too.</p>
      <p>And the big thing you need to fix is your name set in the nasty corporate Univers... remove Univers completely.</p>
      <p>The resume places emphasis on where you worked which is not as important as the position you held.</p>
      <p>Mikey :-)</p>
      <p>and the grey text is too light... just use all black</p>
