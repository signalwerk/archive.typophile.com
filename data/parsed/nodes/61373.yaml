      <p>Print the last page of specimen for Freight Sans with your laser printer at its worst lowest quality setting:<br>
      <a href="http://www.dardenstudio.com/assets/pdf/freight_sans.pdf" title="http://www.dardenstudio.com/assets/pdf/freight_sans.pdf">http://www.dardenstudio.com/assets/pdf/freight_sans.pdf</a></p>
      <p>You’ll most likeky be be using the Book weight as it will probably hold up well through lousy fax transmissions.</p>
      <p>Just by looking at how well balanced the Book is with Semibold you might want to spring for it, but  you can use the Bold— no problem.</p>
      <p>I don’t think you need the serif because the big blocks of text you’ve written  under each employer needs to be condensed into 3 to 5 bullets. This is going to be hard but you have as concise yet just as detail.</p>
      <p>mikey :-)</p>
