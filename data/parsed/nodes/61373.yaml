    <p>Hello!</p>
    <p>First time posting to this lovely forum. I've recently began delving more deeply into typography, and I find myself hooked. This resume redesign of mine was my first project in which type was a serious consideration. I would love any sort of commentary or critique–certainly both positive, and negative– that you may have to offer. I have attached both the old resume, and the new, for comparison purposes. Thank you!</p>
