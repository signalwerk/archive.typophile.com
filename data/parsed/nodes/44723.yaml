      <p><em>Nice article by Charles McGrath</em></p>
      <p>VW's "Think Small" layout was created by Helmut Krone, art director, and the headline was written by Julian Koenig.<br>
      McGrath's attribution to Lois is interesting, a result of the passage of time and the way that famous names scoop up historical accreditations for the famous stuff? Or the way that internet-era research generates factoids?</p>
  - id: 275306
    user_id: 14287
    user_name: eeblet
    user_path: null
    date_raw: 27 Apr 2008 — 11:51am
    date: 2008-04-27T11:51:00
    votes: null
    html: |-
      <p>Among the first few Google results for 'VW "think small"' is <a class="freelinking external" href="http://adage.com/century/campaigns.html" rel="nofollow">this</a>, which includes this:</p>
      <p>----</p>
      <blockquote><p>First of all, our thanks to Kurt Kroner, the man behind the defining example of the greatest advertising campaign of the century.</p>
      <p>He wasn't the copywriter. That was Julian Koenig. Nor was he the art director. That was Helmut Krone. Nor was he elsewhere employed by Doyle Dane Bernbach, the agency that stormed the confining Bastille of advertising orthodoxy to ignite the "creative revolution."</p>
      <p>Actually, our hero wasn't in advertising at all. Kurt Kroner was the one, among 3,389 Wolfsburg, Germany, assembly plant workers, to flag a blemished chrome strip on the glove compartment of a 1961 Volkswagen Beetle and reject the vehicle for delivery. Yes, if we are to believe Koenig's copy, Herr Kroner gave us the famously failed and fabulously forlorn. . . "Lemon."</p></blockquote>
      <p>----</p>
      <p>So even internet-era research isn't an excuse for this misattribution!  Thanks for the catch, Nick.</p>
      <p>---<br>
      eeblet.com</p>
