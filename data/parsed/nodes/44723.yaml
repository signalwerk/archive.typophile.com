      <p>Wow, Nick, great catch! My excuse for missing that one is that I was still having my coffee as I read the article this morning...</p>
      <p>[EDIT] And hang on, I've looked further into this... George Lois was indeed employed at DDB at the time of the Think Small ad... I looked it up in Clive Challis' book on Helmut Krone. Lois is quoted as saying, "We have to sell a Nazi car in a Jewish town." But the book only mentions Koenig and Krone as the people responsible for "Think Small." and "Lemon." (There were many other ads, and the book shows them all.)</p>
