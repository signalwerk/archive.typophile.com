  html: |-
    <p>You may have noticed some up/down arrows on the right of Forums threads &amp; comments. [EDIT: They have since been removed until we have a better reason to use them.] I've turned on voting, but ultimately what we do with this is up to all of us. As Typophile continues to grow with hundreds of thousands of pieces of content, we're going to need some new tools to start to sift signal from noise. A few of my initial thoughts and ideas on how we might want to use this...</p>
    <p>UPvotes<br>
    - View quality content, not just the stuff that's popular<br>
    - See top voted content by day, week, month, all time<br>
    - Users with lots of upvotes on their content get status within the community.<br>
    - Type ID: The community identifies who solved the ID, which could feed into a leaderboard.<br>
    - Content recommendations: Typophile suggests other content that is similar to the stuff you've upvoted.</p>
    <p>DOWNvotes<br>
    - The community downvotes trolls, griefers, spammers and the comments gray out.<br>
    - Enough community downvotes and the comment disappears entirely.<br>
    - Typophile filters content out that you're not interested in based on your voting history.</p>
    <p>How would _you_ like to see voting results used to enhance your Typophile experience?</p>
    <p>//jared</p>
