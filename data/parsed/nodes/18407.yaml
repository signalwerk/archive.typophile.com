    html: <p><a href="http://nationaltreasures.nla.gov.au/index/Treasures/item/nla.int-ex8-s33/nla.int-ex8-s38">This Penfolds Grange Hermitage label</a>  from the National Library of Australia shows a Penfolds label from 1967 with the same script, so I guess it's originally hand-drawn. Whether it's since been digitised, I'm afraid I don't know.</p>
