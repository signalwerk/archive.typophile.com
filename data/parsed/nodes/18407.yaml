      <p>Kyle, it would be best to start a new thread for Kiehl's.</p>
      <p>As for the Penfolds lettering, I suggest P22's <a href="http://Brass Script" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://Brass Script</a> as having a similar contrasty feeling, although the initials are less fancy. You might also look at Letterhead Font's <a href="http://www.letterheadfonts.com/fonts/ephemera.php" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Ephemera</a>, for something more ornate.</p>
      <p>- Mike Yanega</p>
