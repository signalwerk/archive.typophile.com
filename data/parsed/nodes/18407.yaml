    html: |-
      <p>Kyle, it would be best to start a new thread for Kiehl's.</p>
      <p>As for the Penfolds lettering, I suggest P22's <a class="freelinking external" href="http://www.veer.com/products/typedetail.aspx?image=IHT0000254" rel="nofollow">Brass Script</a> as having a similar contrasty feeling, although the initials are less fancy. You might also look at Letterhead Font's <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/ephemera.php" rel="nofollow">Ephemera</a>, for something more ornate.</p>
      <p>- Mike Yanega</p>
