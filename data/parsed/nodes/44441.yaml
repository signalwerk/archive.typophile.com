      <p>I agree with Stephen about using a font manager but I wouldn’t use Linotype’s manager for Windows if it is still in beta. It crashed my machine hard. There are several good, inexpensive options for Windows. I use Typograf which is only $35 and there are other good options for less than $100.</p>
      <p>Sharon</p>
