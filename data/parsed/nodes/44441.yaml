    <p>Hi,</p>
    <p>I copied a bunch of fonts from Monotype and Adobe into my WINDOWS\fonts folder. Even after deleting many of them, there’s still about 3,000. They seem to be slowing my computer down a bit. I installed them because I kept getting missing-font errors when using InDesign, Publisher, and Acrobat. A lot of them appear to be duplicates, but I’m not sure which version to keep. For example, there’s CaslonFiveForty. Then there’s Clarendon (a Type 1 font) and ClarendonMTStd. If I were to delete ClarendonMTStd, is there a chance I would get a missing-font error in Acrobat or InDesign for it, or would Windows automatically substitute the latter? Others look more different, like Century Light, even though I already have Century. I ran the dir command in the folder and saved the output in a text file. I attached it to this message. I was hoping to delete about 500 to 1000 of them.</p>
    <p>Thank you for any help,</p>
    <p>Richard</p>
