    <p>Hey there,</p>
    <p>I hope you can help me out. I’m looking for the font which is used in the attached sample. I think it’s a <cite>Rotis Sans</cite> however the ampersand does not match the <cite>Rotis Sans</cite> ampersand i know. Maybe a different ampersand is used, maybe it’s not a <cite>Rotis Sans</cite> at all. Voices in my head say that <cite>Lucas de Groot</cite> is somehow involved, however I cannot find anything <cite>LucasFonts-related</cite>. Any help is appreciated!</p>
    <p>Cheers,<br>
    Paul</p>
