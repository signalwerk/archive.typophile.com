      <p>I think the hiddenness of the initials is fine. The logo plausibly says architecture to me so it doesn't live or die based on the letter recognition.<br>
      Leveling the crossbars makes way to much of a window IMO.<br>
      I don't get the vertical alignment in the original post: it looks like the tops of the boxes line up with the top of the /t/, but then makes those taller descenders /d/f/h/ look like they poke up too high.<br>
      To my eye, "ARCHITECTS" looks like it starts left of where "studio" starts: you may have to fudge the mathematical alignment to get persuasive optical alignment.<br>
      I quite like the colors and font.<br>
      It certainly says European modernist though--both the Mondrian look and the Bauhaus-like lowercase and geometric simplicity--so be aware that that architectural style is implied.</p>
