    html: |-
      <p>The 'Mondrian reference' is actually a side effect - at the centre is a play with the letters F and H which are hidden in the white space. The resulting squares and rectangles are arranged in Golden Ratio proportions.</p>
      <p>Colour-wise, the firm operates in Uganda, and a 'rusty Orange' is one of the defining colours in nature here due to the red soil. I like its warmth and strength, especially on the charcoal background.</p>
      <p>The font is Canadatype's reinterpretation of Semplicitá by Alessandro Butti. Its 'humanist geometry' sits well with an Architectural understanding that is firmly rooted in, but not enslaved by, the modernist Architecture of the early 20th century. </p>
      <p>There is a second, maybe slightly less Mondrianesque option that also may have better proportions between icon and text:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo-studiofh-02_5902.png"></div><p></p>
