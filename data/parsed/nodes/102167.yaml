      <p>FWIW, Pantone 1788 is a warm red (coated or uncoated). If you want to keep the 'rust' vibe going and brighten it up a little, try adding a little yellow and take a look at 1655 C or U. </p>
      <p>JamesM, over here it's swatch central and I don't restrict my swatch collection to paper ... :) I've got a wood, marble, glass, acrylics and I'm now picking up metal stuff too. I've some fabrics mostly industrial too. Swatches are inspirational. The Pantone books are far better than going over to places like colorlovers or kuler for sure!</p>
      <p>n.</p>
