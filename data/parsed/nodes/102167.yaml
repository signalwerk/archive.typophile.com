      <p>&gt; Don't know much about Pantone</p>
      <p>It's a system that applies numbers to different colors, making it easy to specify a precise color to a print shop.<br>
      <a href="http://www.pantone.com" title="www.pantone.com">www.pantone.com</a></p>
      <p>&gt; In Illustrator, my screen tells me that 1788 C is the closest<br>
      &gt; (although not sure though whether 'Solid Coated' is the right<br>
      &gt; colour book to use?).</p>
      <p>Illustrator is telling you that that if you want to print it using orange ink on coated (glossy) paper stock, ask the printer to use Pantone 1788 ink.  </p>
      <p>If you're printing on uncoated paper, it will look a little different since uncoated stock will absorb some of the ink, so you may need to use a different Pantone number.</p>
      <p>But if you're printing using 4-color process (like in a brochure with color pictures), the printer won't use orange ink, they'll use 4 printing plates — cyan, magenta, yellow and black — to create all the colors. While this process is economical, some colors may reproduce better than others, and orange can be tricky sometimes in 4-color process. An alternative is to add a 5th printing plate that only prints orange ink, and that way the color will be exactly right. Corporations often do that so their corporate color will always print correctly. Unfortunately it costs more.</p>
      <p>For any kind of printed piece, it's better to pick your ink colors by looking at actual, physical swatch books.</p>
