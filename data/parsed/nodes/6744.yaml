  html: <p>Hi, <br>I am new here, so sorry if this question already has been posted here a million times but i didn't find it after a quick browse through old threads.  <br>There is this font that I've seen so many times, and always loved, but didn't know it was out there digitalised. Until a while ago when I saw it at <a href="http://www.graficeurope.com" target="_blank">www.graficeurope.com</a> and realised that i probably is! But i dont know the name of the font, or where to get it. Does anyone know? <br>Thanks! <br>Peter <br><img src="http://www.typophile.com/forums/messages/83/49276.jpg" alt="What font is this?"></p>
