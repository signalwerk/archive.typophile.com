    html: <p>No, I think this is House Industries' Chalet New York 1960. Try it out in their <a href="http://www.houseind.com/house.php?kit=CHALET-FO&amp;sub=lettersetter" target="_blank">LetterSetter</a> and you'll see that it matches (except in the sample above, they didn't use the fi ligature).</p>
    html_clean: <p>No, I think this is House Industries' Chalet New York 1960. Try it out in their <a href="http://www.houseind.com/house.php?kit=CHALET-FO&amp;sub=lettersetter" target="_blank" class="link-external">LetterSetter</a> and you'll see that it matches (except in the sample above, they didn't use the fi ligature).</p>
  - id: 47108
    user: null
    date: null
    date_raw: null
    votes: null
    html: <p>Incidentally, the face you remember from years ago is probably Helvetica in the original display cuts, for which the font James linked to is the only digital version available. The "1960" cuts of Chalet have a lot of the same look and feel.</p>
