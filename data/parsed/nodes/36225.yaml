    html: |-
      <p>I used to feel that way about Stempel Garamond but from a useability point-of-view it is unambiguous. What does bother me is the tracking combined with the colour, I would be tempted to close up the tracking and use upper and lower case for the e-mail address even if I couldn’t get it on one line. If there is space I would introduce a half-line space before the telephone numbers to separate them still more from the address, while still linking them to the particular address and make them easier to pick out.</p>
      <p>Tim</p>
