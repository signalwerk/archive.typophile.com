    <p>Hi all,</p>
    <p>A colleague of mine is setting some type for a business card. She's asked me to give my two cents on this preliminary comp. It's set in 6.75/8.25 Sabon Next Regular Small Caps. The first line is demibold.</p>
    <p>My first impression is that the "60606" is really annoying to look at (I'd imagine there's got to be more New Yorkers with this problem). It really draws attention to the bizarre axis in the 0. I believe other ("regular") versions of Sabon (<a class="freelinking external" href="http://typophile.com/node/16304" rel="nofollow">and Caslon, for that matter</a>) have oldstyle zeros that are closer to circles... </p>
    <p>Any other critique is welcome, too...I'm sure she'd love to hear what everyone has to say.</p>
