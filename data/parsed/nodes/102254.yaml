  html: |-
    <p>Hi</p>
    <p>Is it possible to compare the side-bearings of two separate fonts and mark any differences.</p>
    <p>I have been trying to do it with a macro. I can open the two fonts but how do I loop through the glyphs of the fonts. It would be nice it it skips any glyphs that aren't present in both fonts as well.</p>
    <p><code><br>
    from robofab.world import OpenFont<br>
    fontOne = OpenFont(None)<br>
    fontTwo = OpenFont(None)<br>
    print fontOne.info.fullName,"/",fontTwo.info.fullName<br>
    print " "<br>
    for g in fontOne:<br>
    	if fontOne[g].leftMargin != fontTwo[g].leftMargin or fontOne[g].rightMargin != fontTwo[g].rightMargin:<br>
    	  print fontOne[g].leftMargin,"-",g,"-",fontOne[g].rightMargin<br>
    	  print fontTwo[g].leftMargin,"-",g,"-",fontTwo[g].rightMargin<br>
    	  print fontOne[g].leftMargin - fontTwo[g].leftMargin,"----",fontOne[g].rightMargin - fontTwo[g].rightMargin<br>
    	  print "------------------"<br>
    	  print " "<br>
    	fontOne[g].mark += 10<br>
    </code></p>
