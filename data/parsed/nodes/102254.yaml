    html: |-
      <p>You just have some syntax issues, mostly.<br>
      - just 'cause Python is loosely typed doesn't mean you can ignore variable type. In order to print the left margin, which is an integer, you need to cast it as a string.<br>
      - In order to specify a glyph, you need to pass it the glyph name, not the glyph itself, like:  font[glyphname"]<br>
      - to add things to a print line, use the plus sign, not comma.</p>
      <p>So try this:</p>
      <p>from robofab.world import OpenFont<br>
      fontOne = OpenFont(None)<br>
      fontTwo = OpenFont(None)<br>
      print fontOne.info.postscriptFullName + " / " + fontTwo.info.postscriptFullName<br>
      print " "<br>
      for g in fontOne:<br>
          if fontOne[g.name].leftMargin != fontTwo[g.name].leftMargin or fontOne[g.name].rightMargin != fontTwo[g.name].rightMargin:<br>
              print str(fontOne[g.name].leftMargin) + "-" + g.name + "-" + str(fontOne[g.name].rightMargin)<br>
              print str(fontTwo[g.name].leftMargin) + "-" + g.name + "-" + str(fontTwo[g.name].rightMargin)<br>
              print str(fontOne[g.name].leftMargin - fontTwo[g.name].leftMargin) + "----" + str(fontOne[g.name].rightMargin - fontTwo[g.name].rightMargin)<br>
              print "------------------"<br>
              print " "<br>
              fontOne[g.name].mark += 10</p>
