    <p>Hi all, </p>
    <p>Can anyone recommend a narrow, thick, sans-serif font similar to "Franchise" (<a href="http://www.dafont.com/franchise.font" title="http://www.dafont.com/franchise.font">http://www.dafont.com/franchise.font</a>).<br>
    I'm looking for some non-free alternatives that I can alter a little bit to make the restaurant logo I'm working on more unique.<br>
    So far,  I've found Tungsten, but it's lacking a bit of personality. Thanks in advance! </p>
    <p>I've attached an early version.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/fonthelp_4772.jpg"></div><p></p>
