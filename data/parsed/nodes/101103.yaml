      <p>your email font is only going to appear as you see it if the user has the font on their system, of course. So Verdana, Arial, Georgia, Times New Roman are safe choices.<br>
      Avenir is of course safe on Macs, but I'm not sure what packages on Windows install it. So Windows users would probably see your email in Arial. Or more likely, whatever they've set their default to.</p>
