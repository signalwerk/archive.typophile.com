  html: |-
    <p>Hi,</p>
    <p>I'm completely new to the world of typography (until this weekend I didn't know the difference between serif fonts and sans serif fonts), and after thinking about the fact that fonts can make a drastic influence on how someone perceives you based on the font you use in your email or site. Also, English is not my first language, so I apologize for any mistakes in my writing (especially spelling and grammar).</p>
    <p>I was wondering you if you guys could help me with something that I have been thinking about all day today. I did do a Google search and read many articles, but no article really answered my question.</p>
    <p>We all know that Times New Roman size 12 is the preferred font for letters, resumes and any serious communication (if I'm wrong about this I apologize).</p>
    <p>I was wondering what the equivalent font, and more importantly font size, would be for emails. I mainly use email to communicate with friends and family, but will have to start using it for communicating with professors and sending out my resume. I'm looking for a font that is easily readable and still looks professional. So far, it seems like verdana, helvetica and helvetica neue are probably the right way to go. But, I'm more curious to know what size would be best. (I know some computers and smartphones will display the text differently.)</p>
    <p>I'd appreciate any assistance at all.</p>
    <p>One last question: Avenir is a font that I found that, in my opinion, looks amazing. Would this be an okay font to use for email?</p>
    <p>Thank you all in advance for your help, I truly appreciate it.</p>
