      <p>i don't tend to use helvetica in body copy, "because Helvetica looks like dogshit in text" -- to quote paul rand.</p>
      <p>for size, 16px plus is best. 16px is the default in most web browsers. sometimes you'd want to set the font size smaller or larger, depending on the situation. but as a heuristic it's solid, imo.</p>
