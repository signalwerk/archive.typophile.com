      <p>Egyptian 505 is the only Egyptian (font :-) that I actually like.<br>
      Unfortunately I don't know too much about it, except that it was<br>
      done (or at least started) by Gurtler's students, and their classroom<br>
      number was 505.</p>
      <p>One thing I would suggest that you take<br>
      a close look at in E505 are the numerals.</p>
      <p>hhp</p>
