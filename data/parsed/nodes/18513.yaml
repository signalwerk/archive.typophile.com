    <p>Can anyone point me to an article about the work of Andre Guertler's class in redoing Frutiger's Egyptienne typeface?</p>
    <p>I'm using Egyptienne on a current project and would like to know what the issues were that they addressed. Because it's paired with Avenir in my project it seemed most natural to stay close to Frutiger's version, but I've never spent much time with Egyptian faces.</p>
    <p>Thx</p>
