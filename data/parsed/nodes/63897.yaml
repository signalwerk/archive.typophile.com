    <p>Hi there, </p>
    <p>First post and I hope its in the right place.<br>
    I have a odd request/question for you all here.<br>
    I want to buy fonts from LHF - Letterheas Fonts, but when I try that I get the answer "We don’t accept orders from Sweden" ... thats it, no statement why or anything like that.</p>
    <p>So my question is, does anybody here know if its possible to buy em from somwhere else? Or is it possible to buy it from one of you users here maybe? (And yes Ive asked LHF but got no response back. )</p>
    <p>Thanx!</p>
    <p>/Henrik</p>
