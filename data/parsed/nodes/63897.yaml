      <p>Henrik,</p>
      <p>A few of them (5) are sold at MyFonts; <a href="http://new.myfonts.com/search/LHF/fonts/" title="http://new.myfonts.com/search/LHF/fonts/">http://new.myfonts.com/search/LHF/fonts/</a></p>
      <p>I had a quick look at Letterheads website, and I have to admit it's a bit odd why they just sell their typefaces to certain countries;<br>
      United States, Germany, Australia, Ireland, Austria, Japan, Belgium,	Netherlands, Canada, New Zealand, Denmark, Norway, Finland, Spain, France and United Kingdom. So all the other ones are not good enough???</p>
      <p>I fully respect and agree with his piracy policy etc, but it's not good publicity if they are hard to find. There should be no problem to buy typefaces from smaller or bigger foundries/vendors.</p>
      <p>I suggest you send them a nice e-mail again and ask why they don't ship to Sweden.</p>
      <p>Good luck.</p>
