      <p>You are cramming too much into the page.<br>
      9 on 11, two columns of 22 picas, that’s no good.<br>
      3 columns of type that size would be OK for a magazine or newsletter.<br>
      In general, two columns for a book is a bad idea, and you certainly need some margin space.<br>
      The book page requires a little breathing room.<br>
      It’s the density of your layout which makes the type look small.</p>
      <p>You will get a more spacious look with a lighter face — try Aldus at 9.5 on 11, it is basically Palatino with longer extenders, and that setting has the same character count. </p><div class="imageWrap"><img src="/files/PalAld_4839.jpg"></div><p></p>
