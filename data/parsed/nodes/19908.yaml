    html: <p>I would buy the complete <a href="http://www.typography.com/catalog/mercurytext/grades_duplexing.html">Mercury Text</a> family. The four grades will offer you four (slightly) different weights that allow you to increase or decrease the weight without changing copyfit. If possible, it would be best to test all four grades on press and choose the best grade for your readers. Mercury is also one of the most legible (and best looking) text faces available.</p>
