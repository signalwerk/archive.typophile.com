    <p>Please help me convince a coworker (a marketing guy) that one does not set books in a bolder font. (He wants to please a small percentage of readers who complained that the font was too light or hard to read.) The editors don’t want a font that will increase page count. It’s like a war-zone in the office!</p>
    <p>The books are 8.5 x 11, type is set at 9 pts. on 11 pts. leading, Palatino Roman, two columns, 22p0 wide. Some paragraphs are long, but the majority of text is written in bite-sized chunks. I’m reluctant to change the typeface to Palatino Medium or any other typeface with a thicker weight since the paper is thin and text shows through slightly.</p>
    <p>What other typefaces have a large x-height, comparable (or better) to Palatino at 9 pts., not too light, not too dark?</p>
    <p>Thank you!</p>
