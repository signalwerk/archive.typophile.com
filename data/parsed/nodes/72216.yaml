      <p>Hi</p>
      <p>I live in Oxford and work for Oxford Brookes University. I am sure that you will enjoy your time in Oxford. It can be a great place to live.</p>
      <p>A lot of people commute from Oxford to London, both by train and bus. The bus is relatively comfortable and pretty reliable. The train is quicker but more expensive. Both are cheaper with monthly or annual passes. The return trains which most people catch can be crowded, and sometimes it is difficult to find a seat. The key thing to look at is where exactly in London the job is. You do not want to spend an additional hour in each direction commuting within London.</p>
      <p>Trains arrive at Paddington station, so you should look for something close by. The bus is more flexible and stops in two or three places in Central London.</p>
      <p>Hope it works out.</p>
      <p>Cheers</p>
