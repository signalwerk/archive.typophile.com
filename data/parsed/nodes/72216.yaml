    <p>In September, my wife and I will be moving to Oxford, UK as she will be starting a masters program in book publishing at Oxford Brookes University. We currently live near Washington, DC, so right now we are going through all the crap that goes along with moving internationally. I've started to dip my toes into the water and have begun looking around for any leads for job opportunities over there and am realizing that I have no clue where to start looking.</p>
    <p>I'm really only looking for internship opportunities to start, so I've started keeping a list of any design firms that look like they might be a good fit for me in the Oxford/London area, and figured I would send out my resumé / portfolio and hope any of them bite.</p>
    <p>Now my questions are such:</p>
    <p>It appears that bus or train travel to London from Oxford is readily available, with a commute time of 1hour for train and up to 1:45 for Bus (depending on the area). Are there any people who know anything about the Oxford/London area and whether a commute to London from Oxford would be suicide or if it would be feasible?</p>
    <p>Are there online resources for design jobs in the UK that someone can point me to? (I'm sure there are and I just don't know them)</p>
    <p>Are there any design firms that you suggest I add to my list?</p>
    <p>Any other tips?</p>
    <p>Thanks very much for any help you all can give me.</p>
    <p><em>penn</em></p>
