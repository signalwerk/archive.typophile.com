    html: <p>I'm not sure why your kerning pair has been removed but I wouldn't trust the interpolated kerning too much from a Fontlab MM file. In the past - previous to Superpolator - I've found the desired instance via MM and then done a straight blend (not MM) to have some better kerning to start with. Superpolator does a super job with kern pairs if you're wondering.</p>
