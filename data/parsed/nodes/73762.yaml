  html: |-
    <p>Hey,</p>
    <p>I've been working this font for a while now, and now that I've finally sketched out all the letters, I'd really appreciate some critique on the overall design of the letters before I move on to spacing/kerning/doing more weights.</p>
    <p>In the design, I've tried to mimic several features of monospaced typefaces, keeping the typeface condensed, however allowing wider charecters like m, M, w and W. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/array_bold_preview_4386.jpg"></div><p></p>
    <p>I guess its not a good thing that I created the Bold weight first, but I guess a way to make it into a whole familiy would be to make a Light weight, and then use interpolation to create a Regular weight.</p>
    <p>I hope you'll like it, but please do not hesitate to point out the weak parts of it.</p>
    <p>Thanks in advance,</p>
    <p>Anders</p>
