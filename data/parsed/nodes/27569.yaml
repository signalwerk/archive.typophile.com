  html: |-
    <p>Starting to build a look/feel for my portfolio website. The attached image shows the latest version. One of my best friends (also a designer) commented that the ’dm’ logo and the “Dylan...” custom type compete instead of compliment each other. He suggested that I scrap the custom type and just spell out my name using a sans serif such as the one used in the navigation (which is House’s United ’face.)</p>
    <p>Do you agree that a simpler typeface like United would be a better visual compliment to the ’dm’ mark? Or should I keep this custom type solution?</p>
    <p>Typophiles, what say ye?</p>
    <p>Thanks,</p>
    <p>Dylan<br>
    </p><div class="imageWrap"><img src="/files/home_v3_lo5_LAYERS_3465.jpg"></div><p></p>
