    html: |-
      <p>Great feedback, everyone. Thank you for weighing in. I’m still a bit torn as to how to finish this ’problem.’ My gut check on this is still not quickly answering one approach or the other, although, if you put a gun to my head and said ’decide’...I think I would let the logo be curvalinear and leave the type more formal. Let the other subheads do the hand-drawn work. That’s where I’m at. </p>
      <p>Anyone else care to weigh in? As I mentioned in my other thread about this logo (see Personal Logo), putting the work in front of you maniacs is a sort of final review, as I highly respect the talent that surges through these forums.</p>
      <p>Again, thank you.</p>
