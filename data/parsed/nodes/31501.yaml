      <p>WhitePepper: "Kris - how do you get to see the ligatures in the type setter? What combination of keys do I need to press?"</p>
      <p>According to Chester this version of the mudTyper does not handle advanced OT features. Sorry about this! </p>
      <p>However, two new PDF files at KLIM. </p>
      <p>The<a href="http://www.klim.co.nz/pdf/KLIM-Feijoa.pdf" rel="nofollow"> Feijoa PDF</a> shows text settings and character sets of all styles. (The text is part of a story written by my very good mate R.D. Syde—no dummy copy here! )</p>
      <p>The <a href="http://www.klim.co.nz/pdf/KlimType-01.pdf" rel="nofollow">KlimType 01 PDF </a> is essentially a sample of typefaces, lettering &amp; work in progress by the KLIM Type Foundry. It shows the depth and breadth of our typographic work, plus a few sneak previews for those who are interested!</p>
      <p>Thanks for all the support so far, I really appreciate it!</p>
      <p>—K</p>
