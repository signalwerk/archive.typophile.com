  html: |-
    <p>Nearly 3 years ago, I discovered Typophile and the first type in the Critique area to catch my attention was the work of Kris Sowersby. I remember his early frustration as the work progressed and his joy as it moved to realization. I knew it was in him then and I am happy to see it out and about for the rest of the world to see. Bravo Kris and thank you Village for having the vision to see what a great contribution Kris has made to the type world.</p>
    <p>Go have a look and even a buy at:</p>
    <p><a href="http://vllg.com/KLIM/Feijoa/mudTyper+Weights/" rel="nofollow">http://vllg.com/KLIM/Feijoa/mudTyper+Weights/</a></p>
    <p>Regards,</p>
    <p>ChrisL</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/KrisBravo_4882.png"></div><p></p>
