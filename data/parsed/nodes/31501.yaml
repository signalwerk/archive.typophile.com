      <p>I have been an on and off typophile reader for, what I have just discovered, three years and two weeks. In that time I don't think I have ever posted anything. Pathetic.</p>
      <p>The only reason I know my membership length is because I had to go through the password rediscovery rigmarole to write this message.</p>
      <p>Why? The brilliance of Feijoa motivated me: the slackest of typophile readers and wannabe designers. It motivated me to post a message saying:</p>
      <p>Congratulations Kris. I am pleased to see what I always knew would happen, happen.</p>
      <p>I am also mighty thankful that I have been able to work with you since our sh*tty projects in first year.</p>
