    html: |-
      <p>Kia ora folks,</p>
      <p>Thank you all for your kinds words! Make it all worthwhile, gives me the warm &amp; fuzzies.</p>
      <p>Carl—<cite>Please oh please let that be a superfamily with Karbon, Karbon Serif</cite></p>
      <p>I will get around to that, eventually. Custom work will be taking up a lot of time though.</p>
      <p>Thomas—<cite>Karbon is from Kris Sowersby also?! Ich bin platt. I’m surely buy Karbon Serif, if it is available, i swear.</cite></p>
      <p>Glad you like it! Again, it is very much in progress. I won't release something I feel is unfinished.</p>
      <p>NIck—<cite>Where’s your great KLIM logo gone on the website?</cite></p>
      <p>I got sick of it, and it doesn't work at small sizes! I felt it was uneccessary, as I really wanted the new site to be black &amp; white &amp; simple &amp; type only.</p>
      <p>MetalFoot—<cite>That’s a lovely font. Mmmm… talk about inspirational! Having seen this I went out and worked on my first “get er done and then forget about it” font a little more.</cite></p>
      <p>Tell me about it. I have about 15 families in various states of completion. It is too easy to open one up, click around, then give up. Nothing like a deadline for inspiration!</p>
      <p>DavidBoldItalic—<cite>Chris, that’s inspiring to a kid like me. Beautiful typeface!</cite></p>
      <p>Chur bro—there's no time like the present. Get cracking!</p>
      <p>I'll also be adding a PDF of various type projects to the KLIM site pretty soon. I'll let you all know, if you are interested.</p>
      <p>—K</p>
