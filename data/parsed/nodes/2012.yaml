    html: "<p> Yeah, \"franchise parasites\": usually they just pay for the rights for a year, then once they have a customer base they save money by dumping the franchise and just changing some signs. Or sometimes not even: I remember a Tony Roma's on Cayman Islands that was no longer a Tony Roma's, except it still said so... And in Beirut there's *two* Hard Rock Cafes, but only one of them is the real thing - except you can't tell which! <br> <br>BTW, I think for Michelle's it was the donut cook who redid the signage... <br> <br>hhp </p>"
