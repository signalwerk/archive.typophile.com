      <p>While I would be more interested in less retro type designs, I can’t fault Maret for knowing his market.</p>
      <p>Fine books is not the only market for letterpress work today—there is also the whole area of special printing processes (letterpress, embossing, die-cutting, foil stamping, engraving, etc.) for high-end and/or arts sector job work.</p>
      <p>I wonder if P22’s Stern (Jim Rimmer) has found much use for that sort of thing.</p>
