    <p>Type designer/printer Russell Marat has launched a Kickstarter fundraising effort to have two new type designs engraved and produced in metal by the Dale Guild. </p>
    <p><a href="http://www.kickstarter.com/projects/2094022925/gremolata-and-cancellaresca-milanese" title="http://www.kickstarter.com/projects/2094022925/gremolata-and-cancellaresca-milanese">http://www.kickstarter.com/projects/2094022925/gremolata-and-cancellares...</a></p>
    <p>The page includes interesting text and videos explaining the project. </p>
    <p>Of most interest (both intrinsically, and because it serves to justify the expense of the project) was Marat's discussion of how composing foundry type differs from printing letterpress with polymer plates (which in the end can look indistinguishable, I suppose). He talked about the spontaneity available to the type composer that is lost in the plate process.</p>
