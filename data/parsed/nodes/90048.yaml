      <p><em>In order to make new private press books in the twenty-first century we need to have new typefaces.</em></p>
      <p>While Maret may be jaded with legacy foundry types, the “new” types he proposes conform to an antiquarian aesthetic.</p>
      <p>Is that the essential nature of private press practice, the best and only way it can maintain a viable niche?</p>
      <p>Would it not be possible to address contemporary design issues with a non-retro metal face — a sans serif, for instance?</p>
