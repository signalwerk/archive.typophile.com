      <p>I'm with Nick Shinn on this. It's dismaying that Russel Marat is looking 500 years back to design letterpress type appropriate for the early 21st century.  Much more interesting would be coming up with faces that owe little or nothing to the sensibilities of the 16th century. But, yes, his aesthetic is spot on for the private letterpress niche, alas.</p>
      <p>David</p>
