    html: |-
      <p>Thanks for the help. I’ve updated the original post with a new sample image and specimen. Here’s the rundown:<br>
      • Many spacing and kerning tweaks.<br>
      • All diacritical marks are larger/heavier.<br>
      • Fixed Eogonek<br>
      •&nbsp;Round letters are now wider and overshoot farther.<br>
      • S is wider. The old version was based on the original, which was pretty gross.<br>
      • A, M, N, V, and W now have pointy tips. I felt that this gave the face character that Coiner’s drawings had and the ATF metal type lost.</p>
