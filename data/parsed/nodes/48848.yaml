      <p>Just a few quick comments:</p>
      <p>I think the round letters and also A, V, W could use (more) overshoot. Like they are now, they look too small.</p>
      <p>I think the accents are a bit too light. The ogonek should be aligned to the right side on the E, as it is on the A.</p>
      <p>The S looks quirky (I haven't checked with Eagle, perhaps it's similar there). The transition from the straight line to the curve on top of B and D has a small bump.</p>
      <p>The left and right part of the O look too light compared to the top and bottom part, their weight needs optical correction (same goes for G and Q).</p>
      <p>Nice effort though, keep it going :)</p>
      <p>Jens</p>
