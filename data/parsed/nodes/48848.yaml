    date_raw: 11 Sep 2008 — 5:06pm
    votes: null
    html: |-
      <p>I considered going with larger diacritics, but there’s a problem of diminishing returns, aesthetics get worse as scale increases. To make the marks look good and be wider the marks need to become more chirographic (like Whitney by TFJ) and then they don’t harmonize well with the letters, and marks like ring and circumflex get gigantic.</p>
      <p>The original designs by Coiner and Benton didn’t have any diacritics. These are American letters from the 1930s that were intended to be used by a government agency and business tied to it. I don’t think that these letters would look like this if they had been designed for use in Europe. I guess that this is a novelty font to the core!</p>
