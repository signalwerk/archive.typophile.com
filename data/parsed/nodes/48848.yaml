      <p>Hrm; I feel almost like the diacitics don't necessarily need to be heavier, but that they do need to be much wider, almost crossing the entire letter.  These have such a block feel it's a bit odd to see them so skinny on both the X and Y scale. That's fine on the Y but the X needs to be a good bit bigger.  I dunno how the original drawings were. </p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
