    <p>This is Beagle Bold, my revival of Eagle Bold. It’s almost done and I hope to release it very soon under a Creative Commons attribution license (among other reasons, so that people can use it with @font-face without pestering me about licensing issues). Right now it’s going to support Latin-1 with a few extras tossed in; I plan to add more language support over time.</p>
