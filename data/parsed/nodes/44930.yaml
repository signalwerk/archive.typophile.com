    <p>I work at an agency that has been around for over 21 years.  The current logo was developed 12 years ago.  The logo fits with our semi slogan "Juggling Experts" as we explain to our clients how we help them juggle the 4 P's of marketing.  This serves as an excellent metaphor and selling tool for our sales leads.  </p>
    <p>We feel like the current logo does a decent job of conveying our whimsical/creative yet organized environment (e.g. our employees bring their dogs to work, and the dogs are free to roam the office, we're a little different from your typical agency).  However, we are currently reviewing our logo to determine if an update is needed, considering the cost (easily $10K) to convert all of our material (business cards, web site, letterheads, etc.) to a new logo.  </p>
    <p>We would like some more outside, honest opinions and reactions to our logo.  </p>
    <p>Does it make you want to know more about our company?<br>
    If you didn't know what we do, what industry would you think we were in?<br>
    What does it remind you of initially?<br>
    Does it seem up to date?<br>
    Does it convey what we do?<br>
    Does it inspire intrigue or confusion?<br>
    Is it too simple, silly, serious, corporate, common, or complicated?<br>
    Would it look better with a simple change in font or color scheme?</p>
    <p>We would love your thoughts, suggestions, and criticisms.  Should we keep it the same and save some serious cash?  </p><div class="imageWrap"><img src="http://typophile.com/files/dca_logo_5911.jpg"></div><p></p>
