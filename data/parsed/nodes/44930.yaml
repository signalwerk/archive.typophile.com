    html: |-
      <p>I agree that the acronym is a bit long, but I bet the clients, in and around his locale, have taken care of that. I.e. they probably have shortened it to DCA when they talk of their agency. When I started at a type house in 1981 the names we called customers did not even resemble their real identity. WE know, but how forthcoming is DA Design. It certainly is not obvious to the casual onlooker who DA is on first blush.</p>
      <p>The bottom line for me is the letterforms. They are fun, but maybe a bit too fun. About 3 hours on the board, I am old fashioned, and you could lend some credibility to the forms and keep the playfulness but at the same time add some integrity to them. The colors... well the beach ball kind of dictates that unless you went with more mature colors... but does that defeat the purpose of the youth ethos?</p>
      <p>I am so tired of Agencies who use letterspaced, boring, tried and trued, over-used fonts for their ID. Have some fun if it is called for. That is my calligraphic slant coming out! But make it above reproach!<br>
      Michael</p>
