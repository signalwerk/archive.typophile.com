    html: "<p>Great job Christian! <br> <br>I'm curious why the logo elements are weighted differently from the 3-color logo. In the 3-color logo, the \"ED\" is clearly the primary read, but in both of the 1-color logos the IFMSA and \"+\" are the primary elements. For a consistent message, you might try weighting the background circle more heavily, then screening back the IFMSA and \"+\". The EMERGENCIES &amp; DISASTERS can probably be black. <br> <br>RE: Poster <br> <br>I'm still in support of the globe and the doc sillhoette. I support them both for primarily the same reason. The globe assures that you are communicating a global aid organization, which is a cool thing to be a part of. The doc might look a little intimidating, but to me, it's almost like looking at a superhero</p>"
