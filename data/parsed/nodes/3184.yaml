    html: "<p>Christian: <br> <br>You've done a really good job applying the recommendations from this critique. You've made some great improvements. <br> <br>RE: Logo - I agree with Darrel, that connecting only half of the \"D's\" stem might keep it from dominating the logo. I suggest using the top half, as the bottom half may look like a backwards \"G\". Also, the \"+\" looks centered. Another way to decrease the dominance of the \"D\" might be to offset the \"+\" to the right. Tanya's suggestion about the circling type helped a lot. Much better. <br> <br>RE: Poster - I'm not sure that you have enough word spacing between \"BE\", \"A\", and \"PART\", and then \"OF\" and \"IT\". The space between \"PART\" and \"OF\" seems OK. The globe \"O\" works for me. The new logo definitely demands more attention than the globe, but I see a relationship between them that is advantageous. Because of the size and shape relationship between the logo and globe, it communicates to me that the E+D organization is global. I assume this is what you intended, and I think it works. <br> <br>Aloha! <br>Scott</p>"
    html_clean: "<p>Christian: <br> <br>You've done a really good job applying the recommendations from this critique. You've made some great improvements. <br> <br>RE: Logo - I agree with Darrel, that connecting only half of the \"D's\" stem might keep it from dominating the logo. I suggest using the top half, as the bottom half may look like a backwards \"G\". Also, the \"+\" looks centered. Another way to decrease the dominance of the \"D\" might be to offset the \"+\" to the right. Tanya's suggestion about the circling type helped a lot. Much better. <br> <br>RE: Poster - I'm not sure that you have enough word spacing between \"BE\", \"A\", and \"PART\", and then \"OF\" and \"IT\". The space between \"PART\" and \"OF\" seems OK. The globe \"O\" works for me. The new logo definitely demands more attention than the globe, but I see a relationship between them that is advantageous. Because of the size and shape relationship between the logo and globe, it communicates to me that the E+D organization is global. I assume this is what you intended, and I think it works. <br> <br>Aloha! <br>Scott</p>"
