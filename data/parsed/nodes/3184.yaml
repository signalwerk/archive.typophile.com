    html: <p>does the IFMSA not have an existing logo and/or is this green bar with the abbrev. it?  <br> <br>I ask because your explaination suggests that this ED unit is only 1 particular service or wing of the IFMSA - if so, should your symbol not include the real IFMSA logo so that the symbol your creating here will be the standard for all other dept or service symbols to follow.  - and then with that you may find that its going to get diffucult to design the ED part for units such as (I don't know) Nurses and Surgeons  - NS or Disease &amp; Research - DR. <br> <br>I think this might be what is the busy-ing factor - clarifying who the organization is and then what the service is. you have suggested ED twice - written and abbrev. - so this Emergency and Disasters seems to me the organizations primary purpose or even its name. <br> <br>I might say to  put emergencies and disasters around the circle and lose the fluff words - that way IFMSA stands alone and so does the circle - but they can be used together on top of each other too. <br> <br>or maybe I'm way off - who knows.</p>
