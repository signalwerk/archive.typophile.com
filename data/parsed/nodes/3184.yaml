  html: <p>Hi guys <br> <br>here is the new stuff i ve been working on. IFMSA(international federation of medicine students associations) ED will assist in diferent ways all over the world in case on an emergency or disaster <br> <br>the mission was to design a simbol that includes E&amp;D, i replace de ampersan with the plus symbol because it reminds me like a red cross but obviously with other colors. i use a simple language with the E and D and try to show a unified world for this cause. the letters are DIN from fontshop international beacuase i find it very transparent and simple thinking on the universality of the logo.  <br>Once a have all done, the solution of the E and D remids me too much to the CE of the European Union, is just me or this means reconsider the logo? <br> <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/26755.gif" alt="logo"> <br> <br> <br>i also develop a poster to call for apllications, what do you think about it? <br> <br> <br><img src="http://www.typophile.com/forums/messages/29/26756.gif" alt="poster"> <br> <br> <br>thanks for the feedback</p>
