    html: "<p>I'm not convinced that the \"D\" is evident enough. You might need to somehow connect the \"D's\" stem to the \"+\" symbol or some other alternative. To simplify the logo you could consider separating the elements of the logo and creating a style/usage guide to control their application. For example, the circular mark is either first read (usually top right) or it is incorporated into the primary graphic design (as in your poster) and the \"IFMSA-EMERGENCY &amp; DISASTERS\" is a tertiary read via positioning or size relative to the circular mark. BTW, where does 3M come into the picture? Are they the primary sponser? <br> <br>RE: Poster (only read this if you care to read my take on it as a communicator) <br> <br>\"BE PART OF US\" works great graphically, but it reads funny. Some alternatives might be \"Take Part With Us\", \"Come Join Us\" or just \"Join Us\", \"Be a Part of It\", etc</p>"
    html_clean: "<p>I'm not convinced that the \"D\" is evident enough. You might need to somehow connect the \"D's\" stem to the \"+\" symbol or some other alternative. To simplify the logo you could consider separating the elements of the logo and creating a style/usage guide to control their application. For example, the circular mark is either first read (usually top right) or it is incorporated into the primary graphic design (as in your poster) and the \"IFMSA-EMERGENCY &amp; DISASTERS\" is a tertiary read via positioning or size relative to the circular mark. BTW, where does 3M come into the picture? Are they the primary sponser? <br> <br>RE: Poster (only read this if you care to read my take on it as a communicator) <br> <br>\"BE PART OF US\" works great graphically, but it reads funny. Some alternatives might be \"Take Part With Us\", \"Come Join Us\" or just \"Join Us\", \"Be a Part of It\", etc</p>"
