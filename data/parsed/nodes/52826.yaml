    <p>Hello,</p>
    <p>I was wondering if the typophile and general type and design community could petition to have the type face/family of Haas Unica to be commercially available again?</p>
    <p>It is such a wonderful san serif face and it is truly a shame that the type and design community cannot use this face.</p>
    <p>Regards, Sal</p>
