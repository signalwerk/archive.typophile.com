      <p>A distinction should be made -- but seldom is -- between utterances and other kinds of text indicated by quote marks, such as cited content, i.e. a distinction between</p>
      <p><em>Jim said, ‘Praise the Lord, and pass the ammunition.’</em></p>
      <p>and </p>
      <p><em>On page 36, the author has Jim say ‘pass the ammunition’.</em></p>
      <p>The reason for this is that although only part of the first sentence is enclosed in quotes, indicating the spoken words, the utterance is the whole meaning of the sentence, whereas in the second sentence the cited words are subordinate.</p>
