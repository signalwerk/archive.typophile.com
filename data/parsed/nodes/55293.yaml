      <p>Joe, there are countries whose governments take a fairly direct interest in things like spelling, about which it might be accurate to say that they have prescriptive national 'rules' about such things. It is notable, though, that even within such countries individual publishers, some of them significant and influential, ignore those rules. Recent German spelling reforms are not universally implemented. Some Greek publishers continue to use polytonic despite the monotonic system having been the official rule since 1982.</p>
      <p>There are not, in fact, national rules. There are widely observed conventions and there are also variations. There are indeed rules for e.g. government publications, but in that respect the government is just one more publisher, and other publishers may employ variant rules in their own house styles.</p>
      <p>I long ago determined that the prevailing British conventions for punctuation made more grammatical sense and looked better on the page. So that is what I use. This isn't 'ignorance': I know what other conventions are common in Canada. I disagree with them, and I'm not generally in favour of doing what other people do just because they are doing it.</p>
