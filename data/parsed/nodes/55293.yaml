      <p><em>"...single quotes are “compatible,” as you put it, with most “smart quotes” layout software ... or even Word. Smarty Pants, used here on Typophile, is one of the exceptions"</em></p>
      <p>What I meant was that although the single quote style works OK for quote marks , it's incompatibility is that it screws up abbreviation marks.  But if this problem is solved, as Smarty Pants has, then the single-quote style of quote marks doesn't work.</p>
      <p>As the Smarty Pants system is the only way of converting hash marks to curly quotes (short of adding a dictionary) and not rotating the apostrophes used in abbreviations, and it works with the North American quote style, rather than the UK, it is arguable whether the merits of the UK quote style are sufficient to warrant the extinction of the "single-quote-right" shape of apostrophe, which will probably occur as a result of "curly quote" layout software.</p>
