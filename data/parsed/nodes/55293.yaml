      <p>John, I think we both know you can dress it up in logic all you want, but you’re just arguing for the superiority of the system you grew up with and that matches your spoken accent.</p>
      <p>It’s <a href="http://blog.fawny.org/2006/02/08/apostrophe/" title="The inferiority of British ‘house style’" rel="nofollow">easy to find counterexamples</a> to the claimed superiority of British house style, since English words can begin or end with an apostrophe, which is one of the two punctuation marks used for first-level quotations in British.</p>
      <p>The option of using British rules for periods and commas but double quotes in first instance is marginally less ridiculous.</p>
      <p>—<br>
      Joe Clark<br>
