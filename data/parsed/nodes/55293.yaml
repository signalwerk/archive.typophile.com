    <p>Whenever I write a quote at the end of a sentence and the quote has an end period I wonder, is it </p>
    <p>"quote text." ?</p>
    <p>or</p>
    <p>"quote text.". ?</p>
    <p>or maybe</p>
    <p>"quote text". ?</p>
    <p>I think the obvious way would be the second one, but then again, it looks really funny, like one of those horizontal emoticons =^.^=<br>
    What are your thoughts on this?</p>
