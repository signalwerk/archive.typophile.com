      <p>This comes up quite often as a newbie question, and the answer can be found in a style guide for whatever country you live in. U.S. and Canadian style is to place periods and commas inside quotation marks always (double first, single for quotes inside quotes). There are highly unusual exceptions, as in computer code and linguistics, that will surely never affect you.</p>
      <p>The dominant but not sole U.K. style is to place periods and commas inside quotes only if the quote is an actual human utterance. (So no androids!) Otherwise outside. Single-double, not double-single, is the dominant usage.</p>
      <p>Other countries can barely get their acts together in the first place, and I don’t know what system they use. </p>
      <p>Nonetheless, you <em>cannot</em> just pick and choose an orthography based on what you, out of ignorance, think looks nice.</p>
      <p>—<br>
      Joe Clark<br>
      <a href="http://joeclark.org/" title="http://joeclark.org/">http://joeclark.org/</a></p>
