      <p>Joe, where are these rules written down, and under what authority? Where does a newcomer to Canadian punctuation conventions go if he wants to learn the correct way to do things?</p>
      <p>In what sense are publishers who use alternative conventions, such as British conventions, ‘safely ignored’? They presumably publish books, and presumably people buy and read these books. And since they're Canadian publishers, odds are that at least some of them receive government grants, despite their punctuation. They might not have any influence over how other Canadians use punctuation, but I'm not saying that they should have any influence. I do think, however, that variance in punctuation use, so long as the meaning of the text is unambiguous -- which is not the case, by the way, when punctuation is always placed within the quote marks regardless of whether it was part of the quote utterance -- is an acceptable cultural phenomenon, especially in a country that prides itself on its diversity.</p>
