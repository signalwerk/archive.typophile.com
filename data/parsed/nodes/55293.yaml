      <p>He explains that the quotes style he use is an European style, it is found on the first comment after the article.</p>
      <p>   It is. But I take issue with the American style: I always put<br>
         the period or comma where the context needs it. If the quote<br>
         has a point after it, like a complete sentence, it’s included<br>
         in the quote:</p>
      <p>      Groucho Marx said, “I wouldn’t join a club that accepted me as a member.”</p>
      <p>   (Now, there should logically be a second full point to finish<br>
         the sentence around the quote, but in German, we neglect that.) But:</p>
      <p>      He always got gas at the “76”.</p>
