      <p>But then how do the rules apply for guillemets in English? When are the singles and doubles used, which direction should they point on opening and closing, and how are they positioned relative to punctuation? Except for the benefit of not being confused with apostrophes and other similar marks, guillemets present the same challenges as the more familiar (to most English writers) quotation marks. Are not the languages that use guillemets inconsistent with their application from one to another as well?</p>
