      <p>I agree with John. When typesetting German, whenever I'm given the liberty by the editor, I employ pre-spelling reform rules rather than the current "correct" ones – they simply make more sense grammatically, and in terms of what people are still used to reading. – Different example: in German it is a rule not to set ligatures across word breaks in compounds; but I still do that with certain fonts, depending on the actual design of the ligature, and it works just fine.<br>
      I believe that knowing the rules and abandoning them in some occasions and for good reasons does not constitute the same crime as ignoring them and just doing whatever. Slavishly adhering to rules without questioning their sense and benefit is much worse IMHO.</p>
