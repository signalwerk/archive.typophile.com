      <p>&gt; so not really part of grammar</p>
      <p>Actually I should know better than to offer such a qualification, because<br>
      It's Not So Simple™. There is no purity - no way to decide all the time for<br>
      everybody if a mark on the paper is one symbol or the other; in some cases<br>
      the ambiguity is great enough that some threshold is crossed. Specifically I<br>
      offer that favorite "hybrid" of mine from that other thread - something I've<br>
      called "quotemets":</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/quotemets_6067.gif"></div><p></p>
      <p>So are those quotes, or guillemets? They look like quotes (although<br>
      they're mirrored, not 6/9) except they're not high enough... They<br>
      look like guillemets, except for those knobs... Typographically they<br>
      can't be "incorrect", but can they even be grammatically "incorrect"<br>
      if you can't convince enough people they're not really quotes (if it<br>
      was English text) or guillemets (for that French text)?</p>
      <p>Very often, even if you have adopted strict rules and want very<br>
      much to follow them, you can't, because it escapes your realm.</p>
      <p>hhp</p>
