      <p><em>I always put the period or comma where the context needs it. If the quote has a point after it, like a complete sentence, it’s included in the quote...</em></p>
      <p>Very sensible. That is the thinking behind the UK convention, and it makes a lot of sense.</p>
      <p>It is also helpful to think about it this way: if an entire sentence is a quotation, then all the punctuation of that sentence, including the terminal fullstop, is part of that quotation and hence the fullstop belongs within the quote marks. If a quotation is only part of a sentence, then the terminal full stop belongs to the sentence as a whole and not to the quote, and hence the fullstop belongs outside the quote marks.</p>
      <p>Most Canadian practice seems to follow the US model, which I consider arbitrary and without grammatical logic. But I'm enough of a colonialist to maintain that any UK practice is legitimate in this dominion.</p>
