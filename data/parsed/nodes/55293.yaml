      <p>Jason, I think people will take a few seconds and then know exactly what they're looking at when they see guillemets for the first time in English*, and after that they'll go with the flow. I would point them outward, but not use single guillemets; for nested quoting I would fall back on double high quotes (which is what French does I believe). This is in fact also an improvement: resorting to nested high quotes (either double-then-single or vice versa) is even more confusing. For the two important drawbacks that high quotes suffer from, guillemets are superior; and I don't see any drawbacks (after the initial surprise).</p>
