    html: |-
      <p><em>"Are not the languages that use guillemets inconsistent with their application from one to another as well?"</em><br>
      Yup. French has them pointing outwards and adds spaces on the inside, German has them pointing inwards with no spaces and Switzerland has a mixture of the two (pointing outwards with no spaces).<br>
      I guess the good news about this is that all those variants work, and are recognized as what they are. When Swiss people read German text, I don't think they believe the inwards-pointing guillemets are "wrong".</p>
