      <p>&gt;If you have enough leading between lines and appropriate line length, extra space between paragraphs is not necessary. In extended, continuous reading texts, such as novels, it is hardly ever done.</p>
      <p>But that form does normally use an indent on paras after the first, which is a good alternative for extended text.</p>
      <p>I also go for half line spacing in multi-column work (I use align to the baseline grid as well as space after values), I far prefer non-aligning bottom lines of columns to adjusting leading to align because it's not always practicable and it affects the colour within the text. For single column work I think you can use a different figure and rely on the inner margins to separate the columns sufficiently for non-aligning lines across the pages to be unnoticeable, added to which in a high-volume, low-budget run it is rare for the pages to exactly align.</p>
