    html: |-
      <p>I generally use an indent for any paragraph after the first, unless it follows a head. When I do add space btw paragraphs (no indent then) I do it using Space Before, not Space After. I was taught this by a former typesetter. If you add the space before, it's attached to the paragraph itself not the preceding paragraph which means you can have a separate style sheet for the first paragraph with no space before, and also it won't affect any heads or following typographic elements. I hope this is clear.</p>
      <p>Always build the space (whether before or after) into the style sheet itself even if it's a full line space. Good typography is about MINIMIZING superfluous characters, such as an extra return (which will come back to haunt you, say, at the top of a column). This is also why a paragraph indent should be in the style sheet itself rather than a tab character.</p>
