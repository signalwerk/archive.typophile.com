      <p>I'm with Stephen when it comes to InDesign.</p>
      <p>My general rule-of-thumb is to add 50% space after a paragraph than leading: i.e., 10 pt text, 12 pt leading, 18 pt space after each paragraph for body text.  Of course, that depends on the face....</p>
      <p>Setting heads is different: I usually use a mix of Space Before and Space After to account for times when you have various levels of heads with text following them.</p>
      <p>As always when dealing with stuff like this, YMM, and certainly W, V.</p>
