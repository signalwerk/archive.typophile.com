      <p>Traditionally, extra paragraph leading, in your understanding James, is more likely to occur in advertisements and packaging than books and editorial. A bit of an oddity, really.</p>
      <p>In page layout applications, it gets more prominence on the palette than its use might merit, as it is a basic variable, and very useful in one particular circumstance -- when going from one size of type and leading to another, such as between deck and main text or between text and smaller quoted matter. in fact, this is its main utility, not for adding extra leading between paragraphs of the same spec.</p>
