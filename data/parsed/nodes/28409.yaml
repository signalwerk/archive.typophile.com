      <p>I usually use indented first line of paragraphs, since I find this least disturbing both for the texture on the page and for the reading process. </p>
      <p>When I use 'align to baseline grid' for the text in InDesign, I usually like to give uneaven space above and below subheadings (that appear in the middle of a column). The way I do this is to assign the subheading the amount of space above and below that will give it a blank line above and below. Then, to pull it a little closer to 'it's' paragraph (the one below) I give it a 'baseline shift' in the minus/negative range.</p>
      <p>Don't know if this is a frowned upon way to do it, but it has worked so far. The problem is when the subheading appears on the top of a column/page, since it (the subheading) then won't align right with the top of the other columns.</p>
