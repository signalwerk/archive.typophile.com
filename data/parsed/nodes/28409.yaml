    <p>What's generally considered better form when spacing paragraphs - following the paragraph with a full space using the same leading as the rest, or manually leading the space between the paragraphs to slightly less than a full line? </p>
    <p>I was taught to use manual leading, but it's recently been pointed out to me that not only is doing it this way a pain in the neck when layout changes, but that it also breaks up the alignment of baselines in pages with multiple columns of text. I'm inclined to agree with the latter–but what's generally preferred by typographers?</p>
