      <p>Certainly I agree with you, William, that book settings such as novels do not want, or need, secondary lead between paragraphs.</p>
      <p>The argument is that a full return can be excessive when secondary lead between paragraphs is used. This is especially true in multi-column settings with narrow gutters. And yet we still want the first line and the last line, in multiple columns, to be aligned. Therefore we need to add space (or delete space) between lines and between paragraphs to *justify* the depth of each column (or *feather* it, as Felici defines it).</p>
    html_clean: |-
      <p>Certainly I agree with you, William, that book settings such as novels do not want, or need, secondary lead between paragraphs.</p>
      <p>The argument is that a full return can be excessive when secondary lead between paragraphs is used. This is especially true in multi-column settings with narrow gutters. And yet we still want the first line and the last line, in multiple columns, to be aligned. Therefore we need to add space (or delete space) between lines and between paragraphs to *justify* the depth of each column (or *feather* it, as Felici defines it).</p>
