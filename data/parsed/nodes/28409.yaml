      <p>50% extra leading is good, you can still make the lines even, then, by adding 150% extra leading before a subhead or something.</p>
      <p>Thus, in the case of 10/12 pt. text and 18 pt. space between paragraphs, the space before sub heads should be 30 pt., so that:</p>
      <p>50% + 150% = 200% (a multiple of the leading)</p>
      <p>Or if you can control the text matter, make sure that every page has an <em>even</em> number of space-inbetweens, so that:</p>
      <p>50% + 50% = 100%<br>
      50% + 50% + 50% + 50% = 200%<br>
      etc.</p>
      <p>This might impede the overall color of the page, especially when seen through the paper, but at least you'll get an even baseline down at the bottom margin.</p>
      <p>By the way, what page of <em>The Elements</em> was this taken from? I remember that Bringhurst have said it somewhere.</p>
