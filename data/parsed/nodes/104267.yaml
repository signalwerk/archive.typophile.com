      <p>Over 12 hours &amp; no match. I don't have one either.<br>
      Proverbe looks similar to the condensed version of Corvinus, designed by Imre Reiner around 1930, which was sold as Skyline. But Proverbe does not have the very flattened sides of the round letters used in Skyline. Other suggestions?<br>
      Don</p>
