      <p>A great many old fonts have never been digitized.<br>
      But sometimes I can find a match in an old catalog or other source. So at least you can get a name, even if there is not a precise digital match.<br>
      If you have any idea of the source of these images it would help. For example wood type museum, &amp; where. If its "found on the web" a link would help with digging.<br>
      Don</p>
