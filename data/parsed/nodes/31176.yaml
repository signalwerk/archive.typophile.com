  html: |-
    <p>Right now I’m still hashing stuff together in Illustrator, trying to master bezier curves and such. I want to start maybe putting stuff together into an actual font file. I have FontForge, but talk about a learning curve! Youch! Add that to the fact that I have to run it on X11 on my mac, and it doesn’t seem the best learning environment.</p>
    <p>I’m wondering if TypeTool is the best next step to follow? I’m a broke student, so buying a full-fledged Fontlab or Fontographer isn’t really an option right now. What do you guys think? Should I just wait and save the dough? Or should I spend the money and try to learn what I can right now?</p>
