      <p>Dan, jpad, Linda, </p>
      <p>Note that all products from Fontlab Ltd. carry a 60-day money-back satisfaction guarantee. This means that if you buy a product today and Fontlab Ltd. releases a new version within two months, you can buy the new version and have a refund for the old version credited against your purchase — this is functionally equivalent to “buy version 2 today and get version 3 free in 2 months” (if the new price is the same as the old one, otherwise you’ll need to pay the difference). If more than 2 months go by, you would need to pay the upgrade price. </p>
      <p>However, as we’re very close to releasing all-new TypeTool 3, you may as well hold off for a few weeks unless you have a prompting need to get something done right now. </p>
      <p>Currently, TypeTool 2 is $99. We have not yet announced the pricing for TypeTool 3 but my guess is that it will be in the same price range. </p>
      <p>Adam</p>
