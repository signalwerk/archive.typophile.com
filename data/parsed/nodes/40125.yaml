      <p>I think Monaco was named that as part of the original Apple font set with place names. I recall Geneva being another. The fact that it was a mono probably made calling it Monaco easier. They were made by Bigelow &amp; Holmes. </p>
      <p>According to Mark Simonson here:</p>
      <p><a href="http://typographica.org/000785.php" title="http://typographica.org/000785.php">http://typographica.org/000785.php</a></p>
      <p><cite><br>
      Here's a list of the Mac "city" fonts:</cite><br>
      <cite><br>
      Chicago*<br>
      Geneva*<br>
      New York*<br>
      Monaco*<br>
      Athens*<br>
      San Francisco*<br>
      London*<br>
      Venice*<br>
      Toronto* **<br>
      Taliesin<br>
      Cairo<br>
      Los Angeles<br>
      </cite><br>
      <cite><br>
      *Shipped with the original Mac.<br>
      **Dropped after one of the first system updates.</cite><br>
      <cite><br>
      Microsoft had one, too, which was included with MultiPlan called Seattle. It came in 10- and 20-point. I recall that it was the first Mac font in those sizes. The 10- and 20-point versions of Geneva came later.<br>
      </cite><cite><br>
      One other bit of trivia: The version of Geneva that came with the first release of the Mac system software had a one-story lowercase a. It was changed to two-story with the first system update.<br>
      </cite></p>
      <p>I realize I haven't answered the question completely but I hope this helps.</p>
