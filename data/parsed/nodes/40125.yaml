    <p>Is monaco called monaco because it contains, in proper order, the letters which form the word 'mono' (because it is a monospaced font)?</p>
    <p>Just wondering, I bet it's been pointed out before and it's probably laughably obvious. But I thought it was (borrows American slang) kinda neat. Sorry to bore you.</p>
