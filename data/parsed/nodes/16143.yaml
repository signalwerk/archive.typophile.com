    html: "<p>There is one other strategy with regard to font caches in OS X: Using a utility to clear the caches. Font Finagler will do this as will Font Explorer X. It works, but it has a big drawback in that you have to restart every time you do it. If you are doing a lot of change/test cycling, this can be very annoying and time-consuming. I don’t recommend it, especially because there are easier methods, like the ones I mentioned earlier.</p>"
