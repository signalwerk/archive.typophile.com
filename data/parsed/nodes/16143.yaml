    html: |-
      <p>The kerning table/kern feature thing gave me problems for a while when I first was using FontLab a year or two ago and generating OT fonts.</p>
      <p>My understanding is that kerning tables are not saved with CFF OTF fonts, although I think it is possible. Even so, you don’t want to do it.</p>
      <p>Also, look at your kern feature after it is generated. If you see any pairs which directly reference glyphs. For example:</p>
      <p>&nbsp;&nbsp;pos A T -30;</p>
      <p>instead of</p>
      <p>&nbsp;&nbsp;pos @_kernlA @_kernrT -69;</p>
      <p>_kernlA and _kernrT are classes; A and T are just glyph names. For reasons I don’t understand, if any entries in your kern feature are NOT classes, there will be problems in some applications. The way to remove the non-class pairs is to go through your kerning pairs (open a Metrics window; click on the little K to activate kerning; click on the “Kerning Dialog” button to the right of the button with the red X) and delete any pairs in which either side is not the primary glyph of a class (that’s the one which comes first in the class and has a tick mark [‘] next to it).</p>
      <p>After doing this, redo the Apply and Save thing. Keep doing this until you only have class-based kerning pairs in the kern feature.</p>
