    html: |-
      <p>(I wrote these answers while Mike was posting, so there may be some redundant info.)</p>
      <p><em>1. Should I test them in fontbook or suitcase I have different results in each.</em></p>
      <p>Reinstalling a different version of the same font serially will result in problems because of the various font caches used by OS X. There are several strategies that I know of.</p>
      <p>One is to avoid font managers and install fonts directly into the Adobe’s private Font directory ([startupvolume]/Library/Application Support/Adobe/Fonts/). This means your fonts are only available to Adobe apps, but the apps don’t seem to have cache problems when you use this approach.</p>
      <p>Another strategy is to change the name of your font every time you generate a new version. You can install such fonts any way you like, but it’s an extra step to keep changing the name.</p>
      <p><em>2. Exporting as .otf. Is there any benefit to .ttf</em></p>
      <p>It depends. If you are working with Type 1 curves (beziers) there will be a conversion process when you save as TTF which you don’t have direct control over. Also, hints will be automatically converted to TT instructions, again without your direct control. Neither seems like a good way to test. If you are working in TT curves and building hints with TT instructions, that would be different.</p>
      <p><em>3. Would like them to be a true cross platform font (reason for using opentype). Is this too lofty of a goal. I have heard of many problems with this. Solutions?</em></p>
      <p>It is possible. There are some good tips on the FontLab forum, written by Adam Twardoch. Look in the “Tips” section. Particularly look at the article about naming. (Mike linked to this above.)</p>
      <p><em>4. My kerning pairs don’t show up when using them in an application. They are as if I didn’t make any. what am i doing wrong?</em></p>
      <p>It could be that you have not built a “kern” feature for your font. There is an option to do this automatically when you save an OpenType font. It’s better to do it manually by using Class Kerning. It’s not exactly obvious how to do this. Here is the procedure:</p>
      <p>Create your left and right glyph classes (see the manual on how to do this). Kern the primary glyphs using the Metrics window. IMPORTANT: Make sure you don’t do kerning pairs for any other glyphs. Do “Kerning Assistance…” from the Tools menu. Click on the “Apply and Save” button. Now you will have your “kern” feature. You need to do this whenever you change the kerning.</p>
      <p>An additional step if you have more than 100 class kerning pairs: Insert “subtable;” about every 100 lines in the kern feature definition. If you don’t, you will get erratic kerning in non-Adobe applications. I don’t know why this is, but it works.</p>
      <p>One more thing: The old-style kerning table is ignored in CFF OTF fonts.</p>
      <p><em>5. I have fonts with light, medium, bold, etc. When turning them on it doesn’t seem to recognize the whole set some are missing. I have read through many posts and the manual can only get it right with luck it seems. help?</em></p>
      <p>See Adam’s article on naming mentioned above.</p>
      <p><em>6. When typing with the fonts and the weights do show up there is for example a line of text in bold and a line in regular. When they print, they come out the same, either both bold or both regular… WTF?</em></p>
      <p>I’m not sure, but it is probably a caching issue. The methods I explained in my answer to question #1 should help with this.</p>
