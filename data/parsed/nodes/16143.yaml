      <p>About FOND IDs:<br>
      <em>As of this writing [01-March-1991], nearly all major applications identify families by name, and since Font/DA Mover and System 7.0 renumber conflicting families when copying fonts, there should never be confusion except when using newer fonts on old software which references by number.</em> <a href="http://developer.apple.com/technotes/te/te_02.html">Apple Technical Note</a></p>
      <p>So, as long as the number you put in the field next to the script selected is within the range (see image), you’re safe.<br>
      </p><div class="imageWrap"><img src="files/fond_id.png"></div><br>
      Tip: Fontlab will automatically generate a random number within the script’s range, when you switch between scripts.<p></p>
