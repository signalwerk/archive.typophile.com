    <p>I have pulled out 80% of my hair trying to tackle these problems…I haven’t posted here before so hello to all…</p>
    <p>(I am working on a Mac OSX tiger on Fontlab 4.5)</p>
    <p><strong>1.</strong> Should I test them in fontbook or suitcase I have different results in each.</p>
    <p><strong>2.</strong> Exporting as .otf. Is there any benefit to .ttf</p>
    <p><strong>3.</strong> Would like them to be a true cross platform font (reason for using opentype). Is this too lofty of a goal. I have heard of many problems with this. Solutions?</p>
    <p><strong>4.</strong> My kerning pairs don’t show up when using them in an application. They are as if I didn’t make any. what am i doing wrong?</p>
    <p><strong>5.</strong> I have fonts with light, medium, bold, etc. When turning them on it doesn’t seem to recognize the whole set some are missing. I have read through many posts and the manual can only get it right with luck it seems. help?</p>
    <p><strong>6.</strong> When typing with the fonts and the weights do show up there is for example a line of text in bold and a line in regular. When they print, they come out the same, either both bold or both regular… WTF?</p>
    <p>Thanks for your help in advance</p>
    <p>{Moderator: neutura. it was suggested that numbers be added to your questions to assist in answering your questions. hopefully you don’t mind. miss tiffany}</p>
