  html: <p>Michael Browers announced the launch of a redesign of his website, <a class="freelinking external" href="http://www.michaelbrowers.com" rel="nofollow">http://www.michaelbrowers.com</a>. The redesign features his retail fonts, custom fonts and logo &amp; lettering services. Additionally, the website includes a "Fonts in Use" section.</p><div class="imageWrap"><img src="http://typophile.com/files/MB_Web_Screenshot_5553.jpg"></div><p></p>
  html_clean: <p>Michael Browers announced the launch of a redesign of his website, <a class="freelinking external link-external" href="http://www.michaelbrowers.com" rel="nofollow">http://www.michaelbrowers.com</a>. The redesign features his retail fonts, custom fonts and logo &amp; lettering services. Additionally, the website includes a "Fonts in Use" section.</p><div class="imageWrap"><img src="/files/mb_web_screenshot_5553.jpg"></div><p></p>
