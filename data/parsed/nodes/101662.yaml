      <p>Don't get me, the original design of FrankRuhl was a tremendous contribution to Hebrew type design. Linotype created three weights of FrankRuhl by a then young Mat Carter, instilling genius into genius. When I met with Linotype's head of type in Germany, at their US headquarters, I was shown his magnificent drawings from decades earlier.</p>
      <p>If Tzvika had them, he could make three new faces. I however created them for private use in 1993. I will post samples of them, for Tzvika and Boruch G., my friend, to drool over. :)</p>
      <p>These Hebrew faces were the result of Mat's brilliant work on Times-Roman, as I explain shortly.</p>
      <p>The head German type man, flown in at the expense of Linotype Germany showed me a special one of a kind poster. It showed Times-Romans in three weights or sizes, but at 144 point type. The most radical differences were in the w and the m. The W and M each have three vertical strokes, very close to each other. Mat redrew them farther apart at the three different sizes. So, the w or m at 6 point differed radically at 12 and 18 point etc.</p>
      <p>Even Adobe's Multiple Master technology could not address Mat's idea. After I digitized his version of FrankRuhl, I saw that Mat introduced this idea to the Hebrew world of type. But OpenType, either in Microsoft's graphical VOLT software, or in the more advanced Adobe DOS-like FDK, could not support Mat's idea.</p>
      <p>So, together with Scott-Martin K., an outstanding substitute for Mat :), I decided to introduce SuperType, a quantum leap, like the short-lived QL was to Apple Macintosh, IBM PC (remember that Boruch?), and even UNIX the aging dino.</p>
      <p>The QL had a UNIX-like OS, called Q-DOS, a easy to use interface, called Super-Basic, and hid the CPU in the fat keyboard, that had two (shitty) tiny tape drives too. Steve Jobs trembled - Oh no, Sir Sinclair ripped everyone off. Sir S. even invented a new type technolgy that to this day I can't understand yet...Scott, how did Sinclair do it. Clive, if you read this, email me a lesson in what you did.</p>
      <p>Getting back to SuperType, it is basically OpenType II, and is compatible with Adobe InDesign CS 7 and higher, and MS Word 2000 and higher in a truncated way.</p>
      <p>SuperType takes the best of VOLT, FDK, is written in Python by those guys who brought you RoboFont. Hi!</p>
      <p>Basically, a font created in SuperType, or ST, automatically applies all rules of Hebrew grammar (yes, David, all), plus causes letters to have different dimensions at different sizes.</p>
      <p>Hence, one FrankRuhl font will appear differently at 6 point, 9 and 10 point, 12 point, 14 point, 18 point, and so up.</p>
      <p>Also, Romm-Vilna, and Romm-Rashi, also appear differently at different point sizes.</p>
      <p>For the first time in history, the entire Bible will appear with shva-na, komatz katan, and various different metegs. Furthermore, they will have an important commentary, called DASH (Dikdukei Shlomo), explain to Jewish child the rules of Hebrew in simple and easy to understand explanations, just Rabbi Adin (Steinsaltz) Even-Israel, and Rabbi Dr. Twersky, did in their great books.</p>
