      <p>The original Computer Modern font, useful as it may have been to get mathematical papers into some sort of printed form cheaply by computer, was indeed a failure by typographical standards.</p>
      <p>But part of that was simply because Donald Knuth wasn't a professional type designer. Metafont may well have been an adequate, if limited, tool to design some categories of typeface - imitation Carolingian hands, blackletter, uncials, calligraphic faces, and so on and so forth.</p>
