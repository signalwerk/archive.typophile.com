      <p><cite>Rather, Dr. Donald Knuth, is a brilliant but more complicated system. Hence, his TeX system never became popular.</cite></p>
      <p>Actually, TeX is quite popular, but you're right that the original Metafont never became popular. But it wasn't so much because it was <em>complicated</em>, as because it specified typefaces by the movements of an imaginary pen rather than their outlines. Thus, it was suited to the creation of original typefaces, but not to digitization of existing typefaces.</p>
