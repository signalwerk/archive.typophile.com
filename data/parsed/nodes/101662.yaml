    <p>The team of Fronk, an earl;y German type designer, and Ruhl, a master punch cutter of type, came about in the early 20th century as a reaction to immense useage of the Ro9mm-Vilna typeface design used by most of literate Jewish world.</p>
    <p>Putting the religious motives behind of most Reform German Jews and their utter distain of their Orthodox and Chassidic cousins, the popular design of Fronk-Ruhl was invented in . see <a href="http://www.myfonts.com/fonts/masterfont/frank-ruhl/" title="http://www.myfonts.com/fonts/masterfont/frank-ruhl/">http://www.myfonts.com/fonts/masterfont/frank-ruhl/</a> and <a href="http://www.linotype.com/473134/FrankRuhl-family.html" title="http://www.linotype.com/473134/FrankRuhl-family.html">http://www.linotype.com/473134/FrankRuhl-family.html</a>.</p>
    <p>Masterfont writes:<br>
    About this font family<br>
    Designers: Hausman<br>
    Design date: 1936</p>
    <p>Linotype writes:<br>
    FRANK RUHL FONT FAMILY<br>
    Designed by Frank+Rühl in 1936</p>
    <p>Who was Hausman?</p>
    <p>Of course, the version marketed by Tzika of Masterfont is not that which created in three weights by Linotype, cut in metal, and never digitized by for in PostScript/TrueType/Opentype as a scaleable outline typeface either with French bezier curves favored by Adobe, or (American) quadratic curves favored by Apple -</p>
    <p>there are two other mathematical systems, created by Sir Dr. Sinclair of the UK, and an American Dr. Donald Knuth - each of latter pair not outlines typefaces at all. Rather, Dr. Donald Knuth, is a brilliant but more complicated system. Hence, his TeX system never became popular. Sir Dr. Sinclair made the other systems seem babyish in comparison, was greater than brilliant, and the horizontal axis by the vertical, and was the UK's answer to DOS, UNIX, the IBM PC, and the Apple. It was called the Sinclair QL (Quaturm Leap). This is another.</p>
    <p>The original design differed, and Linotype's original designs improved upon that, too, and was digitised by FontWorld in 1993. It will appears as very advanced OpenType version, known as SuperType for use on Adobe InDesign CS 7.70 with the SuperType plug-in and SuperType script.</p>
