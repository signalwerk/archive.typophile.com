  html: |-
    <p>This sample comes from a musical score for Carl Orff's Carmina Burana, and I think it's a reproduction of a 1930s original, but I could be wrong.</p>
    <p>I've got a couple more samples, but mostly of the same letters.</p>
    <p>What the Font pointed me to a superficially similar face called Bellini, which cited as inspiration the 1923 face "Gans Progresso", but from a sample I found, it lacked the extreme axis this type's 'o' had.</p>
