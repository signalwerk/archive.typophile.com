    <p>Hi, I am looking for the name of the typeface which you can see on the bus in the moive "Into the wild" -<br>
    "FAIRBANKS CITY TRANSIT SYSTEM"</p>
    <p>I tried the usual websites (MyFonts, Identfont) - but I am not happy with the results:</p>
    <p>Solpera, Signature, LT Brewery - Details are wrong. (And it's hard to see.) I am very interested in your input. Thank you - sorry if this is a FAQ that didn't show up in my search.</p>
    <p>Example of the movie poster (found with google-image search):<br>
    <a class="freelinking external" href="http://everettruess.files.wordpress.com/2007/10/into_the_wild_movie_poster.jpg" rel="nofollow">http://everettruess.files.wordpress.com/2007/10/into_the_wild_movie_poster.jpg</a></p>
