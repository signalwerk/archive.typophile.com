      <p>I started it, so here is the best match in my option, if somebody is looking for a start point:</p>
      <p>Mixtra Sansserif (Semi Bold) with different C, S and T letters.</p>
      <p>(Mixtra is a family designed by Bo Berndal in 2006. The bus maybe is a streamliner from around 1940)</p>
      <p>Thanks to Ken and Ricardo.</p>
