      <p>OK, I see. I'd noticed the more contrasted /E crossbar but I've decided to stay focused on this /M pointy centre vertex.<br>
      May be considering <a class="freelinking external" href="http://www.typography.com/fonts/knockout/overview" rel="nofollow">Knockout HTF</a> is worth of interest even if you'd have to mainly rework /R leg and /M centre vertex. There's also <a class="freelinking external" href="http://www.myfonts.com/fonts/storm/enamelplate/b" rel="nofollow">Enamelplate B</a>.</p>
