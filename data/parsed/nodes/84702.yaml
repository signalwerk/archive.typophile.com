  html: |-
    <p>Hoping someone might be able to assist in finding the right tone of font.</p>
    <p>I'm looking at/for something lo-fo like a typewriter font. But without the 'cheesiness' of a typewriter font.<br>
    There's a certain fun and naivety that is conveyed by a typewriter face.<br>
    Another, which I've been looking at is Lineto's Simple. It's a bit techy though and loses some of the lovely 'naivety' that comes with the typewriter style faces.</p>
    <p>Lettera seems about right.<br>
    Looking for alternatives.</p>
    <p>Cheers,</p>
    <p>Paul</p>
