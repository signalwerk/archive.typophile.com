  html: |-
    <p>Hi, I'm new to this site so sorry if I post this in the wrong place etc.</p>
    <p>I'm trying to work out a symbol or font that looks like this :</p>
    <p>)-( </p>
    <p>But the dash in-between joins both brackets making it look like an H or sort of an X. I have no idea if it is a type of letter or represents something else? </p>
    <p>If I can put an age to when it was used I would say it was used around 1680-1720. And it was used on its own and not in a sentence.</p>
    <p>Has anybody seen something like this at all? Basically if I can find out what this is I think I can narrow down the date further.</p>
    <p>Thanks.</p>
    <div class="field field-type-text field-field-solved">
