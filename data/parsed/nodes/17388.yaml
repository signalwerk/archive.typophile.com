      <p>Hola, Raquel. La pregunta original de pablocheco es de hace casi 2 años, pero de todos modos es bueno que hayas dejado una respuesta.</p>
      <p><em>Soy artista visual, estudie artes visuales y disenio grafico en Ecuador. He obtenido varios premios nacionales y exposiciones. Ilustre un libro. [...] Llegue aqui y no soy nadie.</em></p>
      <p>New York es así para cualquiera que se mude aquí, sea ciudadano americano o no. No sé cuánto tiempo llevas viviendo aquí, pero hay muchos artistas visuales extranjeros que se mudaron aquí por diversos motivos (políticos, económicos), y tan mal no les fue. De los contemporáneos, se me ocurren Luba Lukova, Deanne Cheuk, Stefan Sagmeister y Mirko Ilic. Y en el pasado hubo otros. Seguramente no se volvieron conocidos de un día para otro.  :-)</p>
      <p>Al mismo tiempo, TODO EL MUNDO viene aquí para hacerse camino, y eso hace que las cosas sean difíciles, pero a la vez es un estímulo -- saber que hay tanta gente haciendo buenas cosas te obliga a intentar ser mejor.</p>
      <p><em>A nadie le interesas.</em></p>
      <p>Vamos, ¿no tienes ni un amigo o amiga?</p>
      <p><em>Nadie tiene tiempo para ocuparse de tus asuntos.</em></p>
      <p>Es verdad. No quiero sonar duro, pero creo que uno mismo tiene que ocuparse de sus propios asuntos. Esto es verdad en cualquier parte del mundo.</p>
      <p>¿Conoces a las sociedades profesionales, como <a href="http://www.aigany.org/" rel="nofollow">AIGA</a>, <a href="http://www.adcglobal.org/" rel="nofollow">ADC</a>, <a href="http://www.societyillustrators.org/index.cms" rel="nofollow">SI</a> o <a href="http://www.tdc.org/" rel="nofollow">Type Directors Club</a>? Es una forma de conocer a otros artistas gráficos, y de participar y hacerse conocer. Y si te gusta la tipografía -- pues por algo estás aquí en este foro, ¿no?  ;-) -- te recomiendo la conferencia <a href="http://www.typecon.com/" rel="nofollow">TypeCon</a>, que es muy económica y va a ser en Rochester el año que viene.</p>
