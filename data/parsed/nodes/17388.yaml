    <p>Hola socios, este es apenas mi segundo post en un año por aqui, cabe mencionar que  encuentro este sitio extremadamente interesante... Mi post es porque me encuentro en un dilema personal: He estado pensando que los diseñadores en primer mundo de los que abundan aqui (Europa, EU, Canada, etc...) a diferencia de la mayoria de nosotros en Latino America pueden vivir bien con uno o dos proyectos freelance al mes, trabajar cuando mucho 40 horas a la semana y despues dedicarse a pintar, esculpir, viajar, y diseñar por gusto en vez de hacerlo por necesidad, ¡algo que yo quisiera lograr! ¿Alguno de ustedes sabe si esto es realidad?<br>
    ¿Alguno de ustedes conoce la realidad en estos paises? muchas gracias por su apoyo.</p>
