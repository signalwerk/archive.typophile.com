    html: <p>Es un asunto de moverse. Yo vivo en Múnich desde hace un tiempo y al principio es difícil. Lo importante es mantenerse siempre activo en el diseño/arte o lo que haces normalmente, hacer contactos y mandar currículums a las empresas que te interesen. No creo que haya de otra. Ya que estás trabajando, puede que te des cuenta que el panorama gráfico en Europa sí está mejor a nivel económico.</p>
