      <p>Raquel, Ricardo, Mosh, que bien que decidieron participar de este tema a 2 años de creado, mil gracias a todos.<br>
      No me fui a Europa, sigo en Mexico trabajando como freelance aunque he decidido aprovechar mis habilidades de marketing para auto-promoverme no como un solo diseñador sino como "firma". He logrado establecer una red de clientes, contactos y proveedores que han permitido que mi sutuacion profesional sea muy favorecida y economicamente satisfactoria, es decir para ser freelance, seguro que como despacho falta mucho camino pero como individuo todo esta de maravilla, aunque si debo seguir trabajando 40 a 60 horas por semana, pero ¿quien no debe trabajar duro para salir adelante? Talves en otro pais seria mas la recompensa por el tiempo pero creo que aca es "mas facil tejer la red" por conocer el contexto.</p>
      <p>Saludos a todos.</p>
