      <p>Pablo Checo, aqui la cosa es dura.<br>
      A mi me vendieron un suenio hermoso, y me doy cuenta de que nada es cierto. Soy artista visual, estudie artes visuales y disenio grafico en Ecuador. He obtenido varios premios nacionales y exposiciones. Ilustre un libro.<br>
      Llegue aqui y no soy nadie. A nadie le interesas. Nadie tiene tiempo para ocuparse de tus asuntos. No hay calidez, ni la idea de amistad o de fraternidad que hay en latinoamerica.<br>
      La renta y la comida son excesivamente caros asi que lo que ganas en un trabajo de mierda que es bastante, se te va hasta el ultimo centavo. </p>
      <p>Asi que, quedate tranquilo, disfruta de tu vida, aqui no existe el amor por el darse tiempo a uno mismo. Yo no veo la hora de irme.<br>
      Un abrazo.</p>
