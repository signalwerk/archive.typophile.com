    html: <p>Hrant, what do you think of Greta? It seems to have the "obese x-height" you often rail against.</p>
  - id: 199729
    user_id: 1250
    user_name: hrant
    user_path: null
    user_image: /files/pictures/picture-1250.gif
    date_raw: 27 Apr 2007 — 4:51pm
    date: 2007-04-27T16:51:00
    votes: null
    html: |-
      <p>Well there are good and bad reasons to make an x-height obese. In the 70s for example many people did it purely for style, in disregard for anything else (think ITC Garamond). That sucked. On the other hand the smaller the point size the larger the x-height should be - and newspapers are a very prominent and long-standing case of small-size typography needing large x-heights.</p>
      <p>Greta's x-height I would actually not call "obese" btw - I think if you measure it it'll come out to about what Times is. Also, width has a compounding effect; Times is narrow while ITC Garamond is wide, making the latter than much worse.</p>
      <p>hhp</p>
