      <p>Thanks for clarifying, Hrant.</p>
      <p>In the case of Greta, you're comparing the x-height to the height of the lowercase ascenders and not the caps, right? 'Cuz if you look at the words "Greta Text" at the top of the sample you linked, the cap-to-x-height relationship looks positively Vectora-like.</p>
