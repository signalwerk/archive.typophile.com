  - id: 199735
    user: 1250
    date: 2007-04-27T18:31:00
    date_raw: 27 Apr 2007 — 6:31pm
    votes: null
    html: |-
      <p>Yes, caps constituting only about 5% of text aren't very relevant here. But Greta's sure are super short! Some kind of record*, or close. I personally like that, although it does have one drawback: for text that's likely to be <cite>scanned</cite> (as a rule for a proper name, hence something capitalized) it's less effective than caps that stand out a bit. And it seems to me that the types of settings that benefit from fonts with large x-heights also tend to benefit from being easily scanned.</p>
      <p>* Vectora's caps are even smaller, but look at the x-height compared to the ascenders: gargantuan. I'd say this makes the caps relatively larger than Greta's.</p>
      <p>hhp</p>
