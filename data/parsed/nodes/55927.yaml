    <p>I've seen fonts that were small caps due to the font's complexity. I've also noticed that other fonts with a standard lower case are sometimes release in a small caps versions. Are there any guidelines for creating a small caps version of a font. Are small caps version used, or are they redundant? Who thinks the question itself is redundant.  </p>
    <p>~~~~~~~~~~~~~</p>
    <p><a class="freelinking external" href="http://www.thefontry.com" rel="nofollow"><em>...from the Fontry </em></a></p>
