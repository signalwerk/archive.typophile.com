    html: |-
      <p>I use small caps when I design metal plaques.  My recent favorite for this is Jos Buivenga's Fontin.  I use it where mixed case might be used (especially lists of names) but upper case is more formal.  The larger first letter aids legibility.  It is very satisfying to see my designs cast in bronze (and other metals, too).</p>
      <p><a class="freelinking external" href="http://www.albanysigns.com/pictures/plaque_5.jpg" rel="nofollow">bronze plaque</a></p>
