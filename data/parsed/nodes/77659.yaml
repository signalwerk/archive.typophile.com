    html: |-
      <p>At least he isn't looking for <a class="freelinking external" href="http://new.myfonts.com/search/Papyrus/fonts/" rel="nofollow">Papyrus</a>.</p>
      <p>I've seen <a class="freelinking external" href="http://new.myfonts.com/search/Davida/fonts/" rel="nofollow">Davida</a>, which appears to be available from a number of foundries, used before where a Mexican-American atmosphere is being suggested.</p>
      <p>Something between Blackletter and Davida is a tall order, but perhaps, ironically enough, the face from Letraset called <a class="freelinking external" href="http://new.myfonts.com/fonts/letraset/victorian/" rel="nofollow">Victorian</a> might fill the bill.</p>
      <p>The querent is searching for information, not aesthetic judgment.</p>
      <p>Of course, there's also <a class="freelinking external" href="http://new.myfonts.com/fonts/dtptypes/pretorian-dt/" rel="nofollow">Pretorian</a> and even <a class="freelinking external" href="http://new.myfonts.com/search/Hobo/fonts/" rel="nofollow">Hobo</a> (<a class="freelinking external" href="http://new.myfonts.com/fonts/profonts/roberta/" rel="nofollow">Roberta</a>, which also appears on that results page, might be of interest) that he might consider.</p>
      <p>Besides Roberta, for something new, that isn't overused, there's <a class="freelinking external" href="http://new.myfonts.com/fonts/nicksfonts/durham-abbey-nf/" rel="nofollow">Durham Abbey</a>; while that is pretty clearly Victorian, given the right context it could still work for the querent's purpose.</p>
      <p>Of course, authenticity isn't a bad thing, either. I'm not sure how much authenticity there is in these suggestions from MyFonts:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/scriptorium/quetzal/" rel="nofollow">Quetzal</a>,<br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/jonahfonts/yacqui/" rel="nofollow">Yacqui</a>, or<br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/larabie/xolto/" rel="nofollow">Xolto</a>...</p>
      <p>Here are a few more ideas:</p>
      <p><a class="freelinking external" href="http://new.myfonts.com/fonts/nicksfonts/dime-box-wbw/" rel="nofollow">Dime Box NF</a>,<br>
      <a class="freelinking external" href="http://new.myfonts.com/fonts/larabie/kirsty/" rel="nofollow">Kirsty</a>, or...</p>
      <p>No, neither <a class="freelinking external" href="http://new.myfonts.com/fonts/jnlevine/supper-club/" rel="nofollow">Supper Club JNL</a> nor <a class="freelinking external" href="http://new.myfonts.com/fonts/paratype/unovis/" rel="nofollow">Unovis</a> is what I'm thinking of, but there might be something similar but less extreme that would do.</p>
      <p>Ah, it took a while to find an example; <a class="freelinking external" href="http://new.myfonts.com/fonts/spiecegraphics/iron-type-sg/" rel="nofollow">Iron Type SG</a> was what I was thinking of. There was also <a class="freelinking external" href="http://new.myfonts.com/fonts/northernblock/mekon/" rel="nofollow">Mekon</a>, but while it had the right weight, it didn't seem to have the right spirit.</p>
      <p>Ah, I finally persuaded MyFonts to show me what I was looking for: <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/eagle/" rel="nofollow">Eagle</a>.</p>
      <p>Maybe <a class="freelinking external" href="http://new.myfonts.com/fonts/outras/alegria/" rel="nofollow">Alegria</a>?</p>
      <p>Also, <a class="freelinking external" href="http://new.myfonts.com/fonts/fontbureau/bremen/" rel="nofollow">Bremen</a> might do in a pinch.</p>
