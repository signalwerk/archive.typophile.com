      <p><em>The querent is searching for information, not aesthetic judgment.</em></p>
      <p>I was merely pointing out that Davida is not an indigenously-informed design.<br>
      What is a 1960s neo-Victorian type -- Brit pop art?<br>
      I believe it connects with the foppish Carnaby St fashions, eg the Beatles with a kind of garish 19th century style military/band uniform and strange facial hair, Sgt Pepper. I had one of those jackets with the high collar, 4 or five buttons at the front, and double-vented at the back. The Kinks had that look in 65.</p>
