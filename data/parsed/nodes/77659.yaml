    <p>Hey I am looking for an indigenous peoples inspired font. I don't know much about typography terminology, but these are the closest fonts i have found to what i am looking for:</p>
    <p>i kinda want it to be somewhere in between blackletter and this:<br>
    Mestizo cafe font <a href="http://media.merchantcircle.com/30013400/mestizo_final_color_medium.jpeg" title="http://media.merchantcircle.com/30013400/mestizo_final_color_medium.jpeg">http://media.merchantcircle.com/30013400/mestizo_final_color_medium.jpeg</a></p>
    <p>less blocky/hippy than this: <a href="http://darkvotum.wordpress.com/2010/09/28/zoot-chicano-font-mexican-american-typography/" title="http://darkvotum.wordpress.com/2010/09/28/zoot-chicano-font-mexican-american-typography/">http://darkvotum.wordpress.com/2010/09/28/zoot-chicano-font-mexican-amer...</a></p>
    <p>any help would be awesome.   </p>
    <p>-Theres</p>
