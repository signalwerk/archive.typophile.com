      <p>Well, <a class="freelinking external" href="http://www.317x.com/albums/b/bajamarimbaband/card.html" rel="nofollow">Victorian</a> (here stretched vertically on this album cover) is not authentic either, and yet a major record label found it suitable to convey the appropriate mood for an LP of music in a Mexican style.</p>
      <p>It may be I was too harsh, but as Papyrus demonstrates, a face can be used to fit the intended mood of something even when not obviously authentic. Apparently the original poster is looking for something that can be related to Mexico's indigenous or part-indigenous peoples.</p>
