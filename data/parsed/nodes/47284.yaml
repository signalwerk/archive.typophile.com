    html: |-
      <p>That's a hard one to search for. Its a Spencerian font as in Platt Rogers Spencer of the 19th century. Unfortunately, most type searches will lump copperplate scripts in with Spencerian because they are all formal pointed pen scripts.</p>
      <p>A excellent example of a Spencerian style font is:</p>
      <p><a href="http://www.myfonts.com/fonts/ihof/p22-zaner/" title="http://www.myfonts.com/fonts/ihof/p22-zaner/">http://www.myfonts.com/fonts/ihof/p22-zaner/</a></p>
      <p>or the thinner more casual:</p>
      <p><a href="http://www.myfonts.com/fonts/ihof/p22-allyson/" title="http://www.myfonts.com/fonts/ihof/p22-allyson/">http://www.myfonts.com/fonts/ihof/p22-allyson/</a></p>
      <p>Both are from Paul Hunt.</p>
