    html: |-
      <div class="comment-spam-body"><p>EDITED:<br>
      Looks like an outdoor sign.<br>
      My guess is that it's not a font as such, but rather sign-maker's lettering.<br>
      The effect could be duplicated with a fairly heavy, monoline, boxy or gas-pipe style wide sans. For example Valfle Extended </p><div class="imageWrap"><img src="http://typophile.com/files/ValfleExtended_MHS_5668.gif"></div><br>
      <a href="http://www.myfonts.com/fonts/suitcase/vafle/" title="http://www.myfonts.com/fonts/suitcase/vafle/">http://www.myfonts.com/fonts/suitcase/vafle/</a><br>
      I trust a kindly typophile could recommend something that is a better match.<br>
      For the _M_ and _H_ paste on small Clarendon style serifs.<br>
      As for the the _S_ the paste could consist of the serif and terminal treatment from any of several "wild west" wood type designs.<br>
      Good choices include Jeff Levine's Saddle Tramp JNL <div class="imageWrap"><img src="http://typophile.com/files/SaddleTrampJNL_S_5551.gif"></div> <a href="http://www.myfonts.com/fonts/jnlevine/saddle-tramp/" title="http://www.myfonts.com/fonts/jnlevine/saddle-tramp/">http://www.myfonts.com/fonts/jnlevine/saddle-tramp/</a><br>
      Equally suitable, Blackoak<br>
      <div class="imageWrap"><img src="http://typophile.com/files/Blackoak_S_6709.gif"></div> already suggested by Kevin.<br>
      In both of these cases some tinkering would be needed to get the terminal to match.<br>
      Don<p></p>
      </div>
