      <p><strong>New Dollar Sign Proposed by Congress to Reflect Economic Conditions</strong></p>
    <p>WASHINGTON D.C. — APRIL 1, 2009<br>
    To help stem the downward spiral of the United States economy Congress has proposed a new dollar symbol. </p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/April1DollarSymbol530_4912.png"></div><p></p>
    <p>“Updating fonts on the world’s computers and devices would be a huge economic stimulus” said one representative after a late night session of the newly formed House Subcommittee – Font Economic Stimulus Technology Relief (FESTR). “The dollar is a shadow of its former self and the new design reflects this.”</p>
    <p>Officials with the International Currency Authority were notified of the change and agreed that other currencies should be updated to aid other countries feeling the effects of the economic debacle.</p>
    <p>To move forward quickly, Ascender Corporation (Elk Grove Village, IL) has been granted TARP money to begin production on, what it calls, “shovel ready” font designs. FESTR reviewed hundreds of submissions and selected the design for the New Dollar sign by Ascender’s Steve Matteson for its formulaic simplicity and visual clarity..</p>
    <p>To be consistent with the value of the world’s currencies, Ascender is offering the new currency symbols at half-off. For more information on the new currency symbols visit <a href="http://www.ascendercorp.com/custom/currency/" title="www.ascendercorp.com/custom/currency/">www.ascendercorp.com/custom/currency/</a></p>
