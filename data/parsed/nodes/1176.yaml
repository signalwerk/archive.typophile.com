  html: "<p> Please, forgive I am a neophite in type design and fontographer. I need to know some important issues about fontographer: <br> <br>1- Do you set kerning pairs for acentuated characters like \"À\", \"Â\", ö?  <br>A professional font must got it?  <br> <br>In that case: Does exits, for example, some way to copy the kerning pairs setted for \"A\" to the character \"À\"?  <br>What is the usual way to do that? <br> <br> <br>2- What's is the object of the command \"Equalize sidebearings\". I see some font which got it and other fonts doesn't. <br> <br>It's only good for the numbers?  <br>This must be  made at the end of the process of designing a font? <br> <br>Sorry for my lack of fonto-skills and *THANKS*... <br> <br>Ramiro. </p>"
  html_clean: "<p> Please, forgive I am a neophite in type design and fontographer. I need to know some important issues about fontographer: <br> <br>1- Do you set kerning pairs for acentuated characters like \"À\", \"Â\", ö?  <br>A professional font must got it?  <br> <br>In that case: Does exits, for example, some way to copy the kerning pairs setted for \"A\" to the character \"À\"?  <br>What is the usual way to do that? <br> <br> <br>2- What's is the object of the command \"Equalize sidebearings\". I see some font which got it and other fonts doesn't. <br> <br>It's only good for the numbers?  <br>This must be  made at the end of the process of designing a font? <br> <br>Sorry for my lack of fonto-skills and *THANKS*... <br> <br>Ramiro. </p>"
