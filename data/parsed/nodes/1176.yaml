    html: <p> Ramiro -- <br> <br>To set kerning pairs for accents the same as their base character, you can use the Metrics &gt; Kerning Assistance command.  <br> <br>For example, if you want to extend the kerning from TA, VA, WA, YA to TÅ, VÀ, WÄ, YÁ, etc., you would set the Equivalent First Letters to T V W Y and set the Equivalent Second Letters to A Á À Â Ä Ã Å. You would turn off the Link All for the first set (so that TA doesn't become the same as VA) and turn on the Link All for the second set (so that TÁ becomes the same as TA). <br> <br>Whether you include these pairs depends upon the target audience for your font, and upon how compulsively thorough you want to be. (Note, however, that some combinations like WÀ, for example, may be nonexistent, given that most languages that I'm aware of which use the Agrave don't have the W.) <br> <br>I personally think it's important in this day and age to kern accents (I'm obsessive/compulsive, I admit it), but many foundries (especially U.S. ones) don't necessarily include them. I'm not sure if this is from laziness, or a holdover from the early days when large kerning tables bogged down processors. <br> <br>I have not found any use for the Equalize Sidebearings. <br> <br>Hope this helps. <br> <br>-- Kent. </p>
