    <p>1993<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Atlas" title="Create node &quot;Atlas&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Atlas</a>&nbsp;: Released by <a href="/node/13426/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontHaus</a>, some styles unfinished<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Elroy" title="Create node &quot;Elroy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Elroy</a>&nbsp;: Released by <a href="/node/13426/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontHaus</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Hairspray" title="Create node &quot;Hairspray&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Hairspray</a>&nbsp;: Released by <a href="/node/13426/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontHaus</a></p>
