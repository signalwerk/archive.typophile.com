    <p><strong><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Indices</a>&nbsp;: <a href="/node/17745/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Designers</a>&nbsp;: Christian&nbsp;Schwartz</strong></p>
    <p>Born: New Hampshire,&nbsp;1977</p>
    <p><strong>Career History</strong><br>
    1999: Graduated Carnegie Mellon University (Communications Design)<br>
    1999: <a href="/node/15651/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">MetaDesign</a> Berlin<br>
    2000: <a href="/node/13681/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Font Bureau</a><br>
    2001: <a href="/node/12435/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Orange&nbsp;Italic</a></p>
    <p><strong>Awards</strong><br>
    His work has been honored by the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=New%20York%20Type%20Directors%20Club" title="Create node &quot;New York Type Directors Club&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">New York Type Directors Club</a>, the <a href="/node/13814/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">AIGA</span></a>, the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=D%26AD%20Awards" title="Create node &quot;D&amp;AD Awards&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">D&amp;AD</span> Awards</a>, the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=International%20Society%20of%20Typographic%20Designers" title="Create node &quot;International Society of Typographic Designers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">International Society of Typographic Designers</a>, and the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Cooper%20Hewitt%20National%20Design%20Museum" title="Create node &quot;Cooper Hewitt National Design Museum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Cooper Hewitt National Design Museum</a>.</p>
    <p><strong>Fonts:</strong></p>
