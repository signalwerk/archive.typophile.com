nternal link-lost">Reform</a> Sketched italic for typeface by Anuthin Wongsunkakon. Released by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=PsyOps" title="Create node &quot;PsyOps&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">PsyOps</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Masthead" title="Create node &quot;Masthead&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Masthead</a> (Unfinished)</p>
    <p>2003<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Neutraface" title="Create node &quot;Neutraface&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Neutraface</a>&nbsp;: Art Directed by <a href="/node/20595/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Andy Cruz</a>. Released by <a href="/node/12703/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">House Industries</a>.<br><a href="/node/79139/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Amplitude</a>&nbsp;: Released by <a href="/node/13681/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Font Bureau</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Houston" title="Create node &quot;Houston&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Houston</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Roger%20Black" title="Create node &quot;Roger Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Roger Black</a> at <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Danilo%20Black%2C%20Inc." title="Create node &quot;Danilo Black, Inc.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Danilo Black, Inc.</a>, for the Houston Chronicle.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Meta%203" title="Create node &quot;FF Meta 3&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">FF</span> Meta 3</a>&nbsp;: Designed by <a href="/node/13629/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik Spiekermann</a>. Portions drawn by <a href="/node/13683/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Richard Lipton</a>. Released by <a href="/node/12019/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Eero" title="Create node &quot;Eero&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Eero</a>&nbsp;: Art Directed by <a href="/node/20595/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Andy Cruz</a>. Commissioned by <a href="/node/12703/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">House Industries</a> for the Dulles International Airport.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Symantec" title="Create node &quot;Symantec&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Symantec</a>&nbsp;: Designed with <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Conor%20Mangat" title="Create node &quot;Conor Mangat&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Conor Mangat</a>. Commissioned by <a href="/node/15651/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">MetaDesign</a> for <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Symantec%20Corporation" title="Create node &quot;Symantec Corporation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Symantec Corporation</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=ITC%20Officina%20Display" title="Create node &quot;ITC Officina Display&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">ITC</span> Officina Display</a>&nbsp;: Designed by <a href="/node/13629/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik Spiekermann</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Ole%20Sch%C3%A4fer" title="Create node &quot;Ole Schäfer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Ole Schäfer</a>. Portions drawn by <a href="/node/13683/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Richard Lipton</a> and <a href="/node/13684/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Cyrus Highsmith</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Agfa" title="Create node &quot;Agfa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Agfa</a>/<a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Monotype</a>/<a href="/node/13402/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">ITC</span></a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bailey" title="Create node &quot;Bailey&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Bailey</a> (Unfinished. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Danilo%20Black%2C%20Inc." title="Create node &quot;Danilo Black, Inc.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Danilo Black, Inc.</a>)</p>
    <p>2004<br><a href="/node/13632/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept"><span class="caps">FF</span> Unit</a>&nbsp;: Designed with <a href="/node/13629/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik Spiekermann</a>. Released by <a href="/node/12019/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Farnham" title="Create node &quot;Farnham&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Farnham</a>&nbsp;: Released by <a href="/node/13681/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Font Bureau</a><br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Neutraface%20Condensed" title="Create node &quot;Neutraface Condensed&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Neutraface Condensed</a>&nbsp;: Art Directed by <a href="/node/20595/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Andy Cruz</a>. Released by <a href="/node/12703/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">House Industries</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Bau" title="Create node &quot;FF Bau&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">FF</span> Bau</a>&nbsp;: Original idea by <a href="/node/13629/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik Spiekermann</a>. Released by <a href="/node/12019/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Popular" title="Create node &quot;Popular&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Popular</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Robb%20Rice" title="Create node &quot;Robb Rice&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Robb Rice</a> at <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Danilo%20Black%2C%20Inc." title="Create node &quot;Danilo Black, Inc.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Danilo Black, Inc.</a>, for Popular Mechanics.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bosch%20Serif%20%26%20Sans" title="Create node &quot;Bosch Serif &amp; Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Bosch Serif <span class="amp">&amp;</span> Sans</a>&nbsp;: Designed with <a href="/node/13629/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik Spiekermann</a>, production assistance by <a href="/node/20594/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Joshua Darden</a>. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=United%20Designers" title="Create node &quot;United Designers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">United Designers</a> for&nbsp;Bosch.</p>
    <p>2005<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Oxide" title="Create node &quot;FF Oxide&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">FF</span> Oxide</a>&nbsp;: Previously known as 5608. Designed for David Mullen at Double A Clothing. Released by <a href="/node/12019/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Meta%20Headline" title="Create node &quot;FF Meta Headline&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">FF</span> Meta Headline</a>&nbsp;: Designed by <a href="/node/13629/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik Spiekermann</a>, produced with <a href="/node/20594/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Joshua Darden</a>. Released by <a href="/node/12019/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">FontShop International</a>.</p>
    <p>2006<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Farnham%20Headline" title="Create node &quot;Farnham Headline&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Farnham Headline</a>&nbsp;: Commissioned by Esterson Associates and de Luxe&nbsp;Associates.</p>
    <p>2007<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Publico" title="Create node &quot;Publico&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Publico</a>&nbsp;: Originally designed with Paul Barnes; production and design assistance by Kai Bernau. Commissioned by Mark Porter and Esterson Associates for <em>Público</em>.</p>
