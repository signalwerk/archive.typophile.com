    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Christian Schwartz</strong></p>
    <p>Born: New Hampshire, 1977</p>
    <p><strong>Career History</strong><br>
    1999: Graduated Carnegie Mellon University (Communications Design)<br>
    1999: <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a> Berlin<br>
    2000: <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a><br>
    2001: <a href="/wiki/Orange%20Italic" class="freelinking" rel="nofollow">Orange Italic</a></p>
    <p><strong>Awards</strong><br>
    His work has been honored by the <a href="/wiki/New%20York%20Type%20Directors%20Club" class="freelinking" rel="nofollow">New York Type Directors Club</a>, the <a href="/wiki/AIGA" class="freelinking" rel="nofollow">AIGA</a>, the <a href="/wiki/D%2526AD%20Awards" class="freelinking" rel="nofollow">D&amp;AD Awards</a>, the <a href="/wiki/International%20Society%20of%20Typographic%20Designers" class="freelinking" rel="nofollow">International Society of Typographic Designers</a>, and the <a href="/wiki/Cooper%20Hewitt%20National%20Design%20Museum" class="freelinking" rel="nofollow">Cooper Hewitt National Design Museum</a>.</p>
    <p><strong>Fonts:</strong></p>
    <p>1992<br>
    <a href="/wiki/Flywheel" class="freelinking" rel="nofollow">Flywheel</a> : Released by <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a>.</p>
    <p>1993<br>
    <a href="/wiki/Atlas" class="freelinking" rel="nofollow">Atlas</a> : Released by <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a>, some styles unfinished<br>
    <a href="/wiki/Elroy" class="freelinking" rel="nofollow">Elroy</a> : Released by <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a>.<br>
    <a href="/wiki/Hairspray" class="freelinking" rel="nofollow">Hairspray</a> : Released by <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a></p>
    <p>1994<br>
    <a href="/wiki/Twist" class="freelinking" rel="nofollow">Twist</a> : Released by <a href="/wiki/Precision%20Type" class="freelinking" rel="nofollow">Precision Type</a> and the <a href="/wiki/Agfatype%20Creative%20Alliance%20" class="freelinking" rel="nofollow">Agfatype Creative Alliance </a><br>
    <a href="/wiki/Ant%20%2526%20Bee%20Art%20Fonts" class="freelinking" rel="nofollow">Ant &amp; Bee Art Fonts</a> : Drawings by <a href="/wiki/Jill%20Weber" class="freelinking" rel="nofollow">Jill Weber</a>. Released by <a href="/wiki/FontHaus" class="freelinking" rel="nofollow">FontHaus</a>.</p>
    <p>1995<br>
    <a href="/wiki/Zombie" class="freelinking" rel="nofollow">Zombie</a> : Released by <a href="/wiki/Precision%20Type" class="freelinking" rel="nofollow">Precision Type</a> and the <a href="/wiki/Agfatype%20Creative%20Alliance" class="freelinking" rel="nofollow">Agfatype Creative Alliance</a><br>
    <a href="/wiki/Morticia" class="freelinking" rel="nofollow">Morticia</a> : Released by the <a href="/wiki/Agfatype%20Creative%20Alliance" class="freelinking" rel="nofollow">Agfatype Creative Alliance</a></p>
    <p>1996<br>
    <a href="/wiki/Gladys" class="freelinking" rel="nofollow">Gladys</a> (Unreleased)<br>
    <a href="/wiki/Bureau%20Grotesque" class="freelinking" rel="nofollow">Bureau Grotesque</a> : Designed with FB Staff including <a href="/wiki/David%20Berlow" class="freelinking" rel="nofollow">David Berlow</a>, <a href="/wiki/Tobias%20Frere-Jones" class="freelinking" rel="nofollow">Tobias Frere-Jones</a>, <a href="/wiki/Jill%20Pichotta" class="freelinking" rel="nofollow">Jill Pichotta</a>, <a href="/wiki/Richard%20Lipton" class="freelinking" rel="nofollow">Richard Lipton</a>, and others. Mostly unreleased. Some styles commissioned by Entertainment Weekly.</p>
    <p>1997<br>
    <a href="/wiki/Fritz" class="freelinking" rel="nofollow">Fritz</a> : Released by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>.</p>
    <p>1998<br>
    <a href="/wiki/Vendome" class="freelinking" rel="nofollow">Vendome</a> (Unfinished revival of a <a href="/wiki/Fran%C3%A7ois%20Ganeau" class="freelinking" rel="nofollow">François Ganeau</a> design orginally produced by <a href="/wiki/Deberny%20%2526%20Peignot" class="freelinking" rel="nofollow">Deberny &amp; Peignot</a>)</p>
    <p>1999<br>
    <a href="/wiki/VW%20Headline%20Light" class="freelinking" rel="nofollow">VW Headline Light</a> &amp; <a href="/wiki/Heckschrift" class="freelinking" rel="nofollow">Heckschrift</a> : Art directed by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> and <a href="/wiki/Stephanie%20Kurz" class="freelinking" rel="nofollow">Stephanie Kurz</a>. Commissioned by <a href="/wiki/MetaDesign%20Berlin" class="freelinking" rel="nofollow">MetaDesign Berlin</a> for Volkswagen AG.<br>
    <a href="/wiki/Sandbox" class="freelinking" rel="nofollow">Sandbox</a> (Unfinished. Designed with <a href="/wiki/Chris%20Pacione" class="freelinking" rel="nofollow">Chris Pacione</a>)<br>
    <a href="/wiki/Local%20Gothic" class="freelinking" rel="nofollow">Local Gothic</a> (Unfinished)</p>
    <p>2000<br>
    <a href="/wiki/Pennsylvania" class="freelinking" rel="nofollow">Pennsylvania</a> : Released by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>.<br>
    <a href="/wiki/Casa%20Latino%21" class="freelinking" rel="nofollow">Casa Latino!</a> : Art Direction by <a href="/wiki/Andy%20Cruz" class="freelinking" rel="nofollow">Andy Cruz</a>. Designed with <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a>. Released by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>.<br>
    <a href="/wiki/FF%20Din%20Condensed" class="freelinking" rel="nofollow">FF Din Condensed</a> : Commissioned by <a href="/wiki/Michael%20Grossman" class="freelinking" rel="nofollow">Michael Grossman</a> for Harper's Bazaar. Not to be confused with retail version of FF DIN Condensed, designed by <a href="/wiki/Albert-Jan%20Pool" class="freelinking" rel="nofollow">Albert-Jan Pool</a><br>
    <a href="/wiki/Poynter%20Agate%20Display" class="freelinking" rel="nofollow">Poynter Agate Display</a> : Commissioned by the <a href="/wiki/San%20Jose%20Mercury%20News" class="freelinking" rel="nofollow">San Jose Mercury News</a> classified section<br>
    <a href="/wiki/LaDeeDa" class="freelinking" rel="nofollow">LaDeeDa</a> : Art Directed by <a href="/wiki/Mia%20Hurley" class="freelinking" rel="nofollow">Mia Hurley</a>. Commissioned by gURL.com<br>
    <a href="/wiki/Vectora%20Thin" class="freelinking" rel="nofollow">Vectora Thin</a> : Commissioned by O Magazine<br>
    <a href="/wiki/Addison" class="freelinking" rel="nofollow">Addison</a> (Unfinished)<br>
    <a href="/wiki/Boyband" class="freelinking" rel="nofollow">Boyband</a> (Unfinished)<br>
    <a href="/wiki/Bilbao" class="freelinking" rel="nofollow">Bilbao</a> (Unfinished)</p>
    <p>2001<br>
    <a href="/wiki/Simian" class="freelinking" rel="nofollow">Simian</a> :  : Art Directed by <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a> and <a href="/wiki/Andy%20Cruz" class="freelinking" rel="nofollow">Andy Cruz</a>. Released by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>.<br>
    <a href="/wiki/Interstate%20Monospaced" class="freelinking" rel="nofollow">Interstate Monospaced</a> : Commissioned by Citigroup.<br>
    <a href="/wiki/Coop%20Black" class="freelinking" rel="nofollow">Coop Black</a> (lowercase) : Based on <a href="/wiki/Coop%20Black" class="freelinking" rel="nofollow">Coop Black</a> by <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a> and <a href="/wiki/Coop" class="freelinking" rel="nofollow">Coop</a>. Commissioned by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a> for Toys R Us.<br>
    <a href="/wiki/David%20Yurman" class="freelinking" rel="nofollow">David Yurman</a> : Commissioned by <a href="/wiki/Lipman%20Advertising" class="freelinking" rel="nofollow">Lipman Advertising</a> for David Yurman.<br>
    <a href="/wiki/Caslon%27s%20Egyptian" class="freelinking" rel="nofollow">Caslon's Egyptian</a> : Designed with <a href="/wiki/Miko%20McGinty" class="freelinking" rel="nofollow">Miko McGinty</a> and <a href="/wiki/Cyrus%20Highsmith" class="freelinking" rel="nofollow">Cyrus Highsmith</a>. Commissioned by Red Herring.<br>
    <a href="/wiki/Benton%20Modern" class="freelinking" rel="nofollow">Benton Modern</a> : Commissioned by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a> for the <a href="/wiki/Readability%20Series" class="freelinking" rel="nofollow">Readability Series</a></p>
    <p>2002<br>
    <a href="/wiki/Los%20Feliz" class="freelinking" rel="nofollow">Los Feliz</a> : Released by <a href="/wiki/Emigre" class="freelinking" rel="nofollow">Emigre</a>.<br>
    <a href="/wiki/Luxury" class="freelinking" rel="nofollow">Luxury</a> : Designed with <a href="/wiki/Dino%20Sanchez" class="freelinking" rel="nofollow">Dino Sanchez</a>. Released by <a href="/wiki/Orange%20Italic" class="freelinking" rel="nofollow">Orange Italic</a>.<br>
    <a href="/wiki/Chalet%20Cyrillic" class="freelinking" rel="nofollow">Chalet Cyrillic</a> : Commissioned by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a> for Lego.<br>
    <a href="/wiki/Harrison" class="freelinking" rel="nofollow">Harrison</a> : Commissioned by Rafael Esquer at @radical.media.<br>
    <a href="/wiki/Reform" class="freelinking" rel="nofollow">Reform</a> Sketched italic for typeface by Anuthin Wongsunkakon. Released by <a href="/wiki/PsyOps" class="freelinking" rel="nofollow">PsyOps</a>.<br>
    <a href="/wiki/Masthead" class="freelinking" rel="nofollow">Masthead</a> (Unfinished)</p>
    <p>2003<br>
    <a href="/wiki/Neutraface" class="freelinking" rel="nofollow">Neutraface</a> : Art Directed by <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a> and <a href="/wiki/Andy%20Cruz" class="freelinking" rel="nofollow">Andy Cruz</a>. Released by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>.<br>
    <a href="/wiki/Amplitude" class="freelinking" rel="nofollow">Amplitude</a> : Released by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a>.<br>
    <a href="/wiki/Houston" class="freelinking" rel="nofollow">Houston</a> : Commissioned by <a href="/wiki/Roger%20Black" class="freelinking" rel="nofollow">Roger Black</a> at <a href="/wiki/Danilo%20Black%2C%20Inc." class="freelinking" rel="nofollow">Danilo Black, Inc.</a>, for the Houston Chronicle.<br>
    <a href="/wiki/FF%20Meta%203" class="freelinking" rel="nofollow">FF Meta 3</a> : Designed by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>. Portions drawn by <a href="/wiki/Richard%20Lipton" class="freelinking" rel="nofollow">Richard Lipton</a>. Released by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop International</a>.<br>
    <a href="/wiki/Eero" class="freelinking" rel="nofollow">Eero</a> : Art Directed by <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a> and <a href="/wiki/Andy%20Cruz" class="freelinking" rel="nofollow">Andy Cruz</a>. Commissioned by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a> for the Dulles International Airport.<br>
    <a href="/wiki/Symantec" class="freelinking" rel="nofollow">Symantec</a> : Designed with <a href="/wiki/Conor%20Mangat" class="freelinking" rel="nofollow">Conor Mangat</a>. Commissioned by <a href="/wiki/MetaDesign" class="freelinking" rel="nofollow">MetaDesign</a> for <a href="/wiki/Symantec%20Corporation" class="freelinking" rel="nofollow">Symantec Corporation</a>.<br>
    <a href="/wiki/ITC%20Officina%20Display" class="freelinking" rel="nofollow">ITC Officina Display</a> : Designed by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a> and <a href="/wiki/Ole%20Sch%C3%A4fer" class="freelinking" rel="nofollow">Ole Schäfer</a>. Portions drawn by <a href="/wiki/Richard%20Lipton" class="freelinking" rel="nofollow">Richard Lipton</a> and <a href="/wiki/Cyrus%20Highsmith" class="freelinking" rel="nofollow">Cyrus Highsmith</a>. Released by <a href="/wiki/Agfa" class="freelinking" rel="nofollow">Agfa</a>/<a href="/wiki/Monotype" class="freelinking" rel="nofollow">Monotype</a>/<a href="/wiki/ITC" class="freelinking" rel="nofollow">ITC</a>.<br>
    <a href="/wiki/Bailey" class="freelinking" rel="nofollow">Bailey</a> (Unfinished. Commissioned by <a href="/wiki/Danilo%20Black%2C%20Inc." class="freelinking" rel="nofollow">Danilo Black, Inc.</a>)</p>
    <p>2004<br>
    <a href="/wiki/FF%20Unit" class="freelinking" rel="nofollow">FF Unit</a> : Designed with <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>. Released by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop International</a>.<br>
    <a href="/wiki/Farnham" class="freelinking" rel="nofollow">Farnham</a> : Released by <a href="/wiki/Font%20Bureau" class="freelinking" rel="nofollow">Font Bureau</a><br>
    <a href="/wiki/Neutraface%20Condensed" class="freelinking" rel="nofollow">Neutraface Condensed</a> : Art Directed by <a href="/wiki/Ken%20Barber" class="freelinking" rel="nofollow">Ken Barber</a> and <a href="/wiki/Andy%20Cruz" class="freelinking" rel="nofollow">Andy Cruz</a>. Released by <a href="/wiki/House%20Industries" class="freelinking" rel="nofollow">House Industries</a>.<br>
    <a href="/wiki/FF%20Bau" class="freelinking" rel="nofollow">FF Bau</a> : Original idea by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>. Released by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop International</a>.<br>
    <a href="/wiki/Popular" class="freelinking" rel="nofollow">Popular</a> : Commissioned by <a href="/wiki/Robb%20Rice" class="freelinking" rel="nofollow">Robb Rice</a> at <a href="/wiki/Danilo%20Black%2C%20Inc." class="freelinking" rel="nofollow">Danilo Black, Inc.</a>, for Popular Mechanics.<br>
    <a href="/wiki/Bosch%20Serif%20%2526%20Sans" class="freelinking" rel="nofollow">Bosch Serif &amp; Sans</a> : Designed with <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, production assistance by <a href="/wiki/Joshua%20Darden" class="freelinking" rel="nofollow">Joshua Darden</a>. Commissioned by <a href="/wiki/United%20Designers" class="freelinking" rel="nofollow">United Designers</a> for Bosch.</p>
    <p>2005<br>
    <a href="/wiki/FF%20Oxide" class="freelinking" rel="nofollow">FF Oxide</a> : Previously known as 5608. Designed for David Mullen at Double A Clothing. Released by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop International</a>.<br>
    <a href="/wiki/FF%20Meta%20Headline" class="freelinking" rel="nofollow">FF Meta Headline</a> : Designed by <a href="/wiki/Erik%20Spiekermann" class="freelinking" rel="nofollow">Erik Spiekermann</a>, produced with <a href="/wiki/Joshua%20Darden" class="freelinking" rel="nofollow">Joshua Darden</a>. Released by <a href="/wiki/FontShop" class="freelinking" rel="nofollow">FontShop International</a>.</p>
    <p>2006<br>
    <a href="/wiki/Farnham%20Headline" class="freelinking" rel="nofollow">Farnham Headline</a> : Commissioned by Esterson Associates and de Luxe Associates.</p>
    <p>2007<br>
    <a href="/wiki/Publico" class="freelinking" rel="nofollow">Publico</a> : Originally designed with Paul Barnes; production and design assistance by Kai Bernau. Commissioned by Mark Porter and Esterson Associates for <em>Público</em>.</p>
