    <p><strong><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20190728103020/http://www.typophile.com/node/17745" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Designers</a>&nbsp;: Christian&nbsp;Schwartz</strong></p>
    <p>Born: New Hampshire,&nbsp;1977</p>
    <p><strong>Career History</strong><br>
    1999: Graduated Carnegie Mellon University (Communications Design)<br>
    1999: <a href="/web/20190728103020/http://www.typophile.com/node/15651" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MetaDesign</a> Berlin<br>
    2000: <a href="/web/20190728103020/http://www.typophile.com/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a><br>
    2001: <a href="/web/20190728103020/http://www.typophile.com/node/12435" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Orange&nbsp;Italic</a></p>
    <p><strong>Awards</strong><br>
    His work has been honored by the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=New%20York%20Type%20Directors%20Club" title="Create node &quot;New York Type Directors Club&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">New York Type Directors Club</a>, the <a href="/web/20190728103020/http://www.typophile.com/node/13814" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">AIGA</span></a>, the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=D%26AD%20Awards" title="Create node &quot;D&amp;AD Awards&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">D&amp;AD</span> Awards</a>, the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=International%20Society%20of%20Typographic%20Designers" title="Create node &quot;International Society of Typographic Designers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">International Society of Typographic Designers</a>, and the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Cooper%20Hewitt%20National%20Design%20Museum" title="Create node &quot;Cooper Hewitt National Design Museum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Cooper Hewitt National Design Museum</a>.</p>
    <p><strong>Fonts:</strong></p>
    <p>1992<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Flywheel" title="Create node &quot;Flywheel&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Flywheel</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a>.</p>
    <p>1993<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Atlas" title="Create node &quot;Atlas&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Atlas</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a>, some styles unfinished<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Elroy" title="Create node &quot;Elroy&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Elroy</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Hairspray" title="Create node &quot;Hairspray&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Hairspray</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a></p>
    <p>1994<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Twist" title="Create node &quot;Twist&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Twist</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Precision%20Type" title="Create node &quot;Precision Type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Precision Type</a> and the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Agfatype%20Creative%20Alliance%20" title="Create node &quot;Agfatype Creative Alliance &quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Agfatype Creative Alliance </a><br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Ant%20%26%20Bee%20Art%20Fonts" title="Create node &quot;Ant &amp; Bee Art Fonts&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ant <span class="amp">&amp;</span> Bee Art Fonts</a>&nbsp;: Drawings by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Jill%20Weber" title="Create node &quot;Jill Weber&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Jill Weber</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/13426" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontHaus</a>.</p>
    <p>1995<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Zombie" title="Create node &quot;Zombie&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Zombie</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Precision%20Type" title="Create node &quot;Precision Type&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Precision Type</a> and the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Agfatype%20Creative%20Alliance" title="Create node &quot;Agfatype Creative Alliance&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Agfatype Creative Alliance</a><br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Morticia" title="Create node &quot;Morticia&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Morticia</a>&nbsp;: Released by the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Agfatype%20Creative%20Alliance" title="Create node &quot;Agfatype Creative Alliance&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Agfatype Creative&nbsp;Alliance</a></p>
    <p>1996<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Gladys" title="Create node &quot;Gladys&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Gladys</a> (Unreleased)<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bureau%20Grotesque" title="Create node &quot;Bureau Grotesque&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bureau Grotesque</a>&nbsp;: Designed with <span class="caps">FB</span> Staff including <a href="/web/20190728103020/http://www.typophile.com/node/13682" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">David Berlow</a>, <a href="/web/20190728103020/http://www.typophile.com/node/12062" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Tobias Frere-Jones</a>, <a href="/web/20190728103020/http://www.typophile.com/node/13686" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Jill Pichotta</a>, <a href="/web/20190728103020/http://www.typophile.com/node/13683" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Richard Lipton</a>, and others. Mostly unreleased. Some styles commissioned by Entertainment&nbsp;Weekly.</p>
    <p>1997<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Fritz" title="Create node &quot;Fritz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Fritz</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a>.</p>
    <p>1998<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Vendome" title="Create node &quot;Vendome&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Vendome</a> (Unfinished revival of a <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Fran%C3%A7ois%20Ganeau" title="Create node &quot;François Ganeau&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">François Ganeau</a> design orginally produced by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Deberny%20%26%20Peignot" title="Create node &quot;Deberny &amp; Peignot&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Deberny <span class="amp">&amp;</span> Peignot</a>)</p>
    <p>1999<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=VW%20Headline%20Light" title="Create node &quot;VW Headline Light&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">VW</span> Headline Light</a> <span class="amp">&amp;</span> <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Heckschrift" title="Create node &quot;Heckschrift&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Heckschrift</a>&nbsp;: Art directed by <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Stephanie%20Kurz" title="Create node &quot;Stephanie Kurz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Stephanie Kurz</a>. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=MetaDesign%20Berlin" title="Create node &quot;MetaDesign Berlin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">MetaDesign Berlin</a> for Volkswagen <span class="caps">AG</span>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Sandbox" title="Create node &quot;Sandbox&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Sandbox</a> (Unfinished. Designed with <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Chris%20Pacione" title="Create node &quot;Chris Pacione&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Chris Pacione</a>)<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Local%20Gothic" title="Create node &quot;Local Gothic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Local Gothic</a> (Unfinished)</p>
    <p>2000<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Pennsylvania" title="Create node &quot;Pennsylvania&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Pennsylvania</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Casa%20Latino%21" title="Create node &quot;Casa Latino!&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Casa Latino!</a>&nbsp;: Art Direction by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Andy Cruz</a>. Designed with <a href="/web/20190728103020/http://www.typophile.com/node/20595" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ken Barber</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Din%20Condensed" title="Create node &quot;FF Din Condensed&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Din Condensed</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Michael%20Grossman" title="Create node &quot;Michael Grossman&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Michael Grossman</a> for Harper’s Bazaar. Not to be confused with retail version of <span class="caps">FF</span> <span class="caps">DIN</span> Condensed, designed by <a href="/web/20190728103020/http://www.typophile.com/node/40008" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Albert-Jan Pool</a><br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Poynter%20Agate%20Display" title="Create node &quot;Poynter Agate Display&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Poynter Agate Display</a>&nbsp;: Commissioned by the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=San%20Jose%20Mercury%20News" title="Create node &quot;San Jose Mercury News&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">San Jose Mercury News</a> classified section<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=LaDeeDa" title="Create node &quot;LaDeeDa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">LaDeeDa</a>&nbsp;: Art Directed by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Mia%20Hurley" title="Create node &quot;Mia Hurley&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Mia Hurley</a>. Commissioned by gURL.com<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Vectora%20Thin" title="Create node &quot;Vectora Thin&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Vectora Thin</a>&nbsp;: Commissioned by O Magazine<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Addison" title="Create node &quot;Addison&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Addison</a> (Unfinished)<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Boyband" title="Create node &quot;Boyband&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Boyband</a> (Unfinished)<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bilbao" title="Create node &quot;Bilbao&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bilbao</a> (Unfinished)</p>
    <p>2001<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Simian" title="Create node &quot;Simian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Simian</a>&nbsp;: &nbsp;: Art Directed by <a href="/web/20190728103020/http://www.typophile.com/node/20595" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Andy Cruz</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Interstate%20Monospaced" title="Create node &quot;Interstate Monospaced&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Interstate Monospaced</a>&nbsp;: Commissioned by Citigroup.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Coop%20Black" title="Create node &quot;Coop Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Coop Black</a> (lowercase)&nbsp;: Based on <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Coop%20Black" title="Create node &quot;Coop Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Coop Black</a> by <a href="/web/20190728103020/http://www.typophile.com/node/20595" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Coop" title="Create node &quot;Coop&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Coop</a>. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a> for Toys R Us.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=David%20Yurman" title="Create node &quot;David Yurman&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">David Yurman</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Lipman%20Advertising" title="Create node &quot;Lipman Advertising&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Lipman Advertising</a> for David Yurman.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Caslon%27s%20Egyptian" title="Create node &quot;Caslon's Egyptian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Caslon’s Egyptian</a>&nbsp;: Designed with <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Miko%20McGinty" title="Create node &quot;Miko McGinty&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Miko McGinty</a> and <a href="/web/20190728103020/http://www.typophile.com/node/13684" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrus Highsmith</a>. Commissioned by Red Herring.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Benton%20Modern" title="Create node &quot;Benton Modern&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Benton Modern</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a> for the <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Readability%20Series" title="Create node &quot;Readability Series&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Readability&nbsp;Series</a></p>
    <p>2002<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Los%20Feliz" title="Create node &quot;Los Feliz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Los Feliz</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/12208" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Emigre</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Luxury" title="Create node &quot;Luxury&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Luxury</a>&nbsp;: Designed with <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Dino%20Sanchez" title="Create node &quot;Dino Sanchez&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Dino Sanchez</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12435" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Orange Italic</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Chalet%20Cyrillic" title="Create node &quot;Chalet Cyrillic&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Chalet Cyrillic</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a> for Lego.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Harrison" title="Create node &quot;Harrison&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Harrison</a>&nbsp;: Commissioned by Rafael Esquer at @radical.media.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Reform" title="Create node &quot;Reform&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Reform</a> Sketched italic for typeface by Anuthin Wongsunkakon. Released by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=PsyOps" title="Create node &quot;PsyOps&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">PsyOps</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Masthead" title="Create node &quot;Masthead&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Masthead</a> (Unfinished)</p>
    <p>2003<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Neutraface" title="Create node &quot;Neutraface&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neutraface</a>&nbsp;: Art Directed by <a href="/web/20190728103020/http://www.typophile.com/node/20595" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Andy Cruz</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/79139" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Amplitude</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Houston" title="Create node &quot;Houston&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Houston</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Roger%20Black" title="Create node &quot;Roger Black&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Roger Black</a> at <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Danilo%20Black%2C%20Inc." title="Create node &quot;Danilo Black, Inc.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Danilo Black, Inc.</a>, for the Houston Chronicle.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Meta%203" title="Create node &quot;FF Meta 3&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Meta 3</a>&nbsp;: Designed by <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>. Portions drawn by <a href="/web/20190728103020/http://www.typophile.com/node/13683" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Richard Lipton</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Eero" title="Create node &quot;Eero&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Eero</a>&nbsp;: Art Directed by <a href="/web/20190728103020/http://www.typophile.com/node/20595" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Andy Cruz</a>. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a> for the Dulles International Airport.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Symantec" title="Create node &quot;Symantec&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Symantec</a>&nbsp;: Designed with <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Conor%20Mangat" title="Create node &quot;Conor Mangat&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Conor Mangat</a>. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/15651" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">MetaDesign</a> for <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Symantec%20Corporation" title="Create node &quot;Symantec Corporation&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Symantec Corporation</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=ITC%20Officina%20Display" title="Create node &quot;ITC Officina Display&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">ITC</span> Officina Display</a>&nbsp;: Designed by <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Ole%20Sch%C3%A4fer" title="Create node &quot;Ole Schäfer&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Ole Schäfer</a>. Portions drawn by <a href="/web/20190728103020/http://www.typophile.com/node/13683" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Richard Lipton</a> and <a href="/web/20190728103020/http://www.typophile.com/node/13684" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Cyrus Highsmith</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Agfa" title="Create node &quot;Agfa&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Agfa</a>/<a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Monotype" title="Create node &quot;Monotype&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Monotype</a>/<a href="/web/20190728103020/http://www.typophile.com/node/13402" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">ITC</span></a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bailey" title="Create node &quot;Bailey&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bailey</a> (Unfinished. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Danilo%20Black%2C%20Inc." title="Create node &quot;Danilo Black, Inc.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Danilo Black, Inc.</a>)</p>
    <p>2004<br><a href="/web/20190728103020/http://www.typophile.com/node/13632" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal"><span class="caps">FF</span> Unit</a>&nbsp;: Designed with <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Farnham" title="Create node &quot;Farnham&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Farnham</a>&nbsp;: Released by <a href="/web/20190728103020/http://www.typophile.com/node/13681" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Font Bureau</a><br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Neutraface%20Condensed" title="Create node &quot;Neutraface Condensed&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Neutraface Condensed</a>&nbsp;: Art Directed by <a href="/web/20190728103020/http://www.typophile.com/node/20595" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Ken Barber</a> and <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Andy%20Cruz" title="Create node &quot;Andy Cruz&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Andy Cruz</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12703" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">House Industries</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Bau" title="Create node &quot;FF Bau&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Bau</a>&nbsp;: Original idea by <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Popular" title="Create node &quot;Popular&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Popular</a>&nbsp;: Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Robb%20Rice" title="Create node &quot;Robb Rice&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Robb Rice</a> at <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Danilo%20Black%2C%20Inc." title="Create node &quot;Danilo Black, Inc.&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Danilo Black, Inc.</a>, for Popular Mechanics.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Bosch%20Serif%20%26%20Sans" title="Create node &quot;Bosch Serif &amp; Sans&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Bosch Serif <span class="amp">&amp;</span> Sans</a>&nbsp;: Designed with <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>, production assistance by <a href="/web/20190728103020/http://www.typophile.com/node/20594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joshua Darden</a>. Commissioned by <a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=United%20Designers" title="Create node &quot;United Designers&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">United Designers</a> for&nbsp;Bosch.</p>
    <p>2005<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Oxide" title="Create node &quot;FF Oxide&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Oxide</a>&nbsp;: Previously known as 5608. Designed for David Mullen at Double A Clothing. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop International</a>.<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=FF%20Meta%20Headline" title="Create node &quot;FF Meta Headline&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal"><span class="caps">FF</span> Meta Headline</a>&nbsp;: Designed by <a href="/web/20190728103020/http://www.typophile.com/node/13629" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik Spiekermann</a>, produced with <a href="/web/20190728103020/http://www.typophile.com/node/20594" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Joshua Darden</a>. Released by <a href="/web/20190728103020/http://www.typophile.com/node/12019" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">FontShop International</a>.</p>
    <p>2006<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Farnham%20Headline" title="Create node &quot;Farnham Headline&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Farnham Headline</a>&nbsp;: Commissioned by Esterson Associates and de Luxe&nbsp;Associates.</p>
    <p>2007<br><a href="/web/20190728103020/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Publico" title="Create node &quot;Publico&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Publico</a>&nbsp;: Originally designed with Paul Barnes; production and design assistance by Kai Bernau. Commissioned by Mark Porter and Esterson Associates for <em>Público</em>.</p>
    <p><strong>External Links</strong><br><a href="https://web.archive.org/web/20190728103020/http://www.christianschwartz.com/">Personal Site</a><br><a href="https://web.archive.org/web/20190728103020/http://www.fontshop.com/virtual/newsletters/sep2006_b/">FontShop Designer Spotlight: Christian Schwartz</a><br><a>MyFonts, Creative Characters: Christian&nbsp;Schwartz</a></p>
