    <p>Rollerscript Rough and Smooth are now released exclusively on my BRAND NEW WEBSITE! That's right! I'm shouting about it!<br>
    You can find them <a href="http://www.g-type.com/rollerscript-font" rel="nofollow">here.</a></p>
    <p>Not only that, but they also have a 25% discount for the whole of February along with every other G-Type font, many of which have been updated/extended/improved to OpenType.</p>
