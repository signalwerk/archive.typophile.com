    html: |-
      <p>No Hrant, it doesn't. I put ink blots, spatters, fingerprints and crossings out in my previous script Olicana because I made it with a steel nib and ink. During the process of writing sheets it occasionally became quite messy, so I included that 'mess' in the font.</p>
      <p>Rollerscript was far less messy because I used a green Pentel pen. I did insert some emoticons, symbols and underlines. I suppose I could update with crossings out at a future date if there is a demand for it.</p>
