    html: |-
      <p>Do you have both flat kerning and OT {kern} feature kerning? If so, are both sets equivalent?</p>
      <p>I suppose it’s possible that some applications are reading kerning data from one place and other apps from the other. That could explain the discrepancies.</p>
      <p>But I couldn’t say for sure. Just a guess. Something to look into.</p>
      <p>You might want to post this topic in the <a href="http://typophile.com/forum/6" rel="nofollow">Build</a> forum to get the attention of the more technically-savvy folks.</p>
  - id: 454536
