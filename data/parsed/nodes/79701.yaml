  html: |-
    <p>I'm having some specific kerning issues. Has anyone ever had inconsistent kerning show up in Photoshop, TextEdit, &amp; Windows WordPad? Almost all the kerning for a certain font shows up, but there are glaring exceptions (for example, Ke, Ka, Ta, fo). These errors are the same for all three of these programs. The same text in Mac or Windows Illustrator is perfect. </p>
    <p>With a different font, I have the same above problem except that the Windows Photoshop works perfectly while my Mac Photoshop does not. I have FontExplorer and have emptied all caches from applications &amp; my system and still get the same problems in Photoshop. I realize most type work is done in Illustrator or InDesign, but it should still work in Photoshop.</p>
    <p>Any ideas?</p>
