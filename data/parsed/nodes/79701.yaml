    date_raw: 5 Mar 2011 — 10:02am
    votes: null
    html: <p>What program did you use to generate the kerning pairs? What program did you use to generate the font? Did you follow the instructions for properly generating a font using your font software? And if you’re using kerning classes have you examined them for errors?</p>
