    html: "<p>In addition to what Kent wrote: Keep in mind that tabular figures are rarely activated on an inline level, but typically are applied to the whole document, or at least to whole blocks like tables (manually or via paragraph styles). These blocks also include characters other than figures. You don’t want to lose the kerning for those other strings. Granted, in sophisticated applications, savvy users could tinker with GREP styles to address the figures only. Still, it is not easier, but harder.</p>"
