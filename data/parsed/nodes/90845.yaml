    html: |-
      <p>How do you think we did it back in the old days with photocomp? It was a pain in the posterior then, and it still would be.</p>
      <p>&amp; by the way, when I go into fonts and set them up for actual use, most proportional figures do not keep the same width as the tabular. As Nick says, there are exceptions, depending on the original design.</p>
      <p>All you're seeing is laziness. Fonts used for setting text should have both tabular and proportional figures, &amp; probably in each of old style and lining. Fonts for setting display don't need tabular at all, right?</p>
