    html: |-
      <p><cite>good tabular figures are more than just proportional figures with the same set width.</cite><br>
      granted, but are good proportional figures more than just tabular figures with different set widths?<br>
      In fonts I've examined, the outlines of tabular and proportional figures (both lining and oldstyle) are exactly the same, with the exception of the 1 (sometimes!). Seems to me that it makes more sense to add kerning to tabular figures rather than duplicate 10 or 20 glyphs, when I feel like my tabular figure outlines will also work adequately in a proportional setting.<br>
      Would it be possible to put a proportional figure 1 only into the proportional figures feature, along with the kerning? can you even put kerning into a feature other than the kern feature?</p>
