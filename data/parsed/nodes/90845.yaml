  html: <p>What are your opinions on using kerning of tabular figures instead of adding proportional figures? That way the user could easily make figures tabular by turning kerning off, or proportional by turning it on.</p>
  html_clean: <p>What are your opinions on using kerning of tabular figures instead of adding proportional figures? That way the user could easily make figures tabular by turning kerning off, or proportional by turning it on.</p>
