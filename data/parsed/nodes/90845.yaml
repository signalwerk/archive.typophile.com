    html: |-
      <p>I’ve implemented some fonts with tabular glyphs in the tab features, and only “one” and “seven” (and sometimes “zero” in oldstyle) glyphs in the proportional features, kerned. (Kerning occurs between glyphs, irrespective of whatever feature they are in.)</p>
      <p>However, I’ve done several typefaces where most, if not all, of the tabular and proportional figures have different glyphs.</p>
      <p>**</p>
      <p>It wouldn’t work to rely on users to turn kerning off/on—nobody reads the manual!</p>
      <p>**</p>
      <p>The worst thing is, many users—I hesitate to call them typographers—apply Optical Kerning as their default. Aaaaagh!!!!</p>
