    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Foundries" class="freelinking" rel="nofollow">Foundries</a> : Emigre</strong></p>
    <p>Historians of the future might regard Emigre as pioneers into digital typography. Common knowledge puts Emigre, led by wife and husband duo <a href="/wiki/Zuzana%20Licko" class="freelinking" rel="nofollow">Zuzana Licko</a> and <a href="/wiki/Rudy%20Vanderlans" class="freelinking" rel="nofollow">Rudy Vanderlans</a> at the forefront of the digital foundry era. The foundry got its start in 1984 when Zuzana designed a series of bitmap fonts for the new Macintosh from <a href="/wiki/Apple%20Computer" class="freelinking" rel="nofollow">Apple Computer</a>. For nearly two decades Emigre put out <a href="/wiki/Emigre%20Magazine" class="freelinking" rel="nofollow">Emigre Magazine</a>, a monthly publication of the same name, with thoughtful essays and articles aimed to stir up dialogue and of course drive sales of their typefaces.</p>
    <p>Website: <a href="http://www.emigre.com" title="http://www.emigre.com">http://www.emigre.com</a></p>
