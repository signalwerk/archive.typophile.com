    <p>After reading a few old posts about appropriate sans serifs to accompany classic serifs, I decided to make an attempt at designing a sans serif to accompany the <a href="http://typophile.com/node/100527" title="Click to visit an external URL." class="freelink freelink-external freelink-external">Benedictine Pro</a> face. Tentatively named Benedict Sans, here's what has been done so far for the regular weight (to be followed by book and bold):<br><img src="/sites/default/files/old-images/benedict_sans_6417.png"><br>
    Thanks in advance for your attention. And have a nice summer ...</p>
