    <p>After reading a few old posts about appropriate sans serifs to accompany classic serifs, I decided to make an attempt at designing a sans serif to accompany the <a class="freelinking external" href="http://typophile.com/node/100527" rel="nofollow">Benedictine Pro</a> face. Tentatively named Benedict Sans, here's what has been done so far for the regular weight (to be followed by book and bold):<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/benedict_sans_6417.png"></div><br>
    Thanks in advance for your attention. And have a nice summer ...<p></p>
