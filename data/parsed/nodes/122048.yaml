    html: |-
      <p>Hi Jim,<br>
      I'm afraid I don't know much about free fonts, but I can say that if you're looking for spatial efficiency, a small x-height is counterproductive. It's the printed size of the band occupied by x etc. that determines type's apparent size, so the smaller the x-height, the larger the point size required. </p>
      <p>On Windows, most people use <a class="freelinking external" href="http://www.fontlab.com" rel="nofollow">FontLab Studio</a> (or, for beginners, the same company's TypeTool) to design fonts. On Macs, <a class="freelinking external" href="http://www.glyphsapp.com" rel="nofollow">Glyphs</a> has become popular. There's also the free and capable but slightly forbidding <a class="freelinking external" href="http://fontforge.github.io/en-US" rel="nofollow">FontForge</a>.</p>
      <p>By the way, "slab serif" usually implies serifs that are particularly thick, not just rectangular, as in Linden Hill (which is really Fred Goudy's Deepdene, renamed probably for legal reasons).</p>
