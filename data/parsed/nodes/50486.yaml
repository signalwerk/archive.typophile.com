    <p>Hi everyone,</p>
    <p>For my masterproject i’m writing about the conflict of academic - professional designers.<br>
    I want to work for this thesis around the book - Twenty-two things you should never do with typefaces - by Enric Jardi.<br>
    For every rule he tels not to do, i want to prove that it can be done, because type is more than rules, it’s about a feeling, you cant just say how to become good type… atleast not in a radical way…</p>
    <p>The first thing i want to bring up is the following:</p>
    <p>“Avoid script, Letters that look like handwriting can be a nice decorative resource, but they are not exactly typefaces”.<br>
    This is rule Nr. 8 in the book</p>
    <p>I want to prove that you can use script letters properly, so now my question is, can you guys give me good examples of the correct use of script letters, or is this rule correct? Shouldn’t you use them? What are good script letters and are there well-known designers who use them frequently?</p>
    <p>I realy hope this brings a discussion alive, because it would help me very much and i would use all the text in my project that is posted here.</p>
    <p>Best regards,</p>
    <p>Olivier</p>
