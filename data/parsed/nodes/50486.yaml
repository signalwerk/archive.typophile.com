      <p>I think this Enric Jardi list is a sort of social engineering — he’s assuming the reader is probably in school, a newcomer to design, or just doesn’t know a whole lot about typography. I would imagine he’s a proponent of the philosophy that “you need to know the rules before you can break them,” which I happen to agree with. </p>
      <p>The worst that could happen, if let’s say a design student really takes his list to heart and lives by the rules their whole career, is that they produce safe design. It’s probably boring uninspired work most of the time, but at least the world is safe from their terrible experimentation, and most of what they produce will at least be “effective,” in the sense that it will look like professional work </p>
      <p>The best situation is if they learn the rules, try to follow them, but then figure out on their own after a few months or years that there are a whole lot of exceptions to the rules. Personally, memorable learning moments for me have been when I see something I was taught was true is not always true, or is flat out false. </p>
      <p>I think the most common situation, however, is for people to totally disregard the rules just because they are called rules, and they don’t want to design according to set parameters — they want to reinvent the wheel, be the next David Carson. It would be much worse to learn the rules and abide by them your whole life, to be sure. But I think most people spend a lot of time trying to be totally original, and not not enough time absorbing influences and then naturally evolving that into their own voice. </p>
      <p>Of course, you need to really believe that the rules are “The Rules” in the beginning, otherwise you’re not going to take them seriously.</p>
