      <p>There is a book a couple years back, which I don’t recall the title; but it was double sided. One side had traditional typography explaining the rules, and the other side was more contemporary and broke each rule. Maybe someone here might recall that.</p>
      <p>As for scripts being plastic... all type is nothing more than images that represent language. It may be true that calligraphic scripts are not “the real thing” compared to directly written lettering, but they can still convey much of the beauty and energy of hand written text. Calligraphic and handwritten type designs like other display faces have their place in design and are certainly validated by the test of time.</p>
