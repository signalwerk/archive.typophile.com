      <p>Greetings John.</p>
      <p>I have been involved with a couple of universities for a number of years. I noticed that those who were not producing, working in the real world, subjecting themselves to client scrutiny were proliferators of bs. Their rhetoric was basically untested, erroneous and pure tripe. The profs who were splitting their time between the REAL world and academia were much more grounded. Does that help John? Pretty simplistic but what I found.</p>
      <p>I once taught a class in Lettering in Contemporary Design. Much to my surprise at the end of the semester the Chairman called me in. He told me the students came in en masse and said they learned more from my class than they had learned in 4 semesters of typography. All the type teachers were educated, but non practitioners!</p>
      <p> Michael</p>
