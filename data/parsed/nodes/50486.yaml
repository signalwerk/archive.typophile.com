      <p>I like Wrenfern’s idea above. The end goal is good design, and there are multiple ways to get there. Some people do it through strict rules, some people do it through having a rule about no rules or trying to break the rules, and most of use a combination of conventions with our own personal spin. </p>
      <p>My feeling is that the people who really stand out are those who go to polar extremes — for instance in the Helvectica documentary, they interview people like Massimo Vignelli and Stefan Sagmeister. They don’t interview Joe or Jane Designer who does some pretty nice annual reports, and gets a few things in the annuals every year.</p>
      <p>The question of “is there one approach, regarding the adherence to, rejection of, or finding some middle ground in terms of rules, that produces good design?” is a much more interesting question to me. My guess is that all hinges if you’re looking for regularity — people who adhere to rules are going to produce design that is more predictably good than those who are wildly experimental. The wildly experimental person is going to maybe produce a lot of failures, but a few incredibly memorable things as well. But that’s just my guess.</p>
