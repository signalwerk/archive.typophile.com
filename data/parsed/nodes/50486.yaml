      <p>There is also something to be said for a period of a completely naive approach to design where you have not learned any rules or axioms. With this once in a lifetime opportunity, you get to struggle with the forces that make type work or fail and apply your logic to why certain things affect each other. This tact brings a learning which is deep and substantive. You may find that you arrive at a similar set of “rules” but you really get a better grasp of “why” these rules came about. Afterwards, you can study all the rules and dialogue about them with a real understanding of when to apply and when to ignore the rules. If you learn the rules first, you can never experience the child-like state of discovery that unbounded learning can bring you.</p>
      <p>ChrisL</p>
