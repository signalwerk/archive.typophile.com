      <p>The problem with the “breaking the rule or not” mentality is that it’s never really a binary decision. This is something Modernism (my definition of which extends back to the Ancient Romans) has forced on us, and it’s time to break free of those shackles.</p>
      <p>Believe you me, I can appreciate the desire to break rules - so many of them around us are so stupid (although mostly the ones made by politicians in a democratic system, not the ones made by craftsmen). But starting with the assumption that any rule must be false is stupid too.</p>
      <p>For example, reading text is not just a matter of habit; the human eye and brain prefer certain things, like type that’s within a certain size range. Similarly, if you assume that a typeface designer has made his curves just so, blindly compressing/extending type is unintelligent and unwise. Testing the limits of such rules is highly commendable, but being intent on breaking them is sad old 90s PoMo.</p>
      <p>hhp</p>
