      <p>Oh <em>yeah</em>, WELL, <strong>WELL</strong>...<br>
      (I’m sorry, I tried, but couldn’t really muster an emotional reaction.)</p>
      <p>I can offer these clarifications however:<br>
      1) What I felt was a very abrupt, gentle but significant vibe. Unless I’m an expert at self-hypnosis, my Agenda, which is conscious, I doubt could have had such a visceral effect. Essentially, my anti-chirographic stance comes just as much from the depths of my being as it does from the (contextual) heights of my thought.<br>
      2) It was Palatino Italic’s physical presence on the rectangular face of a stick of metal that I found “fraudulent”. Palatino -especially the Roman- as an abstact design itself is perhaps less offensive to me. That said, even if I think any font has its place, I don’t personally believe Palatino is something to be emulated, especially not today.<br>
      3) Whatever “impact Palatino had when it was released” is not relevant to my stance, and certainly not my anecdote. The Black Plague also had a large effect on Europe.</p>
      <p>hhp</p>
