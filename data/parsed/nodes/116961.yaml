      <p>To begin with, here is what the typeface Chiavari looks like:</p>
      <p><a class="freelinking external" href="http://helenezund.ch/chiavari.html" rel="nofollow">http://helenezund.ch/chiavari.html</a></p>
      <p>Anagrama is in Mexico. It is a design and branding company, and Nación, rather than being the name of a typeface, is the name of a housing project for which they're providing a brand identity.</p>
      <p>So they might be <em>customers</em> rather than unfair competitors to the designer of Chiavari, and only garbled web links to this use of the typeface made it seem like that company was in the typeface design business... sort of.</p>
