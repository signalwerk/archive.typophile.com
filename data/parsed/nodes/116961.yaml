    html: <p>It sounds very much like one of your friends is not quite ethical. I think your best course of action would be to contact Anagrama and provide them with complete documentation that it is your original work being sold to them. If they are like most reputable firms they will quickly back off from using it if that is what you want. They may also provide you with more information as to how they came to use it which might be of help to you.</p>
