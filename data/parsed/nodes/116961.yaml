      <p>Yes, it's too close. And the extent to which it's being used means it most probably is an actual font (although not necessarily one their client has been given a copy of). First thing to do is write a firm but gracious letter asking for an explanation, and outlining your expectations. In terms of expectations, I would set a price for Chiavari and put forth that either purchasing it or switching fonts would be acceptable (noting however that your lack of publication does count against you here).</p>
      <p>BTW:<br>
      1: How come you won in 2012 while the font was from 2009?<br>
      2: They could have also seen it here: <a href="http://typophile.com/node/90125">http://typophile.com/node/90125</a></p>
      <p>hhp</p>
