      <p><cite>It sounds very much like one of your friends is not quite ethical.</cite></p>
      <p>Since the font used by Anagrama closely resembles, but is not identical to, Chiavari, and Chiavari won an award, so its general appearance had received publicity, that conclusion does not seem to be warranted, because there is no reason to assume they got hold of an actual Chiavari font, and no need for them to access privileged information to know what Chiavari looks like.</p>
