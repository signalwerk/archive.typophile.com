    <p>Hi,</p>
    <p>I designed the typeface Chiavari in 2009 and won a TDC award in 2012<br><a href="http://tdc.org/competitionwriteup/tdc-typeface-design-winners-2012/">http://tdc.org/competitionwriteup/tdc-typeface-design-winners-2012/</a><br><a href="https://www.behance.net/gallery/2657771/YARD-RISK-AND-BUSINESS">https://www.behance.net/gallery/2657771/YARD-RISK-AND-BUSINESS</a></p>
    <p>A few days ago, I stumbled upon the rip off version of my font by the studio Anagrama<br><a href="http://www.anagrama.com/portafolio/167-naci%C3%B3n">http://www.anagrama.com/portafolio/167-naci%C3%B3n</a></p>
    <p>Any thoughts on how to react to this and what I can realistically do would be much appreciated.<br>
    Thank you.</p>
    <p>H.</p>
