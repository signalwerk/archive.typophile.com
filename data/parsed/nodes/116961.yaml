      <p>You call it a "rip off version". By that I would interpret it to mean they copied the design and are calling it by another name. Is that the case?</p>
      <p>Or is it a case where they are using an unlicensed copy of your font?</p>
      <p>What you do, or can do, is dependent upon the situation. More information is needed.</p>
