    html: |-
      <p>cordovez for a Wow factor, try to highten the senses. Bold sensual product represnetation with strong clean type.<br>
      As for colour schemes I'm almost of two minds, but try to stay within an analogous colour palette, with labels and type in monochrome (you might try using tight lines of gold or other earth metal tones to highten a black or white label).</p>
      <p>But hey, bold warm colour product palette with a pop of complementary hue 'may' have a chance, but I'd be real careful with that application.</p>
      <p>What's the form of the product containers? And what's the income bracket your client wants to attract?</p>
      <p>__________<br>
      Hiro</p>
