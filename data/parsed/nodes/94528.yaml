      <blockquote><p>So, in the very same book entitled "New Alphabet" you have all those different avatars of the latin alphabet.</p></blockquote>
      <p>I would say you have different "avatars" (renderings) of Crouwel's New Alphabet. Note BTW that a writing system can be defined to a varying extent; the Latin alphabet is very loose and nebulous, and invented alphabets based on it as a rule make things more formalized. For example in my alphabet reform work I've stipulated that the lc "el" leans rightward. Crouwel's has its own formalizations that can be intentionally adhered to or deviated from. All the fonts in that book are essentially strict incarnations of his idea, not merely Latin fonts.</p>
      <blockquote><p>Does the blobbed version belong to the same "font family"? I don't think so.</p></blockquote>
      <p>Why not? It's just a rendering where the pixels are overlapping circles. BTW as far as I can tell that's supposed to simulate what happens on an imagesetter (in "write-black" mode).</p>
