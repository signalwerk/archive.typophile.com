      <p>I didn’t stick with teaching unicase, as I found that despite being educationally useful (offering perspective on the bicamerality of the Western alphabets), it encouraged speculation and experimenting that was a little too expressive and open-ended. I suppose I could have limited students to a particular ﬂavor of unicase alphabet, probably the Alphabet 26 variant, but that would have been restrictive. Alternatively, the constraint could have been to a certain genre of typeface, e.g. oldstyle or geometric sans, while keeping the unicase alphabet options open.</p>
      <p>At any rate, I moved on to different non-unicase strategies at another design school, and haven’t taught for 18 months.</p>
