      <p>I designed a (moderately) new alphabet, which I named “Panoptic” and demonstrated in the Panoptica superfamily of typefaces/fonts. So far (10 years) nobody else has developed a typeface using the same alphabet, AFAIK. In fact, I haven’t added any more either. </p>
      <p>In theory, Crouwel’s alphabet could be rendered as a Didone, Oldstyle, whatever.</p>
      <p>Rounded terminals (rather than chamfering) and a conventional-alphabet “stylistic alternate” (or vice versa) would make it more amenable to practical usage by non-robot readers.</p>
      <p>BTW, the area of unicase offers a remarkably plethora of alphabet forms, as my pupils demonstrated when I  taught a type design course and set them the task of designing a unicase face.</p>
