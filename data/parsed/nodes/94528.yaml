      <blockquote><p>nobody else has developed a typeface using the same alphabet</p></blockquote>
      <p>I've learned from my own experience that it's very hard to spread something like that, but without explicit promotion it's pretty much impossible. When people see an actual font it's very hard for them to see the new alphabet behind it. To this day I get emails asking for the so-called Mas Lucida font I made to demonstrate my alphabet reform ideas from 1998, and I have to again explain what the point really was... An alphabet, being an idea, needs to be seen and promoted as a non-tangible thing.</p>
      <p>Unicase: I certainly agree it's an interesting area, but I still think it's a bad idea to start students off with it; if time is limited (and from Art Center At Night course I learned that it always is) I think it's better to just stick to lowercase.</p>
      <p>hhp</p>
