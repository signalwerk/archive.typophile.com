      <p>A brief point of terminology: <em>uncial</em> (note order of letters) refers to a style of lettering that existed before upper and lower case came into being, and <em>unicase</em> refers to modern efforts to blend them back together again.</p>
      <p>Much of the practical value in a unicase is the lack of ascenders and descenders. The list of normally-formed Latin lowercase letters that have a significantly different shape from the uppercase and remain within the x-height are: a, e, m, n, r. That's a short list to work with. But you are right to observe that 'a' and 'e' are given preference. They are among the very most frequent in English and most other Latin languages, and they are vowels. It is reasonable to conjecture that vowels have more impact on the "voice" of a typeface in the mind of the reader.</p>
    html_clean: |-
