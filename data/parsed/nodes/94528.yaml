    html: |-
      <p>It's called "new alphabet", not "new font". Seeing a rendering of it as "too bold" misses the point. Crouwel, along with Thompson, Cassandre, yours truly and a few others have intended to design a variation/improvement of the Latin alphabet itself, not merely a font. In fact even on that very cover above you can see two renderings of his New Alphabet.</p>
      <p>An idea can be patented, but I don't think Crouwel did any such thing; and in my book any alphabet designer must necessarily give up any IP protection, otherwise the idea can never catch on. So to me there are no ethical or legal repercussions possible here.</p>
      <p>Lastly, although I'm not a big fan of the New Alphabet, I wouldn't call it useless simply because it's not sufficiently readable. It's legible enough to be usable, under the right circumstances. Even NotCaslon is.</p>
      <p>hhp</p>
