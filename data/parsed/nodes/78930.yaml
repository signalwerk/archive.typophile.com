  html: |-
    <p>The &lt;code&gt; tag in posts here does not behave as one might expect.</p>
    <p>Leading spaces on a line are still trimmed, and multiple spaces are reduced to a single space. Thus, it doesn't behave like the &lt;pre&gt; tag in HTML.</p>
