      <p>I’ve been using dual displays for the most part since the Mac II days. Two displays around 20” or so works pretty well for type design. I use the main screen for the glyph and font windows with previews and other windows on the secondary screen. When I’m working in most other programs (Photoshop, Illustrator, web, etc.), I usually just use the main screen. I keep my email, calendar, and to-do list on the secondary screen.</p>
      <p>I think larger screens would be even better, but I have noticed that if I am spending a lot of time doing something on the secondary screen, my neck starts to get sore, and I think larger screens would make this worse. Moving the keyboard, mouse and chair helps, but I don’t usually remember to do it. Sometimes I just move the window I’m working in to the main screen temporarily. I also sometimes think a single, very large screen (a 30-incher) would be better.</p>
      <p>My main screen is a 21” Wacom Cintiq, which I’ve had for a couple of years. This is one of those tablet/screen hybrids with which you can draw directly on the surface with a stylus. I thought this would be the ultimate, best display for working on type and doing lettering, but my experience has been mixed. It works great for Photoshop and drawing in general, but not so great for editing fonts. It can’t match the precision of the mouse for making small movements. What I mean by this is that the on-screen cursor has a tendency to jiggle around, as if it can’t decide precisely which coordinate it’s on, even when you hold the stylus rock steady. This never happens with a mouse. Because of its size, figuring out where to put the keyboard when you’re using it to draw is a real puzzle, and you always need to be able to use the keyboard, even while drawing. There is a limit to how upright the display can go, so even in it’s most upright position, it’s fairly tilted back, and this causes a glare problem when you have overhead lighting. So, great idea, really fun to use, but problematic.</p>
