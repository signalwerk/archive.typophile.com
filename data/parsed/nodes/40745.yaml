      <p>That reminds me: I hope nobody is running 1280 x 1024 for design work!</p>
      <p>The reason being is that of all the standard monitor resolutions, it is the only one that doesn’t match the aspect ratio of the screen. A “normal” (non widescreen) monitor is a 4:3 aspect ratio. But 1280x1024 is 5:4 aspect ratio. Only your software doesn’t know you’re running a non-standard aspect ratio, and all your work is subtly distorted compared to WYSIWYG.</p>
      <p>Cheers,</p>
      <p>T</p>
