      <p>Thomas - please clarify this... (i hope this doesn’t degenerate into the ppi debates of yore).</p>
      <p>1) is there really any such thing as a “normal monitor” ?<br>
      2) most good monitors come with some adjustments for horizontal and vertical sizing.<br>
      3) i work on one machine that is set to 1280 x 1024 (its maximum resolution),<br>
      but the first thing i do on any monitor is draw a perfect square and circle, print them out, and measure the image on both screen and paper, and adjust accordingly. no problem.</p>
      <p>that aside, my perfect set-up is no computer at all, pencil and paper.</p>
      <p>but seriously, i do try and look at my work in progress on several different monitors for color and distortion. i’m mostly producing motion graphics, but for print i frequently print and compare same at various print settings.</p>
      <p>also, i’m utterly dependent on the largest available tablet and pen for ergonomics and dexterity. i prefer an older wacom, without the new on-tablet side controls, which i find are too easily activated accidently. at a client’s office where i often work they gave me one of those and i had to disable those controls.</p>
      <p>and while we’re on the topic, i’m discouraged that the new imacs and macbooks ship with glossy screens only. when low gloss flat screens came out it was such a relief to be free of unwanted reflections, and now in some bizarre act of consumer fetish manufacturing apple has decided that people want them. why would i want my screen display modulated by anything other than the image i’m working on ?<br>
      i urge anyone who feels the same way to submit a complaint to apple’s consumer feedback forum. perhaps if enough professionals complain they’ll get the message: non-gloss now !</p>
