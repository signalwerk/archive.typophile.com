    <p>I’m currently working on a 15” MacBook Pro with an external 23” Apple Cinema Display. I’m planning to upgrade to a new Mac Pro and I’m trying to figure out the ideal display set up. Anyone use 2 - 30” displays, or 2 to 3 - 23” displays? With my setup now, I’m constantly juggling windows between the 15” and the 23”. Most of my work is in CS3, with mail, iTunes and web open. I’m just curious if anyone has found the dream display setup for this kind of work.</p>
    <p>Thanks</p>
