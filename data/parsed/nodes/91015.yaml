      <p>I think a route could be to align the suffix with p’s descender, and tuck it under the i. In doing so, you will balance the gap.<br>
      As for style, trying to mimic the logo too much in weight and shapes will risk to damage its impact. I rather would try something contrasting, but subservient, like an handwritten-style script.</p>
