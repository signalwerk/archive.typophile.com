    <p>This is a logo I am putting together for my own website.<br>
    I dont have much experience yet, this is my first real go at a logo - It's a lot harder than I ever thought it would be.</p>
    <p>'Eight Three Nine' is the name I have been trading under for the last year.  Mostly low level desktop publishing and some basic web design services.</p>
    <p>Any feedback would be great.</p>
    <p>The website that it will eventually belong to is also being redesigned.<br>
    <a href="http://typophile.com/node/21296" rel="nofollow">This thread</a> has discussion and screenshots related to that.</p>
    <p>Cheers - JonnySchneider</p>
