      <p>Out of all of them, I prefer the mark in version 3 the best. I think version 4 is too subtle because even after explanation, I don't get it. Version 2 looks too much like a shamrock (esp. since it's green), which I guess could work if you wanted to emphasize your Irish / Bostonian roots.</p>
      <p>I say stick with version 3, refine it a bit more, and do something different with the type.</p>
      <p> - Lex</p>
