    html: <p>I would be more impressed if Newsweek would just go back to being a credible news publication. I stopped reading Newsweek because the writing went downhill and they targeted the USA with a dumbed-down version targeted at Bush voters, complete with different covers that avoided contradicting Republican doctrine. No redesign is going to make up for that. Give me an intelligent editorial policy and design by Spiekermann—The Economist shows us why a real news magazine doesn’t need gimmicky graphics to sell.</p>
