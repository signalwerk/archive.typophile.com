    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12038" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Terminology</a>&nbsp;: Lining&nbsp;Figures</strong></p>
    <p>Lining figures, or ranging figures, are numerals which share a common height. Lining figures are often <a href="/node/13898" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Titling Figures</a>, however they may be smaller and lighter than titling figures. Unfortunately, lining figures are the default figure style in most digital fonts where <a href="/node/13897" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Text Figures</a> would be more appropriate. However, this problem can be remedied in <a href="/node/12420" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">OpenType</a> fonts which may offer several sets of figures to be used in different types of settings. Sometimes indicated as <span class="caps">LF</span> in the font’s&nbsp;name.</p>
