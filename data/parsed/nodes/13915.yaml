    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Terminology" class="freelinking" rel="nofollow">Terminology</a> : Lining Figures</strong></p>
    <p>Lining figures, or ranging figures, are numerals which share a common height. Lining figures are often <a href="/wiki/titling%20figures" class="freelinking" rel="nofollow">titling figures</a>, however they may be smaller and lighter than titling figures. Unfortunately, lining figures are the default figure style in most digital fonts where <a href="/wiki/text%20figures" class="freelinking" rel="nofollow">text figures</a> would be more appropriate. However, this problem can be remedied in <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> fonts which may offer several sets of figures to be used in different types of settings. Sometimes indicated as LF in the font's name.</p>
