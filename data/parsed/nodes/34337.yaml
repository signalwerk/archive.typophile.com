      <p>I get what you are saying, but I can assure you that’s not the case, I just registered the block site.</p>
      <p>As for demographics, we’re going for any age group, so something to go for younger people but won’t turn off older people. We have some mockups though, take a look.</p>
      <p><a href="http://www.divshare.com/download/939177-7ff" title="http://www.divshare.com/download/939177-7ff">http://www.divshare.com/download/939177-7ff</a></p>
      <p>I like the very last one and and column 2, row 4. You can see the general idea though, to have the .com in a block with rounded edges. This logo we want to put for the site, business cards, t-shirts, so we want it to blend well. I gave other sites as examples of what we are going to do, the site is still being developed, so forgive me if i can’t really give you much more to work with.</p>
