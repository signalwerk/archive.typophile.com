      <p>Well, here's the problem: fonts such as the very ornate one have almost no commercial appeal and the resources required to make such a font exceed that which one could afford to put into it, timewise, except for very large firms such as Monotype.</p>
      <p>I agree they are beautiful and I love looking at them, but for the most part the "fonts" on those old ornate covers are actually engravings, not type.</p>
