    html: <p>Yeah, I know they're mostly engraved / carved / drawn on a one-off basis. But with so many new independent designers, hobbyists and amateurs out there with the ability to design from their laptops in their pajamas, I think ornate fonts have more commercial appeal now than ever. But I'm no expert. I'm going to try and take a crack at, very least, designing a band logo based on that Pennsylvania text. Maybe I can even make it into a font.</p>
