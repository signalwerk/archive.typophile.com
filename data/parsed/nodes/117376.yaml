    <p>I don't know how many of you are already aware this exists, but the <a href="https://www.flickr.com/photos/britishlibrary/sets" target="new50" rel="nofollow">British Library</a> has a ton of amazing scans of 19th century text &amp; illustrations on Flickr. They're fascinating to browse through but also incredibly useful since by now they're all well into the public domain. Some of the illustrations are just begging to be used by amateur poster designers, and there's plenty of treasures for font artists looking for ideas and a HUGE challenge! (I highly doubt anything close to many of these hand-lettered titles exists in digital typeface form)</p>
    <p>So far one of my absolute favorites is this old book cover, I would kill for a font like the one used in the main title!</p>
    <p><img src="http://typophile.com/files/pennsylvania-illustrated.jpg"></p>
    <p>And the old comic / story book covers have a wealth of friendlier, informal type designs:</p>
    <p><img src="http://typophile.com/files/buckskin-king.jpg"></p>
    <p>Any long-forgotten antique custom-letters or typefaces that make you drool?</p>
