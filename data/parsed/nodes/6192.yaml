  html: <p>Dear font lovers, <br> <br>hello I am TypeSmith and a German fontaddict,  <br>I never saw a fonts &amp; typography chatroom so  <br>I decided to create one for discussion about  <br>font-design, typography and prepress stuff.  <br> <br>Would be glad to see somebody there ;-)  <br> <br>You can go to the room by using your browser  <br>via <a href="http://www.freewebz.com/typesmith/chat.html" target="_top">http://www.freewebz.com/typesmith/chat.html</a>  <br>or use an IRC client, host is "webmaster.ca.us.webchat.org",  <br>channel is "#fonts&amp;typography".  <br> <br>Greetings from Germany  <br>TypeSmith</p>
  html_clean: <p>Dear font lovers, <br> <br>hello I am TypeSmith and a German fontaddict,  <br>I never saw a fonts &amp; typography chatroom so  <br>I decided to create one for discussion about  <br>font-design, typography and prepress stuff.  <br> <br>Would be glad to see somebody there ;-)  <br> <br>You can go to the room by using your browser  <br>via <a href="http://www.freewebz.com/typesmith/chat.html" target="_top" class="link-external">http://www.freewebz.com/typesmith/chat.html</a>  <br>or use an IRC client, host is "webmaster.ca.us.webchat.org",  <br>channel is "#fonts&amp;typography".  <br> <br>Greetings from Germany  <br>TypeSmith</p>
