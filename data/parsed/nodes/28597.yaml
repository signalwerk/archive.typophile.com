    <p>Anyone pls help, I need your comment or idea about this topic...<br>
    I'm searching some information about Superhero Typography (superhero which adapted from comic: marvel, DC), or may be it usually called typeface. Recently, I'm perceiving about superhero typeface on movies poster, and I found almost of them, they have same characters, such as bold, silver, futurictic, strong.... it's just like recent trend about superhero typography...<br>
    Anyone knows why they use that kind of typeface, what are the font name?? and do u guys know who the designers are??? (spiderman, x-men, daredevil, fantastic four, blade, etc....). Anyone knows what site has more information about this?</p>
    <p>Thanks &amp; God Bless You All..</p>
    <p>shierly<br>
    from Indonesia</p>
