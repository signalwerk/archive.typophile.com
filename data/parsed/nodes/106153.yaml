    html: |-
      <p>The Prague letterhead is not in my standard references. So I explored some weak leads.<br>
      Jan Tschichold did decorative lettering in the early 1920s with some similarities to the Prague letterhead. This was the basis for <a href="http://www.myfonts.com/fonts/itc/ironwork/<br />
      /" rel="nofollow">ITC Ironwork</a>, designed by Serge Pichii in 1997. The unknown font in your image has some similarities to ITC Ironwork.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/ITC_IronworkBEFHIJ_3482.jpg"></div><br>
      Schelter &amp; Giesecke produced  Tschichold fonts but I don't know if they had anything to do with the Prague letterhead font.<br>
      As for modifications, this was not done for metal type in the way we now do for digital fonts. However, typefaces were used as models for lettering and engraving. I note there is variation in some letters, such as S, so this seems like a probable explanation.<br>
      A digital version is not impossible to create based on the information in your image. To assist in seeing the details I did a basic enhancement of it and rearranged the text to reduce horizontal sprawl:<br>
      <div class="imageWrap"><img src="http://typophile.com/files/UnknownPrague1930sTypophile106153b_6667.jpg"></div><br>
      Don<p></p>
