    html: |-
      <p>Definitely in the ballpark Nick. Top heavy monotone and good spirals.<br>
      A few final thoughts.<br>
      This is engraving, not lettering or a typeface.<br>
      Some of the effect can be replicated in Word and similar programs, except for the spirals by using medium [or lightweight] Neutraface Condensed with regular width letters substituted for C, D, G, J, M, N, O, Q, and X:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Prague1930sNeutrafaceCondRegBlend_4490.jpg"></div><br>
      If you edit the font, e.g. vertical flip of B, width adjustments etc, and add some spirals like those in Nick's Darling Emily, you would be very close to the original.<br>
      Don<p></p>
