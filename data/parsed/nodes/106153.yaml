    <p>Font in the image was printed on a letterhead to be used in Prague in the 1930's. Super low x-height/tall ascenders, looks art deco. Would seem like a normal geometric sans except for the occasional swirly terminal. Would this have been a font specific to the area, or would it have been imported (the type or even just the letterhead) from another country? Is this a specific typeface or perhaps it was modified or something to get the terminals?</p>
