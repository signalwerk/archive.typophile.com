    html: <p>I'm going to venture hand-drawn. As a thin, monoline geometric lettering style it's relatively straightforward to keep consistent with a ruler and compass. (Although it's still very skillfully done, not least the spacing!). What betrays it is the /S/es, none of which are alike.</p>
