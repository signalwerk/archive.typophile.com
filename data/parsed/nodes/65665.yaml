    html: <p>Hm... Well, I like to I think I had relatively good taste in type even when I was in high school. The earliest typefaces I remember liking back then were Windsor, Avant Garde, and Bookman, all in rub-down type. I remember thinking the ITC faces I saw in the Chartpak catalog were the best-looking. I had an aversion to what we call "retro" now--brush scripts and the like. I used Korinna for my first personal letterhead when I was in college in about 1975. I think my wardrobe was more cringe-worthy than my type choices back then--polyester shirts, bell-bottoms, and aviator frames. Bleah.</p>
