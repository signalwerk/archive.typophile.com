    html: <p>I feel sincerely sorry for my middle school yearbook cover design. I had combined a playful brushy font with Copperplate, the latter set in a rainbow of colours, which was cringe-worthy enough. But the yearbook advisor was attached to the idea of using Aboriginal paintings—the kind with colourful mosaic-like arrays of dots—for the background, which left the cover an undistinguishable splash of various colours and rendered the whole thing unreadable. Even my young self knew that the type and cover didn't go together, although I dared not speak up about it.</p>
