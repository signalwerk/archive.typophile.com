    <p>Nobody was born with good sense, the ability to do calculus  or good taste in typography. These things are learned.</p>
    <p>what cringe-worthy type choices are hidden in our pasts?</p>
    <p>I'll start.</p>
    <p>I once used Papyrus for the logo of a roofing contractor. </p>
    <p>Big blue letters and a roofy-shaped thingy on his big white van, </p>
    <p>He loved it.</p>
