      <p>It is neither here nor there as they, Gill and Johnston, do look alike in many ways... But, IIRC from my own research on Perpetua, Eric only attended 3 meetings in the beginning of the development. </p>
      <p>I think Johnston is much more Geometric and adheres too much to the circle for my taste.</p>
