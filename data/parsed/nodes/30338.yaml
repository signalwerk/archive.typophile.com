    html: |-
      <p>Actually, InDesign supports 'cpsp' (capital spacing) and 'case' alternates, both of which are activated by clicking on "all caps" formatting.</p>
      <p>InDesign also supports 'kern'.  :)</p>
      <p>However, everyone who knows the answer to your question about CS3 features is under a nondisclosure agreement with Adobe and can't talk about it yet. In my case, it's part of my employment contract.</p>
      <p>Cheers,</p>
      <p>T</p>
