    <p>Of round about <strong>50</strong> OpenType Features <strong>Adobe InDesign CS2</strong> supports about <strong>16</strong>. Does anybody know if the planed <strong>InDesign CS3</strong> release will support more?</p>
    <p>/* Vertex */</p>
