    html: |-
      <p><strong>@ auricfuzz</strong></p>
      <p>Here below all Indesign CS2 OpenType Features:</p>
      <li>Discretionary Ligatures</li>
      <li>Fractions</li>
      <li>Ordinal</li>
      <li>Swash</li>
      <li>Titling Alternates</li>
      <li>Small Caps</li>
      <li>Slashed Zero</li>
      <li>Stylistic Sets</li>
      <li>Superscript / Superior</li>
      <li>Subscript / Inferior</li>
      <li>Numerator</li>
      <li>Denominator</li>
      <li>Tabular Lining</li>
      <li>Proportional Oldstyle</li>
      <li>Proportional Lining</li>
      <li>Tabular Oldstyle</li>
      <li>Default Figure Style</li>
      <p><strong><br>
      And here the Features OpenType offers:<br>
      </strong><br>
      <a href="http://partners.adobe.com/public/developer/opentype/index_tag3.html" rel="nofollow">OpenType Features</a></p>
      <p>/* Vertex */</p>
