  html: |-
    <p>Occasionally I've gotten this warning when font audit is on in FontLab. It says "move is empty" and says the point is invisible and should be removed. However, if you remove it the next node says the same thing. Anybody know what this means? I can't find a reference to it in the manual or elsewhere.</p>
    <p>Thanks,</p>
    <p>Stephen Rapp</p>
