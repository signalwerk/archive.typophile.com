    <p>- - - - - - - - - - -</p>
    <p>Justin Howes lecture 2006<br>
    21 February in the Bridewell Hall, St Bride Institute</p>
    <p>- - - - - - - - - - -</p>
    <p>Handmade type: thoughts on the future of typographical materials</p>
    <p>A world in which printing would no longer be done from relief metal type<br>
    was already foreseen half a century ago or more, and when the effective<br>
    end came during the 1970s it was rapid and almost complete, leaving<br>
    traditional processes that had once been universal in the hands of craft<br>
    printers and type-makers.</p>
    <p>But the materials for making type, like the punches and matrices which<br>
    hardly changed for centuries, are durable. Huge quantities survive. Not<br>
    only can they still be made to serve the purposes for which they were<br>
    originally created but, taken together, they form an archive that can<br>
    still yield new information about the types that were used to set and<br>
    print the books of the past, and some of which form the model for<br>
    digital types that are used today.</p>
    <p>The task of preservation is a formidable and an expensive one, and those<br>
    who are willing or able to undertake it are rare. The urgent question<br>
    that now needs to be addressed is, how will the long-term preservation<br>
    of this archive be achieved, and who will set the agenda for future<br>
    research?</p>
    <p>- - - - - - - - - - -</p>
    <p>Justin Howes died in February 2005. This lecture, the first of a series,<br>
    is given in his memory. He was not only a distinguished scholar, whose<br>
    wide-ranging researches were making an important contribution to our<br>
    understanding of the types and lettering of the past, but he learned to<br>
    cast type by hand and to demonstrate to others the techniques of a<br>
    secretive and mysterious trade.</p>
    <p>James Mosley, Visiting Professor in the Department of Typography in the<br>
    University of Reading and former Librarian of the St Bride Library,<br>
    writes and lectures on the history of type.</p>
    <p>- - - - - - - - - - -</p>
    <p>The lecture is on 21 February 2006 and starts at 7pm.<br>
    It will take place in the Bridewell Hall, St Bride Institute.<br>
    Entry is free.</p>
    <p>- - - - - - - - - - -</p>
    <p>For more details, or to contact the Library, please see <a href="http://www.stbride.org" title="www.stbride.org">www.stbride.org</a></p>
