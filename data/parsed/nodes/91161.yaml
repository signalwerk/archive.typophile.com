      <p>The mock-up cases look a bit stripped and bare. That might be the point, but even so, to me it looks like they "lack" visual elements or refinement. Is the "Let'em Burn!" slogan on the mock-up backside supposed to be off center? If so, why?<br>
      I personally like the "MADE IN HELL". It is a concept and you can be self-ironic. Pushing it one step further would be to take the essece of that slogan and bring it to a level that actually could be on a real product with a young non-mainstreamish target group. Something like "The stuff from hell, made in San Diego" (just a clumsy example of what I mean).</p>
      <p>Overall, I like how you developed the blackletter script from your initial post. Maybe you could pick up the diagonal energy and intensity of the font in some way, or highlight the contrast to the more reserved serif even more clearly? The "Let'em Burn!" slogan stands out from the overall concept as an isolated element.</p>
