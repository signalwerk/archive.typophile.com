      <p>&gt;  has there been any discourse about design and ethics</p>
      <p>Not sure specifically what you're referring to, Christopher, but it brings to mind two events in my past related to design and cigarettes.</p>
      <p>First, when I was a college student we had a guest speaker who worked for Phillip Morris' ad agency (the Marlboro account, I think). He talked about designing cigarette packaging, advertising, and signage. He got a very hostile reception from many of the design students, much to the embarrassment of the professor who had invited him.</p>
      <p>Second, the only design job I've ever turned down for ethical reasons was when I was asked to design a cigarette-related brochure.</p>
      <p>Don't get me wrong, I've got no problem with adults smoking if they choose to, and I occasionally smoke a cigar on special occasions. But I wouldn't feel comfortable promoting them.</p>
