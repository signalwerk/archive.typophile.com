      <p>I have used the program and achieved acceptable results with a few add-ons, available free. The biggest problems with the exiting version is that you can't see your results graphically within the program itself.</p>
      <p>There were plans underway to release a version in 2012 with a graphic user interface but, as far as I know, that hasn't happened.</p>
