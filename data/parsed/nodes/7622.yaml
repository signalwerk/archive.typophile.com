    html: <p>To make it short, its a hot thing. <br>- Typoart have digitized lots of its type faces - Ikarus System <br>- the rights holds a Mr. Holzer, but he is away  since he is wanted... <br>- the data exists on forgotten places - Mr. Holzer have no access to my knowledge <br> <br>As I have heard, he have tried to sell the rights. But its a hot thing to make deals with a wanted deptor. Till now, all living designers of typoart got nothing, no royalties, no public recognition.  <br> <br>ps. Sprich doch mal mit Bruno.</p>
