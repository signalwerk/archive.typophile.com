    html: |-
      <p><cite>In fact, Super-Grotesk was not a Typoart typeface. Arno Drescher’s original Super-Grotesk was designed around 1930</cite></p>
      <p>In 1950 it was redesigned by Schriftguss Dresden (pre-<a href="http://www.typografie.info/typowiki/index.php?title=Typoart">Typoart</a>) for Linotype matrices, under the name of ‘Super Buchgrotesk’.<br>
      Later, Karl-Heinz Lange <a href="http://www.flickr.com/photos/hardwig/1476781123/in/pool-typostammtisch-berlin/">redrew</a> it for photocomposition during his time at VEB Typoart.</p>
    html_clean: |-
