    <p>A bit of background: This is the logo for a wedding-related site (“bröllop” means wedding in swedish). The idea was to create something a bit “weddingy”, but not too formal, more fun. </p>
    <p>This has been my fist serious attempt at designing any lettering “from scratch”: It’s been tough! I’d appreciate any feedback and critiques, especially on curves that look weird and the kerning- i’m not really sure how to kern a semi-script text.</p>
