    <p>I've been trying to identify the font used in the graphic below and I'm wondering if someone with a little more experience in this area could please help?</p>
    <p>In my quest, I've found quite a few older Letraset scripts that are almost similar, yet nothing exact. I figured before throwing in the towel and assuming it's handlettered, I'd ask someone here for their help. </p>
    <p>The reason I mention Letraset is, while searching the MyFonts site, I noticed a good number of their script fonts are somewhat off the wall. Which in a sense, is exactly what I'm looking for.</p>
    <p>Can anyone offer a little help in my quest? Thank you.</p>
