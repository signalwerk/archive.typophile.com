    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Technical%20Info" class="freelinking" rel="nofollow">Technical Info</a> : Haansoft Unicode Blocks and UniPad Features</strong></p>
    <p>This article is designed to list which <a href="/wiki/Unicode" class="freelinking" rel="nofollow">Unicode</a> blocks are supported by corresponding font and all of the features supported by Sharmahd Computing's UniPad.</p>
    <p><strong>Supported Platforms</strong><br>
    Microsoft Windows 9x, Windows Me<br>
    Microsoft Windows NT 4.0, Windows 200X, Windows XP<br>
    WINE HQ, for x86-based Unixes, including Linux, FreeBSD, and Solaris<br>
    Windows CE ≥<br>
    Microsoft Windows 3.x<br>
    Linux / X-Windows<br>
    Mac OS X<br>
    Palm OS ≥</p>
    <p><strong>General Features</strong><br>
    Full BiDi support (Hebrew, Arabic, Thaana, Syriac)<br>
    Rendering of Arabic contextual forms<br>
    Separated rendering of non-spacing marks<br>
    Combined rendering of non-spacing marks (!)<br>
    Normalization (maximal decomposition)<br>
    Conversion to precomposed characters<br>
    Case conversion<br>
    Surrogate support<br>
    Printing<br>
    Multi-level undo<br>
    Attributed text<br>
    Coloring/highlighting of formatting characters<br>
    Automatic file format detection<br>
    Conversion of different line separators<br>
    Clipboard support for Unicode<br>
    Clipboard support for other character sets<br>
    Send file as email attachment</p>
    <p><strong>Handling of Formatting Characters</strong><br>
    Line Separator<br>
    Paragraph Separator<br>
    Joiner / Non-Joiner ÷<br>
    Symmetric Swapping Activate/Inhibit ≤<br>
    Arabic Form Shaping Activate/Inhibit ≤<br>
    National Digit Shaping Activate/Inhibit ≤<br>
    BiDi (Embedding, Override, Marks)<br>
    Tabulator</p>
    <p><strong>Fonts / Glyph Sets</strong><br>
    Proportional Unified Bitmap Screen Font<br>
    Fixed Width Unified Bitmap Screen Font<br>
    TrueType support (!)<br>
    Multiple font sizes (!)<br>
    User definable fonts (!)<br>
    User definable Private Use glyphs (!)</p>
    <p><strong>Supported Languages</strong><br>
    Note: all these languages are supported theoretically, because the scripts that are used to write these languages are supported by Unicode and UniPad. Please see under Supported Unicode Character for the supported scripts. Some languages are listed more than once, because they are known under multiple names.</p>
    <p>Abaza, Abkhasian, Adighe, Adygei, Afrikaans, African, Ainu, Aisor, Albanian, Algonquin, Altai, Amharic, Amo, Arabic, Aramaic, Armenian, Assamese, Assyrian, Asturian, Avar, Awadhi, Aymara, Azerbaijani (Azeri), Badaga, Bagheli, Bahasa, Balear, Balkar, Balti, Baluchi, Bashkir, Basque, Batak (toba), Bateri, Belarusian, Belgian, Bengali, Berber, Bhasha, Bhatneri, Bhili, Bhojpuri, Bihari, Bini, Bosnian, Braj, Breton, Buhid, Bulgarian, Burmese, Buryat, Byelorussian, Catalan, Chakma, Chechen, Cherokee, Chhattisgarhi, Chinese, Chukchi, Chuvash, Coptic, Cornish, Corsican, Cree, Croatian, Cyrillic, Czech,<br>
