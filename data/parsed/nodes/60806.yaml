    <p><strong>Searching &amp; Replacing</strong><br>
    Searching &amp; replacing<br>
    Case-insensitive matching<br>
    Regular expression matching<br>
    Bracket matching Ø<br>
    Go to line number</p>
    <p><strong>User Interface Languages</strong><br>
    English<br>
