    Character input from Unicode locales (e.g. Hindi) on Windows XP	Yes<br>
    IME character input on non-Asian versions of Windows (e.g. Windows 2000 with East Asian language support)<br>
    Direct Unicode character input from external programs (e.g. keyboard tools that send WM_UNICHAR messages)</p>
