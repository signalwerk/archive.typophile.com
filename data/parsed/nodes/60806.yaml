    <p>(!) This feature has high priority</p>
    <p>(1) Supports all opening and closing punctuation<br>
    (2) Only for Arabic<br>
    (3) These characters are deprecated<br>
    (4) Due to platform restrictions, not all UniPad features are supported<br>
    (5) Font needs the ccmp OpenType feature and accents to combine diacritics automatically<br>
    (6) Automatic visual combination of Hebrew accents is not supported<br>
    (7) Font does not support Syriac shaping, the nominal glyphs are displayed instead. Needs OpenType features to support Syriac shaping<br>
    (8) Contextual forms of those letters are not supported, nominal glyphs are displayed instead. Needs OpenType features to support contextual forms of those letters.<br>
    (9) Automatic arrangement of jamo components as Hangul syllables is not supported. Needs OpenType features to support arrangement of jamo components as Hangul syllables<br>
    (10) Automatic visual combination of vowel marks/accents is not supported<br>
    (11) Vertical direction is not supported, characters are displayed from left to right instead<br>
    (12) Shaping behavior (i. e. selection of glyph variants) is not supported<br>
    (13) All glyphs are monospaced instead of proportional<br>
    (14) The glyphs in the font are not supported, the blank glyphs are displayed instead<br>
    (15) Some glyphs are inspired from Everson Mono</p>
