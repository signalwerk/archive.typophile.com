  html: |-
    <p>I wanted to create an ITI ligature and was curious…</p>
    <p>How often would various combinations of accented I characters end up in that sequence, if at all?</p>
    <p>i.e. </p>
    <p>Iacute_T_Iacute ligature</p>
    <p>or</p>
    <p>Iacute_T_Idieresis ligature</p>
    <p>I'd like to keep it simple but accommodate the possible combinations, I'm not familiar with how accented characters are used, if ever, in sequence. (whether mixed or consistent)</p>
    <p>Thanks,</p>
    <p>Mike</p>
