    html: <p>In Old Norse and Icelandic quite often, the adjective <em>lítill -- lítinn</em>, its feminine forms <em>lítil -- lítin</em> and plural <em>lítillar</em> (meaning little or small) is an everyday-word that is also used in a whole bunch of compound-words, and then there's the adverb <em>lítit</em>. There are other words with this combination, but this is probably the most frequently used.</p>
