    html: |-
      <p>about your name, let it be taken literally.  I om obviously not experienced in this so my insight is just an average joe, please treat it that way and just consider it for what it is.</p>
      <p>Do you communicate Flo’s?  Do you design Flo’s?  A sign maker makes signs.  A flo designer designs what?</p>
      <p>I think Flo by itself, if it were properly thought out and designed has the potential to stand on it’s own, but what are you?</p>
      <p>Are you a self-branded designer, are you a studio with more than one designer?  Graphic Design? Type design? Web Design?</p>
      <p>I unfortunately don’t have the pleasure of knowing you yet, so it’s not apparent to me what it is you do, but if you are going to support the word ’Flo’ with another word instead of an <em>activity phrase</em>, please make it something so straightforward and simple even I would understand it.</p>
      <p>I’ll use a generic word of a company that may or may not exist, and you tell me which reveals more about who they are (just from the name or phrase)</p>
      <p>Apex Gear.     or     Apex. Mountain climbing equipment.</p>
      <p>Intuishun Communications.    or   Intuishun. web development.</p>
      <p>I think the latter are FAR more descriptive, and the ’tagline’ should be a simple concise description of what it is you do, but don’t try to work it into your logo, your mark is very stable and self-contained.</p>
      <p>I just ask that you think about it and consider the alternatives and see which works best, that’s all.</p>
      <p>This has a lot of potential, I’d love to see where it keeps going!</p>
