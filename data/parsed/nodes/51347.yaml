      <p>I hope it’s not too late to add more feedback. For what it’s worth.</p>
      <p>Simplicity is always potentially good, and it isn’t hard to understand why it appeals to you so much. You’re doing more than hedging for a simple logo / identity; you’re trying to make a virtue out of applied simplicity.</p>
      <p>Ryte. Got it. This is good.</p>
      <p>My gut reaction is that what you’ve turned out is a little too simple for some people and may pass over their heads without registering any kind of effect or reaction. I like it, and I love the cyan and white color scheme (very contemporary colors), but if I were doing it I would try another hue with hyer impact value. Like magenta, for example. Or orange (not burnt orange but a yellow-orange), or maybe even indigo. The cyan color is a bit passive and kind-of not really biting my cerebellum hard enuff to make me want to know more about what’s behind the logo.</p>
      <p>Also try: using a capital <strong>F</strong> (if available) for two reasons. 1) To increase the readability / legibility; 2) To make the logo graphically stronger. With a capital <strong>F</strong> you’d have less reason to change the color and maybe retain the cyan after all.</p>
      <p>Ideally you could try designing a capital <strong>F</strong> from the lower case one you’re already trialing. That way you’d retain the lovely loop tail and still have a capital <strong>F</strong>.</p>
      <p>j a m e s</p>
