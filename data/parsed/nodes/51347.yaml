      <p>I would consider making it a cap F as I think was menitioned. To do this, consider dropping the top of the f and adding a horizontal swash that crosses the l and comes to a nice swoop over the o. I think it will lend balance to the design too.</p>
      <p>Thought #1: *designflo* to me sounds more interesting than *flodesign*<br>
      It also gives me more flow connotation, than flo the waitress.</p>
      <p>Thought #2: A tag line should do more than explain what your company does, it should give your company a voice. “Flo - Graphics, web &amp; printing” is like saying: “MacDonalds - Burgers, Fries &amp; Coke.” I am helping a client with this notion right now, so it was on my mind. Give yourself personality.</p>
      <p>Thought #3: Design or Graphic Design sounds like a profession. Graphics or Graphic Artist, sound like you work at a strip mall sign shop. Without “design” you are little more than a color jocky.</p>
      <p>Thought #4: Careful with the cyan + brushscript + round font = this exact moment in design time. The best part of this is the logo.</p>
      <p>Have fun! - R</p>
