    <p>I’m rebranding myself really soon, and my company name will potentially be called ’Flo’ (variation of Flow).</p>
    <p>I already got some great feedback, but I was looking for some professional design comments.</p>
    <p>————-</p>
    <p>My main questions are:</p>
    <p>1- Is this legible? Does it really need to be once the potential client already knows my company name?<br>
    2- Since the word is so short (how I like it) and with the font, can it potentially be mistaken for Arabic writing or a symbol?<br>
    3- I think the beauty is in the simplicity, I guess it would just be a matter of how I’d apply it.</p>
    <p>I’m loving it at the moment, but of course, I’m trying not to until I get good feedback and reassurance from a new set of eyes! :)</p>
    <p>(forgive the size, I’m using FLONT on Veer)</p>
    <p>Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="/files/flo_4107.jpg"></div><p></p>
