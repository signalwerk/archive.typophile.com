      <p>Although “flo” (especially in the modern script font) does remind me a little of a middle-aged waitress, I still like it.  It gives you personality.  For adding further clarity, I like the suggestion of “designflo”—very slick sounding.  Otherwise, I would suggest “DESIGN” in a light, all-caps, sans-serif font placed beneath “flo.”  As for color, I happen to like the blue, but I would suggest something closer to cerulean for a little punch (and maybe a subtle gradient).</p>
      <p>Looking good, though.  Best of luck.</p>
