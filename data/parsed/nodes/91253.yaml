    html: |-
      <p>Galeries Lafayette commision many bespoke fonts, some of which they only use for a limited period of time. They also have proprietary versions of commercial fonts such as Ashby, named AshbyGL. Most of the work has been done by Mathias Schweizer.</p>
      <p>Their unique fonts have included:</p>
      <p>Stive - a childish hand-printing font<br>
      LaGdProto - see image<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/GaleriesLafayetteProto_4627.jpg"></div><br>
      A few avant-garde/futura styles and others.<p></p>
      <p>None that I know of have ever seen the light of day outside of GL itself.</p>
      <p> - Herb</p>
