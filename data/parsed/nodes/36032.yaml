  html: |-
    <p>Recently I've bought Feijoa. With this font I'm creating sheet music using Finale (the most common software for that) in Windows. Than the result is exported to an EPS file. This EPS cannot be opened in Paint Shop Pro or Photoshop because an unclear error is given.</p>
    <p>Does anyone know what to do? FontLab doesn't seem to find anything weird to the font. Font Creator though is giving some error. But even after the glyphs are validated the EPS error remains.</p>
    <p>Can anyone help?</p>
    <p>Yours sincerely,</p>
    <p>Tijs Krammer</p>
