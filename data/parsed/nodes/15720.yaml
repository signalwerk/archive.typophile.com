  html: |-
    <p>Second Moscow Design and Interactive Art Festival DeArt 2005 will be launched! (Opening: 7 november in BSHAD)</p>
    <p>Our festival now under new very creative roof: British Higher School of Art and Design<br>
    <a href="http://www.education.icograda.net/web/school.shtml?s=BRIT01" title="http://www.education.icograda.net/web/school.shtml?s=BRIT01">http://www.education.icograda.net/web/school.shtml?s=BRIT01</a><br>
    <a href="http://knowdesign.ru/" title="http://knowdesign.ru/">http://knowdesign.ru/</a> (info about fest translated below)</p>
    <p>Full programme of DeArtFest in Moscow:</p>
    <p>November, 7th, Monday </p>
    <p>16:00 Opening cermony. Press conference.<br>
    Presentation of the catalogue.<br>
    Opening of exhibitions<br>
    (" Lettertypes from the Hague ", TypeArt, A.Kuznetsova, " Private life liveable natures "<br>
    and presentation of their catalogues)<br>
    19:00 Design-session - a concert, wine, dialogue of designers. </p>
    <p>November, 8th, Tuesday </p>
    <p>16:30 Lecture Ryan Frisk  &amp;  Catelijne van Middelkoop<br>
    18:00 Coffee-break<br>
    18:30 Jury Gordon and Valery Golyzhenkov's ( <a href="http://letterhead.ru/" title="http://letterhead.ru/">http://letterhead.ru/</a> ) Lecture<br>
    " New words. Who, what, what for "<br>
    20:00 Dmitry Tchernyshev's Lecture<br>
    " Creative at presence of the customer/advice of the old potboiler " </p>
    <p>November, 9th, Wednesday </p>
    <p>15:00 Michael Tumelia's Author's seminar " Traditional animation and a computer: things in common "<br>
    16:30 Ilya Ruderman's and founders of studio Underware Lecture ( <a href="http://www.underware.nl" title="http://www.underware.nl">http://www.underware.nl</a> )<br>
    18:00 Coffee-break<br>
    18:30 Master-class: Ryan Frisk  &amp;  Catelijne van Middelkoop (day 1-st)<br>
    20:00 Sergey Pronin's Lecture-seminar<br>
    " It is accessible about design, advertising and perception surrounding. 100 pictures and any complexities in understanding " </p>
    <p>November, 10th, Thursday </p>
    <p>13:00 Master-class Underware and Ruderman (day 1-st/part1)<br>
    15:00 Vivian Del Rio: " Secrets successful Free Lance "<br>
    16:30 Lecture the Lucas de Groot ( <a href="http://www.lucasfonts.com/" title="http://www.lucasfonts.com/">http://www.lucasfonts.com/</a> )<br>
    18:00 Coffee-break<br>
    18:30 Master-class: Ryan Frisk  &amp;  Catelijne van Middelkoop (day 2-nd)<br>
    20:00 Olga Purtova's Seminar (Identity) " Development of a trade mark. In searches of the best decision "<br>
    21:00 Master-class: Underware and Ruderman (day 1-st/part2)  </p>
    <p>November, 11th, Friday </p>
    <p>13:00 Master-class Underware and Ruderman (day 2-nd/part1)<br>
    15:00 EPSON<br>
    16:30 Vladimir Yefimov's Lecture (ParaType) " History of font Biblica/ITC Weidemann/Goethe Text.<br>
    Experience of adaptation of cyrillics "<br>
    18:00 Coffee-break<br>
    18:30 Master-class: Lucas de Groot ( <a href="http://www.lucasfonts.com/" title="http://www.lucasfonts.com/">http://www.lucasfonts.com/</a> )<br>
    20:00 Michael Aldashin's Lecture " As well as why I do cinema " (technological and genre motives)<br>
    21:00 Master-class Underware and Ruderman (day 2-nd/part2)</p>
    <p>On November, 12th, Saturday </p>
    <p>13:30 Master-class Underware and Ruderman (day 3-rd/part1)<br>
    15:00 Igor Lebedev's Lecture " History of a photo 1839-1880 "<br>
    18:00 Coffee-break<br>
    18:30 Master-class: Lucas de Groot ( <a href="http://www.lucasfonts.com/" title="http://www.lucasfonts.com/">http://www.lucasfonts.com/</a> )<br>
    20:00 Igor Lebedev " History of a picture album ", " History of a photo 1890-1910 "<br>
    21:00 Master-class Underware and Ruderman (day 3-rd/part2) </p>
    <p>November, 13th, Sunday </p>
    <p>16:30 Igor Lebedev's Lecture " History of a photo 1920 - 1930 "<br>
    18:00 Coffee-break<br>
    18:30 Master-class: Lucas de Groot ( <a href="http://www.lucasfonts.com/" title="http://www.lucasfonts.com/">http://www.lucasfonts.com/</a> )<br>
    22:00 Closing of festival </p>
    <p>Adress:<br>
     British Higher School of Art and Design<br>
     EMBANKMENT OF ACADEMICIAN TUPOLEV, 15/15<br>
     MOSCOW,<br>
     105120<br>
     Russian Federation</p>
    <p>Contacts:</p>
    <p> Viacheslav (Cheslav) Eroshenko<br>
     DeArt Festival Founder &amp; Head of Organisation Comitee<br>
     E-mail: <a href="mailto:de7ign@yandex.ru">de7ign@yandex.ru</a></p>
    <p> Vladimir Dobrovinski<br>
     DeArt Festival Coordinator<br>
     Design lecturer (basic typography) in BHSAD<br>
     ( <a href="http://britishdesign.ru/programs/beginners/" title="http://britishdesign.ru/programs/beginners/">http://britishdesign.ru/programs/beginners/</a> )<br>
     E-mail: <a href="mailto:deartfest@rambler.ru">deartfest@rambler.ru</a></p>
    <p> Sergey Dolgov<br>
     DeArt Fest &amp; ADCR Coordinator<br>
     ADCR (Art Directors Club Russia)<br>
     <a href="http://www.adcrussia.ru/" title="http://www.adcrussia.ru/">http://www.adcrussia.ru/</a><br>
     E-mail: <a href="mailto:soulskeeper@gmail.com">soulskeeper@gmail.com</a></p>
