    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 5.Nov.2008 1.50pm </div>
      <p>Looking like happy frosting on a cupcake at a twiddle bug party, this<br>
    bouncy food entry from Canadian designer Haley Fiege turns Sentinel's<br>
    Jellybrush type into organic happiness you can spread on pancakes,<br>
    ice-cream, sorbets. Use it for sauces and condements, oh peanut<br>
    butter! Hotdogs, sandwich fillings, rubbery items. Anything really.<br>
    Take advantage of our 30% off sale while it lasts from November 5th<br>
    2008. Promotional offer ends Dec 20.</p>
    <p>Formats: OpenType (TrueType coming very soon. Sorry folks, I just<br>
    plain forgot to make them)<br>
    Regular Price: $24.90<br>
    Snipped Price: <strong>$17.43</strong></p>
    <p><a href="http://www.myfonts.com/fonts/sentinel/soft-serve/" title="http://www.myfonts.com/fonts/sentinel/soft-serve/">http://www.myfonts.com/fonts/sentinel/soft-serve/</a></p>
