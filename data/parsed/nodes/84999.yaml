  html: |-
    <p>Anyone out there been playing with the iOS5 beta?</p>
    <p>I've been optimistically hoping that the iPad at least might come with a Light variant of Helvetica. It currently renders Helvetica Regular quite heavily and OSX has shipped with Helvetica Light (in addition to Neue Light and Ultralight) for a few years now.</p>
    <p>Anybody able to check this out?</p>
