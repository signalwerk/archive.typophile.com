    date: 2004-11-01T19:37:00
    date_raw: 1 Nov 2004 — 7:37pm
    votes: null
    html: "<p>Hmm...  <br> <br>A few more rub-down type catalogs to be on the lookout for: <br> <br>Artype <br>Arttec <br>Formatt &lt;--good one <br>Prestype (very low end--first I ever used) <br>Transfertech (beware--lots of pirated stuff in this one from Headliners, Alphabet Innovations, ITC, VGC, and others) <br> <br>Other headline font sources: <br> <br>VGC <br>TypeSettra (from Canada) <br>Alphabet Innovations <br>WTC (founded by some former ITC people) <br>TypeSpectra <br>LetterGraphics (although much of their library was pirated stuff) <br>Type Films of Chicago (almost all pirated stuff) <br> <br>Catalogs from display typesetting houses are good too. These varied from city to city and contained fonts from one or more of the above sources. <br> <br>Some defunct phototypesetting machine manufacturers which may have catalogs worth looking at: <br> <br>AM/Varityper <br>Compugraphic <br>Alphatype <br>H. Berthold &lt;--these are beauties <br>Photon <br>Harris</p>"
    html_clean: "<p>Hmm...  <br> <br>A few more rub-down type catalogs to be on the lookout for: <br> <br>Artype <br>Arttec <br>Formatt &lt;--good one <br>Prestype (very low end--first I ever used) <br>Transfertech (beware--lots of pirated stuff in this one from Headliners, Alphabet Innovations, ITC, VGC, and others) <br> <br>Other headline font sources: <br> <br>VGC <br>TypeSettra (from Canada) <br>Alphabet Innovations <br>WTC (founded by some former ITC people) <br>TypeSpectra <br>LetterGraphics (although much of their library was pirated stuff) <br>Type Films of Chicago (almost all pirated stuff) <br> <br>Catalogs from display typesetting houses are good too. These varied from city to city and contained fonts from one or more of the above sources. <br> <br>Some defunct phototypesetting machine manufacturers which may have catalogs worth looking at: <br> <br>AM/Varityper <br>Compugraphic <br>Alphatype <br>H. Berthold &lt;--these are beauties <br>Photon <br>Harris</p>"
