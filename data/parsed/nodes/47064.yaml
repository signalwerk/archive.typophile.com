      <p>Okay I'll accept that. Sorry I assumed bad faith, just that it looked that way.</p>
      <p><em>There is such a thing as good taste. There’s also such a thing as my taste, your taste and everyone else’s. Go figure. Common sense also comes in the form of marketing needs. ie. the strapline situation. You underestimate the editorial pressure involved in this piece of “just plain embarrassing” design.</em></p>
      <p>Now it's turning into a pissy argument. I'm bored with this conversation. Waiter..!</p>
      <p>Other magazines have "editorial pressure" and a bottom line involving cash exerting an influence on their design too, but most manage to avoid being this ugly.</p>
      <p><em>Pretentious? I havn’t seen the magazine in a while but I suspect this is a result of it being ’aspirational’. Clearly GQ isn’t your cup of tea...</em></p>
      <p>It's okay for people who like that sort of thing. It's akin to an otherwise-good-looking 1932 Ford Roadster Deuce coup hotrod with mag wheels of questionable stylistic match fitted. The wheels are okay—if you like that sort of thing. A real '32 Deuce Coupe, one worth having, has decent vintage wheels on it. Bona fide hotrodders and hotrod lovers know the difference and shun the car with the 90's mags—because they make a beautiful car suck. Connoisseurs of good design shun bad design—because it makes magazines (and other stuff) suck.</p>
      <p>What else? How much rationale do you need to cut the cards?</p>
      <p><em>Shame on students that take these jobs mutually incompatible with self respect.</em></p>
      <p>No, shame on the magazines for selling their souls. You're taking something I said and twisting it beyond its original purpose and scope. If an editor offered me a job designing for a crummy magazine I'd look elsewhere for something more respectable. If students fresh out of college take such a job they deserve no shame but praise for making the most of a competitive job market at the outset of their careers.</p>
      <p><em>sorry to hear about the dentures! I hope you like soup</em></p>
      <p>Cheers and thanks :^) I'm eating a lot of fish. Yum!</p>
      <p>j a m e s</p>
