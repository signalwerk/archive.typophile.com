      <p>It happens to me.<br>
      I think the reason may be that I sometimes open two browser windows at the same time (for various reasons), and narrow their width so that they don't overlap.<br>
      If I then go to a website which has a wider design, then some of it is cropped off, so I have to drag my window size wider, as the browser is "remembering" the narrower size I was just using.</p>
      <p>Web designers don't necessarily fix the opening window size, because they realize that people will be viewing on a variety of monitor sizes. So if you fix your opening window size to a standard minimum, you are missing the opportunity to make a big impression on people with larger screens.</p>
      <p>I like big, which is why I made my website with scalable Flash content.<br>
      And I'd have to say that the Preview pane in GeniusLab is brilliant, the way the type size changes as one changes the height of the window.</p>
