      <p>@David Berlow: <em>LOL! Interesting comment. How would they do it? I’m only asking rhetorically. Actually, I should be asking rhetorically how COULD they do it? I’m asking this non-rhetorically: James, have you been involved in the, most often, cooperative venture that is the designing of a major magazine cover?</em></p>
      <p>I have never worked on the design of a magazine cover or a magazine, since I don't work in the publishing industry. Regardless, dozens of magazines exist with more tasteful covers than <em>GQ</em>. Go figure. There is such a thing as good taste, and more to the point, common sense. Common sense and taste (presumably, or perhaps it's talent) produce good cover designs at other magazines, yet GQ somehow manages to combine pretentious with eye strain.</p>
      <p>Does my not being involved "in the, most often, cooperative venture that is the designing of a major magazine cover" disquailfy me from making rhetorical criticism of magazine cover designs? What absolute twaddle.</p>
      <p>How *could* students fresh out of design school do better? By working for a magazine where the comittee avoids navel gazing in a cul de sac. If <em>Car</em> and others can do it, why can't GQ? Editorial policy, as Nick has explained. probably has a lot to do with it. I didn't call <em>GQ</em>'s editorial policy "mutually incompatible with self-respect" for nothing.</p>
