      <p><em>He [Alex White] wrote that in 1992, does it no longer apply?</em></p>
      <p>The current a trend is for magazines to put a celebrity on the cover and fill up any remaining white space with headlines and more headlines... Of course there are different ways of doing this. To repeat an example I mentioned earlier in this thread, Fred Woodward's work for Texas Monthly, Rolling Stone, and the American GQ has always been outstanding.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/gq_cover_5032.jpg"></div><p></p>
      <p>Other magazines, like Esquire, have also been doing this lately. Esquire has tweaked the idea and placed the type <em>behind</em> the cover subject.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/deltoro_4338.jpg"></div><p></p>
      <p>Here's a tongue-in-cheek thing they did recently:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/jessica-simpson-esquire-01_3575.jpg"></div><p></p>
      <p>Notice that the headline reads, "We shot this image to catch your eye so you will pick up this issue..., etc." Good for a quick chuckle, perhaps, but other designers have found better ways to catch readers' attentions. Compare that with the 1960s Esquire cover that is being homaged, sort of:</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/esquire_woman_march_65_6485.jpg"></div><p></p>
