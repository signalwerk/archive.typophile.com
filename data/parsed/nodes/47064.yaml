    html: |-
      <p>An answer to the rhetorical question:</p>
      <p>One recent graduate may well be able to design a more beautiful magazine cover than a committee.<br>
      Now, just suppose that the designer's preferred concept had less copy, which would no doubt qualify as more beautiful on the less-is-more principle. But then the editor or publisher got cold feet that such simplicity wasn't hard-hitting enough, or didn't communicate all the great content inside, or looked like it belonged on a different section of the magazine rack.<br>
      So rather than go back to square one, the understated, upscale design was added to, and, of course, looked flat, because that's what clutter does to understatement. So the type was jazzed: serif here, sans there; script here, block there; condensed here, extended there. And now, at the expense of mere beauty, there's some excitement to please the powers that be.</p>
      <p>**</p>
      <p>Alex White, from <em>Type in Use</em>:</p>
      <p>"Cover lines should present the most important contents, usually only feature stories. Lesser listings dilute the importance of cover lines and can overwhelm the reader...the more sophisticated and upscale the publication, the more restrained the typography should be."</p>
      <p>He wrote that in 1992, does it no longer apply?</p>
    html_clean: |-
