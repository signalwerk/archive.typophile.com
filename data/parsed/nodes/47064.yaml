      <p>@dux: <em>I think you’re being more than a little harsh on the cover design and a little more than generous to kids straight outta (dying to say compton), college.</em></p>
      <p>(much laughter) I was being facetious and not totally serious. But really, that GQ cover blows goats. The dire state of book typography, yepp, and the dire state of magazine design—you are looking at it.</p>
      <p><strong>Sum up</strong>: Surprizingly successful cheaper-than-walking entry from America let down by laughable quasi-hip styling, mind-numbing metrosexual leanings and editorial standards mutually incompatible with self-respect. To its credit GQ succeeds with a hackneyed approach in a market sector where its competitors turn out bird cage lining. Certainly for those unacquainted with the feeling of butchness that comes from reading a real men's magazine like British <em>Car</em>.<br>
      <strong>Rivals</strong>: Esquire, FHM, The Face<br>
      <strong>Also try</strong>: Taking a bona fide interest in women<br>
      <strong>My choice</strong>: No. Not even in a parallel taste-free universe.</p>
