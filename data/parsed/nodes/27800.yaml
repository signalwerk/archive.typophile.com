      <p>As Term says, (hope you dont mind the shortened name), any typeface can look dull depending on how it is used. Its an impossible question to answer, everyone has different opinions. </p>
      <p>I suggest that you turn your brief around, instead of looking for dull fonts, (which we just discussed, may not actually exist), maybe you could use any old font and just treat it in a very dull way. A dull font is often dull due to the unispiring way it is being used, a way in which adds nothing to the context it is put in. </p>
      <p>I personally find a lot of the hand scribbled destructive fonts quite dull but that is only me opinion. </p>
      <p>Good luck</p>
