      <p>Helvetica is dull? And Arial is better? I don’t agree with you. Helvetica can be wonderfully radiant and exciting in the right context. Just take a look at the lighter weights of Helvetica Neue - positively glamorous. Personally I find Optima very dull but many people love it. Same thing with a lot of the “novelty” typefaces from the 70s and 80s.</p>
      <p>I think almost any type can look dull - it’s just a matter of how you use it. Maybe something like Block Gothic is what you’re looking for? Or a stencilled typeface? Or a typewriter one, like Courier - that really says “dull” to me. 1950s office dull and bureucratic.</p>
