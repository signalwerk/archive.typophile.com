    <p>Hi<br>
    I’m making some props for a movie. They are posters, shop signs etc, all clearly visible on the silver screen. The movie has a naive, dreamlike, melancholy feel to it. The graphics that i’m making should have a gdr/postwar communist era, washed out look.</p>
    <p>For these tasks, I’m looking for some really dull fonts. I mean dull like helvetica, not like arial. Fonts that try to be fancy, but fail. I’d also appreciate som input on how to make display type look boring without being ugly. THanks!</p>
    <p>best regards, </p>
    <p>alex</p>
