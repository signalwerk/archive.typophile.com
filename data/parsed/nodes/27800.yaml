      <p>Hi Alex. I’m suprised that your German respondents haven’t yet mentioned the movie <a href="http://www.imdb.com/title/tt0301357/">Goodbye Lenin</a>. I assume you know the plot and will spare you the details, but there is plenty of GDR-era product in it - however, from memory, none of it appears as dull as maybe you would like.</p>
      <p><em> Any tricks on how to achieve immediate dullness in the use of type?</em></p>
      <p>Apart from the great recommendations already here, I suggest you print it 70% or 80% black - so you get a washed out grey rather than full strength black; for a distressed or faded look on the props you can lift toner off the surface of a laserprint by using wadded masking tape and gently patting the print with the sticky side of the tape. I did this when I had to make a 1950s Superman comic as a stage prop for West Side Story - worked a treat.</p>
    html_clean: |-
