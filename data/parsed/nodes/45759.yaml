  html: |-
    <p>Hi. I am new to this forum, so please be patient with me. I am looking for a three font combination (maybe only two) for on-screen display.</p>
    <p>One serif that has got a very old, original touch (like Garamond) that looks at 18px and up, white on dark background. I like something rather narrow, like the Apple Garamond, but I'm not sure about that.</p>
    <p>Then I need an "Arial replacement" font that works well with the serif font at 12px or maybe even 10px sizes.</p>
    <p>And once I've those two I would also like to find a decorative font to go with that. Something like a 17th century script that looks fine in 18px, haha.</p>
