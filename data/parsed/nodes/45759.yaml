      <p>Could you give some more info on the project?</p>
      <p>At small sizes I would use a screen hinted typeface. Maybe one of them websafe fonts might help you out. Verdana, or perhaps Geneva? Both differ quite a lot from Arial though.</p>
      <p>Both Adobe Caslon Pro and Adobe Garamond Pro have swash italics, and both ship with Creative Suite!</p>
