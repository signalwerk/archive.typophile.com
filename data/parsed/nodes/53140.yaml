      <p>Hello,</p>
      <p>Here is how it turned out.</p>
      <p>I fixed the curves on the bottom of a, b, d, p, q and made them closer to the curve on the u. This turned into a big improvement i think, especially in the heavier weights.</p>
      <p>Also remade the comma and quotes, the less and greater, and the tild and dierensid position.<br>
      I left out the to storied g, because I think it would be to complicated for this font.</p>
      <p>I think it has improved a lot, thanks to your comments.</p>
      <p>I also uploaded a new Pdf file on top.</p>
