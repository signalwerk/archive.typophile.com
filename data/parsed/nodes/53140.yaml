    html: |-
      <p>I like this. These monoline ones must be very tricky to achieve. It's very neat and precise without being sterile or cold. I like the curves and the knee of the K and k and the numerals.</p>
      <p>I know it's very subjective but I think your dieresis and tilde seem to float a bit high when top-aligned with the circumflex, acute and grave. I think I'd pull them down to centre-align with those.</p>
      <p>I'm not sure about the comma and quotes. The shapes could be simpler, somewhere between straight and curved, with the tail thicker. The square head seems too aggressive to me. Just because I'm working on those glyphs in my own font at present, I'm paying extra attention to how they're constructed.</p>
      <p>Otherwise I really like it.</p>
    html_clean: |-
