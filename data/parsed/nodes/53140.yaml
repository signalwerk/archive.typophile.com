      <p>I like it as well. Looks like a lot of the contemporary square sans serifs, but looks good.<br>
      I'd try the 2nd g, but I'd be afraid that it would be distracting and disjointed from the rest of the forms.</p>
      <p>Nit-pickin': the bottom of the a feels a little awkward. I see what your doing by making the bowl hang a little, but it's distracting me. Perhaps it needs to stay thinner a little further. Same kind of thing happening with the b (you notice it most in the bold).</p>
      <p>The placement of the accent on the á feels like it's placed a little weird.</p>
      <p>Kerning on the o seems a hair wide.</p>
