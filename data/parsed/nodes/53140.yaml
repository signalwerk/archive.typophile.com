    html: |-
      <p>On the <strong>a</strong> and <strong>d</strong>, I think the bottom triangle bit could be opened up a bit more. Maybe make the bottom curve more like that of the <strong>u</strong>, which has more room. The <strong>g/q</strong> seem to have the same curve as the <strong>a/d</strong>, maybe those can use the <strong>u</strong> curve as well. Especially in Medium/Bold. Exactly the same goes for the italics. (Am I referring to the same as Paul?)</p>
      <p>I like your <strong>k</strong>'s, with the little straight bit. I wonder, though, what it would look like if this little detail would be flipped horizontally. I.e. if the little straight bit would be on the top arm. But for the rest leaving the arms themselves intact. Maybe it looks crap, but just wondering. :)</p>
