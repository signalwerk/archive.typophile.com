    <p>I'm finally getting into listening to blogs. Truth is, people talking can be whitenoise and usually doesn't disrupt my work. However, I've had a difficult time listening to design blogs, blogs that have information that I'd like to at least kind of absorb. I've finally given in and am finding a way to sort of do it.</p>
    <p>These guys are funny and irreverent. Be A Design Cast: <a href="http://www.beadesigngroup.com/blog/archives/2006/03/be_a_design_cast_10_typography.html" rel="nofollow">#10 Typography Island</a></p>
