      <p>&gt; Im designing a t-shirt for my university<br>
      &gt; and I wanted to change their original logo </p>
      <p>Is this an official project that's authorized by the university, or just a personal project? Will the t-shirts be sold?</p>
      <p>Most universities do not want people making unauthorized variations of their logos, nor do they permit people to sell items (like t-shirts) containing their logo without purchasing a license from the university. If it's just some free t-shirts for a university event they probably won't care, but if you have plans to sell them, then you could get into legal trouble unless you have authorization.</p>
      <p>A friend of mine works for a university and his full-time job is to license use of their logo, and to seek out and stop unauthorized use of their logo, and it's an issue they take very, very seriously because university-branded merchandise generates a lot of money.</p>
