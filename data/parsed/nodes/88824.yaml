      <p>to me - you have lost the original idea of the logo... the arrows creating an M - indicating the people coming to one place to create the university...</p>
      <p>since heritage is proudly on display (1910) i can't help wonder if your modern twist sits awkwardly alongside</p>
      <p>have you considered how the shirt will be manufactured? if it's screenprinting then the fade to white will look terrible and be very hard to control in process... resulting in dearer shirts and possible unusable/unsellable rejects. if you intend to use transfers - the longevity of print is compromised - the shirt will look crap in a few months after washing it a few times a month (hey - they are students!) also transfer prints tend to look 1970s/homemade... the shirt may not be popular with the students. </p>
      <p>your designs deliberately take the logo off centre - so i am assuming it will need to be large/overall printing</p>
      <p>the only clear way to make this design is dye sublimation... expensive - but they will print the logo onto the fabric before constructing the shirts out of it... but the target market may resist buying shirts at twice/three times the price</p>
