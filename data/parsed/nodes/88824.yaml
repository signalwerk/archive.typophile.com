      <p>1. I would apply the circle effect on the logo before I rotate it. In that way the line of circles will match the line of the logo.</p>
      <p>2. The look of the circle effect is a little unprofessional/ Your graphic would look much cleaner (and also much more like a real logo) if you "draw" the circles yourself on adobe illustrator, or some other vector graphic software. Might take some time, but you will see that is worth it.</p>
      <p>3. The grandient effect is out of place. I presume you wanted to achieve a shadow effect. To do so, just dim the second logo (all of it and with no grandient).</p>
      <p>4. The easiest thing to change in a logo is the typeface that is used. While you pick, dont forget to pay homage to the original one.</p>
      <p>Work hard, and the result will really be beautiful.</p>
