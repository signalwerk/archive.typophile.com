      <p>This is kind of funny.</p>
      <p>The new Mount Royal logo is really nice, and was even picked as one of the top re-brands for 2011 on Brand New:</p>
      <p><a href="http://www.underconsideration.com/brandnew/archives/the_best_and_worst_identities_of_2010_part_ii_the_best.php" title="http://www.underconsideration.com/brandnew/archives/the_best_and_worst_identities_of_2010_part_ii_the_best.php">http://www.underconsideration.com/brandnew/archives/the_best_and_worst_i...</a></p>
      <p>Surely you can work with the logo itself to make a nice piece of art.</p>
      <p>You are using half-tones/dots and gradients/transparency, which is a bit confused I think as the two effects are really not meant to mix in the traditional sense. To achieve a sense of transparency with half-tones you make smaller and more spaced-out dots. Which would look more honest than throwing a ball of photoshop light at it.</p>
      <p>Of course, you can throw mutliple effects at it -- but it's the equivalent of mixing your metaphors. It's like a duck out of water, if you know what I'm saying.</p>
      <p>Also: how does t-shirt art print with the transparency you're using? It doesn't if it's screenprinted. </p>
      <p>Can you take the base element of the logo (ie: one of the books) and build something out of that, in a modular fashion?</p>
