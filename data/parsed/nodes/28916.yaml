  html: |-
    <p>I've recently started working on a new serif font, which doesn't have a name yet. This began as an experiment with Serifs of a kind I've never done before, and this came out of it:<br>
    <a href="http://img.photobucket.com/albums/v629/WurdBendur/experimental.png" title="http://img.photobucket.com/albums/v629/WurdBendur/experimental.png">http://img.photobucket.com/albums/v629/WurdBendur/experimental.png</a></p>
    <p>These first few letters I did worked out well enough that I decided to keep going and produced some more:<br>
    <a href="http://img.photobucket.com/albums/v629/WurdBendur/allcaps1.png" title="http://img.photobucket.com/albums/v629/WurdBendur/allcaps1.png">http://img.photobucket.com/albums/v629/WurdBendur/allcaps1.png</a></p>
    <p>At this point, I think I'm starting to have problems with weight not matching up, but I went ahead and put together some more:<br>
    <a href="http://img.photobucket.com/albums/v629/WurdBendur/moreletters.png" title="http://img.photobucket.com/albums/v629/WurdBendur/moreletters.png">http://img.photobucket.com/albums/v629/WurdBendur/moreletters.png</a></p>
    <p>I haven't done any lowercase yet. I'm playing with just using small caps, but the ones I have at the moment are just scaled versions of the capitals and will need to be redrawn eventually:<br>
    <a href="http://img.photobucket.com/albums/v629/WurdBendur/smallcaps.png" title="http://img.photobucket.com/albums/v629/WurdBendur/smallcaps.png">http://img.photobucket.com/albums/v629/WurdBendur/smallcaps.png</a></p>
    <p>So my question is this: Are there any glaring problems you see, and what suggestions might you have?</p>
