    html: |-
      <p>Nice shapes! However:</p>
      <p>- the V is too fat;<br>
      - the thin stems of A, N and Δ are slightly too heavy;<br>
      - the pointed below of the N extends a bit too far below the base line;<br>
      - try to straighten the inner contour of the thick stem in the bowls of B, P and R (i.e. no backeted serif at the right); this doesn't need to be done elsewhere (e.g. in D), because there is enough white space around;<br>
      - the same goes for the inner serifs of W;<br>
      - make the bowl of G bigger so that the upper serif optically matches the width of the character in the lower half;<br>
      - compensate for ink squash / blackness in the joint of the Q tail with the bowl;<br>
      - the curled, tilde shaped cross bar of E and F is somwhat disturbing; if you want to keep that feature, make sure this matches the cross bars in Ð, Θ and ł.</p>
