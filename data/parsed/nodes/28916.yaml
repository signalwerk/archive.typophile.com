      <p>Quirky. Delicate. Love it.</p>
      <p>The bowl reminded me of <a href="http://www.textdrive.com" rel="nofollow">TextDrive's wordmark</a>.</p>
      <p>I'm not sure if the upper beaks are in their best condition when faced inward, though, particularly in <em>G</em>.</p>
      <p>Are the glyphs aligned properly? <em>C, G, O, Q S</em> and <em>U</em> should dip, while the down strokes in <em>N, V</em> and <em>W</em> should move up. Basic, right?</p>
      <p><em>O</em> and <em>Q</em> looked not quite at home in the face. Increase the pen angle, maybe? <em>H</em> might also be too wide, but it's a matter of personal taste.</p>
