    html: <p>I like it. The t is too experimental... looks too much like a b. Keep going. I have no idea what the thing before the t is, either. Finish the alphabet and set it in some sample text and look for problems. Tweak the letters until they work. Then start over. If you were taking up painting, you wouldn't expect your first painting to be a museum piece, right? :)</p>
