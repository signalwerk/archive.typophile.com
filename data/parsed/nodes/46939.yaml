    date: 2008-08-17T19:18:00
    date_raw: 17 Aug 2008 — 7:18pm
    votes: null
    html: |-
      <p>Experimental, a bit illegible at the beginning. I think something that may help is if you take into consideration identifiability of the tops and bottoms of letters. Typically, if you take a sentence of a typeface and cover the bottom half, you'll be able to read what the top half still says.</p>
      <p>However, if you cover the top half, it becomes more difficult to read. Your typeface seems to have a uniformity to the top and bottom. That's not necessarily bad, but it does make the eyes take a bit longer to identify what the letter is.</p>
