    html: '<p>going back to what you first posted, i believe (but could be wrong) that the formata italic is the same as what you meant by "basic italic" and then chancery is a more swashy version of the formata. From "The Art of Calligraphy" by David Harris: "Formata letters are distinguished by the wedge serif to the left of the stem, corsiva by the swashes to the right of the stem." (p. 96) <br> <br>A "cursive italic" i would consider a script face. or did you mean something else?</p>'
