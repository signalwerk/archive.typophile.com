  html: |-
    <p>My girlfriend, being totally awesome, is having a "Font Party" in Montreal this weekend, where guests are encourage to come </p>
    <p><cite>dressed as the typeface that embodies your true inner self. creativity is encouraged; however, please be advised that if your true inner self is obnoxiously inappropriate in almost any situation (comic sans) or prone to injudiciously sporting designer knockoffs (arial) you may be politely turned away at the door.</cite></p>
    <p>I'll probably come up with my own costume (though it's a little harder than I first thought), but I thought I'd share in case anyone found it amusing.</p>
    <p>(Maybe I'll take photos and post them to the Type ID board?)</p>
