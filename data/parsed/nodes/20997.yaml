    <p>I don't know if there is a post with this subject, but I think it's interesting to have here a post with a databese of wich typefaces were used to build the most important brands in the world...</p>
    <p>For example:</p>
    <p></p><div class="imageWrap"><img src="https://web.archive.org/web/20141115031304im_/http://typophile.com/files/img_logo_5580.jpg"></div><p></p>
    <p><a href="https://web.archive.org/web/20141115031304/http://www.houseind.com/index.php?page=showfont&amp;id=4&amp;subpage=viewfontspecimens" rel="nofollow">Chalet</a>, by René Albert Chalet.</p>
    <p>What do you think?</p>
    <p>Jorge Marcedo | Coimbra | Portugal</p>
