    <p>Hi everyone,<br>
    I have been going nuts trying to find out what typeface was used in Life magazine. Both in its avatar between 1883 and 1936 and later on from 1936 to 2007. Trade Gothic looks close for the logo but it came about in 1948- while the red-white logo came about in 1936. So am very confused!<br>
    Also, would like to know what did they use for the text inside? Pre-1936, it looks like some serif type while the more contemporary issues seem to have a sans-serif font.<br>
    Does anyone have a issue of the Life maagazine from 2005-07? I have never seen one and was wondering what the layout is like.</p>
    <p>Thanks for you help guys- I hope you can crack this in time!</p>
