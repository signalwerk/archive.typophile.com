    html: |-
      <p>The text face in the first sample is what was generically called "old style". Most foundries had some version of this (sort of like Times Roman nowadays). There are some digital versions of this style: <a href="http://www.myfonts.com/fonts/agfa/binny-old-style-mt/">Binny Old Style</a>, <a href="http://www.myfonts.com/fonts/agfa/old-style-mt/">Monotype Old Style</a>, and <a href="http://www.myfonts.com/fonts/linotype/old-style-7/">Linotype Old Style No. 7</a>.</p>
      <p>"HIGHBROW NUMBER" appears to be an old ATF face called Post Oldstyle No. 2. I don't know of a digital version. The price and date text on the right side is <a href="http://www.myfonts.com/fonts/bitstream/cheltenham/">Cheltenham Old Style</a>.</p>
      <p>The logo is definitely custom-drawn. This was very common back then due to the fact that metal typefaces were very limited in terms of available size and styles.</p>
