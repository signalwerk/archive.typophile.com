      <p>Matthew:</p>
      <p>Thank you for taking the time to post your comments. </p>
      <p>1.	The 40,000 data points are derived from publicly available information and the process associated with deriving a valuation is proprietary.</p>
      <p>2.	You are well aware that “access to experienced assistance” does not comprise an attorney client relationship.  The second part of your question implies that the DL licensing document is a document provided under an attorney client relationship. The “standard” DL license document is derived from over a decade of experience preparing such documents and is intended to provide a sound basis for a licensing relationship between the foundry and its client, it is not an attorney negotiated document and the DL client is free to amend or alter as they may desire.  If a licensing request is extraordinarily complex or burdensome, and upon the specific request of the DL client, the matter could be referred to an attorney for individuated evaluation, preparation and negotiation. If no such request arises, the document is automatically prepared according the DL user’s input and delivered.</p>
      <p>Currently, foundries choose to be responsible for the quality of their own documents. Many of them are self-created, some professionally drafted and they exhibit significant differences in form and efficacy.  We have some experience in these matters and we are confident in the quality of the basic DL license.  </p>
      <p>3.	The DL algorithmic pricing evaluations are based upon a DL client’s pricing disclosures. They are not pooled with other client’s prices nor are they compared with another foundry’s pricing. A DL client’s prices are not made available to other DL users.  We are well aware that potential OEM licensees will shop for bids and they frequently disclose to a potential licensor-foundry the prices they receive from other foundries to drive down prices.  DL does not participate in or enable that practice since it distorts valuation. Notwithstanding, the decision to license and the ultimate price a DL client accepts is always in the control of the DL user.  The DL user may or may not vary from the derived price, either as they are so inclined. </p>
      <p>4.	 The corollary to being the “man behind the curtain” should the exhortation to “ignore that man behind the curtain.” DL is an attempt to provide an easy to use set of tools that give small and medium sized foundries access to knowledge that may be too expensive to access and implement under normal circumstances.  As noted above, if the licensing inquiry is complex or very extensive, it may be appropriate for the DL client to seek professional assistance. Admittedly, my law firm is experienced in and available for such tasks, but other professionals are also available. The DL user is free to use the advisor of their choosing.</p>
      <p>Finally as a general statement many of your questions spring from concerns relating to attorney ethics regulations. The concerns you have voiced are genuine, but absent specific facts, hypothetical examples become an exercise in legal or academic metaphysics. DL is not an attorney service, it may draw upon experience associated with a legal practice, but that does not mean it is the practice of law. Extending your reasoning and without umbrage, one might inquire as to whether an attorney client relationship exists simply because one purchased a copy of "Typography of Lawyers".  In addition, who would be responsible if a court or administrative agency misinterprets a document by reason of the formatting and type usage advice of the lawyer-typographer-author? Absent specific facts, who knows?</p>
