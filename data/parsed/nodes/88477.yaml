      <p>Two issues.  First, DigitaLingo is about the mathematics of license valuation based upon the value a font creates in its various uses and the value that the font purchasing market will pay for font software. DTF's comments illustrate the reasons why font designers struggle to make a living and/or to get the proper value for their work.  DigitaLingo is not merely a lawyer using old documents. The next time you fly, ask yourself why does the ticket cost more when you fly on a Friday and return on a Monday or when you fly on a holiday.  It's a simple thought experiment, but highly illustrative.  It's the valuation being responsive to demand.  DigitaLingo creates a mechanism to capture that value for foundries. I have a BFA from Pratt Institute, I worked at Landor Associates and The Schecter Group as a production director, where among other duties, I set up kerning tables and purchased font licenses for use with client projects.  For the past 13 years I have taught Intellectual Property Law in the MFA Design Program at SVA in New York where I advocate for an understanding of good typography and licensing.  I am not unaware of the issues that confront designers and typographers.  Fonts have an intrinsic value that exceeds their use on the desktop.  The web isn't static why should font valuation be stuck in the 19th Century?  </p>
      <p>Second, the empty workstation - I sit in that chair about 60-80 hours per week, sometimes more.   I'll post a regular picture if it will make all of you feel better.</p>
