      <p>These are some cogent questions.  Regarding antitrust, it is not our intent to dictate or control pricing. Which is why we generate a draft document for review by the foundry.  They are free to change the pricing, the algorithms provide a "market pricing band". To be fair, the pricing band is pretty accurate, but we are not the font police, the foundry is always in control.  Issues with the Unfair Competition and Anti-Trust folks at the Federal Trade Commission would only arise if we had the power to dictate pricing across the font industry or if every foundry in the USA elected to use the DigitaLingo pricing structure in lockstep.</p>
      <p>DTF raises a good point regarding accuracy over time.  Algorithmic based valuation is by its very nature a constant process.  It has to be reviewed constantly because markets change.  However, as the data set gets larger, it is possible to becomes more accurate and to better predict pricing and usage trends. In order to keep DigitaLingo accurate, we will have to constantly review pricing, licensing patterns and types of uses patterns as well as other factors, so as to provide more accurate market pricing for foundries.</p>
      <p>Regarding  aesthetics, We apply "multipliers" or factors that are responsive to intended uses by the licensee.  It is my contention that aesthetic decisions and licensee responses to aesthetic considerations are reflected (incorporated) in sales volumes and "types of uses" history for a font. Technically, it is possible to add a modifier or "factor" that reflects aesthetic considerations into our set of pricing algorithms. However, the questions arises - Who's aesthetic sensibility do we use as the model for the factors? I stand by the term accurate since I was merely referring to observable numerical sets.  </p>
      <p>Nick: thank you for the note, I shall be less "sensitive" in the future.</p>
