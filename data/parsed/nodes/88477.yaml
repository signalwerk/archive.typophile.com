      <p>I would like to formally introduce myself and DigitaLingo to the Typophile community.  My name is Frank Martinez and I am the founder of The Martinez Group PLLC.  I recently formed and launched DigitaLingo.com, as a service and website devoted to assisting small and medium sized foundries with complex licensing matters. In apologize for the length of this post. However, in view of the comments thus far, an explanation is warranted.</p>
      <p>For the past 30 years I have been active in design and typography, the last 15 years of which as a patent examiner and attorney specializing in the licensing and protection of font software and works of design.   DigitaLingo was born out of those experiences, but it is not an attorney or lawyer service.</p>
      <p>In a nutshell, DigitaLingo is algorithmically based and was created to optimize the licensing value of font software in OEM and large licensing inquiries. We have surveyed the licensing models in use by most of the foundries and, using over 40,000 data points; have modeled an optimized pricing model that is based upon 6 algorithms.  These algorithms were modeled to incorporate, (i) the foundry value assigned to a font, (ii) the market value for the type of font, (iii) the market value for the overall type of use desired by a licensing party/licensee, and (iv) the additional uses (outside of the customary desktop uses)  that are to be licensed.  Once initiated, the DigitaLingo process will automatically value the font software and populate a licensing document with the party names and addresses, identify the fonts, the licensed uses, any restrictions and will then transmit a draft licensing document to the parties for review and signature, all “on the fly” and on the cloud.</p>
      <p>The documents are stored on the cloud and are retrievable by the foundry at any time.  In addition and if desired, negotiations, if any, can be conducted via the DigitaLingo platform, providing a single site for preserving the history of a licensing deal.  As can be expected, a foundry is free to alter the terms or the prices as they may desire once the documents are transmitted for review. However, our testing and the “stealth mode” use of the pricing models indicate that they can be very accurate in optimizing valuation for the foundry.</p>
      <p>In developing the pricing model our goal was find a model which accurately captures, for foundries, the value of font software in the plethora of modern uses in existence, while being responsive to what the market (users/purchasers of licenses) will pay for fonts in such licensing arrangements.  The desktop model is, in my opinion, grossly unsuited to accurately capture the value of font software as it can be used in the digital world.  I have referred to the additional value of fonts in the digital world as the “reflective value” created by fonts; that is, the additional value that fonts create when used in OEM and digital, commercial, entertainment and other value creating ways. DigitaLingo was created to capture that additional value for the foundry.</p>
      <p>Most OEM and large corporate font inquires are negotiated by experience corporate representatives whose unsurprising goal is to maximize the value of a font license purchase for the licensee.  Most small and medium sized foundries do not have access to the same set of negotiating tools and market information that a large licensing party has at their fingertips.  Because of our experience in licensing, negotiating and litigating font software infringements, we do.  More importantly, DigitaLingo is our effort to distill that experience into a set of tools that any foundry can use.  If a foundry so desires, we can represent them in the negotiations, not as lawyers, but as a business and font advocate.  We are currently working on tuning the algorithms and as the data set grows, the algorithms will be tuned further.  In addition, we are currently developing a suite of automated font software copyright filing tools to assist the font community in protecting their work.  It’s a process and any comments and/or suggestions from Typophile members and others in the design and font communities will be welcome.</p>
