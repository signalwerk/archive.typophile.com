      <p>Frank I am curious —</p>
      <p>1) Where do you get your “40,000 data points” about pricing? If the answer is from your work on past font licenses, how can Digital Lingo's customers be sure that those data points are not protected by attorney-client privilege, contractual nondisclosure, etc.?</p>
      <p>2) DL says it offers access to “sophisticated and experienced business and legal professionals” yet elsewhere says that it “does not offer legal services or legal advice.” Assuming for the sake of argument that those statements can peacefully coexist, who ultimately bears responsibility for the quality of a DL license? DL, or its customers?</p>
      <p>3) How does DL plan to detect and resolve conflicts of interest? One could imagine a scenario where an OEM licensor is seeking bids from two (or more) foundries. Both foundries, unbeknownst to each other, sign up with DL to assist. The foundries are adverse to the licensor, but they are also adverse to each other, since if one gets the license, the other will not. </p>
      <p>4) Since you are the “man behind the curtain” in either case, how does a foundry benefit by using DL instead of just hiring you directly?</p>
