    <p>Hi All, </p>
    <p>Im new to this forum, so a quick hello!</p>
    <p>I'm about to undertake a redesign of a well loved Australian bodyboarding magazine.</p>
    <p>We are currently using Helvetica Neue as body copy, Corporate SQ for captions and Folio's. </p>
    <p>I am looking to find a typeface that is contemporary, clean, and legible. Our core reader group is aged 15 - 25 with that age increasing over the last few years. The magazine is youth oriented, fun, exciting and has been at the top of the genre for just over 20 years. </p>
    <p>In my opinion, serif fonts are the best for body copy, but i was wondering if there was a classy sans-serif font that would do the job nicely. the magazine still has to be relevant to the youth market, but i wish to add a touch of class and sophistication to the mag. </p>
    <p>Maybe a slab-serif font? </p>
    <p>My current thoughts are: Accord, Centro Slab Pro, Vista Slab or Depot.</p>
    <p>Any thoughts would be greatly appreciated!</p>
