      <p>I know it doesn’t sound like a solution, but can’t you just hand-delete the two nodes? If you put the original curves on the mask layer, you can tweak some handles to get as close as possible to the original curves.</p>
      <p>The additional nodes are probably generated by some kind of rounding off / curve fitting scheme. I am not sure, but I thought that by definition T1 and TT curves could be cut (i.e. node inserted) at any point without affecting the overall shape. This only holds if you have an infinitely fine grid (mathematical x-y plane...), so it wouldn’t apply on the typical 1000 PPM grids FL works with. Bezier handles and nodes are then restricted to be placed on these incremental ’grid points’. </p>
      <p>I guess that this is why FL sometimes inserts these additional nodes to best approximate the original curves. You could confirm this if you ’loosen up’ the original curves and make them meet at a larger angle, or if you size them up, so they span more grid points. At some point FL doesn’t have to insert extra nodes as it can put the Bezier handles more accurately.</p>
      <p>Hope this theoretical speculation helps...</p>
      <p>Sebastian</p>
