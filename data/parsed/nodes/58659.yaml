    <p>Romantic, decorative Adios Script is one of Alejandro Paul’s most elaborate and technically refined faces to date. Inspired by designs in “how-to” commercial lettering guides of the 1940s, it has been refined and brought into the 21st century through a huge variety of ornate swash letterforms. The lowercase “h” alone offers 43 variants. Hundreds of ornamental ascenders and descenders allow a beautiful interplay of strokes and combinations, while avoiding overlaps or conflicts. Adios Script features a mind-boggling 1,470 characters in total, in OpenType format.</p>
    <p>Veer just released a very nice <a href="http://www.veer.com/ideas/galleries/adios/" rel="nofollow" class="link-external">slideshow</a></p>
