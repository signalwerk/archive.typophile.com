  html: |-
    <p>We are proud to announce the release of  <strong><a href="http://www.sudtipos.com/fonts/123" rel="nofollow">Adios Script</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Adios-Script-pdf-1_3748.jpg"></div><p></p>
    <p>As part of the <strong><a href="http://tinyurl.com/qfr6dl" rel="nofollow">PDF specimen</a></strong>, the mexican photographer Brenda Dan was invited to collaborate with some beautiful image.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Adios-Script-pdf-2_6062.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Adios-Script-pdf-9_6227.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Adios-Script-pdf-10_4508.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Adios-Script-pdf-11_5182.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/Adios-Script-pdf-14_3488.jpg"></div><p></p>
    <p>Romantic, decorative Adios Script is one of Alejandro Paul’s most elaborate and technically refined faces to date. Inspired by designs in “how-to” commercial lettering guides of the 1940s, it has been refined and brought into the 21st century through a huge variety of ornate swash letterforms. The lowercase “h” alone offers 43 variants. Hundreds of ornamental ascenders and descenders allow a beautiful interplay of strokes and combinations, while avoiding overlaps or conflicts. Adios Script features a mind-boggling 1,470 characters in total, in OpenType format.</p>
    <p>Veer just released a very nice <a href="http://www.veer.com/ideas/galleries/adios/" rel="nofollow">slideshow</a></p>
