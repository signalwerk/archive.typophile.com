    html: "<p>To elaborate on what Gerry Leonidas implicitly said, and that being the crux of the matter: if you are working on a text where the Greek alphabet is embedded within the Latin one, you may look for a match for a very long time indeed and never find it, because the main points are really the x-height, the weight, the detail, etc., and, most of all, the overall tone (‘colour’). Why don’t you just go for another, single typeface? There are some good ones out there, which treat Greek as Greek, and not as a subdivision of Latin. I don’t know who developed this ‘Greek’ for Sabon, but I am (almost) sure it wasn’t Tchitchold.</p>"
