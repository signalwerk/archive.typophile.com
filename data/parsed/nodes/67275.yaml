  html: |-
    <p>The lowercase Greek available for Sabon has turned out to be unsuitable for a project I am currently working on: some of the ‘Roman’ lowercase Greek letters appear too latinised (e.g., pi and tau with a thin horizontal stroke), and — more importantly — the Italic ones are not all distinguishable from similar-looking Latin letters (e.g., a and alpha), which makes them useless in mathematical formulae.</p>
    <p>Both aesthetic and practical considerations have thus brought me to look for a font whose lowercase Greek letters could work together with Sabon Greek uppercase and Latin. So far, the best I have come up with is Garamond Premier Pro Roman, which I think could work both for short Greek citations in the text and for variable names in the formulae. Would that be a bad choice? Any other suggestions?</p>
    <p>Thanks in advance for any comments and ideas.</p>
