    html: |-
      <p>We all seem to agree that the existing Greek (or ‘Greek’, as Ton Aner put it) is worthy neither of Tschichold and Sabon nor of the Greek script. I might be able to improve the worst glyphs slightly, but a proper Greek Sabon would probably have to involve a full set of new lowercase letters, which is far beyond my abilities.</p>
      <p>As Lex Kominek seemed to imply, a less latinised Greek might work better when two different fonts are used for Greek (lowercase) and Latin. The suggested combinations with existing Greek fonts give the following results:</p>
      <p>Minion<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/greek-Minion_4300.png"></div><p></p>
      <p>Gentium:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/greek-Gentium_4308.png"></div><p></p>
      <p>Garamond:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/greek-Garamond_5992.png"></div><p></p>
      <p>Choosing a different font is not really an option:  Sabon has the right style for a technical academic work, it happens to be the institution's standard typeface, and I have added some mathematical glyphs, brackets etc. for use with LaTeX which would have to be redesigned to match a different font.</p>
      <p>Thanks for mentioning the extensions to Minion (of which I was aware, but I did not know that they had become available), as well as Andron, whose Runic and Fraktur-inspired parts in particular look very interesting.</p>
