      <p>1. I would not insist on the claim that mixing capitals of typeface A with lowercase from typeface B is impossible. But for running text, be sure, this will be hard to master.</p>
      <p>Then, choosing a typeface whith both decent Latin and Greek might be the way to go. You shall find something which meets your requirements.</p>
      <p>2. Check some of <a class="freelinking external" href="http://www.tiro.com/fonts.html" rel="nofollow">John Hudson’s fonts</a>.</p>
      <p>3. Check Johannes Küster’s <a class="freelinking external" href="http://www.typoma.de/en/index.html" rel="nofollow">extension work to Minion</a> which focuses on mathematical composing aspects in particular.</p>
      <p>4. Check <a class="freelinking external" href="http://www.signographie.de/cms/front_content.php?idart=218&amp;changelang=2" rel="nofollow">Andron</a>, which has been designed exactly for the case you describe, with a Greek lowercase to harmonize but not to be equalized.</p>
      <p>– Finally, the last exit may be to do new glyphs for Sabon Greek.</p>
