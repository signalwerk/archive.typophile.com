  html: |-
    <p>The amusing rules written up by Moxon are covered in the entry on "Customs, Ancient" in <a class="freelinking external" href="http://books.google.com/books?id=Z_QUAAAAIAAJ" rel="nofollow">The American Dictionary of Printing and Bookmaking</a>, starting p. 126.</p>
    <p>Apparently if you showed up drunk, or took somebody else's composing stick, you will be "laid on your Belly athwart the correcting-stone" and held down to receive "Eleven blows on your Buttocks"</p>
