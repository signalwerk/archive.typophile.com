    <p>I just bought a new MacBook Pro and used Apple’s software to move my copy of FontLab (among other things) from my old computer to my new one. But now I have to re-enter the serial number every time I start the program.</p>
    <p>Help regarding this problem much appriciated.</p>
    <p>Best wishes,<br>
    Kristian</p>
