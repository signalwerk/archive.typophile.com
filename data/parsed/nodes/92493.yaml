  html: <p>I was wondering if Darth Vader were to use a font, what would it be? He's definitely got style and good taste so I immediately went for Futura because the beautiful symetrical curves and sharp corners contrast each other perfectly which is almost like a metaphor for the inner struggle of Vader himself. Any thoughts?</p>
