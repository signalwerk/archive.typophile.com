      <p>&gt; He's definitely got style and good taste </p>
      <p>I don't associate those qualities with Darth Vader. Well, maybe you could use style in the sense of being a colorful character, in the way that Wild Bill Hickok or Patton had attention-getting styles. But I don't think of Vader as being concerned with good taste.</p>
      <p>I'd use words more like driven and ruthless. And I don't think he'd give a damn about fonts. He'd use whatever military fonts were handy. </p>
      <p>However his personal handwriting would be more interesting — forceful, angry yet controlled, dangerous looking.</p>
