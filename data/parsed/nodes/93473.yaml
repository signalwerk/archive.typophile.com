      <p>It’s tempting to describe type design in terms of art movements.<br>
      However, that frequently puts the cart before the horse.<br>
      Consider that Doesburg’s iconic right-angled alphabet (not made into a font until the digital era) was not designed until 1919.<br>
      This seems to be an example of what would later be termed Purism, or perhaps De Stijl.<br>
      Certainly not Expressionist, although it works perfectly in this particular publication.<br>
      If anything, its reductive angularity might be informed by ﬁn-de-siècle Arts and Crafts designers such as Rene Mackintosh and Kolo Moser.<br>
      However, as a type design it stands in a class of its own (with a hint of Fraktur in the capitals).<br>
      Sorry, I don’t know anything about it.</p>
