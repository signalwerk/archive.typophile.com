      <p>I don’t think that the type was made specifically for this project. Years ago, I revived a very similar typeface called Teutonia, from a small foundry (Roos &amp; Junge) in Offenbach. Here is the link to the foundry that sells the revival – <a href="http://volcano-type.de/fonts/categories/display/mountain" title="http://volcano-type.de/fonts/categories/display/mountain">http://volcano-type.de/fonts/categories/display/mountain</a></p>
      <p>This style of letter is often associated with Russian constructivism, but it is older than that. I am not so sure that Roos &amp; Junge were the originators of the style, either. It could be older. Here is the background info that I have … <a href="http://www.typeoff.de/2006/04/08/from-teutonia-to-mountain/" title="http://www.typeoff.de/2006/04/08/from-teutonia-to-mountain/">http://www.typeoff.de/2006/04/08/from-teutonia-to-mountain/</a></p>
      <p>The type in your image is very, very close to Teutonia (the J is different …). But designs in this period often changed over time, or were added to (or were copied, well or not, buy other foundries).</p>
