    html: <p>Well, I think, without question that there needs to be a lot more 'terminology' in the 'science of type design'.  It's amazing how abstract and seemingly unrelated terminology one has to use to explain how Avant Garde is different from Futura, say. The scene from Hoefler Fere Jones offices in Helvetica was particularly telling, where they talk about how a font needs to be more saturn five rocket or etc....  Everything feels connotative, nothing feels declarative.  We do need more exact and more standardized words.</p>
