      <p>I think there is something about the serifs that is a result of wear and not part of the font. Finding squarish narrow serif fonts with a serif on the middle arm of the E was not too easy, but maybe <a class="freelinking-external" href="http://new.myfonts.com/fonts/redrooster/pall-mall-rr/">Pall Mall</a> Bold would work. You could use some sort of blurring effect and/or added stroke to further simulate the sample.</p>
      <p>- Mike Yanega</p>
