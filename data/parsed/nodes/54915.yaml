    <p>Hello all –</p>
    <p>I know there are lots of threads here on similar topics, but I think I'll try this anyway. I haven't posted here before, but I've found lots of great advise on these forums.</p>
    <p>I'm designing a literary magazine, and we're in search of a bit of renewal. I've been designing it a few years, and since the beginning of 2007 we've been using <a class="freelinking external" href="http://emigre.com/EF.php?fid=196" rel="nofollow">Tribute</a> for the titles, and <a class="freelinking external" href="http://www.fontshop.com/fonts/downloads/monotype/bembo_book_pro_vp/" rel="nofollow">Bembo Book</a> for the text. We're not really dissatisfied with this, but Tribute has a few downsides. It's not really a display typeface, it's actually made to work well at rather small sizes. We are/were aware of this. But it's a typeface with a big, quirky personality, with lots of swashes, ligatures and extras. After two years, though, I've grown really tired of it, and I'm looking for a replacement, or replacements. The problem is that most of the typefaces I try look quite feeble next to this strange half-parody. Now, I'm not going to set the new typeface alongside the old, of course, but the new look shouldn't be weaker than the old. </p>
    <p>Is there something out there as idiosyncratic and bizarre - and at the same time classic - as Tribute? </p>
    <p>Maybe not. Maybe we should just try something completely different. But these specs remain:<br>
    - Should be a seriffed face<br>
    - Needs to work at large point sizes (30 - 120 or so)<br>
    - Should have both oldstyle and lining figures, and small caps<br>
    - Lots of ligatures and swashes and other interesting details don't hurt </p>
    <p>For some other jobs I've been using typefaces with display cuts, like Warnock and Arno Pro, I really love both of them. But this magazine just needs something else. I am considering swiching from Bembo Book to Arno Pro for the text, though - that's another story, but I'm also open for suggestions on good workhorses for text, with interesting display companions. </p>
    <p>Some more details: The magazine is Norwegian, it's called Vagant, and is one of about two leading literary magazines in the country. It has a combination of academic articles and literary texts, and illustrations by invited artists. <a class="freelinking external" href="http://www.vagant.no" rel="nofollow">Homepage</a> The format is w210xh280, usually 130-160 pages, 4 issues pr year.</p>
