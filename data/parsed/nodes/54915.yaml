    html: |-
      <p><cite>After two years, though, I’ve grown really tired of it, and I’m looking for a replacement, or replacements.</cite></p>
      <p>Just a suggestion about the redesign, but have you checked to make sure that your <strong>readers</strong> haven't grown tired of it? With only 4 issues per year, the readers might just now be starting to warm up to your design, despite the fact that you've grown tired of it.</p>
      <p>Often, a designer will stare at the same typeface in the same designs for hours of time over many days and months. Of course it is going to not feel fresh to you after 2 years, but always remember that your reader's experience of the typeface is much different than your own.</p>
      <p>As to a suggestion, I love FF Clifford. Or perhaps FF Oneleigh.</p>
