    <p>Hello,</p>
    <p>I came across this magazine and immediately fell in love with the arrangement of the type on the cover, - so much so that I took a photo of it with my phone.</p>
    <p>I’m now curious as to what the typeface may be or preferably if there is anything similar? </p>
    <p>It could be a customized typeface?</p>
    <p>Any suggestions are appreciated.</p>
