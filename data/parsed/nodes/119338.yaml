    html: |-
      <p>It looks like <strong>Regency Script</strong>.<br>
      There is a digital version called <strong>Regency Script FLF</strong> by Casady &amp; Greene [2004] and there is also an OPTI/Castcraft version: <strong><a class="freelinking external" href="http://www.findmyfont.com/index.php/fonts/font-preview?fset=OPTI-Castcraft&amp;ffam=OPTIRespighi%20-%20Script&amp;fid=6f5f1e87b1b63843e71c7593e0191a7d&amp;fsize=60&amp;text=Harold%20H.%20Leese%20(A%20Boulton%20%26%20Sons)&amp;wrap=2" rel="nofollow">OPTI Respighi</a></strong></p>
      <p>PS: Be careful when using OPTI "orphan" fonts in a commercial project.<br>
      You can read more about OPTI here:<br>
      <a href="http://luc.devroye.org/fonts-27506.html" title="http://luc.devroye.org/fonts-27506.html">http://luc.devroye.org/fonts-27506.html</a></p>
