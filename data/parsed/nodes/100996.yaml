    html: |-
      <p>Don't think it's a font as it, more a custom job/logo. You could do the same with any wide/extended sans of your choice.<br>
      Sans to customize with a straight-legged /R: <a class="freelinking external" href="http://www.myfonts.com/search/trade+gothic" rel="nofollow">Trade Gothic Extended</a>, <a class="freelinking external" href="http://www.myfonts.com/search/akzidenz+grotesk" rel="nofollow">Akzidenz Grotesk Extended</a><br>
      Sans with similar /R: <a class="freelinking external" href="http://www.myfonts.com/fonts/font-fabric/code-pro/" rel="nofollow">Code</a>, <a class="freelinking external" href="http://fontfabric.com/archive-free-font/" rel="nofollow">Archive</a></p>
