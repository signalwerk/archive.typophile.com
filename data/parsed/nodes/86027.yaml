      <p>The Wrong Fournier: </p>
      <p>I've added some more examples to this page: </p>
      <p>     <a href="http://johntranter.com/00/fournier.shtml" title="http://johntranter.com/00/fournier.shtml" class="link-external">http://johntranter.com/00/fournier.shtml</a></p>
      <p>It shows the two Monotype Fourniers from the 1920s; also shown for comparison are a scan reproduction of a photo-litho offprint of some Monotype metal-set Fournier (Oliver Bernard’s translations of Rimbaud’s Collected Poems, Penguin, 1965), the same text typeset in digital Fournier, and the same text set in Corundum, a recent typeface by the Joshua Darden studio in Brooklyn USA: </p>
      <p>     <a href="http://www.dardenstudio.com/typefaces/corundum_text" title="http://www.dardenstudio.com/typefaces/corundum_text" class="link-external">http://www.dardenstudio.com/typefaces/corundum_text</a></p>
      <p>best</p>
      <p>JT</p>
