      <p>Thanks, DTW. I've bought a version and I am trying it out on a few pages of poetry with footnotes. It's very quirky: the lower-case i and the numeral 7 in italic is too strange to use for long, and it's not easy to insert their alternates; and as a text font it does seem to be cut just a tiny bit too thick, but at least that remedies Monotype Fournier's problem of being a little too wide and open and faint, especially the lower case g. </p>
      <p>At least someone has brought out a good, usable digital version of Barbou. I can remember when a strip of two fonts (on photo film) for the $100,000 Compugraphic 7700 machine cost US$600, a quarter of a century ago, and that didn't include kerning, alternates or ligatures (which were impossible on that equipment in any case)! That's a couple of thousand bucks for two fonts in today's sadly shrunken dollar, more than ten times what my digital version of twelve Corundum fonts cost. </p>
      <p>And what would we do with all that spare time if we found the perfect font? </p>
      <p>best</p>
      <p>John Tranter</p>
