      <p>On second thoughts, I take that back. Corundum is not a heavy font: it just looks that way if you go to the website, because almost all the examples given as "Corundum Text" are in fact Corundum Bold Text -- an extraordinary oversight. It's nearly impossible to work out that the Regular weight exists: when you finally uncover them, the three weight variations are unlabelled, where they should be labelled Regular, Bold and Extra Bold (or if you prefer Regular, Semi-bold and Bold.) </p>
      <p>It  does look like a stylish and very useful digital font -- a modernised version of Fournier-Barbou with harmonious italics, good small caps and a good range of ligatures-- and I shall explore it further.</p>
