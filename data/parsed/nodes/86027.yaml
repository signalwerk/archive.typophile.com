      <p>Hi, Nicola. I use InDesign for typesetting, and unfortunantely Corundum has problems with that software. Choosing to replace the italic 1 or 7 with their alternates does not call up the real alternates; you have to set the text with the weird glyphs Corundum gives you, then, when you're finished (really finished!) go through and substitute one glyph for another, a real pain. And if you decide to make some revisions (as we all do), you have to do this all over again. </p>
      <p>Also, importing RTF files into InDesign fails to catch the italic version of Corundum, and for some inexplicable reason, the font designer refused to call the italic version "italic", and instead calls it "BookItalic". Sometimes it is impossible to force InDesign to accept the changes you need to make (change Italic to BookItalic), by hand, one at a time. What a shame! </p>
      <p>Dante Metal is a wonderful typeface. I set my 2009 Doctor of Creative Arts thesis in the digital version of Dante. Unfortunately when it was photocopied and printed and bound, the face turned out too faint: the photocopier overexposed the pages. Oh well: that's photocopying versus metal printing. </p>
      <p>I'll try to give an example of that, and an example of Corundum as a font usable for poetry. The footnotes in the Corundum font are not meant seriously, by the way. </p>
      <p>I should mention that the Penguin edition of Rimbaud's "Collected Poems" (trans. Oliver Bernard) is set in Monotype Fournier, and the effect is very good. The metal original helps make the font solid enough. </p>
      <p>best</p>
      <p>John Tranter</p>
