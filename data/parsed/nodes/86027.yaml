      <p>Thanks for bringing this to our attention: I've also read the story of Monotype Barbou in Morison's book.</p>
      <p>As a sidenote, I would like to remember that another, heavier, digital version of Fournier does exist: Corundrum Text, by Joshua Darden (<a href="http://www.dardenstudio.com/typefaces/corundum_text" title="http://www.dardenstudio.com/typefaces/corundum_text">http://www.dardenstudio.com/typefaces/corundum_text</a>); although I find Monotype Fournier beautiful and useful when appropriately set.</p>
      <p>Barbou, on the other hand, has been quoted by Jeremy Tankard as one of the historical typefaces he has researched upon while designing his Kingfisher (check the pdf here: <a href="http://typography.net/fontfamilies/view/12" title="http://typography.net/fontfamilies/view/12">http://typography.net/fontfamilies/view/12</a>).</p>
