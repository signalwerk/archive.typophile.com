    html: <p>Alas, the lovely Rappo Fournier has disappeared from the Swiss Typefaces site. Is this a unique event in the world of digital type? I had tried to install it on my Macbook Air, but the operating system refused to allow me to, and reported finding problems with the kerning tables. I passed this on to Swiss Typefaces, and they said a redesign that would solve that problem was planned. Alas, that didn't happen, and the font disappeared, and now my 600-page Collected Poems will have to be published in Adobe Arno Pro -- a very nice typeface to be sure, but not quite what I wanted. If M. Rappo manages to save his font from its fate, and fix the kerning tables, would someone please let me know? Thanks. JT, May 2013.</p>
