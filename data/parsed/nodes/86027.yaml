      <p>In searching for information about Barbou, I see one place where it is dated 1926, another where it is noted that Monotype made it available in 1959, and another that says it was their last hot-metal type, from 1968.</p>
      <p>It is a beautiful typeface. But are its commercial prospects enough for them to make the effort to do it justice?</p>
      <p>And I also like Kingfisher. I think it's very important that type designers aim at addressing the issue of why many digital typefaces seem uninteresting compared to metal ones. But I notice that it seems aimed at the area of design space occupied by Caledonia, and a number of other typefaces of recent design and high quality are aimed at this area of design space.</p>
      <p>I think that there is both too much competition, and a lack of interest there for a typeface in that area to really take off: aside from commercial prospects, this is unfortunate as I would like the successful attempts to be <em>influential</em>. Only a few people, in comparison, seem to be aiming at what I suspect is the brass ring with typefaces such as Williams Caslon and Starling.</p>
      <p>Popular taste probably would respond well to a fresh new alternative of high quality in the Bembo - Garamond - Caslon - Baskerville - Times - Century Expanded neighborhood of serif types.</p>
