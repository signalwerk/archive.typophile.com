      <p>I'm reviving this thread since I've just found that the b+p swiss typography foundry has published in 2011 a new digital revival of Fournier, designed by Francois Rappo. It is a very large family (24 fonts) which even features different x-heights. The book weight is slightly darker and bigger than the Monotype's version. In the image attached, I set a quick comparison between Monotype Fournier (above) and the b+p version (below), both set at 12 points on 14 leading:</p>
      <p><a href="http://farm9.staticflickr.com/8392/8453613952_1bfde1fdaf_o.jpg" title="http://farm9.staticflickr.com/8392/8453613952_1bfde1fdaf_o.jpg">http://farm9.staticflickr.com/8392/8453613952_1bfde1fdaf_o.jpg</a></p>
      <p>A free trial version with a limited set of glyphs is available for download:</p>
      <p><a href="http://www.swisstypefaces.com/fonts/new-fournier-bp/" title="http://www.swisstypefaces.com/fonts/new-fournier-bp/">http://www.swisstypefaces.com/fonts/new-fournier-bp/</a></p>
