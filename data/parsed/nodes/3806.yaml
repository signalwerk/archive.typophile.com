    html: <p> In a very basic way, they are designed. Someone <br>had to determine where the logo would go and <br>in what order messages would appear and how <br>purchased items and prices and totals would <br>align. Beyond that, they are designed by chance <br>and machine - and that can be interesting too. </p>
