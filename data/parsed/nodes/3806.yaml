    html: <p> That kind of design is my favorite one --- here, you have only these components/fonts/measurements/conditions... make what you can make of it. <br>Build a house with these seven bricks. <br>Make a painting with these four colors. <br>you know what I mean. <br>I was once involved in designing a ticket for the cinema, that was great fun. where should the price go, where should the movie title go, which text should be bigger, use font number 1 or number 3?  hehe <img src="http://www.typophile.com/forums/clipart/happy.gif" alt=":)"> <br>Tepid Monkey had some nice receipt fonts, I remember. </p>
