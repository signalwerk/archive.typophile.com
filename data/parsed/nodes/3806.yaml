  html: <p><img src="http://www.typophile.com/forums/messages/30/2933.jpg" alt="eeek"> <br>I am currently building a "receipt" gallery, (that means "printed bitmap type"), and if you got original receipts with rude or well-done fonts, or crappy logos, please send 150 dpi scans to greg@bmap.info. <br> <br>oh, and for stimulation, check also Martin P. Pfeiffer's <a href="http://www.scootergraphics.com/receipt/index.html" target="_blank"> Receipt 1.0 font</a></p>
