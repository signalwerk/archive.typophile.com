    <p>Type@Cooper is offering a series of public font tech workshops this June.<br>
    Registration is open now. </p>
    <p><a href="http://coopertype.org/public-workshops/" title="http://coopertype.org/public-workshops/">http://coopertype.org/public-workshops/</a></p>
    <p>June 1 &amp; 2 Robofont with Frederik Berlaen and Andy Clymer<br>
    June 3 Interpolation with Andy Clymer<br>
    June 4 Kerning with Ben Kiel<br>
    June 5 &amp; 6 Accents with Ben Kiel<br>
    June 8 &amp; 9 Intermediate Python with Andy Clymer<br>
    June 17th Building Open Type Features with Andy Clymer</p>
