    html: |-
      <p>THanks all for the help so far.<br>
      The "C" and "G" have been opened up a little.<br>
      "V" and "W" have been thickened, with an alternate double V "W"<br>
      I'm wasn't satisfied with the "E", so I connected the top and bottom. -still not sure though<br>
      "S" was thickened, "Z" has been made a bit narrower.</p>
      <p>EBEN: which character "has something weird &amp; cool" ?</p>
      <p>My intendion was to create something with the varied weight of a serifed font, but without the sharp corners. My inspiration is based loosely on Optima and block serifs.</p>
      <p>The first post is in shades of grey. I was attempting to make larger glyphs lighter, smaller glyphs darker, to even out each character's presence (not sure if I'm making myself clear, though). Anyway, I've given up on that until I get the font finished.</p>
      <p>Sorry I haven't got a sample text. I am saving up for Typetool, until then I have to manually arrange each character in Freehand if I want to make words.</p>
      <p>Oh, and I recentl realized that I miss-spelled "Majescule" -oops!</p>
      <p>-Nate</p>
