      <p>Sorry I see I was hasty. The 'H' is the one I meant. It seems like it's the most finished and has the spirit of the face locked up in it.</p>
      <p><cite>to even out each character’s presence</cite></p>
      <p>I know just what you mean. And it's starting to work.</p>
      <p>Look at your O. The weight there isn't quite right. Your R, P, A and X suggest weight in the upper right &amp; lower left.</p>
      <p>Also look at How it sets problem words like LAWYERS.</p>
      <p>Look after that K the bottom leg is weaker than it maybe should be.</p>
      <p>Keep pounding on it. It's getting better.</p>
