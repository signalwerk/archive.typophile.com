  html: |-
    <p>I know the topic of dotted fonts has been on here before, mainly around the Stella McCartney logo, but could anyone please suggest any similar fonts to this logo as the Stella McCartney suggestions are not quite right! Would like a font that is not digital looking, more elegant and has as few dots as possible, as I'm looking to have it die cut so need the dots at a reasonable size.</p>
    <p>This is probably a commissioned job that has be drawn but any font suggestions welcome.</p>
    <p>Thanks</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/The%20Maritime%20Hotel.jpg" width="1925" height="289" alt="">
