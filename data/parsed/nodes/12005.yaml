    <p>Geometric <a href="/node/12132/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">sans serif</a> by <a href="/node/12008/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Christian Robertson</a>, released in 2004 in <a href="/node/12009/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Veer</a>’s Umbrella collection. The font contains both <a href="/node/12420/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">OpenType</a> and <a href="/node/add/wiki?edit%5Btitle%5D=AAT" title="Create node &quot;AAT&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost"><span class="caps">AAT</span></a> features, including alternate characters, <a href="/node/12584/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">small caps</a> and <a href="/node/40308/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Old Style Figures</a>.</p>
    <p>Pill Gothic was one of the first fonts posted to <a href="http://typophile.com/forum/1" class="link-lost">the critique area</a> of <a href="/node/12022/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Typophile</a>.</p>
