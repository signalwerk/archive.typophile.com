    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Typefaces" class="freelinking" rel="nofollow">Typefaces</a> : Pill Gothic</strong></p>
    <p>Geometric <a href="/wiki/sans%20serif" class="freelinking" rel="nofollow">sans serif</a> by <a href="/wiki/Christian%20Robertson" class="freelinking" rel="nofollow">Christian Robertson</a>, released in 2004 in <a href="/wiki/Veer" class="freelinking" rel="nofollow">Veer</a>'s Umbrella collection. The font contains both <a href="/wiki/OpenType" class="freelinking" rel="nofollow">OpenType</a> and <a href="/wiki/AAT" class="freelinking" rel="nofollow">AAT</a> features, including alternate characters, <a href="/wiki/small%20caps" class="freelinking" rel="nofollow">small caps</a> and <a href="/wiki/old%20style%20figures" class="freelinking" rel="nofollow">old style figures</a>.</p>
    <p>Pill Gothic was one of the first fonts posted to <a href="http://typophile.com/forum/1" rel="nofollow">the critique area</a> of <a href="/wiki/Typophile" class="freelinking" rel="nofollow">Typophile</a>.</p>
