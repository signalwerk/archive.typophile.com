      <p>I just ran into this thing... Cool.</p>
      <p>1977: Commodore PET 2001-8<br>
      Purchased in Palo Alto for $800. Neighbors had no idea what it was. We weren’t too sure either. Internal cassette drive (speed estimated at 50 bytes/second). Traded in to CBM dealer in Beirut for purchase of next item. Still kicking self for that.</p>
      <p>1980: Commodore PET 4016<br>
      External cassette drive. Donated to my high school upon purchase of next item. They never touched it. So my brother and I basically broke into their storage room one evening and did an extraction. Still in my parents’ basement in Beirut.</p>
      <p>1982: Commodore 64<br>
      What an amazing machine that was. Next to the PET in the basement. Has the external floppy drive (which cost more than the computer), and I was in awe of its blazing speed and massive 170Kb capacity.</p>
      <p>1987: Amiga 500<br>
      1.5Mb Ram. No hard disk. Ran Fontographer 3.1 under Mac emulation (used a virtual RAM-Drive partition to fake a hard disk). Added a weird daughterboard to support an over-clocked FPU (used to do ray-traced animation). Donated to a very small Armenian TV show in LA for videotitling upon purchase of next item.</p>
      <p>1992: Amiga 3000<br>
      Hard disk! Killer machine. Still in garage.</p>
      <p>199?: Commodore Plus-4<br>
      Purchased at garage sale. Sold at garage sale.</p>
      <p>1995: Self-built PC box (386)<br>
      Used for testing fonts. Still in garage.</p>
      <p>1996: Apple IIcx<br>
      Picked up on the way to being dumped. Used for testing fonts. Trashed upon acquisition of next item.</p>
      <p>1998: Apple Quadra<br>
      Picked up on the way to being dumped. Used for testing fonts. Trashed.</p>
      <p>2000: Dell laptop - Latitude 14”<br>
      Purchased used. The first non-Commodore I ever liked. My gray warrior. Sold via eBay upon purchase of next item.</p>
      <p>2003: Compaq laptop - 15”<br>
      Crappy machine. CPU melted when fan got blocked. Data all OK!</p>
      <p>2006: Dell laptop - Inspiron 17”<br>
      Pretty ugly, but solid worker. Current main machine.</p>
      <p>2009: HP 2140 mini (HD screen)<br>
      Great little machine. Not used enough.</p>
      <p>hhp</p>
