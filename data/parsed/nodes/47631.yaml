      <p>From 1990, PC only, all assembled, I learned this from my uncle and my father.</p>
      <p>1. Assembled AT8088 5 1/4 diskettes only. Owned by my father but intensively gamed by me.<br>
      2. Assembled 286 with 2 mb of RAM. Also owned by my father, made first homeworks on it.<br>
      3. Assembled 386 with 8mb of RAM. Father owned, first contact with color screen.<br>
      4. Assembled 486 with 32mb of RAM. Father owned, first contact with corel draw and sound.<br>
      5. Pentium II with 128mb of RAM. Bought for graphic design school.<br>
      6. Pentium IV with 256mb of RAM. Second school computer.<br>
      7. Celeron 2.66 ghz 2gb of RAM. Bought a couple of years ago for work.</p>
      <p>Number 1 to 5 are catching dust on boxes. 6 is being used by my parents and every time I visit them I have to clean and fix the software. 7 is the one I’m typing on and will remain active at least for a year and a half.</p>
      <p>Héctor</p>
