      <p>1984: Texas Instruments TI 99/4A. Really no more than a huge desktop calculator with a tape drive. What a piece of junk. Its built-in BASIC sucked. Scrapped.</p>
      <p>1985: Sinclair ZX Spectrum 48+ (not the rubbery keyboard jobby, but a sleek black one with <em>proper</em> keys!). Fairly slow, until I learned to program in raw Z80 machine code. Bliss! Sold to a friend on next purchase.</p>
      <p>1986: Sinclair ZX Spectrum 128. Built-in tape drive, more memory, nice advanced sound chip (a Yamaha, if I’m correct). For the rest pretty same as above. Sold on next purchase.</p>
      <p>1988: Brand new Atari ST 520. Yes, the Amiga was better graphically, but this was a lot cheaper. Learned 68000 assembler. Wrote an almost-complete Postscript emulator. Checked out Mac programs. Played games. Lent it to a friend (and never got it back) after next purchase.</p>
      <p>1989/1990: (ish) Second hand Acorn Archimedes A3000. Double disk drive, but still no hard drive. Learned ARM assembler. Incredibly powerful machine — learned to program for PCs through its emulator. Still have it, but no monitor to hook it up to ...</p>
      <p>1991: Self-built 486 PC. Learned 8086 assembler and C. Bought a virtual reality helmet and learned to write programs for it. A new dimension to graphics! Traded in for next purchase.</p>
      <p>..2009: Various PCs, all Frankenstein-wise containing salvaged parts from previous PCs. Ransacked items travelled down the family to dad, brothers, sisters, until (presumably) old beyond measure and scrapped. Learned C++ and wrote all kinds of programs for Windows, with various success.</p>
      <p>2009: Dawn of a new age: while writing, I’m still oogling this shiny new 21.5” iMac. Learning XCode as we speak. Posting this because my head hurts of going <em>again</em> through a major programming paradigm change.</p>
      <p>Price-wise I don’t appear to have learned something; always shelling out near-top prices for machines that are advertised to be very nearly “top of the bill” for no more than 6 months.<br>
      Memory-wise I amuse my younger colleagues with stories of 48K, filled to the point of overflowing, where this machine has about 80,000 times that much.<br>
      Performance-wise: here I am, staring at a 1920 x 1080 32-bit color screen and trying to decide how this is <em>more</em> fun than 256x192, black-and-white ...</p>
