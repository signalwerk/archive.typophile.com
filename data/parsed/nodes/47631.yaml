      <p>Oh no, people are going to think that I’m some sort of eco-monster because of the Apple purchasing habits I mention in the thread that you linked to starting this talk :(</p>
      <p>Well, I may be an eco-monster, although not because of this. I also don’t have a car, and have been commuting with public transportation to and from work or school everyday since 2002 (with the exception of my year in Reading… here, I walk to school).</p>
      <p>As for my four laptops and two iPods since 1999…</p>
      <p>1. When my first laptop died I sold it to a repair shop (who wanted to take it apart) for $100. So I hope that many of the parts got reused and not thrown straight away.</p>
      <p>2. When so many parts of my second laptop died, I gave it to my mother, who had much of it repaired at her own costs, and now she uses it as a stationary machine.</p>
      <p>3. My third laptop still hasn’t died! It lives in Berlin, being periodically used. </p>
      <p>4. I’m still using my fourth laptop every day ;-) </p>
      <p>As for my first iPod, well, that probably is in a landfill somewhere. My second iPod is safe and sound, right next to me.</p>
      <p>From 1995–1999 I had a desktop Performa. This never got thrown away. It lives inside a closet still at my parents’ house.</p>
