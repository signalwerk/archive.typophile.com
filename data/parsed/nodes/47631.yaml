      <p>1980: Sinclair ZX80 (sold)</p>
      <p>1981: Atari 400</p>
      <p>1983: Atari 800</p>
      <p>1984: Atari 800XL<br>
      1984: Mac 128k (sold). Through various upgrades ended up as the world’s most expensive Mac Plus (~$4500)</p>
      <p>1987: Mac Plus (sold)</p>
      <p>1989: Mac II (sold)</p>
      <p>1990: Mac IIcx (sold)</p>
      <p>1992: PowerBook 140 (sold)<br>
      1992: PowerBook 160 (sold)</p>
      <p>1993: Quadra 840av (sold)</p>
      <p>1994: PowerBook Duo 230 (sold)<br>
      1994: PowerMac 7100 (sold)</p>
      <p>1996: PowerMac 7600 (sold)</p>
      <p>1998: PowerBook G3 (Wallstreet)</p>
      <p>1999: PowerMac G3 (Blue &amp; White)</p>
      <p>2000: PowerMac G4 Cube</p>
      <p>2003: PowerBook G4 (Titanium) (sold)</p>
      <p>2004: PowerMac G5 (Dual 1.8Ghz)<br>
      2004: HP Pavilion (sold)</p>
      <p>2006: MacBook Pro 15” (sold)</p>
      <p>2007: Mac Pro (2x 2.66 Dual Core Xeon)</p>
      <p>2008: MacBook Pro 15”</p>
      <p>2009: MacBook Pro 17” (unibody) My current main computer.</p>
      <p>I guess I’m kind of a Mac guy. I’ve only listed computers that were my primary or, in a few cases, secondary computer. Unless noted as sold, I still have them, either in use somewhere in the house or gathering dust. I also picked up a few other computers that I don’t actually use much, such as an original Compaq PC “luggable” (acquired in 1996), and a Sinclair ZX81 (2000). I have set up in my basement a Mac SE, an LC III and my old PowerMac G3 so I can boot up any pre-OS X Mac system if I need to access very old files or programs. Not that I’ve found much need to do so, as it has turned out. I’ve also left out computers my partner or daughter use (the odd iMac, iBook, or MacBook), not to mention a Newton MessagePad 110 (still works) and a Palm IIIx.</p>
      <p>My first Mac cost $2500 in 1984. The most expensive was probably the 840av, at about $4700 in 1993. My most recent, the MacBook Pro 17”, was $2800, nominally higher in price than my first Mac, but only about $1300 in 1984 dollars. Plus, it’s about 325 times faster, has over 30,000 times a much memory, 12 times as much screen area (in full color), and weighs less than a third as much.</p>
      <p>My all-time favorite so far is my current MacBook Pro. My least favorite was the HP Pavilion, which was incredibly cheap and underpowered, had a big blue light on the front that blinked on and off when it was asleep (I’M ASLEEP!... I’M ASLEEP!... I’M ASLEEP!) and would wake randomly for no apparent reason.</p>
