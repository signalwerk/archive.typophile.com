      <p>Memory&gt;</p>
      <p>Being a Luddite, in spirit, if not actually, I see it as a series of giant, but cramped and badly lit rooms, full of dusty filing cabinets. There are hundreds and hundreds of half-literate urchins running around, rifling through massive drawers full of unsorted sheaves of paper tied together with string, trying desperately to fill randomly generated orders, while in other rooms wheezy old scribes sit at row after row of Bob Cratchit style desks feverishly writing down everything that I hear, say, feel and smell in a scratchy, ink spattered and smeared Bickham script, while teams of draughtsmen in yet another room peer out my eyes through quaint looking brass telescopes with smudged poorly ground lenses and draw maps and diagrams of every thing I see. The urchins bundle these up, not bothering to sort in any way, fasten them with string, run off to the filing cabinets and stuff them in, where ever they can find room. The floors are knee deep in loose papers. Retrieved documents are spread out on huge tables where teams of professorial looking gentlemen in frock coats and nineteenth century army uniforms try and make sense of it all, inferring strange connections between completely unrelated documents, with no particular respect for logic or common sense.</p>
      <p>-=®=-</p>
