    <p>Hia</p>
    <p>If memory is the brain function that records information, stores it as data and recalls said retained data, how would you describe your own memory system? What does it look like, how does it work</p>
    <p>personally I think I view mine structurally similar to the universe, with a ga-billion-trillion stars, clustered together at various points, with no sides or end. and when i recall a memory a selection of stars all very far apart are joined together through connecting lines, drawing information from far and wide to bring together the information i have requested.</p>
    <p>There must be so many different imaginative ways people view their own mind</p>
    <p>Lindsayy</p>
