    html: |-
      <p>I think of memory as a large, muddy field. Your memories are like tracks made by a bicycle. Each track (memory) has a certain shape and location. When you remember something, you ride through the path again. Paths that cross are like when we make associations. Rehearsed memories are deeper, like riding over the same path over and over with the bike. Earlier memories are also deeper because the mud was softer when they were made. The mud in the field tends to harden over time (never completely, unless you get something like Alzheimer’s), making it harder to make new paths. Plus, more experiences you have, the more paths there are, the harder they are to find.</p>
      <p>Anyway, that’s how I visualize it.</p>
