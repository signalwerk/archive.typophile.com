      <p>I’m with Jupiterboy . . . I think of it this way . . .</p>
      <p>There is a default basic logic board that defines basic things like function, and it parses about 5 seconds of thought . . .</p>
      <p>RAM starts as soon as thought becomes action or deeper thoughts and it continues to build until it resets itself and new RAM begins . . .</p>
      <p>Each RAM is then stored in long term memory and is simultaneously categorized and subcategorized . . .</p>
      <p>When active RAM realizes it needs more information, it performs a contextual search first through specific keywords, then subcategories, then categories and weighted results are returned to active RAM as it continues to work on the thought at hand . . .</p>
      <p>I actually drew up a basic schematic for a Human OS after a few days of thinking about this . . .</p>
      <p>That said, I don’t believe there is a need for fragmentation, overloads, etc and that there is simply a never ending container for RAM and that all RAM is compiled RAM meaning we never have to start from scratch thinking about breathing, etc . . .</p>
      <p>I think as we age, the logic board becomes refined and more elegant as well as more defined meaning it prefers not to change and may start to feed back RAM as it is recalled with editorial notations rather than simply being recalled as it precisely happened . . .</p>
      <p>The concept becomes more believable to me as I watch how my children learn and grow . . .</p>
      <p>:D</p>
