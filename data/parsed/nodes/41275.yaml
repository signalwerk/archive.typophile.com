      <p>I view my own memory as an engraving by M.C.Escher of a self-referential cycle feeding back on itself. It’s like a hologram. Cut it in half and something very interesting happens. Instead of two halves of an image you get two complete images each half the size of the original. Cut those two into halves and you get four complete images each one quarter the size of the original. Ad infinitum. It keeps going. Cut it into a thousand pieces and you wind up with a thousand miniature holograms of the complete original scene. Some reduction in resolution is inevitable, but you get the idea. Memory is holographic in structure. All of the information is contained in every part of the brain. This phenomenon has been proven physically true. People who lose part of their brain retain most if not all of their memories, at least as accurately as these things can be measured. Provided you don’t lose a part of the brain critical to normal functioning you continue to remember everything you could remember before the accident reduced the amount of brain material.</p>
      <p>The feedback model is very significant for me, becaws it works just like a rocket engine. There’s a frickin’ turbopump that feeds kerosene (or liquid hydrogen, depending on what kind of brain you got) to the combustion chamber thru the part called the Injector Face, and a do-hickey at the business end taps off some of the power output and feeds it back to the turbopump. The pump then spins a heck of a lot faster, delivering mind-boggling quantities of fuel to the combustion chamber, in turn producing colossal thrust. Yeah! Burn baby burn. When I have a brainwave is<br>
      “much like” when that turbopump kicks in. Wollop.</p>
      <p>One book in my library I love is <em>Metaphors for the Mind — The Creative Mind and its Origins</em> by Colin Murray Turbayne. ISBN: 0-87249-699-6. University of South Carolina Press. Here’s the back cover blurb:</p>
      <p>“The author analyzes the significance of metaphor in human thought by exploring historical traditions of philosophy. Probing into the early philosophies of Plato and Aristotle, Turbayne traces the influence that Platonic metaphors have held for later important philosophers such as Berkeley and Kant. By showing how modern theories of human thought and language (including the substance and attribute theory) arose from the procreation model as presented in Plato’s <em>Timaeus,</em> Turbayne makes a significant contribution in the current philosophical debates concerning relativism/realism. In the discussion, the author restores the model to its original state in which the female and male hemispheres of the mind work as partners to create our world.</p>
      <p>Turbayne, author of <em>The Myth of Metaphor,</em> has once again given us an original concept. Students delving into the sub-conscious of our culture, whether lay or academic readers, will find this book a rich vein.”</p>
      <p>j a m e s</p>
