      <p>My brain is like a giant sponge —- James and the Giant Sponge. I never pay attention, but somehow I absorb massive amounts of information. Sometimes I wake up and I’m not really sure if I’m in the right room, but other than that I’m fine.</p>
      <p>Everything I experience, everything that happens to me causes physical changes in the structure of my brain known as axon modelling. Axons connect themselves to the dendrites of other brain cells. That’s what brain scientists reckon anyway, that there is an actual physical basis for memory.</p>
      <p>Sure. Put money on it ;^)</p>
      <p>I’m a rather average speller and monolinguistic. You see how my mind works—-it’s like a lazaaar! It wants to constantly break down corrupted and atrophied English language spellings.</p>
      <p>Generally I make a conscious effort to exist in a parallel taste-free universe. I try to make connections with the collective consciousness of the 19th and 18th centuries when a lot of things were still sharp and furry. </p>
      <p>Almost a year ago I came very, very close to dying when two arteries inside my brain burst. They repaired the arteries with stents and installed a shunt tube in the rear of my cranium to alleviate fluid pressure on my brain. That makes me part Borg, .05% assimilated. No contact with any Borg cubes yet.</p>
      <p>j a m e s</p>
