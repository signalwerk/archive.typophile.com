      <p><em>Gonna need reading glasses too...</em></p>
      <p>I’m already using those! :-D</p>
      <p>As for my own memory, I am better at remembering faces than names, for example. My father liked to say that he had a photographic memory, and I feel like I am wired the same way. </p>
      <p>On the other hand, and this is why I liked Patty’s response, I too can remember things like the song order (not to mention lyrics!) of certain albums I listened to as a teenager, but forget things I did or read a couple of nights ago. It really does seem that once you have a certain amount of knowledge stored in your memory, there is less “space” (or gray matter) for new stuff. I want an external hard drive!</p>
      <p>Also: a friend of mine and I were wondering the other night about whether having so much info available online makes people less prone to remember things... This friend always remarks that I am good at remembering names of movie directors, writers, actors, etc., but lately, I’ve been stuck on certain ones. Since my use of the Internet has been increasing lately, we were wondering if both things were related.</p>
