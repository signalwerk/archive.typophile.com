    <p>Hi there dear Typophiles, </p>
    <p>does anyone have a picture or a typespecimen of the typeface »Retina« by Hoefler &amp; Frere-Jones and could show it?</p>
    <p>Reason why: Mario Garcia has redesigned the layout of the – where I live – well-known quality-newspaper from Austria <a href="http://www.salzburg.com/epaper/PHP-Files/archivedpages.php" rel="nofollow">»Salzburger Nachrichten«</a>. They now use <a href="http://www.fontbureau.com/fonts/ScotchFB" rel="nofollow">Scotch</a> from David Berlow as copyfont, the italic-weight as lead-typeface in some books and <a href="http://www.identifont.com/show?LY" rel="nofollow">Frutiger</a> from A. Frutiger as headlinetypeface. </p>
    <p>Originally Mr. Garcia wanted to use »Retina« as headline-font, but the people there rejected it and stuck to Frutiger, as used the last couple of years. </p>
    <p>Huh, Retina?</p>
    <p>Haven't found much of this typeface until now. All the previous links from typophile go to 404-sites to H+FJ. Is this Retina-typeface out of business? Could someone show a complete alphabet of it? Please?</p>
    <p>Well, thanks for reading. Even more thanks for answering. ;^D</p>
