  html: |-
    <p>I've been ask to do a New York themed piece as part of a display for a restaurant. I was wondering if any of you out there could help start me off with some ideas for typefaces that say 'New York, New York', maybe some fonts designed by New York based typographers.</p>
    <p>Any help would be appreciated</p>
    <p>Cheers</p>
