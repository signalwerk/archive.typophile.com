    html: |-
      <p>The New Yorker font.</p>
      <p>The real font is called Irvin after Rea Irvin, the original New Yorker art director. The main difference between the fonts like FF New Yorker, Manhattan, and Upper West Side, which are all Irvin look-alikes, is the Q....  Manhattan is from Franklin Type Founders (at Precision Type) and Upper West Side from Intecsas (also at Precision Type).<br>
      --Mike Yanega, <a href="http://typophile.com/node/3728" title="http://typophile.com/node/3728">http://typophile.com/node/3728</a></p>
      <p> Foxtrot Medium is another look-alike. The text font used in the New Yorker is Adobe Caslon.</p>
