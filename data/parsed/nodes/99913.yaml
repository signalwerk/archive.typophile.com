    html: |-
      <p>There's a lot of great stencil typefaces out there, so you need to be more descriptive.<br>
      You say "modern," but that has so many senses to it. </p>
      <p>Eames Century Modern has a stencil, but that might not be the modern you mean:<br><a href="http://www.houseind.com/fonts/eames">http://www.houseind.com/fonts/eames</a></p>
      <p>Contrived is also a bit vague. A stencil font is a contrivance. However, Dala Floda seems to avoid contrivance by making the thins so thin they disappear:<br><a href="http://commercialtype.com/typefaces/dala_floda">http://commercialtype.com/typefaces/dala_floda</a> </p>
      <p>And then there's all these stencils, which are very nice too:<br><a href="https://ourtype.com/#/all-fonts/">https://ourtype.com/#/all-fonts/</a><br>
      (Search Couteau and Bery Script)</p>
