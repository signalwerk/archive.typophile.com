    html: <p>Windows <span class="caps">XP</span> is handling Arabic as Unicode text, but it is possible that some of your applications are not. Question marks generally indicate that an application is unable to recognise the pasted character code. <br><br>You may also have another problem in that some of your Arabic fonts may not themselves use Unicode encoding. This would explain why changing fonts from Arial, which is a Unicode font, to another font might not work. <br><br>In order to handle Arabic in Illustrator, you would need the Middle East version of that application. The regular version does not support right-to-left text or Arabic script shaping. <br><br>Since you don’t need to handle text per se, one easy option might be to make a custom font using a hacked 8-bit encoding, e.g. putting Arabic glyphs in <span class="caps">ANSI</span> Latin decimal positions, and then enter the characters manually in Illustrator. You could do this with the relatively cheap&nbsp;TypeTool.</p>
