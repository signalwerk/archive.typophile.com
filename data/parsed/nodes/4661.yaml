    html: <p>Maybe you could just copy paste the outlines from the glyph windows into illustrator, and then just assemble the words there. You could typeset the text in Word just to see what it looks like (that is if you're not familiar with the language). You'll also need to watch out for the alignments of certain characters since some of them don't sit on the baseline. <br> <br>I think this would be simpler than building a new font but I wouldn't know if you would be violating any copyright laws with this or not. You will probably need to make certain adjustments to the outlines (especially the baseline strip) if you want the text to sit on a circle. </p>
