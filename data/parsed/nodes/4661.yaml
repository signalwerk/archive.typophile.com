  html: "<p>I have Windows XP Home with Arabic Languge turned on, and thus can copy/paste Arabic words from an online English &gt; Arabic word translation sites and see Arabic on websites via IE 6 browser, HTML files, and even Outlook Express.   <br>  <br>For example, copy/pasted into Outlook Express, Arabic words show as being \"Arial\" font.   <br>  <br>But if I change font, it all turns to \"?????? , ????????\".  <br>  <br>The same thing happens when I copy words from where I can see the Arabic (such as \"Arial\" within Outlook Express), then paste them into Adobe Illustrator (8.x) or Corel PhotoPaint (7.x). <br> <br>[I know, I know... old versions of programs, but I live on a tight disability income and cannot afford to upgrade.] <br>  <br>I DO have WP Arabic and one or more True Type Arabic fonts, but I still get the \"?????....\" etc. <br>  <br>I only need to include a handful of Arabic words for a logo, not create documents or webpages in Arabic.  I need to do this in Illustrator for I they have sit/be on the outline or spine of an invisible circle created with Bezier. <br> <br>_______________ <br>  <br>&gt;&gt;&gt; Q: Is there any way to work around this obvious code problem, font language, or whatever without having to resort to buying software, expensive fonts, and so on?   And which type of font types WOULD work in Illustrator (TT, PS, Open, or...?). <br> <br>I'd like to be able to also do such in PhotoPaint, but at worst, I can always rasterize the .bmp logo + type in Illustrator.   <br> <br>_______________ <br>  <br>Any advice, suggestions, rand/or eferrals at earliest onvenience very much appreciated. <br></p>"
  html_clean: "<p>I have Windows XP Home with Arabic Languge turned on, and thus can copy/paste Arabic words from an online English &gt; Arabic word translation sites and see Arabic on websites via IE 6 browser, HTML files, and even Outlook Express.   <br>  <br>For example, copy/pasted into Outlook Express, Arabic words show as being \"Arial\" font.   <br>  <br>But if I change font, it all turns to \"?????? , ????????\".  <br>  <br>The same thing happens when I copy words from where I can see the Arabic (such as \"Arial\" within Outlook Express), then paste them into Adobe Illustrator (8.x) or Corel PhotoPaint (7.x). <br> <br>[I know, I know... old versions of programs, but I live on a tight disability income and cannot afford to upgrade.] <br>  <br>I DO have WP Arabic and one or more True Type Arabic fonts, but I still get the \"?????....\" etc. <br>  <br>I only need to include a handful of Arabic words for a logo, not create documents or webpages in Arabic.  I need to do this in Illustrator for I they have sit/be on the outline or spine of an invisible circle created with Bezier. <br> <br>_______________ <br>  <br>&gt;&gt;&gt; Q: Is there any way to work around this obvious code problem, font language, or whatever without having to resort to buying software, expensive fonts, and so on?   And which type of font types WOULD work in Illustrator (TT, PS, Open, or...?). <br> <br>I'd like to be able to also do such in PhotoPaint, but at worst, I can always rasterize the .bmp logo + type in Illustrator.   <br> <br>_______________ <br>  <br>Any advice, suggestions, rand/or eferrals at earliest onvenience very much appreciated. <br></p>"
