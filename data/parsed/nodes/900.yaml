  html: |-
    <p>This is my first post on typophile. I've frequented the boards for some time, and am a great fan of many of the designers here. What a community! <br> <br>I've been building a type catalog for my upcoming pixel font foundry for a long time, but have in general, been reluctant to throw my work into the mix. <br> <br>You see, what I don't know about typography, is a lot. <br> <br>But I do enjoy creating character sets. So, I think it's time I just get over it and show some of my work. I am all too aware of the gains to be had by joining the community, both in general knowledge, and in the quality of my own critiqued work. <br> <br>My only concern is that I don't have to offer what the community has to offer me</p>
