    html: <p>Tiffany, thanks for your suggestions. I've read your critiques on other threads for some time, and am thankful you signed on to mine. you always have good insights to offer. Here are two lighter weights to examine. The font, as a whole, starts to break down the lighter the weight gets. Proportionally, I mean. Extra Light needs the descenders to be shortened, I think, but then I encounter point size conflicts with Light and Regular. Take the m for example. Its acenders had to be compromised to keep them from touching tip to tip. They're now one pixel shorter than the rest of the characters. <br> <br>Miguel, I never thought of the Iron Maiden reference, but now that you mention it, I can picture it perfectly! <br> <br>Thanks for your post. <br> <br><img src="http://www.typophile.com/forums/messages/29/14185.gif" alt=""> <br><img src="http://www.typophile.com/forums/messages/29/14186.gif" alt=""></p>
