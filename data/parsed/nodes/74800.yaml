  html: |-
    <p>This is a tough one.<br>
    Anyone know how this effect is achieved?<br>
    From the images it appears there is a transparent sleeve (acetate) printed with fine vertical lines. Same for the inside paper card.<br>
    But how is it that the text disappears inside the card? Hard to figure out without the real thing, but if anyone has seen such a thing up close, please explain! :)</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/sag1_4459.jpg"></div><br>
