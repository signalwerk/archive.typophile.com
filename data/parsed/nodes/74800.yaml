    html: <p>Maybe the white lines on the outer sleeve is actually opaque and not transparent? And the black is semi-transparent? That's amazing. I haven't paid much attention to it, thinking it was just the usual moire. Should've known, it's Stefan.</p>
    html_clean: <p>Maybe the white lines on the outer sleeve is actually opaque and not transparent? And the black is semi-transparent? That's amazing. I haven't paid much attention to it, thinking it was just the usual moire. Should've known, it's Stefan.</p>
  - id: 432132
    user: 6470
    date: 2010-10-01T10:23:00
    date_raw: 1 Oct 2010 — 10:23am
    votes: null
    html: "<p>If you look closely at the top photo, it appears that the type is on the substrate (card) and that at least the inner sleeve is transparent. If the white lines on the outer sleeve were opaque, what's going on in the right-hand side of the top picture and everywhere in the bottom picture would not be possible. More likely, the \"similar to Focal Decoder\" argument is correct: the sleeves are actually lenticular lenses which only allow the image on the subtrate to show when they are in perfect register. Or not...</p>"
    html_clean: "<p>If you look closely at the top photo, it appears that the type is on the substrate (card) and that at least the inner sleeve is transparent. If the white lines on the outer sleeve were opaque, what's going on in the right-hand side of the top picture and everywhere in the bottom picture would not be possible. More likely, the \"similar to Focal Decoder\" argument is correct: the sleeves are actually lenticular lenses which only allow the image on the subtrate to show when they are in perfect register. Or not...</p>"
