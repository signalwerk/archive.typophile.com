  - id: 294132
    user: 1014
    date: 2008-08-08T00:02:00
    date_raw: 8 Aug 2008 — 12:02am
    votes: null
    html: |-
      <p>some fonts, such as Bickham Script, doesn't work well because it has delicate pothooks that connect on both right and left side of a glyph.</p>
      <p>Radio, from Magnus Rakeng, has a thicker, right-side-only pothook that joins at the stem.</p>
      <p>So Radio seems to work fairly well. (<a href="http://www.vllg.com" title="www.vllg.com">www.vllg.com</a>)</p>
      <p>It can never hurt to try some lettering — gives you the advantage of customizing each particular letter combination.</p>
      <p>best of luck.</p>
