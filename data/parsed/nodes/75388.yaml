  html: |-
    <p>Hi,</p>
    <p>I was wondering if anyone here knows an alternative to Isonorm (<a href="http://www.fontspring.com/search?q=isonorm" title="http://www.fontspring.com/search?q=isonorm">http://www.fontspring.com/search?q=isonorm</a>), which is suited to my application but slightly too condensed and only available in one weight. I'm using it as a web font and the browser automatically boldens it when required, but it doesn't kern well when this happens. I'm using the font at 12px, 14px and 32px mostly.</p>
    <p>Some alternatives I've seen are:<br>
    Patron: <a href="http://www.fontspring.com/search?q=patron" title="http://www.fontspring.com/search?q=patron">http://www.fontspring.com/search?q=patron</a><br>
    Unicod: <a href="http://www.fontspring.com/search?q=unicod" title="http://www.fontspring.com/search?q=unicod">http://www.fontspring.com/search?q=unicod</a></p>
    <p>I would appreciate your advice on the legibility and scalability of these fonts (and any similar you know of) and which one you consider the best.</p>
