    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 28.Aug.2003 10.12am </div>
      <p>Hello everyone, <br> <br>On Friday, September 26th in Vancouver we will have our 2003 ATypI Auction, an event that everyone looks forward to. The Auction is an important way in which ATypI raises money to pay for our publications/website, as well as being a wonderful way to buy type treasures provided by friends of ATypI. <br> <br>Please bring your auction item(s) with you to the Conference, and give it to the organizers when you arrive. If you are not attending, but still wish to send something, please give it to someone who is attending to bring for you. (Contact us if this presents a problem for you). Items will be accepted on site in Vancouver up to the last minute, however it would help very much to have the information about your donation as soon as possible. <br> <br>Please feel free to forward this message to anyone you think would be interested in participating. <br> <br>If you are planning to bring or send any items for the Auction, please send the information below to <a href="mailto:atypi@typofonderie.com">atypi@typofonderie.com</a>. We will compile a complete list of items and then will distribute the list via e-mail prior to the start of the conference, and possibly again showing late arriving items after the start of the conference. Again, if you are unable to attend the Conference and wish to send your items, please specify this in your email so that we can make arrangements. <br> <br>Name of Donor <br>Name of Item <br>Brief Description <br>Brief statement about the item that may be of interest – i.e., how you came to have it, significance of the item, or special notes that will help bidders appreciate it‘s importance. <br> <br>All messages to the auction mailbox (<a href="mailto:atypi@typofonderie.com">atypi@typofonderie.com</a>) will be acknowledged indeed. <br> <br>Please feel free to give as many items as you like for this event, anything type related, from rare specimens, to T-shirts, wood type, drawings, etc, Your participation through donating Auction items makes this event possible, and great fun for everyone. We thank you very much! <br> <br>Sincerely, <br>Tiffany Wardle and Jean François Porchez <br>Auction Organizers for ATypI Vancouver 2003 <br><a href="mailto:atypi@typofonderie.com">atypi@typofonderie.com</a> <br><a href="http://www.atypi.org/40_conferences/28_Vancouver/30_other_events" target="_blank">http://www.atypi.org/40_conferences/28_Vancouver/30_other_events</a></p>
