    html: <p>You could also see <a href="http://www.veer.com/products/typedetail.aspx?image=LFT2354400" target="_blank">Phoenikia</a> from Letraset, or <a href="http://www.unifonts.com/intropag/p_intro.htm" target="_blank">Pompeia</a> (serif or sans) from Unifonts. <br> <br>These probably fit the cliche category, but I think at least these avoid the pseudo-Greek Latin lettering of Acropolis at P22.</p>
