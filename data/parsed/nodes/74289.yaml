  - id: 430241
    user_id: 2462
    user_name: cerulean
    user_path: null
    date_raw: 19 Sep 2010 — 4:30pm
    date: 2010-09-19T16:30:00
    votes: null
    html: <p>Look, here's how you do it. Make a whole, solid vertical that will be the left stem of the R and the left stem of the D. Connect it at the top of the R and the top of the D. Leave the bottom of the D open (but not too open) to keep the T separate, and, of course, the bottom of the R will be open to keep the E separate. A reader's grouping of shapes into letters is biased toward the cues at the top.</p>
