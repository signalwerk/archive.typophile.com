    <p>Hi, <br>I'm new to this board and fairly new to all the intricacies of typography. I don't know if this sort of thing will annoy you (or just be ignored) and I apologize in advance if it does.  <br>I am redesigning a hospital consent form for one of my classes. I really want to do an excellent job, but am having problems choosing a font for it. Right now I am using Optima and Minion Pro. It needs to be exquisitely legible, while at the same time non-threatening and comforting. I would be so grateful for any ideas.</p>
