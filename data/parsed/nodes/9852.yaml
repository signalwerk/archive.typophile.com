    html: <p>I agree with the others. <br> <br>Also, I'd move the main body of info away from the top block of info on the front page. One more unit down, where a unit equals the space between two rules. 'Initial' gets kind of lost over there on the far right. <br> <br>It might not hurt to repeat 'initial' in grey or a lighter weight, they way 'date' is repeated on the back. It's just less ambiguous.</p>
