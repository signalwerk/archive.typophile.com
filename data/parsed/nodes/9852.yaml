    html: <p>The fonts work okay for a medical form but I think you have a design problem with your rules.  <br> <br>You're trying to use the rules as field for intials and as a divider between sections. It's confusing and makes the seperation feel uncomfortable. A quick fix would be to increase the spacing above each section, between the type and the extra wide rules. Also, the spacing between the rules and type above them is too much, and it's applied inconsistantly. The space below "Relationship to Guardian" feels good, try using that for everything.</p>
