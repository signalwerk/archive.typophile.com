      <p>Just to clarify, there do not exist separate Mac and Windows versions of OpenType fonts. There exist OpenType fonts with TrueType outlines, and OpenType fonts with PostScript style outlines; both flavors are cross-platform font files.</p>
      <p>As a side note, the dividing line between OpenType fonts with TrueType outlines and Windows TrueType fonts is very thin indeed, and one often doesn't even need to make a distinction between the two.</p>
      <p>Cheers,</p>
      <p>T</p>
