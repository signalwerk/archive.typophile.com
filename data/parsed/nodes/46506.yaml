      <p>Yes, Mac OSX supports the following font types:</p>
      <p>    * OpenType (both Mac and Windows formats)<br>
          * PostScript Type 1 (Mac only)<br>
          * PostScript Multiple Master (Mac only)<br>
          * TrueType (both Mac and Windows formats)<br>
          * dFont (data fork TrueType) (Mac only) </p>
      <p>OS9 did not support all of these, so you are now free to use your windows truetype files.</p>
