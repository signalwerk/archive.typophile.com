    <p>Hi all,</p>
    <p>I'm finally biting the bullet and buying a Mac.</p>
    <p>Problem: While I've slowly bought up quite a few OpenType fonts over the last couple of years, I still have a fair number of TrueType fonts that I'm quite fond of.</p>
    <p>I know there are a million threads and sites out there explaining the differences between PC and Mac fonts. I have actually tried to read as many of them as I can, but my brain is just overloaded right now. So, please, just pretend I'm a five-year-old and dumb it down for me! :)</p>
    <p>1. Is there a free way to continue using those TrueType fonts on a Mac? I read somewhere that if you rename TrueTypes as OpenType they'll keep working, but somehow that sounds too simple to be right...</p>
    <p>2. If not - what's the easiest solution? Use TransType pro to convert everything to a Mac format or OpenType?</p>
    <p>Sorry if this is a 'dummies' level question - I have never been good at comprehending technical information and I'm feeling a bit lost at the moment, lol. Thanks. :)</p>
