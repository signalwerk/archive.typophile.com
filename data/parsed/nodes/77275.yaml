    <p>OurType are currently offering four of their fonts free of charge.</p>
    <p><strong><a href="https://ourtype.com/#/try/monitor/" rel="nofollow">Monitor OT Normal &amp; Monitor OT Bold</a></strong> | Fred Smeijers</p>
    <p>Designed by Fred Smeijers in 2000, Monitor was initially designed in two weights only: normal and bold. These two Monitor sanserif fonts were originally custom-designed for office and on-screen use. Since 2002, when OurType made Monitor fonts available to a wider audience, numerous requests for extra weights have followed.</p>
    <p>In 2004 Fred Smeijers expanded it into a mature family in order to make it more suitable for a wider use. Now Monitor is a complete sanserif family, able to meet general demands. The two weights have been expanded to seven: thin, light, normal, semibold, bold, black and extra black. These weights have matching italics, and well as Condensed variations.</p>
    <p>Monitor is available in TrueType &amp; PostScript formats, for both PC and Mac platforms, as well as in OpenType Standard and Pro. The original two Monitor weights are still available in hand-hinted TrueType format.</p>
    <p><em>Until tomorrow, Friday December 17, 2010, the two original weights Monitor Normal &amp; Monitor Bold are available free of charge in OpenType format with a full licence (includes the right to use OurType fonts in websites (@Fontface, Cufón, sIR) and editable embedded PDF files).</em></p>
    <p><strong><a href="https://ourtype.com/#/try/fakt/" rel="nofollow">Fakt Pro Blond &amp; Fakt Pro Blond Italic</a></strong> | Thomas Thiemich</p>
    <p>Fakt, designed by Thomas Thiemich, is a highly functional sanserif. It is Theimich's second typeface for OurType, following his Alto design, a humanist sanserif.</p>
    <p>Different from Alto, whose design speaks of the 1990s, Fakt revisits archetypal sanserifs of earlier decades: Miedinger and Hoffmann's Neue Haas Grotesk / Helvetica (the 1950s) and Renner's Futura (the 1920s). Fakt combines the best of each – of grotesk and geometrical sanserif traditions – but not by mere interpolation. Instead, it offers a stylistic 'toggle' – to put it crudely: on one hand - a neutral grotesk, on the other - a geometrical sans. Switch to the stylistic alternates and letter shapes are subtly changed, altering Fakt's mood. The result is a double design that in each style is well balanced and refined.</p>
    <p>Fakt is a child of its time, offering choices efficiently and in an accessible way. It is a well behaved child but also a clever one, respectful of its sanserif parents while bringing them new joy. Fakt's designer Theimich views tradition from the present, and so has updated the past using today's tools and techniques with intelligence and cunning. </p>
    <p>A fine pick for posters, magazines or art catalogues, digital applications or new corporate environments, Fakt brings a subtle modern perfume to this genre of sanserif design. </p>
    <p>Fakt consists of ten weights of roman and italic designs, built around three widths. The family features an extended range of thin weights, including the ethereal and never-before-seen 'Air'. The standard character set (STD) comprises small caps and basic sets of figures, as well as the stylistic alternates' set. The pro character set (PRO) includes small caps; lining, old style and small cap figures (each in tabular and proportional widths); fractions; comprehensive superiors, inferiors, nominators and denominators; case sensitive punctuation sets; mathematical and monetary symbols; arrows; standard and discretionary ligatures; stylistic alternates' set; and a complete range of accents covering all (Latin script based) Western, Central and East European languages. </p>
    <p>Released by OurType in 2010, Fakt is available in OpenType STD and PRO.</p>
    <p><em>For an as-of-yet undefined limited period of time the two weights Fakt Pro Blond &amp; Fakt Pro Blond Italic are available free of charge in OpenType Pro format with a full licence (includes the right to use OurType fonts in websites (@Fontface, Cufón, sIR) and editable embedded PDF files).</em></p>
