  html: |-
    <p>This was lurking at the back of a catalogue of Islamic calligraphy that I picked up at <a href="http://www.samfogg.com/" rel="nofollow">Sam Fogg</a> in London a few years ago. I hadn't noticed it until yesterday. The catalogue says it is probably Nigerian, from the early 20th Century: one page from a prayer book of 60 folios with four lines per page, all in this wonderful polychromatic style.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/nigerian_4994.jpg"></div><p></p>
