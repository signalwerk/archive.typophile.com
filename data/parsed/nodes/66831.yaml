      <p>Cześć Ewelina,<br>
      welcome to Typophile!</p>
      <p>Obviously, both styles are hand-lettered.<br>
      For ‘Kajko I Kokosz’, you might find something similar at these sites dedicated to comic lettering fonts:<br>
      <a href="http://www.blambot.com/fonts.shtml" rel="nofollow">Blambot</a><br>
      <a href="http://www.comicraft.com/fonts/" rel="nofollow">Comicraft</a>/<a href="http://www.comicbookfonts.com/fonts" rel="nofollow">Comic Book Fonts</a><br>
      For example, <a href="http://www.blambot.com/font_boogers.shtml" rel="nofollow">Boogers</a> is not that different.</p>
      <p>‘Festiwal Czarownic’ is more difficult. It looks a bit like an exaggerated <a href="http://www.stormtype.com/typefaces-fonts-shop/families-72-pivo" rel="nofollow">Pivo</a>.<br>
      F</p>
