    html: |-
      <p>I think it's very unfortunate that graphic designers aren't properly being taught typography. I'm currently in my first year at the art academy again (initially in 2007) and there's barely any typography education to speak of, and what's still there is disappearing. It's even disappearing at the Royal Academy of Arts in The Hague, which has always been known for its typography courses along with the university of Reading.</p>
      <p>I'm not insinuating your question is invalid though. I still ask the same questions despite having studied typography for years. I'm just saying type doesn't get the attention it deserves in the educational systems, and as such most graphic designers don't learn the value.</p>
      <p>Are you looking for typefaces like Proxima Nova and Gotham or were these recommended? Incidentally I'm working on a custom typeface for a company that is currently using Proxima Nova for their presentations to clients but would like to replace it with my design. Proxima Nova works very well for them though.</p>
      <p>As you mentioned Proxima Nova and Gotham I'm assuming you're looking for a clear, legible sans with a bit more character. Something like <a class="freelinking external" href="http://www.myfonts.com/fonts/okay-type/alright-sans/" rel="nofollow">Alright Sans</a> perhaps?</p>
