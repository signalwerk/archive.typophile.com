      <p>"There are some that will argue that you can learn the basics in a tutorial or in a book but then why am I paying all that money to go to school?"</p>
      <p>This is actually what bothers me about the education system in most countries. Most of the things I know I came to know because I studied it myself. School provides an environment where you're being pushed to learn new things but I expect the teachers to present a lot more information than they do. Particularly typography is undervalued I think. This is partially evident by the fact that I know a lot more about typography than most of my teachers. I've had basic typography classes but I taught about 95% myself. I think I would much rather be someone's apprentice like the olden days and really specialise in something rather than the current educational system.</p>
      <p>A few more suggestions: <a class="freelinking external" href="http://www.myfonts.com/fonts/northernblock/corbert/" rel="nofollow">Corbert</a>, <a class="freelinking external" href="http://www.myfonts.com/fonts/ahmet-altun/halis-gr/" rel="nofollow">Halis Grotesque</a> and <a class="freelinking external" href="http://www.myfonts.com/fonts/niramekko/guanabara-sans/" rel="nofollow">Guanabara Sans</a>.</p>
