    html: |-
      <p>Hi Martin, </p>
      <p>I agree in some ways. I've definitely learned the value of typography and it's being taught at my school (two levels before graduating), but just don't think I've been taught it thoroughly enough. I've had some great teachers and picked up a lot from their crits of mine and other students' work but they don't teach you fundamentals before sending you off to start working. Everything is just too based on crits and not enough on teachers doing their own presentations. There are some that will argue that you can learn the basics in a tutorial or in a book but then why am I paying all that money to go to school? </p>
      <p>I looked at Proxima Nova because I was looking up what fonts are the easiest to read (since I'll have a version of my portfolio that is a PDF) and read an article that said it was one of the easiest. Gotham was just an instinctive choice. Alright Sans is a good suggestion! Thanks!</p>
