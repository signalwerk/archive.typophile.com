    <p>Hi, </p>
    <p>I'm in the process of putting together my portfolio in preparation for graduating with a Graphic Design degree in May. Does anyone have suggestions regarding typefaces to use for the body text (to explain the work) for the PDF version I create which I will use to e-mail (if asked for in addition to website) potential employers? </p>
    <p>I'm looking for an extremely legible screen font but that also has character. I don't need to worry about print too much because it would be a rare occurrence that someone would print it out. I've read that Proxima Nova is a great screen font, but I don't feel like it adds enough in the way of giving the presentation a personality. I've tried Gotham, and though its a great typeface I am not loving it in this context. </p>
    <p>Any suggestions would be greatly appreciated. </p>
    <p>Thanks!</p>
