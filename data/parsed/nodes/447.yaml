    html: <p>This is "spiking" caused by having an inordinate number of points in each character, or by having points on top of points (sometimes consecutive, sometimes not). The way to get rid of spiking is to drastically reduce the number of vertices in your outlines, and especially make sure that there aren't any points sitting on top of each other. <br> <br>Often the spiking disappears when printing, or when anti-aliased, as you mention. But it's not a sure thing, by any means. Spiking can show up in printed documents at unpredictable times. <br> <br>Alan</p>
