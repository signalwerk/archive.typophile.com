    date_raw: 24 Jun 2003 — 3:09pm
    votes: null
    html: <p>I always try to stay under 300, even that is extremely rare and really pushing it. Thought it's my understanding that the real limit is around 1000 points. <br> <br>If you select the outlines in FontLab and right-click, then go to "Properties", it will tell you how many outlines and points you have selected. Or if nothing is selected, you'll get window showing more info about the character, which also includes the number of points in the glyph (the first number in the upper left part where all the little numbers are). <br> <br>You can also turn on FontAudit in FontLab to see if there are any point sitting on top of each other. <br> <br>Alan</p>
    html_clean: <p>I always try to stay under 300, even that is extremely rare and really pushing it. Thought it's my understanding that the real limit is around 1000 points. <br> <br>If you select the outlines in FontLab and right-click, then go to "Properties", it will tell you how many outlines and points you have selected. Or if nothing is selected, you'll get window showing more info about the character, which also includes the number of points in the glyph (the first number in the upper left part where all the little numbers are). <br> <br>You can also turn on FontAudit in FontLab to see if there are any point sitting on top of each other. <br> <br>Alan</p>
