    html: <p>Thanks, Alan! <br> <br>Do you know how many points is a good limit to prevent spiking? <br> <br>And does anybody know if FontLab can report the number of points in a glyph? <br> <br>Cheers.</p>
    html_clean: <p>Thanks, Alan! <br> <br>Do you know how many points is a good limit to prevent spiking? <br> <br>And does anybody know if FontLab can report the number of points in a glyph? <br> <br>Cheers.</p>
  - id: 2865
