    html: "<p>After all, I found that 95% of the time, the spikes would go away when I deleted these tiny little shapes with very few points.  <br> <br>Maybe it has to do with the tiny angle of the curve handles? <br> <br>Here's an example: <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/12310.gif\" alt=\"image of tiny problem-causing shape\"></p>"
