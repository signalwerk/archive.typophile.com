  html: <p>Hi folks! I am looking for a bit more information on Postscript drawing to help me troubleshoot my current font. <br> <br><img src="http://www.typophile.com/forums/messages/4101/12179.gif" alt="Here's a picture of the problem."> <br> <br>As you can see, I have a few long, thin, unwanted lines across a few glyphs, i.e., 2, 7, 0, A, B, F, G, H, Q, R, U, W, X, Y, Z. Somewhere I picked up that those are called 'rays'. <br> <br>I understand that rays can be caused by open paths, overlapping points, lack of extrema or crossing BCP handles, but I can find none of those things in these (albeit extremely complex) glyphs. <br> <br>Anything else I can look for to fix? <br> <br>Thanks in advance! <br> <br>p.s. When printed or rendered anti-aliased, they disappear, but of course I want them to look right everywhere, y'know? <br></p>
  html_clean: <p>Hi folks! I am looking for a bit more information on Postscript drawing to help me troubleshoot my current font. <br> <br><img src="http://www.typophile.com/forums/messages/4101/12179.gif" alt="Here's a picture of the problem."> <br> <br>As you can see, I have a few long, thin, unwanted lines across a few glyphs, i.e., 2, 7, 0, A, B, F, G, H, Q, R, U, W, X, Y, Z. Somewhere I picked up that those are called 'rays'. <br> <br>I understand that rays can be caused by open paths, overlapping points, lack of extrema or crossing BCP handles, but I can find none of those things in these (albeit extremely complex) glyphs. <br> <br>Anything else I can look for to fix? <br> <br>Thanks in advance! <br> <br>p.s. When printed or rendered anti-aliased, they disappear, but of course I want them to look right everywhere, y'know? <br></p>
