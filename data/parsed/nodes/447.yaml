    date_raw: 29 Jun 2003 — 9:03pm
    votes: null
    html: <p>That's one good way to prevent the spiking. Too many of those tiny shapes might be more than the rasterizer can handle. <br> <br>But also look at the structure of that little shape. It's breaking a few of the rules for Bezier drawing, so that could be it, too. It also looks like one of its points is sitting on top of a point on the other path. <br> <br>Ultimately, I think the idea is that Type 1 fonts weren't meant to be so incredibly complicated, so it sometimes freaks out when you push it too far. <br> <br>Alan</p>
