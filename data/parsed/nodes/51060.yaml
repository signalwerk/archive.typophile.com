  html: |-
    <p>Recently, many done for the rally,<br>
    and decently as icons and rally signs have not seen anywhere else.<br>
    It decided to make a special character font.<br>
    And now decided to share it with all</p>
    <p><img src="/sites/default/files/old-images/Rally_Symbols-2_3740.gif"></p>
    <p>font contains the following:<br>
    1. Standard signs of control in rally<br>
    2. The icons that have helped create in the infographics, schemes rally routes<br>
    3. Blanks for the design of logos and other graphics<br>
    4. Symbols for signs Legends (transcript)<br>
    5. Other symbols and marks</p>
    <p>Font is Free, you can download here:<br><a href="http://www.2d.lviv.ua/uploads/media/Rally_symbols.zip">http://www.2d.lviv.ua/uploads/media/Rally_symbols.zip</a></p>
