      <p>I don't think buying a font a glyph at a time is akin to buying an album a song at a time. It's more like buying a song an instrument at a time. For the song to 'work', all the instruments have to be there. I'm not suggesting a font without a paragraph mark or Euro symbol etc. is useless, but implementing this will be a massive task - taking out glyphs from fonts depending on the order - kerning and OpenType coding etc. would all need to be altered.<br>
      As a model for selling fonts, this can only really work with display type, and not by purchasing glyphs to put into a font, but by purchasing a word or sentence, to be delivered as an EPS or suchlike. This business model is already covered by Photo Lettering from House Industries.</p>
