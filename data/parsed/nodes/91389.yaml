      <blockquote><p><strong>daverowland:</strong> I don't think buying a font a glyph at a time is akin to buying an album a song at a time. It's more like buying a song an instrument at a time. For the song to 'work', all the instruments have to be there. I'm not suggesting a font without a paragraph mark or Euro symbol etc. is useless, but implementing this will be a massive task - taking out glyphs from fonts depending on the order - kerning and OpenType coding etc. would all need to be altered.</p></blockquote>
      <p>Dave, you're absolutely right. Implementing this <em>was</em> a massive task. It took months of careful programming to create the algorithm that produces abridged font files. In a nutshell, the algorithm analyzes each line of the original font file and determines what type of information it contains. The algorithm won't even consider altering the line unless it contains spline data, which is the only data within a font file that is absolutely necessary to reproduce the shape of a particular glyph. If a user has rights to a certain glyph, then the spline data is left untouched. If a user doesn't have rights to a certain glyph, then the spline data is removed. All other information (including kerning and OpenType data) is left untouched. As long as the user has rights to the necessary glyphs, all OpenType functionality will remain intact.</p>
      <blockquote><p><strong>daverowland:</strong> As a model for selling fonts, this can only really work with display type, and not by purchasing glyphs to put into a font, but by purchasing a word or sentence, to be delivered as an EPS or suchlike. This business model is already covered by Photo Lettering from House Industries.</p></blockquote>
      <p>You make a great point about display type; FontSlice will certainly be the distributor of choice when users are typesetting display copy, which often only comprises a few words. However, assuming the user is able to predict which character ranges would be required for a particular application, there's no reason why FontSlice wouldn't be used in applications involving larger amounts of text. The abridged fonts produced by the FontSlice algorithm are identical in every way to the original file, save the missing spline data for unlicensed glyphs. Like any font file, they can be installed on your operating system and used in any software application; there's no need for EPS files.</p>
