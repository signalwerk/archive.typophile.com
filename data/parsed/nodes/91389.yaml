      <p>Thanks for the great question. Depending on your internet connection, it should only take about 15 seconds to find and download an upgraded version of an abridged font. When you enter the new headline, FontSlice will automatically determine which glyphs you've already purchased and which glyphs you haven't. The system will also allow you to maintain an account balance, so you won't have to pull out your credit card every time you purchase or upgrade an abridged font. When you install the upgraded version, it will immediately overwrite the previous version and you'll be ready to go.</p>
