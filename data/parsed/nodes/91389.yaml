      <p>I see a couple of problems with this model from the end-user standpoint:</p>
      <p>In the graphics world, we frequently have just a few minutes to make client changes and provide new proofs. So if we have a headline which the client has changed the wording on but we don't have the necessary glyph(s) to make the change, do you intend to offer virtually instantaneous service to enable us to provide the same level of service our customers are used to?</p>
      <p>Sometimes the client is sitting in the office waiting on the changed proof because the timing is so critical to them. No one wants to tell a client they will have to wait; it's not good for business.</p>
      <p>Given just this one issue, I don't believe I would take advantage of this service. I would continue to buy the complete font or family.</p>
      <p>Overall I'm not sure this is a good idea; it's not tunes one is buying for personal use, it's a necessary product for businesses to provide their service with.</p>
