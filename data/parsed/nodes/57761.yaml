      <p>If I can try to answer your question about ’descriptive title’, in addition to what it says in the <a class="freelinking-external" href="http://typophile.com/forum/typeid/faq/#Q_2FAQ">FAQ</a> about title, the main reason for wanting this is because the people who are trying to help you don’t know which thread to look for when they think they found an answer, if all the thread titles say something like “help identify this font”.  If this thread was called “AIR - WORLD’S LARGEST” we would all know which one to come back to with our answer.</p>
      <p>We don’t always get the answer at first glace, and so sometimes we have to go hunt for a while and then come back and try to find the thread. I can’t tell you how many times I have had to search through the posts looking for the one I found an answer for, but couldn’t find because there was nothing about the title that told me which problem I was answering. </p>
      <p>- Mike Yanega</p>
