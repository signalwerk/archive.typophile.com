      <p>What Mike said.<br>
      a) Try to describe the letterforms. In this case, something along the lines of ‘decorated caps with stars, stripes, bulges; Wild West/Circus style.<br>
      b) Mention the source, date and media (if known). Could be ‘Mumbai leaflet’ or ‘French poster from the 1970s’ or ‘Headline type on www.example.org’.<br>
      c) Always helpful, in addition to a) and b): Type out the literal letters/lines in your sample: ‘AIR - WORLD’S LARGEST’.<br>
      Thanks!</p>
