      <p><cite>But does anyone have an opinions as to why none of these tools really became essentials?</cite></p>
      <p>Because the people who create them usually don’t even understand how most type designers work. So something really brilliant like LivePen comes out as a Windows-only Illustrator plugin. But at least FontLab was able to buy it, and hopefully it will turn up in a future version of FontLab sometime around 2025.</p>
