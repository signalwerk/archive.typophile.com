    votes: null
    html: |-
      <p>I just tested this tool briefly and was quite disappointed:</p>
      <p>1. I could not find any setting that allows to draw with a broad-nib pen.</p>
      <p>2. Also, there is no setting that controls the transition between thin and thick, it is always linear.</p>
      <p>In that sense, it is far inferior to Kalliculator. None of the Noordzijan logic implemented.</p>
      <p>Of course, you can do all this by making up the letter with lots of individually adjusted nodes but then that is not quicker than drawing the contours straight away.</p>
      <p>As I said, that was just a quick test, maybe I missed something.</p>
