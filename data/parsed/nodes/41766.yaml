    html: |-
      <p>The main problem seems to me that once you have made the step from calligraphic drawing to contours you cannot go back.</p>
      <p>This means that you either have to develop the whole typeface with the calligraphy tool, which would be difficult if you cannot actually typeset (does Live Pen export fonts?).<br>
      Or, you would make the step to contours at some point but then you loose the advantage of making calligraphic adjustments unless you go back again, convert again and so on.</p>
      <p>Ideally, you should have a tool that controls stroke weight and transitions according to a calligraphic logic but is implemented on the basis of outlines in the first place (and in FL, of course). That would allow you to work in both 'modes' at the same time.</p>
