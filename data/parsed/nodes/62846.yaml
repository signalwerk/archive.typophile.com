  html: |-
    <p>We have just released Paveline on <a class="freelinking external" href="http://new.myfonts.com/fonts/gatf/paveline/ "> Myfonts.com</a>.  </p>
    <p>Paveline is a punctuated script; by which we mean it has the look and character of handwriting, but the glyphs are discrete entities to aid legibility. It is actually based on a moderately stylized adaptation of our chief designer’s handwriting. Use it to give a handwritten touch to your work. Paveline works well as small handwriting or large scale poster captions.  You can see some more samples of Paveline in action on our <a class="freelinking external" href="http://gatf.wordpress.com "> blog</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/31234_5327.png"></div><p></p>
