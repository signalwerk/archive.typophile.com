  html: |-
    <p>I've developed a logo concept for a cute/quirky custom stationery company that focuses on custom birthday invitations, birth announcements, holiday greetings, etc. The main theme behind the company is to celebrate the little things in your big life. The central theme of the product is based on family events. </p>
    <p>The target audience is mother's, ages 25-42, mid-high income bracket. She probably enjoys reading Cookie magazine and taking Starbucks coffee breaks.</p>
    <p>The logo is intended to be fun, approachable, and representative of the look and feel of the products the company is selling.</p>
    <p>I got so much great feedback with my last logo posting, I hope to get the same amount of critique and debate with this one. This forum is great. Thanks in advance!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/lbl_4985.jpg"></div><p></p>
