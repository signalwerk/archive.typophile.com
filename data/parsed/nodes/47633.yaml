      <p>I agree with Tiffany too! It needs a touch of asymmetry with the text treatment. Have a play with a small 'little' and a huge 'big' - an overlap may work well. Give it a sense of drama.</p>
      <p>I HATE the Gotham. Try something more modern with personality, less classic. Each letter of the word 'big' could be asymmetrical too...might be too much but worth exploring.</p>
      <p>I also think the blue could be a touch brighter. White text with pink offset/hard drop shadow (1950s/60s style) on a stronger blue arrow? Might be worth looking at getting both pink and blue in there with the family theme.</p>
      <p>Just some ideas but i think you are on the right track.</p>
