      <p>I thought that  about <em>National</em>, I think it would look good mainly as a text-face with Wendy!</p>
      <p>Maybe you got it right the first time. I always say there is no point trying to look for something <em>similar but different</em> just because of the stigma attached to a certain typeface, In this case Gotham.</p>
      <p><strong>Jan</strong> stuck up a great list of typefaces that can be alternatives to a plain typeface such as Helvetica. <em><a class="freelinking external" href="http://www.fontshop.com/fontfeed/archives/helvetica-and-alternatives-to-helvetica" rel="nofollow">Helvetica Alternatives</a></em>.</p>
      <p>I personally like to look at blogs, take note of typefaces I like or maybe have a look at foundries until I find something that is suitable to a particular project. I then organise my suitcase as I build my collection. Any typeface I have in my suitcase I have spent time to organise and I don't just have them for the sake of it!</p>
      <p>I don't know if that made any sense... Rob!</p>
