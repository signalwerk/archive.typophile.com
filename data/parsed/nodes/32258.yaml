    <p>I'm on a project in FrameMaker, and the client wants MetaBook-Roman for all the text.  I paid for two separate downloads:  a TrueType/OpenType version, and a second purchase of the Type1/Postscript version (for Macintosh).  The second one almost works, but not quite.</p>
    <p>PROBLEM:  MetaBookLF-Roman is a plain, sans serif font. No Bold or Oblique style options.  MetaBoldLF-Roman is always bold, no oblique available. I cannot select specific words or phrases and emphasize their importance by styling them as bold or italic.  I can choose the Underscore style, but that's not the emphasis I prefer.</p>
    <p>SOLUTION:  Buy a third version of the font for $229 and hope it provides the style options I'm accustomed to.  </p>
    <p>Questions: Does anyone know where I can buy the $229 version?  Can anyone report that the $229 version does allow styling to be imposed manually?</p>
    <p>I really don't understand the trimmed version of my post.  Hope it all gets through. Thanks, and if this is the wrong question for this audience, never mind.....  --Scottie</p>
