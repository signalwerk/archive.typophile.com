      <p>I really hesitate to answer, because I don't know FrameMaker at all. I thought it was a pretty sophisticated program, and would support OpenType. But whatever.</p>
      <p>What is confusing is the statement that the client wants only ROMAN. You mean they won't accept italic, but would accept a sloped roman? If that is true, and if FrameMaker won't allow you to slope the roman (even as a PostScript command), I'd think you are out of luck, as FontFont doesn't make a "sloped roman" Meta, just an italic.</p>
      <p>There are other ways to emphasize words, of course -- letterspaced small caps being one, but all have their downside.</p>
