      <p>Your answer is helpful. One factor in all this is that Adobe has stopped developing FrameMaker for the Macintosh.  The Mac version I have is 7.0, and there's a Windows version 7.2.  I don't know whether the fact that I'm on a Mac platform makes a difference.  I have tried the OpenType version of MetaBook, and it does work in Frame, EXCEPT for the apostrophe and quotation mark characters.  Perhaps because I have smart/curly turned on?</p>
      <p>I see now that the only way to get what I want is to spend the $229.</p>
      <p>Thanks for your response to my question.  --Scottie</p>
