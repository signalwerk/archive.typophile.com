    html: |-
      <p>"Nr." is the German equivalent of "No." in English. Tribute was designed by Frank Heine (a German). See this <a class="freelinking external" href="http://en.wikipedia.org/wiki/No." rel="nofollow">wiki article about "No."</a>.</p>
      <p>This is the second <a class="freelinking external" href="http://typophile.com/node/62727" rel="nofollow">German-specific</a> font feature I've seen posted about today.</p>
