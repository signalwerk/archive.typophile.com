  html: |-
    <p>I've been using Tribute a lot lately and found a character I didn't recognize. It's in the Italic face and is the Nr. character. I assume it's an abbreviation for "number" (like No.), but I wanted to consult with the experts.</p>
    <p>You know what happens when people assume. Thanks for taking a look.</p>
