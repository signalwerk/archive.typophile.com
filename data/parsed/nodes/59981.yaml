  html: |-
    <p>Hi,</p>
    <p>I'm trying to move some fonts (in this case Sabon) over from an older Mac onto a Leopard system.</p>
    <p>The fonts are FFIL/LWFN suitcases and there is a separate folder with .AFM metrics files.</p>
    <p>By just opening the FFIL in FontBook, the font seems to install but ligatures don't to work unless I use the font in InDesign. (i.e. the fi and fl ligatures are there in the list of glyphs but don't get automatically replaced).</p>
    <p>Is there something else I need to do to enable the ligatures? I haven't restarted the computer since the install, would that help?</p>
