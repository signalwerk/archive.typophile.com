    html: |-
      <p>May or may not be germane...</p>
      <p>In the Unicode  computer encoding standard, there are two pairs of codepoints to represent Qoppa: U+03D8/U+03D9 ("Greek Letter Archaic Koppa" and "Greek Small Letter Archaic Koppa", Ϙϙ), intended for representing the epigraphic Q-like glyph, and U+03DE/U+03DF ("Greek Letter Koppa" and "Greek Small Letter Koppa", Ϟϟ), intended for the numeric Z-like glyphs.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Qoppa_3779.png"></div><p></p>
