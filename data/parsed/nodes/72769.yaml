    html: |-
      <p>Andreas, </p>
      <p>The Thesaurus linguae graecae project files can be found at the url <a href="http://escholarship.org/uc/tlg_unicode" title="http://escholarship.org/uc/tlg_unicode">http://escholarship.org/uc/tlg_unicode</a>. The proposal for U+2E16 is <a href="http://escholarship.org/uc/item/3bn592k6#page-1" title="http://escholarship.org/uc/item/3bn592k6#page-1">http://escholarship.org/uc/item/3bn592k6#page-1</a>. They call it "DOTTED RIGHT-POINTING ANGLE = DIPLE PERIESTIGMENE". Here is the justification (grab from page 11):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/thesaurus_6186.jpg"></div><p></p>
      <p>That is also essentially the shape found in table 2.3 of the documentation <a href="http://mirror.ctan.org/macros/latex/contrib/metre/metre.pdf" title="http://mirror.ctan.org/macros/latex/contrib/metre/metre.pdf">http://mirror.ctan.org/macros/latex/contrib/metre/metre.pdf</a> for the LaTeX <code>metre</code> package for classicists.  The characters in that table are all drawn with tex macros using pre-existing characters; the diple simply uses the mathematical symbol for greater than, &gt;. Here is a grab of the relevant lines</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/tex_4997.png"></div><p></p>
      <p>On the other hand here are a few handwritten samples taken from a facsimile of the Iliad (dated 1901), <a href="http://www.stoa.org/hopper/text.jsp?doc=Stoa:text:2003.01.0009" title="http://www.stoa.org/hopper/text.jsp?doc=Stoa:text:2003.01.0009">http://www.stoa.org/hopper/text.jsp?doc=Stoa:text:2003.01.0009</a>.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/plain_3530.jpg"></div><br>
      <div class="imageWrap"><img src="http://typophile.com/files/dotted_5572.jpg"></div><p></p>
      <p>There is a large variation in shapes. To my eye and understanding, the intended shape looks closer to the TeX math symbol <code>$\succ$</code>, corresponding to unicode U+227B, <a href="http://www.fileformat.info/info/unicode/char/227b/index.htm" title="http://www.fileformat.info/info/unicode/char/227b/index.htm">http://www.fileformat.info/info/unicode/char/227b/index.htm</a> than to &gt;, larger than. I am sure you could do better but TeX users (like me) usually make do with what they have got.</p>
      <p>Michel</p>
