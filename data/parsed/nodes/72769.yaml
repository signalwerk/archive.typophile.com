  html: |-
    <p>So in this academic volume I'm typesetting, an author has specified a character he needs in his transcription of an original manuscript from the 1700s. The thing should look something like an uppercase "Y" rotated counterclockwise by 90 degrees, or a lambda mirrored and rotated the other way. I'm assuming this signifies something other than «the original author has written a rotated "Y"», but I'm not sure what.<br>
    It might be related to either Latin (more likely) or Greek (which occurs after it in the text as can be seen below).<br>
    I have a couple of handwritten renditions:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/rotated_Y_1_4772.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/rotated_Y_1zoom_4364.jpg"></div><br>
    <div class="imageWrap"><img src="http://typophile.com/files/rotated_Y_2_3580.jpg"></div><br>
    .<br>
    Is anyone here familiar with this symbol and where/how to find/make it?<br>
    Thanks.<p></p>
