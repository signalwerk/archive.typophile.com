    html: <p>It's not a font--it's hand lettering by the comic artist Winsor McCay. You might find something generally similar (<a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.113.0.5&amp;attributes.sampleSize=24&amp;sampleText=DREAM+OF+THE+RAREBIT+FIEND&amp;sampleSize=24" rel="nofollow">ITC Tiffany Heavy</a>, <a href="http://www.philsfonts.com/detail.html?sku=BQ90081005P1" rel="nofollow">LoType</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.7793.0.5&amp;attributes.sampleSize=24&amp;sampleText=DREAM+OF+THE+RAREBIT+FIEND&amp;sampleSize=24" rel="nofollow">ITC Benguiat Bold</a>, or <a href="http://www.philsfonts.com/detail.html?sku=AG61376902P1" rel="nofollow">Greco</a> come to mind), but you won't likely find an exact match.</p>
    html_clean: <p>It's not a font--it's hand lettering by the comic artist Winsor McCay. You might find something generally similar (<a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.113.0.5&amp;attributes.sampleSize=24&amp;sampleText=DREAM+OF+THE+RAREBIT+FIEND&amp;sampleSize=24" rel="nofollow" class="link-external">ITC Tiffany Heavy</a>, <a href="http://www.philsfonts.com/detail.html?sku=BQ90081005P1" rel="nofollow" class="link-external">LoType</a>, <a href="http://www.fontshop.com/index.cfm?fuseaction=catalog.fontdetail&amp;displayfontid=C.7793.0.5&amp;attributes.sampleSize=24&amp;sampleText=DREAM+OF+THE+RAREBIT+FIEND&amp;sampleSize=24" rel="nofollow" class="link-external">ITC Benguiat Bold</a>, or <a href="http://www.philsfonts.com/detail.html?sku=AG61376902P1" rel="nofollow" class="link-external">Greco</a> come to mind), but you won't likely find an exact match.</p>
