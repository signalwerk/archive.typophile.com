    html: "<p>Thank you Mark + Bald Condensed. These are awesome! Nick's fonts are really charming. I'll have to spend time with them. I especially like Tiffany and Benguiat. Here's what I stumbled across in my quest, <a href=\"http://www.myfonts.com/search?search%5Btext%5D=archive+copperplate+head\" rel=\"nofollow\">archive copperplate head</a>, and <a href=\"http://www.myfonts.com/search?search%5Btext%5D=partenkirchen+NF\" rel=\"nofollow\">partenkirchen NF</a>. And these just look cool to me: <a href=\"http://www.myfonts.com/fonts/classic/savoy/\" rel=\"nofollow\">savoy</a>, <a href=\"http://www.myfonts.com/search?search%5Btext%5D=harlem+text\" rel=\"nofollow\">Harlem Text</a>, <a href=\"http://www.myfonts.com/search?search%5Btext%5D=ff+johannes+g\" rel=\"nofollow\">Johannes</a>, <a href=\"http://www.myfonts.com/search?search%5Btext%5D=tyrfing\" rel=\"nofollow\">tyrfing</a>. I guess now it's time to draw.</p>"
