    <p>Hi Typophilers, does anyone know the name of this typeface or something similar?<br>
    I keep wanting to say it's a font called "catherine" but having no luck on the search queries. I was also wondering if anyone had suggestions for a good big type-reference book to have. I have the 'encylopaedia of typefaces" by jaspert, one "the solotype catalog" and another called "the type specimen book."</p>
    <p>thanks all.</p>
