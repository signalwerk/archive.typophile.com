  html: |-
    <p>I am in the process of creating a logo for a friend of mine who is a Chocolatier.  She found a font she likes on some literature.  Has anyone ever seen this font or anything close to it?  I've been searching all over the Internet and cannot find anything similar.  Someone may have created this font.</p>
    <p>ANY help would be greatly appreciated, Karen<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/MochaFont_6305.jpg"></div><p></p>
