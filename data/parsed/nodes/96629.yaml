      <p>Incidentally, in my search for information on the layouts of Armenian typewriters, sparked initially by a desire to illustrate another example of a phenomenon on some older Russian typewriters, I came across this news item:</p>
      <p><a class="freelinking external" href="http://news.am/eng/news/101637.html" rel="nofollow">http://news.am/eng/news/101637.html</a></p>
      <p>I was astonished by it. In the diaspora, a keyboard with the Armenian letters arranged in something approximating the QWERTY layout makes sense; why learn to type over again just so that one can also type in Armenian? But in Armenia itself, where Armenian is the language of daily life? Was the threat of <em>samizdat</em> so great that Armenian typewriters were that rare, so that hardly any Armenians know how to type, and so there is no established keyboard arrangement to worry about?</p>
      <p>Now, if they tried to copy Dvorak, that might at least lead to a decent keyboard, but to slavishly follow a foreign language to get the world's worst keyboard arrangement - it just seems sad that this can even be considered for a moment.</p>
