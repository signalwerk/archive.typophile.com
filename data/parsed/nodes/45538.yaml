      <p>You're right about it being <a class="freelinking external" href="http://www.myfonts.com/fonts/ef/ballantines-script/" rel="nofollow">Ballantines Script</a>, (a.k.a. Goddess) although maybe a heavier weight than light.  "Golf Club" looks like an Italic of one of the Bodonis. I'll try to see if I can narrow it down.</p>
      <p>- Mike Yanega</p>
