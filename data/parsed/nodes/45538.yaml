    <p>Hello, could anybody tell me what this font is, or any similar ones?<br>
    I’m trying to find exact fonts for both main type, Jade Palace and sub type, Golf Club.<br>
    The main type seems to be EF Ballantines Script Light, but I don't see it exactly overlaping. And as far as the sub type goes, I have no idea what exactly the font is used. Can anyone please identify them?<br>
    Your help would be highly appreciated. Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/jpgc_3519.jpg"></div><p></p>
