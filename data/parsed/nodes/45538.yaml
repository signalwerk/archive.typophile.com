      <p><a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/itc-bodoni-twelve/" rel="nofollow">ITC Bodoni Twelve</a> Italic is pretty close (at least it has the C with no lower serif), but it looks like the letters were slanted more to match the script slant, and their tracking was tightened to cram the letters closer together.</p>
      <p>- Mike Yanega</p>
