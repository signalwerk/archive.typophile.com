    html: "<p>This is probably no help, but I REALLY LIKE IT! The image caught my eye on my blogroll and I thought: oooh, new font? Download! But, no, it's in development. It has a nice neo-modern (is that even a word???), nostalgic-yet-novel look to it. The only piece of feedback I could maybe give is that something about the \"a\" and the \"d\" are too ordinary to me...maybe if there was a TAD more \"character\" to them (excuse the pun). For example, I feel that the \"a\" seen alone could be confused with many other fonts of lesser aesthetic value than yours here. The \"d\" also feels like it could be a little more unusual, but not too frilly. The \"K\" and the \"f\" are my favorites. OK, I apologize if that was completely unhelpful.</p>"
    html_clean: "<p>This is probably no help, but I REALLY LIKE IT! The image caught my eye on my blogroll and I thought: oooh, new font? Download! But, no, it's in development. It has a nice neo-modern (is that even a word???), nostalgic-yet-novel look to it. The only piece of feedback I could maybe give is that something about the \"a\" and the \"d\" are too ordinary to me...maybe if there was a TAD more \"character\" to them (excuse the pun). For example, I feel that the \"a\" seen alone could be confused with many other fonts of lesser aesthetic value than yours here. The \"d\" also feels like it could be a little more unusual, but not too frilly. The \"K\" and the \"f\" are my favorites. OK, I apologize if that was completely unhelpful.</p>"
