    html: <p>Thanks a lot Bernard and Jeanne. I still don't know what's going to happen. I'm showing a bunch of logotypes mockups to my client on thursday, but I should definitely develop this solution as a typeface. Never designed a script before though. I'm already a bit familiar with OpenType's discretionary ligatures and alternates, it might help.</p>
