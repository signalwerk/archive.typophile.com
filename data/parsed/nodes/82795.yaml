    <p>Hi guys,</p>
    <p>I'm pretty inexperienced when it comes to typography, so I could use a hand, if possible. I've been looking for a suitable typeface for my logotype for the past 3 hours and I'm even more confused than when I started.</p>
    <p>My project is just a WordPress-based magazine-style website about personal development.</p>
    <p>Basically, I'm considering using Calluna for headlines and sub-headings and Calluna Sans for body text and meta.</p>
    <p>I need a typeface for the logotype that will complement Calluna and Calluna Sans. Ideally, I'd like a modern, clean, and fresh humanist sans-serif in either medium or semi-bold weights that will look good at large sizes (around 36-48px). Groteque, geometric, etc don't really fit in the way humanist does. </p>
    <p>The only fonts I liked were Whitney and Bree in italics. But I feel really unsure. Do you think these fonts will complement Calluna and Calluna Sans? Or are there other fonts that will complement these?</p>
    <p>Thanks.</p>
