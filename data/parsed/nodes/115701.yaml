    <p>Some references state that the size of a printer's point in the English-speaking world was defined in 1886 on the basis of 83 picas being equal to 30 centimeters.</p>
    <p>Other sources state that while this was one of the proposals considered, the one actually adopted was the Johnson pica, which based the point on 1/72nd of 249/250ths of the British inch, not the American one, which still differed at the time.</p>
    <p>Neither of these standards, though, equal 0.013837 inches, which many sources give as the official printer's point.</p>
    <p>I've seen only one place on the Web acknowledging this discrepancy: a conversion table from Circuitous Root, which credits ATF with the modern printer's point as of 1902.</p>
