      <p>I see that 0.013837 is given there as the Nelson C. Hawks point. But is that point therefore wrong, having been superseded, even though so many sources give it as the value?</p>
      <p>On my page,</p>
      <p><a class="freelinking external" href="http://www.quadibloc.com/other/cnv01.htm" rel="nofollow">http://www.quadibloc.com/other/cnv01.htm</a></p>
      <p>you can see my thinking on this.</p>
      <p>I believe the sources that say Nelson C. Hawks' point was either 0.0138" or exactly 1/72", because he was the first person to propose the point system. It's a natural error to attribute the final point size of 0.013837" to the first person in America to propose using a point system. (Attributing it to Fournier or Didot, though, is a harder mistake to make, as there's well-known history in between.)</p>
      <p>Since the sources I've found on the web don't even agree on whether the 83 picas to 35 centimeters point, or the 249/250 of a survey foot point won out at the meeting in 1886, and that meeting is very obscure, skipping over it doesn't surprise me.</p>
      <p>Wait - 249/250 is 0.4% smaller than unity, not 0.325% or 0.375% smaller - maybe I've been fooled by a typo, and the Johnson pica is the right size...</p>
      <p>Legros and Grant claim in Typographical Printing-Surfaces that indeed the point of MacKellar, Smiths and Jordan, accepted as the standard in the 1886 meeting, held in Niagara, was the modern 0.013837" foundry point. This is at least plausible, even if it requires Wikipedia to be wrong.</p>
