      <p>If you look at an old Haberule, an artifact of the Linotype/Monotype days,<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/haberule_4521.jpg"></div><br>
      you can see that 60 picas (720 points) is visibly shorter than 10 inches, I suppose because of the 19th-Century difference between the British inch and the American inch.<br>
      When desktop publishing software was developed in the 1980s, it was designed to allow users to switch units of measurement from inches to picas and back again, with the point defined as <em>exactly</em> 1/72 of a U.S. inch, which has become the new standard.<p></p>
