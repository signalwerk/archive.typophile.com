    <p>I used to think I was smart. Then I started trying to use Python with FontLab.</p>
    <p>I'm trying to install RoboFab in my FontLab. I'm using Fontlab v5.0.4 in Windows XP. I've read everything I can find about how to install it, but either they're all just cruelly hinting at how to do it ("Installation in Windows is usually straightforward") or I'm thick enough that it seems that way to me. </p>
    <p>This is what I think I know. I need to:</p>
    <p>Download RoboFab from the internet — check.<br>
    Unzip it — check.<br>
    Put it in some folder, somewhere —&nbsp;??<br>
    Run the "install" command in FontLab — After trying various folders to put RoboFab in, I've gotten to where I can do this, but when I try to run any other things from the RoboFab dropdown menu, it says I don't have something called "robofab.world".</p>
    <p>Can anyone explain to me, as if I were a very stupid person, what I'm supposed to do, or point me to somewhere on the internet that does that? I can tell that Python might save me a lot of effort, if only I could figure out what to do with it.</p>
    <p>Thanks in advance.</p>
