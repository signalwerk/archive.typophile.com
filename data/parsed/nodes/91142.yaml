    html: |-
      <p>The RoboFab developers are getting tired of the installation problems too. It's not supposed to be so difficult. And it didn't use to be so difficult either. But factors beyond our control, unfortunate decisions by the FontLab developers, assumptions by the Python.org developers, and the mercurial needs of Apple, have slowly turned "FontLab" a very fragmented and problematic environment.</p>
      <p>This <a class="freelinking external" href="http://vimeo.com/38359791" rel="nofollow">Robothon2012 talk</a> explains some of the Python version issues.</p>
      <p>In the interval between Robothon 2009 and Robothon 2012, Frederik Berlaen wrote <a class="freelinking external" href="http://doc.robofont.com" rel="nofollow">RoboFont</a> from scratch. And Georg Seifert took <a class="freelinking external" href="http://glyphsapp.com" rel="nofollow">Glyphs</a> from a demo to an AppStore title. Each with its own philosophy, but both with scripting and python layers, attentive developers and thankfully straightforward installation steps. And UFO to glue it all together.<br>
      In that same interval FontLab updated FL Studio from 5.04 to 5.1.</p>
