    <p>I'm still wrestling with a Unicode Opentype cross-platform font that will work in various apps. Although it is definitely a temporary 'hack', I found that replicating the ccmp feature as liga, and placing it after ccmp, seemed to work as a temporary measure. The characters are now rendered properly in Word and InDesign. However, the problem I have now is with spell checking in MS Word 2003. When I attempt to add words created with the OpenType font, via the tools/options/spelling/custom dictionary dialog, Word complains that the 'word cannot be added because the speller cannot handle some of the characters it contains'. It was my understanding that using unicode characters with codepoints (versus PUA) will allow spell checkers to work properly. </p>
    <p>Am I missing something?</p>
