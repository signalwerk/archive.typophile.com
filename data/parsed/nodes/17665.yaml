      <p>Word from Word... </p>
      <p>&gt;This is a known in issue in earlier versions of Office (Office 2003 and before). Since Custom Dictionary was ANSI, adding words from Unicode-only languages was not possible. (We made it work by putting some fixes for Indic languages where we knew the Unicode ranges of Indic scripts) </p>
      <p>&gt;Good news is that this has been fixed in O12 where we have converted/made Custom Dictionary Unicode. This change will basically allow adding words from any languages with Unicode encoding. </p>
      <p>Cheers, Si</p>
