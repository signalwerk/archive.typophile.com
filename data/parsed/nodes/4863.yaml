    <p>I'm chiseling away at rather large OT family that includes <br>Tabular figures as alternates to the standard proportional figures.  <br>I've designed and included monetary symbols to fit with the  <br>Tabular figures but it dawns on me that periods and spaces  <br>should match too. Maybe... <br> <br>Am I crazy? Periods are really common within a range of numbers. <br>For example: <br>4545.094598 <br>3458394.9084 <br> <br>And as shown above, would throw off the tabular setting. <br>Is this reasonable with OT?</p>
