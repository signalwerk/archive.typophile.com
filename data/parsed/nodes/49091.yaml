    html: <p>Any talk of a particular point size being too big or small is meaningless, especially in the age of digital type. Since the actual digital glyph is no longer tied to a particular size piece of metal, it is more accurate to speak of cap hight or x-height or any other actual measurement as it relates to the physical rendering of the glyph. One 9 pt could look like another's 10 pt or 8 pt for that matter.</p>
