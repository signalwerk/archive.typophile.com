      <p>9 pt is kinda small but considering the format, I don't think it would appear too small. It would also depend on how much text and what font you're planning to use. Some fonts have a larger x-height and appear large enough at 9pts, but some have a shorter x-height and 9pts might be difficult to read.</p>
      <p>Is the dark pink, more purplish or reddish? I'd set the type and print it out, that's really the only way you'll know for sure.</p>
