  html: |-
    <p>My brother sent me this link today: <a class="freelinking external" href="http://www.uniquetypes.cc/designers/index_en.html" rel="nofollow">http://www.uniquetypes.cc/designers/index_en.html</a><br>
    This is a project of the Brazilian Association for the Welfare of the Handicapped Children. They are inviting designers to create fonts inspired by children suffering from physical disabilities.<br>
    Besides the chopped Arial they used on the video (which reminded me of the <a class="freelinking external" href="http://www.typophile.com/battle36" rel="nofollow">Fix Arial</a> topic), I think there are a couple of good fonts when we scroll down. But I still feel kind of sad knowing the guys who conceived this project couldn't think of any other way to represent disabilities other than cutting things off.</p>
