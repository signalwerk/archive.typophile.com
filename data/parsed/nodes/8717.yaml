    html: <p><i>The invention of the alphabet by the Phoenicians and the invention of the mass printing system by Gutenberg changed history.</i> <br> <br>The Phoenicians did <i>not</i> invent the alphabet. The ancient Greeks adopted the alphabet into Indo-European use from Semitic sources, and the latter have traditionally been identified with the Phoenicians. There is some scholarship, however, that challenges this tradition, citing evidence that the Greeks adopted the alphabet at an earlier stage, from another Semitic group. In any case, the Phoenicians were only one Semitic group using a variety of an alphabet that had already been in widespread use throughout historical Canaan long before substantial Greek-Phoenician trade. This alphabet is structurally identical to Hebrew. I don't think anyone has identified any particular group as being responsible for the invention of this alphabet, which is not surprising given the small geographic area, the similarity of Semitic languages, and the large amount of trade that took place among the inhabitants of this region. <br> <br>The idea that the Phoenicians invented the alphabet is a Euro-centric imposition, based on the traditional history of the transmission of the alphabet to the ancient Greeks. There is no reason to suppose, in a Semitic context, that the Phoenician contribution was more important than that of other peoples, including the Jews. The style of Hebrew writing identified as Palae</p>
