    html: "<p>Well, Jonathan is probably asking <i>how</i>, not just whether. Very good questions. <br> <br>&gt; Has the design of alphabets had any affect on history? <br> <br>I don't know of any such cases, but certainly the fact that people use <i>different</i> alphabets has had consequences. Perhaps the biggest one is Ataturk's dumping of the Arabic script in favor of the Latin; many people (perhaps most) attribute that (at least partly) to the need of the Turks to make up for WWI. <br> <br>&gt; Is the deign of an alphabet simply a reflection of the time it were created in? <br> <br>Do you mean fonts? Alphabets (or more generally writing systems) almost never get designed (except for the highly notable case of Hangul). But their genesis and evolution certainly contain reactions to cultural milieux. <br> <br>&gt; Has type design ever had a profound affect beyond our profession? <br> <br>Maybe not \"profound\", but two cases of the relevance of type come to mind: <br>1) The Nazi flip-flop concerning blackletter. <br>2) The recent Bush memo debacle. <br> <br>hhp</p>"
    html_clean: "<p>Well, Jonathan is probably asking <i>how</i>, not just whether. Very good questions. <br> <br>&gt; Has the design of alphabets had any affect on history? <br> <br>I don't know of any such cases, but certainly the fact that people use <i>different</i> alphabets has had consequences. Perhaps the biggest one is Ataturk's dumping of the Arabic script in favor of the Latin; many people (perhaps most) attribute that (at least partly) to the need of the Turks to make up for WWI. <br> <br>&gt; Is the deign of an alphabet simply a reflection of the time it were created in? <br> <br>Do you mean fonts? Alphabets (or more generally writing systems) almost never get designed (except for the highly notable case of Hangul). But their genesis and evolution certainly contain reactions to cultural milieux. <br> <br>&gt; Has type design ever had a profound affect beyond our profession? <br> <br>Maybe not \"profound\", but two cases of the relevance of type come to mind: <br>1) The Nazi flip-flop concerning blackletter. <br>2) The recent Bush memo debacle. <br> <br>hhp</p>"
  - id: 57226
