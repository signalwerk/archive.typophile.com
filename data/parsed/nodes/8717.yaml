    date: 2005-01-19T13:10:00
    date_raw: 19.Jan.2005 1.10pm
    votes: null
    html: <p>The invention of the alphabet by the Phoenicians and the invention of the mass printing system by Gutenberg changed history. Good alphabet design eased readablity, added charm and grace. Not earth shaking, but not bad. <br> <br>Changes in the alphabet, such as dropping the long s after the French revolution, the rejection of blackletter in Germany, the complete changes in Turkey and Korea - these follow great events of the day. Design styles tend to relate to the other designs of the day - especially architecture, for some reason. <br> <br>China not using an alphabet (they had one fairly early) was also important. Using ideograms they could represent many languages, barely understandable to each other. This enabled a unified China. Now with radio and TV I believe everyone is learning Mandarin or 'common tongue' as they call it - and inputing it into computers using the Roman alphabet, with the pin-yin system of romanization.</p>
