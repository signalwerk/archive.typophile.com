    <div class="info">Submitted by <a href="/user/108" title="View user profile.">Miss Tiffany</a> : 19.Dec.2005 8.43am </div>
      <p>—</p>
    <p>PRESS RELEASE</p>
    <p><strong>Ascender releases its first OpenType Pro font</strong></p>
    <p>Pericles™ Pro fonts offer advanced typographic features</p>
    <p>ELK GROVE VILLAGE, IL - December 19, 2005 - Ascender Corporation, a leading font development firm is pleased to announce the release of Pericles Pro, an OpenType font available for purchase and immediate download from the Ascender Font Store (<a href="http://www.ascenderfonts.com" title="http://www.ascenderfonts.com">http://www.ascenderfonts.com</a>).</p>
    <p>—</p>
    <p>Pericles Pro is an attractive typeface for headlines and short passages of text which recall inscriptional lettering and playful, art deco design. There are two weights of Pericles Pro, Light and Regular, containing OpenType-enabled typographic features with alternative characters for creating eye-popping effects in headlines, book titles, banners, and greeting cards.</p>
    <p>“Pericles is a fun, yet versatile design”, said Steve Matteson, Ascender’s Type Director. “Users may pick and choose alternate letterforms to create graphic word-forms or simply use the normal characters depending on the effect they want to achieve. A little bit of playfulness goes a long way in creating unique, attention-getting messages”.</p>
    <p>Pericles Pro is based on the work of Robert Foster who created the original for American Type Founders in 1934. Steve Matteson first saw Pericles in an old ATF specimen book with the description: ’combines the purity of the Greek with the virility of the modern’. The original included alternative designs for E, R and Q. Steve believed the design could be taken a great deal further by utilizing OpenType technology. In addition to the alternate letter designs, Pericles Pro also includes the accented characters necessary for setting languages supported by code pages Latin 1, 2 and 5.</p>
    <p>Each Pericles Pro font includes 433 glyphs. This includes 12 stylistic alternates and 17 ligatures to mix and match with a full set of capitals, small capitals, superscript, subscript and petite small capital letters. Pericles Pro was developed to take advantage of the rich typographic OpenType features of applications Adobe Creative Suite, as well as Windows Presentation Foundation (WPF) and the forthcoming QuarkXPress 7. Each Pericles Pro font retails for $30.00 and is available for purchase and immediate download from the <a href="http://www.ascenderfonts.com" title="http://www.ascenderfonts.com">http://www.ascenderfonts.com</a> website.</p>
    <p>A PDF brochure of Pericles Pro can be viewed here: <a href="http://www.ascendercorp.com/pdf/pericles.pdf" title="http://www.ascendercorp.com/pdf/pericles.pdf">http://www.ascendercorp.com/pdf/pericles.pdf</a></p>
    <p><strong>About Ascender Corporation</strong><br>
    Ascender Corporation is a leading provider of advanced font products specializing in font design, development and licensing. Ascender’s founders are font industry experts, and have been involved in developing some of the most important and influential fonts used in computers, phones and printers. Ascender provides multilingual, custom font development for enterprises and hardware &amp; software developers. Ascender also provides high quality fonts for immediate download from the Ascender Font Store website.</p>
    <p><strong>Contact:</strong><br>
    Bill Davis<br>
    Ascender Corporation<br>
    25 Northwest Point Blvd, Suite 975<br>
    Elk Grove Village, IL 60007 USA<br>
    Phone: (847) 357 0730 ext. 10<br>
    Fax: (847) 357 0731</p>
    <p>For more information on this product, please <a href="http://www.ascendercorp.com/inquiry.aspx?Ref=Press">contact us</a></p>
    <p>—</p>
    <p>Trademarks: Ascender is a trademark of Ascender Corporation which may be registered in the US Patent and Trademark office and certain other jurisdictions.</p>
