    html: |-
      <p>Khaled:</p>
      <p>Yes, I concluded that Fontforge is unacceptable.  The exe in  whatever version I downloaded is 14 mb.  So that's nothing I can distribute.  Its a big bloated behemoth with overlapping confusing documentation and features.  Glad some people have been able to make use of it.</p>
      <p>Just to review my experience fwiw (for anyone else's benefit) as I said in the OP I had what I needed working with FreeType and ttx.  Just to elaborate, FreeType can perform various transforming algorithms on glyphs but for whatever reason is not set up to write that all back to the ttf file.  THat is where ttx comes in - a well known utility that will decompile a ttf (and other formats) into XML and then recompile it back into a ttf.  So what I needed working I had working with those two (FreeType and ttx). But the problem is ttx is in python (an interpreted, and slow system) and also its generates this humongous XML file that is dealing with. So the time penalty for all that is about 5 seconds, which in the context of user software is a little excessive.</p>
      <p>But there truly for whatever reason just doesn't seem to be any command line utilities that will perform straightforwatrd glyph transformations on a font file.  Its ridiculous.  I mentioned 'rotateFont' previously, which is part of something Adobe released - some set of tools their developers ostensibly use that they're magnanimously making available to us all.  But after struggling with RotateFont for half and hour I gave up.  I defy anyone to make it do what its purported to do.</p>
      <p>So in the last couple of days I did write my own parser to get the glyph data from a ttf/otf file and then put it back after making changes (thus avoiding the time penalty of ttx involving python and that huge text file). And as I expected it immediately shaved off all that excess time. However thus far it correctly parses the font file only about 2/3's of the time.  So there are just a lot of nuances in the ttf/otf format that you have to nail down.  I'm not going to reinvent the wheel there, so have just decided to go with my original setup of ttx and Freetype.  </p>
      <p>Not to knock ttx at all, because it is quite accurate and reliable as far as dealing with the font file - its just kind of slow.  So why no one ported its functionality to an efficient (c++ based) executable is beyond me.  (You don't need Python installed to run ttx,  but its still accessing it via a dll or something so still running as an interpreted program.)  Actually the ttx version I'm using is from 2002, because that was what was in the win binary distributable from their own website, but there are a score of other  ttx versions floating around as well from different years, so my next step will be to maybe compile the lastest ttx source code. So anyway, in case anyone googles this topic in the future maybe the above will be of use.</p>
      <p>Note:  In those Adobe utilities is something called sfntedit, and that is actually quite good (the only thing in it that's good, other than ttx which they include with their stuff as well.)   But sfntedit will extract a font table to a file and put it back, but its very useful and reliable.</p>
