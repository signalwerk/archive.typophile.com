      <cite>Yes, I concluded that Fontforge is unacceptable. The exe in whatever version I downloaded is 14 mb. So that's nothing I can distribute. Its a big bloated behemoth with overlapping confusing documentation and features. Glad some people have been able to make use of it.</cite></p>
      <p>It is a font editor with support for more than a dozen of font formates and technologies, so the complexity is very acceptable, I also find the documentation very extensive and helpful. If you don't understand it, then it is because type design is complex, not any fault of FontForge, you are just using the wrong tool for what you want.</p>
