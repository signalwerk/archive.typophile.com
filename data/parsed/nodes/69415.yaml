      <p><cite>..  algorithmic bolding of text (for example in software when a font doesn't have a bold variant defined) seems fairly commonplace.</cite></p>
      <p>The Word solution: place the text twice (or thrice, or even more often) with a small offset. Yuck.<br>
      The usually recommended InDesign solution: give the text a small outline (although I should mention that this <em>also</em> usually is followed by "Butt ugly, so don't do it and purchase a real bold font").</p>
      <p>Doing the Word thing in memory, on a glyph, would mean you'd have to intersect the character with itself at an offset. But it will, generally speaking, result in extremely ugly characters.<br>
      Doing the InD thing in memory should also be possible but <em>also</em> needs a full CSG operation -- first, you have to create an outline of the glyph, then expand the stroke into a fill form, then intersect it with the original.</p>
      <p>If you can get hold of the original outline coordinates and vectors, I think a rather good way would be to move left-pointing lines a bit to the left and right-pointing lines a bit to the right. (And probably something similar if you want to change the height as well.) You cannot use a single transformation on each separate coordinate, as that would amount to simply <em>stretching</em> the character -- the matrix you posted does that.</p>
