      <p>About rotateFont: when you say "after struggling with RotateFont for half and hour I gave up", can you tell me what it was you were trying to do, and whether it was under Windows or Mac OSX? As the person who maintains it, I like to know about any bugs.  The one issue I know about is that none of the FDK tools produce TTF glyph data: although many can read TTF data, they output CFF glyph data.</p>
