      <p>Read Roberts</p>
      <p>"About rotateFont: when you say "after struggling with RotateFont for half and hour I gave up", can you tell me what it was you were trying to do..."</p>
      <p>Just apply a matrix transformation to all the glyfs in the font file, to give them all an 'italic' slant angle. </p>
      <p>Of course, if people customarily use it for this purpose with little or no problem then don't let my experience discourage you.  But I couldn't figure it out.  Although I may have been sleep-deprived at the time.</p>
      <p>I also wanted to do an artificial bold for the font as well.  At the time I didn't know how I was going to do bold algorithmically, and my  decision against RotateFont may have been partially influenced by the conclusion that I would still need some other tool to do bold. </p>
      <p>Also RotateFont seemed to have a whole slough of features which made me concerned about efficiency speed, etc.  But the main thing was I never even figured out how to do italic.</p>
