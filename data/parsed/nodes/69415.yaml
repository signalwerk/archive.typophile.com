      <p><a href="http://fontforge.sourceforge.net/" rel="nofollow"><strong>FontForge</strong></a> can be used for batch processing with <a href="http://fontforge.sourceforge.net/scripting.html" rel="nofollow"><strong>scripts</strong></a>. You could try the changeWeight <a href="http://fontforge.sourceforge.net/python.html" rel="nofollow">Python Script</a> method for glyphs; its behavior and optional parameters are described <a href="http://fontforge.sourceforge.net/Styles.html#Embolden" rel="nofollow">here</a>. Here is a  <code>chngwt</code> script for dummies:<br>
      <code><br>
      ---<br>
      #!/usr/bin/python2.5</code><br>
      <code><br>
      import fontforge,sys<br>
      fnt=fontforge.open(sys.argv[1])<br>
      weighttoadd=int(sys.argv[2])<br>
      outname=sys.argv[3]<br>
      for g in fnt.glyphs():<br>
      &nbsp;&nbsp; g.changeWeight(weighttoadd)<br>
      fnt.generate(outname)<br>
      ---</code></p>
      <p>The call<br>
      <code>chngwt infile.otf 50 outfile.otf<br>
      </code><br>
      gives a file outfile.otf that is bolder than infile.otf by 50 ÷ em units (you can also use with .pfb or .ttf files)</p>
      <p>For some characters, the output does not look too bad. Processing is however slow and the features that FontForge does not know or does not handle completely will be lost or partially lost in outfile.otf</p>
    html_clean: |-
      <p><a href="http://fontforge.sourceforge.net/" rel="nofollow" class="link-external"><strong>FontForge</strong></a> can be used for batch processing with <a href="http://fontforge.sourceforge.net/scripting.html" rel="nofollow" class="link-external"><strong>scripts</strong></a>. You could try the changeWeight <a href="http://fontforge.sourceforge.net/python.html" rel="nofollow" class="link-external">Python Script</a> method for glyphs; its behavior and optional parameters are described <a href="http://fontforge.sourceforge.net/Styles.html#Embolden" rel="nofollow" class="link-external">here</a>. Here is a  <code>chngwt</code> script for dummies:<br>
      <code><br>
      ---<br>
      #!/usr/bin/python2.5</code><br>
      <code><br>
      import fontforge,sys<br>
      fnt=fontforge.open(sys.argv[1])<br>
      weighttoadd=int(sys.argv[2])<br>
      outname=sys.argv[3]<br>
      for g in fnt.glyphs():<br>
      &nbsp;&nbsp; g.changeWeight(weighttoadd)<br>
      fnt.generate(outname)<br>
      ---</code></p>
      <p>The call<br>
      <code>chngwt infile.otf 50 outfile.otf<br>
      </code><br>
      gives a file outfile.otf that is bolder than infile.otf by 50 ÷ em units (you can also use with .pfb or .ttf files)</p>
      <p>For some characters, the output does not look too bad. Processing is however slow and the features that FontForge does not know or does not handle completely will be lost or partially lost in outfile.otf</p>
