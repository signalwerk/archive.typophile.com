      <p>Thanks, Michel Boyer.  Just as an update as I haven't visited this thread in while - I did eventually just write my own C++ code (about 600 lines) to modify font file glyf tables, and did eventually get it all working correctly. It still uses the FreeType library to do the matrix conversions, but I bypass the bottleneck of ttx, by accessing the tables directly myself. I still use ttx to change the font name table (appending 'bold' or 'italic' where appropriate), but the glyf table is huge, and converting it all to a xml text file as ttx does is a huge bottleneck. What has to be done to directly modify the glyf table (and also the loca table) is all very arcane though.  </p>
      <p>(I also invoked sfntedit extensively in my code as well.  Its very useful.)</p>
