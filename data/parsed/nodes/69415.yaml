      <p><cite>The exe in whatever version I downloaded is 14 mb.</cite></p>
      <p>Concerning size (you may have other good reasons not to use FontForge) the python library that can be used for scripting (that I used above and that of course requires Python to work) is just 68K on my macintosh. More precisely, fontforge.so is 32K and psMat.so is 32K. Those files are installed in /Library/Python/2.5/site-packages by the postflight in the package FontForge_macunivX.5-20090923.pkg that you can find at the url <a href="http://sourceforge.net/projects/fontforge/files/fontforge-executables/" title="http://sourceforge.net/projects/fontforge/files/fontforge-executables/">http://sourceforge.net/projects/fontforge/files/fontforge-executables/</a>.</p>
      <p>Michel</p>
      <p>PS Of course, the files above are for the macintosh. I have never looked at what is available for other architectures.</p>
