    <p>I need something that for example you can pass in a matrix to it as a parameter and it will automatically modify all the glyphs in the font file.  I need to both italicize and embolden a font as well.</p>
    <p>Actually I did manage to accomplish this  with ttx and the FreeType library.  FreeType has methods like FT_Outline_Transform and FT_Outline_Embolden, and with ttx its easy to get to all the glyph data and then recompile it all back into a font file.  But the process is slow:  5-10 seconds for a single font.  The reason its slow is at least because its dealing with that huge ttx text file. </p>
    <p>But since matrix transformations and embolding is so trivial and ubiquitous I can't believe there's not a command line tool already somewhere to do this but haven't found it anywhere.  (The complicating factor in automating this is of course the byzantine TT/OT format.)</p>
