      <p>I think I have to agree that a double-story a and g are preferred when it comes to legibility. Basicallly, the more differentiation there is between letters, the better it reads. A one-story a could obviously be confused with an o. Although in practise you'll notice that you can perfectly read the texts set in Xerox Sans. But when you're talking about <em>immersive</em> reading (which happens almost subconsiously) I think it could be detrimental.</p>
      <p>If you're interested in what happens when we read and how this ties in with typefaces, read Gerard Unger's book 'While you're reading'. He goes into these kind of aspects as well.</p>
