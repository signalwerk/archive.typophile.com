      <p>Thanks for you guys' feedback. </p>
      <p>@JP</p>
      <p>I agreed with you. Xerox Sans is merely a customized typeface for a corporation, which is slightly different from the mainstream commercial typefaces. So it doesn't need to go through a gaussian blur in the designing process. It's understandable that my friend split Xerox Sans's hair and insist saying the failed blur test undermines Xerox Sans' legbility because type deisgn runs through his blood. Blur test is one of knee-jerk reactions when he spot a new typeface.:-)</p>
      <p>@Jongseong</p>
      <p>I also know some typefaces take one-story "g" along with two-story "a". And there are also other typefaces which use two-story design "a" and "g", say E-Types Press Sans. I think a two-story "g" probably add some readability noise in text. With your reminder, I'd better reconsider the design of "g" for myself.</p>
      <p>@Nick</p>
      <p>The little charming tail does the job in the way the same tail in Truvia's logo, shown below:-) (I don't know what typeface it is.):</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Truvia_Logo_Sm_3654.jpg"></div><p></p>
      <p>And blurred Futura looks "nice".</p>
      <p>@John</p>
      <p>For me, a blur test is irrelevant to one typeface's legibility and readability. I think my friend did the "blur test" only to butress his own opinion that ALL classic, popular and successful (sans serif) typefaces stick with the one-story design of "a". He's a little typographically draconian.</p>
      <p>@Jackson</p>
      <p>JP said exactly what I wanted to say in response to your question.</p>
      <p>@Eliason</p>
      <p>Thanks for your picture, it's informative.</p>
      <p>@JP</p>
      <p>Thanks for your nice remarks.:-)</p>
      <p>JamesZ</p>
