    html: <p>Keep in mind that while type designers love to ponce on about the finer details of spacing and legibility they aren’t always so important. Sure this stuff is a big deal for a face like Clearview HWY that’s not set by typographers and is read from a distance while moving. But Xerox Sans is being read by people sitting down with a bright light and all the time they need to spot each word. Maybe readers will need an extra tenth of a second here or there to recognize a three-syllable word that contains a and o, but otherwise that single-story a is irrelevant. And I really doubt anyone is reading corporate documents under conditions that resemble a gaussian blur, no matter how convenient it is to whip one up and pretend it proves a point.</p>
