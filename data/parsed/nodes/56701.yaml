    html: <p>Is a double-storey g really clearly more preferable in a sans-serif design? A single-storey g wouldn't really be confused with any other letter, and there are several established designs (including most grotesques) that combine a double-storey a with a single-storey g. Personally, I find the double-storey g more classic-looking, but it does add unwelcome clutter in small sizes. There are arguments for and against both forms of g in sans-serif designs, but I wouldn't say one clearly wins out over the other in terms of readability.</p>
