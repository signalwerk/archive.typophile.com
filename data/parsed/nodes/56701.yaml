      <p>Just to get this straight, your main questions are:</p>
      <p>– Single or double story a?<br>
      – Is spacing too tight and/or inconsitant?</p>
      <p>Am I right?</p>
      <p>Well the blur test seems to be very much in favour of the double story a, though I don't know if there are other tests for legibility (other typophiles probably know more. If this is used for the web (using font-embedding technology), I would have a look at the system fonts by <a class="freelinking external" href="http://new.myfonts.com/search/matthew+carter/fonts" rel="nofollow">Matthew Carter</a>, like Verdana and Tahoma. They have to be legible at small sizes and crude resolution, and they all seem to have a double-story a. This seems to indicate it is more legible. Several fonts by Spiekermann, like Meta, Officina, Info have been used a lot in signage, where legibility is a crucial factor as well. These also all have a double-story a. So I guess this is the better way to go in terms of legibility.</p>
      <p>As for spacing, I do think it looks pretty tightly spaced, a bit choked up. Giving it more space to breathe would surely benifit legibility. But other experts probably fill you in on specific details.  </p>
      <p>cheerio Queneau</p>
