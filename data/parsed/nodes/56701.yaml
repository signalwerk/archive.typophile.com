      <p>@Queneau</p>
      <p>Thanks for sharing your thoughts.:-) My words are sort of verbose. If I could desig my own typeface, I will favor the two-story "a" &amp; "g" design. I want to point out that Xerox Sans is not a system font, like Georgia or Verdana. It's Xerox's corporate typeface which might show up on everything Xerox from corporate brochures to business cards (I tend to think so) except for the web. Aside pixelated Xerox Sans, Arial is still the web font at Xerox.com.</p>
      <p>I know Meta, Info and Officina use the more legible 2-story design of "a" &amp; "g". Looks like there is a little difference between these Spiekersans and Xerox Sans. As I said before, Xerox Sans' legibility is OK for me, but it won't be legible at extreme point size. </p>
      <p>I don't know if the blurring test is one of measurment metrics for a typeface's legibility. Any info will be much appreciated.</p>
      <p>@David</p>
      <p>Thanks for your input. :-) I will give it a try later.</p>
