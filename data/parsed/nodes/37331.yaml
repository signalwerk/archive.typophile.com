      <p>Hi Tal!</p>
      <p>Thank you so much for releasing these small tools as free software!</p>
      <p>There are two areas of your svn that do not have the MIT/X11 license though - <a href="http://code.typesupply.com/browser/applications/FeatureProof/trunk" title="http://code.typesupply.com/browser/applications/FeatureProof/trunk">http://code.typesupply.com/browser/applications/FeatureProof/trunk</a> &amp; <a href="http://code.typesupply.com/browser/applicationScripts/FontLab" title="http://code.typesupply.com/browser/applicationScripts/FontLab">http://code.typesupply.com/browser/applicationScripts/FontLab</a> - and although ""THIS SCRIPT IS SUPPLIED AS IS. NO WARRANTEES. NO GUARANTEES. NO QUESTIONS." has a certain sense of humour to it, it is non-free :-)</p>
      <p>I hope you can spare a couple of minutes to update the license of the code in these directories :-)</p>
      <p>Thanks again,</p>
      <p>--<br>
      Regards,<br>
      Dave</p>
