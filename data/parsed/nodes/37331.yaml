  html: |-
    <p>Hello Typophile,</p>
    <p>I have a few announcements to make...</p>
    <p>I have decided to open source a bunch of code that I have written for various type development tools. You can learn more at <a class="freelinking external" href="http://code.typesupply.com" rel="nofollow">code.typesupply.com</a> You might find the <a class="freelinking external" href="http://code.typesupply.com/wiki/FontLabScripts" rel="nofollow">FontLab Scripts</a> and the <a class="freelinking external" href="http://code.typesupply.com/wiki/FeatureProof" rel="nofollow">FeatureProof application</a> to be particularly useful.</p>
    <p>In other news, I launched a new Type Supply website at <a class="freelinking external" href="http://typesupply.com" rel="nofollow">typesupply.com</a> and started a blog at <a class="freelinking external" href="http://talleming.com" rel="nofollow">talleming.com</a>.</p>
    <p>That's all for now. Have fun!</p>
