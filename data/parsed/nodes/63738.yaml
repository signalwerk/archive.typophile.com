      <p>A few suggestions to take or leave:</p>
      <p>H - maybe very slightly too wide?<br>
      Q - tail's exit from the bowl looks indecisive. Perhaps intersection point at bottom should be at a more emphatic angle, or changed to a smooth.<br>
      S - top counter looks bigger than bottom - in the lowercase, too. Is that intended?<br>
      U - a touch narrow?<br>
      e - eye looks too big as my printer renders it at 9pt, but other sizes are okay so maybe this is a hinting issue? And Martijn is right about the strange drawing up top.<br>
      f - hook looks a bit cramped. If the x-height stays in this proportion, might you want to open up that space by having the hook come down less far? Also see t.<br>
      g - tail looks too rectangular for this font<br>
      s - see S.<br>
      t - yes, I've always thought that crossbar was too low.<br>
      y - / stroke looks light, and not steep enough?<br>
      period, comma - need to be bigger, and more distinct from one another</p>
      <p>I think the figures look very strong. 6/9 are great. Perhaps the five's acute angle comes down too far? </p>
      <p>I notice the little obliqueness to the terminals of the legs of R and K. Is that something you thought of trying with other diagonals, too?</p>
      <p>More generally, I think this x-height works well at smaller sizes but those extenders start to look pretty stunted once it's up beyond small text sizes.</p>
