      <p>Ok, finding I can't put this one away. I haven't done a clean sans before and it's quite tempting to try and resolve this.</p>
      <p>Hey Martijnm thanks! Yeah, the e is a bit crap. I can't visualise what shape's going to work best. I think the g is probably the worst glyph, I might have to change it to a single-storey version to make it work properly.</p>
      <p>Regards bubbliness, it looks like the overshoot hasn't been rendered quite right with the auto alignment zones. But I see the effect is interesting — maybe I'll lower the crossbars of f and t slightly below the x-height.</p>
      <p>EDIT: Oh, you know what, those crossbars are already quite a lot lower than the x-height. That would explain it :)</p>
