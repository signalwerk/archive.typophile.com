      <p>Yeah, I'm not sure how pleasant I find it. The overall feel is not very memorable or characterful. Partly I think the problem is I didn't have a clear concept or purpose for it so it's a bit vacant looking. And partly I just don't like the way I've resolved some of the shapes, they're just a bit clunky. A bit like a watermelon that looks sweet, juicy and refreshing but turns out to be a bit hard and watery.</p>
      <p>I think the caps have a potentially interesting voice, kind of cross between geometric and humanist.</p>
      <p>I don't think I'll continue with this one for now, not unless I have a sudden burst of inspiration. It would need a new lowercase, or at least a significantly smaller x-height and perhaps narrower proportions, before I felt comfortable with it. Still, a worthwhile learning experience and wow! the first time I've been able to feel like a font is done as far as I want!</p>
