      <p>When I view the running text sample at 100%, it has a friendly, bouncy, jovial quality to it.  That quality is partly due to the big round letterforms but also due to some serendipitous technical difficulty with hinting or antialiasing or something, so that round forms are made noticeably taller than non-round ones.  This "feature" disappears at larger sizes, which I think is a pity as it makes the text much less visually engaging.  I'd kind of like to see the bounciness made an integral feature of the font.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/melon_100_pct_6110.png"></div><p></p>
