  html: |-
    <p>This set of two woodtype improvisations, is printed in silver ink on Plike, the new sheet from Gruppo Cordenons.<br>
    The two designs are printed on the same sheet (8"x6.375"), but can be cut apart to make two 4" postcards.<br>
    (If I can find that perforating rule, I may perf them, but I don't know how well they would separate.)</p>
    <p>These designs are printed directly with type from our original 19th century Wood Type collection, along with small icons and copperplate cuts. They are 'improvisations' made in the moment, and printed on stock off cut from other jobs.</p>
    <p>The paper, Plike, has a solid matte color and a unique rubberlike quality. Hardly the typical letterpress sheet, but it takes the ink and impression beautifully.</p>
    <p>Printed on our 1930 Miehle V36 Cylinder Press at Slow Print Letterpress. <a href="http://slowprint.com" title="http://slowprint.com">http://slowprint.com</a> </p>
    <p>Available at exquisiteletterpress.etsy.com</p>
