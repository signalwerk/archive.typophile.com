    html: <p>It's only a book. Relatively few of the fonts in the Solotype collection were digitized before the company apparently ceased operation a couple of years ago. The Solotype collection (or the rights to their files) apparently belongs to Castcraft Software these days, but I have heard almost nothing of getting replies from them when writing about the Solotype collection. (I was one of them -- my mail was ignored.) I once got a listing of the typefaces on the Dover Solotype CD's and the Circus Fonts CD doesn't have Old Vic on it.</p>
