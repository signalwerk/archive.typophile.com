      <p>Mistral... hirrarious. Don't feel so bad, I work at zingy.com. Take a gander at that pile of garbage they call an identity. That's even after I cleaned it up and removed several unecessary elements. Luckily after two years I've convinced them to rebrand and I came up with a great new ID.</p>
      <p>It's all a process, frustrating and headache inducing to say the least, but it'll happen if you can convince them in an intelligent manner of why they need to rebrand. Try to get some cheerleaders that are close to the boss too, that always helps.</p>
      <p>I feel your pain. Best of luck,<br>
      tim</p>
