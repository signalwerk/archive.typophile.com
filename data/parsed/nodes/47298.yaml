      <p>If you want to offset a zine why not? It would be a good way to learn the process. Everyone is right, it won't be cheap but you can always try to make things more economical. If you want to use black plus one colour, plan your 32 pages with the imposition (the arrangement of the pages prior to folding) in mind. If you plan correctly you can produce a a two colour document on two plates.</p>
      <p>It sounds fun and the whole process is really rewarding.</p>
