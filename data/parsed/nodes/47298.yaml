      <p>The costs depend on the paper you choose and the printer (the company, not the machine). The best way to find out how much it's going to cost is to get several quotes from a bunch of local printers. </p>
      <p>As far as setup goes, it really depends on how you want the final product laid out. In the old days, you often had to make various adjustments to the file to account for how the document was going to be printed and folded, but these days, every printer i work with takes my files, paginates everything (so that pages get printed on the back of the correct pages so that when you're reading through it, everything is in the right order), makes the plates right from my files (no more printing film then making plates from that) and prints it.</p>
      <p>You _can_ print 100 copies of a 32 page booklet (the number of pages in your document has to be a multiple of four), but it's not going to be cost effective. That's a VERY small quantity, so all the various setup costs (printing plates, press setup, saddle stitch setup, etc.) will be spread out only 100 pieces, so your cost per piece will be very high. Even though it's only black and white, there's a still a lot of setup involved.</p>
      <p>You might want to look into digital printing. The quality can be quite nice (and some digital printers even use ink, rather than toner), and for that quantity, it'll probably be more cost effective than offset.</p>
