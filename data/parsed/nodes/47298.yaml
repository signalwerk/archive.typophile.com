      <p>I just wanted to clarify James' comment. For *low* runs offset printing is much more expensive. For a run of, say 500 copies of a small brochure, most of the cost is the setup of the press and in many cases, for large jobs, 100 sheets is a low estimate of how much paper is run through as "make ready."</p>
      <p>Once everything is setup however, the only additional costs are paper (relatively cheap) and pressman's time. That's why there are usually huge price breaks as you increase quantity. It might cost $1000 to print 500 brochures, $1500 to print 1000, $2500 to print 5000... you get the idea.</p>
      <p>Digital printing is super convenient for low runs, but there don't tend to be significant price breaks. It may be $25 per booklet whether you print 5 or 50 or 500.</p>
      <p>We use both offset and digital printing a lot and anytime you have a run of something between 300 - 500 it's an awkward middle ground where it's going to be too small for offset, but expensive for digital.</p>
