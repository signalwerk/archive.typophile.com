    <p>Okay, so i understand the basics of how its done,</p>
    <p>but can anyone explain the costs, the set up required, etc?</p>
    <p>I have some Zines I would like to produce more propperly.  The content is all vector and photo, but it would be awesome to print on nice paper and something be more propper than laser or photocopy.</p>
    <p>Is it possible to get 100 - 30 page booklets printed in black and white and maybe one spot color?</p>
