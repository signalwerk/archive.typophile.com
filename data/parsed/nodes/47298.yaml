      <p><cite>Is it possible to get 100 - 30 page booklets printed in black and white?</cite></p>
      <p>This is too small for even the short-run book printers to do offset. Print-on-demand technology only, which is   *not* offset. The images will be well-rendered, but the type won't be up to offset quality. You might find a small local print shop who'll do it, but the cost won't be attractive. Break even cost for offset is around 500 copies of a 100-pages.</p>
