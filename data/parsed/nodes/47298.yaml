      <p>Offset printing is much more expensive than digital printing or photocopying because maintenance of the press and setting up jobs is more complicated than it is with digital/photocopy. It’s also best done in larger quantities—at some shops the first 100 sheets through the press are just checked for problems before they go in the trash and adjustments are made. The big advantage is that the print quality is sometimes better than digital, special inks and coatings can be used, and one gets more paper choices. You can also use really cheap paper with offset printing to save money.</p>
      <p>There are now a lot of small printers who specialize in simple offset jobs at low prices. Take a look at <a href="http://www.printplace.com/" title="http://www.printplace.com/">http://www.printplace.com/</a> for your zine.</p>
