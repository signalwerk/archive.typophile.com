    <p>Hi,</p>
    <p>This logo is for a farm in Puerto Rico.  They are looking to market themselves as an agro-tourism destination and they will sell coffee and tangerines using the brand.  They want a an upscale/quality feel, not a traditional agricultural look.</p>
    <p>What do you think?</p>
    <p>Thanks,</p>
    <p>Edgardo</p>
