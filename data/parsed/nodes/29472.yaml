    html: |-
      <p>Yeah, the colors represent agriculture.  What I ment by agricultural-feel was to avoid traditional elements like obvious leaves, rivers, mountains, trees, crops, etc.</p>
      <p>The main concept is the environment of the Hacienda.  The “levels” you feel when you go there, the soil, the mountains around and the sky.  The circle put it all together and represents the products.  Using the star to represent the sun also segments the circle which produces pieces similar to what you find when you cut an orange/tangerines or other tropical fruit.</p>
      <p>Thanks for the feedback.</p>
      <p>E.</p>
