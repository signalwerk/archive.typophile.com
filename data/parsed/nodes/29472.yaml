    html: |-
      <p>First, i like it as it is, logo and font. Maybe a bit neutral.</p>
      <p>&gt;I worry that changing the font might make the product feel too upscale/luxury related</p>
      <p>I think the guys ment, that you can give it some more human touch with a serif/slab. Your use of the chosen font, which is an extended weight and all written in caps, goes in the upscale etc. direction already. I would try a slab, to check out how far i could go, for example with a slab-serif. Standards like PMN Caecilia, Scala Serif, to see how it works together.</p>
      <p>What you could try otherwise, following “the more human” direction, but stay “clean”:<br>
      I like the combination Avenir, Scala Serif a lot. Avenir has this slightly constructed feel and still being friendly. And Scala Serif for text. Both works good together, has nice contrast. </p>
      <p>Just my 2cents</p>
    html_clean: |-
