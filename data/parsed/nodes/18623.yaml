    votes: null
    html: |-
      <p>I would rather have a printer without PostScript at all than one with PostScript emulation.  If it doesn’t pretend to have PostScript, the computer (either Windows or Mac OS X) does all the rendering, so everything looks as it does on-screen, though it may print more slowly.</p>
      <p>If it has fake PostScript, the printer gets a PostScript program, and whether it correctly executes and renders it is anyone’s guess.</p>
