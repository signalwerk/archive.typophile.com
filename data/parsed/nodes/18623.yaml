    html: |-
      <p>Using a PostScript emulation may have downsides, e.g. HP’s had and may still have problems with interpreting hinting. (So I proof fonts unhinted.) But I would not put too much emphasis on the Adobe vs emulation PS. Say, you use an Epson laserprinter: This does have Adobe PS, but its text image too dark — not very useful either. There are many factors involved. In the end it is important that you can check if the design is consistent. Digital type has the disadvantage that the “real” design is imaginery, and no realization of it is “really” trustworthy.</p>
      <p>Karsten</p>
