      <p>It really depends on what your priorites are. Inkjet printers will usually provide better and more consistent color reproduction (especially for contone images), while laser printers will usually provide sharper and truer type. But regardless of what your priorities are, you’ll need a true PostScript printer for professional work.</p>
      <p>There are losts of great printers out there. Some cost less than $500. Others need to be leased for $6000/month.</p>
      <p>If I were a one man shop, I would buy a cheap PostScript Black and White printer for examining type and an inkjet like the HP Designjet 30 with EFI RIP for color proofing.</p>
