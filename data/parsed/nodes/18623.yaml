    html: <p>We seem to have this discussion a lot lately. My opinion is that a true PostScript printer is necessary if you are going to test anything typographic at smaller sizes. Unfortunately, PostScript printers seem exponentially more expensive that laster printers with PostScript emulators. But the output really shows a difference in the details!</p>
