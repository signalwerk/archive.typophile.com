      <p>I hope you don’t think I’m trying to hijack the thread, but I am in the same boat. My old Epson C84 has just stopped working and I’m trying to decide what to replace it with. I am a bit fed up with Epsons, this current one being at least the second in six years breaking down on me, but on the other hand, when everything works, they are excellent.</p>
      <p>The local Apple Store suggested Xerox Phaser 8500N (solid-ink printer), Xerox Phaser 6120N in Post Sript or Epson Stylus Photo R320 (ink-jet A4), the price order being from the most expensive to the cheapest.<br>
      I just browsed around for reviews, and the overall feeling seemed to be to go for the Epson.<br>
      As suggested in some earlier thread about printers, I have used pdfs as a replacement of a ps driver. Seems to work ok.</p>
