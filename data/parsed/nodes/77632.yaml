    <p>I'm doing the corporative design for a tshirt brand. I want the aesthetics of the b-movies but i dont want it to look trashy or bad-designed for the people that dont are used to that style.</p>
    <p>I had found 2 options but i want more.</p>
    <p>I though i could use perforama (the second one) but the A had so diagonal angles and the rest of the word that is the name of the brand has a lot of O and M and square things so it was a little problematic.</p>
    <p>What do you suggest?</p>
