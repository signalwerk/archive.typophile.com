    html: |-
      <p>I’ve renamed plenty of my fonts to reflect foundries/designers before, so that I can have (for example) different Helveticas on my system at the same time, and so that “Adobe Garamond” is under “Garamond” where it belongs, not alphabetized with the “A”s. I also converted some of my old postscript fonts to Opentype with Fontlab and named them so that I would know they were my conversions, should enhanced OT versions become available in the future from the vendor. I also have an aesthetic disagreement with vendors putting a trademark symbol in the font name.</p>
      <p>But Fontlab/Fontographer are certainly overkill for that task alone — I’m curious what suggestions people have, as well.</p>
