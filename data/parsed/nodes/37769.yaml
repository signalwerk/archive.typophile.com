      <p>Converting a font also voids and support or assistance you might receive from a foundry in the event of a problem. As someone who troubleshoots font issues regularly, I would have to say that “converted” fonts often cause a disproportionate amount of problems. Font naming is just one issue. As mentioned in other threads, FontLab’s “green gem” auto-naming icon is not sufficient to ensure fonts will work in all applications or across  operating systems. A converted font is just like a piece of software that has not been tested. It might work, but the probability of failure is higher. That’s why, for example, you can have confidence in Adobe’s fonts—the same files I’m using have been tested by hundreds of thousands of users. In the case of small vendors like Mr. Shinn, there may be relatively fewer customers. However the foundry takes personal responsibility for making the product function correctly. </p>
      <p>A lot of fonts that people think are “corrupt” or “damaged” didn’t damage themselves...</p>
