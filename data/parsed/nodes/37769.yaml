      <p>If your font is Open Type you can also use <a href="http://www.letterror.com/code/ttx/index.html"><strong>ttx</strong></a> which comes with <a href="http://www.adobe.com/devnet/opentype/afdko/"><strong>AFDKO</strong></a>:  first apply ttx on your ttf or otf font, then replace all occurrences of the font name by the new name in the resulting ttx textfile and finally apply ttx on it. On a unix system (a Mac for instance), you can avoid hand editing the ttx file thanks to the Unix <strong>sed</strong> command. You can then do everything with a three line unix script.</p>
      <p>Michel</p>
    html_clean: |-
