      <p>Concerning font renaming, here is a message taken from a publicly accessible list, dated  Oct 1, 2007 (four days ago):<br>
      </p><dl>
      <dd>
      <cite><br>
      I’m trying to change the Computer Modern fonts [...] from having lowercase names to having uppercase names since all the PDF’s I have refer to the uppercase (resulting in font not found errors in Illustrator or whatever). To this end, I wrote a [...] script to convert the names, but... this script apparently does more then just convert the<br>
      names to uppercase - it seems to corrupt a few glyphs.<br>
      </cite><br>
      </dd>
      </dl>
      <p>The font editor was not FontLab and the bug has been corrected since then but this reminds us that we should always keep a copy of the original font on a stable support (CD Rom, DVD) to make sure we can restore it when needed.</p>
      <p>Michel</p>
