      <p>Anyone of you saw White Stripes!? They had such a nice stage. So lovely designed.</p>
      <p>The whole stage and the equipment was painted in red.<br>
      <a href="http://images.freemusic.cz/koncerty/whitestripes/12.jpg" title="http://images.freemusic.cz/koncerty/whitestripes/12.jpg">http://images.freemusic.cz/koncerty/whitestripes/12.jpg</a></p>
      <p>On every side of the stage were hanging very nice banners.<br>
      <a href="http://sophiejarryonstageandback.neufblog.com/photos/uncategorized/the_white_stripes_zenith_paris_sjarry2.jpg" title="http://sophiejarryonstageandback.neufblog.com/photos/uncategorized/the_white_stripes_zenith_paris_sjarry2.jpg">http://sophiejarryonstageandback.neufblog.com/photos/uncategorized/the_w...</a></p>
      <p>They had also real palms painted in white on their stage. Nice Carpets everywhere on the ground. Many kitschy stuff, like cuckoo clocks, those little hawaian girls puppies that dances to the sound of the music. The whole area looked like a beautiful red livingroom. I wish my room were so comfortable.</p>
      <p>And by the way: The music and the show was breathtaking. I wonder how 2 people could entertain a hall so much.</p>
