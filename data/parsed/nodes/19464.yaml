    html: |-
      <p>Some misc. great music:</p>
      <p>Anyone courageous enough for something different in a foreign language, I can recommend anything you can get by Maria Dolores Pradera (from the Canary Islands). One of the richest voices in the history of mankind. </p>
      <p>And there are some incredible performances by Om Kolthom (Egypt), if you can get an ear for Arabic scales and instrumentation. Otherwise it is music to drive away unwanted houseguests. Few westerners are capable of enjoying this, but if you are feeling adventurous...</p>
      <p>Anything by Rhonda Vincent (killer bluegrass)</p>
      <p>Unforgettable by Terumasa Hino (standards by a Jazzman from Japan playing a cornet)</p>
      <p>Brad Paisley's guitar licks on Time Warp from the new CD (left me speechless) will confirm country musicians are stepping up to the plate as far as chops go.</p>
      <p>Some raw, heart-wrenching Mexican rancheras for those not offended by anything Mexican, can be found on the early works of Chavela Vargas. Later on she lost a lot due to excessive tequila drinking, I think.</p>
    html_clean: |-
