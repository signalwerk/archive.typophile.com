    html: <p>It is my understanding that app licensing and other independent software vendor licensing requires more legal expertise and negotiations for contracts. I wouldn't know from personal experience. The bottom line is if you think that the price is too high, don't pay it. At some point foundries and resellers will come to understand that this kind of pricing won't fly. Alternately, there will be enough people willing to pay the price and things won't change.</p>
