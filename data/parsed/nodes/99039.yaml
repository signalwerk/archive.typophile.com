      <p>As much as I admire and respect John, I don’t agree with his opinions on this topic. We (<a href="http://www.monokrom.no" title="www.monokrom.no">www.monokrom.no</a>) offer app licenses priced by units downloaded per month. It is certainly not a catch-all solution, but neither is licensing fonts for web nor print (think huge international magazine vs. student). With our app licenses, one of the goals was to offer a reasonable price for small and/or free projects. Up to 50 units downloaded* per month, the one-time fee per font is only slightly less than a regular 1–5 desktop license.</p>
      <p>* Meaning sold and/or given away for free.</p>
