      <p>"I may be wrong, but typefaces aren't typically sold based on the number of books sold that use them, are they?"</p>
      <p>Fonts are typically licensed based on the number of those who will make use of the font's compositional capabilities. </p>
      <p>I think this has been a great year for questions about how fonts are licensed, and a bit of a breakout year for ebooks, mags, and apps, while  game licensing of fonts just keeps humming along.</p>
      <p>Some might be puzzled by the unbelievable choice, but "sorry state" is, I think, a simplification.</p>
