      <p><em>pricing per unit is of course a sensible model, presuming a) there is a trackable distribution model for the app (such as downloads), and b) you can get the client to agree to ongoing payments.</em></p>
      <p>a) Downloads is always trackable, but probably not for us. We are fine with that and trust our customers to purchase a suitable license. This is not much different from desktop licenses.</p>
      <p>b) We operate with a one-time fee, so this isn’t an issue.</p>
      <p>Might I add:</p>
      <p>c) We are working on a solution for upgrades that allows the customer to deduct previous purchased licenses if/when downloaded units per month increases and they need a new license.</p>
