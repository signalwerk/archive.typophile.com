      <p>I'm not at all surprised that the license for including a font in an application is higher than licensing one copy of the font, since now the font will be used by everyone who buys a copy of the application - even if it is not directly accessible for use in other applications. (Word processors and graphics programs often come with full copies of fonts, usable by any application on the same computer. Their makers pay quite a bit to license those fonts.)</p>
      <p>This is not at all the same thing as you using the font, and making documents with it. You are literally reselling the font, from their point of view.</p>
