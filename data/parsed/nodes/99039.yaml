    html: "<p>If you are selling an app -- or making one available free on an ad revenue basis -- then you are making money from each copy of the app licensed to an end user. That means that the font embedded in the app is adding value and contributing to your income from each copy of the app licensed. So app embedding font licensing reflects that, and quite rightly: pricing reflects added value.</p>"
