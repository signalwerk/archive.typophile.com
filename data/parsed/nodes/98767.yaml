    <p></p><div class="imageWrap"><img src="http://typophile.com/files/words_poster_comp_4142.jpg"></div><p></p>
    <p>So I'm doing this poster and don't want to hassle with finding the perfect wood type, but I want something with a little more character that's available in digital. I'm currently using Grotzec X-Narrow Bold with some mods, but I'm not set on it. Hoping to get some other suggestions to very condensed grotesques that look a little more like wood type with interesting idiosyncrasies.</p>
    <p>Thanks for the help,<br>
    Joseph</p>
