  html: <p>For those of you who have read my posts over the past few days and weeks, it's obvious to see my concern and frustration with the current state of font development software. I want an application that does technically what Font Lab can do but I want it to work like Fontographer. <br> <br>So, let's redesign the Font Lab GUI and submit them to Yuri for potential integration! <br> <br>There is no question that our cumulative talents lie in design, not programming and since this is a design problem, not a technical one, we are the only folks who can affect change at a larger level with regard to this problem. <br> <br>I think a picture is worth a thousand words and will speak volumes to the Font Lab development team to know that this is a genuine concern for many of us on the boards designing type in our daily professional lives and it must be addressed. <br> <br>Here's what I propose . . . . <br> <br>Let's start with the current version of Font Lab - For those of you who don't own a copy, download the demo and work from that. <br> <br>Then from those elements, modify the GUI to something you'd like to see it become. Complete with shortcut buttons, icons, whatever you feel will get the point across and post it here as a gif for us to see and critique.  <br> <br>We'll critique the GUI's as we do typefaces and modify it accordingly till we arrive at a collaboratively designed GUI we all feel we'd like Font Lab to become or include in its options and present it to Yuri to integrate. <br> <br>If you think of it, without direction, Font Lab may never create a GUI that we feel is adequate for our purposes especially since they come from a programming background instead of a design background and all wish lists aside, we need to start from the current foundation of what we know Font Lab has in it now. <br> <br>Let the posting begin! <br>Stuart :D</p>
  html_clean: <p>For those of you who have read my posts over the past few days and weeks, it's obvious to see my concern and frustration with the current state of font development software. I want an application that does technically what Font Lab can do but I want it to work like Fontographer. <br> <br>So, let's redesign the Font Lab GUI and submit them to Yuri for potential integration! <br> <br>There is no question that our cumulative talents lie in design, not programming and since this is a design problem, not a technical one, we are the only folks who can affect change at a larger level with regard to this problem. <br> <br>I think a picture is worth a thousand words and will speak volumes to the Font Lab development team to know that this is a genuine concern for many of us on the boards designing type in our daily professional lives and it must be addressed. <br> <br>Here's what I propose . . . . <br> <br>Let's start with the current version of Font Lab - For those of you who don't own a copy, download the demo and work from that. <br> <br>Then from those elements, modify the GUI to something you'd like to see it become. Complete with shortcut buttons, icons, whatever you feel will get the point across and post it here as a gif for us to see and critique.  <br> <br>We'll critique the GUI's as we do typefaces and modify it accordingly till we arrive at a collaboratively designed GUI we all feel we'd like Font Lab to become or include in its options and present it to Yuri to integrate. <br> <br>If you think of it, without direction, Font Lab may never create a GUI that we feel is adequate for our purposes especially since they come from a programming background instead of a design background and all wish lists aside, we need to start from the current foundation of what we know Font Lab has in it now. <br> <br>Let the posting begin! <br>Stuart :D</p>
