    html: <p>Hee, hee. I like it. <br> <br>Sometimes, I think what would be good is if somebody could create a modern font editor that would use all our favorite elements from old FOG, adding a few new ideas to make it even better. BUT, leave out all the production-oriented stuff (hinting, advanced encoding, etc.). Instead, focus on the design and drawing stage (and maybe spacing and kerning). It would save the fonts in some standard format which could be brought into FontLab for finishing. <br> <br>As it is, this is how many people are using FOG now. So basically, it would be a stripped down FOG which would run on modern OS's. An alternative to FL's inscrutible (at least for some people) tools. <br> <br>On the other hand, don't you think that the difficulty inherent in font creation tools tends to filter out all but the most determined souls? If it was much easier, anyone could do it, there would be untold numbers of fonts available--people could even give them away!--and we would all be put out of business (he says only half seriously...).</p>
