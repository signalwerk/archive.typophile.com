    html: <p>That's what the $99 tool they created was for :D . . . <br> <br>I would be a hypocrite if I continued to complain about a lousy interface and not at least make some effort to re-design it myself or influence a GUI update to the application. <br> <br>While I agree with Alan that FL is to be praised for their efforts in getting the application this far, I do feel if they are serious about their financial success they would be inclined to make "minor" GUI enhancements to get a larger audience to purchase their product. <br> <br>Again, I think Font Lab is 98% there already and to modify the GUI may be only a few days effort since so much of it has been already programmed. <br> <br>I'd even be inclined to fly to Russia and sit over their shoulders to direct the effort - BUT since they're coming to town for Typecon, I can do it form here :D <br> <br>I think if we're talking about modifying the editor, there could be a nice opportunity to have different "modes" that one could toggle through for different tasks ala Drawing, Spacing, Kerning, and Hinting as well as a more integrated Font Generation suite. <br> <br>I still think it'd be cool to have a quick method to add alternate glyphs to a font and a quick kern for those . . . <br> <br>Stuart :D</p>
