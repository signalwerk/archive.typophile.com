    html: "<p>I'm all for providing Yuri &amp; Co. with feedback on interface and usability issues, but to propose a complete overall of FontLab seems to be asking too much at this point. I can only speak for myself, but I will say: <br> <br>I was a die-hard Fog4 user for ages. Bought FL3 to get into TT deltas and never used it much. Finally got FL4.5 the moment it came out, and have never looked back. <br> <br>Even coming from the programming side of things, the FontLab people have done an exceptional job of making things brilliant and easy. Many forehead-slapping moments of \"How could I have ever lived without this?\" Other things were confusing to me at first, but now I'm glad they're there. Sure, it needs some polish, but that will come. <br> <br>I would be curious to see what people come up with as their own ideas of how FL could evolve, but even as a paying customer, I feel more like thanking them profusely than demanding GUI adjustments to make the interface \"adequate\", which I feel it far overshoots. Suggestions about interface and workflow might be best posted on the FontLab user forum (<a href=\"http://groups.msn.com/FontLab\" target=\"_blank\">http://groups.msn.com/FontLab</a>). <br> <br>Just my opinion! <img src=\"http://www.typophile.com/forums/clipart/happy.gif\" alt=\":-)\" border=\"0\"> <br> <br>Now, as for improving Fontographer, that's another story ... <br> <br><img src=\"http://www.typophile.com/forums/messages/4101/11056.jpg\" alt=\"Fontographer 5 Preferences\"></p>"
