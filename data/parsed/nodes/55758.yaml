      <p>I always read "RF/MAX" and wonder why they never fixed such a clear failure of design.</p>
      <p>I suspect they may have been gearing up for a modern rebrand, which, as we have seen with Xerox et al, generally means setting the name in lowercase... and the Rehava logotype looks too much like what they wanted to change it to. To deal with that this way is even more ill-advised, but who among us can say they've met a realtor (er, "REALTOR®") with more sense than a fish?</p>
