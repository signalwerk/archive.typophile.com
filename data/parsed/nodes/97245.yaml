      <p><a href="http://www.myfonts.com/fonts/mti/blado/" rel="nofollow">Blado</a>, all lower case.</p>
      <p>The effect of using a foundry text type in display is that of the blow-up, a graphic effect which enhances the roughness of the image—the same effect as that of using a “hand-written” face. There is something of the <em>objet trouvé</em> in this, which gives it an artistic quality.</p>
      <p>The no-caps setting, which was a popular concept in the 1950s, further serves to distance the setting from a commercial title or headline; there is something poetic in this, in the manner of cummings, and something modern, in the manner of Bayer.</p>
