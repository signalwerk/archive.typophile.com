  html: |-
    <p>Hey everyone,</p>
    <p>I've been doing a year long typography project, and my limited selection of typefaces is making the project feel stale and laborious.  I need some fresh typefaces!</p>
    <p>I am particularly drawn to hand-written typefaces.  Not script, so much... but anything that looks like it was written by hand.  Fun, playful, fresh, etc... these are words I am drawn to.</p>
    <p>Do you have any recommendations that aren't going to break the bank?  </p>
    <p>Look forward to hearing your responses.. thanks!</p>
    <p>Jason</p>
