    html: |-
      <p>I'm basically fusing a quote with an image, every day for an entire year.  It's quite a lot of images so I'm looking to expand my type collection.  After nearly 300 images.. I'm hoping to bring some freshness!</p>
      <p>I'm not really looking for hand-writing, per se... just something to add some flavor.  It's a personal project so there is not really an audience exactly.  Some of the quotes are more playful or light though... so a typeface that reflects that would be great! (I assumed hand-written... but I'm open to other suggestions).</p>
      <p>I've enclosed a few basic examples of typefaces I thought reflected this 'feel'.  I'll post them in type ID ... but if you have any other suggestions -- it would be much appreciated.</p>
      <p>Thanks!  :)</p>
