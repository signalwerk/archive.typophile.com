      <p><a href="/wiki/Mark%20Jamra" class="freelinking" rel="nofollow">Mark Jamra</a> has set up several <a href="http://www.typeculture.com/academic_resource/research_directory/?L2=tcrd6_419#tc_6" target="new" rel="nofollow">resources for Type Educators</a> on his <a href="http://www.typeculture.com" target="new" rel="nofollow">TypeCulture.com</a> website.</p>
