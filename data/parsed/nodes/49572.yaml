  html: |-
    <p>An elegant new typeface suitable for setting books and magazines. <a href="http://www.typotheque.com/fonts/brioni/" rel="nofollow">Brioni</a> developed spontaneously from practice with a broad-nib pen, but the result is a hybrid of calligraphic influences and subtle manipulation of the stroke terminals. Available also as <a href="http://www.typotheque.com/fonts/brioni_text/" rel="nofollow">Brioni Text</a>, a sturdy slab serif for text of all sizes, but especially suitable for fine print. A highly functional typeface family that is easy to work with and inviting to read. Designed by Nikola Djurek, distributed by <a href="http://www.typotheque.com/" rel="nofollow">Typotheque.com</a>.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/brioni_text_4096.png"></div><p></p>
