    html: |-
      <p>If this is a department of a larger University, does it make sense, from the University's brand perspective, to have a completely unique logo?</p>
      <p>I suppose that's the big picture.</p>
      <p>If we want to focus on the smaller bits, then I would have "Volunteer" and "Services" in the same cap style –&nbsp;either all upper &amp; lowercase, or all caps, but not both.  None of these logos carry much of a sense of warmth, which would seem appropriate for a volunteer organization.  The tagline should provide additional sense about the group, not simply echo the logo (and vice versa).</p>
