  html: <p>I was curious what fonts would say 1990s (please no comic sans, grungy fonts, typewriter fonts or computerish/techy fonts). that were good then and still hold up today. Preferably from the first half of the 90s.</p>
  html_clean: <p>I was curious what fonts would say 1990s (please no comic sans, grungy fonts, typewriter fonts or computerish/techy fonts). that were good then and still hold up today. Preferably from the first half of the 90s.</p>
