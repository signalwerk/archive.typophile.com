      <p>a font that was (over)used in the 90s and still is used by some of the stick in the mud corporate folks who insist on doing their own 'design' work is ...</p>
      <p>copperplate *he shivers* </p>
      <p>for me, nothing says 'unimaginative and stubborn' like this font.</p>
      <p>optima and gill sans are on the fence as being faces i used a lot then, but sparingly now.</p>
      <p>i think futura and rockwell survived overuse pretty well. the varieties and readability are hallmarks that will keep them in the forefront for me.</p>
