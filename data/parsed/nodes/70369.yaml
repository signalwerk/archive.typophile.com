      <p>I find it absurd that you're asking for advice on a forum rather than work out the identity with your designer. </p>
      <p>If you don't know what's missing, and you didn't even think it was relevant to tell us what the company did before asking us to evaluate the proposed work, well, I'm sorry to have to tell you this, but you're what I'd call a total nightmare client. </p>
      <p>Your designer is the one you should be talking this through with, not us. Frankly, the conversation should be directly between the designer and the owner of BuyItBuildIt. </p>
      <p>The designer can't create a mark to represent a concept unless the concept is perfectly clear; THAT is exactly what's "missing." The concept becomes clear throughout the design process; and what you're doing here? You're asking a bunch of random strangers what the concept is! I can't think of anything more disruptive to logo design than your approach, dreamten. If you want a terrific result, trust your designer. </p>
      <p>I just checked out your website, and I was shocked to discover you've done identity design yourself. How would you have reacted if a client posted your preliminary sketches here?</p>
