    html: |-
      <p>Page 1 C<br>
      Page 2 C</p>
      <p>This icon strongly conveys (to me) what you're trying to say in three ways:</p>
      <p>1. It's like an instruction manual that's folded out<br>
      2. It's made of up four parts (1-2-3-4) and Buy It Build It is 1-2-3-4. A subtle visual rhythm...but its there in the syllables.<br>
      3. they evoke a staircase, and that says a lot of things: journey, process, structure... Now only if it were slanted to ascend...ascension is what the customer will get when they build their creation.</p>
      <p>Consider your staircase idea and refine it.</p>
      <p>I'd also look at how to treat the name. So far, you've always got the "I" in "It" in uppercase.</p>
      <p>BUYitBUILDit reads well to me also (not in this typeface, of course, but as a case treatment). I want the punch to be on the BUY and BUILD. "It" is subordinate and hangs onto its parents. BUY it BUILD it. See how it sounds out loud, and thats how it should read in your head.</p>
      <p>Page 2A is also good but I'm not convinced that there needs to be a double house. One house tag says it all. You might even let it dangle at an angle. That rhymed!</p>
      <p>...you could even have it dangle from the title. Being playful wouldn't hurt -- most of these examples feel corporate and stiff. The lyrical playfulness of BuyItBuildIt is betrayed by the upright, geometric, symmetrical examples.</p>
