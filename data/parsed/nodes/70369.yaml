    <p>I decided to source out the branding part of a a new e-commerce project for a client. I'm somewhat pleased with the work produced so far as is the client, but I feel there's something missing. None of the concepts produced strike me as great. Some are better than others, but even the better ones are lacking that polished feel. I'm stuck here and not sure what direction to take, so I've signed up for Typophile to see if I can get some feedback from the community.</p>
    <p>Of these concepts, which ones are your guys favorites and why? What would you suggest doing to improve them? I know the type needs a lot of work, so that would be the first place I'd start. Any ideas for the symbols?</p>
    <p>Thanks guys for any feedback you can provide.</p>
