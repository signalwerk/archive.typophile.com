      <p>Here is my layout for the "Vintage Hollywood" page, where I used Nick's "Londonderry Air" to depict the silent film era.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/screenshot-vintage-hollywoo_5265.jpg"></div><p></p>
      <p>The "photo-mounting corners" are from the Franklin Corners font. I'm old enough to remember those little adhesive corners that always fell off after a few decades. </p>
      <p>Yes, I got permission from the person who posted a high quality scan of the silent film actress from his collection.</p>
