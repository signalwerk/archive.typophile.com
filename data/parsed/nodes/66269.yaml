    <p>Hi,<br>
    I finished the costume book  <strong><a class="freelinking external" href="http://www.costumegoddess.com/books/tribal.htm" rel="nofollow">Tribal Vibes for Bellydancers</a></strong> I mentioned on this forum a few months ago. Thought you might like to see how I used Nick's font "Blandford Woodland" in a photo gallery spread. I bought this awhile back cause it's so beautiful, but never could find the right use for it before this. </p>
    <p>Here it is titling the "Shaman" costuming of a troupe.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/screenshot-shaman_6402.jpg"></div><p></p>
    <p>Here's what it looks like in the context of the spread called "Fantasy". The facing page featuring the Amazon costume is "Sultan" by Cananda type.<br>
    </p><div class="imageWrap"><img src="http://typophile.com/files/screenshot-shaman-amazone_4702.jpg"></div><p></p>
