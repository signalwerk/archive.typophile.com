      <p>I agree with both of you that roughness is a main attribute of this font. When I wrote "polishing" I didn't want to say smoothen. Surely typefaces like Kinesis, Delphin or even Scala were polished although they still look rough and informal. Look at their italics! They seem perfectly rough to me :)</p>
