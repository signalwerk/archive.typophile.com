      <p>Great feedback. Florian has a lot of similar elements going on. I'll try not to stray too far into its territory. But good to see how it's done well. I'm glad you brought up the b/d/p/q treatment since I felt there was something wrong there. I think this revised version sticks to the broad nib rules a bit more. Also, I think I've got the stem serifs all behaving similarly. I think. </p>
      <p>Q: should the top left of the /a/ get narrower like the bottom-right of the /e/ and /c/? I like how it is now but feel it should follow the broad-nib pen rules already in place.</p>
      <p>I think I jumped into the italics to just see what it might look like. It actually helped me figure out the personality of the roman. As a purely informal exercise, I think it helps to inform the designer on other decisions. With that said, I'm going to put that aside and work on the numerals now. :)</p>
