    date_raw: 21 Sep 2011 — 10:16am
    votes: null
    html: |-
      <p>Definitely making progress. I specially like A, B, E, s and y.</p>
      <p>Some thoughts:</p>
      <ul>
      <li>The inner and outer curve of the <em>n, h, m</em> have an urge to work together.</li>
      <li>Taper the shoulder of the <em>r</em> and push the entire arm a bit to the left. See if that helps. I think the curve of the <em>r</em> should be abrupter in matters of contrast. You can also try to straighten the curve at the joint (just the upper curve or both) and then gradually bend it . When the shoulder joins the stem at an almost collinear angle it needs too be lightened to compensate the illusion of the stem swelling. Just to say that, whenever possible, try avoiding dark spots.</li>
      <li>The <em>r</em> is difficult, but it's even more displeasuring to try to draw a smooth arc for the <em>U</em>. I detest drawing <em>U</em>s. Its straight-curve transition refuses to look good. Work on it. Perhaps you are luckier than me.</li>
      <li>The horizontal stroke of the <em>t</em> falls as if it was a plank fixed with one single nail. Hmm... Take care of that :). The bulk at the bottom of the stem doesn't look organic. As for the tail, the round curve from the outside doesn't match the inner crisp, straight lines (I'm not saying rounded lines can't match straight and edged ones, but in this case it doesn't).</li>
      <li>The dot of the <em>i</em> lacks of simplicity.</li>
      <li>The terminal of the <em>f</em> doesn't look integral, i.e. it is too abrupt.</li>
      <li>You decided to make the upper horizontal of the <em>Z</em> curved from below (like the <em>T</em>). That makes the right side, where it joins the diagonal, too dark. Making it straight at the right won't hurt, I think. That should settle what I think Jasper ment (maybe after also thinning the horizontals a bit).</li>
      <li>The spur of the <em>b</em> seems to float over the baseline.</li>
      <li>The tail of the <em>a</em> is too long.</li>
      <li>Flipping over the <em>n</em> to create a <em>u</em> may result very practicable. Nevertheless, the arc of the <em>u</em> usually starts later, closer to the bottom, producing a more bent curve than that of the <em>n</em>.</li>
      <li>The ascendent diagonal of the <em>x</em> may need subtle tapering.</li>
      <li>Add contrast to the <em>e</em>.</li>
      <li>Bendy knows best about the <em>N</em>.</li>

      <p>The upper diagonal of the <em>K</em> can be thinner.

      </p><p>The counter of the <em>K</em> is irregular inside. You made it straight at the bottom; I like that, but the angle it makes with the curve should be sharper if you wan't to distinguish it from the curve. 

      </p><p><em>X</em> doesn't look balanced 
      </p></ul>
      <p>Polishing your curves is very important, as Jasper stated. After working at your font, take a breath looking at other typefaces you like to compensate your visual accustoming to your design. </p>
      <p>Finally, it would be great to see samples of running text.</p>
      <p>Keep scrutinizing!</p>
