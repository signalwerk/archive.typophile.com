    html: |-
      <p>Still on the Roman:</p>
      <p>Great work again! It's already much better.</p>
      <p>I quite liked the cut at the right in the e, but that's just my opinion.<br>
      n h m u could all go a touch narrower.<br>
      I have the tendency to make the crossbars in f and t thicker towards the and, so this might just be me, but making it thinner towards the end just doesn't look right to me. They look too thin as a whole.<br>
      It has cuts in the bottom of the bowl in d, but not in c e.<br>
      Try to be a bit more rational (not too much!) and think of the actual structure that you're using. Looking closely at this (<a href="http://cyreal.org/typefaces/florian" title="http://cyreal.org/typefaces/florian">http://cyreal.org/typefaces/florian</a>) picture should show you a more rational approach to this idea. The cuts appear at the thinnest part of the curve, as they would with a broad-nip pen. Although this is (yet again) quite a big change I would at least TRY to place the cuts with broad-nip logic in mind, using this picture as a guideline. </p>
      <p>If you decide to keep the cuts the same you should review them all the same. The bottom of the bowl in d, looks heavier than the top of n, for example.</p>
      <p>This typeface would do great with short descender/ascenders, following a current trend. This is a stylistic choice that you should decide upon though, not me.</p>
      <p>To be honest I think you're moving on to the Italic a bit too fast, so I won't critique that for now.</p>
      <p>Keep going!</p>
      <p>Cheers,<br>
      Jasper</p>
