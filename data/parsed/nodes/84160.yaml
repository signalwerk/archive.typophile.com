      <p>Damn, this is some advanced stuff! First of all, I would like to see a pdf with some text samples, instead of jpg. For a textface, the upward serifs on the top of all stems are distracting. I can see that they are a main characteristic of the typeface, be I would rather have them pointing down. Actually, the same goes for your bottom serifs. For better legibility, just flip them horizontally. The italic allows you to play more with these concepts, but for a textface some of them are a bit too unconventional.</p>
