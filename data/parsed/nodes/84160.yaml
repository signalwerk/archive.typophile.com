    html: <p>I love the way this is progressing.  I like that it has details which are seriously cool when large but it still works well set small.  I disagree with Jasper that it's too early to start working on the italic.  Working on them simultaneously will help, as one informs the other and it helps keep them harmonious.  One of the biggest pitfalls I fall into it getting stuck on one particular font.  I even think it helps to be working on a few different typefaces at a time (not just weights and styles of the same font).  It stops you getting bored and what you learn from one can be applicable in another, nomatter how disparate they may seem...  Although this could explain why I have about ten unfinished typefaces languishing in a state of perennial limbo!</p>
