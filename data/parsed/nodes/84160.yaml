    html: |-
      <p>Wow! Great job again. You're a quick learner :-)</p>
      <p>I prefer the first /a/, this is really quite a personal choice. Go with what looks most natural, disregarding the method behind it.</p>
      <p>First of all, if you want to get useful feedback it would be wise to include a pdf with text at different sizes. I like what you've got going on here, and I would like to be able to print it, for better judgement.</p>
      <p>I'm not sure about the funky serif at the top left of n, m, u, etc. I like it's quirkyness and it's perfectly understandable if you want to keep it, but it might not result in optimal legibillity to keep it this way. If you do want to keep it like this, than I suggest you lengthen them only when attached to an ascender (b, d, h, k, l, etc.). They don't work at all in the u, but it's not terribly bad to use a different structure there.</p>
      <p>Download the RMX tools demo, from Tim Ahrens. Some of your outlines are just a little bit off (positioning of nodes, length of control points, etc.). The harmonizer from RMX tools will fix this easily, as well help speeden up the production process once you start making it into a complete family.</p>
      <p>You might want to make the bowl of the /a/ a bit more diagonal at the top, to match with the top of the /a/ (for both the first and the second /a/ in the picture above), but it's not particularly wrong the way it is now. I would also suggest to make the middle bar in /a/ thinner, as well as the middle bar in /e/. I can see the logic behind it, but it just looks a little bit too thick to my eyes.</p>
      <p>I would like the bottom right serif in /a d u/ to point up a bit, or maybe even make them into tails.</p>
      <p>The bottom right of e and c ends a bit too low IMO. They should roughly match the bottom right of the bowl in d.</p>
      <p>I would like to see the bar in /e/ a bit more straight (shorten the part that turns up), like it used to be in earlier versions.</p>
      <p>It's your typeface off coarse, but I hope you carefully considered keeping the ballish terminals in /a c f, etc/, instead of just going the Florian way ;-) I quite liked those.</p>
      <p>The bar in f and t should be thicker. Roughly the same thickness as the bottom of the bowl in d.</p>
      <p>w is too wide, but I like the structure.</p>
      <p>The gap between the serifs in x, is larger at the top than it is at the bottom. Should be the other way around.</p>
      <p>Consider (just CONSIDER) to make the serifs in s and z more diagonal.</p>
      <p>r is too wide and the arm looks a little bit off.</p>
      <p>For better legibility, consider (just CONSIDER) a more horizontal ear on the g.</p>
      <p>/C D G O Q T/ should be wider IMO.</p>
      <p>The curves in D should be fuller. Extend the control points.</p>
      <p>The modulation in the bowl of P and R is off. It looks as if there's a straight piece (bottom of the bowl) attached to the top of the bowl.</p>
      <p>Lengthen the tail on Q a bit.</p>
      <p>I would like to see diagonal strokes all over in the M, but I must say it's a cool quirk.</p>
      <p> DON NOT TAKE ANYTHING I SAY FOR GRANTED. IT'S YOUR TYPEFACE, NOT MINE. If this long comment comes across as harsh feedback, it's not. I'm just a perfectionist. You got talent.</p>
      <p>Keep going! It'll be worth it :-)</p>
      <p>Cheers,<br>
      Jasper</p>
