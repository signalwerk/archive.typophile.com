    html: <p>Designed by <a class="freelinking external" href="http://www.kontrapunkt.com/news/new-responsive-website-faurschou-foundation" rel="nofollow">Kontrapunkt</a>. Renko's call of Houschka would surely provide a good base font, probably the closest one (/M to be tweaked). Mixing <a class="freelinking external" href="http://www.myfonts.com/search/museo" rel="nofollow">Museo and Museo Sans</a> plus some little tweaking could work as well. <a class="freelinking external" href="http://www.myfonts.com/fonts/marksimonson/proxima-nova" rel="nofollow">Proxima Nova</a> even if top rounded /A needs to be reconstructed would be another option.</p>
