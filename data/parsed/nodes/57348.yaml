    html: <p>Thanks, that's exactly the sort of purpose it's meant for--placing semi-secret messages on machine grates and similar things. It probably would have to be laser cut for a similar application to what the MyBook case has. A stamping die that fine might be difficult to create and maintain with all these curves. Something injection molded like a car grille shouldn't be as hard.</p>
