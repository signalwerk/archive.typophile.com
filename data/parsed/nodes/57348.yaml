  html: |-
    <p><img src="/sites/default/files/old-images/CodePeanut-one-sample_3793.png"><br>
    I came up with this to make a random looking texture pattern of large and small circular blobs. The pattern of the characters is based on Morse code, the dahs represented by circles three times the diameter of the dits, all enlarged slightly to overlap and then the joints were smoothed. I have only rendered the basic alphabet A-Z, copied to a-z. Other characters (punctuation, numerals, accented characters) are currently filled with a temporary 90° rotated I glyph.</p>
    <p>The image above is from dummy text generated by <a href="http://judebear.daveward.net/" title="Click to visit an external URL." class="freelink freelink-external freelink-external">MacLorem</a>.</p>
