    date: 2002-11-25T07:46:00
    date_raw: 25.Nov.2002 7.46am
    votes: null
    html: "<p> That would be \"Multiple Master\" technology. Sorry about the spelling mistake, but I got so worked up by this that I almost tripped over myself writing this post. And Anonymous, don't get me wrong, the following rant is not aimed at you. Don't get caught in the crossfire. <br> <br>I mean, everywhere I look I keep bumping into Adobe Sans or Adobe Serif: on menus, in magazines and newsletters, on wrappers, on huge friggin' billboards... even on my yoghurt pot at breakfast and on the jars of my favourite brand of rice sauce. Don't all these designers, art directors or whoever they might be have eyes and see that the typefaces they so carefully specified were missing when they output the files and came out all wrong? I kid you not, within the space of a couple of months we received two logos with Adobe Sans converted to outlines. Which is doubly ironic because converting your fonts to outlines is exactly what you do when you want to avoid having your typeface being replaced by ATM! Aaargh, this is driving me NUTS! (wheeze wheeze pant pant) <br> <br>Okay, okay... <br> <br>I'm calm now. <br> <br>This was my little Doctor Jeckyll and Mister Hyde episode. <br> <br>It won't happen again. <br> <br>Excuse me for shouting. <br> <br>I really had to get this off my chest. <br> <br> <br>P.S. My colleagues often tell me they're happy they're not me, because I keep noticing these kind of things and sometimes get all worked up over them. </p>"
