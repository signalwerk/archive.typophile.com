    html: <p> That's Adobe Sans, the horrendous substitute font which ATM uses whenever the original fonts are not available on the user's computer system. This allows the user to read and print documents which feature those missing fonts. It's a chameleon-like typeface that uses Multiple Matser technology to match the widths of the missing font in order to take up exactly the same amount of space. It finds those widths in the "ATM font database", a file in your System folder that includes the widths tables of almost every single typeface in the Adobe Type Library. So in fact this could be any typeface. </p>
    html_clean: <p> That's Adobe Sans, the horrendous substitute font which ATM uses whenever the original fonts are not available on the user's computer system. This allows the user to read and print documents which feature those missing fonts. It's a chameleon-like typeface that uses Multiple Matser technology to match the widths of the missing font in order to take up exactly the same amount of space. It finds those widths in the "ATM font database", a file in your System folder that includes the widths tables of almost every single typeface in the Adobe Type Library. So in fact this could be any typeface. </p>
  - id: 29060
