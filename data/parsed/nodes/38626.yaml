    date_raw: 13 Feb 2008 — 4:36am
    date: 2008-02-13T04:36:00
    votes: null
    html: "<p>I think things are clearly getting better! The bold seems to have really come into it's own! Here are some suggestions: About the thin parts - their use could be nice but because they only occur in some letters &amp; not in others it creates an uneven effect which I think isn't ideal. I think you should decide to keep them &amp; expand their use or make  the thinking more subtle. The spacing between letters is getting much better. It seems more right in the case of the bold still. With the lighter weight I would consider gently narrowing the wider openings c, o, b etc and keeping your overall spacing scheme. Or letting the lighter letters' spaces open up more to match the counters. If it was me I would go with the 1st option because it would make the face more versatile. The second option is a good one for making a display face because it plays to the distinctiveness of what you have. I think the g is still not quite what you want but it is an improvement. What about an more typical one store g design and leaving this one or a similar design as an option? Your design seems like it would be a natural home for a one g with just one level. If you want to keep the double story the bold g you have is the better one. And actually I quite like it, but I think it needs an ear to work perfectly. There is something odd about the lc o I can't say for sure what it is. Maybe it's an artifact, but does it have the same height and depth as your lower case e? Probably it should. The nearly touching in the ft &amp; FT seems like something to fix. Either let them overlap or don't. I would not. Congratulations on great progress!</p>"
