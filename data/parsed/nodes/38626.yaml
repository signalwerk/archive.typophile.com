    html: <p>I can't speak to the cyrillic, but the latin lc x seems too wide. The Narrow bits seem a little too narrow. It's interesting how different the words veldt, and zephyrs seem like they fit well. Look at the others &amp; see if they do as well &amp; if not why. The top of the e might overshoot a bit more. Does it go as far as the o? Look at the space between the i &amp; c in quick. Now look at the other side u &amp; i. They feel too different.</p>
