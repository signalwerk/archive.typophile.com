    html: |-
      <p>Jelmar (Quincunx ) is right.</p>
      <p>I find that the bold is working better than the light. </p>
      <p>The strech feeling comes mostly from big apertures in the p p q &amp; o. They look stretched. The others don't so much. They need to match. </p>
      <p>Look at the spaces between the letters. Look at the spaces inside. see how the big openings don't work with the letter spaces? They need to relate to each other &amp; feel good together. Sculpt that white &amp; forget the black for a while. Then when you can see the white spaces properly come back to the black &amp; then see them together.</p>
      <p>I think the leg on the cap L is a very good width.</p>
      <p>The g needs reconsidering.</p>
      <p>The tooth on the Cap C seems like it's too much.</p>
      <p>Before you get too crazy - ask yourself ( and maybe tell us ) - what is this for?  The better answer to that question you have the better the font.</p>
      <p>Keep going.</p>
