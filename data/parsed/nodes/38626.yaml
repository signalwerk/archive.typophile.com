      <p>Looking at this image I thought of this inside &amp; outside balance that I keep talking about.</p>
      <p><a href="http://ilovetypography.com/img/arnhem-2.gif" title="http://ilovetypography.com/img/arnhem-2.gif">http://ilovetypography.com/img/arnhem-2.gif</a></p>
      <p>I should note that this designer, in addition to keeping a nice balance of inside &amp; outside white has done something else as well, something that you may or may not want to do. He has kept the width of the glyphs constant instead of making them wider as they get bolder which is more common and which may be easier.</p>
