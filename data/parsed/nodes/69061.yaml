      <p>There is a Typowiki on font naming: <a href="http://typophile.com/node/32594" title="http://typophile.com/node/32594">http://typophile.com/node/32594</a> with links that are worth having a look at.</p>
      <p>To get the name table as an xml file, you can use <a href="http://www.letterror.com/code/ttx/index.html"><strong>ttx</strong></a>; ttx also comes with the Adobe Font Development Kit for OpenType (<a href="http://www.adobe.com/devnet/opentype/afdko/"><strong>AFDKO</strong></a>).</p>
      <p>ttx -t name fontname.otf</p>
      <p>will give you the file fontname.ttx with more names than you seem to have found.</p>
      <p>Michel</p>
