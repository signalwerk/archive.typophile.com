    html: |-
      <p>Hello!<br>
      update Glyphs to 1.2 to be able to set an anchor for nodes alignment.<br>
      Notice that it aligns the nodes to the path's smaller edge.<br>
      If you need more control, open the lock in the info box and set the width or height to 0.</p>
