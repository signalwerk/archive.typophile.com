    html: |-
      <p>no, paths.<br>
      the align buttons on the palette align entire paths but not nodes within a path.<br>
      To align 2 or more nodes (or anchors) use shift+cmd+a.</p>
      <p>Did you read the Glyphs guide?<br>
      <a href="http://glyphsapp.com/dateien/GlyphsHandbook20111222.pdf" title="http://glyphsapp.com/dateien/GlyphsHandbook20111222.pdf">http://glyphsapp.com/dateien/GlyphsHandbook20111222.pdf</a></p>
