      <p>As for the one listed here:<br><a href="http://www.buyfonts.com/value_for_money/bodoni.htm">http://www.buyfonts.com/value_for_money/bodoni.htm</a></p>
      <p>It's not clear if it's in PS or TTF format.<br>
      If the latter is the case, since OS X, Macs are capable to use Windows TTF fonts.<br>
      Moreover, with Adobe apps you could place Windows PS fonts in the application Fonts folder and you can use it.</p>
