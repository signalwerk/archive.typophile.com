      <p>At <a class="freelinking external" href="http://www.webtype.com" rel="nofollow">Webtype</a>, we optimize the rendering of our fonts for both legibility and loading time and we also offer the ability to subset by character set to improve performance further. Many of our customers use Webtype for their entire sites and haven't noticed any performance issues. For example, check out <a class="freelinking external" href="http://www.loewe.tv/int" rel="nofollow">Loewe</a>, which uses 5 variations of Benton Sans.</p>
      <p>Also, we offer several versions of Benton Sans and Benton Modern specifically designed from the ground up to be used at small sizes--<a class="freelinking external" href="http://www.webtype.com/font/bentonsansre-family/" rel="nofollow">Benton Sans RE</a> and <a class="freelinking external" href="http://www.webtype.com/font/bentonmodern-re-family/" rel="nofollow">Benton Modern RE</a>--from the <a class="freelinking external" href="http://www.fontbureau.com/ReadingEdge/" rel="nofollow">Reading Edge</a> series. Many customers pairs these with the display-sized versions of Benton Sans/Modern on their sites.</p>
