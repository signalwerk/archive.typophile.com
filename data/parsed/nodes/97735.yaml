      <p>Yes. If you are using the font in one place on a page, using it everywhere on the page will engender zero additional load time. I don't know the details of Webtype's back end, but if it's like ours at WebINK, if they encounter the font anywhere on the site, it is loaded once and remains cached. In our case, for up to a month.</p>
      <p>So no, performance is almost certainly not a reason to not use your web fonts more widely. It will help you avoid the dog's breakfast problem you have now where you are using four different typefaces. Ick.</p>
