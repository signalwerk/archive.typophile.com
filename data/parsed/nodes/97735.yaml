      <p>You do use the webfont versions, which are optimized for loading speed and screen use, don't you?</p>
      <p><cite>What is everyone's experience with using web fonts? Use them pervasively or sparingly?</cite></p>
      <p>There is no black or white answer. You need to test different sizes and browsers and see how the webfont performs, especially in copy text. If you texts become less legible than when set in Arial or Georgia, you might not want to use them in certain sizes.</p>
