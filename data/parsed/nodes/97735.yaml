  html: |-
    <p>I have been butting heads with my lead developer lately about how much and how often we should use our brand-approved web fonts. These fonts are Benton Modern and Benton Sans. I would like to maybe even use these fonts for all type on the site instead of trying to pair them with Arial and Georgia. My developer is pushing back because of load time. He'll say "that's a lot of text for a web font"—wanting to only reserve the web font for special instances. </p>
    <p>I was under the impression, that once you load a webfont, it's loaded. It wouldn't matter how much you use it within the page. That it would load as fast if you use it for one word, or 1,000 words. We do have a very large site, which is editorial-based with lots of content and I certainly wouldn't want to slow the site down. </p>
    <p>What is everyone's experience with using web fonts? Use them pervasively or sparingly?</p>
