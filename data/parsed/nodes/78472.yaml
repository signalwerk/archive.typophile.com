      <p>There's a very simple reason why the distraction of traps at large sizes is irrelevant: you're not supposed to set a text font large! If you do, much worse things happen than mere distraction. What you're supposed to do is design special cuts for large sizes, and those shouldn't have trapping (except possibly for style).</p>
      <p>A corollary: any font that looks good large isn't an optimal text font. And for a sub-optimal text font you can forego traps, sure.  :-)</p>
      <p>Trapping is increasingly more common these days. Why? The same reason optical sizes are more common now than at any time since the beginning of the 20th century: because people care more now. Not everybody, but enough people.</p>
      <p>BTW:<br>
      <a href="http://themicrofoundry.com/ss_trapping1.html" title="http://themicrofoundry.com/ss_trapping1.html">http://themicrofoundry.com/ss_trapping1.html</a></p>
      <p>&gt; And this does not mean that there are no traps in the design of Adobe Garamond.</p>
      <p>Actually, it is important to note here that Slimbach does not believe in trapping.</p>
      <p>hhp</p>
