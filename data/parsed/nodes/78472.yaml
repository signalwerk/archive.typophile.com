    html: <p>Inktraps are commonly added to fonts that will likely fill with ink at their intersections. Newspaper and phone book types like Retina and Bell Centennial are the most extreme cases. They have extensive and deep traps because they’re meant to be printed on the worst paper available at damn near the highest speeds possible. Narrower fonts tend to have more traps because tight intersections form dark spots, and in some very condensed display faces traps are added just to equalize the balance of light and dark without breaking the rhythm of the design by making a letter too wide or adding extreme tapers. A book face like Adobe Garamond is fairly wide and was not commissioned to deal with specific printing problems so it doesn’t need much trapping. A more extreme example is ITC Giovanni—also by Slimbach—which has little or no trapping but can still hold up to printing on cheap pulp because it is very wide and has a huge x-height. And this does not mean that there are no traps in the design of Adobe Garamond. There are, but the entire French renaissance book type genre has its own style of trapping dark intersections with tapers and angles rather than the notch traps people tend to think of.</p>
