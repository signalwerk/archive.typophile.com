      <p><em>So, as inktraps can be distracting at display sizes, would it not be better to leave them out? </em></p>
      <p>They may provide visual interest at headline size (decoration, dare it be said), which is true of all fine details, whatever their function in small text.</p>
      <p>Freight Micro is another face which, like Bell Centennial, has been exploited for this quality in display settings by clever art directors.</p>
      <p>More "ink-trapped" faces: Amplitude and Griffith Gothic, and my Worldwide and Walburn. </p>
      <p><em>…with the current printing technology, I wonder if inktraps are still needed.</em></p>
      <p>Yes; there is huge press gain on newsprint, a close cousin of blotting paper.</p>
