    <p>Hello everybody,</p>
    <p>The question above doesn't refer to the original function of inktraps, as that is rather obvious. It refers to the fact that, with the current printing technology, I wonder if inktraps are still needed. I think (not sure though) that most typefaces are designed for offset printing. What first got me thinking about this is that Adobe Garamond (a very commonly used book- and magazine typeface) doesn't have any inktraps. Infact, all corners are softened, but when I read a book set in Adobe Garamond it looks fine to me. So, as inktraps can be distracting at display sizes, would it not be better to leave them out? Any help on this is much appreciated.</p>
    <p>Cheers, Jasper</p>
