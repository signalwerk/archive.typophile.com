    html: <p>If you get Microsoft <a href="http://www.microsoft.com/typography/developers/volt/default.htm?fname=%20&amp;fsize=" target="_blank"> VOLT</a> (Visual OpenType Layout Tool), the supplemental files contain a <i>really</i> nice Arabic font complete with substitution tables for initial, medial, final, and isolate forms, mark positioning, ligatures, etc.</p>
    html_clean: <p>If you get Microsoft <a href="http://www.microsoft.com/typography/developers/volt/default.htm?fname=%20&amp;fsize=" target="_blank" class="link-external"> VOLT</a> (Visual OpenType Layout Tool), the supplemental files contain a <i>really</i> nice Arabic font complete with substitution tables for initial, medial, final, and isolate forms, mark positioning, ligatures, etc.</p>
  - id: 66068
    user: 1262
    date: 2003-02-28T11:11:00
    date_raw: 28 Feb 2003 — 11:11am
    votes: null
    html: "<p>Actually, the version of the Arabic Typesetting font that is available with VOLT is a pretty early alpha version. It's been completely redesigned since then, and a lot of new stuff has been added. The new version, however, will not be available as a sample font from the VOLT community: it will be shipping with future MS products.  <br>  <br>Another thing to bear in mind is that not every Arabic typeface is appropriate for setting Farsi text, even if the Farsi character set is supported. There are long-standing stylistic preferences among users of what is nominally the Arabic script, and fonts that are appropriate for use in Arabic text in, for example, Egypt are not appropriate for Urdu text in Pakistan. I'm afraid I do not know enough about Farsi to identify the stylstic differences between Farsi and Arabic type styles, but I know they are significant enough for Farsi users to have requested a distinctively Farsi font from Microsoft, despite the availability of numerous Arabic fonts.</p>"
    html_clean: "<p>Actually, the version of the Arabic Typesetting font that is available with VOLT is a pretty early alpha version. It's been completely redesigned since then, and a lot of new stuff has been added. The new version, however, will not be available as a sample font from the VOLT community: it will be shipping with future MS products.  <br>  <br>Another thing to bear in mind is that not every Arabic typeface is appropriate for setting Farsi text, even if the Farsi character set is supported. There are long-standing stylistic preferences among users of what is nominally the Arabic script, and fonts that are appropriate for use in Arabic text in, for example, Egypt are not appropriate for Urdu text in Pakistan. I'm afraid I do not know enough about Farsi to identify the stylstic differences between Farsi and Arabic type styles, but I know they are significant enough for Farsi users to have requested a distinctively Farsi font from Microsoft, despite the availability of numerous Arabic fonts.</p>"
