    html: <p>Farsi, of course, uses the Arabic script.  I don't know off-hand what the best Arabic fonts are, but a few of the OpenType fonts that come with Windows have Arabic glyphs.  You will need an editor that allows right-to-left text input. <br> <br>Paul</p>
    html_clean: <p>Farsi, of course, uses the Arabic script.  I don't know off-hand what the best Arabic fonts are, but a few of the OpenType fonts that come with Windows have Arabic glyphs.  You will need an editor that allows right-to-left text input. <br> <br>Paul</p>
