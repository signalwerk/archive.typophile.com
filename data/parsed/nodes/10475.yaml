    html: "<p>I don't know a lot about Thai typography, but IMHO these are some decent Thai fonts for long copy - e.g., they have the loops on them (font followed by vendor): <br> <br>Thonburi (Apple Singapore) <br>Iris (Unity Progress) <br>Merrimia (Unity Progress) <br>Eucrosia (Unity Progress) <br>Kinnari (National Font) <br>Narai (DB Designs) <br>Charnchai (JS Technology) <br> <br>If I'm not mistakem, Iris and Eucrosia are installed on Windows machines that are set up for Thai. And there's always the work-horse Angsana which comes bundled with Windows too. Decent headline fonts in Thai...Lily (UPC) and Imperial (PSL SmartLetter) are \"sans\"-style faces. I think Kobori is what you see on most of the newspapers. And when I was there, I saw Siara (PSL) and Pumpuang (JS) used quite a bit in advertising. They're highly latinized faces, complete with serifs if you're into that sort of thing. <br> <br>Hope this helps.</p>"
    html_clean: "<p>I don't know a lot about Thai typography, but IMHO these are some decent Thai fonts for long copy - e.g., they have the loops on them (font followed by vendor): <br> <br>Thonburi (Apple Singapore) <br>Iris (Unity Progress) <br>Merrimia (Unity Progress) <br>Eucrosia (Unity Progress) <br>Kinnari (National Font) <br>Narai (DB Designs) <br>Charnchai (JS Technology) <br> <br>If I'm not mistakem, Iris and Eucrosia are installed on Windows machines that are set up for Thai. And there's always the work-horse Angsana which comes bundled with Windows too. Decent headline fonts in Thai...Lily (UPC) and Imperial (PSL SmartLetter) are \"sans\"-style faces. I think Kobori is what you see on most of the newspapers. And when I was there, I saw Siara (PSL) and Pumpuang (JS) used quite a bit in advertising. They're highly latinized faces, complete with serifs if you're into that sort of thing. <br> <br>Hope this helps.</p>"
