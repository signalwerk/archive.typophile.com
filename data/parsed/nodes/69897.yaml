    <p>Pilar Cano's beautiful typeface Edita, is taking part in the type exhibition "Lletres de Barcelona", open from the 19th to the 30th April in Amiens, France. The exhibition is organised by Sébastien Morlighem and the ÉSAD (école supérieure d'art et de design d'Amiens), showing the work of various established Spanish type designers, including Andreu Balius and Laura Meseguer.</p>
