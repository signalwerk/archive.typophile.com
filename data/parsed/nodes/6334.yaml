    html: '<p>Markus, I just read your profile, and noticed that you are just around the corner in Darmstadt (I live in Wiesbaden). Do you study there? <br> <br>For a few months now, a few students from the HfG and I have been organizing regular Typo-Stammtisch evenings in FFM/Sachsenhausen. Our next one is one is on Tuesday the 31st, and if you are even the least bit interested in type design, your should come. (This invitation goes for anyone else who might be in the Rhein-Main area, and reading this!) <br> <br>Mehr Info zum Typostammtish: <a href="http://www.typeoff.de/typostammtisch" target="_blank">http://www.typeoff.de/typostammtisch</a></p>'
