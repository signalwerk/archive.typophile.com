    html: <p>Karlgeorg Hoefer has been dead for over four years, unfortunately. He taught at the HfG Of for decades, from the end of WWII until his retirement in 1979. Calligraphy has not been taught at the HfG since the late 1980s, at least. Type design hasn't been really taught there either since the early 1990s (and won't ever be again, so I hear), evern though a lot of students engage in a bit of it</p>
