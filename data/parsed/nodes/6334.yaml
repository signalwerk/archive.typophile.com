    html: <p>Dan, thanks for all the info. I was aware that K. G. Hoefer died some years ago. It's a pity, that type design education has become less important in Offenbach since his retirement (there are not so many cultural highlights in this city anyway in my opinion, and the Schriftklasse was said to have a high reputation). <br> <br>I am not a design professional -- I studied in Darmstadt, but nothing related to art. Nevertheless I am interested in the Stammtisch (thanks for the invitation), but unfortunately I am on a move away from Darmstadt next week, since I finished my studies. So probably I won't have the time to visit Sachsenhausen. <br> <br>Markus</p>
