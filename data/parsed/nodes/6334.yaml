    html: <p>Dude, I am definitely the person to ask. <br> <br>I graduated from RISD in the United States (BFA Graphic Design 2001), and am now studying typography in Germany. <br> <br>First of all, be prepared for a lot of beaurocracy, which will often be contradictory. <br> <br>If you already have a bachelor's degree, you may be able to transfer halfway into a German Diplom program. German Diploms are technically equivalent to Masters' Degrees, even though the British have recently challenged this. Almost all German college students graduate with this one degree, which normally takes anywhere from 4 to six years to complete. The German government is trying to phase in BAs and MAs, but it hasn't hit the serious art schools yet. <br> <br>In order to study graphic design as anything other than an exchange student for a semester or two, you must speak German. You must pass exams. Some states require you to have already passed the exams before you can even apply, like Baden-Würrtemberg. <br> <br>Some states will charge you a 500 Euro per semester tuition fee, because you already have a foreign degree, like Nordrhein-Westfalen. German higher education is still generaly free, but I would be willing to bet that this would change while you would be enrolled. Be prepared to have to spend more money than expected to finish your degree if you start one. <br> <br>There are two types of university in Germany, Universit</p>
    html_clean: <p>Dude, I am definitely the person to ask. <br> <br>I graduated from RISD in the United States (BFA Graphic Design 2001), and am now studying typography in Germany. <br> <br>First of all, be prepared for a lot of beaurocracy, which will often be contradictory. <br> <br>If you already have a bachelor's degree, you may be able to transfer halfway into a German Diplom program. German Diploms are technically equivalent to Masters' Degrees, even though the British have recently challenged this. Almost all German college students graduate with this one degree, which normally takes anywhere from 4 to six years to complete. The German government is trying to phase in BAs and MAs, but it hasn't hit the serious art schools yet. <br> <br>In order to study graphic design as anything other than an exchange student for a semester or two, you must speak German. You must pass exams. Some states require you to have already passed the exams before you can even apply, like Baden-Würrtemberg. <br> <br>Some states will charge you a 500 Euro per semester tuition fee, because you already have a foreign degree, like Nordrhein-Westfalen. German higher education is still generaly free, but I would be willing to bet that this would change while you would be enrolled. Be prepared to have to spend more money than expected to finish your degree if you start one. <br> <br>There are two types of university in Germany, Universit</p>
