    html: |-
      <p>Florian,</p>
      <p>I don’t think it looks like Mendoza at all.</p>
      <p>Look at the capital M, which in Mendoza has less of an angle from its base to its top, while in the sample it is much closer to a 90 degree angle. I doubt if this occurs more in Mendoza’s bolder weight than in the MAN RAY sample above.</p>
      <p>Look at the very top of the capital A in Mendoza, which has a distictive cut out, which is missing in the bland MAN RAY sample.</p>
      <p>These are two strong supporting proofs that the MAN RAY sample is not set in Mendoza.</p>
      <p>But thank you for turning me onto Mendoza, which has some nice design attributes.</p>
