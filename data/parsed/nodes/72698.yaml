      <p>I’m not asking from a type designers perspective (at least not yet), so I’m probably not the one to decide. I think the fact that the iPad/Pod/Phone is a closed system should have something to say. The fonts are not available in the same way they would be if they were embedded inside an application on a regular computer, although I guess that never stopped pirates. </p>
      <p>@Jackson:<br>
      I take it OT fonts are only used in native apps? Or does Safari support OT? You can design applications as a website in HTML5/CSS/JS packed inside a custom shell that is really no more than a webkit browser.</p>
