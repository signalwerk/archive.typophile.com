    html: |-
      <p>This is all new and it seems like different foundries are all trying out different approaches. This has been my approach:<br>
      Technically, the specs I've seen for ipad app development recommend using .otf files. This isn't always the case, depends on the develop. Hinting-wise, it's a rotating screen with Apple rendering, so there's not much you can do anway. For OT features, I've had to build custom non-opentype, subset (to mac roman) versions.<br>
      Licensing-wise, it depends on the method the developer is using. For otf method, I've been approaching it similar to how I would for font encapsulation for software or video games. To keep things simple and fair, I try not think too hard about how the is going to distribute/sell the app. Those numbers are almost always complete guesses and it's not worth my time to try to parse their business model (sku/month x price + views/month x ad_rate) / the imaginary value the use of the fonts add. Instead I go with a flat rate with a discount for licensing multiple styles/weights.</p>
