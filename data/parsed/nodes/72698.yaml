      <p>There are various ways to build the apps. I can't speak for native Objective-C apps, but (at least in theory) one could use @font-face when writing an app via HTML/CSS/JS that then gets compiled via xcode.</p>
      <p>One can also build a web app based on HTML5 browser caching where you can tell the iOS (or, more precisely, I suppose, mobile Safari) what elements should be cached for local use on the device. I'm not sure if that can include font files or not. </p>
      <p>Some info here:</p>
      <p><a href="http://www.thecssninja.com/javascript/how-to-create-offline-webapps-on-the-iphone" title="http://www.thecssninja.com/javascript/how-to-create-offline-webapps-on-the-iphone">http://www.thecssninja.com/javascript/how-to-create-offline-webapps-on-t...</a></p>
