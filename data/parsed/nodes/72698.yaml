  html: |-
    <p>I was just recently asked to sketch out some ideas for an iPad version of a magazine. I’m still trying to decide if HTML5 is the way to go. This all got me wondering how foundries go about licensing fonts for @font-face used in iPad/iPhone/iPod apps. What determines the pricing? A magazine app would typically be free, but with paid subscriptions and/or paid single issues. And what about free previews?<br>
    I’ve been experimenting with a website using SVG fonts, which currently seems to be the only supported format for the iPad. Unfortunately, it leaves a lot to be desired. I’m not sure how much effect any hinting would have in my case, but the lack of kerning and next-to-nill support for OT features is far from impressive.</p>
