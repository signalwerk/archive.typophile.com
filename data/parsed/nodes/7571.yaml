    <p>Recently there was a post here that dealt with issues of line spacing (handled differently on Mac vs PC); and how to set the various values.  I think it was by <a href="/node/12151" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">John Hudson</a> in response to someone's question.  I have looked at a bunch of messages but I can't find it--can anybody point me to it?  It was exactly the info I need.</p>
    <p>Thanks - David</p>
