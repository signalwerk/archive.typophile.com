typical ascender height and descender depth, e.g. measuring the lowercase <i>d</i> and <i>p</i>. Then, if the combined height of these is shorter than 2048, add the difference in equal amounts to the sTypoAscender and sTypoDescender. So let's assume that the typical height of the ascender in our example font is 1430 and the typical descender depth is 550, i.e. a total height of 1980. <br> <br> 2048 - 1930 = 68 and 68 /2 = 34 <br> <br>So this gives us  <br> <br> - sTypoAscender = 1464 <br> - sTypoDescender = 584 (actually -584) <br> <br>and the difference between 2048 and the combined usWin values of 2560 gives us <br> <br> - sTypoLineGap = 512 <br> <br> <br>3. hhea values <br>Now setting the hhea values and obtaining cross-platform linespacing is easy, because you can simply make these values match the corresponding OS/2 'Typo' values: <br> <br> - Ascender = 1464 <br> - Descender = 584 (actually -584) <br> - LineGap = 512</p>"
