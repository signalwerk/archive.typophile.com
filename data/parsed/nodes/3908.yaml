  html: <p>T-shirts, hats, and other wearables, and lifestyle gear featuring designs from the Altered Ego Fonts library are available at <a href="http://www.cafeshops.com/alteredegofonts" target="_top">http://www.cafeshops.com/alteredegofonts</a>. <br> <br>Popular items include the Eclectic Clock, the Fishbone shirt and items featuring icons from AEF American Spirit. <br> <br>All items come with a 30-day money-back guarantee from the manufacturer. <br> <br>New designs are continually added. <br> <br>Altered Ego Fonts are designed to solve visual and typographic problems for print and interactive media, and feature dingbat, condensed and narrow-width fonts.</p>
  html_clean: <p>T-shirts, hats, and other wearables, and lifestyle gear featuring designs from the Altered Ego Fonts library are available at <a href="http://www.cafeshops.com/alteredegofonts" target="_top" class="link-external">http://www.cafeshops.com/alteredegofonts</a>. <br> <br>Popular items include the Eclectic Clock, the Fishbone shirt and items featuring icons from AEF American Spirit. <br> <br>All items come with a 30-day money-back guarantee from the manufacturer. <br> <br>New designs are continually added. <br> <br>Altered Ego Fonts are designed to solve visual and typographic problems for print and interactive media, and feature dingbat, condensed and narrow-width fonts.</p>
