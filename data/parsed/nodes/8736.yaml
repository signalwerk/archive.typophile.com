  - id: 57375
    user: 5005
    date: 2005-04-14T07:28:00
    date_raw: 14 Apr 2005 — 7:28am
    votes: null
    html: <p>I've also see the 3a-c mark used by the Red Hot Chili Peppers and can easily see that drawn on punk rock kids with a sharpie marker. In that aspect, it's not exclusive enough for a logo. Although, it is the strongest graphic symbol of the group (probably why people have see it used elsewhere).  <br> <br>If you had not given background on the project, I would have never thought of anything having to do with rail operators. The marks presented made me think of bandages, "X marks the spot", celestial bodies, candy canes, striped suspenders, bows, ribbons...  <br> <br>I like the stacking of the name, the orange and the modern type. I think with an even a stronger typeface, you can do without a mark altogether.  The spacing of the words and the length of the words almost gives the impression of tracks. Instead of making an separate symbol for the logo, perhaps play with the type/color to create a subtle symbol in itself.</p>
