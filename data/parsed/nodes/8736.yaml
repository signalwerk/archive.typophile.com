    html: <p>I like both the 2 series and 3D and 3E. <br> <br>The 2 series has a lighter, more high-tech feel, but 3D/E say railroad to me immmediately and the mark just has so much more punch. If you're trying to include buses, I'm not sure such a rail-centric design would be good, so the 2's may be your best bet (I prefer 2B). If that isn't a concern, I'd go with 3D or 3E. <br> <br>3F-H are pretty busy and I don't think they hold together like the earlier versions. 3H creates a nice interchange/weaving path from the 'C' to 'Transport' and 'Consultants', however.</p>
    html_clean: <p>I like both the 2 series and 3D and 3E. <br> <br>The 2 series has a lighter, more high-tech feel, but 3D/E say railroad to me immmediately and the mark just has so much more punch. If you're trying to include buses, I'm not sure such a rail-centric design would be good, so the 2's may be your best bet (I prefer 2B). If that isn't a concern, I'd go with 3D or 3E. <br> <br>3F-H are pretty busy and I don't think they hold together like the earlier versions. 3H creates a nice interchange/weaving path from the 'C' to 'Transport' and 'Consultants', however.</p>
