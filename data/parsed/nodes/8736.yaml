  html: "<p>Hi all, <br> <br>Background: company is a consultancy that works with rail operators to update,  <br>redevelop and improve rail and bus interchanges in the UK. <br> <br>I'm currently concepting for a new logo and brand for them. The company in question  <br>(Transport Interchange Consultants) has a rather unwieldy name, and prefers to be  <br>known by it's acronym, TIC, so this has to feature heavily in the design. <br> <br>I've come up with a few ideas (and variations on them), I'll post them all up, so any  <br>opinions would be gratefully recieved on all ideas. The idea behind the mark was  <br>to echo crossing tracks/roads. Apologies for the numerous files! <br> <br>[I can't get the image upload to work as the board 'crashes' when I post, so I have  <br>to link, if any mods can fix this and put the images inline I would be most grateful!) <br> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_1_2_3.gif\" target=\"_blank\">http://tic.nivelo.co.uk/tic_logos_1_2_3.gif</a> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_2a_b_c.gif\" target=\"_blank\">http://tic.nivelo.co.uk/tic_logos_2a_b_c.gif</a> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_3a_b_c.gif\" target=\"_blank\">http://tic.nivelo.co.uk/tic_logos_3a_b_c.gif</a> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_3b_d_e.gif\" target=\"_blank\">http://tic.nivelo.co.uk/tic_logos_3b_d_e.gif</a> <br> <br>Thanks for your time, <br> <br>Jordan</p>"
  html_clean: "<p>Hi all, <br> <br>Background: company is a consultancy that works with rail operators to update,  <br>redevelop and improve rail and bus interchanges in the UK. <br> <br>I'm currently concepting for a new logo and brand for them. The company in question  <br>(Transport Interchange Consultants) has a rather unwieldy name, and prefers to be  <br>known by it's acronym, TIC, so this has to feature heavily in the design. <br> <br>I've come up with a few ideas (and variations on them), I'll post them all up, so any  <br>opinions would be gratefully recieved on all ideas. The idea behind the mark was  <br>to echo crossing tracks/roads. Apologies for the numerous files! <br> <br>[I can't get the image upload to work as the board 'crashes' when I post, so I have  <br>to link, if any mods can fix this and put the images inline I would be most grateful!) <br> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_1_2_3.gif\" target=\"_blank\" class=\"link-external\">http://tic.nivelo.co.uk/tic_logos_1_2_3.gif</a> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_2a_b_c.gif\" target=\"_blank\" class=\"link-external\">http://tic.nivelo.co.uk/tic_logos_2a_b_c.gif</a> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_3a_b_c.gif\" target=\"_blank\" class=\"link-external\">http://tic.nivelo.co.uk/tic_logos_3a_b_c.gif</a> <br><a href=\"http://tic.nivelo.co.uk/tic_logos_3b_d_e.gif\" target=\"_blank\" class=\"link-external\">http://tic.nivelo.co.uk/tic_logos_3b_d_e.gif</a> <br> <br>Thanks for your time, <br> <br>Jordan</p>"
