    date_raw: 20 Jan 2005 — 4:02am
    votes: null
    html: <p>I also favour the 2 series. I prefer the full name underneath as in concept 2 (integrating it too tightly into the logo as it is on the right, may cause problems down the line), but it looks a little delicate, and could be risky in small applications (assuming it will always be required). Maybe tighten back the tracking and increase the size? <br> <br>I think the balance between the type and the mark needs a good looking at. The mark is being overpowered, even by the lightest type weights. <br> <br>Andriy's idea might help solve another possible problem - that the mark may be perceived as a 'sparkle'/lens flare, rather than a crossing of routes. Maybe you could give it some 3D skew to give the effect of it laying on the ground. Possibly not even flat - you could suggest a few hills. <br> <br> <br>By the way, where in Manchester are you? I'm down in Stockport right now.</p>
    html_clean: <p>I also favour the 2 series. I prefer the full name underneath as in concept 2 (integrating it too tightly into the logo as it is on the right, may cause problems down the line), but it looks a little delicate, and could be risky in small applications (assuming it will always be required). Maybe tighten back the tracking and increase the size? <br> <br>I think the balance between the type and the mark needs a good looking at. The mark is being overpowered, even by the lightest type weights. <br> <br>Andriy's idea might help solve another possible problem - that the mark may be perceived as a 'sparkle'/lens flare, rather than a crossing of routes. Maybe you could give it some 3D skew to give the effect of it laying on the ground. Possibly not even flat - you could suggest a few hills. <br> <br> <br>By the way, where in Manchester are you? I'm down in Stockport right now.</p>
  - id: 57363
    user: 2278
    date: 2005-01-21T05:30:00
    date_raw: 21 Jan 2005 — 5:30am
    votes: null
    html: <p>Thank you both for your comments. It's interesting (to me anyway) that my concept  <br>2 is getting so much attention here; on another forum I've asked for opinions on (a design <br>but non-type-specific one), concept 3 received almost universal initial approval! It's also  <br>interesting to note that the ultra black weight scored a total of zero votes, with the  <br>designers preferring lighter, more balanced weights (while I rather liked the ultra  <br>black).  <br> <br>Maybe there's something about type focused people that draws us to different types of  <br>design.... Anyway I digress. <br> <br>Andriy-- <br>I agree that it would make it interesting, but I fear it would make it look like even  <br>more of a 'starburst' than it already does. If I am to lead with concept 2 then the <br>symbolism of the mark needs to be emphasised rather than diminished. Nice idea  <br>though! <br> <br>Danny-- <br>My only problem with the full name underneath is that the 'consultants' bit gets a  <br>little lost trailing off. The length of the name is a real pain when trying to set it  <br>with such a short acronym! We all love a challenge though eh? <br> <br>The balance is something that's a serious issue with the 2 series, as the mark is so <br>light. I love the idea of skewing it and making it look like it's running over terrain,  <br>though to be honest, I wouldn't know where to start. I'm not a '3D' guy! <br> <br>My personal preference is for the 3d/e designs, though maybe with the name under the <br>design rather than integrated to the side. <br> <br>Jordan <br> <br>PS I work out of Knutsford but I live in the city centre (I go through Stockport every  <br>morning on the train!)</p>
    html_clean: <p>Thank you both for your comments. It's interesting (to me anyway) that my concept  <br>2 is getting so much attention here; on another forum I've asked for opinions on (a design <br>but non-type-specific one), concept 3 received almost universal initial approval! It's also  <br>interesting to note that the ultra black weight scored a total of zero votes, with the  <br>designers preferring lighter, more balanced weights (while I rather liked the ultra  <br>black).  <br> <br>Maybe there's something about type focused people that draws us to different types of  <br>design.... Anyway I digress. <br> <br>Andriy-- <br>I agree that it would make it interesting, but I fear it would make it look like even  <br>more of a 'starburst' than it already does. If I am to lead with concept 2 then the <br>symbolism of the mark needs to be emphasised rather than diminished. Nice idea  <br>though! <br> <br>Danny-- <br>My only problem with the full name underneath is that the 'consultants' bit gets a  <br>little lost trailing off. The length of the name is a real pain when trying to set it  <br>with such a short acronym! We all love a challenge though eh? <br> <br>The balance is something that's a serious issue with the 2 series, as the mark is so <br>light. I love the idea of skewing it and making it look like it's running over terrain,  <br>though to be honest, I wouldn't know where to start. I'm not a '3D' guy! <br> <br>My personal preference is for the 3d/e designs, though maybe with the name under the <br>design rather than integrated to the side. <br> <br>Jordan <br> <br>PS I work out of Knutsford but I live in the city centre (I go through Stockport every  <br>morning on the train!)</p>
