    html: <p>Concept 3 has a more memorable logo than 1 and 2.  It appears like it is doing more work.  I like it because it focuses on a single interchange. Remember, without the first connection the thousands of others would be irrelavant. Plus people will relate that style of mark to transportation due to it's simplicity. It is almost as if you are taking a generic railroad crossing sign and making it more efficient and aggressive in it's appearance. Anyway 3 is my favorite. 1 and 2 are overkill.</p>
