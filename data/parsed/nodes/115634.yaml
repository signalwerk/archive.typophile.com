    <p>Hi all</p>
    <p>I have a potential client that wants me to produce some pitch creative for their running magazine. I'd like to suggest some contemporary fonts for the design that reflect both the physical aspect of running as well as the more cerebral nature of the sport.</p>
    <p>I thought I'd ask to see if anyone had any suggestions to help get me started? The readership is quite broad, with a good proportion of male and female readers across all ages. I'm really open at this stage to any and all thoughts…</p>
    <p>Thanks</p>
