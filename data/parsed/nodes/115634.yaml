    html: |-
      <p>Sorry what's a monowidth?<br>
      My thoughts are to have edgy, contemporary illustration styles using loose, hand drawn elements perhaps with collage to show anything that needs to be a bit scientific. The stretches and technique illos will need to be clearer, but I'm hoping to use someone who creates line art and then adds rough textures and colour panels to break up the shape of the body.<br>
      For photography, I'd like to try and showcase aspects rarely touched on, so rather than the guy breaking the tape at the finish, perhaps focus on the guys just behind and drop the focus on the winner to show the determination and hopefully put the 'reader in the image'. I'd like a mix of mono and colour images and I'd thinking of recommending photographers who don't normally shoot sporting images and try and get some atmosphere into the shots.<br>
      I gather articles are roughly 6 pages and about 500 words per page (A4). But they like to open on a big image and lessen the type, so I reckon perhaps 700 per page is more realistic plus boxouts - busy but plenty of breathing space.<br>
      Didone (I looked at H&amp;F's) looks lovely I just wonder whether it's too 'now' and doesn't convey the technical aspects? It could work for those feature headers needing to feel epic though.<br>
      Present thoughts are Farnham/Miller/Mercury with Verlag/Neutraface or Whitney - just might be a bit too obvious and besides everyone is using that setup…</p>
