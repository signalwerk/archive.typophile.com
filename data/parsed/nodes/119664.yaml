      <p><em></em><br>
      <em></em><br>
      ¶ Find three different designs. The last two typefaces are officially based on Granjon's romans.</p>
      <p><em>Granjon</em> (George William Jones)<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/granjon_3457.jpg"></div><p></p>
      <p><em>Plantin</em> (Frank Pierpont)<br>
      "Based on overinked proofs taken from worn types of one of Granjon’s late romans surviving at the Plantin Museum, as interpreted in 1913 by Pierpont and the Monotype Corporation drawing office."<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/plantin_4821.jpg"></div><p></p>
      <p><em>Galliard</em> (Matthew Carter)<br>
      "Galliard was originally designed for Mergenthaler Linotype in 1978 as a photocomposition typeface. It is modeled on the work of Robert Granjon, a sixteenth-century punchcutter whose typefaces are renowned for their beauty and legibility."<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/galliard_4386.jpg"></div><p></p>
