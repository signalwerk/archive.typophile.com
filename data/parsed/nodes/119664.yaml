    ¶ Apart from the notorious Claude Garamont and his <em>Garamond</em> typeface, Lyon-born Robert Granjon, another key figure of the French Renaissance, gave us roman and italic typefaces.</p>
    <p>¶ The question that comes to mind now is what's the real Robert Granjon "roman" available on digital format: </p>
    <p><em>Granjon</em> (George William Jones)<br>
    <em>Plantin</em> (Frank Pierpont)<br>
    <em>Galliard</em> (Matthew Carter)<br>
    Other…</p>
    <p>¶ Many thanks to your inputs to come.</p>
