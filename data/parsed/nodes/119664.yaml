      <p><em></em><br>
      <em></em><br>
      <strong>¶ About·<em>Galliard</em></strong></p>
      <p>"According to Alexander Lawson, 'The name Galliard stems from Granjon's own term for an 8-point font he cut about 1570. It undoubtedly refers to the style of the face, for the galliard was a lively dance of the period.' "</p>
      <p>"<em>Galliard</em> has robust strokes and sharp details. According to Lawson, 'While the designers of the regenerated Garamonds were attempting to bring fidelity in their copies, Carter preferred simply to bring to <em>Galliard</em> his interpretation of the spirit of a Granjon original. . . . <em>Galliard</em> thus possesses the authentic sparkle that is lacking in the current Garamonds.' "</p>
