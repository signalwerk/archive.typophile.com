    html: |-
      <p>Ah, the midpoints are those little dots, like British decimal points. Not some design feature.</p>
      <p>I was going to say that lower-case letters had serifs, in imitation of the capital letters in Roman inscriptions, because they ought to harmonize visually with capital letters... even though they originated from something so different. I suppose we could have stuck with Carolingian script as the central point of origin for mixed-case texts, using Roman capitals as a basis only for all-caps typefaces...</p>
      <p>but the temptation to use the prettiest-looking historical model as frequently as possible was too much to resist.</p>
      <p>A world in which nearly all (Latin alphabet) text typefaces are highly calligraphic, and Roman types are a specialty item - like Copperplate Gothic, or Trajanus, all-caps only. That's hard to even imagine. Presumably it would be a world where historical authenticity overrides other values - or one where the activity of typography is stunted by economic constraints. Be that as it may, alternate choices - including the opposite, a world where typography is less bounded by tradition - are useful sources of new ideas.</p>
      <p>As one trivial example... imagine a world where typefaces aren't classified by their serifs. Serif versus sans-serif would still be a significant distinction, but, for example, hairline serifs wouldn't imply that the rest of the letterform follows Bodoni and Scotch Roman - hairline serifs or wedge serifs (fonts like Latin Bold) could be stuck on an old style body just as easily, and so the other features of the letter like the degree of stroke contrast would be the classifiers.</p>
      <p>For historical reasons, the mainstream of type development has been in a <em>very</em> narrow subset of the possible design space. Hermann Zapf's famed Optima stands almost alone as a foray outside that zone suitable for text, rather than just display, use.</p>
