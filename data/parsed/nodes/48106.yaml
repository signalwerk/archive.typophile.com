    <p>Hi! I’m a long-time lurker, first-time poster. I’m also curious about your opinions on the following:</p>
    <p>I’m a graphic designer employed by a small print shop. Every so often, i get to design logos, identities, stationery, etc. from scratch for clients of said print shop, who then get the printing done here. </p>
    <p>My main question would be: who owns the copyright on the artwork i create? Me? The print shop i work for? </p>
    <p>Our client orders have never included contracts (i’ve been here for over 8 years), and only once have i signed an agreement giving up legal ownership of the logo i created. </p>
    <p>Any thoughts are appreciated!<br>
    Thanks for your time.</p>
