      <p>MANUFACTURED ONLY BY THE PRAIRIE CITY OIL CO.: I guess you could easily combine <a class="freelinking external" href="http://www.myfonts.com/fonts/letterheadfonts/lhf-billhead-1890" rel="nofollow">Billhead</a> 1890 /C and 1900 style.<br>
      WINNIPEG LIMITED: some kind of hand-drawn Gotham, <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/garner.php" rel="nofollow">Garner</a> or <a class="freelinking external" href="http://www.letterheadfonts.com/fonts/egyptian.php" rel="nofollow">Egyptian</a> may do the job.<br>
      UFFALO: concur with Don on 'Detroit serif' style; <a class="freelinking external" href="http://www.myfonts.com/fonts/emigre/fairplex-ot" rel="nofollow">Fairplex</a> might work as well;<br>
      OIL: same 'Detroit serif' style but /O reminds me of something... Should check the rest of <a class="freelinking external" href="http://www.letterheadfonts.com" rel="nofollow">Letterhead Fonts</a>...</p>
