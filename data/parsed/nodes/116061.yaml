      <p>I love the character of these old labels. This design seems to date from about 19oo. Hand-lettering -- note the variation in letters such as C -- but some features are familiar. The "Detroit" angled serifs are used in fonts like Brothers <a href="http://www.myfonts.com/fonts/emigre/brothers-ot/" title="http://www.myfonts.com/fonts/emigre/brothers-ot/">http://www.myfonts.com/fonts/emigre/brothers-ot/</a> but here the letter-forms are rounded instead of angled.<br>
      Don</p>
