      <p>MANUFACTURED ONLY BY THE PRAIRIE CITY OIL CO: I agree with Ryuk that Billhead 1900 is a good starting point for duplicating most of the letters, modified by adapting the top half of Billhead 1890 for the _C_. You have to do a fair amount of clipping of some but not all mini-serifs, flatten the dished ends of the strokes, and do various adjustments to get it right. I would use the lowercase version of the letters:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Billhead1900PrairieCityOilTypophile116061_3873.jpg"></div><br>
      The source of the curls on Billhead 1890 is unknown, but I suggest that it might be Art Gothic <a href="http://www.myfonts.com/fonts/hihretrofonts/art-gothic-hih/" title="http://www.myfonts.com/fonts/hihretrofonts/art-gothic-hih/">http://www.myfonts.com/fonts/hihretrofonts/art-gothic-hih/</a><br>
      Don<p></p>
