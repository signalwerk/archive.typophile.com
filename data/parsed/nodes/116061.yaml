    <p>I found this old oil can in a local museum and had to take a photo. I'm trying to identify the typeface used for "PRAIRIE CITY OIL CO." It looks similar to Copperplate in many ways but a bit more condensed with some curled 'C's. Anyone might know where I can find a digital version of this font or trace down a better specimen that'd be great.</p>
