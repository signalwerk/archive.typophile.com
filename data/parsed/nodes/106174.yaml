  html: |-
    <p>I am working on a logo design for an independent Italian Research Center that will carry out high quality research in the Human Rights (Transitional Justice) and Development fields and I need some help choosing a typeface to try with this logo.</p>
    <p>I’m looking for a typeface that gives the idea of innovation (since it is an innovative center), something modern/contemporary that conveys reliability, assertiveness, knowledge and professionalism. </p>
    <p>The logo should make them look professional/serious but with a friendly and human/social feeling at the same time.</p>
    <p>All suggestions are welcome.</p>
