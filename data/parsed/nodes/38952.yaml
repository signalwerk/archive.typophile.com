  html: |-
    <p>When I have a series of paragraphs beginning with bullets and a blank line in between them, I run into a typesetting problem. I cannot separate them with a non-breaking space, because that causes the last line of each paragraph to stretch across the page. So I have two options: set the paragraphs with an extra line’s worth of spacing after them, which is fine for me, but is going to cause problems if someone who doesn’t know too much about Indesign gets the file and can’t figure out what’s going on. The other option is to just leave the spaces and apply the bullet style to each paragraph individually, but that’s tedious. Is there a third way that beats either of my two?</p>
