  html: |-
    <p>I'm working on a pro-bono logo for an indigenous women's co-op that makes and sells traditional Mayan textiles, down here in Central America. They've all been victims of physical abuse, abandoned by their husbands and left to fend for themselves and their kids. My wife is helping them get their stuff to market, I'm helping them improve their identity.</p>
    <p>What I would love from any of you type wizards is suggestions for is a typeface- free or not- that immediately screams: "intricate masterfully hand-sewn embroidered goods!" I really like Expletive Script (attached below) but I've had some feedback that it doesn't reduce well.</p>
    <p>So far my only other contender is <a class="freelinking external" href="http://new.myfonts.com/fonts/josh-grzybowski/hennepin/" rel="nofollow">Hennepin</a>,</p>
    <p>Thank you for your help!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/admich-expletive-script_5768.png"></div><p></p>
