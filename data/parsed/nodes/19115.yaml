      <p>Hello all.</p>
      <p>I am the creator of the logo in question, simple as it may be.  The font I used is called Timpani; bold for IntelliCom, bold-italic for Analytics.  Taking a quick look at ITC Tiffany, I’d say they are the same font.</p>
      <p>My father-in-law works for IntelliCom, which is how I got to do to logo, and just pointed this thread out to me.  I guess he was Googling at work again. q-:</p>
