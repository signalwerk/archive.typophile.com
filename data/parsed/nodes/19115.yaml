      <p>Heh.  That seems to be the case quite often, unfortunately.  I believe my copy came from one of those “more fonts than any human could possibly use in their lifetime” disks that I stole from my mom a while back.  Every time I build a new machine I backup my fonts folder and copy it over to the new one, so I can’t for the life of me remember where some of them come from.</p>
      <p>What made finding people playing “name that font” with the IntelliCom logo was particularly funny for me because of all the times my online friends and I have done the same thing with logos and numbers when trying to create/re-create paint schemes for race cars to go into various racing games.</p>
      <p>Nifty forum ya’ll got here.  Think I may just stick around.</p>
