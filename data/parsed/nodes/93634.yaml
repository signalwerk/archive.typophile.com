    html: <p>I think the issue with the |U| is the bottom.  Try to down the curve, this will open the bottom. It also be enlarge to be between the H and the V. You will see after if you have to enlarge the |VWXY|. About the harmony I would say it's because some letters are too condensed. Compare the |s, g and u| to my point of view the |s| should be wider. For the |a| you could go up the left part of the top where the serif is, this will open the letter between the serif and the bowl. Keep going.</p>
