    html: |-
      <p>A nice dark corner of the craft:<br>
      This is a text face (where individual glyph beauty needs to be tamed "for the greater good") and the "g" happens to be exactly the glyph that needs to start looking a bit ungainly (due to being vertically cramped) for the font to be properly balanced (by not misusing the vertical space). Basically in a text font if the "g" is too beautiful more important things are going wrong.</p>
      <p>Also: it's very rare for descenders to be at different depths (essentially for good reason) so whatever depth the "g" ends up at the others should (normally) follow.</p>
      <p>hhp</p>
