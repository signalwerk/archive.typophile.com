      <p>Thanks.  I do think it's getting steadily better.</p>
      <p>There are many adjustments in the latest release, which can be seen in the attached suzuran_120629.pdf (above) or in <a href="http://www.altsan.org/creative/fonts/new_inscription/letters_5.png">http://www.altsan.org/creative/fonts/new_inscription/letters_5.png</a></p>
      <p>Changes of note include reworking the serifs to make them sturdier-looking, adjusting the 'e' crossbar, trying to harmonize the bowl weights (still needs some work IMO), and smoothing out a lot of the counters (especially in the lowercase).</p>
      <p>I don't know, though... there's still something not quite satisfactory about it, which I especially notice in paragraphs at 10-12pt.  I think maybe the stroke contrast might need to be increased still more.  </p>
      <p>I'm also thinking I should change the numbers to text (rather than lining) figures.  I'm not really a big fan of old-style figures but in this case I think they fit the style a bit more.  (Since I'm using Typetool I have no way to add OpenType features, so it's pretty much one or the other.)</p>
