      <p>New milestone.  I've reduced the caps size very slightly, and tweaked some other characters.<br><a href="http://www.altsan.org/creative/fonts/new_inscription/letters_3.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/letters_3.png</a><br><a href="http://www.altsan.org/creative/fonts/new_inscription/text_sample_3.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/text_sample_3.png</a></p>
      <p>The capitals may still look a little large next to the lowercase, but I think part of that is due to the overly-compressed letter-spacing.  I need to space things out a bit more.</p>
      <p>I'm not sure about how well the tail on the /u and /d works.  Anyone have thoughts on that? </p>
      <p>I added the proposed new uppercase Eszett character, mainly because I could. :p</p>
      <p>Speaking of which, I've deliberately drawn the foot of the long-s without a serif, in order to differentiate it better from /f.  For consistency it was thus left off the regular eszett which is derived from it.  Does that seem like a good idea/bad idea/acceptable quirk?</p>
