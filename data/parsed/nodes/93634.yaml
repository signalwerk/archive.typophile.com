      <p>There's still something not quite right about the overall harmony but it's hard to say what.</p>
      <p>I'm not really happy with the /a just yet.  I quite liked the earlier, wider form (seen in various posts above), but it didn't really fit in anymore with how I'd redesigned everything else over time.  I think I'll try extending the top end a little more to the left, and maybe try reducing the bowl height some more.</p>
