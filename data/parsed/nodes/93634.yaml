      <p>Good point about the descenders... I'd overlooked that but on closer examination I have to agree with you.</p>
      <p>The 10-12 point range is my main target, I suppose.  I plan to do a couple of other weights, though.</p>
      <p>I'm actually a computer programmer by background... I stumbled into typeface design pretty much by accident – around ten years ago, I did a hasty mock-up of an old bitmap font to help myself create some user interface drawings, and the result somehow got adopted as the main menu &amp; dialog font for several software programs.   So I've been trying to catch up on learning all I can about proper type design ever since.  </p>
      <p>I've grown quite fascinated with the subject now...  a fondness for Japanese writing and calligraphy came along separately, but I figure I should find a way to combine the interests. :)</p>
      <p>This is a learning exercise as much as anything else.</p>
      <p>Thanks for the feedback!</p>
