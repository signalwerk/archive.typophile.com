    <p>Hi, new poster here (although I've lurked around the margins for a while)...  If I may, I'd appreciate some opinions on a new serif typeface I'm designing.  </p>
    <p>This is my first attempt at a serif typeface, and my first serious attempt at a font fit for general consumption (my previous work has been for rather specialized uses).</p>
    <p>Some remarks about my intentions... I basically set out to explore the possibilities of a humanist typeface with non-traditional styling.  (The serifs are loosely intended to recall engraved inscriptions, by the way.)  In the future I plan on adding at least partial Japanese support, and one of my other objectives is to see if it's possible to create a consistent style between the Latin and Japanese characters that manages to be culturally faithful to both.  (Most general-purpose Japanese fonts are woefully generic-looking, especially the serif/mincho ones.)</p>
    <p>It's primarily intended as a document font that can also function reasonably well on-screen.  The serifs are deliberately understated to help the text render with minimal distraction.</p>
    <p>Letter designs:  <a href="http://www.altsan.org/creative/fonts/new_inscription/letters.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/letters.png</a><br>
    Sample text at various sizes:  <a href="http://www.altsan.org/creative/fonts/new_inscription/text_sample.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/text_sample.png</a></p>
    <p>I'm aware of a number of extant problems.  The strokes need to be darker in general (and the harmonization of stroke widths needs work).  I'm also thinking the contrast needs to be increased a little.  For printed text, the character spacing may be a little tight.  As far as the specific glyphs go, I'm not entirely convinced by a few characters, in particular some of the numbers.  I'm also wondering if the serifs might not be a bit <em>too</em> understated.</p>
    <p>I'd welcome opinions from more experienced hands!  Thanks...</p>
