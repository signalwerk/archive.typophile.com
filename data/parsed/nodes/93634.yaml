      <p>Ah, I'm also a programmer by training (although I've become quite rusty). Wrote my first program at age 9 on a Commodore PET, but in the early 80s made bitmap fonts for my C64 (with my brother's help) and even my Computer Science degree couldn't stop my eventual move to type design - although there is very much some overlap (especially these days). One thing I think computer people are good at in type design is spacing - let me know if you feel that too.</p>
      <p>If you're shooting for around 11 point I'd say the color (thickness) needs to be bumped up (as you say) but the x-height is good - just shorten the descenders (quite a bit though). Also, the caps are on the big side - which means they're good at reference texts (where a reader has to search for proper nouns) but not so much for immersive reading.</p>
      <p>hhp</p>
    html_clean: |-
