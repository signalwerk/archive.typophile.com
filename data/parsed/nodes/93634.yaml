      <p>OK, I've given the face a major overhaul.  The overall weight has been increased considerably, and spacing has been improved.  I've also kerned about a dozen of the more problematic pairs.</p>
      <p>Two PDFs with sample text are now attached (see above).  suzuran.pdf shows all supported characters, and a block of 12 pt text.  suzuran_sample.pdf has a shorter paragraph shown at a range of sizes.</p>
      <p>And here's an image of the updated design (most but not all characters shown here):<br><a href="http://www.altsan.org/creative/fonts/new_inscription/letters_4.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/letters_4.png</a></p>
      <p>I think this is a significant improvement.  It actually works better than I expected down to quite small sizes , at least off a good-quality laser printer. :p  </p>
      <p>I think some of the curves may be a bit too heavy now.  I'm also not very happy with some of the counter shapes, especially the /s and /b-/d-/p-/q...  but I'll keep on tweaking.</p>
