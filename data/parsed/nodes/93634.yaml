      <p>OK, I've reworked things a bit.  The descenders are shorter and I redesigned the /S and /s glyphs, as well as the /a to some extent.  The /f, long-s and eszett share a slightly flatter curve now.  Most significantly, I've bumped up the stroke contrast, especially on the bowls.</p>
      <p><a href="http://www.altsan.org/creative/fonts/new_inscription/letters_2.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/letters_2.png</a><br><a href="http://www.altsan.org/creative/fonts/new_inscription/text_sample_2.png" title="Click to visit an external URL." class="freelink freelink-external freelink-external">http://www.altsan.org/creative/fonts/new_inscription/text_sample_2.png</a></p>
      <p>Hmm... the current caps height works reasonably well at the smallest point sizes.  You do have a point, though, especially at the larger sizes.  </p>
      <p>I'll up the colour a bit in the coming days.  I suspect I'll keep something close to the current incarnation to develop into a "light" weight, though.</p>
      <p>I tweaked the /Z a little in this iteration – specifically, I made the top bar a bit shorter, which may help a bit.  The /M and /W I'll take a look at.</p>
      <p>Thanks!</p>
