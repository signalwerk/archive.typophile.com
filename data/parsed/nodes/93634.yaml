      <p>Although I personally don't find this very exciting, I think it can certainly evolve into a usable font, and the Japanese angle is certainly interesting.</p>
      <p>The first thing you should do is decide what point size range you're shooting for this, because that's what will lead you to a good balance of color versus spacing versus vertical proportions (noting for starters that the descenders are way too long compared to the ascenders).</p>
      <p>hhp</p>
