      <p>foolscap (n.)<br>
          literally "fool's cap; cap worn by jesters," 1630s; c.1700 as a type of paper, so called because this type of paper originally was watermarked with a court jester's cap.</p>
      <p><a href="http://www.etymonline.com" title="http://www.etymonline.com">http://www.etymonline.com</a></p>
      <p>n.</p>
