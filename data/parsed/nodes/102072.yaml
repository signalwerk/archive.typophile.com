    html: |-
      <p>Traditional British paper sizes used a lot of royal terms, and I suspect that the name “Monarch” is an attempt to Anglicize a size which, in the colonies, is called “Executive.”</p>
      <p>Personally, I like the traditional size name “Foolscap”…</p>
