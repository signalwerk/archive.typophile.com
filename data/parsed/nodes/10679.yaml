  html: "<p>Greetings! I'm a total newbie to the font world and I was wondering  <br>if you pro's could help me out. Does anyone know where I could find a  <br>font like what's used on Bicycle playing cards? Thank you for your  <br>time, I really appreciate it! <br> <br>Here's a few links for visual aids: <br> <br><a href=\"http://www.usplayingcard.com/images/corebicycle.jpg\" target=\"_blank\">http://www.usplayingcard.com/images/corebicycle.jpg</a> <br> <br><a href=\"http://www.usplayingcard.com/media/tradition/uspc-thumb/11.gif\" target=\"_blank\">http://www.usplayingcard.com/media/tradition/uspc-thumb/11.gif</a></p>"
  html_clean: "<p>Greetings! I'm a total newbie to the font world and I was wondering  <br>if you pro's could help me out. Does anyone know where I could find a  <br>font like what's used on Bicycle playing cards? Thank you for your  <br>time, I really appreciate it! <br> <br>Here's a few links for visual aids: <br> <br><a href=\"http://www.usplayingcard.com/images/corebicycle.jpg\" target=\"_blank\" class=\"link-external\">http://www.usplayingcard.com/images/corebicycle.jpg</a> <br> <br><a href=\"http://www.usplayingcard.com/media/tradition/uspc-thumb/11.gif\" target=\"_blank\" class=\"link-external\">http://www.usplayingcard.com/media/tradition/uspc-thumb/11.gif</a></p>"
