    html: '<p>Two possibilities here, both freebies, that might get you “close enough” to fool the casual observer or provide something that can be modiﬁed without too much trouble: <br><br>Campanile (<span class="caps">PC</span> Postscript only) by Dieter Steﬀmann <br><a href="http://www.steffmann.de/english/fonts1.htm" target="_blank">http://www.steﬀmann.de/english/fonts1.htm</a> <br><br>Ringlet Black by George White. I contacted Mr White over the weekend because his Web pages were not accessible. He wrote back that the server was renamed as per below. I can’t reach this new <span class="caps">URL</span> either and he’s aware of the problem and contacting the Duke sysadmin. <br><a href="http://bibliofile.duhs.duke.edu/gww/" target="_blank">http://biblioﬁle.duhs.duke.edu/gww/</a> <br><br><img src="http://www.typophile.com/forums/messages/83/7387.gif" alt=""><br><br>Campanile and Ringlet (Normal, which is thinner that Black) are reportedly included in “24 Victorian Display Fonts” by Dan X. Solo. Amazon has it. I was going to include a link, but those Amazon <span class="caps">URL</span>s are so long it’d wrap 2 or 3 times. <br><br>.</p>'
    html_clean: '<p>Two possibilities here, both freebies, that might get you “close enough” to fool the casual observer or provide something that can be modiﬁed without too much trouble: <br><br>Campanile (<span class="caps">PC</span> Postscript only) by Dieter Steﬀmann <br><a href="http://www.steffmann.de/english/fonts1.htm" target="_blank" class="link-external">http://www.steﬀmann.de/english/fonts1.htm</a> <br><br>Ringlet Black by George White. I contacted Mr White over the weekend because his Web pages were not accessible. He wrote back that the server was renamed as per below. I can’t reach this new <span class="caps">URL</span> either and he’s aware of the problem and contacting the Duke sysadmin. <br><a href="http://bibliofile.duhs.duke.edu/gww/" target="_blank" class="link-external">http://biblioﬁle.duhs.duke.edu/gww/</a> <br><br><img src="http://www.typophile.com/forums/messages/83/7387.gif" alt=""><br><br>Campanile and Ringlet (Normal, which is thinner that Black) are reportedly included in “24 Victorian Display Fonts” by Dan X. Solo. Amazon has it. I was going to include a link, but those Amazon <span class="caps">URL</span>s are so long it’d wrap 2 or 3 times. <br><br>.</p>'
