    html: |-
      <p>You mean Black Monday, the grunge version of it?  That's what I'm trying to achieve.  Just looking at the Myfonts page for it, it looks as though the randomisation is processed via the liga feature, but then looking in the glyph table there don't appear to be many ligatures.  I'm guessing the programming reads something like </p>
      <p>sub @class1 @class1' by @class2<br>
      sub @class2 @class1' by @class3</p>
      <p>so they rotate round the stylistic sets.</p>
      <p>I guess this would work without too much glyph repetition with three stylistic sets.</p>
      <p>Would be interesting to see the coding on black monday.  Seems to make the sets rotate thus: 1 2 3 2 3 1 3 then repeats</p>
