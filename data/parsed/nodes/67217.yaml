  html: |-
    <p>Hi</p>
    <p>Anybody know a way of programming a font so that it remembers you've typed a letter, and the next time you type that letter an alternate glyph is used?  This would be useful in distressed fonts.  Ligature substitution is ok for double letters but if I type a word like 'dada' say, and I want to make sure the distressed look isn't repeated, it doesn't help.  </p>
    <p>I have a feeling it should be simple enough to do this - somehow get typing a letter to flick a switch and then if the same letter is typed while that switch is on, substitute an alternate glyph then reset the switch.</p>
    <p>Any ideas?</p>
    <p>Cheers</p>
