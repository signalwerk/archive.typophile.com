    <p>Hi, there!<br>
    I would love some feedback on this draft--it's my first attempt at making a typeface. Suggestions and corrections will really help me tackle the uppercase letters. As far as lowercase letters, u, f, r, n, and m feel most iffy to me. Help!<br>
    And I just want to get a sense whether this is worth putting more energy into.<br>
    Many thanks,<br>
    Anastasia</p>
