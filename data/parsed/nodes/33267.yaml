      <p>For the t (going with Eben's comment), I might try having both the bottom left corner of the crossbar be the same as the bottom right one (eg, more straight-line, tight curve, straight line again, rather than extra lead-in you've given it...erp, the same as on the f, less the top portion of course).  The way it is now pulls the filled part down visually below the cross bar, I think that's what makes it seem a little blob-like.</p>
      <p><em>«El futuro es una línea tan fina que apenas nos damos cuenta de pintarla nosotros mismos». (La Luz Oscura, por Javier Guerrero)</em></p>
