    html: |-
      <p>I agree with Kevin. I would add: To avoid the problem with the g move the bottom bowl up somewhat. You might pare down the inner serif at the base of the u. I would look for the letters to feel more even in weight overall. The ascenders look to heavy to me on the b,d, k &amp; so on. You might want to try flipping the serif at the top of the vertical stroke on the p. The top of the t looks clotted. You v looks like it might tip to the right. That's a visual balance issue.</p>
      <p>All the letters seem to be made of bones. Is that the idea? Or am I seeing something you didn't intend? </p>
      <p>I especially like your a &amp; your r e &amp; j. </p>
      <p>Keep going.</p>
