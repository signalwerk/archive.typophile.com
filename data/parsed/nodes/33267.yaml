    html: |-
      <p>Hello. Thanks for taking the time to respond. This really helps.<br>
      Should the ascenders just be shorter and/or thinner? I missed the v issue altogether. A clotted t--not good!<br>
      If you feel like checking back in after a few days, I'd love to hear what you think of the new version.<br>
      You are right, I was thinking bones, drift wood and rocks polished by water as an inspiration. If you are familiar with Henry Moore's sculptures and drawings, I am playing with a similar energy. (I hope it's not freaky!) This design is just my exploration of organic shapes and getting personal experience of just what it really takes to make a serif face. I wanted to know how letters are really created and what a damned challenge it is. An exercise in appreciating the masters.<br>
      Thank you for feedback!<br>
      Anastasia</p>
