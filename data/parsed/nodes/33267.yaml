      <p>Hi, Eben.<br>
      Yeah, I do know what you mean. This is definitely not the intention. What I was going for was not the "Bone" display type but a text face with the suggestion of organic forms. At small sizes the reader would pick up the overall round flowing feel of it, not immediately making any particular associations. Anyhow, I'm going to pare down the weight of stems and width of the thicker serifs, so hopefully the bone thing will go away.<br>
      I do appreciate the honesty--it's nice to know exactly what people think. Keep it coming, please!</p>
