      <p>Dan wrote:</p>
      <p><cite>Auszeichnung means an honor or distinction.</cite></p>
      <p>In the English version of a Tschichold text on the subject -- 'Italics, Small Capitals and Quotation Marks in Books and Scientific Publications' in <cite>The Form of the Book</cite>, Lund Humphries, p.110 -- the word 'differentiation' is used, e.g.:</p>
      <p><cite>The beginning of a typographical differentiation goes back to the Baroque. Here, we find italic used within roman text as a means of differentiation.</cite></p>
      <p><cite>[...] text will benefit and become more lucid and comprehensive if some manner of type differentiation is applied.</cite></p>
      <p>But maybe '(typographic) distinction'/'distinguished' is the better choice? 'Distinction' seems to denote both (mere) differentiation and, in addition, the aspect of 'being destinguished'. Which is not too far away from 'Auszeichnung'.</p>
