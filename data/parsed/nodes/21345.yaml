      <p>&gt; “aktivierende Auszeichnung” (activating) for bold or all caps.</p>
      <p>Willberg &amp; Forssman use the term "aktive", not "aktivierende", <em>Auszeichnung</em>. </p>
      <p>To me the only acceptable – and rather obvious – translation would be  "integrated" and "active" <em>Auszeichnung</em>. The difference between the two lies in the fact that the reader notices <em>aktive Auszeichnungen</em> at first sight of the page and <em>integrierte</em> only when he reaches the spot in the text (i.e. the latter are more in line with the whole of the text, the former stand out more).</p>
