      <p>The underlying problem is, that "Auszeichnung" can be a colloquial expression (honor, distinction) as well as a technical term (outstanding in a typo-technical context).  </p>
      <p>Footnotes and references may contain "Auszeichnungen" (i.e. whatever accentuation), but Auszeichnungen are more "character styles" than "paragraph styles" (to say it in indesignish, but these expressions would be too software-bound for a general text ...)</p>
      <p>"Accentuation" sounds fine to me at the moment, but being no native english speaker, I don't know if that's ok or if there's another special expression?</p>
