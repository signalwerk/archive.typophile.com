      <p>Coming back to Hans Peter Willberg's "Lesetypografie":</p>
      <p>He uses the term "integrierte Auszeichnung" (integrated) for italics and small caps as opposed to "aktivierende Auszeichnung" (activating) for bold or all caps. This is a very sensible distinction to me and helps beginners understand that pressing the bold button or the italics button is not a random choice.</p>
      <p>Any suggestions for an English adaptation?</p>
