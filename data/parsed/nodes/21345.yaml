    html: |-
      <p>It's actually quite simple: a person can <em>sich auszeichnen</em> (the verb) in something, i.e. excel in something, be outstanding.</p>
      <p>In typography, a text can be <em>ausgezeichnet</em> (the adjective), which simply means it stands out from the rest of the text. In that sense, <em>Auszeichnung</em> could be translated as distinction, or differentation. To preserve the ambiguity in "Text mit Auszeichnung", one could translate "Text with distinction". "Choice of the appropriate <em>Auszeichnungen</em> for a given text" could become "Choice of the appropriate differentations/distinguishing features".</p>
      <p>The chapter devoted to <em>auszeichnen</em> in the German typography bible <a href="http://www.typografie.de/verlagsverzeichnis/typografie/652-5.html" rel="nofollow">Lesetypografie</a> (pp. 120–173) not only considers distinguishing one or two words from the main text, indeed, through italics, bold, small caps, or a different typeface altogether ("character styles" in InDesignish), but also of whole blocks of text (e.g., block citations), for instance through another font size, indentation, change of colour ("paragraph styles") &amp;c.</p>
      <p><em>Note: I started typing the reply, went away, came back and posted – only then I read k.l.'s reply.</em></p>
