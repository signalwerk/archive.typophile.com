      <p>Just as a point of reference from my copy of <em>Polygraph Wörtenbuch für die Druckindustrie/Polygraph Dictionary of the Graphic Arts -- Polygraph Verlag</em>, 4th Edition German-English/English-German, 1987:</p>
      <p>- <strong>Auszeichnen</strong> <em>f</em> to accentuate, to display<br>
       &nbsp;  &nbsp; <strong><em>mit Halbfetter</em></strong> -- to accentuate with bold;<br>
       &nbsp;  &nbsp; <strong><em>mit Kapitälchen</em></strong> -- to accentuate with small caps;<br>
       &nbsp;  &nbsp; <strong><em>mit Kursiv</em></strong> -- to accentuate with italic<br>
      - <strong>Auszeichnung</strong> <em>f (Schrift)</em> display setting<br>
      - <strong>Auszeichnungsshrift</strong> <em>f</em> display characters <em>pl</em> display type<br>
      - <strong>Auszeichnungszeile</strong> <em>f</em> display line</p>
      <p><em>(Edit-a-bit) -- found more definitions related to accentuation:</em></p>
      <p>- <strong>Akzentbuchstabe</strong> <em>m</em> accented letter<br>
      - <strong>akzentuieren</strong> to accentuate<br>
      - <strong>Akzentuierung</strong> <em>f</em> accentuation</p>
