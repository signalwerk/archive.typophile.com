      <p>Indeed, "Auszeichnung" in general sense means "honors" and "ausgezeichnet" means "excellent". But the typographic meaning has its own peculiarity. </p>
      <p>These days, "Auszeichnung" in German typography is used in two meanings: "emphasis" or "styling". The latter translation gives a better sense of the practical use of the term. "Auszeichnung" in German typography does not really mean visual *emphasis* as in using bold, but all sorts of deviation from the regular. Therefore, I'd use the term "styling", as in "styled text", "use various forms of styling", "applying styling to the text". If you're confident that the intended meaning is about really adding emphasis to the text, use "emphasis".</p>
