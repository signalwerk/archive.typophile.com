  html: <p>I have a client who wishes to create PDFs for invites. All of these contain type.  With Typekit, Font Squirrel, and Font Shop sporting webkits and iPhone apps using fonts for in postcards, etc., are licensing restrictions becoming less strict? Should my client be concerned about embedding type?</p>
  html_clean: <p>I have a client who wishes to create PDFs for invites. All of these contain type.  With Typekit, Font Squirrel, and Font Shop sporting webkits and iPhone apps using fonts for in postcards, etc., are licensing restrictions becoming less strict? Should my client be concerned about embedding type?</p>
