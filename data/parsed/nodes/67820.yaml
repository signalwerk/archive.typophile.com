    html: <p>It's the client's website. The users will be able to download the PDFs.</p>
    html_clean: <p>It's the client's website. The users will be able to download the PDFs.</p>
  - id: 398191
    user: 108
    date: 2010-02-25T13:28:00
    date_raw: 25 Feb 2010 — 1:28pm
    votes: null
    html: <p>Then you will need customized licensing. This means your client needs to discuss his intentions with the foundries from whom he wishes to license type and will have to pay for a different kind of license. I don't know of any EULA that allows this sort of thing within a standard EULA.</p>
    html_clean: <p>Then you will need customized licensing. This means your client needs to discuss his intentions with the foundries from whom he wishes to license type and will have to pay for a different kind of license. I don't know of any EULA that allows this sort of thing within a standard EULA.</p>
  - id: 398192
    user: 1049
    date: 2010-02-25T13:29:00
    date_raw: 25 Feb 2010 — 1:29pm
    votes: null
    html: <p>If the fonts are installed on the server and user-interaction causes server-based PDF creating application to embed the fonts and send the resulting PDF to the user then I think that falls well outside of the realm of a typical font EULA.</p>
    html_clean: <p>If the fonts are installed on the server and user-interaction causes server-based PDF creating application to embed the fonts and send the resulting PDF to the user then I think that falls well outside of the realm of a typical font EULA.</p>
