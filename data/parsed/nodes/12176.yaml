    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Organizations" class="freelinking" rel="nofollow">Organizations</a> : TypeOff</strong></p>
    <p>Small collective of designers from the city of Offenbach, Germany. Founded in June, 2004.</p>
    <p>Current members include <a href="/wiki/David%20Borchers" class="freelinking" rel="nofollow">David Borchers</a>, <a href="/wiki/Lara%20Glueck" class="freelinking" rel="nofollow">Lara Glueck</a>, <a href="/wiki/Till%20Hopstock" class="freelinking" rel="nofollow">Till Hopstock</a>, <a href="/wiki/Tanja%20Huckenbeck" class="freelinking" rel="nofollow">Tanja Huckenbeck</a>, <a href="/wiki/Peter%20Reichard" class="freelinking" rel="nofollow">Peter Reichard</a>, <a href="/wiki/Dan%20Reynolds" class="freelinking" rel="nofollow">Dan Reynolds</a>, and <a href="/wiki/Lukas%20Schneider" class="freelinking" rel="nofollow">Lukas Schneider</a>.</p>
    <p>Five of the members study, or have studied, at the <a href="/wiki/HfG%20Offenbach" class="freelinking" rel="nofollow">HfG Offenbach</a>. Three of them intern, or have interned, at <a href="/wiki/Linotype" class="freelinking" rel="nofollow">Linotype</a>. Two of them work at <a href="/wiki/Typosition" class="freelinking" rel="nofollow">Typosition</a>, where they also produce the magazine <a href="/wiki/Spatium" class="freelinking" rel="nofollow">Spatium</a>.</p>
    <p>They sponsor a monthly drinking fest called the <a href="/wiki/Typostammtisch" class="freelinking" rel="nofollow">Typostammtisch</a>. All designers who happen to be in the Frankfurt-area at the time are invited.</p>
    <p>Their website is <a href="http://www.typeoff.de" rel="nofollow">TypeOff.de</a>.</p>
