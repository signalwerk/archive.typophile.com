      <p>Both Dan Carr's <em>Parmenides Greek</em> &amp; Christopher Stinehour’s <em>Diogenes Greek</em> were commissioned by the printer Peter Koch for <a class="freelinking external" href="http://www.peterkochprinters.com/show.php?bookid=3" rel="nofollow">The Fragments of Parmenides</a>.</p>
      <p>While Stinehour’s design might be considered a display face for the purposes of your question, it was in fact used to set extended passages of Greek in Robert Bringhurst's <a class="freelinking external" href="http://www.peterkochprinters.com/show.php?bookid=67" rel="nofollow">The Old in Their Knowing</a>.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/old-knowing-hmp_4989.jpg"></div><p></p>
      <p>Cf. John D. Berry, <cite><a class="freelinking external" href="http://www.creativepro.com/article/dot-font-preserving-ancient-wisdom-with-age-old-printing-techniques" rel="nofollow">Preserving Ancient Wisdom with Age-Old Printing Techniques</a></cite> (2001).</p>
