    <p></p><div class="imageWrap"><img src="http://typophile.com/files/32a_mattioli_3970.jpg"></div><p></p>
    <p>And, even more recently, the same Perondi, a gifted Italian type designer, made another attempt with a Baskerville-inspired typeface for Voland, another Italian publishing house; this typeface will be officially launched tomorrow at the Turin bookfair, but I had the chance to see a copy of a new book set with it and, at a first glance, it indeed looks like a contemporary take on Baskerville. Here is a sample anyway:</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/perondi_voland_5501.jpg"></div><p></p>
    <p>Can someone else give more examples of custom typefaces made for publishing houses - meaning for setting long texts in novels, essays, poetry books and the likes?</p>
    <p>And how do type designers consider being commissioned for a typeface meant for specific editorial (books) use?</p>
