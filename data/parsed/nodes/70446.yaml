      <p>quadibloc wrote:</p>
      <p><cite>I'm surprised that they say that the Lucerna Bible Font "bears no similarity to" Veritas; to me, they looked very similar, having seen Veritas illustrated here, and the Lucerna Bible Font here.</cite></p>
      <p><cite>If anything, it's ITC Giovanni that doesn't resemble either of them all that much.</cite></p>
      <p>That's a good point: there is little similarity in Lucerna to Veritas (as opposed to none); the two typefaces are closely related, as the design and thinking of Veritas laid the groundwork for Lucerna. (I amended my article to clarify).</p>
      <p>Because the management of Tyndale preferred specific aspects of ITC Giovanni, we chose to emulate key design characteristics of Giovanni, which pleased the management team, and allowed us the freedom to do what we wanted with the rest of the glyphs.</p>
