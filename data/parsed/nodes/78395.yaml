  html: |-
    <p>Hi all,</p>
    <p>Just signed up to ask if anyone knows of a font that resembles the one used for the words "original oxford marmalade" in the pic. I assume the lettering is a unique design for the brand, but it's a pretty common style (or at least was back in the day!) so there must be something similar out there. Doesn't necessarily need the shadowing, more interested in the letter shape etc.</p>
    <p>Thanks!</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/marmalade_5780.jpg"></div><p></p>
