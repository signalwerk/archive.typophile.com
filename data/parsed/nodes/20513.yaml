    html: <p>I downloaded TransType before i posted here. I tried adding all of the fonts i want converted into the program by having it scan the CD they were on but it couldn't bring them over into the program. I figured it might create a list of the fonts i want to be converted in the program and then i'd just select the output settings in the preferences and hit 'Convert'. But it won't bring them into TransType. Am i doing something wrong?</p>
