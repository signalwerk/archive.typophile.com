      <p>Hi,<br>
      try to find FontHopper, uhm its an Adobe orphan (Ares) that converts PC to Mac and Mac to PC. The Trick of Mac to PC is to use a PC Formated disk (Floppy, ZIP, Harddrive, etc) and convert from Mac to PC formated disk. Easy as pie.</p>
