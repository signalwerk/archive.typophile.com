    html: <p>If you have any comfort with the command line, you should be able to accomplish this with <a href="http://fondu.sourceforge.net/" rel="nofollow">Fondu</a>. <a href="http://fontforge.sourceforge.net/" rel="nofollow">FontForge</a> may also be helpful. They are both free (speech/beer)and pretty easy to use.</p>
