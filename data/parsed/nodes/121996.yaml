      <p>Right now it’s just spaces and dashes; haven’t muddled with the dots yet. The spaces are a semi-fab kit that’s renumbered, given values for punct/number/thin/hair and then plunked straight into the SFD file at the end. FontForge is smart enough that I don’t really need to adjust the totals in BeginChars and the maxp table, but I do so anyway.</p>
      <p>Also, I set the char. numbers to start at 600 so I wouldn’t have to renumber them for a while yet as I transfer them from a previous version to the next. This set is from Gidole 0.9.</p>
