    html: |-
      <p>I'm still not 100% happy with the /n arch. I realize you want it to appear circular, so moving the apex even more to the right is probably not in your interest. But the stroke still feels a bit wobbly to me, like perhaps the curvature of the upper right outer outline is too low, making the stroke locally too thin:<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/corr_5071.jpg"></div><p></p>
      <p>/8: I understand your goal, but the current /8 does not meet it in my opinion. The upper half looks larger to me.</p>
      <p>As for the long s, I'm quite fond of it. In fact, I use it in the official orthography of one of my conlangs, Jovian. :o)</p>
      <p>Ogonek: The stroke thins down on the bottom left diagonal, which breaks the monolinear feel of the font. If anything, the stroke should be slightly thicker there since it's a "strong diagonal" in pen rules.</p>
