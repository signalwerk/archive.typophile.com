      <blockquote><p>Thanks, It's only a hobby project and the font is free so can't really afford to buy tools I'm afraid :)</p></blockquote>
      <p>You know, people sometimes do spend money to support their hobbies.  ;o)  </p>
      <p>Your newest letters are indeed quite smooth; good job.  The only thing that still catches my eye is  the curve in /n/m/u/h. I believe it would look better if you moved its apex a bit away from the main stem. Don't be afraid to break the symmetry of the arch; it's not symmetric anyway, with a straight stem on only one side. The arch might actually <em>look</em> more symmetric if you bend it away from the stem a bit.</p>
      <p>The /8 looks top-heavy. The stress on the ogonek looks reversed. Maybe lighten the bowl's connection to the foot in /a a bit? Is /4 a bit too wide?</p>
      <p>How complete is your character set? Do you have /Þ, /ð, /ß, etc...?</p>
