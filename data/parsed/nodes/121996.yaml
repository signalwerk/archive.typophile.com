    html: |-
      <p>Looks really good, Andreas, but I still think you have an issue with the shoulder of the /h/, /n/ and /m/.  The right side is very 'flat' and I think the problem originates from using the /o/ in their construction.</p>
      <p>The /o/ has a slight diagonal stress, with the top-left/bottom right parts of the curve being thicker than the top-right/bottom-left.  If you flip the /o/ before you start construction of the other letters, I think you'll find it easier to eliminate the 'flat' spots.</p>
      <p>I've made a rough mock-up to show what I mean.  The middle /n/ is my attempt and was made from the /n/ and /o/ from your most recent upload.  I needed to tweak the junction a little after merging the two shapes, but you'll notice the shoulder is 'fuller'.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/path3030_5583.png"></div><p></p>
    html_clean: |-
