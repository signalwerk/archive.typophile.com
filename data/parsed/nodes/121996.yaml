      <p>Hi Andreas - I think the /s/ looks great.  </p>
      <p>You have a little kink almost exactly in the middle of the /S/.  It flattens the first part of the lower curve, which you can see most clearly by comparing the two semicircles within the /$/ sign.</p>
      <p>I like the idea of a slightly unconventional '@' symbol, though I have a sense having the stroke end the way it does in the top left will make it look a bit unbalanced.  It would be good to see how it works when used within an email address.   It might also be interesting to play around something alone these lines (with apologies for the crudeness!).</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/Gidole AT_3638.png"></div><p></p>
    html_clean: |-
