      <p>Andreas: Looking at your /h up close, I still get the impression that the right side of the arch is wider than the left side (it isn't, but to my eye it looks that way) and that it would profit from moving the apex a bit more to the right. The stroke also still appears to me to be thinner at its 2 o'clock position than at its apex, probably because I intuitively expect a "heavy" diagonal there.  The outer upper right curve segment could probably profit from a bit more outward curvature. </p>
      <p>At small sizes, the shape looks quite good, though.</p>
