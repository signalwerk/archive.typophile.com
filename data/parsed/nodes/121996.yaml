      <p>The /ẞ still feels a bit unbalanced to me in that /FUẞBALL sample. The hard corner is at odds with the rest of the letters, the top counter is small compared to the wide belly below, and the bowl's stroke ends uncomfortably close to the stem. I would make the top slightly wider and the downward angle slightly steeper (bringing the central junction further away from the stem), and end the bowl's stroke farther away from the stem.</p>
      <p>I like Gidole Play a lot. I was going to suggest narrowing the /V/v/y, but I think you did that on your own.</p>
