    html: |-
      <p>ITC Bodoni Six is my favorite typeface. It's totally funky, yet classical and elegant. It's a chunky typeface, optimized for small point sizes, but even at 12 pts it's still pretty cool. It totally fits the <cite>classic/formal/serious but also a little bit wacky</cite> requirement.</p>
      <p>And because it is an authentic Bodoni, no one can call your bluff if you use it with a display Bodoni.</p>
    html_clean: |-
