    html: |-
      <p>If Bodoni is your display type, and you are looking for a legible body type, consider a Neoclassical type like Baskerville, or a Scotch Roman like Georgia or Bell. These would also be very scholarly choices in terms of their appearance, and they are very readable as well.</p>
      <p>Bulmer is another good choice that sort of straddles the boundary between the Neoclassical types like Baskerville and the Romantic types like Bodoni.</p>
      <p>I would steer clear of anything humanist (like Hoefler Text, any Garamond or Adobe Caslon) as they might clash with the high contrast and geometry of Bodoni.</p>
      <p>If you want to use a Bodoni for the body copy, ITC Bodoni or Berthold Bodoni Old Face would be good choices.</p>
      <p>David Thometz</p>
    html_clean: |-
