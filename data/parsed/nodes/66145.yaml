    html: "<p>I like type as the 'voice' of words on the page. The clothing analogy is good as well. And the analogy to shoes, which I think Hrant has often used, seems to work particularly well for text type. They have analogous practical constraints: comfort in walking, comfort in reading--yet style and beauty are also very important. Also you have different shoes for different purposes, and suiting the shoe to the outfit, etc. It is a surprisingly robust analogy.</p>"
