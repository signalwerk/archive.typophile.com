    html: |-
      <p>Designing typefaces, or better, characters, is like composing singular pictures which canvases are changing while you are drawing on it in 4 directions, open to your imagination. And it is like drawing a whole bunch of those paintings at the same time that not only have to have the same characteristics but also at the end have to stay together well, forming a whole new painting.<br>
      It is in my eyes one of the most difficult tasks in the midst of the battle between technique and art that mankind ever faced.<br>
      Very modest way to see it, I admit ;-))</p>
      <p>salute<br>
      Stefan</p>
