    <p>What are some analogies that help typophobes better understand the art? I've heard these two.</p>
    <p>Good type is like good lighting in a museum. It showcases the contents without being distracting or too noticeable.</p>
    <p>Typography is like the voice talent in an ad. You don't notice it when it's professional and appropriate, but when it's not, it just feels cheesy.</p>
