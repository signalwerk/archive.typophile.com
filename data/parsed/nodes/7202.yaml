    html: <p>BJ, you're right about Crank 8. Who'd have thought it would work as a text face? <br> <br>Jana, I think you're a few redesigns behind, or thinking of another version of Esquire (UK, perhaps?). The U.S. version uses serifs for display rather sparingly, but when they do it's a lovely cut of Mercury designed for that purpose. <br> <br>They also seem to have adoped GQ's strategy of rotating in a new display face every few issues. The September issue added a geometric slab-serif to the mix, mainly in the feature well. <br> <br><img src="http://www.typophile.com/forums/messages/83/51597.jpg" alt="esquire_slab.jpg"> <br> <br>Anyone care to ID this one? It looks like a destencilized version of FF Container or WaterTower.</p>
