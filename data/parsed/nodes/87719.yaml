  html: |-
    <p>I'm updating an old font of mine in Fontforge so I want to know which fields to change to avoid caching issues of different places (OS preview, Illustrator, Printers, etc)<br>
    I suppose some fields are family-wide (like font.version) and some others unique to the file (like font.uniqueid).<br>
    Do you change the filename when releasing updates (not a new release) ?<br>
    Thanks</p>
