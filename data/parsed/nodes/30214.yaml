    <p>Hi Typophiles,</p>
    <p>I'm very pleased to announce that <a href="/wiki/Beorcana" class="freelinking" rel="nofollow">Beorcana</a> is finished and released: all 28 fonts. <a href="/wiki/Tal%20Leming" class="freelinking" rel="nofollow">Tal Leming</a> did the final mastering, and there were many helpful people who critiqued the shapes, diacritics and performance. It's been a ponderous undertaking. My intention was to produce a workhorse book typeface without serifs, with display variants, for general use. I think it's successful, but I'll be very interested to see how people use it; a typeface comes to life with use. </p>
    <p>Font will be posted for sale on fonts.com in mid-January. I'll be updating <a href="http://www.beorcana.com" title="www.beorcana.com">www.beorcana.com</a> with more information and a better specimen PDF when I come back from vacation in January.</p>
  html_clean: |-
