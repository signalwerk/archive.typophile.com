    <p>Due to popular demand the Helveeta shirt is now in production! Co-designed with Brian Jaramillo, this garment speaks for itself - mostly because nobody else will speak for it.</p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/HelveetaShirt1_3660.gif"></div><p></p>
    <p>The price for a shirt is 24 Swiss Francs. For reasons of convenience you may assume this converts to exactly US$20 irrespective of currency market activity. Shipping (for one shirt) within the incontinental US is US$5. For reasons of international relations shipping to Switzerland is currently not available. If you'd like a shirt please email me with your payment preference, size (of shirt), and ground address: hpapazian_at_gmail_dot_com</p>
    <p>Important Note: the current order is for 25 shirts, 8 of which are already spoken for. Whatever doesn't sell by Friday will be offered for sale to the ravenous crowds at the LA screening of the Helvetica movie. If you decide to wait for a second batch of shirts, you are likely to be waiting for godot.</p>
    <p>hhp</p>
