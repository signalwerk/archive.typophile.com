      <p>Not only is water wet, you can swim in it, skate on it, add it to Scotch, listen to the ocean’s roar, mop the floor, heat by steam, be moved to tears, turn on the rear window wiper, shoot Niagara Falls by barrel or camera, &amp;c, &amp;c. </p>
      <p>What sort of effects hasn’t the computer had?</p>
      <p>Something I wrote in 2001 about the effects of digitization on the design profession:<br>
