      <p>I’m thinking my question wasn’t stated clearly enough. It’s not whether the computer has had an effect on type; of course as a tool for design the computer has had an effect (water is indeed wet). What i’m getting at is a question about the philosophies of design in practice today. Does the computer as a cultural/social/scientific/... phenomenon affect the ways in which designers approach design at a conceptual level. Does it affect ideas concerning what typography is for; what a good design is; what the relation between form and function ought to be? And if so, what sorts of effects has it had?</p>
      <p>James, thanks for the recommendation. </p>
      <p>Christopher, the paper i refer to is one that i’m in the process of writing, so can’t be cited.</p>
