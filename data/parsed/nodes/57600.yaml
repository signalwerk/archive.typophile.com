      <p>Personally, I have no desire to mimic the effects or artifacts of a previous technology—copying “the Look” seems pointless to me as a design effort. If others want to do this, I have no problem with that and will happily allow them to spend their lives as they wish.<br>
      I have years of memories of flat pen, handset, hotmetal, photo, coldtype, presstype, wood, linoleum block, silkscreen, and strike-on and all of their inherent issues good and bad so I have no need of a nostalgic fix. There is plenty enough for me to learn and do using today’s evolving troolset. Rather than going back to centuries old masters of prior times, I prefer to learn from those younger than I am today but who are better versed in the technology du jour than I am today.<br>
      I am not really fascinated by current tools, I am just in a hurry to learn them in time to make use of them before my clock stops ticking.</p>
      <p>ChrisL</p>
