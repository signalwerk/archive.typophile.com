    html: <p>Technology has always had an effect on type design — because it creates new possibilities, but also places limitations on what you can do (i.e., Monotype and Linotype). And the personal computer has had an effect not just on type, but on many other fields as well — look at what is happening in the music world. Nowadays, anybody can record a song in their bedroom; professional recording studios are slowly dying. Sound familiar?</p>
