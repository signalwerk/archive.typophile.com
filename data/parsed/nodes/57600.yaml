      <p>All we really have is a change in tooling. The questions that have some slight interest is how people respond to new tooling, and the inevitable effect of commercial practicality.</p>
      <p>For example, we could recreate much of machine-set letterpress with computer composition. But we don’t. Is that because it would take more effort than the result is worth, or because machine-set letterpress, in order to be commercially viable, itself involved compromises we would like to abandon. Etc., going back &amp; back. </p>
      <p>And the answer is both.  </p>
      <p>You can chronicle such changes, but it isn’t terribly interesting save for historians, and I suppose psychologists.</p>
