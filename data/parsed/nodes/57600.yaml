      <p>For me, the most important thing is that, back in the day, if a someone designed a new font, it would take a long time to be able to test it, let alone see how it would look in different sizes. And after the font was ready, if someone was willing to publish it, it would take a titanic amount of work (and costs!) to make it available for use.</p>
      <p>Today you can design everything by yourself, test it quickly in a lot of different ways, and make it available for the entire world in the blink of an eye - without having to cast tons of metal to make your font usable.</p>
      <p>This faster and cheaper way of working with type design allows much more experimentation, and what we see today is that instead of just slightly redesigning a previously available font, type designers are free to create whatever they want and see how it comes out.</p>
      <p>By the other hand, this is misleading people to think that all you need to design a font is a Mac and some spare time... no need to study or read anything... :|</p>
