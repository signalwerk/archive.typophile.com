      <p><em>photography is identified as a perfect match for the New Typography given its objectivity, clarity, and lack of individualism.</em></p>
      <p>And yet photography precipitated historicism: Emery Walker was a key figure, as photographer, incunabula bibliophile, and cutter (designer?) of the Kelmscott fonts for William Morris. Apparently, the Golden Type was drawn/traced over photographic images of Jenson’s printing.</p>
      <p>Morris Benton, who revived Jenson for the masses, as well as Bodoni and Garamond, was also a keen photographer—he had his own colour darkroom.</p>
      <p><em>...it isn’t terribly interesting save for historians, and I suppose psychologists.</em></p>
      <p>On the contrary, as I type designer I find the historical relationship between letter form and technology to be at the heart of my work.</p>
