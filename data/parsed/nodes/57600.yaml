      <p>Thanks all for the links, discussion, and historical facts. Very interesting comments — the impact being extensive: social, practical, aesthetic, zeitgeist-y. </p>
      <p>I’m struck by the apparent inseparability of the tool and at least some aspect of the product.<br>
      In ancient Greek the word ’techne’ refered to both art and craft (not in the William Morris sense), to any kind of making that had an end product. Through a series of translations the two were separated, and for some art stands in opposition to technology with all its negative connotations. I’m thinking type is one of those places where art and technology are still joined — where something like utility and something like beauty are both present in the production and in the product itself.</p>
      <p>No doubt, i’d add that the relation between letter form and technology has been of interest to philosophers as well.</p>
