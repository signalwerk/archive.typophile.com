    <p>Beyond its use as a tool, has the computer affected type design?</p>
    <p>In the process of researching a paper on the New Typography and its claims of correspondence to the world, i’ve been struck by the importance of photography to the movement. Not only have i run into accounts of design history that basically disregard anything that happened between Gutenberg and Niépce/Daguerre as unimportant, but photography is identified as a perfect match for the New Typography given its objectivity, clarity, and lack of individualism. Whether these characteristics are applicable, it’s clear that the ways in which photography affected worldviews in the late 19th and early 20th centuries had an effect on this particular theory of type design.</p>
    <p>It’s got me wondering what sorts of effects computers have had upon type design. Not being a designer myself, i’m curious if folks have an opinion on this. Particularly if there are characteristics of the computer (such as its reliance on numbers and patterns, its use in networks, its close ties to scientificity...) that have had an effect on (your or other) design in recent decades.</p>
