      <p><cite>On the contrary, as I type designer I find the historical relationship between letter form and technology to be at the heart of my work.</cite></p>
      <p>If that is meant as a personal, psychological statement — what motivates a type designer — then no quibble. </p>
      <p>If not, the point I was trying, and obviously failed, to make was that if we chose, we could reintroduce *most* of the effects of the hot metal composition with computer type. Just a couple of instances — a randomization program could be used to introduce slight variations in letters, mimicking the variation from casting individual letters in a mould.</p>
      <p>Ink spread could be compensated for. And on &amp; on. Given that, the question could be asked: Do we not do this because the original “look” was itself an an aberration? Or if it was desirable, it must not have been so desirable as to be worth all the work to replicate it.</p>
      <p>You can argue that some of look of metal type was an aberration, occasioned by the technology,<br>
      but an equal answer is that many of those “aberrations” could have been banished with the technology of the time; they were not because the cost, both in type machines and time, couldn’t be commercially justified. And it was that commercial considerations that brought about that technology to start with, not aesthetic ones. </p>
      <p>The technological change (now to computers) may have occasioned designers to move in different directions, but they could have moved that way anyway, albeit at a much higher cost.</p>
      <p>Sorry, I believe tooling from a market perspective is essentially an historical, not aesthetic matter. Except, as always, for personal motivation.</p>
