      <p>Charles, it’s not just personal motivation.<br>
      The discourse of type design concerns time and technology.<br>
      With every new wave of technology, the classics are reinterpreted.<br>
      They provide a benchmark against which to assess the qualities of new media, and a challenge for humanizing it.<br>
      At the same time, new media interpretations provide a fresh perspective on how the classics were informed by previous technologies.</p>
