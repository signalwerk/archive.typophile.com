      <p>Recently, continuing that thought, I’ve come to realize that the defining characteristic of a career in design is not the work one does, but dealing with tools that change constantly, designers being always at the mercy of technological progress. No doubt it’s true that for many professions one needs to be up to date with the latest technology in order to work, but it seems to be particularly so for graphic design.</p>
