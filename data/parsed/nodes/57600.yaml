      <p>One of the reasons this thread isn’t getting much play is that question is huge. Really broad questions are hard to answer well. </p>
      <p>Also nobody has time to write your paper for you. </p>
      <p>Also I think that you will find that any kind of broad brush aesthetic relationship that you might theorize will be shot to pieces by the reality. The impact of on type/printing has not been to advantage one aesthetic as might be imagined but on specific technical aspects, the cultural, jobs, roles, etc and will require looking at printed things talking to people and observing things from there. Some things to begin looking at are font availability, methods of printing, printing costs, availability of letter making tools and well - that is maybe enough for now.</p>
      <p>My advice is read and think more, maybe ask some older folks what happened to them and return with much much narrower questions.</p>
