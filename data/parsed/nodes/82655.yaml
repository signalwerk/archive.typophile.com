      <p>Good suggestions.</p>
      <p>Already featured in the last 3 volumes:</p>
      <p>Indie Fonts (1): Altered Ego, Astigmatic, Carter &amp; Cone, Chank Company, Font Diner, fontBoy, Fountain, Garage Fonts, IHOF, Letterror, P22, Psy-Ops, Synfonts, Test Pilot Collective, Typebox, Typeco, Typodermic, Typotheque</p>
      <p>INDIEFONTS 2: Atomic Media, Feliciano Type Foundry, Galapagos, Holland Fonts, Identikal, Ingo Fonts, Jukebox, MvB Fonts, Neufville, Nick's Fonts, No Bodoni Typography, Parkinson Type Design, Mark Simonson Studio, Sherwood Type Collection, Storm Type Foundry, Terminal Design, Underware, Union Fonts, You Work for Them</p>
      <p>INDIEFONTS 3: Baseline Fonts, Blue Vinyl Fonts, Device Fonts, E-phemera Fonts, Font Brothers, Handselecta, Jeremy Tankard Typography, Kenn Munk, Letterhead Fonts, Pizzadude, Positype, Process Type Foundry, Rimmer Type Foundry, Shinntype, SparkyType, Suitcase Type Foundry, Suomi Type Foundry, Village, Virus Fonts, Wilton Foundry</p>
      <p>Possible requirements? Just that they are an recently established independent foundry with a fairly decent sized collection to show.</p>
