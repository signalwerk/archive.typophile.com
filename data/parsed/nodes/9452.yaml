    html: <p>&gt; <i>I really don't want to see those "other entries".</i> <br> <br>Yves, what's funny is that the other posters must be better. Generally, Oscar posters are gaudy and glamorous but most of the time the typography is well considered and "elegant" in that hollywood way. This poster is clearly the work of system fonts. There is nothing unique about the poster's typography, much less the illustration which seems like a quick posterization/threshold in Photoshop. I like the "color" idea, I just don't like those colors.  <br> <br>So, no idea what type "Oscar" is? I can't believe the master is stumped!</p>
