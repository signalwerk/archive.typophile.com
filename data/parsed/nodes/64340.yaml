    html: |-
      <p>I'd argue that (most of the time) one would not want the logo typeface (or logotype) to be used as standard headline/body type in the rest of the branding. You'd want the logo to stand out on its own.</p>
      <p>Exceptions would be maybe something like the Walker, where the typeface *is* the overall branding element moreso than a specific logo. (But in those cases, you likely wouldn't be using a off-the-shelf commercial font--let alone a free font)</p>
    html_clean: |-
