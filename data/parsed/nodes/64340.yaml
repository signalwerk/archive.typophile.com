      <p>Free fonts typically won't hold up well for a high-exposure, iconic, branded logo.</p>
      <p>But for lower profile, non-iconic logos that aren't seeking to develop a strong brand identity... yes.</p>
      <p>I think it really comes down to branding. Most free fonts just can't hang when it comes to competitive branding. But there are exceptions.</p>
