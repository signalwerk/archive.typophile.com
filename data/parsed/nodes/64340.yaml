    html: |-
      <p>There is always one thing one should consider (in my humble opinion): </p>
      <p>Am I going to create a logo, and is that going to be it? In other words, will my customer get the logo, and be happy with it, and simply use it? If so, I can use ANY font I deem suitable!</p>
      <p>however, should it be possible that my customer might one day use the font in the logo to do other stuff, like flyers, posters, or even use it as a textface.... then I would make sure I am using a font from a foundry that I can rely on to keep the font in good shape, and up-to-date. I would not use a free font.</p>
      <p>I ran across the following problem quite a few times: there was a logo made with a free font, and all of a sudden my customer wants to use it for some big time advertisement campaign in all kinds of languages, including Cyrillic. The free font was good enough to do the logo - but you could not do decent print jobs with it, there was no OT version, and of course no Cyrillic version, either. They were quite angry with me when I told them. Shucks.</p>
      <p>So if it is an artsy logo, which will end up being nothing but a cool logo, use everything you want! But if it is a business logo, and chances are your customer will get ideas, think twice before doing it. I, at least, learned the hard way :-)</p>
    html_clean: |-
