      <p>Rich,</p>
      <p>&gt; But outside of steering customers towards using GWF as a service, I'm not sensing anything that isn't "genuine".</p>
      <p>Google is relying on general people's ignorance to distribute its freebie services. Should they have a large banner saying "by using this service you give up your privacy and the privacy of your visitors", do you think they would have not seen a dip in user numbers? </p>
      <p>Consider a post office that would offer free PO boxes to anyone, but under an explicit condition that they would look and retain a copy of every mail received. How many customers would such venture acquire? Or better yet - how many <em>business</em> customers? Zero. Why then it is acceptable to use Gmail as a business email box? Even if a company is OK with sharing their day-to-day operations with Google, their customers might not be. Google enticing ignorant masses to use their services effectively does wrong not only them (which they might deserve), but also those who they are getting in contact with. And <em>this</em> is what really rubs me wrong and what feels disingenuous - Google advances their business by exploiting people's ignorance. That's not good.</p>
