      <p>Since we're relating courtroom exchanges -- fictional or otherwise --, here's one of my favourites, as told by the late great Utah Phillips:</p>
      <blockquote><p>Oh so many times [Ammon Hennacy] stood up in front of Federal District Judge Ritter, that old fart, and he'd be picked up for picketing illegally, and he'd never plead innocent or guilty — he'd plead anarchy.</p>
      <p>And Ritter'd say, "What's an anarchist, Hennacy?" and Ammon would say, "Why an anarchist is anybody who doesn't need a cop to tell him what to do."  Kind of a fundamentalist anarchist, huh?</p>
      <p>And Ritter'd say, "But Ammon, you broke the law, what about that?" and Ammon'd say, "Oh, Judge, your damn laws: the good people don't need 'em and the bad people don't obey 'em so what use are they?"</p></blockquote>
