  html: <p>What does Google stand to gain from web-fonts? Their business MO seems to be "build it and they will come, then find a way to suck money from it." They seem to have sunk some significant resources into the web-fonts project, and bandwidth/server load (although practically free for Google) has to be fairly substantial. Mostly to drive adoption of Chrome? Or do you believe this is a genuinely altruistic move? What are the benefits/detriment to the type design community? Any speculation/comments?</p>
