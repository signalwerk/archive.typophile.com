      <p>Google will eventually—if it is not already—use its web fonts system to collect information about internet traffic by monitoring font downloads from sites linking directly to Google servers. Free novelty fonts are an excellent way for Google to collect this data from thousands, if not millions, of small web sites that are not using Google Analytics.</p>
      <p>Google's web fonts also provide Google with a large base of fonts that can eventually be used with its cloud applications at no cost. This provides Google with a huge advantage over Microsoft Office, which requires users to manually download and install fonts before using. Financially this especially good for Google given that Google pays less for its font commissions than some designers would charge for such a license.</p>
