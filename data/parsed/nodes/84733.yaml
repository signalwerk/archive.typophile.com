      <p><strong>Attorney For John Hudson</strong>: Your Honor, if it pleases the court, my client is unimpressed by legal precedent and considers it his "natural" right to control his creations.</p>
      <p><strong>Judge Judy</strong>: Well, maybe on the little island of Gabriola they recognize such a right, but here in the United States no court ever has and I'm not about to be the first judge in 250 years to try. Infringement is a Statutory Tort, that's all. And tell your client to watch his attitude. If Mr. Hudson wants to be impressed in Rikers for few days with real criminals, not the college kids whose supposed lack of morals has him in a snit, I'd be happy to oblige him.<br>
      And he's not trying to pee on my leg, is he?</p>
      <p><strong>Attorney For John Hudson</strong>: Oh, no, Your Honor. My client would never dream of such a thing.</p>
      <p><strong>Judge Judy</strong> Alright then. Here's my ruling:<br>
      Mr. Hudson's talk of a 'natural' right is sometimes called "The Agrarian Metaphor". In other words, the right to reap what you sow. It just doesn't exist in US black letter law or jurisprudence, so please tell your client he's up a creek without a paddle.<br>
      The agrarian argument is baloney. But for a more ritzy rebuttal, nothing beats what my colleague Judge Benjy Kaplan has to say about the 'right' to copy:</p>
      <p><em>"If any person has any 'natural rights', not the least must be a right to imitate his fellow, and thus to reap what he has not sown. Education, after all, proceeds from a kind of mimicry, and 'progress', if it is not entirely an illusion, depends on generous indulgence of copying."</em></p>
      <p>In light of this, I sentence your client to twelve years in Leavenworth, eleven years in Twelveworth, and five to ten in Woolworth, time to be served consecutively.<br>
      [Strikes gavel.]</p>
      <p>Next case.</p>
      <p>In my next installment, I'll toss some red meat to Berkson, and talk about the agrarian metaphor in the context of the Torah. I first learned about it in religious school too many years ago to admit to. But since farming was not a big activity for nice Jewish boys in Brooklyn, I'm delighted by the newfound relevance to copyright law, at least.</p>
      <p>(Sorry to skip other comments for now, time for a commercial break. I'll be back.)</p>
