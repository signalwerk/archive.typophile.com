      <p>apankrat, I am an independent font consultant who does some work with the Google Web Fonts team. </p>
      <p>The TTFs in the convenient download are for the needs of most people, who want to download and install on their own computers for making web page mockups in image editors/vector drawing apps.</p>
      <p>These TTFs are not really different to the actual TTFs served - the served fonts are just subset, you can download the subset files that are served from <a href="http://code.google.com/p/googlefontdirectory" title="http://code.google.com/p/googlefontdirectory">http://code.google.com/p/googlefontdirectory</a> - which also includes the FontForge subset.py script I use to make these subset files.  This Google Code repo is linked to from the Download modal dialog. </p>
      <p>How you do your web font format conversion is up to you. As far as I know by looking at the results, the EOT/WOFF conversion done by the API servers is just compression, it doesn't effect the way the fonts look - as you can see by looking at fonts in MSIE8 (EOT) and Firefox 3 (WOFF) and Chrome (TTF) - so if you look at your converter's options, perhaps you can stop it from changing things.</p>
