      <p><em>The other half is to ensure that society as a whole benefits from the inventiveness of mankind by not allowing said rights to be possessed in perpetuity. </em></p>
      <p>Yes, although one shouldn't give the impression that the social benefits are postponed until copyright expires. We benefit in all sorts of ways from works that are still protected and whose creators are still receiving income from the sale, rent, licensing etc. of their work. Also, in many cases the copyright status of a work has little bearing on its cost to the public: a concert ticket costs pretty much the same whether the works performed are by long dead composers or by living ones; classic movies on television are interrupted by just as many commercials as modern ones.</p>
