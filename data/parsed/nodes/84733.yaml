      <p><cite>I want to thank you for buttressing my point</cite></p>
      <p>Respectfully Richard, I'm not buttressing your point. I'm suggesting that whatever your point is, it rests on deep misrepresentations (or perhaps misunderstandings) about how U.S. law works. </p>
      <p>Anyone is allowed to argue —&nbsp;and many do —&nbsp;that contemporary copyright policy has drifted from its original purpose, and has been influenced by corporate interests. For instance, Disney lobbied heavily for the 1998 Copyright Term Extension Act. That's a fact.</p>
      <p>But it's incorrect to make generalizations like "there is no right in copyright" or "there are rights and there are rights" or "what kind of right worthy of the name can be revoked by a single act of Congress." The answer: all of them, to one degree or another. The judicial and legislative branches can revoke your rights too. No legal right is absolute, not even freedom of speech. And if one right seems "stronger" than another, it's only because government has made more of a habit of respecting that right.</p>
    html_clean: |-
