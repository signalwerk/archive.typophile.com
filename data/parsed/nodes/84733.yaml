      <p>En garde!</p>
      <p>@butterick</p>
      <p>I don't know what John is referring to. I've seen all three Pirates Of The Carribean movies and Johnny Depp didn't download a song once, not once.</p>
      <p>With that out of the way, I want to thank you for buttressing my point!</p>
      <p>Judge Benjamin Kaplan wrote, in his book <em>An Unhurried View Of Copyright</em>:</p>
      <p>"To say that copyright is "property", although a fundamentally unhistorical statement, would not be badly misdescriptive if one were prepared to acknowledge that there is property and property."</p>
      <p>Similarly, there are rights and there are rights. The fiction is that the "right" in copyright is a "right" on a par with, say, freedom of speech as it is written in the First Amendment. This, of course, is how the music, movie, and publishing industries frame it and spend a fortune getting the general public to believe.<br>
      But factually it's crap, to put it bluntly. The copy "right" itself is <strong>not</strong> in the Constitution and could be revoked instantly by a single act of Congress.<br>
      What kind of "right" worthy of the name can be revoked instantly by a single act of Congress?</p>
      <p>In 1909, in passing a new copyright act, Congress addressed the basis for copyright in the United States:</p>
      <p>"The enactment of copyright legislation by Congress under the terms of the Constitution is not based on any natural right that the author has in his writing, for the Supreme Court [in Wheaton v. Peter] has held that such rights as he has are <em>purely statutory rights</em>, but upon the ground that <em>the welfare of the public will be served</em> and progress of science and useful arts will be promoted by  securing to authors for limited periods the exclusive right to their writings. <em>The Consititution does not establish copyrights</em>, but provides that Congress shall have the power to grant such rights if it thinks best. <em>Not primarily for the benefit af the author, but primarily for the benefit of the public such rights are given</em>. Not that any particular class of citizens, however worthy, may benefit, but because the policy is believed to be for the benefit of the great body of people, in that it will stimulate writing and invention, to give some bonus to authors and inventors."</p>
      <p>I'll be back with more about this so-called "right".</p>
