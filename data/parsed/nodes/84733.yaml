      <p>Google is in the business of collecting and cross-referencing information. Every time someone embeds yet another Google's freebie - be it a font or a +1 button or what have you - this person effectively paying Google back by letting them to better track his site's visitors across the web.</p>
      <p>In other words, next time you happily drop that urchin.js on your page keep in mind that while it is free for <em>you</em>, it comes at the expense of your visitors sharing more than they would likely ever want to with Google.</p>
      <p>/rant</p>
      <p>PS. Note how GWF goes out of its way to encourage the use of <em>hosted</em> versions of fonts. There is a Download button, but it links to a zip of a TTF, not an @font-face package. Clicking on the button will show a big fat red warning saying "<em>You do not need to download the font to use it on your webpages. Instead, refer to the "Use" section.</em>" </p>
      <p>I suppose this can all be benign and it might just be them treating web designers as complete idiots, but something's off and not... erm... genuine if you will.</p>
