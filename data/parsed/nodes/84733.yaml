      <p>I consult for Google Web Fonts, and this post (like all my communication) is merely my own opinion and doesn't represent the veiws of the GWF team, Google Inc, or anyone else. </p>
      <p>I think <a href="http://www.youtube.com/watch?v=QTX1lU97z08" title="http://www.youtube.com/watch?v=QTX1lU97z08">http://www.youtube.com/watch?v=QTX1lU97z08</a> is fairly explicit about what the end game is. Image of text are fundamentally bad for Google's core technologies, and plenty of peripheral ones like translation, accessibility, etc. The web fonts market is substantially bigger because of Google Web Fonts for all proprietary font vendors, so I find it odd when people suggest GWF is harming proprietors. Anything that stops web publishers using images of text is a gain for Google; 'whats good for the web is good for Google.' </p>
      <p>And if anyone would like to discuss contributing fonts to Google Web Fonts for money, let me know :-) <a href="mailto:dcrossland@google.com">dcrossland@google.com</a></p>
