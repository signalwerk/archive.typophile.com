      <p><em>There is no equivalency between what's commonly referred to as "Intellectual Property" - copyright, patent, and trademark - and real property.</em></p>
      <p>I never used the term equivalency. What I said was that both intellectual property and physical property are subjects of law, and that the law regarding both deals with rights of usage. So, for example, I may own a piece of land according to property law as it applies to real estate, but what I can do on that land and how I can use that land is further circumscribed and limited by law, including other aspects of property law (ergo, in Canada, I do not own the substrate, to which the crown could sell mining rights to someone else). My point was that if we take the term 'illegal' to mean contrary to law -- which is the simple parsing of the word --, then both physical and intangible asset law defines usage rights whose violation may be termed illegal, i.e. contrary to the law regarding those rights.</p>
      <p>If you are going to insist on the inequivalency of tangible and intellectual property in law, then you should also not bunch together copyright, patent and trademark, since these are not equivalent in either their basis or the obligations they impose. Of the three, patent is arguably the closest to physical property (but see link below) since it is a grant of privilege (periodic monopoly) by the state, analogous to property title: you own something because the state grants you rights to that particular thing. Copyright is associated with the act of creation, and applies to whole categories of creative works not to particular things, which is why registration of copyright is optional: you own something that belongs to a category of copyrightable creations because you made it. Trademark is founded on use in the market, even in the case of registered trademark, and comes with an obligation to defend: you own something because you use it and actively prevent other people from using it.</p>
      <p>Finally, this article on <a href="http://ben.klemens.org/blog/arch/00000010.htm" rel="nofollow">physical vs. intellectual property</a> is a good read. It argues, persuasively I believe, that physical and intellectual property law are not only directly analogous but, in fact, aspects of a single conception of property.</p>
    html_clean: |-
