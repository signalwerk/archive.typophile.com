    html: "<p>My point was that the copyright status of the works that we enjoy in those examples makes no difference to the price we pay for that enjoyment. So, for instance, the price of the concert ticket is the same regardless of whether the works performed are in copyright or not. Now, if the composer is alive, he presumably gets some cut of the ticket price as a performance royalty; if the composer is dead and the work is out of copyright, then someone else gets that portion of the price: the savings isn't passed on to the ticket buyer. This is what I meant when I said that the copyright status of a work may have little bearing on its cost to the public.</p>"
