      <p>@apankrat</p>
      <p><em>"Clicking on the button will show a big fat red warning saying "You do not need to download the font to use it on your webpages. Instead, refer to the "Use" section."</em></p>
      <p>There's no doubt in my mind that GWF is trying to encourage linking to the fonts. It's pretty obvious. Of <strong>course</strong> they are. If they weren't, they'd be working against their own interests. (see abattis' previous comment)<br>
      But the fonts ARE available for download. Free to use as you will. Personally, I see no obligation on Google's part to be Font Squirrel/Fontspring 2.0.</p>
      <p>Now, I STILL can't figure out the reasoning behind some aspects of GWF and I've sounded off on my blog about one of them. But outside of steering customers towards using GWF as a service, I'm not sensing anything that isn't "genuine".<br>
      I don't find it underhanded if a company that's providing 1) a valuable service for free, 2) open source product for free, then encourages it's users to select #1 because it serves that company's interests best. (And there's a good argument to be made that using the service IS the user's best choice, too.)<br>
      Me, I'd rather host my own fonts. But obviously a lot of people do like the service.</p>
