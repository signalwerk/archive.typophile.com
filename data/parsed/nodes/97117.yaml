      <p>use of lethal force is a whole different argument. Police are trained to shoot for 'centre of body mass'. I.e., shoot to kill. If there are heavily indoctrinated to shoot for the centre of body mass and if they shoot to injure, they are liable to be disciplined for negligence. On the other hand, how about training them to use their heads and defuse tense situations instead of escalating them like idiot teenage jocks. </p>
      <p>Tasers reduce the likely hood a cop will bother to talk a situation down before playing Quick Draw McGraw.<br>
