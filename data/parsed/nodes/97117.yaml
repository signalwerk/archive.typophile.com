    <p>Hi everybody,</p>
    <p>Thank you for adding us to your forum.<br>
    ___________________________________________________________<br>
    We just wanted to invite you to a little contest we are having for Halloween:<br>
    It's called the TASER C2 vs. Zombies: Infographic &amp; Poster Contest.</p>
    <p>It's free to participate and you can win a TASER C2 ECD.<br>
    Rules and other details are available on that landing page: <a class="freelinking external" href="http://www.taser.com/zombies" rel="nofollow">http://www.taser.com/zombies</a><br>
    You can also email TASER at <a href="mailto:zombies@taser.com">zombies@taser.com</a></p>
    <p>Just a fun way to get free stuff! Pass it on to your friends too!<br>
    Thank you again<br>
    __________________________________________________________</p>
    <p>TASER International</p>
