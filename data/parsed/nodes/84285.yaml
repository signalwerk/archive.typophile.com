    html: |-
      <p>The tails running into the next letter lacks the italic flow of the letters themself, and the e lost a lot in your redrawing. I think it's mainly a matter of angle and weight: look at the upstroke on n for a guide. Also, Garamond is a text serif. This is a 12 point master maybe? For a logotype the expressive possiblities are vast compared to the conventions and limitations of text type. </p>
      <p>This does not feel like a mark for the "top place to eat". </p>
      <p>Btw, I love it when someone start experimenting with type based logos :) Since this is for a client, maybe you should consider collaborating with a type designer to "produce" your idea in a professional manner? Don't stop drawing though.</p>
