  html: "<p>This font was borned one year ago and was created to use to graphic applications of a music band ( Gothic/Industrial ), and I give the same name of  the group. <br>I classify as decorative typography and have irregular form, wich I mixed serif version ( Van Serif Regular ) with a sans-serif ( Van Sans Regular ). The forms are broked and destroyed which give a wear away apperanced. The strokes and bars pass the limit of the guidelines which broke the visual references effect, like all most of overshoot references. Zeit Geist function better as display font because don't have a legibility concept to use as text.GIF / JPG: <br><img src=\"http://www.typophile.com/forums/messages/29/202.jpg\" alt=\"Text Description\"></p>"
  html_clean: "<p>This font was borned one year ago and was created to use to graphic applications of a music band ( Gothic/Industrial ), and I give the same name of  the group. <br>I classify as decorative typography and have irregular form, wich I mixed serif version ( Van Serif Regular ) with a sans-serif ( Van Sans Regular ). The forms are broked and destroyed which give a wear away apperanced. The strokes and bars pass the limit of the guidelines which broke the visual references effect, like all most of overshoot references. Zeit Geist function better as display font because don't have a legibility concept to use as text.GIF / JPG: <br><img src=\"http://www.typophile.com/forums/messages/29/202.jpg\" alt=\"Text Description\"></p>"
