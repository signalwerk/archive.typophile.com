    html: <p>Hmmm... It may be similar in feel to P. Scott Makela's "Dead History" (1990) (<a href="http://www.emigre.com/PDeaR.html" target="_top">http://www.emigre.com/PDeaR.html</a>), but it is pretty obviously a very different design. <br> <br>The same could be said about Max Kisman's "FF Fudoni" (1996) (<a href="http://www.fontfont.com/shop/" target="_top">http://www.fontfont.com/shop/</a>), but again, it is quite apparent to me, anyway, that "Zeit Geist" is an original design, borrowing (and only partially so, at that) from a similar idea. <br> <br>I like the direction Zeit Geist is going, especially in the lower case italics. The lc italic "x" is especially interesting in both weights. <br> <br>David</p>
    html_clean: <p>Hmmm... It may be similar in feel to P. Scott Makela's "Dead History" (1990) (<a href="http://www.emigre.com/PDeaR.html" target="_top" class="link-external">http://www.emigre.com/PDeaR.html</a>), but it is pretty obviously a very different design. <br> <br>The same could be said about Max Kisman's "FF Fudoni" (1996) (<a href="http://www.fontfont.com/shop/" target="_top" class="link-external">http://www.fontfont.com/shop/</a>), but again, it is quite apparent to me, anyway, that "Zeit Geist" is an original design, borrowing (and only partially so, at that) from a similar idea. <br> <br>I like the direction Zeit Geist is going, especially in the lower case italics. The lc italic "x" is especially interesting in both weights. <br> <br>David</p>
