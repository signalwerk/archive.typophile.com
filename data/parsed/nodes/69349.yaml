    html: |-
      <p><cite> it makes me wonder if something is wrong with it</cite></p>
      <p><a href="http://new.myfonts.com/fonts/nicksfonts/samosata-nf/?refby=mfde" rel="nofollow">Samosata</a> is based on <a href="http://new.myfonts.com/fonts/agfa/bernhard-gothic/alternate_cuts.html?refby=mfde" rel="nofollow">Bernhard Gothic</a>. This old metal font has a couple of alternate characters. One can intersperse a line with those in order to establish a quirkier Art Deco look. Some digitizations of Bernhard Gothic also feature these extra glyphs, see <a href="http://new.myfonts.com/fonts/agfa/bernhard-gothic/bern-got-book-alt/" rel="nofollow">the Agfa/Monotype version</a>. For Samosata, Nick Curtis has merged all those alternates into one font. While the single-storey ‘a’ or the ‘k’ with its proudly exposed leg is nice, other characters are way too strange to work (as default forms): the uncial ‘e’, the ultra-narrow ‘s’, the ‘z’ with descender …</p>
