  html: |-
    <p>I hope I've posted this in the right location. I'm a desktop publishing hobbyist, and I've been asked to create a poster for a local nonprofit. I'd like to find a sans-serif font with a perfectly round capital G, thick letters (but not too thick), with a high crossbar. (Is that the right word for it?) This is for a fund-raising dinner, and my plan is to turn the G into a plate, and the crossbar into the shape of a fork.</p>
    <p>Any recommendations?</p>
    <p>Jenel</p>
