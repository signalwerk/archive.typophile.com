      <p>Theunis: "OT: what fonts do actually contain unicase variants for what's a regular font in everyday use?"</p>
      <p>Several in recent years, including my own Hypatia Sans. <a href="http://www.adobe.com/type/browser/landing/hypatia/hypatia.html">http://www.adobe.com/type/browser/landing/hypatia/hypatia.html</a> (though I'll be the first to say I made the wrong call on the unicase "r" shape).</p>
      <p>Mjkerpan: "In general, more people are going to donate to a solid but unoriginal font that they can make lots of use of across many contexts than they are to donate to a project seeking to make a wild display face "</p>
      <p>That is not my observation about which typefaces are being successful on Kickstarter (and I have looked at all of them, as I have proposed a conference talk on Kickstarter and font development). Having a gimmick is a big thing. I'm not saying that they are really weird, but I don't think they tend to fit your description above.</p>
