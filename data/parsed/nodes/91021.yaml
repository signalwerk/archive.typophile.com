    html: <p>In part because of the poor quality of many of the wacky early 90s display fonts, conservative type has come to be STRONGLY associated with quality. Therefore the type choices made by the people who select fonts for inclusion into Google Web Fonts probably tend towards the conservative. Also, many fonts on GWS are funded by Kickstarter and similar donation schemes. In general, more people are going to donate to a solid but unoriginal font that they can make lots of use of across many contexts than they are to donate to a project seeking to make a wild display face that will probably never get used by anyone over the age of 10 or so...</p>
