      <p>(I started this thread to see if it would be possible to repurpose Typophile and talk about fonts in a way that wasn’t about hinting, readability science or EULAs, but about type design. I had a feeling I was going to get into trouble…) </p>
      <p>I took a closer look at Alegreya, starting with the Roman.</p>
      <p>Immediately, I was reminded of Mendoza (1991), by the cut of the bowl of the “a”, the absence of a centre serif in “E”, the low contrast, the heft of the serifs, and the general proportions—a combination of qualities which I had remembered as a matched package in Mendoza.</p>
      <p>So I compared the two, and I believe my general contention about Google Fonts is confirmed by this example, because although Alegreya is a quite different typeface, with more lively drawing, more demonstrative serifs, and a slight tilt, it is in the same vein as Mendoza, an hommage perhaps.</p>
      <p>I’m not criticizing this or any other face in particular for having a precedent, just observing that so far, in toto, Google Fonts are a conservative bunch of designs. And I wondered how much the method by which they have been sourced has to do with that.</p>
