      <p>There is some difficulty in creating type today that is not "conservative" in some way. And how would you define a progressive type? Haven't all the new, interesting things already been done before? Even many of the Fontfont's, sure, progressive in their "day", (though not long ago) are now quite conservative looking.</p>
      <p>The conservative quality is indeed evident in the appearance of most of Google's collection. That extends beyond even the appearance, to the features themselves. And perhaps that is in part to be blamed on the nature of a webfont—throwing in a bunch of interesting Opentype features seems tentative at the moment. I think perhaps the method in which they are sourced could be indeed to blame, at least partly.</p>
      <p>What would you say would be a better approach for Google webfonts? Is it a problem of ingenuity or something else?</p>
      <p>But what is truly "pushing forward" verses following trends in type design? Should political and social movements influence type? And to what extent? (and is this straying to far off topic? should we create another thread just for that question?) </p>
      <p>Edit: I went ahead and created <a href="http://typophile.com/node/91158">another thread</a> for the last paragraph.</p>
