    <p>Why is it I get the impression that Google Fonts is 1001 Free Fonts?<br>
    Sure, Fontographer and DTP opened up type design to the crowd, but the result was wild and crazy invention. A lot of it was sloppy and amateurish, but at least it was original.<br>
    Now web fonts is virgin territory, but the crowd has responded with little in the way of innovation.<br>
    Let’s hope this is just a phase, and the participants up their game pronto.<br>
    If not, Google may become an object of designer derision, as Microsoft has long been.</p>
