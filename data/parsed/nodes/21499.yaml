      <p>All you can do is give them a variety of options to try out, until you come across something that works. And give the optional fonts markedly different (silly, even) names and numbers, to avoid conflicts.<br>
      I've had various problems to do with naming and encoding, and it seems to me it's best just to find something that works, rather than figure out the whys and wherefores, or who's responsible.</p>
