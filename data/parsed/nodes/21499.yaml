    <p>How do all!</p>
    <p>I am in a pickle. I've designed a font and have provided it in PC type 1 format. When the company install the fonts onto their aged bespoke systems, everything is fine, but for some very strange reason the space character is much bigger than it should be. When you highlight the character on their machines, you can see an extra space appears to be added.</p>
    <p>It sounds like a problem with them, but they already have several hundred other fonts, where this isn't a problem. This makes me think it's a problem inside the font.</p>
    <p>Has anyone experienced this? I wonder whether the data that holds the width of the space character might be duplicated somewhere, and the duplicate is different.</p>
    <p>Yours... at the end of his tether.</p>
