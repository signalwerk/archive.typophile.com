    html: |-
      <p>The bespoke software unfortunately is the only one of its kind in operation, and the makers disappeared into the ether soon after it was sold years ago. It runs on pc's, and perhaps I'm being naive here, but the encoding I used was 'default encoding'. The fonts also get converted into a software native binary file, but that's probably more of interest than of help.</p>
      <p>The problem still has yet to be fixed and I'm now changing the encoding to 'windosws ANSI. I'm also weaving myself a long rope.</p>
