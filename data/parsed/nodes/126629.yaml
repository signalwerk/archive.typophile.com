      <p>Appears to be Fairfield, by Rudolph Ruzicka (1939):<br><a href="http://www.myfonts.com/fonts/linotype/fairfield/">http://www.myfonts.com/fonts/linotype/fairfield/</a></p>
      <p>Fanwood is an barely credited revival of Fairfield:<br><a href="https://www.theleagueofmoveabletype.com/fanwood">https://www.theleagueofmoveabletype.com/fanwood</a></p>
