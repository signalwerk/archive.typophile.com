    <p>I'm trying to figure out what typeface was used in this 1967 FSG edition of Edmund Wilson's A Preface: Landscapes, Characters, and Conversations from the Earlier Years of My Life.</p>
    <p>It's got a nice rhythm to it. Must be a common book face.</p>
