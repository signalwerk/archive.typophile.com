    html: |-
      <p>I wouldn't kern it <strong>too</strong> much, just strike a balance. And anyway, an occasional big wordspace is still better than neutering such a valuable facilitator of immersive reading. Our reading mechanism has no problem skipping over a blank space no matter  how wide it is - it just has to be wide <strong>enough</strong>; its only real drawbacks are: when the leading is extra tight (a bad idea anyway) the wordspace can overpower the line separation, leading to the reading of a word on the following line by mistake; and it uses up the retina's acuity faster than necessary. "Look like a mistake?" There's no time for such conscious sensitivity during immersion.</p>
      <p>And don't forget: there is after all such a thing as too much even color; evenness is ideal for display, but can -and by display face designers, usually is- taken too far, like a luxury car that insulates you too much from the driving environment. By the logic of totally even color, one would have an I-never-leave-the-house "f" for <strong>every</strong> situation.</p>
      <p>hhp</p>
