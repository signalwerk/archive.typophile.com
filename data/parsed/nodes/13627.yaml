    html: |-
      <p>&gt;a positive kerning pair for “f”-space.</p>
      <p>You might be able to use that strategy, but it would require class kerning with a three-glyph action, because it would only be activated in [f_space_"tall glyph"] situations. Otherwise, it would create a big wordspace after every f-terminated word, which would look like a mistake.</p>
      <p>However, if you need that kind of OT ability to solve the problem, why not just have a contextual alternate "f", with less of a flair?</p>
      <p>This kind of use of contextual alternates to improve clour and lessen confusion is something that OT can provide -- another example would be an alternate "r" for sans faces, to solve the "r_n = m" problem.</p>
    html_clean: |-
