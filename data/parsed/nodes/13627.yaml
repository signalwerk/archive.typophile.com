      <p>&gt;Quadraat is a great font.</p>
      <p>I love it, and read a lot of it in the London Review of Books, which uses it for everything except the nameplate. However, it does have a flaw, the huge overhang of the "f". It stretches across wordspaces, almost touching capitals such as "T", as in "A Tale of Two Cities". I can appreciate the merit of the clever way it forms nice ligatures with b, h, f, i, j, k, and l, and it's OK in the middle of a word, but at the end it can be obtrusive. A good candidate for OpenType.</p>
    html_clean: |-
