      <p>On further reflection, I think the difficulty with Quadraat I'm seeing in the LRB is caused by the justification settings: there is probably a "minimun wordspace" value of 85 or 90% which very occasionally results in tightset lines such as...</p>
      <p>Enoch Powell's rivers of blood speech, and</p>
      <p>...where the f gets a bit too close to the b. Obviously, due to the rare occurence of this kind of thing, it's not a big deal. Perhaps the only reason I notice it is because I'm aware of the "faux ligature" structure of the f, as it's something I did in Goodchild, another small x-height oldstyle. However, that too was designed for publication setting where there isn't even the luxury of a simple f_i or f_l ligature, so the structure of the f is crucial.</p>
      <p>Putting in an [f_space] positive kern to solve this rare circumstance would be a mistake, as it would damage the spacing in the majority of situations, where [f_space] is not followed by a tall glyph. </p>
      <p>As the topic of this thread is a font for a novel, there's nothing wrong with Quadraat there, as the difficulty is caused by magazine-column justification.</p>
      <p>The reason I mentioned Quadraat's tiny "flaw" is because it conerns an intriguing design problem.</p>
