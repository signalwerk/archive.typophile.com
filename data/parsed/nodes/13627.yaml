    <p>Hi there,</p>
    <p>We're designing a novel, a literairy thriller, to be exact, and I'm looking for a good typeface to be used as a reading text. Very often 'Times-look a like's' are used, but we are looking for something with a bit more personality. The novel will be around 250 pages, so the typeface has to be very legible and comfortable for the eye to read.</p>
    <p>It will be used in combination with my <strong>Nordic Narrow</strong> (<a href="http://www.characters.nl" title="www.characters.nl">www.characters.nl</a>). This willl be the typeface used for headlines and the cover of the book. So if it would fit to that, it would be more than great.</p>
    <p>Does anyone have a good suggestion?</p>
    <p>Regards,<br>
    ®ené</p>
    <p><strong>Also tired of Helvetica?</strong> Get an <strong><a href="http://www.characters.nl" rel="nofollow">Insider</a></strong> with more personality</p>
