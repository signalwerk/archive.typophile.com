      <p>&gt; it would damage the spacing</p>
      <p>Even if a designer (like you, strangely enough) ignores your previous good idea of "class kerning with a three-glyph action" to solve the problem in a sophisticated way, and decides to choose between the two low-tech solutions of an "f"-space kern or simply neutering the "f", it's obvious that the occasional slightly-too-wide space is less bad than damaging any bouma with an "f" in it (especially ones that end in an "f"). Unless of course you have a "belief imbalance" between boumas and even color; but in that case you're outside the realm of text fonts. The "f" is one of the few good things the Latin alphabet has going for it, and you want to castrate it.</p>
