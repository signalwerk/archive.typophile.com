      <p>&gt;The “f” is one of the few good things the Latin alphabet has going for it, and you want to castrate it.</p>
      <p>What on earth are you talking about?</p>
      <p>I'm talking about the problem of the generous ear in oldstyle faces, and the difficulty it causes when followed by tall glyphs. If one tries to solve it by making the ear of the f extra wide, wide enough to form faux ligatures, it can create an occasional problem, which seems to be most apparent when the face has a small x-height (like Quadraat) and when the justification setting includes a reduced wordspace value.</p>
      <p>Two solutions, by glyph shape, rather than kerning, are: (1) a face like Galliard, where the ear has more of a ball on it: this seems to deter unwanted horizontal movement. (2) Palatino, where the ear is drastically narrowed.</p>
      <p>I'm pondering a third solution, hypothetical, which would be to use contextual alternates of the f. This is not much different than having ligatures anyway, because if you look at the f ligatures of most fonts, you will see that the ear is much wider in the ligatures than in the single f. So in effect, fonts with ligatures already have two widths of f in them.</p>
      <p>&gt;it’s obvious that the occasional slightly-too-wide space is less bad.</p>
      <p>I would have thought the opposite was obvious. Perhaps you would care to demonstrate your assertion with a typeset example?</p>
