      <p>Arabic/Hebrew/Persian are poorly served by desktop publishing apps on OS X. InDesign won't get you anywhere, alas, unless you have the Middle Eastern edition, and I suspect Illustrator is the same. Not sure about Quark; maybe you need Quark Passport? do they still make that? I haven't used Quark in years, so I don't know.</p>
      <p>But: there is a very useful word processor called <a href="http://www.redlers.com/" rel="nofollow">Mellel</a> that lets you use right to left scripts. It's not free, but it's not tremendously expensive; if you're doing any amount of work in Arabic, it's a great investment. (There's a free version, but I forget what it does.) When mixing right-to-left scripts and left-to-right (I design a journal of poetry in facing page translation) I've used it to create PDFs which I then place in InDesign. Mellel gives you kashiida support, which is how text is justified in Arabic and Persian - the connecting ligatures between characters are extended as needed, as word-spacing and letter-spacing are extended in Roman justification.</p>
      <p>There's also decent support in most basic OS X applications, like TextEdit. If you haven't already, go to Preferences &gt; International, go to the Input Menu tab, and check Arabic or Arabic Qwerty, which will let you switch to them. Also check Keyboard Viewer &amp; Character Palette. This adds a little flag to the upper-right-hand corner of the screen; by selecting Arabic, you can type in Arabic. Show Keyboard Viewer is the old OS 9 Keycaps, but it shows the characters in the selected language, useful when learning to type. And Character Palette will let you get to everything else you need to that you can't from the keyboard directly.  </p>
      <p>If you're really hardcore, there's also XeTeX, which is an implementation of TeX that lets you typeset text in any direction, using any font in OS X. Powerful, but there's a learning curve.</p>
