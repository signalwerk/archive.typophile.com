    <p>Hello,</p>
    <p>I am taking Beginning Arabic and would like to set up some charts and flash cards for myself. I have the truetype fonts that came with Mac OS 10 (Al Bayan, etc.). What do I have to do to use them in Quark and/or Illustrator? Alas, I don't have InDesign.</p>
    <p>I've been a typesetter since 1974, but this is making me feel like a complete moron. Anyone willing to walk me through how to set up my computer to use Arabic characters? I'd appreciate it. </p>
    <p>Thanks,</p>
    <p>Kristin</p>
