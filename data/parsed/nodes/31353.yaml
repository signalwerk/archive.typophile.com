      <p>It is called Light Italic, made for the IBM Selectric I &amp; II.<br>
      <a href="http://www.selectric.org/selectric/" title="http://www.selectric.org/selectric/">http://www.selectric.org/selectric/</a></p>
      <p>It has been digitized: <a href="http://xyz.ch/H.html" title="http://xyz.ch/H.html">http://xyz.ch/H.html</a>  and is called "Lisa"  apparently... although I'm not sure it is for sale. </p>
      <p>Remington Typewriter Italic has some similar qualities<br>
      <a href="http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/italic/" title="http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/italic/">http://www.myfonts.com/fonts/lanston/ltc-remington-typewriter/italic/</a></p>
