    html: <p>Whatever typeface you use, I'd let it loose from the box. Give it some forced perspective and let it be as big and pimpin' as the car photo. <br> <br>A lot of the elements feel like they're floating around right now. To give things more weight and grounding, perhaps try making the the card sit flat (no matter how it's shaped) and keep the type and images grounded to those angles. That car needs to feel heavy and grounded, rather than floaty and light. <br> <br>(Does that make sense?)</p>
