    html: |-
      <p>Don't mean to hijack the thread, just generalize it a bit.</p>
      <p>Are you guys saying that "modern" (Unicode) versions of MS Word may get a character from whatever font it decides to, regardless of whether or not that character is in the font selected by the user for the document?</p>
      <p>So, for example, if you need a  d with underdot, and both the U+1E0D character (from the Latin Extended Additional set) and the combining diacritic U+0323 are in the font you're using, Word might decide to go and get the character (or string) from a different font?</p>
      <p>Extending that, are their any circumstances when Word might change the Unicode assignment of a character, deciding something should be a "symbol" even if the Unicode number for, say, a spacing modifier or combining diacritical has been keyed, or is in a file keyed by someone else?</p>
