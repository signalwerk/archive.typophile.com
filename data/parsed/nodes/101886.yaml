      <blockquote><p>
      Hello Michel, thanks, is there a way to isolate a particular font? [peterfwang]
      </p></blockquote>
      <p>That could be done on OS X 10.6; I don't think it can be done with the character viewer that comes with 10.8.</p>
      <blockquote><p>
      are their any circumstances when Word might change the Unicode assignment of a character [Charles]
      </p></blockquote>
      <p>I don't think so. So far as I know, Word will just use some fallback mechanism to display the missing characters instead of displaying some "missing glyph" symbol.</p>
      <p>What happens with the Word symbol inserter is that, at least in the case of the arrows, it is programmed to insert symbols from Pi fonts, not unicode symbols. Here is what happens if I write in Word the first line with Cambria, copy and paste it underneath, then select the second line and select Bauhaus 93</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/arrows_3585.png"></div><p></p>
      <p>For the first arrows on the second line, Times new roman was used as fallback font; for the last four, Dejavu sans bold was used. I don't know how those choices are made.</p>
