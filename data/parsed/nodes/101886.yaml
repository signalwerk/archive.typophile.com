    <p>Hi, Typophilers,</p>
    <p>I use mac and word 2011. Sometimes I place directional arrows into word documents to indicate direction or flow and was wondering. In the fonts I am using, I can see that they have encodings for the following:</p>
    <p>U+2190 arrowleft<br>
    U+2191 arrowup<br>
    U+2192 arrowright<br>
    U+2193 arrowdown<br>
    U+2196 arrowupleft<br>
    U+2197 arrowupright<br>
    U+2198 arrowdownright and<br>
    U+2199 arrowdownleft</p>
    <p>When I use the symbol inserter (see screen.png) a symbol is inserted, however, it is not from the font I am using, rather wingdings (see word doc.png) . Is there a way to get word to recognise the font, or shortcuts that can override the limitations? I have already tried double hyphen lessthan ( --&gt; ) to make a right arrow, however, this creates another type of arrow that is not editable (it does not appear to be part of any font).</p>
    <p>Thanks for the help.</p>
