    <p></p><div class="imageWrap"><img src="http://typophile.com/files/2492921768_ac31accd5c_4996.jpg"></div><p></p>
    <p>Downloadable webfonts are not just about replacing Verdana with a fancy freeware font.<br>
    Here is an example where a certain text phrase is automatically replaced with a scalable vector glyph from a downloadable font. The underlying text stays untouched, so indexing and copy&amp;paste work like a charm. </p>
    <p>See the full article here: <a href="http://opentype.info/blog/2008/05/14/exploring-webfont-possibilities/" title="http://opentype.info/blog/2008/05/14/exploring-webfont-possibilities/">http://opentype.info/blog/2008/05/14/exploring-webfont-possibilities/</a></p>
    <p>Edit: changed "graphic" to "glyph"</p>
