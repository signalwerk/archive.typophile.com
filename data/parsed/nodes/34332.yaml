    <p>I’m using Centaur as body text in a brochure. Client likes Centaur but hates the “1” glyph. (Says it looks too much like a capital “I”.) Could anyone suggest a typeface that’s similar enough to Centaur that I could just swap out the 1s...? Or if that sounds unlikely, any recommendations for something Centaur-like to switch to entirely? Thanks in advance.</p>
