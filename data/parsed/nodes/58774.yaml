      <p>I intend to write an article on the subject some day, but I’m still in the research process. Here’s another one: </p>
      <p><strong>Humanist sans serif</strong></p>
      <p><code>font-family: Lucida Sans, Lucida Sans Unicode, Lucida Grande, sans-serif;</code></p>
      <p><em>Lucida Sans</em> come bundled with MS Office 04 on a Mac, and the Regular weight is included in Win Vista and XP and Office 07 on a Windows PC. PS: Lucida Sans sport a beautiful calligraphic cursive.<br>
      <em>Lucida Sans Unicode</em> come bundled with MS Office 08 on a Mac, and Win Vista and XP on a Windows PC. Additionally MS Office 07 on a Windows PC also bundle it.<br>
      <em>Lucida Grande</em> come bundled with OSX on a Mac.</p>
