    html: |-
      <p>Hi. This board is fine. Fonts on the web is really only limited to a few alternatives, as every person visiting your website must have the font installed to be able to see it. That is, unless you use techniques like Sifr (which is only really useful for headlines). While we’re waiting for the technology, I’d like to recommend a few rarely used css font stacks (a list of alternatives, in case the first isn’t present).</p>
      <p><strong>Transitional serif:</strong></p>
      <p><code>font-family: Baskerville, Baskerville Old Face, MG Open	Canonica, Times New Roman, serif;</code></p>
      <p><em>Baskerville</em> come bundled with OSX on a Mac.<br>
      <em>Baskerville Old Face</em> come bundled with MS Office 07 and 03 on a Windows PC and MS Office 04 on a Mac.<br>
      <em>MG Open Canonica</em> is our Ubuntu fallback.</p>
      <p><strong>Modern serif:</strong></p>
      <p><code>font-family: Didot, Bodoni MT, Modern No. 20, serif;</code></p>
      <p><em>Didot</em> com bundled with OSX on a Mac.<br>
      <em>Bodoni</em> come bundled with MS Office 07 and 03 on a Windows PC.<br>
      The same goes for <em>Modern No. 20</em>, additionally MS Office 04 on a Mac. </p>
      <p>I’ll post some more another time. Cheers</p>
