    html: <p>Durer’s treatise and illustrations on this matter are titled <em>Of the Just Shaping of Letter</em> and were published as a Dover paperback that you can find used for under $10. Geoffrey Tory’s <em>Champ Fleury</em> did something similar by comparing the Roman majuscules to idealized human proportions, this one can be found in a variety of French, English, and polyglot editions. More recently Helm Wotzkow broke the proportions of letters down into a square in his book <em>The Art of Lettering</em> and Frank Blokand has developed Letter Modeler, a program that generates letters based on harmonic proportions. There isn’t really a name for these, probably because the systems have serious limitations.</p>
    html_clean: <p>Durer’s treatise and illustrations on this matter are titled <em>Of the Just Shaping of Letter</em> and were published as a Dover paperback that you can find used for under $10. Geoffrey Tory’s <em>Champ Fleury</em> did something similar by comparing the Roman majuscules to idealized human proportions, this one can be found in a variety of French, English, and polyglot editions. More recently Helm Wotzkow broke the proportions of letters down into a square in his book <em>The Art of Lettering</em> and Frank Blokand has developed Letter Modeler, a program that generates letters based on harmonic proportions. There isn’t really a name for these, probably because the systems have serious limitations.</p>
