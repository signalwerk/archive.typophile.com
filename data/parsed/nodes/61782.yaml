  html: <p>I am a non-designer with limited knowledge of typography, but I figured one of you experts could help with this probably rather simple quest. I am looking for specific imagery that I know I have seen in typography or type design context, but I’m not sure what it’s called. It’s essentially a diagram of how individual letters of a typeface are drawn/created. The character is shown on some sort of grid with the radii of curves drawn as full circles, angles shown, tangents drawn, etc. What is this called? I have done google image searches for type design/diagram/grid, etc. to no avail. Thanks.</p>
