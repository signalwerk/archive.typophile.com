      <p><a class="freelinking-external" href="http://typophile.com/user/14722">James Puckett</a> wrote: <cite>Durer’s treatise and illustrations on this matter are titled <strong>Of the Just Shaping of Letter</strong> and were published as a Dover paperback</cite></p>
      <p>The original text in question is Albrecht Dürer’s <em>Unterweisung der Messung</em>. <a class="freelinking-external" href="http://www.archive.org/details/albrechtdrersun00peltgoog">A scan of the treatise</a> is available from the Internet Archive (<a class="freelinking-external" href="http://ia351443.us.archive.org/3/items/albrechtdrersun00peltgoog/albrechtdrersun00peltgoog.pdf">PDF here</a>). (The text is in German, and printed in Blackletter, but the diagrams should be clear enough. The discussion of lettering begins on page 104 (109 in the PDF.))</p>
      <p>The original English translation (ostensibly from 1917) should be out of copyright, but I can’t find a viewable copy on the Internet.</p>
