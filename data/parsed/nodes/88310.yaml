  - id: 490626
    user: 36432
    date: 2012-01-08T08:09:00
    date_raw: 8 Jan 2012 — 8:09am
    votes: null
    html: |-
      <p>Love it as a screen font, but I ask myself how is this going to print?<br>
      Consistency will be hard to keep for each user's experience of this font.<br>
      Your zoomed in view of the <strong>ã</strong> and <strong>é</strong> has a greater and shorter gradient run to white in the <strong>é</strong> than the <strong>ã</strong>.<br>
      The <strong>é</strong> will print with the intended effect because of the stronger white, the <strong>ã</strong> won't.<br>
      This might make some letters look patchy or not as strong with the faded effect.<br>
      Some letters might print the gradient blend. Some will look posterized or sudden in the change from black to white.</p>
      <p>It's too hard an effect to maintain in print. I'd stay a million miles away from trying something like that, but hey, on screen it looks fine.</p>
      <p>Good Luck</p>
