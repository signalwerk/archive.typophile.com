    <p>Hi all - Little update on what i've been working on...</p>
    <p>Filthy Black Italic is a display typeface intended to be viewed at large sizes. Because of it’s heavy weight and distinctive small serifs the typeface is best used on headings and titles. Inspired by latex textures, many characters use rounded shapes to show off the fluid forms of the letters. Please do let me know your thoughts. Please see our site for more examples of work: <a href="http://www.filthymedia.com" title="http://www.filthymedia.com">http://www.filthymedia.com</a> . Thanks. </p>
