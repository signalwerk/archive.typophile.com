    html: |-
      <p>Here's what I would call those features:</p>
      <p>#1: Flattened teardrop; the footserif: soft, or rounded.<br>
      #2: Cusp (the whole thing: flattened foxtail).<br>
      #3: Modest foxtail.<br>
      #4: Foxtail.<br>
      #5: Shear (the whole thing: sheared teardrop).<br>
      Dolly: modest foxtail.<br>
      Laurentian: foxtail.<br>
      Esprit: exaggerated foxtail.</p>
      <p>As you can see I rely on "foxtail" a lot, even though I only<br>
      heard it recently: <a href="http://typophile.com/node/46990" title="http://typophile.com/node/46990">http://typophile.com/node/46990</a><br>
      I thing it basically means "cuspy teardrop", which has<br>
      become the terminal du jour.</p>
      <p>hhp</p>
