    <p>Hey folks,</p>
    <p>Just did a quick survey of the websites of the current presidential contenders. Is it just me, or is anyone else diggin’ Obama’s website, typography, and overall design aesthetics?! Granted, they may be going a bit overboard with all of the 2.0-ish reflections and what not. But if you compare these websites... I don’t know, it’s a dramatic difference. Some serious subtlety over at barackobama.com. All politics aside of course. </p>
