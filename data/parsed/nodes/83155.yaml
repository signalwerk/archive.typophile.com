      <p>I have read more than one book with pictures of typewriter keyboard layouts in different lands. I do not recall ever seeing a symbol that was a stylized "Y" on a Spanish-language typewriter layout, either for Latin America or for Spain, used as a symbol for "and".</p>
      <p>Indeed, as noted in this thread, in Spanish, "y" is a word, just as "a" and "I" are words in English. Words that happen to be one letter long. In English, that wouldn't be a circumstance under which Y could function as a vowel, but Spanish orthography is different.</p>
      <p>And, as noted, this fact does make a typographical symbol which hybridizes the Spanish word for "and" with the ampersand, a stylized "et", a typographical symbol for "and", seem like a bizarre idea, rather than the natural idea it <em>would</em> be if, in fact, a Spanish-speaking area did have a distinctive typographical symbol for "and".</p>
