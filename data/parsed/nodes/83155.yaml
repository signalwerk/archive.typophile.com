    html: "<p>FWIW, ampersand is never used in Mexico, unless you are writing the name of a US company or something like that. When people see it, the chances are that it is read “and”, not “y”, because of the English influence. And they don’t even know how to call it: they just say “that commercial sign, you know, the one that you use to say ‘and’”.</p>"
