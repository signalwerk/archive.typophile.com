    <p>I am just generally curious about the use of the ampersand in the Spanish speaking world.</p>
    <p>I did see an old thread from '02 stating that both the ampersand and the "y" are used, for differing reasons having to do with taste and preference.</p>
    <p>But what I am really wondering is whether there exists some hybrid of the y/et y/&amp; that could speak bilingually. A Spanish/English ampersand.</p>
    <p>I have never seen it, though I don't read in Spanish. Chances are it does, but if it does not exist, please, someone with more talent than myself--I'd love to see it. It would be a good exercise in the spirit of collaboration between cultures.</p>
    <p>Evan</p>
