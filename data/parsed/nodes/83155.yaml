    html: "<p>Spanish used \"et\" but stopped using it around the same time it stopped using \"ca\" (modern \"porque\"), which, granted, was long before it stopped using ß.  Honestly part of the reason that a lot of ampersands to me stand out in Spanish is that you pretty much never see \"y\" capitalized and (almost always) the ampersand is at capital height.  Sticking out isn't necessary I think the right thing to do when it's a weak vowel that often is absorbed into the preceding or following letter.  Plus, it means the symbol gets multiple pronunciations depending on what comes after it: Fernando &amp; Isabel (Fernando e Isabel) vs. David &amp; Carla (David y Carla).</p>"
    html_clean: "<p>Spanish used \"et\" but stopped using it around the same time it stopped using \"ca\" (modern \"porque\"), which, granted, was long before it stopped using ß.  Honestly part of the reason that a lot of ampersands to me stand out in Spanish is that you pretty much never see \"y\" capitalized and (almost always) the ampersand is at capital height.  Sticking out isn't necessary I think the right thing to do when it's a weak vowel that often is absorbed into the preceding or following letter.  Plus, it means the symbol gets multiple pronunciations depending on what comes after it: Fernando &amp; Isabel (Fernando e Isabel) vs. David &amp; Carla (David y Carla).</p>"
