    <p><strong><a href="/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a>&nbsp;: Deutsche&nbsp;Schrift</strong></p>
    <p>Probably the largest family of <a href="/node/12128" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Blackletter</a> types ever cast, the Deutsche Schrift was the first of <a href="/node/12125" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Rudolf Koch</a>’s designs for the <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> foundry. More weights would be added by Koch, the <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a>s, and by <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> until the second World&nbsp;War.</p>
    <p>Family members include:<br>
    Deutsche Schrift (1908)?<br>
    Deutsche&nbsp;Schrägschrift</p>
    <p>Deutsche Anzeigenschrift (Anzeigenschrift means Headline Face)<br>
    - breiter Schnitt (extended)<br>
    - schmaler Schnitt (condensed)<br>
    - schmaler, halbfetter Schnitt (condensed, semi bold) this was the default design<br>
    - enger Schnitt (ultra&nbsp;condensed)</p>
    <p>Deutsche Zierschrift (a outlined and engraved&nbsp;version)</p>
    <p>Deutsche Werkschrift (Werkschrift means Bookface)<br>
    - mager (regular)<br>
    - halbfett (semi&nbsp;bold)</p>
    <p>Koch wasn’t very much in love with this typeface, but due to its great commercial success <a href="/node/12158" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">D. Stempel <span class="caps">AG</span></a> and <a href="/node/12147" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Klingspor</a> forced extensions to the family. (1910 to at least 1921; some of the Anzeigenschriften were cut during the&nbsp;1930s).</p>
    <p><a href="/node/add/wiki?edit%5Btitle%5D=Maximillian" title="Create node &quot;Maximillian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Maximillian</a> is a similar design to the Deutsche Schrift. Presumably, Koch have better feelings about <a href="/node/add/wiki?edit%5Btitle%5D=Maximillian" title="Create node &quot;Maximillian&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Maximillian</a>…</p>
