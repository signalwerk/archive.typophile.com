    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> : Deutsche Schrift</strong></p>
    <p>Probably the largest family of <a href="/wiki/Blackletter" class="freelinking" rel="nofollow">Blackletter</a> types ever cast, the Deutsche Schrift was the first of <a href="/wiki/Rudolf%20Koch" class="freelinking" rel="nofollow">Rudolf Koch</a>'s designs for the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> foundry. More weights would be added by Koch, the <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a>s, and by <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> until the second World War.</p>
    <p>Family members include:<br>
    Deutsche Schrift (1908)?<br>
    Deutsche Schrägschrift</p>
    <p>Deutsche Anzeigenschrift (Anzeigenschrift means Headline Face)<br>
    - breiter Schnitt (extended)<br>
    - schmaler Schnitt (condensed)<br>
    - schmaler, halbfetter Schnitt (condensed, semi bold) this was the default design<br>
    - enger Schnitt (ultra condensed)</p>
    <p>Deutsche Zierschrift (a outlined and engraved version)</p>
    <p>Deutsche Werkschrift (Werkschrift means Bookface)<br>
    - mager (regular)<br>
    - halbfett (semi bold)</p>
    <p>Koch wasn't very much in love with this typeface, but due to its great commercial success <a href="/wiki/D.%20Stempel%20AG" class="freelinking" rel="nofollow">D. Stempel AG</a> and <a href="/wiki/Klingspor" class="freelinking" rel="nofollow">Klingspor</a> forced extensions to the family. (1910 to at least 1921; some of the Anzeigenschriften were cut during the 1930s).</p>
    <p><a href="/wiki/Maximillian" class="freelinking" rel="nofollow">Maximillian</a> is a similar design to the Deutsche Schrift. Presumably, Koch have better feelings about <a href="/wiki/Maximillian" class="freelinking" rel="nofollow">Maximillian</a>…</p>
