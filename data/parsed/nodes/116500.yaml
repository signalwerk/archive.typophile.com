    <p>Anyone know what this font is - or can you direct me to a similar one?  </p>
    <p>It's on an old 60/70s shop front in London.  Obviously handpainted (on a painted glass panel, bizarrely).</p>
    <p>Would be grateful if anyone knows of a (free) similar font if we can't identify the actual font. </p>
    <p>Thanks</p>
    <p>Ned</p>
