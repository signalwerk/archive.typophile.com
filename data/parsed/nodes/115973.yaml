      <p><cite>In a book for people today, it doesn't need to look like books bought by their grandparents.</cite></p>
      <p>Yes, that's true. But if you're going to use an asterism, you should find out what an asterism <strong>means</strong>. What sort of break is it, <em>why</em> did people still indent after it, and so on.</p>
      <p>Using a few asterisks in a row, as is done in current books, tends to indicate the passage of time, but it doesn't indicate a break between subdivisions of a chapter. So indenting after that might mislead the reader into thinking a hierarchical structure is present - which explains the older practice, even though it is correct that not indenting would seem to be superior in appearance.</p>
      <p>Using an asterism instead implies one is consciously attempting to be "retro" in the design of the book. If you're doing that, don't you want to be consistent?</p>
      <p>Maybe indenting after the asterism does look bad, and though should be avoided, but it now seems to me that there is a strong case for doing so, and therefore careful thought is needed.</p>
    html_clean: |-
