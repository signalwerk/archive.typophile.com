      <p>It would depend to some extent on how you treat any other text-breaking elements. Does the document have subheads? chapter titles? How does the text start after them? There is nothing special about an asterism, it simply one more way to signify a break in the text. In fact, with or without any particular  typographic devise, we always term such "spacebreaks."</p>
      <p>You need to give some thought to what to do when one falls at the foot or head of a page, BTW. That's where too much extra space above and below can create a headache, if you're balancing spreads. And whether or not to start the new paragraph not only without indent, but a few words in, say, small caps. You don't need a club, just to avoid confusion. Work spacebreaks out for the worst case, everything else will fall into place as an acceptable compromise.</p>
