      <p><strong>quadibloc:</strong> It seems I picked that one instance of asterism use which separates to blocks that actually <em>are</em> some time of story-telling apart :)</p>
      <p>Looking at the meaning of an <a class="freelinking external" href="http://en.wikipedia.org/wiki/Asterism_(typography)" rel="nofollow">asterism</a> then "It is used to 'indicate minor breaks in text,' call attention to a passage, or to separate sub-chapters in a book." Which is exactly what I wanted to use it for here: a separation. Using just an extra empty line (or two) has never really vibrated with me, it feels too loose to me. The asterism is a nice glyph to visually tie together the two passages.</p>
      <p>Also, I grew up reading a lot of my grandparents' books from the 19th century :)</p>
