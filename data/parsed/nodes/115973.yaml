      <p>Now this is a bit interesting. Jan Tschichold, in his essay <em>“The Importance of Tradition”</em> says, “Therefore, at a minimum the first line of the new division should begin flush left and the first word be set with capital and small caps. Better still to insert a centered asterisk.”</p>
      <p>Agreed so far. However, and that's where this becomes relevant for this thread, in its German original the last sentence reads “Noch besser ist die Einfügung etwa eines Sternes in der Mitte über diesem Anfang.” The English translation is somewhat incomplete, and should read “Better still is the insertion of an asterisk centered above this beginning.”</p>
      <p>So, if I interpret this correctly then Jan Tschichold proposes to set the asterism (or asterisk, the “Stern”) <em>above</em> the new division which would mean to set it at the top of the new page. Uhm? :)</p>
