    <p>I am setting a book which uses an <a class="freelinking external" href="http://en.wikipedia.org/wiki/Asterism_(typography)" rel="nofollow">Asterism</a> "⁂" to separate sections within a chapter.</p>
    <p>Do I indent the first paragraph after an Asterism (like the specimen in the above link), or not because I might look at that paragraph somewhat equivalent to the beginning of a chapter? What is the common opinion on this?</p>
