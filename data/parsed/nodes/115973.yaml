    html: |-
      <p>What a designer -- interior designer -- usually does is to set up a form, not a mechanical repetition. What do I mean? Well, suppose you indent the chapter title 4 picas left. You could then indent the first text line four picas left, without implying all paragraph indents are 4 picas. You have sorta kinda suggested that paragraphs following a textual break indent, but not "suggested strongly," as chapter openers also suggest "this is display," even to the first text paragraph.</p>
      <p>All kinds of variations: For example: you could indent the chapter <cite>title</cite> 4-5 picas left, with the chapter <cite>number</cite> flush left, and pick up on any consistent edge for the first paragraph. Or if chapters have an epigraph, dedication, whatever below the title &amp; before the first text line, remember vertical alignment. Or a subhead. None of this has any particular implication for subsequent paragraphs, esp. if the treatment is obviously different. If it is similar though, then you've set up a weak promise.</p>
      <p>What you're really doing with a choice is suggesting how you'll lead the reader in awkward situations. What if a spacebreak is just that (no ornamentation)? And what if it falls at the foot of a page or the head of a page? Essentially, without an ornament, you kill the blank line(s) How do you let the reader even know that a new paragraph has started?</p>
      <p>What if a subhead starts a page, and all pages have running heads? Can they be told apart, without thought by the reader, as they stack at the top of a page? </p>
      <p>There are all kinds of ways to handle these situations, but using a common approach throughout a text -- regardless of exact numbers -- helps a reader, without them knowing it.</p>
      <p>Other questions: What's the stronger signal for signalling a hierarchy? Beats me. For a very short time, I used to specify A-level subheads &amp; the following text flush left, with B-level heads &amp; following paragraph indented. Then I took a look and saw just how strong the white space from that double indent actually was, visually. </p>
      <p>Or... is italic stronger than roman? Ask 20 designers and you'll get about an even divide as to which is stronger.</p>
      <p>In the end, the good designers spend more time helping a reader through a text than with obsessing over what they, as designers, like. Since your text in this example is pretty straightforward, you have a certain luxury. The mistake would be to think whatever answer you choose here will apply to all texts, without further thought.</p>
