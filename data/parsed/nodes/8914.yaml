  html: <p>I've got an opentype font that I have been trying to get to print, but it will not cooperate and print the correct glyphs.  <br> <br>I have the font set up to have alternates for each letter and they are named a.Alt, b.Alt, etc. I'm using these alts as Stylistic Alternates. They show up correctly in illustrator and indesign but when I print the font out, it prints the original glyph (with the alternate's letterspacing) and not the alternate. My printer is a Brother HL-5140 laser. <br> <br>Any ideas?</p>
