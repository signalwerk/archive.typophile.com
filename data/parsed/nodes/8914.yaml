    html: <p>Although that may provide a useful workaround, it is not a requirement of OpenType that all glyphs be encoded. However, as Adobe has the (possibly bad) habit of encoding all glyphs, which is enforced by our tools, it may be that insufficient testing has been done of fonts that work differently. <br> <br>Do you still have a copy of the misbehaving version of the font, and if so would you be willing to share it with us for testing purposes? I want to be sure that our apps or core tech components within them are not making some bad assumptions.... <br> <br>Regards, <br> <br>T</p>
