    html: <p>My guess is that the font is OK but the printer driver for your Brother brother is not very well programmed (by the Brother brother brothers.)  <br> <br>I wonder -- do you have PUA Unicode indexes assigned to your altnerate glyphs? If not, does the problem persists if you assign PUA indexes to the alternate glyphs?  <br> <br>Adam</p>
