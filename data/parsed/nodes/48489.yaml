    <p>hi,<br>
    im looking for ideas for a social networking site.</p>
    <p>i have made a rough mock-up of a web page and would like to know any things that you think could look better or i should include.</p>
    <p>iv tried to use lots of greys and have kept the whole design including the logo simple, i wanted to do this because from research i have done with other social networking sites i have seen that they are very simple and get straight to the point.</p>
    <p>i would like to also know your thoughts on the type.</p>
