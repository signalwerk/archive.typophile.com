  html: <p>RoboFog is a version of <a href="/node/12024" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Fontographer</a> 3.5 that embeds a <a href="/node/13582" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Python</a> interpreter. RoboFog was developed by <a href="/node/add/wiki?edit%5Btitle%5D=Just%20Van%20Rossum" title="Create node &quot;Just Van Rossum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Just Van Rossum</a>, <a href="/node/49953" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Petr van Blokland</a> and <a href="/node/65521" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Erik van Blokland</a>. It has been discontinued, but much of the work and ideas live on in <a href="/node/13583" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">RoboFab</a>.</p>
  html_clean: <p>RoboFog is a version of <a href="/node/12024/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Fontographer</a> 3.5 that embeds a <a href="/node/13582/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Python</a> interpreter. RoboFog was developed by <a href="/node/add/wiki?edit%5Btitle%5D=Just%20Van%20Rossum" title="Create node &quot;Just Van Rossum&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal link-lost">Just Van Rossum</a>, <a href="/node/49953/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Petr van Blokland</a> and <a href="/node/65521/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">Erik van Blokland</a>. It has been discontinued, but much of the work and ideas live on in <a href="/node/13583/" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal link-kept">RoboFab</a>.</p>
