  html: <p>RoboFog is a version of <a href="/wiki/Fontographer" class="freelinking" rel="nofollow">Fontographer</a> 3.5 that embeds a <a href="/wiki/Python" class="freelinking" rel="nofollow">Python</a> interpreter. RoboFog was developed by <a href="/wiki/Just%20Van%20Rossum" class="freelinking" rel="nofollow">Just Van Rossum</a>, <a href="/wiki/Petr%20Van%20Blokland" class="freelinking" rel="nofollow">Petr Van Blokland</a> and <a href="/wiki/Erik%20Van%20Blokland" class="freelinking" rel="nofollow">Erik Van Blokland</a>. It has been discontinued, but much of the work and ideas live on in <a href="/wiki/RoboFab" class="freelinking" rel="nofollow">RoboFab</a>.</p>
  html_clean: <p>RoboFog is a version of <a href="/wiki/Fontographer" class="freelinking link-lost" rel="nofollow">Fontographer</a> 3.5 that embeds a <a href="/wiki/Python" class="freelinking link-lost" rel="nofollow">Python</a> interpreter. RoboFog was developed by <a href="/wiki/Just%20Van%20Rossum" class="freelinking link-lost" rel="nofollow">Just Van Rossum</a>, <a href="/wiki/Petr%20Van%20Blokland" class="freelinking link-lost" rel="nofollow">Petr Van Blokland</a> and <a href="/wiki/Erik%20Van%20Blokland" class="freelinking link-lost" rel="nofollow">Erik Van Blokland</a>. It has been discontinued, but much of the work and ideas live on in <a href="/wiki/RoboFab" class="freelinking link-lost" rel="nofollow">RoboFab</a>.</p>
