  html: |-
    <p>These are my three latest fonts, I didn't want to make three seperate posts so put them all here.  Let me know what you think.</p>
    <p>A short description for each..</p>
    <p><a class="freelinking external" href="http://i6.photobucket.com/albums/y239/Jumpsuit/SegMeg.jpg" rel="nofollow">Seg Meg:</a></p>
    <p>I really need a closer view to best view the detail on this.  Anyway, this was a font that came to me from my sketch book.  I like the way the two forms play off each other. I am anxious to use this somehow, but its going to be hard to find a good fit for it because it has such a different look to it.</p>
    <p><a class="freelinking external" href="http://i6.photobucket.com/albums/y239/Jumpsuit/Retron.jpg" rel="nofollow">Retron:</a></p>
    <p> A short and squatty font.</p>
    <p><a class="freelinking external" href="http://i6.photobucket.com/albums/y239/Jumpsuit/aeon.jpg" rel="nofollow">Aeon:</a></p>
    <p>I am happy how this came out.  It has a strange style going for it.  I know its not perfect, however I kind of like it like that.  However, if you have any ideas I'd be happy to hear them. </p>
    <p>There you go.  Any comments or suggestion welcome</p>
    <p>Thanks, </p>
    <p>Adam</p>
