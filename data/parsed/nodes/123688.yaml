      <div class="comment-spam-body"><p>My comments on customization apply also to Akzidenz Grotesk. Ulrich Stiehl detected that Linotype's Basic Commercial is electronically identical to Adobe's Akzidenz Grotesk except for the copyright/trademark notices and the name. Luc Devroye reports on the issue and includes Linotype's explanation in response to the comment <a href="http://luc.devroye.org/fonts-44410.html" title="http://luc.devroye.org/fonts-44410.html">http://luc.devroye.org/fonts-44410.html</a><br>
      Don</p>
