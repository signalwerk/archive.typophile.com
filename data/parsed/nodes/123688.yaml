      <div class="comment-spam-body"><p>EDITED:<br>
      A digital font called Basic Commercial is published by Linotype <a href="https://www.myfonts.com/fonts/linotype/basic-commercial-lt/" title="https://www.myfonts.com/fonts/linotype/basic-commercial-lt/">https://www.myfonts.com/fonts/linotype/basic-commercial-lt/</a><br>
      For the game of spot the customization of Basic Commercial Black , we can start with the round dot on _i_and _j_, the round dot on the top half of the semicolon, and the compound curve on the center stroke of _a_ which resembles the shape of the curve on the bold weight.<br>
      What else?<br>
      Don</p>
      </div>
