    <p>I am looking for an very modern sans serif with sharp edges.  Not the an expert by any means with typeface jargon, but I'll try to explain.  </p>
    <p>I am currently using Gotham from Hoefler &amp; Frere-Jones, however the squared tops and bottoms on some of the letters does not flow well with the mark I designed.  Along with a sample of Gotham (top image), I uploaded two that have more of these sharp points on the edges of all the letters.  Notice specifically on the M, N, A, etc. that the points come to a much sharper edge.  It also needs to look good in a heavier weight.  </p>
    <p>Can you identify these or recommend any that are similar?</p>
    <p>Many thanks in advance!<br><img src="/sites/default/files/old-images/Gotham_5047.gif"><br><img src="/sites/default/files/old-images/8_halvors1_5306.png"><br><img src="/sites/default/files/old-images/prognozy_6027.jpg"></p>
