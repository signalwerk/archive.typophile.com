      <p>I'm going to make a crazy guess: is the client a woman?</p>
      <p>Clearface Gothic seems a little out of date for a creative firm. I suppose it depends on what sort of interior design they want to be known for. Officina is not too bad, more modern, but overused. I'd consider one of these, gentle and friendly like Clearface and Officina, but less common and more up-to-date:</p>
