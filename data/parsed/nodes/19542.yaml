      <p>I agree with Stefan -- you'd be better served using a lesser known typeface for the logo if you want the logo to stand out.</p>
      <p>For some gorgeous sans serif faces check the <a href="http://www.psyops.com/html/specimens.html" rel="nofollow">Psy/Ops</a> catalogue. Alternatives for ITC Officina Sans could be Reykjavik which comes in a masculine (<a href="http://www.psyops.com/html/spec_reykjavik1.html" rel="nofollow">Herra</a>) and a feminine (<a href="http://www.psyops.com/html/spec_reykjavik2.html" rel="nofollow">Ungfru</a>) flavour, <a href="http://www.psyops.com/html/spec_default.html" rel="nofollow">Default Gothic</a> which has a little more contrast and some very nice character shapes, and the very elegant and subtly feminine <a href="http://www.psyops.com/html/spec_eidetm.html" rel="nofollow">Eidetic Modern</a>,</p>
