  html: |-
    <p>I'm creating the logo for a small interior design firm. The owner preferred initial mockups in Clearface Gothic and Officina Sans over more elegant (Bodoni, Didot, Optima, Centaur, Caslon Openface etc.) and contemporary (Gill Sans, Futura, Avenir, Helvetica, Mostra) ones. </p>
    <p>Here are my questions:</p>
    <p>1. Do you think a font like Clearface or Officina suits such a business's identity?</p>
    <p>2. What are some similar fonts I can consider? </p>
    <p>Any help would be greatly appreciated.</p>
