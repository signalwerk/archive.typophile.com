      <p>The disatvantage of using a well know typeface in a logotype, could be that the unique feeling get lost a bit. Even if the letters themselves are edited, the typeface itself is soemtimes so familiar that the overall result is too "common" or "flat".</p>
      <p>My advise would be to find slightly less familiar typefaces to start with for the logotype.</p>
      <p>You might something apealing at <a href="http://www.macrhino.com" title="http://www.macrhino.com">http://www.macrhino.com</a></p>
      <p>Good luck</p>
