    html: |-
      <p>mncz, the accent you refer to is the “caron”, and the Scaron and Zcaron (upper- and lowercase) are standard in the ISO 8859-1 character set, although many Western European and American designers didn’t design these glyphs - and the Lslash, Thorn, and Eth - because they were inaccessible with English-langauge keyboards.</p>
      <p>All of which to say: it could be that Mr Štorm has indeed included these basic characters in his fonts, but there was an oversight - aka “mistake” - when generating the glyph tables for the Štormtype site.</p>
      <p>And I second Fav’s suggestion that you contact Mr Štorm directly.  From the site:</p>
