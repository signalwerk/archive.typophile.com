  html: |-
    <p>I am considering Storm Open Library for purchase and was looking through their character sets, as no font is of any use to me unless it has characters with Baltic diacriticals. It surprised me to see that the sample of Jannon character set @ <a href="http://www.pismolijna.cz/pdf/JBWset.pdf">http://www.pismolijna.cz/pdf/JBWset.pdf</a> (page 17) included characters with almost any diacriticals, except Z with the “upside down roof” (sorry, I have no idea for the correct term in English, but it looks like \/ over the character), which is quite common even in simple font sets. Is it a mistake or it really isn’t there (I really need that char, so it would blow away all my true drooling over the CD :D) ?<br>
     Edit: other character sets presented there don’t have the aforementioned char as well.</p>
  html_clean: |-
