      <p>Please disregard the above comment -- it was misdirected. Apparently you can't edit a post after a certain amount of time has elapsed.</p>
      <p>You can place your small caps in any glyph cell you choose -- just then make sure to rename it appropriately and remove any spurious unicode index. Alternately, you can select an entire range of glyphs, copy them, append them, and then in the contextual menu choose more-&gt;add suffix to name to automatically create cells named a.smcp, b.smcp, etc.</p>
      <p>André</p>
