    html: |-
      <p>This is great. Way to exploit the potential of an ideographic script. Is this a text or a picture? :-)</p>
      <p>(For the uninitiated:<br>
      森  <em>mori</em> = forest<br>
      林  <em>hayashi</em> = also forest, I think a smaller forest?<br>
      where 木 <em>ki</em> = tree)</p>
