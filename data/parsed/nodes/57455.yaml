  date_raw: 28 Apr 2009 — 3:59pm
  votes: null
  html: |-
    <p>Hello, this is the second typeface I've designed so far (I'm a graphic design student). I set out to create a contemporary grotesk. Initially I added much more characteristics, like angled strokes (as in the lowercase e), etc. I've kept the extreme x-height. But now I've stripped it down, added more contrast and so on. It is not based on any specific typeface, except on personal preferences.</p>
    <p>I would like some overall feedback, and especially on:</p>
    <ul>
    <li>Is it original? If you don't think so, please point me to similar types...</li>
    <li>Legibility</li>
    <li>Contrast &amp; harmony</li>
    <li>Numerals &amp; punctuation</li>
    <li>Style</li>
    <li>I find a, e, s, g the most difficult, what do you think about those?</li>
    </ul>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Kyniker-Bold_4532.jpg"></div><p></p>
    <p>Thanks!</p>
    <p>/Marius</p>
