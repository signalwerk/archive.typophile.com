    html: <p>I like it. And I think it has charakter enough that it doesn’t need the “added” charakteristics. The angled strokes are rather distracting for my taste, especially on the ‘G’. I don’t like the ‘K’ and the ‘T’ is too narrow. The horizontal stroke on the ‘t’ looks like it needs to lean more to the right.</p>
