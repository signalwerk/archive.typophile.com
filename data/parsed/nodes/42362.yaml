    <p>hello there. </p>
    <p>i’m going to ask for advice about VTT. i can pretty much use it (according to me) but i have a basic problem about hinting a script font: getting the letters to run together perfectly.</p>
    <p>there’s a picture <strong><a class="freelinking-external" href="https://web.archive.org/web/20080704194516/http://www.jellyhedge.com/hint.html">HERE</a></strong> (sorry but there’s a problem inserting it...) Could you see the tiny steps where the tail on the preceding letter doesn’t quite align with the next letter sometimes? and how it wasn’t the same error each time...</p>
    <p>the 2 rows of iiiilllllll are - i think - rasterized by the MS and the Apple rasterizers. (i’m not sure what that means...) the 2nd line is ok, the top one isn’t... </p>
    <p>the tail - whatever it’s called - is the same width as the left stem. i think script fonts usually make it a bit thinner, so it nestles well inside, or tapers away inside. is that the problem/solution...? </p>
    <p>i’m trying to link the right phantom point to the left side of the tail... but this doesn’t seem to mean the right bearing itself (the blue line) is linked... at least as far as the next letter is concerned, and in that one rasterizer....  </p>
    <p>obviously i have a very inadequate grasp of digital type... can anyone enlighten me a little?</p>
