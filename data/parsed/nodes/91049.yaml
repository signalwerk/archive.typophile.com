    <p>What are useful available resources for learning how to script within the type-design process? I'm well aware that I'm missing out on automation opportunities as I go through a font glyph by glyph expanding each stem by three units in each direction. :-( I'm comfortable in the abstract with the idea of programming, but I have never done any work in Python.<br>
    Is there a beginners' guide somewhere? Or simple example scripts?</p>
