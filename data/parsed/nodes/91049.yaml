      <p>If this is your first foray into Python on FontLab, don't try to install and learn RoboFab immediately. If you don't have experience, installing it (particularly on a WinBox) can be problematic and will just deter you from proceeding further. Just try a few lines directly in the FontLab Macro Panel and start to understand the syntax and FontLab classes.<br>
      Start with something simple like<br>
      f = fl.font<br>
      for g in f.glyphs:<br>
       print g.unicode<br>
      and experiment with things on <a href="http://www.e-font.de/flpydoc/" title="http://www.e-font.de/flpydoc/">http://www.e-font.de/flpydoc/</a><br>
      Learning Python (O'Reilly), by Mark Lutz &amp; David Ascher is an excellent resource for learning the basics of Python.<br>
      Once you discover the limitations of FontLabs own classes, you may then want to dive into RoboFab if you feel the need.</p>
