    html: |-
      <p>Python's capabilities go far beyond what you need to make use of it in font production. Several books I've bought on the subject seem to assume I'm going to use it to program web apps or scientific apps or shell scripts or something. They oftentimes spend a big portion of the book going over platform-specific IDE issues and working with different add-on packages and tools. This is overkill for font development use. Most font editors let you run Python in them directly, so you probably don't need to set anything up (except for maybe Robofab and FontTools) in order to start working with it. </p>
      <p>I would recommend either of these books:</p>
      <p>Learning Python (O'Reilly), by Mark Lutz &amp; David Ascher<br>
      Python for Software Design: How to Think Like a Computer Scientist, by Allen B. Downey</p>
      <p>The second one doesn't assume you know any other programming languages.</p>
      <p>There is also a decent tutorial at python.org: <a href="http://docs.python.org/tutorial/" title="http://docs.python.org/tutorial/">http://docs.python.org/tutorial/</a> </p>
      <p>There is also DrawBot, which is used to teach Python at the TypeMedia department of the Royal Academy in The Hague: <a href="http://drawbot.com/index.html" title="http://drawbot.com/index.html">http://drawbot.com/index.html</a></p>
