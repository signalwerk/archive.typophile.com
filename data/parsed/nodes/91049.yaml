      <p>This is a good place to start:</p>
      <p><a href="http://robofab.org/talks09/index.html" title="http://robofab.org/talks09/index.html">http://robofab.org/talks09/index.html</a></p>
      <p>Most of not all of the examples can be run in the macro window in FontLab. You just type or paste-in the script, and hit the "&gt;" button. The results appear in a separate output window. </p>
      <p>FWIW, there are better apps for trying out Python stuff. I like TextMate. Terminal works, too. Just type "python" at the prompt, and away you go. OTOH, it makes more sense to be in FontLab, Glyphs, or RoboFont to do stuff with fonts (at least when starting out).</p>
