      <p>This from Linotype's promotional copy:</p>
      <p>". . . the face could have been lost, were it not for Robin Nicholas, Monotype Imaging's Head of Typography in the United Kingdom, and Carl Crossgrove, a senior designer for Monotype Imaging in the US. </p>
      <p>Nicholas and Crossgrove used the original drawings for Fairbank as the starting point for a new digital design, but this was only the beginning. They improved spacing, added subtle kerning and optimized the design for digital imaging. In addition, Nicholas created an alternative set of lowercase letters, fancy and swash capitals and enough alternate characters to personalize virtually any design project. </p>
      <p>By the time his work was complete, Nicholas and Crossgrove had created a small type family that included Fairbank, a revived version of the earlier metal font, and Fairbank Chancery, a more calligraphic rendition of the design. An additional suite of ornate caps, elegant ligatures, and beginning and ending letters accompanies both fonts, as does a full complement of lowercase swash characters. Now, instead of a failed Bembo italic, Fairbank emerges in its true glory: a sumptuous, elegant design that will lend a note of grace to holiday greetings, invitations, and any application where its Italianate beauty is called for."</p>
      <p>So I am left to wonder if the original drawings for Fairbank contained these incomprehensibly bad roman caps, ampersand, etc. Or did Nicholas and Crossgrove just not finish the job. </p>
      <p>Hey Monotype! Who do I complain to?</p>
