    <p>Do any of the Typophile brethren have an idea why Monotype opted to use upright romans rather than sloped romans when it digitized Fairbank Italic? I've owned this typeface since its initial digital release and hate that I've never used it believing the metal design is vastly superior. </p>
    <p>The digital ampersand just hurts and ugh the spacing &amp; kerning is ridiculous. It took me a while to get anything that closely resembles the specimen listed in the Bixler catalogue (the above image in the attached pdf) and still . . . it's pretty weak. Any insights would be appreciated. I'll pipe down now like a good Typophile lurker should.</p>
