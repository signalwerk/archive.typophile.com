    <p>//////////////////////////////////////////////////////////////////////<br>
    SUDTIPOS. NEW RELEASE. SEPTEMBER 09.<br>
    //////////////////////////////////////////////////////////////////////</p>
    <p><strong>Sudtipos</strong> is proud to announce the release of <strong><a href="http://sudtipos.com/fonts/116" rel="nofollow">Semilla</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilesemilla_5625.jpg"></div><p></p>
    <p><strong><a href="http://www.veer.com/download/pdf/semilla_specimen.pdf" rel="nofollow">Download the PDF Specimen "The top ten albums by Semilla Records"</a></strong></p>
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/typophilesemilla2_5714.jpg"></div><p></p>
    <p><strong>About Semilla</strong></p>
    <p>Inspired by the work of mid-century German lettering artist Bentele. Semilla means seed in Spanish. And the work of Bentele served as the germ from whence this new font has emerged.</p>
    <p>With an upbeat and casual flavor, Semilla springs forth with a feel of youthful experimentation. Swashes swoop upward, ending in ball terminals that evoke the feeling of sprouts bursting forth in spring.</p>
    <p>As always, Sñr. Paul provides a vast palette of glyphs with plenty of OpenType features and beautiful ligatures for your enjoyment.</p>
    <p>Read the history about the design of Semilla at the <strong><a href="http://www.veer.com/download/pdf/semilla_specimen.pdf" rel="nofollow">Semilla PDF Specimen</a></strong></p>
    <p><strong>About Semilla PDF Specimen</strong></p>
    <p>The artful photos used in this booklet are by French photographer and designer <strong><a href="http://www.flickr.com/photos/stephaneginer/" rel="nofollow">Stéphane Giner</a></strong>. He is very deserving of your patronage, so please keep an eye out for his marvelous work.</p>
    <p>License Semilla <a href="http://www.veer.com/products/typedetail.aspx?image=UMT0000472#specimen" rel="nofollow">here</a></p>
