      <p><em>Is there really a good typographic reason for breaking text up more often than authors and editors might want?</em></p>
      <p>If you disagree with the principles you are being taught, you could survey current practice and see what is normal in different genres.  Standard practice may not be aesthetically or theoretically pleasing to those who stop to think about it, such as educators, but at the very least it is highly readable to its audience--it has evolved to be the way it is through a process of natural selection in large cultural systems. It wouldn't look like it does if it didn't work.</p>
      <p><em>Is is really that bad to have a few word breaks?</em></p>
      <p>Not if it's better than having lines of wildy varying length.</p>
