      <p>As Cerulean said, it's all about the context. No, you don't want to break up novel unless you are Jonathan Safran Foer or Dave Eggers. The New York Review of Books and The New Yorker get along just fine with a bare minimum of breaks and/or flourishes. That wouldn't work so well with Lucky or Us Magazines. The main thing is to recognize who your readership is going to be and what is going to best work for them. There are no hard and fast rules.</p>
      <p>When you get out into the real world, it is pretty rare for a designer or art director to overrule an editor when it comes to matters of text. You have to have a very good reason for doing it beyond "it will look cool". The last thing an editor or author wants to think is that "people don't like to read".</p>
      <p>I get pissed when I think the designer is being hostile to the text, as in a lot of Phaidon art books where the text is treated as a design element and frequently not so easy on the eyes. But from what I understand that is a rare instance of the art director getting to call the shots (as an editor there has told me).</p>
