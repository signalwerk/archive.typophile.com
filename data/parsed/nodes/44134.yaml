      <p><cite>Or is this just a tendency of design professors and writers to throw in extra flourishes</cite></p>
      <p>Probably. I remember a design professor on a panel at a national meeting who said it was the designer's responsibility to challenge and excite the reader.</p>
      <p>I stood up in the Q&amp;A session &amp; said that if a designer wanted to "challenge" or "excite" a reader, he/she should write a book; those were the author's prerogatives. He replied "Of course. The designer should check with the author." Perhaps fine advice in school; almost never happens in the real world. Should something like that be needed, it will be the editor, in conversation with the author, who makes the decision.</p>
