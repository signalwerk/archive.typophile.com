      <p>Magazines often do the "break up big blocks" thing for differing reasons as Cerulean mentioned. Also, magazines are often read in spurts on subway commutes and doctor's offices. Having stopping points may be an advantage for such uses. The New Yorker is more likely to run long text because it is a readers magazine and the writing is usually quite a bit better than the lifestyle mags that promote "10 things your husband really wants (in bed)" or "101 best bars to pick up babes". Magazines also have plenty of ads and jumps so the reader gets visually jolted around and has to resettle himself with cues like subheads.<br>
      Books that are more a reference than a novel need subheads so that a person can find the section they are looking for easier. Things like "Linkage adjustments on the 1967 Plymouth Fury" may help the scanning gearhead find what he needs.</p>
      <p> ChrisL</p>
