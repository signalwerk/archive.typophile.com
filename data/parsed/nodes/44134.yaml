    html: <p>Well, different media have different purposes. If someone wants to read a book, they'll pick up a book they want to read, and they'll read it from beginning to end. Something like a magazine article or an advertisement is trying to hold the attention of a reader who may not be particularly interested in the subject matter and is eager to skip ahead to the next thing. The designer has to try to coax the reader into taking a closer look, or, failing that, to get the reader to absorb some of the intended message just by skimming it before turning the page.</p>
