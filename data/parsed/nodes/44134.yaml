    html: <p>In editorial design for non-profit agencies, their annual reports and related promo pieces tend to be text-heavy. We cannot assume readers are willing to read the text, so designers use a variety of intermediate devices that either sell the piece or convey the main points without reading body copy--two-tier headlines (teaser big, info line smaller), pull quotes, section sub-heads, interesting captions. These devices supplement the main text by super-imposing a kind of outline that the reader grasps at a glance. The client wins when the reader gets the message so easily, or at least, when he gets the impression the agency is support-worthy, which is all the agency really needs. This is the justification for using such devices to sell text; in magazines it serves the same function. There's no reason to spurn this method, it's just a question of how intelligently you use the devices available.</p>
