      <p>Most comments here have been referring to the practice as creating <em>breaking</em> points. But another way of looking at this sort of thing is creating <em>entry</em> points. And, as has been stated repeatedly, it all depends upon the material, the audience, and the environment. </p>
      <p>Certain types of material (magazines or annual reports, for instance) do benefit from multiple entry points. A reader scanning a magazine may not be attracted by the headline or the topic, but might get hooked in through a photo and caption, or a pull-quote, or a subhead, and before they know it they're actually reading the text. Mission accomplished.</p>
      <p>Fiction and other sustained narrative genres do not necessarily need these sorts of hooks, and in fact can be disrupted by the practice. </p>
      <p>My experience is that good authors, editors, copywriters, etc., understand their genre and the tools of their trade. As such, the text will reflect what's appropriate and the designer should look for cues from the text and the editor. </p>
      <p>I have worked in environments where it is collaborative and I can make suggestions to the editor, knowing that we're both after the same thing. But that's different than a blanket statement that says design should always try to break up text and enliven the page; context is everything. </p>
      <p>-- K.</p>
