      <p>What I'm about to say has mostly been said already, but I'd like explain the reasoning more thoroughly.</p>
      <p><em>How to Read a Book</em> recommends essentially that books be read in multiple progressively longer and in-depth rounds. First, you read things like the introduction, conclusion and table of contents to get an idea of the <strong>structure</strong>. Second, you skim the book by reading only the important sentences. You do this to get a more detailed idea of <strong>structure</strong>, to get something of the book and to determine whether to read it in more depth. Third, if it's worth reading in more depth, you read it front to back, and forthly, you may go into extreme detail through things like outlining.</p>
      <p>Paragraph breaks identify the important sentences; the first and last sentences ofa paragraph are generally more important than the middle sentences. <strong>Lack of necessary breaks and presence of unnecessary breaks both make skimming the book more difficult.</strong></p>
      <p>Only a complete idiot would break paragraphs completely arbitrarily, so I hope there's some justification (hehe) for the breaks. If you find that some of the breaks are more important than others, it would certainly help to have a hierarchy of breaks.</p>
      <p>Novels are sort of an exception because they are difficult to skim like that. Or maybe I just feel like that because I don't really like reading them. <em>How to Read a Book</em> still recommends steps equivalent to the steps for general reading, but I don't think it expects people to skim the book in the same way.</p>
