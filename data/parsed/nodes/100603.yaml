    html: |-
      <p>(Loving the new sp@m filters...)</p>
      <p>I don't think any of the fonts from Dan Solo's CD/Book publications were ever [legitimately] published elsewhere, they were created just for Dover in the 1990s. Those digitizations, while not the worst, leave a lot to be desired. His later fonts were published through MyFonts in 2004/2005, and seem to be of much higher quality.</p>
