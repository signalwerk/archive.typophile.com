      <p>And it can be downloaded from copyfonts dot com.<br>
      I don't know what the story is with a large sub-group of Dan Solo's digitizations that are no longer available from the usual merchants. In particular, just about NONE of the fonts included on the assorted 24-font CD / Book combinations from Dover publication can be found, while many of his fonts are at myfonts.</p>
