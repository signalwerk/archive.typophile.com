    html: |-
      <p>Hi Inni,<br>
      thanks for the feedback, this is better than seeing an astrologer!!! cool<br>
      Actually I had some wonderful teachers,and as for the hands..others' opinions are always more truthful.!!<br>
      The I's do have some variation, separations on the vertical at the bottom, at the top, no breaks and a regular one...four at the moment.They are used according to a few variables. The variations might not be so obvious in the picture, but it does show 3.<br>
      I can adjust it to give more variety in the y's and the ou ligatures. I think its more obvious because of the passage that Ive chosen as an example but I take your point.<br>
      As for the intended use, purely personal use or if anyone would want to buy it that would be great too. As for the reason for doing it...<br>
      One to get a true handwriting font, and secondly just as a labour of love...this is my first font, and self taught.</p>
      <p>Glad you like it though.<br>
      Kindest regards<br>
      Neil</p>
