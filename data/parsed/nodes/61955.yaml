      <p>Hi,<br>
      If it was done without the computer, i'd say you've got sure hands and good teachers ;). "I" stands out so you might have a strong personality... It makes me think of comic books and cats, don't ask why.</p>
      <p>To be honest, it took me a while to figure it's a script font, the first suspect is "I", give it one more alternative and i'm sorted. Other thing is "you" – contextual alts give same glyphs in same exact words, pity you cannot switch it to "random alternatives", could be nice for script faces.</p>
      <p>What is it's intended use ?</p>
      <p>cheers!</p>
