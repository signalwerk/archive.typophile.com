    <p>Hi,</p>
    <p>I'm searching for the name of the typeface used for the titles of the book "LICHTENSTEIN POSTERS".</p>
    <p>It's a sans serif, maybe bold, caps, slightly rounded. The A, the R and the G are very typicals.<br>
    I've found a font named "Hector rounded bold" wich is realy similar but a little bit too rounded.</p>
    <p>Could you help me ?<br>
    Thank's a lot.</p>
    <div class="field field-type-text field-field-solved">
          <div class="field-label">Font:&nbsp;</div>
        <div class="field-items">
