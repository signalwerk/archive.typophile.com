    html: |-
      <p>"The A, the R and the G are very typicals."<br>
      It would have been helpful if you had included an image. My idea of a typical R-- straight leg -- &amp; G might differ from yours.<br>
      I found an R from the book title, vertical leg with a kick at the base of the leg.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/LichtensteinTypophile112377_5196.jpg"></div><br>
      And possibly a G, seems to be part of the same font but I can't be certain.<br>
      Anyway size is small and details are obscure.<br>
      <div class="imageWrap"><img src="http://typophile.com/files/LichtensteinTypophile112377B_5845.jpg"></div><br>
      If the labels inside the book are the same as the title, i.e. with an R with a kick at the base of the leg, then I think it would be something something other than Garage Gothic.<br>
      Also, it would be helpful if we could see a larger scale image of G and if Q appears in the book, that as well.<br>
      Don<p></p>
