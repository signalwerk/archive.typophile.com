    <p>I made this font it has as it's feature 4 sets of small letters regular beginning swash type for init, ending swash type for fina and double single letter swashes for single letters like a in the middle of a sentence.  I use cswh to call that one. It's works great as expected.. </p>
    <p>The problem. Photoshop CS2 you can't turn those features on.  They don't exist in that version. Well calt does My question is Can somebody show me a sample of how I can get this idea working in the older Photoshop. I searched this forum a thousand times looking for a solution. I see people are having this problem but I can't find a solution. It may be here but I can't find. It's a multi language font too.</p>
    <p>Is there a way to call fina inside a different calt.. Do you have to build all the classes again ? What is the easy way that will work flawlessly. It works as expected right now but I want to build in functions if possible for older programs.</p>
