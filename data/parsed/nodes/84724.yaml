  html: |-
    <p>Greetings!</p>
    <p>I had come across a well detailed explanation on why Otl Aicher chose Univers over Helvetica when he designed the 1972 Munich Olympics. I don't remember if it was on the Internet or printed (maybe Markus Rathgeb's book "Otl Aicher"). Now I have scoured the web to no avail; I'm probably missing a keyword.</p>
    <p>Any information you are able to provide on Aicher's thought process of choosing Univers over Helvetica for the 1972 Munich Olympics would greatly be appreciated. Even though I'm primarily looking for Aicher's reasons, your insight is welcome.</p>
    <p>Thanks for your time.</p>
    <p>RG</p>
