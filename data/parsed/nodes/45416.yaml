    <p>Dear,</p>
    <p>I’m going to compose the lay-out my first essay. It is as essay which concerns some authors of XVII century. Some parts will be in Italian, other ones in Latin and few paragraphs will be in hieroglyphics (I found a free set of hyero. on the Internet)!</p>
    <p>For my past books I used Simoncini Garamond, New Baskerville, Sabon, but for this one I would like to use a new typeface set (or more than one).</p>
    <p>Do you have any suggestion?</p>
    <p>Thanks</p>
