  html: <p>I just saw this on K10K <br> <br>"<a href="http://www.fontifier.com/" target="_blank">Fontifier</a> lets you use your own handwriting for the text you write on your computer.  <br>It turns a scanned sample of your handwriting into a computer font that you can use  <br>in your word processor or graphics program, just like regular fonts such as Helvetica." <br> <br>I haven't tried it out yet. It's a free service, so this might be fun to try. I think it would be interesting to see a collection of Typophile hand-written typefaces. <br> <br>What do you think?</p>
  html_clean: <p>I just saw this on K10K <br> <br>"<a href="http://www.fontifier.com/" target="_blank" class="link-external">Fontifier</a> lets you use your own handwriting for the text you write on your computer.  <br>It turns a scanned sample of your handwriting into a computer font that you can use  <br>in your word processor or graphics program, just like regular fonts such as Helvetica." <br> <br>I haven't tried it out yet. It's a free service, so this might be fun to try. I think it would be interesting to see a collection of Typophile hand-written typefaces. <br> <br>What do you think?</p>
