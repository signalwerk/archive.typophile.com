      <p>I have not considered hand drawing the other script. This is a student run magazine so I have the opportunity to do pretty much whatever I please, provided it’s not any kind of fancy printing options ie. embossing, varnishing etc.</p>
      <p>RE: the ’kink’ are you talking about the one right above the crossbar? if so that’s easily remedied, this ’aging’ of the mark was done by crumpling the print out, copying, crumpling and copying and scanning it back in. If it’s that distracting I’ll definitely clean it up.</p>
