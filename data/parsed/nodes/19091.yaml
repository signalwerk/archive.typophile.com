    <p>So it looks like this work I did quite a while ago: <a href="http://typophile.com/node/16393" title="http://typophile.com/node/16393">http://typophile.com/node/16393</a> is going to be put to use. The magazine is having a ’cover contest’ and I worked out a few options last night and attached them in a PDF. I’m looking for serious crits, I would like to win this competition. :-D I optimized the PDF so it’s not amazing quality but still should be sufficient.</p>
    <p><a href="http://users.adelphia.net/~dabailey/maya.covers.pdf" title="http://users.adelphia.net/~dabailey/maya.covers.pdf">http://users.adelphia.net/~dabailey/maya.covers.pdf</a></p>
    <p>PS. Still don’t have internet at my new apartment so critiques during the day today while I’m on campus would be much appreciated otherwise I don’t think I’ll be able to see them till Monday.</p>
