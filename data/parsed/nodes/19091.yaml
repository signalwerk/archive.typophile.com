      <p>No need to apologise, my own fault for laziness in updating.</p>
      <p>I would like to see the title have a correlation to the folded paper background (I am imagining it as a manuscript wrapper), it seems with the multiply filter (or whichever it is) you are trying to make it appear as part of the wrapping but because it goes over the edges of the folds it is separate, you could look at making it look like it was painted/written.<br>
      I am not keen on the type (Bernhard) it just doesn’t have the right characteristics and the positioning isn’t working for me I would look at having two lines of copy under the 2nd A and two lines above the M (but rotated) they needn’t be the same so for example from one position Drexel University/Literary Magazine from the opposite First Edition/April 2006.<br>
      Overall I like the concept of the wrapper but I think it needs further work.<br>
      Tim</p>
