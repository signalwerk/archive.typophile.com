    html: |-
      <p>That watermark version reminds me of using bleach on inked paper calligraphy (worth trying if you have the inclination, not for this project necessarily, just a comment in passing). It certainly looks more like a part of the paper rather than floating above it. One thing that is troubling is the kink in the lefthand vertical of the first A, I understand the purpose just feel it is a bit too much.<br>
      The treatment might not be “commercial” but if the treatment of other text is sympathetic it could work for an in-house magazine (I am not sneering here, it is an opportunity you (and I) should relish), have you considered hand-drawing a script for the other text?<br>
      Tim</p>
