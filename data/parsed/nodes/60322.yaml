    <p>Hi - I'm a freelance web designer/developer, with a fairly modest knowledge of typography. </p>
    <p>I was just wondering if you have any ideas of a typeface that would work well with URW Antiqua (specifically Alternative T Super)?</p>
    <p>Luckily I think Georgia works well with it in various forms, esp. for body text (I could be wrong?), but I'm looking for something a little less common, and with similar character to Antiqua, to use for the headings and other more prominent areas of text on a new website.</p>
    <p>You can see the logo with Georgia here: <a href="http://www.finelysliced.com.au/old/" title="http://www.finelysliced.com.au/old/">http://www.finelysliced.com.au/old/</a></p>
    <p>Thanks! I appreciate your help/expertise!</p>
