      <p>If you're looking for fonts to use online, you might want to try <em>Baskerville</em> with <em>Baskerville Old Face</em> as a back up. The first come bundled with OSX, the second with MS Office 03 and 07 on a Windows PC, and MS Office 04 on a mac. (Add Georgia to be safe.)</p>
      <p>If you're not looking for something web specific: perhaps <a href="http://typejockeys.com/type/6_Ingeborg" rel="nofollow">Ingeborg</a> or <a href="http://www.shinntype.com/" rel="nofollow">Scotch Modern</a>. I'd say the latter is more dramatic.</p>
