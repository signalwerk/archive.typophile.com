    <p>Hi!<br>
    I´m looking for a font similar to the font used in the Campagnolo-logo.<br>
    Anyone know the name of the font they use? Or do you have a suggestion for something similar?<br>
    I kind of like <a href="http://www.dafont.com/ballpark-weiner.font">www.dafont.com/ballpark-weiner.font</a><br>
    But I need something that feels more "strict" and have more of a feeling of speed.<br>
    Any suggestions?<br>
    thanks!</p>
    <img typeof="foaf:Image" class="img-responsive" src="http://www.typophile.com/sites/default/files/old-images/campa_logo.jpg" width="1773" height="600" alt="">
