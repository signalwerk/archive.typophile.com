  html: |-
    <p></p><div class="imageWrap"><img src="http://typophile.com/files/logo_4966.png"></div><p></p>
    <p>I would like to inform you that the deadline for submissions for the "Ελληνικό Αλφάβητο" exhibition ends at the 15th of May.</p>
    <p>Additionally, the best submissions will be awarded with 1000, 700 and 500 euros worth of prizes, including type related software, books and typefaces.</p>
    <p>--------------------------------</p>
    <p>You can find more information at:<br>
    <a href="http://www.ictvc.org" title="http://www.ictvc.org">http://www.ictvc.org</a><br>
    <a href="http://ea.backpacker.gr" title="http://ea.backpacker.gr">http://ea.backpacker.gr</a></p>
    <p>Submissions at:<br>
    <a href="http://ea.backpacker.gr" title="http://ea.backpacker.gr">http://ea.backpacker.gr</a></p>
    <p>Questions, comments at:<br>
    <a href="mailto:contact@backpacker.gr">contact@backpacker.gr</a></p>
