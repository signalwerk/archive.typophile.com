    <p>Hello Typophiles,</p>
    <p>Maybe this will sound silly for those of you who had the opportunity to get in touch with metal typesetting but...</p>
    <p>While reading Meggs' "A History of Graphic Design", on page 81 (3rd ed.), he describes the book <em>Teuerdank,</em> printed by Johann Schönsperger with type designed by Vincenz Rockner in 1517. According to Meggs:</p>
    <p><cite>Rockner carried this design quality</cite> [the quality of Rockner's fraktur compared to Gutenberg's textura] <cite>even further in a heroic effort to duplicate the gestural freedom of the pen. As many as eight alternate characters were designed and cast for each letterform. These had sweeping calligraphic flourishes, some of which flowed deep into the surrounding space. Other printers insisted that these ornamental letterforms had to be printed from woodblocks, for they refused to believe that it was possible to achieve these effects with cast metal types. (An inverted <em>i</em> in the 1517 edition, however, conclusively proves that metal types were used to print Teuerdank.)</cite></p>
    <p>After reading this paragraph two questions came to my mind:</p>
    <p>1. If it wasn't for the inverted <em>i,</em> telling the difference from a woodblock print or a typeset ornament wouldn't be possible? Isn't it possible to tell the difference between these two techniques of printing just by looking at the printed piece? The thickness of ink, the irregularity of the shapes or something like that?</p>
    <p>2. How was it possible to set those flourishes in metal type? Were they a whole piece of metal or maybe divided into several smaller parts put together?</p>
    <p>If you don't have Meggs' book nearby you can read about <em>Teuerdank</em> and take a look at some pictures here: <a href="http://special.lib.gla.ac.uk/exhibns/month/feb2005.html" title="http://special.lib.gla.ac.uk/exhibns/month/feb2005.html">http://special.lib.gla.ac.uk/exhibns/month/feb2005.html</a></p>
    <p>Anyway, it's impressive...</p>
