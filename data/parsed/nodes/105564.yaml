      <div class="comment-spam-body"><p>1980s, meaning pre-digital.<br>
      [Edit: deleted line asking about source of image.]<br>
      I checked the usual places for faux-Cyrillic, free &amp; pay, &amp; drew a blank.<br>
      The base font is a high contrast serifed angular type in the general style of Eden, designed by R.H. Middleton in 1934.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/Eden_6668.jpg"></div><br>
      Since writing this I found that the Spandau Ballet Logo was discussed four years ago. The typophiles of the day also suggested Eden as a possible source. <a href="http://typophile.com/node/60957" title="http://typophile.com/node/60957">http://typophile.com/node/60957</a><br>
      Don<p></p>
      </div>
