    html: |-
      <div class="comment-spam-body"><p>O.K. this is what I have found. The images are from the CD cover for Spandau Ballet's album, Journey's to Glory, released in 1981 on the Chrysalis label, with the cover printed in West Germany.<br>
      The lettering also appears on Spandau Ballet's "The Freeze."<br>
      So whoever created the CD cover probably also created the lettering. Photo-lettering could have ensured consistency. I suspect this was not a full font.<br>
      Don</p>
      </div>
