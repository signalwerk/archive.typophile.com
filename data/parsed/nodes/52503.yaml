      <p>There is nothing quite like the Double Crown Club, or so its members would have you believe. In London there is also the Wynkyn de Worde Society, set up in the late 1950s, which has lunches in the middle of the day instead of dinners in the evening. I am not sure it would like to be thought of as a satellite. It used to be business-like rather than gentlemanly, and it was hard-drinking, and thick with smoke too I should think. But it has probably settled down in its old age, and appeals to people who do not live in London and who want to get back home in the evening. And who can spend three hours or so on lunch. A few people belong to both clubs. A great many people have never heard of either of them.</p>
      <p>A different designer is responsible for each menu and for the invitation or advance notice of the dinner, and some of these are well worth looking at. As I said, Moran’s book reproduces several from the past, but there is nothing quite like seeing the the colours and special papers of the originals. The designers and the speakers are not encouraged to interfere with the choice of the food.</p>
      <p>As for the names of members of the Club, these are for other members only. Maybe not everyone wants his or her membership to be widely known. </p>
      <p>Here is the only other bit of printing for the club that I could find immediately, quite a small one. (I’ll send one or two others to you directly if I can find them.) It is the invitation to the 140th dinner, which was in 1957, a joint event with the Gezelschap Nonpareil, a Dutch typographical club. It took place at All Souls College, Oxford, and the speaker was Harry Carter, talking about ‘Dutch Types and Oxford Printing’. The invitation was set in the ‘Fell’ types and printed at the University Press. I am not quite sure how I got it, but I kept it because it uses an ornament that I am fond of, a 16th-century design that is attributed to Robert Granjon. It used to be cast at Oxford from a pair of original matrices.<br>
      </p><div class="imageWrap"><img src="http://typophile.com/files/DCC - invitation to Dinner 140 1957 500_6595.jpg"></div><p></p>
