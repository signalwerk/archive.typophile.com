      <p>Well, I’m not Florian, but I’ll do my best to tell you how to join the Double Crown Club. Get to know a member, and maybe he or she will propose you for membership, and if the members like the sound of you, and the look of what you have designed or printed, you are in. It’s a dining club, though, and you need to get to dinners regularly. Still, if a member takes you as a guest, you get a free dinner, and if you get too many such free dinners, people think you should join and pay for your own. Like most such groups it tends to think of itself, rightly or wrongly,  as (literally) an élite. At any rate, it did in 1924 when Stanley Morison and Oliver Simon were among the founders. Mike thinks that it was a conspiratorial coterie of men (they were all men) who thought rather too well of their superior good taste. I wouldn’t say that he is wrong. </p>
      <p>We are quite different now, of course. But whatever the quality of the speaker (being human, they vary), we still appreciate attention to a decent standard of food and wine, as well as good typography, like the club’s founding fathers. Here is a detail of Tuesday’s menu. (There are plenty of other examples in James Moran's book.) If I understood the story that was given out at dinner, Jerry Kelly (one of the club’s Honorary Overseas Members) provided the Jessen-Schrift.</p>
      <p></p><div class="imageWrap"><img src="http://typophile.com/files/DCC dinner 399 - menu 500_5121.jpg"></div><p></p>
