      <p><em>Trying to dig up a little info on the Double Crown Club</em></p>
      <p>What do you want to know? The 399th dinner was last night, at the Savile Club, Brook Street, where after a Pressed Game Terrine we had Roast Breast of Goose finished with Mustard-flavoured Brussells Sprouts and Potato Fondant, followed by Warm Chocolate Fondant finished with Cinnamon Ice-cream and Mulled Wine Syrup. There was a good white wine from the Ardèche. The red was a decent claret. The choice of pudding was artful, since the speaker was Jerry Cinamon, who spoke on Rudolph Koch, showing slides of original artwork that he made at the Klingspor Museum and which were completely new to most of us. The menu was set in Koch’s Jessen type, the one for which he cut the punches directly in the metal without making drawings, or so he said.</p>
      <p>If you want to go further back, the official history is by James Moran, <em>The Double Crown Club : a history of fifty years</em> (1974), but there are references, complimentary ones on the whole, scattered over several studies of the British typographical scene in the 20th century.</p>
