    <p><strong><a href="/web/20190728071543/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Indices" title="Create node &quot;Indices&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Indices</a>&nbsp;: <a href="/web/20190728071543/http://www.typophile.com/node/31465" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Writers</a>&nbsp;: Phil&nbsp;Baines</strong></p>
    <p>Born: Kendal, Westmoreland, United Kingdom,&nbsp;1958.</p>
    <p>After studying to be a Catholic priest for three years at Ushaw College, Durham, turned to graphic design and graduated from St. Martin’s School of Art in 1985 and the Royal College of Art in 1987. Freelance graphic designer since 1987 undertaking anything from humble print work for small publishers and arts organisations to typographic sequences for <span class="caps">TV</span> commercials. Work characterised by careful use of typographic structure, sometimes organic, sometimes highly ‘engineered’, but always deriving from a respect for the material. Since 1995 has been assisted part-time by several ex-students enabling larger commissions to be undertaken, e.g. Phaidon’s Art <span class="amp">&amp;</span> Ideas series implementation (7 titles designed in the last 2&nbsp;years).</p>
    <p>In addition to practice, has been a frequent writer for <a href="/web/20190728071543/http://www.typophile.com/node/12053" title="Click to view a local node." class="freelink freelink-nodetitle freelink-internal">Eye</a> and other design magazines and contributor at design conferences, and has spoken at colleges throughout England as well as abroad. In September 1991 became a Senior Lecturer (half f/t) in typography at Central Saint Martins College of Art <span class="amp">&amp;</span> Design, London. Part of his teaching responsibility is jointly curating the Central Lettering Record with <a href="/web/20190728071543/http://www.typophile.com/node/add/wiki?edit%5Btitle%5D=Catherine%20Dixon" title="Create node &quot;Catherine Dixon&quot;" class="freelink freelink-freelinking_prepopulate notfound freelink-internal">Catherine Dixon</a>.</p>
