    <p><strong><a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Writers" class="freelinking" rel="nofollow">Writers</a> : Phil Baines</strong></p>
    <p>Born: Kendal, Westmoreland, United Kingdom, 1958.</p>
    <p>After studying to be a Catholic priest for three years at Ushaw College, Durham, turned to graphic design and graduated from St. Martin’s School of Art in 1985 and the Royal College of Art in 1987. Freelance graphic designer since 1987 undertaking anything from humble print work for small publishers and arts organisations to typographic sequences for TV commercials. Work characterised by careful use of typographic structure, sometimes organic, sometimes highly ‘engineered’, but always deriving from a respect for the material. Since 1995 has been assisted part-time by several ex-students enabling larger commissions to be undertaken, e.g. Phaidon’s Art &amp; Ideas series implementation (7 titles designed in the last 2 years).</p>
    <p>In addition to practice, has been a frequent writer for <a href="/wiki/Eye" class="freelinking" rel="nofollow">Eye</a> and other design magazines and contributor at design conferences, and has spoken at colleges throughout England as well as abroad. In September 1991 became a Senior Lecturer (half f/t) in typography at Central Saint Martins College of Art &amp; Design, London. Part of his teaching responsibility is jointly curating the Central Lettering Record with <a href="/wiki/Catherine%20Dixon" class="freelinking" rel="nofollow">Catherine Dixon</a>.</p>
