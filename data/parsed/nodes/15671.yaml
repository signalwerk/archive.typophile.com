    <p><a href="http://www.suitcasetype.com" target="_blank" rel="nofollow">Tomáš Brousil</a> says.: <em>'After one and half year of an intensive work <a href="http://www.suitcasetype.com" target="_blank" rel="nofollow">we</a> ( <a href="http://www.suitcasetype.com" target="_blank" rel="nofollow">Suitcase</a> ) have just released the new superfamily font Dederon. <a href="http://www.suitcasetype.com/page.php?lmut=en&amp;section=font&amp;font=dederon%20Serif%20Std%20OT" target="_blank" rel="nofollow">A serif version</a> of the Dederon is a humanist book antique with open shapes. <a href="http://www.suitcasetype.com/page.php?lmut=en&amp;section=font&amp;font=dederon%20Sans%20Std%20OT" target="_blank" rel="nofollow">A sans serif version</a> comes out the same construction principles, hence it is sortable for a demanding combined typography. Fonts are available in a postscript but at last also in an opentype format. Each Dederon OpenType Std weight includes standard latin accented glyphs for over fourteen languages, wide range of basic and accented ligatures, genuine small capitals, non-aligning, capital, small capital, table, fractional and index numeral characters, expert glyphs and alternative variations, together more than 800 glyphs in one type face for comfortable work on the most demanding projects..'</em></p>
    <p>I say.: <em>'A breathtakin' type ( super ) family.. Another brandnew favourite.. <a href="http://typophile.com/node/12231" target="_blank" rel="nofollow">Czech Type</a> strikes again..'</em> :)</p>
