    <p>I have a small library (3 books, eh?) of books on typography. This includes:</p>
    <p><em>The Elements of Typographic style</em> by Robert Bringhurst<br>
    <em>Thinking with Type</em> by Ellen Lupton<br>
    <em>Stop Stealing Sheep and Find out how Type Works</em> by Erik Spiekermann and E.M Ginger</p>
    <p>What books would you recommend to add to this? Give a little review if you can.</p>
    <p>Thanks,<br>
    Evan<br>
    <a href="https://web.archive.org/web/20080907013507/http://evanmade.com/" target="_blank">www.evanmade.com</a></p>
