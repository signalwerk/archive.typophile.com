    html: |-
      <p>Through QuarkXPress - it breaks down as Patty has put it 100C 88M 20K. But that is for Pantone Color Solid Coated and Uncoated. (Though the coated is a bright purple and the uncoated is a dusty blue.) </p>
      <p>In the actual Pantone Color Formula Guide on how to make the color it reads: (this would have to be for spot color)<br>
      12 parts Pantone Blue 072 -70.6<br>
      ,75 part Pantone Black -4.4 and...<br>
      4.5 parts Pantone Trans White -25</p>
      <p>and that is the secret to why a PMS color that we see doesn't print looking like we thought it would. I checked with my Pantone Process Simulator - (great book shows you how each color prints on coated and uncoated stocks - and how far off the PMS guide really is) but sorry, it only goes to PMS 600. </p>
      <p>If you are trying to get close in a print job to the swatch of 662 - you may want to add about 20y and up the k to 30 or 40 - (that from hubby, the retired color separator...)</p>
