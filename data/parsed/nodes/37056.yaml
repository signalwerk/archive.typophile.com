    html: |-
      <p>Those deep rich blues are one of the worst colors to accomplish in the CMYK gamut. They get muddy. I use Michael and Pat Rogondino's <em>Process Color Manual</em> to estimate PMS conversions. There are a few blues in the manual that will come close to that, none of them will look exactly right on screen. Each has a shift one way or the other, so a compromise has to be made. My first pick was 100c 100m 10y 0k. My next look was 100c 90m 0y 10k. </p>
      <p>Are you going to a printer? Ask them. Almost every production source I use has extensively tested their equipment and know the best color estimation their machinery will achieve.</p>
