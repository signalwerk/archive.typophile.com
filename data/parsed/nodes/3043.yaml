  html: <p>I really like the '<a href="http://www.letterror.com/foundry/fed/index.html" target="_blank">Federal</a>' typeface, by <a href="http://www.letterror.com" target="_blank">LettError</a>.. <br>( <a href="http://www.letterror.com/foundry/fed/index.html" target="_blank">http://www.letterror.com/foundry/fed/index.html</a> ) <br> <br>As silly as it sounds, but I especially like the filled, non-shaded versions of it.. <br>So, now, my question would be, are there any other typefaces, that look kinda similar.? <br>Could you please name some 'Federal' look-a-likes.? <br>( I dont want a ripped off font hint, I am just seeking a similar style, if that makes any sense.. ) <br> <br>* In the need for better words.. * <br> <br>Thanks a lot, fellow Tyophiles.. <br> </p>
