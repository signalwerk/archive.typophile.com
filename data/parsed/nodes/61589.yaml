    html: <p>... and Icelandic, Færoese and Old Norse. WÆ is not used in any living Germanic language, (though it was used in Anglo-Saxon and Old Danish), while YÆ is used in one single Norwegian (Bokmål) word, "høyætta" (alternative form "høyættet").</p>
