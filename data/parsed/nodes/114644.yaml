      <p>Edition Serif is a variation on designs by Imre Reiner for the Corvinus fonts, particularly Corvinus Skyline, from 1929 to 1934, which were sold by Bauer. Similars sold by Lanston Monotype as Glamour. Edition Serif was made by Mike Diehl &amp; Paul Volk in 1991. Website <a href="http://www.mikediehl.com/logo/dv.html" title="http://www.mikediehl.com/logo/dv.html">http://www.mikediehl.com/logo/dv.html</a> Info on Edition Serif <a href="http://www.mikediehl.com/type/index.html" title="http://www.mikediehl.com/type/index.html">http://www.mikediehl.com/type/index.html</a> with note<br>
      ---start quote---<br>
      Many of the letters were designed for use on MCA Records' New Edition greatest-hits package (Vartan, Art Director).</p>
      <p>DV Edition Serif and other Diehl.Volk Typographics typefaces are available by emailing Mike Diehl. <a href="mailto:Michael@MikeDiehl.com">Michael@MikeDiehl.com</a><br>
      ---end quote---<br>
      If you wish to use Edition Serif for a project you could try the e-mail address and see if it is still valid.<br>
      Don</p>
