      <p>The fonts that designers have to use on their own computer of often irrelevant online. I'm not interested in free fonts so that I can use them for free–like you said, between OS X and CS2 I've got all the fonts I'll ever need. </p>
      <p>But web users? The only fonts a designer can count on them to have are Arial, Verdana, Georgia, Times, and maybe Helvetica. For me, the point of having more free type out there, provided by companies like Microsoft or Adobe, is that they'd be doing a huge favor to designers, who would finally be free to use more type without resorting to raster images or flash tricks, or funky javascript stuff. Either that or they need to do us all a favor and work out embedded type–something Adobe could have done two years ago had they kept up SVG support–and clarify the related licensing terms.</p>
