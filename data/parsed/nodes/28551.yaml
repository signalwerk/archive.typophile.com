      <p>If the W3C made typefaces:</p>
      <p>- It would take five years for designers to figure out how to use them without everything looking like crap, partly because they would remove any ability to center or align type that didn't involve manipulating the margins.<br>
      - Every typeface would have to work equally well in print, on cellular devices, and on game consoles.<br>
      - Every typeface would come with a lecture on how "open" it is, and then the W3C would start whinging any time someone tried to change it, only implement certain weights, add weights, or change the design at all.<br>
      - There would be numerous discussions between the corporate backers and the W3C about the direction of the type design, none of which would go anywhere.<br>
      - We'd only ever be able to view the fonts properly on Opera and Safari. The Firefox developers would keep trying to implement the fonts, and claim to be W3C-font-compliant, but still not be able to render 20% of them properly.</p>
