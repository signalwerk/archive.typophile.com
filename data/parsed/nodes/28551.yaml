      <p>I remember when I was in design school in the dark ages.  The type foundries did exactly what Ellen suggested.  One day 4 burely guys in a Caterpillar front-end loader came to my apartment to deliver my set of fonts.  The huge package was labeled to "Underserved market person #864." It was 8 tons worth of California job cases filled with 72 point lead type.  I asked if there was a charge (before they got the lead out).  They said, "No, it all comes bundled with your Haberule."</p>
      <p>ChrisL</p>
