      <p>Ellen's got a good point. If people don't start giving stuff away soon, we're all going to grow old designing everything in Times, Georgia, Verdana, and Arial/Helvetica because clients will think that those fonts are "the standard." A lot of US Federal Government agencies, along with a lot of courts, are already standardizing on Times; God help us all if the entire world standardizes on fonts that come with MS Office.</p>
      <p>And besides, Adobe needs to do SOMETHING with all that money. After all, they aren't using it to patch all the nasty bugs in their software in-between releases like they used to.</p>
      <p>Of course, with my luck they'll give us ITC Garamond and Papyrus.</p>
