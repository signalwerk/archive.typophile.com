      <p><cite>Things look equally grim for typography in CSS3’s type stuff, assuming it ever gets out and gets even partially implemented.</cite></p>
      <p>Personally, I hope that by the time CSS3 gets implemented, someone else will have already come up with a good replacement for XHTML/CSS–and for that matter, the W3C. I also doubt that CSS2 will ever see a full implementation in Firefox or, more importantly, Internet Explorer, so CSS3 may be a lost cause. </p>
      <p><cite>I think the only way anything will progress soon has to be a non-proprietary standard orchestrated by the Typographic trade organizations in communications with the browser developers. Individuals can’t do it. Short of paying dues to a trade group, the next best bet is the FOSS community. It’ll be a while that way though.</cite></p>
      <p>As much as I wish the F/OSS community could make it happen, they probably won't. I'm a reformed sysadmin/engineer, and I've spent enough time in the trenches with F/OSS types to know that they code stuff that's of interest to F/OSS programmers. They would have done it all with SVG by now if there was serious interest. Unless someone offers a big financial bounty for a F/OSS option, it won't happen. </p>
      <p>Does anyone else just wish that Adobe would start trying to make Flash the new PDF for the web? With Flex to handle the backend there's no reason that the combined talents of Adobe and Macromedia can't do something a lot better than the W3C has done with XHTML/CSS. It would be great for designers, who would no longer have to worry about dealing with browser incompatibilities, not to mention not having to learn their way around the obtuse mess that is HTML/XHTML/CSS/Javascript.</p>
