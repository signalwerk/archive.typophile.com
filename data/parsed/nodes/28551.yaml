      <p>No professional just starting out in any profession gets "free stuff" , why should the publishing/design professional be any different.</p>
      <p>Generations of designers graduated from design schools for years and got zilch handed to them for free.  Type is way, way cheaper now than it ever has been in history. What you get for free today, you perceive of lesser value tomorrow. If you want free type, there is a ton of it out there now.  If you want something that you don't see out there for free, spend a few hundred hours and design it yourself.  You might see some value in that $30 font then.</p>
