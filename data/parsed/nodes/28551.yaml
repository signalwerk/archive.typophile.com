      <p><em>it’s interesting to look back and see how quickly the interest in making free fonts fizzles out: Time for a website for free font development?</em></p>
      <p>It hasn't fizzled out. When I first learned of open source several years ago, the typographic subgenre was rather slim pickings. It is growing. And, will keep growing, things don't just fall out of open licenses, so the fruits will continue to be there. It won't be important tomorrow, but it will be important.</p>
      <p>Nevertheless,I am not worried. Open fonts will inevitably take over the legible-functionality aspect of type, while the professionals will continue to cater to the specialist demands; topicality, branding, high art, prestige product, and pretty much everything else interesting today.  </p>
