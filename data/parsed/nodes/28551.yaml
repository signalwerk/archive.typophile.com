      <p>Food for thought: There are tons of people who have to use type who are not going to buy type. But I still have to view what they make with the default choices, and it gets old. Free typefaces have a chance at becoming ubiquitous by natural selection. Ans becoming parts of standards for compatibility, that I would balk at choosing proprietary fonts for. If any decent casual fonts were truly free back-in-the-day, would we all be forced look at Comic Sans? Astigmatic One Eye makes sales today, based on the recognition their free fonts garnered them; I've sold them to clients. Finally, is it not one of those things where, if you don't like the idea, you needn't participate? FOSS grows well despite MS and other major developers.</p>
