      <p><cite>I think “The World” is more interested in more basic needs like food, shelter, and medicine. If anyone is interested in helping, they can sell their wares of any kind, be they Type Books, fonts, or graphic designs, and donate the proceeds to help those in real need.</cite></p>
      <p>Legible type is going to become essential to providing food, shelter, and medicine in the third world over the next several decades. There are currently several programs (More of Nick Negroponte's work IIRC)that provide solar/people powered satellite internet linkups in Africa which are used by villagers to access VoIP, online information about farming and health, and current market prices (which allow farmers to get the best prices for their goods). Without good type, the information isn't worth much. </p>
      <p>Of course this doesn't require every type designer to make a gift to humanity, but some good free fonts certainly won't hurt.</p>
