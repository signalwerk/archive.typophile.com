      <p><em>As much as I wish the F/OSS community could make it happen, they probably won’t. I’m a reformed sysadmin/engineer, and I’ve spent enough time in the trenches with F/OSS types to know that they code stuff that’s of interest to F/OSS programmers.</em></p>
      <p>By 'a while', I meant FOSS could take decades. The incredible slowness that IM has moved from a mess of proprietary nightmares of incombatibility, to today, with the dawn of XMPP just barely starting to matter is aperfect example of even a geekier thing moving at FOSS speed. But hey, maybe as the /. hordes get older, they'll want EvenClearerType. Otherwise, I don't know who'd pay the bounty. An e-book developer?</p>
      <p>I think trade groups could make it happen in 4-5 years, which is still a long time in code-land. Are there even any important industry organizations? Do they have much motivations or membership?</p>
      <p><em>Does anyone else just wish that Adobe would start trying to make Flash the new PDF for the web?</em></p>
      <p>I don't know. Off the top of my head, I just want Adobe to not behead the vision that made Macromedia great. The competition between the two has been beneficial to me, and I don't know what will help keep Adobe, now an even older, larger corporation, taking risks.</p>
