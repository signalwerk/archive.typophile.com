      <p>I think the public also needs to understand the value of type.  Somehow giving it away does not seem to be a way to do this.<br>
      A strange thing happened to me today--maybe not so strange.  While taking the elevator from the Metro, I ran in to a women I see frequently in my daily commuting.  I told her I was retiring from my day job this Summer and planned to design typefaces.  Her response was, "What is a Typeface?" She is an educated professional who works for the Smithsonian and was not kidding.</p>
      <p>We have a lot of "public awareness" to do before font selection.</p>
      <p>ChrisL</p>
    html_clean: |-
