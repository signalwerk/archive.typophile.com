      <p><em>Open fonts will inevitably take over the legible-functionality aspect of type</em></p>
      <p>That doesn't make sense. Basic functionality is already catered to by system-bundled fonts.<br>
      Without bundling distribution, a free font will have to be a quite remarkable design to get any kind of "market" penetration. It worked for Ray Larabie's Neuropol, but that was part of a phenomenon when digital fonts were new and trendy. Or a "gimmick", like Gentium.</p>
      <p>It's not enough just to be free, a free font has to have a Big Idea and be brilliantly designed, just like retail fonts, for people to want to use it. </p>
      <p>Online font retailers have done free font promotions, but have those fonts proven to have legs? At least if I spend time creating a font and marketing it, I can make something back on the work, even if it doesn't sell a lot or become a classic, but imagine going to the same effort for nothing, with no guarantees that anyone will even warm to it. There's all this BS about "giving something to the world", but the likelihood the world would even want one's free offerings is extremely slim.</p>
