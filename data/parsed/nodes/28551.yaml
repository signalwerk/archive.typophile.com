      <p>And that's another reason I'd rather see companies like Microsoft and Adobe, which may have some business interest in doing so, release a few good new families. It worked out very well with Verdana and Georgia-far better than it has with just about all the other free fonts out there, most of which are almost never used by anyone, for good reason.</p>
      <p>Something else I've been thinking about, regarding the possibility of Lupton inspiring a whole lot of designers to release more free fonts, is that even if it does happen, theres no good way to deal with distribution of the fonts for use on the web. Would users really want to deal with a few more big families, a few dozens small ones, and hundreds of display faces just to be able to use the internet and see the fonts that are available out there? This one leads me back to wishing that either Microsoft or Adobe (or better, both) would pick get their respective embedded font balls rolling again.</p>
