      <p>A painless embedding standard, endorsed by the right folks, could be retroactively applied to all existing OT fonts, based on their embedding tags. The platform independence of OpenType also makes this viable this very moment.</p>
      <p>Of course, most of the good typographical stuff in CSS2 has not been implemented in any browser, and 2.1 was essentially a rolback from the W3C, since they couldn't get browser support. Things look equally grim for typography in CSS3's type stuff, assuming it ever gets out and gets even partially implemented.</p>
      <p>I think the only way anything will progress soon has to be a non-proprietary standard orchestrated by the Typographic trade organizations in communications with the browser developers. Individuals can't do it. Short of paying dues to a trade group, the next best bet is the FOSS community. It'll be a while that way though.</p>
      <p>Choz Cunningham<br>
