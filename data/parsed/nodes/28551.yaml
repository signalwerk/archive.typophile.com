      <p>James, how do you spell "greedy"?<br>
      If you're a professional designer working on a Mac using Adobe CS, which is the standard, you have been bundled a shitload of free fonts, more than enough to cover all the basic typesetting requirements of your work.<br>
      If you're a professional, you can drop $1000 on a new tab-sized inkjet printer, an Aeron chair, a Cinema 24" display, and a similar amount on 1000 fonts in Bitstream's Type Odyssey. If you're a professional, you presumably have some cash flow, and a library of fonts is a business expense like any other.<br>
      But of course, software wants to be free.</p>
