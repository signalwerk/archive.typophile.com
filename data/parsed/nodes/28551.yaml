      <p>&gt;i think a better solution (and perhaps just as naieve as asking type designers to give fonts away for free) would be for the w3c (or some other interested organization) to commission typefaces that would be made available freely to whoever wanted to use them for whatever purpose. </p>
      <p>I don't think the w3C would be the right organization, but this matches my personal opinion. Here's what I posted on El's blog... </p>
      <p>"With few exceptions* the successful free fonts have had corporate, governmental or other organizational backers that have bankrolled their production. This is true for SBL Hebrew, Euphemia UCAS, Vera, Verdana, Georgia, Cyberbit and pretty much every other useful free font you can mention. Time and time again it’s been proven that paying professional type designers for their time and effort is the only way to produce professional results, that the amateurs can’t match. So rather than calling on type designers and foundries to donate typefaces, perhaps it would be better to call on corporations and governments to pool their donations into a central fund that would finance the production of high quality fonts for the public domain?"</p>
      <p>If a type designer wants to make a free font, that's their choice. But my personal opinion is that if you want good results you should be prepared to put up some cash or other incentives.</p>
