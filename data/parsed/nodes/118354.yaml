      <p>I did <a href="http://swapped.cc/content/logotypes/img/certtime-mark.png" rel="nofollow">something similar</a> to B for a past project, so I think it's the best option of two. Though mine also covered a wax seal :)</p>
      <p>With regards to the type choices, I'd say that while Lucida Grande works fine as a body text, it looks somewhat flimsy in large sizes, e.g. in "Data Synching". Not illegible, but kind of artsy-fartsy, not assertive enough. Also, another thing to keep in mind is that Lucida Grande is replaced with Lucida Unicode on Windows and it doesn't look *that* good nor is it remarkably legible.</p>
