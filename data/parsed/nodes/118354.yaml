      <p>Thanks for all the comments,</p>
      <p>I'm also partial towards B, as is my boss. The only issue is people misinterpreting it as only a clock, and losing the checkmark (as happened to JamesM). We noticed a few other people overlooked it too. Now the goal is to make the checkmark a bit more assertive for that option</p>
      <p>The checkmark has to stay (to my dismay). I'm well aware it's used in every productivity logo ever made, but it's another constraint.</p>
      <p>Thylacine- I can use any typeface for the logo, it's just the typeface used in the app where I'll be using Lucida and Futura.  The interface for the app is used internationally and translated into different languages, so using something from the css font stack ensures there won't be any translation issues.</p>
