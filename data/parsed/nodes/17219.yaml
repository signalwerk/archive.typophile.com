    <p><strong> <a href="/wiki/Indices" class="freelinking" rel="nofollow">Indices</a> : <a href="/wiki/Designers" class="freelinking" rel="nofollow">Designers</a> : Kris Holmes</strong></p>
    <p>Kris Holmes grew up on a fruit ranch in California. She attended Reed College in Portland where she studied calligraphy under Lloyd Reynolds. At Reynolds' suggestion she took up modern dance, eventually studying under Martha Graham in New York. She took a lettering class with <a href="/wiki/Edward%20Benguiat" class="freelinking" rel="nofollow">Ed Benguiat</a> and eventually received her B.A. from Harvard University. In 1978 she began working with Charles Bigelow, another student of Reynolds. She took a job with <a href="/wiki/Compugraphic" class="freelinking" rel="nofollow">Compugraphic Corp.</a> where she learned the <a href="/wiki/Ikarus" class="freelinking" rel="nofollow">Ikarus</a> software. </p>
    <p>Her only formal training in type design was a two week course with <a href="/wiki/Hermann%20Zapf" class="freelinking" rel="nofollow">Hermann Zapf</a> in 1979. Shortly thereafter she went to work for the Heil Co. in Germany as a <a href="/wiki/type%20designer" class="freelinking" rel="nofollow">type designer</a>. In 1982 Charles Bigelow got a job teaching <a href="/wiki/type%20design" class="freelinking" rel="nofollow">type design</a> at <a href="/wiki/Stanford%20University" class="freelinking" rel="nofollow">Stanford University</a>. Bigelow and Holmes began doing contract type design which resulted in the <a href="/wiki/Lucida" class="freelinking" rel="nofollow">Lucida</a> family of typefaces, originally designed for Scientific American magazine, as well as <a href="/wiki/Apple%20Chancery" class="freelinking" rel="nofollow">Apple Chancery</a>. Approximately 150 million fonts designed by Bigelow &amp; Holmes are in circulation and have been issued with several operating systems including Macintosh and Windows.</p>
