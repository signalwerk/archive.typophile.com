    html: "<p>Brode, I'd hate to see you gag. Brian mailed and <br>asked me to post this. (He was having trouble <br>logging in here.) <br> <br>------------- <br> <br>Here are some of my tattoos as requested for visuals by Stephen Coles. <br>They are as best as I can shoot them with my digital camera for now by <br>myself.  If you want better pictures, I can try to get someone to shoot <br>them for me in a few days much better.  I have a few more as well that <br>are not included here that I was simply unable to angle to shoot. <br> <br><a href=\"http://www.astigmatic.com/AOEWRIST.JPG\" target=\"_top\">http://www.astigmatic.com/AOEWRIST.JPG</a> <br>(Tattooed Left Wrist w/ \"MCMLXXIII\" and Tattooed Thumb/Forefinger <br>webbing w/ the infinity sign. <br> <br><a href=\"http://www.astigmatic.com/AOELEG.JPG\" target=\"_top\">http://www.astigmatic.com/AOELEG.JPG</a> <br>(Tattooed Lower Left Leg, Outer Side w/ Latin text \"Quinque Venenum: Vis <br>Vires, Pecunia, Desiderium, Amor, Ego\" and below that is the amulet sign <br>for the Hand of Maat (Egyptian). <br> <br><a href=\"http://www.astigmatic.com/AOEFOREARM.JPG\" target=\"_top\">http://www.astigmatic.com/AOEFOREARM.JPG</a> <br>(Tattooed Left Forearm w/ (from top to bottom) Dutch word <br>\"vasthoudenheid\", Latin phrase \"Nitor expletio\", and Tibetan prayer <br>mantra \"Ohm Mani Padme Hum\" <br> <br>Upper Left Arm (not shown) is French word \"eclaircissement\", and below <br>that the binary code for BE \"0100001001000101\" <br> <br>Back of Neck (not shown) is the Kanji character for Tranquility. <br> <br>I hope all these links work ok, have only posted a few times here, but <br>never links.  I plan, over time, to continue having typographic tattoos <br>added to fill my complete left side of my body, and varying the <br>languages used as much as my ability to find translations of the texts I <br>want added available. <br> <br>Hope the shots are of interest, let me know if you want me to have them <br>shot better and I'll get that done in a day or two. <br> <br>- Astigmatic</p>"
