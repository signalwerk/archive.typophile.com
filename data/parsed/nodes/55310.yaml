    <p>She was 90 and had been having heart problems for the past 30 years. It wasn't unexpected yet, even when you think you have prepared yourself for the inevitable, you are caught unprepared. Her mind was sharp till the end and her sense of humor still shined through. We will miss her.</p>
    <p>Chris</p>
