      <p><em>Is it miniscule or minuscule? And is it storey or story? :·a<br>
      </em></p>
      <p>My bad: when applied to lettering, it's minuscule vs. majuscule vs. miniscule (which simply means "tiny"). Storey or story depends on whether you use British or American spelling.</p>
