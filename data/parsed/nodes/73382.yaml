    html: <p>Those two on the right are based on Roman Current writing (that Futura is just upright version of the Italic), and two-storey a on the left has its origins in Capitalis Rustica and Uncial writing from fourth to sixth centuries, and later Carolingian Minuscule in ninth century.</p>
    html_clean: <p>Those two on the right are based on Roman Current writing (that Futura is just upright version of the Italic), and two-storey a on the left has its origins in Capitalis Rustica and Uncial writing from fourth to sixth centuries, and later Carolingian Minuscule in ninth century.</p>
  - id: 425824
    user: 6470
    date: 2010-08-19T16:20:00
    date_raw: 19 Aug 2010 — 4:20pm
    votes: null
    html: <p>The "two-story" version (example the first) is more consistent with the Carolingian miniscule rendering of the letter a, while the "single-story" version (example the last) is consistent with everyday handwriting, at least as it was practiced under the Palmer method. The middle example extrapolates Palmer penmanship with sans-serif lettering.</p>
