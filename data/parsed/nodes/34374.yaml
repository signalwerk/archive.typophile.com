    <p>Maybe this has been around and many have seen it already, but upon venturing to <a href="http://www.adobe.com/type">Adobe Type</a> for the first time in a while I was enthralled by the demo videos (“type + motion”) on the main page demonstrating how After Effects works with good typography. Some really terrific work being exhibited in the five parts of the series. Now I’m officially inspired to learn After Effects after much procrastination.</p>
