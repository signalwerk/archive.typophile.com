    html: |-
      <p>I’m afraid Don McCahill has turned it around. :) The 5 individual movies were defenitely not created in Flash, but are prime examples of After Effects animation and composition. Also seen in the <a href="http://4.upload.dailymotion.com/video/x1a6sk_intonation">Pulp Fiction quoting movie</a> and <a href="http://www.youtube.com/watch?v=WXxouXt5dz4">The Lions Roar</a>, amongst others. As far as I can tell both 100% AE as well.</p>
      <p>I’m learning After Effects at the moment, and the animated type and 3D-type on Adobe.com are both AE, and it’s not even so difficult to do (though those movies are of quite high level and quality). The 3D-imagery of course is material from other software (e.g. the buildings and such).</p>
