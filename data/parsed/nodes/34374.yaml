    date_raw: 11.Jun.2007 2.14pm
    votes: null
    html: <p>Well, I knew that the whole setup was Flash, but I thought that the 5 individual movies were from After Effects. If they’re not, that’s some shady advertising. But on reflection I think the individual movies are; in each, they show very briefly how to create the effect in After Effects. Even if Flash were completely responsible, my previous statement still stands; I’ve been procrastinating about Flash, too.</p>
