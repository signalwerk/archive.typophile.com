    html: |-
      <p>On Google Fonts here are some safe picks. Not at all a "best of" list. Just some safe and competently made stuff:</p>
      <p>Open Sans<br>
      Roboto<br>
      Droid Sans<br>
      Droid Sans Mono<br>
      Droid Serif<br>
      Open Sans Condensed<br>
      Source Sans Pro<br>
      Roboto Condensed<br>
      Ubuntu<br>
      Ubuntu Condensed<br>
      PT Sans Narrow<br>
      PT Serif</p>
      <p>There are more, certainly.<br>
      Fonts like Cabin and Lobster and Arvo  see an insane amount of usage.  So if you go by the adage "Fifty million Frenchmen can't be wrong", you won't go wrong using those fonts either.<br>
      Since Google fonts are free and easy to incorporate into a page, and they arrive fast, the question of which Google Fonts are on a "professional" level is a good one.<br>
      It would require defining what is "professional level" for a webfont because much of what's being offered commercially isn't up to snuff IMHO, either.</p>
      <p>Here's a link to stats dated 2010:<br>
      <a href="http://www.google.com/fonts/stats?key=WebFonts2010" title="http://www.google.com/fonts/stats?key=WebFonts2010">http://www.google.com/fonts/stats?key=WebFonts2010</a></p>
      <p>Don't know if there's a spreadsheet that's more current.</p>
      <p>rich</p>
