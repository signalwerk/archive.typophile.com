    html: |-
      <p>On the question of the Benton RE font, I see the high end of its size spectrum being less useful than the lower end of its size spectrum, where it's best. I'm glad you think Benton Sans elegant, but I'm not sure 13 px is a place to judge such a trait.</p>
      <p> The width issue comes to a head, i.e. how wide is the regular weight, when the family is committed to a bold that is to render well unhinted down to 9 px. I felt that these bold styles had to be widened from the print versions for the smallest uses, unlike most web bold styles, and the regular must follow or be too narrow. So if you look at the smart screen companion bold face of Whitney, vs Verdana, or any RE fonts at 9-10 px, you see a bold face you might wish was larger and wider. The carpet only moves, it doesn't stretch.</p>
      <p>For the future, we have intermediate plans, but while new low tech solutions are being rattled about, we need to see if these or any better standards will be moving onto the web, allowing more refined optically-sized service of this and other font families.</p>
