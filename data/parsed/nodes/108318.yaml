    html: |-
      <p>This is a HUGE subject and there isn't one answer because webfont rendering depends of multiple things like :</p>
      <p>- Caracteristics of the screen itself (luminosity, contrast and of course resolution)<br>
      - Font-size (small font size increase type rendering issue on low resolution screens)<br>
      - Characters shape specificities (Contrast, Aperture, Counter, x-Height etc.)<br>
      - Quality of hinting / kerning<br>
      - Operating system text-rendering engine (CoreTxt, DirectWrite, GDI+, Cleartype, GDI etc.)<br>
      - Browser text-rendering engine (Webkit, Blink, Gecko etc.)<br>
      (note : some browsers rendering overlay the OS rendering)<br>
      - Custom User preferences (Anti-aliasing options)</p>
      <p>To go deeper, you could take a look to <a href="http://blog.typekit.com/2010/10/05/type-rendering-on-the-web/" rel="nofollow">this serie of blog posts</a> on Typekit. It's a bit old (already 3 years now)  but still interresting !</p>
      <p>So, for body-copy you could try to follow these good practices (there are no rule) :</p>
      <p>- Font-size not to small : 13px +<br>
      - Comfortable line-height : 1.3 +<br>
      - Low-contrast shapes<br>
      - Well hinted/kerned typefaces<br>
      - Line lenght not too long 60 char. max (or so).</p>
      <p>An off course, TEST the rendering in various environments (different OS + Browsers) using either your own material or Virtual Machines (ex. <a href="http://www.parallels.com/fr/" rel="nofollow">Parallel Desktop</a>) or web solutions (ex. <a href="http://www.browserstack.com/" rel="nofollow">Browserstack</a>). I'm also a huge fan of <a href="http://typecast.com/" rel="nofollow">Typecast</a> which is, in my opinion, the best web service available yet, to build layouts and compare webfonts.</p>
      <p>Concerning the choice of Google webfonts I would maybe add <a href="http://www.google.com/fonts/specimen/Roboto" rel="nofollow">Roboto</a> and <a href="http://www.google.com/fonts/specimen/PT+Sans" rel="nofollow">PT Sans</a> to the other one which have been given before.</p>
      <p>I hope it will help you.</p>
      <p>--<br>
      <em>Note: If you can read the french language, I've written <a href="http://www.adverbum.fr/typo--web-foutoyet-aurelien-atelier-perrousseaux_ouvrage-perrousseaux_4kd262gul963.html" rel="nofollow">a book</a> on that subject in 2012.</em></p>
