      <p>Readers don't –or rather shouldn't– consciously select specific fonts to read text in; a great clue to this is one of the few pieces of reliable empirical evidence concerning reading: people choose a size that's a bit too big for comfortable reading. The ideal font selection reinforces the content by "saying" things... without using words. <strong>And that's what a designer is for.</strong> Although I personally place more value on compromising style for readability than Alex seems to, saying that it's OK to throw away style to get some extra readability* is like saying readers don't need designers...</p>
      <p>* And in that case, again: why such long descenders instead of a bigger x-height?</p>
      <p>BTW, 13 pix might seem irrelevant on hi-res screens (but then how is a Bold's 9–10 pix relevant?) but what proportion of serious reading is done on such screens?</p>
      <p>--</p>
      <p>Something else I noticed: if you take away the extra width from the RE, what are you left with? The non-RE... So maybe the extra width helps to sell it (via differentiation). But a better way would've been a larger x-height.</p>
      <p>hhp</p>
