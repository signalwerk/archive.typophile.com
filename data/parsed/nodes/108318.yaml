      <p>Not cranky. Just chronically malcontent.  :-)</p>
      <blockquote><p>Both x and y were increased more or less proportionally</p></blockquote>
      <p>When I looked yesterday I only saw the Y increasing (by very nearly one pixel per glyph). Should I look again?</p>
      <p>Beyond a doubt you've looked at way more small type than I have... but every single small type I've seen has seriously shortened descenders – and in general any text type has descenders shorter than ascenders (for very good reason). The fact that Benton Sans (13 px) has descenders equal to ascenders (both in the regular and the RE) gives it more elegance (which I think makes sense in terms of mood and differentiation, especially in the context of so few pixels) but my point was that the RE's extra width –and the mono "g"– go against that (and I myself would prefer seeing a small* sacrifice in the quality of the Bold, and only at very small sizes).</p>
      <p>* I'm assuming.</p>
      <p>I think the bottom line –and the heart of Alex's complaint– is that Benton Sans RE is looking too much like a "generic" screen font, versus what most designers –who hopefully choose a font based on its mood and not just its readability– expect to be able to convey by bothering to select a specific non-generic (and non-free) typeface.</p>
      <p>hhp</p>
