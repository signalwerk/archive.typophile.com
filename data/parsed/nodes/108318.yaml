      <p>One thing that makes Benton Sans relatively elegant (at least at the size shown) is that the descenders are as long as the ascenders. What's interesting is that making the x-height one pixel taller instead would have gone hand-in-hand with the inflated width (as well as making the "g" monocular). But that was not done – possibly for reasons that are not observable without considering "relativity", as you nicely explain WRT the Bold. I wonder though whether making the Regular uncharacteristically wide is worth having a Bold that comes out better at tiny sizes.</p>
      <p>hhp</p>
