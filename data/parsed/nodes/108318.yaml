      <p>FWIW, every time I saw Whitney used as a body font on web (back when it was only on kottke.org and a couple of other sites), I couldn't help but pause, open the page source and look at what <em>is</em> this remarkably nice font that they are using. It may, technically, look nearly identical to Lucinda grande or Verdana, but it's not. It has an absolutely different and unique feel to it and in the end this is what matters most when picking a font for the online use. Readability is important, no doubt, but it's secondary.</p>
      <p>The issue with the RE version of Benton Sans is that it's so detached from the original in how it looks and feels that it shouldn't even bear the same name. I'm sure it's doing well commercially,  but that's really off the point.</p>
