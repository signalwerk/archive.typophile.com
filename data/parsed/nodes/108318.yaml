    <p>Hey guys.</p>
    <p>I'm amateur on type. I've had some problems with type rendering across browsers, searched all over the web for good articles but still nothing.</p>
    <p>I don't have time to really study and understand font rendering right now, but I need to find what fonts I can use. Fonts that, even if they display differently across browsers, still look good (not creepy).</p>
    <p>1) Can you guys list the fonts you know look good on the popular browsers?<br>
    I mean IE8+, Chrome, Safari, Firefox (including mobile versions).<br>
    → Preferrably Google Web Fonts.</p>
    <p>2) Do you know a website focused on this issue (crossbrowser type)?</p>
    <p>Thanks!!</p>
