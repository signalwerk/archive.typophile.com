    html: |-
      <p>Andrew correctly identified the fonts, but the book was almost certainly set in hot metal. Most US textbooks were set on the Linotype in 1964, when Addison-Wesley published the first edition of the Feynman Lectures. Monotype, another automated hot-metal process, was more widely used in the UK, and was often used in the US for books with tabular matter and complex equations. Photocomposition was not in widespread use for books until the 1970s.<br>
      The title <em>Physics in Motion</em> was probably set by hand in foundry type, which might explain why the two different fonts don't have a common baseline.</p>
