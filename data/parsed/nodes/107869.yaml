      <p>The low resolution of your sample does not give us much to work with, unfortunately.</p>
      <p>My best guess is that the body copy is set in <a class="freelinking external" href="http://www.myfonts.com/search/Times/fonts/" rel="nofollow">Times</a>. It seems slightly more condensed that most modern digital versions, but that could also be a function of the phototypesetting process (optically stretching or slanting type was one of the possibilities with phototypesetting technology).</p>
      <p>The chapter title seems to be <a class="freelinking external" href="http://www.myfonts.com/fonts/linotype/poster-bodoni/bodoni-poster-italic/" rel="nofollow">Bodoni Poster Italic</a>. It is at slightly more of an oblique slant than modern digitals, but still recognizable, and again probably given the additional slant with a phototypesetter.</p>
      <p>The word /in/ between /Atoms/ and /Motion/ is in a different type, looks like an oblique sans, but there is neither sufficient clarity nor diversity of letters here to guess at what that might be.</p>
