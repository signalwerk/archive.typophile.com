    <p></p><div class="imageWrap"><img src="http://typophile.com/files/Feynman Typography_6563.JPG"></div><br>
    I'm trying to find the font used in the Feynman Lectures on Physics, a physics textbook written in the 1960's and published by Addison-Wesley.  Attached is an excerpt from it.  Note that newer editions of the Feynman Lectures, like the New Millenium edition and the recently released free online edition, use completely different fonts.  But I'm trying to find the font of the original book.<br>
    What technology was Addison-Wesley using back in the 1960's to publish books?  Linotype or something?  If the font they were using does not exist for computers, what is the computer font that most closely resembles it?<br>
    Any help would be greatly appreciated.<br>
    Thank You in Advance.<p></p>
