  html: "<p> I have recently seen, featured in an old HOW magazine, excerpts from the identity system used by Murrell Design, the company that was credited with the signage programme of 1996 Atlanta Olympic games. Two issues: do they have a web site [are they still in business?].all search engines returned no results. <br>second story: they use an unusual typographic scheme consisting of Template gothic for body copy and a script typeface [not sure: Bickham ?] for captures and headings. It really looks amazing. Do you have such examples of unusual typographic combinations? <br> <br>thanks <br>george // cellsius creative </p>"
