    date_raw: 3 Sep 2002 — 8:15am
    votes: null
    html: "<p> George, <br>I'm new here also, but people are really nice on this forum, in general. <br>It's extremely difficult to give opinions about how a designer could choose to present her/his onw firm, since its our most personal output. <br> <br>Just a couple of thoughts: of course individual taste matters most, but never forget that you are presenting yourself to your clients. <br>Perhaps some more info from you could help. <br> <br>What kind of design do you intend to focus on? <br>How would you like clients to PERCEIVE your firm? <br>Do you want your typographic choices to suggest \"cuttting edge\" or \"built to last\", just to make an example? <br>Are you planning to have an \"all American\" identity to focus mostly on American clients or are also considering other countries'  tastes? <br> <br>Personally I woudn't base my choice on what other designer choose for their firms, or what do you rate is most used or overused. <br>It's ok to be aware of other people' work, but ultimately, always start from asking yourself what you want your firm and your design to represent, and your choice will come naturally from within. And once you choose: go for it. You will KNOW that it's right, even if you decide on a currently not popular typeface. <br> <br>That said, the connotations your characters will have for other people are what you should always keep in mind, IMHO. <br>So I think you made a wise choice to ask opinions on this forum. Maybe, consider posting some visual examples and ask for feedback. <br>I did it in the magazine design post and people have been extremely helpful and supportive. <br>Also, maybe show some drafts to non-design friends and family, and learn from their reactions. Likely not all your future clients will be design aware. I think the gut reactions our work provokes in other people are always interesting and worth noting. <br>Ciao from Milan. </p>"
