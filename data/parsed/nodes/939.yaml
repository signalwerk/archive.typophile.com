    html: <p> hi everyone, <br>It seems some messages get a lot of answers, some don't. I am quite new here, I don't know what to do to get people's attention. But I am getting back with the question, since I am launching my design agency in a week or so an I am not sure on the corporate font. <br>Three major design consultancies in US ( method, methodologie and liska ) use AkzidentGrotesk LightOsf with an amazing succes ... would it be a good idea to take the travelled way? <br>I guess the only thing I know for fact is that LdG Sans or Mix is overused, Sun is somewhat too narrow for my taste, and I would like the font with enough weights to insure a high degree of contrast and with old style figures. <br> <br>Any ideas? Thanks a lot... <br> <br>george // cellsius design </p>
