    html: |-
      <p>I would give credit to the name of the font that I use, regardless if it is a derivative of another typeface or not. There are usually subtle differences in the cuts that you don’t want to attribute to the wrong font. Then there are more difficult cases of high-quality derivatives that are now just as established as the original typeface (such as Sabon based on Garamond).</p>
      <p>I don't think you’d be guilty of copyright infringement just by giving the wrong font name, but you’d probably do Gill Sans a disservice. If you can’t stand for your chosen font, you’d better not name it at all.</p>
