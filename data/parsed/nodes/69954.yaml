    html: |-
      <dl>
      <dt>As an additional datum, in one of his books Robert Bringhurst formulates it this way:</dt>
      <dd>The text face is Dante, designed by Giovanni Mardersteig.</dd>
      <dd>The titling face is Comenius, designed by Hermann Zapf.</dd>
      </dl>
      <p>The colophon also names the designer, the compositor and the printer, and appears on the verso of the last page of the text, followed by a blank leaf. There is no mention of which cut he used.</p>
