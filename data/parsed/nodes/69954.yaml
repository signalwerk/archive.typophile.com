    html: |-
      <p>In my view, a typographer's greatest debt is to the type designer, with consideration to the type foundry or the rights-holder being only secondary to that.</p>
      <p>If the credit for the typeface is shuffled among the copyright notice and publication data, expediency calls for naming the font with precision and accuracy. For example, <em>Set in Humanist 521,</em> as the case may be.</p>
      <p>If, however, you can afford the luxury of including a colophon (let us call the thing by its name), then you have ample room to give the original name of the face, its designer and history, and, lastly, which foundry released the version used here, and when.</p>
      <p>Your question is not one of legality, but ethics. Which formulation pays the greatest respect to the type designer, without lying to the typophile?</p>
