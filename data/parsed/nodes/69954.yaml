    <p>Hi all,</p>
    <p>I've been wondering about the following. I always like it when the typefaces used in a book are mentioned in the credits. It gives credit to the design and the designer and saves me a lot of Whatthefont sessions ;-) But what if one were to use a typeface that has a different name than the original (I'm thinking for instance about several Bitstream and URW typefaces that had to change the name for copyright purposes). Would you credit it Optus or Optima, Gill Sans or Humanist 521?</p>
