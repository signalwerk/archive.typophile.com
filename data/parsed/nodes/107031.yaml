      <p>Hey joesruddock,</p>
      <p>this is no Futura at all. Those compressed sans serif fonts where quite famous in Germany through the 1900’s till 1930’s. It looks, but my eyes could cheat me, that there a tiny serifs. </p>
      <p>Maybe you have a better view of this?</p>
      <p>Instead you could look at fonts like Wagner Grotesk or even Akzidenz Grotesk Compressed could be a similar choice.</p>
