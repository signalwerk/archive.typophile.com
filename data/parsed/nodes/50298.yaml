    <p>just a few questions on applying Robert Bringhursts principles to an inDesign layout.</p>
    <p>1. in justified text, a reasonable minimum word space is M/5, M/4 is a good average and M/2 is maximum. How do i set this up in inDesign. I've looked all over and stumbled upon justification but the values are set in % rather than ems. How do i convert?</p>
    <p>2. base line grids, yay or nay. I've only just discovered that option after reading about leading, and it seems quite useful. 12pt baseline grid for 9/12 type setting.</p>
    <p>3. what is a good way of achieving an even typographic colour / getting rid of rivers?</p>
    <p>thanks in advance</p>
