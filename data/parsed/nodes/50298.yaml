      <p><cite>3. what is a good way . . . getting rid of rivers?</cite></p>
      <p>Write the text yourself, and re-write when you encounter a problem. Otherwise, you make a different compromise to banish a river. Color is achieved by the design of the piece; the selection of the font, leading, margins, etc.</p>
      <p>You have to remember that Bringhurst is a lecturer/author -- in short, is a teacher &amp; to some extent a reporter, not a practitioner. The word spacing parameters you report seem straight out of Dowding, though Dowding would vary them depending on the typeface. See <cite>Factors in the choice of typefaces</cite>. London: Wace 1957, esp., as I remember, the appendicies.</p>
      <p>As to your first question, the "spaceband" used by InDesign is in the font, not in the machine (applications program). It varies from font to font &amp; is set by the font designer. The percentages specified  in InDesign are percentages of that width.</p>
