      <p><cite>Word spacing can range from min%=75, max%=150 for short columns and min%=90, max%=125 for longer measures. Max% can be set a little higher as open space is less disruptive than crowded text.</cite></p>
      <p>This runs quite counter to what we find.</p>
      <p>Consider Arno, for example. The space character from the foundry has a width of 190 units. By itself, that is 190/1000, or M/5.2 Consider Minion: the space value is 227 units, or M/4.4 Some older fonts have a space value of 250 units, or M/4.</p>
      <p>If you want to follow Bringhurst:</p>
      <p>For Arno, the settings would be: minimum, 105.2%, ideal, 131.5%, and maximun of whatever.</p>
      <p>For Minion, minimum of 88%, ideal of 110%, and maximum of whatever.</p>
      <p>For a font with a 250-unit space, an 80% minimum, 100% ideal.</p>
      <p>But I've found, by testing, that some of these 250-unit space fonts can use a minimum of 70%, and an M/4 value for "ideal" can be too large. It depends on the font, how the letters fit, the characters sidebearings, etc.</p>
      <p>BTW, I say "whatever" because the upper value seems to have no effect, save on what shows "yellow" when you ask to see violations. To test, I set a page of type, &amp; changed the maximum from 133% to 500%. There were no changes in the linebreaks. Perhaps one of the Adobe programmers can reply; unlike TeX, the exact linebreaking algorithm isn't published.</p>
      <p>I know Kent Lew has given his methods for getting the spacing parameters for InDesign &amp; various fonts on some Typophile forum, as have I, &amp; others. A search might be useful.</p>
