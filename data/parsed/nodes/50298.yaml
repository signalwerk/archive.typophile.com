      <p>Let's assume that the default word space in the font is reasonable. Let that be equivalent to M/4. If so, M/5 is 80% of that, and M/2 is 200% of that.</p>
      <p>So Bringhurst's recommendations, applied to InDesign, suggest that 80% minimum and 200% maximum are his preferred defaults, if the base word space is good.</p>
      <p>Cheers,</p>
      <p>T</p>
