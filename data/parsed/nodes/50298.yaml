    html: |-
      <p>Indesign has the awesome ability to flex the spacing as required. You must first set up an acceptable range it can operate within. Word spacing should be adjusted for the line's measure, more spacing for shorter measures. Word spacing can range from min%=75, max%=150 for short columns and  min%=90, max%=125 for longer measures. Max% can be set a little higher as open space is less disruptive than crowded text. This all works In conjunction with letter spacing of 3-5% in both directions. Also consider glyph sizing very slightly (no more than 2%). This will squeeze the letters as needed. I know this sounds wrong, but such small alterations go unnoticed and help even things out. </p>
      <p>On top of all that, use hyphens to further even the color and rid the rivers.</p>
