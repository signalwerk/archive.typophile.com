      <p>Without the Shift in Mark's combo, the adjustment is in increments of your basic unit. With the addition of Shift, it moves in multiples of 5x your basic unit. (Basic unit is set in Preference &gt; Units &amp; Measurements... &gt; Keyboard Increments &gt; Kerning:)</p>
      <p>The Delete combo reduces word spacing only; the Backslash combo increases word spacing. It's like tracking, but only acts on word spaces. You have to highlight a span of text which includes word spaces, not just place the cursor.</p>
      <p>-- K.</p>
