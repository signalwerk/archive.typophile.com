      <p>Thomas, the problem with this is we don't see many fonts wtih an M/4 wordspace anymore (250 units on a 1,000 unit em).</p>
      <p>As I said earlier (can you quote yourself?)</p>
      <p><cite>Consider Arno, for example. The space character from the foundry has a width of 190 units. By itself, that is 190/1000, or M/5.2 Consider Minion: the space value is 227 units, or M/4.4</cite></p>
      <p>So Arno, (190 unit space) at 100% in InDesign is M/5.26. And 80% of that is 152 units, or M/6.8.</p>
      <p>But Arno is a lovely face. I do happen to use different numbers than 80%-100%-133% with it in InDesign, but not 105%-135%-whatever, as the formula would recommend. I can only assume the reason is the general fit of the font allows the tighter spacing.</p>
      <p>For example, while you could cast a bit of a kern with Monotype (but not Linotype), the space between letters such as "W" and "o" had to be optically smaller than a word space, or "People of the World" would read "People of the W old." the prevalence of tighter letterfitting allows smaller word spacing.</p>
      <p>FWIW</p>
