    html: |-
      <p>If you happen to be working with old Postscript Type 1 fonts, then you can open up the AFM file (most were delivered with AFMs) in a text editor. In the first large matrix of values you'll find something like the following:</p>
      <p><em>C 32 ; WX 220 ; N space ; B 0 0 0 0 ;</em></p>
      <p>C = character index; WX = width; N = the name; B # # # # gives the coordinates for the bounding box. In this example, character 32 is named "space" and has a width of 220 units.</p>
      <p>Otherwise, you'd have to use a font editing program to open the font directly.</p>
      <p>Or you can just ask here, I suppose. Hoefler Text Roman has a space of 215. </p>
      <p>Once you have the value in units, you divide by the UPM of the font to get a percent of the em. Most Postscript fonts have a UPM of 1000 units. So 215 units equates with a space that is 0.215 em.</p>
      <p>-- Kent.</p>
