    html: |-
      <p><em>“biologically” seems a lot more “normal” than “determinations” </em></p>
      <p>Yes. I'm trying to reconstruct my design process.<br>
      I think that I was using the variety of stretching to "massage" text blocks to fit the layout, and the variety of stretching, and type styles, served to disguise that "cheating".<br>
      For instance, the really wide drop cap was done to optimize the justification of the first paragraph.<br>
      And the three squared-off items were stretched to fit the space they're in, with nice margins.</p>
      <p><em>...in a very 1989 sort of way...</em></p>
      <p>Yes, it was supposed to look new, advertising a new piece of scientific equipment, and stretched type signified new at the time, the DTP meme. Also the spectroscope itself was long.</p>
