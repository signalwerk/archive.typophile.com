      <p>Squooshing is much more problematic than stretching, which IMO is not an issue.<br>
      In the early days of DTP, I would stretch Adobe Garamond to 150% in Quark (for text), and it looked great. Really!<br>
      Diagonals are the sticking point, so square faces without diagonals may be compressed lots without apparent distortion.<br>
      But no, I haven't designed any faces with squooshability as a parameter.</p>
