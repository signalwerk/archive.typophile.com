      <p>Gosh, indeed! Thank you, Kent. Apologies, I had a quick glance only at the big samples in the right column.<br>
      Although I now see that Sumner Stone himself seems to endorse slanting, it still looks like a mere makeshift to me: Silica might withstand the slanting better than other faces do, but some characterforms (especially ‘a’ and ‘g’) do suffer. Also, it seems to affect the otherwise balanced spacing.</p>
      <p>The slant factor in the specimen seems to be ~10°, with additional condensing (~92%). Stone has also recommended pairing Silica with the Italics of his Magma.<br>
       </p><div class="imageWrap"><img src="http://typophile.com/files/silica_5745.png"></div><p></p>
