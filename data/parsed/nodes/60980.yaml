    <p>I'm looking for a font that withstand a certain amount of squashing or stretching whilst maintaining its integrity. Does anyone know of such a font? I have a hazy memory of some tutor mentioning one once a long time ago but the details escape me. </p>
    <p>p.s. I am looking for a typeface for body text, not headlines...</p>
    <p>Thanks!x</p>
